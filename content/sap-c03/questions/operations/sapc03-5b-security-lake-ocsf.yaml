id: sapc03-5b-security-lake-ocsf
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's security team wants to centralize AWS CloudTrail management events, VPC flow logs, Amazon Route 53 Resolver query logs, and Amazon EKS audit logs from 200 accounts in five Regions. The data must be normalized to the Open Cybersecurity Schema Framework (OCSF), so that two third-party analytics tools can use it without custom parsing. Data residency rules require the data of the three EU Regions to be consolidated in one EU Region. The team wants a managed service and the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'AnyCompany veut centraliser les événements de gestion AWS CloudTrail, les journaux de flux VPC, les journaux de requêtes Amazon Route 53 Resolver et les journaux d'audit Amazon EKS de 200 comptes dans cinq Régions. Les données doivent être normalisées selon l'Open Cybersecurity Schema Framework (OCSF), afin que deux outils d'analyse tiers puissent les utiliser sans analyse syntaxique personnalisée. Des règles de résidence des données exigent que les données des trois Régions de l'UE soient consolidées dans une seule Région de l'UE. L'équipe veut un service géré et le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create log centralization rules that copy the logs to a security account, and run AWS Glue jobs every hour that convert the centralized log groups to OCSF.", fr: "Créer des règles de centralisation des journaux qui copient les journaux vers un compte de sécurité, et exécuter chaque heure des tâches AWS Glue qui convertissent les groupes de journaux centralisés en OCSF." } }
    - { id: b, text: { en: "Enable Amazon Security Lake for the accounts with these four sources, designate an EU rollup Region for the EU Regions, and add the two tools as subscribers.", fr: "Activer Amazon Security Lake pour les comptes avec ces quatre sources, désigner une Région de cumul (rollup) de l'UE pour les Régions de l'UE, et ajouter les deux outils comme abonnés." } }
    - { id: c, text: { en: "Stream every log group to Amazon Data Firehose with subscription filters, and transform each record to OCSF with an AWS Lambda function before delivery to Amazon S3.", fr: "Diffuser chaque groupe de journaux vers Amazon Data Firehose avec des filtres d'abonnement, et transformer chaque enregistrement en OCSF avec une fonction AWS Lambda avant la livraison dans Amazon S3." } }
    - { id: d, text: { en: "Configure CloudWatch cross-account observability in each Region, and give the third-party tools read access to the monitoring accounts through IAM roles.", fr: "Configurer l'observabilité intercompte CloudWatch dans chaque Région, et donner aux outils tiers un accès en lecture aux comptes de surveillance au moyen de rôles IAM." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Security Lake collects CloudTrail events, VPC flow logs, Route 53 Resolver query logs, and EKS audit logs natively, converts them to OCSF in Apache Parquet, and stores them in S3 buckets that the company owns. Rollup Regions consolidate the data of several Regions to help meet data residency requirements, and subscribers get access to the data or query it without post-processing."
    fr: "Amazon Security Lake collecte nativement les événements CloudTrail, les journaux de flux VPC, les journaux de requêtes Route 53 Resolver et les journaux d'audit EKS, les convertit en OCSF au format Apache Parquet et les stocke dans des compartiments S3 qui appartiennent à l'entreprise. Les Régions de cumul consolident les données de plusieurs Régions pour aider à respecter la résidence des données, et les abonnés accèdent aux données ou les interrogent sans post-traitement."
  options:
    a: { en: "Centralization copies CloudWatch Logs data only, and hourly Glue conversion jobs are custom processing that the team would build and operate.", fr: "La centralisation ne copie que des données CloudWatch Logs, et des tâches de conversion Glue horaires sont un traitement personnalisé que l'équipe devrait construire et exploiter." }
    c: { en: "A Lambda transformation to OCSF for every source is custom code to maintain, and the sources that are not in CloudWatch Logs would need their own pipelines.", fr: "Une transformation Lambda vers OCSF pour chaque source est du code personnalisé à maintenir, et les sources absentes de CloudWatch Logs auraient besoin de leurs propres pipelines." }
    d: { en: "Cross-account observability shows data in place in each Region; it neither normalizes the data to OCSF nor consolidates the EU Regions.", fr: "L'observabilité intercompte affiche les données sur place dans chaque Région ; elle ne normalise pas les données en OCSF et ne consolide pas les Régions de l'UE." }
references:
  - title: What is Amazon Security Lake?
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html
