id: sapc03-5a-commands-action
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A team runs a V2 AWS CodePipeline pipeline that deploys a web application. After the deployment stage, the team wants to run three short shell commands: a call to the application's health endpoint and a smoke-test script that is stored in the source artifact. The commands finish in less than 5 minutes. The team doesn't want to create, configure, or maintain a separate AWS CodeBuild project or buildspec file for these commands. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une équipe exploite un pipeline AWS CodePipeline V2 qui déploie une application web. Après l'étape de déploiement, l'équipe veut exécuter trois courtes commandes shell : un appel au point de terminaison d'intégrité de l'application et un script de test de fumée stocké dans l'artefact source. Les commandes se terminent en moins de 5 minutes. L'équipe ne veut ni créer, ni configurer, ni maintenir de projet AWS CodeBuild ou de fichier buildspec distinct pour ces commandes. L'équipe veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add an AWS Lambda invoke action with a function that downloads the source artifact from the artifact bucket and runs the three commands in a subprocess.
        fr: |-
          Ajouter une action d'invocation AWS Lambda avec une fonction qui télécharge l'artefact source depuis le compartiment d'artefacts et exécute les trois commandes dans un sous-processus.
    - id: b
      text:
        en: |-
          Add a CodeBuild action that uses a new build project whose buildspec file contains the three commands, with the source artifact as input.
        fr: |-
          Ajouter une action CodeBuild qui utilise un nouveau projet de génération dont le fichier buildspec contient les trois commandes, avec l'artefact source en entrée.
    - id: c
      text:
        en: |-
          Create an AWS Systems Manager Run Command document that runs the commands on an EC2 instance, and invoke it with an Amazon EventBridge rule when the stage succeeds.
        fr: |-
          Créer un document AWS Systems Manager Run Command qui exécute les commandes sur une instance EC2, et l'invoquer avec une règle Amazon EventBridge lorsque l'étape réussit.
    - id: d
      text:
        en: |-
          Add a Commands action in a new stage after the deployment stage, list the three commands in the action, and give it the source artifact as its input artifact.
        fr: |-
          Ajouter une action Commands dans une nouvelle étape après l'étape de déploiement, lister les trois commandes dans l'action, et lui donner l'artefact source comme artefact d'entrée.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The Commands action, available in V2 pipelines, runs shell commands in a managed compute container with the input artifacts available, without creating or associating a CodeBuild project. The commands are listed directly in the action (single-line commands, up to 55 minutes), which fits a short post-deployment check; the compute is billed as CodeBuild usage.
    fr: |-
      L'action Commands, disponible dans les pipelines V2, exécute des commandes shell dans un conteneur de calcul géré où les artefacts d'entrée sont disponibles, sans créer ni associer de projet CodeBuild. Les commandes sont listées directement dans l'action (commandes sur une ligne, jusqu'à 55 minutes), ce qui convient à une courte vérification après déploiement ; le calcul est facturé comme une utilisation de CodeBuild.
  options:
    a:
      en: |-
        A Lambda function is custom code that must handle the artifact download, the job result reporting to CodePipeline, and a runtime that may lack the needed tools.
      fr: |-
        Une fonction Lambda est du code personnalisé qui doit gérer le téléchargement de l'artefact, la remontée du résultat de la tâche à CodePipeline et un environnement d'exécution qui peut manquer des outils nécessaires.
    b:
      en: |-
        A CodeBuild action works but requires the separate build project and buildspec file that the team wants to avoid.
      fr: |-
        Une action CodeBuild fonctionne mais exige le projet de génération et le fichier buildspec distincts que l'équipe veut éviter.
    c:
      en: |-
        This adds an instance to maintain and runs outside the pipeline, so the pipeline can't fail when the smoke test fails.
      fr: |-
        Cette approche ajoute une instance à maintenir et s'exécute en dehors du pipeline : le pipeline ne peut pas échouer lorsque le test de fumée échoue.
references:
  - title: Commands action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-Commands.html
