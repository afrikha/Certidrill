id: sapc03-5a-parallel-feature-branches
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A team of 20 developers works on branches named feature-<ticket> in a GitHub repository that is connected to AWS CodePipeline through AWS CodeConnections. Each developer wants every push to a branch to deploy that branch to its own AWS CloudFormation stack in a shared development account. Pushes to different branches must not wait for each other. The pipeline is a V2 pipeline defined in an AWS CloudFormation template. The team wants a single pipeline definition for all feature branches and no custom code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une équipe de 20 développeurs travaille sur des branches nommées feature-<ticket> dans un référentiel GitHub connecté à AWS CodePipeline par AWS CodeConnections. Chaque développeur veut que chaque push sur une branche déploie cette branche dans sa propre pile AWS CloudFormation, dans un compte de développement partagé. Les push sur des branches différentes ne doivent pas s'attendre les uns les autres. Le pipeline est un pipeline V2 défini dans un modèle AWS CloudFormation. L'équipe veut une seule définition de pipeline pour toutes les branches de fonctionnalité et aucun code personnalisé.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Set the pipeline execution mode to QUEUED so that the executions of the different branches run one after the other in the order of the pushes.
        fr: |-
          Définir le mode d'exécution du pipeline à QUEUED pour que les exécutions des différentes branches s'enchaînent dans l'ordre des push.
    - id: b
      text:
        en: |-
          Set the execution mode of the V2 pipeline to PARALLEL.
        fr: |-
          Définir le mode d'exécution du pipeline V2 à PARALLEL.
    - id: c
      text:
        en: |-
          Create one V1 pipeline per branch from a Lambda function that runs when a branch is created, and delete the pipeline when the branch is deleted.
        fr: |-
          Créer un pipeline V1 par branche depuis une fonction Lambda exécutée à la création d'une branche, et supprimer le pipeline à la suppression de la branche.
    - id: d
      text:
        en: |-
          Configure an on-failure condition with the Rollback result on the deploy stage so that a failed branch deployment returns to its previous revision.
        fr: |-
          Configurer une condition en cas d'échec avec le résultat Rollback sur l'étape de déploiement pour qu'un déploiement de branche en échec revienne à sa révision précédente.
    - id: e
      text:
        en: |-
          Add a push trigger that filters branches matching feature-*, set a namespace on the source action, and use #{SourceVariables.BranchName} in the stack name of the deploy action.
        fr: |-
          Ajouter un déclencheur push qui filtre les branches correspondant à feature-*, définir un espace de noms sur l'action source, et utiliser #{SourceVariables.BranchName} dans le nom de pile de l'action de déploiement.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      In PARALLEL mode (V2 pipelines), executions run simultaneously and independently, which AWS recommends for feature branches that deploy to targets not shared with others. The push trigger filter starts the pipeline for feature branches only, and the CodeConnections source action outputs the BranchName variable for push triggers, so each branch deploys its own stack name from the same definition.
    fr: |-
      En mode PARALLEL (pipelines V2), les exécutions s'exécutent simultanément et indépendamment, ce qu'AWS recommande pour des branches de fonctionnalité qui déploient vers des cibles non partagées. Le filtre du déclencheur push ne démarre le pipeline que pour les branches de fonctionnalité, et l'action source CodeConnections produit la variable BranchName pour les déclencheurs push : chaque branche déploie son propre nom de pile à partir de la même définition.
  options:
    a:
      en: |-
        QUEUED makes executions wait for each other at every stage, which the developers want to avoid.
      fr: |-
        QUEUED fait attendre les exécutions les unes les autres à chaque étape, ce que les développeurs veulent éviter.
    c:
      en: |-
        One pipeline per branch, created by a function, is custom code and many pipeline definitions instead of one.
      fr: |-
        Un pipeline par branche, créé par une fonction, c'est du code personnalisé et de nombreuses définitions de pipeline au lieu d'une seule.
    d:
      en: |-
        Failure conditions with a Rollback result can't be added to a PARALLEL mode pipeline, and rollback isn't one of the requirements.
      fr: |-
        Les conditions d'échec avec un résultat Rollback ne peuvent pas être ajoutées à un pipeline en mode PARALLEL, et la restauration ne fait pas partie des exigences.
references:
  - title: How pipeline executions work - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works.html
  - title: Variables reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/reference-variables.html
