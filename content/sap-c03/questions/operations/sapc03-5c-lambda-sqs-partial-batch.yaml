id: sapc03-5c-lambda-sqs-partial-batch
objective: "5.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company processes order events from an Amazon SQS standard queue with an AWS Lambda function that uses an event source mapping with a batch size of 10. When one message in a batch fails, the function raises an exception, the whole batch becomes visible again, and the 9 messages that were processed successfully are processed again, which creates duplicate shipments. Some malformed messages fail every time and are retried until they expire from the queue. The company wants only the failed messages of a batch to be retried, and wants a message that has failed 5 times to be moved aside for analysis. The company must keep the batch size of 10 for throughput.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de commerce en ligne traite des événements de commande d'une file d'attente standard Amazon SQS avec une fonction AWS Lambda qui utilise un mappage de source d'événements avec une taille de lot de 10. Quand un message d'un lot échoue, la fonction lève une exception, tout le lot redevient visible, et les 9 messages traités avec succès sont traités à nouveau, ce qui crée des expéditions en double. Certains messages mal formés échouent à chaque fois et sont réessayés jusqu'à leur expiration dans la file. L'entreprise veut que seuls les messages en échec d'un lot soient réessayés, et qu'un message qui a échoué 5 fois soit mis de côté pour analyse. L'entreprise doit conserver la taille de lot de 10 pour le débit.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on BisectBatchOnFunctionError on the event source mapping so that Lambda splits failing batches until it isolates the failed message.
        fr: |-
          Activer BisectBatchOnFunctionError sur le mappage de source d'événements afin que Lambda divise les lots en échec jusqu'à isoler le message en échec.
    - id: b
      text:
        en: |-
          Add ReportBatchItemFailures to the mapping's function response types, and have the function return the failed message IDs in batchItemFailures.
        fr: |-
          Ajouter ReportBatchItemFailures aux types de réponse de fonction du mappage, et faire renvoyer par la fonction les ID des messages en échec dans batchItemFailures.
    - id: c
      text:
        en: |-
          Set MaximumRetryAttempts to 5 on the event source mapping, and add an on-failure destination that is an Amazon SQS queue.
        fr: |-
          Définir MaximumRetryAttempts sur 5 sur le mappage de source d'événements, et ajouter une destination en cas d'échec de type file d'attente Amazon SQS.
    - id: d
      text:
        en: |-
          Configure the function's asynchronous invocation settings with an on-failure destination that receives events that fail 5 times.
        fr: |-
          Configurer les paramètres d'invocation asynchrone de la fonction avec une destination en cas d'échec qui reçoit les événements qui échouent 5 fois.
    - id: e
      text:
        en: |-
          Configure a redrive policy on the source queue with a maxReceiveCount of 5 and a dead-letter queue that the team uses for analysis.
        fr: |-
          Configurer sur la file source une politique de redirection avec un maxReceiveCount de 5 et une file d'attente de lettres mortes que l'équipe utilise pour l'analyse.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      With ReportBatchItemFailures, the function returns the IDs of failed messages, and only those become visible again; without it, any exception makes the whole batch visible again, including successful messages. The redrive policy on the queue moves a message to the dead-letter queue after it has been received maxReceiveCount times without being deleted.
    fr: |-
      Avec ReportBatchItemFailures, la fonction renvoie les ID des messages en échec, et seuls ceux-ci redeviennent visibles ; sans ce paramètre, toute exception rend tout le lot à nouveau visible, messages réussis compris. La politique de redirection de la file déplace un message vers la file de lettres mortes après qu'il a été reçu maxReceiveCount fois sans être supprimé.
  options:
    a:
      en: |-
        Batch bisection is a setting for Kinesis and DynamoDB Streams event source mappings, not for SQS.
      fr: |-
        La division des lots est un paramètre des mappages de source d'événements Kinesis et DynamoDB Streams, pas de SQS.
    c:
      en: |-
        Maximum retry attempts and on-failure destinations of event source mappings apply to stream sources; for SQS, retries are controlled by the queue's visibility timeout and redrive policy.
      fr: |-
        Le nombre maximal de nouvelles tentatives et les destinations en cas d'échec des mappages de source d'événements s'appliquent aux sources de flux ; pour SQS, les nouvelles tentatives dépendent du délai de visibilité et de la politique de redirection de la file.
    d:
      en: |-
        Asynchronous invocation settings apply to asynchronous invocations, not to the synchronous invocations that an SQS event source mapping makes.
      fr: |-
        Les paramètres d'invocation asynchrone s'appliquent aux invocations asynchrones, pas aux invocations synchrones effectuées par un mappage de source d'événements SQS.
references:
  - title: "Handling errors for an SQS event source in Lambda - AWS Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html
