id: sapc03-5b-guardrail-output-pii
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's assistant applies an Amazon Bedrock guardrail with denied topics on user input and a sensitive information filter on model output. Denied-topic interventions on input are frequent and expected, because users often ask for investment advice. The security team wants to be alerted when the guardrail starts masking or blocking sensitive information in model outputs more often than usual, which could mean that the knowledge base contains customer data. The alert must not fire because of the expected input interventions.

    Which solution will meet these requirements?
  fr: |
    L'assistant d'une banque applique une barrière de protection Amazon Bedrock avec des sujets refusés sur les entrées des utilisateurs et un filtre d'informations sensibles sur les sorties du modèle. Les interventions sur les sujets refusés en entrée sont fréquentes et attendues, car les utilisateurs demandent souvent des conseils en investissement. L'équipe de sécurité veut être alertée quand la barrière de protection se met à masquer ou bloquer plus souvent que d'habitude des informations sensibles dans les sorties du modèle, ce qui pourrait signifier que la base de connaissances contient des données de clients. L'alerte ne doit pas se déclencher à cause des interventions attendues en entrée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Alarm on InvocationsIntervened in AWS/Bedrock/Guardrails for the guardrail, with the SensitiveInformationPolicy policy type and the Output content source as dimensions.", fr: "Définir une alarme sur InvocationsIntervened dans AWS/Bedrock/Guardrails pour la barrière de protection, avec le type de politique SensitiveInformationPolicy et la source de contenu Output comme dimensions." } }
    - { id: b, text: { en: "Alarm on Invocations in AWS/Bedrock/Guardrails for the guardrail, with the SensitiveInformationPolicy policy type as a dimension, so that only filtered requests are counted.", fr: "Définir une alarme sur Invocations dans AWS/Bedrock/Guardrails pour la barrière de protection, avec le type de politique SensitiveInformationPolicy comme dimension, afin de ne compter que les requêtes filtrées." } }
    - { id: c, text: { en: "Alarm on InvocationsIntervened in AWS/Bedrock/Guardrails for the guardrail ARN and version only, with a threshold above the usual number of input interventions.", fr: "Définir une alarme sur InvocationsIntervened dans AWS/Bedrock/Guardrails pour l'ARN et la version de la barrière seulement, avec un seuil supérieur au nombre habituel d'interventions en entrée." } }
    - { id: d, text: { en: "Alarm on InvocationClientErrors in AWS/Bedrock for the model ID, because requests whose output the guardrail masks are reported as client errors.", fr: "Définir une alarme sur InvocationClientErrors dans AWS/Bedrock pour l'ID de modèle, car les requêtes dont la barrière masque la sortie sont comptées comme erreurs client." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Guardrail metrics are published in the AWS/Bedrock/Guardrails namespace, and InvocationsIntervened counts the invocations in which the guardrail intervened. Its GuardrailPolicyType dimension separates the sensitive information filter from the denied topics, and GuardrailContentSource separates outputs from inputs, so the alarm tracks only output interventions of the sensitive information policy."
    fr: "Les métriques des barrières de protection sont publiées dans l'espace de noms AWS/Bedrock/Guardrails, et InvocationsIntervened compte les appels dans lesquels la barrière est intervenue. Sa dimension GuardrailPolicyType distingue le filtre d'informations sensibles des sujets refusés, et GuardrailContentSource distingue les sorties des entrées : l'alarme ne suit que les interventions en sortie de la politique d'informations sensibles."
  options:
    b: { en: "The GuardrailPolicyType dimension applies only to InvocationsIntervened and TextUnitCount, and Invocations counts all requests, not those that were filtered.", fr: "La dimension GuardrailPolicyType ne s'applique qu'à InvocationsIntervened et TextUnitCount, et Invocations compte toutes les requêtes, pas celles qui ont été filtrées." }
    c: { en: "Without the policy type and content source dimensions, the frequent denied-topic interventions on input dominate the metric and mask a rise in output interventions.", fr: "Sans les dimensions de type de politique et de source de contenu, les nombreuses interventions sur les sujets refusés en entrée dominent la métrique et masquent une hausse des interventions en sortie." }
    d: { en: "A guardrail intervention is not a client error of the model invocation, so this metric does not count masked or blocked outputs.", fr: "Une intervention de barrière de protection n'est pas une erreur client de l'appel du modèle : cette métrique ne compte pas les sorties masquées ou bloquées." }
references:
  - title: Monitor Amazon Bedrock Guardrails using CloudWatch metrics
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-guardrails-cw-metrics.html
