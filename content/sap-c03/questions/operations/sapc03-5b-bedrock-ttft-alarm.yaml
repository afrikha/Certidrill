id: sapc03-5b-bedrock-ttft-alarm
objective: "5.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's customer-facing chat assistant streams answers from a foundation model in Amazon Bedrock with the ConverseStream API. Users complain that the assistant sometimes seems frozen before any text appears, even on days when the average of the InvocationLatency metric looks normal. Answers vary from a few words to several paragraphs, which makes the total latency of each request noisy. The team wants an alarm that reflects how long users wait before the first words of an answer appear.

    Which solution will meet these requirements?
  fr: |
    L'assistant conversationnel client d'AnyCompany diffuse en continu les réponses d'un modèle de fondation Amazon Bedrock avec l'API ConverseStream. Les utilisateurs se plaignent que l'assistant semble parfois figé avant qu'un texte n'apparaisse, même les jours où la moyenne de la métrique InvocationLatency semble normale. Les réponses vont de quelques mots à plusieurs paragraphes, ce qui rend bruitée la latence totale de chaque requête. L'équipe veut une alarme qui reflète le temps d'attente des utilisateurs avant l'apparition des premiers mots d'une réponse.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an alarm on the p90 of the InvocationLatency metric for the model ID, with a threshold that is lower than the current average latency.", fr: "Créer une alarme sur le p90 de la métrique InvocationLatency pour l'ID de modèle, avec un seuil inférieur à la latence moyenne actuelle." } }
    - { id: b, text: { en: "Create an alarm on the OutputTokenCount metric for the model ID, so that the long answers that make users wait are detected.", fr: "Créer une alarme sur la métrique OutputTokenCount pour l'ID de modèle, afin de détecter les longues réponses qui font attendre les utilisateurs." } }
    - { id: c, text: { en: "Create an alarm on the p90 of the TimeToFirstToken metric for the model ID, with a threshold that matches the wait that users accept.", fr: "Créer une alarme sur le p90 de la métrique TimeToFirstToken pour l'ID de modèle, avec un seuil correspondant à l'attente acceptée par les utilisateurs." } }
    - { id: d, text: { en: "Create an alarm on the InvocationThrottles metric for the model ID, so that the throttled requests that delay the first words are detected.", fr: "Créer une alarme sur la métrique InvocationThrottles pour l'ID de modèle, afin de détecter les requêtes limitées qui retardent les premiers mots." } }
answer: { optionId: c }
explanation:
  correct:
    en: "TimeToFirstToken measures, in milliseconds, the time from when a request is sent to when the first token is received, for ConverseStream and InvokeModelWithResponseStream. It is independent of answer length, so a percentile alarm on it reflects the wait that users notice."
    fr: "TimeToFirstToken mesure, en millisecondes, le temps entre l'envoi d'une requête et la réception du premier jeton, pour ConverseStream et InvokeModelWithResponseStream. Elle ne dépend pas de la longueur de la réponse : une alarme sur un centile de cette métrique reflète l'attente que perçoivent les utilisateurs."
  options:
    a: { en: "InvocationLatency runs until the last token is received, so it grows with answer length and does not isolate the wait before the first words.", fr: "InvocationLatency court jusqu'à la réception du dernier jeton : elle augmente avec la longueur de la réponse et n'isole pas l'attente avant les premiers mots." }
    b: { en: "Token counts measure answer length, not how long users wait before text starts to stream.", fr: "Le nombre de jetons mesure la longueur des réponses, pas l'attente des utilisateurs avant que le texte ne commence à s'afficher." }
    d: { en: "Throttled requests are rejected rather than slow, and they are only one possible cause; this alarm does not measure the time to the first token.", fr: "Les requêtes limitées sont rejetées plutôt que lentes, et elles ne sont qu'une cause possible ; cette alarme ne mesure pas le temps jusqu'au premier jeton." }
references:
  - title: Monitor bedrock-runtime inference using CloudWatch metrics
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/monitoring-runtime-metrics.html
