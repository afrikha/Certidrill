id: sapc03-5a-queued-execution
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company's V1 AWS CodePipeline pipeline deploys every merged commit of its ledger service through build, integration test, and production stages. The integration test stage takes 40 minutes, and developers merge up to 15 commits a day. A regulator requires that every merged commit be deployed to production and tested, in the order it was merged, with an execution record for each commit. The team noticed that some commits never reach production when several commits are merged during one integration test run. Production deployments must never run at the same time.

    Which solution will meet these requirements?
  fr: |
    Le pipeline AWS CodePipeline V1 d'une entreprise de paiements déploie chaque commit fusionné de son service de registre comptable à travers des étapes de génération, de test d'intégration et de production. L'étape de test d'intégration dure 40 minutes, et les développeurs fusionnent jusqu'à 15 commits par jour. Un régulateur exige que chaque commit fusionné soit déployé en production et testé, dans l'ordre de sa fusion, avec un enregistrement d'exécution pour chaque commit. L'équipe a remarqué que certains commits n'atteignent jamais la production lorsque plusieurs commits sont fusionnés pendant un même test d'intégration. Les déploiements en production ne doivent jamais s'exécuter en même temps.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Convert the pipeline to the V2 type and set its execution mode to QUEUED, so that waiting executions form a queue at each locked stage instead of being superseded.
        fr: |-
          Convertir le pipeline en type V2 et définir son mode d'exécution à QUEUED, pour que les exécutions en attente forment une file à chaque étape verrouillée au lieu d'être remplacées.
    - id: b
      text:
        en: |-
          Convert the pipeline to the V2 type and set its execution mode to PARALLEL, so that every merged commit runs its own execution without waiting for the others.
        fr: |-
          Convertir le pipeline en type V2 et définir son mode d'exécution à PARALLEL, pour que chaque commit fusionné exécute sa propre exécution sans attendre les autres.
    - id: c
      text:
        en: |-
          Keep the SUPERSEDED execution mode, and add a manual approval action before the production stage so that an engineer confirms each commit before it is deployed to production.
        fr: |-
          Conserver le mode d'exécution SUPERSEDED, et ajouter une action d'approbation manuelle avant l'étape de production pour qu'un ingénieur confirme chaque commit avant son déploiement en production.
    - id: d
      text:
        en: |-
          Disable the transition into the production stage, and have a scheduled Lambda function enable it each time the previous execution completes.
        fr: |-
          Désactiver la transition vers l'étape de production, et faire activer cette transition par une fonction Lambda planifiée chaque fois que l'exécution précédente se termine.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      In the default SUPERSEDED mode, a newer execution overtakes one that waits at a locked stage, so intermediate commits are dropped. In QUEUED mode, which requires a V2 pipeline, stages still process one execution at a time, but waiting executions queue in arrival order and none is superseded, so every commit reaches production in order without concurrent deployments.
    fr: |-
      Dans le mode par défaut SUPERSEDED, une exécution plus récente dépasse celle qui attend devant une étape verrouillée : des commits intermédiaires sont abandonnés. En mode QUEUED, qui exige un pipeline V2, les étapes traitent toujours une exécution à la fois, mais les exécutions en attente se mettent en file dans l'ordre d'arrivée et aucune n'est remplacée : chaque commit atteint la production dans l'ordre, sans déploiements simultanés.
  options:
    b:
      en: |-
        PARALLEL executions run simultaneously and independently, so production deployments would overlap and wouldn't follow the merge order.
      fr: |-
        Les exécutions PARALLEL s'exécutent simultanément et indépendamment : les déploiements en production se chevaucheraient et ne suivraient pas l'ordre des fusions.
    c:
      en: |-
        An approval doesn't change the execution mode; while it waits, newer executions still supersede the ones waiting in front of the stage.
      fr: |-
        Une approbation ne change pas le mode d'exécution ; pendant qu'elle attend, des exécutions plus récentes remplacent toujours celles qui attendent devant l'étape.
    d:
      en: |-
        Executions that wait at a disabled transition are still superseded by newer ones, and the Lambda function is custom code.
      fr: |-
        Les exécutions qui attendent devant une transition désactivée sont toujours remplacées par de plus récentes, et la fonction Lambda est du code personnalisé.
references:
  - title: How pipeline executions work - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/concepts-how-it-works.html
