id: sapc03-5b-otel-standard-instrumentation
objective: "5.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 30 development teams that run microservices in Java, Python, and .NET across 12 AWS accounts. Some teams instrument their code with the AWS X-Ray SDK, others with a third-party vendor agent, and some send no traces at all. The platform team wants one standard for metrics, logs, and traces that is vendor-neutral, supported by AWS, and lets the company change backends later without re-instrumenting the code. Traces must still appear in AWS X-Ray and Amazon CloudWatch.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 30 équipes de développement qui exécutent des microservices en Java, Python et .NET dans 12 comptes AWS. Certaines équipes instrumentent leur code avec le SDK AWS X-Ray, d'autres avec l'agent d'un éditeur tiers, et certaines n'envoient aucune trace. L'équipe plateforme veut une norme unique pour les métriques, les journaux et les traces, neutre vis-à-vis des éditeurs, prise en charge par AWS, et qui permette de changer de backend plus tard sans réinstrumenter le code. Les traces doivent toujours apparaître dans AWS X-Ray et Amazon CloudWatch.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Require every team to adopt the AWS X-Ray SDK for its language, and to run the X-Ray daemon next to each service to send segments to X-Ray.", fr: "Exiger que chaque équipe adopte le SDK AWS X-Ray de son langage et exécute le démon X-Ray à côté de chaque service pour envoyer les segments à X-Ray." } }
    - { id: b, text: { en: "Standardize on OpenTelemetry with AWS Distro for OpenTelemetry instrumentation, and send the OTLP data to the CloudWatch agent or to an OpenTelemetry Collector.", fr: "Normaliser sur OpenTelemetry avec l'instrumentation AWS Distro for OpenTelemetry, et envoyer les données OTLP à l'agent CloudWatch ou à un OpenTelemetry Collector." } }
    - { id: c, text: { en: "Standardize on the third-party vendor agent for all teams, and configure the vendor platform to forward a copy of all traces to the X-Ray API.", fr: "Normaliser sur l'agent de l'éditeur tiers pour toutes les équipes, et configurer la plateforme de l'éditeur pour transférer une copie de toutes les traces vers l'API X-Ray." } }
    - { id: d, text: { en: "Require every team to publish custom metrics with the PutMetricData API and to write a correlation ID in every log line instead of collecting traces.", fr: "Exiger que chaque équipe publie des métriques personnalisées avec l'API PutMetricData et écrive un ID de corrélation dans chaque ligne de journal au lieu de collecter des traces." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS recommends OpenTelemetry for new and existing applications: OpenTelemetry SDKs or ADOT instrumentation in the code, and the CloudWatch agent or an OpenTelemetry Collector to collect and export the data to X-Ray and CloudWatch. Because OpenTelemetry is a vendor-neutral standard, the backend can change later without touching the instrumentation."
    fr: "AWS recommande OpenTelemetry pour les applications nouvelles et existantes : les SDK OpenTelemetry ou l'instrumentation ADOT dans le code, et l'agent CloudWatch ou un OpenTelemetry Collector pour collecter et exporter les données vers X-Ray et CloudWatch. Comme OpenTelemetry est une norme neutre vis-à-vis des éditeurs, le backend peut changer plus tard sans toucher à l'instrumentation."
  options:
    a: { en: "The X-Ray SDKs and daemon entered maintenance mode on February 25, 2026, with security fixes only, and they tie the instrumentation to X-Ray.", fr: "Les SDK et le démon X-Ray sont passés en mode maintenance le 25 février 2026, avec uniquement des correctifs de sécurité, et ils lient l'instrumentation à X-Ray." }
    c: { en: "A proprietary agent is the opposite of a vendor-neutral standard: changing backends later would require re-instrumenting every service.", fr: "Un agent propriétaire est l'inverse d'une norme neutre : changer de backend plus tard imposerait de réinstrumenter chaque service." }
    d: { en: "Metrics and correlated logs do not provide distributed traces, which must still appear in X-Ray.", fr: "Des métriques et des journaux corrélés ne fournissent pas de traces distribuées, qui doivent toujours apparaître dans X-Ray." }
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
  - title: Instrumenting your application for AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-instrumenting-your-app.html
