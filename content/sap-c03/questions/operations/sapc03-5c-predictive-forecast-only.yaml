id: sapc03-5c-predictive-forecast-only
objective: "5.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A university runs its learning platform on Amazon EC2 instances in an Auto Scaling group with a target tracking policy on average CPU utilization. Instances need about 9 minutes to initialize, and students see errors during the first minutes of each morning peak. The operations team believes that the load follows a weekly timetable but has never verified it, and the change advisory board will approve proactive scaling only after two weeks of evidence that forecasts match the actual load. During those two weeks, the group's capacity must not be affected by the evaluation. After approval, the team wants capacity to be launched ahead of the peaks with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une université exploite sa plateforme d'apprentissage sur des instances Amazon EC2 dans un groupe Auto Scaling doté d'une politique de suivi de cible sur l'utilisation moyenne du processeur. Les instances ont besoin d'environ 9 minutes pour s'initialiser, et les étudiants rencontrent des erreurs pendant les premières minutes de chaque pic matinal. L'équipe d'exploitation pense que la charge suit un emploi du temps hebdomadaire, mais ne l'a jamais vérifié, et le comité consultatif des changements n'approuvera une mise à l'échelle proactive qu'après deux semaines de preuves que les prévisions correspondent à la charge réelle. Pendant ces deux semaines, la capacité du groupe ne doit pas être affectée par l'évaluation. Après approbation, l'équipe veut que la capacité soit lancée avant les pics avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create scheduled actions for the expected peaks from the timetable, and compare the CPU utilization of the following two weeks with the previous two weeks before keeping them.
        fr: |-
          Créer des actions planifiées pour les pics attendus d'après l'emploi du temps, et comparer l'utilisation du processeur des deux semaines suivantes à celle des deux semaines précédentes avant de les conserver.
    - id: b
      text:
        en: |-
          Create a predictive scaling policy in forecast and scale mode with the group's maximum capacity set to its current desired capacity, so that the forecasts can't add instances during the evaluation.
        fr: |-
          Créer une politique de mise à l'échelle prédictive en mode prévision et mise à l'échelle, avec la capacité maximale du groupe définie sur sa capacité souhaitée actuelle, afin que les prévisions ne puissent pas ajouter d'instances pendant l'évaluation.
    - id: c
      text:
        en: |-
          Create a predictive scaling policy in forecast only mode, compare its forecasts with the actual load for two weeks, then switch it to forecast and scale and keep target tracking.
        fr: |-
          Créer une politique de mise à l'échelle prédictive en mode prévision uniquement, comparer ses prévisions à la charge réelle pendant deux semaines, puis la faire passer en mode prévision et mise à l'échelle et conserver le suivi de cible.
    - id: d
      text:
        en: |-
          Use AWS Compute Optimizer recommendations for the group for two weeks to validate the load pattern, then replace the target tracking policy with a predictive scaling policy.
        fr: |-
          Utiliser pendant deux semaines les recommandations d'AWS Compute Optimizer pour le groupe afin de valider le profil de charge, puis remplacer la politique de suivi de cible par une politique de mise à l'échelle prédictive.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Forecast only mode generates hourly forecasts for the next 48 hours without scaling the group, so the team can compare them with actual load before approving. Forecast and scale then launches capacity ahead of the predicted load; predictive scaling never scales in, so the target tracking policy is kept to remove capacity and handle unforecast changes.
    fr: |-
      Le mode prévision uniquement génère des prévisions horaires pour les 48 heures suivantes sans mettre le groupe à l'échelle : l'équipe peut les comparer à la charge réelle avant approbation. Le mode prévision et mise à l'échelle lance ensuite la capacité avant la charge prévue ; la mise à l'échelle prédictive ne réduit jamais la capacité, si bien que la politique de suivi de cible est conservée pour retirer de la capacité et gérer les variations non prévues.
  options:
    a:
      en: |-
        Scheduled actions change the group's capacity during the evaluation, and fixed schedules need manual updates as the timetable changes.
      fr: |-
        Les actions planifiées modifient la capacité du groupe pendant l'évaluation, et des planifications fixes doivent être mises à jour manuellement quand l'emploi du temps change.
    b:
      en: |-
        Lowering the maximum capacity affects the group during the evaluation, because target tracking can no longer scale out above it either.
      fr: |-
        Abaisser la capacité maximale affecte le groupe pendant l'évaluation, car le suivi de cible ne peut plus non plus dépasser cette valeur.
    d:
      en: |-
        Compute Optimizer recommends instance types and sizes, not load forecasts, and removing target tracking leaves the group unable to scale in.
      fr: |-
        Compute Optimizer recommande des types et des tailles d'instances, pas des prévisions de charge, et supprimer le suivi de cible empêche le groupe de réduire sa capacité.
references:
