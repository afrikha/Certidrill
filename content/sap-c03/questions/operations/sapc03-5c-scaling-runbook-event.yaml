id: sapc03-5c-scaling-runbook-event
objective: "5.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Before each quarterly sales event, the operations team of an online retailer manually raises the minimum capacity of the web tier's Auto Scaling group from 20 to 120, waits until the instances are in service, and lowers the minimum again after the event. Last quarter, an engineer typed a wrong value, and another forgot to lower the minimum, which cost three days of unneeded capacity. The company wants a repeatable procedure that requires a manager's approval before the capacity changes, waits until the group reports the new capacity, and lowers the minimum automatically at the event's end time. The company wants managed Systems Manager features and no custom code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Avant chaque événement commercial trimestriel, l'équipe d'exploitation d'un détaillant en ligne relève manuellement la capacité minimale du groupe Auto Scaling du niveau web de 20 à 120, attend que les instances soient en service, puis abaisse à nouveau le minimum après l'événement. Le trimestre dernier, un ingénieur a saisi une mauvaise valeur, et un autre a oublié d'abaisser le minimum, ce qui a coûté trois jours de capacité inutile. L'entreprise veut une procédure reproductible qui exige l'approbation d'un responsable avant la modification de capacité, attend que le groupe signale la nouvelle capacité, et abaisse le minimum automatiquement à l'heure de fin de l'événement. L'entreprise veut des fonctionnalités gérées de Systems Manager et aucun code personnalisé.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a custom Automation runbook with aws:approve, aws:executeAwsApi to call UpdateAutoScalingGroup, and aws:waitForAwsResourceProperty steps.
        fr: |-
          Créer un runbook Automation personnalisé avec des étapes aws:approve, aws:executeAwsApi pour appeler UpdateAutoScalingGroup, et aws:waitForAwsResourceProperty.
    - id: b
      text:
        en: |-
          Create a Change Manager change template for the event that requires a manager's approval before it runs the capacity change runbook.
        fr: |-
          Créer pour l'événement un modèle de changement Change Manager qui exige l'approbation d'un responsable avant d'exécuter le runbook de modification de capacité.
    - id: c
      text:
        en: |-
          Register a runbook that lowers the minimum capacity as an Automation task in a one-time Systems Manager maintenance window that starts at the event's end time.
        fr: |-
          Enregistrer un runbook qui abaisse la capacité minimale comme tâche Automation dans une fenêtre de maintenance Systems Manager ponctuelle qui démarre à l'heure de fin de l'événement.
    - id: d
      text:
        en: |-
          Create two Auto Scaling scheduled actions, one that raises the minimum capacity before the event and one that lowers it at the end.
        fr: |-
          Créer deux actions planifiées Auto Scaling, l'une qui relève la capacité minimale avant l'événement et l'autre qui l'abaisse à la fin.
    - id: e
      text:
        en: |-
          Create an AWS Step Functions workflow with a Lambda function that calls UpdateAutoScalingGroup and a Wait state until the event's end time.
        fr: |-
          Créer un flux de travail AWS Step Functions avec une fonction Lambda qui appelle UpdateAutoScalingGroup et un état Wait jusqu'à l'heure de fin de l'événement.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      A custom Automation runbook pauses at aws:approve until the required approvers respond, changes the group with aws:executeAwsApi, and waits with aws:waitForAwsResourceProperty until the group reports the expected capacity, with no code. Maintenance windows accept one-time at expressions and Automation tasks, so the revert runbook runs at the event's end time without anyone remembering it.
    fr: |-
      Un runbook Automation personnalisé s'interrompt à l'étape aws:approve jusqu'à la réponse des approbateurs requis, modifie le groupe avec aws:executeAwsApi et attend avec aws:waitForAwsResourceProperty que le groupe signale la capacité attendue, sans code. Les fenêtres de maintenance acceptent des expressions at ponctuelles et des tâches Automation : le runbook de retour arrière s'exécute à l'heure de fin de l'événement sans que personne ait à s'en souvenir.
  options:
    b:
      en: |-
        Change Manager is no longer open to new customers since November 7, 2025, so it can't be part of a new design.
      fr: |-
        Change Manager n'est plus ouvert aux nouveaux clients depuis le 7 novembre 2025 : il ne peut pas faire partie d'une nouvelle conception.
    d:
      en: |-
        Scheduled actions change the capacity without any approval step and don't wait for or confirm the new capacity.
      fr: |-
        Les actions planifiées modifient la capacité sans étape d'approbation et n'attendent ni ne confirment la nouvelle capacité.
    e:
      en: |-
        A Lambda function is custom code, and the workflow has no manager approval step.
      fr: |-
        Une fonction Lambda est du code personnalisé, et le flux de travail n'a pas d'étape d'approbation par un responsable.
references:
  - title: "Choosing between State Manager and Maintenance Windows - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-vs-maintenance-windows.html
