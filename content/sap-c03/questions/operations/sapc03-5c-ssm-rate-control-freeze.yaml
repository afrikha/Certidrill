id: sapc03-5c-ssm-rate-control-freeze
objective: "5.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retailer uses a custom AWS Systems Manager Automation runbook to restart the application service on its 3,000 Amazon EC2 instances that carry the tag App=checkout, in one account and Region. Last year, an engineer started the runbook on all instances at once, and checkout was unavailable for 20 minutes. The company now requires that no more than 5 percent of the instances run the runbook at the same time, that the rollout stops sending the runbook to new instances when more than 2 percent of the executions fail, and that the runbook can't run during the year-end change freeze, which the change management team maintains as calendar events. The company is new to Systems Manager and wants the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un détaillant utilise un runbook AWS Systems Manager Automation personnalisé pour redémarrer le service applicatif de ses 3 000 instances Amazon EC2 portant la balise App=checkout, dans un seul compte et une seule Région. L'an dernier, un ingénieur a lancé le runbook sur toutes les instances à la fois, et le paiement a été indisponible pendant 20 minutes. L'entreprise exige désormais que pas plus de 5 % des instances exécutent le runbook en même temps, que le déploiement cesse d'envoyer le runbook à de nouvelles instances quand plus de 2 % des exécutions échouent, et que le runbook ne puisse pas s'exécuter pendant le gel des changements de fin d'année, que l'équipe de gestion des changements tient à jour sous forme d'événements de calendrier. L'entreprise découvre Systems Manager et veut le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a Change Manager change template that requires an approval for the runbook, and have the change management team reject requests during the freeze.
        fr: |-
          Créer un modèle de changement Change Manager qui exige une approbation pour le runbook, et faire rejeter les demandes par l'équipe de gestion des changements pendant le gel.
    - id: b
      text:
        en: |-
          Start the runbook in rate control mode with targets set to the tag App=checkout, a concurrency of 5 percent, and an error threshold of 2 percent.
        fr: |-
          Démarrer le runbook en mode de contrôle du débit avec des cibles définies sur la balise App=checkout, une concurrence de 5 % et un seuil d'erreur de 2 %.
    - id: c
      text:
        en: |-
          Write an AWS Lambda function that lists the tagged instances and starts one runbook execution per instance, pausing between batches of 150 instances.
        fr: |-
          Écrire une fonction AWS Lambda qui liste les instances balisées et démarre une exécution du runbook par instance, avec une pause entre des lots de 150 instances.
    - id: d
      text:
        en: |-
          Create a DEFAULT_OPEN Change Calendar with an event for the freeze, and add a dependency on that calendar to the runbook.
        fr: |-
          Créer un Change Calendar DEFAULT_OPEN avec un événement pour le gel, et ajouter au runbook une dépendance envers ce calendrier.
    - id: e
      text:
        en: |-
          Attach a CloudWatch alarm on the checkout error rate to the execution so that the runbook stops when the alarm enters the ALARM state.
        fr: |-
          Attacher à l'exécution une alarme CloudWatch sur le taux d'erreur du paiement, afin que le runbook s'arrête quand l'alarme passe à l'état ALARM.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Rate control runs the runbook on tagged targets with a concurrency value (a number or a percentage of targets) and an error threshold after which Automation stops sending the runbook to other resources. A DEFAULT_OPEN Change Calendar is CLOSED during its events, and runbooks that depend on the calendar are blocked while it is closed, so the freeze is enforced from the change team's calendar.
    fr: |-
      Le contrôle du débit exécute le runbook sur les cibles balisées avec une valeur de concurrence (un nombre ou un pourcentage des cibles) et un seuil d'erreur au-delà duquel Automation cesse d'envoyer le runbook à d'autres ressources. Un Change Calendar DEFAULT_OPEN est CLOSED pendant ses événements, et les runbooks qui dépendent du calendrier sont bloqués tant qu'il est fermé : le gel est appliqué à partir du calendrier de l'équipe des changements.
  options:
    a:
      en: |-
        Change Manager is no longer open to new customers since November 7, 2025, and manual rejections don't enforce the concurrency or error limits.
      fr: |-
        Change Manager n'est plus ouvert aux nouveaux clients depuis le 7 novembre 2025, et des rejets manuels n'appliquent ni la limite de concurrence ni la limite d'erreurs.
    c:
      en: |-
        A custom function rebuilds the rate control that Automation provides natively, with code to maintain and no built-in error threshold.
      fr: |-
        Une fonction personnalisée reconstruit le contrôle du débit qu'Automation fournit nativement, avec du code à maintenir et sans seuil d'erreur intégré.
    e:
      en: |-
        An alarm stop condition is a useful extra safety net, but it doesn't limit concurrency, apply the 2 percent execution error threshold, or enforce the freeze.
      fr: |-
        Une condition d'arrêt par alarme est un filet de sécurité utile en plus, mais elle ne limite pas la concurrence, n'applique pas le seuil de 2 % d'exécutions en échec et ne fait pas respecter le gel.
references:
  - title: "Run automated operations at scale - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/running-automations-scale.html
  - title: "AWS Systems Manager Change Calendar"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-change-calendar.html
