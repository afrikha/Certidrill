id: sapc03-5a-getstackoutput-cross-account
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's network team manages a shared services account. An AWS CloudFormation stack named core-network in us-east-1 in that account has outputs for the IDs of transit gateway route tables and Amazon Route 53 Resolver rules. Application stacks in 30 workload accounts, deployed in us-east-1 and us-west-2, need these values. Today, the network team copies the values into each application team's parameter files by hand, and errors are frequent. The network team must stay free to change or remove its outputs without being blocked by the consuming stacks, and the application teams accept that they must update their stacks to pick up a changed value. The solution must not require custom code.

    Which solution will meet these requirements?
  fr: |
    L'équipe réseau d'AnyCompany gère un compte de services partagés. Une pile AWS CloudFormation nommée core-network, dans us-east-1 dans ce compte, a des sorties pour les ID des tables de routage de la passerelle de transit et des règles Amazon Route 53 Resolver. Des piles applicatives de 30 comptes de charge de travail, déployées dans us-east-1 et us-west-2, ont besoin de ces valeurs. Aujourd'hui, l'équipe réseau recopie les valeurs à la main dans les fichiers de paramètres de chaque équipe applicative, et les erreurs sont fréquentes. L'équipe réseau doit rester libre de modifier ou supprimer ses sorties sans être bloquée par les piles consommatrices, et les équipes applicatives acceptent de devoir mettre à jour leurs piles pour prendre en compte une valeur modifiée. La solution ne doit pas nécessiter de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Export the outputs of core-network, and reference them with Fn::ImportValue in the application templates of every workload account and Region.
        fr: |-
          Exporter les sorties de core-network et les référencer avec Fn::ImportValue dans les modèles applicatifs de chaque compte de charge de travail et de chaque Région.
    - id: b
      text:
        en: |-
          Include the core-network template in each application template as a nested stack, and read the values with Fn::GetAtt on the outputs of the nested stack.
        fr: |-
          Inclure le modèle core-network dans chaque modèle applicatif sous forme de pile imbriquée, et lire les valeurs avec Fn::GetAtt sur les sorties de la pile imbriquée.
    - id: c
      text:
        en: |-
          Add a Lambda-backed custom resource to each application template that assumes a role in the network account and calls DescribeStacks to return the output values at each stack create or update.
        fr: |-
          Ajouter à chaque modèle applicatif une ressource personnalisée adossée à Lambda qui endosse un rôle dans le compte réseau et appelle DescribeStacks pour renvoyer les valeurs des sorties à chaque création ou mise à jour de pile.
    - id: d
      text:
        en: |-
          Reference the outputs with Fn::GetStackOutput, with Region us-east-1 and the ARN of a network account role that allows DescribeStacks on core-network and trusts the stacks' execution roles.
        fr: |-
          Référencer les sorties avec Fn::GetStackOutput, avec la Région us-east-1 et l'ARN d'un rôle du compte réseau qui autorise DescribeStacks sur core-network et approuve les rôles d'exécution des piles.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Fn::GetStackOutput reads an output of another stack, which doesn't need to be exported, across accounts (through RoleArn) and Regions (through Region). It is a weak reference: the producing stack can change or remove its outputs freely, and a consuming stack picks up a new value at its next create or update, which the application teams accept. No custom code is needed.
    fr: |-
      Fn::GetStackOutput lit une sortie d'une autre pile, sans qu'elle soit exportée, entre comptes (via RoleArn) et entre Régions (via Region). C'est une référence faible : la pile productrice peut librement modifier ou supprimer ses sorties, et une pile consommatrice prend en compte une nouvelle valeur à sa prochaine création ou mise à jour, ce que les équipes applicatives acceptent. Aucun code personnalisé n'est nécessaire.
  options:
    a:
      en: |-
        Exports and Fn::ImportValue work only within the same account and Region, and an export can't be changed or removed while a stack imports it.
      fr: |-
        Les exportations et Fn::ImportValue ne fonctionnent que dans le même compte et la même Région, et une exportation ne peut être ni modifiée ni supprimée tant qu'une pile l'importe.
    b:
      en: |-
        A nested stack would create a separate copy of the network resources in every workload account instead of reading the values of the shared core-network stack.
      fr: |-
        Une pile imbriquée créerait une copie distincte des ressources réseau dans chaque compte de charge de travail au lieu de lire les valeurs de la pile partagée core-network.
    c:
      en: |-
        A custom resource can read the outputs, but it is custom code to write, secure, and maintain, which the requirements rule out.
      fr: |-
        Une ressource personnalisée peut lire les sorties, mais c'est du code personnalisé à écrire, sécuriser et maintenir, ce que les exigences excluent.
references:
  - title: Fn::GetStackOutput - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/intrinsic-function-reference-getstackoutput.html
  - title: Get exported outputs from a deployed CloudFormation stack - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-exports.html
