id: sapc03-5c-alarm-opsitem-runbooks
objective: "5.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company is designing incident response for a new shipping API in a production account, and it has never used AWS Systems Manager incident tools before. When the CloudWatch alarm on the API's p99 latency enters the ALARM state, the on-call engineer must get a single work item that contains the alarm details and the related resources, and must be able to run the team's diagnostic Automation runbooks from that item. Repeated alarms for the same problem must not create duplicate items, and the on-call engineer must also be notified by email. The company wants managed AWS features and the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique conçoit la réponse aux incidents d'une nouvelle API d'expédition dans un compte de production, et n'a jamais utilisé les outils d'incident d'AWS Systems Manager. Quand l'alarme CloudWatch sur la latence p99 de l'API passe à l'état ALARM, l'ingénieur d'astreinte doit obtenir un élément de travail unique qui contient le détail de l'alarme et les ressources associées, et doit pouvoir exécuter depuis cet élément les runbooks Automation de diagnostic de l'équipe. Des alarmes répétées pour le même problème ne doivent pas créer d'éléments en double, et l'ingénieur d'astreinte doit aussi être prévenu par e-mail. L'entreprise veut des fonctionnalités AWS gérées et le MOINS de code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Incident Manager response plan with an on-call engagement and the diagnostic runbooks, and add the response plan as the alarm action.
        fr: |-
          Créer un plan de réponse Incident Manager avec un engagement d'astreinte et les runbooks de diagnostic, et ajouter le plan de réponse comme action de l'alarme.
    - id: b
      text:
        en: |-
          Configure the alarm to create an OpsItem in OpsCenter with a deduplication string, associate the diagnostic runbooks with the OpsItems, and add an SNS email action.
        fr: |-
          Configurer l'alarme pour qu'elle crée un OpsItem dans OpsCenter avec une chaîne de déduplication, associer les runbooks de diagnostic aux OpsItems, et ajouter une action d'e-mail SNS.
    - id: c
      text:
        en: |-
          Create a Change Manager change template for each diagnostic runbook, and have the alarm start a change request that the on-call engineer approves.
        fr: |-
          Créer un modèle de changement Change Manager pour chaque runbook de diagnostic, et faire démarrer par l'alarme une demande de changement que l'ingénieur d'astreinte approuve.
    - id: d
      text:
        en: |-
          Add an Amazon SNS action to the alarm with an AWS Lambda subscriber that opens a ticket in an Amazon DynamoDB table, checks it for duplicates, and emails the on-call engineer.
        fr: |-
          Ajouter à l'alarme une action Amazon SNS avec un abonné AWS Lambda qui ouvre un ticket dans une table Amazon DynamoDB, vérifie les doublons et envoie un e-mail à l'ingénieur d'astreinte.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A CloudWatch alarm can create an OpsItem in OpsCenter when it enters the ALARM state; with a deduplication string, the alarm doesn't create additional OpsItems until the existing one is resolved. OpsCenter keeps the alarm details and related resources in the OpsItem, from which operators run Automation runbooks, and an SNS action sends the email.
    fr: |-
      Une alarme CloudWatch peut créer un OpsItem dans OpsCenter quand elle passe à l'état ALARM ; avec une chaîne de déduplication, l'alarme ne crée pas d'OpsItems supplémentaires tant que l'existant n'est pas résolu. OpsCenter conserve dans l'OpsItem le détail de l'alarme et les ressources associées, à partir desquels les opérateurs exécutent les runbooks Automation, et une action SNS envoie l'e-mail.
  options:
    a:
      en: |-
        Incident Manager is no longer open to new customers since November 7, 2025, so a company that has never used it can't adopt it.
      fr: |-
        Incident Manager n'est plus ouvert aux nouveaux clients depuis le 7 novembre 2025 : une entreprise qui ne l'a jamais utilisé ne peut pas l'adopter.
    c:
      en: |-
        Change Manager is also closed to new customers, and change requests govern planned changes, not incident work items.
      fr: |-
        Change Manager est également fermé aux nouveaux clients, et les demandes de changement encadrent les changements planifiés, pas les éléments de travail d'incident.
    d:
      en: |-
        A custom ticketing function is code to build and maintain, and it doesn't give operators a place to run the runbooks.
      fr: |-
        Une fonction de tickets personnalisée est du code à construire et à maintenir, et elle ne donne pas aux opérateurs un endroit pour exécuter les runbooks.
references:
