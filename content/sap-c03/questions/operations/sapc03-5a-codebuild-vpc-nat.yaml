id: sapc03-5a-codebuild-vpc-nat
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline runs integration tests in an AWS CodeBuild project against an Amazon Aurora PostgreSQL test cluster in private subnets of a VPC in the tooling account. During the build, the tests also download npm packages from the public npm registry. The team configured the CodeBuild project with the VPC's public subnets, which have a route to an internet gateway, but the builds can't reach the npm registry. The builds must reach both the test cluster and the public registry. The VPC belongs to the tooling account.

    Which solution will meet these requirements?
  fr: |
    Le pipeline AWS CodePipeline d'une entreprise exécute des tests d'intégration dans un projet AWS CodeBuild sur un cluster de test Amazon Aurora PostgreSQL situé dans des sous-réseaux privés d'un VPC du compte d'outillage. Pendant la génération, les tests téléchargent aussi des packages npm depuis le registre npm public. L'équipe a configuré le projet CodeBuild avec les sous-réseaux publics du VPC, qui ont une route vers une passerelle Internet, mais les générations n'atteignent pas le registre npm. Les générations doivent atteindre à la fois le cluster de test et le registre public. Le VPC appartient au compte d'outillage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the public subnets, and turn on auto-assign public IPv4 address for them so that the network interfaces of the builds receive public IP addresses.
        fr: |-
          Conserver les sous-réseaux publics, et activer l'attribution automatique d'adresses IPv4 publiques sur ces sous-réseaux pour que les interfaces réseau des générations reçoivent des adresses IP publiques.
    - id: b
      text:
        en: |-
          Configure the project with private subnets in at least two Availability Zones whose route tables send internet traffic to a NAT gateway in a public subnet, with a security group that allows outbound traffic.
        fr: |-
          Configurer le projet avec des sous-réseaux privés dans au moins deux zones de disponibilité dont les tables de routage envoient le trafic Internet vers une passerelle NAT d'un sous-réseau public, avec un groupe de sécurité qui autorise le trafic sortant.
    - id: c
      text:
        en: |-
          Configure the project with subnets of a VPC that the network account shares with the tooling account through AWS RAM, where a central egress VPC with NAT gateways provides internet access to the shared subnets.
        fr: |-
          Configurer le projet avec les sous-réseaux d'un VPC que le compte réseau partage avec le compte d'outillage par AWS RAM, où un VPC de sortie central doté de passerelles NAT fournit l'accès à Internet aux sous-réseaux partagés.
    - id: d
      text:
        en: |-
          Keep the public subnets, and associate an Elastic IP address with the network interface of each build from a command in the install phase of the buildspec file.
        fr: |-
          Conserver les sous-réseaux publics, et associer une adresse IP Elastic à l'interface réseau de chaque génération par une commande dans la phase install du fichier buildspec.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Builds that run in a VPC never get public IP addresses, so an internet gateway route alone doesn't give them internet access. CodeBuild must use private subnets whose default route points to a NAT gateway in a public subnet; the builds then reach the test cluster inside the VPC and the npm registry through the NAT gateway. AWS recommends subnets in more than one Availability Zone.
    fr: |-
      Les générations qui s'exécutent dans un VPC ne reçoivent jamais d'adresse IP publique : une route vers une passerelle Internet ne leur donne donc pas accès à Internet. CodeBuild doit utiliser des sous-réseaux privés dont la route par défaut pointe vers une passerelle NAT d'un sous-réseau public ; les générations atteignent alors le cluster de test dans le VPC et le registre npm par la passerelle NAT. AWS recommande des sous-réseaux dans plusieurs zones de disponibilité.
  options:
    a:
      en: |-
        Auto-assigned public IP addresses apply to instances launched in the subnet, not to network interfaces created by other services such as CodeBuild.
      fr: |-
        Les adresses IP publiques attribuées automatiquement s'appliquent aux instances lancées dans le sous-réseau, pas aux interfaces réseau créées par d'autres services comme CodeBuild.
    c:
      en: |-
        CodeBuild doesn't support VPC connectivity with shared VPCs, and the test cluster is in the tooling account's own VPC.
      fr: |-
        CodeBuild ne prend pas en charge la connectivité VPC avec des VPC partagés, et le cluster de test se trouve dans le VPC propre du compte d'outillage.
    d:
      en: |-
        CodeBuild doesn't support assigning Elastic IP addresses to the network interfaces it creates for builds.
      fr: |-
        CodeBuild ne permet pas d'attribuer des adresses IP Elastic aux interfaces réseau qu'il crée pour les générations.
references:
  - title: Use AWS CodeBuild with Amazon Virtual Private Cloud - AWS CodeBuild
    url: https://docs.aws.amazon.com/codebuild/latest/userguide/vpc-support.html
