id: sapc03-5a-ecr-managed-signing
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany builds container images in 30 AWS CodeBuild projects across several accounts, and each project pushes images to the Amazon ECR registry of its own account in eu-west-1. A new policy requires every image pushed to a repository whose name starts with prod- to be signed with AWS Signer, using a signing profile that the central security account owns in eu-west-1. Images in other repositories must not be signed. The build teams must not install or maintain signing tools in their build images. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany génère des images de conteneur dans 30 projets AWS CodeBuild répartis sur plusieurs comptes, et chaque projet envoie les images dans le registre Amazon ECR de son propre compte, dans eu-west-1. Une nouvelle politique exige que chaque image envoyée dans un référentiel dont le nom commence par prod- soit signée avec AWS Signer, à l'aide d'un profil de signature que détient le compte de sécurité central dans eu-west-1. Les images des autres référentiels ne doivent pas être signées. Les équipes de génération ne doivent ni installer ni maintenir d'outils de signature dans leurs images de génération. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Install the Notation CLI with the AWS Signer plugin in each build image, and sign each prod- image after the push with the central signing profile.
        fr: |-
          Installer la CLI Notation avec le plugin AWS Signer dans chaque image de génération, et signer chaque image prod- après l'envoi avec le profil de signature central.
    - id: b
      text:
        en: |-
          Turn on tag immutability for the prod- repositories, and add an ECR lifecycle policy rule that expires the images that aren't signed by the central profile.
        fr: |-
          Activer l'immuabilité des balises pour les référentiels prod-, et ajouter une règle de politique de cycle de vie ECR qui fait expirer les images non signées par le profil central.
    - id: c
      text:
        en: |-
          Create the signing profile in us-east-1 in the security account, and add to each account's registry an ECR managed signing configuration that uses it for prod-* repositories, and allow the pushing roles to call signer:SignPayload on the profile.
        fr: |-
          Créer le profil de signature dans us-east-1 dans le compte de sécurité, et ajouter au registre de chaque compte une configuration de signature gérée ECR qui l'utilise pour les référentiels prod-*, et autoriser les rôles qui envoient les images à appeler signer:SignPayload sur le profil.
    - id: d
      text:
        en: |-
          Add to each account's registry an ECR managed signing configuration with a rule that uses the central eu-west-1 profile and a prod-* repository filter, and allow the pushing roles to call signer:SignPayload on the profile.
        fr: |-
          Ajouter au registre de chaque compte une configuration de signature gérée ECR avec une règle qui utilise le profil central d'eu-west-1 et un filtre de référentiels prod-*, et autoriser les rôles qui envoient les images à appeler signer:SignPayload sur le profil.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ECR managed signing signs images with AWS Signer as they are pushed, so no client-side tool is needed. A registry signing configuration holds rules that pair a signing profile with repository filters, so only prod-* repositories are signed. Signing uses the identity of the principal that pushes, which needs signer:SignPayload on the profile; the profile must be in the registry's Region, and it can belong to another account.
    fr: |-
      La signature gérée d'ECR signe les images avec AWS Signer au moment de leur envoi : aucun outil côté client n'est nécessaire. Une configuration de signature de registre contient des règles qui associent un profil de signature à des filtres de référentiels : seuls les référentiels prod-* sont signés. La signature utilise l'identité du principal qui envoie l'image, lequel a besoin de signer:SignPayload sur le profil ; le profil doit se trouver dans la Région du registre, et il peut appartenir à un autre compte.
  options:
    a:
      en: |-
        Client-side signing with Notation means installing and maintaining signing tools in every build image, which the policy forbids.
      fr: |-
        La signature côté client avec Notation implique d'installer et de maintenir des outils de signature dans chaque image de génération, ce que la politique interdit.
    b:
      en: |-
        Tag immutability doesn't sign anything, and lifecycle rules select images by tags, age, or count, not by signature.
      fr: |-
        L'immuabilité des balises ne signe rien, et les règles de cycle de vie sélectionnent les images selon les balises, l'âge ou le nombre, pas selon la signature.
    c:
      en: |-
        Managed signing requires the signing profile to be in the same Region as the registry; cross-Region signing isn't supported.
      fr: |-
        La signature gérée exige que le profil de signature soit dans la même Région que le registre ; la signature entre Régions n'est pas prise en charge.
references:
  - title: Managed signing - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/managed-signing.html
