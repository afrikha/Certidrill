id: sapc03-5a-codeconnections-source
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is moving its build and release process from a self-managed Jenkins server to AWS CodePipeline. The source code stays in private repositories of the company's GitHub organization. Security requires that no personal access token, IAM user key, or other long-term credential be created for the integration, and that AWS get access only to the repositories that the pipelines use. Pipelines must start automatically when code is pushed. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre son processus de génération et de publication d'un serveur Jenkins autogéré vers AWS CodePipeline. Le code source reste dans des référentiels privés de l'organisation GitHub de l'entreprise. La sécurité exige qu'aucun jeton d'accès personnel, aucune clé d'utilisateur IAM ni aucune autre information d'identification à long terme ne soit créé pour l'intégration, et qu'AWS n'ait accès qu'aux référentiels utilisés par les pipelines. Les pipelines doivent démarrer automatiquement lorsque du code est poussé. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Store a GitHub personal access token in AWS Secrets Manager, and run a scheduled Lambda function that polls the repositories and uploads changed code to an S3 source bucket.
        fr: |-
          Stocker un jeton d'accès personnel GitHub dans AWS Secrets Manager, et exécuter une fonction Lambda planifiée qui interroge les référentiels et charge le code modifié dans un compartiment S3 source.
    - id: b
      text:
        en: |-
          Mirror the repositories to AWS CodeCommit with a GitHub Actions workflow that pushes with the Git credentials of an IAM user stored as a GitHub secret, and use CodeCommit as the pipeline source.
        fr: |-
          Mettre en miroir les référentiels dans AWS CodeCommit avec un flux de travail GitHub Actions qui pousse avec les informations d'identification Git d'un utilisateur IAM stockées comme secret GitHub, et utiliser CodeCommit comme source du pipeline.
    - id: c
      text:
        en: |-
          Configure GitHub webhooks that call an Amazon API Gateway endpoint, and a Lambda function that downloads the repository archive and starts the matching pipeline.
        fr: |-
          Configurer des webhooks GitHub qui appellent un point de terminaison Amazon API Gateway, et une fonction Lambda qui télécharge l'archive du référentiel et démarre le pipeline correspondant.
    - id: d
      text:
        en: |-
          Create an AWS CodeConnections connection that installs the AWS Connector for GitHub app on the organization for the selected repositories only, and use it in the source actions.
        fr: |-
          Créer une connexion AWS CodeConnections qui installe l'application AWS Connector for GitHub sur l'organisation pour les seuls référentiels sélectionnés, et l'utiliser dans les actions source.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A CodeConnections connection to GitHub uses the AWS Connector for GitHub app, so no personal token or IAM user key is created, and the app installation can be limited to the repositories that the pipelines need. Source actions that use the connection start the pipeline on pushes, and V2 triggers can filter them, with nothing to operate.
    fr: |-
      Une connexion CodeConnections vers GitHub utilise l'application AWS Connector for GitHub : aucun jeton personnel ni aucune clé d'utilisateur IAM n'est créé, et l'installation de l'application peut être limitée aux référentiels dont les pipelines ont besoin. Les actions source qui utilisent la connexion démarrent le pipeline lors des push, et les déclencheurs V2 peuvent les filtrer, sans rien à exploiter.
  options:
    a:
      en: |-
        A personal access token is a long-term credential, and polling with a custom function adds code and delay.
      fr: |-
        Un jeton d'accès personnel est une information d'identification à long terme, et l'interrogation par une fonction personnalisée ajoute du code et du délai.
    b:
      en: |-
        Git credentials of an IAM user are long-term credentials, and maintaining a mirror adds a second repository to operate.
      fr: |-
        Les informations d'identification Git d'un utilisateur IAM sont des informations à long terme, et la maintenance d'un miroir ajoute un second référentiel à exploiter.
    c:
      en: |-
        Downloading private repositories needs a GitHub credential that the function stores, and the webhook endpoint and function are custom components to secure.
      fr: |-
        Télécharger des référentiels privés exige une information d'identification GitHub stockée par la fonction, et le point de terminaison du webhook et la fonction sont des composants personnalisés à sécuriser.
references:
  - title: GitHub connections - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/connections-github.html
