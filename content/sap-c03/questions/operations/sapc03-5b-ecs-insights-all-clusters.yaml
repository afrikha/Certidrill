id: sapc03-5b-ecs-insights-all-clusters
objective: "5.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's container platform account has 60 Amazon ECS clusters on AWS Fargate and Amazon EC2, and application teams create new clusters every week with their own IAM roles. Container Insights is turned off on all clusters. The operations team needs CPU, memory, and network metrics for each task and each container in every cluster, including the clusters that are created later. The team wants the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Le compte de plateforme de conteneurs d'AnyCompany contient 60 clusters Amazon ECS sur AWS Fargate et Amazon EC2, et les équipes applicatives créent chaque semaine de nouveaux clusters avec leurs propres rôles IAM. Container Insights est désactivé sur tous les clusters. L'équipe d'exploitation a besoin de métriques de processeur, de mémoire et de réseau pour chaque tâche et chaque conteneur de chaque cluster, y compris les clusters créés plus tard. L'équipe veut le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add the CloudWatch agent as a sidecar container to every task definition, and configure it to publish per-container metrics with the PutMetricData API.", fr: "Ajouter l'agent CloudWatch comme conteneur sidecar à chaque définition de tâche, et le configurer pour publier des métriques par conteneur avec l'API PutMetricData." } }
    - { id: b, text: { en: "Run update-cluster-settings with containerInsights set to enhanced on each of the 60 existing clusters.", fr: "Exécuter update-cluster-settings avec containerInsights défini sur enhanced sur chacun des 60 clusters existants." } }
    - { id: c, text: { en: "Turn on CloudWatch cross-account observability for the account, so that container metrics are collected for every cluster that is created later.", fr: "Activer l'observabilité intercompte CloudWatch pour le compte, afin que les métriques de conteneurs soient collectées pour chaque cluster créé plus tard." } }
    - { id: d, text: { en: "Run put-account-setting-default with containerInsights set to enhanced, so that every new cluster uses Container Insights with enhanced observability.", fr: "Exécuter put-account-setting-default avec containerInsights défini sur enhanced, afin que chaque nouveau cluster utilise Container Insights avec observabilité améliorée." } }
    - { id: e, text: { en: "Run put-account-setting with containerInsights set to enabled as the operations team's role, so that all clusters report task-level metrics.", fr: "Exécuter put-account-setting avec containerInsights défini sur enabled sous le rôle de l'équipe d'exploitation, afin que tous les clusters remontent des métriques au niveau des tâches." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The containerInsights account setting applies only to clusters created after it is set, so existing clusters are switched with update-cluster-settings, which can add enhanced observability to a cluster. Setting the default for the whole account covers the new clusters that any role creates, and the enhanced value adds the container-level metrics that the standard version lacks."
    fr: "Le paramètre de compte containerInsights ne s'applique qu'aux clusters créés après sa définition : les clusters existants sont donc basculés avec update-cluster-settings, qui peut ajouter l'observabilité améliorée à un cluster. Définir la valeur par défaut pour tout le compte couvre les nouveaux clusters créés par n'importe quel rôle, et la valeur enhanced ajoute les métriques au niveau du conteneur dont la version standard ne dispose pas."
  options:
    a: { en: "A sidecar in every task definition must be maintained by every team, which is far more overhead than the managed Container Insights feature.", fr: "Un sidecar dans chaque définition de tâche doit être maintenu par chaque équipe, ce qui représente bien plus de charge que la fonctionnalité gérée Container Insights." }
    c: { en: "Cross-account observability shares existing telemetry with a monitoring account; it does not turn on metric collection for ECS clusters.", fr: "L'observabilité intercompte partage la télémétrie existante avec un compte de surveillance ; elle n'active pas la collecte de métriques pour les clusters ECS." }
    e: { en: "Without a principal, put-account-setting applies only to the calling role, it affects only new clusters, and the enabled value stops at task level without per-container detail.", fr: "Sans principal, put-account-setting ne s'applique qu'au rôle appelant, il ne concerne que les nouveaux clusters, et la valeur enabled s'arrête au niveau des tâches sans détail par conteneur." }
references:
  - title: Setting up Container Insights on Amazon ECS
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/deploy-container-insights-ECS-cluster.html
