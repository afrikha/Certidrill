id: sapc03-5b-app-signals-eks
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 80 Java and Python microservices on three Amazon EKS clusters in its production account. The site reliability team needs latency, fault, and error metrics for every service and operation, a map of the dependencies between services, and service-level objectives on the most important operations. The application teams will not change their code this quarter. The site reliability team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 80 microservices Java et Python sur trois clusters Amazon EKS de son compte de production. L'équipe d'ingénierie de fiabilité (SRE) a besoin de métriques de latence, de pannes (faults) et d'erreurs pour chaque service et chaque opération, d'une carte des dépendances entre les services, et d'objectifs de niveau de service (SLO) sur les opérations les plus importantes. Les équipes applicatives ne modifieront pas leur code ce trimestre. L'équipe SRE veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add the AWS X-Ray SDK to each service, create an X-Ray group for each service, and build CloudWatch dashboards from the metrics of the X-Ray service graph.", fr: "Ajouter le SDK AWS X-Ray à chaque service, créer un groupe X-Ray par service, et construire des tableaux de bord CloudWatch à partir des métriques du graphe de services X-Ray." } }
    - { id: b, text: { en: "Install the Amazon CloudWatch Observability EKS add-on on each cluster with Application Signals enabled, so that the services are instrumented automatically.", fr: "Installer le module complémentaire EKS Amazon CloudWatch Observability sur chaque cluster avec Application Signals activé, afin que les services soient instrumentés automatiquement." } }
    - { id: c, text: { en: "Turn on EKS control plane logging and Container Insights on each cluster, and build dashboards from the pod and node metrics of each service.", fr: "Activer la journalisation du plan de contrôle EKS et Container Insights sur chaque cluster, et construire des tableaux de bord à partir des métriques de pods et de nœuds de chaque service." } }
    - { id: d, text: { en: "Deploy a self-managed Prometheus server and Grafana on each cluster, and ask each team to expose a metrics endpoint for every operation of its service.", fr: "Déployer un serveur Prometheus et Grafana autogérés sur chaque cluster, et demander à chaque équipe d'exposer un point de terminaison de métriques pour chaque opération de son service." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch Application Signals collects call volume, availability, latency, faults, and errors for services and their operations, discovers an application map of dependencies, and manages SLOs, without custom code. On Amazon EKS, the CloudWatch Observability add-on enables Application Signals by default, discovers the service names automatically, and supports Java and Python."
    fr: "CloudWatch Application Signals collecte le volume d'appels, la disponibilité, la latence, les pannes et les erreurs des services et de leurs opérations, découvre une carte des dépendances de l'application et gère les SLO, sans code personnalisé. Sur Amazon EKS, le module complémentaire CloudWatch Observability active Application Signals par défaut, découvre automatiquement les noms des services et prend en charge Java et Python."
  options:
    a: { en: "Adding an SDK to each service is a code change, and the X-Ray SDKs are in maintenance mode.", fr: "Ajouter un SDK à chaque service est une modification de code, et les SDK X-Ray sont en mode maintenance." }
    c: { en: "Control plane logs and pod and node metrics describe infrastructure; they give neither per-operation latency and faults nor a dependency map.", fr: "Les journaux du plan de contrôle et les métriques de pods et de nœuds décrivent l'infrastructure ; ils ne donnent ni la latence et les pannes par opération ni une carte des dépendances." }
    d: { en: "Exposing metrics endpoints requires code changes, and running Prometheus and Grafana on three clusters adds operational overhead.", fr: "Exposer des points de terminaison de métriques exige des modifications de code, et exploiter Prometheus et Grafana sur trois clusters ajoute de la charge opérationnelle." }
references:
  - title: Application Signals
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Application-Monitoring-Sections.html
  - title: Install the CloudWatch agent with the Amazon CloudWatch Observability EKS add-on or the Helm chart
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
