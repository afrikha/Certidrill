id: sapc03-5a-github-oidc-roles
objective: "5.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an application with GitHub Actions workflows from the repository ExampleOrg/orders to a development account and a production account. Today, the workflows use access keys of IAM users that are stored as GitHub secrets. The security team requires short-lived credentials only. Workflows from any branch of this repository may deploy to the development account, but only workflows that run on the main branch of this repository may assume the production deployment role. No other GitHub repository or organization may assume either role.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie une application avec des flux de travail GitHub Actions, depuis le référentiel ExampleOrg/orders, vers un compte de développement et un compte de production. Aujourd'hui, les flux de travail utilisent des clés d'accès d'utilisateurs IAM stockées comme secrets GitHub. L'équipe de sécurité exige uniquement des informations d'identification de courte durée. Les flux de travail de n'importe quelle branche de ce référentiel peuvent déployer dans le compte de développement, mais seuls les flux de travail exécutés sur la branche main de ce référentiel peuvent endosser le rôle de déploiement de production. Aucun autre référentiel ni aucune autre organisation GitHub ne doit pouvoir endosser l'un ou l'autre rôle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create the GitHub OIDC provider in the development account only, with a role that every workflow assumes, and let that role chain into a production role that trusts the development role.
        fr: |-
          Créer le fournisseur OIDC GitHub dans le seul compte de développement, avec un rôle qu'endosse chaque flux de travail, et laisser ce rôle s'enchaîner vers un rôle de production qui approuve le rôle de développement.
    - id: b
      text:
        en: |-
          Create the GitHub OIDC provider in each account, with roles that require the sts.amazonaws.com audience and a sub of repo:ExampleOrg/orders:* in development and repo:ExampleOrg/orders:ref:refs/heads/main in production.
        fr: |-
          Créer le fournisseur OIDC GitHub dans chaque compte, avec des rôles qui exigent l'audience sts.amazonaws.com et un sub repo:ExampleOrg/orders:* en développement et repo:ExampleOrg/orders:ref:refs/heads/main en production.
    - id: c
      text:
        en: |-
          Create the GitHub OIDC provider in each account, with roles whose trust policies require only the sts.amazonaws.com audience, and protect the main branch with GitHub branch protection rules and required reviews for production workflows.
        fr: |-
          Créer le fournisseur OIDC GitHub dans chaque compte, avec des rôles dont les politiques d'approbation n'exigent que l'audience sts.amazonaws.com, et protéger la branche main avec des règles de protection de branche GitHub et des revues obligatoires pour les flux de production.
    - id: d
      text:
        en: |-
          Keep the IAM users, rotate their access keys every 24 hours with a scheduled Lambda function, and update the GitHub secrets with the new keys through the GitHub API.
        fr: |-
          Conserver les utilisateurs IAM, faire la rotation de leurs clés d'accès toutes les 24 heures avec une fonction Lambda planifiée, et mettre à jour les secrets GitHub avec les nouvelles clés par l'API GitHub.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With an IAM OIDC identity provider for token.actions.githubusercontent.com in each account, workflows get short-lived credentials through AssumeRoleWithWebIdentity. The trust policies require the sts.amazonaws.com audience and restrict the sub claim: a wildcard on the repository for development, and the exact main-branch subject for production. Because the sub names the organization and repository, workflows from other repositories or organizations can't assume the roles.
    fr: |-
      Avec un fournisseur d'identité OIDC IAM pour `token.actions.githubusercontent.com` dans chaque compte, les flux de travail obtiennent des informations d'identification de courte durée par AssumeRoleWithWebIdentity. Les politiques d'approbation exigent l'audience sts.amazonaws.com et restreignent la revendication sub : un caractère générique sur le référentiel pour le développement, et le sujet exact de la branche main pour la production. Comme le sub nomme l'organisation et le référentiel, les flux de travail d'autres référentiels ou organisations ne peuvent pas endosser les rôles.
  options:
    a:
      en: |-
        Any workflow that can assume the development role, from any branch, could then chain into the production role, so the main-branch restriction is lost.
      fr: |-
        Tout flux de travail capable d'endosser le rôle de développement, depuis n'importe quelle branche, pourrait alors s'enchaîner vers le rôle de production : la restriction à la branche main est perdue.
    c:
      en: |-
        Without a sub condition, workflows of other repositories and organizations could assume the roles, and IAM rejects GitHub trust policies whose sub is missing or only a wildcard.
      fr: |-
        Sans condition sur sub, des flux de travail d'autres référentiels et organisations pourraient endosser les rôles, et IAM rejette les politiques d'approbation GitHub dont le sub est absent ou n'est qu'un caractère générique.
    d:
      en: |-
        Access keys rotated daily are still long-term IAM user credentials stored outside AWS, and the rotation function is custom code.
      fr: |-
        Des clés d'accès renouvelées chaque jour restent des informations d'identification à long terme d'utilisateurs IAM stockées hors d'AWS, et la fonction de rotation est du code personnalisé.
references:
  - title: Create a role for OpenID Connect federation (console) - AWS Identity and Access Management
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
