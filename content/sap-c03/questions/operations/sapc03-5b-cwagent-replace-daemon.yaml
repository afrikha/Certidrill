id: sapc03-5b-cwagent-replace-daemon
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs 600 Amazon EC2 instances that host Java applications. Each instance runs the CloudWatch agent, which collects memory and disk metrics and application log files, and the AWS X-Ray daemon for the applications that still use the X-Ray SDK. The applications are being migrated to OpenTelemetry instrumentation that exports OTLP, one application at a time. The operations team does not want to add a third agent to the instances, and it wants to stop depending on components that receive only security fixes.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany exécute 600 instances Amazon EC2 qui hébergent des applications Java. Chaque instance exécute l'agent CloudWatch, qui collecte les métriques de mémoire et de disque et les fichiers journaux des applications, ainsi que le démon AWS X-Ray pour les applications qui utilisent encore le SDK X-Ray. Les applications migrent une par une vers une instrumentation OpenTelemetry qui exporte en OTLP. L'équipe d'exploitation ne veut pas ajouter un troisième agent aux instances, et elle veut ne plus dépendre de composants qui ne reçoivent que des correctifs de sécurité.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Keep the X-Ray daemon for all applications, and configure the OpenTelemetry SDKs to export spans in the X-Ray segment format to the daemon on UDP port 2000.", fr: "Conserver le démon X-Ray pour toutes les applications, et configurer les SDK OpenTelemetry pour exporter les spans au format de segment X-Ray vers le démon sur le port UDP 2000." } }
    - { id: b, text: { en: "Install the AWS Distro for OpenTelemetry Collector on every instance for the OTLP traces, and keep the X-Ray daemon until the last application is migrated.", fr: "Installer l'AWS Distro for OpenTelemetry Collector sur chaque instance pour les traces OTLP, et conserver le démon X-Ray jusqu'à la migration de la dernière application." } }
    - { id: c, text: { en: "Remove the CloudWatch agent and the X-Ray daemon, and send the metrics, logs, and traces of each application directly to the CloudWatch OTLP endpoints.", fr: "Supprimer l'agent CloudWatch et le démon X-Ray, et envoyer les métriques, journaux et traces de chaque application directement vers les points de terminaison OTLP de CloudWatch." } }
    - { id: d, text: { en: "Upgrade the CloudWatch agent to a version that collects traces, configure its OTLP and X-Ray trace receivers, and remove the X-Ray daemon from the instances.", fr: "Mettre à niveau l'agent CloudWatch vers une version qui collecte les traces, configurer ses récepteurs de traces OTLP et X-Ray, et supprimer le démon X-Ray des instances." } }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudWatch agent version 1.300025.0 and later collects OpenTelemetry traces through an OTLP receiver and can also receive X-Ray segments, so it replaces the X-Ray daemon and reduces the number of agents to manage. The same agent keeps collecting the memory, disk, and log data, and migrated and unmigrated applications are both served during the transition."
    fr: "L'agent CloudWatch version 1.300025.0 et ultérieures collecte les traces OpenTelemetry via un récepteur OTLP et peut aussi recevoir des segments X-Ray : il remplace le démon X-Ray et réduit le nombre d'agents à gérer. Le même agent continue de collecter les données de mémoire, de disque et de journaux, et les applications migrées comme non migrées sont prises en charge pendant la transition."
  options:
    a: { en: "The X-Ray daemon is in maintenance mode with security fixes only, which is the dependency that the team wants to remove.", fr: "Le démon X-Ray est en mode maintenance avec uniquement des correctifs de sécurité, c'est-à-dire la dépendance que l'équipe veut supprimer." }
    b: { en: "This adds a third agent to every instance and keeps the daemon, which breaks both constraints.", fr: "Cette option ajoute un troisième agent sur chaque instance et conserve le démon, ce qui enfreint les deux contraintes." }
    c: { en: "The applications do not produce the host memory and disk metrics or ship their log files, and the X-Ray SDK applications cannot send OTLP until they are migrated.", fr: "Les applications ne produisent pas les métriques de mémoire et de disque de l'hôte et n'envoient pas leurs fichiers journaux, et les applications sous SDK X-Ray ne peuvent pas envoyer d'OTLP avant leur migration." }
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
