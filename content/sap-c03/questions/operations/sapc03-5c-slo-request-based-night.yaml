id: sapc03-5c-slo-request-based-night
objective: "5.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company exposes a licensing API from a shared services account to the applications of 40 business-unit accounts. Traffic is about 50,000 requests per minute during business hours and 2 to 5 requests per minute at night. The team created a period-based CloudWatch Application Signals SLO on Availability with 1-minute periods, a 99.5 percent goal, and a calendar interval of one month. Most of the error budget is spent at night, when a single failed request out of three makes a whole minute unhealthy, while daytime failure rates are far below the goal. The customer contract measures availability as the percentage of successful requests in each calendar month, and the SLO must report the same figure.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels expose une API de licences depuis un compte de services partagés aux applications de 40 comptes de divisions. Le trafic est d'environ 50 000 requêtes par minute pendant les heures ouvrées et de 2 à 5 requêtes par minute la nuit. L'équipe a créé un SLO CloudWatch Application Signals basé sur les périodes, sur Availability, avec des périodes de 1 minute, un objectif de 99,5 % et un intervalle calendaire d'un mois. La plus grande partie du budget d'erreur est consommée la nuit, lorsqu'une seule requête en échec sur trois rend toute une minute non saine, alors que les taux d'échec diurnes sont très inférieurs à l'objectif. Le contrat client mesure la disponibilité comme le pourcentage de requêtes réussies au cours de chaque mois calendaire, et le SLO doit indiquer le même chiffre.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Edit the existing SLO to use 5-minute periods so that each night period contains enough requests to absorb a single failure.
        fr: |-
          Modifier le SLO existant pour utiliser des périodes de 5 minutes, afin que chaque période nocturne contienne assez de requêtes pour absorber un échec isolé.
    - id: b
      text:
        en: |-
          Add a recurring exclusion window to the SLO for the night hours so that low-traffic periods no longer count against the error budget.
        fr: |-
          Ajouter au SLO une fenêtre d'exclusion récurrente pour les heures de nuit, afin que les périodes à faible trafic ne comptent plus dans le budget d'erreur.
    - id: c
      text:
        en: |-
          Create a new request-based SLO with a 99.5 percent goal and a monthly calendar interval, then delete the old SLO and, separately, its alarms.
        fr: |-
          Créer un nouveau SLO basé sur les requêtes avec un objectif de 99,5 % et un intervalle calendaire mensuel, puis supprimer l'ancien SLO et, séparément, ses alarmes.
    - id: d
      text:
        en: |-
          Keep the period-based SLO and lower its attainment goal to 98 percent so that the night periods no longer exhaust the error budget.
        fr: |-
          Conserver le SLO basé sur les périodes et abaisser son objectif d'atteinte à 98 %, afin que les périodes nocturnes n'épuisent plus le budget d'erreur.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A request-based SLO computes attainment as good requests divided by total requests over the interval, which is exactly how the contract measures availability, and a calendar interval aligns it with each month. The evaluation type can't be changed on an existing SLO, so a new SLO is created; deleting an SLO doesn't delete its alarms, which must be removed separately.
    fr: |-
      Un SLO basé sur les requêtes calcule l'atteinte comme le nombre de bonnes requêtes divisé par le total des requêtes sur l'intervalle, exactement comme le contrat mesure la disponibilité, et un intervalle calendaire l'aligne sur chaque mois. Le type d'évaluation ne peut pas être modifié sur un SLO existant : on crée donc un nouveau SLO ; supprimer un SLO ne supprime pas ses alarmes, qui doivent être supprimées séparément.
  options:
    a:
      en: |-
        Longer periods are still period-based, so attainment is a share of good periods, not of good requests; it still doesn't match the contract.
      fr: |-
        Des périodes plus longues restent basées sur les périodes : l'atteinte est une part de bonnes périodes, pas de bonnes requêtes ; elle ne correspond toujours pas au contrat.
    b:
      en: |-
        Excluding the night hides real failures that the contract counts, so the SLO would report a figure different from the contractual one.
      fr: |-
        Exclure la nuit masque des échecs réels que le contrat comptabilise : le SLO indiquerait un chiffre différent du chiffre contractuel.
    d:
      en: |-
        A lower goal hides the problem instead of measuring requests, and the SLO no longer reflects the 99.5 percent target or the contractual calculation.
      fr: |-
        Un objectif plus bas masque le problème au lieu de mesurer les requêtes, et le SLO ne reflète plus l'objectif de 99,5 % ni le calcul contractuel.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
