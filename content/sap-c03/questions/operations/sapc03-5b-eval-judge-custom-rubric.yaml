id: sapc03-5b-eval-judge-custom-rubric
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company's claims chatbot uses a foundation model in Amazon Bedrock. Regulators require that every answer about coverage includes a specific disclaimer and never promises that a claim will be paid. The compliance team has written a scoring rubric for these two rules. It wants every release scored automatically on 800 test prompts against the rubric, together with general quality measures such as relevance. The built-in metrics of Amazon Bedrock Evaluations do not check company-specific rules like these. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le chatbot de gestion des sinistres d'une compagnie d'assurance utilise un modèle de fondation dans Amazon Bedrock. Les régulateurs exigent que chaque réponse sur la couverture comprenne un avertissement précis et ne promette jamais qu'un sinistre sera indemnisé. L'équipe conformité a rédigé une grille de notation pour ces deux règles. Elle veut que chaque version soit notée automatiquement sur 800 invites de test par rapport à cette grille, ainsi que sur des mesures de qualité générales comme la pertinence. Les métriques intégrées d'Amazon Bedrock Evaluations ne vérifient pas des règles propres à l'entreprise comme celles-ci. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run a programmatic evaluation job with the question and answer task type and a custom prompt dataset, and use the robustness score to detect answers that break the two rules.", fr: "Exécuter une tâche d'évaluation programmatique avec le type de tâche questions-réponses et un jeu de données d'invites personnalisé, et utiliser le score de robustesse pour détecter les réponses qui enfreignent les deux règles." } }
    - { id: b, text: { en: "Configure an Amazon Bedrock guardrail with a denied topic for claim payment promises, and count the guardrail interventions in Amazon CloudWatch after each release.", fr: "Configurer une barrière de protection Amazon Bedrock avec un sujet refusé pour les promesses d'indemnisation, et compter les interventions de la barrière dans Amazon CloudWatch après chaque version." } }
    - { id: c, text: { en: "Run a judge-based evaluation job on the 800 prompts with a custom metric that encodes the compliance rubric, together with the built-in relevance metric.", fr: "Exécuter une tâche d'évaluation avec modèle juge sur les 800 invites avec une métrique personnalisée qui encode la grille de conformité, en plus de la métrique intégrée de pertinence." } }
    - { id: d, text: { en: "Run a human-based evaluation job for each release in which the compliance team scores the 800 answers against the rubric with custom rating criteria.", fr: "Exécuter pour chaque version une tâche d'évaluation basée sur des humains dans laquelle l'équipe conformité note les 800 réponses selon la grille avec des critères de notation personnalisés." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Judge-based evaluation jobs support custom metrics that you define for your business case: the evaluator model applies the rubric's prompt to each response and explains its score. The same job can also compute built-in metrics such as relevance, and a dataset of 800 prompts is within the limit of 1,000 prompts per job."
    fr: "Les tâches d'évaluation avec modèle juge prennent en charge des métriques personnalisées définies pour votre cas métier : le modèle évaluateur applique l'invite de la grille à chaque réponse et explique son score. La même tâche peut aussi calculer des métriques intégrées comme la pertinence, et un jeu de 800 invites respecte la limite de 1 000 invites par tâche."
  options:
    a: { en: "Robustness measures how much the output changes when the input is perturbed; it does not check whether a disclaimer is present or whether a payment is promised.", fr: "La robustesse mesure à quel point la sortie change quand l'entrée est perturbée ; elle ne vérifie ni la présence d'un avertissement ni une promesse d'indemnisation." }
    b: { en: "A guardrail blocks content at run time and cannot check that a required disclaimer is present; counting interventions after release does not score a release before it ships.", fr: "Une barrière de protection bloque du contenu à l'exécution et ne peut pas vérifier la présence d'un avertissement obligatoire ; compter les interventions après la mise en production ne note pas une version avant sa livraison." }
    d: { en: "Scoring 800 answers by hand for every release is not automatic and carries far more operational overhead than a judge model.", fr: "Noter 800 réponses à la main pour chaque version n'est pas automatique et représente bien plus de charge opérationnelle qu'un modèle juge." }
references:
  - title: Evaluate model performance using another LLM as a judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
  - title: Create a prompt dataset for a model evaluation job that uses a model as judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
