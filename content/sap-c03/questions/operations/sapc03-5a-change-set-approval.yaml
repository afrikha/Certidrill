id: sapc03-5a-change-set-approval
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys its infrastructure with AWS CloudFormation from an AWS CodePipeline pipeline that uses a CloudFormation action in CREATE_UPDATE mode. Last month, a template change to one property of an Amazon RDS DB instance made CloudFormation replace the instance, and nobody noticed before the change reached production. The company wants the release manager to see, before every production update, exactly which resources will be added, modified, or replaced. The release manager must approve the update before CloudFormation changes anything. The solution must use native pipeline features.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie son infrastructure avec AWS CloudFormation depuis un pipeline AWS CodePipeline qui utilise une action CloudFormation en mode CREATE_UPDATE. Le mois dernier, une modification du modèle portant sur une propriété d'une instance de base de données Amazon RDS a conduit CloudFormation à remplacer l'instance, et personne ne l'a remarqué avant que la modification n'atteigne la production. L'entreprise veut que le responsable des versions voie, avant chaque mise à jour de production, exactement quelles ressources seront ajoutées, modifiées ou remplacées. Le responsable des versions doit approuver la mise à jour avant que CloudFormation ne modifie quoi que ce soit. La solution doit utiliser les fonctionnalités natives du pipeline.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep the CREATE_UPDATE action, turn on termination protection for the production stack, and have the release manager review the stack events after each update completes.
        fr: |-
          Conserver l'action CREATE_UPDATE, activer la protection contre la résiliation de la pile de production, et faire examiner les événements de la pile par le responsable des versions après chaque mise à jour.
    - id: b
      text:
        en: |-
          Add a CodeBuild action that saves the Git diff of the template as an artifact, followed by a manual approval action for the release manager, and keep the CREATE_UPDATE action after the approval.
        fr: |-
          Ajouter une action CodeBuild qui enregistre le diff Git du modèle comme artefact, suivie d'une action d'approbation manuelle pour le responsable des versions, et conserver l'action CREATE_UPDATE après l'approbation.
    - id: c
      text:
        en: |-
          Keep the CREATE_UPDATE action, run drift detection on the production stack after it, and add a manual approval action that the release manager completes after reviewing the drift.
        fr: |-
          Conserver l'action CREATE_UPDATE, lancer ensuite une détection de dérive sur la pile de production, et ajouter une action d'approbation manuelle que le responsable des versions valide après avoir examiné la dérive.
    - id: d
      text:
        en: |-
          Replace the action with a CloudFormation action in CHANGE_SET_REPLACE mode, a manual approval action for the release manager, and a CloudFormation action in CHANGE_SET_EXECUTE mode.
        fr: |-
          Remplacer l'action par une action CloudFormation en mode CHANGE_SET_REPLACE, une action d'approbation manuelle pour le responsable des versions, puis une action CloudFormation en mode CHANGE_SET_EXECUTE.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CHANGE_SET_REPLACE creates a change set that lists every resource to add, modify, or remove, including whether a modification requires replacement, without touching the stack. The manual approval action pauses the pipeline while the release manager reviews it, and CHANGE_SET_EXECUTE applies exactly that change set afterwards.
    fr: |-
      CHANGE_SET_REPLACE crée un jeu de modifications qui liste chaque ressource à ajouter, modifier ou supprimer, en indiquant si une modification exige un remplacement, sans toucher à la pile. L'action d'approbation manuelle met le pipeline en pause pendant l'examen du responsable des versions, puis CHANGE_SET_EXECUTE applique exactement ce jeu de modifications.
  options:
    a:
      en: |-
        Termination protection only prevents deleting the stack, and reviewing events after the update is too late: the instance has already been replaced.
      fr: |-
        La protection contre la résiliation empêche seulement la suppression de la pile, et l'examen des événements après la mise à jour arrive trop tard : l'instance a déjà été remplacée.
    b:
      en: |-
        A Git diff shows changed lines, not how CloudFormation will act on them; it doesn't reveal that a property change requires replacing the DB instance.
      fr: |-
        Un diff Git montre les lignes modifiées, pas la façon dont CloudFormation va les traiter ; il ne révèle pas qu'une modification de propriété exige le remplacement de l'instance de base de données.
    c:
      en: |-
        Drift detection compares the deployed resources with the template after the update has already run, so the approval comes after the change it should prevent.
      fr: |-
        La détection de dérive compare les ressources déployées avec le modèle une fois la mise à jour exécutée : l'approbation intervient après la modification qu'elle devait empêcher.
references:
  - title: CloudFormation deploy action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-CloudFormation.html
