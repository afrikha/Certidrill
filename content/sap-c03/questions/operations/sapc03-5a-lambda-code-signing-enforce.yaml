id: sapc03-5a-lambda-code-signing-enforce
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A financial company deploys AWS Lambda functions as .zip archives through AWS CodePipeline in 12 production accounts in AWS Organizations. Auditors require that production accounts run only code that the release pipeline built and signed. An unsigned or modified package, including one that an administrator uploads from the console, must be rejected at deployment. No new function may be created without this control. The pipeline already signs packages with an AWS Signer signing profile named release.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise financière déploie des fonctions AWS Lambda sous forme d'archives .zip par AWS CodePipeline dans 12 comptes de production d'AWS Organizations. Les auditeurs exigent que les comptes de production n'exécutent que du code généré et signé par le pipeline de publication. Un package non signé ou modifié, y compris un package qu'un administrateur charge depuis la console, doit être rejeté au déploiement. Aucune nouvelle fonction ne doit pouvoir être créée sans ce contrôle. Le pipeline signe déjà les packages avec un profil de signature AWS Signer nommé release.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create a Lambda code signing configuration that allows the release profile with UntrustedArtifactOnDeployment set to Enforce, and attach it to every production function.
        fr: |-
          Créer une configuration de signature de code Lambda qui autorise le profil release avec UntrustedArtifactOnDeployment défini à Enforce, et l'attacher à chaque fonction de production.
    - id: b
      text:
        en: |-
          Create a Lambda code signing configuration that allows the release profile with UntrustedArtifactOnDeployment set to Warn, and alarm on the SignatureValidationErrors metric.
        fr: |-
          Créer une configuration de signature de code Lambda qui autorise le profil release avec UntrustedArtifactOnDeployment défini à Warn, et créer une alarme sur la métrique SignatureValidationErrors.
    - id: c
      text:
        en: |-
          Turn on Amazon Inspector Lambda code scanning in the production accounts to find function packages that the release pipeline didn't build.
        fr: |-
          Activer l'analyse du code Lambda d'Amazon Inspector dans les comptes de production pour trouver les packages de fonctions que le pipeline de publication n'a pas générés.
    - id: d
      text:
        en: |-
          Attach an SCP to the production OU that denies lambda:CreateFunction unless the lambda:CodeSigningConfigArn condition key matches the approved code signing configuration.
        fr: |-
          Attacher à l'OU de production une SCP qui refuse lambda:CreateFunction sauf si la clé de condition lambda:CodeSigningConfigArn correspond à la configuration de signature de code approuvée.
    - id: e
      text:
        en: |-
          Add a bucket policy to the pipeline's artifact bucket that denies the upload of any object that doesn't carry an AWS Signer signature.
        fr: |-
          Ajouter au compartiment d'artefacts du pipeline une politique de compartiment qui refuse le chargement de tout objet ne portant pas de signature AWS Signer.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      With a code signing configuration in Enforce mode, Lambda checks every new .zip deployment (integrity, expiry, allowed profile, revocation) and blocks packages that fail, whoever uploads them. The lambda:CodeSigningConfigArn condition key lets an SCP block CreateFunction requests whose code signing configuration is missing or isn't the approved one, so no function can be created outside the control.
    fr: |-
      Avec une configuration de signature de code en mode Enforce, Lambda vérifie chaque nouveau déploiement .zip (intégrité, expiration, profil autorisé, révocation) et bloque les packages qui échouent, quel que soit l'auteur du chargement. La clé de condition lambda:CodeSigningConfigArn permet à une SCP de bloquer les requêtes CreateFunction dont la configuration de signature de code est absente ou n'est pas celle approuvée : aucune fonction ne peut être créée hors du contrôle.
  options:
    b:
      en: |-
        Warn mode lets the deployment proceed and only emits the metric and a CloudTrail entry, so unsigned code would still run.
      fr: |-
        Le mode Warn laisse le déploiement se poursuivre et émet seulement la métrique et une entrée CloudTrail : du code non signé s'exécuterait quand même.
    c:
      en: |-
        Inspector looks for vulnerabilities in code and packages; it doesn't verify who built or signed a package and doesn't block deployments.
      fr: |-
        Inspector recherche des vulnérabilités dans le code et les packages ; il ne vérifie pas qui a généré ou signé un package et ne bloque pas les déploiements.
    e:
      en: |-
        S3 bucket policies can't check signatures, and a console upload of a function package doesn't go through the pipeline's artifact bucket.
      fr: |-
        Les politiques de compartiment S3 ne peuvent pas vérifier des signatures, et le chargement d'un package de fonction depuis la console ne passe pas par le compartiment d'artefacts du pipeline.
references:
  - title: Using code signing to verify code integrity with Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-codesigning.html
  - title: Configuring IAM policies for Lambda code signing configurations - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/config-codesigning-policies.html
