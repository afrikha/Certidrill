id: sapc03-5b-alarm-opsitem-runbook
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is designing operations for a new platform that runs in 12 accounts. When a critical CloudWatch alarm goes to ALARM, the company wants an operational work item that lists the related resources, tracks its status from open to resolved, and offers Systems Manager Automation runbooks that engineers can run to remediate the issue. The on-call engineers must also receive a notification on their phones. The company has never used AWS Systems Manager before, and it wants AWS-managed features only.

    Which solution will meet these requirements?
  fr: |
    AnyCompany conçoit l'exploitation d'une nouvelle plateforme qui s'exécute dans 12 comptes. Quand une alarme CloudWatch critique passe à l'état ALARM, l'entreprise veut un élément de travail opérationnel qui liste les ressources associées, suit son statut d'ouvert à résolu et propose des runbooks Systems Manager Automation que les ingénieurs peuvent exécuter pour corriger le problème. Les ingénieurs d'astreinte doivent aussi recevoir une notification sur leur téléphone. L'entreprise n'a jamais utilisé AWS Systems Manager, et elle ne veut que des fonctionnalités gérées par AWS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure each critical alarm to create an incident in AWS Systems Manager Incident Manager, with a response plan that engages the on-call contacts and runs runbooks.", fr: "Configurer chaque alarme critique pour créer un incident dans AWS Systems Manager Incident Manager, avec un plan de réponse qui mobilise les contacts d'astreinte et exécute des runbooks." } }
    - { id: b, text: { en: "Configure each critical alarm to invoke an AWS Lambda function that opens a ticket in a self-hosted ticketing system on Amazon EC2 and sends an SMS message to the engineers.", fr: "Configurer chaque alarme critique pour appeler une fonction AWS Lambda qui ouvre un ticket dans un système de tickets autohébergé sur Amazon EC2 et envoie un SMS aux ingénieurs." } }
    - { id: c, text: { en: "Send the alarm state changes to AWS Security Hub as custom findings, and use Security Hub automation rules to assign each finding to the on-call engineers.", fr: "Envoyer les changements d'état des alarmes à AWS Security Hub comme résultats personnalisés, et utiliser des règles d'automatisation Security Hub pour attribuer chaque résultat aux ingénieurs d'astreinte." } }
    - { id: d, text: { en: "Configure each critical alarm with an action that creates an OpsItem in Systems Manager OpsCenter and an action that notifies an Amazon SNS topic with SMS subscribers.", fr: "Configurer chaque alarme critique avec une action qui crée un OpsItem dans Systems Manager OpsCenter et une action qui avertit une rubrique Amazon SNS avec des abonnés SMS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A CloudWatch alarm can create an OpsItem in OpsCenter when it enters the ALARM state; OpsCenter shows the related resources, tracks the status of the OpsItem, and lists Systems Manager Automation runbooks that remediate common issues. An SNS action on the same alarm sends the SMS notifications, and both are AWS-managed features."
    fr: "Une alarme CloudWatch peut créer un OpsItem dans OpsCenter quand elle passe à l'état ALARM ; OpsCenter affiche les ressources associées, suit le statut de l'OpsItem et liste les runbooks Systems Manager Automation qui corrigent les problèmes courants. Une action SNS sur la même alarme envoie les notifications SMS, et les deux sont des fonctionnalités gérées par AWS."
  options:
    a: { en: "Incident Manager closed to new customers on November 7, 2025, so a company that has never used it cannot adopt it for a new platform.", fr: "Incident Manager est fermé aux nouveaux clients depuis le 7 novembre 2025 : une entreprise qui ne l'a jamais utilisé ne peut pas l'adopter pour une nouvelle plateforme." }
    b: { en: "A self-hosted ticketing system and a custom function are not AWS-managed features, and they offer no Automation runbooks.", fr: "Un système de tickets autohébergé et une fonction personnalisée ne sont pas des fonctionnalités gérées par AWS, et ils ne proposent aucun runbook Automation." }
    c: { en: "Security Hub aggregates security findings; it is not an operational work item system with related resources and Automation runbooks.", fr: "Security Hub agrège des résultats de sécurité ; ce n'est pas un système d'éléments de travail opérationnels avec ressources associées et runbooks Automation." }
references:
  - title: Configure CloudWatch alarms to create OpsItems
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter-create-OpsItems-from-CloudWatch-Alarms.html
  - title: AWS Systems Manager OpsCenter
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/OpsCenter.html
