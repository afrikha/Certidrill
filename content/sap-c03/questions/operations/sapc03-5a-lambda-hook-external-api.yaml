id: sapc03-5a-lambda-hook-external-api
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's finance team keeps the list of valid cost centers in an internal CMDB that exposes a private REST API, and the list changes every week. The company has 90 member accounts in AWS Organizations and deploys only through AWS CloudFormation in us-east-1, eu-west-1, and ap-southeast-2. Every resource that a stack creates or updates must carry a CostCenter tag whose value exists in the CMDB at deployment time. A non-compliant stack operation must fail before the resource is provisioned, with the reason shown in the stack events. The control must reach new accounts automatically.

    Which solution will meet these requirements?
  fr: |
    L'équipe financière d'AnyCompany tient la liste des centres de coûts valides dans une CMDB interne qui expose une API REST privée, et la liste change chaque semaine. L'entreprise possède 90 comptes membres dans AWS Organizations et ne déploie qu'avec AWS CloudFormation, dans us-east-1, eu-west-1 et ap-southeast-2. Chaque ressource qu'une pile crée ou met à jour doit porter une étiquette CostCenter dont la valeur existe dans la CMDB au moment du déploiement. Une opération de pile non conforme doit échouer avant que la ressource ne soit provisionnée, avec la raison affichée dans les événements de la pile. Le contrôle doit atteindre automatiquement les nouveaux comptes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Write a Lambda function that checks the tag against the CMDB API, and register it with an AWS::CloudFormation::LambdaHook in FAIL mode for RESOURCE targets, deployed by a service-managed StackSet with automatic deployment to all OUs and the three Regions.
        fr: |-
          Écrire une fonction Lambda qui vérifie l'étiquette auprès de l'API de la CMDB, et l'enregistrer avec un AWS::CloudFormation::LambdaHook en mode FAIL pour les cibles RESOURCE, déployé par un StackSet à autorisations gérées par le service avec déploiement automatique sur toutes les OU et les trois Régions.
    - id: b
      text:
        en: |-
          Write CloudFormation Guard rules that list the valid CostCenter values, and register them with an AWS::CloudFormation::GuardHook in FAIL mode for RESOURCE targets, deployed by a service-managed StackSet with automatic deployment to all OUs and the three Regions.
        fr: |-
          Écrire des règles CloudFormation Guard qui listent les valeurs CostCenter valides, et les enregistrer avec un AWS::CloudFormation::GuardHook en mode FAIL pour les cibles RESOURCE, déployé par un StackSet à autorisations gérées par le service avec déploiement automatique sur toutes les OU et les trois Régions.
    - id: c
      text:
        en: |-
          Enable the AWS Control Tower proactive controls for resource tagging on all OUs, and configure the controls with the CMDB API endpoint as the source of the allowed CostCenter values.
        fr: |-
          Activer les contrôles proactifs AWS Control Tower d'étiquetage des ressources sur toutes les OU, et configurer les contrôles avec le point de terminaison de l'API de la CMDB comme source des valeurs CostCenter autorisées.
    - id: d
      text:
        en: |-
          Deploy an AWS Config custom Lambda rule that checks the tag against the CMDB API through an organization conformance pack, and call it in proactive evaluation mode from each deployment pipeline.
        fr: |-
          Déployer une règle AWS Config personnalisée Lambda qui vérifie l'étiquette auprès de l'API de la CMDB au moyen d'un pack de conformité d'organisation, et l'appeler en mode d'évaluation proactive depuis chaque pipeline de déploiement.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Lambda hook invokes a function before CloudFormation provisions each targeted resource, so the function can query the CMDB at deployment time; in FAIL mode a non-compliant result stops the operation and the message appears in the stack events. Hooks are registered per account and Region, so a service-managed StackSet with automatic deployment installs the hook in every member account and Region, including new accounts.
    fr: |-
      Un hook Lambda invoque une fonction avant que CloudFormation ne provisionne chaque ressource ciblée : la fonction peut donc interroger la CMDB au moment du déploiement ; en mode FAIL, un résultat non conforme arrête l'opération et le message apparaît dans les événements de la pile. Les hooks s'enregistrent par compte et par Région : un StackSet à autorisations gérées par le service avec déploiement automatique installe le hook dans chaque compte membre et chaque Région, y compris dans les nouveaux comptes.
  options:
    b:
      en: |-
        Guard rules are static and can't call an API; a list copied into the rules would be out of date as soon as the CMDB changes every week.
      fr: |-
        Les règles Guard sont statiques et ne peuvent pas appeler d'API ; une liste recopiée dans les règles serait périmée dès que la CMDB change, chaque semaine.
    c:
      en: |-
        Control Tower proactive controls are predefined controls from the Control Catalog; they can't be pointed at a custom API to validate tag values.
      fr: |-
        Les contrôles proactifs de Control Tower sont des contrôles prédéfinis du catalogue de contrôles ; on ne peut pas les faire pointer vers une API personnalisée pour valider des valeurs d'étiquettes.
    d:
      en: |-
        A Config rule never stops a CloudFormation operation; proactive evaluation only returns a compliance result to the caller, and it doesn't put the reason in the stack events.
      fr: |-
        Une règle Config n'arrête jamais une opération CloudFormation ; l'évaluation proactive renvoie seulement un résultat de conformité à l'appelant, et elle ne place pas la raison dans les événements de la pile.
references:
