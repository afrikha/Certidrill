id: sapc03-5b-eval-pipeline-gate
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company keeps the prompt templates of its Amazon Bedrock investment-research assistant in a Git repository. AWS CodePipeline deploys each template change from a tooling account to a staging account and then to a production account. Last quarter, a template change shortened the answers so much that key figures were missing, and nobody noticed for a week. The company has agreed with the business owners on a minimum average correctness score, measured against reference answers for a golden dataset of 300 questions. A template change that scores below this threshold must never reach production, and no person should have to review the results.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers conserve les modèles d'invites de son assistant de recherche en investissement basé sur Amazon Bedrock dans un dépôt Git. AWS CodePipeline déploie chaque modification de modèle d'invite d'un compte d'outillage vers un compte de préproduction, puis vers un compte de production. Le trimestre dernier, une modification a tellement raccourci les réponses que des chiffres clés manquaient, et personne ne s'en est aperçu pendant une semaine. L'entreprise a convenu avec les responsables métier d'un score d'exactitude moyen minimal, mesuré par rapport à des réponses de référence sur un jeu de données de référence (golden dataset) de 300 questions. Une modification dont le score est inférieur à ce seuil ne doit jamais atteindre la production, et personne ne doit avoir à examiner les résultats.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a manual approval action before the production stage, and attach a link to an Amazon Bedrock evaluation report that the reviewers check before they approve the change.", fr: "Ajouter une action d'approbation manuelle avant l'étape de production, avec un lien vers un rapport d'évaluation Amazon Bedrock que les approbateurs consultent avant d'approuver la modification." } }
    - { id: b, text: { en: "Add an on-success condition to the staging stage with a CloudWatch alarm on the InvocationLatency metric of the assistant, so that slower responses roll the stage back.", fr: "Ajouter à l'étape de préproduction une condition en cas de réussite (on-success) avec une alarme CloudWatch sur la métrique InvocationLatency de l'assistant, afin que des réponses plus lentes restaurent l'étape." } }
    - { id: c, text: { en: "Attach an Amazon Bedrock guardrail with a contextual grounding check to the production assistant, so that answers with a low grounding score are blocked for users.", fr: "Associer à l'assistant de production une barrière de protection Amazon Bedrock avec une vérification d'ancrage contextuel, afin que les réponses avec un faible score d'ancrage soient bloquées pour les utilisateurs." } }
    - { id: d, text: { en: "Add an AWS CodeBuild action to the staging stage that runs a judge-based evaluation job on the golden dataset, reads the report, and fails when the correctness score is below the threshold.", fr: "Ajouter à l'étape de préproduction une action AWS CodeBuild qui exécute une tâche d'évaluation avec modèle juge sur le jeu de données de référence, lit le rapport et échoue quand le score d'exactitude est inférieur au seuil." } }
answer: { optionId: d }
explanation:
  correct:
    en: "A judge-based evaluation job scores the assistant's answers with built-in metrics such as correctness, and it uses the reference responses of the prompt dataset when they are supplied. A build action that starts the job, waits for the report in Amazon S3, and fails below the agreed threshold stops the pipeline before the production stage, with no human review."
    fr: "Une tâche d'évaluation avec modèle juge note les réponses de l'assistant avec des métriques intégrées comme l'exactitude, et elle utilise les réponses de référence du jeu de données d'invites lorsqu'elles sont fournies. Une action de build qui lance la tâche, attend le rapport dans Amazon S3 et échoue sous le seuil convenu arrête le pipeline avant l'étape de production, sans relecture humaine."
  options:
    a: { en: "A manual approval relies on a person reading the report, which the company explicitly wants to avoid.", fr: "Une approbation manuelle repose sur une personne qui lit le rapport, ce que l'entreprise veut explicitement éviter." }
    b: { en: "Latency says nothing about missing figures or correctness, so a shorter but wrong answer would pass the condition.", fr: "La latence ne dit rien des chiffres manquants ni de l'exactitude : une réponse plus courte mais fausse passerait la condition." }
    c: { en: "A guardrail acts at run time after the change is deployed and checks grounding in a source, not correctness against reference answers; the faulty template still reaches production.", fr: "Une barrière de protection agit à l'exécution, après le déploiement, et vérifie l'ancrage dans une source, pas l'exactitude par rapport à des réponses de référence ; le modèle d'invite défectueux atteint quand même la production." }
references:
  - title: Evaluate model performance using another LLM as a judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-judge.html
  - title: Create a prompt dataset for a model evaluation job that uses a model as judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
