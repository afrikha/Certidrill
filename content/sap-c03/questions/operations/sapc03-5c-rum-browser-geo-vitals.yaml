id: sapc03-5c-rum-browser-geo-vitals
objective: "5.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany, a retailer, runs a single-page web storefront that is served by Amazon CloudFront from an S3 origin and calls APIs on Amazon API Gateway in eu-west-1. The workloads run in separate production accounts in AWS Organizations, and the back-end services already publish metrics and traces to Amazon CloudWatch. Customers in several countries complain that product pages feel slow, but every back-end latency metric is within target. The product team wants to see page load times, Core Web Vitals, and JavaScript errors as experienced by actual visitors, broken down by browser, device type, and country. The team wants a managed AWS solution and will add a script to the web pages if needed.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, un détaillant, exploite une vitrine web monopage servie par Amazon CloudFront depuis une origine S3, qui appelle des API sur Amazon API Gateway dans eu-west-1. Les charges de travail s'exécutent dans des comptes de production distincts d'AWS Organizations, et les services back-end publient déjà des métriques et des traces dans Amazon CloudWatch. Des clients de plusieurs pays se plaignent de la lenteur des pages produits, mais toutes les métriques de latence du back-end respectent les objectifs. L'équipe produit veut voir les temps de chargement des pages, les Core Web Vitals et les erreurs JavaScript tels que les visiteurs réels les subissent, ventilés par navigateur, type d'appareil et pays. L'équipe veut une solution AWS gérée et ajoutera un script aux pages web si nécessaire.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create CloudWatch Synthetics canaries from the heartbeat blueprint in three Regions near the customers, and chart the Duration metric of each canary by Location.
        fr: |-
          Créer des canaries CloudWatch Synthetics à partir du plan heartbeat dans trois Régions proches des clients, et représenter la métrique Duration de chaque canary par Location.
    - id: b
      text:
        en: |-
          Create a CloudWatch RUM app monitor for the storefront domain, add the generated code snippet to the pages, and authorize the web client with an Amazon Cognito identity pool.
        fr: |-
          Créer un moniteur d'application CloudWatch RUM pour le domaine de la vitrine, ajouter l'extrait de code généré aux pages, et autoriser le client web avec un groupe d'identités Amazon Cognito.
    - id: c
      text:
        en: |-
          Turn on CloudFront standard logs to an S3 bucket, and query the time-taken field by viewer country and user agent with Amazon Athena.
        fr: |-
          Activer les journaux standard CloudFront vers un compartiment S3, et interroger le champ time-taken par pays et par agent utilisateur du lecteur avec Amazon Athena.
    - id: d
      text:
        en: |-
          Turn on X-Ray active tracing in API Gateway, and group the traces in the CloudWatch trace map by the client IP address and user agent of each request.
        fr: |-
          Activer le traçage actif X-Ray dans API Gateway, et regrouper les traces de la carte des traces CloudWatch par adresse IP cliente et agent utilisateur de chaque requête.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudWatch RUM collects client-side data from real user sessions: page load times, Core Web Vitals, JavaScript and HTTP errors, with breakdowns by browser, device, and geolocation. The app monitor generates a snippet that loads the RUM web client into the pages, and a Cognito identity pool is the simplest way to authorize the client to send events.
    fr: |-
      CloudWatch RUM collecte des données côté client à partir de sessions d'utilisateurs réels : temps de chargement des pages, Core Web Vitals, erreurs JavaScript et HTTP, ventilés par navigateur, appareil et géolocalisation. Le moniteur d'application génère un extrait qui charge le client web RUM dans les pages, et un groupe d'identités Cognito est le moyen le plus simple d'autoriser le client à envoyer des événements.
  options:
    a:
      en: |-
        Canaries are synthetic transactions from AWS Regions; they don't measure what real visitors experience in their own browsers, devices, and countries.
      fr: |-
        Les canaries sont des transactions synthétiques exécutées depuis des Régions AWS ; ils ne mesurent pas ce que vivent les visiteurs réels dans leurs propres navigateurs, appareils et pays.
    c:
      en: |-
        CloudFront logs measure the time to serve each object from the edge, not the rendering time in the browser, Core Web Vitals, or JavaScript errors.
      fr: |-
        Les journaux CloudFront mesurent le temps de service de chaque objet depuis la périphérie, pas le temps de rendu dans le navigateur, les Core Web Vitals ou les erreurs JavaScript.
    d:
      en: |-
        Back-end traces show server-side latency, which is already within target; they don't capture what happens in the browser.
      fr: |-
        Les traces du back-end montrent la latence côté serveur, déjà conforme aux objectifs ; elles ne capturent pas ce qui se passe dans le navigateur.
references:
  - title: "CloudWatch RUM - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM.html
  - title: "Creating a CloudWatch RUM app monitor for a web application"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-get-started-create-app-monitor.html
