id: sapc03-5a-config-stack-drift-rule
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys all its resources with AWS CloudFormation in 40 accounts in AWS Organizations. During incidents, operators sometimes change resources directly in the console, and these changes are lost or cause failures at the next stack update. The operations team wants every stack in every account to be checked for drift automatically, a central view of the stacks that have drifted, and a notification when a stack becomes drifted. AWS Config already records resources in every account and aggregates them into a central account. The team wants a managed solution with no custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie toutes ses ressources avec AWS CloudFormation dans 40 comptes d'AWS Organizations. Pendant les incidents, des opérateurs modifient parfois des ressources directement dans la console, et ces modifications sont perdues ou provoquent des échecs lors de la mise à jour suivante de la pile. L'équipe des opérations veut que chaque pile de chaque compte soit vérifiée automatiquement pour détecter les dérives, une vue centrale des piles qui ont dérivé, et une notification lorsqu'une pile dérive. AWS Config enregistre déjà les ressources de chaque compte et les agrège dans un compte central. L'équipe veut une solution gérée sans code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on termination protection for every stack, and attach an SCP that denies write actions on resources tagged with aws:cloudformation:stack-name for all principals.
        fr: |-
          Activer la protection contre la résiliation de chaque pile, et attacher une SCP qui refuse à tous les principaux les actions d'écriture sur les ressources étiquetées aws:cloudformation:stack-name.
    - id: b
      text:
        en: |-
          Deploy the cloudformation-stack-drift-detection-check managed rule as an organization AWS Config rule with a role that can detect drift, and route its compliance changes to Amazon SNS through EventBridge.
        fr: |-
          Déployer la règle gérée cloudformation-stack-drift-detection-check sous forme de règle AWS Config d'organisation avec un rôle capable de détecter la dérive, et acheminer ses changements de conformité vers Amazon SNS par EventBridge.
    - id: c
      text:
        en: |-
          Schedule a Lambda function in each account that calls DetectStackDrift for every stack and writes the drift status of each stack to a DynamoDB table in the central account, with an SNS notification for drifted stacks.
        fr: |-
          Planifier dans chaque compte une fonction Lambda qui appelle DetectStackDrift pour chaque pile et écrit l'état de dérive de chaque pile dans une table DynamoDB du compte central, avec une notification SNS pour les piles qui ont dérivé.
    - id: d
      text:
        en: |-
          Create a CloudTrail Lake event data store in the central account and run a daily query that lists write API calls on stack resources that CloudFormation didn't make.
        fr: |-
          Créer un magasin de données d'événements CloudTrail Lake dans le compte central et exécuter chaque jour une requête qui liste les appels d'API d'écriture sur des ressources de piles qui n'ont pas été faits par CloudFormation.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The cloudformation-stack-drift-detection-check managed rule runs drift detection on each stack, on configuration changes and periodically, and marks a stack NON_COMPLIANT when its drift status is DRIFTED. Deployed as an organization rule, its results appear in the existing aggregator, and EventBridge can route compliance change events to SNS. The rule needs the ARN of a role with drift detection permissions as its parameter.
    fr: |-
      La règle gérée cloudformation-stack-drift-detection-check lance la détection de dérive sur chaque pile, lors des modifications de configuration et périodiquement, et marque une pile NON_COMPLIANT lorsque son état de dérive est DRIFTED. Déployée comme règle d'organisation, ses résultats apparaissent dans l'agrégateur existant, et EventBridge peut acheminer les événements de changement de conformité vers SNS. La règle a besoin en paramètre de l'ARN d'un rôle disposant des autorisations de détection de dérive.
  options:
    a:
      en: |-
        Termination protection only prevents deleting stacks, and this SCP would also break operators' incident work; neither detects or reports drift.
      fr: |-
        La protection contre la résiliation empêche seulement la suppression des piles, et cette SCP bloquerait aussi le travail des opérateurs pendant les incidents ; aucune des deux ne détecte ni ne signale la dérive.
    c:
      en: |-
        This works but is custom code to write and maintain in 40 accounts, and it duplicates what the managed Config rule already provides.
      fr: |-
        Cela fonctionne, mais c'est du code personnalisé à écrire et maintenir dans 40 comptes, qui reproduit ce que la règle Config gérée fournit déjà.
    d:
      en: |-
        A query on API calls doesn't compare resources with their templates, so it isn't drift detection, and it needs custom queries and alerting.
      fr: |-
        Une requête sur les appels d'API ne compare pas les ressources avec leurs modèles : ce n'est pas une détection de dérive, et elle exige des requêtes et des alertes personnalisées.
references:
  - title: cloudformation-stack-drift-detection-check - AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/cloudformation-stack-drift-detection-check.html
