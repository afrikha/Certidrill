id: sapc03-5a-stage-conditions-window
objective: "5.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company deploys an order service to its production account with a V2 AWS CodePipeline pipeline. Change management allows production deployments only from Tuesday to Thursday between 09:00 and 16:00 in the Europe/Paris time zone. A production deployment also must not start while an Amazon CloudWatch alarm named StagingHealth, which summarizes the health of the staging environment, is in the ALARM state. Today, an engineer checks both conditions before completing a manual approval action, which delays releases and was bypassed twice last quarter. The company wants the pipeline itself to enforce both conditions, with no custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie un service de commandes dans son compte de production avec un pipeline AWS CodePipeline V2. La gestion des changements n'autorise les déploiements en production que du mardi au jeudi, entre 09:00 et 16:00 dans le fuseau horaire Europe/Paris. Un déploiement en production ne doit pas non plus démarrer tant qu'une alarme Amazon CloudWatch nommée StagingHealth, qui résume l'état de l'environnement de préproduction, est à l'état ALARM. Aujourd'hui, un ingénieur vérifie les deux conditions avant de valider une action d'approbation manuelle, ce qui retarde les publications et a été contourné deux fois le trimestre dernier. L'entreprise veut que le pipeline lui-même applique les deux conditions, sans code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add an entry condition with the Skip result to the production stage, with a DeploymentWindow rule for the allowed hours and a CloudWatchAlarm rule on StagingHealth.
        fr: |-
          Ajouter à l'étape de production une condition d'entrée avec le résultat Skip, avec une règle DeploymentWindow pour les heures autorisées et une règle CloudWatchAlarm sur StagingHealth.
    - id: b
      text:
        en: |-
          Create two EventBridge Scheduler schedules that disable and enable the transition into the production stage at the window boundaries, and keep the manual approval to check the alarm.
        fr: |-
          Créer deux planifications EventBridge Scheduler qui désactivent et activent la transition vers l'étape de production aux limites de la fenêtre, et conserver l'approbation manuelle pour vérifier l'alarme.
    - id: c
      text:
        en: |-
          Add an entry condition with the Fail result to the production stage, with a LambdaInvoke rule that runs a function which checks the calendar in the Europe/Paris time zone and the state of StagingHealth.
        fr: |-
          Ajouter à l'étape de production une condition d'entrée avec le résultat Fail, avec une règle LambdaInvoke qui exécute une fonction vérifiant le calendrier dans le fuseau horaire Europe/Paris et l'état de StagingHealth.
    - id: d
      text:
        en: |-
          Add an entry condition with the Fail result to the production stage, with a DeploymentWindow rule for the allowed days and hours in Europe/Paris, and a CloudWatchAlarm rule on StagingHealth.
        fr: |-
          Ajouter à l'étape de production une condition d'entrée avec le résultat Fail, avec une règle DeploymentWindow pour les jours et heures autorisés en Europe/Paris, et une règle CloudWatchAlarm sur StagingHealth.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Stage conditions are evaluated by the pipeline: an entry (beforeEntry) condition checks its rules before the stage starts, and with the Fail result the stage doesn't run when a rule isn't met. The managed DeploymentWindow rule takes a cron expression and an optional time zone, and the CloudWatchAlarm rule checks the alarm state, so both controls are enforced without code or human steps.
    fr: |-
      Les conditions d'étape sont évaluées par le pipeline : une condition d'entrée (beforeEntry) vérifie ses règles avant le démarrage de l'étape, et avec le résultat Fail l'étape ne s'exécute pas lorsqu'une règle n'est pas satisfaite. La règle gérée DeploymentWindow accepte une expression cron et un fuseau horaire facultatif, et la règle CloudWatchAlarm vérifie l'état de l'alarme : les deux contrôles sont appliqués sans code ni intervention humaine.
  options:
    a:
      en: |-
        Entry conditions with the Skip result support only LambdaInvoke and VariableCheck rules; skipping production would also let the execution finish as if it had deployed.
      fr: |-
        Les conditions d'entrée avec le résultat Skip ne prennent en charge que les règles LambdaInvoke et VariableCheck ; ignorer la production laisserait en outre l'exécution se terminer comme si elle avait déployé.
    b:
      en: |-
        Schedules that toggle transitions are extra automation to maintain, and the alarm check would still depend on a person, which was bypassed before.
      fr: |-
        Des planifications qui basculent les transitions sont une automatisation supplémentaire à maintenir, et la vérification de l'alarme dépendrait toujours d'une personne, ce qui a déjà été contourné.
    c:
      en: |-
        A LambdaInvoke rule works, but it requires custom code, while managed DeploymentWindow and CloudWatchAlarm rules already provide both checks.
      fr: |-
        Une règle LambdaInvoke fonctionne, mais exige du code personnalisé, alors que les règles gérées DeploymentWindow et CloudWatchAlarm fournissent déjà les deux vérifications.
references:
  - title: Configure conditions for a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html
