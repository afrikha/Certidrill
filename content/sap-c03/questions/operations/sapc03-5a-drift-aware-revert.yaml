id: sapc03-5a-drift-aware-revert
objective: "5.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    During an incident, an engineer manually added an inbound rule that allows TCP port 22 from 0.0.0.0/0 to a security group, and changed the timeout of an AWS Lambda function. Both resources are managed by an AWS CloudFormation stack named payments-api, and drift detection reports both as MODIFIED. The template in Git is correct and hasn't changed since the last deployment. The security team wants the stack's resources returned to the configuration in the template. The fix must be a CloudFormation operation that can be reviewed before it runs, without editing the template and without deleting or recreating any resource.

    Which solution will meet these requirements?
  fr: |
    Pendant un incident, un ingénieur a ajouté manuellement à un groupe de sécurité une règle entrante qui autorise le port TCP 22 depuis 0.0.0.0/0, et a modifié le délai d'expiration d'une fonction AWS Lambda. Les deux ressources sont gérées par une pile AWS CloudFormation nommée payments-api, et la détection de dérive les signale toutes deux comme MODIFIED. Le modèle dans Git est correct et n'a pas changé depuis le dernier déploiement. L'équipe de sécurité veut que les ressources de la pile reviennent à la configuration du modèle. La correction doit être une opération CloudFormation que l'on peut examiner avant son exécution, sans modifier le modèle et sans supprimer ni recréer aucune ressource.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a standard change set for payments-api with the unchanged template, review it, and execute it so that CloudFormation reapplies the template values to the drifted resources.
        fr: |-
          Créer un jeu de modifications standard pour payments-api avec le modèle inchangé, l'examiner, puis l'exécuter pour que CloudFormation réapplique les valeurs du modèle aux ressources qui ont dérivé.
    - id: b
      text:
        en: |-
          Set DeletionPolicy to Retain on both resources, remove them from payments-api, and import them into a new stack with the template so that CloudFormation records their template values.
        fr: |-
          Définir DeletionPolicy à Retain sur les deux ressources, les retirer de payments-api, puis les importer dans une nouvelle pile avec le modèle pour que CloudFormation enregistre leurs valeurs du modèle.
    - id: c
      text:
        en: |-
          Update payments-api from the pipeline with a CloudFormation action in REPLACE_ON_FAILURE mode so that CloudFormation recreates the drifted resources from the template.
        fr: |-
          Mettre à jour payments-api depuis le pipeline avec une action CloudFormation en mode REPLACE_ON_FAILURE pour que CloudFormation recrée les ressources qui ont dérivé à partir du modèle.
    - id: d
      text:
        en: |-
          Create a change set for payments-api with the unchanged template and --deployment-mode REVERT_DRIFT, review the proposed changes to the drifted properties, and execute it.
        fr: |-
          Créer un jeu de modifications pour payments-api avec le modèle inchangé et --deployment-mode REVERT_DRIFT, examiner les modifications proposées sur les propriétés qui ont dérivé, puis l'exécuter.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A drift-aware change set compares three states: the actual configuration read from the service APIs, the previous deployment, and the new template. It therefore proposes updates that bring drifted properties back to the template values even when the template didn't change, and the change set can be reviewed before execution. The security group rule and the function timeout are updated in place, without replacement.
    fr: |-
      Un jeu de modifications sensible à la dérive compare trois états : la configuration réelle lue par les API des services, le déploiement précédent et le nouveau modèle. Il propose donc des mises à jour qui ramènent les propriétés ayant dérivé aux valeurs du modèle même si le modèle n'a pas changé, et le jeu de modifications peut être examiné avant son exécution. La règle du groupe de sécurité et le délai d'expiration de la fonction sont mis à jour sur place, sans remplacement.
  options:
    a:
      en: |-
        A standard change set compares the new template with the previous template only; with an unchanged template it reports no changes and leaves the drift in place.
      fr: |-
        Un jeu de modifications standard compare uniquement le nouveau modèle au modèle précédent ; avec un modèle inchangé, il n'indique aucune modification et laisse la dérive en place.
    b:
      en: |-
        Importing resources takes them over with their current configuration; it doesn't change the security group rule or the timeout, so the drift remains.
      fr: |-
        L'importation prend en charge les ressources avec leur configuration actuelle ; elle ne modifie ni la règle du groupe de sécurité ni le délai d'expiration, donc la dérive demeure.
    c:
      en: |-
        REPLACE_ON_FAILURE deletes and recreates the whole stack only when it is in a failed state; otherwise it performs a normal update, which ignores the drift.
      fr: |-
        REPLACE_ON_FAILURE supprime et recrée la pile entière uniquement lorsqu'elle est dans un état d'échec ; sinon, il effectue une mise à jour normale, qui ignore la dérive.
references:
  - title: Using drift-aware change sets - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/drift-aware-change-sets.html
