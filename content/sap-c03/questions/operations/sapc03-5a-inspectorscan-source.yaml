id: sapc03-5a-inspectorscan-source
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's application source code is in GitHub. A V2 AWS CodePipeline pipeline builds a container image with AWS CodeBuild and pushes it to Amazon ECR. The security team wants the pipeline to stop before the build stage if the third-party dependencies in the source code have any critical vulnerability or more than five high vulnerabilities. A software bill of materials (SBOM) of the scanned code must be kept as an artifact of each execution. The company wants to use a managed pipeline action instead of installing and maintaining scanner tools.

    Which solution will meet these requirements?
  fr: |
    Le code source de l'application d'une entreprise se trouve dans GitHub. Un pipeline AWS CodePipeline V2 génère une image de conteneur avec AWS CodeBuild et l'envoie dans Amazon ECR. L'équipe de sécurité veut que le pipeline s'arrête avant l'étape de génération si les dépendances tierces du code source présentent la moindre vulnérabilité critique ou plus de cinq vulnérabilités élevées. Une nomenclature logicielle (SBOM) du code analysé doit être conservée comme artefact de chaque exécution. L'entreprise veut utiliser une action de pipeline gérée au lieu d'installer et de maintenir des outils d'analyse.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on Amazon ECR enhanced scanning with continuous scanning, and add an Amazon EventBridge rule that stops the pipeline execution when Amazon Inspector reports a critical finding for the image.
        fr: |-
          Activer l'analyse améliorée d'Amazon ECR avec analyse continue, et ajouter une règle Amazon EventBridge qui arrête l'exécution du pipeline lorsqu'Amazon Inspector signale un résultat critique pour l'image.
    - id: b
      text:
        en: |-
          Add an InspectorScan action in SourceCodeScan mode before the build stage, with CriticalThreshold set to 0 and HighThreshold set to 5, and keep its SBOM output artifact.
        fr: |-
          Ajouter une action InspectorScan en mode SourceCodeScan avant l'étape de génération, avec CriticalThreshold défini à 0 et HighThreshold défini à 5, et conserver son artefact de sortie SBOM.
    - id: c
      text:
        en: |-
          Add an InspectorScan action in ECRImageScan mode before the build stage, with CriticalThreshold set to 0 and HighThreshold set to 5, and keep its SBOM output artifact.
        fr: |-
          Ajouter une action InspectorScan en mode ECRImageScan avant l'étape de génération, avec CriticalThreshold défini à 0 et HighThreshold défini à 5, et conserver son artefact de sortie SBOM.
    - id: d
      text:
        en: |-
          Turn on Amazon Inspector Lambda code scanning in the account, and add a manual approval action before the build stage for the security team to review the findings.
        fr: |-
          Activer l'analyse du code Lambda d'Amazon Inspector dans le compte, et ajouter une action d'approbation manuelle avant l'étape de génération pour que l'équipe de sécurité examine les résultats.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      The InspectorScan action in SourceCodeScan mode scans the source artifact for vulnerable dependencies and fails the action when the number of findings at a severity exceeds its threshold, so 0 critical and 5 high stop the pipeline before the build. Its output artifact is an SBOM of the scanned code, and it runs on CodePipeline-managed compute with no scanner to maintain.
    fr: |-
      L'action InspectorScan en mode SourceCodeScan analyse l'artefact source à la recherche de dépendances vulnérables et fait échouer l'action lorsque le nombre de résultats d'une gravité dépasse son seuil : 0 critique et 5 élevées arrêtent le pipeline avant la génération. Son artefact de sortie est une SBOM du code analysé, et elle s'exécute sur un calcul géré par CodePipeline, sans analyseur à maintenir.
  options:
    a:
      en: |-
        ECR scanning runs after the image is built and pushed, so the check comes after the build stage, and the EventBridge rule needs custom glue to stop the execution.
      fr: |-
        L'analyse ECR s'exécute après la génération et l'envoi de l'image : le contrôle intervient après l'étape de génération, et la règle EventBridge exige une colle personnalisée pour arrêter l'exécution.
    c:
      en: |-
        ECRImageScan mode scans an image that is already in ECR; before the build stage, no image exists yet.
      fr: |-
        Le mode ECRImageScan analyse une image déjà présente dans ECR ; avant l'étape de génération, aucune image n'existe encore.
    d:
      en: |-
        Lambda code scanning covers deployed Lambda functions, not the dependencies of a container application in a pipeline, and a manual review doesn't enforce the thresholds.
      fr: |-
        L'analyse du code Lambda couvre les fonctions Lambda déployées, pas les dépendances d'une application conteneurisée dans un pipeline, et un examen manuel n'applique pas les seuils.
references:
  - title: Amazon Inspector InspectorScan invoke action reference - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/action-reference-InspectorScan.html
