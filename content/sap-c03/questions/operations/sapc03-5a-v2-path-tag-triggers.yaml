id: sapc03-5a-v2-path-tag-triggers
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps the code of three microservices in one GitHub monorepo, in the folders services/orders, services/billing, and services/catalog. Each service has its own AWS CodePipeline pipeline that deploys it to a test environment, with a source action connected through AWS CodeConnections. Today, every push to the main branch starts all three pipelines, so unchanged services are redeployed several times a day. A separate release pipeline deploys all three services to production, and it must start only when a Git tag that matches v* is pushed. The company wants to remove the unnecessary executions with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve le code de trois microservices dans un même dépôt GitHub (monorepo), dans les dossiers services/orders, services/billing et services/catalog. Chaque service a son propre pipeline AWS CodePipeline qui le déploie dans un environnement de test, avec une action source connectée par AWS CodeConnections. Aujourd'hui, chaque push sur la branche main démarre les trois pipelines, si bien que des services inchangés sont redéployés plusieurs fois par jour. Un pipeline de publication distinct déploie les trois services en production, et il ne doit démarrer que lorsqu'une balise Git correspondant à v* est poussée. L'entreprise veut supprimer les exécutions inutiles avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Keep V1 pipelines with change detection turned off, and add an Amazon EventBridge rule with a Lambda function that inspects each push and starts only the pipelines whose folders or tags match.
        fr: |-
          Conserver des pipelines V1 avec la détection des modifications désactivée, et ajouter une règle Amazon EventBridge avec une fonction Lambda qui inspecte chaque push et ne démarre que les pipelines dont les dossiers ou les balises correspondent.
    - id: b
      text:
        en: |-
          Keep the current triggers, and add to the first stage of each service pipeline an entry condition with a VariableCheck rule that skips the stage when the service folder didn't change.
        fr: |-
          Conserver les déclencheurs actuels, et ajouter à la première étape de chaque pipeline de service une condition d'entrée avec une règle VariableCheck qui ignore l'étape lorsque le dossier du service n'a pas changé.
    - id: c
      text:
        en: |-
          Use V2 pipelines whose push triggers filter the main branch and the file path of each service folder, and give the release pipeline a push trigger that filters Git tags matching v*.
        fr: |-
          Utiliser des pipelines V2 dont les déclencheurs push filtrent la branche main et le chemin de fichier du dossier de chaque service, et donner au pipeline de publication un déclencheur push qui filtre les balises Git correspondant à v*.
    - id: d
      text:
        en: |-
          Configure GitHub webhooks that call an Amazon API Gateway endpoint, with a Lambda function that reads the changed files and calls StartPipelineExecution for the right pipelines.
        fr: |-
          Configurer des webhooks GitHub qui appellent un point de terminaison Amazon API Gateway, avec une fonction Lambda qui lit les fichiers modifiés et appelle StartPipelineExecution pour les bons pipelines.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      V2 pipelines support triggers with filters on the source action: a push trigger can include branches and file paths (glob patterns such as services/orders/**), and another can include Git tags such as v*. Each pipeline then starts only for relevant pushes, with no code to write or run.
    fr: |-
      Les pipelines V2 prennent en charge des déclencheurs avec filtres sur l'action source : un déclencheur push peut inclure des branches et des chemins de fichiers (modèles glob comme services/orders/**), et un autre peut inclure des balises Git comme v*. Chaque pipeline ne démarre alors que pour les push pertinents, sans code à écrire ni à exécuter.
  options:
    a:
      en: |-
        This works, but the EventBridge rule and the Lambda function are custom glue to build and maintain, which V2 trigger filters make unnecessary.
      fr: |-
        Cela fonctionne, mais la règle EventBridge et la fonction Lambda sont une colle personnalisée à créer et maintenir, que les filtres de déclencheurs V2 rendent inutile.
    b:
      en: |-
        Every pipeline still starts an execution for every push, and VariableCheck compares a pipeline variable with a value; it can't tell which folders a commit changed.
      fr: |-
        Chaque pipeline démarre toujours une exécution pour chaque push, et VariableCheck compare une variable de pipeline à une valeur ; il ne peut pas savoir quels dossiers un commit a modifiés.
    d:
      en: |-
        Webhooks with API Gateway and Lambda rebuild trigger filtering in custom code, which adds components to secure and operate.
      fr: |-
        Des webhooks avec API Gateway et Lambda reconstruisent le filtrage des déclencheurs en code personnalisé, ce qui ajoute des composants à sécuriser et à exploiter.
references:
