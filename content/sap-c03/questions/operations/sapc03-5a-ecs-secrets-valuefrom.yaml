id: sapc03-5a-ecs-secrets-valuefrom
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An application team deploys an Amazon ECS service on AWS Fargate (platform version 1.4.0) with AWS CloudFormation. In the task definition, the environment variable DB_PASSWORD is set to the dynamic reference {{resolve:secretsmanager:prod/orders-db:SecretString:password}}. AWS Secrets Manager rotates the secret every 30 days. A review found two problems. Anyone with ecs:DescribeTaskDefinition permission can read the password in clear text. After each rotation, newly started tasks keep receiving the old password until someone updates the stack. The team wants new tasks to receive the current password without a stack update, and the value must not be stored in the task definition.

    Which solution will meet these requirements?
  fr: |
    Une équipe applicative déploie un service Amazon ECS sur AWS Fargate (version de plateforme 1.4.0) avec AWS CloudFormation. Dans la définition de tâche, la variable d'environnement DB_PASSWORD reçoit la référence dynamique {{resolve:secretsmanager:prod/orders-db:SecretString:password}}. AWS Secrets Manager fait la rotation du secret tous les 30 jours. Une revue a relevé deux problèmes. Toute personne disposant de l'autorisation ecs:DescribeTaskDefinition peut lire le mot de passe en clair. Après chaque rotation, les tâches nouvellement démarrées continuent de recevoir l'ancien mot de passe jusqu'à ce que quelqu'un mette à jour la pile. L'équipe veut que les nouvelles tâches reçoivent le mot de passe actuel sans mise à jour de pile, et la valeur ne doit pas être stockée dans la définition de tâche.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the environment variable with a secrets entry whose valueFrom is the secret ARN with the password JSON key, and grant the task execution role secretsmanager:GetSecretValue on the secret.
        fr: |-
          Remplacer la variable d'environnement par une entrée secrets dont valueFrom est l'ARN du secret avec la clé JSON password, et accorder au rôle d'exécution de tâche secretsmanager:GetSecretValue sur le secret.
    - id: b
      text:
        en: |-
          Pin the dynamic reference to the AWSCURRENT version stage, and add the NoEcho attribute to the environment variable so that the value is masked in the task definition.
        fr: |-
          Épingler la référence dynamique sur l'étiquette intermédiaire AWSCURRENT, et ajouter l'attribut NoEcho à la variable d'environnement pour que la valeur soit masquée dans la définition de tâche.
    - id: c
      text:
        en: |-
          Store the password in a Parameter Store SecureString parameter, and replace the secretsmanager reference with an ssm-secure dynamic reference in the environment variable.
        fr: |-
          Stocker le mot de passe dans un paramètre SecureString de Parameter Store, et remplacer la référence secretsmanager par une référence dynamique ssm-secure dans la variable d'environnement.
    - id: d
      text:
        en: |-
          Add an Amazon EventBridge rule on the rotation event that starts the deployment pipeline, so that the stack is updated with the new password after every rotation and new tasks start with it.
        fr: |-
          Ajouter une règle Amazon EventBridge sur l'événement de rotation qui démarre le pipeline de déploiement, pour que la pile soit mise à jour avec le nouveau mot de passe après chaque rotation et que les nouvelles tâches démarrent avec lui.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With a secrets entry, the task definition stores only the secret ARN; the ECS agent retrieves the value with the task execution role and injects it when each container starts. A task started after a rotation therefore gets the current password without any stack update, and DescribeTaskDefinition shows only the reference. JSON keys need Fargate platform version 1.4.0 or later, which the service uses.
    fr: |-
      Avec une entrée secrets, la définition de tâche ne stocke que l'ARN du secret ; l'agent ECS récupère la valeur avec le rôle d'exécution de tâche et l'injecte au démarrage de chaque conteneur. Une tâche démarrée après une rotation reçoit donc le mot de passe actuel sans mise à jour de pile, et DescribeTaskDefinition ne montre que la référence. Les clés JSON exigent la version de plateforme Fargate 1.4.0 ou ultérieure, que le service utilise.
  options:
    b:
      en: |-
        A dynamic reference is resolved into the task definition at deployment, so the clear-text value stays there; NoEcho applies to template parameters, not to resource properties.
      fr: |-
        Une référence dynamique est résolue dans la définition de tâche au déploiement : la valeur en clair y reste ; NoEcho s'applique aux paramètres de modèle, pas aux propriétés des ressources.
    c:
      en: |-
        ssm-secure references work only on a short list of properties, which doesn't include ECS environment variables, and any resolved value would still be stored in the task definition.
      fr: |-
        Les références ssm-secure ne fonctionnent que sur une courte liste de propriétés, qui n'inclut pas les variables d'environnement ECS, et toute valeur résolue resterait stockée dans la définition de tâche.
    d:
      en: |-
        Redeploying after each rotation still writes the clear-text password into the task definition, and adds a dependency on the pipeline.
      fr: |-
        Redéployer après chaque rotation écrit toujours le mot de passe en clair dans la définition de tâche, et ajoute une dépendance au pipeline.
references:
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
  - title: Get a secret or secret value from Secrets Manager - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
