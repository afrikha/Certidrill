id: sapc03-5c-canary-multi-checks-partners
objective: "5.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company depends on two partners for its order flow. The company must verify every 5 minutes that the partner's DNS record for its API resolves to the expected value, that the TLS certificate of that API isn't close to expiry, that the partner's SFTP server accepts TCP connections on port 22, and that two HTTPS API endpoints return HTTP 200 when called with an API key. The API key is stored in AWS Secrets Manager in the company's monitoring account. A failed check must raise a CloudWatch alarm. The company wants the LEAST custom code and the fewest resources to maintain.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique dépend de deux partenaires pour son flux de commandes. L'entreprise doit vérifier toutes les 5 minutes que l'enregistrement DNS de l'API du partenaire se résout en la valeur attendue, que le certificat TLS de cette API n'est pas proche de son expiration, que le serveur SFTP du partenaire accepte les connexions TCP sur le port 22, et que deux points de terminaison d'API HTTPS renvoient HTTP 200 quand ils sont appelés avec une clé d'API. La clé d'API est stockée dans AWS Secrets Manager dans le compte de surveillance de l'entreprise. Une vérification en échec doit déclencher une alarme CloudWatch. L'entreprise veut le MOINS de code personnalisé et le moins de ressources à maintenir.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create Amazon Route 53 health checks for the two HTTPS endpoints and the SFTP port, and create CloudWatch alarms on their HealthCheckStatus metrics.
        fr: |-
          Créer des vérifications de l'état Amazon Route 53 pour les deux points de terminaison HTTPS et le port SFTP, et créer des alarmes CloudWatch sur leurs métriques HealthCheckStatus.
    - id: b
      text:
        en: |-
          Write one AWS Lambda function for each type of check, schedule the functions every 5 minutes with Amazon EventBridge Scheduler, and publish a custom metric that a CloudWatch alarm monitors.
        fr: |-
          Écrire une fonction AWS Lambda par type de vérification, planifier les fonctions toutes les 5 minutes avec Amazon EventBridge Scheduler, et publier une métrique personnalisée surveillée par une alarme CloudWatch.
    - id: c
      text:
        en: |-
          Create one canary from the multi checks blueprint with DNS, SSL, TCP, and HTTP checks in JSON, use Secrets Manager for the API key, and alarm on SuccessPercent.
        fr: |-
          Créer un seul canary à partir du plan multi checks avec des vérifications DNS, SSL, TCP et HTTP en JSON, utiliser Secrets Manager pour la clé d'API, et déclencher une alarme sur SuccessPercent.
    - id: d
      text:
        en: |-
          Import the partner's certificate into AWS Certificate Manager to receive expiration events, and create a CloudWatch Synthetics API canary for the two HTTPS endpoints.
        fr: |-
          Importer le certificat du partenaire dans AWS Certificate Manager pour recevoir des événements d'expiration, et créer un canary CloudWatch Synthetics de type API canary pour les deux points de terminaison HTTPS.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The multi checks blueprint runs up to 10 sequential checks of type HTTP, DNS, SSL certificate, and TCP from a JSON configuration, with assertions on each check and authentication through Secrets Manager. The five checks fit in one canary, which needs no custom script, and its success metric drives a single alarm.
    fr: |-
      Le plan multi checks exécute jusqu'à 10 vérifications séquentielles de type HTTP, DNS, certificat SSL et TCP à partir d'une configuration JSON, avec des assertions sur chaque vérification et une authentification via Secrets Manager. Les cinq vérifications tiennent dans un seul canary, sans script personnalisé, et sa métrique de réussite alimente une seule alarme.
  options:
    a:
      en: |-
        Route 53 health checks test HTTP, HTTPS, or TCP endpoints, but they don't validate a DNS record value or the expiry date of a certificate, and they can't send an API key from Secrets Manager.
      fr: |-
        Les vérifications de l'état Route 53 testent des points de terminaison HTTP, HTTPS ou TCP, mais elles ne valident ni la valeur d'un enregistrement DNS ni la date d'expiration d'un certificat, et elles ne peuvent pas envoyer une clé d'API issue de Secrets Manager.
    b:
      en: |-
        Several custom functions, schedules, and metrics are much more code and more resources to maintain than one configured canary.
      fr: |-
        Plusieurs fonctions, planifications et métriques personnalisées représentent bien plus de code et de ressources à maintenir qu'un seul canary configuré.
    d:
      en: |-
        The company doesn't own the partner's certificate and its private key, so it can't import it into ACM, and this design still doesn't check the DNS record or the SFTP port.
      fr: |-
        L'entreprise ne possède pas le certificat du partenaire ni sa clé privée : elle ne peut pas l'importer dans ACM, et cette conception ne vérifie toujours ni l'enregistrement DNS ni le port SFTP.
references:
  - title: "Using canary blueprints - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Blueprints.html
