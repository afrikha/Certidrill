id: sapc03-5b-transaction-search-order-id
objective: "5.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ecommerce company instruments its checkout services with OpenTelemetry and sends traces to AWS X-Ray. To control X-Ray costs, the services sample only 5% of requests. Customer support often needs the complete trace of one specific order, identified by an order ID that the services add as a span attribute, up to several days after a complaint. Today, most of these traces do not exist because the requests were not sampled. The company wants to find the full trace of any order by its order ID, at the lowest cost for storing traces.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'e-commerce instrumente ses services de paiement avec OpenTelemetry et envoie les traces à AWS X-Ray. Pour maîtriser les coûts X-Ray, les services n'échantillonnent que 5 % des requêtes. Le support client a souvent besoin de la trace complète d'une commande précise, identifiée par un ID de commande que les services ajoutent comme attribut de span, jusqu'à plusieurs jours après une réclamation. Aujourd'hui, la plupart de ces traces n'existent pas, car les requêtes n'ont pas été échantillonnées. L'entreprise veut retrouver la trace complète de n'importe quelle commande à partir de son ID, au coût de stockage des traces le plus bas.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the 5% sampling, write the order ID in every application log line, and search the logs of the order with CloudWatch Logs Insights when support needs it.", fr: "Conserver l'échantillonnage de 5 %, écrire l'ID de commande dans chaque ligne de journal de l'application, et chercher les journaux de la commande avec CloudWatch Logs Insights quand le support en a besoin." } }
    - { id: b, text: { en: "Keep the 5% sampling, and create an X-Ray group with a filter expression on the order ID attribute so that support can find the traces of each order.", fr: "Conserver l'échantillonnage de 5 %, et créer un groupe X-Ray avec une expression de filtre sur l'attribut d'ID de commande pour que le support retrouve les traces de chaque commande." } }
    - { id: c, text: { en: "Enable Transaction Search so that spans are stored as structured logs in aws/spans, send 100% of the spans, and keep indexing 1% of them as trace summaries.", fr: "Activer Transaction Search pour que les spans soient stockés comme journaux structurés dans aws/spans, envoyer 100 % des spans, et conserver l'indexation de 1 % d'entre eux comme résumés de trace." } }
    - { id: d, text: { en: "Raise the sampling rate of all services to 100% and keep the default X-Ray trace storage, so that the trace of every order is recorded in X-Ray.", fr: "Porter le taux d'échantillonnage de tous les services à 100 % et conserver le stockage de traces X-Ray par défaut, afin que la trace de chaque commande soit enregistrée dans X-Ray." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Transaction Search ingests all spans sent to X-Ray as structured logs in the aws/spans log group, at CloudWatch Logs pricing, and every span attribute, such as an order ID, can be searched. By default, 1% of the ingested spans is also indexed for free as trace summaries, which is usually enough because every span is already available for end-to-end visibility."
    fr: "Transaction Search ingère tous les spans envoyés à X-Ray comme journaux structurés dans le groupe de journaux aws/spans, au tarif de CloudWatch Logs, et chaque attribut de span, comme un ID de commande, peut être recherché. Par défaut, 1 % des spans ingérés est aussi indexé gratuitement comme résumés de trace, ce qui suffit généralement puisque chaque span est déjà disponible pour une visibilité de bout en bout."
  options:
    a: { en: "Logs of the order do not show the distributed trace across services, and the unsampled requests still have no trace.", fr: "Les journaux de la commande ne montrent pas la trace distribuée entre les services, et les requêtes non échantillonnées n'ont toujours pas de trace." }
    b: { en: "A group filters traces that exist; with 5% sampling, 95% of the orders still have no trace to find.", fr: "Un groupe filtre des traces existantes ; avec un échantillonnage de 5 %, 95 % des commandes n'ont toujours aucune trace à retrouver." }
    d: { en: "Recording every trace in X-Ray's default mode is the expensive option that the company sampled to avoid, whereas Transaction Search stores the same spans at lower cost.", fr: "Enregistrer chaque trace dans le mode par défaut de X-Ray est l'option coûteuse que l'entreprise évitait en échantillonnant, alors que Transaction Search stocke les mêmes spans à moindre coût." }
references:
  - title: Transaction Search
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Transaction-Search.html
  - title: Enable transaction search
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Enable-TransactionSearch.html
