id: sapc03-5c-asg-maintenance-launch-first
objective: "5.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A trading company runs a pricing service on 6 Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, with a desired capacity of 6 and a maximum of 8. The service needs all 6 instances at peak, and each new instance needs about 5 minutes to warm its caches after it enters service. The group uses a maximum instance lifetime of 14 days, and the team runs an instance refresh every month to deploy new AMIs. In both cases, healthy instances are terminated at the same time as their replacements launch, and capacity drops below 6 ready instances for several minutes. The company wants capacity never to drop below 6 ready instances during these replacements, without running a seventh instance permanently.

    Which solution will meet these requirements?
  fr: |
    Une société de trading exploite un service de tarification sur 6 instances Amazon EC2 dans un groupe Auto Scaling derrière un Application Load Balancer, avec une capacité souhaitée de 6 et un maximum de 8. Le service a besoin des 6 instances en période de pointe, et chaque nouvelle instance a besoin d'environ 5 minutes pour réchauffer ses caches après son entrée en service. Le groupe utilise une durée de vie maximale des instances de 14 jours, et l'équipe lance chaque mois une actualisation d'instances (instance refresh) pour déployer de nouvelles AMI. Dans les deux cas, des instances saines sont résiliées en même temps que leurs remplaçantes sont lancées, et la capacité tombe sous 6 instances prêtes pendant plusieurs minutes. L'entreprise veut que la capacité ne tombe jamais sous 6 instances prêtes pendant ces remplacements, sans exécuter une septième instance en permanence.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure an instance maintenance policy on the group with a minimum healthy percentage of 100 and a maximum healthy percentage of 120, and set the default instance warmup to 300 seconds.
        fr: |-
          Configurer sur le groupe une politique de maintenance des instances avec un pourcentage minimal d'instances saines de 100 et un pourcentage maximal de 120, et définir le préchauffage d'instance par défaut sur 300 secondes.
    - id: b
      text:
        en: |-
          Start each instance refresh with a minimum healthy percentage of 100 and a maximum healthy percentage of 120 in its preferences, and keep the other group settings.
        fr: |-
          Démarrer chaque actualisation d'instances avec un pourcentage minimal d'instances saines de 100 et un pourcentage maximal de 120 dans ses préférences, et conserver les autres paramètres du groupe.
    - id: c
      text:
        en: |-
          Add a termination lifecycle hook that keeps each terminating instance in the Terminating:Wait state for 5 minutes before it is terminated.
        fr: |-
          Ajouter un hook de cycle de vie de résiliation qui maintient chaque instance en cours de résiliation à l'état Terminating:Wait pendant 5 minutes avant sa résiliation.
    - id: d
      text:
        en: |-
          Turn on Capacity Rebalancing for the group so that replacement instances are launched before the existing instances are terminated.
        fr: |-
          Activer le rééquilibrage de capacité (Capacity Rebalancing) pour le groupe afin que les instances de remplacement soient lancées avant la résiliation des instances existantes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An instance maintenance policy applies to instance refreshes, maximum instance lifetime replacements, and health check replacements: with a minimum of 100 percent and a maximum above 100 percent, the group launches a replacement first and terminates the old instance only after it is ready. With default instance warmup, new instances count toward the minimum only after their warmup, so the 6 ready instances are preserved without a permanent seventh instance.
    fr: |-
      Une politique de maintenance des instances s'applique aux actualisations d'instances, aux remplacements liés à la durée de vie maximale et aux remplacements après vérification de l'état : avec un minimum de 100 % et un maximum supérieur à 100 %, le groupe lance d'abord une remplaçante et ne résilie l'ancienne instance qu'une fois la nouvelle prête. Avec le préchauffage d'instance par défaut, les nouvelles instances ne comptent dans le minimum qu'après leur préchauffage : les 6 instances prêtes sont préservées sans septième instance permanente.
  options:
    b:
      en: |-
        Instance refresh preferences protect only the refresh; replacements caused by the maximum instance lifetime still use the default terminate-and-launch behavior.
      fr: |-
        Les préférences d'actualisation d'instances ne protègent que l'actualisation ; les remplacements dus à la durée de vie maximale utilisent toujours le comportement par défaut de résiliation puis lancement.
    c:
      en: |-
        A termination hook delays the end of termination, but the instance is already leaving service, so it doesn't add ready capacity before the old instance stops serving.
      fr: |-
        Un hook de résiliation retarde la fin de la résiliation, mais l'instance quitte déjà le service : il n'ajoute pas de capacité prête avant que l'ancienne instance cesse de servir.
    d:
      en: |-
        Capacity Rebalancing responds to Spot rebalance recommendations; it doesn't change how instance refresh and maximum instance lifetime replace On-Demand Instances.
      fr: |-
        Capacity Rebalancing réagit aux recommandations de rééquilibrage Spot ; il ne change pas la façon dont l'actualisation d'instances et la durée de vie maximale remplacent les instances à la demande.
references:
