id: sapc03-5a-registry-third-party-type
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company manages its AWS infrastructure with AWS CloudFormation in 25 accounts and two Regions. It also uses a third-party observability provider whose monitors are configured by hand in the provider's web console, which leaves monitors that don't match the deployed services. The provider publishes a resource type for its monitors as a public extension in the CloudFormation registry. The company wants to declare the monitors in the same templates as the services, so that they are created, updated, and deleted with the stacks. The platform team doesn't want to write or maintain any provisioning code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS gère son infrastructure AWS avec AWS CloudFormation dans 25 comptes et deux Régions. Elle utilise aussi un fournisseur d'observabilité tiers dont les moniteurs sont configurés à la main dans la console web du fournisseur, ce qui laisse des moniteurs qui ne correspondent pas aux services déployés. Le fournisseur publie un type de ressource pour ses moniteurs sous forme d'extension publique dans le registre CloudFormation. L'entreprise veut déclarer les moniteurs dans les mêmes modèles que les services, afin qu'ils soient créés, mis à jour et supprimés avec les piles. L'équipe plateforme ne veut écrire ni maintenir aucun code de provisionnement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Write a Lambda-backed custom resource that calls the provider's API to create, update, and delete monitors, and declare it with AWS::CloudFormation::CustomResource in each template, with the provider's API key in Secrets Manager.
        fr: |-
          Écrire une ressource personnalisée adossée à Lambda qui appelle l'API du fournisseur pour créer, mettre à jour et supprimer les moniteurs, et la déclarer avec AWS::CloudFormation::CustomResource dans chaque modèle, avec la clé d'API du fournisseur dans Secrets Manager.
    - id: b
      text:
        en: |-
          Activate the provider's public resource type in each account and Region where the stacks run, with an execution role and the configuration properties that it requires, and declare the monitors with that type.
        fr: |-
          Activer le type de ressource public du fournisseur dans chaque compte et chaque Région où s'exécutent les piles, avec un rôle d'exécution et les propriétés de configuration qu'il exige, et déclarer les moniteurs avec ce type.
    - id: c
      text:
        en: |-
          Package the monitor definitions as a CloudFormation module in the private registry, so that the module's resources call the provider's API when the stacks are deployed.
        fr: |-
          Empaqueter les définitions de moniteurs sous forme de module CloudFormation dans le registre privé, afin que les ressources du module appellent l'API du fournisseur lors du déploiement des piles.
    - id: d
      text:
        en: |-
          Create a CloudFormation macro that transforms monitor definitions into Amazon EventBridge API destinations that call the provider's API each time a stack is deployed.
        fr: |-
          Créer une macro CloudFormation qui transforme les définitions de moniteurs en destinations d'API Amazon EventBridge qui appellent l'API du fournisseur à chaque déploiement de pile.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A third-party public extension must be activated in each account and Region where it is used; activation can set an execution role, automatic minor-version updates, and an alias, and the type configuration holds the settings the extension needs. The monitors then become ordinary resources of the stacks, with their create, update, and delete handlers maintained by the publisher, so the platform team writes no provisioning code. Activation itself can be rolled out with StackSets.
    fr: |-
      Une extension publique tierce doit être activée dans chaque compte et chaque Région où elle est utilisée ; l'activation peut définir un rôle d'exécution, les mises à jour automatiques de versions mineures et un alias, et la configuration du type contient les paramètres dont l'extension a besoin. Les moniteurs deviennent alors des ressources ordinaires des piles, dont les gestionnaires de création, de mise à jour et de suppression sont maintenus par l'éditeur : l'équipe plateforme n'écrit aucun code de provisionnement. L'activation elle-même peut être déployée avec StackSets.
  options:
    a:
      en: |-
        A custom resource works, but the team must write and maintain the Lambda code for every create, update, and delete case, which the requirements rule out.
      fr: |-
        Une ressource personnalisée fonctionne, mais l'équipe doit écrire et maintenir le code Lambda pour chaque cas de création, de mise à jour et de suppression, ce que les exigences excluent.
    c:
      en: |-
        A module only groups existing resource types and their configuration for reuse; it adds no handler that can call an external API.
      fr: |-
        Un module regroupe seulement des types de ressources existants et leur configuration pour les réutiliser ; il n'ajoute aucun gestionnaire capable d'appeler une API externe.
    d:
      en: |-
        A macro is code the team maintains, and API destinations send events to HTTP endpoints; they don't model the lifecycle of the monitors, so deletions and updates aren't handled.
      fr: |-
        Une macro est du code que l'équipe maintient, et les destinations d'API envoient des événements à des points de terminaison HTTP ; elles ne modélisent pas le cycle de vie des moniteurs, donc ni les suppressions ni les mises à jour ne sont gérées.
references:
  - title: Use third-party public extensions from the CloudFormation registry - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/registry-public.html
