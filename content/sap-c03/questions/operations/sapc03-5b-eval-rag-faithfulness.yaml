id: sapc03-5b-eval-rag-faithfulness
objective: "5.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's legal department uses an internal assistant that answers questions from an Amazon Bedrock knowledge base built on 40,000 contract templates. The platform team, which works in a shared AI account, plans to change the chunking strategy and the response generator model next month. After a similar change last year, lawyers reported answers that contained clauses not present in the retrieved documents, and citations that pointed to the wrong passages. Before each release, the team must measure automatically whether the generated answers stay faithful to the retrieved passages and whether the citations are accurate and complete. No employee time is available to review responses, and the checks must use the same set of 600 questions each time.

    Which solution will meet these requirements?
  fr: |
    Le service juridique d'AnyCompany utilise un assistant interne qui répond aux questions à partir d'une base de connaissances Amazon Bedrock construite sur 40 000 modèles de contrats. L'équipe plateforme, qui travaille dans un compte d'IA partagé, prévoit de changer la stratégie de découpage (chunking) et le modèle générateur de réponses le mois prochain. Après un changement similaire l'an dernier, les juristes ont signalé des réponses contenant des clauses absentes des documents récupérés, et des citations qui pointaient vers les mauvais passages. Avant chaque mise en production, l'équipe doit mesurer automatiquement si les réponses générées restent fidèles aux passages récupérés et si les citations sont exactes et complètes. Aucun employé n'est disponible pour relire les réponses, et les contrôles doivent utiliser le même ensemble de 600 questions à chaque fois.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run an Amazon Bedrock retrieve-and-generate RAG evaluation job on the knowledge base with the 600 questions, and select the faithfulness, citation precision, and citation coverage metrics.", fr: "Exécuter une tâche d'évaluation RAG Amazon Bedrock de type récupération et génération (retrieve-and-generate) sur la base de connaissances avec les 600 questions, en sélectionnant les métriques de fidélité, de précision des citations et de couverture des citations." } }
    - { id: b, text: { en: "Run an Amazon Bedrock programmatic model evaluation job with the question and answer task type on the generator model, and compare the accuracy and robustness scores between releases.", fr: "Exécuter une tâche d'évaluation de modèle programmatique Amazon Bedrock avec le type de tâche questions-réponses sur le modèle générateur, et comparer les scores d'exactitude et de robustesse entre les versions." } }
    - { id: c, text: { en: "Attach an Amazon Bedrock guardrail with a contextual grounding check to the assistant, and compare the number of blocked responses in Amazon CloudWatch before and after each release.", fr: "Associer à l'assistant une barrière de protection Amazon Bedrock avec une vérification d'ancrage contextuel, et comparer le nombre de réponses bloquées dans Amazon CloudWatch avant et après chaque mise en production." } }
    - { id: d, text: { en: "Run an Amazon Bedrock human-based evaluation job with a work team of lawyers who rate the faithfulness and the citations of the 600 answers before each release.", fr: "Exécuter une tâche d'évaluation Amazon Bedrock basée sur des humains, avec une équipe de travail de juristes qui notent la fidélité et les citations des 600 réponses avant chaque mise en production." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A retrieve-and-generate RAG evaluation job scores both the passages that the knowledge base retrieves and the answers that the generator model writes from them. Its built-in metrics include faithfulness (absence of hallucination with respect to the retrieved texts), citation precision, and citation coverage, and the job runs automatically on a fixed prompt dataset, so it can be repeated before each release."
    fr: "Une tâche d'évaluation RAG de type récupération et génération note à la fois les passages récupérés par la base de connaissances et les réponses que le modèle générateur rédige à partir d'eux. Ses métriques intégrées comprennent la fidélité (absence d'hallucination par rapport aux textes récupérés), la précision des citations et la couverture des citations, et la tâche s'exécute automatiquement sur un jeu de données d'invites fixe : elle peut donc être répétée avant chaque mise en production."
  options:
    b: { en: "Programmatic jobs compute accuracy, robustness, and toxicity for a model on a task; they do not use the knowledge base and do not score faithfulness to retrieved passages or citations.", fr: "Les tâches programmatiques calculent l'exactitude, la robustesse et la toxicité d'un modèle sur une tâche ; elles n'utilisent pas la base de connaissances et ne notent ni la fidélité aux passages récupérés ni les citations." }
    c: { en: "A grounding check filters responses at run time in production; it does not measure the quality of a release before deployment and says nothing about citation accuracy.", fr: "Une vérification d'ancrage filtre les réponses à l'exécution en production ; elle ne mesure pas la qualité d'une version avant son déploiement et ne dit rien de l'exactitude des citations." }
    d: { en: "A human-based job needs reviewers for every release, but the stem states that no employee time is available and that the checks must be automatic.", fr: "Une tâche basée sur des humains a besoin de relecteurs à chaque version, alors que l'énoncé précise qu'aucun employé n'est disponible et que les contrôles doivent être automatiques." }
references:
