id: sapc03-5c-predictive-no-scale-in
objective: "5.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online learning company replaced the dynamic scaling policies of its web tier's Auto Scaling group with a single predictive scaling policy in forecast and scale mode. Capacity now arrives before the morning peak as intended. However, the group keeps its peak capacity late into the night, long after traffic has dropped, and the company pays for idle instances every evening. The company wants the group to remove capacity when the load decreases while keeping the proactive scale-out.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'enseignement en ligne a remplacé les politiques de mise à l'échelle dynamique du groupe Auto Scaling de son niveau web par une seule politique de mise à l'échelle prédictive en mode prévision et mise à l'échelle. La capacité arrive désormais avant le pic du matin comme prévu. Cependant, le groupe conserve sa capacité de pointe tard dans la nuit, bien après la baisse du trafic, et l'entreprise paie chaque soir des instances inactives. L'entreprise veut que le groupe retire de la capacité quand la charge diminue tout en conservant la montée en charge proactive.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Switch the predictive scaling policy to forecast only mode so that it no longer holds capacity after the peak.
        fr: |-
          Faire passer la politique de mise à l'échelle prédictive en mode prévision uniquement afin qu'elle ne retienne plus de capacité après le pic.
    - id: b
      text:
        en: |-
          Add a target tracking scaling policy alongside the predictive scaling policy, so that the dynamic policy removes capacity when the load decreases.
        fr: |-
          Ajouter une politique de mise à l'échelle avec suivi de cible à côté de la politique de mise à l'échelle prédictive, afin que la politique dynamique retire de la capacité quand la charge diminue.
    - id: c
      text:
        en: |-
          Shorten the scheduling buffer time of the predictive scaling policy so that the forecast capacity is released earlier in the evening.
        fr: |-
          Raccourcir la marge de planification de la politique de mise à l'échelle prédictive afin que la capacité prévue soit libérée plus tôt dans la soirée.
    - id: d
      text:
        en: |-
          Set a maximum instance lifetime of 12 hours on the group so that the peak instances are replaced and removed in the evening.
        fr: |-
          Définir sur le groupe une durée de vie maximale des instances de 12 heures afin que les instances de pointe soient remplacées et retirées le soir.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Predictive scaling doesn't scale in when the forecast expects a decrease in load; removing capacity requires a dynamic scaling policy. When several policies are active, the group uses the largest desired capacity, so predictive scaling still raises capacity before the peak and target tracking lowers it as the load drops.
    fr: |-
      La mise à l'échelle prédictive ne réduit pas la capacité quand la prévision anticipe une baisse de charge ; retirer de la capacité exige une politique de mise à l'échelle dynamique. Quand plusieurs politiques sont actives, le groupe utilise la plus grande capacité souhaitée : la mise à l'échelle prédictive relève toujours la capacité avant le pic, et le suivi de cible l'abaisse quand la charge baisse.
  options:
    a:
      en: |-
        Forecast only mode stops scaling entirely, which loses the proactive scale-out, and nothing would then remove capacity either.
      fr: |-
        Le mode prévision uniquement arrête toute mise à l'échelle, ce qui fait perdre la montée en charge proactive, et rien ne retirerait non plus de capacité.
    c:
      en: |-
        The scheduling buffer only moves launches earlier before each forecast hour; it doesn't make predictive scaling scale in.
      fr: |-
        La marge de planification avance seulement les lancements avant chaque heure prévue ; elle ne fait pas réduire la capacité par la mise à l'échelle prédictive.
    d:
      en: |-
        Maximum instance lifetime replaces instances with new ones to keep the same desired capacity; it doesn't reduce capacity.
      fr: |-
        La durée de vie maximale des instances remplace les instances par de nouvelles pour conserver la même capacité souhaitée ; elle ne réduit pas la capacité.
references:
  - title: "How predictive scaling works - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/predictive-scaling-policy-overview.html
