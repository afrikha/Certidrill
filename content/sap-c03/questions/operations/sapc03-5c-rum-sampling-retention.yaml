id: sapc03-5c-rum-sampling-retention
objective: "5.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company uses a CloudWatch RUM app monitor on its news website, which receives about 40 million user sessions each month. The app monitor collects data from 100 percent of the sessions, and the RUM charges now exceed the observability budget by a factor of ten. The analytics team confirms that data from a random tenth of the sessions is enough for its performance trends. In addition, a new internal policy requires the company to keep the RUM telemetry for 400 days so that page performance can be compared year over year. The company wants to keep CloudWatch RUM and make the fewest changes to the website.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de médias utilise un moniteur d'application CloudWatch RUM sur son site d'actualités, qui reçoit environ 40 millions de sessions utilisateur par mois. Le moniteur d'application collecte les données de 100 % des sessions, et les frais RUM dépassent désormais le budget d'observabilité d'un facteur dix. L'équipe d'analyse confirme que les données d'un dixième des sessions choisi au hasard suffisent pour ses tendances de performance. De plus, une nouvelle politique interne exige de conserver la télémétrie RUM pendant 400 jours afin de comparer la performance des pages d'une année sur l'autre. L'entreprise veut conserver CloudWatch RUM et apporter le moins de modifications possible au site web.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Change the data retention setting of the app monitor from 30 days to 400 days.
        fr: |-
          Faire passer le paramètre de conservation des données du moniteur d'application de 30 jours à 400 jours.
    - id: b
      text:
        en: |-
          Set the session sample rate of the app monitor to 10 percent.
        fr: |-
          Définir le taux d'échantillonnage des sessions du moniteur d'application sur 10 %.
    - id: c
      text:
        en: |-
          Replace the Amazon Cognito identity pool with a public resource-based policy on the app monitor so that the web client sends events without credentials.
        fr: |-
          Remplacer le groupe d'identités Amazon Cognito par une politique basée sur les ressources publique sur le moniteur d'application, pour que le client web envoie les événements sans informations d'identification.
    - id: d
      text:
        en: |-
          Replace the app monitor with CloudWatch Synthetics canaries that replay the ten most visited journeys every minute.
        fr: |-
          Remplacer le moniteur d'application par des canaries CloudWatch Synthetics qui rejouent chaque minute les dix parcours les plus visités.
    - id: e
      text:
        en: |-
          Turn on the option to store the app monitor's telemetry in CloudWatch Logs, and set the retention of the resulting log group to 400 days.
        fr: |-
          Activer l'option de stockage de la télémétrie du moniteur d'application dans CloudWatch Logs, et définir la conservation du groupe de journaux obtenu sur 400 jours.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      The session sample rate sets the percentage of sessions that the RUM client records, so 10 percent cuts the collected data and the charges by about the required factor. RUM keeps its own data for 30 days only; to keep it longer, the app monitor sends copies of the events to a CloudWatch Logs log group whose retention you choose.
    fr: |-
      Le taux d'échantillonnage des sessions définit le pourcentage de sessions que le client RUM enregistre : 10 % réduit les données collectées et les frais à peu près du facteur requis. RUM ne conserve ses propres données que 30 jours ; pour les garder plus longtemps, le moniteur d'application envoie des copies des événements dans un groupe de journaux CloudWatch Logs dont vous choisissez la conservation.
  options:
    a:
      en: |-
        RUM retention is fixed at 30 days and can't be changed on the app monitor; longer retention requires the copy to CloudWatch Logs.
      fr: |-
        La conservation RUM est fixée à 30 jours et ne peut pas être modifiée sur le moniteur d'application ; une conservation plus longue exige la copie vers CloudWatch Logs.
    c:
      en: |-
        The authorization method doesn't change the number of events collected, so it doesn't address the RUM charges, and it opens the app monitor to anyone.
      fr: |-
        La méthode d'autorisation ne change pas le nombre d'événements collectés : elle ne règle pas les frais RUM, et elle ouvre le moniteur d'application à tout le monde.
    d:
      en: |-
        Canaries measure scripted journeys, not real visitors, which removes the real-user data that the analytics team uses and abandons CloudWatch RUM.
      fr: |-
        Les canaries mesurent des parcours scriptés, pas des visiteurs réels : cela supprime les données d'utilisateurs réels qu'utilise l'équipe d'analyse et abandonne CloudWatch RUM.
references:
  - title: "Creating a CloudWatch RUM app monitor for a web application"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM-get-started-create-app-monitor.html
  - title: "CloudWatch RUM - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM.html
