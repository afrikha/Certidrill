id: sapc03-5b-eks-addon-pod-identity
objective: "5.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fintech company runs 15 Amazon EKS clusters on Amazon EC2 managed node groups. It needs Container Insights with container-level detail and the collection of all container logs in CloudWatch Logs. The security team requires least privilege: only the monitoring agents may hold the permissions to write to CloudWatch, not every pod on the nodes, and the credentials must rotate automatically. The platform team wants an AWS-managed installation that it can upgrade like its other EKS add-ons.

    Which solution will meet these requirements?
  fr: |
    Une fintech exécute 15 clusters Amazon EKS sur des groupes de nœuds gérés Amazon EC2. Elle a besoin de Container Insights avec le détail au niveau des conteneurs et de la collecte de tous les journaux de conteneurs dans CloudWatch Logs. L'équipe de sécurité exige le moindre privilège : seuls les agents de surveillance peuvent détenir les autorisations d'écrire dans CloudWatch, pas tous les pods des nœuds, et les informations d'identification doivent faire l'objet d'une rotation automatique. L'équipe plateforme veut une installation gérée par AWS qu'elle peut mettre à niveau comme ses autres modules complémentaires EKS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Install the Amazon CloudWatch Observability EKS add-on, and create an EKS Pod Identity association for the cloudwatch-agent service account with a role that has CloudWatch permissions.", fr: "Installer le module complémentaire EKS Amazon CloudWatch Observability, et créer une association EKS Pod Identity pour le compte de service cloudwatch-agent avec un rôle qui dispose des autorisations CloudWatch." } }
    - { id: b, text: { en: "Install the Amazon CloudWatch Observability EKS add-on, and attach the CloudWatchAgentServerPolicy managed policy to the IAM role of each managed node group.", fr: "Installer le module complémentaire EKS Amazon CloudWatch Observability, et attacher la politique gérée CloudWatchAgentServerPolicy au rôle IAM de chaque groupe de nœuds gérés." } }
    - { id: c, text: { en: "Deploy Fluent Bit and a self-managed Prometheus server with Helm charts, and store the access keys of an IAM user for CloudWatch in a Kubernetes secret.", fr: "Déployer Fluent Bit et un serveur Prometheus autogéré avec des charts Helm, et stocker dans un secret Kubernetes les clés d'accès d'un utilisateur IAM pour CloudWatch." } }
    - { id: d, text: { en: "Install the AWS Distro for OpenTelemetry Collector as a DaemonSet with Helm, and attach the CloudWatchAgentServerPolicy managed policy to the node group roles.", fr: "Installer l'AWS Distro for OpenTelemetry Collector comme DaemonSet avec Helm, et attacher la politique gérée CloudWatchAgentServerPolicy aux rôles des groupes de nœuds." } }
answer: { optionId: a }
explanation:
  correct:
    en: "The CloudWatch Observability EKS add-on installs the CloudWatch agent and Fluent Bit, enables Container Insights with enhanced observability, and sends container logs to CloudWatch Logs. AWS recommends EKS Pod Identity for its permissions because it gives the role only to the agent's service account, with credential rotation and auditability."
    fr: "Le module complémentaire EKS CloudWatch Observability installe l'agent CloudWatch et Fluent Bit, active Container Insights avec observabilité améliorée et envoie les journaux des conteneurs vers CloudWatch Logs. AWS recommande EKS Pod Identity pour ses autorisations, car le rôle n'est accordé qu'au compte de service de l'agent, avec rotation des informations d'identification et auditabilité."
  options:
    b: { en: "The node role grants the permissions to every pod that runs on the worker nodes, which breaks the least-privilege requirement.", fr: "Le rôle de nœud accorde les autorisations à tous les pods qui s'exécutent sur les nœuds de travail, ce qui enfreint l'exigence de moindre privilège." }
    c: { en: "A self-managed stack is not an AWS-managed add-on, and long-term access keys in a secret do not rotate automatically.", fr: "Une pile autogérée n'est pas un module complémentaire géré par AWS, et des clés d'accès à long terme dans un secret ne font pas l'objet d'une rotation automatique." }
    d: { en: "A Helm-installed collector is not managed as an EKS add-on, and the node role again gives the permissions to every pod.", fr: "Un collecteur installé avec Helm n'est pas géré comme un module complémentaire EKS, et le rôle de nœud accorde là encore les autorisations à tous les pods." }
references:
  - title: Install the CloudWatch agent with the Amazon CloudWatch Observability EKS add-on or the Helm chart
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/install-CloudWatch-Observability-EKS-addon.html
