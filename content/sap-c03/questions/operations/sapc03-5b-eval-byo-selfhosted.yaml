id: sapc03-5b-eval-byo-selfhosted
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's customer service division runs a fine-tuned open-weight model on an Amazon EKS cluster in its own AWS account. The AI governance team, in a separate account, wants to compare the quality of this model with a foundation model that is available in Amazon Bedrock. Both models must be scored by the same judge model, on the same 500 prompts, with the same built-in metrics such as correctness and helpfulness. The division's model must stay on Amazon EKS, and the comparison must not require building a scoring framework. The division can run a script that sends the 500 prompts to its model and saves the answers.

    Which solution will meet these requirements?
  fr: |
    La division du service client d'AnyCompany exécute un modèle à poids ouverts affiné (fine-tuned) sur un cluster Amazon EKS dans son propre compte AWS. L'équipe de gouvernance de l'IA, dans un autre compte, veut comparer la qualité de ce modèle avec un modèle de fondation disponible dans Amazon Bedrock. Les deux modèles doivent être notés par le même modèle juge, sur les mêmes 500 invites, avec les mêmes métriques intégrées, comme l'exactitude et l'utilité. Le modèle de la division doit rester sur Amazon EKS, et la comparaison ne doit pas exiger de construire un framework de notation. La division peut exécuter un script qui envoie les 500 invites à son modèle et enregistre les réponses.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Import the fine-tuned model weights into Amazon Bedrock with Custom Model Import, and run one judge-based evaluation job that compares the imported model with the Bedrock foundation model.", fr: "Importer les poids du modèle affiné dans Amazon Bedrock avec Custom Model Import, et exécuter une tâche d'évaluation avec modèle juge qui compare le modèle importé au modèle de fondation Bedrock." } }
    - { id: b, text: { en: "Run one judge-based evaluation job whose prompt dataset contains two entries in modelResponses for each prompt: the answer of the EKS model and the answer of the Bedrock model.", fr: "Exécuter une seule tâche d'évaluation avec modèle juge dont le jeu de données d'invites contient deux entrées dans modelResponses pour chaque invite : la réponse du modèle EKS et celle du modèle Bedrock." } }
    - { id: c, text: { en: "Store the EKS model's answers in the modelResponses field of a prompt dataset and run a judge-based job on it, then run a second judge-based job with the same prompts on the Bedrock model.", fr: "Stocker les réponses du modèle EKS dans le champ modelResponses d'un jeu de données d'invites et exécuter une tâche avec modèle juge, puis exécuter une seconde tâche avec modèle juge sur le modèle Bedrock avec les mêmes invites." } }
    - { id: d, text: { en: "Run a human-based evaluation job that compares the two models side by side, with the governance team as the work team and the built-in metrics as the rating criteria.", fr: "Exécuter une tâche d'évaluation basée sur des humains qui compare les deux modèles côte à côte, avec l'équipe de gouvernance comme équipe de travail et les métriques intégrées comme critères de notation." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Judge-based jobs can evaluate a model hosted outside Amazon Bedrock: you put its answers in the modelResponses field of the prompt dataset, and Bedrock skips the invoke step and scores the data you supply. A judge-based job accepts only one model response per prompt and one modelIdentifier per job, so the Bedrock model is scored in a second job with the same prompts, judge model, and metrics."
    fr: "Les tâches avec modèle juge peuvent évaluer un modèle hébergé hors d'Amazon Bedrock : on place ses réponses dans le champ modelResponses du jeu de données d'invites, et Bedrock saute l'étape d'appel du modèle et note les données fournies. Une tâche avec modèle juge n'accepte qu'une réponse de modèle par invite et un seul modelIdentifier par tâche : le modèle Bedrock est donc noté dans une seconde tâche avec les mêmes invites, le même modèle juge et les mêmes métriques."
  options:
    a: { en: "Importing the weights moves the model to Amazon Bedrock hosting, but the division's model must stay on Amazon EKS.", fr: "Importer les poids déplace le modèle vers un hébergement Amazon Bedrock, alors que le modèle de la division doit rester sur Amazon EKS." }
    b: { en: "Judge-based jobs support only one model response for each prompt and one unique modelIdentifier per job, so this dataset is not valid.", fr: "Les tâches avec modèle juge n'acceptent qu'une réponse de modèle par invite et un seul modelIdentifier par tâche : ce jeu de données n'est pas valide." }
    d: { en: "Human reviewers replace the judge model that the governance team requires, and the built-in metrics of judge-based jobs are not scored by people.", fr: "Des relecteurs humains remplacent le modèle juge exigé par l'équipe de gouvernance, et les métriques intégrées des tâches avec modèle juge ne sont pas notées par des personnes." }
references:
