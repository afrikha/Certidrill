id: sapc03-5a-stackset-management-account
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 220 accounts in AWS Organizations, including the management account, which also runs the organization's billing tools. The security team maintains an AWS CloudFormation template that creates an IAM role for incident responders and a set of Amazon CloudWatch alarms. The baseline must exist in us-east-1 and eu-west-1 in every account of the organization, including the management account. Accounts that are created in the future must receive it with no manual action. Trusted access between StackSets and Organizations is activated. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 220 comptes dans AWS Organizations, dont le compte de gestion, qui exécute aussi les outils de facturation de l'organisation. L'équipe de sécurité maintient un modèle AWS CloudFormation qui crée un rôle IAM pour les intervenants en cas d'incident et un ensemble d'alarmes Amazon CloudWatch. La base de référence doit exister dans us-east-1 et eu-west-1 dans chaque compte de l'organisation, y compris le compte de gestion. Les comptes créés à l'avenir doivent la recevoir sans action manuelle. L'accès approuvé entre StackSets et Organizations est activé. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a service-managed StackSet that targets the organization root in both Regions with automatic deployment enabled; the management account receives stacks because it belongs to the root.
        fr: |-
          Créer un StackSet à autorisations gérées par le service qui cible la racine de l'organisation dans les deux Régions avec le déploiement automatique activé ; le compte de gestion reçoit les piles car il appartient à la racine.
    - id: b
      text:
        en: |-
          Create a service-managed StackSet that targets the organization root in both Regions with automatic deployment enabled, and deploy the same template as regular stacks in both Regions of the management account.
        fr: |-
          Créer un StackSet à autorisations gérées par le service qui cible la racine de l'organisation dans les deux Régions avec le déploiement automatique activé, et déployer le même modèle sous forme de piles ordinaires dans les deux Régions du compte de gestion.
    - id: c
      text:
        en: |-
          Create a self-managed StackSet in the management account that lists all 220 account IDs, create the execution role in every account, and add each new account to the StackSet from the account vending process when it is created.
        fr: |-
          Créer dans le compte de gestion un StackSet à autorisations autogérées qui liste les 220 ID de comptes, créer le rôle d'exécution dans chaque compte, et ajouter chaque nouveau compte au StackSet depuis le processus de création de comptes, au moment de sa création.
    - id: d
      text:
        en: |-
          Create a service-managed StackSet from a delegated administrator account that targets the organization root in both Regions, because a delegated administrator can deploy to the management account.
        fr: |-
          Créer un StackSet à autorisations gérées par le service depuis un compte administrateur délégué qui cible la racine de l'organisation dans les deux Régions, car un administrateur délégué peut déployer dans le compte de gestion.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A service-managed StackSet with automatic deployment covers every member account, including future ones, but CloudFormation never deploys service-managed stack instances to the management account, even when it belongs to a targeted OU or the root. The management account therefore needs its own stacks, here two regular stacks, while the StackSet handles the other 219 accounts.
    fr: |-
      Un StackSet à autorisations gérées par le service avec déploiement automatique couvre chaque compte membre, y compris les comptes futurs, mais CloudFormation ne déploie jamais d'instances de pile gérées par le service dans le compte de gestion, même lorsqu'il appartient à une OU ciblée ou à la racine. Le compte de gestion a donc besoin de ses propres piles, ici deux piles ordinaires, tandis que le StackSet gère les 219 autres comptes.
  options:
    a:
      en: |-
        Service-managed StackSets skip the management account even when they target the root, so the baseline would be missing there.
      fr: |-
        Les StackSets à autorisations gérées par le service ignorent le compte de gestion même lorsqu'ils ciblent la racine : la base de référence y manquerait.
    c:
      en: |-
        Self-managed StackSets have no automatic deployment, so every new account needs a manual execution role and a manual stack instance, which is high overhead.
      fr: |-
        Les StackSets autogérés n'ont pas de déploiement automatique : chaque nouveau compte exige un rôle d'exécution et une instance de pile créés manuellement, ce qui représente une forte charge.
    d:
      en: |-
        Operations started by a delegated administrator are performed by the management account and follow the same rule: no stack instances are deployed to the management account.
      fr: |-
        Les opérations lancées par un administrateur délégué sont exécutées par le compte de gestion et suivent la même règle : aucune instance de pile n'est déployée dans le compte de gestion.
references:
  - title: Create CloudFormation StackSets with service-managed permissions - AWS CloudFormation
