id: sapc03-5a-cross-account-secret-ref
objective: "5.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security account owns an AWS Secrets Manager secret that holds the password of a partner database. The secret is encrypted with the AWS managed key aws/secretsmanager. AWS CloudFormation stacks in 15 workload accounts in the same Region create AWS DMS endpoints whose Password property must use this password. In each workload account, the stacks are deployed by an IAM role named StackDeployRole, which is also the CloudFormation service role of the stacks. The security team requires that the secret exist only in the security account and that the password never appear in templates or parameter files.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Le compte de sécurité d'AnyCompany détient un secret AWS Secrets Manager qui contient le mot de passe d'une base de données partenaire. Le secret est chiffré avec la clé gérée par AWS aws/secretsmanager. Des piles AWS CloudFormation de 15 comptes de charge de travail, dans la même Région, créent des points de terminaison AWS DMS dont la propriété Password doit utiliser ce mot de passe. Dans chaque compte de charge de travail, les piles sont déployées par un rôle IAM nommé StackDeployRole, qui est aussi le rôle de service CloudFormation des piles. L'équipe de sécurité exige que le secret n'existe que dans le compte de sécurité et que le mot de passe n'apparaisse jamais dans les modèles ni dans les fichiers de paramètres.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          Reference the secret with its complete ARN in a secretsmanager dynamic reference in the Password property of the DMS endpoints.
        fr: |-
          Référencer le secret par son ARN complet dans une référence dynamique secretsmanager dans la propriété Password des points de terminaison DMS.
    - id: b
      text:
        en: |-
          Reference the secret by its name in the dynamic reference, because Secrets Manager resolves secret names across the accounts of the same organization.
        fr: |-
          Référencer le secret par son nom dans la référence dynamique, car Secrets Manager résout les noms de secrets entre les comptes d'une même organisation.
    - id: c
      text:
        en: |-
          Add a resource policy to the secret that allows secretsmanager:GetSecretValue for StackDeployRole in each workload account, and allow the same action on the secret in the role's identity policy.
        fr: |-
          Ajouter au secret une politique de ressource qui autorise secretsmanager:GetSecretValue pour StackDeployRole dans chaque compte de charge de travail, et autoriser la même action sur le secret dans la politique d'identité du rôle.
    - id: d
      text:
        en: |-
          Add the workload accounts to the key policy of the aws/secretsmanager key so that StackDeployRole can decrypt the secret in the security account.
        fr: |-
          Ajouter les comptes de charge de travail à la politique de clé de la clé aws/secretsmanager pour que StackDeployRole puisse déchiffrer le secret dans le compte de sécurité.
    - id: e
      text:
        en: |-
          Re-encrypt the secret with a customer managed KMS key whose key policy allows kms:Decrypt for StackDeployRole, and allow kms:Decrypt on that key in the role's identity policy.
        fr: |-
          Chiffrer de nouveau le secret avec une clé KMS gérée par le client dont la politique de clé autorise kms:Decrypt pour StackDeployRole, et autoriser kms:Decrypt sur cette clé dans la politique d'identité du rôle.
    - id: f
      text:
        en: |-
          Store the password in a Parameter Store SecureString parameter in the security account, and use an ssm-secure dynamic reference with the parameter ARN in the workload stacks.
        fr: |-
          Stocker le mot de passe dans un paramètre SecureString de Parameter Store du compte de sécurité, et utiliser une référence dynamique ssm-secure avec l'ARN du paramètre dans les piles des comptes de charge de travail.
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      A dynamic reference to a secret in another account must use the complete secret ARN, and the principal that resolves it needs GetSecretValue. Cross-account access requires three policies: the secret's resource policy and the role's identity policy for Secrets Manager, and a key policy plus identity policy for KMS. The AWS managed key aws/secretsmanager can't be used for cross-account access, so the secret must be encrypted with a customer managed key.
    fr: |-
      Une référence dynamique vers un secret d'un autre compte doit utiliser l'ARN complet du secret, et le principal qui la résout a besoin de GetSecretValue. L'accès entre comptes exige trois politiques : la politique de ressource du secret et la politique d'identité du rôle pour Secrets Manager, ainsi qu'une politique de clé et une politique d'identité pour KMS. La clé gérée par AWS aws/secretsmanager ne peut pas servir à un accès entre comptes : le secret doit donc être chiffré avec une clé gérée par le client.
  options:
    b:
      en: |-
        A name resolves only to secrets in the caller's own account; secrets in other accounts must be referenced by their complete ARN.
      fr: |-
        Un nom ne se résout qu'en secrets du compte de l'appelant ; les secrets d'autres comptes doivent être référencés par leur ARN complet.
    d:
      en: |-
        The policy of an AWS managed key can't be edited, and Secrets Manager doesn't support cross-account access to secrets encrypted with aws/secretsmanager.
      fr: |-
        La politique d'une clé gérée par AWS n'est pas modifiable, et Secrets Manager ne prend pas en charge l'accès entre comptes aux secrets chiffrés avec aws/secretsmanager.
    f:
      en: |-
        ssm-secure dynamic references can't read Parameter Store values from another account, and they work only on a short list of properties.
      fr: |-
        Les références dynamiques ssm-secure ne peuvent pas lire de valeurs Parameter Store d'un autre compte, et elles ne fonctionnent que sur une courte liste de propriétés.
references:
  - title: Access AWS Secrets Manager secrets from a different account - AWS Secrets Manager
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
  - title: Get a secret or secret value from Secrets Manager - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-secretsmanager.html
