id: sapc03-5a-stackset-retain-decommission
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deployed its VPC baseline (VPCs, subnets, route tables, and transit gateway attachments) to 80 accounts with a service-managed StackSet named net-baseline that has automatic deployment enabled. The company is moving to a model in which each account team owns the stack that manages its network. The VPCs carry production traffic and must not be deleted when net-baseline is retired. The migration will take several months, account by account. Until then, accounts that are moved out of the targeted OU into a Quarantine OU for investigation must keep their network running.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise a déployé sa base de référence VPC (VPC, sous-réseaux, tables de routage et attachements de passerelle de transit) dans 80 comptes avec un StackSet à autorisations gérées par le service nommé net-baseline, dont le déploiement automatique est activé. L'entreprise passe à un modèle où chaque équipe de compte détient la pile qui gère son réseau. Les VPC transportent du trafic de production et ne doivent pas être supprimés lors du retrait de net-baseline. La migration prendra plusieurs mois, compte par compte. D'ici là, les comptes déplacés hors de l'OU ciblée vers une OU Quarantine pour enquête doivent conserver leur réseau en fonctionnement.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Delete the net-baseline StackSet directly, because deleting a StackSet keeps the resources of its stack instances in each account.
        fr: |-
          Supprimer directement le StackSet net-baseline, car la suppression d'un StackSet conserve les ressources de ses instances de pile dans chaque compte.
    - id: b
      text:
        en: |-
          Delete the stack instances from net-baseline with the option to retain stacks, and then delete the empty StackSet.
        fr: |-
          Supprimer les instances de pile de net-baseline avec l'option de conservation des piles, puis supprimer le StackSet vide.
    - id: c
      text:
        en: |-
          Turn on termination protection for each stack instance, so that delete operations started by net-baseline leave the resources in place.
        fr: |-
          Activer la protection contre la résiliation de chaque instance de pile, pour que les opérations de suppression lancées par net-baseline laissent les ressources en place.
    - id: d
      text:
        en: |-
          Update the automatic deployment settings of net-baseline with RetainStacksOnAccountRemoval set to true.
        fr: |-
          Mettre à jour les paramètres de déploiement automatique de net-baseline avec RetainStacksOnAccountRemoval défini à true.
    - id: e
      text:
        en: |-
          Add a DIFFERENCE account filter that lists the accounts moved to the Quarantine OU, so that net-baseline keeps their stacks.
        fr: |-
          Ajouter un filtre de comptes DIFFERENCE qui liste les comptes déplacés vers l'OU Quarantine, pour que net-baseline conserve leurs piles.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Deleting stack instances with retain stacks removes them from the StackSet but keeps the stacks and their resources in the accounts, after which the empty StackSet can be deleted and account teams take over the standalone stacks. With RetainStacksOnAccountRemoval set to true, an account that leaves the targeted OU keeps its stack and resources instead of having them deleted by automatic deployment.
    fr: |-
      Supprimer des instances de pile avec conservation des piles les retire du StackSet mais garde les piles et leurs ressources dans les comptes ; le StackSet vide peut ensuite être supprimé et les équipes de compte reprennent les piles autonomes. Avec RetainStacksOnAccountRemoval défini à true, un compte qui quitte l'OU ciblée conserve sa pile et ses ressources au lieu de les voir supprimées par le déploiement automatique.
  options:
    a:
      en: |-
        A StackSet that still has stack instances can't be deleted; its instances must be deleted first, with or without retaining the stacks.
      fr: |-
        Un StackSet qui a encore des instances de pile ne peut pas être supprimé ; ses instances doivent être supprimées d'abord, avec ou sans conservation des piles.
    c:
      en: |-
        Termination protection makes the delete operations fail instead of retaining the stacks, leaving the StackSet with failed instances that block its retirement.
      fr: |-
        La protection contre la résiliation fait échouer les opérations de suppression au lieu de conserver les piles, ce qui laisse au StackSet des instances en échec qui bloquent son retrait.
    e:
      en: |-
        The account removal behavior of automatic deployment decides what happens when an account leaves the OU, and automatic deployment ignores account-level filters.
      fr: |-
        C'est le comportement de retrait de compte du déploiement automatique qui décide de ce qui se passe lorsqu'un compte quitte l'OU, et le déploiement automatique ignore les filtres au niveau des comptes.
references:
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
  - title: Create CloudFormation StackSets with service-managed permissions - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-associate-stackset-with-org.html
