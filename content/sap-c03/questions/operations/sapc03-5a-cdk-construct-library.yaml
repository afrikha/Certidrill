id: sapc03-5a-cdk-construct-library
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 40 application teams that deploy containerized services to Amazon ECS on AWS Fargate in 60 AWS accounts. Each team copies and edits a 900-line AWS CloudFormation template that creates an Application Load Balancer, an ECS service, scaling policies, Amazon CloudWatch alarms, and IAM roles, and the copies have drifted away from the platform team's standards. The teams write their applications in TypeScript and want to declare a new service in a few lines of that language. The platform team wants to publish one versioned, reusable pattern and to test it with unit tests that run in the build before each release. Every deployment must keep CloudFormation change sets, rollback, and drift detection. The solution must minimize the code that each application team maintains.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 40 équipes applicatives qui déploient des services conteneurisés sur Amazon ECS avec AWS Fargate dans 60 comptes AWS. Chaque équipe copie et modifie un modèle AWS CloudFormation de 900 lignes qui crée un Application Load Balancer, un service ECS, des politiques de mise à l'échelle, des alarmes Amazon CloudWatch et des rôles IAM, et les copies se sont écartées des normes de l'équipe plateforme. Les équipes écrivent leurs applications en TypeScript et veulent déclarer un nouveau service en quelques lignes de ce langage. L'équipe plateforme veut publier un modèle de conception unique, versionné et réutilisable, et le tester avec des tests unitaires exécutés dans la génération avant chaque publication. Chaque déploiement doit conserver les jeux de modifications, la restauration et la détection de dérive de CloudFormation. La solution doit réduire au minimum le code que chaque équipe applicative maintient.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Publish the template as a CloudFormation module in the private registry of each account, have the teams reference the module type in their own YAML templates with the platform defaults as module parameters, and test each module version by deploying it to a sandbox account before release.
        fr: |-
          Publier le modèle sous forme de module CloudFormation dans le registre privé de chaque compte, faire référencer le type de module par les équipes dans leurs propres modèles YAML avec les valeurs par défaut de la plateforme comme paramètres, et tester chaque version du module en le déployant dans un compte bac à sable avant publication.
    - id: b
      text:
        en: |-
          Build an AWS CDK L3 construct in TypeScript that wires the load balancer, service, scaling, alarms, and roles with the platform defaults, publish it as a versioned package in AWS CodeArtifact, and test the synthesized template with the CDK assertions module in the build.
        fr: |-
          Créer une construction AWS CDK de niveau L3 en TypeScript qui assemble l'équilibreur de charge, le service, la mise à l'échelle, les alarmes et les rôles avec les valeurs par défaut de la plateforme, la publier comme package versionné dans AWS CodeArtifact, et tester le modèle synthétisé avec le module assertions de CDK dans la génération.
    - id: c
      text:
        en: |-
          Rewrite the pattern as an AWS SAM template that uses the AWS::Serverless transform, share it through the AWS Serverless Application Repository, and have each team deploy it as a nested application with its own parameter values.
        fr: |-
          Réécrire le modèle de conception sous forme de modèle AWS SAM qui utilise la transformation AWS::Serverless, le partager par l'AWS Serverless Application Repository, et faire déployer par chaque équipe une application imbriquée avec ses propres valeurs de paramètres.
    - id: d
      text:
        en: |-
          Write a TypeScript library that calls the AWS SDK to create the load balancer, service, alarms, and roles directly, publish it as an npm package, run it from each team's pipeline, and test it with Jest tests that mock the SDK calls.
        fr: |-
          Écrire une bibliothèque TypeScript qui appelle le kit SDK AWS pour créer directement l'équilibreur de charge, le service, les alarmes et les rôles, la publier comme package npm, l'exécuter depuis le pipeline de chaque équipe, et la tester avec des tests Jest qui simulent les appels au SDK.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An L3 (pattern) construct packages several resources wired together behind a small API, so a team declares a service in a few lines of TypeScript and inherits the platform defaults by upgrading the package version. CDK synthesizes a CloudFormation template, so every deployment is still a stack with change sets, rollback, and drift detection. The CDK assertions module runs fine-grained tests on the synthesized template with Jest in the build, before any release.
    fr: |-
      Une construction L3 (modèle de conception) regroupe plusieurs ressources reliées entre elles derrière une petite API : une équipe déclare un service en quelques lignes de TypeScript et hérite des valeurs par défaut de la plateforme en mettant à jour la version du package. CDK synthétise un modèle CloudFormation, donc chaque déploiement reste une pile avec jeux de modifications, restauration et détection de dérive. Le module assertions de CDK exécute des tests précis sur le modèle synthétisé avec Jest dans la génération, avant toute publication.
  options:
    a:
      en: |-
        A module is reusable, but teams keep writing YAML instead of TypeScript, and deploying to a sandbox account is an integration test, not a unit test that runs in the build.
      fr: |-
        Un module est réutilisable, mais les équipes continuent d'écrire du YAML au lieu de TypeScript, et un déploiement dans un compte bac à sable est un test d'intégration, pas un test unitaire exécuté dans la génération.
    c:
      en: |-
        AWS SAM is a YAML shorthand aimed at serverless applications; it doesn't let teams declare the service in TypeScript, and it provides no unit-test framework for the pattern.
      fr: |-
        AWS SAM est une syntaxe YAML abrégée destinée aux applications sans serveur ; elle ne permet pas de déclarer le service en TypeScript et n'offre aucun cadre de tests unitaires pour le modèle de conception.
    d:
      en: |-
        Direct SDK calls bypass CloudFormation, so deployments lose change sets, automatic rollback, and drift detection, and the library must handle every create, update, and delete itself.
      fr: |-
        Les appels directs au SDK contournent CloudFormation : les déploiements perdent les jeux de modifications, la restauration automatique et la détection de dérive, et la bibliothèque doit gérer elle-même chaque création, mise à jour et suppression.
references:
  - title: Testing AWS CDK applications - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/testing.html
