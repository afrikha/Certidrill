id: sapc03-5c-health-org-feed-tickets
objective: "5.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 member accounts in AWS Organizations with all features enabled, and it creates about 10 new accounts each month through an account vending process. A central operations account must open a ticket in the company's IT service management tool, through its HTTPS webhook, for every AWS Health scheduled change event for Amazon EC2 in any account, such as an instance retirement or a scheduled maintenance. New accounts must be covered from the day they are created. The management account must not be used for daily operations. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 300 comptes membres dans AWS Organizations avec toutes les fonctionnalités activées, et crée environ 10 nouveaux comptes par mois au moyen d'un processus de distribution de comptes. Un compte d'exploitation central doit ouvrir un ticket dans l'outil de gestion des services informatiques de l'entreprise, via son webhook HTTPS, pour chaque événement AWS Health de modification planifiée concernant Amazon EC2 dans n'importe quel compte, comme un retrait d'instance ou une maintenance planifiée. Les nouveaux comptes doivent être couverts dès le jour de leur création. Le compte de gestion ne doit pas être utilisé pour l'exploitation quotidienne. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Use a CloudFormation StackSet with automatic deployment to create, in every member account, an EventBridge rule that forwards EC2 scheduled change events to a central event bus in the operations account, where a rule sends them to an API destination for the webhook.
        fr: |-
          Utiliser un StackSet CloudFormation avec déploiement automatique pour créer, dans chaque compte membre, une règle EventBridge qui transfère les événements de modification planifiée EC2 vers un bus d'événements central du compte d'exploitation, où une règle les envoie à une destination d'API pour le webhook.
    - id: b
      text:
        en: |-
          Enable AWS Health organizational view, register the operations account as a delegated administrator for AWS Health, and create one EventBridge rule in that account that matches EC2 scheduled change events and targets an API destination for the webhook.
        fr: |-
          Activer la vue organisationnelle d'AWS Health, enregistrer le compte d'exploitation comme administrateur délégué pour AWS Health, et créer dans ce compte une seule règle EventBridge qui correspond aux événements de modification planifiée EC2 et cible une destination d'API pour le webhook.
    - id: c
      text:
        en: |-
          Deploy an AWS Lambda function in the operations account that assumes a role in each member account every 5 minutes, calls the AWS Health DescribeEvents API, and posts new EC2 scheduled change events to the webhook.
        fr: |-
          Déployer dans le compte d'exploitation une fonction AWS Lambda qui assume toutes les 5 minutes un rôle dans chaque compte membre, appelle l'API AWS Health DescribeEvents et publie les nouveaux événements de modification planifiée EC2 sur le webhook.
    - id: d
      text:
        en: |-
          Create an EventBridge rule in the operations account that matches EC2 scheduled change events, and add a resource-based policy to its default event bus that allows events:PutEvents from every account of the organization with the aws:PrincipalOrgID condition.
        fr: |-
          Créer dans le compte d'exploitation une règle EventBridge qui correspond aux événements de modification planifiée EC2, et ajouter à son bus d'événements par défaut une politique basée sur les ressources qui autorise events:PutEvents depuis tous les comptes de l'organisation avec la condition aws:PrincipalOrgID.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With organizational view turned on, the management account or a delegated administrator account receives a single feed of AWS Health events from all accounts of the organization, including in EventBridge. One rule in the delegated administrator account then covers every current and future account, with nothing to deploy in the member accounts.
    fr: |-
      Une fois la vue organisationnelle activée, le compte de gestion ou un compte administrateur délégué reçoit un flux unique des événements AWS Health de tous les comptes de l'organisation, y compris dans EventBridge. Une seule règle dans le compte administrateur délégué couvre alors tous les comptes actuels et futurs, sans rien déployer dans les comptes membres.
  options:
    a:
      en: |-
        This works, but it deploys and maintains a rule and a role in 300 accounts, which is more overhead than one organization-wide feed.
      fr: |-
        Cela fonctionne, mais il faut déployer et maintenir une règle et un rôle dans 300 comptes, ce qui représente plus de charge qu'un flux unique pour l'organisation.
    c:
      en: |-
        Polling every account with custom code adds a function, cross-account roles, and state to track, and it misses events between polls.
      fr: |-
        Interroger chaque compte avec du code personnalisé ajoute une fonction, des rôles entre comptes et un état à suivre, et des événements arrivent entre deux interrogations.
    d:
      en: |-
        A bus policy only allows other accounts to send events; member accounts don't forward their Health events unless they have their own rules, and a rule only receives its own account's Health events.
      fr: |-
        Une politique de bus autorise seulement d'autres comptes à envoyer des événements ; les comptes membres ne transfèrent pas leurs événements Health sans leurs propres règles, et une règle ne reçoit que les événements Health de son propre compte.
references:
  - title: "Aggregating AWS Health events using organizational view and delegated administrator access - AWS Health"
    url: https://docs.aws.amazon.com/health/latest/ug/aggregating-health-events.html
  - title: "Monitoring events in AWS Health with Amazon EventBridge"
    url: https://docs.aws.amazon.com/health/latest/ug/cloudwatch-events-health.html
