id: sapc03-5b-metrics-insights-tag-alarm
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's orders application runs on Amazon EC2 instances in several Auto Scaling groups that scale out and in many times a day. The instances carry the tags Application=Orders and Environment=Prod. The team created one CloudWatch alarm per instance, but the alarms of terminated instances stay in INSUFFICIENT_DATA, and new instances have no alarm until someone adds one. The team wants a single alarm that tracks the highest CPU utilization across all current and future instances with these tags, without any automation to maintain.

    Which solution will meet these requirements?
  fr: |
    L'application de commandes d'AnyCompany s'exécute sur des instances Amazon EC2 de plusieurs groupes Auto Scaling qui augmentent et réduisent leur capacité de nombreuses fois par jour. Les instances portent les balises Application=Orders et Environment=Prod. L'équipe a créé une alarme CloudWatch par instance, mais les alarmes des instances résiliées restent à l'état INSUFFICIENT_DATA, et les nouvelles instances n'ont pas d'alarme tant que quelqu'un ne l'a pas ajoutée. L'équipe veut une seule alarme qui suit l'utilisation du processeur la plus élevée de toutes les instances actuelles et futures portant ces balises, sans aucune automatisation à maintenir.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an EventBridge rule on EC2 instance launch and termination events that invokes an AWS Lambda function to create and delete the per-instance alarms.", fr: "Créer une règle EventBridge sur les événements de lancement et de résiliation d'instances EC2 qui appelle une fonction AWS Lambda pour créer et supprimer les alarmes par instance." } }
    - { id: b, text: { en: "Create an alarm on the average CPUUtilization metric of each Auto Scaling group by using the AutoScalingGroupName dimension of the AWS/EC2 namespace.", fr: "Créer une alarme sur la métrique CPUUtilization moyenne de chaque groupe Auto Scaling en utilisant la dimension AutoScalingGroupName de l'espace de noms AWS/EC2." } }
    - { id: c, text: { en: "Enable resource tags on telemetry, and create an alarm on a Metrics Insights query that selects MAX(CPUUtilization) from AWS/EC2 where the two tags match.", fr: "Activer les balises de ressources sur la télémétrie, et créer une alarme sur une requête Metrics Insights qui sélectionne MAX(CPUUtilization) dans AWS/EC2 où les deux balises correspondent." } }
    - { id: d, text: { en: "Create a composite alarm whose rule combines the per-instance alarms with OR, and update the rule from Auto Scaling lifecycle hooks when instances change.", fr: "Créer une alarme composite dont la règle combine les alarmes par instance avec OR, et mettre à jour la règle depuis des hooks de cycle de vie Auto Scaling quand les instances changent." } }
answer: { optionId: c }
explanation:
  correct:
    en: "An alarm on a Metrics Insights query tracks multiple resources without being updated later, because the query catches new and changed resources. After resource tags on telemetry are enabled, the query can filter AWS/EC2 metrics by tags, so MAX(CPUUtilization) for Application=Orders and Environment=Prod follows the fleet as it scales."
    fr: "Une alarme sur une requête Metrics Insights suit plusieurs ressources sans devoir être mise à jour, car la requête intègre les ressources nouvelles et modifiées. Une fois les balises de ressources activées sur la télémétrie, la requête peut filtrer les métriques AWS/EC2 par balises : MAX(CPUUtilization) pour Application=Orders et Environment=Prod suit le parc au fil de sa mise à l'échelle."
  options:
    a: { en: "A function that creates and deletes alarms is the automation that the team does not want to maintain, and it keeps one alarm per instance.", fr: "Une fonction qui crée et supprime des alarmes est l'automatisation que l'équipe ne veut pas maintenir, et elle conserve une alarme par instance." }
    b: { en: "An average per group hides one overloaded instance, the requirement asks for the highest value, and it needs one alarm per group instead of one alarm.", fr: "Une moyenne par groupe masque une instance surchargée, l'exigence porte sur la valeur la plus élevée, et il faut une alarme par groupe au lieu d'une seule." }
    d: { en: "The composite alarm still depends on per-instance alarms, and updating its rule from lifecycle hooks is automation to maintain.", fr: "L'alarme composite dépend toujours des alarmes par instance, et mettre à jour sa règle depuis des hooks de cycle de vie est une automatisation à maintenir." }
references:
  - title: Alarms on CloudWatch Metrics Insights queries in CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-metrics-insights-alarms.html
