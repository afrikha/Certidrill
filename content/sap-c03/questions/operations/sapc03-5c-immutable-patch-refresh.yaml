id: sapc03-5c-immutable-patch-refresh
objective: "5.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retailer runs its storefront on 400 Amazon Linux 2023 instances in an Auto Scaling group across three Availability Zones. The group's launch template references a specific numbered version. Monthly in-place patching with Patch Manager has caused configuration drift and failed reboots, so the company wants immutable patching instead. A patched and tested AMI must be produced every month, rolled out in batches that keep at least 90 percent of the capacity healthy, and rolled back automatically to the previous configuration if a CloudWatch alarm on the storefront error rate enters the ALARM state during the rollout. The company wants managed services and the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Un détaillant exploite sa vitrine sur 400 instances Amazon Linux 2023 dans un groupe Auto Scaling réparti sur trois zones de disponibilité. Le modèle de lancement du groupe référence une version numérotée précise. L'application mensuelle des correctifs sur place avec Patch Manager a provoqué une dérive de configuration et des redémarrages en échec : l'entreprise veut donc des correctifs immuables. Une AMI corrigée et testée doit être produite chaque mois, déployée par lots qui conservent au moins 90 % de la capacité saine, et restaurée automatiquement à la configuration précédente si une alarme CloudWatch sur le taux d'erreur de la vitrine passe à l'état ALARM pendant le déploiement. L'entreprise veut des services gérés et le MOINS de code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Patch Manager patch policy that installs patches in a monthly maintenance window with a concurrency of 10 percent, and attach the error-rate alarm to the patching operation.
        fr: |-
          Créer une politique de correctifs Patch Manager qui installe les correctifs dans une fenêtre de maintenance mensuelle avec une concurrence de 10 %, et attacher l'alarme de taux d'erreur à l'opération d'application des correctifs.
    - id: b
      text:
        en: |-
          Build the monthly AMI with an EC2 Image Builder pipeline, point the group at the $Latest version of the launch template, and start an instance refresh with auto rollback and the error-rate alarm.
        fr: |-
          Construire l'AMI mensuelle avec un pipeline EC2 Image Builder, faire pointer le groupe vers la version $Latest du modèle de lancement, et démarrer une actualisation d'instances avec restauration automatique et l'alarme de taux d'erreur.
    - id: c
      text:
        en: |-
          Build and test the AMI with an EC2 Image Builder pipeline, add it to a new numbered launch template version, and refresh to that version with a 90 percent minimum healthy percentage, auto rollback, and the alarm.
        fr: |-
          Construire et tester l'AMI avec un pipeline EC2 Image Builder, l'ajouter à une nouvelle version numérotée du modèle de lancement, et actualiser vers cette version avec un pourcentage minimal d'instances saines de 90 %, la restauration automatique et l'alarme.
    - id: d
      text:
        en: |-
          Run an Automation runbook each month that patches one running instance, creates an AMI from it, and terminates the other instances in batches of 10 percent so that the group launches replacements.
        fr: |-
          Exécuter chaque mois un runbook Automation qui corrige une instance en fonctionnement, crée une AMI à partir de celle-ci, et résilie les autres instances par lots de 10 % afin que le groupe lance des remplaçantes.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Image Builder produces and tests a patched AMI on a schedule, and an instance refresh replaces instances in batches limited by the minimum healthy percentage. Auto rollback reverses the refresh if it fails or if a specified alarm enters ALARM, but it requires a desired configuration and a specific numbered launch template version, so the new AMI goes into a new numbered version.
    fr: |-
      Image Builder produit et teste une AMI corrigée selon une planification, et une actualisation d'instances remplace les instances par lots limités par le pourcentage minimal d'instances saines. La restauration automatique annule l'actualisation si elle échoue ou si une alarme spécifiée passe à ALARM, mais elle exige une configuration souhaitée et une version numérotée précise du modèle de lancement : la nouvelle AMI va donc dans une nouvelle version numérotée.
  options:
    a:
      en: |-
        A patch policy still patches the running instances in place, which is what caused the drift, and it doesn't roll back to the previous configuration.
      fr: |-
        Une politique de correctifs corrige toujours les instances en fonctionnement sur place, ce qui a causé la dérive, et elle ne restaure pas la configuration précédente.
    b:
      en: |-
        Rollback isn't available when the group uses the $Latest or $Default launch template version, so the alarm would fail the refresh without rolling back.
      fr: |-
        La restauration n'est pas disponible quand le groupe utilise la version $Latest ou $Default du modèle de lancement : l'alarme ferait échouer l'actualisation sans restauration.
    d:
      en: |-
        Building the AMI from a patched running instance carries its drift, terminating instances in batches is custom orchestration, and nothing rolls back on the alarm.
      fr: |-
        Construire l'AMI à partir d'une instance en fonctionnement corrigée reprend sa dérive, résilier des instances par lots est une orchestration personnalisée, et rien n'est restauré sur alarme.
references:
  - title: "Undo changes with a manual or auto rollback - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/instance-refresh-rollback.html
