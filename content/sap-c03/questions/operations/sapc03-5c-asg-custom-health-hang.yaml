id: sapc03-5c-asg-custom-health-hang
objective: "5.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company runs a video-transcoding worker fleet on Amazon EC2 instances in an Auto Scaling group that uses EC2 health checks. The workers pull jobs from an Amazon SQS queue and have no load balancer or listening port. A few times a week, the worker process on an instance hangs while the operating system keeps running, so the instance passes its status checks and stays in service for hours without processing jobs. A watchdog agent on each instance already detects a hung worker within 60 seconds and can call AWS APIs with the instance role. The company wants a hung instance to be replaced within about 2 minutes, without adding infrastructure.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exploite une flotte de workers de transcodage vidéo sur des instances Amazon EC2 dans un groupe Auto Scaling qui utilise les vérifications de l'état EC2. Les workers récupèrent des tâches dans une file d'attente Amazon SQS et n'ont ni équilibreur de charge ni port d'écoute. Quelques fois par semaine, le processus worker d'une instance se bloque alors que le système d'exploitation continue de fonctionner : l'instance réussit ses vérifications d'état et reste en service pendant des heures sans traiter de tâches. Un agent de surveillance sur chaque instance détecte déjà un worker bloqué en 60 secondes et peut appeler les API AWS avec le rôle de l'instance. L'entreprise veut qu'une instance bloquée soit remplacée en 2 minutes environ, sans ajouter d'infrastructure.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Put a Network Load Balancer in front of the fleet with a TCP health check, and change the health check type of the group to ELB.
        fr: |-
          Placer un Network Load Balancer devant la flotte avec une vérification de l'état TCP, et changer le type de vérification de l'état du groupe en ELB.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm on each instance's StatusCheckFailed_System metric with the EC2 recover action.
        fr: |-
          Créer sur la métrique StatusCheckFailed_System de chaque instance une alarme CloudWatch avec l'action de récupération EC2.
    - id: c
      text:
        en: |-
          Have the watchdog agent call the Auto Scaling SetInstanceHealth API to mark its instance Unhealthy, so that the group replaces it.
        fr: |-
          Faire appeler par l'agent de surveillance l'API Auto Scaling SetInstanceHealth pour déclarer son instance Unhealthy, afin que le groupe la remplace.
    - id: d
      text:
        en: |-
          Turn on the EBS health check type for the group so that impaired instances are detected and replaced.
        fr: |-
          Activer le type de vérification de l'état EBS pour le groupe afin que les instances altérées soient détectées et remplacées.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A custom health check sends the instance's status directly to Amazon EC2 Auto Scaling; when an instance is marked Unhealthy, the group immediately replaces it with a new instance from the current launch template. The watchdog already detects the hang, so a single API call with the instance role adds no infrastructure.
    fr: |-
      Une vérification de l'état personnalisée envoie directement l'état de l'instance à Amazon EC2 Auto Scaling ; quand une instance est déclarée Unhealthy, le groupe la remplace immédiatement par une nouvelle instance issue du modèle de lancement actuel. L'agent de surveillance détecte déjà le blocage : un simple appel d'API avec le rôle de l'instance n'ajoute aucune infrastructure.
  options:
    a:
      en: |-
        The workers have no listening port, so a load balancer health check has nothing meaningful to test, and the load balancer is extra infrastructure.
      fr: |-
        Les workers n'ont pas de port d'écoute : une vérification de l'état par équilibreur de charge n'a rien de pertinent à tester, et l'équilibreur de charge est une infrastructure supplémentaire.
    b:
      en: |-
        Automatic recovery reacts to failed system status checks caused by AWS hardware or software issues; a hung process passes those checks, so nothing happens.
      fr: |-
        La récupération automatique réagit aux échecs de vérification d'état du système dus à des problèmes matériels ou logiciels AWS ; un processus bloqué réussit ces vérifications : rien ne se passe.
    d:
      en: |-
        EBS health checks detect impaired EBS volumes, not a hung application process.
      fr: |-
        Les vérifications de l'état EBS détectent les volumes EBS altérés, pas un processus applicatif bloqué.
references:
  - title: "Set up a custom health check for your Auto Scaling group"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/set-up-a-custom-health-check.html
  - title: "Health checks for instances in an Auto Scaling group - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html
