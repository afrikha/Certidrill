id: sapc03-5c-slo-dependency-warning
objective: "5.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company's quote service runs on Amazon EKS in a production account and calls a third-party pricing API over the internet. The service is instrumented with CloudWatch Application Signals, which already lists the pricing API as a dependency of the service. The contract with the pricing provider promises 99.5 percent availability per calendar month, and the vendor manager wants to measure that availability from the quote service's real calls, not from a test client. The vendor manager wants to be warned when less than 25 percent of the month's error budget remains, so that a penalty claim can be prepared. The company doesn't want to change application code.

    Which solution will meet these requirements?
  fr: |
    Le service de devis d'une compagnie d'assurance s'exécute sur Amazon EKS dans un compte de production et appelle une API de tarification tierce sur Internet. Le service est instrumenté avec CloudWatch Application Signals, qui répertorie déjà l'API de tarification comme dépendance du service. Le contrat avec le fournisseur de tarification promet une disponibilité de 99,5 % par mois calendaire, et le responsable fournisseurs veut mesurer cette disponibilité à partir des appels réels du service de devis, et non d'un client de test. Le responsable fournisseurs veut être averti lorsqu'il reste moins de 25 % du budget d'erreur du mois, afin de préparer une demande de pénalités. L'entreprise ne veut pas modifier le code de l'application.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Synthetics API canary that calls the pricing API every minute, and create a CloudWatch alarm when the canary's monthly SuccessPercent falls below 99.5 percent.
        fr: |-
          Créer un canary CloudWatch Synthetics de type API canary qui appelle l'API de tarification chaque minute, et créer une alarme CloudWatch quand le SuccessPercent mensuel du canary passe sous 99,5 %.
    - id: b
      text:
        en: |-
          Add code to the quote service that publishes a custom metric for each failed call to the pricing API, and create an SLO on that metric with a 99.5 percent goal.
        fr: |-
          Ajouter au service de devis du code qui publie une métrique personnalisée pour chaque appel en échec vers l'API de tarification, et créer un SLO sur cette métrique avec un objectif de 99,5 %.
    - id: c
      text:
        en: |-
          Create an SLO on the Availability of the quote service's own operations with a 99.5 percent goal, and an alarm when the remaining error budget falls below 25 percent.
        fr: |-
          Créer un SLO sur l'Availability des propres opérations du service de devis avec un objectif de 99,5 %, et une alarme quand le budget d'erreur restant passe sous 25 %.
    - id: d
      text:
        en: |-
          Create an SLO on the Availability of the pricing API dependency with a 99.5 percent goal and a monthly calendar interval, with a 25 percent warning threshold and alarm.
        fr: |-
          Créer un SLO sur l'Availability de la dépendance envers l'API de tarification avec un objectif de 99,5 % et un intervalle calendaire mensuel, avec un seuil et une alarme d'avertissement à 25 %.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Application Signals can define an SLO on a service dependency, using the metrics that the instrumentation already records for the real calls to that dependency, so no code changes are needed. A warning threshold marks the SLO as Warning when the remaining error budget falls below it, and an SLO warning alarm notifies the vendor manager.
    fr: |-
      Application Signals peut définir un SLO sur une dépendance de service, à partir des métriques que l'instrumentation enregistre déjà pour les appels réels à cette dépendance : aucune modification de code n'est nécessaire. Un seuil d'avertissement fait passer le SLO à l'état Warning quand le budget d'erreur restant passe en dessous, et une alarme d'avertissement de SLO prévient le responsable fournisseurs.
  options:
    a:
      en: |-
        A canary measures a test client's calls, which the vendor manager explicitly doesn't want, and an alarm on a monthly success rate doesn't warn on the remaining error budget.
      fr: |-
        Un canary mesure les appels d'un client de test, ce que le responsable fournisseurs ne veut justement pas, et une alarme sur un taux de réussite mensuel n'avertit pas sur le budget d'erreur restant.
    b:
      en: |-
        Publishing a custom metric requires changing the application code, and the dependency metrics already exist in Application Signals.
      fr: |-
        Publier une métrique personnalisée exige de modifier le code de l'application, et les métriques de la dépendance existent déjà dans Application Signals.
    c:
      en: |-
        The quote service's own availability mixes the provider's failures with the company's own faults, so it doesn't measure what the contract promises.
      fr: |-
        La disponibilité propre du service de devis mélange les échecs du fournisseur avec les pannes de l'entreprise : elle ne mesure pas ce que le contrat promet.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
