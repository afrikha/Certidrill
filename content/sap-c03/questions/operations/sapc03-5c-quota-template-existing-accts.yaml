id: sapc03-5c-quota-template-existing-accts
objective: "5.4.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Organizations with all features enabled and an account vending process that creates about 20 new accounts each month in eu-west-1 and eu-central-1. Every workload account needs an AWS Lambda concurrent executions quota of 5,000 and a VPCs per Region quota of 20 in both Regions. The organization also has 150 existing workload accounts that still have the default values for both quotas. Increases must be requested for new accounts without any action from the platform team when the accounts are created. The company wants the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany utilise AWS Organizations avec toutes les fonctionnalités activées et un processus de distribution de comptes qui crée environ 20 nouveaux comptes par mois dans eu-west-1 et eu-central-1. Chaque compte de charge de travail a besoin d'un quota d'exécutions simultanées AWS Lambda de 5 000 et d'un quota de VPC par Région de 20 dans les deux Régions. L'organisation compte aussi 150 comptes de charge de travail existants qui ont encore les valeurs par défaut des deux quotas. Les augmentations doivent être demandées pour les nouveaux comptes sans aucune action de l'équipe plateforme lors de la création des comptes. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Turn on Service Quotas Automatic Management in Notify and Auto-Adjust mode in every account, so that the quotas are raised to the required values.
        fr: |-
          Activer Service Quotas Automatic Management en mode Notify and Auto-Adjust dans chaque compte, afin que les quotas soient relevés aux valeurs requises.
    - id: b
      text:
        en: |-
          Add the four quota values (two quotas in two Regions) to a Service Quotas request template, and enable template association with the organization.
        fr: |-
          Ajouter les quatre valeurs de quota (deux quotas dans deux Régions) à un modèle de demande Service Quotas, et activer l'association du modèle avec l'organisation.
    - id: c
      text:
        en: |-
          Attach an SCP to the workload OUs that sets the Lambda concurrency and VPC quotas to the required values.
        fr: |-
          Attacher aux OU de charge de travail une SCP qui fixe les quotas de concurrence Lambda et de VPC aux valeurs requises.
    - id: d
      text:
        en: |-
          Run a one-time script that calls the RequestServiceQuotaIncrease API for both quotas in both Regions in each of the 150 existing accounts.
        fr: |-
          Exécuter une seule fois un script qui appelle l'API RequestServiceQuotaIncrease pour les deux quotas dans les deux Régions dans chacun des 150 comptes existants.
    - id: e
      text:
        en: |-
          Enable template association only, because an associated request template also applies its quota values to the accounts that already exist in the organization.
        fr: |-
          Activer seulement l'association du modèle, car un modèle de demande associé applique aussi ses valeurs de quota aux comptes qui existent déjà dans l'organisation.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A request template holds up to 10 quota increases and, once associated with the organization, requests them automatically for every new account, which covers the vending process. Templates don't change existing accounts, so the 150 existing accounts need their own increase requests, which a one-time script can submit through the Service Quotas API.
    fr: |-
      Un modèle de demande contient jusqu'à 10 augmentations de quota et, une fois associé à l'organisation, les demande automatiquement pour chaque nouveau compte, ce qui couvre le processus de distribution. Les modèles ne modifient pas les comptes existants : les 150 comptes existants ont besoin de leurs propres demandes d'augmentation, qu'un script exécuté une seule fois peut soumettre via l'API Service Quotas.
  options:
    a:
      en: |-
        Auto-Adjust requests increases only when usage crosses 80 or 95 percent, only for quotas that support automated approval, and without targeting a chosen value, so new accounts don't start with the required quotas.
      fr: |-
        Auto-Adjust ne demande des augmentations que lorsque l'utilisation dépasse 80 ou 95 %, uniquement pour les quotas qui prennent en charge l'approbation automatisée, et sans viser une valeur choisie : les nouveaux comptes ne démarrent pas avec les quotas requis.
    c:
      en: |-
        SCPs limit permissions; they can't set or raise service quotas.
      fr: |-
        Les SCP limitent les autorisations ; elles ne peuvent ni fixer ni relever des quotas de service.
    e:
      en: |-
        Changing or associating a template doesn't update quota values of existing accounts; it applies only to accounts created afterward.
      fr: |-
        Modifier ou associer un modèle ne met pas à jour les valeurs de quota des comptes existants ; il ne s'applique qu'aux comptes créés ensuite.
references:
  - title: "Using Service Quotas request templates"
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/organization-templates.html
  - title: "Service Quotas Automatic Management"
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/automatic-management.html
