id: sapc03-5a-stackset-delegated-admin
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's security tooling account maintains AWS CloudFormation templates that are deployed to all member accounts with service-managed StackSets. Today, security engineers sign in to the management account to create and update these StackSets. The company wants to stop granting security engineers any access to the management account. The security tooling account must keep creating and managing service-managed StackSets for all OUs, including automatic deployment to new accounts. Trusted access between StackSets and AWS Organizations is already activated.

    Which solution will meet these requirements?
  fr: |
    Le compte d'outillage de sécurité d'une entreprise maintient des modèles AWS CloudFormation déployés dans tous les comptes membres avec des StackSets à autorisations gérées par le service. Aujourd'hui, les ingénieurs de sécurité se connectent au compte de gestion pour créer et mettre à jour ces StackSets. L'entreprise veut cesser d'accorder aux ingénieurs de sécurité tout accès au compte de gestion. Le compte d'outillage de sécurité doit continuer à créer et gérer des StackSets à autorisations gérées par le service pour toutes les OU, y compris le déploiement automatique dans les nouveaux comptes. L'accès approuvé entre StackSets et AWS Organizations est déjà activé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Export the templates of the existing StackSets and recreate them as self-managed StackSets in the security tooling account, with an execution role in every member account.
        fr: |-
          Exporter les modèles des StackSets existants et les recréer sous forme de StackSets autogérés dans le compte d'outillage de sécurité, avec un rôle d'exécution dans chaque compte membre.
    - id: b
      text:
        en: |-
          Create an IAM role in the management account with StackSets permissions only, and let the security engineers assume it from the security tooling account.
        fr: |-
          Créer dans le compte de gestion un rôle IAM disposant uniquement des autorisations StackSets, et laisser les ingénieurs de sécurité l'endosser depuis le compte d'outillage de sécurité.
    - id: c
      text:
        en: |-
          Attach an SCP to the security tooling account that allows organizations:* and cloudformation:* so that the account can manage StackSets and their stack instances for the whole organization.
        fr: |-
          Attacher au compte d'outillage de sécurité une SCP qui autorise organizations:* et cloudformation:* pour que le compte puisse gérer les StackSets et leurs instances de pile pour toute l'organisation.
    - id: d
      text:
        en: |-
          Register the security tooling account as a delegated administrator for StackSets, and have the engineers manage service-managed StackSets there with --call-as DELEGATED_ADMIN.
        fr: |-
          Enregistrer le compte d'outillage de sécurité comme administrateur délégué pour StackSets, et faire gérer par les ingénieurs les StackSets à autorisations gérées par le service depuis ce compte avec --call-as DELEGATED_ADMIN.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Once trusted access is activated, the management account can register member accounts as delegated administrators for StackSets. A delegated administrator creates and manages service-managed StackSets for the organization, including automatic deployment, by adding --call-as DELEGATED_ADMIN to its calls, so engineers no longer need any access to the management account.
    fr: |-
      Une fois l'accès approuvé activé, le compte de gestion peut enregistrer des comptes membres comme administrateurs délégués pour StackSets. Un administrateur délégué crée et gère les StackSets à autorisations gérées par le service de l'organisation, y compris le déploiement automatique, en ajoutant --call-as DELEGATED_ADMIN à ses appels : les ingénieurs n'ont plus besoin d'aucun accès au compte de gestion.
  options:
    a:
      en: |-
        Self-managed StackSets lose automatic deployment to new accounts and require an execution role to be created in every account.
      fr: |-
        Les StackSets autogérés perdent le déploiement automatique dans les nouveaux comptes et exigent la création d'un rôle d'exécution dans chaque compte.
    b:
      en: |-
        Assuming a role in the management account is still access to the management account, which the company wants to remove.
      fr: |-
        Endosser un rôle dans le compte de gestion reste un accès au compte de gestion, ce que l'entreprise veut supprimer.
    c:
      en: |-
        SCPs never grant permissions; they only limit the maximum permissions of member accounts, so they can't make an account a StackSets administrator.
      fr: |-
        Les SCP n'accordent jamais d'autorisations ; elles limitent seulement les autorisations maximales des comptes membres, et ne peuvent donc pas faire d'un compte un administrateur StackSets.
references:
  - title: Create CloudFormation StackSets with service-managed permissions - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-associate-stackset-with-org.html
  - title: Activate trusted access for StackSets with AWS Organizations - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-activate-trusted-access.html
