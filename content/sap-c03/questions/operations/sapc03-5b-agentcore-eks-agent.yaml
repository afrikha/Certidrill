id: sapc03-5b-agentcore-eks-agent
objective: "5.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a customer-support agent, built with the Strands Agents framework, on Amazon EKS, and it will keep this hosting choice. The agent calls foundation models in Amazon Bedrock and uses three internal APIs as tools, and a session can last up to 20 minutes. The operations team wants Amazon Bedrock AgentCore Observability for the agent: sessions, traces of each step, latency, token usage, and error rates in Amazon CloudWatch. No CloudWatch tracing feature has been configured in the account yet.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany exécute sur Amazon EKS un agent de support client construit avec le framework Strands Agents, et elle conservera ce choix d'hébergement. L'agent appelle des modèles de fondation dans Amazon Bedrock et utilise trois API internes comme outils, et une session peut durer jusqu'à 20 minutes. L'équipe d'exploitation veut Amazon Bedrock AgentCore Observability pour l'agent : les sessions, les traces de chaque étape, la latence, l'utilisation des jetons et les taux d'erreur dans Amazon CloudWatch. Aucune fonctionnalité de traçage CloudWatch n'est encore configurée dans le compte.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable CloudWatch Transaction Search once in the account, so that spans are ingested as structured logs.", fr: "Activer une fois CloudWatch Transaction Search dans le compte, afin que les spans soient ingérés comme journaux structurés." } }
    - { id: b, text: { en: "Deploy the AWS X-Ray daemon as a DaemonSet on the cluster, and add the X-Ray SDK to the agent code.", fr: "Déployer le démon AWS X-Ray comme DaemonSet sur le cluster, et ajouter le SDK X-Ray au code de l'agent." } }
    - { id: c, text: { en: "Turn on Amazon Bedrock model invocation logging, so that the agent's prompts and responses are delivered to CloudWatch Logs.", fr: "Activer la journalisation des appels de modèles Amazon Bedrock, afin que les invites et les réponses de l'agent soient livrées dans CloudWatch Logs." } }
    - { id: d, text: { en: "Add the ADOT SDK to the agent, and set the OpenTelemetry environment variables that export OTLP traces and logs to CloudWatch.", fr: "Ajouter le SDK ADOT à l'agent, et définir les variables d'environnement OpenTelemetry qui exportent les traces et journaux OTLP vers CloudWatch." } }
    - { id: e, text: { en: "Migrate the agent to Amazon Bedrock AgentCore Runtime, so that the runtime collects its telemetry without any instrumentation.", fr: "Migrer l'agent vers Amazon Bedrock AgentCore Runtime, afin que l'environnement d'exécution collecte sa télémétrie sans aucune instrumentation." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AgentCore Observability requires a one-time setup that turns on CloudWatch Transaction Search before metrics, spans, and traces can be viewed. For an agent hosted outside AgentCore Runtime, AWS then adds the ADOT SDK to the code and configures OpenTelemetry environment variables, such as the OTLP exporters and the agent's log group, so that the telemetry reaches CloudWatch."
    fr: "AgentCore Observability exige une configuration unique qui active CloudWatch Transaction Search avant de pouvoir consulter métriques, spans et traces. Pour un agent hébergé hors d'AgentCore Runtime, AWS ajoute ensuite le SDK ADOT au code et configure les variables d'environnement OpenTelemetry, comme les exportateurs OTLP et le groupe de journaux de l'agent, pour que la télémétrie atteigne CloudWatch."
  options:
    b: { en: "The X-Ray SDK and daemon are in maintenance mode, and AgentCore Observability relies on OpenTelemetry instrumentation through ADOT.", fr: "Le SDK et le démon X-Ray sont en mode maintenance, et AgentCore Observability repose sur une instrumentation OpenTelemetry via ADOT." }
    c: { en: "Invocation logging records model prompts and responses, not the sessions, step traces, and agent metrics that AgentCore Observability shows.", fr: "La journalisation des appels enregistre les invites et réponses du modèle, pas les sessions, les traces d'étapes et les métriques d'agent qu'affiche AgentCore Observability." }
    e: { en: "The company keeps Amazon EKS as its hosting choice, and agents in AgentCore Runtime still need the ADOT instrumentation in their code.", fr: "L'entreprise conserve Amazon EKS comme hébergement, et les agents dans AgentCore Runtime ont quand même besoin de l'instrumentation ADOT dans leur code." }
references:
  - title: Add observability to your Amazon Bedrock AgentCore resources
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability-configure.html
  - title: Observability, audit logging, and tracing for your agents
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/observability.html
