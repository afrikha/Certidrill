id: sapc03-5b-eval-human-brand-voice
objective: "5.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's marketing division wants to choose between two foundation models in Amazon Bedrock to draft product descriptions for its online catalog. The descriptions must match the company's brand voice, which is defined in an internal style guide that changes every season. The division's policy states that only the company's own brand editors can judge whether a text matches the brand voice. Twelve brand editors are available for one week to rate the outputs of both models on 200 sample prompts. The division wants a managed workflow that collects the ratings and produces a comparison report.

    Which solution will meet these requirements?
  fr: |
    La division marketing d'AnyCompany veut choisir entre deux modèles de fondation dans Amazon Bedrock pour rédiger les descriptions de produits de son catalogue en ligne. Les descriptions doivent respecter le ton de la marque, défini dans un guide de style interne qui change à chaque saison. La politique de la division indique que seuls les rédacteurs de marque de l'entreprise peuvent juger si un texte respecte le ton de la marque. Douze rédacteurs de marque sont disponibles pendant une semaine pour noter les sorties des deux modèles sur 200 invites d'exemple. La division veut un flux de travail géré qui collecte les notes et produit un rapport de comparaison.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Bedrock human-based model evaluation job that compares the two models, with a work team of the twelve brand editors and custom metrics for the brand voice.", fr: "Créer une tâche d'évaluation de modèles Amazon Bedrock basée sur des humains qui compare les deux modèles, avec une équipe de travail composée des douze rédacteurs et des métriques personnalisées pour le ton de la marque." } }
    - { id: b, text: { en: "Create an Amazon Bedrock programmatic evaluation job for each model with the general text generation task type, and compare the accuracy and toxicity scores in the two reports.", fr: "Créer une tâche d'évaluation programmatique Amazon Bedrock pour chaque modèle avec le type de tâche génération de texte générale, et comparer les scores d'exactitude et de toxicité des deux rapports." } }
    - { id: c, text: { en: "Create an Amazon Bedrock judge-based evaluation job for each model with the built-in professional style and tone metric, and share the two reports with the brand editors.", fr: "Créer une tâche d'évaluation Amazon Bedrock avec modèle juge pour chaque modèle avec la métrique intégrée de style et de ton professionnels, et partager les deux rapports avec les rédacteurs de marque." } }
    - { id: d, text: { en: "Create an Amazon Bedrock AgentCore online evaluation for each model with the built-in helpfulness evaluator, and send the scores to an Amazon CloudWatch dashboard.", fr: "Créer une évaluation en ligne Amazon Bedrock AgentCore pour chaque modèle avec l'évaluateur intégré d'utilité, et envoyer les scores vers un tableau de bord Amazon CloudWatch." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Human-based model evaluation jobs bring the judgment of your own employees or subject matter experts, managed as a work team, into the evaluation, and they can compare the responses of up to two models. Custom metrics let the editors rate the brand voice, which no automatic metric can capture according to the division's policy."
    fr: "Les tâches d'évaluation de modèles basées sur des humains intègrent le jugement de vos propres employés ou experts, gérés comme une équipe de travail, et peuvent comparer les réponses de deux modèles au plus. Des métriques personnalisées permettent aux rédacteurs de noter le ton de la marque, qu'aucune métrique automatique ne peut juger selon la politique de la division."
  options:
    b: { en: "Accuracy and toxicity are computed against built-in or reference data; they cannot tell whether a text follows the company's brand voice, and the policy reserves that judgment to the editors.", fr: "L'exactitude et la toxicité sont calculées à partir de données intégrées ou de référence ; elles ne peuvent pas dire si un texte respecte le ton de la marque, et la politique réserve ce jugement aux rédacteurs." }
    c: { en: "A judge model, not the brand editors, would score the style, which breaks the division's policy; sharing the reports afterward does not change who judged.", fr: "Un modèle juge, et non les rédacteurs, noterait le style, ce qui enfreint la politique de la division ; partager les rapports ensuite ne change pas qui a jugé." }
    d: { en: "AgentCore online evaluations score live sessions of deployed agents, not a comparison of two candidate models, and the scores still come from an evaluator model.", fr: "Les évaluations en ligne AgentCore notent les sessions réelles d'agents déployés, pas la comparaison de deux modèles candidats, et les scores proviennent toujours d'un modèle évaluateur." }
references:
  - title: Creating your first model evaluation that uses human workers
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-type-human.html
  - title: Evaluate the performance of Amazon Bedrock resources
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation.html
