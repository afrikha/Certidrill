id: sapc03-5c-runbook-executescript
objective: "5.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company's security team needs a remediation runbook for Amazon EBS snapshots that were shared with accounts outside the organization. For each snapshot, the remediation must read its create-volume permissions, compare the account IDs with an allow list stored in Parameter Store, remove only the unapproved accounts, and return the list of removed accounts in the execution output. The logic needs loops and conditions that the built-in API actions can't express, and each run finishes in less than a minute. The team wants to run the remediation from AWS Config and Systems Manager without deploying or managing any separate compute resource.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'une entreprise de médias a besoin d'un runbook de correction pour les instantanés Amazon EBS partagés avec des comptes extérieurs à l'organisation. Pour chaque instantané, la correction doit lire ses autorisations de création de volume, comparer les ID de comptes à une liste d'autorisation stockée dans Parameter Store, retirer uniquement les comptes non approuvés et renvoyer la liste des comptes retirés dans la sortie de l'exécution. La logique nécessite des boucles et des conditions que les actions d'API intégrées ne peuvent pas exprimer, et chaque exécution se termine en moins d'une minute. L'équipe veut exécuter la correction depuis AWS Config et Systems Manager sans déployer ni gérer de ressource de calcul distincte.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an AWS Lambda function with the logic, and a runbook with an aws:invokeLambdaFunction step that calls it.
        fr: |-
          Créer une fonction AWS Lambda contenant la logique, et un runbook avec une étape aws:invokeLambdaFunction qui l'appelle.
    - id: b
      text:
        en: |-
          Create a runbook with an aws:runCommand step that runs a shell script with the AWS CLI on a dedicated management instance.
        fr: |-
          Créer un runbook avec une étape aws:runCommand qui exécute un script shell avec l'AWS CLI sur une instance de gestion dédiée.
    - id: c
      text:
        en: |-
          Create a runbook with an aws:executeScript step that runs the logic in Python with the runbook's assume role, and returns the removed accounts as an output.
        fr: |-
          Créer un runbook avec une étape aws:executeScript qui exécute la logique en Python avec le rôle assumé du runbook, et renvoie les comptes retirés en sortie.
    - id: d
      text:
        en: |-
          Create an AWS Step Functions workflow that implements the logic with Map and Choice states, and start it from an EventBridge rule on Config compliance changes.
        fr: |-
          Créer un flux de travail AWS Step Functions qui met en œuvre la logique avec des états Map et Choice, et le démarrer depuis une règle EventBridge sur les changements de conformité Config.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The aws:executeScript action runs a Python or PowerShell script inside the Automation execution, with the runbook's assume role for AWS API calls, up to 10 minutes per step, and returns outputs to later steps or the execution result. The runbook stays a single Systems Manager document that Config remediation can call, with no separate function or instance to manage.
    fr: |-
      L'action aws:executeScript exécute un script Python ou PowerShell au sein de l'exécution Automation, avec le rôle assumé du runbook pour les appels d'API AWS, jusqu'à 10 minutes par étape, et renvoie des sorties aux étapes suivantes ou au résultat de l'exécution. Le runbook reste un seul document Systems Manager que la correction Config peut appeler, sans fonction ni instance distincte à gérer.
  options:
    a:
      en: |-
        A Lambda function is a separate compute resource to deploy, secure, and maintain alongside the runbook.
      fr: |-
        Une fonction Lambda est une ressource de calcul distincte à déployer, sécuriser et maintenir en plus du runbook.
    b:
      en: |-
        A dedicated management instance is a separate compute resource to patch and keep running.
      fr: |-
        Une instance de gestion dédiée est une ressource de calcul distincte à corriger et à maintenir en fonctionnement.
    d:
      en: |-
        A Step Functions workflow is a separate resource outside Systems Manager, and Config remediation runs Systems Manager documents, not state machines.
      fr: |-
        Un flux de travail Step Functions est une ressource distincte hors de Systems Manager, et la correction Config exécute des documents Systems Manager, pas des machines d'état.
references:
  - title: "aws:executeScript – Run a script - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/automation-action-executeScript.html
