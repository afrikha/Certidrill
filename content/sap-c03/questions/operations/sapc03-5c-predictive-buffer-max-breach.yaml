id: sapc03-5c-predictive-buffer-max-breach
objective: "5.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A food delivery company runs its order API on Amazon EC2 instances in an Auto Scaling group with a maximum capacity of 60, a target tracking policy, and a predictive scaling policy in forecast and scale mode. Load follows a strong daily pattern with a sharp rise at 11:00, the pattern shifts gradually with promotions, and instances need about 12 minutes before they can serve traffic. Two problems remain: forecast capacity is launched at the start of each hour, so instances for the 11:00 rise are still booting when the rise begins, and on Friday the forecast exceeds 60 instances but the group stops at its maximum. The company wants instances to be in service before each forecast hour and wants the group to exceed its maximum when the forecast requires it, without manual changes each week.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de livraison de repas exploite son API de commandes sur des instances Amazon EC2 dans un groupe Auto Scaling d'une capacité maximale de 60, avec une politique de suivi de cible et une politique de mise à l'échelle prédictive en mode prévision et mise à l'échelle. La charge suit un fort profil quotidien avec une hausse brutale à 11:00, le profil évolue progressivement avec les promotions, et les instances ont besoin d'environ 12 minutes avant de pouvoir servir du trafic. Deux problèmes subsistent : la capacité prévue est lancée au début de chaque heure, si bien que les instances destinées à la hausse de 11:00 démarrent encore quand la hausse commence, et le vendredi la prévision dépasse 60 instances mais le groupe s'arrête à son maximum. L'entreprise veut que les instances soient en service avant chaque heure prévue et que le groupe dépasse son maximum quand la prévision l'exige, sans modification manuelle chaque semaine.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create scheduled actions that raise the minimum capacity to the expected Friday level at 10:45 every day and set the maximum capacity to 80 on Fridays.
        fr: |-
          Créer des actions planifiées qui relèvent la capacité minimale au niveau attendu du vendredi à 10:45 chaque jour et fixent la capacité maximale à 80 le vendredi.
    - id: b
      text:
        en: |-
          Set SchedulingBufferTime to 900 seconds in the predictive scaling policy, and set MaxCapacityBreachBehavior to IncreaseMaxCapacity with a MaxCapacityBuffer.
        fr: |-
          Définir SchedulingBufferTime sur 900 secondes dans la politique de mise à l'échelle prédictive, et définir MaxCapacityBreachBehavior sur IncreaseMaxCapacity avec un MaxCapacityBuffer.
    - id: c
      text:
        en: |-
          Add a warm pool of stopped instances to the group, and raise the target value of the target tracking policy so that it scales out earlier.
        fr: |-
          Ajouter au groupe un warm pool d'instances arrêtées, et relever la valeur cible de la politique de suivi de cible pour qu'elle monte en charge plus tôt.
    - id: d
      text:
        en: |-
          Set the default instance warmup to 720 seconds, and raise the group's maximum capacity to 120 so that the forecast is never capped.
        fr: |-
          Définir le préchauffage d'instance par défaut sur 720 secondes, et relever la capacité maximale du groupe à 120 afin que la prévision ne soit jamais plafonnée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      SchedulingBufferTime launches forecast capacity that many seconds before each forecast hour, so with 900 seconds the 12-minute boot completes before 11:00. MaxCapacityBreachBehavior set to IncreaseMaxCapacity lets predictive scaling raise the maximum when the forecast reaches or exceeds it, within the buffer, and both follow the forecast as the pattern shifts.
    fr: |-
      SchedulingBufferTime lance la capacité prévue ce nombre de secondes avant chaque heure prévue : avec 900 secondes, le démarrage de 12 minutes se termine avant 11:00. MaxCapacityBreachBehavior défini sur IncreaseMaxCapacity permet à la mise à l'échelle prédictive de relever le maximum quand la prévision l'atteint ou le dépasse, dans la limite du tampon, et les deux suivent la prévision quand le profil évolue.
  options:
    a:
      en: |-
        Fixed schedules don't follow the shifting pattern, so they need regular manual updates, and they keep the Friday level every day.
      fr: |-
        Des planifications fixes ne suivent pas le profil qui évolue : elles exigent des mises à jour manuelles régulières, et elles maintiennent le niveau du vendredi tous les jours.
    c:
      en: |-
        A warm pool shortens launches but doesn't remove the cap at 60, and raising the target value makes target tracking scale out later, not earlier.
      fr: |-
        Un warm pool raccourcit les lancements mais ne supprime pas le plafond de 60, et relever la valeur cible fait monter en charge le suivi de cible plus tard, pas plus tôt.
    d:
      en: |-
        Default instance warmup only delays when new instances contribute metrics; predictive scaling has no default warmup, so launches still start at the top of the hour.
      fr: |-
        Le préchauffage d'instance par défaut retarde seulement le moment où les nouvelles instances contribuent aux métriques ; la mise à l'échelle prédictive n'a pas de préchauffage par défaut, si bien que les lancements commencent toujours au début de l'heure.
references:
  - title: "How predictive scaling works - Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/predictive-scaling-policy-overview.html
