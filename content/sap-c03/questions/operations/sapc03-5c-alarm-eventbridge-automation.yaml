id: sapc03-5c-alarm-eventbridge-automation
objective: "5.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a fleet of Amazon EC2 instances for its warehouse API behind an Application Load Balancer in a production account. When a CloudWatch alarm on high memory usage of an instance enters the ALARM state, an on-call engineer currently runs a documented procedure: collect diagnostic logs to Amazon S3, restart the application service, and confirm that the target is healthy. The procedure already exists as a custom AWS Systems Manager Automation runbook that takes the instance ID as a parameter. The company wants the runbook to start automatically for the affected instance whenever such an alarm enters the ALARM state. The company wants the fewest components and no custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exploite une flotte d'instances Amazon EC2 pour son API d'entrepôt derrière un Application Load Balancer dans un compte de production. Quand une alarme CloudWatch sur une forte utilisation de la mémoire d'une instance passe à l'état ALARM, un ingénieur d'astreinte exécute aujourd'hui une procédure documentée : collecter les journaux de diagnostic dans Amazon S3, redémarrer le service applicatif et vérifier que la cible est saine. La procédure existe déjà sous forme de runbook personnalisé AWS Systems Manager Automation qui prend l'ID d'instance en paramètre. L'entreprise veut que le runbook démarre automatiquement pour l'instance concernée chaque fois qu'une telle alarme passe à l'état ALARM. L'entreprise veut le moins de composants possible et aucun code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EventBridge rule for the ALARM state changes of these alarms that targets the Automation runbook, with an input transformer that passes the instance ID.
        fr: |-
          Créer une règle EventBridge pour les passages à l'état ALARM de ces alarmes qui cible le runbook Automation, avec un transformateur d'entrée qui transmet l'ID d'instance.
    - id: b
      text:
        en: |-
          Add an Amazon SNS topic as the alarm action, and subscribe an AWS Lambda function that parses the notification and calls StartAutomationExecution with the instance ID.
        fr: |-
          Ajouter une rubrique Amazon SNS comme action de l'alarme, et y abonner une fonction AWS Lambda qui analyse la notification et appelle StartAutomationExecution avec l'ID d'instance.
    - id: c
      text:
        en: |-
          Add the EC2 reboot action to each alarm so that the affected instance restarts automatically whenever its memory usage is high.
        fr: |-
          Ajouter l'action de redémarrage EC2 à chaque alarme afin que l'instance concernée redémarre automatiquement dès que son utilisation de la mémoire est élevée.
    - id: d
      text:
        en: |-
          Create a Systems Manager State Manager association that runs the Automation runbook on every instance of the fleet every 5 minutes.
        fr: |-
          Créer une association Systems Manager State Manager qui exécute le runbook Automation sur chaque instance de la flotte toutes les 5 minutes.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Every alarm state change is published to EventBridge, and Systems Manager Automation is a supported EventBridge target. An input transformer maps the instance ID from the alarm's dimensions to the runbook parameter, so the runbook starts for the right instance with no code and no extra service.
    fr: |-
      Chaque changement d'état d'alarme est publié dans EventBridge, et Systems Manager Automation est une cible EventBridge prise en charge. Un transformateur d'entrée mappe l'ID d'instance des dimensions de l'alarme vers le paramètre du runbook : le runbook démarre pour la bonne instance sans code ni service supplémentaire.
  options:
    b:
      en: |-
        The Lambda function is custom code and an extra component compared with a direct EventBridge target.
      fr: |-
        La fonction Lambda est du code personnalisé et un composant supplémentaire par rapport à une cible EventBridge directe.
    c:
      en: |-
        A reboot skips the log collection and health confirmation of the documented procedure, and it restarts the whole instance instead of the application service.
      fr: |-
        Un redémarrage saute la collecte des journaux et la vérification de l'état de la procédure documentée, et il redémarre toute l'instance au lieu du service applicatif.
    d:
      en: |-
        A schedule runs the remediation on every instance whether or not it is in trouble, and the response isn't tied to the alarm.
      fr: |-
        Une planification exécute la correction sur chaque instance, en difficulté ou non, et la réponse n'est pas liée à l'alarme.
references:
  - title: "Event bus targets in Amazon EventBridge"
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html
