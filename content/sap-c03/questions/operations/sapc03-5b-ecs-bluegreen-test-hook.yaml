id: sapc03-5b-ecs-bluegreen-test-hook
objective: "5.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is moving an Amazon ECS service on AWS Fargate from rolling updates to blue/green deployments behind an Application Load Balancer, and it does not want to add AWS CodeDeploy to its toolchain. Before any production traffic reaches a new revision, an automated test suite must send requests that carry a test header to the new tasks, and a failed test must roll the deployment back. After production traffic moves, the previous revision must keep running for 20 minutes so that the company can roll back instantly. A CloudWatch alarm on 5xx errors must also trigger an automatic rollback.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    AnyCompany fait passer un service Amazon ECS sur AWS Fargate des mises à jour propagées aux déploiements bleu/vert derrière un Application Load Balancer, et ne veut pas ajouter AWS CodeDeploy à sa chaîne d'outils. Avant que le moindre trafic de production n'atteigne une nouvelle révision, une suite de tests automatisée doit envoyer aux nouvelles tâches des requêtes portant un en-tête de test, et un test en échec doit restaurer le déploiement. Après le déplacement du trafic de production, la révision précédente doit continuer de s'exécuter pendant 20 minutes pour que l'entreprise puisse revenir en arrière instantanément. Une alarme CloudWatch sur les erreurs 5xx doit aussi déclencher une restauration automatique.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on the deployment circuit breaker with rollback and a minimum healthy percent of 100%, so that the new tasks run beside the old tasks until they are healthy.", fr: "Activer le disjoncteur de déploiement avec restauration et un pourcentage minimal d'intégrité de 100 %, afin que les nouvelles tâches s'exécutent à côté des anciennes jusqu'à ce qu'elles soient saines." } }
    - { id: b, text: { en: "Configure the service with the ECS deployment controller and the blue/green strategy, two target groups with production and test listener rules, a 20-minute bake time, and the 5xx alarm.", fr: "Configurer le service avec le contrôleur de déploiement ECS et la stratégie bleu/vert, deux groupes cibles avec des règles d'écouteur de production et de test, une durée d'observation de 20 minutes et l'alarme 5xx." } }
    - { id: c, text: { en: "Add an AppSpec file with a BeforeAllowTraffic hook that runs the test suite against the replacement task set before the production listener is rerouted.", fr: "Ajouter un fichier AppSpec avec un hook BeforeAllowTraffic qui exécute la suite de tests sur l'ensemble de tâches de remplacement avant le réacheminement de l'écouteur de production." } }
    - { id: d, text: { en: "Register a Lambda lifecycle hook at the BAKE_TIME stage that runs the test suite and returns a failure status to roll the deployment back when a test fails.", fr: "Enregistrer un hook de cycle de vie Lambda à l'étape BAKE_TIME qui exécute la suite de tests et renvoie un statut d'échec pour restaurer le déploiement quand un test échoue." } }
    - { id: e, text: { en: "Register a Lambda lifecycle hook at the POST_TEST_TRAFFIC_SHIFT stage that runs the test suite through the test listener rule and returns a failure status when a test fails.", fr: "Enregistrer un hook de cycle de vie Lambda à l'étape POST_TEST_TRAFFIC_SHIFT qui exécute la suite de tests via la règle d'écouteur de test et renvoie un statut d'échec quand un test échoue." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Built-in ECS blue/green deployments use the ECS deployment controller; listener rules route test traffic, such as requests with a test header, to the green revision while production stays on blue, and the bake time keeps blue running after the production shift for instant rollback, with CloudWatch alarms that trigger rollback. A Lambda hook at POST_TEST_TRAFFIC_SHIFT runs after test traffic reaches green and before production traffic shifts, so a failing test stops the deployment in time."
    fr: "Les déploiements bleu/vert intégrés d'ECS utilisent le contrôleur de déploiement ECS ; des règles d'écouteur envoient le trafic de test, par exemple les requêtes avec un en-tête de test, vers la révision verte pendant que la production reste sur la bleue, et la durée d'observation (bake time) maintient la révision bleue après la bascule de production pour une restauration instantanée, avec des alarmes CloudWatch qui déclenchent la restauration. Un hook Lambda à l'étape POST_TEST_TRAFFIC_SHIFT s'exécute après l'arrivée du trafic de test sur la révision verte et avant le déplacement du trafic de production : un test en échec arrête le déploiement à temps."
  options:
    a: { en: "The circuit breaker belongs to rolling updates; it neither sends test traffic before production traffic nor keeps the previous revision for 20 minutes.", fr: "Le disjoncteur relève des mises à jour propagées ; il n'envoie pas de trafic de test avant le trafic de production et ne conserve pas la révision précédente pendant 20 minutes." }
    c: { en: "AppSpec files and BeforeAllowTraffic hooks are CodeDeploy features, which the company does not want to add.", fr: "Les fichiers AppSpec et les hooks BeforeAllowTraffic sont des fonctionnalités CodeDeploy, que l'entreprise ne veut pas ajouter." }
    d: { en: "BAKE_TIME comes after the production traffic shift and does not support lifecycle hooks, so the tests would run too late.", fr: "BAKE_TIME intervient après le déplacement du trafic de production et ne prend pas en charge les hooks de cycle de vie : les tests s'exécuteraient trop tard." }
references:
  - title: Amazon ECS blue/green service deployments workflow
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/blue-green-deployment-how-it-works.html
  - title: Amazon ECS blue/green deployments
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-type-blue-green.html
