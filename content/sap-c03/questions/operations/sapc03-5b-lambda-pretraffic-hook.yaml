id: sapc03-5b-lambda-pretraffic-hook
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company deploys its order-routing AWS Lambda functions with AWS SAM gradual deployments that use AWS CodeDeploy and the Canary10Percent5Minutes configuration. During a recent release, the new version failed for every request because of a missing environment variable. For 5 minutes, 10% of production orders failed before the CloudWatch alarm rolled the deployment back. The company wants to run integration tests against the exact new function version in the production account before that version receives any production traffic. If the tests fail, the deployment must stop and roll back without affecting any order.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique déploie ses fonctions AWS Lambda de routage des commandes avec les déploiements progressifs d'AWS SAM, qui utilisent AWS CodeDeploy et la configuration Canary10Percent5Minutes. Lors d'une version récente, la nouvelle version a échoué pour chaque requête à cause d'une variable d'environnement manquante. Pendant 5 minutes, 10 % des commandes de production ont échoué avant que l'alarme CloudWatch ne restaure le déploiement. L'entreprise veut exécuter des tests d'intégration sur la nouvelle version exacte de la fonction, dans le compte de production, avant que cette version ne reçoive le moindre trafic de production. Si les tests échouent, le déploiement doit s'arrêter et être restauré sans affecter aucune commande.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a PreTraffic hook function to the deployment preference that invokes the new version with test events and reports success or failure to CodeDeploy.", fr: "Ajouter à la préférence de déploiement une fonction de hook PreTraffic qui appelle la nouvelle version avec des événements de test et signale la réussite ou l'échec à CodeDeploy." } }
    - { id: b, text: { en: "Add a PostTraffic hook function to the deployment preference that invokes the new version with test events and reports success or failure to CodeDeploy.", fr: "Ajouter à la préférence de déploiement une fonction de hook PostTraffic qui appelle la nouvelle version avec des événements de test et signale la réussite ou l'échec à CodeDeploy." } }
    - { id: c, text: { en: "Add a CloudWatch Synthetics canary that calls the production API every minute, and add its SuccessPercent alarm to the Alarms list of the deployment preference.", fr: "Ajouter un canary CloudWatch Synthetics qui appelle l'API de production chaque minute, et ajouter son alarme SuccessPercent à la liste Alarms de la préférence de déploiement." } }
    - { id: d, text: { en: "Add an AWS CodeBuild test action before the deploy stage that invokes the $LATEST version of the function in the production account with test events.", fr: "Ajouter avant l'étape de déploiement une action de test AWS CodeBuild qui appelle la version $LATEST de la fonction dans le compte de production avec des événements de test." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CodeDeploy invokes the pre-traffic hook function before traffic shifting starts, and the hook must call back to CodeDeploy with success or failure. The hook can invoke the newly published version directly, so a missing environment variable is caught in production before any order reaches that version, and a failure aborts and rolls back the deployment."
    fr: "CodeDeploy appelle la fonction de hook pré-trafic avant le début du déplacement du trafic, et le hook doit signaler à CodeDeploy la réussite ou l'échec. Le hook peut appeler directement la version nouvellement publiée : une variable d'environnement manquante est détectée en production avant qu'aucune commande n'atteigne cette version, et un échec interrompt et restaure le déploiement."
  options:
    b: { en: "The post-traffic hook runs after traffic shifting completes, so production orders have already reached the faulty version.", fr: "Le hook post-trafic s'exécute une fois le déplacement du trafic terminé : des commandes de production ont déjà atteint la version défectueuse." }
    c: { en: "The canary tests through the production path, so its alarm fires only after the new version already receives real traffic, which is the situation the company wants to avoid.", fr: "Le canary teste via le chemin de production : son alarme ne se déclenche qu'après que la nouvelle version reçoit déjà du trafic réel, ce que l'entreprise veut éviter." }
    d: { en: "Before the deploy stage, $LATEST in the production account still contains the old code and configuration, so the test does not exercise the version that will be deployed.", fr: "Avant l'étape de déploiement, $LATEST dans le compte de production contient encore l'ancien code et l'ancienne configuration : le test n'exerce pas la version qui sera déployée." }
references:
  - title: Deploying serverless applications gradually with AWS SAM
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
