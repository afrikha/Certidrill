id: sapc03-5a-eks-admission-verify
objective: "5.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon EKS clusters in three production accounts. Its pipelines sign all release images with AWS Signer through Amazon ECR managed signing. The security team requires that the clusters refuse to start any pod whose image isn't signed with the company's signing profile, including pods that engineers create manually with kubectl and images pulled from public registries. The verification must happen in each cluster at admission time, not only in the pipeline. The team accepts running open-source components in the clusters.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite des clusters Amazon EKS dans trois comptes de production. Ses pipelines signent toutes les images de publication avec AWS Signer au moyen de la signature gérée d'Amazon ECR. L'équipe de sécurité exige que les clusters refusent de démarrer tout pod dont l'image n'est pas signée avec le profil de signature de l'entreprise, y compris les pods que les ingénieurs créent manuellement avec kubectl et les images tirées de registres publics. La vérification doit avoir lieu dans chaque cluster au moment de l'admission, et pas seulement dans le pipeline. L'équipe accepte d'exécuter des composants open source dans les clusters.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add to every ECR repository a repository policy that denies ecr:BatchGetImage for images that don't have a valid signature from the company's signing profile, and route public images through an ECR pull through cache.
        fr: |-
          Ajouter à chaque référentiel ECR une politique de référentiel qui refuse ecr:BatchGetImage pour les images qui n'ont pas de signature valide du profil de signature de l'entreprise, et faire passer les images publiques par un cache d'extraction ECR (pull through cache).
    - id: b
      text:
        en: |-
          Turn on Amazon ECR enhanced scanning with Amazon Inspector so that unsigned images are reported as critical findings and blocked when the clusters pull them.
        fr: |-
          Activer l'analyse améliorée d'Amazon ECR avec Amazon Inspector pour que les images non signées soient signalées comme résultats critiques et bloquées lorsque les clusters les tirent.
    - id: c
      text:
        en: |-
          Install an admission controller in each cluster, such as Kyverno or Gatekeeper with Ratify, with the AWS Signer plugin and a Notation trust policy that trusts only the company's signing profile.
        fr: |-
          Installer dans chaque cluster un contrôleur d'admission, comme Kyverno ou Gatekeeper avec Ratify, avec le plugin AWS Signer et une politique d'approbation Notation qui n'approuve que le profil de signature de l'entreprise.
    - id: d
      text:
        en: |-
          Create a code signing configuration in Enforce mode that allows the company's signing profile, and associate it with the managed node groups of each cluster.
        fr: |-
          Créer une configuration de signature de code en mode Enforce qui autorise le profil de signature de l'entreprise, et l'associer aux groupes de nœuds gérés de chaque cluster.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Kubernetes admission controllers validate each pod before it is admitted, whatever created it. Gatekeeper with Ratify, or Kyverno, configured with the AWS Signer plugin, verifies the image signatures against a Notation trust store and trust policy, so a pod with an unsigned image, or an image signed by another identity, is rejected in the cluster.
    fr: |-
      Les contrôleurs d'admission Kubernetes valident chaque pod avant son admission, quel que soit son créateur. Gatekeeper avec Ratify, ou Kyverno, configuré avec le plugin AWS Signer, vérifie les signatures des images par rapport à un magasin d'approbation et à une politique d'approbation Notation : un pod dont l'image n'est pas signée, ou est signée par une autre identité, est rejeté dans le cluster.
  options:
    a:
      en: |-
        ECR repository policies have no condition based on image signatures, so routing public images through a pull through cache doesn't help either.
      fr: |-
        Les politiques de référentiel ECR n'ont aucune condition fondée sur les signatures d'images : faire passer les images publiques par un cache d'extraction n'y change rien.
    b:
      en: |-
        Enhanced scanning reports software vulnerabilities; it doesn't check signatures and doesn't block pulls or pods.
      fr: |-
        L'analyse améliorée signale des vulnérabilités logicielles ; elle ne vérifie pas les signatures et ne bloque ni les tirages ni les pods.
    d:
      en: |-
        Code signing configurations apply only to Lambda functions deployed as .zip archives; they can't be associated with EKS node groups.
      fr: |-
        Les configurations de signature de code ne s'appliquent qu'aux fonctions Lambda déployées sous forme d'archives .zip ; elles ne peuvent pas être associées à des groupes de nœuds EKS.
references:
  - title: Validate container image signatures during deployment - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/image-verification.html
