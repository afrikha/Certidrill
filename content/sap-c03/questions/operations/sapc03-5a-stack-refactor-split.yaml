id: sapc03-5a-stack-refactor-split
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company manages each application with one AWS CloudFormation stack. The largest stack has grown to 420 resources: an Amazon DynamoDB table and Amazon S3 buckets that hold years of production data, plus AWS Lambda functions, Amazon SNS topics, and IAM roles. Updates take a long time, and a small change to a function can be blocked by a failed change to the data layer. The architects want to split the stack into a data stack and a compute stack that are owned by different teams. The table and the buckets must keep their data and physical names, and no resource can be deleted and recreated during the split. The stack has no stack policy, and all the resource types involved support moving between stacks. The team wants the fewest manual steps.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias gère chaque application avec une pile AWS CloudFormation. La plus grande pile compte désormais 420 ressources : une table Amazon DynamoDB et des compartiments Amazon S3 qui contiennent des années de données de production, ainsi que des fonctions AWS Lambda, des rubriques Amazon SNS et des rôles IAM. Les mises à jour sont longues, et une petite modification d'une fonction peut être bloquée par l'échec d'une modification de la couche de données. Les architectes veulent scinder la pile en une pile de données et une pile de calcul, détenues par des équipes différentes. La table et les compartiments doivent conserver leurs données et leurs noms physiques, et aucune ressource ne peut être supprimée puis recréée pendant la scission. La pile n'a pas de politique de pile, et tous les types de ressources concernés peuvent être déplacés entre piles. L'équipe veut le moins d'étapes manuelles possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Write the two target templates, run create-stack-refactor with both stack definitions and stack creation enabled, review the MOVE actions with list-stack-refactor-actions, and then execute the refactor.
        fr: |-
          Écrire les deux modèles cibles, exécuter create-stack-refactor avec les deux définitions de piles et la création de pile activée, vérifier les actions MOVE avec list-stack-refactor-actions, puis exécuter la refactorisation.
    - id: b
      text:
        en: |-
          Set DeletionPolicy to Retain on the data resources, remove them from the template and update the stack, write the data template, and then import the retained resources into a new stack with an IMPORT change set.
        fr: |-
          Définir DeletionPolicy à Retain sur les ressources de données, les retirer du modèle et mettre à jour la pile, écrire le modèle de données, puis importer les ressources conservées dans une nouvelle pile avec un jeu de modifications IMPORT.
    - id: c
      text:
        en: |-
          Move the data resources into a nested stack by declaring an AWS::CloudFormation::Stack resource in the same template, so that the data layer is updated separately from the functions.
        fr: |-
          Déplacer les ressources de données dans une pile imbriquée en déclarant une ressource AWS::CloudFormation::Stack dans le même modèle, afin que la couche de données soit mise à jour séparément des fonctions.
    - id: d
      text:
        en: |-
          Run the IaC generator on the Region to produce a template for the table and the buckets, create the data stack from that template, and then remove the same resources from the original stack with a stack update.
        fr: |-
          Exécuter le générateur IaC sur la Région pour produire un modèle de la table et des compartiments, créer la pile de données à partir de ce modèle, puis retirer ces mêmes ressources de la pile d'origine par une mise à jour de pile.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Stack refactoring moves resources between stacks (and can create the destination stack and rename logical IDs) while preserving their properties and data; the preview shows each resource as a MOVE action rather than a create or delete. One validated refactor operation replaces the retain, remove, and import sequence. Refactoring can't change resource configurations at the same time, so any property change is done in a separate stack update.
    fr: |-
      La refactorisation de piles déplace des ressources entre piles (et peut créer la pile de destination et renommer des ID logiques) en préservant leurs propriétés et leurs données ; l'aperçu présente chaque ressource comme une action MOVE et non comme une création ou une suppression. Une seule opération de refactorisation validée remplace la séquence conservation, retrait et importation. La refactorisation ne peut pas modifier la configuration des ressources en même temps : toute modification de propriété se fait dans une mise à jour de pile distincte.
  options:
    b:
      en: |-
        Retaining, removing, and importing the resources also avoids recreation, but it takes several stack operations and leaves the data resources unmanaged between the update and the import, which is more manual work than one refactor.
      fr: |-
        Conserver, retirer puis importer les ressources évite aussi la recréation, mais demande plusieurs opérations de pile et laisse les ressources de données non gérées entre la mise à jour et l'importation : c'est plus de travail manuel qu'une seule refactorisation.
    c:
      en: |-
        Moving a resource from the parent template into a new nested stack is seen as a deletion from one stack and a creation in another, so the table and buckets would be recreated.
      fr: |-
        Déplacer une ressource du modèle parent vers une nouvelle pile imbriquée est vu comme une suppression dans une pile et une création dans une autre : la table et les compartiments seraient recréés.
    d:
      en: |-
        The IaC generator only works with resources that CloudFormation doesn't manage; and removing the resources from the original stack without a Retain policy would delete them.
      fr: |-
        Le générateur IaC ne traite que des ressources que CloudFormation ne gère pas ; et retirer les ressources de la pile d'origine sans politique Retain les supprimerait.
references:
  - title: Stack refactoring - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stack-refactoring.html
