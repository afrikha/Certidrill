id: sapc03-5a-userdata-secret-boot
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company launches Amazon EC2 instances from an AWS CloudFormation template. At boot, a script in UserData must configure a monitoring agent with a license key that is stored in AWS Secrets Manager. A developer put a secretsmanager dynamic reference in the UserData script, but the agent received the literal reference string instead of the key. The license key must not be visible in the instance user data, in the template, or in the stack. The instances run in private subnets that have an interface VPC endpoint for Secrets Manager.

    Which solution will meet these requirements?
  fr: |
    Une entreprise lance des instances Amazon EC2 à partir d'un modèle AWS CloudFormation. Au démarrage, un script UserData doit configurer un agent de surveillance avec une clé de licence stockée dans AWS Secrets Manager. Un développeur a placé une référence dynamique secretsmanager dans le script UserData, mais l'agent a reçu la chaîne littérale de la référence au lieu de la clé. La clé de licence ne doit être visible ni dans les données utilisateur de l'instance, ni dans le modèle, ni dans la pile. Les instances s'exécutent dans des sous-réseaux privés qui disposent d'un point de terminaison de VPC d'interface pour Secrets Manager.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Move the dynamic reference into AWS::CloudFormation::Init metadata, and run cfn-init from UserData so that it writes the resolved key into the agent's configuration file.
        fr: |-
          Déplacer la référence dynamique dans les métadonnées AWS::CloudFormation::Init, et exécuter cfn-init depuis UserData pour qu'il écrive la clé résolue dans le fichier de configuration de l'agent.
    - id: b
      text:
        en: |-
          Pass the key to the template as a NoEcho parameter, and insert it into the UserData script with Fn::Sub so that CloudFormation masks the value in the stack.
        fr: |-
          Transmettre la clé au modèle sous forme de paramètre NoEcho, et l'insérer dans le script UserData avec Fn::Sub pour que CloudFormation masque la valeur dans la pile.
    - id: c
      text:
        en: |-
          Attach an instance profile whose role allows secretsmanager:GetSecretValue on the secret, and have the UserData script retrieve the key at boot with the AWS CLI through the VPC endpoint.
        fr: |-
          Attacher un profil d'instance dont le rôle autorise secretsmanager:GetSecretValue sur le secret, et faire récupérer la clé au démarrage par le script UserData avec l'AWS CLI, via le point de terminaison de VPC.
    - id: d
      text:
        en: |-
          Store the key in a Parameter Store SecureString parameter, and use an ssm-secure dynamic reference in UserData so that CloudFormation decrypts it when the instance launches and passes it to the agent.
        fr: |-
          Stocker la clé dans un paramètre SecureString de Parameter Store, et utiliser une référence dynamique ssm-secure dans UserData pour que CloudFormation la déchiffre au lancement de l'instance et la transmette à l'agent.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      CloudFormation doesn't resolve dynamic references in EC2 UserData or in AWS::CloudFormation::Init metadata, which is why the agent got the literal string. The instance should fetch the secret itself at boot with its instance profile role, through the existing VPC endpoint; the template and user data then contain only the secret's name or ARN, never its value.
    fr: |-
      CloudFormation ne résout pas les références dynamiques dans le UserData d'EC2 ni dans les métadonnées AWS::CloudFormation::Init, d'où la chaîne littérale reçue par l'agent. L'instance doit récupérer elle-même le secret au démarrage avec le rôle de son profil d'instance, via le point de terminaison de VPC existant ; le modèle et les données utilisateur ne contiennent alors que le nom ou l'ARN du secret, jamais sa valeur.
  options:
    a:
      en: |-
        Dynamic references aren't supported in AWS::CloudFormation::Init metadata either, so cfn-init would also receive the literal string.
      fr: |-
        Les références dynamiques ne sont pas non plus prises en charge dans les métadonnées AWS::CloudFormation::Init : cfn-init recevrait aussi la chaîne littérale.
    b:
      en: |-
        NoEcho only masks the parameter in CloudFormation output; once substituted, the key is in clear text in the instance user data, which anyone who can describe the instance attribute can read.
      fr: |-
        NoEcho masque seulement le paramètre dans les sorties de CloudFormation ; une fois substituée, la clé figure en clair dans les données utilisateur de l'instance, lisibles par quiconque peut décrire cet attribut de l'instance.
    d:
      en: |-
        ssm-secure references aren't supported in UserData; they work only on a short list of properties such as RDS master passwords.
      fr: |-
        Les références ssm-secure ne sont pas prises en charge dans UserData ; elles ne fonctionnent que sur une courte liste de propriétés, comme les mots de passe principaux RDS.
references:
  - title: Get values stored in other services using dynamic references - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references.html
