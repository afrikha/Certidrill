id: sapc03-5a-lambda-extension-secret
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys AWS Lambda functions with AWS CloudFormation. One function calls a partner API with an API key that the partner changes every few weeks; the security team then updates the key in an AWS Secrets Manager secret. A developer tried to pass the key to an environment variable with an ssm-secure dynamic reference, and the deployment failed. Security requires that the key never appear in the function configuration. The function must use a new key within 5 minutes of an update, without a redeployment. The function runs thousands of times per minute, so the company wants to minimize calls to Secrets Manager and the code to write.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie des fonctions AWS Lambda avec AWS CloudFormation. Une fonction appelle l'API d'un partenaire avec une clé d'API que le partenaire change toutes les quelques semaines ; l'équipe de sécurité met alors à jour la clé dans un secret AWS Secrets Manager. Un développeur a tenté de transmettre la clé à une variable d'environnement avec une référence dynamique ssm-secure, et le déploiement a échoué. La sécurité exige que la clé n'apparaisse jamais dans la configuration de la fonction. La fonction doit utiliser une nouvelle clé dans les 5 minutes qui suivent une mise à jour, sans redéploiement. La fonction s'exécute des milliers de fois par minute : l'entreprise veut donc réduire au minimum les appels à Secrets Manager et le code à écrire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Replace the ssm-secure reference with a secretsmanager dynamic reference in the environment variable, because Secrets Manager references are accepted in every resource property.
        fr: |-
          Remplacer la référence ssm-secure par une référence dynamique secretsmanager dans la variable d'environnement, car les références Secrets Manager sont acceptées dans toutes les propriétés de ressources.
    - id: b
      text:
        en: |-
          Store the key in a Parameter Store SecureString parameter, and pass it to the environment variable through a template parameter of type AWS::SSM::Parameter::Value<String>.
        fr: |-
          Stocker la clé dans un paramètre SecureString de Parameter Store, et la transmettre à la variable d'environnement par un paramètre de modèle de type AWS::SSM::Parameter::Value<String>.
    - id: c
      text:
        en: |-
          Pass the secret ARN in an environment variable, and have the function call GetSecretValue with the AWS SDK at the start of every invocation to read the current key before it calls the partner API.
        fr: |-
          Transmettre l'ARN du secret dans une variable d'environnement, et faire appeler GetSecretValue par la fonction avec le kit SDK AWS au début de chaque invocation pour lire la clé actuelle avant d'appeler l'API du partenaire.
    - id: d
      text:
        en: |-
          Pass only the secret ARN in an environment variable, add the AWS Parameters and Secrets Lambda Extension layer with a cache TTL of 300 seconds or less, and read the key from its local endpoint.
        fr: |-
          Transmettre uniquement l'ARN du secret dans une variable d'environnement, ajouter la couche AWS Parameters and Secrets Lambda Extension avec une durée de vie de cache de 300 secondes ou moins, et lire la clé depuis son point de terminaison local.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The AWS Parameters and Secrets Lambda Extension, added as a layer, retrieves secrets and caches them; the function reads them over HTTP on localhost (port 2773 by default) without SDK code for Secrets Manager. With a TTL of at most 300 seconds, a new key is used within 5 minutes, while thousands of invocations share the cached value instead of each calling Secrets Manager. Only the ARN appears in the function configuration.
    fr: |-
      L'AWS Parameters and Secrets Lambda Extension, ajoutée comme couche, récupère les secrets et les met en cache ; la fonction les lit en HTTP sur localhost (port 2773 par défaut), sans code SDK pour Secrets Manager. Avec une durée de vie d'au plus 300 secondes, une nouvelle clé est utilisée dans les 5 minutes, tandis que des milliers d'invocations partagent la valeur en cache au lieu d'appeler chacune Secrets Manager. Seul l'ARN apparaît dans la configuration de la fonction.
  options:
    a:
      en: |-
        A secretsmanager reference would be resolved into the environment variable, so the key would appear in the function configuration, and a new key would require a stack update.
      fr: |-
        Une référence secretsmanager serait résolue dans la variable d'environnement : la clé apparaîtrait dans la configuration de la fonction, et une nouvelle clé exigerait une mise à jour de pile.
    b:
      en: |-
        CloudFormation doesn't support SecureString parameters as SSM parameter types, and the resolved value would still be stored in the function configuration.
      fr: |-
        CloudFormation ne prend pas en charge les paramètres SecureString comme types de paramètres SSM, et la valeur résolue resterait stockée dans la configuration de la fonction.
    c:
      en: |-
        Reading the secret on every invocation keeps it out of the configuration but makes thousands of Secrets Manager calls per minute, which the company wants to avoid.
      fr: |-
        Lire le secret à chaque invocation le garde hors de la configuration, mais génère des milliers d'appels à Secrets Manager par minute, ce que l'entreprise veut éviter.
references:
  - title: Using Parameter Store parameters in AWS Lambda functions - AWS Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/ps-integration-lambda-extensions.html
  - title: Get a secure string value from Systems Manager Parameter Store - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-ssm-secure-strings.html
