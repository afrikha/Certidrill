id: sapc03-5c-canary-multi-region-checkout
objective: "5.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An online retailer serves customers in North America, Europe, and Asia Pacific from a stack in us-east-1 behind Amazon CloudFront. Last month, a misconfigured AWS WAF rule blocked the payment step for customers outside North America for 2 hours at night, local time in Europe. CloudWatch RUM recorded only a handful of sessions from those regions during that period, and nobody was alerted. The company must detect within 5 minutes, at any hour, that the sign-in, cart, and payment steps fail for users in any of the three geographies, and the alert must say which geography is affected. The payment step uses a test card in a sandbox mode of the payment provider.

    Which solution will meet these requirements?
  fr: |
    Un détaillant en ligne sert des clients en Amérique du Nord, en Europe et en Asie-Pacifique à partir d'une pile dans us-east-1 derrière Amazon CloudFront. Le mois dernier, une règle AWS WAF mal configurée a bloqué l'étape de paiement pour les clients situés hors d'Amérique du Nord pendant 2 heures la nuit, heure européenne. CloudWatch RUM n'a enregistré que quelques sessions de ces régions pendant cette période, et personne n'a été alerté. L'entreprise doit détecter en moins de 5 minutes, à toute heure, que les étapes de connexion, de panier et de paiement échouent pour les utilisateurs de l'une des trois zones géographiques, et l'alerte doit indiquer la zone concernée. L'étape de paiement utilise une carte de test dans un mode sandbox du prestataire de paiement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one CloudWatch Synthetics canary in us-east-1 that runs the sign-in, cart, and payment steps every minute through CloudFront, and alarm on its SuccessPercent metric.
        fr: |-
          Créer un seul canary CloudWatch Synthetics dans us-east-1 qui exécute chaque minute les étapes de connexion, de panier et de paiement via CloudFront, et déclencher une alarme sur sa métrique SuccessPercent.
    - id: b
      text:
        en: |-
          Deploy the same canary script for the sign-in, cart, and payment steps in us-east-1, eu-west-1, and ap-southeast-1 to run every minute, with a SuccessPercent alarm per Region.
        fr: |-
          Déployer le même script de canary pour les étapes de connexion, de panier et de paiement dans us-east-1, eu-west-1 et ap-southeast-1, exécuté chaque minute, avec une alarme SuccessPercent par Région.
    - id: c
      text:
        en: |-
          Create CloudWatch alarms on the RUM HTTP error and JavaScript error counts for each country group of the app monitor, with missing data treated as not breaching.
        fr: |-
          Créer des alarmes CloudWatch sur les nombres d'erreurs HTTP et JavaScript RUM de chaque groupe de pays du moniteur d'application, en traitant les données manquantes comme non dépassées.
    - id: d
      text:
        en: |-
          Create Amazon Route 53 health checks on the CloudFront distribution's checkout URL from health checkers in the three geographies, and alarm on the HealthCheckPercentageHealthy metric.
        fr: |-
          Créer des vérifications de l'état Amazon Route 53 sur l'URL de paiement de la distribution CloudFront depuis des vérificateurs d'état situés dans les trois zones géographiques, et déclencher une alarme sur la métrique HealthCheckPercentageHealthy.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Canaries generate their own traffic, so they detect failures at night when real users are absent, and they script the full multi-step journey. A canary runs from the Region where it is created, so the same script in three Regions measures the journey from each geography, and one alarm per Region identifies which geography fails.
    fr: |-
      Les canaries génèrent leur propre trafic : ils détectent les pannes la nuit, en l'absence d'utilisateurs réels, et ils scriptent le parcours complet en plusieurs étapes. Un canary s'exécute depuis la Région où il est créé : le même script dans trois Régions mesure le parcours depuis chaque zone géographique, et une alarme par Région identifie la zone en échec.
  options:
    a:
      en: |-
        A single canary in us-east-1 tests from North America only, so it would have kept succeeding while customers in Europe and Asia Pacific were blocked.
      fr: |-
        Un seul canary dans us-east-1 teste uniquement depuis l'Amérique du Nord : il aurait continué de réussir pendant que les clients d'Europe et d'Asie-Pacifique étaient bloqués.
    c:
      en: |-
        RUM depends on real sessions; with almost no traffic at night there are no errors to count, and treating missing data as not breaching hides the outage.
      fr: |-
        RUM dépend de sessions réelles ; avec presque aucun trafic la nuit, il n'y a pas d'erreurs à compter, et traiter les données manquantes comme non dépassées masque la panne.
    d:
      en: |-
        A Route 53 health check requests one URL; it can't sign in, fill a cart, and run the payment step, and its percentage metric doesn't say which geography fails.
      fr: |-
        Une vérification de l'état Route 53 interroge une seule URL ; elle ne peut ni se connecter, ni remplir un panier, ni exécuter l'étape de paiement, et sa métrique en pourcentage n'indique pas quelle zone géographique échoue.
references:
  - title: "Using canary blueprints - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_Blueprints.html
  - title: "CloudWatch RUM - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-RUM.html
