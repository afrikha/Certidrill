id: sapc03-5b-eval-agent-batch-baseline
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a travel-booking agent on Amazon Bedrock AgentCore Runtime, and AgentCore Observability sends the agent's traces to Amazon CloudWatch. The team plans to replace the agent's foundation model and to rewrite its system prompt. The quality lead has selected 400 recorded production sessions that represent the difficult booking scenarios. She wants a baseline score for these sessions with the goal success rate and tool selection accuracy evaluators before the change, and the same scores for a rerun of the same scenarios after the change, so that she can compare the averages. The team wants the service to discover the sessions, collect their spans, and return aggregate scores, without any orchestration code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un agent de réservation de voyages sur Amazon Bedrock AgentCore Runtime, et AgentCore Observability envoie les traces de l'agent vers Amazon CloudWatch. L'équipe prévoit de remplacer le modèle de fondation de l'agent et de réécrire son invite système. La responsable qualité a sélectionné 400 sessions de production enregistrées qui représentent les scénarios de réservation difficiles. Elle veut un score de référence pour ces sessions avec les évaluateurs de taux de réussite de l'objectif et d'exactitude de la sélection d'outils avant le changement, puis les mêmes scores pour une nouvelle exécution des mêmes scénarios après le changement, afin de comparer les moyennes. L'équipe veut que le service découvre les sessions, collecte leurs spans et renvoie des scores agrégés, sans aucun code d'orchestration.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AgentCore online evaluation configuration with a 100% sampling rate before and after the change, and compare the scores of all production sessions over two weeks.", fr: "Créer une configuration d'évaluation en ligne AgentCore avec un taux d'échantillonnage de 100 % avant et après le changement, et comparer les scores de toutes les sessions de production sur deux semaines." } }
    - { id: b, text: { en: "Run an AgentCore batch evaluation on the 400 session IDs with both evaluators before the change, and run another batch evaluation on the rerun sessions after the change.", fr: "Exécuter une évaluation par lots AgentCore sur les 400 ID de session avec les deux évaluateurs avant le changement, puis une autre évaluation par lots sur les sessions réexécutées après le changement." } }
    - { id: c, text: { en: "Write a script that collects the spans of each of the 400 sessions from CloudWatch Logs and requests an on-demand evaluation for each trace before and after the change.", fr: "Écrire un script qui collecte dans CloudWatch Logs les spans de chacune des 400 sessions et demande une évaluation à la demande pour chaque trace avant et après le changement." } }
    - { id: d, text: { en: "Run an Amazon Bedrock judge-based model evaluation job with the 400 user requests as prompts before and after the change, and compare the helpfulness scores of the two models.", fr: "Exécuter une tâche d'évaluation de modèle Amazon Bedrock avec modèle juge en utilisant les 400 requêtes utilisateur comme invites avant et après le changement, et comparer les scores d'utilité des deux modèles." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore batch evaluation runs evaluators against many sessions in one asynchronous job: the service discovers the sessions in CloudWatch Logs from session IDs, a time range, or a log group, collects the spans, and returns per-evaluator average scores. It is designed for a baseline before a prompt or model change, a pre/post comparison, and regression tests on a curated set of sessions."
    fr: "L'évaluation par lots AgentCore exécute des évaluateurs sur de nombreuses sessions dans une seule tâche asynchrone : le service découvre les sessions dans CloudWatch Logs à partir d'ID de session, d'une plage de temps ou d'un groupe de journaux, collecte les spans et renvoie les scores moyens par évaluateur. Elle est conçue pour mesurer une référence avant un changement d'invite ou de modèle, comparer avant et après, et exécuter des tests de régression sur un ensemble de sessions sélectionnées."
  options:
    a: { en: "Online evaluation continuously scores a sample of live traffic for production monitoring; it does not score a curated set of 400 sessions, so the before and after populations differ.", fr: "L'évaluation en ligne note en continu un échantillon du trafic réel pour la surveillance de production ; elle ne note pas un ensemble sélectionné de 400 sessions, et les populations avant et après diffèrent." }
    c: { en: "On-demand evaluation requires the caller to collect the spans and submit them, which is the orchestration code that the team wants to avoid.", fr: "L'évaluation à la demande exige que l'appelant collecte les spans et les soumette, c'est-à-dire le code d'orchestration que l'équipe veut éviter." }
    d: { en: "A model evaluation job scores single model responses to prompts; it does not replay the agent's multi-step sessions or score goal success and tool selection.", fr: "Une tâche d'évaluation de modèle note des réponses uniques à des invites ; elle ne rejoue pas les sessions multi-étapes de l'agent et ne note ni la réussite de l'objectif ni la sélection d'outils." }
