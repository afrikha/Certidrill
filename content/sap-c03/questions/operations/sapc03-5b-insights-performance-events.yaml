id: sapc03-5b-insights-performance-events
objective: "5.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An analytics company uses Container Insights with enhanced observability on its Amazon EKS clusters. During an incident, engineers need to compare the memory usage of individual pods, together with the node and namespace of each pod, at a level of detail for which CloudWatch does not create aggregated metrics. The company needs this analysis only for occasional investigations. It does not want to pay for new custom metrics or to deploy new components.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'analytique utilise Container Insights avec observabilité améliorée sur ses clusters Amazon EKS. Pendant un incident, les ingénieurs doivent comparer l'utilisation mémoire de pods individuels, avec le nœud et l'espace de noms de chaque pod, à un niveau de détail pour lequel CloudWatch ne crée pas de métriques agrégées. L'entreprise n'a besoin de cette analyse que pour des investigations occasionnelles. Elle ne veut ni payer de nouvelles métriques personnalisées ni déployer de nouveaux composants.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create CloudWatch Logs metric filters on the performance log group for every pod, and graph the resulting custom metrics on a CloudWatch dashboard.", fr: "Créer des filtres de métrique CloudWatch Logs sur le groupe de journaux de performance pour chaque pod, et tracer les métriques personnalisées obtenues sur un tableau de bord CloudWatch." } }
    - { id: b, text: { en: "Run CloudWatch Logs Insights queries on the cluster's Container Insights performance log events, which contain the raw data behind the aggregated metrics.", fr: "Exécuter des requêtes CloudWatch Logs Insights sur les événements de journal de performance Container Insights du cluster, qui contiennent les données brutes derrière les métriques agrégées." } }
    - { id: c, text: { en: "Install a self-managed Prometheus server with the node exporter on each cluster, and query the pod memory metrics with PromQL during incidents.", fr: "Installer un serveur Prometheus autogéré avec le node exporter sur chaque cluster, et interroger les métriques de mémoire des pods avec PromQL pendant les incidents." } }
    - { id: d, text: { en: "Turn on detailed monitoring for the worker node instances, so that CloudWatch publishes 1-minute memory metrics for each pod that runs on the nodes.", fr: "Activer la surveillance détaillée des instances des nœuds de travail, afin que CloudWatch publie des métriques de mémoire à la minute pour chaque pod qui s'exécute sur les nœuds." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Container Insights collects its data as performance log events in the embedded metric format, and CloudWatch creates only a subset of the possible aggregated metrics from them to control costs. Additional metrics and finer granularity are available by analyzing the raw performance log events with CloudWatch Logs Insights, which needs no new component and no new custom metric."
    fr: "Container Insights collecte ses données sous forme d'événements de journal de performance au format de métrique intégrée, et CloudWatch n'en crée qu'un sous-ensemble de métriques agrégées possibles pour maîtriser les coûts. Des métriques supplémentaires et une granularité plus fine sont disponibles en analysant les événements de journal de performance bruts avec CloudWatch Logs Insights, sans nouveau composant ni nouvelle métrique personnalisée."
  options:
    a: { en: "Metric filters create new custom metrics, which the company does not want to pay for, and one filter per pod does not follow pods that are replaced.", fr: "Les filtres de métrique créent de nouvelles métriques personnalisées, que l'entreprise ne veut pas payer, et un filtre par pod ne suit pas les pods remplacés." }
    c: { en: "A self-managed Prometheus server on each cluster is a new component to deploy and operate.", fr: "Un serveur Prometheus autogéré sur chaque cluster est un nouveau composant à déployer et à exploiter." }
    d: { en: "EC2 detailed monitoring increases the frequency of vended instance metrics; it does not publish memory metrics, and it knows nothing about pods.", fr: "La surveillance détaillée EC2 augmente la fréquence des métriques d'instance fournies ; elle ne publie pas de métriques de mémoire et ne connaît pas les pods." }
references:
  - title: Container Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
