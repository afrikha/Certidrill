id: sapc03-5c-state-manager-agent-drift
objective: "5.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company requires the CloudWatch agent, with a standard configuration stored in Parameter Store, on every Amazon EC2 instance of its production accounts. Instances are launched continuously by Auto Scaling groups, and engineers sometimes stop or remove the agent while troubleshooting and forget to restore it. The operations team wants the agent to be installed and configured on new instances automatically, to be reapplied on a schedule when it drifts, and to get a compliance report of instances that aren't in the desired state. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exige l'agent CloudWatch, avec une configuration standard stockée dans Parameter Store, sur chaque instance Amazon EC2 de ses comptes de production. Des instances sont lancées en continu par des groupes Auto Scaling, et des ingénieurs arrêtent ou suppriment parfois l'agent pendant un dépannage et oublient de le rétablir. L'équipe d'exploitation veut que l'agent soit installé et configuré automatiquement sur les nouvelles instances, réappliqué selon une planification en cas de dérive, et obtenir un rapport de conformité des instances qui ne sont pas dans l'état souhaité. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Run a Systems Manager Run Command once on all current instances to install and configure the agent, and repeat it after each incident.
        fr: |-
          Exécuter une seule fois une commande Systems Manager Run Command sur toutes les instances actuelles pour installer et configurer l'agent, et la répéter après chaque incident.
    - id: b
      text:
        en: |-
          Add the agent installation and configuration to the user data of every launch template so that each new instance configures itself at boot.
        fr: |-
          Ajouter l'installation et la configuration de l'agent aux données utilisateur de chaque modèle de lancement, afin que chaque nouvelle instance se configure au démarrage.
    - id: c
      text:
        en: |-
          Register all instances with a weekly Systems Manager maintenance window that runs a task to install and configure the agent.
        fr: |-
          Enregistrer toutes les instances auprès d'une fenêtre de maintenance Systems Manager hebdomadaire qui exécute une tâche d'installation et de configuration de l'agent.
    - id: d
      text:
        en: |-
          Create State Manager associations that install the agent and apply the Parameter Store configuration, on a schedule, to instances selected by tag.
        fr: |-
          Créer des associations State Manager qui installent l'agent et appliquent la configuration de Parameter Store, selon une planification, aux instances sélectionnées par balise.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      State Manager sets and maintains a desired configuration: an association runs when it is created, applies to new instances that match its targets, reapplies on its schedule, and reports association compliance. AWS recommends State Manager over maintenance windows for keeping a consistent state on instances that Auto Scaling launches.
    fr: |-
      State Manager définit et maintient une configuration souhaitée : une association s'exécute à sa création, s'applique aux nouvelles instances qui correspondent à ses cibles, se réapplique selon sa planification et rend compte de la conformité de l'association. AWS recommande State Manager plutôt que les fenêtres de maintenance pour maintenir un état cohérent sur les instances lancées par Auto Scaling.
  options:
    a:
      en: |-
        A one-time command doesn't reach instances launched later or correct drift unless someone runs it again, and it produces no ongoing compliance report.
      fr: |-
        Une commande ponctuelle n'atteint pas les instances lancées plus tard et ne corrige pas la dérive à moins que quelqu'un la relance, et elle ne produit pas de rapport de conformité continu.
    b:
      en: |-
        User data runs only at launch, so it doesn't restore an agent that an engineer removes later, and it gives no compliance report.
      fr: |-
        Les données utilisateur ne s'exécutent qu'au lancement : elles ne rétablissent pas un agent supprimé plus tard par un ingénieur, et ne fournissent aucun rapport de conformité.
    c:
      en: |-
        Maintenance windows are for actions in a defined time slot, such as patching; registered targets must be managed as instances come and go, and they don't track a desired state.
      fr: |-
        Les fenêtres de maintenance servent aux actions dans une plage horaire définie, comme les correctifs ; les cibles enregistrées doivent être gérées au gré des instances qui vont et viennent, et elles ne suivent pas un état souhaité.
references:
  - title: "Choosing between State Manager and Maintenance Windows - AWS Systems Manager"
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/state-manager-vs-maintenance-windows.html
