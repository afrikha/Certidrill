id: sapc03-5c-canary-vpc-no-egress
objective: "5.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank runs an internal loan-processing portal on Amazon EC2 instances behind an internal Application Load Balancer in private subnets of a workload account in eu-central-1. A security control, enforced by SCPs, forbids internet gateways and NAT gateways in the VPCs of this account, and the VPC has DNS resolution and DNS hostnames turned on. The operations team must test the full sign-in and loan-search journey every 5 minutes, including at night, and alert when a step fails. The test must keep screenshots of failed runs in Amazon S3 and publish its results as CloudWatch metrics. The team wants a managed solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une banque exploite un portail interne de traitement des prêts sur des instances Amazon EC2 derrière un Application Load Balancer interne, dans des sous-réseaux privés d'un compte de charge de travail dans eu-central-1. Un contrôle de sécurité, appliqué par des SCP, interdit les passerelles Internet et les passerelles NAT dans les VPC de ce compte, et la résolution DNS et les noms d'hôte DNS sont activés sur le VPC. L'équipe d'exploitation doit tester le parcours complet de connexion et de recherche de prêts toutes les 5 minutes, y compris la nuit, et alerter quand une étape échoue. Le test doit conserver les captures d'écran des exécutions en échec dans Amazon S3 et publier ses résultats sous forme de métriques CloudWatch. L'équipe veut une solution gérée avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch Synthetics canary that runs outside any VPC and targets the DNS name of the internal load balancer, and add an alarm on the SuccessPercent metric.
        fr: |-
          Créer un canary CloudWatch Synthetics qui s'exécute hors de tout VPC et cible le nom DNS de l'équilibreur de charge interne, et ajouter une alarme sur la métrique SuccessPercent.
    - id: b
      text:
        en: |-
          Create Amazon Route 53 health checks with string matching on the sign-in and search pages of the internal load balancer, and add alarms on the HealthCheckStatus metric.
        fr: |-
          Créer des vérifications de l'état Amazon Route 53 avec correspondance de chaîne sur les pages de connexion et de recherche de l'équilibreur de charge interne, et ajouter des alarmes sur la métrique HealthCheckStatus.
    - id: c
      text:
        en: |-
          Create a CloudWatch Synthetics canary in the private subnets of the VPC, add an interface VPC endpoint for CloudWatch monitoring and a gateway endpoint for Amazon S3, and add an alarm on the SuccessPercent metric.
        fr: |-
          Créer un canary CloudWatch Synthetics dans les sous-réseaux privés du VPC, ajouter un point de terminaison de VPC d'interface pour la surveillance CloudWatch et un point de terminaison de passerelle pour Amazon S3, et ajouter une alarme sur la métrique SuccessPercent.
    - id: d
      text:
        en: |-
          Create a CloudWatch Synthetics canary in the private subnets of the VPC, add a NAT gateway in a new public subnet for the canary's traffic to AWS services, and add an alarm on the SuccessPercent metric.
        fr: |-
          Créer un canary CloudWatch Synthetics dans les sous-réseaux privés du VPC, ajouter une passerelle NAT dans un nouveau sous-réseau public pour le trafic du canary vers les services AWS, et ajouter une alarme sur la métrique SuccessPercent.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A canary attached to the VPC can reach the internal load balancer, and it can run a scripted multi-step journey on a schedule with screenshots. Without internet access, the canary needs an interface endpoint for CloudWatch (com.amazonaws.region.monitoring) to publish metrics and a gateway endpoint for S3 to store its artifacts, which keeps the traffic private and meets the SCP.
    fr: |-
      Un canary rattaché au VPC peut atteindre l'équilibreur de charge interne et exécuter un parcours scripté en plusieurs étapes selon une planification, avec captures d'écran. Sans accès Internet, le canary a besoin d'un point de terminaison d'interface pour CloudWatch (com.amazonaws.region.monitoring) afin de publier ses métriques et d'un point de terminaison de passerelle pour S3 afin de stocker ses artefacts, ce qui garde le trafic privé et respecte la SCP.
  options:
    a:
      en: |-
        A canary outside the VPC has no network path to an internal load balancer, whose DNS name resolves to private IP addresses.
      fr: |-
        Un canary hors du VPC n'a aucun chemin réseau vers un équilibreur de charge interne, dont le nom DNS se résout en adresses IP privées.
    b:
      en: |-
        Route 53 health checkers run on the internet and can't reach private IP addresses, and a health check can't sign in and run a multi-step journey or keep screenshots.
      fr: |-
        Les vérificateurs d'état Route 53 s'exécutent sur Internet et ne peuvent pas atteindre des adresses IP privées, et une vérification de l'état ne peut ni se connecter et dérouler un parcours en plusieurs étapes, ni conserver des captures d'écran.
    d:
      en: |-
        A NAT gateway is forbidden in this account by the SCP-enforced control, so this design can't be deployed.
      fr: |-
        Une passerelle NAT est interdite dans ce compte par le contrôle appliqué par SCP : cette conception ne peut pas être déployée.
references:
  - title: "Running a canary on a VPC - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries_VPC.html
