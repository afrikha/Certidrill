id: sapc03-5b-lambda-canary-alarms
objective: "5.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's payments team deploys an AWS Lambda function behind Amazon API Gateway with an AWS SAM template and AWS CodePipeline. A recent release caused errors for all users at the same time. The team now wants each new version to receive 10% of the traffic first, and the remaining traffic 10 minutes later. If the function's error alarm in Amazon CloudWatch goes to ALARM during the deployment, all traffic must return to the previous version automatically. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'équipe paiements d'AnyCompany déploie une fonction AWS Lambda derrière Amazon API Gateway avec un modèle AWS SAM et AWS CodePipeline. Une version récente a provoqué des erreurs pour tous les utilisateurs en même temps. L'équipe veut désormais que chaque nouvelle version reçoive d'abord 10 % du trafic, puis le reste du trafic 10 minutes plus tard. Si l'alarme d'erreurs de la fonction dans Amazon CloudWatch passe à l'état ALARM pendant le déploiement, tout le trafic doit revenir automatiquement à la version précédente. L'équipe veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Publish each version manually, and run a script that moves 10% of the requests to a new API stage through Route 53 weighted records, then 100% after 10 minutes.", fr: "Publier chaque version manuellement, et exécuter un script qui envoie 10 % des requêtes vers une nouvelle étape d'API au moyen d'enregistrements pondérés Route 53, puis 100 % après 10 minutes." } }
    - { id: b, text: { en: "Turn on an API Gateway canary release on the production stage with 10% of the traffic, and promote the canary manually after the team checks the error alarm.", fr: "Activer une version canary API Gateway sur l'étape de production avec 10 % du trafic, et promouvoir le canary manuellement après que l'équipe a vérifié l'alarme d'erreurs." } }
    - { id: c, text: { en: "Set AutoPublishAlias and a DeploymentPreference of type Linear10PercentEvery1Minute in the template, without alarms, so that traffic moves gradually to the new version.", fr: "Définir AutoPublishAlias et une DeploymentPreference de type Linear10PercentEvery1Minute dans le modèle, sans alarme, afin que le trafic passe progressivement à la nouvelle version." } }
    - { id: d, text: { en: "Set AutoPublishAlias and a DeploymentPreference of type Canary10Percent10Minutes in the template, and list the error alarm in the Alarms property of the deployment preference.", fr: "Définir AutoPublishAlias et une DeploymentPreference de type Canary10Percent10Minutes dans le modèle, et indiquer l'alarme d'erreurs dans la propriété Alarms de la préférence de déploiement." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With AutoPublishAlias and DeploymentPreference, AWS SAM publishes a new version, points an alias at it, and creates the CodeDeploy resources that shift traffic. Canary10Percent10Minutes sends 10% of the traffic to the new version and the rest after 10 minutes, and CodeDeploy rolls the deployment back if an alarm listed in Alarms is triggered."
    fr: "Avec AutoPublishAlias et DeploymentPreference, AWS SAM publie une nouvelle version, y fait pointer un alias et crée les ressources CodeDeploy qui déplacent le trafic. Canary10Percent10Minutes envoie 10 % du trafic vers la nouvelle version, puis le reste après 10 minutes, et CodeDeploy restaure le déploiement si une alarme listée dans Alarms se déclenche."
  options:
    a: { en: "A custom script with DNS weights adds code to maintain, has no automatic rollback on the alarm, and DNS caching makes the split imprecise.", fr: "Un script personnalisé avec des pondérations DNS ajoute du code à maintenir, ne restaure rien automatiquement sur l'alarme, et la mise en cache DNS rend la répartition imprécise." }
    b: { en: "The canary is promoted or removed by hand after a person checks the alarm, so the rollback is not automatic.", fr: "Le canary est promu ou supprimé à la main après qu'une personne a vérifié l'alarme : la restauration n'est pas automatique." }
    c: { en: "A linear configuration shifts 10% every minute instead of 10% then 90% after 10 minutes, and without alarms nothing rolls the deployment back.", fr: "Une configuration linéaire déplace 10 % chaque minute au lieu de 10 % puis 90 % après 10 minutes, et sans alarme rien ne restaure le déploiement." }
references:
  - title: Deploying serverless applications gradually with AWS SAM
    url: https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/automating-updates-to-serverless-apps.html
  - title: Working with deployment configurations in CodeDeploy
    url: https://docs.aws.amazon.com/codedeploy/latest/userguide/deployment-configurations.html
