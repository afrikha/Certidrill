id: sapc03-5c-health-retirement-stop-start
objective: "5.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs several stand-alone Amazon EC2 instances with EBS root volumes for legacy encoding software in a production account. Each instance must keep its instance ID and attached EBS volumes. Last month, an instance was stopped by AWS on its scheduled retirement date in the middle of a broadcast, although an AWS Health scheduled change event had announced the retirement two weeks earlier. The company wants every future retirement event for these instances to be handled automatically during the next night, before the retirement date. The company wants a managed solution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exploite dans un compte de production plusieurs instances Amazon EC2 autonomes avec des volumes racines EBS pour un logiciel d'encodage ancien. Chaque instance doit conserver son ID d'instance et ses volumes EBS attachés. Le mois dernier, une instance a été arrêtée par AWS à sa date de retrait planifiée en pleine diffusion, alors qu'un événement AWS Health de modification planifiée avait annoncé le retrait deux semaines plus tôt. L'entreprise veut que chaque futur événement de retrait de ces instances soit traité automatiquement pendant la nuit suivante, avant la date de retrait. L'entreprise veut une solution gérée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a CloudWatch alarm on the StatusCheckFailed_System metric of each instance with the EC2 recover action.
        fr: |-
          Créer sur la métrique StatusCheckFailed_System de chaque instance une alarme CloudWatch avec l'action de récupération EC2.
    - id: b
      text:
        en: |-
          Create an EventBridge rule for AWS Health EC2 instance retirement events that runs AWS Systems Manager Run Command to reboot the operating system of the affected instance at night.
        fr: |-
          Créer une règle EventBridge pour les événements AWS Health de retrait d'instances EC2 qui exécute AWS Systems Manager Run Command pour redémarrer le système d'exploitation de l'instance concernée la nuit.
    - id: c
      text:
        en: |-
          Put each instance in its own Auto Scaling group with a minimum, maximum, and desired capacity of 1, and add a launch lifecycle hook that restores the software configuration.
        fr: |-
          Placer chaque instance dans son propre groupe Auto Scaling avec une capacité minimale, maximale et souhaitée de 1, et ajouter un hook de cycle de vie de lancement qui restaure la configuration du logiciel.
    - id: d
      text:
        en: |-
          Create an EventBridge rule for AWS Health EC2 instance retirement events that starts an Automation runbook, which waits until 02:00 with an aws:sleep step and then stops and starts the affected instance.
        fr: |-
          Créer une règle EventBridge pour les événements AWS Health de retrait d'instances EC2 qui démarre un runbook Automation, lequel attend 02:00 avec une étape aws:sleep puis arrête et démarre l'instance concernée.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For an EBS-backed instance scheduled for retirement, AWS recommends a stop and start before the retirement date: starting the stopped instance migrates it to new hardware while it keeps its instance ID and EBS volumes. The Health event in EventBridge identifies the instance, and the Automation runbook waits for the night before it acts.
    fr: |-
      Pour une instance basée sur EBS dont le retrait est planifié, AWS recommande un arrêt puis un démarrage avant la date de retrait : le démarrage de l'instance arrêtée la migre vers un nouveau matériel, tout en conservant son ID d'instance et ses volumes EBS. L'événement Health dans EventBridge identifie l'instance, et le runbook Automation attend la nuit avant d'agir.
  options:
    a:
      en: |-
        Automatic recovery reacts to a failed system status check; a scheduled retirement isn't a check failure, so the instance would still be stopped on the retirement date.
      fr: |-
        La récupération automatique réagit à l'échec d'une vérification d'état du système ; un retrait planifié n'est pas un échec de vérification : l'instance serait quand même arrêtée à la date de retrait.
    b:
      en: |-
        A reboot of the operating system keeps the instance on the same host, so it doesn't move the instance off the hardware that is being retired.
      fr: |-
        Un redémarrage du système d'exploitation laisse l'instance sur le même hôte : il ne la déplace pas hors du matériel qui va être retiré.
    c:
      en: |-
        Auto Scaling replaces instances with new ones, which changes the instance ID, and the group doesn't act on retirement events before the date.
      fr: |-
        Auto Scaling remplace les instances par de nouvelles, ce qui change l'ID d'instance, et le groupe n'agit pas sur les événements de retrait avant la date.
references:
  - title: "Instance retirement - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-retirement.html
  - title: "Automatic instance recovery - Amazon Elastic Compute Cloud"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-recover.html
