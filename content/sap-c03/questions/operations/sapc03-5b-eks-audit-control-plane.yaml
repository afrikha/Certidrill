id: sapc03-5b-eks-audit-control-plane
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A regulated company runs several Amazon EKS clusters that are shared by many application teams. Auditors require a record of which users and service accounts created, changed, or deleted Kubernetes RBAC roles and role bindings in each cluster. The security team checked the AWS CloudTrail organization trail and found EKS API calls such as UpdateClusterConfig, but not the changes made with kubectl. The company wants this record in CloudWatch Logs with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise réglementée exécute plusieurs clusters Amazon EKS partagés par de nombreuses équipes applicatives. Les auditeurs exigent un enregistrement des utilisateurs et des comptes de service qui ont créé, modifié ou supprimé des rôles et des liaisons de rôles RBAC Kubernetes dans chaque cluster. L'équipe de sécurité a vérifié le journal de suivi d'organisation AWS CloudTrail et y a trouvé les appels d'API EKS comme UpdateClusterConfig, mais pas les modifications faites avec kubectl. L'entreprise veut cet enregistrement dans CloudWatch Logs avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn on CloudTrail Insights on the organization trail, so that unusual activity on the Kubernetes API of each cluster is recorded and highlighted.", fr: "Activer CloudTrail Insights sur le journal de suivi d'organisation, afin que l'activité inhabituelle sur l'API Kubernetes de chaque cluster soit enregistrée et signalée." } }
    - { id: b, text: { en: "Install the Amazon CloudWatch Observability EKS add-on, so that Fluent Bit collects the logs of every pod, including the pods that run kubectl commands.", fr: "Installer le module complémentaire EKS Amazon CloudWatch Observability, afin que Fluent Bit collecte les journaux de chaque pod, y compris les pods qui exécutent des commandes kubectl." } }
    - { id: c, text: { en: "Turn on VPC flow logs for the cluster subnets, and query them with CloudWatch Logs Insights to find the connections to the Kubernetes API server endpoint.", fr: "Activer les journaux de flux VPC pour les sous-réseaux des clusters, et les interroger avec CloudWatch Logs Insights pour trouver les connexions au point de terminaison du serveur d'API Kubernetes." } }
    - { id: d, text: { en: "Enable the audit control plane log type on each cluster, so that the Kubernetes audit logs are sent to the cluster's log group in CloudWatch Logs.", fr: "Activer le type de journal du plan de contrôle audit sur chaque cluster, afin que les journaux d'audit Kubernetes soient envoyés vers le groupe de journaux du cluster dans CloudWatch Logs." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Kubernetes audit logs record the individual users, administrators, and system components that affected the cluster, including changes to RBAC objects made through the Kubernetes API. EKS control plane logs are off by default; each log type, such as audit, is enabled per cluster and sent to the cluster's log group in CloudWatch Logs."
    fr: "Les journaux d'audit Kubernetes enregistrent les utilisateurs, administrateurs et composants système qui ont agi sur le cluster, y compris les modifications d'objets RBAC faites via l'API Kubernetes. Les journaux du plan de contrôle EKS sont désactivés par défaut ; chaque type de journal, comme audit, est activé par cluster et envoyé au groupe de journaux du cluster dans CloudWatch Logs."
  options:
    a: { en: "CloudTrail Insights analyzes the AWS API calls that the trail already records; kubectl calls go to the Kubernetes API server and are not in the trail.", fr: "CloudTrail Insights analyse les appels d'API AWS que le journal de suivi enregistre déjà ; les appels kubectl vont au serveur d'API Kubernetes et ne figurent pas dans le journal de suivi." }
    b: { en: "Fluent Bit collects container output of the pods, not the API server's record of who changed RBAC objects, and kubectl often runs outside the cluster.", fr: "Fluent Bit collecte la sortie des conteneurs des pods, pas l'enregistrement du serveur d'API indiquant qui a modifié les objets RBAC, et kubectl s'exécute souvent hors du cluster." }
    c: { en: "Flow logs show network connections, not the identity of the caller or the Kubernetes objects that were changed.", fr: "Les journaux de flux montrent des connexions réseau, pas l'identité de l'appelant ni les objets Kubernetes modifiés." }
references:
  - title: Send control plane logs to CloudWatch Logs
    url: https://docs.aws.amazon.com/eks/latest/userguide/control-plane-logs.html
