id: sapc03-5a-stackset-per-ou-defaults
objective: "5.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses one service-managed StackSet with automatic deployment to create central logging resources in the Production OU and the Sandbox OU. The template has a LogRetentionDays parameter whose StackSet value is 30. Production accounts must use 3650, so last year an engineer applied a parameter override of 3650 to the Production OU with update-stack-instances. Auditors found that 12 production accounts created since then use 30 days. New accounts join both OUs every week, and accounts sometimes move between the OUs. The company wants every account, including future accounts, to get the right value automatically, without changing the template.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un StackSet à autorisations gérées par le service avec déploiement automatique pour créer des ressources de journalisation centrales dans l'OU Production et l'OU Sandbox. Le modèle possède un paramètre LogRetentionDays dont la valeur dans le StackSet est 30. Les comptes de production doivent utiliser 3650 : l'an dernier, un ingénieur a donc appliqué une substitution de paramètre de 3650 à l'OU Production avec update-stack-instances. Les auditeurs ont constaté que 12 comptes de production créés depuis utilisent 30 jours. De nouveaux comptes rejoignent les deux OU chaque semaine, et des comptes passent parfois d'une OU à l'autre. L'entreprise veut que chaque compte, y compris les comptes futurs, reçoive automatiquement la bonne valeur, sans modifier le modèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create two service-managed StackSets with automatic deployment from the same template: one for the Production OU with LogRetentionDays 3650 and one for the Sandbox OU with 30.
        fr: |-
          Créer deux StackSets à autorisations gérées par le service avec déploiement automatique à partir du même modèle : l'un pour l'OU Production avec LogRetentionDays à 3650, l'autre pour l'OU Sandbox avec 30.
    - id: b
      text:
        en: |-
          Keep the single StackSet, and apply the parameter override of 3650 to the Production OU again with update-stack-instances, so that accounts that join the OU later inherit the overridden value.
        fr: |-
          Conserver le StackSet unique, et appliquer de nouveau la substitution de paramètre de 3650 à l'OU Production avec update-stack-instances, pour que les comptes qui rejoignent l'OU ensuite héritent de la valeur substituée.
    - id: c
      text:
        en: |-
          Keep the single StackSet, and turn on managed execution so that automatic deployments reuse the parameter overrides of the OU that each new account joins.
        fr: |-
          Conserver le StackSet unique, et activer l'exécution gérée pour que les déploiements automatiques réutilisent les substitutions de paramètres de l'OU que rejoint chaque nouveau compte.
    - id: d
      text:
        en: |-
          Keep the single StackSet, and each week add the new production accounts with a UNION account filter and the parameter override of 3650 on their stack instances.
        fr: |-
          Conserver le StackSet unique, et ajouter chaque semaine les nouveaux comptes de production avec un filtre de comptes UNION et la substitution de paramètre de 3650 sur leurs instances de pile.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Parameter overrides on an OU apply only to the accounts that are in the OU when the override is made; accounts added later get the StackSet's own parameter values. With one StackSet per OU, each StackSet's value is the right one for its OU, so automatic deployment gives new accounts the correct retention. When an account moves between the OUs, automatic deployment removes the old StackSet's stack and creates the new one's.
    fr: |-
      Les substitutions de paramètres sur une OU ne s'appliquent qu'aux comptes présents dans l'OU au moment de la substitution ; les comptes ajoutés ensuite reçoivent les valeurs de paramètres du StackSet lui-même. Avec un StackSet par OU, la valeur de chaque StackSet est la bonne pour son OU : le déploiement automatique donne donc la bonne rétention aux nouveaux comptes. Lorsqu'un compte change d'OU, le déploiement automatique supprime la pile de l'ancien StackSet et crée celle du nouveau.
  options:
    b:
      en: |-
        Re-applying the override fixes the current accounts only; accounts that join the OU afterwards still receive the StackSet value of 30.
      fr: |-
        Réappliquer la substitution corrige seulement les comptes actuels ; les comptes qui rejoignent l'OU ensuite reçoivent toujours la valeur 30 du StackSet.
    c:
      en: |-
        Managed execution only lets non-conflicting StackSet operations run concurrently and queues the others; it doesn't change which parameter values new accounts receive.
      fr: |-
        L'exécution gérée permet seulement d'exécuter simultanément les opérations de StackSet sans conflit et met les autres en file d'attente ; elle ne change pas les valeurs de paramètres reçues par les nouveaux comptes.
    d:
      en: |-
        A weekly manual step isn't automatic, and accounts get the wrong value until someone runs it; automatic deployment also ignores account-level filters.
      fr: |-
        Une étape manuelle hebdomadaire n'est pas automatique, et les comptes reçoivent une mauvaise valeur jusqu'à son exécution ; le déploiement automatique ignore en outre les filtres au niveau des comptes.
references:
