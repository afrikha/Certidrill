id: sapc03-5b-composite-deploy-suppressor
objective: "5.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's checkout service has one CloudWatch alarm on its 5xx error rate and another on its p99 latency, and each alarm pages the on-call engineer through Amazon SNS. During every deployment, both alarms fire briefly while tasks are replaced, and engineers receive two pages that need no action. Outside deployments, a short latency spike alone is not worth a page, but high errors together with high latency are. Deployments start at any time of day, and a metric alarm named deployment-in-progress is already in the ALARM state while a deployment runs.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Le service de paiement d'AnyCompany possède une alarme CloudWatch sur son taux d'erreurs 5xx et une autre sur sa latence p99, et chaque alarme envoie une page à l'ingénieur d'astreinte via Amazon SNS. Pendant chaque déploiement, les deux alarmes se déclenchent brièvement pendant le remplacement des tâches, et les ingénieurs reçoivent deux pages qui ne nécessitent aucune action. En dehors des déploiements, un pic de latence bref ne mérite pas une page, mais des erreurs élevées accompagnées d'une latence élevée, si. Les déploiements commencent à toute heure, et une alarme de métrique nommée deployment-in-progress est déjà à l'état ALARM pendant qu'un déploiement s'exécute.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a composite alarm with the rule ALARM(errors) AND ALARM(latency) that pages through SNS, set deployment-in-progress as its actions suppressor, and remove the actions of the two alarms.", fr: "Créer une alarme composite avec la règle ALARM(errors) AND ALARM(latency) qui envoie une page via SNS, définir deployment-in-progress comme son suppresseur d'actions, et retirer les actions des deux alarmes." } }
    - { id: b, text: { en: "Add steps to the deployment pipeline that call DisableAlarmActions on both alarms before each deployment and EnableAlarmActions after each deployment completes.", fr: "Ajouter au pipeline de déploiement des étapes qui appellent DisableAlarmActions sur les deux alarmes avant chaque déploiement et EnableAlarmActions après la fin de chaque déploiement." } }
    - { id: c, text: { en: "Create an alarm mute rule for both alarms with a recurring schedule that covers the usual deployment windows of the team on weekdays.", fr: "Créer une règle de mise en sourdine des alarmes (mute rule) pour les deux alarmes avec une planification récurrente qui couvre les fenêtres de déploiement habituelles de l'équipe en semaine." } }
    - { id: d, text: { en: "Increase the evaluation periods of both alarms to 15 minutes, so that the alarms stay in the OK state while the tasks are replaced during a deployment.", fr: "Porter les périodes d'évaluation des deux alarmes à 15 minutes, afin que les alarmes restent à l'état OK pendant le remplacement des tâches lors d'un déploiement." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A composite alarm evaluates the states of the alarms it references, so the AND rule sends a single page only when errors and latency are both in ALARM. With deployment-in-progress as the actions suppressor, the composite alarm stops taking actions while the suppressor is in ALARM and resumes when it returns to OK, which matches deployments that start at any time."
    fr: "Une alarme composite évalue les états des alarmes qu'elle référence : la règle AND n'envoie une seule page que lorsque les erreurs et la latence sont toutes deux à l'état ALARM. Avec deployment-in-progress comme suppresseur d'actions, l'alarme composite cesse d'agir tant que le suppresseur est à l'état ALARM et reprend quand il revient à OK, ce qui convient à des déploiements qui commencent à toute heure."
  options:
    b: { en: "Disabling actions still leaves two separate pages outside deployments, including for a latency spike alone, and a failed pipeline can leave the actions disabled.", fr: "Désactiver les actions laisse toujours deux pages distinctes hors déploiement, y compris pour un simple pic de latence, et un pipeline en échec peut laisser les actions désactivées." }
    c: { en: "Mute rules follow a fixed schedule, but deployments start at any time, and each alarm still pages on its own outside the windows.", fr: "Les règles de mise en sourdine suivent une planification fixe, alors que les déploiements commencent à toute heure, et chaque alarme envoie toujours sa propre page hors des fenêtres." }
    d: { en: "Longer evaluation delays every real incident, and a latency spike alone still pages, so the noise problem is not solved.", fr: "Une évaluation plus longue retarde chaque incident réel, et un pic de latence seul envoie toujours une page : le problème de bruit n'est pas résolu." }
references:
  - title: Alarm suppression
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarm-suppression.html
  - title: Create a composite alarm
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Create_Composite_Alarm.html
