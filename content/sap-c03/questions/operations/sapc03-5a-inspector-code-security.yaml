id: sapc03-5a-inspector-code-security
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company hosts its source code on a GitLab Self-Managed instance in its data center, connected to AWS through AWS Direct Connect; the instance isn't reachable from the internet. The security team wants a managed AWS service to scan each repository on a defined schedule for flaws in the first-party code (SAST), for vulnerable third-party dependencies, and for misconfigurations in infrastructure as code files. Pull requests that fix SAST findings above a chosen severity must be created automatically. The findings must appear in the service that already reports vulnerabilities for the company's Amazon ECR images and AWS Lambda functions. The company doesn't want to build or maintain scanning pipelines for the repositories.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge son code source sur une instance GitLab Self-Managed dans son centre de données, reliée à AWS par AWS Direct Connect ; l'instance n'est pas accessible depuis Internet. L'équipe de sécurité veut qu'un service AWS géré analyse chaque référentiel selon un calendrier défini, à la recherche de failles dans le code propriétaire (SAST), de dépendances tierces vulnérables et d'erreurs de configuration dans les fichiers d'infrastructure en tant que code. Des demandes d'extraction (pull requests) qui corrigent les résultats SAST au-delà d'une gravité choisie doivent être créées automatiquement. Les résultats doivent apparaître dans le service qui signale déjà les vulnérabilités des images Amazon ECR et des fonctions AWS Lambda de l'entreprise. L'entreprise ne veut ni créer ni maintenir de pipelines d'analyse pour les référentiels.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add an InspectorScan action in SourceCodeScan mode to the AWS CodePipeline pipeline of each repository, with thresholds for critical and high findings and an SBOM kept for each repository.
        fr: |-
          Ajouter une action InspectorScan en mode SourceCodeScan au pipeline AWS CodePipeline de chaque référentiel, avec des seuils pour les résultats critiques et élevés et une SBOM conservée pour chaque référentiel.
    - id: b
      text:
        en: |-
          Activate Amazon Inspector Code Security, connect the GitLab instance through AWS CodeConnections or a VPC configuration, and apply a scan configuration with automatic SAST fixes.
        fr: |-
          Activer Amazon Inspector Code Security, connecter l'instance GitLab par AWS CodeConnections ou une configuration de VPC, et appliquer une configuration d'analyse avec correctifs SAST automatiques.
    - id: c
      text:
        en: |-
          Turn on Amazon ECR enhanced scanning in continuous mode for every repository that builds container images from the GitLab projects.
        fr: |-
          Activer l'analyse améliorée d'Amazon ECR en mode continu pour chaque référentiel qui génère des images de conteneur à partir des projets GitLab.
    - id: d
      text:
        en: |-
          Create AWS Config custom policy rules written in CloudFormation Guard that evaluate the files in the GitLab repositories, and deploy them in a conformance pack.
        fr: |-
          Créer des règles de politique personnalisées AWS Config écrites en CloudFormation Guard qui évaluent les fichiers des référentiels GitLab, et les déployer dans un pack de conformité.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon Inspector Code Security scans first-party code (SAST), third-party dependencies, and infrastructure as code in source repositories, on the schedule set by a scan configuration, and can open pull requests that fix SAST findings above a minimum severity. Self-managed GitLab and GitHub Enterprise instances in private networks connect through CodeConnections or a VPC configuration, and the findings land in Amazon Inspector next to the ECR and Lambda findings.
    fr: |-
      Amazon Inspector Code Security analyse le code propriétaire (SAST), les dépendances tierces et l'infrastructure en tant que code des référentiels sources, selon le calendrier défini par une configuration d'analyse, et peut ouvrir des demandes d'extraction qui corrigent les résultats SAST au-delà d'une gravité minimale. Les instances GitLab autogérées et GitHub Enterprise situées dans des réseaux privés se connectent par CodeConnections ou une configuration de VPC, et les résultats arrivent dans Amazon Inspector à côté des résultats ECR et Lambda.
  options:
    a:
      en: |-
        The InspectorScan action gates a pipeline on dependency vulnerabilities and produces an SBOM; it doesn't scan first-party code or IaC files and doesn't create fix requests.
      fr: |-
        L'action InspectorScan conditionne un pipeline aux vulnérabilités des dépendances et produit une SBOM ; elle n'analyse ni le code propriétaire ni les fichiers IaC et ne crée pas de demandes de correction.
    c:
      en: |-
        ECR scanning covers built images, not the source repositories, so it finds neither SAST issues nor IaC misconfigurations.
      fr: |-
        L'analyse ECR couvre les images générées, pas les référentiels sources : elle ne trouve ni les problèmes SAST ni les erreurs de configuration IaC.
    d:
      en: |-
        AWS Config evaluates the configuration of AWS resources; it can't read files in Git repositories.
      fr: |-
        AWS Config évalue la configuration des ressources AWS ; il ne peut pas lire les fichiers des référentiels Git.
references:
  - title: Amazon Inspector Code Security - Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/code-security-assessments.html
