id: sapc03-5b-anomaly-datapoints
objective: "5.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A streaming company's API latency follows strong daily and weekly patterns: p90 latency is normally 80 ms at night and 220 ms during the evening peaks. A static alarm at 250 ms misses real degradations at night and pages during normal peaks. In addition, single one-minute spikes that resolve on their own create pages that need no action. The team wants to be paged within 5 minutes when latency is abnormal for its time of day during at least 3 of the last 5 minutes.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La latence de l'API d'une entreprise de streaming suit de forts profils quotidiens et hebdomadaires : la latence p90 est normalement de 80 ms la nuit et de 220 ms pendant les pics du soir. Une alarme statique à 250 ms rate les vraies dégradations nocturnes et envoie des pages pendant les pics normaux. De plus, des pics isolés d'une minute qui se résorbent seuls créent des pages qui ne nécessitent aucune action. L'équipe veut recevoir une page en moins de 5 minutes quand la latence est anormale pour l'heure de la journée pendant au moins 3 des 5 dernières minutes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the alarm period to 1 hour, so that short spikes are averaged out before the alarm compares the latency with its threshold.", fr: "Passer la période de l'alarme à 1 heure, afin que les pics brefs soient lissés avant que l'alarme ne compare la latence à son seuil." } }
    - { id: b, text: { en: "Set the alarm to treat missing data as breaching, so that minutes without requests count as degraded latency.", fr: "Configurer l'alarme pour traiter les données manquantes comme en dépassement, afin que les minutes sans requête comptent comme une latence dégradée." } }
    - { id: c, text: { en: "Base the alarm on an anomaly detection band of the p90 latency metric, and trigger it when the value is above the band.", fr: "Baser l'alarme sur une bande de détection d'anomalies de la métrique de latence p90, et la déclencher quand la valeur dépasse la bande." } }
    - { id: d, text: { en: "Create a composite alarm that combines the static alarm and a new alarm at 150 ms with the OR operator.", fr: "Créer une alarme composite qui combine l'alarme statique et une nouvelle alarme à 150 ms avec l'opérateur OR." } }
    - { id: e, text: { en: "Use a 1-minute period with 5 evaluation periods and 3 datapoints to alarm.", fr: "Utiliser une période de 1 minute avec 5 périodes d'évaluation et 3 points de données pour déclencher l'alarme." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "Anomaly detection builds a model from the metric's history that accounts for hourly, daily, and weekly patterns, and an alarm on the band has no static threshold, so the same alarm catches a degradation at night and stays quiet during normal peaks. A 3 out of 5 setting with 1-minute periods ignores an isolated one-minute spike but goes to ALARM within 5 minutes of a sustained problem."
    fr: "La détection d'anomalies construit à partir de l'historique de la métrique un modèle qui tient compte des profils horaires, quotidiens et hebdomadaires, et une alarme sur la bande n'a pas de seuil statique : la même alarme détecte une dégradation nocturne et reste silencieuse pendant les pics normaux. Un réglage 3 sur 5 avec des périodes d'une minute ignore un pic isolé d'une minute mais passe à l'état ALARM en moins de 5 minutes en cas de problème durable."
  options:
    a: { en: "A 1-hour period delays the page far beyond 5 minutes and still compares the latency with a static threshold.", fr: "Une période d'une heure retarde la page bien au-delà de 5 minutes et compare toujours la latence à un seuil statique." }
    b: { en: "Minutes without requests are not degraded latency; counting them as breaching would page during quiet periods.", fr: "Des minutes sans requête ne sont pas une latence dégradée ; les compter en dépassement enverrait des pages pendant les périodes calmes." }
    d: { en: "A 150 ms threshold pages during every evening peak, and OR adds pages instead of removing them; static thresholds cannot follow the daily pattern.", fr: "Un seuil de 150 ms envoie une page à chaque pic du soir, et OR ajoute des pages au lieu d'en supprimer ; des seuils statiques ne peuvent pas suivre le profil quotidien." }
references:
  - title: Using CloudWatch anomaly detection
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Anomaly_Detection.html
  - title: Configuring how CloudWatch alarms treat missing data
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
