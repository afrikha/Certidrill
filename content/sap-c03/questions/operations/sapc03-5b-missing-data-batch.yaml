id: sapc03-5b-missing-data-batch
objective: "5.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A billing team runs a nightly batch job that publishes a custom CloudWatch metric named JobsCompleted with a value of 1 when the job finishes successfully. The job publishes nothing when it fails to start or crashes. The team created an alarm with a period of 1 day that goes to ALARM when JobsCompleted is lower than 1. Last week, the job did not run at all, and the alarm went to INSUFFICIENT_DATA without notifying anyone. The team wants the alarm to notify it whenever the job does not complete.

    Which change will meet this requirement?
  fr: |
    Une équipe de facturation exécute chaque nuit une tâche par lots qui publie une métrique CloudWatch personnalisée nommée JobsCompleted avec la valeur 1 quand la tâche se termine avec succès. La tâche ne publie rien quand elle ne démarre pas ou plante. L'équipe a créé une alarme avec une période de 1 jour qui passe à l'état ALARM quand JobsCompleted est inférieur à 1. La semaine dernière, la tâche ne s'est pas exécutée du tout, et l'alarme est passée à l'état INSUFFICIENT_DATA sans avertir personne. L'équipe veut que l'alarme la prévienne chaque fois que la tâche ne se termine pas.

    Quelle modification permet de répondre à cette exigence ?
body:
  options:
    - { id: a, text: { en: "Set the alarm to treat missing data as breaching, so that a period with no data point counts as a breaching data point.", fr: "Configurer l'alarme pour traiter les données manquantes comme en dépassement (breaching), afin qu'une période sans point de données compte comme un point en dépassement." } }
    - { id: b, text: { en: "Set the alarm to treat missing data as notBreaching, so that a period with no data point keeps the alarm in the OK state.", fr: "Configurer l'alarme pour traiter les données manquantes comme sans dépassement (notBreaching), afin qu'une période sans point de données maintienne l'alarme à l'état OK." } }
    - { id: c, text: { en: "Set the alarm to treat missing data as ignore, so that the alarm keeps its current state until a new data point arrives.", fr: "Configurer l'alarme pour ignorer les données manquantes (ignore), afin qu'elle conserve son état actuel jusqu'à l'arrivée d'un nouveau point de données." } }
    - { id: d, text: { en: "Replace the static threshold with an anomaly detection band, so that the alarm learns the expected daily pattern of the metric.", fr: "Remplacer le seuil statique par une bande de détection d'anomalies, afin que l'alarme apprenne le profil quotidien attendu de la métrique." } }
answer: { optionId: a }
explanation:
  correct:
    en: "By default, missing data is treated as missing, and an alarm whose evaluation range has no data points goes to INSUFFICIENT_DATA. For a metric whose silence signals a problem, treating missing data as breaching makes the empty period count as bad, so the alarm goes to ALARM and sends its notification."
    fr: "Par défaut, les données manquantes sont traitées comme manquantes (missing), et une alarme dont la plage d'évaluation ne contient aucun point de données passe à l'état INSUFFICIENT_DATA. Pour une métrique dont l'absence signale un problème, traiter les données manquantes comme en dépassement fait compter la période vide comme mauvaise : l'alarme passe à l'état ALARM et envoie sa notification."
  options:
    b: { en: "notBreaching fits metrics that report only on errors; here it would hide every night on which the job does not run.", fr: "notBreaching convient aux métriques qui ne publient qu'en cas d'erreur ; ici, elle masquerait chaque nuit où la tâche ne s'exécute pas." }
    c: { en: "ignore keeps the previous state, so after a successful night the alarm would stay in OK when the job does not run.", fr: "ignore conserve l'état précédent : après une nuit réussie, l'alarme resterait à l'état OK quand la tâche ne s'exécute pas." }
    d: { en: "An anomaly detection model still needs data points to compare with the band, so a night with no data is not evaluated as a breach.", fr: "Un modèle de détection d'anomalies a toujours besoin de points de données à comparer à la bande : une nuit sans données n'est pas évaluée comme un dépassement." }
references:
  - title: Configuring how CloudWatch alarms treat missing data
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/alarms-and-missing-data.html
