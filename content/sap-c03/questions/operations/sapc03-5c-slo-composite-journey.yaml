id: sapc03-5c-slo-composite-journey
objective: "5.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company measures its checkout journey with CloudWatch Application Signals. The journey uses four operations in three services that run on Amazon EKS: GET /cart in the cart service, POST /checkout in the checkout service, POST /authorize in the payment service, and POST /confirm in the order service. Each service is in its own account, and the operations team views them from a monitoring account with CloudWatch cross-account observability. The business wants one availability objective of 99.9 percent that reflects the whole journey across the four operations, and a separate objective that the p99 latency of POST /checkout stays under 800 ms for 99 percent of the time. The company wants to use Application Signals SLO features and the fewest custom metrics.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce en ligne mesure son parcours de paiement avec CloudWatch Application Signals. Le parcours utilise quatre opérations dans trois services exécutés sur Amazon EKS : GET /cart dans le service cart, POST /checkout dans le service checkout, POST /authorize dans le service payment, et POST /confirm dans le service order. Chaque service se trouve dans son propre compte, et l'équipe d'exploitation les consulte depuis un compte de surveillance avec l'observabilité entre comptes CloudWatch. Le métier veut un objectif de disponibilité unique de 99,9 % qui reflète le parcours complet sur les quatre opérations, et un objectif distinct selon lequel la latence p99 de POST /checkout reste inférieure à 800 ms 99 % du temps. L'entreprise veut utiliser les fonctionnalités de SLO d'Application Signals et le moins de métriques personnalisées possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create one composite SLO that combines the Availability and the Latency of the four operations, with a 99.9 percent goal and an 800 ms latency threshold.
        fr: |-
          Créer un seul SLO composite qui combine l'Availability et la Latency des quatre opérations, avec un objectif de 99,9 % et un seuil de latence de 800 ms.
    - id: b
      text:
        en: |-
          Create a composite SLO on the Availability of the four operations with a 99.9 percent goal, and a separate SLO on the p99 Latency of POST /checkout.
        fr: |-
          Créer un SLO composite sur l'Availability des quatre opérations avec un objectif de 99,9 %, et un SLO distinct sur la Latency p99 de POST /checkout.
    - id: c
      text:
        en: |-
          Create one Availability SLO on POST /checkout with a 99.9 percent goal, because that operation calls the payment and order services, and a Latency SLO on the same operation.
        fr: |-
          Créer un seul SLO d'Availability sur POST /checkout avec un objectif de 99,9 %, car cette opération appelle les services payment et order, et un SLO de Latency sur la même opération.
    - id: d
      text:
        en: |-
          Create four Availability SLOs, one per operation, each with a 99.9 percent goal, and a Latency SLO on POST /checkout, and show all five SLOs on one CloudWatch dashboard.
        fr: |-
          Créer quatre SLO d'Availability, un par opération, chacun avec un objectif de 99,9 %, et un SLO de Latency sur POST /checkout, puis afficher les cinq SLO sur un seul tableau de bord CloudWatch.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A composite SLO measures Availability across 2 to 20 operations as one objective, which gives the single journey-level target. Composite SLOs don't support Latency, so the latency objective is a separate SLO on the POST /checkout operation, evaluated per period against the 800 ms threshold with a 99 percent goal.
    fr: |-
      Un SLO composite mesure l'Availability sur 2 à 20 opérations comme un seul objectif, ce qui donne la cible unique au niveau du parcours. Les SLO composites ne prennent pas en charge la Latency : l'objectif de latence est donc un SLO distinct sur l'opération POST /checkout, évalué par période par rapport au seuil de 800 ms avec un objectif de 99 %.
  options:
    a:
      en: |-
        Composite SLOs support only the Availability metric, so latency can't be part of the same composite objective.
      fr: |-
        Les SLO composites ne prennent en charge que la métrique Availability : la latence ne peut pas faire partie du même objectif composite.
    c:
      en: |-
        GET /cart isn't called by POST /checkout, so its failures are missed, and an SLO on one operation doesn't measure the journey as a whole.
      fr: |-
        GET /cart n'est pas appelé par POST /checkout : ses échecs sont ignorés, et un SLO sur une seule opération ne mesure pas le parcours dans son ensemble.
    d:
      en: |-
        Four separate SLOs give four objectives, not the single journey objective the business asked for.
      fr: |-
        Quatre SLO distincts donnent quatre objectifs, et non l'objectif unique de parcours demandé par le métier.
references:
  - title: "Service level objectives (SLOs) - Amazon CloudWatch"
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-ServiceLevelObjectives.html
