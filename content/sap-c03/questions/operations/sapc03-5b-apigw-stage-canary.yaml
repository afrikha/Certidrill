id: sapc03-5b-apigw-stage-canary
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany exposes a partner API through an Amazon API Gateway REST API with a stage named prod. A new deployment changes the request mapping templates and a stage variable that selects the backend endpoint. The API team wants 5% of the requests to the prod stage to use the new deployment, while partners keep calling the same invoke URL. The team needs separate CloudWatch logs and metrics for the requests that the new deployment serves, so that it can compare error rates. If the error rate is too high, the team must be able to send all requests back to the current deployment in one step.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une API partenaires via une API REST Amazon API Gateway avec une étape nommée prod. Un nouveau déploiement modifie les modèles de mappage des requêtes et une variable d'étape qui sélectionne le point de terminaison backend. L'équipe API veut que 5 % des requêtes adressées à l'étape prod utilisent le nouveau déploiement, tandis que les partenaires continuent d'appeler la même URL d'appel. L'équipe a besoin de journaux et de métriques CloudWatch distincts pour les requêtes servies par le nouveau déploiement, afin de comparer les taux d'erreur. Si le taux d'erreur est trop élevé, l'équipe doit pouvoir renvoyer toutes les requêtes vers le déploiement actuel en une seule étape.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a canary release on the prod stage with 5% of the traffic and a stage variable override, compare the canary's logs and metrics, and then promote or turn off the canary.", fr: "Créer une version canary sur l'étape prod avec 5 % du trafic et une substitution de variable d'étape, comparer les journaux et métriques du canary, puis promouvoir ou désactiver le canary." } }
    - { id: b, text: { en: "Deploy the change to a new stage named prod-v2, and give the invoke URL of the new stage to the partners that represent about 5% of the traffic.", fr: "Déployer la modification sur une nouvelle étape nommée prod-v2, et donner l'URL d'appel de la nouvelle étape aux partenaires qui représentent environ 5 % du trafic." } }
    - { id: c, text: { en: "Publish a new version of each backend Lambda function, and give the new version a 5% weight on the alias that the current stage variable points to.", fr: "Publier une nouvelle version de chaque fonction Lambda backend, et donner à la nouvelle version une pondération de 5 % sur l'alias vers lequel pointe la variable d'étape actuelle." } }
    - { id: d, text: { en: "Create a second REST API with the new deployment, and add a second API mapping with a 5% weight to the existing custom domain name of the API.", fr: "Créer une seconde API REST avec le nouveau déploiement, et ajouter un second mappage d'API avec une pondération de 5 % au nom de domaine personnalisé existant de l'API." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An API Gateway canary release sends a percentage of the stage's traffic to the new deployment and can override production stage variables for the canary. With execution logging, canary requests get their own log group and metrics for comparison, and the team then promotes the canary or turns it off to send all traffic back to the production release."
    fr: "Une version canary API Gateway envoie un pourcentage du trafic de l'étape vers le nouveau déploiement et peut substituer des variables d'étape de production pour le canary. Avec la journalisation de l'exécution, les requêtes canary ont leur propre groupe de journaux et leurs métriques pour la comparaison, puis l'équipe promeut le canary ou le désactive pour renvoyer tout le trafic vers la version de production."
  options:
    b: { en: "Partners would have to change the URL they call, and the split depends on which partners move rather than on a percentage of requests.", fr: "Les partenaires devraient changer l'URL appelée, et la répartition dépend des partenaires qui migrent et non d'un pourcentage des requêtes." }
    c: { en: "Alias weights split traffic between function versions, but the mapping templates and the stage variable change in API Gateway would not be tested on a share of the requests.", fr: "Les pondérations d'alias répartissent le trafic entre versions de fonction, mais les modèles de mappage et la variable d'étape modifiés dans API Gateway ne seraient pas testés sur une part des requêtes." }
    d: { en: "API mappings of a custom domain name route requests by base path to an API stage; they do not split traffic by weight.", fr: "Les mappages d'API d'un nom de domaine personnalisé routent les requêtes par chemin de base vers une étape d'API ; ils ne répartissent pas le trafic par pondération." }
references:
  - title: Set up an API Gateway canary release deployment
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/canary-release.html
