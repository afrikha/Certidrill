id: sapc03-5a-cdk-bootstrap-trust
objective: "5.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS CDK Pipelines in a tooling account (111122223333) to deploy applications to 12 workload accounts in the us-east-1 and eu-west-1 Regions. A separate security analysis account (999988887777) runs cdk synth on every pull request. Synthesis needs context lookups of the existing VPCs in the workload accounts, but the analysis account must never be able to deploy anything. The security team also requires that CloudFormation deployments started from the tooling account can use only the permissions of a customer managed policy named AppDeployPolicy, which exists in every workload account, instead of administrator access. No long-term credentials are allowed.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany utilise AWS CDK Pipelines dans un compte d'outillage (111122223333) pour déployer des applications dans 12 comptes de charge de travail, dans les Régions us-east-1 et eu-west-1. Un compte d'analyse de sécurité distinct (999988887777) exécute cdk synth pour chaque demande d'extraction (pull request). La synthèse a besoin de recherches de contexte sur les VPC existants des comptes de charge de travail, mais le compte d'analyse ne doit jamais pouvoir déployer quoi que ce soit. L'équipe de sécurité exige aussi que les déploiements CloudFormation lancés depuis le compte d'outillage ne puissent utiliser que les autorisations d'une politique gérée par le client nommée AppDeployPolicy, présente dans chaque compte de charge de travail, au lieu d'un accès administrateur. Aucune information d'identification à long terme n'est autorisée.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Bootstrap each workload account only in us-east-1, because the roles of the bootstrap stack are global and also serve deployments to eu-west-1.
        fr: |-
          Amorcer chaque compte de charge de travail uniquement dans us-east-1, car les rôles de la pile d'amorçage sont globaux et servent aussi aux déploiements dans eu-west-1.
    - id: b
      text:
        en: |-
          Bootstrap every workload account in both Regions with --trust 111122223333 and with --cloudformation-execution-policies set to the ARN of AppDeployPolicy.
        fr: |-
          Amorcer chaque compte de charge de travail dans les deux Régions avec --trust 111122223333 et avec --cloudformation-execution-policies défini sur l'ARN d'AppDeployPolicy.
    - id: c
      text:
        en: |-
          Add 999988887777 to the --trust option of every bootstrap command so that the analysis account can assume the lookup role during synthesis.
        fr: |-
          Ajouter 999988887777 à l'option --trust de chaque commande d'amorçage pour que le compte d'analyse puisse endosser le rôle de recherche pendant la synthèse.
    - id: d
      text:
        en: |-
          Create an IAM user with access keys in each workload account and store the keys in AWS Secrets Manager in the tooling account for the pipeline to use.
        fr: |-
          Créer un utilisateur IAM avec des clés d'accès dans chaque compte de charge de travail et stocker les clés dans AWS Secrets Manager dans le compte d'outillage, pour que le pipeline les utilise.
    - id: e
      text:
        en: |-
          Add --trust-for-lookup 999988887777 to the bootstrap command that is run for every workload account in both Regions.
        fr: |-
          Ajouter --trust-for-lookup 999988887777 à la commande d'amorçage exécutée pour chaque compte de charge de travail dans les deux Régions.
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Bootstrapping is per environment (account and Region). --trust lets the tooling account deploy, and --cloudformation-execution-policies attaches the given managed policies to the role that CloudFormation assumes, replacing administrator access with AppDeployPolicy. --trust-for-lookup lets the analysis account perform lookups and synthesize stacks without permission to deploy them. When the command is run again later, every trusted account must be listed again, or the earlier trusts are removed.
    fr: |-
      L'amorçage se fait par environnement (compte et Région). --trust permet au compte d'outillage de déployer, et --cloudformation-execution-policies attache les politiques gérées indiquées au rôle qu'endosse CloudFormation, ce qui remplace l'accès administrateur par AppDeployPolicy. --trust-for-lookup permet au compte d'analyse d'effectuer des recherches et de synthétiser des piles sans autorisation de les déployer. Si la commande est réexécutée plus tard, chaque compte approuvé doit être de nouveau listé, sinon les approbations précédentes sont supprimées.
  options:
    a:
      en: |-
        Each environment needs its own bootstrap stack (S3 bucket, ECR repository, and roles); deployments to eu-west-1 fail if that Region isn't bootstrapped.
      fr: |-
        Chaque environnement a besoin de sa propre pile d'amorçage (compartiment S3, référentiel ECR et rôles) ; les déploiements vers eu-west-1 échouent si cette Région n'est pas amorcée.
    c:
      en: |-
        Accounts listed in --trust receive the deployment permissions, so the analysis account would be able to deploy, which the requirements forbid.
      fr: |-
        Les comptes listés dans --trust reçoivent les autorisations de déploiement : le compte d'analyse pourrait donc déployer, ce que les exigences interdisent.
    d:
      en: |-
        Access keys are long-term credentials, which the company forbids; the bootstrap roles already let the pipeline assume short-lived sessions.
      fr: |-
        Les clés d'accès sont des informations d'identification à long terme, interdites par l'entreprise ; les rôles d'amorçage permettent déjà au pipeline d'utiliser des sessions de courte durée.
references:
  - title: cdk bootstrap - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/ref-cli-cmd-bootstrap.html
