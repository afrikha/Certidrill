id: sapc03-5a-ssm-parameter-types-config
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys the same AWS CloudFormation template for its Amazon EC2 Auto Scaling groups in 6 Regions and 20 accounts. The template hardcodes the Amazon Linux AMI ID of each Region in a Mappings section, and the team edits the template every month when a new AMI is released. Other values, such as the IDs of the subnets, aren't secret but differ between accounts; they are already stored as plain parameters in Parameter Store in each account. The team wants each deployment to use the latest AMI and the account's own values, with no template edits. The solution must have the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie le même modèle AWS CloudFormation pour ses groupes Auto Scaling Amazon EC2 dans 6 Régions et 20 comptes. Le modèle code en dur l'ID d'AMI Amazon Linux de chaque Région dans une section Mappings, et l'équipe modifie le modèle chaque mois à la sortie d'une nouvelle AMI. D'autres valeurs, comme les ID des sous-réseaux, ne sont pas secrètes mais diffèrent d'un compte à l'autre ; elles sont déjà stockées sous forme de paramètres en clair dans Parameter Store dans chaque compte. L'équipe veut que chaque déploiement utilise la dernière AMI et les valeurs propres au compte, sans modifier le modèle. La solution doit avoir le coût le plus faible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Store the AMI IDs and the subnet IDs in an AWS Secrets Manager secret in each account and Region, and read them with secretsmanager dynamic references.
        fr: |-
          Stocker les ID d'AMI et les ID de sous-réseaux dans un secret AWS Secrets Manager de chaque compte et chaque Région, et les lire avec des références dynamiques secretsmanager.
    - id: b
      text:
        en: |-
          Keep the Mappings section, and add a scheduled Lambda function that updates the AMI IDs in the template in Git each time a new Amazon Linux AMI is published, and opens a pull request that triggers the deployment.
        fr: |-
          Conserver la section Mappings, et ajouter une fonction Lambda planifiée qui met à jour les ID d'AMI du modèle dans Git à chaque publication d'une nouvelle AMI Amazon Linux, et ouvre une demande d'extraction qui déclenche le déploiement.
    - id: c
      text:
        en: |-
          Use ssm-secure dynamic references to the public AMI parameter and to the subnet parameters in the ImageId and subnet properties of the template.
        fr: |-
          Utiliser des références dynamiques ssm-secure vers le paramètre public d'AMI et vers les paramètres de sous-réseaux dans les propriétés ImageId et de sous-réseaux du modèle.
    - id: d
      text:
        en: |-
          Declare an AWS::SSM::Parameter::Value<AWS::EC2::Image::Id> parameter that defaults to the public Amazon Linux AMI path, and an AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>> parameter for the subnets.
        fr: |-
          Déclarer un paramètre AWS::SSM::Parameter::Value<AWS::EC2::Image::Id> dont la valeur par défaut est le chemin du paramètre public d'AMI Amazon Linux, et un paramètre AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>> pour les sous-réseaux.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      SSM parameter types make CloudFormation read the value of a Parameter Store key at each stack create or update. AWS publishes the latest Amazon Linux AMI IDs as public parameters in every Region, so the same template always picks up the current AMI, and the subnet parameter resolves the account's own values. Standard Parameter Store parameters have no additional cost.
    fr: |-
      Les types de paramètres SSM font lire à CloudFormation la valeur d'une clé Parameter Store à chaque création ou mise à jour de pile. AWS publie les ID des dernières AMI Amazon Linux sous forme de paramètres publics dans chaque Région : le même modèle prend donc toujours l'AMI actuelle, et le paramètre de sous-réseaux résout les valeurs propres au compte. Les paramètres standard de Parameter Store n'entraînent aucun coût supplémentaire.
  options:
    a:
      en: |-
        Secrets Manager is billed per secret and per API call and is meant for secrets; it adds cost for values that aren't secret, and someone must update the AMI IDs.
      fr: |-
        Secrets Manager est facturé par secret et par appel d'API et sert aux secrets ; il ajoute un coût pour des valeurs non secrètes, et quelqu'un doit mettre à jour les ID d'AMI.
    b:
      en: |-
        This keeps the template edits, only automated with custom code that the team must maintain, instead of reading the AMI ID at deployment time.
      fr: |-
        Cette solution conserve les modifications du modèle, simplement automatisées par du code personnalisé à maintenir, au lieu de lire l'ID d'AMI au moment du déploiement.
    c:
      en: |-
        ssm-secure references work only on a few secret-bearing properties and don't support public parameters, so ImageId and subnet properties can't use them.
      fr: |-
        Les références ssm-secure ne fonctionnent que sur quelques propriétés portant des secrets et ne prennent pas en charge les paramètres publics : ImageId et les propriétés de sous-réseaux ne peuvent pas les utiliser.
references:
  - title: Specify existing resources at runtime with CloudFormation-supplied parameter types - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/cloudformation-supplied-parameter-types.html
