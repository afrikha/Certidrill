id: sapc03-5a-approval-prod-board
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's release pipeline runs in a tooling account and promotes artifacts from a test account to a production account. A manual approval action named ApproveProd, in a stage named ProdGate, controls the promotion to production. Engineers sign in to the tooling account through AWS IAM Identity Center. The change advisory board must be the only group that can approve or reject ApproveProd. Developers must still be able to view the pipeline and to approve the approval actions of the test stages. The pipeline sends approval requests to an Amazon SNS topic that board members subscribe to. The company requires least privilege.

    Which solution will meet these requirements?
  fr: |
    Le pipeline de publication d'AnyCompany s'exécute dans un compte d'outillage et promeut des artefacts d'un compte de test vers un compte de production. Une action d'approbation manuelle nommée ApproveProd, dans une étape nommée ProdGate, contrôle la promotion en production. Les ingénieurs se connectent au compte d'outillage par AWS IAM Identity Center. Le comité consultatif des changements doit être le seul groupe à pouvoir approuver ou rejeter ApproveProd. Les développeurs doivent toujours pouvoir consulter le pipeline et approuver les actions d'approbation des étapes de test. Le pipeline envoie les demandes d'approbation à une rubrique Amazon SNS à laquelle les membres du comité sont abonnés. L'entreprise exige le moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Give the board a permission set with pipeline read access and PutApprovalResult on the ApproveProd ARN, and limit PutApprovalResult in the developers' permission set to the test approval actions.
        fr: |-
          Donner au comité un jeu d'autorisations avec la lecture du pipeline et PutApprovalResult sur l'ARN d'ApproveProd, et limiter PutApprovalResult dans le jeu d'autorisations des développeurs aux actions d'approbation de test.
    - id: b
      text:
        en: |-
          Attach the AWSCodePipelineApproverAccess managed policy to the board's permission set, and remove all CodePipeline permissions from the developers' permission set.
        fr: |-
          Attacher la politique gérée AWSCodePipelineApproverAccess au jeu d'autorisations du comité, et retirer toutes les autorisations CodePipeline du jeu d'autorisations des développeurs.
    - id: c
      text:
        en: |-
          Add a subscription filter policy to the SNS topic so that only the board members' email addresses receive the approval requests and the approval link, and remove the developers' subscriptions to the topic.
        fr: |-
          Ajouter une politique de filtre d'abonnement à la rubrique SNS pour que seules les adresses e-mail des membres du comité reçoivent les demandes d'approbation et le lien d'approbation, et supprimer les abonnements des développeurs à la rubrique.
    - id: d
      text:
        en: |-
          Move the ApproveProd action into a second pipeline in the production account, and give only the board members access to the production account.
        fr: |-
          Déplacer l'action ApproveProd dans un second pipeline du compte de production, et ne donner accès au compte de production qu'aux membres du comité.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Approving or rejecting requires codepipeline:PutApprovalResult, which can be scoped to a single approval action with the ARN format pipeline/stage/action, plus read permissions such as GetPipeline, GetPipelineState, and GetPipelineExecution. Granting it through IAM Identity Center permission sets gives the board the production approval alone and keeps developers' approvals limited to the test actions.
    fr: |-
      Approuver ou rejeter exige codepipeline:PutApprovalResult, qui peut être limité à une seule action d'approbation avec le format d'ARN pipeline/étape/action, plus des autorisations de lecture comme GetPipeline, GetPipelineState et GetPipelineExecution. L'accorder par des jeux d'autorisations IAM Identity Center donne au comité la seule approbation de production et limite les approbations des développeurs aux actions de test.
  options:
    b:
      en: |-
        The managed policy allows approving every approval action of every pipeline, which isn't least privilege, and developers would lose their access to view the pipeline and approve tests.
      fr: |-
        La politique gérée permet d'approuver toutes les actions d'approbation de tous les pipelines, ce qui n'est pas le moindre privilège, et les développeurs perdraient leur accès en lecture au pipeline et aux approbations de test.
    c:
      en: |-
        SNS only delivers notifications; anyone with PutApprovalResult permission can still approve the action, whether or not they receive the message.
      fr: |-
        SNS ne fait que distribuer des notifications ; toute personne disposant de l'autorisation PutApprovalResult peut toujours approuver l'action, qu'elle reçoive ou non le message.
    d:
      en: |-
        Splitting the release into two pipelines adds artifact hand-off between accounts and a second pipeline to operate, when a scoped IAM permission is enough.
      fr: |-
        Scinder la publication en deux pipelines ajoute un transfert d'artefacts entre comptes et un second pipeline à exploiter, alors qu'une autorisation IAM ciblée suffit.
references:
  - title: Grant approval permissions to an IAM user in CodePipeline - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/approvals-iam-permissions.html
