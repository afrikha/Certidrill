id: sapc03-5b-ecs-fargate-otel-sidecar
objective: "5.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs 40 Amazon ECS services on AWS Fargate. The developers have instrumented the services with the OpenTelemetry SDK and configured them to export OTLP traces and metrics to localhost. The platform team must deliver the traces to AWS X-Ray and the metrics to Amazon CloudWatch. The team cannot install agents on the underlying hosts, because Fargate manages them.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute 40 services Amazon ECS sur AWS Fargate. Les développeurs ont instrumenté les services avec le SDK OpenTelemetry et les ont configurés pour exporter les traces et métriques OTLP vers localhost. L'équipe plateforme doit livrer les traces à AWS X-Ray et les métriques à Amazon CloudWatch. L'équipe ne peut pas installer d'agent sur les hôtes sous-jacents, car Fargate les gère.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an AWS Distro for OpenTelemetry Collector container as a sidecar to each task definition, and grant the task role the permissions to send traces and metrics.", fr: "Ajouter un conteneur AWS Distro for OpenTelemetry Collector comme sidecar à chaque définition de tâche, et accorder au rôle de tâche les autorisations d'envoyer les traces et les métriques." } }
    - { id: b, text: { en: "Run the AWS X-Ray daemon as an ECS service with the DAEMON scheduling strategy on the Fargate clusters, and point the services to it.", fr: "Exécuter le démon AWS X-Ray comme service ECS avec la stratégie de planification DAEMON sur les clusters Fargate, et faire pointer les services vers lui." } }
    - { id: c, text: { en: "Install the CloudWatch agent on the Fargate hosts with AWS Systems Manager Run Command, and configure its OTLP receiver on ports 4317 and 4318.", fr: "Installer l'agent CloudWatch sur les hôtes Fargate avec AWS Systems Manager Run Command, et configurer son récepteur OTLP sur les ports 4317 et 4318." } }
    - { id: d, text: { en: "Turn on Container Insights with enhanced observability for the clusters, so that the OTLP traces and metrics of the tasks are collected.", fr: "Activer Container Insights avec observabilité améliorée pour les clusters, afin que les traces et métriques OTLP des tâches soient collectées." } }
answer: { optionId: a }
explanation:
  correct:
    en: "On Fargate, a collector runs as a sidecar container in the same task, so the application reaches it on localhost and the collector exports the traces to X-Ray and the metrics to CloudWatch. The collector uses the task role's credentials, which therefore need the permissions to write traces and metrics."
    fr: "Sur Fargate, un collecteur s'exécute comme conteneur sidecar dans la même tâche : l'application l'atteint sur localhost, et le collecteur exporte les traces vers X-Ray et les métriques vers CloudWatch. Le collecteur utilise les informations d'identification du rôle de tâche, qui a donc besoin des autorisations d'écrire des traces et des métriques."
  options:
    b: { en: "The DAEMON scheduling strategy is not supported on Fargate, and the X-Ray daemon does not receive OTLP data.", fr: "La stratégie de planification DAEMON n'est pas prise en charge sur Fargate, et le démon X-Ray ne reçoit pas de données OTLP." }
    c: { en: "Fargate hosts are managed by AWS and are not reachable through Systems Manager, so nothing can be installed on them.", fr: "Les hôtes Fargate sont gérés par AWS et ne sont pas accessibles via Systems Manager : rien ne peut y être installé." }
    d: { en: "Container Insights collects infrastructure metrics and logs of the tasks; it does not receive the OTLP traces and application metrics that the SDK exports.", fr: "Container Insights collecte les métriques d'infrastructure et les journaux des tâches ; il ne reçoit pas les traces OTLP et les métriques applicatives exportées par le SDK." }
references:
  - title: Migrating from X-Ray instrumentation to OpenTelemetry instrumentation
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-sdk-migration.html
