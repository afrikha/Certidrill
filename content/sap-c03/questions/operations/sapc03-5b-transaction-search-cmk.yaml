id: sapc03-5b-transaction-search-cmk
objective: "5.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank's security policy requires that all trace data stored in AWS be encrypted with a customer managed AWS KMS key that the workload account itself controls. The applications in the bank's payments account send OpenTelemetry spans to AWS X-Ray in eu-west-1. The bank wants to enable CloudWatch Transaction Search in that account, so that all spans are stored and searchable, with the default 1% of spans indexed as trace summaries. Auditors will check the encryption setting of every log group in the account, and the bank does not want to copy the spans to any other storage.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    La politique de sécurité d'une banque exige que toutes les données de trace stockées dans AWS soient chiffrées avec une clé AWS KMS gérée par le client que contrôle le compte de charge de travail lui-même. Les applications du compte de paiements de la banque envoient des spans OpenTelemetry à AWS X-Ray dans eu-west-1. La banque veut activer CloudWatch Transaction Search dans ce compte, afin que tous les spans soient stockés et consultables, avec l'indexation par défaut de 1 % des spans comme résumés de trace. Les auditeurs vérifieront le paramètre de chiffrement de chaque groupe de journaux du compte, et la banque ne veut copier les spans vers aucun autre stockage.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a CloudWatch Logs resource policy that allows the X-Ray service principal to call logs:PutLogEvents on the aws/spans log group.", fr: "Ajouter une politique de ressources CloudWatch Logs qui autorise le principal de service X-Ray à appeler logs:PutLogEvents sur le groupe de journaux aws/spans." } }
    - { id: b, text: { en: "Create the customer managed key in the bank's central security account, and reference its ARN when the trace segment destination is updated.", fr: "Créer la clé gérée par le client dans le compte de sécurité central de la banque, et référencer son ARN lors de la mise à jour de la destination des segments de trace." } }
    - { id: c, text: { en: "Update the trace segment destination to CloudWatch Logs, and specify a symmetric customer managed key of the payments account in eu-west-1 for the spans log group.", fr: "Mettre à jour la destination des segments de trace vers CloudWatch Logs, et indiquer pour le groupe de journaux des spans une clé symétrique gérée par le client du compte de paiements dans eu-west-1." } }
    - { id: d, text: { en: "Set the X-Ray indexing rule to 100%, so that every span is encrypted with the customer managed key when it becomes a trace summary.", fr: "Définir la règle d'indexation X-Ray sur 100 %, afin que chaque span soit chiffré avec la clé gérée par le client quand il devient un résumé de trace." } }
    - { id: e, text: { en: "Create a subscription filter on the aws/spans log group that sends the spans to an Amazon S3 bucket encrypted with the customer managed key.", fr: "Créer sur le groupe de journaux aws/spans un filtre d'abonnement qui envoie les spans vers un compartiment Amazon S3 chiffré avec la clé gérée par le client." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Enabling Transaction Search through the API starts with a CloudWatch Logs resource policy that lets xray.amazonaws.com write to the aws/spans log group, then sets the trace segment destination to CloudWatch Logs. The aws/spans log group is encrypted by default, and a customer managed key can be given at that step, but it must be a symmetric key in the same account and Region, specified by ARN."
    fr: "L'activation de Transaction Search par l'API commence par une politique de ressources CloudWatch Logs qui permet à xray.amazonaws.com d'écrire dans le groupe de journaux aws/spans, puis définit la destination des segments de trace sur CloudWatch Logs. Le groupe de journaux aws/spans est chiffré par défaut, et une clé gérée par le client peut être indiquée à cette étape, mais ce doit être une clé symétrique du même compte et de la même Région, désignée par son ARN."
  options:
    b: { en: "The key for the spans log group must be in the same account and Region, and the policy requires a key that the workload account controls.", fr: "La clé du groupe de journaux des spans doit se trouver dans le même compte et la même Région, et la politique exige une clé contrôlée par le compte de charge de travail." }
    d: { en: "The indexing percentage controls how many spans become trace summaries, not how spans are encrypted, and the requirement keeps the default 1%.", fr: "Le pourcentage d'indexation contrôle combien de spans deviennent des résumés de trace, pas leur chiffrement, et l'exigence conserve le 1 % par défaut." }
    e: { en: "A copy in Amazon S3 does not change the encryption of the spans stored in the aws/spans log group, which would still use the default key.", fr: "Une copie dans Amazon S3 ne change pas le chiffrement des spans stockés dans le groupe de journaux aws/spans, qui utiliseraient toujours la clé par défaut." }
references:
  - title: Enable transaction search
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Enable-TransactionSearch.html
