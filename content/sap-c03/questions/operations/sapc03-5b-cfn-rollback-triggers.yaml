id: sapc03-5b-cfn-rollback-triggers
objective: "5.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany manages the Application Load Balancer listener rules, the AWS WAF web ACL, and the Auto Scaling settings of a web application in one AWS CloudFormation stack. Last month, a stack update that changed a listener rule completed successfully, but it sent part of the traffic to an empty target group. HTTP 5xx errors rose for 40 minutes before an engineer reverted the template. A composite CloudWatch alarm already tracks the application's 5xx rate and latency. The company wants CloudFormation to roll back the whole stack update automatically if this alarm goes to ALARM during the update or within 30 minutes after it, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gère les règles d'écouteur de l'Application Load Balancer, l'ACL web AWS WAF et les paramètres Auto Scaling d'une application web dans une seule pile AWS CloudFormation. Le mois dernier, une mise à jour de pile qui modifiait une règle d'écouteur s'est terminée avec succès, mais elle a envoyé une partie du trafic vers un groupe cible vide. Les erreurs HTTP 5xx ont augmenté pendant 40 minutes avant qu'un ingénieur ne rétablisse le modèle. Une alarme CloudWatch composite surveille déjà le taux de 5xx et la latence de l'application. L'entreprise veut que CloudFormation restaure automatiquement toute la mise à jour de pile si cette alarme passe à l'état ALARM pendant la mise à jour ou dans les 30 minutes qui suivent, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Apply a stack policy that denies Update actions on the listener resources, so that every change to the listener rules requires an explicit override of the policy.", fr: "Appliquer une politique de pile qui refuse les actions Update sur les ressources d'écouteur, afin que chaque modification des règles d'écouteur exige un contournement explicite de la politique." } }
    - { id: b, text: { en: "Add the composite alarm as a rollback trigger in the rollback configuration of the stack, and set the monitoring time to 30 minutes.", fr: "Ajouter l'alarme composite comme déclencheur de restauration dans la configuration de restauration de la pile, et définir la durée de surveillance sur 30 minutes." } }
    - { id: c, text: { en: "Create an Amazon EventBridge rule on the composite alarm that invokes an AWS Lambda function, which calls the CancelUpdateStack API for the stack.", fr: "Créer une règle Amazon EventBridge sur l'alarme composite qui appelle une fonction AWS Lambda, laquelle appelle l'API CancelUpdateStack pour la pile." } }
    - { id: d, text: { en: "Run drift detection on the stack every 5 minutes, and add an AWS Config rule that notifies the operations team when the listener rules drift.", fr: "Exécuter la détection de dérive sur la pile toutes les 5 minutes, et ajouter une règle AWS Config qui avertit l'équipe d'exploitation quand les règles d'écouteur dérivent." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Rollback triggers make CloudFormation monitor up to five alarms, composite alarms included, during the stack operation and for a monitoring period of up to 180 minutes after all resources are deployed. If an alarm goes to ALARM in that time, CloudFormation rolls back the entire stack operation, so a 30-minute monitoring time covers the requirement."
    fr: "Les déclencheurs de restauration font surveiller par CloudFormation jusqu'à cinq alarmes, alarmes composites comprises, pendant l'opération de pile et pendant une période de surveillance allant jusqu'à 180 minutes après le déploiement de toutes les ressources. Si une alarme passe à l'état ALARM pendant ce temps, CloudFormation restaure toute l'opération de pile : une durée de surveillance de 30 minutes couvre l'exigence."
  options:
    a: { en: "A stack policy prevents updates to resources; it does not watch an alarm and does not roll back an update that was allowed.", fr: "Une politique de pile empêche des mises à jour de ressources ; elle ne surveille aucune alarme et ne restaure pas une mise à jour autorisée." }
    c: { en: "CancelUpdateStack works only while the update is in progress; after the update completes, the call fails and nothing is rolled back, and the function is custom code to maintain.", fr: "CancelUpdateStack ne fonctionne que pendant que la mise à jour est en cours ; une fois la mise à jour terminée, l'appel échoue et rien n'est restauré, et la fonction est du code personnalisé à maintenir." }
    d: { en: "The faulty change was made through the template, so there is no drift to detect, and a notification does not roll anything back.", fr: "La modification fautive a été faite par le modèle : il n'y a aucune dérive à détecter, et une notification ne restaure rien." }
references:
  - title: Roll back your CloudFormation stack on alarm breach with rollback triggers
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-rollback-triggers.html
