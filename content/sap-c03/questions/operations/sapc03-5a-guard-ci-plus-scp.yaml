id: sapc03-5a-guard-ci-plus-scp
objective: "5.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company has 80 accounts in AWS Organizations. Amazon EFS file systems that store patient documents must be encrypted at rest, and because EFS can't encrypt an existing file system, an unencrypted file system must never be created. Application teams submit AWS CloudFormation templates through pull requests in a Git repository, and they want to see a violation in the pull request itself, before the change is merged. Some administrators in member accounts still create file systems with the AWS CLI or the console, and the control must also stop those requests. The company wants managed features and the LEAST custom code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de santé possède 80 comptes dans AWS Organizations. Les systèmes de fichiers Amazon EFS qui stockent des documents de patients doivent être chiffrés au repos, et comme EFS ne peut pas chiffrer un système de fichiers existant, aucun système de fichiers non chiffré ne doit jamais être créé. Les équipes applicatives soumettent leurs modèles AWS CloudFormation par des demandes d'extraction (pull requests) dans un référentiel Git, et elles veulent voir une infraction dans la demande d'extraction elle-même, avant la fusion de la modification. Certains administrateurs des comptes membres créent encore des systèmes de fichiers avec l'AWS CLI ou la console, et le contrôle doit aussi arrêter ces requêtes. L'entreprise veut des fonctionnalités gérées et le MOINS de code personnalisé.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Run CloudFormation Guard rules on the templates in a CodeBuild pull request build that fails when an AWS::EFS::FileSystem resource doesn't set Encrypted to true.
        fr: |-
          Exécuter des règles CloudFormation Guard sur les modèles dans une génération CodeBuild des demandes d'extraction qui échoue lorsqu'une ressource AWS::EFS::FileSystem ne définit pas Encrypted à true.
    - id: b
      text:
        en: |-
          Deploy the AWS Config managed rule for EFS encryption with automatic remediation in every account through an organization conformance pack that reports to the security account.
        fr: |-
          Déployer dans chaque compte la règle gérée AWS Config de chiffrement EFS avec correction automatique, au moyen d'un pack de conformité d'organisation qui remonte au compte de sécurité.
    - id: c
      text:
        en: |-
          Activate a CloudFormation Guard hook in FAIL mode in every account and Region to reject stacks that would create an unencrypted file system.
        fr: |-
          Activer un hook CloudFormation Guard en mode FAIL dans chaque compte et chaque Région pour rejeter les piles qui créeraient un système de fichiers non chiffré.
    - id: d
      text:
        en: |-
          Attach an SCP to the organization root that denies elasticfilesystem:CreateFileSystem when the elasticfilesystem:Encrypted condition key is false.
        fr: |-
          Attacher à la racine de l'organisation une SCP qui refuse elasticfilesystem:CreateFileSystem lorsque la clé de condition elasticfilesystem:Encrypted vaut false.
    - id: e
      text:
        en: |-
          Create an Amazon EventBridge rule on CreateFileSystem events from CloudTrail that invokes a Lambda function to delete any unencrypted file system.
        fr: |-
          Créer une règle Amazon EventBridge sur les événements CreateFileSystem de CloudTrail qui invoque une fonction Lambda chargée de supprimer tout système de fichiers non chiffré.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Guard rules run in the pull request build and fail it with the rule's message, so teams see the violation before merging. The SCP denies the CreateFileSystem call itself when encryption isn't requested, whatever the path (CLI, console, SDK, or CloudFormation), for every principal in the member accounts, so an unencrypted file system can never exist.
    fr: |-
      Les règles Guard s'exécutent dans la génération de la demande d'extraction et la font échouer avec le message de la règle : les équipes voient l'infraction avant la fusion. La SCP refuse l'appel CreateFileSystem lui-même lorsque le chiffrement n'est pas demandé, quel que soit le chemin (CLI, console, SDK ou CloudFormation), pour tous les principaux des comptes membres : un système de fichiers non chiffré ne peut donc jamais exister.
  options:
    b:
      en: |-
        A Config rule detects the file system after it has been created, and EFS can't encrypt an existing file system, so remediation can't fix it in place.
      fr: |-
        Une règle Config détecte le système de fichiers après sa création, et EFS ne peut pas chiffrer un système de fichiers existant : la correction ne peut pas le rectifier sur place.
    c:
      en: |-
        A hook acts only on CloudFormation operations at deployment time; it gives no feedback in the pull request and doesn't stop CLI or console requests.
      fr: |-
        Un hook n'agit que sur les opérations CloudFormation au moment du déploiement ; il ne donne aucun retour dans la demande d'extraction et n'arrête pas les requêtes de la CLI ou de la console.
    e:
      en: |-
        This reacts after the unencrypted file system already exists, and it is custom code that deletes resources, possibly after data was written.
      fr: |-
        Cette approche réagit après que le système de fichiers non chiffré existe déjà, et c'est du code personnalisé qui supprime des ressources, peut-être après l'écriture de données.
references:
  - title: Encrypting data at rest - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html
  - title: What is AWS CloudFormation Guard? - AWS CloudFormation Guard
    url: https://docs.aws.amazon.com/cfn-guard/latest/ug/what-is-guard.html
