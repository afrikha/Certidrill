id: sapc03-5b-account-subscription-regions
objective: "5.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security operations team runs a SIEM that consumes log events from Amazon Kinesis Data Streams in a security account. The company's 40 workload accounts run in us-east-1 and eu-west-1. Every log group in those accounts must be streamed to the SIEM in near real time, including the log groups that are created later. The log groups of the delivery pipeline itself must not be streamed, to avoid a recursive loop. The team wants no configuration step for individual log groups.

    Which solution will meet these requirements?
  fr: |
    Une équipe des opérations de sécurité exploite un SIEM qui consomme des événements de journal depuis Amazon Kinesis Data Streams dans un compte de sécurité. Les 40 comptes de charge de travail de l'entreprise s'exécutent dans us-east-1 et eu-west-1. Chaque groupe de journaux de ces comptes doit être diffusé vers le SIEM en temps quasi réel, y compris les groupes de journaux créés plus tard. Les groupes de journaux du pipeline de livraison lui-même ne doivent pas être diffusés, pour éviter une boucle récursive. L'équipe ne veut aucune étape de configuration par groupe de journaux.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch Logs destination in each of the two Regions in the security account, and deploy to every workload account and Region an account-level subscription filter policy for the local destination that excludes the pipeline log groups.", fr: "Créer une destination CloudWatch Logs dans chacune des deux Régions du compte de sécurité, et déployer dans chaque compte de charge de travail et chaque Région une politique de filtre d'abonnement au niveau du compte vers la destination locale, qui exclut les groupes de journaux du pipeline." } }
    - { id: b, text: { en: "Create one CloudWatch Logs destination in us-east-1 in the security account, and deploy to every workload account and Region an account-level subscription filter policy for that destination that excludes the pipeline log groups.", fr: "Créer une seule destination CloudWatch Logs dans us-east-1 dans le compte de sécurité, et déployer dans chaque compte de charge de travail et chaque Région une politique de filtre d'abonnement au niveau du compte vers cette destination, qui exclut les groupes de journaux du pipeline." } }
    - { id: c, text: { en: "Create a CloudWatch Logs destination in each Region in the security account, and run an AWS Lambda function on CreateLogGroup events that adds a log group subscription filter for the local destination.", fr: "Créer une destination CloudWatch Logs dans chaque Région du compte de sécurité, et exécuter sur les événements CreateLogGroup une fonction AWS Lambda qui ajoute un filtre d'abonnement de groupe de journaux vers la destination locale." } }
    - { id: d, text: { en: "Create a log centralization rule for the workload accounts with the security account as the destination, and configure the SIEM to read the centralized log groups through the CloudWatch Logs API.", fr: "Créer une règle de centralisation des journaux pour les comptes de charge de travail avec le compte de sécurité comme destination, et configurer le SIEM pour lire les groupes de journaux centralisés via l'API CloudWatch Logs." } }
answer: { optionId: a }
explanation:
  correct:
    en: "An account-level subscription filter policy covers all the log groups of an account in a Region, including new ones, and its selection criteria, with the NOT IN operator, exclude the log groups that could cause infinite recursion. A log group and its destination must be in the same Region, although the stream behind the destination can be elsewhere, so the security account needs one destination per source Region."
    fr: "Une politique de filtre d'abonnement au niveau du compte couvre tous les groupes de journaux d'un compte dans une Région, y compris les nouveaux, et ses critères de sélection, avec l'opérateur NOT IN, excluent les groupes de journaux qui pourraient provoquer une récursion infinie. Un groupe de journaux et sa destination doivent se trouver dans la même Région, même si le flux derrière la destination peut être ailleurs : le compte de sécurité a donc besoin d'une destination par Région source."
  options:
    b: { en: "The log groups in eu-west-1 cannot subscribe to a destination in us-east-1, because a destination must be in the same Region as the log groups.", fr: "Les groupes de journaux de eu-west-1 ne peuvent pas s'abonner à une destination de us-east-1, car une destination doit se trouver dans la même Région que les groupes de journaux." }
    c: { en: "A function that adds a filter to each new log group is the per-log-group configuration that the team wants to avoid, and it does not exclude the pipeline log groups.", fr: "Une fonction qui ajoute un filtre à chaque nouveau groupe de journaux est la configuration par groupe de journaux que l'équipe veut éviter, et elle n'exclut pas les groupes de journaux du pipeline." }
    d: { en: "Centralization copies logs into log groups, not into the Kinesis stream that the SIEM consumes, so the SIEM would need a new and less timely integration.", fr: "La centralisation copie les journaux dans des groupes de journaux, pas dans le flux Kinesis que consomme le SIEM : le SIEM aurait besoin d'une nouvelle intégration, moins réactive." }
references:
  - title: Account-level subscription filters
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/SubscriptionFilters-AccountLevel.html
  - title: Cross-account cross-Region account-level subscriptions using Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CrossAccountSubscriptions-Kinesis-Account.html
