id: sapc03-5a-xregion-artifact-stores
objective: "5.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline runs in eu-west-1 in a tooling account. It deploys an AWS CloudFormation stack to a workload account in eu-west-1 through a cross-account role and a CloudFormation execution role in the workload account. The company must now also deploy the stack to us-east-1 and ap-southeast-2 from the same pipeline, in a stage that runs after the eu-west-1 deployment. Artifacts must stay encrypted with customer managed KMS keys. The workload account's roles already allow deployments in all three Regions.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le pipeline AWS CodePipeline d'une entreprise s'exécute dans eu-west-1, dans un compte d'outillage. Il déploie une pile AWS CloudFormation dans un compte de charge de travail, dans eu-west-1, au moyen d'un rôle entre comptes et d'un rôle d'exécution CloudFormation du compte de charge de travail. L'entreprise doit désormais aussi déployer la pile dans us-east-1 et ap-southeast-2 depuis le même pipeline, dans une étape qui s'exécute après le déploiement dans eu-west-1. Les artefacts doivent rester chiffrés avec des clés KMS gérées par le client. Les rôles du compte de charge de travail autorisent déjà les déploiements dans les trois Régions.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add us-east-1 and ap-southeast-2 to the source action so that the source artifact is produced directly in each of the three Regions.
        fr: |-
          Ajouter us-east-1 et ap-southeast-2 à l'action source pour que l'artefact source soit produit directement dans chacune des trois Régions.
    - id: b
      text:
        en: |-
          Replace artifactStore with an artifactStores map that has an S3 bucket and a customer managed key for each Region, in the tooling account, allowed for the workload account's role.
        fr: |-
          Remplacer artifactStore par une table artifactStores qui comporte un compartiment S3 et une clé gérée par le client pour chaque Région, dans le compte d'outillage, autorisés pour le rôle du compte de charge de travail.
    - id: c
      text:
        en: |-
          Create the artifact buckets for us-east-1 and ap-southeast-2 in the workload account, so that the deploy actions read their artifacts from buckets in their own account.
        fr: |-
          Créer les compartiments d'artefacts d'us-east-1 et d'ap-southeast-2 dans le compte de charge de travail, pour que les actions de déploiement lisent leurs artefacts dans des compartiments de leur propre compte.
    - id: d
      text:
        en: |-
          Add a stage with two CloudFormation deploy actions whose region is us-east-1 and ap-southeast-2, each with the cross-account role and execution role of the workload account.
        fr: |-
          Ajouter une étape avec deux actions de déploiement CloudFormation dont la région est us-east-1 et ap-southeast-2, chacune avec le rôle entre comptes et le rôle d'exécution du compte de charge de travail.
    - id: e
      text:
        en: |-
          Configure S3 Cross-Region Replication from the eu-west-1 artifact bucket to buckets in the two Regions, and point the new deploy actions to the replicated artifacts in the tooling account.
        fr: |-
          Configurer la réplication S3 entre Régions du compartiment d'artefacts d'eu-west-1 vers des compartiments des deux Régions, et faire pointer les nouvelles actions de déploiement vers les artefacts répliqués dans le compte d'outillage.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      A cross-Region action sets a region on the action, and the pipeline needs an artifact store in each Region where actions run: an artifactStores map with a bucket and encryption key in that Region and in the pipeline's account. CodePipeline copies the input artifacts to the Regional store, and the cross-account role in the workload account must be allowed to use each Regional key and bucket.
    fr: |-
      Une action entre Régions définit une région sur l'action, et le pipeline a besoin d'un magasin d'artefacts dans chaque Région où s'exécutent des actions : une table artifactStores avec un compartiment et une clé de chiffrement dans cette Région et dans le compte du pipeline. CodePipeline copie les artefacts d'entrée dans le magasin régional, et le rôle entre comptes du compte de charge de travail doit être autorisé à utiliser chaque clé et chaque compartiment régionaux.
  options:
    a:
      en: |-
        Source actions can't be cross-Region; the source runs in the pipeline's Region and CodePipeline copies its artifact to the other Regions.
      fr: |-
        Les actions source ne peuvent pas être entre Régions ; la source s'exécute dans la Région du pipeline et CodePipeline copie son artefact vers les autres Régions.
    c:
      en: |-
        The artifact bucket and key of a cross-Region action must be in the same account as the pipeline, not in the target account.
      fr: |-
        Le compartiment et la clé d'artefacts d'une action entre Régions doivent se trouver dans le même compte que le pipeline, pas dans le compte cible.
    e:
      en: |-
        CodePipeline uses the artifact stores declared in the pipeline; replicated objects in other buckets aren't used as action inputs.
      fr: |-
        CodePipeline utilise les magasins d'artefacts déclarés dans le pipeline ; des objets répliqués dans d'autres compartiments ne servent pas d'entrées aux actions.
references:
  - title: Add a cross-region action in CodePipeline - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/actions-create-cross-region.html
