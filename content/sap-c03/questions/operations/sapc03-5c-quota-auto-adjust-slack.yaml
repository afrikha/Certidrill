id: sapc03-5c-quota-auto-adjust-slack
objective: "5.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company has 60 accounts in AWS Organizations, and its development teams regularly hit adjustable service quotas during launches, which blocks deployments until someone notices and opens an increase request. The platform team wants every supported quota in these accounts to be monitored, with notifications in the team's Slack channel when utilization crosses warning thresholds. When utilization crosses those thresholds, increase requests must be created automatically where AWS can approve them, and the team must be told when a request fails so that it can submit a manual request. The company wants the LEAST operational overhead and no custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo possède 60 comptes dans AWS Organizations, et ses équipes de développement atteignent régulièrement des quotas de service ajustables lors des lancements, ce qui bloque les déploiements jusqu'à ce que quelqu'un s'en aperçoive et ouvre une demande d'augmentation. L'équipe plateforme veut que chaque quota pris en charge de ces comptes soit surveillé, avec des notifications dans le canal Slack de l'équipe quand l'utilisation franchit des seuils d'avertissement. Quand l'utilisation franchit ces seuils, des demandes d'augmentation doivent être créées automatiquement lorsque AWS peut les approuver, et l'équipe doit être informée de l'échec d'une demande afin de soumettre une demande manuelle. L'entreprise veut le MOINS de charge opérationnelle et aucun code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on Service Quotas Automatic Management in Notify Only mode in each account, with notifications sent to the Slack channel.
        fr: |-
          Activer Service Quotas Automatic Management en mode Notify Only dans chaque compte, avec des notifications envoyées au canal Slack.
    - id: b
      text:
        en: |-
          Create a CloudWatch alarm for each quota in each account with the SERVICE_QUOTA() function, and have an AWS Lambda function call RequestServiceQuotaIncrease and post to Slack when an alarm fires.
        fr: |-
          Créer une alarme CloudWatch par quota dans chaque compte avec la fonction SERVICE_QUOTA(), et faire appeler RequestServiceQuotaIncrease et publier sur Slack par une fonction AWS Lambda quand une alarme se déclenche.
    - id: c
      text:
        en: |-
          Turn on Service Quotas Automatic Management in Notify and Auto-Adjust mode in each account, with notifications sent to the Slack channel.
        fr: |-
          Activer Service Quotas Automatic Management en mode Notify and Auto-Adjust dans chaque compte, avec des notifications envoyées au canal Slack.
    - id: d
      text:
        en: |-
          Add the most frequently exhausted quotas to a Service Quotas request template with higher values, and enable template association with the organization.
        fr: |-
          Ajouter les quotas le plus souvent épuisés à un modèle de demande Service Quotas avec des valeurs plus élevées, et activer l'association du modèle avec l'organisation.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Automatic Management monitors supported quotas and notifies through email, Slack, or the console mobile app, with events also available in EventBridge. In Notify and Auto-Adjust mode, it creates increase requests when usage crosses the 80 and 95 percent thresholds for adjustable quotas that support automated approval, and it notifies the team when a request fails.
    fr: |-
      Automatic Management surveille les quotas pris en charge et notifie par e-mail, Slack ou l'application mobile de la console, avec des événements également disponibles dans EventBridge. En mode Notify and Auto-Adjust, il crée des demandes d'augmentation quand l'utilisation franchit les seuils de 80 et 95 % pour les quotas ajustables qui prennent en charge l'approbation automatisée, et il prévient l'équipe quand une demande échoue.
  options:
    a:
      en: |-
        Notify Only sends the notifications but never creates increase requests.
      fr: |-
        Notify Only envoie les notifications mais ne crée jamais de demande d'augmentation.
    b:
      en: |-
        An alarm per quota per account plus a custom function is custom code and much more to maintain than a managed feature.
      fr: |-
        Une alarme par quota et par compte plus une fonction personnalisée, c'est du code personnalisé et bien plus de maintenance qu'une fonctionnalité gérée.
    d:
      en: |-
        Request templates apply only to new accounts, cover at most 10 quotas, and don't monitor usage or notify anyone.
      fr: |-
        Les modèles de demande ne s'appliquent qu'aux nouveaux comptes, couvrent au plus 10 quotas, et ne surveillent pas l'utilisation ni ne notifient personne.
references:
  - title: "Service Quotas Automatic Management"
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/automatic-management.html
