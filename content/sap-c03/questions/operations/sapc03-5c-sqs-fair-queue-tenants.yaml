id: sapc03-5c-sqs-fair-queue-tenants
objective: "5.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A B2B SaaS provider processes document-conversion jobs for 2,000 tenants through one Amazon SQS standard queue that triggers an AWS Lambda consumer function. Last week, one tenant submitted a bulk import of 2 million jobs, and the time that other tenants' jobs spent in the queue grew from a few seconds to 40 minutes. The provider wants quiet tenants' jobs to keep a low dwell time when one tenant creates a backlog. The provider must keep one standard queue with its high throughput, must not change the consumer function's code or configuration, and can change only how producers send messages.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS B2B traite les tâches de conversion de documents de 2 000 locataires au moyen d'une seule file d'attente standard Amazon SQS qui déclenche une fonction consommatrice AWS Lambda. La semaine dernière, un locataire a soumis une importation en masse de 2 millions de tâches, et le temps passé dans la file par les tâches des autres locataires est passé de quelques secondes à 40 minutes. Le fournisseur veut que les tâches des locataires peu actifs conservent un faible temps de séjour quand un locataire crée un arriéré. Le fournisseur doit conserver une seule file standard avec son débit élevé, ne doit modifier ni le code ni la configuration de la fonction consommatrice, et peut seulement changer la façon dont les producteurs envoient les messages.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a FIFO queue with high throughput mode, and have the producers set the tenant ID as the message group ID and a deduplication ID on each message.
        fr: |-
          Créer une file d'attente FIFO avec le mode haut débit, et faire définir par les producteurs l'ID du locataire comme ID de groupe de messages ainsi qu'un ID de déduplication sur chaque message.
    - id: b
      text:
        en: |-
          Create one standard queue per tenant, and have the producers send each tenant's jobs to that tenant's own queue.
        fr: |-
          Créer une file d'attente standard par locataire, et faire envoyer par les producteurs les tâches de chaque locataire dans la file propre à ce locataire.
    - id: c
      text:
        en: |-
          Have the producers send messages of tenants that exceed a daily job count with a delay of 15 minutes.
        fr: |-
          Faire envoyer par les producteurs les messages des locataires qui dépassent un nombre quotidien de tâches avec un délai de 15 minutes.
    - id: d
      text:
        en: |-
          Have the producers set the tenant ID as the MessageGroupId of each message sent to the existing standard queue.
        fr: |-
          Faire définir par les producteurs l'ID du locataire comme MessageGroupId de chaque message envoyé dans la file standard existante.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Fair queues apply automatically to standard queues for messages that carry a MessageGroupId, which identifies the tenant: when one tenant builds a backlog, SQS prioritizes delivery for the other tenants, keeping their dwell time low. Ordering isn't enforced on a standard queue, throughput stays virtually unlimited, and consumers need no change.
    fr: |-
      Les files d'attente équitables (fair queues) s'appliquent automatiquement aux files standard pour les messages qui portent un MessageGroupId, qui identifie le locataire : quand un locataire crée un arriéré, SQS donne la priorité à la livraison pour les autres locataires, ce qui maintient leur temps de séjour bas. L'ordre n'est pas imposé sur une file standard, le débit reste pratiquement illimité, et les consommateurs n'ont besoin d'aucune modification.
  options:
    a:
      en: |-
        A FIFO queue is a new queue that the consumer would have to be reconfigured for, and it adds ordering and deduplication that the provider doesn't need instead of keeping the standard queue.
      fr: |-
        Une file FIFO est une nouvelle file pour laquelle le consommateur devrait être reconfiguré, et elle ajoute un ordre et une déduplication dont le fournisseur n'a pas besoin au lieu de conserver la file standard.
    b:
      en: |-
        Per-tenant queues break the one-queue requirement and need 2,000 event source mappings, which changes the consumer's configuration.
      fr: |-
        Des files par locataire enfreignent l'exigence d'une seule file et nécessitent 2 000 mappages de source d'événements, ce qui modifie la configuration du consommateur.
    c:
      en: |-
        A fixed delay postpones the large tenant's jobs only for 15 minutes; a 2-million-job backlog still blocks quiet tenants once the delayed messages become visible.
      fr: |-
        Un délai fixe ne repousse les tâches du gros locataire que de 15 minutes ; un arriéré de 2 millions de tâches bloque toujours les locataires peu actifs une fois les messages différés devenus visibles.
references:
  - title: "Amazon SQS fair queues"
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fair-queues.html
