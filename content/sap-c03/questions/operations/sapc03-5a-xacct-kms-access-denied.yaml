id: sapc03-5a-xacct-kms-access-denied
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS CodePipeline pipeline in a tooling account deploys an AWS CloudFormation stack to a production account through a cross-account role in the production account. The pipeline's artifact bucket uses the default encryption that CodePipeline configured when the pipeline was created. The bucket policy already allows the production role to read and write the artifacts. The deploy action fails with an access denied error when it reads its input artifact. The company wants to fix the pipeline with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le pipeline AWS CodePipeline d'une entreprise, dans un compte d'outillage, déploie une pile AWS CloudFormation dans un compte de production au moyen d'un rôle entre comptes du compte de production. Le compartiment d'artefacts du pipeline utilise le chiffrement par défaut que CodePipeline a configuré à la création du pipeline. La politique de compartiment autorise déjà le rôle de production à lire et écrire les artefacts. L'action de déploiement échoue avec une erreur d'accès refusé lorsqu'elle lit son artefact d'entrée. L'entreprise veut corriger le pipeline avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a customer managed KMS key in the pipeline's account and Region, allow the production role in its key policy, and use it as the artifact store's encryption key.
        fr: |-
          Créer une clé KMS gérée par le client dans le compte et la Région du pipeline, autoriser le rôle de production dans sa politique de clé, et l'utiliser comme clé de chiffrement du magasin d'artefacts.
    - id: b
      text:
        en: |-
          Grant s3:GetObject to the production role again in the artifact bucket policy, and set S3 Object Ownership on the bucket to bucket owner enforced so that ACLs no longer affect access.
        fr: |-
          Accorder de nouveau s3:GetObject au rôle de production dans la politique du compartiment d'artefacts, et définir S3 Object Ownership du compartiment sur bucket owner enforced pour que les ACL n'affectent plus l'accès.
    - id: c
      text:
        en: |-
          Configure S3 replication from the artifact bucket to a bucket in the production account, and point the deploy action to the replicated artifacts in the production account's own bucket.
        fr: |-
          Configurer la réplication S3 du compartiment d'artefacts vers un compartiment du compte de production, et faire pointer l'action de déploiement vers les artefacts répliqués dans le compartiment du compte de production.
    - id: d
      text:
        en: |-
          Add the production account to the key policy of the AWS managed key aws/s3 that encrypts the artifacts in the tooling account.
        fr: |-
          Ajouter le compte de production à la politique de clé de la clé gérée par AWS aws/s3 qui chiffre les artefacts dans le compte d'outillage.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      By default, artifacts are encrypted with an AWS managed key, whose policy can't grant access to another account, so the production role can read the object but can't decrypt it. A customer managed key in the pipeline's account and Region, whose key policy allows the production role, set as the artifact store's encryption key, fixes the access; the pipeline change is made with the CLI, SDK, or CloudFormation.
    fr: |-
      Par défaut, les artefacts sont chiffrés avec une clé gérée par AWS, dont la politique ne peut pas accorder l'accès à un autre compte : le rôle de production peut lire l'objet mais pas le déchiffrer. Une clé gérée par le client dans le compte et la Région du pipeline, dont la politique de clé autorise le rôle de production, définie comme clé de chiffrement du magasin d'artefacts, corrige l'accès ; la modification du pipeline se fait avec la CLI, le SDK ou CloudFormation.
  options:
    b:
      en: |-
        The bucket policy already grants access; the failure comes from decrypting the objects, which no S3 setting changes.
      fr: |-
        La politique de compartiment accorde déjà l'accès ; l'échec vient du déchiffrement des objets, qu'aucun paramètre S3 ne modifie.
    c:
      en: |-
        CodePipeline passes artifacts from its own artifact store; replication adds a bucket and delay without changing what the action reads.
      fr: |-
        CodePipeline transmet les artefacts depuis son propre magasin d'artefacts ; la réplication ajoute un compartiment et du délai sans changer ce que lit l'action.
    d:
      en: |-
        The policy of an AWS managed key can't be edited, so it can't be shared with another account.
      fr: |-
        La politique d'une clé gérée par AWS n'est pas modifiable : elle ne peut pas être partagée avec un autre compte.
references:
  - title: Create a pipeline in CodePipeline that uses resources from another AWS account - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/pipelines-create-cross-account.html
