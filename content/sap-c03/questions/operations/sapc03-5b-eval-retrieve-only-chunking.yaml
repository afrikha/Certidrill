id: sapc03-5b-eval-retrieve-only-chunking
objective: "5.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare software company runs a patient-support chatbot in its AI platform account. The chatbot retrieves passages from an Amazon Bedrock knowledge base and sends them to a generator model that the company will not change this year. The data team has built a second knowledge base on the same documents with hierarchical chunking, and it wants to know whether this knowledge base retrieves better passages than the current one, which uses fixed-size chunking. Clinical writers have produced 900 questions, each with the passages that a correct answer must rely on as ground truth. The comparison must isolate retrieval quality from the behavior of the generator model, and it must be the MOST cost-effective option.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels de santé exécute un chatbot d'assistance aux patients dans son compte de plateforme d'IA. Le chatbot récupère des passages dans une base de connaissances Amazon Bedrock et les envoie à un modèle générateur que l'entreprise ne changera pas cette année. L'équipe data a construit une seconde base de connaissances sur les mêmes documents avec un découpage hiérarchique, et elle veut savoir si cette base récupère de meilleurs passages que la base actuelle, qui utilise un découpage de taille fixe. Des rédacteurs cliniques ont produit 900 questions, chacune avec les passages sur lesquels une réponse correcte doit s'appuyer, comme vérité de terrain (ground truth). La comparaison doit isoler la qualité de la récupération du comportement du modèle générateur, et elle doit être l'option la PLUS rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run a retrieve-and-generate RAG evaluation job for each knowledge base with the 900 questions and their ground truth, and compare the correctness and completeness scores of the answers.", fr: "Exécuter une tâche d'évaluation RAG de type récupération et génération pour chaque base de connaissances avec les 900 questions et leur vérité de terrain, et comparer les scores d'exactitude et d'exhaustivité des réponses." } }
    - { id: b, text: { en: "Run a retrieve-only RAG evaluation job for each knowledge base with the 900 questions and their ground truth, and compare the context relevance and context coverage scores.", fr: "Exécuter une tâche d'évaluation RAG de type récupération seule (retrieve-only) pour chaque base de connaissances avec les 900 questions et leur vérité de terrain, et comparer les scores de pertinence et de couverture du contexte." } }
    - { id: c, text: { en: "Run a judge-based model evaluation job on the generator model with the 900 questions twice, once with the passages of each knowledge base pasted into the prompts.", fr: "Exécuter deux fois une tâche d'évaluation de modèle avec modèle juge sur le modèle générateur avec les 900 questions, en collant à chaque fois dans les invites les passages de l'une des bases de connaissances." } }
    - { id: d, text: { en: "Split production traffic between the two knowledge bases for two weeks, and compare the InvocationLatency and OutputTokenCount metrics of the generator model in Amazon CloudWatch.", fr: "Répartir le trafic de production entre les deux bases de connaissances pendant deux semaines, et comparer les métriques InvocationLatency et OutputTokenCount du modèle générateur dans Amazon CloudWatch." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A retrieve-only RAG evaluation job scores only the passages that the knowledge base returns, so the generator model plays no part in the result and is not invoked. Context relevance measures how relevant the retrieved texts are to each question, and context coverage, which requires the ground truth in the prompt dataset, measures how much of that ground truth the retrieved texts cover."
    fr: "Une tâche d'évaluation RAG de type récupération seule note uniquement les passages renvoyés par la base de connaissances : le modèle générateur ne joue aucun rôle dans le résultat et n'est pas appelé. La pertinence du contexte mesure la pertinence des textes récupérés pour chaque question, et la couverture du contexte, qui exige la vérité de terrain dans le jeu de données d'invites, mesure quelle part de cette vérité de terrain les textes récupérés couvrent."
  options:
    a: { en: "Scores of generated answers mix retrieval quality with the generator's behavior, and generating 1,800 answers adds inference and judge costs that a retrieval comparison does not need.", fr: "Les scores des réponses générées mélangent la qualité de récupération et le comportement du générateur, et générer 1 800 réponses ajoute des coûts d'inférence et de jugement inutiles pour comparer la récupération." }
    c: { en: "This scores the generator's answers rather than the retrieval, and pasting passages by hand rebuilds what a RAG evaluation job does natively.", fr: "Cette option note les réponses du générateur et non la récupération, et coller les passages à la main reconstruit ce qu'une tâche d'évaluation RAG fait nativement." }
    d: { en: "Latency and token counts do not measure whether the right passages are retrieved, and the test exposes patients to the unvalidated knowledge base.", fr: "La latence et le nombre de jetons ne mesurent pas si les bons passages sont récupérés, et le test expose les patients à une base de connaissances non validée." }
references:
  - title: Evaluate the performance of RAG sources using Amazon Bedrock evaluations
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/evaluation-kb.html
  - title: Use metrics to understand RAG system performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-evaluation-metrics.html
