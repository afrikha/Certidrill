id: sapc03-5a-cdk-aspect-mutate
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's 25 development teams build infrastructure with AWS CDK in Python, and every app imports a shared internal library that the platform team maintains. The governance standard requires a CostCenter tag, taken from the app's context, on every taggable resource, and versioning on every Amazon S3 bucket. Teams often forget both settings. The platform team wants missing tags to be added automatically. It also wants a bucket without versioning to stop the developer's local cdk synth with a clear error, before any template reaches a pipeline. The team wants one mechanism inside the CDK apps rather than a separate tool.

    Which solution will meet these requirements?
  fr: |
    Les 25 équipes de développement d'une entreprise créent leur infrastructure avec AWS CDK en Python, et chaque application importe une bibliothèque interne partagée que maintient l'équipe plateforme. La norme de gouvernance exige une étiquette CostCenter, issue du contexte de l'application, sur chaque ressource qui accepte des étiquettes, ainsi que la gestion des versions sur chaque compartiment Amazon S3. Les équipes oublient souvent ces deux paramètres. L'équipe plateforme veut que les étiquettes manquantes soient ajoutées automatiquement. Elle veut aussi qu'un compartiment sans gestion des versions arrête le cdk synth local du développeur avec une erreur claire, avant qu'un modèle n'atteigne un pipeline. L'équipe veut un mécanisme unique, intégré aux applications CDK, plutôt qu'un outil séparé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Publish a CloudFormation Lambda hook in each account that adds the CostCenter tag to resources and rejects buckets without versioning when the stacks are deployed.
        fr: |-
          Publier dans chaque compte un hook Lambda CloudFormation qui ajoute l'étiquette CostCenter aux ressources et rejette les compartiments sans gestion des versions lors du déploiement des piles.
    - id: b
      text:
        en: |-
          Run CloudFormation Guard in the CI pipeline against the synthesized templates to add the missing tags and to fail the templates that contain buckets without versioning, before any stack is deployed.
        fr: |-
          Exécuter CloudFormation Guard dans le pipeline CI sur les modèles synthétisés pour ajouter les étiquettes manquantes et faire échouer les modèles qui contiennent des compartiments sans gestion des versions, avant le déploiement de toute pile.
    - id: c
      text:
        en: |-
          Add to the shared library a tagging aspect and a validation aspect that adds an error annotation to any bucket without versioning, and apply both with Aspects.of(app).add() in each app.
        fr: |-
          Ajouter à la bibliothèque partagée un aspect d'étiquetage et un aspect de validation qui ajoute une annotation d'erreur à tout compartiment sans gestion des versions, et appliquer les deux avec Aspects.of(app).add() dans chaque application.
    - id: d
      text:
        en: |-
          Create AWS Config rules with automatic remediation that add the CostCenter tag and turn on versioning for the buckets after each deployment in every account.
        fr: |-
          Créer des règles AWS Config avec correction automatique qui ajoutent l'étiquette CostCenter et activent la gestion des versions des compartiments après chaque déploiement, dans chaque compte.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Aspects visit every construct of a scope during the prepare phase of synthesis: one aspect can mutate constructs, such as adding tags, and another can validate them. An error added with Annotations.of(node).addError() makes cdk synth fail, so the developer sees the message locally and no cloud assembly can be deployed. Shipping the aspects in the shared library keeps the control inside the CDK apps.
    fr: |-
      Les aspects visitent chaque construction d'une étendue pendant la phase de préparation de la synthèse : un aspect peut modifier les constructions, par exemple ajouter des étiquettes, et un autre peut les valider. Une erreur ajoutée avec Annotations.of(node).addError() fait échouer cdk synth : le développeur voit le message en local et aucun assemblage cloud ne peut être déployé. Livrer les aspects dans la bibliothèque partagée garde le contrôle à l'intérieur des applications CDK.
  options:
    a:
      en: |-
        A hook runs at deployment time, not during local synthesis, and it validates resources; it doesn't add tags to them.
      fr: |-
        Un hook s'exécute au moment du déploiement, pas pendant la synthèse locale, et il valide les ressources sans leur ajouter d'étiquettes.
    b:
      en: |-
        Guard only evaluates rules and reports pass or fail; it can't modify templates to add tags, and it is a separate tool outside the CDK app.
      fr: |-
        Guard évalue seulement des règles et indique la réussite ou l'échec ; il ne peut pas modifier les modèles pour ajouter des étiquettes, et c'est un outil séparé, extérieur à l'application CDK.
    d:
      en: |-
        Config remediation fixes resources after deployment, which creates drift from the templates and gives developers no error during synthesis.
      fr: |-
        La correction AWS Config modifie les ressources après le déploiement, ce qui crée une dérive par rapport aux modèles et ne donne aucune erreur aux développeurs pendant la synthèse.
references:
  - title: Aspects and the AWS CDK - AWS Cloud Development Kit (AWS CDK) v2
    url: https://docs.aws.amazon.com/cdk/v2/guide/aspects.html
