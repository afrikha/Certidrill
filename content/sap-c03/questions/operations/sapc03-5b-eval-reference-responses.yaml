id: sapc03-5b-eval-reference-responses
objective: "5.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's HR department uses a foundation model in Amazon Bedrock to answer employee questions about benefits. Subject matter experts have written an approved answer for each of 250 typical questions, and many of the questions ask about several benefits at once. The HR team wants an automated evaluation that scores how accurate each model answer is compared with the approved answer, and whether every part of each multi-part question is answered. The evaluation must score the answers that the Bedrock model generates during the evaluation job.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Le service RH d'AnyCompany utilise un modèle de fondation dans Amazon Bedrock pour répondre aux questions des employés sur leurs avantages sociaux. Des experts métier ont rédigé une réponse approuvée pour chacune des 250 questions courantes, et beaucoup de questions portent sur plusieurs avantages à la fois. L'équipe RH veut une évaluation automatisée qui note l'exactitude de chaque réponse du modèle par rapport à la réponse approuvée, et si chaque partie de chaque question à plusieurs volets reçoit une réponse. L'évaluation doit noter les réponses que le modèle Bedrock génère pendant la tâche d'évaluation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a retrieve-only RAG evaluation job and select the context coverage metric, with the approved answers as the ground truth texts.", fr: "Créer une tâche d'évaluation RAG de type récupération seule et sélectionner la métrique de couverture du contexte, avec les réponses approuvées comme textes de vérité de terrain." } }
    - { id: b, text: { en: "Store the 250 questions in a JSON Lines prompt dataset in Amazon S3, with each approved answer in the referenceResponse field of its line.", fr: "Stocker les 250 questions dans un jeu de données d'invites JSON Lines dans Amazon S3, avec chaque réponse approuvée dans le champ referenceResponse de sa ligne." } }
    - { id: c, text: { en: "Store the 250 questions in a JSON Lines prompt dataset in Amazon S3, with each approved answer in the modelResponses field of its line.", fr: "Stocker les 250 questions dans un jeu de données d'invites JSON Lines dans Amazon S3, avec chaque réponse approuvée dans le champ modelResponses de sa ligne." } }
    - { id: d, text: { en: "Create a programmatic evaluation job with the question and answer task type and the built-in BoolQ dataset, and select the accuracy metric.", fr: "Créer une tâche d'évaluation programmatique avec le type de tâche questions-réponses et le jeu de données intégré BoolQ, et sélectionner la métrique d'exactitude." } }
    - { id: e, text: { en: "Create a judge-based evaluation job on the Bedrock model, and select the built-in correctness and completeness metrics.", fr: "Créer une tâche d'évaluation avec modèle juge sur le modèle Bedrock, et sélectionner les métriques intégrées d'exactitude (correctness) et d'exhaustivité (completeness)." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "In a judge-based job, the optional referenceResponse field carries the ground truth, and Amazon Bedrock uses it when it calculates the correctness and completeness metrics. Completeness measures how well a response answers every question in the prompt, which covers the multi-part questions, and Bedrock invokes the model to generate the answers that are scored."
    fr: "Dans une tâche avec modèle juge, le champ facultatif referenceResponse porte la vérité de terrain, et Amazon Bedrock l'utilise pour calculer les métriques d'exactitude et d'exhaustivité. L'exhaustivité mesure dans quelle mesure une réponse traite chaque question de l'invite, ce qui couvre les questions à plusieurs volets, et Bedrock appelle le modèle pour générer les réponses notées."
  options:
    a: { en: "RAG evaluation jobs score a knowledge base or an external RAG source; there is no retrieval step here, and context coverage measures retrieved texts, not model answers.", fr: "Les tâches d'évaluation RAG notent une base de connaissances ou une source RAG externe ; il n'y a pas d'étape de récupération ici, et la couverture du contexte mesure des textes récupérés, pas des réponses du modèle." }
    c: { en: "modelResponses is for bringing your own inference responses: Bedrock would skip the model and score the approved answers themselves.", fr: "modelResponses sert à fournir vos propres réponses d'inférence : Bedrock sauterait le modèle et noterait les réponses approuvées elles-mêmes." }
    d: { en: "The built-in BoolQ dataset contains generic questions, not the 250 HR questions and their approved answers, and accuracy does not measure completeness.", fr: "Le jeu de données intégré BoolQ contient des questions génériques, pas les 250 questions RH et leurs réponses approuvées, et l'exactitude ne mesure pas l'exhaustivité." }
references:
  - title: Create a prompt dataset for a model evaluation job that uses a model as judge
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-prompt-datasets-judge.html
  - title: Use metrics to understand model performance
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-evaluation-metrics.html
