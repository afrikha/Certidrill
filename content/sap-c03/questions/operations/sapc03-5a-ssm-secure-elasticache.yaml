id: sapc03-5a-ssm-secure-elasticache
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company deploys an Amazon ElastiCache (Redis OSS) replication group with AWS CloudFormation, with in-transit encryption and an AUTH token. The security team created the token as a Parameter Store SecureString parameter named /cache/orders/auth-token in the same account. It changes the token twice a year by creating a new parameter version, and it doesn't want to pay for AWS Secrets Manager for this value. The token must not appear in the template, in parameter files, or in the response of any CloudFormation API call. Each token change must be applied through a reviewed stack update.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie un groupe de réplication Amazon ElastiCache (Redis OSS) avec AWS CloudFormation, avec le chiffrement en transit et un jeton AUTH. L'équipe de sécurité a créé le jeton sous forme de paramètre SecureString de Parameter Store nommé /cache/orders/auth-token, dans le même compte. Elle change le jeton deux fois par an en créant une nouvelle version du paramètre, et ne veut pas payer AWS Secrets Manager pour cette valeur. Le jeton ne doit apparaître ni dans le modèle, ni dans les fichiers de paramètres, ni dans la réponse d'un appel d'API CloudFormation. Chaque changement de jeton doit être appliqué par une mise à jour de pile examinée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Reference the token with {{resolve:ssm:/cache/orders/auth-token}} in the AuthToken property, so that CloudFormation decrypts the latest version at each stack update.
        fr: |-
          Référencer le jeton avec {{resolve:ssm:/cache/orders/auth-token}} dans la propriété AuthToken, pour que CloudFormation déchiffre la dernière version à chaque mise à jour de pile.
    - id: b
      text:
        en: |-
          Reference the token with {{resolve:ssm-secure:/cache/orders/auth-token:4}} in the AuthToken property, and raise the version number in the template when a new version is created.
        fr: |-
          Référencer le jeton avec {{resolve:ssm-secure:/cache/orders/auth-token:4}} dans la propriété AuthToken, et augmenter le numéro de version dans le modèle lorsqu'une nouvelle version est créée.
    - id: c
      text:
        en: |-
          Declare a template parameter of type AWS::SSM::Parameter::Value<String> whose default value is the parameter name, and pass the parameter to the AuthToken property of the replication group.
        fr: |-
          Déclarer un paramètre de modèle de type AWS::SSM::Parameter::Value<String> dont la valeur par défaut est le nom du paramètre, et transmettre ce paramètre à la propriété AuthToken du groupe de réplication.
    - id: d
      text:
        en: |-
          Create the token in the same template with an AWS::SSM::Parameter resource of type SecureString, and pass its value to the AuthToken property with Fn::GetAtt.
        fr: |-
          Créer le jeton dans le même modèle avec une ressource AWS::SSM::Parameter de type SecureString, et transmettre sa valeur à la propriété AuthToken avec Fn::GetAtt.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      ElastiCache AuthToken is one of the properties that accept ssm-secure dynamic references. CloudFormation stores only the literal reference, never the decrypted value, and no API returns it. Change sets compare the literal string, so pinning a version and raising it in the template makes each token change visible in a reviewed change set.
    fr: |-
      La propriété AuthToken d'ElastiCache fait partie des propriétés qui acceptent les références dynamiques ssm-secure. CloudFormation ne stocke que la référence littérale, jamais la valeur déchiffrée, et aucune API ne la renvoie. Les jeux de modifications comparent la chaîne littérale : épingler une version et l'augmenter dans le modèle rend chaque changement de jeton visible dans un jeu de modifications examiné.
  options:
    a:
      en: |-
        The ssm dynamic reference reads plaintext String parameters only; SecureString values require the ssm-secure form.
      fr: |-
        La référence dynamique ssm ne lit que des paramètres String en clair ; les valeurs SecureString exigent la forme ssm-secure.
    c:
      en: |-
        CloudFormation doesn't support SecureString parameters as SSM parameter types, and a resolved parameter value is returned by DescribeStacks.
      fr: |-
        CloudFormation ne prend pas en charge les paramètres SecureString comme types de paramètres SSM, et la valeur résolue d'un paramètre est renvoyée par DescribeStacks.
    d:
      en: |-
        CloudFormation can't create SecureString parameters, and the token would have to be written in the template to create it.
      fr: |-
        CloudFormation ne peut pas créer de paramètres SecureString, et il faudrait écrire le jeton dans le modèle pour le créer.
references:
  - title: Get a secure string value from Systems Manager Parameter Store - AWS CloudFormation
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/dynamic-references-ssm-secure-strings.html
