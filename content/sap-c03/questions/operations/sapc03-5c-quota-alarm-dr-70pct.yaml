id: sapc03-5c-quota-alarm-dr-70pct
objective: "5.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs a warm standby environment for its trading platform in us-west-2, in 12 workload accounts. During a failover, each account must scale its Auto Scaling groups to several times their standby size, so the platform team regularly raises the Running On-Demand Standard instances vCPU quota in us-west-2 as production grows. The team must be notified through an Amazon SNS topic as soon as vCPU usage in us-west-2 reaches 70 percent of the applied quota in any account, so that it can request an increase before a failover would fail. Quota increases must not require the team to edit any alarm. The company wants a managed solution.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers exploite dans us-west-2 un environnement de secours en mode warm standby pour sa plateforme de trading, dans 12 comptes de charge de travail. Lors d'un basculement, chaque compte doit faire passer ses groupes Auto Scaling à plusieurs fois leur taille de veille : l'équipe plateforme relève donc régulièrement le quota de vCPU des instances Running On-Demand Standard dans us-west-2 à mesure que la production croît. L'équipe doit être prévenue via une rubrique Amazon SNS dès que l'utilisation de vCPU dans us-west-2 atteint 70 % du quota appliqué dans n'importe quel compte, afin de demander une augmentation avant qu'un basculement n'échoue. Les augmentations de quota ne doivent obliger l'équipe à modifier aucune alarme. L'entreprise veut une solution gérée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          In each account, create a CloudWatch alarm in us-west-2 on the AWS/Usage vCPU ResourceCount metric with the metric math expression 100 * usage / SERVICE_QUOTA(usage) and a threshold of 70, which notifies the SNS topic.
        fr: |-
          Dans chaque compte, créer dans us-west-2 une alarme CloudWatch sur la métrique AWS/Usage ResourceCount des vCPU avec l'expression mathématique 100 * usage / SERVICE_QUOTA(usage) et un seuil de 70, qui notifie la rubrique SNS.
    - id: b
      text:
        en: |-
          In each account, turn on Service Quotas Automatic Management in Notify Only mode for us-west-2, and subscribe the SNS topic to the resulting notifications.
        fr: |-
          Dans chaque compte, activer Service Quotas Automatic Management en mode Notify Only pour us-west-2, et abonner la rubrique SNS aux notifications obtenues.
    - id: c
      text:
        en: |-
          In each account, create a CloudWatch alarm in us-west-2 on the AWS/Usage vCPU ResourceCount metric with a static threshold equal to 70 percent of the current quota, which notifies the SNS topic.
        fr: |-
          Dans chaque compte, créer dans us-west-2 une alarme CloudWatch sur la métrique AWS/Usage ResourceCount des vCPU avec un seuil statique égal à 70 % du quota actuel, qui notifie la rubrique SNS.
    - id: d
      text:
        en: |-
          Add the vCPU quota to a Service Quotas request template with a value sized for failover, and enable template association with the organization.
        fr: |-
          Ajouter le quota de vCPU à un modèle de demande Service Quotas avec une valeur dimensionnée pour le basculement, et activer l'association du modèle avec l'organisation.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The SERVICE_QUOTA() metric math function returns the applied quota for a usage metric, so the expression always computes usage as a percentage of the current quota, and the alarm keeps working after each increase without edits. Any threshold can be chosen, here 70 percent, and the alarm notifies the SNS topic.
    fr: |-
      La fonction mathématique SERVICE_QUOTA() renvoie le quota appliqué pour une métrique d'utilisation : l'expression calcule toujours l'utilisation en pourcentage du quota actuel, et l'alarme continue de fonctionner après chaque augmentation sans modification. N'importe quel seuil peut être choisi, ici 70 %, et l'alarme notifie la rubrique SNS.
  options:
    b:
      en: |-
        Automatic Management notifies at fixed thresholds of 80 and 95 percent, so it can't warn at 70 percent.
      fr: |-
        Automatic Management notifie à des seuils fixes de 80 et 95 % : il ne peut pas avertir à 70 %.
    c:
      en: |-
        A static threshold computed from today's quota becomes wrong after every quota increase, so the team would have to edit the alarm each time.
      fr: |-
        Un seuil statique calculé à partir du quota actuel devient faux après chaque augmentation de quota : l'équipe devrait modifier l'alarme à chaque fois.
    d:
      en: |-
        Request templates apply only to accounts created after the template is associated, so they don't change the 12 existing accounts, and they don't send any usage notification.
      fr: |-
        Les modèles de demande ne s'appliquent qu'aux comptes créés après l'association du modèle : ils ne modifient pas les 12 comptes existants et n'envoient aucune notification d'utilisation.
references:
  - title: "Service Quotas Automatic Management"
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/automatic-management.html
  - title: "Using Service Quotas request templates"
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/organization-templates.html
