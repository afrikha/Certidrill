id: sapc03-5c-ecs-backlog-metric-math
objective: "5.4.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank runs a statement-generation worker as an Amazon ECS service on AWS Fargate that consumes an Amazon SQS standard queue, with CloudWatch Container Insights turned on for the cluster. Each task processes about 4 messages per second, and a message must not wait more than 90 seconds in the queue. The current target tracking policy uses ApproximateNumberOfMessagesVisible with a target value of 360, so the service adds tasks far beyond the need while a large backlog drains. In addition, a partner uploads a nightly file at 01:00 that creates about 500,000 messages within minutes, and the service must already be running at least 40 tasks when the file arrives. The company wants native scaling features and no custom metric code.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une banque exploite un worker de génération de relevés sous forme de service Amazon ECS sur AWS Fargate qui consomme une file d'attente standard Amazon SQS, avec CloudWatch Container Insights activé pour le cluster. Chaque tâche traite environ 4 messages par seconde, et un message ne doit pas attendre plus de 90 secondes dans la file. La politique de suivi de cible actuelle utilise ApproximateNumberOfMessagesVisible avec une valeur cible de 360 : le service ajoute donc des tâches bien au-delà du besoin pendant la résorption d'un arriéré important. De plus, un partenaire dépose chaque nuit à 01:00 un fichier qui crée environ 500 000 messages en quelques minutes, et le service doit déjà exécuter au moins 40 tâches à l'arrivée du fichier. L'entreprise veut des fonctionnalités de mise à l'échelle natives et aucun code de métrique personnalisée.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Replace the target tracking metric with a metric math expression that divides ApproximateNumberOfMessagesVisible by the service's RunningTaskCount from Container Insights, with a target value of 360.
        fr: |-
          Remplacer la métrique du suivi de cible par une expression mathématique qui divise ApproximateNumberOfMessagesVisible par le RunningTaskCount du service issu de Container Insights, avec une valeur cible de 360.
    - id: b
      text:
        en: |-
          Keep ApproximateNumberOfMessagesVisible as the target tracking metric, and lower the target value to 90 so that the service scales out sooner.
        fr: |-
          Conserver ApproximateNumberOfMessagesVisible comme métrique du suivi de cible, et abaisser la valeur cible à 90 afin que le service monte en charge plus tôt.
    - id: c
      text:
        en: |-
          Create an Application Auto Scaling scheduled action with a cron expression that sets the service's minimum capacity to 40 at 00:50 every day, and another that lowers it at 03:00.
        fr: |-
          Créer une action planifiée Application Auto Scaling avec une expression cron qui fixe la capacité minimale du service à 40 à 00:50 chaque jour, et une autre qui l'abaisse à 03:00.
    - id: d
      text:
        en: |-
          Create an EC2 Auto Scaling scheduled action that raises the desired capacity of the cluster's Auto Scaling group at 00:50 every day.
        fr: |-
          Créer une action planifiée EC2 Auto Scaling qui relève la capacité souhaitée du groupe Auto Scaling du cluster à 00:50 chaque jour.
    - id: e
      text:
        en: |-
          Replace target tracking with a step scaling policy on the average CPU utilization of the service.
        fr: |-
          Remplacer le suivi de cible par une politique de mise à l'échelle par étapes sur l'utilisation moyenne du processeur du service.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Backlog per task (visible messages divided by running tasks) is the metric that scales in proportion to the work per task; Application Auto Scaling target tracking accepts this metric math expression, and the target is 4 messages per second x 90 seconds = 360 messages per task. A scheduled action raises the minimum capacity before the known nightly load and lowers it afterward, while target tracking keeps working in between.
    fr: |-
      L'arriéré par tâche (messages visibles divisés par les tâches en cours d'exécution) est la métrique qui évolue proportionnellement au travail par tâche ; le suivi de cible d'Application Auto Scaling accepte cette expression mathématique, et la cible vaut 4 messages par seconde x 90 secondes = 360 messages par tâche. Une action planifiée relève la capacité minimale avant la charge nocturne connue et l'abaisse ensuite, tandis que le suivi de cible continue de fonctionner entre les deux.
  options:
    b:
      en: |-
        The total queue length doesn't say how much work each task has, so the policy still overshoots while a backlog drains, whatever the target.
      fr: |-
        La longueur totale de la file n'indique pas la quantité de travail de chaque tâche : la politique dépasse toujours le besoin pendant la résorption d'un arriéré, quelle que soit la cible.
    d:
      en: |-
        The service runs on Fargate, so there is no Auto Scaling group to scale, and instance capacity doesn't set the number of tasks.
      fr: |-
        Le service s'exécute sur Fargate : il n'y a pas de groupe Auto Scaling à mettre à l'échelle, et la capacité en instances ne fixe pas le nombre de tâches.
    e:
      en: |-
        CPU utilization doesn't reflect how long messages wait in the queue, so it can't enforce the 90-second limit, and it is still reactive at 01:00.
      fr: |-
        L'utilisation du processeur ne reflète pas le temps d'attente des messages dans la file : elle ne peut pas garantir la limite de 90 secondes, et elle reste réactive à 01:00.
references:
  - title: "Create a target tracking scaling policy for Application Auto Scaling using metric math"
    url: https://docs.aws.amazon.com/autoscaling/application/userguide/application-auto-scaling-target-tracking-metric-math.html
