id: sapc03-5b-drift-data-capture
objective: "5.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company is launching its first predictive model, a claims-fraud classifier served from an Amazon SageMaker AI real-time endpoint, and it is a new customer of SageMaker AI. Regulators require the company to check every week whether the distribution of production input features has drifted from the training data, and to alert the model risk team when drift exceeds an agreed score. Ground-truth labels arrive 30 days after each claim and must be used to report model accuracy every month. The company wants to use only services that are open to new customers, and to keep all data in its own account.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance lance son premier modèle prédictif, un classificateur de fraude aux sinistres servi depuis un point de terminaison en temps réel Amazon SageMaker AI, et elle est nouvelle cliente de SageMaker AI. Les régulateurs exigent que l'entreprise vérifie chaque semaine si la distribution des caractéristiques d'entrée en production a dérivé par rapport aux données d'entraînement, et qu'elle alerte l'équipe des risques de modèle quand la dérive dépasse un score convenu. Les étiquettes de vérité de terrain arrivent 30 jours après chaque sinistre et doivent servir à rapporter l'exactitude du modèle chaque mois. L'entreprise ne veut utiliser que des services ouverts aux nouveaux clients, et conserver toutes les données dans son propre compte.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a SageMaker Model Monitor data quality schedule that compares the captured requests with a baseline, and a model quality schedule that joins the ground-truth labels monthly.", fr: "Créer une planification de qualité des données SageMaker Model Monitor qui compare les requêtes capturées à une référence, et une planification de qualité du modèle qui joint chaque mois les étiquettes de vérité de terrain." } }
    - { id: b, text: { en: "Run a SageMaker Clarify processing job every week that computes feature attribution drift on the captured requests, and send the report to the model risk team.", fr: "Exécuter chaque semaine une tâche de traitement SageMaker Clarify qui calcule la dérive d'attribution des caractéristiques sur les requêtes capturées, et envoyer le rapport à l'équipe des risques de modèle." } }
    - { id: c, text: { en: "Run an Amazon Bedrock evaluation job every week on the captured requests, with a custom metric that compares the production inputs with the training dataset.", fr: "Exécuter chaque semaine une tâche d'évaluation Amazon Bedrock sur les requêtes capturées, avec une métrique personnalisée qui compare les entrées de production au jeu de données d'entraînement." } }
    - { id: d, text: { en: "Turn on endpoint data capture to Amazon S3, and run scheduled jobs with an open-source library such as Evidently that publish drift and accuracy scores to CloudWatch with an SNS alarm.", fr: "Activer la capture de données du point de terminaison vers Amazon S3, et exécuter des tâches planifiées avec une bibliothèque open source comme Evidently qui publient des scores de dérive et d'exactitude dans CloudWatch, avec une alarme SNS." } }
answer: { optionId: d }
explanation:
  correct:
    en: "SageMaker Model Monitor is no longer open to new customers, and AWS points them to open-source monitoring solutions built on MLflow and Evidently that run entirely in the customer's account, combined with CloudWatch custom metrics and alarms. Data capture records the endpoint's inputs and outputs in Amazon S3, a weekly drift job compares them with the training baseline, and a monthly job joins the ground-truth labels to compute accuracy."
    fr: "SageMaker Model Monitor n'est plus ouvert aux nouveaux clients, et AWS les oriente vers des solutions de surveillance open source basées sur MLflow et Evidently qui s'exécutent entièrement dans le compte du client, combinées aux métriques personnalisées et aux alarmes CloudWatch. La capture de données enregistre les entrées et sorties du point de terminaison dans Amazon S3, une tâche hebdomadaire de dérive les compare à la référence d'entraînement, et une tâche mensuelle joint les étiquettes de vérité de terrain pour calculer l'exactitude."
  options:
    a: { en: "Model Monitor is no longer open to new customers, so a company that is new to SageMaker AI cannot adopt it.", fr: "Model Monitor n'est plus ouvert aux nouveaux clients : une entreprise nouvelle sur SageMaker AI ne peut pas l'adopter." }
    b: { en: "SageMaker Clarify is also closed to new customers, and feature attribution drift is not the input-distribution check plus monthly accuracy that regulators require.", fr: "SageMaker Clarify est lui aussi fermé aux nouveaux clients, et la dérive d'attribution des caractéristiques n'est pas le contrôle de distribution des entrées assorti d'une exactitude mensuelle qu'exigent les régulateurs." }
    c: { en: "Bedrock evaluations score the responses of generative models and RAG sources, not the feature distributions of a predictive classifier.", fr: "Les évaluations Bedrock notent les réponses de modèles génératifs et de sources RAG, pas les distributions de caractéristiques d'un classificateur prédictif." }
