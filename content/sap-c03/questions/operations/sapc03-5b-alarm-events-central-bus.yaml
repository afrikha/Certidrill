id: sapc03-5b-alarm-events-central-bus
objective: "5.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 50 workload accounts in AWS Organizations, all in us-east-1, and application teams own and change their own CloudWatch alarms. A central operations account runs an enrichment and paging workflow that must receive every alarm transition to ALARM from all accounts within seconds, including the alarms that teams create later. The teams must not need to change the actions of their alarms. New accounts must be covered automatically, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 50 comptes de charge de travail dans AWS Organizations, tous dans us-east-1, et les équipes applicatives possèdent et modifient leurs propres alarmes CloudWatch. Un compte d'exploitation central exécute un flux d'enrichissement et d'envoi de pages qui doit recevoir en quelques secondes chaque passage d'une alarme à l'état ALARM dans tous les comptes, y compris pour les alarmes que les équipes créeront plus tard. Les équipes ne doivent pas avoir à modifier les actions de leurs alarmes. Les nouveaux comptes doivent être couverts automatiquement, et l'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon SNS topic in the operations account with a topic policy for the organization, and ask every team to add the topic as an action on each of its alarms.", fr: "Créer dans le compte d'exploitation une rubrique Amazon SNS avec une politique de rubrique pour l'organisation, et demander à chaque équipe d'ajouter la rubrique comme action sur chacune de ses alarmes." } }
    - { id: b, text: { en: "Use StackSets automatic deployment to create in every account an EventBridge rule for CloudWatch Alarm State Change events in the ALARM state that targets a central event bus that allows the organization.", fr: "Utiliser le déploiement automatique de StackSets pour créer dans chaque compte une règle EventBridge sur les événements CloudWatch Alarm State Change à l'état ALARM, qui cible un bus d'événements central autorisant l'organisation." } }
    - { id: c, text: { en: "Configure cross-account observability with the operations account as the monitoring account, and recreate every team's alarm in the operations account with an action for the workflow.", fr: "Configurer l'observabilité intercompte avec le compte d'exploitation comme compte de surveillance, et recréer chaque alarme des équipes dans le compte d'exploitation avec une action vers le flux." } }
    - { id: d, text: { en: "Create an organization trail in AWS CloudTrail, and create an EventBridge rule in the operations account that matches the SetAlarmState API calls of all accounts.", fr: "Créer un journal de suivi d'organisation dans AWS CloudTrail, et créer dans le compte d'exploitation une règle EventBridge qui correspond aux appels d'API SetAlarmState de tous les comptes." } }
answer: { optionId: b }
explanation:
  correct:
    en: "CloudWatch sends an event to EventBridge whenever an alarm changes state, with the detail-type CloudWatch Alarm State Change, and delivery of these events is guaranteed. A rule that matches the ALARM state and forwards the events to a central bus covers every existing and future alarm without touching alarm actions, and StackSets automatic deployment adds the rule to new accounts."
    fr: "CloudWatch envoie un événement à EventBridge chaque fois qu'une alarme change d'état, avec le detail-type CloudWatch Alarm State Change, et la livraison de ces événements est garantie. Une règle qui correspond à l'état ALARM et transfère les événements vers un bus central couvre chaque alarme existante et future sans toucher aux actions des alarmes, et le déploiement automatique de StackSets ajoute la règle aux nouveaux comptes."
  options:
    a: { en: "Every team would have to change the actions of every alarm, which the requirements forbid, and alarms created later could miss the topic.", fr: "Chaque équipe devrait modifier les actions de chaque alarme, ce que les exigences interdisent, et les alarmes créées plus tard pourraient oublier la rubrique." }
    c: { en: "Recreating and synchronizing hundreds of alarms in the operations account is high overhead, and the copies drift whenever teams change their own alarms.", fr: "Recréer et synchroniser des centaines d'alarmes dans le compte d'exploitation représente une forte charge, et les copies divergent chaque fois que les équipes modifient leurs alarmes." }
    d: { en: "Alarm evaluations do not call SetAlarmState, which only sets a state temporarily, for example for tests, so the trail would miss real transitions.", fr: "Les évaluations d'alarmes n'appellent pas SetAlarmState, qui ne fait que définir un état temporaire, par exemple pour des tests : le journal de suivi manquerait les vraies transitions." }
references:
  - title: Alarm events and EventBridge
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-and-eventbridge.html
