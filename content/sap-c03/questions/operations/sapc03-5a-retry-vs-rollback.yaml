id: sapc03-5a-retry-vs-rollback
objective: "5.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's V2 AWS CodePipeline pipeline has an IntegrationTest stage whose tests call a partner sandbox that fails intermittently. About one execution in ten fails in that stage, and it succeeds when an engineer retries only the failed test action. The pipeline also has a ProdDeploy stage that deploys to Amazon ECS through AWS CloudFormation. When ProdDeploy fails, the company wants the stage to return automatically to the last successful source revision. The pipeline must stay in QUEUED execution mode. The company wants to remove the manual retries and the manual rollbacks, with no custom code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le pipeline AWS CodePipeline V2 d'une entreprise comporte une étape IntegrationTest dont les tests appellent un environnement de test partenaire qui échoue par intermittence. Environ une exécution sur dix échoue dans cette étape, et elle réussit lorsqu'un ingénieur relance uniquement l'action de test en échec. Le pipeline comporte aussi une étape ProdDeploy qui déploie sur Amazon ECS au moyen d'AWS CloudFormation. Lorsque ProdDeploy échoue, l'entreprise veut que l'étape revienne automatiquement à la dernière révision source réussie. Le pipeline doit rester en mode d'exécution QUEUED. L'entreprise veut supprimer les relances et les restaurations manuelles, sans code personnalisé.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Configure automatic retry on failure for the IntegrationTest stage with the FAILED_ACTIONS retry mode.
        fr: |-
          Configurer la nouvelle tentative automatique en cas d'échec pour l'étape IntegrationTest avec le mode FAILED_ACTIONS.
    - id: b
      text:
        en: |-
          Configure automatic retry on failure for the ProdDeploy stage together with an on-failure condition with the Rollback result on that same stage.
        fr: |-
          Configurer la nouvelle tentative automatique en cas d'échec pour l'étape ProdDeploy, avec en plus une condition en cas d'échec avec le résultat Rollback sur cette même étape.
    - id: c
      text:
        en: |-
          Configure an on-failure condition with the Rollback result on the ProdDeploy stage.
        fr: |-
          Configurer une condition en cas d'échec avec le résultat Rollback sur l'étape ProdDeploy.
    - id: d
      text:
        en: |-
          Change the execution mode to PARALLEL so that a failed execution doesn't block the next ones, and turn on stage rollback for ProdDeploy.
        fr: |-
          Passer le mode d'exécution à PARALLEL pour qu'une exécution en échec ne bloque pas les suivantes, et activer la restauration d'étape pour ProdDeploy.
    - id: e
      text:
        en: |-
          Add an entry condition with a LambdaInvoke rule to the IntegrationTest stage that calls the partner sandbox until it responds successfully.
        fr: |-
          Ajouter à l'étape IntegrationTest une condition d'entrée avec une règle LambdaInvoke qui appelle l'environnement de test partenaire jusqu'à ce qu'il réponde correctement.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Automatic retry on stage failure makes one retry attempt, and the FAILED_ACTIONS mode reruns only the failed actions, which matches what engineers do by hand. An on-failure condition with the Rollback result returns ProdDeploy to the last successful execution automatically. The two settings go on different stages, because a stage can't combine automatic retry with an on-failure condition, and both work in QUEUED mode.
    fr: |-
      La nouvelle tentative automatique en cas d'échec d'étape fait une seule tentative, et le mode FAILED_ACTIONS ne relance que les actions en échec, comme le font les ingénieurs à la main. Une condition en cas d'échec avec le résultat Rollback ramène automatiquement ProdDeploy à la dernière exécution réussie. Les deux réglages portent sur des étapes différentes, car une étape ne peut pas combiner nouvelle tentative automatique et condition en cas d'échec, et tous deux fonctionnent en mode QUEUED.
  options:
    b:
      en: |-
        Automatic stage retry can't be used together with on-failure conditions on the same stage, and retrying a failed production deployment isn't what the company asked for.
      fr: |-
        La nouvelle tentative automatique d'étape ne peut pas être utilisée avec des conditions en cas d'échec sur la même étape, et relancer un déploiement en production en échec n'est pas ce que l'entreprise demande.
    d:
      en: |-
        Stage rollback isn't available in PARALLEL mode, and the pipeline must stay in QUEUED mode.
      fr: |-
        La restauration d'étape n'est pas disponible en mode PARALLEL, et le pipeline doit rester en mode QUEUED.
    e:
      en: |-
        An entry condition runs before the stage, so it can't retry the failed tests, and a LambdaInvoke rule is custom code.
      fr: |-
        Une condition d'entrée s'exécute avant l'étape : elle ne peut pas relancer les tests en échec, et une règle LambdaInvoke est du code personnalisé.
references:
  - title: Configuring stage retry for a failed stage or failed actions - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-retry.html
  - title: Configure conditions for a stage - AWS CodePipeline
    url: https://docs.aws.amazon.com/codepipeline/latest/userguide/stage-conditions.html
