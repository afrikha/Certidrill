id: sapc03-5a-rds-managed-password
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is writing an AWS CloudFormation template for a new Amazon RDS for PostgreSQL Multi-AZ DB instance. The security policy states that no person may ever see or type the master user password. The password must not appear in the template, in parameter files, or in the deployment pipeline, and it must rotate automatically. Applications already retrieve database credentials from AWS Secrets Manager. The team wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise écrit un modèle AWS CloudFormation pour une nouvelle instance de base de données Amazon RDS for PostgreSQL Multi-AZ. La politique de sécurité stipule qu'aucune personne ne doit jamais voir ni saisir le mot de passe de l'utilisateur principal. Le mot de passe ne doit apparaître ni dans le modèle, ni dans les fichiers de paramètres, ni dans le pipeline de déploiement, et il doit faire l'objet d'une rotation automatique. Les applications récupèrent déjà les informations d'identification de base de données dans AWS Secrets Manager. L'équipe veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Generate a random password in the pipeline, pass it to the template as a NoEcho parameter, and store a copy in Secrets Manager with an AWS CLI command after the deployment.
        fr: |-
          Générer un mot de passe aléatoire dans le pipeline, le transmettre au modèle sous forme de paramètre NoEcho, et en stocker une copie dans Secrets Manager avec une commande AWS CLI après le déploiement.
    - id: b
      text:
        en: |-
          Create an AWS::SecretsManager::Secret with GenerateSecretString, reference it with a secretsmanager dynamic reference in MasterUserPassword, and write a custom rotation function.
        fr: |-
          Créer un AWS::SecretsManager::Secret avec GenerateSecretString, le référencer avec une référence dynamique secretsmanager dans MasterUserPassword, et écrire une fonction de rotation personnalisée.
    - id: c
      text:
        en: |-
          Set ManageMasterUserPassword to true on the AWS::RDS::DBInstance resource so that RDS generates the password, stores it in Secrets Manager, and rotates it.
        fr: |-
          Définir ManageMasterUserPassword à true sur la ressource AWS::RDS::DBInstance pour que RDS génère le mot de passe, le stocke dans Secrets Manager et en assure la rotation.
    - id: d
      text:
        en: |-
          Have an administrator store the password as a Parameter Store SecureString parameter, and reference it with an ssm-secure dynamic reference in MasterUserPassword.
        fr: |-
          Faire stocker le mot de passe par un administrateur dans un paramètre SecureString de Parameter Store, et le référencer avec une référence dynamique ssm-secure dans MasterUserPassword.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With ManageMasterUserPassword, RDS generates the master password itself, stores it in a secret that Secrets Manager creates and manages, and rotates it (every 7 days by default, configurable). Nobody types or sees the password, nothing secret appears in the template or pipeline, and no rotation function has to be written or maintained.
    fr: |-
      Avec ManageMasterUserPassword, RDS génère lui-même le mot de passe principal, le stocke dans un secret que Secrets Manager crée et gère, et en assure la rotation (tous les 7 jours par défaut, modifiable). Personne ne saisit ni ne voit le mot de passe, rien de secret n'apparaît dans le modèle ou le pipeline, et aucune fonction de rotation n'est à écrire ni à maintenir.
  options:
    a:
      en: |-
        The pipeline generates and handles the password, so it passes through the deployment tooling; NoEcho only masks it in console and API output, and nothing rotates it.
      fr: |-
        Le pipeline génère et manipule le mot de passe, qui transite donc par les outils de déploiement ; NoEcho le masque seulement dans la console et les réponses d'API, et rien n'en assure la rotation.
    b:
      en: |-
        This keeps the password out of the template, but writing and maintaining a rotation function is more overhead than letting RDS manage the secret.
      fr: |-
        Cette solution garde le mot de passe hors du modèle, mais écrire et maintenir une fonction de rotation représente plus de charge que de laisser RDS gérer le secret.
    d:
      en: |-
        An administrator would know the password, and a Parameter Store SecureString has no automatic rotation.
      fr: |-
        Un administrateur connaîtrait le mot de passe, et un SecureString de Parameter Store n'offre pas de rotation automatique.
references:
  - title: Password management with Amazon RDS and AWS Secrets Manager - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
