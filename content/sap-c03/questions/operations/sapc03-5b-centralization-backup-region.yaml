id: sapc03-5b-centralization-backup-region
objective: "5.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 accounts in AWS Organizations and runs workloads in four AWS Regions. The security team wants a copy of all new CloudWatch Logs data from every account and Region in a central log account in eu-west-1. It also wants a second copy in eu-central-1 for disaster recovery. Accounts that join the organization must be included automatically. The team wants a managed solution with the LEAST operational overhead and no streaming infrastructure to operate.

    Which solution will meet these requirements?
  fr: |
    AnyCompany compte 300 comptes dans AWS Organizations et exécute des charges de travail dans quatre Régions AWS. L'équipe de sécurité veut une copie de toutes les nouvelles données CloudWatch Logs de chaque compte et de chaque Région dans un compte de journaux central dans eu-west-1. Elle veut aussi une seconde copie dans eu-central-1 pour la reprise après sinistre. Les comptes qui rejoignent l'organisation doivent être inclus automatiquement. L'équipe veut une solution gérée avec le MOINS de charge opérationnelle et aucune infrastructure de streaming à exploiter.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure CloudWatch cross-account observability with the central log account as the monitoring account in eu-west-1, and link all accounts through AWS Organizations.", fr: "Configurer l'observabilité intercompte CloudWatch avec le compte de journaux central comme compte de surveillance dans eu-west-1, et lier tous les comptes via AWS Organizations." } }
    - { id: b, text: { en: "Use StackSets to deploy a subscription filter on every log group of every account, sending to Amazon Data Firehose streams that write to S3 buckets in both Regions.", fr: "Utiliser StackSets pour déployer un filtre d'abonnement sur chaque groupe de journaux de chaque compte, vers des flux Amazon Data Firehose qui écrivent dans des compartiments S3 des deux Régions." } }
    - { id: c, text: { en: "Schedule an AWS Lambda function in every account and Region that creates CloudWatch Logs export tasks to S3 buckets of the central account in both Regions.", fr: "Planifier dans chaque compte et chaque Région une fonction AWS Lambda qui crée des tâches d'exportation CloudWatch Logs vers des compartiments S3 du compte central dans les deux Régions." } }
    - { id: d, text: { en: "Create a log centralization rule for the whole organization and the four source Regions, with eu-west-1 as the destination Region and eu-central-1 as the backup Region.", fr: "Créer une règle de centralisation des journaux pour toute l'organisation et les quatre Régions sources, avec eu-west-1 comme Région de destination et eu-central-1 comme Région de sauvegarde." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Centralization rules, managed from the management account or a delegated administrator, copy new log data from selected accounts, organizational units, or the whole organization, in a list of source Regions, to one destination account and Region. An optional backup Region stores a second copy for resiliency and disaster recovery, and no streams or functions need to be operated."
    fr: "Les règles de centralisation, gérées depuis le compte de gestion ou un administrateur délégué, copient les nouvelles données de journal de comptes, d'unités d'organisation ou de toute l'organisation, dans une liste de Régions sources, vers un compte et une Région de destination. Une Région de sauvegarde facultative stocke une seconde copie pour la résilience et la reprise après sinistre, et aucun flux ni aucune fonction ne sont à exploiter."
  options:
    a: { en: "Cross-account observability lets a monitoring account view data in place in one Region; it creates no copy, so nothing survives in a second Region.", fr: "L'observabilité intercompte permet à un compte de surveillance de consulter les données sur place dans une Région ; elle ne crée aucune copie : rien ne subsiste dans une seconde Région." }
    b: { en: "Subscription filters on every log group, plus Firehose streams, are the streaming infrastructure that the team does not want to operate, and new log groups need new filters.", fr: "Des filtres d'abonnement sur chaque groupe de journaux, plus des flux Firehose, constituent l'infrastructure de streaming que l'équipe ne veut pas exploiter, et les nouveaux groupes de journaux exigent de nouveaux filtres." }
    c: { en: "Export tasks are batch copies limited to one active task per account, which makes them unsuitable for continuous centralization, and the functions are custom code.", fr: "Les tâches d'exportation sont des copies par lots limitées à une tâche active par compte, ce qui les rend inadaptées à une centralisation continue, et les fonctions sont du code personnalisé." }
references:
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
