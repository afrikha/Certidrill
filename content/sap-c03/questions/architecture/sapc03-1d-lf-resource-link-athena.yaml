id: sapc03-1d-lf-resource-link-athena
objective: "1.5.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Lake Formation in a producer account to share a sales database with a consumer account in the same organization, and AWS RAM sharing with AWS Organizations is enabled. The producer granted DESCRIBE on the database and SELECT on all its tables to the consumer account, with the grant option. The consumer account's data lake administrator can see the shared database in the Lake Formation console. Analysts in the consumer account use an IAM role with Amazon Athena, but the shared tables do not appear in Athena and the analysts' queries fail.

    Which combination of actions in the consumer account will let the analysts query the shared tables? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise AWS Lake Formation dans un compte producteur pour partager une base de données de ventes avec un compte consommateur de la même organisation, et le partage AWS RAM avec AWS Organizations est activé. Le producteur a accordé DESCRIBE sur la base de données et SELECT sur toutes ses tables au compte consommateur, avec l'option d'octroi. L'administrateur du lac de données du compte consommateur voit la base de données partagée dans la console Lake Formation. Les analystes du compte consommateur utilisent un rôle IAM avec Amazon Athena, mais les tables partagées n'apparaissent pas dans Athena et les requêtes des analystes échouent.

    Quelle combinaison d'actions dans le compte consommateur permettra aux analystes d'interroger les tables partagées ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Accept the AWS RAM resource share invitation from the producer account in the AWS RAM console of the consumer account."
        fr: "Accepter l'invitation de partage de ressources AWS RAM du compte producteur dans la console AWS RAM du compte consommateur."
    - id: b
      text:
        en: "Create a resource link in the consumer account's Data Catalog that points to the shared database."
        fr: "Créer dans le Data Catalog du compte consommateur un lien de ressource qui pointe vers la base de données partagée."
    - id: c
      text:
        en: "Ask the producer account to add a bucket policy that grants the analyst role s3:GetObject on the sales data prefixes."
        fr: "Demander au compte producteur d'ajouter une politique de compartiment qui accorde au rôle des analystes s3:GetObject sur les préfixes des données de ventes."
    - id: d
      text:
        en: "Grant the analyst role DESCRIBE on the resource link and SELECT on the tables of the shared database by using the grant option."
        fr: "Accorder au rôle des analystes DESCRIBE sur le lien de ressource et SELECT sur les tables de la base de données partagée en utilisant l'option d'octroi."
    - id: e
      text:
        en: "Run an AWS Glue crawler in the consumer account on the producer's sales bucket to create local table definitions."
        fr: "Exécuter un robot d'analyse AWS Glue dans le compte consommateur sur le compartiment de ventes du producteur pour créer des définitions de tables locales."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Integrated services such as Athena build their queries against resource links, so the consumer creates a link in its own Data Catalog that points to the shared database. Permissions on a link do not grant access to its target, so the data lake administrator grants DESCRIBE on the link and, with the grant option received from the producer, SELECT on the shared tables to the analyst role.
    fr: |
      Les services intégrés comme Athena construisent leurs requêtes sur des liens de ressource : le consommateur crée dans son propre Data Catalog un lien qui pointe vers la base de données partagée. Les autorisations sur un lien ne donnent pas accès à sa cible : l'administrateur du lac de données accorde donc au rôle des analystes DESCRIBE sur le lien et, grâce à l'option d'octroi reçue du producteur, SELECT sur les tables partagées.
  options:
    a:
      en: |
        Within the same organization with RAM sharing enabled, the shared resources are available immediately, as the administrator can already see; there is no invitation to accept.
      fr: |
        Au sein d'une même organisation avec le partage RAM activé, les ressources partagées sont disponibles immédiatement, comme l'administrateur le constate déjà ; il n'y a aucune invitation à accepter.
    c:
      en: |
        Lake Formation vends temporary credentials for the registered data, so direct S3 permissions are not needed and would bypass its access control.
      fr: |
        Lake Formation fournit des informations d'identification temporaires pour les données enregistrées : des autorisations S3 directes ne sont pas nécessaires et contourneraient son contrôle d'accès.
    e:
      en: |
        Crawling creates separate, unmanaged table definitions in the consumer account and still needs S3 access to the producer's data.
      fr: |
        L'analyse par un robot crée des définitions de tables distinctes et non gouvernées dans le compte consommateur et exige toujours un accès S3 aux données du producteur.
references:
  - title: How resource links work in Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/resource-links-about.html
  - title: Cross-account data sharing in Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/cross-account-permissions.html
