id: sapc03-1b-agentcore-memory
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs a booking agent and a customer care agent on Amazon Bedrock AgentCore Runtime. Within a conversation, each agent must understand follow-up questions without the customer repeating details. Across conversations, both agents must remember key facts about each customer, such as preferred seats and loyalty status, and summaries of past sessions, so that a customer who talks to the care agent benefits from what the booking agent learned. Sending entire past transcripts to the model is too expensive. The company wants the least operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages exécute un agent de réservation et un agent de service client sur Amazon Bedrock AgentCore Runtime. Au sein d'une conversation, chaque agent doit comprendre les questions de suivi sans que le client répète les détails. D'une conversation à l'autre, les deux agents doivent se souvenir des faits importants sur chaque client, comme les sièges préférés et le statut de fidélité, ainsi que des résumés des sessions passées, afin qu'un client qui parle à l'agent de service bénéficie de ce que l'agent de réservation a appris. Envoyer l'intégralité des transcriptions passées au modèle coûte trop cher. L'entreprise veut le moins de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Store every conversation turn in an Amazon DynamoDB table keyed by customer ID, and have both agents load all previous turns of the customer into the prompt at the start of each conversation."
        fr: "Stocker chaque tour de conversation dans une table Amazon DynamoDB indexée par ID client, et faire charger par les deux agents tous les tours précédents du client dans l'invite au début de chaque conversation."
    - id: b
      text:
        en: "Export the transcripts to Amazon S3 after each session, sync them into an Amazon Bedrock knowledge base every night, and have both agents query the knowledge base for the customer's history."
        fr: "Exporter les transcriptions vers Amazon S3 après chaque session, les synchroniser chaque nuit dans une base de connaissances Amazon Bedrock, et faire interroger la base de connaissances par les deux agents pour l'historique du client."
    - id: c
      text:
        en: "Use Amazon Bedrock AgentCore Memory with short-term memory for the turns of each session and long-term memory that extracts customer preferences, facts and session summaries, shared by both agents."
        fr: "Utiliser Amazon Bedrock AgentCore Memory avec une mémoire à court terme pour les tours de chaque session et une mémoire à long terme qui extrait les préférences, les faits et les résumés de session de chaque client, partagée par les deux agents."
    - id: d
      text:
        en: "Keep each customer's conversation state in an Amazon ElastiCache for Valkey cluster with a 30-minute TTL, and have both agents read the cached state when a conversation starts."
        fr: "Conserver l'état de conversation de chaque client dans un cluster Amazon ElastiCache pour Valkey avec une durée de vie de 30 minutes, et faire lire l'état en cache par les deux agents au début d'une conversation."
answer: { optionId: c }
explanation:
  correct:
    en: "AgentCore Memory is a fully managed memory service: short-term memory keeps the turn-by-turn context of a session, and long-term memory automatically extracts insights such as user preferences, important facts and session summaries that persist across sessions and can be shared across agents. Agents retrieve only these extracted memories instead of full transcripts."
    fr: "AgentCore Memory est un service de mémoire entièrement géré : la mémoire à court terme conserve le contexte tour par tour d'une session, et la mémoire à long terme extrait automatiquement des informations comme les préférences des utilisateurs, les faits importants et les résumés de session, qui persistent d'une session à l'autre et peuvent être partagées entre agents. Les agents ne récupèrent que ces mémoires extraites au lieu des transcriptions complètes."
  options:
    a:
      en: "Loading every past turn into the prompt is the expensive approach that the company wants to avoid, and nothing extracts preferences or summaries."
      fr: "Charger tous les tours passés dans l'invite est justement l'approche coûteuse que l'entreprise veut éviter, et rien n'extrait de préférences ni de résumés."
    b:
      en: "A nightly sync leaves the latest sessions unknown until the next day, and the company would build the export and summarization pipeline itself."
      fr: "Une synchronisation nocturne laisse les dernières sessions inconnues jusqu'au lendemain, et l'entreprise construirait elle-même le pipeline d'export et de synthèse."
    d:
      en: "A cache with a 30-minute TTL only keeps short-term state, so preferences and summaries are lost between conversations."
      fr: "Un cache avec une durée de vie de 30 minutes ne garde qu'un état à court terme : les préférences et les résumés sont perdus d'une conversation à l'autre."
references:
  - title: Add memory to your Amazon Bedrock AgentCore agent
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/memory.html
  - title: Overview
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
