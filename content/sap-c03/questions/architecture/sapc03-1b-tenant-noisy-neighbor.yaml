id: sapc03-1b-tenant-noisy-neighbor
objective: "1.1.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company exposes a pooled Amazon API Gateway REST API to 5,000 tenants, and requests are authenticated with an Amazon Cognito user pool authorizer. Each request places a job into one Amazon SQS standard queue that a fleet of workers on Amazon EC2 processes. Recently, a few large tenants sent bursts that slowed the API for everyone and created queue backlogs that delayed the jobs of all other tenants for hours. The company wants to limit the request rate of each tenant according to its pricing tier at the API. It also wants to keep the queue dwell time of quiet tenants low during another tenant's burst, without changing the worker code or losing the throughput of a standard queue.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise SaaS expose une API REST Amazon API Gateway mutualisée à 5 000 locataires, et les requêtes sont authentifiées par un mécanisme d'autorisation de groupe d'utilisateurs Amazon Cognito. Chaque requête place une tâche dans une seule file d'attente Amazon SQS standard que traite un parc de workers sur Amazon EC2. Récemment, quelques gros locataires ont envoyé des rafales qui ont ralenti l'API pour tous et créé des arriérés dans la file qui ont retardé de plusieurs heures les tâches de tous les autres locataires. L'entreprise veut limiter le débit de requêtes de chaque locataire selon son niveau tarifaire au niveau de l'API. Elle veut aussi garder faible le temps d'attente dans la file des locataires calmes pendant la rafale d'un autre locataire, sans modifier le code des workers ni perdre le débit d'une file standard.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Move job processing to one AWS Lambda function, and configure reserved concurrency for each tenant on that function."
        fr: "Déplacer le traitement des tâches vers une seule fonction AWS Lambda, et configurer une simultanéité réservée par locataire sur cette fonction."
    - id: b
      text:
        en: "Create one usage plan per pricing tier with throttling limits, issue an API key for each tenant that is associated with its tier's plan, and require API keys on the methods."
        fr: "Créer un plan d'utilisation par niveau tarifaire avec des limites de limitation, émettre pour chaque locataire une clé d'API associée au plan de son niveau, et exiger les clés d'API sur les méthodes."
    - id: c
      text:
        en: "Replace the queue with an SQS FIFO queue that uses the tenant ID as message group ID so that each tenant's jobs are processed in their own group."
        fr: "Remplacer la file par une file d'attente SQS FIFO qui utilise l'ID du locataire comme ID de groupe de messages, afin que les tâches de chaque locataire soient traitées dans leur propre groupe."
    - id: d
      text:
        en: "Set the tenant ID as the MessageGroupId of each message sent to the standard queue so that SQS fair queues prioritize the messages of quiet tenants."
        fr: "Définir l'ID du locataire comme MessageGroupId de chaque message envoyé à la file standard, afin que les files équitables (fair queues) SQS donnent la priorité aux messages des locataires calmes."
    - id: e
      text:
        en: "Associate an AWS WAF web ACL with the API stage that contains a rate-based rule limiting the number of requests from each source IP address."
        fr: "Associer à l'étape de l'API une liste ACL web AWS WAF contenant une règle basée sur le débit qui limite le nombre de requêtes de chaque adresse IP source."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Usage plans set throttling and quota limits per API key, so one plan per tier with one key per tenant limits each tenant's rate, while Cognito still authenticates the requests. On a standard queue, MessageGroupId acts only as a tenant identifier for fair queues: SQS delivers messages of other tenants first when one tenant has a disproportionate share in flight, with no consumer change and no throughput limit."
    fr: "Les plans d'utilisation fixent des limites de limitation et de quota par clé d'API : un plan par niveau avec une clé par locataire limite le débit de chaque locataire, tandis que Cognito continue d'authentifier les requêtes. Sur une file standard, MessageGroupId sert uniquement d'identifiant de locataire pour les files équitables : SQS livre d'abord les messages des autres locataires quand un locataire a une part disproportionnée en cours de traitement, sans modification des consommateurs ni limite de débit."
  options:
    a:
      en: "Reserved concurrency applies to a whole function, not to each tenant, and the change would replace the existing worker code."
      fr: "La simultanéité réservée s'applique à une fonction entière, pas à chaque locataire, et ce changement remplacerait le code existant des workers."
    c:
      en: "A FIFO queue adds ordering that the jobs do not need and has lower throughput than a standard queue, which the company does not want to lose."
      fr: "Une file FIFO ajoute un ordre dont les tâches n'ont pas besoin et a un débit inférieur à celui d'une file standard, que l'entreprise ne veut pas perdre."
    e:
      en: "Tenants' users share and change IP addresses, so a per-IP limit neither follows tenants nor applies different limits per pricing tier."
      fr: "Les utilisateurs des locataires partagent et changent d'adresses IP : une limite par IP ne suit pas les locataires et n'applique pas de limites différentes par niveau tarifaire."
references:
  - title: Usage plans and API keys for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
  - title: Amazon SQS fair queues
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fair-queues.html
