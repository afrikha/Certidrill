id: sapc03-1c-rest-api-mapping-legacy
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs a legacy policy service in its data center. The service exposes an HTTP API whose JSON requests and responses use a nested envelope with field names that differ from the company's new public API contract. The data center connects to a VPC through AWS Direct Connect. The mobile team needs a managed public API that reshapes request bodies into the legacy envelope and maps the legacy responses back to the new contract. The legacy service cannot be changed. The company also wants to avoid deploying or maintaining any custom compute, such as functions or containers, for the translation.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance exploite un service de contrats hérité dans son centre de données. Ce service expose une API HTTP dont les requêtes et réponses JSON utilisent une enveloppe imbriquée avec des noms de champs différents du nouveau contrat d'API publique de l'entreprise. Le centre de données est relié à un VPC par AWS Direct Connect. L'équipe mobile a besoin d'une API publique gérée qui remodèle les corps de requête dans l'enveloppe héritée et convertit les réponses héritées vers le nouveau contrat. Le service hérité ne peut pas être modifié. L'entreprise veut aussi éviter de déployer ou de maintenir des ressources de calcul personnalisées, comme des fonctions ou des conteneurs, pour la conversion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an API Gateway REST API with a private integration through a VPC link to a Network Load Balancer that targets the service's on-premises IP addresses, and use mapping templates for requests and responses."
        fr: "Créer une API REST API Gateway avec une intégration privée via un lien VPC vers un Network Load Balancer qui cible les adresses IP sur site du service, et utiliser des modèles de mappage pour les requêtes et les réponses."
    - id: b
      text:
        en: "Create an API Gateway HTTP API with a private integration through a VPC link to a Network Load Balancer that targets the on-premises IP addresses, and use parameter mapping to reshape the request and response bodies."
        fr: "Créer une API HTTP API Gateway avec une intégration privée via un lien VPC vers un Network Load Balancer qui cible les adresses IP sur site, et utiliser le mappage de paramètres pour remodeler les corps de requête et de réponse."
    - id: c
      text:
        en: "Create an API Gateway REST API with a Lambda proxy integration, and have a Lambda function in the VPC convert each request, call the legacy service over Direct Connect and convert the response."
        fr: "Créer une API REST API Gateway avec une intégration proxy Lambda, et faire convertir chaque requête par une fonction Lambda dans le VPC, qui appelle le service hérité via Direct Connect et convertit la réponse."
    - id: d
      text:
        en: "Create an Amazon MQ broker, have the mobile backend publish JSON requests to a queue, and have the legacy service consume the queue and send its responses to a reply queue."
        fr: "Créer un agent de messages (broker) Amazon MQ, faire publier les requêtes JSON du backend mobile dans une file d'attente, et faire consommer cette file par le service hérité, qui envoie ses réponses dans une file de réponse."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      REST APIs support request and response body transformation with mapping templates, which are integration configuration rather than code running on compute that the company manages. A private integration through a VPC link to a Network Load Balancer with IP targets reaches the on-premises service over Direct Connect.
    fr: |-
      Les API REST prennent en charge la transformation des corps de requête et de réponse par des modèles de mappage, qui sont de la configuration d'intégration et non du code exécuté sur des ressources de calcul gérées par l'entreprise. Une intégration privée via un lien VPC vers un Network Load Balancer à cibles IP atteint le service sur site par Direct Connect.
  options:
    b:
      en: |-
        HTTP APIs do not support request body transformation; parameter mapping changes headers, query strings and paths, not bodies.
      fr: |-
        Les API HTTP ne prennent pas en charge la transformation du corps de requête ; le mappage de paramètres modifie les en-têtes, les chaînes de requête et les chemins, pas les corps.
    c:
      en: |-
        A Lambda function is custom compute that the company would have to deploy and maintain, which the requirements exclude.
      fr: |-
        Une fonction Lambda est une ressource de calcul personnalisée que l'entreprise devrait déployer et maintenir, ce que les exigences excluent.
    d:
      en: |-
        The legacy service cannot be changed to consume queues, and a queue does not give mobile clients a synchronous API.
      fr: |-
        Le service hérité ne peut pas être modifié pour consommer des files d'attente, et une file ne fournit pas d'API synchrone aux clients mobiles.
references:
  - title: Choose between REST APIs and HTTP APIs - Amazon API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
