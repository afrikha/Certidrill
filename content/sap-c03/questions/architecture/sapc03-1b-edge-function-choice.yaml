id: sapc03-1b-edge-function-choice
objective: "1.1.11"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company uses Amazon CloudFront for a web application that receives up to 300,000 requests per second, and it is reviewing five planned edge customizations. It wants to use CloudFront Functions wherever possible, because they cost less and scale to millions of requests per second. It will use Lambda@Edge only where CloudFront Functions cannot meet the requirement.

    Which two customizations require Lambda@Edge? (Choose two.)
  fr: |
    Une entreprise utilise Amazon CloudFront pour une application web qui reçoit jusqu'à 300 000 requêtes par seconde, et elle étudie cinq personnalisations en périphérie prévues. Elle veut utiliser CloudFront Functions partout où c'est possible, car il coûte moins cher et monte jusqu'à des millions de requêtes par seconde. Elle n'utilisera Lambda@Edge que là où CloudFront Functions ne peut pas répondre à l'exigence.

    Quelles sont les deux personnalisations qui exigent Lambda@Edge ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a Strict-Transport-Security header to every response sent to viewers."
        fr: "Ajouter un en-tête Strict-Transport-Security à chaque réponse envoyée aux utilisateurs."
    - id: b
      text:
        en: "Inspect the body of form POST requests and block requests that contain a forbidden field before they reach the origin."
        fr: "Inspecter le corps des requêtes POST de formulaire et bloquer celles qui contiennent un champ interdit avant qu'elles n'atteignent l'origine."
    - id: c
      text:
        en: "Normalize the Accept-Language header to three values on viewer requests to improve the cache hit ratio."
        fr: "Normaliser l'en-tête Accept-Language en trois valeurs sur les requêtes des utilisateurs pour améliorer le taux d'accès au cache."
    - id: d
      text:
        en: "Redirect requests for /old/* paths to /new/* paths with an HTTP 301 response."
        fr: "Rediriger les requêtes des chemins /old/* vers les chemins /new/* avec une réponse HTTP 301."
    - id: e
      text:
        en: "Modify the responses returned by the origin, on the origin response event, before CloudFront caches them."
        fr: "Modifier les réponses renvoyées par l'origine, sur l'événement de réponse de l'origine, avant que CloudFront ne les mette en cache."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "CloudFront Functions have no access to the request body and run only on viewer request and viewer response events. Lambda@Edge can read the request body with the include body option and can run on origin request and origin response events, whose result CloudFront then caches."
    fr: "CloudFront Functions n'a pas accès au corps des requêtes et ne s'exécute que sur les événements de requête et de réponse de l'utilisateur. Lambda@Edge peut lire le corps de la requête avec l'option d'inclusion du corps et peut s'exécuter sur les événements de requête et de réponse de l'origine, dont CloudFront met ensuite le résultat en cache."
  options:
    a:
      en: "Adding headers to viewer responses is a lightweight task that CloudFront Functions handle on the viewer response event (a response headers policy also works)."
      fr: "Ajouter des en-têtes aux réponses des utilisateurs est une tâche légère que CloudFront Functions traite sur l'événement de réponse de l'utilisateur (une politique d'en-têtes de réponse convient aussi)."
    c:
      en: "Cache key normalization of headers on viewer requests is a typical CloudFront Functions use case."
      fr: "La normalisation de la clé de cache à partir d'en-têtes sur les requêtes des utilisateurs est un cas d'usage typique de CloudFront Functions."
    d:
      en: "URL redirects are a typical CloudFront Functions use case: the function returns the 301 response on the viewer request event."
      fr: "Les redirections d'URL sont un cas d'usage typique de CloudFront Functions : la fonction renvoie la réponse 301 sur l'événement de requête de l'utilisateur."
references:
  - title: Differences between CloudFront Functions and Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
