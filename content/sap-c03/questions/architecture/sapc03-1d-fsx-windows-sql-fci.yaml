id: sapc03-1d-fsx-windows-sql-fci
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Microsoft SQL Server Enterprise Edition on premises as a failover cluster instance on a Windows Server Failover Cluster that uses a shared SAN. The company is moving the cluster to Amazon EC2 and wants the two cluster nodes to run in different Availability Zones. The database files must be on shared storage that both nodes can access and that stays available if one Availability Zone fails. The company does not want to run storage replication software on the nodes and wants AWS to manage the storage.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute sur site Microsoft SQL Server Enterprise Edition en instance de cluster de basculement sur un cluster de basculement Windows Server (WSFC) qui utilise un SAN partagé. L'entreprise déplace le cluster vers Amazon EC2 et veut que les deux nœuds du cluster s'exécutent dans des zones de disponibilité différentes. Les fichiers de base de données doivent se trouver sur un stockage partagé auquel les deux nœuds peuvent accéder et qui reste disponible si une zone de disponibilité tombe en panne. L'entreprise ne veut pas exécuter de logiciel de réplication du stockage sur les nœuds et veut qu'AWS gère le stockage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach one Amazon EBS io2 Block Express volume with Multi-Attach enabled to both nodes, and store the database files on that volume."
        fr: "Attacher aux deux nœuds un seul volume Amazon EBS io2 Block Express avec Multi-Attach activé, et stocker les fichiers de base de données sur ce volume."
    - id: b
      text:
        en: "Create an Amazon EFS file system with mount targets in both Availability Zones, and store the database files on the file system."
        fr: "Créer un système de fichiers Amazon EFS avec des cibles de montage dans les deux zones de disponibilité, et stocker les fichiers de base de données sur ce système de fichiers."
    - id: c
      text:
        en: "Create an Amazon FSx for Windows File Server Multi-AZ file system, and store the database files on a continuously available SMB file share."
        fr: "Créer un système de fichiers Amazon FSx for Windows File Server Multi-AZ, et stocker les fichiers de base de données sur un partage de fichiers SMB à disponibilité continue."
    - id: d
      text:
        en: "Create an Amazon FSx for Lustre persistent file system, and mount it on both nodes with the Lustre client to store the database files."
        fr: "Créer un système de fichiers persistant Amazon FSx for Lustre, et le monter sur les deux nœuds avec le client Lustre pour stocker les fichiers de base de données."
answer: { optionId: c }
explanation:
  correct:
    en: |
      FSx for Windows File Server can be the shared storage of a SQL Server deployment on a Windows Server Failover Cluster, for the active data files and as a file share witness. A Multi-AZ file system keeps the share available when an Availability Zone fails, and continuously available shares, which SQL Server deployments require on Multi-AZ file systems, give the nodes uninterrupted access during failover.
    fr: |
      FSx for Windows File Server peut servir de stockage partagé à un déploiement SQL Server sur un cluster de basculement Windows Server, pour les fichiers de données actifs et comme témoin de partage de fichiers. Un système de fichiers Multi-AZ maintient le partage disponible en cas de panne d'une zone de disponibilité, et les partages à disponibilité continue, exigés pour SQL Server sur les systèmes de fichiers Multi-AZ, donnent aux nœuds un accès ininterrompu pendant le basculement.
  options:
    a:
      en: |
        A Multi-Attach volume can be attached only to instances in its own Availability Zone, so the nodes cannot run in different Availability Zones.
      fr: |
        Un volume Multi-Attach ne peut être attaché qu'à des instances de sa propre zone de disponibilité : les nœuds ne peuvent pas s'exécuter dans des zones de disponibilité différentes.
    b:
      en: |
        Amazon EFS provides NFS file systems for Linux workloads; it does not provide SMB shares for Windows SQL Server nodes.
      fr: |
        Amazon EFS fournit des systèmes de fichiers NFS pour des charges de travail Linux ; il ne fournit pas de partages SMB pour des nœuds SQL Server Windows.
    d:
      en: |
        The Lustre client runs on Linux, so Windows cluster nodes cannot mount the file system.
      fr: |
        Le client Lustre s'exécute sous Linux : des nœuds de cluster Windows ne peuvent pas monter le système de fichiers.
references:
  - title: Using FSx for Windows File Server with Microsoft SQL Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/sql-server.html
