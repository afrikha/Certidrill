id: sapc03-1d-mountpoint-genomics
objective: "1.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics research company stores 600 TB of sequencing files in an Amazon S3 bucket, with individual files of up to 200 GB. A pipeline of Linux tools on an Auto Scaling group of Amazon EC2 instances reads the input files through standard file system calls, mostly sequentially, and writes each result as a new file. The tools never modify existing files, use file locks or create symbolic links. Today, the pipeline copies each input file from S3 to local disk before processing, which delays every job. The company wants the tools to read the files in place with high throughput, without copying the data set and without provisioning file system storage or throughput capacity.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de recherche en génomique stocke 600 To de fichiers de séquençage dans un compartiment Amazon S3, avec des fichiers individuels pouvant atteindre 200 Go. Un pipeline d'outils Linux sur un groupe Auto Scaling d'instances Amazon EC2 lit les fichiers d'entrée par des appels système de fichiers standard, principalement de manière séquentielle, et écrit chaque résultat dans un nouveau fichier. Les outils ne modifient jamais de fichiers existants, n'utilisent pas de verrous de fichiers et ne créent pas de liens symboliques. Aujourd'hui, le pipeline copie chaque fichier d'entrée de S3 vers le disque local avant le traitement, ce qui retarde chaque tâche. L'entreprise veut que les outils lisent les fichiers sur place avec un débit élevé, sans copier le jeu de données et sans provisionner de capacité de stockage ou de débit de système de fichiers.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon FSx for Lustre file system linked to the bucket through a data repository association, and mount it on the instances."
        fr: "Créer un système de fichiers Amazon FSx for Lustre lié au compartiment par une association de référentiel de données, et le monter sur les instances."
    - id: b
      text:
        en: "Install Mountpoint for Amazon S3 on the instances, mount the bucket at a local path, and point the tools at that path."
        fr: "Installer Mountpoint for Amazon S3 sur les instances, monter le compartiment sur un chemin local et faire pointer les outils vers ce chemin."
    - id: c
      text:
        en: "Copy the data set to an Amazon EFS file system with AWS DataSync, and mount the file system on the instances with Elastic throughput."
        fr: "Copier le jeu de données vers un système de fichiers Amazon EFS avec AWS DataSync, et monter le système de fichiers sur les instances avec le débit Elastic."
    - id: d
      text:
        en: "Deploy an Amazon S3 File Gateway on an EC2 instance with a large cache volume, and mount its NFS file share on the instances."
        fr: "Déployer une passerelle Amazon S3 File Gateway sur une instance EC2 avec un grand volume de cache, et monter son partage de fichiers NFS sur les instances."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Mountpoint for Amazon S3 is a high-throughput open source file client for Linux that mounts a bucket as a local file system and translates file operations into S3 API calls, so data is read in place. It targets large-scale, read-heavy workloads, reads files of up to 50 TB and can create new files. It cannot modify existing files and does not support file locking or symbolic links, which these tools do not need.
    fr: |
      Mountpoint for Amazon S3 est un client de fichiers open source à haut débit pour Linux qui monte un compartiment comme système de fichiers local et traduit les opérations de fichiers en appels d'API S3 : les données sont lues sur place. Il vise les charges de travail à grande échelle et à forte lecture, lit des fichiers jusqu'à 50 To et peut créer de nouveaux fichiers. Il ne peut pas modifier de fichiers existants et ne prend en charge ni les verrous de fichiers ni les liens symboliques, dont ces outils n'ont pas besoin.
  options:
    a:
      en: |
        FSx for Lustre would work, but the company must provision its storage and throughput capacity, which it wants to avoid, and pay for a file system on top of S3.
      fr: |
        FSx for Lustre fonctionnerait, mais l'entreprise doit provisionner sa capacité de stockage et de débit, ce qu'elle veut éviter, et payer un système de fichiers en plus de S3.
    c:
      en: |
        DataSync copies the 600 TB into EFS, which creates a second copy of the data set that must be kept in sync.
      fr: |
        DataSync copie les 600 To dans EFS, ce qui crée une seconde copie du jeu de données qu'il faut maintenir synchronisée.
    d:
      en: |
        A file gateway is an appliance to size, patch and monitor, and its local cache would have to be large enough for files of up to 200 GB.
      fr: |
        Une passerelle de fichiers est une appliance à dimensionner, corriger et surveiller, et son cache local devrait être assez grand pour des fichiers pouvant atteindre 200 Go.
references:
  - title: Mount an Amazon S3 bucket as a local file system
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mountpoint.html
