id: sapc03-1a-sqs-burst-provisioned-pollers
objective: "1.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An AWS Lambda function processes messages from an Amazon SQS standard queue through an event source mapping that uses the default standard mode. Twice a day, a partner drops about 2 million messages into the queue at once. Each message takes about 1 second to process, and the business requires processing to reach about 3,000 concurrent invocations within 5 minutes of the start of a burst. The account uses the default Lambda concurrency quota of 1,000 in the Region, and other functions use about 200 of it. The company wants to keep the function and the queue.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une fonction AWS Lambda traite les messages d'une file d'attente Amazon SQS standard au moyen d'un mappage des sources d'événements qui utilise le mode standard par défaut. Deux fois par jour, un partenaire dépose environ 2 millions de messages d'un coup dans la file. Chaque message prend environ 1 seconde à traiter, et l'activité exige que le traitement atteigne environ 3 000 appels simultanés dans les 5 minutes suivant le début d'une rafale. Le compte utilise le quota de simultanéité Lambda par défaut de 1 000 dans la Région, dont les autres fonctions utilisent environ 200. L'entreprise veut conserver la fonction et la file d'attente.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Switch the event source mapping to provisioned mode, with a minimum number of event pollers sized for the bursts and a maximum that allows about 3,000 concurrent invocations.
        fr: |-
          Passer le mappage des sources d'événements en mode provisionné, avec un nombre minimal de sondeurs d'événements (event pollers) dimensionné pour les rafales et un maximum qui permet environ 3 000 appels simultanés.
    - id: b
      text:
        en: |-
          Keep standard mode and set the maximum concurrency of the event source mapping to 3,000 so that Lambda scales the pollers up to that value.
        fr: |-
          Conserver le mode standard et définir la simultanéité maximale du mappage des sources d'événements sur 3 000 pour que Lambda augmente le nombre de sondeurs jusqu'à cette valeur.
    - id: c
      text:
        en: |-
          Configure 3,000 units of provisioned concurrency on an alias of the function and point the event source mapping to the alias.
        fr: |-
          Configurer 3 000 unités de simultanéité provisionnée sur un alias de la fonction et faire pointer le mappage des sources d'événements vers l'alias.
    - id: d
      text:
        en: |-
          Request an increase of the Lambda concurrent executions quota in the Region through Service Quotas, to a value well above 3,200.
        fr: |-
          Demander, au moyen de Service Quotas, une augmentation du quota d'exécutions simultanées Lambda dans la Région, à une valeur nettement supérieure à 3 200.
    - id: e
      text:
        en: |-
          Increase the maximum batching window of the event source mapping to 300 seconds so that each invocation processes more messages.
        fr: |-
          Porter la fenêtre de traitement par lots maximale du mappage des sources d'événements à 300 secondes pour que chaque appel traite davantage de messages.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      In standard mode, an SQS event source mapping starts with 5 concurrent invocations, adds up to 300 per minute, and stops at 1,250, so it cannot reach 3,000 within 5 minutes. Provisioned mode keeps a minimum number of event pollers ready, scales up to 1,000 concurrency per minute, and reaches far higher concurrency. The account quota of 1,000 must also be raised, because the function and the other functions together need more than 3,000 concurrent executions.
    fr: |-
      En mode standard, un mappage des sources d'événements SQS démarre avec 5 appels simultanés, en ajoute jusqu'à 300 par minute et s'arrête à 1 250 : il ne peut pas atteindre 3 000 en 5 minutes. Le mode provisionné maintient un nombre minimal de sondeurs prêts, augmente jusqu'à 1 000 de simultanéité par minute et atteint une simultanéité bien plus élevée. Le quota du compte de 1 000 doit aussi être relevé, car la fonction et les autres fonctions ont besoin ensemble de plus de 3 000 exécutions simultanées.
  options:
    b:
      en: |-
        Maximum concurrency accepts values up to 1,000 and only limits scaling; it does not change the standard-mode scale-up rate or its 1,250 ceiling.
      fr: |-
        La simultanéité maximale accepte des valeurs jusqu'à 1 000 et ne fait que limiter la mise à l'échelle ; elle ne modifie ni le rythme d'augmentation du mode standard ni son plafond de 1 250.
    c:
      en: |-
        Provisioned concurrency pre-initializes execution environments, but the bottleneck is how fast the mapping polls the queue, and 3,000 units exceed the account quota.
      fr: |-
        La simultanéité provisionnée préinitialise des environnements d'exécution, mais le goulot d'étranglement est la vitesse à laquelle le mappage interroge la file, et 3 000 unités dépassent le quota du compte.
    e:
      en: |-
        A longer batching window delays invocations to gather messages and does not increase the number of concurrent invocations.
      fr: |-
        Une fenêtre de traitement par lots plus longue retarde les appels pour rassembler des messages et n'augmente pas le nombre d'appels simultanés.
references:
  - title: Configuring scaling behavior for SQS event source mappings - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-scaling.html
  - title: Understanding Lambda Event Function scaling - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
