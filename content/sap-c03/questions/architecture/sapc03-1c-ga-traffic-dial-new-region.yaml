id: sapc03-1c-ga-traffic-dial-new-region
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company serves players through an AWS Global Accelerator standard accelerator with endpoint groups in us-east-1 and ap-northeast-1. The company is adding an endpoint group in eu-central-1, which is closer to its European players. For the first week, only about 20% of the players who would be routed to eu-central-1 should be served there, and the rest of those players should be served by the next closest healthy Region. Players outside Europe must not be affected.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de jeux sert ses joueurs par un accélérateur standard AWS Global Accelerator avec des groupes de points de terminaison dans us-east-1 et ap-northeast-1. L'éditeur ajoute un groupe de points de terminaison dans eu-central-1, plus proche de ses joueurs européens. Pendant la première semaine, seuls 20 % environ des joueurs qui seraient routés vers eu-central-1 doivent y être servis, et les autres doivent être servis par la Région saine la plus proche suivante. Les joueurs situés hors d'Europe ne doivent pas être affectés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set the traffic dial of the eu-central-1 endpoint group to 20, and increase the dial as confidence in the new Region grows."
        fr: "Régler le cadran de trafic (traffic dial) du groupe de points de terminaison de eu-central-1 sur 20, et l'augmenter à mesure que la confiance dans la nouvelle Région grandit."
    - id: b
      text:
        en: "Set the weight of each endpoint in the eu-central-1 endpoint group to 20, and keep the default weights in the other endpoint groups."
        fr: "Régler sur 20 le poids de chaque point de terminaison du groupe de eu-central-1, et conserver les poids par défaut dans les autres groupes de points de terminaison."
    - id: c
      text:
        en: "Set the traffic dials of the us-east-1 and ap-northeast-1 endpoint groups to 80, and keep the eu-central-1 traffic dial at 100."
        fr: "Régler sur 80 les cadrans de trafic des groupes de points de terminaison de us-east-1 et ap-northeast-1, et laisser celui de eu-central-1 à 100."
    - id: d
      text:
        en: "Create Route 53 weighted records that send 20% of DNS queries to a second accelerator that contains only the eu-central-1 endpoint group."
        fr: "Créer des enregistrements pondérés Route 53 qui envoient 20 % des requêtes DNS vers un second accélérateur contenant uniquement le groupe de points de terminaison de eu-central-1."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A traffic dial sets the percentage of traffic for an endpoint group, and the percentage applies only to traffic that is already directed to that group. A dial of 20 on eu-central-1 keeps 20% of the players who would go there and sends the rest to other endpoint groups, while traffic directed to the other Regions is unchanged.
    fr: |-
      Un cadran de trafic définit le pourcentage de trafic d'un groupe de points de terminaison, et ce pourcentage ne s'applique qu'au trafic déjà dirigé vers ce groupe. Un cadran à 20 sur eu-central-1 garde 20 % des joueurs qui y iraient et envoie les autres vers d'autres groupes, tandis que le trafic dirigé vers les autres Régions ne change pas.
  options:
    b:
      en: |-
        Endpoint weights split traffic among the endpoints inside one endpoint group; equal weights in the group do not move any traffic to another Region.
      fr: |-
        Les poids des points de terminaison répartissent le trafic entre les points de terminaison d'un même groupe ; des poids égaux dans le groupe ne déplacent aucun trafic vers une autre Région.
    c:
      en: |-
        Dials on the other groups reduce traffic for players outside Europe and do not limit the traffic that goes to eu-central-1.
      fr: |-
        Des cadrans sur les autres groupes réduisent le trafic des joueurs hors d'Europe et ne limitent pas le trafic envoyé vers eu-central-1.
    d:
      en: |-
        This would send 20% of all players, from every continent, to eu-central-1 and would add a second set of static IP addresses.
      fr: |-
        Cela enverrait vers eu-central-1 20 % de tous les joueurs, de tous les continents, et ajouterait un second jeu d'adresses IP statiques.
references:
  - title: Use traffic dials to adjust traffic flow to Regions - AWS Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoint-groups-traffic-dial.html
