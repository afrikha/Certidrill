id: sapc03-1c-cloud-wan-global-segments
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A global company operates 400 VPCs in nine AWS Regions and connects its branch offices through AWS Site-to-Site VPN. Every VPC belongs to one of three environments: production, development or shared services. Production and development must never exchange traffic in any Region, and both must reach shared services. Today, the network team manages a transit gateway in each Region with full-mesh inter-Region peering, separate route tables per environment and static routes for the peering attachments. The team wants to describe the segmentation once, for all Regions, and wants new VPCs to be placed into the correct environment automatically based on their tags.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise internationale exploite 400 VPC dans neuf Régions AWS et relie ses agences par AWS Site-to-Site VPN. Chaque VPC appartient à l'un de trois environnements : production, développement ou services partagés. La production et le développement ne doivent jamais échanger de trafic, dans aucune Région, et tous deux doivent joindre les services partagés. Aujourd'hui, l'équipe réseau gère une passerelle de transit (transit gateway) par Région avec un appairage interrégional en maillage complet, des tables de routage distinctes par environnement et des routes statiques pour les attachements d'appairage. L'équipe veut décrire la segmentation une seule fois, pour toutes les Régions, et veut que les nouveaux VPC soient placés automatiquement dans le bon environnement selon leurs balises.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Keep the regional transit gateways, and use AWS Lambda functions triggered by VPC creation events to read tags, create attachments and update route tables in every Region."
        fr: "Conserver les passerelles de transit régionales, et utiliser des fonctions AWS Lambda déclenchées par les événements de création de VPC pour lire les balises, créer les attachements et mettre à jour les tables de routage dans chaque Région."
    - id: b
      text:
        en: "Create an Amazon VPC Lattice service network for each environment in each Region, and associate each VPC with the service network that matches its environment tag."
        fr: "Créer un réseau de services Amazon VPC Lattice par environnement dans chaque Région, et associer chaque VPC au réseau de services correspondant à sa balise d'environnement."
    - id: c
      text:
        en: "Create an AWS Cloud WAN core network whose policy defines the three segments, maps attachments to segments by tag and shares the shared services routes with the other segments."
        fr: "Créer un réseau central (core network) AWS Cloud WAN dont la politique définit les trois segments, associe les attachements aux segments par balise et partage les routes des services partagés avec les autres segments."
    - id: d
      text:
        en: "Replace the transit gateways with an AWS Direct Connect gateway, associate the VPCs' virtual private gateways with it, and use allowed prefixes to separate the environments."
        fr: "Remplacer les passerelles de transit par une passerelle Direct Connect, y associer les passerelles réseau privées virtuelles des VPC, et utiliser les préfixes autorisés pour séparer les environnements."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A Cloud WAN core network policy is a single declarative document that defines segments, Regional routing and how attachments map to segments. Segments are isolated routing domains across every Region in the policy, attachments are assigned to segments through their tags, and segment actions share routes, for example with a shared services segment. The core network edges peer with each other in a full mesh automatically.
    fr: |-
      Une politique de réseau central Cloud WAN est un document déclaratif unique qui définit les segments, le routage régional et l'association des attachements aux segments. Les segments sont des domaines de routage isolés dans toutes les Régions de la politique, les attachements sont affectés aux segments par leurs balises, et des actions de segment partagent des routes, par exemple avec un segment de services partagés. Les périphéries du réseau central (core network edges) s'appairent automatiquement en maillage complet.
  options:
    a:
      en: |-
        Custom functions rebuild in code what a managed policy provides, and the inter-Region static routes would still be managed by hand.
      fr: |-
        Des fonctions personnalisées recréent en code ce qu'offre une politique gérée, et les routes statiques interrégionales resteraient gérées à la main.
    b:
      en: |-
        VPC Lattice connects services at the application layer; it does not segment all IP traffic between VPCs and VPN-connected branches.
      fr: |-
        VPC Lattice relie des services au niveau de la couche application ; il ne segmente pas tout le trafic IP entre les VPC et les agences reliées par VPN.
    d:
      en: |-
        A Direct Connect gateway connects Direct Connect connections to VPCs; it does not route traffic between the VPCs associated with it.
      fr: |-
        Une passerelle Direct Connect relie des connexions Direct Connect à des VPC ; elle ne route pas le trafic entre les VPC qui lui sont associés.
references:
  - title: What is AWS Cloud WAN? - AWS Network Manager
    url: https://docs.aws.amazon.com/network-manager/latest/cloudwan/what-is-cloudwan.html
