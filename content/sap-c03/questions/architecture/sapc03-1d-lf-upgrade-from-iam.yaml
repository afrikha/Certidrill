id: sapc03-1d-lf-upgrade-from-iam
objective: "1.5.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A healthcare analytics company has a data lake in Amazon S3 that it built several years ago. The tables are in the AWS Glue Data Catalog, and access is controlled with IAM policies that allow s3:GetObject on data prefixes and glue:GetTable on the tables. The company has started to use AWS Lake Formation. A data lake administrator created a data filter that hides the patient_ssn column and returns only the rows of each analyst's hospital, and granted SELECT with the filter to the analyst role. Analysts who query the table with Amazon Athena still see every row and the patient_ssn column. The filter must be enforced for Athena, Amazon EMR and Amazon Redshift Spectrum, and principals must no longer be able to read the table data directly from S3.

    Which combination of actions will meet these requirements? (Choose three.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise d'analytique de santé dispose d'un lac de données dans Amazon S3 qu'elle a construit il y a plusieurs années. Les tables se trouvent dans AWS Glue Data Catalog, et l'accès est contrôlé par des politiques IAM qui autorisent s3:GetObject sur les préfixes de données et glue:GetTable sur les tables. L'entreprise a commencé à utiliser AWS Lake Formation. Un administrateur du lac de données a créé un filtre de données qui masque la colonne patient_ssn et ne renvoie que les lignes de l'hôpital de chaque analyste, puis a accordé SELECT avec ce filtre au rôle des analystes. Les analystes qui interrogent la table avec Amazon Athena voient pourtant toujours toutes les lignes et la colonne patient_ssn. Le filtre doit être appliqué pour Athena, Amazon EMR et Amazon Redshift Spectrum, et les principaux ne doivent plus pouvoir lire les données de la table directement dans S3.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez trois réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 3
  options:
    - id: a
      text:
        en: "Revoke the IAMAllowedPrincipals Super permission on the database and table, and clear Use only IAM access control for new tables."
        fr: "Révoquer l'autorisation Super d'IAMAllowedPrincipals sur la base de données et la table, et décocher Use only IAM access control pour les nouvelles tables."
    - id: b
      text:
        en: "Create an Athena workgroup for the analysts that enforces its settings and encrypts query results with an AWS KMS key."
        fr: "Créer pour les analystes un groupe de travail Athena qui impose ses paramètres et chiffre les résultats des requêtes avec une clé AWS KMS."
    - id: c
      text:
        en: "Register the S3 location of the table with Lake Formation by using a role that has access to the bucket."
        fr: "Enregistrer l'emplacement S3 de la table auprès de Lake Formation à l'aide d'un rôle qui a accès au compartiment."
    - id: d
      text:
        en: "Turn on S3 Block Public Access for the bucket and add a bucket policy that denies requests that do not use TLS."
        fr: "Activer le blocage de l'accès public S3 sur le compartiment et ajouter une politique de compartiment qui refuse les requêtes qui n'utilisent pas TLS."
    - id: e
      text:
        en: "Remove the s3:GetObject permissions on the data prefixes from the analyst role, and allow lakeformation:GetDataAccess instead."
        fr: "Retirer du rôle des analystes les autorisations s3:GetObject sur les préfixes de données et autoriser à la place lakeformation:GetDataAccess."
    - id: f
      text:
        en: "Recreate the data filter as an Athena view that excludes patient_ssn, and grant the analysts access to the view only."
        fr: "Recréer le filtre de données sous forme de vue Athena qui exclut patient_ssn, et n'accorder aux analystes l'accès qu'à cette vue."
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      By default, Lake Formation grants Super to IAMAllowedPrincipals on existing Data Catalog resources, so IAM and S3 policies alone still decide access and the filter is ignored; revoking it (and clearing the IAM-only default for new tables) makes Lake Formation permissions apply. Registering the S3 location lets Lake Formation vend temporary credentials to Athena, EMR and Redshift Spectrum. Removing the direct S3 permissions and allowing lakeformation:GetDataAccess makes principals reach the data only through Lake Formation.
    fr: |
      Par défaut, Lake Formation accorde Super à IAMAllowedPrincipals sur les ressources existantes de Data Catalog : seules les politiques IAM et S3 décident alors de l'accès et le filtre est ignoré ; le révoquer (et décocher le paramètre IAM seul pour les nouvelles tables) fait appliquer les autorisations Lake Formation. Enregistrer l'emplacement S3 permet à Lake Formation de fournir des informations d'identification temporaires à Athena, EMR et Redshift Spectrum. Retirer les autorisations S3 directes et autoriser lakeformation:GetDataAccess oblige les principaux à passer par Lake Formation pour atteindre les données.
  options:
    b:
      en: |
        Workgroup settings control query results, encryption and limits; they do not apply row or column filtering to the data.
      fr: |
        Les paramètres d'un groupe de travail contrôlent les résultats des requêtes, leur chiffrement et des limites ; ils n'appliquent aucun filtrage des lignes ou des colonnes aux données.
    d:
      en: |
        Block Public Access and a TLS-only policy protect against public and unencrypted access, but the analysts' IAM permissions would still read every file directly.
      fr: |
        Le blocage de l'accès public et une politique imposant TLS protègent contre l'accès public et non chiffré, mais les autorisations IAM des analystes leur permettraient toujours de lire chaque fichier directement.
    f:
      en: |
        An Athena view is not enforced by EMR or Redshift Spectrum, and the analysts would still have S3 access to the underlying files.
      fr: |
        Une vue Athena n'est appliquée ni par EMR ni par Redshift Spectrum, et les analystes auraient toujours un accès S3 aux fichiers sous-jacents.
references:
  - title: Upgrading AWS Glue data permissions to the AWS Lake Formation model
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/upgrade-glue-lake-formation.html
  - title: Data filtering and cell-level security in Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/data-filtering.html
