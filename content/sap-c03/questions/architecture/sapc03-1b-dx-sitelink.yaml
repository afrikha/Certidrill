id: sapc03-1b-dx-sitelink
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retailer has two data centers, in Frankfurt and in Paris. Each data center connects to AWS with an AWS Direct Connect connection at a nearby Direct Connect location and a transit virtual interface to the same Direct Connect gateway, which is associated with transit gateways in eu-central-1 and eu-west-3. The private MPLS link between the two data centers will be decommissioned next quarter. Replication traffic of about 2 Gbps between the data centers must then use a private path over the AWS global network with the lowest latency, and it must not be routed through any VPC or AWS Region.

    Which solution will meet these requirements?
  fr: |
    Un distributeur possède deux centres de données, à Francfort et à Paris. Chacun se connecte à AWS par une connexion AWS Direct Connect sur un emplacement Direct Connect proche et une interface virtuelle de transit vers la même passerelle Direct Connect, associée à des passerelles de transit dans eu-central-1 et eu-west-3. La liaison MPLS privée entre les deux centres de données sera supprimée le trimestre prochain. Le trafic de réplication d'environ 2 Gbit/s entre les centres de données devra alors emprunter un chemin privé sur le réseau mondial AWS avec la latence la plus faible, et il ne devra transiter par aucun VPC ni aucune Région AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an IPsec VPN tunnel between the firewalls of the two data centers over their internet connections, and advertise each data center's prefixes to the other with BGP over the tunnel."
        fr: "Créer un tunnel VPN IPsec entre les pare-feu des deux centres de données via leurs connexions Internet, et annoncer les préfixes de chaque centre de données à l'autre avec BGP dans le tunnel."
    - id: b
      text:
        en: "Create a peering attachment between the two transit gateways, and add static routes so that traffic between the data centers flows through both transit gateways and the peering attachment."
        fr: "Créer un attachement d'appairage entre les deux passerelles de transit, et ajouter des routes statiques afin que le trafic entre les centres de données traverse les deux passerelles de transit et l'attachement d'appairage."
    - id: c
      text:
        en: "Create an AWS Cloud WAN core network with edges in both Regions, and add Connect attachments that carry the traffic between the data centers through the core network edges."
        fr: "Créer un réseau principal AWS Cloud WAN avec des périphéries dans les deux Régions, et ajouter des attachements Connect qui transportent le trafic entre les centres de données via les périphéries du réseau principal."
    - id: d
      text:
        en: "Enable SiteLink on the transit virtual interfaces at both Direct Connect locations, keep them attached to the same Direct Connect gateway, and exchange the data center prefixes with BGP."
        fr: "Activer SiteLink sur les interfaces virtuelles de transit des deux emplacements Direct Connect, les garder attachées à la même passerelle Direct Connect, et échanger les préfixes des centres de données avec BGP."
answer: { optionId: d }
explanation:
  correct:
    en: "When SiteLink is enabled on virtual interfaces at two or more Direct Connect locations, traffic is sent between those locations over the AWS network, bypassing AWS Regions. The SiteLink-enabled virtual interfaces must connect to a Direct Connect gateway, and SiteLink requires BGP."
    fr: "Quand SiteLink est activé sur des interfaces virtuelles d'au moins deux emplacements Direct Connect, le trafic circule entre ces emplacements sur le réseau AWS en contournant les Régions AWS. Les interfaces virtuelles avec SiteLink doivent être connectées à une passerelle Direct Connect, et SiteLink exige BGP."
  options:
    a:
      en: "An internet VPN between the sites does not use the AWS global network and gives less consistent latency."
      fr: "Un VPN Internet entre les sites n'utilise pas le réseau mondial AWS et offre une latence moins constante."
    b:
      en: "Traffic would go through both transit gateways in two AWS Regions, which the requirement forbids, and would add latency and data processing charges."
      fr: "Le trafic traverserait les deux passerelles de transit dans deux Régions AWS, ce que l'exigence interdit, et ajouterait de la latence et des frais de traitement des données."
    c:
      en: "Cloud WAN core network edges run in AWS Regions, so the traffic between the data centers would still be routed through Regions."
      fr: "Les périphéries du réseau principal Cloud WAN s'exécutent dans des Régions AWS : le trafic entre les centres de données transiterait toujours par des Régions."
references:
  - title: "AWS Direct Connect | FAQ | Amazon Web Services (AWS)"
    url: https://aws.amazon.com/directconnect/faqs/
