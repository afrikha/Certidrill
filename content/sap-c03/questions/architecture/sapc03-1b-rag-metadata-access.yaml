id: sapc03-1b-rag-metadata-access
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting firm is building an internal assistant on Amazon Bedrock Knowledge Bases over 500,000 documents in Amazon S3 that belong to 40 practice areas. Each employee belongs to one or more practice areas, which the firm's identity provider returns as a claim in the employee's token. The assistant must retrieve only chunks from documents of the employee's practice areas, even if a question asks about another area. The documents stay in one S3 bucket, and the firm wants one knowledge base with the least operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un cabinet de conseil crée un assistant interne sur Amazon Bedrock Knowledge Bases à partir de 500 000 documents dans Amazon S3 qui appartiennent à 40 domaines d'expertise. Chaque employé appartient à un ou plusieurs domaines, que le fournisseur d'identité du cabinet renvoie comme revendication dans le jeton de l'employé. L'assistant ne doit récupérer que des fragments de documents des domaines de l'employé, même si une question porte sur un autre domaine. Les documents restent dans un seul compartiment S3, et le cabinet veut une seule base de connaissances avec le moins de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on implicit metadata filtering with a metadata schema that describes the practice_area attribute, so that the model generates the practice area filter from each question."
        fr: "Activer le filtrage implicite des métadonnées avec un schéma de métadonnées qui décrit l'attribut practice_area, afin que le modèle génère le filtre de domaine à partir de chaque question."
    - id: b
      text:
        en: "Add a .metadata.json file with a practice_area attribute for each document, sync the data source, and pass an in filter built from the token claim in each Retrieve or RetrieveAndGenerate call."
        fr: "Ajouter pour chaque document un fichier .metadata.json avec un attribut practice_area, synchroniser la source de données, et transmettre dans chaque appel Retrieve ou RetrieveAndGenerate un filtre in construit à partir de la revendication du jeton."
    - id: c
      text:
        en: "Create an Amazon Bedrock guardrail with one denied topic per practice area, and apply to each request the guardrail that blocks the areas the employee does not belong to."
        fr: "Créer une barrière de protection Amazon Bedrock avec un sujet refusé par domaine d'expertise, et appliquer à chaque requête la barrière qui bloque les domaines auxquels l'employé n'appartient pas."
    - id: d
      text:
        en: "Add an instruction to the prompt template of the knowledge base that tells the model to use only the retrieved sources whose practice areas are listed in the employee's token claim."
        fr: "Ajouter au modèle d'invite de la base de connaissances une instruction qui demande au modèle de n'utiliser que les sources récupérées dont les domaines figurent dans la revendication du jeton de l'employé."
answer: { optionId: b }
explanation:
  correct:
    en: "For S3 data sources, each file can have a fileName.extension.metadata.json companion file whose attributes are stored with its chunks. A metadata filter in the retrieval configuration, built by the application from the trusted token claim with the in operator, restricts the vector search to the employee's practice areas, whatever the question says."
    fr: "Pour les sources de données S3, chaque fichier peut avoir un fichier compagnon fileName.extension.metadata.json dont les attributs sont stockés avec ses fragments. Un filtre de métadonnées dans la configuration de récupération, construit par l'application à partir de la revendication fiable du jeton avec l'opérateur in, limite la recherche vectorielle aux domaines de l'employé, quoi que dise la question."
  options:
    a:
      en: "Implicit filtering lets the model derive filters from the user's question, so a question about another area would produce a filter for that area; it is not an access control."
      fr: "Le filtrage implicite laisse le modèle déduire les filtres de la question de l'utilisateur : une question sur un autre domaine produirait un filtre pour ce domaine, ce n'est pas un contrôle d'accès."
    c:
      en: "Guardrails filter content by topic in prompts and responses; they do not restrict retrieval by document metadata and would block legitimate answers that mention other areas."
      fr: "Les barrières de protection filtrent le contenu par sujet dans les invites et les réponses : elles ne restreignent pas la récupération selon les métadonnées des documents et bloqueraient des réponses légitimes mentionnant d'autres domaines."
    d:
      en: "The chunks of other areas are still retrieved and sent to the model, and a prompt instruction is not an enforced control."
      fr: "Les fragments des autres domaines sont toujours récupérés et envoyés au modèle, et une instruction d'invite n'est pas un contrôle appliqué."
references:
  - title: Configure and customize queries and response generation
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
