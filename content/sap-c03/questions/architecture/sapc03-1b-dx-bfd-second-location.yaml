id: sapc03-1b-dx-bfd-second-location
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company connects its data center to AWS with one 10 Gbps AWS Direct Connect dedicated connection at a single Direct Connect location, with a transit virtual interface to a Direct Connect gateway. A new critical workload requires connectivity that survives the failure of a connection, of an AWS device or of the whole Direct Connect location; one connection at each of two locations is acceptable. When a link fails, routing must also detect the failure in about one second instead of waiting for the BGP hold timer to expire.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de médias relie son centre de données à AWS par une seule connexion dédiée AWS Direct Connect de 10 Gbit/s sur un seul emplacement Direct Connect, avec une interface virtuelle de transit vers une passerelle Direct Connect. Une nouvelle charge de travail critique exige une connectivité qui résiste à la panne d'une connexion, d'un équipement AWS ou de l'emplacement Direct Connect entier ; une connexion sur chacun de deux emplacements est acceptable. Quand une liaison tombe en panne, le routage doit aussi détecter la panne en une seconde environ au lieu d'attendre l'expiration du temporisateur de maintien BGP.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure Bidirectional Forwarding Detection on the customer routers for the BGP sessions of each virtual interface."
        fr: "Configurer la détection de transfert bidirectionnel (BFD) sur les routeurs du client pour les sessions BGP de chaque interface virtuelle."
    - id: b
      text:
        en: "Order a second connection at the same location, and bundle both connections in a link aggregation group (LAG)."
        fr: "Commander une seconde connexion sur le même emplacement, et regrouper les deux connexions dans un groupe d'agrégation de liens (LAG)."
    - id: c
      text:
        en: "Order a connection at a second Direct Connect location with its own transit virtual interface to the same Direct Connect gateway."
        fr: "Commander une connexion sur un second emplacement Direct Connect avec sa propre interface virtuelle de transit vers la même passerelle Direct Connect."
    - id: d
      text:
        en: "Run a Direct Connect Resiliency Toolkit failover test on the existing virtual interface every month."
        fr: "Exécuter chaque mois un test de basculement du Direct Connect Resiliency Toolkit sur l'interface virtuelle existante."
    - id: e
      text:
        en: "Turn on ECMP for the Direct Connect gateway attachment on the transit gateway to which it is associated."
        fr: "Activer ECMP pour l'attachement de la passerelle Direct Connect sur la passerelle de transit à laquelle elle est associée."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Asynchronous BFD is enabled automatically on every Direct Connect virtual interface on the AWS side but takes effect only when it is configured on the customer router; AWS uses a 300 ms minimum interval with a multiplier of 3. One connection at each of multiple locations is the high resiliency model, which protects against connectivity, device and complete location failures."
    fr: "Le BFD asynchrone est activé automatiquement côté AWS sur chaque interface virtuelle Direct Connect, mais il ne prend effet que s'il est configuré sur le routeur du client ; AWS utilise un intervalle minimal de 300 ms avec un multiplicateur de 3. Une connexion sur chacun de plusieurs emplacements correspond au modèle de haute résilience, qui protège contre les pannes de connectivité, d'équipement et d'emplacement entier."
  options:
    b:
      en: "A LAG at the same location does not make connectivity more resilient: it does not protect against an AWS device failure or maintenance, nor against a location failure."
      fr: "Un LAG sur le même emplacement ne rend pas la connectivité plus résiliente : il ne protège ni contre une panne ou une maintenance d'équipement AWS, ni contre la panne de l'emplacement."
    d:
      en: "A failover test only verifies redundancy that already exists; with one connection, there is no redundant path to fail over to."
      fr: "Un test de basculement ne fait que vérifier une redondance existante : avec une seule connexion, il n'y a aucun chemin redondant vers lequel basculer."
    e:
      en: "ECMP spreads traffic across paths that already exist; it neither adds a second location nor speeds up failure detection."
      fr: "ECMP répartit le trafic sur des chemins déjà existants : il n'ajoute pas de second emplacement et n'accélère pas la détection des pannes."
references:
  - title: AWS Direct Connect Resiliency Toolkit
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/resilency_toolkit.html
  - title: "AWS Direct Connect | FAQ | Amazon Web Services (AWS)"
    url: https://aws.amazon.com/directconnect/faqs/
