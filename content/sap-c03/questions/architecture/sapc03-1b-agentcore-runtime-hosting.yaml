id: sapc03-1b-agentcore-runtime-hosting
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial advisory firm has built two AI agents with open source frameworks, one with LangGraph and one with Strands Agents. The agents call models in Amazon Bedrock and in another provider's API. Advisors run research sessions that can last several hours, and each session loads client documents into the agent's working files. Compliance requires that the compute, memory and file system of one advisor's session are never shared with another session, and are wiped when the session ends. The firm wants to keep its existing agent code and frameworks and does not want to manage servers, clusters or scaling.

    Which solution will meet these requirements?
  fr: |
    Un cabinet de conseil financier a créé deux agents d'IA avec des frameworks open source, l'un avec LangGraph et l'autre avec Strands Agents. Les agents appellent des modèles d'Amazon Bedrock et l'API d'un autre fournisseur. Les conseillers mènent des sessions de recherche qui peuvent durer plusieurs heures, et chaque session charge des documents clients dans les fichiers de travail de l'agent. La conformité exige que le calcul, la mémoire et le système de fichiers de la session d'un conseiller ne soient jamais partagés avec une autre session, et qu'ils soient effacés à la fin de la session. Le cabinet veut conserver son code d'agent et ses frameworks existants et ne veut gérer ni serveurs, ni clusters, ni mise à l'échelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Rebuild both agents as Amazon Bedrock Agents with action groups for their tools, and invoke the agents with a session ID per advisor so that Bedrock keeps each conversation separate."
        fr: "Reconstruire les deux agents comme des Amazon Bedrock Agents avec des groupes d'actions pour leurs outils, et invoquer les agents avec un ID de session par conseiller afin que Bedrock garde chaque conversation séparée."
    - id: b
      text:
        en: "Run both agents as an Amazon ECS service on AWS Fargate behind an Application Load Balancer with sticky sessions, and store each session's files in a separate directory of a shared Amazon EFS file system."
        fr: "Exécuter les deux agents comme un service Amazon ECS sur AWS Fargate derrière un Application Load Balancer avec sessions persistantes, et stocker les fichiers de chaque session dans un répertoire distinct d'un système de fichiers Amazon EFS partagé."
    - id: c
      text:
        en: "Run both agents on an Amazon EKS cluster with Karpenter, create one Kubernetes namespace per advisor, and delete the namespace and its persistent volumes when a session ends."
        fr: "Exécuter les deux agents sur un cluster Amazon EKS avec Karpenter, créer un espace de noms Kubernetes par conseiller, et supprimer l'espace de noms et ses volumes persistants à la fin d'une session."
    - id: d
      text:
        en: "Package each agent and deploy it to Amazon Bedrock AgentCore Runtime, and invoke the agent with a separate runtime session for each advisor's research session."
        fr: "Empaqueter chaque agent et le déployer sur Amazon Bedrock AgentCore Runtime, et invoquer l'agent avec une session d'exécution distincte pour chaque session de recherche d'un conseiller."
answer: { optionId: d }
explanation:
  correct:
    en: "AgentCore Runtime is a serverless host for agents built with any framework, such as LangGraph or Strands, and any model, inside or outside Amazon Bedrock. Each user session runs in a dedicated microVM with isolated CPU, memory and file system, which is terminated and sanitized when the session completes, and sessions can run for up to 8 hours on microVMs."
    fr: "AgentCore Runtime est un hébergement serverless pour des agents créés avec n'importe quel framework, comme LangGraph ou Strands, et n'importe quel modèle, dans Amazon Bedrock ou en dehors. Chaque session utilisateur s'exécute dans une microVM dédiée dont le processeur, la mémoire et le système de fichiers sont isolés, et qui est arrêtée et nettoyée à la fin de la session ; les sessions peuvent durer jusqu'à 8 heures sur des microVM."
  options:
    a:
      en: "Rebuilding the agents in Bedrock Agents abandons the existing LangGraph and Strands code, which the firm wants to keep."
      fr: "Reconstruire les agents dans Bedrock Agents abandonne le code LangGraph et Strands existant, que le cabinet veut conserver."
    b:
      en: "Sessions of different advisors would share tasks, memory and one file system, which breaks the isolation requirement, and the firm would manage the service and its scaling."
      fr: "Les sessions de conseillers différents partageraient des tâches, de la mémoire et un même système de fichiers, ce qui enfreint l'exigence d'isolation, et le cabinet gérerait le service et sa mise à l'échelle."
    c:
      en: "Namespaces do not isolate compute or memory between pods on shared nodes, and the firm would operate a cluster, which it wants to avoid."
      fr: "Les espaces de noms n'isolent pas le calcul ni la mémoire entre des pods sur des nœuds partagés, et le cabinet exploiterait un cluster, ce qu'il veut éviter."
references:
  - title: Host agent or tools with Amazon Bedrock AgentCore Runtime
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/agents-tools-runtime.html
