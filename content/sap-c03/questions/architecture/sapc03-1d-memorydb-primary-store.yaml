id: sapc03-1d-memorydb-primary-store
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company runs a seat reservation microservice that relies on Redis OSS data structures such as sorted sets and hashes. Today, the service writes each reservation both to an Amazon Aurora MySQL database and to an Amazon ElastiCache cluster, and bugs in this dual-write logic make the cache and the database disagree. The company wants a single data store for the service that keeps the Redis OSS-compatible API and data structures. Reads must have microsecond latency. Acknowledged writes must not be lost if a node or an Availability Zone fails.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de billetterie exécute un microservice de réservation de places qui s'appuie sur des structures de données Redis OSS comme les ensembles triés et les hachages. Aujourd'hui, le service écrit chaque réservation à la fois dans une base de données Amazon Aurora MySQL et dans un cluster Amazon ElastiCache, et des bogues dans cette logique de double écriture font diverger le cache et la base de données. L'entreprise veut un magasin de données unique pour le service qui conserve l'API et les structures de données compatibles Redis OSS. Les lectures doivent avoir une latence de l'ordre de la microseconde. Les écritures confirmées ne doivent pas être perdues si un nœud ou une zone de disponibilité tombe en panne.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Migrate the service data to an Amazon MemoryDB cluster with replicas in several Availability Zones, and remove Aurora and ElastiCache from the service."
        fr: "Migrer les données du service vers un cluster Amazon MemoryDB avec des réplicas dans plusieurs zones de disponibilité, et retirer Aurora et ElastiCache du service."
    - id: b
      text:
        en: "Keep only the ElastiCache cluster with Multi-AZ automatic failover and daily automatic backups, and remove Aurora from the service."
        fr: "Ne conserver que le cluster ElastiCache avec le basculement automatique Multi-AZ et des sauvegardes automatiques quotidiennes, et retirer Aurora du service."
    - id: c
      text:
        en: "Move the data to an Amazon DynamoDB table with DynamoDB Accelerator (DAX) in front of it, and rewrite the sorted-set logic with sort keys."
        fr: "Déplacer les données vers une table Amazon DynamoDB précédée de DynamoDB Accelerator (DAX), et réécrire la logique des ensembles triés avec des clés de tri."
    - id: d
      text:
        en: "Keep only Aurora MySQL, add Aurora Replicas in two more Availability Zones, and serve all reads from the cluster's reader endpoint."
        fr: "Ne conserver qu'Aurora MySQL, ajouter des réplicas Aurora dans deux autres zones de disponibilité, et servir toutes les lectures depuis le point de terminaison de lecteur du cluster."
answer: { optionId: a }
explanation:
  correct:
    en: |
      MemoryDB is a durable in-memory database compatible with Valkey and Redis OSS, so the service keeps its data structures and commands. It stores data durably across multiple Availability Zones in a Multi-AZ transactional log while serving microsecond reads, so it can be the primary database without a separate cache and durable store.
    fr: |
      MemoryDB est une base de données en mémoire durable compatible avec Valkey et Redis OSS : le service conserve ses structures de données et ses commandes. Il stocke les données de manière durable dans plusieurs zones de disponibilité grâce à un journal transactionnel Multi-AZ tout en servant des lectures en microsecondes : il peut être la base de données principale, sans cache ni magasin durable séparés.
  options:
    b:
      en: |
        ElastiCache replicates to its replicas asynchronously, so writes acknowledged by the primary can be lost at failover, and daily backups can lose up to a day of reservations.
      fr: |
        ElastiCache réplique vers ses réplicas de manière asynchrone : des écritures confirmées par le nœud principal peuvent être perdues lors d'un basculement, et des sauvegardes quotidiennes peuvent faire perdre jusqu'à une journée de réservations.
    c:
      en: |
        DynamoDB does not offer the Redis OSS API, so the service would be rewritten, and DAX caches only eventually consistent reads.
      fr: |
        DynamoDB n'offre pas l'API Redis OSS : le service devrait être réécrit, et DAX ne met en cache que les lectures à cohérence éventuelle.
    d:
      en: |
        Aurora reads take milliseconds, not microseconds, and the service would lose the Redis OSS data structures it relies on.
      fr: |
        Les lectures Aurora prennent des millisecondes et non des microsecondes, et le service perdrait les structures de données Redis OSS sur lesquelles il s'appuie.
references:
  - title: What is MemoryDB
    url: https://docs.aws.amazon.com/memorydb/latest/devguide/what-is-memorydb.html
