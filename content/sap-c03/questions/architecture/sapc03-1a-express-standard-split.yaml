id: sapc03-1a-express-standard-split
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An IoT company is designing two AWS Step Functions workflows. The first workflow runs for every telemetry event, at up to 2,000 events per second. It validates and transforms the event and writes it to an Amazon DynamoDB table with PutItem; every step is idempotent, and each run completes in less than 2 seconds. The company wants to minimize the cost of this workflow. The second workflow runs every night for each customer: it starts an AWS Glue job, waits until the job completes (up to 3 hours), and then issues an invoice through a billing API that is not idempotent. An invoice must never be issued twice.

    Which combination of workflow designs will meet these requirements? (Choose two.)
  fr: |
    Une entreprise IoT conçoit deux flux de travail AWS Step Functions. Le premier s'exécute pour chaque événement de télémétrie, jusqu'à 2 000 événements par seconde. Il valide et transforme l'événement, puis l'écrit dans une table Amazon DynamoDB avec PutItem ; chaque étape est idempotente, et chaque exécution se termine en moins de 2 secondes. L'entreprise veut réduire au minimum le coût de ce flux de travail. Le second s'exécute chaque nuit pour chaque client : il démarre une tâche AWS Glue, attend la fin de la tâche (jusqu'à 3 heures), puis émet une facture au moyen d'une API de facturation non idempotente. Une facture ne doit jamais être émise deux fois.

    Quelle combinaison de conceptions de flux de travail permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Implement the telemetry workflow as an asynchronous Express workflow.
        fr: |-
          Mettre en œuvre le flux de travail de télémétrie sous forme de flux de travail Express asynchrone.
    - id: b
      text:
        en: |-
          Implement the telemetry workflow as a Standard workflow to get exactly-once execution.
        fr: |-
          Mettre en œuvre le flux de travail de télémétrie sous forme de flux de travail Standard pour obtenir une exécution exactement une fois.
    - id: c
      text:
        en: |-
          Implement the billing workflow as a Standard workflow that starts the Glue job with the .sync integration pattern.
        fr: |-
          Mettre en œuvre le flux de travail de facturation sous forme de flux de travail Standard qui démarre la tâche Glue avec le modèle d'intégration .sync.
    - id: d
      text:
        en: |-
          Implement the billing workflow as an Express workflow that starts the Glue job with the .sync integration pattern.
        fr: |-
          Mettre en œuvre le flux de travail de facturation sous forme de flux de travail Express qui démarre la tâche Glue avec le modèle d'intégration .sync.
    - id: e
      text:
        en: |-
          Implement the billing workflow as an asynchronous Express workflow with a Retry field on the billing step.
        fr: |-
          Mettre en œuvre le flux de travail de facturation sous forme de flux de travail Express asynchrone avec un champ Retry sur l'étape de facturation.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Express workflows are priced by number of executions, duration, and memory and have no state transition rate limit, which suits high-volume, short, idempotent event processing; their asynchronous at-least-once semantics are acceptable because every step is idempotent. The billing workflow needs a Standard workflow: it can run for up to one year, supports the .sync job-run pattern to wait for the Glue job, and runs each state exactly once unless a Retry is configured.
    fr: |-
      Les flux de travail Express sont facturés au nombre d'exécutions, à la durée et à la mémoire et n'ont pas de limite de débit de transitions d'état, ce qui convient au traitement d'événements volumineux, courts et idempotents ; leur sémantique asynchrone au moins une fois est acceptable puisque chaque étape est idempotente. Le flux de facturation exige un flux de travail Standard : il peut s'exécuter jusqu'à un an, prend en charge le modèle d'exécution de tâche .sync pour attendre la tâche Glue et exécute chaque état exactement une fois, sauf si un Retry est configuré.
  options:
    b:
      en: |-
        Standard workflows are priced per state transition and have state transition quotas, which makes them costly and constrained at 2,000 short runs per second; exactly-once execution is not needed for idempotent steps.
      fr: |-
        Les flux de travail Standard sont facturés à la transition d'état et ont des quotas de transitions d'état, ce qui les rend coûteux et limités à 2 000 exécutions courtes par seconde ; l'exécution exactement une fois n'est pas nécessaire pour des étapes idempotentes.
    d:
      en: |-
        Express workflows do not support the .sync job-run pattern and last at most five minutes, so they cannot wait up to 3 hours for the Glue job.
      fr: |-
        Les flux de travail Express ne prennent pas en charge le modèle d'exécution de tâche .sync et durent au plus cinq minutes : ils ne peuvent pas attendre jusqu'à 3 heures la fin de la tâche Glue.
    e:
      en: |-
        Asynchronous Express workflows run at least once, so a run could issue an invoice twice, and they cannot last 3 hours.
      fr: |-
        Les flux de travail Express asynchrones s'exécutent au moins une fois : une exécution pourrait émettre une facture deux fois, et ils ne peuvent pas durer 3 heures.
references:
  - title: Choosing workflow type in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
