id: sapc03-1c-eks-anywhere-disconnected
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A defense contractor must run containerized analytics applications at three secure sites. Security policy forbids any network connection between the sites and the internet or AWS, and software updates arrive on approved removable media. The applications are packaged as Helm charts for Kubernetes. The contractor wants a Kubernetes distribution that is built by AWS and can be backed by a paid AWS support subscription. The contractor will use its existing VMware vSphere clusters at each site.

    Which solution will meet these requirements?
  fr: |
    Un sous-traitant de la défense doit exécuter des applications d'analytique conteneurisées sur trois sites sécurisés. La politique de sécurité interdit toute connexion réseau entre les sites et Internet ou AWS, et les mises à jour logicielles arrivent sur des supports amovibles approuvés. Les applications sont empaquetées sous forme de charts Helm pour Kubernetes. Le sous-traitant veut une distribution Kubernetes conçue par AWS et pouvant être couverte par un abonnement de support AWS payant. Il utilisera ses clusters VMware vSphere existants sur chaque site.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy Amazon EKS Anywhere clusters on vSphere at each site in an air-gapped configuration, and purchase EKS Anywhere Enterprise Subscriptions for support."
        fr: "Déployer des clusters Amazon EKS Anywhere sur vSphere dans chaque site en configuration isolée (air-gapped), et souscrire des abonnements EKS Anywhere Enterprise pour le support."
    - id: b
      text:
        en: "Join virtual machines at each site to an Amazon EKS cluster in the nearest Region as Amazon EKS Hybrid Nodes, and deploy the Helm charts to that cluster."
        fr: "Joindre des machines virtuelles de chaque site à un cluster Amazon EKS de la Région la plus proche en tant qu'Amazon EKS Hybrid Nodes, et déployer les charts Helm sur ce cluster."
    - id: c
      text:
        en: "Register virtual machines at each site as Amazon ECS Anywhere external instances, and convert the Helm charts to ECS task definitions."
        fr: "Enregistrer des machines virtuelles de chaque site comme instances externes Amazon ECS Anywhere, et convertir les charts Helm en définitions de tâches ECS."
    - id: d
      text:
        en: "Install an AWS Outposts server at each site, and run the applications on Amazon EKS worker nodes on the Outposts servers."
        fr: "Installer un serveur AWS Outposts dans chaque site, et exécuter les applications sur des nœuds de travail Amazon EKS des serveurs Outposts."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      EKS Anywhere runs Kubernetes clusters on customer-managed infrastructure such as vSphere, and AWS recommends it for disconnected environments, including air-gapped ones. Optional Enterprise Subscriptions add AWS support for the clusters.
    fr: |-
      EKS Anywhere exécute des clusters Kubernetes sur une infrastructure gérée par le client, comme vSphere, et AWS le recommande pour les environnements déconnectés, y compris isolés (air-gapped). Des abonnements Enterprise facultatifs ajoutent le support AWS des clusters.
  options:
    b:
      en: |-
        Hybrid Nodes need a reliable connection to the EKS control plane in the Region; AWS states that they are not a fit for disconnected environments.
      fr: |-
        Les Hybrid Nodes exigent une connexion fiable au plan de contrôle EKS de la Région ; AWS indique qu'ils ne conviennent pas aux environnements déconnectés.
    c:
      en: |-
        External instances must reach the ECS and Systems Manager endpoints in the Region, and the workloads are Kubernetes applications, not ECS tasks.
      fr: |-
        Les instances externes doivent joindre les points de terminaison ECS et Systems Manager de la Région, et les charges de travail sont des applications Kubernetes, pas des tâches ECS.
    d:
      en: |-
        Outposts servers rely on a service link to their parent Region and do not support EKS nodes.
      fr: |-
        Les serveurs Outposts dépendent d'une liaison de service (service link) vers leur Région parente et ne prennent pas en charge les nœuds EKS.
references:
  - title: Amazon EKS Hybrid Nodes overview - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/hybrid-nodes-overview.html
  - title: What is AWS Outposts? - AWS Outposts
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
