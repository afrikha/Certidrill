id: sapc03-1a-org-central-bus-regions
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an organization in AWS Organizations with 150 member accounts, and its workloads run in four AWS Regions. The security team wants selected AWS API call events from every account and every Region to be delivered to a custom event bus in a security account in us-east-1, where rules invoke analysis functions. The platform team creates new accounts every week, and they must be included automatically without manual steps. The central event bus must accept events only from accounts that belong to the organization. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une organisation AWS Organizations de 150 comptes membres, et ses charges de travail s'exécutent dans quatre Régions AWS. L'équipe de sécurité veut que certains événements d'appels d'API AWS de chaque compte et de chaque Région soient livrés à un bus d'événements personnalisé d'un compte de sécurité dans us-east-1, où des règles appellent des fonctions d'analyse. L'équipe plateforme crée de nouveaux comptes chaque semaine, et ceux-ci doivent être inclus automatiquement, sans étape manuelle. Le bus d'événements central ne doit accepter que les événements des comptes qui appartiennent à l'organisation. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add each member account ID to the resource-based policy of the central event bus, and have the platform team create the forwarding rule in each new account and Region as part of its account setup runbook.
        fr: |-
          Ajouter l'ID de chaque compte membre à la politique basée sur les ressources du bus d'événements central, et faire créer par l'équipe plateforme la règle de transfert dans chaque nouveau compte et chaque Région dans le cadre de sa procédure de création de compte.
    - id: b
      text:
        en: |-
          In every account and Region, create a rule on the default event bus that targets the analysis functions in the security account directly, with an execution role and a resource-based policy on each function.
        fr: |-
          Dans chaque compte et chaque Région, créer sur le bus d'événements par défaut une règle qui cible directement les fonctions d'analyse du compte de sécurité, avec un rôle d'exécution et une politique basée sur les ressources sur chaque fonction.
    - id: c
      text:
        en: |-
          Allow events:PutEvents on the central event bus with an aws:PrincipalOrgID condition, and deploy the forwarding rule and its IAM role to every account and Region with service-managed CloudFormation StackSets and automatic deployment.
        fr: |-
          Autoriser events:PutEvents sur le bus d'événements central avec une condition aws:PrincipalOrgID, et déployer la règle de transfert et son rôle IAM dans chaque compte et chaque Région avec CloudFormation StackSets à autorisations gérées par le service et déploiement automatique.
    - id: d
      text:
        en: |-
          In every account and Region, create a rule that publishes the events to an Amazon SNS topic, and subscribe an Amazon SQS queue in the security account to each topic for the analysis functions.
        fr: |-
          Dans chaque compte et chaque Région, créer une règle qui publie les événements dans une rubrique Amazon SNS, et abonner à chaque rubrique une file d'attente Amazon SQS du compte de sécurité pour les fonctions d'analyse.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A rule can target an event bus in another account and Region, and the receiving bus grants access through its resource-based policy, which can allow a whole organization instead of individual accounts. Accounts that get access through the organization need an IAM role on the sending rule, and service-managed StackSets with automatic deployment create the rule and the role in every new account and Region without manual steps.
    fr: |-
      Une règle peut cibler un bus d'événements d'un autre compte et d'une autre Région, et le bus récepteur accorde l'accès par sa politique basée sur les ressources, qui peut autoriser une organisation entière au lieu de comptes individuels. Les comptes qui obtiennent l'accès par l'organisation ont besoin d'un rôle IAM sur la règle d'envoi, et les StackSets à autorisations gérées par le service avec déploiement automatique créent la règle et le rôle dans chaque nouveau compte et chaque Région sans étape manuelle.
  options:
    a:
      en: |-
        Listing account IDs and following a runbook are manual steps for every new account, which the requirements exclude.
      fr: |-
        Lister les ID de compte et suivre une procédure sont des étapes manuelles pour chaque nouveau compte, ce que les exigences excluent.
    b:
      en: |-
        Direct delivery to a service target in another account works only in the same Region, so rules in the other three Regions could not invoke the functions in us-east-1, and every function needs its own policy.
      fr: |-
        La livraison directe à une cible de service d'un autre compte ne fonctionne que dans la même Région : les règles des trois autres Régions ne pourraient pas appeler les fonctions de us-east-1, et chaque fonction exige sa propre politique.
    d:
      en: |-
        Hundreds of topics and subscriptions must be created and maintained for each account and Region, and the events no longer arrive on a central event bus where rules can route them.
      fr: |-
        Des centaines de rubriques et d'abonnements doivent être créés et maintenus pour chaque compte et chaque Région, et les événements n'arrivent plus sur un bus d'événements central où des règles peuvent les acheminer.
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
  - title: Sending events to an AWS service in another account in EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-cross-account.html
