id: sapc03-1b-rag-s3-vectors
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical company is building a research assistant on Amazon Bedrock Knowledge Bases over 15 years of internal study reports stored in Amazon S3. Ingestion will produce about 200 million vector embeddings of floating-point type. About 300 researchers will query the assistant a few hundred times a day in total, and sub-second retrieval is acceptable. Queries use semantic search only, with metadata filters on the study year and therapeutic area. The company wants the lowest storage and query cost with no infrastructure to provision.

    Which solution will meet these requirements?
  fr: |
    Une entreprise pharmaceutique crée un assistant de recherche sur Amazon Bedrock Knowledge Bases à partir de 15 ans de rapports d'études internes stockés dans Amazon S3. L'ingestion produira environ 200 millions de vectorisations (embeddings) de type virgule flottante. Environ 300 chercheurs interrogeront l'assistant quelques centaines de fois par jour au total, et une récupération en moins d'une seconde est acceptable. Les requêtes n'utilisent que la recherche sémantique, avec des filtres de métadonnées sur l'année de l'étude et l'aire thérapeutique. L'entreprise veut le coût de stockage et de requête le plus bas, sans infrastructure à provisionner.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create the knowledge base with an Amazon OpenSearch Serverless vector collection, enable redundancy for availability, and use filterable metadata fields for the study year and therapeutic area."
        fr: "Créer la base de connaissances avec une collection vectorielle Amazon OpenSearch Serverless, activer la redondance pour la disponibilité, et utiliser des champs de métadonnées filtrables pour l'année de l'étude et l'aire thérapeutique."
    - id: b
      text:
        en: "Create the knowledge base with an Amazon Aurora PostgreSQL-Compatible cluster that uses pgvector on provisioned instances sized for the full set of vectors, with metadata columns for filtering."
        fr: "Créer la base de connaissances avec un cluster Amazon Aurora compatible avec PostgreSQL qui utilise pgvector sur des instances provisionnées dimensionnées pour l'ensemble des vecteurs, avec des colonnes de métadonnées pour le filtrage."
    - id: c
      text:
        en: "Create the knowledge base with an Amazon Neptune Analytics graph that has a vector search index, so that GraphRAG stores the embeddings and the metadata used for filtering."
        fr: "Créer la base de connaissances avec un graphe Amazon Neptune Analytics doté d'un index de recherche vectorielle, afin que GraphRAG stocke les vectorisations et les métadonnées utilisées pour le filtrage."
    - id: d
      text:
        en: "Create the knowledge base with a vector index in an Amazon S3 vector bucket as the vector store, use fixed-size chunking, and filter on the metadata of the vectors."
        fr: "Créer la base de connaissances avec un index vectoriel dans un compartiment de vecteurs Amazon S3 comme magasin vectoriel, utiliser le découpage de taille fixe et filtrer sur les métadonnées des vecteurs."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon S3 Vectors is purpose-built, cost-optimized vector storage with nothing to provision, and it is ideal for less frequent queries, with sub-second latency. A knowledge base can use an S3 vector index as its vector store, metadata is filterable by default, and S3 Vectors stores floating-point embeddings. Fixed-size chunking avoids hierarchical chunking, which is not recommended with S3 vector buckets."
    fr: "Amazon S3 Vectors est un stockage vectoriel conçu pour réduire les coûts, sans rien à provisionner, idéal pour des requêtes peu fréquentes avec une latence inférieure à la seconde. Une base de connaissances peut utiliser un index vectoriel S3 comme magasin vectoriel, les métadonnées sont filtrables par défaut, et S3 Vectors stocke des vectorisations en virgule flottante. Le découpage de taille fixe évite le découpage hiérarchique, déconseillé avec les compartiments de vecteurs S3."
  options:
    a:
      en: "OpenSearch Serverless is built for high query rates and low latency; its compute capacity is billed even when the assistant is mostly idle, so it costs more for this query volume."
      fr: "OpenSearch Serverless est conçu pour des débits de requêtes élevés et une faible latence : sa capacité de calcul est facturée même quand l'assistant est presque inactif, ce qui coûte plus cher pour ce volume de requêtes."
    b:
      en: "Provisioned Aurora instances sized for 200 million vectors run around the clock and require capacity planning, which raises cost for a few hundred queries a day."
      fr: "Des instances Aurora provisionnées dimensionnées pour 200 millions de vecteurs tournent en continu et demandent une planification de capacité, ce qui augmente le coût pour quelques centaines de requêtes par jour."
    c:
      en: "GraphRAG targets relationships between entities, which the queries do not need, and Neptune Analytics graphs are provisioned without autoscaling."
      fr: "GraphRAG vise les relations entre entités, dont les requêtes n'ont pas besoin, et les graphes Neptune Analytics sont provisionnés sans mise à l'échelle automatique."
references:
  - title: Working with S3 Vectors and vector buckets
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-vectors.html
  - title: How content chunking works for knowledge bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
