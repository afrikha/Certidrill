id: sapc03-1d-rds-db2-vendor-app
objective: "1.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs a vendor-supplied warehouse management application on IBM Db2 in its data center. The application uses Db2-specific SQL and stored procedures, and the vendor supports it only on Db2. The company is closing the data center and wants AWS to manage database backups, patching and a standby in another Availability Zone. The company does not want to manage database hosts or operating systems.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute dans son centre de données une application de gestion d'entrepôt fournie par un éditeur sur IBM Db2. L'application utilise du SQL et des procédures stockées propres à Db2, et l'éditeur ne la prend en charge que sur Db2. L'entreprise ferme le centre de données et veut qu'AWS gère les sauvegardes de la base de données, l'application des correctifs et une instance de secours dans une autre zone de disponibilité. L'entreprise ne veut gérer ni les hôtes de base de données ni les systèmes d'exploitation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Convert the schema and stored procedures to Amazon Aurora PostgreSQL with the AWS Schema Conversion Tool (AWS SCT), and migrate the data with AWS DMS."
        fr: "Convertir le schéma et les procédures stockées vers Amazon Aurora PostgreSQL avec AWS Schema Conversion Tool (AWS SCT), et migrer les données avec AWS DMS."
    - id: b
      text:
        en: "Install Db2 on Amazon EC2 instances in two Availability Zones, and configure Db2 high availability disaster recovery between the instances."
        fr: "Installer Db2 sur des instances Amazon EC2 dans deux zones de disponibilité, et configurer la reprise après sinistre haute disponibilité de Db2 entre les instances."
    - id: c
      text:
        en: "Migrate the database to Amazon RDS for Db2 with a Multi-AZ deployment, and point the application at the RDS endpoint."
        fr: "Migrer la base de données vers Amazon RDS for Db2 avec un déploiement Multi-AZ, et faire pointer l'application vers le point de terminaison RDS."
    - id: d
      text:
        en: "Load the Db2 tables into an Amazon Redshift provisioned cluster, and rewrite the stored procedures as Redshift stored procedures."
        fr: "Charger les tables Db2 dans un cluster provisionné Amazon Redshift, et réécrire les procédures stockées sous forme de procédures stockées Redshift."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Amazon RDS for Db2 runs the Db2 engine as a managed service, so the application keeps its Db2 SQL and stored procedures. RDS handles backups, point-in-time restore and patching, supports Multi-AZ deployments for failover, and gives no shell or SSH access to the hosts, which the company does not need.
    fr: |
      Amazon RDS for Db2 exécute le moteur Db2 en tant que service géré : l'application conserve son SQL Db2 et ses procédures stockées. RDS gère les sauvegardes, la restauration à un instant dans le passé et les correctifs, prend en charge les déploiements Multi-AZ pour le basculement, et ne donne aucun accès shell ou SSH aux hôtes, dont l'entreprise n'a pas besoin.
  options:
    a:
      en: |
        Converting to PostgreSQL changes the application's SQL and procedures, which the vendor does not support.
      fr: |
        La conversion vers PostgreSQL modifie le SQL et les procédures de l'application, ce que l'éditeur ne prend pas en charge.
    b:
      en: |
        Db2 on EC2 keeps the engine, but the company would manage the hosts, operating systems, patching and failover itself.
      fr: |
        Db2 sur EC2 conserve le moteur, mais l'entreprise gérerait elle-même les hôtes, les systèmes d'exploitation, les correctifs et le basculement.
    d:
      en: |
        Redshift is an analytics warehouse, not a transactional engine for this application, and rewriting the procedures breaks vendor support.
      fr: |
        Redshift est un entrepôt analytique, pas un moteur transactionnel pour cette application, et réécrire les procédures met fin au support de l'éditeur.
references:
  - title: Amazon RDS for Db2
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Db2.html
