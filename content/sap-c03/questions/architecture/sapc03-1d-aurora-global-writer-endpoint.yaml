id: sapc03-1d-aurora-global-writer-endpoint
objective: "1.5.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs an Amazon Aurora PostgreSQL DB cluster in eu-central-1 for its order service. The company needs a disaster recovery copy of the database in eu-west-1 with an RPO measured in seconds. Twice a year, the company must move the primary Region to eu-west-1 for a planned test without losing data, and then move it back. After the primary Region changes, the applications must keep the same database connection string. The company wants the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise de distribution exécute un cluster de bases de données Amazon Aurora PostgreSQL dans eu-central-1 pour son service de commandes. L'entreprise a besoin d'une copie de reprise après sinistre de la base de données dans eu-west-1 avec un RPO de l'ordre de quelques secondes. Deux fois par an, l'entreprise doit déplacer la Région principale vers eu-west-1 pour un test planifié sans perte de données, puis la ramener. Après le changement de Région principale, les applications doivent conserver la même chaîne de connexion à la base de données. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Convert the cluster to an Aurora global database with a secondary cluster in eu-west-1, and use a switchover for the planned tests."
        fr: "Convertir le cluster en base de données globale Aurora avec un cluster secondaire dans eu-west-1, et utiliser une permutation (switchover) pour les tests planifiés."
    - id: b
      text:
        en: "Create an Amazon Route 53 failover record that points to the cluster endpoint in each Region, with health checks on the database port."
        fr: "Créer un enregistrement de basculement Amazon Route 53 qui pointe vers le point de terminaison du cluster dans chaque Région, avec des vérifications de l'état sur le port de la base de données."
    - id: c
      text:
        en: "Configure AWS Backup to copy cluster snapshots to eu-west-1 every hour, and restore the latest snapshot there for each planned test."
        fr: "Configurer AWS Backup pour copier des instantanés du cluster vers eu-west-1 toutes les heures, et y restaurer le dernier instantané pour chaque test planifié."
    - id: d
      text:
        en: "Configure the applications to connect to the global writer endpoint of the global database instead of the cluster endpoint."
        fr: "Configurer les applications pour qu'elles se connectent au point de terminaison d'enregistreur global de la base de données globale au lieu du point de terminaison du cluster."
    - id: e
      text:
        en: "Add two Aurora Replicas in other Availability Zones of eu-central-1, and set their failover priority to tier 0."
        fr: "Ajouter deux réplicas Aurora dans d'autres zones de disponibilité de eu-central-1, et définir leur priorité de basculement sur le niveau 0."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      An Aurora global database replicates to a secondary Region with an RPO typically measured in seconds, and a managed switchover moves the primary Region for planned events without data loss. The global writer endpoint always points to the writer of the current primary cluster, and Aurora updates it after a switchover or failover, so applications keep the same connection string.
    fr: |
      Une base de données globale Aurora réplique vers une Région secondaire avec un RPO généralement de l'ordre de quelques secondes, et une permutation gérée déplace la Région principale lors d'événements planifiés sans perte de données. Le point de terminaison d'enregistreur global pointe toujours vers l'enregistreur du cluster principal actuel, et Aurora le met à jour après une permutation ou un basculement : les applications conservent la même chaîne de connexion.
  options:
    b:
      en: |
        Route 53 only changes DNS answers; it does not create the replica or promote it, and its health checkers cannot reach a database that has only private addresses.
      fr: |
        Route 53 ne fait que modifier les réponses DNS ; il ne crée pas le réplica et ne le promeut pas, et ses vérificateurs d'état ne peuvent pas atteindre une base de données qui n'a que des adresses privées.
    c:
      en: |
        Hourly snapshot copies give an RPO of up to an hour, and restoring a snapshot creates a new cluster with a new endpoint.
      fr: |
        Des copies horaires d'instantanés donnent un RPO pouvant atteindre une heure, et la restauration d'un instantané crée un nouveau cluster avec un nouveau point de terminaison.
    e:
      en: |
        Aurora Replicas protect against an Availability Zone failure inside eu-central-1 only; they provide no copy in eu-west-1.
      fr: |
        Les réplicas Aurora ne protègent que contre la panne d'une zone de disponibilité dans eu-central-1 ; ils ne fournissent aucune copie dans eu-west-1.
references:
  - title: Connecting to Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-connecting.html
