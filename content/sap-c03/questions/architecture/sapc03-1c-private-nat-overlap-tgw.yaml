id: sapc03-1c-private-nat-overlap-tgw
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company acquired a business whose application VPC uses 10.0.0.0/16, the same CIDR block as one of the company's VPCs in the same Region. Workloads in the acquired VPC must initiate connections to an internal API behind an Application Load Balancer in the company's VPC. Renumbering either VPC is not possible before the integration deadline. The security team requires all traffic between the two VPCs to pass through the company's existing transit gateway so that it can be inspected and logged centrally.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a racheté une société dont le VPC applicatif utilise 10.0.0.0/16, le même bloc CIDR que l'un des VPC de l'entreprise dans la même Région. Les charges de travail du VPC racheté doivent initier des connexions vers une API interne placée derrière un Application Load Balancer dans le VPC de l'entreprise. Renuméroter l'un ou l'autre VPC est impossible avant l'échéance d'intégration. L'équipe de sécurité exige que tout le trafic entre les deux VPC passe par la passerelle de transit (transit gateway) existante de l'entreprise, afin d'être inspecté et journalisé de façon centralisée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach both VPCs to the transit gateway with route propagation enabled, and add routes for 10.0.0.0/16 to the transit gateway in the route tables of both VPCs."
        fr: "Attacher les deux VPC à la passerelle de transit avec la propagation de routes activée, et ajouter dans les tables de routage des deux VPC des routes pour 10.0.0.0/16 vers la passerelle de transit."
    - id: b
      text:
        en: "Add routable non-overlapping CIDR blocks to both VPCs, put a private NAT gateway and the ALB in routable subnets, and attach the routable subnets to the transit gateway with static routes."
        fr: "Ajouter aux deux VPC des blocs CIDR routables sans chevauchement, placer une passerelle NAT privée et l'ALB dans des sous-réseaux routables, et attacher ces sous-réseaux à la passerelle de transit avec des routes statiques."
    - id: c
      text:
        en: "Create a VPC endpoint service with a Network Load Balancer in front of the ALB in the company's VPC, and create an interface endpoint for it in the acquired VPC's application subnets."
        fr: "Créer un service de point de terminaison VPC avec un Network Load Balancer devant l'ALB dans le VPC de l'entreprise, et créer un point de terminaison d'interface vers ce service dans les sous-réseaux applicatifs du VPC racheté."
    - id: d
      text:
        en: "Create a VPC peering connection between the two VPCs, and add routes for the ALB subnets' CIDR blocks to the peering connection in the acquired VPC's route tables."
        fr: "Créer une connexion d'appairage de VPC entre les deux VPC, et ajouter dans les tables de routage du VPC racheté des routes pour les blocs CIDR des sous-réseaux de l'ALB vers la connexion d'appairage."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A private NAT gateway lets networks with overlapping CIDR ranges communicate. Each VPC receives a routable range, traffic from the acquired workloads is translated to the NAT gateway's routable address, and the transit gateway routes only the routable ranges, with static routes and propagation disabled. The ALB in the routable range replies to the NAT gateway's address, so all traffic flows through the transit gateway.
    fr: |-
      Une passerelle NAT privée permet à des réseaux dont les plages CIDR se chevauchent de communiquer. Chaque VPC reçoit une plage routable, le trafic des charges de travail rachetées est traduit vers l'adresse routable de la passerelle NAT, et la passerelle de transit ne route que les plages routables, avec des routes statiques et la propagation désactivée. L'ALB, dans la plage routable, répond à l'adresse de la passerelle NAT : tout le trafic passe par la passerelle de transit.
  options:
    a:
      en: |-
        A transit gateway cannot route between two attachments that use the same CIDR block; the routes conflict.
      fr: |-
        Une passerelle de transit ne peut pas router entre deux attachements qui utilisent le même bloc CIDR : les routes entrent en conflit.
    c:
      en: |-
        PrivateLink solves the overlap, but its traffic does not pass through the transit gateway, which the security team requires.
      fr: |-
        PrivateLink résout le chevauchement, mais son trafic ne passe pas par la passerelle de transit, ce qu'exige l'équipe de sécurité.
    d:
      en: |-
        VPC peering cannot be created between VPCs with overlapping CIDR blocks, and it would bypass the transit gateway.
      fr: |-
        Un appairage de VPC ne peut pas être créé entre des VPC dont les blocs CIDR se chevauchent, et il contournerait la passerelle de transit.
references:
  - title: NAT gateway use cases - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-scenarios.html
