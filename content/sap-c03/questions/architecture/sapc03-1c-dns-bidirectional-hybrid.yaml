id: sapc03-1c-dns-bidirectional-hybrid
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is connecting its data center to a VPC in ap-southeast-2 through AWS Direct Connect. Workloads in the VPC must resolve names in the on-premises domain corp.example.com, which is hosted on on-premises DNS servers. On-premises clients must resolve names in a Route 53 private hosted zone named cloud.example.com that is associated with the VPC. The company wants managed DNS components in AWS and does not want to run DNS servers on Amazon EC2.

    Which combination of steps will meet these requirements? (Choose three.)
  fr: |
    Une entreprise relie son centre de données à un VPC de ap-southeast-2 par AWS Direct Connect. Les charges de travail du VPC doivent résoudre les noms du domaine sur site corp.example.com, hébergé sur des serveurs DNS sur site. Les clients sur site doivent résoudre les noms d'une zone hébergée privée Route 53 nommée cloud.example.com, associée au VPC. L'entreprise veut des composants DNS gérés dans AWS et ne veut pas exécuter de serveurs DNS sur Amazon EC2.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: "Create a Route 53 Resolver inbound endpoint in the VPC with IP addresses in two Availability Zones."
        fr: "Créer un point de terminaison entrant Route 53 Resolver dans le VPC avec des adresses IP dans deux zones de disponibilité."
    - id: b
      text:
        en: "Create a DHCP options set for the VPC that lists the on-premises DNS servers as the domain name servers."
        fr: "Créer pour le VPC un jeu d'options DHCP qui indique les serveurs DNS sur site comme serveurs de noms de domaine."
    - id: c
      text:
        en: "Create a Route 53 Resolver outbound endpoint in the VPC and a forwarding rule for corp.example.com that targets the on-premises DNS servers, and associate the rule with the VPC."
        fr: "Créer un point de terminaison sortant Route 53 Resolver dans le VPC et une règle de transfert pour corp.example.com qui cible les serveurs DNS sur site, et associer la règle au VPC."
    - id: d
      text:
        en: "Create a Route 53 Resolver system rule for corp.example.com, and associate the rule with the VPC."
        fr: "Créer une règle système Route 53 Resolver pour corp.example.com, et associer la règle au VPC."
    - id: e
      text:
        en: "Configure conditional forwarders for cloud.example.com on the on-premises DNS servers that target the IP addresses of the inbound endpoint."
        fr: "Configurer sur les serveurs DNS sur site des redirecteurs conditionnels pour cloud.example.com qui ciblent les adresses IP du point de terminaison entrant."
    - id: f
      text:
        en: "Configure conditional forwarders for cloud.example.com on the on-premises DNS servers that target the IP addresses of the outbound endpoint."
        fr: "Configurer sur les serveurs DNS sur site des redirecteurs conditionnels pour cloud.example.com qui ciblent les adresses IP du point de terminaison sortant."
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      Queries from on premises reach Route 53 Resolver through an inbound endpoint, so the on-premises servers forward cloud.example.com to the inbound endpoint's addresses. Queries from the VPC for corp.example.com leave through an outbound endpoint according to a forwarding rule associated with the VPC.
    fr: |-
      Les requêtes venant du site atteignent Route 53 Resolver par un point de terminaison entrant : les serveurs sur site transfèrent donc cloud.example.com aux adresses du point de terminaison entrant. Les requêtes du VPC pour corp.example.com sortent par un point de terminaison sortant, selon une règle de transfert associée au VPC.
  options:
    b:
      en: |-
        Pointing the instances at the on-premises servers bypasses Route 53 Resolver, so cloud.example.com would no longer resolve directly and VPC name resolution would depend on the data center.
      fr: |-
        Faire pointer les instances vers les serveurs sur site contourne Route 53 Resolver : cloud.example.com ne serait plus résolu directement et la résolution de noms du VPC dépendrait du centre de données.
    d:
      en: |-
        A system rule makes Resolver resolve the domain itself instead of forwarding it, so corp.example.com would never reach the on-premises servers.
      fr: |-
        Une règle système fait résoudre le domaine par Resolver lui-même au lieu de le transférer : corp.example.com n'atteindrait jamais les serveurs sur site.
    f:
      en: |-
        Outbound endpoints only send queries from the VPC; they do not accept queries from on premises.
      fr: |-
        Les points de terminaison sortants ne font qu'envoyer des requêtes depuis le VPC ; ils n'acceptent pas de requêtes venant du site.
references:
  - title: Forwarding inbound DNS queries to your VPCs - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries.html
  - title: Managing forwarding rules - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-rules-managing.html
