id: sapc03-1a-fargate-private-ecr-endpoints
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A financial company runs containerized microservices as Amazon ECS tasks on AWS Fargate platform version 1.4.0. For compliance, the tasks run in private subnets of a VPC that has no internet gateway and no NAT gateway. The images are stored in a private Amazon ECR repository in the same Region. The task definitions do not reference secrets, and the application containers send their logs directly to an internal log collector in the VPC instead of using the awslogs driver. The new tasks fail to start because they cannot pull their images.

    Which VPC endpoints must the company create so that the tasks can pull their images? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise financière exécute des microservices conteneurisés sous forme de tâches Amazon ECS sur AWS Fargate, version de plateforme 1.4.0. Pour la conformité, les tâches s'exécutent dans les sous-réseaux privés d'un VPC sans passerelle Internet ni passerelle NAT. Les images sont stockées dans un référentiel privé Amazon ECR de la même Région. Les définitions de tâche ne font référence à aucun secret, et les conteneurs d'application envoient leurs journaux directement à un collecteur interne du VPC au lieu d'utiliser le pilote awslogs. Les nouvelles tâches ne démarrent pas, car elles ne parviennent pas à extraire leurs images.

    Quels points de terminaison de VPC l'entreprise doit-elle créer pour que les tâches puissent extraire leurs images ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: |-
          An interface endpoint for com.amazonaws.region.ecr.dkr with private DNS enabled
        fr: |-
          Un point de terminaison d'interface pour com.amazonaws.region.ecr.dkr avec le DNS privé activé
    - id: b
      text:
        en: |-
          An interface endpoint for com.amazonaws.region.ecr.api
        fr: |-
          Un point de terminaison d'interface pour com.amazonaws.region.ecr.api
    - id: c
      text:
        en: |-
          A gateway endpoint for Amazon S3 associated with the route tables of the private subnets
        fr: |-
          Un point de terminaison de passerelle pour Amazon S3 associé aux tables de routage des sous-réseaux privés
    - id: d
      text:
        en: |-
          An interface endpoint for com.amazonaws.region.logs
        fr: |-
          Un point de terminaison d'interface pour com.amazonaws.region.logs
    - id: e
      text:
        en: |-
          An interface endpoint for com.amazonaws.region.secretsmanager
        fr: |-
          Un point de terminaison d'interface pour com.amazonaws.region.secretsmanager
    - id: f
      text:
        en: |-
          A gateway endpoint for Amazon DynamoDB associated with the route tables of the private subnets
        fr: |-
          Un point de terminaison de passerelle pour Amazon DynamoDB associé aux tables de routage des sous-réseaux privés
answer: { optionIds: [ a, b, c ] }
explanation:
  correct:
    en: |-
      Fargate tasks on platform version 1.4.0 or later need the ecr.dkr and ecr.api interface endpoints and the Amazon S3 gateway endpoint to pull from a private repository. The ecr.dkr endpoint (with private DNS) serves the Docker pull calls, ecr.api serves the ECR API calls, and the S3 endpoint is required because ECR stores the image layers in S3.
    fr: |-
      Les tâches Fargate en version de plateforme 1.4.0 ou ultérieure ont besoin des points de terminaison d'interface ecr.dkr et ecr.api et du point de terminaison de passerelle Amazon S3 pour extraire des images d'un référentiel privé. Le point de terminaison ecr.dkr (avec DNS privé) traite les appels d'extraction Docker, ecr.api traite les appels d'API ECR, et le point de terminaison S3 est nécessaire, car ECR stocke les couches des images dans S3.
  options:
    d:
      en: |-
        The logs endpoint is needed only for tasks that use the awslogs driver in a VPC without internet access; these tasks send their logs directly to an internal collector.
      fr: |-
        Le point de terminaison logs n'est nécessaire que pour les tâches qui utilisent le pilote awslogs dans un VPC sans accès Internet ; ces tâches envoient leurs journaux directement à un collecteur interne.
    e:
      en: |-
        A Secrets Manager endpoint is needed only when task definitions inject secrets, which these task definitions do not do.
      fr: |-
        Un point de terminaison Secrets Manager n'est nécessaire que lorsque les définitions de tâche injectent des secrets, ce que ces définitions ne font pas.
    f:
      en: |-
        ECR does not store images or layers in DynamoDB, so a DynamoDB endpoint plays no part in pulling images.
      fr: |-
        ECR ne stocke ni images ni couches dans DynamoDB : un point de terminaison DynamoDB ne joue aucun rôle dans l'extraction des images.
references:
  - title: Amazon ECR interface VPC endpoints (AWS PrivateLink) - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/vpc-endpoints.html
