id: sapc03-1c-outposts-rack-rds-residency
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank operates in a country that has no AWS Region. Regulations require customer data to be stored and processed in the bank's own data center in that country. The nearest AWS Local Zone is in a neighboring country. The bank wants to run its new core banking services on Amazon EC2 with Amazon EBS volumes and a managed Amazon RDS for PostgreSQL database, using the same APIs and tools as in an AWS Region. The services also need low-latency access to a mainframe in the same data center.

    Which solution will meet these requirements?
  fr: |
    Une banque opère dans un pays où il n'existe aucune Région AWS. La réglementation impose que les données clients soient stockées et traitées dans le propre centre de données de la banque, dans ce pays. La Local Zone AWS la plus proche se trouve dans un pays voisin. La banque veut exécuter ses nouveaux services bancaires centraux sur Amazon EC2 avec des volumes Amazon EBS et une base de données gérée Amazon RDS for PostgreSQL, avec les mêmes API et outils que dans une Région AWS. Les services ont aussi besoin d'un accès à faible latence à un mainframe situé dans le même centre de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Install AWS Outposts servers in the data center, and run the EC2 instances, the EBS volumes and the Amazon RDS for PostgreSQL database on the servers."
        fr: "Installer des serveurs AWS Outposts dans le centre de données, et y exécuter les instances EC2, les volumes EBS et la base Amazon RDS for PostgreSQL."
    - id: b
      text:
        en: "Install an AWS Outposts rack in the data center, run EC2 with EBS volumes and Amazon RDS for PostgreSQL on it, and reach the mainframe through its local gateway."
        fr: "Installer un rack AWS Outposts dans le centre de données, y exécuter EC2 avec des volumes EBS et Amazon RDS for PostgreSQL, et joindre le mainframe par sa passerelle locale."
    - id: c
      text:
        en: "Deploy the services in the Local Zone in the neighboring country, and connect the Local Zone to the bank's data center through AWS Direct Connect."
        fr: "Déployer les services dans la Local Zone du pays voisin, et relier la Local Zone au centre de données de la banque par AWS Direct Connect."
    - id: d
      text:
        en: "Install Amazon EKS Anywhere in the data center, and run PostgreSQL in containers with a Kubernetes operator that manages backups and failover."
        fr: "Installer Amazon EKS Anywhere dans le centre de données, et exécuter PostgreSQL dans des conteneurs avec un opérateur Kubernetes qui gère les sauvegardes et le basculement."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An Outposts rack brings EC2, EBS and Amazon RDS into the bank's data center, so the data stays in the country and is managed with the same AWS APIs. Its local gateway connects the Outpost subnets to the on-premises network for low-latency access to the mainframe.
    fr: |-
      Un rack Outposts apporte EC2, EBS et Amazon RDS dans le centre de données de la banque : les données restent dans le pays et se gèrent avec les mêmes API AWS. Sa passerelle locale relie les sous-réseaux de l'Outpost au réseau sur site pour un accès à faible latence au mainframe.
  options:
    a:
      en: |-
        Outposts servers do not support Amazon EBS volumes or Amazon RDS DB instances.
      fr: |-
        Les serveurs Outposts ne prennent en charge ni les volumes Amazon EBS ni les instances de base de données Amazon RDS.
    c:
      en: |-
        The Local Zone is in another country, so customer data would leave the bank's country and data center.
      fr: |-
        La Local Zone se trouve dans un autre pays : les données clients quitteraient le pays et le centre de données de la banque.
    d:
      en: |-
        A database in containers on EKS Anywhere is self-managed, not a managed Amazon RDS database.
      fr: |-
        Une base de données conteneurisée sur EKS Anywhere est autogérée, pas une base Amazon RDS gérée.
references:
  - title: What is AWS Outposts? - AWS Outposts
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
