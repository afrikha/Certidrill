id: sapc03-1a-ecr-gate-critical-images
objective: "1.1.8"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company builds container images with AWS CodePipeline and AWS CodeBuild and pushes them to Amazon ECR repositories that use enhanced scanning. Amazon EKS clusters deploy the images by tag. The security team requires that no image with CRITICAL findings be promoted to the production tag. After an image has passed the check and received the production tag, that tag must always point to the same image, so that nobody can push a different image under it. The company wants to use managed features and the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise construit des images de conteneur avec AWS CodePipeline et AWS CodeBuild et les envoie dans des référentiels Amazon ECR qui utilisent l'analyse améliorée. Des clusters Amazon EKS déploient les images par balise. L'équipe de sécurité exige qu'aucune image présentant des résultats CRITICAL ne soit promue vers la balise de production. Une fois qu'une image a réussi le contrôle et reçu la balise de production, cette balise doit toujours désigner la même image, pour que personne ne puisse envoyer une autre image sous cette balise. L'entreprise veut utiliser des fonctionnalités gérées et le MOINS de code personnalisé.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a pipeline stage that reads the enhanced scan findings of the new image and stops the pipeline before the production tag is applied if CRITICAL findings exist.
        fr: |-
          Ajouter une étape de pipeline qui lit les résultats de l'analyse améliorée de la nouvelle image et arrête le pipeline avant l'application de la balise de production si des résultats CRITICAL existent.
    - id: b
      text:
        en: |-
          Turn on tag immutability for the production repositories so that an existing tag cannot be overwritten by a later push of a different image.
        fr: |-
          Activer l'immuabilité des balises pour les référentiels de production afin qu'une balise existante ne puisse pas être écrasée par l'envoi ultérieur d'une autre image.
    - id: c
      text:
        en: |-
          Add a lifecycle policy rule to the repositories that expires every image whose scan findings include a CRITICAL severity.
        fr: |-
          Ajouter aux référentiels une règle de politique de cycle de vie qui fait expirer chaque image dont les résultats d'analyse comprennent une gravité CRITICAL.
    - id: d
      text:
        en: |-
          Switch the registry to basic scanning with scan on push so that ECR rejects any push of an image that has CRITICAL findings.
        fr: |-
          Passer le registre à l'analyse de base avec l'analyse à l'envoi pour qu'ECR refuse tout envoi d'une image présentant des résultats CRITICAL.
    - id: e
      text:
        en: |-
          Add a statement to the registry permissions policy that denies ecr:BatchGetImage for images whose scan findings include a CRITICAL severity.
        fr: |-
          Ajouter à la politique d'autorisations du registre une instruction qui refuse ecr:BatchGetImage pour les images dont les résultats d'analyse comprennent une gravité CRITICAL.
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      ECR scanning reports vulnerabilities but does not block pushes or pulls, so the pipeline must act as the gate: it reads the findings of the image and promotes the tag only when no CRITICAL finding exists. Tag immutability then prevents anyone from pushing another image under the production tag, so the tag keeps pointing to the image that passed the check.
    fr: |-
      L'analyse ECR signale les vulnérabilités mais ne bloque ni les envois ni les extractions : le pipeline doit donc servir de contrôle, en lisant les résultats de l'image et en ne promouvant la balise qu'en l'absence de résultat CRITICAL. L'immuabilité des balises empêche ensuite quiconque d'envoyer une autre image sous la balise de production : la balise continue de désigner l'image qui a réussi le contrôle.
  options:
    c:
      en: |-
        Lifecycle rules select images by tag status, tag patterns, age, pull time, or count; they cannot select images by their scan findings.
      fr: |-
        Les règles de cycle de vie sélectionnent les images par statut de balise, modèle de balise, âge, date d'extraction ou nombre ; elles ne peuvent pas les sélectionner selon leurs résultats d'analyse.
    d:
      en: |-
        Basic scanning reports operating system vulnerabilities after the push; it does not reject images, and it misses programming language packages.
      fr: |-
        L'analyse de base signale les vulnérabilités du système d'exploitation après l'envoi ; elle ne refuse pas les images et manque les paquets des langages de programmation.
    e:
      en: |-
        Registry and repository policies have no condition based on scan findings, so they cannot deny pulls of vulnerable images.
      fr: |-
        Les politiques de registre et de référentiel n'ont aucune condition fondée sur les résultats d'analyse : elles ne peuvent pas refuser l'extraction d'images vulnérables.
references:
  - title: Scan images for software vulnerabilities in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html
  - title: Lifecycle policy properties in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_parameters.html
