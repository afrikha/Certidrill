id: sapc03-1b-sagemaker-async-video
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sports analytics company has trained a computer vision model that tags plays in match videos. Coaches upload video files of 300 MB to 800 MB, and the model needs 10 to 20 minutes to process each file on a GPU instance. Uploads arrive in bursts after matches, and there are often several hours with no requests. The coaches' application must get the result location immediately after submitting a video and must be notified when processing finishes. The company wants to pay for GPU instances only while requests are being processed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'analyse sportive a entraîné un modèle de vision par ordinateur qui étiquette les actions dans des vidéos de matchs. Les entraîneurs chargent des fichiers vidéo de 300 Mo à 800 Mo, et le modèle a besoin de 10 à 20 minutes pour traiter chaque fichier sur une instance GPU. Les chargements arrivent en rafales après les matchs, et il y a souvent plusieurs heures sans aucune requête. L'application des entraîneurs doit obtenir l'emplacement du résultat immédiatement après l'envoi d'une vidéo et doit être notifiée à la fin du traitement. L'entreprise veut payer les instances GPU uniquement pendant le traitement des requêtes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy the model to a SageMaker AI real-time endpoint on GPU instances with target tracking scaling, and send each video in the body of an InvokeEndpoint request."
        fr: "Déployer le modèle sur un point de terminaison en temps réel SageMaker AI avec des instances GPU et une mise à l'échelle avec suivi de cible, et envoyer chaque vidéo dans le corps d'une requête InvokeEndpoint."
    - id: b
      text:
        en: "Deploy the model to a SageMaker AI asynchronous endpoint on GPU instances with auto scaling to zero instances, pass the S3 location of each video with InvokeEndpointAsync, and send completion notifications through Amazon SNS."
        fr: "Déployer le modèle sur un point de terminaison asynchrone SageMaker AI avec des instances GPU et une mise à l'échelle automatique jusqu'à zéro instance, transmettre l'emplacement S3 de chaque vidéo avec InvokeEndpointAsync, et envoyer les notifications de fin via Amazon SNS."
    - id: c
      text:
        en: "Deploy the model to a SageMaker AI serverless endpoint with the maximum memory size, and send each video to the endpoint from an AWS Step Functions workflow that waits for the response."
        fr: "Déployer le modèle sur un point de terminaison serverless SageMaker AI avec la taille de mémoire maximale, et envoyer chaque vidéo au point de terminaison depuis un flux de travail AWS Step Functions qui attend la réponse."
    - id: d
      text:
        en: "Collect the uploaded videos in Amazon S3, and start a SageMaker AI batch transform job on GPU instances every night that writes the tags of all the day's videos to S3."
        fr: "Rassembler les vidéos chargées dans Amazon S3, et lancer chaque nuit une tâche de transformation par lots SageMaker AI sur des instances GPU qui écrit dans S3 les étiquettes de toutes les vidéos du jour."
answer: { optionId: b }
explanation:
  correct:
    en: "Asynchronous inference queues requests with payloads up to 1 GB and processing times up to one hour. The request points to the payload in S3, SageMaker AI immediately returns an identifier and the output location, writes the result to S3 and can send success or error notifications through SNS. The endpoint can scale to zero instances when no requests are waiting."
    fr: "L'inférence asynchrone met en file des requêtes avec des charges utiles jusqu'à 1 Go et des temps de traitement jusqu'à une heure. La requête désigne la charge utile dans S3, SageMaker AI renvoie immédiatement un identifiant et l'emplacement de sortie, écrit le résultat dans S3 et peut envoyer des notifications de réussite ou d'erreur via SNS. Le point de terminaison peut descendre à zéro instance quand aucune requête n'attend."
  options:
    a:
      en: "Real-time endpoints accept payloads up to 25 MB and return within 60 seconds, so they cannot take these videos or processing times, and they keep instances running between bursts."
      fr: "Les points de terminaison en temps réel acceptent des charges utiles jusqu'à 25 Mo et répondent en 60 secondes : ils ne peuvent pas prendre ces vidéos ni ces temps de traitement, et ils gardent des instances actives entre les rafales."
    c:
      en: "Serverless inference does not support GPUs, accepts payloads up to 4 MB and processes requests for up to 60 seconds."
      fr: "L'inférence serverless ne prend pas en charge les GPU, accepte des charges utiles jusqu'à 4 Mo et traite les requêtes pendant 60 secondes au plus."
    d:
      en: "A nightly batch job does not return a result location per submission or notify the coaches when each video is processed; results would arrive the next day."
      fr: "Une tâche nocturne par lots ne renvoie pas d'emplacement de résultat par envoi et ne notifie pas les entraîneurs à la fin de chaque vidéo : les résultats arriveraient le lendemain."
references:
  - title: Asynchronous inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/async-inference.html
  - title: Inference options in Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model-options.html
