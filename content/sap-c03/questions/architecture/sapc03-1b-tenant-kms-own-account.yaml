id: sapc03-1b-tenant-kms-own-account
objective: "1.1.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company stores tenant documents in one Amazon S3 bucket, with one prefix per tenant, encrypted with SSE-KMS. Twelve regulated enterprise tenants have their own AWS accounts. They require that the key that protects their documents is created and controlled in their own account, so that they can revoke the SaaS company's access to their data at any time by changing the key policy, without depending on the SaaS company. The other tenants accept a key that the SaaS company manages. The company wants to keep a single bucket and its current application.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS stocke les documents de ses locataires dans un seul compartiment Amazon S3, avec un préfixe par locataire, chiffrés avec SSE-KMS. Douze locataires grands comptes réglementés disposent de leurs propres comptes AWS. Ils exigent que la clé qui protège leurs documents soit créée et contrôlée dans leur propre compte, afin de pouvoir révoquer à tout moment l'accès de l'entreprise SaaS à leurs données en modifiant la politique de clé, sans dépendre de l'entreprise SaaS. Les autres locataires acceptent une clé gérée par l'entreprise SaaS. L'entreprise veut conserver un seul compartiment et son application actuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create one customer managed key per regulated tenant in the SaaS account, with a key policy that names the tenant's account as key administrator, and use that key for the tenant's prefix."
        fr: "Créer une clé gérée par le client par locataire réglementé dans le compte SaaS, avec une politique de clé qui désigne le compte du locataire comme administrateur de la clé, et utiliser cette clé pour le préfixe du locataire."
    - id: b
      text:
        en: "Have each regulated tenant create a customer managed key in its own account whose key policy allows the SaaS application role, and write that tenant's objects with SSE-KMS by using the tenant's key ARN."
        fr: "Faire créer par chaque locataire réglementé une clé gérée par le client dans son propre compte dont la politique de clé autorise le rôle de l'application SaaS, et écrire les objets de ce locataire avec SSE-KMS en utilisant l'ARN de la clé du locataire."
    - id: c
      text:
        en: "Use one customer managed key in the SaaS account for all tenants, with an encryption context that contains the tenant ID and key policy conditions on kms:EncryptionContext for each tenant."
        fr: "Utiliser une seule clé gérée par le client dans le compte SaaS pour tous les locataires, avec un contexte de chiffrement qui contient l'ID du locataire et des conditions de politique de clé sur kms:EncryptionContext pour chaque locataire."
    - id: d
      text:
        en: "Have each regulated tenant generate key material and import it into a customer managed key that the SaaS company creates in its own account for that tenant's prefix."
        fr: "Faire générer par chaque locataire réglementé un matériel de clé importé dans une clé gérée par le client que l'entreprise SaaS crée dans son propre compte pour le préfixe de ce locataire."
answer: { optionId: b }
explanation:
  correct:
    en: "The key policy is always in the account that owns the KMS key and is the primary control of who can use it. A key in the tenant's account lets the tenant remove the SaaS role from the key policy at any time, while cross-account use only needs this key policy grant plus an IAM policy for the role in the SaaS account. SSE-KMS accepts the ARN of a key in another account, so the bucket and application stay the same."
    fr: "La politique de clé se trouve toujours dans le compte propriétaire de la clé KMS et constitue le contrôle principal de qui peut l'utiliser. Une clé dans le compte du locataire permet à celui-ci de retirer à tout moment le rôle SaaS de la politique de clé, tandis que l'utilisation entre comptes ne demande que cette autorisation dans la politique de clé et une politique IAM pour le rôle dans le compte SaaS. SSE-KMS accepte l'ARN d'une clé d'un autre compte : le compartiment et l'application restent les mêmes."
  options:
    a:
      en: "The key and its key policy stay in the SaaS account, whose administrators can always change the policy, so the tenant does not control access independently."
      fr: "La clé et sa politique restent dans le compte SaaS, dont les administrateurs peuvent toujours modifier la politique : le locataire ne contrôle pas l'accès de manière indépendante."
    c:
      en: "Encryption context binds each object to a tenant and helps authorization, but the SaaS company still owns and controls the single key."
      fr: "Le contexte de chiffrement lie chaque objet à un locataire et aide à l'autorisation, mais l'entreprise SaaS possède et contrôle toujours la clé unique."
    d:
      en: "The key still lives in the SaaS account, so the SaaS company, not the tenant, controls its key policy and its use."
      fr: "La clé se trouve toujours dans le compte SaaS : c'est l'entreprise SaaS, et non le locataire, qui contrôle sa politique de clé et son utilisation."
references:
  - title: Allowing users in other accounts to use a KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html
  - title: Encryption context
    url: https://docs.aws.amazon.com/kms/latest/developerguide/encrypt_context.html
