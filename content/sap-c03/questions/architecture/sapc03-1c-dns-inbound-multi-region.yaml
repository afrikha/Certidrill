id: sapc03-1c-dns-inbound-multi-region
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs workloads in us-east-1 and us-west-2 and connects its two data centers to both Regions through AWS Direct Connect. Records for internal applications in both Regions are in a private hosted zone named aws.example.internal, which is associated with a VPC in each Region. On-premises DNS servers forward aws.example.internal to a Route 53 Resolver inbound endpoint that has IP addresses in two Availability Zones in us-east-1. A business continuity review requires that on-premises clients keep resolving aws.example.internal if us-east-1 becomes unavailable.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des charges de travail dans us-east-1 et us-west-2 et relie ses deux centres de données aux deux Régions par AWS Direct Connect. Les enregistrements des applications internes des deux Régions se trouvent dans une zone hébergée privée nommée aws.example.internal, associée à un VPC dans chaque Région. Les serveurs DNS sur site transfèrent aws.example.internal à un point de terminaison entrant Route 53 Resolver qui possède des adresses IP dans deux zones de disponibilité de us-east-1. Une revue de continuité d'activité exige que les clients sur site continuent à résoudre aws.example.internal si us-east-1 devient indisponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add IP addresses in a third Availability Zone to the inbound endpoint in us-east-1 so that the endpoint remains available if two Availability Zones fail."
        fr: "Ajouter au point de terminaison entrant de us-east-1 des adresses IP dans une troisième zone de disponibilité pour qu'il reste disponible en cas de défaillance de deux zones."
    - id: b
      text:
        en: "Create an inbound endpoint in the associated VPC in us-west-2, and add its IP addresses to the on-premises conditional forwarders next to the us-east-1 addresses."
        fr: "Créer un point de terminaison entrant dans le VPC associé de us-west-2, et ajouter ses adresses IP aux redirecteurs conditionnels sur site, à côté des adresses de us-east-1."
    - id: c
      text:
        en: "Create a Route 53 failover record that points to the us-east-1 endpoint IP addresses, and configure the on-premises DNS servers to forward aws.example.internal to that record name."
        fr: "Créer un enregistrement de basculement Route 53 qui pointe vers les adresses IP du point de terminaison de us-east-1, et configurer les serveurs DNS sur site pour qu'ils transfèrent aws.example.internal vers ce nom d'enregistrement."
    - id: d
      text:
        en: "Create an outbound endpoint in us-west-2 and a forwarding rule for aws.example.internal, and associate the rule with the VPC in us-west-2."
        fr: "Créer un point de terminaison sortant dans us-west-2 et une règle de transfert pour aws.example.internal, et associer la règle au VPC de us-west-2."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An inbound endpoint is a Regional resource, so resilience against the loss of a Region needs a second endpoint in another Region. The private hosted zone is already associated with a VPC in us-west-2, so an inbound endpoint there can answer for the zone, and conditional forwarders that list the addresses of both endpoints keep resolving when us-east-1 is unavailable.
    fr: |-
      Un point de terminaison entrant est une ressource régionale : résister à la perte d'une Région exige un second point de terminaison dans une autre Région. La zone hébergée privée est déjà associée à un VPC de us-west-2, donc un point de terminaison entrant dans ce VPC peut répondre pour la zone, et des redirecteurs conditionnels qui listent les adresses des deux points de terminaison continuent à résoudre lorsque us-east-1 est indisponible.
  options:
    a:
      en: |-
        All the addresses still belong to an endpoint in us-east-1, so the endpoint does not survive the loss of the Region.
      fr: |-
        Toutes les adresses appartiennent toujours à un point de terminaison de us-east-1 : il ne survit pas à la perte de la Région.
    c:
      en: |-
        Conditional forwarders take IP addresses, not record names, and the record would only point to addresses in the failed Region.
      fr: |-
        Les redirecteurs conditionnels prennent des adresses IP, pas des noms d'enregistrement, et l'enregistrement ne pointerait que vers des adresses de la Région défaillante.
    d:
      en: |-
        An outbound endpoint forwards queries from VPCs to other resolvers; it cannot receive queries from on premises.
      fr: |-
        Un point de terminaison sortant transfère des requêtes des VPC vers d'autres résolveurs ; il ne peut pas recevoir de requêtes venant du site.
references:
  - title: Values that you specify when you create or edit inbound endpoints - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries-values.html
  - title: Forwarding inbound DNS queries to your VPCs - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries.html
