id: sapc03-1a-eks-fargate-pod-permissions
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon EKS cluster. Most workloads run on managed node groups, and the platform team's standard is EKS Pod Identity for them. A new data ingestion workload runs in the ingest namespace, which a Fargate profile selects, so its pods run on AWS Fargate. The ingestion pods need to write to one Amazon S3 bucket and read one secret in AWS Secrets Manager. The security team requires least privilege, with permissions granted only to the ingestion service account and not to other pods.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Amazon EKS. La plupart des charges de travail s'exécutent sur des groupes de nœuds gérés, et la norme de l'équipe plateforme pour celles-ci est EKS Pod Identity. Une nouvelle charge de travail d'ingestion de données s'exécute dans l'espace de noms ingest, sélectionné par un profil Fargate : ses pods s'exécutent donc sur AWS Fargate. Les pods d'ingestion doivent écrire dans un compartiment Amazon S3 et lire un secret d'AWS Secrets Manager. L'équipe de sécurité exige le moindre privilège, avec des autorisations accordées uniquement au compte de service d'ingestion et pas aux autres pods.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an IAM role with the required permissions, and create an EKS Pod Identity association between the role and the ingestion service account in the ingest namespace.
        fr: |-
          Créer un rôle IAM doté des autorisations nécessaires, et créer une association EKS Pod Identity entre le rôle et le compte de service d'ingestion dans l'espace de noms ingest.
    - id: b
      text:
        en: |-
          Add the S3 and Secrets Manager permissions to the pod execution role of the Fargate profile, so that the ingestion pods receive them when Fargate starts them.
        fr: |-
          Ajouter les autorisations S3 et Secrets Manager au rôle d'exécution de pod du profil Fargate, pour que les pods d'ingestion les reçoivent quand Fargate les démarre.
    - id: c
      text:
        en: |-
          Attach the permissions to an IAM role, and have the ingestion pods retrieve the role credentials from the instance metadata service of the Fargate node.
        fr: |-
          Attacher les autorisations à un rôle IAM, et faire récupérer les informations d'identification du rôle par les pods d'ingestion auprès du service de métadonnées d'instance du nœud Fargate.
    - id: d
      text:
        en: |-
          Create an IAM OIDC provider for the cluster and an IAM role whose trust policy allows only the ingestion service account, and annotate the service account with the role ARN.
        fr: |-
          Créer un fournisseur OIDC IAM pour le cluster et un rôle IAM dont la politique d'approbation n'autorise que le compte de service d'ingestion, puis annoter le compte de service avec l'ARN du rôle.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      EKS Pod Identity is not supported for pods on Fargate, so these pods need IAM roles for service accounts (IRSA), the method based on an OIDC identity provider. The role's trust policy is scoped to the ingest namespace and the ingestion service account, so only the pods that use that service account receive the permissions.
    fr: |-
      EKS Pod Identity n'est pas pris en charge pour les pods sur Fargate : ces pods ont besoin des rôles IAM pour les comptes de service (IRSA), la méthode fondée sur un fournisseur d'identité OIDC. La politique d'approbation du rôle est limitée à l'espace de noms ingest et au compte de service d'ingestion : seuls les pods qui utilisent ce compte de service reçoivent les autorisations.
  options:
    a:
      en: |-
        Pod Identity associations do not work for Linux or Windows pods that run on Fargate, so the ingestion pods would get no credentials.
      fr: |-
        Les associations Pod Identity ne fonctionnent pas pour les pods Linux ou Windows qui s'exécutent sur Fargate : les pods d'ingestion n'obtiendraient aucune information d'identification.
    b:
      en: |-
        The pod execution role is used by the Fargate infrastructure, for example to pull images, and is not the identity of the application, so it does not give the service account scoped permissions.
      fr: |-
        Le rôle d'exécution de pod est utilisé par l'infrastructure Fargate, par exemple pour extraire les images, et n'est pas l'identité de l'application : il ne donne pas au compte de service des autorisations limitées.
    c:
      en: |-
        The instance metadata service is not available to pods on Fargate, and it would not scope the permissions to one service account.
      fr: |-
        Le service de métadonnées d'instance n'est pas disponible pour les pods sur Fargate, et il ne limiterait pas les autorisations à un seul compte de service.
references:
  - title: Learn how EKS Pod Identity grants pods access to AWS services - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
  - title: Simplify compute management with AWS Fargate - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
