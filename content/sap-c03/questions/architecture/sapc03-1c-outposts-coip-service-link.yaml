id: sapc03-1c-outposts-coip-service-link
objective: "1.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A chemicals company has installed an AWS Outposts rack in its plant. Process control servers in the plant network must connect to EC2 instances on the Outpost directly over the plant's local network, without traffic passing through the AWS Region. The CIDR block of the VPC that contains the Outpost subnets, 10.40.0.0/16, overlaps with address ranges that are already used in the plant network, and the company cannot renumber either network. AWS must be able to manage and monitor the Outpost.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de chimie a installé un rack AWS Outposts dans son usine. Des serveurs de contrôle des procédés du réseau de l'usine doivent se connecter directement, par le réseau local de l'usine, à des instances EC2 de l'Outpost, sans que le trafic passe par la Région AWS. Le bloc CIDR du VPC qui contient les sous-réseaux de l'Outpost, 10.40.0.0/16, chevauche des plages d'adresses déjà utilisées dans le réseau de l'usine, et l'entreprise ne peut renuméroter aucun des deux réseaux. AWS doit pouvoir gérer et surveiller l'Outpost.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Keep the local gateway route table in direct VPC routing mode, and advertise the VPC CIDR block to the plant network over BGP."
        fr: "Conserver la table de routage de la passerelle locale en mode de routage VPC direct, et annoncer le bloc CIDR du VPC au réseau de l'usine par BGP."
    - id: b
      text:
        en: "Create a customer-owned IP address pool, use it in a local gateway route table in customer-owned IP mode that is associated with the VPC, and allocate addresses from the pool to the instances."
        fr: "Créer un pool d'adresses IP détenues par le client (CoIP), l'utiliser dans une table de routage de passerelle locale en mode CoIP associée au VPC, et attribuer aux instances des adresses de ce pool."
    - id: c
      text:
        en: "Attach a local network interface to each instance on the Outpost, and assign it an IP address from a non-overlapping plant subnet."
        fr: "Attacher une interface réseau locale à chaque instance de l'Outpost, et lui attribuer une adresse IP d'un sous-réseau de l'usine sans chevauchement."
    - id: d
      text:
        en: "Provide service link connectivity between the Outpost and its parent Region through AWS Direct Connect or the internet."
        fr: "Fournir une connectivité de liaison de service (service link) entre l'Outpost et sa Région parente par AWS Direct Connect ou par Internet."
    - id: e
      text:
        en: "Attach the VPC to a transit gateway in the parent Region, and route plant traffic to the instances through an AWS Site-to-Site VPN connection to the transit gateway."
        fr: "Attacher le VPC à une passerelle de transit (transit gateway) de la Région parente, et router le trafic de l'usine vers les instances par une connexion AWS Site-to-Site VPN vers cette passerelle."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      In customer-owned IP mode, the local gateway gives instances addresses from a pool that the company supplies and advertises to its network over BGP, which supports overlapping CIDR ranges. The service link is the route between the Outpost and its parent Region that AWS uses to operate the Outpost.
    fr: |-
      En mode CoIP, la passerelle locale donne aux instances des adresses d'un pool fourni par l'entreprise et annoncé à son réseau par BGP, ce qui prend en charge les plages CIDR qui se chevauchent. La liaison de service est la route entre l'Outpost et sa Région parente qu'AWS utilise pour exploiter l'Outpost.
  options:
    a:
      en: |-
        Direct VPC routing advertises the instances' private VPC addresses and does not support overlapping CIDR ranges.
      fr: |-
        Le routage VPC direct annonce les adresses VPC privées des instances et ne prend pas en charge les plages CIDR qui se chevauchent.
    c:
      en: |-
        Local network interfaces are used by Outposts servers; Outposts racks reach the on-premises network through the local gateway.
      fr: |-
        Les interfaces réseau locales sont utilisées par les serveurs Outposts ; les racks Outposts joignent le réseau sur site par la passerelle locale.
    e:
      en: |-
        Routing through a transit gateway sends traffic to the Region and back, which the company wants to avoid, and the overlapping CIDR blocks would still conflict.
      fr: |-
        Router par une passerelle de transit envoie le trafic vers la Région et retour, ce que l'entreprise veut éviter, et les blocs CIDR qui se chevauchent seraient toujours en conflit.
references:
