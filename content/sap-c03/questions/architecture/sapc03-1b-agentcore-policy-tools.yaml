id: sapc03-1b-agentcore-policy-tools
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company runs customer service agents built with different frameworks by three teams. All agents reach their tools, including an issue_refund tool backed by an AWS Lambda function, through one Amazon Bedrock AgentCore gateway. A new control requires that agents can call issue_refund only for amounts up to 200 USD and only for orders that belong to the authenticated customer. The control must be deterministic, enforced outside the agents' code so that a prompt injection cannot bypass it, applied to every agent, and every allow or deny decision must be auditable. The tool code must not change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce en ligne exécute des agents de service client créés avec différents frameworks par trois équipes. Tous les agents atteignent leurs outils, dont un outil issue_refund adossé à une fonction AWS Lambda, via une seule passerelle Amazon Bedrock AgentCore. Un nouveau contrôle exige que les agents ne puissent appeler issue_refund que pour des montants jusqu'à 200 USD et uniquement pour des commandes appartenant au client authentifié. Le contrôle doit être déterministe, appliqué en dehors du code des agents pour qu'une injection d'invite ne puisse pas le contourner, s'appliquer à chaque agent, et chaque décision d'autorisation ou de refus doit être auditable. Le code de l'outil ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a policy engine in Policy in Amazon Bedrock AgentCore with Cedar policies that permit issue_refund only under these conditions, and associate the policy engine with the gateway."
        fr: "Créer un moteur de politiques dans Policy in Amazon Bedrock AgentCore avec des politiques Cedar qui n'autorisent issue_refund que dans ces conditions, et associer le moteur de politiques à la passerelle."
    - id: b
      text:
        en: "Add instructions to the system prompt of every agent that forbid refunds above 200 USD and refunds for orders of other customers, and test the prompts with AgentCore Evaluations."
        fr: "Ajouter aux invites système de chaque agent des instructions qui interdisent les remboursements de plus de 200 USD et ceux des commandes d'autres clients, et tester les invites avec AgentCore Evaluations."
    - id: c
      text:
        en: "Create an Amazon Bedrock guardrail with denied topics for large refunds and refunds for other customers, and apply the guardrail to every model inference call of the agents."
        fr: "Créer une barrière de protection Amazon Bedrock avec des sujets refusés pour les gros remboursements et les remboursements d'autres clients, et appliquer la barrière à chaque appel d'inférence de modèle des agents."
    - id: d
      text:
        en: "Attach a resource-based policy to the issue_refund Lambda function that allows invocation only by the gateway's role, and turn on CloudTrail data events for the function."
        fr: "Attacher à la fonction Lambda issue_refund une politique basée sur les ressources qui n'autorise l'invocation que par le rôle de la passerelle, et activer les événements de données CloudTrail pour la fonction."
answer: { optionId: a }
explanation:
  correct:
    en: "Policy in AgentCore stores deterministic Cedar policies in a policy engine associated with gateways. It intercepts every tool call through the gateway and evaluates it, including its input parameters, before the tool runs, so enforcement does not depend on how each agent is built. Every decision is logged in CloudWatch metrics and logs for auditing."
    fr: "Policy in AgentCore stocke des politiques Cedar déterministes dans un moteur de politiques associé aux passerelles. Il intercepte chaque appel d'outil passant par la passerelle et l'évalue, paramètres d'entrée compris, avant l'exécution de l'outil : l'application ne dépend pas de la façon dont chaque agent est construit. Chaque décision est journalisée dans des métriques et journaux CloudWatch pour l'audit."
  options:
    b:
      en: "Prompt instructions are not deterministic and live inside the agents, so a prompt injection can override them; evaluations only measure behavior."
      fr: "Les instructions d'invite ne sont pas déterministes et résident dans les agents : une injection d'invite peut les contourner, et les évaluations ne font que mesurer le comportement."
    c:
      en: "Guardrails filter model inputs and outputs by content; they do not authorize tool calls according to the refund amount or the order owner."
      fr: "Les barrières de protection filtrent les entrées et sorties des modèles selon leur contenu : elles n'autorisent pas les appels d'outils selon le montant du remboursement ou le propriétaire de la commande."
    d:
      en: "The resource-based policy controls who invokes the function, not the amount or order in each call, so it cannot express the rule without changing the tool code."
      fr: "La politique basée sur les ressources contrôle qui invoque la fonction, pas le montant ni la commande de chaque appel : elle ne peut pas exprimer la règle sans modifier le code de l'outil."
references:
  - title: "Policy in Amazon Bedrock AgentCore: Control Agent Interactions"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/policy.html
