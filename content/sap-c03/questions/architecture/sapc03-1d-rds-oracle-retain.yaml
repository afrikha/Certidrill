id: sapc03-1d-rds-oracle-retain
objective: "1.5.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank must move a core lending application out of its data center within 4 months. The application runs on Oracle Database 19c, contains about 1,200 PL/SQL packages and uses Oracle Spatial. The software vendor certifies the application only on Oracle Database and will not support code changes. The bank owns Oracle licenses that it can bring to AWS. The bank wants AWS to manage backups, patching and automatic failover to another Availability Zone, and its database administrators do not need operating system access.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une banque doit sortir une application de prêt critique de son centre de données dans un délai de 4 mois. L'application s'exécute sur Oracle Database 19c, contient environ 1 200 packages PL/SQL et utilise Oracle Spatial. L'éditeur du logiciel ne certifie l'application que sur Oracle Database et ne prendra en charge aucune modification du code. La banque possède des licences Oracle qu'elle peut apporter sur AWS. La banque veut qu'AWS gère les sauvegardes, les correctifs et le basculement automatique vers une autre zone de disponibilité, et ses administrateurs de bases de données n'ont pas besoin d'accès au système d'exploitation.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Migrate to Amazon Aurora PostgreSQL, convert the PL/SQL packages with AWS DMS Schema Conversion, and replace Oracle Spatial with the PostGIS extension."
        fr: "Migrer vers Amazon Aurora PostgreSQL, convertir les packages PL/SQL avec AWS DMS Schema Conversion, et remplacer Oracle Spatial par l'extension PostGIS."
    - id: b
      text:
        en: "Migrate to Amazon Aurora PostgreSQL with Babelfish turned on, so that the application can keep sending its existing PL/SQL calls without any conversion."
        fr: "Migrer vers Amazon Aurora PostgreSQL avec Babelfish activé, afin que l'application puisse continuer à envoyer ses appels PL/SQL existants sans aucune conversion."
    - id: c
      text:
        en: "Install Oracle Database on Amazon EC2 instances in two Availability Zones, and configure Oracle Data Guard with a scripted failover between them."
        fr: "Installer Oracle Database sur des instances Amazon EC2 dans deux zones de disponibilité, et configurer Oracle Data Guard avec un basculement scripté entre elles."
    - id: d
      text:
        en: "Migrate to Amazon RDS for Oracle in a Multi-AZ deployment with Oracle Spatial added through an option group, and move the data with AWS DMS."
        fr: "Migrer vers Amazon RDS for Oracle dans un déploiement Multi-AZ avec Oracle Spatial ajouté via un groupe d'options, et déplacer les données avec AWS DMS."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon RDS for Oracle runs Oracle Database 19c as a managed service, so the PL/SQL packages run unchanged and the vendor certification holds. Oracle Spatial is added through an option group, Multi-AZ deployments provide automatic failover, and RDS manages backups and patching without host access.
    fr: |
      Amazon RDS for Oracle exécute Oracle Database 19c en tant que service géré : les packages PL/SQL s'exécutent sans modification et la certification de l'éditeur reste valable. Oracle Spatial est ajouté via un groupe d'options, les déploiements Multi-AZ assurent le basculement automatique, et RDS gère les sauvegardes et les correctifs sans accès à l'hôte.
  options:
    a:
      en: |
        Converting 1,200 packages and replacing Spatial changes the application, which the vendor does not support, and is unlikely to finish within 4 months.
      fr: |
        Convertir 1 200 packages et remplacer Spatial modifie l'application, ce que l'éditeur ne prend pas en charge, et a peu de chances d'aboutir en 4 mois.
    b:
      en: |
        Babelfish lets Aurora PostgreSQL understand T-SQL from SQL Server applications; it does not run Oracle PL/SQL.
      fr: |
        Babelfish permet à Aurora PostgreSQL de comprendre le T-SQL des applications SQL Server ; il n'exécute pas le PL/SQL d'Oracle.
    c:
      en: |
        Oracle on EC2 keeps the code, but the bank would manage the hosts, patching, backups and failover scripts, which is the most operational work.
      fr: |
        Oracle sur EC2 conserve le code, mais la banque gérerait les hôtes, les correctifs, les sauvegardes et les scripts de basculement, ce qui représente le plus de travail opérationnel.
references:
  - title: Amazon RDS for Oracle
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Oracle.html
