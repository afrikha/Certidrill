id: sapc03-1b-bedrock-batch-inference
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A telecommunications company stores about 2 million customer support transcripts in an Amazon S3 bucket and adds 60,000 new transcripts every day. Every night, it must generate a summary and a sentiment label for each new transcript with a foundation model in Amazon Bedrock, and the results are needed only the next morning in S3. The chosen model supports batch inference. The company wants the lowest inference cost and does not want to write code that controls request rates or retries.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de télécommunications stocke environ 2 millions de transcriptions du support client dans un compartiment Amazon S3 et ajoute 60 000 nouvelles transcriptions chaque jour. Chaque nuit, elle doit générer un résumé et une étiquette de sentiment pour chaque nouvelle transcription avec un modèle de fondation d'Amazon Bedrock, et les résultats ne sont nécessaires que le lendemain matin dans S3. Le modèle choisi prend en charge l'inférence par lots. L'entreprise veut le coût d'inférence le plus bas et ne veut pas écrire de code qui contrôle le débit des requêtes ou les nouvelles tentatives.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Purchase Provisioned Throughput for the model, and run a nightly AWS Step Functions Distributed Map that calls InvokeModel on the provisioned model for each new transcript."
        fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle, et exécuter chaque nuit une carte distribuée (Distributed Map) AWS Step Functions qui appelle InvokeModel sur le modèle provisionné pour chaque nouvelle transcription."
    - id: b
      text:
        en: "Each night, write the new transcripts' model inputs to files in S3, run a Bedrock batch inference job that writes its output to S3, and detect job completion with an EventBridge rule."
        fr: "Chaque nuit, écrire les entrées du modèle des nouvelles transcriptions dans des fichiers dans S3, exécuter une tâche d'inférence par lots Bedrock qui écrit sa sortie dans S3, et détecter la fin de la tâche avec une règle EventBridge."
    - id: c
      text:
        en: "Run a nightly AWS Step Functions Distributed Map that calls the Converse API with on-demand inference for each new transcript and stores each response in S3, with retry and backoff settings on the task state."
        fr: "Exécuter chaque nuit une carte distribuée AWS Step Functions qui appelle l'API Converse en inférence à la demande pour chaque nouvelle transcription et stocke chaque réponse dans S3, avec des paramètres de nouvelle tentative et d'interruption exponentielle (backoff) sur l'état de tâche."
    - id: d
      text:
        en: "Deploy an open-weight model on an Amazon SageMaker AI real-time endpoint with GPU instances and auto scaling, and have a nightly job send each new transcript to the endpoint."
        fr: "Déployer un modèle à poids ouverts sur un point de terminaison en temps réel Amazon SageMaker AI avec des instances GPU et une mise à l'échelle automatique, et faire envoyer chaque nouvelle transcription au point de terminaison par une tâche nocturne."
answer: { optionId: b }
explanation:
  correct:
    en: "Batch inference processes many prompts asynchronously from files in S3 and writes the responses to S3, so the company sends one job request instead of managing request rates. For supported models, AWS prices batch inference at a 50% discount to on-demand inference, and job state changes can be received through EventBridge."
    fr: "L'inférence par lots traite de nombreuses invites de manière asynchrone à partir de fichiers dans S3 et écrit les réponses dans S3 : l'entreprise envoie une seule requête de tâche au lieu de gérer des débits de requêtes. Pour les modèles pris en charge, AWS facture l'inférence par lots 50 % moins cher que l'inférence à la demande, et les changements d'état des tâches peuvent être reçus via EventBridge."
  options:
    a:
      en: "Provisioned Throughput is paid for every hour of the commitment, even when idle during the day, and batch inference is not supported on provisioned models."
      fr: "Le débit provisionné est payé pour chaque heure de l'engagement, même inactif pendant la journée, et l'inférence par lots n'est pas prise en charge sur les modèles provisionnés."
    c:
      en: "On-demand calls cost more than batch inference for the same model, and the workflow still has to handle throttling with retries."
      fr: "Les appels à la demande coûtent plus cher que l'inférence par lots pour le même modèle, et le flux de travail doit toujours gérer la limitation avec de nouvelles tentatives."
    d:
      en: "A real-time GPU endpoint bills for its instances around the clock, adds model hosting work and still needs a client that controls the request rate."
      fr: "Un point de terminaison GPU en temps réel facture ses instances en continu, ajoute un travail d'hébergement de modèle et nécessite toujours un client qui contrôle le débit des requêtes."
references:
  - title: Process multiple prompts with batch inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/batch-inference.html
