id: sapc03-1c-eks-ipv6-new-cluster
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs dozens of microservices on an Amazon EKS cluster that was created with the IPv4 IP family. Pod density keeps growing, and the platform team wants a long-term solution to IPv4 address exhaustion for pods. The pods must keep calling IPv4-only services in other VPCs and on the internet. The team can run a blue/green migration of the workloads between clusters, and all nodes will use Nitro-based Amazon EC2 instance types.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des dizaines de microservices sur un cluster Amazon EKS créé avec la famille IP IPv4. La densité de pods ne cesse de croître, et l'équipe plateforme veut une solution durable à l'épuisement des adresses IPv4 des pods. Les pods doivent continuer à appeler des services IPv4 uniquement dans d'autres VPC et sur Internet. L'équipe peut mener une migration bleu/vert des charges de travail entre clusters, et tous les nœuds utiliseront des types d'instances Amazon EC2 basés sur Nitro.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a new EKS cluster with the IPv6 IP family in dual-stack subnets, enable VPC CNI prefix delegation, and migrate the workloads to it with a blue/green cutover."
        fr: "Créer un nouveau cluster EKS de famille IPv6 dans des sous-réseaux double pile, activer la délégation de préfixes du VPC CNI, et y migrer les charges de travail par une bascule bleu/vert."
    - id: b
      text:
        en: "Change the IP family of the existing cluster to IPv6, add IPv6 CIDR blocks to its subnets, and restart the nodes so that the pods receive IPv6 addresses."
        fr: "Changer la famille IP du cluster existant en IPv6, ajouter des blocs CIDR IPv6 à ses sous-réseaux, et redémarrer les nœuds pour que les pods reçoivent des adresses IPv6."
    - id: c
      text:
        en: "Create a new EKS cluster with the IPv6 IP family, and enable custom networking with ENIConfig resources that place the pods in IPv4 subnets from a secondary CIDR block."
        fr: "Créer un nouveau cluster EKS de famille IPv6, et activer la mise en réseau personnalisée avec des ressources ENIConfig qui placent les pods dans des sous-réseaux IPv4 d'un bloc CIDR secondaire."
    - id: d
      text:
        en: "Create a new EKS cluster with the IPv6 IP family without prefix delegation, so that each pod receives an individual secondary IPv6 address on the node's network interfaces."
        fr: "Créer un nouveau cluster EKS de famille IPv6 sans délégation de préfixes, pour que chaque pod reçoive une adresse IPv6 secondaire individuelle sur les interfaces réseau du nœud."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      An IPv6 cluster gives pods IPv6 addresses, which removes pod IPv4 exhaustion. The IP family is chosen when the cluster is created, so a new cluster is needed, and IPv6 clusters with EC2 nodes require Nitro-based instances and VPC CNI prefix delegation. When pods call IPv4 endpoints, their host-local IPv4 address is translated to the node's primary IPv4 address, so no DNS64 or NAT64 is needed.
    fr: |-
      Un cluster IPv6 donne aux pods des adresses IPv6, ce qui supprime l'épuisement IPv4 des pods. La famille IP se choisit à la création du cluster, d'où la nécessité d'un nouveau cluster, et les clusters IPv6 avec des nœuds EC2 exigent des instances basées sur Nitro et la délégation de préfixes du VPC CNI. Lorsque les pods appellent des points de terminaison IPv4, leur adresse IPv4 locale à l'hôte est traduite vers l'adresse IPv4 principale du nœud : ni DNS64 ni NAT64 ne sont nécessaires.
  options:
    b:
      en: |-
        The IP family of an EKS cluster cannot be changed after the cluster is created.
      fr: |-
        La famille IP d'un cluster EKS ne peut pas être modifiée après sa création.
    c:
      en: |-
        Custom networking cannot be used with IPv6 clusters.
      fr: |-
        La mise en réseau personnalisée ne peut pas être utilisée avec les clusters IPv6.
    d:
      en: |-
        IPv6 clusters with EC2 nodes require the Amazon VPC CNI to be configured with IP prefix delegation.
      fr: |-
        Les clusters IPv6 avec des nœuds EC2 exigent que l'Amazon VPC CNI soit configuré avec la délégation de préfixes IP.
references:
  - title: Learn about IPv6 addresses to clusters, Pods, and services - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/cni-ipv6.html
