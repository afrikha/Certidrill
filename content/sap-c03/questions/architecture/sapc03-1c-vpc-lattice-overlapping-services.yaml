id: sapc03-1c-vpc-lattice-overlapping-services
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company that grew through acquisitions has 30 internal microservices across 12 AWS accounts in AWS Organizations. The services run on Amazon EC2, Amazon ECS and AWS Lambda, and several of the VPCs use the same CIDR block. Services must call each other over HTTPS, and each service owner must authorize callers with IAM-based policies on the service. The network team does not want to renumber VPCs or manage routing between them. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise qui a grandi par acquisitions possède 30 microservices internes répartis dans 12 comptes AWS d'AWS Organizations. Les services s'exécutent sur Amazon EC2, Amazon ECS et AWS Lambda, et plusieurs VPC utilisent le même bloc CIDR. Les services doivent s'appeler entre eux en HTTPS, et chaque propriétaire de service doit autoriser les appelants avec des politiques basées sur IAM appliquées au service. L'équipe réseau ne veut ni renuméroter les VPC ni gérer le routage entre eux. L'entreprise veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach all VPCs to a shared transit gateway, propagate their routes into a single route table, and authorize callers with security group rules that reference the callers' CIDR blocks."
        fr: "Attacher tous les VPC à une passerelle de transit (transit gateway) partagée, propager leurs routes dans une seule table de routage, et autoriser les appelants avec des règles de groupe de sécurité qui référencent les blocs CIDR des appelants."
    - id: b
      text:
        en: "Create an Amazon VPC Lattice service network, share it with the accounts through AWS RAM, associate the VPCs and services with it, and attach auth policies to the services."
        fr: "Créer un réseau de services Amazon VPC Lattice, le partager avec les comptes par AWS RAM, y associer les VPC et les services, et attacher des politiques d'authentification (auth policies) aux services."
    - id: c
      text:
        en: "Create an AWS PrivateLink endpoint service in front of each microservice, and create an interface endpoint for every service in each VPC that calls it."
        fr: "Créer un service de point de terminaison AWS PrivateLink devant chaque microservice, et créer un point de terminaison d'interface pour chaque service dans chaque VPC qui l'appelle."
    - id: d
      text:
        en: "Create VPC peering connections between every pair of VPCs that must communicate, and use security group rules that reference security groups in the peer VPCs."
        fr: "Créer des connexions d'appairage de VPC entre chaque paire de VPC qui doivent communiquer, et utiliser des règles de groupe de sécurité qui référencent les groupes de sécurité des VPC appairés."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      VPC Lattice connects services across VPCs and accounts and supports overlapping CIDR ranges, so no routing or renumbering is needed. Targets can be EC2 instances, ECS tasks and Lambda functions, and auth policies on each service or on the service network authorize callers. The service network is shared with the other accounts through AWS RAM.
    fr: |-
      VPC Lattice relie des services entre VPC et entre comptes et prend en charge les plages CIDR qui se chevauchent : aucun routage ni renumérotation n'est nécessaire. Les cibles peuvent être des instances EC2, des tâches ECS et des fonctions Lambda, et des politiques d'authentification sur chaque service ou sur le réseau de services autorisent les appelants. Le réseau de services est partagé avec les autres comptes par AWS RAM.
  options:
    a:
      en: |-
        A transit gateway cannot route between VPCs that use the same CIDR block, and CIDR-based rules are not IAM-based authorization.
      fr: |-
        Une passerelle de transit ne peut pas router entre des VPC qui utilisent le même bloc CIDR, et des règles basées sur des CIDR ne sont pas une autorisation basée sur IAM.
    c:
      en: |-
        One endpoint service and Network Load Balancer per microservice, plus an interface endpoint per caller VPC, is far more to build and manage than one service network.
      fr: |-
        Un service de point de terminaison et un Network Load Balancer par microservice, plus un point de terminaison d'interface par VPC appelant, représentent bien plus de ressources à créer et à gérer qu'un seul réseau de services.
    d:
      en: |-
        Peering cannot connect VPCs with overlapping CIDR blocks, and a mesh of peering connections is hard to manage.
      fr: |-
        L'appairage ne peut pas relier des VPC dont les blocs CIDR se chevauchent, et un maillage de connexions d'appairage est difficile à gérer.
references:
  - title: What is Amazon VPC Lattice? - Amazon VPC Lattice
    url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/what-is-vpc-lattice.html
