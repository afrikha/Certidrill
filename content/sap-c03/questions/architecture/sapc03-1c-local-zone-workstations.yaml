id: sapc03-1c-local-zone-workstations
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An architecture firm has 400 designers in a single metropolitan area. The designers use virtual workstations that require a round-trip network latency below 10 ms from their offices. The firm's AWS workloads run in a Region about 2,000 km away, where the measured latency from the offices is about 35 ms. An AWS Local Zone that offers the required GPU instance types exists in the designers' metropolitan area. The firm has no data center space and wants to pay only for the resources it uses.

    Which solution will meet these requirements?
  fr: |
    Un cabinet d'architectes compte 400 concepteurs dans une même agglomération. Les concepteurs utilisent des postes de travail virtuels qui exigent une latence réseau aller-retour inférieure à 10 ms depuis leurs bureaux. Les charges de travail AWS du cabinet s'exécutent dans une Région située à environ 2 000 km, avec une latence mesurée d'environ 35 ms depuis les bureaux. Une AWS Local Zone qui propose les types d'instances GPU requis existe dans l'agglomération des concepteurs. Le cabinet n'a pas d'espace en centre de données et veut ne payer que les ressources qu'il utilise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable the Local Zone, create a subnet in it in the firm's existing VPC, launch the workstations in that subnet, and connect the offices to the Local Zone through AWS Direct Connect."
        fr: "Activer la Local Zone, y créer un sous-réseau dans le VPC existant du cabinet, lancer les postes de travail dans ce sous-réseau, et relier les bureaux à la Local Zone par AWS Direct Connect."
    - id: b
      text:
        en: "Order an AWS Outposts rack, install it in a colocation facility in the metropolitan area, and extend the firm's VPC to the Outposts rack to host the workstations."
        fr: "Commander un rack AWS Outposts, l'installer dans un centre de colocation de l'agglomération, et étendre le VPC du cabinet au rack Outposts pour héberger les postes de travail."
    - id: c
      text:
        en: "Keep the workstations in the parent Region, and put an AWS Global Accelerator standard accelerator in front of them to carry designer traffic over the AWS global network."
        fr: "Conserver les postes de travail dans la Région parente, et placer devant eux un accélérateur standard AWS Global Accelerator pour faire passer le trafic des concepteurs par le réseau mondial AWS."
    - id: d
      text:
        en: "Keep the workstations in the parent Region, and deliver the workstation streams through an Amazon CloudFront distribution with edge locations in the metropolitan area."
        fr: "Conserver les postes de travail dans la Région parente, et diffuser les flux des postes de travail par une distribution Amazon CloudFront disposant d'emplacements périphériques dans l'agglomération."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Local Zone is an extension of a Region close to users: after the zone is enabled, a subnet in it extends the existing VPC, and instances there have low latency to the metropolitan area. Traffic to a Local Zone over Direct Connect does not pass through the parent Region, and the firm pays only for the resources it deploys.
    fr: |-
      Une Local Zone est une extension d'une Région proche des utilisateurs : une fois la zone activée, un sous-réseau dans cette zone étend le VPC existant, et les instances qui s'y trouvent ont une faible latence vers l'agglomération. Le trafic Direct Connect vers une Local Zone ne passe pas par la Région parente, et le cabinet ne paie que les ressources qu'il déploie.
  options:
    b:
      en: |-
        An Outposts rack requires a facility that the firm does not have and a hardware commitment rather than pay-as-you-go pricing.
      fr: |-
        Un rack Outposts exige un local dont le cabinet ne dispose pas et un engagement matériel plutôt qu'une tarification à l'usage.
    c:
      en: |-
        Global Accelerator improves the network path but cannot remove the 2,000 km distance to the Region, so latency stays far above 10 ms.
      fr: |-
        Global Accelerator améliore le chemin réseau mais ne supprime pas les 2 000 km qui séparent de la Région : la latence reste bien supérieure à 10 ms.
    d:
      en: |-
        CloudFront caches and delivers content from the edge, but interactive workstation sessions would still run 2,000 km away.
      fr: |-
        CloudFront met en cache et diffuse du contenu depuis la périphérie, mais les sessions interactives des postes de travail s'exécuteraient toujours à 2 000 km.
references:
  - title: How AWS Local Zones work - AWS Local Zones
    url: https://docs.aws.amazon.com/local-zones/latest/ug/how-local-zones-work.html
