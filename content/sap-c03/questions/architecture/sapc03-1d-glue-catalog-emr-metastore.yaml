id: sapc03-1d-glue-catalog-emr-metastore
objective: "1.5.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A data platform team runs transient Amazon EMR clusters that start for each nightly batch and terminate afterward. Each cluster uses a local Hive metastore, so scripts recreate the table definitions at every start, and the definitions sometimes differ between clusters. Analysts also want to query the same tables with Amazon Athena and Amazon Redshift Spectrum. The team wants one persistent metadata catalog for all these services.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe de plateforme de données exécute des clusters Amazon EMR temporaires qui démarrent pour chaque traitement par lots nocturne puis s'arrêtent. Chaque cluster utilise un metastore Hive local : des scripts recréent les définitions de tables à chaque démarrage, et ces définitions diffèrent parfois d'un cluster à l'autre. Les analystes veulent aussi interroger les mêmes tables avec Amazon Athena et Amazon Redshift Spectrum. L'équipe veut un catalogue de métadonnées persistant unique pour tous ces services.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Run a Hive metastore database on an Amazon RDS for MySQL DB instance, configure each EMR cluster to use it, and copy the definitions to Athena with DDL scripts."
        fr: "Exécuter une base de données de metastore Hive sur une instance Amazon RDS for MySQL, configurer chaque cluster EMR pour l'utiliser, et copier les définitions vers Athena avec des scripts DDL."
    - id: b
      text:
        en: "Store the table definitions as JSON documents in an Amazon DynamoDB table, and load them into each new EMR cluster with a bootstrap action."
        fr: "Stocker les définitions de tables sous forme de documents JSON dans une table Amazon DynamoDB, et les charger dans chaque nouveau cluster EMR avec une action d'amorçage."
    - id: c
      text:
        en: "Keep one long-running EMR cluster that hosts the Hive metastore, and configure the transient clusters and Athena to connect to that metastore."
        fr: "Conserver un cluster EMR permanent qui héberge le metastore Hive, et configurer les clusters temporaires et Athena pour qu'ils se connectent à ce metastore."
    - id: d
      text:
        en: "Configure the EMR clusters to use the AWS Glue Data Catalog as their Hive metastore, and use the same catalog from Athena and Redshift Spectrum."
        fr: "Configurer les clusters EMR pour qu'ils utilisent AWS Glue Data Catalog comme metastore Hive, et utiliser ce même catalogue depuis Athena et Redshift Spectrum."
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Glue Data Catalog is a managed, drop-in replacement for the Apache Hive metastore. EMR clusters configured with the hive-site classification store table and partition metadata in it, so the metadata survives cluster termination and is shared across clusters, and Athena and Redshift Spectrum use the same catalog natively.
    fr: |
      AWS Glue Data Catalog est un remplacement géré et direct du metastore Apache Hive. Les clusters EMR configurés avec la classification hive-site y stockent les métadonnées des tables et des partitions : elles survivent à l'arrêt des clusters et sont partagées entre eux, et Athena et Redshift Spectrum utilisent nativement le même catalogue.
  options:
    a:
      en: |
        An external metastore on RDS persists the definitions for EMR, but the company manages the database and must keep a second copy of the definitions in sync for Athena.
      fr: |
        Un metastore externe sur RDS conserve les définitions pour EMR, mais l'entreprise gère la base de données et doit maintenir une seconde copie des définitions synchronisée pour Athena.
    b:
      en: |
        This is a home-grown metadata store that the team must build and maintain, and Athena and Redshift Spectrum cannot read it.
      fr: |
        Il s'agit d'un magasin de métadonnées maison que l'équipe doit développer et maintenir, et Athena et Redshift Spectrum ne peuvent pas le lire.
    c:
      en: |
        A cluster that runs all the time costs money and must be operated, and it becomes a single point of failure for every other cluster.
      fr: |
        Un cluster qui fonctionne en permanence coûte de l'argent et doit être exploité, et il devient un point de défaillance unique pour tous les autres clusters.
references:
  - title: Using the AWS Glue Data Catalog as the metastore for Hive
    url: https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-hive-metastore-glue.html
  - title: AWS Glue components
    url: https://docs.aws.amazon.com/glue/latest/dg/components-overview.html
