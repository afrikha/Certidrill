id: sapc03-1b-bedrock-central-endpoint
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs workloads in 25 VPCs that belong to different accounts of its organization in the us-east-1 Region. All VPCs are attached to a transit gateway together with a shared services VPC, and the VPCs have no internet access. Traffic to AWS services must not traverse the internet. Several workloads now need to call Amazon Bedrock runtime APIs with the default service endpoint names in their SDKs. The network team wants to manage the private connectivity to Bedrock in one place, avoid deploying endpoints in every VPC, and restrict which IAM roles can invoke models through it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle exécute des charges de travail dans 25 VPC appartenant à différents comptes de son organisation dans la Région us-east-1. Tous les VPC sont attachés à une passerelle de transit avec un VPC de services partagés, et les VPC n'ont pas d'accès à Internet. Le trafic vers les services AWS ne doit pas traverser Internet. Plusieurs charges de travail doivent maintenant appeler les API d'exécution d'Amazon Bedrock avec les noms de point de terminaison par défaut du service dans leurs SDK. L'équipe réseau veut gérer la connectivité privée vers Bedrock à un seul endroit, éviter de déployer des points de terminaison dans chaque VPC et restreindre les rôles IAM qui peuvent invoquer des modèles par ce biais.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a gateway VPC endpoint for Amazon Bedrock in the shared services VPC, add it to the route tables of the spoke VPCs through the transit gateway, and attach an endpoint policy that lists the allowed roles."
        fr: "Créer un point de terminaison VPC de passerelle pour Amazon Bedrock dans le VPC de services partagés, l'ajouter aux tables de routage des VPC spoke via la passerelle de transit, et attacher une politique de point de terminaison qui liste les rôles autorisés."
    - id: b
      text:
        en: "Create an interface endpoint for bedrock-runtime in the shared services VPC with private DNS enabled, and rely on the transit gateway routes for the spoke VPCs to resolve and reach the endpoint."
        fr: "Créer un point de terminaison d'interface pour bedrock-runtime dans le VPC de services partagés avec le DNS privé activé, et compter sur les routes de la passerelle de transit pour que les VPC spoke résolvent et atteignent le point de terminaison."
    - id: c
      text:
        en: "Create an interface endpoint for bedrock-runtime in the shared services VPC with private DNS disabled and an endpoint policy, and associate with the spoke VPCs a private hosted zone that aliases the Regional bedrock-runtime name to it."
        fr: "Créer un point de terminaison d'interface pour bedrock-runtime dans le VPC de services partagés avec le DNS privé désactivé et une politique de point de terminaison, et associer aux VPC spoke une zone hébergée privée qui fait du nom régional de bedrock-runtime un alias de ce point de terminaison."
    - id: d
      text:
        en: "Add a NAT gateway and an internet gateway to the shared services VPC, route the spoke VPCs' internet traffic through the transit gateway to the NAT gateway, and restrict Bedrock with SCPs."
        fr: "Ajouter une passerelle NAT et une passerelle Internet au VPC de services partagés, acheminer le trafic Internet des VPC spoke via la passerelle de transit vers la passerelle NAT, et restreindre Bedrock avec des SCP."
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock is reached privately through interface endpoints such as com.amazonaws.region.bedrock-runtime, and a custom endpoint policy restricts the principals and actions allowed through it. With private DNS disabled on a centralized endpoint, a private hosted zone for bedrock-runtime.us-east-1.amazonaws.com that points to the endpoint and is associated with the spoke VPCs lets their SDKs keep the default names while traffic crosses the transit gateway."
    fr: "Amazon Bedrock s'atteint de manière privée via des points de terminaison d'interface comme com.amazonaws.region.bedrock-runtime, et une politique de point de terminaison personnalisée restreint les principaux et les actions autorisés à travers lui. Avec le DNS privé désactivé sur un point de terminaison centralisé, une zone hébergée privée pour bedrock-runtime.us-east-1.amazonaws.com qui pointe vers le point de terminaison et est associée aux VPC spoke permet à leurs SDK de garder les noms par défaut, le trafic traversant la passerelle de transit."
  options:
    a:
      en: "Gateway endpoints exist only for Amazon S3 and DynamoDB, and they cannot be used from other VPCs through a transit gateway; Bedrock uses interface endpoints."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB, et ils ne sont pas utilisables depuis d'autres VPC via une passerelle de transit : Bedrock utilise des points de terminaison d'interface."
    b:
      en: "Private DNS on an interface endpoint applies only inside the VPC of the endpoint, so the spoke VPCs keep resolving the public addresses, which they cannot reach."
      fr: "Le DNS privé d'un point de terminaison d'interface ne s'applique qu'à l'intérieur du VPC du point de terminaison : les VPC spoke continuent de résoudre les adresses publiques, qu'ils ne peuvent pas atteindre."
    d:
      en: "The traffic would leave through the internet gateway to the public Bedrock endpoints, which the requirement forbids, and it would give the spoke VPCs general internet access."
      fr: "Le trafic sortirait par la passerelle Internet vers les points de terminaison publics de Bedrock, ce que l'exigence interdit, et les VPC spoke obtiendraient un accès général à Internet."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
