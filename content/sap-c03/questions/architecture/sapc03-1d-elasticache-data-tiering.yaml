id: sapc03-1d-elasticache-data-tiering
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel booking company caches 3 TB of fare quotes in an Amazon ElastiCache for Valkey 8 cluster with cluster mode enabled that runs on memory-optimized r7g nodes. Monitoring shows that about 15% of the keys receive almost all requests, while the other values are read only occasionally. The application can tolerate a few hundred microseconds of extra latency when it reads the rarely used values. The cache is the largest item on the project's bill. The company does not want to change the application code.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise de réservation de voyages met en cache 3 To de devis tarifaires dans un cluster Amazon ElastiCache for Valkey 8 avec le mode cluster activé, qui s'exécute sur des nœuds r7g optimisés pour la mémoire. La surveillance montre qu'environ 15 % des clés reçoivent presque toutes les requêtes, tandis que les autres valeurs ne sont lues qu'occasionnellement. L'application tolère quelques centaines de microsecondes de latence supplémentaire quand elle lit les valeurs rarement utilisées. Le cache est le poste le plus important de la facture du projet. L'entreprise ne veut pas modifier le code de l'application.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Shorten the TTL of every key so that rarely read fare quotes are evicted, and have the application reload them from the database on the next request."
        fr: "Raccourcir la TTL de chaque clé afin que les devis rarement lus soient évincés, et faire en sorte que l'application les recharge depuis la base de données à la requête suivante."
    - id: b
      text:
        en: "Move the data to an Amazon MemoryDB cluster with the same node size, because MemoryDB stores data durably in a Multi-AZ transactional log."
        fr: "Déplacer les données vers un cluster Amazon MemoryDB de même taille de nœud, car MemoryDB stocke les données de manière durable dans un journal transactionnel Multi-AZ."
    - id: c
      text:
        en: "Move the data to a new cluster that uses r7gd nodes with data tiering, so that the less frequently accessed values are moved to local SSD storage."
        fr: "Déplacer les données vers un nouveau cluster qui utilise des nœuds r7gd avec la hiérarchisation des données (data tiering), afin que les valeurs moins souvent consultées soient déplacées vers le stockage SSD local."
    - id: d
      text:
        en: "Scale the cluster out with more shards of a smaller r7g node type so that the same 3 TB of data fits in memory across more nodes."
        fr: "Monter le cluster en charge horizontalement avec davantage de partitions d'un type de nœud r7g plus petit afin que les mêmes 3 To de données tiennent en mémoire sur davantage de nœuds."
answer: { optionId: c }
explanation:
  correct:
    en: |
      On r6gd, r7gd and r8gd nodes, data tiering keeps all keys in memory and uses an LRU algorithm to move infrequently accessed values to local SSD. It suits workloads that regularly access up to 20% of their data set, adds about 300 microseconds on SSD reads for small values, needs no client changes, and AWS cites savings of over 60% for r6gd nodes compared with memory-only r6g nodes at maximum utilization. Online migration is not supported, so the data moves to a new cluster.
    fr: |
      Sur les nœuds r6gd, r7gd et r8gd, la hiérarchisation des données garde toutes les clés en mémoire et utilise un algorithme LRU pour déplacer les valeurs peu consultées vers le SSD local. Elle convient aux charges de travail qui accèdent régulièrement à 20 % au plus de leur jeu de données, ajoute environ 300 microsecondes aux lectures sur SSD pour de petites valeurs, n'exige aucune modification des clients, et AWS annonce plus de 60 % d'économies pour les nœuds r6gd par rapport aux nœuds r6g uniquement en mémoire, à utilisation maximale. La migration en ligne n'est pas prise en charge : les données sont déplacées vers un nouveau cluster.
  options:
    a:
      en: |
        TTLs are set by the application, so this changes the code, and every evicted quote becomes a cache miss that loads the database.
      fr: |
        Les TTL sont définies par l'application : cela modifie le code, et chaque devis évincé devient un échec de cache qui charge la base de données.
    b:
      en: |
        MemoryDB adds durability for a primary database, which a cache does not need, and it still keeps all data in memory, so it does not lower cost.
      fr: |
        MemoryDB ajoute une durabilité destinée à une base de données principale, dont un cache n'a pas besoin, et conserve toujours toutes les données en mémoire : il ne réduit pas les coûts.
    d:
      en: |
        Smaller nodes still hold all 3 TB in DRAM, so the total memory paid for stays about the same.
      fr: |
        Des nœuds plus petits conservent toujours les 3 To en DRAM : la mémoire totale payée reste à peu près la même.
references:
  - title: Data tiering in ElastiCache
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/data-tiering.html
