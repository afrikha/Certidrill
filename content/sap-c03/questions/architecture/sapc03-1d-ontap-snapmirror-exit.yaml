id: sapc03-1d-ontap-snapmirror-exit
objective: "1.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must migrate a 300 TB on-premises NetApp ONTAP cluster to AWS within 3 months. Linux clients access the volumes over NFS and Windows clients access the same volumes over SMB, and the volumes contain about 400 million small files. The storage efficiency savings from deduplication and compression must be kept, and the existing ONTAP Snapshot copies must be preserved. The data changes continuously, and the cutover window is 2 hours. The company has a 10 Gbps AWS Direct Connect connection, and the on-premises cluster has a SnapMirror license.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit migrer vers AWS un cluster NetApp ONTAP sur site de 300 To dans un délai de 3 mois. Des clients Linux accèdent aux volumes en NFS et des clients Windows accèdent aux mêmes volumes en SMB, et les volumes contiennent environ 400 millions de petits fichiers. Les économies de stockage obtenues par la déduplication et la compression doivent être conservées, et les copies Snapshot ONTAP existantes doivent être préservées. Les données changent en permanence, et la fenêtre de bascule est de 2 heures. L'entreprise dispose d'une connexion AWS Direct Connect de 10 Gbit/s, et le cluster sur site possède une licence SnapMirror.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon FSx for NetApp ONTAP file system, copy the files with AWS DataSync tasks over Direct Connect, and run a final incremental task during the cutover window."
        fr: "Créer un système de fichiers Amazon FSx for NetApp ONTAP, copier les fichiers avec des tâches AWS DataSync via Direct Connect, et exécuter une dernière tâche incrémentielle pendant la fenêtre de bascule."
    - id: b
      text:
        en: "Create an Amazon FSx for Windows File Server file system and an Amazon EFS file system, and use AWS DataSync to copy the SMB data and the NFS data to each of them."
        fr: "Créer un système de fichiers Amazon FSx for Windows File Server et un système de fichiers Amazon EFS, et utiliser AWS DataSync pour y copier respectivement les données SMB et les données NFS."
    - id: c
      text:
        en: "Deploy an Amazon S3 File Gateway on premises, copy the volumes to its file shares, and have the clients mount the file shares after the migration."
        fr: "Déployer une passerelle Amazon S3 File Gateway sur site, copier les volumes vers ses partages de fichiers, et faire monter les partages par les clients après la migration."
    - id: d
      text:
        en: "Create an Amazon FSx for NetApp ONTAP file system, peer the clusters and SVMs, replicate the volumes with scheduled SnapMirror updates, and break the relationships at cutover."
        fr: "Créer un système de fichiers Amazon FSx for NetApp ONTAP, établir le peering entre les clusters et entre les SVM, répliquer les volumes avec des mises à jour SnapMirror planifiées, et rompre les relations lors de la bascule."
answer: { optionId: d }
explanation:
  correct:
    en: |
      SnapMirror replicates ONTAP volumes at block level, keeps deduplicated and compressed data in that state and preserves existing Snapshot copies; AWS recommends it for more than 50 million files and for very small files. After a baseline transfer, scheduled updates keep the destination current, and the cutover is a final update, quiesce and break, which fits a 2-hour window. FSx for ONTAP keeps NFS and SMB access to the same volumes.
    fr: |
      SnapMirror réplique les volumes ONTAP au niveau des blocs, conserve les données dédupliquées et compressées dans cet état et préserve les copies Snapshot existantes ; AWS le recommande au-delà de 50 millions de fichiers et pour les très petits fichiers. Après un transfert de référence, des mises à jour planifiées maintiennent la destination à jour, et la bascule consiste en une dernière mise à jour, une mise en veille (quiesce) et une rupture (break), ce qui tient dans une fenêtre de 2 heures. FSx for ONTAP conserve l'accès NFS et SMB aux mêmes volumes.
  options:
    a:
      en: |
        DataSync copies files, not volumes, so the ONTAP Snapshot copies are not preserved, and scanning 400 million small files makes each incremental pass slow.
      fr: |
        DataSync copie des fichiers et non des volumes : les copies Snapshot ONTAP ne sont pas préservées, et l'analyse de 400 millions de petits fichiers rend chaque passe incrémentielle lente.
    b:
      en: |
        Splitting the data between two services breaks multiprotocol access to the same volumes, and the Snapshot copies and efficiency savings are lost.
      fr: |
        Répartir les données entre deux services rompt l'accès multiprotocole aux mêmes volumes, et les copies Snapshot ainsi que les économies de stockage sont perdues.
    c:
      en: |
        S3 File Gateway stores files as S3 objects, so ONTAP Snapshot copies and storage efficiency are lost, and it does not preserve the NetApp volume features.
      fr: |
        S3 File Gateway stocke les fichiers comme objets S3 : les copies Snapshot ONTAP et l'efficacité du stockage sont perdues, et elle ne préserve pas les fonctionnalités des volumes NetApp.
references:
  - title: Migrating to FSx for ONTAP using NetApp SnapMirror
    url: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/migrating-fsx-ontap-snapmirror.html
