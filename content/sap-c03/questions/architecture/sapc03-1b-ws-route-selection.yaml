id: sapc03-1b-ws-route-selection
objective: "1.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company is building a driver application that keeps a connection open to an Amazon API Gateway WebSocket API. Every few seconds, the application sends JSON messages whose action field is location, and occasionally it sends messages whose action field is chat. Location messages must be processed by an AWS Lambda function, and chat messages must be forwarded to the existing HTTPS endpoint of a chat service. Dispatchers must be able to send a message to one specific driver at any time from a backend service.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de logistique crée une application pour chauffeurs qui maintient une connexion ouverte vers une API WebSocket Amazon API Gateway. Toutes les quelques secondes, l'application envoie des messages JSON dont le champ action vaut location, et elle envoie parfois des messages dont le champ action vaut chat. Les messages de position doivent être traités par une fonction AWS Lambda, et les messages de discussion doivent être transmis au point de terminaison HTTPS existant d'un service de discussion. Les répartiteurs doivent pouvoir envoyer à tout moment un message à un chauffeur précis depuis un service backend.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set the route selection expression to $request.body.action, and create a location route integrated with the Lambda function and a chat route with an HTTP integration to the chat service."
        fr: "Définir l'expression de sélection de route sur $request.body.action, et créer une route location intégrée à la fonction Lambda et une route chat avec une intégration HTTP vers le service de discussion."
    - id: b
      text:
        en: "Create a REST API resource for each action, and turn on WebSocket support on the deployment stage of the REST API so that the drivers' messages reach these resources."
        fr: "Créer une ressource d'API REST pour chaque action, et activer la prise en charge WebSocket sur l'étape de déploiement de l'API REST afin que les messages des chauffeurs atteignent ces ressources."
    - id: c
      text:
        en: "Store each driver's connection ID when the $connect route runs, and have the backend service send a signed POST request to the @connections endpoint of that connection ID."
        fr: "Stocker l'ID de connexion de chaque chauffeur lors de l'exécution de la route $connect, et faire envoyer par le service backend une requête POST signée vers le point de terminaison @connections de cet ID de connexion."
    - id: d
      text:
        en: "Create an Amazon SNS mobile push subscription for each driver on the stage of the WebSocket API, and have the backend service publish dispatcher messages to the topic."
        fr: "Créer un abonnement de notification push mobile Amazon SNS pour chaque chauffeur sur l'étape de l'API WebSocket, et faire publier les messages des répartiteurs dans la rubrique par le service backend."
    - id: e
      text:
        en: "Set the route selection expression to $request.header.action, and create custom routes named $location and $chat with the matching integrations."
        fr: "Définir l'expression de sélection de route sur $request.header.action, et créer des routes personnalisées nommées $location et $chat avec les intégrations correspondantes."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "The route selection expression points to a JSON property of each message, and API Gateway invokes the route whose key matches the evaluated value, each route having its own integration (Lambda or HTTP). To push to one driver, the backend keeps the connection ID and sends a SigV4-signed POST request to the @connections endpoint for that ID."
    fr: "L'expression de sélection de route désigne une propriété JSON de chaque message, et API Gateway invoque la route dont la clé correspond à la valeur évaluée, chaque route ayant sa propre intégration (Lambda ou HTTP). Pour envoyer à un chauffeur, le backend conserve l'ID de connexion et envoie une requête POST signée SigV4 vers le point de terminaison @connections de cet ID."
  options:
    b:
      en: "REST APIs are request-response APIs; WebSocket support is a separate API type, not a stage setting of a REST API."
      fr: "Les API REST fonctionnent en requête-réponse : la prise en charge WebSocket est un type d'API distinct, pas un paramètre d'étape d'une API REST."
    d:
      en: "SNS mobile push targets platform notification services, not WebSocket connections, and a WebSocket API stage has no SNS subscription setting."
      fr: "Les notifications push mobiles SNS ciblent des services de notification de plateformes, pas des connexions WebSocket, et une étape d'API WebSocket n'a pas de paramètre d'abonnement SNS."
    e:
      en: "The action is in the message body, not in a header, and route keys that start with $ are reserved for the predefined routes."
      fr: "L'action se trouve dans le corps du message, pas dans un en-tête, et les clés de route commençant par $ sont réservées aux routes prédéfinies."
references:
  - title: Create routes for WebSocket APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/websocket-api-develop-routes.html
  - title: Use @connections commands in your backend service
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-how-to-call-websocket-api-connections.html
