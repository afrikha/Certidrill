id: sapc03-1d-redshift-streaming-no-s3
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company publishes card authorization events to an Amazon Kinesis Data Streams data stream. A fraud operations team uses dashboards on an Amazon Redshift Serverless workgroup. The team needs new events to be queryable in Redshift within seconds and joined with customer risk tables that already exist in Redshift. A data minimization policy forbids storing copies of raw authorization events anywhere other than the Kinesis stream and the Redshift workgroup, including temporary copies in Amazon S3. The team has strong SQL skills but does not want to build or operate custom consumer applications.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de paiement publie des événements d'autorisation de carte dans un flux de données Amazon Kinesis Data Streams. Une équipe des opérations antifraude utilise des tableaux de bord sur un groupe de travail Amazon Redshift Serverless. L'équipe a besoin que les nouveaux événements puissent être interrogés dans Redshift en quelques secondes et joints à des tables de risque client qui existent déjà dans Redshift. Une politique de minimisation des données interdit de stocker des copies des événements d'autorisation bruts ailleurs que dans le flux Kinesis et le groupe de travail Redshift, y compris des copies temporaires dans Amazon S3. L'équipe a de solides compétences SQL mais ne veut ni développer ni exploiter d'applications consommatrices personnalisées.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon Data Firehose stream that reads from the Kinesis data stream and delivers the events to the Redshift Serverless workgroup with the smallest buffering interval."
        fr: "Créer un flux Amazon Data Firehose qui lit le flux de données Kinesis et livre les événements au groupe de travail Redshift Serverless avec le plus petit intervalle de mise en mémoire tampon."
    - id: b
      text:
        en: "Map the Kinesis stream to an external schema in Redshift and create a streaming materialized view with AUTO REFRESH. Join it with the risk tables through a second materialized view."
        fr: "Mapper le flux Kinesis à un schéma externe dans Redshift et créer une vue matérialisée de streaming avec AUTO REFRESH. La joindre aux tables de risque via une seconde vue matérialisée."
    - id: c
      text:
        en: "Run an Amazon Managed Service for Apache Flink application that writes the events to Apache Iceberg tables in Amazon S3, and query the tables from Redshift with Redshift Spectrum."
        fr: "Exécuter une application Amazon Managed Service for Apache Flink qui écrit les événements dans des tables Apache Iceberg dans Amazon S3, et interroger ces tables depuis Redshift avec Redshift Spectrum."
    - id: d
      text:
        en: "Configure an AWS Lambda function with the Kinesis stream as an event source that inserts each batch of events into Redshift through the Amazon Redshift Data API."
        fr: "Configurer une fonction AWS Lambda avec le flux Kinesis comme source d'événements qui insère chaque lot d'événements dans Redshift via l'API Amazon Redshift Data."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Redshift streaming ingestion makes the workgroup the stream consumer and loads records directly into a streaming materialized view, with no temporary landing area in S3. AUTO REFRESH loads data as it arrives for near-real-time queries, and because joins are not supported directly in the streaming view, a second materialized view on top of it joins the risk tables. Everything is defined in SQL.
    fr: |
      L'ingestion en streaming de Redshift fait du groupe de travail le consommateur du flux et charge les enregistrements directement dans une vue matérialisée de streaming, sans zone de dépôt temporaire dans S3. AUTO REFRESH charge les données à leur arrivée pour des requêtes en quasi temps réel, et comme les jointures ne sont pas prises en charge directement dans la vue de streaming, une seconde vue matérialisée construite dessus joint les tables de risque. Tout est défini en SQL.
  options:
    a:
      en: |
        For a Redshift destination, Firehose first delivers the data to an intermediate S3 bucket and then runs a COPY command, which breaks the data minimization policy.
      fr: |
        Pour une destination Redshift, Firehose livre d'abord les données dans un compartiment S3 intermédiaire puis exécute une commande COPY, ce qui enfreint la politique de minimisation des données.
    c:
      en: |
        The events would be stored as Iceberg files in S3, which the policy forbids, and the team would build and operate a Flink application.
      fr: |
        Les événements seraient stockés sous forme de fichiers Iceberg dans S3, ce que la politique interdit, et l'équipe devrait développer et exploiter une application Flink.
    d:
      en: |
        This is a custom consumer that the team would have to write and operate, and many small inserts through the Data API load a warehouse inefficiently.
      fr: |
        Il s'agit d'un consommateur personnalisé que l'équipe devrait écrire et exploiter, et de nombreuses petites insertions via l'API Data chargent un entrepôt de manière inefficace.
references:
  - title: Streaming ingestion to a materialized view
    url: https://docs.aws.amazon.com/redshift/latest/dg/materialized-view-streaming-ingestion.html
  - title: Configure destination settings
    url: https://docs.aws.amazon.com/firehose/latest/dev/create-destination.html
