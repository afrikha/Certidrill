id: sapc03-1a-distributed-map-manifest
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company must regenerate the metadata of 40 million images. The list of images is in a CSV file in Amazon S3, and an AWS Lambda function processes one image at a time. The downstream metadata API accepts at most 500 concurrent calls. The job can tolerate up to 1% of failed items without failing as a whole, and the results of every item must be written to Amazon S3 for review. The company wants the LEAST operational overhead and no custom fan-out code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias doit régénérer les métadonnées de 40 millions d'images. La liste des images se trouve dans un fichier CSV dans Amazon S3, et une fonction AWS Lambda traite une image à la fois. L'API de métadonnées en aval accepte au plus 500 appels simultanés. La tâche peut tolérer jusqu'à 1 % d'éléments en échec sans échouer dans son ensemble, et les résultats de chaque élément doivent être écrits dans Amazon S3 pour examen. L'entreprise veut le MOINS de charge opérationnelle et aucun code de répartition personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Standard workflow with a Map state in Distributed mode that reads the CSV file with an ItemReader, sets MaxConcurrency to 500 and ToleratedFailurePercentage to 1, and writes the results to S3 with a ResultWriter.
        fr: |-
          Créer un flux de travail Standard avec un état Map en mode Distributed qui lit le fichier CSV avec un ItemReader, règle MaxConcurrency sur 500 et ToleratedFailurePercentage sur 1, et écrit les résultats dans S3 avec un ResultWriter.
    - id: b
      text:
        en: |-
          Create a Standard workflow with an inline Map state that receives the list of images in the execution input, sets MaxConcurrency to 500, and catches the errors of each iteration.
        fr: |-
          Créer un flux de travail Standard avec un état Map en ligne (inline) qui reçoit la liste des images dans l'entrée de l'exécution, règle MaxConcurrency sur 500 et intercepte les erreurs de chaque itération.
    - id: c
      text:
        en: |-
          Create an Express workflow with a Map state in Distributed mode that reads the CSV file with an ItemReader, sets MaxConcurrency to 500, and writes the results to S3 with a ResultWriter.
        fr: |-
          Créer un flux de travail Express avec un état Map en mode Distributed qui lit le fichier CSV avec un ItemReader, règle MaxConcurrency sur 500 et écrit les résultats dans S3 avec un ResultWriter.
    - id: d
      text:
        en: |-
          Write a Lambda function that reads the CSV file and invokes the processing function asynchronously for each image, and set the reserved concurrency of the processing function to 500.
        fr: |-
          Écrire une fonction Lambda qui lit le fichier CSV et appelle la fonction de traitement de manière asynchrone pour chaque image, et définir la simultanéité réservée de la fonction de traitement sur 500.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Distributed mode runs each iteration as a child workflow execution, reads large datasets such as a CSV file directly from S3, and supports up to 10,000 parallel child executions, which MaxConcurrency limits to what the downstream API accepts. ToleratedFailurePercentage lets the Map Run succeed with up to 1% failed items, and ResultWriter exports the results of the child executions to S3, grouped by status.
    fr: |-
      Le mode Distributed exécute chaque itération sous forme d'exécution de flux de travail enfant, lit directement dans S3 de grands jeux de données comme un fichier CSV et prend en charge jusqu'à 10 000 exécutions enfants en parallèle, ce que MaxConcurrency limite à ce que l'API en aval accepte. ToleratedFailurePercentage permet à l'exécution Map (Map Run) de réussir avec jusqu'à 1 % d'éléments en échec, et ResultWriter exporte dans S3 les résultats des exécutions enfants, regroupés par statut.
  options:
    b:
      en: |-
        Inline mode supports at most 40 concurrent iterations and a 256 KiB dataset in the input, and the execution history of one workflow would exceed 25,000 events for 40 million items.
      fr: |-
        Le mode en ligne prend en charge au plus 40 itérations simultanées et un jeu de données de 256 Kio dans l'entrée, et l'historique d'exécution d'un seul flux de travail dépasserait 25 000 événements pour 40 millions d'éléments.
    c:
      en: |-
        Distributed mode is not supported in Express workflows; the parent workflow must be a Standard workflow, even if the child executions are Express.
      fr: |-
        Le mode Distributed n'est pas pris en charge dans les flux de travail Express ; le flux de travail parent doit être Standard, même si les exécutions enfants sont de type Express.
    d:
      en: |-
        A custom dispatcher is the fan-out code that the company wants to avoid, and it provides no failure threshold or consolidated results in S3.
      fr: |-
        Un répartiteur personnalisé est le code de répartition que l'entreprise veut éviter, et il ne fournit ni seuil d'échec ni résultats consolidés dans S3.
references:
  - title: Using Map state in Distributed mode for large-scale parallel workloads in Step Functions - AWS Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-distributed.html
