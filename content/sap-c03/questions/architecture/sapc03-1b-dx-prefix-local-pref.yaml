id: sapc03-1b-dx-prefix-local-pref
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany connects its data center to AWS through two AWS Direct Connect dedicated connections at two locations: DX-A, in the company's city, and DX-B, 600 km away. Each connection has a transit virtual interface to the same Direct Connect gateway, which is associated with a transit gateway. Traffic from the VPCs to the data center network 10.20.0.0/16 must use DX-A and must fail over to DX-B only if DX-A fails. The router at DX-A advertises 10.20.0.0/16. The router at DX-B advertises 10.20.0.0/17 and 10.20.128.0/17, with its AS number prepended three times. Traffic from AWS to the data center still flows through DX-B.

    Which change will make DX-A the primary path and DX-B the backup path?
  fr: |
    AnyCompany relie son centre de données à AWS par deux connexions dédiées AWS Direct Connect sur deux emplacements : DX-A, dans la ville de l'entreprise, et DX-B, à 600 km. Chaque connexion dispose d'une interface virtuelle de transit vers la même passerelle Direct Connect, associée à une passerelle de transit. Le trafic des VPC vers le réseau du centre de données 10.20.0.0/16 doit utiliser DX-A et ne basculer vers DX-B que si DX-A tombe en panne. Le routeur de DX-A annonce 10.20.0.0/16. Le routeur de DX-B annonce 10.20.0.0/17 et 10.20.128.0/17, avec son numéro d'AS ajouté trois fois en tête (prepending). Le trafic d'AWS vers le centre de données passe toujours par DX-B.

    Quelle modification fera de DX-A le chemin principal et de DX-B le chemin de secours ?
body:
  options:
    - id: a
      text:
        en: "Keep the advertised prefixes, and increase the AS_PATH prepending on the DX-B router from three to six repetitions of the company's AS number."
        fr: "Conserver les préfixes annoncés, et porter l'ajout en tête de l'AS_PATH sur le routeur DX-B de trois à six répétitions du numéro d'AS de l'entreprise."
    - id: b
      text:
        en: "Keep the advertised prefixes, and tag the routes that the DX-B router advertises with the 7224:7100 BGP community so that AWS gives them a low local preference."
        fr: "Conserver les préfixes annoncés, et marquer les routes annoncées par le routeur DX-B avec la communauté BGP 7224:7100 afin qu'AWS leur attribue une préférence locale faible."
    - id: c
      text:
        en: "Advertise 10.20.0.0/16 from both routers, and tag the routes at DX-A with the 7224:7300 BGP community and the routes at DX-B with the 7224:7100 BGP community."
        fr: "Annoncer 10.20.0.0/16 depuis les deux routeurs, et marquer les routes de DX-A avec la communauté BGP 7224:7300 et celles de DX-B avec la communauté BGP 7224:7100."
    - id: d
      text:
        en: "Configure Bidirectional Forwarding Detection on both routers, and lower the BGP hold timer of the DX-B sessions so that AWS prefers the sessions of DX-A."
        fr: "Configurer la détection de transfert bidirectionnel (BFD) sur les deux routeurs, et réduire le temporisateur de maintien BGP des sessions DX-B afin qu'AWS préfère les sessions de DX-A."
answer: { optionId: c }
explanation:
  correct:
    en: "For private and transit virtual interfaces, AWS evaluates the longest prefix first, then the local preference communities, then the AS_PATH length. The /17 routes from DX-B are more specific, so they win whatever their AS_PATH. Advertising the same prefix from both locations and tagging DX-A with 7224:7300 (high) and DX-B with 7224:7100 (low) creates an active/passive design."
    fr: "Pour les interfaces virtuelles privées et de transit, AWS évalue d'abord le préfixe le plus long, puis les communautés de préférence locale, puis la longueur de l'AS_PATH. Les routes /17 de DX-B sont plus spécifiques : elles l'emportent quel que soit leur AS_PATH. Annoncer le même préfixe depuis les deux emplacements et marquer DX-A avec 7224:7300 (élevée) et DX-B avec 7224:7100 (faible) crée une conception actif/passif."
  options:
    a:
      en: "AS_PATH is only a tiebreaker when prefix length and local preference are equal; the more specific /17 routes from DX-B still win."
      fr: "L'AS_PATH ne départage que si la longueur de préfixe et la préférence locale sont égales : les routes /17 plus spécifiques de DX-B l'emportent toujours."
    b:
      en: "Local preference is evaluated after the longest prefix, so the /17 routes from DX-B remain preferred over the /16 route from DX-A."
      fr: "La préférence locale est évaluée après le préfixe le plus long : les routes /17 de DX-B restent préférées à la route /16 de DX-A."
    d:
      en: "BFD and BGP timers only change how fast a failure is detected; they do not influence which path AWS selects."
      fr: "BFD et les temporisateurs BGP ne changent que la vitesse de détection d'une panne : ils n'influencent pas le chemin choisi par AWS."
references:
  - title: Direct Connect routing policies and BGP communities
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/routing-and-bgp.html
