id: sapc03-1c-alb-dualstack-no-ipv4-auth
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company wants to reduce its charges for public IPv4 addresses by changing the IP address type of its internet-facing Application Load Balancers. The VPCs and subnets are already dual-stack. ALB-A serves an API whose clients are all IPv6-capable servers. ALB-B serves a customer portal and uses an authenticate-cognito listener rule action with Amazon Cognito, and its users are also IPv6-capable. ALB-C serves a partner integration whose partners connect only over IPv4. Every application must keep working.

    Which configuration will meet these requirements?
  fr: |
    Une entreprise veut réduire ses frais d'adresses IPv4 publiques en modifiant le type d'adresse IP de ses Application Load Balancers exposés à Internet. Les VPC et les sous-réseaux sont déjà en double pile. ALB-A sert une API dont tous les clients sont des serveurs compatibles IPv6. ALB-B sert un portail client et utilise une action de règle d'écouteur authenticate-cognito avec Amazon Cognito ; ses utilisateurs sont eux aussi compatibles IPv6. ALB-C sert une intégration de partenaires qui ne se connectent qu'en IPv4. Chaque application doit continuer à fonctionner.

    Quelle configuration répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change all three load balancers to dualstack-without-public-ipv4, and publish AAAA alias records for each of them in Route 53."
        fr: "Passer les trois équilibreurs de charge en dualstack-without-public-ipv4, et publier pour chacun d'eux des enregistrements d'alias AAAA dans Route 53."
    - id: b
      text:
        en: "Change ALB-A and ALB-B to dualstack-without-public-ipv4, and change ALB-C to dualstack so that its partners keep IPv4 access."
        fr: "Passer ALB-A et ALB-B en dualstack-without-public-ipv4, et passer ALB-C en dualstack pour que ses partenaires conservent l'accès IPv4."
    - id: c
      text:
        en: "Change ALB-A and ALB-C to dualstack-without-public-ipv4, and keep ALB-B with the ipv4 IP address type for its Cognito users."
        fr: "Passer ALB-A et ALB-C en dualstack-without-public-ipv4, et conserver le type d'adresse IP ipv4 pour ALB-B et ses utilisateurs Cognito."
    - id: d
      text:
        en: "Change ALB-A to dualstack-without-public-ipv4, and use an IP address type with public IPv4, such as dualstack, for ALB-B and ALB-C."
        fr: "Passer ALB-A en dualstack-without-public-ipv4, et utiliser pour ALB-B et ALB-C un type d'adresse IP avec IPv4 public, comme dualstack."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      With dualstack-without-public-ipv4, clients must connect over IPv6, which suits only ALB-A. Application Load Balancer authentication supports only IPv4 when it connects to the identity provider or to Amazon Cognito, so without a public IPv4 address ALB-B fails authentication with HTTP 500 errors. ALB-C's partners need IPv4, so ALB-C must keep public IPv4 addresses.
    fr: |-
      Avec dualstack-without-public-ipv4, les clients doivent se connecter en IPv6, ce qui ne convient qu'à ALB-A. L'authentification des Application Load Balancers ne prend en charge que l'IPv4 pour se connecter au fournisseur d'identité ou à Amazon Cognito : sans adresse IPv4 publique, l'authentification d'ALB-B échoue avec des erreurs HTTP 500. Les partenaires d'ALB-C ont besoin de l'IPv4 : ALB-C doit conserver des adresses IPv4 publiques.
  options:
    a:
      en: |-
        ALB-C's IPv4-only partners could no longer connect, and ALB-B could no longer complete Cognito authentication.
      fr: |-
        Les partenaires IPv4 uniquement d'ALB-C ne pourraient plus se connecter, et ALB-B ne pourrait plus mener à bien l'authentification Cognito.
    b:
      en: |-
        ALB-B would lose the public IPv4 address that its authentication action needs to reach Amazon Cognito.
      fr: |-
        ALB-B perdrait l'adresse IPv4 publique dont son action d'authentification a besoin pour joindre Amazon Cognito.
    c:
      en: |-
        ALB-C's partners connect only over IPv4, which dualstack-without-public-ipv4 does not accept from clients.
      fr: |-
        Les partenaires d'ALB-C ne se connectent qu'en IPv4, ce que dualstack-without-public-ipv4 n'accepte pas de la part des clients.
references:
  - title: Application Load Balancers - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
