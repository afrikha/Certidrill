id: sapc03-1c-tgw-appliance-mode-asymmetric
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company inspects traffic between its VPCs by routing it through a transit gateway to an inspection VPC. The inspection VPC contains stateful third-party firewall instances in two Availability Zones, and the transit gateway uses a pre-inspection route table for the spoke VPC attachments and a post-inspection route table for the inspection VPC attachment. Traffic between instances in the same Availability Zone works. However, many connections between spoke VPCs in different Availability Zones are reset after the first packets. The firewall logs show the return packets of those flows arriving at a firewall that never saw the initial request.

    Which solution will resolve the issue?
  fr: |
    Une entreprise inspecte le trafic entre ses VPC en le routant par une passerelle de transit (transit gateway) vers un VPC d'inspection. Le VPC d'inspection contient des instances de pare-feu tierces avec état dans deux zones de disponibilité, et la passerelle de transit utilise une table de routage de pré-inspection pour les attachements des VPC rayons et une table de post-inspection pour l'attachement du VPC d'inspection. Le trafic entre instances d'une même zone de disponibilité fonctionne. En revanche, de nombreuses connexions entre VPC rayons situés dans des zones différentes sont réinitialisées après les premiers paquets. Les journaux des pare-feu montrent que les paquets de retour de ces flux arrivent sur un pare-feu qui n'a jamais vu la requête initiale.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text:
        en: "Enable appliance mode on the transit gateway attachment of the inspection VPC so that the transit gateway keeps both directions of each flow on the same firewall."
        fr: "Activer le mode appliance sur l'attachement de passerelle de transit du VPC d'inspection, pour que la passerelle maintienne les deux sens de chaque flux sur le même pare-feu."
    - id: b
      text:
        en: "Enable security group referencing support on the transit gateway and on all VPC attachments so that the firewalls can recognize the return traffic."
        fr: "Activer la prise en charge du référencement de groupes de sécurité sur la passerelle de transit et sur tous les attachements de VPC, pour que les pare-feu reconnaissent le trafic de retour."
    - id: c
      text:
        en: "Enable appliance mode on the transit gateway attachments of all spoke VPCs so that each spoke sends its traffic to a single firewall."
        fr: "Activer le mode appliance sur les attachements de passerelle de transit de tous les VPC rayons, pour que chaque rayon envoie son trafic vers un seul pare-feu."
    - id: d
      text:
        en: "Add a third Availability Zone to the inspection VPC attachment, and deploy an additional firewall instance in that zone to absorb the cross-zone flows."
        fr: "Ajouter une troisième zone de disponibilité à l'attachement du VPC d'inspection, et déployer une instance de pare-feu supplémentaire dans cette zone pour absorber les flux interzones."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Without appliance mode, the transit gateway keeps traffic in the Availability Zone where it entered, so the request and the response of a cross-zone flow reach firewalls in different zones. With appliance mode on the attachment of the VPC that contains the appliances, the transit gateway selects one network interface with a flow hash for the life of the flow and uses the same interface for the return traffic.
    fr: |-
      Sans mode appliance, la passerelle de transit garde le trafic dans la zone de disponibilité par laquelle il est entré : la requête et la réponse d'un flux interzones atteignent des pare-feu de zones différentes. Avec le mode appliance sur l'attachement du VPC qui contient les appliances, la passerelle choisit une interface réseau par hachage de flux pour toute la durée du flux et utilise la même interface pour le trafic de retour.
  options:
    b:
      en: |-
        Security group referencing simplifies security group rules across VPCs; it does not change how the transit gateway chooses an Availability Zone, and it does not work across inspection appliances.
      fr: |-
        Le référencement de groupes de sécurité simplifie les règles entre VPC ; il ne modifie pas la façon dont la passerelle de transit choisit une zone de disponibilité, et il ne fonctionne pas à travers des appliances d'inspection.
    c:
      en: |-
        Appliance mode is enabled on the attachment of the VPC in which the appliances are located; the spoke attachments do not decide which firewall interface receives a flow.
      fr: |-
        Le mode appliance s'active sur l'attachement du VPC où se trouvent les appliances ; les attachements des rayons ne déterminent pas quelle interface de pare-feu reçoit un flux.
    d:
      en: |-
        Another zone adds capacity, but the transit gateway would still send the two directions of a flow to different zones.
      fr: |-
        Une zone de plus ajoute de la capacité, mais la passerelle de transit enverrait toujours les deux sens d'un flux vers des zones différentes.
references:
  - title: How AWS Transit Gateway works - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-appliance-scenario.html
