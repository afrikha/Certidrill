id: sapc03-1c-pipes-mq-filter-transform
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company migrated its ERP message broker to Amazon MQ for RabbitMQ, and the ERP system publishes JSON order messages to a queue on the broker. The ERP system cannot be modified. New microservices in several AWS accounts consume events from a central Amazon EventBridge event bus. Only messages whose status field is CREATED must reach the bus, and each message must be reshaped into the new event schema before delivery. The integration team wants a serverless solution with the least custom code to write and maintain.

    Which solution will meet these requirements?
  fr: |
    Une enseigne de distribution a migré l'agent de messages (broker) de son ERP vers Amazon MQ for RabbitMQ, et l'ERP publie des messages de commande JSON dans une file d'attente de l'agent. L'ERP ne peut pas être modifié. De nouveaux microservices dans plusieurs comptes AWS consomment des événements d'un bus d'événements Amazon EventBridge central. Seuls les messages dont le champ status vaut CREATED doivent atteindre le bus, et chaque message doit être remodelé selon le nouveau schéma d'événement avant sa livraison. L'équipe d'intégration veut une solution sans serveur avec le moins de code personnalisé à écrire et à maintenir.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Lambda event source mapping for the queue, and have the function discard messages that are not CREATED, reshape the others and call PutEvents on the central bus."
        fr: "Créer un mappage de source d'événement AWS Lambda pour la file, et faire écarter par la fonction les messages qui ne sont pas CREATED, remodeler les autres et appeler PutEvents sur le bus central."
    - id: b
      text:
        en: "Create an Amazon EventBridge pipe with the broker queue as the source, a filter on the status field, an input transformer for the target and the central event bus as the target."
        fr: "Créer un canal (pipe) Amazon EventBridge avec la file de l'agent comme source, un filtre sur le champ status, un transformateur d'entrée pour la cible et le bus d'événements central comme cible."
    - id: c
      text:
        en: "Create an EventBridge rule on the default event bus that matches broker messages whose status is CREATED, with an input transformer and the central event bus as the target."
        fr: "Créer une règle EventBridge sur le bus d'événements par défaut qui correspond aux messages de l'agent dont le statut est CREATED, avec un transformateur d'entrée et le bus d'événements central comme cible."
    - id: d
      text:
        en: "Reconfigure the ERP system to publish orders to an Amazon SQS queue, and create an EventBridge pipe from the queue to the central event bus with a filter and an input transformer."
        fr: "Reconfigurer l'ERP pour qu'il publie les commandes dans une file d'attente Amazon SQS, et créer un canal EventBridge de cette file vers le bus d'événements central avec un filtre et un transformateur d'entrée."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      EventBridge Pipes supports an Amazon MQ broker as a source, filters events before they reach the target and applies an input transformer when passing data to the target. Because the messages are JSON, the filter can match fields in the decoded message body, and no function code is needed.
    fr: |-
      EventBridge Pipes prend en charge un agent Amazon MQ comme source, filtre les événements avant qu'ils n'atteignent la cible et applique un transformateur d'entrée lors du passage des données à la cible. Les messages étant au format JSON, le filtre peut porter sur des champs du corps décodé, et aucun code de fonction n'est nécessaire.
  options:
    a:
      en: |-
        The function works, but filtering and reshaping become custom code to write, test and maintain, which the qualifier rules out.
      fr: |-
        La fonction fonctionne, mais le filtrage et le remodelage deviennent du code personnalisé à écrire, tester et maintenir, ce que le critère exclut.
    c:
      en: |-
        Amazon MQ does not publish queue messages to the default event bus, so a rule there never sees the orders; a pipe or a consumer must read the queue.
      fr: |-
        Amazon MQ ne publie pas les messages de ses files sur le bus par défaut : une règle sur ce bus ne voit jamais les commandes ; un canal ou un consommateur doit lire la file.
    d:
      en: |-
        The ERP system cannot be modified, so it cannot be reconfigured to publish to a new SQS queue.
      fr: |-
        L'ERP ne peut pas être modifié : il ne peut donc pas être reconfiguré pour publier dans une nouvelle file SQS.
references:
  - title: Amazon EventBridge Pipes sources - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes-event-source.html
  - title: Amazon EventBridge Pipes input transformation
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes-input-transformation.html
