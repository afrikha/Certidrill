id: sapc03-1b-eks-fargate-ingress-group
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs 12 microservices on an Amazon EKS cluster, and all pods run on AWS Fargate profiles. Each microservice team manages its own Kubernetes Ingress resource and must publish its service under a different URL path of the same public hostname, such as /catalog and /orders. To limit cost, the company wants one internet-facing load balancer for all teams. HTTPS must terminate on the load balancer with a certificate from AWS Certificate Manager (ACM). The AWS Load Balancer Controller is installed, and the subnets carry the tags that the controller requires.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute 12 microservices sur un cluster Amazon EKS, et tous les pods s'exécutent sur des profils AWS Fargate. Chaque équipe gère sa propre ressource Kubernetes Ingress et doit publier son service sous un chemin d'URL différent du même nom d'hôte public, par exemple /catalog et /orders. Pour limiter les coûts, l'entreprise veut un seul équilibreur de charge accessible depuis Internet pour toutes les équipes. Le HTTPS doit être terminé sur l'équilibreur de charge avec un certificat d'AWS Certificate Manager (ACM). L'AWS Load Balancer Controller est installé, et les sous-réseaux portent les balises exigées par le contrôleur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Annotate every Ingress with the same alb.ingress.kubernetes.io/group.name value and the instance target type, so that the controller registers the Fargate nodes behind one Application Load Balancer with the ACM certificate."
        fr: "Annoter chaque Ingress avec la même valeur alb.ingress.kubernetes.io/group.name et le type de cible instance, afin que le contrôleur enregistre les nœuds Fargate derrière un seul Application Load Balancer avec le certificat ACM."
    - id: b
      text:
        en: "Expose every microservice as a Kubernetes Service of type LoadBalancer with the external load balancer type annotation, and create path-based DNS records that point to the resulting Network Load Balancers."
        fr: "Exposer chaque microservice comme un Service Kubernetes de type LoadBalancer avec l'annotation de type d'équilibreur de charge external, et créer des enregistrements DNS par chemin qui pointent vers les Network Load Balancers obtenus."
    - id: c
      text:
        en: "Annotate every Ingress with the same alb.ingress.kubernetes.io/group.name value and with alb.ingress.kubernetes.io/target-type: ip, and attach the ACM certificate to the shared HTTPS listener of the Application Load Balancer."
        fr: "Annoter chaque Ingress avec la même valeur alb.ingress.kubernetes.io/group.name et avec alb.ingress.kubernetes.io/target-type: ip, et associer le certificat ACM à l'écouteur HTTPS partagé de l'Application Load Balancer."
    - id: d
      text:
        en: "Create Services of type LoadBalancer without annotations so that the AWS cloud provider load balancer controller creates Classic Load Balancers, and place an Amazon CloudFront distribution with one cache behavior per path in front of them."
        fr: "Créer des Services de type LoadBalancer sans annotation afin que l'AWS cloud provider load balancer controller crée des Classic Load Balancers, et placer devant eux une distribution Amazon CloudFront avec un comportement de cache par chemin."
answer: { optionId: c }
explanation:
  correct:
    en: "Ingresses that share an alb.ingress.kubernetes.io/group.name value are merged by the AWS Load Balancer Controller into one Application Load Balancer, whose listener rules route each path to its service. Pods on Fargate can only be registered with the ip target type, so the ALB sends traffic directly to the pod IP addresses. The ACM certificate on the shared HTTPS listener terminates TLS for all paths."
    fr: "Les Ingress qui partagent une valeur alb.ingress.kubernetes.io/group.name sont fusionnés par l'AWS Load Balancer Controller en un seul Application Load Balancer, dont les règles d'écouteur acheminent chaque chemin vers son service. Les pods sur Fargate ne peuvent être enregistrés qu'avec le type de cible ip : l'ALB envoie donc le trafic directement aux adresses IP des pods. Le certificat ACM de l'écouteur HTTPS partagé termine le TLS pour tous les chemins."
  options:
    a:
      en: "The instance target type routes traffic to a NodePort on EC2 nodes. Fargate pods have no such nodes, and EKS requires the ip target type for pods on Fargate."
      fr: "Le type de cible instance achemine le trafic vers un NodePort sur des nœuds EC2. Les pods Fargate n'ont pas de tels nœuds, et EKS exige le type de cible ip pour les pods sur Fargate."
    b:
      en: "This creates 12 Network Load Balancers, which fails the single load balancer requirement. DNS cannot route by URL path, and an NLB does not offer path-based rules."
      fr: "Cette solution crée 12 Network Load Balancers, ce qui ne respecte pas l'exigence d'un seul équilibreur de charge. Le DNS ne peut pas router selon le chemin d'URL, et un NLB n'offre pas de règles par chemin."
    d:
      en: "The legacy controller creates one Classic Load Balancer per Service with instance targets, which cannot reach Fargate pods, and it multiplies load balancers and cost."
      fr: "L'ancien contrôleur crée un Classic Load Balancer par Service avec des cibles de type instance, qui ne peuvent pas atteindre les pods Fargate, et il multiplie les équilibreurs de charge et les coûts."
references:
  - title: Route application and HTTP traffic with Application Load Balancers
    url: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
  - title: Route TCP and UDP traffic with Network Load Balancers
    url: https://docs.aws.amazon.com/eks/latest/userguide/network-load-balancing.html
