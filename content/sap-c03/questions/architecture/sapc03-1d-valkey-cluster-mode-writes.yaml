id: sapc03-1d-valkey-cluster-mode-writes
objective: "1.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A social media company uses an Amazon ElastiCache for Valkey cluster with cluster mode disabled for a real-time counter service. The cluster has one primary node and five read replicas, all of the largest node type that the company has approved. Monitoring shows that write commands saturate the primary node, while the replicas have spare capacity. The data set is expected to triple during the next year. The company needs to scale both write throughput and memory capacity.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de réseaux sociaux utilise un cluster Amazon ElastiCache for Valkey avec le mode cluster désactivé pour un service de compteurs en temps réel. Le cluster comporte un nœud principal et cinq réplicas en lecture, tous du plus grand type de nœud que l'entreprise a approuvé. La surveillance montre que les commandes d'écriture saturent le nœud principal, alors que les réplicas ont de la capacité disponible. Le jeu de données devrait tripler au cours de l'année prochaine. L'entreprise doit mettre à l'échelle à la fois le débit d'écriture et la capacité mémoire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add more read replicas to the cluster, and configure the clients to send part of the write commands to the replicas through the reader endpoint."
        fr: "Ajouter des réplicas en lecture au cluster, et configurer les clients pour qu'ils envoient une partie des commandes d'écriture aux réplicas via le point de terminaison de lecteur."
    - id: b
      text:
        en: "Move to a Valkey cluster with cluster mode enabled and several shards, and connect the clients to the cluster's configuration endpoint."
        fr: "Passer à un cluster Valkey avec le mode cluster activé et plusieurs partitions (shards), et connecter les clients au point de terminaison de configuration du cluster."
    - id: c
      text:
        en: "Enable Multi-AZ with automatic failover so that the write commands are spread between the primary node and a standby node."
        fr: "Activer Multi-AZ avec le basculement automatique afin que les commandes d'écriture soient réparties entre le nœud principal et un nœud de secours."
    - id: d
      text:
        en: "Put a DynamoDB Accelerator (DAX) cluster in front of the ElastiCache cluster so that it absorbs the write commands of the service."
        fr: "Placer un cluster DynamoDB Accelerator (DAX) devant le cluster ElastiCache afin qu'il absorbe les commandes d'écriture du service."
answer: { optionId: b }
explanation:
  correct:
    en: |
      With cluster mode disabled, a cluster always has one shard, so all writes go to one primary node, and its memory limits the data set. Cluster mode enabled partitions the data across up to 500 shards, each with its own primary, which adds write endpoints and spreads both the load and the data over more nodes.
    fr: |
      Avec le mode cluster désactivé, un cluster a toujours une seule partition : toutes les écritures vont vers un seul nœud principal, dont la mémoire limite le jeu de données. Le mode cluster activé répartit les données sur jusqu'à 500 partitions, chacune avec son propre nœud principal, ce qui ajoute des points d'écriture et répartit à la fois la charge et les données sur davantage de nœuds.
  options:
    a:
      en: |
        Replicas serve only reads, and a cluster with cluster mode disabled is limited to five replicas, which it already has.
      fr: |
        Les réplicas ne servent que des lectures, et un cluster avec le mode cluster désactivé est limité à cinq réplicas, qu'il possède déjà.
    c:
      en: |
        Multi-AZ promotes a replica when the primary fails; it does not split writes between nodes or add memory.
      fr: |
        Multi-AZ promeut un réplica quand le nœud principal tombe en panne ; il ne répartit pas les écritures entre les nœuds et n'ajoute pas de mémoire.
    d:
      en: |
        DAX is a cache for DynamoDB tables only; it cannot be placed in front of an ElastiCache cluster.
      fr: |
        DAX est un cache réservé aux tables DynamoDB ; il ne peut pas être placé devant un cluster ElastiCache.
references:
  - title: "Replication: Valkey and Redis OSS Cluster Mode Disabled vs. Enabled"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Replication.Redis-RedisCluster.html
