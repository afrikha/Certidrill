id: sapc03-1d-mrap-multi-region
objective: "1.5.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company stores user-uploaded project files in Amazon S3 and serves users from application stacks in us-east-1, eu-west-1 and ap-southeast-1. Users in every Region upload and download files, and each S3 request should go to the closest Region over the AWS global network. The application code must use a single S3 endpoint name in all Regions. Objects written in any Region must become available in the other Regions. During a Regional disruption, operators must be able to shift S3 traffic away from the affected Region within minutes.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un éditeur de logiciels stocke dans Amazon S3 des fichiers de projet chargés par les utilisateurs et sert ses utilisateurs depuis des piles applicatives dans us-east-1, eu-west-1 et ap-southeast-1. Dans chaque Région, les utilisateurs chargent et téléchargent des fichiers, et chaque requête S3 doit aller vers la Région la plus proche via le réseau mondial d'AWS. Le code de l'application doit utiliser un seul nom de point de terminaison S3 dans toutes les Régions. Les objets écrits dans n'importe quelle Région doivent devenir disponibles dans les autres Régions. En cas de perturbation régionale, les opérateurs doivent pouvoir détourner le trafic S3 de la Région concernée en quelques minutes.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an Amazon CloudFront distribution with an origin group that contains the three buckets, and send uploads and downloads to the distribution."
        fr: "Créer une distribution Amazon CloudFront avec un groupe d'origines qui contient les trois compartiments, et envoyer les chargements et les téléchargements à la distribution."
    - id: b
      text:
        en: "Enable S3 Transfer Acceleration on one bucket in us-east-1, and use its accelerate endpoint from the application stacks in all three Regions."
        fr: "Activer S3 Transfer Acceleration sur un seul compartiment dans us-east-1, et utiliser son point de terminaison accéléré depuis les piles applicatives des trois Régions."
    - id: c
      text:
        en: "Create an S3 Multi-Region Access Point over one bucket in each Region, and configure the applications to use its global endpoint."
        fr: "Créer un point d'accès multi-Région S3 sur un compartiment dans chaque Région, et configurer les applications pour qu'elles utilisent son point de terminaison global."
    - id: d
      text:
        en: "Create Amazon Route 53 latency-based records that point to the Regional endpoints of the three buckets under one custom domain name."
        fr: "Créer des enregistrements Amazon Route 53 basés sur la latence qui pointent vers les points de terminaison régionaux des trois compartiments sous un seul nom de domaine personnalisé."
    - id: e
      text:
        en: "Configure S3 Cross-Region Replication rules among the three buckets in both directions so that each bucket replicates new objects to the others."
        fr: "Configurer des règles de réplication entre Régions S3 (CRR) entre les trois compartiments dans les deux sens afin que chaque compartiment réplique les nouveaux objets vers les autres."
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      A Multi-Region Access Point gives one global endpoint and routes reads and writes over the AWS global network, through AWS Global Accelerator, to the closest bucket with an active routing status. Its failover controls shift traffic away from a Region within minutes. The access point does not copy data itself, so Cross-Region Replication rules among the buckets keep the data set synchronized.
    fr: |
      Un point d'accès multi-Région offre un point de terminaison global et achemine les lectures et les écritures via le réseau mondial d'AWS, au moyen d'AWS Global Accelerator, vers le compartiment le plus proche dont l'état de routage est actif. Ses contrôles de basculement détournent le trafic d'une Région en quelques minutes. Le point d'accès ne copie pas lui-même les données : des règles de réplication entre Régions entre les compartiments maintiennent le jeu de données synchronisé.
  options:
    a:
      en: |
        CloudFront origin failover applies only to GET, HEAD and OPTIONS requests, so it does not route uploads to the closest bucket or replicate them.
      fr: |
        Le basculement d'origine de CloudFront ne s'applique qu'aux requêtes GET, HEAD et OPTIONS : il n'achemine pas les chargements vers le compartiment le plus proche et ne les réplique pas.
    b:
      en: |
        Transfer Acceleration speeds up transfers to a single bucket, so every request still goes to us-east-1 and there is no Regional failover.
      fr: |
        Transfer Acceleration accélère les transferts vers un seul compartiment : chaque requête va toujours vers us-east-1 et il n'y a aucun basculement régional.
    d:
      en: |
        S3 Regional endpoints expect requests addressed to their own bucket name, so one custom domain cannot front three buckets this way, and DNS records copy no data.
      fr: |
        Les points de terminaison régionaux S3 attendent des requêtes adressées à leur propre nom de compartiment : un seul domaine personnalisé ne peut pas desservir ainsi trois compartiments, et des enregistrements DNS ne copient aucune donnée.
references:
  - title: Managing multi-Region traffic with Multi-Region Access Points
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiRegionAccessPoints.html
