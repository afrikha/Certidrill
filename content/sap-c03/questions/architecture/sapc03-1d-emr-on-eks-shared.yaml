id: sapc03-1d-emr-on-eks-shared
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's platform team operates shared Amazon EKS clusters in production and centrally manages their capacity, namespaces, resource quotas and IAM roles for service accounts. Four data engineering teams run nightly and hourly Apache Spark batch jobs on four long-running Amazon EMR on EC2 clusters whose average utilization is about 25%. Each data engineering team needs a different Amazon EMR release for its jobs. The company wants the Spark jobs to run on the existing shared EKS capacity under the platform team's governance. The jobs must keep the Amazon EMR optimized Spark runtime.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    L'équipe plateforme d'une entreprise exploite des clusters Amazon EKS partagés en production et gère de manière centralisée leur capacité, leurs espaces de noms, leurs quotas de ressources et les rôles IAM des comptes de service. Quatre équipes d'ingénierie des données exécutent des tâches par lots Apache Spark nocturnes et horaires sur quatre clusters Amazon EMR on EC2 permanents dont l'utilisation moyenne est d'environ 25 %. Chaque équipe d'ingénierie des données a besoin d'une version Amazon EMR différente pour ses tâches. L'entreprise veut que les tâches Spark s'exécutent sur la capacité EKS partagée existante, sous la gouvernance de l'équipe plateforme. Les tâches doivent conserver le runtime Spark optimisé d'Amazon EMR.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Register each data engineering team's namespace as an Amazon EMR on EKS virtual cluster, and set each team's release label in its StartJobRun job runs."
        fr: "Enregistrer l'espace de noms de chaque équipe d'ingénierie des données comme cluster virtuel Amazon EMR on EKS, et indiquer l'étiquette de version de chaque équipe dans ses exécutions StartJobRun."
    - id: b
      text:
        en: "Create an Amazon EMR Serverless application for each data engineering team with the release it needs, and submit the team's jobs to its application."
        fr: "Créer une application Amazon EMR Serverless par équipe d'ingénierie des données avec la version dont elle a besoin, et soumettre les tâches de l'équipe à son application."
    - id: c
      text:
        en: "Install the open-source Kubernetes operator for Apache Spark on the EKS clusters, and build and patch a Spark container image for each data engineering team."
        fr: "Installer l'opérateur Kubernetes open source pour Apache Spark sur les clusters EKS, et construire et corriger une image de conteneur Spark pour chaque équipe d'ingénierie des données."
    - id: d
      text:
        en: "Merge the four EMR on EC2 clusters into one cluster with managed scaling, and give each data engineering team its own YARN queue on that cluster."
        fr: "Fusionner les quatre clusters EMR on EC2 en un seul cluster avec la mise à l'échelle gérée, et donner à chaque équipe d'ingénierie des données sa propre file YARN sur ce cluster."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon EMR on EKS runs EMR-managed Spark containers on an existing EKS cluster, alongside other applications and on the same pool of capacity. Each virtual cluster maps to one Kubernetes namespace, so the platform team keeps its quotas and roles, and the release label is chosen per job run, so each team uses its own EMR release on shared infrastructure.
    fr: |
      Amazon EMR on EKS exécute des conteneurs Spark gérés par EMR sur un cluster EKS existant, à côté d'autres applications et sur le même pool de capacité. Chaque cluster virtuel correspond à un espace de noms Kubernetes : l'équipe plateforme conserve ses quotas et ses rôles, et l'étiquette de version est choisie pour chaque exécution de tâche, de sorte que chaque équipe utilise sa propre version d'EMR sur une infrastructure partagée.
  options:
    b:
      en: |
        EMR Serverless runs the jobs on capacity that it manages itself, not on the shared EKS clusters, so the platform team's governance would not apply.
      fr: |
        EMR Serverless exécute les tâches sur une capacité qu'il gère lui-même, et non sur les clusters EKS partagés : la gouvernance de l'équipe plateforme ne s'appliquerait pas.
    c:
      en: |
        Open-source Spark images lose the EMR optimized runtime, and the teams would build, patch and upgrade their own images and operator.
      fr: |
        Les images Spark open source perdent le runtime optimisé d'EMR, et les équipes devraient construire, corriger et mettre à niveau leurs propres images et l'opérateur.
    d:
      en: |
        A single EMR on EC2 cluster runs one EMR release, so the teams cannot each use a different release, and the jobs still do not run on EKS.
      fr: |
        Un seul cluster EMR on EC2 exécute une seule version d'EMR : les équipes ne peuvent pas utiliser chacune une version différente, et les tâches ne s'exécutent toujours pas sur EKS.
