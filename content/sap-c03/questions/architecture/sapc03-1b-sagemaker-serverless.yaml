id: sapc03-1b-sagemaker-serverless
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legal services firm has a scikit-learn model of about 2 GB that classifies short contract clauses. An internal web tool calls the model through a Lambda function, which waits for the prediction and returns it to the user. The tool receives a few hundred requests on some days, none on others, and traffic is impossible to predict. Users accept a few extra seconds of latency on the first request after an idle period. The model runs on CPU, needs no VPC access and has small request payloads. The firm wants the lowest cost and no instances or scaling policies to manage.

    Which solution will meet these requirements?
  fr: |
    Un cabinet de services juridiques dispose d'un modèle scikit-learn d'environ 2 Go qui classe de courtes clauses de contrat. Un outil web interne appelle le modèle via une fonction Lambda, qui attend la prédiction et la renvoie à l'utilisateur. L'outil reçoit quelques centaines de requêtes certains jours, aucune d'autres jours, et le trafic est impossible à prévoir. Les utilisateurs acceptent quelques secondes de latence supplémentaires sur la première requête après une période d'inactivité. Le modèle s'exécute sur processeur, n'a besoin d'aucun accès VPC et reçoit de petites charges utiles. Le cabinet veut le coût le plus bas et aucune instance ni politique de mise à l'échelle à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy the model to a SageMaker AI serverless endpoint with a memory size of at least 4 GB and a maximum concurrency suited to the peak, and have the Lambda function call InvokeEndpoint."
        fr: "Déployer le modèle sur un point de terminaison serverless SageMaker AI avec une taille de mémoire d'au moins 4 Go et une simultanéité maximale adaptée au pic, et faire appeler InvokeEndpoint par la fonction Lambda."
    - id: b
      text:
        en: "Deploy the model to a SageMaker AI real-time endpoint on one ml.m5.large instance, and add a scheduled scaling action that keeps the instance count at one during business hours."
        fr: "Déployer le modèle sur un point de terminaison en temps réel SageMaker AI sur une instance ml.m5.large, et ajouter une action de mise à l'échelle planifiée qui garde une instance pendant les heures de bureau."
    - id: c
      text:
        en: "Deploy the model to a SageMaker AI asynchronous endpoint with auto scaling to zero instances, and have the Lambda function poll Amazon S3 until the prediction appears."
        fr: "Déployer le modèle sur un point de terminaison asynchrone SageMaker AI avec une mise à l'échelle automatique jusqu'à zéro instance, et faire interroger Amazon S3 par la fonction Lambda jusqu'à l'apparition de la prédiction."
    - id: d
      text:
        en: "Run a SageMaker AI batch transform job for each request, with the clause written to Amazon S3 as input, and have the Lambda function read the output file when the job completes."
        fr: "Exécuter une tâche de transformation par lots SageMaker AI pour chaque requête, avec la clause écrite dans Amazon S3 comme entrée, et faire lire le fichier de sortie par la fonction Lambda à la fin de la tâche."
answer: { optionId: a }
explanation:
  correct:
    en: "Serverless Inference suits intermittent or unpredictable traffic: SageMaker AI manages the infrastructure and scaling, and the firm pays only for what it uses, not for idle time. Memory sizes go from 1 GB to 6 GB, which fits a 2 GB CPU model, and users accept the cold start after idle periods. The endpoint returns the prediction synchronously to the Lambda function."
    fr: "Serverless Inference convient à un trafic intermittent ou imprévisible : SageMaker AI gère l'infrastructure et la mise à l'échelle, et le cabinet ne paie que ce qu'il utilise, pas le temps d'inactivité. Les tailles de mémoire vont de 1 Go à 6 Go, ce qui convient à un modèle de 2 Go sur processeur, et les utilisateurs acceptent le démarrage à froid après une inactivité. Le point de terminaison renvoie la prédiction de manière synchrone à la fonction Lambda."
  options:
    b:
      en: "A real-time endpoint bills for its instance whether or not requests arrive, and the firm would manage instances and scaling actions."
      fr: "Un point de terminaison en temps réel facture son instance que des requêtes arrivent ou non, et le cabinet gérerait les instances et les actions de mise à l'échelle."
    c:
      en: "Asynchronous inference needs scaling policies to reach zero, scaling out from zero takes minutes, and polling S3 replaces the synchronous response with a slower flow."
      fr: "L'inférence asynchrone a besoin de politiques de mise à l'échelle pour descendre à zéro, la remontée depuis zéro prend des minutes, et l'interrogation de S3 remplace la réponse synchrone par un flux plus lent."
    d:
      en: "Batch transform is designed for offline datasets; starting a job for each request adds minutes of provisioning before every prediction."
      fr: "La transformation par lots est conçue pour des jeux de données hors ligne : lancer une tâche par requête ajoute des minutes de provisionnement avant chaque prédiction."
references:
  - title: Deploy models with Amazon SageMaker Serverless Inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html
  - title: Inference options in Amazon SageMaker AI
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deploy-model-options.html
