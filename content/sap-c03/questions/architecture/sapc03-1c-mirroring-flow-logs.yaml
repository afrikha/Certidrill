id: sapc03-1c-mirroring-flow-logs
objective: "1.4.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A security team must meet two new requirements for a VPC that hosts a payment application. First, an intrusion detection system must analyze complete packets, including payloads, for the traffic of 12 specific instances. Second, metadata about all accepted and rejected IP traffic in the VPC must be retained for 1 year at low cost for investigations. The team wants managed AWS features where possible.

    Which combination of solutions will meet these requirements? (Choose two.)
  fr: |
    Une équipe de sécurité doit satisfaire deux nouvelles exigences pour un VPC qui héberge une application de paiement. D'abord, un système de détection des intrusions doit analyser les paquets complets, charges utiles comprises, du trafic de 12 instances précises. Ensuite, les métadonnées de tout le trafic IP accepté et rejeté du VPC doivent être conservées 1 an à faible coût pour les enquêtes. L'équipe veut utiliser des fonctionnalités AWS gérées autant que possible.

    Quelle combinaison de solutions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create VPC Traffic Mirroring sessions from the 12 instances' network interfaces to a Network Load Balancer in front of the detection appliances."
        fr: "Créer des sessions VPC Traffic Mirroring depuis les interfaces réseau des 12 instances vers un Network Load Balancer placé devant les appliances de détection."
    - id: b
      text:
        en: "Enable VPC Flow Logs on the 12 instances' network interfaces, and send the records to the detection system so that it can reassemble the payloads."
        fr: "Activer VPC Flow Logs sur les interfaces réseau des 12 instances, et envoyer les enregistrements au système de détection pour qu'il reconstitue les charges utiles."
    - id: c
      text:
        en: "Enable VPC Flow Logs for the whole VPC with all traffic types, publish them to Amazon S3, and expire them with a 1-year lifecycle rule."
        fr: "Activer VPC Flow Logs pour tout le VPC avec tous les types de trafic, les publier dans Amazon S3, et les faire expirer avec une règle de cycle de vie de 1 an."
    - id: d
      text:
        en: "Enable AWS CloudTrail data events for the VPC, and store the events in an Amazon S3 bucket with a 1-year lifecycle rule."
        fr: "Activer les événements de données AWS CloudTrail pour le VPC, et stocker les événements dans un compartiment Amazon S3 avec une règle de cycle de vie de 1 an."
    - id: e
      text:
        en: "Deploy AWS Network Firewall with alert logging, and use the alert logs as the full packet source for the detection system."
        fr: "Déployer AWS Network Firewall avec la journalisation des alertes, et utiliser les journaux d'alertes comme source de paquets complets pour le système de détection."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Traffic Mirroring copies the network traffic of chosen network interfaces to security and monitoring appliances, for example a fleet behind a Network Load Balancer, for content inspection. Flow logs record IP traffic metadata, accepted and rejected, for the whole VPC, and storing them in Amazon S3 with a lifecycle rule keeps them for 1 year at low cost.
    fr: |-
      Traffic Mirroring copie le trafic réseau des interfaces choisies vers des appliances de sécurité et de surveillance, par exemple une flotte derrière un Network Load Balancer, pour l'inspection du contenu. Les journaux de flux enregistrent les métadonnées du trafic IP, accepté et rejeté, pour tout le VPC, et les stocker dans Amazon S3 avec une règle de cycle de vie les conserve 1 an à faible coût.
  options:
    b:
      en: |-
        Flow logs record metadata such as addresses, ports and actions; they never contain packet payloads.
      fr: |-
        Les journaux de flux enregistrent des métadonnées comme les adresses, les ports et les actions ; ils ne contiennent jamais de charges utiles de paquets.
    d:
      en: |-
        CloudTrail records API activity, not network traffic.
      fr: |-
        CloudTrail enregistre l'activité des API, pas le trafic réseau.
    e:
      en: |-
        Network Firewall alert logs describe rule matches; they are not complete packet copies of the instances' traffic.
      fr: |-
        Les journaux d'alertes de Network Firewall décrivent des correspondances de règles ; ce ne sont pas des copies complètes des paquets des instances.
references:
  - title: What is Traffic Mirroring? - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/mirroring/what-is-traffic-mirroring.html
