id: sapc03-1a-ecr-lifecycle-archive
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores production images in an Amazon ECR repository. The platform team must configure a lifecycle policy with three goals. Untagged images must be deleted 1 day after they are pushed. The 50 most recent images with a tag that starts with prod must stay in standard storage, and older prod images must be kept for audits in the archive storage class rather than deleted. Archived images must be deleted 365 days after they were archived.

    Which lifecycle policy will meet these requirements?
  fr: |
    Une entreprise stocke ses images de production dans un référentiel Amazon ECR. L'équipe plateforme doit configurer une politique de cycle de vie avec trois objectifs. Les images sans balise doivent être supprimées 1 jour après leur envoi. Les 50 images les plus récentes dont une balise commence par prod doivent rester dans le stockage standard, et les images prod plus anciennes doivent être conservées pour les audits dans la classe de stockage archive plutôt que supprimées. Les images archivées doivent être supprimées 365 jours après leur archivage.

    Quelle politique de cycle de vie permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Rule priority 1: untagged, sinceImagePushed 1 day, expire. Rule priority 2: tagged with tagPatternList prod*, imageCountMoreThan 50, expire. Rule priority 3: any, sinceImagePushed 365 days, expire.
        fr: |-
          Règle de priorité 1 : untagged, sinceImagePushed 1 jour, expire. Règle de priorité 2 : tagged avec tagPatternList prod*, imageCountMoreThan 50, expire. Règle de priorité 3 : any, sinceImagePushed 365 jours, expire.
    - id: b
      text:
        en: |-
          Rule priority 1: any, storageClass archive, sinceImageTransitioned 365 days, expire. Rule priority 2: untagged, sinceImagePushed 1 day, expire. Rule priority 3: tagged with tagPatternList prod*, imageCountMoreThan 50, transition to archive.
        fr: |-
          Règle de priorité 1 : any, storageClass archive, sinceImageTransitioned 365 jours, expire. Règle de priorité 2 : untagged, sinceImagePushed 1 jour, expire. Règle de priorité 3 : tagged avec tagPatternList prod*, imageCountMoreThan 50, transition vers archive.
    - id: c
      text:
        en: |-
          Rule priority 1: untagged, sinceImagePushed 1 day, expire. Rule priority 2: tagged with tagPatternList prod*, imageCountMoreThan 50, transition to archive. Rule priority 3: any, sinceImagePushed 365 days, expire.
        fr: |-
          Règle de priorité 1 : untagged, sinceImagePushed 1 jour, expire. Règle de priorité 2 : tagged avec tagPatternList prod*, imageCountMoreThan 50, transition vers archive. Règle de priorité 3 : any, sinceImagePushed 365 jours, expire.
    - id: d
      text:
        en: |-
          Rule priority 1: untagged, sinceImagePushed 1 day, expire. Rule priority 2: tagged with tagPatternList prod*, imageCountMoreThan 50, transition to archive. Rule priority 3: any, storageClass archive, sinceImageTransitioned 365 days, expire.
        fr: |-
          Règle de priorité 1 : untagged, sinceImagePushed 1 jour, expire. Règle de priorité 2 : tagged avec tagPatternList prod*, imageCountMoreThan 50, transition vers archive. Règle de priorité 3 : any, storageClass archive, sinceImageTransitioned 365 jours, expire.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A transition action with the archive target storage class moves the images beyond the newest 50 prod images to archive instead of deleting them. Deleting archived images after a period in archive uses the sinceImageTransitioned count type, which requires storageClass archive, and a rule with tagStatus any must have the highest rulePriority value so that it is evaluated last.
    fr: |-
      Une action transition avec la classe de stockage cible archive déplace vers l'archive les images au-delà des 50 images prod les plus récentes au lieu de les supprimer. Supprimer les images archivées après une période en archive utilise le type de décompte sinceImageTransitioned, qui exige storageClass archive, et une règle avec tagStatus any doit avoir la valeur rulePriority la plus élevée pour être évaluée en dernier.
  options:
    a:
      en: |-
        Rule 2 expires the older prod images, so they are deleted instead of being archived for the audits.
      fr: |-
        La règle 2 fait expirer les anciennes images prod : elles sont supprimées au lieu d'être archivées pour les audits.
    b:
      en: |-
        A rule with tagStatus any must have the highest rulePriority value and be evaluated last, so a policy that gives it priority 1 is not valid.
      fr: |-
        Une règle avec tagStatus any doit avoir la valeur rulePriority la plus élevée et être évaluée en dernier : une politique qui lui donne la priorité 1 n'est pas valide.
    c:
      en: |-
        Rule 3 counts days since the image was pushed and applies to standard storage, so it deletes images by push age, including old images among the 50 that must stay, instead of 365 days after archival.
      fr: |-
        La règle 3 compte les jours depuis l'envoi de l'image et s'applique au stockage standard : elle supprime les images selon leur âge d'envoi, y compris d'anciennes images parmi les 50 à conserver, au lieu de 365 jours après l'archivage.
references:
  - title: Lifecycle policy properties in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/lifecycle_policy_parameters.html
  - title: Automate the cleanup of images by using lifecycle policies in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/LifecyclePolicies.html
