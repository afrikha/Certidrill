id: sapc03-1c-r53-latency-weighted-tree
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company serves app.example.com from us-east-1 and eu-west-1. In each Region, two Application Load Balancers front two independent copies of the application, and traffic is split evenly between them. Users must be sent to the Region that gives them the lowest latency. If both load balancers in a Region are unhealthy, users must be sent to the other Region. If only one load balancer in a Region is unhealthy, its share of traffic must go to the healthy load balancer in the same Region.

    Which Route 53 configuration will meet these requirements?
  fr: |
    Une entreprise sert app.example.com depuis us-east-1 et eu-west-1. Dans chaque Région, deux Application Load Balancers sont placés devant deux copies indépendantes de l'application, et le trafic est réparti à parts égales entre eux. Les utilisateurs doivent être envoyés vers la Région qui leur offre la latence la plus faible. Si les deux équilibreurs d'une Région sont défaillants, les utilisateurs doivent être envoyés vers l'autre Région. Si un seul équilibreur d'une Région est défaillant, sa part de trafic doit aller à l'équilibreur sain de la même Région.

    Quelle configuration Route 53 répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a failover record pair for app.example.com, with the us-east-1 load balancers behind the primary record and the eu-west-1 load balancers behind the secondary record."
        fr: "Créer une paire d'enregistrements de basculement pour app.example.com, avec les équilibreurs de us-east-1 derrière l'enregistrement principal et ceux de eu-west-1 derrière l'enregistrement secondaire."
    - id: b
      text:
        en: "Create weighted alias records for the two load balancers under a per-Region name such as use1.app.example.com, and latency alias records for app.example.com that point to those names with Evaluate Target Health set to Yes."
        fr: "Créer des enregistrements d'alias pondérés pour les deux équilibreurs sous un nom par Région comme use1.app.example.com, et des enregistrements d'alias de latence pour app.example.com qui pointent vers ces noms avec Evaluate Target Health défini sur Yes."
    - id: c
      text:
        en: "Create weighted alias records for the two load balancers under a per-Region name such as use1.app.example.com, and latency alias records for app.example.com that point to those names with Evaluate Target Health set to No."
        fr: "Créer des enregistrements d'alias pondérés pour les deux équilibreurs sous un nom par Région comme use1.app.example.com, et des enregistrements d'alias de latence pour app.example.com qui pointent vers ces noms avec Evaluate Target Health défini sur No."
    - id: d
      text:
        en: "Create geolocation records for app.example.com that send North American users to us-east-1 and European users to eu-west-1, with a default record that points to us-east-1."
        fr: "Créer des enregistrements de géolocalisation pour app.example.com qui envoient les utilisateurs nord-américains vers us-east-1 et les utilisateurs européens vers eu-west-1, avec un enregistrement par défaut qui pointe vers us-east-1."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Route 53 builds a decision tree from alias records: weighted records spread traffic across the two load balancers of a Region and skip an unhealthy one, and latency alias records choose the Region. With Evaluate Target Health set to Yes on the latency alias records, Route 53 backs out of a Region when no healthy record remains below it and chooses the Region with the next-best latency.
    fr: |-
      Route 53 construit un arbre de décision à partir d'enregistrements d'alias : les enregistrements pondérés répartissent le trafic entre les deux équilibreurs d'une Région et ignorent celui qui est défaillant, et les enregistrements d'alias de latence choisissent la Région. Avec Evaluate Target Health défini sur Yes sur les alias de latence, Route 53 quitte une Région lorsqu'il ne reste plus d'enregistrement sain en dessous et choisit la Région qui offre la meilleure latence suivante.
  options:
    a:
      en: |-
        Failover routing sends every user to us-east-1 while it is healthy, so European users do not get the lowest latency.
      fr: |-
        Le routage de basculement envoie tous les utilisateurs vers us-east-1 tant que cette Région est saine : les utilisateurs européens n'obtiennent pas la latence la plus faible.
    c:
      en: |-
        With Evaluate Target Health set to No, Route 53 keeps choosing a record in the same Region even when its health checks fail, so it never fails over to the other Region.
      fr: |-
        Avec Evaluate Target Health défini sur No, Route 53 continue de choisir un enregistrement dans la même Région même si ses vérifications de l'état échouent : il ne bascule jamais vers l'autre Région.
    d:
      en: |-
        Geolocation routes by the user's location rather than measured latency, and these records do not fail over between Regions when both load balancers are unhealthy.
      fr: |-
        La géolocalisation route selon l'emplacement de l'utilisateur et non selon la latence mesurée, et ces enregistrements ne basculent pas entre Régions lorsque les deux équilibreurs sont défaillants.
references:
  - title: How health checks work in complex Amazon Route 53 configurations - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-complex-configs.html
