id: sapc03-1c-transfer-custom-idp-ldap
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs an on-premises SFTP server that 300 external carriers use to upload delivery reports. Carriers authenticate with user names and passwords that are stored in the company's existing LDAP directory, which is reachable from AWS over an AWS Site-to-Site VPN connection. The company wants to retire the server and store the uploaded files in Amazon S3. Carriers must keep their existing credentials and the sftp.example.com host name. The company does not want to manage servers or duplicate the user directory.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exploite sur site un serveur SFTP que 300 transporteurs externes utilisent pour charger leurs rapports de livraison. Les transporteurs s'authentifient avec des noms d'utilisateur et des mots de passe stockés dans l'annuaire LDAP existant de l'entreprise, joignable depuis AWS par une connexion AWS Site-to-Site VPN. L'entreprise veut retirer le serveur et stocker les fichiers chargés dans Amazon S3. Les transporteurs doivent conserver leurs informations d'identification et le nom d'hôte sftp.example.com. L'entreprise ne veut ni gérer de serveurs ni dupliquer l'annuaire des utilisateurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy an Amazon S3 File Gateway on Amazon EC2, create an SMB file share on the bucket, and give the carriers the gateway's address to use with their LDAP credentials."
        fr: "Déployer une Amazon S3 File Gateway sur Amazon EC2, créer un partage de fichiers SMB sur le compartiment, et donner aux transporteurs l'adresse de la passerelle à utiliser avec leurs identifiants LDAP."
    - id: b
      text:
        en: "Create AWS Transfer Family service-managed users for all 300 carriers, import their passwords from the directory, and point sftp.example.com to the server endpoint."
        fr: "Créer des utilisateurs AWS Transfer Family gérés par le service pour les 300 transporteurs, importer leurs mots de passe depuis l'annuaire, et faire pointer sftp.example.com vers le point de terminaison du serveur."
    - id: c
      text:
        en: "Create an AWS Transfer Family SFTP server with Amazon S3 storage and a Lambda custom identity provider that validates logins against LDAP, and point sftp.example.com to it."
        fr: "Créer un serveur SFTP AWS Transfer Family avec stockage Amazon S3 et un fournisseur d'identité personnalisé Lambda qui valide les connexions auprès du LDAP, et faire pointer sftp.example.com vers ce serveur."
    - id: d
      text:
        en: "Run OpenSSH on Amazon EC2 instances in an Auto Scaling group, authenticate carriers with an LDAP PAM module, and mount the bucket on the instances with Mountpoint for Amazon S3."
        fr: "Exécuter OpenSSH sur des instances Amazon EC2 d'un groupe Auto Scaling, authentifier les transporteurs avec un module PAM LDAP, et monter le compartiment sur les instances avec Mountpoint for Amazon S3."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Transfer Family provides a managed SFTP endpoint that stores files in Amazon S3. With a custom identity provider, a Lambda function authenticates each login against the existing identity provider, so credentials stay in LDAP. A DNS record for sftp.example.com that points to the server endpoint keeps the host name.
    fr: |-
      Transfer Family fournit un point de terminaison SFTP géré qui stocke les fichiers dans Amazon S3. Avec un fournisseur d'identité personnalisé, une fonction Lambda authentifie chaque connexion auprès du fournisseur d'identité existant : les identifiants restent dans le LDAP. Un enregistrement DNS sftp.example.com qui pointe vers le point de terminaison du serveur conserve le nom d'hôte.
  options:
    a:
      en: |-
        File Gateway serves NFS or SMB file shares, not SFTP, so the carriers' SFTP clients cannot connect to it.
      fr: |-
        File Gateway fournit des partages NFS ou SMB, pas SFTP : les clients SFTP des transporteurs ne peuvent pas s'y connecter.
    b:
      en: |-
        Service-managed users authenticate with SSH keys, not passwords, and copying the users duplicates the directory.
      fr: |-
        Les utilisateurs gérés par le service s'authentifient par clés SSH, pas par mots de passe, et copier les utilisateurs duplique l'annuaire.
    d:
      en: |-
        EC2 instances, OpenSSH and the PAM module are servers and software that the company would have to manage.
      fr: |-
        Les instances EC2, OpenSSH et le module PAM sont des serveurs et des logiciels que l'entreprise devrait gérer.
references:
  - title: Working with custom identity providers - AWS Transfer Family
    url: https://docs.aws.amazon.com/transfer/latest/userguide/custom-idp-intro.html
