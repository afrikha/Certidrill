id: sapc03-1b-eks-udp-nlb-alb
objective: "1.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A gaming company is moving a multiplayer game backend to an Amazon EKS cluster whose nodes run on Amazon EC2. The game server pods receive player traffic on UDP port 7777. A separate matchmaking service exposes an HTTPS API with two URL paths, /match and /status, which must be served from one hostname with a certificate from AWS Certificate Manager (ACM). The AWS Load Balancer Controller is installed, and the company wants it to provision and manage all load balancers. Traffic must be sent directly to pod IP addresses.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de jeux vidéo migre le backend d'un jeu multijoueur vers un cluster Amazon EKS dont les nœuds s'exécutent sur Amazon EC2. Les pods des serveurs de jeu reçoivent le trafic des joueurs sur le port UDP 7777. Un service de mise en relation distinct expose une API HTTPS avec deux chemins d'URL, /match et /status, qui doivent être servis depuis un seul nom d'hôte avec un certificat d'AWS Certificate Manager (ACM). L'AWS Load Balancer Controller est installé, et l'entreprise veut qu'il provisionne et gère tous les équilibreurs de charge. Le trafic doit être envoyé directement aux adresses IP des pods.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Expose the game servers through a Service of type LoadBalancer with a UDP port 7777 and the annotations aws-load-balancer-type: external and aws-load-balancer-nlb-target-type: ip."
        fr: "Exposer les serveurs de jeu via un Service de type LoadBalancer avec un port UDP 7777 et les annotations aws-load-balancer-type: external et aws-load-balancer-nlb-target-type: ip."
    - id: b
      text:
        en: "Expose the game servers through an Ingress resource of the alb ingress class with a listener on UDP port 7777 and the target-type: ip annotation."
        fr: "Exposer les serveurs de jeu via une ressource Ingress de la classe alb avec un écouteur sur le port UDP 7777 et l'annotation target-type: ip."
    - id: c
      text:
        en: "Expose the matchmaking API through a Service of type LoadBalancer without annotations, so that a Classic Load Balancer terminates HTTPS with the ACM certificate."
        fr: "Exposer l'API de mise en relation via un Service de type LoadBalancer sans annotation, afin qu'un Classic Load Balancer termine le HTTPS avec le certificat ACM."
    - id: d
      text:
        en: "Expose the matchmaking API through an Ingress resource of the alb ingress class with rules for /match and /status, the target-type: ip annotation and the ACM certificate on an HTTPS listener."
        fr: "Exposer l'API de mise en relation via une ressource Ingress de la classe alb avec des règles pour /match et /status, l'annotation target-type: ip et le certificat ACM sur un écouteur HTTPS."
    - id: e
      text:
        en: "Have the controller provision one Gateway Load Balancer for both services so that the UDP game traffic and the HTTPS API traffic share the same load balancer."
        fr: "Faire provisionner par le contrôleur un seul Gateway Load Balancer pour les deux services afin que le trafic de jeu UDP et le trafic HTTPS de l'API partagent le même équilibreur de charge."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "For a Service of type LoadBalancer, the external type annotation makes the AWS Load Balancer Controller create a Network Load Balancer, which supports UDP, and the ip target type registers pod IP addresses. For HTTP routing by path with TLS termination, an Ingress of the alb class creates an Application Load Balancer with path rules, ip targets and the ACM certificate."
    fr: "Pour un Service de type LoadBalancer, l'annotation de type external fait créer par l'AWS Load Balancer Controller un Network Load Balancer, qui prend en charge UDP, et le type de cible ip enregistre les adresses IP des pods. Pour le routage HTTP par chemin avec terminaison TLS, un Ingress de la classe alb crée un Application Load Balancer avec des règles par chemin, des cibles ip et le certificat ACM."
  options:
    b:
      en: "Application Load Balancers support only HTTP and HTTPS listeners, so an Ingress cannot carry UDP traffic."
      fr: "Les Application Load Balancers ne prennent en charge que des écouteurs HTTP et HTTPS : un Ingress ne peut pas transporter de trafic UDP."
    c:
      en: "Without the external annotation, the legacy cloud provider controller creates a Classic Load Balancer with instance targets, which fails the requirements to use the AWS Load Balancer Controller and pod IP targets."
      fr: "Sans l'annotation external, l'ancien contrôleur du fournisseur cloud crée un Classic Load Balancer avec des cibles instance, ce qui ne respecte pas les exigences d'utiliser l'AWS Load Balancer Controller et des cibles IP de pods."
    e:
      en: "A Gateway Load Balancer inserts third-party virtual appliances into the traffic path; it does not terminate HTTPS or route by path, and the controller does not provision it for Services or Ingresses."
      fr: "Un Gateway Load Balancer insère des appliances virtuelles tierces dans le chemin du trafic ; il ne termine pas le HTTPS et ne route pas par chemin, et le contrôleur ne le provisionne pas pour des Services ou des Ingress."
references:
  - title: Route TCP and UDP traffic with Network Load Balancers
    url: https://docs.aws.amazon.com/eks/latest/userguide/network-load-balancing.html
  - title: Route application and HTTP traffic with Application Load Balancers
    url: https://docs.aws.amazon.com/eks/latest/userguide/alb-ingress.html
