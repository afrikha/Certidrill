id: sapc03-1b-tgw-dx-vpn-backup
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company connects its data center to 30 VPCs through a transit gateway. Production traffic uses an AWS Direct Connect connection with a transit virtual interface to a Direct Connect gateway that is associated with the transit gateway. The company is adding an AWS Site-to-Site VPN attachment with dynamic routing on the same transit gateway as a backup path. Traffic between the VPCs and the data center must use Direct Connect whenever it is available, must fail over to the VPN automatically if Direct Connect fails, and must return to Direct Connect when it recovers, without manual route changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise relie son centre de données à 30 VPC via une passerelle de transit. Le trafic de production utilise une connexion AWS Direct Connect avec une interface virtuelle de transit vers une passerelle Direct Connect associée à la passerelle de transit. L'entreprise ajoute sur la même passerelle de transit un attachement VPN AWS Site-to-Site à routage dynamique comme chemin de secours. Le trafic entre les VPC et le centre de données doit utiliser Direct Connect chaque fois que c'est possible, basculer automatiquement vers le VPN si Direct Connect tombe en panne et revenir sur Direct Connect à son rétablissement, sans modification manuelle des routes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Advertise the same prefixes with BGP over Direct Connect and the VPN, so that the transit gateway prefers the Direct Connect gateway routes, and prefer the Direct Connect routes on the data center router."
        fr: "Annoncer les mêmes préfixes avec BGP via Direct Connect et le VPN, afin que la passerelle de transit préfère les routes de la passerelle Direct Connect, et préférer les routes Direct Connect sur le routeur du centre de données."
    - id: b
      text:
        en: "Keep the Direct Connect routes propagated, and add a static route for the data center prefixes to the transit gateway route table with the VPN attachment as the backup target."
        fr: "Garder la propagation des routes Direct Connect, et ajouter à la table de routage de la passerelle de transit une route statique pour les préfixes du centre de données avec l'attachement VPN comme cible de secours."
    - id: c
      text:
        en: "Advertise more specific prefixes over the VPN than over Direct Connect, so that the VPN routes are already installed in the transit gateway route table before Direct Connect ever fails."
        fr: "Annoncer via le VPN des préfixes plus spécifiques que via Direct Connect, afin que les routes VPN soient déjà installées dans la table de routage de la passerelle de transit avant toute panne de Direct Connect."
    - id: d
      text:
        en: "Turn on ECMP support on the transit gateway so that it spreads traffic across the Direct Connect gateway attachment and the VPN attachment and stops using a path when its BGP session goes down."
        fr: "Activer la prise en charge d'ECMP sur la passerelle de transit afin qu'elle répartisse le trafic entre l'attachement de la passerelle Direct Connect et l'attachement VPN et cesse d'utiliser un chemin quand sa session BGP tombe."
answer: { optionId: a }
explanation:
  correct:
    en: "For the same CIDR from different attachment types, a transit gateway prefers Direct Connect gateway propagated routes over Site-to-Site VPN propagated routes. The VPN route appears only when the Direct Connect route is no longer advertised, so failover and failback follow BGP automatically. The data center router must also prefer the Direct Connect path for traffic toward AWS, for example with a higher local preference."
    fr: "Pour un même CIDR provenant de types d'attachements différents, une passerelle de transit préfère les routes propagées par la passerelle Direct Connect à celles propagées par le VPN Site-to-Site. La route VPN n'apparaît que lorsque la route Direct Connect n'est plus annoncée : le basculement et le retour suivent BGP automatiquement. Le routeur du centre de données doit aussi préférer le chemin Direct Connect pour le trafic vers AWS, par exemple avec une préférence locale plus élevée."
  options:
    b:
      en: "Static routes have a higher priority than propagated routes for the same destination, so all traffic would use the VPN even while Direct Connect is available."
      fr: "Les routes statiques ont une priorité plus élevée que les routes propagées pour une même destination : tout le trafic utiliserait le VPN même quand Direct Connect est disponible."
    c:
      en: "The most specific route is evaluated first, so the VPN would carry the traffic all the time instead of acting as a backup."
      fr: "La route la plus spécifique est évaluée en premier : le VPN transporterait le trafic en permanence au lieu de servir de secours."
    d:
      en: "ECMP is not supported between different attachment types, and the requirement is an active/passive design, not load sharing."
      fr: "ECMP n'est pas pris en charge entre des types d'attachements différents, et l'exigence est une conception actif/passif, pas un partage de charge."
references:
  - title: How AWS Transit Gateway works
    url: https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html
