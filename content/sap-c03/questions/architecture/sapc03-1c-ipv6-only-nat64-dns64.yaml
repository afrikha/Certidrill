id: sapc03-1c-ipv6-only-nat64-dns64
objective: "1.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is deploying new microservices in IPv6-only subnets of a dual-stack VPC to stop consuming scarce IPv4 addresses. The microservices must call a partner's payment API on the internet that is reachable only over IPv4. They must also download packages from IPv6-enabled repositories on the internet. No connection from the internet may be initiated to the microservices. The VPC already has an internet gateway and a dual-stack public subnet in each Availability Zone.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie de nouveaux microservices dans des sous-réseaux IPv6 uniquement d'un VPC double pile, pour cesser de consommer des adresses IPv4 rares. Les microservices doivent appeler sur Internet l'API de paiement d'un partenaire, joignable uniquement en IPv4. Ils doivent aussi télécharger des paquets depuis des dépôts Internet compatibles IPv6. Aucune connexion ne doit pouvoir être initiée depuis Internet vers les microservices. Le VPC dispose déjà d'une passerelle Internet et d'un sous-réseau public double pile dans chaque zone de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an egress-only internet gateway, add a ::/0 route to it in the IPv6-only subnets' route tables, and rely on it to translate requests for IPv4-only destinations."
        fr: "Créer une passerelle Internet de sortie uniquement, ajouter une route ::/0 vers elle dans les tables de routage des sous-réseaux IPv6 uniquement, et compter sur elle pour traduire les requêtes vers les destinations IPv4 uniquement."
    - id: b
      text:
        en: "Enable DNS64 on the IPv6-only subnets, create NAT gateways in the public subnets, route 64:ff9b::/96 to the NAT gateways and route ::/0 to an egress-only internet gateway."
        fr: "Activer DNS64 sur les sous-réseaux IPv6 uniquement, créer des passerelles NAT dans les sous-réseaux publics, router 64:ff9b::/96 vers les passerelles NAT et router ::/0 vers une passerelle Internet de sortie uniquement."
    - id: c
      text:
        en: "Create NAT gateways in the public subnets, and add a 0.0.0.0/0 route to the NAT gateways in the route tables of the IPv6-only subnets."
        fr: "Créer des passerelles NAT dans les sous-réseaux publics, et ajouter une route 0.0.0.0/0 vers ces passerelles dans les tables de routage des sous-réseaux IPv6 uniquement."
    - id: d
      text:
        en: "Enable automatic assignment of public IPv4 addresses on the IPv6-only subnets, and add a 0.0.0.0/0 route to the internet gateway in their route tables."
        fr: "Activer l'attribution automatique d'adresses IPv4 publiques sur les sous-réseaux IPv6 uniquement, et ajouter une route 0.0.0.0/0 vers la passerelle Internet dans leurs tables de routage."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With DNS64 enabled on a subnet, Route 53 Resolver synthesizes an IPv6 address with the 64:ff9b::/96 prefix when a name has only an IPv4 address. A route for 64:ff9b::/96 to a NAT gateway in a public subnet sends that traffic through NAT64 to the IPv4 API. The egress-only internet gateway carries native IPv6 traffic outbound and prevents the internet from initiating connections.
    fr: |-
      Avec DNS64 activé sur un sous-réseau, Route 53 Resolver synthétise une adresse IPv6 avec le préfixe 64:ff9b::/96 lorsqu'un nom n'a qu'une adresse IPv4. Une route 64:ff9b::/96 vers une passerelle NAT d'un sous-réseau public fait passer ce trafic par NAT64 jusqu'à l'API IPv4. La passerelle Internet de sortie uniquement achemine le trafic IPv6 natif sortant et empêche Internet d'initier des connexions.
  options:
    a:
      en: |-
        An egress-only internet gateway carries IPv6 traffic only and performs no translation to IPv4.
      fr: |-
        Une passerelle Internet de sortie uniquement n'achemine que du trafic IPv6 et n'effectue aucune traduction vers IPv4.
    c:
      en: |-
        IPv6-only instances have no IPv4 address, so an IPv4 default route is never used.
      fr: |-
        Les instances IPv6 uniquement n'ont pas d'adresse IPv4 : une route IPv4 par défaut n'est jamais utilisée.
    d:
      en: |-
        IPv6-only subnets have no IPv4 addressing, and public addresses would let the internet initiate connections.
      fr: |-
        Les sous-réseaux IPv6 uniquement n'ont pas d'adressage IPv4, et des adresses publiques permettraient à Internet d'initier des connexions.
references:
  - title: DNS64 and NAT64 - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-nat64-dns64.html
  - title: Enable outbound IPv6 traffic using an egress-only internet gateway - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html
