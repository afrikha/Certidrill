id: sapc03-1b-lambda-edge-image-variants
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company serves 40 million images from an Amazon S3 bucket through Amazon CloudFront with origin access control. Mobile apps request images with a width query parameter, and because clients send arbitrary widths, the cache hit ratio is low. The company wants to round every width to one of six supported sizes before the cache lookup. Each resized WebP variant must be generated on the first request for its size, stored in S3, and then served from the cache. Resizing uses an image-processing library of about 25 MB and takes up to 2 seconds per image. To minimize cost, code must run only when it is needed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages sert 40 millions d'images depuis un compartiment Amazon S3 via Amazon CloudFront avec un contrôle d'accès à l'origine (OAC). Les applications mobiles demandent les images avec un paramètre de chaîne de requête width, et comme les clients envoient des largeurs arbitraires, le taux d'accès au cache est faible. L'entreprise veut arrondir chaque largeur à l'une des six tailles prises en charge avant la consultation du cache. Chaque variante WebP redimensionnée doit être générée à la première requête pour sa taille, stockée dans S3, puis servie depuis le cache. Le redimensionnement utilise une bibliothèque de traitement d'images d'environ 25 Mo et prend jusqu'à 2 secondes par image. Pour réduire les coûts, le code ne doit s'exécuter que lorsque c'est nécessaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Associate one CloudFront Functions function with the viewer request event that rounds the width, resizes the image with the library and writes each generated variant to the S3 bucket."
        fr: "Associer à l'événement de requête de l'utilisateur une seule fonction CloudFront Functions qui arrondit la largeur, redimensionne l'image avec la bibliothèque et écrit chaque variante générée dans le compartiment S3."
    - id: b
      text:
        en: "Associate a CloudFront Functions function with viewer requests to round the width, and a Lambda@Edge function with origin requests that generates a missing variant, stores it in S3 and forwards the request."
        fr: "Associer aux requêtes des utilisateurs une fonction CloudFront Functions qui arrondit la largeur, et aux requêtes à l'origine une fonction Lambda@Edge qui génère une variante manquante, la stocke dans S3 et transmet la requête."
    - id: c
      text:
        en: "Associate a Lambda@Edge function with the viewer request event that rounds the width, checks whether the variant exists in S3, and generates and stores the variant when it is missing."
        fr: "Associer à l'événement de requête de l'utilisateur une fonction Lambda@Edge qui arrondit la largeur, vérifie si la variante existe dans S3, puis génère et stocke la variante quand elle manque."
    - id: d
      text:
        en: "Package the library in a Lambda layer for an arm64 Lambda@Edge function on the origin response event that resizes images, and use CloudFront Functions on viewer requests to round the width."
        fr: "Empaqueter la bibliothèque dans une couche Lambda pour une fonction Lambda@Edge arm64 sur l'événement de réponse de l'origine qui redimensionne les images, et utiliser CloudFront Functions sur les requêtes des utilisateurs pour arrondir la largeur."
answer: { optionId: b }
explanation:
  correct:
    en: "CloudFront Functions on the viewer request event normalize the width before the cache lookup at low cost. Origin request functions run only on cache misses, and Lambda@Edge supports packages up to 50 MB, up to 10,240 MB of memory for origin events and network calls to S3. Once the variant is in S3, later requests are cache hits that run no Lambda@Edge code."
    fr: "CloudFront Functions sur l'événement de requête de l'utilisateur normalise la largeur avant la consultation du cache, à faible coût. Les fonctions de requête à l'origine ne s'exécutent qu'en cas d'échec de cache, et Lambda@Edge accepte des paquets jusqu'à 50 Mo, jusqu'à 10 240 Mo de mémoire pour les événements d'origine et des appels réseau vers S3. Une fois la variante dans S3, les requêtes suivantes sont des accès au cache qui n'exécutent aucun code Lambda@Edge."
  options:
    a:
      en: "CloudFront Functions allow 10 KB of code and 2 MB of memory and run for under a millisecond, so they cannot load a 25 MB library or resize images."
      fr: "CloudFront Functions autorise 10 Ko de code et 2 Mo de mémoire et s'exécute en moins d'une milliseconde : il ne peut ni charger une bibliothèque de 25 Mo ni redimensionner des images."
    c:
      en: "Viewer request functions run on every request, including cache hits, which adds cost and latency, and viewer events are limited to 128 MB of memory."
      fr: "Les fonctions de requête de l'utilisateur s'exécutent à chaque requête, y compris les accès au cache, ce qui ajoute coûts et latence, et les événements utilisateur sont limités à 128 Mo de mémoire."
    d:
      en: "Lambda@Edge does not support Lambda layers or the arm64 architecture."
      fr: "Lambda@Edge ne prend en charge ni les couches Lambda ni l'architecture arm64."
references:
  - title: Restrictions on Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-at-edge-function-restrictions.html
  - title: Differences between CloudFront Functions and Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
