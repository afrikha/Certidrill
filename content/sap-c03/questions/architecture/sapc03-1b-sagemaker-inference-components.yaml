id: sapc03-1b-sagemaker-inference-components
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank hosts five fine-tuned open-weight large language models of 7 to 13 billion parameters on Amazon SageMaker AI, each on its own real-time endpoint with dedicated GPU instances. Each model uses a different serving container configuration and needs a specific number of accelerators. Two models serve steady daytime traffic, and three are used only a few hours per week, but all five endpoints run around the clock. The bank wants to share GPU instances between the models, scale each model independently, and stop paying for instances when no model is in use, while keeping real-time invocations.

    Which solution will meet these requirements?
  fr: |
    Une banque héberge sur Amazon SageMaker AI cinq grands modèles de langage à poids ouverts affinés, de 7 à 13 milliards de paramètres, chacun sur son propre point de terminaison en temps réel avec des instances GPU dédiées. Chaque modèle utilise une configuration de conteneur de service différente et a besoin d'un nombre précis d'accélérateurs. Deux modèles servent un trafic diurne régulier, et trois ne sont utilisés que quelques heures par semaine, mais les cinq points de terminaison tournent en continu. La banque veut partager les instances GPU entre les modèles, mettre chaque modèle à l'échelle indépendamment et ne plus payer d'instances quand aucun modèle n'est utilisé, tout en conservant les invocations en temps réel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Host the five models on one SageMaker AI multi-model endpoint with GPU instances, so that the endpoint loads each model from Amazon S3 when it is invoked and unloads models that are not used."
        fr: "Héberger les cinq modèles sur un seul point de terminaison multimodèle SageMaker AI avec des instances GPU, afin que le point de terminaison charge chaque modèle depuis Amazon S3 lors de son invocation et décharge les modèles inutilisés."
    - id: b
      text:
        en: "Move the five models to SageMaker AI serverless endpoints with the maximum memory size, so that each model scales on its own and nothing is billed while a model is idle."
        fr: "Déplacer les cinq modèles vers des points de terminaison serverless SageMaker AI avec la taille de mémoire maximale, afin que chaque modèle évolue seul et que rien ne soit facturé quand un modèle est inactif."
    - id: c
      text:
        en: "Create one endpoint with managed instance scaling and a minimum instance count of 0, deploy each model as an inference component with its accelerator requirements, and scale each component's copy count between 0 and its maximum."
        fr: "Créer un point de terminaison avec la mise à l'échelle gérée des instances et un nombre minimal d'instances de 0, déployer chaque modèle comme composant d'inférence avec ses besoins en accélérateurs, et faire varier le nombre de copies de chaque composant entre 0 et son maximum."
    - id: d
      text:
        en: "Keep the five endpoints, and add scheduled scaling actions that set the instance count of the three rarely used endpoints to one outside their usual hours of use."
        fr: "Conserver les cinq points de terminaison, et ajouter des actions de mise à l'échelle planifiées qui fixent à une instance le nombre d'instances des trois points de terminaison peu utilisés en dehors de leurs heures habituelles d'utilisation."
answer: { optionId: c }
explanation:
  correct:
    en: "Inference components let several models share the instances of one endpoint, each with its own container, accelerator, CPU and memory allocation and its own copy count. Each component can scale its copies down to zero, and an endpoint that hosts inference components can scale to zero instances when its managed instance scaling minimum is 0, so the bank pays for no instance while nothing runs."
    fr: "Les composants d'inférence permettent à plusieurs modèles de partager les instances d'un point de terminaison, chacun avec son propre conteneur, sa propre allocation d'accélérateurs, de processeur et de mémoire et son propre nombre de copies. Chaque composant peut réduire ses copies à zéro, et un point de terminaison qui héberge des composants d'inférence peut descendre à zéro instance quand le minimum de sa mise à l'échelle gérée est 0 : la banque ne paie aucune instance quand rien ne s'exécute."
  options:
    a:
      en: "A multi-model endpoint uses one shared serving container and time-shares models of similar size; it cannot give each model its own container and accelerator allocation or scale models independently."
      fr: "Un point de terminaison multimodèle utilise un seul conteneur de service partagé et partage dans le temps des modèles de taille similaire : il ne peut pas donner à chaque modèle son propre conteneur et sa propre allocation d'accélérateurs, ni mettre les modèles à l'échelle indépendamment."
    b:
      en: "Serverless inference does not support GPUs and offers at most 6 GB of memory, which cannot host these models."
      fr: "L'inférence serverless ne prend pas en charge les GPU et offre au plus 6 Go de mémoire, ce qui ne peut pas héberger ces modèles."
    d:
      en: "Separate endpoints never share GPU instances, and keeping one instance for each idle endpoint still bills GPU hours when no model is used."
      fr: "Des points de terminaison séparés ne partagent jamais d'instances GPU, et garder une instance pour chaque point de terminaison inactif facture toujours des heures GPU quand aucun modèle n'est utilisé."
references:
  - title: Deploy models for real-time inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/realtime-endpoints-deploy-models.html
  - title: Scale an endpoint to zero instances
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/endpoint-auto-scaling-zero-instances.html
