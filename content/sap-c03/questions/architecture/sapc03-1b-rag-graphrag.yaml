id: sapc03-1b-rag-graphrag
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An automotive supplier has exported 900 documents to Amazon S3: supplier contracts, bills of materials and quality incident reports. Engineers ask questions such as which suppliers of the components used in the X200 brake module had quality incidents last year. The answers require connecting facts that appear in different documents through shared entities, and the current knowledge base, which uses semantic search on an OpenSearch Serverless index, returns isolated chunks that miss these links. The company wants a managed retrieval capability that follows the relationships between entities across documents, without building its own graph pipeline.

    Which solution will meet these requirements?
  fr: |
    Un équipementier automobile a exporté 900 documents vers Amazon S3 : contrats fournisseurs, nomenclatures et rapports d'incidents qualité. Les ingénieurs posent des questions comme : quels fournisseurs des composants utilisés dans le module de frein X200 ont eu des incidents qualité l'an dernier ? Les réponses exigent de relier des faits qui apparaissent dans des documents différents via des entités communes, et la base de connaissances actuelle, qui utilise la recherche sémantique sur un index OpenSearch Serverless, renvoie des fragments isolés qui manquent ces liens. L'entreprise veut une capacité de récupération gérée qui suit les relations entre entités d'un document à l'autre, sans construire son propre pipeline de graphe.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Switch the existing knowledge base to hierarchical chunking with large parent chunks, so that each retrieved child chunk is replaced by a broader parent chunk with more context."
        fr: "Passer la base de connaissances existante au découpage hiérarchique avec de grands fragments parents, afin que chaque fragment enfant récupéré soit remplacé par un fragment parent plus large avec plus de contexte."
    - id: b
      text:
        en: "Add a reranker model and increase the number of results of the existing knowledge base, so that more chunks about suppliers, components and incidents reach the model."
        fr: "Ajouter un modèle de reclassement et augmenter le nombre de résultats de la base de connaissances existante, afin que davantage de fragments sur les fournisseurs, les composants et les incidents atteignent le modèle."
    - id: c
      text:
        en: "Load the documents into Amazon Redshift tables, and create a knowledge base connected to Redshift as a structured data store so that questions are converted into SQL queries."
        fr: "Charger les documents dans des tables Amazon Redshift, et créer une base de connaissances connectée à Redshift comme magasin de données structurées afin que les questions soient converties en requêtes SQL."
    - id: d
      text:
        en: "Create a knowledge base with an Amazon Neptune Analytics graph that has a vector search index, choose a graph construction model, and use the S3 bucket as the data source."
        fr: "Créer une base de connaissances avec un graphe Amazon Neptune Analytics doté d'un index de recherche vectorielle, choisir un modèle de construction du graphe et utiliser le compartiment S3 comme source de données."
answer: { optionId: d }
explanation:
  correct:
    en: "Managed GraphRAG with Neptune Analytics identifies entities and relationships within documents. At query time, a vector search finds relevant nodes and the graph is traversed to add related chunks, which helps when information is connected through several logical steps. GraphRAG supports Amazon S3 as the data source, and 900 files are within the default limit of 1,000 files per data source."
    fr: "GraphRAG géré avec Neptune Analytics identifie les entités et les relations au sein des documents. Lors d'une requête, une recherche vectorielle trouve les nœuds pertinents puis le graphe est parcouru pour ajouter les fragments liés, ce qui aide quand l'information est reliée par plusieurs étapes logiques. GraphRAG accepte Amazon S3 comme source de données, et 900 fichiers respectent la limite par défaut de 1 000 fichiers par source de données."
  options:
    a:
      en: "Parent chunks add surrounding text from the same document, but they do not link facts spread across different documents through shared entities."
      fr: "Les fragments parents ajoutent le texte environnant du même document, mais ils ne relient pas des faits répartis dans des documents différents via des entités communes."
    b:
      en: "More and better-ranked chunks are still independent similarity matches; nothing follows the relationships between components, suppliers and incidents."
      fr: "Des fragments plus nombreux et mieux classés restent des correspondances de similarité indépendantes : rien ne suit les relations entre composants, fournisseurs et incidents."
    c:
      en: "The documents are unstructured text, so loading them into tables would require the company to build its own extraction pipeline first."
      fr: "Les documents sont du texte non structuré : les charger dans des tables obligerait l'entreprise à construire d'abord son propre pipeline d'extraction."
references:
  - title: Build a knowledge base with Amazon Neptune Analytics graphs
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/knowledge-base-build-graphs.html
