id: sapc03-1a-global-endpoint-failover
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company publishes custom events from its applications to a custom Amazon EventBridge event bus named payments in us-east-1. Consumers of the events run in us-east-1, and a standby copy of the consumers runs in us-west-2 in the same account. The company's disaster recovery plan requires that, if EventBridge in us-east-1 is impaired, event ingestion fails over automatically to us-west-2 within minutes. When us-east-1 is healthy again, the events must return to the primary Region automatically, without manual steps. A recovery time and recovery point of about 7 minutes are acceptable. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de paiement publie les événements personnalisés de ses applications sur un bus d'événements personnalisé Amazon EventBridge nommé payments dans us-east-1. Les consommateurs des événements s'exécutent dans us-east-1, et une copie de secours des consommateurs s'exécute dans us-west-2, dans le même compte. Le plan de reprise après sinistre de l'entreprise exige que, si EventBridge est dégradé dans us-east-1, l'ingestion des événements bascule automatiquement vers us-west-2 en quelques minutes. Quand us-east-1 est de nouveau sain, les événements doivent revenir automatiquement vers la Région principale, sans étape manuelle. Un délai et un point de reprise d'environ 7 minutes sont acceptables. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a rule on the payments bus in us-east-1 that sends all the events to an event bus in us-west-2, and have the standby consumers in us-west-2 process the events only when an Amazon CloudWatch alarm reports an outage.
        fr: |-
          Créer sur le bus payments de us-east-1 une règle qui envoie tous les événements à un bus d'événements de us-west-2, et faire traiter les événements par les consommateurs de secours de us-west-2 uniquement quand une alarme Amazon CloudWatch signale une panne.
    - id: b
      text:
        en: |-
          Create an EventBridge global endpoint with us-east-1 as primary and us-west-2 as secondary, an Amazon Route 53 health check, a payments bus in each Region, and event replication turned off to reduce costs.
        fr: |-
          Créer un point de terminaison global EventBridge avec us-east-1 comme Région principale et us-west-2 comme Région secondaire, une vérification de l'état Amazon Route 53, un bus payments dans chaque Région, et la réplication des événements désactivée pour réduire les coûts.
    - id: c
      text:
        en: |-
          Create an EventBridge global endpoint with us-east-1 as primary and us-west-2 as secondary, an Amazon Route 53 health check, a payments bus in each Region, and event replication turned on, and send events with the endpoint ID.
        fr: |-
          Créer un point de terminaison global EventBridge avec us-east-1 comme Région principale et us-west-2 comme Région secondaire, une vérification de l'état Amazon Route 53, un bus payments dans chaque Région, et la réplication des événements activée, puis envoyer les événements avec l'ID du point de terminaison.
    - id: d
      text:
        en: |-
          Deploy an Amazon API Gateway API in each Region that puts the events on the local payments bus, and create Route 53 failover records with health checks that send the producers to the healthy Region.
        fr: |-
          Déployer dans chaque Région une API Amazon API Gateway qui place les événements sur le bus payments local, et créer des enregistrements de basculement Route 53 avec des vérifications de l'état qui dirigent les producteurs vers la Région saine.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A global endpoint routes custom events to the bus in the secondary Region when its Route 53 health check becomes unhealthy, with an RTO and RPO of 360 seconds (420 at most) when the prescriptive alarm is used. The buses must have the same name in both Regions in the same account, and producers call PutEvents with the endpoint ID. Event replication is required for automatic recovery; without it, the health check must be reset manually before events return to the primary Region.
    fr: |-
      Un point de terminaison global achemine les événements personnalisés vers le bus de la Région secondaire quand sa vérification de l'état Route 53 devient défaillante, avec un RTO et un RPO de 360 secondes (420 au maximum) lorsque l'alarme recommandée est utilisée. Les bus doivent porter le même nom dans les deux Régions, dans le même compte, et les producteurs appellent PutEvents avec l'ID du point de terminaison. La réplication des événements est nécessaire à la reprise automatique ; sans elle, la vérification de l'état doit être réinitialisée manuellement avant que les événements reviennent vers la Région principale.
  options:
    a:
      en: |-
        Producers still send events only to us-east-1, so if EventBridge in us-east-1 is impaired, no events are received or forwarded to us-west-2.
      fr: |-
        Les producteurs envoient toujours les événements uniquement vers us-east-1 : si EventBridge est dégradé dans us-east-1, aucun événement n'est reçu ni transféré vers us-west-2.
    b:
      en: |-
        Failover works without replication, but the health check must then be reset to healthy manually before events return to us-east-1, which breaks the automatic recovery requirement.
      fr: |-
        Le basculement fonctionne sans réplication, mais la vérification de l'état doit alors être remise manuellement à l'état sain avant que les événements reviennent vers us-east-1, ce qui ne respecte pas l'exigence de reprise automatique.
    d:
      en: |-
        Custom APIs and DNS failover records add components to build and operate that a global endpoint provides as a managed feature.
      fr: |-
        Des API personnalisées et des enregistrements de basculement DNS ajoutent des composants à construire et à exploiter, alors qu'un point de terminaison global les fournit sous forme de fonctionnalité gérée.
references:
  - title: Making applications Regional-fault tolerant with global endpoints in EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-global-endpoints.html
