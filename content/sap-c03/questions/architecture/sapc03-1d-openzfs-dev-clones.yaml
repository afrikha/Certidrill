id: sapc03-1d-openzfs-dev-clones
objective: "1.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company runs 40 Linux development environments. Each developer needs a private, writable copy of a 15 TB test data set, and the copies are refreshed every morning from a production copy. On premises, the company uses ZFS snapshots and clones, so each copy is ready in minutes and stores only the blocks that the developer changes. The company is moving this setup to AWS and needs NFS access with sub-millisecond latency. The company wants to keep storage costs low and to avoid long copy jobs every morning.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exploite 40 environnements de développement Linux. Chaque développeur a besoin d'une copie privée et modifiable d'un jeu de données de test de 15 To, et les copies sont actualisées chaque matin à partir d'une copie de production. Sur site, l'entreprise utilise des instantanés et des clones ZFS : chaque copie est prête en quelques minutes et ne stocke que les blocs modifiés par le développeur. L'entreprise migre cette configuration vers AWS et a besoin d'un accès NFS avec une latence inférieure à la milliseconde. L'entreprise veut maintenir des coûts de stockage faibles et éviter de longues tâches de copie chaque matin.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Store the data set on an Amazon FSx for OpenZFS volume, take a snapshot each morning, and create a clone volume from the snapshot for each developer."
        fr: "Stocker le jeu de données sur un volume Amazon FSx for OpenZFS, prendre un instantané chaque matin, et créer un volume clone à partir de l'instantané pour chaque développeur."
    - id: b
      text:
        en: "Store the data set on Amazon EFS, back it up with AWS Backup each morning, and restore the recovery point to a new file system for each developer."
        fr: "Stocker le jeu de données sur Amazon EFS, le sauvegarder avec AWS Backup chaque matin, et restaurer le point de récupération dans un nouveau système de fichiers pour chaque développeur."
    - id: c
      text:
        en: "Store the data set on an Amazon EBS gp3 volume, snapshot it each morning, and create a volume from the snapshot with fast snapshot restore for each developer."
        fr: "Stocker le jeu de données sur un volume Amazon EBS gp3, en prendre un instantané chaque matin, et créer un volume à partir de l'instantané avec la restauration rapide d'instantané pour chaque développeur."
    - id: d
      text:
        en: "Store the data set in Amazon S3, and import it each morning into an Amazon FSx for Lustre file system that is created for each developer."
        fr: "Stocker le jeu de données dans Amazon S3, et l'importer chaque matin dans un système de fichiers Amazon FSx for Lustre créé pour chaque développeur."
answer: { optionId: a }
explanation:
  correct:
    en: |
      FSx for OpenZFS serves NFS (versions 3 to 4.2) with latencies of a few hundred microseconds and offers near-instant snapshots. A clone volume created from a snapshot is writable, is ready almost instantly and initially consumes no additional capacity, because it stores only the changes. This reproduces the on-premises ZFS workflow without copy jobs.
    fr: |
      FSx for OpenZFS sert le NFS (versions 3 à 4.2) avec des latences de quelques centaines de microsecondes et offre des instantanés quasi instantanés. Un volume clone créé à partir d'un instantané est modifiable, prêt presque instantanément et ne consomme initialement aucune capacité supplémentaire, car il ne stocke que les modifications. Cela reproduit le flux de travail ZFS sur site sans tâche de copie.
  options:
    b:
      en: |
        Each restore writes a full 15 TB copy into a new file system, which takes hours and multiplies the storage cost by 40.
      fr: |
        Chaque restauration écrit une copie complète de 15 To dans un nouveau système de fichiers, ce qui prend des heures et multiplie le coût de stockage par 40.
    c:
      en: |
        Each new EBS volume is billed for its full 15 TB provisioned size, fast snapshot restore adds charges, and an EBS volume is block storage for one instance, not an NFS share.
      fr: |
        Chaque nouveau volume EBS est facturé pour la totalité de ses 15 To provisionnés, la restauration rapide d'instantané ajoute des frais, et un volume EBS est un stockage en mode bloc pour une instance, pas un partage NFS.
    d:
      en: |
        Forty file systems that each import the full data set every morning mean long copy jobs and 40 times the provisioned storage.
      fr: |
        Quarante systèmes de fichiers qui importent chacun tout le jeu de données chaque matin impliquent de longues tâches de copie et 40 fois le stockage provisionné.
references:
  - title: Creating an Amazon FSx for OpenZFS volume
    url: https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/creating-volumes.html
  - title: What is Amazon FSx for OpenZFS?
    url: https://docs.aws.amazon.com/fsx/latest/OpenZFSGuide/what-is-fsx.html
