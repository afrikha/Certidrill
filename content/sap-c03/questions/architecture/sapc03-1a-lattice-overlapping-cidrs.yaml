id: sapc03-1a-lattice-overlapping-cidrs
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 30 AWS accounts in an organization in AWS Organizations. Its microservices run on Amazon EC2 instances, AWS Lambda functions, and Amazon EKS pods in many VPCs, and several VPCs use the same 10.0.0.0/16 CIDR block. The microservices must call each other over HTTPS, and every request must be authorized based on the IAM identity of the caller. The networking team wants central access logs for all service-to-service requests and does not want IP routing between the VPCs. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 30 comptes AWS dans une organisation AWS Organizations. Ses microservices s'exécutent sur des instances Amazon EC2, des fonctions AWS Lambda et des pods Amazon EKS dans de nombreux VPC, et plusieurs VPC utilisent le même bloc d'adresses CIDR 10.0.0.0/16. Les microservices doivent s'appeler entre eux en HTTPS, et chaque requête doit être autorisée en fonction de l'identité IAM de l'appelant. L'équipe réseau veut des journaux d'accès centralisés pour toutes les requêtes entre services et ne veut pas de routage IP entre les VPC. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Attach all the VPCs to a transit gateway that is shared through AWS RAM, route the service traffic through the transit gateway, and enable VPC Flow Logs in every VPC for central visibility.
        fr: |-
          Attacher tous les VPC à une passerelle de transit partagée au moyen d'AWS RAM, acheminer le trafic des services par la passerelle de transit et activer les journaux de flux VPC dans chaque VPC pour une visibilité centralisée.
    - id: b
      text:
        en: |-
          Put a Network Load Balancer in front of each microservice, publish it as an AWS PrivateLink endpoint service, and have each consumer create an interface VPC endpoint for every service that it calls.
        fr: |-
          Placer un Network Load Balancer devant chaque microservice, le publier comme service de point de terminaison AWS PrivateLink et faire créer par chaque consommateur un point de terminaison de VPC d'interface pour chaque service qu'il appelle.
    - id: c
      text:
        en: |-
          Create an Amazon VPC Lattice service network that is shared through AWS RAM, register the microservices as Lattice services with their target groups, associate the VPCs, and use AWS_IAM auth policies and service network access logs.
        fr: |-
          Créer un réseau de service Amazon VPC Lattice partagé au moyen d'AWS RAM, enregistrer les microservices comme services Lattice avec leurs groupes cibles, associer les VPC, et utiliser des politiques d'authentification AWS_IAM et les journaux d'accès du réseau de service.
    - id: d
      text:
        en: |-
          Create an Amazon ECS Service Connect namespace in AWS Cloud Map, share it with the other accounts through AWS RAM, and register the microservices as client-server services in the namespace.
        fr: |-
          Créer un espace de noms Amazon ECS Service Connect dans AWS Cloud Map, le partager avec les autres comptes au moyen d'AWS RAM et enregistrer les microservices comme services client-serveur dans l'espace de noms.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      VPC Lattice connects services across VPCs and accounts without IP routing and supports overlapping CIDR ranges. Its target groups accept EC2 instances, IP addresses, Lambda functions, ECS tasks, and Kubernetes pods, its auth policies authorize each request based on the IAM identity, and the service network owner can enable access logs for all access across the network.
    fr: |-
      VPC Lattice relie des services entre VPC et entre comptes sans routage IP et prend en charge les plages CIDR qui se chevauchent. Ses groupes cibles acceptent les instances EC2, les adresses IP, les fonctions Lambda, les tâches ECS et les pods Kubernetes, ses politiques d'authentification autorisent chaque requête en fonction de l'identité IAM, et le propriétaire du réseau de service peut activer les journaux d'accès pour tous les accès du réseau.
  options:
    a:
      en: |-
        A transit gateway routes IP traffic, which the company does not want, it cannot route between VPCs that use the same CIDR block, and it does not authorize requests by IAM identity.
      fr: |-
        Une passerelle de transit achemine du trafic IP, ce que l'entreprise ne veut pas, elle ne peut pas acheminer le trafic entre des VPC qui utilisent le même bloc CIDR, et elle n'autorise pas les requêtes selon l'identité IAM.
    b:
      en: |-
        PrivateLink handles overlapping CIDRs, but a load balancer per service and an endpoint per consumer and service add heavy overhead, and it provides no per-request IAM authorization.
      fr: |-
        PrivateLink gère les CIDR qui se chevauchent, mais un équilibreur de charge par service et un point de terminaison par consommateur et par service ajoutent une lourde charge, et il ne fournit aucune autorisation IAM par requête.
    d:
      en: |-
        Service Connect interconnects Amazon ECS services only; EC2 instances, Lambda functions, and EKS pods cannot resolve its endpoint names.
      fr: |-
        Service Connect ne relie que des services Amazon ECS ; les instances EC2, les fonctions Lambda et les pods EKS ne peuvent pas résoudre ses noms de point de terminaison.
references:
  - title: What is Amazon VPC Lattice? - Amazon VPC Lattice
    url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/what-is-vpc-lattice.html
