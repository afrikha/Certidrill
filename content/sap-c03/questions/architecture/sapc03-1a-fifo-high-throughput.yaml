id: sapc03-1a-fifo-high-throughput
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company processes seat reservation requests through an Amazon SQS FIFO queue. The requests for each event venue must be processed in order, so the producers set the message group ID to the venue ID. Several thousand venues are active at the same time during major ticket sales. During these sales, the producers receive throttling errors from the queue even though the consumers keep up with the messages they receive. The company must keep per-venue ordering and deduplication. The company wants the solution with the LEAST operational overhead that does not require a redesign of the producers or consumers.

    Which solution will meet these requirements?
  fr: |
    Une société de billetterie traite les demandes de réservation de places au moyen d'une file d'attente Amazon SQS FIFO. Les demandes de chaque salle doivent être traitées dans l'ordre ; les producteurs définissent donc l'ID de groupe de messages sur l'ID de la salle. Plusieurs milliers de salles sont actives en même temps pendant les grandes mises en vente. Pendant ces ventes, les producteurs reçoivent des erreurs de limitation de la file d'attente, alors que les consommateurs suivent le rythme des messages qu'ils reçoivent. L'entreprise doit conserver l'ordre et la déduplication par salle. Elle veut la solution présentant le MOINS de charge opérationnelle et qui n'exige pas de refonte des producteurs ni des consommateurs.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Enable high throughput for the FIFO queue by setting the deduplication scope to the message group and the throughput limit to per message group ID, and send, receive, and delete messages in batches.
        fr: |-
          Activer le débit élevé pour la file d'attente FIFO en définissant l'étendue de déduplication sur le groupe de messages et la limite de débit par ID de groupe de messages, et envoyer, recevoir et supprimer les messages par lots.
    - id: b
      text:
        en: |-
          Replace the FIFO queue with an SQS standard queue, and have the consumers store the last processed sequence number of each venue in an Amazon DynamoDB table to reorder the requests.
        fr: |-
          Remplacer la file d'attente FIFO par une file d'attente SQS standard, et faire stocker par les consommateurs le dernier numéro de séquence traité de chaque salle dans une table Amazon DynamoDB pour remettre les demandes dans l'ordre.
    - id: c
      text:
        en: |-
          Create ten FIFO queues, change the producers to hash the venue ID to choose a queue, and deploy a separate consumer fleet that polls each of the ten queues.
        fr: |-
          Créer dix files d'attente FIFO, modifier les producteurs pour qu'ils hachent l'ID de la salle afin de choisir une file, et déployer une flotte de consommateurs distincte qui interroge chacune des dix files.
    - id: d
      text:
        en: |-
          Set the same message group ID on every message so that Amazon SQS can place all the messages in one partition and process them in a single ordered sequence.
        fr: |-
          Définir le même ID de groupe de messages sur tous les messages pour qu'Amazon SQS place tous les messages dans une seule partition et les traite en une seule séquence ordonnée.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      High throughput mode for FIFO queues scales request capacity across partitions while keeping ordering and deduplication within each message group. SQS spreads message groups across partitions by hashing the message group ID, so thousands of venue IDs use many partitions, and batching makes the best use of each partition. It is a queue setting, so producers and consumers do not change.
    fr: |-
      Le mode à débit élevé des files d'attente FIFO augmente la capacité de requêtes sur plusieurs partitions tout en conservant l'ordre et la déduplication dans chaque groupe de messages. SQS répartit les groupes de messages entre les partitions en hachant l'ID de groupe de messages : des milliers d'ID de salle utilisent donc de nombreuses partitions, et le traitement par lots exploite au mieux chaque partition. C'est un paramètre de file d'attente : les producteurs et les consommateurs ne changent pas.
  options:
    b:
      en: |-
        A standard queue gives up FIFO ordering and exactly-once deduplication, and rebuilding them in the consumers is a redesign with significant custom code.
      fr: |-
        Une file d'attente standard abandonne l'ordre FIFO et la déduplication exactement une fois, et les reconstruire dans les consommateurs est une refonte avec beaucoup de code personnalisé.
    c:
      en: |-
        Manual sharding across queues can raise throughput, but it changes the producers and adds queues and consumer fleets to operate, so it is not the least operational overhead.
      fr: |-
        Un partitionnement manuel entre plusieurs files peut augmenter le débit, mais il modifie les producteurs et ajoute des files et des flottes de consommateurs à exploiter : ce n'est pas la solution avec le moins de charge opérationnelle.
    d:
      en: |-
        A single message group ID serializes all the requests and maps them to one partition, which lowers throughput and removes the parallelism between venues.
      fr: |-
        Un seul ID de groupe de messages sérialise toutes les demandes et les place dans une seule partition, ce qui réduit le débit et supprime le parallélisme entre les salles.
references:
  - title: High throughput for FIFO queues in Amazon SQS - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/high-throughput-fifo.html
