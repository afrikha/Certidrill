id: sapc03-1d-elasticache-global-datastore
objective: "1.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs a node-based Amazon ElastiCache for Valkey cluster in us-east-1 that caches player profiles and game state. The company is launching in ap-southeast-2, where players need low-latency reads of the same cached data. All writes will continue to happen in us-east-1. If the us-east-1 cluster becomes degraded, the company wants to make the ap-southeast-2 copy the writable primary with minimal effort. The company does not want to change the application's write logic.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de jeux vidéo exploite dans us-east-1 un cluster Amazon ElastiCache for Valkey basé sur des nœuds qui met en cache les profils des joueurs et l'état des parties. L'entreprise se lance dans ap-southeast-2, où les joueurs ont besoin de lectures à faible latence des mêmes données en cache. Toutes les écritures continueront de se faire dans us-east-1. Si le cluster de us-east-1 se dégrade, l'entreprise veut faire de la copie de ap-southeast-2 le cluster principal accessible en écriture avec un effort minimal. L'entreprise ne veut pas modifier la logique d'écriture de l'application.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an ElastiCache Serverless cache in each Region, and enable cross-Region replication from the us-east-1 cache to the ap-southeast-2 cache."
        fr: "Créer un cache ElastiCache Serverless dans chaque Région, et activer la réplication entre Régions du cache de us-east-1 vers le cache de ap-southeast-2."
    - id: b
      text:
        en: "Create a second Valkey cluster in ap-southeast-2, and change the application so that it writes every update to both clusters."
        fr: "Créer un second cluster Valkey dans ap-southeast-2, et modifier l'application pour qu'elle écrive chaque mise à jour dans les deux clusters."
    - id: c
      text:
        en: "Add read replicas to the us-east-1 cluster, and place them in subnets of a peered VPC in ap-southeast-2 for the local reads."
        fr: "Ajouter des réplicas en lecture au cluster de us-east-1, et les placer dans des sous-réseaux d'un VPC connecté par peering dans ap-southeast-2 pour les lectures locales."
    - id: d
      text:
        en: "Create a global datastore with the us-east-1 cluster as its primary and a secondary cluster in ap-southeast-2, and promote the secondary if needed."
        fr: "Créer un global datastore avec le cluster de us-east-1 comme cluster principal et un cluster secondaire dans ap-southeast-2, et promouvoir le secondaire si nécessaire."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Global Datastore provides fully managed, asynchronous replication of a Valkey or Redis OSS cluster to a secondary cluster in another Region. The primary accepts writes and the secondary serves low-latency local reads, so the write logic does not change. If the primary degrades, the company promotes the secondary cluster to primary.
    fr: |
      Global Datastore fournit une réplication asynchrone entièrement gérée d'un cluster Valkey ou Redis OSS vers un cluster secondaire dans une autre Région. Le cluster principal accepte les écritures et le secondaire sert des lectures locales à faible latence : la logique d'écriture ne change pas. Si le cluster principal se dégrade, l'entreprise promeut le cluster secondaire en principal.
  options:
    a:
      en: |
        Global Datastore is available for node-based clusters only, and serverless caches have no cross-Region replication to enable.
      fr: |
        Global Datastore n'est disponible que pour les clusters basés sur des nœuds, et les caches serverless n'ont pas de réplication entre Régions à activer.
    b:
      en: |
        Dual writes change the application's write logic, and the two clusters can diverge when one of the writes fails.
      fr: |
        Les doubles écritures modifient la logique d'écriture de l'application, et les deux clusters peuvent diverger quand l'une des écritures échoue.
    c:
      en: |
        The read replicas of a cluster stay in the cluster's own Region; VPC peering does not let a replica run in another Region.
      fr: |
        Les réplicas en lecture d'un cluster restent dans la Région du cluster ; le peering de VPC ne permet pas à un réplica de s'exécuter dans une autre Région.
references:
  - title: Replication across AWS Regions using global datastores
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Redis-Global-Datastore.html
