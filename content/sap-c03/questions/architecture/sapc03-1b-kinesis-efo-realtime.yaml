id: sapc03-1b-kinesis-efo-realtime
objective: "1.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A sports data company ingests live match events into an Amazon Kinesis data stream in provisioned mode with 40 shards. Five applications read the whole stream: a WebSocket push service, a betting odds engine, a fraud detector, an archiver and an analytics job. Each application must be able to read up to 2 MB per second from every shard, and the push service and the odds engine need the lowest possible propagation delay. Today all five applications poll the stream with GetRecords, and they fall behind during matches.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de données sportives ingère des événements de matchs en direct dans un flux de données Amazon Kinesis en mode provisionné avec 40 partitions (shards). Cinq applications lisent l'ensemble du flux : un service de diffusion WebSocket, un moteur de cotes de paris, un détecteur de fraude, un archiveur et une tâche d'analyse. Chaque application doit pouvoir lire jusqu'à 2 Mo par seconde depuis chaque partition, et le service de diffusion et le moteur de cotes ont besoin du délai de propagation le plus faible possible. Aujourd'hui, les cinq applications interrogent le flux avec GetRecords et prennent du retard pendant les matchs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Increase the stream to 200 shards so that each application can read its own subset of shards with GetRecords without contending with the other applications."
        fr: "Porter le flux à 200 partitions afin que chaque application lise son propre sous-ensemble de partitions avec GetRecords sans concurrence avec les autres applications."
    - id: b
      text:
        en: "Have each application call GetRecords more frequently and request the maximum number of records per call, so that it reads the shards faster than today."
        fr: "Faire appeler GetRecords plus fréquemment par chaque application en demandant le nombre maximal d'enregistrements par appel, afin qu'elle lise les partitions plus vite qu'aujourd'hui."
    - id: c
      text:
        en: "Create one Amazon Data Firehose stream per application with the data stream as its source, and deliver the events to each application's destination."
        fr: "Créer un flux Amazon Data Firehose par application avec le flux de données comme source, et livrer les événements vers la destination de chaque application."
    - id: d
      text:
        en: "Register each application as an enhanced fan-out consumer of the stream, and have it receive the records that Kinesis pushes through SubscribeToShard."
        fr: "Enregistrer chaque application comme consommateur à diffusion améliorée (enhanced fan-out) du flux, et lui faire recevoir les enregistrements que Kinesis envoie via SubscribeToShard."
answer: { optionId: d }
explanation:
  correct:
    en: "Each enhanced fan-out consumer gets its own 2 MB per second per shard, independently of the other consumers, and Kinesis pushes records over HTTP/2 with a typical propagation delay of about 70 ms. A provisioned stream supports up to 20 registered consumers, so five applications fit."
    fr: "Chaque consommateur à diffusion améliorée dispose de ses propres 2 Mo par seconde et par partition, indépendamment des autres consommateurs, et Kinesis envoie les enregistrements via HTTP/2 avec un délai de propagation typique d'environ 70 ms. Un flux provisionné accepte jusqu'à 20 consommateurs enregistrés : cinq applications y tiennent."
  options:
    a:
      en: "Every application still needs all the events, so it must read every shard; shared-throughput consumers keep sharing the 2 MB per second of each shard."
      fr: "Chaque application a toujours besoin de tous les événements et doit donc lire chaque partition : les consommateurs à débit partagé continuent de partager les 2 Mo par seconde de chaque partition."
    b:
      en: "Shared-throughput consumers share a fixed 2 MB per second per shard, so polling harder does not add read capacity and propagation delay grows with the number of consumers."
      fr: "Les consommateurs à débit partagé se partagent 2 Mo par seconde fixes par partition : interroger plus souvent n'ajoute pas de capacité de lecture, et le délai de propagation augmente avec le nombre de consommateurs."
    c:
      en: "Firehose is a delivery service that loads records into destinations such as Amazon S3 or Amazon Redshift; it does not give the push service and the odds engine a direct low-latency read of the stream."
      fr: "Firehose est un service de livraison qui charge les enregistrements dans des destinations comme Amazon S3 ou Amazon Redshift : il n'offre pas au service de diffusion et au moteur de cotes une lecture directe à faible latence du flux."
references:
  - title: Develop enhanced fan-out consumers with dedicated throughput
    url: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
