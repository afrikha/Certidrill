id: sapc03-1a-stream-window-and-archive
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A payments company streams card transactions into an Amazon Kinesis Data Streams stream, and the producers use the merchant ID as the partition key. About 2,000 merchants are active at any time. A fraud dashboard needs the transaction count and total amount of each merchant for every 1-minute window, written to an Amazon DynamoDB table within seconds after the window closes. Every raw transaction must also be archived in compressed form in Amazon S3, where analysts query it with Amazon Athena. The company wants serverless services only, with no clusters to manage, and the LEAST custom code.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de paiement diffuse les transactions par carte dans un flux Amazon Kinesis Data Streams, et les producteurs utilisent l'ID du commerçant comme clé de partition. Environ 2 000 commerçants sont actifs à tout moment. Un tableau de bord de fraude a besoin du nombre de transactions et du montant total de chaque commerçant pour chaque fenêtre de 1 minute, écrits dans une table Amazon DynamoDB quelques secondes après la fermeture de la fenêtre. Chaque transaction brute doit aussi être archivée sous forme compressée dans Amazon S3, où les analystes l'interrogent avec Amazon Athena. L'entreprise veut uniquement des services sans serveur, sans cluster à gérer, et le MOINS de code personnalisé.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Create an AWS Lambda event source mapping on the stream with a 60-second tumbling window, aggregate the counts and totals per merchant in the window state, and write them to DynamoDB on the final invocation of each window.
        fr: |-
          Créer sur le flux un mappage des sources d'événements AWS Lambda avec une fenêtre bascule (tumbling window) de 60 secondes, agréger les nombres et les totaux par commerçant dans l'état de la fenêtre et les écrire dans DynamoDB lors de l'appel final de chaque fenêtre.
    - id: b
      text:
        en: |-
          Create an Amazon Data Firehose stream that reads from the same Kinesis data stream and delivers the raw transactions to S3 with compression enabled.
        fr: |-
          Créer un flux Amazon Data Firehose qui lit le même flux de données Kinesis et livre les transactions brutes dans S3 avec la compression activée.
    - id: c
      text:
        en: |-
          Schedule an Athena query every minute that aggregates the transactions of the last minute from the S3 archive and writes the results to the DynamoDB table.
        fr: |-
          Planifier toutes les minutes une requête Athena qui agrège les transactions de la dernière minute à partir de l'archive S3 et écrit les résultats dans la table DynamoDB.
    - id: d
      text:
        en: |-
          Create an Amazon EMR cluster that runs a Spark Structured Streaming application to compute the 1-minute aggregates per merchant and write them to DynamoDB.
        fr: |-
          Créer un cluster Amazon EMR qui exécute une application Spark Structured Streaming pour calculer les agrégats d'une minute par commerçant et les écrire dans DynamoDB.
    - id: e
      text:
        en: |-
          Run an AWS Glue crawler every minute on the S3 archive so that each new minute of transactions is added as a partition for the dashboard queries.
        fr: |-
          Exécuter toutes les minutes un robot d'analyse (crawler) AWS Glue sur l'archive S3 pour que chaque nouvelle minute de transactions soit ajoutée sous forme de partition pour les requêtes du tableau de bord.
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      Tumbling windows let a Lambda function keep state across invocations for each shard and process the complete state on the final invocation of the window; because the merchant ID is the partition key, all the records of a merchant are in one shard, so the per-shard aggregates are complete per merchant. Firehose is a second, managed consumer of the same stream that buffers, compresses, and delivers the raw records to S3 for Athena.
    fr: |-
      Les fenêtres bascules permettent à une fonction Lambda de conserver un état entre les appels pour chaque partition et de traiter l'état complet lors de l'appel final de la fenêtre ; comme l'ID du commerçant est la clé de partition, tous les enregistrements d'un commerçant se trouvent dans une seule partition : les agrégats par partition sont donc complets par commerçant. Firehose est un second consommateur géré du même flux qui met en mémoire tampon, compresse et livre les enregistrements bruts dans S3 pour Athena.
  options:
    c:
      en: |-
        Athena does not write to DynamoDB, and the S3 archive is delivered only after the Firehose buffering interval, so per-minute results would not be available within seconds.
      fr: |-
        Athena n'écrit pas dans DynamoDB, et l'archive S3 n'est livrée qu'après l'intervalle de mise en mémoire tampon de Firehose : les résultats par minute ne seraient pas disponibles en quelques secondes.
    d:
      en: |-
        An EMR cluster is a cluster to manage and requires a streaming application, which the requirements exclude.
      fr: |-
        Un cluster EMR est un cluster à gérer et exige une application de streaming, ce que les exigences excluent.
    e:
      en: |-
        A crawler only updates catalog metadata; it does not compute the aggregates, and running it every minute would not meet the latency requirement.
      fr: |-
        Un robot d'analyse ne met à jour que les métadonnées du catalogue ; il ne calcule pas les agrégats, et l'exécuter toutes les minutes ne répondrait pas à l'exigence de latence.
references:
  - title: Implementing stateful Kinesis Data Streams processing in Lambda - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-kinesis-windows.html
