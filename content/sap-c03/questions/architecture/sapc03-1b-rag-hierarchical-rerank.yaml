id: sapc03-1b-rag-hierarchical-rerank
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A law firm uses Amazon Bedrock Knowledge Bases with an Amazon OpenSearch Serverless vector store and default chunking for 80,000 long commercial contracts in Amazon S3. Lawyers report two problems. First, the retrieved chunks match the right clause but cut it off from the rest of its section, so answers miss conditions stated a few paragraphs earlier. Second, the most relevant chunks are often ranked below loosely related chunks, and the model then uses the wrong clauses. The firm wants to fix both problems with managed knowledge base features.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un cabinet d'avocats utilise Amazon Bedrock Knowledge Bases avec un magasin vectoriel Amazon OpenSearch Serverless et le découpage par défaut pour 80 000 longs contrats commerciaux dans Amazon S3. Les avocats signalent deux problèmes. D'abord, les fragments récupérés correspondent à la bonne clause mais la coupent du reste de sa section, si bien que les réponses manquent des conditions énoncées quelques paragraphes plus haut. Ensuite, les fragments les plus pertinents sont souvent classés derrière des fragments vaguement liés, et le modèle utilise alors les mauvaises clauses. Le cabinet veut corriger les deux problèmes avec des fonctionnalités gérées des bases de connaissances.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Re-create the data source with hierarchical chunking, using small child chunks for matching and larger parent chunks that cover whole sections, and sync it again."
        fr: "Recréer la source de données avec le découpage hiérarchique, en utilisant de petits fragments enfants pour la correspondance et de plus grands fragments parents qui couvrent des sections entières, puis la resynchroniser."
    - id: b
      text:
        en: "Re-create the data source with no chunking, so that each contract is stored and retrieved as one chunk that contains every clause and section."
        fr: "Recréer la source de données sans découpage, afin que chaque contrat soit stocké et récupéré comme un seul fragment contenant toutes les clauses et sections."
    - id: c
      text:
        en: "Select a reranker model in the retrieval configuration so that the retrieved results are reordered by their relevance to the query before generation."
        fr: "Sélectionner un modèle de reclassement dans la configuration de récupération afin que les résultats récupérés soient réordonnés selon leur pertinence pour la requête avant la génération."
    - id: d
      text:
        en: "Move the vector store to an Amazon S3 vector bucket and keep hierarchical chunking with parent chunks that cover whole sections."
        fr: "Déplacer le magasin vectoriel vers un compartiment de vecteurs Amazon S3 et conserver le découpage hiérarchique avec des fragments parents couvrant des sections entières."
    - id: e
      text:
        en: "Raise the number of results to 100 so that the most relevant chunks are always among the chunks that are passed to the model."
        fr: "Porter le nombre de résultats à 100 afin que les fragments les plus pertinents figurent toujours parmi ceux transmis au modèle."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Hierarchical chunking retrieves precise child chunks and then replaces them with their broader parent chunks, which gives the model the whole section as context. A reranker model reorders the query results by relevance, so the most relevant clauses reach the top before the model generates the answer."
    fr: "Le découpage hiérarchique récupère des fragments enfants précis puis les remplace par leurs fragments parents plus larges, ce qui donne au modèle toute la section comme contexte. Un modèle de reclassement réordonne les résultats de la requête par pertinence : les clauses les plus pertinentes remontent en tête avant que le modèle ne génère la réponse."
  options:
    b:
      en: "One chunk per long contract dilutes the embeddings and sends whole contracts to the model, and citations can no longer show page numbers."
      fr: "Un fragment par long contrat dilue les vectorisations et envoie des contrats entiers au modèle, et les citations ne peuvent plus indiquer de numéros de page."
    d:
      en: "Hierarchical chunking is not recommended with an S3 vector bucket, and moving the store does nothing for the ranking problem."
      fr: "Le découpage hiérarchique est déconseillé avec un compartiment de vecteurs S3, et changer de magasin ne règle pas le problème de classement."
    e:
      en: "More results add loosely related chunks to the context instead of ranking the relevant ones first, which increases cost and noise."
      fr: "Davantage de résultats ajoutent au contexte des fragments vaguement liés au lieu de classer d'abord les plus pertinents, ce qui augmente le coût et le bruit."
references:
  - title: How content chunking works for knowledge bases
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-chunking.html
  - title: Configure and customize queries and response generation
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
