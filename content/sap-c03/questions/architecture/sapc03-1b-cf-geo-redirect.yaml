id: sapc03-1b-cf-geo-redirect
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A streaming company serves its website through Amazon CloudFront to viewers in 40 countries. Viewers who request the root page must receive an HTTP 302 redirect to a country-specific path, such as /fr/ or /de/, based on the country of their IP address. The redirect must be returned at the edge before the cache lookup, at a peak of 500,000 requests per second. The logic is a few lines of JavaScript with no external calls, and the company wants the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de streaming sert son site web via Amazon CloudFront à des utilisateurs de 40 pays. Les utilisateurs qui demandent la page racine doivent recevoir une redirection HTTP 302 vers un chemin propre à leur pays, comme /fr/ ou /de/, selon le pays de leur adresse IP. La redirection doit être renvoyée en périphérie avant la consultation du cache, avec un pic de 500 000 requêtes par seconde. La logique tient en quelques lignes de JavaScript sans appel externe, et l'entreprise veut le coût le plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add the CloudFront-Viewer-Country header to the origin request policy of the cache behavior, and associate a CloudFront Functions function with the viewer request event that returns the 302 response based on that header."
        fr: "Ajouter l'en-tête CloudFront-Viewer-Country à la politique de requête d'origine du comportement de cache, et associer à l'événement de requête de l'utilisateur une fonction CloudFront Functions qui renvoie la réponse 302 selon cet en-tête."
    - id: b
      text:
        en: "Add the CloudFront-Viewer-Country header to the origin request policy of the cache behavior, and associate a Lambda@Edge function with the viewer request event that returns the 302 response based on that header."
        fr: "Ajouter l'en-tête CloudFront-Viewer-Country à la politique de requête d'origine du comportement de cache, et associer à l'événement de requête de l'utilisateur une fonction Lambda@Edge qui renvoie la réponse 302 selon cet en-tête."
    - id: c
      text:
        en: "Add the CloudFront-Viewer-Country header to the origin request policy of the cache behavior, and associate a Lambda@Edge function with the origin request event that returns the 302 response based on that header."
        fr: "Ajouter l'en-tête CloudFront-Viewer-Country à la politique de requête d'origine du comportement de cache, et associer à l'événement de requête à l'origine une fonction Lambda@Edge qui renvoie la réponse 302 selon cet en-tête."
    - id: d
      text:
        en: "Turn on CloudFront geographic restrictions with an allow list of the 40 countries, and configure a custom error response for each country that redirects viewers to the country path."
        fr: "Activer les restrictions géographiques CloudFront avec une liste d'autorisation des 40 pays, et configurer pour chaque pays une réponse d'erreur personnalisée qui redirige les utilisateurs vers le chemin du pays."
answer: { optionId: a }
explanation:
  correct:
    en: "CloudFront Functions run on viewer requests before the cache lookup, can read geolocation data such as the viewer's country and can return a redirect response directly. They scale to millions of requests per second at a lower cost than Lambda@Edge."
    fr: "CloudFront Functions s'exécute sur les requêtes des utilisateurs avant la consultation du cache, peut lire des données de géolocalisation comme le pays de l'utilisateur et peut renvoyer directement une réponse de redirection. Il monte jusqu'à des millions de requêtes par seconde pour un coût inférieur à Lambda@Edge."
  options:
    b:
      en: "CloudFront headers such as CloudFront-Viewer-Country are not available to Lambda@Edge viewer request functions, and Lambda@Edge scales to about 10,000 requests per second per Region at a higher cost."
      fr: "Les en-têtes CloudFront comme CloudFront-Viewer-Country ne sont pas disponibles pour les fonctions Lambda@Edge de requête de l'utilisateur, et Lambda@Edge monte jusqu'à environ 10 000 requêtes par seconde par Région pour un coût plus élevé."
    c:
      en: "Origin request functions run after the cache lookup and only on cache misses, so a cached root page would be served without the country redirect."
      fr: "Les fonctions de requête à l'origine s'exécutent après la consultation du cache et seulement en cas d'échec de cache : une page racine en cache serait servie sans la redirection par pays."
    d:
      en: "Geographic restrictions only allow or block countries with an HTTP 403 response; they cannot send each country to a different path."
      fr: "Les restrictions géographiques ne font qu'autoriser ou bloquer des pays avec une réponse HTTP 403 : elles ne peuvent pas envoyer chaque pays vers un chemin différent."
references:
  - title: Differences between CloudFront Functions and Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
  - title: Restrictions on Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/lambda-at-edge-function-restrictions.html
