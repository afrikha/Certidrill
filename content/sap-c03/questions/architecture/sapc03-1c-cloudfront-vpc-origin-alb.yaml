id: sapc03-1c-cloudfront-vpc-origin-alb
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company serves a web application through Amazon CloudFront with an AWS WAF web ACL attached to the distribution. The origin is an internet-facing Application Load Balancer. Attackers have discovered the load balancer's DNS name and send requests to it directly, bypassing AWS WAF. The security team requires that the load balancer have no public IP addresses and accept traffic only from the company's own CloudFront distributions. The company wants to avoid maintaining shared secrets or custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sert une application web par Amazon CloudFront, avec une liste ACL web AWS WAF attachée à la distribution. L'origine est un Application Load Balancer exposé à Internet. Des attaquants ont découvert le nom DNS de l'équilibreur de charge et lui envoient directement des requêtes, en contournant AWS WAF. L'équipe de sécurité exige que l'équilibreur n'ait aucune adresse IP publique et n'accepte que le trafic des propres distributions CloudFront de l'entreprise. L'entreprise veut éviter de maintenir des secrets partagés ou du code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Allow only the CloudFront origin-facing managed prefix list in the load balancer's security group, and keep the load balancer internet-facing."
        fr: "N'autoriser dans le groupe de sécurité de l'équilibreur que la liste de préfixes gérée CloudFront orientée origine (origin-facing), et conserver l'équilibreur exposé à Internet."
    - id: b
      text:
        en: "Have CloudFront add a secret custom header to origin requests, and add a listener rule on the load balancer that rejects requests without the header."
        fr: "Faire ajouter par CloudFront un en-tête personnalisé secret aux requêtes vers l'origine, et ajouter sur l'équilibreur une règle d'écouteur qui rejette les requêtes sans cet en-tête."
    - id: c
      text:
        en: "Attach a second AWS WAF web ACL to the load balancer with a geographic match rule that blocks the countries where most of the attacks originate."
        fr: "Attacher à l'équilibreur une seconde liste ACL web AWS WAF avec une règle de correspondance géographique qui bloque les pays d'où proviennent la plupart des attaques."
    - id: d
      text:
        en: "Move the application to an internal load balancer in private subnets, create a CloudFront VPC origin for it, and allow the VPC origins service security group."
        fr: "Déplacer l'application vers un équilibreur de charge interne dans des sous-réseaux privés, créer pour lui une origine VPC CloudFront, et autoriser le groupe de sécurité de service des origines VPC."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      CloudFront VPC origins deliver content from Application Load Balancers in private subnets, so the load balancer needs no public IP address. Allowing the service-managed security group CloudFront-VPCOrigins-Service-SG, once the VPC origin exists, limits inbound traffic to the company's own CloudFront distributions.
    fr: |-
      Les origines VPC CloudFront diffusent le contenu d'Application Load Balancers placés dans des sous-réseaux privés : l'équilibreur n'a besoin d'aucune adresse IP publique. Autoriser le groupe de sécurité géré par le service CloudFront-VPCOrigins-Service-SG, une fois l'origine VPC créée, limite le trafic entrant aux propres distributions CloudFront de l'entreprise.
  options:
    a:
      en: |-
        The prefix list admits traffic from all of CloudFront, including distributions owned by others, and the load balancer keeps its public IP addresses.
      fr: |-
        La liste de préfixes admet le trafic de tout CloudFront, y compris des distributions appartenant à d'autres, et l'équilibreur conserve ses adresses IP publiques.
    b:
      en: |-
        A secret header is a shared secret that must be protected and rotated, and the load balancer remains internet-facing.
      fr: |-
        Un en-tête secret est un secret partagé à protéger et à renouveler, et l'équilibreur reste exposé à Internet.
    c:
      en: |-
        Geographic blocking stops some attacks but leaves the load balancer public and reachable from outside the distribution.
      fr: |-
        Le blocage géographique arrête une partie des attaques mais laisse l'équilibreur public et joignable en dehors de la distribution.
references:
  - title: Restrict access with VPC origins - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html
