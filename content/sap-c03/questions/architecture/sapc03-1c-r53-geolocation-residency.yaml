id: sapc03-1c-r53-geolocation-residency
objective: "1.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company serves app.example.com from eu-west-1, us-east-1 and ap-southeast-1. Data residency rules require that users located in Europe be served only from eu-west-1, even when that Region is unavailable. The rules also require that eu-west-1 serve only users located in Europe. All users outside Europe must be routed to whichever of us-east-1 and ap-southeast-1 gives them the lowest latency.

    Which combination of Route 53 records will meet these requirements? (Choose two.)
  fr: |
    Une entreprise sert app.example.com depuis eu-west-1, us-east-1 et ap-southeast-1. Des règles de résidence des données exigent que les utilisateurs situés en Europe ne soient servis que depuis eu-west-1, même lorsque cette Région est indisponible. Elles exigent aussi que eu-west-1 ne serve que des utilisateurs situés en Europe. Tous les utilisateurs hors d'Europe doivent être routés vers celle des Régions us-east-1 et ap-southeast-1 qui leur offre la latence la plus faible.

    Quelle combinaison d'enregistrements Route 53 répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Latency records for app.example.com in all three Regions, with health checks so that unhealthy Regions are skipped."
        fr: "Des enregistrements de latence pour app.example.com dans les trois Régions, avec des vérifications de l'état pour ignorer les Régions défaillantes."
    - id: b
      text:
        en: "A geolocation record for app.example.com with the location Europe that is an alias to the load balancer in eu-west-1, with no health check and Evaluate Target Health set to No."
        fr: "Un enregistrement de géolocalisation pour app.example.com avec l'emplacement Europe, alias vers l'équilibreur de charge de eu-west-1, sans vérification de l'état et avec Evaluate Target Health défini sur No."
    - id: c
      text:
        en: "A geoproximity record for app.example.com with a positive bias on eu-west-1 that is large enough to cover Europe."
        fr: "Un enregistrement de géoproximité pour app.example.com avec un biais positif sur eu-west-1 suffisamment grand pour couvrir l'Europe."
    - id: d
      text:
        en: "A geolocation record for app.example.com with the default location that is an alias to latency records for us-east-1 and ap-southeast-1."
        fr: "Un enregistrement de géolocalisation pour app.example.com avec l'emplacement par défaut, alias vers des enregistrements de latence pour us-east-1 et ap-southeast-1."
    - id: e
      text:
        en: "A geolocation record for app.example.com with the location Europe whose health check fails over to the us-east-1 load balancer when eu-west-1 is unhealthy."
        fr: "Un enregistrement de géolocalisation pour app.example.com avec l'emplacement Europe dont la vérification de l'état bascule vers l'équilibreur de us-east-1 lorsque eu-west-1 est défaillant."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      Geolocation routing answers based on where users are located: the Europe record sends European users only to eu-west-1, and the default record covers every other location. When a geolocation record is unhealthy, Route 53 falls back to the record for a larger area and finally to the default record; without health evaluation on the Europe record, European queries are never answered from another Region. Making the default record an alias to latency records for the other two Regions gives non-European users the lowest-latency Region among them.
    fr: |-
      Le routage par géolocalisation répond en fonction de l'emplacement des utilisateurs : l'enregistrement Europe n'envoie les utilisateurs européens que vers eu-west-1, et l'enregistrement par défaut couvre tous les autres emplacements. Lorsqu'un enregistrement de géolocalisation est défaillant, Route 53 se replie sur l'enregistrement d'une zone plus large, puis sur l'enregistrement par défaut ; sans évaluation de l'état sur l'enregistrement Europe, les requêtes européennes ne reçoivent jamais de réponse d'une autre Région. Faire de l'enregistrement par défaut un alias vers des enregistrements de latence pour les deux autres Régions donne aux utilisateurs non européens la Région de plus faible latence parmi elles.
  options:
    a:
      en: |-
        Latency routing would send some European users to other Regions and some non-European users to eu-west-1.
      fr: |-
        Le routage par latence enverrait certains utilisateurs européens vers d'autres Régions et certains utilisateurs non européens vers eu-west-1.
    c:
      en: |-
        Geoproximity boundaries depend on distance and bias, not on borders, so they do not match Europe exactly.
      fr: |-
        Les frontières de géoproximité dépendent de la distance et du biais, pas des frontières politiques : elles ne correspondent pas exactement à l'Europe.
    e:
      en: |-
        Failing European users over to us-east-1 violates the residency rule; an unhealthy Europe record would also let Route 53 answer with the default record.
      fr: |-
        Faire basculer les utilisateurs européens vers us-east-1 viole la règle de résidence ; un enregistrement Europe défaillant permettrait aussi à Route 53 de répondre avec l'enregistrement par défaut.
references:
  - title: Choosing a routing policy - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
  - title: Values specific for geolocation records - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-values-geo.html
