id: sapc03-1a-eks-cluster-autoscaler
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs microservices on an Amazon EKS cluster that uses managed node groups. Horizontal Pod Autoscalers scale the deployments based on CPU utilization, and the Kubernetes Metrics Server is installed. During traffic peaks, the new pods stay in the Pending state because the nodes are full, and the Auto Scaling groups of the node groups never change size. The company wants nodes to be added automatically when pods cannot be scheduled and removed when they are underutilized. The company wants to keep the managed node groups and make the fewest changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des microservices sur un cluster Amazon EKS qui utilise des groupes de nœuds gérés. Des Horizontal Pod Autoscalers mettent les déploiements à l'échelle en fonction de l'utilisation du processeur, et le Kubernetes Metrics Server est installé. Pendant les pointes de trafic, les nouveaux pods restent à l'état Pending, car les nœuds sont pleins, et les groupes Auto Scaling des groupes de nœuds ne changent jamais de taille. L'entreprise veut que des nœuds soient ajoutés automatiquement quand des pods ne peuvent pas être planifiés, et supprimés quand ils sont sous-utilisés. Elle veut conserver les groupes de nœuds gérés et apporter le moins de modifications possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Deploy the Cluster Autoscaler with a version that matches the cluster, configure auto-discovery of the node groups' Auto Scaling groups by tags, and scope its IAM permissions to those tagged groups.
        fr: |-
          Déployer Cluster Autoscaler dans une version correspondant à celle du cluster, configurer la découverte automatique des groupes Auto Scaling des groupes de nœuds par balises et limiter ses autorisations IAM à ces groupes balisés.
    - id: b
      text:
        en: |-
          Add a target tracking scaling policy on average CPU utilization to the Auto Scaling group of each managed node group so that nodes are added when the existing nodes are busy.
        fr: |-
          Ajouter au groupe Auto Scaling de chaque groupe de nœuds gérés une stratégie de mise à l'échelle de suivi de la cible sur l'utilisation moyenne du processeur, pour ajouter des nœuds quand les nœuds existants sont occupés.
    - id: c
      text:
        en: |-
          Deploy the Vertical Pod Autoscaler in Auto mode so that it lowers the CPU and memory requests of the pods until the Pending pods fit on the existing nodes.
        fr: |-
          Déployer le Vertical Pod Autoscaler en mode Auto pour qu'il réduise les demandes de processeur et de mémoire des pods jusqu'à ce que les pods en attente tiennent sur les nœuds existants.
    - id: d
      text:
        en: |-
          Increase the maximum number of replicas of each Horizontal Pod Autoscaler and lower its target CPU utilization so that the pods are added earlier during the traffic peaks.
        fr: |-
          Augmenter le nombre maximal de réplicas de chaque Horizontal Pod Autoscaler et abaisser son utilisation cible du processeur pour que les pods soient ajoutés plus tôt pendant les pointes de trafic.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The HPA scales pods, not nodes. The Cluster Autoscaler watches for pods that fail to schedule and for underutilized nodes, simulates the change, and sets the desired capacity of the Auto Scaling groups; with managed node groups it discovers the groups automatically by tags. Its version should match the cluster version, and its IAM permissions can be limited to the cluster's tagged groups.
    fr: |-
      L'HPA met à l'échelle les pods, pas les nœuds. Cluster Autoscaler surveille les pods qui ne peuvent pas être planifiés et les nœuds sous-utilisés, simule la modification et définit la capacité souhaitée des groupes Auto Scaling ; avec des groupes de nœuds gérés, il découvre automatiquement les groupes par balises. Sa version doit correspondre à celle du cluster, et ses autorisations IAM peuvent être limitées aux groupes balisés du cluster.
  options:
    b:
      en: |-
        Node CPU utilization does not reflect pods that are Pending because their resource requests do not fit, so the groups may not scale out when pods cannot be scheduled.
      fr: |-
        L'utilisation du processeur des nœuds ne reflète pas les pods en attente parce que leurs demandes de ressources ne tiennent pas : les groupes peuvent ne pas s'agrandir quand des pods ne peuvent pas être planifiés.
    c:
      en: |-
        The Vertical Pod Autoscaler changes the size of pods; it never adds or removes nodes, so a cluster that is full stays full.
      fr: |-
        Le Vertical Pod Autoscaler modifie la taille des pods ; il n'ajoute ni ne supprime jamais de nœuds : un cluster plein reste plein.
    d:
      en: |-
        More aggressive pod scaling creates more Pending pods when no node capacity is added, which makes the problem worse.
      fr: |-
        Une mise à l'échelle plus agressive des pods crée davantage de pods en attente quand aucune capacité de nœud n'est ajoutée, ce qui aggrave le problème.
references:
  - title: Cluster Autoscaler - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/best-practices/cas.html
  - title: Scale pod deployments with Horizontal Pod Autoscaler - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/horizontal-pod-autoscaler.html
