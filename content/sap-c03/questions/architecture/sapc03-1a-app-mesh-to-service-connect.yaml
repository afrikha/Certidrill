id: sapc03-1a-app-mesh-to-service-connect
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is rebuilding an application of 60 microservices that used AWS App Mesh until App Mesh reached its end of support on September 30, 2026. All the microservices run as Amazon ECS services on AWS Fargate in one AWS Region, split between two accounts. The services must call each other by short names, and a proxy next to each task must handle load balancing and outlier detection. Traffic between services must be encrypted with certificates that rotate automatically, and the team wants per-service connection metrics in Amazon CloudWatch. Only ECS services take part in this traffic. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise reconstruit une application de 60 microservices qui utilisait AWS App Mesh jusqu'à la fin du support d'App Mesh le 30 septembre 2026. Tous les microservices s'exécutent sous forme de services Amazon ECS sur AWS Fargate dans une seule Région AWS, répartis entre deux comptes. Les services doivent s'appeler par des noms courts, et un proxy placé à côté de chaque tâche doit gérer l'équilibrage de charge et la détection des valeurs aberrantes (outlier detection). Le trafic entre les services doit être chiffré avec des certificats renouvelés automatiquement, et l'équipe veut des métriques de connexion par service dans Amazon CloudWatch. Seuls des services ECS participent à ce trafic. L'entreprise veut la solution la PLUS rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Re-create the mesh in AWS App Mesh with virtual services and virtual nodes for the 60 microservices, and keep the Envoy sidecar containers in the task definitions.
        fr: |-
          Recréer le maillage dans AWS App Mesh avec des services virtuels et des nœuds virtuels pour les 60 microservices, et conserver les conteneurs annexes Envoy dans les définitions de tâche.
    - id: b
      text:
        en: |-
          Configure Amazon ECS Service Connect with an AWS Cloud Map namespace that is shared with the second account through AWS RAM, and turn on Service Connect TLS with AWS Private CA.
        fr: |-
          Configurer Amazon ECS Service Connect avec un espace de noms AWS Cloud Map partagé avec le second compte au moyen d'AWS RAM, et activer le TLS de Service Connect avec AWS Private CA.
    - id: c
      text:
        en: |-
          Create an Amazon VPC Lattice service network that is shared with the second account, register each ECS service as a Lattice service with an HTTPS listener, and enable the service network access logs.
        fr: |-
          Créer un réseau de service Amazon VPC Lattice partagé avec le second compte, enregistrer chaque service ECS comme service Lattice avec un écouteur HTTPS et activer les journaux d'accès du réseau de service.
    - id: d
      text:
        en: |-
          Migrate the microservices to an Amazon EKS cluster in each account, and install a self-managed Istio service mesh with mutual TLS and Prometheus metrics.
        fr: |-
          Migrer les microservices vers un cluster Amazon EKS dans chaque compte, et installer un maillage de services Istio autogéré avec le TLS mutuel et des métriques Prometheus.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Service Connect adds a proxy to each task that resolves short names, load balances with outlier detection, and reports connection metrics to the ECS and CloudWatch consoles; its traffic can be encrypted with AWS Private CA certificates that rotate automatically. Namespaces can be shared through AWS RAM so that services span both accounts, and Service Connect has no additional charge beyond the vCPU and memory that the proxy uses.
    fr: |-
      Service Connect ajoute à chaque tâche un proxy qui résout les noms courts, équilibre la charge avec détection des valeurs aberrantes et envoie des métriques de connexion aux consoles ECS et CloudWatch ; son trafic peut être chiffré avec des certificats AWS Private CA renouvelés automatiquement. Les espaces de noms peuvent être partagés au moyen d'AWS RAM pour que les services couvrent les deux comptes, et Service Connect n'entraîne aucun coût supplémentaire au-delà du processeur et de la mémoire utilisés par le proxy.
  options:
    a:
      en: |-
        App Mesh support was discontinued on September 30, 2026, and its console and resources are no longer accessible, so the mesh cannot be re-created.
      fr: |-
        Le support d'App Mesh a pris fin le 30 septembre 2026, et sa console et ses ressources ne sont plus accessibles : le maillage ne peut pas être recréé.
    c:
      en: |-
        VPC Lattice would connect the services, but it is a managed network service rather than a proxy next to each task, and it charges per service-hour, per GB processed, and per request for 60 services, which costs more than Service Connect for ECS-only traffic.
      fr: |-
        VPC Lattice relierait les services, mais c'est un service réseau géré et non un proxy placé à côté de chaque tâche, et il facture à l'heure de service, au Go traité et à la requête pour 60 services, ce qui coûte plus cher que Service Connect pour un trafic uniquement entre services ECS.
    d:
      en: |-
        Moving to EKS and operating Istio adds clusters, a mesh control plane, and a migration, which is neither cost-effective nor necessary for ECS services.
      fr: |-
        Passer à EKS et exploiter Istio ajoute des clusters, un plan de contrôle de maillage et une migration, ce qui n'est ni rentable ni nécessaire pour des services ECS.
references:
