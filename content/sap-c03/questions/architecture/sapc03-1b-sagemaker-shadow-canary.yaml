id: sapc03-1b-sagemaker-shadow-canary
objective: "1.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A payments company serves a fraud detection model from a single-model SageMaker AI real-time endpoint. The data science team has a new model version that also runs on a new instance type. Before any customer is affected, the company must measure the latency and error rate of the new version on live production requests, while callers keep receiving only the current model's responses. After that validation, the company must shift 10% of the traffic to the new version first and roll back automatically if a CloudWatch alarm on errors or latency fires during a baking period.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de paiement sert un modèle de détection de fraude depuis un point de terminaison en temps réel SageMaker AI à modèle unique. L'équipe de science des données dispose d'une nouvelle version du modèle qui s'exécute aussi sur un nouveau type d'instance. Avant qu'aucun client ne soit affecté, l'entreprise doit mesurer la latence et le taux d'erreurs de la nouvelle version sur des requêtes de production réelles, tandis que les appelants continuent de ne recevoir que les réponses du modèle actuel. Après cette validation, l'entreprise doit d'abord transférer 10 % du trafic vers la nouvelle version et revenir automatiquement en arrière si une alarme CloudWatch sur les erreurs ou la latence se déclenche pendant une période d'observation (baking period).

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Run a SageMaker AI shadow test that deploys the new version as a shadow variant on the endpoint, which receives a copy of the inference requests."
        fr: "Exécuter un test fantôme (shadow test) SageMaker AI qui déploie la nouvelle version comme variante fantôme sur le point de terminaison, laquelle reçoit une copie des requêtes d'inférence."
    - id: b
      text:
        en: "Add the new version as a second production variant with a weight of 10%, and compare the variants' CloudWatch metrics before increasing the weight by hand."
        fr: "Ajouter la nouvelle version comme seconde variante de production avec une pondération de 10 %, et comparer les métriques CloudWatch des variantes avant d'augmenter la pondération manuellement."
    - id: c
      text:
        en: "Update the endpoint with a blue/green deployment that uses canary traffic shifting of 10%, a baking period and auto-rollback alarms in the deployment configuration."
        fr: "Mettre à jour le point de terminaison avec un déploiement bleu/vert qui utilise un transfert de trafic canary de 10 %, une période d'observation et des alarmes de restauration automatique dans la configuration de déploiement."
    - id: d
      text:
        en: "Convert the endpoint to a multi-model endpoint that hosts both versions, and route 10% of the requests to the new version with the TargetModel parameter."
        fr: "Convertir le point de terminaison en point de terminaison multimodèle qui héberge les deux versions, et envoyer 10 % des requêtes vers la nouvelle version avec le paramètre TargetModel."
    - id: e
      text:
        en: "Run a batch transform job of the new version on last week's captured requests, and compare its predictions with the logged responses of the current model."
        fr: "Exécuter une tâche de transformation par lots de la nouvelle version sur les requêtes capturées la semaine précédente, et comparer ses prédictions avec les réponses journalisées du modèle actuel."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A shadow test sends a copy of live requests to a shadow variant on the same endpoint and returns only the production variant's responses, so the new model, container and instance type are validated with no user impact. Deployment guardrails then perform a blue/green update with canary traffic shifting: a small share of traffic goes to the new fleet for a baking period, and CloudWatch alarms trigger an automatic rollback."
    fr: "Un test fantôme envoie une copie des requêtes réelles à une variante fantôme sur le même point de terminaison et ne renvoie que les réponses de la variante de production : le nouveau modèle, le conteneur et le type d'instance sont validés sans impact sur les utilisateurs. Les garde-fous de déploiement (deployment guardrails) effectuent ensuite une mise à jour bleu/vert avec transfert de trafic canary : une petite part du trafic va vers le nouveau parc pendant une période d'observation, et des alarmes CloudWatch déclenchent une restauration automatique."
  options:
    b:
      en: "A 10% production variant returns its responses to callers before any validation, and weight changes by hand give no automatic rollback."
      fr: "Une variante de production à 10 % renvoie ses réponses aux appelants avant toute validation, et des changements manuels de pondération n'offrent aucune restauration automatique."
    d:
      en: "Multi-model endpoints share one container and instance type, do not support shadow tests, and leave traffic splitting and rollback to the caller."
      fr: "Les points de terminaison multimodèles partagent un seul conteneur et un seul type d'instance, ne prennent pas en charge les tests fantômes et laissent la répartition du trafic et la restauration à l'appelant."
    e:
      en: "An offline replay does not measure the latency and errors of the new instance type on live production traffic."
      fr: "Une relecture hors ligne ne mesure pas la latence et les erreurs du nouveau type d'instance sur le trafic de production réel."
references:
  - title: Shadow tests
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/shadow-tests.html
  - title: Deployment guardrails for updating models in production
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/deployment-guardrails.html
