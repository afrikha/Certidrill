id: sapc03-1b-tenant-cognito-claim
objective: "1.1.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company uses one Amazon Cognito user pool for the users of its 40,000 tenant organizations. The backend reads the tenant of each request from a claim in the Cognito ID token. The tenant value must therefore be present in every token, be set only by the company's onboarding service, and be impossible for users to change, including through the UpdateUserAttributes API. The company wants to avoid an extra lookup in a database for each request and to keep operational overhead low.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS utilise un seul groupe d'utilisateurs Amazon Cognito pour les utilisateurs de ses 40 000 organisations locataires. Le backend lit le locataire de chaque requête dans une revendication du jeton d'ID Cognito. La valeur du locataire doit donc figurer dans chaque jeton, n'être définie que par le service d'intégration de l'entreprise et ne pouvoir être modifiée par aucun utilisateur, y compris via l'API UpdateUserAttributes. L'entreprise veut éviter une recherche supplémentaire en base de données pour chaque requête et limiter la charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a custom:tenant_id attribute, have the onboarding service set it with AdminCreateUser, and remove write permission for the attribute from every app client while keeping read permission."
        fr: "Ajouter un attribut custom:tenant_id, le faire définir par le service d'intégration avec AdminCreateUser, et retirer l'autorisation d'écriture de l'attribut à chaque client d'application tout en conservant l'autorisation de lecture."
    - id: b
      text:
        en: "Add a custom:tenant_id attribute with the default attribute permissions of the app clients, and have the backend check that the claim matches the email domain of the user."
        fr: "Ajouter un attribut custom:tenant_id avec les autorisations d'attributs par défaut des clients d'application, et faire vérifier par le backend que la revendication correspond au domaine de l'e-mail de l'utilisateur."
    - id: c
      text:
        en: "Create one Cognito user pool for each tenant organization, and identify the tenant of each request from the issuer of the token that the backend receives."
        fr: "Créer un groupe d'utilisateurs Cognito par organisation locataire, et identifier le locataire de chaque requête à partir de l'émetteur du jeton que reçoit le backend."
    - id: d
      text:
        en: "Store the mapping between users and tenants in an Amazon DynamoDB table, and have a Lambda authorizer look up the tenant of the user for each request."
        fr: "Stocker la correspondance entre utilisateurs et locataires dans une table Amazon DynamoDB, et faire rechercher par un mécanisme d'autorisation Lambda le locataire de l'utilisateur pour chaque requête."
answer: { optionId: a }
explanation:
  correct:
    en: "Custom attributes appear in the ID token, and app client read and write permissions control who can change them. Removing write permission from every app client makes the attribute read-only in the apps, so UpdateUserAttributes fails with NotAuthorizedException, while the onboarding service sets the value with administrator APIs and AWS credentials."
    fr: "Les attributs personnalisés figurent dans le jeton d'ID, et les autorisations de lecture et d'écriture des clients d'application déterminent qui peut les modifier. Retirer l'autorisation d'écriture à chaque client d'application rend l'attribut en lecture seule dans les applications : UpdateUserAttributes échoue avec NotAuthorizedException, tandis que le service d'intégration définit la valeur avec les API d'administration et des informations d'identification AWS."
  options:
    b:
      en: "When an app client has no WriteAttributes setting, it can write every standard and custom attribute, so users could change their own tenant_id; an email domain does not identify a tenant reliably."
      fr: "Quand un client d'application n'a pas de paramètre WriteAttributes, il peut écrire tous les attributs standard et personnalisés : les utilisateurs pourraient modifier leur propre tenant_id, et un domaine d'e-mail n'identifie pas un locataire de façon fiable."
    c:
      en: "40,000 user pools exceed the Cognito quota of user pools per Region, whose maximum is 10,000, and multiply the configuration to manage."
      fr: "40 000 groupes d'utilisateurs dépassent le quota Cognito de groupes d'utilisateurs par Région, dont le maximum est 10 000, et multiplient la configuration à gérer."
    d:
      en: "The tenant is not in the token, and the lookup for each request is exactly the extra database access that the company wants to avoid."
      fr: "Le locataire n'est pas dans le jeton, et la recherche à chaque requête est justement l'accès supplémentaire à la base de données que l'entreprise veut éviter."
references:
  - title: Working with user attributes
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/user-pool-settings-attributes.html
  - title: Quotas in Amazon Cognito
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/quotas.html
