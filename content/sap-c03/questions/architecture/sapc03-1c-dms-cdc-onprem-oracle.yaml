id: sapc03-1c-dms-cdc-onprem-oracle
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs its order management system on an Oracle database in its on-premises data center, which connects to AWS through AWS Direct Connect. The Oracle database must remain the system of record for the next 18 months while the application is rewritten. A new analytics platform in AWS needs a copy of the order data in Amazon Aurora PostgreSQL that stays close to the source, within minutes rather than hours. The company cannot change the order management application, and the database team has no experience running replication software. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une enseigne de distribution exécute son système de gestion des commandes sur une base de données Oracle dans son centre de données sur site, relié à AWS par AWS Direct Connect. La base Oracle doit rester le système de référence pendant les 18 prochains mois, le temps de réécrire l'application. Une nouvelle plateforme d'analytique dans AWS a besoin d'une copie des données de commandes dans Amazon Aurora PostgreSQL qui reste proche de la source, à quelques minutes plutôt qu'à quelques heures. L'entreprise ne peut pas modifier l'application de gestion des commandes, et l'équipe de bases de données n'a aucune expérience de l'exploitation de logiciels de réplication. L'entreprise veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Export the Oracle schemas every night with Oracle Data Pump, copy the dump files to Amazon S3 with AWS DataSync, and load them into Aurora PostgreSQL with an AWS Lambda function."
        fr: "Exporter chaque nuit les schémas Oracle avec Oracle Data Pump, copier les fichiers de vidage vers Amazon S3 avec AWS DataSync, et les charger dans Aurora PostgreSQL avec une fonction AWS Lambda."
    - id: b
      text:
        en: "Convert the schema with the AWS Schema Conversion Tool (AWS SCT), then run an AWS DMS task of type full load and CDC from the Oracle database to Aurora PostgreSQL over Direct Connect."
        fr: "Convertir le schéma avec l'AWS Schema Conversion Tool (AWS SCT), puis exécuter une tâche AWS DMS de type chargement complet et CDC de la base Oracle vers Aurora PostgreSQL via Direct Connect."
    - id: c
      text:
        en: "Store the Oracle data files on an AWS Storage Gateway Volume Gateway with stored volumes, and restore the volume snapshots in AWS every hour for the analytics platform."
        fr: "Stocker les fichiers de données Oracle sur une AWS Storage Gateway Volume Gateway à volumes stockés, et restaurer chaque heure les instantanés des volumes dans AWS pour la plateforme d'analytique."
    - id: d
      text:
        en: "Create an Oracle standby database on Amazon EC2 with Oracle Data Guard over Direct Connect, and point the analytics platform at the standby database instead of Aurora."
        fr: "Créer une base de données Oracle de secours sur Amazon EC2 avec Oracle Data Guard via Direct Connect, et faire pointer la plateforme d'analytique vers cette base de secours au lieu d'Aurora."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A full load and CDC task copies the existing data and then applies the ongoing changes captured from the Oracle logs, while the source keeps serving the application. Because Oracle and PostgreSQL are different engines, the schema is converted first with AWS SCT. DMS is a managed replication service; its CDC has no latency SLA, but it keeps the target close to the source, unlike a batch copy.
    fr: |-
      Une tâche de chargement complet et CDC copie les données existantes puis applique les modifications continues capturées dans les journaux Oracle, pendant que la source continue de servir l'application. Oracle et PostgreSQL étant des moteurs différents, le schéma est d'abord converti avec AWS SCT. DMS est un service de réplication géré ; sa CDC n'a pas de SLA de latence, mais elle garde la cible proche de la source, contrairement à une copie par lots.
  options:
    a:
      en: |-
        A nightly export lags the source by up to a day, and the Lambda loader is custom code to maintain.
      fr: |-
        Un export nocturne laisse la cible jusqu'à un jour en retard sur la source, et le chargeur Lambda est du code personnalisé à maintenir.
    c:
      en: |-
        Volume Gateway snapshots are block-level copies of the Oracle data files; they do not produce an Aurora PostgreSQL database, and hourly restores lag by hours.
      fr: |-
        Les instantanés Volume Gateway sont des copies en mode bloc des fichiers de données Oracle ; ils ne produisent pas de base Aurora PostgreSQL, et des restaurations horaires accusent des heures de retard.
    d:
      en: |-
        Data Guard maintains an Oracle standby, not the Aurora PostgreSQL copy that the platform needs, and the team would have to operate Oracle replication on EC2.
      fr: |-
        Data Guard maintient une base Oracle de secours, pas la copie Aurora PostgreSQL dont la plateforme a besoin, et l'équipe devrait exploiter la réplication Oracle sur EC2.
references:
  - title: Creating tasks for ongoing replication using AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html
