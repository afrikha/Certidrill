id: sapc03-1a-cross-region-bus-setup
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has two accounts in the same organization in AWS Organizations. An application in account 111122223333 publishes events to a custom Amazon EventBridge event bus in eu-west-1. A reporting team in account 444455556666 wants a subset of these events delivered to its own custom event bus in eu-central-1, where its rules already route events to its targets. The company must use EventBridge to route the events and wants the fewest components. Both Regions support cross-Region event bus targets.

    Which combination of steps must the company take so that the events are delivered to the reporting team's event bus? (Choose two.)
  fr: |
    Une entreprise dispose de deux comptes dans la même organisation AWS Organizations. Une application du compte 111122223333 publie des événements sur un bus d'événements personnalisé Amazon EventBridge dans eu-west-1. Une équipe de reporting du compte 444455556666 veut qu'une partie de ces événements soit livrée à son propre bus d'événements personnalisé dans eu-central-1, où ses règles acheminent déjà les événements vers ses cibles. L'entreprise doit utiliser EventBridge pour acheminer les événements et veut le moins de composants possible. Les deux Régions prennent en charge les cibles de bus d'événements entre Régions.

    Quelle combinaison d'étapes l'entreprise doit-elle effectuer pour que les événements soient livrés au bus d'événements de l'équipe de reporting ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Add a statement to the resource-based policy of the bus in eu-central-1 that allows events:PutEvents from account 111122223333.
        fr: |-
          Ajouter à la politique basée sur les ressources du bus d'eu-central-1 une instruction qui autorise events:PutEvents depuis le compte 111122223333.
    - id: b
      text:
        en: |-
          Connect the VPCs of the two accounts with a transit gateway peering attachment between eu-west-1 and eu-central-1.
        fr: |-
          Relier les VPC des deux comptes au moyen d'une pièce jointe de peering de passerelle de transit entre eu-west-1 et eu-central-1.
    - id: c
      text:
        en: |-
          Create a rule on the bus in eu-west-1 that matches the subset of events and targets the ARN of the bus in eu-central-1, with an IAM role that allows events:PutEvents on that bus.
        fr: |-
          Créer sur le bus d'eu-west-1 une règle qui correspond à la partie des événements et cible l'ARN du bus d'eu-central-1, avec un rôle IAM qui autorise events:PutEvents sur ce bus.
    - id: d
      text:
        en: |-
          Create an archive on the bus in eu-west-1 and start a replay of the archived events to the bus in eu-central-1 every hour.
        fr: |-
          Créer une archive sur le bus d'eu-west-1 et démarrer toutes les heures une relecture (replay) des événements archivés vers le bus d'eu-central-1.
    - id: e
      text:
        en: |-
          Create an interface VPC endpoint for EventBridge in eu-central-1 in account 111122223333 so that the rule can reach the bus in the other Region.
        fr: |-
          Créer dans le compte 111122223333 un point de terminaison de VPC d'interface pour EventBridge dans eu-central-1, afin que la règle puisse atteindre le bus de l'autre Région.
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Bus-to-bus delivery across accounts and Regions needs two things: the receiving bus must allow the sender in its resource-based policy, and the sending account needs a rule whose target is the ARN of the receiving bus. EventBridge requires an IAM role for cross-account event bus targets created after March 2, 2023, and the role also lets the SCPs apply to the delivery.
    fr: |-
      La livraison de bus à bus entre comptes et entre Régions exige deux éléments : le bus récepteur doit autoriser l'expéditeur dans sa politique basée sur les ressources, et le compte expéditeur a besoin d'une règle dont la cible est l'ARN du bus récepteur. EventBridge exige un rôle IAM pour les cibles de bus d'événements entre comptes créées après le 2 mars 2023, et ce rôle permet aussi aux SCP de s'appliquer à la livraison.
  options:
    b:
      en: |-
        EventBridge delivers events between buses as a managed service; no network connectivity between VPCs is involved.
      fr: |-
        EventBridge livre les événements entre bus en tant que service géré ; aucune connectivité réseau entre VPC n'intervient.
    d:
      en: |-
        Archive and replay re-send past events for recovery or testing; they are not a routing mechanism and would deliver events up to an hour late.
      fr: |-
        L'archivage et la relecture renvoient des événements passés pour la reprise ou les tests ; ce n'est pas un mécanisme d'acheminement, et les événements seraient livrés jusqu'à une heure en retard.
    e:
      en: |-
        The rule is evaluated by the EventBridge service, not from a VPC, so an interface endpoint is not needed for cross-Region delivery.
      fr: |-
        La règle est évaluée par le service EventBridge, et non depuis un VPC : un point de terminaison d'interface n'est pas nécessaire à la livraison entre Régions.
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
  - title: Sending and receiving events between AWS Regions in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-region.html
