id: sapc03-1b-bedrock-org-guardrail
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance group has 60 member accounts in AWS Organizations, and product teams in many of them call Amazon Bedrock models directly from their own applications in the eu-central-1 Region. The responsible AI board has approved one guardrail that filters harmful content and personal data. The board requires this guardrail to apply to every model inference call in every member account, including accounts created in the future. Teams must not be able to modify or bypass the guardrail. The central security team cannot change application code, and it wants the least operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un groupe d'assurance compte 60 comptes membres dans AWS Organizations, et des équipes produit de nombreux comptes appellent directement des modèles Amazon Bedrock depuis leurs applications dans la Région eu-central-1. Le comité d'IA responsable a approuvé une barrière de protection (guardrail) qui filtre les contenus préjudiciables et les données personnelles. Le comité exige que cette barrière de protection s'applique à chaque appel d'inférence de modèle dans chaque compte membre, y compris les comptes créés à l'avenir. Les équipes ne doivent pas pouvoir modifier ou contourner la barrière de protection. L'équipe de sécurité centrale ne peut pas modifier le code des applications, et elle veut le moins de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an SCP to the organization root that denies the Bedrock invocation actions when the bedrock:GuardrailIdentifier condition key is not equal to the ARN and version of the approved guardrail."
        fr: "Attacher à la racine de l'organisation une SCP qui refuse les actions d'invocation Bedrock quand la clé de condition bedrock:GuardrailIdentifier n'est pas égale à l'ARN et à la version de la barrière de protection approuvée."
    - id: b
      text:
        en: "Deploy the guardrail to every member account with CloudFormation StackSets and automatic deployment to new accounts, and configure account-level enforcement in each account with PutEnforcedGuardrailConfiguration."
        fr: "Déployer la barrière de protection dans chaque compte membre avec CloudFormation StackSets et le déploiement automatique vers les nouveaux comptes, et configurer l'application au niveau du compte dans chaque compte avec PutEnforcedGuardrailConfiguration."
    - id: c
      text:
        en: "Create an AWS Config organization rule backed by a Lambda function that reads CloudTrail events and flags each Bedrock inference call that did not include the approved guardrail."
        fr: "Créer une règle d'organisation AWS Config adossée à une fonction Lambda qui lit les événements CloudTrail et signale chaque appel d'inférence Bedrock qui n'incluait pas la barrière de protection approuvée."
    - id: d
      text:
        en: "Create a numeric version of the guardrail in the management account, grant bedrock:ApplyGuardrail to the organization in its resource-based policy, and attach a Bedrock policy that references the version to the root."
        fr: "Créer une version numérique de la barrière de protection dans le compte de gestion, accorder bedrock:ApplyGuardrail à l'organisation dans sa politique basée sur les ressources, et attacher à la racine une politique Bedrock qui référence cette version."
answer: { optionId: d }
explanation:
  correct:
    en: "After the Bedrock policy type is enabled, Amazon Bedrock policies in AWS Organizations enforce a guardrail of the management account on all model inference calls of the accounts under the node where they are attached, so new accounts under the root inherit it without code changes. A numeric version keeps the configuration immutable for member accounts, and the resource-based policy must grant bedrock:ApplyGuardrail to the members. Enforced guardrails combine with any guardrail in the request, the most restrictive control winning."
    fr: "Une fois le type de politique Bedrock activé, les politiques Amazon Bedrock d'AWS Organizations appliquent une barrière de protection du compte de gestion à tous les appels d'inférence de modèles des comptes situés sous le nœud où elles sont attachées : les nouveaux comptes sous la racine en héritent sans modification de code. Une version numérique rend la configuration immuable pour les comptes membres, et la politique basée sur les ressources doit accorder bedrock:ApplyGuardrail aux membres. Les barrières imposées se combinent avec celle de la requête, le contrôle le plus restrictif l'emportant."
  options:
    a:
      en: "The condition key only checks the guardrail named in each request, so every application would have to change its code to pass the guardrail, and calls without it would simply fail."
      fr: "La clé de condition ne vérifie que la barrière de protection indiquée dans chaque requête : chaque application devrait modifier son code pour la transmettre, et les appels sans elle échoueraient simplement."
    b:
      en: "Account-level enforcement is set by the administrators of each account, who could change or remove it, and it must be maintained in every account and Region, which is more overhead than one organization policy."
      fr: "L'application au niveau du compte est définie par les administrateurs de chaque compte, qui pourraient la modifier ou la supprimer, et elle doit être maintenue dans chaque compte et chaque Région, ce qui demande plus d'effort qu'une seule politique d'organisation."
    c:
      en: "A Config rule only detects calls after they happen; it does not apply the guardrail to the prompts and responses."
      fr: "Une règle Config ne fait que détecter les appels après coup : elle n'applique pas la barrière de protection aux invites et aux réponses."
references:
  - title: Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
  - title: Amazon Bedrock policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_bedrock.html
