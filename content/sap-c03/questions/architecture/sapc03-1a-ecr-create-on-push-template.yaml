id: sapc03-1a-ecr-create-on-push-template
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Development teams at a company frequently push images to new Amazon ECR repository names. Today, the platform team creates each repository by hand before the first push, which slows the teams down. The company wants every new repository to be created automatically when an image is pushed to a name that does not exist yet. Each new repository must have tag immutability enabled, encryption with a customer managed AWS KMS key, and the company's standard lifecycle policy. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Les équipes de développement d'une entreprise envoient fréquemment des images vers de nouveaux noms de référentiel Amazon ECR. Aujourd'hui, l'équipe plateforme crée chaque référentiel à la main avant le premier envoi, ce qui ralentit les équipes. L'entreprise veut que chaque nouveau référentiel soit créé automatiquement quand une image est envoyée vers un nom qui n'existe pas encore. Chaque nouveau référentiel doit avoir l'immuabilité des balises activée, un chiffrement avec une clé AWS KMS gérée par le client et la politique de cycle de vie standard de l'entreprise. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge rule on the CreateRepository API call that invokes an AWS Lambda function, which applies tag immutability, the KMS key, and the lifecycle policy to the new repository.
        fr: |-
          Créer une règle Amazon EventBridge sur l'appel d'API CreateRepository qui appelle une fonction AWS Lambda, laquelle applique l'immuabilité des balises, la clé KMS et la politique de cycle de vie au nouveau référentiel.
    - id: b
      text:
        en: |-
          Create an AWS Config rule that detects repositories without tag immutability or the lifecycle policy, with an automatic remediation that applies the missing settings to them.
        fr: |-
          Créer une règle AWS Config qui détecte les référentiels sans immuabilité des balises ni politique de cycle de vie, avec une correction automatique qui leur applique les paramètres manquants.
    - id: c
      text:
        en: |-
          Create a repository creation template that applies to create on push, with tag immutability, KMS encryption with the customer managed key, the lifecycle policy, and a repository creation role.
        fr: |-
          Créer un modèle de création de référentiel qui s'applique à la création à l'envoi (create on push), avec l'immuabilité des balises, le chiffrement KMS avec la clé gérée par le client, la politique de cycle de vie et un rôle de création de référentiel.
    - id: d
      text:
        en: |-
          Give the developers the ecr:CreateRepository permission, and publish an AWS CloudFormation template that they deploy to create each repository with the required settings before the first push.
        fr: |-
          Accorder aux développeurs l'autorisation ecr:CreateRepository, et publier un modèle AWS CloudFormation qu'ils déploient pour créer chaque référentiel avec les paramètres requis avant le premier envoi.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Repository creation templates define the settings of repositories that Amazon ECR creates on your behalf during create on push, pull through cache, or replication, including tag immutability, KMS encryption, and lifecycle policies. A repository creation role is required when the template uses KMS or resource tags, and without a matching template, ECR does not create the repository on push.
    fr: |-
      Les modèles de création de référentiel définissent les paramètres des référentiels qu'Amazon ECR crée en votre nom lors de la création à l'envoi, du cache d'extraction ou de la réplication, y compris l'immuabilité des balises, le chiffrement KMS et les politiques de cycle de vie. Un rôle de création de référentiel est requis quand le modèle utilise KMS ou des balises de ressource, et sans modèle correspondant, ECR ne crée pas le référentiel lors de l'envoi.
  options:
    a:
      en: |-
        Someone still has to create the repository before the push, and the encryption settings of a repository are set at creation, so a function that runs afterward cannot apply the KMS key.
      fr: |-
        Quelqu'un doit toujours créer le référentiel avant l'envoi, et les paramètres de chiffrement d'un référentiel sont définis à sa création : une fonction exécutée ensuite ne peut pas appliquer la clé KMS.
    b:
      en: |-
        Config remediation fixes repositories after they exist; it does not create repositories on push, and it cannot change the encryption of an existing repository.
      fr: |-
        Une correction Config corrige les référentiels après leur création ; elle ne crée pas de référentiels à l'envoi et ne peut pas modifier le chiffrement d'un référentiel existant.
    d:
      en: |-
        Developers would still create each repository manually before the first push, which is the delay that the company wants to remove.
      fr: |-
        Les développeurs créeraient toujours chaque référentiel manuellement avant le premier envoi, ce qui est précisément le délai que l'entreprise veut supprimer.
references:
  - title: Templates to control repositories created during a pull through cache, create on push, or replication action - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-creation-templates.html
