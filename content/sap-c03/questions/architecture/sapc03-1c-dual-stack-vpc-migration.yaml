id: sapc03-1c-dual-stack-vpc-migration
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a three-tier application in an IPv4-only VPC, with public subnets for the Application Load Balancers and private subnets for the instances. A customer mandate requires the application to be reachable over IPv6, and the private instances must be able to download updates from IPv6 repositories on the internet. Connections from the internet must not be initiated to the private instances. The security team has already added the required IPv6 rules to the security groups and network ACLs.

    Which combination of steps must the company take to migrate the VPC to dual-stack? (Choose three.)
  fr: |
    Une entreprise exécute une application à trois niveaux dans un VPC IPv4 uniquement, avec des sous-réseaux publics pour les Application Load Balancers et des sous-réseaux privés pour les instances. Une exigence d'un client impose que l'application soit joignable en IPv6, et les instances privées doivent pouvoir télécharger des mises à jour depuis des dépôts IPv6 sur Internet. Aucune connexion ne doit pouvoir être initiée depuis Internet vers les instances privées. L'équipe de sécurité a déjà ajouté les règles IPv6 nécessaires aux groupes de sécurité et aux listes ACL réseau.

    Quelle combinaison d'étapes l'entreprise doit-elle réaliser pour migrer le VPC en double pile ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: "Associate an Amazon-provided IPv6 CIDR block with the VPC, and assign an IPv6 /64 CIDR block to each subnet."
        fr: "Associer au VPC un bloc CIDR IPv6 fourni par Amazon, et attribuer un bloc CIDR IPv6 /64 à chaque sous-réseau."
    - id: b
      text:
        en: "Remove the IPv4 CIDR block from the VPC after IPv6 is assigned so that all resources use IPv6 only."
        fr: "Retirer le bloc CIDR IPv4 du VPC une fois l'IPv6 attribué, pour que toutes les ressources n'utilisent plus que l'IPv6."
    - id: c
      text:
        en: "Add a ::/0 route to the internet gateway in the public subnets' route tables, and change the load balancers to the dualstack IP address type."
        fr: "Ajouter une route ::/0 vers la passerelle Internet dans les tables de routage des sous-réseaux publics, et passer les équilibreurs de charge au type d'adresse IP dualstack."
    - id: d
      text:
        en: "Add a ::/0 route to the existing NAT gateways in the private subnets' route tables so that the instances keep outbound-only access."
        fr: "Ajouter une route ::/0 vers les passerelles NAT existantes dans les tables de routage des sous-réseaux privés pour que les instances gardent un accès sortant uniquement."
    - id: e
      text:
        en: "Create an egress-only internet gateway, and add a ::/0 route to it in the private subnets' route tables."
        fr: "Créer une passerelle Internet de sortie uniquement, et ajouter une route ::/0 vers elle dans les tables de routage des sous-réseaux privés."
    - id: f
      text:
        en: "Enable DNS64 on all subnets so that clients on the internet can reach the application over IPv6."
        fr: "Activer DNS64 sur tous les sous-réseaux pour que les clients sur Internet puissent joindre l'application en IPv6."
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |-
      A dual-stack VPC needs an IPv6 CIDR block on the VPC and a /64 on each subnet. Public subnets route ::/0 to the internet gateway, and load balancers of the dualstack type receive an AAAA DNS record. Private subnets route ::/0 to an egress-only internet gateway, which allows outbound IPv6 traffic and prevents the internet from initiating connections.
    fr: |-
      Un VPC double pile a besoin d'un bloc CIDR IPv6 sur le VPC et d'un /64 sur chaque sous-réseau. Les sous-réseaux publics routent ::/0 vers la passerelle Internet, et les équilibreurs de type dualstack reçoivent un enregistrement DNS AAAA. Les sous-réseaux privés routent ::/0 vers une passerelle Internet de sortie uniquement, qui autorise le trafic IPv6 sortant et empêche Internet d'initier des connexions.
  options:
    b:
      en: |-
        A VPC keeps its primary IPv4 CIDR block, and a dual-stack migration must keep the application reachable over IPv4.
      fr: |-
        Un VPC conserve son bloc CIDR IPv4 principal, et une migration en double pile doit garder l'application joignable en IPv4.
    d:
      en: |-
        For outbound-only IPv6 internet access, AWS uses an egress-only internet gateway; NAT gateways handle IPv4 and NAT64 traffic.
      fr: |-
        Pour un accès Internet IPv6 sortant uniquement, AWS utilise une passerelle Internet de sortie uniquement ; les passerelles NAT traitent le trafic IPv4 et NAT64.
    f:
      en: |-
        DNS64 lets IPv6-only workloads in a subnet reach IPv4 destinations; it does nothing for inbound IPv6 clients.
      fr: |-
        DNS64 permet aux charges de travail IPv6 uniquement d'un sous-réseau de joindre des destinations IPv4 ; il n'apporte rien aux clients IPv6 entrants.
references:
  - title: Enable outbound IPv6 traffic using an egress-only internet gateway - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html
  - title: Application Load Balancers - Elastic Load Balancing
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/application-load-balancers.html
