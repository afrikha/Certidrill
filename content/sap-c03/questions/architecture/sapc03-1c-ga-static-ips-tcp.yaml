id: sapc03-1c-ga-static-ips-tcp
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payments company runs a transaction service that uses a proprietary TCP protocol, not HTTP. The service is deployed active-active behind Network Load Balancers in us-east-1 and eu-west-1. Merchant terminals worldwide can connect only to IP addresses that are written into their firewall allow lists, and the terminals cache DNS answers for long periods. If one Region fails, terminals must reach the other Region within seconds without any change to their configuration.

    Which solution will meet these requirements?
  fr: |
    Une société de paiement exploite un service de transactions qui utilise un protocole TCP propriétaire, et non HTTP. Le service est déployé en actif-actif derrière des Network Load Balancers dans us-east-1 et eu-west-1. Les terminaux des commerçants, partout dans le monde, ne peuvent se connecter qu'à des adresses IP inscrites dans leurs listes d'autorisation de pare-feu, et ils mettent en cache les réponses DNS pendant de longues périodes. Si une Région tombe en panne, les terminaux doivent joindre l'autre Région en quelques secondes, sans aucune modification de leur configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create Route 53 latency records with health checks and a 60-second TTL for the two Network Load Balancers, and give the merchants the load balancers' DNS names."
        fr: "Créer des enregistrements de latence Route 53 avec vérifications de l'état et une TTL de 60 secondes pour les deux Network Load Balancers, et donner aux commerçants les noms DNS des équilibreurs."
    - id: b
      text:
        en: "Create an Amazon CloudFront distribution with both Network Load Balancers as origins in an origin group with failover, and give the merchants the CloudFront IP ranges."
        fr: "Créer une distribution Amazon CloudFront avec les deux Network Load Balancers comme origines d'un groupe d'origines avec basculement, et donner aux commerçants les plages IP de CloudFront."
    - id: c
      text:
        en: "Create an AWS Global Accelerator standard accelerator with a TCP listener and an endpoint group per Region for its Network Load Balancer, and have merchants allow its static IPs."
        fr: "Créer un accélérateur standard AWS Global Accelerator avec un écouteur TCP et un groupe de points de terminaison par Région pour son Network Load Balancer, et faire autoriser ses IP statiques par les commerçants."
    - id: d
      text:
        en: "Assign Elastic IP addresses to both Network Load Balancers, give the merchants all of the addresses, and create a Route 53 failover record with health checks between the Regions."
        fr: "Attribuer des adresses IP Elastic aux deux Network Load Balancers, donner toutes ces adresses aux commerçants, et créer un enregistrement de basculement Route 53 avec vérifications de l'état entre les Régions."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Global Accelerator provides two static anycast IPv4 addresses that front endpoints in several Regions, supports TCP listeners for non-HTTP protocols and directs traffic to the nearest healthy endpoints. It reacts to changes in endpoint health without relying on DNS, so cached DNS answers on the terminals do not delay failover.
    fr: |-
      Global Accelerator fournit deux adresses IPv4 anycast statiques placées devant des points de terminaison de plusieurs Régions, prend en charge des écouteurs TCP pour les protocoles non HTTP et dirige le trafic vers les points de terminaison sains les plus proches. Il réagit aux changements d'état des points de terminaison sans dépendre du DNS : les réponses DNS en cache sur les terminaux ne retardent pas le basculement.
  options:
    a:
      en: |-
        Latency records rely on DNS, so terminals that cache answers keep using the failed Region, and DNS names do not give the terminals fixed IP addresses for their allow lists.
      fr: |-
        Les enregistrements de latence reposent sur le DNS : les terminaux qui mettent les réponses en cache continuent d'utiliser la Région défaillante, et des noms DNS ne donnent pas aux terminaux d'adresses IP fixes pour leurs listes d'autorisation.
    b:
      en: |-
        CloudFront serves HTTP and HTTPS, not a proprietary TCP protocol, and its IP ranges are shared and change over time.
      fr: |-
        CloudFront sert du HTTP et du HTTPS, pas un protocole TCP propriétaire, et ses plages IP sont partagées et évoluent dans le temps.
    d:
      en: |-
        Failover still depends on DNS answers that the terminals cache, and the terminals would need their own logic to choose among the addresses.
      fr: |-
        Le basculement dépend toujours de réponses DNS que les terminaux mettent en cache, et les terminaux auraient besoin de leur propre logique pour choisir parmi les adresses.
references:
  - title: What is AWS Global Accelerator? - AWS Global Accelerator
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
