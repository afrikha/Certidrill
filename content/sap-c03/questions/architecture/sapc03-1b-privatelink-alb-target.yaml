id: sapc03-1b-privatelink-alb-target
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is a SaaS provider that runs a multi-tenant HTTPS API on Amazon ECS in a provider VPC. An internal Application Load Balancer (ALB) uses host-based and path-based listener rules to route requests to 30 services. More than 300 customers, each with their own AWS accounts, must reach the API privately from their own VPCs without traversing the internet. Many customer VPCs use CIDR ranges that overlap with each other and with the provider VPC. Customers must initiate the connection from their side, and the provider must approve each customer before traffic can flow. The provider must not expose any other resource of its VPC to customers, and it wants to keep its existing ALB rules.

    Which solution will meet these requirements?
  fr: |
    AnyCompany est un fournisseur SaaS qui exécute une API HTTPS mutualisée sur Amazon ECS dans un VPC fournisseur. Un Application Load Balancer (ALB) interne utilise des règles d'écouteur par hôte et par chemin pour acheminer les requêtes vers 30 services. Plus de 300 clients, chacun avec ses propres comptes AWS, doivent atteindre l'API de manière privée depuis leurs propres VPC sans traverser Internet. De nombreux VPC clients utilisent des plages CIDR qui se chevauchent entre elles et avec celle du VPC fournisseur. Les clients doivent initier la connexion de leur côté, et le fournisseur doit approuver chaque client avant que le trafic puisse circuler. Le fournisseur ne doit exposer aux clients aucune autre ressource de son VPC, et il veut conserver ses règles ALB existantes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an internal Network Load Balancer whose TCP listener on port 443 forwards to a target group of type alb that contains the ALB, and expose it as a VPC endpoint service with acceptance required for customer interface endpoints."
        fr: "Créer un Network Load Balancer interne dont l'écouteur TCP sur le port 443 transfère vers un groupe cible de type alb contenant l'ALB, et l'exposer comme service de point de terminaison VPC avec acceptation obligatoire pour les points de terminaison d'interface des clients."
    - id: b
      text:
        en: "Create a VPC endpoint service directly on the existing ALB with acceptance required, and add each customer account as an allowed principal so that customers can create interface endpoints to the service from their VPCs."
        fr: "Créer un service de point de terminaison VPC directement sur l'ALB existant avec acceptation obligatoire, et ajouter chaque compte client comme principal autorisé afin que les clients puissent créer depuis leurs VPC des points de terminaison d'interface vers ce service."
    - id: c
      text:
        en: "Share a transit gateway with every customer account through AWS RAM, attach the provider VPC and the customer VPCs, and isolate each customer with a dedicated transit gateway route table that reaches only the ALB subnets."
        fr: "Partager une passerelle de transit avec chaque compte client via AWS RAM, attacher le VPC fournisseur et les VPC clients, et isoler chaque client avec une table de routage de passerelle de transit dédiée qui n'atteint que les sous-réseaux de l'ALB."
    - id: d
      text:
        en: "Accept a VPC peering connection request from each approved customer VPC, and allow only the peered CIDR ranges in the security group of the ALB so that customers reach no other resource."
        fr: "Accepter une demande de connexion d'appairage de VPC (VPC peering) de chaque VPC client approuvé, et n'autoriser que les plages CIDR appairées dans le groupe de sécurité de l'ALB afin que les clients n'atteignent aucune autre ressource."
answer: { optionId: a }
explanation:
  correct:
    en: "An endpoint service (AWS PrivateLink) requires a Network Load Balancer or a Gateway Load Balancer, and an NLB can forward TCP traffic to a target group of type alb, which keeps the ALB's layer 7 rules. Consumers create interface endpoints in their own VPCs, so overlapping CIDR ranges do not matter and only the service is exposed. Acceptance required lets the provider approve each connection request."
    fr: "Un service de point de terminaison (AWS PrivateLink) exige un Network Load Balancer ou un Gateway Load Balancer, et un NLB peut transférer le trafic TCP vers un groupe cible de type alb, ce qui conserve les règles de couche 7 de l'ALB. Les consommateurs créent des points de terminaison d'interface dans leurs propres VPC : le chevauchement des plages CIDR est sans importance et seul le service est exposé. L'acceptation obligatoire permet au fournisseur d'approuver chaque demande de connexion."
  options:
    b:
      en: "An endpoint service cannot use an Application Load Balancer as its load balancer; it requires a Network Load Balancer or a Gateway Load Balancer."
      fr: "Un service de point de terminaison ne peut pas utiliser un Application Load Balancer : il exige un Network Load Balancer ou un Gateway Load Balancer."
    c:
      en: "Transit gateway routing needs unique CIDR ranges, so overlapping customer and provider VPCs cannot be routed, and the design creates network-level connectivity instead of exposing only the service."
      fr: "Le routage d'une passerelle de transit exige des plages CIDR uniques : des VPC clients et fournisseur qui se chevauchent ne peuvent pas être routés, et la conception crée une connectivité au niveau réseau au lieu d'exposer seulement le service."
    d:
      en: "VPC peering does not work between VPCs with overlapping CIDR blocks, and hundreds of peering connections would exceed the per-VPC limits and expose network-level access."
      fr: "L'appairage de VPC ne fonctionne pas entre des VPC dont les blocs CIDR se chevauchent, et des centaines de connexions d'appairage dépasseraient les limites par VPC et exposeraient un accès au niveau réseau."
references:
  - title: Use an Application Load Balancer as a target of a Network Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/application-load-balancer-target.html
  - title: Create a service powered by AWS PrivateLink
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-endpoint-service.html
