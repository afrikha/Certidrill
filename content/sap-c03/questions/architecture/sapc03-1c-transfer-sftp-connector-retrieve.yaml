id: sapc03-1c-transfer-sftp-connector-retrieve
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany Insurance receives claim files from 25 partner insurers. Each partner hosts its own SFTP server and refuses to push files to external systems, so AnyCompany must retrieve new files from every partner server every 15 minutes. The files must land in an Amazon S3 bucket in the company's ingestion account, where an existing event-driven workflow processes them. Partners accept inbound SFTP connections only from source IP addresses that they have added to an allow list. The company wants a managed solution and does not want to operate any servers.

    Which solution will meet these requirements?
  fr: |
    AnyCompany Insurance reçoit des fichiers de sinistres de 25 assureurs partenaires. Chaque partenaire héberge son propre serveur SFTP et refuse d'envoyer des fichiers vers des systèmes externes : AnyCompany doit donc récupérer les nouveaux fichiers sur chaque serveur partenaire toutes les 15 minutes. Les fichiers doivent arriver dans un compartiment Amazon S3 du compte d'ingestion de l'entreprise, où un workflow événementiel existant les traite. Les partenaires n'acceptent les connexions SFTP entrantes que depuis des adresses IP sources qu'ils ont ajoutées à une liste d'autorisation. L'entreprise veut une solution gérée et ne veut exploiter aucun serveur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Transfer Family SFTP server with Amazon S3 storage, create a service-managed user for each partner, and send each partner the server endpoint and its credentials."
        fr: "Créer un serveur SFTP AWS Transfer Family avec stockage Amazon S3, créer un utilisateur géré par le service pour chaque partenaire, et envoyer à chacun le point de terminaison du serveur et ses informations d'identification."
    - id: b
      text:
        en: "Run Amazon EC2 instances with Elastic IP addresses in an Auto Scaling group, and use cron jobs that download new files from each partner with an SFTP client and copy them to the bucket."
        fr: "Exécuter des instances Amazon EC2 avec des adresses IP Elastic dans un groupe Auto Scaling, et utiliser des tâches cron qui téléchargent les nouveaux fichiers de chaque partenaire avec un client SFTP et les copient dans le compartiment."
    - id: c
      text:
        en: "Create an AWS Transfer Family AS2 connector for each partner, and use an Amazon EventBridge Scheduler schedule to start a file transfer from each partner every 15 minutes."
        fr: "Créer un connecteur AS2 AWS Transfer Family pour chaque partenaire, et utiliser une planification Amazon EventBridge Scheduler pour démarrer un transfert de fichiers depuis chaque partenaire toutes les 15 minutes."
    - id: d
      text:
        en: "Create an AWS Transfer Family SFTP connector per partner, give partners its static IP addresses, and have a scheduled Lambda function list remote directories and retrieve new files."
        fr: "Créer un connecteur SFTP AWS Transfer Family par partenaire, communiquer ses adresses IP statiques aux partenaires, et faire lister les répertoires distants et récupérer les nouveaux fichiers par une fonction Lambda planifiée."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      SFTP connectors let Transfer Family act as an SFTP client: they retrieve files from a partner's server into Amazon S3 and can list files on the remote server. Connectors use static IP addresses that partners can add to their allow lists. A scheduled Lambda function calls the connector operations, such as StartFileTransfer with retrieve paths, so no server is operated.
    fr: |-
      Les connecteurs SFTP permettent à Transfer Family d'agir comme client SFTP : ils récupèrent les fichiers du serveur d'un partenaire vers Amazon S3 et peuvent lister les fichiers du serveur distant. Les connecteurs utilisent des adresses IP statiques que les partenaires peuvent ajouter à leurs listes d'autorisation. Une fonction Lambda planifiée appelle les opérations du connecteur, comme StartFileTransfer avec des chemins à récupérer : aucun serveur n'est exploité.
  options:
    a:
      en: |-
        A Transfer Family server receives files that partners push to it; the partners refuse to push, so nothing would arrive.
      fr: |-
        Un serveur Transfer Family reçoit les fichiers que les partenaires lui envoient ; or les partenaires refusent d'envoyer, donc rien n'arriverait.
    b:
      en: |-
        EC2 instances and cron jobs are servers that the company would have to patch, scale and monitor.
      fr: |-
        Des instances EC2 et des tâches cron sont des serveurs que l'entreprise devrait corriger, mettre à l'échelle et surveiller.
    c:
      en: |-
        AS2 connectors exchange AS2 messages with partners; they cannot retrieve files from an SFTP server.
      fr: |-
        Les connecteurs AS2 échangent des messages AS2 avec les partenaires ; ils ne peuvent pas récupérer de fichiers sur un serveur SFTP.
references:
  - title: AWS Transfer Family SFTP connectors - AWS Transfer Family
    url: https://docs.aws.amazon.com/transfer/latest/userguide/creating-connectors.html
  - title: StartFileTransfer - AWS Transfer Family
    url: https://docs.aws.amazon.com/transfer/latest/APIReference/API_StartFileTransfer.html
