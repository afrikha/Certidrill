id: sapc03-1b-agentcore-gateway-tools
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is building several AI agents that must use the same set of tools: 40 internal REST APIs described by OpenAPI specifications and 15 AWS Lambda functions. The agents' frameworks consume tools through the Model Context Protocol (MCP). The company wants one managed entry point that exposes all these tools to every agent with OAuth-based access control, injects the credentials that each API requires, and lets agents search the tool catalog so that prompts stay small. The company does not want to build or host MCP servers.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance crée plusieurs agents d'IA qui doivent utiliser le même ensemble d'outils : 40 API REST internes décrites par des spécifications OpenAPI et 15 fonctions AWS Lambda. Les frameworks des agents consomment les outils via le Model Context Protocol (MCP). L'entreprise veut un point d'entrée géré unique qui expose tous ces outils à chaque agent avec un contrôle d'accès basé sur OAuth, injecte les informations d'identification exigées par chaque API et permet aux agents de rechercher dans le catalogue d'outils afin de garder des invites courtes. L'entreprise ne veut ni créer ni héberger de serveurs MCP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon Bedrock AgentCore gateway with OpenAPI targets for the REST APIs and Lambda targets for the functions, configure inbound OAuth authorization and outbound credential providers, and connect every agent to the gateway's MCP endpoint."
        fr: "Créer une passerelle Amazon Bedrock AgentCore avec des cibles OpenAPI pour les API REST et des cibles Lambda pour les fonctions, configurer l'autorisation OAuth entrante et des fournisseurs d'informations d'identification sortants, et connecter chaque agent au point de terminaison MCP de la passerelle."
    - id: b
      text:
        en: "Write one MCP server for each REST API and Lambda function, run the servers as Amazon ECS services behind an Application Load Balancer, and list all the server URLs in the configuration of every agent."
        fr: "Écrire un serveur MCP pour chaque API REST et chaque fonction Lambda, exécuter les serveurs comme des services Amazon ECS derrière un Application Load Balancer, et lister toutes les URL de serveurs dans la configuration de chaque agent."
    - id: c
      text:
        en: "Create an Amazon Bedrock agent for each use case with one action group per OpenAPI specification and per Lambda function, and copy the action groups to every agent that needs the same tools."
        fr: "Créer un agent Amazon Bedrock par cas d'usage avec un groupe d'actions par spécification OpenAPI et par fonction Lambda, et copier les groupes d'actions dans chaque agent qui a besoin des mêmes outils."
    - id: d
      text:
        en: "Import the OpenAPI specifications into one Amazon API Gateway REST API with Lambda integrations, protect it with a usage plan and API keys, and give the API URL to every agent as its tool endpoint."
        fr: "Importer les spécifications OpenAPI dans une seule API REST Amazon API Gateway avec des intégrations Lambda, la protéger avec un plan d'utilisation et des clés d'API, et donner l'URL de l'API à chaque agent comme point de terminaison d'outils."
answer: { optionId: a }
explanation:
  correct:
    en: "AgentCore Gateway converts OpenAPI, Smithy and Lambda targets into MCP-compatible tools behind a single managed endpoint. It manages inbound OAuth authorization and outbound credential injection for each tool, and its semantic tool selection lets agents search thousands of tools while keeping prompts small."
    fr: "AgentCore Gateway convertit des cibles OpenAPI, Smithy et Lambda en outils compatibles MCP derrière un point de terminaison géré unique. Il gère l'autorisation OAuth entrante et l'injection des informations d'identification sortantes de chaque outil, et sa sélection sémantique d'outils permet aux agents de chercher parmi des milliers d'outils tout en gardant des invites courtes."
  options:
    b:
      en: "The company would build and host 55 MCP servers, which it wants to avoid, and would still have to implement credential injection and tool search."
      fr: "L'entreprise créerait et hébergerait 55 serveurs MCP, ce qu'elle veut éviter, et devrait encore implémenter l'injection des informations d'identification et la recherche d'outils."
    c:
      en: "Action groups belong to each Bedrock agent and are not exposed through MCP, so the tools would be duplicated in every agent instead of shared through one entry point."
      fr: "Les groupes d'actions appartiennent à chaque agent Bedrock et ne sont pas exposés via MCP : les outils seraient dupliqués dans chaque agent au lieu d'être partagés via un point d'entrée unique."
    d:
      en: "A REST API does not speak MCP, API keys are not an authorization mechanism, and it offers no per-tool credential injection or tool search."
      fr: "Une API REST ne parle pas MCP, les clés d'API ne sont pas un mécanisme d'autorisation, et elle n'offre ni injection d'informations d'identification par outil ni recherche d'outils."
references:
  - title: "Amazon Bedrock AgentCore Gateway: A secure AI gateway for agents, tools, and models"
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway.html
