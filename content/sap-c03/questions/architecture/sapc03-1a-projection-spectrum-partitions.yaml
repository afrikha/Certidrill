id: sapc03-1a-projection-spectrum-partitions
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores a highly partitioned table in its Amazon S3 data lake, and an Amazon Data Firehose stream writes each hour of data to a new prefix such as dt=2026-11-20/hr=09/. The data engineering team enabled partition projection on the table for Amazon Athena and then stopped the AWS Glue crawler that used to register new partitions. The finance team queries the same AWS Glue Data Catalog table from Amazon Redshift through Amazon Redshift Spectrum, and its queries no longer return data that arrived after the crawler was stopped. A full crawl of the table now takes about 50 minutes. Both Athena and Redshift Spectrum must see each new hourly partition within 10 minutes after its first object arrives. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke une table fortement partitionnée dans son lac de données Amazon S3, et un flux Amazon Data Firehose écrit chaque heure de données dans un nouveau préfixe tel que dt=2026-11-20/hr=09/. L'équipe d'ingénierie des données a activé la projection de partitions sur la table pour Amazon Athena, puis a arrêté le robot d'analyse (crawler) AWS Glue qui enregistrait les nouvelles partitions. L'équipe financière interroge la même table de l'AWS Glue Data Catalog depuis Amazon Redshift au moyen d'Amazon Redshift Spectrum, et ses requêtes ne renvoient plus les données arrivées après l'arrêt du robot d'analyse. Une analyse complète de la table prend désormais environ 50 minutes. Athena et Redshift Spectrum doivent tous deux voir chaque nouvelle partition horaire dans les 10 minutes suivant l'arrivée de son premier objet. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the same partition projection properties to the external table that Redshift Spectrum uses, so that Redshift Spectrum also calculates the partition locations from the table properties.
        fr: |-
          Ajouter les mêmes propriétés de projection de partitions à la table externe utilisée par Redshift Spectrum, pour que Redshift Spectrum calcule lui aussi l'emplacement des partitions à partir des propriétés de la table.
    - id: b
      text:
        en: |-
          Keep partition projection for Athena, and use S3 event notifications to invoke an AWS Lambda function that registers each new hourly partition in the Data Catalog with the BatchCreatePartition API.
        fr: |-
          Conserver la projection de partitions pour Athena, et utiliser les notifications d'événements S3 pour appeler une fonction AWS Lambda qui enregistre chaque nouvelle partition horaire dans le Data Catalog avec l'API BatchCreatePartition.
    - id: c
      text:
        en: |-
          Restart the Glue crawler on a schedule that runs every 10 minutes over the whole table, and keep partition projection enabled for the Athena queries.
        fr: |-
          Redémarrer le robot d'analyse Glue selon une planification toutes les 10 minutes sur l'ensemble de la table, et conserver la projection de partitions activée pour les requêtes Athena.
    - id: d
      text:
        en: |-
          Create a materialized view in Amazon Redshift on the external table with automatic refresh, and point the finance team's queries to the materialized view.
        fr: |-
          Créer dans Amazon Redshift une vue matérialisée sur la table externe avec actualisation automatique, et diriger les requêtes de l'équipe financière vers la vue matérialisée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Partition projection is used only when the table is queried through Athena; Redshift Spectrum and other engines read the partition metadata that is registered in the Data Catalog. Registering each new partition as soon as its first object arrives makes it visible to Redshift Spectrum within minutes, while Athena keeps using projection and ignores the registered partitions.
    fr: |-
      La projection de partitions n'est utilisée que lorsque la table est interrogée par Athena ; Redshift Spectrum et les autres moteurs lisent les métadonnées de partition enregistrées dans le Data Catalog. Enregistrer chaque nouvelle partition dès l'arrivée de son premier objet la rend visible pour Redshift Spectrum en quelques minutes, tandis qu'Athena continue d'utiliser la projection et ignore les partitions enregistrées.
  options:
    a:
      en: |-
        Projection properties have no effect outside Athena, so Redshift Spectrum would still see only the partitions registered in the Data Catalog.
      fr: |-
        Les propriétés de projection n'ont aucun effet en dehors d'Athena : Redshift Spectrum ne verrait toujours que les partitions enregistrées dans le Data Catalog.
    c:
      en: |-
        A full crawl takes about 50 minutes, so a 10-minute schedule cannot register new partitions within 10 minutes and would run overlapping crawls.
      fr: |-
        Une analyse complète prend environ 50 minutes : une planification toutes les 10 minutes ne peut pas enregistrer les nouvelles partitions en 10 minutes et produirait des analyses qui se chevauchent.
    d:
      en: |-
        A materialized view on the external table still reads only the partitions that are registered in the Data Catalog, so the new hourly data would remain missing.
      fr: |-
        Une vue matérialisée sur la table externe ne lit toujours que les partitions enregistrées dans le Data Catalog : les nouvelles données horaires resteraient absentes.
references:
  - title: Use partition projection with Amazon Athena - Amazon Athena
    url: https://docs.aws.amazon.com/athena/latest/ug/partition-projection.html
