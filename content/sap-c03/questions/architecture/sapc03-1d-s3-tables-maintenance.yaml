id: sapc03-1d-s3-tables-maintenance
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company streams shipment events into Apache Iceberg tables in an Amazon S3 general purpose bucket. The ingestion process commits small files every few seconds, so each table now has millions of small objects, and query performance in Amazon Athena and Amazon Redshift has degraded. Every night, the data team runs a self-managed Amazon EMR cluster to compact files, expire old snapshots and delete unreferenced files, and these jobs often fail when ingestion load is high. The company wants to keep the Iceberg format and the existing Athena and Redshift queries. The company also needs higher transaction rates for the frequent commits and wants to stop running table maintenance jobs.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de logistique diffuse des événements d'expédition dans des tables Apache Iceberg stockées dans un compartiment Amazon S3 à usage général. Le processus d'ingestion valide de petits fichiers toutes les quelques secondes : chaque table compte désormais des millions de petits objets, et les performances des requêtes dans Amazon Athena et Amazon Redshift se sont dégradées. Chaque nuit, l'équipe de données exécute un cluster Amazon EMR autogéré pour compacter les fichiers, faire expirer les anciens instantanés et supprimer les fichiers non référencés, et ces tâches échouent souvent quand la charge d'ingestion est élevée. L'entreprise veut conserver le format Iceberg et les requêtes Athena et Redshift existantes. Elle a aussi besoin de taux de transactions plus élevés pour les validations fréquentes et veut cesser d'exécuter des tâches de maintenance des tables.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Replace the nightly EMR cluster with an Amazon EMR Serverless application that runs the same maintenance jobs on a schedule from Amazon EventBridge Scheduler."
        fr: "Remplacer le cluster EMR nocturne par une application Amazon EMR Serverless qui exécute les mêmes tâches de maintenance selon une planification d'Amazon EventBridge Scheduler."
    - id: b
      text:
        en: "Convert the tables to Hive-style Parquet tables partitioned by hour, and run an AWS Glue crawler every hour to register the new partitions."
        fr: "Convertir les tables en tables Parquet de style Hive partitionnées par heure, et exécuter un robot d'analyse AWS Glue toutes les heures pour enregistrer les nouvelles partitions."
    - id: c
      text:
        en: "Add an S3 Lifecycle rule that expires the objects older than 7 days under the data and metadata prefixes of each table."
        fr: "Ajouter une règle de cycle de vie S3 qui fait expirer les objets de plus de 7 jours sous les préfixes de données et de métadonnées de chaque table."
    - id: d
      text:
        en: "Move the tables to a table bucket in Amazon S3 Tables, and integrate the table bucket with AWS analytics services through the AWS Glue Data Catalog."
        fr: "Déplacer les tables vers un compartiment de tables (table bucket) Amazon S3 Tables, et intégrer ce compartiment aux services d'analytique AWS via AWS Glue Data Catalog."
answer: { optionId: d }
explanation:
  correct:
    en: |
      S3 Tables stores tables in Iceberg format in table buckets and continuously runs maintenance itself, including compaction, snapshot management and unreferenced file removal. Table buckets provide higher transactions per second than self-managed tables in general purpose buckets, and the Glue Data Catalog integration lets Athena and Redshift keep querying the tables.
    fr: |
      S3 Tables stocke les tables au format Iceberg dans des compartiments de tables et exécute lui-même la maintenance en continu, notamment le compactage, la gestion des instantanés et la suppression des fichiers non référencés. Les compartiments de tables offrent plus de transactions par seconde que des tables autogérées dans des compartiments à usage général, et l'intégration avec Glue Data Catalog permet à Athena et à Redshift de continuer à interroger les tables.
  options:
    a:
      en: |
        EMR Serverless removes the cluster, but the company still owns, schedules and troubleshoots the maintenance jobs, and transaction rates on the general purpose bucket do not change.
      fr: |
        EMR Serverless supprime le cluster, mais l'entreprise possède, planifie et dépanne toujours les tâches de maintenance, et les taux de transactions sur le compartiment à usage général ne changent pas.
    b:
      en: |
        Leaving Iceberg breaks the requirement to keep the format, and hourly crawlers add work without solving the small-file problem.
      fr: |
        Abandonner Iceberg enfreint l'exigence de conserver le format, et des robots d'analyse horaires ajoutent du travail sans résoudre le problème des petits fichiers.
    c:
      en: |
        A Lifecycle rule deletes objects by age even when the current snapshot still references them, which corrupts the tables, and it performs no compaction.
      fr: |
        Une règle de cycle de vie supprime les objets selon leur âge même quand l'instantané actuel les référence encore, ce qui corrompt les tables, et elle n'effectue aucun compactage.
references:
  - title: Working with Amazon S3 Tables and table buckets
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-tables.html
