id: sapc03-1b-cf-vpc-origin-headers
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company runs a patient portal on Amazon ECS behind an Application Load Balancer (ALB). A new security standard requires the ALB to be internal, in private subnets, with no public IP addresses. The company wants users worldwide to get low latency by caching static assets at edge locations, and it wants AWS WAF to inspect requests at the edge. Every response must also carry HSTS and Content-Security-Policy headers, which the application does not set. The team does not want to change application code or maintain custom edge code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé exécute un portail patients sur Amazon ECS derrière un Application Load Balancer (ALB). Une nouvelle norme de sécurité impose que l'ALB soit interne, dans des sous-réseaux privés, sans adresse IP publique. L'entreprise veut offrir une faible latence aux utilisateurs du monde entier en mettant en cache les ressources statiques dans des emplacements périphériques, et elle veut qu'AWS WAF inspecte les requêtes en périphérie. Chaque réponse doit aussi porter les en-têtes HSTS et Content-Security-Policy, que l'application ne définit pas. L'équipe ne veut ni modifier le code de l'application ni maintenir du code personnalisé en périphérie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the ALB internet-facing, allow only the CloudFront origin-facing managed prefix list in its security group, and use a CloudFront distribution with AWS WAF and a response headers policy."
        fr: "Garder l'ALB accessible depuis Internet, n'autoriser que la liste de préfixes gérée CloudFront orientée origine dans son groupe de sécurité, et utiliser une distribution CloudFront avec AWS WAF et une politique d'en-têtes de réponse."
    - id: b
      text:
        en: "Create a CloudFront VPC origin for the internal ALB, associate an AWS WAF web ACL with the distribution, and add the headers with a Lambda@Edge function on the origin response event."
        fr: "Créer une origine VPC CloudFront pour l'ALB interne, associer une liste ACL web AWS WAF à la distribution, et ajouter les en-têtes avec une fonction Lambda@Edge sur l'événement de réponse de l'origine."
    - id: c
      text:
        en: "Create an AWS Global Accelerator standard accelerator with the internal ALB as its endpoint, associate the AWS WAF web ACL with the ALB, and configure the ALB to add the security headers."
        fr: "Créer un accélérateur standard AWS Global Accelerator avec l'ALB interne comme point de terminaison, associer la liste ACL web AWS WAF à l'ALB, et configurer l'ALB pour qu'il ajoute les en-têtes de sécurité."
    - id: d
      text:
        en: "Create a CloudFront VPC origin for the internal ALB, associate an AWS WAF web ACL with the distribution, and attach a response headers policy that adds the HSTS and Content-Security-Policy headers."
        fr: "Créer une origine VPC CloudFront pour l'ALB interne, associer une liste ACL web AWS WAF à la distribution, et attacher une politique d'en-têtes de réponse qui ajoute les en-têtes HSTS et Content-Security-Policy."
answer: { optionId: d }
explanation:
  correct:
    en: "CloudFront VPC origins deliver content from ALBs, NLBs or EC2 instances in private subnets, so the ALB needs no public exposure. AWS WAF on the distribution inspects requests at the edge, and a response headers policy adds security headers such as HSTS and Content-Security-Policy without any code."
    fr: "Les origines VPC CloudFront diffusent du contenu depuis des ALB, des NLB ou des instances EC2 dans des sous-réseaux privés : l'ALB n'a besoin d'aucune exposition publique. AWS WAF sur la distribution inspecte les requêtes en périphérie, et une politique d'en-têtes de réponse ajoute des en-têtes de sécurité comme HSTS et Content-Security-Policy sans aucun code."
  options:
    a:
      en: "An internet-facing ALB has public IP addresses, which the security standard forbids, even if its security group restricts the sources."
      fr: "Un ALB accessible depuis Internet a des adresses IP publiques, ce que la norme de sécurité interdit, même si son groupe de sécurité restreint les sources."
    b:
      en: "VPC origins do not support Lambda@Edge origin request and origin response triggers, and the function would be custom edge code to maintain."
      fr: "Les origines VPC ne prennent pas en charge les déclencheurs Lambda@Edge de requête et de réponse d'origine, et la fonction serait du code personnalisé à maintenir en périphérie."
    c:
      en: "Global Accelerator does not cache content at edge locations, and WAF on the ALB inspects requests in the Region instead of at the edge."
      fr: "Global Accelerator ne met pas de contenu en cache dans des emplacements périphériques, et WAF sur l'ALB inspecte les requêtes dans la Région au lieu de la périphérie."
references:
  - title: Restrict access with VPC origins
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-vpc-origins.html
  - title: Add or remove HTTP headers in CloudFront responses with a policy
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/modifying-response-headers.html
