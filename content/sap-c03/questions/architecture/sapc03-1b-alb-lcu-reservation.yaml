id: sapc03-1b-alb-lcu-reservation
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs its checkout service on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB). The ALB uses host-based listener rules and an AWS WAF web ACL. Twice a year, the company runs a flash sale that starts at a published time, and traffic rises from about 2,000 to more than 150,000 requests per second within one minute. Before the last sale, a scheduled action had already scaled out the Auto Scaling group, but clients still received HTTP 503 errors during the first minutes while the load balancer itself scaled. The company kept the CloudWatch PeakLCUs metric data of that sale. The company wants to prevent these errors at the next sale without changing the architecture.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute son service de paiement sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer (ALB). L'ALB utilise des règles d'écouteur par hôte et une liste ACL web AWS WAF. Deux fois par an, l'entreprise organise une vente flash qui commence à une heure annoncée, et le trafic passe d'environ 2 000 à plus de 150 000 requêtes par seconde en une minute. Avant la dernière vente, une action planifiée avait déjà augmenté la taille du groupe Auto Scaling, mais les clients ont tout de même reçu des erreurs HTTP 503 pendant les premières minutes, le temps que l'équilibreur de charge lui-même monte en capacité. L'entreprise a conservé les données de la métrique CloudWatch PeakLCUs de cette vente. Elle veut éviter ces erreurs lors de la prochaine vente sans modifier l'architecture.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Replace the ALB with a Network Load Balancer, which absorbs sudden spikes, and move the AWS WAF web ACL and the host-based rules to the TCP listener of the Network Load Balancer."
        fr: "Remplacer l'ALB par un Network Load Balancer, qui absorbe les pics soudains, et déplacer la liste ACL web AWS WAF et les règles par hôte vers l'écouteur TCP du Network Load Balancer."
    - id: b
      text:
        en: "Raise the minimum capacity of the Auto Scaling group to the peak size one hour before the sale, and turn on slow start mode on the target group so that new instances warm up."
        fr: "Porter la capacité minimale du groupe Auto Scaling à la taille de pointe une heure avant la vente, et activer le mode de démarrage lent (slow start) sur le groupe cible pour que les nouvelles instances montent en charge progressivement."
    - id: c
      text:
        en: "Place an Amazon CloudFront distribution in front of the ALB with caching disabled for the checkout paths, so that CloudFront edge locations absorb the spike before it reaches the ALB."
        fr: "Placer une distribution Amazon CloudFront devant l'ALB avec la mise en cache désactivée pour les chemins de paiement, afin que les emplacements périphériques CloudFront absorbent le pic avant qu'il n'atteigne l'ALB."
    - id: d
      text:
        en: "Before the sale, request an LCU reservation on the ALB sized from the per-minute sum of PeakLCUs recorded during the last sale, and cancel the reservation after the event."
        fr: "Avant la vente, demander une réservation de LCU sur l'ALB dimensionnée à partir de la somme par minute de PeakLCUs enregistrée lors de la dernière vente, et annuler la réservation après l'événement."
answer: { optionId: d }
explanation:
  correct:
    en: "An LCU reservation sets a minimum capacity for the ALB, which still scales up above it, so the load balancer is ready at the start of a known spike. AWS recommends sizing it from the per-minute Sum of the PeakLCUs metric or from load tests. The architecture, WAF and listener rules stay unchanged, and the reservation can be removed after the sale to stop paying for it."
    fr: "Une réservation de LCU fixe une capacité minimale pour l'ALB, qui continue de monter en capacité au-delà : l'équilibreur de charge est prêt dès le début d'un pic connu. AWS recommande de la dimensionner à partir de la somme par minute de la métrique PeakLCUs ou de tests de charge. L'architecture, WAF et les règles d'écouteur restent inchangés, et la réservation peut être supprimée après la vente pour ne plus la payer."
  options:
    a:
      en: "A Network Load Balancer cannot be associated with AWS WAF and has no host-based rules, so the change breaks stated requirements and changes the architecture."
      fr: "Un Network Load Balancer ne peut pas être associé à AWS WAF et n'a pas de règles par hôte : ce changement casse des exigences énoncées et modifie l'architecture."
    b:
      en: "The instances were already scaled out; the errors came from the load balancer's own capacity. Slow start also limits traffic to new targets instead of adding ALB capacity."
      fr: "Les instances étaient déjà en nombre suffisant : les erreurs venaient de la capacité de l'équilibreur de charge lui-même. Le démarrage lent limite en outre le trafic vers les nouvelles cibles au lieu d'ajouter de la capacité à l'ALB."
    c:
      en: "With caching disabled, CloudFront forwards every checkout request to the ALB, which must still scale to the same request rate."
      fr: "Sans mise en cache, CloudFront transmet chaque requête de paiement à l'ALB, qui doit toujours monter en capacité jusqu'au même débit de requêtes."
references:
  - title: Capacity reservations for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/capacity-unit-reservation.html
