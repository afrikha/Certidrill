id: sapc03-1d-spectrum-cold-history
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs an Amazon Redshift provisioned cluster that holds 7 years of sales history, about 400 TB. About 95% of the queries read only the last 12 months of data. A data lake team now wants the older years to be available to Amazon Athena and Amazon EMR in an open columnar file format. The finance team queries the older years a few times each quarter and joins them with current dimension tables that will stay in Redshift. Finance users must keep using their existing Redshift SQL connections and must get results within minutes. The company does not want to keep two copies of the history.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise de services financiers exploite un cluster provisionné Amazon Redshift qui contient 7 ans d'historique des ventes, soit environ 400 To. Environ 95 % des requêtes ne lisent que les 12 derniers mois de données. Une équipe lac de données veut désormais que les années plus anciennes soient disponibles pour Amazon Athena et Amazon EMR dans un format de fichier en colonnes ouvert. L'équipe finance interroge les années plus anciennes quelques fois par trimestre et les joint à des tables de dimensions actuelles qui resteront dans Redshift. Les utilisateurs de la finance doivent continuer à utiliser leurs connexions SQL Redshift existantes et obtenir des résultats en quelques minutes. L'entreprise ne veut pas conserver deux copies de l'historique.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "UNLOAD the data older than 12 months to Amazon S3 as partitioned Parquet files cataloged in the AWS Glue Data Catalog, query them through Redshift Spectrum, and delete the old rows from the cluster."
        fr: "Exécuter UNLOAD sur les données de plus de 12 mois vers Amazon S3 en fichiers Parquet partitionnés catalogués dans AWS Glue Data Catalog, les interroger via Redshift Spectrum, et supprimer les anciennes lignes du cluster."
    - id: b
      text:
        en: "Keep all the history in the cluster and enable concurrency scaling for the finance queries. Export a monthly copy of the history to Amazon S3 as CSV files so that Athena and Amazon EMR can read it."
        fr: "Conserver tout l'historique dans le cluster et activer la mise à l'échelle de la simultanéité (concurrency scaling) pour les requêtes de la finance. Exporter chaque mois une copie de l'historique vers Amazon S3 en fichiers CSV afin qu'Athena et Amazon EMR puissent la lire."
    - id: c
      text:
        en: "UNLOAD the older data to Amazon S3 as Parquet files and transition them to S3 Glacier Deep Archive. Restore the needed partitions and load them into temporary Redshift tables when the finance team needs them."
        fr: "Exécuter UNLOAD sur les données plus anciennes vers Amazon S3 en fichiers Parquet et les faire passer dans S3 Glacier Deep Archive. Restaurer les partitions nécessaires et les charger dans des tables Redshift temporaires quand l'équipe finance en a besoin."
    - id: d
      text:
        en: "Move the older data to a new Amazon Redshift Serverless workgroup and query it from the provisioned cluster through a datashare. Export the workgroup tables to Amazon S3 so that Athena and Amazon EMR can read them."
        fr: "Déplacer les données plus anciennes vers un nouveau groupe de travail Amazon Redshift Serverless et les interroger depuis le cluster provisionné via un partage de données (datashare). Exporter les tables du groupe de travail vers Amazon S3 afin qu'Athena et Amazon EMR puissent les lire."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Redshift Spectrum queries structured data in place in Amazon S3 without loading it into Redshift tables, so finance keeps its Redshift connections and joins the external tables with local dimension tables. The same Parquet files, cataloged in the Glue Data Catalog, are read directly by Athena and EMR, so there is a single, low-cost copy of the history.
    fr: |
      Redshift Spectrum interroge les données structurées directement dans Amazon S3 sans les charger dans des tables Redshift : la finance garde ses connexions Redshift et joint les tables externes aux tables de dimensions locales. Les mêmes fichiers Parquet, catalogués dans Glue Data Catalog, sont lus directement par Athena et EMR : il n'existe qu'une seule copie peu coûteuse de l'historique.
  options:
    b:
      en: |
        The history stays in the cluster and a second CSV copy is kept in S3, which breaks the single-copy requirement, adds cost, and CSV is not a columnar format.
      fr: |
        L'historique reste dans le cluster et une seconde copie CSV est conservée dans S3, ce qui enfreint l'exigence d'une copie unique, ajoute des coûts, et CSV n'est pas un format en colonnes.
    c:
      en: |
        Objects in S3 Glacier Deep Archive must be restored before they can be read, which takes hours, so finance cannot get results within minutes; Athena and EMR cannot query the archived files either.
      fr: |
        Les objets de S3 Glacier Deep Archive doivent être restaurés avant d'être lus, ce qui prend des heures : la finance ne peut pas obtenir de résultats en quelques minutes, et Athena et EMR ne peuvent pas non plus interroger les fichiers archivés.
    d:
      en: |
        The history would exist both in the workgroup and in the S3 export, and the company would pay for a second warehouse in addition to the storage.
      fr: |
        L'historique existerait à la fois dans le groupe de travail et dans l'export S3, et l'entreprise paierait un second entrepôt en plus du stockage.
references:
  - title: Amazon Redshift Spectrum
    url: https://docs.aws.amazon.com/redshift/latest/dg/c-using-spectrum.html
