id: sapc03-1a-lattice-eks-gateway-api
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs microservices on two Amazon EKS clusters that are in different AWS accounts. The VPCs of the two clusters use overlapping CIDR blocks. The orders service in cluster A must call the inventory service in cluster B over HTTP. The application developers want to define the routing with Kubernetes Gateway API resources such as HTTPRoute, and they do not want to create or manage load balancers for the traffic between services. A networking account owns an Amazon VPC Lattice service network for the organization.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute des microservices sur deux clusters Amazon EKS situés dans des comptes AWS différents. Les VPC des deux clusters utilisent des blocs CIDR qui se chevauchent. Le service de commandes du cluster A doit appeler le service d'inventaire du cluster B en HTTP. Les développeurs veulent définir le routage avec des ressources Kubernetes Gateway API telles que HTTPRoute, et ne veulent ni créer ni gérer d'équilibreurs de charge pour le trafic entre services. Un compte réseau possède un réseau de service Amazon VPC Lattice pour l'organisation.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Install the AWS Gateway API Controller in both clusters, and create a Gateway for the service network and HTTPRoute resources that the controller turns into Lattice services and target groups.
        fr: |-
          Installer l'AWS Gateway API Controller dans les deux clusters, et créer une ressource Gateway pour le réseau de service et des ressources HTTPRoute que le contrôleur transforme en services et groupes cibles Lattice.
    - id: b
      text:
        en: |-
          Share the service network with the two cluster accounts through AWS RAM, and associate the VPC of each cluster with the service network.
        fr: |-
          Partager le réseau de service avec les deux comptes des clusters au moyen d'AWS RAM, et associer le VPC de chaque cluster au réseau de service.
    - id: c
      text:
        en: |-
          Install the AWS Load Balancer Controller in cluster B, expose the inventory service through an internal Application Load Balancer, and peer the two VPCs.
        fr: |-
          Installer l'AWS Load Balancer Controller dans le cluster B, exposer le service d'inventaire au moyen d'un Application Load Balancer interne et appairer (peering) les deux VPC.
    - id: d
      text:
        en: |-
          Attach the VPCs of both clusters to a transit gateway, and add routes between the pod subnets of the two clusters in the transit gateway route table.
        fr: |-
          Attacher les VPC des deux clusters à une passerelle de transit, et ajouter des itinéraires entre les sous-réseaux de pods des deux clusters dans la table de routage de la passerelle de transit.
    - id: e
      text:
        en: |-
          Create an Amazon ECS Service Connect namespace, share it with both accounts through AWS RAM, and register the two Kubernetes services in the namespace.
        fr: |-
          Créer un espace de noms Amazon ECS Service Connect, le partager avec les deux comptes au moyen d'AWS RAM et enregistrer les deux services Kubernetes dans l'espace de noms.
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      The AWS Gateway API Controller implements the Kubernetes Gateway API on VPC Lattice: a Gateway maps to the service network and each HTTPRoute becomes a Lattice service whose target groups point to the pods, so developers use Kubernetes resources and no load balancer is created. Sharing the service network through AWS RAM and associating both VPCs lets the clusters reach the services across accounts, and Lattice supports overlapping CIDR ranges.
    fr: |-
      L'AWS Gateway API Controller met en œuvre la Kubernetes Gateway API sur VPC Lattice : une ressource Gateway correspond au réseau de service et chaque HTTPRoute devient un service Lattice dont les groupes cibles pointent vers les pods ; les développeurs utilisent des ressources Kubernetes et aucun équilibreur de charge n'est créé. Partager le réseau de service au moyen d'AWS RAM et associer les deux VPC permet aux clusters d'atteindre les services entre comptes, et Lattice prend en charge les plages CIDR qui se chevauchent.
  options:
    c:
      en: |-
        An internal load balancer is what the developers want to avoid, and VPC peering is not possible between VPCs whose CIDR blocks overlap.
      fr: |-
        Un équilibreur de charge interne est précisément ce que les développeurs veulent éviter, et le peering de VPC n'est pas possible entre des VPC dont les blocs CIDR se chevauchent.
    d:
      en: |-
        A transit gateway cannot route correctly between VPCs that use overlapping CIDR blocks, and it does not provide Gateway API routing.
      fr: |-
        Une passerelle de transit ne peut pas acheminer correctement le trafic entre des VPC qui utilisent des blocs CIDR qui se chevauchent, et elle ne fournit pas de routage Gateway API.
    e:
      en: |-
        Service Connect works only for Amazon ECS services; Kubernetes services on EKS cannot be registered in a Service Connect namespace.
      fr: |-
        Service Connect ne fonctionne que pour les services Amazon ECS ; les services Kubernetes sur EKS ne peuvent pas être enregistrés dans un espace de noms Service Connect.
references:
  - title: What is Amazon VPC Lattice? - Amazon VPC Lattice
    url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/what-is-vpc-lattice.html
