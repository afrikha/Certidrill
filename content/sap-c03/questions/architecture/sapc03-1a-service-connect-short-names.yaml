id: sapc03-1a-service-connect-short-names
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs two Amazon ECS clusters in the same AWS Region and account. A web service in one cluster must call an inventory service in the other cluster with a short name such as http://inventory:8080. The team wants connection metrics for each service in the ECS console and in Amazon CloudWatch, and it does not want load balancers between the services. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute deux clusters Amazon ECS dans la même Région AWS et le même compte. Un service web d'un cluster doit appeler un service d'inventaire de l'autre cluster avec un nom court tel que http://inventory:8080. L'équipe veut des métriques de connexion pour chaque service dans la console ECS et dans Amazon CloudWatch, et ne veut pas d'équilibreur de charge entre les services. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Put an internal Application Load Balancer in front of the inventory service, and create a record named inventory in an Amazon Route 53 private hosted zone that points to the load balancer.
        fr: |-
          Placer un Application Load Balancer interne devant le service d'inventaire, et créer un enregistrement nommé inventory dans une zone hébergée privée Amazon Route 53 qui pointe vers l'équilibreur de charge.
    - id: b
      text:
        en: |-
          Turn on ECS service discovery for the inventory service with an AWS Cloud Map DNS namespace, and have the web service resolve the task IP addresses through DNS.
        fr: |-
          Activer la découverte de services ECS pour le service d'inventaire avec un espace de noms DNS AWS Cloud Map, et faire résoudre par le service web les adresses IP des tâches au moyen du DNS.
    - id: c
      text:
        en: |-
          Create an AWS App Mesh mesh with a virtual service for the inventory service, and add the Envoy proxy container to the task definitions of both services.
        fr: |-
          Créer un maillage AWS App Mesh avec un service virtuel pour le service d'inventaire, et ajouter le conteneur proxy Envoy aux définitions de tâche des deux services.
    - id: d
      text:
        en: |-
          Configure Amazon ECS Service Connect on both services with the same namespace, as a client-server service with an endpoint named inventory for the inventory service.
        fr: |-
          Configurer Amazon ECS Service Connect sur les deux services avec le même espace de noms, en tant que service client-serveur avec un point de terminaison nommé inventory pour le service d'inventaire.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Service Connect lets services in the same namespace, even in different clusters of the same Region, connect with short names through a proxy in each task. The inventory service is a client-server service that exposes the endpoint, and the proxies report connection metrics to the ECS and CloudWatch consoles without any load balancer.
    fr: |-
      Service Connect permet aux services d'un même espace de noms, même dans des clusters différents de la même Région, de se connecter par des noms courts au moyen d'un proxy dans chaque tâche. Le service d'inventaire est un service client-serveur qui expose le point de terminaison, et les proxys envoient des métriques de connexion aux consoles ECS et CloudWatch, sans aucun équilibreur de charge.
  options:
    a:
      en: |-
        An internal load balancer and a private hosted zone add the load balancer that the team wants to avoid, and they do not give per-connection metrics between the services.
      fr: |-
        Un équilibreur de charge interne et une zone hébergée privée ajoutent l'équilibreur de charge que l'équipe veut éviter, et ne fournissent pas de métriques par connexion entre les services.
    b:
      en: |-
        DNS-based service discovery resolves task IP addresses, but it has no proxy, so it provides no connection metrics for the services.
      fr: |-
        La découverte de services basée sur le DNS résout les adresses IP des tâches, mais sans proxy : elle ne fournit aucune métrique de connexion pour les services.
    c:
      en: |-
        App Mesh support ended on September 30, 2026, so a new mesh cannot be created.
      fr: |-
        Le support d'App Mesh a pris fin le 30 septembre 2026 : un nouveau maillage ne peut pas être créé.
references:
  - title: Use Service Connect to connect Amazon ECS services with short names - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-connect.html
