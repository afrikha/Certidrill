id: sapc03-1c-hybrid-sync-nfs-smb
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A research institute runs gene sequencers in its laboratory, and the sequencers write raw results to an on-premises NFS server. Every night, new and changed files must be copied to an Amazon S3 bucket with automatic integrity verification. The copy must never use more than 500 Mbps of the laboratory's 1 Gbps internet link. Scientists in the laboratory also need to open archived results that are already stored in another S3 bucket through an SMB share, with recently used files cached locally. The institute does not want to write or maintain custom scripts.

    Which combination of solutions will meet these requirements? (Choose two.)
  fr: |
    Un institut de recherche exploite des séquenceurs de gènes dans son laboratoire, et les séquenceurs écrivent leurs résultats bruts sur un serveur NFS sur site. Chaque nuit, les fichiers nouveaux et modifiés doivent être copiés vers un compartiment Amazon S3 avec une vérification d'intégrité automatique. La copie ne doit jamais utiliser plus de 500 Mbit/s du lien Internet de 1 Gbit/s du laboratoire. Les scientifiques du laboratoire doivent aussi ouvrir, via un partage SMB, des résultats archivés déjà stockés dans un autre compartiment S3, avec mise en cache locale des fichiers récemment utilisés. L'institut ne veut ni écrire ni maintenir de scripts personnalisés.

    Quelle combinaison de solutions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Deploy an AWS DataSync agent on premises, create an NFS location and an S3 location, and schedule a nightly task with a bandwidth limit."
        fr: "Déployer un agent AWS DataSync sur site, créer un emplacement NFS et un emplacement S3, et planifier une tâche nocturne avec une limite de bande passante."
    - id: b
      text:
        en: "Deploy an Amazon S3 File Gateway on premises, and create an SMB file share for the archive bucket so that recently used files are cached locally."
        fr: "Déployer une Amazon S3 File Gateway sur site, et créer un partage de fichiers SMB pour le compartiment d'archives afin que les fichiers récemment utilisés soient mis en cache localement."
    - id: c
      text:
        en: "Deploy an AWS Storage Gateway Volume Gateway with cached volumes, and present the archive bucket to the scientists as an iSCSI volume."
        fr: "Déployer une AWS Storage Gateway Volume Gateway à volumes mis en cache, et présenter le compartiment d'archives aux scientifiques comme un volume iSCSI."
    - id: d
      text:
        en: "Create an AWS Transfer Family SFTP server, and configure the sequencers to upload their raw results to it at the end of each run."
        fr: "Créer un serveur SFTP AWS Transfer Family, et configurer les séquenceurs pour qu'ils y chargent leurs résultats bruts à la fin de chaque exécution."
    - id: e
      text:
        en: "Schedule the aws s3 sync command with S3 Transfer Acceleration on an on-premises server to copy the NFS share to the bucket every night."
        fr: "Planifier la commande aws s3 sync avec S3 Transfer Acceleration sur un serveur sur site pour copier chaque nuit le partage NFS vers le compartiment."
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      DataSync copies new and changed files from an NFS location to Amazon S3 on a schedule, verifies data integrity and lets a task limit the bandwidth it uses. S3 File Gateway presents an S3 bucket as an SMB file share and keeps recently used data in its local cache.
    fr: |-
      DataSync copie selon une planification les fichiers nouveaux et modifiés d'un emplacement NFS vers Amazon S3, vérifie l'intégrité des données et permet à une tâche de limiter la bande passante utilisée. S3 File Gateway présente un compartiment S3 comme un partage de fichiers SMB et garde les données récemment utilisées dans son cache local.
  options:
    c:
      en: |-
        Volume Gateway presents block storage over iSCSI; it cannot present the existing objects of a bucket as files.
      fr: |-
        Volume Gateway présente du stockage en mode bloc via iSCSI ; il ne peut pas présenter les objets existants d'un compartiment comme des fichiers.
    d:
      en: |-
        The sequencers write to NFS; uploading over SFTP would require reconfiguring every sequencer and gives no managed change detection or bandwidth limit for the existing files.
      fr: |-
        Les séquenceurs écrivent sur NFS ; charger en SFTP obligerait à reconfigurer chaque séquenceur et n'offre ni détection gérée des modifications ni limite de bande passante pour les fichiers existants.
    e:
      en: |-
        A scheduled CLI command on a server is a custom script that the institute would have to schedule, monitor and maintain.
      fr: |-
        Une commande CLI planifiée sur un serveur est un script personnalisé que l'institut devrait planifier, surveiller et maintenir.
references:
  - title: What is AWS DataSync? - AWS DataSync
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
