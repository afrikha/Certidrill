id: sapc03-1d-lf-external-partner-filter
objective: "1.5.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A pharmaceutical company keeps clinical trial results in a data lake in Amazon S3 that is governed by AWS Lake Formation in its analytics account. A contract research organization (CRO) has its own AWS account, which is not part of the company's organization. The CRO must query, with Amazon Athena, only the rows of the trials that it runs and must not see the patient_initials column. The data must not be copied out of the company's S3 buckets. The company wants to keep managing these permissions only in Lake Formation.

    Which solution will meet these requirements?
  fr: |
    Une entreprise pharmaceutique conserve les résultats d'essais cliniques dans un lac de données Amazon S3 gouverné par AWS Lake Formation dans son compte d'analytique. Un organisme de recherche sous contrat (CRO) possède son propre compte AWS, qui ne fait pas partie de l'organisation de l'entreprise. Le CRO doit interroger avec Amazon Athena uniquement les lignes des essais qu'il conduit et ne doit pas voir la colonne patient_initials. Les données ne doivent pas être copiées hors des compartiments S3 de l'entreprise. L'entreprise veut continuer à gérer ces autorisations uniquement dans Lake Formation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a data filter on the CRO's trial IDs that excludes patient_initials, and grant SELECT with it and the grant option to the CRO account. The CRO accepts the AWS RAM invitation and creates a resource link."
        fr: "Créer un filtre de données sur les ID d'essais du CRO qui exclut patient_initials, et accorder SELECT avec ce filtre et l'option d'octroi au compte du CRO. Le CRO accepte l'invitation AWS RAM et crée un lien de ressource."
    - id: b
      text:
        en: "Add a bucket policy that lets the CRO account read the prefixes of its trials, and a Data Catalog resource policy that lets it read the table. The CRO defines its own Athena table without patient_initials."
        fr: "Ajouter une politique de compartiment qui permet au compte du CRO de lire les préfixes de ses essais, et une politique de ressource Data Catalog qui lui permet de lire la table. Le CRO définit sa propre table Athena sans patient_initials."
    - id: c
      text:
        en: "Schedule an Athena CTAS query that writes the CRO's rows without patient_initials to a separate bucket every night, and replicate that bucket to a bucket in the CRO account."
        fr: "Planifier une requête CTAS Athena qui écrit chaque nuit les lignes du CRO sans patient_initials dans un compartiment distinct, et répliquer ce compartiment vers un compartiment du compte du CRO."
    - id: d
      text:
        en: "Load the trial results into an Amazon Redshift Serverless workgroup, create a view of the CRO's trials without patient_initials, and share the view with the CRO account through a datashare."
        fr: "Charger les résultats d'essais dans un groupe de travail Amazon Redshift Serverless, créer une vue des essais du CRO sans patient_initials, et partager cette vue avec le compte du CRO par un partage de données (datashare)."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lake Formation can grant SELECT through a data filter that combines a row expression with excluded columns, and grants to an external account must include the grant option so that the account's data lake administrator can pass access to its principals. For an account outside the organization, AWS RAM sends an invitation that the CRO must accept, and Athena queries the shared table through a resource link. The data stays in place and Lake Formation enforces the filter.
    fr: |
      Lake Formation peut accorder SELECT au moyen d'un filtre de données qui combine une expression de ligne et des colonnes exclues, et les octrois à un compte externe doivent inclure l'option d'octroi afin que l'administrateur du lac de données de ce compte transmette l'accès à ses principaux. Pour un compte extérieur à l'organisation, AWS RAM envoie une invitation que le CRO doit accepter, et Athena interroge la table partagée via un lien de ressource. Les données restent en place et Lake Formation applique le filtre.
  options:
    b:
      en: |
        Object-level access exposes every column stored in the files, the CRO controls its own table definition, and the permissions live outside Lake Formation.
      fr: |
        L'accès au niveau des objets expose toutes les colonnes stockées dans les fichiers, le CRO contrôle sa propre définition de table, et les autorisations se trouvent hors de Lake Formation.
    c:
      en: |
        The CTAS output and the replica are copies of the data outside the governed buckets, which the company forbids.
      fr: |
        La sortie de CTAS et la réplique sont des copies des données hors des compartiments gouvernés, ce que l'entreprise interdit.
    d:
      en: |
        Loading the results into Redshift copies the data out of S3, and the CRO would query through Redshift instead of Athena, with permissions managed outside Lake Formation.
      fr: |
        Charger les résultats dans Redshift copie les données hors de S3, et le CRO interrogerait via Redshift au lieu d'Athena, avec des autorisations gérées hors de Lake Formation.
references:
  - title: Cross-account data sharing in Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/cross-account-permissions.html
  - title: Granting data filter permissions
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/granting-filter-perms.html
