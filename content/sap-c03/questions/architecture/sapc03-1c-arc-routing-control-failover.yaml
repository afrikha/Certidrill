id: sapc03-1c-arc-routing-control-failover
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank runs an active-passive payment application in us-east-1 and us-west-2, and the passive Region is kept scaled and ready. The bank's risk committee requires that Regional failover be a deliberate human decision and never be triggered automatically by health checks. Operators must also be prevented from turning off traffic to both Regions at the same time. During a Regional impairment, the failover action must not depend on editing DNS records through the Route 53 API.

    Which solution will meet these requirements?
  fr: |
    Une banque exploite une application de paiement actif-passif dans us-east-1 et us-west-2, et la Région passive est maintenue dimensionnée et prête. Le comité des risques de la banque exige que le basculement régional soit une décision humaine délibérée, jamais déclenchée automatiquement par des vérifications de l'état. Les opérateurs doivent aussi être empêchés de couper le trafic vers les deux Régions en même temps. Pendant une dégradation régionale, l'action de basculement ne doit pas dépendre de la modification d'enregistrements DNS par l'API Route 53.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create Amazon Application Recovery Controller (ARC) routing controls on Route 53 failover records, add a safety rule that keeps one Region on, and switch them through the cluster endpoints."
        fr: "Créer des contrôles de routage Amazon Application Recovery Controller (ARC) sur des enregistrements de basculement Route 53, ajouter une règle de sécurité qui garde une Région active, et les basculer par les points de terminaison du cluster."
    - id: b
      text:
        en: "Create Route 53 failover records with health checks on the load balancers in each Region, and set a low TTL so that failover completes within a few minutes of an outage."
        fr: "Créer des enregistrements de basculement Route 53 avec des vérifications de l'état sur les équilibreurs de charge de chaque Région, et définir une TTL courte pour que le basculement se termine quelques minutes après une panne."
    - id: c
      text:
        en: "Create an AWS Systems Manager runbook that operators start during an incident to change the weights of Route 53 weighted records from the primary Region to the secondary Region."
        fr: "Créer un runbook AWS Systems Manager que les opérateurs lancent pendant un incident pour modifier les poids d'enregistrements pondérés Route 53 de la Région principale vers la Région secondaire."
    - id: d
      text:
        en: "Create Route 53 failover records whose health checks monitor Amazon CloudWatch alarms, and have operators set the alarm states manually with the SetAlarmState API during an incident."
        fr: "Créer des enregistrements de basculement Route 53 dont les vérifications de l'état surveillent des alarmes Amazon CloudWatch, et faire définir manuellement l'état des alarmes par les opérateurs avec l'API SetAlarmState pendant un incident."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ARC routing controls are on/off switches that reroute traffic through routing control health checks attached to DNS failover records. Safety rules prevent unintended outcomes such as both Regions being off. Each ARC cluster is a data plane of endpoints in five Regions, and AWS recommends changing routing control states with the API or CLI through those endpoints, so no DNS record is edited during the event.
    fr: |-
      Les contrôles de routage ARC sont des interrupteurs marche/arrêt qui réacheminent le trafic par des vérifications de l'état de contrôle de routage attachées à des enregistrements DNS de basculement. Des règles de sécurité empêchent des résultats non souhaités, comme deux Régions coupées. Chaque cluster ARC est un plan de données de points de terminaison dans cinq Régions, et AWS recommande de changer l'état des contrôles de routage par l'API ou la CLI via ces points de terminaison : aucun enregistrement DNS n'est modifié pendant l'événement.
  options:
    b:
      en: |-
        Health checks trigger the failover automatically, which the risk committee forbids.
      fr: |-
        Les vérifications de l'état déclenchent le basculement automatiquement, ce que le comité des risques interdit.
    c:
      en: |-
        Changing the weights edits DNS records through the Route 53 API, which the bank must not depend on, and nothing prevents both Regions from being turned off.
      fr: |-
        Modifier les poids revient à éditer des enregistrements DNS par l'API Route 53, dont la banque ne doit pas dépendre, et rien n'empêche de couper les deux Régions.
    d:
      en: |-
        Failover stays manual, but no safety rule prevents operators from setting both Regions' alarms at the same time.
      fr: |-
        Le basculement reste manuel, mais aucune règle de sécurité n'empêche les opérateurs de déclencher en même temps les alarmes des deux Régions.
references:
  - title: Routing control in ARC - Amazon Application Recovery Controller (ARC)
    url: https://docs.aws.amazon.com/r53recovery/latest/dg/routing-control.html
