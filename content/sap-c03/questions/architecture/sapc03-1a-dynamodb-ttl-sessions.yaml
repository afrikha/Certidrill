id: sapc03-1a-dynamodb-ttl-sessions
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A SaaS company is moving user session state from the memory of its containers to an Amazon DynamoDB table so that the containers become stateless. A session must stop being valid 30 minutes after the user's last request. Old sessions must be removed from the table so that the storage does not grow indefinitely. The company wants to avoid paying write capacity for the removal of expired sessions and wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS déplace l'état des sessions utilisateur de la mémoire de ses conteneurs vers une table Amazon DynamoDB, afin que les conteneurs deviennent sans état. Une session doit cesser d'être valide 30 minutes après la dernière requête de l'utilisateur. Les anciennes sessions doivent être supprimées de la table pour que le stockage ne croisse pas indéfiniment. L'entreprise veut éviter de payer de la capacité d'écriture pour la suppression des sessions expirées et veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Store the last access time in each item, and run an AWS Lambda function every 5 minutes that scans the table and deletes the sessions that have been inactive for more than 30 minutes.
        fr: |-
          Stocker l'heure du dernier accès dans chaque élément, et exécuter toutes les 5 minutes une fonction AWS Lambda qui analyse la table et supprime les sessions inactives depuis plus de 30 minutes.
    - id: b
      text:
        en: |-
          Store an expiry time in Unix epoch seconds as a Number attribute, refresh it on each request, enable TTL on the attribute, and have the application reject sessions whose expiry time has passed.
        fr: |-
          Stocker une heure d'expiration en secondes epoch Unix dans un attribut de type Number, l'actualiser à chaque requête, activer le TTL sur cet attribut et faire rejeter par l'application les sessions dont l'heure d'expiration est passée.
    - id: c
      text:
        en: |-
          Store an expiry time as an ISO 8601 date string attribute, refresh it on each request, and enable TTL on the attribute so that DynamoDB deletes each session exactly at its expiry time.
        fr: |-
          Stocker une heure d'expiration dans un attribut de type chaîne de date ISO 8601, l'actualiser à chaque requête et activer le TTL sur cet attribut pour que DynamoDB supprime chaque session exactement à son heure d'expiration.
    - id: d
      text:
        en: |-
          Write the sessions to a new table each day, have the application look up sessions in the current table, and delete the previous day's table with a scheduled job.
        fr: |-
          Écrire les sessions dans une nouvelle table chaque jour, faire rechercher les sessions dans la table du jour par l'application, et supprimer la table de la veille avec une tâche planifiée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      TTL deletes expired items without consuming write throughput, and it requires a Number attribute in Unix epoch seconds. Deletion usually happens within a few days and is not guaranteed at the exact expiry time, so the application must also check the expiry time (for example, with a filter or a comparison after the read) to enforce the 30-minute rule.
    fr: |-
      Le TTL supprime les éléments expirés sans consommer de débit d'écriture, et il exige un attribut de type Number en secondes epoch Unix. La suppression a généralement lieu dans les jours qui suivent et n'est pas garantie à l'heure exacte d'expiration : l'application doit donc aussi vérifier l'heure d'expiration (par exemple avec un filtre ou une comparaison après la lecture) pour appliquer la règle des 30 minutes.
  options:
    a:
      en: |-
        Scans and deletes consume read and write capacity and add a function to operate, which the company wants to avoid.
      fr: |-
        Les analyses et les suppressions consomment de la capacité de lecture et d'écriture et ajoutent une fonction à exploiter, ce que l'entreprise veut éviter.
    c:
      en: |-
        TTL ignores items whose TTL attribute is not a Number, and even with the right type it does not delete items at the exact expiry time.
      fr: |-
        Le TTL ignore les éléments dont l'attribut TTL n'est pas de type Number, et même avec le bon type, il ne supprime pas les éléments à l'heure exacte d'expiration.
    d:
      en: |-
        Daily tables add custom lookup and cleanup logic, and sessions that are active across midnight would be lost or need extra handling.
      fr: |-
        Des tables quotidiennes ajoutent une logique personnalisée de recherche et de nettoyage, et les sessions actives au passage de minuit seraient perdues ou exigeraient un traitement supplémentaire.
references:
  - title: Using time to live (TTL) in DynamoDB - Amazon DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
