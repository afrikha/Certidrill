id: sapc03-1c-strangler-fig-apigw
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company rehosted its monolithic booking application on Amazon EC2 instances behind an internal Application Load Balancer. Over the next two years, the company plans to extract features such as search, pricing and loyalty into separate services on AWS Lambda and Amazon ECS. Clients must keep calling the same host name and URL paths during the whole migration. Each feature must be cut over independently, and the company must be able to send a feature's traffic back to the monolith quickly if the new service fails. The company wants to avoid a single big-bang release.

    Which solution will meet these requirements?
  fr: |
    Une agence de voyages a réhébergé son application monolithique de réservation sur des instances Amazon EC2 derrière un Application Load Balancer interne. Au cours des deux prochaines années, l'entreprise prévoit d'extraire des fonctionnalités comme la recherche, la tarification et la fidélité dans des services distincts sur AWS Lambda et Amazon ECS. Les clients doivent continuer d'appeler le même nom d'hôte et les mêmes chemins d'URL pendant toute la migration. Chaque fonctionnalité doit basculer indépendamment, et l'entreprise doit pouvoir renvoyer rapidement le trafic d'une fonctionnalité vers le monolithe si le nouveau service échoue. L'entreprise veut éviter une mise en production unique de type big-bang.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create Amazon Route 53 weighted records for the host name that point to the monolith and to each new service, and adjust the weights as each feature is migrated."
        fr: "Créer des enregistrements pondérés Amazon Route 53 pour le nom d'hôte qui pointent vers le monolithe et vers chaque nouveau service, et ajuster les poids au fil de la migration des fonctionnalités."
    - id: b
      text:
        en: "Build all the new services in parallel, test them together, and switch the host name from the monolith to the new services in one AWS CodeDeploy blue/green deployment."
        fr: "Développer tous les nouveaux services en parallèle, les tester ensemble, et basculer le nom d'hôte du monolithe vers les nouveaux services en un seul déploiement bleu/vert AWS CodeDeploy."
    - id: c
      text:
        en: "Put an API Gateway REST API with a custom domain in front of the monolith, proxy unmatched paths to it through a VPC link, and add a resource per extracted feature."
        fr: "Placer une API REST API Gateway avec un domaine personnalisé devant le monolithe, lui transmettre les chemins non reconnus via un lien VPC, et ajouter une ressource par fonctionnalité extraite."
    - id: d
      text:
        en: "Modify the monolith to publish every request to an Amazon MQ queue, and have each new service consume the requests for the features that it owns."
        fr: "Modifier le monolithe pour qu'il publie chaque requête dans une file d'attente Amazon MQ, et faire consommer par chaque nouveau service les requêtes des fonctionnalités dont il est responsable."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      This is the strangler fig pattern: API Gateway acts as the facade, sends all unmatched paths to the monolith and routes each extracted feature's path to its new service. Cutting a feature over or back only changes that resource's integration, and the custom domain keeps the host name. API Gateway is a serverless, Multi-AZ proxy, which limits the risk of the facade becoming a single point of failure.
    fr: |-
      C'est le modèle de la figue étrangleuse (strangler fig) : API Gateway sert de façade, envoie tous les chemins non reconnus au monolithe et route le chemin de chaque fonctionnalité extraite vers son nouveau service. Basculer une fonctionnalité dans un sens ou dans l'autre ne modifie que l'intégration de sa ressource, et le domaine personnalisé conserve le nom d'hôte. API Gateway est un proxy sans serveur et Multi-AZ, ce qui limite le risque que la façade devienne un point de défaillance unique.
  options:
    a:
      en: |-
        DNS weights split traffic by host name, not by URL path, so requests for any feature would reach the wrong backend.
      fr: |-
        Les poids DNS répartissent le trafic par nom d'hôte, pas par chemin d'URL : les requêtes de n'importe quelle fonctionnalité atteindraient le mauvais backend.
    b:
      en: |-
        Switching everything at once is the big-bang release that the company wants to avoid, and one failing service forces a full rollback.
      fr: |-
        Tout basculer d'un coup est justement la mise en production big-bang que l'entreprise veut éviter, et un seul service défaillant impose une restauration complète.
    d:
      en: |-
        Changing the monolith to queue its requests is invasive and turns synchronous client calls into asynchronous messages.
      fr: |-
        Modifier le monolithe pour mettre ses requêtes en file est intrusif et transforme des appels clients synchrones en messages asynchrones.
references:
  - title: Strangler fig pattern - AWS Prescriptive Guidance
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/strangler-fig.html
