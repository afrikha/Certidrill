id: sapc03-1b-rag-bda-parsing
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An asset management firm is building a RAG assistant on Amazon Bedrock Knowledge Bases over 20,000 quarterly fund reports stored as PDF files in Amazon S3. Much of the key information is in tables and charts, such as performance by sector, and a pilot with the current configuration answered almost every chart question wrongly. The firm wants the knowledge base to extract the content of tables, charts and figures during ingestion and to keep the extracted images in S3 for citations. The firm does not want to write custom parsing code.

    Which solution will meet these requirements?
  fr: |
    Une société de gestion d'actifs crée un assistant RAG sur Amazon Bedrock Knowledge Bases à partir de 20 000 rapports trimestriels de fonds stockés en PDF dans Amazon S3. Une grande partie des informations clés se trouve dans des tableaux et des graphiques, comme la performance par secteur, et un pilote avec la configuration actuelle a répondu faux à presque toutes les questions portant sur les graphiques. La société veut que la base de connaissances extraie le contenu des tableaux, graphiques et figures lors de l'ingestion et conserve les images extraites dans S3 pour les citations. Elle ne veut pas écrire de code d'analyse personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep the Amazon Bedrock default parser, and switch the data source to semantic chunking so that the chunks follow the topic boundaries around each table and chart."
        fr: "Conserver l'analyseur par défaut d'Amazon Bedrock, et passer la source de données au découpage sémantique afin que les fragments suivent les limites thématiques autour de chaque tableau et graphique."
    - id: b
      text:
        en: "Choose no chunking for the data source, and add a custom transformation Lambda function that calls Amazon Textract on each page and writes the extracted text as chunks."
        fr: "Choisir l'absence de découpage pour la source de données, et ajouter une fonction Lambda de transformation personnalisée qui appelle Amazon Textract sur chaque page et écrit le texte extrait comme fragments."
    - id: c
      text:
        en: "Configure the data source to use the Amazon Bedrock Data Automation parser, specify an S3 destination for the extracted multimodal content, and sync the data source again."
        fr: "Configurer la source de données pour utiliser l'analyseur Amazon Bedrock Data Automation, indiquer une destination S3 pour le contenu multimodal extrait, et synchroniser de nouveau la source de données."
    - id: d
      text:
        en: "Keep the Amazon Bedrock default parser, and increase the fixed chunk size and the overlap percentage so that each table and chart stays in one chunk with its surrounding text."
        fr: "Conserver l'analyseur par défaut d'Amazon Bedrock, et augmenter la taille fixe des fragments et le pourcentage de chevauchement afin que chaque tableau et graphique reste dans un seul fragment avec le texte qui l'entoure."
answer: { optionId: c }
explanation:
  correct:
    en: "The default parser outputs text only, so it does not extract figures, charts, tables or images. The Amazon Bedrock Data Automation parser processes this multimodal content in PDF files without extra prompting, and it can store the extracted elements as files in an S3 destination that you specify."
    fr: "L'analyseur par défaut ne produit que du texte : il n'extrait ni figures, ni graphiques, ni tableaux, ni images. L'analyseur Amazon Bedrock Data Automation traite ce contenu multimodal dans les fichiers PDF sans invite supplémentaire, et il peut stocker les éléments extraits comme fichiers dans une destination S3 que vous indiquez."
  options:
    a:
      en: "Chunking happens after parsing; with the default parser the charts are never turned into usable content, whatever the chunking strategy."
      fr: "Le découpage intervient après l'analyse : avec l'analyseur par défaut, les graphiques ne deviennent jamais un contenu exploitable, quelle que soit la stratégie de découpage."
    b:
      en: "A custom Lambda function with Textract is the custom parsing code that the firm wants to avoid, and it does not keep the chart images for citations."
      fr: "Une fonction Lambda personnalisée avec Textract est justement le code d'analyse personnalisé que la société veut éviter, et elle ne conserve pas les images des graphiques pour les citations."
    d:
      en: "Larger chunks still contain only the text that the default parser produced, so the information in the charts remains missing."
      fr: "Des fragments plus grands ne contiennent toujours que le texte produit par l'analyseur par défaut : les informations des graphiques restent absentes."
references:
  - title: Parsing options for your data source
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-advanced-parsing.html
