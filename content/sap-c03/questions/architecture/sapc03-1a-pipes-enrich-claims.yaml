id: sapc03-1a-pipes-enrich-claims
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company receives claim messages from a partner in an Amazon SQS queue. Each claim must be enriched with policyholder data that an internal HTTPS API returns, and the API is already configured as an Amazon EventBridge API destination. The enriched claim must then start an execution of an AWS Step Functions state machine that handles the claim. Only claims of type "auto" must be processed, and the other claims can be discarded. The company wants a point-to-point integration and does not want to write or maintain integration code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une compagnie d'assurance reçoit les messages de sinistre d'un partenaire dans une file d'attente Amazon SQS. Chaque sinistre doit être enrichi avec les données de l'assuré renvoyées par une API HTTPS interne, déjà configurée comme destination d'API Amazon EventBridge. Le sinistre enrichi doit ensuite démarrer une exécution d'une machine d'état AWS Step Functions qui traite le sinistre. Seuls les sinistres de type « auto » doivent être traités ; les autres peuvent être écartés. L'entreprise veut une intégration point à point et ne veut ni écrire ni maintenir de code d'intégration.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Configure the queue as the event source of an AWS Lambda function that discards claims of other types, calls the HTTPS API, and starts the state machine with the AWS SDK.
        fr: |-
          Configurer la file d'attente comme source d'événements d'une fonction AWS Lambda qui écarte les sinistres d'autres types, appelle l'API HTTPS et démarre la machine d'état avec le kit SDK AWS.
    - id: b
      text:
        en: |-
          Create an EventBridge rule on the default event bus with an event pattern that matches auto claims from the queue, and set the state machine as the target with an input transformer.
        fr: |-
          Créer une règle EventBridge sur le bus d'événements par défaut avec un modèle d'événement qui correspond aux sinistres auto de la file d'attente, et définir la machine d'état comme cible avec un transformateur d'entrée.
    - id: c
      text:
        en: |-
          Use Amazon EventBridge Scheduler to start the state machine every minute, and have the state machine read the queue with an AWS SDK integration, filter the claims, and call the API destination.
        fr: |-
          Utiliser Amazon EventBridge Scheduler pour démarrer la machine d'état toutes les minutes, et faire lire la file d'attente par la machine d'état avec une intégration du kit SDK AWS, filtrer les sinistres et appeler la destination d'API.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge pipe with the queue as the source, a filter on the claim type, the API destination as the enrichment, and the state machine as the target.
        fr: |-
          Créer un canal (pipe) Amazon EventBridge avec la file d'attente comme source, un filtre sur le type de sinistre, la destination d'API comme enrichissement et la machine d'état comme cible.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      EventBridge Pipes connects one source to one target with optional filtering and enrichment, without integration code. The pipe reads the queue, sends only matching claims onward (and charges only for those), enriches each claim through the API destination, and starts the state machine.
    fr: |-
      EventBridge Pipes relie une source à une cible avec un filtrage et un enrichissement facultatifs, sans code d'intégration. Le canal lit la file d'attente, ne transmet que les sinistres correspondants (et ne facture que ceux-là), enrichit chaque sinistre au moyen de la destination d'API et démarre la machine d'état.
  options:
    a:
      en: |-
        A Lambda function works, but it is integration code that the company must write, test, and maintain, which the requirements exclude.
      fr: |-
        Une fonction Lambda fonctionne, mais c'est du code d'intégration que l'entreprise doit écrire, tester et maintenir, ce que les exigences excluent.
    b:
      en: |-
        Event bus rules match events that are sent to the bus; messages that sit in an SQS queue never reach the bus, so the rule would never match.
      fr: |-
        Les règles d'un bus correspondent aux événements envoyés au bus ; les messages d'une file d'attente SQS n'atteignent jamais le bus, la règle ne correspondrait donc jamais.
    c:
      en: |-
        A scheduled polling workflow adds up to a minute of latency, needs custom logic to receive, filter, and delete messages, and runs even when the queue is empty.
      fr: |-
        Un flux de travail d'interrogation planifié ajoute jusqu'à une minute de latence, exige une logique personnalisée pour recevoir, filtrer et supprimer les messages, et s'exécute même quand la file d'attente est vide.
references:
  - title: Amazon EventBridge Pipes - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-pipes.html
