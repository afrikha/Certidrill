id: sapc03-1d-zero-etl-two-sources
objective: "1.5.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A subscription company runs its order system on an Amazon Aurora MySQL DB cluster and manages its sales pipeline in Salesforce. The company is building an Amazon Redshift Serverless data warehouse for finance reporting. Finance needs order data and Salesforce opportunity data in Redshift continuously, including updates to existing records, so that dashboards reflect changes without waiting for a nightly load. Finance analysts will query the replicated tables with SQL in Redshift. The data engineering team is small and does not want to build, schedule or operate ingestion jobs or replication servers.

    Which combination of actions will meet these requirements with the LEAST operational overhead? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise d'abonnements exécute son système de commandes sur un cluster de bases de données Amazon Aurora MySQL et gère son pipeline commercial dans Salesforce. L'entreprise construit un entrepôt de données Amazon Redshift Serverless pour le reporting financier. La finance a besoin des données de commandes et des opportunités Salesforce dans Redshift en continu, y compris les mises à jour des enregistrements existants, afin que les tableaux de bord reflètent les changements sans attendre un chargement nocturne. Les analystes financiers interrogeront les tables répliquées en SQL dans Redshift. L'équipe d'ingénierie des données est petite et ne veut ni développer, ni planifier, ni exploiter de tâches d'ingestion ou de serveurs de réplication.

    Quelle combinaison d'actions répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez deux réponses.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an AWS DMS replication instance with a full load and change data capture task from the Aurora cluster to Redshift."
        fr: "Créer une instance de réplication AWS DMS avec une tâche de chargement complet et de capture des données modifiées (CDC) du cluster Aurora vers Redshift."
    - id: b
      text:
        en: "Create a zero-ETL integration with the Aurora MySQL DB cluster as the source and the Redshift Serverless workgroup as the target."
        fr: "Créer une intégration zéro ETL avec le cluster de bases de données Aurora MySQL comme source et le groupe de travail Redshift Serverless comme cible."
    - id: c
      text:
        en: "Schedule an AWS Glue job every hour that reads Salesforce through a connector, writes the records to Amazon S3 and runs a COPY command."
        fr: "Planifier toutes les heures une tâche AWS Glue qui lit Salesforce via un connecteur, écrit les enregistrements dans Amazon S3 et exécute une commande COPY."
    - id: d
      text:
        en: "Export Aurora snapshots to Amazon S3 every night and query the exported Parquet files from Redshift with Redshift Spectrum."
        fr: "Exporter chaque nuit des instantanés Aurora vers Amazon S3 et interroger les fichiers Parquet exportés depuis Redshift avec Redshift Spectrum."
    - id: e
      text:
        en: "Create a zero-ETL integration with Salesforce as the source and the Redshift Serverless workgroup as the target."
        fr: "Créer une intégration zéro ETL avec Salesforce comme source et le groupe de travail Redshift Serverless comme cible."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A zero-ETL integration replicates data from a source into a Redshift provisioned cluster or Serverless workgroup after an initial load, and AWS creates and manages the replication, so no ETL pipeline must be maintained. Supported sources include Aurora MySQL and applications such as Salesforce, and several integrations can feed the same warehouse so that finance joins both data sets in Redshift.
    fr: |
      Une intégration zéro ETL réplique les données d'une source vers un cluster provisionné ou un groupe de travail Serverless Redshift après un chargement initial, et AWS crée et gère la réplication : aucun pipeline ETL n'est à maintenir. Les sources prises en charge comprennent Aurora MySQL et des applications comme Salesforce, et plusieurs intégrations peuvent alimenter le même entrepôt afin que la finance joigne les deux jeux de données dans Redshift.
  options:
    a:
      en: |
        DMS can replicate changes, but the team would size, monitor and maintain a replication instance and its task, which it wants to avoid.
      fr: |
        DMS peut répliquer les modifications, mais l'équipe devrait dimensionner, surveiller et maintenir une instance de réplication et sa tâche, ce qu'elle veut éviter.
    c:
      en: |
        An hourly Glue job is an ingestion pipeline to build and schedule, and the data is up to an hour old.
      fr: |
        Une tâche Glue horaire est un pipeline d'ingestion à développer et à planifier, et les données ont jusqu'à une heure de retard.
    d:
      en: |
        Nightly snapshot exports are a batch load, so dashboards would not reflect changes until the next day, and the exports must be scheduled.
      fr: |
        Les exports nocturnes d'instantanés sont un chargement par lots : les tableaux de bord ne refléteraient les changements que le lendemain, et les exports doivent être planifiés.
references:
  - title: Zero-ETL integrations
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/zero-etl-using.html
