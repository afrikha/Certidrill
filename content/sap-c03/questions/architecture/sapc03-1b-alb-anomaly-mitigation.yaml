id: sapc03-1b-alb-anomaly-mitigation
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs a stateless pricing API on 12 Amazon EC2 instances behind an Application Load Balancer (ALB), in a single target group. From time to time, a software defect on one instance makes it return HTTP 500 errors for most requests, while its /health endpoint, which the target group health check uses, still answers HTTP 200. The application team cannot change the application code or the health check endpoint for the next six months. The company needs the load balancer to automatically reduce the traffic it sends to an instance that returns far more errors than the other instances, and to restore that traffic when the instance recovers. Requests have similar processing times, and the target group uses neither sticky sessions nor slow start.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute une API de tarification sans état sur 12 instances Amazon EC2 derrière un Application Load Balancer (ALB), dans un seul groupe cible. De temps en temps, un défaut logiciel sur une instance lui fait renvoyer des erreurs HTTP 500 pour la plupart des requêtes, alors que son point de terminaison /health, utilisé par la vérification de l'état du groupe cible, répond toujours HTTP 200. L'équipe applicative ne peut modifier ni le code de l'application ni le point de terminaison de vérification de l'état pendant les six prochains mois. L'entreprise a besoin que l'équilibreur de charge réduise automatiquement le trafic envoyé à une instance qui renvoie beaucoup plus d'erreurs que les autres, puis rétablisse ce trafic quand l'instance se rétablit. Les requêtes ont des temps de traitement similaires, et le groupe cible n'utilise ni sessions persistantes ni démarrage lent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the routing algorithm of the target group to least outstanding requests, so that an instance that returns errors receives fewer in-progress requests than the healthy instances."
        fr: "Remplacer l'algorithme de routage du groupe cible par least outstanding requests, afin qu'une instance qui renvoie des erreurs reçoive moins de requêtes en cours que les instances saines."
    - id: b
      text:
        en: "Change the routing algorithm of the target group to weighted random, and turn on anomaly mitigation of automatic target weights for the target group."
        fr: "Remplacer l'algorithme de routage du groupe cible par weighted random, et activer l'atténuation des anomalies des pondérations automatiques des cibles (automatic target weights) pour le groupe cible."
    - id: c
      text:
        en: "Lower the health check interval and the unhealthy threshold of the target group, so that the load balancer marks the defective instance as unhealthy and stops routing to it sooner."
        fr: "Réduire l'intervalle de vérification de l'état et le seuil de défaillance du groupe cible, afin que l'équilibreur de charge marque plus tôt l'instance défectueuse comme non saine et cesse de lui envoyer du trafic."
    - id: d
      text:
        en: "Create an Amazon CloudWatch alarm on the HTTPCode_Target_5XX_Count metric of the ALB that starts an EC2 Auto Scaling instance refresh of the group when the error count rises."
        fr: "Créer une alarme Amazon CloudWatch sur la métrique HTTPCode_Target_5XX_Count de l'ALB qui lance une actualisation des instances (instance refresh) du groupe Auto Scaling quand le nombre d'erreurs augmente."
answer: { optionId: b }
explanation:
  correct:
    en: "Automatic target weights compare the 5xx and connection error rate of each target with its peers, independently of health checks, and need at least three healthy targets. With the weighted random algorithm, anomaly mitigation reduces the traffic sent to an anomalous target and gradually restores it when the target is normal again, with no code change."
    fr: "Les pondérations automatiques des cibles comparent le taux d'erreurs 5xx et d'échecs de connexion de chaque cible à celui de ses pairs, indépendamment des vérifications de l'état, et exigent au moins trois cibles saines. Avec l'algorithme weighted random, l'atténuation des anomalies réduit le trafic envoyé à une cible anormale et le rétablit progressivement quand elle redevient normale, sans modification du code."
  options:
    a:
      en: "Least outstanding requests counts in-progress requests, not errors, and a target that fails fast can even receive more requests. Anomaly mitigation is available only with weighted random."
      fr: "Least outstanding requests compte les requêtes en cours, pas les erreurs, et une cible qui échoue rapidement peut même recevoir plus de requêtes. L'atténuation des anomalies n'est disponible qu'avec weighted random."
    c:
      en: "The /health endpoint keeps answering HTTP 200, so faster health checks never mark the defective instance as unhealthy."
      fr: "Le point de terminaison /health continue de répondre HTTP 200 : des vérifications plus rapides ne marquent jamais l'instance défectueuse comme non saine."
    d:
      en: "The metric is aggregated for the load balancer, so the alarm cannot tell which instance fails, and an instance refresh replaces every instance instead of shifting traffic away from one."
      fr: "La métrique est agrégée pour l'équilibreur de charge : l'alarme ne peut pas savoir quelle instance échoue, et une actualisation des instances remplace toutes les instances au lieu de détourner le trafic d'une seule."
references:
  - title: Edit target group attributes for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
