id: sapc03-1a-provisioned-concurrency-schedule
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a Java REST API on AWS Lambda behind Amazon API Gateway. Every weekday at 08:00, traffic jumps from almost nothing to about 400 concurrent requests, and cold starts make the p99 latency exceed the service level objective. Smaller, unpredictable spikes also occur during the day. The company wants to remove the cold-start latency during the morning peak and the daytime spikes. It does not want to pay for pre-initialized capacity at the peak level all day and all night.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exécute une API REST Java sur AWS Lambda derrière Amazon API Gateway. Chaque jour ouvré à 8 h, le trafic passe de presque rien à environ 400 requêtes simultanées, et les démarrages à froid font dépasser à la latence p99 l'objectif de niveau de service. De plus petits pics imprévisibles se produisent aussi pendant la journée. L'entreprise veut supprimer la latence des démarrages à froid pendant la pointe du matin et les pics de la journée. Elle ne veut pas payer de capacité préinitialisée au niveau de la pointe toute la journée et toute la nuit.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the reserved concurrency of the function to 500 so that enough concurrency is always available for the function during the morning peak and the daytime spikes.
        fr: |-
          Définir la simultanéité réservée de la fonction sur 500 pour qu'une simultanéité suffisante soit toujours disponible pour la fonction pendant la pointe du matin et les pics de la journée.
    - id: b
      text:
        en: |-
          Configure 450 units of provisioned concurrency on the $LATEST version of the function, and keep this configuration in place at all times so that the peak is always covered.
        fr: |-
          Configurer 450 unités de simultanéité provisionnée sur la version $LATEST de la fonction, et conserver cette configuration en permanence pour que la pointe soit toujours couverte.
    - id: c
      text:
        en: |-
          Publish a version behind an alias, and manage the alias's provisioned concurrency with Application Auto Scaling, with scheduled actions around the 08:00 peak and a target tracking policy on utilization.
        fr: |-
          Publier une version derrière un alias, et gérer la simultanéité provisionnée de l'alias avec Application Auto Scaling, avec des actions planifiées autour de la pointe de 8 h et une stratégie de suivi de la cible sur l'utilisation.
    - id: d
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that invokes the function every minute with a warm-up event, so that execution environments stay initialized during the day.
        fr: |-
          Créer une planification Amazon EventBridge Scheduler qui appelle la fonction toutes les minutes avec un événement de préchauffage, pour que les environnements d'exécution restent initialisés pendant la journée.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Provisioned concurrency pre-initializes execution environments and is configured on a version or an alias. Application Auto Scaling can change it on a schedule for the predictable 08:00 peak and with target tracking on LambdaProvisionedConcurrencyUtilization for daytime spikes, so the company pays for the pre-initialized capacity only when it is needed; excess traffic still spills over to on-demand environments.
    fr: |-
      La simultanéité provisionnée préinitialise des environnements d'exécution et se configure sur une version ou un alias. Application Auto Scaling peut la modifier selon une planification pour la pointe prévisible de 8 h et par un suivi de la cible sur LambdaProvisionedConcurrencyUtilization pour les pics de la journée : l'entreprise ne paie la capacité préinitialisée que lorsqu'elle est nécessaire, et le trafic excédentaire bascule toujours vers des environnements à la demande.
  options:
    a:
      en: |-
        Reserved concurrency guarantees and caps concurrency at no charge, but it does not pre-initialize execution environments, so cold starts remain.
      fr: |-
        La simultanéité réservée garantit et plafonne la simultanéité sans frais, mais elle ne préinitialise pas les environnements d'exécution : les démarrages à froid subsistent.
    b:
      en: |-
        Provisioned concurrency cannot be configured on $LATEST, and a fixed peak-sized allocation would be billed all day and all night.
      fr: |-
        La simultanéité provisionnée ne peut pas être configurée sur $LATEST, et une allocation fixe dimensionnée pour la pointe serait facturée jour et nuit.
    d:
      en: |-
        A warm-up invocation keeps only a few environments initialized, not the hundreds needed when 400 concurrent requests arrive, so most requests still hit cold starts.
      fr: |-
        Un appel de préchauffage ne garde que quelques environnements initialisés, et non les centaines nécessaires quand 400 requêtes simultanées arrivent : la plupart des requêtes subissent toujours des démarrages à froid.
references:
  - title: Configuring provisioned concurrency for an Event Function - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
