id: sapc03-1c-datasync-azure-blob-enhanced
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media analytics company, Example Corp, has acquired a startup that stores 300 TB of objects in Microsoft Azure Blob Storage. Example Corp must copy the dataset to an Amazon S3 bucket in eu-west-1 and then keep the bucket synchronized every night for 3 months while the startup's applications continue to write to Azure. The security team states that no virtual machine may be deployed in Azure or in AWS for the transfer, because it does not want to patch or monitor transfer hosts. Every transferred object must be verified for integrity. The startup can issue a shared access signature (SAS) token for the container. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une société d'analyse de médias, Example Corp, a racheté une start-up qui stocke 300 To d'objets dans Microsoft Azure Blob Storage. Example Corp doit copier ce jeu de données vers un compartiment Amazon S3 dans eu-west-1, puis maintenir le compartiment synchronisé chaque nuit pendant 3 mois tandis que les applications de la start-up continuent d'écrire dans Azure. L'équipe de sécurité interdit le déploiement de toute machine virtuelle dans Azure ou dans AWS pour le transfert, car elle ne veut ni corriger ni surveiller d'hôtes de transfert. L'intégrité de chaque objet transféré doit être vérifiée. La start-up peut émettre un jeton de signature d'accès partagé (SAS) pour le conteneur. L'entreprise veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS DataSync Azure Blob Storage location that uses the SAS token and an S3 location, and run an Enhanced mode task on a nightly schedule."
        fr: "Créer un emplacement AWS DataSync Azure Blob Storage qui utilise le jeton SAS et un emplacement S3, et exécuter une tâche en mode Enhanced selon une planification nocturne."
    - id: b
      text:
        en: "Deploy an AWS DataSync agent as a virtual machine in Azure, create an Azure Blob Storage location and an S3 location, and run a Basic mode task on a nightly schedule."
        fr: "Déployer un agent AWS DataSync comme machine virtuelle dans Azure, créer un emplacement Azure Blob Storage et un emplacement S3, et exécuter une tâche en mode Basic selon une planification nocturne."
    - id: c
      text:
        en: "Create an AWS Transfer Family SFTP server that stores files in the S3 bucket, and have the startup run a nightly job in Azure that uploads new and changed blobs over SFTP."
        fr: "Créer un serveur SFTP AWS Transfer Family qui stocke les fichiers dans le compartiment S3, et faire exécuter par la start-up une tâche nocturne dans Azure qui charge en SFTP les objets blob nouveaux et modifiés."
    - id: d
      text:
        en: "Launch an Amazon EC2 instance with a nightly cron job that lists the Azure container with the SAS token, downloads changed blobs and uploads them to the S3 bucket with checksums."
        fr: "Lancer une instance Amazon EC2 avec une tâche cron nocturne qui liste le conteneur Azure avec le jeton SAS, télécharge les objets blob modifiés et les charge dans le compartiment S3 avec des sommes de contrôle."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      DataSync supports Azure Blob Storage as a location that authenticates with a SAS token. Transfers between Azure Blob Storage and Amazon S3 in Enhanced mode do not require an agent, so no virtual machine is deployed anywhere. DataSync tasks run on a schedule, copy only the data that changed and verify data integrity.
    fr: |-
      DataSync prend en charge Azure Blob Storage comme emplacement authentifié par un jeton SAS. Les transferts entre Azure Blob Storage et Amazon S3 en mode Enhanced ne nécessitent pas d'agent : aucune machine virtuelle n'est déployée. Les tâches DataSync s'exécutent selon une planification, ne copient que les données modifiées et vérifient l'intégrité des données.
  options:
    b:
      en: |-
        Basic mode needs an agent for this route, and the agent is a virtual machine that the team would have to deploy and maintain in Azure.
      fr: |-
        Le mode Basic nécessite un agent pour ce trajet, et cet agent est une machine virtuelle que l'équipe devrait déployer et maintenir dans Azure.
    c:
      en: |-
        The startup would have to build and run an upload job in Azure, which needs compute there, and change detection and integrity checks would become custom code.
      fr: |-
        La start-up devrait créer et exécuter une tâche de chargement dans Azure, ce qui exige des ressources de calcul sur place, et la détection des modifications et les contrôles d'intégrité deviendraient du code personnalisé.
    d:
      en: |-
        An EC2 instance is a transfer host that the security team forbids, and the script must handle change detection, retries and verification by itself.
      fr: |-
        Une instance EC2 est un hôte de transfert interdit par l'équipe de sécurité, et le script doit gérer lui-même la détection des modifications, les nouvelles tentatives et la vérification.
references:
  - title: Configuring transfers with Microsoft Azure Blob Storage - AWS DataSync
    url: https://docs.aws.amazon.com/datasync/latest/userguide/creating-azure-blob-location.html
