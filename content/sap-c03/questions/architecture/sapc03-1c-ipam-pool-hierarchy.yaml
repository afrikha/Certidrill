id: sapc03-1c-ipam-pool-hierarchy
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has integrated Amazon VPC IPAM with AWS Organizations by using a delegated networking account. The company operates in us-east-1 and eu-west-1 and has separate OUs for production and development. Production VPCs must receive only /22 CIDR blocks and development VPCs only /24 CIDR blocks, from different ranges in each Region. Accounts in the development OU must not be able to allocate production ranges.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise a intégré Amazon VPC IPAM à AWS Organizations à l'aide d'un compte réseau délégué. Elle opère dans us-east-1 et eu-west-1 et possède des unités d'organisation (UO) distinctes pour la production et le développement. Les VPC de production ne doivent recevoir que des blocs CIDR /22 et les VPC de développement que des blocs /24, issus de plages différentes dans chaque Région. Les comptes de l'UO de développement ne doivent pas pouvoir allouer de plages de production.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create one top-level pool with no locale, and have application teams allocate their VPC CIDR blocks directly from it with the netmask length that matches their environment."
        fr: "Créer un seul pool de premier niveau sans paramètre régional (locale), et faire allouer directement par les équipes applicatives leurs blocs CIDR de VPC depuis ce pool avec la longueur de masque de leur environnement."
    - id: b
      text:
        en: "Create a top-level pool with the company supernet, Regional pools for us-east-1 and eu-west-1 under it, and production and development pools under each Regional pool with the locale set to the Region."
        fr: "Créer un pool de premier niveau avec le super-réseau de l'entreprise, des pools régionaux pour us-east-1 et eu-west-1 en dessous, et des pools de production et de développement sous chaque pool régional avec le paramètre régional défini sur la Région."
    - id: c
      text:
        en: "Create the pools in the organization's management account instead of the networking account so that all accounts inherit access to them."
        fr: "Créer les pools dans le compte de gestion de l'organisation plutôt que dans le compte réseau pour que tous les comptes en héritent l'accès."
    - id: d
      text:
        en: "Create the pools in the public scope of the IPAM so that they can be shared with accounts in other OUs."
        fr: "Créer les pools dans l'étendue publique de l'IPAM pour qu'ils puissent être partagés avec des comptes d'autres UO."
    - id: e
      text:
        en: "Set allocation rules on each environment pool for the allowed netmask length, and share each environment pool through AWS RAM only with the OU of that environment."
        fr: "Définir sur chaque pool d'environnement des règles d'allocation pour la longueur de masque autorisée, et partager chaque pool d'environnement par AWS RAM uniquement avec l'UO de cet environnement."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      A pool hierarchy maps the address plan to Regions and environments, and VPCs allocate their CIDR blocks from pools whose locale matches their Region. Allocation rules restrict the netmask lengths that a pool hands out, and sharing each environment pool through AWS RAM only with its OU keeps development accounts out of production ranges.
    fr: |-
      Une hiérarchie de pools reflète le plan d'adressage par Région et par environnement, et les VPC allouent leurs blocs CIDR depuis des pools dont le paramètre régional correspond à leur Région. Les règles d'allocation limitent les longueurs de masque qu'un pool distribue, et partager chaque pool d'environnement par AWS RAM uniquement avec son UO tient les comptes de développement à l'écart des plages de production.
  options:
    a:
      en: |-
        VPCs allocate from pools whose locale matches their Region, and a single pool cannot apply different netmask rules or keep the environments apart.
      fr: |-
        Les VPC allouent depuis des pools dont le paramètre régional correspond à leur Région, et un pool unique ne peut ni appliquer des règles de masque différentes ni séparer les environnements.
    c:
      en: |-
        The management account cannot be the IPAM account, and pools are not inherited; member accounts use pools that are shared with them through AWS RAM.
      fr: |-
        Le compte de gestion ne peut pas être le compte IPAM, et les pools ne s'héritent pas ; les comptes membres utilisent les pools partagés avec eux par AWS RAM.
    d:
      en: |-
        Private VPC ranges belong in the private scope, and the scope does not control which accounts a pool is shared with.
      fr: |-
        Les plages privées des VPC relèvent de l'étendue privée, et l'étendue ne détermine pas les comptes avec lesquels un pool est partagé.
references:
  - title: Plan for IP address provisioning - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/planning-ipam.html
  - title: Monitor CIDR usage by resource - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/monitor-cidr-compliance-ipam.html
