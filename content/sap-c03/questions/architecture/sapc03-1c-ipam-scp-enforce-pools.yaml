id: sapc03-1c-ipam-scp-enforce-pools
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 250 accounts in AWS Organizations and lets application teams create their own VPCs. Several outages were caused by VPC CIDR blocks that overlapped with other VPCs or with on-premises ranges. The network team has defined an address plan with separate ranges per Region and per environment. The team wants every new VPC CIDR block to come from that plan, wants to block any VPC created with a manually chosen range and wants to see the IP usage of all accounts. Teams must keep creating VPCs by themselves.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise possède 250 comptes dans AWS Organizations et laisse les équipes applicatives créer leurs propres VPC. Plusieurs pannes ont été causées par des blocs CIDR de VPC qui chevauchaient d'autres VPC ou des plages sur site. L'équipe réseau a défini un plan d'adressage avec des plages distinctes par Région et par environnement. Elle veut que chaque nouveau bloc CIDR de VPC provienne de ce plan, bloquer tout VPC créé avec une plage choisie manuellement et voir l'utilisation des adresses IP de tous les comptes. Les équipes doivent continuer à créer leurs VPC elles-mêmes.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Publish the address plan on an internal wiki, and deploy an AWS Config rule that sends an alert when a new VPC CIDR block overlaps another VPC in the organization."
        fr: "Publier le plan d'adressage sur un wiki interne, et déployer une règle AWS Config qui envoie une alerte lorsqu'un nouveau bloc CIDR de VPC chevauche un autre VPC de l'organisation."
    - id: b
      text:
        en: "Create an Amazon VPC IPAM in the organization's management account, create pools from the address plan in it, and share the pools with the application accounts through AWS RAM."
        fr: "Créer un Amazon VPC IPAM dans le compte de gestion de l'organisation, y créer des pools à partir du plan d'adressage, et partager les pools avec les comptes applicatifs par AWS RAM."
    - id: c
      text:
        en: "Have the network team create every VPC on request with AWS CloudFormation StackSets, and remove the ec2:CreateVpc permission from the application teams' roles."
        fr: "Faire créer chaque VPC à la demande par l'équipe réseau avec AWS CloudFormation StackSets, et retirer l'autorisation ec2:CreateVpc des rôles des équipes applicatives."
    - id: d
      text:
        en: "Delegate a member account for IPAM, create Regional and environment pools, share them through AWS RAM, and add an SCP that denies ec2:CreateVpc when no IPAM pool ID is given."
        fr: "Déléguer un compte membre pour IPAM, créer des pools régionaux et par environnement, les partager par AWS RAM, et ajouter une SCP qui refuse ec2:CreateVpc lorsqu'aucun ID de pool IPAM n'est fourni."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Delegating an IPAM account lets IPAM monitor IP usage across all member accounts and lets members allocate CIDR blocks from pools shared through AWS RAM. An SCP that denies ec2:CreateVpc and ec2:AssociateVpcCidrBlock when the request specifies no IPAM pool blocks manually chosen ranges while teams keep their self-service.
    fr: |-
      Déléguer un compte IPAM permet à IPAM de surveiller l'utilisation des adresses IP dans tous les comptes membres et permet aux membres d'allouer des blocs CIDR depuis des pools partagés par AWS RAM. Une SCP qui refuse ec2:CreateVpc et ec2:AssociateVpcCidrBlock lorsque la requête n'indique aucun pool IPAM bloque les plages choisies manuellement, tout en préservant le libre-service des équipes.
  options:
    a:
      en: |-
        A wiki and a detective rule do not prevent overlapping VPCs; they only report them after creation.
      fr: |-
        Un wiki et une règle de détection n'empêchent pas les VPC qui se chevauchent ; ils ne les signalent qu'après leur création.
    b:
      en: |-
        The IPAM account must be a member account, not the management account, and nothing in this design blocks manually chosen ranges.
      fr: |-
        Le compte IPAM doit être un compte membre, pas le compte de gestion, et rien dans cette conception ne bloque les plages choisies manuellement.
    c:
      en: |-
        Centralizing VPC creation removes the self-service that teams must keep and adds work for the network team.
      fr: |-
        Centraliser la création des VPC supprime le libre-service que les équipes doivent conserver et ajoute du travail à l'équipe réseau.
references:
  - title: Enforce IPAM use for VPC creation with SCPs - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/scp-ipam.html
  - title: Integrate IPAM with accounts in an AWS Organization - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/enable-integ-ipam.html
