id: sapc03-1c-dns-inbound-endpoint-forwarder
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts internal applications in a VPC in eu-west-1 and publishes their names in an Amazon Route 53 private hosted zone named aws.example.internal. The on-premises data center connects to the VPC through AWS Direct Connect. On-premises Windows DNS servers resolve all corporate names and must now also resolve the names in aws.example.internal. The internal names must not be resolvable from the internet.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge des applications internes dans un VPC de eu-west-1 et publie leurs noms dans une zone hébergée privée Amazon Route 53 nommée aws.example.internal. Le centre de données sur site est relié au VPC par AWS Direct Connect. Des serveurs DNS Windows sur site résolvent tous les noms de l'entreprise et doivent désormais résoudre aussi les noms de aws.example.internal. Les noms internes ne doivent pas pouvoir être résolus depuis Internet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Route 53 Resolver outbound endpoint in the VPC and a forwarding rule for aws.example.internal that targets the on-premises DNS servers."
        fr: "Créer un point de terminaison sortant Route 53 Resolver dans le VPC et une règle de transfert pour aws.example.internal qui cible les serveurs DNS sur site."
    - id: b
      text:
        en: "Create a Route 53 Resolver inbound endpoint in the VPC, and add an on-premises conditional forwarder for aws.example.internal that targets the endpoint's IP addresses."
        fr: "Créer un point de terminaison entrant Route 53 Resolver dans le VPC, et ajouter sur site un redirecteur conditionnel pour aws.example.internal qui cible les adresses IP du point de terminaison."
    - id: c
      text:
        en: "Add a conditional forwarder for aws.example.internal on the on-premises DNS servers that targets the Amazon-provided DNS server at the VPC CIDR base address plus two."
        fr: "Ajouter sur les serveurs DNS sur site un redirecteur conditionnel pour aws.example.internal qui cible le serveur DNS fourni par Amazon à l'adresse de base du CIDR du VPC plus deux."
    - id: d
      text:
        en: "Publish the records in a Route 53 public hosted zone for aws.example.com, and have the on-premises DNS servers resolve the names through the internet."
        fr: "Publier les enregistrements dans une zone hébergée publique Route 53 pour aws.example.com, et faire résoudre les noms par les serveurs DNS sur site via Internet."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An inbound endpoint gives Route 53 Resolver private IP addresses in the VPC that on-premises resolvers can reach over Direct Connect. A conditional forwarder for the zone sends those queries to the endpoint, and Resolver answers from the private hosted zone associated with the VPC.
    fr: |-
      Un point de terminaison entrant donne à Route 53 Resolver des adresses IP privées dans le VPC que les résolveurs sur site peuvent joindre par Direct Connect. Un redirecteur conditionnel pour la zone envoie ces requêtes au point de terminaison, et Resolver répond à partir de la zone hébergée privée associée au VPC.
  options:
    a:
      en: |-
        An outbound endpoint forwards queries from the VPC to the on-premises network, which is the opposite direction.
      fr: |-
        Un point de terminaison sortant transfère des requêtes du VPC vers le réseau sur site, c'est-à-dire dans le sens inverse.
    c:
      en: |-
        The Amazon-provided DNS server answers queries from inside the VPC; on-premises resolvers must send their queries to an inbound endpoint.
      fr: |-
        Le serveur DNS fourni par Amazon répond aux requêtes provenant de l'intérieur du VPC ; les résolveurs sur site doivent envoyer leurs requêtes à un point de terminaison entrant.
    d:
      en: |-
        A public hosted zone makes the names resolvable from the internet, which the requirements forbid.
      fr: |-
        Une zone hébergée publique rend les noms résolubles depuis Internet, ce que les exigences interdisent.
references:
  - title: Forwarding inbound DNS queries to your VPCs - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-forwarding-inbound-queries.html
