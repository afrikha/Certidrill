id: sapc03-1c-r53-ip-based-isp
objective: "1.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company runs its collaboration service in us-west-2 and us-east-1, and Route 53 latency records currently route all users. A large telecommunications partner has a private interconnect with the company's endpoint in us-west-2, and data transfer over that path costs the company much less than over the internet. The partner's subscribers use the partner's DNS resolvers, and the partner has supplied the CIDR blocks from which those resolvers send their queries. Subscribers of the partner must always be routed to us-west-2, and all other users must continue to be routed by latency.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exploite son service de collaboration dans us-west-2 et us-east-1, et des enregistrements de latence Route 53 routent actuellement tous les utilisateurs. Un grand opérateur de télécommunications partenaire dispose d'une interconnexion privée avec le point de terminaison de l'éditeur dans us-west-2, et le transfert de données par ce chemin coûte bien moins cher à l'éditeur que par Internet. Les abonnés du partenaire utilisent les résolveurs DNS du partenaire, et celui-ci a fourni les blocs CIDR depuis lesquels ces résolveurs envoient leurs requêtes. Les abonnés du partenaire doivent toujours être routés vers us-west-2, et tous les autres utilisateurs doivent continuer à être routés selon la latence.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create geolocation records that send queries from the partner's home country to us-west-2, and use latency records behind the default location for all other users."
        fr: "Créer des enregistrements de géolocalisation qui envoient vers us-west-2 les requêtes du pays du partenaire, et utiliser des enregistrements de latence derrière l'emplacement par défaut pour tous les autres utilisateurs."
    - id: b
      text:
        en: "Create geoproximity records with a positive bias on us-west-2 that is large enough to cover the partner's whole service area, in place of the existing latency records."
        fr: "Créer des enregistrements de géoproximité avec un biais positif sur us-west-2 suffisamment grand pour couvrir toute la zone de service du partenaire, à la place des enregistrements de latence existants."
    - id: c
      text:
        en: "Create weighted records for us-west-2 and us-east-1 whose weights match the partner's share of the company's users, in place of the existing latency records."
        fr: "Créer des enregistrements pondérés pour us-west-2 et us-east-1 dont les poids reflètent la part du partenaire dans les utilisateurs de l'éditeur, à la place des enregistrements de latence existants."
    - id: d
      text:
        en: "Create a CIDR collection with a location for the partner's CIDR blocks, an IP-based record for it that points to us-west-2, and a default IP-based record that aliases the latency records."
        fr: "Créer une collection CIDR avec un emplacement pour les blocs CIDR du partenaire, un enregistrement basé sur l'IP pour cet emplacement qui pointe vers us-west-2, et un enregistrement basé sur l'IP par défaut, alias des enregistrements de latence."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      IP-based routing maps CIDR blocks, grouped into CIDR locations within a CIDR collection, to records, and queries that match no configured CIDR receive the record for the default location. AWS cites routing the users of specific ISPs to specific endpoints to optimize transit costs as a use case.
    fr: |-
      Le routage basé sur l'IP associe des blocs CIDR, regroupés en emplacements CIDR au sein d'une collection CIDR, à des enregistrements, et les requêtes qui ne correspondent à aucun CIDR configuré reçoivent l'enregistrement de l'emplacement par défaut. AWS cite comme cas d'usage le routage des utilisateurs de certains fournisseurs d'accès vers des points de terminaison précis pour optimiser les coûts de transit.
  options:
    a:
      en: |-
        Geolocation routes everyone in the country, not just the partner's subscribers, and subscribers elsewhere would be missed.
      fr: |-
        La géolocalisation route tous les utilisateurs du pays, pas seulement les abonnés du partenaire, et les abonnés situés ailleurs seraient oubliés.
    b:
      en: |-
        A geoproximity bias moves geographic boundaries for all users in the area, regardless of their provider.
      fr: |-
        Un biais de géoproximité déplace les frontières géographiques pour tous les utilisateurs de la zone, quel que soit leur fournisseur.
    c:
      en: |-
        Weighted routing chooses records in proportion to their weights, so the partner's subscribers would not reliably reach us-west-2.
      fr: |-
        Le routage pondéré choisit les enregistrements en proportion de leurs poids : les abonnés du partenaire n'atteindraient pas systématiquement us-west-2.
references:
  - title: IP-based routing - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-ipbased.html
