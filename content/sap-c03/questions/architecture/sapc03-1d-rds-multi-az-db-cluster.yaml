id: sapc03-1d-rds-multi-az-db-cluster
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare software company runs an Amazon RDS for PostgreSQL Multi-AZ DB instance deployment. The database must stay on RDS for PostgreSQL because the company has certified a specific engine version and extension set, and that version supports Multi-AZ DB clusters. Reporting queries now compete with transactions on the primary instance, while the company pays for a standby that serves no traffic. The company wants the automatic failover targets themselves to serve read traffic. The company also wants lower transaction commit latency than the current deployment provides.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels de santé exploite un déploiement d'instance de base de données Multi-AZ Amazon RDS for PostgreSQL. La base de données doit rester sur RDS for PostgreSQL, car l'entreprise a certifié une version du moteur et un ensemble d'extensions précis, et cette version prend en charge les clusters de bases de données Multi-AZ. Les requêtes de reporting entrent désormais en concurrence avec les transactions sur l'instance principale, alors que l'entreprise paie une instance de secours qui ne sert aucun trafic. L'entreprise veut que les cibles du basculement automatique servent elles-mêmes le trafic de lecture. Elle veut aussi une latence de validation des transactions plus faible que celle du déploiement actuel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy an RDS for PostgreSQL Multi-AZ DB cluster with one writer and two reader instances in three Availability Zones, and send reporting to its reader endpoint."
        fr: "Déployer un cluster de bases de données Multi-AZ RDS for PostgreSQL avec un enregistreur et deux instances de lecture dans trois zones de disponibilité, et envoyer le reporting vers son point de terminaison de lecteur."
    - id: b
      text:
        en: "Keep the Multi-AZ DB instance deployment, and send the reporting connections to the endpoint of the standby instance in the other Availability Zone."
        fr: "Conserver le déploiement d'instance de base de données Multi-AZ, et envoyer les connexions de reporting vers le point de terminaison de l'instance de secours dans l'autre zone de disponibilité."
    - id: c
      text:
        en: "Keep the Multi-AZ DB instance deployment, and add two read replicas in other Availability Zones for the reporting connections."
        fr: "Conserver le déploiement d'instance de base de données Multi-AZ, et ajouter deux réplicas en lecture dans d'autres zones de disponibilité pour les connexions de reporting."
    - id: d
      text:
        en: "Migrate the database to an Amazon Aurora PostgreSQL DB cluster with two Aurora Replicas, and send reporting to the cluster's reader endpoint."
        fr: "Migrer la base de données vers un cluster de bases de données Amazon Aurora PostgreSQL avec deux réplicas Aurora, et envoyer le reporting vers le point de terminaison de lecteur du cluster."
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Multi-AZ DB cluster has one writer and two reader instances in three Availability Zones; the readers serve read traffic through the reader endpoint and are the automatic failover targets. A commit needs acknowledgment from only one reader through semisynchronous replication, and RDS states that Multi-AZ DB clusters offer lower write latency than Multi-AZ DB instance deployments.
    fr: |
      Un cluster de bases de données Multi-AZ comporte un enregistreur et deux instances de lecture dans trois zones de disponibilité ; les lecteurs servent le trafic de lecture via le point de terminaison de lecteur et sont les cibles du basculement automatique. Une validation n'exige l'accusé de réception que d'un seul lecteur grâce à la réplication semi-synchrone, et RDS indique que les clusters de bases de données Multi-AZ offrent une latence d'écriture plus faible que les déploiements d'instance de base de données Multi-AZ.
  options:
    b:
      en: |
        The standby of a Multi-AZ DB instance deployment does not accept connections or serve reads; it exists only for failover.
      fr: |
        L'instance de secours d'un déploiement d'instance de base de données Multi-AZ n'accepte pas de connexions et ne sert pas de lectures ; elle n'existe que pour le basculement.
    c:
      en: |
        Read replicas serve reads, but they are not the automatic failover targets, the idle standby remains, and commit latency does not improve.
      fr: |
        Les réplicas en lecture servent des lectures, mais ils ne sont pas les cibles du basculement automatique, l'instance de secours inactive subsiste, et la latence de validation ne s'améliore pas.
    d:
      en: |
        Aurora PostgreSQL is a different engine from RDS for PostgreSQL, so it breaks the requirement to stay on the certified RDS deployment.
      fr: |
        Aurora PostgreSQL est un moteur différent de RDS for PostgreSQL : il enfreint l'exigence de rester sur le déploiement RDS certifié.
references:
  - title: Multi-AZ DB cluster deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html
  - title: Connecting to a Multi-AZ DB cluster for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts-connection-management.html
