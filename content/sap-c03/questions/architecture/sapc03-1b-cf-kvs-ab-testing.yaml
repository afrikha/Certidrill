id: sapc03-1b-cf-kvs-ab-testing
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A global e-commerce company serves its storefront through Amazon CloudFront at more than 2 million requests per second during peak events. The marketing team runs A/B tests: on each viewer request, a function must assign the viewer to a variant based on a cookie and rewrite the URL to the variant's path before CloudFront checks its cache. Marketing changes the test definitions and traffic splits several times a day, and these changes must take effect without deploying new function code. The logic runs in well under a millisecond and uses no third-party libraries. The company wants the lowest cost and the lowest added latency.

    Which solution will meet these requirements?
  fr: |
    Une entreprise mondiale de commerce en ligne sert sa boutique via Amazon CloudFront, à plus de 2 millions de requêtes par seconde lors des pics. L'équipe marketing mène des tests A/B : à chaque requête de l'utilisateur, une fonction doit attribuer l'utilisateur à une variante selon un cookie et réécrire l'URL vers le chemin de la variante avant que CloudFront ne consulte son cache. Le marketing modifie les définitions des tests et la répartition du trafic plusieurs fois par jour, et ces modifications doivent prendre effet sans déployer de nouveau code de fonction. La logique s'exécute en bien moins d'une milliseconde et n'utilise aucune bibliothèque tierce. L'entreprise veut le coût le plus bas et la latence ajoutée la plus faible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Associate a Lambda@Edge function with the viewer request event that reads the test definitions from Lambda environment variables, which the marketing tool updates after each change."
        fr: "Associer à l'événement de requête de l'utilisateur (viewer request) une fonction Lambda@Edge qui lit les définitions des tests dans des variables d'environnement Lambda, mises à jour par l'outil marketing après chaque modification."
    - id: b
      text:
        en: "Associate a Lambda@Edge function with the origin request event that reads the test definitions from an Amazon DynamoDB global table and rewrites the URL to the variant's path."
        fr: "Associer à l'événement de requête à l'origine (origin request) une fonction Lambda@Edge qui lit les définitions des tests dans une table globale Amazon DynamoDB et réécrit l'URL vers le chemin de la variante."
    - id: c
      text:
        en: "Associate a CloudFront Functions function on JavaScript runtime 2.0 with the viewer request event, and have it read the test definitions from a CloudFront KeyValueStore that marketing updates through the API."
        fr: "Associer à l'événement de requête de l'utilisateur une fonction CloudFront Functions sur l'environnement d'exécution JavaScript 2.0, et lui faire lire les définitions des tests dans un CloudFront KeyValueStore que le marketing met à jour via l'API."
    - id: d
      text:
        en: "Associate a CloudFront Functions function on JavaScript runtime 1.0 with the viewer request event, with the test definitions embedded in the code and the function republished after each change."
        fr: "Associer à l'événement de requête de l'utilisateur une fonction CloudFront Functions sur l'environnement d'exécution JavaScript 1.0, avec les définitions des tests intégrées au code et la fonction republiée après chaque modification."
answer: { optionId: c }
explanation:
  correct:
    en: "CloudFront Functions run on viewer requests before the cache lookup, scale to millions of requests per second and cost less than Lambda@Edge. With JavaScript runtime 2.0, a function can read a CloudFront KeyValueStore, whose data is updated independently of the function code, so test changes need no code deployment."
    fr: "CloudFront Functions s'exécute sur les requêtes des utilisateurs avant la consultation du cache, monte jusqu'à des millions de requêtes par seconde et coûte moins cher que Lambda@Edge. Avec l'environnement d'exécution JavaScript 2.0, une fonction peut lire un CloudFront KeyValueStore, dont les données sont mises à jour indépendamment du code : les modifications de tests ne demandent aucun déploiement de code."
  options:
    a:
      en: "Lambda@Edge does not support environment variables, and it scales to about 10,000 requests per second per Region, far below the peak load."
      fr: "Lambda@Edge ne prend pas en charge les variables d'environnement, et il monte jusqu'à environ 10 000 requêtes par seconde par Région, bien en dessous de la charge de pointe."
    b:
      en: "Origin request functions run only on cache misses, after the cache lookup, so the variant would not be part of the lookup; the DynamoDB call also adds latency and cost."
      fr: "Les fonctions de requête à l'origine ne s'exécutent qu'en cas d'échec de cache, après la consultation du cache : la variante ne ferait pas partie de la recherche, et l'appel DynamoDB ajoute de la latence et des coûts."
    d:
      en: "Embedding the definitions requires publishing new function code for every change, which the requirement forbids; KeyValueStore needs runtime 2.0."
      fr: "Intégrer les définitions oblige à publier un nouveau code de fonction à chaque modification, ce que l'exigence interdit ; KeyValueStore exige l'environnement d'exécution 2.0."
references:
  - title: Amazon CloudFront KeyValueStore
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/kvs-with-functions.html
  - title: Differences between CloudFront Functions and Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
