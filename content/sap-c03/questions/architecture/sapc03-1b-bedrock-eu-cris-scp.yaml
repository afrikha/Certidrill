id: sapc03-1b-bedrock-eu-cris-scp
objective: "1.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany, a European bank, runs a customer service assistant in an application account in the eu-west-3 Region. The assistant calls a foundation model in Amazon Bedrock with on-demand inference by using the model ID. At peak times, requests are throttled, and the account already has the highest on-demand quota available for the model in eu-west-3. The model is offered through a system-defined EU cross-Region inference profile. Regulators require that prompts and responses are processed only in AWS Regions of the European Union. The organization applies an SCP that denies all actions outside eu-west-3 based on the aws:RequestedRegion condition key. The bank wants more throughput without a long-term commitment.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, une banque européenne, exécute un assistant de service client dans un compte applicatif de la Région eu-west-3. L'assistant appelle un modèle de fondation d'Amazon Bedrock en inférence à la demande avec l'ID du modèle. Aux heures de pointe, les requêtes sont limitées, et le compte dispose déjà du quota à la demande le plus élevé possible pour le modèle dans eu-west-3. Le modèle est proposé via un profil d'inférence interrégionale (cross-Region inference) EU défini par le système. Les régulateurs exigent que les invites et les réponses ne soient traitées que dans des Régions AWS de l'Union européenne. L'organisation applique une SCP qui refuse toute action hors de eu-west-3 selon la clé de condition aws:RequestedRegion. La banque veut plus de débit sans engagement à long terme.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Call the global cross-Region inference profile of the model instead of the model ID, and add an exception to the SCP for requests whose aws:RequestedRegion value is unspecified."
        fr: "Appeler le profil d'inférence interrégionale global du modèle au lieu de l'ID du modèle, et ajouter à la SCP une exception pour les requêtes dont la valeur aws:RequestedRegion est unspecified."
    - id: b
      text:
        en: "Call the EU cross-Region inference profile instead of the model ID, and keep the SCP unchanged because cross-Region inference reaches Regions that are not enabled in the account."
        fr: "Appeler le profil d'inférence interrégionale EU au lieu de l'ID du modèle, et conserver la SCP inchangée puisque l'inférence interrégionale atteint des Régions qui ne sont pas activées dans le compte."
    - id: c
      text:
        en: "Call the EU cross-Region inference profile instead of the model ID, and update the SCP so that the Bedrock invocation actions are allowed in every destination Region listed in the profile."
        fr: "Appeler le profil d'inférence interrégionale EU au lieu de l'ID du modèle, et mettre à jour la SCP pour que les actions d'invocation Bedrock soient autorisées dans chaque Région de destination listée dans le profil."
    - id: d
      text:
        en: "Create an application inference profile from the eu-west-3 foundation model, tag it for the assistant, and call the application inference profile instead of the model ID."
        fr: "Créer un profil d'inférence d'application à partir du modèle de fondation de eu-west-3, l'étiqueter pour l'assistant, et appeler ce profil d'inférence d'application au lieu de l'ID du modèle."
answer: { optionId: c }
explanation:
  correct:
    en: "A geographic cross-Region inference profile routes each request to a Region inside its geography, here the EU, which adds throughput on demand while meeting data residency. Geographic profiles require SCPs to allow all destination Regions of the profile, so the Region-restricting SCP must allow the Bedrock invocation actions in those EU Regions."
    fr: "Un profil d'inférence interrégionale géographique achemine chaque requête vers une Région de sa zone géographique, ici l'UE, ce qui ajoute du débit à la demande tout en respectant la résidence des données. Les profils géographiques exigent que les SCP autorisent toutes les Régions de destination du profil : la SCP qui restreint les Régions doit donc autoriser les actions d'invocation Bedrock dans ces Régions de l'UE."
  options:
    a:
      en: "A global profile can route requests to any supported commercial Region worldwide, which breaks the EU processing requirement."
      fr: "Un profil global peut acheminer les requêtes vers n'importe quelle Région commerciale prise en charge dans le monde, ce qui enfreint l'exigence de traitement dans l'UE."
    b:
      en: "Manual Region enablement is not needed, but SCPs are still evaluated: the current SCP denies the requests that the profile routes to other EU Regions."
      fr: "L'activation manuelle des Régions n'est pas nécessaire, mais les SCP restent évaluées : la SCP actuelle refuse les requêtes que le profil achemine vers d'autres Régions de l'UE."
    d:
      en: "An application inference profile created from a single-Region model only tracks cost and usage; it still routes every request to eu-west-3 and adds no throughput."
      fr: "Un profil d'inférence d'application créé à partir d'un modèle d'une seule Région ne fait que suivre les coûts et l'utilisation : il achemine toujours chaque requête vers eu-west-3 et n'ajoute aucun débit."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
  - title: Set up a model invocation resource using inference profiles
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/inference-profiles.html
