id: sapc03-1c-peering-two-vpc-cost
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an analytics VPC and a data lake VPC in the same account and Region. Analytics jobs on Amazon EC2 read about 200 TB per month from database servers in the data lake VPC. The VPC CIDR blocks do not overlap, and no other VPC or on-premises network needs to reach either VPC. Traffic must stay on private connectivity. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite un VPC d'analytique et un VPC de lac de données dans le même compte et la même Région. Des tâches d'analytique sur Amazon EC2 lisent environ 200 To par mois depuis des serveurs de bases de données du VPC de lac de données. Les blocs CIDR des VPC ne se chevauchent pas, et aucun autre VPC ni réseau sur site n'a besoin de joindre l'un ou l'autre VPC. Le trafic doit rester sur une connectivité privée. L'entreprise veut la solution la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach both VPCs to a transit gateway, and add routes in each VPC's route tables that send traffic for the other VPC to the transit gateway."
        fr: "Attacher les deux VPC à une passerelle de transit (transit gateway), et ajouter dans les tables de routage de chaque VPC des routes qui envoient le trafic destiné à l'autre VPC vers la passerelle de transit."
    - id: b
      text:
        en: "Create an AWS PrivateLink endpoint service for the database servers behind a Network Load Balancer, and create an interface endpoint for it in the analytics VPC."
        fr: "Créer un service de point de terminaison AWS PrivateLink pour les serveurs de bases de données derrière un Network Load Balancer, et créer un point de terminaison d'interface vers ce service dans le VPC d'analytique."
    - id: c
      text:
        en: "Create a VPC peering connection between the two VPCs, and add routes in each VPC's route tables that send traffic for the other VPC's CIDR block to the peering connection."
        fr: "Créer une connexion d'appairage de VPC entre les deux VPC, et ajouter dans les tables de routage de chaque VPC des routes qui envoient le trafic destiné au bloc CIDR de l'autre VPC vers la connexion d'appairage."
    - id: d
      text:
        en: "Run software VPN appliances on Amazon EC2 in each VPC, and route the traffic between the VPCs through an IPsec tunnel between the appliances."
        fr: "Exécuter des appliances VPN logicielles sur Amazon EC2 dans chaque VPC, et router le trafic entre les VPC par un tunnel IPsec entre les appliances."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      VPC peering connects two VPCs with non-overlapping CIDR blocks over private AWS connectivity, with no hourly attachment charge and no per-GB processing charge; only data transfer applies, for example for traffic that crosses Availability Zones. Peering is not transitive, which does not matter because no other network needs access.
    fr: |-
      L'appairage de VPC relie deux VPC dont les blocs CIDR ne se chevauchent pas par une connectivité AWS privée, sans frais horaires d'attachement ni frais de traitement par Go ; seul le transfert de données s'applique, par exemple pour le trafic qui traverse des zones de disponibilité. L'appairage n'est pas transitif, ce qui n'a pas d'importance puisqu'aucun autre réseau n'a besoin d'accès.
  options:
    a:
      en: |-
        A transit gateway charges for each VPC attachment hour and for every gigabyte it processes, which adds significant cost at 200 TB per month.
      fr: |-
        Une passerelle de transit facture chaque heure d'attachement de VPC et chaque gigaoctet traité, ce qui ajoute un coût important à 200 To par mois.
    b:
      en: |-
        PrivateLink adds interface endpoint hourly and per-GB data processing charges, plus the cost of a Network Load Balancer.
      fr: |-
        PrivateLink ajoute des frais horaires de point de terminaison d'interface et des frais de traitement par Go, plus le coût d'un Network Load Balancer.
    d:
      en: |-
        VPN appliances add instance costs, operational work and tunnel throughput limits.
      fr: |-
        Des appliances VPN ajoutent des coûts d'instances, du travail d'exploitation et des limites de débit des tunnels.
references:
  - title: How VPC peering connections work - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
