id: sapc03-1a-ecs-deployment-rollback
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs its microservices as Amazon ECS services on AWS Fargate behind an Application Load Balancer and deploys them with rolling updates. Last month, a new image started correctly and its tasks passed the target group health checks, but the application returned HTTP 5xx errors to users until an engineer rolled back manually. In another release, the new tasks crashed at startup and the deployment stayed in progress for hours. The company wants ECS to roll back automatically to the last working deployment in both situations. The company wants to keep rolling updates and the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute ses microservices sous forme de services Amazon ECS sur AWS Fargate derrière un Application Load Balancer et les déploie par mises à jour propagées (rolling updates). Le mois dernier, une nouvelle image a démarré correctement et ses tâches ont réussi les vérifications de l'état du groupe cible, mais l'application a renvoyé des erreurs HTTP 5xx aux utilisateurs jusqu'à ce qu'un ingénieur effectue une restauration manuelle. Lors d'une autre version, les nouvelles tâches ont planté au démarrage et le déploiement est resté en cours pendant des heures. L'entreprise veut qu'ECS revienne automatiquement au dernier déploiement fonctionnel dans les deux situations. Elle veut conserver les mises à jour propagées et le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on the deployment circuit breaker with the rollback option for each service so that ECS automatically rolls back the deployments that fail.
        fr: |-
          Activer le disjoncteur de déploiement (deployment circuit breaker) avec l'option de restauration pour chaque service, afin qu'ECS restaure automatiquement les déploiements qui échouent.
    - id: b
      text:
        en: |-
          Turn on the deployment circuit breaker with rollback, and add Amazon CloudWatch alarms on the load balancer 5xx error metrics to the deployment configuration with rollback enabled.
        fr: |-
          Activer le disjoncteur de déploiement avec restauration, et ajouter à la configuration de déploiement des alarmes Amazon CloudWatch sur les métriques d'erreurs 5xx de l'équilibreur de charge, avec la restauration activée.
    - id: c
      text:
        en: |-
          Create an Amazon EventBridge rule on ECS deployment state change events that invokes an AWS Lambda function to update each service to the previous task definition when errors increase.
        fr: |-
          Créer une règle Amazon EventBridge sur les événements de changement d'état des déploiements ECS qui appelle une fonction AWS Lambda pour remettre chaque service sur la définition de tâche précédente quand les erreurs augmentent.
    - id: d
      text:
        en: |-
          Set the minimum healthy percent of each service to 100% and increase the health check grace period, so that old tasks keep running until the new tasks are healthy.
        fr: |-
          Définir le pourcentage minimal d'intégrité de chaque service sur 100 % et augmenter la période de grâce de la vérification de l'état, pour que les anciennes tâches continuent de s'exécuter jusqu'à ce que les nouvelles tâches soient saines.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Amazon ECS offers two failure detection methods for rolling and blue/green deployments: the deployment circuit breaker and CloudWatch alarms, and either one can trigger a rollback to the last completed deployment when both are configured. The circuit breaker catches tasks that fail to start, and an alarm on 5xx errors catches a release whose tasks are healthy for the load balancer but fail for users.
    fr: |-
      Amazon ECS propose deux méthodes de détection des échecs pour les déploiements propagés et bleu/vert : le disjoncteur de déploiement et les alarmes CloudWatch ; quand les deux sont configurées, chacune peut déclencher une restauration vers le dernier déploiement terminé. Le disjoncteur détecte les tâches qui ne démarrent pas, et une alarme sur les erreurs 5xx détecte une version dont les tâches sont saines pour l'équilibreur de charge mais échouent pour les utilisateurs.
  options:
    a:
      en: |-
        The circuit breaker alone handles tasks that fail to start, but tasks that pass health checks while returning 5xx errors would not trigger a rollback.
      fr: |-
        Le disjoncteur seul gère les tâches qui ne démarrent pas, mais des tâches qui réussissent les vérifications de l'état tout en renvoyant des erreurs 5xx ne déclencheraient pas de restauration.
    c:
      en: |-
        A custom rollback function rebuilds a feature that ECS provides natively, which adds code and operational overhead.
      fr: |-
        Une fonction de restauration personnalisée reconstruit une fonctionnalité qu'ECS fournit nativement, ce qui ajoute du code et de la charge opérationnelle.
    d:
      en: |-
        These settings change the pace of the deployment but never roll it back, so a faulty release still replaces the working tasks or stays stuck.
      fr: |-
        Ces paramètres modifient le rythme du déploiement mais ne le restaurent jamais : une version défectueuse remplace toujours les tâches fonctionnelles ou reste bloquée.
references:
  - title: Amazon ECS deployment failure detection - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/deployment-failure-detection.html
