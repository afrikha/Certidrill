id: sapc03-1d-redshift-datashare-bu
objective: "1.5.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail group runs a central Amazon Redshift provisioned cluster with RA3 nodes in a data platform account. The cluster loads and curates sales data throughout the day. Five business units, each with its own AWS account, need to query the curated sales schemas and must always see the latest committed data. Heavy business unit queries must not slow down the ETL workload, and each business unit must pay for the compute that its queries use. The company does not want to copy or move the data.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un groupe de distribution exploite un cluster provisionné Amazon Redshift central avec des nœuds RA3 dans un compte de plateforme de données. Le cluster charge et prépare les données de ventes tout au long de la journée. Cinq unités commerciales, chacune avec son propre compte AWS, doivent interroger les schémas de ventes préparés et toujours voir les dernières données validées. Les requêtes lourdes des unités commerciales ne doivent pas ralentir la charge de travail ETL, et chaque unité commerciale doit payer le calcul utilisé par ses requêtes. L'entreprise ne veut ni copier ni déplacer les données.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "UNLOAD the curated schemas to Amazon S3 every night, and let each business unit query the files from its own Redshift Serverless workgroup with Redshift Spectrum."
        fr: "Exécuter chaque nuit UNLOAD sur les schémas préparés vers Amazon S3, et laisser chaque unité commerciale interroger les fichiers depuis son propre groupe de travail Redshift Serverless avec Redshift Spectrum."
    - id: b
      text:
        en: "Enable concurrency scaling on the central cluster, create a WLM queue for each business unit, and give each business unit database users on the central cluster."
        fr: "Activer la mise à l'échelle de la simultanéité sur le cluster central, créer une file WLM pour chaque unité commerciale, et donner à chaque unité commerciale des utilisateurs de base de données sur le cluster central."
    - id: c
      text:
        en: "Create a datashare for the curated schemas, authorize the five accounts, and have each business unit create a database from it in its own Redshift Serverless workgroup."
        fr: "Créer un partage de données (datashare) pour les schémas préparés, autoriser les cinq comptes, et faire créer par chaque unité commerciale une base de données à partir de ce partage dans son propre groupe de travail Redshift Serverless."
    - id: d
      text:
        en: "Share a manual snapshot of the central cluster with the five accounts every morning, and have each business unit restore it into its own provisioned cluster."
        fr: "Partager chaque matin un instantané manuel du cluster central avec les cinq comptes, et faire restaurer par chaque unité commerciale cet instantané dans son propre cluster provisionné."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Redshift data sharing gives consumers live access to the producer's data without copies, across accounts and between provisioned clusters and Serverless workgroups. Consumers see the latest committed data, and each business unit runs its queries on its own compute, which isolates the ETL workload and supports chargeback per business unit.
    fr: |
      Le partage de données Redshift donne aux consommateurs un accès en direct aux données du producteur sans copie, entre comptes et entre clusters provisionnés et groupes de travail Serverless. Les consommateurs voient les dernières données validées, et chaque unité commerciale exécute ses requêtes sur son propre calcul, ce qui isole la charge de travail ETL et permet la refacturation par unité commerciale.
  options:
    a:
      en: |
        Nightly unloads copy the data to S3, and the business units would see data that is up to a day old.
      fr: |
        Les déchargements nocturnes copient les données dans S3, et les unités commerciales verraient des données vieilles d'une journée au plus.
    b:
      en: |
        All queries still run on the central cluster's account and bill, so the business units do not pay for their own compute, and their queries share the cluster with the ETL workload.
      fr: |
        Toutes les requêtes s'exécutent toujours sur le compte et la facture du cluster central : les unités commerciales ne paient pas leur propre calcul, et leurs requêtes partagent le cluster avec la charge de travail ETL.
    d:
      en: |
        Restored snapshots are full copies that are stale as soon as the central cluster loads new data, and five restores every day add heavy operational work.
      fr: |
        Les instantanés restaurés sont des copies complètes obsolètes dès que le cluster central charge de nouvelles données, et cinq restaurations chaque jour ajoutent une lourde charge opérationnelle.
references:
  - title: Data sharing in Amazon Redshift
    url: https://docs.aws.amazon.com/redshift/latest/dg/datashare-overview.html
