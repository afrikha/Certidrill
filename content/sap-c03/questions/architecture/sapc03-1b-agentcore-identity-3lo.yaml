id: sapc03-1b-agentcore-identity-3lo
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company is deploying an internal engineering assistant on Amazon Bedrock AgentCore Runtime. When an engineer asks it to, the agent must read that engineer's Jira issues and Google Drive files, with exactly the permissions of that engineer in each service. Each engineer must grant consent once through the provider's OAuth consent screen. The security team requires that the agent code never stores or handles long-term secrets or refresh tokens, and that engineers are not asked to consent again every time an access token expires. The company wants the least custom code.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels déploie un assistant d'ingénierie interne sur Amazon Bedrock AgentCore Runtime. Quand un ingénieur le lui demande, l'agent doit lire les tickets Jira et les fichiers Google Drive de cet ingénieur, avec exactement les autorisations de cet ingénieur dans chaque service. Chaque ingénieur doit donner son consentement une seule fois via l'écran de consentement OAuth du fournisseur. L'équipe de sécurité exige que le code de l'agent ne stocke ni ne manipule jamais de secrets à long terme ou de jetons d'actualisation, et que les ingénieurs ne soient pas invités à consentir de nouveau à chaque expiration d'un jeton d'accès. L'entreprise veut le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Register one OAuth client per provider with the client credentials grant, store the client secrets in AWS Secrets Manager, and have the agent request machine-to-machine tokens for each call."
        fr: "Enregistrer un client OAuth par fournisseur avec l'octroi des informations d'identification client, stocker les secrets clients dans AWS Secrets Manager, et faire demander par l'agent des jetons de machine à machine pour chaque appel."
    - id: b
      text:
        en: "Configure AgentCore Identity OAuth 2.0 credential providers for Jira and Google with the user-delegated authorization code flow, and have the agent obtain access tokens for the current engineer from the AgentCore Identity token vault."
        fr: "Configurer des fournisseurs d'informations d'identification OAuth 2.0 AgentCore Identity pour Jira et Google avec le flux de code d'autorisation délégué par l'utilisateur, et faire obtenir par l'agent les jetons d'accès de l'ingénieur courant depuis le coffre de jetons d'AgentCore Identity."
    - id: c
      text:
        en: "Implement the OAuth authorization code flow in the agent, store each engineer's access and refresh tokens in an Amazon DynamoDB table encrypted with AWS KMS, and refresh them in the agent code."
        fr: "Implémenter le flux de code d'autorisation OAuth dans l'agent, stocker les jetons d'accès et d'actualisation de chaque ingénieur dans une table Amazon DynamoDB chiffrée avec AWS KMS, et les actualiser dans le code de l'agent."
    - id: d
      text:
        en: "Federate the engineers into an Amazon Cognito identity pool, and have the agent exchange each engineer's identity for temporary credentials that it uses to call the Jira and Google Drive APIs."
        fr: "Fédérer les ingénieurs dans un groupe d'identités Amazon Cognito, et faire échanger par l'agent l'identité de chaque ingénieur contre des informations d'identification temporaires utilisées pour appeler les API Jira et Google Drive."
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore Identity obtains OAuth tokens for user-delegated access (the USER_FEDERATION flow, with consent) or for machine-to-machine access through configured credential providers. Access and refresh tokens are kept in its token vault, so agents never hold long-term secrets or refresh tokens, and a valid stored refresh token lets it return a new access token without asking the user to consent again."
    fr: "AgentCore Identity obtient des jetons OAuth pour un accès délégué par l'utilisateur (le flux USER_FEDERATION, avec consentement) ou pour un accès de machine à machine via des fournisseurs d'informations d'identification configurés. Les jetons d'accès et d'actualisation sont conservés dans son coffre de jetons : les agents ne détiennent jamais de secrets à long terme ni de jetons d'actualisation, et un jeton d'actualisation valide stocké lui permet de renvoyer un nouveau jeton d'accès sans redemander le consentement de l'utilisateur."
  options:
    a:
      en: "Client credentials tokens act as the application, not as each engineer, so the agent would not have the engineer's own permissions, and the agent would handle client secrets."
      fr: "Les jetons d'informations d'identification client agissent au nom de l'application, pas de chaque ingénieur : l'agent n'aurait pas les autorisations propres à l'ingénieur, et il manipulerait des secrets clients."
    c:
      en: "The agent code would store and handle refresh tokens, which the security team forbids, and the company would write and maintain the OAuth logic itself."
      fr: "Le code de l'agent stockerait et manipulerait des jetons d'actualisation, ce que l'équipe de sécurité interdit, et l'entreprise écrirait et maintiendrait elle-même la logique OAuth."
    d:
      en: "Cognito identity pools issue temporary AWS credentials, which Jira and Google Drive do not accept; those services need OAuth tokens from their own authorization servers."
      fr: "Les groupes d'identités Cognito émettent des informations d'identification AWS temporaires, que Jira et Google Drive n'acceptent pas : ces services exigent des jetons OAuth de leurs propres serveurs d'autorisation."
references:
  - title: Obtain OAuth 2.0 access token
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity-authentication.html
  - title: Provide identity and credential management for agent applications with Amazon Bedrock AgentCore Identity
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/identity.html
