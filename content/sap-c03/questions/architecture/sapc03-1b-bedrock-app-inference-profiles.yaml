id: sapc03-1b-bedrock-app-inference-profiles
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media group runs a central generative AI platform account in AWS Organizations. Thirty internal applications from several business units send their prompts to a shared gateway service in this account. The gateway runs on Amazon ECS with a single task IAM role and calls Amazon Bedrock on-demand models on behalf of every application. Finance requires the monthly Bedrock inference cost of each application in AWS Cost Explorer, with an AWS Budgets alert for each application. The platform team also wants usage metrics for each application, and it wants the least operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un groupe de médias exploite un compte central de plateforme d'IA générative dans AWS Organizations. Trente applications internes de plusieurs divisions envoient leurs invites à un service passerelle partagé dans ce compte. La passerelle s'exécute sur Amazon ECS avec un seul rôle IAM de tâche et appelle des modèles Amazon Bedrock à la demande pour le compte de chaque application. La finance exige le coût mensuel d'inférence Bedrock de chaque application dans AWS Cost Explorer, avec une alerte AWS Budgets par application. L'équipe plateforme veut aussi des métriques d'utilisation par application, avec le moins de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create one application inference profile per application from the model or its system-defined profile, tag each profile with the application name, activate the tag as a cost allocation tag, and have the gateway call each application's profile ARN."
        fr: "Créer un profil d'inférence d'application par application à partir du modèle ou de son profil défini par le système, étiqueter chaque profil avec le nom de l'application, activer l'étiquette comme étiquette de répartition des coûts, et faire appeler par la passerelle l'ARN du profil de chaque application."
    - id: b
      text:
        en: "Tag the task IAM role of the gateway with an application tag, activate the tag as a cost allocation tag for IAM principals, and filter the Bedrock cost by that tag in Cost Explorer and AWS Budgets."
        fr: "Étiqueter le rôle IAM de tâche de la passerelle avec une étiquette d'application, activer l'étiquette comme étiquette de répartition des coûts pour les principaux IAM, et filtrer le coût Bedrock par cette étiquette dans Cost Explorer et AWS Budgets."
    - id: c
      text:
        en: "Turn on model invocation logging to Amazon S3, and run a scheduled Amazon Athena query that sums the tokens of each application and multiplies them by the model prices to produce a monthly report."
        fr: "Activer la journalisation des invocations de modèles vers Amazon S3, et exécuter une requête Amazon Athena planifiée qui additionne les jetons de chaque application et les multiplie par les prix des modèles pour produire un rapport mensuel."
    - id: d
      text:
        en: "Create an AWS Cost Category with one rule per application that splits the Bedrock charges of the account by usage type, and create one AWS Budgets budget per cost category value."
        fr: "Créer une catégorie de coûts AWS avec une règle par application qui répartit les frais Bedrock du compte par type d'utilisation, et créer un budget AWS Budgets par valeur de catégorie de coûts."
answer: { optionId: a }
explanation:
  correct:
    en: "Application inference profiles are created to track cost and usage for a workload: tags on a profile flow to Cost Explorer and CUR 2.0 once activated as cost allocation tags, and usage metrics are collected per profile. Calling one profile per application gives per-application dollars and budgets even though all calls come from the same IAM role."
    fr: "Les profils d'inférence d'application sont conçus pour suivre les coûts et l'utilisation d'une charge de travail : les étiquettes d'un profil remontent dans Cost Explorer et CUR 2.0 une fois activées comme étiquettes de répartition des coûts, et les métriques d'utilisation sont collectées par profil. Appeler un profil par application donne des coûts et des budgets par application, même si tous les appels viennent du même rôle IAM."
  options:
    b:
      en: "IAM principal attribution tracks spend by caller identity, but every application calls through the same task role, so one tag value cannot separate thirty applications."
      fr: "L'attribution par principal IAM suit les dépenses par identité appelante, mais toutes les applications passent par le même rôle de tâche : une seule valeur d'étiquette ne peut pas séparer trente applications."
    c:
      en: "A custom log pipeline adds operational overhead, estimates cost outside the billing data, and does not feed Cost Explorer or AWS Budgets."
      fr: "Un pipeline de journaux personnalisé ajoute de la charge opérationnelle, estime les coûts en dehors des données de facturation et n'alimente ni Cost Explorer ni AWS Budgets."
    d:
      en: "Usage types describe the model, Region and token type, not the calling application, so Cost Category rules cannot split the charges per application."
      fr: "Les types d'utilisation décrivent le modèle, la Région et le type de jeton, pas l'application appelante : les règles de catégorie de coûts ne peuvent pas répartir les frais par application."
