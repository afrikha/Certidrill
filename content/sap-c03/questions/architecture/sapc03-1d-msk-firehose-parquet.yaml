id: sapc03-1d-msk-firehose-parquet
objective: "1.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company is moving a self-managed Apache Kafka cluster from its data center to an Amazon MSK provisioned cluster. Hundreds of producer applications publish clickstream events with standard Kafka client libraries, and the company cannot change their code beyond the bootstrap broker settings. The MSK cluster has SASL/SCRAM authentication for the producers and IAM access control enabled for AWS services. The analytics team needs the events in an Amazon S3 data lake as Apache Parquet files no later than 5 minutes after they are produced, so that Amazon Athena can query them. The events are JSON documents whose schema is defined in a table in the AWS Glue Data Catalog. Traffic between AWS services must use private connectivity.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de commerce en ligne déplace un cluster Apache Kafka autogéré de son centre de données vers un cluster provisionné Amazon MSK. Des centaines d'applications productrices publient des événements de parcours de navigation (clickstream) avec les bibliothèques clientes Kafka standard, et l'entreprise ne peut pas modifier leur code au-delà des paramètres des brokers d'amorçage. Le cluster MSK utilise l'authentification SASL/SCRAM pour les producteurs et le contrôle d'accès IAM est activé pour les services AWS. L'équipe d'analytique a besoin des événements dans un lac de données Amazon S3 sous forme de fichiers Apache Parquet au plus tard 5 minutes après leur production, afin qu'Amazon Athena puisse les interroger. Les événements sont des documents JSON dont le schéma est défini dans une table d'AWS Glue Data Catalog. Le trafic entre les services AWS doit utiliser une connectivité privée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Replace the MSK cluster with an Amazon Kinesis Data Streams data stream, and configure an Amazon Data Firehose stream that reads from it and converts the records to Parquet."
        fr: "Remplacer le cluster MSK par un flux de données Amazon Kinesis Data Streams, et configurer un flux Amazon Data Firehose qui le lit et convertit les enregistrements en Parquet."
    - id: b
      text:
        en: "Configure an AWS Lambda event source mapping on the MSK topic that writes each batch as a JSON object to S3, and run a nightly AWS Glue job that converts the objects to Parquet."
        fr: "Configurer un mappage de source d'événements AWS Lambda sur la rubrique MSK qui écrit chaque lot sous forme d'objet JSON dans S3, et exécuter chaque nuit une tâche AWS Glue qui convertit les objets en Parquet."
    - id: c
      text:
        en: "Create an Amazon Data Firehose stream with the MSK cluster as its source through private connectivity, enable record format conversion to Parquet with the Glue table schema, and deliver to S3."
        fr: "Créer un flux Amazon Data Firehose avec le cluster MSK comme source via une connectivité privée, activer la conversion du format des enregistrements en Parquet avec le schéma de la table Glue, et livrer vers S3."
    - id: d
      text:
        en: "Run Kafka Connect workers with an S3 sink connector on an Auto Scaling group of Amazon EC2 instances in private subnets, and configure the connector to write Parquet files."
        fr: "Exécuter des workers Kafka Connect avec un connecteur récepteur S3 sur un groupe Auto Scaling d'instances Amazon EC2 dans des sous-réseaux privés, et configurer le connecteur pour écrire des fichiers Parquet."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Firehose can read a topic from an MSK provisioned or Serverless cluster; private bootstrap brokers require IAM access control, multi-VPC private connectivity and a cluster policy that lets Firehose create the VPC connection. Record format conversion turns JSON into Parquet by using the schema of a Glue Data Catalog table, and Firehose delivers to S3 within its buffering interval, with no consumer to operate.
    fr: |
      Firehose peut lire une rubrique d'un cluster MSK provisionné ou Serverless ; les brokers d'amorçage privés exigent le contrôle d'accès IAM, la connectivité privée multi-VPC et une politique de cluster qui permet à Firehose de créer la connexion VPC. La conversion du format des enregistrements transforme le JSON en Parquet à l'aide du schéma d'une table de Glue Data Catalog, et Firehose livre vers S3 dans son intervalle de mise en mémoire tampon, sans consommateur à exploiter.
  options:
    a:
      en: |
        Kinesis Data Streams does not speak the Kafka protocol, so every producer would have to be rewritten with a Kinesis client.
      fr: |
        Kinesis Data Streams ne parle pas le protocole Kafka : chaque producteur devrait être réécrit avec un client Kinesis.
    b:
      en: |
        Parquet files would appear only after the nightly job, far beyond 5 minutes, and the company would maintain custom function code and a conversion job.
      fr: |
        Les fichiers Parquet n'apparaîtraient qu'après la tâche nocturne, bien au-delà de 5 minutes, et l'entreprise devrait maintenir du code de fonction personnalisé et une tâche de conversion.
    d:
      en: |
        This works but makes the company patch, scale and monitor a fleet of Connect workers, which is more overhead than a managed delivery stream.
      fr: |
        Cela fonctionne, mais l'entreprise doit corriger, mettre à l'échelle et surveiller une flotte de workers Connect, ce qui représente plus de charge qu'un flux de livraison géré.
references:
