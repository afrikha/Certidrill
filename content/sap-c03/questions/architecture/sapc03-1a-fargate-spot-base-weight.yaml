id: sapc03-1a-fargate-spot-base-weight
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a stateless API as an Amazon ECS service on AWS Fargate behind an Application Load Balancer. The service scales between 4 and 40 tasks. For availability, at least 4 tasks must always run on regular Fargate capacity. To reduce costs, the company wants 75% of the tasks above those 4 to run on Fargate Spot. The containers handle the SIGTERM signal and shut down gracefully within 30 seconds.

    Which capacity provider strategy will meet these requirements?
  fr: |
    Une entreprise exécute une API sans état sous forme de service Amazon ECS sur AWS Fargate derrière un Application Load Balancer. Le service évolue entre 4 et 40 tâches. Pour la disponibilité, au moins 4 tâches doivent toujours s'exécuter sur la capacité Fargate standard. Pour réduire les coûts, l'entreprise veut que 75 % des tâches au-delà de ces 4 s'exécutent sur Fargate Spot. Les conteneurs gèrent le signal SIGTERM et s'arrêtent proprement en moins de 30 secondes.

    Quelle stratégie de fournisseur de capacité permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          FARGATE with a weight of 1 and FARGATE_SPOT with a weight of 3, with no base on either capacity provider.
        fr: |-
          FARGATE avec un poids de 1 et FARGATE_SPOT avec un poids de 3, sans base sur aucun des fournisseurs de capacité.
    - id: b
      text:
        en: |-
          FARGATE with a base of 4 and a weight of 3, and FARGATE_SPOT with a weight of 1.
        fr: |-
          FARGATE avec une base de 4 et un poids de 3, et FARGATE_SPOT avec un poids de 1.
    - id: c
      text:
        en: |-
          FARGATE with a base of 4 and a weight of 1, and FARGATE_SPOT with a weight of 3.
        fr: |-
          FARGATE avec une base de 4 et un poids de 1, et FARGATE_SPOT avec un poids de 3.
    - id: d
      text:
        en: |-
          FARGATE_SPOT with a base of 4 and a weight of 3, and FARGATE with a weight of 1.
        fr: |-
          FARGATE_SPOT avec une base de 4 et un poids de 3, et FARGATE avec un poids de 1.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The base is the minimum number of tasks placed on a capacity provider before the weights apply, and only one provider in a strategy can have a base. A base of 4 on FARGATE keeps the first 4 tasks on regular capacity, and weights of 1 and 3 then place one task out of four on FARGATE and three out of four on FARGATE_SPOT.
    fr: |-
      La base est le nombre minimal de tâches placées sur un fournisseur de capacité avant l'application des poids, et un seul fournisseur d'une stratégie peut avoir une base. Une base de 4 sur FARGATE garde les 4 premières tâches sur la capacité standard, puis les poids de 1 et 3 placent une tâche sur quatre sur FARGATE et trois sur quatre sur FARGATE_SPOT.
  options:
    a:
      en: |-
        Without a base, the weights apply from the first task, so only about one of the first 4 tasks runs on regular Fargate.
      fr: |-
        Sans base, les poids s'appliquent dès la première tâche : seule environ une des 4 premières tâches s'exécute sur Fargate standard.
    b:
      en: |-
        The base is correct, but the weights are inverted: 75% of the additional tasks would run on regular Fargate instead of Fargate Spot.
      fr: |-
        La base est correcte, mais les poids sont inversés : 75 % des tâches supplémentaires s'exécuteraient sur Fargate standard au lieu de Fargate Spot.
    d:
      en: |-
        The base is on FARGATE_SPOT, so the 4 guaranteed tasks would run on Spot capacity that can be interrupted.
      fr: |-
        La base est sur FARGATE_SPOT : les 4 tâches garanties s'exécuteraient sur une capacité Spot qui peut être interrompue.
references:
  - title: Amazon ECS clusters for Fargate - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html
