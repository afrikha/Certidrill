id: sapc03-1c-dns-shared-forwarding-rules
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company has 60 AWS accounts in AWS Organizations. All workload VPCs in us-east-1 attach to a transit gateway in a network account, which also connects to the data center through AWS Direct Connect. Workloads in every VPC must resolve names in the on-premises Active Directory domain corp.example.com. Workloads must also keep resolving names in the Route 53 private hosted zones associated with their VPCs. The network team wants to minimize the number of Route 53 Resolver endpoints to pay for and manage, and new VPCs must be able to use the configuration without new endpoints.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers possède 60 comptes AWS dans AWS Organizations. Tous les VPC de charges de travail de us-east-1 sont attachés à une passerelle de transit (transit gateway) d'un compte réseau, elle-même reliée au centre de données par AWS Direct Connect. Les charges de travail de chaque VPC doivent résoudre les noms du domaine Active Directory sur site corp.example.com. Elles doivent aussi continuer à résoudre les noms des zones hébergées privées Route 53 associées à leurs VPC. L'équipe réseau veut réduire au minimum le nombre de points de terminaison Route 53 Resolver à payer et à gérer, et les nouveaux VPC doivent pouvoir utiliser la configuration sans nouveaux points de terminaison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a DHCP options set in each workload VPC that lists the on-premises DNS servers as domain name servers, and route the DNS traffic through the transit gateway."
        fr: "Créer dans chaque VPC de charges de travail un jeu d'options DHCP qui indique les serveurs DNS sur site comme serveurs de noms de domaine, et router le trafic DNS par la passerelle de transit."
    - id: b
      text:
        en: "Create a Route 53 Resolver outbound endpoint and a forwarding rule for corp.example.com in each workload VPC, with the on-premises DNS servers as targets."
        fr: "Créer dans chaque VPC de charges de travail un point de terminaison sortant Route 53 Resolver et une règle de transfert pour corp.example.com, avec les serveurs DNS sur site comme cibles."
    - id: c
      text:
        en: "Create a Route 53 Resolver inbound endpoint in a shared services VPC in the network account, and configure the on-premises DNS servers to forward corp.example.com to it."
        fr: "Créer un point de terminaison entrant Route 53 Resolver dans un VPC de services partagés du compte réseau, et configurer les serveurs DNS sur site pour qu'ils lui transfèrent corp.example.com."
    - id: d
      text:
        en: "Create an outbound endpoint and a forwarding rule for corp.example.com in a shared services VPC in the network account, share the rule with AWS RAM, and associate it with each VPC."
        fr: "Créer un point de terminaison sortant et une règle de transfert pour corp.example.com dans un VPC de services partagés du compte réseau, partager la règle avec AWS RAM, et l'associer à chaque VPC."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A forwarding rule uses one outbound endpoint, but the rule can be shared with other accounts through AWS RAM and associated with their VPCs. Queries for corp.example.com from any associated VPC then leave through the central endpoint and reach the on-premises servers over the transit gateway and Direct Connect, while all other names, including the private hosted zones, are still resolved by Route 53 Resolver.
    fr: |-
      Une règle de transfert utilise un seul point de terminaison sortant, mais elle peut être partagée avec d'autres comptes par AWS RAM et associée à leurs VPC. Les requêtes pour corp.example.com de tout VPC associé sortent alors par le point de terminaison central et atteignent les serveurs sur site par la passerelle de transit et Direct Connect, tandis que tous les autres noms, y compris les zones hébergées privées, restent résolus par Route 53 Resolver.
  options:
    a:
      en: |-
        With on-premises servers in the DHCP options, instances stop using Route 53 Resolver, so the private hosted zones associated with the VPCs no longer resolve directly.
      fr: |-
        Avec les serveurs sur site dans les options DHCP, les instances n'utilisent plus Route 53 Resolver : les zones hébergées privées associées aux VPC ne sont plus résolues directement.
    b:
      en: |-
        An endpoint in every VPC multiplies endpoint costs and work, and every new VPC would need new endpoints.
      fr: |-
        Un point de terminaison par VPC multiplie les coûts et le travail, et chaque nouveau VPC aurait besoin de nouveaux points de terminaison.
    c:
      en: |-
        An inbound endpoint receives queries from on premises; it does not forward queries from the VPCs to the on-premises domain.
      fr: |-
        Un point de terminaison entrant reçoit des requêtes venant du site ; il ne transfère pas les requêtes des VPC vers le domaine sur site.
references:
  - title: Managing forwarding rules - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver-rules-managing.html
