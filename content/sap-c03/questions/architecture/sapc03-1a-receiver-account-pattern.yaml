id: sapc03-1a-receiver-account-pattern
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's security account has a custom Amazon EventBridge event bus whose resource-based policy allows events:PutEvents from every account in the organization. Several rules on the bus send all the received events to a logging pipeline. A new rule must invoke an AWS Lambda function that performs a costly automated remediation, and it must run only for events that come from three production accounts. Events from the other accounts must still reach the logging rules. The company wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Le compte de sécurité d'une entreprise possède un bus d'événements personnalisé Amazon EventBridge dont la politique basée sur les ressources autorise events:PutEvents depuis tous les comptes de l'organisation. Plusieurs règles du bus envoient tous les événements reçus vers un pipeline de journalisation. Une nouvelle règle doit appeler une fonction AWS Lambda qui effectue une correction automatisée coûteuse, et elle ne doit s'exécuter que pour les événements provenant de trois comptes de production. Les événements des autres comptes doivent toujours atteindre les règles de journalisation. L'entreprise veut le MOINS d'effort.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Change the resource-based policy of the bus so that it allows events:PutEvents only from the three production accounts.
        fr: |-
          Modifier la politique basée sur les ressources du bus pour qu'elle n'autorise events:PutEvents que depuis les trois comptes de production.
    - id: b
      text:
        en: |-
          Send all the events to the function, and add code at the start of the function that returns immediately when the event does not come from a production account.
        fr: |-
          Envoyer tous les événements à la fonction, et ajouter au début de la fonction du code qui s'arrête immédiatement quand l'événement ne provient pas d'un compte de production.
    - id: c
      text:
        en: |-
          Create a separate event bus for the production accounts, and change the rules in the three production accounts to send their events to the new bus.
        fr: |-
          Créer un bus d'événements distinct pour les comptes de production, et modifier les règles des trois comptes de production pour qu'elles envoient leurs événements au nouveau bus.
    - id: d
      text:
        en: |-
          Add an account field that lists the three production account IDs to the event pattern of the new rule, and leave the bus policy and the other rules unchanged.
        fr: |-
          Ajouter au modèle d'événement de la nouvelle règle un champ account qui liste les ID des trois comptes de production, sans modifier la politique du bus ni les autres règles.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      When a bus receives events from many accounts, a rule without an account field matches events from every authorized account. Adding the account field with the trusted account IDs to the event pattern limits the new rule to those accounts, while the other rules keep receiving all the events.
    fr: |-
      Quand un bus reçoit des événements de nombreux comptes, une règle sans champ account correspond aux événements de tous les comptes autorisés. Ajouter au modèle d'événement le champ account avec les ID des comptes de confiance limite la nouvelle règle à ces comptes, tandis que les autres règles continuent de recevoir tous les événements.
  options:
    a:
      en: |-
        Restricting the bus policy would block the events of the other accounts, so the logging rules would stop receiving them.
      fr: |-
        Restreindre la politique du bus bloquerait les événements des autres comptes : les règles de journalisation cesseraient de les recevoir.
    b:
      en: |-
        Filtering in code still invokes and bills the function for every event and adds code to maintain, which an event pattern avoids.
      fr: |-
        Filtrer dans le code appelle et facture toujours la fonction pour chaque événement et ajoute du code à maintenir, ce qu'un modèle d'événement évite.
    c:
      en: |-
        A second bus and changes in three accounts are more effort than a one-line change to the event pattern.
      fr: |-
        Un second bus et des modifications dans trois comptes représentent plus d'effort qu'une modification d'une ligne du modèle d'événement.
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
