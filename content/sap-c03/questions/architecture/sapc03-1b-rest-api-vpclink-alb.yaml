id: sapc03-1b-rest-api-vpclink-alb
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs 20 microservices on Amazon ECS behind an internal Application Load Balancer (ALB) that uses path-based routing. The company now wants to offer these services over the internet to 400 partner companies. Each partner must receive an API key, and the company must enforce a different request rate and monthly request quota for each of its three partner tiers. Request bodies must be validated against JSON schemas before they reach the services, and AWS WAF must inspect every request. The ALB must remain internal, and the company wants the fewest additional components to operate.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute 20 microservices sur Amazon ECS derrière un Application Load Balancer (ALB) interne qui utilise le routage par chemin. L'entreprise veut maintenant proposer ces services sur Internet à 400 entreprises partenaires. Chaque partenaire doit recevoir une clé d'API, et l'entreprise doit appliquer un débit de requêtes et un quota mensuel de requêtes différents pour chacun de ses trois niveaux de partenaires. Le corps des requêtes doit être validé par rapport à des schémas JSON avant d'atteindre les services, et AWS WAF doit inspecter chaque requête. L'ALB doit rester interne, et l'entreprise veut le moins possible de composants supplémentaires à exploiter.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon API Gateway REST API with a private integration through a VPC link V2 to the internal ALB, request validators, a usage plan with API keys per partner tier, and an AWS WAF web ACL on the stage."
        fr: "Créer une API REST Amazon API Gateway avec une intégration privée via un lien VPC V2 vers l'ALB interne, des validateurs de requêtes, un plan d'utilisation avec des clés d'API par niveau de partenaire et une liste ACL web AWS WAF sur l'étape."
    - id: b
      text:
        en: "Create an Amazon API Gateway HTTP API with a VPC link to the internal ALB, request validation with JSON schema models, a usage plan with API keys for each partner tier, and an AWS WAF web ACL associated with the API."
        fr: "Créer une API HTTP Amazon API Gateway avec un lien VPC vers l'ALB interne, une validation des requêtes avec des modèles de schéma JSON, un plan d'utilisation avec des clés d'API pour chaque niveau de partenaire et une liste ACL web AWS WAF associée à l'API."
    - id: c
      text:
        en: "Create an internal Network Load Balancer with a target group of type alb, and an Amazon API Gateway REST API whose private integration reaches the Network Load Balancer, with request validators, usage plans per tier and AWS WAF on the stage."
        fr: "Créer un Network Load Balancer interne avec un groupe cible de type alb, et une API REST Amazon API Gateway dont l'intégration privée atteint le Network Load Balancer, avec des validateurs de requêtes, des plans d'utilisation par niveau et AWS WAF sur l'étape."
    - id: d
      text:
        en: "Change the ALB to internet-facing, associate an AWS WAF web ACL with rate-based rules that aggregate on an x-api-key header, and validate request bodies with conditions in the ALB listener rules."
        fr: "Rendre l'ALB accessible depuis Internet, lui associer une liste ACL web AWS WAF avec des règles basées sur le débit qui agrègent sur un en-tête x-api-key, et valider le corps des requêtes avec des conditions dans les règles d'écouteur de l'ALB."
answer: { optionId: a }
explanation:
  correct:
    en: "REST APIs support API keys, usage plans with per-client throttling and quotas, request validation and AWS WAF. A REST API private integration can now use a VPC link V2 that targets an Application Load Balancer directly, so the internal ALB stays private and no other load balancer is needed."
    fr: "Les API REST prennent en charge les clés d'API, les plans d'utilisation avec limitation et quotas par client, la validation des requêtes et AWS WAF. Une intégration privée d'API REST peut désormais utiliser un lien VPC V2 qui cible directement un Application Load Balancer : l'ALB interne reste privé et aucun autre équilibreur de charge n'est nécessaire."
  options:
    b:
      en: "HTTP APIs support private integrations with an ALB, but they have no API keys, usage plans, request validation or AWS WAF integration."
      fr: "Les API HTTP prennent en charge les intégrations privées avec un ALB, mais elles n'ont ni clés d'API, ni plans d'utilisation, ni validation des requêtes, ni intégration AWS WAF."
    c:
      en: "This works, but the extra Network Load Balancer is unnecessary because a VPC link V2 reaches the ALB directly, so it fails the fewest-components requirement."
      fr: "Cette solution fonctionne, mais le Network Load Balancer supplémentaire est inutile puisqu'un lien VPC V2 atteint directement l'ALB : elle ne respecte pas l'exigence du moins de composants possible."
    d:
      en: "The ALB must stay internal. ALB rules cannot validate bodies against JSON schemas, and rate-based rules cannot enforce monthly quotas per partner tier."
      fr: "L'ALB doit rester interne. Les règles d'ALB ne peuvent pas valider le corps des requêtes par rapport à des schémas JSON, et les règles basées sur le débit ne peuvent pas appliquer de quotas mensuels par niveau de partenaire."
references:
  - title: Set up a private integration
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/set-up-private-integration.html
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
