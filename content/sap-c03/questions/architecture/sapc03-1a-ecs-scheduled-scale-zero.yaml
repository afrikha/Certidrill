id: sapc03-1a-ecs-scheduled-scale-zero
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs dozens of development and test services on Amazon ECS with AWS Fargate. Each service has a target tracking scaling policy with a minimum of 2 tasks and a maximum of 10 tasks. To reduce costs, the services must run no tasks on weeknights from 20:00 to 07:00 and during weekends. During working hours, the existing target tracking behavior must stay the same. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des dizaines de services de développement et de test sur Amazon ECS avec AWS Fargate. Chaque service dispose d'une stratégie de mise à l'échelle de suivi de la cible avec un minimum de 2 tâches et un maximum de 10. Pour réduire les coûts, les services ne doivent exécuter aucune tâche les soirs de semaine de 20 h à 7 h ni le week-end. Pendant les heures de travail, le comportement actuel de suivi de la cible doit rester identique. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon EventBridge Scheduler schedule that invokes an AWS Lambda function to set the desired count of every service to 0 in the evening and to 2 in the morning.
        fr: |-
          Créer une planification Amazon EventBridge Scheduler qui appelle une fonction AWS Lambda pour définir le nombre souhaité de chaque service sur 0 le soir et sur 2 le matin.
    - id: b
      text:
        en: |-
          Add Application Auto Scaling scheduled actions to each service's scalable target that set the minimum and maximum capacity to 0 at 20:00 and back to 2 and 10 at 07:00 on working days.
        fr: |-
          Ajouter à la cible évolutive de chaque service des actions planifiées Application Auto Scaling qui définissent la capacité minimale et maximale sur 0 à 20 h, puis de nouveau sur 2 et 10 à 7 h les jours ouvrés.
    - id: c
      text:
        en: |-
          Change the target tracking policy of each service to a lower target value at night so that the services scale in to 0 tasks when there is no traffic.
        fr: |-
          Modifier la stratégie de suivi de la cible de chaque service pour qu'elle utilise une valeur cible plus basse la nuit, afin que les services descendent à 0 tâche en l'absence de trafic.
    - id: d
      text:
        en: |-
          Delete the development and test services every evening with a pipeline, and re-create them from their task definitions every morning on working days.
        fr: |-
          Supprimer chaque soir les services de développement et de test au moyen d'un pipeline, et les recréer chaque matin des jours ouvrés à partir de leurs définitions de tâche.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      ECS service auto scaling uses Application Auto Scaling, which supports scheduled scaling based on date and time. Scheduled actions that set the minimum and maximum capacity to 0 stop all tasks at night, and actions that restore 2 and 10 in the morning let the existing target tracking policy work as before; a minimum of 0 is supported for ECS services.
    fr: |-
      L'auto scaling des services ECS utilise Application Auto Scaling, qui prend en charge la mise à l'échelle planifiée en fonction de la date et de l'heure. Des actions planifiées qui définissent la capacité minimale et maximale sur 0 arrêtent toutes les tâches la nuit, et des actions qui rétablissent 2 et 10 le matin laissent la stratégie de suivi de la cible existante fonctionner comme avant ; une capacité minimale de 0 est prise en charge pour les services ECS.
  options:
    a:
      en: |-
        While scaling policies are active, Service Auto Scaling can override a desired count that is set manually, and the function is custom code to maintain.
      fr: |-
        Tant que des stratégies de mise à l'échelle sont actives, Service Auto Scaling peut remplacer un nombre souhaité défini manuellement, et la fonction est du code personnalisé à maintenir.
    c:
      en: |-
        A target tracking policy cannot scale below the minimum capacity of 2, and it has no time-based target values.
      fr: |-
        Une stratégie de suivi de la cible ne peut pas descendre en dessous de la capacité minimale de 2, et elle n'a pas de valeurs cibles fondées sur l'heure.
    d:
      en: |-
        Deleting and re-creating dozens of services every day adds a pipeline to operate and risks configuration drift, which is more overhead than scheduled actions.
      fr: |-
        Supprimer et recréer des dizaines de services chaque jour ajoute un pipeline à exploiter et un risque de dérive de configuration, soit plus de charge que des actions planifiées.
references:
  - title: Automatically scale your Amazon ECS service - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html
