id: sapc03-1c-lambda-mq-event-source
objective: "1.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A warehouse operator runs an Amazon MQ for ActiveMQ broker in its warehouse account. Legacy warehouse systems, which cannot be changed, publish JSON stock messages to a queue on the broker, and broker users authenticate with user names and passwords. An integration team, which works in a separate integration account, wants an AWS Lambda function to consume the messages, convert them to the new inventory schema and store them in an Amazon DynamoDB table. The team wants to use a Lambda event source mapping instead of writing a polling consumer.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un exploitant d'entrepôts gère un agent de messages (broker) Amazon MQ for ActiveMQ dans son compte entrepôt. Des systèmes d'entrepôt hérités, non modifiables, publient des messages de stock JSON dans une file d'attente de l'agent, et les utilisateurs de l'agent s'authentifient par nom d'utilisateur et mot de passe. Une équipe d'intégration, qui travaille dans un compte d'intégration distinct, veut qu'une fonction AWS Lambda consomme ces messages, les convertisse au nouveau schéma d'inventaire et les stocke dans une table Amazon DynamoDB. L'équipe veut utiliser un mappage de source d'événement Lambda plutôt que d'écrire un consommateur par interrogation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create the function and the event source mapping in the integration account, and reference the broker in the warehouse account by its ARN."
        fr: "Créer la fonction et le mappage de source d'événement dans le compte d'intégration, et référencer l'agent du compte entrepôt par son ARN."
    - id: b
      text:
        en: "Store the broker user name and password in an AWS Secrets Manager secret, and specify the secret in the event source mapping."
        fr: "Stocker le nom d'utilisateur et le mot de passe de l'agent dans un secret AWS Secrets Manager, et indiquer ce secret dans le mappage de source d'événement."
    - id: c
      text:
        en: "Configure the event source mapping to authenticate to the broker with the function's IAM execution role instead of a broker user."
        fr: "Configurer le mappage de source d'événement pour qu'il s'authentifie auprès de l'agent avec le rôle d'exécution IAM de la fonction au lieu d'un utilisateur de l'agent."
    - id: d
      text:
        en: "Point the event source mapping at a topic on the broker so that the function receives a copy of every message that is published."
        fr: "Faire pointer le mappage de source d'événement vers une rubrique (topic) de l'agent pour que la fonction reçoive une copie de chaque message publié."
    - id: e
      text:
        en: "Create the function and the event source mapping in the warehouse account with the queue as the destination, and grant the function's role access to the DynamoDB table."
        fr: "Créer la fonction et le mappage de source d'événement dans le compte entrepôt avec la file comme destination, et accorder au rôle de la fonction l'accès à la table DynamoDB."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |-
      Lambda event source mappings for Amazon MQ read broker credentials from AWS Secrets Manager. Lambda does not support cross-account processing for Amazon MQ, so the function and its mapping must be in the broker's account, and the mapping must use a queue destination.
    fr: |-
      Les mappages de source d'événement Lambda pour Amazon MQ lisent les identifiants de l'agent dans AWS Secrets Manager. Lambda ne prend pas en charge le traitement intercomptes pour Amazon MQ : la fonction et son mappage doivent se trouver dans le compte de l'agent, et le mappage doit utiliser une file comme destination.
  options:
    a:
      en: |-
        Lambda does not support cross-account processing for Amazon MQ event source mappings.
      fr: |-
        Lambda ne prend pas en charge le traitement intercomptes pour les mappages de source d'événement Amazon MQ.
    c:
      en: |-
        The mapping authenticates with a broker user whose credentials are stored in Secrets Manager, not with the execution role.
      fr: |-
        Le mappage s'authentifie avec un utilisateur de l'agent dont les identifiants sont stockés dans Secrets Manager, pas avec le rôle d'exécution.
    d:
      en: |-
        Event source mappings for Amazon MQ support only queue destinations.
      fr: |-
        Les mappages de source d'événement pour Amazon MQ ne prennent en charge que des files comme destinations.
references:
  - title: Using Lambda with Amazon MQ - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-mq.html
