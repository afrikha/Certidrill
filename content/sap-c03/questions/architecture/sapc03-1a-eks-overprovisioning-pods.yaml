id: sapc03-1a-eks-overprovisioning-pods
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company runs its storefront on Amazon EKS with managed node groups. Horizontal Pod Autoscalers scale the deployments, and the Cluster Autoscaler adds nodes when pods are Pending. New nodes need about 4 minutes before they can run pods. During flash sales, the HPAs add pods within seconds, but the new pods wait for nodes and the latency objective is breached. The company accepts paying for a small amount of spare capacity. It does not want to permanently raise the replica counts of the storefront deployments or to manage the size of the node groups by hand.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute sa vitrine en ligne sur Amazon EKS avec des groupes de nœuds gérés. Des Horizontal Pod Autoscalers mettent les déploiements à l'échelle, et Cluster Autoscaler ajoute des nœuds quand des pods sont à l'état Pending. Les nouveaux nœuds ont besoin d'environ 4 minutes avant de pouvoir exécuter des pods. Pendant les ventes flash, les HPA ajoutent des pods en quelques secondes, mais les nouveaux pods attendent des nœuds et l'objectif de latence n'est pas respecté. L'entreprise accepte de payer une petite capacité de réserve. Elle ne veut ni augmenter en permanence le nombre de réplicas des déploiements de la vitrine ni gérer à la main la taille des groupes de nœuds.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Lower the target CPU utilization of the storefront HPAs from 70% to 40% so that more pods are already running and absorbing traffic when a flash sale starts.
        fr: |-
          Abaisser l'utilisation cible du processeur des HPA de la vitrine de 70 % à 40 % pour que davantage de pods soient déjà en cours d'exécution et absorbent le trafic au début d'une vente flash.
    - id: b
      text:
        en: |-
          Reduce the scale-down-unneeded-time of the Cluster Autoscaler to 1 minute so that it reacts faster to changes in the demand for nodes during the flash sales.
        fr: |-
          Réduire le paramètre scale-down-unneeded-time de Cluster Autoscaler à 1 minute pour qu'il réagisse plus vite aux variations de la demande de nœuds pendant les ventes flash.
    - id: c
      text:
        en: |-
          Add scheduled actions that raise the minimum size of the node groups' Auto Scaling groups during business hours and lower it again at night and on weekends.
        fr: |-
          Ajouter des actions planifiées qui augmentent la taille minimale des groupes Auto Scaling des groupes de nœuds pendant les heures ouvrables et la réduisent de nouveau la nuit et le week-end.
    - id: d
      text:
        en: |-
          Deploy placeholder pods with a negative-priority PriorityClass that reserve spare capacity; real pods preempt them, and the evicted placeholders make the Cluster Autoscaler add nodes.
        fr: |-
          Déployer des pods de réservation avec une PriorityClass de priorité négative qui réservent une capacité de réserve ; les vrais pods les préemptent, et les pods de réservation évincés font ajouter des nœuds par Cluster Autoscaler.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Overprovisioning trades a little cost for lower scale-up latency: low-priority temporary pods occupy spare capacity, and when real pods are pending, the scheduler preempts the placeholders so that the real pods start immediately on the freed capacity. The evicted placeholders become unschedulable, which triggers the Cluster Autoscaler to add nodes in the background, without changing the replica counts of the application.
    fr: |-
      Le surprovisionnement échange un léger coût contre une latence de mise à l'échelle plus faible : des pods temporaires de faible priorité occupent une capacité de réserve, et quand de vrais pods sont en attente, le planificateur préempte les pods de réservation pour que les vrais pods démarrent immédiatement sur la capacité libérée. Les pods de réservation évincés deviennent non planifiables, ce qui déclenche l'ajout de nœuds par Cluster Autoscaler en arrière-plan, sans modifier le nombre de réplicas de l'application.
  options:
    a:
      en: |-
        A lower HPA target keeps more storefront replicas running at all times, which is the permanent increase in replica counts that the company wants to avoid.
      fr: |-
        Une cible HPA plus basse maintient en permanence davantage de réplicas de la vitrine, ce qui est l'augmentation permanente du nombre de réplicas que l'entreprise veut éviter.
    b:
      en: |-
        This setting controls how soon unneeded nodes are removed; removing nodes faster leaves even less spare capacity and does not shorten the 4-minute node startup.
      fr: |-
        Ce paramètre contrôle la rapidité de suppression des nœuds inutiles ; les supprimer plus vite laisse encore moins de capacité de réserve et ne raccourcit pas les 4 minutes de démarrage des nœuds.
    c:
      en: |-
        Flash sales are not tied to business hours, and keeping the node groups larger on a schedule is manual sizing that wastes capacity outside the sales.
      fr: |-
        Les ventes flash ne sont pas liées aux heures ouvrables, et maintenir des groupes de nœuds plus grands selon une planification constitue un dimensionnement manuel qui gaspille de la capacité en dehors des ventes.
references:
  - title: Cluster Autoscaler - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/best-practices/cas.html
