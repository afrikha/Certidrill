id: sapc03-1a-direct-cross-account-sqs
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order management team publishes order events to a custom Amazon EventBridge event bus in account A. A fulfillment team in account B, in the same AWS Region, owns an Amazon SQS queue that must receive the events of type OrderShipped. The fulfillment team does not want to create or operate any event bus or EventBridge rule in account B. The security team requires that the service control policies (SCPs) of account A apply to the delivery of the events. The company wants the solution with the fewest additional resources.

    Which solution will meet these requirements?
  fr: |
    Une équipe de gestion des commandes publie des événements de commande sur un bus d'événements personnalisé Amazon EventBridge du compte A. Une équipe d'exécution des commandes du compte B, dans la même Région AWS, possède une file d'attente Amazon SQS qui doit recevoir les événements de type OrderShipped. L'équipe d'exécution ne veut créer ni exploiter aucun bus d'événements ni aucune règle EventBridge dans le compte B. L'équipe de sécurité exige que les politiques de contrôle des services (SCP) du compte A s'appliquent à la livraison des événements. L'entreprise veut la solution qui comporte le moins de ressources supplémentaires.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a rule in account A that sends the events to the default event bus of account B, and create a rule on that bus in account B that targets the queue.
        fr: |-
          Créer dans le compte A une règle qui envoie les événements au bus d'événements par défaut du compte B, et créer sur ce bus, dans le compte B, une règle qui cible la file d'attente.
    - id: b
      text:
        en: |-
          Create a rule in account A that targets the queue in account B with an execution role in account A that allows sqs:SendMessage, and allow that role in the queue policy in account B.
        fr: |-
          Créer dans le compte A une règle qui cible la file d'attente du compte B avec un rôle d'exécution du compte A qui autorise sqs:SendMessage, et autoriser ce rôle dans la politique de la file d'attente du compte B.
    - id: c
      text:
        en: |-
          Create a rule in account A that targets the queue in account B without an execution role, and allow the events.amazonaws.com service principal in the queue policy with an aws:SourceArn condition.
        fr: |-
          Créer dans le compte A une règle qui cible la file d'attente du compte B sans rôle d'exécution, et autoriser le principal de service events.amazonaws.com dans la politique de la file d'attente avec une condition aws:SourceArn.
    - id: d
      text:
        en: |-
          Create a rule in account A that publishes the events to an Amazon SNS topic in account A, and subscribe the queue in account B to the topic with a cross-account subscription.
        fr: |-
          Créer dans le compte A une règle qui publie les événements dans une rubrique Amazon SNS du compte A, et abonner la file d'attente du compte B à la rubrique au moyen d'un abonnement entre comptes.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      EventBridge can deliver events directly to an SQS queue, SNS topic, Lambda function, Kinesis data stream, or API Gateway API in another account in the same Region. The rule needs an execution role in the account of the event bus, which makes the SCPs of that account apply, and the queue needs a resource-based policy that allows the sender; no bus or rule is needed in account B.
    fr: |-
      EventBridge peut livrer des événements directement à une file d'attente SQS, une rubrique SNS, une fonction Lambda, un flux de données Kinesis ou une API API Gateway d'un autre compte de la même Région. La règle a besoin d'un rôle d'exécution dans le compte du bus d'événements, ce qui fait s'appliquer les SCP de ce compte, et la file d'attente a besoin d'une politique basée sur les ressources qui autorise l'expéditeur ; aucun bus ni aucune règle ne sont nécessaires dans le compte B.
  options:
    a:
      en: |-
        Bus-to-bus delivery requires a rule in account B to route the events to the queue, which the fulfillment team does not want to operate.
      fr: |-
        La livraison de bus à bus exige une règle dans le compte B pour acheminer les événements vers la file d'attente, ce que l'équipe d'exécution ne veut pas exploiter.
    c:
      en: |-
        Delivery to a target in another account requires an execution role in the account of the event bus; without it, the delivery fails and the SCPs of account A would not govern it.
      fr: |-
        La livraison à une cible d'un autre compte exige un rôle d'exécution dans le compte du bus d'événements ; sans ce rôle, la livraison échoue et les SCP du compte A ne la régiraient pas.
    d:
      en: |-
        An intermediate topic and a cross-account subscription add resources that direct delivery to the queue does not need.
      fr: |-
        Une rubrique intermédiaire et un abonnement entre comptes ajoutent des ressources dont la livraison directe à la file d'attente n'a pas besoin.
references:
  - title: Sending events to an AWS service in another account in EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-cross-account.html
