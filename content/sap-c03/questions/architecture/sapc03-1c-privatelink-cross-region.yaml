id: sapc03-1c-privatelink-cross-region
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company sells a SaaS API that runs in us-east-1 behind a Network Load Balancer and is offered to customers through an AWS PrivateLink endpoint service. Many new customers run their workloads in eu-west-1 and require private connectivity to the API without traffic crossing the internet. Several customer VPCs use CIDR blocks that overlap with each other and with the company's VPC. The company does not want to deploy and operate a copy of the API or additional load balancers in eu-west-1. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels vend une API SaaS qui s'exécute dans us-east-1 derrière un Network Load Balancer et qu'il propose aux clients via un service de point de terminaison AWS PrivateLink. De nombreux nouveaux clients exécutent leurs charges de travail dans eu-west-1 et exigent une connectivité privée vers l'API, sans que le trafic traverse Internet. Plusieurs VPC clients utilisent des blocs CIDR qui se chevauchent entre eux et avec le VPC de l'éditeur. L'éditeur ne veut ni déployer ni exploiter une copie de l'API ou des équilibreurs de charge supplémentaires dans eu-west-1. Il veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create inter-Region VPC peering connections between the service VPC and each customer VPC in eu-west-1, and publish the Network Load Balancer's private IP addresses to the customers."
        fr: "Créer des connexions d'appairage de VPC interrégionales entre le VPC du service et chaque VPC client de eu-west-1, et communiquer aux clients les adresses IP privées du Network Load Balancer."
    - id: b
      text:
        en: "Create a Network Load Balancer and an endpoint service in eu-west-1 that forward traffic to the us-east-1 load balancer over transit gateway inter-Region peering, and onboard customers to it."
        fr: "Créer dans eu-west-1 un Network Load Balancer et un service de point de terminaison qui transfèrent le trafic vers l'équilibreur de us-east-1 par un appairage interrégional de passerelles de transit, et y raccorder les clients."
    - id: c
      text:
        en: "Share a transit gateway in eu-west-1 with the customer accounts through AWS RAM, peer it with a transit gateway in us-east-1, and route the customer VPCs to the service VPC."
        fr: "Partager une passerelle de transit (transit gateway) de eu-west-1 avec les comptes clients par AWS RAM, l'appairer avec une passerelle de transit de us-east-1, et router les VPC clients vers le VPC du service."
    - id: d
      text:
        en: "Add eu-west-1 to the supported Regions of the existing endpoint service, and have customers create interface endpoints in their eu-west-1 VPCs that select us-east-1 as the service Region."
        fr: "Ajouter eu-west-1 aux Régions prises en charge du service de point de terminaison existant, et faire créer par les clients, dans leurs VPC de eu-west-1, des points de terminaison d'interface qui sélectionnent us-east-1 comme Région du service."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      PrivateLink cross-Region access lets a provider host an endpoint service in one Region and make it available in a set of supported Regions. Consumers create interface endpoints in their own Region and select the service Region, so overlapping CIDR blocks do not matter and nothing is added in eu-west-1. IAM principals need the vpce:AllowMultiRegion permission to configure and use cross-Region access.
    fr: |-
      L'accès interrégional PrivateLink permet à un fournisseur d'héberger un service de point de terminaison dans une Région et de le rendre disponible dans un ensemble de Régions prises en charge. Les consommateurs créent des points de terminaison d'interface dans leur propre Région et sélectionnent la Région du service : les blocs CIDR qui se chevauchent n'ont pas d'importance et rien n'est ajouté dans eu-west-1. Les principaux IAM ont besoin de l'autorisation vpce:AllowMultiRegion pour configurer et utiliser l'accès interrégional.
  options:
    a:
      en: |-
        VPC peering cannot connect VPCs with overlapping CIDR blocks, and one peering connection per customer does not scale.
      fr: |-
        L'appairage de VPC ne peut pas relier des VPC dont les blocs CIDR se chevauchent, et une connexion d'appairage par client ne passe pas à l'échelle.
    b:
      en: |-
        This works, but it adds load balancers, an endpoint service and transit gateway peering in eu-west-1 that the company would have to operate.
      fr: |-
        Cela fonctionne, mais ajoute dans eu-west-1 des équilibreurs de charge, un service de point de terminaison et un appairage de passerelles de transit que l'éditeur devrait exploiter.
    c:
      en: |-
        Transit gateways cannot route between overlapping CIDR blocks, and sharing them would connect customer networks to the company's network.
      fr: |-
        Les passerelles de transit ne peuvent pas router entre des blocs CIDR qui se chevauchent, et les partager relierait les réseaux des clients à celui de l'éditeur.
references:
  - title: Share your services through AWS PrivateLink - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-share-your-services.html
