id: sapc03-1a-lattice-auth-layers
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon VPC Lattice service network that is shared with 12 accounts in its organization in AWS Organizations, and about 80 Lattice services are associated with it. The security team has two requirements. First, every request to any service in the network must be signed with Signature Version 4 by an IAM principal that belongs to the organization. Second, the payments service must accept requests only from the IAM role of the checkout service. New services are added every week, and the security team wants the fewest policies to maintain.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un réseau de service Amazon VPC Lattice partagé avec 12 comptes de son organisation AWS Organizations, auquel environ 80 services Lattice sont associés. L'équipe de sécurité a deux exigences. D'abord, chaque requête vers n'importe quel service du réseau doit être signée avec Signature Version 4 par un principal IAM appartenant à l'organisation. Ensuite, le service de paiements ne doit accepter que les requêtes du rôle IAM du service de passage en caisse (checkout). De nouveaux services sont ajoutés chaque semaine, et l'équipe de sécurité veut le moins de politiques possible à maintenir.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Set the auth type of the service network to AWS_IAM with a policy that allows Invoke for principals of the organization and excludes anonymous principals, and set the auth type of the payments service to AWS_IAM with a policy that allows only the checkout role.
        fr: |-
          Définir le type d'authentification du réseau de service sur AWS_IAM avec une politique qui autorise Invoke pour les principaux de l'organisation et exclut les principaux anonymes, et définir le type d'authentification du service de paiements sur AWS_IAM avec une politique qui n'autorise que le rôle checkout.
    - id: b
      text:
        en: |-
          Set the auth type of the service network to NONE, and attach to each of the 80 services an AWS_IAM auth policy that allows principals of the organization, with a stricter policy on the payments service.
        fr: |-
          Définir le type d'authentification du réseau de service sur NONE, et attacher à chacun des 80 services une politique d'authentification AWS_IAM qui autorise les principaux de l'organisation, avec une politique plus stricte sur le service de paiements.
    - id: c
      text:
        en: |-
          Set the auth type of the service network to AWS_IAM with a policy that allows only the checkout role, and set the auth type of the payments service to AWS_IAM with a policy that allows the principals of the organization.
        fr: |-
          Définir le type d'authentification du réseau de service sur AWS_IAM avec une politique qui n'autorise que le rôle checkout, et définir le type d'authentification du service de paiements sur AWS_IAM avec une politique qui autorise les principaux de l'organisation.
    - id: d
      text:
        en: |-
          Attach security groups to the VPC associations of the service network that allow only the CIDR blocks of the organization's VPCs, and allow only the security group of the checkout tasks on the payments targets.
        fr: |-
          Attacher aux associations de VPC du réseau de service des groupes de sécurité qui n'autorisent que les blocs CIDR des VPC de l'organisation, et n'autoriser que le groupe de sécurité des tâches checkout sur les cibles du service de paiements.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A request is authorized only if the service network policy and the service policy both allow it (or their auth type is NONE) and no policy denies it. One network-level policy with an aws:PrincipalOrgID condition that excludes anonymous principals protects every current and future service, and one service-level policy adds the stricter rule for payments; callers sign their requests with SigV4.
    fr: |-
      Une requête n'est autorisée que si la politique du réseau de service et celle du service l'autorisent toutes deux (ou si leur type d'authentification est NONE) et qu'aucune politique ne la refuse. Une seule politique au niveau du réseau, avec une condition aws:PrincipalOrgID qui exclut les principaux anonymes, protège tous les services actuels et futurs, et une seule politique au niveau du service ajoute la règle plus stricte pour les paiements ; les appelants signent leurs requêtes avec SigV4.
  options:
    b:
      en: |-
        With the network auth type set to NONE, every service needs its own policy, so 80 policies must be maintained and each new service is unprotected until someone adds one.
      fr: |-
        Avec le type d'authentification du réseau sur NONE, chaque service a besoin de sa propre politique : 80 politiques sont à maintenir, et chaque nouveau service reste non protégé tant que personne n'en ajoute une.
    c:
      en: |-
        The network policy applies to every service in the network, so allowing only the checkout role would block all the other callers from every other service.
      fr: |-
        La politique du réseau s'applique à tous les services du réseau : n'autoriser que le rôle checkout bloquerait tous les autres appelants vers tous les autres services.
    d:
      en: |-
        Security groups filter by network address and security group, not by IAM principal, so they cannot require SigV4-signed requests from organization principals.
      fr: |-
        Les groupes de sécurité filtrent par adresse réseau et par groupe de sécurité, et non par principal IAM : ils ne peuvent pas exiger des requêtes signées SigV4 par des principaux de l'organisation.
references:
  - title: Control access to VPC Lattice services using auth policies - Amazon VPC Lattice
    url: https://docs.aws.amazon.com/vpc-lattice/latest/ug/auth-policies.html
