id: sapc03-1c-privatelink-security-tools
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A security team runs a vulnerability reporting API on Amazon EC2 instances in a tools VPC in its security account. More than 300 workload VPCs in other accounts of the same organization, many with overlapping CIDR blocks, must call the API on TCP port 443. Workload VPCs must not be able to reach any other resource in the tools VPC, and the tools VPC must not be able to initiate connections to the workload VPCs. Workloads must keep using the existing name api.tools.example.com, in a domain that the company owns.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une équipe de sécurité exécute une API de signalement de vulnérabilités sur des instances Amazon EC2 d'un VPC d'outils de son compte de sécurité. Plus de 300 VPC de charges de travail d'autres comptes de la même organisation, dont beaucoup ont des blocs CIDR qui se chevauchent, doivent appeler l'API sur le port TCP 443. Les VPC de charges de travail ne doivent pouvoir joindre aucune autre ressource du VPC d'outils, et le VPC d'outils ne doit pas pouvoir initier de connexions vers les VPC de charges de travail. Les charges de travail doivent continuer à utiliser le nom existant api.tools.example.com, dans un domaine qui appartient à l'entreprise.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Put the API behind a Network Load Balancer, create a VPC endpoint service for it, allow the organization's accounts as principals, and associate api.tools.example.com as a verified private DNS name."
        fr: "Placer l'API derrière un Network Load Balancer, créer un service de point de terminaison VPC pour celui-ci, autoriser les comptes de l'organisation comme principaux, et associer api.tools.example.com comme nom DNS privé vérifié."
    - id: b
      text:
        en: "Attach the tools VPC and every workload VPC to a transit gateway, and use security groups on the API instances to allow only TCP port 443 from the workload VPCs."
        fr: "Attacher le VPC d'outils et chaque VPC de charges de travail à une passerelle de transit (transit gateway), et utiliser des groupes de sécurité sur les instances de l'API pour n'autoriser que le port TCP 443 depuis les VPC de charges de travail."
    - id: c
      text:
        en: "Create VPC peering connections from the tools VPC to each workload VPC, and add routes only for the IP addresses of the API instances."
        fr: "Créer des connexions d'appairage de VPC entre le VPC d'outils et chaque VPC de charges de travail, et n'ajouter des routes que pour les adresses IP des instances de l'API."
    - id: d
      text:
        en: "Create an interface VPC endpoint for the endpoint service in each workload VPC, with private DNS names enabled."
        fr: "Créer dans chaque VPC de charges de travail un point de terminaison VPC d'interface vers le service de point de terminaison, avec les noms DNS privés activés."
    - id: e
      text:
        en: "Create a gateway VPC endpoint for the endpoint service in each workload VPC, and add the endpoint to the route tables of the workload subnets."
        fr: "Créer dans chaque VPC de charges de travail un point de terminaison VPC de passerelle vers le service de point de terminaison, et ajouter ce point de terminaison aux tables de routage des sous-réseaux de charges de travail."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      PrivateLink exposes only the service behind the Network Load Balancer, connections are initiated from the consumer side, and overlapping CIDR blocks do not matter. When the provider associates a verified private DNS name with the endpoint service, consumers that enable private DNS names on their interface endpoints resolve api.tools.example.com to their endpoint.
    fr: |-
      PrivateLink n'expose que le service placé derrière le Network Load Balancer, les connexions sont initiées côté consommateur, et les blocs CIDR qui se chevauchent n'ont pas d'importance. Lorsque le fournisseur associe un nom DNS privé vérifié au service de point de terminaison, les consommateurs qui activent les noms DNS privés sur leurs points de terminaison d'interface résolvent api.tools.example.com vers leur point de terminaison.
  options:
    b:
      en: |-
        A transit gateway cannot route between overlapping CIDR blocks, and routed connectivity would also let the tools VPC initiate connections.
      fr: |-
        Une passerelle de transit ne peut pas router entre des blocs CIDR qui se chevauchent, et une connectivité routée permettrait aussi au VPC d'outils d'initier des connexions.
    c:
      en: |-
        Peering cannot connect VPCs with overlapping CIDR blocks and opens a routed path in both directions.
      fr: |-
        L'appairage ne peut pas relier des VPC dont les blocs CIDR se chevauchent et ouvre un chemin routé dans les deux sens.
    e:
      en: |-
        Gateway endpoints exist only for Amazon S3 and DynamoDB; endpoint services are reached through interface endpoints.
      fr: |-
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB ; les services de point de terminaison se joignent par des points de terminaison d'interface.
references:
  - title: Share your services through AWS PrivateLink - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-share-your-services.html
