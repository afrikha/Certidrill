id: sapc03-1d-appflow-private-salesforce
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company uses Salesforce as its CRM. The company wants to copy Salesforce opportunity and account records into an Amazon S3 data lake every hour and to transfer only the records that changed since the previous run. A compliance rule requires that the data transfer must not traverse the public internet. The Salesforce administrator has confirmed that the company's Salesforce org is enabled for AWS PrivateLink. The company does not want to write or maintain integration code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle utilise Salesforce comme CRM. L'entreprise veut copier toutes les heures les enregistrements d'opportunités et de comptes Salesforce dans un lac de données Amazon S3 et ne transférer que les enregistrements modifiés depuis l'exécution précédente. Une règle de conformité exige que le transfert des données ne passe pas par l'internet public. L'administrateur Salesforce a confirmé que l'organisation Salesforce de l'entreprise est activée pour AWS PrivateLink. L'entreprise ne veut ni écrire ni maintenir de code d'intégration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Schedule an AWS Glue job every hour that connects to Salesforce with a JDBC driver through a NAT gateway and writes the changed records to S3."
        fr: "Planifier toutes les heures une tâche AWS Glue qui se connecte à Salesforce avec un pilote JDBC via une passerelle NAT et écrit les enregistrements modifiés dans S3."
    - id: b
      text:
        en: "Schedule an AWS Lambda function every hour that calls the Salesforce REST API through a NAT gateway and writes the changed records to S3."
        fr: "Planifier toutes les heures une fonction AWS Lambda qui appelle l'API REST de Salesforce via une passerelle NAT et écrit les enregistrements modifiés dans S3."
    - id: c
      text:
        en: "Configure Salesforce outbound messages to a public Amazon API Gateway REST API that invokes a Lambda function to write each record to S3."
        fr: "Configurer des messages sortants Salesforce vers une API REST publique Amazon API Gateway qui appelle une fonction Lambda pour écrire chaque enregistrement dans S3."
    - id: d
      text:
        en: "Create an Amazon AppFlow flow from Salesforce to S3 that uses a private connection through AWS PrivateLink, scheduled every hour with incremental transfer."
        fr: "Créer un flux Amazon AppFlow de Salesforce vers S3 qui utilise une connexion privée via AWS PrivateLink, planifié toutes les heures avec un transfert incrémentiel."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon AppFlow is a managed, no-code integration service, and a scheduled flow can transfer only new and changed records. Private AppFlow flows send the data over VPC endpoints powered by AWS PrivateLink for supported connectors such as Salesforce, once the SaaS account is enabled for PrivateLink; AppFlow creates and deletes the endpoint service configuration.
    fr: |
      Amazon AppFlow est un service d'intégration géré sans code, et un flux planifié peut ne transférer que les enregistrements nouveaux et modifiés. Les flux AppFlow privés envoient les données par des points de terminaison de VPC basés sur AWS PrivateLink pour les connecteurs pris en charge comme Salesforce, une fois le compte SaaS activé pour PrivateLink ; AppFlow crée et supprime la configuration du service de point de terminaison.
  options:
    a:
      en: |
        Traffic through a NAT gateway reaches Salesforce over the public internet, and the Glue job is integration code to maintain.
      fr: |
        Le trafic qui passe par une passerelle NAT atteint Salesforce par l'internet public, et la tâche Glue est du code d'intégration à maintenir.
    b:
      en: |
        The function is custom integration code, and its API calls through the NAT gateway traverse the public internet.
      fr: |
        La fonction est du code d'intégration personnalisé, et ses appels d'API via la passerelle NAT passent par l'internet public.
    c:
      en: |
        Outbound messages reach a public API endpoint over the internet, and the company must write and maintain the receiving function.
      fr: |
        Les messages sortants atteignent un point de terminaison d'API public par internet, et l'entreprise doit écrire et maintenir la fonction réceptrice.
references:
  - title: Private Amazon AppFlow flows
    url: https://docs.aws.amazon.com/appflow/latest/userguide/private-flows.html
