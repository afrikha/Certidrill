id: sapc03-1c-amazon-mq-activemq-protocols
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs a self-managed Apache ActiveMQ Classic broker on premises. Java applications connect to it through JMS with the OpenWire protocol, and warehouse scanners publish messages with MQTT. The company is moving these applications to AWS and wants a managed message broker. The applications and scanners must keep their current messaging code and protocols. The company wants the solution that requires the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exploite sur site un agent de messages (broker) Apache ActiveMQ Classic autogéré. Des applications Java s'y connectent via JMS avec le protocole OpenWire, et des scanners d'entrepôt publient des messages en MQTT. L'entreprise migre ces applications vers AWS et veut un agent de messages géré. Les applications et les scanners doivent conserver leur code de messagerie et leurs protocoles actuels. L'entreprise veut la solution qui demande le MOINS d'efforts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon MQ for RabbitMQ cluster, and update the broker URLs in the applications and scanners to point to the cluster endpoint."
        fr: "Créer un cluster Amazon MQ for RabbitMQ, et mettre à jour les URL d'agent dans les applications et les scanners pour qu'elles pointent vers le point de terminaison du cluster."
    - id: b
      text:
        en: "Create Amazon SQS queues, and replace the JMS and MQTT client libraries in the applications and scanners with the AWS SDK."
        fr: "Créer des files d'attente Amazon SQS, et remplacer les bibliothèques clientes JMS et MQTT des applications et des scanners par le kit SDK AWS."
    - id: c
      text:
        en: "Create an Amazon MQ for ActiveMQ active/standby broker, and update the broker URLs in the applications and scanners to point to the new broker."
        fr: "Créer un agent Amazon MQ for ActiveMQ actif/en veille, et mettre à jour les URL d'agent dans les applications et les scanners pour qu'elles pointent vers le nouvel agent."
    - id: d
      text:
        en: "Create an Amazon MSK cluster, and replace the JMS producers and consumers in the applications and scanners with Apache Kafka clients."
        fr: "Créer un cluster Amazon MSK, et remplacer les producteurs et consommateurs JMS des applications et des scanners par des clients Apache Kafka."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon MQ is a managed broker service for ActiveMQ Classic and RabbitMQ that lets companies migrate existing brokers without rewriting messaging code. Amazon MQ for ActiveMQ supports OpenWire and MQTT, so only the connection endpoint changes, and an active/standby broker adds high availability.
    fr: |-
      Amazon MQ est un service d'agent de messages géré pour ActiveMQ Classic et RabbitMQ qui permet de migrer des agents existants sans réécrire le code de messagerie. Amazon MQ for ActiveMQ prend en charge OpenWire et MQTT : seul le point de terminaison de connexion change, et un agent actif/en veille apporte la haute disponibilité.
  options:
    a:
      en: |-
        RabbitMQ does not speak ActiveMQ's OpenWire protocol, so the Java applications would need new client code.
      fr: |-
        RabbitMQ ne parle pas le protocole OpenWire d'ActiveMQ : les applications Java auraient besoin d'un nouveau code client.
    b:
      en: |-
        Replacing the client libraries with the AWS SDK is a code change in every application and scanner.
      fr: |-
        Remplacer les bibliothèques clientes par le kit SDK AWS est une modification de code dans chaque application et chaque scanner.
    d:
      en: |-
        Kafka uses its own protocol and client libraries, so every producer and consumer would be rewritten.
      fr: |-
        Kafka utilise son propre protocole et ses propres bibliothèques clientes : chaque producteur et chaque consommateur seraient réécrits.
references:
