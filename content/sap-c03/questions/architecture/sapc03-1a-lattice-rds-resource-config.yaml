id: sapc03-1a-lattice-rds-resource-config
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL database that is not publicly accessible in a VPC of a shared data account. Applications in 20 other accounts of the organization need private TCP access to the database on port 5432. Their VPCs are already associated with an Amazon VPC Lattice service network that the networking account shares through AWS RAM, and many of these VPCs use overlapping CIDR blocks. The company does not want VPC peering or transit gateway routing, and it wants to reuse the existing service network with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une base de données Amazon RDS for PostgreSQL non accessible publiquement dans un VPC d'un compte de données partagé. Des applications de 20 autres comptes de l'organisation ont besoin d'un accès TCP privé à la base de données sur le port 5432. Leurs VPC sont déjà associés à un réseau de service Amazon VPC Lattice que le compte réseau partage au moyen d'AWS RAM, et beaucoup de ces VPC utilisent des blocs CIDR qui se chevauchent. L'entreprise ne veut ni peering de VPC ni routage par passerelle de transit, et veut réutiliser le réseau de service existant avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create a Network Load Balancer in front of the database, publish it as an AWS PrivateLink endpoint service, and have each of the 20 accounts create an interface VPC endpoint to the endpoint service.
        fr: |-
          Créer un Network Load Balancer devant la base de données, le publier comme service de point de terminaison AWS PrivateLink et faire créer par chacun des 20 comptes un point de terminaison de VPC d'interface vers ce service.
    - id: b
      text:
        en: |-
          Create a resource gateway in the database VPC and a resource configuration for the database, add it to the service network, and attach an auth policy to the resource configuration that allows only the application roles.
        fr: |-
          Créer une passerelle de ressources dans le VPC de la base de données et une configuration de ressource pour la base de données, l'ajouter au réseau de service et attacher à la configuration de ressource une politique d'authentification qui n'autorise que les rôles des applications.
    - id: c
      text:
        en: |-
          Create a resource gateway in the database VPC and an ARN-type resource configuration for the database on port 5432, share it with the networking account through AWS RAM, and associate it with the service network.
        fr: |-
          Créer une passerelle de ressources dans le VPC de la base de données et une configuration de ressource de type ARN pour la base de données sur le port 5432, la partager avec le compte réseau au moyen d'AWS RAM et l'associer au réseau de service.
    - id: d
      text:
        en: |-
          Attach the database VPC and the 20 application VPCs to a transit gateway, and use security groups on the database to allow only the CIDR blocks of the application VPCs.
        fr: |-
          Attacher le VPC de la base de données et les 20 VPC des applications à une passerelle de transit, et utiliser des groupes de sécurité sur la base de données pour n'autoriser que les blocs CIDR des VPC des applications.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A VPC Lattice resource configuration represents a resource such as an RDS database (ARN type, TCP, with defined ports) and is attached to a resource gateway, which is the ingress point into the resource's VPC. It can be shared across accounts through AWS RAM and associated with a service network, so the VPCs that are already associated with the network reach the database privately, even with overlapping CIDR blocks.
    fr: |-
      Une configuration de ressource VPC Lattice représente une ressource telle qu'une base de données RDS (type ARN, TCP, avec des ports définis) et est associée à une passerelle de ressources, point d'entrée dans le VPC de la ressource. Elle peut être partagée entre comptes au moyen d'AWS RAM et associée à un réseau de service : les VPC déjà associés au réseau atteignent la base de données de manière privée, même avec des blocs CIDR qui se chevauchent.
  options:
    a:
      en: |-
        PrivateLink with an NLB works with overlapping CIDRs, but it does not reuse the service network and adds a load balancer and 20 endpoints to operate.
      fr: |-
        PrivateLink avec un NLB fonctionne avec des CIDR qui se chevauchent, mais il ne réutilise pas le réseau de service et ajoute un équilibreur de charge et 20 points de terminaison à exploiter.
    b:
      en: |-
        Auth policies can be attached to service networks and services, but they are not supported on resource configurations, so this design cannot be configured as described.
      fr: |-
        Les politiques d'authentification peuvent être attachées aux réseaux de service et aux services, mais elles ne sont pas prises en charge sur les configurations de ressource : cette conception ne peut pas être configurée comme décrit.
    d:
      en: |-
        Transit gateway routing is excluded by the company, and it cannot route correctly between VPCs whose CIDR blocks overlap.
      fr: |-
        Le routage par passerelle de transit est exclu par l'entreprise, et il ne peut pas acheminer correctement le trafic entre des VPC dont les blocs CIDR se chevauchent.
references:
