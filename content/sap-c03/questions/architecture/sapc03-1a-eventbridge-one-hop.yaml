id: sapc03-1a-eventbridge-one-hop
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A retail company has 40 producer accounts in an organization in AWS Organizations. In each producer account, an Amazon EventBridge rule sends order events to a hub event bus in an integration account in the same Region. On the hub bus, one rule invokes an AWS Lambda function in the integration account, and another rule targets a custom event bus in an analytics account. The Lambda function receives the events, but the analytics bus receives none. The resource-based policy of the analytics bus allows the integration account, and the hub rule uses an IAM role that allows events:PutEvents on the analytics bus. The company wants the analytics account to receive the order events without writing custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution dispose de 40 comptes producteurs dans une organisation AWS Organizations. Dans chaque compte producteur, une règle Amazon EventBridge envoie les événements de commande à un bus d'événements central (hub) d'un compte d'intégration, dans la même Région. Sur le bus central, une règle appelle une fonction AWS Lambda du compte d'intégration, et une autre règle cible un bus d'événements personnalisé d'un compte d'analytique. La fonction Lambda reçoit les événements, mais le bus d'analytique n'en reçoit aucun. La politique basée sur les ressources du bus d'analytique autorise le compte d'intégration, et la règle du bus central utilise un rôle IAM qui autorise events:PutEvents sur le bus d'analytique. L'entreprise veut que le compte d'analytique reçoive les événements de commande sans écrire de code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add the analytics bus as a second target of the rule in each producer account with CloudFormation StackSets, and allow the organization in the analytics bus policy.
        fr: |-
          Ajouter le bus d'analytique comme seconde cible de la règle de chaque compte producteur avec CloudFormation StackSets, et autoriser l'organisation dans la politique du bus d'analytique.
    - id: b
      text:
        en: |-
          Replace the IAM role of the hub rule with a role that also trusts the analytics account and allows events:PutEvents on every event bus in the organization.
        fr: |-
          Remplacer le rôle IAM de la règle du bus central par un rôle qui approuve aussi le compte d'analytique et autorise events:PutEvents sur tous les bus d'événements de l'organisation.
    - id: c
      text:
        en: |-
          Change the resource-based policy of the analytics bus to allow all the accounts in the organization with an aws:PrincipalOrgID condition, and keep the hub rule unchanged.
        fr: |-
          Modifier la politique basée sur les ressources du bus d'analytique pour autoriser tous les comptes de l'organisation avec une condition aws:PrincipalOrgID, et conserver la règle du bus central sans modification.
    - id: d
      text:
        en: |-
          Change the hub rule to invoke a Lambda function in the integration account that calls PutEvents to publish a copy of each order event to the analytics bus.
        fr: |-
          Modifier la règle du bus central pour appeler une fonction Lambda du compte d'intégration qui appelle PutEvents afin de publier une copie de chaque événement de commande sur le bus d'analytique.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      EventBridge does not forward events beyond the first receiving bus: events that the hub received from the producer accounts are not delivered when a hub rule sends them on to a third account's bus. The producers must send the events to the analytics bus themselves, so each producer rule gets the analytics bus as an additional target, and the analytics bus must allow the producer accounts, which an organization-wide policy does.
    fr: |-
      EventBridge ne transfère pas les événements au-delà du premier bus récepteur : les événements que le bus central a reçus des comptes producteurs ne sont pas livrés quand une règle du bus central les renvoie vers le bus d'un troisième compte. Les producteurs doivent envoyer eux-mêmes les événements au bus d'analytique : chaque règle productrice reçoit le bus d'analytique comme cible supplémentaire, et le bus d'analytique doit autoriser les comptes producteurs, ce que fait une politique à l'échelle de l'organisation.
  options:
    b:
      en: |-
        The permissions of the hub rule are not the problem; the events are dropped because they would be a second cross-account hop, whatever the role allows.
      fr: |-
        Les autorisations de la règle du bus central ne sont pas en cause : les événements sont abandonnés parce qu'ils constitueraient un second saut entre comptes, quelles que soient les autorisations du rôle.
    c:
      en: |-
        A broader policy on the analytics bus does not change the one-hop behavior, so events forwarded by the hub are still not delivered.
      fr: |-
        Une politique plus large sur le bus d'analytique ne change pas le comportement à un seul saut : les événements transférés par le bus central ne sont toujours pas livrés.
    d:
      en: |-
        Republishing the events as new events would work, but it is custom code to write and operate, which the company wants to avoid.
      fr: |-
        Republier les événements sous forme de nouveaux événements fonctionnerait, mais c'est du code personnalisé à écrire et à exploiter, ce que l'entreprise veut éviter.
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
