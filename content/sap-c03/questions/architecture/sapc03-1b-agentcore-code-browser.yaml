id: sapc03-1b-agentcore-code-browser
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A procurement company is extending a supplier analysis agent that runs on Amazon Bedrock AgentCore Runtime. Users upload CSV files of purchase data, and the agent must write and run Python code to compute statistics and charts from them, in an environment isolated from the company's systems. The agent must also collect current prices from the web portal of a supplier that offers no API, by signing in, navigating pages and filling in search forms. The company wants managed AWS capabilities for both tasks.

    Which combination of capabilities should the agent use? (Choose two.)
  fr: |
    Une entreprise d'achats enrichit un agent d'analyse des fournisseurs qui s'exécute sur Amazon Bedrock AgentCore Runtime. Les utilisateurs chargent des fichiers CSV de données d'achat, et l'agent doit écrire et exécuter du code Python pour en calculer des statistiques et des graphiques, dans un environnement isolé des systèmes de l'entreprise. L'agent doit aussi collecter les prix actuels sur le portail web d'un fournisseur qui n'offre aucune API, en se connectant, en naviguant dans les pages et en remplissant des formulaires de recherche. L'entreprise veut des fonctionnalités AWS gérées pour les deux tâches.

    Quelle combinaison de fonctionnalités l'agent doit-il utiliser ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Amazon Bedrock AgentCore Code Interpreter to run the generated Python code in an isolated sandbox."
        fr: "Amazon Bedrock AgentCore Code Interpreter pour exécuter le code Python généré dans un bac à sable isolé."
    - id: b
      text:
        en: "An Amazon Bedrock knowledge base with a web crawler data source that indexes the supplier portal pages."
        fr: "Une base de connaissances Amazon Bedrock avec une source de données d'indexation web (web crawler) qui indexe les pages du portail fournisseur."
    - id: c
      text:
        en: "Amazon Bedrock AgentCore Browser to let the agent sign in to the portal, navigate it and fill in its forms."
        fr: "Amazon Bedrock AgentCore Browser pour permettre à l'agent de se connecter au portail, d'y naviguer et d'en remplir les formulaires."
    - id: d
      text:
        en: "An AgentCore gateway with an OpenAPI target that describes the supplier portal so that the agent calls it as an MCP tool."
        fr: "Une passerelle AgentCore avec une cible OpenAPI qui décrit le portail fournisseur afin que l'agent l'appelle comme un outil MCP."
    - id: e
      text:
        en: "A Lambda function that receives the generated Python code from the agent and runs it with the exec function in the function's own runtime."
        fr: "Une fonction Lambda qui reçoit de l'agent le code Python généré et l'exécute avec la fonction exec dans son propre environnement d'exécution."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AgentCore Code Interpreter gives agents an isolated sandbox to execute code in Python, JavaScript or TypeScript. AgentCore Browser is a cloud-based browser runtime that lets agents interact with web applications, fill in forms, navigate sites and extract information, which suits a portal without an API."
    fr: "AgentCore Code Interpreter offre aux agents un bac à sable isolé pour exécuter du code Python, JavaScript ou TypeScript. AgentCore Browser est un environnement de navigateur dans le cloud qui permet aux agents d'interagir avec des applications web, de remplir des formulaires, de naviguer dans des sites et d'en extraire des informations, ce qui convient à un portail sans API."
  options:
    b:
      en: "A web crawler only ingests pages for retrieval; it cannot sign in, fill in search forms or return current prices on demand."
      fr: "Un robot d'indexation ne fait qu'ingérer des pages pour la récupération : il ne peut ni se connecter, ni remplir des formulaires de recherche, ni renvoyer des prix actuels à la demande."
    d:
      en: "An OpenAPI target needs an API to call, and the supplier portal offers none."
      fr: "Une cible OpenAPI a besoin d'une API à appeler, et le portail fournisseur n'en propose aucune."
    e:
      en: "Running model-generated code inside a function with its own IAM role and network access is not an isolated sandbox and exposes the company's systems."
      fr: "Exécuter du code généré par un modèle dans une fonction qui a son propre rôle IAM et un accès réseau n'est pas un bac à sable isolé et expose les systèmes de l'entreprise."
references:
  - title: Overview
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/what-is-bedrock-agentcore.html
