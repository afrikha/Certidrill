id: sapc03-1c-eks-custom-networking-cgnat
objective: "1.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon EKS cluster with the IPv4 IP family in a VPC whose only CIDR block, a /22, was allocated from the corporate address plan so that it is routable from the data center. Pods receive VPC IP addresses from the node subnets, and the subnets are almost exhausted, which blocks new deployments. The corporate network team cannot allocate more routable addresses. Pods must still reach services in the data center, but nothing in the data center initiates connections to the pods. The company wants to keep the existing cluster.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Amazon EKS de famille IPv4 dans un VPC dont l'unique bloc CIDR, un /22, a été alloué sur le plan d'adressage de l'entreprise pour être routable depuis le centre de données. Les pods reçoivent des adresses IP du VPC dans les sous-réseaux des nœuds, et ces sous-réseaux sont presque épuisés, ce qui bloque les nouveaux déploiements. L'équipe réseau de l'entreprise ne peut pas allouer davantage d'adresses routables. Les pods doivent toujours joindre des services du centre de données, mais rien dans le centre de données n'initie de connexion vers les pods. L'entreprise veut conserver le cluster existant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a 100.64.0.0/16 secondary CIDR block to the VPC, create pod subnets in it, and enable custom networking in the Amazon VPC CNI with an ENIConfig for each Availability Zone."
        fr: "Ajouter au VPC un bloc CIDR secondaire 100.64.0.0/16, y créer des sous-réseaux pour les pods, et activer la mise en réseau personnalisée (custom networking) dans l'Amazon VPC CNI avec un ENIConfig par zone de disponibilité."
    - id: b
      text:
        en: "Enable prefix delegation in the Amazon VPC CNI so that each node receives /28 prefixes from the existing node subnets instead of individual secondary IP addresses."
        fr: "Activer la délégation de préfixes dans l'Amazon VPC CNI pour que chaque nœud reçoive des préfixes /28 des sous-réseaux de nœuds existants au lieu d'adresses IP secondaires individuelles."
    - id: c
      text:
        en: "Change the cluster's IP family from IPv4 to IPv6, and add IPv6 CIDR blocks to the VPC and its subnets so that pods receive IPv6 addresses."
        fr: "Changer la famille IP du cluster d'IPv4 en IPv6, et ajouter des blocs CIDR IPv6 au VPC et à ses sous-réseaux pour que les pods reçoivent des adresses IPv6."
    - id: d
      text:
        en: "Add a 100.64.0.0/16 secondary CIDR block to the VPC, and launch new node groups in subnets from that block without changing the Amazon VPC CNI configuration."
        fr: "Ajouter au VPC un bloc CIDR secondaire 100.64.0.0/16, et lancer de nouveaux groupes de nœuds dans des sous-réseaux de ce bloc sans modifier la configuration de l'Amazon VPC CNI."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With custom networking, pods receive IP addresses from subnets other than the subnet of the node's primary network interface, such as subnets in a secondary 100.64.0.0/16 block, so the routable /22 is left to the nodes. By default, pod traffic that leaves the VPC is translated to the node's primary IP address, so the data center sees routable addresses.
    fr: |-
      Avec la mise en réseau personnalisée, les pods reçoivent des adresses IP de sous-réseaux différents de celui de l'interface réseau principale du nœud, par exemple des sous-réseaux d'un bloc secondaire 100.64.0.0/16 : le /22 routable reste aux nœuds. Par défaut, le trafic des pods qui quitte le VPC est traduit vers l'adresse IP principale du nœud, et le centre de données voit donc des adresses routables.
  options:
    b:
      en: |-
        Prefix delegation still takes addresses from the exhausted node subnets; it does not add address space.
      fr: |-
        La délégation de préfixes prend toujours des adresses dans les sous-réseaux de nœuds épuisés ; elle n'ajoute pas d'espace d'adressage.
    c:
      en: |-
        The IP family of an EKS cluster is chosen at creation and cannot be changed, so this would require a new cluster.
      fr: |-
        La famille IP d'un cluster EKS est choisie à sa création et ne peut pas être modifiée : il faudrait un nouveau cluster.
    d:
      en: |-
        The nodes and pods would both use the non-routable range, so return traffic from the data center to their addresses would fail.
      fr: |-
        Les nœuds et les pods utiliseraient tous deux la plage non routable : le trafic de retour du centre de données vers leurs adresses échouerait.
references:
  - title: Deploy Pods in alternate subnets with custom networking - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/cni-custom-network.html
  - title: Learn about IPv6 addresses to clusters, Pods, and services - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/cni-ipv6.html
