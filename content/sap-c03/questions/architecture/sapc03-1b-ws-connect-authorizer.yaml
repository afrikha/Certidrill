id: sapc03-1b-ws-connect-authorizer
objective: "1.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A brokerage firm streams account notifications to its web application through an Amazon API Gateway WebSocket API with AWS Lambda integrations. Users sign in with an Amazon Cognito user pool and receive JSON Web Tokens (JWTs). The security team requires that a connection without a valid token is rejected before the connection is established. Backend functions must also know which user sent each later message without validating the token again for every message. Browsers cannot set custom headers on WebSocket requests, so the application passes the ID token in a query string parameter.

    Which solution will meet these requirements?
  fr: |
    Une société de courtage diffuse des notifications de compte vers son application web via une API WebSocket Amazon API Gateway avec des intégrations AWS Lambda. Les utilisateurs se connectent avec un groupe d'utilisateurs Amazon Cognito et reçoivent des jetons web JSON (JWT). L'équipe de sécurité exige qu'une connexion sans jeton valide soit rejetée avant son établissement. Les fonctions du backend doivent aussi savoir quel utilisateur a envoyé chaque message ultérieur sans revalider le jeton à chaque message. Les navigateurs ne peuvent pas définir d'en-têtes personnalisés sur les requêtes WebSocket : l'application transmet donc le jeton d'ID dans un paramètre de chaîne de requête.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure an Amazon Cognito user pool authorizer on the $connect route that reads the ID token from the query string parameter and passes the user's claims to the later route integrations."
        fr: "Configurer un mécanisme d'autorisation de groupe d'utilisateurs Amazon Cognito sur la route $connect qui lit le jeton d'ID dans le paramètre de chaîne de requête et transmet les revendications de l'utilisateur aux intégrations des routes suivantes."
    - id: b
      text:
        en: "Configure a Lambda REQUEST authorizer on the $connect route with the query string as identity source, which validates the JWT and returns a principal ID and a context that later route integrations receive."
        fr: "Configurer un mécanisme d'autorisation Lambda de type REQUEST sur la route $connect avec la chaîne de requête comme source d'identité, qui valide le JWT et renvoie un ID de principal et un contexte que reçoivent les intégrations des routes suivantes."
    - id: c
      text:
        en: "Configure a Lambda REQUEST authorizer on the $default route that validates the JWT included in every message body and returns the user ID to the integration of the route."
        fr: "Configurer un mécanisme d'autorisation Lambda de type REQUEST sur la route $default qui valide le JWT inclus dans le corps de chaque message et renvoie l'ID utilisateur à l'intégration de la route."
    - id: d
      text:
        en: "Accept every connection on $connect, require clients to include the JWT in every message, and validate the token with the user pool keys in the Lambda function of each route."
        fr: "Accepter toutes les connexions sur $connect, exiger des clients qu'ils incluent le JWT dans chaque message, et valider le jeton avec les clés du groupe d'utilisateurs dans la fonction Lambda de chaque route."
answer: { optionId: b }
explanation:
  correct:
    en: "WebSocket APIs support IAM authorization and Lambda REQUEST authorizers, and a Lambda authorizer can be used only on the $connect route, which protects every later route because it runs on each new connection. The authorizer reads identity sources such as query string parameters, rejects invalid tokens with a 401 before the connection exists, and the principal ID and context it returns are available to the integrations of later messages."
    fr: "Les API WebSocket prennent en charge l'autorisation IAM et les mécanismes d'autorisation Lambda de type REQUEST, et un mécanisme d'autorisation Lambda ne s'utilise que sur la route $connect, qui protège toutes les routes suivantes puisqu'elle s'exécute à chaque nouvelle connexion. Le mécanisme lit des sources d'identité comme les paramètres de chaîne de requête, rejette les jetons non valides avec une erreur 401 avant que la connexion n'existe, et l'ID de principal et le contexte qu'il renvoie sont disponibles pour les intégrations des messages suivants."
  options:
    a:
      en: "WebSocket APIs do not offer a Cognito user pool authorizer type; access control uses IAM or Lambda authorizers."
      fr: "Les API WebSocket n'offrent pas de type de mécanisme d'autorisation par groupe d'utilisateurs Cognito : le contrôle d'accès utilise IAM ou des mécanismes d'autorisation Lambda."
    c:
      en: "A Lambda authorizer can be used only on the $connect route, and validating a token in every message is what the requirement wants to avoid."
      fr: "Un mécanisme d'autorisation Lambda ne s'utilise que sur la route $connect, et valider un jeton dans chaque message est justement ce que l'exigence veut éviter."
    d:
      en: "Unauthenticated connections would be established, and the token would be validated again for every message, which fails both requirements."
      fr: "Des connexions non authentifiées seraient établies, et le jeton serait revalidé à chaque message, ce qui ne respecte aucune des deux exigences."
references:
  - title: Control access to WebSocket APIs with AWS Lambda REQUEST authorizers
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api-lambda-auth.html
  - title: Control and manage access to WebSocket APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api-control-access.html
