id: sapc03-1c-ecs-anywhere-stores
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail chain runs a containerized pricing service on two existing Linux servers in each of its 200 stores. Each store has a broadband internet connection. The operations team has no Kubernetes experience and already uses Amazon ECS in AWS. The company wants to deploy and monitor the store containers from the same ECS console and APIs that it uses in the cloud, and it does not want to buy new hardware.

    Which solution will meet these requirements?
  fr: |
    Une chaîne de magasins exécute un service de tarification conteneurisé sur deux serveurs Linux existants dans chacun de ses 200 magasins. Chaque magasin dispose d'une connexion Internet haut débit. L'équipe d'exploitation n'a aucune expérience de Kubernetes et utilise déjà Amazon ECS dans AWS. L'entreprise veut déployer et surveiller les conteneurs des magasins depuis la même console et les mêmes API ECS que dans le cloud, et elle ne veut pas acheter de nouveau matériel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Install an AWS Outposts server in each store, and run the pricing service as ECS tasks on the Outposts servers."
        fr: "Installer un serveur AWS Outposts dans chaque magasin, et exécuter le service de tarification comme tâches ECS sur les serveurs Outposts."
    - id: b
      text:
        en: "Deploy the pricing service in the AWS Local Zone nearest to each group of stores, and have the store applications call it over the internet."
        fr: "Déployer le service de tarification dans l'AWS Local Zone la plus proche de chaque groupe de magasins, et faire appeler ce service par les applications des magasins via Internet."
    - id: c
      text:
        en: "Install Amazon EKS Anywhere on the existing servers in each store, and deploy the pricing service as Kubernetes deployments."
        fr: "Installer Amazon EKS Anywhere sur les serveurs existants de chaque magasin, et déployer le service de tarification sous forme de déploiements Kubernetes."
    - id: d
      text:
        en: "Register the existing store servers as Amazon ECS Anywhere external instances, and run the pricing service with the EXTERNAL launch type."
        fr: "Enregistrer les serveurs existants des magasins comme instances externes Amazon ECS Anywhere, et exécuter le service de tarification avec le type de lancement EXTERNAL."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      ECS Anywhere registers existing on-premises servers as external instances of an ECS cluster by using the SSM Agent, and tasks run on them with the EXTERNAL launch type. The servers need outbound access to the ECS and Systems Manager endpoints, which the broadband links provide, and the same ECS console and APIs manage them.
    fr: |-
      ECS Anywhere enregistre des serveurs sur site existants comme instances externes d'un cluster ECS à l'aide de l'agent SSM, et les tâches s'y exécutent avec le type de lancement EXTERNAL. Les serveurs ont besoin d'un accès sortant aux points de terminaison ECS et Systems Manager, que fournissent les liaisons haut débit, et la même console et les mêmes API ECS les gèrent.
  options:
    a:
      en: |-
        Outposts servers are new AWS hardware, which the company does not want to buy.
      fr: |-
        Les serveurs Outposts sont du nouveau matériel AWS, que l'entreprise ne veut pas acheter.
    b:
      en: |-
        A Local Zone runs the service outside the stores, so the existing store servers are not used and every call depends on the internet link.
      fr: |-
        Une Local Zone exécute le service hors des magasins : les serveurs existants ne sont pas utilisés et chaque appel dépend du lien Internet.
    c:
      en: |-
        EKS Anywhere requires Kubernetes skills that the team lacks, and it is managed with Kubernetes tooling rather than the ECS console and APIs.
      fr: |-
        EKS Anywhere exige des compétences Kubernetes que l'équipe n'a pas, et il se gère avec des outils Kubernetes plutôt qu'avec la console et les API ECS.
references:
  - title: Amazon ECS clusters for external instances - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-anywhere.html
