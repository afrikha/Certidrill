id: sapc03-1a-ecr-cross-account-replication
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company builds all its container images in a central build account and pushes them to Amazon ECR in us-east-1. Production workloads run in separate workload accounts in eu-west-1 and ap-southeast-1, and they must pull images from ECR in their own account and Region, with no cross-Region pulls at deployment time. Only the repositories whose names start with prod/ must be copied. The repositories that are created in the workload accounts must have tag immutability enabled and use AWS KMS encryption. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise construit toutes ses images de conteneur dans un compte de build central et les envoie dans Amazon ECR dans us-east-1. Les charges de travail de production s'exécutent dans des comptes de charge de travail distincts dans eu-west-1 et ap-southeast-1, et doivent extraire les images d'ECR dans leur propre compte et leur propre Région, sans extraction entre Régions au moment du déploiement. Seuls les référentiels dont le nom commence par prod/ doivent être copiés. Les référentiels créés dans les comptes de charge de travail doivent avoir l'immuabilité des balises activée et utiliser le chiffrement AWS KMS. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Add a repository policy to the prod/ repositories in the build account that allows the workload accounts to pull, and point the workloads in both Regions to the image URIs in us-east-1.
        fr: |-
          Ajouter aux référentiels prod/ du compte de build une politique de référentiel qui autorise les comptes de charge de travail à extraire les images, et diriger les charges de travail des deux Régions vers les URI d'images de us-east-1.
    - id: b
      text:
        en: |-
          Configure replication rules to each destination account and Region with a prod prefix filter, allow the build account in each destination's registry permissions policy, and add a replication creation template in each destination.
        fr: |-
          Configurer des règles de réplication vers chaque compte et chaque Région de destination avec un filtre de préfixe prod, autoriser le compte de build dans la politique d'autorisations du registre de chaque destination, et ajouter un modèle de création pour la réplication dans chaque destination.
    - id: c
      text:
        en: |-
          Configure cross-account and cross-Region replication rules with a prod prefix filter in the build registry, and enable tag immutability and KMS encryption on the source repositories so that the settings are copied to the destinations.
        fr: |-
          Configurer dans le registre de build des règles de réplication entre comptes et entre Régions avec un filtre de préfixe prod, et activer l'immuabilité des balises et le chiffrement KMS sur les référentiels sources pour que les paramètres soient copiés vers les destinations.
    - id: d
      text:
        en: |-
          Add a stage to the build pipeline that pulls each new prod/ image and pushes it to the workload accounts' repositories in eu-west-1 and ap-southeast-1, which are created with immutability and KMS encryption.
        fr: |-
          Ajouter au pipeline de build une étape qui extrait chaque nouvelle image prod/ et l'envoie dans les référentiels des comptes de charge de travail dans eu-west-1 et ap-southeast-1, créés avec l'immuabilité et le chiffrement KMS.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Private image replication copies images across Regions and accounts, and PREFIX_MATCH repository filters limit it to the prod/ repositories. Cross-account replication requires a registry permissions policy in each destination account that allows the source, and a repository creation template that applies to replication sets tag immutability and KMS encryption on the repositories that ECR creates in the destinations.
    fr: |-
      La réplication d'images privées copie les images entre Régions et entre comptes, et des filtres de référentiel PREFIX_MATCH la limitent aux référentiels prod/. La réplication entre comptes exige, dans chaque compte de destination, une politique d'autorisations du registre qui autorise la source, et un modèle de création de référentiel qui s'applique à la réplication définit l'immuabilité des balises et le chiffrement KMS sur les référentiels qu'ECR crée dans les destinations.
  options:
    a:
      en: |-
        Pulling from us-east-1 is a cross-Region pull at deployment time, which the requirements forbid.
      fr: |-
        Extraire depuis us-east-1 constitue une extraction entre Régions au moment du déploiement, ce que les exigences interdisent.
    c:
      en: |-
        Without a registry permissions policy in the destination accounts, cross-account replication does not occur, and repositories created by replication get default settings unless a creation template applies.
      fr: |-
        Sans politique d'autorisations du registre dans les comptes de destination, la réplication entre comptes n'a pas lieu, et les référentiels créés par la réplication reçoivent les paramètres par défaut si aucun modèle de création ne s'applique.
    d:
      en: |-
        A custom copy stage duplicates the managed replication feature and adds pipeline steps and credentials to maintain for every account and Region.
      fr: |-
        Une étape de copie personnalisée duplique la fonctionnalité de réplication gérée et ajoute des étapes de pipeline et des informations d'identification à maintenir pour chaque compte et chaque Région.
references:
  - title: Configuring private image replication in Amazon ECR - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/registry-settings-configure.html
  - title: Templates to control repositories created during a pull through cache, create on push, or replication action - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/repository-creation-templates.html
