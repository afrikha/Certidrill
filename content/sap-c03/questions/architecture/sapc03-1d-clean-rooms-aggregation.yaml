id: sapc03-1d-clean-rooms-aggregation
objective: "1.5.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A grocery retailer and a consumer goods brand use separate AWS accounts that belong to different organizations. They want to measure how many retailer customers who bought the brand's products had seen the brand's online ads, broken down by product category and week. Both companies hold hashed email addresses in tables in Amazon S3 that are cataloged in the AWS Glue Data Catalog. Neither company may see the other's row-level records, and every result row must aggregate at least 100 distinct customers. The brand will run the analyses and must pay for the query compute.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Un détaillant alimentaire et une marque de produits de grande consommation utilisent des comptes AWS distincts qui appartiennent à des organisations différentes. Ils veulent mesurer combien de clients du détaillant ayant acheté les produits de la marque avaient vu les publicités en ligne de la marque, par catégorie de produits et par semaine. Les deux entreprises détiennent des adresses e-mail hachées dans des tables Amazon S3 cataloguées dans AWS Glue Data Catalog. Aucune des deux entreprises ne doit voir les enregistrements au niveau des lignes de l'autre, et chaque ligne de résultat doit agréger au moins 100 clients distincts. La marque exécutera les analyses et doit payer le calcul des requêtes.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Share the retailer's purchase table with the brand account through AWS Lake Formation cross-account grants, with a data filter that excludes the hashed email column."
        fr: "Partager la table des achats du détaillant avec le compte de la marque par des octrois entre comptes AWS Lake Formation, avec un filtre de données qui exclut la colonne des e-mails hachés."
    - id: b
      text:
        en: "Create an AWS Clean Rooms collaboration with an aggregation analysis rule that requires 100 distinct hashed emails per row, with the brand as the querying and paying member."
        fr: "Créer une collaboration AWS Clean Rooms avec une règle d'analyse d'agrégation qui exige 100 e-mails hachés distincts par ligne, la marque étant le membre qui interroge et qui paie."
    - id: c
      text:
        en: "Create a datashare from an Amazon Redshift cluster in the retailer account to a Redshift Serverless workgroup in the brand account, and share a view that joins the two data sets."
        fr: "Créer un partage de données (datashare) d'un cluster Amazon Redshift du compte du détaillant vers un groupe de travail Redshift Serverless du compte de la marque, et partager une vue qui joint les deux jeux de données."
    - id: d
      text:
        en: "Copy both data sets to an S3 bucket in a third AWS account, and let the brand run Athena queries on that bucket under a bucket policy that allows only the brand."
        fr: "Copier les deux jeux de données dans un compartiment S3 d'un troisième compte AWS, et laisser la marque exécuter des requêtes Athena sur ce compartiment avec une politique de compartiment qui n'autorise que la marque."
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Clean Rooms lets partners analyze their combined data without revealing the underlying records; it reads each member's Glue tables in place and applies their analysis rules. An aggregation rule allows only aggregate results over INNER JOIN with a minimum aggregation threshold, and rows below the threshold are removed. The collaboration creator designates the member who can query and the member who pays for query compute.
    fr: |
      AWS Clean Rooms permet à des partenaires d'analyser leurs données combinées sans révéler les enregistrements sous-jacents ; il lit sur place les tables Glue de chaque membre et applique leurs règles d'analyse. Une règle d'agrégation n'autorise que des résultats agrégés sur une INNER JOIN avec un seuil minimal d'agrégation, et les lignes sous ce seuil sont supprimées. Le créateur de la collaboration désigne le membre qui peut interroger et le membre qui paie le calcul des requêtes.
  options:
    a:
      en: |
        The brand would see the retailer's row-level purchases, and without the hashed email column it could not even match the two data sets.
      fr: |
        La marque verrait les achats du détaillant au niveau des lignes, et sans la colonne des e-mails hachés elle ne pourrait même pas rapprocher les deux jeux de données.
    c:
      en: |
        To build the joined view, the retailer must load the brand's row-level data into its own cluster, so one party sees the other's records, and no aggregation threshold is enforced.
      fr: |
        Pour construire la vue jointe, le détaillant doit charger les données de la marque au niveau des lignes dans son propre cluster : une partie voit les enregistrements de l'autre, et aucun seuil d'agrégation n'est appliqué.
    d:
      en: |
        The brand could query the retailer's raw rows in the shared bucket, and the copies add data movement to operate.
      fr: |
        La marque pourrait interroger les lignes brutes du détaillant dans le compartiment partagé, et les copies ajoutent des mouvements de données à exploiter.
