id: sapc03-1c-shared-vpc-subnets
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payments company has 15 application accounts for one product line in AWS Organizations. The applications exchange large volumes of traffic with each other and share the same trust boundary. Today, each account has its own VPC attached to a transit gateway, and the transit gateway data processing charges keep growing. Each application team must keep its resources, permissions and billing in its own account. A central network team must control the IP addressing, route tables and internet egress.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une société de paiement possède, dans AWS Organizations, 15 comptes applicatifs pour une même gamme de produits. Les applications échangent de gros volumes de trafic entre elles et partagent la même frontière de confiance. Aujourd'hui, chaque compte a son propre VPC attaché à une passerelle de transit (transit gateway), et les frais de traitement de données de la passerelle ne cessent d'augmenter. Chaque équipe applicative doit conserver ses ressources, ses autorisations et sa facturation dans son propre compte. Une équipe réseau centrale doit contrôler l'adressage IP, les tables de routage et la sortie Internet.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create one VPC in a network account, share its subnets with the 15 application accounts through AWS RAM, and deploy each team's resources into them."
        fr: "Créer un seul VPC dans un compte réseau, partager ses sous-réseaux avec les 15 comptes applicatifs par AWS RAM, et y déployer les ressources de chaque équipe."
    - id: b
      text:
        en: "Replace the transit gateway with a full mesh of VPC peering connections between the 15 VPCs, and have the network team manage the routes in every account."
        fr: "Remplacer la passerelle de transit par un maillage complet de connexions d'appairage de VPC entre les 15 VPC, et faire gérer les routes de chaque compte par l'équipe réseau."
    - id: c
      text:
        en: "Move all 15 applications into a single account and VPC, and use IAM policies and cost allocation tags to separate the teams' permissions and costs."
        fr: "Regrouper les 15 applications dans un seul compte et un seul VPC, et utiliser des politiques IAM et des balises de répartition des coûts pour séparer les autorisations et les coûts des équipes."
    - id: d
      text:
        en: "Keep the 15 VPCs, and expose each application to the others through AWS PrivateLink endpoint services and interface endpoints."
        fr: "Conserver les 15 VPC, et exposer chaque application aux autres par des services de point de terminaison AWS PrivateLink et des points de terminaison d'interface."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      VPC sharing lets the owner account share subnets with other accounts in the same organization. Participants create and manage their own resources in the shared subnets but cannot view or modify the resources of the owner or of other participants, so the network team keeps control of the VPC. Traffic between the applications uses implicit routing within the VPC, without transit gateway processing charges, and each account keeps its own billing and access control.
    fr: |-
      Le partage de VPC permet au compte propriétaire de partager des sous-réseaux avec d'autres comptes de la même organisation. Les participants créent et gèrent leurs propres ressources dans les sous-réseaux partagés, sans pouvoir voir ni modifier celles du propriétaire ou des autres participants : l'équipe réseau garde le contrôle du VPC. Le trafic entre applications utilise le routage implicite du VPC, sans frais de traitement de passerelle de transit, et chaque compte conserve sa facturation et son contrôle d'accès.
  options:
    b:
      en: |-
        A full mesh of 105 peering connections, with routes in 15 accounts, is far more to manage than one shared VPC.
      fr: |-
        Un maillage complet de 105 connexions d'appairage, avec des routes dans 15 comptes, est bien plus lourd à gérer qu'un seul VPC partagé.
    c:
      en: |-
        A single account removes the account-level separation of resources, permissions and billing that each team must keep.
      fr: |-
        Un compte unique supprime la séparation par compte des ressources, des autorisations et de la facturation que chaque équipe doit conserver.
    d:
      en: |-
        An endpoint service per application and endpoints per consumer add resources and charges, and they only allow connections from consumers to providers.
      fr: |-
        Un service de point de terminaison par application et des points de terminaison par consommateur ajoutent des ressources et des frais, et n'autorisent que des connexions des consommateurs vers les fournisseurs.
references:
  - title: Share your VPC subnets with other accounts - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html
