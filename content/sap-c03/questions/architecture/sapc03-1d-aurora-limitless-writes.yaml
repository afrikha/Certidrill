id: sapc03-1d-aurora-limitless-writes
objective: "1.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketplace company stores orders in an Amazon Aurora PostgreSQL DB cluster. The writer instance already uses the largest instance class that the company can select, and during sales events the write throughput exceeds what a single writer instance can process. Read traffic is already served by Aurora Replicas. The company wants to scale write throughput horizontally while the applications keep connecting to one PostgreSQL endpoint and keep using SQL with transactional consistency. The company does not want to build or maintain its own sharding logic.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de place de marché stocke les commandes dans un cluster de bases de données Amazon Aurora PostgreSQL. L'instance d'enregistreur utilise déjà la plus grande classe d'instance que l'entreprise peut choisir, et pendant les événements de vente, le débit d'écriture dépasse ce qu'une seule instance d'enregistreur peut traiter. Le trafic de lecture est déjà servi par des réplicas Aurora. L'entreprise veut mettre à l'échelle horizontalement le débit d'écriture tout en laissant les applications se connecter à un seul point de terminaison PostgreSQL et utiliser SQL avec une cohérence transactionnelle. L'entreprise ne veut ni développer ni maintenir sa propre logique de partitionnement (sharding).

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add Aurora Replicas with Aurora Auto Scaling, and route the order inserts to the reader endpoint of the cluster during sales events."
        fr: "Ajouter des réplicas Aurora avec Aurora Auto Scaling, et acheminer les insertions de commandes vers le point de terminaison de lecteur du cluster pendant les événements de vente."
    - id: b
      text:
        en: "Convert the cluster to an Aurora global database in two Regions, and enable write forwarding so that each Region accepts order writes."
        fr: "Convertir le cluster en base de données globale Aurora dans deux Régions, et activer le transfert des écritures afin que chaque Région accepte des écritures de commandes."
    - id: c
      text:
        en: "Migrate to Aurora PostgreSQL Limitless Database, create the orders table as a sharded table on the customer ID, and keep small lookup tables as reference tables."
        fr: "Migrer vers Aurora PostgreSQL Limitless Database, créer la table des commandes comme table partitionnée (sharded) sur l'ID client, et garder les petites tables de référence comme tables de référence (reference tables)."
    - id: d
      text:
        en: "Create four Aurora PostgreSQL clusters, assign customers to clusters by a hash of the customer ID, and add the routing logic to the applications."
        fr: "Créer quatre clusters Aurora PostgreSQL, répartir les clients entre les clusters selon un hachage de l'ID client, et ajouter la logique de routage aux applications."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Aurora PostgreSQL Limitless Database replaces the single writer with a DB shard group of routers and shards. Sharded tables are hash-partitioned across shards on a shard key, so writes are processed in parallel, and reference tables are copied to every shard for local joins. Clients use the DB cluster endpoint, and the routers present one database image and manage distributed transactions to keep the database consistent.
    fr: |
      Aurora PostgreSQL Limitless Database remplace l'enregistreur unique par un groupe de partitions (DB shard group) composé de routeurs et de partitions. Les tables partitionnées sont réparties par hachage entre les partitions selon une clé de partitionnement, de sorte que les écritures sont traitées en parallèle, et les tables de référence sont copiées sur chaque partition pour des jointures locales. Les clients utilisent le point de terminaison du cluster, et les routeurs présentent une image unique de la base de données et gèrent les transactions distribuées pour en préserver la cohérence.
  options:
    a:
      en: |
        Aurora Replicas are read-only, so the reader endpoint cannot accept order inserts, and adding replicas does not add write capacity.
      fr: |
        Les réplicas Aurora sont en lecture seule : le point de terminaison de lecteur ne peut pas accepter les insertions de commandes, et l'ajout de réplicas n'ajoute aucune capacité d'écriture.
    b:
      en: |
        Forwarded writes are still executed by the single writer of the primary cluster, so write capacity does not grow.
      fr: |
        Les écritures transférées sont toujours exécutées par l'enregistreur unique du cluster principal : la capacité d'écriture n'augmente pas.
    d:
      en: |
        Application-level sharding is exactly the custom sharding logic the company does not want, and cross-cluster transactions would lose consistency.
      fr: |
        Le partitionnement au niveau de l'application est précisément la logique de partitionnement personnalisée dont l'entreprise ne veut pas, et les transactions entre clusters perdraient leur cohérence.
references:
  - title: Aurora PostgreSQL Limitless Database architecture
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/limitless-architecture.html
