id: sapc03-1a-durable-function-timeout
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A fintech company is building a customer onboarding process with a team of TypeScript developers. The process creates an account, sends a verification email, waits until the customer verifies the email (which can take up to 7 days), and then calls three internal APIs that sometimes fail and must be retried. The team wants to write the process as sequential TypeScript code in a single AWS Lambda function, with the orchestration and the business logic in the same codebase. After a failure, the process must resume from the last completed step, and the company must not pay for compute while the process waits. The team does not want to learn or maintain a separate workflow definition language.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise fintech construit un processus d'intégration des clients avec une équipe de développeurs TypeScript. Le processus crée un compte, envoie un e-mail de vérification, attend que le client vérifie l'e-mail (ce qui peut prendre jusqu'à 7 jours), puis appelle trois API internes qui échouent parfois et doivent être relancées. L'équipe veut écrire le processus sous forme de code TypeScript séquentiel dans une seule fonction AWS Lambda, avec l'orchestration et la logique métier dans le même code. Après une panne, le processus doit reprendre à partir de la dernière étape terminée, et l'entreprise ne doit pas payer de calcul pendant que le processus attend. L'équipe ne veut ni apprendre ni maintenir un langage de définition de flux de travail distinct.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: |-
          Define an AWS Step Functions Standard workflow in Amazon States Language with a Lambda task for each step, a callback task for the verification, and a Retry field on each API call.
        fr: |-
          Définir un flux de travail Standard AWS Step Functions en Amazon States Language avec une tâche Lambda pour chaque étape, une tâche de rappel pour la vérification et un champ Retry sur chaque appel d'API.
    - id: b
      text:
        en: |-
          Write a Lambda function that records the current step in an Amazon DynamoDB table and reschedules itself through delayed Amazon SQS messages until the customer verifies the email.
        fr: |-
          Écrire une fonction Lambda qui enregistre l'étape en cours dans une table Amazon DynamoDB et se replanifie au moyen de messages Amazon SQS différés jusqu'à ce que le client vérifie l'e-mail.
    - id: c
      text:
        en: |-
          Create a Lambda durable function with the durable execution SDK, wrap each API call in a step, wait for the verification callback, and set the execution timeout to 8 days.
        fr: |-
          Créer une fonction durable Lambda avec le kit SDK d'exécution durable, encapsuler chaque appel d'API dans une étape, attendre le rappel de vérification et définir le délai d'exécution sur 8 jours.
    - id: d
      text:
        en: |-
          Create a Lambda durable function with the durable execution SDK, wrap each API call in a step, wait for the verification callback, and keep the default execution settings.
        fr: |-
          Créer une fonction durable Lambda avec le kit SDK d'exécution durable, encapsuler chaque appel d'API dans une étape, attendre le rappel de vérification et conserver les paramètres d'exécution par défaut.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Durable functions let developers write multi-step workflows as ordinary code: steps are checkpointed with built-in retries, replay skips completed steps after an interruption, and waits suspend the function without compute charges. Waits count against the execution timeout, which defaults to 24 hours (maximum 366 days), so the timeout must be raised above the 7-day verification window.
    fr: |-
      Les fonctions durables permettent d'écrire des flux de travail en plusieurs étapes sous forme de code ordinaire : les étapes font l'objet de points de contrôle avec des relances intégrées, la réexécution (replay) ignore les étapes terminées après une interruption, et les attentes suspendent la fonction sans frais de calcul. Les attentes sont décomptées du délai d'exécution, qui est de 24 heures par défaut (366 jours au maximum) : il faut donc le porter au-delà de la fenêtre de vérification de 7 jours.
  options:
    a:
      en: |-
        Step Functions meets the durability needs, but the workflow is defined in Amazon States Language, the separate definition language that the team does not want to maintain.
      fr: |-
        Step Functions répond aux besoins de durabilité, mais le flux de travail est défini en Amazon States Language, le langage de définition distinct que l'équipe ne veut pas maintenir.
    b:
      en: |-
        Hand-built checkpointing and rescheduling is custom orchestration code to write, test, and operate, which is more overhead than a managed durable execution.
      fr: |-
        Des points de contrôle et une replanification construits à la main constituent du code d'orchestration personnalisé à écrire, tester et exploiter, soit plus de charge qu'une exécution durable gérée.
    d:
      en: |-
        With the default execution timeout of 24 hours, a customer who verifies after more than a day would find the execution already timed out.
      fr: |-
        Avec le délai d'exécution par défaut de 24 heures, un client qui vérifie son e-mail après plus d'une journée trouverait l'exécution déjà expirée.
references:
  - title: Basic concepts - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-basic-concepts.html
  - title: Durable functions or Step Functions - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-step-functions.html
