id: sapc03-1c-sg-referencing-tgw
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has six VPCs in us-east-2 that attach to the same transit gateway. Traffic between the application VPCs is routed directly between their attachments and does not pass through an inspection appliance. Security groups currently allow inbound traffic from the CIDR blocks of the other VPCs. Auditors want rules that allow only the specific instances that need access, without maintaining IP address lists as Auto Scaling groups replace instances. The company does not want to add VPC peering connections or custom automation.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède six VPC dans us-east-2, attachés à la même passerelle de transit (transit gateway). Le trafic entre les VPC applicatifs est routé directement entre leurs attachements et ne passe par aucune appliance d'inspection. Les groupes de sécurité autorisent actuellement le trafic entrant depuis les blocs CIDR des autres VPC. Les auditeurs veulent des règles qui n'autorisent que les instances qui ont besoin d'accès, sans maintenir de listes d'adresses IP au fil des remplacements d'instances par les groupes Auto Scaling. L'entreprise ne veut ajouter ni connexions d'appairage de VPC ni automatisation personnalisée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable security group referencing support on the transit gateway only, and reference the security groups of the other VPCs in both the inbound and the outbound rules."
        fr: "Activer la prise en charge du référencement de groupes de sécurité sur la passerelle de transit uniquement, et référencer les groupes de sécurité des autres VPC dans les règles entrantes et sortantes."
    - id: b
      text:
        en: "Create customer managed prefix lists of the allowed instances' IP addresses, update them with an AWS Lambda function on Auto Scaling events, and reference them in the rules."
        fr: "Créer des listes de préfixes gérées par le client avec les adresses IP des instances autorisées, les mettre à jour avec une fonction AWS Lambda sur les événements Auto Scaling, et les référencer dans les règles."
    - id: c
      text:
        en: "Enable security group referencing support on the transit gateway and on each VPC attachment, and reference the source security groups of the other VPCs in inbound rules."
        fr: "Activer la prise en charge du référencement de groupes de sécurité sur la passerelle de transit et sur chaque attachement de VPC, et référencer les groupes de sécurité sources des autres VPC dans les règles entrantes."
    - id: d
      text:
        en: "Create VPC peering connections between the application VPCs, and reference the peer VPCs' security groups in the inbound rules."
        fr: "Créer des connexions d'appairage de VPC entre les VPC applicatifs, et référencer les groupes de sécurité des VPC appairés dans les règles entrantes."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Transit Gateway supports security group referencing between VPCs attached to the same transit gateway when the feature is enabled on both the transit gateway and its VPC attachments. Security groups can be referenced only in inbound rules, and the feature does not work across a Gateway Load Balancer or Network Firewall inspection path, which this traffic does not use.
    fr: |-
      Transit Gateway prend en charge le référencement de groupes de sécurité entre VPC attachés à la même passerelle de transit lorsque la fonctionnalité est activée à la fois sur la passerelle et sur ses attachements de VPC. Les groupes de sécurité ne peuvent être référencés que dans les règles entrantes, et la fonctionnalité ne fonctionne pas à travers une inspection par Gateway Load Balancer ou Network Firewall, que ce trafic n'utilise pas.
  options:
    a:
      en: |-
        Referencing works only when it is enabled on the transit gateway and on its VPC attachments, and outbound rules do not support security group referencing.
      fr: |-
        Le référencement ne fonctionne que s'il est activé sur la passerelle de transit et sur ses attachements de VPC, et les règles sortantes ne prennent pas en charge le référencement de groupes de sécurité.
    b:
      en: |-
        Prefix lists updated by a function are the custom automation that the company wants to avoid.
      fr: |-
        Des listes de préfixes mises à jour par une fonction constituent l'automatisation personnalisée que l'entreprise veut éviter.
    d:
      en: |-
        The company does not want to add peering connections, and the transit gateway can already support security group references.
      fr: |-
        L'entreprise ne veut pas ajouter de connexions d'appairage, et la passerelle de transit peut déjà prendre en charge les références de groupes de sécurité.
references:
  - title: Amazon VPC attachments in AWS Transit Gateway - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
