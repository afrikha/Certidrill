id: sapc03-1c-dns-route53-profiles
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company manages 220 VPCs in 45 accounts in AWS Organizations, all in eu-central-1. Every VPC must resolve 14 private hosted zones owned by a shared services account, must use the same Route 53 Resolver forwarding rules for on-premises domains and must be protected by the same Route 53 Resolver DNS Firewall rule groups. Today, engineers run AWS CLI scripts that authorize and associate each private hosted zone with each VPC, and they configure the rules and the rule groups separately. An account vending pipeline creates about 10 new VPCs every week. The company wants every VPC to receive the complete DNS configuration with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise gère 220 VPC répartis dans 45 comptes d'AWS Organizations, tous dans eu-central-1. Chaque VPC doit résoudre 14 zones hébergées privées détenues par un compte de services partagés, utiliser les mêmes règles de transfert Route 53 Resolver pour les domaines sur site et être protégé par les mêmes groupes de règles Route 53 Resolver DNS Firewall. Aujourd'hui, des ingénieurs exécutent des scripts AWS CLI qui autorisent et associent chaque zone hébergée privée à chaque VPC, et ils configurent séparément les règles et les groupes de règles. Un pipeline de distribution de comptes crée une dizaine de nouveaux VPC chaque semaine. L'entreprise veut que chaque VPC reçoive la configuration DNS complète avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Route 53 Profile with the private hosted zones, forwarding rules and DNS Firewall rule groups, share it through AWS RAM, and have the pipeline associate each new VPC with it."
        fr: "Créer un profil Route 53 (Route 53 Profile) avec les zones hébergées privées, les règles de transfert et les groupes de règles DNS Firewall, le partager par AWS RAM, et y faire associer chaque nouveau VPC par le pipeline."
    - id: b
      text:
        en: "Keep the cross-account association scripts for the private hosted zones, share the forwarding rules with AWS RAM, and deploy the DNS Firewall rule groups with an AWS Firewall Manager policy."
        fr: "Conserver les scripts d'association intercomptes des zones hébergées privées, partager les règles de transfert avec AWS RAM, et déployer les groupes de règles DNS Firewall avec une politique AWS Firewall Manager."
    - id: c
      text:
        en: "Run Amazon EC2 DNS servers in the shared services account that host copies of the zones and forward on-premises domains, and point every VPC's DHCP options set to them."
        fr: "Exécuter dans le compte de services partagés des serveurs DNS sur Amazon EC2 qui hébergent des copies des zones et transfèrent les domaines sur site, et faire pointer le jeu d'options DHCP de chaque VPC vers eux."
    - id: d
      text:
        en: "Convert the 14 private hosted zones into public hosted zones so that every VPC can resolve them without associations, and share the forwarding rules with AWS RAM."
        fr: "Convertir les 14 zones hébergées privées en zones hébergées publiques pour que chaque VPC puisse les résoudre sans association, et partager les règles de transfert avec AWS RAM."
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A Route 53 Profile groups private hosted zones, Resolver rules and DNS Firewall rule groups and applies them to every VPC associated with it. Profiles are shared with other accounts through AWS RAM, so the pipeline needs one association per new VPC, and changes to the Profile propagate to all associated VPCs.
    fr: |-
      Un profil Route 53 regroupe des zones hébergées privées, des règles Resolver et des groupes de règles DNS Firewall et les applique à chaque VPC qui lui est associé. Les profils se partagent avec d'autres comptes par AWS RAM : le pipeline n'a besoin que d'une association par nouveau VPC, et les modifications du profil se propagent à tous les VPC associés.
  options:
    b:
      en: |-
        This works, but each private hosted zone still needs an authorization and an association per VPC, done with the CLI or API, plus separate mechanisms for the rules and the firewall, which is more overhead than one Profile.
      fr: |-
        Cela fonctionne, mais chaque zone hébergée privée exige encore une autorisation et une association par VPC, par CLI ou API, plus des mécanismes distincts pour les règles et le pare-feu : c'est plus lourd qu'un seul profil.
    c:
      en: |-
        Self-managed DNS servers must be patched, scaled and kept in sync, and bypassing Route 53 Resolver also bypasses DNS Firewall.
      fr: |-
        Des serveurs DNS autogérés doivent être corrigés, mis à l'échelle et synchronisés, et contourner Route 53 Resolver contourne aussi DNS Firewall.
    d:
      en: |-
        Public hosted zones expose the internal names to the internet.
      fr: |-
        Des zones hébergées publiques exposent les noms internes sur Internet.
references:
  - title: What are Amazon Route 53 Profiles? - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/profiles.html
  - title: Associating an Amazon VPC and a private hosted zone that you created with different AWS accounts - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-associate-vpcs-different-accounts.html
