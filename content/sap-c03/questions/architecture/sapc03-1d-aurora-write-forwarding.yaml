id: sapc03-1d-aurora-write-forwarding
objective: "1.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company runs an Amazon Aurora MySQL global database with its primary cluster in us-east-1 and a secondary cluster in eu-west-1. The European deployment of the application reads from the secondary cluster. About 3% of European requests update user preferences, so the European application keeps a second connection pool to the writer endpoint of the primary cluster and contains custom logic that routes each write statement to it. The company wants the European application to send all its SQL statements to the database cluster in its own Region and to remove the custom routing code. The data must keep a single writer.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de voyages exploite une base de données globale Amazon Aurora MySQL avec son cluster principal dans us-east-1 et un cluster secondaire dans eu-west-1. Le déploiement européen de l'application lit dans le cluster secondaire. Environ 3 % des requêtes européennes mettent à jour des préférences utilisateur : l'application européenne garde donc un second pool de connexions vers le point de terminaison d'enregistreur du cluster principal et contient une logique personnalisée qui y achemine chaque instruction d'écriture. L'entreprise veut que l'application européenne envoie toutes ses instructions SQL au cluster de bases de données de sa propre Région et supprimer le code de routage personnalisé. Les données doivent conserver un seul enregistreur.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Detach the eu-west-1 cluster from the global database, and configure bidirectional binary log replication between the two clusters."
        fr: "Détacher le cluster de eu-west-1 de la base de données globale, et configurer une réplication bidirectionnelle par journaux binaires entre les deux clusters."
    - id: b
      text:
        en: "Enable write forwarding on the eu-west-1 secondary cluster, and connect the European application only to the endpoints of that cluster."
        fr: "Activer le transfert des écritures (write forwarding) sur le cluster secondaire de eu-west-1, et connecter l'application européenne uniquement aux points de terminaison de ce cluster."
    - id: c
      text:
        en: "Deploy Amazon RDS Proxy in eu-west-1 with the us-east-1 writer instance as its target, and send the European write statements to the proxy."
        fr: "Déployer Amazon RDS Proxy dans eu-west-1 avec l'instance d'enregistreur de us-east-1 comme cible, et envoyer les instructions d'écriture européennes au proxy."
    - id: d
      text:
        en: "Move the user preference tables to an Amazon DynamoDB global table with replicas in both Regions, and change the code that writes preferences."
        fr: "Déplacer les tables de préférences utilisateur vers une table globale Amazon DynamoDB avec des réplicas dans les deux Régions, et modifier le code qui écrit les préférences."
answer: { optionId: b }
explanation:
  correct:
    en: |
      With write forwarding, a secondary cluster forwards the SQL statements that write data to the primary cluster, which applies them and replicates the changes to every secondary Region. Aurora handles the cross-Region networking and the session and transactional context, so the application no longer needs its own routing, and the primary cluster stays the single source of truth.
    fr: |
      Avec le transfert des écritures, un cluster secondaire transmet au cluster principal les instructions SQL qui écrivent des données ; le principal les applique et réplique les modifications vers chaque Région secondaire. Aurora gère le réseau entre Régions ainsi que le contexte de session et de transaction : l'application n'a plus besoin de son propre routage, et le cluster principal reste l'unique source de vérité.
  options:
    a:
      en: |
        Two clusters that both accept writes no longer have a single writer, they can create conflicts, and the company would operate the replication itself.
      fr: |
        Deux clusters qui acceptent tous deux des écritures n'ont plus un seul enregistreur, ils peuvent créer des conflits, et l'entreprise exploiterait elle-même la réplication.
    c:
      en: |
        An RDS proxy must be in the same VPC as its database, so it cannot target a writer in another Region, and the application would still split reads and writes.
      fr: |
        Un proxy RDS doit se trouver dans le même VPC que sa base de données : il ne peut pas cibler un enregistreur d'une autre Région, et l'application séparerait toujours lectures et écritures.
    d:
      en: |
        This adds a second database and requires code changes, and a multi-active global table no longer keeps a single writer for the data.
      fr: |
        Cela ajoute une seconde base de données et exige des modifications du code, et une table globale multi-active ne conserve plus un seul enregistreur pour les données.
references:
  - title: Using write forwarding in an Amazon Aurora global database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-write-forwarding.html
