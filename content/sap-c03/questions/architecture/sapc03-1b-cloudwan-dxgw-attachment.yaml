id: sapc03-1b-cloudwan-dxgw-attachment
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A global company uses AWS Cloud WAN with core network edges in us-east-1, eu-west-1 and ap-southeast-1, and with production and development segments. In each Region, a transit gateway exists only to connect the data centers: it is associated with a Direct Connect gateway and peered with the core network. Two data centers each have an AWS Direct Connect connection at a different Direct Connect location, with a transit virtual interface to that Direct Connect gateway. The network team wants to remove the three transit gateways and manage routing centrally in the core network policy. On-premises routes must reach the production segment in all three Regions, and failover between the two Direct Connect locations must stay dynamic.

    Which solution will meet these requirements?
  fr: |
    Une entreprise mondiale utilise AWS Cloud WAN avec des périphéries de réseau principal dans us-east-1, eu-west-1 et ap-southeast-1, et des segments de production et de développement. Dans chaque Région, une passerelle de transit n'existe que pour connecter les centres de données : elle est associée à une passerelle Direct Connect et appairée au réseau principal. Deux centres de données disposent chacun d'une connexion AWS Direct Connect sur un emplacement Direct Connect différent, avec une interface virtuelle de transit vers cette passerelle Direct Connect. L'équipe réseau veut supprimer les trois passerelles de transit et gérer le routage de manière centralisée dans la politique du réseau principal. Les routes sur site doivent atteindre le segment de production dans les trois Régions, et le basculement entre les deux emplacements Direct Connect doit rester dynamique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep one transit gateway in us-east-1 associated with the Direct Connect gateway, delete the two others, and route the traffic of the other Regions through the core network to that transit gateway."
        fr: "Conserver une passerelle de transit dans us-east-1 associée à la passerelle Direct Connect, supprimer les deux autres, et acheminer le trafic des autres Régions via le réseau principal vers cette passerelle de transit."
    - id: b
      text:
        en: "Create a Direct Connect gateway attachment to the core network in the production segment for the three edge locations, keep the transit virtual interfaces of both locations, and advertise the on-premises prefixes with BGP."
        fr: "Créer un attachement de passerelle Direct Connect au réseau principal dans le segment de production pour les trois emplacements de périphérie, conserver les interfaces virtuelles de transit des deux emplacements, et annoncer les préfixes sur site avec BGP."
    - id: c
      text:
        en: "Create a Direct Connect gateway attachment to the core network, and add static routes for the on-premises prefixes to the core network policy with the attachment as the next hop in the production segment."
        fr: "Créer un attachement de passerelle Direct Connect au réseau principal, et ajouter à la politique du réseau principal des routes statiques pour les préfixes sur site avec l'attachement comme tronçon suivant dans le segment de production."
    - id: d
      text:
        en: "Replace the Direct Connect connections with Site-to-Site VPN attachments from each data center to each core network edge, and associate the VPN attachments with the production segment."
        fr: "Remplacer les connexions Direct Connect par des attachements VPN Site-to-Site de chaque centre de données vers chaque périphérie du réseau principal, et associer les attachements VPN au segment de production."
answer: { optionId: b }
explanation:
  correct:
    en: "Cloud WAN can attach a Direct Connect gateway directly to a core network, without an intermediate transit gateway. Routes from all on-premises locations are advertised into the segment route tables of the associated edges and exchanged dynamically with BGP over the transit virtual interfaces, so the core network policy controls routing and BGP handles failover between the two locations."
    fr: "Cloud WAN peut attacher directement une passerelle Direct Connect à un réseau principal, sans passerelle de transit intermédiaire. Les routes de tous les sites sont annoncées dans les tables de routage de segment des périphéries associées et échangées dynamiquement avec BGP via les interfaces virtuelles de transit : la politique du réseau principal contrôle le routage et BGP gère le basculement entre les deux emplacements."
  options:
    a:
      en: "A transit gateway would remain, which the team wants to remove, and traffic of the other Regions would make an extra hop through us-east-1."
      fr: "Une passerelle de transit subsisterait, alors que l'équipe veut les supprimer, et le trafic des autres Régions ferait un détour par us-east-1."
    c:
      en: "Cloud WAN does not allow static routes that point to a Direct Connect gateway attachment; routes must be advertised dynamically from on premises."
      fr: "Cloud WAN n'autorise pas de routes statiques pointant vers un attachement de passerelle Direct Connect : les routes doivent être annoncées dynamiquement depuis le site."
    d:
      en: "Removing Direct Connect abandons the dedicated connections, and failover would no longer be between the two Direct Connect locations."
      fr: "Supprimer Direct Connect abandonne les connexions dédiées, et le basculement ne se ferait plus entre les deux emplacements Direct Connect."
references:
  - title: Direct Connect gateway attachments in AWS Cloud WAN
    url: https://docs.aws.amazon.com/network-manager/latest/cloudwan/cloudwan-dxattach-about.html
