id: sapc03-1a-ecr-scan-filters
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores its container images in an Amazon ECR private registry in a shared services account. Production images are in repositories whose names start with prod, and development images are in repositories whose names start with dev. The security team requires production images to be rescanned automatically whenever new vulnerabilities are published, including vulnerabilities in Java and Python packages. Development images need to be scanned only when they are pushed, to control scanning costs. New findings must trigger an alert to the security team. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke ses images de conteneur dans un registre privé Amazon ECR d'un compte de services partagés. Les images de production se trouvent dans des référentiels dont le nom commence par prod, et les images de développement dans des référentiels dont le nom commence par dev. L'équipe de sécurité exige que les images de production soient automatiquement réanalysées chaque fois que de nouvelles vulnérabilités sont publiées, y compris dans les paquets Java et Python. Les images de développement ne doivent être analysées qu'au moment de leur envoi (push), pour maîtriser les coûts d'analyse. Les nouveaux résultats doivent déclencher une alerte pour l'équipe de sécurité. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Turn on basic scanning with scan on push for all the repositories, and create an Amazon EventBridge rule that sends the scan results of every pushed image to an Amazon SNS topic for the security team.
        fr: |-
          Activer l'analyse de base avec l'analyse à l'envoi pour tous les référentiels, et créer une règle Amazon EventBridge qui envoie les résultats d'analyse de chaque image envoyée à une rubrique Amazon SNS pour l'équipe de sécurité.
    - id: b
      text:
        en: |-
          Turn on enhanced scanning with a continuous scanning filter for the prod repositories and a scan on push filter for the dev repositories, and route the Amazon Inspector finding events to an Amazon SNS topic with an EventBridge rule.
        fr: |-
          Activer l'analyse améliorée avec un filtre d'analyse continue pour les référentiels prod et un filtre d'analyse à l'envoi pour les référentiels dev, et acheminer les événements de résultats Amazon Inspector vers une rubrique Amazon SNS avec une règle EventBridge.
    - id: c
      text:
        en: |-
          Turn on enhanced scanning with a scan on push filter for all the repositories, and schedule an AWS Lambda function that starts a manual scan of every production image each day and publishes the new findings.
        fr: |-
          Activer l'analyse améliorée avec un filtre d'analyse à l'envoi pour tous les référentiels, et planifier une fonction AWS Lambda qui démarre chaque jour une analyse manuelle de chaque image de production et publie les nouveaux résultats.
    - id: d
      text:
        en: |-
          Turn on enhanced scanning with a continuous scanning filter that matches all the repositories, and route the Amazon Inspector finding events to an Amazon SNS topic with an EventBridge rule.
        fr: |-
          Activer l'analyse améliorée avec un filtre d'analyse continue qui correspond à tous les référentiels, et acheminer les événements de résultats Amazon Inspector vers une rubrique Amazon SNS avec une règle EventBridge.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Enhanced scanning uses Amazon Inspector to scan operating system and programming language packages, and repository filters choose which repositories use continuous scanning and which use scan on push. Continuous scanning updates the findings of production images as new vulnerabilities appear, scan on push keeps development costs lower, and Inspector emits finding events to EventBridge for alerting.
    fr: |-
      L'analyse améliorée utilise Amazon Inspector pour analyser les paquets du système d'exploitation et des langages de programmation, et des filtres de référentiel déterminent quels référentiels utilisent l'analyse continue et lesquels utilisent l'analyse à l'envoi. L'analyse continue met à jour les résultats des images de production à mesure que de nouvelles vulnérabilités apparaissent, l'analyse à l'envoi réduit les coûts de développement, et Inspector émet des événements de résultats vers EventBridge pour les alertes.
  options:
    a:
      en: |-
        Basic scanning finds operating system vulnerabilities only and does not rescan images continuously, so it misses Java and Python packages and new vulnerabilities.
      fr: |-
        L'analyse de base ne détecte que les vulnérabilités du système d'exploitation et ne réanalyse pas les images en continu : elle manque les paquets Java et Python et les nouvelles vulnérabilités.
    c:
      en: |-
        Manual scans are not supported with enhanced scanning, and a scheduled function would be custom code even if they were.
      fr: |-
        Les analyses manuelles ne sont pas prises en charge avec l'analyse améliorée, et une fonction planifiée serait du code personnalisé même si elles l'étaient.
    d:
      en: |-
        Continuous scanning of the development repositories meets the security needs but increases the Amazon Inspector costs that the company wants to control.
      fr: |-
        L'analyse continue des référentiels de développement répond aux besoins de sécurité mais augmente les coûts Amazon Inspector que l'entreprise veut maîtriser.
references:
