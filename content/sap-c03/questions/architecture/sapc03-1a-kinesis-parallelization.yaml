id: sapc03-1a-kinesis-parallelization
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company processes order events from an Amazon Kinesis Data Streams stream that has four shards in provisioned capacity mode. An AWS Lambda function consumes the stream through an event source mapping and performs a CPU-intensive enrichment of each record. During daily peaks, the IteratorAge metric of the function grows to several minutes, while the producers report no write throttling. Records that share a partition key must still be processed in order. The company wants to increase the processing throughput without resharding the stream.

    Which solution will meet these requirements?
  fr: |
    Une entreprise traite les événements de commande d'un flux Amazon Kinesis Data Streams de quatre partitions en mode de capacité provisionnée. Une fonction AWS Lambda consomme le flux au moyen d'un mappage des sources d'événements et effectue un enrichissement de chaque enregistrement qui sollicite fortement le processeur. Pendant les pointes quotidiennes, la métrique IteratorAge de la fonction atteint plusieurs minutes, alors que les producteurs ne signalent aucune limitation des écritures. Les enregistrements qui partagent une clé de partition doivent toujours être traités dans l'ordre. L'entreprise veut augmenter le débit de traitement sans repartitionner le flux.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Increase the maximum batching window of the event source mapping to 5 minutes so that each invocation receives more records.
        fr: |-
          Porter la fenêtre de traitement par lots maximale du mappage des sources d'événements à 5 minutes pour que chaque appel reçoive davantage d'enregistrements.
    - id: b
      text:
        en: |-
          Register an enhanced fan-out consumer for the function so that it reads the stream through a dedicated connection to each shard.
        fr: |-
          Enregistrer un consommateur à diffusion améliorée (enhanced fan-out) pour la fonction afin qu'elle lise le flux par une connexion dédiée à chaque partition.
    - id: c
      text:
        en: |-
          Ask the producers to use a random partition key so that the records are spread evenly across the four shards of the stream.
        fr: |-
          Demander aux producteurs d'utiliser une clé de partition aléatoire pour que les enregistrements soient répartis uniformément sur les quatre partitions du flux.
    - id: d
      text:
        en: |-
          Increase the parallelization factor of the event source mapping so that Lambda processes several batches from each shard at the same time.
        fr: |-
          Augmenter le facteur de parallélisation du mappage des sources d'événements pour que Lambda traite plusieurs lots de chaque partition en même temps.
answer: { optionId: d }
explanation:
  correct:
    en: |-
      The parallelization factor (1 to 10) lets Lambda process up to that many batches from one shard concurrently, which raises throughput when the processing is slow and the IteratorAge is high. Lambda still guarantees in-order processing at the partition-key level, and the shard count does not change.
    fr: |-
      Le facteur de parallélisation (de 1 à 10) permet à Lambda de traiter simultanément jusqu'à ce nombre de lots d'une même partition, ce qui augmente le débit quand le traitement est lent et que l'IteratorAge est élevé. Lambda garantit toujours le traitement dans l'ordre au niveau de la clé de partition, et le nombre de partitions ne change pas.
  options:
    a:
      en: |-
        A longer batching window makes the function wait to gather records, which adds latency; the bottleneck is the processing time, not the number of invocations.
      fr: |-
        Une fenêtre de traitement par lots plus longue fait attendre la fonction pour rassembler des enregistrements, ce qui ajoute de la latence ; le goulot d'étranglement est le temps de traitement, pas le nombre d'appels.
    b:
      en: |-
        Enhanced fan-out gives dedicated read throughput, but reading is not the bottleneck; the CPU-intensive processing of each batch is.
      fr: |-
        La diffusion améliorée fournit un débit de lecture dédié, mais la lecture n'est pas le goulot d'étranglement : c'est le traitement de chaque lot, qui sollicite fortement le processeur.
    c:
      en: |-
        Random keys break the per-key ordering requirement and do not add processing capacity, because the stream still has four shards with one concurrent batch each.
      fr: |-
        Des clés aléatoires enfreignent l'exigence d'ordre par clé et n'ajoutent aucune capacité de traitement, car le flux a toujours quatre partitions avec un seul lot simultané chacune.
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
