id: sapc03-1d-ddb-mrsc-rpo-zero
objective: "1.5.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A fintech company is launching a wallet service that stores customer balances in Amazon DynamoDB. The service will run active-active in us-east-1, us-east-2 and us-west-2. A read in any of these Regions must return the latest balance, and conditional writes must always be evaluated against the latest version of an item to prevent overdrafts. If one Region becomes unavailable, no acknowledged write can be lost. The service does not use transactions, Time to Live or local secondary indexes, and the table in us-east-1 does not contain data yet. The company accepts higher write latency to meet these requirements.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de technologie financière lance un service de portefeuille qui stocke les soldes des clients dans Amazon DynamoDB. Le service fonctionnera en mode actif-actif dans us-east-1, us-east-2 et us-west-2. Une lecture dans l'une de ces Régions doit renvoyer le dernier solde, et les écritures conditionnelles doivent toujours être évaluées par rapport à la dernière version d'un élément pour empêcher les découverts. Si une Région devient indisponible, aucune écriture confirmée ne doit être perdue. Le service n'utilise ni transactions, ni durée de vie (TTL), ni index secondaires locaux, et la table de us-east-1 ne contient encore aucune donnée. L'entreprise accepte une latence d'écriture plus élevée pour répondre à ces exigences.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a global table with multi-Region eventual consistency and replicas in the three Regions, and use strongly consistent reads in each Region."
        fr: "Créer une table globale avec la cohérence éventuelle multi-Région et des réplicas dans les trois Régions, et utiliser des lectures fortement cohérentes dans chaque Région."
    - id: b
      text:
        en: "Create the table in us-east-1 with point-in-time recovery, and use AWS Backup to copy the backups to us-east-2 and us-west-2 every hour."
        fr: "Créer la table dans us-east-1 avec la restauration à un instant dans le passé, et utiliser AWS Backup pour copier les sauvegardes vers us-east-2 et us-west-2 toutes les heures."
    - id: c
      text:
        en: "Store the balances in an Amazon Aurora global database with the primary cluster in us-east-1 and secondary clusters in the two other Regions."
        fr: "Stocker les soldes dans une base de données globale Amazon Aurora avec le cluster principal dans us-east-1 et des clusters secondaires dans les deux autres Régions."
    - id: d
      text:
        en: "Create a global table with multi-Region strong consistency by adding replicas in us-east-2 and us-west-2 to the empty table in us-east-1."
        fr: "Créer une table globale avec la cohérence forte multi-Région en ajoutant des réplicas dans us-east-2 et us-west-2 à la table vide de us-east-1."
answer: { optionId: d }
explanation:
  correct:
    en: |
      A multi-Region strong consistency (MRSC) global table is deployed in exactly three Regions and synchronously replicates each write to at least one other Region before it returns success, which gives an RPO of zero. Strongly consistent reads on any replica return the latest version, and conditional writes are evaluated against it. MRSC is created from an empty table and does not support transactions, TTL or local secondary indexes, which the service does not use.
    fr: |
      Une table globale à cohérence forte multi-Région (MRSC) est déployée dans exactement trois Régions et réplique de manière synchrone chaque écriture vers au moins une autre Région avant de renvoyer un succès, ce qui donne un RPO nul. Les lectures fortement cohérentes sur n'importe quel réplica renvoient la dernière version, et les écritures conditionnelles sont évaluées par rapport à elle. MRSC se crée à partir d'une table vide et ne prend en charge ni les transactions, ni la TTL, ni les index secondaires locaux, que le service n'utilise pas.
  options:
    a:
      en: |
        Multi-Region eventual consistency replicates asynchronously, so a strongly consistent read reflects only the local Region and recent writes can be lost when a Region fails.
      fr: |
        La cohérence éventuelle multi-Région réplique de manière asynchrone : une lecture fortement cohérente ne reflète que la Région locale, et des écritures récentes peuvent être perdues en cas de panne d'une Région.
    b:
      en: |
        Hourly backup copies allow up to an hour of data loss and do not provide active-active access in the other Regions.
      fr: |
        Des copies de sauvegarde horaires permettent jusqu'à une heure de perte de données et n'offrent pas d'accès actif-actif dans les autres Régions.
    c:
      en: |
        Aurora global database replicates asynchronously from a single primary Region, so secondary Regions can read stale balances and cannot evaluate writes locally against the latest data.
      fr: |
        Aurora Global Database réplique de manière asynchrone depuis une seule Région principale : les Régions secondaires peuvent lire des soldes obsolètes et ne peuvent pas évaluer localement les écritures par rapport aux dernières données.
references:
  - title: How DynamoDB global tables work
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/multi-region-strong-consistency-gt.html
