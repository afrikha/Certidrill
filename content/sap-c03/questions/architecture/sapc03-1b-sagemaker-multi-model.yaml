id: sapc03-1b-sagemaker-multi-model
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company trains one XGBoost model per customer to predict churn, and it now has 4,000 models of similar size stored as artifacts in Amazon S3. Every model uses the same serving container, and applications call the models synchronously and wait for each prediction. A few hundred models are invoked many times each hour, but most models are invoked only a few times each day, and callers accept an occasional extra latency when a rarely used model is loaded. The company adds new customer models every week and wants to deploy them without updating endpoints. It wants the lowest hosting cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS entraîne un modèle XGBoost par client pour prédire l'attrition, et elle dispose maintenant de 4 000 modèles de taille similaire stockés comme artefacts dans Amazon S3. Tous les modèles utilisent le même conteneur de service, et les applications appellent les modèles de manière synchrone en attendant chaque prédiction. Quelques centaines de modèles sont invoqués de nombreuses fois par heure, mais la plupart ne sont invoqués que quelques fois par jour, et les appelants acceptent une latence supplémentaire occasionnelle quand un modèle peu utilisé est chargé. L'entreprise ajoute chaque semaine de nouveaux modèles clients et veut les déployer sans mettre à jour les points de terminaison. Elle veut le coût d'hébergement le plus bas.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create one SageMaker AI real-time endpoint per customer model on the smallest instance type that fits the model, with auto scaling for the frequently invoked models."
        fr: "Créer un point de terminaison en temps réel SageMaker AI par modèle client sur le plus petit type d'instance qui convient au modèle, avec une mise à l'échelle automatique pour les modèles fréquemment invoqués."
    - id: b
      text:
        en: "Create one SageMaker AI serverless endpoint per customer model, and configure provisioned concurrency for the models that are invoked many times each hour."
        fr: "Créer un point de terminaison serverless SageMaker AI par modèle client, et configurer une simultanéité provisionnée pour les modèles invoqués de nombreuses fois par heure."
    - id: c
      text:
        en: "Create one SageMaker AI asynchronous endpoint per customer model with auto scaling to zero instances, and have callers poll Amazon S3 for each prediction."
        fr: "Créer un point de terminaison asynchrone SageMaker AI par modèle client avec une mise à l'échelle automatique jusqu'à zéro instance, et faire interroger Amazon S3 par les appelants pour chaque prédiction."
    - id: d
      text:
        en: "Create a SageMaker AI multi-model endpoint with the shared container and the S3 prefix of the artifacts, and pass the target model name in each InvokeEndpoint request."
        fr: "Créer un point de terminaison multimodèle SageMaker AI avec le conteneur partagé et le préfixe S3 des artefacts, et transmettre le nom du modèle cible dans chaque requête InvokeEndpoint."
answer: { optionId: d }
explanation:
  correct:
    en: "Multi-model endpoints host many models that use the same framework on a shared serving container. SageMaker AI loads models from S3 when they are invoked, caches them and unloads unused ones, which suits a mix of frequently and rarely used models that tolerate occasional cold starts. Adding or removing models in the S3 prefix does not require updating the endpoint."
    fr: "Les points de terminaison multimodèles hébergent de nombreux modèles utilisant le même framework sur un conteneur de service partagé. SageMaker AI charge les modèles depuis S3 lors de leur invocation, les met en cache et décharge ceux qui ne servent pas, ce qui convient à un mélange de modèles fréquents et rares qui tolèrent des démarrages à froid occasionnels. Ajouter ou retirer des modèles dans le préfixe S3 ne demande pas de mettre à jour le point de terminaison."
  options:
    a:
      en: "4,000 endpoints keep 4,000 instances running even for models invoked a few times a day, which is far more expensive, and each new model needs a new endpoint."
      fr: "4 000 points de terminaison gardent 4 000 instances actives même pour des modèles invoqués quelques fois par jour, ce qui coûte bien plus cher, et chaque nouveau modèle exige un nouveau point de terminaison."
    b:
      en: "A Region supports at most 50 serverless endpoints, far fewer than 4,000 models, and serverless inference does not support multi-model endpoints."
      fr: "Une Région accepte au plus 50 points de terminaison serverless, bien moins que 4 000 modèles, et l'inférence serverless ne prend pas en charge les points de terminaison multimodèles."
    c:
      en: "Thousands of asynchronous endpoints are hard to operate, scaling from zero takes minutes, and callers would lose the synchronous response they use today."
      fr: "Des milliers de points de terminaison asynchrones sont difficiles à exploiter, la remontée depuis zéro prend des minutes, et les appelants perdraient la réponse synchrone qu'ils utilisent aujourd'hui."
references:
  - title: Multi-model endpoints
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/multi-model-endpoints.html
  - title: Deploy models with Amazon SageMaker Serverless Inference
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/serverless-endpoints.html
