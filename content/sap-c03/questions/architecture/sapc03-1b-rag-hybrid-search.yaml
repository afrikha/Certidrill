id: sapc03-1b-rag-hybrid-search
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An industrial equipment maker runs a support assistant on Amazon Bedrock Knowledge Bases, with 40,000 maintenance manuals from Amazon S3 indexed in an Amazon S3 vector bucket. Technicians often ask about exact part numbers and error codes, such as XJ-4471-B or E-209, and semantic search frequently returns manuals for similar but wrong parts. Technicians must also be able to restrict results to one product line, which is stored as document metadata. The company wants retrieval that matches exact terms and meaning in the same query, with a fully managed vector store and the least operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un fabricant d'équipements industriels exécute un assistant de support sur Amazon Bedrock Knowledge Bases, avec 40 000 manuels de maintenance d'Amazon S3 indexés dans un compartiment de vecteurs Amazon S3. Les techniciens posent souvent des questions sur des références de pièces et des codes d'erreur exacts, comme XJ-4471-B ou E-209, et la recherche sémantique renvoie fréquemment des manuels de pièces proches mais erronées. Les techniciens doivent aussi pouvoir limiter les résultats à une gamme de produits, stockée comme métadonnée des documents. L'entreprise veut une récupération qui associe termes exacts et sens dans une même requête, avec un magasin vectoriel entièrement géré et le moins de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a knowledge base with an Amazon OpenSearch Serverless vector index that contains a filterable text field, ingest the manuals with their metadata, and query with the HYBRID search type and a product line filter."
        fr: "Créer une base de connaissances avec un index vectoriel Amazon OpenSearch Serverless qui contient un champ de texte filtrable, ingérer les manuels avec leurs métadonnées, et interroger avec le type de recherche HYBRID et un filtre de gamme de produits."
    - id: b
      text:
        en: "Keep the S3 vector bucket, set the search type of the queries to HYBRID, and add a metadata filter on the product line so that exact terms and meaning are both matched."
        fr: "Conserver le compartiment de vecteurs S3, définir le type de recherche des requêtes sur HYBRID, et ajouter un filtre de métadonnées sur la gamme de produits afin que les termes exacts et le sens soient tous deux pris en compte."
    - id: c
      text:
        en: "Keep the S3 vector bucket, add a reranker model to the retrieval configuration, and increase the number of results so that the reranker can move the manuals with the exact part number to the top."
        fr: "Conserver le compartiment de vecteurs S3, ajouter un modèle de reclassement à la configuration de récupération, et augmenter le nombre de résultats afin que le modèle de reclassement remonte en tête les manuels contenant la référence exacte."
    - id: d
      text:
        en: "Create a knowledge base with an Amazon Neptune Analytics graph for GraphRAG, so that part numbers and error codes become graph entities that are matched exactly during retrieval."
        fr: "Créer une base de connaissances avec un graphe Amazon Neptune Analytics pour GraphRAG, afin que les références de pièces et les codes d'erreur deviennent des entités du graphe mises en correspondance exacte lors de la récupération."
answer: { optionId: a }
explanation:
  correct:
    en: "Hybrid search combines vector search with raw-text search, which matches exact identifiers such as part numbers as well as meaning. It is supported only for Amazon RDS (Aurora PostgreSQL), OpenSearch Serverless and MongoDB vector stores that contain a filterable text field; OpenSearch Serverless is fully managed and also supports metadata filters."
    fr: "La recherche hybride combine la recherche vectorielle et la recherche en texte brut, ce qui fait correspondre des identifiants exacts comme les références de pièces ainsi que le sens. Elle n'est prise en charge que pour les magasins vectoriels Amazon RDS (Aurora PostgreSQL), OpenSearch Serverless et MongoDB qui contiennent un champ de texte filtrable ; OpenSearch Serverless est entièrement géré et prend aussi en charge les filtres de métadonnées."
  options:
    b:
      en: "S3 vector buckets do not support hybrid search, so the query silently uses semantic search and exact part numbers are still missed."
      fr: "Les compartiments de vecteurs S3 ne prennent pas en charge la recherche hybride : la requête utilise alors la recherche sémantique, et les références exactes sont toujours manquées."
    c:
      en: "A reranker only reorders the chunks that semantic search returned; it cannot bring back manuals that the vector search did not retrieve."
      fr: "Un modèle de reclassement ne fait que réordonner les fragments renvoyés par la recherche sémantique : il ne peut pas ramener des manuels que la recherche vectorielle n'a pas récupérés."
    d:
      en: "GraphRAG adds relationships between entities and document structure to vector search; it is not a keyword search for exact identifiers."
      fr: "GraphRAG ajoute à la recherche vectorielle les relations entre entités et la structure des documents : ce n'est pas une recherche par mots-clés d'identifiants exacts."
references:
