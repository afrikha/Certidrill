id: sapc03-1c-gwlb-ingress-routing
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a public web application behind an internet-facing Application Load Balancer in the public subnets of a VPC. A regulator requires that all inbound internet traffic be inspected by the company's certified third-party intrusion prevention appliances before it reaches the load balancer, and the inspection must be able to block traffic inline. The appliances must run as a fleet that scales horizontally and survives the failure of an instance. The security team will not accept a different firewall product.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web publique derrière un Application Load Balancer exposé à Internet, dans les sous-réseaux publics d'un VPC. Un régulateur exige que tout le trafic Internet entrant soit inspecté par les appliances tierces de prévention des intrusions certifiées de l'entreprise avant d'atteindre l'équilibreur de charge, et l'inspection doit pouvoir bloquer le trafic en ligne. Les appliances doivent fonctionner en flotte qui évolue horizontalement et survit à la défaillance d'une instance. L'équipe de sécurité n'acceptera pas d'autre produit de pare-feu.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy AWS Network Firewall in the VPC with firewall endpoints in each Availability Zone, and route internet gateway ingress traffic for the load balancer subnets through the endpoints."
        fr: "Déployer AWS Network Firewall dans le VPC avec des points de terminaison de pare-feu dans chaque zone, et faire passer par ces points de terminaison le trafic entrant de la passerelle Internet destiné aux sous-réseaux de l'équilibreur."
    - id: b
      text:
        en: "Deploy the appliances behind a Gateway Load Balancer, add Gateway Load Balancer endpoints to the VPC, and route internet gateway ingress traffic for the load balancer subnets to the endpoints."
        fr: "Déployer les appliances derrière un Gateway Load Balancer, ajouter des points de terminaison Gateway Load Balancer au VPC, et router vers ces points de terminaison le trafic entrant de la passerelle Internet destiné aux sous-réseaux de l'équilibreur."
    - id: c
      text:
        en: "Configure VPC Traffic Mirroring sessions on the load balancer's network interfaces, and send the mirrored packets to the appliance fleet behind a Network Load Balancer."
        fr: "Configurer des sessions VPC Traffic Mirroring sur les interfaces réseau de l'équilibreur de charge, et envoyer les paquets mis en miroir à la flotte d'appliances derrière un Network Load Balancer."
    - id: d
      text:
        en: "Attach an AWS WAF web ACL with the AWS Managed Rules core rule set to the load balancer, and send the web ACL logs to the appliances for analysis."
        fr: "Attacher à l'équilibreur de charge une liste ACL web AWS WAF avec le jeu de règles de base des règles gérées AWS, et envoyer les journaux de la liste ACL web aux appliances pour analyse."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Gateway Load Balancer distributes traffic across a scalable fleet of third-party appliances and sends flows only to healthy appliances. A gateway route table associated with the internet gateway can send traffic for a subnet's CIDR block to a Gateway Load Balancer endpoint, and the load balancer subnets route their outbound traffic back through the endpoint, so the appliances inspect both directions inline.
    fr: |-
      Un Gateway Load Balancer répartit le trafic sur une flotte évolutive d'appliances tierces et n'envoie les flux qu'aux appliances saines. Une table de routage de passerelle associée à la passerelle Internet peut envoyer le trafic destiné au bloc CIDR d'un sous-réseau vers un point de terminaison Gateway Load Balancer, et les sous-réseaux de l'équilibreur renvoient leur trafic sortant par ce point de terminaison : les appliances inspectent les deux sens en ligne.
  options:
    a:
      en: |-
        Network Firewall is an AWS firewall, not the certified third-party product that the security team requires.
      fr: |-
        Network Firewall est un pare-feu AWS, pas le produit tiers certifié qu'exige l'équipe de sécurité.
    c:
      en: |-
        Traffic Mirroring sends copies of packets for out-of-band analysis, so the appliances cannot block traffic inline.
      fr: |-
        Traffic Mirroring envoie des copies de paquets pour une analyse hors bande : les appliances ne peuvent pas bloquer le trafic en ligne.
    d:
      en: |-
        AWS WAF applies its own rules to HTTP requests and is not the required intrusion prevention product, and logs are analyzed only after the fact.
      fr: |-
        AWS WAF applique ses propres règles aux requêtes HTTP et n'est pas le produit de prévention des intrusions exigé, et les journaux ne sont analysés qu'après coup.
references:
  - title: Gateway route tables - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/gateway-route-tables.html
