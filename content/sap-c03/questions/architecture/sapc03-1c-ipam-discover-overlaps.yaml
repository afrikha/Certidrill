id: sapc03-1c-ipam-discover-overlaps
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company with 120 accounts in AWS Organizations has never tracked VPC address usage centrally. Before it connects all VPCs to a transit gateway, the network team must find every VPC CIDR block in every account and Region, identify overlapping CIDR blocks and monitor IP address utilization from now on. The team wants a managed AWS solution that requires no custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise qui possède 120 comptes dans AWS Organizations n'a jamais suivi de façon centralisée l'utilisation des adresses de ses VPC. Avant de relier tous les VPC à une passerelle de transit (transit gateway), l'équipe réseau doit trouver chaque bloc CIDR de VPC dans chaque compte et chaque Région, identifier les blocs CIDR qui se chevauchent et surveiller désormais l'utilisation des adresses IP. L'équipe veut une solution AWS gérée qui n'exige aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use VPC Reachability Analyzer from the network account to analyze the paths between every pair of VPCs and report the paths that fail because of overlapping CIDR blocks."
        fr: "Utiliser VPC Reachability Analyzer depuis le compte réseau pour analyser les chemins entre chaque paire de VPC et signaler les chemins qui échouent à cause de blocs CIDR qui se chevauchent."
    - id: b
      text:
        en: "Use Network Access Analyzer with a scope that covers all VPCs in the organization, and review its findings for overlapping CIDR blocks."
        fr: "Utiliser Network Access Analyzer avec une étendue qui couvre tous les VPC de l'organisation, et examiner ses résultats pour trouver les blocs CIDR qui se chevauchent."
    - id: c
      text:
        en: "Delegate a member account as the Amazon VPC IPAM account for the organization, and use IPAM resource monitoring to review CIDR overlap and utilization."
        fr: "Déléguer un compte membre comme compte Amazon VPC IPAM de l'organisation, et utiliser la surveillance des ressources d'IPAM pour examiner les chevauchements de CIDR et l'utilisation."
    - id: d
      text:
        en: "Create an AWS Config aggregator for the organization, and write advanced queries and an AWS Lambda function that compares all VPC CIDR blocks every day."
        fr: "Créer un agrégateur AWS Config pour l'organisation, et écrire des requêtes avancées et une fonction AWS Lambda qui compare chaque jour tous les blocs CIDR des VPC."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When IPAM is integrated with AWS Organizations through a delegated member account, it monitors IP usage across all member accounts and automatically imports the CIDR blocks of existing VPCs. Its resource monitoring shows overlapping CIDR blocks and utilization without custom code.
    fr: |-
      Lorsqu'IPAM est intégré à AWS Organizations par un compte membre délégué, il surveille l'utilisation des adresses IP dans tous les comptes membres et importe automatiquement les blocs CIDR des VPC existants. Sa surveillance des ressources montre les chevauchements de blocs CIDR et l'utilisation, sans code personnalisé.
  options:
    a:
      en: |-
        Reachability Analyzer tests the path between two specific resources; it does not inventory CIDR blocks or report utilization.
      fr: |-
        Reachability Analyzer teste le chemin entre deux ressources précises ; il n'inventorie pas les blocs CIDR et ne rend pas compte de l'utilisation.
    b:
      en: |-
        Network Access Analyzer finds unintended network access paths; it is not an IP address inventory.
      fr: |-
        Network Access Analyzer détecte des chemins d'accès réseau non souhaités ; ce n'est pas un inventaire d'adresses IP.
    d:
      en: |-
        Config can list VPC CIDR blocks, but comparing them needs the custom code that the team wants to avoid.
      fr: |-
        Config peut lister les blocs CIDR des VPC, mais les comparer exige le code personnalisé que l'équipe veut éviter.
references:
  - title: Integrate IPAM with accounts in an AWS Organization - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/enable-integ-ipam.html
  - title: Monitor CIDR usage by resource - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/monitor-cidr-compliance-ipam.html
