id: sapc03-1a-eks-auto-mode-daemonsets
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating its Kubernetes workloads from an on-premises cluster to Amazon EKS. The manifests include DaemonSets that run logging and security agents on every node, and several inference deployments require NVIDIA GPUs. The platform team is small and wants AWS to provision and scale the nodes, patch their operating system, and replace them regularly. The application teams want to keep their Kubernetes manifests unchanged. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre ses charges de travail Kubernetes d'un cluster sur site vers Amazon EKS. Les manifestes comprennent des DaemonSets qui exécutent des agents de journalisation et de sécurité sur chaque nœud, et plusieurs déploiements d'inférence exigent des GPU NVIDIA. L'équipe plateforme est réduite et veut qu'AWS provisionne et mette à l'échelle les nœuds, corrige leur système d'exploitation et les remplace régulièrement. Les équipes applicatives veulent conserver leurs manifestes Kubernetes sans modification. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an EKS cluster with Fargate profiles that cover all the namespaces, so that every pod runs on Fargate capacity that AWS manages and patches.
        fr: |-
          Créer un cluster EKS avec des profils Fargate qui couvrent tous les espaces de noms, pour que chaque pod s'exécute sur une capacité Fargate gérée et corrigée par AWS.
    - id: b
      text:
        en: |-
          Create an EKS cluster with EKS Auto Mode enabled, and add a node pool for GPU instance types in addition to the default node pools that Auto Mode manages.
        fr: |-
          Créer un cluster EKS avec EKS Auto Mode activé, et ajouter un pool de nœuds (node pool) pour les types d'instance GPU en plus des pools de nœuds par défaut gérés par Auto Mode.
    - id: c
      text:
        en: |-
          Create an EKS cluster with managed node groups for CPU and GPU instances, install the Cluster Autoscaler, and build a pipeline that creates patched custom AMIs every month.
        fr: |-
          Créer un cluster EKS avec des groupes de nœuds gérés pour les instances CPU et GPU, installer Cluster Autoscaler et construire un pipeline qui crée chaque mois des AMI personnalisées corrigées.
    - id: d
      text:
        en: |-
          Convert the manifests to Amazon ECS task definitions, and run the services on AWS Fargate with the agents as sidecar containers in each task.
        fr: |-
          Convertir les manifestes en définitions de tâche Amazon ECS, et exécuter les services sur AWS Fargate avec les agents sous forme de conteneurs annexes (sidecar) dans chaque tâche.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      EKS Auto Mode launches nodes for unschedulable pods and removes them when they are not needed, uses hardened Bottlerocket-based AMIs, and replaces nodes after a maximum lifetime of 21 days while respecting disruption budgets. It supports DaemonSets and includes the GPU drivers and plugins, and an additional node pool selects the GPU instance types, so the manifests do not change.
    fr: |-
      EKS Auto Mode lance des nœuds pour les pods non planifiables et les supprime quand ils ne sont plus nécessaires, utilise des AMI renforcées basées sur Bottlerocket et remplace les nœuds après une durée de vie maximale de 21 jours en respectant les budgets d'interruption. Il prend en charge les DaemonSets et inclut les pilotes et plug-ins GPU, et un pool de nœuds supplémentaire sélectionne les types d'instance GPU : les manifestes ne changent pas.
  options:
    a:
      en: |-
        Fargate on EKS supports neither DaemonSets nor GPUs, so the agents and the inference pods could not run without changes.
      fr: |-
        Fargate sur EKS ne prend en charge ni les DaemonSets ni les GPU : les agents et les pods d'inférence ne pourraient pas s'exécuter sans modification.
    c:
      en: |-
        Managed node groups with a custom AMI pipeline and a self-installed autoscaler leave patching, scaling configuration, and node replacement to the platform team.
      fr: |-
        Des groupes de nœuds gérés avec un pipeline d'AMI personnalisées et un autoscaler installé par l'équipe laissent la correction, la configuration de la mise à l'échelle et le remplacement des nœuds à l'équipe plateforme.
    d:
      en: |-
        Moving to ECS means rewriting the Kubernetes manifests, and Fargate does not provide GPUs for the inference workloads.
      fr: |-
        Passer à ECS implique de réécrire les manifestes Kubernetes, et Fargate ne fournit pas de GPU pour les charges de travail d'inférence.
references:
  - title: Automate cluster infrastructure with EKS Auto Mode - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/automode.html
  - title: Simplify compute management with AWS Fargate - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
