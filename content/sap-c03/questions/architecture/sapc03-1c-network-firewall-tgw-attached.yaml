id: sapc03-1c-network-firewall-tgw-attached
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building a new hub-and-spoke network with a transit gateway that will connect 80 VPCs in eu-west-1 and the on-premises network. All traffic between VPCs, and from VPCs to a central egress VPC that provides internet access, must be inspected by a managed stateful firewall that can filter outbound HTTPS by domain name. The network team is small. It does not want to build and maintain a dedicated inspection VPC with firewall subnets, route tables and attachment settings in every Availability Zone.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise construit un nouveau réseau en étoile avec une passerelle de transit (transit gateway) qui reliera 80 VPC de eu-west-1 et le réseau sur site. Tout le trafic entre VPC, et des VPC vers un VPC de sortie central qui fournit l'accès Internet, doit être inspecté par un pare-feu géré avec état capable de filtrer le HTTPS sortant par nom de domaine. L'équipe réseau est réduite. Elle ne veut ni créer ni maintenir de VPC d'inspection dédié avec des sous-réseaux de pare-feu, des tables de routage et des paramètres d'attachement dans chaque zone de disponibilité.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an inspection VPC with AWS Network Firewall endpoints in firewall subnets in each Availability Zone, attach it to the transit gateway with appliance mode, and route traffic through it."
        fr: "Créer un VPC d'inspection avec des points de terminaison AWS Network Firewall dans des sous-réseaux de pare-feu de chaque zone, l'attacher à la passerelle de transit avec le mode appliance, et y faire passer le trafic."
    - id: b
      text:
        en: "Deploy third-party firewall appliances behind a Gateway Load Balancer in an inspection VPC, and route traffic from the transit gateway through Gateway Load Balancer endpoints."
        fr: "Déployer des appliances de pare-feu tierces derrière un Gateway Load Balancer dans un VPC d'inspection, et faire passer le trafic de la passerelle de transit par des points de terminaison Gateway Load Balancer."
    - id: c
      text:
        en: "Create an AWS Network Firewall firewall that attaches directly to the transit gateway, and route VPC-to-VPC and egress traffic through the firewall attachment in the transit gateway route tables."
        fr: "Créer un pare-feu AWS Network Firewall attaché directement à la passerelle de transit, et faire passer le trafic entre VPC et le trafic de sortie par l'attachement du pare-feu dans les tables de routage de la passerelle."
    - id: d
      text:
        en: "Apply security groups and network ACLs in each VPC that allow only approved traffic, and enable VPC Flow Logs to audit the outbound HTTPS connections."
        fr: "Appliquer dans chaque VPC des groupes de sécurité et des listes ACL réseau qui n'autorisent que le trafic approuvé, et activer VPC Flow Logs pour auditer les connexions HTTPS sortantes."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Network Firewall can attach directly to a transit gateway as a transit gateway attachment, which removes the networking setup of the standard deployment, and the attachment is created with appliance mode enabled. Stateful rule groups filter HTTPS by domain name, and the transit gateway route tables steer VPC-to-VPC and egress traffic through the firewall attachment.
    fr: |-
      Network Firewall peut s'attacher directement à une passerelle de transit en tant qu'attachement de passerelle de transit, ce qui supprime la configuration réseau du déploiement standard, et l'attachement est créé avec le mode appliance activé. Des groupes de règles avec état filtrent le HTTPS par nom de domaine, et les tables de routage de la passerelle font passer le trafic entre VPC et le trafic de sortie par l'attachement du pare-feu.
  options:
    a:
      en: |-
        This works, but the team must build and maintain the inspection VPC, its subnets, route tables and appliance mode setting, which it wants to avoid.
      fr: |-
        Cela fonctionne, mais l'équipe doit créer et maintenir le VPC d'inspection, ses sous-réseaux, ses tables de routage et le mode appliance, ce qu'elle veut éviter.
    b:
      en: |-
        Third-party appliances behind a Gateway Load Balancer are not a managed firewall, and they add an inspection VPC and appliances to operate.
      fr: |-
        Des appliances tierces derrière un Gateway Load Balancer ne sont pas un pare-feu géré, et elles ajoutent un VPC d'inspection et des appliances à exploiter.
    d:
      en: |-
        Security groups and network ACLs filter by address and port; they cannot filter HTTPS by domain name, and flow logs only record traffic.
      fr: |-
        Les groupes de sécurité et les listes ACL réseau filtrent par adresse et par port ; ils ne peuvent pas filtrer le HTTPS par nom de domaine, et les journaux de flux ne font qu'enregistrer le trafic.
references:
