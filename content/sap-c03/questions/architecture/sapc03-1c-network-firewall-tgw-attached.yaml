    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/tgw-firewall.html
  - title: How AWS Transit Gateway works - Amazon VPC
    url: https://docs.aws.amazon.com/vpc/latest/tgw/transit-gateway-appliance-scenario.html
