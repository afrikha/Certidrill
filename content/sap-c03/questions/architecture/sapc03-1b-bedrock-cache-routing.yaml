id: sapc03-1b-bedrock-cache-routing
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs an interactive shopping assistant on Amazon Bedrock with on-demand inference of Amazon Nova Pro. Every request starts with the same 6,000-token system prompt that describes the store policies, followed by a short user question. Analysis shows that about 60% of the questions are simple and that Amazon Nova Lite answers them with the same quality. Answers must stay interactive, and the company is evaluating five changes to reduce its inference cost.

    Which two changes will each reduce the inference cost while keeping the answers interactive? (Choose two.)
  fr: |
    Une entreprise de distribution exécute un assistant d'achat interactif sur Amazon Bedrock avec l'inférence à la demande d'Amazon Nova Pro. Chaque requête commence par la même invite système de 6 000 jetons qui décrit les politiques du magasin, suivie d'une courte question de l'utilisateur. L'analyse montre qu'environ 60 % des questions sont simples et qu'Amazon Nova Lite y répond avec la même qualité. Les réponses doivent rester interactives, et l'entreprise évalue cinq modifications pour réduire le coût de son inférence.

    Quelles sont les deux modifications qui réduiront chacune le coût de l'inférence tout en gardant des réponses interactives ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add a cache checkpoint after the system prompt in the Converse requests so that the repeated prefix is read from the prompt cache."
        fr: "Ajouter un point de contrôle de cache après l'invite système dans les requêtes Converse afin que le préfixe répété soit lu depuis le cache d'invites."
    - id: b
      text:
        en: "Send the questions through Bedrock batch inference jobs that run every minute, and return each answer to the user when its job completes."
        fr: "Envoyer les questions via des tâches d'inférence par lots Bedrock exécutées chaque minute, et renvoyer chaque réponse à l'utilisateur quand sa tâche se termine."
    - id: c
      text:
        en: "Invoke a prompt router that covers Nova Lite and Nova Pro instead of the Nova Pro model ID, so that each request goes to the model with the best predicted quality and cost."
        fr: "Invoquer un routeur d'invites qui couvre Nova Lite et Nova Pro au lieu de l'ID du modèle Nova Pro, afin que chaque requête aille vers le modèle offrant la meilleure qualité et le meilleur coût prévus."
    - id: d
      text:
        en: "Store the system prompt in an Amazon Bedrock knowledge base, and retrieve it with RetrieveAndGenerate for each question instead of sending it in the request."
        fr: "Stocker l'invite système dans une base de connaissances Amazon Bedrock, et la récupérer avec RetrieveAndGenerate pour chaque question au lieu de l'envoyer dans la requête."
    - id: e
      text:
        en: "Purchase Provisioned Throughput for Nova Pro sized for the peak traffic, and send all requests to the provisioned model."
        fr: "Acheter du débit provisionné pour Nova Pro dimensionné pour le trafic de pointe, et envoyer toutes les requêtes vers le modèle provisionné."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Prompt caching helps workloads with long, repeated contexts: a cache checkpoint after the system prompt lets later requests read that prefix from the cache, which lowers input cost and latency, and Nova models accept checkpoints in system and messages. Intelligent prompt routing exposes one endpoint that routes each request between models of the same family, such as Nova Lite and Nova Pro, according to predicted quality and cost."
    fr: "La mise en cache des invites aide les charges de travail aux contextes longs et répétés : un point de contrôle de cache après l'invite système permet aux requêtes suivantes de lire ce préfixe depuis le cache, ce qui réduit le coût d'entrée et la latence, et les modèles Nova acceptent des points de contrôle dans system et messages. Le routage intelligent des invites expose un point de terminaison unique qui achemine chaque requête entre des modèles d'une même famille, comme Nova Lite et Nova Pro, selon la qualité et le coût prévus."
  options:
    b:
      en: "Batch inference is asynchronous and suited to large offline datasets, so answers would no longer be interactive; prompt caching is also not supported with batch inference."
      fr: "L'inférence par lots est asynchrone et adaptée à de grands jeux de données hors ligne : les réponses ne seraient plus interactives, et la mise en cache des invites n'est pas prise en charge avec l'inférence par lots."
    d:
      en: "Retrieved chunks are still sent to the model as input tokens on every request, so this adds a retrieval step without removing the repeated prompt cost."
      fr: "Les fragments récupérés sont toujours envoyés au modèle comme jetons d'entrée à chaque requête : cette solution ajoute une étape de récupération sans supprimer le coût de l'invite répétée."
    e:
      en: "Provisioned Throughput is paid per hour whatever the traffic, so sizing it for the peak raises cost, and it does not use the cheaper model for simple questions."
      fr: "Le débit provisionné est payé à l'heure quel que soit le trafic : le dimensionner pour la pointe augmente le coût, et il n'utilise pas le modèle moins cher pour les questions simples."
references:
  - title: Prompt caching for faster model inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html
  - title: Understanding intelligent prompt routing in Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/prompt-routing.html
