id: sapc03-1a-ecs-fargate-windows
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is containerizing 25 microservices. Twenty of them are Linux containers that run .NET 8, and five are .NET Framework 4.8 applications that must run in Windows Server 2022 containers. The operations team has no Kubernetes experience and does not want to patch, scale, or upgrade any servers, nodes, or cluster versions. Each microservice needs its own IAM role, and the public services must sit behind an Application Load Balancer. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conteneurise 25 microservices. Vingt d'entre eux sont des conteneurs Linux qui exécutent .NET 8, et cinq sont des applications .NET Framework 4.8 qui doivent s'exécuter dans des conteneurs Windows Server 2022. L'équipe d'exploitation n'a aucune expérience de Kubernetes et ne veut corriger, mettre à l'échelle ni mettre à niveau aucun serveur, nœud ou version de cluster. Chaque microservice a besoin de son propre rôle IAM, et les services publics doivent se trouver derrière un Application Load Balancer. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Run all the microservices as Amazon ECS services on AWS Fargate, use the Windows Server 2022 operating system family for the five Windows task definitions, and give each task definition its own task IAM role.
        fr: |-
          Exécuter tous les microservices sous forme de services Amazon ECS sur AWS Fargate, utiliser la famille de système d'exploitation Windows Server 2022 pour les cinq définitions de tâche Windows et attribuer à chaque définition de tâche son propre rôle IAM de tâche.
    - id: b
      text:
        en: |-
          Run all the microservices on an Amazon EKS cluster with Fargate profiles for every namespace, and use IAM roles for service accounts to give each microservice its own IAM role.
        fr: |-
          Exécuter tous les microservices sur un cluster Amazon EKS avec des profils Fargate pour chaque espace de noms, et utiliser les rôles IAM pour les comptes de service pour attribuer à chaque microservice son propre rôle IAM.
    - id: c
      text:
        en: |-
          Run all the microservices on an Amazon EKS cluster with EKS Auto Mode, add a node pool for Windows instances, and use EKS Pod Identity to give each microservice its own IAM role.
        fr: |-
          Exécuter tous les microservices sur un cluster Amazon EKS avec EKS Auto Mode, ajouter un pool de nœuds pour les instances Windows et utiliser EKS Pod Identity pour attribuer à chaque microservice son propre rôle IAM.
    - id: d
      text:
        en: |-
          Run the Linux microservices on Amazon ECS with AWS Fargate, and run the Windows microservices on an ECS cluster backed by an Auto Scaling group of Windows EC2 instances through a capacity provider.
        fr: |-
          Exécuter les microservices Linux sur Amazon ECS avec AWS Fargate, et exécuter les microservices Windows sur un cluster ECS reposant sur un groupe Auto Scaling d'instances EC2 Windows au moyen d'un fournisseur de capacité.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon ECS on Fargate runs both Linux and Windows containers, including Windows Server 2022 Full and Core, so no servers, nodes, or cluster versions need to be managed. Each task definition has its own task IAM role, and ECS services register their tasks with ALB target groups, without any Kubernetes knowledge.
    fr: |-
      Amazon ECS sur Fargate exécute des conteneurs Linux et Windows, y compris Windows Server 2022 Full et Core : aucun serveur, nœud ni version de cluster n'est à gérer. Chaque définition de tâche dispose de son propre rôle IAM de tâche, et les services ECS enregistrent leurs tâches dans des groupes cibles ALB, sans aucune connaissance de Kubernetes.
  options:
    b:
      en: |-
        Fargate on EKS cannot run Windows containers, and an EKS cluster requires Kubernetes skills and regular cluster version upgrades.
      fr: |-
        Fargate sur EKS ne peut pas exécuter de conteneurs Windows, et un cluster EKS exige des compétences Kubernetes et des mises à niveau régulières de la version du cluster.
    c:
      en: |-
        Auto Mode manages the nodes, but the team would still operate a Kubernetes cluster and its version upgrades, which it has no experience with.
      fr: |-
        Auto Mode gère les nœuds, mais l'équipe exploiterait toujours un cluster Kubernetes et ses mises à niveau de version, sans aucune expérience en la matière.
    d:
      en: |-
        Windows EC2 instances in an Auto Scaling group are servers that the team must patch and scale, which Fargate avoids for the Windows services too.
      fr: |-
        Des instances EC2 Windows dans un groupe Auto Scaling sont des serveurs que l'équipe doit corriger et mettre à l'échelle, ce que Fargate évite aussi pour les services Windows.
