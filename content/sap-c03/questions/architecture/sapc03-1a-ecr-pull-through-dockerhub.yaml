id: sapc03-1a-ecr-pull-through-dockerhub
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs Amazon EKS clusters in private subnets that reach the internet through NAT gateways. The workloads pull public base images directly from Docker Hub, and the company now hits Docker Hub rate limits. The security team also wants every base image to be scanned by Amazon ECR enhanced scanning before it runs. The company wants the images to be cached in Amazon ECR in the same Region, and cached tags must pick up the updates that the upstream publishers make to them. The company has a Docker Hub account and wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des clusters Amazon EKS dans des sous-réseaux privés qui accèdent à Internet au moyen de passerelles NAT. Les charges de travail extraient des images de base publiques directement depuis Docker Hub, et l'entreprise atteint désormais les limites de débit de Docker Hub. L'équipe de sécurité veut aussi que chaque image de base soit analysée par l'analyse améliorée d'Amazon ECR avant son exécution. L'entreprise veut que les images soient mises en cache dans Amazon ECR dans la même Région, et que les balises mises en cache reflètent les mises à jour que les éditeurs en amont leur apportent. L'entreprise dispose d'un compte Docker Hub et veut le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Store the Docker Hub credentials in a Secrets Manager secret named with the ecr-pullthroughcache/ prefix, create a pull through cache rule for Docker Hub, pull through its prefix, and turn on enhanced scanning for the prefix.
        fr: |-
          Stocker les informations d'identification Docker Hub dans un secret Secrets Manager nommé avec le préfixe ecr-pullthroughcache/, créer une règle de cache d'extraction (pull through cache) pour Docker Hub, extraire les images par son préfixe et activer l'analyse améliorée pour ce préfixe.
    - id: b
      text:
        en: |-
          Create the same pull through cache rule with the Docker Hub credentials, and add a repository creation template for the rule's prefix that sets tag immutability to IMMUTABLE, and turn on enhanced scanning for that prefix.
        fr: |-
          Créer la même règle de cache d'extraction avec les informations d'identification Docker Hub, et ajouter pour le préfixe de la règle un modèle de création de référentiel qui définit l'immuabilité des balises sur IMMUTABLE et activer l'analyse améliorée pour ce préfixe.
    - id: c
      text:
        en: |-
          Create an AWS CodeBuild project that runs every night, pulls the required base images from Docker Hub with the company's account, and pushes them to ECR repositories that have enhanced scanning turned on.
        fr: |-
          Créer un projet AWS CodeBuild qui s'exécute chaque nuit, extrait les images de base nécessaires depuis Docker Hub avec le compte de l'entreprise et les envoie dans des référentiels ECR où l'analyse améliorée est activée.
    - id: d
      text:
        en: |-
          Add Docker Hub as the source of an ECR replication rule in the private registry, with a repository filter for the base images, and turn on enhanced scanning for the replicated repositories.
        fr: |-
          Ajouter Docker Hub comme source d'une règle de réplication ECR dans le registre privé, avec un filtre de référentiel pour les images de base, et activer l'analyse améliorée pour les référentiels répliqués.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      A pull through cache rule caches upstream images in the private registry; Docker Hub requires credentials in a Secrets Manager secret with the ecr-pullthroughcache/ prefix, in the same account and Region as the rule. ECR checks the upstream at least once every 24 hours when a cached tag is pulled and updates the cache, and cached repositories support image scanning. The first pull needs internet access, which the NAT gateways provide.
    fr: |-
      Une règle de cache d'extraction met en cache les images en amont dans le registre privé ; Docker Hub exige des informations d'identification dans un secret Secrets Manager portant le préfixe ecr-pullthroughcache/, dans le même compte et la même Région que la règle. ECR vérifie l'amont au moins une fois toutes les 24 heures lorsqu'une balise mise en cache est extraite et met le cache à jour, et les référentiels mis en cache prennent en charge l'analyse d'images. La première extraction exige un accès Internet, que fournissent les passerelles NAT.
  options:
    b:
      en: |-
        Tag immutability prevents updates to cached tags, so the cache would keep the first version of each tag and miss the publishers' updates.
      fr: |-
        L'immuabilité des balises empêche la mise à jour des balises mises en cache : le cache conserverait la première version de chaque balise et manquerait les mises à jour des éditeurs.
    c:
      en: |-
        A scheduled copy job is a pipeline to build and maintain, and updates published upstream are copied only once a night.
      fr: |-
        Une tâche de copie planifiée est un pipeline à construire et à maintenir, et les mises à jour publiées en amont ne sont copiées qu'une fois par nuit.
    d:
      en: |-
        ECR replication copies images between ECR private registries; it cannot use Docker Hub as a source.
      fr: |-
        La réplication ECR copie des images entre des registres privés ECR ; elle ne peut pas utiliser Docker Hub comme source.
references:
  - title: Sync an upstream registry with an Amazon ECR private registry - Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/pull-through-cache.html
