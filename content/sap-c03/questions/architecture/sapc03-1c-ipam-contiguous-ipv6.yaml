id: sapc03-1c-ipam-contiguous-ipv6
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is enabling IPv6 on 150 VPCs in two Regions. Today, each VPC receives an Amazon-provided IPv6 CIDR block directly when it is created, so the blocks are scattered across unrelated ranges. The on-premises firewall team needs to allow all of the company's AWS IPv6 address space in each Region with a single rule. The company does not own any IPv6 address range. The company already uses Amazon VPC IPAM for IPv4 across its organization.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise active l'IPv6 sur 150 VPC répartis dans deux Régions. Aujourd'hui, chaque VPC reçoit directement un bloc CIDR IPv6 fourni par Amazon à sa création : les blocs sont dispersés dans des plages sans rapport. L'équipe pare-feu sur site doit autoriser tout l'espace d'adressage IPv6 AWS de l'entreprise dans chaque Région avec une seule règle. L'entreprise ne possède aucune plage d'adresses IPv6. Elle utilise déjà Amazon VPC IPAM pour l'IPv4 dans toute son organisation.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Bring an IPv6 address range to AWS with BYOIP, provision it to an IPAM pool in each Region, and allocate a /56 CIDR block to each VPC from the pools."
        fr: "Apporter une plage d'adresses IPv6 à AWS avec BYOIP, la provisionner dans un pool IPAM de chaque Région, et allouer depuis ces pools un bloc CIDR /56 à chaque VPC."
    - id: b
      text:
        en: "Keep the Amazon-provided CIDR blocks of each VPC, and have a Lambda function update a managed prefix list that the firewall team exports to its firewalls every day."
        fr: "Conserver les blocs CIDR fournis par Amazon de chaque VPC, et faire mettre à jour par une fonction Lambda une liste de préfixes gérée que l'équipe pare-feu exporte chaque jour vers ses pare-feu."
    - id: c
      text:
        en: "Create an IPv6 pool for each Region in IPAM, provision an Amazon-provided contiguous IPv6 CIDR block to it, and allocate the VPC IPv6 CIDR blocks from these pools."
        fr: "Créer dans IPAM un pool IPv6 pour chaque Région, y provisionner un bloc CIDR IPv6 contigu fourni par Amazon, et allouer depuis ces pools les blocs CIDR IPv6 des VPC."
    - id: d
      text:
        en: "Route all VPC IPv6 traffic toward the data center through a transit gateway so that the on-premises firewall sees one aggregated prefix for each Region."
        fr: "Router tout le trafic IPv6 des VPC vers le centre de données par une passerelle de transit (transit gateway) pour que le pare-feu sur site voie un seul préfixe agrégé par Région."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An IPAM pool can be provisioned with an Amazon-provided IPv6 CIDR block, and VPC CIDR blocks allocated from the pool are carved from that same block. Contiguously allocated CIDRs can be aggregated in a single entry in firewalls, route tables and security rules.
    fr: |-
      Un pool IPAM peut être provisionné avec un bloc CIDR IPv6 fourni par Amazon, et les blocs CIDR des VPC alloués depuis ce pool sont découpés dans ce même bloc. Des CIDR alloués de façon contiguë peuvent être agrégés en une seule entrée dans les pare-feu, les tables de routage et les règles de sécurité.
  options:
    a:
      en: |-
        BYOIP requires an IPv6 range that the company owns, and the company does not own one.
      fr: |-
        BYOIP exige une plage IPv6 dont l'entreprise est propriétaire, et elle n'en possède aucune.
    b:
      en: |-
        A function and daily exports are custom work, and the scattered blocks still need many firewall entries.
      fr: |-
        Une fonction et des exports quotidiens sont du travail personnalisé, et les blocs dispersés exigent toujours de nombreuses entrées de pare-feu.
    d:
      en: |-
        A transit gateway does not change the source addresses of the traffic, so the firewall still sees the scattered VPC ranges.
      fr: |-
        Une passerelle de transit ne modifie pas les adresses sources du trafic : le pare-feu voit toujours les plages dispersées des VPC.
references:
  - title: Create IPv6 address pools in your IPAM - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/ipam/intro-create-ipv6-pools.html
