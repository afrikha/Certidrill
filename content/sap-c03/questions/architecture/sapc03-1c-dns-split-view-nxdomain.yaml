id: sapc03-1c-dns-split-view-nxdomain
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company hosts its public website records, such as www.example.com and api.example.com, in a Route 53 public hosted zone for example.com. To give an internal reporting application a private address, an engineer created a Route 53 private hosted zone named example.com that contains only a record for reports.example.com and associated it with the production VPC. Since then, instances in the production VPC receive NXDOMAIN responses for www.example.com and api.example.com, although internet users resolve those names correctly. The reporting name must remain unresolvable from the internet. The company wants a fix that requires no ongoing synchronization of records.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge les enregistrements de son site web public, comme www.example.com et api.example.com, dans une zone hébergée publique Route 53 pour example.com. Pour donner une adresse privée à une application interne de reporting, un ingénieur a créé une zone hébergée privée Route 53 nommée example.com, qui ne contient qu'un enregistrement pour reports.example.com, et l'a associée au VPC de production. Depuis, les instances du VPC de production reçoivent des réponses NXDOMAIN pour www.example.com et api.example.com, alors que les internautes résolvent correctement ces noms. Le nom de reporting doit rester impossible à résoudre depuis Internet. L'entreprise veut une correction qui n'exige aucune synchronisation continue des enregistrements.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Copy every record of the public hosted zone into the private hosted zone, and add a scheduled job that copies new and changed public records every hour."
        fr: "Copier tous les enregistrements de la zone hébergée publique dans la zone hébergée privée, et ajouter une tâche planifiée qui copie chaque heure les enregistrements publics nouveaux et modifiés."
    - id: b
      text:
        en: "Delete the private hosted zone, and add an alias record for reports.example.com to the public hosted zone that points to the internal load balancer."
        fr: "Supprimer la zone hébergée privée, et ajouter à la zone hébergée publique un enregistrement d'alias reports.example.com qui pointe vers l'équilibreur de charge interne."
    - id: c
      text:
        en: "Delete the private hosted zone, create a private hosted zone named reports.example.com with the internal record at its apex, and associate it with the production VPC."
        fr: "Supprimer la zone hébergée privée, créer une zone hébergée privée nommée reports.example.com avec l'enregistrement interne à son apex, et l'associer au VPC de production."
    - id: d
      text:
        en: "Associate the public hosted zone for example.com with the production VPC so that Route 53 Resolver falls back to it when the private hosted zone has no matching record."
        fr: "Associer la zone hébergée publique example.com au VPC de production pour que Route 53 Resolver s'y replie lorsque la zone hébergée privée ne contient pas d'enregistrement correspondant."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      When a private hosted zone matches a query name but has no matching record, Route 53 Resolver returns NXDOMAIN instead of forwarding the query to public DNS. A private hosted zone named reports.example.com matches only that name, so the other example.com names no longer match a private zone and are resolved publicly, while the reporting record stays private.
    fr: |-
      Lorsqu'une zone hébergée privée correspond au nom demandé mais ne contient pas d'enregistrement correspondant, Route 53 Resolver renvoie NXDOMAIN au lieu de transférer la requête au DNS public. Une zone hébergée privée nommée reports.example.com ne correspond qu'à ce nom : les autres noms de example.com ne correspondent plus à une zone privée et sont résolus publiquement, tandis que l'enregistrement de reporting reste privé.
  options:
    a:
      en: |-
        Copying the records works but requires the ongoing synchronization that the company wants to avoid.
      fr: |-
        Copier les enregistrements fonctionne, mais exige la synchronisation continue que l'entreprise veut éviter.
    b:
      en: |-
        A record in the public hosted zone is resolvable from the internet, even if it points to a private address.
      fr: |-
        Un enregistrement de la zone hébergée publique peut être résolu depuis Internet, même s'il pointe vers une adresse privée.
    d:
      en: |-
        Only private hosted zones can be associated with VPCs, and Resolver does not fall back from a matching private hosted zone to public DNS.
      fr: |-
        Seules les zones hébergées privées peuvent être associées à des VPC, et Resolver ne se replie pas d'une zone hébergée privée correspondante vers le DNS public.
references:
  - title: Considerations when working with a private hosted zone - Amazon Route 53
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html
