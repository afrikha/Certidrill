id: sapc03-1c-inter-subnet-inspection-routes
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment company runs application servers and database servers in separate subnets of the same VPC. Each tier has one subnet in each of two Availability Zones, and application servers connect only to the database servers in their own Availability Zone. A new compliance rule requires that all traffic between the application subnets and the database subnets be inspected by a stateful firewall with intrusion prevention, in addition to security groups. The company has deployed AWS Network Firewall with a firewall endpoint in a dedicated firewall subnet in each Availability Zone. The company does not want to move the database servers to another VPC.

    Which solution will meet these requirements?
  fr: |
    Une société de paiement exécute des serveurs d'applications et des serveurs de bases de données dans des sous-réseaux distincts du même VPC. Chaque niveau possède un sous-réseau dans chacune de deux zones de disponibilité, et les serveurs d'applications ne se connectent qu'aux serveurs de bases de données de leur propre zone. Une nouvelle règle de conformité exige que tout le trafic entre les sous-réseaux d'applications et de bases de données soit inspecté par un pare-feu avec état doté d'une prévention des intrusions, en plus des groupes de sécurité. L'entreprise a déployé AWS Network Firewall avec un point de terminaison de pare-feu dans un sous-réseau de pare-feu dédié de chaque zone de disponibilité. Elle ne veut pas déplacer les serveurs de bases de données vers un autre VPC.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add network ACL rules to the application and database subnets that allow only the database port between them, and enable VPC Flow Logs on both tiers of subnets."
        fr: "Ajouter aux sous-réseaux d'applications et de bases de données des règles de liste ACL réseau qui n'autorisent que le port de la base de données entre eux, et activer VPC Flow Logs sur les deux niveaux de sous-réseaux."
    - id: b
      text:
        en: "Replace the target of the local route in the VPC's main route table with the firewall endpoint in the first Availability Zone so that all VPC traffic is inspected."
        fr: "Remplacer la cible de la route locale de la table de routage principale du VPC par le point de terminaison de pare-feu de la première zone de disponibilité, pour que tout le trafic du VPC soit inspecté."
    - id: c
      text:
        en: "Associate a gateway route table with the internet gateway that sends traffic for the database subnets to the firewall endpoints in their Availability Zones."
        fr: "Associer à la passerelle Internet une table de routage de passerelle qui envoie le trafic destiné aux sous-réseaux de bases de données vers les points de terminaison de pare-feu de leurs zones de disponibilité."
    - id: d
      text:
        en: "Add routes in each application subnet for the database subnet in the same zone that target that zone's firewall endpoint, and add the reverse routes in the database subnets."
        fr: "Ajouter dans chaque sous-réseau d'applications une route vers le sous-réseau de bases de données de la même zone qui cible le point de terminaison de pare-feu de cette zone, et ajouter les routes inverses dans les sous-réseaux de bases de données."
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A subnet route table can contain a route that is more specific than the local route when its destination is the entire CIDR block of another subnet in the VPC, with a Network Firewall endpoint as the target. Routing both directions of each flow through the endpoint in the same Availability Zone keeps the traffic symmetric for stateful inspection.
    fr: |-
      Une table de routage de sous-réseau peut contenir une route plus spécifique que la route locale lorsque sa destination est le bloc CIDR complet d'un autre sous-réseau du VPC, avec un point de terminaison Network Firewall comme cible. Faire passer les deux sens de chaque flux par le point de terminaison de la même zone de disponibilité garde le trafic symétrique pour l'inspection avec état.
  options:
    a:
      en: |-
        Network ACLs are stateless address and port filters; they provide neither stateful inspection nor intrusion prevention.
      fr: |-
        Les listes ACL réseau sont des filtres sans état sur les adresses et les ports ; elles n'offrent ni inspection avec état ni prévention des intrusions.
    b:
      en: |-
        Sending all VPC traffic to one endpoint in one Availability Zone inspects far more than the application-to-database traffic and makes both zones depend on a single endpoint.
      fr: |-
        Envoyer tout le trafic du VPC vers un seul point de terminaison d'une zone inspecte bien plus que le trafic entre applications et bases de données et rend les deux zones dépendantes d'un seul point de terminaison.
    c:
      en: |-
        A gateway route table applies to traffic that enters through the internet gateway, not to traffic between subnets of the VPC.
      fr: |-
        Une table de routage de passerelle s'applique au trafic qui entre par la passerelle Internet, pas au trafic entre sous-réseaux du VPC.
references:
  - title: Example routing options - Amazon Virtual Private Cloud
    url: https://docs.aws.amazon.com/vpc/latest/userguide/route-table-options.html
