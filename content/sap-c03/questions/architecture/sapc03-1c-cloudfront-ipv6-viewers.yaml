id: sapc03-1c-cloudfront-ipv6-viewers
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A public sector agency hosts its citizen website on Amazon EC2 instances behind an Application Load Balancer in an IPv4-only VPC. A new government mandate requires the website to be reachable by IPv6 clients within 2 weeks. The infrastructure team cannot change the VPC addressing before next year's network redesign. The website's static and dynamic content can be served through a content delivery network.

    Which solution will meet these requirements with the LEAST effort?
  fr: |
    Un organisme public héberge son site web destiné aux citoyens sur des instances Amazon EC2 derrière un Application Load Balancer, dans un VPC IPv4 uniquement. Une nouvelle obligation gouvernementale impose que le site soit joignable par des clients IPv6 sous 2 semaines. L'équipe d'infrastructure ne peut pas modifier l'adressage du VPC avant la refonte réseau de l'an prochain. Le contenu statique et dynamique du site peut être servi par un réseau de diffusion de contenu.

    Quelle solution répond à ces exigences avec le MOINS d'efforts ?
body:
  options:
    - id: a
      text:
        en: "Create an egress-only internet gateway in the VPC, and add a ::/0 route to it in the route tables of the load balancer's subnets."
        fr: "Créer une passerelle Internet de sortie uniquement dans le VPC, et ajouter une route ::/0 vers elle dans les tables de routage des sous-réseaux de l'équilibreur de charge."
    - id: b
      text:
        en: "Put an Amazon CloudFront distribution with IPv6 enabled in front of the load balancer, and point the website's A and AAAA alias records to the distribution."
        fr: "Placer devant l'équilibreur de charge une distribution Amazon CloudFront avec l'IPv6 activé, et faire pointer les enregistrements d'alias A et AAAA du site vers la distribution."
    - id: c
      text:
        en: "Enable DNS64 on the load balancer's subnets, and route 64:ff9b::/96 to a NAT gateway so that IPv6 clients can reach the IPv4 load balancer."
        fr: "Activer DNS64 sur les sous-réseaux de l'équilibreur de charge, et router 64:ff9b::/96 vers une passerelle NAT pour que les clients IPv6 puissent joindre l'équilibreur IPv4."
    - id: d
      text:
        en: "Associate an IPv6 CIDR block with the VPC and subnets, change the load balancer to the dualstack IP address type, and update the routes and security groups."
        fr: "Associer un bloc CIDR IPv6 au VPC et aux sous-réseaux, passer l'équilibreur de charge au type d'adresse IP dualstack, et mettre à jour les routes et les groupes de sécurité."
answer: { optionId: b }
explanation:
  correct:
    en: |-
      With IPv6 enabled, CloudFront responds to viewer requests from both IPv4 and IPv6 addresses, and it can keep connecting to the custom origin over IPv4. Alias A and AAAA records point the website name to the distribution, so the VPC does not change.
    fr: |-
      Avec l'IPv6 activé, CloudFront répond aux requêtes des utilisateurs depuis des adresses IPv4 et IPv6, et peut continuer à se connecter à l'origine personnalisée en IPv4. Des enregistrements d'alias A et AAAA font pointer le nom du site vers la distribution : le VPC ne change pas.
  options:
    a:
      en: |-
        An egress-only internet gateway only allows outbound IPv6 traffic, and it requires IPv6 addressing in the VPC.
      fr: |-
        Une passerelle Internet de sortie uniquement n'autorise que le trafic IPv6 sortant, et elle exige un adressage IPv6 dans le VPC.
    c:
      en: |-
        DNS64 and NAT64 let IPv6-only workloads inside the VPC reach IPv4 destinations; they do not accept connections from IPv6 clients on the internet.
      fr: |-
        DNS64 et NAT64 permettent aux charges de travail IPv6 uniquement du VPC de joindre des destinations IPv4 ; ils n'acceptent pas de connexions de clients IPv6 sur Internet.
    d:
      en: |-
        A dual-stack VPC works, but it changes the VPC addressing, which the team cannot do now.
      fr: |-
        Un VPC double pile fonctionne, mais il modifie l'adressage du VPC, ce que l'équipe ne peut pas faire pour l'instant.
references:
  - title: Distribution settings - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistValuesGeneral.html
