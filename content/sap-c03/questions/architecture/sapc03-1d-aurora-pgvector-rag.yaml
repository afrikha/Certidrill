id: sapc03-1d-aurora-pgvector-rag
objective: "1.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs its policy administration system on an Amazon Aurora PostgreSQL DB cluster that uses version 16. The company is building a generative AI assistant on Amazon Bedrock that answers questions by using retrieval augmented generation (RAG) over policy documents stored in Amazon S3. The assistant must filter the retrieved chunks by policy attributes such as product line and state. The database team wants to reuse its PostgreSQL skills, backups and access controls, and the company does not want to add another data store service to operate. The vector store must be supported as the storage of an Amazon Bedrock knowledge base.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance exécute son système de gestion des polices sur un cluster de bases de données Amazon Aurora PostgreSQL en version 16. L'entreprise développe sur Amazon Bedrock un assistant d'IA générative qui répond aux questions par génération augmentée par récupération (RAG) sur des documents de polices stockés dans Amazon S3. L'assistant doit filtrer les segments récupérés selon des attributs des polices, comme la gamme de produits et l'État. L'équipe des bases de données veut réutiliser ses compétences PostgreSQL, ses sauvegardes et ses contrôles d'accès, et l'entreprise ne veut pas ajouter un autre service de stockage de données à exploiter. Le magasin de vecteurs doit être pris en charge comme stockage d'une base de connaissances Amazon Bedrock.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Store the embeddings as items in an Amazon DynamoDB table with a global secondary index on product line, and find similar chunks with a filtered Scan."
        fr: "Stocker les plongements (embeddings) comme éléments d'une table Amazon DynamoDB avec un index secondaire global sur la gamme de produits, et trouver les segments similaires avec un Scan filtré."
    - id: b
      text:
        en: "Enable the pgvector extension and the RDS Data API on the Aurora cluster, and configure it as the knowledge base vector store with a metadata column for filtering."
        fr: "Activer l'extension pgvector et l'API RDS Data sur le cluster Aurora, et le configurer comme magasin de vecteurs de la base de connaissances avec une colonne de métadonnées pour le filtrage."
    - id: c
      text:
        en: "Create an Amazon OpenSearch Serverless vector search collection as the knowledge base vector store, and copy the policy attributes into each document."
        fr: "Créer une collection de recherche vectorielle Amazon OpenSearch Serverless comme magasin de vecteurs de la base de connaissances, et copier les attributs des polices dans chaque document."
    - id: d
      text:
        en: "Store the embeddings in an Amazon Redshift Serverless table, and call Amazon Bedrock from Redshift ML for each retrieval request of the assistant."
        fr: "Stocker les plongements dans une table Amazon Redshift Serverless, et appeler Amazon Bedrock depuis Redshift ML pour chaque requête de récupération de l'assistant."
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Aurora PostgreSQL cluster with pgvector 0.5.0 or later, which every Aurora PostgreSQL 16 version includes, can be the vector store of a Bedrock knowledge base. The cluster needs the RDS Data API and a database user whose credentials are in Secrets Manager. Embeddings live in an ordinary PostgreSQL table with a JSONB metadata column that Bedrock uses to filter searches, so the team keeps its existing engine, backups and permissions.
    fr: |
      Un cluster Aurora PostgreSQL avec pgvector 0.5.0 ou version ultérieure, inclus dans toutes les versions d'Aurora PostgreSQL 16, peut servir de magasin de vecteurs à une base de connaissances Bedrock. Le cluster a besoin de l'API RDS Data et d'un utilisateur de base de données dont les informations d'identification sont dans Secrets Manager. Les plongements résident dans une table PostgreSQL ordinaire avec une colonne de métadonnées JSONB que Bedrock utilise pour filtrer les recherches : l'équipe conserve son moteur, ses sauvegardes et ses autorisations existants.
  options:
    a:
      en: |
        DynamoDB has no vector similarity search, so a Scan cannot rank chunks by similarity, and it is not a knowledge base vector store.
      fr: |
        DynamoDB n'offre pas de recherche par similarité vectorielle : un Scan ne peut pas classer les segments par similarité, et ce n'est pas un magasin de vecteurs de base de connaissances.
    c:
      en: |
        OpenSearch Serverless can store the vectors, but it is another data store service with its own access model and operations, which the company wants to avoid.
      fr: |
        OpenSearch Serverless peut stocker les vecteurs, mais c'est un autre service de stockage de données avec son propre modèle d'accès et son exploitation, ce que l'entreprise veut éviter.
    d:
      en: |
        Redshift is not a knowledge base vector store, and Redshift ML invokes models from SQL; it does not perform the knowledge base retrieval.
      fr: |
        Redshift n'est pas un magasin de vecteurs de base de connaissances, et Redshift ML appelle des modèles depuis SQL ; il n'effectue pas la récupération de la base de connaissances.
references:
  - title: Using Aurora PostgreSQL as a Knowledge Base for Amazon Bedrock
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraPostgreSQL.VectorDB.html
