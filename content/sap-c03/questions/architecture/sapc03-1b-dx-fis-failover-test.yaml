id: sapc03-1b-dx-fis-failover-test
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank connects its data center to AWS with AWS Direct Connect connections at two locations in an active/passive design, using transit virtual interfaces, a Direct Connect gateway and a transit gateway. A network account owns all the virtual interfaces. Regulators require quarterly evidence that traffic fails over from the primary location to the secondary location. The test must start on a schedule, interrupt only the BGP sessions of the primary location's virtual interfaces, and stop and restore those sessions automatically if a CloudWatch alarm on the latency of the payment application enters the ALARM state. The bank wants the least custom code.

    Which solution will meet these requirements?
  fr: |
    Une banque relie son centre de données à AWS par des connexions AWS Direct Connect sur deux emplacements, dans une conception actif/passif, avec des interfaces virtuelles de transit, une passerelle Direct Connect et une passerelle de transit. Un compte réseau possède toutes les interfaces virtuelles. Les régulateurs exigent une preuve trimestrielle que le trafic bascule de l'emplacement principal vers l'emplacement secondaire. Le test doit démarrer selon une planification, n'interrompre que les sessions BGP des interfaces virtuelles de l'emplacement principal, puis s'arrêter et rétablir ces sessions automatiquement si une alarme CloudWatch sur la latence de l'application de paiement passe à l'état ALARM. La banque veut le moins de code personnalisé possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Schedule an Amazon EventBridge Scheduler task in the network account that starts a Direct Connect Resiliency Toolkit failover test on the primary virtual interfaces for a fixed duration."
        fr: "Planifier dans le compte réseau une tâche Amazon EventBridge Scheduler qui lance un test de basculement du Direct Connect Resiliency Toolkit sur les interfaces virtuelles principales pour une durée fixe."
    - id: b
      text:
        en: "Create an AWS FIS experiment template in the network account with the aws:directconnect:virtual-interface-disconnect action on the primary virtual interfaces and a stop condition on the alarm, and start it on a schedule."
        fr: "Créer dans le compte réseau un modèle d'expérience AWS FIS avec l'action aws:directconnect:virtual-interface-disconnect sur les interfaces virtuelles principales et une condition d'arrêt sur l'alarme, et le lancer selon une planification."
    - id: c
      text:
        en: "Create an AWS FIS experiment template with the aws:network:disrupt-connectivity action on the subnets of the transit gateway attachments, with a stop condition on the alarm, and start it on a schedule."
        fr: "Créer un modèle d'expérience AWS FIS avec l'action aws:network:disrupt-connectivity sur les sous-réseaux des attachements de la passerelle de transit, avec une condition d'arrêt sur l'alarme, et le lancer selon une planification."
    - id: d
      text:
        en: "Ask the colocation provider to shut down the cross-connects of the primary location during a quarterly window, and have the network team restore them if the alarm fires."
        fr: "Demander à l'hébergeur de désactiver les interconnexions de l'emplacement principal pendant une fenêtre trimestrielle, et faire rétablir celles-ci par l'équipe réseau si l'alarme se déclenche."
answer: { optionId: b }
explanation:
  correct:
    en: "The FIS action aws:directconnect:virtual-interface-disconnect temporarily disrupts the BGP sessions of the target virtual interfaces to test Direct Connect resilience. FIS experiment templates support stop conditions based on CloudWatch alarms, so the experiment ends and the sessions are restored when the latency alarm fires, and the experiment can be started on a schedule without custom code."
    fr: "L'action FIS aws:directconnect:virtual-interface-disconnect perturbe temporairement les sessions BGP des interfaces virtuelles ciblées pour tester la résilience de Direct Connect. Les modèles d'expérience FIS prennent en charge des conditions d'arrêt fondées sur des alarmes CloudWatch : l'expérience s'arrête et les sessions sont rétablies quand l'alarme de latence se déclenche, et l'expérience peut être lancée selon une planification sans code personnalisé."
  options:
    a:
      en: "The Resiliency Toolkit test brings down the BGP sessions for the chosen duration, but it has no alarm-based stop condition; stopping it on the alarm would need custom code."
      fr: "Le test du Resiliency Toolkit coupe les sessions BGP pour la durée choisie, mais il n'a pas de condition d'arrêt fondée sur une alarme : l'arrêter sur l'alarme demanderait du code personnalisé."
    c:
      en: "This action blocks traffic in the target subnets by cloning their network ACLs; it does not take down the BGP sessions of the primary location, so it does not test Direct Connect failover."
      fr: "Cette action bloque le trafic dans les sous-réseaux ciblés en clonant leurs listes ACL réseau : elle ne coupe pas les sessions BGP de l'emplacement principal et ne teste donc pas le basculement Direct Connect."
    d:
      en: "A manual physical shutdown is not scheduled, depends on people to restore it, and also stops traffic that is not part of the test."
      fr: "Une coupure physique manuelle n'est pas planifiée, dépend d'humains pour le rétablissement et arrête aussi du trafic qui ne fait pas partie du test."
references:
  - title: AWS FIS Actions reference
    url: https://docs.aws.amazon.com/fis/latest/userguide/fis-actions-reference.html
  - title: Stop conditions for AWS FIS
    url: https://docs.aws.amazon.com/fis/latest/userguide/stop-conditions.html
