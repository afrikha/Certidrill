id: sapc03-1a-spot-externalize-state
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a Java web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer, with load balancer stickiness enabled. The application keeps user sessions in the memory of the JVM. It also writes the PDF reports that users generate to the instance store volume of the instance, and users download the reports during the following 30 days. To reduce costs, the company wants to run the Auto Scaling group on Spot Instances. A Spot interruption must not sign users out or delete their reports, and any instance must be able to serve any request.

    Which combination of changes will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute une application web Java sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer, avec la persistance de l'équilibreur de charge activée. L'application conserve les sessions utilisateur dans la mémoire de la JVM. Elle écrit aussi les rapports PDF générés par les utilisateurs sur le volume de stockage d'instance de l'instance, et les utilisateurs téléchargent ces rapports pendant les 30 jours suivants. Pour réduire les coûts, l'entreprise veut exécuter le groupe Auto Scaling sur des instances Spot. Une interruption Spot ne doit ni déconnecter les utilisateurs ni supprimer leurs rapports, et n'importe quelle instance doit pouvoir traiter n'importe quelle requête.

    Quelle combinaison de modifications permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: |-
          Store the sessions in an Amazon ElastiCache (Valkey) cluster that all the instances share, and turn off stickiness on the target group.
        fr: |-
          Stocker les sessions dans un cluster Amazon ElastiCache (Valkey) partagé par toutes les instances, et désactiver la persistance sur le groupe cible.
    - id: b
      text:
        en: |-
          Turn on capacity rebalancing for the Auto Scaling group so that it launches replacement Spot Instances before the interrupted instances stop.
        fr: |-
          Activer le rééquilibrage de capacité du groupe Auto Scaling pour qu'il lance des instances Spot de remplacement avant l'arrêt des instances interrompues.
    - id: c
      text:
        en: |-
          Write the reports to an Amazon EBS io2 volume with Multi-Attach enabled and attach the volume to every instance in the Auto Scaling group.
        fr: |-
          Écrire les rapports sur un volume Amazon EBS io2 avec Multi-Attach activé et attacher le volume à chaque instance du groupe Auto Scaling.
    - id: d
      text:
        en: |-
          Write the reports to an Amazon S3 bucket, and let users download them through presigned URLs that the application generates on request.
        fr: |-
          Écrire les rapports dans un compartiment Amazon S3, et permettre aux utilisateurs de les télécharger au moyen d'URL présignées que l'application génère à la demande.
    - id: e
      text:
        en: |-
          Increase the stickiness duration of the target group to 30 days so that each user always returns to the instance that holds the user's session and reports.
        fr: |-
          Porter la durée de persistance du groupe cible à 30 jours pour que chaque utilisateur revienne toujours à l'instance qui détient sa session et ses rapports.
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Moving the sessions to a shared in-memory store and the reports to S3 removes all user state from the instances, so any instance can serve any request and an interrupted Spot Instance loses nothing. Without local state, stickiness is no longer needed, and presigned URLs give users time-limited access to their reports without AWS credentials.
    fr: |-
      Déplacer les sessions vers un magasin en mémoire partagé et les rapports vers S3 retire tout l'état utilisateur des instances : n'importe quelle instance peut traiter n'importe quelle requête et une instance Spot interrompue ne perd rien. Sans état local, la persistance n'est plus nécessaire, et les URL présignées donnent aux utilisateurs un accès limité dans le temps à leurs rapports sans informations d'identification AWS.
  options:
    b:
      en: |-
        Capacity rebalancing helps maintain capacity, but the sessions and reports on the interrupted instance are still lost when it stops.
      fr: |-
        Le rééquilibrage de capacité aide à maintenir la capacité, mais les sessions et les rapports de l'instance interrompue sont toujours perdus à son arrêt.
    c:
      en: |-
        Multi-Attach works only for instances in the same Availability Zone and needs a cluster-aware file system, so it cannot serve as shared storage for a Multi-AZ Auto Scaling group.
      fr: |-
        Multi-Attach ne fonctionne que pour des instances d'une même zone de disponibilité et exige un système de fichiers compatible cluster : il ne peut pas servir de stockage partagé pour un groupe Auto Scaling Multi-AZ.
    e:
      en: |-
        Stickiness keeps the state on one instance, so the state disappears with that instance when Spot interrupts it, and other instances still cannot serve the user.
      fr: |-
        La persistance garde l'état sur une seule instance : l'état disparaît avec cette instance quand Spot l'interrompt, et les autres instances ne peuvent toujours pas servir l'utilisateur.
references:
  - title: Uploading objects with presigned URLs - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html
