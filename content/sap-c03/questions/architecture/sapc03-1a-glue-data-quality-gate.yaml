id: sapc03-1a-glue-data-quality-gate
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs a daily AWS Glue ETL job that moves supplier data from the raw zone to the curated zone of its Amazon S3 data lake. Last month, several downstream reports failed after files with missing customer IDs and out-of-range amounts were loaded into the curated zone. The data team must evaluate completeness, uniqueness, and value-range rules before the data lands in the curated zone. When the rules fail, the job must stop the load and keep the failing records in a quarantine prefix for review. The results must be published to Amazon CloudWatch and Amazon EventBridge for alerting. The company wants a serverless solution with the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle exécute chaque jour une tâche ETL AWS Glue qui déplace les données fournisseurs de la zone brute vers la zone organisée de son lac de données Amazon S3. Le mois dernier, plusieurs rapports en aval ont échoué après le chargement dans la zone organisée de fichiers contenant des ID client manquants et des montants hors limites. L'équipe de données doit évaluer des règles d'exhaustivité, d'unicité et de plage de valeurs avant que les données n'arrivent dans la zone organisée. Quand les règles échouent, la tâche doit arrêter le chargement et conserver les enregistrements en échec dans un préfixe de quarantaine pour examen. Les résultats doivent être publiés dans Amazon CloudWatch et Amazon EventBridge pour les alertes. L'entreprise veut une solution sans serveur avec le MOINS de code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Let the job load the curated zone, then run scheduled Amazon Athena queries that count null IDs and out-of-range amounts, and have an AWS Lambda function send alerts when the counts are not zero.
        fr: |-
          Laisser la tâche charger la zone organisée, puis exécuter des requêtes Amazon Athena planifiées qui comptent les ID nuls et les montants hors limites, et faire envoyer des alertes par une fonction AWS Lambda quand les nombres ne sont pas nuls.
    - id: b
      text:
        en: |-
          Add an Evaluate Data Quality transform with a DQDL ruleset to the Glue job, write the failed records to the quarantine prefix, fail the job when the rules fail, and publish the results to CloudWatch and EventBridge.
        fr: |-
          Ajouter à la tâche Glue une transformation Evaluate Data Quality avec un ensemble de règles DQDL, écrire les enregistrements en échec dans le préfixe de quarantaine, faire échouer la tâche quand les règles échouent et publier les résultats dans CloudWatch et EventBridge.
    - id: c
      text:
        en: |-
          Register the curated zone with AWS Lake Formation and create data filters that hide the rows with missing customer IDs or out-of-range amounts from the reporting users.
        fr: |-
          Enregistrer la zone organisée auprès d'AWS Lake Formation et créer des filtres de données qui masquent aux utilisateurs des rapports les lignes contenant des ID client manquants ou des montants hors limites.
    - id: d
      text:
        en: |-
          Configure S3 event notifications on the raw zone to invoke an AWS Lambda function that validates each file with custom code and copies only the valid files to the curated zone.
        fr: |-
          Configurer des notifications d'événements S3 sur la zone brute pour appeler une fonction AWS Lambda qui valide chaque fichier avec du code personnalisé et ne copie que les fichiers valides dans la zone organisée.
answer: { optionId: b }
explanation:
  correct:
    en: |-
      AWS Glue Data Quality is serverless and evaluates rules written in DQDL. In an ETL job, the Evaluate Data Quality transform checks the data before it lands in the lake, identifies the failed records so that they can be routed to a quarantine location, and integrates with CloudWatch and EventBridge, so the job can stop the load without custom validation code.
    fr: |-
      AWS Glue Data Quality est sans serveur et évalue des règles écrites en DQDL. Dans une tâche ETL, la transformation Evaluate Data Quality contrôle les données avant leur arrivée dans le lac, identifie les enregistrements en échec pour qu'ils soient dirigés vers un emplacement de quarantaine, et s'intègre à CloudWatch et EventBridge : la tâche peut arrêter le chargement sans code de validation personnalisé.
  options:
    a:
      en: |-
        The checks run after the data has landed in the curated zone, so bad data still reaches the reports, and the queries and alerting function are custom code.
      fr: |-
        Les contrôles s'exécutent après l'arrivée des données dans la zone organisée : les données erronées atteignent toujours les rapports, et les requêtes et la fonction d'alerte sont du code personnalisé.
    c:
      en: |-
        Data filters control who can see which rows; they do not evaluate quality rules, stop the load, or quarantine records.
      fr: |-
        Les filtres de données contrôlent qui peut voir quelles lignes ; ils n'évaluent pas de règles de qualité, n'arrêtent pas le chargement et ne mettent pas d'enregistrements en quarantaine.
    d:
      en: |-
        Per-file validation in a Lambda function is custom code to write and maintain, and it bypasses the Glue job instead of gating it.
      fr: |-
        Une validation par fichier dans une fonction Lambda est du code personnalisé à écrire et à maintenir, et elle contourne la tâche Glue au lieu de la conditionner.
references:
  - title: AWS Glue Data Quality - AWS Glue
    url: https://docs.aws.amazon.com/glue/latest/dg/glue-data-quality.html
