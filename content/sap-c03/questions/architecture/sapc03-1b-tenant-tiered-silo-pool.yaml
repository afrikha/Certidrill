id: sapc03-1b-tenant-tiered-silo-pool
objective: "1.1.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A SaaS company sells an analytics product to 3,000 small-business tenants on a Basic tier and to 25 enterprise tenants on a Premium tier. Basic tenants can share compute and storage, and the company wants to keep their cost per tenant low. Premium contracts require that no other tenant shares the compute or the database of a Premium tenant, to remove noisy neighbor effects and to satisfy auditors. All tenants must run the same application version, deployed by one release pipeline.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise SaaS vend un produit d'analyse à 3 000 locataires de petites entreprises sur un niveau Basic et à 25 locataires grands comptes sur un niveau Premium. Les locataires Basic peuvent partager calcul et stockage, et l'entreprise veut garder leur coût par locataire bas. Les contrats Premium exigent qu'aucun autre locataire ne partage le calcul ou la base de données d'un locataire Premium, pour supprimer les effets de voisin bruyant (noisy neighbor) et satisfaire les auditeurs. Tous les locataires doivent exécuter la même version de l'application, déployée par un seul pipeline de publication.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Deploy a dedicated stack, with its own compute and database, for every tenant of both tiers, each in its own AWS account created through the release pipeline."
        fr: "Déployer une pile dédiée, avec son propre calcul et sa propre base de données, pour chaque locataire des deux niveaux, chacune dans son propre compte AWS créé par le pipeline de publication."
    - id: b
      text:
        en: "Run the Basic tenants in one shared pooled stack, and deploy a dedicated silo stack for each Premium tenant from the same templates and release pipeline during onboarding."
        fr: "Exécuter les locataires Basic dans une pile mutualisée (pool) partagée, et déployer une pile cloisonnée (silo) dédiée pour chaque locataire Premium à partir des mêmes modèles et du même pipeline lors de l'intégration."
    - id: c
      text:
        en: "Run all tenants in one shared pooled stack, and give Premium tenants higher throttling limits and a dedicated priority queue to reduce noisy neighbor effects."
        fr: "Exécuter tous les locataires dans une seule pile mutualisée partagée, et donner aux locataires Premium des limites de limitation plus élevées et une file d'attente prioritaire dédiée pour réduire les effets de voisin bruyant."
    - id: d
      text:
        en: "Deploy a dedicated stack for every tenant of both tiers in one shared AWS account, and separate the resources of each tenant with cost allocation tags."
        fr: "Déployer une pile dédiée pour chaque locataire des deux niveaux dans un seul compte AWS partagé, et séparer les ressources de chaque locataire avec des étiquettes de répartition des coûts."
answer: { optionId: b }
explanation:
  correct:
    en: "A mixed model places basic tier tenants in a pooled environment and premium tier tenants in silo stacks that share no resources. Using the same templates and pipeline keeps every silo on the same configuration and software version as the pool, as SaaS guidance requires, and only the 25 Premium tenants pay for dedicated resources."
    fr: "Un modèle mixte place les locataires du niveau de base dans un environnement mutualisé et les locataires premium dans des piles cloisonnées qui ne partagent aucune ressource. Les mêmes modèles et le même pipeline gardent chaque silo sur la même configuration et la même version logicielle que le pool, comme le recommandent les bonnes pratiques SaaS, et seuls les 25 locataires Premium paient des ressources dédiées."
  options:
    a:
      en: "Dedicated stacks and accounts for the 3,000 Basic tenants multiply infrastructure and operations cost without any requirement for it."
      fr: "Des piles et des comptes dédiés pour les 3 000 locataires Basic multiplient les coûts d'infrastructure et d'exploitation sans qu'aucune exigence ne le demande."
    c:
      en: "Throttling and priority queues reduce noisy neighbor effects but Premium tenants would still share compute and the database, which the contracts forbid."
      fr: "La limitation et les files prioritaires réduisent les effets de voisin bruyant, mais les locataires Premium partageraient toujours le calcul et la base de données, ce que les contrats interdisent."
    d:
      en: "A dedicated stack for each of the 3,000 Basic tenants is far more expensive than a pool, and tags do not isolate anything."
      fr: "Une pile dédiée pour chacun des 3 000 locataires Basic coûte bien plus cher qu'un pool, et les étiquettes n'isolent rien."
references:
  - title: Full stack silo and pool
    url: https://docs.aws.amazon.com/whitepapers/latest/saas-architecture-fundamentals/full-stack-silo-and-pool.html
