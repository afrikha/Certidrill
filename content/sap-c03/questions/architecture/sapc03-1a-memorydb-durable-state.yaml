id: sapc03-1a-memorydb-durable-state
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs stateless matchmaking microservices on Amazon EKS. The microservices keep player sessions, matchmaking queues, and leaderboards in a self-managed Redis OSS cluster on Amazon EC2 instances, and they use Redis sorted sets and lists. Last month, a node failure caused the loss of writes that the cluster had already acknowledged. The company wants a managed service that keeps the same data structures and commands so that the code does not change. The data store must provide microsecond read latency and store the data durably across multiple Availability Zones, because it is the system of record for this state. The company does not want to operate a separate cache and database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute des microservices de mise en relation (matchmaking) sans état sur Amazon EKS. Les microservices conservent les sessions des joueurs, les files de mise en relation et les classements dans un cluster Redis OSS autogéré sur des instances Amazon EC2, et utilisent les ensembles triés (sorted sets) et les listes Redis. Le mois dernier, la panne d'un nœud a entraîné la perte d'écritures que le cluster avait déjà confirmées. L'entreprise veut un service géré qui conserve les mêmes structures de données et commandes, pour que le code ne change pas. Le magasin de données doit offrir une latence de lecture de l'ordre de la microseconde et stocker les données de manière durable dans plusieurs zones de disponibilité, car il est le système de référence de cet état. L'entreprise ne veut pas exploiter un cache et une base de données distincts.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Migrate the data to an Amazon ElastiCache (Valkey) cluster with cluster mode enabled, replicas in other Availability Zones, and Multi-AZ automatic failover.
        fr: |-
          Migrer les données vers un cluster Amazon ElastiCache (Valkey) avec le mode cluster activé, des réplicas dans d'autres zones de disponibilité et le basculement automatique Multi-AZ.
    - id: b
      text:
        en: |-
          Migrate the data to Amazon DynamoDB tables, and add a DynamoDB Accelerator (DAX) cluster in front of the tables to provide microsecond read latency.
        fr: |-
          Migrer les données vers des tables Amazon DynamoDB, et ajouter un cluster DynamoDB Accelerator (DAX) devant les tables pour obtenir une latence de lecture de l'ordre de la microseconde.
    - id: c
      text:
        en: |-
          Migrate the data to an Amazon MemoryDB cluster with nodes in multiple Availability Zones, and point the microservices to the cluster endpoint.
        fr: |-
          Migrer les données vers un cluster Amazon MemoryDB avec des nœuds dans plusieurs zones de disponibilité, et diriger les microservices vers le point de terminaison du cluster.
    - id: d
      text:
        en: |-
          Migrate the data to an Amazon ElastiCache Serverless (Valkey) cache, and schedule daily snapshots of the cache to Amazon S3 to protect against data loss.
        fr: |-
          Migrer les données vers un cache Amazon ElastiCache Serverless (Valkey), et planifier des instantanés quotidiens du cache vers Amazon S3 pour se protéger contre la perte de données.
answer: { optionId: c }
explanation:
  correct:
    en: |-
      MemoryDB is a durable in-memory database that is compatible with Valkey and Redis OSS, so the sorted sets, lists, and commands keep working. It stores data in memory for microsecond reads and keeps it durably in a Multi-AZ transactional log, so it can serve as the primary database without a separate cache and database.
    fr: |-
      MemoryDB est une base de données en mémoire durable compatible avec Valkey et Redis OSS : les ensembles triés, les listes et les commandes continuent de fonctionner. Il stocke les données en mémoire pour des lectures de l'ordre de la microseconde et les conserve de manière durable dans un journal transactionnel Multi-AZ : il peut servir de base de données principale sans cache ni base de données distincts.
  options:
    a:
      en: |-
        ElastiCache replicates to its replicas asynchronously, so a primary node failure can still lose recently acknowledged writes; it is designed as a cache rather than a durable system of record.
      fr: |-
        ElastiCache réplique vers ses réplicas de manière asynchrone : la panne d'un nœud principal peut encore faire perdre des écritures récemment confirmées ; il est conçu comme un cache plutôt que comme un système de référence durable.
    b:
      en: |-
        DynamoDB with DAX is durable and fast, but it uses a different API and has no Redis sorted sets or lists, so the code would have to change.
      fr: |-
        DynamoDB avec DAX est durable et rapide, mais utilise une API différente et ne propose ni ensembles triés ni listes Redis : le code devrait changer.
    d:
      en: |-
        Daily snapshots protect only up to the last snapshot, so a failure could lose up to a day of writes, which does not meet the durability requirement.
      fr: |-
        Des instantanés quotidiens ne protègent que jusqu'au dernier instantané : une panne pourrait faire perdre jusqu'à une journée d'écritures, ce qui ne répond pas à l'exigence de durabilité.
references:
  - title: What is MemoryDB - Amazon MemoryDB
    url: https://docs.aws.amazon.com/memorydb/latest/devguide/what-is-memorydb.html
