id: sapc03-1a-firehose-parquet-partitions
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer streams clickstream events in JSON format into an Amazon Kinesis Data Streams stream that several applications already consume. The analytics team wants the events stored in Amazon S3 in Apache Parquet format, partitioned by the customer's Region and by event date, so that it can query them with Amazon Athena. Events must be queryable within 15 minutes of their arrival. The schema of the events is stable and is already defined as a table in the AWS Glue Data Catalog. The company wants a serverless solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un détaillant en ligne diffuse des événements de parcours de navigation (clickstream) au format JSON dans un flux Amazon Kinesis Data Streams que plusieurs applications consomment déjà. L'équipe d'analytique veut que les événements soient stockés dans Amazon S3 au format Apache Parquet, partitionnés par Région du client et par date d'événement, afin de pouvoir les interroger avec Amazon Athena. Les événements doivent pouvoir être interrogés dans les 15 minutes qui suivent leur arrivée. Le schéma des événements est stable et déjà défini sous forme de table dans l'AWS Glue Data Catalog. L'entreprise veut une solution sans serveur avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: |-
          Create an Amazon Data Firehose stream with the Kinesis data stream as its source, enable record format conversion to Parquet with the Glue table as the schema, and enable dynamic partitioning on the Region and date fields of the events.
        fr: |-
          Créer un flux Amazon Data Firehose avec le flux de données Kinesis comme source, activer la conversion du format des enregistrements en Parquet avec la table Glue comme schéma, et activer le partitionnement dynamique sur les champs Région et date des événements.
    - id: b
      text:
        en: |-
          Add an AWS Lambda function as a consumer of the stream that converts each batch of events to Parquet with a library and writes one object for each batch to the Region and date prefixes in S3.
        fr: |-
          Ajouter comme consommateur du flux une fonction AWS Lambda qui convertit chaque lot d'événements en Parquet au moyen d'une bibliothèque et écrit un objet par lot dans les préfixes S3 de Région et de date.
    - id: c
      text:
        en: |-
          Create an AWS Glue streaming ETL job that reads the stream continuously, converts the events to Parquet in a Spark script, and writes them to S3 partitioned by Region and date.
        fr: |-
          Créer une tâche ETL de streaming AWS Glue qui lit le flux en continu, convertit les événements en Parquet dans un script Spark et les écrit dans S3 avec un partitionnement par Région et par date.
    - id: d
      text:
        en: |-
          Create an Amazon Data Firehose stream that delivers the raw JSON events to S3, run an AWS Glue crawler every hour, and run an Athena CREATE TABLE AS SELECT query every hour to convert the new data to partitioned Parquet.
        fr: |-
          Créer un flux Amazon Data Firehose qui livre les événements JSON bruts dans S3, exécuter un robot d'analyse (crawler) AWS Glue toutes les heures et exécuter toutes les heures une requête Athena CREATE TABLE AS SELECT pour convertir les nouvelles données en Parquet partitionné.
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Firehose can read from an existing Kinesis data stream, convert JSON records to Parquet by using the schema of a Glue Data Catalog table, and use dynamic partitioning to deliver each record to an S3 prefix built from keys in the data. This managed configuration produces partitioned columnar files that Athena scans efficiently, within the buffering interval and without code to maintain.
    fr: |-
      Firehose peut lire un flux de données Kinesis existant, convertir les enregistrements JSON en Parquet en utilisant le schéma d'une table du Glue Data Catalog, et utiliser le partitionnement dynamique pour livrer chaque enregistrement dans un préfixe S3 construit à partir de clés présentes dans les données. Cette configuration gérée produit des fichiers en colonnes partitionnés qu'Athena analyse efficacement, dans l'intervalle de mise en mémoire tampon et sans code à maintenir.
  options:
    b:
      en: |-
        A custom consumer adds conversion code to maintain and writes one object per batch, which creates many small files that slow down Athena queries.
      fr: |-
        Un consommateur personnalisé ajoute du code de conversion à maintenir et écrit un objet par lot, ce qui crée de nombreux petits fichiers qui ralentissent les requêtes Athena.
    c:
      en: |-
        A Glue streaming job works, but it requires a Spark script to maintain and a job that runs all the time, which is more operational overhead than a Firehose configuration.
      fr: |-
        Une tâche de streaming Glue fonctionne, mais elle exige un script Spark à maintenir et une tâche qui s'exécute en permanence, ce qui représente plus de charge opérationnelle qu'une configuration Firehose.
    d:
      en: |-
        The hourly crawler and conversion add steps to operate, and data could wait more than an hour before it is available as partitioned Parquet, which misses the 15-minute requirement.
      fr: |-
        Le robot d'analyse et la conversion horaires ajoutent des étapes à exploiter, et les données pourraient attendre plus d'une heure avant d'être disponibles en Parquet partitionné, ce qui ne respecte pas l'exigence de 15 minutes.
references:
