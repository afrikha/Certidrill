    url: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
  - title: Partition streaming data in Amazon Data Firehose - Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/dynamic-partitioning.html
