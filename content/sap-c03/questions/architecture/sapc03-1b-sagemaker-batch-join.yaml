id: sapc03-1b-sagemaker-batch-join
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An energy company scores the credit risk of its 30 million customers once a month with a model trained in Amazon SageMaker AI. The input is a 3 TB set of CSV files in Amazon S3, in which the first column is a customer ID that the model must not receive. The output must contain the customer ID next to each score so that the billing system can load it directly. All the data is available at the start of the run, the scores are not needed in real time, and the company does not want a persistent endpoint or separate preprocessing and postprocessing jobs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'énergie évalue une fois par mois le risque de crédit de ses 30 millions de clients avec un modèle entraîné dans Amazon SageMaker AI. L'entrée est un ensemble de fichiers CSV de 3 To dans Amazon S3, dont la première colonne est un ID client que le modèle ne doit pas recevoir. La sortie doit contenir l'ID client à côté de chaque score afin que le système de facturation puisse la charger directement. Toutes les données sont disponibles au début de l'exécution, les scores ne sont pas nécessaires en temps réel, et l'entreprise ne veut ni point de terminaison permanent ni tâches distinctes de prétraitement et de post-traitement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy the model to a SageMaker AI asynchronous endpoint, and have an AWS Glue job remove the ID column, submit each file with InvokeEndpointAsync and join the scores back to the IDs."
        fr: "Déployer le modèle sur un point de terminaison asynchrone SageMaker AI, et faire supprimer la colonne d'ID par une tâche AWS Glue, envoyer chaque fichier avec InvokeEndpointAsync et rattacher les scores aux ID."
    - id: b
      text:
        en: "Run a SageMaker AI batch transform job with SplitType and AssembleWith set to Line, an InputFilter that drops the first column, JoinSource set to Input, and an OutputFilter that keeps the ID and the score."
        fr: "Exécuter une tâche de transformation par lots SageMaker AI avec SplitType et AssembleWith à Line, un InputFilter qui retire la première colonne, JoinSource à Input et un OutputFilter qui conserve l'ID et le score."
    - id: c
      text:
        en: "Deploy the model to a SageMaker AI real-time endpoint for the duration of the run, and have an Amazon EMR job read the files, call the endpoint for each row without the ID and write the joined results."
        fr: "Déployer le modèle sur un point de terminaison en temps réel SageMaker AI pendant la durée de l'exécution, et faire lire les fichiers par une tâche Amazon EMR qui appelle le point de terminaison pour chaque ligne sans l'ID et écrit les résultats rattachés."
    - id: d
      text:
        en: "Run a SageMaker AI batch transform job with the default data processing settings, and run an Amazon Athena query afterward that joins the output files with the input files by row number."
        fr: "Exécuter une tâche de transformation par lots SageMaker AI avec les paramètres de traitement des données par défaut, puis exécuter une requête Amazon Athena qui rattache les fichiers de sortie aux fichiers d'entrée par numéro de ligne."
answer: { optionId: b }
explanation:
  correct:
    en: "Batch transform processes large datasets in S3 without a persistent endpoint. Its DataProcessing settings let the job send only selected attributes to the model with InputFilter, combine the input with the inference with JoinSource set to Input, and keep the ID and score with OutputFilter, so no separate preprocessing or postprocessing is needed. CSV input requires SplitType and AssembleWith set to Line."
    fr: "La transformation par lots traite de grands jeux de données dans S3 sans point de terminaison permanent. Ses paramètres DataProcessing permettent à la tâche de n'envoyer au modèle que les attributs choisis avec InputFilter, de combiner l'entrée et l'inférence avec JoinSource à Input et de conserver l'ID et le score avec OutputFilter : aucun prétraitement ni post-traitement distinct n'est nécessaire. Une entrée CSV exige SplitType et AssembleWith à Line."
  options:
    a:
      en: "An asynchronous endpoint is a persistent endpoint, and the Glue job is the separate preprocessing and postprocessing that the company wants to avoid."
      fr: "Un point de terminaison asynchrone est un point de terminaison permanent, et la tâche Glue constitue justement le prétraitement et le post-traitement distincts que l'entreprise veut éviter."
    c:
      en: "This adds an endpoint and an EMR job that preprocesses and joins the data, and 30 million individual calls are slower and costlier than one batch job."
      fr: "Cette solution ajoute un point de terminaison et une tâche EMR qui prétraite et rattache les données, et 30 millions d'appels individuels sont plus lents et plus coûteux qu'une seule tâche par lots."
    d:
      en: "With default settings, the model would receive the ID column and the output would contain only the inferences, so a separate join job would still be needed."
      fr: "Avec les paramètres par défaut, le modèle recevrait la colonne d'ID et la sortie ne contiendrait que les inférences : une tâche de rattachement distincte serait encore nécessaire."
references:
  - title: Associate Prediction Results with Input Records
    url: https://docs.aws.amazon.com/sagemaker/latest/dg/batch-transform-data-processing.html
