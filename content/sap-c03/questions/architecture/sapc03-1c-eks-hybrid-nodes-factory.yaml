id: sapc03-1c-eks-hybrid-nodes-factory
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A manufacturing company runs Kubernetes workloads on Amazon EKS in eu-west-1. It also wants to run latency-sensitive machine control containers on existing physical servers in its four factories. Each factory has redundant AWS Direct Connect connections to the VPC of the EKS cluster. The platform team wants to manage factory and cloud workloads through the same EKS cluster and APIs, and it does not want to install, upgrade or operate a Kubernetes control plane in the factories. The company wants to reuse its existing servers and pay only for the capacity it uses, without up-front commitments.

    Which solution will meet these requirements?
  fr: |
    Un industriel exécute des charges de travail Kubernetes sur Amazon EKS dans eu-west-1. Il veut aussi exécuter des conteneurs de pilotage de machines, sensibles à la latence, sur des serveurs physiques existants de ses quatre usines. Chaque usine dispose de connexions AWS Direct Connect redondantes vers le VPC du cluster EKS. L'équipe plateforme veut gérer les charges de travail des usines et du cloud avec le même cluster EKS et les mêmes API, et elle ne veut ni installer, ni mettre à niveau, ni exploiter de plan de contrôle Kubernetes dans les usines. L'entreprise veut réutiliser ses serveurs existants et ne payer que la capacité utilisée, sans engagement initial.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Install Amazon EKS Anywhere on the factory servers in a bare metal configuration, and run a separate Kubernetes cluster in each factory for the machine control workloads."
        fr: "Installer Amazon EKS Anywhere sur les serveurs des usines en configuration bare metal, et exécuter un cluster Kubernetes distinct dans chaque usine pour les charges de pilotage des machines."
    - id: b
      text:
        en: "Order an AWS Outposts rack for each factory, extend the cluster's VPC to the Outposts, and run the machine control workloads on EKS nodes on the Outposts racks."
        fr: "Commander un rack AWS Outposts pour chaque usine, étendre le VPC du cluster aux Outposts, et exécuter les charges de pilotage des machines sur des nœuds EKS des racks Outposts."
    - id: c
      text:
        en: "Join the factory servers to the existing EKS cluster as Amazon EKS Hybrid Nodes, with the factory node and pod networks routed to the cluster VPC over Direct Connect."
        fr: "Joindre les serveurs des usines au cluster EKS existant en tant qu'Amazon EKS Hybrid Nodes, avec les réseaux de nœuds et de pods des usines routés vers le VPC du cluster par Direct Connect."
    - id: d
      text:
        en: "Register the factory servers as Amazon ECS Anywhere external instances, and run the machine control containers as ECS services with the EXTERNAL launch type."
        fr: "Enregistrer les serveurs des usines comme instances externes Amazon ECS Anywhere, et exécuter les conteneurs de pilotage des machines comme services ECS avec le type de lancement EXTERNAL."
answer: { optionId: c }
explanation:
  correct:
    en: |-
      With EKS Hybrid Nodes, AWS manages the Kubernetes control plane of the EKS cluster in the Region, and on-premises servers join that cluster as nodes. The feature needs a reliable connection to AWS, which the redundant Direct Connect links provide, and it is billed per vCPU-hour while the nodes are attached, with no up-front commitment.
    fr: |-
      Avec EKS Hybrid Nodes, AWS gère le plan de contrôle Kubernetes du cluster EKS dans la Région, et les serveurs sur site rejoignent ce cluster comme nœuds. La fonctionnalité exige une connexion fiable à AWS, que fournissent les liaisons Direct Connect redondantes, et elle est facturée par heure de vCPU tant que les nœuds sont attachés, sans engagement initial.
  options:
    a:
      en: |-
        EKS Anywhere runs whole clusters, control plane included, on infrastructure that the customer manages, and the team would manage separate clusters instead of one EKS cluster.
      fr: |-
        EKS Anywhere exécute des clusters complets, plan de contrôle compris, sur une infrastructure gérée par le client, et l'équipe gérerait des clusters distincts au lieu d'un seul cluster EKS.
    b:
      en: |-
        Outposts racks are new AWS hardware ordered with a term commitment; they do not reuse the existing servers.
      fr: |-
        Les racks Outposts sont du nouveau matériel AWS commandé avec un engagement de durée ; ils ne réutilisent pas les serveurs existants.
    d:
      en: |-
        ECS Anywhere runs ECS tasks, not Kubernetes workloads, so the team could not use the same EKS cluster and APIs.
      fr: |-
        ECS Anywhere exécute des tâches ECS, pas des charges de travail Kubernetes : l'équipe ne pourrait pas utiliser le même cluster EKS ni les mêmes API.
references:
  - title: Amazon EKS Hybrid Nodes overview - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/hybrid-nodes-overview.html
