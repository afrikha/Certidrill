id: sapc03-2a-outbound-identity-federation
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs AWS Lambda functions and Amazon ECS tasks that call two external services: a partner's SaaS API and a Google Cloud service. Both external services accept JSON Web Tokens (JWTs) from a trusted OpenID Connect (OIDC) issuer through workload identity federation. Today, the workloads use long-lived API keys and a service account key that are stored in AWS Secrets Manager. The security team wants to remove these secrets, use tokens that expire within minutes, control which IAM roles can get tokens and for which audience, and audit every token request in AWS CloudTrail. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des fonctions AWS Lambda et des tâches Amazon ECS qui appellent deux services externes : l'API SaaS d'un partenaire et un service Google Cloud. Les deux services externes acceptent des jetons web JSON (JWT) d'un émetteur OpenID Connect (OIDC) approuvé par fédération d'identités de charge de travail. Aujourd'hui, les charges de travail utilisent des clés d'API à longue durée de vie et une clé de compte de service stockées dans AWS Secrets Manager. L'équipe de sécurité veut supprimer ces secrets, utiliser des jetons qui expirent en quelques minutes, contrôler quels rôles IAM peuvent obtenir des jetons et pour quelle audience, et auditer chaque demande de jeton dans AWS CloudTrail. L'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon Cognito user pool app client with the client credentials grant for each workload, and register the user pool as a trusted issuer in both external services."
        fr: "Créer pour chaque charge de travail un client d'application de groupe d'utilisateurs Amazon Cognito avec l'octroi client credentials, et enregistrer le groupe d'utilisateurs comme émetteur approuvé dans les deux services externes."
    - id: b
      text:
        en: "Create an IAM Roles Anywhere trust anchor and profile for the external services, and have the external services obtain credentials for the workloads' IAM roles."
        fr: "Créer une ancre de confiance et un profil IAM Roles Anywhere pour les services externes, et faire obtenir par les services externes des informations d'identification pour les rôles IAM des charges de travail."
    - id: c
      text:
        en: "Enable IAM outbound identity federation, register the account's issuer URL in both external services, and allow sts:GetWebIdentityToken to the workload roles with conditions on audience and duration."
        fr: "Activer la fédération d'identités sortante d'IAM, enregistrer l'URL d'émetteur du compte dans les deux services externes, et autoriser sts:GetWebIdentityToken pour les rôles des charges de travail avec des conditions sur l'audience et la durée."
    - id: d
      text:
        en: "Create an asymmetric AWS KMS signing key, have each workload build and sign its own JWTs with kms:Sign, and publish the public key as a JSON Web Key Set in a public S3 bucket."
        fr: "Créer une clé de signature AWS KMS asymétrique, faire construire et signer par chaque charge de travail ses propres JWT avec kms:Sign, et publier la clé publique comme jeu de clés web JSON dans un compartiment S3 public."
answer: { optionId: c }
explanation:
  correct:
    en: "IAM outbound identity federation lets AWS workloads call GetWebIdentityToken to obtain short-lived JWTs signed by AWS STS that external services verify through the account's OIDC discovery endpoint. IAM policies can restrict token requests with sts:IdentityTokenAudience and sts:DurationSeconds, token lifetimes range from 60 to 3,600 seconds, and every request is logged in CloudTrail."
    fr: "La fédération d'identités sortante d'IAM permet aux charges de travail AWS d'appeler GetWebIdentityToken pour obtenir des JWT de courte durée signés par AWS STS, que les services externes vérifient via le point de terminaison de découverte OIDC du compte. Les politiques IAM peuvent restreindre les demandes de jetons avec sts:IdentityTokenAudience et sts:DurationSeconds, la durée de vie des jetons va de 60 à 3 600 secondes, et chaque demande est journalisée dans CloudTrail."
  options:
    a:
      en: "The client credentials grant requires a client secret for each workload, which is another long-lived secret to store and rotate."
      fr: "L'octroi client credentials exige un secret client pour chaque charge de travail, soit un autre secret à longue durée de vie à stocker et à renouveler."
    b:
      en: "IAM Roles Anywhere gives AWS credentials to workloads outside AWS; it does not give AWS workloads tokens for external services."
      fr: "IAM Roles Anywhere fournit des informations d'identification AWS à des charges de travail hors d'AWS ; il ne fournit pas aux charges de travail AWS des jetons pour des services externes."
    d:
      en: "Building and signing tokens in every workload and hosting the key set is custom code and infrastructure that the managed feature already provides."
      fr: "Construire et signer des jetons dans chaque charge de travail et héberger le jeu de clés représente du code et une infrastructure personnalisés que la fonctionnalité gérée fournit déjà."
references:
  - title: Federating AWS identities to external services
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound.html
  - title: Getting started with outbound identity federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_outbound_getting_started.html
