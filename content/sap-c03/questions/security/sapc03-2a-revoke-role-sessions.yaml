id: sapc03-2a-revoke-role-sessions
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's data operations team federates from a SAML 2.0 identity provider directly into an IAM role named DataOps, with a session duration of 12 hours. A developer's laptop was compromised, and the attacker copied temporary credentials of a DataOps session that remain valid for 8 more hours. The security team must make the stolen credentials useless immediately. The other members of the team must be able to continue working after they sign in again, and the role and its policies must stay in place for the investigation.

    Which solution will meet these requirements?
  fr: |
    L'équipe d'exploitation des données d'AnyCompany se fédère depuis un fournisseur d'identité SAML 2.0 directement dans un rôle IAM nommé DataOps, avec une durée de session de 12 heures. L'ordinateur portable d'un développeur a été compromis, et l'attaquant a copié des informations d'identification temporaires d'une session DataOps qui restent valides 8 heures de plus. L'équipe de sécurité doit rendre les informations d'identification volées inutilisables immédiatement. Les autres membres de l'équipe doivent pouvoir continuer à travailler après s'être reconnectés, et le rôle et ses politiques doivent rester en place pour l'enquête.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Revoke the active sessions of the DataOps role so that IAM attaches a policy that denies all actions to sessions issued before now, and have the team members sign in again."
        fr: "Révoquer les sessions actives du rôle DataOps pour qu'IAM attache une politique qui refuse toutes les actions aux sessions émises avant maintenant, et demander aux membres de l'équipe de se reconnecter."
    - id: b
      text:
        en: "Delete the DataOps role, recreate a role with the same name, trust policy and permissions, and have the team members sign in again."
        fr: "Supprimer le rôle DataOps, recréer un rôle de même nom, avec la même politique d'approbation et les mêmes autorisations, et demander aux membres de l'équipe de se reconnecter."
    - id: c
      text:
        en: "Replace the signing certificate of the SAML identity provider, upload the new metadata to the IAM SAML identity provider in the account, and have the team sign in again."
        fr: "Remplacer le certificat de signature du fournisseur d'identité SAML, charger les nouvelles métadonnées dans le fournisseur d'identité SAML IAM du compte, et faire reconnecter l'équipe."
    - id: d
      text:
        en: "Reduce the maximum session duration of the DataOps role from 12 hours to 1 hour so that every existing DataOps session expires within the next hour."
        fr: "Réduire de 12 heures à 1 heure la durée de session maximale du rôle DataOps pour que toutes les sessions DataOps existantes expirent dans l'heure."
answer: { optionId: a }
explanation:
  correct:
    en: "Revoking active sessions attaches the AWSRevokeOlderSessions inline policy, which denies every action to credentials of the role that were issued before the revocation time, based on aws:TokenIssueTime. Sessions created afterward are not affected, so team members continue after they get new credentials, and the role stays available for the investigation."
    fr: "La révocation des sessions actives attache la politique en ligne AWSRevokeOlderSessions, qui refuse toutes les actions aux informations d'identification du rôle émises avant l'heure de révocation, d'après aws:TokenIssueTime. Les sessions créées ensuite ne sont pas affectées : les membres de l'équipe continuent après avoir obtenu de nouvelles informations d'identification, et le rôle reste disponible pour l'enquête."
  options:
    b:
      en: "Deleting the role removes the role and its policies that the investigation needs, and breaks every reference to it during the change."
      fr: "Supprimer le rôle fait disparaître le rôle et ses politiques dont l'enquête a besoin, et casse toutes les références au rôle pendant l'opération."
    c:
      en: "Temporary credentials that AWS STS has already issued stay valid until they expire; changing the SAML certificate affects only new federations."
      fr: "Les informations d'identification temporaires déjà émises par AWS STS restent valides jusqu'à leur expiration ; changer le certificat SAML n'affecte que les nouvelles fédérations."
    d:
      en: "The maximum session duration applies to new sessions; it does not shorten credentials that were already issued."
      fr: "La durée de session maximale s'applique aux nouvelles sessions ; elle ne raccourcit pas les informations d'identification déjà émises."
references:
  - title: Revoke IAM role temporary security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
