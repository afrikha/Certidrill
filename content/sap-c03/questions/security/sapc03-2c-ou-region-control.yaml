id: sapc03-2c-ou-region-control
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A multinational company uses an AWS Control Tower landing zone with us-east-1 as the home Region and eight governed Regions. The company is creating a Regulated-EU OU for a subsidiary that falls under a European regulation. Workloads in this OU must be limited to eu-west-1 and eu-central-1, apart from the global services that AWS exempts. All other OUs must keep access to all eight governed Regions. The company wants a preventive control that it does not have to write or maintain itself.

    Which solution will meet these requirements?
  fr: |
    Une entreprise multinationale utilise une zone d'atterrissage AWS Control Tower avec us-east-1 comme Région d'origine et huit Régions gouvernées. L'entreprise crée une OU Regulated-EU pour une filiale soumise à une réglementation européenne. Les charges de travail de cette OU doivent être limitées à eu-west-1 et eu-central-1, en dehors des services globaux qu'AWS exempte. Toutes les autres OU doivent conserver l'accès aux huit Régions gouvernées. L'entreprise veut un contrôle préventif qu'elle n'a pas à écrire ni à maintenir elle-même.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In the landing zone settings, turn on the Region deny control and keep only eu-west-1 and eu-central-1 as allowed Regions."
        fr: "Dans les paramètres de la zone d'atterrissage, activer le contrôle Region deny et ne conserver que eu-west-1 et eu-central-1 comme Régions autorisées."
    - id: b
      text:
        en: "Enable the OU-level Region deny control CT.MULTISERVICE.PV.1 on the Regulated-EU OU, with eu-west-1 and eu-central-1 as the allowed Regions."
        fr: "Activer le contrôle Region deny de niveau OU CT.MULTISERVICE.PV.1 sur l'OU Regulated-EU, avec eu-west-1 et eu-central-1 comme Régions autorisées."
    - id: c
      text:
        en: "Enable the data residency control that disallows cross-Region networking for Amazon EC2, Amazon CloudFront, and AWS Global Accelerator on the Regulated-EU OU."
        fr: "Activer sur l'OU Regulated-EU le contrôle de résidence des données qui interdit le réseau entre Régions pour Amazon EC2, Amazon CloudFront et AWS Global Accelerator."
    - id: d
      text:
        en: "Attach an IAM permissions boundary to every role and user in the accounts of the Regulated-EU OU that denies actions outside eu-west-1 and eu-central-1."
        fr: "Attacher à chaque rôle et utilisateur des comptes de l'OU Regulated-EU une limite d'autorisations IAM qui refuse les actions hors d'eu-west-1 et eu-central-1."
answer: { optionId: b }
explanation:
  correct:
    en: "Control Tower offers two Region deny controls: AWS-GR_REGION_DENY applies to the whole landing zone, while CT.MULTISERVICE.PV.1 can be applied to the OUs that you choose with the Regions you allow. Enabling the OU-level control on Regulated-EU restricts only that OU, and its managed SCP exempts global services such as IAM and AWS Organizations."
    fr: "Control Tower propose deux contrôles Region deny : AWS-GR_REGION_DENY s'applique à toute la zone d'atterrissage, tandis que CT.MULTISERVICE.PV.1 peut être appliqué aux OU de votre choix avec les Régions que vous autorisez. Activer le contrôle de niveau OU sur Regulated-EU ne restreint que cette OU, et sa SCP gérée exempte les services globaux comme IAM et AWS Organizations."
  options:
    a:
      en: "The landing zone control applies to all top-level OUs and their children and cannot be configured per OU; it also cannot deny the home Region."
      fr: "Le contrôle de la zone d'atterrissage s'applique à toutes les OU de premier niveau et à leurs enfants et ne peut pas être configuré par OU ; il ne peut pas non plus refuser la Région d'origine."
    c:
      en: "This control blocks peering, CloudFront, and Global Accelerator connections; it does not stop workloads from being deployed in other Regions."
      fr: "Ce contrôle bloque les connexions de peering, CloudFront et Global Accelerator ; il n'empêche pas de déployer des charges de travail dans d'autres Régions."
    d:
      en: "Permissions boundaries must be written and attached to every principal, including new ones, and account administrators can create principals without them."
      fr: "Les limites d'autorisations doivent être écrites et attachées à chaque principal, y compris aux nouveaux, et les administrateurs des comptes peuvent créer des principaux sans elles."
references:
  - title: Configure the Region deny control
    url: https://docs.aws.amazon.com/controltower/latest/userguide/region-deny.html
