id: sapc03-2b-private-ca-mldsa-hierarchy
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's internal services authenticate each other with mutual TLS certificates issued by an AWS Private CA hierarchy that uses RSA_4096 keys. The root certificate is valid for 20 more years. The security team wants to start migrating service certificates to post-quantum signatures. During the migration, which will last several years, services that trust only the RSA root must keep working, and upgraded services must be able to use ML-DSA certificates.

    Which solution will meet these requirements?
  fr: |
    Les services internes d'AnyCompany s'authentifient mutuellement avec des certificats TLS mutuel émis par une hiérarchie AWS Private CA qui utilise des clés RSA_4096. Le certificat racine est encore valide 20 ans. L'équipe de sécurité veut commencer à faire migrer les certificats de service vers des signatures post-quantiques. Pendant la migration, qui durera plusieurs années, les services qui n'approuvent que la racine RSA doivent continuer de fonctionner, et les services mis à niveau doivent pouvoir utiliser des certificats ML-DSA.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the key algorithm of the existing root CA to ML_DSA_65 so that all future certificates in the hierarchy carry ML-DSA signatures from the same root.", fr: "Remplacer l'algorithme de clé de la CA racine existante par ML_DSA_65 afin que tous les futurs certificats de la hiérarchie portent des signatures ML-DSA de la même racine." } }
    - { id: b, text: { en: "Keep the existing RSA subordinate CA, and issue the certificates of the upgraded services from it with the ML_DSA_65 signing algorithm.", fr: "Conserver la CA subordonnée RSA existante, et émettre à partir d'elle les certificats des services mis à niveau avec l'algorithme de signature ML_DSA_65." } }
    - { id: c, text: { en: "Request public ACM certificates with ML-DSA keys for the upgraded services, and attach them to the load balancers in front of those services.", fr: "Demander des certificats ACM publics avec des clés ML-DSA pour les services mis à niveau, et les attacher aux équilibreurs de charge placés devant ces services." } }
    - { id: d, text: { en: "Create a new root CA and subordinate CA with ML_DSA_65 keys alongside the RSA hierarchy, and add the new root to the trust stores of the upgraded services.", fr: "Créer une nouvelle CA racine et une CA subordonnée avec des clés ML_DSA_65 en parallèle de la hiérarchie RSA, et ajouter la nouvelle racine aux magasins d'approbations des services mis à niveau." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Private CA supports ML_DSA_44, ML_DSA_65, and ML_DSA_87 for CA keys, and for ML-DSA the same value is used as key algorithm and signing algorithm, so ML-DSA certificates need an ML-DSA CA. A parallel ML-DSA hierarchy lets upgraded services trust both roots while services that trust only the RSA root keep working with RSA certificates."
    fr: "AWS Private CA prend en charge ML_DSA_44, ML_DSA_65 et ML_DSA_87 pour les clés de CA, et pour ML-DSA la même valeur sert d'algorithme de clé et d'algorithme de signature : des certificats ML-DSA exigent une CA ML-DSA. Une hiérarchie ML-DSA parallèle permet aux services mis à niveau d'approuver les deux racines tandis que ceux qui n'approuvent que la racine RSA continuent avec des certificats RSA."
  options:
    a:
      en: "The key algorithm of a CA is set when the CA is created, and changing the root would break every service that trusts only the RSA root."
      fr: "L'algorithme de clé d'une CA est fixé à sa création, et changer la racine casserait tous les services qui n'approuvent que la racine RSA."
    b:
      en: "A CA signs with its own private key: an RSA CA must use an RSA signing algorithm and cannot produce ML-DSA signatures."
      fr: "Une CA signe avec sa propre clé privée : une CA RSA doit utiliser un algorithme de signature RSA et ne peut pas produire de signatures ML-DSA."
    c:
      en: "Public certificates are not suitable for internal mutual TLS identities, and ACM certificates for load balancers use RSA or ECDSA keys."
      fr: "Les certificats publics ne conviennent pas aux identités internes de TLS mutuel, et les certificats ACM des équilibreurs de charge utilisent des clés RSA ou ECDSA."
references:
  - title: What is AWS Private CA?
    url: https://docs.aws.amazon.com/privateca/latest/userguide/PcaWelcome.html
