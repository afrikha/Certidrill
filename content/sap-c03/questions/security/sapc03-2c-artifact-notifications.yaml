id: sapc03-2c-artifact-notifications
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The compliance team of a bank maintains an evidence library that must always reference the latest AWS compliance reports and agreements. Today, an analyst checks AWS Artifact manually every week, and an outdated report was recently sent to the regulator. The team wants its members to receive an email automatically when AWS Artifact reports or agreements are updated. The bank operates in commercial AWS Regions and wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'équipe de conformité d'une banque gère une bibliothèque de preuves qui doit toujours faire référence aux derniers rapports et accords de conformité AWS. Aujourd'hui, un analyste consulte manuellement AWS Artifact chaque semaine, et un rapport obsolète a récemment été envoyé au régulateur. L'équipe veut que ses membres reçoivent automatiquement un e-mail lorsque des rapports ou des accords AWS Artifact sont mis à jour. La banque opère dans des Régions AWS commerciales et veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write a Lambda function that runs weekly, lists the AWS Artifact reports and their versions, compares them with the previous run, and emails the changes through Amazon SNS."
        fr: "Écrire une fonction Lambda qui s'exécute chaque semaine, liste les rapports AWS Artifact et leurs versions, les compare à l'exécution précédente et envoie les changements par e-mail avec Amazon SNS."
    - id: b
      text:
        en: "Enable AWS Audit Manager in the compliance account, and subscribe the team to Audit Manager notifications about changes in the AWS Artifact reports."
        fr: "Activer AWS Audit Manager dans le compte de conformité, et abonner l'équipe aux notifications d'Audit Manager sur les changements des rapports AWS Artifact."
    - id: c
      text:
        en: "Create an AWS Artifact notification configuration with the team's email addresses, and let AWS Artifact create the AWS User Notifications hubs that it needs when the first notification is sent."
        fr: "Créer une configuration de notification AWS Artifact avec les adresses e-mail de l'équipe, et laisser AWS Artifact créer les hubs AWS User Notifications nécessaires lors de l'envoi de la première notification."
    - id: d
      text:
        en: "Set up notification hubs in AWS User Notifications, then create an AWS Artifact notification configuration that sends report and agreement updates to the team's email addresses."
        fr: "Configurer des hubs de notification dans AWS User Notifications, puis créer une configuration de notification AWS Artifact qui envoie les mises à jour de rapports et d'accords aux adresses e-mail de l'équipe."
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Artifact can send email notifications about updates to agreements and reports. It delivers them through AWS User Notifications, so notification hubs must be set up in User Notifications before the AWS Artifact notification configuration that defines the recipients and the notifications they receive."
    fr: "AWS Artifact peut envoyer des notifications par e-mail sur les mises à jour des accords et des rapports. Il les envoie par AWS User Notifications : des hubs de notification doivent donc être configurés dans User Notifications avant la configuration de notification AWS Artifact qui définit les destinataires et les notifications qu'ils reçoivent."
  options:
    a:
      en: "A custom function must be written and maintained, and it only detects changes weekly, while AWS Artifact can send these notifications natively."
      fr: "Une fonction personnalisée doit être écrite et maintenue, et elle ne détecte les changements qu'une fois par semaine, alors qu'AWS Artifact peut envoyer ces notifications nativement."
    b:
      en: "AWS Audit Manager is no longer open to new customers, and it does not notify about updates to AWS Artifact reports."
      fr: "AWS Audit Manager n'est plus ouvert aux nouveaux clients, et il n'envoie pas de notification sur les mises à jour des rapports AWS Artifact."
    c:
      en: "Notification hubs are a prerequisite: they must be set up in User Notifications before the AWS Artifact notification configuration is created."
      fr: "Les hubs de notification sont un prérequis : ils doivent être configurés dans User Notifications avant la création de la configuration de notification AWS Artifact."
references:
  - title: Configuring email notifications in AWS Artifact
    url: https://docs.aws.amazon.com/artifact/latest/ug/managing-notifications.html
