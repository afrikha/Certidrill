id: sapc03-2d-agentcore-session-isolation
objective: "2.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A consulting firm is building a data analysis agent that consultants use to upload client spreadsheets and ask questions about them. The agent writes and runs code on the uploaded files during a conversation. Thousands of consultants from different client engagements use the agent at the same time. The firm's risk committee requires that one user's conversation can never access the memory, processes or files of another user's conversation, and that all session data is removed when a conversation ends. The firm wants a managed agent hosting service with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un cabinet de conseil construit un agent d'analyse de données auquel les consultants chargent des tableurs de clients avant de poser des questions à leur sujet. L'agent écrit et exécute du code sur les fichiers chargés au cours d'une conversation. Des milliers de consultants de missions clientes différentes utilisent l'agent en même temps. Le comité des risques du cabinet exige que la conversation d'un utilisateur ne puisse jamais accéder à la mémoire, aux processus ou aux fichiers de la conversation d'un autre utilisateur, et que toutes les données de session soient supprimées à la fin d'une conversation. Le cabinet veut un service géré d'hébergement d'agents avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Host the agent on Amazon Bedrock AgentCore Runtime, and invoke it with a unique runtime session ID for each user conversation.", fr: "Héberger l'agent sur Amazon Bedrock AgentCore Runtime, et l'appeler avec un ID de session de runtime unique pour chaque conversation utilisateur." }
    - id: b
      text: { en: "Run the agent as an Amazon ECS service on AWS Fargate behind a load balancer, and give each conversation its own temporary directory inside the shared tasks.", fr: "Exécuter l'agent comme service Amazon ECS sur AWS Fargate derrière un équilibreur de charge, et donner à chaque conversation son propre répertoire temporaire dans les tâches partagées." }
    - id: c
      text: { en: "Run the agent as an AWS Lambda function, store each conversation's files in the function's /tmp directory, and delete them at the end of each invocation.", fr: "Exécuter l'agent comme fonction AWS Lambda, stocker les fichiers de chaque conversation dans le répertoire /tmp de la fonction et les supprimer à la fin de chaque appel." }
    - id: d
      text: { en: "Launch a dedicated Amazon EC2 instance from a hardened AMI for each conversation with an Auto Scaling group, and terminate the instance when the conversation ends.", fr: "Lancer une instance Amazon EC2 dédiée à partir d'une AMI renforcée pour chaque conversation avec un groupe Auto Scaling, et résilier l'instance à la fin de la conversation." }
answer: { optionId: a }
explanation:
  correct:
    en: "AgentCore Runtime runs each session in its own microVM with isolated compute, memory and filesystem, so one session cannot reach another's data. When the session ends, the microVM is terminated and its memory sanitized, and using a unique session ID per conversation maps each conversation to its own session."
    fr: "AgentCore Runtime exécute chaque session dans sa propre microVM avec calcul, mémoire et système de fichiers isolés : une session ne peut pas atteindre les données d'une autre. À la fin de la session, la microVM est arrêtée et sa mémoire nettoyée, et un ID de session unique par conversation associe chaque conversation à sa propre session."
  options:
    b:
      en: "Conversations share the same tasks, so their processes and memory are separated only by application code, which does not meet the isolation requirement."
      fr: "Les conversations partagent les mêmes tâches : leurs processus et leur mémoire ne sont séparés que par le code applicatif, ce qui ne répond pas à l'exigence d'isolation."
    c:
      en: "Lambda reuses execution environments across invocations, so code run for one user can leave memory or /tmp content that a later invocation for another user can reach."
      fr: "Lambda réutilise les environnements d'exécution d'un appel à l'autre : du code exécuté pour un utilisateur peut laisser en mémoire ou dans /tmp un contenu accessible à un appel ultérieur pour un autre utilisateur."
    d:
      en: "An instance per conversation isolates sessions but means managing AMIs, patching, scaling and start-up delays for thousands of conversations, which is not the least operational overhead."
      fr: "Une instance par conversation isole les sessions mais impose de gérer les AMI, les correctifs, la mise à l'échelle et les délais de démarrage pour des milliers de conversations : ce n'est pas la solution la moins coûteuse en exploitation."
references:
  - title: Use isolated sessions for agents
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-sessions.html
