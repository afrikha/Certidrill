id: sapc03-2b-scp-allow-list-fullaccess
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany wants accounts in its Sandbox OU to use only Amazon EC2, Amazon S3, AWS Lambda, Amazon CloudWatch, and IAM. The security team created an SCP that allows only these services and attached it to the Sandbox OU. The FullAWSAccess policy remains attached to the organization root, to the Sandbox OU, and to every account. Testing shows that Sandbox users can still create Amazon RDS databases. Accounts in the other OUs must keep their current access.

    Which change will enforce the service allow list for the Sandbox OU?
  fr: |
    AnyCompany veut que les comptes de son OU Sandbox n'utilisent qu'Amazon EC2, Amazon S3, AWS Lambda, Amazon CloudWatch et IAM. L'équipe de sécurité a créé une SCP qui n'autorise que ces services et l'a attachée à l'OU Sandbox. La politique FullAWSAccess reste attachée à la racine de l'organisation, à l'OU Sandbox et à chaque compte. Les tests montrent que les utilisateurs Sandbox peuvent encore créer des bases de données Amazon RDS. Les comptes des autres OU doivent conserver leur accès actuel.

    Quelle modification appliquera la liste d'autorisation de services à l'OU Sandbox ?
body:
  options:
    - { id: a, text: { en: "Detach FullAWSAccess from the organization root so that the allow list at the Sandbox OU becomes the only Allow statement in the path.", fr: "Détacher FullAWSAccess de la racine de l'organisation afin que la liste d'autorisation de l'OU Sandbox devienne la seule instruction Allow du chemin." } }
    - { id: b, text: { en: "Detach FullAWSAccess from the Sandbox OU so that the allow list is the only SCP that allows actions at that level of the hierarchy.", fr: "Détacher FullAWSAccess de l'OU Sandbox afin que la liste d'autorisation soit la seule SCP qui autorise des actions à ce niveau de la hiérarchie." } }
    - { id: c, text: { en: "Detach FullAWSAccess from every Sandbox account, and keep it attached to the Sandbox OU together with the allow list.", fr: "Détacher FullAWSAccess de chaque compte Sandbox, et la laisser attachée à l'OU Sandbox avec la liste d'autorisation." } }
    - { id: d, text: { en: "Attach the allow-list SCP to every Sandbox account in addition to the OU, and keep FullAWSAccess attached at every level.", fr: "Attacher la SCP de liste d'autorisation à chaque compte Sandbox en plus de l'OU, et laisser FullAWSAccess attachée à tous les niveaux." } }
answer: { optionId: b }
explanation:
  correct:
    en: "An action is allowed only if an SCP at every level, from the root through each OU to the account, allows it, and the SCPs attached at the same level act as a combined set. While FullAWSAccess stays on the Sandbox OU, that level allows everything; once it is removed, the allow list limits the Sandbox accounts, and the root and account levels still allow all."
    fr: "Une action n'est autorisée que si une SCP l'autorise à chaque niveau, de la racine au compte en passant par chaque OU, et les SCP attachées à un même niveau forment un ensemble combiné. Tant que FullAWSAccess reste sur l'OU Sandbox, ce niveau autorise tout ; une fois retirée, la liste d'autorisation limite les comptes Sandbox, tandis que les niveaux racine et compte autorisent toujours tout."
  options:
    a:
      en: "Without an Allow at the root, every account in every OU loses all permissions, which breaks the other OUs."
      fr: "Sans Allow à la racine, chaque compte de chaque OU perd toutes ses autorisations, ce qui casse les autres OU."
    c:
      en: "FullAWSAccess at the OU still allows everything at that level, and accounts without any allowing SCP would lose all permissions."
      fr: "FullAWSAccess sur l'OU autorise toujours tout à ce niveau, et des comptes sans aucune SCP d'autorisation perdraient toutes leurs autorisations."
    d:
      en: "At each level, FullAWSAccess combined with the allow list still allows every service, so nothing changes."
      fr: "À chaque niveau, FullAWSAccess combinée à la liste d'autorisation autorise toujours tous les services : rien ne change."
references:
  - title: SCP evaluation
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_evaluation.html
