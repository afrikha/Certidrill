id: sapc03-2a-kms-single-to-multi-region
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany encrypts records on the client side with the AWS Encryption SDK before it writes them to Amazon S3 in us-east-1. The data keys are protected by a single-Region customer managed AWS KMS key in us-east-1, and S3 Cross-Region Replication copies the objects to eu-west-1. A new disaster recovery plan requires that the application in eu-west-1 be able to decrypt every record during an outage of us-east-1, without any call to AWS KMS in us-east-1.

    Which solution will meet these requirements?
  fr: |
    AnyCompany chiffre des enregistrements côté client avec l'AWS Encryption SDK avant de les écrire dans Amazon S3 dans us-east-1. Les clés de données sont protégées par une clé AWS KMS gérée par le client à Région unique dans us-east-1, et S3 Cross-Region Replication copie les objets dans eu-west-1. Un nouveau plan de reprise après sinistre exige que l'application d'eu-west-1 puisse déchiffrer tous les enregistrements pendant une panne d'us-east-1, sans aucun appel à AWS KMS dans us-east-1.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Convert the existing key to a multi-Region key, replicate it to eu-west-1, and configure the application in eu-west-1 to use the replica key."
        fr: "Convertir la clé existante en clé multi-Régions, la répliquer dans eu-west-1, et configurer l'application d'eu-west-1 pour qu'elle utilise la clé réplica."
    - id: b
      text:
        en: "Create a grant on the existing key for the application role in eu-west-1, and have the application call AWS KMS through an interface VPC endpoint in eu-west-1."
        fr: "Créer un octroi sur la clé existante pour le rôle de l'application d'eu-west-1, et faire appeler AWS KMS par l'application via un point de terminaison de VPC d'interface dans eu-west-1."
    - id: c
      text:
        en: "Export the key material of the existing key, import it into a new key in eu-west-1, and configure the application in eu-west-1 to use the new key."
        fr: "Exporter le matériel de clé de la clé existante, l'importer dans une nouvelle clé d'eu-west-1, et configurer l'application d'eu-west-1 pour qu'elle utilise la nouvelle clé."
    - id: d
      text:
        en: "Create a multi-Region primary key in us-east-1 with a replica in eu-west-1, re-encrypt the existing records under the new key, and use the replica in eu-west-1."
        fr: "Créer une clé principale multi-Régions dans us-east-1 avec un réplica dans eu-west-1, rechiffrer les enregistrements existants avec la nouvelle clé, et utiliser le réplica dans eu-west-1."
answer: { optionId: d }
explanation:
  correct:
    en: "Related multi-Region keys share key material and key ID, so ciphertext produced with the primary key can be decrypted with the replica in another Region without a cross-Region call. The multi-Region property cannot be added to an existing key, so the existing data must be re-encrypted under a new multi-Region key."
    fr: "Des clés multi-Régions associées partagent le matériel et l'ID de clé : un texte chiffré produit avec la clé principale peut être déchiffré avec le réplica d'une autre Région sans appel interrégional. La propriété multi-Régions ne peut pas être ajoutée à une clé existante : les données existantes doivent donc être rechiffrées avec une nouvelle clé multi-Régions."
  options:
    a:
      en: "A single-Region key cannot be converted to a multi-Region key; the property can only be chosen when the key is created."
      fr: "Une clé à Région unique ne peut pas être convertie en clé multi-Régions ; cette propriété ne se choisit qu'à la création de la clé."
    b:
      en: "A grant gives permissions on the key, but the key still exists only in us-east-1, so decryption depends on that Region."
      fr: "Un octroi donne des autorisations sur la clé, mais la clé n'existe toujours que dans us-east-1 : le déchiffrement dépend de cette Région."
    c:
      en: "Key material that AWS KMS generates never leaves AWS KMS unencrypted and cannot be exported."
      fr: "Le matériel de clé généré par AWS KMS ne quitte jamais AWS KMS en clair et ne peut pas être exporté."
references:
  - title: Multi-Region keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
