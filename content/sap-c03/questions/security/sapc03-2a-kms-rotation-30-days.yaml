id: sapc03-2a-kms-rotation-30-days
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's payment application encrypts records with data keys that it requests from AWS KMS through the alias alias/payments-records, and it stores the encrypted data key with each record. The application calls Decrypt without specifying a key ID. The key is a symmetric customer managed key with key material generated by AWS KMS. A new internal standard requires the key used for new encryption to change every 30 days, for as long as the application runs. Records encrypted in earlier periods must remain decryptable, and the application must not be changed.

    Which solution will meet these requirements?
  fr: |
    L'application de paiement d'AnyCompany chiffre des enregistrements avec des clés de données qu'elle demande à AWS KMS via l'alias alias/payments-records, et elle stocke la clé de données chiffrée avec chaque enregistrement. L'application appelle Decrypt sans indiquer d'ID de clé. La clé est une clé symétrique gérée par le client dont le matériel est généré par AWS KMS. Une nouvelle norme interne exige que la clé utilisée pour les nouveaux chiffrements change tous les 30 jours, aussi longtemps que l'application fonctionne. Les enregistrements chiffrés lors des périodes précédentes doivent rester déchiffrables, et l'application ne doit pas être modifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Every 30 days, have a job create a new symmetric KMS key, point alias/payments-records to it, and keep the previous keys enabled for decryption."
        fr: "Tous les 30 jours, faire créer par une tâche une nouvelle clé KMS symétrique, faire pointer alias/payments-records vers elle, et conserver les clés précédentes activées pour le déchiffrement."
    - id: b
      text:
        en: "Enable automatic rotation on the existing key, and set its rotation period to 30 days with the RotationPeriodInDays parameter."
        fr: "Activer la rotation automatique de la clé existante, et définir sa période de rotation à 30 jours avec le paramètre RotationPeriodInDays."
    - id: c
      text:
        en: "Create an Amazon EventBridge Scheduler schedule that calls RotateKeyOnDemand on the existing key every 30 days, for as long as the application runs."
        fr: "Créer une planification Amazon EventBridge Scheduler qui appelle RotateKeyOnDemand sur la clé existante tous les 30 jours, aussi longtemps que l'application fonctionne."
    - id: d
      text:
        en: "Replace the key with a key that uses imported key material, and import new material with a 30-day expiration date at the start of each period."
        fr: "Remplacer la clé par une clé à matériel de clé importé, et importer au début de chaque période un nouveau matériel avec une date d'expiration de 30 jours."
answer: { optionId: a }
explanation:
  correct:
    en: "Automatic rotation accepts periods from 90 to 2,560 days and on-demand rotation is limited to 25 rotations per key, so neither supports a 30-day cycle indefinitely. Moving the alias to a new key every 30 days changes the key that the application uses for new data keys without code changes, and keeping the older keys enabled lets KMS decrypt the stored data keys, because symmetric ciphertext identifies the key that encrypted it."
    fr: "La rotation automatique accepte des périodes de 90 à 2 560 jours et la rotation à la demande est limitée à 25 rotations par clé : aucune ne permet un cycle de 30 jours indéfiniment. Déplacer l'alias vers une nouvelle clé tous les 30 jours change la clé utilisée par l'application pour les nouvelles clés de données sans modification du code, et conserver les anciennes clés activées permet à KMS de déchiffrer les clés de données stockées, car un texte chiffré symétrique identifie la clé qui l'a chiffré."
  options:
    b:
      en: "The rotation period of automatic rotation must be between 90 and 2,560 days, so 30 days is not accepted."
      fr: "La période de rotation automatique doit être comprise entre 90 et 2 560 jours : 30 jours n'est pas accepté."
    c:
      en: "On-demand rotation can be performed at most 25 times per KMS key, so a 30-day schedule runs out after about two years."
      fr: "La rotation à la demande peut être effectuée au maximum 25 fois par clé KMS : une planification de 30 jours s'épuise après environ deux ans."
    d:
      en: "AWS KMS deletes imported key material when it expires, so the records encrypted under the expired material could no longer be decrypted."
      fr: "AWS KMS supprime le matériel de clé importé à son expiration : les enregistrements chiffrés avec le matériel expiré ne pourraient plus être déchiffrés."
references:
  - title: Enable automatic key rotation
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotating-keys-enable.html
  - title: Perform on-demand key rotation
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotating-keys-on-demand.html
