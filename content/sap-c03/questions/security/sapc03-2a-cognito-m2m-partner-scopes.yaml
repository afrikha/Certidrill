id: sapc03-2a-cognito-m2m-partner-scopes
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany, a logistics company, exposes a REST API in Amazon API Gateway to the backend systems of 40 partners. No human user is involved in these calls. Each partner must be authorized only for specific operations: some partners can only read tracking data, and others can also create shipments. The partners require standard OAuth 2.0 tokens and cannot use AWS credentials. The company must be able to revoke the access of a single partner without affecting the others.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, une entreprise de logistique, expose une API REST Amazon API Gateway aux systèmes backend de 40 partenaires. Aucun utilisateur humain n'intervient dans ces appels. Chaque partenaire ne doit être autorisé que pour certaines opérations : certains partenaires peuvent seulement lire les données de suivi, d'autres peuvent aussi créer des expéditions. Les partenaires exigent des jetons OAuth 2.0 standard et ne peuvent pas utiliser d'informations d'identification AWS. L'entreprise doit pouvoir révoquer l'accès d'un seul partenaire sans affecter les autres.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Cognito user pool resource server with custom scopes, one app client with a secret per partner limited to its scopes, and a Cognito authorizer that requires the scopes."
        fr: "Créer un serveur de ressources de groupe d'utilisateurs Cognito avec des portées personnalisées, un client d'application avec secret par partenaire limité à ses portées, et un mécanisme d'autorisation Cognito qui exige les portées."
    - id: b
      text:
        en: "Create one API key per partner in API Gateway, associate each key with a usage plan that lists the allowed API stages, and require an API key on every method of the API."
        fr: "Créer une clé d'API par partenaire dans API Gateway, associer chaque clé à un plan d'utilisation qui liste les étapes d'API autorisées, et exiger une clé d'API sur chaque méthode de l'API."
    - id: c
      text:
        en: "Create an Amazon Cognito identity pool that allows unauthenticated identities, map each partner to an IAM role, and enable IAM authorization on the API methods."
        fr: "Créer un groupe d'identités Amazon Cognito qui autorise les identités non authentifiées, associer chaque partenaire à un rôle IAM, et activer l'autorisation IAM sur les méthodes de l'API."
    - id: d
      text:
        en: "Create one IAM user per partner with an access key, attach a policy that allows execute-api:Invoke on the allowed methods, and enable IAM authorization on the API methods."
        fr: "Créer un utilisateur IAM par partenaire avec une clé d'accès, attacher une politique qui autorise execute-api:Invoke sur les méthodes autorisées, et activer l'autorisation IAM sur les méthodes de l'API."
answer: { optionId: a }
explanation:
  correct:
    en: "Machine-to-machine clients use the OAuth 2.0 client credentials grant with a client ID and secret, and Amazon Cognito issues access tokens that authorize only custom scopes of resource servers. A Cognito authorizer with authorization scopes checks the scope claim on each method, and removing or disabling one partner's app client revokes only that partner."
    fr: "Les clients de machine à machine utilisent l'octroi OAuth 2.0 client credentials avec un ID et un secret client, et Amazon Cognito émet des jetons d'accès qui n'autorisent que les portées personnalisées des serveurs de ressources. Un mécanisme d'autorisation Cognito avec des portées d'autorisation vérifie la revendication scope sur chaque méthode, et la suppression ou la désactivation du client d'application d'un partenaire ne révoque que ce partenaire."
  options:
    b:
      en: "API keys identify callers for usage plans and throttling; they are not an OAuth 2.0 token and do not authorize individual operations."
      fr: "Les clés d'API identifient les appelants pour les plans d'utilisation et la limitation ; ce ne sont pas des jetons OAuth 2.0 et elles n'autorisent pas des opérations individuelles."
    c:
      en: "Unauthenticated identities cannot tell partners apart, and IAM authorization requires requests signed with AWS credentials, which the partners cannot use."
      fr: "Les identités non authentifiées ne permettent pas de distinguer les partenaires, et l'autorisation IAM exige des requêtes signées avec des informations d'identification AWS, que les partenaires ne peuvent pas utiliser."
    d:
      en: "IAM users with access keys are AWS credentials, which the partners cannot use, and they are not OAuth 2.0 tokens."
      fr: "Des utilisateurs IAM avec des clés d'accès sont des informations d'identification AWS, que les partenaires ne peuvent pas utiliser, et ne sont pas des jetons OAuth 2.0."
references:
  - title: Scopes, M2M, and resource servers
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-define-resource-servers.html
