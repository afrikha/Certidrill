id: sapc03-2c-org-custom-policy-rule
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company has 150 accounts in AWS Organizations and uses a security tooling account as the AWS Config delegated administrator. AWS Config records all resources in every account in us-east-1 and us-west-2. The compliance team has already written, in AWS CloudFormation Guard syntax, a set of checks for Amazon DynamoDB tables that combine point-in-time recovery, deletion protection, and the value of a data-classification tag. The team requires that exactly these Guard rules be used for evaluation without being rewritten. The team does not want to own or maintain any AWS Lambda functions or cross-account IAM roles. Existing tables and tables created later by any method must be evaluated in all current and future accounts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias possède 150 comptes dans AWS Organizations et utilise un compte d'outillage de sécurité comme administrateur délégué d'AWS Config. AWS Config enregistre toutes les ressources de chaque compte dans us-east-1 et us-west-2. L'équipe de conformité a déjà écrit, dans la syntaxe AWS CloudFormation Guard, un ensemble de vérifications pour les tables Amazon DynamoDB qui combinent la restauration à un instant dans le passé, la protection contre la suppression et la valeur d'une étiquette data-classification. L'équipe exige que ces règles Guard soient utilisées telles quelles pour l'évaluation, sans être réécrites. L'équipe ne veut posséder ni maintenir aucune fonction AWS Lambda ni aucun rôle IAM entre comptes. Les tables existantes et les tables créées ensuite par n'importe quelle méthode doivent être évaluées dans tous les comptes actuels et futurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Package the Guard rules in a Lambda function in the security tooling account, and call PutOrganizationConfigRule with custom rule metadata that references the function in each of the two Regions."
        fr: "Intégrer les règles Guard dans une fonction Lambda du compte d'outillage de sécurité, et appeler PutOrganizationConfigRule avec des métadonnées de règle personnalisée qui référencent la fonction dans chacune des deux Régions."
    - id: b
      text:
        en: "Activate a CloudFormation Guard hook that uses the Guard rules in every account and Region by deploying it with CloudFormation StackSets from the security tooling account."
        fr: "Activer un hook CloudFormation Guard qui utilise les règles Guard dans chaque compte et chaque Région en le déployant avec CloudFormation StackSets depuis le compte d'outillage de sécurité."
    - id: c
      text:
        en: "Replace the Guard rules with the dynamodb-pitr-enabled and required-tags managed rules, and deploy them in an organization conformance pack from the security tooling account in both Regions."
        fr: "Remplacer les règles Guard par les règles gérées dynamodb-pitr-enabled et required-tags, et les déployer dans un pack de conformité d'organisation depuis le compte d'outillage de sécurité dans les deux Régions."
    - id: d
      text:
        en: "Create an organization custom policy rule that contains the Guard rules by calling PutOrganizationConfigRule from the security tooling account in each of the two Regions."
        fr: "Créer une règle de politique personnalisée d'organisation qui contient les règles Guard en appelant PutOrganizationConfigRule depuis le compte d'outillage de sécurité dans chacune des deux Régions."
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Config custom policy rules evaluate resources with logic written in Guard syntax, so no Lambda function is needed. PutOrganizationConfigRule can deploy an organization custom policy rule from the delegated administrator to all member accounts, including accounts that join later. The API is Region-specific, so it is called in each Region, and the rule evaluates recorded tables regardless of how they were created."
    fr: "Les règles de politique personnalisées d'AWS Config évaluent les ressources avec une logique écrite dans la syntaxe Guard : aucune fonction Lambda n'est nécessaire. PutOrganizationConfigRule peut déployer une règle de politique personnalisée d'organisation depuis l'administrateur délégué vers tous les comptes membres, y compris ceux qui rejoignent l'organisation plus tard. L'API est propre à une Région : elle est appelée dans chaque Région, et la règle évalue les tables enregistrées quelle que soit leur méthode de création."
  options:
    a:
      en: "A custom Lambda rule requires the team to own and maintain a Lambda function and the permissions that let AWS Config in member accounts invoke it, which the team refuses."
      fr: "Une règle Lambda personnalisée oblige l'équipe à posséder et maintenir une fonction Lambda ainsi que les autorisations permettant à AWS Config des comptes membres de l'appeler, ce que l'équipe refuse."
    b:
      en: "A hook checks resources only during CloudFormation stack operations; it does not evaluate existing tables or tables created through the console, the API or other tools."
      fr: "Un hook vérifie les ressources uniquement pendant les opérations de pile CloudFormation ; il n'évalue ni les tables existantes ni les tables créées par la console, l'API ou d'autres outils."
    c:
      en: "Replacing the checks with managed rules violates the requirement to use the existing Guard rules without rewriting them."
      fr: "Remplacer les vérifications par des règles gérées viole l'exigence d'utiliser les règles Guard existantes sans les réécrire."
references:
  - title: Managing AWS Config Rules Across All Accounts in Your Organization
    url: https://docs.aws.amazon.com/config/latest/developerguide/config-rule-multi-account-deployment.html
  - title: Proactive controls
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/proactive-controls.html
