id: sapc03-2a-kms-deletion-guardrails
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 120 member accounts in AWS Organizations and encrypts production data with customer managed AWS KMS keys. During an incident review, the security team found that an engineer had scheduled the deletion of a key that a production Amazon RDS database still used; the deletion was cancelled by chance. An organization trail delivers CloudTrail events to a CloudWatch Logs log group in the security account. The team wants only the central KeyAdmin role to be able to schedule key deletion in any member account, including keys created in the future, and wants to be alerted within minutes when any principal tries to use a key that is pending deletion.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany possède 120 comptes membres dans AWS Organizations et chiffre ses données de production avec des clés AWS KMS gérées par le client. Lors d'une revue d'incident, l'équipe de sécurité a découvert qu'un ingénieur avait planifié la suppression d'une clé encore utilisée par une base de données Amazon RDS de production ; la suppression a été annulée par hasard. Un journal de suivi d'organisation envoie les événements CloudTrail à un groupe de journaux CloudWatch Logs du compte de sécurité. L'équipe veut que seul le rôle central KeyAdmin puisse planifier la suppression de clés dans un compte membre, y compris pour les clés créées à l'avenir, et veut être alertée en quelques minutes lorsqu'un principal tente d'utiliser une clé en attente de suppression.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Edit the key policy of every existing customer managed key so that only the KeyAdmin role is allowed to call kms:ScheduleKeyDeletion."
        fr: "Modifier la politique de clé de chaque clé gérée par le client existante pour que seul le rôle KeyAdmin soit autorisé à appeler kms:ScheduleKeyDeletion."
    - id: b
      text:
        en: "Attach an SCP to the member accounts that denies kms:ScheduleKeyDeletion unless aws:PrincipalArn matches the KeyAdmin role."
        fr: "Attacher aux comptes membres une SCP qui refuse kms:ScheduleKeyDeletion sauf si aws:PrincipalArn correspond au rôle KeyAdmin."
    - id: c
      text:
        en: "Require a waiting period of 7 days for every key deletion so that keys pending deletion are removed before they can cause outages."
        fr: "Imposer une période d'attente de 7 jours pour chaque suppression de clé afin que les clés en attente de suppression soient supprimées avant de pouvoir provoquer des pannes."
    - id: d
      text:
        en: "Create a metric filter on the CloudTrail log group for KMS errors that say the key is pending deletion, and a CloudWatch alarm that notifies the team through Amazon SNS."
        fr: "Créer sur le groupe de journaux CloudTrail un filtre de métriques pour les erreurs KMS qui indiquent que la clé est en attente de suppression, et une alarme CloudWatch qui avertit l'équipe via Amazon SNS."
    - id: e
      text:
        en: "Attach a permissions boundary that denies kms:ScheduleKeyDeletion to every existing IAM role in the member accounts except the KeyAdmin role."
        fr: "Attacher à chaque rôle IAM existant des comptes membres, sauf le rôle KeyAdmin, une limite d'autorisations qui refuse kms:ScheduleKeyDeletion."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An SCP applies to every principal of the member accounts and to every key, including future keys, so it limits key deletion scheduling to KeyAdmin centrally. AWS KMS documents an alarm that combines CloudTrail, a CloudWatch Logs metric filter on the pending deletion error and an SNS notification to detect attempts to use a key that is pending deletion."
    fr: "Une SCP s'applique à tous les principaux des comptes membres et à toutes les clés, y compris les clés futures : elle réserve de manière centrale la planification de suppression à KeyAdmin. AWS KMS documente une alarme qui combine CloudTrail, un filtre de métriques CloudWatch Logs sur l'erreur d'attente de suppression et une notification SNS pour détecter les tentatives d'utilisation d'une clé en attente de suppression."
  options:
    a:
      en: "Editing existing key policies does not cover keys created later, and each key policy must be maintained one by one."
      fr: "Modifier les politiques de clé existantes ne couvre pas les clés créées ultérieurement, et chaque politique de clé doit être maintenue une par une."
    c:
      en: "A shorter waiting period leaves less time to notice and cancel a mistaken deletion; AWS KMS allows 7 to 30 days and recommends caution."
      fr: "Une période d'attente plus courte laisse moins de temps pour remarquer et annuler une suppression erronée ; AWS KMS autorise de 7 à 30 jours et recommande la prudence."
    e:
      en: "Boundaries on existing roles do not cover roles created later, and they must be attached account by account."
      fr: "Des limites sur les rôles existants ne couvrent pas les rôles créés ultérieurement, et elles doivent être attachées compte par compte."
references:
  - title: Create an alarm that detects use of a KMS key pending deletion
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys-creating-cloudwatch-alarm.html
  - title: Delete an AWS KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
