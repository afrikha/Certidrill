id: sapc03-2b-bedrock-logging-multimodal-kms
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's claims assistant runs in one account and calls Amazon Bedrock multimodal models through the Converse API with photos of damaged vehicles and long PDF documents. The compliance team must keep every request and response, including the images and documents. Analysts want to search the text of prompts and responses with CloudWatch Logs Insights. All log data at rest must be encrypted with a customer managed KMS key, and the security team grants no more access than necessary.

    Which solution will meet these requirements?
  fr: |
    L'assistant de gestion des sinistres d'AnyCompany s'exécute dans un compte et appelle des modèles multimodaux Amazon Bedrock via l'API Converse avec des photos de véhicules endommagés et de longs documents PDF. L'équipe de conformité doit conserver chaque requête et chaque réponse, y compris les images et les documents. Les analystes veulent rechercher le texte des invites et des réponses avec CloudWatch Logs Insights. Toutes les données de journal au repos doivent être chiffrées avec une clé KMS gérée par le client, et l'équipe de sécurité n'accorde pas plus d'accès que nécessaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable model invocation logging with CloudWatch Logs as the only destination, select the text and image modalities, and encrypt the log group with the customer managed key for all entries.", fr: "Activer la journalisation des invocations de modèle avec CloudWatch Logs comme seule destination, sélectionner les modalités texte et image, et chiffrer le groupe de journaux avec la clé gérée par le client pour toutes les entrées." } }
    - { id: b, text: { en: "Enable model invocation logging with Amazon S3 as the only destination and SSE-KMS, and add a key policy statement that allows the bedrock.amazonaws.com service principal to use kms:* on the key.", fr: "Activer la journalisation des invocations de modèle avec Amazon S3 comme seule destination et SSE-KMS, et ajouter une instruction de politique de clé qui autorise le principal de service bedrock.amazonaws.com à utiliser kms:* sur la clé." } }
    - { id: c, text: { en: "Enable model invocation logging to a KMS-encrypted log group plus an SSE-KMS S3 large-data location, and allow bedrock.amazonaws.com kms:GenerateDataKey with aws:SourceAccount and aws:SourceArn conditions.", fr: "Activer la journalisation des invocations de modèle vers un groupe de journaux chiffré par KMS et un emplacement S3 en SSE-KMS pour les données volumineuses, et autoriser kms:GenerateDataKey à bedrock.amazonaws.com avec des conditions aws:SourceAccount et aws:SourceArn." } }
    - { id: d, text: { en: "Create an organization trail with Amazon Bedrock data events delivered to CloudWatch Logs, and encrypt the trail and the log group with the customer managed key.", fr: "Créer un journal de suivi d'organisation avec des événements de données Amazon Bedrock livrés à CloudWatch Logs, et chiffrer le journal de suivi et le groupe de journaux avec la clé gérée par le client." } }
answer: { optionId: c }
explanation:
  correct:
    en: "For large inputs and outputs and binary image data, only Amazon S3 is supported: with an S3 large-data location, bodies larger than 100 KB and images go to S3, while the log group keeps searchable entries. When the bucket uses SSE-KMS, the key policy must allow bedrock.amazonaws.com to call kms:GenerateDataKey, scoped with aws:SourceAccount and aws:SourceArn."
    fr: "Pour les entrées et sorties volumineuses et les données d'image binaires, seul Amazon S3 est pris en charge : avec un emplacement S3 pour les données volumineuses, les corps de plus de 100 Ko et les images vont dans S3, tandis que le groupe de journaux conserve des entrées consultables. Lorsque le compartiment utilise SSE-KMS, la politique de clé doit autoriser bedrock.amazonaws.com à appeler kms:GenerateDataKey, limité par aws:SourceAccount et aws:SourceArn."
  options:
    a:
      en: "Without an S3 location, CloudWatch Logs cannot hold the images and the bodies larger than 100 KB, so the record would be incomplete."
      fr: "Sans emplacement S3, CloudWatch Logs ne peut contenir ni les images ni les corps de plus de 100 Ko : l'enregistrement serait incomplet."
    b:
      en: "Without a log group, analysts cannot use Logs Insights, and kms:* grants far more than the GenerateDataKey permission that Amazon Bedrock needs."
      fr: "Sans groupe de journaux, les analystes ne peuvent pas utiliser Logs Insights, et kms:* accorde bien plus que l'autorisation GenerateDataKey dont Amazon Bedrock a besoin."
    d:
      en: "CloudTrail records API activity, not the prompts, responses, images, and documents of the invocations."
      fr: "CloudTrail enregistre l'activité des API, pas les invites, réponses, images et documents des invocations."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
