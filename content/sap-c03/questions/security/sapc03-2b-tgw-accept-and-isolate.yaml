id: sapc03-2b-tgw-accept-and-isolate
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's network account shares a transit gateway with all accounts in the organization through AWS RAM. The transit gateway has Auto accept shared attachments, Default route table association, and Default route table propagation turned on. As a result, a new VPC attachment from any account immediately reaches every other VPC and the data center. The security team now requires that the network team approve each new attachment. An approved attachment must have no connectivity until the network team associates it with the route table of its segment.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'AnyCompany partage une passerelle de transit avec tous les comptes de l'organisation via AWS RAM. La passerelle de transit a les options Auto accept shared attachments, Default route table association et Default route table propagation activées. En conséquence, un nouvel attachement VPC de n'importe quel compte atteint immédiatement tous les autres VPC et le centre de données. L'équipe de sécurité exige désormais que l'équipe réseau approuve chaque nouvel attachement. Un attachement approuvé ne doit avoir aucune connectivité tant que l'équipe réseau ne l'a pas associé à la table de routage de son segment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Turn off Auto accept shared attachments only, and have the network team accept each attachment so that it joins the default route table after approval.", fr: "Désactiver uniquement Auto accept shared attachments, et faire accepter chaque attachement par l'équipe réseau afin qu'il rejoigne la table de routage par défaut après approbation." } }
    - { id: b, text: { en: "Remove the organization from the resource share, and share the transit gateway with each account separately only after the network team approves the account's request.", fr: "Retirer l'organisation du partage de ressources, et ne partager la passerelle de transit avec chaque compte séparément qu'après approbation de sa demande par l'équipe réseau." } }
    - { id: c, text: { en: "Turn off Auto accept shared attachments and the default route table association and propagation, then accept each attachment and associate it with a segment route table.", fr: "Désactiver Auto accept shared attachments ainsi que l'association et la propagation par défaut des tables de routage, puis accepter chaque attachement et l'associer à une table de routage de segment." } }
    - { id: d, text: { en: "Keep the current settings, and require the workload teams to add network ACLs in their VPCs that deny traffic until the network team approves the attachment.", fr: "Conserver les paramètres actuels, et exiger que les équipes de charge de travail ajoutent dans leurs VPC des listes ACL réseau qui refusent le trafic jusqu'à l'approbation de l'attachement." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With Auto accept shared attachments turned off, a cross-account attachment waits in the pending-acceptance state until the owner accepts or rejects it. With default association and propagation turned off, an accepted attachment is associated with no route table and propagates no routes, so it has no connectivity until the network team associates it with the right segment."
    fr: "Avec Auto accept shared attachments désactivé, un attachement intercompte reste à l'état pending-acceptance jusqu'à ce que le propriétaire l'accepte ou le refuse. Avec l'association et la propagation par défaut désactivées, un attachement accepté n'est associé à aucune table de routage et ne propage aucune route : il n'a aucune connectivité tant que l'équipe réseau ne l'a pas associé au bon segment."
  options:
    a:
      en: "With default association and propagation still on, an accepted attachment joins the default route table and gets connectivity immediately."
      fr: "Avec l'association et la propagation par défaut toujours actives, un attachement accepté rejoint la table de routage par défaut et obtient immédiatement une connectivité."
    b:
      en: "Per-account sharing adds overhead, and the auto-accept and default route table settings would still give new attachments immediate connectivity."
      fr: "Un partage compte par compte ajoute de la charge, et les paramètres d'acceptation automatique et de table de routage par défaut donneraient toujours une connectivité immédiate aux nouveaux attachements."
    d:
      en: "Network ACLs are owned by the workload teams, so the network team cannot enforce or approve anything with them."
      fr: "Les listes ACL réseau appartiennent aux équipes de charge de travail : l'équipe réseau ne peut rien imposer ni approuver avec elles."
references:
  - title: Amazon VPC attachments in AWS Transit Gateway
    url: https://docs.aws.amazon.com/vpc/latest/tgw/tgw-vpc-attachments.html
