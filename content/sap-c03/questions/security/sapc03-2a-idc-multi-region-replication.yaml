id: sapc03-2a-idc-multi-region-replication
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an organization instance of AWS IAM Identity Center in us-east-1. Microsoft Entra ID is the identity source, with SAML 2.0 sign-in and SCIM provisioning. The instance uses the default AWS owned key for encryption at rest. 300 engineers in the United States and Europe use permission sets to operate workloads in us-east-1 and eu-west-1. A new business continuity requirement states that engineers must still be able to access their AWS accounts with their existing permissions if IAM Identity Center has a service disruption in its primary Region. The company does not want to create and maintain IAM users for the engineers.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite une instance d'organisation d'AWS IAM Identity Center dans us-east-1. Microsoft Entra ID est la source d'identité, avec une connexion SAML 2.0 et un provisionnement SCIM. L'instance utilise la clé détenue par AWS par défaut pour le chiffrement au repos. 300 ingénieurs aux États-Unis et en Europe utilisent des ensembles d'autorisations (permission sets) pour exploiter des charges de travail dans us-east-1 et eu-west-1. Une nouvelle exigence de continuité d'activité impose que les ingénieurs puissent toujours accéder à leurs comptes AWS avec leurs autorisations existantes si IAM Identity Center subit une interruption de service dans sa Région principale. L'entreprise ne veut pas créer ni maintenir d'utilisateurs IAM pour les ingénieurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable an account instance of IAM Identity Center in eu-west-1 in a member account with the same Entra ID tenant as its identity source, and recreate the permission sets in that instance."
        fr: "Activer une instance de compte d'IAM Identity Center dans eu-west-1 dans un compte membre avec le même locataire Entra ID comme source d'identité, et recréer les ensembles d'autorisations dans cette instance."
    - id: b
      text:
        en: "Configure the instance with a multi-Region customer managed AWS KMS key in the management account, replicate the instance to eu-west-1, and add the eu-west-1 assertion consumer service URL in Entra ID."
        fr: "Configurer l'instance avec une clé AWS KMS gérée par le client multi-Régions dans le compte de gestion, répliquer l'instance dans eu-west-1, et ajouter l'URL du service consommateur d'assertions (ACS) d'eu-west-1 dans Entra ID."
    - id: c
      text:
        en: "Configure the instance with a single-Region customer managed AWS KMS key in the management account, replicate the instance to eu-west-1, and create a second Entra ID enterprise application for the replica."
        fr: "Configurer l'instance avec une clé AWS KMS gérée par le client à Région unique dans le compte de gestion, répliquer l'instance dans eu-west-1, et créer une seconde application d'entreprise Entra ID pour le réplica."
    - id: d
      text:
        en: "Change the identity source to an AWS Managed Microsoft AD directory that is replicated to eu-west-1, synchronize Entra ID to the directory, and replicate the instance to eu-west-1."
        fr: "Remplacer la source d'identité par un annuaire AWS Managed Microsoft AD répliqué dans eu-west-1, synchroniser Entra ID vers l'annuaire, et répliquer l'instance dans eu-west-1."
answer: { optionId: b }
explanation:
  correct:
    en: "An organization instance can be replicated to additional Regions, which copies identities, permission sets, assignments and sessions, so the workforce can access AWS accounts with permissions provisioned before a disruption in the primary Region. Replication requires a multi-Region customer managed KMS key in the same account as IAM Identity Center, and the IdP must accept multiple assertion consumer service URLs, which Entra ID supports."
    fr: "Une instance d'organisation peut être répliquée dans d'autres Régions, ce qui copie les identités, les ensembles d'autorisations, les affectations et les sessions : les employés peuvent accéder aux comptes AWS avec les autorisations provisionnées avant une interruption dans la Région principale. La réplication exige une clé KMS gérée par le client multi-Régions dans le même compte qu'IAM Identity Center, et l'IdP doit accepter plusieurs URL de service consommateur d'assertions, ce que prend en charge Entra ID."
  options:
    a:
      en: "Account instances cannot assign multi-account permissions or give access to AWS accounts, so they cannot serve as a fallback for account access."
      fr: "Les instances de compte ne peuvent pas attribuer d'autorisations multicomptes ni donner accès à des comptes AWS : elles ne peuvent pas servir de solution de repli pour l'accès aux comptes."
    c:
      en: "Replication to additional Regions requires a multi-Region customer managed key; a single-Region key does not meet the prerequisite."
      fr: "La réplication dans d'autres Régions exige une clé gérée par le client multi-Régions ; une clé à Région unique ne remplit pas ce prérequis."
    d:
      en: "Active Directory is not supported as the identity source of a multi-Region IAM Identity Center instance."
      fr: "Active Directory n'est pas pris en charge comme source d'identité d'une instance IAM Identity Center multi-Régions."
references:
  - title: Using IAM Identity Center across multiple AWS Regions
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/multi-region-iam-identity-center.html
