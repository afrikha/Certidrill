id: sapc03-2b-rcp-syntax-redesign
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's security team drafted its first custom RCP to protect AWS KMS keys in the member accounts. The draft contains an Allow statement for principals in the organization, a Deny statement that uses NotPrincipal to exclude a partner role, and a second Deny statement whose Action element is only an asterisk. AWS Organizations rejects the policy. The intent is that only principals in the organization and the partner role can use the keys.

    Which redesign of the policy will meet the intent?
  fr: |
    L'équipe de sécurité d'AnyCompany a rédigé sa première RCP personnalisée pour protéger les clés AWS KMS des comptes membres. Le brouillon contient une instruction Allow pour les principaux de l'organisation, une instruction Deny qui utilise NotPrincipal pour exclure un rôle partenaire, et une seconde instruction Deny dont l'élément Action n'est qu'un astérisque. AWS Organizations refuse la politique. L'intention est que seuls les principaux de l'organisation et le rôle partenaire puissent utiliser les clés.

    Quelle refonte de la politique répond à l'intention ?
body:
  options:
    - { id: a, text: { en: "Keep the statements, and attach the document as an SCP instead, because SCPs support Allow statements and the NotPrincipal element in Deny statements.", fr: "Conserver les instructions, et attacher le document en tant que SCP, car les SCP prennent en charge les instructions Allow et l'élément NotPrincipal dans les instructions Deny." } }
    - { id: b, text: { en: "Use one Deny statement with Principal *, kms:* as the action, and conditions on aws:PrincipalOrgID and aws:PrincipalArn that exempt the organization and the partner role.", fr: "Utiliser une seule instruction Deny avec Principal *, kms:* comme action, et des conditions sur aws:PrincipalOrgID et aws:PrincipalArn qui exemptent l'organisation et le rôle partenaire." } }
    - { id: c, text: { en: "Keep the Allow statement, replace NotPrincipal with a Principal element that names the partner role, and attach the policy to the management account only.", fr: "Conserver l'instruction Allow, remplacer NotPrincipal par un élément Principal qui nomme le rôle partenaire, et attacher la politique au seul compte de gestion." } }
    - { id: d, text: { en: "Replace NotPrincipal with NotAction for the actions of the partner role, and keep the asterisk as the Action element so that every AWS service is covered.", fr: "Remplacer NotPrincipal par NotAction pour les actions du rôle partenaire, et conserver l'astérisque comme élément Action afin de couvrir tous les services AWS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "In a custom RCP, the Effect must be Deny, the Principal element can only be *, specific principals are restricted with conditions, and the Action element cannot be * alone. A single Deny on kms:* with conditions on aws:PrincipalOrgID and aws:PrincipalArn denies every principal that is neither in the organization nor the partner role."
    fr: "Dans une RCP personnalisée, l'effet doit être Deny, l'élément Principal ne peut valoir que *, les principaux précis se restreignent avec des conditions, et l'élément Action ne peut pas être * seul. Une seule instruction Deny sur kms:* avec des conditions sur aws:PrincipalOrgID et aws:PrincipalArn refuse tout principal qui n'est ni dans l'organisation ni le rôle partenaire."
  options:
    a:
      en: "SCPs do not support the Principal or NotPrincipal elements, and they do not affect principals outside the organization, such as the partner role."
      fr: "Les SCP ne prennent en charge ni Principal ni NotPrincipal, et elles n'affectent pas les principaux hors de l'organisation, comme le rôle partenaire."
    c:
      en: "Allow is supported only in RCPFullAWSAccess, Principal can only be *, and RCPs do not affect resources in the management account."
      fr: "Allow n'est pris en charge que dans RCPFullAWSAccess, Principal ne peut valoir que *, et les RCP n'affectent pas les ressources du compte de gestion."
    d:
      en: "NotAction is not supported in RCPs, and a customer managed RCP cannot use * as the entire Action value."
      fr: "NotAction n'est pas pris en charge dans les RCP, et une RCP gérée par le client ne peut pas utiliser * comme valeur entière de l'élément Action."
references:
  - title: RCP syntax
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps_syntax.html
