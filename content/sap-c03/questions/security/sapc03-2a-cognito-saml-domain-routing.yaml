id: sapc03-2a-cognito-saml-domain-routing
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany sells a business-to-business SaaS application that relies on tokens from one Amazon Cognito user pool. The company has 120 enterprise customers, and each customer wants its employees to sign in through the customer's own SAML 2.0 identity provider, such as Okta, Microsoft Entra ID or AD FS. On the sign-in page, users must enter only their work email address and be sent automatically to their company's identity provider, without a list of 120 provider buttons. The company onboards new customers every week and does not want to redeploy the application for each one.

    Which solution will meet these requirements?
  fr: |
    AnyCompany vend une application SaaS interentreprises qui s'appuie sur les jetons d'un seul groupe d'utilisateurs Amazon Cognito. L'entreprise compte 120 clients entreprises, et chaque client veut que ses employés se connectent via son propre fournisseur d'identité SAML 2.0, par exemple Okta, Microsoft Entra ID ou AD FS. Sur la page de connexion, les utilisateurs ne doivent saisir que leur adresse e-mail professionnelle et être redirigés automatiquement vers le fournisseur d'identité de leur entreprise, sans liste de 120 boutons de fournisseurs. L'entreprise intègre de nouveaux clients chaque semaine et ne veut pas redéployer l'application pour chacun.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add each customer's identity provider to the user pool as a SAML provider with the customer's email domains as identifiers, and enable domain search input in managed login."
        fr: "Ajouter le fournisseur d'identité de chaque client au groupe d'utilisateurs comme fournisseur SAML avec les domaines de messagerie du client comme identifiants, et activer la saisie de recherche de domaine dans la connexion gérée."
    - id: b
      text:
        en: "Create one user pool for each customer with that customer's SAML provider, and route users to the right user pool based on a customer-specific subdomain of the application."
        fr: "Créer un groupe d'utilisateurs par client avec le fournisseur SAML de ce client, et diriger les utilisateurs vers le bon groupe d'utilisateurs selon un sous-domaine propre au client dans l'application."
    - id: c
      text:
        en: "Add each customer's identity provider to an Amazon Cognito identity pool as a SAML provider, and have the application exchange the SAML assertion for temporary AWS credentials."
        fr: "Ajouter le fournisseur d'identité de chaque client à un groupe d'identités Amazon Cognito comme fournisseur SAML, et faire échanger par l'application l'assertion SAML contre des informations d'identification AWS temporaires."
    - id: d
      text:
        en: "Add each customer's identity provider to AWS IAM Identity Center as an identity source, and add the application to IAM Identity Center as a customer managed SAML 2.0 application."
        fr: "Ajouter le fournisseur d'identité de chaque client à AWS IAM Identity Center comme source d'identité, et ajouter l'application à IAM Identity Center comme application SAML 2.0 gérée par le client."
answer: { optionId: a }
explanation:
  correct:
    en: "When SAML provider identifiers are email domains, managed login asks for the email address, reads its domain and redirects the user to the matching identity provider, and it hides the provider buttons when every provider has an identifier. Adding a customer is a user pool configuration change, so the application keeps using the tokens of the same user pool."
    fr: "Lorsque les identifiants des fournisseurs SAML sont des domaines de messagerie, la connexion gérée demande l'adresse e-mail, lit son domaine et redirige l'utilisateur vers le fournisseur d'identité correspondant ; elle masque les boutons de fournisseurs quand chaque fournisseur possède un identifiant. Ajouter un client est une modification de configuration du groupe d'utilisateurs : l'application continue d'utiliser les jetons du même groupe d'utilisateurs."
  options:
    b:
      en: "The application relies on one user pool; a user pool per customer multiplies configurations and requires application changes to handle many issuers."
      fr: "L'application s'appuie sur un seul groupe d'utilisateurs ; un groupe d'utilisateurs par client multiplie les configurations et exige des modifications de l'application pour gérer de nombreux émetteurs."
    c:
      en: "An identity pool returns AWS credentials, not the user pool tokens that the application relies on, and it has no email-based routing to identity providers."
      fr: "Un groupe d'identités renvoie des informations d'identification AWS, pas les jetons du groupe d'utilisateurs dont dépend l'application, et il n'offre pas de routage vers les fournisseurs d'identité selon l'e-mail."
    d:
      en: "IAM Identity Center supports only one identity source and is meant for the company's own workforce, not for the customers of a SaaS product."
      fr: "IAM Identity Center ne prend en charge qu'une seule source d'identité et est destiné aux employés de l'entreprise, pas aux clients d'un produit SaaS."
references:
  - title: SAML identity provider names and identifiers
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools-managing-saml-idp-naming.html
