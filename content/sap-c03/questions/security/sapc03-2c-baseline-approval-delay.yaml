id: sapc03-2c-baseline-approval-delay
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS company patches its Amazon EC2 instances that run Amazon Linux 2023 with AWS Systems Manager Patch Manager. The instances are in a Staging OU and a Production OU of its organization in AWS Organizations, and patching is configured with patch policies. Critical and important security patches must be installed in staging as soon as they are released. In production, the same patches must be installed only after they have been available for 7 days, so that staging can reveal problems first. A specific kernel package version caused failures in staging and must never be installed in production. The company does not want to update any approval setting manually each week.

    Which solution will meet these requirements?
  fr: |
    Un éditeur SaaS applique les correctifs de ses instances Amazon EC2 sous Amazon Linux 2023 avec AWS Systems Manager Patch Manager. Les instances se trouvent dans une OU Staging et une OU Production de son organisation AWS Organizations, et les correctifs sont configurés au moyen de politiques de correctifs. Les correctifs de sécurité critiques et importants doivent être installés en préproduction dès leur publication. En production, les mêmes correctifs ne doivent être installés qu'après avoir été disponibles pendant 7 jours, afin que la préproduction révèle d'abord les problèmes. Une version précise d'un paquet du noyau a provoqué des pannes en préproduction et ne doit jamais être installée en production. L'entreprise ne veut mettre à jour manuellement aucun paramètre d'approbation chaque semaine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use the AWS predefined Amazon Linux 2023 baseline for both OUs, edit its approval rule to wait 7 days, and add the kernel package version to its rejected patches list."
        fr: "Utiliser le référentiel prédéfini AWS pour Amazon Linux 2023 pour les deux OU, modifier sa règle d'approbation pour attendre 7 jours, et ajouter la version du paquet du noyau à sa liste de correctifs rejetés."
    - id: b
      text:
        en: "Create one custom baseline for both OUs with an auto-approval delay of 7 days, and run Patch now manually on the staging instances whenever a security patch is released."
        fr: "Créer un référentiel personnalisé unique pour les deux OU avec un délai d'approbation automatique de 7 jours, et lancer manuellement Patch now sur les instances de préproduction à chaque publication d'un correctif de sécurité."
    - id: c
      text:
        en: "Create two custom baselines that approve Critical and Important security patches: staging with a 0-day auto-approval delay, production with a 7-day delay and the kernel version rejected."
        fr: "Créer deux référentiels personnalisés qui approuvent les correctifs de sécurité Critical et Important : préproduction avec un délai d'approbation de 0 jour, production avec 7 jours et la version du noyau rejetée."
    - id: d
      text:
        en: "Create a custom production baseline with an auto-approval cutoff date set 7 days before the current date and the kernel version in its rejected list, and a staging baseline with no delay."
        fr: "Créer un référentiel personnalisé de production avec une date limite d'approbation automatique fixée 7 jours avant la date du jour et la version du noyau dans sa liste de rejets, et un référentiel de préproduction sans délai."
answer: { optionId: c }
explanation:
  correct:
    en: "An approval rule in a custom baseline can filter on classification and severity and set an auto-approval delay in days after release, so staging gets the patches immediately and production 7 days later without manual updates. A rejected patches list blocks the faulty kernel version in production only. Each OU gets its own patch policy that selects its baseline."
    fr: "Une règle d'approbation d'un référentiel personnalisé peut filtrer sur la classification et la gravité et définir un délai d'approbation automatique en jours après la publication : la préproduction reçoit les correctifs immédiatement et la production 7 jours plus tard, sans mise à jour manuelle. Une liste de correctifs rejetés bloque la version défectueuse du noyau en production uniquement. Chaque OU dispose de sa propre politique de correctifs qui sélectionne son référentiel."
  options:
    a:
      en: "Predefined baselines cannot be modified, and one shared baseline cannot give staging and production different delays or reject a package only in production."
      fr: "Les référentiels prédéfinis ne peuvent pas être modifiés, et un référentiel partagé ne peut pas appliquer des délais différents à la préproduction et à la production ni rejeter un paquet uniquement en production."
    b:
      en: "Installing in staging depends on someone running Patch now for each release, and the faulty kernel version is not blocked in production."
      fr: "L'installation en préproduction dépend d'une personne qui lance Patch now à chaque publication, et la version défectueuse du noyau n'est pas bloquée en production."
    d:
      en: "A cutoff date is a fixed date: patches released after it are never approved until someone moves the date forward, which is the weekly manual update the company wants to avoid."
      fr: "Une date limite est une date fixe : les correctifs publiés après elle ne sont jamais approuvés tant que quelqu'un ne l'avance pas, ce qui correspond à la mise à jour manuelle hebdomadaire que l'entreprise veut éviter."
references:
  - title: Predefined and custom patch baselines
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/patch-manager-predefined-and-custom-patch-baselines.html
