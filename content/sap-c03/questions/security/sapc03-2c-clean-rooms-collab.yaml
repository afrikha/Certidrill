id: sapc03-2c-clean-rooms-collab
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A retail company and a consumer goods manufacturer use separate AWS accounts in separate organizations. They want to measure how many retail customers who saw the manufacturer's ads later bought its products, by joining the retailer's purchase data with the manufacturer's ad exposure data. Both datasets are in Amazon S3 and cataloged in the AWS Glue Data Catalog. Neither company may see the other company's row-level data, and only aggregated results may leave the analysis. The manufacturer's legal team also requires that its data remain encrypted while the queries are processed.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de distribution et un fabricant de produits de grande consommation utilisent des comptes AWS distincts dans des organisations distinctes. Ils veulent mesurer combien de clients du distributeur ayant vu les publicités du fabricant ont ensuite acheté ses produits, en joignant les données d'achat du distributeur aux données d'exposition publicitaire du fabricant. Les deux jeux de données se trouvent dans Amazon S3 et sont catalogués dans AWS Glue Data Catalog. Aucune des deux entreprises ne doit voir les données ligne par ligne de l'autre, et seuls des résultats agrégés peuvent sortir de l'analyse. L'équipe juridique du fabricant exige aussi que ses données restent chiffrées pendant le traitement des requêtes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an AWS Clean Rooms collaboration, and have each company associate its configured table with an analysis rule that allows only aggregation queries."
        fr: "Créer une collaboration AWS Clean Rooms, et faire associer par chaque entreprise sa table configurée avec une règle d'analyse qui n'autorise que les requêtes d'agrégation."
    - id: b
      text:
        en: "Share the retailer's Glue tables with the manufacturer's account by using AWS Lake Formation cross-account grants with column-level data filters."
        fr: "Partager les tables Glue du distributeur avec le compte du fabricant à l'aide d'octrois entre comptes AWS Lake Formation avec des filtres de données au niveau des colonnes."
    - id: c
      text:
        en: "Load both datasets into a shared Amazon Redshift cluster in a third account, and apply row-level security policies for the analysts of each company."
        fr: "Charger les deux jeux de données dans un cluster Amazon Redshift partagé dans un troisième compte, et appliquer des politiques de sécurité au niveau des lignes pour les analystes de chaque entreprise."
    - id: d
      text:
        en: "Use Cryptographic Computing for Clean Rooms so that the manufacturer's data stays encrypted while the collaboration queries are processed."
        fr: "Utiliser Cryptographic Computing for Clean Rooms afin que les données du fabricant restent chiffrées pendant le traitement des requêtes de la collaboration."
    - id: e
      text:
        en: "Copy both datasets to a shared S3 bucket encrypted with SSE-KMS by using a customer managed key whose key policy allows both companies to use it."
        fr: "Copier les deux jeux de données dans un compartiment S3 partagé chiffré en SSE-KMS avec une clé gérée par le client dont la politique de clé autorise les deux entreprises à l'utiliser."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS Clean Rooms lets partners analyze combined datasets without revealing the underlying data to each other: it reads each member's data where it is stored and applies the analysis rules, which can restrict queries to aggregated outputs. Cryptographic Computing for Clean Rooms keeps a member's data encrypted while queries are processed, which meets the manufacturer's additional requirement."
    fr: "AWS Clean Rooms permet à des partenaires d'analyser des jeux de données combinés sans se révéler mutuellement les données sous-jacentes : il lit les données de chaque membre là où elles sont stockées et applique les règles d'analyse, qui peuvent limiter les requêtes à des résultats agrégés. Cryptographic Computing for Clean Rooms maintient les données d'un membre chiffrées pendant le traitement des requêtes, ce qui répond à l'exigence supplémentaire du fabricant."
  options:
    b:
      en: "Lake Formation grants give the manufacturer direct query access to the retailer's rows in the permitted columns, so row-level data is exposed."
      fr: "Les octrois Lake Formation donnent au fabricant un accès direct en requête aux lignes du distributeur dans les colonnes autorisées : les données ligne par ligne sont exposées."
    c:
      en: "Both datasets are copied into a cluster whose administrators can read all rows, and nothing keeps the manufacturer's data encrypted during processing."
      fr: "Les deux jeux de données sont copiés dans un cluster dont les administrateurs peuvent lire toutes les lignes, et rien ne maintient les données du fabricant chiffrées pendant le traitement."
    e:
      en: "Encryption at rest with a shared key lets both companies decrypt and read every object, so each sees the other's raw data."
      fr: "Le chiffrement au repos avec une clé partagée permet aux deux entreprises de déchiffrer et lire tous les objets : chacune voit les données brutes de l'autre."
references:
  - title: What is AWS Clean Rooms?
    url: https://docs.aws.amazon.com/clean-rooms/latest/userguide/what-is.html
