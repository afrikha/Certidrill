id: sapc03-2b-kms-mlkem-key-establishment
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exchanges large genomic datasets with a research partner over an untrusted network. For each dataset, the two companies want to establish a fresh 256-bit symmetric key with a quantum-resistant key-establishment mechanism and then encrypt the dataset with AES-256-GCM. AnyCompany's private key must stay in AWS KMS and must never be exported. The partner has no AWS account and uses a FIPS 203 library on its own systems.

    Which solution will meet these requirements?
  fr: |
    AnyCompany échange de volumineux jeux de données génomiques avec un partenaire de recherche sur un réseau non fiable. Pour chaque jeu de données, les deux entreprises veulent établir une nouvelle clé symétrique de 256 bits avec un mécanisme d'établissement de clé résistant aux attaques quantiques, puis chiffrer le jeu de données en AES-256-GCM. La clé privée d'AnyCompany doit rester dans AWS KMS et ne jamais être exportée. Le partenaire n'a pas de compte AWS et utilise une bibliothèque FIPS 203 sur ses propres systèmes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an ML_KEM_768 KMS key, give its public key to the partner, have the partner encapsulate a shared secret and return the ciphertext, and call KMS Decapsulate.", fr: "Créer une clé KMS ML_KEM_768, remettre sa clé publique au partenaire, faire encapsuler par le partenaire un secret partagé dont il renvoie le texte chiffré, et appeler KMS Decapsulate." } }
    - { id: b, text: { en: "Create an RSA_4096 KMS key for encryption, give its public key to the partner, and have the partner wrap a random AES-256 key with the RSAES_OAEP_SHA_256 algorithm.", fr: "Créer une clé KMS RSA_4096 de chiffrement, remettre sa clé publique au partenaire, et faire envelopper par le partenaire une clé AES-256 aléatoire avec l'algorithme RSAES_OAEP_SHA_256." } }
    - { id: c, text: { en: "Create an ML_DSA_87 KMS key, give its public key to the partner, and have the partner encrypt a random AES-256 key with the ML-DSA public key before sending it.", fr: "Créer une clé KMS ML_DSA_87, remettre sa clé publique au partenaire, et faire chiffrer par le partenaire une clé AES-256 aléatoire avec la clé publique ML-DSA avant de l'envoyer." } }
    - { id: d, text: { en: "Create an ECC_NIST_P384 KMS key for key agreement, exchange public keys with the partner, and derive the shared secret with the KMS DeriveSharedSecret operation.", fr: "Créer une clé KMS ECC_NIST_P384 d'accord de clés, échanger les clés publiques avec le partenaire, et dériver le secret partagé avec l'opération KMS DeriveSharedSecret." } }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS KMS supports ML-KEM keys (FIPS 203) with the ENCAPSULATE_DECAPSULATE key usage, created and protected in FIPS 140-3 Level 3 validated HSMs. The partner uses the public key with its FIPS 203 library to produce a 32-byte shared secret and its encapsulated form, and AnyCompany recovers the same secret with Decapsulate; both sides then derive the AES-256 key from it."
    fr: "AWS KMS prend en charge les clés ML-KEM (FIPS 203) avec l'usage ENCAPSULATE_DECAPSULATE, créées et protégées dans des HSM validés FIPS 140-3 niveau 3. Le partenaire utilise la clé publique avec sa bibliothèque FIPS 203 pour produire un secret partagé de 32 octets et sa forme encapsulée, et AnyCompany récupère le même secret avec Decapsulate ; les deux parties en dérivent ensuite la clé AES-256."
  options:
    b:
      en: "RSA key transport relies on classical cryptography that a large quantum computer could break, so it is not quantum resistant."
      fr: "Le transport de clé RSA repose sur une cryptographie classique qu'un grand ordinateur quantique pourrait casser : il n'est pas résistant aux attaques quantiques."
    c:
      en: "ML-DSA keys are signing keys; they cannot encrypt data or establish a shared key."
      fr: "Les clés ML-DSA sont des clés de signature ; elles ne peuvent ni chiffrer des données ni établir une clé partagée."
    d:
      en: "ECDH key agreement on the P-384 curve is classical cryptography and is not quantum resistant."
      fr: "L'accord de clés ECDH sur la courbe P-384 relève de la cryptographie classique et n'est pas résistant aux attaques quantiques."
references:
  - title: Post-quantum keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/mldsa.html
  - title: Key spec reference
    url: https://docs.aws.amazon.com/kms/latest/developerguide/symm-asymm-choose-key-spec.html
