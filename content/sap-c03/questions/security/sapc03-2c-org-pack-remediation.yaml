id: sapc03-2c-org-pack-remediation
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has 200 accounts in AWS Organizations that run workloads in us-east-1 and eu-west-1. AWS Config records all supported resource types in every account and Region. The compliance team selected 12 AWS Config managed rules and wants every noncompliant Amazon S3 bucket or security group to be fixed automatically by AWS Systems Manager Automation runbooks. The rules and the remediation actions must be deployed from the security tooling account, which is the AWS Config delegated administrator, and must reach new accounts automatically when they join the organization. Administrators of member accounts must not be able to modify or delete the rules or the remediation actions. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution possède 200 comptes dans AWS Organizations qui exécutent des charges de travail dans us-east-1 et eu-west-1. AWS Config enregistre tous les types de ressources pris en charge dans chaque compte et chaque Région. L'équipe de conformité a sélectionné 12 règles gérées AWS Config et souhaite que chaque compartiment Amazon S3 ou groupe de sécurité non conforme soit corrigé automatiquement par des runbooks AWS Systems Manager Automation. Les règles et les actions de correction doivent être déployées depuis le compte d'outillage de sécurité, qui est l'administrateur délégué d'AWS Config, et doivent atteindre automatiquement les nouveaux comptes lorsqu'ils rejoignent l'organisation. Les administrateurs des comptes membres ne doivent pas pouvoir modifier ou supprimer les règles ni les actions de correction. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an organization-wide AWS Config aggregator in the security tooling account, then attach Systems Manager Automation remediation actions to the 12 rules as they appear in the aggregated view."
        fr: "Créer un agrégateur AWS Config à l'échelle de l'organisation dans le compte d'outillage de sécurité, puis associer des actions de correction Systems Manager Automation aux 12 règles telles qu'elles apparaissent dans la vue agrégée."
    - id: b
      text:
        en: "Call PutOrganizationConfigRule for each rule from the security tooling account, and deploy an Amazon EventBridge rule and an AWS Lambda remediation function to every account with CloudFormation StackSets."
        fr: "Appeler PutOrganizationConfigRule pour chaque règle depuis le compte d'outillage de sécurité, et déployer une règle Amazon EventBridge et une fonction de correction AWS Lambda dans chaque compte avec CloudFormation StackSets."
    - id: c
      text:
        en: "Write a conformance pack template with the 12 rules and their Automation remediation actions, and deploy it as an organization conformance pack from the security tooling account in us-east-1 and in eu-west-1."
        fr: "Écrire un modèle de pack de conformité contenant les 12 règles et leurs actions de correction Automation, et le déployer comme pack de conformité d'organisation depuis le compte d'outillage de sécurité dans us-east-1 et dans eu-west-1."
    - id: d
      text:
        en: "Write a conformance pack template with the 12 rules and their Automation remediation actions, and deploy it once as an organization conformance pack from the security tooling account in us-east-1."
        fr: "Écrire un modèle de pack de conformité contenant les 12 règles et leurs actions de correction Automation, et le déployer une seule fois comme pack de conformité d'organisation depuis le compte d'outillage de sécurité dans us-east-1."
answer: { optionId: c }
explanation:
  correct:
    en: "An organization conformance pack deploys a common set of AWS Config rules and remediation actions to all member accounts from the management account or a delegated administrator, deploys them to accounts that join later, and prevents member accounts from modifying them. The organization APIs are Region-specific, so the pack must be deployed once in each of the two Regions."
    fr: "Un pack de conformité d'organisation déploie un ensemble commun de règles AWS Config et d'actions de correction dans tous les comptes membres depuis le compte de gestion ou un administrateur délégué, le déploie dans les comptes qui rejoignent l'organisation par la suite et empêche les comptes membres de le modifier. Les API d'organisation sont propres à une Région : le pack doit donc être déployé une fois dans chacune des deux Régions."
  options:
    a:
      en: "Aggregators are read-only and give no mutating access to source accounts, so they cannot deploy rules or run remediation actions."
      fr: "Les agrégateurs sont en lecture seule et ne donnent aucun accès en écriture aux comptes sources : ils ne peuvent ni déployer de règles ni exécuter d'actions de correction."
    b:
      en: "This needs custom Lambda code and a second deployment mechanism to maintain in every account, which is more operational overhead than remediation actions packaged with the rules."
      fr: "Cette solution nécessite du code Lambda personnalisé et un second mécanisme de déploiement à maintenir dans chaque compte, ce qui représente plus de charge opérationnelle que des actions de correction intégrées aux règles."
    d:
      en: "Organization conformance packs are deployed per Region; a deployment in us-east-1 is not replicated to eu-west-1, so resources in eu-west-1 would not be evaluated or remediated."
      fr: "Les packs de conformité d'organisation sont déployés Région par Région ; un déploiement dans us-east-1 n'est pas répliqué dans eu-west-1, donc les ressources d'eu-west-1 ne seraient ni évaluées ni corrigées."
references:
  - title: Managing Conformance Packs for AWS Config Across all Accounts in Your Organization
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-pack-organization-apis.html
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
