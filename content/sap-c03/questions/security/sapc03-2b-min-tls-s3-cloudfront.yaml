id: sapc03-2b-min-tls-s3-cloudfront
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 120 member accounts in AWS Organizations. Partners in AWS accounts outside the organization read data from Amazon S3 buckets in many member accounts. Customers download content from Amazon CloudFront distributions that use custom domain names with ACM certificates. A new security standard requires TLS 1.2 or later for every request to the S3 buckets, whatever the account of the caller, and for every viewer connection to the distributions. Bucket owners must not be able to weaken the S3 control.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany dispose de 120 comptes membres dans AWS Organizations. Des partenaires, dont les comptes AWS sont hors de l'organisation, lisent des données dans des compartiments (buckets) Amazon S3 de nombreux comptes membres. Des clients téléchargent du contenu depuis des distributions Amazon CloudFront qui utilisent des noms de domaine personnalisés avec des certificats ACM. Une nouvelle norme de sécurité exige TLS 1.2 ou ultérieur pour chaque requête adressée aux compartiments S3, quel que soit le compte de l'appelant, et pour chaque connexion client aux distributions. Les propriétaires de compartiments ne doivent pas pouvoir affaiblir le contrôle S3.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach an SCP to the organization root that denies all S3 actions when the s3:TlsVersion condition key is less than 1.2.", fr: "Attacher à la racine de l'organisation une SCP qui refuse toutes les actions S3 lorsque la clé de condition s3:TlsVersion est inférieure à 1.2." } }
    - { id: b, text: { en: "Attach an RCP to the organization root that denies all S3 actions when the s3:TlsVersion condition key is less than 1.2.", fr: "Attacher à la racine de l'organisation une RCP qui refuse toutes les actions S3 lorsque la clé de condition s3:TlsVersion est inférieure à 1.2." } }
    - { id: c, text: { en: "Turn on S3 Block Public Access for all accounts so that Amazon S3 rejects requests that use a TLS version earlier than 1.2.", fr: "Activer S3 Block Public Access pour tous les comptes afin qu'Amazon S3 refuse les requêtes qui utilisent une version de TLS antérieure à 1.2." } }
    - { id: d, text: { en: "Set the viewer protocol policy of every cache behavior to HTTPS Only so that CloudFront rejects TLS 1.0 and TLS 1.1 connections.", fr: "Définir la politique de protocole client (viewer protocol policy) de chaque comportement de cache sur HTTPS Only afin que CloudFront refuse les connexions TLS 1.0 et TLS 1.1." } }
    - { id: e, text: { en: "Set the security policy of every distribution to TLSv1.2_2021 so that CloudFront negotiates only TLS 1.2 or later with viewers.", fr: "Définir la politique de sécurité de chaque distribution sur TLSv1.2_2021 afin que CloudFront ne négocie que TLS 1.2 ou ultérieur avec les clients." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "An RCP restricts access to resources in member accounts for every principal, including principals outside the organization, and a bucket policy cannot override it; s3:TlsVersion is a numeric condition key that reports the TLS version of the request. On CloudFront, the security policy of the distribution sets the minimum TLS version negotiated with viewers, and TLSv1.2_2021 requires TLS 1.2 or later."
    fr: "Une RCP restreint l'accès aux ressources des comptes membres pour tous les principaux, y compris ceux hors de l'organisation, et une politique de compartiment ne peut pas la contourner ; s3:TlsVersion est une clé de condition numérique qui indique la version TLS de la requête. Sur CloudFront, la politique de sécurité de la distribution fixe la version TLS minimale négociée avec les clients, et TLSv1.2_2021 exige TLS 1.2 ou ultérieur."
  options:
    a:
      en: "SCPs do not affect principals from accounts outside the organization, so the partners' requests would not be restricted."
      fr: "Les SCP n'affectent pas les principaux des comptes hors de l'organisation : les requêtes des partenaires ne seraient pas restreintes."
    c:
      en: "Block Public Access controls public access through ACLs and policies; it does not enforce a TLS version."
      fr: "Block Public Access contrôle l'accès public via les ACL et les politiques ; il n'impose aucune version de TLS."
    d:
      en: "HTTPS Only rejects plain HTTP but does not set the minimum TLS version, which comes from the distribution's security policy."
      fr: "HTTPS Only refuse le HTTP en clair mais ne fixe pas la version TLS minimale, qui dépend de la politique de sécurité de la distribution."
references:
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
  - title: Supported protocols and ciphers between viewers and CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/secure-connections-supported-viewer-protocols-ciphers.html
