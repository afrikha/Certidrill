id: sapc03-2d-threat-model-design
objective: "2.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany, a payments provider, is designing a new card-issuing platform that six product teams will build across separate AWS accounts in AWS Organizations. No code has been written yet; the architects have only data flow diagrams of the planned services. The CISO wants threats to be identified and mitigations prioritized before development starts, rather than discovered by tests after launch. The method must be structured and repeatable across the six teams. The result must be stored with the source code in a machine-readable form so that pull requests can show how it changes. It must also be revisited whenever the architecture changes significantly.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, un prestataire de paiement, conçoit une nouvelle plateforme d'émission de cartes que six équipes produit vont construire dans des comptes AWS distincts d'AWS Organizations. Aucun code n'a encore été écrit ; les architectes ne disposent que de diagrammes de flux de données des services prévus. Le RSSI veut que les menaces soient identifiées et les mesures d'atténuation priorisées avant le début du développement, plutôt que découvertes par des tests après le lancement. La méthode doit être structurée et reproductible pour les six équipes. Le résultat doit être stocké avec le code source sous une forme lisible par machine, afin que les demandes de tirage (pull requests) montrent son évolution. Il doit aussi être revu chaque fois que l'architecture change de façon importante.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Commission a penetration test of each service after the first production release, record the results as findings in AWS Security Hub, and repeat the test every year.", fr: "Commander un test d'intrusion de chaque service après la première mise en production, enregistrer les résultats comme résultats dans AWS Security Hub et répéter le test chaque année." }
    - id: b
      text: { en: "Threat model each team's data flow diagrams with the four-question frame and STRIDE in Threat Composer, commit the JSON export to the repository, and update it at each major change.", fr: "Modéliser les menaces des diagrammes de flux de données de chaque équipe avec le cadre des quatre questions et STRIDE dans Threat Composer, valider l'export JSON dans le dépôt et le mettre à jour à chaque changement majeur." }
    - id: c
      text: { en: "Enable Amazon GuardDuty and AWS Security Hub CSPM in every account of the organization, and use the aggregated findings in the delegated administrator account as the threat register of the platform.", fr: "Activer Amazon GuardDuty et AWS Security Hub CSPM dans tous les comptes de l'organisation, et utiliser les résultats agrégés dans le compte administrateur délégué comme registre des menaces de la plateforme." }
    - id: d
      text: { en: "Define the platform as a workload in the AWS Well-Architected Tool after go-live, answer the Security pillar questions once a year, and track the high-risk issues in the improvement plan.", fr: "Définir la plateforme comme charge de travail dans AWS Well-Architected Tool après la mise en service, répondre une fois par an aux questions du pilier Sécurité et suivre les problèmes à risque élevé dans le plan d'amélioration." }
answer: { optionId: b }
explanation:
  correct:
    en: "The Security pillar (SEC01-BP07) recommends threat modeling as early as the design phase, with a structured method such as the four-question frame and STRIDE applied to data flow diagrams. Threat Composer, an open-source AWS tool, writes threat statements and produces machine-readable threat models that can be kept as code and reviewed in pull requests. The threat model is a living document that is revisited after major changes."
    fr: "Le pilier Sécurité (SEC01-BP07) recommande de modéliser les menaces dès la phase de conception, avec une méthode structurée comme le cadre des quatre questions et STRIDE appliquée aux diagrammes de flux de données. Threat Composer, un outil AWS open source, rédige des énoncés de menace et produit des modèles de menaces lisibles par machine, conservables comme du code et relus dans les demandes de tirage. Le modèle de menaces est un document vivant, revu après chaque changement majeur."
  options:
    a:
      en: "A penetration test after release finds problems late, when they are most expensive to fix, which contradicts the requirement to identify threats before development."
      fr: "Un test d'intrusion après la mise en production trouve les problèmes tard, quand ils coûtent le plus cher à corriger, ce qui contredit l'exigence d'identifier les menaces avant le développement."
    c:
      en: "GuardDuty and Security Hub CSPM detect threats and misconfigurations in deployed resources; with no code written, there is nothing to detect, and findings are not a design-time threat model."
      fr: "GuardDuty et Security Hub CSPM détectent des menaces et des erreurs de configuration dans des ressources déployées ; sans code écrit, il n'y a rien à détecter, et des résultats ne constituent pas un modèle de menaces de conception."
    d:
      en: "A yearly Well-Architected review after go-live is generic best-practice questions, not a threat model of this system, and it happens after development instead of before."
      fr: "Une revue Well-Architected annuelle après la mise en service repose sur des questions génériques de bonnes pratiques, pas sur un modèle de menaces de ce système, et elle a lieu après le développement au lieu d'avant."
references:
  - title: SEC01-BP07 Identify threats and prioritize mitigations using a threat model
    url: https://docs.aws.amazon.com/wellarchitected/latest/security-pillar/sec_securely_operate_threat_model.html
