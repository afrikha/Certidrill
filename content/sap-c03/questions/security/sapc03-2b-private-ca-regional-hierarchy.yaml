id: sapc03-2b-private-ca-regional-hierarchy
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs workloads in us-east-1 and eu-west-1 across 60 accounts in AWS Organizations. Internal services use private TLS certificates that ACM issues and renews. All clients trust a single private root certificate, and the company does not want to distribute a second trust anchor. The workloads in each Region must be able to obtain and renew certificates even if the other Region is unavailable. The issuing CAs must be managed in a central PKI account and used by all workload accounts.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des charges de travail dans us-east-1 et eu-west-1 sur 60 comptes d'AWS Organizations. Les services internes utilisent des certificats TLS privés qu'ACM émet et renouvelle. Tous les clients approuvent un seul certificat racine privé, et l'entreprise ne veut pas distribuer une seconde ancre de confiance. Les charges de travail de chaque Région doivent pouvoir obtenir et renouveler des certificats même si l'autre Région est indisponible. Les CA émettrices doivent être gérées dans un compte PKI central et utilisées par tous les comptes de charge de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create one root CA and one subordinate CA in us-east-1 in the PKI account, share the subordinate CA with the organization in AWS RAM, and request certificates in both Regions from it.", fr: "Créer une CA racine et une CA subordonnée dans us-east-1 dans le compte PKI, partager la CA subordonnée avec l'organisation dans AWS RAM, et demander les certificats des deux Régions à partir d'elle." } }
    - { id: b, text: { en: "Create a root CA and a subordinate CA in each Region in the PKI account, and share both subordinate CAs with the organization in AWS RAM.", fr: "Créer une CA racine et une CA subordonnée dans chaque Région dans le compte PKI, et partager les deux CA subordonnées avec l'organisation dans AWS RAM." } }
    - { id: c, text: { en: "Create one root CA in the PKI account, create in each Region a subordinate CA whose certificate the root CA signs, and share each subordinate CA with the organization in AWS RAM.", fr: "Créer une seule CA racine dans le compte PKI, créer dans chaque Région une CA subordonnée dont le certificat est signé par la CA racine, et partager chaque CA subordonnée avec l'organisation dans AWS RAM." } }
    - { id: d, text: { en: "Create one root CA in the PKI account, create a subordinate CA in short-lived certificate mode in each Region, and share them with the organization in AWS RAM.", fr: "Créer une seule CA racine dans le compte PKI, créer une CA subordonnée en mode certificats de courte durée dans chaque Région, et les partager avec l'organisation dans AWS RAM." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Private CAs are Regional resources that cannot be copied between Regions, so each Region needs its own issuing CA to stay independent of the other Region. Signing both subordinate CAs with the same root keeps a single trust anchor, and sharing each subordinate CA through AWS RAM lets every workload account request managed ACM certificates from the CA in its Region."
    fr: "Les CA privées sont des ressources Régionales qui ne peuvent pas être copiées entre Régions : chaque Région a donc besoin de sa propre CA émettrice pour rester indépendante de l'autre. Faire signer les deux CA subordonnées par la même racine conserve une seule ancre de confiance, et le partage de chaque CA subordonnée via AWS RAM permet à chaque compte de charge de travail de demander des certificats ACM gérés à la CA de sa Région."
  options:
    a:
      en: "A single issuing CA lives only in us-east-1, so an outage of that Region would also stop issuance and renewal for eu-west-1."
      fr: "Une seule CA émettrice n'existe que dans us-east-1 : une panne de cette Région arrêterait aussi l'émission et le renouvellement pour eu-west-1."
    b:
      en: "Two root CAs create a second trust anchor that every client would have to trust, which the company refuses."
      fr: "Deux CA racines créent une seconde ancre de confiance que chaque client devrait approuver, ce que l'entreprise refuse."
    d:
      en: "ACM cannot issue certificates signed by a CA in short-lived certificate mode, so ACM could no longer issue and renew the certificates."
      fr: "ACM ne peut pas émettre de certificats signés par une CA en mode certificats de courte durée : ACM ne pourrait plus émettre ni renouveler les certificats."
references:
  - title: What is AWS Private CA?
    url: https://docs.aws.amazon.com/privateca/latest/userguide/PcaWelcome.html
  - title: Attach a policy for cross-account access
    url: https://docs.aws.amazon.com/privateca/latest/userguide/pca-ram.html
