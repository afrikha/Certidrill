id: sapc03-2b-alb-mtls-verify-partners
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany provides a B2B ordering API to 300 partner companies. The API runs on Amazon ECS tasks behind an Application Load Balancer. Each partner authenticates with a client certificate that AnyCompany issues from its AWS Private CA, and partners must keep using these certificates. When a partner contract ends, its certificate is revoked and must be refused immediately. The application must receive the identity of the calling partner but must not implement certificate validation itself.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany fournit une API de commande B2B à 300 entreprises partenaires. L'API s'exécute sur des tâches Amazon ECS derrière un Application Load Balancer. Chaque partenaire s'authentifie avec un certificat client qu'AnyCompany émet à partir de son AWS Private CA, et les partenaires doivent continuer d'utiliser ces certificats. Lorsqu'un contrat partenaire prend fin, son certificat est révoqué et doit être refusé immédiatement. L'application doit recevoir l'identité du partenaire appelant mais ne doit pas mettre en œuvre elle-même la validation des certificats.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Configure mutual TLS in verify mode with a trust store that holds the CA bundle and revocation list, and read the partner identity from the X-Amzn-Mtls-Clientcert-Subject header.", fr: "Configurer le TLS mutuel en mode vérification (verify) avec un magasin d'approbations contenant le bundle de CA et la liste de révocation, et lire l'identité du partenaire dans l'en-tête X-Amzn-Mtls-Clientcert-Subject." } }
    - { id: b, text: { en: "Configure mutual TLS in passthrough mode on the HTTPS listener, and validate the certificate chain and revocation status in the application from the X-Amzn-Mtls-Clientcert header.", fr: "Configurer le TLS mutuel en mode passthrough sur l'écouteur HTTPS, et valider dans l'application la chaîne de certificats et l'état de révocation à partir de l'en-tête X-Amzn-Mtls-Clientcert." } }
    - { id: c, text: { en: "Replace the Application Load Balancer with a Network Load Balancer TCP listener, and terminate mutual TLS in a sidecar proxy container in each task that checks the revocation list.", fr: "Remplacer l'Application Load Balancer par un écouteur TCP de Network Load Balancer, et terminer le TLS mutuel dans un conteneur proxy sidecar de chaque tâche qui vérifie la liste de révocation." } }
    - { id: d, text: { en: "Keep a standard HTTPS listener, and have each ECS task request the client certificate during the TLS handshake and check its status against AWS Private CA.", fr: "Conserver un écouteur HTTPS standard, et faire demander par chaque tâche ECS le certificat client pendant la négociation TLS pour vérifier son état auprès d'AWS Private CA." } }
answer: { optionId: a }
explanation:
  correct:
    en: "In verify mode, the Application Load Balancer performs X.509 client certificate authentication against the CA bundle of its trust store, optionally with revocation checks, before traffic reaches the targets. It then passes the validated certificate details, such as the subject, issuer, and serial number, to the targets in X-Amzn-Mtls-Clientcert-* headers."
    fr: "En mode vérification, l'Application Load Balancer authentifie le certificat client X.509 par rapport au bundle de CA de son magasin d'approbations, éventuellement avec contrôle de révocation, avant que le trafic n'atteigne les cibles. Il transmet ensuite aux cibles les détails du certificat validé, comme le sujet, l'émetteur et le numéro de série, dans les en-têtes X-Amzn-Mtls-Clientcert-*."
  options:
    b:
      en: "In passthrough mode, the load balancer forwards the client certificate chain without verifying it, so the application would have to implement the validation."
      fr: "En mode passthrough, l'équilibreur de charge transmet la chaîne de certificats client sans la vérifier : l'application devrait donc mettre en œuvre la validation."
    c:
      en: "A sidecar proxy in every task is custom TLS infrastructure that the team must build, patch, and operate, which is more overhead than a managed listener feature."
      fr: "Un proxy sidecar dans chaque tâche est une infrastructure TLS personnalisée à construire, corriger et exploiter, soit plus de charge qu'une fonctionnalité d'écouteur gérée."
    d:
      en: "A standard HTTPS listener terminates TLS, so the client certificate never reaches the tasks, and validation in the tasks would be custom code."
      fr: "Un écouteur HTTPS standard termine TLS : le certificat client n'atteint donc jamais les tâches, et une validation dans les tâches serait du code personnalisé."
references:
  - title: Mutual authentication with TLS in Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/mutual-authentication.html
