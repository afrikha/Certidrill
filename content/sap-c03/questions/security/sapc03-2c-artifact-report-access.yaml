id: sapc03-2c-artifact-report-access
objective: "2.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company gives an external audit firm access to a dedicated audit account through an AWS IAM Identity Center permission set. The auditors must download AWS SOC and ISO reports from AWS Artifact themselves, so that they always get the latest versions and accept the report terms individually. Under the engagement letter, the auditors must not be able to download any other report series, including PCI reports, and must not be able to view or accept agreements. The company wants to follow the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers donne à un cabinet d'audit externe l'accès à un compte d'audit dédié au moyen d'un ensemble d'autorisations AWS IAM Identity Center. Les auditeurs doivent télécharger eux-mêmes les rapports SOC et ISO d'AWS dans AWS Artifact, afin d'obtenir toujours les dernières versions et d'accepter individuellement les conditions des rapports. Selon la lettre de mission, les auditeurs ne doivent pouvoir télécharger aucune autre série de rapports, y compris les rapports PCI, et ne doivent pouvoir ni consulter ni accepter d'accords. L'entreprise veut respecter le principe du moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach the AWSArtifactReportsReadOnlyAccess managed policy to the permission set, and add a deny statement for all agreement actions."
        fr: "Attacher la politique gérée AWSArtifactReportsReadOnlyAccess à l'ensemble d'autorisations, et ajouter une instruction de refus pour toutes les actions sur les accords."
    - id: b
      text:
        en: "Allow artifact:ListReports, and allow the report get and term actions with an artifact:ReportCategory condition equal to Certifications and Attestations."
        fr: "Autoriser artifact:ListReports, et autoriser les actions d'obtention et de conditions des rapports avec une condition artifact:ReportCategory égale à Certifications and Attestations."
    - id: c
      text:
        en: "Allow artifact:ListReports, and allow the report get and term actions with an artifact:ReportSeries condition that matches only the SOC and ISO series."
        fr: "Autoriser artifact:ListReports, et autoriser les actions d'obtention et de conditions des rapports avec une condition artifact:ReportSeries qui ne correspond qu'aux séries SOC et ISO."
    - id: d
      text:
        en: "Have a compliance analyst download the SOC and ISO reports each quarter and share them with the auditors through presigned URLs to an S3 bucket in the audit account."
        fr: "Faire télécharger chaque trimestre les rapports SOC et ISO par un analyste conformité et les partager avec les auditeurs par des URL présignées vers un compartiment S3 du compte d'audit."
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Artifact supports fine-grained permissions for reports: artifact:ListReports is granted separately, and actions such as artifact:GetReportMetadata, artifact:GetReport, artifact:GetTermForReport and artifact:ListReportVersions can be limited with the artifact:ReportSeries and artifact:ReportCategory condition keys. A ReportSeries condition limited to SOC and ISO gives exactly the required access, and no agreement action is granted."
    fr: "AWS Artifact prend en charge des autorisations précises pour les rapports : artifact:ListReports est accordé séparément, et des actions comme artifact:GetReportMetadata, artifact:GetReport, artifact:GetTermForReport et artifact:ListReportVersions peuvent être limitées avec les clés de condition artifact:ReportSeries et artifact:ReportCategory. Une condition ReportSeries limitée à SOC et ISO donne exactement l'accès requis, et aucune action sur les accords n'est accordée."
  options:
    a:
      en: "The managed policy allows access to all reports, including PCI reports, so it grants more than the engagement letter allows."
      fr: "La politique gérée autorise l'accès à tous les rapports, y compris les rapports PCI : elle accorde plus que ce que permet la lettre de mission."
    b:
      en: "The Certifications and Attestations category contains several report series, including PCI, so the auditors could download PCI reports."
      fr: "La catégorie Certifications and Attestations contient plusieurs séries de rapports, dont PCI : les auditeurs pourraient télécharger des rapports PCI."
    d:
      en: "Copies shared by the company can be outdated and bypass the requirement for the auditors to download reports and accept the terms themselves."
      fr: "Les copies partagées par l'entreprise peuvent être obsolètes et contournent l'exigence que les auditeurs téléchargent les rapports et acceptent eux-mêmes les conditions."
references:
  - title: Example IAM policies for AWS Artifact in commercial AWS Regions
    url: https://docs.aws.amazon.com/artifact/latest/ug/example-iam-policies.html
