id: sapc03-2a-eks-pod-identity-steps
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is deploying a new Amazon EKS cluster that runs on managed node groups of Linux Amazon EC2 instances. EKS Auto Mode is not used. An order service runs in the orders namespace with a Kubernetes service account named orders-api. The service must write to an Amazon DynamoDB table in the same AWS account by using temporary credentials from an IAM role named OrdersTableWriter. The role's trust policy already allows the pods.eks.amazonaws.com service principal to call sts:AssumeRole and sts:TagSession, and its permissions policy allows only the required DynamoDB actions on the table. The company wants to use EKS Pod Identity.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany déploie un nouveau cluster Amazon EKS qui s'exécute sur des groupes de nœuds gérés d'instances Amazon EC2 Linux. EKS Auto Mode n'est pas utilisé. Un service de commandes s'exécute dans l'espace de noms orders avec un compte de service Kubernetes nommé orders-api. Le service doit écrire dans une table Amazon DynamoDB du même compte AWS à l'aide d'informations d'identification temporaires d'un rôle IAM nommé OrdersTableWriter. La politique d'approbation du rôle autorise déjà le principal de service pods.eks.amazonaws.com à appeler sts:AssumeRole et sts:TagSession, et sa politique d'autorisations n'autorise que les actions DynamoDB nécessaires sur la table. L'entreprise veut utiliser EKS Pod Identity.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an IAM OIDC identity provider for the OIDC issuer URL of the cluster."
        fr: "Créer un fournisseur d'identité OIDC IAM pour l'URL d'émetteur OIDC du cluster."
    - id: b
      text:
        en: "Install the Amazon EKS Pod Identity Agent add-on on the cluster."
        fr: "Installer le module complémentaire Amazon EKS Pod Identity Agent sur le cluster."
    - id: c
      text:
        en: "Annotate the orders-api service account with eks.amazonaws.com/role-arn set to the ARN of OrdersTableWriter."
        fr: "Annoter le compte de service orders-api avec eks.amazonaws.com/role-arn défini sur l'ARN d'OrdersTableWriter."
    - id: d
      text:
        en: "Create a pod identity association that maps the orders namespace and the orders-api service account to OrdersTableWriter."
        fr: "Créer une association d'identité de pod qui associe l'espace de noms orders et le compte de service orders-api à OrdersTableWriter."
    - id: e
      text:
        en: "Create an EKS access entry for OrdersTableWriter with an access policy that is scoped to the orders namespace."
        fr: "Créer une entrée d'accès EKS pour OrdersTableWriter avec une politique d'accès limitée à l'espace de noms orders."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "EKS Pod Identity needs the Pod Identity Agent, which runs as a DaemonSet on the nodes and gives credentials to pods on the same node, and an association between a namespace and service account and the IAM role. With the trust policy already in place, these two steps let pods that use orders-api receive the role's temporary credentials."
    fr: "EKS Pod Identity a besoin de l'agent Pod Identity, qui s'exécute comme DaemonSet sur les nœuds et fournit des informations d'identification aux pods du même nœud, et d'une association entre un espace de noms et un compte de service et le rôle IAM. La politique d'approbation étant déjà en place, ces deux étapes permettent aux pods qui utilisent orders-api de recevoir les informations d'identification temporaires du rôle."
  options:
    a:
      en: "An IAM OIDC identity provider is part of IAM roles for service accounts; EKS Pod Identity does not use OIDC identity providers."
      fr: "Un fournisseur d'identité OIDC IAM relève des rôles IAM pour les comptes de service ; EKS Pod Identity n'utilise pas de fournisseurs d'identité OIDC."
    c:
      en: "The role-arn annotation configures IRSA; Pod Identity uses associations that are managed in Amazon EKS instead of annotations."
      fr: "L'annotation role-arn configure IRSA ; Pod Identity utilise des associations gérées dans Amazon EKS au lieu d'annotations."
    e:
      en: "Access entries give IAM principals access to the Kubernetes API of the cluster; they do not give pods AWS credentials."
      fr: "Les entrées d'accès donnent aux principaux IAM l'accès à l'API Kubernetes du cluster ; elles ne fournissent pas d'informations d'identification AWS aux pods."
references:
  - title: Learn how EKS Pod Identity grants pods access to AWS services
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
  - title: Create IAM role with trust policy required by EKS Pod Identity
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-id-role.html
