id: sapc03-2d-runtime-jwt-inbound
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company is moving its customer-facing trip-planning agent to Amazon Bedrock AgentCore Runtime. Customers sign in to the company's single-page web application through an existing third-party OIDC identity provider that publishes a standard discovery document. The web application calls the agent endpoint directly from the browser with the customer's access token. The security team requires that only tokens issued to the web application's client ID are accepted and that no AWS credentials are ever delivered to browsers. The platform team wants no extra infrastructure to build or operate in front of the runtime.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de voyages migre son agent de planification de voyages destiné aux clients vers Amazon Bedrock AgentCore Runtime. Les clients se connectent à l'application web monopage de l'entreprise par un fournisseur d'identité OIDC tiers existant qui publie un document de découverte standard. L'application web appelle le point de terminaison de l'agent directement depuis le navigateur avec le jeton d'accès du client. L'équipe de sécurité exige que seuls les jetons émis pour l'ID client de l'application web soient acceptés et qu'aucun identifiant AWS ne soit jamais remis aux navigateurs. L'équipe plateforme ne veut aucune infrastructure supplémentaire à construire ou à exploiter devant le runtime.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Federate the OIDC provider with an Amazon Cognito identity pool, give browsers temporary credentials for a role that can invoke the runtime, and keep the default IAM SigV4 inbound authentication.", fr: "Fédérer le fournisseur OIDC avec un groupe d'identités Amazon Cognito, donner aux navigateurs des identifiants temporaires d'un rôle autorisé à appeler le runtime, et conserver l'authentification entrante IAM SigV4 par défaut." }
    - id: b
      text: { en: "Put Amazon API Gateway in front of the runtime with an AWS Lambda authorizer that validates the token, and have an integration function invoke the runtime with SigV4 through its own IAM role.", fr: "Placer Amazon API Gateway devant le runtime avec un mécanisme d'autorisation AWS Lambda qui valide le jeton, et faire appeler le runtime en SigV4 par une fonction d'intégration avec son propre rôle IAM." }
    - id: c
      text: { en: "Keep SigV4 inbound authentication, have a backend sign each call with a shared IAM role, and pass the customer identifier in the X-Amzn-Bedrock-AgentCore-Runtime-User-Id header.", fr: "Conserver l'authentification entrante SigV4, faire signer chaque appel par un backend avec un rôle IAM partagé, et transmettre l'identifiant du client dans l'en-tête X-Amzn-Bedrock-AgentCore-Runtime-User-Id." }
    - id: d
      text: { en: "Configure the runtime's inbound authorization with a custom JWT authorizer that uses the identity provider's discovery URL and lists the web application's client ID in the allowed clients.", fr: "Configurer l'autorisation entrante du runtime avec un mécanisme d'autorisation JWT personnalisé qui utilise l'URL de découverte du fournisseur d'identité et liste l'ID client de l'application web dans les clients autorisés." }
answer: { optionId: d }
explanation:
  correct:
    en: "AgentCore Runtime accepts either IAM SigV4 or JWT bearer tokens for inbound authentication. A custom JWT authorizer validates the token issuer through the OIDC discovery URL and checks the client_id claim against the allowed clients, so the browser calls the runtime with its access token and no AWS credentials or extra service are involved."
    fr: "AgentCore Runtime accepte soit IAM SigV4, soit des jetons porteurs JWT pour l'authentification entrante. Un mécanisme d'autorisation JWT personnalisé valide l'émetteur du jeton par l'URL de découverte OIDC et compare la revendication client_id aux clients autorisés : le navigateur appelle le runtime avec son jeton d'accès, sans identifiants AWS ni service supplémentaire."
  options:
    a:
      en: "An identity pool delivers temporary AWS credentials to the browser, which the security team forbids."
      fr: "Un groupe d'identités remet des identifiants AWS temporaires au navigateur, ce que l'équipe de sécurité interdit."
    b:
      en: "API Gateway, a Lambda authorizer and an integration function work, but they are extra infrastructure to build and operate when the runtime can validate JWTs itself."
      fr: "API Gateway, un mécanisme d'autorisation Lambda et une fonction d'intégration fonctionnent, mais ce sont des composants supplémentaires à construire et à exploiter alors que le runtime peut valider lui-même les JWT."
    c:
      en: "AgentCore does not verify the User-Id header, which is meant for quick starts; a backend with a shared role is extra infrastructure, and the token's client ID is never checked."
      fr: "AgentCore ne vérifie pas l'en-tête User-Id, prévu pour les démarrages rapides ; un backend avec un rôle partagé est une infrastructure supplémentaire, et l'ID client du jeton n'est jamais contrôlé."
references:
  - title: Authenticate and authorize with Inbound Auth and Outbound Auth
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-oauth.html
