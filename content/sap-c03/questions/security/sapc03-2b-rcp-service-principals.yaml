id: sapc03-2b-rcp-service-principals
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany attached an RCP to the root of its organization. The RCP denies all Amazon S3 actions when aws:PrincipalOrgID does not equal the organization ID. Soon after, AWS CloudTrail and AWS Config stopped delivering log files and configuration snapshots to the S3 buckets in the log archive account. The security team must restore the deliveries. AWS services must still be prevented from accessing the buckets on behalf of accounts outside the organization.

    Which change to the RCP will meet these requirements?
  fr: |
    AnyCompany a attaché une RCP à la racine de son organisation. La RCP refuse toutes les actions Amazon S3 lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation. Peu après, AWS CloudTrail et AWS Config ont cessé de livrer les fichiers journaux et les instantanés de configuration dans les compartiments S3 du compte d'archive des journaux. L'équipe de sécurité doit rétablir les livraisons. Les services AWS doivent toujours être empêchés d'accéder aux compartiments pour le compte de comptes hors de l'organisation.

    Quelle modification de la RCP répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add a NotPrincipal element to the existing Deny statement that lists the cloudtrail.amazonaws.com and config.amazonaws.com service principals as exceptions.", fr: "Ajouter à l'instruction Deny existante un élément NotPrincipal qui liste les principaux de service cloudtrail.amazonaws.com et config.amazonaws.com comme exceptions." } }
    - { id: b, text: { en: "Add an Allow statement to the RCP for the cloudtrail.amazonaws.com and config.amazonaws.com service principals on the buckets of the log archive account.", fr: "Ajouter à la RCP une instruction Allow pour les principaux de service cloudtrail.amazonaws.com et config.amazonaws.com sur les compartiments du compte d'archive des journaux." } }
    - { id: c, text: { en: "Add a condition so that the Deny statement does not apply when aws:PrincipalIsAWSService is true, and add no other statement.", fr: "Ajouter une condition pour que l'instruction Deny ne s'applique pas lorsque aws:PrincipalIsAWSService est true, sans ajouter d'autre instruction." } }
    - { id: d, text: { en: "Exempt service principals with aws:PrincipalIsAWSService from the Deny statement, and add a Deny for service principals whose aws:SourceOrgID is not the organization ID.", fr: "Exempter les principaux de service de l'instruction Deny avec aws:PrincipalIsAWSService, et ajouter un Deny pour les principaux de service dont aws:SourceOrgID n'est pas l'ID de l'organisation." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Service principals do not belong to the organization, so the identity perimeter must exempt them with aws:PrincipalIsAWSService, because NotPrincipal cannot be used with service principals. AWS data perimeter guidance then uses aws:SourceOrgID in RCPs to ensure that AWS services access the resources only on behalf of the organization."
    fr: "Les principaux de service n'appartiennent pas à l'organisation : le périmètre d'identité doit donc les exempter avec aws:PrincipalIsAWSService, car NotPrincipal ne peut pas être utilisé avec des principaux de service. Les recommandations AWS sur le périmètre de données utilisent ensuite aws:SourceOrgID dans les RCP pour garantir que les services AWS n'accèdent aux ressources que pour le compte de l'organisation."
  options:
    a:
      en: "RCPs do not support the NotPrincipal element; the Principal element can only be *."
      fr: "Les RCP ne prennent pas en charge l'élément NotPrincipal ; l'élément Principal ne peut valoir que *."
    b:
      en: "Custom RCPs can contain only Deny statements; Allow is supported only in the RCPFullAWSAccess policy, and RCPs never grant permissions."
      fr: "Les RCP personnalisées ne peuvent contenir que des instructions Deny ; Allow n'est pris en charge que dans la politique RCPFullAWSAccess, et les RCP n'accordent jamais d'autorisations."
    c:
      en: "Exempting all service principals without another check lets AWS services act on the buckets on behalf of accounts outside the organization."
      fr: "Exempter tous les principaux de service sans autre contrôle permet aux services AWS d'agir sur les compartiments pour le compte de comptes hors de l'organisation."
references:
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
  - title: RCP syntax
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps_syntax.html
