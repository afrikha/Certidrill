id: sapc03-2c-ct-cross-region-networking
objective: "2.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A French public health operator uses AWS Control Tower. A new Regulated OU will host workloads that must remain in eu-west-3, while other OUs use several Regions. The security architect is concerned that even with a Region restriction, engineers could create a VPC peering connection or a transit gateway peering attachment from eu-west-3 to a VPC in another Region, or publish data through Amazon CloudFront, which would move data out of eu-west-3. The workloads in the Regulated OU do not use VPC peering, transit gateway peering, CloudFront, or AWS Global Accelerator. The controls must be preventive and managed by Control Tower.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un opérateur public de santé français utilise AWS Control Tower. Une nouvelle OU Regulated hébergera des charges de travail qui doivent rester dans eu-west-3, tandis que les autres OU utilisent plusieurs Régions. L'architecte sécurité craint que, même avec une restriction de Région, des ingénieurs puissent créer une connexion de peering VPC ou un attachement de peering de passerelle de transit depuis eu-west-3 vers un VPC d'une autre Région, ou publier des données par Amazon CloudFront, ce qui ferait sortir des données d'eu-west-3. Les charges de travail de l'OU Regulated n'utilisent ni le peering VPC, ni le peering de passerelle de transit, ni CloudFront, ni AWS Global Accelerator. Les contrôles doivent être préventifs et gérés par Control Tower.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable the OU-level Region deny control CT.MULTISERVICE.PV.1 on the Regulated OU with eu-west-3 as the only allowed Region."
        fr: "Activer le contrôle Region deny de niveau OU CT.MULTISERVICE.PV.1 sur l'OU Regulated avec eu-west-3 comme seule Région autorisée."
    - id: b
      text:
        en: "Turn on the landing zone Region deny setting, and keep only eu-west-3 and the home Region as the Regions where workloads can be deployed."
        fr: "Activer le paramètre Region deny de la zone d'atterrissage, et ne conserver qu'eu-west-3 et la Région d'origine comme Régions où les charges de travail peuvent être déployées."
    - id: c
      text:
        en: "Enable the data residency control that disallows cross-Region networking for EC2, CloudFront, and Global Accelerator on the Regulated OU."
        fr: "Activer sur l'OU Regulated le contrôle de résidence des données qui interdit le réseau entre Régions pour EC2, CloudFront et Global Accelerator."
    - id: d
      text:
        en: "Enable the data residency control that disallows AWS Site-to-Site VPN and AWS Client VPN connections on the Regulated OU."
        fr: "Activer sur l'OU Regulated le contrôle de résidence des données qui interdit les connexions AWS Site-to-Site VPN et AWS Client VPN."
    - id: e
      text:
        en: "Deploy AWS Network Firewall in an inspection VPC in eu-west-3, and route all traffic of the Regulated OU through it with a transit gateway."
        fr: "Déployer AWS Network Firewall dans un VPC d'inspection d'eu-west-3, et acheminer tout le trafic de l'OU Regulated par ce pare-feu avec une passerelle de transit."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "CT.MULTISERVICE.PV.1 restricts the chosen OU to the allowed Regions. A peering request is made in eu-west-3, so a Region restriction alone does not stop it; the data residency control for cross-Region networking is an SCP that denies creating and accepting VPC peering and transit gateway peering, and creating or updating CloudFront distributions and Global Accelerator resources. It also blocks peering inside one Region, which these workloads do not use."
    fr: "CT.MULTISERVICE.PV.1 limite l'OU choisie aux Régions autorisées. Une demande de peering est faite dans eu-west-3 : une restriction de Région seule ne l'arrête pas ; le contrôle de résidence des données pour le réseau entre Régions est une SCP qui refuse la création et l'acceptation de peering VPC et de peering de passerelle de transit, ainsi que la création ou la mise à jour de distributions CloudFront et de ressources Global Accelerator. Il bloque aussi le peering au sein d'une même Région, que ces charges de travail n'utilisent pas."
  options:
    b:
      en: "The landing zone setting applies to all top-level OUs, so it would also restrict the other OUs that need several Regions."
      fr: "Le paramètre de la zone d'atterrissage s'applique à toutes les OU de premier niveau : il restreindrait aussi les autres OU qui ont besoin de plusieurs Régions."
    d:
      en: "VPN connections link a VPC to on-premises networks or clients; blocking them does not address cross-Region peering or CloudFront."
      fr: "Les connexions VPN relient un VPC à des réseaux sur site ou à des clients ; les bloquer ne traite ni le peering entre Régions ni CloudFront."
    e:
      en: "A firewall inspects traffic but does not prevent engineers from creating peering connections or CloudFront distributions, and it is not a Control Tower control."
      fr: "Un pare-feu inspecte le trafic mais n'empêche pas les ingénieurs de créer des connexions de peering ou des distributions CloudFront, et ce n'est pas un contrôle Control Tower."
references:
  - title: Controls that enhance data residency protection
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/data-residency-controls.html
  - title: Configure the Region deny control
    url: https://docs.aws.amazon.com/controltower/latest/userguide/region-deny.html
