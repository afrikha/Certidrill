id: sapc03-2c-ecr-continuous-cicd
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A fintech company runs containerized services on Amazon EKS and on Amazon ECS with AWS Fargate in several workload accounts. All container images are stored in Amazon ECR private repositories in a shared services account, and images are built by pipelines that run in GitHub Actions. The security team has two requirements. First, images that are already stored in ECR must be rescanned automatically when a new vulnerability that affects them is published, and the team must be able to see which vulnerable images are running in the clusters. Second, every build must produce a vulnerability report for the image before the image is pushed to ECR.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise fintech exécute des services conteneurisés sur Amazon EKS et sur Amazon ECS avec AWS Fargate dans plusieurs comptes de charge de travail. Toutes les images de conteneur sont stockées dans des référentiels privés Amazon ECR d'un compte de services partagés, et les images sont construites par des pipelines qui s'exécutent dans GitHub Actions. L'équipe de sécurité a deux exigences. D'une part, les images déjà stockées dans ECR doivent être analysées à nouveau automatiquement lorsqu'une nouvelle vulnérabilité qui les concerne est publiée, et l'équipe doit pouvoir voir quelles images vulnérables s'exécutent dans les clusters. D'autre part, chaque build doit produire un rapport de vulnérabilités de l'image avant que l'image ne soit envoyée dans ECR.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Turn on Amazon ECR basic scanning with scan on push for all repositories in the shared services account, and rescan images manually."
        fr: "Activer l'analyse de base d'Amazon ECR avec analyse lors de l'envoi pour tous les référentiels du compte de services partagés, et réanalyser les images manuellement."
    - id: b
      text:
        en: "Activate Amazon Inspector ECR scanning in the shared services account and configure the repositories for continuous scanning."
        fr: "Activer l'analyse ECR d'Amazon Inspector dans le compte de services partagés et configurer les référentiels pour l'analyse continue."
    - id: c
      text:
        en: "Activate Amazon Inspector Lambda code scanning in the shared services account and in each workload account of the organization."
        fr: "Activer l'analyse du code Lambda d'Amazon Inspector dans le compte de services partagés et dans chaque compte de charge de travail de l'organisation."
    - id: d
      text:
        en: "Create Amazon Inspector CIS scan configurations that target the EKS worker nodes in the workload accounts on a weekly schedule."
        fr: "Créer des configurations d'analyse CIS Amazon Inspector qui ciblent chaque semaine les nœuds de travail EKS des comptes de charge de travail."
    - id: e
      text:
        en: "Add the Amazon Inspector Scans action to the GitHub Actions workflows so that it generates an SBOM and calls the Inspector Scan API."
        fr: "Ajouter l'action Amazon Inspector Scans aux workflows GitHub Actions afin qu'elle génère un SBOM et appelle l'API Inspector Scan."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Inspector enhanced scanning with continuous scanning rescans images when a new relevant CVE is added to its database, and it maps images to running containers in Amazon ECS and Amazon EKS, including Fargate. The CI/CD integration runs the Inspector SBOM Generator on the built image and sends the SBOM to the Inspector Scan API, which returns a vulnerability report before the image is deployed or pushed."
    fr: "L'analyse améliorée d'Inspector avec analyse continue réanalyse les images lorsqu'une nouvelle CVE pertinente est ajoutée à sa base de données, et elle associe les images aux conteneurs en cours d'exécution dans Amazon ECS et Amazon EKS, y compris Fargate. L'intégration CI/CD exécute le générateur de SBOM d'Inspector sur l'image construite et envoie le SBOM à l'API Inspector Scan, qui renvoie un rapport de vulnérabilités avant le déploiement ou l'envoi de l'image."
  options:
    a:
      en: "Basic scanning runs only on push or manually, so stored images are not rescanned when new CVEs are published, and it does not show which images are running."
      fr: "L'analyse de base ne s'exécute qu'à l'envoi ou manuellement : les images stockées ne sont pas réanalysées à la publication de nouvelles CVE, et elle n'indique pas quelles images s'exécutent."
    c:
      en: "Lambda code scanning analyzes the code of Lambda functions and layers, not container images used by EKS or ECS."
      fr: "L'analyse du code Lambda porte sur le code des fonctions et couches Lambda, pas sur les images de conteneur utilisées par EKS ou ECS."
    d:
      en: "CIS scans check the operating system settings of EC2 instances against CIS benchmarks; they do not scan container images, and Fargate has no worker nodes to target."
      fr: "Les analyses CIS comparent les paramètres du système d'exploitation des instances EC2 aux benchmarks CIS ; elles n'analysent pas les images de conteneur, et Fargate n'a pas de nœuds de travail à cibler."
references:
  - title: Scanning Amazon Elastic Container Registry container images with Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-ecr.html
  - title: Integrating Amazon Inspector scans into your CI/CD pipeline
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-cicd.html
