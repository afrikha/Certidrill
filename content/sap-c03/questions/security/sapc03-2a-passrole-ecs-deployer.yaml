id: sapc03-2a-passrole-ecs-deployer
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's central CI/CD account deploys Amazon ECS services into 30 workload accounts by assuming a Deployer role in each account. In each workload account, the application task roles are created by the security team under the IAM path /app-task/. The Deployer role must register task definitions that reference these task roles. A threat model shows that a compromised pipeline could pass a privileged role, such as an administrator role, to a task, or pass a task role to Amazon EC2 or AWS Lambda to escalate privileges. The Deployer role must not create IAM roles.

    Which permissions should the Deployer role have, in addition to the required Amazon ECS actions?
  fr: |
    Le compte CI/CD central d'AnyCompany déploie des services Amazon ECS dans 30 comptes de charge de travail en endossant un rôle Deployer dans chaque compte. Dans chaque compte de charge de travail, les rôles de tâche applicatifs sont créés par l'équipe de sécurité sous le chemin IAM /app-task/. Le rôle Deployer doit enregistrer des définitions de tâche qui référencent ces rôles de tâche. Une modélisation des menaces montre qu'un pipeline compromis pourrait transmettre un rôle privilégié, par exemple un rôle d'administrateur, à une tâche, ou transmettre un rôle de tâche à Amazon EC2 ou à AWS Lambda pour élever ses privilèges. Le rôle Deployer ne doit pas créer de rôles IAM.

    Quelles autorisations le rôle Deployer doit-il avoir, en plus des actions Amazon ECS nécessaires ?
body:
  options:
    - id: a
      text:
        en: "iam:PassRole on all roles (Resource \"*\") with a condition that iam:PassedToService equals ecs-tasks.amazonaws.com."
        fr: "iam:PassRole sur tous les rôles (Resource \"*\") avec une condition selon laquelle iam:PassedToService est égal à ecs-tasks.amazonaws.com."
    - id: b
      text:
        en: "iam:PassRole on arn:aws:iam::111122223333:role/app-task/* with a condition that iam:PassedToService equals ecs-tasks.amazonaws.com."
        fr: "iam:PassRole sur arn:aws:iam::111122223333:role/app-task/* avec une condition selon laquelle iam:PassedToService est égal à ecs-tasks.amazonaws.com."
    - id: c
      text:
        en: "iam:PassRole on arn:aws:iam::111122223333:role/app-task/* with no condition, and iam:CreateRole with a required permissions boundary."
        fr: "iam:PassRole sur arn:aws:iam::111122223333:role/app-task/* sans condition, et iam:CreateRole avec une limite d'autorisations obligatoire."
    - id: d
      text:
        en: "iam:PassRole on all roles (Resource \"*\") with a condition that aws:ResourceTag/purpose equals app-task, with the security team tagging every task role."
        fr: "iam:PassRole sur tous les rôles (Resource \"*\") avec une condition selon laquelle aws:ResourceTag/purpose est égal à app-task, l'équipe de sécurité balisant chaque rôle de tâche."
answer: { optionId: b }
explanation:
  correct:
    en: "Limiting the Resource element of iam:PassRole to the approved role path stops the pipeline from passing privileged roles, and the iam:PassedToService condition allows those roles to be passed only to ECS tasks. No iam:CreateRole permission is needed because the security team creates the task roles."
    fr: "Limiter l'élément Resource d'iam:PassRole au chemin des rôles approuvés empêche le pipeline de transmettre des rôles privilégiés, et la condition iam:PassedToService ne permet de transmettre ces rôles qu'aux tâches ECS. Aucune autorisation iam:CreateRole n'est nécessaire, car l'équipe de sécurité crée les rôles de tâche."
  options:
    a:
      en: "Any role that trusts ECS tasks, including privileged ones, could be passed; the service condition does not restrict which roles are passed."
      fr: "N'importe quel rôle qui approuve les tâches ECS, y compris un rôle privilégié, pourrait être transmis ; la condition de service ne restreint pas les rôles transmis."
    c:
      en: "Without iam:PassedToService the task roles could be passed to EC2 or Lambda, and iam:CreateRole violates the rule that the Deployer role must not create roles."
      fr: "Sans iam:PassedToService, les rôles de tâche pourraient être transmis à EC2 ou à Lambda, et iam:CreateRole enfreint la règle selon laquelle le rôle Deployer ne doit pas créer de rôles."
    d:
      en: "AWS advises against controlling iam:PassRole with the aws:ResourceTag condition key because the results are not reliable."
      fr: "AWS déconseille de contrôler iam:PassRole avec la clé de condition aws:ResourceTag, car les résultats ne sont pas fiables."
references:
  - title: Grant a user permissions to pass a role to an AWS service
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_passrole.html
