id: sapc03-2c-deny-global-profile
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank's AI OU contains accounts in which developers build applications on Amazon Bedrock in eu-west-1 and eu-central-1. A data residency policy requires that all model inference be processed in EU Regions. The OU has a Region deny SCP that denies all actions, except those of global services, when aws:RequestedRegion is not in a list. Months ago, an engineer added every destination Region of the EU geographic inference profile and the value unspecified to that list. The security team now finds that some developers invoke global cross-Region inference profiles. The team needs a preventive control that blocks global profiles but keeps in-Region invocations and the EU geographic profile working, without changing compliant applications.

    Which solution will meet these requirements?
  fr: |
    L'OU AI d'une banque contient des comptes dans lesquels des développeurs créent des applications sur Amazon Bedrock dans eu-west-1 et eu-central-1. Une politique de résidence des données exige que toute l'inférence des modèles soit traitée dans des Régions de l'UE. L'OU possède une SCP de refus de Région qui refuse toutes les actions, sauf celles des services globaux, lorsque aws:RequestedRegion ne figure pas dans une liste. Il y a quelques mois, un ingénieur a ajouté à cette liste chaque Région de destination du profil d'inférence géographique EU ainsi que la valeur unspecified. L'équipe de sécurité constate maintenant que certains développeurs appellent des profils d'inférence entre Régions globaux. L'équipe a besoin d'un contrôle préventif qui bloque les profils globaux tout en préservant les appels dans la Région et le profil géographique EU, sans modifier les applications conformes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Remove every Region except eu-west-1 and eu-central-1 from the list in the SCP condition, and keep the unspecified value in the list."
        fr: "Retirer de la liste de la condition de la SCP toutes les Régions sauf eu-west-1 et eu-central-1, et conserver la valeur unspecified dans la liste."
    - id: b
      text:
        en: "Create an Amazon Bedrock guardrail in each account with a denied topic for global inference, and require its use with a condition in the developers' IAM policies."
        fr: "Créer dans chaque compte un guardrail Amazon Bedrock avec une rubrique refusée pour l'inférence globale, et en imposer l'utilisation par une condition dans les politiques IAM des développeurs."
    - id: c
      text:
        en: "Deploy an AWS Config custom rule in the OU that detects invocations of global inference profiles and notifies the security team through Amazon SNS."
        fr: "Déployer dans l'OU une règle AWS Config personnalisée qui détecte les appels de profils d'inférence globaux et notifie l'équipe de sécurité par Amazon SNS."
    - id: d
      text:
        en: "Remove the unspecified value from the list in the SCP condition, and keep every Region that the EU geographic inference profile can route requests to."
        fr: "Retirer la valeur unspecified de la liste de la condition de la SCP, et conserver chaque Région vers laquelle le profil d'inférence géographique EU peut acheminer des requêtes."
answer: { optionId: d }
explanation:
  correct:
    en: "A global inference profile can route a request to any supported commercial Region, so its Region is not fixed in advance, and a Region-restricting SCP must allow the value unspecified in aws:RequestedRegion for global profiles to work. Removing unspecified blocks global profiles, while keeping all destination Regions of the EU geographic profile lets in-Region and EU profile invocations continue."
    fr: "Un profil d'inférence global peut acheminer une requête vers n'importe quelle Région commerciale prise en charge : sa Région n'est donc pas fixée à l'avance, et une SCP qui restreint les Régions doit autoriser la valeur unspecified dans aws:RequestedRegion pour que les profils globaux fonctionnent. Retirer unspecified bloque les profils globaux, tandis que conserver toutes les Régions de destination du profil géographique EU permet aux appels dans la Région et par le profil EU de continuer."
  options:
    a:
      en: "Keeping unspecified still allows global profiles, and removing the other EU destination Regions breaks requests that the EU profile routes to them."
      fr: "Conserver unspecified autorise toujours les profils globaux, et retirer les autres Régions de destination de l'UE fait échouer les requêtes que le profil EU achemine vers elles."
    b:
      en: "Guardrails filter the content of prompts and responses; they do not control which inference profile or Region processes a request."
      fr: "Les guardrails filtrent le contenu des invites et des réponses ; ils ne contrôlent pas quel profil d'inférence ou quelle Région traite une requête."
    c:
      en: "A detective notification acts after the data has been processed outside the EU, so it is not a preventive control."
      fr: "Une notification de détection intervient après le traitement des données hors de l'UE : ce n'est pas un contrôle préventif."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
