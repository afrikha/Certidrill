id: sapc03-2b-cloudhsm-multi-az
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores the private keys of its web tier in an AWS CloudHSM cluster and offloads part of the TLS processing to the HSMs. To save money, the cluster has one HSM in a single Availability Zone. Last month that HSM failed, and the web tier could not complete TLS handshakes until a new HSM was created from a backup. The company must keep TLS working through the failure of one HSM or one Availability Zone, without copying keys manually.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany stocke les clés privées de sa couche web dans un cluster AWS CloudHSM et décharge une partie du traitement TLS sur les HSM. Par économie, le cluster ne comporte qu'un HSM dans une seule zone de disponibilité. Le mois dernier, ce HSM est tombé en panne et la couche web n'a plus pu terminer les négociations TLS jusqu'à la création d'un nouveau HSM à partir d'une sauvegarde. L'entreprise doit maintenir TLS en cas de défaillance d'un HSM ou d'une zone de disponibilité, sans copier manuellement les clés.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a second cluster in another Availability Zone, and export the keys from the first cluster to the second one with a scheduled script.", fr: "Créer un second cluster dans une autre zone de disponibilité, et exporter les clés du premier cluster vers le second avec un script planifié." } }
    - { id: b, text: { en: "Add a second HSM to the cluster in the same Availability Zone and subnet as the first HSM so that the cluster keeps the two HSMs synchronized.", fr: "Ajouter au cluster un second HSM dans la même zone de disponibilité et le même sous-réseau que le premier, afin que le cluster synchronise les deux HSM." } }
    - { id: c, text: { en: "Rely on the cluster backups, and automate the creation of a new HSM from the latest backup when a health check of the web tier fails.", fr: "S'appuyer sur les sauvegardes du cluster, et automatiser la création d'un nouveau HSM à partir de la dernière sauvegarde lorsqu'une vérification de l'état de la couche web échoue." } }
    - { id: d, text: { en: "Add HSMs to the existing cluster in subnets of at least two Availability Zones, and let CloudHSM keep the HSMs of the cluster synchronized.", fr: "Ajouter au cluster existant des HSM dans des sous-réseaux d'au moins deux zones de disponibilité, et laisser CloudHSM synchroniser les HSM du cluster." } }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudHSM keeps the HSMs of a cluster in sync: an operation on one HSM is automatically applied to the others. Spreading the HSMs across multiple Availability Zones provides redundancy, so the web tier keeps using the remaining HSMs when one HSM or one Availability Zone fails."
    fr: "CloudHSM maintient les HSM d'un cluster synchronisés : une opération effectuée sur un HSM est automatiquement répercutée sur les autres. Répartir les HSM sur plusieurs zones de disponibilité apporte la redondance : la couche web continue d'utiliser les HSM restants en cas de défaillance d'un HSM ou d'une zone."
  options:
    a:
      en: "Separate clusters are not synchronized, so a scheduled key export is manual key copying that the company wants to avoid, and keys created between runs would be missing."
      fr: "Des clusters distincts ne sont pas synchronisés : un export planifié des clés revient à une copie manuelle que l'entreprise veut éviter, et les clés créées entre deux exécutions manqueraient."
    b:
      en: "Two HSMs in the same Availability Zone survive the failure of one HSM but not the failure of that Availability Zone."
      fr: "Deux HSM dans la même zone de disponibilité résistent à la panne d'un HSM, mais pas à celle de cette zone."
    c:
      en: "Restoring from a backup after a failure still leaves the web tier without an HSM until the new HSM is ready, which is the outage the company wants to avoid."
      fr: "Une restauration à partir d'une sauvegarde après une panne laisse la couche web sans HSM jusqu'à ce que le nouveau HSM soit prêt, soit la panne que l'entreprise veut éviter."
references:
  - title: AWS CloudHSM clusters
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/clusters.html
  - title: AWS CloudHSM use cases
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/use-cases.html
