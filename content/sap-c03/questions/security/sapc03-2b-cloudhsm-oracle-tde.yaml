id: sapc03-2b-cloudhsm-oracle-tde
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is migrating an Oracle Database Enterprise Edition workload that uses Oracle Transparent Data Encryption (TDE) to encrypt its tablespaces. On premises, the TDE master encryption key is stored in an HSM. Auditors require that the TDE master encryption key stay in an HSM under the company's exclusive control after the migration. The database team will manage Oracle and the operating system itself. The workload must run in two Availability Zones.

    Which solution will meet these requirements?
  fr: |
    AnyCompany migre une charge de travail Oracle Database Enterprise Edition qui utilise Oracle Transparent Data Encryption (TDE) pour chiffrer ses espaces de table. Sur site, la clé de chiffrement principale TDE est stockée dans un HSM. Les auditeurs exigent qu'après la migration la clé de chiffrement principale TDE reste dans un HSM sous le contrôle exclusif de l'entreprise. L'équipe de base de données gérera elle-même Oracle et le système d'exploitation. La charge de travail doit s'exécuter dans deux zones de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Migrate to Amazon RDS for Oracle with a Multi-AZ deployment, and encrypt the DB instance storage with a KMS key created in an AWS CloudHSM key store.", fr: "Migrer vers Amazon RDS for Oracle avec un déploiement Multi-AZ, et chiffrer le stockage de l'instance de base de données avec une clé KMS créée dans un magasin de clés AWS CloudHSM." } }
    - { id: b, text: { en: "Run Oracle on Amazon EC2 in two Availability Zones, and configure TDE to keep its master encryption key in an AWS CloudHSM cluster that spans both Availability Zones.", fr: "Exécuter Oracle sur Amazon EC2 dans deux zones de disponibilité, et configurer TDE pour conserver sa clé de chiffrement principale dans un cluster AWS CloudHSM couvrant les deux zones." } }
    - { id: c, text: { en: "Run Oracle on Amazon EC2 in two Availability Zones, and store the TDE master encryption key in AWS Secrets Manager encrypted with a customer managed KMS key.", fr: "Exécuter Oracle sur Amazon EC2 dans deux zones de disponibilité, et stocker la clé de chiffrement principale TDE dans AWS Secrets Manager, chiffrée avec une clé KMS gérée par le client." } }
    - { id: d, text: { en: "Run Oracle on Amazon EC2 in two Availability Zones, and encrypt the EBS volumes with a KMS key in an external key store that uses the on-premises HSM.", fr: "Exécuter Oracle sur Amazon EC2 dans deux zones de disponibilité, et chiffrer les volumes EBS avec une clé KMS d'un magasin de clés externe qui utilise le HSM sur site." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Storing the TDE master encryption key in CloudHSM is a documented CloudHSM use case: the database encrypts data before it writes it to disk, and the master key stays in single-tenant HSMs that the company controls. Running Oracle on EC2 gives the team the operating system access it needs, and a cluster with HSMs in both Availability Zones matches the availability of the database."
    fr: "Stocker la clé de chiffrement principale TDE dans CloudHSM est un cas d'usage documenté de CloudHSM : la base de données chiffre les données avant de les écrire sur disque, et la clé principale reste dans des HSM à locataire unique contrôlés par l'entreprise. Exécuter Oracle sur EC2 donne à l'équipe l'accès au système d'exploitation dont elle a besoin, et un cluster dont les HSM couvrent les deux zones correspond à la disponibilité de la base."
  options:
    a:
      en: "Storage encryption with a KMS key protects the volumes, not the TDE master encryption key, and RDS does not give the team the operating system access it plans to use."
      fr: "Le chiffrement du stockage avec une clé KMS protège les volumes, pas la clé de chiffrement principale TDE, et RDS ne donne pas à l'équipe l'accès au système d'exploitation qu'elle prévoit d'utiliser."
    c:
      en: "Secrets Manager is not an HSM under the company's exclusive control, so the auditors' requirement is not met."
      fr: "Secrets Manager n'est pas un HSM sous le contrôle exclusif de l'entreprise : l'exigence des auditeurs n'est pas satisfaite."
    d:
      en: "EBS encryption protects the volumes, not the TDE master encryption key, and every key use would depend on the on-premises HSM."
      fr: "Le chiffrement EBS protège les volumes, pas la clé de chiffrement principale TDE, et chaque utilisation de clé dépendrait du HSM sur site."
references:
  - title: AWS CloudHSM use cases
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/use-cases.html
