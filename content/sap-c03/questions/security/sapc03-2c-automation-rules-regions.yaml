id: sapc03-2c-automation-rules-regions
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company uses AWS Security Hub CSPM with a delegated administrator account. Cross-Region aggregation is enabled with us-east-1 as the home Region and us-west-2, eu-west-1, and ap-northeast-1 as linked Regions. The security team accepted the risk of one control for resources tagged environment=sandbox. Findings for these resources must still be generated and kept for audit purposes, but they must be suppressed automatically as soon as they are ingested in every Region. An engineer created an automation rule in us-east-1 from the delegated administrator account with a ResourceTags criterion and a SUPPRESSED workflow status. In the aggregated view, matching findings from us-east-1 are suppressed, but matching findings from the three linked Regions still show a NEW status. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo utilise AWS Security Hub CSPM avec un compte administrateur délégué. L'agrégation entre Régions est activée avec us-east-1 comme Région d'origine et us-west-2, eu-west-1 et ap-northeast-1 comme Régions liées. L'équipe de sécurité a accepté le risque d'un contrôle pour les ressources portant l'étiquette environment=sandbox. Les résultats de ces ressources doivent toujours être générés et conservés à des fins d'audit, mais ils doivent être supprimés automatiquement dès leur ingestion dans chaque Région. Un ingénieur a créé une règle d'automatisation dans us-east-1 depuis le compte administrateur délégué, avec un critère ResourceTags et un statut de flux de travail SUPPRESSED. Dans la vue agrégée, les résultats correspondants d'us-east-1 sont supprimés, mais ceux des trois Régions liées affichent toujours le statut NEW. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Disable the control for the sandbox accounts in a configuration policy so that Security Hub CSPM stops generating findings for the tagged resources in all four Regions."
        fr: "Désactiver le contrôle pour les comptes sandbox dans une politique de configuration afin que Security Hub CSPM cesse de générer des résultats pour les ressources étiquetées dans les quatre Régions."
    - id: b
      text:
        en: "Edit the existing automation rule in us-east-1 and add a ResourceRegion criterion that lists us-west-2, eu-west-1, and ap-northeast-1 so that it applies to the linked Regions."
        fr: "Modifier la règle d'automatisation existante dans us-east-1 et ajouter un critère ResourceRegion qui liste us-west-2, eu-west-1 et ap-northeast-1 afin qu'elle s'applique aux Régions liées."
    - id: c
      text:
        en: "Create the same automation rule from the delegated administrator account in us-west-2, eu-west-1, and ap-northeast-1, for example by deploying it with AWS CloudFormation."
        fr: "Créer la même règle d'automatisation depuis le compte administrateur délégué dans us-west-2, eu-west-1 et ap-northeast-1, par exemple en la déployant avec AWS CloudFormation."
    - id: d
      text:
        en: "Create an Amazon EventBridge rule in us-east-1 that invokes an AWS Lambda function, which calls BatchUpdateFindings to suppress each matching finding that arrives from a linked Region."
        fr: "Créer une règle Amazon EventBridge dans us-east-1 qui appelle une fonction AWS Lambda, laquelle appelle BatchUpdateFindings pour supprimer chaque résultat correspondant provenant d'une Région liée."
answer: { optionId: c }
explanation:
  correct:
    en: "A Security Hub CSPM automation rule applies only in the Region where it is created, even when cross-Region aggregation is enabled. Creating the same rule in each linked Region suppresses the matching findings when they are ingested there, and the suppressed status then replicates to the home Region. The findings are still generated and kept, and CloudFormation makes the per-Region deployment repeatable."
    fr: "Une règle d'automatisation Security Hub CSPM s'applique uniquement dans la Région où elle est créée, même lorsque l'agrégation entre Régions est activée. Créer la même règle dans chaque Région liée supprime les résultats correspondants dès leur ingestion dans cette Région, et le statut supprimé est ensuite répliqué vers la Région d'origine. Les résultats sont toujours générés et conservés, et CloudFormation rend le déploiement par Région reproductible."
  options:
    a:
      en: "Disabling the control stops the findings from being generated, which violates the requirement to keep them for audit."
      fr: "Désactiver le contrôle empêche la génération des résultats, ce qui viole l'exigence de les conserver pour l'audit."
    b:
      en: "A rule created in us-east-1 is evaluated only on findings ingested in us-east-1; adding a Region criterion does not extend it to findings ingested in other Regions."
      fr: "Une règle créée dans us-east-1 n'est évaluée que sur les résultats ingérés dans us-east-1 ; ajouter un critère de Région ne l'étend pas aux résultats ingérés dans d'autres Régions."
    d:
      en: "A custom Lambda function that updates findings after they arrive adds code to build and maintain, which is more operational overhead than managed automation rules."
      fr: "Une fonction Lambda personnalisée qui met à jour les résultats après leur arrivée ajoute du code à créer et à maintenir, ce qui représente plus de charge opérationnelle que les règles d'automatisation gérées."
references:
  - title: Understanding automation rules in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/automation-rules.html
  - title: Understanding cross-Region aggregation in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html
