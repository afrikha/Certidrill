id: sapc03-2c-artifact-org-baa
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A health technology company uses AWS Organizations, which it set up years ago with only the consolidated billing feature set. The company will process protected health information (PHI) in many existing member accounts and in accounts that it will create over the next year. The legal team requires a Business Associate Addendum (BAA) that covers every current and future account in the organization. The compliance officer has administrator permissions in a compliance member account but no access to the management account. The company wants the solution with the LEAST ongoing effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de technologies de santé utilise AWS Organizations, qu'elle a configuré il y a plusieurs années avec le seul ensemble de fonctionnalités de facturation consolidée. L'entreprise va traiter des informations de santé protégées (PHI) dans de nombreux comptes membres existants et dans des comptes qu'elle créera au cours de l'année prochaine. L'équipe juridique exige un Business Associate Addendum (BAA) qui couvre chaque compte actuel et futur de l'organisation. Le responsable de la conformité dispose d'autorisations d'administrateur dans un compte membre de conformité mais n'a pas accès au compte de gestion. L'entreprise veut la solution qui demande le MOINS d'efforts continus.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable all features in the organization, then accept the BAA as an organization agreement in AWS Artifact while signed in to the management account."
        fr: "Activer toutes les fonctionnalités dans l'organisation, puis accepter le BAA comme accord d'organisation dans AWS Artifact en étant connecté au compte de gestion."
    - id: b
      text:
        en: "Have the compliance officer accept the BAA as an account agreement in each member account, and add the acceptance step to the account creation runbook."
        fr: "Faire accepter le BAA par le responsable de la conformité comme accord de compte dans chaque compte membre, et ajouter l'étape d'acceptation au runbook de création des comptes."
    - id: c
      text:
        en: "Register the compliance account as a delegated administrator for AWS Artifact, and have the compliance officer accept the BAA as an organization agreement from that account."
        fr: "Enregistrer le compte de conformité comme administrateur délégué d'AWS Artifact, et faire accepter le BAA par le responsable de la conformité comme accord d'organisation depuis ce compte."
    - id: d
      text:
        en: "Accept the BAA as an account agreement in the management account, so that it extends to every member account through consolidated billing."
        fr: "Accepter le BAA comme accord de compte dans le compte de gestion, afin qu'il s'étende à chaque compte membre par la facturation consolidée."
answer: { optionId: a }
explanation:
  correct:
    en: "An organization agreement accepted in AWS Artifact, such as a BAA, covers all existing and subsequent member accounts, which can then legally process PHI. Only the owner of the management account, signed in with the right AWS Artifact permissions, can accept it, and the organization must have all features enabled rather than consolidated billing only."
    fr: "Un accord d'organisation accepté dans AWS Artifact, comme un BAA, couvre tous les comptes membres existants et futurs, qui peuvent alors traiter légalement des PHI. Seul le propriétaire du compte de gestion, connecté avec les autorisations AWS Artifact appropriées, peut l'accepter, et l'organisation doit avoir toutes les fonctionnalités activées plutôt que la seule facturation consolidée."
  options:
    b:
      en: "Account agreements cover only the accounts that accept them, so every new account adds a manual step that can be missed."
      fr: "Les accords de compte ne couvrent que les comptes qui les acceptent : chaque nouveau compte ajoute une étape manuelle qui peut être oubliée."
    c:
      en: "Organization agreements can be accepted only from the management account; member accounts can only view the agreements accepted on their behalf."
      fr: "Les accords d'organisation ne peuvent être acceptés que depuis le compte de gestion ; les comptes membres peuvent seulement consulter les accords acceptés en leur nom."
    d:
      en: "An account agreement covers only the account that accepts it; consolidated billing does not extend it to the member accounts."
      fr: "Un accord de compte ne couvre que le compte qui l'accepte ; la facturation consolidée ne l'étend pas aux comptes membres."
references:
  - title: Managing agreements in AWS Artifact
    url: https://docs.aws.amazon.com/artifact/latest/ug/managing-agreements.html
  - title: Accepting agreements for your organization in AWS Artifact
    url: https://docs.aws.amazon.com/artifact/latest/ug/accept-org-agreement.html
