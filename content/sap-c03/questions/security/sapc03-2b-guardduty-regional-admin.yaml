id: sapc03-2b-guardduty-regional-admin
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 400 accounts in AWS Organizations and runs workloads in eu-west-1, eu-central-1, and us-east-1. GuardDuty was enabled manually in only some of the accounts. The security team wants GuardDuty to protect every existing and future account in the three Regions, with all findings managed from the security tooling account. The company wants to use the management account as little as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 400 comptes dans AWS Organizations et exécute des charges de travail dans eu-west-1, eu-central-1 et us-east-1. GuardDuty n'a été activé manuellement que dans certains comptes. L'équipe de sécurité veut que GuardDuty protège chaque compte existant et futur dans les trois Régions, tous les résultats étant gérés depuis le compte d'outils de sécurité. L'entreprise veut utiliser le compte de gestion le moins possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In each of the three Regions, designate the security tooling account as the delegated GuardDuty administrator, and set the organization auto-enable configuration to ALL.", fr: "Dans chacune des trois Régions, désigner le compte d'outils de sécurité comme administrateur GuardDuty délégué, et définir la configuration d'activation automatique de l'organisation sur ALL." } }
    - { id: b, text: { en: "In eu-west-1 only, designate the security tooling account as the delegated GuardDuty administrator, because the designation applies to all Regions, and set auto-enable to NEW.", fr: "Dans eu-west-1 uniquement, désigner le compte d'outils de sécurité comme administrateur GuardDuty délégué, car la désignation s'applique à toutes les Régions, et définir l'activation automatique sur NEW." } }
    - { id: c, text: { en: "Designate the security tooling account as the delegated administrator in eu-west-1 and a different regional security account in each other Region, and set auto-enable to ALL.", fr: "Désigner le compte d'outils de sécurité comme administrateur délégué dans eu-west-1 et un compte de sécurité régional différent dans chaque autre Région, et définir l'activation automatique sur ALL." } }
    - { id: d, text: { en: "Keep the management account as the GuardDuty administrator in each Region, and invite every member account so that it accepts the administrator relationship.", fr: "Conserver le compte de gestion comme administrateur GuardDuty dans chaque Région, et inviter chaque compte membre pour qu'il accepte la relation d'administrateur." } }
answer: { optionId: a }
explanation:
  correct:
    en: "GuardDuty is a Regional service: the delegated administrator and its member accounts must be set up in each Region, and the same account must be the delegated administrator in all Regions. The auto-enable configuration ALL covers existing and new member accounts."
    fr: "GuardDuty est un service Régional : l'administrateur délégué et ses comptes membres doivent être configurés dans chaque Région, et le même compte doit être administrateur délégué dans toutes les Régions. La configuration d'activation automatique ALL couvre les comptes membres existants et nouveaux."
  options:
    b:
      en: "A delegated GuardDuty administrator is Regional, so the other two Regions would not be covered, and NEW does not enable GuardDuty in existing accounts."
      fr: "Un administrateur GuardDuty délégué est Régional : les deux autres Régions ne seraient pas couvertes, et NEW n'active pas GuardDuty dans les comptes existants."
    c:
      en: "GuardDuty requires the same delegated administrator account in every Region, and findings would not be managed from one account."
      fr: "GuardDuty exige le même compte administrateur délégué dans chaque Région, et les résultats ne seraient pas gérés depuis un seul compte."
    d:
      en: "This uses the management account for daily security operations, and invitations must be accepted account by account."
      fr: "Cette option utilise le compte de gestion pour les opérations de sécurité quotidiennes, et les invitations doivent être acceptées compte par compte."
references:
  - title: Managing GuardDuty accounts with AWS Organizations
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
