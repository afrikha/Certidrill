id: sapc03-2a-dynamodb-switch-cmk
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has a 2 TB Amazon DynamoDB table that is encrypted at rest with the default AWS owned key. A new compliance rule requires that the encryption key be stored in the company's account, that the company control the key policy, that the key material be rotated automatically every year, and that every use of the key be recorded in AWS CloudTrail. The table serves production traffic and must stay available. The company wants the solution with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède une table Amazon DynamoDB de 2 To chiffrée au repos avec la clé détenue par AWS par défaut. Une nouvelle règle de conformité exige que la clé de chiffrement soit stockée dans le compte de l'entreprise, que l'entreprise contrôle la politique de clé, que le matériel de clé fasse l'objet d'une rotation automatique chaque année, et que chaque utilisation de la clé soit enregistrée dans AWS CloudTrail. La table sert le trafic de production et doit rester disponible. L'entreprise veut la solution qui demande le MOINS d'efforts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Export the table to Amazon S3, create a new table encrypted with a customer managed key, import the data into it, and switch the application to the new table."
        fr: "Exporter la table vers Amazon S3, créer une nouvelle table chiffrée avec une clé gérée par le client, y importer les données, et faire passer l'application sur la nouvelle table."
    - id: b
      text:
        en: "Create a customer managed key with automatic rotation enabled, and update the encryption settings of the existing table to use this key."
        fr: "Créer une clé gérée par le client avec la rotation automatique activée, et modifier les paramètres de chiffrement de la table existante pour qu'elle utilise cette clé."
    - id: c
      text:
        en: "Update the encryption settings of the existing table to use the AWS managed key aws/dynamodb, which is stored in the account and rotated every year."
        fr: "Modifier les paramètres de chiffrement de la table existante pour qu'elle utilise la clé gérée par AWS aws/dynamodb, stockée dans le compte et renouvelée chaque année."
    - id: d
      text:
        en: "Change the application to encrypt items on the client side with a customer managed key before writing them, and keep the table's default encryption."
        fr: "Modifier l'application pour chiffrer les éléments côté client avec une clé gérée par le client avant de les écrire, et conserver le chiffrement par défaut de la table."
answer: { optionId: b }
explanation:
  correct:
    en: "DynamoDB lets you switch an existing table between the AWS owned key, the AWS managed key and a customer managed key at any time. A customer managed key is created, owned and managed by the company, which controls its key policy and can enable automatic rotation, and its use is logged in CloudTrail."
    fr: "DynamoDB permet de faire passer une table existante, à tout moment, entre la clé détenue par AWS, la clé gérée par AWS et une clé gérée par le client. Une clé gérée par le client est créée, détenue et gérée par l'entreprise, qui contrôle sa politique de clé et peut activer la rotation automatique, et son utilisation est journalisée dans CloudTrail."
  options:
    a:
      en: "Rebuilding the table works but is much more effort and requires a cutover, while the key of the existing table can be changed directly."
      fr: "Reconstruire la table fonctionne mais demande beaucoup plus d'efforts et une bascule, alors que la clé de la table existante peut être changée directement."
    c:
      en: "The company cannot change the key policy of an AWS managed key, which fails the key policy control requirement."
      fr: "L'entreprise ne peut pas modifier la politique de clé d'une clé gérée par AWS, ce qui ne répond pas à l'exigence de contrôle de la politique de clé."
    d:
      en: "Client-side encryption requires application changes, and the table itself would still be encrypted with the AWS owned key."
      fr: "Le chiffrement côté client exige des modifications de l'application, et la table elle-même resterait chiffrée avec la clé détenue par AWS."
references:
  - title: DynamoDB encryption at rest
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/EncryptionAtRest.html
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
