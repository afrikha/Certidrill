id: sapc03-2c-remediate-and-notify
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company gives each business unit its own production account in AWS Organizations. In every production account, AWS Config evaluates the s3-bucket-public-read-prohibited managed rule. Last quarter, a bucket stayed publicly readable for two days before anyone noticed. The security team now requires that a bucket that becomes noncompliant be fixed automatically within minutes, with up to five attempts if a remediation fails. The security operations team must also receive a notification each time a bucket changes to NONCOMPLIANT. The company wants to write as little custom code as possible.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de logistique attribue à chaque unité métier son propre compte de production dans AWS Organizations. Dans chaque compte de production, AWS Config évalue la règle gérée s3-bucket-public-read-prohibited. Le trimestre dernier, un compartiment est resté lisible publiquement pendant deux jours avant que quelqu'un ne s'en aperçoive. L'équipe de sécurité exige désormais qu'un compartiment qui devient non conforme soit corrigé automatiquement en quelques minutes, avec jusqu'à cinq tentatives si une correction échoue. L'équipe des opérations de sécurité doit aussi recevoir une notification chaque fois qu'un compartiment passe à l'état NONCOMPLIANT. L'entreprise veut écrire le moins de code personnalisé possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure automatic remediation on the rule with the AWS-DisableS3BucketPublicReadWrite runbook, an AutomationAssumeRole, and five retry attempts."
        fr: "Configurer la correction automatique sur la règle avec le runbook AWS-DisableS3BucketPublicReadWrite, un AutomationAssumeRole et cinq tentatives."
    - id: b
      text:
        en: "Create an AWS Security Hub CSPM automation rule that removes public access from the bucket when a finding for the S3 public read control is imported from AWS Config."
        fr: "Créer une règle d'automatisation AWS Security Hub CSPM qui supprime l'accès public du compartiment lorsqu'un résultat du contrôle de lecture publique S3 est importé depuis AWS Config."
    - id: c
      text:
        en: "Switch the rule to proactive evaluation mode so that buckets with public read access can no longer be created or reconfigured in the production accounts."
        fr: "Passer la règle en mode d'évaluation proactif afin que les compartiments avec accès public en lecture ne puissent plus être créés ni reconfigurés dans les comptes de production."
    - id: d
      text:
        en: "Create an EventBridge rule that matches Config Rules Compliance Change events with a NONCOMPLIANT new compliance type for the rule, targeting an SNS topic."
        fr: "Créer une règle EventBridge qui correspond aux événements Config Rules Compliance Change dont le nouveau type de conformité est NONCOMPLIANT pour la règle, avec une rubrique SNS comme cible."
    - id: e
      text:
        en: "Create an AWS Config aggregator in the security account and subscribe the security operations team's email address to the aggregator's compliance notifications."
        fr: "Créer un agrégateur AWS Config dans le compte de sécurité et abonner l'adresse e-mail de l'équipe des opérations de sécurité aux notifications de conformité de l'agrégateur."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS Config automatic remediation runs a Systems Manager Automation runbook when the rule marks a resource noncompliant, can pass the noncompliant resource ID as a parameter, and retries a failed remediation the configured number of times. AWS Config publishes compliance change events to EventBridge, so a rule filtered on this rule name and NONCOMPLIANT can notify the team through SNS without custom code."
    fr: "La correction automatique d'AWS Config exécute un runbook Systems Manager Automation lorsque la règle marque une ressource comme non conforme, peut transmettre l'ID de la ressource non conforme comme paramètre et relance une correction en échec le nombre de fois configuré. AWS Config publie les événements de changement de conformité dans EventBridge : une règle filtrée sur le nom de cette règle et sur NONCOMPLIANT peut donc notifier l'équipe par SNS sans code personnalisé."
  options:
    b:
      en: "Automation rules only update finding fields such as severity, workflow status or notes; they cannot change the configuration of the bucket."
      fr: "Les règles d'automatisation mettent seulement à jour des champs des résultats, comme la gravité, le statut de flux de travail ou les notes ; elles ne peuvent pas modifier la configuration du compartiment."
    c:
      en: "Proactive rules only report whether planned resource properties would be compliant; they neither block changes nor remediate existing buckets."
      fr: "Les règles proactives indiquent seulement si les propriétés prévues d'une ressource seraient conformes ; elles ne bloquent pas les modifications et ne corrigent pas les compartiments existants."
    e:
      en: "Aggregators provide a read-only multi-account view of configuration and compliance data; they do not send notifications or trigger remediation."
      fr: "Les agrégateurs offrent une vue multicomptes en lecture seule des données de configuration et de conformité ; ils n'envoient pas de notifications et ne déclenchent pas de correction."
references:
  - title: Setting Up Auto Remediation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: Remediating Noncompliant Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
