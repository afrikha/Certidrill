id: sapc03-2b-pq-tls-sdk-kms
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs batch jobs in its data center that call AWS KMS GenerateDataKey over the internet. The jobs use the returned plaintext data keys to encrypt medical records before they upload them to Amazon S3. The records must stay confidential for 30 years. The security team is concerned that an adversary could record today's TLS traffic to AWS KMS and decrypt it later with a quantum computer. The jobs use the AWS SDK for Java 2.x.

    Which solution will address this risk with the LEAST change to the architecture?
  fr: |
    AnyCompany exécute dans son centre de données des traitements par lots qui appellent AWS KMS GenerateDataKey via Internet. Les traitements utilisent les clés de données en clair renvoyées pour chiffrer des dossiers médicaux avant de les charger dans Amazon S3. Les dossiers doivent rester confidentiels pendant 30 ans. L'équipe de sécurité craint qu'un adversaire enregistre aujourd'hui le trafic TLS vers AWS KMS et le déchiffre plus tard avec un ordinateur quantique. Les traitements utilisent l'AWS SDK for Java 2.x.

    Quelle solution traite ce risque avec le MOINS de modifications de l'architecture ?
body:
  options:
    - { id: a, text: { en: "Replace the symmetric KMS key with an ML_KEM_768 KMS key, and use that key as the SSE-KMS key of the S3 buckets that receive the records.", fr: "Remplacer la clé KMS symétrique par une clé KMS ML_KEM_768, et utiliser cette clé comme clé SSE-KMS des compartiments S3 qui reçoivent les dossiers." } }
    - { id: b, text: { en: "Configure the SDK clients for hybrid post-quantum TLS, for example with the AWS CRT-based HTTP client, so that connections to AWS KMS use ML-KEM.", fr: "Configurer les clients SDK pour le TLS hybride post-quantique, par exemple avec le client HTTP basé sur AWS CRT, afin que les connexions à AWS KMS utilisent ML-KEM." } }
    - { id: c, text: { en: "Re-encrypt the existing S3 objects with a new symmetric KMS key every year so that any captured ciphertext is protected by fresh key material.", fr: "Rechiffrer chaque année les objets S3 existants avec une nouvelle clé KMS symétrique afin que tout texte chiffré capturé soit protégé par de nouveaux éléments de clé." } }
    - { id: d, text: { en: "Sign every GenerateDataKey request with an ML_DSA_87 KMS key so that a future quantum adversary cannot read the responses that AWS KMS returns.", fr: "Signer chaque requête GenerateDataKey avec une clé KMS ML_DSA_87 afin qu'un futur adversaire quantique ne puisse pas lire les réponses renvoyées par AWS KMS." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS KMS endpoints support a hybrid key exchange that combines ECDH with ML-KEM, which protects data sent over TLS, here the plaintext data keys, against harvest-now, decrypt-later attacks. Many AWS SDKs support it; in the AWS SDK for Java 2.x it is configured with the AWS CRT-based HTTP client, so only the client configuration changes."
    fr: "Les points de terminaison AWS KMS prennent en charge un échange de clés hybride qui combine ECDH et ML-KEM, ce qui protège les données transmises en TLS, ici les clés de données en clair, contre les attaques « récolter maintenant, déchiffrer plus tard ». De nombreux SDK AWS le prennent en charge ; dans l'AWS SDK for Java 2.x, il se configure avec le client HTTP basé sur AWS CRT : seule la configuration du client change."
  options:
    a:
      en: "ML-KEM KMS keys are used to encapsulate and decapsulate shared secrets, not to encrypt S3 objects, and changing the S3 key does not protect the data keys in transit."
      fr: "Les clés KMS ML-KEM servent à encapsuler et décapsuler des secrets partagés, pas à chiffrer des objets S3, et changer la clé S3 ne protège pas les clés de données en transit."
    c:
      en: "Re-encryption at rest does not protect the plaintext data keys that were already captured in transit, and AES-256-GCM at rest is already considered quantum resistant."
      fr: "Le rechiffrement au repos ne protège pas les clés de données en clair déjà capturées en transit, et AES-256-GCM au repos est déjà considéré comme résistant aux attaques quantiques."
    d:
      en: "A signature provides authenticity, not confidentiality, so the responses would still travel under a classical key exchange."
      fr: "Une signature assure l'authenticité, pas la confidentialité : les réponses transiteraient toujours avec un échange de clés classique."
references:
  - title: Using hybrid post-quantum TLS with AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/pqtls.html
