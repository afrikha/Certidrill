id: sapc03-2a-transitive-session-tags
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Employees of AnyCompany federate from a SAML 2.0 identity provider into an IAM role named Entry in a hub account. The identity provider sends a Project session tag for each employee. From the Entry session, operations scripts assume Workload roles in 50 member accounts. The permissions policies of the Workload roles use attribute-based access control that compares aws:ResourceTag/Project with ${aws:PrincipalTag/Project}. Today, the Workload sessions have no Project tag, so every ABAC request is denied. The Project value must come from the identity provider, and the scripts must not have to pass any tags.

    Which solution will meet these requirements?
  fr: |
    Les employés d'AnyCompany se fédèrent depuis un fournisseur d'identité SAML 2.0 dans un rôle IAM nommé Entry d'un compte hub. Le fournisseur d'identité envoie une balise de session Project pour chaque employé. Depuis la session Entry, des scripts d'exploitation endossent des rôles Workload dans 50 comptes membres. Les politiques d'autorisations des rôles Workload utilisent un contrôle d'accès par attributs (ABAC) qui compare aws:ResourceTag/Project à ${aws:PrincipalTag/Project}. Aujourd'hui, les sessions Workload n'ont pas de balise Project : toutes les requêtes ABAC sont refusées. La valeur Project doit provenir du fournisseur d'identité, et les scripts ne doivent transmettre aucune balise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Have the identity provider list Project in the https://aws.amazon.com/SAML/Attributes/TransitiveTagKeys attribute, and allow sts:TagSession in the trust policies of the Workload roles."
        fr: "Faire lister Project par le fournisseur d'identité dans l'attribut https://aws.amazon.com/SAML/Attributes/TransitiveTagKeys, et autoriser sts:TagSession dans les politiques d'approbation des rôles Workload."
    - id: b
      text:
        en: "Add a Project tag to each Workload role in IAM with the value of the project that the role's account belongs to, and keep the ABAC policies unchanged."
        fr: "Ajouter dans IAM une balise Project à chaque rôle Workload avec la valeur du projet auquel appartient le compte du rôle, et conserver les politiques ABAC sans modification."
    - id: c
      text:
        en: "Update the scripts to read the Project tag of the Entry session and pass it with the --tags option of aws sts assume-role when they assume a Workload role."
        fr: "Modifier les scripts pour qu'ils lisent la balise Project de la session Entry et la transmettent avec l'option --tags d'aws sts assume-role lorsqu'ils endossent un rôle Workload."
    - id: d
      text:
        en: "Have the identity provider set the SourceIdentity attribute to the employee's project, and change the ABAC policies to compare the resource tag with ${aws:SourceIdentity}."
        fr: "Faire définir par le fournisseur d'identité l'attribut SourceIdentity sur le projet de l'employé, et modifier les politiques ABAC pour comparer la balise de ressource à ${aws:SourceIdentity}."
answer: { optionId: a }
explanation:
  correct:
    en: "Session tags are not passed to the next session of a role chain unless they are transitive. A SAML identity provider marks tag keys as transitive with the TransitiveTagKeys attribute, and transitive tags then persist into every chained session, so the Workload sessions receive the Project value that the identity provider set while the scripts pass no tags."
    fr: "Les balises de session ne sont pas transmises à la session suivante d'une chaîne de rôles sauf si elles sont transitives. Un fournisseur d'identité SAML marque des clés de balise comme transitives avec l'attribut TransitiveTagKeys ; les balises transitives persistent alors dans chaque session chaînée, et les sessions Workload reçoivent la valeur Project définie par le fournisseur d'identité sans que les scripts ne transmettent de balise."
  options:
    b:
      en: "Role tags are fixed per role, so they cannot carry each employee's project, and role tags cannot be made transitive."
      fr: "Les balises de rôle sont fixes pour chaque rôle : elles ne peuvent pas porter le projet de chaque employé, et elles ne peuvent pas être rendues transitives."
    c:
      en: "Passing tags from the scripts violates the requirement that the scripts pass no tags, and the value would come from the script instead of the identity provider."
      fr: "Transmettre les balises depuis les scripts enfreint l'exigence selon laquelle les scripts ne transmettent aucune balise, et la valeur proviendrait du script au lieu du fournisseur d'identité."
    d:
      en: "Source identity records who is behind a session for auditing; it is a single identity value and is not a principal tag that ABAC policies evaluate."
      fr: "L'identité source enregistre qui se trouve derrière une session à des fins d'audit ; c'est une valeur d'identité unique, et non une balise de principal évaluée par les politiques ABAC."
references:
  - title: Pass session tags in AWS STS
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_session-tags.html
