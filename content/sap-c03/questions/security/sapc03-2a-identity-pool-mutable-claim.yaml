id: sapc03-2a-identity-pool-mutable-claim
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has a mobile app for its field technicians and back-office staff. Users sign in to an Amazon Cognito user pool, and a Cognito identity pool gives them temporary AWS credentials to read and write objects in Amazon S3. Each user has a custom:department attribute that the app's profile screen sets. The identity pool uses rules-based role mapping: when custom:department equals finance, the user receives FinanceRole, which can read the finance reports bucket. During a penetration test, a technician changed his own custom:department value through the app and received FinanceRole. The company wants to keep department-based role mapping.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose d'une application mobile pour ses techniciens de terrain et son personnel administratif. Les utilisateurs se connectent à un groupe d'utilisateurs Amazon Cognito, et un groupe d'identités Cognito leur fournit des informations d'identification AWS temporaires pour lire et écrire des objets dans Amazon S3. Chaque utilisateur possède un attribut custom:department défini par l'écran de profil de l'application. Le groupe d'identités utilise une association de rôles basée sur des règles : lorsque custom:department vaut finance, l'utilisateur reçoit FinanceRole, qui peut lire le compartiment (bucket) des rapports financiers. Lors d'un test d'intrusion, un technicien a modifié sa propre valeur custom:department via l'application et a reçu FinanceRole. L'entreprise veut conserver l'association de rôles basée sur le département.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a condition to the trust policy of FinanceRole that requires the cognito-identity.amazonaws.com:amr value authenticated, and keep the rules-based mapping unchanged."
        fr: "Ajouter à la politique d'approbation de FinanceRole une condition qui exige la valeur authenticated pour cognito-identity.amazonaws.com:amr, et conserver l'association basée sur des règles sans modification."
    - id: b
      text:
        en: "Set the role resolution of the identity pool to Deny so that users whose claims match no rule receive no credentials, and keep the rules-based mapping unchanged."
        fr: "Définir la résolution des rôles du groupe d'identités sur Deny pour que les utilisateurs dont les revendications ne correspondent à aucune règle ne reçoivent pas d'informations d'identification, et conserver l'association basée sur des règles sans modification."
    - id: c
      text:
        en: "Enable threat protection on the user pool so that sign-ins with changed attribute values are flagged as risky, and require MFA for those sign-ins."
        fr: "Activer la protection contre les menaces sur le groupe d'utilisateurs pour que les connexions dont les valeurs d'attributs ont changé soient signalées comme risquées, et exiger la MFA pour ces connexions."
    - id: d
      text:
        en: "Remove write access to custom:department from the app client, set the attribute only from a back-office process that calls AdminUpdateUserAttributes, and keep the rules-based mapping."
        fr: "Retirer au client d'application l'accès en écriture à custom:department, définir l'attribut uniquement depuis un processus administratif qui appelle AdminUpdateUserAttributes, et conserver l'association basée sur des règles."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Cognito warns that if a claim mapped to a role can be modified by the end user, any end user can obtain that role, so only claims that users cannot set should map to privileged roles. Making the attribute read-only for the app client and setting it with an administrative API keeps the department mapping while preventing users from choosing their own role."
    fr: "Amazon Cognito avertit que si une revendication associée à un rôle peut être modifiée par l'utilisateur final, n'importe quel utilisateur peut obtenir ce rôle : seules des revendications que les utilisateurs ne peuvent pas définir doivent mener à des rôles privilégiés. Rendre l'attribut non modifiable par le client d'application et le définir avec une API d'administration conserve l'association par département tout en empêchant les utilisateurs de choisir leur propre rôle."
  options:
    a:
      en: "The technician was authenticated, so the amr condition is satisfied; the weakness is the user-writable claim, not the authentication state."
      fr: "Le technicien était authentifié : la condition amr est remplie ; la faiblesse est la revendication modifiable par l'utilisateur, pas l'état d'authentification."
    b:
      en: "Role resolution applies only when no rule matches; the forged claim still matches the finance rule."
      fr: "La résolution des rôles ne s'applique que si aucune règle ne correspond ; la revendication falsifiée correspond toujours à la règle finance."
    c:
      en: "Threat protection evaluates sign-in risk and compromised passwords; it does not stop a signed-in user from updating a writable attribute."
      fr: "La protection contre les menaces évalue le risque de connexion et les mots de passe compromis ; elle n'empêche pas un utilisateur connecté de modifier un attribut accessible en écriture."
references:
  - title: Using role-based access control
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/role-based-access-control.html
