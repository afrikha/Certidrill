id: sapc03-2c-inspector-cis-os
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A government contractor has 40 accounts in AWS Organizations. A contract requires the contractor to show that the operating systems of its Amazon EC2 instances tagged compliance=cis-l1 meet the CIS Level 1 benchmark, with an assessment that recurs every week and results that the security team reviews from one account. AWS Security Hub CSPM is already enabled in all accounts with the CIS AWS Foundations Benchmark standard, and an AWS Config organization conformance pack based on CIS operational best practices is deployed. The tagged instances are AWS Systems Manager managed nodes, and the security tooling account is the Amazon Inspector delegated administrator. The contractor wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un sous-traitant de l'administration possède 40 comptes dans AWS Organizations. Un contrat l'oblige à démontrer que les systèmes d'exploitation de ses instances Amazon EC2 étiquetées compliance=cis-l1 respectent le benchmark CIS de niveau 1, avec une évaluation hebdomadaire récurrente et des résultats que l'équipe de sécurité consulte depuis un seul compte. AWS Security Hub CSPM est déjà activé dans tous les comptes avec la norme CIS AWS Foundations Benchmark, et un pack de conformité d'organisation AWS Config fondé sur les bonnes pratiques opérationnelles CIS est déployé. Les instances étiquetées sont des nœuds gérés AWS Systems Manager, et le compte d'outillage de sécurité est l'administrateur délégué d'Amazon Inspector. Le sous-traitant veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use the results of the CIS AWS Foundations Benchmark standard in Security Hub CSPM, filtered on the tagged instances, as the weekly evidence for the contract."
        fr: "Utiliser les résultats de la norme CIS AWS Foundations Benchmark de Security Hub CSPM, filtrés sur les instances étiquetées, comme preuve hebdomadaire pour le contrat."
    - id: b
      text:
        en: "Use the compliance results of the CIS conformance pack in an AWS Config aggregator, filtered on the tagged instances, as the weekly evidence for the contract."
        fr: "Utiliser les résultats de conformité du pack de conformité CIS dans un agrégateur AWS Config, filtrés sur les instances étiquetées, comme preuve hebdomadaire pour le contrat."
    - id: c
      text:
        en: "Create a State Manager association in every account that runs a custom CIS assessment script weekly on the tagged instances and writes the results to a central S3 bucket."
        fr: "Créer dans chaque compte une association State Manager qui exécute chaque semaine un script d'évaluation CIS personnalisé sur les instances étiquetées et écrit les résultats dans un compartiment S3 central."
    - id: d
      text:
        en: "From the Inspector delegated administrator, create a weekly Level 1 CIS scan configuration for all member accounts that targets the compliance=cis-l1 tag."
        fr: "Depuis l'administrateur délégué d'Inspector, créer une configuration d'analyse CIS de niveau 1 hebdomadaire pour tous les comptes membres qui cible l'étiquette compliance=cis-l1."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Inspector CIS scans check EC2 operating systems against CIS benchmark Level 1 or Level 2, select instances by tag, and can recur daily, weekly or monthly. A delegated administrator can create organization-owned configurations across member accounts and view all results. The instances must be Systems Manager managed nodes whose instance profile includes the AmazonSSMManagedInstanceCore and AmazonInspector2ManagedCisPolicy policies."
    fr: "Les analyses CIS d'Amazon Inspector comparent les systèmes d'exploitation EC2 au benchmark CIS de niveau 1 ou 2, sélectionnent les instances par étiquette et peuvent se répéter chaque jour, chaque semaine ou chaque mois. Un administrateur délégué peut créer des configurations appartenant à l'organisation sur les comptes membres et consulter tous les résultats. Les instances doivent être des nœuds gérés Systems Manager dont le profil d'instance inclut les politiques AmazonSSMManagedInstanceCore et AmazonInspector2ManagedCisPolicy."
  options:
    a:
      en: "The CIS AWS Foundations Benchmark checks the configuration of AWS accounts and services, such as IAM and logging settings, not the settings inside the operating systems."
      fr: "Le CIS AWS Foundations Benchmark vérifie la configuration des comptes et services AWS, comme les paramètres IAM et de journalisation, pas les paramètres internes des systèmes d'exploitation."
    b:
      en: "AWS Config rules evaluate the recorded configuration of AWS resources; they cannot assess operating system settings against the CIS benchmark for the OS."
      fr: "Les règles AWS Config évaluent la configuration enregistrée des ressources AWS ; elles ne peuvent pas évaluer les paramètres du système d'exploitation par rapport au benchmark CIS de cet OS."
    c:
      en: "A custom assessment script must be written, kept aligned with the benchmark and deployed in every account, which is far more overhead than the managed CIS scans."
      fr: "Un script d'évaluation personnalisé doit être écrit, maintenu à jour par rapport au benchmark et déployé dans chaque compte, ce qui représente bien plus de charge que les analyses CIS gérées."
references:
  - title: Center for Internet Security (CIS) scans for Amazon EC2 instance operating systems
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-cis.html
