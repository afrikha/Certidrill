id: sapc03-2d-applyguardrail-external
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's compliance team maintains one Amazon Bedrock guardrail with content filters, denied topics and PII masking, and all Bedrock applications already reference a numeric version of it. Two other generative AI applications do not use Bedrock models. One calls an open-weight model that the company hosts on Amazon EKS in a private VPC, and the other calls a third-party model provider's API over the internet. The compliance team requires the same safeguard definitions to be applied to the prompts and responses of these two applications, maintained in one place. The model owners refuse to migrate or re-host their models. The solution must keep using a managed safeguard service rather than custom classifiers.

    Which solution will meet these requirements?
  fr: |
    L'équipe de conformité d'AnyCompany maintient un seul guardrail Amazon Bedrock avec des filtres de contenu, des sujets refusés et du masquage de PII, et toutes les applications Bedrock référencent déjà une version numérotée de ce guardrail. Deux autres applications d'IA générative n'utilisent pas de modèles Bedrock. L'une appelle un modèle à poids ouverts que l'entreprise héberge sur Amazon EKS dans un VPC privé, et l'autre appelle par Internet l'API d'un fournisseur tiers de modèles. L'équipe de conformité exige que les mêmes définitions de protection s'appliquent aux invites et réponses de ces deux applications, maintenues en un seul endroit. Les responsables des modèles refusent de migrer ou de réhéberger leurs modèles. La solution doit continuer d'utiliser un service de protection géré plutôt que des classifieurs personnalisés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Import the open-weight model with Amazon Bedrock Custom Model Import, route the third-party calls through Amazon Bedrock cross-Region inference, and reference the guardrail version in both applications.", fr: "Importer le modèle à poids ouverts avec Amazon Bedrock Custom Model Import, faire passer les appels tiers par l'inférence interrégionale d'Amazon Bedrock, et référencer la version du guardrail dans les deux applications." }
    - id: b
      text: { en: "Place both model endpoints behind an Application Load Balancer with an AWS WAF web ACL that uses the managed core rule set and a custom rule group for the denied topics.", fr: "Placer les deux points de terminaison de modèle derrière un Application Load Balancer avec une liste ACL web AWS WAF qui utilise l'ensemble de règles de base géré et un groupe de règles personnalisé pour les sujets refusés." }
    - id: c
      text: { en: "Have both applications call the Amazon Bedrock ApplyGuardrail API with the guardrail version, with source INPUT on each prompt before the model call and source OUTPUT on each response before it is returned.", fr: "Faire appeler par les deux applications l'API ApplyGuardrail d'Amazon Bedrock avec la version du guardrail, avec la source INPUT sur chaque invite avant l'appel du modèle et la source OUTPUT sur chaque réponse avant son renvoi." }
    - id: d
      text: { en: "Call Amazon Comprehend PII detection on each prompt and response from an AWS Lambda function, and compare the text with keyword lists that the compliance team exports from the guardrail.", fr: "Appeler la détection de PII d'Amazon Comprehend sur chaque invite et réponse depuis une fonction AWS Lambda, et comparer le texte à des listes de mots-clés que l'équipe de conformité exporte du guardrail." }
answer: { optionId: c }
explanation:
  correct:
    en: "ApplyGuardrail evaluates any text against a configured guardrail without invoking a foundation model, so it works with self-hosted and third-party models. Calling it with source INPUT before the model and source OUTPUT after it applies the same content filters, denied topics and PII masking, and the response returns the masked text or the blocked message to use."
    fr: "ApplyGuardrail évalue n'importe quel texte par rapport à un guardrail configuré sans appeler de modèle de fondation : il fonctionne avec des modèles autohébergés et tiers. L'appeler avec la source INPUT avant le modèle et la source OUTPUT après applique les mêmes filtres de contenu, sujets refusés et masquage de PII, et la réponse renvoie le texte masqué ou le message de blocage à utiliser."
  options:
    a:
      en: "Custom Model Import re-hosts the model in Bedrock, which the model owners refuse, and cross-Region inference routes Bedrock models only; it cannot carry calls to another provider's API."
      fr: "Custom Model Import réhéberge le modèle dans Bedrock, ce que les responsables refusent, et l'inférence interrégionale ne route que des modèles Bedrock ; elle ne peut pas transporter les appels vers l'API d'un autre fournisseur."
    b:
      en: "AWS WAF inspects HTTP requests for web exploits; it does not apply the guardrail's content filters, denied topics or PII masking, and it cannot sit in front of a third-party provider's API."
      fr: "AWS WAF inspecte des requêtes HTTP à la recherche d'exploits web ; il n'applique pas les filtres de contenu, sujets refusés ou masquage de PII du guardrail, et il ne peut pas se placer devant l'API d'un fournisseur tiers."
    d:
      en: "Keyword lists and a separate PII service duplicate the safeguards in custom code, so the definitions are no longer maintained in one place and topics and harmful content are not classified the same way."
      fr: "Des listes de mots-clés et un service de PII distinct dupliquent les protections dans du code personnalisé : les définitions ne sont plus maintenues en un seul endroit, et les sujets et contenus nuisibles ne sont pas classés de la même manière."
references:
  - title: Use the ApplyGuardrail API in your application
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-use-independent-api.html
