id: sapc03-2d-guardduty-eks-sequences
objective: "2.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs customer-facing microservices on Amazon EKS clusters in eight AWS accounts. Amazon GuardDuty is enabled across the organization with only the foundational data sources. A threat modeling workshop rated a multi-stage compromise of a cluster as a high risk: an attacker exploits a container, escalates privileges through the Kubernetes API and then reaches other workloads. The security team wants GuardDuty to raise a single critical attack sequence finding when it correlates suspicious Kubernetes control plane activity with suspicious process behavior inside the containers of the same cluster. The team does not want to deploy any third-party agent.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany exécute des microservices destinés aux clients sur des clusters Amazon EKS dans huit comptes AWS. Amazon GuardDuty est activé dans toute l'organisation avec uniquement les sources de données fondamentales. Un atelier de modélisation des menaces a classé comme risque élevé une compromission en plusieurs étapes d'un cluster : un attaquant exploite un conteneur, élève ses privilèges par l'API Kubernetes, puis atteint d'autres charges de travail. L'équipe de sécurité veut que GuardDuty génère un seul résultat critique de séquence d'attaque lorsqu'il corrèle une activité suspecte du plan de contrôle Kubernetes avec un comportement suspect de processus dans les conteneurs du même cluster. L'équipe ne veut déployer aucun agent tiers.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable GuardDuty EKS Protection for the organization so that GuardDuty analyzes the Kubernetes audit logs of the clusters.", fr: "Activer GuardDuty EKS Protection pour l'organisation afin que GuardDuty analyse les journaux d'audit Kubernetes des clusters." } }
    - { id: b, text: { en: "Enable GuardDuty Malware Protection for EC2 so that GuardDuty scans the EBS volumes of the worker nodes when it detects suspicious activity.", fr: "Activer GuardDuty Malware Protection for EC2 afin que GuardDuty analyse les volumes EBS des nœuds de travail lorsqu'il détecte une activité suspecte." } }
    - { id: c, text: { en: "Enable GuardDuty Runtime Monitoring for Amazon EKS with automated management of the GuardDuty security agent add-on.", fr: "Activer GuardDuty Runtime Monitoring pour Amazon EKS avec la gestion automatisée du module complémentaire de l'agent de sécurité GuardDuty." } }
    - { id: d, text: { en: "Enable GuardDuty S3 Protection so that GuardDuty correlates data access to the buckets that the clusters use.", fr: "Activer GuardDuty S3 Protection afin que GuardDuty corrèle les accès aux données des compartiments utilisés par les clusters." } }
    - { id: e, text: { en: "Enable Extended Threat Detection in each account, because it is not active by default when GuardDuty is enabled.", fr: "Activer Extended Threat Detection dans chaque compte, car elle n'est pas active par défaut lorsque GuardDuty est activé." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Extended Threat Detection produces the AttackSequence:EKS/CompromisedCluster finding only when EKS Protection or Runtime Monitoring for EKS is enabled, and GuardDuty recommends both. EKS Protection supplies the control plane activity from the audit logs, and Runtime Monitoring, through the GuardDuty-managed EKS add-on, supplies the process behavior inside containers, so both are needed to correlate the two signal types."
    fr: "Extended Threat Detection ne produit le résultat AttackSequence:EKS/CompromisedCluster que si EKS Protection ou Runtime Monitoring pour EKS est activé, et GuardDuty recommande les deux. EKS Protection fournit l'activité du plan de contrôle issue des journaux d'audit, et Runtime Monitoring, par le module complémentaire EKS géré par GuardDuty, fournit le comportement des processus dans les conteneurs : les deux sont nécessaires pour corréler les deux types de signaux."
  options:
    b:
      en: "Malware Protection for EC2 scans volumes for malware; it is not a data source for EKS attack sequences and does not observe Kubernetes API activity."
      fr: "Malware Protection for EC2 analyse les volumes à la recherche de logiciels malveillants ; ce n'est pas une source de données des séquences d'attaque EKS et il n'observe pas l'activité de l'API Kubernetes."
    d:
      en: "S3 Protection enriches attack sequences about S3 data compromise; it adds neither Kubernetes audit logs nor container runtime behavior."
      fr: "S3 Protection enrichit les séquences d'attaque relatives à la compromission de données S3 ; elle n'apporte ni les journaux d'audit Kubernetes ni le comportement d'exécution des conteneurs."
    e:
      en: "Extended Threat Detection is enabled automatically, at no additional cost, in every Region where GuardDuty is enabled; there is nothing to turn on."
      fr: "Extended Threat Detection est activée automatiquement, sans coût supplémentaire, dans chaque Région où GuardDuty est activé ; il n'y a rien à activer."
references:
  - title: GuardDuty Extended Threat Detection
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty-extended-threat-detection.html
