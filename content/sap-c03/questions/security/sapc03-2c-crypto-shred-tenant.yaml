id: sapc03-2c-crypto-shred-tenant
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An HR software company stores the data of 300 business customers in a shared Amazon DynamoDB table and a shared Amazon S3 bucket. AWS Backup keeps daily backups of the table for 35 days, and S3 Versioning keeps noncurrent object versions for 35 days. New contracts state that when a customer leaves, all of its data, including copies in backups and noncurrent versions, must become unreadable within 7 days. Individual items cannot be removed from existing backups, and the backup retention cannot be shortened for the other customers. The company can change how its application encrypts data before writing it.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels RH stocke les données de 300 clients professionnels dans une table Amazon DynamoDB partagée et un compartiment Amazon S3 partagé. AWS Backup conserve des sauvegardes quotidiennes de la table pendant 35 jours, et la gestion des versions S3 conserve les versions non actuelles des objets pendant 35 jours. Les nouveaux contrats stipulent que lorsqu'un client part, toutes ses données, y compris les copies dans les sauvegardes et les versions non actuelles, doivent devenir illisibles sous 7 jours. Il est impossible de retirer des éléments individuels des sauvegardes existantes, et la rétention des sauvegardes ne peut pas être raccourcie pour les autres clients. L'entreprise peut modifier la façon dont son application chiffre les données avant de les écrire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "When a customer leaves, delete its items and objects, add an S3 Lifecycle rule that expires its noncurrent versions, and let its backup copies expire at the end of the 35-day retention."
        fr: "Lorsqu'un client part, supprimer ses éléments et objets, ajouter une règle de cycle de vie S3 qui fait expirer ses versions non actuelles, et laisser ses copies de sauvegarde expirer à la fin de la rétention de 35 jours."
    - id: b
      text:
        en: "Encrypt the table, the bucket, and the backup vault with one customer managed key, and schedule that key for deletion with a 7-day waiting period when a customer leaves."
        fr: "Chiffrer la table, le compartiment et le coffre de sauvegarde avec une seule clé gérée par le client, et planifier la suppression de cette clé avec une période d'attente de 7 jours lorsqu'un client part."
    - id: c
      text:
        en: "Encrypt each customer's data client-side with the AWS Encryption SDK under its own customer managed key, and disable that key and schedule its deletion when the customer leaves."
        fr: "Chiffrer côté client les données de chaque client avec l'AWS Encryption SDK sous sa propre clé gérée par le client, puis désactiver cette clé et planifier sa suppression au départ du client."
    - id: d
      text:
        en: "Encrypt the table and the bucket with AWS owned keys, and ask AWS Support to delete the key material that protects the departing customer's items, objects, and backups."
        fr: "Chiffrer la table et le compartiment avec des clés détenues par AWS, et demander au Support AWS de supprimer le matériel de clé qui protège les éléments, objets et sauvegardes du client sortant."
answer: { optionId: c }
explanation:
  correct:
    en: "With client-side envelope encryption under one KMS key per customer, every copy of that customer's data, in the table, in noncurrent versions and in backups, is ciphertext that only its key can decrypt. Disabling the key makes the data unreadable at once, and deleting it after the minimum 7-day waiting period makes the ciphertext unrecoverable, which is a cryptographic erasure that leaves the other customers' data and backups untouched."
    fr: "Avec un chiffrement d'enveloppe côté client sous une clé KMS par client, chaque copie des données de ce client, dans la table, dans les versions non actuelles et dans les sauvegardes, est un texte chiffré que seule sa clé peut déchiffrer. Désactiver la clé rend immédiatement les données illisibles, et la supprimer après la période d'attente minimale de 7 jours rend le texte chiffré irrécupérable : il s'agit d'un effacement cryptographique qui laisse intactes les données et sauvegardes des autres clients."
  options:
    a:
      en: "The backup copies remain readable until the 35-day retention ends, which exceeds the 7-day contractual limit."
      fr: "Les copies de sauvegarde restent lisibles jusqu'à la fin de la rétention de 35 jours, ce qui dépasse le délai contractuel de 7 jours."
    b:
      en: "A single shared key protects every customer, so deleting it destroys the data and backups of all 300 customers instead of one."
      fr: "Une seule clé partagée protège tous les clients : la supprimer détruit les données et sauvegardes des 300 clients au lieu d'un seul."
    d:
      en: "AWS owned keys are controlled exclusively by the AWS service; customers cannot have them deleted, and they are shared by all the data in the table."
      fr: "Les clés détenues par AWS sont contrôlées exclusivement par le service AWS ; les clients ne peuvent pas les faire supprimer, et elles sont partagées par toutes les données de la table."
references:
  - title: Delete an AWS KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/deleting-keys.html
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
