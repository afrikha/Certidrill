id: sapc03-2b-rcp-tls-sqs-secrets
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 80 member accounts in AWS Organizations. Amazon SQS queues and AWS Secrets Manager secrets in these accounts are accessed by the company's own applications and by principals in partner accounts outside the organization. A new rule requires that every request to these queues and secrets use TLS, whoever sends it. Account administrators must not be able to override the rule in the resource policies that they manage.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 80 comptes membres dans AWS Organizations. Les files d'attente Amazon SQS et les secrets AWS Secrets Manager de ces comptes sont utilisés par les applications de l'entreprise et par des principaux de comptes partenaires hors de l'organisation. Une nouvelle règle exige que chaque requête adressée à ces files et secrets utilise TLS, quel que soit son émetteur. Les administrateurs des comptes ne doivent pas pouvoir contourner la règle dans les politiques de ressources qu'ils gèrent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP to the organization root that denies sqs:* and secretsmanager:* when aws:SecureTransport is false.", fr: "Attacher à la racine de l'organisation une SCP qui refuse sqs:* et secretsmanager:* lorsque aws:SecureTransport est false." } }
    - { id: b, text: { en: "Deploy an AWS Config rule in every account that reports queues and secrets whose resource policies do not deny requests without TLS.", fr: "Déployer dans chaque compte une règle AWS Config qui signale les files et les secrets dont les politiques de ressources ne refusent pas les requêtes sans TLS." } }
    - { id: c, text: { en: "Attach an RCP to the organization root that denies sqs:* and secretsmanager:* when aws:SecureTransport is false.", fr: "Attacher à la racine de l'organisation une RCP qui refuse sqs:* et secretsmanager:* lorsque aws:SecureTransport est false." } }
    - { id: d, text: { en: "Add a statement to every queue policy and secret policy that denies requests when aws:SecureTransport is false, and protect it with permissions boundaries.", fr: "Ajouter à chaque politique de file et de secret une instruction qui refuse les requêtes lorsque aws:SecureTransport est false, et la protéger avec des limites d'autorisations." } }
answer: { optionId: c }
explanation:
  correct:
    en: "RCPs set the maximum permissions on resources in member accounts for every principal, including principals from other organizations, and Amazon SQS and AWS Secrets Manager are among the services that RCPs support. A resource policy cannot grant what an RCP denies, so account administrators cannot weaken the rule."
    fr: "Les RCP fixent les autorisations maximales sur les ressources des comptes membres pour tous les principaux, y compris ceux d'autres organisations, et Amazon SQS et AWS Secrets Manager font partie des services pris en charge par les RCP. Une politique de ressource ne peut pas accorder ce qu'une RCP refuse : les administrateurs des comptes ne peuvent pas affaiblir la règle."
  options:
    a:
      en: "SCPs do not affect principals from accounts outside the organization, so the partners' requests would not be restricted."
      fr: "Les SCP n'affectent pas les principaux des comptes hors de l'organisation : les requêtes des partenaires ne seraient pas restreintes."
    b:
      en: "A Config rule only reports noncompliant policies; it does not block requests without TLS."
      fr: "Une règle Config ne fait que signaler les politiques non conformes ; elle ne bloque pas les requêtes sans TLS."
    d:
      en: "Account administrators can edit their own resource policies, and permissions boundaries limit identities, not resource policies."
      fr: "Les administrateurs des comptes peuvent modifier leurs propres politiques de ressources, et les limites d'autorisations restreignent des identités, pas des politiques de ressources."
references:
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
