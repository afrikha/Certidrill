id: sapc03-2a-internal-access-analyzer
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 120 accounts in AWS Organizations and a delegated administrator account for IAM Access Analyzer. Customer data is stored in 25 business-critical resources: Amazon S3 buckets and Amazon DynamoDB tables in two Regions. Auditors ask which IAM roles and users inside the organization can access these resources, whether through identity-based policies, resource-based policies or both. The security team wants continuous findings that update when policies change, and wants the cost to depend only on the resources that it chooses to monitor.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 120 comptes dans AWS Organizations et un compte administrateur délégué pour IAM Access Analyzer. Les données clients sont stockées dans 25 ressources critiques : des compartiments (buckets) Amazon S3 et des tables Amazon DynamoDB dans deux Régions. Les auditeurs demandent quels rôles et utilisateurs IAM de l'organisation peuvent accéder à ces ressources, que ce soit par des politiques basées sur l'identité, des politiques basées sur les ressources ou les deux. L'équipe de sécurité veut des résultats continus, mis à jour lorsque les politiques changent, et veut que le coût ne dépende que des ressources qu'elle choisit de surveiller.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an organization-level external access analyzer in the delegated administrator account in each Region, and filter the findings on the 25 resources."
        fr: "Créer un analyseur d'accès externe au niveau de l'organisation dans le compte administrateur délégué dans chaque Région, et filtrer les résultats sur les 25 ressources."
    - id: b
      text:
        en: "Create an organization-level internal access analyzer in the delegated administrator account in each of the two Regions, and add the 25 resources to it by ARN."
        fr: "Créer un analyseur d'accès interne au niveau de l'organisation dans le compte administrateur délégué dans chacune des deux Régions, et lui ajouter les 25 ressources par ARN."
    - id: c
      text:
        en: "Create an organization-level unused access analyzer in the delegated administrator account, and review the findings for roles and users that use S3 and DynamoDB."
        fr: "Créer un analyseur d'accès inutilisé au niveau de l'organisation dans le compte administrateur délégué, et examiner les résultats des rôles et utilisateurs qui utilisent S3 et DynamoDB."
    - id: d
      text:
        en: "Enable S3 and DynamoDB data events in an organization trail, and run a weekly CloudTrail Lake query that lists the principals that accessed the 25 resources."
        fr: "Activer les événements de données S3 et DynamoDB dans un journal de suivi d'organisation, et exécuter chaque semaine une requête CloudTrail Lake qui liste les principaux ayant accédé aux 25 ressources."
answer: { optionId: b }
explanation:
  correct:
    en: "An internal access analyzer shows which principals within the organization or account can access selected business-critical resources, including S3 buckets and DynamoDB tables. It is created per Region, resources are added by account, by ARN or from a file, and it is charged by the number of resources monitored."
    fr: "Un analyseur d'accès interne montre quels principaux de l'organisation ou du compte peuvent accéder à des ressources critiques sélectionnées, dont les compartiments S3 et les tables DynamoDB. Il se crée par Région, les ressources s'ajoutent par compte, par ARN ou depuis un fichier, et il est facturé selon le nombre de ressources surveillées."
  options:
    a:
      en: "An external access analyzer reports access granted to entities outside the zone of trust, not which principals inside the organization can reach the resources."
      fr: "Un analyseur d'accès externe signale les accès accordés à des entités situées hors de la zone de confiance, pas les principaux de l'organisation qui peuvent atteindre les ressources."
    c:
      en: "An unused access analyzer reports unused roles, keys, passwords and permissions; it does not list who can access a specific resource."
      fr: "Un analyseur d'accès inutilisé signale les rôles, clés, mots de passe et autorisations inutilisés ; il ne liste pas qui peut accéder à une ressource précise."
    d:
      en: "Data events show who did access the resources, not who can access them, and a weekly query is not continuous."
      fr: "Les événements de données montrent qui a accédé aux ressources, pas qui peut y accéder, et une requête hebdomadaire n'est pas continue."
references:
  - title: Create an IAM Access Analyzer internal access analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-create-internal.html
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
