id: sapc03-2c-patch-policy-mgmt-account
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank has 250 accounts in AWS Organizations, and all its Amazon EC2 instances run Windows Server or Amazon Linux 2023 as AWS Systems Manager managed nodes. A cloud operations account is a delegated administrator for Systems Manager. The bank requires that every instance be scanned daily for missing patches and that approved patches be installed every Sunday at 02:00 UTC, by using the bank's custom patch baselines. The configuration must cover every OU except a Sandbox OU in three AWS Regions, and accounts added to those OUs must be covered automatically. When the operations team opened Quick Setup in the cloud operations account to create a patch policy, the option to target the organization was not available. The bank wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une banque possède 250 comptes dans AWS Organizations, et toutes ses instances Amazon EC2 exécutent Windows Server ou Amazon Linux 2023 en tant que nœuds gérés AWS Systems Manager. Un compte d'opérations cloud est administrateur délégué de Systems Manager. La banque exige que chaque instance soit analysée chaque jour pour détecter les correctifs manquants et que les correctifs approuvés soient installés chaque dimanche à 02:00 UTC, à l'aide des référentiels de correctifs personnalisés de la banque. La configuration doit couvrir toutes les OU sauf une OU Sandbox dans trois Régions AWS, et les comptes ajoutés à ces OU doivent être couverts automatiquement. Lorsque l'équipe d'exploitation a ouvert Quick Setup dans le compte d'opérations cloud pour créer une politique de correctifs, l'option permettant de cibler l'organisation n'était pas disponible. La banque veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "From the cloud operations account, deploy maintenance windows with AWS-RunPatchBaseline tasks to every account and Region with CloudFormation StackSets, and register the instances by patch group tags."
        fr: "Depuis le compte d'opérations cloud, déployer des fenêtres de maintenance avec des tâches AWS-RunPatchBaseline dans chaque compte et chaque Région avec CloudFormation StackSets, et enregistrer les instances à l'aide d'étiquettes de groupe de correctifs."
    - id: b
      text:
        en: "Sign in to the management account and create a Quick Setup patch policy that targets the required OUs and Regions, with a daily scan schedule, a weekly install schedule, and the custom baselines."
        fr: "Se connecter au compte de gestion et créer une politique de correctifs Quick Setup qui cible les OU et Régions requises, avec une planification d'analyse quotidienne, une planification d'installation hebdomadaire et les référentiels personnalisés."
    - id: c
      text:
        en: "From the cloud operations account, run a multi-account and multi-Region Systems Manager Automation every Sunday that runs AWS-RunPatchBaseline with the Install operation on the target OUs."
        fr: "Depuis le compte d'opérations cloud, lancer chaque dimanche une exécution Systems Manager Automation multicomptes et multi-Régions qui exécute AWS-RunPatchBaseline avec l'opération Install sur les OU cibles."
    - id: d
      text:
        en: "From the cloud operations account, use Patch Manager Patch now every Sunday for each target account and Region, and run a Scan operation with Patch now every day."
        fr: "Depuis le compte d'opérations cloud, utiliser Patch now de Patch Manager chaque dimanche pour chaque compte et chaque Région cibles, et lancer chaque jour une opération Scan avec Patch now."
answer: { optionId: b }
explanation:
  correct:
    en: "Patch policies are the recommended way to patch across an organization: one policy covers selected OUs and Regions, has separate scan and install schedules, selects the baseline per operating system, and applies to accounts that join the targeted OUs. For an organization, the patch policy must be created from the management account, not from a delegated administrator, which is why the option was missing."
    fr: "Les politiques de correctifs sont la méthode recommandée pour appliquer des correctifs dans une organisation : une seule politique couvre les OU et Régions choisies, possède des planifications d'analyse et d'installation distinctes, sélectionne le référentiel par système d'exploitation et s'applique aux comptes qui rejoignent les OU ciblées. Pour une organisation, la politique de correctifs doit être créée depuis le compte de gestion, et non depuis un administrateur délégué, ce qui explique l'absence de l'option."
  options:
    a:
      en: "Maintenance windows per account and Region, plus patch group registration, are the multi-step setup that patch policies replace, and they must be maintained in hundreds of account-Region pairs."
      fr: "Des fenêtres de maintenance par compte et par Région, avec l'enregistrement par groupe de correctifs, constituent la configuration en plusieurs étapes que les politiques de correctifs remplacent, et elles doivent être maintenues dans des centaines de couples compte-Région."
    c:
      en: "An Automation run is an on-demand operation that someone must schedule and start; it adds no daily compliance scan and is more effort to operate than a patch policy."
      fr: "Une exécution Automation est une opération à la demande que quelqu'un doit planifier et lancer ; elle n'ajoute pas d'analyse de conformité quotidienne et demande plus d'efforts d'exploitation qu'une politique de correctifs."
    d:
      en: "Patch now is limited to one account-Region pair at a time, so it would require hundreds of manual runs every day and every week."
      fr: "Patch now est limité à un couple compte-Région à la fois : il faudrait des centaines d'exécutions manuelles chaque jour et chaque semaine."
references:
