id: sapc03-2c-eu-sovereign-cloud
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A German public-sector agency is planning to move its citizen services to AWS and will create its AWS accounts for this project. The procurement rules impose three conditions on the cloud provider. The infrastructure must be operated and supported only by personnel located in the EU. Customer-created metadata, such as IAM roles, permissions, resource tags, and configurations, must stay in the EU. The cloud must be designed to keep operating even if it is cut off from the provider's systems outside the EU. The workloads need the standard AWS services, deployed in Germany.

    Which solution will meet these requirements?
  fr: |
    Une agence publique allemande prévoit de transférer ses services aux citoyens vers AWS et va créer ses comptes AWS pour ce projet. Les règles de marchés publics imposent trois conditions au fournisseur cloud. L'infrastructure doit être exploitée et prise en charge uniquement par du personnel situé dans l'UE. Les métadonnées créées par le client, comme les rôles IAM, les autorisations, les étiquettes de ressources et les configurations, doivent rester dans l'UE. Le cloud doit être conçu pour continuer à fonctionner même s'il est coupé des systèmes du fournisseur situés hors de l'UE. Les charges de travail ont besoin des services AWS standard, déployés en Allemagne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create the accounts in the AWS European Sovereign Cloud and deploy the workloads in its Region in Brandenburg, Germany."
        fr: "Créer les comptes dans l'AWS European Sovereign Cloud et déployer les charges de travail dans sa Région du Brandebourg, en Allemagne."
    - id: b
      text:
        en: "Deploy the workloads in eu-central-1 with an AWS Control Tower Region deny control, and protect the data with AWS KMS keys in an external key store."
        fr: "Déployer les charges de travail dans eu-central-1 avec un contrôle Region deny d'AWS Control Tower, et protéger les données avec des clés AWS KMS d'un magasin de clés externe."
    - id: c
      text:
        en: "Install AWS Outposts racks in the agency's data center in Germany, connected to eu-central-1, and run all workloads on the Outposts."
        fr: "Installer des racks AWS Outposts dans le centre de données de l'agence en Allemagne, connectés à eu-central-1, et exécuter toutes les charges de travail sur les Outposts."
    - id: d
      text:
        en: "Deploy the workloads in eu-central-1 with an SCP that denies all non-EU Regions, and enable IAM Identity Center in eu-central-1 for all users."
        fr: "Déployer les charges de travail dans eu-central-1 avec une SCP qui refuse toutes les Régions hors UE, et activer IAM Identity Center dans eu-central-1 pour tous les utilisateurs."
answer: { optionId: a }
explanation:
  correct:
    en: "The AWS European Sovereign Cloud is an independent cloud for Europe whose first Region is in Brandenburg, Germany. It is operated and supported by qualified staff located in the EU, lets customers keep customer-created metadata such as roles, permissions, resource labels and configurations in the EU, and is designed to operate without dependency on global AWS systems, even if it is isolated from AWS outside the EU."
    fr: "L'AWS European Sovereign Cloud est un cloud indépendant pour l'Europe dont la première Région se trouve dans le Brandebourg, en Allemagne. Il est exploité et pris en charge par du personnel qualifié situé dans l'UE, permet aux clients de conserver dans l'UE les métadonnées qu'ils créent, comme les rôles, autorisations, étiquettes de ressources et configurations, et est conçu pour fonctionner sans dépendre des systèmes AWS mondiaux, même s'il est isolé d'AWS hors de l'UE."
  options:
    b:
      en: "A Region restriction and external keys control where data is deployed and who holds keys, but they do not change who operates the infrastructure or where global metadata is processed."
      fr: "Une restriction de Région et des clés externes contrôlent où les données sont déployées et qui détient les clés, mais elles ne changent ni qui exploite l'infrastructure ni où les métadonnées globales sont traitées."
    c:
      en: "Outposts are managed from and depend on their parent Region; for example, they need connectivity to it for many operations, so they do not operate independently of systems outside the site."
      fr: "Les Outposts sont gérés depuis leur Région parente et en dépendent ; par exemple, de nombreuses opérations exigent une connectivité avec elle : ils ne fonctionnent donc pas indépendamment des systèmes extérieurs au site."
    d:
      en: "An SCP limits which Regions principals can call, but it does not determine who operates the AWS infrastructure or keep global metadata in the EU."
      fr: "Une SCP limite les Régions que les principaux peuvent appeler, mais elle ne détermine pas qui exploite l'infrastructure AWS et ne conserve pas les métadonnées globales dans l'UE."
references:
  - title: Design goals
    url: https://docs.aws.amazon.com/whitepapers/latest/overview-aws-european-sovereign-cloud/design-goals.html
