id: sapc03-2c-cloudhsm-key-store
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A securities exchange is moving its trade surveillance platform to AWS in a single Region. Its regulator requires that the keys protecting trade data be generated and stored in HSMs that the exchange controls in its own AWS account, including the creation and deletion of HSMs, HSM users, and backups. The platform must keep using SSE-KMS for Amazon S3 and AWS KMS encryption for Amazon EBS and Amazon RDS, and the keys must be managed with the usual AWS KMS key policies and console. For latency and operational reasons, the exchange will not run any key manager or proxy outside AWS.

    Which solution will meet these requirements?
  fr: |
    Une bourse de valeurs transfère sa plateforme de surveillance des transactions vers AWS dans une seule Région. Son régulateur exige que les clés qui protègent les données de transaction soient générées et stockées dans des HSM que la bourse contrôle dans son propre compte AWS, y compris la création et la suppression des HSM, des utilisateurs des HSM et des sauvegardes. La plateforme doit continuer à utiliser SSE-KMS pour Amazon S3 et le chiffrement AWS KMS pour Amazon EBS et Amazon RDS, et les clés doivent être gérées avec les politiques de clé et la console AWS KMS habituelles. Pour des raisons de latence et d'exploitation, la bourse n'exécutera aucun gestionnaire de clés ni proxy en dehors d'AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS KMS custom key store backed by an AWS CloudHSM cluster with two HSMs in different Availability Zones, and use KMS keys from that store."
        fr: "Créer un magasin de clés personnalisé AWS KMS adossé à un cluster AWS CloudHSM de deux HSM dans des zones de disponibilité différentes, et utiliser des clés KMS de ce magasin."
    - id: b
      text:
        en: "Create an AWS KMS external key store that connects through an external key store proxy to the exchange's HSMs, and use KMS keys from that store."
        fr: "Créer un magasin de clés externe AWS KMS qui se connecte par un proxy de magasin de clés externe aux HSM de la bourse, et utiliser des clés KMS de ce magasin."
    - id: c
      text:
        en: "Create standard AWS KMS customer managed keys with automatic key rotation turned on, and restrict their key policies to the IAM roles of the surveillance platform."
        fr: "Créer des clés gérées par le client AWS KMS standard avec la rotation automatique activée, et limiter leurs politiques de clé aux rôles IAM de la plateforme de surveillance."
    - id: d
      text:
        en: "Create an AWS CloudHSM cluster, change the applications to encrypt data client-side with the PKCS #11 library, and keep SSE-S3 on the buckets."
        fr: "Créer un cluster AWS CloudHSM, modifier les applications pour chiffrer les données côté client avec la bibliothèque PKCS #11, et conserver SSE-S3 sur les compartiments."
answer: { optionId: a }
explanation:
  correct:
    en: "An AWS CloudHSM key store is a KMS custom key store backed by a CloudHSM cluster that the customer owns and manages in its own account, including HSMs, users and backups. AWS KMS generates non-extractable key material in the cluster, and the keys are managed like other KMS keys and work with services that support customer managed keys. Creating KMS keys requires at least two active HSMs in different Availability Zones."
    fr: "Un magasin de clés AWS CloudHSM est un magasin de clés personnalisé KMS adossé à un cluster CloudHSM que le client possède et gère dans son propre compte, y compris les HSM, les utilisateurs et les sauvegardes. AWS KMS génère dans le cluster un matériel de clé non extractible, et les clés se gèrent comme les autres clés KMS et fonctionnent avec les services qui prennent en charge les clés gérées par le client. La création de clés KMS exige au moins deux HSM actifs dans des zones de disponibilité différentes."
  options:
    b:
      en: "An external key store requires a key manager and a proxy that the customer runs outside AWS, which the exchange refuses for latency and operational reasons."
      fr: "Un magasin de clés externe exige un gestionnaire de clés et un proxy que le client exécute en dehors d'AWS, ce que la bourse refuse pour des raisons de latence et d'exploitation."
    c:
      en: "Standard KMS keys are generated and stored in HSMs that AWS KMS operates, so the exchange does not control the HSMs, their users, or their backups."
      fr: "Les clés KMS standard sont générées et stockées dans des HSM qu'exploite AWS KMS : la bourse ne contrôle ni les HSM, ni leurs utilisateurs, ni leurs sauvegardes."
    d:
      en: "Client-side encryption does not integrate with SSE-KMS or with KMS encryption for EBS and RDS, and the keys would not be managed with KMS key policies."
      fr: "Le chiffrement côté client ne s'intègre ni à SSE-KMS ni au chiffrement KMS d'EBS et de RDS, et les clés ne seraient pas gérées avec des politiques de clé KMS."
references:
  - title: AWS CloudHSM key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
