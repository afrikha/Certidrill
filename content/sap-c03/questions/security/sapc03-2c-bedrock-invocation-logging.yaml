id: sapc03-2c-bedrock-invocation-logging
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company runs a claims assistant that calls the Amazon Bedrock Converse API from three workload accounts in eu-west-1. An AWS CloudTrail organization trail logs management events for all accounts. Auditors now require the full text of every prompt and every model response, together with the identity of the caller, retained for 5 years in each workload account. The security team checked the CloudTrail events for Converse and found metadata such as the model ID and the caller, but no prompt or response content. The company wants to meet the requirement without changing the application code.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance exploite un assistant de gestion des sinistres qui appelle l'API Converse d'Amazon Bedrock depuis trois comptes de charge de travail dans eu-west-1. Un journal de suivi d'organisation AWS CloudTrail journalise les événements de gestion de tous les comptes. Les auditeurs exigent désormais le texte complet de chaque invite et de chaque réponse du modèle, avec l'identité de l'appelant, conservé pendant 5 ans dans chaque compte de charge de travail. L'équipe de sécurité a vérifié les événements CloudTrail de Converse et y a trouvé des métadonnées comme l'ID du modèle et l'appelant, mais aucun contenu d'invite ni de réponse. L'entreprise veut répondre à l'exigence sans modifier le code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add advanced event selectors for Amazon Bedrock data events to the organization trail so that the request and response bodies of Converse calls are recorded."
        fr: "Ajouter au journal de suivi d'organisation des sélecteurs d'événements avancés pour les événements de données Amazon Bedrock afin d'enregistrer le corps des requêtes et des réponses des appels Converse."
    - id: b
      text:
        en: "In each workload account, turn on Bedrock model invocation logging in eu-west-1 for text data to an S3 bucket in the same account and Region, with a 5-year retention."
        fr: "Dans chaque compte de charge de travail, activer la journalisation des appels de modèle Bedrock dans eu-west-1 pour les données texte vers un compartiment S3 du même compte et de la même Région, avec une rétention de 5 ans."
    - id: c
      text:
        en: "Turn on Amazon Bedrock AgentCore Observability for the workload accounts so that the prompts and responses of the assistant are stored in Amazon CloudWatch."
        fr: "Activer Amazon Bedrock AgentCore Observability pour les comptes de charge de travail afin que les invites et les réponses de l'assistant soient stockées dans Amazon CloudWatch."
    - id: d
      text:
        en: "Create an Amazon Bedrock guardrail with contextual grounding checks, and attach it to the Converse calls so that the evaluated content is written to CloudTrail."
        fr: "Créer un guardrail Amazon Bedrock avec des vérifications d'ancrage contextuel, et l'attacher aux appels Converse afin que le contenu évalué soit écrit dans CloudTrail."
answer: { optionId: b }
explanation:
  correct:
    en: "Model invocation logging records the full request data, response data and metadata, including the caller's identity ARN, for Converse, ConverseStream, InvokeModel and InvokeModelWithResponseStream calls. It is disabled by default, is configured per account in a Region, and delivers to S3, CloudWatch Logs, or both in the same account and Region, where retention can be set for 5 years."
    fr: "La journalisation des appels de modèle enregistre l'intégralité des données de requête, des données de réponse et des métadonnées, y compris l'ARN de l'identité de l'appelant, pour les appels Converse, ConverseStream, InvokeModel et InvokeModelWithResponseStream. Elle est désactivée par défaut, se configure par compte dans une Région et livre vers S3, CloudWatch Logs ou les deux dans le même compte et la même Région, où une rétention de 5 ans peut être définie."
  options:
    a:
      en: "Converse calls are management events, not data events, and CloudTrail records request metadata rather than prompt and response content."
      fr: "Les appels Converse sont des événements de gestion, pas des événements de données, et CloudTrail enregistre les métadonnées des requêtes plutôt que le contenu des invites et des réponses."
    c:
      en: "AgentCore Observability provides traces, metrics and logs for agents and resources hosted on AgentCore; the assistant calls the Converse API directly and does not run on AgentCore."
      fr: "AgentCore Observability fournit des traces, des métriques et des journaux pour les agents et ressources hébergés sur AgentCore ; l'assistant appelle directement l'API Converse et ne s'exécute pas sur AgentCore."
    d:
      en: "Guardrails evaluate content and return assessments; guardrail events in CloudTrail contain assessment metadata, not a complete record of prompts and responses, and attaching one changes the application."
      fr: "Les guardrails évaluent le contenu et renvoient des évaluations ; leurs événements CloudTrail contiennent des métadonnées d'évaluation, pas un enregistrement complet des invites et réponses, et en attacher un modifie l'application."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: Monitor Amazon Bedrock API calls using CloudTrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
