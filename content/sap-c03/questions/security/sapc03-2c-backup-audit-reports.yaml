id: sapc03-2c-backup-audit-reports
objective: "2.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank uses AWS Backup in 50 accounts of its organization in AWS Organizations, with a central backup account that is the AWS Backup delegated administrator. External auditors require daily evidence, throughout the audit period, that every production Amazon EC2 instance, Amazon RDS database, and Amazon DynamoDB table is protected by a backup plan that runs at least daily and keeps recovery points for at least 35 days. The evidence must list noncompliant resources and be delivered as files to an S3 bucket in the central backup account. The bank has never used AWS Audit Manager and wants the solution with the LEAST custom development.

    Which solution will meet these requirements?
  fr: |
    Une banque utilise AWS Backup dans 50 comptes de son organisation AWS Organizations, avec un compte de sauvegarde central qui est l'administrateur délégué d'AWS Backup. Des auditeurs externes exigent une preuve quotidienne, pendant toute la période d'audit, que chaque instance Amazon EC2, base de données Amazon RDS et table Amazon DynamoDB de production est protégée par un plan de sauvegarde qui s'exécute au moins une fois par jour et conserve les points de récupération au moins 35 jours. La preuve doit lister les ressources non conformes et être livrée sous forme de fichiers dans un compartiment S3 du compte de sauvegarde central. La banque n'a jamais utilisé AWS Audit Manager et veut la solution qui demande le MOINS de développement personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Audit Manager assessment from a custom framework with backup frequency and retention controls, and generate an assessment report every day."
        fr: "Créer une évaluation AWS Audit Manager à partir d'un framework personnalisé avec des contrôles de fréquence et de rétention des sauvegardes, et générer un rapport d'évaluation chaque jour."
    - id: b
      text:
        en: "Write AWS Config custom Lambda rules that check the recovery points of each resource, deploy them to every account, and export the results with a daily script."
        fr: "Écrire des règles AWS Config Lambda personnalisées qui vérifient les points de récupération de chaque ressource, les déployer dans chaque compte, et exporter les résultats avec un script quotidien."
    - id: c
      text:
        en: "Turn on resource tracking, deploy a Backup Audit Manager framework with frequency and retention controls to all accounts, and create a cross-account compliance report plan."
        fr: "Activer le suivi des ressources, déployer dans tous les comptes un framework Backup Audit Manager avec des contrôles de fréquence et de rétention, et créer un plan de rapport de conformité entre comptes."
    - id: d
      text:
        en: "Create an AWS Backup jobs report plan in the central backup account that lists, every day, the completed and failed backup jobs of all accounts in the organization."
        fr: "Créer dans le compte de sauvegarde central un plan de rapport de tâches AWS Backup qui liste chaque jour les tâches de sauvegarde terminées et en échec de tous les comptes de l'organisation."
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Backup Audit Manager frameworks contain controls that audit backup requirements such as frequency and retention, and they rely on AWS Config resource tracking. Compliance reports are delivered daily to an S3 bucket in the account that owns the report plan, and the management account or delegated administrator can create cross-account reports. To include member accounts, the framework must exist in each member account, which StackSets can deploy."
    fr: "Les frameworks d'AWS Backup Audit Manager contiennent des contrôles qui auditent des exigences de sauvegarde comme la fréquence et la rétention, et ils s'appuient sur le suivi des ressources d'AWS Config. Les rapports de conformité sont livrés chaque jour dans un compartiment S3 du compte propriétaire du plan de rapport, et le compte de gestion ou l'administrateur délégué peut créer des rapports entre comptes. Pour inclure les comptes membres, le framework doit exister dans chaque compte membre, ce que StackSets peut déployer."
  options:
    a:
      en: "AWS Audit Manager is no longer open to new customers, so a bank that has never used it cannot create assessments."
      fr: "AWS Audit Manager n'est plus ouvert aux nouveaux clients : une banque qui ne l'a jamais utilisé ne peut pas créer d'évaluations."
    b:
      en: "Custom Lambda rules and an export script are custom development that the managed backup controls already provide."
      fr: "Des règles Lambda personnalisées et un script d'export constituent un développement personnalisé que les contrôles de sauvegarde gérés fournissent déjà."
    d:
      en: "A jobs report shows the jobs of the last 24 hours, but it does not evaluate each resource against the frequency and retention requirements or list unprotected resources."
      fr: "Un rapport de tâches montre les tâches des dernières 24 heures, mais il n'évalue pas chaque ressource par rapport aux exigences de fréquence et de rétention et ne liste pas les ressources non protégées."
references:
  - title: AWS Backup Audit Manager
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/aws-backup-audit-manager.html
  - title: Working with audit reports
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/working-with-audit-reports.html
