id: sapc03-2a-abac-tag-on-create
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses attribute-based access control for Amazon EC2 in shared development accounts. Developers sign in with roles that carry a team principal tag from the identity provider. Their policy allows ec2:StartInstances, ec2:StopInstances and ec2:TerminateInstances when aws:ResourceTag/team equals ${aws:PrincipalTag/team}. A review found that developers can launch instances without a team tag, launch instances tagged with another team's value, and retag existing instances to take control of them. Every new instance must carry a team tag equal to the developer's own team, and developers must not be able to add or change tags on existing instances.

    Which combination of policy statements should be added to the developers' policy? (Choose two.)
  fr: |
    AnyCompany utilise le contrôle d'accès par attributs (ABAC) pour Amazon EC2 dans des comptes de développement partagés. Les développeurs se connectent avec des rôles qui portent une balise de principal team issue du fournisseur d'identité. Leur politique autorise ec2:StartInstances, ec2:StopInstances et ec2:TerminateInstances lorsque aws:ResourceTag/team est égal à ${aws:PrincipalTag/team}. Une revue a montré que les développeurs peuvent lancer des instances sans balise team, lancer des instances balisées avec la valeur d'une autre équipe, et rebaliser des instances existantes pour en prendre le contrôle. Chaque nouvelle instance doit porter une balise team égale à l'équipe du développeur, et les développeurs ne doivent pas pouvoir ajouter ni modifier de balises sur les instances existantes.

    Quelle combinaison d'instructions de politique faut-il ajouter à la politique des développeurs ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Allow ec2:RunInstances on the instance resource type only when aws:RequestTag/team equals ${aws:PrincipalTag/team}."
        fr: "Autoriser ec2:RunInstances sur le type de ressource instance uniquement lorsque aws:RequestTag/team est égal à ${aws:PrincipalTag/team}."
    - id: b
      text:
        en: "Allow ec2:CreateTags on instances only when aws:ResourceTag/team equals ${aws:PrincipalTag/team}."
        fr: "Autoriser ec2:CreateTags sur les instances uniquement lorsque aws:ResourceTag/team est égal à ${aws:PrincipalTag/team}."
    - id: c
      text:
        en: "Allow ec2:CreateTags only when ec2:CreateAction equals RunInstances."
        fr: "Autoriser ec2:CreateTags uniquement lorsque ec2:CreateAction est égal à RunInstances."
    - id: d
      text:
        en: "Allow ec2:RunInstances on the instance resource type when ForAllValues:StringEquals on aws:TagKeys matches the list [team]."
        fr: "Autoriser ec2:RunInstances sur le type de ressource instance lorsque ForAllValues:StringEquals sur aws:TagKeys correspond à la liste [team]."
    - id: e
      text:
        en: "Deny ec2:DeleteTags on all resources for the developers' roles, so that existing team tags can never be removed."
        fr: "Refuser ec2:DeleteTags sur toutes les ressources pour les rôles des développeurs, afin que les balises team existantes ne puissent jamais être supprimées."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Requiring aws:RequestTag/team to equal the principal's team on RunInstances forces every launch to carry the developer's own team value. Allowing ec2:CreateTags only when ec2:CreateAction is RunInstances permits tagging during launch but blocks direct CreateTags calls on existing instances."
    fr: "Exiger sur RunInstances que aws:RequestTag/team soit égal à l'équipe du principal oblige chaque lancement à porter la valeur d'équipe du développeur. Autoriser ec2:CreateTags uniquement lorsque ec2:CreateAction vaut RunInstances permet le balisage pendant le lancement mais bloque les appels CreateTags directs sur les instances existantes."
  options:
    b:
      en: "Developers could still call CreateTags on their own team's instances and overwrite the team tag with another team's value."
      fr: "Les développeurs pourraient toujours appeler CreateTags sur les instances de leur équipe et écraser la balise team avec la valeur d'une autre équipe."
    d:
      en: "ForAllValues only limits which tag keys may appear; it allows a launch with no tags at all and does not check the tag value."
      fr: "ForAllValues limite seulement les clés de balise autorisées ; il permet un lancement sans aucune balise et ne vérifie pas la valeur de la balise."
    e:
      en: "Blocking DeleteTags does not stop CreateTags from overwriting an existing team tag with a new value."
      fr: "Bloquer DeleteTags n'empêche pas CreateTags d'écraser une balise team existante avec une nouvelle valeur."
references:
  - title: Grant permission to tag Amazon EC2 resources during creation
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/supported-iam-actions-tagging.html
