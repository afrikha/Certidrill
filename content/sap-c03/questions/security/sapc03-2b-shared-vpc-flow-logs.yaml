id: sapc03-2b-shared-vpc-flow-logs
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's network account owns a VPC whose subnets are shared through AWS RAM with 12 application accounts in the same organization. The application accounts launch Amazon EC2 instances and load balancers in the shared subnets. The network security team must capture flow logs for all traffic in the shared subnets, including the traffic of network interfaces that the application accounts own, in one central log destination. Application teams must not have to configure anything.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'AnyCompany possède un VPC dont les sous-réseaux sont partagés via AWS RAM avec 12 comptes d'application de la même organisation. Les comptes d'application lancent des instances Amazon EC2 et des équilibreurs de charge dans les sous-réseaux partagés. L'équipe de sécurité réseau doit capturer les journaux de flux de tout le trafic des sous-réseaux partagés, y compris celui des interfaces réseau appartenant aux comptes d'application, dans une destination de journaux centrale. Les équipes applicatives ne doivent rien avoir à configurer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Ask each application account to create flow logs on the shared subnets and to deliver them to the central destination.", fr: "Demander à chaque compte d'application de créer des journaux de flux sur les sous-réseaux partagés et de les livrer à la destination centrale." } }
    - { id: b, text: { en: "Create a Traffic Mirroring session in each application account that mirrors its network interfaces to a collector in the network account.", fr: "Créer dans chaque compte d'application une session Traffic Mirroring qui met en miroir ses interfaces réseau vers un collecteur du compte réseau." } }
    - { id: c, text: { en: "Ask each application account to create flow logs for the network interfaces that it owns and to deliver them to the central destination.", fr: "Demander à chaque compte d'application de créer des journaux de flux pour les interfaces réseau qu'il possède et de les livrer à la destination centrale." } }
    - { id: d, text: { en: "In the network account, create flow logs for the shared subnets, and deliver them to the central destination.", fr: "Dans le compte réseau, créer des journaux de flux pour les sous-réseaux partagés, et les livrer à la destination centrale." } }
answer: { optionId: d }
explanation:
  correct:
    en: "The VPC owner can create flow logs for a shared subnet and for network interfaces that it does not own in that subnet. Subnet-level flow logs created by the owner therefore capture the traffic of the participants' interfaces without any action from the application teams."
    fr: "Le propriétaire du VPC peut créer des journaux de flux pour un sous-réseau partagé et pour les interfaces réseau de ce sous-réseau qui ne lui appartiennent pas. Des journaux de flux au niveau du sous-réseau créés par le propriétaire capturent donc le trafic des interfaces des participants sans aucune action des équipes applicatives."
  options:
    a:
      en: "Participants cannot create flow logs for a shared subnet, and the application teams would have to configure them."
      fr: "Les participants ne peuvent pas créer de journaux de flux pour un sous-réseau partagé, et les équipes applicatives devraient les configurer."
    b:
      en: "Traffic Mirroring copies packets rather than producing flow logs, and it requires configuration in every application account."
      fr: "Traffic Mirroring copie des paquets au lieu de produire des journaux de flux, et il exige une configuration dans chaque compte d'application."
    c:
      en: "Participants can create flow logs for their own interfaces, but this requires work from every application team."
      fr: "Les participants peuvent créer des journaux de flux pour leurs propres interfaces, mais cela exige un travail de chaque équipe applicative."
references:
  - title: Responsibilities and permissions for owners and participants
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-share-limitations.html
