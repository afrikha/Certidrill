id: sapc03-2c-govcloud-itar
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An aerospace company in the United States runs its commercial workloads in accounts that use us-east-1 and us-west-2. It has won a contract that requires it to store and process technical data controlled under the International Traffic in Arms Regulations (ITAR). The contract requires an AWS environment that is administered exclusively by AWS personnel who are U.S. citizens and that meets FedRAMP High requirements. The company wants to keep its commercial workloads where they are.

    Which solution will meet these requirements?
  fr: |
    Une entreprise aérospatiale américaine exécute ses charges de travail commerciales dans des comptes qui utilisent us-east-1 et us-west-2. Elle a remporté un contrat qui l'oblige à stocker et traiter des données techniques soumises à l'International Traffic in Arms Regulations (ITAR). Le contrat exige un environnement AWS administré exclusivement par du personnel AWS de nationalité américaine et qui répond aux exigences FedRAMP High. L'entreprise veut laisser ses charges de travail commerciales là où elles sont.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create dedicated accounts in us-east-1 for the ITAR workloads, restrict them to that Region with an SCP, and encrypt the data with keys in an AWS CloudHSM key store."
        fr: "Créer des comptes dédiés dans us-east-1 pour les charges de travail ITAR, les limiter à cette Région avec une SCP, et chiffrer les données avec des clés d'un magasin de clés AWS CloudHSM."
    - id: b
      text:
        en: "Install AWS Outposts racks in a company facility in the United States, connected to us-east-1, and run the ITAR workloads only on the Outposts."
        fr: "Installer des racks AWS Outposts dans un site de l'entreprise aux États-Unis, connectés à us-east-1, et exécuter les charges de travail ITAR uniquement sur les Outposts."
    - id: c
      text:
        en: "Run the ITAR workloads on Amazon EC2 Dedicated Hosts in us-west-2 in separate accounts, and allow access only to employees who are U.S. persons through IAM Identity Center."
        fr: "Exécuter les charges de travail ITAR sur des hôtes dédiés Amazon EC2 dans us-west-2 dans des comptes séparés, et n'autoriser l'accès qu'aux employés ayant le statut de U.S. person par IAM Identity Center."
    - id: d
      text:
        en: "Create AWS GovCloud (US) accounts, deploy the ITAR workloads in the AWS GovCloud (US) Regions, and keep the commercial workloads in their current accounts."
        fr: "Créer des comptes AWS GovCloud (US), déployer les charges de travail ITAR dans les Régions AWS GovCloud (US), et conserver les charges de travail commerciales dans leurs comptes actuels."
answer: { optionId: d }
explanation:
  correct:
    en: "AWS GovCloud (US) Regions are isolated AWS Regions that are logically and physically administered exclusively by AWS personnel who are U.S. citizens. They help customers meet export control obligations such as ITAR and compliance requirements such as FedRAMP High, while the commercial workloads can stay in the standard Regions."
    fr: "Les Régions AWS GovCloud (US) sont des Régions AWS isolées, administrées logiquement et physiquement exclusivement par du personnel AWS de nationalité américaine. Elles aident les clients à respecter des obligations de contrôle des exportations comme l'ITAR et des exigences de conformité comme FedRAMP High, tandis que les charges de travail commerciales peuvent rester dans les Régions standard."
  options:
    a:
      en: "Commercial Regions are not administered exclusively by AWS personnel who are U.S. citizens; an SCP and customer-controlled keys do not change who administers the infrastructure."
      fr: "Les Régions commerciales ne sont pas administrées exclusivement par du personnel AWS de nationalité américaine ; une SCP et des clés contrôlées par le client ne changent pas qui administre l'infrastructure."
    b:
      en: "Outposts are managed through their commercial parent Region, so the environment is not the isolated, U.S.-citizen-administered environment that the contract requires."
      fr: "Les Outposts sont gérés par leur Région parente commerciale : l'environnement n'est pas l'environnement isolé, administré par des citoyens américains, qu'exige le contrat."
    c:
      en: "Dedicated Hosts isolate hardware for one customer, and Identity Center controls the company's own users; neither changes who administers the AWS infrastructure."
      fr: "Les hôtes dédiés isolent le matériel pour un seul client, et Identity Center contrôle les utilisateurs de l'entreprise ; aucun ne change qui administre l'infrastructure AWS."
references:
  - title: What Is AWS GovCloud (US)?
    url: https://docs.aws.amazon.com/govcloud-us/latest/UserGuide/whatis.html
