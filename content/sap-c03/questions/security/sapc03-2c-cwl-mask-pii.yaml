id: sapc03-2c-cwl-mask-pii
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company runs applications in 25 accounts, and all of them write logs to Amazon CloudWatch Logs. An audit found patient names, social security numbers, and health insurance numbers in log events of many log groups, including log groups that are created automatically by new services. From now on, this data must be masked for every reader by default, including in CloudWatch Logs Insights queries and in data sent through subscription filters. Only an incident response role may view the unmasked values. The security team must be able to measure how often sensitive data appears in the logs, and application code must not be changed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise du secteur de la santé exécute des applications dans 25 comptes, qui écrivent toutes leurs journaux dans Amazon CloudWatch Logs. Un audit a trouvé des noms de patients, des numéros de sécurité sociale et des numéros d'assurance maladie dans les événements de nombreux groupes de journaux, y compris des groupes de journaux créés automatiquement par de nouveaux services. Désormais, ces données doivent être masquées par défaut pour tous les lecteurs, y compris dans les requêtes CloudWatch Logs Insights et dans les données envoyées par les filtres d'abonnement. Seul un rôle de réponse aux incidents peut voir les valeurs non masquées. L'équipe de sécurité doit pouvoir mesurer la fréquence d'apparition des données sensibles dans les journaux, et le code des applications ne doit pas être modifié.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on Amazon Macie automated sensitive data discovery for the log groups in every account, and use Macie findings to restrict access to the log groups that contain personal data."
        fr: "Activer la découverte automatisée des données sensibles d'Amazon Macie pour les groupes de journaux de chaque compte, et utiliser les résultats de Macie pour restreindre l'accès aux groupes de journaux qui contiennent des données personnelles."
    - id: b
      text:
        en: "In each account, create an account-level CloudWatch Logs data protection policy with managed identifiers for PII and PHI, audit findings to S3, and logs:Unmask only for the response role."
        fr: "Dans chaque compte, créer une politique de protection des données CloudWatch Logs au niveau du compte avec des identifiants gérés PII et PHI, des résultats d'audit vers S3, et logs:Unmask réservé au rôle de réponse."
    - id: c
      text:
        en: "Add a subscription filter to every log group that sends events to an AWS Lambda function, which redacts the sensitive values and writes the events to new log groups that readers use."
        fr: "Ajouter à chaque groupe de journaux un filtre d'abonnement qui envoie les événements à une fonction AWS Lambda, laquelle masque les valeurs sensibles et écrit les événements dans de nouveaux groupes de journaux utilisés par les lecteurs."
    - id: d
      text:
        en: "Configure Amazon Bedrock Guardrails with sensitive information filters set to mask, and apply the guardrail to every application so that sensitive values never reach the log groups."
        fr: "Configurer Amazon Bedrock Guardrails avec des filtres d'informations sensibles en mode masquage, et appliquer le guardrail à chaque application afin que les valeurs sensibles n'atteignent jamais les groupes de journaux."
answer: { optionId: b }
explanation:
  correct:
    en: "A CloudWatch Logs data protection policy detects sensitive data with managed data identifiers at ingestion and masks it at every egress point, including Logs Insights and subscription filters. An account-level policy covers existing log groups and log groups created later, only principals with logs:Unmask see the original values, and audit findings plus the LogEventsWithFindings metric show how often sensitive data appears. Events ingested before the policy stay unmasked."
    fr: "Une politique de protection des données CloudWatch Logs détecte les données sensibles avec des identifiants de données gérés lors de l'ingestion et les masque à chaque point de sortie, y compris Logs Insights et les filtres d'abonnement. Une politique au niveau du compte couvre les groupes de journaux existants et ceux créés plus tard, seuls les principaux disposant de logs:Unmask voient les valeurs d'origine, et les résultats d'audit ainsi que la métrique LogEventsWithFindings montrent la fréquence des données sensibles. Les événements ingérés avant la politique restent non masqués."
  options:
    a:
      en: "Macie discovers sensitive data in Amazon S3 objects; it does not analyze CloudWatch Logs log groups and does not mask data."
      fr: "Macie découvre les données sensibles dans les objets Amazon S3 ; il n'analyse pas les groupes de journaux CloudWatch Logs et ne masque pas les données."
    c:
      en: "The original log groups keep the unmasked data for every reader, and the custom function must be built and attached to every new log group."
      fr: "Les groupes de journaux d'origine conservent les données non masquées pour tous les lecteurs, et la fonction personnalisée doit être créée et associée à chaque nouveau groupe de journaux."
    d:
      en: "Guardrails evaluate model inputs and outputs of generative AI applications and require application integration; they do not mask log data written by other code."
      fr: "Les guardrails évaluent les entrées et sorties des modèles d'applications d'IA générative et exigent une intégration dans l'application ; ils ne masquent pas les données de journaux écrites par un autre code."
references:
  - title: Help protect sensitive log data with masking
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/mask-sensitive-log-data.html
