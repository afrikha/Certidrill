id: sapc03-2a-azure-workload-oidc
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs several applications on Microsoft Azure virtual machines that have Azure managed identities. The applications write to Amazon S3 and read from Amazon DynamoDB in an AWS account by using access keys of IAM users that are stored in Azure Key Vault. The security team wants to remove all long-term AWS credentials from Azure. The team does not want to issue, distribute or rotate certificates on the Azure side, and each application must be limited to its own IAM role. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute plusieurs applications sur des machines virtuelles Microsoft Azure dotées d'identités managées Azure. Les applications écrivent dans Amazon S3 et lisent dans Amazon DynamoDB d'un compte AWS à l'aide de clés d'accès d'utilisateurs IAM stockées dans Azure Key Vault. L'équipe de sécurité veut supprimer d'Azure toutes les informations d'identification AWS à long terme. L'équipe ne veut ni émettre, ni distribuer, ni renouveler de certificats côté Azure, et chaque application doit être limitée à son propre rôle IAM. L'entreprise veut la solution avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an IAM OIDC identity provider for the Entra ID issuer and one role per application that checks the token audience and subject, and call AssumeRoleWithWebIdentity with the managed identity token."
        fr: "Créer un fournisseur d'identité OIDC IAM pour l'émetteur Entra ID et un rôle par application qui vérifie l'audience et le sujet du jeton, et appeler AssumeRoleWithWebIdentity avec le jeton de l'identité managée."
    - id: b
      text:
        en: "Create an AWS Private CA trust anchor for IAM Roles Anywhere, issue a certificate to each Azure virtual machine, and run the credential helper on the virtual machines to obtain role credentials."
        fr: "Créer une ancre de confiance AWS Private CA pour IAM Roles Anywhere, émettre un certificat pour chaque machine virtuelle Azure, et exécuter l'assistant d'informations d'identification sur les machines virtuelles pour obtenir les informations d'identification des rôles."
    - id: c
      text:
        en: "Build an authentication service that validates the managed identity tokens, and have it call a Cognito identity pool with developer authenticated identities to return AWS credentials."
        fr: "Développer un service d'authentification qui valide les jetons des identités managées, et lui faire appeler un groupe d'identités Cognito avec des identités authentifiées par le développeur pour renvoyer des informations d'identification AWS."
    - id: d
      text:
        en: "Keep the IAM users, rotate their access keys every 30 days with a scheduled AWS Lambda function, and copy the new keys to Azure Key Vault after each rotation completes."
        fr: "Conserver les utilisateurs IAM, renouveler leurs clés d'accès tous les 30 jours avec une fonction AWS Lambda planifiée, et copier les nouvelles clés dans Azure Key Vault à la fin de chaque renouvellement."
answer: { optionId: a }
explanation:
  correct:
    en: "OIDC federation lets workloads exchange a JSON Web Token from a trusted OIDC identity provider for temporary credentials of an IAM role, so no AWS credentials are stored outside AWS. Azure managed identities already obtain such tokens from Microsoft Entra ID, so no certificate has to be issued, and trust policy conditions on the audience and subject bind each application to its own role."
    fr: "La fédération OIDC permet aux charges de travail d'échanger un jeton web JSON (JWT) d'un fournisseur d'identité OIDC approuvé contre des informations d'identification temporaires d'un rôle IAM : aucune information d'identification AWS n'est stockée hors d'AWS. Les identités managées Azure obtiennent déjà de tels jetons auprès de Microsoft Entra ID, aucun certificat n'est donc à émettre, et des conditions de politique d'approbation sur l'audience et le sujet lient chaque application à son propre rôle."
  options:
    b:
      en: "IAM Roles Anywhere would remove the access keys, but it requires issuing, distributing and renewing certificates on the Azure virtual machines, which the team wants to avoid."
      fr: "IAM Roles Anywhere supprimerait les clés d'accès, mais il exige d'émettre, de distribuer et de renouveler des certificats sur les machines virtuelles Azure, ce que l'équipe veut éviter."
    c:
      en: "A custom authentication service adds code and infrastructure to build and run, which is more overhead than direct OIDC federation with IAM."
      fr: "Un service d'authentification personnalisé ajoute du code et une infrastructure à développer et à exploiter, ce qui représente plus de charge qu'une fédération OIDC directe avec IAM."
    d:
      en: "Rotated access keys are still long-term credentials stored in Azure, which the security team wants to remove."
      fr: "Des clés d'accès renouvelées restent des informations d'identification à long terme stockées dans Azure, que l'équipe de sécurité veut supprimer."
references:
  - title: OIDC federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html
