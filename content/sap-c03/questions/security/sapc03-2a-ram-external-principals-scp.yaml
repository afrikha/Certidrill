id: sapc03-2a-ram-external-principals-scp
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's network and platform teams share VPC subnets, AWS Transit Gateway attachments and Amazon Route 53 Resolver rules with AWS Resource Access Manager (AWS RAM) across 90 accounts in AWS Organizations. Teams create their own resource shares. A review found a resource share that allowed an AWS account outside the organization. The security team wants a central preventive control that stops anyone from creating or updating a resource share that allows principals outside the organization. Sharing inside the organization must remain self-service.

    Which solution will meet these requirements?
  fr: |
    Les équipes réseau et plateforme d'AnyCompany partagent des sous-réseaux VPC, des attachements AWS Transit Gateway et des règles Amazon Route 53 Resolver avec AWS Resource Access Manager (AWS RAM) entre 90 comptes d'AWS Organizations. Les équipes créent leurs propres partages de ressources. Une revue a trouvé un partage de ressources qui autorisait un compte AWS extérieur à l'organisation. L'équipe de sécurité veut un contrôle préventif central qui empêche quiconque de créer ou de modifier un partage de ressources qui autorise des principaux extérieurs à l'organisation. Le partage au sein de l'organisation doit rester en libre-service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an organization-level IAM Access Analyzer external access analyzer, and send its findings about shared resources to the security team for removal."
        fr: "Créer un analyseur d'accès externe IAM Access Analyzer au niveau de l'organisation, et envoyer ses résultats sur les ressources partagées à l'équipe de sécurité pour suppression."
    - id: b
      text:
        en: "Enable sharing with AWS Organizations, and attach an SCP that denies ram:CreateResourceShare and ram:UpdateResourceShare when ram:RequestedAllowsExternalPrincipals is true."
        fr: "Activer le partage avec AWS Organizations, et attacher une SCP qui refuse ram:CreateResourceShare et ram:UpdateResourceShare lorsque ram:RequestedAllowsExternalPrincipals vaut true."
    - id: c
      text:
        en: "Attach an RCP to the organization root that denies AWS RAM actions on resource shares when aws:PrincipalOrgID does not equal the organization ID."
        fr: "Attacher à la racine de l'organisation une RCP qui refuse les actions AWS RAM sur les partages de ressources lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation."
    - id: d
      text:
        en: "Remove AWS RAM permissions from every role except the central network team's role, and have that team create all resource shares when other teams request them."
        fr: "Retirer les autorisations AWS RAM de tous les rôles sauf celui de l'équipe réseau centrale, et faire créer tous les partages de ressources par cette équipe lorsque les autres équipes les demandent."
answer: { optionId: b }
explanation:
  correct:
    en: "The data perimeter guidance controls resource sharing with the ram:RequestedAllowsExternalPrincipals condition key. An SCP that denies creating or updating shares when the request allows external principals blocks sharing outside the organization in every account, while teams keep creating shares inside the organization."
    fr: "Les recommandations sur le périmètre de données contrôlent le partage de ressources avec la clé de condition ram:RequestedAllowsExternalPrincipals. Une SCP qui refuse la création ou la modification de partages lorsque la requête autorise des principaux externes bloque le partage hors de l'organisation dans chaque compte, tandis que les équipes continuent de créer des partages au sein de l'organisation."
  options:
    a:
      en: "Access Analyzer detects resources shared outside the zone of trust after the fact; it does not prevent the share."
      fr: "Access Analyzer détecte après coup les ressources partagées hors de la zone de confiance ; il n'empêche pas le partage."
    c:
      en: "AWS RAM is not among the services that RCPs support, and the risk comes from the organization's own principals, which SCPs control."
      fr: "AWS RAM ne fait pas partie des services pris en charge par les RCP, et le risque provient des principaux de l'organisation elle-même, que contrôlent les SCP."
    d:
      en: "Centralizing every share removes the self-service sharing that the teams must keep."
      fr: "Centraliser tous les partages supprime le libre-service que les équipes doivent conserver."
references:
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
  - title: Sharing your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html
