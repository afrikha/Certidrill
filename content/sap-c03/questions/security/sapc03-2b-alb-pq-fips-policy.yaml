id: sapc03-2b-alb-pq-fips-policy
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany, a government contractor, exposes a records API through an Application Load Balancer. All of its clients are recent applications that support TLS 1.3 and hybrid post-quantum key exchange with ML-KEM. The contract requires FIPS-validated cryptography, connections that use TLS 1.3 only, and protection of the TLS sessions against harvest-now, decrypt-later attacks.

    Which security policy should the company configure on the HTTPS listener?
  fr: |
    AnyCompany, un sous-traitant gouvernemental, expose une API de dossiers via un Application Load Balancer. Tous ses clients sont des applications récentes qui prennent en charge TLS 1.3 et l'échange de clés hybride post-quantique avec ML-KEM. Le contrat exige une cryptographie validée FIPS, des connexions uniquement en TLS 1.3 et la protection des sessions TLS contre les attaques « récolter maintenant, déchiffrer plus tard » (harvest now, decrypt later).

    Quelle politique de sécurité l'entreprise doit-elle configurer sur l'écouteur HTTPS ?
body:
  options:
    - { id: a, text: "ELBSecurityPolicy-TLS13-1-3-FIPS-PQ-2025-09" }
    - { id: b, text: "ELBSecurityPolicy-TLS13-1-3-FIPS-2023-04" }
    - { id: c, text: "ELBSecurityPolicy-TLS13-1-2-Res-PQ-2025-09" }
    - { id: d, text: "ELBSecurityPolicy-TLS13-1-3-PQ-2025-09" }
answer: { optionId: a }
explanation:
  correct:
    en: "Policies with PQ in their name offer hybrid post-quantum key exchange (for example X25519MLKEM768) to clients that support ML-KEM, which protects recorded sessions against future quantum decryption. ELBSecurityPolicy-TLS13-1-3-FIPS-PQ-2025-09 is the only option that combines FIPS cryptography, TLS 1.3 only, and post-quantum key exchange."
    fr: "Les politiques dont le nom contient PQ proposent un échange de clés hybride post-quantique (par exemple X25519MLKEM768) aux clients qui prennent en charge ML-KEM, ce qui protège les sessions enregistrées contre un futur déchiffrement quantique. ELBSecurityPolicy-TLS13-1-3-FIPS-PQ-2025-09 est la seule option qui combine cryptographie FIPS, TLS 1.3 uniquement et échange de clés post-quantique."
  options:
    b:
      en: "This FIPS policy accepts only TLS 1.3 but offers no post-quantum key exchange."
      fr: "Cette politique FIPS n'accepte que TLS 1.3 mais ne propose pas d'échange de clés post-quantique."
    c:
      en: "This policy also accepts TLS 1.2 and is not a FIPS policy."
      fr: "Cette politique accepte aussi TLS 1.2 et n'est pas une politique FIPS."
    d:
      en: "This policy offers post-quantum key exchange with TLS 1.3 only, but it is not a FIPS policy."
      fr: "Cette politique propose l'échange de clés post-quantique avec TLS 1.3 uniquement, mais ce n'est pas une politique FIPS."
references:
  - title: Security policies for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
