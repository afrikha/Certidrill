id: sapc03-2c-inference-region-evidence
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank runs a regulated chatbot that calls the Amazon Bedrock Converse API from eu-west-3 through the EU geographic cross-Region inference profile. An AWS CloudTrail organization trail delivers management events from all Regions to a bucket in the log archive account, and model invocation logging delivers prompts and responses to an S3 bucket in eu-west-3. An auditor asks for evidence of the AWS Region in which each request of the last quarter was actually processed. The bank wants to provide this evidence from existing data without changing the application.

    Which solution will meet these requirements?
  fr: |
    Une banque exploite un chatbot réglementé qui appelle l'API Converse d'Amazon Bedrock depuis eu-west-3 par le profil d'inférence entre Régions géographique EU. Un journal de suivi d'organisation AWS CloudTrail livre les événements de gestion de toutes les Régions dans un compartiment du compte d'archivage des journaux, et la journalisation des appels de modèle livre les invites et les réponses dans un compartiment S3 d'eu-west-3. Un auditeur demande la preuve de la Région AWS dans laquelle chaque requête du dernier trimestre a réellement été traitée. La banque veut fournir cette preuve à partir des données existantes sans modifier l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Search the trail's log files of every EU destination Region of the profile for Converse events, and count the events found in each Region."
        fr: "Rechercher les événements Converse dans les fichiers journaux du journal de suivi de chaque Région de destination EU du profil, et compter les événements trouvés dans chaque Région."
    - id: b
      text:
        en: "Run AWS Config advanced queries on the inference profile resource to list the Regions where requests were processed during the quarter."
        fr: "Exécuter des requêtes avancées AWS Config sur la ressource du profil d'inférence pour lister les Régions où les requêtes ont été traitées pendant le trimestre."
    - id: c
      text:
        en: "Query the trail's eu-west-3 log files for the Converse events of the quarter, and report the additionalEventData.inferenceRegion field of each event."
        fr: "Interroger les fichiers journaux d'eu-west-3 du journal de suivi pour les événements Converse du trimestre, et indiquer le champ additionalEventData.inferenceRegion de chaque événement."
    - id: d
      text:
        en: "Analyze VPC Flow Logs of the bedrock-runtime interface endpoint in eu-west-3 to map the destination IP addresses of each request to AWS Regions."
        fr: "Analyser les journaux de flux VPC du point de terminaison d'interface bedrock-runtime dans eu-west-3 pour associer les adresses IP de destination de chaque requête à des Régions AWS."
answer: { optionId: c }
explanation:
  correct:
    en: "CloudTrail logs every cross-Region inference request in the source Region, here eu-west-3. The Region where the request was processed is recorded in the additionalEventData.inferenceRegion field of the event, so querying the source Region's events gives per-request evidence."
    fr: "CloudTrail journalise chaque requête d'inférence entre Régions dans la Région source, ici eu-west-3. La Région où la requête a été traitée est enregistrée dans le champ additionalEventData.inferenceRegion de l'événement : interroger les événements de la Région source fournit donc une preuve requête par requête."
  options:
    a:
      en: "Cross-Region inference requests are logged in the source Region, not in the destination Regions, so this search would not find them."
      fr: "Les requêtes d'inférence entre Régions sont journalisées dans la Région source, pas dans les Régions de destination : cette recherche ne les trouverait pas."
    b:
      en: "AWS Config records resource configurations, not individual inference requests or the Region in which each one was processed."
      fr: "AWS Config enregistre les configurations des ressources, pas les requêtes d'inférence individuelles ni la Région où chacune a été traitée."
    d:
      en: "The endpoint traffic goes to the Bedrock service in eu-west-3; routing to another Region happens inside AWS and is not visible in the bank's flow logs."
      fr: "Le trafic du point de terminaison va vers le service Bedrock d'eu-west-3 ; l'acheminement vers une autre Région se fait au sein d'AWS et n'est pas visible dans les journaux de flux de la banque."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
