id: sapc03-2a-roles-anywhere-crl-checking
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses IAM Roles Anywhere with a trust anchor for its enterprise certificate authority (CA). When a server is decommissioned or compromised, the PKI team revokes its certificate in the CA. A security test showed that a revoked certificate could still be used to obtain AWS credentials. The CA publishes its certificate revocation list (CRL) every 6 hours at an HTTP CRL distribution point that is reachable from the internet and is included in every certificate. Revocations must be honored automatically, without manual CRL uploads, and the other servers must not be affected.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise IAM Roles Anywhere avec une ancre de confiance pour son autorité de certification (CA) d'entreprise. Lorsqu'un serveur est mis hors service ou compromis, l'équipe PKI révoque son certificat dans la CA. Un test de sécurité a montré qu'un certificat révoqué pouvait encore servir à obtenir des informations d'identification AWS. La CA publie sa liste de révocation de certificats (CRL) toutes les 6 heures à un point de distribution CRL HTTP accessible depuis Internet et indiqué dans chaque certificat. Les révocations doivent être prises en compte automatiquement, sans chargement manuel de CRL, et les autres serveurs ne doivent pas être affectés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure the trust anchor with the URL of the CA's Online Certificate Status Protocol (OCSP) responder so that IAM Roles Anywhere checks each certificate when it creates a session."
        fr: "Configurer l'ancre de confiance avec l'URL du répondeur OCSP (Online Certificate Status Protocol) de la CA afin qu'IAM Roles Anywhere vérifie chaque certificat lors de la création d'une session."
    - id: b
      text:
        en: "Download the current CRL from the CA, and import it once into IAM Roles Anywhere with the ImportCrl API so that the revoked certificates are rejected."
        fr: "Télécharger la CRL actuelle de la CA, et l'importer une fois dans IAM Roles Anywhere avec l'API ImportCrl afin que les certificats révoqués soient rejetés."
    - id: c
      text:
        en: "Enable CRL distribution point checking on the trust anchor so that IAM Roles Anywhere checks the CRL that is published at the distribution point of each certificate."
        fr: "Activer la vérification des points de distribution CRL sur l'ancre de confiance afin qu'IAM Roles Anywhere vérifie la CRL publiée au point de distribution de chaque certificat."
    - id: d
      text:
        en: "Disable the trust anchor each time a certificate is revoked, and enable it again after the PKI team confirms that the server is decommissioned."
        fr: "Désactiver l'ancre de confiance chaque fois qu'un certificat est révoqué, et la réactiver après que l'équipe PKI a confirmé la mise hors service du serveur."
answer: { optionId: c }
explanation:
  correct:
    en: "IAM Roles Anywhere can check revocation automatically through the CRL distribution points of the certificates when crlDpRevocationEnabled is set on the trust anchor; it is off by default. This honors new revocations as the CA publishes them, without manual imports, and affects only revoked certificates."
    fr: "IAM Roles Anywhere peut vérifier automatiquement la révocation via les points de distribution CRL des certificats lorsque crlDpRevocationEnabled est activé sur l'ancre de confiance ; ce paramètre est désactivé par défaut. Les nouvelles révocations sont prises en compte au fil des publications de la CA, sans import manuel, et seuls les certificats révoqués sont affectés."
  options:
    a:
      en: "IAM Roles Anywhere does not support OCSP for checking revocation status."
      fr: "IAM Roles Anywhere ne prend pas en charge OCSP pour vérifier l'état de révocation."
    b:
      en: "An imported CRL is not refreshed and its expiration date is not checked, so later revocations are ignored unless the CRL is imported again."
      fr: "Une CRL importée n'est pas actualisée et sa date d'expiration n'est pas vérifiée : les révocations ultérieures sont ignorées tant que la CRL n'est pas réimportée."
    d:
      en: "Disabling the trust anchor stops every server that uses the CA from obtaining credentials."
      fr: "Désactiver l'ancre de confiance empêche tous les serveurs qui utilisent la CA d'obtenir des informations d'identification."
references:
  - title: The IAM Roles Anywhere trust model
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
