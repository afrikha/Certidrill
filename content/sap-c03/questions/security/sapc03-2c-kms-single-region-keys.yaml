id: sapc03-2c-kms-single-region-keys
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A German bank runs all its workloads in eu-central-1. An SCP attached to the workload OU denies all actions, except those of global services, when aws:RequestedRegion is not eu-central-1. During an audit, the bank discovered that an engineer had created a multi-Region AWS KMS primary key in eu-central-1 and called ReplicateKey in eu-central-1 to create a replica key in us-east-1, and the SCP did not block the call. The bank's policy states that encryption key material must never exist outside eu-central-1. The bank needs a preventive control for the whole OU that does not affect single-Region keys.

    Which solution will meet these requirements?
  fr: |
    Une banque allemande exécute toutes ses charges de travail dans eu-central-1. Une SCP attachée à l'OU des charges de travail refuse toutes les actions, sauf celles des services globaux, lorsque aws:RequestedRegion n'est pas eu-central-1. Lors d'un audit, la banque a découvert qu'un ingénieur avait créé une clé primaire AWS KMS multi-Régions dans eu-central-1 et appelé ReplicateKey dans eu-central-1 pour créer une clé réplique dans us-east-1, et que la SCP n'avait pas bloqué l'appel. La politique de la banque stipule que le matériel des clés de chiffrement ne doit jamais exister hors d'eu-central-1. La banque a besoin d'un contrôle préventif pour toute l'OU qui n'affecte pas les clés à Région unique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add SCP statements to the OU that deny kms:CreateKey when the kms:MultiRegion condition key is true and deny kms:ReplicateKey."
        fr: "Ajouter à l'OU des instructions de SCP qui refusent kms:CreateKey lorsque la clé de condition kms:MultiRegion est vraie et qui refusent kms:ReplicateKey."
    - id: b
      text:
        en: "Enable automatic key rotation on all customer managed keys so that replicas in other Regions receive new key material that the bank controls."
        fr: "Activer la rotation automatique de toutes les clés gérées par le client afin que les répliques des autres Régions reçoivent un nouveau matériel de clé contrôlé par la banque."
    - id: c
      text:
        en: "Add a statement to the existing SCP that explicitly denies kms:ReplicateKey and kms:CreateKey when aws:RequestedRegion is not eu-central-1."
        fr: "Ajouter à la SCP existante une instruction qui refuse explicitement kms:ReplicateKey et kms:CreateKey lorsque aws:RequestedRegion n'est pas eu-central-1."
    - id: d
      text:
        en: "Deploy an AWS Config custom rule that detects multi-Region keys and schedules their deletion with an automatic remediation runbook."
        fr: "Déployer une règle AWS Config personnalisée qui détecte les clés multi-Régions et planifie leur suppression avec un runbook de correction automatique."
answer: { optionId: a }
explanation:
  correct:
    en: "ReplicateKey is called in the Region of the primary key, so a Region deny SCP based on aws:RequestedRegion does not stop a replica from being created in another Region. The kms:MultiRegion condition key controls CreateKey based on whether the key is multi-Region, and denying ReplicateKey removes the replication path, while single-Region keys remain unaffected."
    fr: "ReplicateKey est appelé dans la Région de la clé primaire : une SCP de refus de Région fondée sur aws:RequestedRegion n'empêche donc pas la création d'une réplique dans une autre Région. La clé de condition kms:MultiRegion contrôle CreateKey selon que la clé est multi-Régions ou non, et refuser ReplicateKey supprime le chemin de réplication, sans affecter les clés à Région unique."
  options:
    b:
      en: "Rotation changes key material over time but does not remove replicas, and multi-Region keys share their key material with their replicas."
      fr: "La rotation change le matériel de clé au fil du temps mais ne supprime pas les répliques, et les clés multi-Régions partagent leur matériel de clé avec leurs répliques."
    c:
      en: "The ReplicateKey request is already made in eu-central-1, so a statement based on aws:RequestedRegion still allows it."
      fr: "La requête ReplicateKey est déjà faite dans eu-central-1 : une instruction fondée sur aws:RequestedRegion l'autorise donc toujours."
    d:
      en: "A detective rule acts after the replica exists outside eu-central-1, and scheduling key deletion can make encrypted data unrecoverable."
      fr: "Une règle de détection agit après l'existence de la réplique hors d'eu-central-1, et planifier la suppression d'une clé peut rendre des données chiffrées irrécupérables."
references:
  - title: AWS KMS condition keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html
