id: sapc03-2a-kms-tenant-keys-abac
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs a multi-tenant SaaS platform with 600 tenants and adds about 20 tenants each month. Tenant documents are stored in Amazon S3 with SSE-KMS, under one prefix per tenant. The application runs on Amazon ECS and, for each request, uses a role session that carries a tenant session tag. Customer contracts require a tenant-specific encryption key and the ability to make one tenant's data unreadable immediately when the tenant leaves, without affecting the other tenants. The security team does not want to change IAM policies or key policies when tenants are added.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite une plateforme SaaS mutualisée de 600 locataires et en ajoute environ 20 chaque mois. Les documents des locataires sont stockés dans Amazon S3 avec SSE-KMS, sous un préfixe par locataire. L'application s'exécute sur Amazon ECS et utilise, pour chaque requête, une session de rôle qui porte une balise de session tenant. Les contrats clients exigent une clé de chiffrement propre à chaque locataire et la possibilité de rendre illisibles immédiatement les données d'un locataire lorsqu'il part, sans affecter les autres locataires. L'équipe de sécurité ne veut modifier ni les politiques IAM ni les politiques de clé lors de l'ajout de locataires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use one customer managed key for all tenants with the tenant ID in the encryption context, and add key policy conditions on kms:EncryptionContext that match the tenant session tag."
        fr: "Utiliser une seule clé gérée par le client pour tous les locataires avec l'ID du locataire dans le contexte de chiffrement, et ajouter des conditions de politique de clé sur kms:EncryptionContext qui correspondent à la balise de session tenant."
    - id: b
      text:
        en: "Create one customer managed key per tenant with a tenant tag, allow KMS use in one IAM policy when aws:ResourceTag/tenant equals ${aws:PrincipalTag/tenant}, and disable a tenant's key when it leaves."
        fr: "Créer une clé gérée par le client par locataire avec une balise tenant, autoriser l'utilisation de KMS dans une seule politique IAM lorsque aws:ResourceTag/tenant est égal à ${aws:PrincipalTag/tenant}, et désactiver la clé d'un locataire à son départ."
    - id: c
      text:
        en: "Create one customer managed key per tenant and one IAM role per tenant, and list the tenant's role in the key policy of that tenant's key."
        fr: "Créer une clé gérée par le client et un rôle IAM par locataire, et lister le rôle du locataire dans la politique de clé de la clé de ce locataire."
    - id: d
      text:
        en: "Use SSE-S3 for the bucket, and add a bucket policy that allows each role session to access only the prefix that matches its tenant session tag."
        fr: "Utiliser SSE-S3 pour le compartiment, et ajouter une politique de compartiment qui n'autorise chaque session de rôle qu'à accéder au préfixe correspondant à sa balise de session tenant."
answer: { optionId: b }
explanation:
  correct:
    en: "AWS KMS supports ABAC: an IAM policy can allow use of any key whose aws:ResourceTag/tenant matches the caller's tenant tag, so new tenants need only a tagged key, provided the key policies allow IAM policies to grant access. Because each tenant has its own key, disabling or scheduling deletion of that key makes only that tenant's data unreadable."
    fr: "AWS KMS prend en charge l'ABAC : une politique IAM peut autoriser l'utilisation de toute clé dont aws:ResourceTag/tenant correspond à la balise tenant de l'appelant ; les nouveaux locataires n'ont besoin que d'une clé balisée, à condition que les politiques de clé permettent aux politiques IAM d'accorder l'accès. Comme chaque locataire a sa propre clé, désactiver cette clé ou planifier sa suppression rend illisibles les seules données de ce locataire."
  options:
    a:
      en: "A shared key is not tenant-specific, and disabling it would make every tenant's data unreadable instead of one tenant's."
      fr: "Une clé partagée n'est pas propre à un locataire, et la désactiver rendrait illisibles les données de tous les locataires au lieu d'un seul."
    c:
      en: "A role and a key policy entry per tenant require IAM and key policy work for every new tenant."
      fr: "Un rôle et une entrée de politique de clé par locataire exigent du travail sur IAM et sur les politiques de clé pour chaque nouveau locataire."
    d:
      en: "SSE-S3 uses keys that Amazon S3 manages, so there is no tenant-specific key that the company could disable."
      fr: "SSE-S3 utilise des clés gérées par Amazon S3 : il n'existe pas de clé propre au locataire que l'entreprise pourrait désactiver."
references:
  - title: ABAC for AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/abac.html
