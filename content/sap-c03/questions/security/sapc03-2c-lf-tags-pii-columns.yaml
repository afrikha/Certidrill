id: sapc03-2c-lf-tags-pii-columns
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An insurance company runs a data lake in a central data account. The AWS Glue Data Catalog contains 400 tables in 12 databases, one database per business domain, and analysts query the tables with Amazon Athena through IAM roles, one role per domain team. Personal data columns, such as email address and phone number, appear in about 150 tables, and the data engineers add new tables every week. Each domain team must query only the non-personal columns of the tables in its own domain, and only a privacy team role may query personal data columns in all domains. The governance team wants permissions that do not require new grants for every new table.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance exploite un lac de données dans un compte de données central. AWS Glue Data Catalog contient 400 tables réparties dans 12 bases de données, une par domaine métier, et les analystes interrogent les tables avec Amazon Athena au moyen de rôles IAM, un rôle par équipe de domaine. Des colonnes de données personnelles, comme l'adresse e-mail et le numéro de téléphone, figurent dans environ 150 tables, et les ingénieurs de données ajoutent de nouvelles tables chaque semaine. Chaque équipe de domaine ne doit interroger que les colonnes non personnelles des tables de son propre domaine, et seul un rôle de l'équipe de confidentialité peut interroger les colonnes de données personnelles de tous les domaines. L'équipe de gouvernance veut des autorisations qui ne nécessitent pas de nouvel octroi pour chaque nouvelle table.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Grant each domain role column-level SELECT permissions on every table of its domain by using the Lake Formation named resource method, excluding the personal data columns."
        fr: "Accorder à chaque rôle de domaine des autorisations SELECT au niveau des colonnes sur chaque table de son domaine avec la méthode des ressources nommées de Lake Formation, en excluant les colonnes de données personnelles."
    - id: b
      text:
        en: "Tag databases with a domain LF-Tag and tables with classification, override personal columns to classification=personal, and grant SELECT on LF-Tag expressions."
        fr: "Attribuer un LF-Tag domain aux bases de données et classification aux tables, redéfinir les colonnes personnelles en classification=personal, et accorder SELECT sur des expressions de LF-Tags."
    - id: c
      text:
        en: "Store personal data columns in separate S3 prefixes, and attach IAM policies to each domain role that deny s3:GetObject on those prefixes while allowing the rest of the domain data."
        fr: "Stocker les colonnes de données personnelles dans des préfixes S3 distincts, et attacher à chaque rôle de domaine des politiques IAM qui refusent s3:GetObject sur ces préfixes tout en autorisant le reste des données du domaine."
    - id: d
      text:
        en: "Create an Athena view without the personal data columns for every table, and grant each domain role access only to the views of its own domain through IAM policies."
        fr: "Créer pour chaque table une vue Athena sans les colonnes de données personnelles, et n'accorder à chaque rôle de domaine que l'accès aux vues de son propre domaine au moyen de politiques IAM."
answer: { optionId: b }
explanation:
  correct:
    en: "With Lake Formation tag-based access control, LF-Tags are assigned to databases, tables and columns, tables inherit from databases and columns from tables, and an inherited value can be overridden on a column. Grants on LF-Tag expressions, such as a domain value together with classification=non-personal, apply to every matching resource, so new tables are covered as soon as they carry the right tags, without new grants."
    fr: "Avec le contrôle d'accès basé sur les balises de Lake Formation, les LF-Tags sont attribués aux bases de données, tables et colonnes, les tables héritent des bases de données et les colonnes des tables, et une valeur héritée peut être redéfinie sur une colonne. Les octrois sur des expressions de LF-Tags, comme une valeur de domaine associée à classification=non-personal, s'appliquent à toute ressource correspondante : les nouvelles tables sont couvertes dès qu'elles portent les bonnes balises, sans nouvel octroi."
  options:
    a:
      en: "The named resource method needs a grant for each principal and each table, so every new table requires new column-level grants."
      fr: "La méthode des ressources nommées nécessite un octroi par principal et par table : chaque nouvelle table exige de nouveaux octrois au niveau des colonnes."
    c:
      en: "Columns of a table are stored together in the same data files, so S3 prefix permissions cannot separate columns, and the layout change is impractical."
      fr: "Les colonnes d'une table sont stockées ensemble dans les mêmes fichiers de données : des autorisations sur des préfixes S3 ne peuvent pas séparer des colonnes, et ce changement d'organisation est irréaliste."
    d:
      en: "A view must be created and secured for every new table, which is the per-table maintenance the governance team wants to avoid."
      fr: "Une vue doit être créée et sécurisée pour chaque nouvelle table, ce qui constitue la maintenance par table que l'équipe de gouvernance veut éviter."
references:
  - title: Lake Formation tag-based access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
