id: sapc03-2b-cloudhsm-cross-region-dr
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs an AWS CloudHSM cluster with three HSMs in eu-west-1 for a code-signing service that uses asymmetric keys. The disaster recovery plan requires the ability to rebuild the signing service in eu-central-1 within one day if eu-west-1 becomes unavailable, with the same keys. Keys change only a few times each month. To control cost, the company does not want to pay for running HSMs in eu-central-1 until a disaster occurs.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite dans eu-west-1 un cluster AWS CloudHSM de trois HSM pour un service de signature de code qui utilise des clés asymétriques. Le plan de reprise après sinistre exige de pouvoir reconstruire le service de signature dans eu-central-1 en moins d'une journée si eu-west-1 devient indisponible, avec les mêmes clés. Les clés ne changent que quelques fois par mois. Pour maîtriser les coûts, l'entreprise ne veut pas payer de HSM en fonctionnement dans eu-central-1 avant qu'un sinistre ne survienne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "After each key change, copy the latest cluster backup to eu-central-1 with CopyBackupToRegion, and during a disaster create a cluster from that backup and add HSMs to it.", fr: "Après chaque modification de clé, copier la dernière sauvegarde du cluster dans eu-central-1 avec CopyBackupToRegion, et en cas de sinistre créer un cluster à partir de cette sauvegarde puis y ajouter des HSM." } }
    - { id: b, text: { en: "Create a second cluster with one HSM in eu-central-1, and link it to the eu-west-1 cluster so that CloudHSM replicates the keys between the two Regions.", fr: "Créer dans eu-central-1 un second cluster d'un HSM, et le lier au cluster d'eu-west-1 afin que CloudHSM réplique les clés entre les deux Régions." } }
    - { id: c, text: { en: "Create the signing keys as multi-Region KMS keys in an AWS CloudHSM key store, and replicate them to an AWS CloudHSM key store in eu-central-1.", fr: "Créer les clés de signature en tant que clés KMS multi-Régions dans un magasin de clés AWS CloudHSM, et les répliquer vers un magasin de clés AWS CloudHSM dans eu-central-1." } }
    - { id: d, text: { en: "Turn on S3 Cross-Region Replication for the bucket that holds the cluster backups so that the backups are also stored in eu-central-1.", fr: "Activer la réplication entre Régions S3 sur le compartiment qui contient les sauvegardes du cluster, afin que les sauvegardes soient aussi stockées dans eu-central-1." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudHSM can copy a cluster backup to another Region in the same partition, where it becomes READY and can be used with CreateCluster. A cluster built from the copied backup contains the same keys, and no HSM runs in eu-central-1 until the disaster recovery plan is invoked."
    fr: "CloudHSM peut copier une sauvegarde de cluster dans une autre Région de la même partition, où elle passe à l'état READY et peut servir à CreateCluster. Un cluster créé à partir de la sauvegarde copiée contient les mêmes clés, et aucun HSM ne fonctionne dans eu-central-1 tant que le plan de reprise n'est pas déclenché."
  options:
    b:
      en: "A cluster created in another Region is not linked to the original cluster and must be managed independently; CloudHSM does not replicate keys between Regions, and the running HSM adds cost."
      fr: "Un cluster créé dans une autre Région n'est pas lié au cluster d'origine et se gère indépendamment ; CloudHSM ne réplique pas les clés entre Régions, et le HSM en fonctionnement ajoute un coût."
    c:
      en: "AWS CloudHSM key stores support only symmetric encryption KMS keys and do not support multi-Region keys, so they cannot hold the asymmetric signing keys."
      fr: "Les magasins de clés AWS CloudHSM ne prennent en charge que des clés KMS de chiffrement symétriques et pas les clés multi-Régions : ils ne peuvent pas contenir les clés de signature asymétriques."
    d:
      en: "Cluster backups are managed by CloudHSM, not stored in a bucket that you own; they are copied to another Region with the CloudHSM copy operation."
      fr: "Les sauvegardes de cluster sont gérées par CloudHSM et ne sont pas stockées dans un compartiment qui vous appartient ; on les copie dans une autre Région avec l'opération de copie de CloudHSM."
references:
  - title: Copying AWS CloudHSM cluster backups across AWS Regions
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/copy-backup-to-region.html
  - title: AWS CloudHSM key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
