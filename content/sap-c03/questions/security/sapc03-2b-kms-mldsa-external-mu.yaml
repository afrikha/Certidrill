id: sapc03-2b-kms-mldsa-external-mu
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany manufactures industrial controllers that stay in the field for 20 years and verify a digital signature before they install each firmware image. Firmware images are between 30 MB and 200 MB. The company wants signatures that remain secure against future quantum computers. The signing key must be generated and held in FIPS 140-3 Level 3 validated HSMs and must never be exported. The build pipeline runs in AWS CodeBuild and must not send whole firmware images to the signing service.

    Which solution will meet these requirements?
  fr: |
    AnyCompany fabrique des contrôleurs industriels qui restent en service 20 ans et vérifient une signature numérique avant d'installer chaque image de micrologiciel. Les images font entre 30 Mo et 200 Mo. L'entreprise veut des signatures qui restent sûres face aux futurs ordinateurs quantiques. La clé de signature doit être générée et conservée dans des HSM validés FIPS 140-3 niveau 3 et ne doit jamais être exportée. Le pipeline de build s'exécute dans AWS CodeBuild et ne doit pas envoyer les images complètes au service de signature.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an ECC_NIST_P521 KMS key for signing, compute a SHA-512 digest of each image in CodeBuild, and sign the digest with the KMS Sign API.", fr: "Créer une clé KMS ECC_NIST_P521 de signature, calculer un condensé SHA-512 de chaque image dans CodeBuild, et signer le condensé avec l'API KMS Sign." } }
    - { id: b, text: { en: "Create an ML_DSA_65 KMS key, and send each firmware image to the KMS Sign API with the RAW message type and the ML_DSA_SHAKE_256 algorithm.", fr: "Créer une clé KMS ML_DSA_65, et envoyer chaque image à l'API KMS Sign avec le type de message RAW et l'algorithme ML_DSA_SHAKE_256." } }
    - { id: c, text: { en: "Create an ML_DSA_65 KMS key, compute the 64-byte μ message representative in CodeBuild, and call the KMS Sign API with the EXTERNAL_MU message type.", fr: "Créer une clé KMS ML_DSA_65, calculer dans CodeBuild le représentant de message μ de 64 octets, et appeler l'API KMS Sign avec le type de message EXTERNAL_MU." } }
    - { id: d, text: { en: "Create an HMAC_512 KMS key, compute a MAC of each image with the GenerateMac API, and embed the HMAC key in the controllers for verification.", fr: "Créer une clé KMS HMAC_512, calculer un MAC de chaque image avec l'API GenerateMac, et intégrer la clé HMAC dans les contrôleurs pour la vérification." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS KMS supports ML-DSA keys (FIPS 204) in FIPS 140-3 Level 3 validated HSMs. The RAW message type accepts messages up to 4 KB; for larger messages you compute the 64-byte μ representative yourself and sign it with the EXTERNAL_MU message type, which produces the same signature as RAW without sending the image."
    fr: "AWS KMS prend en charge les clés ML-DSA (FIPS 204) dans des HSM validés FIPS 140-3 niveau 3. Le type de message RAW accepte des messages jusqu'à 4 Ko ; pour des messages plus grands, on calcule soi-même le représentant μ de 64 octets et on le signe avec le type de message EXTERNAL_MU, ce qui produit la même signature que RAW sans envoyer l'image."
  options:
    a:
      en: "ECDSA signatures rely on classical elliptic-curve cryptography, which a large quantum computer could break, so they do not meet the quantum-resistance requirement."
      fr: "Les signatures ECDSA reposent sur la cryptographie classique à courbes elliptiques, qu'un grand ordinateur quantique pourrait casser : elles ne répondent pas à l'exigence de résistance quantique."
    b:
      en: "The RAW message type is limited to 4 KB, and sending whole images to the signing service is forbidden."
      fr: "Le type de message RAW est limité à 4 Ko, et l'envoi des images complètes au service de signature est interdit."
    d:
      en: "An HMAC is a symmetric code, not a digital signature: every controller would need the secret key, and HMAC KMS keys cannot be exported anyway."
      fr: "Un HMAC est un code symétrique, pas une signature numérique : chaque contrôleur aurait besoin de la clé secrète, et les clés KMS HMAC ne peuvent de toute façon pas être exportées."
references:
  - title: Post-quantum keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/mldsa.html
