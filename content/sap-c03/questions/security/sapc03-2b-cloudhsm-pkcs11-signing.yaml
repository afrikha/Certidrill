id: sapc03-2b-cloudhsm-pkcs11-signing
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is moving a document-signing application from its data center to Amazon EC2. The application uses the PKCS #11 interface of an on-premises HSM to create and use RSA signing keys. Regulators require that the keys reside in single-tenant, FIPS-validated HSMs over which the company has exclusive control, including the management of HSM users. The company wants to change the application as little as possible. The signing service must stay available if one Availability Zone fails.

    Which solution will meet these requirements?
  fr: |
    AnyCompany migre une application de signature de documents de son centre de données vers Amazon EC2. L'application utilise l'interface PKCS #11 d'un HSM sur site pour créer et utiliser des clés de signature RSA. Les régulateurs exigent que les clés résident dans des HSM à locataire unique, validés FIPS, sur lesquels l'entreprise a un contrôle exclusif, y compris la gestion des utilisateurs des HSM. L'entreprise veut modifier l'application le moins possible. Le service de signature doit rester disponible en cas de défaillance d'une zone de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create asymmetric RSA KMS keys in AWS KMS, and change the application to call the KMS Sign API instead of the PKCS #11 interface.", fr: "Créer des clés KMS RSA asymétriques dans AWS KMS, et modifier l'application pour qu'elle appelle l'API KMS Sign au lieu de l'interface PKCS #11." } }
    - { id: b, text: { en: "Create an AWS CloudHSM cluster with HSMs in two Availability Zones, create crypto users, and configure the application with the CloudHSM PKCS #11 library.", fr: "Créer un cluster AWS CloudHSM avec des HSM dans deux zones de disponibilité, créer des utilisateurs crypto, et configurer l'application avec la bibliothèque PKCS #11 de CloudHSM." } }
    - { id: c, text: { en: "Create an external key store in AWS KMS backed by the on-premises HSM, and point the application's PKCS #11 calls at the external key store proxy.", fr: "Créer dans AWS KMS un magasin de clés externe adossé au HSM sur site, et diriger les appels PKCS #11 de l'application vers le proxy du magasin de clés externe." } }
    - { id: d, text: { en: "Create the signing keys in AWS Payment Cryptography, and call its APIs from the application through an interface VPC endpoint.", fr: "Créer les clés de signature dans AWS Payment Cryptography, et appeler ses API depuis l'application via un point de terminaison d'interface VPC." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS CloudHSM provides single-tenant, FIPS-validated HSMs whose users you manage yourself, outside IAM. Applications that use PKCS #11 can move to CloudHSM with few changes, and a cluster with HSMs in several Availability Zones stays available when one Availability Zone fails."
    fr: "AWS CloudHSM fournit des HSM à locataire unique, validés FIPS, dont vous gérez vous-même les utilisateurs, en dehors d'IAM. Les applications qui utilisent PKCS #11 peuvent passer à CloudHSM avec peu de modifications, et un cluster dont les HSM sont répartis sur plusieurs zones de disponibilité reste disponible en cas de défaillance d'une zone."
  options:
    a:
      en: "AWS KMS uses HSMs that AWS manages for many customers, without customer control of HSM users, and the application would have to be rewritten for the KMS API."
      fr: "AWS KMS utilise des HSM gérés par AWS pour de nombreux clients, sans contrôle des utilisateurs des HSM par le client, et l'application devrait être réécrite pour l'API KMS."
    c:
      en: "External key stores support only symmetric encryption KMS keys, and the proxy serves AWS KMS, not PKCS #11 applications."
      fr: "Les magasins de clés externes ne prennent en charge que des clés KMS de chiffrement symétriques, et le proxy sert AWS KMS, pas des applications PKCS #11."
    d:
      en: "AWS Payment Cryptography provides payment-processing cryptography under PCI standards; it is not a general-purpose HSM with a PKCS #11 interface."
      fr: "AWS Payment Cryptography fournit la cryptographie des traitements de paiement selon les normes PCI ; ce n'est pas un HSM généraliste doté d'une interface PKCS #11."
references:
  - title: What is AWS CloudHSM?
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html
