id: sapc03-2c-trail-tamper-evidence
objective: "2.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A bank's AWS CloudTrail organization trail delivers log files to an Amazon S3 bucket in a log archive account. The bank does not use CloudTrail Lake today. During an inspection, the regulator asked for two capabilities. First, the bank must be able to prove that a given log file was not modified or deleted after CloudTrail delivered it. Second, no one, including the root user of the log archive account, may be able to delete or overwrite delivered log files for 7 years.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le journal de suivi d'organisation AWS CloudTrail d'une banque livre ses fichiers journaux dans un compartiment Amazon S3 d'un compte d'archivage des journaux. La banque n'utilise pas CloudTrail Lake aujourd'hui. Lors d'une inspection, le régulateur a demandé deux capacités. D'une part, la banque doit pouvoir prouver qu'un fichier journal donné n'a été ni modifié ni supprimé après sa livraison par CloudTrail. D'autre part, personne, y compris l'utilisateur racine du compte d'archivage, ne doit pouvoir supprimer ou écraser les fichiers journaux livrés pendant 7 ans.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Turn on log file integrity validation for the organization trail, and validate files with the aws cloudtrail validate-logs command."
        fr: "Activer la validation de l'intégrité des fichiers journaux pour le journal de suivi d'organisation, et valider les fichiers avec la commande aws cloudtrail validate-logs."
    - id: b
      text:
        en: "Encrypt the log files with SSE-KMS by using a customer managed key whose key policy allows only the security team to decrypt them."
        fr: "Chiffrer les fichiers journaux en SSE-KMS avec une clé gérée par le client dont la politique de clé n'autorise que l'équipe de sécurité à les déchiffrer."
    - id: c
      text:
        en: "Turn on CloudTrail Insights for the organization trail so that unusual deletion activity on the log files in the log archive bucket is detected."
        fr: "Activer CloudTrail Insights pour le journal de suivi d'organisation afin de détecter les activités de suppression inhabituelles sur les fichiers journaux du compartiment d'archivage."
    - id: d
      text:
        en: "Configure S3 Object Lock in compliance mode with a default retention period of 7 years on the log archive bucket, which has S3 Versioning enabled."
        fr: "Configurer S3 Object Lock en mode conformité avec une période de rétention par défaut de 7 ans sur le compartiment d'archivage, dont la gestion des versions S3 est activée."
    - id: e
      text:
        en: "Create a CloudTrail Lake organization event data store with the seven-year retention pricing option, and copy the trail events into it."
        fr: "Créer un magasin de données d'événements d'organisation CloudTrail Lake avec l'option de tarification à rétention de sept ans, et y copier les événements du journal de suivi."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Log file integrity validation makes CloudTrail deliver signed hourly digest files that contain a hash of each log file, so validation shows whether a file was modified, deleted, or unchanged; it detects tampering but does not prevent it. S3 Object Lock in compliance mode prevents any user, including the root user, from deleting or overwriting a protected object version until its retention period ends, and it requires S3 Versioning."
    fr: "La validation de l'intégrité des fichiers journaux fait livrer par CloudTrail des fichiers de synthèse horaires signés qui contiennent le hachage de chaque fichier journal : la validation indique si un fichier a été modifié, supprimé ou laissé intact ; elle détecte la falsification sans l'empêcher. S3 Object Lock en mode conformité empêche tout utilisateur, y compris l'utilisateur racine, de supprimer ou d'écraser une version d'objet protégée avant la fin de sa période de rétention, et il exige la gestion des versions S3."
  options:
    b:
      en: "Encryption controls who can read the files; it neither proves that a file is unchanged nor prevents the bucket owner from deleting it."
      fr: "Le chiffrement contrôle qui peut lire les fichiers ; il ne prouve pas qu'un fichier est intact et n'empêche pas le propriétaire du compartiment de le supprimer."
    c:
      en: "Insights detects unusual API call rates and error rates for management events; it does not protect or validate delivered log files."
      fr: "Insights détecte des volumes et des taux d'erreur inhabituels d'appels d'API pour les événements de gestion ; il ne protège ni ne valide les fichiers journaux livrés."
    e:
      en: "CloudTrail Lake has not been open to new customers since May 31, 2026, and the requirement concerns the delivered log files in S3."
      fr: "CloudTrail Lake n'est plus ouvert aux nouveaux clients depuis le 31 mai 2026, et l'exigence porte sur les fichiers journaux livrés dans S3."
references:
  - title: Validating CloudTrail log file integrity
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
