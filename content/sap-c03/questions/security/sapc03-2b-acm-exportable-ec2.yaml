id: sapc03-2b-acm-exportable-ec2
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a TLS-terminating proxy fleet on Amazon EC2 instances behind a Network Load Balancer that uses TCP listeners, so the instances must hold the certificate and its private key. The instances do not use AWS Nitro Enclaves. The service uses a public domain name and must present a publicly trusted certificate. The company wants ACM to issue and renew the certificate, and it accepts that an automated deployment job copies the private key to the instances.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute une flotte de proxys qui terminent TLS sur des instances Amazon EC2 derrière un Network Load Balancer doté d'écouteurs TCP : les instances doivent donc détenir le certificat et sa clé privée. Les instances n'utilisent pas AWS Nitro Enclaves. Le service utilise un nom de domaine public et doit présenter un certificat public. L'entreprise veut qu'ACM émette et renouvelle le certificat, et elle accepte qu'une tâche de déploiement automatisée copie la clé privée sur les instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Request a standard public ACM certificate, and copy its private key to the instances with AWS Systems Manager Run Command after each renewal.", fr: "Demander un certificat ACM public standard, et copier sa clé privée sur les instances avec AWS Systems Manager Run Command après chaque renouvellement." } }
    - { id: b, text: { en: "Issue a certificate from an AWS Private CA subordinate CA through ACM, export it, and install it on the instances with the deployment job.", fr: "Émettre un certificat via ACM à partir d'une CA subordonnée AWS Private CA, l'exporter, et l'installer sur les instances avec la tâche de déploiement." } }
    - { id: c, text: { en: "Upload a certificate from a commercial CA to IAM as a server certificate, and let IAM renew it before it expires.", fr: "Charger dans IAM un certificat d'une CA commerciale en tant que certificat de serveur, et laisser IAM le renouveler avant son expiration." } }
    - { id: d, text: { en: "Request an exportable public certificate in ACM, and have the deployment job export each renewed certificate with its key and chain to the instances.", fr: "Demander un certificat public exportable dans ACM, et faire exporter par la tâche de déploiement chaque certificat renouvelé, avec sa clé et sa chaîne, vers les instances." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Exportable public certificates extend ACM public certificates beyond integrated services: you can export the certificate, private key, and chain to EC2 instances, containers, or on-premises hosts. ACM renews them automatically and notifies you, while you remain responsible for deploying each renewed certificate."
    fr: "Les certificats publics exportables étendent les certificats publics ACM au-delà des services intégrés : vous pouvez exporter le certificat, la clé privée et la chaîne vers des instances EC2, des conteneurs ou des hôtes sur site. ACM les renouvelle automatiquement et vous prévient, mais le déploiement de chaque certificat renouvelé reste à votre charge."
  options:
    a:
      en: "The private key of a standard ACM public certificate cannot be retrieved; without Nitro Enclaves, such a certificate can be used only with integrated services such as load balancers."
      fr: "La clé privée d'un certificat ACM public standard ne peut pas être récupérée ; sans Nitro Enclaves, un tel certificat ne s'utilise qu'avec des services intégrés comme les équilibreurs de charge."
    b:
      en: "A certificate signed by a private CA is not publicly trusted, so clients on the internet would reject it."
      fr: "Un certificat signé par une CA privée n'est pas public : les clients sur Internet le refuseraient."
    c:
      en: "IAM stores server certificates but never renews them, and the certificate would not be issued by ACM."
      fr: "IAM stocke des certificats de serveur mais ne les renouvelle jamais, et le certificat ne serait pas émis par ACM."
references:
  - title: AWS Certificate Manager exportable public certificates
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-exportable-certificates.html
  - title: Managed automation with integrated services
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-services.html
