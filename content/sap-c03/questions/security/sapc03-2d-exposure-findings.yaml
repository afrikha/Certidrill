id: sapc03-2d-exposure-findings
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 AWS accounts in AWS Organizations. Amazon Inspector, Amazon GuardDuty, Amazon Macie and AWS Security Hub CSPM are enabled in every account with a single security tooling account as delegated administrator. The security team receives several thousand findings each week and cannot review them one by one. It wants to know which resources combine several risk factors, such as an exploitable software vulnerability, internet reachability and an over-privileged IAM role, and to see how an attacker could move from such a resource to other resources. The team does not want to build or maintain its own correlation logic. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 300 comptes AWS dans AWS Organizations. Amazon Inspector, Amazon GuardDuty, Amazon Macie et AWS Security Hub CSPM sont activés dans tous les comptes, avec un seul compte d'outils de sécurité comme administrateur délégué. L'équipe de sécurité reçoit plusieurs milliers de résultats chaque semaine et ne peut pas les examiner un par un. Elle veut savoir quelles ressources combinent plusieurs facteurs de risque, comme une vulnérabilité logicielle exploitable, l'accessibilité depuis Internet et un rôle IAM disposant de trop de privilèges, et voir comment un attaquant pourrait passer d'une telle ressource à d'autres ressources. L'équipe ne veut pas construire ni maintenir sa propre logique de corrélation. La solution doit avoir le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send all findings to Amazon S3 with Amazon EventBridge rules and Amazon Data Firehose, join them by resource ARN with Amazon Athena queries, and publish a risk dashboard in Amazon Quick.", fr: "Envoyer tous les résultats vers Amazon S3 avec des règles Amazon EventBridge et Amazon Data Firehose, les joindre par ARN de ressource avec des requêtes Amazon Athena et publier un tableau de bord des risques dans Amazon Quick." }
    - id: b
      text: { en: "Create Security Hub CSPM automation rules in the delegated administrator account that suppress low and medium findings, and have the team review the remaining findings sorted by severity label.", fr: "Créer dans le compte administrateur délégué des règles d'automatisation Security Hub CSPM qui suppriment les résultats faibles et moyens, et faire examiner par l'équipe les résultats restants triés par niveau de gravité." }
    - id: c
      text: { en: "Enable Amazon Detective in the delegated administrator account, and have analysts open the behavior graph of each GuardDuty finding to find the resources that are most at risk.", fr: "Activer Amazon Detective dans le compte administrateur délégué, et faire ouvrir par les analystes le graphe de comportement de chaque résultat GuardDuty pour trouver les ressources les plus à risque." }
    - id: d
      text: { en: "Enable AWS Security Hub for the organization from the same delegated administrator account, and prioritize work with its exposure findings and the attack path graph of each finding.", fr: "Activer AWS Security Hub pour l'organisation depuis le même compte administrateur délégué, et prioriser le travail avec ses résultats d'exposition et le graphe de chemin d'attaque de chaque résultat." }
answer: { optionId: d }
explanation:
  correct:
    en: "Security Hub correlates signals from Inspector, Security Hub CSPM, GuardDuty and Macie into exposure findings that combine vulnerabilities, configuration issues, network reachability and permissions on a resource. Each exposure finding has a severity and an interactive attack path graph that shows the blast radius, so no custom correlation is needed."
    fr: "Security Hub corrèle les signaux d'Inspector, de Security Hub CSPM, de GuardDuty et de Macie en résultats d'exposition qui combinent vulnérabilités, problèmes de configuration, accessibilité réseau et autorisations d'une ressource. Chaque résultat d'exposition a une gravité et un graphe interactif de chemin d'attaque qui montre le rayon d'impact : aucune corrélation personnalisée n'est nécessaire."
  options:
    a:
      en: "A custom data lake with Athena joins is exactly the correlation logic the team does not want to build and maintain, so it does not have the least operational overhead."
      fr: "Un lac de données personnalisé avec des jointures Athena est précisément la logique de corrélation que l'équipe ne veut pas construire ni maintenir : ce n'est pas la solution la moins coûteuse en exploitation."
    b:
      en: "Suppressing findings by severity only reduces volume; it does not combine signals on the same resource or show attack paths, and a medium vulnerability on an exposed resource can be the real risk."
      fr: "Supprimer des résultats selon leur gravité ne fait que réduire le volume ; cela ne combine pas les signaux d'une même ressource et ne montre pas de chemins d'attaque, alors qu'une vulnérabilité moyenne sur une ressource exposée peut être le vrai risque."
    c:
      en: "Detective helps analysts investigate individual findings after the fact; reviewing a graph per finding is manual work and does not prioritize exposures across thousands of findings."
      fr: "Detective aide les analystes à enquêter sur des résultats individuels a posteriori ; examiner un graphe par résultat est un travail manuel qui ne priorise pas les expositions parmi des milliers de résultats."
references:
