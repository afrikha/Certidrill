id: sapc03-2a-access-analyzer-pipeline-checks
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys IAM policies and Amazon S3 bucket policies to 60 accounts through an infrastructure as code pipeline. Before any deployment, the pipeline must reject every bucket policy that could grant public access to its bucket. It must also reject every identity-based policy that grants iam:CreateUser, iam:CreateAccessKey or organizations:LeaveOrganization, even through wildcards. The security team does not want to write or maintain code that parses policies.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany déploie des politiques IAM et des politiques de compartiment (bucket) Amazon S3 dans 60 comptes par un pipeline d'infrastructure en tant que code. Avant tout déploiement, le pipeline doit rejeter toute politique de compartiment qui pourrait accorder un accès public à son compartiment. Il doit aussi rejeter toute politique basée sur l'identité qui accorde iam:CreateUser, iam:CreateAccessKey ou organizations:LeaveOrganization, même au moyen de caractères génériques. L'équipe de sécurité ne veut ni écrire ni maintenir de code qui analyse les politiques.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Run the IAM Access Analyzer CheckNoPublicAccess check on each bucket policy with the S3 bucket resource type, and fail the stage when the result is FAIL."
        fr: "Exécuter la vérification IAM Access Analyzer CheckNoPublicAccess sur chaque politique de compartiment avec le type de ressource compartiment S3, et faire échouer l'étape lorsque le résultat est FAIL."
    - id: b
      text:
        en: "Run IAM Access Analyzer policy validation on each policy, and fail the stage when it returns any SECURITY_WARNING finding."
        fr: "Exécuter la validation des politiques IAM Access Analyzer sur chaque politique, et faire échouer l'étape lorsqu'elle renvoie un résultat SECURITY_WARNING."
    - id: c
      text:
        en: "Run the IAM Access Analyzer CheckNoNewAccess check that compares each policy with its currently deployed version, and fail the stage when it reports new access."
        fr: "Exécuter la vérification IAM Access Analyzer CheckNoNewAccess qui compare chaque politique à sa version déployée, et faire échouer l'étape lorsqu'elle signale un nouvel accès."
    - id: d
      text:
        en: "Create an organization-level external access analyzer, and roll back a deployment when a new active finding appears for a bucket."
        fr: "Créer un analyseur d'accès externe au niveau de l'organisation, et annuler un déploiement lorsqu'un nouveau résultat actif apparaît pour un compartiment."
    - id: e
      text:
        en: "Run the IAM Access Analyzer CheckAccessNotGranted check on each identity-based policy with the three forbidden actions, and fail the stage when the result is FAIL."
        fr: "Exécuter la vérification IAM Access Analyzer CheckAccessNotGranted sur chaque politique basée sur l'identité avec les trois actions interdites, et faire échouer l'étape lorsque le résultat est FAIL."
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Custom policy checks evaluate a policy before it is deployed. CheckNoPublicAccess tells whether a resource policy can grant public access for a given resource type, and CheckAccessNotGranted tells whether a policy allows specified actions, including through wildcards, so neither needs custom parsing code."
    fr: "Les vérifications de politique personnalisées évaluent une politique avant son déploiement. CheckNoPublicAccess indique si une politique de ressource peut accorder un accès public pour un type de ressource donné, et CheckAccessNotGranted indique si une politique autorise des actions précises, y compris au moyen de caractères génériques : aucune ne nécessite de code d'analyse personnalisé."
  options:
    b:
      en: "Policy validation checks grammar and best practices; it does not guarantee that specific actions are absent or that a bucket policy cannot be public."
      fr: "La validation des politiques vérifie la grammaire et les bonnes pratiques ; elle ne garantit pas l'absence d'actions précises ni qu'une politique de compartiment ne peut pas être publique."
    c:
      en: "CheckNoNewAccess only compares a policy with a reference version; a policy that already allowed a forbidden action, or a brand new policy, is not checked against the forbidden list."
      fr: "CheckNoNewAccess compare seulement une politique à une version de référence ; une politique qui autorisait déjà une action interdite, ou une toute nouvelle politique, n'est pas vérifiée par rapport à la liste interdite."
    d:
      en: "An analyzer finds external access after the policy is deployed, which does not meet the requirement to reject policies before deployment."
      fr: "Un analyseur détecte l'accès externe après le déploiement de la politique, ce qui ne répond pas à l'exigence de rejet avant déploiement."
references:
  - title: Validate policies with IAM Access Analyzer custom policy checks
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-custom-policy-checks.html
