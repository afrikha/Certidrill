id: sapc03-2d-bedrock-private-models
objective: "2.5.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A pharmaceutical company runs generative AI applications in 12 AWS accounts of an organization in AWS Organizations, all in eu-west-1. The applications run in private subnets with no internet access and call Amazon Bedrock models with the InvokeModel API through bedrock-runtime interface VPC endpoints that are already deployed in each VPC. The security policy has two rules for model invocation. Requests must reach Amazon Bedrock only through the company's own interface VPC endpoints, so that a stolen credential cannot be used to invoke models from outside the VPCs. Only two foundation models approved by the AI governance board may be invoked. Account administrators manage the VPCs and their endpoints, and they must not be able to bypass either rule.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise pharmaceutique exécute des applications d'IA générative dans 12 comptes AWS d'une organisation AWS Organizations, tous en eu-west-1. Les applications s'exécutent dans des sous-réseaux privés sans accès à Internet et appellent des modèles Amazon Bedrock avec l'API InvokeModel par des points de terminaison VPC d'interface bedrock-runtime déjà déployés dans chaque VPC. La politique de sécurité fixe deux règles pour l'appel des modèles. Les requêtes ne doivent atteindre Amazon Bedrock que par les points de terminaison VPC d'interface de l'entreprise, afin qu'un identifiant volé ne puisse pas servir à appeler des modèles depuis l'extérieur des VPC. Seuls deux modèles de fondation approuvés par le comité de gouvernance de l'IA peuvent être appelés. Les administrateurs de compte gèrent les VPC et leurs points de terminaison, et ne doivent pouvoir contourner aucune des deux règles.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Replace the interface endpoints with gateway VPC endpoints for Amazon Bedrock, and attach an endpoint policy that allows only the two approved models.", fr: "Remplacer les points de terminaison d'interface par des points de terminaison VPC de passerelle pour Amazon Bedrock, et y attacher une politique de point de terminaison qui n'autorise que les deux modèles approuvés." } }
    - { id: b, text: { en: "Update the policy of every bedrock-runtime interface endpoint so that it allows bedrock:InvokeModel only on the ARNs of the two approved foundation models.", fr: "Mettre à jour la politique de chaque point de terminaison d'interface bedrock-runtime pour qu'elle n'autorise bedrock:InvokeModel que sur les ARN des deux modèles de fondation approuvés." } }
    - { id: c, text: { en: "Attach an SCP that denies bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream when aws:SourceVpce is not one of the company's Bedrock interface endpoint IDs.", fr: "Attacher une SCP qui refuse bedrock:InvokeModel et bedrock:InvokeModelWithResponseStream lorsque aws:SourceVpce n'est pas l'un des ID des points de terminaison d'interface Bedrock de l'entreprise." } }
    - { id: d, text: { en: "Attach an SCP that denies bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream on every foundation model ARN except the ARNs of the two approved models.", fr: "Attacher une SCP qui refuse bedrock:InvokeModel et bedrock:InvokeModelWithResponseStream sur tous les ARN de modèle de fondation sauf ceux des deux modèles approuvés." } }
    - { id: e, text: { en: "Enforce a guardrail with denied topics on every invocation through an Amazon Bedrock policy in AWS Organizations, so that requests to other models are blocked.", fr: "Imposer un guardrail avec des sujets refusés sur chaque appel par une politique Amazon Bedrock d'AWS Organizations, afin de bloquer les requêtes vers d'autres modèles." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "An SCP that denies invocation when aws:SourceVpce is not a company endpoint blocks any use of the credentials from outside those endpoints. A second SCP statement that denies invocation of every model except the two approved ARNs restricts the models. SCPs are managed from the management account, so the account administrators who manage the VPCs and endpoints cannot change either rule."
    fr: "Une SCP qui refuse l'appel lorsque aws:SourceVpce n'est pas un point de terminaison de l'entreprise bloque toute utilisation des identifiants hors de ces points de terminaison. Une seconde instruction de SCP qui refuse l'appel de tout modèle sauf les deux ARN approuvés restreint les modèles. Les SCP se gèrent depuis le compte de gestion : les administrateurs de compte qui gèrent les VPC et les points de terminaison ne peuvent modifier aucune des deux règles."
  options:
    a:
      en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Amazon Bedrock is reached privately through interface endpoints powered by AWS PrivateLink."
      fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Amazon Bedrock est accessible de façon privée par des points de terminaison d'interface fournis par AWS PrivateLink."
    b:
      en: "An endpoint policy does restrict what can be invoked through the endpoint, but the account administrators manage the endpoints and can edit or replace that policy, so they could bypass the model rule."
      fr: "Une politique de point de terminaison restreint bien ce qui peut être appelé par le point de terminaison, mais les administrateurs de compte gèrent les points de terminaison et peuvent modifier ou remplacer cette politique : ils pourraient contourner la règle sur les modèles."
    e:
      en: "Guardrails filter content in prompts and responses; they do not authorize which model is invoked or by which network path."
      fr: "Les guardrails filtrent le contenu des invites et des réponses ; ils n'autorisent ni le modèle appelé ni le chemin réseau utilisé."
references:
  - title: Use interface VPC endpoints (AWS PrivateLink) to create a private connection between your VPC and Amazon Bedrock
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/vpc-interface-endpoints.html
