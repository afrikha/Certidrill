id: sapc03-2b-xks-keys-outside-aws
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany, a European insurer, stores claims documents in Amazon S3 with SSE-KMS and processes them with AWS Lambda and Amazon Athena. A new national regulation requires that the root encryption keys remain in HSMs located in the company's own data centers. AWS must not be able to decrypt the data without the company's ongoing cooperation, and the company must be able to cut off access at any time. The company must keep the native SSE-KMS integration of S3, Lambda, and Athena, and it accepts responsibility for the availability and latency of its key manager.

    Which solution will meet these requirements?
  fr: |
    AnyCompany, un assureur européen, stocke des dossiers de sinistres dans Amazon S3 avec SSE-KMS et les traite avec AWS Lambda et Amazon Athena. Une nouvelle réglementation nationale exige que les clés de chiffrement racines restent dans des HSM situés dans les centres de données de l'entreprise. AWS ne doit pas pouvoir déchiffrer les données sans la coopération continue de l'entreprise, et l'entreprise doit pouvoir couper l'accès à tout moment. L'entreprise doit conserver l'intégration native SSE-KMS de S3, Lambda et Athena, et elle accepte la responsabilité de la disponibilité et de la latence de son gestionnaire de clés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS CloudHSM cluster, connect it to an AWS CloudHSM key store, and create the KMS keys used for SSE-KMS in that key store.", fr: "Créer un cluster AWS CloudHSM, le connecter à un magasin de clés AWS CloudHSM, et créer dans ce magasin les clés KMS utilisées pour SSE-KMS." } }
    - { id: b, text: { en: "Generate key material in the on-premises HSMs, import it into new KMS keys, and set an expiration date on the imported key material.", fr: "Générer des éléments de clé dans les HSM sur site, les importer dans de nouvelles clés KMS, et définir une date d'expiration sur les éléments importés." } }
    - { id: c, text: { en: "Connect the on-premises key manager to an AWS KMS external key store through an external key store proxy, and create the SSE-KMS keys in that key store.", fr: "Connecter le gestionnaire de clés sur site à un magasin de clés externe AWS KMS via un proxy de magasin de clés externe, et créer les clés SSE-KMS dans ce magasin." } }
    - { id: d, text: { en: "Encrypt the documents on premises with keys from the on-premises HSMs before uploading them, and store the ciphertext in Amazon S3 with SSE-S3.", fr: "Chiffrer les dossiers sur site avec des clés des HSM sur site avant de les charger, et stocker le texte chiffré dans Amazon S3 avec SSE-S3." } }
answer: { optionId: c }
explanation:
  correct:
    en: "With an external key store, the key material never leaves the external key manager, and data is double-encrypted with AWS KMS key material and the external key, so neither party can decrypt it alone. Revoking access through the proxy stops all decryption, and the KMS keys still work with SSE-KMS and other integrated services."
    fr: "Avec un magasin de clés externe, les éléments de clé ne quittent jamais le gestionnaire de clés externe, et les données sont doublement chiffrées avec des éléments de clé AWS KMS et la clé externe : aucune des deux parties ne peut les déchiffrer seule. Révoquer l'accès via le proxy arrête tout déchiffrement, et les clés KMS restent utilisables avec SSE-KMS et les autres services intégrés."
  options:
    a:
      en: "CloudHSM HSMs are single-tenant but run in AWS data centers, not in the company's own data centers."
      fr: "Les HSM CloudHSM sont à locataire unique mais fonctionnent dans les centres de données AWS, pas dans ceux de l'entreprise."
    b:
      en: "Imported key material is stored and used by AWS KMS, so AWS can use it without ongoing cooperation until it expires or is deleted."
      fr: "Les éléments de clé importés sont stockés et utilisés par AWS KMS : AWS peut donc les utiliser sans coopération continue jusqu'à leur expiration ou leur suppression."
    d:
      en: "Client-side encryption breaks the native integration: Athena and Lambda would read only ciphertext through S3."
      fr: "Le chiffrement côté client rompt l'intégration native : Athena et Lambda ne liraient que du texte chiffré via S3."
references:
  - title: External key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
