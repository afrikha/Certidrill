id: sapc03-2a-http-api-jwt-scopes
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is building a single-page web application whose users sign in to an Amazon Cognito user pool. The backend is a new HTTP API in Amazon API Gateway with AWS Lambda integrations. The API must reject every request that does not carry a valid access token issued by the user pool for the application's app client. GET routes must also require the orders.read scope. The company does not want to write or maintain any authorization code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany développe une application web monopage dont les utilisateurs se connectent à un groupe d'utilisateurs Amazon Cognito. Le backend est une nouvelle API HTTP Amazon API Gateway avec des intégrations AWS Lambda. L'API doit rejeter toute requête qui ne porte pas un jeton d'accès valide émis par le groupe d'utilisateurs pour le client d'application de l'application. Les routes GET doivent aussi exiger la portée orders.read. L'entreprise ne veut écrire ni maintenir aucun code d'autorisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Lambda authorizer that downloads the user pool's JSON Web Key Set, validates the token signature, issuer, audience and scopes, and returns an allow or deny decision."
        fr: "Créer un mécanisme d'autorisation Lambda qui télécharge le jeu de clés web JSON du groupe d'utilisateurs, valide la signature, l'émetteur, l'audience et les portées du jeton, et renvoie une décision d'autorisation ou de refus."
    - id: b
      text:
        en: "Create a JWT authorizer with the user pool URL as the issuer and the app client ID as the audience, and set orders.read as an authorization scope on the GET routes."
        fr: "Créer un mécanisme d'autorisation JWT avec l'URL du groupe d'utilisateurs comme émetteur et l'ID du client d'application comme audience, et définir orders.read comme portée d'autorisation sur les routes GET."
    - id: c
      text:
        en: "Enable IAM authorization on the routes, and have the application sign requests with AWS credentials that it obtains from a Cognito identity pool after sign-in."
        fr: "Activer l'autorisation IAM sur les routes, et faire signer les requêtes par l'application avec des informations d'identification AWS obtenues d'un groupe d'identités Cognito après la connexion."
    - id: d
      text:
        en: "Enable mutual TLS on a custom domain name for the API, and issue a client certificate to each user after the user signs in to the user pool."
        fr: "Activer le TLS mutuel sur un nom de domaine personnalisé de l'API, et émettre un certificat client pour chaque utilisateur après sa connexion au groupe d'utilisateurs."
answer: { optionId: b }
explanation:
  correct:
    en: "A JWT authorizer of an HTTP API validates the token signature against the issuer's keys and checks the issuer, the audience or client ID, the expiration and, when the route defines authorization scopes, the scope claim. For Amazon Cognito, the issuer is the user pool URL and the audience is the app client ID, so no authorization code is needed."
    fr: "Un mécanisme d'autorisation JWT d'API HTTP valide la signature du jeton avec les clés de l'émetteur et vérifie l'émetteur, l'audience ou l'ID client, l'expiration et, lorsque la route définit des portées d'autorisation, la revendication scope. Pour Amazon Cognito, l'émetteur est l'URL du groupe d'utilisateurs et l'audience l'ID du client d'application : aucun code d'autorisation n'est nécessaire."
  options:
    a:
      en: "A Lambda authorizer works but is authorization code that the company must write and maintain, which the requirement excludes."
      fr: "Un mécanisme d'autorisation Lambda fonctionne mais constitue du code d'autorisation que l'entreprise doit écrire et maintenir, ce que l'exigence exclut."
    c:
      en: "IAM authorization checks SigV4-signed requests, not the user pool access token and its orders.read scope."
      fr: "L'autorisation IAM vérifie des requêtes signées SigV4, pas le jeton d'accès du groupe d'utilisateurs ni sa portée orders.read."
    d:
      en: "Mutual TLS authenticates client certificates; it does not validate user pool tokens or scopes, and issuing per-user certificates adds heavy work."
      fr: "Le TLS mutuel authentifie des certificats clients ; il ne valide ni les jetons du groupe d'utilisateurs ni les portées, et l'émission de certificats par utilisateur ajoute un travail important."
references:
  - title: Control access to HTTP APIs with JWT authorizers in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-jwt-authorizer.html
