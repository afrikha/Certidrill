id: sapc03-2b-alb-tls13-default-policy
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany deploys Application Load Balancers in 30 accounts with AWS CloudFormation StackSets. A compliance review finds that no HTTPS listener negotiates TLS 1.3, even with clients that support it. The listener resources in the templates set the protocol, the port, the default action, and an ACM certificate, but no other TLS setting. The company must offer TLS 1.3 to clients that support it, keep accepting the TLS 1.2 clients that several partners still use, and reject TLS 1.0 and TLS 1.1. FIPS-validated cryptography is not required.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany déploie des Application Load Balancers dans 30 comptes avec AWS CloudFormation StackSets. Un audit de conformité constate qu'aucun écouteur HTTPS ne négocie TLS 1.3, même avec des clients qui le prennent en charge. Les ressources d'écouteur des modèles définissent le protocole, le port, l'action par défaut et un certificat ACM, mais aucun autre paramètre TLS. L'entreprise doit proposer TLS 1.3 aux clients qui le prennent en charge, continuer d'accepter les clients TLS 1.2 que plusieurs partenaires utilisent encore, et refuser TLS 1.0 et TLS 1.1. La cryptographie validée FIPS n'est pas exigée.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Replace the RSA certificates with ECDSA certificates in ACM, because Application Load Balancers negotiate TLS 1.3 only with ECDSA certificates, and update the stack instances.", fr: "Remplacer les certificats RSA par des certificats ECDSA dans ACM, car les Application Load Balancers ne négocient TLS 1.3 qu'avec des certificats ECDSA, et mettre à jour les instances de pile." } }
    - { id: b, text: { en: "Set the SslPolicy property of every HTTPS listener to ELBSecurityPolicy-TLS13-1-3-2021-06 in the templates, and update the stack instances.", fr: "Définir la propriété SslPolicy de chaque écouteur HTTPS sur ELBSecurityPolicy-TLS13-1-3-2021-06 dans les modèles, et mettre à jour les instances de pile." } }
    - { id: c, text: { en: "Set the SslPolicy property of every HTTPS listener to ELBSecurityPolicy-TLS13-1-2-Res-2021-06 in the templates, and update the stack instances.", fr: "Définir la propriété SslPolicy de chaque écouteur HTTPS sur ELBSecurityPolicy-TLS13-1-2-Res-2021-06 dans les modèles, et mettre à jour les instances de pile." } }
    - { id: d, text: { en: "Place an Amazon CloudFront distribution with the TLSv1.2_2021 security policy in front of each load balancer, and keep the listener definitions unchanged.", fr: "Placer une distribution Amazon CloudFront avec la politique de sécurité TLSv1.2_2021 devant chaque équilibreur de charge, et conserver les définitions d'écouteur inchangées." } }
answer: { optionId: c }
explanation:
  correct:
    en: "When a listener is created with the AWS CLI, CloudFormation, or the AWS CDK without a security policy, it gets ELBSecurityPolicy-2016-08, which does not support TLS 1.3 (only the console uses a TLS 1.3 policy by default). ELBSecurityPolicy-TLS13-1-2-Res-2021-06 supports TLS 1.3 and TLS 1.2 and refuses older versions, and setting it in the templates fixes every account in one StackSets update."
    fr: "Un écouteur créé avec l'AWS CLI, CloudFormation ou l'AWS CDK sans politique de sécurité reçoit ELBSecurityPolicy-2016-08, qui ne prend pas en charge TLS 1.3 (seule la console utilise par défaut une politique TLS 1.3). ELBSecurityPolicy-TLS13-1-2-Res-2021-06 prend en charge TLS 1.3 et TLS 1.2 et refuse les versions plus anciennes ; la définir dans les modèles corrige tous les comptes en une seule mise à jour StackSets."
  options:
    a:
      en: "The negotiated TLS version is determined by the listener's security policy, not by the certificate key type; RSA certificates work with TLS 1.3 policies."
      fr: "La version TLS négociée dépend de la politique de sécurité de l'écouteur, pas du type de clé du certificat ; les certificats RSA fonctionnent avec les politiques TLS 1.3."
    b:
      en: "This policy accepts only TLS 1.3, so the partners that still use TLS 1.2 would be rejected."
      fr: "Cette politique n'accepte que TLS 1.3 : les partenaires qui utilisent encore TLS 1.2 seraient refusés."
    d:
      en: "CloudFront adds a service and cost, and the listeners keep ELBSecurityPolicy-2016-08, which still accepts TLS 1.0 and TLS 1.1 from clients that reach the load balancers directly."
      fr: "CloudFront ajoute un service et un coût, et les écouteurs conservent ELBSecurityPolicy-2016-08, qui accepte encore TLS 1.0 et TLS 1.1 des clients qui atteignent directement les équilibreurs de charge."
references:
  - title: Security policies for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
