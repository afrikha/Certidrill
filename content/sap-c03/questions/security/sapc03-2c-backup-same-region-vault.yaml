id: sapc03-2c-backup-same-region-vault
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Spanish insurer runs its policy administration system in eu-south-2 (Spain) in a production account of its organization in AWS Organizations. Spanish regulation requires that the data and all its backups remain in Spain, and eu-south-2 is the only AWS Region in the country. The security team requires backups that cannot be deleted for 90 days, even by an attacker who obtains administrator access to the production account. The backups are created by AWS Backup with a customer managed key, and the company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un assureur espagnol exploite son système de gestion des contrats dans eu-south-2 (Espagne) dans un compte de production de son organisation AWS Organizations. La réglementation espagnole exige que les données et toutes leurs sauvegardes restent en Espagne, et eu-south-2 est la seule Région AWS du pays. L'équipe de sécurité exige des sauvegardes impossibles à supprimer pendant 90 jours, même par un attaquant qui obtient un accès administrateur au compte de production. Les sauvegardes sont créées par AWS Backup avec une clé gérée par le client, et l'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Copy the recovery points to a vault in eu-west-3 in a central backup account, and apply AWS Backup Vault Lock in compliance mode with a 90-day minimum retention."
        fr: "Copier les points de récupération dans un coffre d'eu-west-3 d'un compte de sauvegarde central, et appliquer AWS Backup Vault Lock en mode conformité avec une rétention minimale de 90 jours."
    - id: b
      text:
        en: "Keep the recovery points in a vault in the production account in eu-south-2, and apply AWS Backup Vault Lock in governance mode with a 90-day minimum retention."
        fr: "Conserver les points de récupération dans un coffre du compte de production dans eu-south-2, et appliquer AWS Backup Vault Lock en mode gouvernance avec une rétention minimale de 90 jours."
    - id: c
      text:
        en: "Copy the recovery points to a vault in eu-south-2 in a central backup account, and apply AWS Backup Vault Lock in compliance mode with a 90-day minimum retention."
        fr: "Copier les points de récupération dans un coffre d'eu-south-2 d'un compte de sauvegarde central, et appliquer AWS Backup Vault Lock en mode conformité avec une rétention minimale de 90 jours."
    - id: d
      text:
        en: "Share the EBS and RDS snapshots with a central backup account in eu-south-2, and create Recycle Bin retention rules with a 90-day retention in that account."
        fr: "Partager les instantanés EBS et RDS avec un compte de sauvegarde central dans eu-south-2, et créer dans ce compte des règles de rétention de la corbeille (Recycle Bin) de 90 jours."
answer: { optionId: c }
explanation:
  correct:
    en: "A cross-account copy to a vault in another account of the same organization isolates the backups from a compromise of the production account, and keeping the destination vault in eu-south-2 keeps them in Spain. Vault Lock in compliance mode prevents anyone from deleting recovery points before the minimum retention once the lock is in effect. Because the source uses a customer managed key, that key is shared with the destination account."
    fr: "Une copie entre comptes vers un coffre d'un autre compte de la même organisation isole les sauvegardes d'une compromission du compte de production, et un coffre de destination dans eu-south-2 les maintient en Espagne. Vault Lock en mode conformité empêche quiconque de supprimer des points de récupération avant la rétention minimale une fois le verrou effectif. Comme la source utilise une clé gérée par le client, cette clé est partagée avec le compte de destination."
  options:
    a:
      en: "eu-west-3 is in France, so the backup copies would leave Spain, which violates the regulation."
      fr: "eu-west-3 se trouve en France : les copies de sauvegarde quitteraient l'Espagne, ce qui viole la réglementation."
    b:
      en: "The backups stay in the compromised account, and governance mode can be removed by principals with sufficient permissions, such as an attacker with administrator access."
      fr: "Les sauvegardes restent dans le compte compromis, et le mode gouvernance peut être levé par des principaux disposant d'autorisations suffisantes, comme un attaquant ayant un accès administrateur."
    d:
      en: "Shared snapshots remain owned by the production account, and Recycle Bin only recovers deleted resources; it does not make backups immutable."
      fr: "Les instantanés partagés restent la propriété du compte de production, et la corbeille permet seulement de récupérer des ressources supprimées ; elle ne rend pas les sauvegardes immuables."
references:
  - title: Creating backup copies across AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/create-cross-account-backup.html
