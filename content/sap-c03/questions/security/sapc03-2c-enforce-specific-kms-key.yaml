id: sapc03-2c-enforce-specific-kms-key
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical research company stores clinical trial data in an Amazon S3 bucket in a data account. Every object must be encrypted at rest with one specific AWS KMS customer managed key owned by the security team, so that each use of the key appears in AWS CloudTrail and the team can disable the key if needed. Uploads that request SSE-S3 or any other KMS key must be rejected. Existing upload clients that do not send any encryption header must continue to work without changes. The company also wants to keep its AWS KMS request costs as low as possible.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de recherche pharmaceutique stocke des données d'essais cliniques dans un compartiment Amazon S3 d'un compte de données. Chaque objet doit être chiffré au repos avec une clé gérée par le client AWS KMS précise, détenue par l'équipe de sécurité, afin que chaque utilisation de la clé apparaisse dans AWS CloudTrail et que l'équipe puisse désactiver la clé si nécessaire. Les chargements qui demandent SSE-S3 ou toute autre clé KMS doivent être rejetés. Les clients de chargement existants qui n'envoient aucun en-tête de chiffrement doivent continuer à fonctionner sans modification. L'entreprise veut aussi maintenir ses coûts de requêtes AWS KMS aussi bas que possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure the bucket default encryption as SSE-KMS with the customer managed key, and enable S3 Bucket Keys."
        fr: "Configurer le chiffrement par défaut du compartiment en SSE-KMS avec la clé gérée par le client, et activer les clés de compartiment S3 (S3 Bucket Keys)."
    - id: b
      text:
        en: "Configure the bucket default encryption as SSE-S3, enable S3 Bucket Keys, and require the customer managed key in the upload clients."
        fr: "Configurer le chiffrement par défaut du compartiment en SSE-S3, activer les clés de compartiment S3, et exiger la clé gérée par le client dans les clients de chargement."
    - id: c
      text:
        en: "Add a bucket policy statement that denies s3:PutObject when the request does not include the s3:x-amz-server-side-encryption header."
        fr: "Ajouter une instruction de politique de compartiment qui refuse s3:PutObject lorsque la requête ne contient pas l'en-tête s3:x-amz-server-side-encryption."
    - id: d
      text:
        en: "Configure the bucket default encryption as SSE-KMS with the AWS managed key aws/s3, and enable S3 Bucket Keys to lower request costs."
        fr: "Configurer le chiffrement par défaut du compartiment en SSE-KMS avec la clé gérée par AWS aws/s3, et activer les clés de compartiment S3 pour réduire les coûts de requêtes."
    - id: e
      text:
        en: "Add a bucket policy that denies uploads that request SSE-S3 or another KMS key, while allowing uploads that send no encryption header."
        fr: "Ajouter une politique de compartiment qui refuse les chargements demandant SSE-S3 ou une autre clé KMS, tout en autorisant les chargements sans en-tête de chiffrement."
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "Default encryption with SSE-KMS and the customer managed key encrypts the objects of clients that send no encryption header, and S3 Bucket Keys reduce S3 calls to AWS KMS, and so KMS request costs, by using a short-lived bucket-level key. Default encryption does not stop a client from explicitly asking for another key or SSE-S3, so a bucket policy must deny those requests while leaving header-less uploads to the default."
    fr: "Le chiffrement par défaut en SSE-KMS avec la clé gérée par le client chiffre les objets des clients qui n'envoient aucun en-tête de chiffrement, et les clés de compartiment S3 réduisent les appels de S3 à AWS KMS, donc les coûts de requêtes KMS, grâce à une clé de courte durée au niveau du compartiment. Le chiffrement par défaut n'empêche pas un client de demander explicitement une autre clé ou SSE-S3 : une politique de compartiment doit donc refuser ces requêtes tout en laissant les chargements sans en-tête au chiffrement par défaut."
  options:
    b:
      en: "SSE-S3 uses keys that are managed by Amazon S3, so key usage does not appear in CloudTrail and the security team cannot disable the key."
      fr: "SSE-S3 utilise des clés gérées par Amazon S3 : l'utilisation de la clé n'apparaît pas dans CloudTrail et l'équipe de sécurité ne peut pas désactiver la clé."
    c:
      en: "Denying requests without an encryption header breaks the existing clients that send no header, which must keep working without changes."
      fr: "Refuser les requêtes sans en-tête de chiffrement bloque les clients existants qui n'envoient pas d'en-tête, alors qu'ils doivent continuer à fonctionner sans modification."
    d:
      en: "The properties and key policy of an AWS managed key cannot be changed, and it cannot be disabled, so it does not meet the control requirement."
      fr: "Les propriétés et la politique de clé d'une clé gérée par AWS ne peuvent pas être modifiées, et elle ne peut pas être désactivée : elle ne répond pas à l'exigence de contrôle."
references:
  - title: Reducing the cost of SSE-KMS with Amazon S3 Bucket Keys
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-key.html
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
