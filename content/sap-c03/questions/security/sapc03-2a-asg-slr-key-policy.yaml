id: sapc03-2a-asg-slr-key-policy
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a web tier in an Amazon EC2 Auto Scaling group. To meet a new encryption standard, the security team created a customer managed AWS KMS key in the same account with a custom key policy and changed the launch template so that every Amazon EBS volume is encrypted with this key. Since the change, the Auto Scaling group fails to launch instances. An administrator can launch an instance manually from the same launch template. The key policy allows the administrators and the instance role, but no other principals.

    Which change will allow the Auto Scaling group to launch instances?
  fr: |
    AnyCompany exécute une couche web dans un groupe Amazon EC2 Auto Scaling. Pour respecter une nouvelle norme de chiffrement, l'équipe de sécurité a créé une clé AWS KMS gérée par le client dans le même compte avec une politique de clé personnalisée, et a modifié le modèle de lancement pour que chaque volume Amazon EBS soit chiffré avec cette clé. Depuis ce changement, le groupe Auto Scaling ne parvient pas à lancer d'instances. Un administrateur peut lancer une instance manuellement à partir du même modèle de lancement. La politique de clé autorise les administrateurs et le rôle d'instance, mais aucun autre principal.

    Quelle modification permettra au groupe Auto Scaling de lancer des instances ?
body:
  options:
    - id: a
      text:
        en: "Add kms:Decrypt, kms:GenerateDataKey* and kms:CreateGrant on the key to the IAM role of the instance profile that the launch template uses."
        fr: "Ajouter kms:Decrypt, kms:GenerateDataKey* et kms:CreateGrant sur la clé au rôle IAM du profil d'instance qu'utilise le modèle de lancement."
    - id: b
      text:
        en: "Enable EBS encryption by default in the Region with the customer managed key, and remove the encryption settings from the launch template."
        fr: "Activer le chiffrement EBS par défaut dans la Région avec la clé gérée par le client, et supprimer les paramètres de chiffrement du modèle de lancement."
    - id: c
      text:
        en: "Add key policy statements that allow the AWSServiceRoleForAutoScaling service-linked role to use the key and to call kms:CreateGrant when kms:GrantIsForAWSResource is true."
        fr: "Ajouter à la politique de clé des instructions qui autorisent le rôle lié à un service AWSServiceRoleForAutoScaling à utiliser la clé et à appeler kms:CreateGrant lorsque kms:GrantIsForAWSResource vaut true."
    - id: d
      text:
        en: "Give the IAM principal that created the Auto Scaling group kms:CreateGrant on the key, and update the group so that it launches instances with that principal's permissions."
        fr: "Donner au principal IAM qui a créé le groupe Auto Scaling kms:CreateGrant sur la clé, et mettre à jour le groupe pour qu'il lance les instances avec les autorisations de ce principal."
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon EC2 Auto Scaling launches instances with its service-linked role, so a customer managed key that encrypts EBS volumes needs key policy statements for that role. At minimum, the role needs the key usage actions (Encrypt, Decrypt, ReEncrypt*, GenerateDataKey*, DescribeKey) and kms:CreateGrant with kms:GrantIsForAWSResource set to true."
    fr: "Amazon EC2 Auto Scaling lance les instances avec son rôle lié à un service : une clé gérée par le client qui chiffre des volumes EBS a besoin d'instructions de politique de clé pour ce rôle. Au minimum, le rôle a besoin des actions d'utilisation de la clé (Encrypt, Decrypt, ReEncrypt*, GenerateDataKey*, DescribeKey) et de kms:CreateGrant avec kms:GrantIsForAWSResource défini sur true."
  options:
    a:
      en: "The instance role is used by software on the instance after launch; it is not the principal that creates and attaches the encrypted volumes for Auto Scaling."
      fr: "Le rôle d'instance est utilisé par les logiciels de l'instance après le lancement ; ce n'est pas le principal qui crée et attache les volumes chiffrés pour Auto Scaling."
    b:
      en: "Default encryption still uses the same key, so the Auto Scaling service-linked role still lacks permission to use it."
      fr: "Le chiffrement par défaut utilise toujours la même clé : le rôle lié à un service d'Auto Scaling n'a toujours pas l'autorisation de l'utiliser."
    d:
      en: "An Auto Scaling group does not launch instances with the permissions of the principal that created it; it uses its service-linked role."
      fr: "Un groupe Auto Scaling ne lance pas les instances avec les autorisations du principal qui l'a créé ; il utilise son rôle lié à un service."
references:
  - title: Required AWS KMS key policy for use with encrypted volumes
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/key-policy-requirements-EBS-encryption.html
