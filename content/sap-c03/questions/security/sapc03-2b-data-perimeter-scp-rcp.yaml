id: sapc03-2b-data-perimeter-scp-rcp
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is building a data perimeter for Amazon S3 across 200 member accounts in AWS Organizations. First, principals in the member accounts must not be able to copy data to S3 buckets that belong to other organizations. Second, S3 buckets in the member accounts must not be accessible to principals from other organizations, even if a bucket policy grants such access. Both controls must be managed centrally.

    Which combination of policies will meet these requirements? (Choose two.)
  fr: |
    AnyCompany construit un périmètre de données pour Amazon S3 sur 200 comptes membres d'AWS Organizations. D'une part, les principaux des comptes membres ne doivent pas pouvoir copier des données vers des compartiments S3 appartenant à d'autres organisations. D'autre part, les compartiments S3 des comptes membres ne doivent pas être accessibles aux principaux d'autres organisations, même si une politique de compartiment accorde cet accès. Les deux contrôles doivent être gérés de façon centralisée.

    Quelle combinaison de politiques répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An SCP that denies S3 actions when aws:ResourceOrgID does not equal the organization ID.", fr: "Une SCP qui refuse les actions S3 lorsque aws:ResourceOrgID n'est pas égal à l'ID de l'organisation." } }
    - { id: b, text: { en: "An SCP that denies S3 actions when aws:PrincipalOrgID does not equal the organization ID.", fr: "Une SCP qui refuse les actions S3 lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation." } }
    - { id: c, text: { en: "An RCP that denies S3 actions when aws:ResourceOrgID does not equal the organization ID.", fr: "Une RCP qui refuse les actions S3 lorsque aws:ResourceOrgID n'est pas égal à l'ID de l'organisation." } }
    - { id: d, text: { en: "An RCP that denies S3 actions when aws:PrincipalOrgID does not equal the organization ID.", fr: "Une RCP qui refuse les actions S3 lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation." } }
    - { id: e, text: { en: "A permissions boundary on every role that denies S3 actions on buckets outside the role's own account.", fr: "Une limite d'autorisations sur chaque rôle qui refuse les actions S3 sur les compartiments extérieurs au compte du rôle." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The trusted-resources objective is implemented with SCPs, which constrain what your principals can access, by using aws:ResourceOrgID. The trusted-identities objective is implemented with RCPs, which constrain who can access your resources, by using aws:PrincipalOrgID, and an RCP also overrides bucket policies that grant external access."
    fr: "L'objectif « ressources de confiance » se met en œuvre avec des SCP, qui limitent ce à quoi vos principaux peuvent accéder, à l'aide d'aws:ResourceOrgID. L'objectif « identités de confiance » se met en œuvre avec des RCP, qui limitent qui peut accéder à vos ressources, à l'aide d'aws:PrincipalOrgID, et une RCP prévaut aussi sur les politiques de compartiment qui accordent un accès externe."
  options:
    b:
      en: "An SCP applies only to principals of the organization, whose aws:PrincipalOrgID always matches, so it restricts nothing and does not affect external principals."
      fr: "Une SCP ne s'applique qu'aux principaux de l'organisation, dont aws:PrincipalOrgID correspond toujours : elle ne restreint rien et n'affecte pas les principaux externes."
    c:
      en: "An RCP applies only to resources in the organization, whose aws:ResourceOrgID always matches, so it does not stop copies to external buckets."
      fr: "Une RCP ne s'applique qu'aux ressources de l'organisation, dont aws:ResourceOrgID correspond toujours : elle n'empêche pas les copies vers des compartiments externes."
    e:
      en: "Boundaries must be attached to every role in every account, they are not central, and they would also block legitimate access to buckets in other accounts of the organization."
      fr: "Les limites doivent être attachées à chaque rôle de chaque compte, ne sont pas centralisées, et bloqueraient aussi l'accès légitime aux compartiments d'autres comptes de l'organisation."
references:
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
