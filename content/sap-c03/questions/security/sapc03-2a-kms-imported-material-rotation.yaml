id: sapc03-2a-kms-imported-material-rotation
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany encrypts Amazon RDS databases and Amazon S3 buckets with a symmetric customer managed AWS KMS key. A regulator requires that the key material be generated in the company's own on-premises HSM, so the key was created with imported key material. A new rule requires the key material to be rotated every year. The RDS instances and several applications reference the key by its key ID, and data that was encrypted before a rotation must remain decryptable. The company does not want to change the key ID that services use.

    Which solution will meet these requirements?
  fr: |
    AnyCompany chiffre des bases de données Amazon RDS et des compartiments (buckets) Amazon S3 avec une clé AWS KMS symétrique gérée par le client. Un régulateur exige que le matériel de clé soit généré dans le HSM sur site de l'entreprise : la clé a donc été créée avec du matériel de clé importé. Une nouvelle règle exige la rotation du matériel de clé chaque année. Les instances RDS et plusieurs applications référencent la clé par son ID de clé, et les données chiffrées avant une rotation doivent rester déchiffrables. L'entreprise ne veut pas modifier l'ID de clé qu'utilisent les services.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable automatic key rotation on the key with a rotation period of 365 days, and keep the imported key material in the on-premises HSM."
        fr: "Activer la rotation automatique de la clé avec une période de rotation de 365 jours, et conserver le matériel de clé importé dans le HSM sur site."
    - id: b
      text:
        en: "Each year, create a new KMS key with newly imported key material, move the key's alias to the new key, and keep the old key enabled for decryption."
        fr: "Chaque année, créer une nouvelle clé KMS avec du matériel de clé nouvellement importé, déplacer l'alias de la clé vers la nouvelle clé, et conserver l'ancienne clé activée pour le déchiffrement."
    - id: c
      text:
        en: "Each year, generate new key material in the HSM, import it into the existing KMS key as new key material, and then perform an on-demand rotation of the key."
        fr: "Chaque année, générer un nouveau matériel de clé dans le HSM, l'importer dans la clé KMS existante comme nouveau matériel de clé, puis effectuer une rotation à la demande de la clé."
    - id: d
      text:
        en: "Set an expiration date of one year on the imported key material so that AWS KMS replaces the material with new material when it expires."
        fr: "Définir une date d'expiration d'un an sur le matériel de clé importé afin qu'AWS KMS remplace le matériel par un nouveau à son expiration."
answer: { optionId: c }
explanation:
  correct:
    en: "Automatic rotation is not supported for keys with imported key material, but on-demand rotation is: after new key material is imported and is pending rotation, RotateKeyOnDemand makes it the current material. The key ID and ARN do not change, and KMS keeps the previous material to decrypt older ciphertext."
    fr: "La rotation automatique n'est pas prise en charge pour les clés à matériel importé, mais la rotation à la demande l'est : une fois le nouveau matériel importé et en attente de rotation, RotateKeyOnDemand en fait le matériel actuel. L'ID et l'ARN de la clé ne changent pas, et KMS conserve le matériel précédent pour déchiffrer les anciens textes chiffrés."
  options:
    a:
      en: "Automatic key rotation is supported only for symmetric keys whose key material AWS KMS generates, not for imported key material."
      fr: "La rotation automatique n'est prise en charge que pour les clés symétriques dont AWS KMS génère le matériel, pas pour du matériel de clé importé."
    b:
      en: "A new key has a new key ID, which the RDS instances and applications that reference the key ID would not use."
      fr: "Une nouvelle clé possède un nouvel ID de clé, que n'utiliseraient pas les instances RDS ni les applications qui référencent l'ID de clé."
    d:
      en: "When imported key material expires, AWS KMS deletes it, so data encrypted under it can no longer be decrypted; AWS KMS does not generate replacement material."
      fr: "Lorsque le matériel de clé importé expire, AWS KMS le supprime : les données chiffrées avec ce matériel ne peuvent plus être déchiffrées ; AWS KMS ne génère pas de matériel de remplacement."
references:
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
  - title: Perform on-demand key rotation
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotating-keys-on-demand.html
