id: sapc03-2d-wa-custom-lens
objective: "2.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's risk office maintains an internal cloud risk assessment of 40 questions about data classification, third-party dependencies, generative AI usage and recovery commitments. Today, each of the 150 workload owners fills in a spreadsheet every year, and the risk office consolidates the answers by hand. The company already reviews its workloads with the AWS Well-Architected Framework lens in the AWS Well-Architected Tool. The risk office wants its own questions, answer choices and risk ratings to be answered in the same tool next to the Security pillar review, with improvement plans and milestones per workload. Workload owners work in many accounts of the company's organization in AWS Organizations. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Le service des risques d'AnyCompany tient une évaluation interne des risques cloud de 40 questions sur la classification des données, les dépendances tierces, l'usage de l'IA générative et les engagements de reprise. Aujourd'hui, chacun des 150 responsables de charge de travail remplit un tableur chaque année, et le service des risques consolide les réponses à la main. L'entreprise revoit déjà ses charges de travail avec l'objectif AWS Well-Architected Framework dans AWS Well-Architected Tool. Le service des risques veut que ses propres questions, choix de réponse et niveaux de risque soient renseignés dans le même outil à côté de la revue du pilier Sécurité, avec des plans d'amélioration et des jalons par charge de travail. Les responsables travaillent dans de nombreux comptes de l'organisation AWS Organizations de l'entreprise. La solution doit avoir le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Ask each workload owner to add the 40 questions as notes on the Security pillar questions of the Well-Architected Framework lens, and have the risk office read the notes in each workload report.", fr: "Demander à chaque responsable d'ajouter les 40 questions comme notes sur les questions du pilier Sécurité de l'objectif Well-Architected Framework, et faire lire ces notes par le service des risques dans le rapport de chaque charge de travail." }
    - id: b
      text: { en: "Write an AWS Config custom rule for each question, deploy the rules as an organization conformance pack, and use the conformance pack compliance score as the risk rating of each workload.", fr: "Écrire une règle personnalisée AWS Config pour chaque question, déployer les règles comme pack de conformité d'organisation et utiliser le score de conformité du pack comme niveau de risque de chaque charge de travail." }
    - id: c
      text: { en: "Build a questionnaire application on AWS Lambda and Amazon DynamoDB behind Amazon API Gateway, and give the risk office an Amazon Quick dashboard of the answers and risk ratings.", fr: "Construire une application de questionnaire sur AWS Lambda et Amazon DynamoDB derrière Amazon API Gateway, et donner au service des risques un tableau de bord Amazon Quick des réponses et niveaux de risque." }
    - id: d
      text: { en: "Create a custom lens in the AWS Well-Architected Tool with the 40 questions, their choices and risk rules, publish it, share it with the organization, and have owners apply it to their workloads.", fr: "Créer un objectif personnalisé dans AWS Well-Architected Tool avec les 40 questions, leurs choix et leurs règles de risque, le publier, le partager avec l'organisation et faire appliquer cet objectif par les responsables à leurs charges de travail." }
answer: { optionId: d }
explanation:
  correct:
    en: "A custom lens defines its own pillars, questions, choices, best practices and improvement plan, and is applied to a workload like an AWS-provided lens, with milestones and reports. A custom lens can be shared with accounts, organizational units or the whole organization once AWS Organizations access is enabled, so every owner answers the same questionnaire in the tool they already use."
    fr: "Un objectif personnalisé définit ses propres piliers, questions, choix, bonnes pratiques et plan d'amélioration, et s'applique à une charge de travail comme un objectif fourni par AWS, avec jalons et rapports. Il peut être partagé avec des comptes, des unités d'organisation ou toute l'organisation une fois l'accès AWS Organizations activé : chaque responsable répond au même questionnaire dans l'outil qu'il utilise déjà."
  options:
    a:
      en: "Notes are free text: they carry no answer choices, no risk rating and no improvement plan, so the risk office would still consolidate the answers by hand."
      fr: "Les notes sont du texte libre : elles n'ont ni choix de réponse, ni niveau de risque, ni plan d'amélioration, et le service des risques devrait toujours consolider les réponses à la main."
    b:
      en: "Config rules evaluate resource configurations; questions about third-party dependencies or recovery commitments are process answers that no rule can evaluate, and each custom rule is code to maintain."
      fr: "Les règles Config évaluent des configurations de ressources ; des questions sur les dépendances tierces ou les engagements de reprise appellent des réponses de processus qu'aucune règle ne peut évaluer, et chaque règle personnalisée est du code à maintenir."
    c:
      en: "A custom application works but must be built, secured and maintained, and it sits outside the tool where the Security pillar reviews are done, which is not the least operational overhead."
      fr: "Une application personnalisée fonctionne mais doit être construite, sécurisée et maintenue, et elle reste en dehors de l'outil où se font les revues du pilier Sécurité : ce n'est pas la solution la moins coûteuse en exploitation."
references:
  - title: Custom lenses for workloads in AWS WA Tool
    url: https://docs.aws.amazon.com/wellarchitected/latest/userguide/lenses-custom.html
  - title: Sharing a custom lens in AWS WA Tool
