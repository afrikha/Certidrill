id: sapc03-2b-tenant-ous-registration-limit
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany, a SaaS provider, isolates each enterprise tenant in its own AWS account. All tenant accounts are governed by AWS Control Tower and receive the same controls. The company has 700 tenant accounts in a single Tenants OU today and expects to reach 2,500 within 18 months. After each landing zone update, the platform team re-registers the OUs so that every account is updated. The account quota of the organization has already been raised.

    Which OU design will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany, un fournisseur SaaS, isole chaque client entreprise dans son propre compte AWS. Tous les comptes clients sont gouvernés par AWS Control Tower et reçoivent les mêmes contrôles. L'entreprise compte aujourd'hui 700 comptes clients dans une seule OU Tenants et prévoit d'atteindre 2 500 d'ici 18 mois. Après chaque mise à jour de la zone d'atterrissage, l'équipe plateforme réenregistre les OU afin que chaque compte soit mis à jour. Le quota de comptes de l'organisation a déjà été relevé.

    Quelle conception d'OU répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create a parent Tenants OU with child OUs that each hold fewer than 1,000 tenant accounts, enable the same controls on every child OU, and fill the child OUs in turn.", fr: "Créer une OU parente Tenants avec des OU enfants contenant chacune moins de 1 000 comptes clients, activer les mêmes contrôles sur chaque OU enfant, et remplir les OU enfants à tour de rôle." } }
    - { id: b, text: { en: "Keep a single Tenants OU for all tenant accounts, and continue to re-register it after each landing zone update as the number of tenant accounts grows.", fr: "Conserver une seule OU Tenants pour tous les comptes clients, et continuer de la réenregistrer après chaque mise à jour de la zone d'atterrissage à mesure que le nombre de comptes clients augmente." } }
    - { id: c, text: { en: "Create a separate organization with its own Control Tower landing zone for every 500 tenants, and compare the costs of the organizations in Cost Explorer.", fr: "Créer une organisation distincte avec sa propre zone d'atterrissage Control Tower pour chaque tranche de 500 clients, et comparer les coûts des organisations dans Cost Explorer." } }
    - { id: d, text: { en: "Move the tenants into a few shared accounts with one VPC per tenant so that the number of accounts stays below the OU registration limit.", fr: "Regrouper les clients dans quelques comptes partagés avec un VPC par client afin que le nombre de comptes reste sous la limite d'enregistrement des OU." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Control Tower can register an OU only if it contains up to 1,000 accounts; an OU with more accounts cannot be registered. Splitting the tenants into child OUs below that limit keeps every OU registrable, and enabling the same controls on each child OU keeps one governance model in one landing zone."
    fr: "Control Tower ne peut enregistrer une OU que si elle contient jusqu'à 1 000 comptes ; une OU qui en contient davantage ne peut pas être enregistrée. Répartir les clients dans des OU enfants sous cette limite garde chaque OU enregistrable, et activer les mêmes contrôles sur chaque OU enfant conserve un seul modèle de gouvernance dans une seule zone d'atterrissage."
  options:
    b:
      en: "Once the OU holds more than 1,000 accounts, it can no longer be registered or re-registered."
      fr: "Dès que l'OU contient plus de 1 000 comptes, elle ne peut plus être enregistrée ni réenregistrée."
    c:
      en: "Several organizations and landing zones multiply management accounts, controls, and updates, which is far more overhead."
      fr: "Plusieurs organisations et zones d'atterrissage multiplient les comptes de gestion, les contrôles et les mises à jour, ce qui représente bien plus de charge."
    d:
      en: "Shared accounts remove the account-level isolation of tenants that the company requires."
      fr: "Des comptes partagés suppriment l'isolation des clients au niveau du compte, que l'entreprise exige."
references:
  - title: Register an existing organizational unit with AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/importing-existing.html
