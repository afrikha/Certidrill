id: sapc03-2c-outposts-local-snapshots
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A hospital group operates in a country that has no AWS Region. A national health data law requires that patient data, including all backups of that data, physically remain inside the country. The hospital group wants to run its clinical applications on Amazon EC2 instances with Amazon EBS volumes and to manage them with the same AWS APIs and tools that it uses elsewhere. The nearest AWS Region is in a neighboring country and can be used for management. Daily backups of the EBS volumes are required.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un groupe hospitalier exerce dans un pays où il n'existe aucune Région AWS. Une loi nationale sur les données de santé exige que les données des patients, y compris toutes leurs sauvegardes, restent physiquement dans le pays. Le groupe hospitalier veut exécuter ses applications cliniques sur des instances Amazon EC2 avec des volumes Amazon EBS et les gérer avec les mêmes API et outils AWS qu'ailleurs. La Région AWS la plus proche se trouve dans un pays voisin et peut être utilisée pour la gestion. Des sauvegardes quotidiennes des volumes EBS sont requises.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Deploy the applications in the nearest AWS Region, and encrypt the EBS volumes and snapshots with AWS KMS customer managed keys that only the hospital group can use."
        fr: "Déployer les applications dans la Région AWS la plus proche, et chiffrer les volumes EBS et les instantanés avec des clés gérées par le client AWS KMS que seul le groupe hospitalier peut utiliser."
    - id: b
      text:
        en: "Install AWS Outposts racks provisioned with S3 on Outposts in a data center inside the country, and run the EC2 instances and EBS volumes on the Outpost."
        fr: "Installer des racks AWS Outposts dotés de S3 on Outposts dans un centre de données situé dans le pays, et exécuter les instances EC2 et les volumes EBS sur l'Outpost."
    - id: c
      text:
        en: "Create daily EBS snapshots of the Outpost volumes with an Amazon Data Lifecycle Manager policy that uses the default snapshot location in the parent Region."
        fr: "Créer des instantanés EBS quotidiens des volumes de l'Outpost avec une politique Amazon Data Lifecycle Manager qui utilise l'emplacement d'instantanés par défaut dans la Région parente."
    - id: d
      text:
        en: "Create daily EBS local snapshots on the Outpost with Data Lifecycle Manager, and deny snapshots of Outpost volumes that are not stored on the Outpost with an IAM policy."
        fr: "Créer des instantanés EBS locaux quotidiens sur l'Outpost avec Data Lifecycle Manager, et refuser par une politique IAM les instantanés de volumes de l'Outpost qui ne sont pas stockés sur l'Outpost."
    - id: e
      text:
        en: "Back up the EBS volumes with AWS Backup, and copy the recovery points to a backup vault in a second AWS Region for disaster recovery."
        fr: "Sauvegarder les volumes EBS avec AWS Backup, et copier les points de récupération dans un coffre de sauvegarde d'une deuxième Région AWS pour la reprise après sinistre."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Outposts run EC2 instances and EBS volumes on premises with the same AWS APIs, managed from the parent Region. By default, snapshots of Outpost volumes are stored in Amazon S3 in the parent Region, but EBS local snapshots store the snapshot data in S3 on Outposts, on premises. Data Lifecycle Manager can automate them, and an IAM policy that denies snapshots of Outpost volumes without an Outpost ARN enforces the residency. Only snapshot metadata is kept in the parent Region."
    fr: "Les Outposts exécutent des instances EC2 et des volumes EBS sur site avec les mêmes API AWS, gérés depuis la Région parente. Par défaut, les instantanés des volumes d'un Outpost sont stockés dans Amazon S3 dans la Région parente, mais les instantanés EBS locaux stockent les données d'instantané dans S3 on Outposts, sur site. Data Lifecycle Manager peut les automatiser, et une politique IAM qui refuse les instantanés de volumes de l'Outpost sans ARN d'Outpost impose la résidence. Seules les métadonnées des instantanés sont conservées dans la Région parente."
  options:
    a:
      en: "Encryption does not change where the data is physically stored: the volumes and snapshots would be in the neighboring country."
      fr: "Le chiffrement ne change pas l'emplacement physique des données : les volumes et les instantanés se trouveraient dans le pays voisin."
    c:
      en: "The default location stores snapshot data in Amazon S3 in the parent Region, outside the country."
      fr: "L'emplacement par défaut stocke les données d'instantané dans Amazon S3 dans la Région parente, hors du pays."
    e:
      en: "Copying recovery points to another AWS Region moves patient data backups out of the country."
      fr: "Copier les points de récupération dans une autre Région AWS fait sortir les sauvegardes des données des patients du pays."
references:
  - title: Amazon EBS local snapshots on Outposts
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshots-outposts.html
