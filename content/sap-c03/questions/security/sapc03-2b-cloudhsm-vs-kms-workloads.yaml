id: sapc03-2b-cloudhsm-vs-kms-workloads
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is reviewing five planned workloads before a regulatory audit. The security architects want to use AWS KMS with AWS managed HSMs wherever possible, because it integrates with AWS services and scales without HSM operations. They will use AWS CloudHSM only where a workload needs a capability that AWS KMS does not provide.

    Which workloads require AWS CloudHSM? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany examine cinq charges de travail prévues avant un audit réglementaire. Les architectes sécurité veulent utiliser AWS KMS, avec ses HSM gérés par AWS, partout où c'est possible, car il s'intègre aux services AWS et évolue sans exploitation de HSM. Ils n'utiliseront AWS CloudHSM que lorsqu'une charge de travail a besoin d'une fonctionnalité qu'AWS KMS ne fournit pas.

    Quelles charges de travail nécessitent AWS CloudHSM ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A web server fleet that must offload part of its TLS handshake processing to HSMs that hold the private keys of its server certificates.", fr: "Une flotte de serveurs web qui doit décharger une partie du traitement de ses négociations TLS sur des HSM contenant les clés privées de ses certificats de serveur." } }
    - { id: b, text: { en: "Amazon EBS volumes and Amazon RDS databases that must be encrypted with customer managed keys that rotate automatically every year.", fr: "Des volumes Amazon EBS et des bases Amazon RDS qui doivent être chiffrés avec des clés gérées par le client à rotation automatique annuelle." } }
    - { id: c, text: { en: "An Amazon S3 data lake that must use SSE-KMS with customer managed keys whose every use is recorded in AWS CloudTrail.", fr: "Un lac de données Amazon S3 qui doit utiliser SSE-KMS avec des clés gérées par le client dont chaque utilisation est enregistrée dans AWS CloudTrail." } }
    - { id: d, text: { en: "A Microsoft Active Directory Certificate Services issuing CA that must keep its signing key in an HSM through the CNG and KSP providers.", fr: "Une CA émettrice Microsoft Active Directory Certificate Services qui doit conserver sa clé de signature dans un HSM via les fournisseurs CNG et KSP." } }
    - { id: e, text: { en: "Amazon DynamoDB global tables that must be encrypted with multi-Region customer managed keys in three Regions.", fr: "Des tables globales Amazon DynamoDB qui doivent être chiffrées avec des clés multi-Régions gérées par le client dans trois Régions." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "SSL/TLS offload and protecting the private key of an issuing CA are CloudHSM use cases: the web servers or the CA software call the HSMs directly through standard interfaces such as PKCS #11, JCE, or CNG and KSP. AWS KMS does not expose these interfaces or let the application use keys in its own HSM sessions."
    fr: "Le déchargement SSL/TLS et la protection de la clé privée d'une CA émettrice sont des cas d'usage de CloudHSM : les serveurs web ou le logiciel de CA appellent directement les HSM via des interfaces standard comme PKCS #11, JCE, ou CNG et KSP. AWS KMS n'expose pas ces interfaces et ne permet pas à l'application d'utiliser des clés dans ses propres sessions HSM."
  options:
    b:
      en: "Customer managed KMS keys support automatic rotation and integrate natively with EBS and RDS, so AWS KMS meets this need."
      fr: "Les clés KMS gérées par le client prennent en charge la rotation automatique et s'intègrent nativement à EBS et RDS : AWS KMS répond à ce besoin."
    c:
      en: "SSE-KMS with customer managed keys is a native AWS KMS feature, and AWS KMS records key use in CloudTrail."
      fr: "SSE-KMS avec des clés gérées par le client est une fonctionnalité native d'AWS KMS, et AWS KMS enregistre l'utilisation des clés dans CloudTrail."
    e:
      en: "Multi-Region keys are an AWS KMS feature; they are even unsupported in AWS CloudHSM key stores."
      fr: "Les clés multi-Régions sont une fonctionnalité d'AWS KMS ; elles ne sont d'ailleurs pas prises en charge dans les magasins de clés AWS CloudHSM."
references:
  - title: AWS CloudHSM use cases
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/use-cases.html
  - title: What is AWS CloudHSM?
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html
