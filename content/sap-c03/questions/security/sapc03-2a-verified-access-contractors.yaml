id: sapc03-2a-verified-access-contractors
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany gives 500 contractors access to six internal web applications that run behind internal Application Load Balancers. Today, contractors connect through AWS Client VPN and then reach every application in the VPC. The security team wants to remove the VPN. Each request must be evaluated against the contractor's group membership in the organization instance of AWS IAM Identity Center and against the device posture reported by CrowdStrike, and every access attempt must be logged.

    Which solution will meet these requirements?
  fr: |
    AnyCompany donne à 500 prestataires l'accès à six applications web internes qui s'exécutent derrière des Application Load Balancers internes. Aujourd'hui, les prestataires se connectent via AWS Client VPN puis atteignent toutes les applications du VPC. L'équipe de sécurité veut supprimer le VPN. Chaque requête doit être évaluée selon l'appartenance du prestataire à des groupes dans l'instance d'organisation d'AWS IAM Identity Center et selon la posture de l'appareil signalée par CrowdStrike, et chaque tentative d'accès doit être journalisée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Keep AWS Client VPN with SAML authentication through IAM Identity Center, and add authorization rules that limit each group to the CIDR range of its applications."
        fr: "Conserver AWS Client VPN avec l'authentification SAML via IAM Identity Center, et ajouter des règles d'autorisation qui limitent chaque groupe à la plage CIDR de ses applications."
    - id: b
      text:
        en: "Make the load balancers internet-facing, and add an authenticate-oidc action to their listeners that uses IAM Identity Center as the OIDC identity provider."
        fr: "Rendre les équilibreurs de charge accessibles depuis Internet, et ajouter à leurs écouteurs une action authenticate-oidc qui utilise IAM Identity Center comme fournisseur d'identité OIDC."
    - id: c
      text:
        en: "Create an AWS Verified Access instance with IAM Identity Center and CrowdStrike trust providers, and add load balancer endpoints with policies on group and device posture."
        fr: "Créer une instance AWS Verified Access avec des fournisseurs de confiance IAM Identity Center et CrowdStrike, et ajouter des points de terminaison d'équilibreur de charge avec des politiques sur le groupe et la posture de l'appareil."
    - id: d
      text:
        en: "Create an AWS PrivateLink endpoint service for each load balancer, and have the contractors connect from their laptops to interface endpoints of these services."
        fr: "Créer un service de point de terminaison AWS PrivateLink pour chaque équilibreur de charge, et faire connecter les prestataires depuis leurs ordinateurs portables à des points de terminaison d'interface de ces services."
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Verified Access gives access to applications without a VPN and evaluates each request against user identity and device trust data. IAM Identity Center (organization instance) can be the user-identity trust provider and CrowdStrike a device trust provider, load balancer endpoints represent the applications, and all access attempts are logged."
    fr: "AWS Verified Access donne accès aux applications sans VPN et évalue chaque requête selon les données d'identité de l'utilisateur et de confiance de l'appareil. IAM Identity Center (instance d'organisation) peut être le fournisseur de confiance d'identité utilisateur et CrowdStrike un fournisseur de confiance d'appareil, des points de terminaison d'équilibreur de charge représentent les applications, et toutes les tentatives d'accès sont journalisées."
  options:
    a:
      en: "Client VPN keeps the VPN that the team wants to remove and does not evaluate CrowdStrike device posture on each request."
      fr: "Client VPN conserve le VPN que l'équipe veut supprimer et n'évalue pas la posture d'appareil CrowdStrike à chaque requête."
    b:
      en: "The ALB authentication action checks the user's identity only, cannot use device posture, and exposes internal applications to the internet."
      fr: "L'action d'authentification de l'ALB ne vérifie que l'identité de l'utilisateur, ne peut pas utiliser la posture de l'appareil, et expose des applications internes à Internet."
    d:
      en: "Interface endpoints are created in VPCs, not on laptops, and PrivateLink evaluates neither user identity nor device posture."
      fr: "Les points de terminaison d'interface se créent dans des VPC, pas sur des ordinateurs portables, et PrivateLink n'évalue ni l'identité de l'utilisateur ni la posture de l'appareil."
references:
  - title: What is AWS Verified Access?
    url: https://docs.aws.amazon.com/verified-access/latest/ug/what-is-verified-access.html
  - title: User-identity trust providers for Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/user-trust.html
