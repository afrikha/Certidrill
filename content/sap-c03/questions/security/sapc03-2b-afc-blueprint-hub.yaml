id: sapc03-2b-afc-blueprint-hub
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany governs 90 accounts with AWS Control Tower. Each new workload account must start with a standard VPC, a set of IAM roles, and an AWS Backup plan that the platform team defines as AWS CloudFormation templates. Requesters choose the account type when they create the account in the Control Tower console. The platform team also wants to apply the same baseline to 20 existing enrolled accounts. The team has no Terraform skills, wants the LEAST operational overhead, and follows the AWS recommendation not to use the management account to store customization artifacts.

    Which solution will meet these requirements?
  fr: |
    AnyCompany gouverne 90 comptes avec AWS Control Tower. Chaque nouveau compte de charge de travail doit démarrer avec un VPC standard, un ensemble de rôles IAM et un plan AWS Backup que l'équipe plateforme définit sous forme de modèles AWS CloudFormation. Les demandeurs choisissent le type de compte lorsqu'ils créent le compte dans la console Control Tower. L'équipe plateforme veut aussi appliquer la même base à 20 comptes inscrits existants. L'équipe n'a pas de compétences Terraform, veut le MOINS de charge opérationnelle, et suit la recommandation d'AWS de ne pas utiliser le compte de gestion pour stocker les artefacts de personnalisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use Account Factory Customization with the templates published as AWS Service Catalog blueprint products in a dedicated hub account, and apply them to existing accounts with Update account.", fr: "Utiliser Account Factory Customization avec les modèles publiés comme produits de plan (blueprint) AWS Service Catalog dans un compte hub dédié, et les appliquer aux comptes existants avec Update account." } }
    - { id: b, text: { en: "Use Account Factory Customization with the templates published as AWS Service Catalog blueprint products in the management account, and apply them to new accounts only.", fr: "Utiliser Account Factory Customization avec les modèles publiés comme produits de plan AWS Service Catalog dans le compte de gestion, et ne les appliquer qu'aux nouveaux comptes." } }
    - { id: c, text: { en: "Deploy Account Factory for Terraform in a new AFT management account, and convert the CloudFormation templates into Terraform account customizations.", fr: "Déployer Account Factory for Terraform dans un nouveau compte de gestion AFT, et convertir les modèles CloudFormation en personnalisations de compte Terraform." } }
    - { id: d, text: { en: "Write an AWS Lambda function that runs on Control Tower lifecycle events, assumes the AWSControlTowerExecution role in new accounts, and deploys the templates through the CloudFormation API.", fr: "Écrire une fonction AWS Lambda qui s'exécute sur les événements de cycle de vie de Control Tower, endosse le rôle AWSControlTowerExecution dans les nouveaux comptes, et déploie les modèles via l'API CloudFormation." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Account Factory Customization (AFC) provisions accounts from blueprints defined as CloudFormation templates and stored as Service Catalog products in a hub account. AWS strongly recommends not using the management account as the hub, and existing accounts receive a blueprint through the Update account steps in the console."
    fr: "Account Factory Customization (AFC) provisionne les comptes à partir de plans définis comme modèles CloudFormation et stockés sous forme de produits Service Catalog dans un compte hub. AWS recommande fortement de ne pas utiliser le compte de gestion comme hub, et les comptes existants reçoivent un plan via les étapes Update account de la console."
  options:
    b:
      en: "The management account is the hub that AWS strongly advises against, and limiting the blueprints to new accounts leaves the 20 existing accounts without the baseline."
      fr: "Le compte de gestion est le hub qu'AWS déconseille fortement, et limiter les plans aux nouveaux comptes laisse les 20 comptes existants sans la base."
    c:
      en: "AFT is a Terraform pipeline; it requires Terraform skills and rewriting the templates, which adds overhead."
      fr: "AFT est un pipeline Terraform ; il exige des compétences Terraform et la réécriture des modèles, ce qui ajoute de la charge."
    d:
      en: "A custom Lambda solution must be built and maintained, and it does not let requesters choose a blueprint in the Control Tower console."
      fr: "Une solution Lambda personnalisée doit être construite et maintenue, et elle ne permet pas aux demandeurs de choisir un plan dans la console Control Tower."
references:
  - title: Customize accounts with Account Factory Customization (AFC)
    url: https://docs.aws.amazon.com/controltower/latest/userguide/af-customization-page.html
