id: sapc03-2b-aft-provisioning-cmdb
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's platform team manages infrastructure with Terraform and GitHub, and its accounts are governed by an AWS Control Tower landing zone. Account requests must be submitted as pull requests and applied by a pipeline. For every new account, before any baseline resources are deployed, the pipeline must register the account in the company's on-premises CMDB through an API call and wait for an approval status. After that step, a Terraform baseline must be applied to all accounts, and additional resources must be applied to some accounts.

    Which solution will meet these requirements?
  fr: |
    L'équipe plateforme d'AnyCompany gère l'infrastructure avec Terraform et GitHub, et ses comptes sont gouvernés par une zone d'atterrissage AWS Control Tower. Les demandes de compte doivent être soumises sous forme de pull requests et appliquées par un pipeline. Pour chaque nouveau compte, avant tout déploiement de ressources de base, le pipeline doit enregistrer le compte dans la CMDB sur site de l'entreprise par un appel d'API et attendre un statut d'approbation. Après cette étape, une base Terraform doit être appliquée à tous les comptes, et des ressources supplémentaires à certains comptes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use the Account Factory console for account requests, and run an AWS Lambda function on the CreateManagedAccount lifecycle event that calls the CMDB and applies the Terraform baseline.", fr: "Utiliser la console Account Factory pour les demandes de compte, et exécuter sur l'événement de cycle de vie CreateManagedAccount une fonction AWS Lambda qui appelle la CMDB et applique la base Terraform." } }
    - { id: b, text: { en: "Use Account Factory Customization with Terraform blueprints, and add the CMDB API call as a Terraform resource at the start of each blueprint.", fr: "Utiliser Account Factory Customization avec des plans Terraform, et ajouter l'appel d'API à la CMDB comme ressource Terraform au début de chaque plan." } }
    - { id: c, text: { en: "Use AWS CloudFormation StackSets with automatic deployment to the OUs, and add a custom resource that calls the CMDB before the baseline stacks are created.", fr: "Utiliser AWS CloudFormation StackSets avec déploiement automatique sur les OU, et ajouter une ressource personnalisée qui appelle la CMDB avant la création des piles de base." } }
    - { id: d, text: { en: "Deploy Account Factory for Terraform with GitHub through AWS CodeConnections, implement the CMDB call as an account provisioning customization, and use global and account customizations for the baseline.", fr: "Déployer Account Factory for Terraform avec GitHub via AWS CodeConnections, mettre en œuvre l'appel à la CMDB comme personnalisation du provisionnement des comptes, et utiliser des personnalisations globales et par compte pour la base." } }
answer: { optionId: d }
explanation:
  correct:
    en: "AFT provisions and customizes Control Tower accounts from account request files in a Git repository, supports GitHub through AWS CodeConnections, and works with Terraform. Its account provisioning customizations call a Step Functions state machine that you define, which runs on every new account before the global customization stage, so the CMDB step can complete before the baselines."
    fr: "AFT provisionne et personnalise des comptes Control Tower à partir de fichiers de demande de compte dans un dépôt Git, prend en charge GitHub via AWS CodeConnections et fonctionne avec Terraform. Ses personnalisations du provisionnement des comptes appellent une machine à états Step Functions que vous définissez, exécutée pour chaque nouveau compte avant l'étape de personnalisation globale : l'étape CMDB peut donc se terminer avant les bases."
  options:
    a:
      en: "Console requests do not follow the pull request workflow, and a custom Lambda function would have to run and track Terraform itself."
      fr: "Les demandes par la console ne suivent pas le processus de pull requests, et une fonction Lambda personnalisée devrait exécuter et suivre Terraform elle-même."
    b:
      en: "AFC blueprints are requested through Account Factory, not through pull requests, and one blueprint per account cannot express a baseline for all accounts plus extras for some."
      fr: "Les plans AFC se demandent via Account Factory, pas via des pull requests, et un seul plan par compte ne permet pas d'exprimer une base pour tous les comptes plus des ajouts pour certains."
    c:
      en: "StackSets deploy CloudFormation stacks into existing accounts; they do not create accounts from pull requests or run Terraform."
      fr: "StackSets déploie des piles CloudFormation dans des comptes existants ; il ne crée pas de comptes à partir de pull requests et n'exécute pas Terraform."
references:
  - title: Overview of AWS Control Tower Account Factory for Terraform (AFT)
    url: https://docs.aws.amazon.com/controltower/latest/userguide/aft-overview.html
  - title: AFT account provisioning pipeline
    url: https://docs.aws.amazon.com/controltower/latest/userguide/aft-provisioning-framework.html
