id: sapc03-2c-macie-asdd-org
objective: "2.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 70 accounts in AWS Organizations and stores data in more than 2,000 Amazon S3 general purpose buckets. The data governance team does not know which buckets contain personal data. The team needs a continuously updated, organization-wide view of which buckets are likely to contain sensitive data, with a visual comparison of data sensitivity across accounts and buckets. The team does not want to define and schedule analysis jobs for individual buckets, and buckets that store AWS logs must be excluded. The solution must be cost-effective and have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 70 comptes dans AWS Organizations et stocke des données dans plus de 2 000 compartiments Amazon S3 à usage général. L'équipe de gouvernance des données ne sait pas quels compartiments contiennent des données personnelles. L'équipe a besoin d'une vue à l'échelle de l'organisation, mise à jour en continu, des compartiments susceptibles de contenir des données sensibles, avec une comparaison visuelle de la sensibilité des données entre les comptes et les compartiments. L'équipe ne veut pas définir ni planifier de tâches d'analyse pour chaque compartiment, et les compartiments qui stockent des journaux AWS doivent être exclus. La solution doit être rentable et présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In each account, run a daily Amazon Macie sensitive data discovery job that analyzes every object in every bucket, and export the findings to a central bucket."
        fr: "Dans chaque compte, exécuter chaque jour une tâche de découverte de données sensibles Amazon Macie qui analyse tous les objets de tous les compartiments, et exporter les résultats vers un compartiment central."
    - id: b
      text:
        en: "Designate a GuardDuty delegated administrator, enable S3 Protection for all member accounts, and use the findings to identify the buckets that contain personal data."
        fr: "Désigner un administrateur délégué GuardDuty, activer S3 Protection pour tous les comptes membres, et utiliser les résultats pour identifier les compartiments contenant des données personnelles."
    - id: c
      text:
        en: "Designate a Macie delegated administrator, enable Macie for all member accounts, and turn on automated sensitive data discovery with the log buckets excluded."
        fr: "Désigner un administrateur délégué Macie, activer Macie pour tous les comptes membres, et activer la découverte automatisée des données sensibles en excluant les compartiments de journaux."
    - id: d
      text:
        en: "Turn on S3 Inventory for every bucket, and use Amazon Athena queries on the inventory reports to find objects whose key names suggest personal data."
        fr: "Activer S3 Inventory pour chaque compartiment, et utiliser des requêtes Amazon Athena sur les rapports d'inventaire pour trouver les objets dont les noms de clé suggèrent des données personnelles."
answer: { optionId: c }
explanation:
  correct:
    en: "Automated sensitive data discovery continually evaluates the S3 bucket inventory and analyzes representative samples of objects, so it gives broad coverage without per-bucket jobs and at lower cost than full analysis. For an organization, the Macie administrator's scope includes member accounts' buckets, buckets such as log buckets can be excluded, and the console heat map shows data sensitivity across accounts and buckets."
    fr: "La découverte automatisée des données sensibles évalue en continu l'inventaire des compartiments S3 et analyse des échantillons représentatifs d'objets : elle offre une large couverture sans tâche par compartiment et à un coût inférieur à une analyse complète. Pour une organisation, l'étendue de l'administrateur Macie inclut les compartiments des comptes membres, certains compartiments comme ceux de journaux peuvent être exclus, et la carte thermique de la console montre la sensibilité des données entre les comptes et les compartiments."
  options:
    a:
      en: "Daily jobs that analyze every object in 2,000 buckets are expensive, must be managed in each account, and do not give the cross-account sensitivity view."
      fr: "Des tâches quotidiennes qui analysent tous les objets de 2 000 compartiments sont coûteuses, doivent être gérées dans chaque compte et n'offrent pas la vue de sensibilité entre comptes."
    b:
      en: "GuardDuty S3 Protection detects suspicious access activity on buckets; it does not inspect object contents for sensitive data."
      fr: "GuardDuty S3 Protection détecte les activités d'accès suspectes sur les compartiments ; il n'inspecte pas le contenu des objets à la recherche de données sensibles."
    d:
      en: "Inventory reports list object metadata, not object contents, so key names cannot reliably show where personal data is stored."
      fr: "Les rapports d'inventaire listent les métadonnées des objets, pas leur contenu : les noms de clé ne permettent pas de savoir de manière fiable où se trouvent les données personnelles."
references:
  - title: Performing automated sensitive data discovery
    url: https://docs.aws.amazon.com/macie/latest/user/discovery-asdd.html
