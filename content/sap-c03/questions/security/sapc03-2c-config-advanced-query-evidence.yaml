id: sapc03-2c-config-advanced-query-evidence
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An insurance company has 180 accounts in AWS Organizations across four AWS Regions. AWS Config records all supported resource types in every account and Region, and an organization aggregator already exists in the audit account. AWS Security Hub CSPM is not enabled. During an audit, the auditor asks, with one day's notice, for a list of all Amazon EBS volumes that are not encrypted and all security groups that allow inbound traffic from 0.0.0.0/0 on port 22, based on the current configuration of every account and Region. The audit team must not receive access to the member accounts, and the company wants the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance possède 180 comptes dans AWS Organizations répartis sur quatre Régions AWS. AWS Config enregistre tous les types de ressources pris en charge dans chaque compte et chaque Région, et un agrégateur d'organisation existe déjà dans le compte d'audit. AWS Security Hub CSPM n'est pas activé. Lors d'un audit, l'auditeur demande, avec un jour de préavis, la liste de tous les volumes Amazon EBS non chiffrés et de tous les groupes de sécurité qui autorisent le trafic entrant depuis 0.0.0.0/0 sur le port 22, d'après la configuration actuelle de chaque compte et de chaque Région. L'équipe d'audit ne doit pas recevoir d'accès aux comptes membres, et l'entreprise veut le MOINS d'efforts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run AWS Config advanced queries against the organization aggregator from the audit account, and export the query results as evidence."
        fr: "Exécuter des requêtes avancées AWS Config sur l'agrégateur d'organisation depuis le compte d'audit, et exporter les résultats des requêtes comme preuve."
    - id: b
      text:
        en: "Write a script that assumes a role in each account and Region, calls the EC2 describe APIs, and merges the results into one report for the auditor."
        fr: "Écrire un script qui assume un rôle dans chaque compte et chaque Région, appelle les API de description EC2 et fusionne les résultats en un rapport unique pour l'auditeur."
    - id: c
      text:
        en: "Enable Security Hub CSPM with the FSBP standard for the organization, and export the failed control findings for EBS encryption and SSH access."
        fr: "Activer Security Hub CSPM avec la norme FSBP pour l'organisation, et exporter les résultats de contrôle en échec pour le chiffrement EBS et l'accès SSH."
    - id: d
      text:
        en: "Search the CloudTrail event history of each account and Region for CreateVolume and AuthorizeSecurityGroupIngress calls that created noncompliant resources."
        fr: "Rechercher dans l'historique des événements CloudTrail de chaque compte et de chaque Région les appels CreateVolume et AuthorizeSecurityGroupIngress qui ont créé des ressources non conformes."
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Config advanced queries use a subset of SQL SELECT on the current configuration of recorded resources, and the same queries can run from a central account against a configuration aggregator to cover multiple accounts and Regions. The existing organization aggregator already collects the data, so the audit team gets the evidence without access to member accounts."
    fr: "Les requêtes avancées AWS Config utilisent un sous-ensemble de SQL SELECT sur la configuration actuelle des ressources enregistrées, et les mêmes requêtes peuvent s'exécuter depuis un compte central sur un agrégateur de configuration pour couvrir plusieurs comptes et Régions. L'agrégateur d'organisation existant collecte déjà les données : l'équipe d'audit obtient la preuve sans accès aux comptes membres."
  options:
    b:
      en: "A cross-account script must be written, tested and given roles in 180 accounts, which is more effort than querying data that the aggregator already holds."
      fr: "Un script entre comptes doit être écrit, testé et doté de rôles dans 180 comptes, ce qui demande plus d'efforts que d'interroger des données que l'agrégateur détient déjà."
    c:
      en: "Enabling a new service across the organization and waiting for control checks to run is more work and takes longer than querying the existing configuration data."
      fr: "Activer un nouveau service dans toute l'organisation et attendre l'exécution des vérifications de contrôle demande plus de travail et de temps que d'interroger les données de configuration existantes."
    d:
      en: "Event history covers only the last 90 days of management events and shows API calls, not the current configuration of resources created earlier or changed later."
      fr: "L'historique des événements ne couvre que les 90 derniers jours d'événements de gestion et montre des appels d'API, pas la configuration actuelle des ressources créées plus tôt ou modifiées ensuite."
references:
  - title: Querying the Current Configuration State of AWS Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/querying-AWS-resources.html
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
