id: sapc03-2a-roles-anywhere-private-ca
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs 60 application servers in a colocation facility. The applications upload files to Amazon S3 by using access keys of IAM users that are stored in configuration files. The security team wants the applications to use temporary credentials that are tied to each server's identity. AnyCompany has no public key infrastructure today and does not want to deploy or operate certificate authority servers itself.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite 60 serveurs d'applications dans un centre de colocation. Les applications chargent des fichiers dans Amazon S3 à l'aide de clés d'accès d'utilisateurs IAM stockées dans des fichiers de configuration. L'équipe de sécurité veut que les applications utilisent des informations d'identification temporaires liées à l'identité de chaque serveur. AnyCompany n'a aujourd'hui aucune infrastructure à clé publique et ne veut pas déployer ni exploiter elle-même de serveurs d'autorité de certification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Move the access keys to AWS Secrets Manager with automatic rotation every 30 days, and have the applications read the keys from Secrets Manager at startup."
        fr: "Déplacer les clés d'accès dans AWS Secrets Manager avec une rotation automatique tous les 30 jours, et faire lire les clés depuis Secrets Manager par les applications au démarrage."
    - id: b
      text:
        en: "Generate a self-signed certificate on each server, register each certificate as an IAM Roles Anywhere trust anchor, and use the certificates to get credentials."
        fr: "Générer un certificat auto-signé sur chaque serveur, enregistrer chaque certificat comme ancre de confiance IAM Roles Anywhere, et utiliser les certificats pour obtenir des informations d'identification."
    - id: c
      text:
        en: "Create an Amazon Cognito identity pool that allows unauthenticated identities, and have each server obtain AWS credentials for the unauthenticated role."
        fr: "Créer un groupe d'identités Amazon Cognito qui autorise les identités non authentifiées, et faire obtenir à chaque serveur des informations d'identification AWS pour le rôle non authentifié."
    - id: d
      text:
        en: "Create a CA in AWS Private CA, register it as an IAM Roles Anywhere trust anchor, issue a certificate to each server, and use the credential helper with a profile and role."
        fr: "Créer une CA dans AWS Private CA, l'enregistrer comme ancre de confiance IAM Roles Anywhere, émettre un certificat pour chaque serveur, et utiliser l'assistant d'informations d'identification avec un profil et un rôle."
answer: { optionId: d }
explanation:
  correct:
    en: "IAM Roles Anywhere exchanges an X.509 certificate that chains to a trust anchor for temporary credentials of an IAM role. AWS Private CA is a managed CA that can be the trust anchor, so the company gets per-server certificates without running its own CA, and the credential helper provides the credentials to the applications."
    fr: "IAM Roles Anywhere échange un certificat X.509 émis par une ancre de confiance contre des informations d'identification temporaires d'un rôle IAM. AWS Private CA est une CA gérée qui peut servir d'ancre de confiance : l'entreprise obtient des certificats par serveur sans exploiter sa propre CA, et l'assistant d'informations d'identification fournit les informations d'identification aux applications."
  options:
    a:
      en: "Rotated access keys are still long-term IAM user credentials, not temporary credentials tied to each server."
      fr: "Des clés d'accès renouvelées restent des informations d'identification à long terme d'utilisateurs IAM, pas des informations temporaires liées à chaque serveur."
    b:
      en: "A trust anchor is meant to be a CA; registering 60 self-signed certificates creates 60 anchors to manage and no central revocation."
      fr: "Une ancre de confiance est destinée à être une CA ; enregistrer 60 certificats auto-signés crée 60 ancres à gérer, sans révocation centrale."
    c:
      en: "Unauthenticated identities are available to any caller and are not tied to a server identity."
      fr: "Les identités non authentifiées sont accessibles à tout appelant et ne sont pas liées à l'identité d'un serveur."
references:
  - title: The IAM Roles Anywhere trust model
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
  - title: Getting started with IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/getting-started.html
