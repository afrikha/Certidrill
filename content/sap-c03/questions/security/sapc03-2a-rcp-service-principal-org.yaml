id: sapc03-2a-rcp-service-principal-org
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 400 member accounts in AWS Organizations with all features enabled. Teams create Amazon S3 buckets that receive data from AWS services such as AWS CloudTrail, AWS Config and VPC Flow Logs, and their bucket policies grant write access to the service principals. An audit found that many of these bucket policies have no aws:SourceAccount or aws:SourceArn condition, so a service could be used to write into the buckets on behalf of resources in other AWS accounts. The security team wants one central preventive control that allows service principals to access member account buckets only on behalf of resources in AnyCompany's organization. The team does not want to edit every bucket policy.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 400 comptes membres dans AWS Organizations avec toutes les fonctionnalités activées. Les équipes créent des compartiments (buckets) Amazon S3 qui reçoivent des données de services AWS comme AWS CloudTrail, AWS Config et VPC Flow Logs, et leurs politiques de compartiment accordent un accès en écriture aux principaux de service. Un audit a montré que beaucoup de ces politiques n'ont pas de condition aws:SourceAccount ni aws:SourceArn : un service pourrait donc être utilisé pour écrire dans les compartiments pour le compte de ressources d'autres comptes AWS. L'équipe de sécurité veut un contrôle préventif central qui n'autorise les principaux de service à accéder aux compartiments des comptes membres que pour le compte de ressources de l'organisation d'AnyCompany. L'équipe ne veut pas modifier chaque politique de compartiment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an SCP to the organization root that denies s3:PutObject when aws:SourceOrgID does not equal AnyCompany's organization ID."
        fr: "Attacher à la racine de l'organisation une SCP qui refuse s3:PutObject lorsque aws:SourceOrgID n'est pas égal à l'ID de l'organisation d'AnyCompany."
    - id: b
      text:
        en: "Deploy an AWS Config rule in every account that flags bucket policies without source conditions, with automatic remediation that adds aws:SourceAccount conditions."
        fr: "Déployer dans chaque compte une règle AWS Config qui signale les politiques de compartiment sans condition de source, avec une correction automatique qui ajoute des conditions aws:SourceAccount."
    - id: c
      text:
        en: "Attach an RCP to the organization root that denies S3 actions when aws:SourceOrgID does not equal the organization ID, only for requests in which aws:SourceAccount is present."
        fr: "Attacher à la racine de l'organisation une RCP qui refuse les actions S3 lorsque aws:SourceOrgID n'est pas égal à l'ID de l'organisation, uniquement pour les requêtes dans lesquelles aws:SourceAccount est présent."
    - id: d
      text:
        en: "Attach a permissions boundary to every IAM role in the member accounts that limits S3 write actions to buckets owned by the organization."
        fr: "Attacher à chaque rôle IAM des comptes membres une limite d'autorisations qui restreint les actions d'écriture S3 aux compartiments appartenant à l'organisation."
answer: { optionId: c }
explanation:
  correct:
    en: "RCPs restrict access to resources of supported services, including Amazon S3, whoever the caller is, so they can apply cross-service confused deputy controls centrally without editing bucket policies. Using aws:SourceOrgID with a check that aws:SourceAccount is present limits the deny to requests made by service principals on behalf of a source resource, and the bucket policies still provide the allow."
    fr: "Les RCP restreignent l'accès aux ressources des services pris en charge, dont Amazon S3, quel que soit l'appelant : elles appliquent donc de manière centrale les contrôles contre le député confus entre services sans modifier les politiques de compartiment. Utiliser aws:SourceOrgID avec une vérification de la présence d'aws:SourceAccount limite le refus aux requêtes faites par des principaux de service pour le compte d'une ressource source, et les politiques de compartiment continuent de fournir l'autorisation."
  options:
    a:
      en: "SCPs limit the IAM principals of member accounts; they do not apply to AWS service principals that write into the buckets."
      fr: "Les SCP limitent les principaux IAM des comptes membres ; elles ne s'appliquent pas aux principaux de service AWS qui écrivent dans les compartiments."
    b:
      en: "A detective rule with remediation edits every bucket policy, which the team wants to avoid, and leaves a window before remediation runs."
      fr: "Une règle de détection avec correction modifie chaque politique de compartiment, ce que l'équipe veut éviter, et laisse une fenêtre avant l'exécution de la correction."
    d:
      en: "Permissions boundaries limit IAM principals in the account, not the service principals that write into the buckets on behalf of other resources."
      fr: "Les limites d'autorisations restreignent les principaux IAM du compte, pas les principaux de service qui écrivent dans les compartiments pour le compte d'autres ressources."
references:
  - title: The confused deputy problem
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
