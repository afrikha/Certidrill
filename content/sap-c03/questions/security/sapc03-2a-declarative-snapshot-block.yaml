id: sapc03-2a-declarative-snapshot-block
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 200 accounts in AWS Organizations, and new accounts are added every month. An audit found several Amazon EBS snapshots that were shared publicly. The security team requires that no EBS snapshot in any current or future account can be public and that snapshots that are already public stop being publicly available at once. Account administrators must not be able to change this setting. Teams must still be able to share snapshots with specific AWS accounts for disaster recovery.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 200 comptes dans AWS Organizations, et de nouveaux comptes sont ajoutés chaque mois. Un audit a trouvé plusieurs instantanés Amazon EBS partagés publiquement. L'équipe de sécurité exige qu'aucun instantané EBS d'un compte actuel ou futur ne puisse être public, et que les instantanés déjà publics cessent immédiatement d'être disponibles publiquement. Les administrateurs de compte ne doivent pas pouvoir modifier ce paramètre. Les équipes doivent toujours pouvoir partager des instantanés avec des comptes AWS précis pour la reprise après sinistre.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an SCP that denies ec2:ModifySnapshotAttribute to all principals in the member accounts, and ask the account owners to make their public snapshots private."
        fr: "Attacher une SCP qui refuse ec2:ModifySnapshotAttribute à tous les principaux des comptes membres, et demander aux propriétaires de compte de rendre privés leurs instantanés publics."
    - id: b
      text:
        en: "Deploy an AWS Config rule that detects public EBS snapshots in every account, with an automatic remediation that removes the public permission."
        fr: "Déployer dans chaque compte une règle AWS Config qui détecte les instantanés EBS publics, avec une correction automatique qui supprime l'autorisation publique."
    - id: c
      text:
        en: "Turn on block public access for EBS snapshots in each account and Region with the block new sharing mode, by using a StackSet that targets the organization root."
        fr: "Activer le blocage de l'accès public des instantanés EBS dans chaque compte et chaque Région avec le mode de blocage des nouveaux partages, à l'aide d'un StackSet qui cible la racine de l'organisation."
    - id: d
      text:
        en: "Attach an EC2 declarative policy to the organization root that sets snapshot block public access to block all sharing."
        fr: "Attacher à la racine de l'organisation une politique déclarative EC2 qui définit le blocage de l'accès public des instantanés sur le blocage de tous les partages."
answer: { optionId: d }
explanation:
  correct:
    en: "An EC2 declarative policy enforces the snapshot block public access setting in the service control plane for every account in scope, including accounts that join later, and account administrators cannot change it. The block all sharing mode also makes snapshots that were already public private, while sharing with specific accounts is not public sharing and keeps working."
    fr: "Une politique déclarative EC2 impose le paramètre de blocage de l'accès public des instantanés dans le plan de contrôle du service pour chaque compte concerné, y compris ceux qui rejoignent l'organisation plus tard, et les administrateurs de compte ne peuvent pas le modifier. Le mode de blocage de tous les partages rend aussi privés les instantanés déjà publics, tandis que le partage avec des comptes précis n'est pas un partage public et continue de fonctionner."
  options:
    a:
      en: "Denying ModifySnapshotAttribute also blocks sharing with specific accounts, and existing public snapshots stay public until owners act."
      fr: "Refuser ModifySnapshotAttribute bloque aussi le partage avec des comptes précis, et les instantanés publics existants restent publics tant que les propriétaires n'agissent pas."
    b:
      en: "A detective rule leaves snapshots public until remediation runs and does not stop administrators from sharing publicly again."
      fr: "Une règle de détection laisse les instantanés publics jusqu'à l'exécution de la correction et n'empêche pas les administrateurs de les partager de nouveau publiquement."
    c:
      en: "The block new sharing mode leaves already-public snapshots public, and an account-level setting can be changed by account administrators."
      fr: "Le mode de blocage des nouveaux partages laisse publics les instantanés déjà publics, et un paramètre au niveau du compte peut être modifié par les administrateurs de compte."
references:
  - title: EC2 policy syntax and examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative_syntax.html
  - title: Declarative policies in AWS Organizations
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_declarative.html
