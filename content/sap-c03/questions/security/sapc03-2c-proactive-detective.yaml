id: sapc03-2c-proactive-detective
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company uses AWS Control Tower to govern 80 accounts in several OUs. Application teams deploy all infrastructure with AWS CloudFormation stacks from their pipelines. The security team has two requirements for Amazon RDS. First, CloudFormation must not provision a new DB instance whose storage is not encrypted at rest. Second, DB instances that were created before the controls are introduced must be evaluated continuously and reported as compliant or noncompliant. The team wants to use managed capabilities and does not want to write or maintain custom code.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une compagnie d'assurance utilise AWS Control Tower pour gouverner 80 comptes répartis dans plusieurs OU. Les équipes applicatives déploient toute leur infrastructure avec des piles AWS CloudFormation depuis leurs pipelines. L'équipe de sécurité a deux exigences pour Amazon RDS. D'une part, CloudFormation ne doit pas provisionner une nouvelle instance de base de données dont le stockage n'est pas chiffré au repos. D'autre part, les instances de base de données créées avant l'introduction des contrôles doivent être évaluées en continu et signalées comme conformes ou non conformes. L'équipe veut utiliser des fonctionnalités gérées et ne veut pas écrire ni maintenir de code personnalisé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Turn on an AWS Config managed rule for RDS storage encryption in proactive evaluation mode in each account so that noncompliant CloudFormation stacks are rejected."
        fr: "Activer une règle gérée AWS Config sur le chiffrement du stockage RDS en mode d'évaluation proactif dans chaque compte afin que les piles CloudFormation non conformes soient rejetées."
    - id: b
      text:
        en: "Enable the AWS Control Tower proactive control for RDS storage encryption on the OUs, so that its CloudFormation hook checks DB instances before they are provisioned."
        fr: "Activer le contrôle proactif AWS Control Tower sur le chiffrement du stockage RDS sur les OU, afin que son hook CloudFormation vérifie les instances de base de données avant leur provisionnement."
    - id: c
      text:
        en: "Create an AWS Security Hub CSPM automation rule that sets the workflow status of RDS encryption findings to SUPPRESSED until the DB instances are fixed."
        fr: "Créer une règle d'automatisation AWS Security Hub CSPM qui définit le statut de flux de travail des résultats de chiffrement RDS sur SUPPRESSED jusqu'à la correction des instances de base de données."
    - id: d
      text:
        en: "Create an organization AWS Config aggregator in the audit account so that it evaluates the encryption of every existing DB instance across all accounts."
        fr: "Créer un agrégateur AWS Config d'organisation dans le compte d'audit afin qu'il évalue le chiffrement de chaque instance de base de données existante dans tous les comptes."
    - id: e
      text:
        en: "Enable the AWS Control Tower detective control for RDS storage encryption on the OUs, so that its AWS Config rule evaluates existing DB instances continuously."
        fr: "Activer le contrôle de détection AWS Control Tower sur le chiffrement du stockage RDS sur les OU, afin que sa règle AWS Config évalue en continu les instances de base de données existantes."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Control Tower proactive controls are implemented as CloudFormation hooks that check resources before they are created or updated through CloudFormation stack operations, which covers the pipelines here. Detective controls are implemented as AWS Config rules that evaluate resources that are already deployed, including DB instances created before the controls. Both are managed controls enabled on OUs, so no custom code is needed."
    fr: "Les contrôles proactifs Control Tower sont mis en œuvre sous forme de hooks CloudFormation qui vérifient les ressources avant leur création ou leur mise à jour par des opérations de pile CloudFormation, ce qui couvre les pipelines du scénario. Les contrôles de détection sont mis en œuvre sous forme de règles AWS Config qui évaluent les ressources déjà déployées, y compris les instances créées avant les contrôles. Les deux sont des contrôles gérés activés sur des OU : aucun code personnalisé n'est nécessaire."
  options:
    a:
      en: "AWS Config proactive evaluation reports whether resource properties would be compliant, but proactive rules neither block deployment nor remediate resources."
      fr: "L'évaluation proactive d'AWS Config indique si les propriétés d'une ressource seraient conformes, mais les règles proactives ne bloquent pas le déploiement et ne corrigent pas les ressources."
    c:
      en: "Suppressing findings hides the problem; it neither evaluates existing DB instances nor stops new unencrypted ones from being provisioned."
      fr: "Supprimer des résultats masque le problème ; cela n'évalue pas les instances existantes et n'empêche pas le provisionnement de nouvelles instances non chiffrées."
    d:
      en: "An aggregator only collects configuration and compliance data that source accounts already record; it does not run any evaluation itself."
      fr: "Un agrégateur collecte seulement les données de configuration et de conformité que les comptes sources enregistrent déjà ; il n'exécute lui-même aucune évaluation."
references:
  - title: Proactive controls
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/proactive-controls.html
  - title: Components of an AWS Config Rule
    url: https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config-rules.html
