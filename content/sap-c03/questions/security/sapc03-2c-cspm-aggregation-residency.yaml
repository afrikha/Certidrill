id: sapc03-2c-cspm-aggregation-residency
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs workloads in eu-west-1, eu-central-1, eu-north-1, and ap-southeast-2. AWS Security Hub CSPM is enabled in all four Regions for all accounts, with a delegated administrator account. The company's data residency policy classifies security findings as regulated data: findings about resources in ap-southeast-2 must stay in Australia, and findings about EU resources must stay in the EU. The security team wants a single view of all EU findings in eu-west-1 and accepts reviewing the Australian findings separately.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute ses charges de travail dans eu-west-1, eu-central-1, eu-north-1 et ap-southeast-2. AWS Security Hub CSPM est activé dans les quatre Régions pour tous les comptes, avec un compte administrateur délégué. La politique de résidence des données de l'entreprise classe les résultats de sécurité comme données réglementées : les résultats concernant les ressources d'ap-southeast-2 doivent rester en Australie, et ceux concernant les ressources de l'UE doivent rester dans l'UE. L'équipe de sécurité veut une vue unique de tous les résultats de l'UE dans eu-west-1 et accepte d'examiner séparément les résultats australiens.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable cross-Region aggregation with eu-west-1 as the home Region and all three other Regions linked, and create an automation rule in eu-west-1 that deletes findings from ap-southeast-2."
        fr: "Activer l'agrégation entre Régions avec eu-west-1 comme Région d'origine et les trois autres Régions liées, et créer dans eu-west-1 une règle d'automatisation qui supprime les résultats d'ap-southeast-2."
    - id: b
      text:
        en: "Enable cross-Region aggregation with ap-southeast-2 as the home Region and the three EU Regions linked, so that findings are reviewed from a single Region."
        fr: "Activer l'agrégation entre Régions avec ap-southeast-2 comme Région d'origine et les trois Régions de l'UE liées, afin que les résultats soient examinés depuis une seule Région."
    - id: c
      text:
        en: "Create an AWS Config aggregator in eu-west-1 that collects data from all four Regions, and disable Security Hub CSPM in ap-southeast-2."
        fr: "Créer dans eu-west-1 un agrégateur AWS Config qui collecte les données des quatre Régions, et désactiver Security Hub CSPM dans ap-southeast-2."
    - id: d
      text:
        en: "Enable cross-Region aggregation with eu-west-1 as the home Region and only eu-central-1 and eu-north-1 linked, and review ap-southeast-2 findings in that Region."
        fr: "Activer l'agrégation entre Régions avec eu-west-1 comme Région d'origine et seulement eu-central-1 et eu-north-1 liées, et examiner les résultats d'ap-southeast-2 dans cette Région."
answer: { optionId: d }
explanation:
  correct:
    en: "Cross-Region aggregation replicates findings, insights, control compliance statuses and security scores from linked Regions to the home Region. Linking only the EU Regions to eu-west-1 gives the single EU view, and leaving ap-southeast-2 unlinked means no data from it is replicated, so its findings stay in Australia and are reviewed there."
    fr: "L'agrégation entre Régions réplique les résultats, les analyses, les statuts de conformité des contrôles et les scores de sécurité des Régions liées vers la Région d'origine. Lier uniquement les Régions de l'UE à eu-west-1 offre la vue unique de l'UE, et laisser ap-southeast-2 non liée signifie qu'aucune de ses données n'est répliquée : ses résultats restent en Australie et y sont examinés."
  options:
    a:
      en: "Linking ap-southeast-2 replicates its findings to eu-west-1, and automation rules can only update finding fields, not delete findings."
      fr: "Lier ap-southeast-2 réplique ses résultats vers eu-west-1, et les règles d'automatisation peuvent seulement mettre à jour des champs des résultats, pas supprimer des résultats."
    b:
      en: "Aggregating into ap-southeast-2 copies all EU findings to Australia, which violates the EU part of the policy."
      fr: "Agréger dans ap-southeast-2 copie tous les résultats de l'UE en Australie, ce qui viole la partie UE de la politique."
    c:
      en: "The aggregator copies Australian configuration and compliance data to eu-west-1, and disabling Security Hub CSPM removes security monitoring in ap-southeast-2."
      fr: "L'agrégateur copie les données de configuration et de conformité australiennes vers eu-west-1, et désactiver Security Hub CSPM supprime la surveillance de sécurité dans ap-southeast-2."
references:
  - title: Understanding cross-Region aggregation in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html
