id: sapc03-2c-pci-evidence
objective: "2.4.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A payment processor runs its cardholder data environment in 20 accounts in AWS Organizations across two AWS Regions. Its Qualified Security Assessor (QSA) requires two types of evidence for the annual PCI DSS assessment. First, the QSA needs the AWS PCI DSS Attestation of Compliance and the responsibility summary for the AWS services in use. Second, the QSA needs evidence that the processor's own AWS configurations are continuously evaluated against PCI DSS requirements across all accounts, with one central view. The processor has never used AWS Audit Manager, and a security tooling account is available as a delegated administrator.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un processeur de paiements exploite son environnement de données de titulaires de cartes dans 20 comptes d'AWS Organizations répartis sur deux Régions AWS. Son évaluateur de sécurité qualifié (QSA) exige deux types de preuves pour l'évaluation PCI DSS annuelle. D'une part, le QSA a besoin de l'attestation de conformité PCI DSS d'AWS et du résumé des responsabilités pour les services AWS utilisés. D'autre part, le QSA a besoin de preuves que les configurations AWS propres au processeur sont évaluées en continu par rapport aux exigences PCI DSS dans tous les comptes, avec une vue centrale unique. Le processeur n'a jamais utilisé AWS Audit Manager, et un compte d'outillage de sécurité est disponible comme administrateur délégué.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Accept the Business Associate Addendum as an organization agreement in AWS Artifact from the management account of the organization."
        fr: "Accepter le Business Associate Addendum comme accord d'organisation dans AWS Artifact depuis le compte de gestion de l'organisation."
    - id: b
      text:
        en: "Download the PCI DSS Attestation of Compliance and responsibility summary from the AWS Artifact reports."
        fr: "Télécharger l'attestation de conformité PCI DSS et le résumé des responsabilités dans les rapports AWS Artifact."
    - id: c
      text:
        en: "Create an AWS Audit Manager assessment from the PCI DSS framework in the security tooling account for the 20 accounts."
        fr: "Créer une évaluation AWS Audit Manager à partir du framework PCI DSS dans le compte d'outillage de sécurité pour les 20 comptes."
    - id: d
      text:
        en: "Create Amazon Inspector CIS scan configurations that assess the operating systems of the EC2 instances in the 20 accounts every week."
        fr: "Créer des configurations d'analyse CIS Amazon Inspector qui évaluent chaque semaine les systèmes d'exploitation des instances EC2 des 20 comptes."
    - id: e
      text:
        en: "Enable the PCI DSS standard in Security Hub CSPM for all accounts from the delegated administrator, with cross-Region aggregation."
        fr: "Activer la norme PCI DSS dans Security Hub CSPM pour tous les comptes depuis l'administrateur délégué, avec l'agrégation entre Régions."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS Artifact provides AWS compliance documents such as PCI DSS reports, which customers can submit to auditors as evidence for the AWS infrastructure and services they use. Security Hub CSPM runs control checks for standards that include PCI DSS, and with a delegated administrator and cross-Region aggregation it gives one central view of the control status of all accounts and Regions."
    fr: "AWS Artifact fournit les documents de conformité d'AWS, comme les rapports PCI DSS, que les clients peuvent remettre aux auditeurs comme preuve pour l'infrastructure et les services AWS qu'ils utilisent. Security Hub CSPM exécute des vérifications de contrôle pour des normes qui incluent PCI DSS, et avec un administrateur délégué et l'agrégation entre Régions il offre une vue centrale unique de l'état des contrôles de tous les comptes et de toutes les Régions."
  options:
    a:
      en: "A BAA is a HIPAA agreement for protected health information; it is not PCI DSS evidence."
      fr: "Un BAA est un accord HIPAA pour les informations de santé protégées ; ce n'est pas une preuve PCI DSS."
    c:
      en: "AWS Audit Manager is no longer open to new customers, so a processor that has never used it cannot create assessments."
      fr: "AWS Audit Manager n'est plus ouvert aux nouveaux clients : un processeur qui ne l'a jamais utilisé ne peut pas créer d'évaluations."
    d:
      en: "CIS scans assess operating system hardening against CIS benchmarks; they do not evaluate the AWS configurations against PCI DSS requirements."
      fr: "Les analyses CIS évaluent le durcissement des systèmes d'exploitation par rapport aux benchmarks CIS ; elles n'évaluent pas les configurations AWS par rapport aux exigences PCI DSS."
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
  - title: Introduction to AWS Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html
