id: sapc03-2c-inspector-findings-export
objective: "2.4.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare SaaS provider has 60 accounts in AWS Organizations in eu-west-1. Amazon Inspector is activated for all accounts, and the security tooling account is the Inspector delegated administrator. Auditors require monthly evidence of all active vulnerability findings of critical or high severity across every account. The evidence must be complete files in a machine-readable format, stored in an evidence bucket in the security tooling account and encrypted with a customer managed AWS KMS key. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS de santé possède 60 comptes dans AWS Organizations dans eu-west-1. Amazon Inspector est activé pour tous les comptes, et le compte d'outillage de sécurité est l'administrateur délégué d'Inspector. Les auditeurs exigent chaque mois une preuve de tous les résultats de vulnérabilité actifs de gravité critique ou élevée de chaque compte. La preuve doit être constituée de fichiers complets dans un format lisible par machine, stockés dans un compartiment de preuves du compte d'outillage de sécurité et chiffrés avec une clé gérée par le client AWS KMS. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Each month, take screenshots of the Inspector dashboard and findings pages in the delegated administrator account, and upload them to the evidence bucket with SSE-KMS."
        fr: "Chaque mois, faire des captures d'écran du tableau de bord et des pages de résultats Inspector dans le compte administrateur délégué, et les charger dans le compartiment de preuves avec SSE-KMS."
    - id: b
      text:
        en: "Create an Amazon EventBridge rule that matches new critical and high Inspector findings and sends each finding to an Amazon SNS topic that emails the auditors."
        fr: "Créer une règle Amazon EventBridge qui correspond aux nouveaux résultats Inspector critiques et élevés et envoie chaque résultat à une rubrique Amazon SNS qui l'envoie par e-mail aux auditeurs."
    - id: c
      text:
        en: "Each month, sign in to each of the 60 accounts, export the Inspector findings of that account to CSV, and upload the files to the evidence bucket."
        fr: "Chaque mois, se connecter à chacun des 60 comptes, exporter en CSV les résultats Inspector de ce compte, et charger les fichiers dans le compartiment de preuves."
    - id: d
      text:
        en: "Each month, call CreateFindingsReport from the delegated administrator, filtered on critical and high severity, to export JSON to the evidence bucket with the key."
        fr: "Chaque mois, appeler CreateFindingsReport depuis l'administrateur délégué, filtré sur les gravités critique et élevée, pour exporter du JSON vers le compartiment de preuves avec la clé."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Inspector exports findings reports in CSV or JSON to an S3 bucket, encrypted with a customer managed symmetric KMS key in the same Region whose key policy allows Inspector to use it. A report created by a delegated administrator includes the findings of all member accounts, and by default it contains active findings, which filters can narrow to critical and high severity; CreateFindingsReport can be called on a schedule."
    fr: "Amazon Inspector exporte des rapports de résultats en CSV ou JSON vers un compartiment S3, chiffrés avec une clé KMS symétrique gérée par le client, dans la même Région, dont la politique de clé autorise Inspector à l'utiliser. Un rapport créé par un administrateur délégué inclut les résultats de tous les comptes membres et contient par défaut les résultats actifs, que des filtres peuvent limiter aux gravités critique et élevée ; CreateFindingsReport peut être appelé selon une planification."
  options:
    a:
      en: "Screenshots are neither complete nor machine-readable, and the dashboard shows summaries rather than every finding."
      fr: "Des captures d'écran ne sont ni complètes ni lisibles par machine, et le tableau de bord montre des synthèses plutôt que chaque résultat."
    b:
      en: "Event notifications report findings one by one as they change; they do not produce a complete monthly file of all active findings in the evidence bucket."
      fr: "Les notifications d'événements signalent les résultats un par un lorsqu'ils changent ; elles ne produisent pas de fichier mensuel complet de tous les résultats actifs dans le compartiment de preuves."
    c:
      en: "Exporting from 60 accounts every month is manual work that the delegated administrator's single organization-wide report avoids."
      fr: "Exporter depuis 60 comptes chaque mois est un travail manuel que le rapport unique à l'échelle de l'organisation de l'administrateur délégué évite."
references:
  - title: Exporting Amazon Inspector findings reports
    url: https://docs.aws.amazon.com/inspector/latest/user/findings-managing-exporting-reports.html
