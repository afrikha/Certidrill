id: sapc03-2a-roles-anywhere-profile-scope
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's on-premises plant servers use IAM Roles Anywhere with an enterprise CA trust anchor and an IAM role named PlantData. The role allows the plant ingestion application to read and write objects under the plant prefixes of an Amazon S3 bucket. A new reporting application on the same servers needs read-only access to the same objects. The security team wants to reuse the PlantData role and the existing trust anchor, without creating another IAM role, and must make sure that the reporting application cannot write to the bucket. The ingestion application must keep its current access.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les serveurs d'usine sur site d'AnyCompany utilisent IAM Roles Anywhere avec une ancre de confiance de CA d'entreprise et un rôle IAM nommé PlantData. Le rôle permet à l'application d'ingestion de lire et d'écrire des objets sous les préfixes d'usine d'un compartiment (bucket) Amazon S3. Une nouvelle application de rapports sur les mêmes serveurs a besoin d'un accès en lecture seule aux mêmes objets. L'équipe de sécurité veut réutiliser le rôle PlantData et l'ancre de confiance existante, sans créer d'autre rôle IAM, et doit s'assurer que l'application de rapports ne peut pas écrire dans le compartiment. L'application d'ingestion doit conserver son accès actuel.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create a second trust anchor for the same enterprise CA, and use it only for the reporting application."
        fr: "Créer une seconde ancre de confiance pour la même CA d'entreprise, et l'utiliser uniquement pour l'application de rapports."
    - id: b
      text:
        en: "Create a second IAM Roles Anywhere profile that lists the PlantData role and attaches an S3 read-only managed policy as a session policy."
        fr: "Créer un second profil IAM Roles Anywhere qui liste le rôle PlantData et attache une politique gérée S3 en lecture seule comme politique de session."
    - id: c
      text:
        en: "Attach a read-only permissions boundary to the PlantData role so that sessions of the role can only read objects in the bucket."
        fr: "Attacher au rôle PlantData une limite d'autorisations en lecture seule afin que les sessions du rôle ne puissent que lire les objets du compartiment."
    - id: d
      text:
        en: "Configure the credential helper of the reporting application with a session duration of 900 seconds so that its credentials expire quickly."
        fr: "Configurer l'assistant d'informations d'identification de l'application de rapports avec une durée de session de 900 secondes afin que ses informations d'identification expirent rapidement."
    - id: e
      text:
        en: "Configure the credential_process of the reporting application with the ARN of the new profile and the ARN of the PlantData role."
        fr: "Configurer le credential_process de l'application de rapports avec l'ARN du nouveau profil et l'ARN du rôle PlantData."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A Roles Anywhere profile lists the roles that can be assumed and can attach up to 10 managed policies or an inline policy as session policies, which limit the permissions of the sessions created through that profile. A second profile with a read-only session policy, used by the reporting application's credential helper, gives read-only sessions of the same role, while the ingestion application keeps its existing profile."
    fr: "Un profil Roles Anywhere liste les rôles pouvant être endossés et peut attacher jusqu'à 10 politiques gérées ou une politique en ligne comme politiques de session, qui limitent les autorisations des sessions créées par ce profil. Un second profil avec une politique de session en lecture seule, utilisé par l'assistant d'informations d'identification de l'application de rapports, fournit des sessions en lecture seule du même rôle, tandis que l'application d'ingestion conserve son profil actuel."
  options:
    a:
      en: "A trust anchor validates certificates; a second anchor for the same CA does not change the permissions of the role's sessions."
      fr: "Une ancre de confiance valide des certificats ; une seconde ancre pour la même CA ne modifie pas les autorisations des sessions du rôle."
    c:
      en: "A boundary on the role applies to every session of the role, so the ingestion application would lose its write access."
      fr: "Une limite sur le rôle s'applique à toutes les sessions du rôle : l'application d'ingestion perdrait son accès en écriture."
    d:
      en: "A shorter session changes how long credentials last, not what they allow, so the reporting application could still write."
      fr: "Une session plus courte modifie la durée de validité des informations d'identification, pas ce qu'elles autorisent : l'application de rapports pourrait toujours écrire."
references:
  - title: Getting started with IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/getting-started.html
  - title: Get temporary security credentials from IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/credential-helper.html
