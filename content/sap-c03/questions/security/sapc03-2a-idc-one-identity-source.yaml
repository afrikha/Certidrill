id: sapc03-2a-idc-one-identity-source
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses an organization instance of AWS IAM Identity Center in its AWS Organizations management account. The identity source is the company's Okta tenant, and users and groups are provisioned automatically with SCIM. AnyCompany recently acquired a smaller company whose 800 employees are managed in a separate Microsoft Entra ID tenant. The 12 AWS accounts of the acquired company have joined AnyCompany's organization. Employees of both companies must sign in through the AWS access portal with their existing corporate credentials and must receive account access through permission sets. The security team wants one place to manage the permission sets and account assignments of all employees.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise une instance d'organisation d'AWS IAM Identity Center dans le compte de gestion d'AWS Organizations. La source d'identité est le locataire Okta de l'entreprise, et les utilisateurs et les groupes sont provisionnés automatiquement avec SCIM. AnyCompany vient d'acquérir une entreprise plus petite dont les 800 employés sont gérés dans un locataire Microsoft Entra ID distinct. Les 12 comptes AWS de l'entreprise acquise ont rejoint l'organisation d'AnyCompany. Les employés des deux entreprises doivent se connecter via le portail d'accès AWS avec leurs informations d'identification d'entreprise existantes et recevoir l'accès aux comptes par des ensembles d'autorisations (permission sets). L'équipe de sécurité veut un seul endroit pour gérer les ensembles d'autorisations et les affectations de comptes de tous les employés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add the Entra ID tenant as a second external identity provider of the organization instance, and enable SCIM provisioning from both Okta and Entra ID into IAM Identity Center."
        fr: "Ajouter le locataire Entra ID comme second fournisseur d'identité externe de l'instance d'organisation, et activer le provisionnement SCIM depuis Okta et depuis Entra ID vers IAM Identity Center."
    - id: b
      text:
        en: "Enable an account instance of IAM Identity Center in one of the acquired accounts with Entra ID as its identity source, and assign permission sets to the 12 acquired accounts from that instance."
        fr: "Activer une instance de compte d'IAM Identity Center dans l'un des comptes acquis avec Entra ID comme source d'identité, et affecter des ensembles d'autorisations aux 12 comptes acquis depuis cette instance."
    - id: c
      text:
        en: "Configure Okta to federate with the Entra ID tenant for the acquired employees, create their users and groups in Okta, and let the existing SCIM connection provision them into IAM Identity Center."
        fr: "Configurer Okta pour qu'il se fédère avec le locataire Entra ID pour les employés acquis, créer leurs utilisateurs et groupes dans Okta, et laisser la connexion SCIM existante les provisionner dans IAM Identity Center."
    - id: d
      text:
        en: "Create an IAM SAML identity provider for the Entra ID tenant in each acquired account, and create IAM roles that trust it with the same permissions as the existing permission sets."
        fr: "Créer un fournisseur d'identité SAML IAM pour le locataire Entra ID dans chaque compte acquis, et créer des rôles IAM qui l'approuvent avec les mêmes autorisations que les ensembles d'autorisations existants."
answer: { optionId: c }
explanation:
  correct:
    en: "An organization can have only one identity source for IAM Identity Center at a time, so the acquired identities must reach Identity Center through the existing Okta source. Federating Okta with Entra ID keeps the acquired employees' credentials in Entra ID, while Okta's SCIM connection provisions them, so all permission sets and assignments stay in the single organization instance."
    fr: "Une organisation ne peut avoir qu'une seule source d'identité pour IAM Identity Center à la fois : les identités acquises doivent donc arriver dans Identity Center par la source Okta existante. La fédération d'Okta avec Entra ID conserve les informations d'identification des employés acquis dans Entra ID, tandis que la connexion SCIM d'Okta les provisionne ; tous les ensembles d'autorisations et toutes les affectations restent dans l'unique instance d'organisation."
  options:
    a:
      en: "IAM Identity Center supports a single identity source per organization; a second external identity provider cannot be added."
      fr: "IAM Identity Center prend en charge une seule source d'identité par organisation ; il est impossible d'ajouter un second fournisseur d'identité externe."
    b:
      en: "Account instances cannot assign multi-account permissions or give access to AWS accounts through the access portal, and they would create a second place to manage access."
      fr: "Les instances de compte ne peuvent pas attribuer d'autorisations multicomptes ni donner accès à des comptes AWS via le portail d'accès, et elles créeraient un second endroit de gestion des accès."
    d:
      en: "Per-account IAM SAML providers and roles bypass the access portal and permission sets, so access would be managed in 12 separate places."
      fr: "Des fournisseurs SAML IAM et des rôles par compte contournent le portail d'accès et les ensembles d'autorisations : l'accès serait géré à 12 endroits distincts."
references:
  - title: Manage your identity source
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source.html
  - title: Organization and account instances of IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/identity-center-instances.html
