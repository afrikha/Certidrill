id: sapc03-2d-gateway-authorizer-scp
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's platform team lets product teams in 45 AWS accounts create their own Amazon Bedrock AgentCore gateways to expose internal APIs as tools to agents. Product teams have full administrator permissions in their accounts. A security review found a gateway created with no inbound authorization, which let any caller reach the internal APIs behind it. The security team now requires that no gateway without inbound authorization can be created in any account of the organization. Gateways that use JWT or IAM inbound authorization must remain allowed. The control must be preventive and must not depend on detecting gateways after they are created.

    Which solution will meet these requirements?
  fr: |
    L'équipe plateforme d'AnyCompany laisse les équipes produit de 45 comptes AWS créer leurs propres passerelles Amazon Bedrock AgentCore pour exposer des API internes comme outils aux agents. Les équipes produit ont des autorisations d'administrateur complètes dans leurs comptes. Une revue de sécurité a trouvé une passerelle créée sans autorisation entrante, qui laissait n'importe quel appelant atteindre les API internes situées derrière. L'équipe de sécurité exige désormais qu'aucune passerelle sans autorisation entrante ne puisse être créée dans un compte de l'organisation. Les passerelles qui utilisent une autorisation entrante JWT ou IAM doivent rester autorisées. Le contrôle doit être préventif et ne doit pas dépendre de la détection des passerelles après leur création.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an AWS Config custom rule to every account that flags gateways whose authorizer type is NONE, and invoke an AWS Lambda function that deletes each flagged gateway.", fr: "Déployer dans chaque compte une règle personnalisée AWS Config qui signale les passerelles dont le type d'autorisation est NONE, et appeler une fonction AWS Lambda qui supprime chaque passerelle signalée." }
    - id: b
      text: { en: "Require every product team role to have a permissions boundary that denies bedrock-agentcore:CreateGateway, and let the platform team create all gateways on request.", fr: "Exiger que chaque rôle d'équipe produit ait une limite d'autorisations qui refuse bedrock-agentcore:CreateGateway, et laisser l'équipe plateforme créer toutes les passerelles sur demande." }
    - id: c
      text: { en: "Activate an AWS CloudFormation Hook in every account that fails any stack operation that creates a gateway whose authorizer type is NONE, and require teams to create gateways with CloudFormation.", fr: "Activer dans chaque compte un hook AWS CloudFormation qui fait échouer toute opération de pile créant une passerelle dont le type d'autorisation est NONE, et demander aux équipes de créer les passerelles avec CloudFormation." }
    - id: d
      text: { en: "Attach an SCP to the organization root that denies bedrock-agentcore:CreateGateway to all principals when the bedrock-agentcore:GatewayAuthorizerType condition key equals NONE.", fr: "Attacher à la racine de l'organisation une SCP qui refuse bedrock-agentcore:CreateGateway à tous les principaux lorsque la clé de condition bedrock-agentcore:GatewayAuthorizerType vaut NONE." }
answer: { optionId: d }
explanation:
  correct:
    en: "AgentCore Gateway documents the bedrock-agentcore:GatewayAuthorizerType condition key to restrict who can create gateways with no inbound authorization. In an SCP attached to the root, the deny applies to all principals of every member account, including administrators, and gateways with JWT or IAM authorizers can still be created."
    fr: "AgentCore Gateway documente la clé de condition bedrock-agentcore:GatewayAuthorizerType pour restreindre la création de passerelles sans autorisation entrante. Dans une SCP attachée à la racine, le refus s'applique à tous les principaux de chaque compte membre, administrateurs compris, et les passerelles avec un mécanisme d'autorisation JWT ou IAM peuvent toujours être créées."
  options:
    a:
      en: "A Config rule detects the gateway after it is created, so it is exposed until the remediation runs, and the requirement asks for a preventive control."
      fr: "Une règle Config détecte la passerelle après sa création : elle reste exposée jusqu'à la correction, alors que l'exigence demande un contrôle préventif."
    b:
      en: "Administrators can create roles without the boundary or remove it, and denying all gateway creation also blocks the JWT and IAM gateways that must remain allowed."
      fr: "Les administrateurs peuvent créer des rôles sans la limite ou la retirer, et refuser toute création de passerelle bloque aussi les passerelles JWT et IAM qui doivent rester autorisées."
    c:
      en: "A CloudFormation Hook evaluates only stack operations; administrators can still create a gateway with no inbound authorization through the console, the AWS CLI or an SDK."
      fr: "Un hook CloudFormation n'évalue que les opérations de pile ; les administrateurs peuvent toujours créer une passerelle sans autorisation entrante par la console, l'AWS CLI ou un SDK."
references:
  - title: Set up inbound authorization for your gateway
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/gateway-inbound-auth.html
