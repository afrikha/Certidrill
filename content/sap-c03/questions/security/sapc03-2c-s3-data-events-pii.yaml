id: sapc03-2c-s3-data-events-pii
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank stores customer identity documents in three Amazon S3 buckets that belong to three different member accounts of its organization in AWS Organizations. The other accounts contain thousands of buckets with non-sensitive data. An AWS CloudTrail organization trail, created from the management account, logs management events to a bucket in the log archive account. A regulator now requires a record of every object read and write in the three identity document buckets, stored with the other audit logs in the log archive account. Member account administrators must not be able to stop this logging, and CloudTrail costs must stay as low as possible.

    Which solution will meet these requirements?
  fr: |
    Une banque stocke les pièces d'identité de ses clients dans trois compartiments Amazon S3 qui appartiennent à trois comptes membres différents de son organisation AWS Organizations. Les autres comptes contiennent des milliers de compartiments de données non sensibles. Un journal de suivi d'organisation AWS CloudTrail, créé depuis le compte de gestion, journalise les événements de gestion dans un compartiment du compte d'archivage des journaux. Un régulateur exige désormais un enregistrement de chaque lecture et écriture d'objet dans les trois compartiments de pièces d'identité, stocké avec les autres journaux d'audit dans le compte d'archivage des journaux. Les administrateurs des comptes membres ne doivent pas pouvoir arrêter cette journalisation, et les coûts de CloudTrail doivent rester aussi bas que possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on S3 server access logging for the three buckets in their own accounts, with a target bucket in each account that replicates the logs to the log archive account."
        fr: "Activer la journalisation des accès au serveur S3 pour les trois compartiments dans leurs propres comptes, avec un compartiment cible dans chaque compte qui réplique les journaux vers le compte d'archivage."
    - id: b
      text:
        en: "Create a trail in each of the three member accounts that logs S3 data events for all buckets in the account and delivers them to the bucket in the log archive account."
        fr: "Créer un journal de suivi dans chacun des trois comptes membres qui journalise les événements de données S3 de tous les compartiments du compte et les livre au compartiment du compte d'archivage."
    - id: c
      text:
        en: "Add S3 data events for all current and future S3 buckets to the organization trail so that every object-level operation in the organization is logged in the log archive account."
        fr: "Ajouter au journal de suivi d'organisation les événements de données S3 de tous les compartiments actuels et futurs afin que chaque opération au niveau des objets de l'organisation soit journalisée dans le compte d'archivage."
    - id: d
      text:
        en: "Add advanced event selectors to the organization trail that log S3 data events only for resources whose ARN starts with the ARN of one of the three identity document buckets."
        fr: "Ajouter au journal de suivi d'organisation des sélecteurs d'événements avancés qui journalisent les événements de données S3 uniquement pour les ressources dont l'ARN commence par l'ARN de l'un des trois compartiments de pièces d'identité."
answer: { optionId: d }
explanation:
  correct:
    en: "An organization trail can log data events for resources in member accounts by adding their ARNs, without configuring cross-account access. Advanced event selectors that filter on resources.ARN limit the data events, and their charges, to the three buckets. Member accounts cannot stop logging or change an organization trail, and the events go to the existing log archive bucket."
    fr: "Un journal de suivi d'organisation peut journaliser les événements de données de ressources des comptes membres en ajoutant leurs ARN, sans configurer d'accès entre comptes. Des sélecteurs d'événements avancés qui filtrent sur resources.ARN limitent les événements de données, et leurs frais, aux trois compartiments. Les comptes membres ne peuvent ni arrêter la journalisation ni modifier un journal de suivi d'organisation, et les événements arrivent dans le compartiment d'archivage existant."
  options:
    a:
      en: "Server access logging is configured by the bucket owners, who can turn it off, and it is delivered on a best-effort basis to buckets in the member accounts."
      fr: "La journalisation des accès au serveur est configurée par les propriétaires des compartiments, qui peuvent la désactiver, et elle est livrée au mieux dans des compartiments des comptes membres."
    b:
      en: "Trails created in member accounts can be stopped or deleted by their administrators, and logging data events for all buckets in those accounts adds unnecessary cost."
      fr: "Les journaux de suivi créés dans les comptes membres peuvent être arrêtés ou supprimés par leurs administrateurs, et journaliser les événements de données de tous leurs compartiments ajoute un coût inutile."
    c:
      en: "Logging data events for thousands of non-sensitive buckets generates a large volume of billed events that the regulator did not ask for."
      fr: "Journaliser les événements de données de milliers de compartiments non sensibles génère un grand volume d'événements facturés que le régulateur n'a pas demandés."
references:
  - title: Creating a trail for an organization
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
