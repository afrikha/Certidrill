id: sapc03-2a-vpce-policy-aws-owned-repos
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs Amazon Linux 2023 instances in private subnets that have no NAT gateway. The instances reach Amazon S3 through gateway VPC endpoints. To prevent data exfiltration, the security team changed every endpoint policy so that it allows S3 requests only when aws:ResourceOrgID equals AnyCompany's organization ID. Since the change, applications still read and write the company's buckets, but package installation and updates with dnf fail on every instance. The security team wants to keep the resource perimeter and make the smallest change that restores package updates.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des instances Amazon Linux 2023 dans des sous-réseaux privés sans passerelle NAT. Les instances accèdent à Amazon S3 par des points de terminaison de VPC de type passerelle. Pour empêcher l'exfiltration de données, l'équipe de sécurité a modifié chaque politique de point de terminaison pour n'autoriser les requêtes S3 que lorsque aws:ResourceOrgID est égal à l'ID de l'organisation d'AnyCompany. Depuis ce changement, les applications lisent et écrivent toujours les compartiments (buckets) de l'entreprise, mais l'installation et la mise à jour de paquets avec dnf échouent sur toutes les instances. L'équipe de sécurité veut conserver le périmètre de ressources et faire la plus petite modification qui rétablit les mises à jour de paquets.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a statement to each endpoint policy that allows s3:GetObject on the AWS-owned Amazon Linux repository buckets of the Region, and keep the aws:ResourceOrgID statement."
        fr: "Ajouter à chaque politique de point de terminaison une instruction qui autorise s3:GetObject sur les compartiments de dépôts Amazon Linux détenus par AWS dans la Région, et conserver l'instruction aws:ResourceOrgID."
    - id: b
      text:
        en: "Add a NAT gateway to each VPC and a route to the internet, so that dnf reaches the Amazon Linux repositories without going through the gateway endpoints."
        fr: "Ajouter une passerelle NAT à chaque VPC et une route vers Internet, afin que dnf atteigne les dépôts Amazon Linux sans passer par les points de terminaison de passerelle."
    - id: c
      text:
        en: "Replace the aws:ResourceOrgID condition in each endpoint policy with a statement that allows s3:GetObject on all buckets and allows other actions only on the company's buckets."
        fr: "Remplacer la condition aws:ResourceOrgID de chaque politique de point de terminaison par une instruction qui autorise s3:GetObject sur tous les compartiments et n'autorise les autres actions que sur les compartiments de l'entreprise."
    - id: d
      text:
        en: "Attach an SCP to the workload accounts that allows s3:GetObject on the AWS-owned Amazon Linux repository buckets of each Region used by the company."
        fr: "Attacher aux comptes de charge de travail une SCP qui autorise s3:GetObject sur les compartiments de dépôts Amazon Linux détenus par AWS dans chaque Région utilisée par l'entreprise."
answer: { optionId: a }
explanation:
  correct:
    en: "The Amazon Linux package repositories are hosted in S3 buckets that AWS owns, so they fail an aws:ResourceOrgID check. The data perimeter guidance handles such public AWS-owned resources with explicit allows in the VPC endpoint policies, which restores updates while every other S3 request still has to target an organization bucket."
    fr: "Les dépôts de paquets Amazon Linux sont hébergés dans des compartiments S3 détenus par AWS : ils échouent à la vérification aws:ResourceOrgID. Les recommandations sur le périmètre de données traitent ces ressources publiques détenues par AWS par des autorisations explicites dans les politiques de point de terminaison de VPC, ce qui rétablit les mises à jour alors que toute autre requête S3 doit toujours cibler un compartiment de l'organisation."
  options:
    b:
      en: "A NAT gateway opens a path to S3 that bypasses the endpoint policies, which weakens the resource perimeter and adds cost."
      fr: "Une passerelle NAT ouvre vers S3 un chemin qui contourne les politiques de point de terminaison, ce qui affaiblit le périmètre de ressources et ajoute des coûts."
    c:
      en: "Allowing s3:GetObject on every bucket lets instances read from any bucket in any account, which removes much of the resource perimeter."
      fr: "Autoriser s3:GetObject sur tous les compartiments permet aux instances de lire dans n'importe quel compartiment de n'importe quel compte, ce qui supprime une grande partie du périmètre de ressources."
    d:
      en: "SCPs do not grant permissions, and the request is denied by the endpoint policy, which an SCP cannot override."
      fr: "Les SCP n'accordent pas d'autorisations, et la requête est refusée par la politique de point de terminaison, qu'une SCP ne peut pas outrepasser."
references:
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
