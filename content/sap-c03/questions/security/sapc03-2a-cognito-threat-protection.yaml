id: sapc03-2a-cognito-threat-protection
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany runs a consumer web application whose 2 million users sign in to an Amazon Cognito user pool on the Essentials feature plan. The security team sees credential stuffing attempts that use passwords from public data breaches. The team wants Amazon Cognito to block sign-ins and password changes that use compromised passwords, and to require MFA when a sign-in comes from an unexpected location or device. The company does not want to write or operate custom code for these checks.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite une application web grand public dont les 2 millions d'utilisateurs se connectent à un groupe d'utilisateurs Amazon Cognito avec le plan de fonctionnalités Essentials. L'équipe de sécurité observe des tentatives de bourrage d'identifiants qui utilisent des mots de passe issus de fuites de données publiques. L'équipe veut qu'Amazon Cognito bloque les connexions et les changements de mot de passe qui utilisent des mots de passe compromis, et exige la MFA lorsqu'une connexion provient d'un emplacement ou d'un appareil inattendu. L'entreprise ne veut ni écrire ni exploiter de code personnalisé pour ces contrôles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Associate an AWS WAF web ACL with the user pool, and add a rate-based rule and the AWS managed IP reputation rule group to block suspicious sign-in traffic."
        fr: "Associer une ACL web AWS WAF au groupe d'utilisateurs, et ajouter une règle basée sur le débit et le groupe de règles géré AWS de réputation IP pour bloquer le trafic de connexion suspect."
    - id: b
      text:
        en: "Add a pre authentication Lambda trigger that checks each password against a breached-password service and requires MFA when the sign-in country differs from the last one."
        fr: "Ajouter un déclencheur Lambda de pré-authentification qui vérifie chaque mot de passe auprès d'un service de mots de passe compromis et exige la MFA lorsque le pays de connexion diffère du précédent."
    - id: c
      text:
        en: "Change the user pool to the Plus feature plan, and enable threat protection in Full function mode with compromised credentials blocking and adaptive authentication MFA by risk level."
        fr: "Passer le groupe d'utilisateurs au plan de fonctionnalités Plus, et activer la protection contre les menaces en mode Full function avec le blocage des informations d'identification compromises et la MFA d'authentification adaptative par niveau de risque."
    - id: d
      text:
        en: "Enable Amazon GuardDuty in the account, and create an Amazon EventBridge rule that disables Cognito users when GuardDuty reports a credential access finding."
        fr: "Activer Amazon GuardDuty dans le compte, et créer une règle Amazon EventBridge qui désactive les utilisateurs Cognito lorsque GuardDuty signale un résultat d'accès aux informations d'identification."
answer: { optionId: c }
explanation:
  correct:
    en: "Threat protection is a feature of the Plus plan: it checks passwords for indicators of compromise and evaluates sign-in risk, such as an unexpected location, at runtime. In Full function mode, Amazon Cognito blocks compromised credentials and applies adaptive authentication actions such as requiring MFA, with no custom code."
    fr: "La protection contre les menaces est une fonctionnalité du plan Plus : elle vérifie à l'exécution si les mots de passe présentent des indicateurs de compromission et évalue le risque de connexion, par exemple un emplacement inattendu. En mode Full function, Amazon Cognito bloque les informations d'identification compromises et applique des actions d'authentification adaptative comme l'exigence de MFA, sans code personnalisé."
  options:
    a:
      en: "AWS WAF can slow down floods of requests, but it cannot detect that a password appears in a breach or require MFA for a risky sign-in."
      fr: "AWS WAF peut ralentir des rafales de requêtes, mais il ne peut pas détecter qu'un mot de passe figure dans une fuite ni exiger la MFA pour une connexion risquée."
    b:
      en: "A Lambda trigger that calls an external service is custom code that the company would have to write and operate."
      fr: "Un déclencheur Lambda qui appelle un service externe est du code personnalisé que l'entreprise devrait écrire et exploiter."
    d:
      en: "GuardDuty does not evaluate user pool passwords or sign-in risk, and disabling users after a finding does not block the compromised sign-in itself."
      fr: "GuardDuty n'évalue ni les mots de passe du groupe d'utilisateurs ni le risque de connexion, et désactiver des utilisateurs après un résultat ne bloque pas la connexion compromise elle-même."
references:
  - title: Advanced security with threat protection
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pool-settings-threat-protection.html
  - title: User pool feature plans
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-sign-in-feature-plans.html
