id: sapc03-2c-xks-hyok
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European public agency is moving case management workloads to AWS. The workloads use Amazon S3 with SSE-KMS and encrypted Amazon EBS volumes. A national sovereignty law requires that the key material protecting this data be generated, stored, and used only in HSMs that the agency operates in its own data centers, outside AWS. The agency must also be able to cut off AWS's ability to decrypt the data immediately, at any time. The agency accepts responsibility for the availability and latency of its key infrastructure and can connect it to a VPC through AWS Direct Connect.

    Which solution will meet these requirements?
  fr: |
    Une agence publique européenne transfère ses charges de travail de gestion de dossiers vers AWS. Les charges de travail utilisent Amazon S3 avec SSE-KMS et des volumes Amazon EBS chiffrés. Une loi nationale de souveraineté exige que le matériel de clé qui protège ces données soit généré, stocké et utilisé uniquement dans des HSM que l'agence exploite dans ses propres centres de données, en dehors d'AWS. L'agence doit aussi pouvoir couper à tout moment et immédiatement la capacité d'AWS à déchiffrer les données. L'agence accepte la responsabilité de la disponibilité et de la latence de son infrastructure de clés et peut la connecter à un VPC par AWS Direct Connect.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Generate key material in the agency's HSMs, import it into AWS KMS customer managed keys for S3 and EBS, and delete the imported key material when access must be cut off."
        fr: "Générer le matériel de clé dans les HSM de l'agence, l'importer dans des clés gérées par le client AWS KMS pour S3 et EBS, et supprimer le matériel de clé importé lorsque l'accès doit être coupé."
    - id: b
      text:
        en: "Create an AWS KMS external key store that reaches the agency's HSMs through an external key store proxy, and use KMS keys from that store for S3 and EBS."
        fr: "Créer un magasin de clés externe AWS KMS qui atteint les HSM de l'agence par un proxy de magasin de clés externe, et utiliser des clés KMS de ce magasin pour S3 et EBS."
    - id: c
      text:
        en: "Create an AWS KMS custom key store backed by an AWS CloudHSM cluster in the agency's account, and use KMS keys from that store for S3 and EBS."
        fr: "Créer un magasin de clés personnalisé AWS KMS adossé à un cluster AWS CloudHSM dans le compte de l'agence, et utiliser des clés KMS de ce magasin pour S3 et EBS."
    - id: d
      text:
        en: "Create multi-Region AWS KMS customer managed keys whose primary key is in the agency's Region, and disable the primary key and its replicas when access must be cut off."
        fr: "Créer des clés gérées par le client AWS KMS multi-Régions dont la clé primaire se trouve dans la Région de l'agence, et désactiver la clé primaire et ses répliques lorsque l'accès doit être coupé."
answer: { optionId: b }
explanation:
  correct:
    en: "An external key store keeps the key material in an external key manager that the customer owns and operates outside AWS; AWS KMS reaches it only through the customer's external key store proxy, which can be exposed through a VPC endpoint service. Data is encrypted with KMS key material and then with the external key, and the customer can cut off access by disconnecting the key store or the proxy. The keys work with services that support customer managed keys, such as S3 and EBS."
    fr: "Un magasin de clés externe conserve le matériel de clé dans un gestionnaire de clés externe que le client possède et exploite en dehors d'AWS ; AWS KMS ne l'atteint que par le proxy de magasin de clés externe du client, qui peut être exposé par un service de point de terminaison VPC. Les données sont chiffrées avec du matériel de clé KMS puis avec la clé externe, et le client peut couper l'accès en déconnectant le magasin de clés ou le proxy. Les clés fonctionnent avec les services qui prennent en charge les clés gérées par le client, comme S3 et EBS."
  options:
    a:
      en: "Imported key material is stored and used inside AWS KMS HSMs while it is available, so it is not used only in the agency's HSMs outside AWS."
      fr: "Le matériel de clé importé est stocké et utilisé dans les HSM d'AWS KMS tant qu'il est disponible : il n'est donc pas utilisé uniquement dans les HSM de l'agence en dehors d'AWS."
    c:
      en: "A CloudHSM cluster runs in AWS data centers, so the key material would be generated and stored inside AWS, not in the agency's own data centers."
      fr: "Un cluster CloudHSM s'exécute dans des centres de données AWS : le matériel de clé serait généré et stocké dans AWS, et non dans les propres centres de données de l'agence."
    d:
      en: "Multi-Region keys have their key material generated and held by AWS KMS, and replicas copy it to other Regions, which moves further from the requirement."
      fr: "Le matériel des clés multi-Régions est généré et détenu par AWS KMS, et les répliques le copient dans d'autres Régions, ce qui éloigne encore de l'exigence."
references:
  - title: External key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-external.html
