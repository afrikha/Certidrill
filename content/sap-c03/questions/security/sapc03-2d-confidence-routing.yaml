id: sapc03-2d-confidence-routing
objective: "2.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A property insurer receives about 20,000 water-damage claims each month. A new AWS Step Functions workflow will send each claim to an Amazon Bedrock model that returns a recommended payout, a short rationale and a confidence score between 0 and 1. The oversight policy requires that every recommendation with a confidence below 0.85 is reviewed by a human adjuster, who sees the model's rationale and accepts or changes the payout before the claim continues. Recommendations at or above 0.85 must be paid without human review so that adjusters handle as few claims as possible. Reviews can take several days, and no compute may run while a claim waits.

    Which solution will meet these requirements?
  fr: |
    Un assureur habitation reçoit environ 20 000 sinistres de dégâts des eaux par mois. Un nouveau flux de travail AWS Step Functions enverra chaque sinistre à un modèle Amazon Bedrock qui renvoie un montant d'indemnisation recommandé, une courte justification et un score de confiance entre 0 et 1. La politique de supervision exige que chaque recommandation dont la confiance est inférieure à 0,85 soit examinée par un gestionnaire humain, qui voit la justification du modèle et accepte ou modifie le montant avant que le sinistre ne continue. Les recommandations à 0,85 ou plus doivent être payées sans examen humain afin que les gestionnaires traitent le moins de sinistres possible. Les examens peuvent prendre plusieurs jours, et aucun calcul ne doit s'exécuter pendant qu'un sinistre attend.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a Standard workflow that invokes the model, then sends every recommendation to the adjusters' queue with a .waitForTaskToken task so that adjusters can approve the high-confidence ones quickly.", fr: "Utiliser un flux de travail Standard qui appelle le modèle, puis envoie chaque recommandation dans la file des gestionnaires avec une tâche .waitForTaskToken afin qu'ils approuvent rapidement celles à confiance élevée." }
    - id: b
      text: { en: "Use an Express workflow that invokes the model, and add a Choice state that sends low-confidence recommendations to an Amazon SQS queue with a .waitForTaskToken task for the adjusters' application.", fr: "Utiliser un flux de travail Express qui appelle le modèle, et ajouter un état Choice qui envoie les recommandations à faible confiance dans une file d'attente Amazon SQS avec une tâche .waitForTaskToken pour l'application des gestionnaires." }
    - id: c
      text: { en: "Use a Standard workflow that invokes the model and pays every claim, then emails each low-confidence recommendation to an adjuster, who can reverse the payment afterwards.", fr: "Utiliser un flux de travail Standard qui appelle le modèle et paie chaque sinistre, puis envoie par e-mail chaque recommandation à faible confiance à un gestionnaire, qui peut annuler le paiement ensuite." }
    - id: d
      text: { en: "Use a Standard workflow that invokes the model with the Bedrock InvokeModel integration, and add a Choice state that sends low-confidence recommendations to an Amazon SQS .waitForTaskToken task read by the adjusters' application.", fr: "Utiliser un flux de travail Standard qui appelle le modèle avec l'intégration Bedrock InvokeModel, et ajouter un état Choice qui envoie les recommandations à faible confiance vers une tâche Amazon SQS .waitForTaskToken lue par l'application des gestionnaires." }
answer: { optionId: d }
explanation:
  correct:
    en: "Step Functions invokes Bedrock models directly through its optimized InvokeModel integration, and a Choice state routes only recommendations below the threshold to a human. The SQS .waitForTaskToken task passes the rationale and the task token to the adjusters' application and pauses with no compute until the adjuster returns the token, which a Standard workflow allows for days."
    fr: "Step Functions appelle directement les modèles Bedrock par son intégration optimisée InvokeModel, et un état Choice n'oriente vers un humain que les recommandations sous le seuil. La tâche SQS .waitForTaskToken transmet la justification et le jeton de tâche à l'application des gestionnaires et se met en pause sans calcul jusqu'à ce que le gestionnaire renvoie le jeton, ce qu'un flux Standard permet pendant des jours."
  options:
    a:
      en: "Sending every recommendation to adjusters contradicts the requirement to pay high-confidence claims without review and to minimize the adjusters' workload."
      fr: "Envoyer chaque recommandation aux gestionnaires contredit l'exigence de payer sans examen les sinistres à confiance élevée et de minimiser la charge des gestionnaires."
    b:
      en: "Express workflows do not support the .waitForTaskToken pattern and stop after 5 minutes, so they cannot wait days for an adjuster."
      fr: "Les flux de travail Express ne prennent pas en charge le modèle .waitForTaskToken et s'arrêtent après 5 minutes : ils ne peuvent pas attendre un gestionnaire pendant des jours."
    c:
      en: "Paying first and reviewing afterwards puts the human review after the action, so low-confidence payouts are made before an adjuster accepts or changes them."
      fr: "Payer d'abord et examiner ensuite place l'examen humain après l'action : les indemnisations à faible confiance sont versées avant qu'un gestionnaire les accepte ou les modifie."
references:
  - title: Invoke and customize Amazon Bedrock models with Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-bedrock.html
  - title: Discover service integration patterns in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
