id: sapc03-2d-agentcore-3lo
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany is deploying a sales assistant agent on Amazon Bedrock AgentCore Runtime for 2,000 salespeople. Salespeople sign in to the assistant with the company's OIDC identity provider, and the runtime validates their JWTs. The agent must read and update opportunities in the company's SaaS CRM, which supports OAuth 2.0. Each salesperson must see and change only the records that the CRM already lets that person access, and each person must consent once before the agent acts on their behalf. The security team forbids long-lived CRM secrets in agent code or environment variables and wants every token access to be validated and audited.

    Which solution will meet these requirements?
  fr: |
    AnyCompany déploie un agent d'assistance commerciale sur Amazon Bedrock AgentCore Runtime pour 2 000 commerciaux. Les commerciaux se connectent à l'assistant avec le fournisseur d'identité OIDC de l'entreprise, et le runtime valide leurs JWT. L'agent doit lire et mettre à jour des opportunités dans le CRM SaaS de l'entreprise, qui prend en charge OAuth 2.0. Chaque commercial ne doit voir et modifier que les enregistrements auxquels le CRM lui donne déjà accès, et chacun doit donner son consentement une fois avant que l'agent n'agisse en son nom. L'équipe de sécurité interdit les secrets CRM de longue durée dans le code ou les variables d'environnement de l'agent, et veut que chaque accès à un jeton soit validé et audité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a CRM integration user with access to all opportunities, store its API key in AWS Secrets Manager, and have the agent filter the records by the salesperson's email address from the JWT.", fr: "Créer un utilisateur d'intégration CRM ayant accès à toutes les opportunités, stocker sa clé d'API dans AWS Secrets Manager, et faire filtrer les enregistrements par l'agent selon l'adresse e-mail du commercial tirée du JWT." }
    - id: b
      text: { en: "Create an AgentCore Identity OAuth2 credential provider for the CRM, and annotate the CRM tools with a user-federation (three-legged) flow so that each user's consented token is stored in the token vault.", fr: "Créer un fournisseur d'identifiants OAuth2 AgentCore Identity pour le CRM, et annoter les outils CRM avec un flux de fédération d'utilisateurs (à trois branches) afin que le jeton consenti de chaque utilisateur soit stocké dans le coffre de jetons." }
    - id: c
      text: { en: "Create an AgentCore Identity OAuth2 credential provider for the CRM that uses the client credentials grant, and request a token with the scopes of the sales team before each CRM call.", fr: "Créer un fournisseur d'identifiants OAuth2 AgentCore Identity pour le CRM qui utilise l'octroi par identifiants client, et demander un jeton avec les portées de l'équipe commerciale avant chaque appel au CRM." }
    - id: d
      text: { en: "Federate the OIDC provider with an Amazon Cognito identity pool, map each salesperson to an IAM role, and have the agent call the CRM with the temporary credentials of that role.", fr: "Fédérer le fournisseur OIDC avec un groupe d'identités Amazon Cognito, associer chaque commercial à un rôle IAM, et faire appeler le CRM par l'agent avec les identifiants temporaires de ce rôle." }
answer: { optionId: b }
explanation:
  correct:
    en: "AgentCore Identity supports the OAuth 2.0 authorization code grant (3LO, user federation) for user-delegated access with explicit consent. The runtime exchanges the user's JWT for a workload access token, obtains the CRM token for that user, and caches it in the KMS-encrypted token vault keyed by workload identity and user, so the CRM enforces each person's own permissions and no secret lives in the code."
    fr: "AgentCore Identity prend en charge l'octroi par code d'autorisation OAuth 2.0 (3LO, fédération d'utilisateurs) pour un accès délégué par l'utilisateur avec consentement explicite. Le runtime échange le JWT de l'utilisateur contre un jeton d'accès de charge de travail, obtient le jeton CRM de cet utilisateur et le met en cache dans le coffre de jetons chiffré par KMS, indexé par identité de charge de travail et par utilisateur : le CRM applique les autorisations propres à chaque personne, et aucun secret ne figure dans le code."
  options:
    a:
      en: "A shared integration user sees every record, so access depends on filtering in agent code that a manipulated agent could skip, and the CRM no longer enforces each person's permissions."
      fr: "Un utilisateur d'intégration partagé voit tous les enregistrements : l'accès dépend d'un filtrage dans le code de l'agent qu'un agent manipulé pourrait ignorer, et le CRM n'applique plus les autorisations de chaque personne."
    c:
      en: "The client credentials grant (2LO) is machine-to-machine without user interaction, so the token represents the agent, not the salesperson, and no per-user consent or permission applies."
      fr: "L'octroi par identifiants client (2LO) est de machine à machine, sans interaction utilisateur : le jeton représente l'agent et non le commercial, et aucun consentement ni autorisation par utilisateur ne s'applique."
    d:
      en: "Temporary AWS credentials authorize calls to AWS services; the SaaS CRM does not accept IAM credentials, so they cannot carry the salesperson's CRM permissions."
      fr: "Des identifiants AWS temporaires autorisent des appels aux services AWS ; le CRM SaaS n'accepte pas d'identifiants IAM, ils ne peuvent donc pas porter les autorisations CRM du commercial."
references:
  - title: Features of AgentCore Identity
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/key-features-and-benefits.html
  - title: Authenticate and authorize with Inbound Auth and Outbound Auth
    url: https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-oauth.html
