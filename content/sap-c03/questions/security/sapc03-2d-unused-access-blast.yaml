id: sapc03-2d-unused-access-blast
objective: "2.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 90 AWS accounts in AWS Organizations, and an AWS CloudTrail organization trail delivers management events to a central log archive account. A threat model of the company's deployment platform concluded that a stolen credential would have a large blast radius, because many IAM roles and users were created years ago with broad managed policies. The agreed mitigation has two parts. First, continuously identify, across all accounts, the IAM roles and users that are no longer used and the services and actions that the remaining ones never use. Second, replace the broad policies of the roles that are still in use with policies that contain only the actions those roles have actually called. The security team wants AWS-managed capabilities rather than custom scripts.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    AnyCompany possède 90 comptes AWS dans AWS Organizations, et un journal de suivi d'organisation AWS CloudTrail livre les événements de gestion dans un compte central d'archivage des journaux. Un modèle de menaces de la plateforme de déploiement de l'entreprise a conclu qu'un identifiant volé aurait un large rayon d'impact, car de nombreux rôles et utilisateurs IAM ont été créés il y a des années avec des politiques gérées étendues. La mesure d'atténuation retenue comporte deux parties. D'abord, identifier en continu, dans tous les comptes, les rôles et utilisateurs IAM qui ne sont plus utilisés ainsi que les services et actions que les autres n'utilisent jamais. Ensuite, remplacer les politiques étendues des rôles encore utilisés par des politiques qui ne contiennent que les actions que ces rôles ont réellement appelées. L'équipe de sécurité veut des fonctions gérées par AWS plutôt que des scripts personnalisés.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Generate an IAM credential report in each account every week, and delete the users whose password and access keys have not been used for 90 days.", fr: "Générer chaque semaine un rapport d'identification IAM dans chaque compte, et supprimer les utilisateurs dont le mot de passe et les clés d'accès n'ont pas été utilisés depuis 90 jours." } }
    - { id: b, text: { en: "Create an IAM Access Analyzer unused access analyzer for the organization in a delegated administrator account, and review its findings for unused roles, users, services and actions.", fr: "Créer un analyseur d'accès inutilisés IAM Access Analyzer pour l'organisation dans un compte administrateur délégué, et examiner ses résultats sur les rôles, utilisateurs, services et actions inutilisés." } }
    - { id: c, text: { en: "Deploy the AWS Config managed rule iam-user-unused-credentials-check to all accounts with an organization Config rule.", fr: "Déployer la règle gérée AWS Config iam-user-unused-credentials-check dans tous les comptes avec une règle Config d'organisation." } }
    - { id: d, text: { en: "Create an IAM Access Analyzer external access analyzer for the organization, and remove every permission that appears in its findings.", fr: "Créer un analyseur d'accès externe IAM Access Analyzer pour l'organisation, et supprimer toutes les autorisations qui apparaissent dans ses résultats." } }
    - { id: e, text: { en: "Use IAM Access Analyzer policy generation on each role still in use, based on the CloudTrail trail activity, and replace the broad policies with the generated policies after review.", fr: "Utiliser la génération de politiques IAM Access Analyzer pour chaque rôle encore utilisé, à partir de l'activité du journal de suivi CloudTrail, et remplacer les politiques étendues par les politiques générées après revue." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "An unused access analyzer continuously reports unused roles, unused access keys and passwords, and unused services and actions for IAM roles and users, and its zone of trust can be the whole organization. Policy generation analyzes the CloudTrail activity of a role over a date range and produces a policy with the actions actually used, which replaces the broad policy after review."
    fr: "Un analyseur d'accès inutilisés signale en continu les rôles inutilisés, les clés d'accès et mots de passe inutilisés, ainsi que les services et actions inutilisés des rôles et utilisateurs IAM, et sa zone de confiance peut être toute l'organisation. La génération de politiques analyse l'activité CloudTrail d'un rôle sur une période et produit une politique contenant les actions réellement utilisées, qui remplace la politique étendue après revue."
  options:
    a:
      en: "The credential report covers IAM users and their passwords and access keys only; it says nothing about roles or about unused services and actions, and it requires a script in every account."
      fr: "Le rapport d'identification ne couvre que les utilisateurs IAM, leurs mots de passe et clés d'accès ; il ne dit rien des rôles ni des services et actions inutilisés, et il exige un script dans chaque compte."
    c:
      en: "This rule only checks whether IAM users have passwords or access keys unused for a set period; it does not evaluate roles or unused actions, and it does not produce replacement policies."
      fr: "Cette règle vérifie seulement si des utilisateurs IAM ont des mots de passe ou clés d'accès inutilisés depuis une période donnée ; elle n'évalue ni les rôles ni les actions inutilisées, et ne produit pas de politiques de remplacement."
    d:
      en: "An external access analyzer reports resources shared outside the zone of trust; it does not identify unused permissions, and removing every finding could break approved sharing."
      fr: "Un analyseur d'accès externe signale les ressources partagées hors de la zone de confiance ; il n'identifie pas les autorisations inutilisées, et supprimer chaque résultat pourrait casser des partages approuvés."
references:
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
