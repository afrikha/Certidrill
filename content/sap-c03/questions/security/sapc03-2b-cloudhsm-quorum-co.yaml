id: sapc03-2b-cloudhsm-quorum-co
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's AWS CloudHSM cluster holds the signing keys of a regulated clearing service. An internal audit found that any single crypto officer (CO) can create or delete HSM users and change other users' passwords. The regulator requires that at least three of the five COs approve each of these user-management operations before it runs. IAM administrators in the AWS account must not be able to bypass the control.

    Which solution will meet these requirements?
  fr: |
    Le cluster AWS CloudHSM d'AnyCompany contient les clés de signature d'un service de compensation réglementé. Un audit interne a constaté qu'un seul responsable de chiffrement (CO, crypto officer) peut créer ou supprimer des utilisateurs HSM et modifier les mots de passe d'autres utilisateurs. Le régulateur exige qu'au moins trois des cinq CO approuvent chacune de ces opérations de gestion des utilisateurs avant son exécution. Les administrateurs IAM du compte AWS ne doivent pas pouvoir contourner ce contrôle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an IAM policy that requires MFA for all cloudhsm actions, and require three administrators to approve each IAM session through a ticketing workflow.", fr: "Attacher une politique IAM qui exige la MFA pour toutes les actions cloudhsm, et exiger que trois administrateurs approuvent chaque session IAM via un processus de tickets." } }
    - { id: b, text: { en: "Attach an SCP to the account that denies cloudhsm:DeleteHsm and cloudhsm:DeleteCluster unless the request comes from a break-glass role.", fr: "Attacher au compte une SCP qui refuse cloudhsm:DeleteHsm et cloudhsm:DeleteCluster sauf si la requête provient d'un rôle d'urgence (break-glass)." } }
    - { id: c, text: { en: "Create an Amazon EventBridge rule that sends events about HSM user changes to the security team, which reviews each change within one hour.", fr: "Créer une règle Amazon EventBridge qui envoie à l'équipe de sécurité les événements de modification des utilisateurs HSM, chaque modification étant examinée sous une heure." } }
    - { id: d, text: { en: "Enable quorum authentication on the HSMs for crypto officer user management, and set the minimum number of quorum approvals to three.", fr: "Activer l'authentification par quorum sur les HSM pour la gestion des utilisateurs par les responsables de chiffrement, et fixer à trois le nombre minimal d'approbations du quorum." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Quorum authentication (M of N access control) requires several HSM users to approve quorum-controlled operations, and HSM user management by crypto officers is one of them. The minimum number of approvers can be set from 2 to 8, and the control is enforced by the HSMs themselves, so IAM permissions cannot bypass it."
    fr: "L'authentification par quorum (contrôle d'accès M sur N) exige que plusieurs utilisateurs HSM approuvent les opérations soumises au quorum, dont la gestion des utilisateurs HSM par les responsables de chiffrement. Le nombre minimal d'approbateurs se règle de 2 à 8, et le contrôle est appliqué par les HSM eux-mêmes : les autorisations IAM ne peuvent pas le contourner."
  options:
    a:
      en: "HSM users are managed inside the HSMs, outside IAM, so IAM policies and an external approval workflow do not control HSM user management."
      fr: "Les utilisateurs HSM sont gérés dans les HSM, en dehors d'IAM : les politiques IAM et un processus d'approbation externe ne contrôlent pas la gestion des utilisateurs HSM."
    b:
      en: "These actions manage HSMs and clusters through the AWS API; the SCP does nothing for user management inside the HSMs."
      fr: "Ces actions gèrent les HSM et les clusters via l'API AWS ; la SCP n'agit pas sur la gestion des utilisateurs dans les HSM."
    c:
      en: "A review after the fact is detective; it does not require three approvals before the operation runs."
      fr: "Un examen a posteriori est détectif ; il n'exige pas trois approbations avant l'exécution de l'opération."
references:
  - title: Using CloudHSM Management Utility (CMU) to manage quorum authentication (M of N access control)
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/quorum-authentication.html
