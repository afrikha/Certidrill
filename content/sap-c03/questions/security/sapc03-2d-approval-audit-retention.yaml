id: sapc03-2d-approval-audit-retention
objective: "2.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A lender uses AWS Step Functions Standard workflows to pause every AI-generated credit decision above a set amount until a credit officer approves or rejects it through a .waitForTaskToken callback. The financial regulator requires the lender to keep, for 7 years, a record of each human review: the model's recommendation, the officer's identity, the decision and its timestamp. The record must be protected so that no one, including administrators, can change or delete it during those 7 years. Auditors must be able to retrieve any record within minutes. The compliance team proposes to rely on the execution history of the workflows.

    Which solution will meet these requirements?
  fr: |
    Un prêteur utilise des flux de travail AWS Step Functions Standard pour mettre en pause chaque décision de crédit générée par IA au-delà d'un certain montant, jusqu'à ce qu'un chargé de crédit l'approuve ou la rejette par un rappel .waitForTaskToken. Le régulateur financier exige que le prêteur conserve pendant 7 ans un enregistrement de chaque examen humain : la recommandation du modèle, l'identité du chargé de crédit, la décision et son horodatage. L'enregistrement doit être protégé pour que personne, administrateurs compris, ne puisse le modifier ou le supprimer pendant ces 7 ans. Les auditeurs doivent pouvoir retrouver n'importe quel enregistrement en quelques minutes. L'équipe de conformité propose de s'appuyer sur l'historique d'exécution des flux de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep the workflows unchanged and rely on the Step Functions execution history, which the auditors can query with the DescribeExecution and GetExecutionHistory APIs for each review.", fr: "Conserver les flux de travail inchangés et s'appuyer sur l'historique d'exécution Step Functions, que les auditeurs peuvent interroger avec les API DescribeExecution et GetExecutionHistory pour chaque examen." }
    - id: b
      text: { en: "Open an AWS Support case to extend the retention of the Step Functions execution history to 7 years, and restrict the StopExecution and DeleteStateMachine actions with an SCP.", fr: "Ouvrir un dossier AWS Support pour étendre à 7 ans la conservation de l'historique d'exécution Step Functions, et restreindre les actions StopExecution et DeleteStateMachine par une SCP." }
    - id: c
      text: { en: "Add a task after the callback that writes the review record to an Amazon S3 bucket with S3 Object Lock in compliance mode and a 7-year default retention period.", fr: "Ajouter après le rappel une tâche qui écrit l'enregistrement de l'examen dans un compartiment Amazon S3 avec S3 Object Lock en mode conformité et une durée de conservation par défaut de 7 ans." }
    - id: d
      text: { en: "Convert the workflows to Express workflows with logging to Amazon CloudWatch Logs, and set the retention of the log group to 7 years.", fr: "Convertir les flux de travail en flux Express avec journalisation dans Amazon CloudWatch Logs, et définir la conservation du groupe de journaux à 7 ans." }
answer: { optionId: c }
explanation:
  correct:
    en: "Step Functions keeps the history of a closed Standard execution for 90 days only, so the review record must be written elsewhere. A task that writes it to S3 with Object Lock in compliance mode keeps each object immutable for the retention period, even for the root user, and the objects can be retrieved at any time."
    fr: "Step Functions ne conserve l'historique d'une exécution Standard terminée que 90 jours : l'enregistrement de l'examen doit être écrit ailleurs. Une tâche qui l'écrit dans S3 avec Object Lock en mode conformité garde chaque objet immuable pendant la durée de conservation, même pour l'utilisateur racine, et les objets restent récupérables à tout moment."
  options:
    a:
      en: "The execution history of a Standard workflow can be retrieved for only 90 days after the execution closes, far short of 7 years."
      fr: "L'historique d'exécution d'un flux Standard ne peut être récupéré que 90 jours après la fin de l'exécution, bien loin de 7 ans."
    b:
      en: "The 90-day history retention cannot be extended; AWS Support can only reduce it to 30 days."
      fr: "La conservation de 90 jours de l'historique ne peut pas être étendue ; AWS Support peut seulement la réduire à 30 jours."
    d:
      en: "Express workflows do not support the .waitForTaskToken callback pattern and end after 5 minutes, and log group retention does not stop an administrator from deleting the log group."
      fr: "Les flux Express ne prennent pas en charge le modèle de rappel .waitForTaskToken et s'arrêtent après 5 minutes, et la conservation d'un groupe de journaux n'empêche pas un administrateur de le supprimer."
references:
  - title: Step Functions service quotas
    url: https://docs.aws.amazon.com/step-functions/latest/dg/service-quotas.html
