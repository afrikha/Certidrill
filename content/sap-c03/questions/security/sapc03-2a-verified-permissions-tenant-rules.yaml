id: sapc03-2a-verified-permissions-tenant-rules
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany sells a multi-tenant document management application. Users sign in to an Amazon Cognito user pool, and each user has a tenant ID attribute and belongs to a Viewer, Editor or Admin group. The application exposes a REST API in Amazon API Gateway. Users must act only on documents of their own tenant, and editors may change only the documents that they own, while admins may change any document of their tenant. The rules change every month, and product managers want to review them without reading application code. The company wants to move authorization out of the application code with the least custom development.

    Which solution will meet these requirements?
  fr: |
    AnyCompany vend une application mutualisée de gestion de documents. Les utilisateurs se connectent à un groupe d'utilisateurs Amazon Cognito ; chaque utilisateur possède un attribut d'ID de locataire et appartient à un groupe Viewer, Editor ou Admin. L'application expose une API REST Amazon API Gateway. Les utilisateurs ne doivent agir que sur les documents de leur propre locataire ; les éditeurs ne peuvent modifier que les documents dont ils sont propriétaires, alors que les administrateurs peuvent modifier tout document de leur locataire. Les règles changent chaque mois, et les chefs de produit veulent les relire sans lire le code de l'application. L'entreprise veut sortir l'autorisation du code de l'application avec le moins de développement personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Cognito identity pool that maps each tenant and group combination to an IAM role, and enable IAM authorization on the API methods with resource paths that contain the tenant ID."
        fr: "Créer un groupe d'identités Cognito qui associe chaque combinaison de locataire et de groupe à un rôle IAM, et activer l'autorisation IAM sur les méthodes de l'API avec des chemins de ressources qui contiennent l'ID de locataire."
    - id: b
      text:
        en: "Write a Lambda authorizer that reads the rules from an Amazon DynamoDB table, evaluates the tenant, group and ownership conditions in code, and returns an IAM policy to API Gateway."
        fr: "Écrire un mécanisme d'autorisation Lambda qui lit les règles dans une table Amazon DynamoDB, évalue dans le code les conditions de locataire, de groupe et de propriété, et renvoie une politique IAM à API Gateway."
    - id: c
      text:
        en: "Create an Amazon Verified Permissions policy store with the user pool as identity source, write the rules as Cedar policies, and use a Lambda authorizer that calls Verified Permissions."
        fr: "Créer un magasin de politiques Amazon Verified Permissions avec le groupe d'utilisateurs comme source d'identité, écrire les règles en politiques Cedar, et utiliser un mécanisme d'autorisation Lambda qui appelle Verified Permissions."
    - id: d
      text:
        en: "Define a custom scope for each tenant and operation in a user pool resource server, add the scopes to the users' access tokens, and require the matching scopes on each API method."
        fr: "Définir une portée personnalisée par locataire et par opération dans un serveur de ressources du groupe d'utilisateurs, ajouter les portées aux jetons d'accès des utilisateurs, et exiger les portées correspondantes sur chaque méthode de l'API."
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Verified Permissions evaluates Cedar policies outside the application, so rules can be reviewed and changed without code changes. A Cognito user pool identity source maps token claims and groups to principal attributes, and an API-linked policy store can generate the Lambda authorizer that connects API Gateway to Verified Permissions."
    fr: "Amazon Verified Permissions évalue des politiques Cedar en dehors de l'application : les règles peuvent être relues et modifiées sans changer le code. Une source d'identité de groupe d'utilisateurs Cognito associe les revendications et les groupes du jeton aux attributs du principal, et un magasin de politiques lié à une API peut générer le mécanisme d'autorisation Lambda qui relie API Gateway à Verified Permissions."
  options:
    a:
      en: "IAM authorization on API paths cannot check document ownership, and one role per tenant and group combination does not scale for a multi-tenant product."
      fr: "L'autorisation IAM sur les chemins d'API ne peut pas vérifier la propriété des documents, et un rôle par combinaison de locataire et de groupe ne passe pas à l'échelle pour un produit mutualisé."
    b:
      en: "The rules would still be evaluated in custom code, which product managers cannot review and which the company must build and maintain."
      fr: "Les règles seraient toujours évaluées dans du code personnalisé, que les chefs de produit ne peuvent pas relire et que l'entreprise doit développer et maintenir."
    d:
      en: "Scopes describe operations granted to a client; they cannot express per-document ownership, and one scope per tenant multiplies scopes with every new tenant."
      fr: "Les portées décrivent les opérations accordées à un client ; elles ne peuvent pas exprimer la propriété de chaque document, et une portée par locataire multiplie les portées à chaque nouveau locataire."
references:
  - title: What is Amazon Verified Permissions?
    url: https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/what-is-avp.html
  - title: API-linked policy stores
    url: https://docs.aws.amazon.com/verifiedpermissions/latest/userguide/policy-stores_api-userpool.html
