id: sapc03-2a-ssm-hybrid-and-roles-anywhere
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 400 on-premises Linux servers that connect to AWS over AWS Direct Connect. The operations team must patch the servers and run commands on them centrally with AWS Systems Manager Patch Manager and Run Command. An application on the same servers must upload files to Amazon S3 with permissions that are specific to the application and separate from the permissions of the Systems Manager agent. No long-term AWS credentials may be stored on the servers. The enterprise PKI already issues a certificate to every server.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 400 serveurs Linux sur site connectés à AWS par AWS Direct Connect. L'équipe d'exploitation doit appliquer les correctifs et exécuter des commandes sur les serveurs de manière centrale avec AWS Systems Manager Patch Manager et Run Command. Une application des mêmes serveurs doit charger des fichiers dans Amazon S3 avec des autorisations propres à l'application et distinctes de celles de l'agent Systems Manager. Aucune information d'identification AWS à long terme ne doit être stockée sur les serveurs. La PKI d'entreprise émet déjà un certificat pour chaque serveur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Install SSM Agent with the access keys of an IAM user that has Systems Manager and S3 permissions, and have the application use the same access keys."
        fr: "Installer SSM Agent avec les clés d'accès d'un utilisateur IAM qui possède des autorisations Systems Manager et S3, et faire utiliser les mêmes clés d'accès par l'application."
    - id: b
      text:
        en: "Register the servers as managed nodes with a Systems Manager hybrid activation, and have the application obtain credentials for its own role through IAM Roles Anywhere with the enterprise CA."
        fr: "Enregistrer les serveurs comme nœuds gérés avec une activation hybride Systems Manager, et faire obtenir par l'application des informations d'identification pour son propre rôle via IAM Roles Anywhere avec la CA d'entreprise."
    - id: c
      text:
        en: "Configure IAM Roles Anywhere for the application, and run Patch Manager and Run Command against the servers' IP addresses without registering them in Systems Manager."
        fr: "Configurer IAM Roles Anywhere pour l'application, et exécuter Patch Manager et Run Command sur les adresses IP des serveurs sans les enregistrer dans Systems Manager."
    - id: d
      text:
        en: "Register the servers with a Systems Manager hybrid activation, and add the application's S3 permissions to the IAM service role of the hybrid activation."
        fr: "Enregistrer les serveurs avec une activation hybride Systems Manager, et ajouter les autorisations S3 de l'application au rôle de service IAM de l'activation hybride."
answer: { optionId: b }
explanation:
  correct:
    en: "A hybrid activation registers on-premises machines as managed nodes, which Patch Manager and Run Command require, and the agent uses the activation's IAM service role. IAM Roles Anywhere gives the application temporary credentials for a separate role based on the server's existing certificate, so no long-term keys are stored and the two sets of permissions stay separate."
    fr: "Une activation hybride enregistre les machines sur site comme nœuds gérés, ce qu'exigent Patch Manager et Run Command, et l'agent utilise le rôle de service IAM de l'activation. IAM Roles Anywhere fournit à l'application des informations d'identification temporaires pour un rôle distinct à partir du certificat existant du serveur : aucune clé à long terme n'est stockée et les deux ensembles d'autorisations restent distincts."
  options:
    a:
      en: "IAM user access keys are long-term credentials, and sharing them mixes the agent's and the application's permissions."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, et leur partage mélange les autorisations de l'agent et celles de l'application."
    c:
      en: "Patch Manager and Run Command act on managed nodes; servers that are not registered with Systems Manager cannot be targeted."
      fr: "Patch Manager et Run Command agissent sur des nœuds gérés ; des serveurs non enregistrés dans Systems Manager ne peuvent pas être ciblés."
    d:
      en: "Adding the application's permissions to the activation's service role mixes them with the agent's permissions, which the requirement forbids."
      fr: "Ajouter les autorisations de l'application au rôle de service de l'activation les mélange avec celles de l'agent, ce que l'exigence interdit."
references:
  - title: Managing nodes in hybrid and multicloud environments with Systems Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-hybrid-multicloud.html
  - title: The IAM Roles Anywhere trust model
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
