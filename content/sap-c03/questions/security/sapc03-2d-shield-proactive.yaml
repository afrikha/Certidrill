id: sapc03-2d-shield-proactive
objective: "2.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany sells concert tickets through a public website and API. Amazon CloudFront distributions deliver the website, and the API runs behind an Application Load Balancer that clients call directly. The company has an AWS Enterprise Support plan but no 24/7 security operations center. Its threat model rates a large DDoS attack during a ticket sale as the highest availability risk. The approved mitigation requires AWS DDoS specialists to contact the company's on-call engineer as soon as an attack affects the availability of either the website or the API, and to start troubleshooting before the company reaches them. Web request floods must also be mitigated with rate limiting.

    Which solution will meet these requirements?
  fr: |
    AnyCompany vend des billets de concert par un site web et une API publics. Des distributions Amazon CloudFront diffusent le site web, et l'API s'exécute derrière un Application Load Balancer que les clients appellent directement. L'entreprise dispose d'un plan AWS Enterprise Support mais pas d'un centre d'opérations de sécurité 24 h/24 et 7 j/7. Son modèle de menaces classe une attaque DDoS de grande ampleur pendant une mise en vente comme le risque de disponibilité le plus élevé. La mesure d'atténuation approuvée exige que des spécialistes DDoS d'AWS contactent l'ingénieur d'astreinte de l'entreprise dès qu'une attaque affecte la disponibilité du site web ou de l'API, et commencent le dépannage avant que l'entreprise ne les joigne. Les inondations de requêtes web doivent aussi être atténuées par une limitation de débit.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Subscribe to AWS Shield Advanced and protect the distributions and the load balancer, attach AWS WAF web ACLs with rate-based rules, and give the Shield Response Team the on-call contact details.", fr: "S'abonner à AWS Shield Advanced et protéger les distributions et l'équilibreur de charge, associer des listes ACL web AWS WAF avec des règles basées sur le débit, et donner à la Shield Response Team les coordonnées de l'astreinte." }
    - id: b
      text: { en: "Rely on AWS Shield Standard, attach AWS WAF web ACLs with rate-based rules, and create Amazon CloudWatch alarms on the WAF metrics that page the on-call engineer through Amazon SNS.", fr: "S'appuyer sur AWS Shield Standard, associer des listes ACL web AWS WAF avec des règles basées sur le débit, et créer des alarmes Amazon CloudWatch sur les métriques WAF qui alertent l'ingénieur d'astreinte par Amazon SNS." }
    - id: c
      text: { en: "Subscribe to AWS Shield Advanced, protect the distributions and the load balancer, associate an Amazon Route 53 health check with each protection, attach AWS WAF web ACLs with rate-based rules, and enable proactive engagement with the on-call contact.", fr: "S'abonner à AWS Shield Advanced, protéger les distributions et l'équilibreur de charge, associer un contrôle de santé Amazon Route 53 à chaque protection, associer des listes ACL web AWS WAF avec des règles basées sur le débit, et activer l'engagement proactif avec le contact d'astreinte." }
    - id: d
      text: { en: "Subscribe to AWS Shield Advanced and protect only the load balancer, associate an Amazon Route 53 health check with it, attach an AWS WAF web ACL with rate-based rules, and enable proactive engagement with the on-call contact.", fr: "S'abonner à AWS Shield Advanced et protéger uniquement l'équilibreur de charge, lui associer un contrôle de santé Amazon Route 53, associer une liste ACL web AWS WAF avec des règles basées sur le débit, et activer l'engagement proactif avec le contact d'astreinte." }
answer: { optionId: c }
explanation:
  correct:
    en: "With proactive engagement, the Shield Response Team contacts the company directly when a detected event affects the health of a protected resource, which is the fastest response model. It requires a Business or Enterprise Support plan, an AWS WAF (v2) web ACL where WAF is used, contacts, and a Route 53 health check associated with each protected resource, here both the CloudFront distributions and the Application Load Balancer."
    fr: "Avec l'engagement proactif, la Shield Response Team contacte directement l'entreprise lorsqu'un événement détecté affecte la santé d'une ressource protégée, ce qui est le modèle de réponse le plus rapide. Il exige un plan Business ou Enterprise Support, une liste ACL web AWS WAF (v2) lorsque WAF est utilisé, des contacts et un contrôle de santé Route 53 associé à chaque ressource protégée, ici les distributions CloudFront et l'Application Load Balancer."
  options:
    a:
      en: "Providing contacts alone keeps the reactive model in which the company must open a case; without proactive engagement and associated Route 53 health checks, the SRT does not call the company first."
      fr: "Fournir seulement des contacts conserve le modèle réactif dans lequel l'entreprise doit ouvrir un dossier ; sans engagement proactif ni contrôles de santé Route 53 associés, la SRT n'appelle pas l'entreprise la première."
    b:
      en: "Shield Standard gives automatic network-layer protection but no access to the Shield Response Team, so no AWS specialist contacts the company during an attack."
      fr: "Shield Standard offre une protection automatique au niveau réseau mais aucun accès à la Shield Response Team : aucun spécialiste AWS ne contacte l'entreprise pendant une attaque."
    d:
      en: "Proactive engagement applies only to Shield Advanced protections that have an associated health check; the CloudFront distributions are not protected, so an attack on the website would not trigger it."
      fr: "L'engagement proactif ne s'applique qu'aux protections Shield Advanced qui ont un contrôle de santé associé ; les distributions CloudFront ne sont pas protégées, donc une attaque contre le site web ne le déclencherait pas."
references:
  - title: Setting up proactive engagement for the SRT to contact you directly
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-srt-proactive-engagement.html
