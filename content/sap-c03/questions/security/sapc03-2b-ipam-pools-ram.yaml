id: sapc03-2b-ipam-pools-ram
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 accounts in AWS Organizations, and teams often create VPCs with overlapping CIDR blocks because they choose address ranges themselves. The network team wants to manage the address space centrally with Amazon VPC IP Address Manager (IPAM) from the network account. Teams in the Workloads OU must be able to allocate CIDRs for their VPCs from pools that the network team defines. The IPAM home Region is eu-west-1, and the pools are in eu-west-1 and us-east-1.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany dispose de 300 comptes dans AWS Organizations, et les équipes créent souvent des VPC dont les blocs CIDR se chevauchent parce qu'elles choisissent elles-mêmes les plages d'adresses. L'équipe réseau veut gérer l'espace d'adressage de façon centralisée avec Amazon VPC IP Address Manager (IPAM) depuis le compte réseau. Les équipes de l'OU Workloads doivent pouvoir allouer les CIDR de leurs VPC à partir de pools définis par l'équipe réseau. La Région d'origine de l'IPAM est eu-west-1, et les pools se trouvent dans eu-west-1 et us-east-1.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Integrate IPAM with AWS Organizations, delegate IPAM administration to the network account, and create the pools in that account.", fr: "Intégrer IPAM à AWS Organizations, déléguer l'administration d'IPAM au compte réseau, et créer les pools dans ce compte." } }
    - { id: b, text: { en: "Share the us-east-1 pool from us-east-1 and the eu-west-1 pool from eu-west-1, each in a resource share created in the pool's own Region.", fr: "Partager le pool de us-east-1 depuis us-east-1 et celui d'eu-west-1 depuis eu-west-1, chacun dans un partage de ressources créé dans la Région du pool." } }
    - { id: c, text: { en: "In eu-west-1, share both pools with the Workloads OU in one AWS RAM resource share that uses the AWSRAMDefaultPermissionsIpamPool permission.", fr: "Dans eu-west-1, partager les deux pools avec l'OU Workloads dans un seul partage de ressources AWS RAM qui utilise l'autorisation AWSRAMDefaultPermissionsIpamPool." } }
    - { id: d, text: { en: "Create managed prefix lists with the pool CIDRs, and share them with the Workloads OU so that teams create their VPCs from the lists.", fr: "Créer des listes de préfixes gérées avec les CIDR des pools, et les partager avec l'OU Workloads afin que les équipes créent leurs VPC à partir de ces listes." } }
    - { id: e, text: { en: "Create a separate IPAM in each workload account, and import the network team's address ranges into each IPAM as BYOIP CIDRs.", fr: "Créer un IPAM distinct dans chaque compte de charge de travail, et importer les plages d'adresses de l'équipe réseau dans chaque IPAM en tant que CIDR BYOIP." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "An IPAM pool can be shared through AWS RAM only when IPAM is integrated with AWS Organizations and resource sharing with Organizations is enabled. The share must be created in the IPAM home Region, it can contain several pools, and the AWSRAMDefaultPermissionsIpamPool permission lets principals allocate and release CIDRs from the pools."
    fr: "Un pool IPAM ne peut être partagé via AWS RAM que si IPAM est intégré à AWS Organizations et que le partage de ressources avec Organizations est activé. Le partage doit être créé dans la Région d'origine de l'IPAM, il peut contenir plusieurs pools, et l'autorisation AWSRAMDefaultPermissionsIpamPool permet aux principaux d'allouer et de libérer des CIDR dans les pools."
  options:
    b:
      en: "AWS RAM sharing of IPAM pools is available only in the IPAM home Region, not in the Region of each pool."
      fr: "Le partage AWS RAM de pools IPAM n'est disponible que dans la Région d'origine de l'IPAM, pas dans la Région de chaque pool."
    d:
      en: "Prefix lists group CIDRs for security groups and route tables; they do not allocate non-overlapping VPC CIDRs."
      fr: "Les listes de préfixes regroupent des CIDR pour les groupes de sécurité et les tables de routage ; elles n'allouent pas de CIDR de VPC sans chevauchement."
    e:
      en: "Separate IPAMs per account cannot coordinate allocations, so overlaps would remain, and the design multiplies administration."
      fr: "Des IPAM distincts par compte ne peuvent pas coordonner les allocations : les chevauchements subsisteraient, et la conception multiplie l'administration."
references:
  - title: Share an IPAM pool using AWS RAM
    url: https://docs.aws.amazon.com/vpc/latest/ipam/share-pool-ipam.html
