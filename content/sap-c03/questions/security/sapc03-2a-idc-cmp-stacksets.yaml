id: sapc03-2a-idc-cmp-stacksets
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany uses AWS Control Tower Account Factory to create about 10 new AWS accounts each month in a Workloads OU. Developers get access through an AWS IAM Identity Center permission set named AppDeveloper that references a customer managed policy named DeveloperAccess. Account teams also attach the same DeveloperAccess policy to the IAM roles that their CI pipelines use, so the policy must exist as an IAM managed policy in every workload account, with identical content. Assignments of AppDeveloper to new accounts fail until someone creates the policy manually. The company wants new accounts to receive the policy automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany utilise AWS Control Tower Account Factory pour créer environ 10 nouveaux comptes AWS par mois dans une OU Workloads. Les développeurs obtiennent l'accès par un ensemble d'autorisations (permission set) AWS IAM Identity Center nommé AppDeveloper qui référence une politique gérée par le client nommée DeveloperAccess. Les équipes de compte attachent aussi la même politique DeveloperAccess aux rôles IAM utilisés par leurs pipelines CI : la politique doit donc exister comme politique gérée IAM dans chaque compte de charge de travail, avec un contenu identique. Les affectations d'AppDeveloper aux nouveaux comptes échouent tant que quelqu'un n'a pas créé la politique manuellement. L'entreprise veut que les nouveaux comptes reçoivent la politique automatiquement.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Replace the customer managed policy in AppDeveloper with an inline policy that has the same content, and remove DeveloperAccess from the workload accounts."
        fr: "Remplacer la politique gérée par le client d'AppDeveloper par une politique en ligne au contenu identique, et supprimer DeveloperAccess des comptes de charge de travail."
    - id: b
      text:
        en: "Create an Amazon EventBridge rule for the CreateManagedAccount lifecycle event that invokes an AWS Lambda function, which assumes a role in the new account and creates the policy."
        fr: "Créer une règle Amazon EventBridge pour l'événement de cycle de vie CreateManagedAccount qui appelle une fonction AWS Lambda, laquelle endosse un rôle dans le nouveau compte et crée la politique."
    - id: c
      text:
        en: "Create the DeveloperAccess policy in the management account and share it with the Workloads OU through an AWS Resource Access Manager (AWS RAM) resource share."
        fr: "Créer la politique DeveloperAccess dans le compte de gestion et la partager avec l'OU Workloads par un partage de ressources AWS Resource Access Manager (AWS RAM)."
    - id: d
      text:
        en: "Deploy the DeveloperAccess policy with an AWS CloudFormation StackSet that uses service-managed permissions, targets the Workloads OU, and has automatic deployment enabled."
        fr: "Déployer la politique DeveloperAccess avec un StackSet AWS CloudFormation qui utilise des autorisations gérées par le service, cible l'OU Workloads et dont le déploiement automatique est activé."
answer: { optionId: d }
explanation:
  correct:
    en: "A permission set that references a customer managed policy requires an IAM policy with the same name and path in every account where it is assigned. A service-managed StackSet with automatic deployment creates the policy in every account that joins the target OU, with identical content and no custom code to maintain."
    fr: "Un ensemble d'autorisations qui référence une politique gérée par le client exige une politique IAM de même nom et de même chemin dans chaque compte où il est affecté. Un StackSet géré par le service avec déploiement automatique crée la politique dans chaque compte qui rejoint l'OU cible, avec un contenu identique et sans code personnalisé à maintenir."
  options:
    a:
      en: "An inline policy would fix the assignments, but the CI roles in each account need DeveloperAccess as an IAM managed policy, which this option removes."
      fr: "Une politique en ligne réglerait les affectations, mais les rôles CI de chaque compte ont besoin de DeveloperAccess comme politique gérée IAM, que cette option supprime."
    b:
      en: "The event-driven function works but adds custom code, cross-account roles and error handling to maintain, which is more overhead than a StackSet with automatic deployment."
      fr: "La fonction pilotée par les événements fonctionne mais ajoute du code personnalisé, des rôles intercomptes et une gestion des erreurs à maintenir, ce qui représente plus de charge qu'un StackSet avec déploiement automatique."
    c:
      en: "IAM managed policies are not resources that AWS RAM can share; each account needs its own copy of the policy."
      fr: "Les politiques gérées IAM ne font pas partie des ressources qu'AWS RAM peut partager ; chaque compte a besoin de sa propre copie de la politique."
references:
  - title: Custom permissions for AWS managed and customer managed policies
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetcustom.html
