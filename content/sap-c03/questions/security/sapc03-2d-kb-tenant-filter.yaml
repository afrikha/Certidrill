id: sapc03-2d-kb-tenant-filter
objective: "2.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A SaaS provider offers a document assistant to 800 business customers. To limit cost and operations, all tenants share one Amazon Bedrock knowledge base whose Amazon S3 data source holds every tenant's documents, and the vector store supports metadata filtering. Users sign in through an Amazon Cognito user pool, and their ID token contains a custom tenant_id claim. A backend service calls the Retrieve and RetrieveAndGenerate APIs for each question. A user must never receive passages from another tenant's documents, even if the user writes a question that tries to change the search criteria. Users may optionally narrow results by document type.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS propose un assistant documentaire à 800 entreprises clientes. Pour limiter les coûts et l'exploitation, tous les locataires partagent une seule base de connaissances Amazon Bedrock dont la source de données Amazon S3 contient les documents de chaque locataire, et le magasin vectoriel prend en charge le filtrage par métadonnées. Les utilisateurs se connectent par un groupe d'utilisateurs Amazon Cognito, et leur jeton d'ID contient une revendication personnalisée tenant_id. Un service backend appelle les API Retrieve et RetrieveAndGenerate pour chaque question. Un utilisateur ne doit jamais recevoir de passages des documents d'un autre locataire, même s'il rédige une question qui tente de modifier les critères de recherche. Les utilisateurs peuvent, s'ils le souhaitent, restreindre les résultats par type de document.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure implicit filtering with a metadata schema that describes the tenant_id and document type attributes, so that the model derives the tenant filter from each question.", fr: "Configurer le filtrage implicite avec un schéma de métadonnées qui décrit les attributs tenant_id et type de document, afin que le modèle déduise le filtre de locataire de chaque question." }
    - id: b
      text: { en: "Create one IAM role per tenant that allows bedrock:Retrieve on the knowledge base, and have the backend assume the role of the user's tenant before each call.", fr: "Créer un rôle IAM par locataire qui autorise bedrock:Retrieve sur la base de connaissances, et faire assumer par le backend le rôle du locataire de l'utilisateur avant chaque appel." }
    - id: c
      text: { en: "Add a tenant_id attribute in a metadata file for each document, and have the backend combine an equals filter on the verified token's tenant_id with any user filter in an andAll filter.", fr: "Ajouter un attribut tenant_id dans un fichier de métadonnées de chaque document, et faire combiner par le backend un filtre equals sur le tenant_id du jeton vérifié avec un éventuel filtre utilisateur dans un filtre andAll." }
    - id: d
      text: { en: "Attach a guardrail with a denied topic for each tenant's company name to the RetrieveAndGenerate calls, so that passages that mention another tenant are blocked.", fr: "Associer aux appels RetrieveAndGenerate un guardrail avec un sujet refusé pour le nom de chaque entreprise locataire, afin de bloquer les passages qui mentionnent un autre locataire." }
answer: { optionId: c }
explanation:
  correct:
    en: "Knowledge base retrieval supports metadata filters on attributes supplied in each document's metadata file. Setting the tenant filter on the server from the verified token claim, and joining any user-supplied filter with andAll, means user input can only narrow the results and never reach another tenant's documents."
    fr: "La récupération des bases de connaissances prend en charge des filtres de métadonnées sur des attributs fournis dans le fichier de métadonnées de chaque document. Définir le filtre de locataire côté serveur à partir de la revendication du jeton vérifié, et joindre tout filtre fourni par l'utilisateur avec andAll, signifie que l'entrée utilisateur ne peut que restreindre les résultats, jamais atteindre les documents d'un autre locataire."
  options:
    a:
      en: "Implicit filtering lets a model generate the filter from the question, so a crafted question can change or omit the tenant criterion; it is a relevance feature, not an access control."
      fr: "Le filtrage implicite laisse un modèle générer le filtre à partir de la question : une question habilement rédigée peut modifier ou omettre le critère de locataire. C'est une fonction de pertinence, pas un contrôle d'accès."
    b:
      en: "IAM authorizes access to the knowledge base as a whole; every tenant role could retrieve any document in it, so per-tenant roles do not isolate tenants."
      fr: "IAM autorise l'accès à la base de connaissances dans son ensemble ; chaque rôle de locataire pourrait récupérer n'importe quel document : des rôles par locataire n'isolent pas les locataires."
    d:
      en: "Denied topics match subjects in text, not document ownership; a passage from another tenant that does not name the company would pass, and 800 topics exceed what a guardrail supports."
      fr: "Les sujets refusés reconnaissent des sujets dans le texte, pas la propriété des documents ; un passage d'un autre locataire qui ne cite pas l'entreprise passerait, et 800 sujets dépassent ce qu'un guardrail prend en charge."
references:
  - title: Configure and customize queries and response generation
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/kb-test-config.html
  - title: Block denied topics to help remove harmful content
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
