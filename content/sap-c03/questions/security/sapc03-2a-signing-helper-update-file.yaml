id: sapc03-2a-signing-helper-update-file
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs a third-party backup agent on 200 on-premises Linux servers. The agent runs continuously and copies data to Amazon S3. It can read AWS credentials only from the shared credentials file, and it supports neither the credential_process setting nor an instance metadata endpoint. Today, the file contains access keys of an IAM user. The company is moving the servers to IAM Roles Anywhere with certificates from its enterprise CA, and the agent must never run with expired credentials.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute un agent de sauvegarde tiers sur 200 serveurs Linux sur site. L'agent s'exécute en permanence et copie des données dans Amazon S3. Il ne sait lire les informations d'identification AWS que dans le fichier d'informations d'identification partagé, et il ne prend en charge ni le paramètre credential_process ni un point de terminaison de métadonnées d'instance. Aujourd'hui, le fichier contient les clés d'accès d'un utilisateur IAM. L'entreprise fait passer les serveurs à IAM Roles Anywhere avec des certificats de sa CA d'entreprise, et l'agent ne doit jamais s'exécuter avec des informations d'identification expirées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run the Roles Anywhere credential helper with the update command as a system service, so that it writes temporary credentials to the credentials file and refreshes them before they expire."
        fr: "Exécuter l'assistant d'informations d'identification Roles Anywhere avec la commande update comme service système, afin qu'il écrive les informations d'identification temporaires dans le fichier et les actualise avant leur expiration."
    - id: b
      text:
        en: "Add a profile to the AWS config file whose credential_process runs the credential helper with the credential-process command, and point the agent at that profile."
        fr: "Ajouter au fichier de configuration AWS un profil dont le credential_process exécute l'assistant d'informations d'identification avec la commande credential-process, et diriger l'agent vers ce profil."
    - id: c
      text:
        en: "Run the credential helper with the serve command, which exposes a local endpoint compatible with IMDSv2, and point the agent at that endpoint."
        fr: "Exécuter l'assistant d'informations d'identification avec la commande serve, qui expose un point de terminaison local compatible avec IMDSv2, et diriger l'agent vers ce point de terminaison."
    - id: d
      text:
        en: "Schedule a daily cron job that runs the credential-process command with a 12-hour session and writes its output to the credentials file."
        fr: "Planifier une tâche cron quotidienne qui exécute la commande credential-process avec une session de 12 heures et écrit sa sortie dans le fichier d'informations d'identification."
answer: { optionId: a }
explanation:
  correct:
    en: "The update command of the credential helper obtains temporary credentials from IAM Roles Anywhere and writes them to the AWS credentials file, then refreshes them about five minutes before they expire. An agent that reads only the credentials file therefore always finds valid temporary credentials."
    fr: "La commande update de l'assistant d'informations d'identification obtient des informations d'identification temporaires d'IAM Roles Anywhere, les écrit dans le fichier d'informations d'identification AWS, puis les actualise environ cinq minutes avant leur expiration. Un agent qui ne lit que ce fichier y trouve donc toujours des informations d'identification temporaires valides."
  options:
    b:
      en: "The agent does not support credential_process, so it would never call the helper."
      fr: "L'agent ne prend pas en charge credential_process : il n'appellerait jamais l'assistant."
    c:
      en: "The serve command vends credentials through a local metadata-style endpoint, which the agent cannot use."
      fr: "La commande serve fournit les informations d'identification par un point de terminaison local de type métadonnées, que l'agent ne peut pas utiliser."
    d:
      en: "Credentials from a 12-hour session written once a day expire 12 hours before the next run, so the agent would run with expired credentials."
      fr: "Des informations d'identification d'une session de 12 heures écrites une fois par jour expirent 12 heures avant l'exécution suivante : l'agent fonctionnerait avec des informations expirées."
references:
  - title: Get temporary security credentials from IAM Roles Anywhere
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/credential-helper.html
