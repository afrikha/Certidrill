id: sapc03-2a-idc-saml-customer-app
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany gives its employees access to 50 AWS accounts through an organization instance of AWS IAM Identity Center, with Microsoft Entra ID as the identity source. A business unit wants single sign-on to a third-party ticketing application that supports SAML 2.0. The business unit enabled an account instance of IAM Identity Center in one of its member accounts for this purpose and created its users manually. The security team wants employees to see the ticketing application in the same AWS access portal that they use for AWS accounts, with the same users and groups. Access must be managed in one IAM Identity Center instance.

    Which solution will meet these requirements?
  fr: |
    AnyCompany donne à ses employés l'accès à 50 comptes AWS via une instance d'organisation d'AWS IAM Identity Center, avec Microsoft Entra ID comme source d'identité. Une unité opérationnelle veut l'authentification unique vers une application tierce de gestion de tickets qui prend en charge SAML 2.0. Pour cela, l'unité a activé une instance de compte d'IAM Identity Center dans l'un de ses comptes membres et y a créé ses utilisateurs manuellement. L'équipe de sécurité veut que les employés voient l'application de tickets dans le même portail d'accès AWS que celui qu'ils utilisent pour les comptes AWS, avec les mêmes utilisateurs et groupes. L'accès doit être géré dans une seule instance d'IAM Identity Center.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Connect the account instance to Entra ID with SCIM so that its users match the corporate users, and add the ticketing application to the account instance as a customer managed SAML 2.0 application."
        fr: "Connecter l'instance de compte à Entra ID avec SCIM pour que ses utilisateurs correspondent aux utilisateurs de l'entreprise, et ajouter l'application de tickets à l'instance de compte comme application SAML 2.0 gérée par le client."
    - id: b
      text:
        en: "Create an IAM SAML identity provider in the member account for the ticketing application, and give the business unit's users an IAM role that can open the application."
        fr: "Créer un fournisseur d'identité SAML IAM dans le compte membre pour l'application de tickets, et donner aux utilisateurs de l'unité un rôle IAM capable d'ouvrir l'application."
    - id: c
      text:
        en: "Create an Amazon Cognito user pool that federates with Entra ID through SAML 2.0, and configure the user pool as the identity provider of the ticketing application."
        fr: "Créer un groupe d'utilisateurs Amazon Cognito fédéré avec Entra ID via SAML 2.0, et configurer ce groupe d'utilisateurs comme fournisseur d'identité de l'application de tickets."
    - id: d
      text:
        en: "Add the ticketing application to the organization instance as a customer managed SAML 2.0 application, assign the Entra ID groups to it, and then remove the account instance."
        fr: "Ajouter l'application de tickets à l'instance d'organisation comme application SAML 2.0 gérée par le client, lui affecter les groupes Entra ID, puis supprimer l'instance de compte."
answer: { optionId: d }
explanation:
  correct:
    en: "Customer managed SAML 2.0 applications are supported by organization instances, which also provide the AWS access portal for AWS accounts. Adding the application to the existing organization instance reuses the Entra ID users and groups and shows the application next to the accounts, so access is managed in one instance."
    fr: "Les applications SAML 2.0 gérées par le client sont prises en charge par les instances d'organisation, qui fournissent aussi le portail d'accès AWS pour les comptes AWS. Ajouter l'application à l'instance d'organisation existante réutilise les utilisateurs et groupes Entra ID et affiche l'application à côté des comptes : l'accès est géré dans une seule instance."
  options:
    a:
      en: "Account instances do not support customer managed SAML 2.0 applications, and keeping a second instance violates the single-instance requirement."
      fr: "Les instances de compte ne prennent pas en charge les applications SAML 2.0 gérées par le client, et conserver une seconde instance enfreint l'exigence d'instance unique."
    b:
      en: "An IAM SAML identity provider lets an external IdP federate into AWS; it cannot act as the identity provider of a third-party application."
      fr: "Un fournisseur d'identité SAML IAM permet à un IdP externe de se fédérer dans AWS ; il ne peut pas jouer le rôle de fournisseur d'identité d'une application tierce."
    c:
      en: "A Cognito user pool is designed for customer-facing applications and would not show the application in the workforce's AWS access portal."
      fr: "Un groupe d'utilisateurs Cognito est conçu pour les applications destinées aux clients et n'afficherait pas l'application dans le portail d'accès AWS des employés."
references:
  - title: Organization and account instances of IAM Identity Center
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/identity-center-instances.html
