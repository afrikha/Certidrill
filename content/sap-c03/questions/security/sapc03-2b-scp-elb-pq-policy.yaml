id: sapc03-2b-scp-elb-pq-policy
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 80 member accounts in AWS Organizations. Its post-quantum plan requires that every HTTPS listener on Application Load Balancers and every TLS listener on Network Load Balancers use one of three approved security policies that include hybrid ML-KEM key exchange. Teams create and change listeners with the console, the AWS CLI, AWS CloudFormation, and Terraform. Noncompliant listeners must be blocked when they are created or modified, not only reported afterward. Member account administrators must not be able to bypass the control.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 80 comptes membres dans AWS Organizations. Son plan post-quantique exige que chaque écouteur HTTPS des Application Load Balancers et chaque écouteur TLS des Network Load Balancers utilise l'une de trois politiques de sécurité approuvées qui incluent l'échange de clés hybride ML-KEM. Les équipes créent et modifient les écouteurs avec la console, l'AWS CLI, AWS CloudFormation et Terraform. Les écouteurs non conformes doivent être bloqués lors de leur création ou de leur modification, et pas seulement signalés après coup. Les administrateurs des comptes membres ne doivent pas pouvoir contourner le contrôle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an AWS Config organization rule that flags listeners whose security policy is not approved, with automatic remediation that applies an approved policy.", fr: "Déployer une règle d'organisation AWS Config qui signale les écouteurs dont la politique de sécurité n'est pas approuvée, avec une correction automatique qui applique une politique approuvée." } }
    - { id: b, text: { en: "Attach an SCP that denies CreateListener and ModifyListener for HTTPS and TLS listeners when the elasticloadbalancing:SecurityPolicy key is absent or is not an approved policy.", fr: "Attacher une SCP qui refuse CreateListener et ModifyListener pour les écouteurs HTTPS et TLS lorsque la clé elasticloadbalancing:SecurityPolicy est absente ou ne correspond pas à une politique approuvée." } }
    - { id: c, text: { en: "Enable an AWS Control Tower proactive control that checks the SslPolicy property of listener resources in CloudFormation templates before they are deployed.", fr: "Activer un contrôle proactif AWS Control Tower qui vérifie la propriété SslPolicy des ressources d'écouteur dans les modèles CloudFormation avant leur déploiement." } }
    - { id: d, text: { en: "Attach an RCP that denies CreateListener and ModifyListener when the elasticloadbalancing:SecurityPolicy key is not one of the approved policies.", fr: "Attacher une RCP qui refuse CreateListener et ModifyListener lorsque la clé elasticloadbalancing:SecurityPolicy ne correspond pas à l'une des politiques approuvées." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Elastic Load Balancing defines the elasticloadbalancing:SecurityPolicy condition key for CreateListener and ModifyListener, so an SCP can block any request, from any tool, that asks for another policy. Denying requests without the key also matters, because a listener created by the CLI or CloudFormation without a policy gets ELBSecurityPolicy-2016-08, and member account administrators cannot override an SCP."
    fr: "Elastic Load Balancing définit la clé de condition elasticloadbalancing:SecurityPolicy pour CreateListener et ModifyListener : une SCP peut donc bloquer toute requête, quel que soit l'outil, qui demande une autre politique. Refuser aussi les requêtes sans cette clé est important, car un écouteur créé par la CLI ou CloudFormation sans politique reçoit ELBSecurityPolicy-2016-08, et les administrateurs des comptes membres ne peuvent pas passer outre une SCP."
  options:
    a:
      en: "AWS Config detects and remediates after the listener exists; it does not block the creation or modification."
      fr: "AWS Config détecte et corrige une fois l'écouteur créé ; il ne bloque ni la création ni la modification."
    c:
      en: "Proactive controls apply only to resources provisioned through CloudFormation, so listeners created with the console, the CLI, or Terraform would bypass them."
      fr: "Les contrôles proactifs ne s'appliquent qu'aux ressources provisionnées par CloudFormation : les écouteurs créés avec la console, la CLI ou Terraform y échapperaient."
    d:
      en: "Elastic Load Balancing is not one of the services that RCPs apply to, and restricting what principals in member accounts can do is the role of an SCP."
      fr: "Elastic Load Balancing ne fait pas partie des services auxquels les RCP s'appliquent, et restreindre ce que peuvent faire les principaux des comptes membres est le rôle d'une SCP."
references:
  - title: Actions, resources, and condition keys for AWS Elastic Load Balancing V2
    url: https://docs.aws.amazon.com/service-authorization/latest/reference/list_elasticloadbalancingv2.html
  - title: Security policies for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
