id: sapc03-2c-inspector-org-activation
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 90 accounts in AWS Organizations and runs its workloads in eu-central-1 on Amazon EC2 instances, container images stored in Amazon ECR, and AWS Lambda functions. The security team wants continuous vulnerability scanning of all three resource types in every current account and in every account that joins the organization later. All vulnerability findings must be visible in the security tooling account without signing in to member accounts. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 90 comptes dans AWS Organizations et exécute ses charges de travail dans eu-central-1 sur des instances Amazon EC2, des images de conteneur stockées dans Amazon ECR et des fonctions AWS Lambda. L'équipe de sécurité veut une analyse continue des vulnérabilités des trois types de ressources dans chaque compte actuel et dans chaque compte qui rejoindra l'organisation par la suite. Tous les résultats de vulnérabilité doivent être visibles dans le compte d'outillage de sécurité sans se connecter aux comptes membres. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Activate Amazon Inspector in each account with a CloudFormation StackSet, and give the security tooling account a cross-account IAM role in each account to list the findings."
        fr: "Activer Amazon Inspector dans chaque compte avec un StackSet CloudFormation, et donner au compte d'outillage de sécurité un rôle IAM entre comptes dans chaque compte pour lister les résultats."
    - id: b
      text:
        en: "Turn on Amazon ECR basic scanning with scan on push in every registry, and activate Amazon Inspector in the management account for the EC2 instances and Lambda functions."
        fr: "Activer l'analyse de base d'Amazon ECR avec analyse lors de l'envoi dans chaque registre, et activer Amazon Inspector dans le compte de gestion pour les instances EC2 et les fonctions Lambda."
    - id: c
      text:
        en: "Designate the security tooling account as the Amazon GuardDuty delegated administrator, and enable Runtime Monitoring and Lambda Protection for all member accounts."
        fr: "Désigner le compte d'outillage de sécurité comme administrateur délégué d'Amazon GuardDuty, et activer Runtime Monitoring et Lambda Protection pour tous les comptes membres."
    - id: d
      text:
        en: "Make the security tooling account the Inspector delegated administrator, activate EC2, ECR and Lambda scanning for all members, and auto-activate new members."
        fr: "Faire du compte d'outillage de sécurité l'administrateur délégué d'Inspector, activer l'analyse EC2, ECR et Lambda pour tous les membres, et activer automatiquement les nouveaux membres."
answer: { optionId: d }
explanation:
  correct:
    en: "Amazon Inspector integrates with AWS Organizations: a delegated administrator can activate Inspector and its scan types for all member accounts, automatically activate it for accounts that join later, and view aggregated findings. Inspector then scans EC2 instances, ECR images and Lambda functions continuously, without manually scheduled scans."
    fr: "Amazon Inspector s'intègre à AWS Organizations : un administrateur délégué peut activer Inspector et ses types d'analyse pour tous les comptes membres, l'activer automatiquement pour les comptes qui rejoignent l'organisation plus tard et consulter les résultats agrégés. Inspector analyse ensuite en continu les instances EC2, les images ECR et les fonctions Lambda, sans analyse planifiée manuellement."
  options:
    a:
      en: "Per-account activation and cross-account roles must be maintained by the team, and the findings are not aggregated in one account, which is more overhead than the delegated administrator model."
      fr: "L'activation compte par compte et les rôles entre comptes doivent être maintenus par l'équipe, et les résultats ne sont pas agrégés dans un compte, ce qui représente plus de charge que le modèle d'administrateur délégué."
    b:
      en: "Basic scanning only scans images on push or manually, and Inspector in the management account covers only that account, not the 89 other accounts."
      fr: "L'analyse de base n'analyse les images qu'à l'envoi ou manuellement, et Inspector dans le compte de gestion ne couvre que ce compte, pas les 89 autres."
    c:
      en: "GuardDuty detects threats from runtime and network activity; it does not report software vulnerabilities in packages, images or function code."
      fr: "GuardDuty détecte les menaces à partir de l'activité d'exécution et réseau ; il ne signale pas les vulnérabilités logicielles des paquets, des images ou du code des fonctions."
references:
  - title: What is Amazon Inspector?
    url: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html
