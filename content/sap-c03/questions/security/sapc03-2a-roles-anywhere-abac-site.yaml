id: sapc03-2a-roles-anywhere-abac-site
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 40 factories, and each factory runs on-premises servers that upload production data to one Amazon S3 bucket. The servers authenticate with IAM Roles Anywhere by using certificates from the enterprise CA. The subject of each certificate contains the factory ID as its organizational unit, for example OU=plant-17, and each factory's data must go under a prefix with the same name. Each server must be able to write only under its own factory's prefix. The company opens new factories every quarter and wants one IAM role and one permissions policy for all factories, with no policy change when a factory opens.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 40 usines, et chaque usine exploite des serveurs sur site qui chargent des données de production dans un même compartiment (bucket) Amazon S3. Les serveurs s'authentifient avec IAM Roles Anywhere à l'aide de certificats de la CA d'entreprise. Le sujet de chaque certificat contient l'ID de l'usine comme unité d'organisation, par exemple OU=plant-17, et les données de chaque usine doivent être placées sous un préfixe de même nom. Chaque serveur ne doit pouvoir écrire que sous le préfixe de sa propre usine. L'entreprise ouvre de nouvelles usines chaque trimestre et veut un seul rôle IAM et une seule politique d'autorisations pour toutes les usines, sans modification de politique à l'ouverture d'une usine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create one IAM role and one Roles Anywhere profile for each factory, with a policy that allows s3:PutObject only under that factory's prefix."
        fr: "Créer un rôle IAM et un profil Roles Anywhere par usine, avec une politique qui n'autorise s3:PutObject que sous le préfixe de cette usine."
    - id: b
      text:
        en: "Create one Roles Anywhere profile for each factory that lists a shared role and attaches a session policy that allows s3:PutObject only under that factory's prefix."
        fr: "Créer par usine un profil Roles Anywhere qui liste un rôle partagé et attache une politique de session qui n'autorise s3:PutObject que sous le préfixe de cette usine."
    - id: c
      text:
        en: "Create one role whose policy allows s3:PutObject on the bucket ARN followed by /${aws:SourceIdentity}/*, because the source identity of each session is set from the certificate."
        fr: "Créer un rôle dont la politique autorise s3:PutObject sur l'ARN du compartiment suivi de /${aws:SourceIdentity}/*, car l'identité source de chaque session est définie à partir du certificat."
    - id: d
      text:
        en: "Create one role whose policy allows s3:PutObject on the bucket ARN followed by /${aws:PrincipalTag/x509Subject/OU}/*, and use one profile for all servers."
        fr: "Créer un rôle dont la politique autorise s3:PutObject sur l'ARN du compartiment suivi de /${aws:PrincipalTag/x509Subject/OU}/*, et utiliser un seul profil pour tous les serveurs."
answer: { optionId: d }
explanation:
  correct:
    en: "By default, IAM Roles Anywhere maps the relative distinguished names of the certificate subject, including OU, to principal tags of the session. A policy variable on aws:PrincipalTag/x509Subject/OU in the resource ARN limits each server to its factory's prefix, so a new factory needs only certificates with the right OU."
    fr: "Par défaut, IAM Roles Anywhere associe les noms distinctifs relatifs du sujet du certificat, dont OU, à des balises de principal de la session. Une variable de politique sur aws:PrincipalTag/x509Subject/OU dans l'ARN de ressource limite chaque serveur au préfixe de son usine : une nouvelle usine n'a besoin que de certificats avec la bonne OU."
  options:
    a:
      en: "One role and profile per factory means a new role, policy and profile every time a factory opens, which the company wants to avoid."
      fr: "Un rôle et un profil par usine imposent un nouveau rôle, une nouvelle politique et un nouveau profil à chaque ouverture d'usine, ce que l'entreprise veut éviter."
    b:
      en: "One session policy per factory profile still requires a new policy and profile for every new factory."
      fr: "Une politique de session par profil d'usine exige toujours une nouvelle politique et un nouveau profil pour chaque nouvelle usine."
    c:
      en: "The source identity is set from the certificate subject's common name, which identifies the server, not the factory."
      fr: "L'identité source est définie à partir du nom commun du sujet du certificat, qui identifie le serveur, pas l'usine."
references:
  - title: Certificate attribute mapping
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/attribute-mapping.html
  - title: The IAM Roles Anywhere trust model
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
