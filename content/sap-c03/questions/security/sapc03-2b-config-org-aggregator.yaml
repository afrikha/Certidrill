id: sapc03-2b-config-org-aggregator
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany has 220 accounts in AWS Organizations and records resource configurations with AWS Config in every account in four Regions. The security team works in a dedicated security tooling account. It needs a single view of resource configurations and rule compliance across all accounts and Regions, including accounts that join the organization later. The team does not want to collect an authorization from each account, and it wants to use the management account as little as possible.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 220 comptes dans AWS Organizations et enregistre les configurations de ressources avec AWS Config dans chaque compte, dans quatre Régions. L'équipe de sécurité travaille dans un compte d'outils de sécurité dédié. Elle a besoin d'une vue unique des configurations de ressources et de la conformité aux règles pour tous les comptes et toutes les Régions, y compris les comptes qui rejoindront l'organisation plus tard. L'équipe ne veut pas recueillir une autorisation de chaque compte et veut utiliser le compte de gestion le moins possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an aggregator in the security tooling account that lists every account ID, and have each account create an authorization for the aggregator account.", fr: "Créer dans le compte d'outils de sécurité un agrégateur qui liste chaque ID de compte, et faire créer par chaque compte une autorisation pour le compte de l'agrégateur." } }
    - { id: b, text: { en: "Deploy an organization conformance pack from the security tooling account so that each account sends its compliance data to that account.", fr: "Déployer un pack de conformité d'organisation depuis le compte d'outils de sécurité afin que chaque compte envoie ses données de conformité à ce compte." } }
    - { id: c, text: { en: "Configure the AWS Config delivery channel of each account to write snapshots to a bucket in the security tooling account, and query the bucket with Amazon Athena.", fr: "Configurer le canal de diffusion AWS Config de chaque compte pour écrire des instantanés dans un compartiment du compte d'outils de sécurité, et interroger le compartiment avec Amazon Athena." } }
    - { id: d, text: { en: "Register the security tooling account as a delegated administrator for AWS Config, and create an organization aggregator in it that covers all Regions.", fr: "Enregistrer le compte d'outils de sécurité comme administrateur délégué pour AWS Config, et y créer un agrégateur d'organisation qui couvre toutes les Régions." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An aggregator can collect AWS Config configuration and compliance data from an organization and all its accounts across Regions. Authorization is not required when the source accounts are retrieved through AWS Organizations, and a delegated administrator account can own the aggregator so that the management account is not used day to day."
    fr: "Un agrégateur peut collecter les données de configuration et de conformité AWS Config d'une organisation et de tous ses comptes, dans plusieurs Régions. Aucune autorisation n'est requise lorsque les comptes sources sont récupérés via AWS Organizations, et un compte administrateur délégué peut détenir l'agrégateur, ce qui évite d'utiliser le compte de gestion au quotidien."
  options:
    a:
      en: "An aggregator based on individual accounts needs an authorization from each source account and does not add new accounts automatically."
      fr: "Un agrégateur fondé sur des comptes individuels exige une autorisation de chaque compte source et n'ajoute pas automatiquement les nouveaux comptes."
    b:
      en: "A conformance pack deploys rules into accounts; it does not provide a central view of configurations and compliance."
      fr: "Un pack de conformité déploie des règles dans les comptes ; il ne fournit pas de vue centrale des configurations et de la conformité."
    c:
      en: "Snapshot files require custom querying and do not give the compliance view that an aggregator provides without additional cost."
      fr: "Les fichiers d'instantanés exigent des requêtes personnalisées et ne donnent pas la vue de conformité qu'un agrégateur fournit sans coût supplémentaire."
references:
  - title: Multi-Account Multi-Region Data Aggregation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/aggregate-data.html
