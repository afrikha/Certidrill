id: sapc03-2b-pq-readiness-statements
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's board has asked the cloud architecture team for a post-quantum readiness assessment of the company's AWS environment. The environment stores data in Amazon S3 and Amazon EBS with SSE-KMS and symmetric KMS keys. It exposes APIs through Application Load Balancers that use RSA certificates from ACM. The team must report only statements that are accurate for current AWS services.

    Which statements should the team include in the assessment? (Choose two.)
  fr: |
    Le conseil d'administration d'AnyCompany a demandé à l'équipe d'architecture cloud une évaluation de la préparation post-quantique de l'environnement AWS de l'entreprise. L'environnement stocke des données dans Amazon S3 et Amazon EBS avec SSE-KMS et des clés KMS symétriques. Il expose des API via des Application Load Balancers qui utilisent des certificats RSA émis par ACM. L'équipe ne doit rapporter que des affirmations exactes pour les services AWS actuels.

    Quelles affirmations l'équipe doit-elle inclure dans l'évaluation ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Data encrypted under symmetric KMS keys must be re-encrypted under ML-KEM KMS keys, because quantum computers will break AES-256-GCM.", fr: "Les données chiffrées avec des clés KMS symétriques doivent être rechiffrées avec des clés KMS ML-KEM, car les ordinateurs quantiques casseront AES-256-GCM." } }
    - { id: b, text: { en: "Data encrypted under symmetric KMS keys does not need re-encryption, because AES-256-GCM is considered quantum resistant.", fr: "Les données chiffrées avec des clés KMS symétriques n'ont pas besoin d'être rechiffrées, car AES-256-GCM est considéré comme résistant aux attaques quantiques." } }
    - { id: c, text: { en: "The load balancers must replace their RSA certificates with ML-DSA certificates before they can offer a hybrid post-quantum key exchange.", fr: "Les équilibreurs de charge doivent remplacer leurs certificats RSA par des certificats ML-DSA avant de pouvoir proposer un échange de clés hybride post-quantique." } }
    - { id: d, text: { en: "A post-quantum security policy on the load balancers protects a TLS session only when the client also supports an ML-KEM key exchange.", fr: "Une politique de sécurité post-quantique sur les équilibreurs de charge ne protège une session TLS que si le client prend lui aussi en charge un échange de clés ML-KEM." } }
    - { id: e, text: { en: "Hybrid post-quantum TLS to AWS KMS also re-encrypts the data stored under the KMS keys with post-quantum algorithms.", fr: "Le TLS hybride post-quantique vers AWS KMS rechiffre aussi avec des algorithmes post-quantiques les données stockées sous les clés KMS." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "AWS KMS documents that AES-256-GCM is considered quantum resistant: a large-scale quantum attack would reduce its effective strength to 128 bits, which is still sufficient. On Elastic Load Balancing, policies with PQ in their name offer hybrid ML-KEM key exchange, but the client must support ML-KEM for the session to use it."
    fr: "AWS KMS indique qu'AES-256-GCM est considéré comme résistant aux attaques quantiques : une attaque quantique à grande échelle réduirait sa robustesse effective à 128 bits, ce qui reste suffisant. Sur Elastic Load Balancing, les politiques dont le nom contient PQ proposent un échange de clés hybride ML-KEM, mais le client doit prendre en charge ML-KEM pour que la session l'utilise."
  options:
    a:
      en: "AES-256-GCM is considered quantum resistant, and ML-KEM keys establish shared secrets; they are not used as SSE-KMS keys."
      fr: "AES-256-GCM est considéré comme résistant aux attaques quantiques, et les clés ML-KEM établissent des secrets partagés ; elles ne servent pas de clés SSE-KMS."
    c:
      en: "The key exchange and the certificate are independent: the PQ policies add ML-KEM key exchange with the existing RSA or ECDSA certificates."
      fr: "L'échange de clés et le certificat sont indépendants : les politiques PQ ajoutent l'échange de clés ML-KEM avec les certificats RSA ou ECDSA existants."
    e:
      en: "The hybrid cipher suites protect data in transit only; AWS KMS does not use them to encrypt data under KMS keys."
      fr: "Les suites de chiffrement hybrides ne protègent que les données en transit ; AWS KMS ne les utilise pas pour chiffrer des données sous des clés KMS."
references:
  - title: Key spec reference
    url: https://docs.aws.amazon.com/kms/latest/developerguide/symm-asymm-choose-key-spec.html
  - title: Security policies for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/describe-ssl-policies.html
