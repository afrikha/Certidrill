id: sapc03-2d-automated-reasoning-hr
objective: "2.5.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's HR department is launching an English-language assistant on Amazon Bedrock in us-east-1 that answers employees' questions about parental leave eligibility. Eligibility depends on precise rules in an 8-page leave policy, such as minimum tenure, contract type and the number of days already taken. For compliance, each answer must be checked against these rules with a mathematically verifiable explanation that cites the rules that support or contradict it, and the application decides how to present a contradicted answer. Employee IDs, which have the format EMP followed by six digits, must be masked in every response. The assistant does not stream its responses.

    Which combination of Amazon Bedrock Guardrails policies will meet these requirements? (Choose two.)
  fr: |
    Le service RH d'AnyCompany lance sur Amazon Bedrock, dans us-east-1, un assistant en anglais qui répond aux questions des employés sur l'éligibilité au congé parental. L'éligibilité dépend de règles précises d'une politique de congés de 8 pages, comme l'ancienneté minimale, le type de contrat et le nombre de jours déjà pris. Pour la conformité, chaque réponse doit être vérifiée par rapport à ces règles avec une explication mathématiquement vérifiable qui cite les règles qui la confirment ou la contredisent, et l'application décide comment présenter une réponse contredite. Les identifiants d'employé, au format EMP suivi de six chiffres, doivent être masqués dans chaque réponse. L'assistant ne diffuse pas ses réponses en continu.

    Quelle combinaison de politiques d'Amazon Bedrock Guardrails répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A contextual grounding check with a high grounding threshold and the leave policy as the grounding source", fr: "Une vérification d'ancrage contextuel avec un seuil d'ancrage élevé et la politique de congés comme source d'ancrage" } }
    - { id: b, text: { en: "An Automated Reasoning policy created from the leave policy document and attached to the guardrail", fr: "Une politique Automated Reasoning créée à partir du document de politique de congés et attachée au guardrail" } }
    - { id: c, text: { en: "A denied topic that describes leave eligibility questions outside the leave policy", fr: "Un sujet refusé qui décrit les questions d'éligibilité aux congés hors de la politique de congés" } }
    - { id: d, text: { en: "A sensitive information filter with a regex for EMP[0-9]{6} set to ANONYMIZE", fr: "Un filtre d'informations sensibles avec une expression régulière EMP[0-9]{6} définie à ANONYMIZE" } }
    - { id: e, text: { en: "A word filter that contains the employee IDs exported from the HR system", fr: "Un filtre de mots qui contient les identifiants d'employé exportés du système RH" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Automated Reasoning checks extract formal rules from a source document and validate responses with formal logic, returning findings such as VALID or INVALID with the rules involved; they run in detect mode, so the application decides what to show, and they support English, non-streamed responses. A regex in a sensitive information filter with ANONYMIZE masks every value that matches the employee ID pattern."
    fr: "Les vérifications Automated Reasoning extraient des règles formelles d'un document source et valident les réponses par la logique formelle, en renvoyant des résultats comme VALID ou INVALID avec les règles concernées ; elles fonctionnent en mode détection, l'application décide donc de l'affichage, et elles prennent en charge l'anglais et les réponses non diffusées en continu. Une expression régulière dans un filtre d'informations sensibles avec ANONYMIZE masque toute valeur conforme au format d'identifiant d'employé."
  options:
    a:
      en: "Contextual grounding returns a probabilistic score and blocks below a threshold; it gives no rule-by-rule, verifiable explanation of why an answer is right or wrong."
      fr: "L'ancrage contextuel renvoie un score probabiliste et bloque sous un seuil ; il ne donne aucune explication vérifiable, règle par règle, de la justesse d'une réponse."
    c:
      en: "A denied topic blocks a subject; it does not check an answer against the eligibility rules, and leave questions are exactly what the assistant must answer."
      fr: "Un sujet refusé bloque un sujet ; il ne vérifie pas une réponse par rapport aux règles d'éligibilité, et les questions de congés sont justement celles auxquelles l'assistant doit répondre."
    e:
      en: "A word filter blocks listed words instead of masking them, and a static export misses employees hired later; a regex matches the format instead."
      fr: "Un filtre de mots bloque les mots listés au lieu de les masquer, et un export statique oublie les employés embauchés ensuite ; une expression régulière reconnaît plutôt le format."
references:
  - title: What are Automated Reasoning checks in Amazon Bedrock Guardrails?
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-automated-reasoning-checks.html
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
