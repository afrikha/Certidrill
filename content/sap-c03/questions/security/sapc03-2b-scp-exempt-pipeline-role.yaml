id: sapc03-2b-scp-exempt-pipeline-role
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany wants to stop administrators in 120 member accounts from modifying the networking baseline: VPCs, route tables, internet gateways, and transit gateway attachments. The baseline is deployed by an IAM role named NetworkPipelineRole that exists in every member account and must keep its access. The control must be managed centrally and must also apply to the root users of the member accounts.

    Which solution will meet these requirements?
  fr: |
    AnyCompany veut empêcher les administrateurs de 120 comptes membres de modifier la base réseau : VPC, tables de routage, passerelles Internet et attachements de passerelle de transit. La base est déployée par un rôle IAM nommé NetworkPipelineRole, présent dans chaque compte membre, qui doit conserver son accès. Le contrôle doit être géré de façon centralisée et s'appliquer aussi aux utilisateurs root des comptes membres.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP to the Workloads OU that denies the networking actions with an ArnNotLike condition on aws:PrincipalArn for arn:aws:iam::*:role/NetworkPipelineRole.", fr: "Attacher à l'OU Workloads une SCP qui refuse les actions réseau avec une condition ArnNotLike sur aws:PrincipalArn pour arn:aws:iam::*:role/NetworkPipelineRole." } }
    - { id: b, text: { en: "Attach an SCP to the Workloads OU with a Deny statement for the networking actions and a NotPrincipal element that lists NetworkPipelineRole.", fr: "Attacher à l'OU Workloads une SCP avec une instruction Deny pour les actions réseau et un élément NotPrincipal qui liste NetworkPipelineRole." } }
    - { id: c, text: { en: "Attach a permissions boundary that denies the networking actions to every IAM user and role in the member accounts except NetworkPipelineRole.", fr: "Attacher une limite d'autorisations qui refuse les actions réseau à chaque utilisateur et rôle IAM des comptes membres sauf NetworkPipelineRole." } }
    - { id: d, text: { en: "Attach an SCP to the Workloads OU with an Allow statement for the networking actions whose Resource element contains the ARN of NetworkPipelineRole.", fr: "Attacher à l'OU Workloads une SCP avec une instruction Allow pour les actions réseau dont l'élément Resource contient l'ARN de NetworkPipelineRole." } }
answer: { optionId: a }
explanation:
  correct:
    en: "SCPs restrict every user and role in member accounts, including the root user, and they are managed centrally. Because SCPs do not support the Principal and NotPrincipal elements, the exception for the pipeline role is written as a condition on aws:PrincipalArn in the Deny statement."
    fr: "Les SCP restreignent chaque utilisateur et rôle des comptes membres, y compris l'utilisateur root, et elles sont gérées de façon centralisée. Comme les SCP ne prennent pas en charge les éléments Principal et NotPrincipal, l'exception pour le rôle du pipeline s'écrit sous forme de condition sur aws:PrincipalArn dans l'instruction Deny."
  options:
    b:
      en: "Principal and NotPrincipal are unsupported elements in SCPs."
      fr: "Principal et NotPrincipal sont des éléments non pris en charge dans les SCP."
    c:
      en: "Permissions boundaries are attached per identity in each account, cannot be attached to the root user, and administrators could remove them."
      fr: "Les limites d'autorisations s'attachent identité par identité dans chaque compte, ne s'attachent pas à l'utilisateur root, et les administrateurs pourraient les retirer."
    d:
      en: "In an SCP Allow statement, the Resource element can only be *, and the Resource element identifies resources, not the calling principal."
      fr: "Dans une instruction Allow de SCP, l'élément Resource ne peut valoir que *, et l'élément Resource désigne des ressources, pas le principal appelant."
references:
  - title: SCP syntax
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_syntax.html
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
