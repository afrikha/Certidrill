id: sapc03-2c-cspm-declarative-policy
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company is building a new multi-account environment with AWS Organizations. AWS Security Hub CSPM has never been enabled in any account, and no multi-account Security Hub CSPM configuration exists yet. The security tooling account will be the delegated administrator. Security Hub CSPM must be enabled in every existing and future account in four AWS Regions, with the AWS Foundational Security Best Practices (FSBP) standard and the CIS AWS Foundations Benchmark standard. Accounts in a Sandbox OU must not run the CIS standard and must have a defined list of FSBP controls disabled. The configuration must be governed centrally through AWS Organizations according to each account's OU, without any per-account or per-Region configuration work, and the company wants the approach that AWS recommends for new multi-account setups.

    Which solution will meet these requirements?
  fr: |
    Une entreprise du secteur de la santé crée un nouvel environnement multicomptes avec AWS Organizations. AWS Security Hub CSPM n'a jamais été activé dans aucun compte, et aucune configuration multicomptes de Security Hub CSPM n'existe encore. Le compte d'outillage de sécurité sera l'administrateur délégué. Security Hub CSPM doit être activé dans chaque compte existant et futur dans quatre Régions AWS, avec la norme AWS Foundational Security Best Practices (FSBP) et la norme CIS AWS Foundations Benchmark. Les comptes d'une OU Sandbox ne doivent pas exécuter la norme CIS et doivent avoir une liste définie de contrôles FSBP désactivés. La configuration doit être gouvernée de manière centralisée par AWS Organizations selon l'OU de chaque compte, sans aucun travail de configuration par compte ou par Région, et l'entreprise souhaite l'approche qu'AWS recommande pour les nouveaux environnements multicomptes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable trusted access, designate the delegated administrator, enable the SECURITYHUB_CSPM_POLICY policy type on the root, and attach one Security Hub CSPM declarative policy to the root and another to the Sandbox OU."
        fr: "Activer l'accès approuvé, désigner l'administrateur délégué, activer le type de politique SECURITYHUB_CSPM_POLICY sur la racine, et attacher une politique déclarative Security Hub CSPM à la racine et une autre à l'OU Sandbox."
    - id: b
      text:
        en: "Designate the delegated administrator and, in each of the four Regions, use the local configuration to enable Security Hub CSPM and the default standards automatically in new organization accounts."
        fr: "Désigner l'administrateur délégué et, dans chacune des quatre Régions, utiliser la configuration locale pour activer automatiquement Security Hub CSPM et les normes par défaut dans les nouveaux comptes de l'organisation."
    - id: c
      text:
        en: "Deploy a CloudFormation StackSet with automatic deployment that enables Security Hub CSPM and both standards in each account and Region, and a second StackSet for the Sandbox OU that disables the controls."
        fr: "Déployer un StackSet CloudFormation avec déploiement automatique qui active Security Hub CSPM et les deux normes dans chaque compte et chaque Région, et un second StackSet pour l'OU Sandbox qui désactive les contrôles."
    - id: d
      text:
        en: "Attach an SCP that denies securityhub:DisableSecurityHub and securityhub:UpdateStandardsControl to the root, and deploy an organization conformance pack that enables Security Hub CSPM and the two standards."
        fr: "Attacher à la racine une SCP qui refuse securityhub:DisableSecurityHub et securityhub:UpdateStandardsControl, et déployer un pack de conformité d'organisation qui active Security Hub CSPM et les deux normes."
answer: { optionId: a }
explanation:
  correct:
    en: "Security Hub CSPM declarative policies are an AWS Organizations policy type (SECURITYHUB_CSPM_POLICY) that defines in which Regions Security Hub CSPM is enabled and which standards, controls and parameters apply. Policies attached to the root and to OUs are inherited by current and future accounts, and AWS recommends them over the legacy central configuration for new multi-account setups. A second policy on the Sandbox OU gives those accounts their own standards and disabled controls."
    fr: "Les politiques déclaratives Security Hub CSPM sont un type de politique AWS Organizations (SECURITYHUB_CSPM_POLICY) qui définit les Régions où Security Hub CSPM est activé ainsi que les normes, contrôles et paramètres appliqués. Les politiques attachées à la racine et aux OU sont héritées par les comptes actuels et futurs, et AWS les recommande plutôt que l'ancienne configuration centrale pour les nouveaux environnements multicomptes. Une seconde politique sur l'OU Sandbox donne à ces comptes leurs propres normes et contrôles désactivés."
  options:
    b:
      en: "Local configuration enables Security Hub CSPM only in new accounts and only in the current Region, cannot apply different settings per OU, and allows configuration drift."
      fr: "La configuration locale active Security Hub CSPM uniquement dans les nouveaux comptes et uniquement dans la Région actuelle, ne peut pas appliquer des paramètres différents par OU et permet la dérive de configuration."
    c:
      en: "StackSets push a one-time configuration into each account and Region; the settings are not governed through Organizations and account administrators can change them afterwards."
      fr: "Les StackSets envoient une configuration ponctuelle dans chaque compte et chaque Région ; les paramètres ne sont pas gouvernés par Organizations et les administrateurs des comptes peuvent les modifier ensuite."
    d:
      en: "Conformance packs deploy AWS Config rules and remediation actions; they cannot enable Security Hub CSPM or its standards, and an SCP only blocks actions without configuring anything."
      fr: "Les packs de conformité déploient des règles AWS Config et des actions de correction ; ils ne peuvent pas activer Security Hub CSPM ni ses normes, et une SCP se contente de bloquer des actions sans rien configurer."
references:
  - title: Managing accounts with declarative policies in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/accounts-orgs-policies.html
  - title: Understanding central configuration in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/central-configuration-intro.html
