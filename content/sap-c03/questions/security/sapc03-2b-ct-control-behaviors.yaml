id: sapc03-2b-ct-control-behaviors
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany governs its workload OUs with AWS Control Tower. Infrastructure is deployed with AWS CloudFormation, but some teams also make changes in the console. The security team has three requirements. CloudFormation must refuse to provision Amazon S3 buckets that lack the required encryption and public access settings, before the resources are created. No principal in the member accounts may stop or delete the CloudTrail trail that Control Tower manages. The team must see which existing Amazon EBS volumes are unencrypted, including volumes created in the console.

    Which combination of controls will meet these requirements? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany gouverne ses OU de charges de travail avec AWS Control Tower. L'infrastructure est déployée avec AWS CloudFormation, mais certaines équipes font aussi des modifications dans la console. L'équipe de sécurité a trois exigences. CloudFormation doit refuser de provisionner des compartiments Amazon S3 dépourvus des paramètres de chiffrement et d'accès public requis, avant la création des ressources. Aucun principal des comptes membres ne doit pouvoir arrêter ou supprimer le journal de suivi CloudTrail géré par Control Tower. L'équipe doit voir quels volumes Amazon EBS existants ne sont pas chiffrés, y compris ceux créés dans la console.

    Quelle combinaison de contrôles répond à ces exigences ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "A proactive control on the OUs, implemented with CloudFormation hooks, that checks the properties of S3 bucket resources in the templates.", fr: "Un contrôle proactif sur les OU, mis en œuvre avec des hooks CloudFormation, qui vérifie les propriétés des ressources de compartiment S3 dans les modèles." } }
    - { id: b, text: { en: "A detective control on the OUs, implemented with AWS Config rules, that deletes S3 buckets that lack the required settings.", fr: "Un contrôle détectif sur les OU, mis en œuvre avec des règles AWS Config, qui supprime les compartiments S3 dépourvus des paramètres requis." } }
    - { id: c, text: { en: "A preventive control on the OUs, implemented with an SCP, that denies changes to the CloudTrail trail that Control Tower manages.", fr: "Un contrôle préventif sur les OU, mis en œuvre avec une SCP, qui refuse les modifications du journal de suivi CloudTrail géré par Control Tower." } }
    - { id: d, text: { en: "A proactive control on the OUs, implemented with CloudFormation hooks, that reports EBS volumes that were created in the console.", fr: "Un contrôle proactif sur les OU, mis en œuvre avec des hooks CloudFormation, qui signale les volumes EBS créés dans la console." } }
    - { id: e, text: { en: "A preventive control on the OUs, implemented with an RCP, that denies cloudtrail:StopLogging to principals in the member accounts.", fr: "Un contrôle préventif sur les OU, mis en œuvre avec une RCP, qui refuse cloudtrail:StopLogging aux principaux des comptes membres." } }
    - { id: f, text: { en: "A detective control on the OUs, implemented with AWS Config rules, that reports unencrypted EBS volumes.", fr: "Un contrôle détectif sur les OU, mis en œuvre avec des règles AWS Config, qui signale les volumes EBS non chiffrés." } }
answer: { optionIds: [ a, c, f ] }
explanation:
  correct:
    en: "Proactive controls use CloudFormation hooks to block noncompliant resources before CloudFormation provisions them. Preventive controls are implemented with SCPs, RCPs, or declarative policies, and an SCP stops principals in member accounts from changing the trail. Detective controls use AWS Config rules, which evaluate existing resources however they were created."
    fr: "Les contrôles proactifs utilisent des hooks CloudFormation pour bloquer les ressources non conformes avant que CloudFormation ne les provisionne. Les contrôles préventifs sont mis en œuvre avec des SCP, des RCP ou des politiques déclaratives, et une SCP empêche les principaux des comptes membres de modifier le journal de suivi. Les contrôles détectifs utilisent des règles AWS Config, qui évaluent les ressources existantes quelle que soit leur méthode de création."
  options:
    b:
      en: "Detective controls report a status (clear or in violation); they do not prevent provisioning, and deleting buckets is not their behavior."
      fr: "Les contrôles détectifs signalent un état (conforme ou en violation) ; ils n'empêchent pas le provisionnement, et supprimer des compartiments ne fait pas partie de leur comportement."
    d:
      en: "Proactive controls evaluate only resources provisioned through CloudFormation, so they cannot see volumes created in the console."
      fr: "Les contrôles proactifs n'évaluent que les ressources provisionnées par CloudFormation : ils ne voient pas les volumes créés dans la console."
    e:
      en: "RCPs protect resources of supported services against all principals; restricting the actions of principals in member accounts on CloudTrail is done with an SCP."
      fr: "Les RCP protègent les ressources des services pris en charge contre tous les principaux ; restreindre les actions des principaux des comptes membres sur CloudTrail se fait avec une SCP."
references:
  - title: Control behavior and guidance
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/control-behavior.html
