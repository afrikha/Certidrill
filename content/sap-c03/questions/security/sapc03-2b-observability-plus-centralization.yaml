id: sapc03-2b-observability-plus-centralization
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's site reliability team works in a monitoring account. It needs live dashboards and Logs Insights queries over the metrics, logs, and X-Ray traces of 40 application accounts in eu-west-1, without signing in to each account. Separately, the security team needs its own copy of the application log data in a security account, so that the data remains available even if an application account deletes its log groups. Both setups must include new accounts in the organization automatically.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe d'ingénierie de fiabilité (SRE) d'AnyCompany travaille dans un compte de surveillance. Elle a besoin de tableaux de bord en direct et de requêtes Logs Insights sur les métriques, les journaux et les traces X-Ray de 40 comptes d'application dans eu-west-1, sans se connecter à chaque compte. Par ailleurs, l'équipe de sécurité a besoin de sa propre copie des données de journal des applications dans un compte de sécurité, afin que les données restent disponibles même si un compte d'application supprime ses groupes de journaux. Les deux dispositifs doivent inclure automatiquement les nouveaux comptes de l'organisation.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Share the log groups and metrics of each application account with the monitoring account by using AWS RAM resource shares for the organization.", fr: "Partager les groupes de journaux et les métriques de chaque compte d'application avec le compte de surveillance au moyen de partages de ressources AWS RAM pour l'organisation." } }
    - { id: b, text: { en: "Configure CloudWatch cross-account observability with a sink in the monitoring account and links from the source accounts created through AWS Organizations.", fr: "Configurer l'observabilité intercompte CloudWatch avec un récepteur (sink) dans le compte de surveillance et des liens depuis les comptes sources créés via AWS Organizations." } }
    - { id: c, text: { en: "Create a CloudWatch Logs subscription filter in the monitoring account that reads the log groups of the application accounts.", fr: "Créer dans le compte de surveillance un filtre d'abonnement CloudWatch Logs qui lit les groupes de journaux des comptes d'application." } }
    - { id: d, text: { en: "Create a CloudWatch Logs centralization rule for the organization that copies the application log groups to the security account.", fr: "Créer pour l'organisation une règle de centralisation CloudWatch Logs qui copie les groupes de journaux des applications vers le compte de sécurité." } }
    - { id: e, text: { en: "Configure the security account as a second monitoring account in cross-account observability, because the shared data stays available after the source deletes it.", fr: "Configurer le compte de sécurité comme second compte de surveillance de l'observabilité intercompte, car les données partagées restent disponibles après leur suppression par la source." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Cross-account observability lets a monitoring account view and interact with the metrics, log groups, and traces of linked source accounts in a Region, and AWS Organizations onboards new accounts automatically. A centralization rule replicates new log data into the security account, so the copy survives the deletion of the source log groups."
    fr: "L'observabilité intercompte permet à un compte de surveillance de consulter et d'exploiter les métriques, groupes de journaux et traces des comptes sources liés dans une Région, et AWS Organizations y intègre automatiquement les nouveaux comptes. Une règle de centralisation réplique les nouvelles données de journal dans le compte de sécurité : la copie survit à la suppression des groupes de journaux sources."
  options:
    a:
      en: "Cross-account access to CloudWatch data is provided by cross-account observability links, not by AWS RAM resource shares."
      fr: "L'accès intercompte aux données CloudWatch est fourni par les liens de l'observabilité intercompte, pas par des partages de ressources AWS RAM."
    c:
      en: "Subscription filters are created on log groups in the account that owns them, and they deliver events to a destination; they do not provide dashboards or queries."
      fr: "Les filtres d'abonnement se créent sur les groupes de journaux du compte qui les possède et livrent des événements vers une destination ; ils ne fournissent ni tableaux de bord ni requêtes."
    e:
      en: "A monitoring account views the data of its source accounts; it does not keep a separate copy, so the data is gone when the source deletes it."
      fr: "Un compte de surveillance consulte les données de ses comptes sources ; il n'en conserve pas de copie distincte : les données disparaissent lorsque la source les supprime."
references:
  - title: CloudWatch cross-account observability
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
