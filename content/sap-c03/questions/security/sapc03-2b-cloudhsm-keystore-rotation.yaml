id: sapc03-2b-cloudhsm-keystore-rotation
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany encrypts Amazon S3, Amazon EBS, and Amazon RDS data with symmetric KMS keys that it created in an AWS CloudHSM key store, because auditors require the key material to be in single-tenant HSMs that the company controls. A new policy requires that the key material used to encrypt new data change every year. Data that was encrypted before a change must remain decryptable. Applications and deployment templates refer to the keys through aliases.

    Which solution will meet these requirements?
  fr: |
    AnyCompany chiffre des données Amazon S3, Amazon EBS et Amazon RDS avec des clés KMS symétriques créées dans un magasin de clés AWS CloudHSM, car les auditeurs exigent que les éléments de clé se trouvent dans des HSM à locataire unique contrôlés par l'entreprise. Une nouvelle politique exige que les éléments de clé utilisés pour chiffrer les nouvelles données changent chaque année. Les données chiffrées avant un changement doivent rester déchiffrables. Les applications et les modèles de déploiement désignent les clés par des alias.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable automatic key rotation with a 365-day rotation period on each KMS key in the AWS CloudHSM key store.", fr: "Activer la rotation automatique des clés avec une période de 365 jours sur chaque clé KMS du magasin de clés AWS CloudHSM." } }
    - { id: b, text: { en: "Every year, import new key material generated in the HSMs into each KMS key, and keep the previous key material for decryption.", fr: "Chaque année, importer dans chaque clé KMS de nouveaux éléments de clé générés dans les HSM, et conserver les éléments précédents pour le déchiffrement." } }
    - { id: c, text: { en: "Every year, create new KMS keys in the AWS CloudHSM key store, point the aliases to the new keys, and keep the previous keys enabled for decryption.", fr: "Chaque année, créer de nouvelles clés KMS dans le magasin de clés AWS CloudHSM, faire pointer les alias vers les nouvelles clés, et laisser les clés précédentes activées pour le déchiffrement." } }
    - { id: d, text: { en: "Move the keys to an external key store every year, and let AWS KMS rotate the external key material automatically on a yearly schedule.", fr: "Déplacer chaque année les clés vers un magasin de clés externe, et laisser AWS KMS faire tourner automatiquement les éléments de clé externes chaque année." } }
answer: { optionId: c }
explanation:
  correct:
    en: "KMS keys in an AWS CloudHSM key store do not support automatic rotation or imported key material, so rotation is manual: create a new KMS key in the key store and move the alias to it. The previous keys stay enabled to decrypt existing data, and the new key material is generated in the company's HSMs."
    fr: "Les clés KMS d'un magasin de clés AWS CloudHSM ne prennent en charge ni la rotation automatique ni l'importation d'éléments de clé : la rotation est donc manuelle. On crée une nouvelle clé KMS dans le magasin de clés et on y fait pointer l'alias. Les clés précédentes restent activées pour déchiffrer les données existantes, et les nouveaux éléments de clé sont générés dans les HSM de l'entreprise."
  options:
    a:
      en: "Automatic key rotation is not supported for KMS keys in an AWS CloudHSM key store."
      fr: "La rotation automatique des clés n'est pas prise en charge pour les clés KMS d'un magasin de clés AWS CloudHSM."
    b:
      en: "You cannot import key material into a KMS key in an AWS CloudHSM key store."
      fr: "Il est impossible d'importer des éléments de clé dans une clé KMS d'un magasin de clés AWS CloudHSM."
    d:
      en: "External key stores also do not support automatic rotation, and they keep the key material outside AWS, which changes the approved design."
      fr: "Les magasins de clés externes ne prennent pas non plus en charge la rotation automatique, et ils conservent les éléments de clé hors d'AWS, ce qui modifie la conception approuvée."
references:
  - title: AWS CloudHSM key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
