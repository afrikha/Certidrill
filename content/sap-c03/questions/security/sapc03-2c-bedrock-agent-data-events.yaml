id: sapc03-2c-bedrock-agent-data-events
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A private bank gives its advisors an assistant built with Amazon Bedrock Agents. The agent queries Amazon Bedrock Knowledge Bases that contain client portfolio documents, and some internal tools call the RetrieveAndGenerate API directly. Model invocation logging is turned on in the workload account. An AWS CloudTrail organization trail logs read and write management events to the log archive account. Auditors require a record, in the organization trail, of which IAM principal invoked which agent alias and which knowledge base was queried, and when. A review of the trail shows no InvokeAgent, Retrieve, or RetrieveAndGenerate events.

    Which solution will meet these requirements?
  fr: |
    Une banque privée fournit à ses conseillers un assistant construit avec Amazon Bedrock Agents. L'agent interroge des bases de connaissances Amazon Bedrock Knowledge Bases qui contiennent des documents de portefeuilles clients, et certains outils internes appellent directement l'API RetrieveAndGenerate. La journalisation des appels de modèle est activée dans le compte de charge de travail. Un journal de suivi d'organisation AWS CloudTrail journalise les événements de gestion en lecture et en écriture vers le compte d'archivage des journaux. Les auditeurs exigent un enregistrement, dans le journal de suivi d'organisation, du principal IAM qui a appelé chaque alias d'agent et de la base de connaissances interrogée, avec la date et l'heure. Un examen du journal de suivi ne montre aucun événement InvokeAgent, Retrieve ni RetrieveAndGenerate.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add advanced event selectors to the organization trail that log data events for the AWS::Bedrock::AgentAlias and AWS::Bedrock::KnowledgeBase resource types."
        fr: "Ajouter au journal de suivi d'organisation des sélecteurs d'événements avancés qui journalisent les événements de données des types de ressources AWS::Bedrock::AgentAlias et AWS::Bedrock::KnowledgeBase."
    - id: b
      text:
        en: "Create an additional multi-Region trail in the workload account that logs read and write management events, so that the agent and knowledge base calls are captured locally."
        fr: "Créer un journal de suivi multi-Régions supplémentaire dans le compte de charge de travail qui journalise les événements de gestion en lecture et en écriture, afin de capturer localement les appels aux agents et aux bases de connaissances."
    - id: c
      text:
        en: "Extend the model invocation logging configuration to the InvokeAgent and RetrieveAndGenerate operations, and deliver the logs to the log archive account."
        fr: "Étendre la configuration de journalisation des appels de modèle aux opérations InvokeAgent et RetrieveAndGenerate, et livrer les journaux au compte d'archivage des journaux."
    - id: d
      text:
        en: "Turn on CloudTrail Insights for the organization trail with the API call rate and error rate insight types for the Amazon Bedrock event source."
        fr: "Activer CloudTrail Insights pour le journal de suivi d'organisation avec les types d'analyse taux d'appels d'API et taux d'erreurs pour la source d'événements Amazon Bedrock."
answer: { optionId: a }
explanation:
  correct:
    en: "InvokeAgent is a CloudTrail data event on the AWS::Bedrock::AgentAlias resource type, and Retrieve and RetrieveAndGenerate are data events on AWS::Bedrock::KnowledgeBase. Data events are not logged by default, so the organization trail needs advanced event selectors for these resource types; each event then records the caller identity, the resource, and the time."
    fr: "InvokeAgent est un événement de données CloudTrail sur le type de ressource AWS::Bedrock::AgentAlias, et Retrieve et RetrieveAndGenerate sont des événements de données sur AWS::Bedrock::KnowledgeBase. Les événements de données ne sont pas journalisés par défaut : le journal de suivi d'organisation a donc besoin de sélecteurs d'événements avancés pour ces types de ressources ; chaque événement enregistre alors l'identité de l'appelant, la ressource et l'heure."
  options:
    b:
      en: "These agent and knowledge base operations are data events, so another trail that logs only management events still misses them, and it would not be the organization trail."
      fr: "Ces opérations d'agent et de base de connaissances sont des événements de données : un autre journal de suivi limité aux événements de gestion ne les capture toujours pas, et ce ne serait pas le journal de suivi d'organisation."
    c:
      en: "Model invocation logging covers only Converse, ConverseStream, InvokeModel, and InvokeModelWithResponseStream, and it delivers only to the same account and Region."
      fr: "La journalisation des appels de modèle ne couvre que Converse, ConverseStream, InvokeModel et InvokeModelWithResponseStream, et elle ne livre que dans le même compte et la même Région."
    d:
      en: "Insights reports unusual call volumes or error rates; it does not record individual calls or who made them."
      fr: "Insights signale des volumes d'appels ou des taux d'erreur inhabituels ; il n'enregistre pas les appels individuels ni leurs auteurs."
references:
  - title: Monitor Amazon Bedrock API calls using CloudTrail
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/logging-using-cloudtrail.html
