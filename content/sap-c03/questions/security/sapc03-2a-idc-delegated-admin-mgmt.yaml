id: sapc03-2a-idc-delegated-admin-mgmt
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 60 member accounts in AWS Organizations and uses an organization instance of AWS IAM Identity Center. To keep people out of the management account, the company registered a member account named IdentityAdmin as the delegated administrator for IAM Identity Center. The identity team works only in IdentityAdmin. The team must add permissions to the PlatformAdmin permission set, which is assigned to a platform group in the management account and in all 60 member accounts. The update fails from IdentityAdmin even though the team's role has full IAM Identity Center permissions. The security team requires that the identity team keep managing member account access without signing in to the management account, and that management account access stay under the control of a small group in that account.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 60 comptes membres dans AWS Organizations et utilise une instance d'organisation d'AWS IAM Identity Center. Pour limiter les connexions au compte de gestion, l'entreprise a inscrit un compte membre nommé IdentityAdmin comme administrateur délégué d'IAM Identity Center. L'équipe d'identité travaille uniquement dans IdentityAdmin. L'équipe doit ajouter des autorisations à l'ensemble d'autorisations PlatformAdmin, affecté à un groupe de plateforme dans le compte de gestion et dans les 60 comptes membres. La mise à jour échoue depuis IdentityAdmin alors que le rôle de l'équipe dispose de toutes les autorisations IAM Identity Center. L'équipe de sécurité exige que l'équipe d'identité continue de gérer l'accès aux comptes membres sans se connecter au compte de gestion, et que l'accès au compte de gestion reste contrôlé par un petit groupe dans ce compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a new permission set from IdentityAdmin with the updated permissions for the 60 member accounts, and keep PlatformAdmin only for the management account, where the small group changes it."
        fr: "Créer depuis IdentityAdmin un nouvel ensemble d'autorisations avec les autorisations mises à jour pour les 60 comptes membres, et conserver PlatformAdmin uniquement pour le compte de gestion, où le petit groupe le modifie."
    - id: b
      text:
        en: "Add an identity-based policy to the identity team's role in IdentityAdmin that allows sso:UpdatePermissionSet and sso:ProvisionPermissionSet on the PlatformAdmin permission set ARN."
        fr: "Ajouter au rôle de l'équipe d'identité dans IdentityAdmin une politique basée sur l'identité qui autorise sso:UpdatePermissionSet et sso:ProvisionPermissionSet sur l'ARN de l'ensemble d'autorisations PlatformAdmin."
    - id: c
      text:
        en: "Move the organization instance of IAM Identity Center from the management account to IdentityAdmin, so that every permission set, including PlatformAdmin, is managed from that account."
        fr: "Déplacer l'instance d'organisation d'IAM Identity Center du compte de gestion vers IdentityAdmin, afin que tous les ensembles d'autorisations, y compris PlatformAdmin, soient gérés depuis ce compte."
    - id: d
      text:
        en: "Attach an SCP to the IdentityAdmin account that allows sso:UpdatePermissionSet and sso:ProvisionPermissionSet on all permission sets in the organization instance."
        fr: "Attacher au compte IdentityAdmin une SCP qui autorise sso:UpdatePermissionSet et sso:ProvisionPermissionSet sur tous les ensembles d'autorisations de l'instance d'organisation."
answer: { optionId: a }
explanation:
  correct:
    en: "A delegated administrator cannot alter permission sets that are provisioned in the management account; such a permission set can be changed only by an administrator in the management account. Using a separate permission set for the member accounts lets the identity team manage it from IdentityAdmin, while the permission set that grants management account access stays with the small group."
    fr: "Un administrateur délégué ne peut pas modifier les ensembles d'autorisations provisionnés dans le compte de gestion ; un tel ensemble ne peut être modifié que par un administrateur du compte de gestion. Un ensemble d'autorisations distinct pour les comptes membres permet à l'équipe d'identité de le gérer depuis IdentityAdmin, tandis que l'ensemble qui donne accès au compte de gestion reste aux mains du petit groupe."
  options:
    b:
      en: "The restriction is enforced by IAM Identity Center for delegated administrators, so more IAM permissions in IdentityAdmin do not allow changes to a permission set provisioned in the management account."
      fr: "La restriction est appliquée par IAM Identity Center aux administrateurs délégués : davantage d'autorisations IAM dans IdentityAdmin ne permettent pas de modifier un ensemble d'autorisations provisionné dans le compte de gestion."
    c:
      en: "The organization instance must always reside in the management account; only administration can be delegated to a member account."
      fr: "L'instance d'organisation doit toujours résider dans le compte de gestion ; seule l'administration peut être déléguée à un compte membre."
    d:
      en: "SCPs never grant permissions, and the delegated administrator restriction does not come from an SCP."
      fr: "Les SCP n'accordent jamais d'autorisations, et la restriction de l'administrateur délégué ne provient pas d'une SCP."
references:
  - title: Delegated administration
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/delegated-admin.html
