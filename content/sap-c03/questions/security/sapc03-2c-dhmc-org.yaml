id: sapc03-2c-dhmc-org
objective: "2.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An energy company has 120 accounts in AWS Organizations across four AWS Regions. The security team wants Amazon Inspector agent-based scanning with deep inspection and AWS Systems Manager Patch Manager on every Amazon EC2 instance. An audit shows that many instances launched by application teams have no instance profile. Other instances have instance profiles that the application teams own, and the platform team is not allowed to modify those roles. All AMIs include a current version of the SSM Agent, and all instances require IMDSv2. Instances launched in the future must become managed automatically, and the company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise du secteur de l'énergie possède 120 comptes dans AWS Organizations, répartis sur quatre Régions AWS. L'équipe de sécurité veut l'analyse basée sur un agent d'Amazon Inspector avec inspection approfondie et AWS Systems Manager Patch Manager sur chaque instance Amazon EC2. Un audit montre que de nombreuses instances lancées par les équipes applicatives n'ont pas de profil d'instance. D'autres instances ont des profils d'instance qui appartiennent aux équipes applicatives, et l'équipe plateforme n'a pas le droit de modifier ces rôles. Toutes les AMI incluent une version récente de l'agent SSM, et toutes les instances exigent IMDSv2. Les instances lancées à l'avenir doivent devenir gérées automatiquement, et l'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "From the management account, use Quick Setup to set up Default Host Management Configuration for the organization, so that Systems Manager manages EC2 instances without an instance profile."
        fr: "Depuis le compte de gestion, utiliser Quick Setup pour configurer la configuration par défaut de gestion des hôtes (Default Host Management Configuration) pour l'organisation, afin que Systems Manager gère les instances EC2 sans profil d'instance."
    - id: b
      text:
        en: "In each account, deploy an EventBridge rule on RunInstances that invokes a Lambda function to attach an instance profile with the AmazonSSMManagedInstanceCore policy to every new instance."
        fr: "Dans chaque compte, déployer une règle EventBridge sur RunInstances qui appelle une fonction Lambda pour attacher à chaque nouvelle instance un profil d'instance avec la politique AmazonSSMManagedInstanceCore."
    - id: c
      text:
        en: "From the Inspector delegated administrator account, switch the EC2 scan mode to hybrid scanning so that instances without an instance profile are scanned agentlessly from EBS snapshots."
        fr: "Depuis le compte administrateur délégué d'Inspector, passer le mode d'analyse EC2 en analyse hybride afin que les instances sans profil d'instance soient analysées sans agent à partir d'instantanés EBS."
    - id: d
      text:
        en: "Create Systems Manager hybrid activations in every account and Region, and register each EC2 instance as a hybrid managed node by using the activation code and activation ID."
        fr: "Créer des activations hybrides Systems Manager dans chaque compte et chaque Région, et enregistrer chaque instance EC2 comme nœud géré hybride à l'aide du code et de l'ID d'activation."
answer: { optionId: a }
explanation:
  correct:
    en: "Default Host Management Configuration makes EC2 instances Systems Manager managed instances by using a default IAM role, without an instance profile, which enables Patch Manager and the agent-based Inspector scanning that depends on SSM. It requires IMDSv2 and a recent SSM Agent, which the instances have. If an existing instance profile does not grant Systems Manager permissions, the agent uses the default role, so the application teams' roles stay untouched, and Quick Setup activates it for all accounts and Regions from the management account."
    fr: "La configuration par défaut de gestion des hôtes fait des instances EC2 des instances gérées par Systems Manager au moyen d'un rôle IAM par défaut, sans profil d'instance, ce qui permet Patch Manager et l'analyse Inspector basée sur un agent, qui dépend de SSM. Elle exige IMDSv2 et un agent SSM récent, ce que les instances possèdent. Si un profil d'instance existant n'accorde pas d'autorisations Systems Manager, l'agent utilise le rôle par défaut : les rôles des équipes applicatives restent intacts, et Quick Setup l'active pour tous les comptes et toutes les Régions depuis le compte de gestion."
  options:
    b:
      en: "Custom functions must be built and maintained in 120 accounts, and instances that already have an instance profile cannot receive another one, while their roles cannot be modified."
      fr: "Des fonctions personnalisées doivent être créées et maintenues dans 120 comptes, et les instances qui ont déjà un profil d'instance ne peuvent pas en recevoir un autre, alors que leurs rôles ne peuvent pas être modifiés."
    c:
      en: "Agentless scanning does not make instances managed, so Patch Manager still cannot patch them, and the requirement is agent-based scanning with deep inspection."
      fr: "L'analyse sans agent ne rend pas les instances gérées : Patch Manager ne peut toujours pas les corriger, et l'exigence porte sur l'analyse basée sur un agent avec inspection approfondie."
    d:
      en: "Hybrid activations are designed for on-premises servers and other non-EC2 machines; registering hundreds of EC2 instances this way is manual work in every account and Region."
      fr: "Les activations hybrides sont conçues pour les serveurs sur site et les autres machines non EC2 ; enregistrer ainsi des centaines d'instances EC2 est un travail manuel dans chaque compte et chaque Région."
references:
  - title: Managing EC2 instances automatically with Default Host Management Configuration
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/fleet-manager-default-host-management-configuration.html
  - title: Set up the Default Host Management Configuration for an organization using Quick Setup
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/quick-setup-default-host-management-configuration.html
