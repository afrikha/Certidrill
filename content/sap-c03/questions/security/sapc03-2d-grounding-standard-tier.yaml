id: sapc03-2d-grounding-standard-tier
objective: "2.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European bank runs a retrieval-augmented generation (RAG) assistant on Amazon Bedrock that answers employees' questions about internal credit policies in English, French and German. The assistant is conversational: answers summarize and rephrase the retrieved passages over multi-turn chats. Auditors found answers that stated rules absent from the retrieved passages and answers that did not address the question. Responses of either kind must now be blocked before they reach employees. A pilot with a Classic tier guardrail blocked many correct conversational summaries. Data may be processed in any AWS Region in the EU but must not leave the EU, and the assistant runs in an EU Region where all Standard tier safeguards are available.

    Which solution will meet these requirements?
  fr: |
    Une banque européenne exploite sur Amazon Bedrock un assistant de génération augmentée par récupération (RAG) qui répond aux questions des employés sur les politiques de crédit internes en anglais, en français et en allemand. L'assistant est conversationnel : les réponses résument et reformulent les passages récupérés au fil de conversations à plusieurs tours. Les auditeurs ont trouvé des réponses qui énonçaient des règles absentes des passages récupérés et des réponses qui ne traitaient pas la question. Les réponses de ces deux types doivent désormais être bloquées avant d'atteindre les employés. Un pilote avec un guardrail de niveau Classic a bloqué de nombreux résumés conversationnels corrects. Les données peuvent être traitées dans n'importe quelle Région AWS de l'UE mais ne doivent pas quitter l'UE, et l'assistant s'exécute dans une Région de l'UE où toutes les protections du niveau Standard sont disponibles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Build an Automated Reasoning policy from the credit policy documents, attach it to the guardrail, and block every response for which the check returns an INVALID finding.", fr: "Construire une politique Automated Reasoning à partir des documents de politique de crédit, l'attacher au guardrail et bloquer chaque réponse pour laquelle la vérification renvoie un résultat INVALID." }
    - id: b
      text: { en: "Keep the Classic tier guardrail, lower the grounding threshold to 0.3 so that fewer summaries are blocked, and keep the relevance threshold at its current value.", fr: "Conserver le guardrail de niveau Classic, abaisser le seuil d'ancrage à 0,3 pour que moins de résumés soient bloqués, et garder le seuil de pertinence à sa valeur actuelle." }
    - id: c
      text: { en: "Set all content filters to HIGH strength, add denied topics for subjects unrelated to credit policies, and add a word filter with the names of rules that do not exist.", fr: "Régler tous les filtres de contenu à la force HIGH, ajouter des sujets refusés pour les sujets sans rapport avec les politiques de crédit, et ajouter un filtre de mots avec les noms de règles qui n'existent pas." }
    - id: d
      text: { en: "Enable contextual grounding checks with grounding and relevance thresholds on the Standard tier, select the EU guardrail profile for cross-Region inference, and pass the passages as the grounding source.", fr: "Activer les vérifications d'ancrage contextuel avec des seuils d'ancrage et de pertinence au niveau Standard, choisir le profil de guardrail UE pour l'inférence interrégionale, et transmettre les passages comme source d'ancrage." }
answer: { optionId: d }
explanation:
  correct:
    en: "Contextual grounding checks score each response for grounding in the supplied source and for relevance to the query, and block responses below the thresholds. The Standard tier supports conversational and reasoning content and many more languages than Classic, which handles only English, French and Spanish. It requires a guardrail profile for cross-Region inference, which keeps prompts and responses within the originating geography, here the EU."
    fr: "Les vérifications d'ancrage contextuel notent chaque réponse pour son ancrage dans la source fournie et sa pertinence par rapport à la requête, et bloquent les réponses sous les seuils. Le niveau Standard prend en charge le contenu conversationnel et de raisonnement et beaucoup plus de langues que le niveau Classic, limité à l'anglais, au français et à l'espagnol. Il exige un profil de guardrail pour l'inférence interrégionale, qui garde les invites et réponses dans la zone géographique d'origine, ici l'UE."
  options:
    a:
      en: "Automated Reasoning checks run in detect mode only and return findings instead of blocking, they support English (US) only, and they validate logical rules rather than relevance to the question."
      fr: "Les vérifications Automated Reasoning fonctionnent uniquement en mode détection et renvoient des résultats au lieu de bloquer, elles ne prennent en charge que l'anglais (US), et elles valident des règles logiques plutôt que la pertinence par rapport à la question."
    b:
      en: "The Classic tier does not support conversational use cases or German, and a lower grounding threshold lets more ungrounded answers through, which defeats the audit finding."
      fr: "Le niveau Classic ne prend en charge ni les cas d'usage conversationnels ni l'allemand, et un seuil d'ancrage plus bas laisse passer davantage de réponses non ancrées, ce qui contredit le constat d'audit."
    c:
      en: "Content filters, denied topics and word filters detect harmful or listed content; none of them compares a response with the retrieved passages, so invented rules are not detected."
      fr: "Les filtres de contenu, sujets refusés et filtres de mots détectent du contenu nuisible ou listé ; aucun ne compare une réponse aux passages récupérés : les règles inventées ne sont pas détectées."
references:
  - title: Use contextual grounding check to filter hallucinations in responses
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-contextual-grounding-check.html
  - title: Safeguard tiers for guardrails policies
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tiers.html
