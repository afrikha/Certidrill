id: sapc03-2a-two-orgs-one-idp
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany operates two separate organizations in AWS Organizations. One organization contains only the payments workloads, which are kept separate to limit the scope of a PCI DSS audit. The other organization contains all other workloads. Each organization has its own organization instance of AWS IAM Identity Center, and access is managed with permission sets in each organization. All employees are managed in Microsoft Entra ID. Employees must sign in to both access portals with their Entra ID credentials, and user and group changes in Entra ID must appear automatically in both instances. The organizations must stay separate.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    AnyCompany exploite deux organisations distinctes dans AWS Organizations. L'une contient uniquement les charges de travail de paiement, séparées pour limiter le périmètre d'un audit PCI DSS. L'autre contient toutes les autres charges de travail. Chaque organisation dispose de sa propre instance d'organisation d'AWS IAM Identity Center, et l'accès est géré avec des ensembles d'autorisations (permission sets) dans chaque organisation. Tous les employés sont gérés dans Microsoft Entra ID. Les employés doivent se connecter aux deux portails d'accès avec leurs informations d'identification Entra ID, et les changements d'utilisateurs et de groupes dans Entra ID doivent apparaître automatiquement dans les deux instances. Les organisations doivent rester distinctes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "In Entra ID, create one enterprise application for each IAM Identity Center instance, and configure SAML 2.0 with the metadata of that instance."
        fr: "Dans Entra ID, créer une application d'entreprise par instance d'IAM Identity Center, et configurer SAML 2.0 avec les métadonnées de cette instance."
    - id: b
      text:
        en: "Register the management account of the payments organization as a delegated administrator of the IAM Identity Center instance of the other organization."
        fr: "Inscrire le compte de gestion de l'organisation de paiement comme administrateur délégué de l'instance IAM Identity Center de l'autre organisation."
    - id: c
      text:
        en: "Share the IAM Identity Center instance of the main organization with the payments organization by using AWS Resource Access Manager (AWS RAM)."
        fr: "Partager l'instance IAM Identity Center de l'organisation principale avec l'organisation de paiement à l'aide d'AWS Resource Access Manager (AWS RAM)."
    - id: d
      text:
        en: "In each enterprise application, configure automatic provisioning with the SCIM endpoint and the access token of the corresponding IAM Identity Center instance."
        fr: "Dans chaque application d'entreprise, configurer le provisionnement automatique avec le point de terminaison SCIM et le jeton d'accès de l'instance IAM Identity Center correspondante."
    - id: e
      text:
        en: "Create an IAM SAML identity provider for Entra ID in every account of the payments organization, and grant access with IAM roles that trust it."
        fr: "Créer un fournisseur d'identité SAML IAM pour Entra ID dans chaque compte de l'organisation de paiement, et accorder l'accès avec des rôles IAM qui l'approuvent."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Each organization instance is a separate service provider with its own SAML metadata, SCIM endpoint and access token. One Entra ID enterprise application per instance gives sign-in with the same credentials, and SCIM provisioning in each application keeps both identity stores synchronized, without linking the organizations."
    fr: "Chaque instance d'organisation est un fournisseur de services distinct, avec ses propres métadonnées SAML, son point de terminaison SCIM et son jeton d'accès. Une application d'entreprise Entra ID par instance permet la connexion avec les mêmes informations d'identification, et le provisionnement SCIM de chaque application synchronise les deux magasins d'identités, sans lier les organisations."
  options:
    b:
      en: "A delegated administrator must be a member account of the same organization; an account of another organization cannot administer the instance."
      fr: "Un administrateur délégué doit être un compte membre de la même organisation ; un compte d'une autre organisation ne peut pas administrer l'instance."
    c:
      en: "An IAM Identity Center instance belongs to its organization's management account and cannot be shared with another organization through AWS RAM."
      fr: "Une instance IAM Identity Center appartient au compte de gestion de son organisation et ne peut pas être partagée avec une autre organisation via AWS RAM."
    e:
      en: "Per-account IAM SAML providers and roles bypass the payments organization's permission sets, which the company uses to manage access."
      fr: "Des fournisseurs SAML IAM et des rôles par compte contournent les ensembles d'autorisations de l'organisation de paiement, que l'entreprise utilise pour gérer l'accès."
references:
  - title: Provision users and groups from an external identity provider using SCIM
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
  - title: Delegated administration
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/delegated-admin.html
