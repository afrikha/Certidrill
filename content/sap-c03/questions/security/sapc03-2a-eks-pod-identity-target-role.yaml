id: sapc03-2a-eks-pod-identity-target-role
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs shared Amazon EKS clusters in a platform account. Each business unit owns a separate data account that contains Amazon DynamoDB tables. Services that run in the clusters use EKS Pod Identity and must write to the tables of their business unit. The data security policy states that access to data account resources must use IAM roles that live in the data accounts. The owners of each data account must control these roles' trust policies and restrict them to a specific cluster, namespace and service account. The application teams cannot change their code to call AWS STS.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exploite des clusters Amazon EKS partagés dans un compte plateforme. Chaque unité opérationnelle possède un compte de données distinct qui contient des tables Amazon DynamoDB. Les services qui s'exécutent dans les clusters utilisent EKS Pod Identity et doivent écrire dans les tables de leur unité opérationnelle. La politique de sécurité des données impose que l'accès aux ressources des comptes de données utilise des rôles IAM situés dans ces comptes. Les propriétaires de chaque compte de données doivent contrôler les politiques d'approbation de ces rôles et les restreindre à un cluster, un espace de noms et un compte de service précis. Les équipes applicatives ne peuvent pas modifier leur code pour appeler AWS STS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create pod identity associations that map each service account directly to the role in the data account, and make that role trust the pods.eks.amazonaws.com service principal."
        fr: "Créer des associations d'identité de pod qui associent directement chaque compte de service au rôle du compte de données, et faire approuver le principal de service pods.eks.amazonaws.com par ce rôle."
    - id: b
      text:
        en: "Attach resource-based policies to the DynamoDB tables that allow the Pod Identity roles of the platform account, and keep the existing pod identity associations of each cluster unchanged."
        fr: "Attacher aux tables DynamoDB des politiques basées sur les ressources qui autorisent les rôles Pod Identity du compte plateforme, et conserver sans modification les associations d'identité de pod de chaque cluster."
    - id: c
      text:
        en: "Update the services to call sts:AssumeRole on the data account role with their Pod Identity credentials, and pass the cluster, namespace and service account as session tags."
        fr: "Modifier les services pour qu'ils appellent sts:AssumeRole sur le rôle du compte de données avec leurs informations d'identification Pod Identity, en transmettant le cluster, l'espace de noms et le compte de service comme balises de session."
    - id: d
      text:
        en: "Create pod identity associations with the data account role as the target IAM role, and make that role trust the Pod Identity role with conditions on the cluster, namespace and service account tags."
        fr: "Créer des associations d'identité de pod avec le rôle du compte de données comme rôle IAM cible, et faire approuver le rôle Pod Identity par ce rôle avec des conditions sur les balises de cluster, d'espace de noms et de compte de service."
answer: { optionId: d }
explanation:
  correct:
    en: "With a target IAM role, EKS Pod Identity assumes the Pod Identity role in the cluster's account and then automatically assumes the target role, which can be in any account. The data account owners write the target role's trust policy, which can check the eks-cluster-arn, kubernetes-namespace and kubernetes-service-account session tags, and the application needs no code change."
    fr: "Avec un rôle IAM cible, EKS Pod Identity endosse le rôle Pod Identity du compte du cluster puis endosse automatiquement le rôle cible, qui peut se trouver dans n'importe quel compte. Les propriétaires des comptes de données rédigent la politique d'approbation du rôle cible, qui peut vérifier les balises de session eks-cluster-arn, kubernetes-namespace et kubernetes-service-account, et l'application ne nécessite aucune modification de code."
  options:
    a:
      en: "The role that a pod identity association uses directly must be in the same account as the cluster; another account's role is reached only as a target role."
      fr: "Le rôle utilisé directement par une association d'identité de pod doit se trouver dans le même compte que le cluster ; le rôle d'un autre compte n'est accessible que comme rôle cible."
    b:
      en: "Resource-based policies grant access to platform account roles, which violates the rule that access must use roles in the data accounts."
      fr: "Des politiques basées sur les ressources accordent l'accès aux rôles du compte plateforme, ce qui enfreint la règle selon laquelle l'accès doit utiliser des rôles des comptes de données."
    c:
      en: "Calling AWS STS from the services is a code change, which the application teams cannot make."
      fr: "Appeler AWS STS depuis les services est une modification de code, que les équipes applicatives ne peuvent pas faire."
references:
  - title: Access AWS Resources using EKS Pod Identity Target IAM Roles
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-id-assign-target-role.html
