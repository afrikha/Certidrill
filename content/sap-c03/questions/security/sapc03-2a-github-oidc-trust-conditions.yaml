id: sapc03-2a-github-oidc-trust-conditions
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's GitHub organization, named AnyCompany, contains 200 repositories. Workflows in GitHub Actions deploy to several AWS accounts by using OpenID Connect (OIDC). The production account already has an IAM OIDC identity provider for token.actions.githubusercontent.com. A solutions architect is writing the trust policy of the ProdDeploy role. Only workflows of the payments-api repository that run on the main branch may assume the role. Workflows of other repositories, including repositories in other GitHub organizations, must not be able to assume it.

    Which combination of trust policy conditions will meet these requirements? (Choose two.)
  fr: |
    L'organisation GitHub d'AnyCompany, nommée AnyCompany, contient 200 dépôts. Des flux de travail GitHub Actions déploient dans plusieurs comptes AWS à l'aide d'OpenID Connect (OIDC). Le compte de production possède déjà un fournisseur d'identité OIDC IAM pour `token.actions.githubusercontent.com`. Un architecte de solutions rédige la politique d'approbation du rôle ProdDeploy. Seuls les flux de travail du dépôt payments-api qui s'exécutent sur la branche main peuvent endosser le rôle. Les flux de travail des autres dépôts, y compris ceux d'autres organisations GitHub, ne doivent pas pouvoir l'endosser.

    Quelle combinaison de conditions de politique d'approbation répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "StringEquals on token.actions.githubusercontent.com:aud with the value sts.amazonaws.com."
        fr: "StringEquals sur `token.actions.githubusercontent.com:aud` avec la valeur `sts.amazonaws.com`."
    - id: b
      text:
        en: "StringLike on token.actions.githubusercontent.com:sub with the value repo:AnyCompany/*."
        fr: "StringLike sur `token.actions.githubusercontent.com:sub` avec la valeur `repo:AnyCompany/*`."
    - id: c
      text:
        en: "StringEquals on aws:PrincipalOrgID with the ID of AnyCompany's organization in AWS Organizations."
        fr: "StringEquals sur aws:PrincipalOrgID avec l'ID de l'organisation d'AnyCompany dans AWS Organizations."
    - id: d
      text:
        en: "StringEquals on token.actions.githubusercontent.com:sub with the value repo:AnyCompany/payments-api:ref:refs/heads/main."
        fr: "StringEquals sur `token.actions.githubusercontent.com:sub` avec la valeur `repo:AnyCompany/payments-api:ref:refs/heads/main`."
    - id: e
      text:
        en: "StringEquals on sts:ExternalId with the numeric ID of the payments-api repository."
        fr: "StringEquals sur sts:ExternalId avec l'ID numérique du dépôt payments-api."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The aud condition makes sure that the token was issued for AWS STS, and the sub condition limits the role to one repository and one branch. IAM documentation warns that without a specific sub condition, workflows from repositories or organizations outside the company's control can assume roles that trust the GitHub provider."
    fr: "La condition aud garantit que le jeton a été émis pour AWS STS, et la condition sub limite le rôle à un dépôt et à une branche. La documentation IAM avertit que, sans condition sub précise, des flux de travail de dépôts ou d'organisations hors du contrôle de l'entreprise peuvent endosser les rôles qui approuvent le fournisseur GitHub."
  options:
    b:
      en: "A subject limited to the GitHub organization lets every one of the 200 repositories and every branch assume the production role; AWS recommends a more specific value."
      fr: "Un sujet limité à l'organisation GitHub permet aux 200 dépôts et à toutes les branches d'endosser le rôle de production ; AWS recommande une valeur plus précise."
    c:
      en: "A web identity federated from GitHub is not a principal of an AWS organization, so aws:PrincipalOrgID does not identify the repository or branch."
      fr: "Une identité web fédérée depuis GitHub n'est pas un principal d'une organisation AWS : aws:PrincipalOrgID n'identifie ni le dépôt ni la branche."
    e:
      en: "An external ID is a value passed in AssumeRole calls by third parties; GitHub OIDC uses AssumeRoleWithWebIdentity and token claims instead."
      fr: "Un ID externe est une valeur transmise dans les appels AssumeRole par des tiers ; GitHub OIDC utilise AssumeRoleWithWebIdentity et les revendications du jeton."
references:
  - title: Create a role for OpenID Connect federation (console)
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_create_for-idp_oidc.html
