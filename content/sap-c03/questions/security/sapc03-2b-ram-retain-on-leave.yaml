id: sapc03-2b-ram-retain-on-leave
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany is divesting a business unit. The unit's three accounts will leave AnyCompany's organization next month and join the buyer's organization. The unit's VPCs are attached to a transit gateway that AnyCompany's network account shares with the organization through AWS RAM. The buyer has agreed that the unit keeps this connectivity for six months after the move. The unit must not recreate its attachments, and the connectivity must not be interrupted when the accounts change organizations.

    Which solution will meet these requirements?
  fr: |
    AnyCompany cède une unité commerciale. Les trois comptes de l'unité quitteront l'organisation d'AnyCompany le mois prochain pour rejoindre celle de l'acquéreur. Les VPC de l'unité sont attachés à une passerelle de transit que le compte réseau d'AnyCompany partage avec l'organisation via AWS RAM. L'acquéreur a accepté que l'unité conserve cette connectivité six mois après le transfert. L'unité ne doit pas recréer ses attachements, et la connectivité ne doit pas être interrompue lorsque les comptes changent d'organisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a new transit gateway share that allows external principals and sets RetainSharingOnAccountLeaveOrganization to true, and have the three accounts accept it before they leave.", fr: "Créer un nouveau partage de la passerelle de transit qui autorise les principaux externes et définit RetainSharingOnAccountLeaveOrganization sur true, et le faire accepter par les trois comptes avant leur départ." } }
    - { id: b, text: { en: "Keep the existing resource share unchanged, because accounts that leave the organization keep access to the resources that were shared with the whole organization.", fr: "Conserver le partage de ressources existant sans le modifier, car les comptes qui quittent l'organisation conservent l'accès aux ressources partagées avec toute l'organisation." } }
    - { id: c, text: { en: "Modify the existing organization resource share to set RetainSharingOnAccountLeaveOrganization to true, and keep the organization as its only principal.", fr: "Modifier le partage de ressources d'organisation existant pour définir RetainSharingOnAccountLeaveOrganization sur true, et garder l'organisation comme seul principal." } }
    - { id: d, text: { en: "Share subnets of a network account VPC with the three accounts in a share that retains access, and move the unit's workloads into those subnets.", fr: "Partager des sous-réseaux d'un VPC du compte réseau avec les trois comptes dans un partage qui conserve l'accès, et déplacer les charges de travail de l'unité dans ces sous-réseaux." } }
answer: { optionId: a }
explanation:
  correct:
    en: "RetainSharingOnAccountLeaveOrganization can be set only when a resource share is created, and it requires allowExternalPrincipals to be true. AWS RAM then sends an invitation to each consuming account, which keeps access after it leaves the organization; transit gateways can be shared with any AWS account."
    fr: "RetainSharingOnAccountLeaveOrganization ne peut être défini qu'à la création d'un partage de ressources, et exige que allowExternalPrincipals soit à true. AWS RAM envoie alors une invitation à chaque compte consommateur, qui conserve l'accès après avoir quitté l'organisation ; les passerelles de transit peuvent être partagées avec n'importe quel compte AWS."
  options:
    b:
      en: "Access that comes from sharing with the organization ends when an account leaves it, so the attachments would lose their transit gateway."
      fr: "L'accès issu d'un partage avec l'organisation prend fin lorsqu'un compte la quitte : les attachements perdraient leur passerelle de transit."
    c:
      en: "The setting can be chosen only when a resource share is created, and it applies to shares with external principals, not to an organization-only share."
      fr: "Ce paramètre ne peut être choisi qu'à la création d'un partage de ressources, et il s'applique aux partages avec des principaux externes, pas à un partage limité à l'organisation."
    d:
      en: "Subnets can be shared only within the organization, so they cannot be in a share that retains access, and moving workloads breaks the no-change requirement."
      fr: "Les sous-réseaux ne peuvent être partagés qu'au sein de l'organisation : ils ne peuvent pas figurer dans un partage qui conserve l'accès, et déplacer les charges de travail enfreint l'exigence de ne rien modifier."
references:
  - title: Sharing your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html
