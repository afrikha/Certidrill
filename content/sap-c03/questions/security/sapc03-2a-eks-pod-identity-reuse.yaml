id: sapc03-2a-eks-pod-identity-reuse
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's platform team runs 30 Amazon EKS clusters with managed node groups of Linux Amazon EC2 instances in one AWS account across three Regions. Clusters are replaced often during blue/green upgrades. Workloads use IAM roles for service accounts (IRSA). Every new cluster requires a new IAM OIDC identity provider and an update to the trust policies of 40 IAM roles, and some trust policies are close to their size limit. The company wants each Kubernetes service account to keep its own least-privilege role and wants to reuse the same roles in every new cluster without editing their trust policies each time.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    L'équipe plateforme d'AnyCompany exploite 30 clusters Amazon EKS avec des groupes de nœuds gérés d'instances Amazon EC2 Linux, dans un compte AWS et trois Régions. Les clusters sont souvent remplacés lors de mises à niveau bleu/vert. Les charges de travail utilisent les rôles IAM pour les comptes de service (IRSA). Chaque nouveau cluster exige un nouveau fournisseur d'identité OIDC IAM et une mise à jour des politiques d'approbation de 40 rôles IAM, et certaines politiques d'approbation approchent de leur taille maximale. L'entreprise veut que chaque compte de service Kubernetes conserve son propre rôle de moindre privilège, et veut réutiliser les mêmes rôles dans chaque nouveau cluster sans modifier à chaque fois leurs politiques d'approbation.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Keep IRSA, and create a single IAM OIDC identity provider that all 30 clusters share by configuring every cluster with the same OIDC issuer URL."
        fr: "Conserver IRSA, et créer un seul fournisseur d'identité OIDC IAM partagé par les 30 clusters en configurant chaque cluster avec la même URL d'émetteur OIDC."
    - id: b
      text:
        en: "Install the EKS Pod Identity Agent in each cluster, make the roles trust pods.eks.amazonaws.com, and create pod identity associations for the service accounts in each cluster."
        fr: "Installer l'agent EKS Pod Identity dans chaque cluster, faire approuver pods.eks.amazonaws.com par les rôles, et créer des associations d'identité de pod pour les comptes de service de chaque cluster."
    - id: c
      text:
        en: "Attach the permissions of the 40 roles to the node instance role of each node group, and use Kubernetes network policies to control which pods can call AWS services."
        fr: "Attacher les autorisations des 40 rôles au rôle d'instance de nœud de chaque groupe de nœuds, et utiliser des politiques réseau Kubernetes pour contrôler quels pods peuvent appeler les services AWS."
    - id: d
      text:
        en: "Create an IAM user for each service account, store its access keys in AWS Secrets Manager, and mount the keys into the pods with the Secrets Store CSI Driver."
        fr: "Créer un utilisateur IAM par compte de service, stocker ses clés d'accès dans AWS Secrets Manager, et monter les clés dans les pods avec le pilote Secrets Store CSI."
answer: { optionId: b }
explanation:
  correct:
    en: "EKS Pod Identity does not use OIDC identity providers: the role trusts the pods.eks.amazonaws.com service principal once, and the same role can be associated with service accounts in any cluster without changing its trust policy. Associations are configured in Amazon EKS, so a new cluster needs only the agent and its associations."
    fr: "EKS Pod Identity n'utilise pas de fournisseurs d'identité OIDC : le rôle approuve une seule fois le principal de service pods.eks.amazonaws.com, et le même rôle peut être associé à des comptes de service de n'importe quel cluster sans modifier sa politique d'approbation. Les associations se configurent dans Amazon EKS : un nouveau cluster n'a besoin que de l'agent et de ses associations."
  options:
    a:
      en: "Each EKS cluster has its own OIDC issuer URL, so IRSA still needs one provider per cluster and trust policy entries for each issuer."
      fr: "Chaque cluster EKS possède sa propre URL d'émetteur OIDC : IRSA exige toujours un fournisseur par cluster et des entrées de politique d'approbation pour chaque émetteur."
    c:
      en: "Every pod on a node could use the node role's combined permissions, which breaks least privilege; network policies do not scope IAM permissions."
      fr: "Chaque pod d'un nœud pourrait utiliser les autorisations cumulées du rôle de nœud, ce qui rompt le moindre privilège ; les politiques réseau ne restreignent pas les autorisations IAM."
    d:
      en: "Long-term access keys must be rotated and distributed, which adds risk and work compared with temporary role credentials."
      fr: "Des clés d'accès à long terme doivent être renouvelées et distribuées, ce qui ajoute du risque et du travail par rapport aux informations d'identification temporaires d'un rôle."
references:
  - title: Learn how EKS Pod Identity grants pods access to AWS services
    url: https://docs.aws.amazon.com/eks/latest/userguide/pod-identities.html
