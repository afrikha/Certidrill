id: sapc03-2c-dr-within-country
objective: "2.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Canadian provincial health agency runs a patient records platform in ca-central-1 on Amazon Aurora PostgreSQL, with documents stored in Amazon S3. A data residency law requires that patient data and every copy of it, including backups and disaster recovery replicas, remain in Canada. The agency's new disaster recovery plan requires a second AWS Region, an RPO of less than 1 minute for the database, and continuous replication of new documents. AWS Backup already takes daily backups that must also be copied to the recovery Region.

    Which solution will meet these requirements?
  fr: |
    Une agence de santé provinciale canadienne exploite une plateforme de dossiers patients dans ca-central-1 sur Amazon Aurora PostgreSQL, avec des documents stockés dans Amazon S3. Une loi de résidence des données exige que les données des patients et chacune de leurs copies, y compris les sauvegardes et les répliques de reprise après sinistre, restent au Canada. Le nouveau plan de reprise après sinistre de l'agence exige une deuxième Région AWS, un RPO inférieur à 1 minute pour la base de données et une réplication continue des nouveaux documents. AWS Backup effectue déjà des sauvegardes quotidiennes qui doivent aussi être copiées dans la Région de reprise.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add an Aurora Global Database secondary cluster in us-east-1, replicate the bucket to us-east-1 with S3 Cross-Region Replication, and copy the backups to a vault in us-east-1."
        fr: "Ajouter un cluster secondaire Aurora Global Database dans us-east-1, répliquer le compartiment vers us-east-1 avec S3 Cross-Region Replication, et copier les sauvegardes dans un coffre d'us-east-1."
    - id: b
      text:
        en: "Add an Aurora Global Database secondary cluster in ca-west-1, replicate the bucket to ca-west-1 with S3 Cross-Region Replication, and copy the backups to a vault in ca-west-1."
        fr: "Ajouter un cluster secondaire Aurora Global Database dans ca-west-1, répliquer le compartiment vers ca-west-1 avec S3 Cross-Region Replication, et copier les sauvegardes dans un coffre de ca-west-1."
    - id: c
      text:
        en: "Convert the Aurora cluster to a Multi-AZ deployment with three Availability Zones in ca-central-1, and turn on S3 Versioning with Same-Region Replication."
        fr: "Convertir le cluster Aurora en déploiement Multi-AZ sur trois zones de disponibilité dans ca-central-1, et activer la gestion des versions S3 avec Same-Region Replication."
    - id: d
      text:
        en: "Copy Aurora snapshots to ca-west-1 every hour with AWS Backup, replicate the bucket to ca-west-1 with S3 Cross-Region Replication, and copy the backups to ca-west-1."
        fr: "Copier toutes les heures des instantanés Aurora vers ca-west-1 avec AWS Backup, répliquer le compartiment vers ca-west-1 avec S3 Cross-Region Replication, et copier les sauvegardes vers ca-west-1."
answer: { optionId: b }
explanation:
  correct:
    en: "Canada has two AWS Regions, Canada (Central) and Canada West (Calgary), and Aurora PostgreSQL global databases are supported in both. A secondary cluster in ca-west-1 provides storage-based replication with an RPO typically measured in seconds, S3 Cross-Region Replication continuously copies new objects, and backup copies to a vault in ca-west-1 keep every copy in Canada."
    fr: "Le Canada compte deux Régions AWS, Canada (Centre) et Canada Ouest (Calgary), et les bases de données globales Aurora PostgreSQL sont prises en charge dans les deux. Un cluster secondaire dans ca-west-1 fournit une réplication au niveau du stockage avec un RPO généralement de l'ordre de quelques secondes, S3 Cross-Region Replication copie en continu les nouveaux objets, et les copies de sauvegarde dans un coffre de ca-west-1 conservent toutes les copies au Canada."
  options:
    a:
      en: "Every replica and backup copy would be stored in the United States, which violates the residency law."
      fr: "Chaque réplique et chaque copie de sauvegarde seraient stockées aux États-Unis, ce qui viole la loi de résidence."
    c:
      en: "Multi-AZ protects against the loss of an Availability Zone but does not provide the required second Region."
      fr: "Le Multi-AZ protège contre la perte d'une zone de disponibilité mais ne fournit pas la deuxième Région exigée."
    d:
      en: "Hourly snapshot copies give an RPO of up to 1 hour for the database, which misses the 1-minute target."
      fr: "Des copies horaires d'instantanés donnent un RPO pouvant atteindre 1 heure pour la base de données, ce qui ne respecte pas l'objectif de 1 minute."
references:
  - title: Supported Regions and DB engines for Aurora global databases
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.Aurora_Fea_Regions_DB-eng.Feature.GlobalDatabase.html
