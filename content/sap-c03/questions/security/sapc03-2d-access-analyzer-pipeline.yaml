id: sapc03-2d-access-analyzer-pipeline
objective: "2.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 120 AWS accounts in AWS Organizations. Application teams deploy all infrastructure with AWS CloudFormation templates through AWS CodePipeline pipelines, and their templates often contain S3 bucket policies, AWS KMS key policies and Amazon SQS queue policies. A threat modeling review rated two related risks as high: a template that makes a resource public, and a template that silently widens access granted by an already approved cross-account policy. The agreed mitigation must stop such templates before deployment, because a detected misconfiguration may already have been exploited. Teams must still be able to deploy the cross-account policies that the security team has approved. The security team also needs an organization-wide inventory of the resources that are already shared outside the organization.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 120 comptes AWS dans AWS Organizations. Les équipes applicatives déploient toute l'infrastructure avec des modèles AWS CloudFormation par des pipelines AWS CodePipeline, et leurs modèles contiennent souvent des politiques de compartiment S3, des politiques de clé AWS KMS et des politiques de file d'attente Amazon SQS. Une revue de modélisation des menaces a classé deux risques liés comme élevés : un modèle qui rend une ressource publique, et un modèle qui élargit discrètement l'accès accordé par une politique intercomptes déjà approuvée. La mesure d'atténuation retenue doit arrêter ces modèles avant le déploiement, car une erreur de configuration détectée peut déjà avoir été exploitée. Les équipes doivent toujours pouvoir déployer les politiques intercomptes approuvées par l'équipe de sécurité. L'équipe de sécurité a aussi besoin d'un inventaire à l'échelle de l'organisation des ressources déjà partagées en dehors de l'organisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM Access Analyzer external access analyzer with the organization as the zone of trust in a delegated administrator account, and invoke an AWS Lambda function from Amazon EventBridge that deletes the policy behind each new finding.", fr: "Créer un analyseur d'accès externe IAM Access Analyzer avec l'organisation comme zone de confiance dans un compte administrateur délégué, et appeler depuis Amazon EventBridge une fonction AWS Lambda qui supprime la politique à l'origine de chaque nouveau résultat." }
    - id: b
      text: { en: "Add an AWS CodeBuild stage that runs IAM Access Analyzer CheckNoPublicAccess and CheckNoNewAccess against the approved reference policies and fails on any finding, and create an organization external access analyzer in a delegated administrator account.", fr: "Ajouter une étape AWS CodeBuild qui exécute les vérifications IAM Access Analyzer CheckNoPublicAccess et CheckNoNewAccess par rapport aux politiques de référence approuvées et échoue au moindre résultat, et créer un analyseur d'accès externe d'organisation dans un compte administrateur délégué." }
    - id: c
      text: { en: "Attach an SCP to the root that denies s3:PutBucketPolicy, kms:PutKeyPolicy and sqs:SetQueueAttributes to every principal except a security team role, and have that team apply all resource policies on request.", fr: "Attacher à la racine une SCP qui refuse s3:PutBucketPolicy, kms:PutKeyPolicy et sqs:SetQueueAttributes à tous les principaux sauf un rôle de l'équipe de sécurité, et faire appliquer toutes les politiques de ressource par cette équipe sur demande." }
    - id: d
      text: { en: "Deploy an AWS Config conformance pack with rules that detect public buckets, keys and queues in every account, and configure the pipelines to stop when Security Hub CSPM reports a new failed control.", fr: "Déployer un pack de conformité AWS Config avec des règles qui détectent les compartiments, clés et files d'attente publics dans chaque compte, et configurer les pipelines pour s'arrêter lorsque Security Hub CSPM signale un nouveau contrôle en échec." }
answer: { optionId: b }
explanation:
  correct:
    en: "IAM Access Analyzer custom policy checks use automated reasoning on the policy itself: CheckNoPublicAccess fails if a resource policy can grant public access, and CheckNoNewAccess fails if an updated policy grants more than an approved reference policy, so a pipeline stage blocks risky templates before deployment while approved policies pass. An external access analyzer with the organization as the zone of trust lists the existing resources shared outside the organization."
    fr: "Les vérifications de politiques personnalisées d'IAM Access Analyzer appliquent un raisonnement automatisé à la politique elle-même : CheckNoPublicAccess échoue si une politique de ressource peut accorder un accès public, et CheckNoNewAccess échoue si une politique mise à jour accorde plus qu'une politique de référence approuvée. Une étape de pipeline bloque ainsi les modèles risqués avant le déploiement tout en laissant passer les politiques approuvées. Un analyseur d'accès externe avec l'organisation comme zone de confiance liste les ressources existantes partagées hors de l'organisation."
  options:
    a:
      en: "The analyzer reports access after the policy is deployed, so the resource is exposed until the finding is processed, and deleting policies automatically can break approved access."
      fr: "L'analyseur signale l'accès après le déploiement de la politique : la ressource est exposée jusqu'au traitement du résultat, et supprimer des politiques automatiquement peut casser des accès approuvés."
    c:
      en: "Denying every resource policy change to the teams stops their pipelines from deploying the approved cross-account policies, and it provides no inventory of existing external sharing."
      fr: "Refuser aux équipes toute modification de politique de ressource empêche leurs pipelines de déployer les politiques intercomptes approuvées, et ne fournit aucun inventaire des partages externes existants."
    d:
      en: "Config rules and Security Hub CSPM controls evaluate resources after they are deployed, so they detect rather than prevent, and they do not compare a policy with an approved reference policy."
      fr: "Les règles Config et les contrôles Security Hub CSPM évaluent les ressources après leur déploiement : ils détectent au lieu d'empêcher, et ne comparent pas une politique à une politique de référence approuvée."
references:
  - title: Checks for validating policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-checks-validating-policies.html
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
