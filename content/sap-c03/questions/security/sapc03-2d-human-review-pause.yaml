id: sapc03-2d-human-review-pause
objective: "2.5.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company uses an Amazon Bedrock model to generate product descriptions for an online catalog of 50,000 items. Before any description is published, a member of the legal team must approve or reject it in an internal review tool, and reviews can take up to 7 days. The orchestration must pause each item while it waits, with no compute running or billed during the wait, and must resume as soon as the reviewer records a decision. The engineering team builds on serverless services and is open to either a visual workflow service or a code-first approach.

    Which solutions will meet these requirements? (Choose two.)

    Each correct answer presents a complete solution.
  fr: |
    Une entreprise de médias utilise un modèle Amazon Bedrock pour générer les descriptions produit d'un catalogue en ligne de 50 000 articles. Avant la publication d'une description, un membre de l'équipe juridique doit l'approuver ou la rejeter dans un outil de revue interne, et les revues peuvent prendre jusqu'à 7 jours. L'orchestration doit mettre chaque article en pause pendant l'attente, sans calcul exécuté ni facturé pendant celle-ci, et doit reprendre dès que le réviseur enregistre une décision. L'équipe d'ingénierie construit sur des services sans serveur et accepte aussi bien un service de flux de travail visuel qu'une approche orientée code.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)

    Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An AWS Lambda function per item that polls the review tool's Amazon DynamoDB table every minute and continues when the decision appears", fr: "Une fonction AWS Lambda par article qui interroge chaque minute la table Amazon DynamoDB de l'outil de revue et continue lorsque la décision apparaît" } }
    - { id: b, text: { en: "An AWS Step Functions Express workflow per item with a .waitForTaskToken task that passes the task token to the review tool, which returns it with SendTaskSuccess or SendTaskFailure", fr: "Un flux de travail AWS Step Functions Express par article avec une tâche .waitForTaskToken qui transmet le jeton de tâche à l'outil de revue, lequel le renvoie avec SendTaskSuccess ou SendTaskFailure" } }
    - { id: c, text: { en: "An Amazon EventBridge Scheduler one-time schedule per item, set 7 days after submission, that starts a function to read the decision and publish or discard the description", fr: "Une planification ponctuelle Amazon EventBridge Scheduler par article, fixée 7 jours après la soumission, qui démarre une fonction lisant la décision et publiant ou écartant la description" } }
    - { id: d, text: { en: "An AWS Step Functions Standard workflow per item with a .waitForTaskToken task that passes the task token to the review tool, which returns it with SendTaskSuccess or SendTaskFailure", fr: "Un flux de travail AWS Step Functions Standard par article avec une tâche .waitForTaskToken qui transmet le jeton de tâche à l'outil de revue, lequel le renvoie avec SendTaskSuccess ou SendTaskFailure" } }
    - { id: e, text: { en: "A Lambda durable function per item that uses a callback operation to suspend execution until the review tool sends the decision through the Lambda API", fr: "Une fonction durable Lambda par article qui utilise une opération de rappel pour suspendre l'exécution jusqu'à ce que l'outil de revue envoie la décision par l'API Lambda" } }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: "A Standard workflow task with .waitForTaskToken pauses until the token is returned, for up to one year, and no compute runs while it waits. Lambda durable functions are the code-first alternative: executions can run for up to one year, a callback suspends execution until an external system provides input through the Lambda API, and suspended functions incur no compute charges."
    fr: "Une tâche de flux Standard avec .waitForTaskToken se met en pause jusqu'au renvoi du jeton, pendant un an au maximum, et aucun calcul ne s'exécute pendant l'attente. Les fonctions durables Lambda sont l'alternative orientée code : les exécutions peuvent durer jusqu'à un an, un rappel suspend l'exécution jusqu'à ce qu'un système externe fournisse une entrée par l'API Lambda, et les fonctions suspendues n'entraînent aucun coût de calcul."
  options:
    a:
      en: "Polling keeps a function invoking and billing compute during the wait, which the requirement forbids."
      fr: "L'interrogation périodique fait appeler et facturer du calcul pendant l'attente, ce que l'exigence interdit."
    b:
      en: "Express workflows support neither the .waitForTaskToken pattern nor executions longer than 5 minutes, so they cannot wait 7 days."
      fr: "Les flux Express ne prennent en charge ni le modèle .waitForTaskToken ni des exécutions de plus de 5 minutes : ils ne peuvent pas attendre 7 jours."
    c:
      en: "A schedule fixed at 7 days does not resume when the reviewer decides, so every approved description waits the full 7 days."
      fr: "Une planification fixée à 7 jours ne reprend pas lorsque le réviseur décide : chaque description approuvée attend les 7 jours complets."
references:
  - title: Lambda durable functions
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html
  - title: Durable execution SDK
    url: https://docs.aws.amazon.com/lambda/latest/dg/durable-execution-sdk.html
