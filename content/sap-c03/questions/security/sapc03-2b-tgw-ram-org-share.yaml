id: sapc03-2b-tgw-ram-org-share
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany's network account owns a transit gateway in eu-west-1 that connects to the data center through AWS Direct Connect. Thirty workload accounts in AWS Organizations, and accounts that will be created later, must attach their VPCs to this transit gateway. The network team wants to avoid sending and accepting resource share invitations for each account. The team does not want to deploy additional transit gateways.

    Which solution will meet these requirements?
  fr: |
    Le compte réseau d'AnyCompany possède dans eu-west-1 une passerelle de transit reliée au centre de données via AWS Direct Connect. Trente comptes de charge de travail d'AWS Organizations, ainsi que les comptes qui seront créés plus tard, doivent attacher leurs VPC à cette passerelle de transit. L'équipe réseau veut éviter d'envoyer et d'accepter des invitations de partage de ressources pour chaque compte. L'équipe ne veut pas déployer de passerelles de transit supplémentaires.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create VPC peering connections between the network account's VPC and each workload VPC, and route on-premises traffic through the network VPC.", fr: "Créer des connexions d'appairage (peering) VPC entre le VPC du compte réseau et chaque VPC de charge de travail, et router le trafic sur site via le VPC réseau." } }
    - { id: b, text: { en: "Enable resource sharing with AWS Organizations in AWS RAM, and share the transit gateway with the organization in a resource share.", fr: "Activer le partage de ressources avec AWS Organizations dans AWS RAM, et partager la passerelle de transit avec l'organisation dans un partage de ressources." } }
    - { id: c, text: { en: "Share the transit gateway route tables with each workload account in AWS RAM so that the accounts can create their own attachments and routes.", fr: "Partager les tables de routage de la passerelle de transit avec chaque compte de charge de travail dans AWS RAM afin que les comptes créent leurs propres attachements et routes." } }
    - { id: d, text: { en: "Create a transit gateway in each workload account, and peer each one with the transit gateway in the network account.", fr: "Créer une passerelle de transit dans chaque compte de charge de travail, et appairer chacune avec la passerelle de transit du compte réseau." } }
answer: { optionId: b }
explanation:
  correct:
    en: "After a transit gateway is shared through AWS RAM, the other accounts can attach their VPCs to it. When resource sharing with AWS Organizations is enabled from the management account, principals in the organization get access without invitations, and sharing with the organization covers accounts created later."
    fr: "Une fois la passerelle de transit partagée via AWS RAM, les autres comptes peuvent y attacher leurs VPC. Lorsque le partage de ressources avec AWS Organizations est activé depuis le compte de gestion, les principaux de l'organisation obtiennent l'accès sans invitation, et le partage avec l'organisation couvre les comptes créés plus tard."
  options:
    a:
      en: "VPC peering is not transitive, so workload VPCs cannot reach the data center through the network VPC, and the mesh grows with every account."
      fr: "L'appairage VPC n'est pas transitif : les VPC de charge de travail ne peuvent pas joindre le centre de données via le VPC réseau, et le maillage grandit à chaque compte."
    c:
      en: "The resource to share is the transit gateway itself; its route tables remain managed by the owner account."
      fr: "La ressource à partager est la passerelle de transit elle-même ; ses tables de routage restent gérées par le compte propriétaire."
    d:
      en: "This deploys a transit gateway in every account, which the network team wants to avoid and which adds cost and routing work."
      fr: "Cette option déploie une passerelle de transit dans chaque compte, ce que l'équipe réseau veut éviter et qui ajoute des coûts et du travail de routage."
references:
  - title: Sharing your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html
