id: sapc03-2c-bedrock-eu-profile
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A French bank is deploying a generative AI assistant for its advisors on Amazon Bedrock in eu-west-3. A regulation requires that prompts and responses be processed only in AWS Regions located in the EU. Load tests show that peak traffic exceeds the on-demand quotas of a single Region, so the bank wants to use cross-Region inference with on-demand capacity. The OU that contains the workload account has an SCP that denies all actions when aws:RequestedRegion is not eu-west-3 or eu-central-1. The bank wants to keep the SCP as restrictive as possible.

    Which solution will meet these requirements?
  fr: |
    Une banque française déploie un assistant d'IA générative pour ses conseillers sur Amazon Bedrock dans eu-west-3. Une réglementation exige que les invites et les réponses ne soient traitées que dans des Régions AWS situées dans l'UE. Les tests de charge montrent que le trafic de pointe dépasse les quotas à la demande d'une seule Région : la banque veut donc utiliser l'inférence entre Régions avec une capacité à la demande. L'OU qui contient le compte de la charge de travail possède une SCP qui refuse toutes les actions lorsque aws:RequestedRegion n'est ni eu-west-3 ni eu-central-1. La banque veut conserver une SCP aussi restrictive que possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a global cross-Region inference profile for the model, and add the unspecified value to the list of allowed Regions in the SCP condition."
        fr: "Utiliser un profil d'inférence entre Régions global pour le modèle, et ajouter la valeur unspecified à la liste des Régions autorisées dans la condition de la SCP."
    - id: b
      text:
        en: "Purchase Provisioned Throughput for the model in eu-west-3, and invoke it through the EU geographic inference profile so that traffic can also use other EU Regions."
        fr: "Acheter du débit provisionné (Provisioned Throughput) pour le modèle dans eu-west-3, et l'appeler par le profil d'inférence géographique EU afin que le trafic puisse aussi utiliser d'autres Régions de l'UE."
    - id: c
      text:
        en: "Use the EU geographic cross-Region inference profile for the model, and update the SCP so that Bedrock invocations are allowed in every destination Region of that profile."
        fr: "Utiliser le profil d'inférence entre Régions géographique EU pour le modèle, et mettre à jour la SCP afin que les appels Bedrock soient autorisés dans chaque Région de destination de ce profil."
    - id: d
      text:
        en: "Use the EU geographic cross-Region inference profile for the model without changing the SCP, because AWS performs the routing to the other Regions outside the scope of SCPs."
        fr: "Utiliser le profil d'inférence entre Régions géographique EU pour le modèle sans modifier la SCP, car AWS effectue le routage vers les autres Régions en dehors de la portée des SCP."
answer: { optionId: c }
explanation:
  correct:
    en: "A geographic inference profile routes requests only to Regions inside its geography, such as the EU, which meets the processing requirement while adding capacity beyond one Region. A Region-restricting SCP must allow every destination Region of the profile, otherwise requests routed there are denied."
    fr: "Un profil d'inférence géographique n'achemine les requêtes que vers des Régions de sa zone géographique, comme l'UE, ce qui répond à l'exigence de traitement tout en ajoutant de la capacité au-delà d'une Région. Une SCP qui restreint les Régions doit autoriser chaque Région de destination du profil, sinon les requêtes acheminées vers ces Régions sont refusées."
  options:
    a:
      en: "A global inference profile can process requests in any supported commercial Region worldwide, which violates the EU processing requirement."
      fr: "Un profil d'inférence global peut traiter les requêtes dans n'importe quelle Région commerciale prise en charge dans le monde, ce qui viole l'exigence de traitement dans l'UE."
    b:
      en: "Provisioned Throughput is not supported with inference profiles, and the bank wants on-demand capacity."
      fr: "Le débit provisionné n'est pas pris en charge avec les profils d'inférence, et la banque veut une capacité à la demande."
    d:
      en: "A Region-restricting SCP can block cross-Region inference when it does not allow the destination Regions of the profile, so the SCP must be updated."
      fr: "Une SCP qui restreint les Régions peut bloquer l'inférence entre Régions lorsqu'elle n'autorise pas les Régions de destination du profil : la SCP doit donc être mise à jour."
references:
  - title: Route model inference requests across AWS Regions with cross-Region inference
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/cross-region-inference.html
