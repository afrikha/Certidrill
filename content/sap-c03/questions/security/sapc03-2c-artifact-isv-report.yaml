id: sapc03-2c-artifact-isv-report
objective: "2.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company is preparing its annual vendor risk assessment. The assessment must include the current SOC 2 report of AWS and the SOC 2 report of an independent software vendor whose SaaS product the company subscribes to through AWS Marketplace. The compliance team wants to obtain both documents itself, on demand, without opening support cases or contacting the vendor's sales team. The company wants the solution with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique prépare son évaluation annuelle des risques fournisseurs. L'évaluation doit inclure le rapport SOC 2 actuel d'AWS et le rapport SOC 2 d'un éditeur de logiciels indépendant dont l'entreprise utilise le produit SaaS par un abonnement AWS Marketplace. L'équipe de conformité veut obtenir elle-même les deux documents, à la demande, sans ouvrir de dossier de support ni contacter l'équipe commerciale de l'éditeur. L'entreprise veut la solution qui demande le MOINS d'efforts.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Open an AWS Support case to request the AWS SOC 2 report, and ask the AWS Marketplace seller for its report through the Marketplace contact form."
        fr: "Ouvrir un dossier AWS Support pour demander le rapport SOC 2 d'AWS, et demander son rapport au vendeur AWS Marketplace par le formulaire de contact de Marketplace."
    - id: b
      text:
        en: "Download the AWS SOC 2 report from AWS Artifact reports, and download the vendor's report from the AWS Artifact third-party reports."
        fr: "Télécharger le rapport SOC 2 d'AWS dans les rapports AWS Artifact, et télécharger le rapport de l'éditeur dans les rapports tiers d'AWS Artifact."
    - id: c
      text:
        en: "Create an AWS Audit Manager assessment from the SOC 2 framework that collects the reports of AWS and of the vendor as evidence."
        fr: "Créer une évaluation AWS Audit Manager à partir du framework SOC 2 qui collecte les rapports d'AWS et de l'éditeur comme preuves."
    - id: d
      text:
        en: "Enable the AWS Security Hub CSPM standards in the company's accounts, and export the security scores as the SOC 2 evidence of AWS and of the vendor."
        fr: "Activer les normes AWS Security Hub CSPM dans les comptes de l'entreprise, et exporter les scores de sécurité comme preuve SOC 2 d'AWS et de l'éditeur."
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Artifact provides on-demand, free downloads of AWS security and compliance documents such as SOC reports. It also provides security and compliance documents of independent software vendors that sell on AWS Marketplace, so the team can download both reports itself."
    fr: "AWS Artifact permet de télécharger gratuitement et à la demande les documents de sécurité et de conformité d'AWS, comme les rapports SOC. Il fournit aussi les documents de sécurité et de conformité des éditeurs de logiciels indépendants qui vendent sur AWS Marketplace : l'équipe peut donc télécharger elle-même les deux rapports."
  options:
    a:
      en: "Support cases and seller contacts are manual requests that the team wants to avoid, while both reports are available for download in AWS Artifact."
      fr: "Les dossiers de support et les contacts vendeurs sont des demandes manuelles que l'équipe veut éviter, alors que les deux rapports sont téléchargeables dans AWS Artifact."
    c:
      en: "AWS Audit Manager is no longer open to new customers, and it collects evidence about the company's own resources, not the audit reports of AWS or vendors."
      fr: "AWS Audit Manager n'est plus ouvert aux nouveaux clients, et il collecte des preuves sur les ressources de l'entreprise, pas les rapports d'audit d'AWS ou des éditeurs."
    d:
      en: "Security scores measure the company's own configuration against standards; they are not SOC 2 reports of AWS or of the vendor."
      fr: "Les scores de sécurité mesurent la configuration de l'entreprise par rapport à des normes ; ce ne sont pas des rapports SOC 2 d'AWS ou de l'éditeur."
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
  - title: What is AWS Audit Manager?
    url: https://docs.aws.amazon.com/audit-manager/latest/userguide/what-is.html
