id: sapc03-2a-scim-token-expired
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses Okta as the external identity provider of AWS IAM Identity Center, with SAML 2.0 for sign-in and SCIM for automatic provisioning. For two days, new employees created in Okta have not appeared in IAM Identity Center, and group membership changes are not reflected. Existing users can still sign in to the AWS access portal. An investigation shows that the SCIM access token was generated exactly one year ago. The company wants to restore provisioning and avoid the same outage in the future with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise Okta comme fournisseur d'identité externe d'AWS IAM Identity Center, avec SAML 2.0 pour la connexion et SCIM pour le provisionnement automatique. Depuis deux jours, les nouveaux employés créés dans Okta n'apparaissent pas dans IAM Identity Center, et les changements d'appartenance aux groupes ne sont pas répercutés. Les utilisateurs existants peuvent toujours se connecter au portail d'accès AWS. Une enquête montre que le jeton d'accès SCIM a été généré il y a exactement un an. L'entreprise veut rétablir le provisionnement et éviter la même panne à l'avenir avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Generate a new SCIM access token in IAM Identity Center, enter it in Okta's provisioning settings, delete the expired token, and act on the expiry reminders from AWS."
        fr: "Générer un nouveau jeton d'accès SCIM dans IAM Identity Center, le saisir dans les paramètres de provisionnement d'Okta, supprimer le jeton expiré, et donner suite aux rappels d'expiration d'AWS."
    - id: b
      text:
        en: "Download new SAML metadata from IAM Identity Center, upload it to the Okta application, and replace the SAML signing certificate before it expires each year."
        fr: "Télécharger de nouvelles métadonnées SAML depuis IAM Identity Center, les charger dans l'application Okta, et remplacer chaque année le certificat de signature SAML avant son expiration."
    - id: c
      text:
        en: "Change the identity source to the Identity Center directory, recreate the users and groups manually in IAM Identity Center, and keep Okta only as a password store."
        fr: "Remplacer la source d'identité par l'annuaire Identity Center, recréer manuellement les utilisateurs et les groupes dans IAM Identity Center, et conserver Okta uniquement comme magasin de mots de passe."
    - id: d
      text:
        en: "Replace SCIM with a scheduled AWS Lambda function that reads users and groups from the Okta API every hour and writes them with the Identity Store API."
        fr: "Remplacer SCIM par une fonction AWS Lambda planifiée qui lit chaque heure les utilisateurs et les groupes depuis l'API Okta et les écrit avec l'API Identity Store."
answer: { optionId: a }
explanation:
  correct:
    en: "SCIM access tokens are generated with a validity of one year, and when the token expires, synchronization from the identity provider stops while SAML sign-in keeps working. Rotating the token restores provisioning, and AWS sends reminders in the IAM Identity Center console and the AWS Health Dashboard when a token expires in 90 days or less."
    fr: "Les jetons d'accès SCIM sont générés avec une validité d'un an ; à l'expiration du jeton, la synchronisation depuis le fournisseur d'identité s'arrête alors que la connexion SAML continue de fonctionner. La rotation du jeton rétablit le provisionnement, et AWS envoie des rappels dans la console IAM Identity Center et dans AWS Health Dashboard lorsqu'un jeton expire dans 90 jours ou moins."
  options:
    b:
      en: "Sign-in still works, so the SAML trust is healthy; the symptoms match a stopped SCIM synchronization, not a SAML certificate problem."
      fr: "La connexion fonctionne toujours, donc l'approbation SAML est saine ; les symptômes correspondent à un arrêt de la synchronisation SCIM, pas à un problème de certificat SAML."
    c:
      en: "Moving to the Identity Center directory replaces automatic provisioning with manual user management, which is far more overhead."
      fr: "Passer à l'annuaire Identity Center remplace le provisionnement automatique par une gestion manuelle des utilisateurs, ce qui représente bien plus de charge."
    d:
      en: "A custom synchronization function rebuilds what SCIM already provides and adds code, credentials and delays to maintain."
      fr: "Une fonction de synchronisation personnalisée reconstruit ce que SCIM fournit déjà et ajoute du code, des informations d'identification et des délais à maintenir."
references:
  - title: Provision users and groups from an external identity provider using SCIM
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
