id: sapc03-2b-org-trail-data-events-buckets
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's management account created an organization trail that records the management events of 90 member accounts in a central S3 bucket. Auditors now require object-level read and write events for 14 S3 buckets, located in different member accounts, that hold payment files. Member account administrators must not be able to turn off or change this logging. The company wants to minimize CloudTrail charges.

    Which solution will meet these requirements?
  fr: |
    Le compte de gestion d'AnyCompany a créé un journal de suivi d'organisation qui enregistre les événements de gestion de 90 comptes membres dans un compartiment S3 central. Les auditeurs exigent désormais les événements de lecture et d'écriture au niveau des objets pour 14 compartiments S3, situés dans différents comptes membres, qui contiennent des fichiers de paiement. Les administrateurs des comptes membres ne doivent pas pouvoir désactiver ni modifier cette journalisation. L'entreprise veut réduire au minimum les frais CloudTrail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a trail in each member account that owns one of the buckets, configure S3 data events for that bucket, and deliver the logs to the central bucket.", fr: "Créer un journal de suivi dans chaque compte membre qui possède l'un des compartiments, y configurer les événements de données S3 de ce compartiment, et livrer les journaux au compartiment central." } }
    - { id: b, text: { en: "Enable S3 server access logging on the 14 buckets, and deliver the access logs to a bucket in the log archive account.", fr: "Activer la journalisation des accès au serveur S3 sur les 14 compartiments, et livrer les journaux d'accès à un compartiment du compte d'archive des journaux." } }
    - { id: c, text: { en: "Add a data event selector to the organization trail that logs S3 data events for all buckets in all accounts of the organization.", fr: "Ajouter au journal de suivi d'organisation un sélecteur d'événements de données qui journalise les événements de données S3 de tous les compartiments de tous les comptes de l'organisation." } }
    - { id: d, text: { en: "Add advanced event selectors to the organization trail that log S3 data events only for the ARNs of the 14 buckets in the member accounts.", fr: "Ajouter au journal de suivi d'organisation des sélecteurs d'événements avancés qui journalisent les événements de données S3 uniquement pour les ARN des 14 compartiments des comptes membres." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An organization trail can log data events for specified resources in member accounts without any cross-account configuration; you add the ARNs of those resources to the trail. Only the management account or the delegated administrator can change the trail, and limiting the selectors to 14 buckets keeps data event charges low."
    fr: "Un journal de suivi d'organisation peut journaliser les événements de données de ressources désignées des comptes membres sans configuration intercompte : on ajoute les ARN de ces ressources au journal de suivi. Seuls le compte de gestion ou l'administrateur délégué peuvent modifier le journal de suivi, et limiter les sélecteurs à 14 compartiments réduit les frais d'événements de données."
  options:
    a:
      en: "Trails in member accounts can be stopped or changed by the administrators of those accounts."
      fr: "Les journaux de suivi des comptes membres peuvent être arrêtés ou modifiés par les administrateurs de ces comptes."
    b:
      en: "Bucket owners in the member accounts can disable server access logging, so the logging is not protected."
      fr: "Les propriétaires des compartiments dans les comptes membres peuvent désactiver la journalisation des accès au serveur : la journalisation n'est pas protégée."
    c:
      en: "Logging data events for every bucket in the organization greatly increases CloudTrail charges compared with the 14 buckets that the auditors need."
      fr: "Journaliser les événements de données de tous les compartiments de l'organisation augmente fortement les frais CloudTrail par rapport aux 14 compartiments demandés par les auditeurs."
references:
  - title: Creating a trail for an organization
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
