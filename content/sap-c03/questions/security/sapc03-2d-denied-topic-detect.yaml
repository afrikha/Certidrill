id: sapc03-2d-denied-topic-detect
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A life insurer has run a policyholder assistant on Amazon Bedrock for six months with a guardrail that contains content filters only. Its regulator now requires that the assistant must never give personalized investment advice. The product owner fears that a new denied topic might also block legitimate questions about policy surrender values and wants evidence before enforcing it. For two weeks, the team wants to measure how often the topic would match real production prompts and responses, without changing any answer that policyholders receive. After the review, enforcement must take effect without redeploying the application, which references the guardrail by its ID and a numeric version stored in AWS Systems Manager Parameter Store.

    Which solution will meet these requirements?
  fr: |
    Un assureur vie exploite depuis six mois sur Amazon Bedrock un assistant pour les assurés, avec un guardrail qui ne contient que des filtres de contenu. Son régulateur exige désormais que l'assistant ne donne jamais de conseil en investissement personnalisé. Le responsable produit craint qu'un nouveau sujet refusé bloque aussi des questions légitimes sur les valeurs de rachat des contrats et veut des preuves avant de l'appliquer. Pendant deux semaines, l'équipe veut mesurer la fréquence à laquelle le sujet correspondrait aux invites et réponses réelles de production, sans modifier aucune réponse reçue par les assurés. Après la revue, l'application du blocage doit prendre effet sans redéployer l'application, qui référence le guardrail par son ID et une version numérotée stockée dans AWS Systems Manager Parameter Store.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the denied topic with the BLOCK action to the guardrail's working draft, point the production parameter to DRAFT for two weeks, and count the blocked responses in the guardrail metrics.", fr: "Ajouter le sujet refusé avec l'action BLOCK dans le brouillon de travail du guardrail, faire pointer le paramètre de production vers DRAFT pendant deux semaines, et compter les réponses bloquées dans les métriques du guardrail." }
    - id: b
      text: { en: "Add the denied topic with the NONE action for input and output, create a new version, point the parameter to it, review the detections in the guardrail assessments, then create a version with BLOCK and update the parameter.", fr: "Ajouter le sujet refusé avec l'action NONE en entrée et en sortie, créer une nouvelle version, y faire pointer le paramètre, examiner les détections dans les évaluations du guardrail, puis créer une version avec BLOCK et mettre à jour le paramètre." }
    - id: c
      text: { en: "Replay two weeks of prompts from the model invocation logs through the ApplyGuardrail API with a test guardrail that blocks the topic, then add the topic to production after the review.", fr: "Rejouer deux semaines d'invites des journaux d'appels de modèle par l'API ApplyGuardrail avec un guardrail de test qui bloque le sujet, puis ajouter le sujet en production après la revue." }
    - id: d
      text: { en: "Create a second guardrail with the denied topic set to BLOCK, send 10 % of production traffic to it for two weeks, and compare the complaint rate of the two groups of policyholders.", fr: "Créer un second guardrail avec le sujet refusé réglé à BLOCK, lui envoyer 10 % du trafic de production pendant deux semaines, et comparer le taux de réclamations des deux groupes d'assurés." }
answer: { optionId: b }
explanation:
  correct:
    en: "Denied topics accept BLOCK or NONE per direction; NONE is detect mode, which takes no action but still returns detection information in the guardrail assessments. Because numeric versions are immutable snapshots, the team publishes a detect-only version, then a blocking version, and switches the parameter, with no application redeployment."
    fr: "Les sujets refusés acceptent BLOCK ou NONE par sens ; NONE est le mode détection, qui n'agit pas mais renvoie quand même les informations de détection dans les évaluations du guardrail. Comme les versions numérotées sont des instantanés immuables, l'équipe publie une version en détection seule, puis une version bloquante, et change le paramètre, sans redéployer l'application."
  options:
    a:
      en: "With BLOCK, the draft would replace matching answers with the blocked message during the two weeks, which changes what policyholders receive, and running production on the mutable DRAFT is not controlled."
      fr: "Avec BLOCK, le brouillon remplacerait les réponses concernées par le message de blocage pendant les deux semaines, ce qui modifie ce que reçoivent les assurés, et exécuter la production sur le DRAFT modifiable n'est pas maîtrisé."
    c:
      en: "Replaying past prompts does not measure real responses over the next two weeks, and the logs hold prompts and responses that would have to be extracted and replayed by custom code."
      fr: "Rejouer des invites passées ne mesure pas les réponses réelles des deux semaines suivantes, et les journaux contiennent des invites et réponses qu'il faudrait extraire et rejouer avec du code personnalisé."
    d:
      en: "A blocking guardrail on 10 % of traffic changes the answers of those policyholders, and complaint rates do not show how often the topic matched."
      fr: "Un guardrail bloquant sur 10 % du trafic modifie les réponses de ces assurés, et les taux de réclamations ne montrent pas la fréquence de correspondance du sujet."
references:
  - title: Block denied topics to help remove harmful content
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-denied-topics.html
