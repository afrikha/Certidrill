id: sapc03-2b-bedrock-logging-central
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 25 workload accounts that call Amazon Bedrock models through the Converse API in eu-west-1 and eu-central-1. Compliance requires that the full prompts and responses of every model invocation be kept for one year in a central security account that workload teams cannot modify. Some request and response bodies are larger than 100 KB. Data must stay in the Region where it was produced. The security team wants the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    AnyCompany dispose de 25 comptes de charge de travail qui appellent des modèles Amazon Bedrock via l'API Converse dans eu-west-1 et eu-central-1. La conformité exige que les invites (prompts) et les réponses complètes de chaque invocation de modèle soient conservées un an dans un compte de sécurité central que les équipes de charge de travail ne peuvent pas modifier. Certains corps de requête et de réponse dépassent 100 Ko. Les données doivent rester dans la Région où elles ont été produites. L'équipe de sécurité veut le MOINS de code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable model invocation logging in each workload account and Region with the central account's log group and S3 bucket in that Region as destinations, and allow Amazon Bedrock to write to them.", fr: "Activer la journalisation des invocations de modèle dans chaque compte et chaque Région avec comme destinations le groupe de journaux et le compartiment S3 du compte central dans cette Région, et autoriser Amazon Bedrock à y écrire." } }
    - { id: b, text: { en: "Enable model invocation logging in each account and Region to a local log group and local S3 bucket, copy the log groups with CloudWatch Logs centralization rules, and replicate the buckets with S3 Replication.", fr: "Activer la journalisation des invocations de modèle dans chaque compte et chaque Région vers un groupe de journaux et un compartiment S3 locaux, copier les groupes avec des règles de centralisation CloudWatch Logs, et répliquer les compartiments avec S3 Replication." } }
    - { id: c, text: { en: "Create an organization trail with data events for Amazon Bedrock, and deliver it to the central account, because CloudTrail records the request and response bodies of Converse calls.", fr: "Créer un journal de suivi d'organisation avec des événements de données pour Amazon Bedrock et le livrer au compte central, car CloudTrail enregistre les corps de requête et de réponse des appels Converse." } }
    - { id: d, text: { en: "Attach an Amazon Bedrock guardrail to every invocation, and stream the guardrail trace from each application to the central account through Amazon Data Firehose.", fr: "Associer une barrière de protection (guardrail) Amazon Bedrock à chaque invocation, et transmettre la trace du guardrail de chaque application au compte central via Amazon Data Firehose." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Model invocation logging captures the full request data, response data, and metadata, but it supports only destinations in the same account and Region, and bodies larger than 100 KB go to S3. Centralization rules then copy the log groups to the central account in the same Region, and same-Region S3 Replication copies the large-data objects, with no custom code."
    fr: "La journalisation des invocations de modèle capture les données complètes de requête, de réponse et les métadonnées, mais elle n'accepte que des destinations du même compte et de la même Région, et les corps de plus de 100 Ko vont dans S3. Les règles de centralisation copient ensuite les groupes de journaux vers le compte central dans la même Région, et la réplication S3 dans la même Région copie les objets volumineux, sans code personnalisé."
  options:
    a:
      en: "Invocation logging accepts only destinations in the same account and Region as the logging configuration, so the central account cannot be the direct destination."
      fr: "La journalisation des invocations n'accepte que des destinations du même compte et de la même Région que la configuration : le compte central ne peut pas être la destination directe."
    c:
      en: "CloudTrail records who called which API and when, but not the full prompts and responses; those are captured by model invocation logging."
      fr: "CloudTrail enregistre qui a appelé quelle API et quand, mais pas les invites et réponses complètes ; celles-ci sont capturées par la journalisation des invocations de modèle."
    d:
      en: "Guardrail traces describe guardrail assessments, not complete invocation logs, and streaming them from every application requires custom code."
      fr: "Les traces de guardrail décrivent les évaluations du guardrail, pas des journaux d'invocation complets, et les transmettre depuis chaque application exige du code personnalisé."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
