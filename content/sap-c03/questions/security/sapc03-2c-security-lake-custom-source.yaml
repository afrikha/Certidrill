id: sapc03-2c-security-lake-custom-source
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A regulated fintech company runs workloads in 25 accounts in AWS Organizations across two AWS Regions. Its audit trail must combine AWS CloudTrail management events, Amazon VPC Flow Logs, and Amazon Route 53 Resolver query logs with the audit logs of an on-premises identity provider and of a SaaS ticketing system. The on-premises identity provider and the SaaS vendor can already export their events in the Open Cybersecurity Schema Framework (OCSF) format. All data must use one normalized schema, stay in S3 buckets that the company owns, and be queryable with Amazon Athena by an investigations team in a separate account. The company wants to avoid building its own normalization pipelines.

    Which solution will meet these requirements?
  fr: |
    Une entreprise fintech réglementée exécute ses charges de travail dans 25 comptes d'AWS Organizations répartis sur deux Régions AWS. Sa piste d'audit doit combiner les événements de gestion AWS CloudTrail, les journaux de flux Amazon VPC et les journaux de requêtes Amazon Route 53 Resolver avec les journaux d'audit d'un fournisseur d'identité sur site et d'un système de tickets SaaS. Le fournisseur d'identité sur site et l'éditeur SaaS peuvent déjà exporter leurs événements au format Open Cybersecurity Schema Framework (OCSF). Toutes les données doivent utiliser un schéma normalisé unique, rester dans des compartiments S3 détenus par l'entreprise et pouvoir être interrogées avec Amazon Athena par une équipe d'enquête dans un compte distinct. L'entreprise veut éviter de construire ses propres pipelines de normalisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a CloudTrail Lake organization event data store, add integrations for the identity provider and the SaaS system, and share query access with the investigations account."
        fr: "Créer un magasin de données d'événements d'organisation CloudTrail Lake, ajouter des intégrations pour le fournisseur d'identité et le système SaaS, et partager l'accès en requête avec le compte d'enquête."
    - id: b
      text:
        en: "Enable Amazon Security Lake for the organization with the AWS sources, add the identity provider and SaaS system as custom sources, and create a query subscriber."
        fr: "Activer Amazon Security Lake pour l'organisation avec les sources AWS, ajouter le fournisseur d'identité et le système SaaS comme sources personnalisées, et créer un abonné en requête."
    - id: c
      text:
        en: "Deploy an Amazon OpenSearch Service domain, build ingestion pipelines that map every log source to a common index schema, and give the investigations team access to OpenSearch Dashboards."
        fr: "Déployer un domaine Amazon OpenSearch Service, construire des pipelines d'ingestion qui associent chaque source de journaux à un schéma d'index commun, et donner à l'équipe d'enquête l'accès à OpenSearch Dashboards."
    - id: d
      text:
        en: "Send every log source to CloudWatch Logs log groups in a central account, and give the investigations team permissions to query all of them with CloudWatch Logs Insights."
        fr: "Envoyer chaque source de journaux vers des groupes de journaux CloudWatch Logs d'un compte central, et donner à l'équipe d'enquête les autorisations de les interroger tous avec CloudWatch Logs Insights."
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon Security Lake collects CloudTrail management events, VPC Flow Logs and Route 53 Resolver query logs natively, converts them to Apache Parquet and normalizes them to OCSF, and stores them in S3 buckets in the customer's account. Custom sources add third-party and on-premises data in OCSF, and a subscriber with query access can use Athena on the Lake Formation tables from another account."
    fr: "Amazon Security Lake collecte nativement les événements de gestion CloudTrail, les journaux de flux VPC et les journaux de requêtes Route 53 Resolver, les convertit en Apache Parquet, les normalise au format OCSF et les stocke dans des compartiments S3 du compte du client. Les sources personnalisées ajoutent des données tierces et sur site au format OCSF, et un abonné avec accès en requête peut utiliser Athena sur les tables Lake Formation depuis un autre compte."
  options:
    a:
      en: "CloudTrail Lake has not been open to new customers since May 31, 2026, and it does not collect VPC Flow Logs or Resolver query logs as native sources."
      fr: "CloudTrail Lake n'est plus ouvert aux nouveaux clients depuis le 31 mai 2026, et il ne collecte ni les journaux de flux VPC ni les journaux de requêtes Resolver comme sources natives."
    c:
      en: "Mapping every source to a common schema means building and maintaining custom normalization pipelines, and the data is not queried with Athena."
      fr: "Associer chaque source à un schéma commun revient à construire et maintenir des pipelines de normalisation personnalisés, et les données ne sont pas interrogées avec Athena."
    d:
      en: "Log groups keep each source in its own format, so there is no normalized schema, and the data is not stored in S3 buckets for Athena."
      fr: "Les groupes de journaux conservent chaque source dans son propre format : il n'y a pas de schéma normalisé, et les données ne sont pas stockées dans des compartiments S3 pour Athena."
references:
  - title: What is Amazon Security Lake?
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html
