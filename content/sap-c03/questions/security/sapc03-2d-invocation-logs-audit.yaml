id: sapc03-2d-invocation-logs-audit
objective: "2.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A health insurer runs a member-facing assistant on Amazon Bedrock in a workload account in eu-central-1. A guardrail masks member names and policy numbers in the model responses. The regulator requires a complete record of every prompt and response, including uploaded images of claim forms, kept for 7 years in the company's central log archive account in a store that nobody can modify or delete. The operations team builds Amazon CloudWatch dashboards and Logs Insights queries in the workload account, and it must never be able to see member personal data. The security architect notes that the guardrail masking cannot be relied on for the logs.

    Which solution will meet these requirements?
  fr: |
    Un assureur santé exploite un assistant destiné aux adhérents sur Amazon Bedrock dans un compte de charge de travail en eu-central-1. Un guardrail masque les noms des adhérents et les numéros de contrat dans les réponses du modèle. Le régulateur exige un enregistrement complet de chaque invite et réponse, y compris les images de formulaires de sinistre chargées, conservé 7 ans dans le compte central d'archivage des journaux de l'entreprise, dans un stockage que personne ne peut modifier ni supprimer. L'équipe d'exploitation construit des tableaux de bord Amazon CloudWatch et des requêtes Logs Insights dans le compte de charge de travail, et elle ne doit jamais pouvoir voir les données personnelles des adhérents. L'architecte sécurité note qu'on ne peut pas compter sur le masquage du guardrail pour les journaux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable model invocation logging, including images, to an S3 bucket in the workload account only, and replicate it with S3 Replication to a bucket with S3 Object Lock in compliance mode in the log archive account.", fr: "Activer la journalisation des appels de modèle, images comprises, uniquement vers un compartiment S3 du compte de charge de travail, et le répliquer avec S3 Replication vers un compartiment avec S3 Object Lock en mode conformité dans le compte d'archivage." }
    - id: b
      text: { en: "Enable model invocation logging, including images, directly to an S3 bucket with S3 Object Lock in compliance mode in the log archive account, with a bucket policy that allows the Bedrock service principal to write.", fr: "Activer la journalisation des appels de modèle, images comprises, directement vers un compartiment S3 avec S3 Object Lock en mode conformité dans le compte d'archivage, avec une politique de compartiment qui autorise le principal de service Bedrock à écrire." }
    - id: c
      text: { en: "Enable model invocation logging to both CloudWatch Logs and Amazon S3, and give the operations team access to the log group because the guardrail anonymizes the personal data before it is logged.", fr: "Activer la journalisation des appels de modèle vers CloudWatch Logs et Amazon S3, et donner à l'équipe d'exploitation l'accès au groupe de journaux, puisque le guardrail anonymise les données personnelles avant leur journalisation." }
    - id: d
      text: { en: "Enable model invocation logging to CloudWatch Logs only with a 7-year retention period, and stream the log group to the log archive account with a cross-account subscription filter and Amazon Data Firehose.", fr: "Activer la journalisation des appels de modèle uniquement vers CloudWatch Logs avec une durée de conservation de 7 ans, et diffuser le groupe de journaux vers le compte d'archivage avec un filtre d'abonnement intercomptes et Amazon Data Firehose." }
answer: { optionId: a }
explanation:
  correct:
    en: "Model invocation logging records full requests and responses, and the masking of sensitive information filters does not apply to these logs, so personal data must be kept out of CloudWatch Logs. The S3 destination must be in the same account and Region as the logging configuration and is the only one that stores images and large bodies. Replication to an Object Lock bucket in compliance mode in the log archive account gives the immutable 7-year record."
    fr: "La journalisation des appels de modèle enregistre les requêtes et réponses complètes, et le masquage des filtres d'informations sensibles ne s'applique pas à ces journaux : les données personnelles doivent rester hors de CloudWatch Logs. La destination S3 doit se trouver dans le même compte et la même Région que la configuration de journalisation, et c'est la seule qui stocke les images et les corps volumineux. La réplication vers un compartiment Object Lock en mode conformité dans le compte d'archivage fournit l'enregistrement immuable de 7 ans."
  options:
    b:
      en: "An invocation logging destination must be in the same account and Region as the logging configuration, so Bedrock cannot write directly to a bucket in the log archive account."
      fr: "Une destination de journalisation des appels doit se trouver dans le même compte et la même Région que la configuration de journalisation : Bedrock ne peut pas écrire directement dans un compartiment du compte d'archivage."
    c:
      en: "Guardrail masking does not apply to model invocation logs, which keep the original input, so the operations team would see member personal data in the log group."
      fr: "Le masquage du guardrail ne s'applique pas aux journaux d'appels de modèle, qui conservent l'entrée d'origine : l'équipe d'exploitation verrait les données personnelles des adhérents dans le groupe de journaux."
    d:
      en: "Images and bodies over 100 KB are logged only to Amazon S3, so the record would be incomplete, and the personal data would sit in a log group in the operations team's account."
      fr: "Les images et les corps de plus de 100 Ko ne sont journalisés que dans Amazon S3 : l'enregistrement serait incomplet, et les données personnelles se trouveraient dans un groupe de journaux du compte de l'équipe d'exploitation."
references:
  - title: Monitor model invocation using CloudWatch Logs and Amazon S3
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/model-invocation-logging.html
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
