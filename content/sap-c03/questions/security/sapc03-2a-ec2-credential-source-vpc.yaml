id: sapc03-2a-ec2-credential-source-vpc
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs workloads on Amazon EC2 in 80 member accounts of AWS Organizations. The VPCs have no internet gateway or NAT gateway, and the instances reach AWS services only through gateway and interface VPC endpoints. A threat model shows that an attacker who extracts the temporary credentials of an instance role, for example through a server-side request forgery flaw, could use them from another network. The security team wants a preventive control in every account that rejects requests signed with EC2 instance role credentials when they do not come from the VPC to which the credentials were delivered. Requests that AWS services make on behalf of the instances must keep working.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des charges de travail sur Amazon EC2 dans 80 comptes membres d'AWS Organizations. Les VPC n'ont ni passerelle Internet ni passerelle NAT, et les instances n'atteignent les services AWS que par des points de terminaison de VPC de type passerelle et interface. Une modélisation des menaces montre qu'un attaquant qui extrait les informations d'identification temporaires d'un rôle d'instance, par exemple via une faille de falsification de requête côté serveur, pourrait les utiliser depuis un autre réseau. L'équipe de sécurité veut un contrôle préventif dans chaque compte qui rejette les requêtes signées avec les informations d'identification d'un rôle d'instance EC2 lorsqu'elles ne proviennent pas du VPC auquel ces informations ont été remises. Les requêtes que les services AWS font pour le compte des instances doivent continuer de fonctionner.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a statement to every S3 bucket policy and every KMS key policy that denies requests when aws:SourceVpce does not match one of the company's VPC endpoints."
        fr: "Ajouter à chaque politique de compartiment S3 et à chaque politique de clé KMS une instruction qui refuse les requêtes lorsque aws:SourceVpce ne correspond à aucun des points de terminaison de VPC de l'entreprise."
    - id: b
      text:
        en: "Use an EC2 declarative policy to enforce IMDSv2 on all new instance launches, and require IMDSv2 on the existing instances."
        fr: "Utiliser une politique déclarative EC2 pour imposer IMDSv2 à tous les nouveaux lancements d'instances, et exiger IMDSv2 sur les instances existantes."
    - id: c
      text:
        en: "Attach an SCP that denies all actions when aws:SourceVpc does not equal ${aws:Ec2InstanceSourceVpc}, when aws:Ec2InstanceSourceVpc is present and aws:ViaAWSService is false."
        fr: "Attacher une SCP qui refuse toutes les actions lorsque aws:SourceVpc n'est pas égal à ${aws:Ec2InstanceSourceVpc}, lorsque aws:Ec2InstanceSourceVpc est présent et que aws:ViaAWSService vaut false."
    - id: d
      text:
        en: "Enable Amazon GuardDuty in all accounts, and invoke an AWS Lambda function that revokes the role sessions when GuardDuty reports instance credential exfiltration."
        fr: "Activer Amazon GuardDuty dans tous les comptes, et appeler une fonction AWS Lambda qui révoque les sessions du rôle lorsque GuardDuty signale une exfiltration d'informations d'identification d'instance."
answer: { optionId: c }
explanation:
  correct:
    en: "aws:Ec2InstanceSourceVpc identifies the VPC to which EC2 role credentials were delivered, and comparing it with aws:SourceVpc rejects use of the credentials from any other network; because all traffic uses VPC endpoints, legitimate requests carry aws:SourceVpc. The aws:ViaAWSService exception keeps requests that services make on the instances' behalf working, and an SCP applies the control to every member account."
    fr: "aws:Ec2InstanceSourceVpc identifie le VPC auquel les informations d'identification du rôle EC2 ont été remises, et sa comparaison avec aws:SourceVpc rejette leur utilisation depuis tout autre réseau ; comme tout le trafic passe par des points de terminaison de VPC, les requêtes légitimes portent aws:SourceVpc. L'exception aws:ViaAWSService préserve les requêtes faites par les services pour le compte des instances, et une SCP applique le contrôle à chaque compte membre."
  options:
    a:
      en: "Resource policies cover only S3 and KMS, must be edited on every resource, and do not tie the credentials to the VPC where they were delivered."
      fr: "Des politiques de ressources ne couvrent que S3 et KMS, doivent être modifiées sur chaque ressource, et ne lient pas les informations d'identification au VPC où elles ont été remises."
    b:
      en: "IMDSv2 makes credential theft through request forgery harder, but credentials that are stolen in another way can still be used from any network."
      fr: "IMDSv2 rend plus difficile le vol d'informations d'identification par falsification de requête, mais des informations volées d'une autre manière restent utilisables depuis n'importe quel réseau."
    d:
      en: "GuardDuty detects the use of the credentials after it happens; it is a detective control, not a preventive one."
      fr: "GuardDuty détecte l'utilisation des informations d'identification après coup ; c'est un contrôle de détection, pas un contrôle préventif."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
