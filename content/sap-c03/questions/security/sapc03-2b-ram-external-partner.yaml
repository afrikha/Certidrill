id: sapc03-2b-ram-external-partner
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany will connect the AWS account of a logistics partner, which belongs to a different organization, to its network. AnyCompany's network account owns a transit gateway, a VPC with subnets reserved for partner workloads, a set of Route 53 Resolver forwarding rules, and a security group that is used by shared services. The partner must use some of these resources directly through an AWS RAM resource share that allows external principals.

    Which resources can AnyCompany share with the partner account? (Choose two.)
  fr: |
    AnyCompany va connecter à son réseau le compte AWS d'un partenaire logistique, qui appartient à une autre organisation. Le compte réseau d'AnyCompany possède une passerelle de transit, un VPC dont des sous-réseaux sont réservés aux charges de travail des partenaires, un ensemble de règles de transfert Route 53 Resolver et un groupe de sécurité utilisé par les services partagés. Le partenaire doit utiliser certaines de ces ressources directement via un partage de ressources AWS RAM qui autorise les principaux externes.

    Quelles ressources AnyCompany peut-elle partager avec le compte du partenaire ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The subnets of the VPC, so that the partner launches its instances directly in subnets of AnyCompany's VPC.", fr: "Les sous-réseaux du VPC, afin que le partenaire lance ses instances directement dans des sous-réseaux du VPC d'AnyCompany." } }
    - { id: b, text: { en: "The transit gateway, so that the partner attaches its own VPCs after it accepts the resource share invitation.", fr: "La passerelle de transit, afin que le partenaire y attache ses propres VPC après avoir accepté l'invitation de partage de ressources." } }
    - { id: c, text: { en: "The security group, so that the partner associates it with the network interfaces of the instances in its own VPCs.", fr: "Le groupe de sécurité, afin que le partenaire l'associe aux interfaces réseau des instances de ses propres VPC." } }
    - { id: d, text: { en: "The transit gateway route tables, so that the partner controls the routes of its own attachments.", fr: "Les tables de routage de la passerelle de transit, afin que le partenaire contrôle les routes de ses propres attachements." } }
    - { id: e, text: { en: "The Route 53 Resolver forwarding rules, so that the partner's VPCs forward queries for AnyCompany's domains.", fr: "Les règles de transfert Route 53 Resolver, afin que les VPC du partenaire transfèrent les requêtes pour les domaines d'AnyCompany." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Transit gateways and Route 53 Resolver rules can be shared with any AWS account, including accounts outside the organization. An external account receives an invitation and gets access only after it accepts it."
    fr: "Les passerelles de transit et les règles Route 53 Resolver peuvent être partagées avec n'importe quel compte AWS, y compris hors de l'organisation. Un compte externe reçoit une invitation et n'obtient l'accès qu'après l'avoir acceptée."
  options:
    a:
      en: "Subnets can be shared only with accounts in the same organization."
      fr: "Les sous-réseaux ne peuvent être partagés qu'avec des comptes de la même organisation."
    c:
      en: "Security groups can be shared only with accounts in the same organization."
      fr: "Les groupes de sécurité ne peuvent être partagés qu'avec des comptes de la même organisation."
    d:
      en: "AWS RAM shares the transit gateway itself; its route tables are not a shareable resource and stay under the owner's control."
      fr: "AWS RAM partage la passerelle de transit elle-même ; ses tables de routage ne sont pas une ressource partageable et restent sous le contrôle du propriétaire."
references:
  - title: Shareable AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/shareable.html
