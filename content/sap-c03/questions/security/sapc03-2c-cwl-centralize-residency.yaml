id: sapc03-2c-cwl-centralize-residency
objective: "2.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A European bank has 60 accounts in AWS Organizations that run payment workloads in eu-central-1 and eu-south-2. Applications write audit events to Amazon CloudWatch Logs log groups whose names start with /audit/, and these log groups are encrypted with AWS KMS customer managed keys. The security team wants an independent copy of all new audit events, from all current and future accounts, in a central audit account that application teams cannot access. National supervisors require audit data generated in each Region to remain in that Region, and historical events do not need to be copied. The bank wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une banque européenne possède 60 comptes dans AWS Organizations qui exécutent des charges de travail de paiement dans eu-central-1 et eu-south-2. Les applications écrivent des événements d'audit dans des groupes de journaux Amazon CloudWatch Logs dont le nom commence par /audit/, et ces groupes de journaux sont chiffrés avec des clés gérées par le client AWS KMS. L'équipe de sécurité veut une copie indépendante de tous les nouveaux événements d'audit, issus de tous les comptes actuels et futurs, dans un compte d'audit central auquel les équipes applicatives n'ont pas accès. Les autorités de supervision nationales exigent que les données d'audit générées dans chaque Région restent dans cette Région, et les événements historiques n'ont pas besoin d'être copiés. La banque veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a subscription filter to every /audit/ log group that streams events to an Amazon Data Firehose stream in the audit account, which delivers them to an S3 bucket in eu-central-1."
        fr: "Ajouter à chaque groupe de journaux /audit/ un filtre d'abonnement qui diffuse les événements vers un flux Amazon Data Firehose du compte d'audit, lequel les livre dans un compartiment S3 d'eu-central-1."
    - id: b
      text:
        en: "Create one CloudWatch Logs centralization rule for both source Regions with the audit account as destination, eu-central-1 as destination Region, and eu-south-2 as backup Region."
        fr: "Créer une seule règle de centralisation CloudWatch Logs pour les deux Régions sources avec le compte d'audit comme destination, eu-central-1 comme Région de destination et eu-south-2 comme Région de sauvegarde."
    - id: c
      text:
        en: "Configure CloudWatch cross-account observability with a monitoring sink in the audit account and links from every source account, so that the audit team can query the /audit/ log groups."
        fr: "Configurer l'observabilité entre comptes de CloudWatch avec un récepteur de surveillance dans le compte d'audit et des liens depuis chaque compte source, afin que l'équipe d'audit puisse interroger les groupes de journaux /audit/."
    - id: d
      text:
        en: "Create one CloudWatch Logs centralization rule per source Region, each with the audit account in that same Region as destination, the /audit/ log groups, and a destination KMS key."
        fr: "Créer une règle de centralisation CloudWatch Logs par Région source, chacune avec le compte d'audit dans cette même Région comme destination, les groupes de journaux /audit/ et une clé KMS de destination."
answer: { optionId: d }
explanation:
  correct:
    en: "CloudWatch Logs centralization rules, created from the management account or a delegated administrator, copy new log data from organization accounts and Regions to a destination account and Region, with log group selection criteria. One rule per Region with a destination in that same Region keeps each copy in its Region. For source log groups encrypted with customer managed keys, a destination-specific customer managed key, tagged LogsManaged=true and usable by CloudWatch Logs, encrypts the copies."
    fr: "Les règles de centralisation CloudWatch Logs, créées depuis le compte de gestion ou un administrateur délégué, copient les nouvelles données de journaux des comptes et Régions de l'organisation vers un compte et une Région de destination, avec des critères de sélection des groupes de journaux. Une règle par Région avec une destination dans cette même Région conserve chaque copie dans sa Région. Pour des groupes de journaux sources chiffrés avec des clés gérées par le client, une clé gérée par le client propre à la destination, étiquetée LogsManaged=true et utilisable par CloudWatch Logs, chiffre les copies."
  options:
    a:
      en: "Subscription filters must be added to every log group in every account, including new ones, and events from eu-south-2 would be stored in eu-central-1."
      fr: "Les filtres d'abonnement doivent être ajoutés à chaque groupe de journaux de chaque compte, y compris aux nouveaux, et les événements d'eu-south-2 seraient stockés dans eu-central-1."
    b:
      en: "A single rule copies eu-south-2 events to eu-central-1 and keeps a backup copy of eu-central-1 events in eu-south-2, so audit data leaves the Region where it was generated."
      fr: "Une seule règle copie les événements d'eu-south-2 vers eu-central-1 et garde une copie de sauvegarde des événements d'eu-central-1 dans eu-south-2 : les données d'audit quittent la Région où elles ont été générées."
    c:
      en: "Cross-account observability lets the audit account view data that stays in the source accounts; it creates no independent copy that application teams cannot alter."
      fr: "L'observabilité entre comptes permet au compte d'audit de consulter des données qui restent dans les comptes sources ; elle ne crée aucune copie indépendante que les équipes applicatives ne pourraient pas modifier."
references:
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
