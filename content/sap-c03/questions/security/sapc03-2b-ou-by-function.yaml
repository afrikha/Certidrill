id: sapc03-2b-ou-by-function
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany is designing a new organization in AWS Organizations for 150 accounts that belong to six business units. The business units are reorganized almost every year. Production accounts in every business unit must receive the same strict SCPs, development accounts must receive the same lighter SCPs, and the security tooling and log archive accounts need their own protective controls. The company wants policy attachments that stay simple and stable when reporting lines change.

    How should the company structure its OUs?
  fr: |
    AnyCompany conçoit une nouvelle organisation AWS Organizations pour 150 comptes appartenant à six unités commerciales. Les unités commerciales sont réorganisées presque chaque année. Les comptes de production de chaque unité doivent recevoir les mêmes SCP strictes, les comptes de développement les mêmes SCP plus légères, et les comptes d'outils de sécurité et d'archive des journaux ont besoin de leurs propres contrôles de protection. L'entreprise veut des attachements de politiques simples et stables lorsque les liens hiérarchiques changent.

    Comment l'entreprise doit-elle structurer ses unités d'organisation (OU) ?
body:
  options:
    - { id: a, text: { en: "Create one top-level OU per business unit with Production and Development child OUs, and attach a copy of each SCP to the child OUs of every business unit.", fr: "Créer une OU de premier niveau par unité commerciale avec des OU enfants Production et Development, et attacher une copie de chaque SCP aux OU enfants de chaque unité commerciale." } }
    - { id: b, text: { en: "Place all accounts in one OU, and write SCP conditions that compare a principal tag of each caller with the environment of its account.", fr: "Placer tous les comptes dans une seule OU, et écrire des conditions de SCP qui comparent une balise de principal de chaque appelant à l'environnement de son compte." } }
    - { id: c, text: { en: "Create a Security OU and a Workloads OU with Production and Development child OUs, and attach each SCP once to the OU that matches its set of controls.", fr: "Créer une OU Security et une OU Workloads avec des OU enfants Production et Development, et attacher chaque SCP une seule fois à l'OU qui correspond à son ensemble de contrôles." } }
    - { id: d, text: { en: "Create a separate organization for each business unit so that each unit manages its own SCPs, and share the security tooling account between the organizations.", fr: "Créer une organisation distincte par unité commerciale afin que chaque unité gère ses propres SCP, et partager le compte d'outils de sécurité entre les organisations." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS recommends organizing accounts in OUs based on function, compliance requirements, or a common set of controls rather than mirroring the reporting structure. A Security OU and a Workloads OU split by environment let each SCP be attached once to an OU, and a reorganization of the business units does not move accounts or policies."
    fr: "AWS recommande d'organiser les comptes en OU selon la fonction, les exigences de conformité ou un ensemble commun de contrôles plutôt que de reproduire la structure hiérarchique. Une OU Security et une OU Workloads découpée par environnement permettent d'attacher chaque SCP une seule fois à une OU, et une réorganisation des unités commerciales ne déplace ni comptes ni politiques."
  options:
    a:
      en: "Mirroring the business units duplicates every SCP six times and forces OU changes at each reorganization."
      fr: "Reproduire les unités commerciales duplique chaque SCP six fois et impose des changements d'OU à chaque réorganisation."
    b:
      en: "Tag-based conditions in a single OU are fragile and harder to govern than applying controls to OUs, and a mistaken tag would weaken production controls."
      fr: "Des conditions basées sur des balises dans une seule OU sont fragiles et plus difficiles à gouverner que des contrôles appliqués aux OU, et une balise erronée affaiblirait les contrôles de production."
    d:
      en: "Separate organizations multiply management accounts, billing, and policy sets, and an account cannot belong to several organizations at once."
      fr: "Des organisations distinctes multiplient les comptes de gestion, la facturation et les jeux de politiques, et un compte ne peut pas appartenir à plusieurs organisations à la fois."
references:
  - title: Design principles for your multi-account strategy
    url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/design-principles-for-your-multi-account-strategy.html
  - title: Recommended OUs and accounts
    url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/recommended-ous-and-accounts.html
