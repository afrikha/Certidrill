id: sapc03-2d-prompt-attack-tags
objective: "2.5.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An airline runs a booking assistant whose backend calls the Amazon Bedrock InvokeModel API. For each request, the backend builds one prompt string that starts with a long developer system prompt and ends with the traveler's message. The request references a guardrail whose prompt attack filter is set to HIGH with the BLOCK action. Penetration testers showed that messages such as instructions to ignore previous rules still reach the model, and guardrail traces show no prompt attack assessment. When the team briefly applied the filter to the whole prompt in a test, the developer system prompt itself was flagged as an attack. The airline must block prompt attacks in travelers' messages without flagging its own system prompt, and it does not want to change models or APIs.

    Which solution will meet these requirements?
  fr: |
    Une compagnie aérienne exploite un assistant de réservation dont le backend appelle l'API InvokeModel d'Amazon Bedrock. Pour chaque requête, le backend construit une seule chaîne d'invite qui commence par une longue invite système du développeur et se termine par le message du voyageur. La requête référence un guardrail dont le filtre d'attaque par invite est réglé à HIGH avec l'action BLOCK. Des testeurs d'intrusion ont montré que des messages comme des instructions d'ignorer les règles précédentes atteignent toujours le modèle, et les traces du guardrail ne montrent aucune évaluation d'attaque par invite. Lorsque l'équipe a brièvement appliqué le filtre à toute l'invite lors d'un test, l'invite système du développeur a elle-même été signalée comme une attaque. La compagnie doit bloquer les attaques par invite dans les messages des voyageurs sans signaler sa propre invite système, et ne veut changer ni de modèle ni d'API.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Raise the output strength of the prompt attack filter to HIGH so that the guardrail also evaluates the model responses, and add the BLOCK action to the output direction.", fr: "Porter la force de sortie du filtre d'attaque par invite à HIGH afin que le guardrail évalue aussi les réponses du modèle, et ajouter l'action BLOCK dans le sens sortie." }
    - id: b
      text: { en: "Wrap only the traveler's message in guardrail input tags with a random tag suffix generated for each request, and leave the system prompt outside the tags.", fr: "Encadrer uniquement le message du voyageur avec des balises d'entrée de guardrail utilisant un suffixe de balise aléatoire généré pour chaque requête, et laisser l'invite système en dehors des balises." }
    - id: c
      text: { en: "Move the guardrail to the Standard tier with a guardrail profile for cross-Region inference so that the prompt attack filter also detects prompt leakage attempts.", fr: "Passer le guardrail au niveau Standard avec un profil de guardrail pour l'inférence interrégionale afin que le filtre d'attaque par invite détecte aussi les tentatives de fuite d'invite." }
    - id: d
      text: { en: "Add a denied topic that describes attempts to override the assistant's instructions, with sample phrases taken from the penetration test report, and set it to BLOCK for input.", fr: "Ajouter un sujet refusé qui décrit les tentatives de contourner les instructions de l'assistant, avec des exemples de phrases tirés du rapport de test d'intrusion, et le régler à BLOCK en entrée." }
answer: { optionId: b }
explanation:
  correct:
    en: "With InvokeModel and InvokeModelWithResponseStream, the prompt attack filter evaluates only the user content wrapped in guardrail input tags; without tags, prompt attacks are not filtered, which explains the empty traces. Tagging only the traveler's message keeps the developer system prompt out of the evaluation, and a random suffix per request stops a traveler from closing the tag in a message."
    fr: "Avec InvokeModel et InvokeModelWithResponseStream, le filtre d'attaque par invite n'évalue que le contenu utilisateur encadré par les balises d'entrée de guardrail ; sans balises, les attaques par invite ne sont pas filtrées, ce qui explique les traces vides. Baliser uniquement le message du voyageur exclut l'invite système du développeur de l'évaluation, et un suffixe aléatoire par requête empêche un voyageur de fermer la balise dans un message."
  options:
    a:
      en: "The prompt attack filter evaluates user prompts only and has no output setting; evaluating responses would not stop the attack from reaching the model."
      fr: "Le filtre d'attaque par invite n'évalue que les invites utilisateur et n'a pas de réglage de sortie ; évaluer les réponses n'empêcherait pas l'attaque d'atteindre le modèle."
    c:
      en: "The Standard tier adds prompt leakage detection, but without input tags the InvokeModel calls are still not evaluated for prompt attacks, whatever the tier."
      fr: "Le niveau Standard ajoute la détection de fuite d'invite, mais sans balises d'entrée les appels InvokeModel ne sont toujours pas évalués pour les attaques par invite, quel que soit le niveau."
    d:
      en: "A denied topic would evaluate the whole untagged prompt, including the system prompt, and it matches subjects rather than the many forms of jailbreak and injection that the prompt attack filter detects."
      fr: "Un sujet refusé évaluerait toute l'invite non balisée, invite système comprise, et il reconnaît des sujets plutôt que les nombreuses formes de jailbreak et d'injection que détecte le filtre d'attaque par invite."
references:
  - title: Detect prompt attacks with Amazon Bedrock Guardrails
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-prompt-attack.html
  - title: Apply tags to user input to filter content
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-tagging.html
