id: sapc03-2d-guardrail-pii-actions
objective: "2.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail bank is building a customer support assistant on Amazon Bedrock for its 40 contact centers. Agents paste customer messages into the assistant, and the model drafts replies from the bank's knowledge base. The compliance team set three rules. A prompt that contains a payment card number must be rejected before it reaches the model. Email addresses that appear in model responses must be replaced with a placeholder rather than causing the whole response to be blocked. Internal case IDs, which always have the format CS- followed by eight digits, must also be replaced with a placeholder wherever they appear.

    Which Amazon Bedrock Guardrails configuration will meet these requirements?
  fr: |
    Une banque de détail construit un assistant de support client sur Amazon Bedrock pour ses 40 centres de contact. Les conseillers collent les messages des clients dans l'assistant, et le modèle rédige des réponses à partir de la base de connaissances de la banque. L'équipe de conformité a fixé trois règles. Une invite qui contient un numéro de carte de paiement doit être rejetée avant d'atteindre le modèle. Les adresses e-mail qui apparaissent dans les réponses du modèle doivent être remplacées par un espace réservé au lieu de bloquer toute la réponse. Les identifiants de dossier internes, qui ont toujours le format CS- suivi de huit chiffres, doivent aussi être remplacés par un espace réservé partout où ils apparaissent.

    Quelle configuration d'Amazon Bedrock Guardrails répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A sensitive information filter with CREDIT_DEBIT_CARD_NUMBER set to BLOCK for input, EMAIL set to ANONYMIZE for output, and a regex filter for CS-[0-9]{8} set to ANONYMIZE.", fr: "Un filtre d'informations sensibles avec CREDIT_DEBIT_CARD_NUMBER défini à BLOCK en entrée, EMAIL défini à ANONYMIZE en sortie, et un filtre d'expression régulière pour CS-[0-9]{8} défini à ANONYMIZE." }
    - id: b
      text: { en: "A word filter that lists the card number prefixes and the email domains of the bank's customers, and a second word filter that lists the case IDs opened during the last year.", fr: "Un filtre de mots qui liste les préfixes de numéros de carte et les domaines e-mail des clients de la banque, et un second filtre de mots qui liste les identifiants de dossier ouverts l'année passée." }
    - id: c
      text: { en: "A denied topic named payment card data with sample phrases, the Misconduct content filter at HIGH strength, and a denied topic named internal case references.", fr: "Un sujet refusé nommé données de carte de paiement avec des exemples de phrases, le filtre de contenu Misconduct à la force HIGH et un sujet refusé nommé références de dossier internes." }
    - id: d
      text: { en: "A sensitive information filter with CREDIT_DEBIT_CARD_NUMBER and EMAIL set to ANONYMIZE for input and output, and a regex filter for CS-[0-9]{8} set to BLOCK.", fr: "Un filtre d'informations sensibles avec CREDIT_DEBIT_CARD_NUMBER et EMAIL définis à ANONYMIZE en entrée et en sortie, et un filtre d'expression régulière pour CS-[0-9]{8} défini à BLOCK." }
answer: { optionId: a }
explanation:
  correct:
    en: "Sensitive information filters detect built-in PII types and custom regex patterns, and each can have its own action per direction: BLOCK returns the blocked message, and ANONYMIZE replaces the value with a placeholder such as {EMAIL}. Blocking card numbers on input, masking emails on output and masking the CS- pattern with a regex meets the three rules."
    fr: "Les filtres d'informations sensibles détectent des types de PII intégrés et des modèles d'expression régulière personnalisés, chacun avec sa propre action par sens : BLOCK renvoie le message de blocage, et ANONYMIZE remplace la valeur par un espace réservé comme {EMAIL}. Bloquer les numéros de carte en entrée, masquer les e-mails en sortie et masquer le modèle CS- avec une expression régulière répond aux trois règles."
  options:
    b:
      en: "Word filters match exact words and phrases; they cannot recognize every card number, email address or future case ID, and they block instead of masking."
      fr: "Les filtres de mots reconnaissent des mots et phrases exacts ; ils ne peuvent pas reconnaître tous les numéros de carte, adresses e-mail ou futurs identifiants de dossier, et ils bloquent au lieu de masquer."
    c:
      en: "Denied topics and content filters block whole prompts or responses about a subject; they never replace a value with a placeholder, so emails and case IDs would block the response."
      fr: "Les sujets refusés et les filtres de contenu bloquent des invites ou réponses entières sur un sujet ; ils ne remplacent jamais une valeur par un espace réservé : les e-mails et identifiants de dossier bloqueraient la réponse."
    d:
      en: "Masking card numbers lets the prompt reach the model instead of rejecting it, and blocking the case ID pattern rejects responses that should only be masked."
      fr: "Masquer les numéros de carte laisse l'invite atteindre le modèle au lieu de la rejeter, et bloquer le modèle d'identifiant de dossier rejette des réponses qui devaient seulement être masquées."
references:
  - title: Remove PII from conversations by using sensitive information filters
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-sensitive-filters.html
