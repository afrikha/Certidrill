id: sapc03-2b-acm-acme-hybrid
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany runs customer-facing web services on premises and in self-managed Kubernetes clusters in two colocation facilities. It buys publicly trusted certificates from a commercial CA and renews them by hand, which has caused two outages this year. The company wants AWS Certificate Manager (ACM) to be the inventory of all its public certificates. Issuance and renewal must be fully automated on the servers and in the clusters. A security policy states that a private key must be generated on the host that uses it and must never be transmitted over the network, including from AWS. The PKI team will approve in advance the domains that each application team may request.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des services web destinés aux clients sur site et dans des clusters Kubernetes autogérés hébergés dans deux centres de colocation. Elle achète des certificats publics auprès d'une CA commerciale et les renouvelle manuellement, ce qui a provoqué deux pannes cette année. L'entreprise veut qu'AWS Certificate Manager (ACM) soit l'inventaire de tous ses certificats publics. L'émission et le renouvellement doivent être entièrement automatisés sur les serveurs et dans les clusters. Une politique de sécurité stipule qu'une clé privée doit être générée sur l'hôte qui l'utilise et ne doit jamais transiter sur le réseau, y compris depuis AWS. L'équipe PKI approuvera à l'avance les domaines que chaque équipe applicative peut demander.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Pre-approve the domains with ACM domain validations, give each team external account binding (EAB) credentials, and run ACME clients such as cert-manager and Certbot against the ACM ACME endpoint.", fr: "Approuver à l'avance les domaines avec des validations de domaine ACM, remettre à chaque équipe des informations d'identification EAB (external account binding), et exécuter des clients ACME comme cert-manager et Certbot sur le point de terminaison ACME d'ACM." } }
    - { id: b, text: { en: "Request exportable public certificates in ACM, and run a scheduled job that exports each renewed certificate with its private key and installs it on the servers and in the clusters.", fr: "Demander des certificats publics exportables dans ACM, et exécuter une tâche planifiée qui exporte chaque certificat renouvelé avec sa clé privée et l'installe sur les serveurs et dans les clusters." } }
    - { id: c, text: { en: "Create an AWS Private CA root CA and subordinate CA, and issue the certificates with a cert-manager issuer for AWS Private CA in the clusters and a scheduled script on the servers.", fr: "Créer une CA racine et une CA subordonnée AWS Private CA, et émettre les certificats avec un émetteur cert-manager pour AWS Private CA dans les clusters et un script planifié sur les serveurs." } }
    - { id: d, text: { en: "Keep buying certificates from the commercial CA, import them into ACM, and rely on ACM managed renewal to renew the imported certificates before they expire.", fr: "Continuer d'acheter les certificats auprès de la CA commerciale, les importer dans ACM, et s'appuyer sur le renouvellement géré d'ACM pour renouveler les certificats importés avant leur expiration." } }
answer: { optionId: a }
explanation:
  correct:
    en: "ACM supports the ACME protocol for workloads on customer-managed infrastructure. Administrators pre-approve domains and distribute EAB credentials, the ACME client generates and keeps the private key, and the issued certificates are publicly trusted, appear in the ACM inventory, and are renewed by the client before they expire."
    fr: "ACM prend en charge le protocole ACME pour les charges de travail hébergées sur une infrastructure gérée par le client. Les administrateurs approuvent les domaines à l'avance et distribuent les informations d'identification EAB, le client ACME génère et conserve la clé privée, et les certificats émis sont publics, apparaissent dans l'inventaire ACM et sont renouvelés par le client avant leur expiration."
  options:
    b:
      en: "Exporting a certificate sends its private key from ACM over the network, which the security policy forbids."
      fr: "L'exportation d'un certificat transmet sa clé privée depuis ACM sur le réseau, ce que la politique de sécurité interdit."
    c:
      en: "Certificates from AWS Private CA are not publicly trusted, so browsers of external customers would reject them."
      fr: "Les certificats AWS Private CA ne sont pas publics : les navigateurs des clients externes les refuseraient."
    d:
      en: "ACM does not renew imported certificates, so renewals would stay manual."
      fr: "ACM ne renouvelle pas les certificats importés : les renouvellements resteraient manuels."
references:
  - title: ACME certificate automation
    url: https://docs.aws.amazon.com/acm/latest/userguide/acm-acme.html
