id: sapc03-2a-trust-principal-org-paths
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 accounts in AWS Organizations. A SecurityAudit role is deployed to every account with AWS CloudFormation StackSets. The role must be assumable only by IAM roles in accounts that belong to the Security OU. The Security OU has four accounts today and will receive new accounts during the next year. The trust policy must not need updates when accounts are added to the Security OU, and principals in other OUs, including administrators, must not be able to assume the role.

    Which trust policy configuration will meet these requirements?
  fr: |
    AnyCompany possède 300 comptes dans AWS Organizations. Un rôle SecurityAudit est déployé dans chaque compte avec AWS CloudFormation StackSets. Le rôle ne doit pouvoir être endossé que par des rôles IAM de comptes qui appartiennent à l'OU Security. L'OU Security compte aujourd'hui quatre comptes et en recevra de nouveaux au cours de l'année. La politique d'approbation ne doit pas nécessiter de mise à jour lorsque des comptes sont ajoutés à l'OU Security, et les principaux des autres OU, y compris les administrateurs, ne doivent pas pouvoir endosser le rôle.

    Quelle configuration de politique d'approbation répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Allow sts:AssumeRole for the AWS principal \"*\" with a StringEquals condition that aws:PrincipalOrgID equals the ID of AnyCompany's organization."
        fr: "Autoriser sts:AssumeRole pour le principal AWS \"*\" avec une condition StringEquals selon laquelle aws:PrincipalOrgID est égal à l'ID de l'organisation d'AnyCompany."
    - id: b
      text:
        en: "Allow sts:AssumeRole for the root principals of the four current Security OU accounts, and update the StackSet template whenever an account is added to the OU."
        fr: "Autoriser sts:AssumeRole pour les principaux racine des quatre comptes actuels de l'OU Security, et mettre à jour le modèle du StackSet chaque fois qu'un compte est ajouté à l'OU."
    - id: c
      text:
        en: "Allow sts:AssumeRole for the AWS principal \"*\" with a ForAnyValue:StringLike condition that aws:SourceOrgPaths matches the path of the Security OU."
        fr: "Autoriser sts:AssumeRole pour le principal AWS \"*\" avec une condition ForAnyValue:StringLike selon laquelle aws:SourceOrgPaths correspond au chemin de l'OU Security."
    - id: d
      text:
        en: "Allow sts:AssumeRole for the AWS principal \"*\" with a ForAnyValue:StringLike condition that aws:PrincipalOrgPaths matches the path of the Security OU followed by /*."
        fr: "Autoriser sts:AssumeRole pour le principal AWS \"*\" avec une condition ForAnyValue:StringLike selon laquelle aws:PrincipalOrgPaths correspond au chemin de l'OU Security suivi de /*."
answer: { optionId: d }
explanation:
  correct:
    en: "aws:PrincipalOrgPaths compares the AWS Organizations path of the calling principal's account with the path in the policy, so it can restrict access to principals in a specific OU. Accounts added to the Security OU are matched automatically, and principals of accounts in other OUs do not match."
    fr: "aws:PrincipalOrgPaths compare le chemin AWS Organizations du compte du principal appelant au chemin de la politique : il permet de restreindre l'accès aux principaux d'une OU précise. Les comptes ajoutés à l'OU Security correspondent automatiquement, et les principaux des comptes des autres OU ne correspondent pas."
  options:
    a:
      en: "aws:PrincipalOrgID matches every principal in the organization, including the accounts outside the Security OU."
      fr: "aws:PrincipalOrgID correspond à tous les principaux de l'organisation, y compris ceux des comptes situés hors de l'OU Security."
    b:
      en: "Listing accounts requires a trust policy update every time an account joins the Security OU."
      fr: "Lister les comptes exige une mise à jour de la politique d'approbation chaque fois qu'un compte rejoint l'OU Security."
    c:
      en: "aws:SourceOrgPaths describes the resource on whose behalf an AWS service principal acts; it does not identify the IAM principal that assumes the role."
      fr: "aws:SourceOrgPaths décrit la ressource pour le compte de laquelle agit un principal de service AWS ; il n'identifie pas le principal IAM qui endosse le rôle."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
