id: sapc03-2b-route53-profiles-share
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 250 VPCs in 70 accounts in one Region. Every VPC must use the same Route 53 Resolver forwarding rules for the on-premises domains, the same set of private hosted zones, and the same DNS Firewall rule groups. Today, a script in each account associates these resources with each new VPC, and VPCs regularly miss updates when the network team adds a rule or a zone. The network team wants changes to propagate to all VPCs automatically.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany dispose de 250 VPC dans 70 comptes d'une même Région. Chaque VPC doit utiliser les mêmes règles de transfert Route 53 Resolver pour les domaines sur site, le même ensemble de zones hébergées privées et les mêmes groupes de règles DNS Firewall. Aujourd'hui, un script dans chaque compte associe ces ressources à chaque nouveau VPC, et des VPC manquent régulièrement des mises à jour lorsque l'équipe réseau ajoute une règle ou une zone. L'équipe réseau veut que les modifications se propagent automatiquement à tous les VPC.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Put the forwarding rules, private hosted zones, and DNS Firewall rule groups in a Route 53 Profile, share it with the organization through AWS RAM, and associate it with each VPC.", fr: "Placer les règles de transfert, les zones hébergées privées et les groupes de règles DNS Firewall dans un profil Route 53, le partager avec l'organisation via AWS RAM, et l'associer à chaque VPC." } }
    - { id: b, text: { en: "Share the forwarding rules with the organization through AWS RAM, and keep the scripts in each account that associate the private hosted zones and DNS Firewall rule groups.", fr: "Partager les règles de transfert avec l'organisation via AWS RAM, et conserver dans chaque compte les scripts qui associent les zones hébergées privées et les groupes de règles DNS Firewall." } }
    - { id: c, text: { en: "Create Route 53 Resolver inbound endpoints in every VPC, and point the DHCP option sets of the VPCs to the on-premises DNS servers.", fr: "Créer des points de terminaison entrants Route 53 Resolver dans chaque VPC, et faire pointer les jeux d'options DHCP des VPC vers les serveurs DNS sur site." } }
    - { id: d, text: { en: "Peer every VPC with a central DNS VPC that holds the private hosted zones and DNS Firewall rule groups, and forward the queries to it with a Resolver rule.", fr: "Appairer chaque VPC avec un VPC DNS central qui contient les zones hébergées privées et les groupes de règles DNS Firewall, et lui transférer les requêtes avec une règle Resolver." } }
answer: { optionId: a }
explanation:
  correct:
    en: "A Route 53 Profile groups private hosted zones, Resolver forwarding and system rules, DNS Firewall rule groups, and other DNS settings. A Profile can be shared through AWS RAM and associated with VPCs, and when the Profile is updated its settings propagate to every associated VPC."
    fr: "Un profil Route 53 regroupe des zones hébergées privées, des règles Resolver de transfert et système, des groupes de règles DNS Firewall et d'autres paramètres DNS. Un profil peut être partagé via AWS RAM et associé à des VPC, et lorsqu'il est mis à jour ses paramètres se propagent à tous les VPC associés."
  options:
    b:
      en: "Sharing only the rules leaves the private hosted zones and DNS Firewall associations to scripts, which is the source of the missed updates."
      fr: "Ne partager que les règles laisse les zones hébergées privées et les associations DNS Firewall aux scripts, qui sont la cause des mises à jour manquées."
    c:
      en: "Inbound endpoints receive queries from on premises; pointing DHCP options to on-premises servers bypasses the private hosted zones and DNS Firewall."
      fr: "Les points de terminaison entrants reçoivent les requêtes venant du site ; faire pointer les options DHCP vers des serveurs sur site contourne les zones hébergées privées et DNS Firewall."
    d:
      en: "A peering mesh of 250 VPCs and a custom DNS forwarding design add far more overhead and do not apply the DNS Firewall rule groups to each VPC."
      fr: "Un maillage d'appairages de 250 VPC et une conception de transfert DNS personnalisée ajoutent bien plus de charge et n'appliquent pas les groupes de règles DNS Firewall à chaque VPC."
references:
  - title: What are Amazon Route 53 Profiles?
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/profiles.html
