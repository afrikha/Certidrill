id: sapc03-2b-rcp-sts-partner-roles
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's member accounts contain IAM roles that developers sometimes configure to trust external accounts. The security team wants to ensure that only principals from AnyCompany's organization and from two approved partner accounts, 111122223333 and 444455556666, can assume roles in member accounts. Role trust policies are written by account teams, and the control must not depend on them. AWS services must still be able to assume service roles.

    Which solution will meet these requirements?
  fr: |
    Les comptes membres d'AnyCompany contiennent des rôles IAM que les développeurs configurent parfois pour approuver des comptes externes. L'équipe de sécurité veut garantir que seuls les principaux de l'organisation d'AnyCompany et de deux comptes partenaires approuvés, 111122223333 et 444455556666, puissent endosser des rôles dans les comptes membres. Les politiques d'approbation des rôles sont rédigées par les équipes des comptes, et le contrôle ne doit pas en dépendre. Les services AWS doivent toujours pouvoir endosser les rôles de service.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Attach an SCP to the root that denies sts:AssumeRole when aws:PrincipalOrgID does not equal the organization ID, except for the two partner accounts.", fr: "Attacher à la racine une SCP qui refuse sts:AssumeRole lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation, sauf pour les deux comptes partenaires." } }
    - { id: b, text: { en: "Enable IAM Access Analyzer with the organization as the zone of trust, and remove the role trust relationships that it reports for unknown accounts.", fr: "Activer IAM Access Analyzer avec l'organisation comme zone de confiance, et supprimer les relations d'approbation de rôle qu'il signale pour des comptes inconnus." } }
    - { id: c, text: { en: "Attach an RCP to the root that denies sts:AssumeRole unless aws:PrincipalOrgID is the organization, aws:PrincipalAccount is a partner account, or aws:PrincipalIsAWSService is true.", fr: "Attacher à la racine une RCP qui refuse sts:AssumeRole sauf si aws:PrincipalOrgID est l'organisation, si aws:PrincipalAccount est un compte partenaire ou si aws:PrincipalIsAWSService est true." } }
    - { id: d, text: { en: "Attach a permissions boundary to every role in the member accounts that denies sts:AssumeRole to principals outside the organization and the two partner accounts.", fr: "Attacher à chaque rôle des comptes membres une limite d'autorisations qui refuse sts:AssumeRole aux principaux extérieurs à l'organisation et aux deux comptes partenaires." } }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS STS is one of the services that RCPs support, and an RCP applies to every principal that tries to access a resource in a member account, including principals from outside the organization. Conditions on aws:PrincipalOrgID and aws:PrincipalAccount define the trusted identities, and aws:PrincipalIsAWSService keeps AWS services working."
    fr: "AWS STS fait partie des services pris en charge par les RCP, et une RCP s'applique à chaque principal qui tente d'accéder à une ressource d'un compte membre, y compris les principaux hors de l'organisation. Les conditions sur aws:PrincipalOrgID et aws:PrincipalAccount définissent les identités approuvées, et aws:PrincipalIsAWSService préserve le fonctionnement des services AWS."
  options:
    a:
      en: "SCPs apply to principals inside the organization's member accounts; they do not restrict external principals that assume roles in those accounts."
      fr: "Les SCP s'appliquent aux principaux des comptes membres de l'organisation ; elles ne restreignent pas les principaux externes qui endossent des rôles dans ces comptes."
    b:
      en: "Access Analyzer reports external access after it is configured; it does not prevent role assumption."
      fr: "Access Analyzer signale l'accès externe une fois configuré ; il n'empêche pas l'endossement de rôles."
    d:
      en: "A permissions boundary limits what the role can do, not who can assume it, and account teams could change it."
      fr: "Une limite d'autorisations restreint ce que le rôle peut faire, pas qui peut l'endosser, et les équipes des comptes pourraient la modifier."
references:
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
