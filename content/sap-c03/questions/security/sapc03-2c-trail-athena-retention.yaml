id: sapc03-2c-trail-athena-retention
objective: "2.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pension fund must keep the AWS CloudTrail management events of its 40 accounts for 10 years. It has never signed up for CloudTrail Lake. Security analysts run ad hoc SQL queries a few times each month on events from the last 12 months. Events older than 12 months are queried about once a year, during regulatory audits, and the auditors accept waiting up to 48 hours for older data to become available. An organization trail already delivers log files to an Amazon S3 bucket in a log archive account. The fund wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Un fonds de pension doit conserver pendant 10 ans les événements de gestion AWS CloudTrail de ses 40 comptes. Il ne s'est jamais inscrit à CloudTrail Lake. Les analystes de sécurité exécutent quelques fois par mois des requêtes SQL ponctuelles sur les événements des 12 derniers mois. Les événements de plus de 12 mois sont interrogés environ une fois par an, lors des audits réglementaires, et les auditeurs acceptent d'attendre jusqu'à 48 heures que les données anciennes soient disponibles. Un journal de suivi d'organisation livre déjà les fichiers journaux dans un compartiment Amazon S3 d'un compte d'archivage des journaux. Le fonds veut la solution la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a CloudTrail Lake organization event data store with the one-year extendable retention pricing option, set its retention to 3,653 days, and query it with SQL."
        fr: "Créer un magasin de données d'événements d'organisation CloudTrail Lake avec l'option de tarification à rétention extensible d'un an, définir sa rétention à 3 653 jours, et l'interroger en SQL."
    - id: b
      text:
        en: "Send the organization trail to a CloudWatch Logs log group with a 10-year retention setting, and query the events of any period with CloudWatch Logs Insights."
        fr: "Envoyer le journal de suivi d'organisation vers un groupe de journaux CloudWatch Logs avec une rétention de 10 ans, et interroger les événements de n'importe quelle période avec CloudWatch Logs Insights."
    - id: c
      text:
        en: "Add an S3 Lifecycle rule that moves log files to S3 Glacier Deep Archive after 12 months and expires them after 10 years, and query recent logs with Athena."
        fr: "Ajouter une règle de cycle de vie S3 qui déplace les fichiers journaux vers S3 Glacier Deep Archive après 12 mois et les fait expirer après 10 ans, et interroger les journaux récents avec Athena."
    - id: d
      text:
        en: "Keep all log files in S3 Standard for the full 10 years, and query all events with an Amazon Athena table that uses partition projection."
        fr: "Conserver tous les fichiers journaux dans S3 Standard pendant les 10 années, et interroger tous les événements avec une table Amazon Athena qui utilise la projection de partitions."
answer: { optionId: c }
explanation:
  correct:
    en: "The organization trail already writes log files to S3, where Athena can query recent events with SQL without loading them anywhere else. Moving files older than 12 months to S3 Glacier Deep Archive gives the lowest storage cost for data that is rarely read and can be restored within the accepted delay before an audit, and a Lifecycle expiration removes it after 10 years."
    fr: "Le journal de suivi d'organisation écrit déjà les fichiers journaux dans S3, où Athena peut interroger les événements récents en SQL sans les charger ailleurs. Déplacer les fichiers de plus de 12 mois vers S3 Glacier Deep Archive offre le coût de stockage le plus bas pour des données rarement lues, qui peuvent être restaurées dans le délai accepté avant un audit, et une expiration de cycle de vie les supprime au bout de 10 ans."
  options:
    a:
      en: "CloudTrail Lake has not been open to new customers since May 31, 2026, and the fund has never signed up for it."
      fr: "CloudTrail Lake n'est plus ouvert aux nouveaux clients depuis le 31 mai 2026, et le fonds ne s'y est jamais inscrit."
    b:
      en: "Ingesting and storing 10 years of events in CloudWatch Logs costs much more than archival S3 storage for data that is read once a year."
      fr: "Ingérer et stocker 10 ans d'événements dans CloudWatch Logs coûte bien plus cher qu'un stockage d'archivage S3 pour des données lues une fois par an."
    d:
      en: "Keeping 10 years of rarely read files in S3 Standard costs more than archiving files older than 12 months, which the access pattern allows."
      fr: "Conserver 10 ans de fichiers rarement lus dans S3 Standard coûte plus cher que d'archiver les fichiers de plus de 12 mois, ce que permet le profil d'accès."
references:
  - title: Working with AWS CloudTrail Lake
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-lake.html
  - title: Creating a trail for an organization
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
