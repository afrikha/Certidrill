id: sapc03-2b-pq-tls-cloudtrail-alarm
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has rolled out hybrid post-quantum TLS in the AWS SDK clients of 300 applications across 40 accounts in AWS Organizations. Some applications still run older SDK versions. An organization trail delivers CloudTrail events to a central Amazon S3 bucket and to a CloudWatch Logs log group. The security team must be alerted within minutes when any application calls AWS KMS without a post-quantum key exchange, so that it can find the applications that still need an update.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany a déployé le TLS hybride post-quantique dans les clients SDK AWS de 300 applications réparties sur 40 comptes d'AWS Organizations. Certaines applications utilisent encore d'anciennes versions du SDK. Un journal de suivi d'organisation envoie les événements CloudTrail vers un compartiment Amazon S3 central et vers un groupe de journaux CloudWatch Logs. L'équipe de sécurité doit être alertée en quelques minutes lorsqu'une application appelle AWS KMS sans échange de clés post-quantique, afin de trouver les applications à mettre à jour.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Enable VPC Flow Logs with a custom format in all VPCs, and create an alarm on flows to the AWS KMS endpoints that do not record an ML-KEM key exchange.", fr: "Activer les journaux de flux VPC au format personnalisé dans tous les VPC, et créer une alarme sur les flux vers les points de terminaison AWS KMS qui n'enregistrent pas d'échange de clés ML-KEM." } }
    - { id: b, text: { en: "Create an AWS Config custom rule in every account that evaluates each KMS key and reports the keys that applications use without post-quantum TLS.", fr: "Créer dans chaque compte une règle AWS Config personnalisée qui évalue chaque clé KMS et signale les clés que des applications utilisent sans TLS post-quantique." } }
    - { id: c, text: { en: "Route all AWS KMS traffic through AWS Network Firewall with TLS inspection, and alert on sessions whose key exchange does not include ML-KEM.", fr: "Faire passer tout le trafic AWS KMS par AWS Network Firewall avec inspection TLS, et alerter sur les sessions dont l'échange de clés n'inclut pas ML-KEM." } }
    - { id: d, text: { en: "Create a metric filter on the log group for KMS events whose tlsDetails.keyExchange value does not contain MLKEM, and create an alarm on the metric.", fr: "Créer sur le groupe de journaux un filtre de métriques pour les événements KMS dont la valeur tlsDetails.keyExchange ne contient pas MLKEM, et créer une alarme sur la métrique." } }
answer: { optionId: d }
explanation:
  correct:
    en: "CloudTrail records the TLS details of each AWS KMS call, and the keyExchange field shows a hybrid algorithm such as X25519MLKEM768 when post-quantum TLS is used. A CloudWatch Logs metric filter on the organization trail's log group with an alarm reports noncompliant calls from every account within minutes, and the events identify the calling principal."
    fr: "CloudTrail enregistre les détails TLS de chaque appel AWS KMS, et le champ keyExchange indique un algorithme hybride comme X25519MLKEM768 lorsque le TLS post-quantique est utilisé. Un filtre de métriques CloudWatch Logs sur le groupe de journaux du journal de suivi d'organisation, associé à une alarme, signale en quelques minutes les appels non conformes de tous les comptes, et les événements identifient le principal appelant."
  options:
    a:
      en: "Flow logs record IP-level metadata of network flows, not the TLS handshake, so they cannot show which key exchange was used."
      fr: "Les journaux de flux enregistrent des métadonnées IP des flux réseau, pas la négociation TLS : ils ne peuvent pas indiquer l'échange de clés utilisé."
    b:
      en: "AWS Config evaluates resource configurations; the TLS key exchange of an API call is not a property of the KMS key resource."
      fr: "AWS Config évalue des configurations de ressources ; l'échange de clés TLS d'un appel d'API n'est pas une propriété de la ressource clé KMS."
    c:
      en: "TLS inspection re-terminates the sessions, adds heavy infrastructure, and misses calls that do not pass through the firewall, such as calls from the data center over the internet."
      fr: "L'inspection TLS retermine les sessions, ajoute une infrastructure lourde et ne voit pas les appels qui ne traversent pas le pare-feu, comme ceux passés depuis le centre de données via Internet."
references:
  - title: Using hybrid post-quantum TLS with AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/pqtls.html
