id: sapc03-2b-ct-ou-region-deny
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses AWS Control Tower with eu-west-1 as the home Region, and it governs eu-west-1, eu-central-1, and us-east-1. Accounts in the EU-Regulated OU must operate only in eu-west-1 and eu-central-1. Accounts in the Global-Digital OU must operate in all three Regions. A security role named SecurityAudit in every account must be able to read resources in any Region. The company wants the Region restrictions to be managed and reported by Control Tower.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS Control Tower avec eu-west-1 comme Région d'origine et gouverne eu-west-1, eu-central-1 et us-east-1. Les comptes de l'OU EU-Regulated ne doivent fonctionner que dans eu-west-1 et eu-central-1. Les comptes de l'OU Global-Digital doivent fonctionner dans les trois Régions. Un rôle de sécurité nommé SecurityAudit, présent dans chaque compte, doit pouvoir lire les ressources de n'importe quelle Région. L'entreprise veut que les restrictions de Région soient gérées et signalées par Control Tower.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable the landing zone Region deny control with eu-west-1 and eu-central-1, and exclude the Global-Digital OU from the control in the landing zone settings.", fr: "Activer le contrôle de refus de Région de la zone d'atterrissage avec eu-west-1 et eu-central-1, et exclure l'OU Global-Digital du contrôle dans les paramètres de la zone d'atterrissage." } }
    - { id: b, text: { en: "Enable the OU-level Region deny control on each OU with its own AllowedRegions values, and add the SecurityAudit role to the ExemptedPrincipalArns parameter.", fr: "Activer le contrôle de refus de Région au niveau de l'OU sur chaque OU avec ses propres valeurs AllowedRegions, et ajouter le rôle SecurityAudit au paramètre ExemptedPrincipalArns." } }
    - { id: c, text: { en: "Enable the landing zone Region deny control with the three Regions, and add an AWS Config rule to the EU-Regulated OU that reports resources created in us-east-1.", fr: "Activer le contrôle de refus de Région de la zone d'atterrissage avec les trois Régions, et ajouter à l'OU EU-Regulated une règle AWS Config qui signale les ressources créées dans us-east-1." } }
    - { id: d, text: { en: "Stop governing eu-central-1 and us-east-1 in the landing zone, and attach customer managed SCPs to the OUs that deny the other Regions except for SecurityAudit.", fr: "Cesser de gouverner eu-central-1 et us-east-1 dans la zone d'atterrissage, et attacher aux OU des SCP gérées par le client qui refusent les autres Régions sauf pour SecurityAudit." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The OU-level Region deny control (CT.MULTISERVICE.PV.1) is enabled per OU with a mandatory AllowedRegions parameter that must include the home Region, and optional ExemptedPrincipalArns and ExemptedActions parameters. It is an SCP-based preventive control owned by Control Tower, so each OU gets its own Regions and the SecurityAudit role stays exempt."
    fr: "Le contrôle de refus de Région au niveau de l'OU (CT.MULTISERVICE.PV.1) s'active par OU avec un paramètre obligatoire AllowedRegions, qui doit inclure la Région d'origine, et des paramètres facultatifs ExemptedPrincipalArns et ExemptedActions. C'est un contrôle préventif basé sur une SCP et géré par Control Tower : chaque OU obtient ses propres Régions et le rôle SecurityAudit reste exempté."
  options:
    a:
      en: "The landing zone Region deny control applies to the whole landing zone and cannot be configured for individual OUs."
      fr: "Le contrôle de refus de Région de la zone d'atterrissage s'applique à toute la zone d'atterrissage et ne peut pas être configuré pour des OU individuelles."
    c:
      en: "An AWS Config rule only detects resources after they are created; it does not prevent the EU-Regulated accounts from using us-east-1."
      fr: "Une règle AWS Config ne détecte les ressources qu'après leur création ; elle n'empêche pas les comptes EU-Regulated d'utiliser us-east-1."
    d:
      en: "Ungoverned Regions lose Control Tower governance, and customer managed SCPs are not controls that Control Tower manages and reports."
      fr: "Les Régions non gouvernées perdent la gouvernance de Control Tower, et des SCP gérées par le client ne sont pas des contrôles gérés et signalés par Control Tower."
references:
  - title: Region deny control applied to the OU
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/ou-region-deny.html
  - title: Configure the Region deny control
    url: https://docs.aws.amazon.com/controltower/latest/userguide/region-deny.html
