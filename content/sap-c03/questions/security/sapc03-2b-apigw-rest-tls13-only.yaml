id: sapc03-2b-apigw-rest-tls13-only
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany exposes a partner API through an Amazon API Gateway HTTP API with a Regional custom domain name in eu-central-1. A new regulation requires that the API endpoint reject every connection that uses TLS 1.2 or earlier and accept only TLS 1.3. A data residency rule requires that TLS for this API be terminated only in eu-central-1, so no edge service may terminate it in other locations. The team can change the API Gateway configuration and the API type, but it does not want to run its own proxies.

    Which solution will meet these requirements?
  fr: |
    AnyCompany expose une API partenaire via une API HTTP Amazon API Gateway dotée d'un nom de domaine personnalisé Régional dans eu-central-1. Une nouvelle réglementation exige que le point de terminaison de l'API refuse toute connexion en TLS 1.2 ou antérieur et n'accepte que TLS 1.3. Une règle de résidence des données exige que TLS pour cette API soit terminé uniquement dans eu-central-1 : aucun service en périphérie ne doit le terminer ailleurs. L'équipe peut modifier la configuration d'API Gateway et le type d'API, mais elle ne veut pas exploiter ses propres proxys.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Change the security policy of the HTTP API custom domain name to SecurityPolicy_TLS13_1_3_2025_09, and disable the default execute-api endpoint of the API.", fr: "Remplacer la politique de sécurité du nom de domaine personnalisé de l'API HTTP par SecurityPolicy_TLS13_1_3_2025_09, et désactiver le point de terminaison execute-api par défaut de l'API." } }
    - { id: b, text: { en: "Recreate the API as a Regional REST API, and give the API and its Regional custom domain name the SecurityPolicy_TLS13_1_3_2025_09 security policy with an endpoint access mode.", fr: "Recréer l'API en tant qu'API REST Régionale, et attribuer à l'API et à son nom de domaine personnalisé Régional la politique de sécurité SecurityPolicy_TLS13_1_3_2025_09 avec un mode d'accès au point de terminaison." } }
    - { id: c, text: { en: "Put an Amazon CloudFront distribution with the TLSv1.3_2025 security policy in front of the HTTP API, and allow only CloudFront to call the API through a custom header.", fr: "Placer une distribution Amazon CloudFront avec la politique de sécurité TLSv1.3_2025 devant l'API HTTP, et n'autoriser que CloudFront à appeler l'API grâce à un en-tête personnalisé." } }
    - { id: d, text: { en: "Configure mutual TLS on the HTTP API custom domain name with a truststore in Amazon S3 so that only clients with TLS 1.3 client certificates can connect to it.", fr: "Configurer le TLS mutuel sur le nom de domaine personnalisé de l'API HTTP avec un magasin d'approbations dans Amazon S3, afin que seuls les clients dotés de certificats clients TLS 1.3 puissent s'y connecter." } }
answer: { optionId: b }
explanation:
  correct:
    en: "You can choose a security policy only for REST APIs; HTTP and WebSocket APIs support only TLS_1_2. A Regional REST API and its Regional custom domain name support the enhanced policy SecurityPolicy_TLS13_1_3_2025_09, which accepts only TLS 1.3 and requires an endpoint access mode (BASIC or STRICT), and TLS stays terminated in eu-central-1."
    fr: "Le choix d'une politique de sécurité n'est possible que pour les API REST ; les API HTTP et WebSocket ne prennent en charge que TLS_1_2. Une API REST Régionale et son nom de domaine personnalisé Régional prennent en charge la politique améliorée SecurityPolicy_TLS13_1_3_2025_09, qui n'accepte que TLS 1.3 et exige un mode d'accès au point de terminaison (BASIC ou STRICT), et TLS reste terminé dans eu-central-1."
  options:
    a:
      en: "HTTP APIs support only the TLS_1_2 security policy, so the enhanced TLS 1.3 policy cannot be applied to them."
      fr: "Les API HTTP ne prennent en charge que la politique de sécurité TLS_1_2 : la politique améliorée TLS 1.3 ne peut pas leur être appliquée."
    c:
      en: "CloudFront terminates viewer TLS at edge locations around the world, which breaks the rule that TLS is terminated only in eu-central-1."
      fr: "CloudFront termine le TLS des clients dans des emplacements périphériques du monde entier, ce qui enfreint la règle selon laquelle TLS n'est terminé que dans eu-central-1."
    d:
      en: "Client certificates authenticate callers; they are not tied to a TLS version, so mutual TLS does not reject TLS 1.2 connections."
      fr: "Les certificats clients authentifient les appelants ; ils ne sont pas liés à une version de TLS, donc le TLS mutuel ne refuse pas les connexions TLS 1.2."
references:
  - title: Security policies for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-security-policies.html
  - title: Supported security policies
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-security-policies-list.html
