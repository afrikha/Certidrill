id: sapc03-2c-region-deny-scp
objective: "2.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A Swiss wealth management company has 35 member accounts in AWS Organizations and does not use AWS Control Tower. A data residency policy requires that all workloads and data in the member accounts be deployed only in eu-central-2 (Zurich). Administrators must still be able to use global services such as IAM, AWS Organizations, and AWS Support. The policy must be enforced preventively for all principals in all member accounts, including accounts created later, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une société suisse de gestion de patrimoine possède 35 comptes membres dans AWS Organizations et n'utilise pas AWS Control Tower. Une politique de résidence des données exige que toutes les charges de travail et données des comptes membres soient déployées uniquement dans eu-central-2 (Zurich). Les administrateurs doivent toujours pouvoir utiliser des services globaux comme IAM, AWS Organizations et AWS Support. La politique doit être appliquée de manière préventive à tous les principaux de tous les comptes membres, y compris des comptes créés ultérieurement, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach to the organization root an SCP that denies all actions, except those of the exempted global services, when aws:RequestedRegion is not eu-central-2."
        fr: "Attacher à la racine de l'organisation une SCP qui refuse toutes les actions, sauf celles des services globaux exemptés, lorsque aws:RequestedRegion n'est pas eu-central-2."
    - id: b
      text:
        en: "Attach an IAM policy to every role and user in the member accounts that denies all actions when aws:RequestedRegion is not eu-central-2."
        fr: "Attacher à chaque rôle et utilisateur des comptes membres une politique IAM qui refuse toutes les actions lorsque aws:RequestedRegion n'est pas eu-central-2."
    - id: c
      text:
        en: "Deploy an AWS Config rule in every account and Region that detects resources created outside eu-central-2 and deletes them with automatic remediation."
        fr: "Déployer dans chaque compte et chaque Région une règle AWS Config qui détecte les ressources créées hors d'eu-central-2 et les supprime par correction automatique."
    - id: d
      text:
        en: "Disable every AWS Region other than eu-central-2 in the account settings of each member account, including the Regions that are enabled by default."
        fr: "Désactiver dans les paramètres de chaque compte membre toutes les Régions AWS autres qu'eu-central-2, y compris les Régions activées par défaut."
answer: { optionId: a }
explanation:
  correct:
    en: "A Region deny SCP uses the aws:RequestedRegion condition key to deny requests to other Regions, and it exempts global services such as IAM and AWS Organizations, whose actions would otherwise be blocked. Attached to the root, it applies to every principal in every member account, including accounts created later, and no account administrator can remove it."
    fr: "Une SCP de refus de Région utilise la clé de condition aws:RequestedRegion pour refuser les requêtes vers les autres Régions, et elle exempte les services globaux comme IAM et AWS Organizations, dont les actions seraient sinon bloquées. Attachée à la racine, elle s'applique à chaque principal de chaque compte membre, y compris des comptes créés ultérieurement, et aucun administrateur de compte ne peut la retirer."
  options:
    b:
      en: "Identity policies must be attached to every principal, including new ones, and account administrators can remove them or create principals without them."
      fr: "Les politiques d'identité doivent être attachées à chaque principal, y compris aux nouveaux, et les administrateurs des comptes peuvent les retirer ou créer des principaux sans elles."
    c:
      en: "A detective rule acts after resources and data already exist in another Region, so it does not enforce the policy preventively."
      fr: "Une règle de détection agit après que les ressources et les données existent déjà dans une autre Région : elle n'applique pas la politique de manière préventive."
    d:
      en: "Only opt-in Regions can be disabled; the Regions that are enabled by default cannot be turned off for an account."
      fr: "Seules les Régions à adhésion (opt-in) peuvent être désactivées ; les Régions activées par défaut ne peuvent pas être désactivées pour un compte."
references:
  - title: Controls that enhance data residency protection
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/data-residency-controls.html
  - title: Configure the Region deny control
    url: https://docs.aws.amazon.com/controltower/latest/userguide/region-deny.html
