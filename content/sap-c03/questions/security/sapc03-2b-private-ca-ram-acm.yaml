id: sapc03-2b-private-ca-ram-acm
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 45 workload accounts in AWS Organizations, grouped in OUs by environment. Each workload exposes internal APIs through internal Application Load Balancers that use host names in the private domain corp.anycompany.internal, which is not resolvable in public DNS. A central PKI account already runs an AWS Private CA subordinate CA in general-purpose mode. Application teams must obtain TLS certificates for their load balancers without generating or handling private keys. The certificates must renew automatically before they expire. The security team does not want to operate additional certificate authorities in the workload accounts.

    Which combination of steps will meet these requirements with the LEAST operational overhead? (Choose two.)
  fr: |
    AnyCompany dispose de 45 comptes de charge de travail dans AWS Organizations, regroupés en unités d'organisation (OU) par environnement. Chaque charge de travail expose des API internes via des Application Load Balancers internes qui utilisent des noms d'hôte du domaine privé corp.anycompany.internal, qui n'est pas résolu dans le DNS public. Un compte PKI central exécute déjà une CA subordonnée AWS Private CA en mode général (general-purpose). Les équipes applicatives doivent obtenir des certificats TLS pour leurs équilibreurs de charge sans générer ni manipuler de clés privées. Les certificats doivent être renouvelés automatiquement avant leur expiration. L'équipe de sécurité ne veut pas exploiter d'autorités de certification supplémentaires dans les comptes de charge de travail.

    Quelle combinaison d'étapes répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Share the subordinate CA with the organization in AWS RAM, with resource sharing enabled for AWS Organizations, so that the workload accounts can use it without invitations.", fr: "Partager la CA subordonnée avec l'organisation dans AWS RAM, avec le partage de ressources activé pour AWS Organizations, afin que les comptes de charge de travail puissent l'utiliser sans invitation." } }
    - { id: b, text: { en: "In each workload account, request private certificates signed by the shared CA through ACM, and associate them with the HTTPS listeners of the load balancers.", fr: "Dans chaque compte de charge de travail, demander via ACM des certificats privés signés par la CA partagée, et les associer aux écouteurs HTTPS des équilibreurs de charge." } }
    - { id: c, text: { en: "In each workload account, call the AWS Private CA IssueCertificate API with a CSR generated on an administrator workstation, and import the certificate into ACM.", fr: "Dans chaque compte de charge de travail, appeler l'API AWS Private CA IssueCertificate avec une CSR générée sur un poste d'administrateur, et importer le certificat dans ACM." } }
    - { id: d, text: { en: "Create a subordinate CA in short-lived certificate mode in each workload account, and issue the load balancer certificates from it through ACM.", fr: "Créer dans chaque compte de charge de travail une CA subordonnée en mode certificats de courte durée (short-lived), et émettre à partir d'elle les certificats des équilibreurs de charge via ACM." } }
    - { id: e, text: { en: "Request public ACM certificates with DNS validation for the corp.anycompany.internal host names, and associate them with the load balancers.", fr: "Demander des certificats ACM publics avec validation DNS pour les noms d'hôte corp.anycompany.internal, et les associer aux équilibreurs de charge." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Sharing the CA through AWS RAM attaches the required resource-based policy automatically, and sharing with the organization needs no invitations. A certificate requested with the ACM RequestCertificate action is a managed certificate: ACM keeps the private key, installs it on integrated services such as Elastic Load Balancing, and renews it through its service-linked role."
    fr: "Le partage de la CA via AWS RAM attache automatiquement la politique basée sur les ressources nécessaire, et le partage avec l'organisation ne requiert aucune invitation. Un certificat demandé avec l'action ACM RequestCertificate est un certificat géré : ACM conserve la clé privée, l'installe sur les services intégrés comme Elastic Load Balancing et le renouvelle grâce à son rôle lié à un service."
  options:
    c:
      en: "IssueCertificate returns an unmanaged certificate that is not renewed automatically, and the teams would have to generate and handle the private keys themselves."
      fr: "IssueCertificate renvoie un certificat non géré qui n'est pas renouvelé automatiquement, et les équipes devraient générer et manipuler elles-mêmes les clés privées."
    d:
      en: "This adds a CA in every workload account, which the security team refuses, and ACM cannot issue certificates signed by a CA in short-lived certificate mode."
      fr: "Cette option ajoute une CA dans chaque compte de charge de travail, ce que l'équipe de sécurité refuse, et ACM ne peut pas émettre de certificats signés par une CA en mode certificats de courte durée."
    e:
      en: "A public certificate requires validation of the domain in public DNS, which is impossible for a private domain that public DNS does not resolve."
      fr: "Un certificat public exige la validation du domaine dans le DNS public, ce qui est impossible pour un domaine privé que le DNS public ne résout pas."
references:
  - title: Attach a policy for cross-account access
    url: https://docs.aws.amazon.com/privateca/latest/userguide/pca-ram.html
  - title: Understand AWS Private CA CA modes
    url: https://docs.aws.amazon.com/privateca/latest/userguide/short-lived-certificates.html
