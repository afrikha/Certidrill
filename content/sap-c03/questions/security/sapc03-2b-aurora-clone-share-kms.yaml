id: sapc03-2b-aurora-clone-share-kms
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany's production account runs a 20 TB Aurora PostgreSQL DB cluster that is encrypted with a customer managed KMS key. Each night, a data science account in the same organization needs a full, writable copy of the database for a few hours of experiments. Today, the team copies a snapshot to the data science account and restores it, which takes most of the night and doubles the storage cost. The company wants the copy to be available within minutes with the LEAST additional storage.

    Which solution will meet these requirements?
  fr: |
    Le compte de production d'AnyCompany exécute un cluster de bases de données Aurora PostgreSQL de 20 To chiffré avec une clé KMS gérée par le client. Chaque nuit, un compte de science des données de la même organisation a besoin d'une copie complète et modifiable de la base pour quelques heures d'expériences. Aujourd'hui, l'équipe copie un instantané vers le compte de science des données et le restaure, ce qui prend la majeure partie de la nuit et double le coût de stockage. L'entreprise veut que la copie soit disponible en quelques minutes avec le MOINS de stockage supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Share the cluster with the data science account through AWS RAM, have that account create a clone of the shared cluster, and encrypt the clone with its own KMS key.", fr: "Partager le cluster avec le compte de science des données via AWS RAM, faire créer par ce compte un clone du cluster partagé, et chiffrer le clone avec sa propre clé KMS." } }
    - { id: b, text: { en: "Share the cluster with the data science account through AWS RAM, allow that account to use the customer managed key in its key policy, and have the account create a clone.", fr: "Partager le cluster avec le compte de science des données via AWS RAM, autoriser ce compte à utiliser la clé gérée par le client dans sa politique de clé, et faire créer un clone par ce compte." } }
    - { id: c, text: { en: "Create an Aurora read replica of the cluster in the data science account, and promote the replica to a standalone cluster every night before the experiments.", fr: "Créer un réplica en lecture Aurora du cluster dans le compte de science des données, et promouvoir le réplica en cluster autonome chaque nuit avant les expériences." } }
    - { id: d, text: { en: "Share an automated snapshot of the cluster and the KMS key with the data science account, and restore the snapshot into a new cluster every night.", fr: "Partager un instantané automatique du cluster et la clé KMS avec le compte de science des données, et restaurer l'instantané dans un nouveau cluster chaque nuit." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Aurora DB clusters can be shared through AWS RAM so that other accounts clone them, and a clone uses copy-on-write, so it is available quickly and consumes little additional storage at first. When the cluster is encrypted, the owner must also share the customer managed KMS key by adding the other account to the key policy."
    fr: "Les clusters de bases de données Aurora peuvent être partagés via AWS RAM pour que d'autres comptes les clonent, et un clone utilise la copie sur écriture (copy-on-write) : il est disponible rapidement et consomme peu de stockage supplémentaire au départ. Lorsque le cluster est chiffré, le propriétaire doit aussi partager la clé KMS gérée par le client en ajoutant l'autre compte à la politique de clé."
  options:
    a:
      en: "The clone may use the cloning account's key, but the owner must still share the cluster's KMS key; without it, the encrypted cluster cannot be cloned."
      fr: "Le clone peut utiliser la clé du compte qui clone, mais le propriétaire doit tout de même partager la clé KMS du cluster ; sans elle, le cluster chiffré ne peut pas être cloné."
    c:
      en: "Aurora replicas are created in the same account as the cluster, and a promoted copy would have to be recreated and fully stored every night."
      fr: "Les réplicas Aurora se créent dans le même compte que le cluster, et une copie promue devrait être recréée et entièrement stockée chaque nuit."
    d:
      en: "Restoring a 20 TB snapshot every night is the slow process that takes most of the night and doubles storage."
      fr: "Restaurer chaque nuit un instantané de 20 To est précisément le processus lent qui occupe la majeure partie de la nuit et double le stockage."
references:
  - title: Cross-account cloning with AWS RAM and Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Clone.Cross-Account.html
