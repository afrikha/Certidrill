id: sapc03-2a-data-perimeter-three-controls
objective: "2.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany, a financial services company, has 250 member accounts in AWS Organizations with all features enabled. The security team is building a data perimeter with three objectives. First, only identities of AnyCompany's organization may access Amazon S3 buckets, AWS KMS keys and Amazon SQS queues in the member accounts, even when a resource policy grants access to another account, while AWS service principals must keep working. Second, IAM principals of the organization must be able to access only S3 buckets that belong to the organization, except AWS-owned resources that the workloads need. Third, S3 requests made by IAM principals of the organization must come only from the company's VPCs or its corporate IP address ranges.

    Which combination of controls will meet these requirements? (Choose three.)
  fr: |
    AnyCompany, une entreprise de services financiers, possède 250 comptes membres dans AWS Organizations avec toutes les fonctionnalités activées. L'équipe de sécurité construit un périmètre de données avec trois objectifs. Premièrement, seules les identités de l'organisation d'AnyCompany peuvent accéder aux compartiments (buckets) Amazon S3, aux clés AWS KMS et aux files d'attente Amazon SQS des comptes membres, même lorsqu'une politique de ressource accorde l'accès à un autre compte, et les principaux de service AWS doivent continuer de fonctionner. Deuxièmement, les principaux IAM de l'organisation ne doivent pouvoir accéder qu'aux compartiments S3 appartenant à l'organisation, à l'exception des ressources détenues par AWS dont les charges de travail ont besoin. Troisièmement, les requêtes S3 des principaux IAM de l'organisation doivent provenir uniquement des VPC de l'entreprise ou de ses plages d'adresses IP d'entreprise.

    Quelle combinaison de contrôles répond à ces exigences ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - id: a
      text:
        en: "An SCP that denies S3, KMS and SQS actions when aws:PrincipalOrgID does not equal the organization ID."
        fr: "Une SCP qui refuse les actions S3, KMS et SQS lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation."
    - id: b
      text:
        en: "An RCP that denies S3, KMS and SQS actions when aws:PrincipalOrgID does not equal the organization ID, except when aws:PrincipalIsAWSService is true."
        fr: "Une RCP qui refuse les actions S3, KMS et SQS lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation, sauf lorsque aws:PrincipalIsAWSService vaut true."
    - id: c
      text:
        en: "An SCP that denies S3 actions when aws:ResourceOrgID does not equal the organization ID, with exceptions for the AWS-owned resources that the workloads need."
        fr: "Une SCP qui refuse les actions S3 lorsque aws:ResourceOrgID n'est pas égal à l'ID de l'organisation, avec des exceptions pour les ressources détenues par AWS dont les charges de travail ont besoin."
    - id: d
      text:
        en: "An RCP that denies S3 actions when aws:ResourceOrgID does not equal the organization ID, with exceptions for the AWS-owned resources that the workloads need."
        fr: "Une RCP qui refuse les actions S3 lorsque aws:ResourceOrgID n'est pas égal à l'ID de l'organisation, avec des exceptions pour les ressources détenues par AWS dont les charges de travail ont besoin."
    - id: e
      text:
        en: "VPC endpoint policies on every S3 gateway endpoint that allow requests only from principals whose aws:PrincipalOrgID equals the organization ID."
        fr: "Des politiques de point de terminaison de VPC sur chaque point de terminaison de passerelle S3 qui n'autorisent que les requêtes des principaux dont aws:PrincipalOrgID est égal à l'ID de l'organisation."
    - id: f
      text:
        en: "An SCP that denies S3 actions when the request comes neither from the corporate aws:SourceIp ranges nor from the company's aws:SourceVpc values, except when aws:ViaAWSService is true."
        fr: "Une SCP qui refuse les actions S3 lorsque la requête ne provient ni des plages aws:SourceIp de l'entreprise ni des valeurs aws:SourceVpc de l'entreprise, sauf lorsque aws:ViaAWSService vaut true."
answer: { optionIds: [ b, c, f ] }
explanation:
  correct:
    en: "Trusted identities on the organization's resources are enforced with an RCP on aws:PrincipalOrgID, because RCPs apply to every caller, including external principals, and aws:PrincipalIsAWSService exempts service principals. Trusted resources for the organization's principals are enforced with an SCP on aws:ResourceOrgID, and the expected network for those principals with an SCP on aws:SourceIp and aws:SourceVpc, where aws:ViaAWSService keeps requests that services make on the principals' behalf working."
    fr: "Les identités de confiance sur les ressources de l'organisation s'appliquent avec une RCP sur aws:PrincipalOrgID, car les RCP s'appliquent à tous les appelants, y compris les principaux externes, et aws:PrincipalIsAWSService exempte les principaux de service. Les ressources de confiance pour les principaux de l'organisation s'appliquent avec une SCP sur aws:ResourceOrgID, et le réseau attendu pour ces principaux avec une SCP sur aws:SourceIp et aws:SourceVpc, où aws:ViaAWSService préserve les requêtes faites par les services pour le compte des principaux."
  options:
    a:
      en: "SCPs restrict only the principals of the member accounts, so they cannot stop an external principal from using a resource policy that grants it access."
      fr: "Les SCP ne restreignent que les principaux des comptes membres : elles ne peuvent pas empêcher un principal externe d'utiliser une politique de ressource qui lui accorde l'accès."
    d:
      en: "An RCP applies to the organization's own resources, so it cannot stop the organization's principals from writing to a bucket in another account."
      fr: "Une RCP s'applique aux ressources de l'organisation elle-même : elle ne peut pas empêcher les principaux de l'organisation d'écrire dans un compartiment d'un autre compte."
    e:
      en: "An endpoint policy affects only traffic through that endpoint, so it neither protects resources from external callers on other networks nor restricts the network of the organization's principals."
      fr: "Une politique de point de terminaison n'affecte que le trafic qui passe par ce point de terminaison : elle ne protège pas les ressources contre des appelants externes sur d'autres réseaux et ne restreint pas le réseau des principaux de l'organisation."
references:
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
