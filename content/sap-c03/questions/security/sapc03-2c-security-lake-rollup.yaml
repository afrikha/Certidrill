id: sapc03-2c-security-lake-rollup
objective: "2.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A global retailer runs workloads in eu-central-1, eu-west-1, ap-southeast-2, and us-east-1 across 140 accounts in AWS Organizations. The security team wants to centralize CloudTrail management events, VPC Flow Logs, and AWS Security Hub CSPM findings in a security account and to query them with Amazon Athena. The company's data residency rules state that security data generated in EU Regions must stay in the EU and that data generated in ap-southeast-2 must stay in Australia. US data can be stored in any US Region. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un distributeur mondial exécute ses charges de travail dans eu-central-1, eu-west-1, ap-southeast-2 et us-east-1, dans 140 comptes d'AWS Organizations. L'équipe de sécurité veut centraliser les événements de gestion CloudTrail, les journaux de flux VPC et les résultats AWS Security Hub CSPM dans un compte de sécurité et les interroger avec Amazon Athena. Les règles de résidence des données de l'entreprise indiquent que les données de sécurité générées dans les Régions de l'UE doivent rester dans l'UE et que les données générées dans ap-southeast-2 doivent rester en Australie. Les données américaines peuvent être stockées dans n'importe quelle Région des États-Unis. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an organization trail and VPC flow logs that deliver to one S3 bucket in us-east-1, export Security Hub CSPM findings to the same bucket, and query everything with Athena in us-east-1."
        fr: "Créer un journal de suivi d'organisation et des journaux de flux VPC qui livrent dans un seul compartiment S3 d'us-east-1, exporter les résultats Security Hub CSPM dans le même compartiment, et tout interroger avec Athena dans us-east-1."
    - id: b
      text:
        en: "Enable Amazon Security Lake from a delegated administrator with these sources in all four Regions, roll up eu-central-1 into eu-west-1, and keep ap-southeast-2 and us-east-1 as separate Regions."
        fr: "Activer Amazon Security Lake depuis un administrateur délégué avec ces sources dans les quatre Régions, regrouper eu-central-1 dans eu-west-1, et conserver ap-southeast-2 et us-east-1 comme Régions séparées."
    - id: c
      text:
        en: "Enable Amazon Security Lake from a delegated administrator with these sources in all four Regions, and configure us-east-1 as the rollup Region for the three other Regions."
        fr: "Activer Amazon Security Lake depuis un administrateur délégué avec ces sources dans les quatre Régions, et configurer us-east-1 comme Région de regroupement pour les trois autres Régions."
    - id: d
      text:
        en: "Create a CloudWatch Logs centralization rule for all four source Regions with the security account as destination, eu-west-1 as destination Region, and us-east-1 as backup Region."
        fr: "Créer une règle de centralisation CloudWatch Logs pour les quatre Régions sources avec le compte de sécurité comme destination, eu-west-1 comme Région de destination et us-east-1 comme Région de sauvegarde."
answer: { optionId: b }
explanation:
  correct:
    en: "Security Lake collects CloudTrail management events, VPC Flow Logs and Security Hub CSPM findings natively, normalizes them to OCSF in S3 buckets that the company owns, and exposes them through Lake Formation tables for Athena. Rollup Regions consolidate data from contributing Regions, which lets the company group the EU Regions in an EU rollup Region while ap-southeast-2 and us-east-1 keep their data in place."
    fr: "Security Lake collecte nativement les événements de gestion CloudTrail, les journaux de flux VPC et les résultats Security Hub CSPM, les normalise au format OCSF dans des compartiments S3 détenus par l'entreprise et les expose par des tables Lake Formation pour Athena. Les Régions de regroupement consolident les données des Régions contributrices, ce qui permet de regrouper les Régions de l'UE dans une Région de regroupement de l'UE tandis qu'ap-southeast-2 et us-east-1 conservent leurs données sur place."
  options:
    a:
      en: "A single bucket in us-east-1 moves EU and Australian security data to the United States, and the findings export needs a custom pipeline."
      fr: "Un compartiment unique dans us-east-1 transfère les données de sécurité de l'UE et de l'Australie vers les États-Unis, et l'export des résultats nécessite un pipeline personnalisé."
    c:
      en: "Rolling up all Regions into us-east-1 copies EU and Australian data to the United States, which violates the residency rules."
      fr: "Regrouper toutes les Régions dans us-east-1 copie les données de l'UE et de l'Australie vers les États-Unis, ce qui viole les règles de résidence."
    d:
      en: "This rule copies Australian and US logs to eu-west-1 and backs up EU logs in us-east-1, and Security Hub CSPM findings are not CloudWatch Logs data."
      fr: "Cette règle copie les journaux australiens et américains vers eu-west-1 et sauvegarde les journaux de l'UE dans us-east-1, et les résultats Security Hub CSPM ne sont pas des données CloudWatch Logs."
references:
  - title: What is Amazon Security Lake?
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html
