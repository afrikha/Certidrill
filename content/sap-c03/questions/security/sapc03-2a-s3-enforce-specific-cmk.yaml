id: sapc03-2a-s3-enforce-specific-cmk
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany stores regulated documents in an Amazon S3 bucket. Every new object must be encrypted with SSE-KMS by using one specific customer managed key, named key A, in the same account and Region. Several client applications upload objects without any encryption headers, and those uploads must keep working and use key A. Other clients send an x-amz-server-side-encryption-aws-kms-key-id header that names a different KMS key; these requests must be rejected. The company also wants to reduce the number of requests that Amazon S3 sends to AWS KMS.

    Which solution will meet these requirements?
  fr: |
    AnyCompany stocke des documents réglementés dans un compartiment (bucket) Amazon S3. Chaque nouvel objet doit être chiffré avec SSE-KMS à l'aide d'une clé gérée par le client précise, nommée clé A, dans le même compte et la même Région. Plusieurs applications clientes chargent des objets sans aucun en-tête de chiffrement, et ces chargements doivent continuer de fonctionner et utiliser la clé A. D'autres clients envoient un en-tête x-amz-server-side-encryption-aws-kms-key-id qui désigne une autre clé KMS ; ces requêtes doivent être rejetées. L'entreprise veut aussi réduire le nombre de requêtes qu'Amazon S3 envoie à AWS KMS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set default encryption to SSE-KMS with key A and S3 Bucket Keys enabled, and add a bucket policy that denies s3:PutObject when the request names a KMS key ID other than key A."
        fr: "Définir le chiffrement par défaut sur SSE-KMS avec la clé A et les S3 Bucket Keys activées, et ajouter une politique de compartiment qui refuse s3:PutObject lorsque la requête désigne un ID de clé KMS autre que la clé A."
    - id: b
      text:
        en: "Set default encryption to SSE-KMS with key A and S3 Bucket Keys enabled, and rely on the default encryption setting to override the key named in each request."
        fr: "Définir le chiffrement par défaut sur SSE-KMS avec la clé A et les S3 Bucket Keys activées, et compter sur le paramètre de chiffrement par défaut pour remplacer la clé désignée dans chaque requête."
    - id: c
      text:
        en: "Set default encryption to SSE-S3, and run a daily S3 Batch Operations job that copies every new object in place with SSE-KMS and key A."
        fr: "Définir le chiffrement par défaut sur SSE-S3, et exécuter chaque jour une tâche S3 Batch Operations qui copie chaque nouvel objet sur place avec SSE-KMS et la clé A."
    - id: d
      text:
        en: "Set default encryption to SSE-KMS with key A, and add a bucket policy that denies s3:PutObject when the request has no x-amz-server-side-encryption header."
        fr: "Définir le chiffrement par défaut sur SSE-KMS avec la clé A, et ajouter une politique de compartiment qui refuse s3:PutObject lorsque la requête ne contient pas d'en-tête x-amz-server-side-encryption."
answer: { optionId: a }
explanation:
  correct:
    en: "Default encryption applies key A to uploads that carry no encryption headers, but a request can specify another encryption setting, so a bucket policy condition on s3:x-amz-server-side-encryption-aws-kms-key-id is needed to reject other keys. S3 Bucket Keys reduce the number of requests from Amazon S3 to AWS KMS for SSE-KMS objects."
    fr: "Le chiffrement par défaut applique la clé A aux chargements qui ne portent aucun en-tête de chiffrement, mais une requête peut indiquer un autre paramètre de chiffrement : une condition de politique de compartiment sur s3:x-amz-server-side-encryption-aws-kms-key-id est nécessaire pour rejeter les autres clés. Les S3 Bucket Keys réduisent le nombre de requêtes d'Amazon S3 vers AWS KMS pour les objets SSE-KMS."
  options:
    b:
      en: "Encryption settings in a PUT request take precedence over the bucket default, so objects could still be encrypted with another key."
      fr: "Les paramètres de chiffrement d'une requête PUT l'emportent sur le paramètre par défaut du compartiment : des objets pourraient toujours être chiffrés avec une autre clé."
    c:
      en: "Objects stay encrypted with SSE-S3 until the next job runs, and copying every object adds cost and does not reject requests that name another key."
      fr: "Les objets restent chiffrés avec SSE-S3 jusqu'à la tâche suivante, et copier chaque objet ajoute des coûts sans rejeter les requêtes qui désignent une autre clé."
    d:
      en: "Denying requests without encryption headers breaks the clients that upload without headers, and it does not stop requests that name another key."
      fr: "Refuser les requêtes sans en-tête de chiffrement casse les clients qui chargent sans en-tête, et n'empêche pas les requêtes qui désignent une autre clé."
references:
  - title: Specifying server-side encryption with AWS KMS (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/specifying-kms-encryption.html
