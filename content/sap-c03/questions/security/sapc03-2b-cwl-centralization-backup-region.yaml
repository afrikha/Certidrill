id: sapc03-2b-cwl-centralization-backup-region
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany runs applications in 60 accounts in AWS Organizations across three Regions. Application logs and VPC Resolver query logs are written to CloudWatch Logs in each account. The security operations team needs a copy of all new log data in a central log account in eu-west-1, plus a second copy in eu-central-1 for resiliency. Accounts added to the organization later must be included automatically. The team wants to avoid building and operating delivery pipelines.

    Which solution will meet these requirements?
  fr: |
    AnyCompany exécute des applications dans 60 comptes d'AWS Organizations répartis sur trois Régions. Les journaux d'application et les journaux de requêtes VPC Resolver sont écrits dans CloudWatch Logs dans chaque compte. L'équipe des opérations de sécurité a besoin d'une copie de toutes les nouvelles données de journal dans un compte de journaux central dans eu-west-1, plus une seconde copie dans eu-central-1 pour la résilience. Les comptes ajoutés plus tard à l'organisation doivent être inclus automatiquement. L'équipe veut éviter de construire et d'exploiter des pipelines de livraison.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a CloudWatch Logs centralization rule for the entire organization with the log account as destination, eu-west-1 as primary Region, and eu-central-1 as backup Region.", fr: "Créer une règle de centralisation CloudWatch Logs pour toute l'organisation avec le compte de journaux comme destination, eu-west-1 comme Région principale et eu-central-1 comme Région de secours." } }
    - { id: b, text: { en: "Set up CloudWatch cross-account observability with the log account as the monitoring account, and link all accounts in the organization to it as source accounts.", fr: "Configurer l'observabilité intercompte CloudWatch avec le compte de journaux comme compte de surveillance, et y lier tous les comptes de l'organisation en tant que comptes sources." } }
    - { id: c, text: { en: "Create subscription filters on every log group that send events to an Amazon Data Firehose stream in each account, and deliver the streams to S3 buckets in both Regions of the log account.", fr: "Créer sur chaque groupe de journaux des filtres d'abonnement qui envoient les événements vers un flux Amazon Data Firehose dans chaque compte, et livrer les flux vers des compartiments S3 dans les deux Régions du compte de journaux." } }
    - { id: d, text: { en: "Run a CloudWatch Logs export task in every account each night that copies the log groups to an S3 bucket in the log account, and replicate that bucket to eu-central-1.", fr: "Exécuter chaque nuit dans chaque compte une tâche d'exportation CloudWatch Logs qui copie les groupes de journaux vers un compartiment S3 du compte de journaux, et répliquer ce compartiment vers eu-central-1." } }
answer: { optionId: a }
explanation:
  correct:
    en: "CloudWatch Logs centralization rules, managed by the management account or a delegated administrator, replicate log data from selected accounts, OUs, or the entire organization and from selected Regions into a destination account. A rule has a primary destination Region and an optional backup Region for a second copy, and it processes the new log data that arrives after the rule is created."
    fr: "Les règles de centralisation CloudWatch Logs, gérées par le compte de gestion ou un administrateur délégué, répliquent les données de journal de comptes, d'OU ou de toute l'organisation, et de Régions choisies, vers un compte de destination. Une règle a une Région de destination principale et une Région de secours facultative pour une seconde copie, et elle traite les nouvelles données de journal arrivées après sa création."
  options:
    b:
      en: "Cross-account observability lets a monitoring account view and query the source accounts' data within a Region; it does not create the required copies in two Regions."
      fr: "L'observabilité intercompte permet à un compte de surveillance de consulter et d'interroger les données des comptes sources dans une Région ; elle ne crée pas les copies requises dans deux Régions."
    c:
      en: "Subscription filters and Firehose streams in every account are delivery pipelines that the team must build, scale, and maintain."
      fr: "Des filtres d'abonnement et des flux Firehose dans chaque compte sont des pipelines de livraison que l'équipe doit construire, dimensionner et maintenir."
    d:
      en: "Nightly export tasks must be scheduled and monitored in every account, and they deliver data only once a day."
      fr: "Les tâches d'exportation nocturnes doivent être planifiées et surveillées dans chaque compte, et elles ne livrent les données qu'une fois par jour."
references:
  - title: Cross-account cross-Region log centralization
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/CloudWatchLogs_Centralization.html
