id: sapc03-2d-guardrail-org-enforce
objective: "2.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 60 AWS accounts in AWS Organizations, and product teams in many of them call Amazon Bedrock models directly with the Converse and InvokeModel APIs in us-east-1 and eu-west-1. Each team has administrator access to its own accounts. A new compliance policy requires the same approved content filters, denied topics and sensitive information filters on every model invocation in every account, including accounts created later. Account teams must not be able to weaken, replace or remove these safeguards. The applications are owned by many teams, and the change must be made without modifying application code. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 60 comptes AWS dans AWS Organizations, et des équipes produit de nombre d'entre eux appellent directement des modèles Amazon Bedrock avec les API Converse et InvokeModel dans us-east-1 et eu-west-1. Chaque équipe a un accès administrateur à ses propres comptes. Une nouvelle politique de conformité exige les mêmes filtres de contenu, sujets refusés et filtres d'informations sensibles approuvés sur chaque appel de modèle dans chaque compte, y compris les comptes créés plus tard. Les équipes de compte ne doivent pas pouvoir affaiblir, remplacer ni supprimer ces protections. Les applications appartiennent à de nombreuses équipes, et le changement doit se faire sans modifier le code des applications. La solution doit avoir le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create the guardrail in a central account and attach an SCP to the root that denies bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream unless the bedrock:GuardrailIdentifier condition key matches the guardrail ARN and version.", fr: "Créer le guardrail dans un compte central et attacher à la racine une SCP qui refuse bedrock:InvokeModel et bedrock:InvokeModelWithResponseStream sauf si la clé de condition bedrock:GuardrailIdentifier correspond à l'ARN et à la version du guardrail." }
    - id: b
      text: { en: "Use AWS CloudFormation StackSets to deploy the guardrail into every account and Region, and enable account-level enforcement of that guardrail in each account with PutEnforcedGuardrailConfiguration.", fr: "Utiliser AWS CloudFormation StackSets pour déployer le guardrail dans chaque compte et chaque Région, et activer l'application au niveau du compte de ce guardrail dans chaque compte avec PutEnforcedGuardrailConfiguration." }
    - id: c
      text: { en: "Create the guardrail and a numeric version in the management account in both Regions, grant bedrock:ApplyGuardrail to the organization with a resource-based policy, and attach an Amazon Bedrock policy that references the version to the root.", fr: "Créer le guardrail et une version numérotée dans le compte de gestion dans les deux Régions, accorder bedrock:ApplyGuardrail à l'organisation par une politique basée sur les ressources, et attacher à la racine une politique Amazon Bedrock qui référence cette version." }
    - id: d
      text: { en: "Turn on model invocation logging in every account, and run a daily Amazon Athena query in the log archive account that reports invocations made without the guardrail so that each team can fix its application.", fr: "Activer la journalisation des appels de modèle dans chaque compte, et exécuter chaque jour dans le compte d'archivage des journaux une requête Amazon Athena qui signale les appels effectués sans le guardrail afin que chaque équipe corrige son application." }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon Bedrock policies in AWS Organizations apply a guardrail automatically to every Bedrock model invocation in the accounts under the attachment point, with no change to the calls. The policy references a numeric version of a guardrail in the management account, per Region, and member accounts need bedrock:ApplyGuardrail through a resource-based policy. Attached to the root, it covers new accounts, and member account administrators cannot modify it."
    fr: "Les politiques Amazon Bedrock d'AWS Organizations appliquent automatiquement un guardrail à chaque appel de modèle Bedrock dans les comptes situés sous le point d'attachement, sans modifier les appels. La politique référence une version numérotée d'un guardrail du compte de gestion, par Région, et les comptes membres ont besoin de bedrock:ApplyGuardrail par une politique basée sur les ressources. Attachée à la racine, elle couvre les nouveaux comptes, et les administrateurs des comptes membres ne peuvent pas la modifier."
  options:
    a:
      en: "The bedrock:GuardrailIdentifier condition only rejects requests that do not name the guardrail; every application would have to be changed to pass the guardrail ID, which the requirement forbids."
      fr: "La condition bedrock:GuardrailIdentifier ne fait que rejeter les requêtes qui ne nomment pas le guardrail ; chaque application devrait être modifiée pour transmettre l'identifiant du guardrail, ce que l'exigence interdit."
    b:
      en: "Account-level enforcement is configured inside each account, so an account administrator can change or remove it, and the guardrail lives in an account that the team controls."
      fr: "L'application au niveau du compte se configure dans chaque compte : un administrateur du compte peut la modifier ou la supprimer, et le guardrail se trouve dans un compte que l'équipe contrôle."
    d:
      en: "Log analysis only detects unprotected invocations a day after they ran, and fixing them means changing application code; nothing applies the guardrail to the calls."
      fr: "L'analyse des journaux ne détecte les appels non protégés qu'un jour après leur exécution, et les corriger impose de modifier le code des applications ; rien n'applique le guardrail aux appels."
references:
  - title: Apply cross-account safeguards with Amazon Bedrock Guardrails enforcements
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/guardrails-enforcements.html
  - title: Amazon Bedrock policies
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_bedrock.html
