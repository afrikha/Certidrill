id: sapc03-2a-verified-access-tcp-databases
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany's 40 database administrators connect to Amazon Aurora PostgreSQL clusters in private subnets through AWS Client VPN. They use their usual SQL clients on managed Windows and macOS laptops. The security team wants to remove network-level VPN access. Each connection must be authorized against the corporate OpenID Connect (OIDC) identity provider and the device posture of the laptop, access must be reevaluated continuously while the connection is open, and the clusters must stay private.

    Which solution will meet these requirements?
  fr: |
    Les 40 administrateurs de bases de données d'AnyCompany se connectent à des clusters Amazon Aurora PostgreSQL situés dans des sous-réseaux privés via AWS Client VPN. Ils utilisent leurs clients SQL habituels sur des ordinateurs portables Windows et macOS gérés. L'équipe de sécurité veut supprimer l'accès VPN au niveau réseau. Chaque connexion doit être autorisée selon le fournisseur d'identité OpenID Connect (OIDC) de l'entreprise et la posture de l'ordinateur, l'accès doit être réévalué en continu tant que la connexion est ouverte, et les clusters doivent rester privés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create AWS Verified Access RDS endpoints for the clusters with OIDC and device trust providers, and have the administrators use the Connectivity Client with their SQL clients."
        fr: "Créer des points de terminaison RDS AWS Verified Access pour les clusters avec des fournisseurs de confiance OIDC et d'appareil, et faire utiliser le Connectivity Client par les administrateurs avec leurs clients SQL."
    - id: b
      text:
        en: "Make the clusters publicly accessible, allow only the administrators' public IP addresses in the security groups, and require IAM database authentication for every connection."
        fr: "Rendre les clusters accessibles publiquement, n'autoriser que les adresses IP publiques des administrateurs dans les groupes de sécurité, et exiger l'authentification de base de données IAM pour chaque connexion."
    - id: c
      text:
        en: "Use AWS Systems Manager Session Manager port forwarding to the clusters through a managed instance in the VPC, with access granted through IAM Identity Center permission sets."
        fr: "Utiliser la redirection de port d'AWS Systems Manager Session Manager vers les clusters via une instance gérée du VPC, avec un accès accordé par des ensembles d'autorisations IAM Identity Center."
    - id: d
      text:
        en: "Place an Application Load Balancer in front of the clusters, and create AWS Verified Access load balancer endpoints that use HTTPS with OIDC and device trust providers."
        fr: "Placer un Application Load Balancer devant les clusters, et créer des points de terminaison d'équilibreur de charge AWS Verified Access qui utilisent HTTPS avec des fournisseurs de confiance OIDC et d'appareil."
answer: { optionId: a }
explanation:
  correct:
    en: "Verified Access supports non-HTTP applications, including Amazon RDS endpoints, through the Connectivity Client, which adds user identity and device context to the traffic. Access is authorized continuously while the client is connected, and the administrators use their own SQL clients with the DNS name that Verified Access provides, so the clusters stay private."
    fr: "Verified Access prend en charge les applications non HTTP, dont les points de terminaison Amazon RDS, grâce au Connectivity Client, qui ajoute l'identité de l'utilisateur et le contexte de l'appareil au trafic. L'accès est autorisé en continu tant que le client est connecté, et les administrateurs utilisent leurs propres clients SQL avec le nom DNS fourni par Verified Access : les clusters restent privés."
  options:
    b:
      en: "Public clusters violate the requirement to stay private, and IP rules check neither the corporate identity provider nor device posture."
      fr: "Des clusters publics enfreignent l'exigence de rester privés, et des règles d'adresses IP ne vérifient ni le fournisseur d'identité de l'entreprise ni la posture de l'appareil."
    c:
      en: "Session Manager removes the VPN but authorizes with IAM permissions only; it does not evaluate device posture from the corporate tools."
      fr: "Session Manager supprime le VPN mais n'autorise qu'avec des autorisations IAM ; il n'évalue pas la posture de l'appareil fournie par les outils de l'entreprise."
    d:
      en: "An Application Load Balancer handles HTTP and HTTPS, not the PostgreSQL protocol, so it cannot front the database clusters."
      fr: "Un Application Load Balancer traite HTTP et HTTPS, pas le protocole PostgreSQL : il ne peut pas être placé devant les clusters de bases de données."
references:
  - title: Connectivity Client for AWS Verified Access
    url: https://docs.aws.amazon.com/verified-access/latest/ug/connectivity-client.html
  - title: Verified Access endpoints
    url: https://docs.aws.amazon.com/verified-access/latest/ug/verified-access-endpoints.html
