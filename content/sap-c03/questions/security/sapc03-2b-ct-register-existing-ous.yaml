id: sapc03-2b-ct-register-existing-ous
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany set up AWS Control Tower in an existing organization in AWS Organizations. Three OUs that were created earlier with AWS Organizations contain 140 accounts that are not enrolled in Control Tower. None of these OUs contains more than 60 accounts. The company wants these accounts to be governed by the same preventive and detective controls that it already uses on similar OUs. The workloads in the accounts must keep running.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    AnyCompany a configuré AWS Control Tower dans une organisation AWS Organizations existante. Trois OU créées auparavant avec AWS Organizations contiennent 140 comptes qui ne sont pas inscrits dans Control Tower. Aucune de ces OU ne contient plus de 60 comptes. L'entreprise veut que ces comptes soient gouvernés par les mêmes contrôles préventifs et détectifs qu'elle utilise déjà sur des OU similaires. Les charges de travail des comptes doivent continuer de s'exécuter.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - { id: a, text: { en: "Create new OUs in Control Tower, and move each account into them one at a time so that Account Factory provisions it again.", fr: "Créer de nouvelles OU dans Control Tower, et y déplacer chaque compte un par un afin qu'Account Factory le provisionne de nouveau." } }
    - { id: b, text: { en: "Attach copies of the Control Tower SCPs to the existing OUs, and deploy the AWS Config rules to the accounts with an organization conformance pack.", fr: "Attacher des copies des SCP de Control Tower aux OU existantes, et déployer les règles AWS Config dans les comptes avec un pack de conformité d'organisation." } }
    - { id: c, text: { en: "Register each existing OU with Control Tower so that its accounts are enrolled, and enable AWS Config recording and the required controls on the OUs.", fr: "Enregistrer chaque OU existante dans Control Tower afin que ses comptes soient inscrits, et activer l'enregistrement AWS Config et les contrôles requis sur les OU." } }
    - { id: d, text: { en: "Close the existing accounts, provision replacement accounts with Account Factory, and migrate the workloads to the new accounts.", fr: "Fermer les comptes existants, provisionner des comptes de remplacement avec Account Factory, et migrer les charges de travail vers les nouveaux comptes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Registering an existing OU enrolls its member accounts in the landing zone, and the accounts are then governed by the controls that apply to their OU. An OU can be registered if it contains up to 1,000 accounts, and detective controls need AWS Config recording, which can be enabled on the OU."
    fr: "Enregistrer une OU existante inscrit ses comptes membres dans la zone d'atterrissage, et les comptes sont alors gouvernés par les contrôles qui s'appliquent à leur OU. Une OU peut être enregistrée si elle contient jusqu'à 1 000 comptes, et les contrôles détectifs ont besoin de l'enregistrement AWS Config, qui peut être activé sur l'OU."
  options:
    a:
      en: "Moving accounts one at a time adds manual work; registering the OUs enrolls all their accounts in one operation each."
      fr: "Déplacer les comptes un par un ajoute du travail manuel ; enregistrer les OU inscrit tous leurs comptes en une opération par OU."
    b:
      en: "Copied policies are not Control Tower controls, so the accounts would not be enrolled or reported as governed by Control Tower."
      fr: "Des politiques copiées ne sont pas des contrôles Control Tower : les comptes ne seraient ni inscrits ni signalés comme gouvernés par Control Tower."
    d:
      en: "Replacing the accounts requires migrating every workload, which is far more effort and disruption than registering the OUs."
      fr: "Remplacer les comptes exige de migrer chaque charge de travail, ce qui représente bien plus d'effort et de perturbation que l'enregistrement des OU."
references:
  - title: Register an existing organizational unit with AWS Control Tower
    url: https://docs.aws.amazon.com/controltower/latest/userguide/importing-existing.html
