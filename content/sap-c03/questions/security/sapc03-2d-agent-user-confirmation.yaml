id: sapc03-2d-agent-user-confirmation
objective: "2.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank has built a customer assistant with Amazon Bedrock Agents. An action group function moves money between accounts that the signed-in customer owns, and a knowledge base answers product questions. A red-team exercise showed that text planted in a retrieved document could lead the agent to start a transfer that the customer never asked for. The bank's oversight policy requires that every transfer runs only after the customer explicitly confirms that exact transfer in the chat. No bank employee reviews these transfers, and the bank wants the least development effort.

    Which solution will meet these requirements?
  fr: |
    Une banque a construit un assistant client avec Amazon Bedrock Agents. Une fonction de groupe d'actions transfère de l'argent entre des comptes que possède le client connecté, et une base de connaissances répond aux questions sur les produits. Un exercice de red team a montré qu'un texte placé dans un document récupéré pouvait amener l'agent à lancer un virement que le client n'avait jamais demandé. La politique de supervision de la banque exige que chaque virement ne s'exécute qu'après que le client a explicitement confirmé ce virement précis dans la conversation. Aucun employé de la banque n'examine ces virements, et la banque veut le moins d'effort de développement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Have the transfer function start an AWS Step Functions Standard workflow with a .waitForTaskToken task that emails a bank operations team, and run the transfer when the team returns the token.", fr: "Faire démarrer par la fonction de virement un flux de travail AWS Step Functions Standard avec une tâche .waitForTaskToken qui envoie un e-mail à une équipe des opérations bancaires, et exécuter le virement lorsque l'équipe renvoie le jeton." }
    - id: b
      text: { en: "Enable user confirmation on the transfer function of the action group, show the returned function details to the customer, and send the CONFIRM or DENY state back in the next InvokeAgent request.", fr: "Activer la confirmation utilisateur sur la fonction de virement du groupe d'actions, présenter au client les détails de fonction renvoyés, et retransmettre l'état CONFIRM ou DENY dans la requête InvokeAgent suivante." }
    - id: c
      text: { en: "Add an instruction to the agent's prompt that tells it to ask the customer for confirmation before every transfer, and add a guardrail prompt attack filter at HIGH strength.", fr: "Ajouter dans l'invite de l'agent une instruction lui demandant d'obtenir la confirmation du client avant chaque virement, et ajouter un filtre d'attaque par invite de guardrail à la force HIGH." }
    - id: d
      text: { en: "Add a denied topic for money transfers to the agent's guardrail with the BLOCK action, and direct customers to the mobile banking app for every transfer.", fr: "Ajouter au guardrail de l'agent un sujet refusé pour les virements avec l'action BLOCK, et renvoyer les clients vers l'application bancaire mobile pour chaque virement." }
answer: { optionId: b }
explanation:
  correct:
    en: "User confirmation on an action group function makes the agent return control to the application with the function details instead of invoking it. The application asks the customer, and the confirmationState field (CONFIRM or DENY) in the next InvokeAgent request decides whether the function runs, so injected instructions cannot trigger a transfer without consent."
    fr: "La confirmation utilisateur sur une fonction de groupe d'actions fait rendre le contrôle à l'application par l'agent, avec les détails de la fonction, au lieu de l'appeler. L'application interroge le client, et le champ confirmationState (CONFIRM ou DENY) de la requête InvokeAgent suivante décide si la fonction s'exécute : des instructions injectées ne peuvent pas déclencher un virement sans consentement."
  options:
    a:
      en: "A back-office approval adds a reviewer that the bank does not use and does not capture the customer's own consent, and it needs a workflow and a portal to build."
      fr: "Une approbation par le back-office ajoute un réviseur que la banque n'utilise pas et ne recueille pas le consentement du client lui-même, en plus d'exiger un flux de travail et un portail à construire."
    c:
      en: "Prompt instructions can be overridden by the injected text, and the prompt attack filter evaluates user prompts, not text planted in retrieved documents, so nothing deterministic stops the transfer."
      fr: "Des instructions d'invite peuvent être annulées par le texte injecté, et le filtre d'attaque par invite évalue les invites utilisateur, pas un texte placé dans des documents récupérés : rien de déterministe n'arrête le virement."
    d:
      en: "Blocking the topic removes the transfer capability that customers use, instead of adding a confirmation before each transfer."
      fr: "Bloquer le sujet supprime la fonction de virement utilisée par les clients, au lieu d'ajouter une confirmation avant chaque virement."
references:
  - title: Get user confirmation before invoking action group function
    url: https://docs.aws.amazon.com/bedrock/latest/userguide/agents-userconfirmation.html
