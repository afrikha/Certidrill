id: sapc03-2a-saas-vendor-external-id
objective: "2.1.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany sells a cost optimization SaaS product that reads billing and resource data from 3,000 customer AWS accounts. Each customer creates an IAM role from an AWS CloudFormation template that AnyCompany provides, and the role's trust policy trusts the IAM role that AnyCompany's service uses. The customer then enters the role ARN in AnyCompany's web console. A security review found that a customer could enter the role ARN of another customer and make AnyCompany's service read that customer's data. AnyCompany must keep using temporary credentials from role assumption.

    Which combination of actions should AnyCompany take to address this finding? (Choose two.)
  fr: |
    AnyCompany vend un produit SaaS d'optimisation des coûts qui lit les données de facturation et de ressources de 3 000 comptes AWS de clients. Chaque client crée un rôle IAM à partir d'un modèle AWS CloudFormation fourni par AnyCompany, et la politique d'approbation du rôle approuve le rôle IAM qu'utilise le service d'AnyCompany. Le client saisit ensuite l'ARN du rôle dans la console web d'AnyCompany. Une revue de sécurité a montré qu'un client pouvait saisir l'ARN du rôle d'un autre client et faire lire les données de ce client par le service d'AnyCompany. AnyCompany doit continuer à utiliser des informations d'identification temporaires obtenues par endossement de rôle.

    Quelle combinaison d'actions AnyCompany doit-elle mettre en œuvre pour corriger ce problème ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Let each customer choose its own external ID value, add it to its trust policy, and type it in the web console when it registers its role ARN."
        fr: "Laisser chaque client choisir sa propre valeur d'ID externe, l'ajouter à sa politique d'approbation, et la saisir dans la console web lorsqu'il enregistre l'ARN de son rôle."
    - id: b
      text:
        en: "Generate a unique external ID for each customer, put it in that customer's template as an sts:ExternalId condition, and store it with the customer's record."
        fr: "Générer un ID externe unique par client, l'inscrire dans le modèle de ce client comme condition sts:ExternalId, et le stocker avec l'enregistrement du client."
    - id: c
      text:
        en: "Add an aws:PrincipalOrgID condition with AnyCompany's organization ID to the trust policy in the template that customers deploy."
        fr: "Ajouter au modèle déployé par les clients une condition aws:PrincipalOrgID avec l'ID de l'organisation d'AnyCompany dans la politique d'approbation."
    - id: d
      text:
        en: "Make the service pass the stored external ID of the customer whose account it is accessing in every AssumeRole call, without accepting the value from user input."
        fr: "Faire transmettre par le service, dans chaque appel AssumeRole, l'ID externe stocké du client dont il accède au compte, sans accepter la valeur depuis une saisie utilisateur."
    - id: e
      text:
        en: "Ask each customer to create an IAM user with read-only permissions and upload its access keys, which AnyCompany encrypts with AWS KMS."
        fr: "Demander à chaque client de créer un utilisateur IAM avec des autorisations en lecture seule et de charger ses clés d'accès, qu'AnyCompany chiffre avec AWS KMS."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "This is the confused deputy problem: the external ID ties each role to one customer. The third party must generate a unique value per customer, the customer's trust policy must require it, and the service must send the value stored for the account it is acting for, so a customer that supplies someone else's role ARN cannot make the call succeed."
    fr: "Il s'agit du problème du député confus : l'ID externe lie chaque rôle à un seul client. Le tiers doit générer une valeur unique par client, la politique d'approbation du client doit l'exiger, et le service doit envoyer la valeur stockée pour le compte pour lequel il agit : un client qui fournit l'ARN de rôle d'un autre ne peut pas faire aboutir l'appel."
  options:
    a:
      en: "A value chosen by customers can be guessed or reused by another customer, so it does not reliably identify the account owner."
      fr: "Une valeur choisie par les clients peut être devinée ou réutilisée par un autre client : elle n'identifie pas de manière fiable le propriétaire du compte."
    c:
      en: "Every request comes from AnyCompany's own service role, so an organization condition is true for all customers and does not stop one customer from targeting another."
      fr: "Toutes les requêtes proviennent du rôle de service d'AnyCompany : une condition d'organisation est vraie pour tous les clients et n'empêche pas un client d'en cibler un autre."
    e:
      en: "Access keys are long-term credentials, which the company must not use instead of temporary credentials from role assumption."
      fr: "Les clés d'accès sont des informations d'identification à long terme, que l'entreprise ne doit pas utiliser à la place d'informations d'identification temporaires obtenues par endossement de rôle."
references:
  - title: The confused deputy problem
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
