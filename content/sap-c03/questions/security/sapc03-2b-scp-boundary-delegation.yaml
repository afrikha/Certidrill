id: sapc03-2b-scp-boundary-delegation
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany lets developers in 60 member accounts create IAM roles for their AWS Lambda functions. The security team requires that every role created by a developer have the DevBoundary permissions boundary, which limits the role to the developers' application resources. Developers must not be able to create a role without the boundary, remove the boundary, or modify the DevBoundary policy. The control must be enforced centrally.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    AnyCompany permet aux développeurs de 60 comptes membres de créer des rôles IAM pour leurs fonctions AWS Lambda. L'équipe de sécurité exige que chaque rôle créé par un développeur porte la limite d'autorisations DevBoundary, qui restreint le rôle aux ressources applicatives des développeurs. Les développeurs ne doivent pas pouvoir créer de rôle sans la limite, retirer la limite ni modifier la politique DevBoundary. Le contrôle doit être appliqué de façon centralisée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach an RCP to the organization root that denies iam:CreateRole unless the request includes the DevBoundary permissions boundary for the new role.", fr: "Attacher à la racine de l'organisation une RCP qui refuse iam:CreateRole sauf si la requête inclut la limite d'autorisations DevBoundary pour le nouveau rôle." } }
    - { id: b, text: { en: "Create the DevBoundary managed policy in every member account from one central template, for example with CloudFormation StackSets.", fr: "Créer la politique gérée DevBoundary dans chaque compte membre à partir d'un modèle central, par exemple avec CloudFormation StackSets." } }
    - { id: c, text: { en: "Attach an SCP that denies role creation and boundary changes unless iam:PermissionsBoundary is the DevBoundary ARN, and denies boundary removal and edits to DevBoundary.", fr: "Attacher une SCP qui refuse la création de rôles et les changements de limite sauf si iam:PermissionsBoundary est l'ARN de DevBoundary, et qui refuse le retrait de la limite et la modification de DevBoundary." } }
    - { id: d, text: { en: "Attach an SCP with an Allow statement that grants iam:CreateRole to the developer roles only when the DevBoundary permissions boundary is attached to the new role.", fr: "Attacher une SCP avec une instruction Allow qui accorde iam:CreateRole aux rôles des développeurs uniquement lorsque la limite d'autorisations DevBoundary est attachée au nouveau rôle." } }
    - { id: e, text: { en: "Enable IAM Access Analyzer unused access findings to identify the roles that developers created without the DevBoundary permissions boundary.", fr: "Activer les résultats d'accès inutilisés d'IAM Access Analyzer pour identifier les rôles créés par les développeurs sans la limite d'autorisations DevBoundary." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "The boundary policy must exist in each account before roles can reference it, and StackSets deploy it from one template. An SCP then denies iam:CreateRole and iam:PutRolePermissionsBoundary unless the iam:PermissionsBoundary condition key matches DevBoundary, and denies iam:DeleteRolePermissionsBoundary and changes to the DevBoundary policy; with the boundary, the effective permissions are the intersection of the SCP, the boundary, and the identity policy."
    fr: "La politique de limite doit exister dans chaque compte avant que des rôles puissent la référencer, et StackSets la déploie à partir d'un modèle unique. Une SCP refuse ensuite iam:CreateRole et iam:PutRolePermissionsBoundary sauf si la clé de condition iam:PermissionsBoundary correspond à DevBoundary, et refuse iam:DeleteRolePermissionsBoundary et toute modification de la politique DevBoundary ; avec la limite, les autorisations effectives sont l'intersection de la SCP, de la limite et de la politique d'identité."
  options:
    a:
      en: "IAM is not among the services that RCPs support, and restricting what principals in member accounts can do is the role of an SCP."
      fr: "IAM ne fait pas partie des services pris en charge par les RCP, et restreindre ce que peuvent faire les principaux des comptes membres est le rôle d'une SCP."
    d:
      en: "SCPs never grant permissions; an SCP Allow statement only sets the maximum available permissions."
      fr: "Les SCP n'accordent jamais d'autorisations ; une instruction Allow de SCP ne fait que fixer les autorisations maximales disponibles."
    e:
      en: "Access Analyzer findings are detective and concern unused access, so they neither enforce nor reliably report the boundary requirement."
      fr: "Les résultats d'Access Analyzer sont détectifs et portent sur les accès inutilisés : ils n'imposent ni ne signalent de façon fiable l'exigence de limite."
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
