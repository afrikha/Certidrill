id: sapc03-2b-security-lake-rollup-residency
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany operates in the EU and the US with 150 accounts in AWS Organizations. The security team wants a security data lake that normalizes CloudTrail management events, VPC Flow Logs, Route 53 resolver query logs, and Security Hub CSPM findings into one open schema for its analytics tools. A data residency rule requires that log data generated in EU Regions be stored only in EU Regions. Data from US Regions can be consolidated in us-east-1. Analysts in a separate analytics account must query the data with Amazon Athena.

    Which solution will meet these requirements?
  fr: |
    AnyCompany opère dans l'UE et aux États-Unis avec 150 comptes dans AWS Organizations. L'équipe de sécurité veut un lac de données de sécurité qui normalise les événements de gestion CloudTrail, les journaux de flux VPC, les journaux de requêtes du résolveur Route 53 et les résultats Security Hub CSPM dans un seul schéma ouvert pour ses outils d'analyse. Une règle de résidence des données exige que les données de journal produites dans les Régions de l'UE ne soient stockées que dans des Régions de l'UE. Les données des Régions américaines peuvent être regroupées dans us-east-1. Des analystes d'un compte d'analyse distinct doivent interroger les données avec Amazon Athena.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable Amazon Security Lake from a delegated administrator in all Regions with us-east-1 as the only rollup Region, and add a query subscriber for the analytics account.", fr: "Activer Amazon Security Lake depuis un administrateur délégué dans toutes les Régions avec us-east-1 comme seule Région de regroupement (rollup), et ajouter un abonné en requête pour le compte d'analyse." } }
    - { id: b, text: { en: "Create an organization trail and organization-wide VPC Flow Logs delivered to an S3 bucket in us-east-1, and catalog all of the data with AWS Glue for Amazon Athena queries.", fr: "Créer un journal de suivi d'organisation et des journaux de flux VPC à l'échelle de l'organisation livrés dans un compartiment S3 de us-east-1, et cataloguer toutes les données avec AWS Glue pour les requêtes Amazon Athena." } }
    - { id: c, text: { en: "Enable Amazon Security Lake from a delegated administrator with eu-central-1 as rollup Region for the EU Regions and us-east-1 for the US Regions, and add a query subscriber for the analytics account.", fr: "Activer Amazon Security Lake depuis un administrateur délégué avec eu-central-1 comme Région de regroupement pour les Régions de l'UE et us-east-1 pour les Régions américaines, et ajouter un abonné en requête pour le compte d'analyse." } }
    - { id: d, text: { en: "Enable Security Hub CSPM cross-Region aggregation with eu-central-1 as the home Region for all Regions, and give the analytics account access to the aggregated findings.", fr: "Activer l'agrégation entre Régions de Security Hub CSPM avec eu-central-1 comme Région d'origine pour toutes les Régions, et donner au compte d'analyse l'accès aux résultats agrégés." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Security Lake converts data from natively supported sources, including CloudTrail, VPC Flow Logs, Route 53 resolver query logs, and Security Hub CSPM findings, into Apache Parquet and the OCSF schema. Rollup Regions consolidate data from several Regions and help meet data residency requirements, so one EU rollup Region and one US rollup Region keep EU data in the EU, and query subscribers can use Athena."
    fr: "Security Lake convertit les données des sources prises en charge nativement, dont CloudTrail, les journaux de flux VPC, les journaux de requêtes du résolveur Route 53 et les résultats Security Hub CSPM, au format Apache Parquet et au schéma OCSF. Les Régions de regroupement consolident les données de plusieurs Régions et aident à respecter la résidence des données : une Région de regroupement UE et une Région américaine gardent les données de l'UE dans l'UE, et les abonnés en requête peuvent utiliser Athena."
  options:
    a:
      en: "A single rollup Region in us-east-1 would move EU log data out of the EU, which breaks the residency rule."
      fr: "Une seule Région de regroupement dans us-east-1 ferait sortir de l'UE les données de journal européennes, ce qui enfreint la règle de résidence."
    b:
      en: "This stores EU data in us-east-1, does not normalize the sources into a common schema, and does not include resolver logs or findings."
      fr: "Cette option stocke des données européennes dans us-east-1, ne normalise pas les sources dans un schéma commun et n'inclut ni les journaux du résolveur ni les résultats."
    d:
      en: "Cross-Region aggregation consolidates Security Hub CSPM findings only, not CloudTrail events, flow logs, or resolver logs."
      fr: "L'agrégation entre Régions ne regroupe que les résultats Security Hub CSPM, pas les événements CloudTrail, les journaux de flux ni les journaux du résolveur."
references:
  - title: What is Amazon Security Lake?
    url: https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html
