id: sapc03-2c-remediation-exception
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company runs shared network services in a dedicated account of its organization in AWS Organizations. The platform team uses the AWS Config managed rule restricted-ssh with automatic remediation by an AWS Systems Manager Automation runbook that removes inbound SSH rules open to 0.0.0.0/0 from security groups. A vendor appliance is being migrated, and its security group must keep an open SSH rule for exactly 30 days. During those 30 days, AWS Config must still evaluate the security group and report it as noncompliant. After 30 days, the rule must be remediated automatically without anyone having to remember to change the configuration. All other security groups must continue to be remediated.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exécute des services réseau partagés dans un compte dédié de son organisation AWS Organizations. L'équipe plateforme utilise la règle gérée AWS Config restricted-ssh avec une correction automatique par un runbook AWS Systems Manager Automation qui supprime des groupes de sécurité les règles SSH entrantes ouvertes à 0.0.0.0/0. Une appliance d'un fournisseur est en cours de migration, et son groupe de sécurité doit conserver une règle SSH ouverte pendant exactement 30 jours. Pendant ces 30 jours, AWS Config doit continuer à évaluer le groupe de sécurité et à le signaler comme non conforme. Au bout de 30 jours, la règle doit être corrigée automatiquement sans que personne n'ait à penser à modifier la configuration. Tous les autres groupes de sécurité doivent continuer à être corrigés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Delete the automatic remediation configuration from the rule, and create an Amazon EventBridge Scheduler schedule that recreates it 30 days later with a Lambda function."
        fr: "Supprimer la configuration de correction automatique de la règle, et créer une planification Amazon EventBridge Scheduler qui la recrée 30 jours plus tard avec une fonction Lambda."
    - id: b
      text:
        en: "Add a remediation exception for the vendor security group to the rule's remediation configuration, with an expiration time set 30 days in the future."
        fr: "Ajouter à la configuration de correction de la règle une exception de correction pour le groupe de sécurité du fournisseur, avec une date d'expiration fixée à 30 jours."
    - id: c
      text:
        en: "Change the rule scope to evaluate only security groups that have a remediate=true tag, and add that tag to every security group except the vendor security group."
        fr: "Modifier l'étendue de la règle pour n'évaluer que les groupes de sécurité qui portent l'étiquette remediate=true, et ajouter cette étiquette à tous les groupes de sécurité sauf celui du fournisseur."
    - id: d
      text:
        en: "Create an AWS Security Hub CSPM automation rule that suppresses the findings for the vendor security group, and delete the automation rule after 30 days."
        fr: "Créer une règle d'automatisation AWS Security Hub CSPM qui supprime les résultats du groupe de sécurité du fournisseur, et supprimer la règle d'automatisation au bout de 30 jours."
answer: { optionId: b }
explanation:
  correct:
    en: "A remediation exception excludes a specific resource from a rule's remediation action while the rule keeps evaluating it, so the security group is still reported as noncompliant. An exception can carry an expiration time, after which the resource is remediated again automatically, and the other security groups are not affected."
    fr: "Une exception de correction exclut une ressource précise de l'action de correction d'une règle tandis que la règle continue de l'évaluer : le groupe de sécurité est donc toujours signalé comme non conforme. Une exception peut avoir une date d'expiration, après laquelle la ressource est de nouveau corrigée automatiquement, et les autres groupes de sécurité ne sont pas concernés."
  options:
    a:
      en: "Removing the remediation configuration stops remediation for every security group for 30 days and adds custom code to restore it."
      fr: "Supprimer la configuration de correction arrête la correction de tous les groupes de sécurité pendant 30 jours et ajoute du code personnalisé pour la rétablir."
    c:
      en: "Out of scope, the vendor security group would no longer be evaluated or reported as noncompliant, and someone would have to add the tag back after 30 days."
      fr: "Hors de l'étendue, le groupe de sécurité du fournisseur ne serait plus évalué ni signalé comme non conforme, et quelqu'un devrait remettre l'étiquette au bout de 30 jours."
    d:
      en: "Suppressing findings in Security Hub CSPM does not affect AWS Config remediation, so the runbook would still remove the SSH rule, and deleting the rule later is a manual step."
      fr: "Supprimer des résultats dans Security Hub CSPM n'a aucun effet sur la correction AWS Config : le runbook supprimerait quand même la règle SSH, et supprimer la règle d'automatisation plus tard est une étape manuelle."
references:
  - title: Setting Up Auto Remediation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
