id: sapc03-2a-rcp-assume-role-vendor
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany has 150 member accounts in AWS Organizations, and developers manage the trust policies of their own IAM roles. The security team must guarantee that no role in a member account can be assumed by a principal outside the organization. The only exception is a monitoring vendor whose AWS account, 444455556666, assumes a role named VendorMonitoring in each account. AWS services such as AWS Lambda and Amazon ECS must still be able to assume service roles. The control must be preventive, central and effective even if a developer edits a trust policy.

    Which solution will meet these requirements?
  fr: |
    AnyCompany possède 150 comptes membres dans AWS Organizations, et les développeurs gèrent les politiques d'approbation de leurs propres rôles IAM. L'équipe de sécurité doit garantir qu'aucun rôle d'un compte membre ne puisse être endossé par un principal extérieur à l'organisation. La seule exception est un fournisseur de supervision dont le compte AWS, 444455556666, endosse un rôle nommé VendorMonitoring dans chaque compte. Les services AWS comme AWS Lambda et Amazon ECS doivent toujours pouvoir endosser des rôles de service. Le contrôle doit être préventif, central et efficace même si un développeur modifie une politique d'approbation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an SCP to the organization root that denies sts:AssumeRole when aws:PrincipalOrgID does not equal the organization ID, except for the VendorMonitoring role."
        fr: "Attacher à la racine de l'organisation une SCP qui refuse sts:AssumeRole lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation, sauf pour le rôle VendorMonitoring."
    - id: b
      text:
        en: "Create an organization-level IAM Access Analyzer external access analyzer, and archive the findings for the VendorMonitoring roles."
        fr: "Créer un analyseur d'accès externe IAM Access Analyzer au niveau de l'organisation, et archiver les résultats des rôles VendorMonitoring."
    - id: c
      text:
        en: "Require a permissions boundary on every role that developers create, and make the boundary deny sts:AssumeRole for principals outside the organization."
        fr: "Exiger une limite d'autorisations sur chaque rôle créé par les développeurs, et faire refuser par cette limite sts:AssumeRole aux principaux extérieurs à l'organisation."
    - id: d
      text:
        en: "Attach an RCP that denies sts:AssumeRole unless aws:PrincipalOrgID is the organization, the caller is account 444455556666 assuming VendorMonitoring, or aws:PrincipalIsAWSService is true."
        fr: "Attacher une RCP qui refuse sts:AssumeRole sauf si aws:PrincipalOrgID est l'organisation, si l'appelant est le compte 444455556666 qui endosse VendorMonitoring, ou si aws:PrincipalIsAWSService vaut true."
answer: { optionId: d }
explanation:
  correct:
    en: "RCPs support AWS STS and restrict access to the roles of member accounts whoever the caller is, including principals of other accounts, so a developer's trust policy cannot grant more than the RCP allows. The exceptions keep the vendor's role and AWS service principals working, and the policy is managed centrally."
    fr: "Les RCP prennent en charge AWS STS et restreignent l'accès aux rôles des comptes membres quel que soit l'appelant, y compris les principaux d'autres comptes : la politique d'approbation d'un développeur ne peut pas accorder plus que ce qu'autorise la RCP. Les exceptions préservent le rôle du fournisseur et les principaux de service AWS, et la politique est gérée de manière centrale."
  options:
    a:
      en: "An SCP limits what the principals of member accounts can do; it does not apply when a principal of an external account calls AssumeRole."
      fr: "Une SCP limite ce que peuvent faire les principaux des comptes membres ; elle ne s'applique pas lorsqu'un principal d'un compte externe appelle AssumeRole."
    b:
      en: "Access Analyzer reports roles that external principals can assume but does not prevent the access."
      fr: "Access Analyzer signale les rôles que des principaux externes peuvent endosser mais n'empêche pas l'accès."
    c:
      en: "A permissions boundary limits the permissions of the role's own sessions; it does not control who may assume the role."
      fr: "Une limite d'autorisations restreint les autorisations des sessions du rôle lui-même ; elle ne contrôle pas qui peut endosser le rôle."
references:
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
  - title: Perimeter implementation
    url: https://docs.aws.amazon.com/whitepapers/latest/building-a-data-perimeter-on-aws/perimeter-implementation.html
