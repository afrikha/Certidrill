id: sapc03-2c-cspm-config-recording
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company uses AWS Organizations with 60 member accounts that run workloads in three AWS Regions. The security team designated a security tooling account as the delegated administrator for AWS Security Hub CSPM and enabled the AWS Foundational Security Best Practices (FSBP) standard in every account and Region. Findings from Amazon GuardDuty and Amazon Inspector appear in Security Hub CSPM for all accounts. Fifteen accounts were recently moved into the organization from an acquired company. For these 15 accounts, Security Hub CSPM shows no control findings for most FSBP controls, while the other accounts generate control findings normally. The security team must obtain control findings for the 15 accounts with the fewest changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers utilise AWS Organizations avec 60 comptes membres qui exécutent des charges de travail dans trois Régions AWS. L'équipe de sécurité a désigné un compte d'outillage de sécurité comme administrateur délégué d'AWS Security Hub CSPM et a activé la norme AWS Foundational Security Best Practices (FSBP) dans chaque compte et chaque Région. Les résultats d'Amazon GuardDuty et d'Amazon Inspector apparaissent dans Security Hub CSPM pour tous les comptes. Quinze comptes provenant d'une société rachetée ont récemment été déplacés dans l'organisation. Pour ces 15 comptes, Security Hub CSPM n'affiche aucun résultat de contrôle pour la plupart des contrôles FSBP, alors que les autres comptes génèrent normalement des résultats de contrôle. L'équipe de sécurité doit obtenir des résultats de contrôle pour les 15 comptes avec le moins de modifications possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on consolidated control findings in the delegated administrator account so that each control is evaluated once for all member accounts, including the 15 accounts."
        fr: "Activer les résultats de contrôle consolidés dans le compte administrateur délégué afin que chaque contrôle soit évalué une seule fois pour tous les comptes membres, y compris les 15 comptes."
    - id: b
      text:
        en: "Turn on AWS Config in the 15 accounts and record the resource types that the enabled controls evaluate, in every Region where Security Hub CSPM is enabled."
        fr: "Activer AWS Config dans les 15 comptes et enregistrer les types de ressources évalués par les contrôles activés, dans chaque Région où Security Hub CSPM est activé."
    - id: c
      text:
        en: "Turn on cross-Region aggregation in the delegated administrator account and link the three Regions so that the control checks for the 15 accounts run in the home Region."
        fr: "Activer l'agrégation entre Régions dans le compte administrateur délégué et lier les trois Régions afin que les vérifications de contrôle des 15 comptes s'exécutent dans la Région d'origine."
    - id: d
      text:
        en: "Create an AWS Config aggregator in the delegated administrator account that collects configuration data from the 15 accounts, so that Security Hub CSPM can evaluate the controls centrally."
        fr: "Créer un agrégateur AWS Config dans le compte administrateur délégué qui collecte les données de configuration des 15 comptes, afin que Security Hub CSPM puisse évaluer les contrôles de manière centralisée."
answer: { optionId: b }
explanation:
  correct:
    en: "Security Hub CSPM runs most control checks through service-linked AWS Config rules, so AWS Config must be enabled and must record the relevant resources in each account and Region. Findings from integrated services such as GuardDuty and Inspector do not depend on AWS Config, which is why they still appear for the acquired accounts. Turning on the configuration recorder in those accounts is the only missing piece."
    fr: "Security Hub CSPM exécute la plupart des vérifications de contrôle au moyen de règles AWS Config liées au service : AWS Config doit donc être activé et enregistrer les ressources concernées dans chaque compte et chaque Région. Les résultats des services intégrés, comme GuardDuty et Inspector, ne dépendent pas d'AWS Config, ce qui explique qu'ils apparaissent toujours pour les comptes rachetés. Activer l'enregistreur de configuration dans ces comptes est le seul élément manquant."
  options:
    a:
      en: "Consolidated control findings change how findings are grouped across standards; they do not make a control check run in an account that has no AWS Config recording."
      fr: "Les résultats de contrôle consolidés modifient le regroupement des résultats entre les normes ; ils ne permettent pas d'exécuter une vérification de contrôle dans un compte où AWS Config n'enregistre rien."
    c:
      en: "Cross-Region aggregation only replicates findings that already exist in linked Regions to the home Region; it does not evaluate controls on behalf of member accounts."
      fr: "L'agrégation entre Régions réplique seulement vers la Région d'origine les résultats qui existent déjà dans les Régions liées ; elle n'évalue pas les contrôles pour le compte des comptes membres."
    d:
      en: "An aggregator is a read-only view of data that source accounts already record. Without a recorder in the 15 accounts there is nothing to aggregate, and Security Hub CSPM does not evaluate controls from aggregated data."
      fr: "Un agrégateur est une vue en lecture seule des données que les comptes sources enregistrent déjà. Sans enregistreur dans les 15 comptes, il n'y a rien à agréger, et Security Hub CSPM n'évalue pas les contrôles à partir des données agrégées."
references:
  - title: Introduction to AWS Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html
  - title: Understanding cross-Region aggregation in Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/finding-aggregation.html
