id: sapc03-2a-roles-anywhere-trust-conditions
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    AnyCompany uses IAM Roles Anywhere in its production account. The enterprise certificate authority (CA) that issues certificates to all 3,000 on-premises servers is registered as a trust anchor. A second trust anchor in the same account registers a test CA. The payment reconciliation servers have certificates whose subject contains OU=payments-recon, and only these servers may obtain credentials for an IAM role named ReconRole. Other servers must not assume ReconRole, even though their certificates chain to the same enterprise CA, and certificates from the test CA must never be accepted for this role.

    Which trust policy for ReconRole will meet these requirements?
  fr: |
    AnyCompany utilise IAM Roles Anywhere dans son compte de production. L'autorité de certification (CA) d'entreprise qui émet les certificats des 3 000 serveurs sur site est enregistrée comme ancre de confiance. Une seconde ancre de confiance du même compte enregistre une CA de test. Les serveurs de rapprochement des paiements possèdent des certificats dont le sujet contient OU=payments-recon, et seuls ces serveurs peuvent obtenir des informations d'identification pour un rôle IAM nommé ReconRole. Les autres serveurs ne doivent pas endosser ReconRole, même si leurs certificats sont émis par la même CA d'entreprise, et les certificats de la CA de test ne doivent jamais être acceptés pour ce rôle.

    Quelle politique d'approbation de ReconRole répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Trust rolesanywhere.amazonaws.com for sts:AssumeRole, sts:TagSession and sts:SetSourceIdentity, with a condition that aws:PrincipalTag/x509Issuer/CN equals the common name of the enterprise CA."
        fr: "Approuver rolesanywhere.amazonaws.com pour sts:AssumeRole, sts:TagSession et sts:SetSourceIdentity, avec une condition selon laquelle aws:PrincipalTag/x509Issuer/CN est égal au nom commun de la CA d'entreprise."
    - id: b
      text:
        en: "Trust rolesanywhere.amazonaws.com for sts:AssumeRole, sts:TagSession and sts:SetSourceIdentity, with conditions on aws:PrincipalTag/x509Subject/OU (payments-recon) and on aws:SourceArn (production trust anchor ARN)."
        fr: "Approuver rolesanywhere.amazonaws.com pour sts:AssumeRole, sts:TagSession et sts:SetSourceIdentity, avec des conditions sur aws:PrincipalTag/x509Subject/OU (payments-recon) et sur aws:SourceArn (ARN de l'ancre de confiance de production)."
    - id: c
      text:
        en: "Trust rolesanywhere.amazonaws.com for sts:AssumeRole only, with a condition that aws:SourceIp matches the public IP addresses that the reconciliation servers use to reach AWS endpoints."
        fr: "Approuver rolesanywhere.amazonaws.com pour sts:AssumeRole uniquement, avec une condition selon laquelle aws:SourceIp correspond aux adresses IP publiques qu'utilisent les serveurs de rapprochement pour atteindre les points de terminaison AWS."
    - id: d
      text:
        en: "Register the certificate of each reconciliation server as its own trust anchor, and trust rolesanywhere.amazonaws.com with a condition that aws:SourceArn matches any of those trust anchor ARNs."
        fr: "Enregistrer le certificat de chaque serveur de rapprochement comme sa propre ancre de confiance, et approuver rolesanywhere.amazonaws.com avec une condition selon laquelle aws:SourceArn correspond à l'un des ARN de ces ancres de confiance."
answer: { optionId: b }
explanation:
  correct:
    en: "Roles Anywhere sessions carry principal tags extracted from the certificate subject, issuer and SAN, so a condition on aws:PrincipalTag/x509Subject/OU limits the role to the reconciliation certificates. A condition on aws:SourceArn with the trust anchor's canonical ARN rejects certificates validated by the test CA's trust anchor, and the role must allow the three STS actions that Roles Anywhere uses."
    fr: "Les sessions Roles Anywhere portent des balises de principal extraites du sujet, de l'émetteur et du SAN du certificat : une condition sur aws:PrincipalTag/x509Subject/OU limite le rôle aux certificats de rapprochement. Une condition sur aws:SourceArn avec l'ARN canonique de l'ancre de confiance rejette les certificats validés par l'ancre de la CA de test, et le rôle doit autoriser les trois actions STS qu'utilise Roles Anywhere."
  options:
    a:
      en: "Every server's certificate has the same issuer, so an issuer condition lets all 3,000 servers assume the role."
      fr: "Tous les certificats des serveurs ont le même émetteur : une condition sur l'émetteur permet aux 3 000 serveurs d'endosser le rôle."
    c:
      en: "Roles Anywhere needs sts:TagSession and sts:SetSourceIdentity in the trust policy, and shared outbound IP addresses do not identify individual servers."
      fr: "Roles Anywhere a besoin de sts:TagSession et de sts:SetSourceIdentity dans la politique d'approbation, et des adresses IP sortantes partagées n'identifient pas les serveurs individuellement."
    d:
      en: "A trust anchor represents a certificate authority, not a server certificate, and managing one anchor per server is heavy and unnecessary."
      fr: "Une ancre de confiance représente une autorité de certification, pas un certificat de serveur, et gérer une ancre par serveur est lourd et inutile."
references:
  - title: The IAM Roles Anywhere trust model
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/trust-model.html
