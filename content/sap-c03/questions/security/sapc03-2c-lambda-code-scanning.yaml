id: sapc03-2c-lambda-code-scanning
objective: "2.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A payments company runs about 600 AWS Lambda functions written in Python and Node.js across 30 accounts in AWS Organizations. The functions are deployed as .zip archives and share several Lambda layers. The security tooling account is the Amazon Inspector delegated administrator, and only EC2 and ECR scanning are activated today. A penetration test found an injection flaw in the custom code of one function and an outdated, vulnerable library in a shared layer. The security team now requires continuous detection of both vulnerable packages in functions and layers and vulnerabilities in the custom application code, with all findings in the delegated administrator account.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de paiement exécute environ 600 fonctions AWS Lambda écrites en Python et Node.js dans 30 comptes d'AWS Organizations. Les fonctions sont déployées sous forme d'archives .zip et partagent plusieurs couches Lambda. Le compte d'outillage de sécurité est l'administrateur délégué d'Amazon Inspector, et seules les analyses EC2 et ECR sont activées aujourd'hui. Un test d'intrusion a trouvé une faille d'injection dans le code personnalisé d'une fonction et une bibliothèque obsolète et vulnérable dans une couche partagée. L'équipe de sécurité exige désormais la détection continue des paquets vulnérables dans les fonctions et les couches, ainsi que des vulnérabilités du code applicatif personnalisé, avec tous les résultats dans le compte administrateur délégué.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Activate Amazon Inspector Lambda standard scanning for all member accounts from the delegated administrator account."
        fr: "Activer l'analyse standard Lambda d'Amazon Inspector pour tous les comptes membres depuis le compte administrateur délégué."
    - id: b
      text:
        en: "Activate Amazon Inspector ECR enhanced scanning for the repositories that store the build artifacts of the Lambda functions."
        fr: "Activer l'analyse améliorée ECR d'Amazon Inspector pour les référentiels qui stockent les artefacts de build des fonctions Lambda."
    - id: c
      text:
        en: "Activate Amazon Inspector Lambda code scanning for all member accounts from the delegated administrator account."
        fr: "Activer l'analyse du code Lambda d'Amazon Inspector pour tous les comptes membres depuis le compte administrateur délégué."
    - id: d
      text:
        en: "Enable Amazon GuardDuty Lambda Protection for all member accounts from the GuardDuty delegated administrator account."
        fr: "Activer Amazon GuardDuty Lambda Protection pour tous les comptes membres depuis le compte administrateur délégué de GuardDuty."
    - id: e
      text:
        en: "Create Amazon Inspector CIS scan configurations that run weekly against the Lambda execution environments of the 30 accounts."
        fr: "Créer des configurations d'analyse CIS Amazon Inspector qui s'exécutent chaque semaine sur les environnements d'exécution Lambda des 30 comptes."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Lambda standard scanning finds package vulnerabilities in the dependencies of functions and layers, and Lambda code scanning finds code vulnerabilities in the custom application code of functions and layers. Code scanning can be activated only together with, or after, standard scanning, so both are needed, and the delegated administrator can activate them for all members."
    fr: "L'analyse standard Lambda détecte les vulnérabilités des paquets dans les dépendances des fonctions et des couches, et l'analyse du code Lambda détecte les vulnérabilités dans le code applicatif personnalisé des fonctions et des couches. L'analyse du code ne peut être activée qu'avec l'analyse standard ou après elle : les deux sont donc nécessaires, et l'administrateur délégué peut les activer pour tous les membres."
  options:
    b:
      en: "The functions are deployed as .zip archives, not container images, so ECR scanning does not cover their code or layers."
      fr: "Les fonctions sont déployées sous forme d'archives .zip, pas d'images de conteneur : l'analyse ECR ne couvre ni leur code ni leurs couches."
    d:
      en: "GuardDuty Lambda Protection monitors network activity of invocations for threats; it does not report vulnerabilities in packages or code."
      fr: "GuardDuty Lambda Protection surveille l'activité réseau des appels pour détecter des menaces ; il ne signale pas les vulnérabilités des paquets ou du code."
    e:
      en: "CIS scans assess the operating system settings of EC2 instances that are Systems Manager managed nodes; they cannot target Lambda functions."
      fr: "Les analyses CIS évaluent les paramètres du système d'exploitation d'instances EC2 qui sont des nœuds gérés Systems Manager ; elles ne peuvent pas cibler des fonctions Lambda."
references:
  - title: Scanning AWS Lambda functions with Amazon Inspector
    url: https://docs.aws.amazon.com/inspector/latest/user/scanning-lambda.html
