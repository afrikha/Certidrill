id: sapc03-2c-org-trail-members
objective: "2.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 300 accounts in AWS Organizations. Today, each account administrator creates and manages a local AWS CloudTrail trail, and an internal audit found that several administrators stopped logging or deleted their trails during incidents. The company now requires that management events from every account, including accounts created later, be logged in all AWS Regions to a bucket in a dedicated log archive account. Account administrators must not be able to stop, modify, or delete this logging. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 300 comptes dans AWS Organizations. Aujourd'hui, l'administrateur de chaque compte crée et gère un journal de suivi AWS CloudTrail local, et un audit interne a constaté que plusieurs administrateurs ont arrêté la journalisation ou supprimé leur journal de suivi pendant des incidents. L'entreprise exige désormais que les événements de gestion de chaque compte, y compris des comptes créés ultérieurement, soient journalisés dans toutes les Régions AWS vers un compartiment d'un compte d'archivage des journaux dédié. Les administrateurs des comptes ne doivent pas pouvoir arrêter, modifier ni supprimer cette journalisation. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy a multi-Region trail to every account with a CloudFormation StackSet, and attach an SCP that denies cloudtrail:StopLogging and cloudtrail:DeleteTrail to all OUs."
        fr: "Déployer un journal de suivi multi-Régions dans chaque compte avec un StackSet CloudFormation, et attacher à toutes les OU une SCP qui refuse cloudtrail:StopLogging et cloudtrail:DeleteTrail."
    - id: b
      text:
        en: "Deploy the cloudtrail-enabled AWS Config rule in an organization conformance pack, with an automatic remediation that recreates a trail when an account has none."
        fr: "Déployer la règle AWS Config cloudtrail-enabled dans un pack de conformité d'organisation, avec une correction automatique qui recrée un journal de suivi lorsqu'un compte n'en a pas."
    - id: c
      text:
        en: "From the management account or a CloudTrail delegated administrator account, create a multi-Region organization trail that delivers to the log archive bucket."
        fr: "Depuis le compte de gestion ou un compte administrateur délégué de CloudTrail, créer un journal de suivi d'organisation multi-Régions qui livre au compartiment d'archivage des journaux."
    - id: d
      text:
        en: "Turn on CloudTrail Insights for the management account's trail so that unusual StopLogging and DeleteTrail activity in member accounts generates alerts."
        fr: "Activer CloudTrail Insights sur le journal de suivi du compte de gestion afin que les activités StopLogging et DeleteTrail inhabituelles des comptes membres génèrent des alertes."
answer: { optionId: c }
explanation:
  correct:
    en: "An organization trail logs events for the management account and all member accounts, and it is added automatically to accounts that join the organization. Member accounts can see the trail but cannot delete it, turn logging off, or change it; only the management account or the delegated administrator can. A trail created in the console is multi-Region and delivers to one bucket with a folder per account."
    fr: "Un journal de suivi d'organisation journalise les événements du compte de gestion et de tous les comptes membres, et il est ajouté automatiquement aux comptes qui rejoignent l'organisation. Les comptes membres voient le journal de suivi mais ne peuvent ni le supprimer, ni désactiver la journalisation, ni le modifier ; seuls le compte de gestion ou l'administrateur délégué le peuvent. Un journal de suivi créé dans la console est multi-Régions et livre dans un seul compartiment, avec un dossier par compte."
  options:
    a:
      en: "This can work, but it needs a StackSet and an SCP to maintain, whereas an organization trail provides the same protection natively with less overhead."
      fr: "Cette solution peut fonctionner, mais elle nécessite de maintenir un StackSet et une SCP, alors qu'un journal de suivi d'organisation fournit nativement la même protection avec moins de charge."
    b:
      en: "A detective rule finds missing trails after the fact; administrators could still stop logging, and events would be lost until remediation runs."
      fr: "Une règle de détection repère les journaux de suivi manquants a posteriori ; les administrateurs pourraient toujours arrêter la journalisation, et des événements seraient perdus jusqu'à l'exécution de la correction."
    d:
      en: "Insights detects unusual API call rates or error rates; it does not log member account events or prevent administrators from stopping their trails."
      fr: "Insights détecte des volumes ou des taux d'erreur d'appels d'API inhabituels ; il ne journalise pas les événements des comptes membres et n'empêche pas les administrateurs d'arrêter leurs journaux de suivi."
references:
  - title: Creating a trail for an organization
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
