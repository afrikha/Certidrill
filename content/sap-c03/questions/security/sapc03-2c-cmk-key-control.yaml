id: sapc03-2c-cmk-key-control
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A European insurance company is moving its policyholder data to Amazon S3, Amazon EBS, and Amazon RDS in several accounts. Its regulator requires the company to control the encryption keys that protect this data. The company must define who can use each key, see every use of each key in its own audit logs, and be able to disable a key to make the related data inaccessible. The regulator accepts key material that AWS KMS generates, and the company does not want to operate any HSM or key manager. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance européenne transfère les données de ses assurés vers Amazon S3, Amazon EBS et Amazon RDS dans plusieurs comptes. Son régulateur exige que l'entreprise contrôle les clés de chiffrement qui protègent ces données. L'entreprise doit définir qui peut utiliser chaque clé, voir chaque utilisation de chaque clé dans ses propres journaux d'audit, et pouvoir désactiver une clé pour rendre les données associées inaccessibles. Le régulateur accepte un matériel de clé généré par AWS KMS, et l'entreprise ne veut exploiter aucun HSM ni gestionnaire de clés. L'entreprise veut la solution qui présente le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Rely on the default encryption that each service applies with AWS owned keys, and use AWS CloudTrail to show the regulator that the data is encrypted."
        fr: "S'appuyer sur le chiffrement par défaut que chaque service applique avec des clés détenues par AWS, et utiliser AWS CloudTrail pour montrer au régulateur que les données sont chiffrées."
    - id: b
      text:
        en: "Encrypt the resources with the AWS managed keys of each service, such as aws/s3 and aws/ebs, and restrict their use by editing their key policies."
        fr: "Chiffrer les ressources avec les clés gérées par AWS de chaque service, comme aws/s3 et aws/ebs, et restreindre leur utilisation en modifiant leurs politiques de clé."
    - id: c
      text:
        en: "Deploy an AWS CloudHSM cluster in each account, and change the applications to encrypt the data client-side with keys stored in the cluster before writing it."
        fr: "Déployer un cluster AWS CloudHSM dans chaque compte, et modifier les applications pour chiffrer les données côté client avec des clés stockées dans le cluster avant de les écrire."
    - id: d
      text:
        en: "Create AWS KMS customer managed keys, control their use with key policies, use them to encrypt the S3, EBS, and RDS resources, and review their use in CloudTrail."
        fr: "Créer des clés gérées par le client AWS KMS, contrôler leur utilisation avec des politiques de clé, les utiliser pour chiffrer les ressources S3, EBS et RDS, et examiner leur utilisation dans CloudTrail."
answer: { optionId: d }
explanation:
  correct:
    en: "Customer managed keys are created and owned by the customer: their key policy is exclusively controlled by the customer, they can be enabled, disabled or scheduled for deletion, and every use is logged in the customer's CloudTrail trails. The integrated services encrypt data with these keys, and AWS KMS generates and protects the key material, so the company operates no HSM."
    fr: "Les clés gérées par le client sont créées et détenues par le client : leur politique de clé est contrôlée exclusivement par le client, elles peuvent être activées, désactivées ou planifiées pour suppression, et chaque utilisation est journalisée dans les journaux de suivi CloudTrail du client. Les services intégrés chiffrent les données avec ces clés, et AWS KMS génère et protège le matériel de clé : l'entreprise n'exploite aucun HSM."
  options:
    a:
      en: "AWS owned keys are controlled and visible only to the AWS service; their use does not appear in the customer's logs and they cannot be disabled by the customer."
      fr: "Les clés détenues par AWS sont contrôlées par le service AWS et visibles par lui seul ; leur utilisation n'apparaît pas dans les journaux du client et le client ne peut pas les désactiver."
    b:
      en: "The key policy of an AWS managed key is controlled by the service and cannot be edited, and these keys cannot be disabled."
      fr: "La politique de clé d'une clé gérée par AWS est contrôlée par le service et ne peut pas être modifiée, et ces clés ne peuvent pas être désactivées."
    c:
      en: "Running HSM clusters and rewriting applications for client-side encryption is the operational burden the company wants to avoid, and it is not needed when KMS-generated keys are accepted."
      fr: "Exploiter des clusters HSM et réécrire les applications pour le chiffrement côté client est la charge opérationnelle que l'entreprise veut éviter, et ce n'est pas nécessaire lorsque des clés générées par KMS sont acceptées."
references:
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
