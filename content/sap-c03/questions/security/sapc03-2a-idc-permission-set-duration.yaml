id: sapc03-2a-idc-permission-set-duration
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    AnyCompany uses AWS IAM Identity Center with an external identity provider to give access to 35 AWS accounts. Data engineers use a permission set named DataEngineer and run AWS CLI jobs that take up to 6 hours. The jobs fail after 1 hour because the credentials expire. The security team accepts sessions of up to 8 hours for the data engineers only. Other users must keep their current session settings.

    Which solution will meet these requirements?
  fr: |
    AnyCompany utilise AWS IAM Identity Center avec un fournisseur d'identité externe pour donner accès à 35 comptes AWS. Les ingénieurs de données utilisent un ensemble d'autorisations (permission set) nommé DataEngineer et exécutent des tâches AWS CLI qui durent jusqu'à 6 heures. Les tâches échouent au bout d'une heure car les informations d'identification expirent. L'équipe de sécurité accepte des sessions de 8 heures au maximum pour les seuls ingénieurs de données. Les autres utilisateurs doivent conserver leurs paramètres de session actuels.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In each account, use the IAM console to set the maximum session duration of the AWSReservedSSO role that corresponds to DataEngineer to 8 hours."
        fr: "Dans chaque compte, utiliser la console IAM pour définir à 8 heures la durée de session maximale du rôle AWSReservedSSO qui correspond à DataEngineer."
    - id: b
      text:
        en: "Increase the AWS access portal session duration in the IAM Identity Center settings to 8 hours, and ask the data engineers to sign in again."
        fr: "Porter à 8 heures la durée de session du portail d'accès AWS dans les paramètres d'IAM Identity Center, et demander aux ingénieurs de données de se reconnecter."
    - id: c
      text:
        en: "Set the session duration of the DataEngineer permission set to 8 hours, and have the data engineers get new credentials from the AWS access portal."
        fr: "Définir à 8 heures la durée de session de l'ensemble d'autorisations DataEngineer, et faire obtenir de nouvelles informations d'identification aux ingénieurs de données depuis le portail d'accès AWS."
    - id: d
      text:
        en: "Create IAM users with access keys for the data engineers in each account, and store the access keys in AWS Secrets Manager."
        fr: "Créer des utilisateurs IAM avec des clés d'accès pour les ingénieurs de données dans chaque compte, et stocker les clés d'accès dans AWS Secrets Manager."
answer: { optionId: c }
explanation:
  correct:
    en: "IAM Identity Center uses the session duration of the permission set when users federate into an account from the console or the AWS CLI. The duration can be set from 1 to 12 hours per permission set, so changing DataEngineer affects only the users who use that permission set."
    fr: "IAM Identity Center utilise la durée de session de l'ensemble d'autorisations lorsque les utilisateurs se fédèrent dans un compte depuis la console ou l'AWS CLI. Cette durée se définit de 1 à 12 heures par ensemble d'autorisations : modifier DataEngineer n'affecte que les utilisateurs de cet ensemble."
  options:
    a:
      en: "Roles that IAM Identity Center creates from permission sets cannot be edited in IAM; they are managed only through IAM Identity Center."
      fr: "Les rôles qu'IAM Identity Center crée à partir des ensembles d'autorisations ne peuvent pas être modifiés dans IAM ; ils sont gérés uniquement par IAM Identity Center."
    b:
      en: "The access portal session is separate from the account session, which follows the permission set duration, and the portal setting would apply to every user."
      fr: "La session du portail d'accès est distincte de la session de compte, qui suit la durée de l'ensemble d'autorisations, et le paramètre du portail s'appliquerait à tous les utilisateurs."
    d:
      en: "Long-term access keys for individual users go against the use of temporary federated credentials and add key rotation work."
      fr: "Des clés d'accès à long terme pour des utilisateurs individuels vont à l'encontre des informations d'identification fédérées temporaires et ajoutent un travail de rotation des clés."
references:
  - title: Set session duration for AWS accounts
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/howtosessionduration.html
  - title: Revoke IAM role temporary security credentials
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_revoke-sessions.html
