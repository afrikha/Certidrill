id: sapc03-2b-policy-staging-ou
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AnyCompany has 300 accounts in AWS Organizations. Last quarter, a new SCP that was attached directly to the Workloads OU blocked an AWS service that several production applications depended on, which caused an outage. The security team must validate every new or changed SCP against representative workloads before the policy reaches production accounts. The team does not want to duplicate the whole organization.

    Which approach will meet these requirements?
  fr: |
    AnyCompany dispose de 300 comptes dans AWS Organizations. Le trimestre dernier, une nouvelle SCP attachée directement à l'OU Workloads a bloqué un service AWS dont dépendaient plusieurs applications de production, ce qui a provoqué une panne. L'équipe de sécurité doit valider chaque SCP nouvelle ou modifiée sur des charges de travail représentatives avant que la politique n'atteigne les comptes de production. L'équipe ne veut pas dupliquer toute l'organisation.

    Quelle approche répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a second organization that mirrors the OU structure and workloads, test each SCP there, and then recreate the SCP in the production organization.", fr: "Créer une seconde organisation qui reproduit la structure des OU et les charges de travail, y tester chaque SCP, puis recréer la SCP dans l'organisation de production." } }
    - { id: b, text: { en: "Create a Policy Staging OU with test accounts that mirror production workloads, attach new SCPs there first, check CloudTrail for access denied errors, then promote them.", fr: "Créer une OU Policy Staging avec des comptes de test qui reproduisent les charges de production, y attacher d'abord les nouvelles SCP, rechercher les erreurs d'accès refusé dans CloudTrail, puis les promouvoir." } }
    - { id: c, text: { en: "Attach each new SCP to the organization root during a maintenance window so that every account is tested at once, and detach it if errors appear.", fr: "Attacher chaque nouvelle SCP à la racine de l'organisation pendant une fenêtre de maintenance afin de tester tous les comptes en une fois, et la détacher si des erreurs apparaissent." } }
    - { id: d, text: { en: "Attach each new SCP to the Workloads OU with a condition that applies it only to principals tagged as testers until the security team validates the policy.", fr: "Attacher chaque nouvelle SCP à l'OU Workloads avec une condition qui ne l'applique qu'aux principaux balisés comme testeurs jusqu'à ce que l'équipe de sécurité valide la politique." } }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS recommends a Policy Staging OU that hosts accounts used to test and validate new or modified policies before they are applied to production. Testing on individual accounts first and reviewing CloudTrail access denied errors shows the impact before the SCP moves to the production OUs."
    fr: "AWS recommande une OU Policy Staging qui héberge des comptes servant à tester et valider les politiques nouvelles ou modifiées avant leur application en production. Tester d'abord sur des comptes individuels et examiner les erreurs d'accès refusé dans CloudTrail révèle l'impact avant que la SCP ne passe aux OU de production."
  options:
    a:
      en: "A second organization duplicates the environment, which the team does not want, and policies must be recreated by hand."
      fr: "Une seconde organisation duplique l'environnement, ce que l'équipe ne veut pas, et les politiques doivent être recréées à la main."
    c:
      en: "AWS strongly recommends not attaching untested SCPs to the root; this would expose every production account to the risk."
      fr: "AWS recommande fortement de ne pas attacher de SCP non testées à la racine ; cela exposerait tous les comptes de production au risque."
    d:
      en: "The SCP would still be attached to production accounts, and testing only tagged principals does not exercise the production workloads' own roles."
      fr: "La SCP serait tout de même attachée aux comptes de production, et ne tester que des principaux balisés ne sollicite pas les rôles propres des charges de production."
references:
  - title: Recommended OUs and accounts
    url: https://docs.aws.amazon.com/whitepapers/latest/organizing-your-aws-environment/recommended-ous-and-accounts.html
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
