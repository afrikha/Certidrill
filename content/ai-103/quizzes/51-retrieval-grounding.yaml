chapter: 51-retrieval-grounding
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-51-01
    objective: "5.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso stores product manuals as PDF files in an Azure Blob Storage container. The grounding index of a Foundry agent must be refreshed from the container every hour, without custom code.

        Which Azure AI Search object connects to the container on a schedule, cracks each file, runs the enrichment steps and writes the results to the index?
      fr: |
        Contoso stocke des manuels produits sous forme de fichiers PDF dans un conteneur Stockage Blob Azure. L'index d'ancrage d'un agent Foundry doit être actualisé à partir du conteneur toutes les heures, sans code personnalisé.

        Quel objet Azure AI Search se connecte au conteneur selon une planification, craque chaque fichier, exécute les étapes d'enrichissement et écrit les résultats dans l'index ?
    body:
      options:
        - { id: a, text: { en: "The data source", fr: "La source de données" } }
        - { id: b, text: { en: "The skillset", fr: "L'ensemble de compétences" } }
        - { id: c, text: { en: "The indexer", fr: "L'indexeur" } }
        - { id: d, text: { en: "The index projection", fr: "La projection d'index" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The indexer is the crawler of the pull model: it reads the data source, cracks the files, runs the optional skillset, maps the fields and writes the documents to one index. It runs on demand or on a schedule, as often as every five minutes, and uses change detection so that only new or modified blobs are processed.
        fr: |
          L'indexeur est le robot du modèle pull : il lit la source de données, craque les fichiers, exécute l'ensemble de compétences facultatif, associe les champs et écrit les documents dans un index. Il s'exécute à la demande ou selon une planification, jusqu'à toutes les cinq minutes, et utilise la détection des modifications pour ne traiter que les objets blob nouveaux ou modifiés.
      options:
        a: { en: "The data source only describes the connection to the container; it doesn't read, crack or write anything by itself.", fr: "La source de données décrit seulement la connexion au conteneur ; elle ne lit, ne craque et n'écrit rien par elle-même." }
        b: { en: "The skillset defines the enrichment steps, but the indexer is the object that runs it and writes its outputs to the index.", fr: "L'ensemble de compétences définit les étapes d'enrichissement, mais c'est l'indexeur qui l'exécute et écrit ses sorties dans l'index." }
        d: { en: "An index projection, defined in the skillset, maps chunks to search documents; it doesn't connect to the data source or run on a schedule.", fr: "Une projection d'index, définie dans l'ensemble de compétences, associe les blocs à des documents de recherche ; elle ne se connecte pas à la source de données et ne s'exécute pas selon une planification." }
    references:
      - title: Indexer Overview - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/search-indexer-overview

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-51-02
    objective: "5.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam indexes digital PDF reports into Azure AI Search. Some pages contain scanned tables pasted as images. The indexer generates normalized images, and an OCR skill reads the text of each image.

        Before the text is chunked, the OCR text of each image must be inserted into the document text at the position where the image appears. Which skill should you add to the skillset?
      fr: |
        Fabrikam indexe des rapports PDF numériques dans Azure AI Search. Certaines pages contiennent des tableaux numérisés collés sous forme d'images. L'indexeur génère des images normalisées, et une compétence OCR lit le texte de chaque image.

        Avant le découpage en blocs, le texte OCR de chaque image doit être inséré dans le texte du document à l'endroit où l'image apparaît. Quelle compétence devez-vous ajouter à l'ensemble de compétences ?
    body:
      options:
        - { id: a, text: Text Split }
        - { id: b, text: Text Merge }
        - { id: c, text: Image Analysis }
        - { id: d, text: Key Phrase Extraction }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The Text Merge skill inserts an array of strings into a main text at given offsets. With `/document/content` as the text, the OCR output of `/document/normalized_images/*` as the items and their `contentOffset` values as the offsets, it returns one merged text in which each image's text sits where the image was. The Text Split skill then chunks that merged text.
        fr: |
          La compétence Text Merge insère un tableau de chaînes dans un texte principal, à des positions données. Avec `/document/content` comme texte, la sortie OCR de `/document/normalized_images/*` comme éléments et leurs valeurs `contentOffset` comme positions, elle renvoie un texte fusionné où le texte de chaque image se trouve à la place de l'image. La compétence Text Split découpe ensuite ce texte fusionné en blocs.
      options:
        a: { en: "Text Split cuts a text into chunks; it doesn't combine the OCR text with the document text.", fr: "Text Split découpe un texte en blocs ; il ne combine pas le texte OCR avec le texte du document." }
        c: { en: "Image Analysis returns captions, tags and objects for an image, not its text placed back into the document.", fr: "Image Analysis renvoie des légendes, des étiquettes et des objets pour une image, pas son texte remis à sa place dans le document." }
        d: { en: "Key Phrase Extraction returns the main phrases of a text; it doesn't insert text at a position.", fr: "Key Phrase Extraction renvoie les expressions principales d'un texte ; il n'insère pas de texte à une position donnée." }
    references:
      - title: Text Merge Cognitive Skill - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-textmerger

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-51-03
    objective: "5.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys is designing a new Azure AI Search index for a RAG application. The index will hold about 30 million chunk vectors of 3,072 dimensions produced by `text-embedding-3-large`. Capacity planning shows that the vector index size would exceed the vector index quota of the service tier.

        You need to reduce the vector index size by about four times. The solution must keep the same embedding model and the same number of dimensions.

        What should you add to the index definition?
      fr: |
        Tailspin Toys conçoit un nouvel index Azure AI Search pour une application RAG. L'index contiendra environ 30 millions de vecteurs de blocs de 3 072 dimensions produits par `text-embedding-3-large`. La planification de la capacité montre que la taille de l'index vectoriel dépasserait le quota d'index vectoriel du niveau tarifaire du service.

        Vous devez réduire la taille de l'index vectoriel d'environ quatre fois. La solution doit conserver le même modèle d'embedding et le même nombre de dimensions.

        Que devez-vous ajouter à la définition de l'index ?
    body:
      options:
        - { id: a, text: { en: "An `exhaustiveKnn` algorithm, referenced by the vector profile instead of `hnsw`", fr: "Un algorithme `exhaustiveKnn`, référencé par le profil vectoriel à la place de `hnsw`" } }
        - { id: b, text: { en: "The `retrievable` attribute set to `false` on the vector field", fr: "L'attribut `retrievable` défini sur `false` sur le champ vectoriel" } }
        - { id: c, text: { en: "A `scalarQuantization` compression, referenced by the vector profile", fr: "Une compression `scalarQuantization`, référencée par le profil vectoriel" } }
        - { id: d, text: { en: "An Azure OpenAI vectorizer, referenced by the vector profile", fr: "Un vectoriseur Azure OpenAI, référencé par le profil vectoriel" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Scalar quantization compresses each float32 value of the vectors to int8, which reduces the vector index size about fourfold without changing the model or the dimensions. The compression is defined in `vectorSearch.compressions` and referenced by the profile of the vector field; rescoring with the original vectors offsets most of the precision loss.
        fr: |
          La quantification scalaire compresse chaque valeur float32 des vecteurs en int8, ce qui réduit la taille de l'index vectoriel d'environ quatre fois sans changer le modèle ni les dimensions. La compression se définit dans `vectorSearch.compressions` et est référencée par le profil du champ vectoriel ; le recalcul du score avec les vecteurs d'origine compense l'essentiel de la perte de précision.
      options:
        a: { en: "Exhaustive KNN changes how vectors are searched (it scans them all), not how much space they take; it is also slower at this scale.", fr: "Le KNN exhaustif change la façon de rechercher les vecteurs (il les parcourt tous), pas la place qu'ils occupent ; il est aussi plus lent à cette échelle." }
        b: { en: "`retrievable` only controls whether the vector is returned in results; the vector index used for search keeps the same size.", fr: "`retrievable` détermine seulement si le vecteur est renvoyé dans les résultats ; l'index vectoriel utilisé pour la recherche garde la même taille." }
        d: { en: "A vectorizer converts query text to a vector at query time; it doesn't compress the stored vectors.", fr: "Un vectoriseur convertit le texte de la requête en vecteur au moment de la requête ; il ne compresse pas les vecteurs stockés." }
    references:
      - title: Compress Vectors Using Quantization - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-quantization
      - title: Eliminate Optional Vector Instances - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-storage-options

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-51-04
    objective: "5.1.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a prompt agent in Foundry Agent Service for its HR staff. The HR policies are indexed in an Azure AI Search index named **policies-index**, and the benefit guides in another index named **benefits-index**. The agent must answer from these documents.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'un agent d'invite dans Foundry Agent Service pour son équipe RH. Les politiques RH sont indexées dans un index Azure AI Search nommé **policies-index**, et les guides des avantages sociaux dans un autre index nommé **benefits-index**. L'agent doit répondre à partir de ces documents.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Enabling memory for the agent lets it answer from the documents in policies-index.
            fr: L'activation de la mémoire de l'agent lui permet de répondre à partir des documents de policies-index.
        - id: s2
          text:
            en: A function tool whose code queries policies-index by using `SearchClient` and returns the passages can ground the agent's answers.
            fr: Un outil de fonction dont le code interroge policies-index avec `SearchClient` et renvoie les passages peut ancrer les réponses de l'agent.
        - id: s3
          text:
            en: A single Azure AI Search tool can target both policies-index and benefits-index.
            fr: Un seul outil Azure AI Search peut cibler à la fois policies-index et benefits-index.
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          Memory keeps what the agent learns from conversations (user preferences, summaries of past exchanges); it isn't a way to retrieve indexed documents. Function calling runs your code: when that code queries the index and returns passages, the model answers from them, so the answers are grounded. The Azure AI Search tool targets one index only, so the two indexes need another design, such as code that queries both.
        fr: |
          La mémoire conserve ce que l'agent apprend des conversations (préférences de l'utilisateur, résumés des échanges passés) ; ce n'est pas un moyen de récupérer des documents indexés. L'appel de fonction exécute votre code : quand ce code interroge l'index et renvoie des passages, le modèle répond à partir de ceux-ci, et les réponses sont donc ancrées. L'outil Azure AI Search ne cible qu'un seul index : les deux index demandent une autre conception, par exemple un code qui interroge les deux.
      options:
        s1: { en: "Memory content is extracted from conversations, not from curated documents in an index.", fr: "Le contenu de la mémoire est extrait des conversations, pas de documents organisés dans un index." }
        s3: { en: "Learn states that the tool can only target one index.", fr: "Learn indique que l'outil ne peut cibler qu'un seul index." }
    references:
      - title: Connect a Foundry IQ (Azure AI Search) index to Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search
      - title: What is Memory? - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-51-05
    objective: "5.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys builds a new RAG pipeline for its assembly guides, which are PDF files in Azure Blob Storage. The skillset uses the Document Layout skill so that chunks follow the headings of each guide. The input `file_data` of the skill has the source `/document/file_data`.

        You create the indexer and run it. The execution history shows that the Document Layout skill received no file content for any guide, and no chunk is created.

        Which parameter should you set in the indexer configuration?
      fr: |
        Wingtip Toys crée un nouveau pipeline RAG pour ses guides de montage, qui sont des fichiers PDF dans Stockage Blob Azure. L'ensemble de compétences utilise la compétence Document Layout pour que les blocs suivent les titres de chaque guide. L'entrée `file_data` de la compétence a pour source `/document/file_data`.

        Vous créez l'indexeur et l'exécutez. L'historique d'exécution montre que la compétence Document Layout n'a reçu le contenu d'aucun fichier, et aucun bloc n'est créé.

        Quel paramètre devez-vous définir dans la configuration de l'indexeur ?
    body:
      options:
        - { id: a, text: "`\"imageAction\": \"generateNormalizedImages\"`" }
        - { id: b, text: "`\"dataToExtract\": \"allMetadata\"`" }
        - { id: c, text: "`\"indexedFileNameExtensions\": \".pdf\"`" }
        - { id: d, text: "`\"allowSkillsetToReadFileData\": true`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The Document Layout skill analyzes the original file, not the cracked text. Setting `allowSkillsetToReadFileData` to true makes the indexer create the `/document/file_data` path with the file downloaded from Blob Storage; without it, the skill input has nothing to read.
        fr: |
          La compétence Document Layout analyse le fichier d'origine, pas le texte craqué. Définir `allowSkillsetToReadFileData` sur true fait créer par l'indexeur le chemin `/document/file_data` avec le fichier téléchargé depuis Stockage Blob ; sans ce paramètre, l'entrée de la compétence n'a rien à lire.
      options:
        a: { en: "`imageAction` produces normalized images for the OCR and Image Analysis skills; it doesn't create `/document/file_data`.", fr: "`imageAction` produit des images normalisées pour les compétences OCR et Image Analysis ; il ne crée pas `/document/file_data`." }
        b: { en: "`allMetadata` adds content-type metadata to the extraction; it doesn't pass the original file to the skillset.", fr: "`allMetadata` ajoute des métadonnées propres au type de contenu à l'extraction ; il ne transmet pas le fichier d'origine à l'ensemble de compétences." }
        c: { en: "The guides are already PDF files: filtering on the extension doesn't give the skill access to their content.", fr: "Les guides sont déjà des fichiers PDF : filtrer sur l'extension ne donne pas à la compétence l'accès à leur contenu." }
    references:
      - title: Document Layout Skill - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-document-intelligence-layout

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-51-06
    objective: "5.1.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware runs an Azure AI Search indexer that processes about 3,000 new DOCX and digital PDF files per day. The skillset contains a Text Split skill and an Azure OpenAI Embedding skill that calls an embedding deployment by using the managed identity of the search service. The skillset has no `cognitiveServices` property, and the indexer doesn't extract images.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware exécute un indexeur Azure AI Search qui traite environ 3 000 nouveaux fichiers DOCX et PDF numériques par jour. L'ensemble de compétences contient une compétence Text Split et une compétence Azure OpenAI Embedding qui appelle un déploiement d'embedding avec l'identité managée du service de recherche. L'ensemble de compétences n'a pas de propriété `cognitiveServices`, et l'indexeur n'extrait pas d'images.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text:
            en: Every new file is chunked and embedded each day, although no Foundry resource is attached to the skillset.
            fr: Chaque nouveau fichier est découpé en blocs et vectorisé chaque jour, bien qu'aucune ressource Foundry ne soit attachée à l'ensemble de compétences.
        - id: s2
          text:
            en: If you replace the Text Split skill with the Document Layout skill and set `allowSkillsetToReadFileData` to true, every new file is processed each day without any other change.
            fr: Si vous remplacez la compétence Text Split par la compétence Document Layout et définissez `allowSkillsetToReadFileData` sur true, chaque nouveau fichier est traité chaque jour sans aucune autre modification.
        - id: s3
          text:
            en: If you attach a Foundry resource by using `AIServicesByIdentity`, the transactions of the Text Split skill are billed to that resource.
            fr: Si vous attachez une ressource Foundry avec `AIServicesByIdentity`, les transactions de la compétence Text Split sont facturées sur cette ressource.
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          Text Split is a utility skill that calls no Foundry Tool: it is never billed and isn't subject to the free limit. The Azure OpenAI Embedding skill calls your own deployment and is charged at the Azure OpenAI price, so the current skillset needs no attached resource. The Document Layout skill, by contrast, needs a billable Foundry resource attached to the skillset beyond 20 documents per indexer per day.
        fr: |
          Text Split est une compétence utilitaire qui n'appelle aucun outil Foundry : elle n'est jamais facturée et n'est pas soumise à la limite gratuite. La compétence Azure OpenAI Embedding appelle votre propre déploiement et est facturée au tarif d'Azure OpenAI ; l'ensemble de compétences actuel n'a donc besoin d'aucune ressource attachée. La compétence Document Layout, en revanche, exige une ressource Foundry facturable attachée à l'ensemble de compétences au-delà de 20 documents par indexeur et par jour.
      options:
        s2: { en: "Without a billable Foundry resource in `cognitiveServices`, the Document Layout skill stops after 20 documents per indexer per day.", fr: "Sans ressource Foundry facturable dans `cognitiveServices`, la compétence Document Layout s'arrête après 20 documents par indexeur et par jour." }
        s3: { en: "Utility skills such as Text Split and Text Merge aren't billable, whatever resource is attached.", fr: "Les compétences utilitaires comme Text Split et Text Merge ne sont pas facturables, quelle que soit la ressource attachée." }
    references:
      - title: Attach Resource to Skillset for Billing - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services
      - title: Azure OpenAI Embedding Skill - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-51-07
    objective: "5.1.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has an Azure AI Search index named **parts-index**. Its `contentVector` field uses a vector profile that has an Azure OpenAI vectorizer, and its text fields are searchable and retrievable. The index has no semantic configuration, and a company policy keeps the semantic ranker disabled on the search service.

        You are adding the Azure AI Search tool to a prompt agent in Foundry Agent Service. Users ask about exact part numbers, such as TX-4410-B, and also describe faults in their own words. The tool must retrieve relevant passages for both kinds of questions.

        Which query type should you configure on the tool?
      fr: |
        Tailspin Toys dispose d'un index Azure AI Search nommé **parts-index**. Son champ `contentVector` utilise un profil vectoriel doté d'un vectoriseur Azure OpenAI, et ses champs texte sont interrogeables et récupérables. L'index n'a pas de configuration sémantique, et une politique de l'entreprise maintient le classeur sémantique désactivé sur le service de recherche.

        Vous ajoutez l'outil Azure AI Search à un agent d'invite dans Foundry Agent Service. Les utilisateurs posent des questions sur des références de pièces exactes, comme TX-4410-B, et décrivent aussi des pannes avec leurs propres mots. L'outil doit récupérer des passages pertinents pour les deux types de questions.

        Quel type de requête devez-vous configurer sur l'outil ?
    body:
      options:
        - { id: a, text: "`vector_semantic_hybrid`" }
        - { id: b, text: "`vector`" }
        - { id: c, text: "`vector_simple_hybrid`" }
        - { id: d, text: "`simple`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `vector_simple_hybrid` combines a keyword query, which matches exact terms such as part numbers, with a vector query, which matches the meaning of paraphrased descriptions; the results are merged with RRF. It needs a vector field with a vectorizer, which parts-index has, and no semantic configuration, so it fits the policy that keeps the semantic ranker off.
        fr: |
          `vector_simple_hybrid` combine une requête par mots clés, qui trouve les termes exacts comme les références de pièces, avec une requête vectorielle, qui trouve le sens des descriptions reformulées ; les résultats sont fusionnés par RRF. Il exige un champ vectoriel doté d'un vectoriseur, ce que parts-index possède, et aucune configuration sémantique : il respecte donc la politique qui maintient le classeur sémantique désactivé.
      options:
        a: { en: "The default `vector_semantic_hybrid` adds semantic reranking, which needs a semantic configuration and the semantic ranker, both unavailable here.", fr: "La valeur par défaut `vector_semantic_hybrid` ajoute le reclassement sémantique, qui exige une configuration sémantique et le classeur sémantique, tous deux indisponibles ici." }
        b: { en: "A vector-only query matches meaning but often misses exact identifiers such as part numbers, which keyword search handles best.", fr: "Une requête uniquement vectorielle trouve le sens mais manque souvent les identifiants exacts comme les références de pièces, que la recherche par mots clés traite le mieux." }
        d: { en: "A keyword-only query matches part numbers but not faults described in other words than those of the documents.", fr: "Une requête uniquement par mots clés trouve les références de pièces, mais pas les pannes décrites avec d'autres mots que ceux des documents." }
    references:
      - title: Connect a Foundry IQ (Azure AI Search) index to Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search
      - title: Hybrid Search Overview - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-51-08
    objective: "5.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Litware has an Azure AI Search index named **support-kb**. Its `contentVector` field uses a vector profile that has no vectorizer, and the index has a semantic configuration named `support-semantic`. A workflow already holds the embedding of each user question, computed with the model that produced the vectors of the index.

        The workflow must send one request that meets the following requirements:

        - The full-text and vector results are merged, and then reranked by the semantic ranker.
        - The semantic ranker receives as many candidates from the vector query as it can use, and no more.
        - Each of the five results includes the most relevant sentences of its passage, taken verbatim from the index.

        How should you complete the request body? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware dispose d'un index Azure AI Search nommé **support-kb**. Son champ `contentVector` utilise un profil vectoriel sans vectoriseur, et l'index possède une configuration sémantique nommée `support-semantic`. Un flux de travail dispose déjà de l'embedding de chaque question de l'utilisateur, calculé avec le modèle qui a produit les vecteurs de l'index.

        Le flux de travail doit envoyer une seule requête qui satisfait les exigences suivantes :

        - les résultats en texte intégral et vectoriels sont fusionnés, puis reclassés par le classeur sémantique ;
        - le classeur sémantique reçoit de la requête vectorielle autant de candidats qu'il peut en utiliser, et pas davantage ;
        - chacun des cinq résultats inclut les phrases les plus pertinentes de son passage, reprises telles quelles de l'index.

        Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "search": "printer shows error E-104 after a toner change",
          "vectorQueries": [
            {
              [[kind]],
              "fields": "contentVector",
              [[k]]
            }
          ],
          "queryType": "semantic",
          "semanticConfiguration": "support-semantic",
          [[extra]],
          "select": "title,chunk",
          "top": 5
        }
      slots:
        - id: kind
          options:
            - { id: ktext, text: "\"kind\": \"text\", \"text\": \"printer shows error E-104 after a toner change\"" }
            - { id: kvector, text: "\"kind\": \"vector\", \"vector\": [0.0132, -0.0271, ...]" }
            - { id: kmixed, text: "\"kind\": \"text\", \"vector\": [0.0132, -0.0271, ...]" }
        - id: k
          options:
            - { id: k5, text: "\"k\": 5" }
            - { id: k50, text: "\"k\": 50" }
            - { id: k500, text: "\"k\": 500" }
        - id: extra
          options:
            - { id: answers, text: "\"answers\": \"extractive\"" }
            - { id: lang, text: "\"queryLanguage\": \"en-us\"" }
            - { id: captions, text: "\"captions\": \"extractive\"" }
    answer:
      values: { kind: kvector, k: k50, extra: captions }
    explanation:
      correct:
        en: |
          Without a vectorizer, the search service can't convert text at query time, so the workflow sends its own embedding in a vector query of kind `vector`. The semantic ranker reranks at most 50 results, and Learn recommends setting `k` to 50 whenever semantic ranking is combined with vectors; `top` then limits the response to five. Semantic captions are returned for each result and are extracted verbatim from the document.
        fr: |
          Sans vectoriseur, le service de recherche ne peut pas convertir le texte au moment de la requête : le flux de travail envoie donc son propre embedding dans une requête vectorielle de type `vector`. Le classeur sémantique reclasse au maximum 50 résultats, et Learn recommande de définir `k` sur 50 dès que le classement sémantique est combiné à des vecteurs ; `top` limite ensuite la réponse à cinq. Les légendes sémantiques sont renvoyées pour chaque résultat et sont extraites telles quelles du document.
      options:
        ktext: { en: "A vector query of kind `text` needs a vectorizer on the field's profile, which support-kb doesn't have.", fr: "Une requête vectorielle de type `text` exige un vectoriseur sur le profil du champ, ce que support-kb n'a pas." }
        kmixed: { en: "Kind `text` expects a `text` property; a precomputed vector goes in a query of kind `vector`.", fr: "Le type `text` attend une propriété `text` ; un vecteur précalculé se place dans une requête de type `vector`." }
        k5: { en: "Five neighbors deprive the semantic ranker of inputs: it can use up to 50.", fr: "Cinq voisins privent le classeur sémantique d'entrées : il peut en utiliser jusqu'à 50." }
        k500: { en: "The semantic ranker uses only 50 inputs; 500 neighbors exceed what it can use.", fr: "Le classeur sémantique n'utilise que 50 entrées ; 500 voisins dépassent ce qu'il peut utiliser." }
        answers: { en: "Semantic answers are returned once for the query in `@search.answers`, not for each result.", fr: "Les réponses sémantiques sont renvoyées une fois pour la requête dans `@search.answers`, pas pour chaque résultat." }
        lang: { en: "`queryLanguage` sets the language of the query; it doesn't add sentences to the results.", fr: "`queryLanguage` définit la langue de la requête ; il n'ajoute pas de phrases aux résultats." }
    references:
      - title: Create a Hybrid Query - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
      - title: Add Semantic Ranking - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/semantic-how-to-query-request

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-51-09
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Relecloud indexes 12,000 scanned service manuals from an Azure Blob Storage container. The indexer first ran with `imageAction` left at its default value, so the chunks in the index contain no OCR text. The manuals haven't changed since that run.

        You set `imageAction` to `generateNormalizedImages`, add the OCR and Text Merge skills, and set the merged text as the input of the Text Split skill. You run the indexer, but the execution history shows that no document was processed.

        You need every manual to be processed by the updated skillset. The solution must minimize administrative effort and must not modify the blobs.

        What should you do?
      fr: |
        Relecloud indexe 12 000 manuels d'entretien numérisés depuis un conteneur Stockage Blob Azure. L'indexeur s'est d'abord exécuté avec `imageAction` à sa valeur par défaut : les blocs de l'index ne contiennent donc aucun texte OCR. Les manuels n'ont pas changé depuis cette exécution.

        Vous définissez `imageAction` sur `generateNormalizedImages`, ajoutez les compétences OCR et Text Merge, et définissez le texte fusionné comme entrée de la compétence Text Split. Vous exécutez l'indexeur, mais l'historique d'exécution montre qu'aucun document n'a été traité.

        Vous devez faire traiter chaque manuel par l'ensemble de compétences mis à jour. La solution doit réduire au minimum l'effort administratif et ne doit pas modifier les objets blob.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Schedule the indexer every five minutes so that change detection picks up the updated skillset.", fr: "Planifier l'indexeur toutes les cinq minutes pour que la détection des modifications prenne en compte l'ensemble de compétences mis à jour." } }
        - { id: b, text: { en: "Reset the indexer so that it clears its high-water mark, and then run the indexer again.", fr: "Réinitialiser l'indexeur pour qu'il efface son état de suivi des modifications, puis exécuter de nouveau l'indexeur." } }
        - { id: c, text: { en: "Re-create the skillset under a new name, and then update the indexer to reference it.", fr: "Recréer l'ensemble de compétences sous un nouveau nom, puis mettre à jour l'indexeur pour qu'il le référence." } }
        - { id: d, text: { en: "Resave the metadata of each blob to update its timestamp, and then run the indexer again.", fr: "Réenregistrer les métadonnées de chaque objet blob pour mettre à jour son horodatage, puis exécuter de nouveau l'indexeur." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A blob indexer tracks changes with the timestamps of the blobs: when the content is unchanged, a run processes nothing, even if the skillset changed. Resetting the indexer clears its high-water mark and flags every document for a full overwrite, so the next run sends all 12,000 manuals through the new OCR, Text Merge and Text Split steps. Reset is passive, so you must run the indexer after it.
        fr: |
          Un indexeur d'objets blob suit les modifications grâce aux horodatages des objets blob : quand le contenu n'a pas changé, une exécution ne traite rien, même si l'ensemble de compétences a changé. La réinitialisation de l'indexeur efface son état de suivi des modifications (high-water mark) et marque chaque document pour un remplacement complet : l'exécution suivante fait passer les 12 000 manuels par les nouvelles étapes OCR, Text Merge et Text Split. La réinitialisation est passive : vous devez exécuter l'indexeur ensuite.
      options:
        a: { en: "Change detection relies on blob timestamps, not on the skillset definition; more frequent runs still process no unchanged manual.", fr: "La détection des modifications repose sur les horodatages des objets blob, pas sur la définition de l'ensemble de compétences ; des exécutions plus fréquentes ne traitent toujours aucun manuel inchangé." }
        c: { en: "The change tracking state belongs to the indexer: pointing it at a new skillset doesn't make it reprocess unchanged blobs.", fr: "L'état du suivi des modifications appartient à l'indexeur : le faire pointer vers un nouvel ensemble de compétences ne lui fait pas retraiter les objets blob inchangés." }
        d: { en: "Updating the timestamps would trigger reprocessing, but it modifies 12,000 blobs, which the requirements forbid, and takes more effort.", fr: "Mettre à jour les horodatages déclencherait le retraitement, mais cela modifie 12 000 objets blob, ce que les exigences interdisent, et demande plus d'effort." }
    references:
      - title: Run or Reset Indexers - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/search-howto-run-reset-indexers

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-51-10
    objective: "5.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso has an Azure AI Search service named **srch-contoso** that has a system-assigned managed identity and role-based access control enabled. The vector profile of the index **guides-index** has an Azure OpenAI vectorizer that targets an embedding deployment in an Azure OpenAI resource named **aoai-contoso**, without `apiKey` or `authIdentity`. The embedding skill of the skillset still authenticates with an API key.

        An Azure Functions app named **func-rag** has a system-assigned managed identity. It uses `SearchClient` with `DefaultAzureCredential` to send hybrid queries that contain a `VectorizableTextQuery` with the question text only. Its calls to the chat model are already configured.

        You need the queries of func-rag to succeed without keys. The solution must follow the principle of least privilege.

        Which two role assignments should you create? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'un service Azure AI Search nommé **srch-contoso** qui possède une identité managée affectée par le système et sur lequel le contrôle d'accès en fonction du rôle est activé. Le profil vectoriel de l'index **guides-index** possède un vectoriseur Azure OpenAI qui cible un déploiement d'embedding d'une ressource Azure OpenAI nommée **aoai-contoso**, sans `apiKey` ni `authIdentity`. La compétence d'embedding de l'ensemble de compétences s'authentifie encore avec une clé API.

        Une application Azure Functions nommée **func-rag** possède une identité managée affectée par le système. Elle utilise `SearchClient` avec `DefaultAzureCredential` pour envoyer des requêtes hybrides qui contiennent une `VectorizableTextQuery` avec uniquement le texte de la question. Ses appels au modèle de conversation sont déjà configurés.

        Vous devez faire en sorte que les requêtes de func-rag réussissent sans clé. La solution doit respecter le principe du moindre privilège.

        Quelles sont les deux attributions de rôle que vous devez créer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Cognitive Services OpenAI User on aoai-contoso, for the managed identity of func-rag", fr: "Cognitive Services OpenAI User sur aoai-contoso, pour l'identité managée de func-rag" } }
        - { id: b, text: { en: "Search Index Data Reader on srch-contoso, for the managed identity of func-rag", fr: "Search Index Data Reader sur srch-contoso, pour l'identité managée de func-rag" } }
        - { id: c, text: { en: "Search Index Data Contributor on srch-contoso, for the managed identity of func-rag", fr: "Search Index Data Contributor sur srch-contoso, pour l'identité managée de func-rag" } }
        - { id: d, text: { en: "Cognitive Services OpenAI User on aoai-contoso, for the managed identity of srch-contoso", fr: "Cognitive Services OpenAI User sur aoai-contoso, pour l'identité managée de srch-contoso" } }
        - { id: e, text: { en: "Search Service Contributor on srch-contoso, for the managed identity of func-rag", fr: "Search Service Contributor sur srch-contoso, pour l'identité managée de func-rag" } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          func-rag only reads the index, so its identity needs Search Index Data Reader on the search service. The query vector isn't computed by func-rag: the vectorizer runs inside srch-contoso and, without a key or a user-assigned identity, calls aoai-contoso with the system-assigned identity of the search service, which therefore needs Cognitive Services OpenAI User. The embedding skill still uses its key, so that identity doesn't have the role yet.
        fr: |
          func-rag ne fait que lire l'index : son identité a besoin de Search Index Data Reader sur le service de recherche. Le vecteur de requête n'est pas calculé par func-rag : le vectoriseur s'exécute dans srch-contoso et, sans clé ni identité affectée par l'utilisateur, appelle aoai-contoso avec l'identité affectée par le système du service de recherche, qui a donc besoin de Cognitive Services OpenAI User. La compétence d'embedding utilise encore sa clé : cette identité n'a donc pas encore le rôle.
      options:
        a: { en: "func-rag sends only text; the search service, not the function, calls the embedding deployment at query time.", fr: "func-rag n'envoie que du texte ; c'est le service de recherche, pas la fonction, qui appelle le déploiement d'embedding au moment de la requête." }
        c: { en: "Search Index Data Contributor also allows loading documents, which func-rag doesn't need: it breaks least privilege.", fr: "Search Index Data Contributor permet aussi de charger des documents, ce dont func-rag n'a pas besoin : il enfreint le moindre privilège." }
        e: { en: "Search Service Contributor manages search objects but can't query indexes through role-based access.", fr: "Search Service Contributor gère les objets de recherche mais ne peut pas interroger les index par le contrôle d'accès en fonction du rôle." }
    references:
      - title: Azure OpenAI Vectorizer - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-vectorizer-azure-open-ai
      - title: Connect Using Azure Roles - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/search-security-rbac
