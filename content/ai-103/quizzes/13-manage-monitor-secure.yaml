chapter: 13-manage-monitor-secure
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-13-01
    objective: "1.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        You plan the tokens-per-minute (TPM) quota of the Azure OpenAI models that your teams deploy in Microsoft Foundry.

        At which level is TPM quota assigned?
      fr: |
        Vous planifiez le quota de jetons par minute (TPM) des modèles Azure OpenAI que vos équipes déploient dans Microsoft Foundry.

        À quel niveau le quota de TPM est-il attribué ?
    body:
      options:
        - { id: a, text: { en: "To each Foundry resource, for all the models and regions that the resource uses", fr: "À chaque ressource Foundry, pour tous les modèles et toutes les régions qu'elle utilise" } }
        - { id: b, text: { en: "To each deployment, independently of its region and of its subscription", fr: "À chaque déploiement, indépendamment de sa région et de son abonnement" } }
        - { id: c, text: { en: "To the subscription, per region, per model and per deployment type", fr: "À l'abonnement, par région, par modèle et par type de déploiement" } }
        - { id: d, text: { en: "To the Microsoft Entra tenant, per model, for all the regions together", fr: "Au locataire Microsoft Entra, par modèle, pour toutes les régions ensemble" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Quota is assigned to a subscription per region, per model and per deployment type, in TPM. You then split that regional quota among your deployments of the model; each deployment enforces a rate limit derived from the TPM that it receives.
        fr: |
          Le quota est attribué à un abonnement par région, par modèle et par type de déploiement, en TPM. Vous répartissez ensuite ce quota régional entre vos déploiements du modèle ; chaque déploiement applique une limite de débit dérivée du TPM qu'il reçoit.
      options:
        a: { en: "Several Foundry resources of the same subscription and region draw on the same quota; it isn't a per-resource allowance.", fr: "Plusieurs ressources Foundry du même abonnement et de la même région puisent dans le même quota ; ce n'est pas une allocation par ressource." }
        b: { en: "A deployment receives a share of the quota, and that share counts against the quota of its subscription and region.", fr: "Un déploiement reçoit une part du quota, et cette part s'impute sur le quota de son abonnement et de sa région." }
        d: { en: "Quota isn't global to the tenant: each region of each subscription has its own value per model and deployment type.", fr: "Le quota n'est pas global au locataire : chaque région de chaque abonnement a sa propre valeur par modèle et par type de déploiement." }
    references:
      - title: Manage Azure OpenAI in Microsoft Foundry Models quota (classic)
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/quota

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-13-02
    objective: "1.3.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer at Contoso writes a Python script that calls a Foundry project through `AIProjectClient`. The same code must authenticate with the developer's Azure CLI sign-in (`az login`) on a workstation, and with the managed identity of an App Service app once deployed. No key may appear in the code or in the configuration.

        Which credential should the code pass to `AIProjectClient`?
      fr: |
        Un développeur de Contoso écrit un script Python qui appelle un projet Foundry au moyen de `AIProjectClient`. Le même code doit s'authentifier avec la connexion Azure CLI du développeur (`az login`) sur un poste de travail, et avec l'identité managée d'une application App Service une fois déployé. Aucune clé ne doit figurer dans le code ni dans la configuration.

        Quelles informations d'identification le code doit-il passer à `AIProjectClient` ?
    body:
      options:
        - { id: a, text: "`ManagedIdentityCredential()`" }
        - { id: b, text: "`AzureCliCredential()`" }
        - { id: c, text: "`AzureKeyCredential(os.environ[\"FOUNDRY_KEY\"])`" }
        - { id: d, text: "`DefaultAzureCredential()`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `DefaultAzureCredential` tries a chain of credentials: in Azure it finds the managed identity of the host, and on a workstation it falls back to developer tools such as the Azure CLI sign-in. The same code therefore works in both places without a key. Once the app runs only in Azure, Learn recommends replacing it with a specific credential such as `ManagedIdentityCredential`.
        fr: |
          `DefaultAzureCredential` essaie une chaîne d'informations d'identification : dans Azure, il trouve l'identité managée de l'hôte, et sur un poste de travail il se rabat sur les outils du développeur comme la connexion Azure CLI. Le même code fonctionne donc aux deux endroits sans clé. Une fois que l'application ne s'exécute plus que dans Azure, Learn recommande de le remplacer par des informations d'identification spécifiques comme `ManagedIdentityCredential`.
      options:
        a: { en: "Managed identity is unavailable on a local workstation, so ManagedIdentityCredential fails during local development.", fr: "L'identité managée n'est pas disponible sur un poste de travail local : ManagedIdentityCredential échoue pendant le développement local." }
        b: { en: "AzureCliCredential works on the workstation, but the App Service app has no Azure CLI sign-in: it must use its managed identity.", fr: "AzureCliCredential fonctionne sur le poste de travail, mais l'application App Service n'a pas de connexion Azure CLI : elle doit utiliser son identité managée." }
        c: { en: "AzureKeyCredential authenticates with a key, which the requirement forbids, and keys bypass Azure RBAC.", fr: "AzureKeyCredential s'authentifie avec une clé, ce que l'exigence interdit, et les clés contournent Azure RBAC." }
    references:
      - title: Credential chains in the Azure Identity library for Python - Python on Azure
        url: https://learn.microsoft.com/en-us/azure/developer/python/sdk/authentication/credential-chains

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-13-03
    objective: "1.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam evaluates the responses of its RAG assistant in Microsoft Foundry. Each row of the dataset contains the query, the retrieved context and the response. For most rows, the Relevance evaluator returns 5 and the Groundedness evaluator returns 2, on a scale of 1 to 5.

        What do these results indicate?
      fr: |
        Fabrikam évalue les réponses de son assistant RAG dans Microsoft Foundry. Chaque ligne du jeu de données contient la requête, le contexte récupéré et la réponse. Pour la plupart des lignes, l'évaluateur Relevance renvoie 5 et l'évaluateur Groundedness renvoie 2, sur une échelle de 1 à 5.

        Qu'indiquent ces résultats ?
    body:
      options:
        - { id: a, text: { en: "The responses address the questions, but they contain claims that the retrieved context doesn't support.", fr: "Les réponses traitent les questions, mais elles contiennent des affirmations que le contexte récupéré n'étaye pas." } }
        - { id: b, text: { en: "The retrieved context is unrelated to the questions, but the responses are accurate and complete.", fr: "Le contexte récupéré est sans rapport avec les questions, mais les réponses sont exactes et complètes." } }
        - { id: c, text: { en: "The responses are supported by the retrieved context, but they don't answer what the users asked.", fr: "Les réponses sont étayées par le contexte récupéré, mais elles ne répondent pas à ce que les utilisateurs ont demandé." } }
        - { id: d, text: { en: "The content filter removed parts of the responses, which lowered their groundedness score.", fr: "Le filtre de contenu a retiré des parties des réponses, ce qui a abaissé leur score d'ancrage." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Relevance measures how well the response addresses the query, and Groundedness measures how well the response is supported by the retrieved context. A high relevance with a low groundedness means on-topic answers that add statements not found in the context: a grounding quality problem to fix in the prompt or the retrieval, not a topic problem.
        fr: |
          Relevance mesure dans quelle mesure la réponse traite la requête, et Groundedness mesure dans quelle mesure la réponse est étayée par le contexte récupéré. Une pertinence élevée avec un ancrage faible signifie des réponses dans le sujet qui ajoutent des affirmations absentes du contexte : un problème de qualité de l'ancrage à corriger dans l'invite ou la récupération, pas un problème de sujet.
      options:
        b: { en: "Neither score measures whether the retrieved context matches the question (that's the Retrieval evaluator), and a groundedness of 2 contradicts accurate, supported responses.", fr: "Aucun de ces scores ne mesure si le contexte récupéré correspond à la question (c'est le rôle de l'évaluateur Retrieval), et un ancrage de 2 contredit des réponses exactes et étayées." }
        c: { en: "This would give the opposite pattern: a high groundedness and a low relevance.", fr: "Ce cas donnerait le schéma inverse : un ancrage élevé et une pertinence faible." }
        d: { en: "Content filters act on harmful content at run time; they don't explain a low groundedness on responses that were returned.", fr: "Les filtres de contenu agissent sur le contenu nuisible à l'exécution ; ils n'expliquent pas un ancrage faible sur des réponses qui ont été renvoyées." }
    references:
      - title: Built-in Evaluators Reference - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-13-04
    objective: "1.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank indexes product manuals from Azure Blob Storage into Azure AI Search for a Foundry agent. The indexer runs a skillset that calls Foundry Tools. Many manuals are scanned PDF files, and the agent can't answer any question about them.

        The last indexer run reports `success`, `itemsFailed` is 0, and the document count of the index matches the number of files in the container.

        Where should you look first to confirm why the content of the scanned manuals isn't searchable?
      fr: |
        Woodgrove Bank indexe des manuels produits depuis Stockage Blob Azure dans Azure AI Search pour un agent Foundry. L'indexeur exécute un ensemble de compétences qui appelle Foundry Tools. De nombreux manuels sont des fichiers PDF numérisés, et l'agent ne peut répondre à aucune question à leur sujet.

        La dernière exécution de l'indexeur indique `success`, `itemsFailed` vaut 0 et le nombre de documents de l'index correspond au nombre de fichiers du conteneur.

        Où devez-vous regarder en premier pour confirmer pourquoi le contenu des manuels numérisés n'est pas consultable ?
    body:
      options:
        - { id: a, text: { en: "The top-level `status` value that Get Indexer Status returns", fr: "La valeur `status` de premier niveau renvoyée par Get Indexer Status" } }
        - { id: b, text: { en: "The warnings in the execution details of the last indexer run", fr: "Les avertissements dans les détails d'exécution de la dernière exécution de l'indexeur" } }
        - { id: c, text: { en: "The Throttled search queries percentage metric of the service", fr: "La métrique Throttled search queries percentage du service" } }
        - { id: d, text: { en: "The Search Latency metric of the search service", fr: "La métrique Search Latency du service de recherche" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A run can report `success` and still leave content out. Documents with errors under the Max failed items limit appear in `itemsFailed`, which is 0 here; files that are indexed but yield no text, such as images or PDFs without a text layer, are reported as warnings. The warnings of the run show which manuals produced no text, which points to extracting text from the images (OCR) in the pipeline.
        fr: |
          Une exécution peut indiquer `success` et laisser quand même du contenu de côté. Les documents en erreur sous la limite Max failed items apparaissent dans `itemsFailed`, qui vaut 0 ici ; les fichiers indexés mais qui ne produisent aucun texte, comme des images ou des PDF sans couche de texte, sont signalés par des avertissements. Les avertissements de l'exécution montrent quels manuels n'ont produit aucun texte, ce qui oriente vers l'extraction du texte des images (OCR) dans le pipeline.
      options:
        a: { en: "The top-level status only says that the indexer is available to run; it says nothing about the content of the documents.", fr: "L'état de premier niveau indique seulement que l'indexeur est disponible pour s'exécuter ; il ne dit rien du contenu des documents." }
        c: { en: "Throttled queries reveal a lack of query capacity; here every query runs, but the index holds no text for the scanned manuals.", fr: "Les requêtes limitées révèlent un manque de capacité de requêtes ; ici toutes les requêtes s'exécutent, mais l'index ne contient aucun texte pour les manuels numérisés." }
        d: { en: "Latency measures how long queries take; it doesn't show that documents were indexed without text.", fr: "La latence mesure la durée des requêtes ; elle ne montre pas que des documents ont été indexés sans texte." }
    references:
      - title: Monitor Indexer Status and Results - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/search-monitor-indexers

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-13-05
    objective: "1.3.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a Global Standard deployment named **chat-web** that is assigned 200,000 tokens per minute (TPM). Its usage stays well below that value.

        During a period of very high demand on the service, chat-web returns HTTP 429 responses. The quota of the subscription didn't change, and the `x-ratelimit-limit-tokens` header of the responses shows 120000.

        What should you do?
      fr: |
        Tailspin Toys dispose d'un déploiement Global Standard nommé **chat-web** auquel sont attribués 200 000 jetons par minute (TPM). Son utilisation reste nettement inférieure à cette valeur.

        Pendant une période de très forte demande sur le service, chat-web renvoie des réponses HTTP 429. Le quota de l'abonnement n'a pas changé, et l'en-tête `x-ratelimit-limit-tokens` des réponses indique 120000.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Reduce the TPM of another deployment of the model, and assign chat-web more than 200,000 TPM.", fr: "Réduire le TPM d'un autre déploiement du modèle, et attribuer plus de 200 000 TPM à chat-web." } }
        - { id: b, text: { en: "Lower `max_output_tokens` in each request, so that fewer tokens are reserved against the limit.", fr: "Abaisser `max_output_tokens` dans chaque requête, afin de réserver moins de jetons sur la limite." } }
        - { id: c, text: { en: "Purchase an Azure Reservation for chat-web, so that the service can't lower its limit again.", fr: "Acheter une réservation Azure pour chat-web, afin que le service ne puisse plus abaisser sa limite." } }
        - { id: d, text: { en: "Retry the throttled requests after the delay given in `retry-after-ms`, and smooth the bursts.", fr: "Relancer les requêtes limitées après le délai indiqué dans `retry-after-ms`, et lisser les pics." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Standard deployments share a pool of capacity. When demand approaches its limits, the service temporarily lowers the effective rate limit of deployments, which shows as an `x-ratelimit-limit-tokens` value below the configured TPM. The reduction is temporary; the application should retry with back-off that honors `retry-after-ms` and avoid bursts, because failed requests still count toward the limit.
        fr: |
          Les déploiements Standard partagent un pool de capacité. Quand la demande approche de ses limites, le service abaisse temporairement la limite de débit effective des déploiements, ce qui se traduit par une valeur de `x-ratelimit-limit-tokens` inférieure au TPM configuré. La réduction est temporaire ; l'application doit relancer avec une temporisation qui respecte `retry-after-ms` et éviter les pics, car les requêtes en échec comptent quand même dans la limite.
      options:
        a: { en: "Usage is already well below the 200,000 TPM assigned: the configured value isn't the limit that applies, so assigning more doesn't address the service-side reduction.", fr: "L'utilisation est déjà nettement inférieure aux 200 000 TPM attribués : la valeur configurée n'est pas la limite qui s'applique, donc en attribuer davantage ne traite pas la réduction côté service." }
        b: { en: "The rate limit counts the actual input and generated tokens; a high `max_output_tokens` doesn't reserve TPM.", fr: "La limite de débit compte les jetons réels d'entrée et de sortie générée ; un `max_output_tokens` élevé ne réserve pas de TPM." }
        c: { en: "Azure Reservations discount provisioned throughput units; they don't apply to a Global Standard deployment.", fr: "Les réservations Azure réduisent le prix des unités de débit provisionné ; elles ne s'appliquent pas à un déploiement Global Standard." }
    references:
      - title: Manage Azure OpenAI in Microsoft Foundry Models quota (classic)
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/quota

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-13-06
    objective: "1.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware runs a customer service agent in Foundry Agent Service. The agent has three function tools: `get_order_status`, `create_return` and `issue_refund`. Application Insights is connected to the project, and the traces of last week's production runs are stored there.

        Users report that the agent sometimes calls `get_order_status` when they ask for a refund. In the traces, every tool call completes without a technical error, and the final answers correctly reflect what the tools returned.

        You need to measure, on last week's production runs, how often the agent picks a tool that doesn't fit the request.

        What should you do?
      fr: |
        Litware exécute un agent de service client dans Foundry Agent Service. L'agent dispose de trois outils de fonction : `get_order_status`, `create_return` et `issue_refund`. Application Insights est connecté au projet, et les traces des exécutions de production de la semaine dernière y sont stockées.

        Des utilisateurs signalent que l'agent appelle parfois `get_order_status` quand ils demandent un remboursement. Dans les traces, chaque appel d'outil se termine sans erreur technique, et les réponses finales reflètent correctement ce que les outils ont renvoyé.

        Vous devez mesurer, sur les exécutions de production de la semaine dernière, à quelle fréquence l'agent choisit un outil qui ne convient pas à la demande.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Run an evaluation of the traces with the Tool Call Success evaluator.", fr: "Exécuter une évaluation des traces avec l'évaluateur Tool Call Success." } }
        - { id: b, text: { en: "Run an evaluation of the traces with the Tool Output Utilization evaluator.", fr: "Exécuter une évaluation des traces avec l'évaluateur Tool Output Utilization." } }
        - { id: c, text: { en: "Run an evaluation of the traces with the Tool Selection evaluator.", fr: "Exécuter une évaluation des traces avec l'évaluateur Tool Selection." } }
        - { id: d, text: { en: "Run an evaluation of the traces with the Groundedness evaluator.", fr: "Exécuter une évaluation des traces avec l'évaluateur Groundedness." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Tool Selection measures whether the agent selected the most appropriate tools for the task, which is exactly the reported problem. Foundry can evaluate deployed agent interactions from stored traces, so the evaluator scores last week's real runs instead of a test dataset.
        fr: |
          Tool Selection mesure si l'agent a choisi les outils les plus appropriés à la tâche, ce qui correspond exactement au problème signalé. Foundry peut évaluer les interactions d'un agent déployé à partir des traces stockées : l'évaluateur note donc les exécutions réelles de la semaine dernière plutôt qu'un jeu de données de test.
      options:
        a: { en: "Tool Call Success checks for technical failures of tool calls; the traces show that every call succeeded.", fr: "Tool Call Success vérifie les échecs techniques des appels d'outils ; les traces montrent que tous les appels ont réussi." }
        b: { en: "Tool Output Utilization checks how the agent uses what a tool returned; the answers already reflect the tool outputs correctly.", fr: "Tool Output Utilization vérifie comment l'agent utilise ce qu'un outil a renvoyé ; les réponses reflètent déjà correctement les sorties des outils." }
        d: { en: "Groundedness checks whether the response is supported by its context; a well-supported answer can still come from the wrong tool.", fr: "Groundedness vérifie si la réponse est étayée par son contexte ; une réponse bien étayée peut quand même venir du mauvais outil." }
    references:
      - title: Built-in Evaluators Reference - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
      - title: Introduction to cloud evaluation with Microsoft Foundry SDK - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/cloud-evaluation

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-13-07
    objective: "1.3.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Proseware grounds an agent with a hybrid query (one text query and one vector query) against an Azure AI Search index. The query uses the semantic ranker. The retrieval code passes a result to the agent only if its `@search.score` is at least 0.5, a value that the team tuned when the agent used keyword queries.

        The query returns the following top three results, in this order:

        | Position | Document | `@search.score` | `@search.rerankerScore` |
        | --- | --- | --- | --- |
        | 1 | doc-A | 0.0161 | 3.12 |
        | 2 | doc-B | 0.0325 | 2.87 |
        | 3 | doc-C | 0.0318 | 1.35 |

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware ancre un agent avec une requête hybride (une requête texte et une requête vectorielle) sur un index Azure AI Search. La requête utilise le classeur sémantique. Le code de récupération ne transmet un résultat à l'agent que si son `@search.score` vaut au moins 0,5, une valeur que l'équipe a réglée quand l'agent utilisait des requêtes par mots clés.

        La requête renvoie les trois premiers résultats suivants, dans cet ordre :

        | Position | Document | `@search.score` | `@search.rerankerScore` |
        | --- | --- | --- | --- |
        | 1 | doc-A | 0.0161 | 3.12 |
        | 2 | doc-B | 0.0325 | 2.87 |
        | 3 | doc-C | 0.0318 | 1.35 |

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "doc-A is in first position because the semantic ranker sorts the results by `@search.rerankerScore`.", fr: "doc-A est en première position parce que le classeur sémantique trie les résultats par `@search.rerankerScore`." } }
        - { id: s2, text: { en: "The retrieval code passes doc-A and doc-B to the agent.", fr: "Le code de récupération transmet doc-A et doc-B à l'agent." } }
        - { id: s3, text: { en: "Without the semantic ranker, the same hybrid query orders its results by the Reciprocal Rank Fusion (RRF) score returned in `@search.score`.", fr: "Sans le classeur sémantique, la même requête hybride ordonne ses résultats selon le score Reciprocal Rank Fusion (RRF) renvoyé dans `@search.score`." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Yes: the semantic ranker rescores the top results and lists them in descending order of `@search.rerankerScore` (0 to 4), so doc-A comes first despite the lowest `@search.score`. No: for a hybrid query, `@search.score` is the RRF fusion score, whose upper bound depends on the number of fused queries (about 1/k each, with k around 60), so no result can reach 0.5 and the code passes nothing to the agent. Yes: without semantic ranking, `@search.score` holds the value used to order the results, which is the RRF score for a hybrid query. A threshold tuned on BM25 scores can't be reused on another query type.
        fr: |
          Oui : le classeur sémantique recalcule le score des premiers résultats et les liste par ordre décroissant de `@search.rerankerScore` (de 0 à 4) ; doc-A arrive donc en tête malgré le `@search.score` le plus bas. Non : pour une requête hybride, `@search.score` est le score de fusion RRF, dont la borne supérieure dépend du nombre de requêtes fusionnées (environ 1/k chacune, avec k de l'ordre de 60) ; aucun résultat ne peut atteindre 0,5 et le code ne transmet rien à l'agent. Oui : sans classement sémantique, `@search.score` contient la valeur qui sert à ordonner les résultats, c'est-à-dire le score RRF pour une requête hybride. Un seuil réglé sur des scores BM25 ne peut pas être réutilisé pour un autre type de requête.
    references:
      - title: Hybrid Search Scoring (RRF) - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking
      - title: Semantic Ranking Overview - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-13-08
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Contoso has a Foundry resource named **contoso-ai** that contains a project named **support-prj**. contoso-ai must use a new Blob Storage account named **stdocs**, created outside Foundry, as a source of files for the agents of support-prj. Key access is disabled on contoso-ai, and shared key access is disabled on stdocs.

        Developers are members of a group named **grp-dev**, which already has the Foundry User role on support-prj. They must also be able to view contoso-ai in the portal.

        You need to complete the role assignments. The solution must follow the principle of least privilege.

        How should you complete the assignments? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso dispose d'une ressource Foundry nommée **contoso-ai** qui contient un projet nommé **support-prj**. contoso-ai doit utiliser un nouveau compte de stockage Blob nommé **stdocs**, créé en dehors de Foundry, comme source de fichiers pour les agents de support-prj. L'accès par clé est désactivé sur contoso-ai, et l'accès par clé partagée est désactivé sur stdocs.

        Les développeurs sont membres d'un groupe nommé **grp-dev**, qui dispose déjà du rôle Foundry User sur support-prj. Ils doivent aussi pouvoir consulter contoso-ai dans le portail.

        Vous devez compléter les attributions de rôles. La solution doit respecter le principe du moindre privilège.

        Comment devez-vous compléter les attributions ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Storage Blob Data Reader on stdocs, assigned to: [[blob]]

          Role on contoso-ai for the managed identity of support-prj: [[proj]]

          Role on contoso-ai for grp-dev: [[dev]]
        fr: |
          Storage Blob Data Reader sur stdocs, attribué à : [[blob]]

          Rôle sur contoso-ai pour l'identité managée de support-prj : [[proj]]

          Rôle sur contoso-ai pour grp-dev : [[dev]]
      slots:
        - id: blob
          options:
            - { id: grp, text: grp-dev }
            - { id: acct, text: { en: "The managed identity of contoso-ai", fr: "L'identité managée de contoso-ai" } }
            - { id: stmi, text: { en: "The system-assigned managed identity of stdocs", fr: "L'identité managée affectée par le système de stdocs" } }
        - id: proj
          options:
            - { id: consumer, text: Foundry Agent Consumer }
            - { id: acctowner, text: Foundry Account Owner }
            - { id: contrib, text: Contributor }
            - { id: user, text: Foundry User }
        - id: dev
          options:
            - { id: reader, text: Reader }
            - { id: contrib, text: Contributor }
            - { id: owner, text: Foundry Owner }
            - { id: usages, text: Cognitive Services Usages Reader }
    answer:
      values: { blob: acct, proj: user, dev: reader }
    explanation:
      correct:
        en: |
          To use a storage account created outside Foundry, you add the managed identity of the Foundry resource to the Storage Blob Data Reader role on that account; with shared key access disabled, this role assignment is the only way in. The project's managed identity gets Foundry User on the Foundry resource. Developers get Foundry User on the project and Reader on the Foundry resource, the mapping that Learn gives for team members.
        fr: |
          Pour utiliser un compte de stockage créé en dehors de Foundry, vous ajoutez l'identité managée de la ressource Foundry au rôle Storage Blob Data Reader sur ce compte ; avec l'accès par clé partagée désactivé, cette attribution de rôle est le seul accès possible. L'identité managée du projet reçoit Foundry User sur la ressource Foundry. Les développeurs reçoivent Foundry User sur le projet et Reader sur la ressource Foundry, la correspondance que Learn donne pour les membres d'une équipe.
      options:
        grp: { en: "The developers don't read the files themselves: Foundry reads stdocs with its own identity.", fr: "Les développeurs ne lisent pas les fichiers eux-mêmes : Foundry lit stdocs avec sa propre identité." }
        stmi: { en: "The identity of stdocs is used by stdocs to call other services; a role on stdocs for its own identity doesn't let Foundry read the blobs.", fr: "L'identité de stdocs sert à stdocs pour appeler d'autres services ; un rôle sur stdocs pour sa propre identité ne permet pas à Foundry de lire les objets blob." }
        consumer: { en: "Foundry Agent Consumer only lets a principal interact with agent endpoints; the project identity needs the data actions of Foundry User.", fr: "Foundry Agent Consumer permet seulement d'interagir avec les points de terminaison des agents ; l'identité du projet a besoin des actions de données de Foundry User." }
        acctowner: { en: "Foundry Account Owner manages resources and deployments but has no data actions, and it's far broader than needed.", fr: "Foundry Account Owner gère les ressources et les déploiements mais n'a aucune action de données, et il est bien plus large que nécessaire." }
        owner: { en: "Foundry Owner grants full management and build access; viewing the resource only requires Reader.", fr: "Foundry Owner accorde un accès complet de gestion et de création ; consulter la ressource ne demande que Reader." }
        usages: { en: "Cognitive Services Usages Reader reads quota at subscription scope; it doesn't grant access to view the resource.", fr: "Cognitive Services Usages Reader lit les quotas à l'étendue de l'abonnement ; il ne donne pas accès à la consultation de la ressource." }
    references:
      - title: Role-based access control for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-13-09
    objective: "1.3.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam has a Foundry resource named **fab-ai** that was deployed with the basic agent setup, without network injection. An agent of fab-ai uses the Azure AI Search tool on an index of a search service named **srch-kb**. The project connection to srch-kb authenticates with an API key.

        The security team disables public network access on srch-kb and adds a private endpoint to it. Since then, every search of the agent fails. Public network access to srch-kb must stay disabled.

        You need the agent to search the index of srch-kb again.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'une ressource Foundry nommée **fab-ai** qui a été déployée avec la configuration d'agent de base, sans injection réseau. Un agent de fab-ai utilise l'outil Azure AI Search sur un index d'un service de recherche nommé **srch-kb**. La connexion de projet à srch-kb s'authentifie avec une clé API.

        L'équipe de sécurité désactive l'accès réseau public sur srch-kb et lui ajoute un point de terminaison privé. Depuis, toutes les recherches de l'agent échouent. L'accès réseau public à srch-kb doit rester désactivé.

        Vous devez faire en sorte que l'agent interroge à nouveau l'index de srch-kb.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Delegate a subnet to Microsoft.App/environments, and then add network injection to fab-ai.", fr: "Déléguer un sous-réseau à Microsoft.App/environments, puis ajouter l'injection réseau à fab-ai." } }
        - { id: b, text: { en: "Deploy a new Foundry resource with the standard agent setup and network injection, and re-create the agent in it.", fr: "Déployer une nouvelle ressource Foundry avec la configuration d'agent standard et l'injection réseau, puis y recréer l'agent." } }
        - { id: c, text: { en: "Enable the trusted Azure services exception on fab-ai, so that srch-kb can reach the Foundry resource.", fr: "Activer l'exception des services Azure approuvés sur fab-ai, afin que srch-kb puisse atteindre la ressource Foundry." } }
        - { id: d, text: { en: "Make the project connection to srch-kb use the project's managed identity, and grant that identity roles on srch-kb.", fr: "Faire utiliser l'identité managée du projet à la connexion de projet vers srch-kb, et accorder des rôles sur srch-kb à cette identité." } }
        - { id: e, text: { en: "Regenerate the admin key of srch-kb, and then update the key that the project connection uses.", fr: "Régénérer la clé d'administration de srch-kb, puis mettre à jour la clé qu'utilise la connexion de projet." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          A basic agent setup doesn't support a search service whose public access is disabled behind a private endpoint: the agent must run with the standard setup and network injection. Network injection can't be added to an existing Foundry deployment, so a new resource is required. With private networking, the Azure AI Search connection must use Microsoft Entra ID with the project's managed identity, because key-based authentication isn't supported there.
        fr: |
          Une configuration d'agent de base ne prend pas en charge un service de recherche dont l'accès public est désactivé derrière un point de terminaison privé : l'agent doit s'exécuter avec la configuration standard et l'injection réseau. L'injection réseau ne peut pas être ajoutée à un déploiement Foundry existant ; une nouvelle ressource est donc nécessaire. Avec un réseau privé, la connexion Azure AI Search doit utiliser Microsoft Entra ID avec l'identité managée du projet, car l'authentification par clé n'y est pas prise en charge.
      options:
        a: { en: "Outbound network injection is decided when Foundry is deployed; it can't be added to fab-ai afterwards.", fr: "L'injection réseau sortante se décide au déploiement de Foundry ; elle ne peut pas être ajoutée ensuite à fab-ai." }
        c: { en: "The trusted services exception lets Azure AI Search call a Foundry resource behind its firewall; here the agent must reach srch-kb, the opposite direction.", fr: "L'exception des services approuvés permet à Azure AI Search d'appeler une ressource Foundry derrière son pare-feu ; ici l'agent doit atteindre srch-kb, dans l'autre sens." }
        e: { en: "The key isn't the cause, and key-based authentication isn't supported for the search tool with private networking.", fr: "La clé n'est pas en cause, et l'authentification par clé n'est pas prise en charge pour l'outil de recherche avec un réseau privé." }
    references:
      - title: Connect a Foundry IQ (Azure AI Search) index to Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
      - title: How to configure network isolation for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-13-10
    objective: "1.3.1"
    difficulty: 3
    status: draft
    type: dropdown
    shuffle: false
    stem:
      en: |
        Trey Research has a Foundry resource with a Global Standard deployment named **plan-chat** of **gpt-5-mini**. plan-chat is assigned 60,000 tokens per minute (TPM), and its responses show `x-ratelimit-limit-tokens: 60000` and `x-ratelimit-limit-requests: 60`. In the region of the resource, the subscription's Global Standard quota for gpt-5-mini is 150,000 TPM. Another deployment of the model, **review-chat**, is assigned 50,000 TPM and uses all of it.

        At peak, the application sends plan-chat 90 requests per minute, evenly spread. Each request consumes about 500 tokens in total. plan-chat returns HTTP 429 responses during every peak.

        How should you complete the analysis? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Trey Research dispose d'une ressource Foundry avec un déploiement Global Standard nommé **plan-chat** de **gpt-5-mini**. 60 000 jetons par minute (TPM) sont attribués à plan-chat, et ses réponses indiquent `x-ratelimit-limit-tokens: 60000` et `x-ratelimit-limit-requests: 60`. Dans la région de la ressource, le quota Global Standard de l'abonnement pour gpt-5-mini est de 150 000 TPM. Un autre déploiement du modèle, **review-chat**, dispose de 50 000 TPM et les utilise entièrement.

        En période de pointe, l'application envoie à plan-chat 90 requêtes par minute, réparties uniformément. Chaque requête consomme environ 500 jetons au total. plan-chat renvoie des réponses HTTP 429 à chaque pointe.

        Comment devez-vous compléter l'analyse ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          The limit that the peak traffic exceeds: [[limit]]

          The smallest TPM value among the following that stops these 429 responses and that you can assign to plan-chat today without any request to Microsoft: [[tpm]]

          If peak traffic later grows to 140 requests per minute and review-chat must keep its TPM: [[grow]]
        fr: |
          La limite que le trafic de pointe dépasse : [[limit]]

          La plus petite valeur de TPM parmi les suivantes qui fait cesser ces réponses 429 et que vous pouvez attribuer à plan-chat dès aujourd'hui sans aucune demande à Microsoft : [[tpm]]

          Si le trafic de pointe passe ensuite à 140 requêtes par minute et que review-chat doit garder son TPM : [[grow]]
      slots:
        - id: limit
          options:
            - { id: tpm, text: { en: "The TPM limit of plan-chat", fr: "La limite de TPM de plan-chat" } }
            - { id: quota, text: { en: "The gpt-5-mini quota of the subscription in the region", fr: "Le quota gpt-5-mini de l'abonnement dans la région" } }
            - { id: rpm, text: { en: "The requests-per-minute (RPM) limit of plan-chat", fr: "La limite de requêtes par minute (RPM) de plan-chat" } }
            - { id: dyn, text: { en: "A temporary reduction of the limit by the service", fr: "Une réduction temporaire de la limite par le service" } }
        - id: tpm
          options:
            - { id: t15, text: "15,000" }
            - { id: t80, text: "80,000" }
            - { id: t100, text: "100,000" }
            - { id: t150, text: "150,000" }
        - id: grow
          options:
            - { id: retries, text: { en: "Set max_retries to 10 in the client of the application", fr: "Définir max_retries sur 10 dans le client de l'application" } }
            - { id: tokens, text: { en: "Lower max_output_tokens in each request of the application", fr: "Abaisser max_output_tokens dans chaque requête de l'application" } }
            - { id: reserve, text: { en: "Purchase an Azure Reservation that covers plan-chat", fr: "Acheter une réservation Azure qui couvre plan-chat" } }
            - { id: increase, text: { en: "Request a quota increase, or deploy in another region and balance the traffic", fr: "Demander une augmentation de quota, ou déployer dans une autre région et répartir le trafic" } }
    answer:
      values: { limit: rpm, tpm: t100, grow: increase }
    explanation:
      correct:
        en: |
          The headers show 1 RPM per 1,000 TPM for this deployment. Peak traffic is 90 requests and about 45,000 tokens per minute: within the 60,000 TPM, but above the 60 RPM, so the request limit throttles. RPM scales with the TPM assigned, so 90 RPM needs at least 90,000 TPM; 100,000 TPM gives 100 RPM and is exactly what remains of the regional quota (150,000 minus the 50,000 of review-chat). At 140 requests per minute, plan-chat would need 140,000 TPM, more than the quota left: request a quota increase, or add a deployment in another region and balance the traffic.
        fr: |
          Les en-têtes indiquent 1 RPM pour 1 000 TPM pour ce déploiement. Le trafic de pointe représente 90 requêtes et environ 45 000 jetons par minute : sous les 60 000 TPM, mais au-dessus des 60 RPM ; c'est donc la limite de requêtes qui bloque. Les RPM évoluent avec le TPM attribué : 90 RPM exigent au moins 90 000 TPM ; 100 000 TPM donnent 100 RPM et correspondent exactement au reste du quota régional (150 000 moins les 50 000 de review-chat). À 140 requêtes par minute, plan-chat aurait besoin de 140 000 TPM, plus que le quota restant : demandez une augmentation de quota, ou ajoutez un déploiement dans une autre région et répartissez le trafic.
      options:
        tpm: { en: "About 45,000 tokens per minute stay below the 60,000 TPM limit.", fr: "Environ 45 000 jetons par minute restent sous la limite de 60 000 TPM." }
        quota: { en: "The quota limits what you can assign to deployments; the 429 responses come from the limit of plan-chat itself.", fr: "Le quota limite ce que vous pouvez attribuer aux déploiements ; les réponses 429 viennent de la limite de plan-chat elle-même." }
        dyn: { en: "The headers show the configured values, 60,000 TPM and 60 RPM: no service-side reduction is in effect.", fr: "Les en-têtes indiquent les valeurs configurées, 60 000 TPM et 60 RPM : aucune réduction côté service n'est en cours." }
        t15: { en: "15,000 TPM would give 15 RPM; this value comes from dividing 90 by a ratio of 6 RPM per 1,000 TPM, which isn't the ratio of this deployment.", fr: "15 000 TPM donneraient 15 RPM ; cette valeur vient de la division de 90 par un rapport de 6 RPM pour 1 000 TPM, qui n'est pas celui de ce déploiement." }
        t80: { en: "80,000 TPM gives 80 RPM, still below the 90 requests per minute of the peak.", fr: "80 000 TPM donnent 80 RPM, encore sous les 90 requêtes par minute de la pointe." }
        t150: { en: "Only 100,000 TPM of the regional quota is free; assigning 150,000 TPM would exceed it.", fr: "Seuls 100 000 TPM du quota régional sont libres ; attribuer 150 000 TPM le dépasserait." }
        retries: { en: "Retries handle occasional 429 responses; with constant overload they add requests that still count toward the limit.", fr: "Les nouvelles tentatives gèrent des 429 occasionnels ; en surcharge constante, elles ajoutent des requêtes qui comptent quand même dans la limite." }
        tokens: { en: "Tokens aren't the limiting factor, and `max_output_tokens` doesn't reserve TPM anyway.", fr: "Les jetons ne sont pas le facteur limitant, et `max_output_tokens` ne réserve de toute façon pas de TPM." }
        reserve: { en: "Azure Reservations discount provisioned throughput; they add no capacity to a Global Standard deployment.", fr: "Les réservations Azure réduisent le prix du débit provisionné ; elles n'ajoutent aucune capacité à un déploiement Global Standard." }
    references:
      - title: Manage Azure OpenAI in Microsoft Foundry Models quota (classic)
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/quota
