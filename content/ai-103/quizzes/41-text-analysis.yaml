chapter: 41-text-analysis
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-41-01
    objective: "4.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum extracts order details from customer messages by using the Chat Completions API, `client.beta.chat.completions.parse` and a Pydantic model. For a few messages, the model declines to produce the output for safety reasons, and `message.parsed` is empty.

        Before it reads `message.parsed`, which property of the message should the app check to detect this case?
      fr: |
        Adatum extrait les détails des commandes des messages des clients à l'aide de l'API Chat Completions, de `client.beta.chat.completions.parse` et d'un modèle Pydantic. Pour quelques messages, le modèle décline la production de la sortie pour des raisons de sécurité, et `message.parsed` est vide.

        Avant de lire `message.parsed`, quelle propriété du message l'application doit-elle vérifier pour détecter ce cas ?
    body:
      options:
        - { id: a, text: "`content`" }
        - { id: b, text: "`tool_calls`" }
        - { id: c, text: "`refusal`" }
        - { id: d, text: "`audio`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With structured outputs, a model that declines a request returns a refusal message in the `refusal` property of the message instead of an object that matches the schema. Checking `refusal` first lets the app handle the case, for example by logging it or routing the message to a person, instead of failing on an empty parsed result.
        fr: |
          Avec les sorties structurées, un modèle qui décline une requête renvoie un message de refus dans la propriété `refusal` du message au lieu d'un objet conforme au schéma. Vérifier d'abord `refusal` permet à l'application de traiter ce cas, par exemple en le journalisant ou en transmettant le message à une personne, au lieu d'échouer sur un résultat analysé vide.
      options:
        a: { en: "`content` holds the JSON text when the model answers; it doesn't tell the app that the model declined.", fr: "`content` contient le texte JSON quand le modèle répond ; il n'indique pas à l'application que le modèle a décliné." }
        b: { en: "`tool_calls` lists the functions that the model asks the app to call; it doesn't report that the model declined.", fr: "`tool_calls` liste les fonctions que le modèle demande à l'application d'appeler ; il n'indique pas que le modèle a décliné." }
        d: { en: "`audio` carries the audio output of audio-capable models; it's unrelated to a refusal.", fr: "`audio` contient la sortie audio des modèles qui prennent en charge l'audio ; il n'a aucun rapport avec un refus." }
    references:
      - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-41-02
    objective: "4.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys translates support messages into English by using Azure Translator text translation `2026-06-06`. The source language of a message isn't known in advance, and the app must store the source language identified for each message. Each message must be processed with a single request.

        What should you do?
      fr: |
        Tailspin Toys traduit des messages de support en anglais à l'aide de la traduction de texte `2026-06-06` d'Azure Translator. La langue source d'un message n'est pas connue à l'avance, et l'application doit stocker la langue source identifiée pour chaque message. Chaque message doit être traité par une seule requête.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Call the Detect operation of version 2026-06-06, then pass its result in `language`.", fr: "Appeler l'opération Detect de la version 2026-06-06, puis passer son résultat dans `language`." } }
        - { id: b, text: { en: "Omit `language` from each input, then read `detectedLanguage` in the response.", fr: "Omettre `language` dans chaque entrée, puis lire `detectedLanguage` dans la réponse." } }
        - { id: c, text: { en: "Call Azure Language language detection, then pass its result in `language`.", fr: "Appeler la détection de langue d'Azure Language, puis passer son résultat dans `language`." } }
        - { id: d, text: { en: "Set `allowFallback` to true in the target, then read `detectedLanguage` in the response.", fr: "Définir `allowFallback` sur true dans la cible, puis lire `detectedLanguage` dans la réponse." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          `language` is optional in each input of a 2026-06-06 translate request. When it's omitted, Translator detects the source language and adds `detectedLanguage`, with a language code and a confidence score, to the result of that input. One request returns both the translation and the language to store.
        fr: |
          `language` est facultatif dans chaque entrée d'une requête translate 2026-06-06. Quand il est omis, Translator détecte la langue source et ajoute `detectedLanguage`, avec un code de langue et un score de confiance, au résultat de cette entrée. Une seule requête renvoie à la fois la traduction et la langue à stocker.
      options:
        a: { en: "The Detect operation of v3.0 was removed in version 2026-06-06, and a separate call would make two requests.", fr: "L'opération Detect de la v3.0 a été supprimée dans la version 2026-06-06, et un appel séparé ferait deux requêtes." }
        c: { en: "Azure Language detection works, but with the translation it makes two requests per message instead of one.", fr: "La détection d'Azure Language fonctionne, mais avec la traduction elle fait deux requêtes par message au lieu d'une." }
        d: { en: "`allowFallback` decides what happens when the chosen model doesn't support a language pair; detection depends only on omitting `language`.", fr: "`allowFallback` décide de ce qui se passe quand le modèle choisi ne prend pas en charge une paire de langues ; la détection dépend uniquement de l'omission de `language`." }
    references:
      - title: Azure Translator in Foundry Tools 2026-06-06 translate method
        url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/2026-06-06/translate-api
      - title: Migrate to Translator Text API 2026-06-06
        url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/how-to/migrate-to-2026-06-06

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-41-03
    objective: "4.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso Health has an assistant that sends patient messages to a gpt-4.1 deployment in a Microsoft Foundry project to draft replies. The deployment uses the default guardrail. A new privacy policy states that patient names and phone numbers must never reach the model.

        What should you do?
      fr: |
        Contoso Health dispose d'un assistant qui envoie les messages des patients à un déploiement gpt-4.1 dans un projet Microsoft Foundry pour rédiger des réponses. Le déploiement utilise le garde-fou par défaut. Une nouvelle stratégie de confidentialité exige que les noms et les numéros de téléphone des patients n'atteignent jamais le modèle.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a Personally identifiable information control to the guardrail on the Output intervention point.", fr: "Ajouter un contrôle Personally identifiable information au garde-fou sur le point d'intervention Output." } }
        - { id: b, text: { en: "Send each message to Content Safety text analysis, and forward only messages with a severity of 0.", fr: "Envoyer chaque message à l'analyse de texte de Content Safety, et ne transmettre que les messages de gravité 0." } }
        - { id: c, text: { en: "Add a rule to the system message that tells the model to ignore names and phone numbers.", fr: "Ajouter une règle au message système qui demande au modèle d'ignorer les noms et les numéros de téléphone." } }
        - { id: d, text: { en: "Send each message to Azure Language PII detection, and forward the redacted text to the model.", fr: "Envoyer chaque message à la détection des PII d'Azure Language, et transmettre le texte masqué au modèle." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Azure Language PII detection finds personal data such as Person and PhoneNumber entities and returns a redacted version of the text. Calling it before the model and sending only the redacted text ensures that the names and phone numbers never reach the deployment.
        fr: |
          La détection des PII d'Azure Language trouve les données personnelles comme les entités Person et PhoneNumber et renvoie une version masquée du texte. L'appeler avant le modèle et n'envoyer que le texte masqué garantit que les noms et les numéros de téléphone n'atteignent jamais le déploiement.
      options:
        a: { en: "The PII filter (preview) scans the model's output; the message has already reached the model when it runs.", fr: "Le filtre PII (préversion) analyse la sortie du modèle ; le message a déjà atteint le modèle quand il s'exécute." }
        b: { en: "Content Safety scores harm categories such as hate and violence; it doesn't detect names or phone numbers.", fr: "Content Safety note des catégories de préjudice comme la haine et la violence ; il ne détecte ni les noms ni les numéros de téléphone." }
        c: { en: "An instruction only asks the model to disregard the data; the model still receives the names and numbers.", fr: "Une instruction demande seulement au modèle de ne pas tenir compte des données ; le modèle reçoit quand même les noms et les numéros." }
    references:
      - title: What is the Personally Identifiable Information (PII) detection feature in Azure Language?
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
      - title: Personally Identifiable Information (PII) Filter
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter-personal-information

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-41-04
    objective: "4.1.1"
    difficulty: 2
    status: draft
    type: dropdown
    stem:
      en: |
        Litware collects product reviews. You write Python code that uses the `azure-ai-textanalytics` library and Azure Language prebuilt named entity recognition (NER). The `language` client and the `reviews` list are already defined.

        The code must print every entity of the Product category that is detected with a confidence score of at least 0.8, and skip the reviews that the service couldn't process.

        How should you complete the code? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware collecte des avis sur des produits. Vous écrivez du code Python qui utilise la bibliothèque `azure-ai-textanalytics` et la reconnaissance d'entités nommées (NER) prédéfinie d'Azure Language. Le client `language` et la liste `reviews` sont déjà définis.

        Le code doit afficher chaque entité de la catégorie Product détectée avec un score de confiance d'au moins 0,8, et ignorer les avis que le service n'a pas pu traiter.

        Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        results = language.[[method]](reviews)

        for doc in results:
            if doc.[[check]]:
                continue
            for entity in doc.entities:
                if entity.[[attr]] == "Product" and entity.confidence_score >= 0.8:
                    print(entity.text)
      slots:
        - id: method
          options:
            - { id: linked, text: recognize_linked_entities }
            - { id: entities, text: recognize_entities }
            - { id: pii, text: recognize_pii_entities }
            - { id: keyphrases, text: extract_key_phrases }
        - id: check
          options:
            - { id: iserror, text: is_error }
            - { id: warnings, text: warnings }
            - { id: statistics, text: statistics }
        - id: attr
          options:
            - { id: name, text: name }
            - { id: datasource, text: data_source }
            - { id: category, text: category }
    answer:
      values: { method: entities, check: iserror, attr: category }
    explanation:
      correct:
        en: |
          `recognize_entities` runs prebuilt NER and returns, for each document, a result or a `DocumentError`, in the order of the input. `is_error` is true for a document that the service couldn't process, so the loop skips it. Each recognized entity has `text`, `category` (such as Person, Organization or Product) and `confidence_score`.
        fr: |
          `recognize_entities` exécute la NER prédéfinie et renvoie, pour chaque document, un résultat ou une `DocumentError`, dans l'ordre de l'entrée. `is_error` vaut true pour un document que le service n'a pas pu traiter : la boucle l'ignore. Chaque entité reconnue possède `text`, `category` (comme Person, Organization ou Product) et `confidence_score`.
      options:
        method:
          en: |
            `recognize_linked_entities` is entity linking (a legacy feature) and returns entities with a `name` and a `data_source`, not NER categories; `recognize_pii_entities` targets personal data, and `extract_key_phrases` returns phrases, not entities.
          fr: |
            `recognize_linked_entities` correspond à la liaison d'entités (une fonctionnalité héritée) et renvoie des entités avec un `name` et une `data_source`, pas des catégories NER ; `recognize_pii_entities` cible les données personnelles, et `extract_key_phrases` renvoie des expressions, pas des entités.
        check:
          en: |
            `warnings` and `statistics` exist on successful results; skipping on them would drop valid reviews and wouldn't detect a failed one.
          fr: |
            `warnings` et `statistics` existent sur les résultats réussis ; filtrer sur eux écarterait des avis valides et ne détecterait pas un échec.
        attr:
          en: |
            `name` and `data_source` are properties of linked entities (for example Wikipedia); a NER entity carries its type in `category`.
          fr: |
            `name` et `data_source` sont des propriétés des entités liées (par exemple Wikipedia) ; une entité NER porte son type dans `category`.
    references:
      - title: azure.ai.textanalytics.TextAnalyticsClient class
        url: https://learn.microsoft.com/en-us/python/api/azure-ai-textanalytics/azure.ai.textanalytics.textanalyticsclient
      - title: What is Azure Language in Foundry Tools?
        url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-41-05
    objective: "4.1.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank extracts obligations from supplier contracts by using a gpt-4.1 deployment with domain instructions, two few-shot examples and a strict schema. The compliance experts approve the current results. A developer wrote a shorter version of the instructions to reduce the token cost, and the team plans to use it next week.

        You need to confirm that the extraction quality doesn't drop before the new instructions go live. What should you do?
      fr: |
        Woodgrove Bank extrait les obligations des contrats fournisseurs à l'aide d'un déploiement gpt-4.1 avec des instructions métier, deux exemples few-shot et un schéma strict. Les experts de la conformité approuvent les résultats actuels. Un développeur a rédigé une version plus courte des instructions pour réduire le coût en jetons, et l'équipe prévoit de l'utiliser la semaine prochaine.

        Vous devez confirmer que la qualité de l'extraction ne baisse pas avant la mise en service des nouvelles instructions. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Fine-tune the model on the current results so that it keeps the same behavior with any instructions.", fr: "Affiner le modèle sur les résultats actuels pour qu'il garde le même comportement avec n'importe quelles instructions." } }
        - { id: b, text: { en: "Lower the temperature of the requests to 0 so that the new instructions produce stable results.", fr: "Abaisser la température des requêtes à 0 pour que les nouvelles instructions produisent des résultats stables." } }
        - { id: c, text: { en: "Run both versions on real contracts whose expected results the experts checked, and compare them.", fr: "Exécuter les deux versions sur des contrats réels dont les experts ont vérifié les résultats attendus, puis les comparer." } }
        - { id: d, text: { en: "Give the new instructions to half of the users, and compare the number of complaints of each half.", fr: "Donner les nouvelles instructions à la moitié des utilisateurs, puis comparer le nombre de réclamations de chaque moitié." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A prompt that works in one case doesn't necessarily generalize, so every change to the instructions or the model is checked against a test set of real documents reviewed by domain experts. Running the current and the shorter instructions on the same set shows whether the extraction regresses, before any user sees the new version.
        fr: |
          Une invite qui fonctionne dans un cas ne se généralise pas forcément : chaque modification des instructions ou du modèle se vérifie sur un jeu de test de documents réels revus par des experts du domaine. Exécuter les instructions actuelles et les instructions raccourcies sur le même jeu montre si l'extraction régresse, avant qu'un utilisateur ne voie la nouvelle version.
      options:
        a: { en: "Fine-tuning is a last resort with training and hosting costs, and it doesn't measure the quality of the new instructions.", fr: "Le fine-tuning est un dernier recours qui ajoute des coûts d'entraînement et d'hébergement, et il ne mesure pas la qualité des nouvelles instructions." }
        b: { en: "A low temperature makes the output more focused, but it doesn't show whether the shorter instructions lost information.", fr: "Une température basse rend la sortie plus ciblée, mais elle ne montre pas si les instructions raccourcies ont perdu de l'information." }
        d: { en: "This exposes users to the new version before its quality is confirmed, and complaints don't measure extraction accuracy.", fr: "Cela expose des utilisateurs à la nouvelle version avant que sa qualité ne soit confirmée, et les réclamations ne mesurent pas l'exactitude de l'extraction." }
    references:
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
      - title: Run evaluations from the Microsoft Foundry portal
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-generative-ai-app

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-41-06
    objective: "4.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys moderates forum posts before publication by calling the Azure AI Content Safety analyze text API (`api-version=2024-09-01`). A text blocklist named **wingtip-banned** contains the names of banned accounts. The moderation function is shown in the Code exhibit.

        The moderation rules are the following:

        - Reject every post that matches wingtip-banned.
        - Reject every post with a Hate or Violence severity of 4 or more.
        - Don't run the harm analysis on posts that match the blocklist, to reduce latency.

        During testing, posts that contain a banned account name are published. You need to meet all the rules.

        What should you do?
      fr: |
        Wingtip Toys modère les messages de son forum avant publication en appelant l'API d'analyse de texte d'Azure AI Content Safety (`api-version=2024-09-01`). Une liste de blocage de texte nommée **wingtip-banned** contient les noms des comptes bannis. La fonction de modération figure dans la pièce Code.

        Les règles de modération sont les suivantes :

        - Rejeter tout message qui correspond à wingtip-banned.
        - Rejeter tout message dont la gravité Hate ou Violence est de 4 ou plus.
        - Ne pas exécuter l'analyse des préjudices sur les messages qui correspondent à la liste de blocage, pour réduire la latence.

        Pendant les tests, des messages qui contiennent le nom d'un compte banni sont publiés. Vous devez satisfaire toutes les règles.

        Que devez-vous faire ?
    exhibits:
      - id: code
        title: { en: "Code", fr: "Code" }
        body: |
          ```python
          def moderate(post: str) -> bool:
              body = {
                  "text": post,
                  "categories": ["Hate", "Violence"],
                  "blocklistNames": ["wingtip-banned"],
                  "haltOnBlocklistHit": True,
                  "outputType": "FourSeverityLevels",
              }
              result = requests.post(url, headers=headers, json=body).json()
              for item in result.get("categoriesAnalysis", []):
                  if item["severity"] >= 4:
                      return False      # reject
              return True               # publish
          ```
    body:
      options:
        - { id: a, text: { en: "Set `haltOnBlocklistHit` to false so that the harm analysis also runs on posts that match the blocklist.", fr: "Définir `haltOnBlocklistHit` sur false pour que l'analyse des préjudices s'exécute aussi sur les messages qui correspondent à la liste." } }
        - { id: b, text: { en: "Reject the post when `blocklistsMatch` in the result isn't empty, before the severity check runs.", fr: "Rejeter le message quand `blocklistsMatch` n'est pas vide dans le résultat, avant l'exécution du contrôle de gravité." } }
        - { id: c, text: { en: "Set `outputType` to `EightSeverityLevels`, and reject the posts with a severity of 2 or more.", fr: "Définir `outputType` sur `EightSeverityLevels`, et rejeter les messages dont la gravité est de 2 ou plus." } }
        - { id: d, text: { en: "Add the name of the blocklist to `categories` so that a match is returned as a category severity.", fr: "Ajouter le nom de la liste de blocage à `categories` pour qu'une correspondance soit renvoyée comme une gravité de catégorie." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Blocklist matches are reported in `blocklistsMatch`, never as a severity. With `haltOnBlocklistHit` set to true, a match also skips the harm analysis, so the function finds no high severity and publishes the post. Rejecting the post when `blocklistsMatch` isn't empty, before the severity loop, meets the first rule and keeps the latency rule.
        fr: |
          Les correspondances de liste de blocage sont signalées dans `blocklistsMatch`, jamais sous forme de gravité. Avec `haltOnBlocklistHit` à true, une correspondance ignore en plus l'analyse des préjudices : la fonction ne trouve aucune gravité élevée et publie le message. Rejeter le message quand `blocklistsMatch` n'est pas vide, avant la boucle de gravité, satisfait la première règle et respecte la règle de latence.
      options:
        a: { en: "The harm analysis would run on blocked posts, which breaks the latency rule, and a banned name with a low severity would still be published.", fr: "L'analyse des préjudices s'exécuterait sur les messages bloqués, ce qui enfreint la règle de latence, et un nom banni de faible gravité serait toujours publié." }
        c: { en: "A banned account name isn't necessarily harmful content, so a lower threshold doesn't catch it, and it rejects posts that the rules allow.", fr: "Un nom de compte banni n'est pas forcément un contenu préjudiciable : un seuil plus bas ne le détecte pas, et il rejette des messages que les règles autorisent." }
        d: { en: "`categories` accepts only the harm categories (Hate, Sexual, SelfHarm, Violence); blocklists are passed in `blocklistNames`.", fr: "`categories` n'accepte que les catégories de préjudice (Hate, Sexual, SelfHarm, Violence) ; les listes de blocage se passent dans `blocklistNames`." }
    references:
      - title: "Quickstart: Analyze text content"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-text

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-41-07
    objective: "4.1.1"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders extracts purchase orders from supplier emails by using the Responses API of a gpt-4.1 deployment. The request passes the JSON schema shown in the Schema exhibit, with `strict` set to true. Some emails don't contain a purchase order number.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders extrait des bons de commande des e-mails des fournisseurs à l'aide de l'API Responses d'un déploiement gpt-4.1. La requête transmet le schéma JSON présenté dans la pièce Schéma, avec `strict` à true. Certains e-mails ne contiennent pas de numéro de bon de commande.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: schema
        title: { en: "Schema", fr: "Schéma" }
        body: |
          ```json
          {
            "type": "object",
            "properties": {
              "vendor": { "type": "string" },
              "poNumber": { "type": ["string", "null"] },
              "lines": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "sku": { "type": "string" },
                    "quantity": { "type": "integer" }
                  },
                  "required": ["sku", "quantity"]
                }
              },
              "total": { "type": "number" }
            },
            "required": ["vendor", "poNumber", "lines", "total"],
            "additionalProperties": false
          }
          ```
    body:
      statements:
        - id: s1
          text: { en: "The service accepts this schema as written.", fr: "Le service accepte ce schéma tel qu'il est écrit." }
        - id: s2
          text: { en: "In an accepted version of this schema, the properties of the returned object follow the order vendor, poNumber, lines, total.", fr: "Dans une version acceptée de ce schéma, les propriétés de l'objet renvoyé suivent l'ordre vendor, poNumber, lines, total." }
        - id: s3
          text: { en: "Removing poNumber from the root `required` list is a valid way to let the model omit it when an email has no number.", fr: "Retirer poNumber de la liste `required` de la racine est un moyen valide de laisser le modèle l'omettre quand un e-mail n'a pas de numéro." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          In strict mode, `additionalProperties` must be set to false on every object, including the objects nested in `items`; the line object doesn't set it, so the schema is rejected. Once the schema is valid, the output follows the order of the properties in the schema. Every property must be listed in `required`: an optional value is emulated with a null union, which is what poNumber already uses.
        fr: |
          En mode strict, `additionalProperties` doit valoir false sur chaque objet, y compris les objets imbriqués dans `items` ; l'objet de ligne ne le définit pas : le schéma est donc rejeté. Une fois le schéma valide, la sortie suit l'ordre des propriétés du schéma. Chaque propriété doit figurer dans `required` : une valeur facultative s'émule avec une union avec null, ce que poNumber utilise déjà.
      options:
        s1: { en: "The nested line object lacks `additionalProperties: false`, which strict mode requires on every object, not only on the root.", fr: "L'objet de ligne imbriqué n'a pas `additionalProperties: false`, que le mode strict exige sur chaque objet, pas seulement sur la racine." }
        s3: { en: "Strict mode requires every field in `required`; keep poNumber required with the `[\"string\", \"null\"]` type so the model returns null.", fr: "Le mode strict exige chaque champ dans `required` ; gardez poNumber obligatoire avec le type `[\"string\", \"null\"]` pour que le modèle renvoie null." }
    references:
      - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-41-08
    objective: "4.1.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam Engineering translates maintenance notices written in English by calling `POST https://fabrikam-tr.cognitiveservices.azure.com/translator/text/translate?api-version=2026-06-06`. Fabrikam trained a Custom Translator model for German whose category ID is `5b7e21c4-9d3a-4f60-8a1e-c2f4d7b90e35-GENERAL`. A Microsoft Foundry resource with an LLM deployment named **notice-llm** is available to the Translator resource. Each request must meet the following requirements:

        - The German translation uses the Custom Translator model.
        - The Spanish translation uses notice-llm with an informal tone, and follows the style of three approved example translations that are sent with the request.
        - The French translation uses the standard NMT engine, and profanity is removed from it.

        How should you complete the request body? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam Engineering traduit des avis de maintenance rédigés en anglais en appelant `POST https://fabrikam-tr.cognitiveservices.azure.com/translator/text/translate?api-version=2026-06-06`. Fabrikam a entraîné un modèle Custom Translator pour l'allemand dont l'ID de catégorie est `5b7e21c4-9d3a-4f60-8a1e-c2f4d7b90e35-GENERAL`. Une ressource Microsoft Foundry avec un déploiement LLM nommé **notice-llm** est disponible pour la ressource Translator. Chaque requête doit satisfaire les exigences suivantes :

        - La traduction en allemand utilise le modèle Custom Translator.
        - La traduction en espagnol utilise notice-llm avec un ton informel, et suit le style de trois exemples de traductions validées envoyés avec la requête.
        - La traduction en français utilise le moteur NMT standard, et les grossièretés en sont supprimées.

        Comment devez-vous compléter le corps de la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "inputs": [
            {
              "text": "Replace the filter every 500 operating hours.",
              "language": "en",
              "targets": [
                { "language": "de", "deploymentName": "[[de]]" },
                {
                  "language": "es",
                  "deploymentName": "notice-llm",
                  "tone": "informal",
                  "[[style]]": [
                    { "source": "Check the pump.", "target": "Revisa la bomba." },
                    { "source": "Clean the valve.", "target": "Limpia la válvula." },
                    { "source": "Stop the engine.", "target": "Apaga el motor." }
                  ]
                },
                { "language": "fr", "profanityAction": "[[profanity]]" }
              ]
            }
          ]
        }
      slots:
        - id: de
          options:
            - { id: general, text: general }
            - { id: category, text: 5b7e21c4-9d3a-4f60-8a1e-c2f4d7b90e35-GENERAL }
            - { id: llm, text: notice-llm }
        - id: style
          options:
            - { id: adaptive, text: adaptiveDatasetId }
            - { id: marker, text: profanityMarker }
            - { id: pairs, text: referenceTextPairs }
        - id: profanity
          options:
            - { id: noaction, text: NoAction }
            - { id: deleted, text: Deleted }
            - { id: marked, text: Marked }
    answer:
      values: { de: category, style: pairs, profanity: deleted }
    explanation:
      correct:
        en: |
          In version 2026-06-06, `deploymentName` selects the engine of each target: `general` for NMT, the name of an LLM deployment, or the category ID of a Custom Translator model. `referenceTextPairs` sends up to five source and target examples that steer the LLM toward their style. `profanityAction` set to `Deleted` removes profanity from the translation, while `Marked` only flags it.
        fr: |
          Dans la version 2026-06-06, `deploymentName` choisit le moteur de chaque cible : `general` pour la NMT, le nom d'un déploiement LLM, ou l'ID de catégorie d'un modèle Custom Translator. `referenceTextPairs` envoie jusqu'à cinq exemples source et cible qui orientent le LLM vers leur style. `profanityAction` défini sur `Deleted` supprime les grossièretés de la traduction, tandis que `Marked` les signale seulement.
      options:
        de:
          en: |
            `general` is the standard NMT system, not the custom model, and notice-llm is the LLM deployment that the Spanish target uses.
          fr: |
            `general` est le système NMT standard, pas le modèle personnalisé, et notice-llm est le déploiement LLM qu'utilise la cible espagnole.
        style:
          en: |
            `adaptiveDatasetId` takes the ID of an adaptive dataset built beforehand, not examples sent inline, and `profanityMarker` sets how marked profanity is shown.
          fr: |
            `adaptiveDatasetId` prend l'ID d'un jeu de données adaptatif construit au préalable, pas des exemples envoyés dans la requête, et `profanityMarker` définit l'affichage des grossièretés marquées.
        profanity:
          en: |
            `NoAction` (the default) keeps profanity, and `Marked` keeps it with an asterisk or tag marker instead of removing it.
          fr: |
            `NoAction` (par défaut) conserve les grossièretés, et `Marked` les conserve avec un marqueur (astérisque ou balise) au lieu de les supprimer.
    references:
      - title: Azure Translator in Foundry Tools 2026-06-06 translate method
        url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/2026-06-06/translate-api

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-41-09
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Woodgrove Bank summarizes regulatory change notices for its compliance officers by using the Responses API of a gpt-4.1 deployment. Each request contains the full notice and a strict schema with an `obligations` array. The temperature is 0.2. Reviewers report two problems:

        - Some summaries tell the officers which contracts to renegotiate and how. Bank policy states that the summaries describe obligations and never give legal advice.
        - The level of detail varies: some obligations are described in two words, others in a full paragraph.

        You need to fix both problems without training a model.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank résume des avis de changement réglementaire pour ses responsables de la conformité à l'aide de l'API Responses d'un déploiement gpt-4.1. Chaque requête contient l'avis complet et un schéma strict avec un tableau `obligations`. La température est de 0,2. Les relecteurs signalent deux problèmes :

        - Certaines synthèses indiquent aux responsables quels contrats renégocier et comment. La stratégie de la banque précise que les synthèses décrivent les obligations et ne donnent jamais de conseil juridique.
        - Le niveau de détail varie : certaines obligations sont décrites en deux mots, d'autres en un paragraphe entier.

        Vous devez corriger les deux problèmes sans entraîner de modèle.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Add a `maxLength` of 300 to the description field of each obligation in the schema.", fr: "Ajouter une valeur `maxLength` de 300 au champ de description de chaque obligation dans le schéma." } }
        - { id: b, text: { en: "Add instructions that name the audience and forbid recommending any legal action.", fr: "Ajouter des instructions qui nomment le public et interdisent de recommander toute action juridique." } }
        - { id: c, text: { en: "Add a guardrail with the Protected material for text control on the Output intervention point.", fr: "Ajouter un garde-fou avec le contrôle Protected material for text sur le point d'intervention Output." } }
        - { id: d, text: { en: "Add two example notices with summaries written by experts at the expected level of detail.", fr: "Ajouter deux exemples d'avis avec des synthèses rédigées par des experts au niveau de détail attendu." } }
        - { id: e, text: { en: "Set `max_output_tokens` to 300 so that every summary keeps the same length.", fr: "Définir `max_output_tokens` sur 300 pour que chaque synthèse garde la même longueur." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Instructions define the role, the audience and the rules of a domain task, such as "describe obligations, don't give legal advice". Few-shot examples show the model the expected level of detail; they condition only the current request and change nothing in the model. Both changes take minutes and need no training.
        fr: |
          Les instructions définissent le rôle, le public et les règles d'une tâche de domaine, comme « décrire les obligations, ne pas donner de conseil juridique ». Les exemples few-shot montrent au modèle le niveau de détail attendu ; ils ne conditionnent que la requête en cours et ne modifient rien dans le modèle. Les deux changements prennent quelques minutes et n'exigent aucun entraînement.
      options:
        a: { en: "`maxLength` isn't supported by strict structured outputs, and a maximum wouldn't stop two-word descriptions.", fr: "`maxLength` n'est pas pris en charge par les sorties structurées strictes, et un maximum n'empêcherait pas les descriptions de deux mots." }
        c: { en: "Protected material detects known copyrighted text in outputs; it doesn't detect legal advice.", fr: "Le contenu protégé détecte des textes connus protégés par le droit d'auteur dans les sorties ; il ne détecte pas les conseils juridiques." }
        e: { en: "A token limit truncates long outputs, which can cut the JSON; it doesn't make short descriptions more detailed.", fr: "Une limite de jetons tronque les sorties longues, ce qui peut couper le JSON ; elle ne rend pas plus détaillées les descriptions courtes." }
    references:
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
      - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-41-10
    objective: "4.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum Insurance produces compliance summaries of claim files by using a gpt-4.1 deployment in Microsoft Foundry. Each request contains domain instructions, ten few-shot examples, a strict schema and the current text of the applicable regulation, which changes every month. An evaluation on 400 files reviewed by experts shows that the summaries are consistent, grounded and correctly formatted, but they don't reach the drafting style that the regulator requires. Adding more examples to the prompt hasn't improved the style. The experts have 2,500 reviewed pairs of claim files and summaries written in the required style.

        You need to reach the required style. The summaries must stay accurate after each monthly change of the regulation.

        What should you do?
      fr: |
        Adatum Insurance produit des synthèses de conformité de dossiers de sinistre à l'aide d'un déploiement gpt-4.1 dans Microsoft Foundry. Chaque requête contient des instructions métier, dix exemples few-shot, un schéma strict et le texte actuel de la réglementation applicable, qui change chaque mois. Une évaluation sur 400 dossiers revus par des experts montre que les synthèses sont cohérentes, ancrées et correctement formatées, mais qu'elles n'atteignent pas le style de rédaction exigé par le régulateur. Ajouter d'autres exemples à l'invite n'a pas amélioré le style. Les experts disposent de 2 500 paires revues de dossiers et de synthèses rédigées dans le style exigé.

        Vous devez atteindre le style exigé. Les synthèses doivent rester exactes après chaque changement mensuel de la réglementation.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Fine-tune the model on the regulation and the reviewed pairs, and remove the regulation text from the requests.", fr: "Affiner le modèle sur la réglementation et les paires revues, et retirer le texte de la réglementation des requêtes." } }
        - { id: b, text: { en: "Add the 2,500 reviewed pairs to the instructions as examples, and raise the temperature to 1.0.", fr: "Ajouter les 2 500 paires revues aux instructions comme exemples, et augmenter la température à 1,0." } }
        - { id: c, text: { en: "Replace the model with Azure Language summarization, and add the reviewed pairs as a custom glossary.", fr: "Remplacer le modèle par le résumé d'Azure Language, et ajouter les paires revues comme glossaire personnalisé." } }
        - { id: d, text: { en: "Fine-tune the model on the reviewed pairs, and keep sending the current regulation text in each request.", fr: "Affiner le modèle sur les paires revues, et continuer d'envoyer le texte actuel de la réglementation dans chaque requête." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The prompt-based options are exhausted: the evaluation shows consistent, grounded output that still misses the style, and more examples don't help. Fine-tuning on expert-reviewed pairs is the documented way to teach a consistent tone or format. Training doesn't replace retrieval for current information, so the monthly regulation text stays in each request.
        fr: |
          Les options fondées sur l'invite sont épuisées : l'évaluation montre une sortie cohérente et ancrée qui manque toujours le style, et d'autres exemples n'aident pas. Le fine-tuning sur des paires revues par des experts est le moyen documenté d'apprendre un ton ou un format cohérent. L'entraînement ne remplace pas la récupération des informations actuelles : le texte mensuel de la réglementation reste donc dans chaque requête.
      options:
        a: { en: "A model trained on this month's regulation becomes outdated at the next change; training doesn't replace providing current information.", fr: "Un modèle entraîné sur la réglementation du mois devient obsolète au changement suivant ; l'entraînement ne remplace pas la fourniture d'informations actuelles." }
        b: { en: "More examples already failed, 2,500 pairs would add a huge token cost to every request, and a high temperature makes output less consistent.", fr: "D'autres exemples ont déjà échoué, 2 500 paires ajouteraient un coût en jetons énorme à chaque requête, et une température élevée rend la sortie moins cohérente." }
        c: { en: "Azure Language summarization is a legacy feature that doesn't follow a custom schema or style, and it has no glossary of example pairs.", fr: "Le résumé d'Azure Language est une fonctionnalité héritée qui ne suit ni un schéma ni un style personnalisés, et il n'a pas de glossaire de paires d'exemples." }
    references:
      - title: Training in Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/fine-tuning-considerations
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
