chapter: 11-foundry-services
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-11-01
    objective: "1.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The procurement policy of Fabrikam accepts a model from the Foundry Models catalog only if the model is hosted and operated by Azure, billed through the Azure subscription, covered by Azure service-level agreements (SLAs) and supported by Microsoft. The developers want to use a model from a provider other than OpenAI.

        Which models should the developers choose from?
      fr: |
        La politique d'achat de Fabrikam n'accepte un modèle du catalogue Foundry Models que s'il est hébergé et exploité par Azure, facturé via l'abonnement Azure, couvert par les contrats de niveau de service (SLA) Azure et pris en charge par Microsoft. Les développeurs veulent utiliser le modèle d'un fournisseur autre qu'OpenAI.

        Parmi quels modèles les développeurs doivent-ils choisir ?
    body:
      options:
        - { id: a, text: { en: "Foundry Models from partners and community", fr: "Les modèles Foundry Models des partenaires et de la communauté" } }
        - { id: b, text: { en: "Foundry Models sold by Azure", fr: "Les modèles Foundry Models vendus par Azure" } }
        - { id: c, text: { en: "Azure OpenAI models only, because no other provider qualifies", fr: "Uniquement les modèles Azure OpenAI, car aucun autre fournisseur ne convient" } }
        - { id: d, text: { en: "Any catalog model deployed with the Global Standard type", fr: "N'importe quel modèle du catalogue déployé avec le type Global Standard" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Foundry Models sold by Azure are hosted and operated by Azure, billed through the Azure subscription, covered by Azure SLAs and supported by Microsoft. The category contains all Azure OpenAI models and selected models from other providers, so the developers can pick a non-OpenAI model there and still meet the policy.
        fr: |
          Les modèles Foundry Models vendus par Azure sont hébergés et exploités par Azure, facturés via l'abonnement Azure, couverts par les SLA Azure et pris en charge par Microsoft. Cette catégorie contient tous les modèles Azure OpenAI et une sélection de modèles d'autres fournisseurs : les développeurs peuvent donc y choisir un modèle non OpenAI tout en respectant la politique.
      options:
        a: { en: "Models from partners and community form the other category of the catalog: they don't come with the Azure hosting, billing, SLA and Microsoft support guarantees of the models sold by Azure.", fr: "Les modèles des partenaires et de la communauté forment l'autre catégorie du catalogue : ils n'offrent pas les garanties d'hébergement, de facturation, de SLA et de support Microsoft des modèles vendus par Azure." }
        c: { en: "The models sold by Azure also include selected models from providers other than OpenAI, so the policy doesn't restrict the choice to Azure OpenAI.", fr: "Les modèles vendus par Azure comprennent aussi une sélection de modèles d'autres fournisseurs qu'OpenAI : la politique ne limite donc pas le choix à Azure OpenAI." }
        d: { en: "The deployment type sets where data is processed and how it's billed per token; it doesn't decide whether a model is sold, operated and supported by Microsoft.", fr: "Le type de déploiement fixe où les données sont traitées et comment les jetons sont facturés ; il ne décide pas si un modèle est vendu, exploité et pris en charge par Microsoft." }
    references:
      - title: Foundry Models sold by Azure - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-11-02
    objective: "1.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Contoso prompt agent has a function tool named `get_order_status`. A customer asks for the status of an order, and the model decides to call the function.

        What happens next?
      fr: |
        Un agent d'invite de Contoso dispose d'un outil de fonction nommé `get_order_status`. Un client demande l'état d'une commande, et le modèle décide d'appeler la fonction.

        Que se passe-t-il ensuite ?
    body:
      options:
        - { id: a, text: { en: "Foundry Agent Service runs the function in its managed runtime and passes the result to the model.", fr: "Foundry Agent Service exécute la fonction dans son runtime managé et transmet le résultat au modèle." } }
        - { id: b, text: { en: "The model deployment runs the function itself and writes the result directly into its answer.", fr: "Le déploiement du modèle exécute lui-même la fonction et écrit le résultat directement dans sa réponse." } }
        - { id: c, text: { en: "The response asks your application to run the function with the given arguments and send back the output.", fr: "La réponse demande à votre application d'exécuter la fonction avec les arguments fournis et de renvoyer le résultat." } }
        - { id: d, text: { en: "Foundry deploys the function to an Azure Functions app, runs it there and returns the output to the model.", fr: "Foundry déploie la fonction dans une application Azure Functions, l'y exécute et renvoie le résultat au modèle." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With function calling, the model only requests the call: the response contains a function call item with the function name and its arguments. Your application runs the function and sends its output back in a follow-up request, and the model then writes the answer. Function calling therefore runs on the client side.
        fr: |
          Avec l'appel de fonction, le modèle ne fait que demander l'appel : la réponse contient un élément d'appel de fonction avec le nom de la fonction et ses arguments. Votre application exécute la fonction et renvoie le résultat dans une requête suivante, puis le modèle rédige la réponse. L'appel de fonction s'exécute donc côté client.
      options:
        a: { en: "The service doesn't run function tools: it hands the call to the client, which is why function calling can't be part of a toolbox.", fr: "Le service n'exécute pas les outils de fonction : il confie l'appel au client, c'est pourquoi l'appel de fonction ne peut pas faire partie d'une boîte à outils." }
        b: { en: "A model never executes code of your application; it only generates the name and the arguments of the function to call.", fr: "Un modèle n'exécute jamais le code de votre application ; il génère seulement le nom et les arguments de la fonction à appeler." }
        d: { en: "Foundry doesn't create Azure resources from a function definition. Calling code hosted in Azure Functions is a different tool, configured separately.", fr: "Foundry ne crée pas de ressources Azure à partir d'une définition de fonction. Appeler du code hébergé dans Azure Functions relève d'un autre outil, configuré séparément." }
    references:
      - title: Use function calling with Microsoft Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-11-03
    objective: "1.1.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        The warehouse app of Northwind Traders looks up spare parts in an Azure AI Search index. Users type only part numbers, such as `NW-77812-B`, and restrict the results to their warehouse. Nobody types questions in natural language.

        You need to choose how the app queries the index. The solution must minimize cost and latency.

        What should you use?
      fr: |
        L'application d'entrepôt de Northwind Traders recherche des pièces détachées dans un index Azure AI Search. Les utilisateurs saisissent uniquement des références de pièces, comme `NW-77812-B`, et limitent les résultats à leur entrepôt. Personne ne saisit de question en langage naturel.

        Vous devez choisir comment l'application interroge l'index. La solution doit réduire au minimum le coût et la latence.

        Que devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Full-text (keyword) queries with a filter on the warehouse field", fr: "Des requêtes en texte intégral (mots clés) avec un filtre sur le champ de l'entrepôt" } }
        - { id: b, text: { en: "Vector queries with a filter on the warehouse field", fr: "Des requêtes vectorielles avec un filtre sur le champ de l'entrepôt" } }
        - { id: c, text: { en: "Hybrid queries with a filter on the warehouse field", fr: "Des requêtes hybrides avec un filtre sur le champ de l'entrepôt" } }
        - { id: d, text: { en: "Hybrid queries reranked by the semantic ranker, with a filter on the warehouse field", fr: "Des requêtes hybrides reclassées par le classeur sémantique, avec un filtre sur le champ de l'entrepôt" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Product codes and other exact identifiers are matched best by full-text search, which finds exact terms with BM25 scoring and supports filters. Because users never type natural language, embeddings and semantic reranking would add cost and latency without improving the results.
        fr: |
          Les références de produits et les autres identifiants exacts sont mieux trouvés par la recherche en texte intégral, qui trouve les termes exacts avec le score BM25 et prend en charge les filtres. Comme les utilisateurs ne saisissent jamais de langage naturel, les embeddings et le reclassement sémantique ajouteraient du coût et de la latence sans améliorer les résultats.
      options:
        b: { en: "Vector search matches meaning, not exact strings: it is weak on identifiers such as part numbers and needs embeddings for every document and query.", fr: "La recherche vectorielle trouve le sens, pas les chaînes exactes : elle est faible sur les identifiants comme les références de pièces et exige des embeddings pour chaque document et chaque requête." }
        c: { en: "A hybrid query also runs a vector query in parallel. With exact codes only, that part adds cost and latency and brings nothing that full-text search misses.", fr: "Une requête hybride exécute aussi une requête vectorielle en parallèle. Avec des références exactes uniquement, cette partie ajoute coût et latence et n'apporte rien que la recherche en texte intégral manquerait." }
        d: { en: "The semantic ranker adds a reranking step that is billed and slower; it helps natural-language queries, not exact code lookups.", fr: "Le classeur sémantique ajoute une étape de reclassement facturée et plus lente ; il aide les requêtes en langage naturel, pas la recherche de références exactes." }
    references:
      - title: Hybrid Search Overview - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-11-04
    objective: "1.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys plans an AI solution that uses agents, Azure OpenAI models, Azure Speech and Azure Content Understanding. The platform team wants a single Azure resource that gives access to all these capabilities, with one set of networking and security settings, and in which each team gets its own development space for agents and evaluations.

        What should you create?
      fr: |
        Wingtip Toys prévoit une solution IA qui utilise des agents, des modèles Azure OpenAI, Azure Speech et Azure Content Understanding. L'équipe plateforme veut une seule ressource Azure qui donne accès à toutes ces fonctionnalités, avec un seul ensemble de paramètres réseau et de sécurité, et dans laquelle chaque équipe dispose de son propre espace de développement pour ses agents et ses évaluations.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "An Azure AI Search service, with one index for each team", fr: "Un service Azure AI Search, avec un index pour chaque équipe" } }
        - { id: b, text: { en: "One standalone Foundry project for each team, without a parent resource", fr: "Un projet Foundry autonome pour chaque équipe, sans ressource parente" } }
        - { id: c, text: { en: "An Azure OpenAI resource and a Speech resource, shared by the teams", fr: "Une ressource Azure OpenAI et une ressource Speech, partagées par les équipes" } }
        - { id: d, text: { en: "A Foundry resource of kind `AIServices`, with one project for each team", fr: "Une ressource Foundry de kind `AIServices`, avec un projet pour chaque équipe" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A Foundry resource (`Microsoft.CognitiveServices/accounts`, kind `AIServices`) gives access in one resource to agents, evaluations, Azure OpenAI, Speech, Vision, Language and Content Understanding, and it holds the networking and security settings. Foundry projects are subresources of it: each team builds its agents and evaluations there while reusing the resource's deployments and connections.
        fr: |
          Une ressource Foundry (`Microsoft.CognitiveServices/accounts`, kind `AIServices`) donne accès dans une seule ressource aux agents, aux évaluations, à Azure OpenAI, Speech, Vision, Language et Content Understanding, et porte les paramètres réseau et de sécurité. Les projets Foundry en sont des sous-ressources : chaque équipe y crée ses agents et ses évaluations en réutilisant les déploiements et les connexions de la ressource.
      options:
        a: { en: "Azure AI Search provides indexing and retrieval; it doesn't give access to models, agents, Speech or Content Understanding.", fr: "Azure AI Search fournit l'indexation et la récupération ; il ne donne accès ni aux modèles, ni aux agents, ni à Speech, ni à Content Understanding." }
        b: { en: "A Foundry project is a subresource of a Foundry resource: it can't exist without its parent resource.", fr: "Un projet Foundry est une sous-ressource d'une ressource Foundry : il ne peut pas exister sans sa ressource parente." }
        c: { en: "Two separate resources mean two sets of settings, and neither provides agents, Content Understanding or projects.", fr: "Deux ressources distinctes signifient deux ensembles de paramètres, et aucune ne fournit les agents, Content Understanding ou les projets." }
    references:
      - title: Microsoft Foundry architecture - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-11-05
    objective: "1.1.4"
    difficulty: 2
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware is designing an IT help desk agent in Foundry Agent Service. For each requirement, you must decide what the agent needs.

        What should you use for each requirement? To answer, drag the appropriate elements to the correct requirements. Each element may be used once, more than once, or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware conçoit un agent de support informatique dans Foundry Agent Service. Pour chaque exigence, vous devez déterminer ce dont l'agent a besoin.

        Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les éléments appropriés vers les exigences correspondantes. Chaque élément peut être utilisé une fois, plusieurs fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: true
      items:
        - { id: know, text: { en: "A knowledge tool", fr: "Un outil de connaissances" } }
        - { id: act, text: { en: "An action tool", fr: "Un outil d'action" } }
        - { id: hist, text: { en: "The conversation history", fr: "L'historique de conversation" } }
        - { id: instr, text: { en: "The agent instructions", fr: "Les instructions de l'agent" } }
      targets:
        - { id: policies, text: { en: "Answer from the IT policies that the IT team indexes in Azure AI Search", fr: "Répondre à partir des politiques informatiques que l'équipe informatique indexe dans Azure AI Search" } }
        - { id: vpn, text: { en: "Reset the VPN token of a user through the REST API of the ticketing system", fr: "Réinitialiser le jeton VPN d'un utilisateur via l'API REST du système de tickets" } }
        - { id: status, text: { en: "Report today's public service status of a SaaS vendor, as published on the web", fr: "Indiquer l'état public du service d'un fournisseur SaaS aujourd'hui, tel que publié sur le web" } }
        - { id: tone, text: { en: "Always answer in a formal tone and never discuss salaries", fr: "Toujours répondre sur un ton formel et ne jamais parler des salaires" } }
    answer:
      mapping: { policies: know, vpn: act, status: know, tone: instr }
    explanation:
      correct:
        en: |
          Knowledge tools bring content that grounds the answers: the Azure AI Search tool for the indexed policies, and web search for current public information. Action tools let the agent do something, such as calling a REST API (OpenAPI tool) to reset a token. Rules of behavior and tone belong in the agent instructions, which every prompt agent definition contains with its model and tools.
        fr: |
          Les outils de connaissances apportent le contenu qui ancre les réponses : l'outil Azure AI Search pour les politiques indexées, et la recherche web pour les informations publiques récentes. Les outils d'action permettent à l'agent de faire quelque chose, par exemple appeler une API REST (outil OpenAPI) pour réinitialiser un jeton. Les règles de comportement et de ton relèvent des instructions de l'agent, que contient toute définition d'agent d'invite avec son modèle et ses outils.
      options:
        hist: { en: "The conversation history only keeps the context of follow-up questions in the same conversation; none of the four requirements depends on it.", fr: "L'historique de conversation conserve seulement le contexte des questions de suivi dans la même conversation ; aucune des quatre exigences n'en dépend." }
    references:
      - title: What is Microsoft Foundry Agent Service? - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/overview
      - title: Connect a Foundry IQ (Azure AI Search) index to Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-11-06
    objective: "1.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailwind Traders receives 1.5 million photos of returned items per day. For each photo, a model must pick one of 12 condition labels, such as "unopened" or "cracked screen", by following a short text instruction, and return the label in a JSON object. Tests on a sample show that larger models are no more accurate on this task.

        You need to choose the model to deploy. The solution must minimize the cost per photo and must not require training a model.

        Which model should you deploy?
      fr: |
        Tailwind Traders reçoit 1,5 million de photos d'articles retournés par jour. Pour chaque photo, un modèle doit choisir l'une de 12 étiquettes d'état, comme « non ouvert » ou « écran fissuré », en suivant une courte instruction textuelle, et renvoyer l'étiquette dans un objet JSON. Des tests sur un échantillon montrent que les modèles plus grands ne sont pas plus précis sur cette tâche.

        Vous devez choisir le modèle à déployer. La solution doit réduire au minimum le coût par photo et ne doit pas exiger l'entraînement d'un modèle.

        Quel modèle devez-vous déployer ?
    body:
      options:
        - { id: a, text: "`gpt-4.1-nano`" }
        - { id: b, text: "`gpt-4.1`" }
        - { id: c, text: "`o3`" }
        - { id: d, text: "`text-embedding-3-small`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The task needs a model that accepts image input and generates a short text answer. The whole GPT-4.1 series accepts text and image input, and the `-nano` variant is the small, low-cost option meant for simple, high-volume tasks. Because larger models bring no accuracy gain here, the smallest multimodal model minimizes the cost per photo.
        fr: |
          La tâche exige un modèle qui accepte une image en entrée et génère une courte réponse textuelle. Toute la série GPT-4.1 accepte le texte et l'image en entrée, et la variante `-nano` est l'option petite et peu coûteuse prévue pour les tâches simples à fort volume. Comme les modèles plus grands n'apportent aucun gain de précision ici, le plus petit modèle multimodal réduit au minimum le coût par photo.
      options:
        b: { en: "`gpt-4.1` accepts images too, but it costs more per token than its `-nano` variant, with no accuracy gain on this task.", fr: "`gpt-4.1` accepte aussi les images, mais coûte plus cher par jeton que sa variante `-nano`, sans gain de précision sur cette tâche." }
        c: { en: "`o3` is a reasoning model: it spends extra reasoning tokens and latency on a simple labeling task, which raises the cost per photo.", fr: "`o3` est un modèle de raisonnement : il consomme des jetons de raisonnement et de la latence en plus sur une simple tâche d'étiquetage, ce qui augmente le coût par photo." }
        d: { en: "An embedding model turns text into vectors and generates no text: it can't read the photos or return a label in JSON.", fr: "Un modèle d'embedding transforme du texte en vecteurs et ne génère pas de texte : il ne peut ni lire les photos ni renvoyer une étiquette en JSON." }
    references:
      - title: Foundry Models sold by Azure - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-11-07
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum has a RAG application that sends full-text queries to an Azure AI Search index of product manuals. The index has no vector fields.

        Users describe problems in their own words, such as "the unit won't power on", while the manuals say "the device fails to start". For these questions, the relevant chunks are often missing from the results altogether. Users also search with exact error codes, such as `E-4012`, and these searches work well today.

        A colleague proposes enabling the semantic ranker. You need to retrieve the chunks that are missing today without losing the exact matches on error codes, and the most relevant chunks must come first.

        What should you do?
      fr: |
        Adatum dispose d'une application RAG qui envoie des requêtes en texte intégral à un index Azure AI Search de manuels produits. L'index n'a aucun champ vectoriel.

        Les utilisateurs décrivent les problèmes avec leurs propres mots, comme « l'appareil ne s'allume pas », alors que les manuels disent « le périphérique ne démarre pas ». Pour ces questions, les segments pertinents sont souvent totalement absents des résultats. Les utilisateurs cherchent aussi avec des codes d'erreur exacts, comme `E-4012`, et ces recherches fonctionnent bien aujourd'hui.

        Un collègue propose d'activer le classeur sémantique. Vous devez récupérer les segments manquants aujourd'hui sans perdre les correspondances exactes sur les codes d'erreur, et les segments les plus pertinents doivent apparaître en premier.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep the full-text queries and enable the semantic ranker on them", fr: "Conserver les requêtes en texte intégral et leur appliquer le classeur sémantique" } }
        - { id: b, text: { en: "Add a vector field, then send hybrid queries reranked by the semantic ranker", fr: "Ajouter un champ vectoriel, puis envoyer des requêtes hybrides reclassées par le classeur sémantique" } }
        - { id: c, text: { en: "Add a vector field, then send vector queries reranked by the semantic ranker", fr: "Ajouter un champ vectoriel, puis envoyer des requêtes vectorielles reclassées par le classeur sémantique" } }
        - { id: d, text: { en: "Keep the full-text queries and raise `top` to 50 so the model sees more chunks", fr: "Conserver les requêtes en texte intégral et passer `top` à 50 pour que le modèle voie plus de segments" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The missing chunks use other words than the questions, so only a vector query on embeddings can find them. A hybrid query runs the full-text and vector queries in parallel and merges them with RRF, so exact error codes still match through the full-text part. The semantic ranker then reorders the top merged results so that the most relevant chunks come first.
        fr: |
          Les segments manquants emploient d'autres mots que les questions : seule une requête vectorielle sur des embeddings peut les trouver. Une requête hybride exécute les requêtes en texte intégral et vectorielle en parallèle et les fusionne par RRF : les codes d'erreur exacts continuent donc de correspondre grâce à la partie texte intégral. Le classeur sémantique réordonne ensuite les premiers résultats fusionnés pour que les segments les plus pertinents apparaissent en premier.
      options:
        a: { en: "The semantic ranker only reorders the top 50 results of the initial query; it can't rerun the query over the index to find chunks that BM25 didn't return.", fr: "Le classeur sémantique réordonne seulement les 50 premiers résultats de la requête initiale ; il ne peut pas réexécuter la requête sur l'index pour trouver des segments que BM25 n'a pas renvoyés." }
        c: { en: "Vector-only queries find paraphrases but are weak on exact identifiers, so the searches on error codes such as E-4012 would get worse.", fr: "Des requêtes uniquement vectorielles trouvent les paraphrases mais sont faibles sur les identifiants exacts : les recherches sur des codes d'erreur comme E-4012 se dégraderaient." }
        d: { en: "More results from the same keyword query still contain only chunks that share terms with the question; the missing chunks never appear.", fr: "Plus de résultats de la même requête par mots clés ne contiennent toujours que des segments qui partagent des termes avec la question ; les segments manquants n'apparaissent jamais." }
    references:
      - title: Semantic Ranking Overview - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
      - title: Hybrid Search Overview - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-11-08
    objective: "1.1.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware runs a Python service that prepares weekly market summaries. For each summary, the service calls a model with the web search tool and the code interpreter tool. The instructions and the tool configuration live in the service's Git repository and are released with the service code.

        The solution must meet the following requirements:

        - No agent or agent version is created or managed in the Foundry project.
        - The service keeps using the platform tools and the observability of the Foundry project.
        - Development effort is minimized.

        What should the service use?
      fr: |
        Litware exploite un service Python qui prépare des synthèses de marché hebdomadaires. Pour chaque synthèse, le service appelle un modèle avec l'outil de recherche web et l'outil interpréteur de code. Les instructions et la configuration des outils se trouvent dans le dépôt Git du service et sont publiées avec le code du service.

        La solution doit répondre aux exigences suivantes :

        - Aucun agent ni aucune version d'agent n'est créé ou géré dans le projet Foundry.
        - Le service continue d'utiliser les outils de la plateforme et l'observabilité du projet Foundry.
        - L'effort de développement est réduit au minimum.

        Que doit utiliser le service ?
    body:
      options:
        - { id: a, text: { en: "A prompt agent created with `create_version` at each release and called by its name", fr: "Un agent d'invite créé avec `create_version` à chaque version publiée et appelé par son nom" } }
        - { id: b, text: { en: "A hosted agent that packages the service code in a container", fr: "Un agent hébergé qui empaquette le code du service dans un conteneur" } }
        - { id: c, text: { en: "The Responses API, with the instructions and tools sent in each request", fr: "L'API Responses, avec les instructions et les outils envoyés dans chaque requête" } }
        - { id: d, text: { en: "The Chat Completions API, with web search and code execution written as functions", fr: "L'API Chat Completions, avec la recherche web et l'exécution de code écrites comme fonctions" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          When the application calls the Responses API directly, the agent definition (model, instructions, tools) lives in the application code and isn't persisted as a Foundry resource. The calls still get the catalog models, the platform tools such as web search and code interpreter, and the observability of the project, with no new component to build.
        fr: |
          Quand l'application appelle directement l'API Responses, la définition de l'agent (modèle, instructions, outils) vit dans le code de l'application et n'est pas conservée comme ressource Foundry. Les appels bénéficient quand même des modèles du catalogue, des outils de la plateforme comme la recherche web et l'interpréteur de code, et de l'observabilité du projet, sans nouveau composant à développer.
      options:
        a: { en: "`create_version` creates a persisted agent and a new version at each call, which the first requirement forbids.", fr: "`create_version` crée un agent persistant et une nouvelle version à chaque appel, ce que la première exigence interdit." }
        b: { en: "A hosted agent is an agent resource of the project with its own container to build and deploy: it breaks the first requirement and adds effort.", fr: "Un agent hébergé est une ressource d'agent du projet avec son propre conteneur à générer et déployer : il enfreint la première exigence et ajoute de l'effort." }
        d: { en: "With functions, the service would have to implement and run web search and code execution itself instead of using the platform tools, which adds development effort.", fr: "Avec des fonctions, le service devrait implémenter et exécuter lui-même la recherche web et l'exécution de code au lieu d'utiliser les outils de la plateforme, ce qui ajoute de l'effort de développement." }
    references:
      - title: What is Microsoft Foundry Agent Service? - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/overview
      - title: Hosted agents in Foundry Agent Service - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/hosted-agents

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-11-09
    objective: "1.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys runs four agents in a Foundry project: dispatch, billing, support and driver. All four call the fleet REST API through an OpenAPI tool and the tools of a mapping partner's remote MCP server. The platform team wants these tools defined once and exposed through a single endpoint, with central authentication and versioning, so that a new version of the tools reaches the four agents without any change to the agents.

        The driver agent has two more requirements:

        - Use the GPS position of the driver's phone. Only the mobile app can read it, and the phone isn't reachable from the internet.
        - Answer from the vehicle procedures stored in the existing Azure AI Search index **fleet-procedures**, which the search team curates. The procedures must not be copied to another store.

        What should you use for each requirement? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys exploite quatre agents dans un projet Foundry : dispatch, billing, support et driver. Les quatre appellent l'API REST de la flotte via un outil OpenAPI et les outils du serveur MCP distant d'un partenaire de cartographie. L'équipe plateforme veut que ces outils soient définis une seule fois et exposés par un point de terminaison unique, avec authentification et gestion de versions centralisées, afin qu'une nouvelle version des outils atteigne les quatre agents sans aucune modification des agents.

        L'agent driver a deux exigences de plus :

        - Utiliser la position GPS du téléphone du chauffeur. Seule l'application mobile peut la lire, et le téléphone n'est pas joignable depuis Internet.
        - Répondre à partir des procédures véhicules stockées dans l'index Azure AI Search existant **fleet-procedures**, que l'équipe de recherche organise. Les procédures ne doivent pas être copiées dans un autre magasin.

        Que devez-vous utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Fleet API and mapping tools of the four agents: [[shared]]

          GPS position of the phone: [[gps]]

          Vehicle procedures: [[procs]]
        fr: |
          API de la flotte et outils de cartographie des quatre agents : [[shared]]

          Position GPS du téléphone : [[gps]]

          Procédures véhicules : [[procs]]
      slots:
        - id: shared
          options:
            - { id: each, text: { en: "An OpenAPI tool and an MCP tool configured on each agent", fr: "Un outil OpenAPI et un outil MCP configurés sur chaque agent" } }
            - { id: toolbox, text: { en: "A toolbox that the four agents connect to", fr: "Une boîte à outils à laquelle les quatre agents se connectent" } }
            - { id: kb, text: { en: "A Foundry IQ knowledge base shared by the four agents", fr: "Une base de connaissances Foundry IQ partagée par les quatre agents" } }
        - id: gps
          options:
            - { id: fnbox, text: { en: "A function tool added to the shared toolbox", fr: "Un outil de fonction ajouté à la boîte à outils partagée" } }
            - { id: openapi, text: { en: "An OpenAPI tool that calls an API on the phone", fr: "Un outil OpenAPI qui appelle une API sur le téléphone" } }
            - { id: fnagent, text: { en: "A function tool defined on the driver agent", fr: "Un outil de fonction défini sur l'agent driver" } }
        - id: procs
          options:
            - { id: fs, text: { en: "A file search tool with the procedures uploaded to a vector store", fr: "Un outil de recherche de fichiers avec les procédures chargées dans un magasin de vecteurs" } }
            - { id: search, text: { en: "An Azure AI Search tool connected to the fleet-procedures index", fr: "Un outil Azure AI Search connecté à l'index fleet-procedures" } }
            - { id: ci, text: { en: "A code interpreter tool that reads an export of the index", fr: "Un outil interpréteur de code qui lit un export de l'index" } }
    answer:
      values: { shared: toolbox, gps: fnagent, procs: search }
    explanation:
      correct:
        en: |
          A toolbox defines a curated set of tools once and exposes it through a single MCP-compatible endpoint, with central authentication and versions that you promote to default; every agent that points to it gets the new version without code changes. Function calling runs on the client side, so it can't go in a toolbox: the GPS function must be defined on the driver agent, and the mobile app runs it. The Azure AI Search tool connects the agent directly to an existing index, so the curated procedures stay where they are.
        fr: |
          Une boîte à outils définit une fois un ensemble d'outils choisis et l'expose par un point de terminaison unique compatible MCP, avec authentification centralisée et des versions que vous promouvez par défaut ; chaque agent qui la référence reçoit la nouvelle version sans modification de code. L'appel de fonction s'exécute côté client et ne peut donc pas faire partie d'une boîte à outils : la fonction GPS doit être définie sur l'agent driver, et l'application mobile l'exécute. L'outil Azure AI Search connecte l'agent directement à un index existant : les procédures organisées restent où elles sont.
      options:
        each: { en: "Tools configured on each agent must be defined and updated four times, with separate credentials: no single endpoint, no central versioning.", fr: "Des outils configurés sur chaque agent doivent être définis et mis à jour quatre fois, avec des informations d'identification distinctes : ni point de terminaison unique, ni gestion de versions centralisée." }
        kb: { en: "A knowledge base provides content for grounding, not actions: it can't expose an OpenAPI or MCP tool.", fr: "Une base de connaissances fournit du contenu pour l'ancrage, pas des actions : elle ne peut pas exposer un outil OpenAPI ou MCP." }
        fnbox: { en: "Function calling is executed by the client, and Learn lists it among the tools that a toolbox can't contain.", fr: "L'appel de fonction est exécuté par le client, et Learn le classe parmi les outils qu'une boîte à outils ne peut pas contenir." }
        openapi: { en: "An OpenAPI tool is called by the service over the network, and the phone isn't reachable from the internet.", fr: "Un outil OpenAPI est appelé par le service à travers le réseau, et le téléphone n'est pas joignable depuis Internet." }
        fs: { en: "File search indexes uploaded copies in a vector store, which breaks the requirement not to copy the procedures.", fr: "La recherche de fichiers indexe des copies chargées dans un magasin de vecteurs, ce qui enfreint l'exigence de ne pas copier les procédures." }
        ci: { en: "The code interpreter runs Python on files; an export is a copy, and the tool doesn't retrieve passages from the index.", fr: "L'interpréteur de code exécute du Python sur des fichiers ; un export est une copie, et l'outil ne récupère pas de passages dans l'index." }
    references:
      - title: What is Toolbox in Microsoft Foundry? - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/toolbox-overview
      - title: Connect a Foundry IQ (Azure AI Search) index to Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-11-10
    objective: "1.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam stores 400,000 scanned maintenance reports as image-only PDF files in an Azure Blob Storage container, and about 2,000 new reports are added each day. Each report has 30 to 80 pages. You are building the Azure AI Search index that grounds a RAG agent. Technicians ask questions in natural language.

        The solution must meet the following requirements:

        - New reports are indexed automatically every day, without reprocessing the existing reports.
        - The text of the scanned pages is searchable, and each part of a long report can be matched on its own.
        - No custom code computes embeddings, at indexing or at query time.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam stocke 400 000 rapports de maintenance numérisés, sous forme de fichiers PDF ne contenant que des images, dans un conteneur Stockage Blob Azure, et environ 2 000 nouveaux rapports s'y ajoutent chaque jour. Chaque rapport compte de 30 à 80 pages. Vous créez l'index Azure AI Search qui ancre un agent RAG. Les techniciens posent leurs questions en langage naturel.

        La solution doit répondre aux exigences suivantes :

        - Les nouveaux rapports sont indexés automatiquement chaque jour, sans retraiter les rapports existants.
        - Le texte des pages numérisées est interrogeable, et chaque partie d'un long rapport peut être trouvée seule.
        - Aucun code personnalisé ne calcule d'embeddings, ni à l'indexation ni au moment de la requête.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 3
      options:
        - { id: a, text: { en: "Create a scheduled indexer on the container, with a skillset that runs the OCR skill and the Text Split skill.", fr: "Créer un indexeur planifié sur le conteneur, avec un ensemble de compétences qui exécute la compétence OCR et la compétence Text Split." } }
        - { id: b, text: { en: "Load the reports with the push API from a script that extracts the text and calls the embedding deployment.", fr: "Charger les rapports avec l'API push depuis un script qui extrait le texte et appelle le déploiement d'embedding." } }
        - { id: c, text: { en: "Add an embedding skill, and assign to the vector field a vectorizer that uses the same embedding model.", fr: "Ajouter une compétence d'embedding, et attribuer au champ vectoriel un vectoriseur qui utilise le même modèle d'embedding." } }
        - { id: d, text: { en: "Reset and run the indexer every night so that the whole container is processed again with each run.", fr: "Réinitialiser et exécuter l'indexeur chaque nuit pour que tout le conteneur soit retraité à chaque exécution." } }
        - { id: e, text: { en: "Send vector queries of kind `vector` that contain embeddings computed by the agent's application.", fr: "Envoyer des requêtes vectorielles de kind `vector` qui contiennent des embeddings calculés par l'application de l'agent." } }
        - { id: f, text: { en: "Send vector queries of kind `text`, so that the search service embeds each question itself.", fr: "Envoyer des requêtes vectorielles de kind `text`, pour que le service de recherche calcule lui-même l'embedding de chaque question." } }
    answer: { optionIds: [a, c, f] }
    explanation:
      correct:
        en: |
          A scheduled indexer on Blob Storage indexes new blobs incrementally, and its skillset can run OCR on the page images (with image extraction enabled on the indexer) and split the long text into chunks. An embedding skill creates the chunk vectors during indexing, and a vectorizer on the vector field, which must use the same embedding model, converts query text into a vector. Vector queries of kind `text` rely on that vectorizer, so no custom code computes embeddings.
        fr: |
          Un indexeur planifié sur le Stockage Blob indexe les nouveaux objets blob de façon incrémentielle, et son ensemble de compétences peut exécuter l'OCR sur les images des pages (avec l'extraction d'images activée sur l'indexeur) et découper le long texte en segments. Une compétence d'embedding crée les vecteurs des segments pendant l'indexation, et un vectoriseur sur le champ vectoriel, qui doit utiliser le même modèle d'embedding, convertit le texte de la requête en vecteur. Les requêtes vectorielles de kind `text` s'appuient sur ce vectoriseur : aucun code personnalisé ne calcule d'embeddings.
      options:
        b: { en: "A script that calls the embedding deployment is custom code, and the push API gives up the scheduled, incremental indexing of the container.", fr: "Un script qui appelle le déploiement d'embedding est du code personnalisé, et l'API push renonce à l'indexation planifiée et incrémentielle du conteneur." }
        d: { en: "Resetting the indexer makes it reprocess every report at each run, which the first requirement forbids; a schedule alone picks up only the new blobs.", fr: "Réinitialiser l'indexeur lui fait retraiter tous les rapports à chaque exécution, ce que la première exigence interdit ; une planification seule ne prend que les nouveaux objets blob." }
        e: { en: "Queries of kind `vector` carry embeddings that the application computes itself, which is custom code at query time.", fr: "Les requêtes de kind `vector` contiennent des embeddings que l'application calcule elle-même, ce qui est du code personnalisé au moment de la requête." }
    references:
      - title: OCR Skill - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr
      - title: Configure Vectorizer - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-configure-vectorizer
