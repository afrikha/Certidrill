chapter: 21-generative-apps
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-21-01
    objective: "2.1.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders is deploying a GPT model from the Foundry model catalog for a customer chat assistant that answers in real time. The compliance policy requires that prompts and responses are processed only within the European Union. Traffic varies during the day, and the company wants to pay per token without reserving capacity.

        Which deployment type should you use?
      fr: |
        Northwind Traders déploie un modèle GPT du catalogue de modèles Foundry pour un assistant de conversation qui répond aux clients en temps réel. La politique de conformité exige que les invites et les réponses soient traitées uniquement dans l'Union européenne. Le trafic varie au cours de la journée, et l'entreprise veut payer au jeton sans réserver de capacité.

        Quel type de déploiement devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Global Standard }
        - { id: b, text: Data Zone Standard }
        - { id: c, text: Data Zone Batch }
        - { id: d, text: Global Provisioned }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Data Zone Standard is billed per token and processes prompts and responses only within the Microsoft-defined data zone. With the EU data zone, processing stays within the EU Data Boundary, and no capacity has to be reserved.
        fr: |
          Data Zone Standard est facturé au jeton et traite les invites et les réponses uniquement dans la zone de données définie par Microsoft. Avec la zone de données UE, le traitement reste dans la limite des données de l'UE (EU Data Boundary), sans capacité à réserver.
      options:
        a: { en: "Global Standard is the usual default, but Global types may process prompts and responses in any Azure region.", fr: "Global Standard est le choix habituel par défaut, mais les types Global peuvent traiter les invites et les réponses dans n'importe quelle région Azure." }
        c: { en: "Batch types process large asynchronous jobs with a 24-hour target turnaround; they don't serve a real-time chat.", fr: "Les types Batch traitent de gros travaux asynchrones avec un délai cible de 24 heures ; ils ne servent pas une conversation en temps réel." }
        d: { en: "Provisioned types reserve throughput units, which the company doesn't want, and Global types may process data in any region.", fr: "Les types provisionnés réservent des unités de débit, ce que l'entreprise ne veut pas, et les types Global peuvent traiter les données dans n'importe quelle région." }
    references:
      - title: Understanding deployment types in Microsoft Foundry Models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-21-02
    objective: "2.1.4"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's HR assistant is a RAG application. In a typical failure, an employee asks how many days of parental leave she can take, and the assistant accurately quotes the policy passage about carrying over vacation days. The retrieved passages do contain the parental leave rule, and every statement of the answer comes from the passages.

        The test dataset contains the query, the retrieved context and the response for each item. You need an evaluator that flags this kind of answer.

        Which evaluator should you use?
      fr: |
        L'assistant RH de Contoso est une application RAG. Dans un échec typique, une employée demande combien de jours de congé parental elle peut prendre, et l'assistant cite fidèlement le passage de la stratégie sur le report des jours de congés payés. Les passages récupérés contiennent bien la règle du congé parental, et chaque affirmation de la réponse provient des passages.

        Le jeu de données de test contient la requête, le contexte récupéré et la réponse pour chaque élément. Vous avez besoin d'un évaluateur qui signale ce type de réponse.

        Quel évaluateur devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Groundedness }
        - { id: b, text: Relevance }
        - { id: c, text: Retrieval }
        - { id: d, text: Fluency }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Relevance takes the query and the response and measures whether the response actually addresses the question. A correct quote about vacation days doesn't answer a question about parental leave, so Relevance scores it low even though the content is accurate.
        fr: |
          Relevance prend la requête et la réponse, et mesure si la réponse traite réellement la question. Une citation exacte sur les congés payés ne répond pas à une question sur le congé parental : Relevance lui donne donc un score faible, même si le contenu est exact.
      options:
        a: { en: "Groundedness checks that the response contains nothing outside the context; these answers come entirely from the passages, so they pass.", fr: "Groundedness vérifie que la réponse ne contient rien en dehors du contexte ; ces réponses proviennent entièrement des passages, donc elles réussissent." }
        c: { en: "Retrieval judges whether the retrieved context is relevant to the query; here the passages contain the right rule, so retrieval isn't the failure.", fr: "Retrieval juge si le contexte récupéré est pertinent pour la requête ; ici, les passages contiennent la bonne règle, donc la récupération n'est pas en cause." }
        d: { en: "Fluency measures how readable and well formed the text is, not whether it answers the question.", fr: "Fluency mesure la lisibilité et la qualité de rédaction du texte, pas le fait qu'il réponde à la question." }
    references:
      - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-21-03
    objective: "2.1.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's support portal answers questions from 3,000 product manuals stored as PDF files in Azure Blob Storage. The application queries an Azure AI Search index whose only fields are `id`, `content` and `contentVector`, then sends the top five passages to a model deployment. The instructions already ask the model to end each answer with a link to the manual it used.

        Product managers report that some answers end with links that don't exist. You need each answer to end with a real link to its source manual.

        What should you do?
      fr: |
        Le portail de support de Fabrikam répond aux questions à partir de 3 000 manuels produits stockés sous forme de fichiers PDF dans Stockage Blob Azure. L'application interroge un index Azure AI Search dont les seuls champs sont `id`, `content` et `contentVector`, puis envoie les cinq meilleurs passages à un déploiement de modèle. Les instructions demandent déjà au modèle de terminer chaque réponse par un lien vers le manuel utilisé.

        Les chefs de produit signalent que certaines réponses se terminent par des liens qui n'existent pas. Vous devez faire en sorte que chaque réponse se termine par un lien réel vers son manuel source.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add title and url fields to the index, and send them with each passage for the model to cite.", fr: "Ajouter des champs title et url à l'index, et les envoyer avec chaque passage pour que le modèle les cite." } }
        - { id: b, text: { en: "Enable semantic ranking, and send the semantic captions of the top results as the citations.", fr: "Activer le classement sémantique, et envoyer les légendes sémantiques des meilleurs résultats comme citations." } }
        - { id: c, text: { en: "Increase top from 5 to 20, so that the model receives more passages to pick a link from.", fr: "Faire passer top de 5 à 20, pour que le modèle reçoive davantage de passages où choisir un lien." } }
        - { id: d, text: { en: "Run the Groundedness evaluator on each answer, so that each answer is linked to its passage.", fr: "Exécuter l'évaluateur Groundedness sur chaque réponse, pour que chaque réponse soit liée à son passage." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The passages contain no title or address, so the model can only invent a link. An index can store fields that improve citations, such as document titles and URLs; filling them at indexing time and sending them with each passage lets the model cite a real source, as the augment step of RAG requires.
        fr: |
          Les passages ne contiennent ni titre ni adresse : le modèle ne peut donc qu'inventer un lien. Un index peut stocker des champs qui améliorent les citations, comme les titres et les URL des documents ; les remplir lors de l'indexation et les envoyer avec chaque passage permet au modèle de citer une source réelle, comme l'exige l'étape d'augmentation du RAG.
      options:
        b: { en: "Semantic captions are excerpts of the indexed text; they reorder and highlight content but add no link to the source document.", fr: "Les légendes sémantiques sont des extraits du texte indexé ; elles réordonnent et mettent en évidence le contenu, mais n'ajoutent aucun lien vers le document source." }
        c: { en: "More passages still carry no URL, so the model keeps inventing links, and the prompt costs more tokens.", fr: "Davantage de passages ne portent toujours aucune URL : le modèle continue d'inventer des liens, et l'invite coûte plus de jetons." }
        d: { en: "An evaluator scores answers in a test or monitoring run; it doesn't add sources to the answers that users receive.", fr: "Un évaluateur note les réponses lors d'une exécution de test ou de surveillance ; il n'ajoute pas de sources aux réponses que reçoivent les utilisateurs." }
    references:
      - title: Retrieval augmented generation (RAG) and indexes in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-21-04
    objective: "2.1.6"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        A developer at Adatum runs a Python script on her workstation. The script creates an `AIProjectClient` with `DefaultAzureCredential()` for a Foundry project named **claims**, then calls `responses.create()` on a model deployment of the project.

        She signed in with `az login`, and her account has the Reader role on the resource group that contains the Foundry resource. The call fails with an authorization error stating that her account lacks a required data action. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Une développeuse d'Adatum exécute un script Python sur son poste de travail. Le script crée un `AIProjectClient` avec `DefaultAzureCredential()` pour un projet Foundry nommé **claims**, puis appelle `responses.create()` sur un déploiement de modèle du projet.

        Elle s'est connectée avec `az login`, et son compte dispose du rôle Reader sur le groupe de ressources qui contient la ressource Foundry. L'appel échoue avec une erreur d'autorisation indiquant qu'il manque à son compte une action de données requise. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Assign her the Foundry User role on the claims project.", fr: "Lui attribuer le rôle Foundry User sur le projet claims." } }
        - { id: b, text: { en: "Assign her the Foundry Account Owner role on the Foundry resource.", fr: "Lui attribuer le rôle Foundry Account Owner sur la ressource Foundry." } }
        - { id: c, text: { en: "Assign her the Cognitive Services Contributor role on the resource group.", fr: "Lui attribuer le rôle Cognitive Services Contributor sur le groupe de ressources." } }
        - { id: d, text: { en: "Pass the API key of the resource to the client in an `AzureKeyCredential`.", fr: "Transmettre la clé API de la ressource au client dans un `AzureKeyCredential`." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Authentication already works: the error is about authorization. Reader grants no data actions, and Foundry User adds the project data actions needed to call models and agents in the project, without the right to manage models or create projects. Assigning it on the project keeps the scope as narrow as possible.
        fr: |
          L'authentification fonctionne déjà : l'erreur concerne l'autorisation. Reader n'accorde aucune action de données, et Foundry User ajoute les actions de données du projet nécessaires pour appeler les modèles et les agents du projet, sans le droit de gérer les modèles ni de créer des projets. L'attribuer sur le projet garde l'étendue la plus restreinte possible.
      options:
        b: { en: "Foundry Account Owner creates projects and manages models, but it has no data actions, so the call would still fail.", fr: "Foundry Account Owner crée des projets et gère des modèles, mais il n'a aucune action de données : l'appel échouerait encore." }
        c: { en: "Cognitive Services roles aren't the roles to use for Foundry work; Cognitive Services Contributor only matters for control plane operations.", fr: "Les rôles Cognitive Services ne sont pas ceux à utiliser pour Foundry ; Cognitive Services Contributor ne sert que pour des opérations du plan de contrôle." }
        d: { en: "AIProjectClient takes a Microsoft Entra token credential, not a key; a key would also grant full access without role restrictions.", fr: "AIProjectClient attend des informations d'identification Microsoft Entra (jeton), pas une clé ; une clé accorderait en outre un accès complet sans restriction de rôle." }
    references:
      - title: Role-based access control for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-21-05
    objective: "2.1.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Northwind Traders has a Python application that starts with the following code.

        ```text
        project = AIProjectClient(
            endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"],
            credential=DefaultAzureCredential(),
        )
        openai = project.get_openai_client()
        ```

        The Foundry project contains a connection named **nw-search** to an Azure AI Search service. Before each model call, the application's own code retrieves passages from an index of that service.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders dispose d'une application Python qui commence par le code suivant.

        ```text
        project = AIProjectClient(
            endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"],
            credential=DefaultAzureCredential(),
        )
        openai = project.get_openai_client()
        ```

        Le projet Foundry contient une connexion nommée **nw-search** vers un service Azure AI Search. Avant chaque appel au modèle, le code de l'application récupère lui-même des passages dans un index de ce service.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The application can read the connections of the project, such as nw-search, by using `project`.", fr: "L'application peut lire les connexions du projet, comme nw-search, en utilisant `project`." }
        - id: s2
          text: { en: "The application can create and run a cloud evaluation of a model deployment by using `openai`.", fr: "L'application peut créer et exécuter une évaluation cloud d'un déploiement de modèle en utilisant `openai`." }
        - id: s3
          text: { en: "The application can send its queries to the search index through `openai`, because the project has the nw-search connection.", fr: "L'application peut envoyer ses requêtes à l'index de recherche via `openai`, parce que le projet possède la connexion nw-search." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          `AIProjectClient` handles Foundry-native operations such as listing and reading connections. The OpenAI-compatible client returned by `get_openai_client()` handles the OpenAI-style APIs, including responses and evaluations (`openai.evals`). Retrieval written in the application's own code uses the Azure AI Search SDK and the search service's own endpoint; a connection stores how to reach the service and authenticate, mainly for tools, and doesn't turn the OpenAI client into a search client.
        fr: |
          `AIProjectClient` gère les opérations propres à Foundry, comme lister et lire les connexions. Le client compatible OpenAI renvoyé par `get_openai_client()` gère les API de style OpenAI, dont les réponses et les évaluations (`openai.evals`). Une récupération écrite dans le code de l'application utilise le SDK Azure AI Search et le point de terminaison propre au service de recherche ; une connexion décrit comment joindre le service et s'y authentifier, surtout pour les outils, et ne transforme pas le client OpenAI en client de recherche.
      options:
        s3: { en: "Search queries go through `SearchClient` from `azure-search-documents`, with the search service endpoint; the OpenAI client has no search API.", fr: "Les requêtes de recherche passent par `SearchClient` d'`azure-search-documents`, avec le point de terminaison du service de recherche ; le client OpenAI n'a pas d'API de recherche." }
    references:
      - title: Get started with Microsoft Foundry SDKs and endpoints - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/sdk-overview

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-21-06
    objective: "2.1.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware's financial analysis feature calls a deployment named **analyst-r**, which runs a reasoning model, by using the following code.

        ```text
        response = openai.responses.create(
            model="analyst-r",
            reasoning={"effort": "high"},
            input=question,
            max_output_tokens=1000,
        )
        print(response.output_text)
        ```

        Simple questions get correct answers. For complex questions, the feature prints an empty string. For those requests, `response.status` is `incomplete`, `response.incomplete_details.reason` is `max_output_tokens`, and `response.usage.output_tokens` is 1000. No request is throttled.

        The analysts require the current reasoning effort. You need the feature to return answers to complex questions.

        What should you do?
      fr: |
        La fonctionnalité d'analyse financière de Litware appelle un déploiement nommé **analyst-r**, qui exécute un modèle de raisonnement, avec le code suivant.

        ```text
        response = openai.responses.create(
            model="analyst-r",
            reasoning={"effort": "high"},
            input=question,
            max_output_tokens=1000,
        )
        print(response.output_text)
        ```

        Les questions simples obtiennent des réponses correctes. Pour les questions complexes, la fonctionnalité affiche une chaîne vide. Pour ces requêtes, `response.status` vaut `incomplete`, `response.incomplete_details.reason` vaut `max_output_tokens` et `response.usage.output_tokens` vaut 1000. Aucune requête n'est limitée (throttling).

        Les analystes exigent le niveau d'effort de raisonnement actuel. Vous devez faire en sorte que la fonctionnalité renvoie des réponses aux questions complexes.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Raise max_output_tokens so that it covers the reasoning and the visible answer, and check the status of each response.", fr: "Augmenter max_output_tokens pour couvrir le raisonnement et la réponse visible, et vérifier le statut de chaque réponse." } }
        - { id: b, text: { en: "Replace max_output_tokens with max_tokens=1000, so that the limit applies only to the visible part of the answer.", fr: "Remplacer max_output_tokens par max_tokens=1000, pour que la limite ne s'applique qu'à la partie visible de la réponse." } }
        - { id: c, text: { en: "Set store=False, so that the reasoning tokens of earlier requests no longer count toward the limit of the request.", fr: "Définir store=False, pour que les jetons de raisonnement des requêtes précédentes ne comptent plus dans la limite de la requête." } }
        - { id: d, text: { en: "Redeploy analyst-r with the Global Provisioned deployment type, so that the deployment gets more throughput.", fr: "Redéployer analyst-r avec le type de déploiement Global Provisioned, pour que le déploiement obtienne plus de débit." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          On a reasoning model, `max_output_tokens` caps the reasoning tokens as well as the visible output. With high effort, complex questions use the whole budget on reasoning, so the response ends `incomplete` before any visible text, and you still pay for those tokens. Raising the cap leaves room for the answer, and checking `status` keeps the application from treating an incomplete response as an empty answer.
        fr: |
          Sur un modèle de raisonnement, `max_output_tokens` plafonne les jetons de raisonnement autant que la sortie visible. Avec un effort élevé, les questions complexes consomment tout le budget en raisonnement : la réponse se termine `incomplete` avant tout texte visible, et ces jetons sont tout de même facturés. Relever le plafond laisse de la place à la réponse, et vérifier `status` évite que l'application traite une réponse incomplète comme une réponse vide.
      options:
        b: { en: "Reasoning models don't support max_tokens; the Responses API caps output with max_output_tokens, which always includes reasoning tokens.", fr: "Les modèles de raisonnement ne prennent pas en charge max_tokens ; l'API Responses plafonne la sortie avec max_output_tokens, qui inclut toujours les jetons de raisonnement." }
        c: { en: "store only controls whether the service keeps the response; each request's reasoning tokens count against its own cap whatever its value.", fr: "store détermine seulement si le service conserve la réponse ; les jetons de raisonnement de chaque requête comptent dans son propre plafond, quelle que soit sa valeur." }
        d: { en: "Throughput and quota limit the number of requests and tokens per minute; the failure comes from the per-response cap, not from throttling.", fr: "Le débit et le quota limitent le nombre de requêtes et de jetons par minute ; l'échec vient du plafond par réponse, pas d'une limitation." }
    references:
      - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5 - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-21-07
    objective: "2.1.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso has a prompt agent named **support-agent** in a Foundry project. Version 1 of the agent runs in production.

        - In March, the team created a cloud evaluation named **support-quality** with the Groundedness and Relevance evaluators, and ran it on a dataset named **ds-march** with version 1 as the target.
        - This week, the team created version 2 of the agent with new instructions, and ran support-quality on a new dataset named **ds-november** with version 2 as the target. The scores of version 2 are higher.

        Version 2 must be promoted only if it scores better than version 1 on the same test items.

        What should you do next?
      fr: |
        Contoso dispose d'un agent d'invite nommé **support-agent** dans un projet Foundry. La version 1 de l'agent est en production.

        - En mars, l'équipe a créé une évaluation cloud nommée **support-quality** avec les évaluateurs Groundedness et Relevance, et l'a exécutée sur un jeu de données nommé **ds-march** avec la version 1 comme cible.
        - Cette semaine, l'équipe a créé la version 2 de l'agent avec de nouvelles instructions, et a exécuté support-quality sur un nouveau jeu de données nommé **ds-november** avec la version 2 comme cible. Les scores de la version 2 sont plus élevés.

        La version 2 ne doit être promue que si elle obtient de meilleurs scores que la version 1 sur les mêmes éléments de test.

        Que devez-vous faire ensuite ?
    body:
      options:
        - { id: a, text: { en: "Run support-quality on ds-november with the target `{\"type\": \"azure_ai_agent\", \"name\": \"support-agent\", \"version\": \"1\"}`, then compare it with the version 2 run.", fr: "Exécuter support-quality sur ds-november avec la cible `{\"type\": \"azure_ai_agent\", \"name\": \"support-agent\", \"version\": \"1\"}`, puis la comparer à l'exécution de la version 2." } }
        - { id: b, text: { en: "Run support-quality on ds-november with the target `{\"type\": \"azure_ai_agent\", \"name\": \"support-agent\"}`, then compare it with the version 2 run.", fr: "Exécuter support-quality sur ds-november avec la cible `{\"type\": \"azure_ai_agent\", \"name\": \"support-agent\"}`, puis la comparer à l'exécution de la version 2." } }
        - { id: c, text: { en: "Compare the version 1 run on ds-march with the version 2 run on ds-november, because both runs use the same evaluators and thresholds.", fr: "Comparer l'exécution de la version 1 sur ds-march à celle de la version 2 sur ds-november, car les deux utilisent les mêmes évaluateurs et seuils." } }
        - { id: d, text: { en: "Run support-quality on ds-november with an `azure_ai_model` target that names the deployment of support-agent, then compare it with the version 2 run.", fr: "Exécuter support-quality sur ds-november avec une cible `azure_ai_model` qui nomme le déploiement de support-agent, puis la comparer à l'exécution de la version 2." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          A valid comparison runs both versions on the same dataset with the same testing criteria. Another run of the existing evaluation on ds-november, with an `azure_ai_agent` target that names version 1, makes version 1 generate its own responses to the same queries. The two runs can then be compared before promoting version 2.
        fr: |
          Une comparaison valable exécute les deux versions sur le même jeu de données avec les mêmes critères de test. Une nouvelle exécution de l'évaluation existante sur ds-november, avec une cible `azure_ai_agent` qui nomme la version 1, fait générer à la version 1 ses propres réponses aux mêmes requêtes. Les deux exécutions peuvent ensuite être comparées avant de promouvoir la version 2.
      options:
        b: { en: "Without version, an agent target uses the latest version, which is now version 2: the run would score version 2 a second time.", fr: "Sans version, une cible d'agent utilise la dernière version, qui est désormais la version 2 : l'exécution noterait la version 2 une seconde fois." }
        c: { en: "The two runs score different test items, so a higher score may come from easier questions rather than from better instructions.", fr: "Les deux exécutions notent des éléments de test différents : un score plus élevé peut venir de questions plus faciles plutôt que de meilleures instructions." }
        d: { en: "A model target calls the deployment directly, without the instructions and tools of version 1, so it doesn't evaluate the agent.", fr: "Une cible de modèle appelle directement le déploiement, sans les instructions ni les outils de la version 1 : elle n'évalue donc pas l'agent." }
    references:
      - title: Evaluate models and agents with the Microsoft Foundry SDK - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/cloud-evaluation-targets
      - title: Introduction to cloud evaluation with Microsoft Foundry SDK - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/cloud-evaluation

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-21-08
    objective: "2.1.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware is building a pipeline that answers questions about supplier contracts. For every question, the pipeline must retrieve the relevant clauses, draft an answer, and then verify each citation of the draft against the clauses, always in this order. The application code must read the result of the verification and publish the answer only when every citation is verified.

        The pipeline goes into production in February 2027. The solution must minimize cost and keep the behavior predictable.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware crée un pipeline qui répond aux questions sur les contrats fournisseurs. Pour chaque question, le pipeline doit récupérer les clauses pertinentes, rédiger une réponse, puis vérifier chaque citation du brouillon par rapport aux clauses, toujours dans cet ordre. Le code de l'application doit lire le résultat de la vérification et ne publier la réponse que si toutes les citations sont vérifiées.

        Le pipeline passe en production en février 2027. La solution doit réduire les coûts au minimum et garder un comportement prévisible.

        Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Implement the three steps as a sequential workflow in Microsoft Agent Framework.", fr: "Implémenter les trois étapes sous forme de workflow séquentiel dans Microsoft Agent Framework." } }
        - { id: b, text: { en: "Give one agent the retrieval and verification tools, and let the agent decide the order of the steps.", fr: "Donner à un seul agent les outils de récupération et de vérification, et le laisser décider de l'ordre des étapes." } }
        - { id: c, text: { en: "Make the verification step return a structured output that follows a JSON schema.", fr: "Faire renvoyer à l'étape de vérification une sortie structurée qui suit un schéma JSON." } }
        - { id: d, text: { en: "Use a Magentic orchestration in which a manager agent plans the steps of each question.", fr: "Utiliser une orchestration Magentic dans laquelle un agent gestionnaire planifie les étapes de chaque question." } }
        - { id: e, text: { en: "Ask for JSON in the verification prompt, and parse `output_text` in the application code.", fr: "Demander du JSON dans l'invite de vérification, et analyser `output_text` dans le code de l'application." } }
        - { id: f, text: { en: "Build the pipeline in Foundry workflows by using the sequential template.", fr: "Créer le pipeline dans Foundry workflows avec le modèle sequential." } }
    answer: { optionIds: [a, c] }
    explanation:
      correct:
        en: |
          Steps whose order is known in advance belong in a deterministic chain: a sequential Agent Framework workflow runs retrieve, draft and verify in a fixed order, with no model call spent on planning. Code that must read the verification result needs output that matches a schema, which structured outputs enforce, unlike JSON requested in the prompt.
        fr: |
          Des étapes dont l'ordre est connu à l'avance relèvent d'une chaîne déterministe : un workflow séquentiel Agent Framework exécute récupération, rédaction et vérification dans un ordre fixe, sans appel de modèle consacré à la planification. Un code qui doit lire le résultat de la vérification a besoin d'une sortie conforme à un schéma, ce qu'imposent les sorties structurées, contrairement à un JSON demandé dans l'invite.
      options:
        b: { en: "Letting a model choose each step adds model calls and unpredictability, while the order here is fixed.", fr: "Laisser un modèle choisir chaque étape ajoute des appels de modèle et de l'imprévisibilité, alors que l'ordre est ici fixe." }
        d: { en: "Magentic suits open-ended tasks with no fixed plan; a manager agent that replans every question costs more and varies more.", fr: "Magentic convient aux tâches ouvertes sans plan fixe ; un agent gestionnaire qui replanifie chaque question coûte plus et varie davantage." }
        e: { en: "Asking for JSON in the prompt doesn't guarantee valid JSON or adherence to the schema, so the code can fail to read the result.", fr: "Demander du JSON dans l'invite ne garantit ni un JSON valide ni le respect du schéma : le code peut ne pas parvenir à lire le résultat." }
        f: { en: "Foundry workflows is in preview and retires on December 1, 2026, before the production date; Microsoft recommends Agent Framework for new work.", fr: "Foundry workflows est en préversion et sera retiré le 1er décembre 2026, avant la mise en production ; Microsoft recommande Agent Framework pour les nouveaux développements." }
    references:
      - title: Build a workflow in Microsoft Foundry (Preview) - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
      - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-21-09
    objective: "2.1.6"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam hosts a Python web app in Azure App Service. The app has a system-assigned managed identity. For each employee question, the app:

        - queries an index named **policies** on an Azure AI Search service named **srch-fab**, by using `SearchClient` with `DefaultAzureCredential`;
        - sends the question and the retrieved passages to a model deployment through `AIProjectClient` and `get_openai_client()`, for a Foundry project named **hr**.

        Role-based access control is enabled for the data plane of srch-fab. No key may be stored in the code or in the app settings, and the identity of the app must have the least privilege needed.

        Which two role assignments should you create for the managed identity? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam héberge une application web Python dans Azure App Service. L'application dispose d'une identité managée affectée par le système. Pour chaque question d'un employé, l'application :

        - interroge un index nommé **policies** sur un service Azure AI Search nommé **srch-fab**, en utilisant `SearchClient` avec `DefaultAzureCredential` ;
        - envoie la question et les passages récupérés à un déploiement de modèle via `AIProjectClient` et `get_openai_client()`, pour un projet Foundry nommé **hr**.

        Le contrôle d'accès en fonction du rôle est activé pour le plan de données de srch-fab. Aucune clé ne doit être stockée dans le code ni dans les paramètres de l'application, et l'identité de l'application doit avoir le moindre privilège nécessaire.

        Quelles sont les deux attributions de rôles que vous devez créer pour l'identité managée ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Foundry User on the hr project", fr: "Foundry User sur le projet hr" } }
        - { id: b, text: { en: "Search Index Data Contributor on srch-fab", fr: "Search Index Data Contributor sur srch-fab" } }
        - { id: c, text: { en: "Search Service Contributor on srch-fab", fr: "Search Service Contributor sur srch-fab" } }
        - { id: d, text: { en: "Search Index Data Reader on srch-fab", fr: "Search Index Data Reader sur srch-fab" } }
        - { id: e, text: { en: "Foundry Account Owner on the Foundry resource", fr: "Foundry Account Owner sur la ressource Foundry" } }
    answer: { optionIds: [a, d] }
    explanation:
      correct:
        en: |
          The app's own identity makes both calls. Querying an index is a data plane read, which Search Index Data Reader grants without write access. Calling a model deployment through the project needs the project data actions of Foundry User, assigned at the narrowest scope, the hr project.
        fr: |
          C'est l'identité de l'application qui effectue les deux appels. Interroger un index est une lecture du plan de données, qu'accorde Search Index Data Reader sans accès en écriture. Appeler un déploiement de modèle via le projet nécessite les actions de données du projet de Foundry User, attribué à l'étendue la plus restreinte, le projet hr.
      options:
        b: { en: "Search Index Data Contributor can also load and change documents, which the app never does: it breaks least privilege.", fr: "Search Index Data Contributor peut aussi charger et modifier des documents, ce que l'application ne fait jamais : il enfreint le moindre privilège." }
        c: { en: "Search Service Contributor manages the service and its objects but can't query index content through role-based access.", fr: "Search Service Contributor gère le service et ses objets, mais ne peut pas interroger le contenu d'un index par le contrôle d'accès en fonction du rôle." }
        e: { en: "Foundry Account Owner creates projects and manages models; it has no data actions, so it can't call the deployment.", fr: "Foundry Account Owner crée des projets et gère les modèles ; il n'a aucune action de données et ne peut donc pas appeler le déploiement." }
    references:
      - title: Connect Using Azure Roles - Azure AI Search
        url: https://learn.microsoft.com/en-us/azure/search/search-security-rbac
      - title: Role-based access control for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-21-10
    objective: "2.1.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Woodgrove Bank's RAG application uses the Azure AI Search Python SDK to query an index named **policies**. The index contains:

        - a searchable text field named `content`;
        - a vector field named `contentVector`, to which an Azure OpenAI vectorizer is assigned;
        - a semantic configuration named `policies-semantic`;
        - a filterable field named `group_ids` of type `Collection(Edm.String)`, which holds the object IDs of the Microsoft Entra groups allowed to read each document.

        The variable `groups` contains the group object IDs of the signed-in employee, separated by commas. Each query must combine keyword and vector retrieval of the employee's question, rerank the results semantically, and return only chunks of documents that the employee is allowed to read.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'application RAG de Woodgrove Bank utilise le SDK Python d'Azure AI Search pour interroger un index nommé **policies**. L'index contient :

        - un champ texte interrogeable nommé `content` ;
        - un champ vectoriel nommé `contentVector`, auquel un vectoriseur Azure OpenAI est attribué ;
        - une configuration sémantique nommée `policies-semantic` ;
        - un champ filtrable nommé `group_ids` de type `Collection(Edm.String)`, qui contient les ID d'objet des groupes Microsoft Entra autorisés à lire chaque document.

        La variable `groups` contient les ID d'objet des groupes de l'employé connecté, séparés par des virgules. Chaque requête doit combiner la récupération par mot clé et la récupération vectorielle sur la question de l'employé, reclasser sémantiquement les résultats et ne renvoyer que des blocs de documents que l'employé est autorisé à lire.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        results = search_client.search(
            search_text=question,
            vector_queries=[
                [[vq]](text=question, k_nearest_neighbors=50, fields="contentVector"),
            ],
            filter=[[flt]],
            query_type=[[qt]],
            semantic_configuration_name="policies-semantic",
            top=5,
        )
      slots:
        - id: vq
          options:
            - { id: vectorized, text: VectorizedQuery }
            - { id: vectorizable, text: VectorizableTextQuery }
            - { id: imageurl, text: VectorizableImageUrlQuery }
        - id: flt
          options:
            - { id: eq, text: "f\"group_ids eq '{groups}'\"" }
            - { id: ismatch, text: "f\"search.ismatch('{groups}', 'group_ids')\"" }
            - { id: anyin, text: "f\"group_ids/any(g: search.in(g, '{groups}'))\"" }
        - id: qt
          options:
            - { id: hybrid, text: "\"vector_semantic_hybrid\"" }
            - { id: semantic, text: "\"semantic\"" }
            - { id: full, text: "\"full\"" }
            - { id: simple, text: "\"simple\"" }
    answer:
      values: { vq: vectorizable, flt: anyin, qt: semantic }
    explanation:
      correct:
        en: |
          `VectorizableTextQuery` sends the question as text, and the vectorizer assigned to `contentVector` turns it into a vector; with `search_text` in the same request, the query is hybrid. The security filter pattern applies `search.in` inside an `any` lambda on the `Collection(Edm.String)` field, so only documents of the employee's groups are returned. `query_type="semantic"` with the semantic configuration reranks the merged results.
        fr: |
          `VectorizableTextQuery` envoie la question sous forme de texte, et le vectoriseur attribué à `contentVector` la transforme en vecteur ; avec `search_text` dans la même requête, la requête est hybride. Le modèle de filtre de sécurité applique `search.in` dans une expression lambda `any` sur le champ `Collection(Edm.String)`, pour que seuls les documents des groupes de l'employé soient renvoyés. `query_type="semantic"` avec la configuration sémantique reclasse les résultats fusionnés.
      options:
        vectorized: { en: "VectorizedQuery expects a vector computed by the application, not the text of the question.", fr: "VectorizedQuery attend un vecteur calculé par l'application, pas le texte de la question." }
        imageurl: { en: "VectorizableImageUrlQuery vectorizes an image from a URL, not a text question.", fr: "VectorizableImageUrlQuery vectorise une image à partir d'une URL, pas une question textuelle." }
        eq: { en: "A collection field can't be compared with eq; a filter on a collection needs an any or all lambda expression.", fr: "Un champ de collection ne peut pas être comparé avec eq ; un filtre sur une collection nécessite une expression lambda any ou all." }
        ismatch: { en: "search.ismatch runs a full-text search on searchable fields; group_ids is a filterable identity field that needs an exact match.", fr: "search.ismatch effectue une recherche en texte intégral sur des champs interrogeables ; group_ids est un champ d'identité filtrable qui exige une correspondance exacte." }
        hybrid: { en: "vector_semantic_hybrid is a query type of the Azure AI Search tool for agents; the SDK's query_type accepts simple, full or semantic.", fr: "vector_semantic_hybrid est un type de requête de l'outil Azure AI Search pour les agents ; le query_type du SDK accepte simple, full ou semantic." }
        full: { en: "full selects the Lucene query syntax for the keyword part; it doesn't apply semantic reranking.", fr: "full sélectionne la syntaxe de requête Lucene pour la partie mot clé ; il n'applique pas de reclassement sémantique." }
        simple: { en: "simple is the default keyword syntax; the results keep their hybrid ranking without semantic reranking.", fr: "simple est la syntaxe par mot clé par défaut ; les résultats gardent leur classement hybride, sans reclassement sémantique." }
    references:
      - title: Security Filter Pattern - Foundry IQ (Azure AI Search)
        url: https://learn.microsoft.com/en-us/azure/search/search-security-trimming-for-azure-search
      - title: azure.search.documents.SearchClient class
        url: https://learn.microsoft.com/en-us/python/api/azure-search-documents/azure.search.documents.searchclient
