chapter: 31-image-video-generation
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-31-01
    objective: "3.1.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Litware, Inc. offers a design app in which many customers create images through a single **gpt-image-2** deployment. For abuse investigations, the trust and safety team must be able to link each image request to the customer account that submitted it.

        Which request parameter should the app set in each image generation request?
      fr: |
        Litware, Inc. propose une application de conception dans laquelle de nombreux clients créent des images via un seul déploiement **gpt-image-2**. Pour les enquêtes sur les abus, l'équipe chargée de la confiance et de la sécurité doit pouvoir relier chaque requête d'image au compte client qui l'a envoyée.

        Quel paramètre de requête l'application doit-elle définir dans chaque requête de génération d'image ?
    body:
      options:
        - { id: a, text: "`model`" }
        - { id: b, text: "`n`" }
        - { id: c, text: "`input_fidelity`" }
        - { id: d, text: "`user`" }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The `user` parameter carries a unique identifier of the end user who makes the request, which lets you track usage per user. The app should set it to a stable identifier of the customer account in every request.
        fr: |
          Le paramètre `user` transporte un identifiant unique de l'utilisateur final qui fait la requête, ce qui permet de suivre l'usage par utilisateur. L'application doit le définir sur un identifiant stable du compte client dans chaque requête.
      options:
        a: { en: "`model` names the deployment that processes the request; it's the same for every customer.", fr: "`model` désigne le déploiement qui traite la requête ; il est le même pour tous les clients." }
        b: { en: "`n` sets how many images the request returns, from 1 to 10.", fr: "`n` fixe le nombre d'images renvoyées par la requête, de 1 à 10." }
        c: { en: "`input_fidelity` controls how closely an edit keeps the style and features of the input images.", fr: "`input_fidelity` contrôle à quel point une modification conserve le style et les traits des images d'entrée." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-31-02
    objective: "3.1.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A developer at Northwind Traders calls the image edits endpoint of a **gpt-image-2** deployment over REST to change the background of a 3 MB PNG product photo. The request body is JSON and contains the photo as a base64 string, the deployment name and a prompt. The service rejects the request.

        What should the developer change?
      fr: |
        Un développeur de Northwind Traders appelle en REST le point de terminaison de modification d'images (edits) d'un déploiement **gpt-image-2** pour changer l'arrière-plan d'une photo de produit PNG de 3 Mo. Le corps de la requête est en JSON et contient la photo sous forme de chaîne base64, le nom du déploiement et une invite. Le service rejette la requête.

        Que doit modifier le développeur ?
    body:
      options:
        - { id: a, text: { en: "Send the same JSON body to the image generations endpoint instead.", fr: "Envoyer le même corps JSON au point de terminaison de génération d'images à la place." } }
        - { id: b, text: { en: "Send the request as `multipart/form-data`, with the photo as a file part.", fr: "Envoyer la requête en `multipart/form-data`, avec la photo comme partie fichier." } }
        - { id: c, text: { en: "Add `response_format` set to `b64_json` to the JSON body of the request.", fr: "Ajouter `response_format` défini sur `b64_json` au corps JSON de la requête." } }
        - { id: d, text: { en: "Convert the photo to WebP before encoding it in the JSON body.", fr: "Convertir la photo en WebP avant de l'encoder dans le corps JSON." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The image edit API takes multipart form data, not JSON: the input images (PNG or JPG, each under 50 MB) are sent as file parts, together with fields such as the prompt and the model. A 3 MB PNG photo meets the input limits once it's sent in the right format.
        fr: |
          L'API de modification d'images accepte des données de formulaire multipart, pas du JSON : les images d'entrée (PNG ou JPG, de moins de 50 Mo chacune) sont envoyées comme parties fichier, avec des champs comme l'invite et le modèle. Une photo PNG de 3 Mo respecte les limites d'entrée dès qu'elle est envoyée dans le bon format.
      options:
        a: { en: "The generations operation takes a text prompt only; it can't use the product photo as input.", fr: "L'opération de génération ne prend qu'une invite texte ; elle ne peut pas utiliser la photo du produit en entrée." }
        c: { en: "`response_format` isn't supported for GPT-image models, which always return base64; it doesn't fix the request format.", fr: "`response_format` n'est pas pris en charge par les modèles GPT-image, qui renvoient toujours du base64 ; il ne corrige pas le format de la requête." }
        d: { en: "The edits operation accepts PNG or JPG input images, and the body would still be JSON.", fr: "L'opération edits accepte des images d'entrée PNG ou JPG, et le corps resterait en JSON." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-31-03
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation has a **gpt-image-2** deployment with the default quota. Each night, a script creates 300 catalog images by sending `images.generate` requests with `n=1` in a tight loop. After the first few images, most requests fail with HTTP status code 429. The images are needed by the next morning, and the prompts comply with the content policy.

        You need the script to create all the images. What should you do?
      fr: |
        Adatum Corporation dispose d'un déploiement **gpt-image-2** avec le quota par défaut. Chaque nuit, un script crée 300 images de catalogue en envoyant des requêtes `images.generate` avec `n=1` dans une boucle sans pause. Après les premières images, la plupart des requêtes échouent avec le code d'état HTTP 429. Les images sont nécessaires pour le lendemain matin, et les invites respectent la stratégie de contenu.

        Vous devez faire en sorte que le script crée toutes les images. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `n=10` in each request so that the script sends ten times fewer requests.", fr: "Définir `n=10` dans chaque requête pour que le script envoie dix fois moins de requêtes." } }
        - { id: b, text: { en: "Set `quality=\"low\"` in each request so that each image uses less of the quota.", fr: "Définir `quality=\"low\"` dans chaque requête pour que chaque image consomme moins de quota." } }
        - { id: c, text: { en: "Pace the requests within the per-minute image quota and retry each 429 with exponential backoff.", fr: "Espacer les requêtes dans la limite du quota d'images par minute et relancer chaque 429 avec une interruption exponentielle." } }
        - { id: d, text: { en: "Rewrite the prompts of the failed requests, because a 429 means the safety system blocked them.", fr: "Réécrire les invites des requêtes en échec, car un 429 signifie que le système de sécurité les a bloquées." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The default quota of a gpt-image-2 deployment is 5 images per minute, so a tight loop exceeds the rate limit and receives HTTP 429. Learn says to wait before retrying, implement retries with exponential backoff, or request a quota increase. At 5 images per minute, 300 images take about an hour, well within the night.
        fr: |
          Le quota par défaut d'un déploiement gpt-image-2 est de 5 images par minute : une boucle sans pause dépasse la limite de débit et reçoit des HTTP 429. Learn indique d'attendre avant de réessayer, d'implémenter des nouvelles tentatives avec une interruption exponentielle ou de demander une augmentation de quota. À 5 images par minute, 300 images prennent environ une heure, ce qui tient largement dans la nuit.
      options:
        a: { en: "The quota is expressed in images per minute, so ten images in one request still count as ten images.", fr: "Le quota s'exprime en images par minute : dix images dans une requête comptent toujours pour dix images." }
        b: { en: "Lower quality reduces latency and cost, but the quota still counts each image the same way.", fr: "Une qualité plus basse réduit la latence et le coût, mais le quota compte toujours chaque image de la même façon." }
        d: { en: "A blocked prompt fails with the content filter error code, not with HTTP 429, which signals a rate limit.", fr: "Une invite bloquée échoue avec le code d'erreur du filtre de contenu, pas avec HTTP 429, qui signale une limite de débit." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-31-04
    objective: "3.1.5"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso Media has a **gpt-image-2** deployment named **catalog-img**. Its catalog app calls catalog-img directly to create product thumbnails and lifestyle pictures, and the team wants to tune the size, quality and file weight of the outputs. You are reviewing the settings that the app can send in its `images.generate` requests.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso Media dispose d'un déploiement **gpt-image-2** nommé **catalog-img**. Son application de catalogue appelle directement catalog-img pour créer des miniatures de produits et des images d'ambiance, et l'équipe veut ajuster la taille, la qualité et le poids des fichiers produits. Vous examinez les paramètres que l'application peut envoyer dans ses requêtes `images.generate`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A request with `output_format=\"jpeg\"` and `output_compression=40` returns smaller files than the same request with the default compression.", fr: "Une requête avec `output_format=\"jpeg\"` et `output_compression=40` renvoie des fichiers plus légers que la même requête avec la compression par défaut." }
        - id: s2
          text: { en: "A request to catalog-img can set `quality=\"max\"` to get the highest image quality.", fr: "Une requête vers catalog-img peut définir `quality=\"max\"` pour obtenir la meilleure qualité d'image." }
        - id: s3
          text: { en: "A request with `size=\"auto\"` always returns an image whose edges are multiples of 16 pixels.", fr: "Une requête avec `size=\"auto\"` renvoie toujours une image dont les côtés sont des multiples de 16 pixels." }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          `output_compression` takes a value from 0 (lowest quality) to 100 (highest quality), with a default of 100, so 40 produces lighter JPEG files. gpt-image-2 offers the `low`, `medium` and `high` quality values; `xhigh` and `max` belong to the GPT-image-2.5 models. The multiple-of-16 constraint only applies when you specify a size: with `size="auto"`, the image may have other dimensions.
        fr: |
          `output_compression` prend une valeur de 0 (qualité la plus basse) à 100 (qualité la plus haute), 100 par défaut : 40 produit donc des fichiers JPEG plus légers. gpt-image-2 propose les qualités `low`, `medium` et `high` ; `xhigh` et `max` appartiennent aux modèles GPT-image-2.5. La contrainte des multiples de 16 ne s'applique que si vous indiquez une taille : avec `size="auto"`, l'image peut avoir d'autres dimensions.
      options:
        s2: { en: "`max` is a quality value of GPT-image-2.5-Sunburst and GPT-image-2.5-Flare, not of gpt-image-2.", fr: "`max` est une valeur de qualité de GPT-image-2.5-Sunburst et GPT-image-2.5-Flare, pas de gpt-image-2." }
        s3: { en: "Learn warns that with `size=\"auto\"` the generated image might not satisfy the size constraints, for example an edge that isn't a multiple of 16.", fr: "Learn avertit qu'avec `size=\"auto\"` l'image générée peut ne pas respecter les contraintes de taille, par exemple un côté qui n'est pas un multiple de 16." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-31-05
    objective: "3.1.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys' design assistant uses the Responses API. A chat model decides when to draw and calls the `image_generation` tool, which uses a **gpt-image-2.5-flare** deployment named in the `x-ms-oai-image-generation-deployment` header. The resource also has a **gpt-image-2** deployment named **preview-img**.

        Users now want to see each picture take shape while it's being generated. What should you do?
      fr: |
        L'assistant de conception de Tailspin Toys utilise l'API Responses. Un modèle de conversation décide quand dessiner et appelle l'outil `image_generation`, qui utilise un déploiement **gpt-image-2.5-flare** indiqué dans l'en-tête `x-ms-oai-image-generation-deployment`. La ressource dispose aussi d'un déploiement **gpt-image-2** nommé **preview-img**.

        Les utilisateurs veulent maintenant voir chaque image prendre forme pendant sa génération. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `stream` to true in the Responses requests that include the `image_generation` tool.", fr: "Définir `stream` sur true dans les requêtes Responses qui incluent l'outil `image_generation`." } }
        - { id: b, text: { en: "Name preview-img instead in the `x-ms-oai-image-generation-deployment` header of the requests.", fr: "Indiquer plutôt preview-img dans l'en-tête `x-ms-oai-image-generation-deployment` des requêtes." } }
        - { id: c, text: { en: "Call `images.generate` on preview-img directly with `n=3` and `quality=\"low\"`.", fr: "Appeler directement `images.generate` sur preview-img avec `n=3` et `quality=\"low\"`." } }
        - { id: d, text: { en: "Call `images.generate` on preview-img directly with `stream=True` and `partial_images=2`.", fr: "Appeler directement `images.generate` sur preview-img avec `stream=True` et `partial_images=2`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          The image generation tool of the Responses API doesn't currently support streaming. To stream partial images, Learn says to call the image generation API directly; gpt-image-2 supports `stream` with `partial_images`, which returns intermediate images before the final one.
        fr: |
          L'outil de génération d'images de l'API Responses ne prend pas en charge le streaming pour le moment. Pour diffuser des images partielles, Learn indique d'appeler directement l'API de génération d'images ; gpt-image-2 prend en charge `stream` avec `partial_images`, qui renvoie des images intermédiaires avant l'image finale.
      options:
        a: { en: "Streaming isn't supported for the image generation tool, so the image still arrives only when it's complete.", fr: "Le streaming n'est pas pris en charge par l'outil de génération d'images : l'image n'arrive toujours qu'une fois terminée." }
        b: { en: "Changing the deployment doesn't add streaming to the tool, and gpt-image-2 isn't among the models listed for the tool.", fr: "Changer de déploiement n'ajoute pas le streaming à l'outil, et gpt-image-2 ne figure pas parmi les modèles listés pour l'outil." }
        c: { en: "`n=3` returns three finished images, not progressive previews of one image.", fr: "`n=3` renvoie trois images finies, pas des aperçus progressifs d'une même image." }
    references:
      - title: Use the Azure OpenAI Responses API
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-31-06
    objective: "3.1.1"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Woodgrove Studio creates marketing images with Microsoft Foundry. Company policy allows only generally available models in production. The three workloads in the answer area each need their own deployment.

        Which model should you deploy for each workload? To answer, drag the appropriate models to the correct workloads. Each model may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Studio crée des images marketing avec Microsoft Foundry. La politique de l'entreprise n'autorise en production que des modèles généralement disponibles. Les trois charges de travail de la zone de réponse ont chacune besoin de leur propre déploiement.

        Quel modèle devez-vous déployer pour chaque charge de travail ? Pour répondre, faites glisser les modèles appropriés vers les charges de travail correspondantes. Chaque modèle peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: sunburst, text: "`gpt-image-2.5-sunburst`" }
        - { id: flare, text: "`gpt-image-2.5-flare`" }
        - { id: g2, text: "`gpt-image-2`" }
        - { id: g15, text: "`gpt-image-1.5`" }
        - { id: mini, text: "`gpt-image-1-mini`" }
      targets:
        - id: t1
          text: { en: "Edit existing product photos to replace the fine print of their labels, where precision matters more than speed", fr: "Modifier des photos de produit existantes pour remplacer les petits caractères de leurs étiquettes, quand la précision compte plus que la vitesse" }
        - id: t2
          text: { en: "Create thousands of high-quality everyday social media visuals each day, as fast and as cheaply as possible", fr: "Créer chaque jour des milliers de visuels courants de qualité pour les réseaux sociaux, aussi vite et à aussi faible coût que possible" }
        - id: t3
          text: { en: "Create 3840x2160 billboard images in production, without relying on an experimental resolution", fr: "Créer en production des images d'affiche de 3840x2160, sans dépendre d'une résolution expérimentale" }
    answer:
      mapping: { t1: sunburst, t2: flare, t3: g2 }
    explanation:
      correct:
        en: |
          GPT-image-2.5-Sunburst is the most capable model for image generation and editing, best when editing precision matters most. GPT-image-2.5-Flare is the fastest model for high-quality everyday generation and is optimized for speed and cost. Both 2.5 models treat resolutions above 2560x1440 as experimental, while gpt-image-2 supports arbitrary sizes up to a 3,840-pixel edge and 8,294,400 pixels, which 3840x2160 meets exactly.
        fr: |
          GPT-image-2.5-Sunburst est le modèle le plus performant pour la génération et la modification d'images, idéal quand la précision de modification compte le plus. GPT-image-2.5-Flare est le modèle le plus rapide pour la génération courante de qualité et il est optimisé pour la vitesse et le coût. Les deux modèles 2.5 considèrent les résolutions au-delà de 2560x1440 comme expérimentales, tandis que gpt-image-2 accepte des tailles arbitraires jusqu'à un côté de 3 840 pixels et 8 294 400 pixels, ce que 3840x2160 atteint exactement.
      options:
        g15: { en: "GPT-image-1.5 is in limited access preview, which the policy excludes, and offers only three fixed sizes.", fr: "GPT-image-1.5 est en préversion à accès limité, ce que la politique exclut, et ne propose que trois tailles fixes." }
        mini: { en: "GPT-image-1-mini is cost-efficient and fast, but it's in limited access preview, which the policy excludes.", fr: "GPT-image-1-mini est économique et rapide, mais il est en préversion à accès limité, ce que la politique exclut." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-31-07
    objective: "3.1.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Contoso Travel creates 8-second landscape clips by calling `videos.create` on a **sora-2** deployment with `size="1280x720"`. The first frame of each clip must be a poster still that a **gpt-image-2** deployment creates from a prompt, and the still is passed as `input_reference`.

        The stills are currently created with `size="auto"` and prompts such as "Smiling tourists in front of the old harbor at sunset". Many video creation requests are rejected, while the same requests without `input_reference` succeed.

        Which two changes should you make to the creation of the stills? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso Travel crée des clips paysage de 8 secondes en appelant `videos.create` sur un déploiement **sora-2** avec `size="1280x720"`. La première image de chaque clip doit être une image fixe d'affiche qu'un déploiement **gpt-image-2** crée à partir d'une invite, et cette image fixe est transmise comme `input_reference`.

        Les images fixes sont actuellement créées avec `size="auto"` et des invites comme « Smiling tourists in front of the old harbor at sunset ». De nombreuses requêtes de création de vidéo sont rejetées, alors que les mêmes requêtes sans `input_reference` réussissent.

        Quelles sont les deux modifications à apporter à la création des images fixes ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Set `size=\"1536x864\"`, which has the same 16:9 aspect ratio as the clips.", fr: "Définir `size=\"1536x864\"`, qui a le même rapport d'aspect 16:9 que les clips." } }
        - { id: b, text: { en: "Set `output_format=\"webp\"`, a format that `input_reference` accepts.", fr: "Définir `output_format=\"webp\"`, un format qu'`input_reference` accepte." } }
        - { id: c, text: { en: "Set `size=\"1280x720\"` in the image generation requests.", fr: "Définir `size=\"1280x720\"` dans les requêtes de génération d'images." } }
        - { id: d, text: { en: "Set `background=\"transparent\"` so that the video model fills in the scene.", fr: "Définir `background=\"transparent\"` pour que le modèle vidéo complète la scène." } }
        - { id: e, text: { en: "Describe scenes without any people in the prompts of the stills.", fr: "Décrire des scènes sans aucune personne dans les invites des images fixes." } }
    answer: { optionIds: [c, e] }
    explanation:
      correct:
        en: |
          The `input_reference` image must match the video `size` exactly, and with `size="auto"` gpt-image-2 may return other dimensions; 1280x720 meets the gpt-image-2 rules (multiples of 16, aspect ratio under 3:1, enough pixels). Sora 2 rejects input images that contain human faces, so the stills must show the harbor without people.
        fr: |
          L'image `input_reference` doit correspondre exactement à la `size` de la vidéo, et avec `size="auto"` gpt-image-2 peut renvoyer d'autres dimensions ; 1280x720 respecte les règles de gpt-image-2 (multiples de 16, rapport d'aspect inférieur à 3:1, nombre de pixels suffisant). Sora 2 refuse les images d'entrée qui contiennent des visages humains : les images fixes doivent donc montrer le port sans personne.
      options:
        a: { en: "The same aspect ratio isn't enough: the reference image must have exactly the resolution of the video.", fr: "Le même rapport d'aspect ne suffit pas : l'image de référence doit avoir exactement la résolution de la vidéo." }
        b: { en: "The image API outputs PNG or JPEG only; WebP output isn't supported.", fr: "L'API d'images ne produit que du PNG ou du JPEG ; la sortie WebP n'est pas prise en charge." }
        d: { en: "A transparent background doesn't fix the size or the faces, and the still is meant to be the complete first frame.", fr: "Un arrière-plan transparent ne corrige ni la taille ni les visages, et l'image fixe doit être la première image complète." }
    references:
      - title: Sora 2 video generation overview (preview)
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-31-08
    objective: "3.1.3"
    difficulty: 3
    status: draft
    type: ordering
    stem:
      en: |
        Fabrikam Beverages has a 1536x1024 product photo named **bottle.png** and a **gpt-image-2.5-sunburst** deployment. Each edit request sets `size="1536x1024"`.

        The brand team requests two changes: first, a new text on the label; then, a blue cap instead of the red one. Nothing else in the photo may change, and the brand team must approve each change before the next one is applied.

        Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
      fr: |
        Fabrikam Beverages dispose d'une photo de produit de 1536x1024 nommée **bottle.png** et d'un déploiement **gpt-image-2.5-sunburst**. Chaque requête de modification définit `size="1536x1024"`.

        L'équipe de la marque demande deux modifications : d'abord un nouveau texte sur l'étiquette, puis un bouchon bleu au lieu du rouge. Rien d'autre ne doit changer sur la photo, et l'équipe de la marque doit approuver chaque modification avant que la suivante soit appliquée.

        Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
    body:
      count: 5
      actions:
        - { id: masks, text: { en: "Create two 1536x1024 PNG masks: one fully transparent over the label only, the other fully transparent over the cap only.", fr: "Créer deux masques PNG de 1536x1024 : l'un entièrement transparent sur l'étiquette seulement, l'autre entièrement transparent sur le bouchon seulement." } }
        - { id: opaque, text: { en: "Create two 1536x1024 PNG masks that are opaque over the label and over the cap and transparent everywhere else.", fr: "Créer deux masques PNG de 1536x1024 opaques sur l'étiquette et sur le bouchon, et transparents partout ailleurs." } }
        - { id: e1, text: { en: "Call `images.edit` with bottle.png, the label mask and a prompt that describes the new label text.", fr: "Appeler `images.edit` avec bottle.png, le masque de l'étiquette et une invite qui décrit le nouveau texte de l'étiquette." } }
        - { id: both, text: { en: "Call `images.edit` with bottle.png, one mask over the label and the cap, and a prompt for both changes.", fr: "Appeler `images.edit` avec bottle.png, un seul masque sur l'étiquette et le bouchon, et une invite pour les deux modifications." } }
        - { id: r1, text: { en: "Have the brand team review the new label and approve the edited image.", fr: "Faire vérifier la nouvelle étiquette par l'équipe de la marque et lui faire approuver l'image modifiée." } }
        - { id: orig2, text: { en: "Call `images.edit` with bottle.png, the cap mask and a prompt that describes the blue cap.", fr: "Appeler `images.edit` avec bottle.png, le masque du bouchon et une invite qui décrit le bouchon bleu." } }
        - { id: e2, text: { en: "Call `images.edit` with the approved image, the cap mask and a prompt that describes the blue cap.", fr: "Appeler `images.edit` avec l'image approuvée, le masque du bouchon et une invite qui décrit le bouchon bleu." } }
        - { id: gen, text: { en: "Call `images.generate` with a prompt that describes the bottle with the new label and the blue cap.", fr: "Appeler `images.generate` avec une invite qui décrit la bouteille avec la nouvelle étiquette et le bouchon bleu." } }
        - { id: r2, text: { en: "Have the brand team review the cap and approve the final image.", fr: "Faire vérifier le bouchon par l'équipe de la marque et lui faire approuver l'image finale." } }
    answer:
      sequence: [masks, e1, r1, e2, r2]
    explanation:
      correct:
        en: |
          Mask-based edits (inpainting) change only the fully transparent pixels of a PNG mask that has the same dimensions as the input image, so each change needs its own mask. The first edit works on bottle.png; the second edit must start from the approved image, otherwise the new label is lost. A review between the two edits meets the approval requirement and stops drift from one iteration to the next.
        fr: |
          Les modifications avec masque (inpainting) ne changent que les pixels entièrement transparents d'un masque PNG de mêmes dimensions que l'image d'entrée : chaque modification a donc besoin de son propre masque. La première modification porte sur bottle.png ; la seconde doit partir de l'image approuvée, sinon la nouvelle étiquette est perdue. Une revue entre les deux modifications répond à l'exigence d'approbation et évite la dérive d'une itération à l'autre.
      options:
        opaque: { en: "Opaque pixels are kept: these masks would protect the label and the cap and let the model change everything else.", fr: "Les pixels opaques sont conservés : ces masques protégeraient l'étiquette et le bouchon et laisseraient le modèle changer tout le reste." }
        both: { en: "A single edit for both changes leaves no point at which the brand team can approve the label before the cap changes.", fr: "Une seule modification pour les deux changements ne laisse aucun moment où l'équipe de la marque peut approuver l'étiquette avant le changement du bouchon." }
        orig2: { en: "Editing bottle.png again would produce a blue cap with the old label: the approved label change would be lost.", fr: "Modifier à nouveau bottle.png produirait un bouchon bleu avec l'ancienne étiquette : la modification d'étiquette approuvée serait perdue." }
        gen: { en: "A new generation rebuilds the whole picture, so the bottle, the lighting and the background can all change.", fr: "Une nouvelle génération reconstruit toute l'image : la bouteille, l'éclairage et l'arrière-plan peuvent tous changer." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-31-09
    objective: "3.1.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Wines created an 8-second drone clip of its vineyard with a **sora-2** deployment 40 minutes ago. The job status is `completed`, and its ID is stored in the variable `original_id`. The marketing team approves the composition and the camera movement but wants the tractor in the clip to be green.

        The code must keep the original clip unchanged, save the new version as an MP4 file, and log the cause when the job fails.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Wines a créé il y a 40 minutes un clip de drone de 8 secondes de son vignoble avec un déploiement **sora-2**. L'état du travail est `completed`, et son ID est stocké dans la variable `original_id`. L'équipe marketing approuve la composition et le mouvement de caméra, mais veut que le tracteur du clip soit vert.

        Le code doit laisser le clip d'origine inchangé, enregistrer la nouvelle version dans un fichier MP4 et journaliser la cause quand le travail échoue.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        import time

        remix = client.videos.remix(
            video_id=[[src]],
            prompt="Change the color of the tractor to green",
        )
        while remix.status not in ["completed", "failed", "cancelled"]:
            time.sleep(20)
            remix = client.videos.retrieve([[poll]])

        if remix.status == "completed":
            content = client.videos.download_content([[dl]], variant="video")
            content.write_to_file("vineyard-green.mp4")
        else:
            log_error(remix.[[why]])
      slots:
        - id: src
          options:
            - { id: src_id, text: original_id }
            - { id: src_file, text: "open(\"vineyard.mp4\", \"rb\")" }
            - { id: src_name, text: "\"vineyard.mp4\"" }
        - id: poll
          options:
            - { id: poll_orig, text: original_id }
            - { id: poll_remix, text: remix.id }
            - { id: poll_status, text: remix.status }
        - id: dl
          options:
            - { id: dl_orig, text: original_id }
            - { id: dl_remix, text: remix.id }
            - { id: dl_name, text: "\"vineyard-green.mp4\"" }
        - id: why
          options:
            - { id: why_incomplete, text: incomplete_details }
            - { id: why_finish, text: finish_reason }
            - { id: why_failure, text: failure_reason }
    answer:
      values: { src: src_id, poll: poll_remix, dl: dl_remix, why: why_failure }
    explanation:
      correct:
        en: |
          A remix references the ID of a successfully completed video that is still available (jobs are kept 24 hours) and keeps its structure while applying one clear change. The remix is a new asynchronous job with its own ID: you poll that ID until a final status, then download its content, which leaves the original clip unchanged. A failed video job explains itself in `failure_reason`.
        fr: |
          Un remix référence l'ID d'une vidéo terminée avec succès et encore disponible (les travaux sont conservés 24 heures), et conserve sa structure en appliquant un seul changement clair. Le remix est un nouveau travail asynchrone avec son propre ID : vous interrogez cet ID jusqu'à un état final, puis téléchargez son contenu, ce qui laisse le clip d'origine inchangé. Un travail vidéo en échec s'explique dans `failure_reason`.
      options:
        src_file: { en: "Remix takes the ID of a completed generation, not an uploaded video file.", fr: "Le remix prend l'ID d'une génération terminée, pas un fichier vidéo chargé." }
        src_name: { en: "A file name isn't a video ID; the service can only remix a video that it generated.", fr: "Un nom de fichier n'est pas un ID de vidéo ; le service ne peut remixer qu'une vidéo qu'il a générée." }
        poll_orig: { en: "The original job is already completed, so the loop would read its status, not the status of the remix.", fr: "Le travail d'origine est déjà terminé : la boucle lirait son état, pas celui du remix." }
        poll_status: { en: "`videos.retrieve` takes a video ID, not a status value.", fr: "`videos.retrieve` prend un ID de vidéo, pas une valeur d'état." }
        dl_orig: { en: "Downloading the original ID saves the clip with the original tractor, not the remixed version.", fr: "Télécharger l'ID d'origine enregistre le clip avec le tracteur d'origine, pas la version remixée." }
        dl_name: { en: "`download_content` takes the video ID; the file name is used by `write_to_file`.", fr: "`download_content` prend l'ID de la vidéo ; le nom de fichier sert à `write_to_file`." }
        why_incomplete: { en: "`incomplete_details` belongs to Responses API responses cut off by a token limit, not to video jobs.", fr: "`incomplete_details` appartient aux réponses de l'API Responses interrompues par une limite de jetons, pas aux travaux vidéo." }
        why_finish: { en: "`finish_reason` belongs to chat completion choices, not to video jobs.", fr: "`finish_reason` appartient aux choix des complétions de conversation, pas aux travaux vidéo." }
    references:
      - title: Sora 2 video generation overview (preview)
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-31-10
    objective: "3.1.5"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Woodgrove Studio sends image generation requests to a **gpt-image-2.5-flare** deployment. Before a release, you review the five request configurations shown in the following table.

        Answer each prompt by selecting the request in the table.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Studio envoie des requêtes de génération d'images à un déploiement **gpt-image-2.5-flare**. Avant une mise en production, vous examinez les cinq configurations de requête présentées dans le tableau suivant.

        Répondez à chaque consigne en sélectionnant la requête dans le tableau.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The request that meets the size rules of the model but uses a resolution that Learn describes as experimental", fr: "La requête qui respecte les règles de taille du modèle mais utilise une résolution que Learn décrit comme expérimentale" }
        - id: p2
          text: { en: "The only request that meets every size rule of the model with a resolution that isn't experimental", fr: "La seule requête qui respecte toutes les règles de taille du modèle avec une résolution qui n'est pas expérimentale" }
      grid:
        header: [{ en: "Request", fr: "Requête" }, "size", "quality"]
        rows:
          - [{ text: R1, area: r1 }, { text: "`3840x1152`" }, { text: "`high`" }]
          - [{ text: R2, area: r2 }, { text: "`2048x1152`" }, { text: "`max`" }]
          - [{ text: R3, area: r3 }, { text: "`3072x1728`" }, { text: "`medium`" }]
          - [{ text: R4, area: r4 }, { text: "`1000x1000`" }, { text: "`low`" }]
          - [{ text: R5, area: r5 }, { text: "`768x768`" }, { text: "`low`" }]
    answer:
      values: { p1: r3, p2: r2 }
    explanation:
      correct:
        en: |
          For the GPT-image-2.5 models, both edges must be multiples of 16, the aspect ratio must be between 1:3 and 3:1, no edge may exceed 3,840 pixels and the total must be between 655,360 and 8,294,400 pixels; resolutions above 2560x1440 are experimental. 3072x1728 meets every rule but is above 2560x1440. 2048x1152 meets every rule below that limit, and `max` is a valid quality value for these models.
        fr: |
          Pour les modèles GPT-image-2.5, les deux côtés doivent être des multiples de 16, le rapport d'aspect doit être compris entre 1:3 et 3:1, aucun côté ne peut dépasser 3 840 pixels et le total doit être compris entre 655 360 et 8 294 400 pixels ; les résolutions au-delà de 2560x1440 sont expérimentales. 3072x1728 respecte toutes les règles mais dépasse 2560x1440. 2048x1152 respecte toutes les règles en deçà de cette limite, et `max` est une valeur de qualité valide pour ces modèles.
      options:
        r1: { en: "3840x1152 has an aspect ratio of about 3.3:1, beyond the 3:1 limit.", fr: "3840x1152 a un rapport d'aspect d'environ 3,3:1, au-delà de la limite de 3:1." }
        r4: { en: "1000 isn't a multiple of 16.", fr: "1000 n'est pas un multiple de 16." }
        r5: { en: "768x768 is 589,824 pixels, below the 655,360-pixel minimum, although 768 is a multiple of 16.", fr: "768x768 représente 589 824 pixels, sous le minimum de 655 360 pixels, bien que 768 soit un multiple de 16." }
    references:
      - title: How to Use Image Generation Models from OpenAI
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
