chapter: 22-agents
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-22-01
    objective: "2.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys has a customer service agent written in Python with LangGraph. The graph contains custom routing logic between several nodes. The team wants Foundry Agent Service to host and run this code, with an endpoint and an identity that Foundry manages, without rewriting the logic as instructions.

        What should you create?
      fr: |
        Tailspin Toys dispose d'un agent de service client écrit en Python avec LangGraph. Le graphe contient une logique de routage personnalisée entre plusieurs nœuds. L'équipe veut que Foundry Agent Service héberge et exécute ce code, avec un point de terminaison et une identité gérés par Foundry, sans réécrire la logique sous forme d'instructions.

        Que devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "A prompt agent defined with PromptAgentDefinition, whose instructions describe the routing", fr: "Un agent d'invite défini avec PromptAgentDefinition, dont les instructions décrivent le routage" } }
        - { id: b, text: { en: "A hosted agent that packages the existing code as a container image", fr: "Un agent hébergé qui empaquette le code existant sous forme d'image conteneur" } }
        - { id: c, text: { en: "A workflow in the Foundry workflows designer that reproduces each node of the graph", fr: "Un workflow dans le concepteur Foundry workflows qui reproduit chaque nœud du graphe" } }
        - { id: d, text: { en: "A prompt agent with a function tool that runs the graph in the client application", fr: "Un agent d'invite doté d'un outil de fonction qui exécute le graphe dans l'application cliente" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A hosted agent is your own code, written with the framework of your choice such as Agent Framework or LangGraph, packaged as a container image. Agent Service runs it on Microsoft-managed infrastructure, assigns it a dedicated Microsoft Entra identity and exposes an endpoint, so the routing logic stays in code.
        fr: |
          Un agent hébergé est votre propre code, écrit avec le framework de votre choix comme Agent Framework ou LangGraph, et empaqueté sous forme d'image conteneur. Agent Service l'exécute sur une infrastructure gérée par Microsoft, lui attribue une identité Microsoft Entra dédiée et expose un point de terminaison : la logique de routage reste dans le code.
      options:
        a: { en: "A prompt agent is only a model, instructions and tools; it would mean rewriting the routing as instructions, which the team refuses.", fr: "Un agent d'invite n'est qu'un modèle, des instructions et des outils ; il faudrait réécrire le routage sous forme d'instructions, ce que l'équipe refuse." }
        c: { en: "The Foundry workflows designer is in preview, retires on December 1, 2026, and would also mean rebuilding the logic instead of running the code.", fr: "Le concepteur Foundry workflows est en préversion, sera retiré le 1er décembre 2026 et obligerait aussi à reconstruire la logique au lieu d'exécuter le code." }
        d: { en: "A function tool runs in the client application, so Foundry wouldn't host the code; the team wants Agent Service to run it.", fr: "Un outil de fonction s'exécute dans l'application cliente : Foundry n'hébergerait donc pas le code, alors que l'équipe veut qu'Agent Service l'exécute." }
    references:
      - title: Hosted agents in Foundry Agent Service - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/hosted-agents

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-22-02
    objective: "2.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's Foundry project uses the standard agent setup. A function app contains a queue-triggered function named `quote_shipping`: it reads each request from an Azure Storage queue and writes a shipping quote to an output queue. The function has no HTTP trigger, and no OpenAPI specification exists.

        A prompt agent must get shipping quotes from this function. The client application must not run any code for this tool.

        Which tool should you add to the agent?
      fr: |
        Le projet Foundry de Contoso utilise la configuration d'agent standard. Une application de fonction contient une fonction déclenchée par une file d'attente nommée `quote_shipping` : elle lit chaque demande dans une file d'attente Stockage Azure et écrit un devis d'expédition dans une file d'attente de sortie. La fonction n'a pas de déclencheur HTTP, et aucune spécification OpenAPI n'existe.

        Un agent d'invite doit obtenir des devis d'expédition auprès de cette fonction. L'application cliente ne doit exécuter aucun code pour cet outil.

        Quel outil devez-vous ajouter à l'agent ?
    body:
      options:
        - { id: a, text: { en: "A function tool that the client application runs by writing the request to the queue", fr: "Un outil de fonction que l'application cliente exécute en écrivant la demande dans la file d'attente" } }
        - { id: b, text: { en: "An OpenAPI tool that calls the default endpoint of the function app", fr: "Un outil OpenAPI qui appelle le point de terminaison par défaut de l'application de fonction" } }
        - { id: c, text: { en: "An Azure Functions tool that uses the input and output queues of the function", fr: "Un outil Azure Functions qui utilise les files d'attente d'entrée et de sortie de la fonction" } }
        - { id: d, text: { en: "An MCP tool whose server URL is the default endpoint of the function app", fr: "Un outil MCP dont l'URL de serveur est le point de terminaison par défaut de l'application de fonction" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The Azure Functions tool connects the agent to the input queue that the function monitors: the agent places a message on the queue, the queue trigger runs the function, the function writes the result to the output queue, and the agent reads it. Azure Functions executes the code, so the client runs nothing. The tool requires the standard agent setup, which the project uses.
        fr: |
          L'outil Azure Functions relie l'agent à la file d'attente d'entrée que surveille la fonction : l'agent dépose un message dans la file, le déclencheur de file d'attente exécute la fonction, la fonction écrit le résultat dans la file de sortie, et l'agent le lit. C'est Azure Functions qui exécute le code : le client n'exécute rien. L'outil exige la configuration d'agent standard, que le projet utilise.
      options:
        a: { en: "With function calling, the client application runs the function itself, which the requirement forbids.", fr: "Avec l'appel de fonction, c'est l'application cliente qui exécute la fonction, ce que l'exigence interdit." }
        b: { en: "An OpenAPI tool needs an HTTP API described by an OpenAPI 3.0 or 3.1 specification; this function has no HTTP trigger and no specification.", fr: "Un outil OpenAPI nécessite une API HTTP décrite par une spécification OpenAPI 3.0 ou 3.1 ; cette fonction n'a ni déclencheur HTTP ni spécification." }
        d: { en: "An MCP tool needs a server that speaks the Model Context Protocol; a queue-triggered function doesn't expose one.", fr: "Un outil MCP nécessite un serveur qui parle le protocole Model Context Protocol ; une fonction déclenchée par une file d'attente n'en expose pas." }
    references:
      - title: Integrate Azure Functions with Foundry Agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/azure-functions

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-22-03
    objective: "2.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank has a prompt agent named **statement-agent** with a function tool named `generate_statement`. The backend runs the function, which submits a mainframe batch job that takes 20 to 40 minutes. Today the backend waits for the job to finish before it returns the `function_call_output`, and these requests fail.

        Customers must be told that their statement is being prepared, and must be able to ask later in the conversation whether it's ready.

        What should you do?
      fr: |
        Woodgrove Bank dispose d'un agent d'invite nommé **statement-agent** doté d'un outil de fonction nommé `generate_statement`. Le backend exécute la fonction, qui soumet un travail par lots sur le mainframe d'une durée de 20 à 40 minutes. Aujourd'hui, le backend attend la fin du travail avant de renvoyer le `function_call_output`, et ces requêtes échouent.

        Les clients doivent être informés que leur relevé est en préparation, et pouvoir demander plus tard dans la conversation s'il est prêt.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Make generate_statement start the job and return its ID at once, and add a function that returns the status of a job.", fr: "Faire démarrer le travail par generate_statement et renvoyer aussitôt son ID, et ajouter une fonction qui renvoie le statut d'un travail." } }
        - { id: b, text: { en: "Keep generate_statement synchronous, and return the function_call_output with the same call_id after the job finishes.", fr: "Garder generate_statement synchrone, et renvoyer le function_call_output avec le même call_id une fois le travail terminé." } }
        - { id: c, text: { en: "Expose the mainframe job through an MCP server, so that the service waits for the job instead of the backend.", fr: "Exposer le travail du mainframe par un serveur MCP, pour que le service attende le travail à la place du backend." } }
        - { id: d, text: { en: "Return an empty function_call_output at once, then send a second output with the same call_id after the job finishes.", fr: "Renvoyer aussitôt un function_call_output vide, puis envoyer une seconde sortie avec le même call_id une fois le travail terminé." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Runs expire 10 minutes after creation, and the limit applies to the total elapsed time. For long-running operations, Learn's guidance is to return a status immediately and poll separately: the agent tells the customer the job has started, and a status function answers later questions.
        fr: |
          Les exécutions expirent 10 minutes après leur création, et la limite s'applique au temps total écoulé. Pour les opérations longues, Learn recommande de renvoyer un statut immédiatement et d'interroger séparément : l'agent indique au client que le travail a démarré, et une fonction de statut répond aux questions suivantes.
      options:
        b: { en: "A 20 to 40 minute wait exceeds the 10-minute run expiration, so the output arrives after the run has expired.", fr: "Une attente de 20 à 40 minutes dépasse l'expiration de l'exécution à 10 minutes : la sortie arrive après l'expiration de l'exécution." }
        c: { en: "Non-streaming MCP tool calls time out after 100 seconds, far shorter than the job.", fr: "Les appels d'outils MCP non diffusés en continu expirent au bout de 100 secondes, bien moins que la durée du travail." }
        d: { en: "The model answers from the empty output, and the run expires after 10 minutes, so a later output can't complete that call.", fr: "Le modèle répond à partir de la sortie vide, et l'exécution expire au bout de 10 minutes : une sortie ultérieure ne peut pas compléter cet appel." }
    references:
      - title: Use function calling with Microsoft Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling
      - title: Connect agents to MCP server endpoints - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-22-04
    objective: "2.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Adatum is designing an internal IT help agent that one team will build and maintain. The agent answers from one Azure AI Search index of IT procedures and creates tickets through one OpenAPI tool. All users and data are within the same security and compliance boundary, and no other scope is planned.

        An architect proposes four agents: a triage agent, a search agent, a ticket agent and a supervisor agent. You need to recommend a design that follows Microsoft guidance and minimizes latency and cost.

        What should you recommend?
      fr: |
        Adatum conçoit un agent d'assistance informatique interne qu'une seule équipe va créer et maintenir. L'agent répond à partir d'un index Azure AI Search de procédures informatiques et crée des tickets par un outil OpenAPI. Tous les utilisateurs et toutes les données se trouvent dans la même limite de sécurité et de conformité, et aucune autre extension n'est prévue.

        Un architecte propose quatre agents : un agent de tri, un agent de recherche, un agent de tickets et un agent superviseur. Vous devez recommander une conception qui suit les recommandations de Microsoft et réduit au minimum la latence et le coût.

        Que devez-vous recommander ?
    body:
      options:
        - { id: a, text: { en: "One prompt agent that has both the Azure AI Search tool and the OpenAPI tool", fr: "Un seul agent d'invite doté à la fois de l'outil Azure AI Search et de l'outil OpenAPI" } }
        - { id: b, text: { en: "A handoff workflow in which the triage agent transfers control to the other agents", fr: "Un workflow handoff dans lequel l'agent de tri transfère le contrôle aux autres agents" } }
        - { id: c, text: { en: "A Magentic workflow in which the supervisor agent plans the calls to the other agents", fr: "Un workflow Magentic dans lequel l'agent superviseur planifie les appels aux autres agents" } }
        - { id: d, text: { en: "A triage prompt agent that calls the search and ticket agents through A2A tools", fr: "Un agent d'invite de tri qui appelle les agents de recherche et de tickets par des outils A2A" } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          Microsoft starts with a multi-agent design only when the use case crosses security and compliance boundaries, involves several teams or is expected to grow; otherwise, test a single agent first. Here one agent needs only two tools and one set of instructions, so a single agent is simpler and avoids the extra model calls of several agents.
        fr: |
          Microsoft ne part d'une conception multi-agent que si le cas d'usage traverse des limites de sécurité et de conformité, implique plusieurs équipes ou doit s'étendre ; sinon, il faut d'abord tester un seul agent. Ici, un agent n'a besoin que de deux outils et d'un seul jeu d'instructions : un agent unique est plus simple et évite les appels de modèle supplémentaires de plusieurs agents.
      options:
        b: { en: "A handoff adds agents and transfers of control that no requirement needs: none of the multi-agent signals applies.", fr: "Un handoff ajoute des agents et des transferts de contrôle qu'aucune exigence ne justifie : aucun des signaux multi-agents ne s'applique." }
        c: { en: "Magentic suits open-ended tasks with no fixed plan; a planning manager adds model calls, latency and cost to a simple two-tool task.", fr: "Magentic convient aux tâches ouvertes sans plan fixe ; un gestionnaire qui planifie ajoute des appels de modèle, de la latence et du coût à une tâche simple à deux outils." }
        d: { en: "A2A delegation adds a remote agent call for every search or ticket, when the same agent could call the two tools directly.", fr: "La délégation A2A ajoute un appel d'agent distant pour chaque recherche ou ticket, alors que le même agent pourrait appeler directement les deux outils." }
    references:
      - title: Operational standards for AI agents - Cloud Adoption Framework
        url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai-agents/operational-standards

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-22-05
    objective: "2.2.5"
    difficulty: 2
    status: draft
    type: multi
    stem:
      en: |
        Fabrikam adds the remote MCP server of its ticketing vendor to a prompt agent named **desk-agent**. desk-agent uses the five tools listed below.

        Company policy states that the agent can run lookups on its own, but that a human must approve any action that changes a record or sends a message outside the company. You will list those tools in the `always` list of `require_approval`.

        Which two tools should you list? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam ajoute le serveur MCP distant de son éditeur de gestion de tickets à un agent d'invite nommé **desk-agent**. desk-agent utilise les cinq outils listés ci-dessous.

        La politique de l'entreprise indique que l'agent peut effectuer seul des recherches, mais qu'un humain doit approuver toute action qui modifie un enregistrement ou envoie un message à l'extérieur de l'entreprise. Vous allez lister ces outils dans la liste `always` de `require_approval`.

        Quels sont les deux outils que vous devez lister ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "search_tickets: finds the tickets that match keywords", fr: "search_tickets : trouve les tickets qui correspondent à des mots clés" } }
        - { id: b, text: { en: "close_ticket: sets the status of a ticket to Closed", fr: "close_ticket : définit le statut d'un ticket sur Closed" } }
        - { id: c, text: { en: "get_ticket: returns the history and fields of a ticket", fr: "get_ticket : renvoie l'historique et les champs d'un ticket" } }
        - { id: d, text: { en: "list_queues: returns the support queues and their owners", fr: "list_queues : renvoie les files de support et leurs responsables" } }
        - { id: e, text: { en: "email_requester: emails the customer who opened a ticket", fr: "email_requester : envoie un e-mail au client qui a ouvert un ticket" } }
    answer: { optionIds: [b, e] }
    explanation:
      correct:
        en: |
          A semiautonomous agent runs read-only, low-risk tools on its own and waits for a human decision before changes to records and external messages. With `require_approval={"always": ["close_ticket", "email_requester"]}`, the service returns an `mcp_approval_request` for those two tools, and they run only after the application sends back an `mcp_approval_response` that approves the call.
        fr: |
          Un agent semi-autonome exécute seul les outils en lecture seule et à faible risque, et attend une décision humaine avant toute modification d'enregistrement et tout message externe. Avec `require_approval={"always": ["close_ticket", "email_requester"]}`, le service renvoie un `mcp_approval_request` pour ces deux outils, qui ne s'exécutent qu'après le renvoi par l'application d'un `mcp_approval_response` qui approuve l'appel.
      options:
        a: { en: "search_tickets only reads data: it's a lookup that the policy lets the agent run on its own.", fr: "search_tickets ne fait que lire des données : c'est une recherche que la politique laisse l'agent exécuter seul." }
        c: { en: "get_ticket reads a ticket without changing it, so it needs no approval under the policy.", fr: "get_ticket lit un ticket sans le modifier : il ne nécessite donc aucune approbation selon la politique." }
        d: { en: "list_queues is a read-only lookup of internal data; it neither changes a record nor sends a message.", fr: "list_queues est une recherche en lecture seule de données internes ; elle ne modifie aucun enregistrement et n'envoie aucun message." }
    references:
      - title: Connect agents to MCP server endpoints - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-22-06
    objective: "2.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Litware is adding a partner's expense API to a prompt agent by using the OpenAPI tool. The partner's specification has the following characteristics:

        - It's written in OpenAPI 3.1, and every operation has a unique `operationId` made of letters and `_`.
        - The `list_expenses` and `get_expense` operations use an API key sent in a header named `x-read-key`. The `submit_receipt` operation uses another API key, sent in a header named `x-write-key`.
        - The request body of `submit_receipt` is `multipart/form-data` (a receipt image and form fields).

        The keys must not appear in the specification or in the code.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware ajoute l'API de notes de frais d'un partenaire à un agent d'invite à l'aide de l'outil OpenAPI. La spécification du partenaire présente les caractéristiques suivantes :

        - Elle est écrite en OpenAPI 3.1, et chaque opération a un `operationId` unique composé de lettres et de `_`.
        - Les opérations `list_expenses` et `get_expense` utilisent une clé API envoyée dans un en-tête nommé `x-read-key`. L'opération `submit_receipt` utilise une autre clé API, envoyée dans un en-tête nommé `x-write-key`.
        - Le corps de requête de `submit_receipt` est en `multipart/form-data` (une image de reçu et des champs de formulaire).

        Les clés ne doivent apparaître ni dans la spécification ni dans le code.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "The OpenAPI tool can use the specification without converting it to OpenAPI 3.0.", fr: "L'outil OpenAPI peut utiliser la spécification sans la convertir en OpenAPI 3.0." }
        - id: s2
          text: { en: "To use both keys, you can create two OpenAPI tools, each with a project connection that stores one of the keys.", fr: "Pour utiliser les deux clés, vous pouvez créer deux outils OpenAPI, chacun avec une connexion de projet qui stocke l'une des clés." }
        - id: s3
          text: { en: "The agent can call `submit_receipt` through the OpenAPI tool with its current request body.", fr: "L'agent peut appeler `submit_receipt` par l'outil OpenAPI avec son corps de requête actuel." }
    answer:
      values: { s1: true, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The OpenAPI tool accepts OpenAPI 3.0 or 3.1 specifications in which each operation has an `operationId`. It supports one API key security scheme per tool, with the key stored in a project connection; when an API uses several schemes, you create several OpenAPI tools. Request bodies must be `application/json` (or `application/json-patch+json`), so a `multipart/form-data` operation isn't supported.
        fr: |
          L'outil OpenAPI accepte les spécifications OpenAPI 3.0 ou 3.1 dans lesquelles chaque opération a un `operationId`. Il prend en charge un seul schéma de sécurité par clé API par outil, la clé étant stockée dans une connexion de projet ; quand une API utilise plusieurs schémas, vous créez plusieurs outils OpenAPI. Les corps de requête doivent être en `application/json` (ou `application/json-patch+json`) : une opération en `multipart/form-data` n'est donc pas prise en charge.
      options:
        s3: { en: "The supported request body content types are application/json and application/json-patch+json; the partner would need a JSON variant of the operation.", fr: "Les types de contenu de corps de requête pris en charge sont application/json et application/json-patch+json ; le partenaire devrait fournir une variante JSON de l'opération." }
    references:
      - title: Connect OpenAPI tools to Microsoft Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-22-07
    objective: "2.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a prompt agent named **refunds-agent**. Its function tool `issue_refund` is run by the backend of the application, because the refund logic uses the customer's session data.

        Company policy requires that a supervisor approves every refund before it's issued, and the control must hold even if a prompt injection manipulates the model. Supervisors answer approval requests within two minutes.

        What should you do?
      fr: |
        Northwind Traders dispose d'un agent d'invite nommé **refunds-agent**. Son outil de fonction `issue_refund` est exécuté par le backend de l'application, car la logique de remboursement utilise les données de session du client.

        La politique de l'entreprise exige qu'un superviseur approuve chaque remboursement avant son émission, et le contrôle doit tenir même si une injection d'invite manipule le modèle. Les superviseurs répondent aux demandes d'approbation en deux minutes.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "In the backend, hold each issue_refund call, show its arguments to a supervisor, and run the function only after approval.", fr: "Dans le backend, retenir chaque appel à issue_refund, montrer ses arguments à un superviseur et n'exécuter la fonction qu'après approbation." } }
        - { id: b, text: { en: "Set require_approval to always in the FunctionTool definition of issue_refund, and handle the approval requests.", fr: "Définir require_approval sur always dans la définition FunctionTool d'issue_refund, et traiter les demandes d'approbation." } }
        - { id: c, text: { en: "State in the instructions that refunds-agent must obtain a supervisor's approval before it calls issue_refund.", fr: "Indiquer dans les instructions que refunds-agent doit obtenir l'approbation d'un superviseur avant d'appeler issue_refund." } }
        - { id: d, text: { en: "Assign refunds-agent a guardrail with a control on the tool call intervention point of issue_refund.", fr: "Attribuer à refunds-agent un garde-fou doté d'un contrôle sur le point d'intervention Tool call d'issue_refund." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          With a function tool, the response stops at a `function_call` item and nothing runs until the backend executes the function. The backend can therefore require explicit confirmation before a side effect: show the arguments to a supervisor, run `issue_refund` only if approved, and otherwise return a refusal as the output. The decision happens outside the model, and two minutes fits well within the 10-minute run expiration.
        fr: |
          Avec un outil de fonction, la réponse s'arrête sur un élément `function_call` et rien ne s'exécute tant que le backend n'exécute pas la fonction. Le backend peut donc exiger une confirmation explicite avant tout effet de bord : montrer les arguments à un superviseur, n'exécuter `issue_refund` qu'en cas d'approbation et sinon renvoyer un refus comme sortie. La décision se prend hors du modèle, et deux minutes tiennent largement dans l'expiration de l'exécution à 10 minutes.
      options:
        b: { en: "require_approval is a parameter of the MCP tool; a function tool definition has a name, description, parameters and strict, and no approval setting.", fr: "require_approval est un paramètre de l'outil MCP ; une définition d'outil de fonction a un nom, une description, des paramètres et strict, sans paramètre d'approbation." }
        c: { en: "Instructions are a request to the model, not a control: a prompt injection can make the model skip the approval.", fr: "Les instructions sont une demande adressée au modèle, pas un contrôle : une injection d'invite peut amener le modèle à ignorer l'approbation." }
        d: { en: "A guardrail detects risks such as attacks in tool calls and blocks content; it doesn't collect a supervisor's decision.", fr: "Un garde-fou détecte des risques comme des attaques dans les appels d'outils et bloque du contenu ; il ne recueille pas la décision d'un superviseur." }
    references:
      - title: Use function calling with Microsoft Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling
      - title: Connect agents to MCP server endpoints - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-22-08
    objective: "2.2.2"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso created a prompt agent named **orders-agent** with the Python SDK. Its function tool `get_order` is defined with `strict` set to true and a required `order_id` parameter. The backend runs `get_order` by building a SQL query against the orders database.

        A product owner wants to test orders-agent in the Foundry portal. The team also plans to add an optional `include_items` parameter to `get_order`.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso a créé un agent d'invite nommé **orders-agent** avec le SDK Python. Son outil de fonction `get_order` est défini avec `strict` à true et un paramètre obligatoire `order_id`. Le backend exécute `get_order` en construisant une requête SQL sur la base de données des commandes.

        Une responsable produit veut tester orders-agent dans le portail Foundry. L'équipe prévoit aussi d'ajouter un paramètre facultatif `include_items` à `get_order`.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "When the product owner asks about an order in the portal, the portal runs `get_order` and the agent answers with its result.", fr: "Quand la responsable produit pose une question sur une commande dans le portail, le portail exécute `get_order` et l'agent répond avec son résultat." }
        - id: s2
          text: { en: "To add `include_items`, the team calls `create_version` with the new tool definition by using the SDK.", fr: "Pour ajouter `include_items`, l'équipe appelle `create_version` avec la nouvelle définition de l'outil à l'aide du SDK." }
        - id: s3
          text: { en: "Because `strict` is true, the backend can insert the `order_id` value into its SQL query without validating it.", fr: "Comme `strict` vaut true, le backend peut insérer la valeur d'`order_id` dans sa requête SQL sans la valider." }
    answer:
      values: { s1: false, s2: true, s3: false }
    explanation:
      correct:
        en: |
          The portal can run an agent that has function tools, but it doesn't invoke the functions, and it can't add or update function definitions: those changes go through the SDK or the REST API, and each `create_version` call creates a new version of the agent. `strict` makes the arguments match the schema, but Learn still says to treat tool arguments as untrusted input and to validate and sanitize them before use.
        fr: |
          Le portail peut exécuter un agent doté d'outils de fonction, mais il n'appelle pas les fonctions et ne peut ni ajouter ni modifier leurs définitions : ces modifications passent par le SDK ou l'API REST, et chaque appel à `create_version` crée une nouvelle version de l'agent. `strict` rend les arguments conformes au schéma, mais Learn demande toujours de traiter les arguments d'outil comme des entrées non fiables, et de les valider et de les assainir avant usage.
      options:
        s1: { en: "The portal shows the agent and its function calls but doesn't execute the functions; only the backend that calls the agent runs get_order.", fr: "Le portail affiche l'agent et ses appels de fonction, mais n'exécute pas les fonctions ; seul le backend qui appelle l'agent exécute get_order." }
        s3: { en: "A schema-valid string can still carry a SQL injection; the backend must validate the value and use a parameterized query.", fr: "Une chaîne conforme au schéma peut tout de même porter une injection SQL ; le backend doit valider la valeur et utiliser une requête paramétrée." }
    references:
      - title: Use function calling with Microsoft Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-22-09
    objective: "2.2.4"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has a classic agent named **claims-agent** that uses the connected agents tool to call two agents of the same project, **fraud-agent** and **policy-agent**. The company is moving the three agents to the new Foundry Agent Service. The requirements are the following:

        - claims-agent must remain responsible for the conversation with the customer and combine the answers of the other two agents.
        - The team must not write or host any orchestration code.
        - The solution goes into production in January 2027.

        What should you do?
      fr: |
        Wingtip Toys dispose d'un agent classique nommé **claims-agent** qui utilise l'outil connected agents pour appeler deux agents du même projet, **fraud-agent** et **policy-agent**. L'entreprise migre les trois agents vers le nouveau Foundry Agent Service. Les exigences sont les suivantes :

        - claims-agent doit rester responsable de la conversation avec le client et combiner les réponses des deux autres agents.
        - L'équipe ne doit écrire ni héberger aucun code d'orchestration.
        - La solution passe en production en janvier 2027.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Recreate claims-agent in the new Agent Service as a new version that keeps its connected agents tool.", fr: "Recréer claims-agent dans le nouvel Agent Service sous forme d'une nouvelle version qui conserve son outil connected agents." } }
        - { id: b, text: { en: "Enable incoming A2A on fraud-agent and policy-agent, and add an A2A tool for each of them to claims-agent.", fr: "Activer l'A2A entrant sur fraud-agent et policy-agent, et ajouter à claims-agent un outil A2A pour chacun d'eux." } }
        - { id: c, text: { en: "Rebuild the three agents as a group chat in the Foundry workflows designer, and export the workflow YAML.", fr: "Reconstruire les trois agents sous forme de group chat dans le concepteur Foundry workflows, et exporter le YAML du workflow." } }
        - { id: d, text: { en: "Rebuild the solution as an Agent Framework handoff workflow, and deploy the workflow as a hosted agent.", fr: "Reconstruire la solution sous forme de workflow handoff Agent Framework, et déployer le workflow comme agent hébergé." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          The connected agents tool of the classic Agents API isn't available in the new Foundry Agent Service; the replacements are the A2A tool and workflows. With the generally available A2A tool, claims-agent calls each remote agent, receives its response and keeps managing the conversation. The targets need incoming A2A enabled, and the calling identity needs Foundry Agent Consumer or higher on the target project.
        fr: |
          L'outil connected agents de l'API Agents classique n'est pas disponible dans le nouveau Foundry Agent Service ; les remplacements sont l'outil A2A et les workflows. Avec l'outil A2A en disponibilité générale, claims-agent appelle chaque agent distant, reçoit sa réponse et continue de gérer la conversation. Les cibles doivent avoir l'A2A entrant activé, et l'identité appelante a besoin de Foundry Agent Consumer ou plus sur le projet cible.
      options:
        a: { en: "The connected agents tool doesn't exist in the new Agent Service, so no new version can keep it.", fr: "L'outil connected agents n'existe pas dans le nouvel Agent Service : aucune nouvelle version ne peut donc le conserver." }
        c: { en: "Foundry workflows is in preview and retires on December 1, 2026, before the production date; the visual designer and in-portal runs stop then.", fr: "Foundry workflows est en préversion et sera retiré le 1er décembre 2026, avant la mise en production ; le concepteur visuel et l'exécution dans le portail s'arrêtent alors." }
        d: { en: "A hosted workflow is orchestration code that the team must write and host, and a handoff passes ownership of the conversation away from claims-agent.", fr: "Un workflow hébergé est du code d'orchestration que l'équipe doit écrire et héberger, et un handoff retire à claims-agent la responsabilité de la conversation." }
    references:
      - title: Connect to an A2A agent endpoint from Foundry Agent Service - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent
      - title: Build a workflow in Microsoft Foundry (Preview) - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-22-10
    objective: "2.2.6"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Proseware has a prompt agent named **returns-agent** with three function tools: `lookup_order`, `check_return` and `create_label`. The agent uses no other tool. Application Insights is connected to the project, and a regression dataset lists the expected sequence of tool calls for each item.

        The team must answer the four questions shown in the answer area.

        Which evaluator or data source should you use for each question? To answer, drag the appropriate items to the correct questions. Each item may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware dispose d'un agent d'invite nommé **returns-agent** doté de trois outils de fonction : `lookup_order`, `check_return` et `create_label`. L'agent n'utilise aucun autre outil. Application Insights est connecté au projet, et un jeu de données de régression liste la séquence attendue d'appels d'outils pour chaque élément.

        L'équipe doit répondre aux quatre questions présentées dans la zone de réponse.

        Quel évaluateur ou quelle source de données devez-vous utiliser pour chaque question ? Pour répondre, faites glisser les éléments appropriés vers les questions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: tia, text: Tool Input Accuracy }
        - { id: tsel, text: Tool Selection }
        - { id: tcs, text: Tool Call Success }
        - { id: tou, text: Tool Output Utilization }
        - { id: tne, text: Task Navigation Efficiency }
        - { id: trace, text: { en: "The trace of the run", fr: "La trace de l'exécution" } }
      targets:
        - id: t1
          text: { en: "Across 400 test conversations, how often does the agent pass an order number that appears nowhere in the conversation, or a date in the wrong format?", fr: "Sur 400 conversations de test, à quelle fréquence l'agent transmet-il un numéro de commande qui n'apparaît nulle part dans la conversation, ou une date au mauvais format ?" }
        - id: t2
          text: { en: "Across the same conversations, how often do the tool calls end in a timeout or an exception?", fr: "Sur les mêmes conversations, à quelle fréquence les appels d'outils se terminent-ils par un délai d'expiration ou une exception ?" }
        - id: t3
          text: { en: "On the regression dataset, does the agent call lookup_order, then check_return, then create_label?", fr: "Sur le jeu de données de régression, l'agent appelle-t-il lookup_order, puis check_return, puis create_label ?" }
        - id: t4
          text: { en: "In one failed run reported by a customer, which step made the answer take 40 seconds?", fr: "Dans une exécution en échec signalée par un client, quelle étape a fait durer la réponse 40 secondes ?" }
    answer:
      mapping: { t1: tia, t2: tcs, t3: tne, t4: trace }
    explanation:
      correct:
        en: |
          Tool Input Accuracy checks every argument against strict criteria, including grounding in the conversation and the expected format. Tool Call Success flags calls that end in technical errors, timeouts or exceptions. Task Navigation Efficiency compares the agent's tool calls with the expected sequence of the dataset. A question about one run is a trace question: the `execute_tool` spans show each call with its duration.
        fr: |
          Tool Input Accuracy vérifie chaque argument selon des critères stricts, dont l'ancrage dans la conversation et le format attendu. Tool Call Success signale les appels qui se terminent par des erreurs techniques, des délais d'expiration ou des exceptions. Task Navigation Efficiency compare les appels d'outils de l'agent à la séquence attendue du jeu de données. Une question sur une seule exécution relève de la trace : les spans `execute_tool` montrent chaque appel avec sa durée.
      options:
        tsel: { en: "Tool Selection checks that the agent chose the necessary tools without unnecessary ones, not that the arguments are grounded or well formatted.", fr: "Tool Selection vérifie que l'agent a choisi les outils nécessaires sans outils inutiles, pas que les arguments sont ancrés ou bien formatés." }
        tou: { en: "Tool Output Utilization checks that the agent used the tool results in its answer; it says nothing about arguments, errors or latency.", fr: "Tool Output Utilization vérifie que l'agent a utilisé les résultats des outils dans sa réponse ; il ne dit rien des arguments, des erreurs ni de la latence." }
    references:
      - title: Agent Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators
