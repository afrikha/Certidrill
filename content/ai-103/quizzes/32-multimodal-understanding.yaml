  # ------------------------------------------------------------------ 8
  - id: ai103-qz-32-08
    objective: "3.2.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Tailspin Toys builds a warehouse app that answers questions about photos of shelf labels, such as "What is the SKU of the bin on the left?". The app calls a `gpt-4.1` deployment by using the Responses API and sends each photo with `detail` set to `low`. Testing shows three problems:

        - When a label is torn, the model returns a plausible SKU that isn't printed on it.
        - The app can't tell, without parsing free text, whether an answer was found in the photo.
        - SKUs printed in small characters are often misread.

        Which three actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys crée une application d'entrepôt qui répond à des questions sur des photos d'étiquettes de rayonnage, comme « Quel est le SKU du bac de gauche ? ». L'application appelle un déploiement `gpt-4.1` avec l'API Responses et envoie chaque photo avec `detail` défini sur `low`. Les tests révèlent trois problèmes :

        - Quand une étiquette est déchirée, le modèle renvoie un SKU plausible qui n'y est pas imprimé.
        - L'application ne peut pas savoir, sans analyser du texte libre, si une réponse a été trouvée dans la photo.
        - Les SKU imprimés en petits caractères sont souvent mal lus.

        Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      options:
        - { id: a, text: { en: "Instruct the model to answer only from the photo, quote label text exactly, and say when it can't tell", fr: "Demander au modèle de répondre uniquement d'après la photo, de citer exactement le texte et de dire quand il ne peut pas conclure" } }
        - { id: b, text: { en: "Set `temperature` to 0 so that the model stops returning values that aren't printed", fr: "Définir `temperature` sur 0 pour que le modèle cesse de renvoyer des valeurs non imprimées" } }
        - { id: c, text: { en: "Set `text.format` to a strict JSON schema with `answer`, `answerable` and `evidence` properties", fr: "Définir `text.format` sur un schéma JSON strict avec les propriétés `answer`, `answerable` et `evidence`" } }
        - { id: d, text: { en: "Add a `response_format` parameter that contains the JSON schema to the request", fr: "Ajouter à la requête un paramètre `response_format` qui contient le schéma JSON" } }
        - { id: e, text: { en: "Set `detail` to `high` on the image parts of the request", fr: "Définir `detail` sur `high` dans les parties d'image de la requête" } }
        - { id: f, text: { en: "Raise `max_output_tokens` so that the model has room to read the small characters", fr: "Augmenter `max_output_tokens` pour que le modèle ait la place de lire les petits caractères" } }
      choose: 3
    answer: { optionIds: [a, c, e] }
    explanation:
      correct:
        en: |
          Grounding comes from restricting the source to the photo, asking for exact quotes and allowing "can't determine". A strict schema in `text.format` (the Responses API location) returns `answerable` as a boolean the app reads without parsing, with the evidence beside the answer. `detail` set to `high` adds detailed 512 x 512 segments, which small characters need.
        fr: |
          L'ancrage vient de la restriction de la source à la photo, de la demande de citations exactes et de l'autorisation de répondre « impossible à déterminer ». Un schéma strict dans `text.format` (l'emplacement de l'API Responses) renvoie `answerable` sous forme de booléen que l'application lit sans analyse, avec les preuves à côté de la réponse. `detail` défini sur `high` ajoute des segments détaillés de 512 x 512, nécessaires aux petits caractères.
      options:
        b: { en: "A lower temperature makes answers more deterministic, but it doesn't stop the model from answering what the photo doesn't show.", fr: "Une température plus basse rend les réponses plus déterministes, mais n'empêche pas le modèle de répondre ce que la photo ne montre pas." }
        d: { en: "`response_format` is the Chat Completions parameter; in a Responses request, the schema goes in `text.format`.", fr: "`response_format` est le paramètre de Chat Completions ; dans une requête Responses, le schéma se place dans `text.format`." }
        f: { en: "The output limit only prevents truncated answers; it doesn't change how much of the image the model examines.", fr: "La limite de sortie évite seulement les réponses tronquées ; elle ne change pas la part de l'image que le modèle examine." }
    references:
      - title: Use the Azure OpenAI Responses API
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
      - title: How to use vision-enabled chat models
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-32-09
    objective: "3.2.6"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam Studios publishes cooking shows of about 40 minutes. Each show presents several recipes and contains ad breaks. You are designing an Azure Content Understanding custom analyzer that derives from `prebuilt-video`.

        For each recipe, the analysis must return `dishName` and `ingredients`. Ad breaks must produce no recipe result.

        How should you configure the analyzer?
      fr: |
        Fabrikam Studios publie des émissions de cuisine d'environ 40 minutes. Chaque émission présente plusieurs recettes et contient des coupures publicitaires. Vous concevez un analyseur Azure Content Understanding personnalisé qui dérive de `prebuilt-video`.

        Pour chaque recette, l'analyse doit renvoyer `dishName` et `ingredients`. Les coupures publicitaires ne doivent produire aucun résultat de recette.

        Comment devez-vous configurer l'analyseur ?
    body:
      options:
        - { id: a, text: { en: "Set `enableSegment` to `true` with two content categories: `recipe`, routed by `analyzerId` to an analyzer with the recipe fields, and `ad`, with no analyzer", fr: "Définir `enableSegment` sur `true` avec deux catégories de contenu : `recipe`, routée par `analyzerId` vers un analyseur doté des champs de recette, et `ad`, sans analyseur" } }
        - { id: b, text: { en: "Set `enableSegment` to `false` and `returnDetails` to `true`, then group the results into recipes in the app by using the shot boundaries in `cameraShotTimesMs`", fr: "Définir `enableSegment` sur `false` et `returnDetails` sur `true`, puis regrouper les résultats par recette dans l'application à l'aide des limites de plans de `cameraShotTimesMs`" } }
        - { id: c, text: { en: "Set `enableSegment` to `true` with one content category that asks for one segment per recipe and to ignore ads, routed by `analyzerId` to an analyzer with the recipe fields", fr: "Définir `enableSegment` sur `true` avec une seule catégorie de contenu qui décrit un segment par recette et demande d'ignorer les publicités, routée par `analyzerId` vers un analyseur doté des champs de recette" } }
        - { id: d, text: { en: "Derive the analyzer from `prebuilt-videoSearch` instead, keep its automatic segments, and add `dishName` and `ingredients` to its field schema", fr: "Faire plutôt dériver l'analyseur de `prebuilt-videoSearch`, garder ses segments automatiques et ajouter `dishName` et `ingredients` à son schéma de champs" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With `enableSegment` set to `true`, the model splits the video according to the natural-language description of the content category, which can ask for one segment per recipe without overlap and tell it to ignore ads. The category's `analyzerId` sends each segment to the analyzer that holds the per-recipe fields. A video analyzer supports only one content category.
        fr: |
          Avec `enableSegment` défini sur `true`, le modèle découpe la vidéo selon la description en langage naturel de la catégorie de contenu, qui peut demander un segment par recette sans chevauchement et lui dire d'ignorer les publicités. L'`analyzerId` de la catégorie envoie chaque segment à l'analyseur qui porte les champs par recette. Un analyseur vidéo ne prend en charge qu'une seule catégorie de contenu.
      options:
        a: { en: "Video analyzers support only one content category, so the ads can't be a second category; the single description must exclude them.", fr: "Les analyseurs vidéo ne prennent en charge qu'une seule catégorie de contenu : les publicités ne peuvent pas former une deuxième catégorie, l'unique description doit les exclure." }
        b: { en: "With segmentation off, the whole video is one segment; camera shots don't match recipes, and the app would have to rebuild the recipe boundaries.", fr: "Sans segmentation, toute la vidéo forme un seul segment ; les plans de caméra ne correspondent pas aux recettes, et l'application devrait reconstruire les limites des recettes." }
        d: { en: "Custom analyzers can derive only from the four base analyzers; `prebuilt-videoSearch` is a RAG analyzer and can't be extended with fields.", fr: "Les analyseurs personnalisés ne peuvent dériver que des quatre analyseurs de base ; `prebuilt-videoSearch` est un analyseur RAG qu'on ne peut pas étendre avec des champs." }
    references:
      - title: Azure Content Understanding in Foundry Tools video overview
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
      - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-32-10
    objective: "3.2.7"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Tailspin Insurance receives, for each claim, a claim form as a PDF file and three to ten damage photos. The production solution uses API version `2025-11-01` of Azure Content Understanding.

        The solution must flag each claim in which the damage described in the form doesn't match the photos, or in which the policy number is missing from Tailspin's policy register, a CSV file of 200,000 rows.

        Which design should you use?
      fr: |
        Tailspin Insurance reçoit, pour chaque sinistre, un formulaire de déclaration au format PDF et trois à dix photos des dommages. La solution de production utilise la version d'API `2025-11-01` d'Azure Content Understanding.

        La solution doit signaler chaque sinistre dont les dommages décrits dans le formulaire ne correspondent pas aux photos, ou dont le numéro de police est absent du registre des polices de Tailspin, un fichier CSV de 200 000 lignes.

        Quelle conception devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Create one pro mode analyzer that takes the form and the photos as inputs and uses the policy register as an external knowledge base", fr: "Créer un analyseur en mode pro qui reçoit le formulaire et les photos en entrée et utilise le registre des polices comme base de connaissances externe" } }
        - { id: b, text: { en: "Create a document analyzer with `config.workflow` set to `agentic`, and send the form and the photos in one analysis request", fr: "Créer un analyseur de documents avec `config.workflow` défini sur `agentic`, et envoyer le formulaire et les photos dans une seule requête d'analyse" } }
        - { id: c, text: { en: "Create an image analyzer whose `contentCategories` route each photo to a damage analyzer, with the form and the register attached as reference data", fr: "Créer un analyseur d'images dont les `contentCategories` routent chaque photo vers un analyseur de dommages, avec le formulaire et le registre joints comme données de référence" } }
        - { id: d, text: { en: "Analyze the form with a document analyzer and each photo with an image analyzer, then compare the results and check the register in the application", fr: "Analyser le formulaire avec un analyseur de documents et chaque photo avec un analyseur d'images, puis comparer les résultats et vérifier le registre dans l'application" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Reasoning across several inputs and reference data is a document capability, and it isn't part of the GA API that the production solution uses. A single-task analyzer per modality returns structured fields for the form and for each photo, and the application (or an agent) performs the cross-check and the register lookup.
        fr: |
          Le raisonnement sur plusieurs entrées et sur des données de référence est une capacité propre aux documents, et il ne fait pas partie de l'API GA qu'utilise la solution de production. Un analyseur à tâche unique par modalité renvoie des champs structurés pour le formulaire et pour chaque photo, et l'application (ou un agent) effectue le rapprochement et la vérification dans le registre.
      options:
        a: { en: "Pro mode was introduced with the preview API `2025-05-01-preview` and is limited to documents: it fits neither the GA API nor the photos.", fr: "Le mode pro est apparu avec l'API en préversion `2025-05-01-preview` et est limité aux documents : il ne convient ni à l'API GA ni aux photos." }
        b: { en: "Agentic mode requires the `2026-06-01-preview` API, works on document analyzers and accepts one input file per request for now.", fr: "Le mode agentique exige l'API `2026-06-01-preview`, fonctionne sur les analyseurs de documents et n'accepte pour l'instant qu'un fichier d'entrée par requête." }
        c: { en: "`contentCategories` is supported by document and video analyzers, not image analyzers, and standard analyzers don't take reference data.", fr: "`contentCategories` est pris en charge par les analyseurs de documents et vidéo, pas par les analyseurs d'images, et les analyseurs standard ne reçoivent pas de données de référence." }
    references:
      - title: What's new in Content Understanding?
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/whats-new
      - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
