chapter: 32-multimodal-understanding
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-32-01
    objective: "3.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders uploaded 2,000 product photos by using the Files API and stored the ID returned for each file. An app now asks a vision-enabled model deployment, through the Responses API, to describe one of these photos without uploading it again.

        What should the `input_image` content part of the request contain?
      fr: |
        Northwind Traders a chargé 2 000 photos de produits avec l'API Files et a conservé l'ID renvoyé pour chaque fichier. Une application demande maintenant à un déploiement de modèle compatible avec la vision, via l'API Responses, de décrire l'une de ces photos sans la charger à nouveau.

        Que doit contenir la partie de contenu `input_image` de la requête ?
    body:
      options:
        - { id: a, text: "`\"file_id\": \"<ID returned by the Files API>\"`" }
        - { id: b, text: "`\"image_url\": \"<ID returned by the Files API>\"`" }
        - { id: c, text: "`\"image_url\": \"file://<name of the uploaded file>\"`" }
        - { id: d, text: "`\"text\": \"<ID returned by the Files API>\"`" }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The Responses API accepts an image in three ways: a URL, a base64 data URL or the ID of a file created with the Files API. A file that was already uploaded is referenced with `file_id` in the `input_image` part, so the photo doesn't need to be sent again.
        fr: |
          L'API Responses accepte une image de trois façons : une URL, une URL de données base64 ou l'ID d'un fichier créé avec l'API Files. Un fichier déjà chargé se référence avec `file_id` dans la partie `input_image` : la photo n'a pas besoin d'être renvoyée.
      options:
        b: { en: "`image_url` takes a URL or a base64 data URL; a file ID placed there isn't an address the model can read.", fr: "`image_url` reçoit une URL ou une URL de données base64 ; un ID de fichier placé là n'est pas une adresse que le modèle peut lire." }
        c: { en: "A `file://` path points to a local file system that the service can't reach; uploaded files are referenced by their ID.", fr: "Un chemin `file://` désigne un système de fichiers local que le service ne peut pas atteindre ; les fichiers chargés se référencent par leur ID." }
        d: { en: "`text` belongs to text parts: the model would receive the ID as a string of characters, not the image.", fr: "`text` appartient aux parties de texte : le modèle recevrait l'ID comme une chaîne de caractères, pas l'image." }
    references:
      - title: Use the Azure OpenAI Responses API
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-32-02
    objective: "3.2.5"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        The quality team at Adatum wants to define the fields of a custom Azure Content Understanding analyzer for photos of welded joints, and try the analyzer on sample photos, without writing code.

        Which experience should the team use?
      fr: |
        L'équipe qualité d'Adatum veut définir les champs d'un analyseur Azure Content Understanding personnalisé pour des photos de soudures, et essayer l'analyseur sur des photos d'exemple, sans écrire de code.

        Quelle expérience l'équipe doit-elle utiliser ?
    body:
      options:
        - { id: a, text: { en: "The Content Understanding playground in the Microsoft Foundry portal", fr: "Le terrain de jeu Content Understanding dans le portail Microsoft Foundry" } }
        - { id: b, text: { en: "Content Safety Studio, with the Moderate Image Content feature", fr: "Content Safety Studio, avec la fonctionnalité Moderate Image Content" } }
        - { id: c, text: { en: "Content Understanding Studio, connected to the Foundry resource", fr: "Content Understanding Studio, connecté à la ressource Foundry" } }
        - { id: d, text: { en: "The chat playground in the Microsoft Foundry portal, with a vision model", fr: "Le terrain de jeu de conversation du portail Microsoft Foundry, avec un modèle de vision" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Content Understanding Studio is the experience that creates custom analyzers and offers the full catalog of prebuilt analyzers. The Content Understanding playground in the Foundry portal runs only a set of supported prebuilt analyzers and can't create custom ones.
        fr: |
          Content Understanding Studio est l'expérience qui crée des analyseurs personnalisés et propose le catalogue complet des analyseurs prédéfinis. Le terrain de jeu Content Understanding du portail Foundry n'exécute qu'un ensemble d'analyseurs prédéfinis pris en charge et ne peut pas en créer de personnalisés.
      options:
        a: { en: "The Foundry playground runs a partial set of prebuilt analyzers; creating a custom analyzer requires Content Understanding Studio.", fr: "Le terrain de jeu Foundry exécute une partie des analyseurs prédéfinis ; créer un analyseur personnalisé exige Content Understanding Studio." }
        b: { en: "Content Safety Studio tests harm categories and severity thresholds, not analyzer fields.", fr: "Content Safety Studio teste des catégories de préjudice et des seuils de gravité, pas des champs d'analyseur." }
        d: { en: "The chat playground sends prompts to a model; it doesn't define or save an analyzer with a field schema.", fr: "Le terrain de jeu de conversation envoie des invites à un modèle ; il ne définit ni n'enregistre d'analyseur avec un schéma de champs." }
    references:
      - title: Content Understanding Studio and Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/foundry-vs-content-understanding-studio

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-32-03
    objective: "3.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Wingtip Media has an archive of 80,000 photos. A RAG chatbot must retrieve photos from a vector index by what they show, so each photo needs one descriptive paragraph, generated once and stored with the photo ID. The archivists don't need any custom field.

        The solution must minimize development effort. What should you use to produce the descriptions?
      fr: |
        Wingtip Media possède une archive de 80 000 photos. Un chatbot RAG doit récupérer des photos dans un index vectoriel selon ce qu'elles montrent : chaque photo a donc besoin d'un paragraphe descriptif, généré une fois et stocké avec l'ID de la photo. Les archivistes n'ont besoin d'aucun champ personnalisé.

        La solution doit réduire au minimum l'effort de développement. Que devez-vous utiliser pour produire les descriptions ?
    body:
      options:
        - { id: a, text: { en: "A vision-enabled chat model, called for each photo with a description prompt that you write", fr: "Un modèle de conversation compatible avec la vision, appelé pour chaque photo avec une invite de description que vous rédigez" } }
        - { id: b, text: { en: "The Azure Content Understanding `prebuilt-read` analyzer, called for each photo", fr: "L'analyseur Azure Content Understanding `prebuilt-read`, appelé pour chaque photo" } }
        - { id: c, text: { en: "The Azure AI Content Safety Analyze Image API, called for each photo", fr: "L'API Analyze Image d'Azure AI Content Safety, appelée pour chaque photo" } }
        - { id: d, text: { en: "The Azure Content Understanding `prebuilt-imageSearch` analyzer, called for each photo", fr: "L'analyseur Azure Content Understanding `prebuilt-imageSearch`, appelé pour chaque photo" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `prebuilt-imageSearch` is a ready-to-use RAG analyzer that returns a one-paragraph description of the image and its visual content for retrieval. No schema or prompt has to be designed, which fits a large archive that needs descriptions and no custom field.
        fr: |
          `prebuilt-imageSearch` est un analyseur RAG prêt à l'emploi qui renvoie une description d'un paragraphe de l'image et de son contenu visuel pour la récupération. Aucun schéma ni aucune invite n'est à concevoir, ce qui convient à une grande archive qui a besoin de descriptions et d'aucun champ personnalisé.
      options:
        a: { en: "A chat model can write the descriptions, but you must design, test and maintain the prompt and the output handling: more development than a prebuilt analyzer.", fr: "Un modèle de conversation peut rédiger les descriptions, mais vous devez concevoir, tester et maintenir l'invite et le traitement de la sortie : plus de développement qu'un analyseur prédéfini." }
        b: { en: "`prebuilt-read` extracts words and paragraphs of text (OCR); it doesn't describe what a photo shows.", fr: "`prebuilt-read` extrait des mots et des paragraphes de texte (OCR) ; il ne décrit pas ce que montre une photo." }
        c: { en: "Analyze Image returns harm severities (hate, sexual, violence, self-harm), not a description of the photo.", fr: "Analyze Image renvoie des gravités de préjudice (haine, contenu sexuel, violence, automutilation), pas une description de la photo." }
    references:
      - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-32-04
    objective: "3.2.4"
    difficulty: 2
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso generates the alt text of the images of its online help center by using a vision-enabled chat model. You are reviewing the rules written in the model's instructions against the Microsoft accessibility guidance for alt text.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso génère le texte de remplacement des images de son centre d'aide en ligne avec un modèle de conversation compatible avec la vision. Vous vérifiez les règles écrites dans les instructions du modèle par rapport aux recommandations d'accessibilité de Microsoft pour le texte de remplacement.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - id: s1
          text: { en: "A download arrow icon placed right before the link text Download needs alt text that describes the arrow.", fr: "Une icône de flèche de téléchargement placée juste avant le texte de lien Télécharger a besoin d'un texte de remplacement qui décrit la flèche." }
        - id: s2
          text: { en: "When the text embedded in a screenshot would be hard for a screen reader to read, the alt text can paraphrase that text.", fr: "Quand le texte incorporé dans une capture d'écran serait difficile à lire pour un lecteur d'écran, le texte de remplacement peut paraphraser ce texte." }
        - id: s3
          text: { en: "For a complex architecture diagram, the detailed description can be placed in linked content rather than in the alt text.", fr: "Pour un diagramme d'architecture complexe, la description détaillée peut être placée dans un contenu lié plutôt que dans le texte de remplacement." }
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          An image that sits next to text saying the same thing is decorative: in web content it gets a null alt text (`alt=""`). Embedded text belongs in the alt text when the page doesn't already contain it, and it can be paraphrased if a screen reader would struggle with it. A complex image keeps a short alt text, with its detailed description in the surrounding text or in linked content.
        fr: |
          Une image placée à côté d'un texte qui dit la même chose est décorative : dans du contenu web, elle reçoit un texte de remplacement vide (`alt=""`). Le texte incorporé a sa place dans le texte de remplacement quand la page ne le contient pas déjà, et il peut être paraphrasé si un lecteur d'écran aurait du mal à le lire. Une image complexe garde un texte de remplacement court, avec sa description détaillée dans le texte environnant ou dans un contenu lié.
      options:
        s1: { en: "When a link has both an image and text, the image is decorative: describing the arrow would make the screen reader repeat information.", fr: "Quand un lien comporte à la fois une image et du texte, l'image est décorative : décrire la flèche ferait répéter l'information par le lecteur d'écran." }
    references:
      - title: Alternative text (alt text)
        url: https://learn.microsoft.com/en-us/style-guide/accessibility/alternative-text

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-32-05
    objective: "3.2.8"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Proseware inspects photos of circuit boards with an Azure Content Understanding analyzer based on `prebuilt-image`. A `classify` field named `shieldCover` has the enum Present, Missing. Boards whose shield cover is hidden by a cable in the photo are reported as Missing, and the dashboard can't separate them from boards that really lack the cover.

        You need the analyzer to distinguish the two cases. What should you do?
      fr: |
        Proseware inspecte des photos de cartes électroniques avec un analyseur Azure Content Understanding fondé sur `prebuilt-image`. Un champ `classify` nommé `shieldCover` a l'enum Present, Missing. Les cartes dont le capot de blindage est masqué par un câble sur la photo sont signalées Missing, et le tableau de bord ne peut pas les distinguer des cartes auxquelles le capot manque vraiment.

        L'analyseur doit distinguer les deux cas. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Change the method of `shieldCover` to `extract` so that the value is read as it appears", fr: "Remplacer la méthode de `shieldCover` par `extract` pour que la valeur soit lue telle qu'elle apparaît" } }
        - { id: b, text: { en: "Add a NotVisible value to the enum and say in the field description when to use it", fr: "Ajouter une valeur NotVisible à l'enum et préciser dans la description du champ quand l'utiliser" } }
        - { id: c, text: { en: "Set `returnDetails` to `true` in the analyzer configuration to get more detail", fr: "Définir `returnDetails` sur `true` dans la configuration de l'analyseur pour obtenir plus de détails" } }
        - { id: d, text: { en: "Change the type of `shieldCover` to `boolean` so that the model returns true or false", fr: "Remplacer le type de `shieldCover` par `boolean` pour que le modèle renvoie true ou false" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A `classify` field returns one value of its `enum`, so the model can only report states that the enum offers. Adding NotVisible, and describing it in the field description that the model uses as context, lets the analyzer report a hidden component separately from a missing one.
        fr: |
          Un champ `classify` renvoie une valeur de son `enum` : le modèle ne peut signaler que les états que l'enum propose. Ajouter NotVisible, et le décrire dans la description du champ que le modèle utilise comme contexte, permet à l'analyseur de signaler un composant masqué séparément d'un composant manquant.
      options:
        a: { en: "`extract` returns values as they appear in the content and is supported for documents only; the state of a component in a photo isn't printed text.", fr: "`extract` renvoie des valeurs telles qu'elles apparaissent dans le contenu et n'est pris en charge que pour les documents ; l'état d'un composant sur une photo n'est pas du texte imprimé." }
        c: { en: "`returnDetails` adds details to the result, but the field can still return only Present or Missing.", fr: "`returnDetails` ajoute des détails au résultat, mais le champ ne peut toujours renvoyer que Present ou Missing." }
        d: { en: "A boolean still has two values, so a hidden cover and a missing cover would share one of them.", fr: "Un booléen n'a toujours que deux valeurs : un capot masqué et un capot manquant partageraient l'une d'elles." }
    references:
      - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
      - title: "What is Azure Content Understanding in Foundry Tools?"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-32-06
    objective: "3.2.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Litware Insurance stores photos of vehicle dashboards in a storage account that accepts traffic only through a private endpoint. A Python app in the same virtual network asks an o-series reasoning model deployment named `reason-vision` which warning lights are on and what the odometer reads. The app uses the Chat Completions API. The `blob_url` variable contains the URL of a photo, and `b64_photo` contains the same photo, read from the blob by the app and base64-encoded.

        The solution must meet the following requirements:

        - The storage account must stay private.
        - The model must always examine the fine details of the photo, whatever the image size, because the warning icons are small.
        - The completion must be limited to 2,000 tokens.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware Insurance stocke des photos de tableaux de bord de véhicules dans un compte de stockage qui n'accepte le trafic que par un point de terminaison privé. Une application Python du même réseau virtuel demande à un déploiement de modèle de raisonnement de la série o nommé `reason-vision` quels voyants sont allumés et ce qu'indique le compteur kilométrique. L'application utilise l'API Chat Completions. La variable `blob_url` contient l'URL d'une photo, et `b64_photo` contient la même photo, lue dans l'objet blob par l'application et encodée en base64.

        La solution doit répondre aux exigences suivantes :

        - Le compte de stockage doit rester privé.
        - Le modèle doit toujours examiner les détails fins de la photo, quelle que soit la taille de l'image, car les voyants sont petits.
        - La complétion doit être limitée à 2 000 jetons.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        response = client.chat.completions.create(
            model="reason-vision",
            messages=[{
                "role": "user",
                "content": [
                    {"type": "text",
                     "text": "Which warning lights are on? What does the odometer read?"},
                    {"type": [[part]],
                     "image_url": {"url": [[src]], "detail": [[detail]]}},
                ],
            }],
            [[limit]]=2000,
        )
        print(response.choices[0].message.content)
      slots:
        - id: part
          options:
            - { id: input_image, text: "\"input_image\"" }
            - { id: image_url, text: "\"image_url\"" }
            - { id: input_file, text: "\"input_file\"" }
        - id: src
          options:
            - { id: bloburl, text: blob_url }
            - { id: raw, text: b64_photo }
            - { id: dataurl, text: "f\"data:image/jpeg;base64,{b64_photo}\"" }
        - id: detail
          options:
            - { id: auto, text: "\"auto\"" }
            - { id: low, text: "\"low\"" }
            - { id: high, text: "\"high\"" }
        - id: limit
          options:
            - { id: maxtokens, text: max_tokens }
            - { id: maxcompletion, text: max_completion_tokens }
            - { id: maxoutput, text: max_output_tokens }
    answer:
      values: { part: image_url, src: dataurl, detail: high, limit: maxcompletion }
    explanation:
      correct:
        en: |
          In Chat Completions, an image is a content part of type `image_url` whose `url` is a public URL or a base64 data URL. Image URLs must be publicly accessible, so a private blob is read by the app and sent as `data:image/jpeg;base64,...`. `detail` set to `high` always activates the high-resolution mode, and o-series reasoning models take `max_completion_tokens` instead of `max_tokens`.
        fr: |
          Dans Chat Completions, une image est une partie de contenu de type `image_url` dont `url` est une URL publique ou une URL de données base64. Les URL d'images doivent être accessibles publiquement : un objet blob privé est donc lu par l'application et envoyé sous la forme `data:image/jpeg;base64,...`. `detail` défini sur `high` active toujours le mode haute résolution, et les modèles de raisonnement de la série o prennent `max_completion_tokens` au lieu de `max_tokens`.
      options:
        input_image: { en: "`input_image` is the image part type of the Responses API, not of Chat Completions.", fr: "`input_image` est le type de partie d'image de l'API Responses, pas de Chat Completions." }
        input_file: { en: "`input_file` is a Responses API part for files, not the Chat Completions image part.", fr: "`input_file` est une partie de l'API Responses pour les fichiers, pas la partie d'image de Chat Completions." }
        bloburl: { en: "The service fetches image URLs from Microsoft's infrastructure: a URL behind a private endpoint isn't read, even from the same virtual network.", fr: "Le service récupère les URL d'images depuis l'infrastructure de Microsoft : une URL derrière un point de terminaison privé n'est pas lue, même depuis le même réseau virtuel." }
        raw: { en: "Base64 bytes alone aren't a URL; the value must be a data URL with the `data:image/jpeg;base64,` prefix.", fr: "Des octets base64 seuls ne sont pas une URL ; la valeur doit être une URL de données avec le préfixe `data:image/jpeg;base64,`." }
        auto: { en: "With `auto`, the model chooses between low and high from the image size, which doesn't guarantee the high-resolution mode.", fr: "Avec `auto`, le modèle choisit entre low et high selon la taille de l'image, ce qui ne garantit pas le mode haute résolution." }
        low: { en: "`low` processes only a 512 x 512 version of the image and can miss small icons.", fr: "`low` ne traite qu'une version 512 x 512 de l'image et peut manquer de petites icônes." }
        maxtokens: { en: "For o-series reasoning models, `max_completion_tokens` replaces `max_tokens`.", fr: "Pour les modèles de raisonnement de la série o, `max_completion_tokens` remplace `max_tokens`." }
        maxoutput: { en: "`max_output_tokens` is the Responses API parameter, not a Chat Completions parameter.", fr: "`max_output_tokens` est le paramètre de l'API Responses, pas un paramètre de Chat Completions." }
    references:
      - title: How to use vision-enabled chat models
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-32-07
    objective: "3.2.5"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso Realty processes listing photos with API version `2025-11-01` of Azure Content Understanding. For each photo, a single analyzer call must return:

        - `roomType`: exactly one of Kitchen, Bathroom, Bedroom, LivingRoom or Exterior;
        - `damageNotes`: a free-text description of any visible damage;
        - `photoSummary`: one paragraph that describes the photo, stored in a vector index for retrieval.

        A developer suggests building on a ready-made analyzer that already returns image descriptions. Which analyzer definition should you create?
      fr: |
        Contoso Realty traite des photos d'annonces avec la version d'API `2025-11-01` d'Azure Content Understanding. Pour chaque photo, un seul appel d'analyseur doit renvoyer :

        - `roomType` : exactement une valeur parmi Kitchen, Bathroom, Bedroom, LivingRoom ou Exterior ;
        - `damageNotes` : une description en texte libre de tout dommage visible ;
        - `photoSummary` : un paragraphe qui décrit la photo, stocké dans un index vectoriel pour la récupération.

        Un développeur propose de partir d'un analyseur prêt à l'emploi qui renvoie déjà des descriptions d'images. Quelle définition d'analyseur devez-vous créer ?
    body:
      options:
        - { id: a, text: { en: "Base `prebuilt-imageSearch`; `roomType` with `classify` and an `enum`; `damageNotes` with `generate`", fr: "Base `prebuilt-imageSearch` ; `roomType` avec `classify` et une `enum` ; `damageNotes` avec `generate`" } }
        - { id: b, text: { en: "Base `prebuilt-image`; `config.contentCategories` with one category per room type; the two text fields with `generate`", fr: "Base `prebuilt-image` ; `config.contentCategories` avec une catégorie par type de pièce ; les deux champs de texte avec `generate`" } }
        - { id: c, text: { en: "Base `prebuilt-image`; `roomType` with `extract` and an `enum`; `damageNotes` and `photoSummary` with `generate`", fr: "Base `prebuilt-image` ; `roomType` avec `extract` et une `enum` ; `damageNotes` et `photoSummary` avec `generate`" } }
        - { id: d, text: { en: "Base `prebuilt-image`; `roomType` with `classify` and an `enum`; `damageNotes` and `photoSummary` with `generate`", fr: "Base `prebuilt-image` ; `roomType` avec `classify` et une `enum` ; `damageNotes` et `photoSummary` avec `generate`" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Custom analyzers can derive only from the four base analyzers (`prebuilt-document`, `prebuilt-image`, `prebuilt-audio`, `prebuilt-video`), so a photo analyzer is based on `prebuilt-image`. A value chosen from a fixed list is a `classify` field with an `enum`, and both the damage notes and the descriptive paragraph are free values produced with `generate`.
        fr: |
          Les analyseurs personnalisés ne peuvent dériver que des quatre analyseurs de base (`prebuilt-document`, `prebuilt-image`, `prebuilt-audio`, `prebuilt-video`) : un analyseur de photos se fonde donc sur `prebuilt-image`. Une valeur choisie dans une liste fixe est un champ `classify` avec une `enum`, et les notes de dommages comme le paragraphe descriptif sont des valeurs libres produites avec `generate`.
      options:
        a: { en: "`prebuilt-imageSearch` is a RAG analyzer, not one of the four base analyzers that a custom analyzer can derive from.", fr: "`prebuilt-imageSearch` est un analyseur RAG, pas l'un des quatre analyseurs de base dont un analyseur personnalisé peut dériver." }
        b: { en: "`contentCategories` is supported by document and video analyzers, not by image analyzers, and it routes content instead of returning a field.", fr: "`contentCategories` est pris en charge par les analyseurs de documents et vidéo, pas par les analyseurs d'images, et il route le contenu au lieu de renvoyer un champ." }
        c: { en: "`extract` returns values as they appear and is supported for documents only; picking one value of a list is `classify`.", fr: "`extract` renvoie des valeurs telles qu'elles apparaissent et n'est pris en charge que pour les documents ; choisir une valeur d'une liste relève de `classify`." }
    references:
      - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
