chapter: 42-speech
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-42-01
    objective: "4.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Proseware Publishing wants an agent to turn the chapters of its books into audio files. A chapter produces between 20 and 60 minutes of audio. The text is ready in SSML, and the audio files can be collected later from a storage account.

        Which Azure Speech feature should you use?
      fr: |
        Proseware Publishing veut qu'un agent transforme les chapitres de ses livres en fichiers audio. Un chapitre produit entre 20 et 60 minutes d'audio. Le texte est prêt au format SSML, et les fichiers audio peuvent être récupérés plus tard dans un compte de stockage.

        Quelle fonctionnalité d'Azure Speech devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "The batch transcription API", fr: "L'API de transcription par lots" } }
        - { id: b, text: { en: "The Voice Live API", fr: "L'API Voice Live" } }
        - { id: c, text: { en: "The batch synthesis API", fr: "L'API de synthèse par lots" } }
        - { id: d, text: { en: "The fast transcription API", fr: "L'API de transcription rapide" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The batch synthesis API synthesizes plain text or SSML asynchronously and is designed for long-form audio such as audiobooks: it can produce audio longer than 10 minutes. You submit a job, poll its status, and download the audio files when the job succeeds.
        fr: |
          L'API de synthèse par lots synthétise du texte brut ou du SSML de façon asynchrone et est conçue pour l'audio long, comme les livres audio : elle peut produire un audio de plus de 10 minutes. Vous soumettez un travail, interrogez son état, puis téléchargez les fichiers audio quand le travail a réussi.
      options:
        a: { en: "Batch transcription converts stored audio into text, the opposite direction.", fr: "La transcription par lots convertit de l'audio stocké en texte, dans le sens inverse." }
        b: { en: "Voice Live runs a real-time spoken conversation with a model; it doesn't produce long audio files from a document.", fr: "Voice Live mène une conversation orale en temps réel avec un modèle ; il ne produit pas de longs fichiers audio à partir d'un document." }
        d: { en: "Fast transcription returns the text of an audio file synchronously; it doesn't synthesize speech.", fr: "La transcription rapide renvoie de façon synchrone le texte d'un fichier audio ; elle ne synthétise pas de parole." }
    references:
      - title: Batch synthesis API for text to speech
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-synthesis

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-42-02
    objective: "4.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum trained a custom speech model for the vocabulary of its field technicians and deployed it to a custom endpoint. A voice agent recognizes the technicians' speech with a `SpeechRecognizer` of the Speech SDK.

        Which property of the `SpeechConfig` object should the code set so that the recognizer uses the custom model?
      fr: |
        Adatum a entraîné un modèle de reconnaissance vocale personnalisée pour le vocabulaire de ses techniciens de terrain et l'a déployé sur un point de terminaison personnalisé. Un agent vocal reconnaît la parole des techniciens avec un `SpeechRecognizer` du SDK Speech.

        Quelle propriété de l'objet `SpeechConfig` le code doit-il définir pour que la reconnaissance utilise le modèle personnalisé ?
    body:
      options:
        - { id: a, text: "`speech_recognition_language`" }
        - { id: b, text: "`endpoint_id`" }
        - { id: c, text: "`speech_synthesis_voice_name`" }
        - { id: d, text: "`output_format`" }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Except for batch transcription, a custom speech model is used through its deployed endpoint. In the Speech SDK, you set the ID of that endpoint in the `endpoint_id` property of `SpeechConfig`, and the recognizer created from this configuration uses the custom model.
        fr: |
          Sauf pour la transcription par lots, un modèle de reconnaissance vocale personnalisée s'utilise via son point de terminaison déployé. Dans le SDK Speech, vous définissez l'ID de ce point de terminaison dans la propriété `endpoint_id` de `SpeechConfig`, et la reconnaissance créée à partir de cette configuration utilise le modèle personnalisé.
      options:
        a: { en: "`speech_recognition_language` sets the locale of the speech, such as en-US; it doesn't select a custom model.", fr: "`speech_recognition_language` définit les paramètres régionaux de la parole, comme en-US ; il ne sélectionne pas de modèle personnalisé." }
        c: { en: "`speech_synthesis_voice_name` chooses the voice of text to speech, not the recognition model.", fr: "`speech_synthesis_voice_name` choisit la voix de la synthèse vocale, pas le modèle de reconnaissance." }
        d: { en: "`output_format` chooses between simple and detailed recognition results; it doesn't change the model.", fr: "`output_format` choisit entre des résultats de reconnaissance simples ou détaillés ; il ne change pas le modèle." }
    references:
      - title: How to recognize speech
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech?pivots=programming-language-python
      - title: Custom speech overview
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-42-03
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso Telecom records its support calls as stereo WAV files: the support engineer is on channel 0 and the customer on channel 1. Every night, a job sends the day's recordings to Azure Speech, and a coaching agent reads the transcripts the next morning. The agent must know which participant said each sentence.

        What should the job do?
      fr: |
        Contoso Telecom enregistre ses appels au support sous forme de fichiers WAV stéréo : l'ingénieur du support est sur le canal 0 et le client sur le canal 1. Chaque nuit, un travail envoie les enregistrements de la journée à Azure Speech, et un agent de coaching lit les transcriptions le lendemain matin. L'agent doit savoir quel participant a dit chaque phrase.

        Que doit faire le travail ?
    body:
      options:
        - { id: a, text: { en: "Submit a batch transcription with diarization enabled and two speakers, and use the speaker label of each phrase.", fr: "Soumettre une transcription par lots avec la diarisation activée et deux interlocuteurs, et utiliser l'étiquette d'interlocuteur de chaque phrase." } }
        - { id: b, text: { en: "Submit a batch transcription that processes channels 0 and 1, and use the channel of each phrase to identify the participant.", fr: "Soumettre une transcription par lots qui traite les canaux 0 et 1, et utiliser le canal de chaque phrase pour identifier le participant." } }
        - { id: c, text: { en: "Submit a batch transcription with language identification enabled, and use the locale of each phrase to identify the participant.", fr: "Soumettre une transcription par lots avec l'identification de la langue activée, et utiliser les paramètres régionaux de chaque phrase pour identifier le participant." } }
        - { id: d, text: { en: "Recognize each file with single-shot recognition in the Speech SDK, and treat each recognized utterance as one participant turn.", fr: "Reconnaître chaque fichier avec la reconnaissance ponctuelle du SDK Speech, et traiter chaque énoncé reconnu comme un tour de parole d'un participant." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Batch transcription fits recordings that are processed at night and read later. Its `channels` property lists the audio channels to transcribe, and channels 0 and 1 are transcribed by default, so each phrase comes from a known channel, which here is a known participant. Diarization isn't needed and isn't available for stereo audio.
        fr: |
          La transcription par lots convient aux enregistrements traités la nuit et lus plus tard. Sa propriété `channels` liste les canaux audio à transcrire, et les canaux 0 et 1 sont transcrits par défaut : chaque phrase provient donc d'un canal connu, c'est-à-dire ici d'un participant connu. La diarisation n'est pas nécessaire et n'est pas disponible pour l'audio stéréo.
      options:
        a: { en: "Diarization works on mono audio only; it isn't available for these stereo recordings, where the channels already separate the participants.", fr: "La diarisation ne fonctionne que sur l'audio mono ; elle n'est pas disponible pour ces enregistrements stéréo, où les canaux séparent déjà les participants." }
        c: { en: "Language identification detects the spoken language; both participants can speak the same language, so it doesn't identify them.", fr: "L'identification de la langue détecte la langue parlée ; les deux participants peuvent parler la même langue : elle ne les identifie donc pas." }
        d: { en: "Single-shot recognition returns only the first utterance, and an utterance boundary says nothing about who is speaking.", fr: "La reconnaissance ponctuelle ne renvoie que le premier énoncé, et la limite d'un énoncé n'indique pas qui parle." }
    references:
      - title: Create a batch transcription
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-42-04
    objective: "4.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware runs a voice agent in Azure Container Apps. The agent uses the Speech SDK for speech to text and text to speech, with a Speech resource that has a custom domain name. The container app has a system-assigned managed identity.

        The security team requires that no Speech key is used or stored anywhere, including in a vault. The solution must follow the principle of least privilege.

        What should you do?
      fr: |
        Litware exécute un agent vocal dans Azure Container Apps. L'agent utilise le SDK Speech pour la reconnaissance vocale et la synthèse vocale, avec une ressource Speech dotée d'un nom de domaine personnalisé. L'application conteneur dispose d'une identité managée affectée par le système.

        L'équipe de sécurité exige qu'aucune clé Speech ne soit utilisée ni stockée nulle part, y compris dans un coffre. La solution doit respecter le principe du moindre privilège.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Store the Speech key in Azure Key Vault, and let the managed identity read it when the agent starts.", fr: "Stocker la clé Speech dans Azure Key Vault, et laisser l'identité managée la lire au démarrage de l'agent." } }
        - { id: b, text: { en: "Exchange the Speech key for an authorization token when the agent starts, and pass the token to `SpeechConfig`.", fr: "Échanger la clé Speech contre un jeton d'autorisation au démarrage de l'agent, et passer le jeton à `SpeechConfig`." } }
        - { id: c, text: { en: "Assign the Reader role to the managed identity, and pass a token credential and the custom domain endpoint to `SpeechConfig`.", fr: "Attribuer le rôle Reader à l'identité managée, et passer des informations d'identification de jeton et le point de terminaison du domaine personnalisé à `SpeechConfig`." } }
        - { id: d, text: { en: "Assign the Cognitive Services Speech User role to the managed identity, and pass a token credential and the custom domain endpoint to `SpeechConfig`.", fr: "Attribuer le rôle Cognitive Services Speech User à l'identité managée, et passer des informations d'identification de jeton et le point de terminaison du domaine personnalisé à `SpeechConfig`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Microsoft Entra authentication with the Speech SDK needs a custom domain endpoint and a Speech data role, Cognitive Services Speech User or Cognitive Services Speech Contributor, for the identity. `SpeechConfig` then takes a token credential and the endpoint, so the managed identity gets tokens and no key is involved. Speech User is the smaller of the two roles.
        fr: |
          L'authentification Microsoft Entra avec le SDK Speech exige un point de terminaison de domaine personnalisé et, pour l'identité, un rôle de données Speech : Cognitive Services Speech User ou Cognitive Services Speech Contributor. `SpeechConfig` reçoit alors des informations d'identification de jeton et le point de terminaison : l'identité managée obtient des jetons et aucune clé n'intervient. Speech User est le plus restreint des deux rôles.
      options:
        a: { en: "The key would still exist and be stored in a vault, which the security team forbids.", fr: "La clé existerait toujours et serait stockée dans un coffre, ce que l'équipe de sécurité interdit." }
        b: { en: "An authorization token obtained from the key still uses the key, which the security team forbids.", fr: "Un jeton d'autorisation obtenu à partir de la clé utilise toujours la clé, ce que l'équipe de sécurité interdit." }
        c: { en: "Reader is a control plane role; it doesn't allow calling speech to text or text to speech.", fr: "Reader est un rôle du plan de contrôle ; il ne permet pas d'appeler la reconnaissance vocale ni la synthèse vocale." }
    references:
      - title: How to configure Microsoft Entra authentication
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-configure-azure-ad-auth

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-42-05
    objective: "4.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam Medical uses a `TranslationRecognizer` to translate the English speech of its trainers into French and German text live. Reviewers find that drug names are often misrecognized in the English source, while correctly recognized sentences are translated well. The team trained a custom speech model for en-US with the drug names and deployed it to a custom endpoint.

        You need to fix the recognition errors with the least development effort. What should you do?
      fr: |
        Fabrikam Medical utilise un `TranslationRecognizer` pour traduire en direct la parole anglaise de ses formateurs en texte français et allemand. Les relecteurs constatent que les noms de médicaments sont souvent mal reconnus dans la source anglaise, alors que les phrases bien reconnues sont bien traduites. L'équipe a entraîné un modèle de reconnaissance vocale personnalisée pour en-US avec les noms de médicaments et l'a déployé sur un point de terminaison personnalisé.

        Vous devez corriger les erreurs de reconnaissance avec un effort de développement minimal. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Replace the `TranslationRecognizer` with a `SpeechRecognizer` that uses the custom endpoint, then send each phrase to Azure Translator.", fr: "Remplacer le `TranslationRecognizer` par un `SpeechRecognizer` qui utilise le point de terminaison personnalisé, puis envoyer chaque phrase à Azure Translator." } }
        - { id: b, text: { en: "Train a Custom Translator model with the drug names, and set its category ID in the speech translation configuration.", fr: "Entraîner un modèle Custom Translator avec les noms de médicaments, et définir son ID de catégorie dans la configuration de la traduction vocale." } }
        - { id: c, text: { en: "Keep the `TranslationRecognizer`, and configure its speech translation configuration with the custom endpoint of the model.", fr: "Conserver le `TranslationRecognizer`, et configurer sa configuration de traduction vocale avec le point de terminaison personnalisé du modèle." } }
        - { id: d, text: { en: "Keep the `TranslationRecognizer`, and set `speech_recognition_language` to the locale of the custom speech model.", fr: "Conserver le `TranslationRecognizer`, et définir `speech_recognition_language` sur les paramètres régionaux du modèle personnalisé." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Custom speech models work with speech translation as well as with speech to text: the custom model improves the recognition half, and the translation half is unchanged. Pointing the existing speech translation configuration at the deployed endpoint fixes the drug names without changing the architecture.
        fr: |
          Les modèles de reconnaissance vocale personnalisée fonctionnent avec la traduction vocale comme avec la reconnaissance vocale : le modèle personnalisé améliore la partie reconnaissance, et la partie traduction ne change pas. Faire pointer la configuration de traduction vocale existante vers le point de terminaison déployé corrige les noms de médicaments sans changer l'architecture.
      options:
        a: { en: "This works, but it adds a second service and rewrites the pipeline, while speech translation can use the custom model directly.", fr: "Cela fonctionne, mais ajoute un second service et réécrit le pipeline, alors que la traduction vocale peut utiliser directement le modèle personnalisé." }
        b: { en: "Custom Translator customizes the translation step; the errors happen in the English recognition, before translation.", fr: "Custom Translator personnalise l'étape de traduction ; les erreurs se produisent dans la reconnaissance anglaise, avant la traduction." }
        d: { en: "The recognition language is already en-US; a locale doesn't select the custom model, which is identified by its endpoint.", fr: "La langue de reconnaissance est déjà en-US ; des paramètres régionaux ne sélectionnent pas le modèle personnalisé, identifié par son point de terminaison." }
    references:
      - title: Custom speech overview
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview
      - title: How to translate speech
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-42-06
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Telecom stores about 60,000 recorded support calls a month in an Azure Blob Storage container. You are designing the audio processing for two agents in Microsoft Foundry:

        - A knowledge agent must be able to search a text transcript of every call. This processing must have the lowest possible cost.
        - A quality agent reviews the calls that were escalated to a supervisor, about 500 a month. For each of them, it must decide whether the customer sounded distressed, based on the voice and not only on the words.

        Deployments of gpt-4.1 and gpt-audio-mini are available. What should you implement?
      fr: |
        Woodgrove Telecom stocke environ 60 000 enregistrements d'appels au support par mois dans un conteneur Stockage Blob Azure. Vous concevez le traitement audio pour deux agents dans Microsoft Foundry :

        - Un agent de connaissances doit pouvoir rechercher dans une transcription texte de chaque appel. Ce traitement doit avoir le coût le plus bas possible.
        - Un agent qualité examine les appels transférés à un superviseur, environ 500 par mois. Pour chacun, il doit décider si le client paraissait en détresse, d'après la voix et pas seulement d'après les mots.

        Des déploiements gpt-4.1 et gpt-audio-mini sont disponibles. Que devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "Send every recording to gpt-audio-mini as `input_audio`, and ask for a transcript and a distress verdict in each answer.", fr: "Envoyer chaque enregistrement à gpt-audio-mini en `input_audio`, et demander une transcription et un verdict de détresse dans chaque réponse." } }
        - { id: b, text: { en: "Transcribe every call with batch transcription, and send the escalated transcripts to gpt-4.1 to judge the distress.", fr: "Transcrire chaque appel par transcription par lots, et envoyer les transcriptions des appels transférés à gpt-4.1 pour juger la détresse." } }
        - { id: c, text: { en: "Stream every recording to a gpt-realtime deployment through the Realtime API, and keep the transcripts of the sessions.", fr: "Diffuser chaque enregistrement vers un déploiement gpt-realtime via l'API Realtime, et conserver les transcriptions des sessions." } }
        - { id: d, text: { en: "Transcribe every call with batch transcription, and send only the escalated recordings to gpt-audio-mini as `input_audio`.", fr: "Transcrire chaque appel par transcription par lots, et n'envoyer que les enregistrements des appels transférés à gpt-audio-mini en `input_audio`." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A searchable transcript only needs the words, and batch transcription is the asynchronous, high-volume path for stored recordings. A distress verdict based on the voice needs the audio itself, so only the 500 escalated recordings go to an audio-capable model, as an `input_audio` content part. Each requirement uses the cheapest path that meets it.
        fr: |
          Une transcription consultable n'a besoin que des mots, et la transcription par lots est la voie asynchrone à gros volume pour les enregistrements stockés. Un verdict de détresse fondé sur la voix exige l'audio lui-même : seuls les 500 enregistrements des appels transférés vont donc à un modèle compatible avec l'audio, sous forme de partie de contenu `input_audio`. Chaque exigence utilise la voie la moins coûteuse qui la satisfait.
      options:
        a: { en: "Sending 60,000 calls a month to an audio model costs far more than batch transcription for a need that only requires the words.", fr: "Envoyer 60 000 appels par mois à un modèle audio coûte bien plus cher que la transcription par lots pour un besoin qui n'exige que les mots." }
        b: { en: "A transcript loses the tone of voice, so gpt-4.1 can judge only the words, not whether the customer sounded distressed.", fr: "Une transcription perd le ton de la voix : gpt-4.1 ne peut juger que les mots, pas si le client paraissait en détresse." }
        c: { en: "The Realtime API is built for live, low-latency conversations; streaming stored files through it is costly and doesn't produce the verdicts.", fr: "L'API Realtime est conçue pour des conversations en direct à faible latence ; y diffuser des fichiers stockés est coûteux et ne produit pas les verdicts." }
    references:
      - title: Speech to Text Overview
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
      - title: Quickstart - Get started with Azure OpenAI audio generation
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-42-07
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys is building a voice assistant for a kiosk in a busy shopping mall. The kiosk connects to the Voice Live API with `model=gpt-realtime` and plays answers through a loudspeaker. The requirements are:

        - Shoppers speak to the kiosk without a headset, and the kiosk has no information about individual speakers. Background noise must be suppressed.
        - The product names "Tailspin Turbo" and "SkyRacer X2" must be recognized by using a phrase list.
        - The assistant must speak with the Azure HD voice `en-US-Ava:DragonHDLatestNeural`.

        How should you complete the session configuration? To answer, select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys crée un assistant vocal pour une borne dans un centre commercial très fréquenté. La borne se connecte à l'API Voice Live avec `model=gpt-realtime` et diffuse les réponses par un haut-parleur. Les exigences sont les suivantes :

        - Les clients parlent à la borne sans casque, et la borne ne dispose d'aucune information sur chaque interlocuteur. Le bruit de fond doit être supprimé.
        - Les noms de produits « Tailspin Turbo » et « SkyRacer X2 » doivent être reconnus à l'aide d'une liste d'expressions.
        - L'assistant doit parler avec la voix Azure HD `en-US-Ava:DragonHDLatestNeural`.

        Comment devez-vous compléter la configuration de la session ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "type": "session.update",
          "session": {
            "instructions": "You are the Tailspin Toys store assistant. Keep answers short.",
            "turn_detection": { "type": "azure_semantic_vad_multilingual" },
            "input_audio_noise_reduction": { "type": "[[noise]]" },
            "input_audio_echo_cancellation": { "type": "server_echo_cancellation" },
            "input_audio_transcription": {
              "model": "[[asr]]",
              "phrase_list": ["Tailspin Turbo", "SkyRacer X2"]
            },
            "voice": {
              "name": "en-US-Ava:DragonHDLatestNeural",
              "type": "[[voice]]",
              "temperature": 0.8
            }
          }
        }
      slots:
        - id: noise
          options:
            - { id: headset, text: azure_deep_noise_suppression_headset }
            - { id: personal, text: azure_personal_noise_suppression }
            - { id: deep, text: azure_deep_noise_suppression }
        - id: asr
          options:
            - { id: gpt4o, text: gpt-4o-transcribe }
            - { id: azspeech, text: azure-speech }
            - { id: whisper, text: whisper-1 }
        - id: voice
          options:
            - { id: standard, text: azure-standard }
            - { id: custom, text: azure-custom }
            - { id: openai, text: openai }
    answer:
      values: { noise: deep, asr: azspeech, voice: standard }
    explanation:
      correct:
        en: |
          `azure_deep_noise_suppression` is the general-purpose noise suppression, which fits a shared kiosk microphone. `azure-speech` supports phrase lists and works with gpt-realtime as well as with non-multimodal models. The Ava HD voice is an Azure standard voice, so its type is `azure-standard`; `temperature` applies to HD voices.
        fr: |
          `azure_deep_noise_suppression` est la suppression du bruit à usage général, adaptée au micro partagé d'une borne. `azure-speech` prend en charge les listes d'expressions et fonctionne avec gpt-realtime comme avec les modèles non multimodaux. La voix HD Ava est une voix Azure standard : son type est `azure-standard` ; `temperature` s'applique aux voix HD.
      options:
        noise:
          en: |
            The headset variant keeps the voice of a close speaker wearing a headset, and personal noise suppression needs target-speaker information, which the kiosk doesn't have.
          fr: |
            La variante headset conserve la voix d'un interlocuteur proche équipé d'un casque, et la suppression personnelle du bruit exige des informations sur l'interlocuteur cible, que la borne n'a pas.
        asr:
          en: |
            `gpt-4o-transcribe` and `whisper-1` are compatible with gpt-realtime, but they take an optional prompt, not a phrase list.
          fr: |
            `gpt-4o-transcribe` et `whisper-1` sont compatibles avec gpt-realtime, mais ils acceptent une invite facultative, pas une liste d'expressions.
        voice:
          en: |
            `azure-custom` is for a custom voice deployment, and `openai` selects an OpenAI voice, not an Azure HD voice.
          fr: |
            `azure-custom` sert à un déploiement de voix personnalisée, et `openai` sélectionne une voix OpenAI, pas une voix Azure HD.
    references:
      - title: How to use the Voice Live API
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-42-08
    objective: "4.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Northwind Insurance receives voicemails from policyholders as WAV files of less than two minutes. A claims workflow receives a verdict for each voicemail as a JSON object with three properties: `priority` (Low, Normal or Urgent), `distressed` (true or false) and `reason` (a string). The workflow rejects every payload that doesn't match this schema.

        The `distressed` value must be based on the policyholder's tone of voice. Deployments of gpt-audio-mini and gpt-4.1 are available.

        What should you implement?
      fr: |
        Northwind Insurance reçoit les messages vocaux des assurés sous forme de fichiers WAV de moins de deux minutes. Un workflow de sinistres reçoit un verdict pour chaque message vocal sous la forme d'un objet JSON à trois propriétés : `priority` (Low, Normal ou Urgent), `distressed` (true ou false) et `reason` (une chaîne). Le workflow rejette toute charge utile qui ne respecte pas ce schéma.

        La valeur de `distressed` doit être fondée sur le ton de la voix de l'assuré. Des déploiements gpt-audio-mini et gpt-4.1 sont disponibles.

        Que devez-vous implémenter ?
    body:
      options:
        - { id: a, text: { en: "Send the voicemail to gpt-audio-mini as `input_audio`, with a `response_format` of type `json_schema` and `strict` set to true.", fr: "Envoyer le message vocal à gpt-audio-mini en `input_audio`, avec un `response_format` de type `json_schema` et `strict` à true." } }
        - { id: b, text: { en: "Transcribe the voicemail with fast transcription, then send the transcript to gpt-4.1 with strict structured outputs.", fr: "Transcrire le message vocal par transcription rapide, puis envoyer la transcription à gpt-4.1 avec des sorties structurées strictes." } }
        - { id: c, text: { en: "Send the voicemail to gpt-audio-mini for a text assessment, then send the assessment to gpt-4.1 with strict structured outputs.", fr: "Envoyer le message vocal à gpt-audio-mini pour une évaluation en texte, puis envoyer l'évaluation à gpt-4.1 avec des sorties structurées strictes." } }
        - { id: d, text: { en: "Send the voicemail to gpt-audio-mini as `input_audio`, with a `response_format` of type `json_object` and the schema in the prompt.", fr: "Envoyer le message vocal à gpt-audio-mini en `input_audio`, avec un `response_format` de type `json_object` et le schéma dans l'invite." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Only a model that receives the audio can judge the tone of voice, but structured outputs aren't supported with gpt-audio and gpt-audio-mini. The audio model therefore describes the tone and content in text, and gpt-4.1 turns that assessment into a verdict with strict structured outputs, which guarantees that every payload matches the schema.
        fr: |
          Seul un modèle qui reçoit l'audio peut juger le ton de la voix, mais les sorties structurées ne sont pas prises en charge avec gpt-audio et gpt-audio-mini. Le modèle audio décrit donc le ton et le contenu en texte, et gpt-4.1 transforme cette évaluation en verdict avec des sorties structurées strictes, ce qui garantit que chaque charge utile respecte le schéma.
      options:
        a: { en: "Structured outputs aren't supported with gpt-audio and gpt-audio-mini, so this request can't guarantee the schema.", fr: "Les sorties structurées ne sont pas prises en charge avec gpt-audio et gpt-audio-mini : cette requête ne peut pas garantir le schéma." }
        b: { en: "The transcript keeps the words but loses the tone of voice, so the distressed value would be based on the words only.", fr: "La transcription conserve les mots mais perd le ton de la voix : la valeur distressed serait fondée sur les mots uniquement." }
        d: { en: "JSON mode, where available, guarantees valid JSON but not adherence to a schema, so the workflow can still reject payloads.", fr: "Le mode JSON, là où il est disponible, garantit un JSON valide mais pas le respect d'un schéma : le workflow peut toujours rejeter des charges utiles." }
    references:
      - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
      - title: Quickstart - Get started with Azure OpenAI audio generation
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-42-09
    objective: "4.2.4"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso Events is building an agent that translates a presenter's English speech. The code is shown in the Code exhibit. A custom speech model for en-US, trained with Contoso's product names, is deployed to a custom endpoint but isn't referenced in the code yet.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso Events crée un agent qui traduit la parole anglaise d'un présentateur. Le code figure dans la pièce Code. Un modèle de reconnaissance vocale personnalisée pour en-US, entraîné avec les noms de produits de Contoso, est déployé sur un point de terminaison personnalisé mais n'est pas encore référencé dans le code.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: code
        title: { en: "Code", fr: "Code" }
        body: |
          ```python
          translation_config = speechsdk.translation.SpeechTranslationConfig(
              subscription=key, endpoint=endpoint)
          translation_config.speech_recognition_language = "en-US"
          translation_config.add_target_language("fr")
          translation_config.add_target_language("de")
          translation_config.voice_name = "fr-FR-DeniseNeural"

          recognizer = speechsdk.translation.TranslationRecognizer(
              translation_config=translation_config)
          recognizer.synthesizing.connect(lambda evt: play(evt.result.audio))
          result = recognizer.recognize_once_async().get()
          ```
    body:
      statements:
        - id: s1
          text: { en: "After a successful recognition, the code can read the German text in `result.translations[\"de-DE\"]`.", fr: "Après une reconnaissance réussie, le code peut lire le texte allemand dans `result.translations[\"de-DE\"]`." }
        - id: s2
          text: { en: "This configuration is a supported way to play the French translation aloud through the `synthesizing` event.", fr: "Cette configuration est un moyen pris en charge de lire à voix haute la traduction française via l'événement `synthesizing`." }
        - id: s3
          text: { en: "The custom speech model can be used by this `TranslationRecognizer` to improve the recognition of the product names.", fr: "Le modèle de reconnaissance vocale personnalisée peut être utilisé par ce `TranslationRecognizer` pour améliorer la reconnaissance des noms de produits." }
    answer:
      values: { s1: false, s2: false, s3: true }
    explanation:
      correct:
        en: |
          `result.translations` is keyed by the target language codes passed to `add_target_language`, here `fr` and `de`, not by locales. Event-based synthesis with `voice_name` works only with a single target language; with two targets, each translation must be synthesized separately with a `SpeechSynthesizer` and a voice per language. Custom speech models work with speech translation for the recognition half.
        fr: |
          `result.translations` est indexé par les codes de langue cible passés à `add_target_language`, ici `fr` et `de`, pas par des paramètres régionaux. La synthèse événementielle avec `voice_name` ne fonctionne qu'avec une seule langue cible ; avec deux cibles, chaque traduction doit être synthétisée séparément avec un `SpeechSynthesizer` et une voix par langue. Les modèles de reconnaissance vocale personnalisée fonctionnent avec la traduction vocale pour la partie reconnaissance.
      options:
        s1: { en: "The key is the code used in `add_target_language`, so the German text is in `result.translations[\"de\"]`.", fr: "La clé est le code utilisé dans `add_target_language` : le texte allemand se trouve dans `result.translations[\"de\"]`." }
        s2: { en: "The `synthesizing` event is supported only with one target language; remove the German target or synthesize each text yourself.", fr: "L'événement `synthesizing` n'est pris en charge qu'avec une seule langue cible ; retirez la cible allemande ou synthétisez vous-même chaque texte." }
    references:
      - title: How to translate speech
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python
      - title: Custom speech overview
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-42-10
    objective: "4.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Litware stores about 3,000 recorded support calls a day in an Azure Blob Storage container. Each call is in either English or Spanish, and the language of a file isn't known in advance. Litware trained a custom speech model for en-US and another for es-US, both with its product names, and deployed each model to a custom endpoint for its live voice agent.

        A nightly job must transcribe every call with the custom model of the language spoken in the call. The language must be detected automatically, without sorting the files by hand.

        What should the job do?
      fr: |
        Litware stocke environ 3 000 enregistrements d'appels au support par jour dans un conteneur Stockage Blob Azure. Chaque appel est en anglais ou en espagnol, et la langue d'un fichier n'est pas connue à l'avance. Litware a entraîné un modèle de reconnaissance vocale personnalisée pour en-US et un autre pour es-US, tous deux avec ses noms de produits, et a déployé chaque modèle sur un point de terminaison personnalisé pour son agent vocal en direct.

        Un travail de nuit doit transcrire chaque appel avec le modèle personnalisé de la langue parlée dans l'appel. La langue doit être détectée automatiquement, sans trier les fichiers à la main.

        Que doit faire le travail ?
    body:
      options:
        - { id: a, text: { en: "Submit a batch transcription with `model` set to the en-US custom model and en-US and es-US as candidate locales.", fr: "Soumettre une transcription par lots avec `model` défini sur le modèle personnalisé en-US, et en-US et es-US comme paramètres régionaux candidats." } }
        - { id: b, text: { en: "Submit a batch transcription without `model`, and set en-US and es-US as candidate locales of language identification.", fr: "Soumettre une transcription par lots sans `model`, et définir en-US et es-US comme paramètres régionaux candidats de l'identification de la langue." } }
        - { id: c, text: { en: "Submit two batch transcriptions of all the files, one with each custom model, and keep the result with the higher confidence.", fr: "Soumettre deux transcriptions par lots de tous les fichiers, une avec chaque modèle personnalisé, et garder le résultat de confiance la plus élevée." } }
        - { id: d, text: { en: "Recognize each file with the Speech SDK and language identification, mapping en-US and es-US to their custom endpoints.", fr: "Reconnaître chaque fichier avec le SDK Speech et l'identification de la langue, en associant en-US et es-US à leurs points de terminaison personnalisés." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Language identification with custom models is supported only by real-time speech to text and speech translation. In the Speech SDK, each candidate locale of `AutoDetectSourceLanguageConfig` can be a `SourceLanguageConfig` with the endpoint ID of its custom model, so each file is recognized with the model of the detected language. The endpoints are already deployed for the live agent.
        fr: |
          L'identification de la langue avec des modèles personnalisés n'est prise en charge que par la reconnaissance vocale en temps réel et la traduction vocale. Dans le SDK Speech, chaque paramètre régional candidat d'`AutoDetectSourceLanguageConfig` peut être un `SourceLanguageConfig` avec l'ID de point de terminaison de son modèle personnalisé : chaque fichier est donc reconnu avec le modèle de la langue détectée. Les points de terminaison sont déjà déployés pour l'agent en direct.
      options:
        a: { en: "Batch transcription supports language identification only with base models; with a custom model, it falls back to base models.", fr: "La transcription par lots ne prend en charge l'identification de la langue qu'avec les modèles de base ; avec un modèle personnalisé, elle se rabat sur les modèles de base." }
        b: { en: "Without `model`, batch transcription uses the base models, so the product names that the custom models learned aren't used.", fr: "Sans `model`, la transcription par lots utilise les modèles de base : les noms de produits appris par les modèles personnalisés ne sont pas utilisés." }
        c: { en: "Transcribing every file twice doubles the cost, and a higher confidence score doesn't prove which language was spoken.", fr: "Transcrire chaque fichier deux fois double le coût, et un score de confiance plus élevé ne prouve pas quelle langue était parlée." }
    references:
      - title: Implement language identification
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/language-identification?pivots=programming-language-python
      - title: Create a batch transcription
        url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create
