chapter: 14-responsible-ai
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-14-01
    objective: "1.4.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has a model deployment named **chat-kids** in Microsoft Foundry for a children's game. Completions that contain violent content, whatever its severity, must never reach the players.

        What should you configure?
      fr: |
        Wingtip Toys dispose d'un déploiement de modèle nommé **chat-kids** dans Microsoft Foundry pour un jeu destiné aux enfants. Les complétions qui contiennent du contenu violent, quelle que soit sa gravité, ne doivent jamais atteindre les joueurs.

        Que devez-vous configurer ?
    body:
      options:
        - { id: a, text: { en: "A custom guardrail for chat-kids whose Violence control uses the Low blocking level", fr: "Un garde-fou personnalisé pour chat-kids dont le contrôle Violence utilise le niveau de blocage Low" } }
        - { id: b, text: { en: "A Violence evaluator that scores a test dataset of chat-kids responses before each release", fr: "Un évaluateur Violence qui note un jeu de données de test de réponses de chat-kids avant chaque mise en production" } }
        - { id: c, text: { en: "A custom guardrail for chat-kids whose Violence control uses the High blocking level", fr: "Un garde-fou personnalisé pour chat-kids dont le contrôle Violence utilise le niveau de blocage High" } }
        - { id: d, text: { en: "An AI Red Teaming Agent scan of chat-kids that includes the Violent Content risk category", fr: "Une analyse AI Red Teaming Agent de chat-kids qui inclut la catégorie de risque Violent Content" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Only a guardrail acts on each request at run time and can stop a completion. The High blocking level is the most restrictive: it blocks low-, medium- and high-severity content, so violent completions of any severity are blocked.
        fr: |
          Seul un garde-fou agit sur chaque requête à l'exécution et peut arrêter une complétion. Le niveau de blocage High est le plus restrictif : il bloque le contenu de gravité faible, moyenne et élevée ; les complétions violentes sont donc bloquées quelle que soit leur gravité.
      options:
        a: { en: "Low is the least restrictive level: it blocks high-severity content only, so low- and medium-severity violence still reaches the players.", fr: "Low est le niveau le moins restrictif : il ne bloque que le contenu de gravité élevée ; la violence de gravité faible ou moyenne atteint donc encore les joueurs." }
        b: { en: "An evaluator measures a set of outputs and produces scores; it blocks nothing at run time.", fr: "Un évaluateur mesure un ensemble de sorties et produit des scores ; il ne bloque rien à l'exécution." }
        d: { en: "Red teaming finds weaknesses before release; it doesn't enforce any limit on production requests.", fr: "Le red teaming trouve les faiblesses avant la mise en production ; il n'impose aucune limite aux requêtes de production." }
    references:
      - title: Guardrails and controls overview in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-14-02
    objective: "1.4.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso runs a safety evaluation of 500 responses of its assistant in Microsoft Foundry with the Hate and Unfairness and Violence evaluators. The report shows a defect rate for each evaluator.

        What does the defect rate represent?
      fr: |
        Contoso exécute une évaluation de sécurité de 500 réponses de son assistant dans Microsoft Foundry avec les évaluateurs Hate and Unfairness et Violence. Le rapport affiche un taux de défauts pour chaque évaluateur.

        Que représente le taux de défauts ?
    body:
      options:
        - { id: a, text: { en: "The percentage of adversarial attacks that produced a harmful response", fr: "Le pourcentage d'attaques adverses qui ont produit une réponse nuisible" } }
        - { id: b, text: { en: "The average severity score of the responses, on the scale of 0 to 7", fr: "Le score de gravité moyen des réponses, sur l'échelle de 0 à 7" } }
        - { id: c, text: { en: "The percentage of requests that a guardrail blocked during the run", fr: "Le pourcentage de requêtes qu'un garde-fou a bloquées pendant l'exécution" } }
        - { id: d, text: { en: "The percentage of responses in which undesired content was detected", fr: "Le pourcentage de réponses dans lesquelles du contenu indésirable a été détecté" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          A safety evaluation computes an aggregate defect rate: the percentage of responses in which the evaluator detected undesired content. For the content evaluators, a response is a defect when its 0–7 severity score is above the threshold (3 by default).
        fr: |
          Une évaluation de sécurité calcule un taux de défauts agrégé : le pourcentage de réponses dans lesquelles l'évaluateur a détecté du contenu indésirable. Pour les évaluateurs de contenu, une réponse est un défaut quand son score de gravité de 0 à 7 dépasse le seuil (3 par défaut).
      options:
        a: { en: "That's the Attack Success Rate (ASR) reported by the AI Red Teaming Agent, not the defect rate of an evaluation.", fr: "C'est le taux de réussite des attaques (Attack Success Rate, ASR) rapporté par AI Red Teaming Agent, pas le taux de défauts d'une évaluation." }
        b: { en: "The severity score is given per response; the defect rate is a percentage of responses, not an average score.", fr: "Le score de gravité est donné par réponse ; le taux de défauts est un pourcentage de réponses, pas un score moyen." }
        c: { en: "Evaluators score responses; they don't block requests, and the defect rate doesn't count guardrail decisions.", fr: "Les évaluateurs notent des réponses ; ils ne bloquent pas de requêtes, et le taux de défauts ne compte pas les décisions des garde-fous." }
    references:
      - title: Risk and Safety Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-14-03
    objective: "1.4.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a **gpt-5-mini** deployment in Azure OpenAI in Microsoft Foundry for an internal assistant. The code names of three products that aren't announced yet must be blocked wherever they appear, both in prompts and in completions. The other controls of the deployment's guardrail must stay unchanged.

        What should you do?
      fr: |
        Northwind Traders dispose d'un déploiement **gpt-5-mini** dans Azure OpenAI dans Microsoft Foundry pour un assistant interne. Les noms de code de trois produits qui ne sont pas encore annoncés doivent être bloqués partout où ils apparaissent, dans les invites comme dans les complétions. Les autres contrôles du garde-fou du déploiement doivent rester inchangés.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Add a Protected material for text control to the output of the guardrail of the deployment.", fr: "Ajouter un contrôle Protected material for text sur la sortie du garde-fou du déploiement." } }
        - { id: b, text: { en: "Create a blocklist that contains the three code names, and use it for input and output filtering.", fr: "Créer une liste de blocage (blocklist) qui contient les trois noms de code, et l'utiliser pour le filtrage des entrées et des sorties." } }
        - { id: c, text: { en: "Set the four harm controls of the guardrail of the deployment to the High blocking level.", fr: "Définir les quatre contrôles de préjudice du garde-fou du déploiement sur le niveau de blocage High." } }
        - { id: d, text: { en: "Add the three code names to the system message with an instruction to never write them.", fr: "Ajouter les trois noms de code au message système avec l'instruction de ne jamais les écrire." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Custom blocklists filter terms specific to your use case, such as internal project names or competitor names, which the classification models don't target. A blocklist can be applied to prompts (`promptBlocklists`) and to completions (`completionBlocklists`) of a guardrail, and blocklists are supported for Azure OpenAI models such as gpt-5-mini.
        fr: |
          Les listes de blocage personnalisées filtrent des termes propres à votre cas d'usage, comme des noms de projets internes ou de concurrents, que les modèles de classification ne ciblent pas. Une liste de blocage peut s'appliquer aux invites (`promptBlocklists`) et aux complétions (`completionBlocklists`) d'un garde-fou, et les listes de blocage sont prises en charge pour les modèles Azure OpenAI comme gpt-5-mini.
      options:
        a: { en: "Protected material for text detects known copyrighted text, such as lyrics or articles, not arbitrary terms that you choose, and only on the output.", fr: "Protected material for text détecte des textes connus protégés par le droit d'auteur, comme des paroles ou des articles, pas des termes que vous choisissez, et seulement sur la sortie." }
        c: { en: "The harm controls classify hate, sexual, violence and self-harm content; a product code name is none of these, and the change would alter the other controls.", fr: "Les contrôles de préjudice classent le contenu haineux, sexuel, violent ou d'automutilation ; un nom de code de produit n'en fait pas partie, et le changement modifierait les autres contrôles." }
        d: { en: "An instruction doesn't block anything: users can still type the names, and nothing enforces the rule on completions.", fr: "Une instruction ne bloque rien : les utilisateurs peuvent encore taper les noms, et rien n'impose la règle aux complétions." }
    references:
      - title: How to use block lists in Microsoft Foundry models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/use-blocklists

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-14-04
    objective: "1.4.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Lamna Healthcare runs prompt agents in Foundry Agent Service. An Application Insights resource is connected to the project, and server-side traces of every run, including the tool calls, appear in the Foundry portal.

        Auditors require that the trace of any run can be reviewed for two years after the run.

        What should you do?
      fr: |
        Lamna Healthcare exécute des agents d'invite dans Foundry Agent Service. Une ressource Application Insights est connectée au projet, et les traces côté serveur de chaque exécution, appels d'outils compris, apparaissent dans le portail Foundry.

        Les auditeurs exigent que la trace de toute exécution puisse être consultée pendant deux ans après l'exécution.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a new version of each agent every month, so that the versions keep the history of their runs.", fr: "Créer une nouvelle version de chaque agent chaque mois, afin que les versions conservent l'historique de leurs exécutions." } }
        - { id: b, text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true in the application that calls the agents.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true dans l'application qui appelle les agents." } }
        - { id: c, text: { en: "Add a lifecycle management rule that keeps the run data for two years in the storage account of the project.", fr: "Ajouter une règle de gestion du cycle de vie qui conserve les données d'exécution pendant deux ans dans le compte de stockage du projet." } }
        - { id: d, text: { en: "Set the data retention of the Application Insights resource and of its Log Analytics workspace accordingly.", fr: "Définir en conséquence la rétention des données de la ressource Application Insights et de son espace de travail Log Analytics." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Foundry stores traces in the Application Insights resource connected to the project, and their retention follows the Application Insights and Log Analytics configuration. Out of the box, the portal gives access to traces for the past 90 days; keeping them for two years is a retention setting of the workspace that holds them.
        fr: |
          Foundry stocke les traces dans la ressource Application Insights connectée au projet, et leur rétention suit la configuration d'Application Insights et de Log Analytics. Par défaut, le portail donne accès aux traces des 90 derniers jours ; les conserver deux ans relève d'un paramètre de rétention de l'espace de travail qui les contient.
      options:
        a: { en: "An agent version is a snapshot of the definition (instructions, tools); it doesn't store the traces of the runs.", fr: "Une version d'agent est un instantané de la définition (instructions, outils) ; elle ne stocke pas les traces des exécutions." }
        b: { en: "This variable controls whether client-side traces record message content; it doesn't change how long traces are kept.", fr: "Cette variable détermine si les traces côté client enregistrent le contenu des messages ; elle ne change pas la durée de conservation des traces." }
        c: { en: "Traces aren't stored in the project's storage account but in Application Insights, so a blob lifecycle rule doesn't apply to them.", fr: "Les traces ne sont pas stockées dans le compte de stockage du projet mais dans Application Insights : une règle de cycle de vie des objets blob ne s'y applique pas." }
    references:
      - title: Set Up Tracing for AI Agents in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
      - title: Agent tracing overview - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/observability/concepts/trace-agent-concept

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-14-05
    objective: "1.4.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso builds an agent in Foundry Agent Service. The agent has a function tool named `issue_refund`, implemented in the company's order application, which calls the agent through the Foundry SDK.

        A supervisor must review the customer and the amount of each refund, and confirm it, before any money is returned.

        What should you do?
      fr: |
        Contoso crée un agent dans Foundry Agent Service. L'agent dispose d'un outil de fonction nommé `issue_refund`, implémenté dans l'application de commandes de l'entreprise, qui appelle l'agent au moyen du SDK Foundry.

        Un superviseur doit vérifier le client et le montant de chaque remboursement, puis le confirmer, avant que de l'argent soit rendu.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `require_approval` to `\"always\"` in the definition of the `issue_refund` function tool.", fr: "Définir `require_approval` sur `\"always\"` dans la définition de l'outil de fonction `issue_refund`." } }
        - { id: b, text: { en: "In the instructions of the agent, require it to ask a supervisor before it calls `issue_refund`.", fr: "Dans les instructions de l'agent, lui imposer de demander à un superviseur avant d'appeler `issue_refund`." } }
        - { id: c, text: { en: "In the order application, show the call's arguments to a supervisor and run `issue_refund` only once confirmed.", fr: "Dans l'application de commandes, montrer les arguments de l'appel à un superviseur et n'exécuter `issue_refund` qu'après confirmation." } }
        - { id: d, text: { en: "Assign the agent a guardrail with a Task Adherence control on the Tool call intervention point.", fr: "Attribuer à l'agent un garde-fou avec un contrôle Task Adherence sur le point d'intervention Tool call." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With function calling, the agent only requests the call: your application executes the function and returns its output with the `call_id`. The confirmation therefore belongs in the application, which can show the arguments to a supervisor and run `issue_refund` only after approval, as Learn recommends for actions that change data.
        fr: |
          Avec l'appel de fonction, l'agent ne fait que demander l'appel : votre application exécute la fonction et renvoie sa sortie avec le `call_id`. La confirmation a donc sa place dans l'application, qui peut montrer les arguments à un superviseur et n'exécuter `issue_refund` qu'après approbation, comme Learn le recommande pour les actions qui modifient des données.
      options:
        a: { en: "`require_approval` is a setting of MCP tools, for calls that Agent Service makes to an MCP server; a function tool is run by your application.", fr: "`require_approval` est un paramètre des outils MCP, pour les appels qu'Agent Service fait à un serveur MCP ; un outil de fonction est exécuté par votre application." }
        b: { en: "Instructions guide the model but enforce nothing: a prompt injection or a model error can still lead to the call.", fr: "Les instructions guident le modèle mais n'imposent rien : une injection de prompt ou une erreur du modèle peut encore conduire à l'appel." }
        d: { en: "Task Adherence detects behavior that drifts from the assigned task; it doesn't ask a person to confirm a legitimate refund, and agent guardrails are in preview.", fr: "Task Adherence détecte un comportement qui s'écarte de la tâche attribuée ; il ne demande pas à une personne de confirmer un remboursement légitime, et les garde-fous d'agent sont en préversion." }
    references:
      - title: Use function calling with Microsoft Foundry agents - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-14-06
    objective: "1.4.1"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Fabrikam has a **gpt-5-mini** deployment named **chat-mail** in Microsoft Foundry. An application sends chat-mail the body of a customer email together with a question about it, in the same request.

        You are creating a custom guardrail for chat-mail. It must meet the following requirements:

        - Hate content must be blocked at every severity level, in prompts and in completions.
        - Instructions that attackers hide in the customer emails must be detected and blocked.

        How should you complete the configuration? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fabrikam dispose d'un déploiement **gpt-5-mini** nommé **chat-mail** dans Microsoft Foundry. Une application envoie à chat-mail le corps d'un e-mail client accompagné d'une question à son sujet, dans la même requête.

        Vous créez un garde-fou personnalisé pour chat-mail. Il doit répondre aux exigences suivantes :

        - Le contenu haineux doit être bloqué à tous les niveaux de gravité, dans les invites comme dans les complétions.
        - Les instructions que des attaquants cachent dans les e-mails clients doivent être détectées et bloquées.

        Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          Blocking level of the Hate control: [[hate]]

          Intervention point of the Indirect attacks control: [[point]]

          How the application inserts the email body into the request: [[doc]]
        fr: |
          Niveau de blocage du contrôle Hate : [[hate]]

          Point d'intervention du contrôle Indirect attacks : [[point]]

          Comment l'application insère le corps de l'e-mail dans la requête : [[doc]]
      slots:
        - id: hate
          options:
            - { id: off, text: "Off" }
            - { id: low, text: Low }
            - { id: medium, text: Medium }
            - { id: high, text: High }
        - id: point
          options:
            - { id: input, text: User input }
            - { id: output, text: Output }
            - { id: toolresp, text: Tool response }
        - id: doc
          options:
            - { id: system, text: { en: "As plain text in the system message", fr: "En texte brut dans le message système" } }
            - { id: b64, text: { en: "Base64-encoded, after the question", fr: "Encodé en Base64, après la question" } }
            - { id: tagged, text: { en: "JSON-escaped, between <documents> delimiters", fr: "Échappé en JSON, entre des délimiteurs <documents>" } }
            - { id: plain, text: { en: "As plain text, after the question", fr: "En texte brut, après la question" } }
    answer:
      values: { hate: high, point: input, doc: tagged }
    explanation:
      correct:
        en: |
          The High blocking level blocks low-, medium- and high-severity content, the only level that blocks every severity. For a model deployment, the email arrives in the request, so the Indirect attacks control scans the User input intervention point; Tool call and Tool response exist only for agents. Indirect attack detection analyzes content that is tagged as a document: the application must wrap the email in the `<documents>` delimiters and JSON-escape it.
        fr: |
          Le niveau de blocage High bloque le contenu de gravité faible, moyenne et élevée : c'est le seul niveau qui bloque toutes les gravités. Pour un déploiement de modèle, l'e-mail arrive dans la requête ; le contrôle Indirect attacks analyse donc le point d'intervention User input ; Tool call et Tool response n'existent que pour les agents. La détection des attaques indirectes analyse le contenu marqué comme document : l'application doit encadrer l'e-mail par les délimiteurs `<documents>` et l'échapper en JSON.
      options:
        off: { en: "Off blocks nothing.", fr: "Off ne bloque rien." }
        low: { en: "Low blocks high-severity content only.", fr: "Low ne bloque que le contenu de gravité élevée." }
        medium: { en: "Medium, the default level, lets low-severity content through.", fr: "Medium, le niveau par défaut, laisse passer le contenu de gravité faible." }
        output: { en: "The hidden instructions are in the request, not in the completion returned to the user.", fr: "Les instructions cachées se trouvent dans la requête, pas dans la complétion renvoyée à l'utilisateur." }
        toolresp: { en: "Tool response is an agent intervention point (preview); chat-mail is a model deployment that calls no tool.", fr: "Tool response est un point d'intervention des agents (préversion) ; chat-mail est un déploiement de modèle qui n'appelle aucun outil." }
        system: { en: "Untagged text isn't analyzed as a document, and putting untrusted content next to the instructions mixes it with trusted content.", fr: "Un texte non marqué n'est pas analysé comme un document, et placer du contenu non fiable à côté des instructions le mélange au contenu de confiance." }
        b64: { en: "Base64 encoding is what spotlighting (preview) does internally; the application itself must tag the email as a document.", fr: "L'encodage Base64 est ce que fait le spotlighting (préversion) en interne ; l'application doit elle-même marquer l'e-mail comme document." }
        plain: { en: "Without the document delimiters, the email is treated as part of the user prompt, and document attack detection doesn't apply to it.", fr: "Sans les délimiteurs de document, l'e-mail est traité comme une partie de l'invite utilisateur, et la détection des attaques par document ne s'y applique pas." }
    references:
      - title: Guardrails and controls overview in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
      - title: Document Embedding in Prompts (classic) - Microsoft Foundry (classic) portal
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter-document-embedding

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-14-07
    objective: "1.4.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Adatum has a prompt agent named **support-agent** in Foundry Agent Service. An Application Insights resource was connected to the project from **Build > Agents > Traces**. No code was added to the web application that calls support-agent. The marketing team also creates product images with a GPT-image-1 series deployment in Azure OpenAI.

        Before an audit, you review what these settings record.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum dispose d'un agent d'invite nommé **support-agent** dans Foundry Agent Service. Une ressource Application Insights a été connectée au projet depuis **Build > Agents > Traces**. Aucun code n'a été ajouté à l'application web qui appelle support-agent. L'équipe marketing crée aussi des images de produits avec un déploiement de la série GPT-image-1 dans Azure OpenAI.

        Avant un audit, vous examinez ce que ces paramètres enregistrent.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "The runs of support-agent are traced even though the web application has no tracing code.", fr: "Les exécutions de support-agent sont tracées bien que l'application web ne contienne aucun code de suivi." } }
        - { id: s2, text: { en: "Each text answer of support-agent carries a signed C2PA manifest, like the product images.", fr: "Chaque réponse texte de support-agent porte un manifeste C2PA signé, comme les images de produits." } }
        - { id: s3, text: { en: "The traces of support-agent show the arguments of each tool call and the result that the tool returned.", fr: "Les traces de support-agent montrent les arguments de chaque appel d'outil et le résultat renvoyé par l'outil." } }
    answer:
      values: { s1: true, s2: false, s3: true }
    explanation:
      correct:
        en: |
          Yes: Foundry enables server-side tracing automatically once Application Insights is connected; no code change is required for prompt agents. No: Content Credentials, a signed C2PA manifest, are applied to images generated by the DALL-E and GPT-image-1 series, not to text answers; for text, provenance comes from citations and traces. Yes: agent traces capture tool usage, with span attributes such as `gen_ai.tool.call.arguments` and `gen_ai.tool.call.result`, which is why traces must be protected like production logs.
        fr: |
          Oui : Foundry active automatiquement le suivi côté serveur dès qu'Application Insights est connecté ; aucune modification de code n'est nécessaire pour les agents d'invite. Non : les Content Credentials, un manifeste C2PA signé, s'appliquent aux images générées par les séries DALL-E et GPT-image-1, pas aux réponses texte ; pour le texte, la provenance vient des citations et des traces. Oui : les traces d'agent capturent l'utilisation des outils, avec des attributs d'étendue comme `gen_ai.tool.call.arguments` et `gen_ai.tool.call.result` ; c'est pourquoi les traces doivent être protégées comme des journaux de production.
    references:
      - title: Set Up Tracing for AI Agents in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
      - title: Content Credentials in Azure OpenAI (classic) - Microsoft Foundry (classic) portal
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-14-08
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Proseware evaluates a model deployment named **chat-policy** in Microsoft Foundry; chat-policy isn't an agent. Each row of the test dataset contains a user query, the policy passages that the application inserted into the prompt as context, and the response of chat-policy.

        The safety team must measure two risks on this dataset:

        - Responses that contain violent content.
        - Responses in which chat-policy followed instructions that an attacker had hidden in the policy passages.

        Which two evaluators should you include in the evaluation?

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware évalue un déploiement de modèle nommé **chat-policy** dans Microsoft Foundry ; chat-policy n'est pas un agent. Chaque ligne du jeu de données de test contient une requête utilisateur, les extraits de stratégie que l'application a insérés dans l'invite comme contexte, et la réponse de chat-policy.

        L'équipe de sécurité doit mesurer deux risques sur ce jeu de données :

        - Les réponses qui contiennent du contenu violent.
        - Les réponses dans lesquelles chat-policy a suivi des instructions qu'un attaquant avait cachées dans les extraits de stratégie.

        Quels sont les deux évaluateurs à inclure dans l'évaluation ?

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: Groundedness }
        - { id: b, text: Violence }
        - { id: c, text: Prohibited Actions }
        - { id: d, text: Indirect Attack }
        - { id: e, text: Sensitive Data Leakage }
        - { id: f, text: Task Adherence }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Violence scores harmful content on the 0–7 severity scale and works for models and agents. Indirect Attack (XPIA) checks whether the response fell for an indirect jailbreak injected through the retrieved context, and it targets models, which fits a model deployment evaluated on a dataset.
        fr: |
          Violence note le contenu nuisible sur l'échelle de gravité de 0 à 7 et fonctionne pour les modèles comme pour les agents. Indirect Attack (XPIA) vérifie si la réponse s'est laissé piéger par un jailbreak indirect injecté par le contexte récupéré, et cible les modèles, ce qui convient à un déploiement de modèle évalué sur un jeu de données.
      options:
        a: { en: "Groundedness measures whether the response is supported by the context; a response can be well grounded in passages that carry an attack.", fr: "Groundedness mesure si la réponse est étayée par le contexte ; une réponse peut être bien ancrée dans des extraits qui portent une attaque." }
        c: { en: "Prohibited Actions (preview) supports agent targets only and isn't available for dataset or model evaluations.", fr: "Prohibited Actions (préversion) ne prend en charge que les cibles de type agent et n'est pas disponible pour les évaluations de jeux de données ou de modèles." }
        e: { en: "Sensitive Data Leakage (preview) measures data exposure, applies to agent targets only, and isn't available for dataset or model evaluations.", fr: "Sensitive Data Leakage (préversion) mesure l'exposition de données, ne s'applique qu'aux cibles de type agent et n'est pas disponible pour les évaluations de jeux de données ou de modèles." }
        f: { en: "Task Adherence (preview) is an agent evaluator that checks that the agent follows its system instructions; it doesn't detect injected instructions in a model's context.", fr: "Task Adherence (préversion) est un évaluateur d'agent qui vérifie que l'agent suit ses instructions système ; il ne détecte pas les instructions injectées dans le contexte d'un modèle." }
    references:
      - title: Risk and Safety Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-14-09
    objective: "1.4.4"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Litware builds several agents in one Foundry project. The agents call MCP servers through project connections. You must choose the authentication type of each connection. The solution must follow the principle of least privilege and keep every secret out of the code and the prompts.

        Which authentication type should you use for each MCP server? To answer, drag the appropriate authentication types to the correct servers. Each authentication type may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Litware crée plusieurs agents dans un même projet Foundry. Les agents appellent des serveurs MCP au moyen de connexions de projet. Vous devez choisir le type d'authentification de chaque connexion. La solution doit respecter le principe du moindre privilège et garder tout secret hors du code et des invites.

        Quel type d'authentification devez-vous utiliser pour chaque serveur MCP ? Pour répondre, faites glisser les types d'authentification appropriés vers les serveurs correspondants. Chaque type d'authentification peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: none, text: { en: "Unauthenticated access", fr: "Accès non authentifié" } }
        - { id: keys, text: { en: "Key-based access (custom keys in the connection)", fr: "Accès par clé (clés personnalisées dans la connexion)" } }
        - { id: pmi, text: { en: "Project managed identity", fr: "Identité managée du projet" } }
        - { id: agent, text: { en: "Agent identity", fr: "Identité d'agent" } }
        - { id: oauth, text: { en: "OAuth identity passthrough", fr: "Transmission d'identité OAuth" } }
      targets:
        - { id: t1, text: { en: "A public MCP server of product documentation that accepts requests without credentials", fr: "Un serveur MCP public de documentation produit qui accepte les requêtes sans informations d'identification" } }
        - { id: t2, text: { en: "A third-party MCP server that authenticates each request with a static API key sent in a header", fr: "Un serveur MCP tiers qui authentifie chaque requête avec une clé API statique envoyée dans un en-tête" } }
        - { id: t3, text: { en: "An internal MCP server that accepts Microsoft Entra tokens; each agent must hold its own permissions, separate from those of the other agents", fr: "Un serveur MCP interne qui accepte les jetons Microsoft Entra ; chaque agent doit détenir ses propres autorisations, distinctes de celles des autres agents" } }
        - { id: t4, text: { en: "An internal MCP server that accepts Microsoft Entra tokens; all the agents of the project share the same access, granted once", fr: "Un serveur MCP interne qui accepte les jetons Microsoft Entra ; tous les agents du projet partagent le même accès, accordé une seule fois" } }
    answer:
      mapping: { t1: none, t2: keys, t3: agent, t4: pmi }
    explanation:
      correct:
        en: |
          A public server needs no authentication. A static API key is stored as a custom key in the project connection, so it never appears in code or prompts. An agent identity is a Microsoft Entra identity per agent that starts with no permissions, so each agent receives only its own role assignments. The project managed identity is shared by the connections of the project: one role assignment serves every agent.
        fr: |
          Un serveur public ne demande aucune authentification. Une clé API statique est stockée comme clé personnalisée dans la connexion de projet : elle n'apparaît jamais dans le code ni dans les invites. Une identité d'agent est une identité Microsoft Entra propre à chaque agent, qui démarre sans aucune autorisation : chaque agent ne reçoit que ses propres attributions de rôles. L'identité managée du projet est partagée par les connexions du projet : une seule attribution de rôle sert tous les agents.
      options:
        oauth: { en: "OAuth identity passthrough makes the tool act with a user's sign-in; no requirement asks for the user's own permissions.", fr: "La transmission d'identité OAuth fait agir l'outil avec la connexion d'un utilisateur ; aucune exigence ne demande les autorisations propres de l'utilisateur." }
    references:
      - title: Connect agents to MCP server endpoints - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
      - title: Agent identity concepts in Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/agent-identity

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-14-10
    objective: "1.4.2"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Tailspin Toys evaluates a summarization model deployment named **sum-prod** in Microsoft Foundry. Each row of the test dataset has two fields: `query` and `ground_truth`, a reference summary written by an expert. The evaluation run sends each query to sum-prod and evaluates the generated response.

        The run must use two criteria:

        - A deterministic score of the token overlap between the response and the reference summary, based on precision and recall and computed without any model.
        - A 1–5 score of how close the meaning of the response is to the reference summary, judged by the **judge-mini** deployment.

        How should you complete the Python code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Tailspin Toys évalue un déploiement de modèle de synthèse nommé **sum-prod** dans Microsoft Foundry. Chaque ligne du jeu de données de test comporte deux champs : `query` et `ground_truth`, un résumé de référence rédigé par un expert. L'exécution d'évaluation envoie chaque requête à sum-prod et évalue la réponse générée.

        L'exécution doit utiliser deux critères :

        - Un score déterministe du recouvrement de jetons entre la réponse et le résumé de référence, fondé sur la précision et le rappel et calculé sans aucun modèle.
        - Un score de 1 à 5 de la proximité de sens entre la réponse et le résumé de référence, jugé par le déploiement **judge-mini**.

        Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        testing_criteria = [
            {
                "type": "azure_ai_evaluator",
                "name": "overlap",
                "evaluator_name": [[ev1]],
                "data_mapping": {
                    "ground_truth": "{{item.ground_truth}}",
                    "response": "{{sample.output_text}}",
                },
            },
            {
                "type": "azure_ai_evaluator",
                "name": "meaning",
                "evaluator_name": [[ev2]],
                [[init]],
                "data_mapping": {
                    "query": "{{item.query}}",
                    "response": "{{sample.output_text}}",
                    "ground_truth": "{{item.ground_truth}}",
                },
            },
        ]
      slots:
        - id: ev1
          options:
            - { id: bleu, text: "\"builtin.bleu_score\"" }
            - { id: f1, text: "\"builtin.f1_score\"" }
            - { id: meteor, text: "\"builtin.meteor_score\"" }
            - { id: sim, text: "\"builtin.similarity\"" }
        - id: ev2
          options:
            - { id: sim, text: "\"builtin.similarity\"" }
            - { id: grd, text: "\"builtin.groundedness\"" }
            - { id: rel, text: "\"builtin.relevance\"" }
            - { id: coh, text: "\"builtin.coherence\"" }
        - id: init
          options:
            - { id: thr, text: "\"initialization_parameters\": {\"threshold\": 3}" }
            - { id: rouge, text: "\"initialization_parameters\": {\"rouge_type\": \"rouge1\"}" }
            - { id: dep, text: "\"initialization_parameters\": {\"deployment_name\": \"judge-mini\"}" }
    answer:
      values: { ev1: f1, ev2: sim, init: dep }
    explanation:
      correct:
        en: |
          `builtin.f1_score` measures the token overlap between the response and the ground truth with precision and recall; it's algorithmic and takes no parameter. `builtin.similarity` scores the semantic similarity to the ground truth from 1 to 5; it's the only textual similarity evaluator that needs a judge model, given as `deployment_name` in `initialization_parameters`.
        fr: |
          `builtin.f1_score` mesure le recouvrement de jetons entre la réponse et la vérité terrain avec la précision et le rappel ; il est algorithmique et ne prend aucun paramètre. `builtin.similarity` note de 1 à 5 la similarité sémantique avec la vérité terrain ; c'est le seul évaluateur de similarité textuelle qui a besoin d'un modèle juge, indiqué par `deployment_name` dans `initialization_parameters`.
      options:
        bleu: { en: "BLEU measures n-gram overlap, a machine translation metric; it isn't the precision-and-recall token overlap of F1.", fr: "BLEU mesure le recouvrement de n-grammes, une métrique de traduction automatique ; ce n'est pas le recouvrement de jetons par précision et rappel de F1." }
        meteor: { en: "METEOR measures a weighted alignment that accounts for synonyms, not a plain precision-and-recall token overlap.", fr: "METEOR mesure un alignement pondéré qui tient compte des synonymes, pas un simple recouvrement de jetons par précision et rappel." }
        grd: { en: "Groundedness compares the response with a context, which the dataset doesn't have, not with a reference answer.", fr: "Groundedness compare la réponse à un contexte, que le jeu de données ne contient pas, et non à une réponse de référence." }
        rel: { en: "Relevance judges how well the response addresses the query; it doesn't compare it with the reference summary.", fr: "Relevance juge dans quelle mesure la réponse traite la requête ; elle ne la compare pas au résumé de référence." }
        coh: { en: "Coherence judges how logically the response reads, without any reference answer.", fr: "Coherence juge la logique de la réponse, sans aucune réponse de référence." }
        thr: { en: "A threshold alone doesn't name the judge model that Similarity requires.", fr: "Un seuil seul ne désigne pas le modèle juge dont Similarity a besoin." }
        rouge: { en: "`rouge_type` is the required parameter of the ROUGE evaluator, not of Similarity.", fr: "`rouge_type` est le paramètre obligatoire de l'évaluateur ROUGE, pas de Similarity." }
    references:
      - title: Textual Similarity Evaluators for Generative AI - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
