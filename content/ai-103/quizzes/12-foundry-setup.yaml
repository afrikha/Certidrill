chapter: 12-foundry-setup
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-12-01
    objective: "1.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso has a Foundry resource named **contoso-ai** that contains a Foundry project named **claims**. A developer creates an `AIProjectClient` with the Foundry SDK for Python to work with the agents of the claims project.

        Which endpoint should the developer pass to the client?
      fr: |
        Contoso dispose d'une ressource Foundry nommée **contoso-ai** qui contient un projet Foundry nommé **claims**. Un développeur crée un `AIProjectClient` avec le SDK Foundry pour Python afin de travailler avec les agents du projet claims.

        Quel point de terminaison le développeur doit-il passer au client ?
    body:
      options:
        - { id: a, text: "`https://claims.services.ai.azure.com/api/projects/contoso-ai`" }
        - { id: b, text: "`https://contoso-ai.openai.azure.com/openai/deployments/claims`" }
        - { id: c, text: "`https://contoso-ai.services.ai.azure.com/api/projects/claims`" }
        - { id: d, text: "`https://contoso-ai.cognitiveservices.azure.com/projects/claims`" }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A project endpoint has the format `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`: the host name comes from the Foundry resource, and the path names the project, which is a subresource of it. The SDK client uses this endpoint for the agents, conversations and evaluations of the project.
        fr: |
          Le point de terminaison d'un projet a le format `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>` : le nom d'hôte vient de la ressource Foundry, et le chemin désigne le projet, qui en est une sous-ressource. Le client du SDK utilise ce point de terminaison pour les agents, les conversations et les évaluations du projet.
      options:
        a: { en: "The resource name and the project name are swapped: the host name is the Foundry resource, and the project appears in the path.", fr: "Le nom de la ressource et celui du projet sont inversés : le nom d'hôte est la ressource Foundry, et le projet apparaît dans le chemin." }
        b: { en: "This is the shape of an Azure OpenAI deployment URL, not of a Foundry project endpoint; a project isn't a model deployment.", fr: "C'est la forme d'une URL de déploiement Azure OpenAI, pas d'un point de terminaison de projet Foundry ; un projet n'est pas un déploiement de modèle." }
        d: { en: "Project endpoints use the `services.ai.azure.com` domain with the `/api/projects/` path, not this domain and path.", fr: "Les points de terminaison de projet utilisent le domaine `services.ai.azure.com` avec le chemin `/api/projects/`, pas ce domaine et ce chemin." }
    references:
      - title: "Quickstart: Get started with Microsoft Foundry SDK - Microsoft Foundry"
        url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-12-02
    objective: "1.2.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        A Bicep file of Fabrikam creates a model deployment with the following SKU:

        `sku: { name: 'GlobalStandard', capacity: 50 }`

        What does the `capacity` value set for this deployment?
      fr: |
        Un fichier Bicep de Fabrikam crée un déploiement de modèle avec la SKU suivante :

        `sku: { name: 'GlobalStandard', capacity: 50 }`

        Que fixe la valeur `capacity` pour ce déploiement ?
    body:
      options:
        - { id: a, text: { en: "50 provisioned throughput units (PTUs), billed per hour", fr: "50 unités de débit provisionné (PTU), facturées à l'heure" } }
        - { id: b, text: { en: "50,000 tokens per minute (TPM), taken from the quota", fr: "50 000 jetons par minute (TPM), pris sur le quota" } }
        - { id: c, text: { en: "50 requests per second, whatever the number of tokens", fr: "50 requêtes par seconde, quel que soit le nombre de jetons" } }
        - { id: d, text: { en: "50 replicas of the model, each serving one conversation", fr: "50 réplicas du modèle, chacun servant une conversation" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          For a Standard deployment type such as Global Standard, a capacity value of 1 equals 1,000 tokens per minute (TPM), so `capacity: 50` assigns 50,000 TPM to the deployment. That throughput is taken from the TPM quota available for the model and deployment type.
        fr: |
          Pour un type de déploiement Standard comme Global Standard, une capacité de 1 vaut 1 000 jetons par minute (TPM) : `capacity: 50` attribue donc 50 000 TPM au déploiement. Ce débit est pris sur le quota de TPM disponible pour le modèle et le type de déploiement.
      options:
        a: { en: "PTUs are the capacity unit of provisioned deployment types; Global Standard is a pay-per-token type.", fr: "Les PTU sont l'unité de capacité des types de déploiement provisionnés ; Global Standard est un type payé au jeton." }
        c: { en: "Capacity is expressed in tokens per minute, not in requests per second.", fr: "La capacité s'exprime en jetons par minute, pas en requêtes par seconde." }
        d: { en: "Capacity doesn't set a number of model replicas or conversations; the service manages the infrastructure of a Standard deployment.", fr: "La capacité ne fixe ni un nombre de réplicas du modèle ni un nombre de conversations ; le service gère l'infrastructure d'un déploiement Standard." }
    references:
      - title: Azure OpenAI in Microsoft Foundry Models working with models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-12-03
    objective: "1.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware is launching a public assistant on its website. Traffic is hard to predict, and the company has no data residency requirement for inference. Litware wants to pay only for the tokens it uses, to get the highest default quota, and to get new models as early as possible.

        Which deployment type should you use?
      fr: |
        Litware lance un assistant public sur son site web. Le trafic est difficile à prévoir, et l'entreprise n'a aucune exigence de résidence des données pour l'inférence. Litware veut payer uniquement les jetons qu'elle utilise, disposer du quota par défaut le plus élevé et recevoir les nouveaux modèles le plus tôt possible.

        Quel type de déploiement devez-vous utiliser ?
    body:
      options:
        - { id: a, text: Global Provisioned }
        - { id: b, text: Data Zone Standard }
        - { id: c, text: Standard }
        - { id: d, text: Global Standard }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Global Standard is billed per token, can process requests in any Azure region, provides the highest default quota and receives new models and features first. Without a residency constraint on inference, it fits unpredictable traffic at the lowest price.
        fr: |
          Global Standard est facturé au jeton, peut traiter les requêtes dans n'importe quelle région Azure, offre le quota par défaut le plus élevé et reçoit en premier les nouveaux modèles et fonctionnalités. Sans contrainte de résidence pour l'inférence, il convient à un trafic imprévisible au prix le plus bas.
      options:
        a: { en: "Global Provisioned reserves PTUs billed per hour, whether or not they are used: Litware wouldn't pay only for the tokens it uses.", fr: "Global Provisioned réserve des PTU facturées à l'heure, qu'elles soient utilisées ou non : Litware ne paierait pas uniquement les jetons utilisés." }
        b: { en: "Data Zone Standard keeps processing inside a data zone, which Litware doesn't need, and its default quota is lower than that of Global Standard.", fr: "Data Zone Standard garde le traitement dans une zone de données, ce dont Litware n'a pas besoin, et son quota par défaut est inférieur à celui de Global Standard." }
        c: { en: "Standard keeps processing in one Azure geography, with lower quota and fewer models per region; it answers a residency need that Litware doesn't have.", fr: "Standard garde le traitement dans une zone géographique Azure, avec un quota plus faible et moins de modèles par région ; il répond à un besoin de résidence que Litware n'a pas." }
    references:
      - title: Understanding deployment types in Microsoft Foundry Models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-12-04
    objective: "1.2.1"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders has a Foundry resource named **nw-ai** with public network access enabled. It contains a project used by the marketing team, which must keep public access.

        A new fraud team must build its agents in an environment that is reachable only through a private endpoint from the corporate network.

        What should you do?
      fr: |
        Northwind Traders dispose d'une ressource Foundry nommée **nw-ai** dont l'accès réseau public est activé. Elle contient un projet utilisé par l'équipe marketing, qui doit conserver l'accès public.

        Une nouvelle équipe antifraude doit créer ses agents dans un environnement joignable uniquement par un point de terminaison privé depuis le réseau de l'entreprise.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a project for the fraud team in nw-ai, and disable public network access on that project only.", fr: "Créer un projet pour l'équipe antifraude dans nw-ai, puis désactiver l'accès réseau public sur ce projet uniquement." } }
        - { id: b, text: { en: "Add a private endpoint to nw-ai, keep public network access enabled, and create the fraud project in nw-ai.", fr: "Ajouter un point de terminaison privé à nw-ai, conserver l'accès réseau public, puis créer le projet antifraude dans nw-ai." } }
        - { id: c, text: { en: "Create a project for the fraud team in nw-ai, and give only the fraud team the Foundry User role on it.", fr: "Créer un projet pour l'équipe antifraude dans nw-ai, puis attribuer le rôle Foundry User sur ce projet à la seule équipe antifraude." } }
        - { id: d, text: { en: "Create a second Foundry resource with public access disabled and a private endpoint, and create the fraud project in it.", fr: "Créer une deuxième ressource Foundry avec l'accès public désactivé et un point de terminaison privé, puis y créer le projet antifraude." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Networking is configured on the Foundry resource, not on its projects: every project of a resource shares the resource's network settings. Because the marketing project must stay public and the fraud project must be private, the fraud team needs its own Foundry resource with public network access disabled and a private endpoint.
        fr: |
          Le réseau se configure sur la ressource Foundry, pas sur ses projets : tous les projets d'une ressource partagent les paramètres réseau de la ressource. Comme le projet marketing doit rester public et le projet antifraude doit être privé, l'équipe antifraude a besoin de sa propre ressource Foundry avec l'accès réseau public désactivé et un point de terminaison privé.
      options:
        a: { en: "A project has no network settings of its own: public network access is a setting of the Foundry resource.", fr: "Un projet n'a pas de paramètres réseau propres : l'accès réseau public est un paramètre de la ressource Foundry." }
        b: { en: "Adding a private endpoint doesn't block public access: with public network access enabled, the fraud project stays reachable from the internet.", fr: "Ajouter un point de terminaison privé ne bloque pas l'accès public : avec l'accès réseau public activé, le projet antifraude reste joignable depuis Internet." }
        c: { en: "A role assignment controls who can use the project, not the network path; the project would still be reachable over the public endpoint.", fr: "Une attribution de rôle contrôle qui peut utiliser le projet, pas le chemin réseau ; le projet resterait joignable par le point de terminaison public." }
    references:
      - title: Microsoft Foundry architecture - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture
      - title: How to configure network isolation for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-12-05
    objective: "1.2.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys deploys its Foundry agents from a GitHub Actions workflow that signs in to Azure with the `azure/login` action. The security team forbids storing any password, client secret, certificate or API key in GitHub. The workflow may store only identifiers, such as the client ID and the tenant ID.

        What should you configure for the identity of the workflow?
      fr: |
        Tailspin Toys déploie ses agents Foundry depuis un workflow GitHub Actions qui se connecte à Azure avec l'action `azure/login`. L'équipe de sécurité interdit de stocker dans GitHub tout mot de passe, secret client, certificat ou clé API. Le workflow ne peut stocker que des identificateurs, comme l'ID client et l'ID de locataire.

        Que devez-vous configurer pour l'identité du workflow ?
    body:
      options:
        - { id: a, text: { en: "A client secret on an app registration, stored as an encrypted GitHub secret", fr: "Un secret client sur une inscription d'application, stocké comme secret GitHub chiffré" } }
        - { id: b, text: { en: "A certificate on an app registration, stored as a base64 GitHub secret", fr: "Un certificat sur une inscription d'application, stocké comme secret GitHub en base64" } }
        - { id: c, text: { en: "A federated identity credential on a user-assigned managed identity", fr: "Des informations d'identification fédérées sur une identité managée affectée par l'utilisateur" } }
        - { id: d, text: { en: "An API key of the Foundry resource, stored as a GitHub variable", fr: "Une clé API de la ressource Foundry, stockée comme variable GitHub" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With OpenID Connect, a federated identity credential on a user-assigned managed identity (or on an app registration) trusts the tokens that GitHub Actions issues for the repository. `azure/login` exchanges the GitHub token for a Microsoft Entra token by using only the client ID, the tenant ID and the subscription ID, so no secret is stored. The workflow also needs the `id-token: write` permission.
        fr: |
          Avec OpenID Connect, des informations d'identification fédérées sur une identité managée affectée par l'utilisateur (ou sur une inscription d'application) approuvent les jetons que GitHub Actions émet pour le dépôt. `azure/login` échange le jeton GitHub contre un jeton Microsoft Entra en utilisant uniquement l'ID client, l'ID de locataire et l'ID d'abonnement : aucun secret n'est stocké. Le workflow a aussi besoin de l'autorisation `id-token: write`.
      options:
        a: { en: "A client secret is a credential stored in GitHub, which the security team forbids, even when it's encrypted.", fr: "Un secret client est une information d'identification stockée dans GitHub, ce que l'équipe de sécurité interdit, même chiffrée." }
        b: { en: "A certificate is also a credential that would have to be stored in GitHub, which breaks the rule.", fr: "Un certificat est aussi une information d'identification qu'il faudrait stocker dans GitHub, ce qui enfreint la règle." }
        d: { en: "An API key is a secret that grants full access without role restrictions, and a GitHub variable isn't even encrypted.", fr: "Une clé API est un secret qui donne un accès complet sans restriction de rôle, et une variable GitHub n'est même pas chiffrée." }
    references:
      - title: Authenticate to Azure from GitHub Actions by OpenID Connect
        url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-12-06
    objective: "1.2.2"
    difficulty: 3
    status: draft
    type: dragdrop
    stem:
      en: |
        Fourth Coffee has a Foundry resource in an Azure region of Japan. You must choose a deployment type of the same model for each of four workloads. The legal team requires that the prompts of the claims assistant and of the HR helper are processed only within the Azure geography of the resource. The other workloads have no residency requirement.

        Which deployment type should you use for each workload? To answer, drag the appropriate deployment types to the correct workloads. Each deployment type may be used once or not at all.

        NOTE: Each correct selection is worth one point.
      fr: |
        Fourth Coffee dispose d'une ressource Foundry dans une région Azure du Japon. Vous devez choisir un type de déploiement du même modèle pour chacune de quatre charges de travail. L'équipe juridique exige que les invites de l'assistant des sinistres et de l'assistant RH soient traitées uniquement dans la zone géographique Azure de la ressource. Les autres charges de travail n'ont aucune exigence de résidence.

        Quel type de déploiement devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les types de déploiement appropriés vers les charges de travail correspondantes. Chaque type de déploiement peut être utilisé une fois ou pas du tout.

        Remarque : chaque sélection correcte vaut un point.
    body:
      reuse: false
      items:
        - { id: gstd, text: Global Standard }
        - { id: gprov, text: Global Provisioned }
        - { id: gbatch, text: Global Batch }
        - { id: dzstd, text: Data Zone Standard }
        - { id: std, text: Standard }
        - { id: rprov, text: Regional Provisioned }
      targets:
        - { id: chat, text: { en: "Customer chat: steady high traffic around the clock, with consistently low latency", fr: "Conversation client : trafic élevé et régulier jour et nuit, avec une latence faible et constante" } }
        - { id: claims, text: { en: "Claims assistant: steady high traffic that needs guaranteed throughput", fr: "Assistant des sinistres : trafic élevé et régulier qui exige un débit garanti" } }
        - { id: hr, text: { en: "HR helper: low and bursty traffic, billed only for the tokens used", fr: "Assistant RH : trafic faible et irrégulier, facturé uniquement sur les jetons utilisés" } }
        - { id: archive, text: { en: "Re-tag three million archived product descriptions this week at the lowest cost", fr: "Réétiqueter trois millions de descriptions de produits archivées cette semaine au coût le plus bas" } }
    answer:
      mapping: { chat: gprov, claims: rprov, hr: std, archive: gbatch }
    explanation:
      correct:
        en: |
          Provisioned types guarantee throughput and give lower latency variance: Global Provisioned for the customer chat, which has no residency constraint, and Regional Provisioned for the claims assistant, whose prompts must stay in the geography. Standard keeps processing in the geography with pay-per-token billing and suits low, bursty volume. Global Batch costs 50 % less than Global Standard for large asynchronous jobs that have no residency constraint and a deadline of days.
        fr: |
          Les types provisionnés garantissent le débit et réduisent la variabilité de la latence : Global Provisioned pour la conversation client, sans contrainte de résidence, et Regional Provisioned pour l'assistant des sinistres, dont les invites doivent rester dans la zone géographique. Standard garde le traitement dans la zone géographique avec une facturation au jeton et convient à un volume faible et irrégulier. Global Batch coûte 50 % de moins que Global Standard pour les gros travaux asynchrones sans contrainte de résidence et avec un délai de plusieurs jours.
      options:
        gstd: { en: "Global Standard is best effort: with high, consistent volume, latency can vary, so it doesn't meet the consistent-latency need of the customer chat.", fr: "Global Standard fonctionne au mieux : avec un volume élevé et régulier, la latence peut varier ; il ne répond donc pas au besoin de latence constante de la conversation client." }
        dzstd: { en: "The APAC data zone spans more than the geography of the resource, so Data Zone Standard doesn't meet the residency requirement of the HR helper.", fr: "La zone de données APAC couvre plus que la zone géographique de la ressource : Data Zone Standard ne répond donc pas à l'exigence de résidence de l'assistant RH." }
    references:
      - title: Understanding deployment types in Microsoft Foundry Models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-12-07
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam has a Foundry resource named **fab-ai** with a system-assigned managed identity. fab-ai has three connections, to Azure AI Search, Azure Storage and a partner API, that authenticate with API keys. The keys are stored in the default Microsoft-managed key vault.

        A new policy requires that all connection secrets of fab-ai and of its projects be stored in Fabrikam's key vault **kv-fab**, which uses the Azure role-based access control permission model. Permissions must be the minimum required.

        What should you do?
      fr: |
        Fabrikam dispose d'une ressource Foundry nommée **fab-ai** avec une identité managée affectée par le système. fab-ai possède trois connexions, vers Azure AI Search, Stockage Azure et une API partenaire, qui s'authentifient avec des clés API. Les clés sont stockées dans le coffre de clés par défaut managé par Microsoft.

        Une nouvelle stratégie exige que tous les secrets de connexion de fab-ai et de ses projets soient stockés dans le coffre de clés de Fabrikam **kv-fab**, qui utilise le modèle d'autorisation du contrôle d'accès en fonction du rôle Azure. Les autorisations doivent être les plus réduites possible.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Create a Key Vault connection on fab-ai, give its identity Key Vault Secrets Officer on kv-fab, and let Foundry move the three secrets to kv-fab.", fr: "Créer une connexion Key Vault sur fab-ai, donner à son identité le rôle Key Vault Secrets Officer sur kv-fab, puis laisser Foundry déplacer les trois secrets vers kv-fab." } }
        - { id: b, text: { en: "Delete the three connections, create a Key Vault connection on fab-ai, give its identity Key Vault Secrets Officer on kv-fab, then recreate the connections.", fr: "Supprimer les trois connexions, créer une connexion Key Vault sur fab-ai, donner à son identité le rôle Key Vault Secrets Officer sur kv-fab, puis recréer les connexions." } }
        - { id: c, text: { en: "Create a Key Vault connection in each project of fab-ai, give each project identity Key Vault Secrets Officer on kv-fab, then recreate the connections.", fr: "Créer une connexion Key Vault dans chaque projet de fab-ai, donner à chaque identité de projet le rôle Key Vault Secrets Officer sur kv-fab, puis recréer les connexions." } }
        - { id: d, text: { en: "Configure customer-managed keys on fab-ai with a key from kv-fab, and give the identity of fab-ai the Key Vault Crypto User role on kv-fab.", fr: "Configurer des clés gérées par le client sur fab-ai avec une clé de kv-fab, puis donner à l'identité de fab-ai le rôle Key Vault Crypto User sur kv-fab." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A Foundry resource can have one Azure Key Vault connection, which then stores the secrets of all resource-level and project-level connections. It can be created only on a resource that has no existing connections, and Foundry doesn't migrate secrets, so the three connections must be deleted and then recreated after the Key Vault connection exists. Key Vault Secrets Officer is the least-privileged role that the resource's managed identity needs on kv-fab.
        fr: |
          Une ressource Foundry peut avoir une seule connexion Azure Key Vault, qui stocke alors les secrets de toutes les connexions au niveau de la ressource et des projets. Elle ne peut être créée que sur une ressource sans connexion existante, et Foundry ne migre pas les secrets : il faut donc supprimer les trois connexions, puis les recréer une fois la connexion Key Vault en place. Key Vault Secrets Officer est le rôle aux privilèges minimaux dont l'identité managée de la ressource a besoin sur kv-fab.
      options:
        a: { en: "A Key Vault connection requires a resource with no existing connections, and secret migration isn't supported: Foundry doesn't move the existing secrets.", fr: "Une connexion Key Vault exige une ressource sans connexion existante, et la migration des secrets n'est pas prise en charge : Foundry ne déplace pas les secrets existants." }
        c: { en: "The Key Vault connection is limited to one per Foundry resource and is created on the resource; it then covers the connections of all its projects.", fr: "La connexion Key Vault est limitée à une par ressource Foundry et se crée sur la ressource ; elle couvre alors les connexions de tous ses projets." }
        d: { en: "Customer-managed keys encrypt the data at rest of the resource; without a Key Vault connection, connection secrets stay in the Microsoft-managed key vault.", fr: "Les clés gérées par le client chiffrent les données au repos de la ressource ; sans connexion Key Vault, les secrets de connexion restent dans le coffre de clés managé par Microsoft." }
    references:
      - title: Set up an Azure Key Vault Connection - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/set-up-key-vault-connection
      - title: Configure Customer-Managed Keys for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/encryption-keys-portal

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-12-08
    objective: "1.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Woodgrove Bank has a Foundry resource that contains two Standard deployments, each pinned to a specific model version:

        - **summary-std**: `versionUpgradeOption` is set to `NoAutoUpgrade`.
        - **extract-std**: `versionUpgradeOption` isn't set, so its value is `null`.

        A release script that creates the agents of the bank's Foundry project uses the `azure-ai-projects` 1.x package.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Woodgrove Bank dispose d'une ressource Foundry qui contient deux déploiements Standard, chacun épinglé sur une version précise du modèle :

        - **summary-std** : `versionUpgradeOption` vaut `NoAutoUpgrade`.
        - **extract-std** : `versionUpgradeOption` n'est pas défini, sa valeur est donc `null`.

        Un script de mise en production qui crée les agents du projet Foundry de la banque utilise le package `azure-ai-projects` 1.x.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    body:
      statements:
        - { id: s1, text: { en: "When the pinned version of summary-std reaches its retirement date, summary-std stops working.", fr: "Quand la version épinglée de summary-std atteint sa date de mise hors service, summary-std cesse de fonctionner." } }
        - { id: s2, text: { en: "When the pinned version of extract-std reaches its retirement date, extract-std stops working until you change its model version.", fr: "Quand la version épinglée d'extract-std atteint sa date de mise hors service, extract-std cesse de fonctionner jusqu'à ce que vous changiez sa version de modèle." } }
        - { id: s3, text: { en: "The release script can call `project.agents.create_version()` to create new versions of the agents in the Foundry project.", fr: "Le script de mise en production peut appeler `project.agents.create_version()` pour créer de nouvelles versions des agents dans le projet Foundry." } }
    answer:
      values: { s1: true, s2: false, s3: false }
    explanation:
      correct:
        en: |
          With `NoAutoUpgrade`, a deployment never upgrades automatically and stops working at the retirement date, so code must be pointed to another deployment before then. A `null` value is equivalent to `OnceCurrentVersionExpired`: at retirement, extract-std upgrades automatically to the current default version and keeps working. The Foundry SDK code for Foundry projects, including `create_version`, uses `azure-ai-projects` 2.x, which is incompatible with 1.x; version 1.x targets Foundry (classic).
        fr: |
          Avec `NoAutoUpgrade`, un déploiement ne se met jamais à niveau automatiquement et cesse de fonctionner à la date de mise hors service : le code doit être redirigé vers un autre déploiement avant. Une valeur `null` équivaut à `OnceCurrentVersionExpired` : à la mise hors service, extract-std passe automatiquement à la version par défaut du moment et continue de fonctionner. Le code du SDK Foundry pour les projets Foundry, dont `create_version`, utilise `azure-ai-projects` 2.x, incompatible avec 1.x ; la version 1.x cible Foundry (classic).
      options:
        s2: { en: "No: when the option isn't set, the deployment behaves as OnceCurrentVersionExpired and is upgraded to the default version at retirement.", fr: "Non : quand l'option n'est pas définie, le déploiement se comporte comme OnceCurrentVersionExpired et passe à la version par défaut à la mise hors service." }
        s3: { en: "No: `create_version` belongs to the 2.x SDK for Foundry projects; code written for 1.x targets Foundry (classic) and isn't compatible.", fr: "Non : `create_version` appartient au SDK 2.x pour les projets Foundry ; le code écrit pour 1.x cible Foundry (classic) et n'est pas compatible." }
    references:
      - title: Azure OpenAI in Microsoft Foundry Models working with models - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
      - title: "Quickstart: Get started with Microsoft Foundry SDK - Microsoft Foundry"
        url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-12-09
    objective: "1.2.1"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Relecloud created a Foundry resource named **rc-ai** last year, with public network access and without network injection. Its projects use a standard agent setup with an Azure Cosmos DB account, a storage account and an Azure AI Search service, all reachable over public endpoints.

        A new requirement states that the agent runtime must run inside Relecloud's virtual network, and that Cosmos DB, Storage and Azure AI Search must be reachable only through private connectivity.

        Which two actions should you perform? Each correct answer presents part of the solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        Relecloud a créé l'an dernier une ressource Foundry nommée **rc-ai**, avec l'accès réseau public et sans injection de réseau. Ses projets utilisent une configuration standard des agents avec un compte Azure Cosmos DB, un compte de stockage et un service Azure AI Search, tous joignables par des points de terminaison publics.

        Une nouvelle exigence impose que le runtime des agents s'exécute dans le réseau virtuel de Relecloud, et que Cosmos DB, le stockage et Azure AI Search ne soient joignables que par une connectivité privée.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Enable network injection on rc-ai by selecting a subnet delegated to `Microsoft.App/environments` in its networking settings.", fr: "Activer l'injection de réseau sur rc-ai en sélectionnant un sous-réseau délégué à `Microsoft.App/environments` dans ses paramètres réseau." } }
        - { id: b, text: { en: "Deploy a new Foundry resource with network injection into a dedicated subnet delegated to `Microsoft.App/environments`, then recreate the projects.", fr: "Déployer une nouvelle ressource Foundry avec l'injection de réseau dans un sous-réseau dédié délégué à `Microsoft.App/environments`, puis recréer les projets." } }
        - { id: c, text: { en: "Create a private endpoint on rc-ai only, because Cosmos DB, Storage and Azure AI Search inherit the network settings of the Foundry resource.", fr: "Créer un point de terminaison privé sur rc-ai uniquement, car Cosmos DB, le stockage et Azure AI Search héritent des paramètres réseau de la ressource Foundry." } }
        - { id: d, text: { en: "Create private endpoints on the Cosmos DB account, the storage account and the search service, and disable their public network access.", fr: "Créer des points de terminaison privés sur le compte Cosmos DB, le compte de stockage et le service de recherche, puis désactiver leur accès réseau public." } }
        - { id: e, text: { en: "Delegate one subnet to `Microsoft.App/environments` and share it between the new Foundry resource and the other Foundry resources in the region.", fr: "Déléguer un sous-réseau à `Microsoft.App/environments` et le partager entre la nouvelle ressource Foundry et les autres ressources Foundry de la région." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          Outbound network injection can't be added to an existing Foundry deployment: you must deploy a new Foundry resource with injection into a dedicated subnet delegated to `Microsoft.App/environments`. Because capability settings can't be changed on an existing project either, the projects are recreated on the new resource. Private endpoints to Cosmos DB, Storage and Azure AI Search aren't created with the Foundry resource; you create them on each resource.
        fr: |
          L'injection de réseau sortante ne peut pas être ajoutée à un déploiement Foundry existant : il faut déployer une nouvelle ressource Foundry avec l'injection dans un sous-réseau dédié délégué à `Microsoft.App/environments`. Comme les paramètres de capacité ne peuvent pas non plus être modifiés sur un projet existant, les projets sont recréés sur la nouvelle ressource. Les points de terminaison privés vers Cosmos DB, le stockage et Azure AI Search ne sont pas créés avec la ressource Foundry : vous les créez sur chaque ressource.
      options:
        a: { en: "Outbound networking settings of an existing Foundry resource can't be updated: network injection must be configured when the resource is deployed.", fr: "Les paramètres réseau sortants d'une ressource Foundry existante ne peuvent pas être modifiés : l'injection de réseau doit être configurée au déploiement de la ressource." }
        c: { en: "Connected resources are independent Azure resources with their own network settings; a private endpoint on the Foundry resource doesn't cover them.", fr: "Les ressources connectées sont des ressources Azure indépendantes avec leurs propres paramètres réseau ; un point de terminaison privé sur la ressource Foundry ne les couvre pas." }
        e: { en: "Each Foundry resource must use a dedicated agent subnet; a delegated subnet can't be shared between Foundry resources.", fr: "Chaque ressource Foundry doit utiliser un sous-réseau d'agents dédié ; un sous-réseau délégué ne peut pas être partagé entre ressources Foundry." }
    references:
      - title: Set up private networking for Foundry Agent Service - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/virtual-networks
      - title: How to configure network isolation for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-12-10
    objective: "1.2.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Adatum releases its support agent with a pipeline that signs in to Azure with OpenID Connect as three user-assigned managed identities:

        - **id-provision** runs Azure CLI commands that create the model deployments of the Foundry resource **adatum-ai** and assign the Foundry User role to new developer accounts on its projects. It doesn't build agents.
        - **id-build** creates new versions of the agent in the project **support-prj** and runs the evaluations in that project.
        - **id-smoke** sends test prompts to the published agent endpoint after each release, and does nothing else.

        You need to assign a role to each identity. The solution must follow the principle of least privilege.

        Which role should you assign to each identity? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Adatum met en production son agent de support avec un pipeline qui se connecte à Azure avec OpenID Connect sous trois identités managées affectées par l'utilisateur :

        - **id-provision** exécute des commandes Azure CLI qui créent les déploiements de modèles de la ressource Foundry **adatum-ai** et attribuent le rôle Foundry User aux nouveaux comptes de développeurs sur ses projets. Elle ne crée pas d'agents.
        - **id-build** crée de nouvelles versions de l'agent dans le projet **support-prj** et exécute les évaluations dans ce projet.
        - **id-smoke** envoie des invites de test au point de terminaison de l'agent publié après chaque mise en production, et ne fait rien d'autre.

        Vous devez attribuer un rôle à chaque identité. La solution doit respecter le principe du moindre privilège.

        Quel rôle devez-vous attribuer à chaque identité ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: text
      template:
        en: |
          id-provision: [[provision]]

          id-build: [[build]]

          id-smoke: [[smoke]]
        fr: |
          id-provision : [[provision]]

          id-build : [[build]]

          id-smoke : [[smoke]]
      slots:
        - id: provision
          options:
            - { id: contrib, text: { en: "Contributor on the resource group of adatum-ai", fr: "Contributor sur le groupe de ressources d'adatum-ai" } }
            - { id: fowner, text: { en: "Foundry Owner on adatum-ai", fr: "Foundry Owner sur adatum-ai" } }
            - { id: accowner, text: { en: "Foundry Account Owner on adatum-ai", fr: "Foundry Account Owner sur adatum-ai" } }
            - { id: owner, text: { en: "Owner on the resource group of adatum-ai", fr: "Owner sur le groupe de ressources d'adatum-ai" } }
        - id: build
          options:
            - { id: b-pm, text: { en: "Foundry Project Manager on support-prj", fr: "Foundry Project Manager sur support-prj" } }
            - { id: b-user, text: { en: "Foundry User on support-prj", fr: "Foundry User sur support-prj" } }
            - { id: b-consumer, text: { en: "Foundry Agent Consumer on support-prj", fr: "Foundry Agent Consumer sur support-prj" } }
            - { id: b-accowner, text: { en: "Foundry Account Owner on adatum-ai", fr: "Foundry Account Owner sur adatum-ai" } }
        - id: smoke
          options:
            - { id: s-reader, text: { en: "Reader on support-prj", fr: "Reader sur support-prj" } }
            - { id: s-user, text: { en: "Foundry User on support-prj", fr: "Foundry User sur support-prj" } }
            - { id: s-consumer, text: { en: "Foundry Agent Consumer on support-prj", fr: "Foundry Agent Consumer sur support-prj" } }
    answer:
      values: { provision: accowner, build: b-user, smoke: s-consumer }
    explanation:
      correct:
        en: |
          Foundry Account Owner manages the Foundry resource and its model deployments and can conditionally assign the Foundry User role, but it can't build in projects: exactly what id-provision needs. Foundry User grants the data actions to build and test agents in the project, without managing models, assigning roles or publishing. Foundry Agent Consumer only lets a principal interact with agent endpoints, which is all that id-smoke does.
        fr: |
          Foundry Account Owner gère la ressource Foundry et ses déploiements de modèles et peut attribuer sous condition le rôle Foundry User, mais il ne peut pas développer dans les projets : c'est exactement ce dont id-provision a besoin. Foundry User accorde les actions de données pour créer et tester des agents dans le projet, sans gérer les modèles, attribuer des rôles ni publier. Foundry Agent Consumer permet seulement à un principal d'interagir avec les points de terminaison des agents, ce qui est tout ce que fait id-smoke.
      options:
        contrib: { en: "Contributor can deploy models but can't create role assignments, so id-provision couldn't assign Foundry User.", fr: "Contributor peut déployer des modèles mais ne peut pas créer d'attributions de rôles : id-provision ne pourrait pas attribuer Foundry User." }
        fowner: { en: "Foundry Owner also grants building and publishing in every project, which id-provision doesn't need.", fr: "Foundry Owner accorde aussi le développement et la publication dans tous les projets, ce dont id-provision n'a pas besoin." }
        owner: { en: "Owner can assign any role on every resource of the group: far more than the two tasks of id-provision.", fr: "Owner peut attribuer n'importe quel rôle sur toutes les ressources du groupe : bien plus que les deux tâches d'id-provision." }
        b-pm: { en: "Foundry Project Manager adds publishing and role assignment on top of building, which id-build doesn't need.", fr: "Foundry Project Manager ajoute la publication et l'attribution de rôles au développement, ce dont id-build n'a pas besoin." }
        s-reader: { en: "Reader gives no data actions, so it can't send prompts to the agent endpoint.", fr: "Reader ne donne aucune action de données : il ne peut pas envoyer d'invites au point de terminaison de l'agent." }
        b-consumer: { en: "Foundry Agent Consumer only interacts with agent endpoints; it can't create agent versions or run evaluations.", fr: "Foundry Agent Consumer interagit seulement avec les points de terminaison des agents ; il ne peut ni créer de versions d'agent ni exécuter d'évaluations." }
        b-accowner: { en: "Foundry Account Owner manages the resource but can't build in projects, so it can't create agent versions.", fr: "Foundry Account Owner gère la ressource mais ne peut pas développer dans les projets : il ne peut pas créer de versions d'agent." }
        s-user: { en: "Foundry User also lets id-smoke build and change agents in the project, which goes beyond calling the endpoint.", fr: "Foundry User permet aussi à id-smoke de créer et modifier des agents dans le projet, ce qui va au-delà de l'appel du point de terminaison." }
    references:
      - title: Role-based access control for Microsoft Foundry - Microsoft Foundry
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
