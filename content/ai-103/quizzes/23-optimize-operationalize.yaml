chapter: 23-optimize-operationalize
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-23-01
    objective: "2.3.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Contoso's engineering team calls a **gpt-5-mini** deployment, a reasoning model, through the Responses API to plan complex multistep debugging sessions. The developer message already states the goal, the constraints, the expected output and how the model must verify its work.

        The requests set the reasoning effort to `low`, and the plans are often too shallow. For this task, quality matters more than latency.

        What should you do?
      fr: |
        L'équipe d'ingénierie de Contoso appelle un déploiement **gpt-5-mini**, un modèle de raisonnement, via l'API Responses pour planifier des sessions de débogage complexes en plusieurs étapes. Le message développeur indique déjà l'objectif, les contraintes, la sortie attendue et la façon dont le modèle doit vérifier son travail.

        Les requêtes fixent l'effort de raisonnement à `low`, et les plans sont souvent trop superficiels. Pour cette tâche, la qualité compte plus que la latence.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set the reasoning effort of the requests to `high`.", fr: "Définir l'effort de raisonnement des requêtes sur `high`." } }
        - { id: b, text: { en: "Set `temperature` to `0.2` so that the plans become more focused.", fr: "Définir `temperature` sur `0.2` pour que les plans soient plus ciblés." } }
        - { id: c, text: { en: "Add \"Think step by step\" at the start of the developer message.", fr: "Ajouter « Think step by step » au début du message développeur." } }
        - { id: d, text: { en: "Lower `max_output_tokens` so that the model keeps only the essential steps.", fr: "Baisser `max_output_tokens` pour que le modèle ne garde que les étapes essentielles." } }
    answer: { optionId: a }
    explanation:
      correct:
        en: |
          The reasoning effort sets how much a reasoning model thinks before it answers. Learn recommends `high` for hard reasoning, complex debugging and deep planning when quality matters more than latency. The developer message already follows the prompting guidance for reasoning models, so the effort is the setting left to tune.
        fr: |
          L'effort de raisonnement règle la quantité de réflexion d'un modèle de raisonnement avant qu'il réponde. Learn recommande `high` pour le raisonnement difficile, le débogage complexe et la planification approfondie quand la qualité compte plus que la latence. Le message développeur suit déjà les recommandations d'invite pour les modèles de raisonnement : l'effort est donc le paramètre qui reste à ajuster.
      options:
        b: { en: "gpt-5-mini, like most reasoning models, doesn't support `temperature`: the request fails instead of producing better plans.", fr: "gpt-5-mini, comme la plupart des modèles de raisonnement, ne prend pas en charge `temperature` : la requête échoue au lieu de produire de meilleurs plans." }
        c: { en: "Step-by-step prompting is a technique for non-reasoning models; a reasoning model doesn't need you to prescribe every intermediate step.", fr: "Demander de procéder étape par étape est une technique pour les modèles sans raisonnement ; un modèle de raisonnement n'a pas besoin qu'on lui prescrive chaque étape intermédiaire." }
        d: { en: "`max_output_tokens` caps reasoning and output tokens together: a lower cap leaves less room to reason and can cut the answer off.", fr: "`max_output_tokens` plafonne ensemble les jetons de raisonnement et de sortie : un plafond plus bas laisse moins de place au raisonnement et peut tronquer la réponse." }
    references:
      - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-23-02
    objective: "2.3.3"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's internal chat assistant calls a **gpt-4.1** deployment. The answers are about 400 words long, and users see a blank screen for about eight seconds before the complete answer appears. The business accepts the total response time, but users think that the assistant is stuck.

        You need users to see the first words of each answer sooner. The answers must keep their current length, and the assistant must keep the same deployment.

        What should you do?
      fr: |
        L'assistant de conversation interne de Fabrikam appelle un déploiement **gpt-4.1**. Les réponses font environ 400 mots, et les utilisateurs voient un écran vide pendant environ huit secondes avant que la réponse complète s'affiche. L'entreprise accepte le temps de réponse total, mais les utilisateurs pensent que l'assistant est bloqué.

        Vous devez faire en sorte que les utilisateurs voient plus tôt les premiers mots de chaque réponse. Les réponses doivent garder leur longueur actuelle, et l'assistant doit conserver le même déploiement.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Lower `max_completion_tokens` so that the model finishes each answer sooner.", fr: "Baisser `max_completion_tokens` pour que le modèle termine chaque réponse plus tôt." } }
        - { id: b, text: { en: "Set `n` to 2 in the requests and display the answer that arrives first.", fr: "Définir `n` sur 2 dans les requêtes et afficher la réponse qui arrive en premier." } }
        - { id: c, text: { en: "Set `stream` to true and display the tokens as soon as they arrive.", fr: "Définir `stream` sur true et afficher les jetons dès leur arrivée." } }
        - { id: d, text: { en: "Redeploy the same model with the Global Batch deployment type.", fr: "Redéployer le même modèle avec le type de déploiement Global Batch." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          With streaming, the service returns tokens as soon as they're available instead of waiting for the whole answer. It doesn't change the time needed to get all the tokens, but it reduces the time to the first response, which is what users perceive in a chat interface.
        fr: |
          Avec la diffusion en continu (streaming), le service renvoie les jetons dès qu'ils sont disponibles au lieu d'attendre la réponse entière. Elle ne change pas le temps nécessaire pour obtenir tous les jetons, mais elle réduit le délai avant la première réponse, ce que perçoivent les utilisateurs d'une interface de conversation.
      options:
        a: { en: "A lower token cap shortens or truncates the answers, which the requirements forbid; without streaming, users still see nothing until the end.", fr: "Un plafond de jetons plus bas raccourcit ou tronque les réponses, ce que les exigences interdisent ; sans streaming, les utilisateurs ne voient toujours rien avant la fin." }
        b: { en: "`n` produces several complete outputs in the same response and increases latency; Learn recommends leaving it at 1 for the fastest response.", fr: "`n` produit plusieurs sorties complètes dans la même réponse et augmente la latence ; Learn recommande de le laisser à 1 pour la réponse la plus rapide." }
        d: { en: "A batch deployment processes requests asynchronously with a 24-hour target: it's meant for offline jobs, not for an interactive chat.", fr: "Un déploiement Batch traite les requêtes de façon asynchrone avec un objectif de 24 heures : il est prévu pour des travaux hors ligne, pas pour une conversation interactive." }
    references:
      - title: Azure OpenAI in Microsoft Foundry Models performance & latency
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-23-03
    objective: "2.3.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso Pharma drafts answers about medicine leaflets with a **gpt-4.1** deployment and the leaflet passages that its application retrieves. A critique call reviews each draft before it's returned. The critique prompt currently says only "Is this answer good?", and the call returns free-text comments.

        The application can't decide from these comments whether to revise the draft or what to fix. You need the critique step to drive the revise step automatically.

        How should you change the critique call?
      fr: |
        Contoso Pharma rédige des réponses sur des notices de médicaments avec un déploiement **gpt-4.1** et les passages de notice que son application récupère. Un appel de critique relit chaque brouillon avant qu'il soit renvoyé. L'invite de critique dit actuellement seulement « Is this answer good? », et l'appel renvoie des commentaires en texte libre.

        L'application ne peut pas déterminer à partir de ces commentaires s'il faut réviser le brouillon ni ce qu'il faut corriger. Vous devez faire en sorte que l'étape de critique pilote automatiquement l'étape de révision.

        Comment devez-vous modifier l'appel de critique ?
    body:
      options:
        - { id: a, text: { en: "Have it rewrite the draft from scratch at a higher temperature and return the new version.", fr: "Lui faire réécrire entièrement le brouillon avec une température plus élevée et renvoyer la nouvelle version." } }
        - { id: b, text: { en: "Have it check the draft against the passages and explicit criteria, and return a verdict and a list of issues.", fr: "Lui faire vérifier le brouillon au regard des passages et de critères explicites, et renvoyer un verdict et une liste de problèmes." } }
        - { id: c, text: { en: "Have it return a single quality score from 1 to 10 without comments, so that drafts can be compared.", fr: "Lui faire renvoyer une seule note de qualité de 1 à 10 sans commentaire, pour pouvoir comparer les brouillons." } }
        - { id: d, text: { en: "Have it think step by step about the draft and return its full reasoning for the application to read.", fr: "Lui faire réfléchir étape par étape sur le brouillon et renvoyer tout son raisonnement pour que l'application le lise." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          A critique step works when it checks the draft against explicit criteria (grounded in the sources, answers the question, follows the format and the policy) and returns a structured verdict. The pass or fail value tells the loop whether to stop, and the list of issues is the input of the revise call.
        fr: |
          Une étape de critique fonctionne quand elle vérifie le brouillon selon des critères explicites (ancré dans les sources, répond à la question, respecte le format et la stratégie) et renvoie un verdict structuré. La valeur réussite ou échec indique à la boucle s'il faut s'arrêter, et la liste des problèmes sert d'entrée à l'appel de révision.
      options:
        a: { en: "A full rewrite replaces the revise step without saying what was wrong, and a higher temperature only adds randomness, not accuracy.", fr: "Une réécriture complète remplace l'étape de révision sans dire ce qui n'allait pas, et une température plus élevée n'ajoute que de l'aléatoire, pas d'exactitude." }
        c: { en: "A bare score can trigger a revision, but it doesn't tell the revise call what to fix and isn't tied to the sources.", fr: "Une note seule peut déclencher une révision, mais elle n'indique pas à l'appel de révision ce qu'il faut corriger et n'est pas liée aux sources." }
        d: { en: "Free-form reasoning is still unstructured text: the application still can't read a decision or a list of issues from it.", fr: "Un raisonnement libre reste du texte non structuré : l'application ne peut toujours pas en tirer une décision ni une liste de problèmes." }
    references:
      - title: Prompt engineering techniques
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
      - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-23-04
    objective: "2.3.4"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Northwind Traders sends the traffic of its customer assistant to a model router deployment named **router-help** to reduce costs. The assistant receives three kinds of requests: text questions, photos of damaged products with a question, and voice messages sent as audio input. The voice messages fail when they're sent to router-help.

        You need all three kinds of requests to be processed, while keeping the cost benefit of router-help for as much traffic as possible.

        What should you do?
      fr: |
        Northwind Traders envoie le trafic de son assistant client à un déploiement model router nommé **router-help** pour réduire les coûts. L'assistant reçoit trois types de requêtes : des questions texte, des photos de produits endommagés accompagnées d'une question, et des messages vocaux envoyés en entrée audio. Les messages vocaux échouent quand ils sont envoyés à router-help.

        Vous devez faire en sorte que les trois types de requêtes soient traités, tout en conservant l'avantage de coût de router-help pour la plus grande partie possible du trafic.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Keep all the requests on router-help, and add an audio-capable model to its model subset.", fr: "Garder toutes les requêtes sur router-help, et ajouter un modèle audio à son sous-ensemble de modèles." } }
        - { id: b, text: { en: "Keep the text and photo requests on router-help, and send the voice messages to a direct audio model deployment.", fr: "Garder les requêtes texte et photo sur router-help, et envoyer les messages vocaux à un déploiement direct d'un modèle audio." } }
        - { id: c, text: { en: "Keep only the text requests on router-help, and send the photo and voice requests to direct deployments.", fr: "Garder seulement les requêtes texte sur router-help, et envoyer les requêtes photo et vocales à des déploiements directs." } }
        - { id: d, text: { en: "Keep all the requests on router-help, and switch its routing mode to Quality to reach audio models.", fr: "Garder toutes les requêtes sur router-help, et passer son mode de routage sur Quality pour atteindre les modèles audio." } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          Model router accepts text and image input and bases its routing decision on the text only, so the photo questions can stay on router-help. Audio input isn't supported by model router; Learn recommends a direct model deployment for audio.
        fr: |
          Model router accepte les entrées texte et image et fonde sa décision de routage uniquement sur le texte : les questions avec photo peuvent donc rester sur router-help. L'entrée audio n'est pas prise en charge par model router ; Learn recommande un déploiement direct de modèle pour l'audio.
      options:
        a: { en: "The limitation is the router's input support, not the models in its subset: audio input isn't supported whatever the subset.", fr: "La limite vient des entrées prises en charge par le router, pas des modèles de son sous-ensemble : l'entrée audio n'est pas prise en charge, quel que soit le sous-ensemble." }
        c: { en: "Model router accepts image input, so moving the photo requests off router-help gives up part of the cost benefit for no reason.", fr: "Model router accepte l'entrée image : sortir les requêtes photo de router-help fait perdre sans raison une partie de l'avantage de coût." }
        d: { en: "The routing mode only changes the cost and quality trade-off among supported inputs; Quality mode also ignores cost.", fr: "Le mode de routage ne change que le compromis entre coût et qualité pour les entrées prises en charge ; le mode Quality ignore en plus le coût." }
    references:
      - title: What is model router in Microsoft Foundry?
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-23-05
    objective: "2.3.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Tailspin Toys runs a checkout copilot for its web shop on a **gpt-4.1-mini** Global Standard deployment. The traffic is high and predictable every day. During peak hours, response times vary widely from one request to the next, and this variability degrades the shopping experience.

        The traces show that the model call accounts for almost all of the time, and the prompts and answers are already short. You need consistent, low latency for the copilot in production.

        What should you do?
      fr: |
        Tailspin Toys exécute un copilote de paiement pour sa boutique en ligne sur un déploiement Global Standard **gpt-4.1-mini**. Le trafic est élevé et prévisible chaque jour. Aux heures de pointe, les temps de réponse varient fortement d'une requête à l'autre, et cette variabilité dégrade l'expérience d'achat.

        Les traces montrent que l'appel au modèle représente presque tout le temps, et les invites comme les réponses sont déjà courtes. Vous devez obtenir une latence faible et régulière pour le copilote en production.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Enable streaming so that the copilot shows each answer before it's complete.", fr: "Activer le streaming pour que le copilote affiche chaque réponse avant qu'elle soit complète." } }
        - { id: b, text: { en: "Send the requests to a Global Batch deployment, which is designed for high volumes.", fr: "Envoyer les requêtes à un déploiement Global Batch, conçu pour les gros volumes." } }
        - { id: c, text: { en: "Put a model router deployment in Cost mode in front of the copilot's requests.", fr: "Placer un déploiement model router en mode Cost devant les requêtes du copilote." } }
        - { id: d, text: { en: "Move the copilot to a provisioned deployment that reserves dedicated capacity.", fr: "Déplacer le copilote vers un déploiement provisionné qui réserve une capacité dédiée." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Provisioned deployments allocate dedicated model processing capacity and provide predictable latency once deployed. Learn recommends them for production workloads with predictable traffic, latency-sensitive requirements and interactive scenarios in which variable response times degrade the user experience.
        fr: |
          Les déploiements provisionnés allouent une capacité de traitement dédiée au modèle et offrent une latence prévisible une fois déployés. Learn les recommande pour les charges de travail de production au trafic prévisible, aux exigences sensibles à la latence et aux scénarios interactifs dans lesquels des temps de réponse variables dégradent l'expérience utilisateur.
      options:
        a: { en: "Streaming reduces the time to the first token but doesn't change the total time or its variability under load.", fr: "Le streaming réduit le délai avant le premier jeton mais ne change ni le temps total ni sa variabilité sous charge." }
        b: { en: "Batch deployments process requests asynchronously with a 24-hour target, which doesn't fit an interactive copilot.", fr: "Les déploiements Batch traitent les requêtes de façon asynchrone avec un objectif de 24 heures, ce qui ne convient pas à un copilote interactif." }
        c: { en: "Model router reduces cost by choosing among models; it doesn't reserve capacity, so latency stays variable at peak.", fr: "Model router réduit le coût en choisissant parmi des modèles ; il ne réserve aucune capacité, donc la latence reste variable aux heures de pointe." }
    references:
      - title: Provisioned throughput for Foundry Models
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/provisioned-throughput

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-23-06
    objective: "2.3.4"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Wingtip Toys runs a refund assistant that answers customers from retrieved policy passages. It has two deployments: **help-mini** (gpt-4.1-mini) and **help-large** (gpt-4.1). About 85 % of the requests are simple, and help-mini answers them well.

        The solution must meet the following requirements:

        - Minimize model costs.
        - Use help-large only for the requests on which the help-mini answer fails a groundedness check against the passages.
        - Refunds above 200 USD always require a manager's approval, whatever the models write, and the decision must be reproducible for audits.

        The `groundedness()` helper runs the Groundedness evaluator and returns its result, and `extract_refund()` returns the refund as structured output.

        How should you complete the code? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Wingtip Toys exécute un assistant de remboursement qui répond aux clients à partir de passages de stratégie récupérés. Il dispose de deux déploiements : **help-mini** (gpt-4.1-mini) et **help-large** (gpt-4.1). Environ 85 % des requêtes sont simples, et help-mini y répond bien.

        La solution doit répondre aux exigences suivantes :

        - Réduire au minimum le coût des modèles.
        - N'utiliser help-large que pour les requêtes sur lesquelles la réponse de help-mini échoue à un contrôle d'ancrage au regard des passages.
        - Les remboursements de plus de 200 USD exigent toujours l'approbation d'un responsable, quoi qu'écrivent les modèles, et la décision doit être reproductible pour les audits.

        La fonction `groundedness()` exécute l'évaluateur Groundedness et renvoie son résultat, et `extract_refund()` renvoie le remboursement sous forme de sortie structurée.

        Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: python
      template: |
        draft = answer(deployment=[[first]], question=question, passages=passages)
        check = groundedness(query=question, response=draft, context=passages)
        if [[escalate]]:
            draft = answer(deployment=[[second]], question=question, passages=passages)

        refund = extract_refund(draft)    # {"order_id": str, "amount": float}
        if [[rule]]:
            queue_for_manager(refund)
        else:
            confirm_refund(refund)
      slots:
        - id: first
          options:
            - { id: mini, text: "\"help-mini\"" }
            - { id: large, text: "\"help-large\"" }
            - { id: router, text: "\"router-help\"" }
        - id: escalate
          options:
            - { id: notpassed, text: "not check[\"passed\"]" }
            - { id: passed, text: "check[\"passed\"]" }
            - { id: anyscore, text: "check[\"score\"] >= 1" }
        - id: second
          options:
            - { id: mini2, text: "\"help-mini\"" }
            - { id: large2, text: "\"help-large\"" }
            - { id: router2, text: "\"router-help\"" }
        - id: rule
          options:
            - { id: amount, text: "refund[\"amount\"] > 200" }
            - { id: text, text: "\"manager\" in draft.lower()" }
            - { id: lowscore, text: "check[\"score\"] < 3" }
    answer:
      values: { first: mini, escalate: notpassed, second: large2, rule: amount }
    explanation:
      correct:
        en: |
          This is a cascade: the cheaper model answers first, and the request escalates to the larger model only when the check of its draft fails, so the call to help-large runs when `passed` is false. The approval threshold is a deterministic rule applied in code to the extracted amount, so it applies whatever the models write and gives the same decision for the same refund.
        fr: |
          Il s'agit d'une cascade : le modèle le moins coûteux répond d'abord, et la requête n'est escaladée vers le modèle plus grand que si le contrôle de son brouillon échoue ; l'appel à help-large s'exécute donc quand `passed` vaut false. Le seuil d'approbation est une règle déterministe appliquée dans le code au montant extrait : il s'applique quoi qu'écrivent les modèles et donne la même décision pour le même remboursement.
      options:
        large: { en: "Starting every request with gpt-4.1 removes the cost benefit of the cascade.", fr: "Commencer chaque requête par gpt-4.1 supprime l'avantage de coût de la cascade." }
        router: { en: "Model router chooses a model before any answer exists; it can't escalate on the result of a check of the answer.", fr: "Model router choisit un modèle avant qu'une réponse existe ; il ne peut pas escalader en fonction du résultat d'un contrôle de la réponse." }
        passed: { en: "This condition sends the grounded drafts to help-large and keeps the failed ones.", fr: "Cette condition envoie à help-large les brouillons ancrés et garde ceux qui ont échoué." }
        anyscore: { en: "Scores range from 1 to 5, so this condition is always true and every request reaches help-large.", fr: "Les scores vont de 1 à 5 : cette condition est donc toujours vraie et chaque requête atteint help-large." }
        text: { en: "Searching the model's text makes the approval depend on what the model writes, which the requirements forbid.", fr: "Chercher dans le texte du modèle fait dépendre l'approbation de ce qu'écrit le modèle, ce que les exigences interdisent." }
        mini2: { en: "Sending the failed request to help-mini again repeats the model whose answer just failed the check.", fr: "Renvoyer la requête en échec à help-mini répète le modèle dont la réponse vient d'échouer au contrôle." }
        router2: { en: "The requirement names help-large for the escalation; model router could choose any model of its subset, including a small one.", fr: "L'exigence désigne help-large pour l'escalade ; model router pourrait choisir n'importe quel modèle de son sous-ensemble, y compris un petit." }
        lowscore: { en: "The groundedness score measures support by the passages, not the refund amount.", fr: "Le score d'ancrage mesure le soutien par les passages, pas le montant du remboursement." }
    references:
      - title: Design Model Routing for Agent Ecosystems
        url: https://learn.microsoft.com/en-us/training/modules/aaai-optimize-multi-agent-performance-cost-azure/2-design-model-route-agent-ecosystems
      - title: What is model router in Microsoft Foundry?
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-23-07
    objective: "2.3.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam's ticket-triage service calls the Chat Completions API. The team is replacing a **gpt-4.1** deployment with a **gpt-5-mini** deployment, a reasoning model, and keeps the developer message and the user message unchanged. The current requests also set `temperature` to 0.2 and `max_tokens` to 800.

        The requests to the new deployment must meet the following requirements:

        - The requests must succeed.
        - The model must spend little effort reasoning on this simple classification.
        - While the team measures how many reasoning tokens the workload typically uses, the token cap must follow Microsoft's starting recommendation, so that responses aren't cut off before any visible output.

        Besides `model` and `messages`, which parameters should the request body contain?
      fr: |
        Le service de tri des tickets de Fabrikam appelle l'API Chat Completions. L'équipe remplace un déploiement **gpt-4.1** par un déploiement **gpt-5-mini**, un modèle de raisonnement, et conserve à l'identique le message développeur et le message utilisateur. Les requêtes actuelles définissent aussi `temperature` sur 0,2 et `max_tokens` sur 800.

        Les requêtes vers le nouveau déploiement doivent répondre aux exigences suivantes :

        - Les requêtes doivent réussir.
        - Le modèle doit consacrer peu d'effort au raisonnement pour cette classification simple.
        - Pendant que l'équipe mesure combien de jetons de raisonnement la charge de travail consomme habituellement, le plafond de jetons doit suivre la recommandation de départ de Microsoft, pour que les réponses ne soient pas coupées avant toute sortie visible.

        Outre `model` et `messages`, quels paramètres le corps de la requête doit-il contenir ?
    body:
      options:
        - { id: a, text: { en: "`\"reasoning_effort\": \"low\"` and `\"max_tokens\": 25000`", fr: "`\"reasoning_effort\": \"low\"` et `\"max_tokens\": 25000`" } }
        - { id: b, text: { en: "`\"reasoning\": {\"effort\": \"low\"}` and `\"max_output_tokens\": 25000`", fr: "`\"reasoning\": {\"effort\": \"low\"}` et `\"max_output_tokens\": 25000`" } }
        - { id: c, text: { en: "`\"reasoning_effort\": \"low\"`, `\"max_completion_tokens\": 800` and `\"temperature\": 0`", fr: "`\"reasoning_effort\": \"low\"`, `\"max_completion_tokens\": 800` et `\"temperature\": 0`" } }
        - { id: d, text: { en: "`\"reasoning_effort\": \"low\"` and `\"max_completion_tokens\": 25000`", fr: "`\"reasoning_effort\": \"low\"` et `\"max_completion_tokens\": 25000`" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          With the Chat Completions API, `reasoning_effort` sets the effort and `max_completion_tokens` caps everything the model generates, reasoning tokens included. Learn recommends reserving at least 25,000 tokens for reasoning and output on a new workload, then tuning the cap once the typical reasoning usage is known. `temperature` and `max_tokens` aren't supported by the model and must be removed.
        fr: |
          Avec l'API Chat Completions, `reasoning_effort` règle l'effort et `max_completion_tokens` plafonne tout ce que le modèle génère, jetons de raisonnement compris. Learn recommande de réserver au moins 25 000 jetons pour le raisonnement et la sortie sur une nouvelle charge de travail, puis d'ajuster le plafond une fois l'utilisation habituelle du raisonnement connue. `temperature` et `max_tokens` ne sont pas pris en charge par le modèle et doivent être retirés.
      options:
        a: { en: "`max_tokens` is one of the parameters that reasoning models don't support: the request fails.", fr: "`max_tokens` fait partie des paramètres que les modèles de raisonnement ne prennent pas en charge : la requête échoue." }
        b: { en: "The `reasoning` object and `max_output_tokens` are the Responses API syntax; the Chat Completions API uses `reasoning_effort` and `max_completion_tokens`.", fr: "L'objet `reasoning` et `max_output_tokens` relèvent de la syntaxe de l'API Responses ; l'API Chat Completions utilise `reasoning_effort` et `max_completion_tokens`." }
        c: { en: "`temperature` makes the request fail, and 800 tokens must hold the reasoning tokens too, so responses can end before any visible output.", fr: "`temperature` fait échouer la requête, et les 800 jetons doivent aussi contenir les jetons de raisonnement : les réponses peuvent s'arrêter avant toute sortie visible." }
    references:
      - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-23-08
    objective: "2.3.3"
    difficulty: 3
    status: draft
    type: multi
    stem:
      en: |
        Litware's travel assistant is a Python application that calls a **gpt-4.1** deployment with three function tools, which the application executes. The application exports OpenTelemetry traces to Application Insights. The trace of a typical slow run shows the following spans:

        | Span | Starts at | Duration | Details |
        | --- | --- | --- | --- |
        | Model call 1 | 0.0 s | 1.1 s | Returns three tool calls |
        | execute_tool (get_flights) | 1.1 s | 3.0 s | Flights API |
        | execute_tool (get_hotels) | 4.1 s | 3.1 s | Hotels API |
        | execute_tool (get_rates) | 7.2 s | 2.6 s | Exchange-rate API; the rates are published once a day |
        | Model call 2 | 9.8 s | 1.8 s | 350 output tokens |

        The three tool calls don't depend on each other's results. You need to reduce the end-to-end duration of the runs. The assistant must keep the same deployment and the same answer length.

        Which two actions should you perform? Each correct answer presents a complete solution.

        NOTE: Each correct selection is worth one point.
      fr: |
        L'assistant de voyage de Litware est une application Python qui appelle un déploiement **gpt-4.1** avec trois outils de fonction, que l'application exécute. L'application exporte des traces OpenTelemetry vers Application Insights. La trace d'une exécution lente typique montre les étendues suivantes :

        | Étendue | Début | Durée | Détails |
        | --- | --- | --- | --- |
        | Appel au modèle 1 | 0,0 s | 1,1 s | Renvoie trois appels d'outils |
        | execute_tool (get_flights) | 1,1 s | 3,0 s | API des vols |
        | execute_tool (get_hotels) | 4,1 s | 3,1 s | API des hôtels |
        | execute_tool (get_rates) | 7,2 s | 2,6 s | API des taux de change ; les taux sont publiés une fois par jour |
        | Appel au modèle 2 | 9,8 s | 1,8 s | 350 jetons de sortie |

        Les trois appels d'outils ne dépendent pas des résultats les uns des autres. Vous devez réduire la durée de bout en bout des exécutions. L'assistant doit conserver le même déploiement et la même longueur de réponse.

        Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

        Remarque : chaque sélection correcte vaut un point.
    body:
      choose: 2
      options:
        - { id: a, text: { en: "Stream the final answer to the user interface as it's generated.", fr: "Diffuser la réponse finale en continu vers l'interface utilisateur pendant sa génération." } }
        - { id: b, text: { en: "Run the three tool calls concurrently instead of one after the other.", fr: "Exécuter les trois appels d'outils en parallèle plutôt que l'un après l'autre." } }
        - { id: c, text: { en: "Lower the output token limit of the second model call.", fr: "Baisser la limite de jetons de sortie du second appel au modèle." } }
        - { id: d, text: { en: "Cache the exchange-rate API responses and reuse them during the day.", fr: "Mettre en cache les réponses de l'API des taux de change et les réutiliser pendant la journée." } }
        - { id: e, text: { en: "Move the model to a provisioned deployment with dedicated capacity.", fr: "Déplacer le modèle vers un déploiement provisionné à capacité dédiée." } }
    answer: { optionIds: [b, d] }
    explanation:
      correct:
        en: |
          The trace splits the 11.6 seconds of the run into steps: the three tool spans run one after the other and take 8.7 seconds, while the two model calls take 2.9 seconds. Running the independent calls concurrently brings the tool phase down to about the longest call, and caching rates that change once a day removes a 2.6-second call from most runs.
        fr: |
          La trace décompose les 11,6 secondes de l'exécution en étapes : les trois étendues d'outils s'exécutent l'une après l'autre et prennent 8,7 secondes, tandis que les deux appels au modèle prennent 2,9 secondes. Exécuter en parallèle les appels indépendants ramène la phase des outils à peu près à l'appel le plus long, et mettre en cache des taux qui changent une fois par jour supprime un appel de 2,6 secondes de la plupart des exécutions.
      options:
        a: { en: "Streaming shortens the wait for the first token, not the end-to-end duration, and the slow part is in the tool spans.", fr: "Le streaming raccourcit l'attente du premier jeton, pas la durée de bout en bout, et la partie lente se trouve dans les étendues d'outils." }
        c: { en: "The answer length must stay the same, and the second model call takes only 1.8 seconds of the run.", fr: "La longueur de réponse doit rester la même, et le second appel au modèle ne prend que 1,8 seconde de l'exécution." }
        e: { en: "Provisioned capacity addresses variable model latency under load; here the model calls aren't what makes the run slow.", fr: "La capacité provisionnée traite une latence de modèle variable sous charge ; ici, ce ne sont pas les appels au modèle qui ralentissent l'exécution." }
    references:
      - title: Agent tracing overview
        url: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept
      - title: Azure OpenAI in Microsoft Foundry Models performance & latency
        url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-23-09
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Adatum Corporation's RAG application drafts answers with a **gpt-4.1** deployment. Before each answer is returned, a critique step must decide whether the draft is supported by the retrieved passages, and the loop must read a pass or fail value from the result. The project also has a **gpt-4.1-mini** deployment.

        The solution must meet the following requirements:

        - Use only generally available features in production.
        - The critique step must cost less per request than the drafting model would.

        What should you use as the critique step?
      fr: |
        L'application RAG d'Adatum Corporation rédige des réponses avec un déploiement **gpt-4.1**. Avant que chaque réponse soit renvoyée, une étape de critique doit décider si le brouillon est étayé par les passages récupérés, et la boucle doit lire une valeur réussite ou échec dans le résultat. Le projet dispose aussi d'un déploiement **gpt-4.1-mini**.

        La solution doit répondre aux exigences suivantes :

        - N'utiliser en production que des fonctionnalités généralement disponibles.
        - L'étape de critique doit coûter moins cher par requête que ne le ferait le modèle de rédaction.

        Que devez-vous utiliser comme étape de critique ?
    body:
      options:
        - { id: a, text: { en: "The Groundedness Pro evaluator, reading the pass or fail result that it returns", fr: "L'évaluateur Groundedness Pro, en lisant le résultat réussite ou échec qu'il renvoie" } }
        - { id: b, text: { en: "The Relevance evaluator with gpt-4.1-mini as the judge, reading its `passed` field", fr: "L'évaluateur Relevance avec gpt-4.1-mini comme juge, en lisant son champ `passed`" } }
        - { id: c, text: { en: "The Groundedness evaluator with gpt-4.1-mini as the judge, reading its `passed` field", fr: "L'évaluateur Groundedness avec gpt-4.1-mini comme juge, en lisant son champ `passed`" } }
        - { id: d, text: { en: "The Groundedness evaluator with gpt-4.1 as the judge, passing only drafts scored 5", fr: "L'évaluateur Groundedness avec gpt-4.1 comme juge, en ne validant que les brouillons notés 5" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          Groundedness measures whether the response is supported by the context; it isn't marked preview and uses a model deployment as the judge, which can be the cheaper gpt-4.1-mini. Its result contains a 1 to 5 score, a reason, the threshold and a `passed` value, which the loop can read directly.
        fr: |
          Groundedness mesure si la réponse est étayée par le contexte ; il n'est pas marqué en préversion et utilise un déploiement de modèle comme juge, qui peut être le gpt-4.1-mini moins coûteux. Son résultat contient un score de 1 à 5, une raison, le seuil et une valeur `passed` que la boucle peut lire directement.
      options:
        a: { en: "Groundedness Pro returns a pass or fail result without a model deployment, but it's in preview, which the requirements exclude.", fr: "Groundedness Pro renvoie un résultat réussite ou échec sans déploiement de modèle, mais il est en préversion, ce que les exigences excluent." }
        b: { en: "Relevance judges whether the response addresses the query, not whether the retrieved passages support it.", fr: "Relevance juge si la réponse traite la requête, pas si les passages récupérés l'étayent." }
        d: { en: "A gpt-4.1 judge costs as much as the drafting model, and requiring a 5 rejects drafts that the default threshold of 3 accepts.", fr: "Un juge gpt-4.1 coûte autant que le modèle de rédaction, et exiger un 5 rejette des brouillons que le seuil par défaut de 3 accepte." }
    references:
      - title: Built-in Evaluators Reference
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
      - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-23-10
    objective: "2.3.2"
    difficulty: 3
    status: draft
    type: hotarea
    stem:
      en: |
        Proseware answers warranty questions with a **gpt-4.1-mini** deployment and retrieved warranty passages. A bounded self-critique loop checks each draft with the Groundedness evaluator, which keeps its default threshold, and uses the reason returned by the evaluator to revise failed drafts:

        ```python
        MAX_ROUNDS = 2
        draft = generate(question, passages)
        for round in range(1, MAX_ROUNDS + 1):
            result = groundedness(query=question, response=draft, context=passages)
            log(request_id, round, result["score"], result["reason"])
            if result["passed"]:
                return draft
            draft = revise(draft, result["reason"], passages)
        return send_to_reviewer(draft)
        ```

        The table shows the logged results of three requests.

        Answer each prompt by selecting the logged result in the table.

        NOTE: Each correct selection is worth one point.
      fr: |
        Proseware répond aux questions de garantie avec un déploiement **gpt-4.1-mini** et des passages de garantie récupérés. Une boucle d'autocritique bornée vérifie chaque brouillon avec l'évaluateur Groundedness, qui conserve son seuil par défaut, et utilise la raison renvoyée par l'évaluateur pour réviser les brouillons en échec :

        ```python
        MAX_ROUNDS = 2
        draft = generate(question, passages)
        for round in range(1, MAX_ROUNDS + 1):
            result = groundedness(query=question, response=draft, context=passages)
            log(request_id, round, result["score"], result["reason"])
            if result["passed"]:
                return draft
            draft = revise(draft, result["reason"], passages)
        return send_to_reviewer(draft)
        ```

        Le tableau présente les résultats journalisés de trois requêtes.

        Répondez à chaque consigne en sélectionnant le résultat journalisé dans le tableau.

        Remarque : chaque sélection correcte vaut un point.
    body:
      prompts:
        - id: p1
          text: { en: "The logged result after which the loop sends a draft to a human reviewer", fr: "Le résultat journalisé après lequel la boucle envoie un brouillon à un relecteur humain" }
        - id: p2
          text: { en: "The logged result after which the loop returns a draft that contains a detail the passages don't support", fr: "Le résultat journalisé après lequel la boucle renvoie un brouillon qui contient un détail que les passages n'étayent pas" }
      grid:
        header: [{ en: "Result", fr: "Résultat" }, { en: "Request", fr: "Requête" }, { en: "Round", fr: "Tour" }, { en: "Score", fr: "Score" }, { en: "Reason", fr: "Raison" }]
        rows:
          - [{ text: L1, area: l1 }, { text: R1 }, { text: "1" }, { text: "2" }, { text: { en: "States a 60-day return window; the passages give 30 days.", fr: "Indique un délai de retour de 60 jours ; les passages donnent 30 jours." } }]
          - [{ text: L2, area: l2 }, { text: R1 }, { text: "2" }, { text: "3" }, { text: { en: "Mostly grounded; the opening hours of the repair center aren't in the passages.", fr: "Globalement ancré ; les horaires du centre de réparation ne figurent pas dans les passages." } }]
          - [{ text: L3, area: l3 }, { text: R2 }, { text: "1" }, { text: "1" }, { text: { en: "Cites an accidental-damage clause that the passages don't contain.", fr: "Cite une clause de dommages accidentels que les passages ne contiennent pas." } }]
          - [{ text: L4, area: l4 }, { text: R2 }, { text: "2" }, { text: "2" }, { text: { en: "Still mentions the accidental-damage clause.", fr: "Mentionne toujours la clause de dommages accidentels." } }]
          - [{ text: L5, area: l5 }, { text: R3 }, { text: "1" }, { text: "5" }, { text: { en: "Fully supported by the passages.", fr: "Entièrement étayé par les passages." } }]
    answer:
      values: { p1: l4, p2: l2 }
    explanation:
      correct:
        en: |
          Groundedness returns a score from 1 to 5 with a default pass threshold of 3, and scores at or above the threshold pass. R2 fails in both rounds (L3 and L4), so after L4 the loop revises the draft a last time and sends it to the reviewer. In R1, the second round scores 3 and passes, so the loop returns that draft although its reason mentions opening hours that the passages don't contain.
        fr: |
          Groundedness renvoie un score de 1 à 5 avec un seuil de réussite par défaut de 3, et les scores égaux ou supérieurs au seuil sont considérés comme réussis. R2 échoue aux deux tours (L3 et L4) : après L4, la boucle révise donc le brouillon une dernière fois et l'envoie au relecteur. Pour R1, le second tour obtient 3 et réussit : la boucle renvoie ce brouillon, bien que sa raison mentionne des horaires que les passages ne contiennent pas.
      options:
        l1: { en: "A score of 2 fails, but this was the first round of R1: the loop revises the draft and checks it again.", fr: "Un score de 2 échoue, mais il s'agit du premier tour de R1 : la boucle révise le brouillon et le vérifie à nouveau." }
        l3: { en: "R2 still has a second round after L3; the reviewer only receives the draft once the last round has failed.", fr: "R2 dispose encore d'un second tour après L3 ; le relecteur ne reçoit le brouillon qu'une fois le dernier tour en échec." }
    references:
      - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
        url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
