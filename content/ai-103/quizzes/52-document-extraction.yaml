chapter: 52-document-extraction
questions:
  # ------------------------------------------------------------------ 1
  - id: ai103-qz-52-01
    objective: "5.2.2"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Wingtip Toys has 80,000 photos of its products, and the photos contain almost no text. Each photo must become a text description of its visual content that a RAG pipeline indexes in Azure AI Search.

        Which prebuilt Azure Content Understanding analyzer should you use?
      fr: |
        Wingtip Toys dispose de 80 000 photos de ses produits, et ces photos ne contiennent presque pas de texte. Chaque photo doit devenir une description textuelle de son contenu visuel, qu'un pipeline RAG indexe dans Azure AI Search.

        Quel analyseur prédéfini d'Azure Content Understanding devez-vous utiliser ?
    body:
      options:
        - { id: a, text: prebuilt-read }
        - { id: b, text: prebuilt-layout }
        - { id: c, text: prebuilt-imageSearch }
        - { id: d, text: prebuilt-videoSearch }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          `prebuilt-imageSearch` is the RAG analyzer for images: it generates a one-paragraph description of the image content and extracts visual content for search and retrieval. The description is the text that the pipeline chunks, embeds and indexes.
        fr: |
          `prebuilt-imageSearch` est l'analyseur RAG des images : il génère une description d'un paragraphe du contenu de l'image et extrait le contenu visuel pour la recherche et la récupération. Cette description est le texte que le pipeline découpe, vectorise et indexe.
      options:
        a: { en: "`prebuilt-read` returns the words, paragraphs and barcodes of a document (OCR); photos with almost no text would return almost nothing.", fr: "`prebuilt-read` renvoie les mots, paragraphes et codes-barres d'un document (OCR) ; des photos presque sans texte ne renverraient presque rien." }
        b: { en: "`prebuilt-layout` adds tables, figures and sections to the text of documents; it doesn't describe what a photo shows.", fr: "`prebuilt-layout` ajoute les tableaux, figures et sections au texte des documents ; il ne décrit pas ce que montre une photo." }
        d: { en: "`prebuilt-videoSearch` produces per-segment transcripts and descriptions of videos, not of still images.", fr: "`prebuilt-videoSearch` produit des transcriptions et des descriptions par segment de vidéos, pas d'images fixes." }
    references:
      - title: Azure Content Understanding in Foundry Tools prebuilt analyzers - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers

  # ------------------------------------------------------------------ 2
  - id: ai103-qz-52-02
    objective: "5.2.1"
    difficulty: 1
    status: draft
    type: single
    stem:
      en: |
        Adatum plans to analyze scanned purchase orders with Azure Content Understanding. The Foundry resource doesn't have any model deployment yet.

        Which capability requires a chat completion model deployment?
      fr: |
        Adatum prévoit d'analyser des bons de commande numérisés avec Azure Content Understanding. La ressource Foundry n'a encore aucun déploiement de modèle.

        Quelle fonctionnalité exige un déploiement de modèle de complétion de conversation ?
    body:
      options:
        - { id: a, text: { en: "Reading the text of each scanned page", fr: "Lire le texte de chaque page numérisée" } }
        - { id: b, text: { en: "Returning the tables and sections of each order", fr: "Renvoyer les tableaux et les sections de chaque commande" } }
        - { id: c, text: { en: "Reading the barcode printed on each order", fr: "Lire le code-barres imprimé sur chaque commande" } }
        - { id: d, text: { en: "Filling the fields of a schema from each order", fr: "Remplir les champs d'un schéma à partir de chaque commande" } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Field extraction fills the fields of a field schema by using a generative model, so it needs a chat completion deployment mapped to the analyzer's completion model. Content extraction (OCR, barcodes, layout) doesn't: `prebuilt-read` and `prebuilt-layout` run without any language or embedding model.
        fr: |
          L'extraction de champs remplit les champs d'un schéma à l'aide d'un modèle génératif : elle exige un déploiement de complétion de conversation associé au modèle de complétion de l'analyseur. L'extraction de contenu (OCR, codes-barres, disposition) n'en a pas besoin : `prebuilt-read` et `prebuilt-layout` s'exécutent sans modèle de langage ni modèle d'embedding.
      options:
        a: { en: "Reading text is OCR, which `prebuilt-read` performs without a language model.", fr: "Lire le texte relève de l'OCR, que `prebuilt-read` réalise sans modèle de langage." }
        b: { en: "Tables and sections come from layout analysis, which `prebuilt-layout` performs without a language model.", fr: "Les tableaux et les sections viennent de l'analyse de la disposition, que `prebuilt-layout` réalise sans modèle de langage." }
        c: { en: "Barcodes are part of content extraction, returned by `prebuilt-read` without a language model.", fr: "Les codes-barres font partie de l'extraction de contenu, renvoyée par `prebuilt-read` sans modèle de langage." }
    references:
      - title: Azure Content Understanding in Foundry Tools prebuilt analyzers - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
      - title: Model deployment options for Content Understanding analyzers - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments

  # ------------------------------------------------------------------ 3
  - id: ai103-qz-52-03
    objective: "5.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Fabrikam receives insurance claim files that bundle claim forms, repair invoices and cover letters. A Content Understanding analyzer has `enableSegment` set to true and defines categories that route claim forms to a custom analyzer and repair invoices to `prebuilt-invoice`. It also defines an `other` category.

        Cover letters must be identified as such in the results, but no further analysis must run on them. How should you define the `coverLetter` category?
      fr: |
        Fabrikam reçoit des dossiers de sinistre qui regroupent des formulaires de déclaration, des factures de réparation et des lettres d'accompagnement. Un analyseur Content Understanding a `enableSegment` défini sur true et définit des catégories qui routent les formulaires de déclaration vers un analyseur personnalisé et les factures de réparation vers `prebuilt-invoice`. Il définit aussi une catégorie `other`.

        Les lettres d'accompagnement doivent être identifiées comme telles dans les résultats, mais aucune autre analyse ne doit s'exécuter sur elles. Comment devez-vous définir la catégorie `coverLetter` ?
    body:
      options:
        - { id: a, text: { en: "With a description and `analyzerId` set to `prebuilt-read`", fr: "Avec une description et `analyzerId` défini sur `prebuilt-read`" } }
        - { id: b, text: { en: "Without any definition, so that the `other` category receives them", fr: "Sans aucune définition, pour que la catégorie `other` les reçoive" } }
        - { id: c, text: { en: "With a description and no `analyzerId` property", fr: "Avec une description et sans propriété `analyzerId`" } }
        - { id: d, text: { en: "With a description and `analyzerId` set to `prebuilt-document`", fr: "Avec une description et `analyzerId` défini sur `prebuilt-document`" } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          A category whose definition omits `analyzerId` is classified, so its segments appear in the results with the `coverLetter` category, but no content analysis runs on them. The description tells the classifier what a cover letter looks like.
        fr: |
          Une catégorie dont la définition omet `analyzerId` est classée : ses segments apparaissent dans les résultats avec la catégorie `coverLetter`, mais aucune analyse de contenu ne s'exécute sur eux. La description indique au classifieur à quoi ressemble une lettre d'accompagnement.
      options:
        a: { en: "Routing to `prebuilt-read` runs an OCR analysis on every cover letter, which the requirement excludes.", fr: "Le routage vers `prebuilt-read` exécute une analyse OCR sur chaque lettre d'accompagnement, ce que l'exigence exclut." }
        b: { en: "Cover letters would be labeled `other`, mixed with every unmatched page, so they wouldn't be identified as cover letters.", fr: "Les lettres d'accompagnement seraient marquées `other`, mêlées à toutes les pages sans correspondance : elles ne seraient pas identifiées comme lettres d'accompagnement." }
        d: { en: "Routing to a base analyzer still runs content analysis on the cover letters.", fr: "Le routage vers un analyseur de base exécute quand même une analyse de contenu sur les lettres d'accompagnement." }
    references:
      - title: Azure Content Understanding in Foundry Tools Classifier Overview - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier

  # ------------------------------------------------------------------ 4
  - id: ai103-qz-52-04
    objective: "5.2.2"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Contoso uses a custom Content Understanding analyzer derived from `prebuilt-document` to turn PDF maintenance manuals into Markdown for a RAG index. The manuals contain many photos and illustrations of equipment, and very few charts.

        The Markdown must include a natural-language text for each photo and illustration so that the agent can answer questions about what they show. Chart data isn't needed. Which setting should you set to true in the analyzer configuration?
      fr: |
        Contoso utilise un analyseur Content Understanding personnalisé dérivé de `prebuilt-document` pour transformer des manuels de maintenance PDF en Markdown pour un index RAG. Les manuels contiennent de nombreuses photos et illustrations d'équipements, et très peu de graphiques.

        Le Markdown doit inclure un texte en langage naturel pour chaque photo et chaque illustration, afin que l'agent puisse répondre aux questions sur ce qu'elles montrent. Les données des graphiques ne sont pas nécessaires. Quel paramètre devez-vous définir sur true dans la configuration de l'analyseur ?
    body:
      options:
        - { id: a, text: enableFigureAnalysis }
        - { id: b, text: returnDetails }
        - { id: c, text: enableLayout }
        - { id: d, text: enableFigureDescription }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          `enableFigureDescription` generates natural-language descriptions of figures, diagrams, images and illustrations, and is `false` by default. The descriptions become part of the Markdown, so the chunks contain text that answers questions about the photos.
        fr: |
          `enableFigureDescription` génère des descriptions en langage naturel des figures, diagrammes, images et illustrations, et vaut `false` par défaut. Les descriptions font partie du Markdown : les blocs contiennent donc un texte qui répond aux questions sur les photos.
      options:
        a: { en: "`enableFigureAnalysis` extracts chart data and diagram components (chart.js, mermaid.js), which the scenario doesn't need.", fr: "`enableFigureAnalysis` extrait les données des graphiques et les composants des diagrammes (chart.js, mermaid.js), ce dont le scénario n'a pas besoin." }
        b: { en: "`returnDetails` adds confidence, bounding boxes and spans to the response; it doesn't describe figures.", fr: "`returnDetails` ajoute confiance, cadres englobants et étendues à la réponse ; il ne décrit pas les figures." }
        c: { en: "`enableLayout` is already true by default; it locates figures but doesn't describe them.", fr: "`enableLayout` vaut déjà true par défaut ; il localise les figures mais ne les décrit pas." }
    references:
      - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
      - title: "Document Analysis: Extract Structured Content with Azure Content Understanding in Foundry Tools - Foundry Tools"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/elements

  # ------------------------------------------------------------------ 5
  - id: ai103-qz-52-05
    objective: "5.2.3"
    difficulty: 2
    status: draft
    type: single
    stem:
      en: |
        Litware's mailroom uploads each received document as its own PDF file. A file contains exactly one document: an invoice, a receipt, or a contract of up to 40 pages. Files of other kinds also arrive.

        You are defining a Content Understanding analyzer that routes each file to `prebuilt-invoice`, `prebuilt-receipt` or `prebuilt-contract` in a single analyze call. Each file must be classified as a whole into one category, and files of other kinds must not be forced into one of the three categories.

        Which configuration should you use?
      fr: |
        Le service courrier de Litware charge chaque document reçu dans son propre fichier PDF. Un fichier contient exactement un document : une facture, un reçu, ou un contrat de 40 pages au plus. Des fichiers d'autres types arrivent aussi.

        Vous définissez un analyseur Content Understanding qui route chaque fichier vers `prebuilt-invoice`, `prebuilt-receipt` ou `prebuilt-contract` en un seul appel d'analyse. Chaque fichier doit être classé dans son ensemble dans une seule catégorie, et les fichiers d'autres types ne doivent pas être forcés dans l'une des trois catégories.

        Quelle configuration devez-vous utiliser ?
    body:
      options:
        - { id: a, text: { en: "Three categories with an `analyzerId` each, an `other` category, and `enableSegment` set to true", fr: "Trois catégories avec chacune un `analyzerId`, une catégorie `other`, et `enableSegment` défini sur true" } }
        - { id: b, text: { en: "Three categories with an `analyzerId` each, an `other` category, and `enableSegment` set to false", fr: "Trois catégories avec chacune un `analyzerId`, une catégorie `other`, et `enableSegment` défini sur false" } }
        - { id: c, text: { en: "Three categories with an `analyzerId` each, no `other` category, and `enableSegment` set to false", fr: "Trois catégories avec chacune un `analyzerId`, sans catégorie `other`, et `enableSegment` défini sur false" } }
        - { id: d, text: { en: "A `DocumentType` field that uses the `classify` method, and no `contentCategories` property", fr: "Un champ `DocumentType` qui utilise la méthode `classify`, et aucune propriété `contentCategories`" } }
    answer: { optionId: b }
    explanation:
      correct:
        en: |
          With `enableSegment` set to false, the whole file is treated as one document and receives a single category, which is then analyzed by the `analyzerId` of that category. Since the GA version, the `other` category must be included for content that matches none of your categories; without it, every file is forced into one of them.
        fr: |
          Avec `enableSegment` défini sur false, le fichier entier est traité comme un seul document et reçoit une seule catégorie, puis il est analysé par l'`analyzerId` de cette catégorie. Depuis la version en disponibilité générale, la catégorie `other` doit être incluse pour le contenu qui ne correspond à aucune de vos catégories ; sans elle, chaque fichier est forcé dans l'une d'elles.
      options:
        a: { en: "With segmentation, the service splits a file into segments and classifies each one, so a long contract could be cut into several parts.", fr: "Avec la segmentation, le service découpe un fichier en segments et classe chacun : un long contrat pourrait être coupé en plusieurs parties." }
        c: { en: "Without the `other` category, files of other kinds are forced into the invoice, receipt or contract category.", fr: "Sans catégorie `other`, les fichiers d'autres types sont forcés dans la catégorie facture, reçu ou contrat." }
        d: { en: "A classify field labels the file but doesn't route it to the prebuilt analyzers: a second call per file would be needed.", fr: "Un champ classify étiquette le fichier mais ne le route pas vers les analyseurs prédéfinis : un second appel par fichier serait nécessaire." }
    references:
      - title: Azure Content Understanding in Foundry Tools Classifier Overview - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier

  # ------------------------------------------------------------------ 6
  - id: ai103-qz-52-06
    objective: "5.2.2"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Woodgrove Bank processes scanned loan agreements of 20 to 60 pages. Two consumers use the results:

        - A review application shows 15 fields per agreement, highlights where each value appears on its page, and sends low-confidence values to a reviewer.
        - A Foundry agent answers free-form questions about the agreements and cites the file and page of each passage that it uses.

        Each agreement must be analyzed only once, and the solution must minimize custom code. What should you do?
      fr: |
        Woodgrove Bank traite des contrats de prêt numérisés de 20 à 60 pages. Deux consommateurs utilisent les résultats :

        - une application de révision affiche 15 champs par contrat, met en évidence l'emplacement de chaque valeur sur sa page et envoie les valeurs peu fiables à un réviseur ;
        - un agent Foundry répond à des questions libres sur les contrats et cite le fichier et la page de chaque passage qu'il utilise.

        Chaque contrat ne doit être analysé qu'une seule fois, et la solution doit réduire au minimum le code personnalisé. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Analyze each agreement with `prebuilt-documentSearch`, index its Markdown chunks with the file name and page, and show its summary in the review application.", fr: "Analyser chaque contrat avec `prebuilt-documentSearch`, indexer ses blocs Markdown avec le nom du fichier et la page, et afficher son résumé dans l'application de révision." } }
        - { id: b, text: { en: "Analyze each agreement with a custom analyzer that has a field schema, `estimateFieldSourceAndConfidence` and `omitContent`, and index the field values for the agent.", fr: "Analyser chaque contrat avec un analyseur personnalisé doté d'un schéma de champs, de `estimateFieldSourceAndConfidence` et de `omitContent`, et indexer les valeurs des champs pour l'agent." } }
        - { id: c, text: { en: "Analyze each agreement with a custom analyzer that has a field schema and `estimateFieldSourceAndConfidence`, store its fields, and index its Markdown with the file name and page.", fr: "Analyser chaque contrat avec un analyseur personnalisé doté d'un schéma de champs et de `estimateFieldSourceAndConfidence`, stocker ses champs, et indexer son Markdown avec le nom du fichier et la page." } }
        - { id: d, text: { en: "Send each agreement to a multimodal model with a prompt that returns the 15 values with their page numbers, and index a Markdown transcript of the agreement.", fr: "Envoyer chaque contrat à un modèle multimodal avec une invite qui renvoie les 15 valeurs avec leurs numéros de page, et indexer une transcription Markdown du contrat." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          One custom analyzer covers both levels of grounding in a single call. `estimateFieldSourceAndConfidence` returns a confidence score and the source (page and bounding box) of each field value, which drives highlighting and human review. The same result keeps `contents[].markdown`, which is chunked and indexed with the file name and page so that the agent can cite its passages.
        fr: |
          Un seul analyseur personnalisé couvre les deux niveaux d'ancrage en un seul appel. `estimateFieldSourceAndConfidence` renvoie un score de confiance et la source (page et cadre englobant) de chaque valeur de champ, ce qui permet la mise en évidence et la révision humaine. Le même résultat conserve `contents[].markdown`, qui est découpé et indexé avec le nom du fichier et la page pour que l'agent puisse citer ses passages.
      options:
        a: { en: "`prebuilt-documentSearch` returns Markdown and a summary, but not the 15 fields of a schema with a confidence score and a source location for each value.", fr: "`prebuilt-documentSearch` renvoie du Markdown et un résumé, mais pas les 15 champs d'un schéma avec un score de confiance et un emplacement source pour chaque valeur." }
        b: { en: "`omitContent` removes the content object, so the Markdown isn't returned; 15 field values can't answer free-form questions about whole agreements.", fr: "`omitContent` supprime l'objet de contenu : le Markdown n'est pas renvoyé, et 15 valeurs de champs ne peuvent pas répondre à des questions libres sur des contrats entiers." }
        d: { en: "A prompt returns an answer, not a repeatable schema with a confidence score and a bounding box per value, and it adds custom code.", fr: "Une invite renvoie une réponse, pas un schéma reproductible avec un score de confiance et un cadre englobant par valeur, et elle ajoute du code personnalisé." }
    references:
      - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
      - title: "Document Analysis: Extract Structured Content with Azure Content Understanding in Foundry Tools - Foundry Tools"
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/elements

  # ------------------------------------------------------------------ 7
  - id: ai103-qz-52-07
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: dropdown
    stem:
      en: |
        Northwind Traders records its customer support calls. A custom Azure Content Understanding analyzer must return the following fields to a CRM integration:

        - `OrderNumber`: the order number that the caller says during the call.
        - `Reason`: one of Billing, Delivery, Defect or Other.
        - `CallbackRequested`: whether the caller asks to be called back, stored in a CRM field that accepts only true or false.

        How should you complete the analyzer definition? Select the appropriate options in the answer area.

        NOTE: Each correct selection is worth one point.
      fr: |
        Northwind Traders enregistre ses appels au support client. Un analyseur Azure Content Understanding personnalisé doit renvoyer les champs suivants à une intégration CRM :

        - `OrderNumber` : le numéro de commande que l'appelant donne pendant l'appel ;
        - `Reason` : Billing, Delivery, Defect ou Other ;
        - `CallbackRequested` : si l'appelant demande à être rappelé, stocké dans un champ CRM qui n'accepte que true ou false.

        Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

        Remarque : chaque sélection correcte vaut un point.
    body:
      layout: code
      language: json
      template: |
        {
          "analyzerId": "northwindCallAnalyzer",
          "baseAnalyzerId": [[base]],
          "config": { "returnDetails": true, "locales": ["en-US"] },
          "fieldSchema": {
            "name": "CallFields",
            "fields": {
              "OrderNumber": { "type": "string", "method": [[method]], "description": "Order number that the caller gives, such as NW-20931" },
              "Reason": { "type": "string", "method": "classify", "enum": ["Billing", "Delivery", "Defect", "Other"], "description": "Main reason for the call" },
              "CallbackRequested": { "type": [[cbtype]], "method": "generate", "description": "Whether the caller asks to be called back" }
            }
          },
          "models": { "completion": "prebuilt-analyzer-completion", "embedding": "prebuilt-analyzer-embedding" }
        }
      slots:
        - id: base
          options:
            - { id: audiosearch, text: "\"prebuilt-audioSearch\"" }
            - { id: callcenter, text: "\"prebuilt-callCenter\"" }
            - { id: audio, text: "\"prebuilt-audio\"" }
            - { id: document, text: "\"prebuilt-document\"" }
        - id: method
          options:
            - { id: extract, text: "\"extract\"" }
            - { id: generate, text: "\"generate\"" }
            - { id: classify, text: "\"classify\"" }
        - id: cbtype
          options:
            - { id: boolean, text: "\"boolean\"" }
            - { id: string, text: "\"string\"" }
            - { id: number, text: "\"number\"" }
    answer:
      values: { base: audio, method: generate, cbtype: boolean }
    explanation:
      correct:
        en: |
          A custom analyzer can only derive from `prebuilt-document`, `prebuilt-image`, `prebuilt-audio` or `prebuilt-video`, and recordings use `prebuilt-audio`. The `extract` method is supported only by document analyzers, so a value spoken in a call must use `generate`, guided by its description. A true/false value is a field of type `boolean`.
        fr: |
          Un analyseur personnalisé ne peut dériver que de `prebuilt-document`, `prebuilt-image`, `prebuilt-audio` ou `prebuilt-video`, et les enregistrements utilisent `prebuilt-audio`. La méthode `extract` n'est prise en charge que par les analyseurs de documents : une valeur prononcée pendant un appel doit donc utiliser `generate`, guidée par sa description. Une valeur vrai/faux est un champ de type `boolean`.
      options:
        audiosearch: { en: "`prebuilt-audioSearch` is a RAG analyzer to call directly, not a base analyzer for custom analyzers.", fr: "`prebuilt-audioSearch` est un analyseur RAG à appeler directement, pas un analyseur de base pour les analyseurs personnalisés." }
        callcenter: { en: "`prebuilt-callCenter` is a prebuilt analyzer with its own output; it can't be a `baseAnalyzerId`.", fr: "`prebuilt-callCenter` est un analyseur prédéfini avec sa propre sortie ; il ne peut pas être un `baseAnalyzerId`." }
        document: { en: "`prebuilt-document` is the base for documents, not for audio recordings.", fr: "`prebuilt-document` est la base des documents, pas des enregistrements audio." }
        extract: { en: "`extract` is supported only by document analyzers and requires source and confidence estimation, which audio analyzers don't offer.", fr: "`extract` n'est pris en charge que par les analyseurs de documents et exige l'estimation de la source et de la confiance, que les analyseurs audio ne proposent pas." }
        classify: { en: "`classify` chooses a value from a predefined set; an order number is open-ended.", fr: "`classify` choisit une valeur dans un ensemble prédéfini ; un numéro de commande est une valeur ouverte." }
        string: { en: "A string would return text such as \"yes\", while the CRM field accepts only true or false.", fr: "Une chaîne renverrait un texte comme « yes », alors que le champ CRM n'accepte que true ou false." }
    references:
      - title: Best practices for using Content Understanding - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
      - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference

  # ------------------------------------------------------------------ 8
  - id: ai103-qz-52-08
    objective: "5.2.1"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Fabrikam Insurance extracts fields from accident claim forms with a custom Content Understanding analyzer. The completion model alias of the analyzer is mapped to a deployment that uses the default guardrail.

        For claims that describe serious injuries, the result contains guardrail warnings and the injury description fields are empty. The other claims are processed correctly.

        You need the analyzer to fill the injury fields for these claims. Guardrail protection must stay enabled on the deployment. What should you do?
      fr: |
        Fabrikam Insurance extrait des champs de formulaires de déclaration d'accident avec un analyseur Content Understanding personnalisé. L'alias du modèle de complétion de l'analyseur est associé à un déploiement qui utilise le garde-fou par défaut.

        Pour les déclarations qui décrivent des blessures graves, le résultat contient des avertissements de garde-fou et les champs de description des blessures sont vides. Les autres déclarations sont traitées correctement.

        Vous devez faire en sorte que l'analyseur remplisse les champs des blessures pour ces déclarations. La protection par garde-fou doit rester activée sur le déploiement. Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Set `estimateFieldSourceAndConfidence` to true, so that the blocked values are returned with a low confidence score.", fr: "Définir `estimateFieldSourceAndConfidence` sur true, pour que les valeurs bloquées soient renvoyées avec un score de confiance faible." } }
        - { id: b, text: { en: "Change the method of the injury fields from `extract` to `generate`, so that the model rewrites the descriptions.", fr: "Changer la méthode des champs des blessures de `extract` à `generate`, pour que le modèle reformule les descriptions." } }
        - { id: c, text: { en: "Analyze these claims with `prebuilt-layout`, which runs without the guardrails of the model deployment.", fr: "Analyser ces déclarations avec `prebuilt-layout`, qui s'exécute sans les garde-fous du déploiement de modèle." } }
        - { id: d, text: { en: "Adjust the blocking thresholds of the deployment's guardrail for the harm categories that these claims trigger.", fr: "Ajuster les seuils de blocage du garde-fou du déploiement pour les catégories de préjudice que ces déclarations déclenchent." } }
    answer: { optionId: d }
    explanation:
      correct:
        en: |
          Content Understanding applies the guardrails assigned to the connected model deployment; depending on their actions and severity thresholds, they return warnings, restrict field extraction or stop the analysis. Adjusting the blocking threshold of the categories that injury descriptions trigger lets field extraction complete while the guardrail stays active for higher severities.
        fr: |
          Content Understanding applique les garde-fous attribués au déploiement de modèle connecté ; selon leurs actions et leurs seuils de gravité, ils renvoient des avertissements, restreignent l'extraction de champs ou arrêtent l'analyse. Ajuster le seuil de blocage des catégories que déclenchent les descriptions de blessures permet à l'extraction de champs d'aboutir, tandis que le garde-fou reste actif pour les gravités plus élevées.
      options:
        a: { en: "Confidence estimation scores the values that the model returns; it doesn't release content that a guardrail restricted.", fr: "L'estimation de la confiance note les valeurs que le modèle renvoie ; elle ne libère pas un contenu qu'un garde-fou a restreint." }
        b: { en: "Both methods go through the same completion deployment and its guardrail; rewriting the text doesn't remove what the guardrail detects.", fr: "Les deux méthodes passent par le même déploiement de complétion et son garde-fou ; reformuler le texte ne supprime pas ce que le garde-fou détecte." }
        c: { en: "`prebuilt-layout` returns text and layout only; it doesn't fill the fields of the claim schema.", fr: "`prebuilt-layout` ne renvoie que le texte et la disposition ; il ne remplit pas les champs du schéma de déclaration." }
    references:
      - title: Model deployment options for Content Understanding analyzers - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments

  # ------------------------------------------------------------------ 9
  - id: ai103-qz-52-09
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: single
    stem:
      en: |
        Contoso's production application calls a custom Content Understanding analyzer named **invoiceAnalyzer** many times per hour. The `models.completion` property of the analyzer is `prebuilt-analyzer-completion`, which the defaults of the Foundry resource map to a deployment named **gpt-prod**.

        A team wants to compare the results of a new deployment named **gpt-eval** on 500 test invoices. During the test, production calls must keep using gpt-prod, and the definition of invoiceAnalyzer must not change.

        What should you do?
      fr: |
        L'application de production de Contoso appelle de nombreuses fois par heure un analyseur Content Understanding personnalisé nommé **invoiceAnalyzer**. La propriété `models.completion` de l'analyseur vaut `prebuilt-analyzer-completion`, que les valeurs par défaut de la ressource Foundry associent à un déploiement nommé **gpt-prod**.

        Une équipe veut comparer les résultats d'un nouveau déploiement nommé **gpt-eval** sur 500 factures de test. Pendant le test, les appels de production doivent continuer à utiliser gpt-prod, et la définition d'invoiceAnalyzer ne doit pas changer.

        Que devez-vous faire ?
    body:
      options:
        - { id: a, text: { en: "Map `prebuilt-analyzer-completion` to gpt-eval in the resource defaults until the test ends.", fr: "Associer `prebuilt-analyzer-completion` à gpt-eval dans les valeurs par défaut de la ressource jusqu'à la fin du test." } }
        - { id: b, text: { en: "Create a copy of invoiceAnalyzer whose `models.completion` is gpt-eval, and test with it.", fr: "Créer une copie d'invoiceAnalyzer dont `models.completion` vaut gpt-eval, et tester avec elle." } }
        - { id: c, text: { en: "Add `modelDeployments` that maps `prebuilt-analyzer-completion` to gpt-eval in each test request.", fr: "Ajouter dans chaque requête de test un `modelDeployments` qui associe `prebuilt-analyzer-completion` à gpt-eval." } }
        - { id: d, text: { en: "Set `models.completion` to gpt-eval in invoiceAnalyzer, and restore it when the test ends.", fr: "Définir `models.completion` sur gpt-eval dans invoiceAnalyzer, puis le rétablir à la fin du test." } }
    answer: { optionId: c }
    explanation:
      correct:
        en: |
          The `modelDeployments` property of an analyze request maps model aliases to deployments for that request only, and overrides the defaults configured on the resource. The 500 test requests use gpt-eval, while production requests, which don't set it, keep using gpt-prod through the unchanged analyzer and defaults.
        fr: |
          La propriété `modelDeployments` d'une requête d'analyse associe des alias de modèles à des déploiements pour cette seule requête, et remplace les valeurs par défaut configurées sur la ressource. Les 500 requêtes de test utilisent gpt-eval, tandis que les requêtes de production, qui ne la définissent pas, continuent d'utiliser gpt-prod grâce à l'analyseur et aux valeurs par défaut inchangés.
      options:
        a: { en: "Resource defaults apply to every analyzer and request of the resource, so production calls would also switch to gpt-eval.", fr: "Les valeurs par défaut de la ressource s'appliquent à tous les analyseurs et à toutes les requêtes de la ressource : les appels de production basculeraient aussi vers gpt-eval." }
        b: { en: "`models` takes Foundry model names or aliases, not deployment names, so gpt-eval isn't a valid value.", fr: "`models` prend des noms de modèles Foundry ou des alias, pas des noms de déploiements : gpt-eval n'est pas une valeur valide." }
        d: { en: "It changes the analyzer definition, which is forbidden, affects production calls, and uses a deployment name where a model name is expected.", fr: "Cela modifie la définition de l'analyseur, ce qui est interdit, touche les appels de production, et utilise un nom de déploiement là où un nom de modèle est attendu." }
    references:
      - title: Model deployment options for Content Understanding analyzers - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments

  # ------------------------------------------------------------------ 10
  - id: ai103-qz-52-10
    objective: "5.2.3"
    difficulty: 3
    status: draft
    type: yesno_statements
    stem:
      en: |
        Contoso created the custom Content Understanding analyzer shown in the exhibit. It analyzes scanned PDF contracts. A RAG pipeline chunks the Markdown of each analysis result, and a review application reads the fields.

        For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

        NOTE: Each correct selection is worth one point.
      fr: |
        Contoso a créé l'analyseur Content Understanding personnalisé présenté dans la pièce. Il analyse des contrats PDF numérisés. Un pipeline RAG découpe en blocs le Markdown de chaque résultat d'analyse, et une application de révision lit les champs.

        Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

        Remarque : chaque sélection correcte vaut un point.
    exhibits:
      - id: def
        title: { en: "Analyzer definition", fr: "Définition de l'analyseur" }
        body: |
          ```json
          {
            "analyzerId": "contosoContractAnalyzer",
            "baseAnalyzerId": "prebuilt-document",
            "config": {
              "tableFormat": "markdown",
              "estimateFieldSourceAndConfidence": true,
              "omitContent": true
            },
            "fieldSchema": {
              "name": "ContractFields",
              "fields": {
                "ContractNumber": { "type": "string", "method": "extract", "description": "Contract number, labeled Contract No. or Ref." },
                "RenewalRisk": { "type": "string", "method": "classify", "enum": ["Low", "Medium", "High"], "description": "Risk that the customer doesn't renew, based on the renewal and termination clauses" },
                "Summary": { "type": "string", "method": "generate", "description": "Two-sentence summary of the obligations of each party" }
              }
            },
            "models": { "completion": "prebuilt-analyzer-completion", "embedding": "prebuilt-analyzer-embedding" }
          }
          ```
    body:
      statements:
        - id: s1
          text:
            en: The RAG pipeline receives the tables of each contract as Markdown tables.
            fr: Le pipeline RAG reçoit les tableaux de chaque contrat sous forme de tableaux Markdown.
        - id: s2
          text:
            en: The review application receives a confidence score for the RenewalRisk value.
            fr: L'application de révision reçoit un score de confiance pour la valeur de RenewalRisk.
        - id: s3
          text:
            en: The analyzer reads the text of the scanned pages, although its configuration doesn't set `enableOcr`.
            fr: L'analyseur lit le texte des pages numérisées, bien que sa configuration ne définisse pas `enableOcr`.
    answer:
      values: { s1: false, s2: true, s3: true }
    explanation:
      correct:
        en: |
          `omitContent` set to true removes the content object from the response, so no Markdown (and no Markdown table) reaches the RAG pipeline, whatever `tableFormat` says; only the fields are returned. For document analyzers, `estimateFieldSourceAndConfidence` returns a confidence score and a source for the fields, including `classify` fields such as RenewalRisk. `enableOcr` is true by default for document analyzers, so scanned pages are read.
        fr: |
          `omitContent` défini sur true supprime l'objet de contenu de la réponse : aucun Markdown (ni tableau Markdown) n'arrive au pipeline RAG, quoi qu'indique `tableFormat` ; seuls les champs sont renvoyés. Pour les analyseurs de documents, `estimateFieldSourceAndConfidence` renvoie un score de confiance et une source pour les champs, y compris les champs `classify` comme RenewalRisk. `enableOcr` vaut true par défaut pour les analyseurs de documents : les pages numérisées sont donc lues.
      options:
        s1: { en: "With `omitContent`, the response contains only structured field data; remove it so that the Markdown is returned.", fr: "Avec `omitContent`, la réponse ne contient que les données structurées des champs ; supprimez-le pour que le Markdown soit renvoyé." }
    references:
      - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference - Foundry Tools
        url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
