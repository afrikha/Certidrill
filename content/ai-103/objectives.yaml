# AI-103 objectives — official study guide, skills measured as of 2026-04-16 (en-us and fr-fr pages,
# checked on 2026-11-16). English verbatim (plain hyphens). French from the fr-fr page, with its
# machine-translation slips corrected (for example "modèles modals" -> "modèles multimodaux",
# "outils Foundry" -> Foundry Tools, the product name) and infinitives without final period.
# `code` is the stable key referenced by question files and course sections.
planning:
- group:
    en: Choose the appropriate Foundry services for generative AI and agents
    fr: Choisir les services Foundry appropriés pour l'IA et les agents génératifs
  objectives:
  - code: 1.1.1
    en: Choose an appropriate model for each task, including large language models (LLMs), small language models, multimodal models, and Foundry Tools
    fr: Choisir un modèle approprié pour chaque tâche, y compris les grands modèles de langage (LLM), les petits modèles de langage, les modèles multimodaux et Foundry Tools
  - code: 1.1.2
    en: Choose the appropriate Foundry services for generative tasks, grounding, vector search, agent workflows, or multimodal processing
    fr: Choisir les services Foundry appropriés pour les tâches génératives, l'ancrage, la recherche vectorielle, les flux de travail d'agent ou le traitement multimodal
  - code: 1.1.3
    en: Choose an appropriate method for retrieval and indexing
    fr: Choisir une méthode appropriée pour la récupération et l'indexation
  - code: 1.1.4
    en: Choose appropriate memory, tool, and knowledge integration services for agent solutions
    fr: Choisir les services appropriés d'intégration de la mémoire, des outils et des connaissances pour les solutions d'agent
- group:
    en: Set up AI solutions in Foundry
    fr: Configurer des solutions IA dans Foundry
  objectives:
  - code: 1.2.1
    en: Design Azure infrastructure for AI apps and agent-based solutions
    fr: Concevoir une infrastructure Azure pour les applications IA et les solutions basées sur des agents
  - code: 1.2.2
    en: Choose appropriate deployment options
    fr: Choisir les options de déploiement appropriées
  - code: 1.2.3
    en: Configure model and agent deployments
    fr: Configurer les déploiements de modèles et d'agents
  - code: 1.2.4
    en: Integrate Foundry projects with continuous integration and continuous deployment (CI/CD) pipelines
    fr: Intégrer des projets Foundry aux pipelines d'intégration continue et de déploiement continu (CI/CD)
- group:
    en: Manage, monitor, and secure AI systems
    fr: Gérer, surveiller et sécuriser les systèmes IA
  objectives:
  - code: 1.3.1
    en: Manage quotas, scaling, rate limits, and cost footprints for model and agent workloads
    fr: Gérer les quotas, la mise à l'échelle, les limites de débit et les empreintes de coût pour les charges de travail de modèle et d'agent
  - code: 1.3.2
    en: Monitor model performance, drift, safety events, and grounding quality
    fr: Surveiller les performances du modèle, la dérive, les événements de sécurité et la qualité de l'ancrage
  - code: 1.3.3
    en: Monitor data ingestion quality, search index health, and relevance performance
    fr: Surveiller la qualité de l'ingestion des données, l'intégrité de l'index de recherche et les performances de pertinence
  - code: 1.3.4
    en: Configure security, including managed identity, private networking, keyless credentials, and role policies
    fr: Configurer la sécurité, notamment l'identité managée, la mise en réseau privée, les informations d'identification sans clé et les stratégies de rôle
- group:
    en: Implement responsible AI across generative AI and agentic systems
    fr: Implémenter l'IA responsable dans les systèmes d'IA et d'agent génératifs
  objectives:
  - code: 1.4.1
    en: Configure safety filters, guardrails, risk detection, and content moderation
    fr: Configurer les filtres de sécurité, les garde-fous, la détection des risques et la modération du contenu
  - code: 1.4.2
    en: Apply responsible AI instrumentation, including evaluators, safety evaluations, and explanation tooling
    fr: Appliquer l'instrumentation d'IA responsable, y compris les évaluateurs, les évaluations de sécurité et les outils d'explication
  - code: 1.4.3
    en: Implement auditing through trace logging, provenance metadata, and approval workflows
    fr: Implémenter l'audit par le biais de la journalisation des traces, des métadonnées de provenance et des workflows d'approbation
  - code: 1.4.4
    en: Govern agent behavior with oversight modes, constraints, and tool-access controls
    fr: Régir le comportement de l'agent avec des modes de supervision, des contraintes et des contrôles d'accès aux outils
generative:
- group:
    en: Build generative applications by using Foundry
    fr: Générer des applications génératives à l'aide de Foundry
  objectives:
  - code: 2.1.1
    en: Deploy and consume LLMs, small models, code models, and multimodal models
    fr: Déployer et consommer des modèles de langage de grande taille, des petits modèles, des modèles de code et des modèles multimodaux
  - code: 2.1.2
    en: Implement retrieval-augmented generation (RAG) in an application
    fr: Implémenter la génération augmentée de récupération (RAG) dans une application
  - code: 2.1.3
    en: Design workflows, tool-augmented flows, and multistep reasoning pipelines
    fr: Concevoir des flux de travail, des flux augmentés par des outils et des pipelines de raisonnement à plusieurs étapes
  - code: 2.1.4
    en: Evaluate models and apps, including detecting fabrications, relevance, quality, and safety
    fr: Évaluer les modèles et les applications, notamment la détection des fabrications, de la pertinence, de la qualité et de la sécurité
  - code: 2.1.5
    en: Integrate generative workflows into applications by using Foundry SDKs and connectors
    fr: Intégrer des flux de travail génératifs dans des applications à l'aide des kits SDK et des connecteurs Foundry
  - code: 2.1.6
    en: Configure an application to connect to a Foundry project
    fr: Configurer une application pour se connecter à un projet Foundry
- group:
    en: Build agents by using Foundry
    fr: Générer des agents à l'aide de Foundry
  objectives:
  - code: 2.2.1
    en: Define agent roles, goals, conversation-tracking approach, and tool schemas
    fr: Définir des rôles d'agent, des objectifs, une approche de suivi des conversations et des schémas d'outil
  - code: 2.2.2
    en: Build agents that integrate retrieval, function-calling, and conversation memory
    fr: Créer des agents qui intègrent la récupération de données, l'appel de fonction et la mémoire conversationnelle
  - code: 2.2.3
    en: Integrate agent tools, including APIs, knowledge stores, search, content understanding, and custom functions
    fr: Intégrer des outils d'agent, notamment les API, les magasins de connaissances, la recherche, la compréhension du contenu et les fonctions personnalisées
  - code: 2.2.4
    en: Implement orchestrated multi-agent solutions
    fr: Implémenter des solutions multi-agents orchestrées
  - code: 2.2.5
    en: Build autonomous or semiautonomous workflows with safeguards and approval flow controls
    fr: Créer des workflows autonomes ou semi-autonomes avec des mesures de protection et des contrôles de flux d'approbation
  - code: 2.2.6
    en: Integrate monitoring into deployed agents, evaluate agent behavior, and perform error analysis
    fr: Intégrer la surveillance aux agents déployés, évaluer le comportement de l'agent et effectuer une analyse des erreurs
- group:
    en: Optimize and operationalize generative AI systems
    fr: Optimiser et opérationnaliser les systèmes d'intelligence artificielle générative
  objectives:
  - code: 2.3.1
    en: Tune generation behavior, such as prompt engineering and adjusting model parameters
    fr: Paramétrer le comportement de génération, comme l'ingénierie d'invite et l'ajustement des paramètres de modèle
  - code: 2.3.2
    en: Implement model reflection, chain-of-thought evaluations, and self-critique loops
    fr: Implémenter la réflexion du modèle, les évaluations de la chaîne de pensée et les boucles d'autocritique
  - code: 2.3.3
    en: Set up observability by implementing tracing, token analytics, safety signals, and latency breakdowns
    fr: Configurer l'observabilité en implémentant le suivi, l'analytique des jetons, les signaux de sécurité et les répartitions de latence
  - code: 2.3.4
    en: Orchestrate multiple models, flows, or hybrid LLM and rules engines
    fr: Orchestrer plusieurs modèles, des flux ou des moteurs hybrides associant LLM et règles
vision:
- group:
    en: Design and implement image- and video-generation solutions
    fr: Concevoir et implémenter des solutions de génération d'images et de vidéos
  objectives:
  - code: 3.1.1
    en: Implement a solution that generates images from text prompts and reference media
    fr: Implémenter une solution qui génère des images à partir d'invites de texte et de médias de référence
  - code: 3.1.2
    en: Implement a solution that generates videos from text prompts and reference media
    fr: Implémenter une solution qui génère des vidéos à partir d'invites de texte et de médias de référence
  - code: 3.1.3
    en: Configure image-editing workflows, including inpainting, mask-based edits, and prompt-driven modifications
    fr: Configurer des processus d'édition d'images, notamment l'inpainting, les modifications avec masque et les modifications guidées par des invites
  - code: 3.1.4
    en: Implement workflows to edit generated videos
    fr: Implémenter des flux de travail pour modifier des vidéos générées
  - code: 3.1.5
    en: Select and apply appropriate generation and editing controls provided by the platform
    fr: Sélectionner et appliquer les contrôles de génération et d'édition appropriés fournis par la plateforme
- group:
    en: Design and implement multimodal understanding workflows
    fr: Concevoir et implémenter des flux de travail de compréhension multimodale
  objectives:
  - code: 3.2.1
    en: Build a solution that analyzes visual context by using multimodal models
    fr: Créer une solution qui analyse le contexte visuel à l'aide de modèles multimodaux
  - code: 3.2.2
    en: Configure apps to produce concise or detailed captions for single or multiple images
    fr: Configurer des applications pour produire des légendes concises ou détaillées pour une ou plusieurs images
  - code: 3.2.3
    en: Implement a solution that enables question-answering grounded in visual evidence
    fr: Implémenter une solution qui permet une réponse aux questions fondée sur des preuves visuelles
  - code: 3.2.4
    en: Configure generation of alt-text and extended image descriptions aligned to accessibility guidelines
    fr: Configurer la génération de texte de remplacement et de descriptions d'images étendues, alignés sur les instructions d'accessibilité
  - code: 3.2.5
    en: Implement visual understanding by configuring Azure Content Understanding in Foundry Tools to extract visual characteristics
    fr: Implémenter la compréhension visuelle en configurant Azure Content Understanding dans Foundry Tools pour extraire des caractéristiques visuelles
  - code: 3.2.6
    en: Implement video analysis workflows to process and interpret video segments
    fr: Implémenter des flux de travail d'analyse vidéo pour traiter et interpréter des segments vidéo
  - code: 3.2.7
    en: Configure single-task and pro-mode Content Understanding pipelines
    fr: Configurer des pipelines Content Understanding à tâche unique et en mode pro
  - code: 3.2.8
    en: Implement solutions that identify objects, components, or regions within images or video
    fr: Implémenter des solutions qui identifient des objets, des composants ou des régions dans des images ou des vidéos
- group:
    en: Implement responsible AI for multimodal content
    fr: Mettre en œuvre l'IA responsable pour le contenu multimodal
  objectives:
  - code: 3.3.1
    en: Implement filters to classify unsafe or disallowed visual content
    fr: Implémenter des filtres pour classifier du contenu visuel non sécurisé ou non autorisé
  - code: 3.3.2
    en: Detect and mitigate indirect prompt injection by using embedded text in images
    fr: Détecter et atténuer l'injection indirecte d'invites à l'aide de texte incorporé dans des images
  - code: 3.3.3
    en: Enforce visual policy rules, such as applying watermarks, flagging prohibited symbols, upholding brand usage requirements, and detecting potentially inappropriate content
    fr: Appliquer des règles de stratégie visuelle, telles que l'application de filigranes, le signalement des symboles interdits, le respect des exigences d'utilisation de la marque et la détection de contenu potentiellement inapproprié
text:
- group:
    en: Apply language model text analysis
    fr: Appliquer l'analyse de texte du modèle de langage
  objectives:
  - code: 4.1.1
    en: Implement solutions to extract entities, topics, summaries, and structured JSON outputs by using generative prompting and Foundry Tools
    fr: Implémenter des solutions pour extraire des entités, des sujets, des résumés et des sorties JSON structurées à l'aide d'invites génératives et de Foundry Tools
  - code: 4.1.2
    en: Configure detection of sentiment, tone, safety issues, and sensitive content
    fr: Configurer la détection des sentiments, du ton, des problèmes de sécurité et du contenu sensible
  - code: 4.1.3
    en: Build solutions that translate text by using Azure Translator in Foundry Tools or LLM-powered translation flows
    fr: Créer des solutions qui traduisent du texte à l'aide d'Azure Translator dans Foundry Tools ou de flux de traduction alimentés par LLM
  - code: 4.1.4
    en: Customize language model outputs for domain tasks, such as compliance summarization and domain extraction
    fr: Personnaliser les sorties du modèle de langage pour les tâches de domaine, telles que la synthèse de conformité et l'extraction de domaine
- group:
    en: Implement speech solutions
    fr: Implémenter des solutions vocales
  objectives:
  - code: 4.2.1
    en: Implement workflows to convert speech to text and text to speech for agentic interactions
    fr: Implémenter des flux de travail de reconnaissance vocale et de synthèse vocale pour les interactions agentiques
  - code: 4.2.2
    en: Integrate speech as an agent modality, including custom speech models
    fr: Intégrer la voix en tant que modalité d'agent, y compris les modèles vocaux personnalisés
  - code: 4.2.3
    en: Enable multimodal reasoning from audio inputs
    fr: Activer le raisonnement multimodal à partir d'entrées audio
  - code: 4.2.4
    en: Translate speech into other languages by using language models and Foundry Tools
    fr: Traduire la parole dans d'autres langues à l'aide de modèles de langage et de Foundry Tools
extraction:
- group:
    en: Build retrieval and grounding pipelines
    fr: Créer des pipelines de récupération et d'ancrage
  objectives:
  - code: 5.1.1
    en: Ingest and index content, such as documents, images, audio, and video
    fr: Ingérer et indexer du contenu, tel que des documents, des images, du contenu audio et vidéo
  - code: 5.1.2
    en: Configure semantic search, hybrid search, and vector search for grounding
    fr: Configurer la recherche sémantique, la recherche hybride et la recherche vectorielle pour l'ancrage
  - code: 5.1.3
    en: Implement enrichment by using custom or built-in skills for text, images, and layout
    fr: Implémenter l'enrichissement à l'aide de compétences personnalisées ou intégrées pour le texte, les images et la disposition
  - code: 5.1.4
    en: Configure RAG ingestion flow, including documents and using optical character recognition (OCR)
    fr: Configurer le flux d'ingestion RAG, y compris les documents et l'utilisation de la reconnaissance optique de caractères (OCR)
  - code: 5.1.5
    en: Connect retrieval pipelines directly to workflows and agent tools
    fr: Connecter des pipelines de récupération directement aux flux de travail et aux outils d'agent
- group:
    en: Extract content from documents
    fr: Extraire du contenu de documents
  objectives:
  - code: 5.2.1
    en: Extract information by using multimodal pipelines that combine OCR, layout analysis, and field extraction
    fr: Extraire des informations à l'aide de pipelines multimodaux qui combinent l'OCR, l'analyse de disposition et l'extraction de champs
  - code: 5.2.2
    en: Produce clean, grounded representations to use with agents and RAG by using Content Understanding
    fr: Produire des représentations propres et ancrées à utiliser avec des agents et RAG à l'aide de Content Understanding
  - code: 5.2.3
    en: Implement analyzers for generating structured or markdown outputs for downstream reasoning by using Content Understanding
    fr: Implémenter des analyseurs pour générer des sorties structurées ou en Markdown destinées au raisonnement en aval à l'aide de Content Understanding
