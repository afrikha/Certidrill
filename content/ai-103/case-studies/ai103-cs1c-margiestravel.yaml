id: ai103-cs1c-margiestravel
status: draft
title:
  en: Margie's Travel
  fr: Margie's Travel
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Margie's Travel publishes travel guides and illustrated travel books for children in English and German. Its digital team of 12 developers builds the **Margie's Guides** app, in which readers ask questions about destinations.

        Margie's Travel is adding generative AI to its editorial and publishing workflows.
      fr: |
        Margie's Travel publie des guides de voyage et des livres de voyage illustrés pour enfants en anglais et en allemand. Son équipe numérique de 12 développeurs crée l'application **Margie's Guides**, dans laquelle les lecteurs posent des questions sur des destinations.

        Margie's Travel ajoute l'IA générative à ses flux de travail éditoriaux et de publication.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Margie's Travel has an Azure subscription and a GitHub organization. The environment contains the following components.

        | Component | Type | Configuration |
        | --- | --- | --- |
        | ai-margies | Microsoft Foundry resource | Contains a Foundry project named **guides-prj** |
        | guide-agent | Prompt agent in guides-prj | Answers readers in Margie's Guides by using an Azure AI Search tool over the guidebook content. Its instructions limit answers to the destinations that the guides cover. Version 3 is in production; version 4 is a candidate. |
        | illustrations | Model deployment in ai-margies | GPT-Image-2 model, used by illustrators |
        | judge-gpt | Model deployment in ai-margies | Chat model used as the judge for AI-assisted evaluators |
        | guide-agent repo | GitHub repository | Contains the agent definitions and the test file **evals/guide-tests.json**, in which each reader question has an expected answer written by an editor |
        | gh-evals | Microsoft Entra application | Has a federated identity credential for the guide-agent repo and the Foundry User role on guides-prj |

        The children's books follow a mascot, a red fox named Pip. Illustrators have three approved reference drawings of Pip as PNG files.

        Editors produce the metadata of each guidebook chapter by hand for the product catalog.
      fr: |
        Margie's Travel dispose d'un abonnement Azure et d'une organisation GitHub. L'environnement contient les composants suivants.

        | Composant | Type | Configuration |
        | --- | --- | --- |
        | ai-margies | Ressource Microsoft Foundry | Contient un projet Foundry nommé **guides-prj** |
        | guide-agent | Agent d'invite (prompt agent) dans guides-prj | Répond aux lecteurs dans Margie's Guides à l'aide d'un outil Azure AI Search sur le contenu des guides. Ses instructions limitent les réponses aux destinations couvertes par les guides. La version 3 est en production ; la version 4 est candidate. |
        | illustrations | Déploiement de modèle dans ai-margies | Modèle GPT-Image-2, utilisé par les illustrateurs |
        | judge-gpt | Déploiement de modèle dans ai-margies | Modèle de conversation utilisé comme juge pour les évaluateurs assistés par l'IA |
        | Dépôt guide-agent | Dépôt GitHub | Contient les définitions de l'agent et le fichier de test **evals/guide-tests.json**, dans lequel chaque question de lecteur a une réponse attendue rédigée par un éditeur |
        | gh-evals | Application Microsoft Entra | Dispose d'informations d'identification fédérées pour le dépôt guide-agent et du rôle Foundry User sur guides-prj |

        Les livres pour enfants suivent une mascotte, un renard roux nommé Pip. Les illustrateurs disposent de trois dessins de référence approuvés de Pip au format PNG.

        Les éditeurs produisent à la main les métadonnées de chaque chapitre de guide pour le catalogue de produits.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Margie's Travel identifies the following requirements:

        1. **Illustrations.** Illustrators must be able to create new scenes in which Pip looks the same as in the approved reference drawings.
        2. **Answer quality.** Before each release, the team must measure whether guide-agent answers include the critical information of the expected answers, and whether guide-agent follows its instructions.
        3. **Release pipeline.** A GitHub Actions workflow must evaluate version 4 of guide-agent and compare it with version 3, which is the baseline. No secret can be stored in GitHub.
        4. **Catalog metadata.** A language model must produce the metadata of each chapter as JSON that always matches the catalog schema: a title, a list of places, a summary, and a region. Some chapters do not cover a single region; for them, the region must be null.
        5. **Translation.** Guide text must be translated by an LLM that reuses the house style of 4,000 approved English–German sentence pairs from previous editions. The team does not want to train or deploy a translation model.
      fr: |
        Margie's Travel a défini les exigences suivantes :

        1. **Illustrations.** Les illustrateurs doivent pouvoir créer de nouvelles scènes dans lesquelles Pip a la même apparence que dans les dessins de référence approuvés.
        2. **Qualité des réponses.** Avant chaque publication, l'équipe doit mesurer si les réponses de guide-agent incluent les informations essentielles des réponses attendues, et si guide-agent respecte ses instructions.
        3. **Pipeline de publication.** Un workflow GitHub Actions doit évaluer la version 4 de guide-agent et la comparer à la version 3, qui sert de référence. Aucun secret ne peut être stocké dans GitHub.
        4. **Métadonnées du catalogue.** Un modèle de langage doit produire les métadonnées de chaque chapitre au format JSON en respectant toujours le schéma du catalogue : un titre, une liste de lieux, un résumé et une région. Certains chapitres ne couvrent pas une seule région ; pour eux, la région doit être null.
        5. **Traduction.** Le texte des guides doit être traduit par un LLM qui reprend le style maison de 4 000 paires de phrases anglais–allemand approuvées issues des éditions précédentes. L'équipe ne veut ni entraîner ni déployer de modèle de traduction.
