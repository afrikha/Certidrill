id: ai103-cs1b-alpineski
status: draft
title:
  en: Alpine Ski House
  fr: Alpine Ski House
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Alpine Ski House operates a ski resort in the French Alps, with three villages, 60 lifts, a ski school and an equipment rental service. The resort welcomes 500,000 guests each winter, mainly from France, the United Kingdom, Germany and Italy.

        Alpine Ski House is building an AI concierge that guests can reach by phone and in the resort's mobile app.
      fr: |
        Alpine Ski House exploite une station de ski dans les Alpes françaises, avec trois villages, 60 remontées mécaniques, une école de ski et un service de location de matériel. La station accueille 500 000 clients chaque hiver, principalement de France, du Royaume-Uni, d'Allemagne et d'Italie.

        Alpine Ski House crée un concierge IA que les clients peuvent joindre par téléphone et dans l'application mobile de la station.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Alpine Ski House has an Azure subscription that contains the following resources.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | ai-alpineski | Microsoft Foundry resource | Region: Sweden Central; contains a Foundry project named **concierge-prj** |
        | concierge-agent | Prompt agent in concierge-prj | Answers guests in the mobile app |
        | bookings-api | Azure App Service web app | REST API for ski lessons and equipment rental; described by an OpenAPI 3.0 specification; protected by Microsoft Entra ID authentication |
        | staff-dz | Model deployment in ai-alpineski | Data Zone Standard deployment used by an internal assistant for 40 employees |

        The resort has about 180 named lifts, slopes and restaurants, such as Combe des Marmottes, Aiguillette and Edelweiss. Some names change every season.

        Guests leave about 40,000 written reviews each month.
      fr: |
        Alpine Ski House dispose d'un abonnement Azure qui contient les ressources suivantes.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | ai-alpineski | Ressource Microsoft Foundry | Région : Sweden Central ; contient un projet Foundry nommé **concierge-prj** |
        | concierge-agent | Agent d'invite (prompt agent) dans concierge-prj | Répond aux clients dans l'application mobile |
        | bookings-api | Application web Azure App Service | API REST pour les cours de ski et la location de matériel ; décrite par une spécification OpenAPI 3.0 ; protégée par l'authentification Microsoft Entra ID |
        | staff-dz | Déploiement de modèle dans ai-alpineski | Déploiement Data Zone Standard utilisé par un assistant interne pour 40 employés |

        La station compte environ 180 remontées, pistes et restaurants nommés, comme Combe des Marmottes, Aiguillette et Edelweiss. Certains noms changent chaque saison.

        Les clients laissent environ 40 000 avis écrits chaque mois.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Alpine Ski House identifies the following requirements:

        1. **Phone concierge.** Guests talk with the concierge in real time. Guests must be able to interrupt the concierge, and background noise from lifts and wind must be suppressed. The development team does not want to orchestrate separate speech recognition, language model and speech synthesis components.
        2. **Place names.** Speech recognition must correctly recognize the names of lifts, slopes and restaurants. The list of names is updated every season. No speech model can be trained.
        3. **Bookings.** concierge-agent must create lesson and rental bookings by calling bookings-api. The calls must be made by Foundry Agent Service, without code that runs in the mobile app, and without any key or secret.
        4. **Data residency.** All prompts and responses must be processed within the EU Data Boundary.
        5. **Workloads.** In peak season, concierge-agent handles a high, constant volume and needs predictable latency. The guest reviews are summarized once a month; the results are not time-sensitive and the cost must be minimized. The internal assistant has low, bursty traffic and must be billed per token.
        6. **Guest preferences.** concierge-agent must remember each guest's language, ski level and dietary needs from one conversation to the next. A guest must never receive another guest's preferences. Custom code must be minimized.
      fr: |
        Alpine Ski House a défini les exigences suivantes :

        1. **Concierge téléphonique.** Les clients parlent au concierge en temps réel. Les clients doivent pouvoir interrompre le concierge, et le bruit de fond des remontées et du vent doit être supprimé. L'équipe de développement ne veut pas orchestrer des composants distincts de reconnaissance vocale, de modèle de langage et de synthèse vocale.
        2. **Noms de lieux.** La reconnaissance vocale doit reconnaître correctement les noms des remontées, des pistes et des restaurants. La liste des noms est mise à jour chaque saison. Aucun modèle vocal ne peut être entraîné.
        3. **Réservations.** concierge-agent doit créer des réservations de cours et de location en appelant bookings-api. Les appels doivent être effectués par Foundry Agent Service, sans code exécuté dans l'application mobile, et sans aucune clé ni aucun secret.
        4. **Résidence des données.** Toutes les invites et les réponses doivent être traitées au sein de l'EU Data Boundary.
        5. **Charges de travail.** En haute saison, concierge-agent traite un volume élevé et constant et a besoin d'une latence prévisible. Les avis des clients sont résumés une fois par mois ; les résultats ne sont pas urgents et le coût doit être réduit au minimum. L'assistant interne a un trafic faible et irrégulier et doit être facturé au jeton.
        6. **Préférences des clients.** concierge-agent doit se souvenir de la langue, du niveau de ski et des besoins alimentaires de chaque client d'une conversation à l'autre. Un client ne doit jamais recevoir les préférences d'un autre client. Le code personnalisé doit être réduit au minimum.
