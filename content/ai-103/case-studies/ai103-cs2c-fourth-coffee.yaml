id: ai103-cs2c-fourth-coffee
status: draft
title:
  en: Fourth Coffee
  fr: Fourth Coffee
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Fourth Coffee is a coffee chain with 600 stores, 140 of which have a drive-thru lane. Customers order ahead in the Fourth Coffee mobile app.

        Fourth Coffee is adding **order-agent**, a Foundry agent that takes orders in the chat of the mobile app. A team of five developers writes the backend of the app in Python.
      fr: |
        Fourth Coffee est une chaîne de cafés qui compte 600 établissements, dont 140 disposent d'un service au volant. Les clients commandent à l'avance dans l'application mobile Fourth Coffee.

        Fourth Coffee ajoute **order-agent**, un agent Foundry qui prend les commandes dans la conversation de l'application mobile. Une équipe de cinq développeurs écrit le back-end de l'application en Python.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Fourth Coffee has a Microsoft Foundry resource named **fc-foundry** that contains two projects named **orders-prj** and **nutrition-prj**. All the agents are prompt agents of Foundry Agent Service, managed by using the `azure-ai-projects` SDK.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | chat-orders | Model deployment | Standard deployment type; model used by order-agent |
        | audio-mini | Model deployment | gpt-audio-mini |
        | pricing-api | Internal REST API | Rules engine that calculates prices, loyalty discounts and promotions. Audited every quarter by the finance department |
        | allergen-agent | Foundry agent | Agent of the nutrition team in nutrition-prj, exposed as an A2A endpoint (A2A protocol 1.0) |
        | allergen-a2a | Project connection | Connection of orders-prj to the A2A endpoint of allergen-agent |
        | stfcdrive | Storage account | Container **recordings** that receives one WAV file per drive-thru interaction; each file is smaller than 5 MB |
      fr: |
        Fourth Coffee dispose d'une ressource Microsoft Foundry nommée **fc-foundry** qui contient deux projets nommés **orders-prj** et **nutrition-prj**. Tous les agents sont des agents d'invite de Foundry Agent Service, gérés à l'aide du SDK `azure-ai-projects`.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | chat-orders | Déploiement de modèle | Type de déploiement Standard ; modèle utilisé par order-agent |
        | audio-mini | Déploiement de modèle | gpt-audio-mini |
        | pricing-api | API REST interne | Moteur de règles qui calcule les prix, les remises de fidélité et les promotions. Audité chaque trimestre par le service financier |
        | allergen-agent | Agent Foundry | Agent de l'équipe nutrition dans nutrition-prj, exposé comme point de terminaison A2A (protocole A2A 1.0) |
        | allergen-a2a | Connexion de projet | Connexion de orders-prj au point de terminaison A2A de allergen-agent |
        | stfcdrive | Compte de stockage | Conteneur **recordings** qui reçoit un fichier WAV par interaction au service au volant ; chaque fichier fait moins de 5 Mo |
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Fourth Coffee identifies the following requirements:

        1. **Orders.** order-agent places orders by calling a function named place_order that the backend implements. The function takes a store ID, a drink from a fixed list, a size (small, medium or large) and an optional pickup time; when the customer gives no pickup time, the backend uses the next available slot. The arguments must always conform exactly to the schema of the function.
        2. **Prices.** Every price and discount that order-agent states must come from pricing-api. Finance requires the calculation to stay deterministic and auditable; the model must never calculate a price.
        3. **Allergens.** order-agent must delegate allergen questions to allergen-agent and keep control of the conversation with the customer. Only generally available features may be used.
        4. **Model lifecycle.** chat-orders must stay on its current model version until that version is retired, and order-agent must keep working after the retirement.
        5. **Drive-thru quality.** Every night, a job must flag the drive-thru interactions in which the customer sounds frustrated, judging from the tone of voice as well as from the words, and return a JSON verdict for each recording. The job must make one model call per recording.
        6. **Backend.** The backend must run the function-calling loop of order-agent by using the `azure-ai-projects` SDK and conversations.
      fr: |
        Fourth Coffee a défini les exigences suivantes :

        1. **Commandes.** order-agent passe les commandes en appelant une fonction nommée place_order que le back-end implémente. La fonction prend un ID d'établissement, une boisson d'une liste fixe, une taille (small, medium ou large) et une heure de retrait facultative ; quand le client ne donne pas d'heure de retrait, le back-end utilise le prochain créneau disponible. Les arguments doivent toujours respecter exactement le schéma de la fonction.
        2. **Prix.** Chaque prix et chaque remise qu'annonce order-agent doivent provenir de pricing-api. Le service financier exige que le calcul reste déterministe et auditable ; le modèle ne doit jamais calculer de prix.
        3. **Allergènes.** order-agent doit déléguer les questions sur les allergènes à allergen-agent et garder le contrôle de la conversation avec le client. Seules des fonctionnalités en disponibilité générale peuvent être utilisées.
        4. **Cycle de vie du modèle.** chat-orders doit rester sur sa version de modèle actuelle jusqu'à la mise hors service de cette version, et order-agent doit continuer à fonctionner après cette mise hors service.
        5. **Qualité du service au volant.** Chaque nuit, un traitement doit signaler les interactions au service au volant dans lesquelles le client semble agacé, d'après le ton de sa voix comme d'après ses mots, et renvoyer un verdict JSON pour chaque enregistrement. Le traitement doit faire un seul appel de modèle par enregistrement.
        6. **Back-end.** Le back-end doit exécuter la boucle d'appel de fonctions de order-agent à l'aide du SDK `azure-ai-projects` et des conversations.
