id: ai103-cs1a-humongous
status: draft
title:
  en: Humongous Insurance
  fr: Humongous Insurance
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Humongous Insurance is a motor and home insurer with 1.2 million policyholders. Its claims department employs 300 adjusters who review claims and approve payouts.

        Humongous is building an AI solution that helps adjusters process claims faster. Customers submit claims on a self-service portal.
      fr: |
        Humongous Insurance est un assureur automobile et habitation qui compte 1,2 million d'assurés. Son service des sinistres emploie 300 gestionnaires qui examinent les déclarations et approuvent les indemnisations.

        Humongous crée une solution IA qui aide les gestionnaires à traiter les sinistres plus rapidement. Les clients déclarent leurs sinistres sur un portail en libre-service.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Humongous has an Azure subscription that contains the following resources.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | ai-humongous | Microsoft Foundry resource | Contains a Foundry project named **claims-prj** |
        | claims-assistant | Prompt agent in claims-prj | Used by adjusters; has an Azure AI Search tool that queries the index **policy-wording** |
        | srch-claims | Azure AI Search | Standard tier; index **policy-wording** contains 4,000 policy documents, with text fields and vector fields |
        | app-claims | Azure App Service web app | Hosts the claims portal; system-assigned managed identity enabled |
        | payments-mcp | MCP server | Exposes the tools **get_claim_status**, **get_payment_history**, **issue_payment** and **cancel_payment** |

        Customers upload two kinds of files on the portal:

        - **Claim forms**: scanned PDF files of a standard form that contains a policy number, an incident date, a claim type (Auto, Home or Travel) and a free-text description of the incident.
        - **Damage photos**: JPEG images of damaged vehicles or buildings. Some photos also show handwritten notes or printed signs.

        Policy documents identify each clause with a code, such as EXC-14 or COV-3B.
      fr: |
        Humongous dispose d'un abonnement Azure qui contient les ressources suivantes.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | ai-humongous | Ressource Microsoft Foundry | Contient un projet Foundry nommé **claims-prj** |
        | claims-assistant | Agent d'invite (prompt agent) dans claims-prj | Utilisé par les gestionnaires ; dispose d'un outil Azure AI Search qui interroge l'index **policy-wording** |
        | srch-claims | Azure AI Search | Niveau Standard ; l'index **policy-wording** contient 4 000 documents de contrat, avec des champs texte et des champs vectoriels |
        | app-claims | Application web Azure App Service | Héberge le portail des sinistres ; identité managée affectée par le système activée |
        | payments-mcp | Serveur MCP | Expose les outils **get_claim_status**, **get_payment_history**, **issue_payment** et **cancel_payment** |

        Les clients déposent deux types de fichiers sur le portail :

        - **Formulaires de déclaration** : fichiers PDF numérisés d'un formulaire standard qui contient un numéro de contrat, une date de sinistre, un type de sinistre (Auto, Home ou Travel) et une description libre de l'incident.
        - **Photos des dommages** : images JPEG de véhicules ou de bâtiments endommagés. Certaines photos montrent aussi des notes manuscrites ou des panneaux imprimés.

        Les documents de contrat identifient chaque clause par un code, comme EXC-14 ou COV-3B.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Humongous identifies the following requirements:

        1. **Claim forms.** The policy number and the incident date must be returned exactly as written on the form, with their source location and a confidence score so that adjusters can check them. Each form must be assigned one of the claim types Auto, Home or Travel. A short summary of the incident must be produced from the description.
        2. **Damage photos.** Each photo must be described in a few sentences and assigned a severity of Minor, Moderate or Severe.
        3. **Policy search.** Adjusters ask questions that mix clause codes and natural language, often with wording that differs from the policy text. The most relevant passages must be ranked first.
        4. **Payments.** claims-assistant can read claim status and payment history without approval. Every call to issue_payment must be approved by an adjuster first. claims-assistant must never be able to call cancel_payment.
        5. **Security.** No API key or secret can be stored in the configuration of app-claims. Access must follow the principle of least privilege. app-claims only needs to send requests to claims-assistant.
        6. **Safety.** Text that appears in damage photos is passed to claims-assistant. This text must not be able to change the behavior of claims-assistant.
      fr: |
        Humongous a défini les exigences suivantes :

        1. **Formulaires de déclaration.** Le numéro de contrat et la date de sinistre doivent être renvoyés exactement tels qu'ils sont écrits sur le formulaire, avec leur emplacement source et un score de confiance pour que les gestionnaires puissent les vérifier. Chaque formulaire doit recevoir l'un des types de sinistre Auto, Home ou Travel. Un court résumé de l'incident doit être produit à partir de la description.
        2. **Photos des dommages.** Chaque photo doit être décrite en quelques phrases et recevoir une gravité Minor, Moderate ou Severe.
        3. **Recherche dans les contrats.** Les gestionnaires posent des questions qui mélangent des codes de clause et du langage naturel, souvent avec une formulation différente du texte des contrats. Les passages les plus pertinents doivent être classés en premier.
        4. **Paiements.** claims-assistant peut lire l'état des sinistres et l'historique des paiements sans approbation. Chaque appel à issue_payment doit d'abord être approuvé par un gestionnaire. claims-assistant ne doit jamais pouvoir appeler cancel_payment.
        5. **Sécurité.** Aucune clé API ni aucun secret ne peut être stocké dans la configuration d'app-claims. L'accès doit respecter le principe des privilèges minimum. app-claims doit seulement envoyer des requêtes à claims-assistant.
        6. **Sécurité du contenu.** Le texte qui apparaît sur les photos des dommages est transmis à claims-assistant. Ce texte ne doit pas pouvoir modifier le comportement de claims-assistant.
