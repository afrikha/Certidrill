id: ai103-cs4a-southridge
status: draft
title:
  en: Southridge Video
  fr: Southridge Video
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Southridge Video is a subscription streaming service that produces its own drama series. It publishes about 300 new episodes per year and has 4 million subscribers.

        Southridge is building a media pipeline in Microsoft Foundry that indexes episodes, produces promotional material, moderates fan art submitted by subscribers, and helps the writers search past scripts.
      fr: |
        Southridge Video est un service de streaming par abonnement qui produit ses propres séries dramatiques. Il publie environ 300 nouveaux épisodes par an et compte 4 millions d'abonnés.

        Southridge crée dans Microsoft Foundry une chaîne de traitement multimédia qui indexe les épisodes, produit le matériel promotionnel, modère les créations de fans envoyées par les abonnés et aide les scénaristes à rechercher dans les anciens scripts.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Southridge has an Azure subscription that contains the following resources.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | ai-southridge | Microsoft Foundry resource | Contains a Foundry project named **media-prj**; default model deployments for Content Understanding are configured |
        | teaser-video | Model deployment in ai-southridge | sora-2 |
        | chat-main | Model deployment in ai-southridge | Multimodal chat model; guardrail **Microsoft.DefaultV2** |
        | promo-agent | Prompt agent in media-prj | Writes social media posts; uses chat-main; no guardrail assigned |
        | cs-southridge | Azure AI Content Safety resource | Used to moderate fan art |
        | stsrmedia | Storage account | Containers **episodes** (MP4 files), **scripts** (PDF files) and **fanart** (PNG and JPEG files) |
        | job-media | Azure Container Apps job | Runs the Python pipeline scripts; system-assigned managed identity enabled |

        The scripts container holds 2,000 shooting scripts. Older scripts are scanned paper copies with handwritten notes from the directors, and many scripts contain storyboard sketches.
      fr: |
        Southridge dispose d'un abonnement Azure qui contient les ressources suivantes.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | ai-southridge | Ressource Microsoft Foundry | Contient un projet Foundry nommé **media-prj** ; les déploiements de modèles par défaut de Content Understanding sont configurés |
        | teaser-video | Déploiement de modèle dans ai-southridge | sora-2 |
        | chat-main | Déploiement de modèle dans ai-southridge | Modèle de conversation multimodal ; garde-fou **Microsoft.DefaultV2** |
        | promo-agent | Agent d'invite (prompt agent) dans media-prj | Rédige des publications pour les réseaux sociaux ; utilise chat-main ; aucun garde-fou attribué |
        | cs-southridge | Ressource Azure AI Content Safety | Utilisée pour modérer les créations de fans |
        | stsrmedia | Compte de stockage | Conteneurs **episodes** (fichiers MP4), **scripts** (fichiers PDF) et **fanart** (fichiers PNG et JPEG) |
        | job-media | Travail Azure Container Apps | Exécute les scripts Python de la chaîne de traitement ; identité managée affectée par le système activée |

        Le conteneur scripts contient 2 000 scripts de tournage. Les scripts les plus anciens sont des copies papier numérisées qui portent des notes manuscrites des réalisateurs, et de nombreux scripts contiennent des croquis de storyboard.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Southridge identifies the following requirements:

        1. **Episode index**: a custom Content Understanding analyzer must split each episode into scenes, with one segment for each scene. A scene ends when the location or the time of the story changes. The editors also need the timestamps of every camera shot boundary.
        2. **Teaser rework**: the marketing team often asks for one small change to an approved teaser that teaser-video generated, such as warmer lighting. The motion and framing of the approved teaser must be preserved.
        3. **Keyless access**: the pipeline scripts in job-media must authenticate to ai-southridge by using the managed identity of job-media. No API key may be stored or used.
        4. **Fan art moderation**: a fan art image must be rejected when any harm category is classified at medium severity or higher. Images that exceed the size limit of the image analysis API must be downscaled before analysis.
        5. **Promotional safety**: Southridge plans to create a custom guardrail named **gr-promo** and assign it to the chat-main deployment, in place of Microsoft.DefaultV2.
        6. **Script search**: the writers' assistant will ground its answers on the scripts. Each script must be converted into Markdown that preserves the layout, includes the handwritten notes and describes the sketches, and is split into chunks ready for embedding. Custom code must be minimized.
      fr: |
        Southridge a défini les exigences suivantes :

        1. **Index des épisodes** : un analyseur personnalisé Content Understanding doit découper chaque épisode en scènes, avec un segment par scène. Une scène se termine quand le lieu ou le moment de l'histoire change. Les monteurs ont aussi besoin des horodatages de chaque changement de plan.
        2. **Retouche des bandes-annonces** : l'équipe marketing demande souvent une petite modification d'une bande-annonce approuvée générée par teaser-video, comme un éclairage plus chaud. Le mouvement et le cadrage de la bande-annonce approuvée doivent être conservés.
        3. **Accès sans clé** : les scripts de la chaîne de traitement dans job-media doivent s'authentifier auprès d'ai-southridge à l'aide de l'identité managée de job-media. Aucune clé API ne doit être stockée ni utilisée.
        4. **Modération des créations de fans** : une image doit être rejetée quand une catégorie de préjudice est classée à une gravité moyenne ou supérieure. Les images qui dépassent la taille maximale de l'API d'analyse d'images doivent être réduites avant l'analyse.
        5. **Sécurité des contenus promotionnels** : Southridge prévoit de créer un garde-fou personnalisé nommé **gr-promo** et de l'attribuer au déploiement chat-main, à la place de Microsoft.DefaultV2.
        6. **Recherche dans les scripts** : l'assistant des scénaristes ancrera ses réponses sur les scripts. Chaque script doit être converti en Markdown qui préserve la disposition, inclut les notes manuscrites et décrit les croquis, puis découpé en blocs prêts pour l'incorporation. Le code personnalisé doit être réduit au minimum.
