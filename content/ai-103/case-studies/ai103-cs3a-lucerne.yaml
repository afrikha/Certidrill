id: ai103-cs3a-lucerne
status: draft
title:
  en: Lucerne Publishing
  fr: Lucerne Publishing
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Lucerne Publishing is an educational publisher based in Geneva. It publishes illustrated textbooks for primary schools in English, French, and German, in print and as accessible digital editions.

        A team of 12 illustrators and 30 editors works on about 40 new titles each year. Lucerne plans to use generative AI to produce illustrations faster and to prepare translated editions.
      fr: |
        Lucerne Publishing est un éditeur scolaire basé à Genève. Il publie des manuels illustrés pour l'école primaire en anglais, en français et en allemand, en version imprimée et en éditions numériques accessibles.

        Une équipe de 12 illustrateurs et de 30 éditeurs travaille sur environ 40 nouveaux titres par an. Lucerne prévoit d'utiliser l'IA générative pour produire les illustrations plus vite et pour préparer les éditions traduites.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Lucerne has an Azure subscription that contains the following resources.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | lucerne-ai | Microsoft Foundry resource | Project **illustrations**; deployments **image-gen** (a GPT-Image series model) and **vision-chat** (a multimodal chat model) |
        | lucerne-translator | Azure Translator in Foundry Tools | Custom domain endpoint |
        | stlucernebooks | Storage account | Containers **manuscripts** (English source files) and **editions** (translated files) |
        | studio-app | Python web app in Azure Container Apps | Used by illustrators and editors; calls image-gen and vision-chat |

        Each manuscript is a set of 20 to 30 .docx chapter files with tables, captions, and page layout. Editors maintain a terminology list for each series (character names and scientific terms) as a CSV file with the approved French and German translations.
      fr: |
        Lucerne dispose d'un abonnement Azure qui contient les ressources suivantes.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | lucerne-ai | Ressource Microsoft Foundry | Projet **illustrations** ; déploiements **image-gen** (un modèle de la série GPT-Image) et **vision-chat** (un modèle de conversation multimodal) |
        | lucerne-translator | Azure Translator dans Foundry Tools | Point de terminaison de domaine personnalisé |
        | stlucernebooks | Compte de stockage | Conteneurs **manuscripts** (fichiers source en anglais) et **editions** (fichiers traduits) |
        | studio-app | Application web Python dans Azure Container Apps | Utilisée par les illustrateurs et les éditeurs ; appelle image-gen et vision-chat |

        Chaque manuscrit est un ensemble de 20 à 30 fichiers de chapitre .docx avec des tableaux, des légendes et une mise en page. Les éditeurs tiennent pour chaque collection une liste terminologique (noms des personnages et termes scientifiques) sous forme de fichier CSV avec les traductions française et allemande approuvées.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Lucerne identifies the following requirements:

        1. **Partial rework.** When an editor rejects only one region of a generated illustration, such as the sky or a background object, studio-app must regenerate that region from a new prompt. The rest of the illustration must remain unchanged.
        2. **Provenance.** Every generated illustration must carry tamper-evident metadata that discloses that the image was generated by AI. Development effort must be minimized.
        3. **Child safety.** Prompts and generated images that contain sexual or violent content must be blocked, including content classified at a low severity.
        4. **Accessibility.** Each illustration in a digital edition needs a short alternative text. Complex diagrams also need an extended description that explains the data or the process that they show.
        5. **Translation.** Editors must submit all the chapter files of a manuscript in a single translation request. The translated files must keep the original layout, and the terms of the series terminology list must always be translated as approved.
      fr: |
        Lucerne a défini les exigences suivantes :

        1. **Reprise partielle.** Quand un éditeur rejette une seule région d'une illustration générée, comme le ciel ou un objet de l'arrière-plan, studio-app doit régénérer cette région à partir d'une nouvelle invite. Le reste de l'illustration doit rester inchangé.
        2. **Provenance.** Chaque illustration générée doit porter des métadonnées infalsifiables qui indiquent que l'image a été générée par l'IA. L'effort de développement doit être réduit au minimum.
        3. **Protection des enfants.** Les invites et les images générées qui contiennent du contenu sexuel ou violent doivent être bloquées, y compris le contenu classé à un niveau de gravité faible.
        4. **Accessibilité.** Chaque illustration d'une édition numérique a besoin d'un texte de remplacement court. Les diagrammes complexes ont aussi besoin d'une description étendue qui explique les données ou le processus qu'ils représentent.
        5. **Traduction.** Les éditeurs doivent soumettre tous les fichiers de chapitre d'un manuscrit dans une seule demande de traduction. Les fichiers traduits doivent conserver la mise en page d'origine, et les termes de la liste terminologique de la collection doivent toujours être traduits comme approuvé.
