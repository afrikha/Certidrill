id: ai103-cs3b-alpine
status: draft
title:
  en: Alpine Ski House
  fr: Alpine Ski House
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Alpine Ski House operates six ski resorts in France, Austria, and Italy. Guests buy lift passes, book ski lessons, and ask for help through a mobile app and at the ticket desks of each resort.

        Alpine Ski House is building a voice concierge for the mobile app and a live interpreter for the ticket desks. Traffic is highly seasonal: on winter Saturday mornings, requests are about ten times higher than on weekdays.
      fr: |
        Alpine Ski House exploite six stations de ski en France, en Autriche et en Italie. Les clients achètent des forfaits, réservent des cours de ski et demandent de l'aide dans une application mobile et aux guichets de chaque station.

        Alpine Ski House crée un concierge vocal pour l'application mobile et un interprète en direct pour les guichets. Le trafic est très saisonnier : le samedi matin en hiver, les requêtes sont environ dix fois plus nombreuses qu'en semaine.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Alpine Ski House has an Azure subscription that contains the following resources.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | alpine-ai | Microsoft Foundry resource | Project **concierge** |
        | ski-concierge | Prompt agent in the concierge project | Answers guests and books lessons; uses the **chat-main** model deployment (Global Standard) |
        | staff-assistant | Prompt agent in the concierge project | Used only by resort employees; can look up guest records |
        | guest-api | Python app in Azure App Service | Backend of the mobile app; has a system-assigned managed identity |
        | alpine-insights | Application Insights | Not connected to any Foundry project yet |

        The mobile app sends each guest utterance, already transcribed, to guest-api, which forwards it to ski-concierge by using the `azure-ai-projects` 2.x SDK.

        During a pilot on two Saturdays, chat-main returned HTTP 429 errors at peak times, and response latency varied widely between requests.
      fr: |
        Alpine Ski House dispose d'un abonnement Azure qui contient les ressources suivantes.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | alpine-ai | Ressource Microsoft Foundry | Projet **concierge** |
        | ski-concierge | Agent d'invite dans le projet concierge | Répond aux clients et réserve des cours ; utilise le déploiement de modèle **chat-main** (Global Standard) |
        | staff-assistant | Agent d'invite dans le projet concierge | Utilisé uniquement par les employés des stations ; peut consulter les dossiers des clients |
        | guest-api | Application Python dans Azure App Service | Back-end de l'application mobile ; dispose d'une identité managée affectée par le système |
        | alpine-insights | Application Insights | Pas encore connecté à un projet Foundry |

        L'application mobile envoie chaque énoncé du client, déjà transcrit, à guest-api, qui le transmet à ski-concierge à l'aide du SDK `azure-ai-projects` 2.x.

        Pendant un pilote sur deux samedis, chat-main a renvoyé des erreurs HTTP 429 aux heures de pointe, et la latence des réponses a beaucoup varié d'une requête à l'autre.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Alpine Ski House identifies the following requirements:

        1. **Access.** guest-api must authenticate without keys. It must be able to send requests to ski-concierge, but it must not be able to call staff-assistant or to create or modify agents.
        2. **Conversations.** The history of each guest conversation must be stored by Foundry. For each turn, guest-api must send only the new utterance and an identifier that it stores for the conversation.
        3. **Capacity.** ski-concierge must have guaranteed throughput and consistent latency during peaks. All prompts and responses must be processed within the EU data zone.
        4. **Ticket desks.** The live interpreter must translate what guests say into English speech for the staff with low latency. Guests can speak French, German, Italian, or English and can switch language during a conversation. Staff must not have to select the guest's language.
        5. **Observability.** The operations team must be able to inspect each run of ski-concierge, including the tool calls, latency, and tokens used, with minimal code changes. Traces can contain guest names, so only the operations team can query them.
      fr: |
        Alpine Ski House a défini les exigences suivantes :

        1. **Accès.** guest-api doit s'authentifier sans clé. Elle doit pouvoir envoyer des requêtes à ski-concierge, mais elle ne doit pas pouvoir appeler staff-assistant ni créer ou modifier des agents.
        2. **Conversations.** L'historique de chaque conversation avec un client doit être stocké par Foundry. À chaque tour, guest-api doit envoyer uniquement le nouvel énoncé et un identifiant qu'elle stocke pour la conversation.
        3. **Capacité.** ski-concierge doit disposer d'un débit garanti et d'une latence régulière pendant les pics. Toutes les invites et réponses doivent être traitées dans la zone de données UE.
        4. **Guichets.** L'interprète en direct doit traduire ce que disent les clients en parole anglaise pour le personnel, avec une faible latence. Les clients peuvent parler français, allemand, italien ou anglais et peuvent changer de langue pendant une conversation. Le personnel ne doit pas avoir à sélectionner la langue du client.
        5. **Observabilité.** L'équipe d'exploitation doit pouvoir inspecter chaque exécution de ski-concierge, y compris les appels d'outils, la latence et les jetons utilisés, avec un minimum de modifications du code. Les traces peuvent contenir des noms de clients : seule l'équipe d'exploitation peut les interroger.
