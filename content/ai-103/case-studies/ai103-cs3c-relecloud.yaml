id: ai103-cs3c-relecloud
status: draft
title:
  en: Relecloud Wind
  fr: Relecloud Wind
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Relecloud Wind operates 420 wind turbines in offshore farms in the North Sea. Maintenance technicians work from service vessels and from the operations center in Esbjerg.

        Relecloud plans two AI solutions: automated analysis of drone inspection videos of turbine blades, and an agent that answers technicians' questions from the manufacturers' maintenance manuals.
      fr: |
        Relecloud Wind exploite 420 éoliennes dans des parcs en mer du Nord. Les techniciens de maintenance travaillent depuis des navires de service et depuis le centre d'exploitation d'Esbjerg.

        Relecloud prévoit deux solutions IA : l'analyse automatisée des vidéos d'inspection par drone des pales d'éoliennes, et un agent qui répond aux questions des techniciens à partir des manuels de maintenance des fabricants.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Relecloud has an Azure subscription that contains the following resources.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | stturbinemedia | Storage account | Containers **drone-videos** and **manuals** |
        | relecloud-search | Azure AI Search | Standard tier |
        | relecloud-ai | Microsoft Foundry resource | Project **maintenance**; deployments **chat-main** (chat model) and **embed-main** (text embedding model) |
        | maintenance-assistant | Prompt agent in the maintenance project | Will answer technicians from an index of relecloud-search |

        Each drone video is a 12- to 20-minute MP4 file. The drone flies along each of the three blades of a turbine in turn, with a short pause between blades.

        The manuals container holds about 4,000 PDF manuals. Most of them are scanned paper documents, and many pages contain wiring diagrams with printed labels and part numbers.
      fr: |
        Relecloud dispose d'un abonnement Azure qui contient les ressources suivantes.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | stturbinemedia | Compte de stockage | Conteneurs **drone-videos** et **manuals** |
        | relecloud-search | Azure AI Search | Niveau Standard |
        | relecloud-ai | Ressource Microsoft Foundry | Projet **maintenance** ; déploiements **chat-main** (modèle de conversation) et **embed-main** (modèle d'incorporation de texte) |
        | maintenance-assistant | Agent d'invite dans le projet maintenance | Répondra aux techniciens à partir d'un index de relecloud-search |

        Chaque vidéo de drone est un fichier MP4 de 12 à 20 minutes. Le drone longe tour à tour chacune des trois pales d'une éolienne, avec une courte pause entre les pales.

        Le conteneur manuals contient environ 4 000 manuels PDF. La plupart sont des documents papier numérisés, et de nombreuses pages contiennent des schémas de câblage avec des étiquettes et des références de pièces imprimées.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Relecloud identifies the following requirements:

        1. **Inspections.** For each drone video, the solution must return one entry per blade, with its start and end times, a description of the visible damage, and a severity of Minor, Moderate, or Severe. The solution must use Azure Content Understanding in Foundry Tools.
        2. **Manuals.** All the text of the manuals, including the labels and part numbers printed in the diagrams, must be searchable by maintenance-assistant. The index must store chunks of text with their vector embeddings.
        3. **Ingestion.** All 4,000 manuals must be indexed within the first week after go-live.
        4. **Network.** Public network access is disabled on stturbinemedia. Data must not travel over the public internet, and services must authenticate to each other by using managed identities instead of keys.
        5. **Quality.** Before go-live, the team must measure, on a test dataset, whether answers contain claims that are not supported by the retrieved passages, whether the retrieved passages are relevant to the question, and whether each answer addresses the question. The test dataset contains questions only, without expected answers or relevance labels.
      fr: |
        Relecloud a défini les exigences suivantes :

        1. **Inspections.** Pour chaque vidéo de drone, la solution doit renvoyer une entrée par pale, avec ses heures de début et de fin, une description des dommages visibles et une gravité Minor, Moderate ou Severe. La solution doit utiliser Azure Content Understanding dans Foundry Tools.
        2. **Manuels.** Tout le texte des manuels, y compris les étiquettes et les références de pièces imprimées dans les schémas, doit pouvoir être recherché par maintenance-assistant. L'index doit stocker des segments de texte avec leurs incorporations vectorielles.
        3. **Ingestion.** Les 4 000 manuels doivent être indexés dans la première semaine suivant la mise en production.
        4. **Réseau.** L'accès réseau public est désactivé sur stturbinemedia. Les données ne doivent pas transiter par l'internet public, et les services doivent s'authentifier entre eux à l'aide d'identités managées plutôt que de clés.
        5. **Qualité.** Avant la mise en production, l'équipe doit mesurer, sur un jeu de données de test, si les réponses contiennent des affirmations non étayées par les passages récupérés, si les passages récupérés sont pertinents pour la question, et si chaque réponse répond à la question. Le jeu de données de test ne contient que des questions, sans réponses attendues ni étiquettes de pertinence.
