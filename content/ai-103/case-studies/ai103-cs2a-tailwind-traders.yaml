id: ai103-cs2a-tailwind-traders
status: draft
title:
  en: |
    Tailwind Traders
  fr: |
    Tailwind Traders
tabs:
  - key: overview
    title: { en: "Overview", fr: "Vue d'ensemble" }
    body:
      en: |
        Tailwind Traders sells furniture, lighting and home decor online in 14 countries. A team of 30 catalog editors creates the product listings, and a team of four developers builds AI features in Python.

        Tailwind Traders is building **Catalog Studio**, an internal web app that prepares the images and texts of each new product listing.
      fr: |
        Tailwind Traders vend en ligne des meubles, des luminaires et des objets de décoration dans 14 pays. Une équipe de 30 rédacteurs catalogue crée les fiches produits, et une équipe de quatre développeurs crée des fonctionnalités IA en Python.

        Tailwind Traders développe **Catalog Studio**, une application web interne qui prépare les images et les textes de chaque nouvelle fiche produit.
  - key: existing
    title: { en: "Existing environment", fr: "Environnement existant" }
    body:
      en: |
        Tailwind Traders has a Microsoft Foundry resource named **tw-foundry** that contains a project named **catalog-prj**. Tailwind Traders has been approved for limited access to the gpt-image-1 model.

        | Resource | Type | Configuration |
        | --- | --- | --- |
        | img-catalog | Model deployment | gpt-image-1 |
        | video-catalog | Model deployment | Sora 2 |
        | vision-chat | Model deployment | Vision-enabled chat model, called by using the Chat Completions API |
        | extract-chat | Model deployment | Chat model that supports structured outputs, called by using the Chat Completions API |
        | sttwproducts | Storage account | Container **product-photos**. Public network access is disabled; the firewall allows only the virtual network **vnet-catalog** |
        | ca-catalog-studio | Azure Container Apps app | Hosts Catalog Studio; integrated with vnet-catalog |

        Editors upload the studio photos of each product to the **product-photos** container. Each product listing has between one and eight photos. The studio photos are 2048x1365 pixels and show only the product, on a white background.
      fr: |
        Tailwind Traders dispose d'une ressource Microsoft Foundry nommée **tw-foundry** qui contient un projet nommé **catalog-prj**. Tailwind Traders a obtenu l'accès limité au modèle gpt-image-1.

        | Ressource | Type | Configuration |
        | --- | --- | --- |
        | img-catalog | Déploiement de modèle | gpt-image-1 |
        | video-catalog | Déploiement de modèle | Sora 2 |
        | vision-chat | Déploiement de modèle | Modèle de conversation compatible vision, appelé avec l'API Chat Completions |
        | extract-chat | Déploiement de modèle | Modèle de conversation qui prend en charge les sorties structurées, appelé avec l'API Chat Completions |
        | sttwproducts | Compte de stockage | Conteneur **product-photos**. L'accès réseau public est désactivé ; le pare-feu n'autorise que le réseau virtuel **vnet-catalog** |
        | ca-catalog-studio | Application Azure Container Apps | Héberge Catalog Studio ; intégrée à vnet-catalog |

        Les rédacteurs déposent les photos studio de chaque produit dans le conteneur **product-photos**. Chaque fiche produit compte entre une et huit photos. Les photos studio font 2048x1365 pixels et ne montrent que le produit, sur un fond blanc.
  - key: requirements
    title: { en: "Requirements", fr: "Exigences" }
    body:
      en: |
        Tailwind Traders identifies the following requirements for Catalog Studio:

        1. **Product videos.** For each new product, Catalog Studio must generate an 8-second landscape video that starts from the main studio photo of the product and shows the camera slowly moving around it. The product in the video must look like the product in the photo.
        2. **Quick view images.** For the quick view widget of the website, Catalog Studio must generate product images with a transparent background. Each request must return four variants, from which the editor picks one.
        3. **Captions.** Catalog Studio must produce a short caption for each photo, which is used by the image search of the website, and one detailed description that covers all the photos of a listing.
        4. **Attributes.** Supplier descriptions are free text in several languages. Catalog Studio must extract them into JSON that contains `product_type` (one value of a fixed list), `material`, `dimensions_cm` and `color`. Many descriptions don't mention a color. Every response must validate against the Tailwind Traders schema.
        5. **Other workloads.** The architects must choose a Foundry service for each remaining catalog workload: translating the assembly manuals (Word documents) into nine languages while keeping their layout, extracting fields from supplier invoices (PDF files), retrieving catalog content by keywords and vectors for the shopping assistant, and screening customer reviews for hate and violence before they are published.
      fr: |
        Tailwind Traders a défini les exigences suivantes pour Catalog Studio :

        1. **Vidéos produits.** Pour chaque nouveau produit, Catalog Studio doit générer une vidéo de 8 secondes au format paysage qui part de la photo studio principale du produit et montre la caméra tournant lentement autour de lui. Le produit de la vidéo doit ressembler au produit de la photo.
        2. **Images d'aperçu rapide.** Pour le widget d'aperçu rapide du site web, Catalog Studio doit générer des images de produits avec un arrière-plan transparent. Chaque requête doit renvoyer quatre variantes, parmi lesquelles le rédacteur en choisit une.
        3. **Légendes.** Catalog Studio doit produire une légende courte pour chaque photo, utilisée par la recherche d'images du site web, et une description détaillée unique qui couvre toutes les photos d'une fiche.
        4. **Attributs.** Les descriptions des fournisseurs sont du texte libre en plusieurs langues. Catalog Studio doit les extraire dans un JSON qui contient `product_type` (une valeur d'une liste fixe), `material`, `dimensions_cm` et `color`. Beaucoup de descriptions ne mentionnent aucune couleur. Chaque réponse doit être valide par rapport au schéma de Tailwind Traders.
        5. **Autres charges de travail.** Les architectes doivent choisir un service Foundry pour chacune des autres charges de travail du catalogue : traduire les notices de montage (documents Word) dans neuf langues en conservant leur mise en page, extraire les champs des factures des fournisseurs (fichiers PDF), récupérer le contenu du catalogue par mots clés et par vecteurs pour l'assistant d'achat, et filtrer les avis clients contenant de la haine ou de la violence avant leur publication.
