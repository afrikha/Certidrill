id: ai103-5a-skill-matching
objective: "5.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is designing the skillset that enriches customer correspondence and product photos before they are indexed in Azure AI Search for a support agent.

    Which skill should you use for each requirement? To answer, drag the appropriate skills to the correct requirements. Each skill may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit l'ensemble de compétences qui enrichit la correspondance des clients et les photos de produits avant leur indexation dans Azure AI Search pour un agent de support.

    Quelle compétence devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les compétences appropriées vers les exigences correspondantes. Chaque compétence peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pii, text: PII Detection }
    - { id: trans, text: Text Translation }
    - { id: image, text: Image Analysis }
    - { id: genai, text: GenAI Prompt }
    - { id: link, text: Entity Linking }
    - { id: key, text: Key Phrase Extraction }
  targets:
    - { id: t1, text: { en: "Mask phone numbers and email addresses in the letters before indexing", fr: "Masquer les numéros de téléphone et les adresses e-mail dans les courriers avant l'indexation" } }
    - { id: t2, text: { en: "Store an English version of letters written in Spanish and German", fr: "Stocker une version anglaise des courriers rédigés en espagnol et en allemand" } }
    - { id: t3, text: { en: "Add captions and tags that describe each product photo", fr: "Ajouter des légendes et des étiquettes qui décrivent chaque photo de produit" } }
    - { id: t4, text: { en: "Have a chat model write a short summary of each letter", fr: "Faire rédiger par un modèle de conversation un court résumé de chaque courrier" } }
answer:
  mapping: { t1: pii, t2: trans, t3: image, t4: genai }
explanation:
  correct:
    en: |
      PII Detection extracts personal information and can mask it. Text Translation translates text for normalization or localization. Image Analysis returns a description (captions and tags), objects and other visual features. The GenAI Prompt skill sends a prompt to a chat completion model deployed in Foundry and stores its response, such as a summary.
    fr: |
      PII Detection extrait les informations personnelles et peut les masquer. Text Translation traduit le texte pour le normaliser ou le localiser. Image Analysis renvoie une description (légendes et étiquettes), des objets et d'autres caractéristiques visuelles. La compétence GenAI Prompt envoie une invite à un modèle de complétion de conversation déployé dans Foundry et stocke sa réponse, par exemple un résumé.
  options:
    link:
      en: |
        Entity Linking links recognized entities to Wikipedia articles; it neither masks nor summarizes.
      fr: |
        Entity Linking relie les entités reconnues à des articles Wikipédia ; elle ne masque ni ne résume.
    key:
      en: |
        Key Phrase Extraction returns a list of important phrases, not a written summary.
      fr: |
        Key Phrase Extraction renvoie une liste d'expressions importantes, pas un résumé rédigé.
references:
  - title: Attach a billable resource to a skillset in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services
  - title: GenAI Prompt skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-genai-prompt
