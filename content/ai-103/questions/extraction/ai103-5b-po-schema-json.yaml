id: ai103-5b-po-schema-json
objective: "5.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys is defining a custom Azure Content Understanding analyzer for purchase orders. An ERP integration consumes the fields, and an agent reasons over the Markdown.

    The analyzer must meet the following requirements:

    - PONumber is copied exactly as printed on the order.
    - Lines returns one record per order line, each with a SKU and a quantity.
    - Priority is either Standard or Rush.

    How should you complete the analyzer definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys définit un analyseur Azure Content Understanding personnalisé pour des bons de commande. Une intégration ERP consomme les champs, et un agent raisonne sur le Markdown.

    L'analyseur doit satisfaire les exigences suivantes :

    - PONumber est copié exactement tel qu'il est imprimé sur le bon.
    - Lines renvoie un enregistrement par ligne de commande, chacun avec une référence (SKU) et une quantité.
    - Priority vaut soit Standard, soit Rush.

    Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "analyzerId": "tailspinPoAnalyzer",
      "baseAnalyzerId": "prebuilt-document",
      "config": {
        "tableFormat": "markdown",
        "[[conf]]": true
      },
      "fieldSchema": {
        "name": "PurchaseOrder",
        "fields": {
          "PONumber": { "type": "string", "method": "extract", "description": "Purchase order number, labeled PO No." },
          "Lines": {
            "type": "[[linetype]]",
            "method": "generate",
            "description": "Each line of the order table",
            "[[itemskey]]": {
              "type": "object",
              "properties": { "Sku": { "type": "string" }, "Quantity": { "type": "number" } }
            }
          },
          "Priority": { "type": "string", "method": "classify", "[[enumkey]]": ["Standard", "Rush"] }
        }
      }
    }
  slots:
    - id: conf
      options:
        - { id: details, text: returnDetails }
        - { id: estimate, text: estimateFieldSourceAndConfidence }
        - { id: segment, text: enableSegment }
        - { id: omit, text: omitContent }
    - id: linetype
      options:
        - { id: object, text: object }
        - { id: string, text: string }
        - { id: array, text: array }
    - id: itemskey
      options:
        - { id: items, text: items }
        - { id: properties, text: properties }
        - { id: fields, text: fields }
    - id: enumkey
      options:
        - { id: categories, text: contentCategories }
        - { id: enum, text: enum }
        - { id: items, text: items }
answer:
  values: { conf: estimate, linetype: array, itemskey: items, enumkey: enum }
explanation:
  correct:
    en: |
      Fields that use the extract method require source and confidence estimation, so estimateFieldSourceAndConfidence must be true. A list of records is an array whose items are objects, and the object's subfields go in properties. A classify field picks its value from a fixed set, typically listed in enum.
    fr: |
      Les champs qui utilisent la méthode extract exigent l'estimation de la source et de la confiance : estimateFieldSourceAndConfidence doit valoir true. Une liste d'enregistrements est un tableau (array) dont les éléments (items) sont des objets, et les sous-champs de l'objet se placent dans properties. Un champ classify choisit sa valeur dans un ensemble fixe, généralement listé dans enum.
  options:
    conf: { en: "returnDetails adds bounding boxes and spans to the content, enableSegment splits files for classification, and omitContent removes the Markdown that the agent needs; none of them satisfies the extract method.", fr: "returnDetails ajoute les cadres englobants et les étendues au contenu, enableSegment découpe les fichiers pour la classification, et omitContent supprime le Markdown dont l'agent a besoin ; aucun ne satisfait la méthode extract." }
    linetype: { en: "An object holds one record and a string one value; only array holds a list of records.", fr: "Un objet contient un seul enregistrement et une chaîne une seule valeur ; seul array contient une liste d'enregistrements." }
    itemskey: { en: "properties defines the subfields of an object, not the element type of an array; fields is used only at the top of the field schema.", fr: "properties définit les sous-champs d'un objet, pas le type des éléments d'un tableau ; fields n'est utilisé qu'au premier niveau du schéma de champs." }
    enumkey: { en: "contentCategories is an analyzer setting for document classification and segmentation, not a list of values for a field.", fr: "contentCategories est un paramètre d'analyseur pour la classification et la segmentation des documents, pas une liste de valeurs pour un champ." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
