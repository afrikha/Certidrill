id: ai103-5a-photo-similarity
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys stores 200,000 product photos in Azure Blob Storage. The photos contain almost no text. You are building an Azure AI Search index for a shopping assistant.

    Shoppers must be able to find products both by typing a description, such as "wooden train with red wagons", and by uploading a photo of a similar toy. Indexing must not call a large language model for each photo.

    What should you include in the skillset and the index?
  fr: |
    Wingtip Toys stocke 200 000 photos de produits dans Stockage Blob Azure. Les photos ne contiennent presque pas de texte. Vous créez un index Azure AI Search pour un assistant d'achat.

    Les clients doivent pouvoir trouver des produits en tapant une description, par exemple « train en bois avec des wagons rouges », et en chargeant la photo d'un jouet similaire. L'indexation ne doit pas appeler un grand modèle de langage pour chaque photo.

    Que devez-vous inclure dans l'ensemble de compétences et dans l'index ?
body:
  options:
    - { id: a, text: { en: "The GenAI Prompt skill to describe each photo, an Azure OpenAI Embedding skill, and an Azure OpenAI vectorizer", fr: "La compétence GenAI Prompt pour décrire chaque photo, une compétence Azure OpenAI Embedding et un vectoriseur Azure OpenAI" } }
    - { id: b, text: { en: "The Azure Vision multimodal embeddings skill, and an Azure Vision vectorizer that uses the same model", fr: "La compétence Azure Vision multimodal embeddings, et un vectoriseur Azure Vision qui utilise le même modèle" } }
    - { id: c, text: { en: "The OCR skill and the Text Merge skill, and full-text search on the merged text", fr: "Les compétences OCR et Text Merge, et une recherche en texte intégral sur le texte fusionné" } }
    - { id: d, text: { en: "The Image Analysis skill with the tags feature, and full-text search on the tags", fr: "La compétence Image Analysis avec la fonctionnalité tags, et une recherche en texte intégral sur les étiquettes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Azure Vision multimodal embeddings skill (preview) places images and text in the same vector space without an LLM call at indexing time. An Azure Vision vectorizer on the same model converts both a typed description and an uploaded image into a query vector, so text-to-image and image-to-image searches work against the same field.
    fr: |
      La compétence Azure Vision multimodal embeddings (préversion) place les images et le texte dans le même espace vectoriel, sans appel à un LLM pendant l'indexation. Un vectoriseur Azure Vision qui utilise le même modèle convertit aussi bien une description tapée qu'une image chargée en vecteur de requête : les recherches texte-image et image-image portent sur le même champ.
  options:
    a:
      en: |
        Image verbalization calls an LLM for each photo, and pipelines based on GenAI Prompt descriptions do not support image queries.
      fr: |
        La verbalisation d'images appelle un LLM pour chaque photo, et les pipelines fondés sur les descriptions GenAI Prompt ne prennent pas en charge les requêtes par image.
    c:
      en: |
        The photos contain almost no text, so OCR produces little to search, and full-text search cannot take a photo as the query.
      fr: |
        Les photos ne contiennent presque pas de texte : l'OCR ne produit presque rien à rechercher, et la recherche en texte intégral ne peut pas utiliser une photo comme requête.
    d:
      en: |
        Tags make typed keywords searchable, but full-text search cannot compare an uploaded photo with the indexed photos.
      fr: |
        Les étiquettes rendent des mots clés recherchables, mais la recherche en texte intégral ne peut pas comparer une photo chargée aux photos indexées.
references:
  - title: Multimodal search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/multimodal-search-overview
  - title: Configure a vectorizer in a search index
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-configure-vectorizer
