id: ai103-5a-photo-similarity
objective: "5.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys stores 200,000 product photos in Azure Blob Storage. The photos contain almost no text. You are building an Azure AI Search index for a shopping assistant.

    Shoppers find products by typing descriptions in their own words, such as "wooden train with red wagons" or "toy locomotive pulling red cars", and the search must match the meaning of the description, not only its keywords. Indexing must not call a large language model for each photo.

    What should you include in the skillset and the index?
  fr: |
    Wingtip Toys stocke 200 000 photos de produits dans Stockage Blob Azure. Les photos ne contiennent presque pas de texte. Vous créez un index Azure AI Search pour un assistant d'achat.

    Les clients trouvent les produits en tapant des descriptions dans leurs propres mots, par exemple « train en bois avec des wagons rouges » ou « locomotive jouet qui tire des voitures rouges », et la recherche doit correspondre au sens de la description, pas seulement à ses mots clés. L'indexation ne doit pas appeler un grand modèle de langage pour chaque photo.

    Que devez-vous inclure dans l'ensemble de compétences et dans l'index ?
body:
  options:
    - { id: a, text: { en: "The GenAI Prompt skill to describe each photo, an Azure OpenAI Embedding skill, and an Azure OpenAI vectorizer", fr: "La compétence GenAI Prompt pour décrire chaque photo, une compétence Azure OpenAI Embedding et un vectoriseur Azure OpenAI" } }
    - { id: b, text: { en: "The Image Analysis skill to caption each photo, an Azure OpenAI Embedding skill, and an Azure OpenAI vectorizer", fr: "La compétence Image Analysis pour légender chaque photo, une compétence Azure OpenAI Embedding et un vectoriseur Azure OpenAI" } }
    - { id: c, text: { en: "The OCR skill and the Text Merge skill, and full-text search on the merged text", fr: "Les compétences OCR et Text Merge, et une recherche en texte intégral sur le texte fusionné" } }
    - { id: d, text: { en: "The Image Analysis skill with the tags feature, and full-text search on the tags", fr: "La compétence Image Analysis avec la fonctionnalité tags, et une recherche en texte intégral sur les étiquettes" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Image Analysis skill uses the Azure Vision models, not an LLM, and its description feature returns a caption that describes each photo in a complete sentence. Embedding the captions with the Azure OpenAI Embedding skill, and vectorizing the typed description with an Azure OpenAI vectorizer on the same model, lets a vector query match paraphrases such as "toy locomotive pulling red cars".
    fr: |
      La compétence Image Analysis utilise les modèles d'Azure Vision, pas un LLM, et sa fonctionnalité description renvoie une légende qui décrit chaque photo en une phrase complète. Vectoriser les légendes avec la compétence Azure OpenAI Embedding, et la description tapée avec un vectoriseur Azure OpenAI qui utilise le même modèle, permet à une requête vectorielle de trouver des paraphrases comme « locomotive jouet qui tire des voitures rouges ».
  options:
    a:
      en: |
        Image verbalization with the GenAI Prompt skill calls an LLM for each photo during indexing, which the requirement forbids.
      fr: |
        La verbalisation d'images avec la compétence GenAI Prompt appelle un LLM pour chaque photo pendant l'indexation, ce que l'exigence interdit.
    c:
      en: |
        The photos contain almost no text, so OCR produces little to search, and full-text search matches keywords, not meaning.
      fr: |
        Les photos ne contiennent presque pas de texte : l'OCR ne produit presque rien à rechercher, et la recherche en texte intégral fait correspondre des mots clés, pas un sens.
    d:
      en: |
        Tags make typed keywords searchable, but full-text search on single-word tags doesn't match a paraphrase such as "locomotive pulling red cars" by meaning.
      fr: |
        Les étiquettes rendent des mots clés recherchables, mais une recherche en texte intégral sur des étiquettes d'un mot ne trouve pas par le sens une paraphrase comme « locomotive qui tire des voitures rouges ».
references:
  - title: Image Analysis cognitive skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-image-analysis
  - title: Multimodal search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/multimodal-search-overview
