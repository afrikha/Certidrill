id: ai103-5b-prebuilt-domain-match
objective: "5.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is adopting Azure Content Understanding for several document processing needs. Chat completion and embedding models are deployed and set as defaults in the Foundry resource. The team wants to write as little schema as possible.

    Which analyzer should you use for each need? To answer, drag the appropriate analyzers to the correct needs. Each analyzer may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. adopte Azure Content Understanding pour plusieurs besoins de traitement de documents. Des modèles de complétion de conversation et d'incorporation sont déployés et définis par défaut dans la ressource Foundry. L'équipe veut écrire le moins de schéma possible.

    Quel analyseur devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les analyseurs appropriés vers les besoins correspondants. Chaque analyseur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fieldschema, text: prebuilt-documentFieldSchema }
    - { id: invoice, text: prebuilt-invoice }
    - { id: id, text: prebuilt-idDocument }
    - { id: contract, text: prebuilt-contract }
    - { id: read, text: prebuilt-read }
    - { id: layout, text: prebuilt-layout }
  targets:
    - id: newform
      text: { en: "Get a proposed field schema for a type of form that Fabrikam has never processed", fr: "Obtenir une proposition de schéma de champs pour un type de formulaire que Fabrikam n'a jamais traité" }
    - id: bills
      text: { en: "Extract the vendor, totals and line items of supplier bills", fr: "Extraire le fournisseur, les totaux et les lignes des factures fournisseurs" }
    - id: passports
      text: { en: "Extract the holder's name and the expiration date from passports and driver's licenses", fr: "Extraire le nom du titulaire et la date d'expiration des passeports et des permis de conduire" }
    - id: agreements
      text: { en: "Extract the key fields of service agreements signed with partners", fr: "Extraire les champs clés des contrats de service signés avec des partenaires" }
answer:
  mapping: { newform: fieldschema, bills: invoice, passports: id, agreements: contract }
explanation:
  correct:
    en: |
      prebuilt-documentFieldSchema is a utility analyzer that proposes a field schema for a document, a starting point for a new document type. prebuilt-invoice, prebuilt-idDocument (identity documents such as passports and licenses) and prebuilt-contract are domain analyzers that return their fields without a schema that you write.
    fr: |
      prebuilt-documentFieldSchema est un analyseur utilitaire qui propose un schéma de champs pour un document, point de départ pour un nouveau type de document. prebuilt-invoice, prebuilt-idDocument (documents d'identité tels que passeports et permis) et prebuilt-contract sont des analyseurs de domaine qui renvoient leurs champs sans schéma à écrire.
  options:
    read: { en: "prebuilt-read returns OCR text only, with no named fields.", fr: "prebuilt-read ne renvoie que le texte de l'OCR, sans champs nommés." }
    layout: { en: "prebuilt-layout returns text, tables and structure, but no named fields.", fr: "prebuilt-layout renvoie le texte, les tableaux et la structure, mais aucun champ nommé." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
