stem:
  en: You run a vector query only.
  fr: Vous exécutez uniquement une requête vectorielle.
body:
  solution:
    en: |
      The app runs the following query.

      ```python
      results = client.search(
          search_text=None,
          vector_queries=[VectorizableTextQuery(
              text=question, k_nearest_neighbors=5, fields="contentVector")],
          top=5,
      )
      ```
    fr: |
      L'application exécute la requête suivante.

      ```python
      results = client.search(
          search_text=None,
          vector_queries=[VectorizableTextQuery(
              text=question, k_nearest_neighbors=5, fields="contentVector")],
          top=5,
      )
      ```
answer: { value: false }
explanation:
  correct:
    en: A pure vector query finds conceptually similar passages, but similarity search is not designed to match exact strings such as part numbers, so passages that contain `HX-4471-B` can be missed. The query also does not set `query_type="semantic"`, so no semantic reranking occurs.
    fr: "Une requête purement vectorielle trouve les passages conceptuellement proches, mais la recherche par similarité n'est pas conçue pour faire correspondre des chaînes exactes telles que des références de pièces : des passages contenant `HX-4471-B` peuvent être manqués. La requête ne définit pas non plus `query_type=\"semantic\"` : aucun reclassement sémantique n'a lieu."
references:
  - title: Create a Hybrid Query
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
