id: ai103-5b-supported-models-check
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. plans to create a custom Azure Content Understanding analyzer derived from prebuilt-document. The developers want to set a specific chat completion model in the models property of the new analyzer.

    Before you create the analyzer, you need to confirm that the base analyzer accepts that model. What should you do?
  fr: |
    Proseware, Inc. prévoit de créer un analyseur Azure Content Understanding personnalisé dérivé de prebuilt-document. Les développeurs veulent définir un modèle de complétion de conversation précis dans la propriété models du nouvel analyseur.

    Avant de créer l'analyseur, vous devez confirmer que l'analyseur de base accepte ce modèle. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Analyze a sample file with prebuilt-document, and read the usage object of the response.", fr: "Analyser un fichier d'exemple avec prebuilt-document, et lire l'objet usage de la réponse." } }
    - { id: b, text: { en: "Check the tokens-per-minute quota of the model deployment in the Foundry portal.", fr: "Vérifier le quota de jetons par minute du déploiement de modèle dans le portail Foundry." } }
    - { id: c, text: { en: "Call get_defaults, and read the model deployments mapped for the resource.", fr: "Appeler get_defaults, et lire les déploiements de modèles associés pour la ressource." } }
    - { id: d, text: { en: "Get the prebuilt-document analyzer definition, and read its supportedModels property.", fr: "Obtenir la définition de l'analyseur prebuilt-document, et lire sa propriété supportedModels." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The completion and embedding models of a custom analyzer must match an entry of the supportedModels of its base analyzer. A GET request on the analyzer (or get_analyzer in the Python SDK) returns its definition, including supportedModels and the models it uses by default.
    fr: |
      Les modèles de complétion et d'incorporation d'un analyseur personnalisé doivent correspondre à une entrée de la propriété supportedModels de son analyseur de base. Une requête GET sur l'analyseur (ou get_analyzer dans le kit SDK Python) renvoie sa définition, y compris supportedModels et les modèles qu'il utilise par défaut.
  options:
    a: { en: "The usage object reports the pages, hours and tokens consumed by one analysis, not the models that the analyzer supports.", fr: "L'objet usage indique les pages, les heures et les jetons consommés par une analyse, pas les modèles que l'analyseur prend en charge." }
    b: { en: "Quota limits throughput; it doesn't tell you whether the base analyzer accepts the model.", fr: "Le quota limite le débit ; il n'indique pas si l'analyseur de base accepte le modèle." }
    c: { en: "The defaults show which deployments are mapped for the resource, not which models a given base analyzer supports.", fr: "Les valeurs par défaut montrent quels déploiements sont associés pour la ressource, pas quels modèles un analyseur de base donné prend en charge." }
references:
  - title: Model deployment options for Content Understanding analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
