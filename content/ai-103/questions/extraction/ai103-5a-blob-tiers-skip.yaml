id: ai103-5a-blob-tiers-skip
objective: "5.1.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys indexes a blob container named **manuals** into an Azure AI Search index by using a blob indexer with the default configuration. The container holds the blobs shown in the following table.

    Answer each prompt by selecting the appropriate blob.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys indexe un conteneur d'objets blob nommé **manuals** dans un index Azure AI Search à l'aide d'un indexeur de blobs doté de la configuration par défaut. Le conteneur contient les objets blob indiqués dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'objet blob approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The indexer extracts the metadata of this blob but not its content.", fr: "L'indexeur extrait les métadonnées de cet objet blob, mais pas son contenu." }
    - id: p2
      text: { en: "The indexer cannot read this blob because of its access tier.", fr: "L'indexeur ne peut pas lire cet objet blob en raison de son niveau d'accès." }
  grid:
    header: [{ en: "Blob", fr: "Objet blob" }, { en: "Access tier", fr: "Niveau d'accès" }, { en: "Custom metadata", fr: "Métadonnées personnalisées" }]
    rows:
      - [{ text: drone-x1.pdf, area: b1 }, { text: Hot }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: drone-x2.pdf, area: b2 }, { text: Cool }, { text: "AzureSearch_SkipContent = true" }]
      - [{ text: drone-x3.pdf, area: b3 }, { text: Cold }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: drone-x4.pdf, area: b4 }, { text: Archive }, { text: { en: "None", fr: "Aucune" } }]
      - [{ text: drone-x5.pdf, area: b5 }, { text: Hot }, { text: "AzureSearch_Skip = true" }]
answer:
  values: { p1: b2, p2: b4 }
explanation:
  correct:
    en: |
      The `AzureSearch_SkipContent` metadata property set to `true` makes the indexer extract only the metadata of that blob, as `dataToExtract: allMetadata` would for the whole indexer. `AzureSearch_Skip` skips the blob entirely, content and metadata. Indexers read blobs in the Hot, Cool and Cold tiers, but blobs in the Archive tier are not supported.
    fr: |
      La propriété de métadonnées `AzureSearch_SkipContent` définie sur `true` fait extraire à l'indexeur uniquement les métadonnées de cet objet blob, comme le ferait `dataToExtract: allMetadata` pour l'indexeur entier. `AzureSearch_Skip` ignore entièrement l'objet blob, contenu et métadonnées. Les indexeurs lisent les objets blob des niveaux chaud (Hot), froid (Cool) et froid (Cold), mais les objets blob du niveau archive (Archive) ne sont pas pris en charge.
  options:
    b5:
      en: |
        AzureSearch_Skip prevents the extraction of both the metadata and the content, and it is not related to the access tier.
      fr: |
        AzureSearch_Skip empêche l'extraction des métadonnées comme du contenu, et n'a aucun lien avec le niveau d'accès.
    b3:
      en: |
        Indexers can read blobs in the Cold tier.
      fr: |
        Les indexeurs peuvent lire les objets blob du niveau froid (Cold).
references:
  - title: Search over Azure Blob Storage content
    url: https://learn.microsoft.com/en-us/azure/search/search-blob-storage-integration
