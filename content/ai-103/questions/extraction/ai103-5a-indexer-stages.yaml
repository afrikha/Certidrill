id: ai103-5a-indexer-stages
objective: "5.1.4"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses an Azure AI Search indexer with a skillset to load product manuals from Azure Blob Storage into the grounding index of a Foundry agent. The indexer uses field mappings for the blob metadata and output field mappings for the enriched content.

    In which order does the indexer process each manual? To answer, move the appropriate stages from the list of stages to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys utilise un indexeur Azure AI Search doté d'un ensemble de compétences pour charger des manuels de produits depuis Stockage Blob Azure dans l'index d'ancrage d'un agent Foundry. L'indexeur utilise des mappages de champs pour les métadonnées des objets blob et des mappages de champs de sortie pour le contenu enrichi.

    Dans quel ordre l'indexeur traite-t-il chaque manuel ? Pour répondre, déplacez les étapes appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: crack, text: { en: "Document cracking: open the file and extract its text, images and metadata", fr: "Craquage de documents : ouvrir le fichier et en extraire le texte, les images et les métadonnées" } }
    - { id: fmap, text: { en: "Field mappings: send source fields such as the blob path to index fields", fr: "Mappages de champs : envoyer les champs sources, comme le chemin de l'objet blob, vers les champs de l'index" } }
    - { id: skills, text: { en: "Skillset execution: run OCR, chunking and vectorization", fr: "Exécution de l'ensemble de compétences : exécuter l'OCR, le découpage en blocs et la vectorisation" } }
    - { id: omap, text: { en: "Output field mappings: send skill outputs from the enriched document to index fields", fr: "Mappages de champs de sortie : envoyer les sorties des compétences du document enrichi vers les champs de l'index" } }
    - { id: vectorizer, text: { en: "Vectorizer execution: convert the manual text into a query vector", fr: "Exécution du vectoriseur : convertir le texte du manuel en vecteur de requête" } }
    - { id: semantic, text: { en: "Semantic ranking: rerank the chunks of the manual", fr: "Classement sémantique : reclasser les blocs du manuel" } }
answer:
  sequence: [crack, fmap, skills, omap]
explanation:
  correct:
    en: |
      An indexer first cracks the document, then applies the field mappings, which copy source fields as they are. The skillset then runs on the enriched document, and the output field mappings finally send the skill outputs to the index fields.
    fr: |
      Un indexeur procède d'abord au craquage du document, puis applique les mappages de champs, qui copient les champs sources tels quels. L'ensemble de compétences s'exécute ensuite sur le document enrichi, et les mappages de champs de sortie envoient enfin les sorties des compétences vers les champs de l'index.
  options:
    vectorizer:
      en: |
        A vectorizer runs at query time to vectorize the query, not during indexing.
      fr: |
        Un vectoriseur s'exécute au moment de la requête pour vectoriser celle-ci, pas pendant l'indexation.
    semantic:
      en: |
        Semantic ranking reranks query results; it is not an indexing stage.
      fr: |
        Le classement sémantique reclasse les résultats des requêtes ; ce n'est pas une étape d'indexation.
references:
  - title: Indexers in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-indexer-overview
