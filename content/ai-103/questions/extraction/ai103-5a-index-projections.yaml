id: ai103-5a-index-projections
objective: "5.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Relecloud has an Azure AI Search index named **guides-index** with the fields `chunk_id` (key, keyword analyzer), `parent_id` (filterable string), `title`, `chunk` and `chunk_vector`. In the skillset, a Text Split skill writes chunks to `/document/pages/*`, and an embedding skill writes each vector to `/document/pages/*/chunk_vector`.

    The index must contain exactly one search document per chunk and no search document for the source files themselves.

    How should you complete the index projection? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Relecloud dispose d'un index Azure AI Search nommé **guides-index** doté des champs `chunk_id` (clé, analyseur keyword), `parent_id` (chaîne filtrable), `title`, `chunk` et `chunk_vector`. Dans l'ensemble de compétences, une compétence Text Split écrit les blocs dans `/document/pages/*`, et une compétence d'embedding écrit chaque vecteur dans `/document/pages/*/chunk_vector`.

    L'index doit contenir exactement un document de recherche par bloc, et aucun document de recherche pour les fichiers sources eux-mêmes.

    Comment devez-vous compléter la projection d'index ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "indexProjections": {
      "selectors": [
        {
          "targetIndexName": "guides-index",
          "parentKeyFieldName": "[[parent]]",
          "sourceContext": "[[ctx]]",
          "mappings": [
            { "name": "chunk", "source": "/document/pages/*" },
            { "name": "chunk_vector", "source": "/document/pages/*/chunk_vector" },
            { "name": "title", "source": "/document/title" }
          ]
        }
      ],
      "parameters": { "projectionMode": "[[mode]]" }
    }
  slots:
    - id: parent
      options:
        - { id: chunk_id, text: chunk_id }
        - { id: parent_id, text: parent_id }
        - { id: title, text: title }
    - id: ctx
      options:
        - { id: doc, text: /document }
        - { id: pages, text: "/document/pages/*" }
        - { id: vec, text: "/document/pages/*/chunk_vector" }
    - id: mode
      options:
        - { id: include, text: includeIndexingParentDocuments }
        - { id: skip, text: skipIndexingParentDocuments }
        - { id: onetomany, text: oneToMany }
answer:
  values: { parent: parent_id, ctx: pages, mode: skip }
explanation:
  correct:
    en: |
      `parentKeyFieldName` names the filterable string field that receives the key of the source document, and it cannot be the document key. `sourceContext` sets the granularity of the projected documents, so `/document/pages/*` creates one search document per chunk. `skipIndexingParentDocuments` indexes only the chunks; the default, `includeIndexingParentDocuments`, also adds one document per source file.
    fr: |
      `parentKeyFieldName` désigne le champ chaîne filtrable qui reçoit la clé du document source, et il ne peut pas s'agir de la clé du document. `sourceContext` définit la granularité des documents projetés : `/document/pages/*` crée un document de recherche par bloc. `skipIndexingParentDocuments` n'indexe que les blocs ; la valeur par défaut, `includeIndexingParentDocuments`, ajoute aussi un document par fichier source.
  options:
    chunk_id: { en: "The parent key field cannot be the document key field.", fr: "Le champ de clé parent ne peut pas être le champ de clé du document." }
    doc: { en: "/document projects one search document per source file, not per chunk.", fr: "/document projette un document de recherche par fichier source, pas par bloc." }
    include: { en: "includeIndexingParentDocuments also indexes a document for each source file.", fr: "includeIndexingParentDocuments indexe aussi un document pour chaque fichier source." }
    onetomany: { en: "oneToMany is the outputMode of the Document Layout skill, not a projection mode.", fr: "oneToMany est l'outputMode de la compétence Document Layout, pas un mode de projection." }
references:
  - title: Define an index projection for parent-child indexing
    url: https://learn.microsoft.com/en-us/azure/search/search-how-to-define-index-projections
