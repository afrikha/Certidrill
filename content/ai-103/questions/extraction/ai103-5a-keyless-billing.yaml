id: ai103-5a-keyless-billing
objective: "5.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure AI Search service named **srch-wgb** in West Europe and a Foundry resource named **fdy-wgb** in Sweden Central. The skillset of srch-wgb uses the OCR, Image Analysis and PII Detection skills on more than 10,000 documents per day.

    You need to bill the skill execution to fdy-wgb. The solution must not use keys.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un service Azure AI Search nommé **srch-wgb** dans la région West Europe et d'une ressource Foundry nommée **fdy-wgb** dans la région Sweden Central. L'ensemble de compétences de srch-wgb utilise les compétences OCR, Image Analysis et PII Detection sur plus de 10 000 documents par jour.

    Vous devez facturer l'exécution des compétences à fdy-wgb. La solution ne doit pas utiliser de clés.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign the Cognitive Services User role on fdy-wgb to the managed identity of srch-wgb.", fr: "Attribuer le rôle Cognitive Services User sur fdy-wgb à l'identité managée de srch-wgb." } }
    - { id: b, text: { en: "Assign the Cognitive Services OpenAI User role on fdy-wgb to the managed identity of srch-wgb.", fr: "Attribuer le rôle Cognitive Services OpenAI User sur fdy-wgb à l'identité managée de srch-wgb." } }
    - { id: c, text: { en: "Set cognitiveServices to #Microsoft.Azure.Search.AIServicesByIdentity with the subdomainUrl of fdy-wgb.", fr: "Définir cognitiveServices sur #Microsoft.Azure.Search.AIServicesByIdentity avec le subdomainUrl de fdy-wgb." } }
    - { id: d, text: { en: "Set cognitiveServices to #Microsoft.Azure.Search.AIServicesByKey with the subdomainUrl of fdy-wgb.", fr: "Définir cognitiveServices sur #Microsoft.Azure.Search.AIServicesByKey avec le subdomainUrl de fdy-wgb." } }
    - { id: e, text: { en: "Re-create fdy-wgb in West Europe.", fr: "Recréer fdy-wgb dans la région West Europe." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      For keyless billing, the search service uses its managed identity: you assign that identity the Cognitive Services User role on the Foundry resource, and you set the `cognitiveServices` property of the skillset to `#Microsoft.Azure.Search.AIServicesByIdentity` with the `subdomainUrl` of the resource. This connection type has no region requirement.
    fr: |
      Pour une facturation sans clé, le service de recherche utilise son identité managée : vous attribuez à cette identité le rôle Cognitive Services User sur la ressource Foundry, et vous définissez la propriété `cognitiveServices` de l'ensemble de compétences sur `#Microsoft.Azure.Search.AIServicesByIdentity` avec le `subdomainUrl` de la ressource. Ce type de connexion n'impose aucune contrainte de région.
  options:
    b:
      en: |
        Cognitive Services OpenAI User is the role for calling Azure OpenAI models, as the embedding skill does; the billing connection of the skillset requires Cognitive Services User.
      fr: |
        Cognitive Services OpenAI User est le rôle qui permet d'appeler des modèles Azure OpenAI, comme le fait la compétence d'embedding ; la connexion de facturation de l'ensemble de compétences exige Cognitive Services User.
    d:
      en: |
        AIServicesByKey connects with a resource key, which the requirement forbids.
      fr: |
        AIServicesByKey se connecte avec une clé de ressource, ce que l'exigence interdit.
    e:
      en: |
        The same-region requirement applies to key-based connections; AIServicesByIdentity has no region requirement.
      fr: |
        La contrainte de même région concerne les connexions par clé ; AIServicesByIdentity n'impose aucune contrainte de région.
references:
  - title: Attach a billable resource to a skillset in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services
