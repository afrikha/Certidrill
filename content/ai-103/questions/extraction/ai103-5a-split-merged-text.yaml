id: ai103-5a-split-merged-text
objective: "5.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Health indexes clinical guidelines that mix digital pages and scanned pages. In the skillset, an OCR skill reads `/document/normalized_images/*`, and a Text Merge skill writes its `mergedText` output to `/document/merged_text`.

    You are adding a Text Split skill before the Azure OpenAI Embedding skill. The chunks must meet the following requirements:

    - Each chunk contains the text of the digital pages and the OCR text of the scanned pages.
    - The chunk size and the overlap are counted in the tokens of the Azure OpenAI tokenizer.
    - The chunks are written to `/document/pages`.

    How should you complete the skill definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Health indexe des recommandations cliniques qui mêlent des pages numériques et des pages numérisées. Dans l'ensemble de compétences, une compétence OCR lit `/document/normalized_images/*`, et une compétence Text Merge écrit sa sortie `mergedText` dans `/document/merged_text`.

    Vous ajoutez une compétence Text Split avant la compétence Azure OpenAI Embedding. Les blocs doivent satisfaire les exigences suivantes :

    - chaque bloc contient le texte des pages numériques et le texte OCR des pages numérisées ;
    - la taille des blocs et le chevauchement sont comptés en jetons du générateur de jetons Azure OpenAI ;
    - les blocs sont écrits dans `/document/pages`.

    Comment devez-vous compléter la définition de la compétence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "@odata.type": "#Microsoft.Skills.Text.SplitSkill",
      "context": "/document",
      "textSplitMode": "[[mode]]",
      "unit": "[[unit]]",
      "maximumPageLength": 512,
      "pageOverlapLength": 64,
      "inputs": [ { "name": "text", "source": "[[src]]" } ],
      "outputs": [ { "name": "[[out]]", "targetName": "pages" } ]
    }
  slots:
    - id: mode
      options:
        - { id: pages, text: pages }
        - { id: sentences, text: sentences }
    - id: unit
      options:
        - { id: characters, text: characters }
        - { id: aoai, text: azureOpenAITokens }
        - { id: tokens, text: tokens }
    - id: src
      options:
        - { id: content, text: /document/content }
        - { id: merged, text: /document/merged_text }
        - { id: ocrtext, text: "/document/normalized_images/*/text" }
    - id: out
      options:
        - { id: offsets, text: offsets }
        - { id: pagesout, text: pages }
        - { id: textItems, text: textItems }
answer:
  values: { mode: pages, unit: aoai, src: merged, out: textItems }
explanation:
  correct:
    en: |
      `maximumPageLength` and `pageOverlapLength` apply only when `textSplitMode` is `pages`. The `unit` parameter (preview) set to `azureOpenAITokens` counts both values in tokens instead of characters. The input must be the Text Merge output, which contains the digital text with the OCR text inserted at the image positions. The skill output is named `textItems`; `targetName` renames it to `pages`.
    fr: |
      `maximumPageLength` et `pageOverlapLength` ne s'appliquent que lorsque `textSplitMode` vaut `pages`. Le paramètre `unit` (préversion) défini sur `azureOpenAITokens` compte ces deux valeurs en jetons plutôt qu'en caractères. L'entrée doit être la sortie de Text Merge, qui contient le texte numérique avec le texte OCR inséré à la position des images. La sortie de la compétence s'appelle `textItems` ; `targetName` la renomme en `pages`.
  options:
    sentences: { en: "In sentences mode, the skill splits at sentence-ending punctuation and ignores the length and overlap settings.", fr: "En mode sentences, la compétence coupe à la ponctuation de fin de phrase et ignore les paramètres de longueur et de chevauchement." }
    characters: { en: "characters is the default unit and counts String.Length, not tokens.", fr: "characters est l'unité par défaut et compte String.Length, pas des jetons." }
    tokens: { en: "tokens is not a unit of the Text Split skill.", fr: "tokens n'est pas une unité de la compétence Text Split." }
    content: { en: "/document/content lacks the OCR text of the scanned pages.", fr: "/document/content ne contient pas le texte OCR des pages numérisées." }
    ocrtext: { en: "This path contains only the OCR text, without the text of the digital pages.", fr: "Ce chemin ne contient que le texte OCR, sans le texte des pages numériques." }
    pagesout: { en: "pages is the targetName in this definition; the output name of the skill is textItems.", fr: "pages est le targetName dans cette définition ; le nom de sortie de la compétence est textItems." }
references:
  - title: Text Split skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-textsplit
  - title: OCR cognitive skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr
