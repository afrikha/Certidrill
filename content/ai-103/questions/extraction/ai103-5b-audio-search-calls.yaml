id: ai103-5b-audio-search-calls
objective: "5.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank wants a support agent to answer questions about past customer calls. The call recordings will be converted to text and indexed in Azure AI Search for retrieval-augmented generation (RAG). Each search document must contain the transcript of the conversation and a one-paragraph summary.

    You need to use a prebuilt Azure Content Understanding analyzer. Which analyzer should you use?
  fr: |
    Woodgrove Bank souhaite qu'un agent de support réponde aux questions sur les appels clients passés. Les enregistrements des appels seront convertis en texte et indexés dans Azure AI Search pour la génération augmentée de récupération (RAG). Chaque document de recherche doit contenir la transcription de la conversation et un résumé d'un paragraphe.

    Vous devez utiliser un analyseur Azure Content Understanding prédéfini. Quel analyseur devez-vous utiliser ?
body:
  options:
    - { id: a, text: prebuilt-audio }
    - { id: b, text: prebuilt-videoSearch }
    - { id: c, text: prebuilt-callCenter }
    - { id: d, text: prebuilt-audioSearch }
answer: { optionId: d }
explanation:
  correct:
    en: |
      prebuilt-audioSearch is the RAG analyzer for audio: it transcribes the conversation and returns a one-paragraph summary, a text representation ready to embed and index.
    fr: |
      prebuilt-audioSearch est l'analyseur RAG pour l'audio : il transcrit la conversation et renvoie un résumé d'un paragraphe, une représentation textuelle prête à être vectorisée et indexée.
  options:
    a: { en: "prebuilt-audio is a base analyzer that you derive custom analyzers from; on its own, it doesn't define the search representation.", fr: "prebuilt-audio est un analyseur de base dont vous dérivez des analyseurs personnalisés ; à lui seul, il ne définit pas la représentation pour la recherche." }
    b: { en: "prebuilt-videoSearch targets video files, with segment descriptions of the visual content; the recordings are audio.", fr: "prebuilt-videoSearch cible les fichiers vidéo, avec des descriptions de segments du contenu visuel ; les enregistrements sont audio." }
    c: { en: "prebuilt-callCenter analyzes calls for topics, sentiment and insights for call analytics; it isn't the analyzer designed for RAG ingestion.", fr: "prebuilt-callCenter analyse les appels pour en tirer les sujets, le sentiment et des informations d'analyse ; ce n'est pas l'analyseur conçu pour l'ingestion RAG." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
