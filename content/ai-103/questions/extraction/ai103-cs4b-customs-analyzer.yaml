id: ai103-cs4b-customs-analyzer
objective: "5.2.3"
type: ordering
caseStudy: ai103-cs4b-consolidated
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the customs extraction requirement by using the Content Understanding REST API of ai-conmsg. A script will process each new declaration in the customs container.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez satisfaire l'exigence relative à l'extraction douanière à l'aide de l'API REST Content Understanding d'ai-conmsg. Un script traitera chaque nouvelle déclaration du conteneur customs.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: defaults, text: { en: "Deploy the models that the analyzer requires in ai-conmsg and set them as the Content Understanding default model deployments.", fr: "Déployer dans ai-conmsg les modèles dont l'analyseur a besoin et les définir comme déploiements de modèles par défaut de Content Understanding." } }
    - { id: create, text: { en: "Send a PUT request that creates customsAnalyzer with prebuilt-document as baseAnalyzerId and a fieldSchema that defines the four fields.", fr: "Envoyer une requête PUT qui crée customsAnalyzer avec prebuilt-document comme baseAnalyzerId et un fieldSchema qui définit les quatre champs." } }
    - { id: analyze, text: { en: "Send a POST request to the :analyze operation of customsAnalyzer with the URL of the declaration in inputs.", fr: "Envoyer une requête POST à l'opération :analyze de customsAnalyzer avec l'URL de la déclaration dans inputs." } }
    - { id: poll, text: { en: "Poll the URL returned in the Operation-Location header until the status is Succeeded, and then read the fields.", fr: "Interroger l'URL renvoyée dans l'en-tête Operation-Location jusqu'à ce que l'état soit Succeeded, puis lire les champs." } }
    - { id: body202, text: { en: "Read the fields from the body of the 202 Accepted response of the analyze request.", fr: "Lire les champs dans le corps de la réponse 202 Accepted de la requête d'analyse." } }
    - { id: skillset, text: { en: "Create an Azure AI Search skillset that calls customsAnalyzer for each declaration.", fr: "Créer un ensemble de compétences Azure AI Search qui appelle customsAnalyzer pour chaque déclaration." } }
answer:
  sequence: [ defaults, create, analyze, poll ]
explanation:
  correct:
    en: |
      Analyzers that use generative field extraction need model deployments, and ai-conmsg has no defaults yet, so you configure them first. You then create the custom analyzer from the prebuilt-document base with a field schema. Analysis is asynchronous: the POST returns 202 Accepted with an Operation-Location header, and you poll that URL until the status is Succeeded to get the result.
    fr: |
      Les analyseurs qui utilisent l'extraction de champs générative ont besoin de déploiements de modèles, et ai-conmsg n'a encore aucune valeur par défaut : vous les configurez donc d'abord. Vous créez ensuite l'analyseur personnalisé à partir de la base prebuilt-document avec un schéma de champs. L'analyse est asynchrone : la requête POST renvoie 202 Accepted avec un en-tête Operation-Location, et vous interrogez cette URL jusqu'à ce que l'état soit Succeeded pour obtenir le résultat.
  options:
    body202: { en: "The 202 Accepted response only acknowledges the operation; the result is available from the Operation-Location URL once the operation succeeds.", fr: "La réponse 202 Accepted accuse seulement réception de l'opération ; le résultat est disponible à l'URL Operation-Location une fois l'opération réussie." }
    skillset: { en: "The requirement asks for structured fields from a script, not for a search index, so no skillset is needed.", fr: "L'exigence demande des champs structurés produits par un script, pas un index de recherche : aucun ensemble de compétences n'est nécessaire." }
references:
  - title: "Quickstart: Azure Content Understanding in Foundry Tools"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
