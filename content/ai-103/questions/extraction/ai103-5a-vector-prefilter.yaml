id: ai103-5a-vector-prefilter
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware grounds a maintenance agent on an Azure AI Search index that contains procedures for 60 plants. The index was created in 2026, and about 2 percent of its documents have `plant` set to `Lyon`.

    A workflow runs the following query to retrieve ten procedures for the Lyon plant. The query often returns only two or three results, although dozens of Lyon procedures match the question.

    ```json
    {
      "filter": "plant eq 'Lyon'",
      "vectorFilterMode": "postFilter",
      "vectorQueries": [
        { "kind": "text", "text": "replace a pump seal", "fields": "contentVector", "k": 10 }
      ]
    }
    ```

    You need the query to return ten Lyon procedures whenever ten exist. What should you change?
  fr: |
    Litware ancre un agent de maintenance sur un index Azure AI Search qui contient les procédures de 60 usines. L'index a été créé en 2026, et environ 2 % de ses documents ont `plant` défini sur `Lyon`.

    Un flux de travail exécute la requête suivante pour récupérer dix procédures de l'usine de Lyon. La requête ne renvoie souvent que deux ou trois résultats, alors que des dizaines de procédures de Lyon correspondent à la question.

    ```json
    {
      "filter": "plant eq 'Lyon'",
      "vectorFilterMode": "postFilter",
      "vectorQueries": [
        { "kind": "text", "text": "replace a pump seal", "fields": "contentVector", "k": 10 }
      ]
    }
    ```

    La requête doit renvoyer dix procédures de Lyon chaque fois que dix existent. Que devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "Set vectorFilterMode to strictPostFilter", fr: "Définir vectorFilterMode sur strictPostFilter" } }
    - { id: b, text: { en: "Make the contentVector field filterable", fr: "Rendre le champ contentVector filtrable (filterable)" } }
    - { id: c, text: { en: "Set vectorFilterMode to preFilter", fr: "Définir vectorFilterMode sur preFilter" } }
    - { id: d, text: { en: "Add queryType set to semantic", fr: "Ajouter queryType défini sur semantic" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `preFilter`, the filter is applied during the HNSW traversal, so the query returns k results if they exist in the index. `postFilter` filters the top results found on each shard, which can return fewer than k results when the filter is highly selective, as here.
    fr: |
      Avec `preFilter`, le filtre est appliqué pendant le parcours HNSW : la requête renvoie k résultats s'ils existent dans l'index. `postFilter` filtre les premiers résultats trouvés sur chaque partition, ce qui peut renvoyer moins de k résultats quand le filtre est très sélectif, comme ici.
  options:
    a:
      en: |
        strictPostFilter (preview) filters the global top k after the search, which has the highest risk of missing matches.
      fr: |
        strictPostFilter (préversion) filtre les k premiers résultats globaux après la recherche, ce qui présente le risque le plus élevé de manquer des correspondances.
    b:
      en: |
        Vector fields cannot be filterable; filters apply to filterable string or numeric fields such as plant.
      fr: |
        Les champs vectoriels ne peuvent pas être filtrables ; les filtres s'appliquent à des champs chaîne ou numériques filtrables tels que plant.
    d:
      en: |
        The semantic ranker reranks the results that the query already found; it cannot add the missing ones.
      fr: |
        Le classeur sémantique reclasse les résultats que la requête a déjà trouvés ; il ne peut pas ajouter ceux qui manquent.
references:
  - title: Add a filter to a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-filters
