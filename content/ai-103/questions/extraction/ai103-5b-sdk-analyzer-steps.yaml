id: ai103-5b-sdk-analyzer-steps
objective: "5.2.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a new Foundry resource with no model deployments. You are writing a Python script that uses the azure-ai-contentunderstanding package to create a custom analyzer named claimAnalyzer, which extracts fields from claim forms, and then to analyze a claim form stored at a URL.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose d'une nouvelle ressource Foundry sans aucun déploiement de modèle. Vous écrivez un script Python qui utilise le package azure-ai-contentunderstanding pour créer un analyseur personnalisé nommé claimAnalyzer, qui extrait des champs de formulaires de déclaration, puis pour analyser un formulaire de déclaration stocké à une URL.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: deploy, text: { en: "Deploy a supported chat completion model and an embedding model in the Foundry resource.", fr: "Déployer un modèle de complétion de conversation et un modèle d'incorporation pris en charge dans la ressource Foundry." } }
    - { id: defaults, text: { en: "Call update_defaults to map the models to their deployments.", fr: "Appeler update_defaults pour associer les modèles à leurs déploiements." } }
    - { id: create, text: { en: "Call begin_create_analyzer with the claimAnalyzer definition, and wait for the poller to complete.", fr: "Appeler begin_create_analyzer avec la définition de claimAnalyzer, et attendre la fin du poller." } }
    - { id: analyze, text: { en: "Call begin_analyze with claimAnalyzer and an AnalysisInput that has the URL, and then call result() on the poller.", fr: "Appeler begin_analyze avec claimAnalyzer et un AnalysisInput qui contient l'URL, puis appeler result() sur le poller." } }
    - { id: copy, text: { en: "Call grant_copy_authorization for claimAnalyzer.", fr: "Appeler grant_copy_authorization pour claimAnalyzer." } }
    - { id: skillset, text: { en: "Create an Azure AI Search skillset that calls claimAnalyzer.", fr: "Créer un ensemble de compétences Azure AI Search qui appelle claimAnalyzer." } }
answer:
  sequence: [ deploy, defaults, create, analyze ]
explanation:
  correct:
    en: |
      Field extraction needs a chat completion model and an embedding model deployed in the Foundry resource, and update_defaults maps them once for the resource so that analyzers can use them. begin_create_analyzer is a long-running operation that creates the analyzer; begin_analyze then starts the analysis, and the poller's result() returns the AnalysisResult with the fields.
    fr: |
      L'extraction de champs nécessite un modèle de complétion de conversation et un modèle d'incorporation déployés dans la ressource Foundry, et update_defaults les associe une fois pour la ressource afin que les analyseurs puissent les utiliser. begin_create_analyzer est une opération de longue durée qui crée l'analyseur ; begin_analyze démarre ensuite l'analyse, et la méthode result() du poller renvoie l'AnalysisResult avec les champs.
  options:
    copy: { en: "grant_copy_authorization prepares the copy of an analyzer to another resource, which the scenario doesn't need.", fr: "grant_copy_authorization prépare la copie d'un analyseur vers une autre ressource, ce dont le scénario n'a pas besoin." }
    skillset: { en: "The script calls the analyzer directly; no search index or skillset is involved.", fr: "Le script appelle l'analyseur directement ; aucun index de recherche ni ensemble de compétences n'intervient." }
references:
  - title: ContentUnderstandingClient Class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-contentunderstanding/azure.ai.contentunderstanding.contentunderstandingclient
  - title: Model deployment options for Content Understanding analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments
