id: ai103-cs4a-script-ingestion
objective: "5.2.2"
type: single
caseStudy: ai103-cs4a-southridge
difficulty: 1
status: draft
stem:
  en: |
    You need to process the PDF files in the scripts container to meet the script search requirement. Which Content Understanding analyzer should you use?
  fr: |
    Vous devez traiter les fichiers PDF du conteneur scripts pour satisfaire l'exigence relative à la recherche dans les scripts. Quel analyseur Content Understanding devez-vous utiliser ?
body:
  options:
    - { id: a, text: "prebuilt-read" }
    - { id: b, text: "prebuilt-layout" }
    - { id: c, text: "prebuilt-documentSearch" }
    - { id: d, text: "prebuilt-documentFields" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      prebuilt-documentSearch is the RAG analyzer recommended for document ingestion. It returns layout-preserving Markdown with handwritten annotations and figure descriptions, a document summary, and chunked output for embedding and vector indexing, so no custom code or field schema is needed.
    fr: |
      prebuilt-documentSearch est l'analyseur RAG recommandé pour l'ingestion de documents. Il renvoie du Markdown qui préserve la disposition, avec les annotations manuscrites et la description des figures, un résumé du document et une sortie découpée en blocs pour l'incorporation et l'indexation vectorielle : aucun code personnalisé ni schéma de champs n'est nécessaire.
  options:
    a: { en: "prebuilt-read performs basic OCR (words, paragraphs, formulas, barcodes) without layout analysis, figure descriptions or chunking.", fr: "prebuilt-read effectue une OCR de base (mots, paragraphes, formules, codes-barres) sans analyse de la disposition, description des figures ni découpage en blocs." }
    b: { en: "prebuilt-layout extracts words, paragraphs, tables and figures, but it does not describe the sketches or split the content into chunks for embedding.", fr: "prebuilt-layout extrait les mots, paragraphes, tableaux et figures, mais il ne décrit pas les croquis et ne découpe pas le contenu en blocs pour l'incorporation." }
    d: { en: "prebuilt-documentFields is a utility analyzer that extracts key-value pairs; it does not produce a Markdown representation for RAG.", fr: "prebuilt-documentFields est un analyseur utilitaire qui extrait des paires clé-valeur ; il ne produit pas de représentation Markdown pour le RAG." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
