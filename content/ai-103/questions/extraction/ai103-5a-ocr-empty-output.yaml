id: ai103-5a-ocr-empty-output
objective: "5.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam indexes scanned purchase orders (image-only PDF files) from Azure Blob Storage. The skillset contains an OCR skill whose input is `/document/normalized_images/*`, followed by a Text Merge skill.

    The indexer runs without errors, but the merged text in the index is empty for every purchase order. The indexer configuration is the following.

    ```json
    "parameters": {
      "configuration": {
        "dataToExtract": "contentAndMetadata",
        "parsingMode": "default"
      }
    }
    ```

    What should you add to the indexer configuration?
  fr: |
    Fabrikam indexe des bons de commande numérisés (fichiers PDF composés uniquement d'images) depuis Stockage Blob Azure. L'ensemble de compétences contient une compétence OCR dont l'entrée est `/document/normalized_images/*`, suivie d'une compétence Text Merge.

    L'indexeur s'exécute sans erreur, mais le texte fusionné de l'index est vide pour chaque bon de commande. La configuration de l'indexeur est la suivante.

    ```json
    "parameters": {
      "configuration": {
        "dataToExtract": "contentAndMetadata",
        "parsingMode": "default"
      }
    }
    ```

    Que devez-vous ajouter à la configuration de l'indexeur ?
body:
  options:
    - { id: a, text: '"allowSkillsetToReadFileData": true' }
    - { id: b, text: '"indexedFileNameExtensions": ".pdf"' }
    - { id: c, text: '"imageAction": "generateNormalizedImages"' }
    - { id: d, text: '"normalizedImageMaxWidth": 4000' }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The OCR skill works only on `/document/normalized_images`, which the indexer produces when `imageAction` is set to a value other than `none`. Without it, no image is extracted from the scanned PDFs, so OCR has no input and Text Merge has nothing to insert.
    fr: |
      La compétence OCR ne fonctionne que sur `/document/normalized_images`, que l'indexeur produit lorsque `imageAction` est défini sur une valeur autre que `none`. Sans ce paramètre, aucune image n'est extraite des PDF numérisés : l'OCR n'a pas d'entrée et Text Merge n'a rien à insérer.
  options:
    a:
      en: |
        allowSkillsetToReadFileData exposes /document/file_data for skills such as Document Layout; it does not generate normalized images.
      fr: |
        allowSkillsetToReadFileData expose /document/file_data pour des compétences comme Document Layout ; il ne génère pas d'images normalisées.
    b:
      en: |
        The files are already PDFs; filtering extensions does not extract their images.
      fr: |
        Les fichiers sont déjà des PDF ; filtrer les extensions n'extrait pas leurs images.
    d:
      en: |
        normalizedImageMaxWidth sizes the normalized images only when image extraction is enabled.
      fr: |
        normalizedImageMaxWidth dimensionne les images normalisées uniquement lorsque l'extraction des images est activée.
references:
  - title: Extract text and information from images by using AI enrichment
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios
  - title: OCR cognitive skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr
