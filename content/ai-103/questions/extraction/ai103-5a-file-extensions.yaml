id: ai103-5a-file-extensions
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware stores its product documentation in a blob container named **docs**. The container holds PDF files, DOCX files and thousands of PNG thumbnails. A blob indexer loads the container into the grounding index of a Foundry agent.

    You need the indexer to process only the PDF and DOCX files. The solution must minimize administrative effort and must not modify the blobs.

    What should you configure?
  fr: |
    Litware stocke sa documentation produit dans un conteneur d'objets blob nommé **docs**. Le conteneur contient des fichiers PDF, des fichiers DOCX et des milliers de miniatures PNG. Un indexeur de blobs charge le conteneur dans l'index d'ancrage d'un agent Foundry.

    L'indexeur ne doit traiter que les fichiers PDF et DOCX. La solution doit réduire au minimum l'effort d'administration et ne doit pas modifier les objets blob.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "The AzureSearch_Skip metadata property on each PNG blob", fr: "La propriété de métadonnées AzureSearch_Skip sur chaque objet blob PNG" } }
    - { id: b, text: { en: "The excludedFileNameExtensions parameter set to .pdf, .docx", fr: "Le paramètre excludedFileNameExtensions défini sur .pdf, .docx" } }
    - { id: c, text: { en: "The dataToExtract parameter set to allMetadata", fr: "Le paramètre dataToExtract défini sur allMetadata" } }
    - { id: d, text: { en: "The indexedFileNameExtensions parameter set to .pdf, .docx", fr: "Le paramètre indexedFileNameExtensions défini sur .pdf, .docx" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `indexedFileNameExtensions` parameter of the indexer configuration limits processing to the listed extensions. It is one setting on the indexer, and the blobs stay unchanged.
    fr: |
      Le paramètre `indexedFileNameExtensions` de la configuration de l'indexeur limite le traitement aux extensions listées. C'est un seul paramètre sur l'indexeur, et les objets blob restent inchangés.
  options:
    a:
      en: |
        AzureSearch_Skip works per blob, so you would have to modify thousands of blobs.
      fr: |
        AzureSearch_Skip s'applique blob par blob : il faudrait modifier des milliers d'objets blob.
    b:
      en: |
        excludedFileNameExtensions skips the listed extensions, so this setting would skip exactly the files you need.
      fr: |
        excludedFileNameExtensions ignore les extensions listées : ce paramètre ignorerait précisément les fichiers nécessaires.
    c:
      en: |
        allMetadata extracts metadata only, for every blob; it does not filter by file type and drops the document content.
      fr: |
        allMetadata n'extrait que les métadonnées, pour chaque objet blob ; il ne filtre pas par type de fichier et supprime le contenu des documents.
references:
  - title: Search over Azure Blob Storage content
    url: https://learn.microsoft.com/en-us/azure/search/search-blob-storage-integration
