id: ai103-5a-handwritten-notes
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam Energy technicians photograph their paper inspection sheets and upload the JPEG files to Azure Blob Storage. The sheets contain printed labels and handwritten notes.

    A blob indexer already generates normalized images. You need the handwritten notes to become searchable text in the index.

    Which skill should you add to the skillset?
  fr: |
    Les techniciens de Fabrikam Energy photographient leurs fiches d'inspection papier et chargent les fichiers JPEG dans Stockage Blob Azure. Les fiches contiennent des libellés imprimés et des notes manuscrites.

    Un indexeur de blobs génère déjà des images normalisées. Les notes manuscrites doivent devenir du texte recherchable dans l'index.

    Quelle compétence devez-vous ajouter à l'ensemble de compétences ?
body:
  options:
    - { id: a, text: { en: "Image Analysis", fr: "Image Analysis" } }
    - { id: b, text: { en: "Entity Recognition", fr: "Entity Recognition" } }
    - { id: c, text: { en: "Key Phrase Extraction", fr: "Key Phrase Extraction" } }
    - { id: d, text: { en: "OCR", fr: "OCR" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The OCR skill recognizes printed and handwritten text in images; it uses the Azure Vision Read API, which extracts both at once. Its input is `/document/normalized_images/*`, which the indexer already produces.
    fr: |
      La compétence OCR reconnaît le texte imprimé et manuscrit dans les images ; elle utilise l'API Read d'Azure Vision, qui extrait les deux à la fois. Son entrée est `/document/normalized_images/*`, que l'indexeur produit déjà.
  options:
    a:
      en: |
        Image Analysis describes the content of an image with captions, tags and objects; it does not transcribe the notes.
      fr: |
        Image Analysis décrit le contenu d'une image par des légendes, des étiquettes et des objets ; elle ne transcrit pas les notes.
    b:
      en: |
        Entity Recognition works on text that already exists; it cannot read images.
      fr: |
        Entity Recognition travaille sur un texte existant ; elle ne peut pas lire des images.
    c:
      en: |
        Key Phrase Extraction also needs text as input and returns only the important phrases.
      fr: |
        Key Phrase Extraction a elle aussi besoin de texte en entrée et ne renvoie que les expressions importantes.
references:
  - title: OCR cognitive skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr
