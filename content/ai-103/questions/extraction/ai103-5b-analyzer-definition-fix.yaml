id: ai103-5b-analyzer-definition-fix
objective: "5.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has a Foundry resource with a deployment named lit-gpt52-prod of the gpt-5.2 model. A developer wrote the custom Azure Content Understanding analyzer definition shown in the exhibit.

    You review the definition before it is created. You need to ensure that the analyzer uses the lit-gpt52-prod deployment for field extraction and that Summary contains a one-sentence summary written by the model.

    Which two changes should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'une ressource Foundry avec un déploiement nommé lit-gpt52-prod du modèle gpt-5.2. Un développeur a écrit la définition d'analyseur Azure Content Understanding personnalisé présentée dans la pièce.

    Vous examinez la définition avant sa création. Vous devez vous assurer que l'analyseur utilise le déploiement lit-gpt52-prod pour l'extraction de champs et que Summary contient un résumé d'une phrase rédigé par le modèle.

    Quelles sont les deux modifications à apporter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: def
    title: { en: "Analyzer definition", fr: "Définition de l'analyseur" }
    body: |
      ```json
      {
        "analyzerId": "litwareIncidentAnalyzer",
        "baseAnalyzerId": "prebuilt-document",
        "config": { "estimateFieldSourceAndConfidence": true },
        "fieldSchema": {
          "fields": {
            "IncidentId": { "type": "string", "method": "extract", "description": "Incident ID, labeled INC-" },
            "Summary": { "type": "string", "method": "extract", "description": "One-sentence summary of the incident" }
          }
        },
        "models": { "completion": "lit-gpt52-prod", "embedding": "text-embedding-3-large" }
      }
      ```
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the baseAnalyzerId value to prebuilt-layout.", fr: "Remplacer la valeur de baseAnalyzerId par prebuilt-layout." } }
    - { id: b, text: { en: "Change the method of Summary to generate.", fr: "Changer la méthode de Summary en generate." } }
    - { id: c, text: { en: "Set omitContent to true in the analyzer configuration.", fr: "Définir omitContent sur true dans la configuration de l'analyseur." } }
    - { id: d, text: { en: "Set models.completion to gpt-5.2, and map it to lit-gpt52-prod in the defaults.", fr: "Définir models.completion sur gpt-5.2, et l'associer à lit-gpt52-prod dans les valeurs par défaut." } }
    - { id: e, text: { en: "Change the type of Summary to array.", fr: "Changer le type de Summary en array." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The models property takes Foundry model names (or aliases), not deployment names; the service maps a model to your deployment through the resource defaults or the per-request model deployments. The extract method returns literal values from the content, so a summary written by the model needs the generate method.
    fr: |
      La propriété models attend des noms de modèles Foundry (ou des alias), pas des noms de déploiements ; le service associe un modèle à votre déploiement via les valeurs par défaut de la ressource ou les déploiements de modèles par requête. La méthode extract renvoie des valeurs littérales du contenu : un résumé rédigé par le modèle nécessite la méthode generate.
  options:
    a: { en: "prebuilt-document is a valid base analyzer; prebuilt-layout isn't one of the four base analyzers.", fr: "prebuilt-document est un analyseur de base valide ; prebuilt-layout ne fait pas partie des quatre analyseurs de base." }
    c: { en: "omitContent only removes the content object from the response; it doesn't affect the model or the Summary method.", fr: "omitContent ne fait que supprimer l'objet de contenu de la réponse ; il n'a aucun effet sur le modèle ni sur la méthode de Summary." }
    e: { en: "A one-sentence summary is a single string; an array type doesn't make the model write it.", fr: "Un résumé d'une phrase est une seule chaîne ; un type array ne fait pas rédiger le résumé par le modèle." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Model deployment options for Content Understanding analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments
