id: ai103-5a-layout-headings
objective: "5.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Legal indexes contract templates (DOCX and PDF) into Azure AI Search for a drafting agent. The templates use three levels of headings.

    Each search document must contain one section of a contract as Markdown, and the section must keep its first-, second- and third-level headings so that the agent can cite the clause it uses.

    Which skill should you add to the skillset?
  fr: |
    Contoso Legal indexe des modèles de contrats (DOCX et PDF) dans Azure AI Search pour un agent de rédaction. Les modèles utilisent trois niveaux de titres.

    Chaque document de recherche doit contenir une section d'un contrat au format Markdown, et la section doit conserver ses titres de premier, deuxième et troisième niveaux pour que l'agent puisse citer la clause qu'il utilise.

    Quelle compétence devez-vous ajouter à l'ensemble de compétences ?
body:
  options:
    - { id: a, text: { en: "The Text Split skill with textSplitMode set to sentences", fr: "La compétence Text Split avec textSplitMode défini sur sentences" } }
    - { id: b, text: { en: "The OCR skill followed by the Text Merge skill", fr: "La compétence OCR suivie de la compétence Text Merge" } }
    - { id: c, text: { en: "The Document Layout skill with markdownHeaderDepth set to h3", fr: "La compétence Document Layout avec markdownHeaderDepth défini sur h3" } }
    - { id: d, text: { en: "The Key Phrase Extraction skill on the document content", fr: "La compétence Key Phrase Extraction sur le contenu du document" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Document Layout skill uses the Document Intelligence layout model to detect the structure of the document and returns `markdown_document`, one entry per Markdown section. With `markdownHeaderDepth` set to `h3`, each section carries its `h1`, `h2` and `h3` headings, and deeper headings roll up to that level.
    fr: |
      La compétence Document Layout utilise le modèle de disposition de Document Intelligence pour détecter la structure du document et renvoie `markdown_document`, avec une entrée par section Markdown. Avec `markdownHeaderDepth` défini sur `h3`, chaque section porte ses titres `h1`, `h2` et `h3`, et les titres plus profonds sont regroupés à ce niveau.
  options:
    a:
      en: |
        Text Split cuts plain text at sentence boundaries; it knows nothing about headings and produces no Markdown.
      fr: |
        Text Split coupe du texte brut aux limites de phrases ; il ignore les titres et ne produit pas de Markdown.
    b:
      en: |
        OCR and Text Merge add the text found in images to the content; they do not detect sections or headings.
      fr: |
        OCR et Text Merge ajoutent au contenu le texte trouvé dans les images ; ils ne détectent ni sections ni titres.
    d:
      en: |
        Key Phrase Extraction returns important phrases, not the structure of the document.
      fr: |
        Key Phrase Extraction renvoie des expressions importantes, pas la structure du document.
references:
  - title: Document Layout skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-document-intelligence-layout
