id: ai103-5a-genai-prompt-facts
objective: "5.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to add a GenAI Prompt skill to an Azure AI Search skillset. The skill will send each chunk to a `gpt-4.1-mini` deployment in Azure OpenAI and store a one-sentence summary of the chunk in the index.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'ajouter une compétence GenAI Prompt à un ensemble de compétences Azure AI Search. La compétence enverra chaque bloc à un déploiement `gpt-4.1-mini` d'Azure OpenAI et stockera dans l'index un résumé du bloc en une phrase.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The skill can authenticate with the system-assigned managed identity of the search service if that identity has the Cognitive Services OpenAI User role.
        fr: |
          La compétence peut s'authentifier avec l'identité managée affectée par le système du service de recherche si cette identité possède le rôle Cognitive Services OpenAI User.
    - id: s2
      text:
        en: |
          The uri of the skill can be the Responses API endpoint of the deployment (a path that contains /openai/responses).
        fr: |
          L'uri de la compétence peut être le point de terminaison de l'API Responses du déploiement (un chemin qui contient /openai/responses).
    - id: s3
      text:
        en: |
          You can raise the request timeout of the skill to 120 seconds for long chunks.
        fr: |
          Vous pouvez porter le délai d'expiration des requêtes de la compétence à 120 secondes pour les blocs longs.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      When `apiKey` and `authIdentity` are blank, the skill uses the system-assigned identity of the search service, which needs the Cognitive Services OpenAI User role on the Azure OpenAI resource. For GPT models, only chat completions endpoints are supported; `/openai/responses` endpoints are not compatible. The request timeout of the GenAI Prompt skill is fixed at 30 seconds.
    fr: |
      Lorsque `apiKey` et `authIdentity` sont vides, la compétence utilise l'identité affectée par le système du service de recherche, qui a besoin du rôle Cognitive Services OpenAI User sur la ressource Azure OpenAI. Pour les modèles GPT, seuls les points de terminaison chat completions sont pris en charge ; les points de terminaison `/openai/responses` ne sont pas compatibles. Le délai d'expiration des requêtes de la compétence GenAI Prompt est fixé à 30 secondes.
references:
  - title: GenAI Prompt skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-genai-prompt
