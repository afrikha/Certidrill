id: ai103-5a-hybrid-rrf
objective: "5.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank sends hybrid queries to an Azure AI Search index. Each request contains a `search` string and one vector query on the `contentVector` field. Semantic ranking is not enabled.

    How does Azure AI Search produce the single ranked result set that the request returns?
  fr: |
    Woodgrove Bank envoie des requêtes hybrides à un index Azure AI Search. Chaque demande contient une chaîne `search` et une requête vectorielle sur le champ `contentVector`. Le classement sémantique n'est pas activé.

    Comment Azure AI Search produit-il le jeu de résultats classé unique que renvoie la demande ?
body:
  options:
    - { id: a, text: { en: "It runs the vector query on the results of the full-text query", fr: "Il exécute la requête vectorielle sur les résultats de la requête en texte intégral" } }
    - { id: b, text: { en: "It merges both result sets with Reciprocal Rank Fusion (RRF)", fr: "Il fusionne les deux jeux de résultats avec Reciprocal Rank Fusion (RRF)" } }
    - { id: c, text: { en: "It reranks both result sets with a language model", fr: "Il reclasse les deux jeux de résultats avec un modèle de langage" } }
    - { id: d, text: { en: "It normalizes and adds the BM25 and similarity scores of each document", fr: "Il normalise et additionne les scores BM25 et de similarité de chaque document" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In a hybrid request, the full-text query (BM25) and the vector query (HNSW or exhaustive KNN) run in parallel. Reciprocal Rank Fusion then merges the two ranked lists into one result set, based on the rank of each document in each list.
    fr: |
      Dans une demande hybride, la requête en texte intégral (BM25) et la requête vectorielle (HNSW ou KNN exhaustif) s'exécutent en parallèle. Reciprocal Rank Fusion fusionne ensuite les deux listes classées en un seul jeu de résultats, en fonction du rang de chaque document dans chaque liste.
  options:
    a:
      en: |
        The two queries run in parallel; neither is applied to the results of the other.
      fr: |
        Les deux requêtes s'exécutent en parallèle ; aucune n'est appliquée aux résultats de l'autre.
    c:
      en: |
        Reranking with a language model is the semantic ranker, which is not enabled here.
      fr: |
        Le reclassement par un modèle de langage est le rôle du classeur sémantique, qui n'est pas activé ici.
    d:
      en: |
        BM25 and similarity scores are on different scales; RRF combines ranks, not raw scores.
      fr: |
        Les scores BM25 et de similarité sont sur des échelles différentes ; RRF combine des rangs, pas des scores bruts.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
