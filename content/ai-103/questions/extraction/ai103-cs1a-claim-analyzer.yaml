id: ai103-cs1a-claim-analyzer
objective: "5.2.3"
type: dropdown
caseStudy: ai103-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |
    You are creating a Content Understanding custom analyzer for the claim forms. You need to meet the claim form requirements. How should you complete the analyzer definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous créez un analyseur personnalisé Content Understanding pour les formulaires de déclaration. Vous devez satisfaire les exigences relatives aux formulaires de déclaration. Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "analyzerId": "claimFormAnalyzer",
      "baseAnalyzerId": "[[base]]",
      "config": { "estimateFieldSourceAndConfidence": true },
      "fieldSchema": {
        "name": "ClaimFields",
        "fields": {
          "PolicyNumber": { "type": "string", "method": "[[policy]]" },
          "ClaimType": { "type": "string", "method": "[[claimtype]]" },
          "IncidentSummary": { "type": "string", "method": "[[summary]]" }
        }
      }
    }
  slots:
    - id: base
      options:
        - { id: document, text: "prebuilt-document" }
        - { id: layout, text: "prebuilt-layout" }
        - { id: docsearch, text: "prebuilt-documentSearch" }
        - { id: image, text: "prebuilt-image" }
    - id: policy
      options:
        - { id: extract, text: "extract" }
        - { id: generate, text: "generate" }
        - { id: classify, text: "classify" }
    - id: claimtype
      options:
        - { id: extract, text: "extract" }
        - { id: generate, text: "generate" }
        - { id: classify, text: "classify" }
    - id: summary
      options:
        - { id: extract, text: "extract" }
        - { id: generate, text: "generate" }
        - { id: classify, text: "classify" }
answer:
  values: { base: document, policy: extract, claimtype: classify, summary: generate }
explanation:
  correct:
    en: |
      A custom analyzer for scanned forms inherits from the base analyzer `prebuilt-document`. `extract` returns the policy number as it literally appears and, with source and confidence estimation enabled, gives its location and confidence. `classify` picks one value from a predefined set (Auto, Home or Travel), and `generate` lets the model write a summary that does not appear as such in the form.
    fr: |
      Un analyseur personnalisé pour des formulaires numérisés hérite de l'analyseur de base `prebuilt-document`. `extract` renvoie le numéro de contrat tel qu'il apparaît littéralement et, avec l'estimation de la source et de la confiance activée, fournit son emplacement et sa confiance. `classify` choisit une valeur dans un ensemble prédéfini (Auto, Home ou Travel), et `generate` permet au modèle de rédiger un résumé qui ne figure pas tel quel dans le formulaire.
  options:
    layout:
      en: "`prebuilt-layout` is a content extraction analyzer, not one of the base analyzers (`prebuilt-document`, `prebuilt-image`, `prebuilt-audio`, `prebuilt-video`) that a custom analyzer can inherit from."
      fr: "`prebuilt-layout` est un analyseur d'extraction de contenu, pas l'un des analyseurs de base (`prebuilt-document`, `prebuilt-image`, `prebuilt-audio`, `prebuilt-video`) dont un analyseur personnalisé peut hériter."
    docsearch:
      en: "`prebuilt-documentSearch` is a prebuilt RAG analyzer that produces chunked Markdown for indexing; it is not a base analyzer for custom field extraction."
      fr: "`prebuilt-documentSearch` est un analyseur RAG prédéfini qui produit du Markdown découpé pour l'indexation ; ce n'est pas un analyseur de base pour l'extraction de champs personnalisés."
    image:
      en: "`prebuilt-image` is the base for image files such as the damage photos, and the `extract` method is supported only by document analyzers."
      fr: "`prebuilt-image` est la base pour les fichiers image comme les photos des dommages, et la méthode `extract` n'est prise en charge que par les analyseurs de documents."
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Best practices for Azure Content Understanding in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
