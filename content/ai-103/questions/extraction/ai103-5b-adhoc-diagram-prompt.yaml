id: ai103-5b-adhoc-diagram-prompt
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. field technicians occasionally photograph a wiring diagram during a repair and ask free-form questions about it, such as which terminal a wire connects to. Each question is different, no fixed set of fields applies, and the answers aren't stored or indexed.

    You need to provide answers with the least development effort. What should you use?
  fr: |
    Les techniciens de terrain de Contoso, Ltd. photographient parfois un schéma de câblage pendant une réparation et posent des questions libres à son sujet, par exemple à quelle borne un fil est relié. Chaque question est différente, aucun ensemble fixe de champs ne s'applique, et les réponses ne sont ni stockées ni indexées.

    Vous devez fournir les réponses avec le moins d'effort de développement possible. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A custom Content Understanding analyzer derived from prebuilt-image, with a field schema", fr: "Un analyseur Content Understanding personnalisé dérivé de prebuilt-image, avec un schéma de champs" } }
    - { id: b, text: { en: "A prompt that sends the photo and the question to a multimodal model deployed in Foundry", fr: "Une invite qui envoie la photo et la question à un modèle multimodal déployé dans Foundry" } }
    - { id: c, text: { en: "prebuilt-imageSearch, with the descriptions indexed in Azure AI Search", fr: "prebuilt-imageSearch, avec les descriptions indexées dans Azure AI Search" } }
    - { id: d, text: { en: "prebuilt-layout, with the OCR text of the photo returned to the technician", fr: "prebuilt-layout, avec le texte OCR de la photo renvoyé au technicien" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A one-off question about one image is answered directly by a multimodal model: the prompt carries the image and the question, and the model reasons over both. An analyzer is the right tool when the same schema must be applied repeatedly, with confidence and source data, which isn't required here.
    fr: |
      Une question ponctuelle sur une image reçoit une réponse directe d'un modèle multimodal : l'invite contient l'image et la question, et le modèle raisonne sur les deux. Un analyseur est l'outil adapté quand le même schéma doit être appliqué de façon répétée, avec des données de confiance et de source, ce qui n'est pas exigé ici.
  options:
    a: { en: "A field schema defines a fixed set of fields, but each question asks something different.", fr: "Un schéma de champs définit un ensemble fixe de champs, alors que chaque question demande quelque chose de différent." }
    c: { en: "Indexing descriptions builds a retrieval pipeline for content that is stored and searched, which the scenario doesn't need.", fr: "Indexer des descriptions crée un pipeline de récupération pour du contenu stocké et interrogé, ce dont le scénario n'a pas besoin." }
    d: { en: "OCR returns the labels printed in the diagram, not an answer about how its components connect.", fr: "L'OCR renvoie les étiquettes imprimées sur le schéma, pas une réponse sur la façon dont ses composants sont reliés." }
references:
  - title: Use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
