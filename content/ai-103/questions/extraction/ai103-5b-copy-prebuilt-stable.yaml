id: ai103-5b-copy-prebuilt-stable
objective: "5.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. extracts invoice data in production by calling the prebuilt-invoice analyzer of Azure Content Understanding. Fabrikam moves to each new API version when it is released.

    A downstream application depends on the exact output schema. You need to ensure that the analyzer definition changes only when Fabrikam decides to change it.

    What should you do?
  fr: |
    Fabrikam, Inc. extrait les données des factures en production en appelant l'analyseur prebuilt-invoice d'Azure Content Understanding. Fabrikam adopte chaque nouvelle version d'API dès sa publication.

    Une application en aval dépend du schéma de sortie exact. Vous devez vous assurer que la définition de l'analyseur ne change que lorsque Fabrikam décide de la modifier.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Copy the prebuilt-invoice definition into a custom analyzer, and analyze with the custom analyzer ID.", fr: "Copier la définition de prebuilt-invoice dans un analyseur personnalisé, et analyser avec l'ID de cet analyseur." } }
    - { id: b, text: { en: "Replace prebuilt-invoice with prebuilt-documentFields, and map the returned key-value pairs to the schema in code.", fr: "Remplacer prebuilt-invoice par prebuilt-documentFields, et associer dans le code les paires clé-valeur renvoyées au schéma." } }
    - { id: c, text: { en: "Keep calling prebuilt-invoice, and set omitContent to true so that only the fields are returned.", fr: "Continuer à appeler prebuilt-invoice, et définir omitContent sur true pour que seuls les champs soient renvoyés." } }
    - { id: d, text: { en: "Keep calling prebuilt-invoice, and pass the model deployments in each analyze request.", fr: "Continuer à appeler prebuilt-invoice, et transmettre les déploiements de modèles dans chaque requête d'analyse." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Prebuilt analyzer definitions can change across API versions. For production, the guidance is to copy the prebuilt definition (GET /analyzers/prebuilt-invoice) into your own analyzer (PUT /analyzers/{yourAnalyzerId}) and use the copy, which changes only when you update it.
    fr: |
      Les définitions des analyseurs prédéfinis peuvent changer d'une version d'API à l'autre. Pour la production, la recommandation consiste à copier la définition prédéfinie (GET /analyzers/prebuilt-invoice) dans votre propre analyseur (PUT /analyzers/{yourAnalyzerId}) et à utiliser cette copie, qui ne change que lorsque vous la mettez à jour.
  options:
    b: { en: "prebuilt-documentFields is itself a prebuilt analyzer, and generic key-value pairs don't give a stable invoice schema.", fr: "prebuilt-documentFields est lui-même un analyseur prédéfini, et des paires clé-valeur génériques ne fournissent pas un schéma de facture stable." }
    c: { en: "omitContent only removes the content object; the field schema of the prebuilt analyzer can still change.", fr: "omitContent ne fait que supprimer l'objet de contenu ; le schéma de champs de l'analyseur prédéfini peut toujours changer." }
    d: { en: "Per-request model deployments choose which deployment runs the analyzer; they don't freeze the analyzer definition.", fr: "Les déploiements de modèles par requête choisissent le déploiement qui exécute l'analyseur ; ils ne figent pas la définition de l'analyseur." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
