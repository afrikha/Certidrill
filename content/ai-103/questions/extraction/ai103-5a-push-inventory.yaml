id: ai103-5a-push-inventory
objective: "5.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs an inventory application on an on-premises PostgreSQL database. A Foundry agent grounds its answers on an Azure AI Search index named **stock-index** that contains one document per product.

    Stock levels change several times per minute, and each change must be searchable in stock-index within a few seconds. The application team can modify the inventory application.

    What should you use to load the changes into stock-index?
  fr: |
    Northwind Traders exécute une application d'inventaire sur une base de données PostgreSQL locale. Un agent Foundry ancre ses réponses sur un index Azure AI Search nommé **stock-index** qui contient un document par produit.

    Les niveaux de stock changent plusieurs fois par minute, et chaque modification doit être recherchable dans stock-index en quelques secondes. L'équipe applicative peut modifier l'application d'inventaire.

    Que devez-vous utiliser pour charger les modifications dans stock-index ?
body:
  options:
    - { id: a, text: { en: "An indexer that runs on a schedule every minute", fr: "Un indexeur exécuté selon une planification toutes les minutes" } }
    - { id: b, text: { en: "The push API, called by the application with the mergeOrUpload action", fr: "L'API push, appelée par l'application avec l'action mergeOrUpload" } }
    - { id: c, text: { en: "An Azure SQL Database indexer with change tracking enabled", fr: "Un indexeur Azure SQL Database avec le suivi des modifications activé" } }
    - { id: d, text: { en: "A nightly export to Blob Storage read by a blob indexer", fr: "Un export nocturne vers Stockage Blob lu par un indexeur de blobs" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The push model accepts JSON documents from any source with no frequency limit, which is the documented choice for low-latency synchronization. The application sends each change with `mergeOrUpload`, which updates the product document if it exists and creates it otherwise.
    fr: |
      Le modèle push accepte des documents JSON provenant de n'importe quelle source, sans limite de fréquence, ce qui en fait le choix documenté pour une synchronisation à faible latence. L'application envoie chaque modification avec `mergeOrUpload`, qui met à jour le document du produit s'il existe et le crée sinon.
  options:
    a:
      en: |
        An indexer schedule runs at most every five minutes, and PostgreSQL on-premises is not a supported indexer data source.
      fr: |
        Une planification d'indexeur s'exécute au plus toutes les cinq minutes, et une base PostgreSQL locale n'est pas une source de données prise en charge par les indexeurs.
    c:
      en: |
        The data is in PostgreSQL, not in Azure SQL Database, and an indexer still cannot run more often than every five minutes.
      fr: |
        Les données se trouvent dans PostgreSQL, pas dans Azure SQL Database, et un indexeur ne peut toujours pas s'exécuter plus souvent que toutes les cinq minutes.
    d:
      en: |
        A nightly export makes changes searchable the next day, not within seconds.
      fr: |
        Un export nocturne rend les modifications recherchables le lendemain, pas en quelques secondes.
references:
  - title: Data import in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-what-is-data-import
  - title: Indexers in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-indexer-overview
