id: ai103-5b-retrieval-connection
objective: "5.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is building several grounded solutions in a Foundry project. Northwind already maintains Azure AI Search indexes and an Azure Blob Storage container of policy documents.

    You need to choose how each solution connects to retrieval.

    What should you use for each solution? To answer, drag the appropriate options to the correct solutions. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée plusieurs solutions ancrées dans un projet Foundry. Northwind gère déjà des index Azure AI Search et un conteneur Stockage Blob Azure de documents de stratégie.

    Vous devez choisir comment chaque solution se connecte à la récupération.

    Que devez-vous utiliser pour chaque solution ? Pour répondre, faites glisser les options appropriées vers les solutions correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: aistool, text: { en: "Azure AI Search tool", fr: "Outil Azure AI Search" } }
    - { id: filesearch, text: { en: "File search tool", fr: "Outil file search" } }
    - { id: kb, text: { en: "Retrieve call to a Foundry IQ knowledge base in your own code", fr: "Appel retrieve à une base de connaissances Foundry IQ dans votre propre code" } }
    - { id: client, text: { en: "SearchClient query in your own code", fr: "Requête SearchClient dans votre propre code" } }
    - { id: memory, text: { en: "Agent memory", fr: "Mémoire de l'agent" } }
    - { id: web, text: { en: "Web search tool", fr: "Outil de recherche web" } }
  targets:
    - id: catalog
      text: { en: "An agent answers from the existing product-catalog index and cites the source documents.", fr: "Un agent répond à partir de l'index product-catalog existant et cite les documents sources." }
    - id: uploads
      text: { en: "An agent answers from PDF files that users upload, and Northwind doesn't want to create or manage an index.", fr: "Un agent répond à partir de fichiers PDF que les utilisateurs chargent, et Northwind ne veut ni créer ni gérer d'index." }
    - id: shared
      text: { en: "Several back-office apps reuse one retrieval layer over the blob container and two indexes, and complex questions are split into subqueries.", fr: "Plusieurs applications de back-office réutilisent une même couche de récupération sur le conteneur d'objets blob et deux index, et les questions complexes sont découpées en sous-requêtes." }
    - id: batch
      text: { en: "A nightly job runs a fixed query, builds a prompt from the top five passages, and calls a chat model.", fr: "Un travail nocturne exécute une requête fixe, crée une invite à partir des cinq premiers passages et appelle un modèle de conversation." }
answer:
  mapping: { catalog: aistool, uploads: filesearch, shared: kb, batch: client }
explanation:
  correct:
    en: |
      The Azure AI Search tool grounds an agent on one existing index and returns citations. File search parses, chunks and embeds uploaded files into a managed vector store, so there is no index to manage. A Foundry IQ knowledge base runs agentic retrieval (query planning, subqueries) over several knowledge sources, and each app calls its retrieve action (GA in the 2026-10-01 API). A deterministic job with a fixed query is simplest as code that calls SearchClient and passes the passages to the model.
    fr: |
      L'outil Azure AI Search ancre un agent sur un index existant et renvoie des citations. File search analyse, découpe et vectorise les fichiers chargés dans un magasin de vecteurs managé : il n'y a aucun index à gérer. Une base de connaissances Foundry IQ exécute la récupération agentique (planification de requêtes, sous-requêtes) sur plusieurs sources de connaissances, et chaque application appelle son action retrieve (GA dans l'API 2026-10-01). Un travail déterministe avec une requête fixe s'écrit le plus simplement en code qui appelle SearchClient et transmet les passages au modèle.
  options:
    memory: { en: "Memory keeps information from earlier conversations; it isn't a document retrieval method.", fr: "La mémoire conserve des informations issues de conversations précédentes ; ce n'est pas une méthode de récupération de documents." }
    web: { en: "Web search grounds on current public web content, not on Northwind's private documents.", fr: "La recherche web ancre les réponses sur du contenu web public récent, pas sur les documents privés de Northwind." }
references:
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/file-search
  - title: Query Knowledge Base via API or MCP
    url: https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-how-to-retrieve
