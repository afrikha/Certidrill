id: ai103-5a-layout-pipeline-order
objective: "5.1.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys indexes scanned and digital PDF assembly guides from Azure Blob Storage into Azure AI Search. The pipeline uses the Document Layout skill with `outputFormat` set to `text` and `chunkingProperties` set to 1,500 characters, and an Azure OpenAI Embedding skill. Each section chunk must become one search document. The skillset must contain as few skills as possible.

    Which four operations occur in sequence for each guide? To answer, move the appropriate operations from the list of operations to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys indexe des guides d'assemblage PDF numérisés et numériques depuis Stockage Blob Azure dans Azure AI Search. Le pipeline utilise la compétence Document Layout avec `outputFormat` défini sur `text` et `chunkingProperties` défini sur 1 500 caractères, ainsi qu'une compétence Azure OpenAI Embedding. Chaque bloc de section doit devenir un document de recherche. L'ensemble de compétences doit contenir le moins de compétences possible.

    Quelles sont les quatre opérations qui se produisent dans l'ordre pour chaque guide ? Pour répondre, déplacez les opérations appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: filedata, text: { en: "The indexer exposes the file as /document/file_data because allowSkillsetToReadFileData is true.", fr: "L'indexeur expose le fichier sous la forme /document/file_data, car allowSkillsetToReadFileData vaut true." } }
    - { id: layout, text: { en: "The Document Layout skill analyzes the file and returns text_sections chunks.", fr: "La compétence Document Layout analyse le fichier et renvoie des blocs text_sections." } }
    - { id: embed, text: { en: "The Azure OpenAI Embedding skill generates a vector for each text section.", fr: "La compétence Azure OpenAI Embedding génère un vecteur pour chaque section de texte." } }
    - { id: project, text: { en: "Index projections write each text section and its vector as a search document.", fr: "Les projections d'index écrivent chaque section de texte et son vecteur sous la forme d'un document de recherche." } }
    - { id: normimg, text: { en: "The indexer generates normalized images for an OCR skill.", fr: "L'indexeur génère des images normalisées pour une compétence OCR." } }
    - { id: split, text: { en: "The Text Split skill splits each text section into pages of 1,500 characters.", fr: "La compétence Text Split découpe chaque section de texte en pages de 1 500 caractères." } }
    - { id: merge, text: { en: "The Text Merge skill inserts the OCR text into the content.", fr: "La compétence Text Merge insère le texte OCR dans le contenu." } }
answer:
  sequence: [filedata, layout, embed, project]
explanation:
  correct:
    en: |
      The Document Layout skill reads the file itself from `/document/file_data`, which the indexer creates when `allowSkillsetToReadFileData` is true. The layout model handles scanned and digital pages, and with `outputFormat: text` and `chunkingProperties`, it returns `text_sections` that are already chunked. The embedding skill then vectorizes each section, and index projections write one search document per section.
    fr: |
      La compétence Document Layout lit elle-même le fichier dans `/document/file_data`, que l'indexeur crée lorsque `allowSkillsetToReadFileData` vaut true. Le modèle de disposition traite les pages numérisées comme numériques et, avec `outputFormat: text` et `chunkingProperties`, renvoie des `text_sections` déjà découpées en blocs. La compétence d'embedding vectorise ensuite chaque section, et les projections d'index écrivent un document de recherche par section.
  options:
    normimg:
      en: |
        Document Layout performs its own analysis of scanned pages; normalized images and an OCR skill would add an unneeded skill.
      fr: |
        Document Layout effectue sa propre analyse des pages numérisées ; des images normalisées et une compétence OCR ajouteraient une compétence inutile.
    split:
      en: |
        chunkingProperties already chunks the text sections, so Text Split would be an extra skill.
      fr: |
        chunkingProperties découpe déjà les sections de texte : Text Split serait une compétence superflue.
    merge:
      en: |
        Without an OCR skill, there is no OCR text to merge.
      fr: |
        Sans compétence OCR, il n'y a aucun texte OCR à fusionner.
references:
  - title: Document Layout skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-document-intelligence-layout
  - title: Define an index projection for parent-child indexing
    url: https://learn.microsoft.com/en-us/azure/search/search-how-to-define-index-projections
