id: ai103-5a-semantic-config
objective: "5.1.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure AI Search index named **kb-index** that contains the following fields.

    | Field | Type | Attributes |
    | --- | --- | --- |
    | chunk_id | Edm.String | key |
    | title | Edm.String | searchable, retrievable |
    | chunk | Edm.String | searchable, retrievable |
    | tags | Collection(Edm.String) | searchable, retrievable, filterable |
    | chunk_vector | Collection(Edm.Single) | searchable |

    You need to add a semantic configuration that uses the document title as the title, the chunk text as the content, and the tags as the keywords.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un index Azure AI Search nommé **kb-index** qui contient les champs suivants.

    | Champ | Type | Attributs |
    | --- | --- | --- |
    | chunk_id | Edm.String | key |
    | title | Edm.String | searchable, retrievable |
    | chunk | Edm.String | searchable, retrievable |
    | tags | Collection(Edm.String) | searchable, retrievable, filterable |
    | chunk_vector | Collection(Edm.Single) | searchable |

    Vous devez ajouter une configuration sémantique qui utilise le titre du document comme titre, le texte du bloc comme contenu et les étiquettes comme mots clés.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "semantic": {
      "configurations": [
        {
          "name": "kb-semantic",
          "prioritizedFields": {
            "[[k1]]": { "fieldName": "title" },
            "[[k2]]": [ { "fieldName": "chunk" } ],
            "prioritizedKeywordsFields": [ { "fieldName": "[[kw]]" } ]
          }
        }
      ]
    }
  slots:
    - id: k1
      options:
        - { id: titleField, text: titleField }
        - { id: pcf1, text: prioritizedContentFields }
        - { id: pkf1, text: prioritizedKeywordsFields }
    - id: k2
      options:
        - { id: tf2, text: titleField }
        - { id: pcf, text: prioritizedContentFields }
        - { id: pkf2, text: prioritizedKeywordsFields }
    - id: kw
      options:
        - { id: tags, text: tags }
        - { id: chunk_vector, text: chunk_vector }
        - { id: chunk_id, text: chunk_id }
answer:
  values: { k1: titleField, k2: pcf, kw: tags }
explanation:
  correct:
    en: |
      A semantic configuration has one `titleField` and the `prioritizedContentFields` and `prioritizedKeywordsFields` arrays, listed in priority order. Every field must be a searchable and retrievable string field, so `tags`, a `Collection(Edm.String)`, can be the keywords field.
    fr: |
      Une configuration sémantique comporte un seul `titleField` ainsi que les tableaux `prioritizedContentFields` et `prioritizedKeywordsFields`, listés par ordre de priorité. Chaque champ doit être un champ chaîne recherchable et récupérable : `tags`, de type `Collection(Edm.String)`, peut donc servir de champ de mots clés.
  options:
    pkf2: { en: "The chunk text is the content to rank; keywords fields are for short terms such as tags.", fr: "Le texte du bloc est le contenu à classer ; les champs de mots clés servent à des termes courts tels que des étiquettes." }
    chunk_vector: { en: "Vector fields cannot be used in a semantic configuration; the ranker reads text only.", fr: "Les champs vectoriels ne peuvent pas être utilisés dans une configuration sémantique ; le classeur ne lit que du texte." }
    chunk_id: { en: "chunk_id is not searchable or retrievable in this index, and it contains no keywords.", fr: "chunk_id n'est ni recherchable ni récupérable dans cet index, et il ne contient aucun mot clé." }
references:
  - title: Configure semantic ranker and return captions in search results
    url: https://learn.microsoft.com/en-us/azure/search/semantic-how-to-configure
