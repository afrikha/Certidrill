id: ai103-5b-video-search-training
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a library of 40-minute safety training videos. An agent must answer questions such as "In which part of the video does the instructor show how to lock out the press?" by using both what is said and what is shown. Each answer must point to the relevant part of the video.

    You need to produce the representation of the videos that will be indexed for the agent. The solution must minimize custom code.

    What should you use?
  fr: |
    Fabrikam, Inc. dispose d'une bibliothèque de vidéos de formation à la sécurité de 40 minutes. Un agent doit répondre à des questions telles que « Dans quelle partie de la vidéo le formateur montre-t-il comment consigner la presse ? » en utilisant à la fois ce qui est dit et ce qui est montré. Chaque réponse doit désigner la partie concernée de la vidéo.

    Vous devez produire la représentation des vidéos qui sera indexée pour l'agent. La solution doit réduire au minimum le code personnalisé.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "prebuilt-videoSearch, indexing the transcript and description of each segment", fr: "prebuilt-videoSearch, en indexant la transcription et la description de chaque segment" } }
    - { id: b, text: { en: "prebuilt-audioSearch, indexing the transcript and summary of each video", fr: "prebuilt-audioSearch, en indexant la transcription et le résumé de chaque vidéo" } }
    - { id: c, text: { en: "prebuilt-imageSearch on frames that your code extracts every 10 seconds", fr: "prebuilt-imageSearch sur des images que votre code extrait toutes les 10 secondes" } }
    - { id: d, text: { en: "Azure Speech batch transcription of the audio track of each video", fr: "La transcription par lots d'Azure Speech de la piste audio de chaque vidéo" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      prebuilt-videoSearch splits each video into segments (by topic shifts, scene changes or visual cues) and returns a transcript and a description of each segment, focused on people, places and actions. Indexing per segment lets the agent retrieve and point to the right part of the video.
    fr: |
      prebuilt-videoSearch découpe chaque vidéo en segments (selon les changements de sujet, de scène ou les indices visuels) et renvoie une transcription et une description de chaque segment, centrée sur les personnes, les lieux et les actions. Indexer chaque segment permet à l'agent de récupérer et de désigner la bonne partie de la vidéo.
  options:
    b: { en: "prebuilt-audioSearch returns what is said, not what is shown, and one summary per file doesn't locate a part of the video.", fr: "prebuilt-audioSearch renvoie ce qui est dit, pas ce qui est montré, et un résumé par fichier ne localise pas une partie de la vidéo." }
    c: { en: "Describing extracted frames ignores the narration and requires custom frame extraction code.", fr: "Décrire des images extraites ignore la narration et exige du code personnalisé d'extraction d'images." }
    d: { en: "A speech transcript captures only the narration, not the visual content.", fr: "Une transcription vocale ne capture que la narration, pas le contenu visuel." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
