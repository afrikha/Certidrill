id: ai103-5a-semantic-facts
objective: "5.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Health plans to enable the semantic ranker on the hybrid queries that a Foundry agent sends to an Azure AI Search index named **benefits-index**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Health prévoit d'activer le classeur sémantique sur les requêtes hybrides qu'un agent Foundry envoie à un index Azure AI Search nommé **benefits-index**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The semantic ranker reorders up to 50 results of the RRF-merged result set.
        fr: |
          Le classeur sémantique réordonne jusqu'à 50 résultats du jeu de résultats fusionné par RRF.
    - id: s2
      text:
        en: |
          The semantic captions in the response are sentences that a generative model writes from the passages.
        fr: |
          Les légendes sémantiques de la réponse sont des phrases qu'un modèle génératif rédige à partir des passages.
    - id: s3
      text:
        en: |
          You can list the contentVector field in the prioritizedContentFields of the semantic configuration.
        fr: |
          Vous pouvez lister le champ contentVector dans les prioritizedContentFields de la configuration sémantique.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Only the top 50 results of the initial BM25 or RRF ranking are sent to the semantic ranker. Captions and answers are extractive: verbatim text from the index, never composed by a generative model. A semantic configuration accepts only nonvector string fields that are searchable and retrievable, because the ranker reads text.
    fr: |
      Seuls les 50 premiers résultats du classement initial BM25 ou RRF sont envoyés au classeur sémantique. Les légendes et les réponses sont extractives : du texte de l'index repris mot pour mot, jamais composé par un modèle génératif. Une configuration sémantique n'accepte que des champs chaîne non vectoriels, recherchables et récupérables, car le classeur lit du texte.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
  - title: Configure semantic ranker and return captions in search results
    url: https://learn.microsoft.com/en-us/azure/search/semantic-how-to-configure
