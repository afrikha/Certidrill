stem:
  en: You run a hybrid query with semantic ranking.
  fr: Vous exécutez une requête hybride avec classement sémantique.
body:
  solution:
    en: |
      The app runs the following query.

      ```python
      results = client.search(
          search_text=question,
          vector_queries=[VectorizableTextQuery(
              text=question, k_nearest_neighbors=50, fields="contentVector")],
          query_type="semantic",
          semantic_configuration_name="sem-cfg",
          top=5,
      )
      ```
    fr: |
      L'application exécute la requête suivante.

      ```python
      results = client.search(
          search_text=question,
          vector_queries=[VectorizableTextQuery(
              text=question, k_nearest_neighbors=50, fields="contentVector")],
          query_type="semantic",
          semantic_configuration_name="sem-cfg",
          top=5,
      )
      ```
answer: { value: true }
explanation:
  correct:
    en: The keyword query on `search_text` matches the exact part number, and the vector subquery, vectorized at query time by the field's vectorizer, retrieves conceptually similar passages. Both run in parallel and are merged with Reciprocal Rank Fusion (RRF); the semantic ranker then reranks up to 50 merged results, which is why `k_nearest_neighbors` is 50, and `top` returns the best five.
    fr: "La requête par mot clé sur `search_text` fait correspondre la référence de pièce exacte, et la sous-requête vectorielle, vectorisée au moment de la requête par le vectoriseur du champ, récupère les passages conceptuellement proches. Les deux s'exécutent en parallèle et sont fusionnées avec RRF (Reciprocal Rank Fusion) ; le classeur sémantique reclasse ensuite jusqu'à 50 résultats fusionnés, d'où la valeur 50 de `k_nearest_neighbors`, et `top` renvoie les cinq meilleurs."
references:
  - title: Create a Hybrid Query
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
