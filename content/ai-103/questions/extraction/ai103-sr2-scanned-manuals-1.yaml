id: ai103-sr2-scanned-manuals-1
objective: "5.1.4"
type: series_yesno
series: ai103-sr2-scanned-manuals
seriesOrder: 1
difficulty: 3
status: draft
stem:
  en: You add OCR and Text Merge skills and chunk the merged text.
  fr: Vous ajoutez les compétences OCR et Text Merge et découpez le texte fusionné.
body:
  solution:
    en: |
      You add an OCR skill whose context and `image` input are `/document/normalized_images/*`. You add a Text Merge skill that merges `/document/content` with `/document/normalized_images/*/text` at the offsets `/document/normalized_images/*/contentOffset` into `/document/merged_text`. You change the input of the Text Split skill to `/document/merged_text`. You leave the indexer configuration unchanged, then reset and run manuals-indexer.
    fr: |
      Vous ajoutez une compétence OCR dont le contexte et l'entrée `image` sont `/document/normalized_images/*`. Vous ajoutez une compétence Text Merge qui fusionne `/document/content` avec `/document/normalized_images/*/text` aux positions `/document/normalized_images/*/contentOffset` dans `/document/merged_text`. Vous remplacez l'entrée de la compétence Text Split par `/document/merged_text`. Vous laissez la configuration de l'indexeur inchangée, puis vous réinitialisez et exécutez manuals-indexer.
answer: { value: false }
explanation:
  correct:
    en: The skills are correct, but they have no input. Image processing is enabled only when `imageAction` is set to a value other than `none`, so without it the indexer doesn't extract any images into `/document/normalized_images`. The OCR skill runs on nothing, and the merged text is still empty.
    fr: "Les compétences sont correctes, mais elles n'ont aucune entrée. Le traitement des images n'est activé que lorsque `imageAction` est défini sur une valeur autre que `none` : sans ce paramètre, l'indexeur n'extrait aucune image dans `/document/normalized_images`. La compétence OCR ne traite rien, et le texte fusionné reste vide."
references:
  - title: Extract Text from Images by Using AI Enrichment
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios
