id: ai103-5b-output-for-consumer
objective: "5.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. uses one custom Azure Content Understanding analyzer, with a field schema, for its supplier invoices. Three downstream consumers use the analysis results.

    Which output or setting should you use for each consumer? To answer, drag the appropriate options to the correct consumers. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. utilise un analyseur Azure Content Understanding personnalisé, avec un schéma de champs, pour ses factures fournisseurs. Trois consommateurs en aval utilisent les résultats de l'analyse.

    Quelle sortie ou quel paramètre devez-vous utiliser pour chaque consommateur ? Pour répondre, faites glisser les options appropriées vers les consommateurs correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: markdown, text: "contents[].markdown" }
    - { id: fields, text: { en: "contents[].fields, with confidence", fr: "contents[].fields, avec la confiance" } }
    - { id: omit, text: "omitContent: true" }
    - { id: segment, text: "enableSegment: true" }
    - { id: details, text: "returnDetails: true" }
  targets:
    - id: rag
      text: { en: "A RAG index whose chunks follow the sections and tables of each invoice", fr: "Un index RAG dont les blocs suivent les sections et les tableaux de chaque facture" }
    - id: erp
      text: { en: "A workflow that writes the invoice totals to a database and flags uncertain values for review", fr: "Un flux de travail qui écrit les totaux des factures dans une base de données et signale les valeurs incertaines pour révision" }
    - id: mobile
      text: { en: "A mobile app that needs only the field values and must receive the smallest possible responses", fr: "Une application mobile qui n'a besoin que des valeurs des champs et doit recevoir les réponses les plus petites possible" }
answer:
  mapping: { rag: markdown, erp: fields, mobile: omit }
explanation:
  correct:
    en: |
      The Markdown keeps headings and tables, so it suits chunking for a RAG index. The fields of the schema, with their confidence scores, are structured values that a workflow can write to a database and route to review. omitContent removes the content object from the response and returns only the analysis results such as the fields.
    fr: |
      Le Markdown conserve les titres et les tableaux : il convient au découpage pour un index RAG. Les champs du schéma, avec leurs scores de confiance, sont des valeurs structurées qu'un flux de travail peut écrire dans une base de données et envoyer en révision. omitContent supprime l'objet de contenu de la réponse et ne renvoie que les résultats de l'analyse, comme les champs.
  options:
    segment: { en: "enableSegment splits files that bundle several documents; the invoices are processed one by one.", fr: "enableSegment découpe les fichiers qui regroupent plusieurs documents ; les factures sont traitées une par une." }
    details: { en: "returnDetails adds bounding boxes, spans and metadata, which makes responses larger, not smaller.", fr: "returnDetails ajoute les cadres englobants, les étendues et les métadonnées, ce qui agrandit les réponses au lieu de les réduire." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
