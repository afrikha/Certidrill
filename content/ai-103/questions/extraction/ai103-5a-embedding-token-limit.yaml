id: ai103-5a-embedding-token-limit
objective: "5.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware indexes engineering specifications into Azure AI Search for a RAG application. The skillset contains only an Azure OpenAI Embedding skill that uses a `text-embedding-3-small` deployment and whose input is `/document/content`, and index projections are not used.

    Short specifications are indexed correctly, but every specification longer than about 30 pages fails with an invalid request error from the embedding skill. Requests are not throttled.

    You need all the specifications to be indexed with vectors that represent precise passages. What should you do?
  fr: |
    Litware indexe des spécifications techniques dans Azure AI Search pour une application RAG. L'ensemble de compétences ne contient qu'une compétence Azure OpenAI Embedding qui utilise un déploiement `text-embedding-3-small` et dont l'entrée est `/document/content`, et aucune projection d'index n'est utilisée.

    Les spécifications courtes sont indexées correctement, mais toutes les spécifications de plus de 30 pages environ échouent avec une erreur de requête non valide renvoyée par la compétence d'embedding. Les requêtes ne sont pas limitées.

    Toutes les spécifications doivent être indexées avec des vecteurs qui représentent des passages précis. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Request a higher tokens-per-minute quota for the embedding deployment", fr: "Demander un quota de jetons par minute plus élevé pour le déploiement d'embedding" } }
    - { id: b, text: { en: "Set the dimensions parameter of the embedding skill to a lower value", fr: "Définir le paramètre dimensions de la compétence d'embedding sur une valeur plus faible" } }
    - { id: c, text: { en: "Replace text-embedding-3-small with text-embedding-3-large in the skill", fr: "Remplacer text-embedding-3-small par text-embedding-3-large dans la compétence" } }
    - { id: d, text: { en: "Add a Text Split skill, embed each chunk, and project the chunks with index projections", fr: "Ajouter une compétence Text Split, calculer l'embedding de chaque bloc et projeter les blocs avec des projections d'index" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Azure OpenAI Embedding skill accepts at most 8,000 tokens per text input, and larger inputs return an invalid request error. Splitting the content with Text Split, embedding each chunk (`/document/pages/*`) and writing one search document per chunk with index projections fixes the error and gives each vector a precise passage.
    fr: |
      La compétence Azure OpenAI Embedding accepte au plus 8 000 jetons par texte en entrée, et une entrée plus longue renvoie une erreur de requête non valide. Découper le contenu avec Text Split, calculer l'embedding de chaque bloc (`/document/pages/*`) et écrire un document de recherche par bloc avec des projections d'index corrige l'erreur et associe chaque vecteur à un passage précis.
  options:
    a:
      en: |
        A tokens-per-minute quota addresses 429 throttling errors, not the size limit of a single input.
      fr: |
        Un quota de jetons par minute résout les erreurs de limitation 429, pas la limite de taille d'une entrée.
    b:
      en: |
        dimensions sets the size of the output vector; the input limit stays the same.
      fr: |
        dimensions définit la taille du vecteur en sortie ; la limite d'entrée reste la même.
    c:
      en: |
        The input limit applies to the supported embedding models, and one vector for a whole document still would not represent precise passages.
      fr: |
        La limite d'entrée s'applique aux modèles d'embedding pris en charge, et un seul vecteur pour tout un document ne représenterait toujours pas des passages précis.
references:
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
  - title: Define an index projection for parent-child indexing
    url: https://learn.microsoft.com/en-us/azure/search/search-how-to-define-index-projections
