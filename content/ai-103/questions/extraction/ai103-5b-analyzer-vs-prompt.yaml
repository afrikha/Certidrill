id: ai103-5b-analyzer-vs-prompt
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation processes about 20,000 scanned lease agreements each month. From each agreement, an application must extract the same 12 fields.

    Values with a low confidence score must be sent to a human reviewer, and the review screen must highlight the location of each value on its page.

    What should you use?
  fr: |
    Adatum Corporation traite environ 20 000 contrats de bail numérisés chaque mois. Une application doit extraire les mêmes 12 champs de chaque contrat.

    Les valeurs dont le score de confiance est faible doivent être envoyées à un réviseur humain, et l'écran de révision doit mettre en évidence l'emplacement de chaque valeur sur sa page.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A multimodal chat model that receives each page image and a prompt asking for the 12 fields as JSON", fr: "Un modèle de conversation multimodal qui reçoit l'image de chaque page et une invite demandant les 12 champs en JSON" } }
    - { id: b, text: { en: "prebuilt-layout with returnDetails enabled, and code that searches the paragraphs for each of the 12 values", fr: "prebuilt-layout avec returnDetails activé, et du code qui cherche chacune des 12 valeurs dans les paragraphes" } }
    - { id: c, text: { en: "An Azure AI Search skillset with the OCR skill, and a keyword query for each of the 12 values", fr: "Un ensemble de compétences Azure AI Search avec la compétence OCR, et une requête par mots clés pour chacune des 12 valeurs" } }
    - { id: d, text: { en: "A custom Content Understanding analyzer with a field schema and estimateFieldSourceAndConfidence enabled", fr: "Un analyseur Content Understanding personnalisé avec un schéma de champs et estimateFieldSourceAndConfidence activé" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A custom analyzer applies the same field schema to every document, which suits repeated extraction at volume. With estimateFieldSourceAndConfidence, each field value comes with a confidence score and its source location (page and bounding box), so the application can route low-confidence values to review and highlight them.
    fr: |
      Un analyseur personnalisé applique le même schéma de champs à chaque document, ce qui convient à une extraction répétée à grande échelle. Avec estimateFieldSourceAndConfidence, chaque valeur de champ est accompagnée d'un score de confiance et de son emplacement source (page et cadre englobant) : l'application peut envoyer les valeurs peu fiables en révision et les mettre en évidence.
  options:
    a: { en: "A prompt returns an answer, but not a confidence score and a source location for each value.", fr: "Une invite renvoie une réponse, mais pas de score de confiance ni d'emplacement source pour chaque valeur." }
    b: { en: "prebuilt-layout returns content, not named fields; matching values in custom code gives no field-level confidence.", fr: "prebuilt-layout renvoie du contenu, pas des champs nommés ; rechercher les valeurs dans du code personnalisé ne fournit aucune confiance par champ." }
    c: { en: "A search index retrieves passages for queries; it doesn't extract named field values with confidence scores.", fr: "Un index de recherche récupère des passages pour des requêtes ; il n'extrait pas de valeurs de champs nommés avec des scores de confiance." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
