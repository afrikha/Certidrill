id: ai103-5b-table-aware-chunks
objective: "5.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a RAG pipeline for supplier price lists in PDF format. The pipeline extracts the text of each file with prebuilt-read, splits the text every 500 tokens, embeds the chunks and indexes them in Azure AI Search. The search uses hybrid queries with semantic ranking.

    The agent often gives wrong prices. Investigation shows that chunks cut through the price tables and that table rows lose their column headers.

    You need to fix the problem with the least custom code. What should you do?
  fr: |
    Tailspin Toys dispose d'un pipeline RAG pour des listes de prix fournisseurs au format PDF. Le pipeline extrait le texte de chaque fichier avec prebuilt-read, découpe le texte tous les 500 jetons, vectorise les blocs et les indexe dans Azure AI Search. La recherche utilise des requêtes hybrides avec classement sémantique.

    L'agent donne souvent des prix erronés. L'analyse montre que les blocs coupent les tableaux de prix et que les lignes des tableaux perdent leurs en-têtes de colonnes.

    Vous devez corriger le problème avec le moins de code personnalisé possible. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep prebuilt-read, and increase the overlap between consecutive chunks to 250 tokens.", fr: "Conserver prebuilt-read et porter le chevauchement entre blocs consécutifs à 250 jetons." } }
    - { id: b, text: { en: "Keep prebuilt-read, and lower the temperature of the agent's chat model to 0.", fr: "Conserver prebuilt-read et abaisser la température du modèle de conversation de l'agent à 0." } }
    - { id: c, text: { en: "Replace prebuilt-read with prebuilt-documentSearch, and index its layout-aware Markdown chunks.", fr: "Remplacer prebuilt-read par prebuilt-documentSearch et indexer ses blocs Markdown qui respectent la disposition." } }
    - { id: d, text: { en: "Keep prebuilt-read, and switch the search queries from hybrid to vector-only.", fr: "Conserver prebuilt-read et passer les requêtes de recherche d'hybrides à vectorielles uniquement." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      prebuilt-read performs OCR without layout analysis, so tables reach the splitter as plain text. prebuilt-documentSearch returns Markdown with tables and structure, and its chunked output supports layout-aware semantic chunking that preserves structure across chunk boundaries, so a row stays with its headers.
    fr: |
      prebuilt-read effectue l'OCR sans analyse de la disposition : les tableaux arrivent au découpage sous forme de texte brut. prebuilt-documentSearch renvoie du Markdown avec les tableaux et la structure, et sa sortie découpée en blocs prend en charge un découpage sémantique tenant compte de la disposition qui préserve la structure d'un bloc à l'autre : une ligne reste avec ses en-têtes.
  options:
    a: { en: "More overlap repeats text between chunks, but the table structure is already lost in the plain OCR text.", fr: "Plus de chevauchement répète du texte entre les blocs, mais la structure des tableaux est déjà perdue dans le texte brut de l'OCR." }
    b: { en: "Temperature tunes generation; the model still receives chunks without table headers, which is a retrieval input problem.", fr: "La température règle la génération ; le modèle reçoit toujours des blocs sans en-têtes de tableau, ce qui est un problème d'entrée de la récupération." }
    d: { en: "Changing the query type doesn't repair chunks that have lost their structure, and it drops the keyword matching useful for product codes.", fr: "Changer le type de requête ne répare pas les blocs qui ont perdu leur structure, et supprime la correspondance par mots clés utile pour les codes de produits." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
