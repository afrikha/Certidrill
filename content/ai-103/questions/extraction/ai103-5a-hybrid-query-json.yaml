id: ai103-5a-hybrid-query-json
objective: "5.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure AI Search index named **manuals-index**. The `contentVector` field uses a vector profile that has an Azure OpenAI vectorizer, and the index has a semantic configuration named `manuals-semantic`.

    A workflow sends the user's question to the index and passes the results to a model. The query must meet the following requirements:

    - The workflow sends only the question text; the search service computes the query vector.
    - The full-text and vector results are combined, and then reranked by the semantic ranker.
    - Exactly five passages are returned to the workflow.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un index Azure AI Search nommé **manuals-index**. Le champ `contentVector` utilise un profil vectoriel doté d'un vectoriseur Azure OpenAI, et l'index possède une configuration sémantique nommée `manuals-semantic`.

    Un flux de travail envoie la question de l'utilisateur à l'index et transmet les résultats à un modèle. La requête doit satisfaire les exigences suivantes :

    - le flux de travail n'envoie que le texte de la question ; le service de recherche calcule le vecteur de requête ;
    - les résultats en texte intégral et vectoriels sont combinés, puis reclassés par le classeur sémantique ;
    - exactement cinq passages sont renvoyés au flux de travail.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "search": "how do I replace the filter cartridge",
      "vectorQueries": [
        {
          "kind": "[[kind]]",
          "text": "how do I replace the filter cartridge",
          "fields": "contentVector",
          "k": 50
        }
      ],
      "queryType": "[[qt]]",
      "semanticConfiguration": "manuals-semantic",
      "[[cnt]]": 5
    }
  slots:
    - id: kind
      options:
        - { id: text, text: text }
        - { id: vector, text: vector }
        - { id: imageUrl, text: imageUrl }
    - id: qt
      options:
        - { id: simple, text: simple }
        - { id: full, text: full }
        - { id: semantic, text: semantic }
    - id: cnt
      options:
        - { id: top, text: top }
        - { id: k, text: k }
        - { id: count, text: count }
answer:
  values: { kind: text, qt: semantic, cnt: top }
explanation:
  correct:
    en: |
      A vector query of kind `text` sends a string that the vectorizer of the field's profile converts to a vector at query time. Combining `search` and `vectorQueries` makes the request hybrid, merged with RRF, and `queryType: semantic` applies the semantic ranker to those results. `top` sets how many results the response returns, while `k` (50 here, as recommended for semantic ranking) sets how many neighbors the vector query feeds into the fusion.
    fr: |
      Une requête vectorielle de type `text` envoie une chaîne que le vectoriseur du profil du champ convertit en vecteur au moment de la requête. La combinaison de `search` et de `vectorQueries` rend la requête hybride, fusionnée avec RRF, et `queryType: semantic` applique le classeur sémantique à ces résultats. `top` définit le nombre de résultats renvoyés, tandis que `k` (50 ici, comme recommandé pour le classement sémantique) définit le nombre de voisins que la requête vectorielle fournit à la fusion.
  options:
    vector: { en: "kind vector means the client sends the vector itself, which the workflow does not do.", fr: "Le type vector signifie que le client envoie lui-même le vecteur, ce que le flux de travail ne fait pas." }
    full: { en: "full enables the Lucene query syntax; it does not invoke the semantic ranker.", fr: "full active la syntaxe de requête Lucene ; il n'appelle pas le classeur sémantique." }
    k: { en: "k belongs inside a vector query and is the number of nearest neighbors, not the size of the response.", fr: "k s'utilise dans une requête vectorielle et correspond au nombre de plus proches voisins, pas à la taille de la réponse." }
    count: { en: "count is a Boolean that asks for the total number of matches.", fr: "count est un booléen qui demande le nombre total de correspondances." }
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Configure a vectorizer in a search index
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-configure-vectorizer
