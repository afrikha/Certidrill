id: ai103-5a-rerank-not-temperature
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Relecloud has a RAG application that sends a hybrid query to an Azure AI Search index and passes the top five passages to a `gpt-4.1-mini` deployment. To limit token usage, the prompt must never contain more than five passages.

    An evaluation shows that the passages that answer the questions are usually found by the query but appear between positions 10 and 40, so the model often answers from less relevant passages. A developer proposes to lower the temperature of the model.

    What should you do instead?
  fr: |
    Relecloud dispose d'une application RAG qui envoie une requête hybride à un index Azure AI Search et transmet les cinq premiers passages à un déploiement `gpt-4.1-mini`. Pour limiter la consommation de jetons, l'invite ne doit jamais contenir plus de cinq passages.

    Une évaluation montre que les passages qui répondent aux questions sont généralement trouvés par la requête, mais apparaissent entre les positions 10 et 40 : le modèle répond donc souvent à partir de passages moins pertinents. Un développeur propose de réduire la température du modèle.

    Que devez-vous faire à la place ?
body:
  options:
    - { id: a, text: { en: "Set top to 40 so that the model receives the relevant passages", fr: "Définir top sur 40 pour que le modèle reçoive les passages pertinents" } }
    - { id: b, text: { en: "Replace the hybrid query with a vector query on the vector field", fr: "Remplacer la requête hybride par une requête vectorielle sur le champ vectoriel" } }
    - { id: c, text: { en: "Set the top_p of the model to 0.1 to make its answers more focused", fr: "Définir le top_p du modèle sur 0.1 pour rendre ses réponses plus ciblées" } }
    - { id: d, text: { en: "Add a semantic configuration and set queryType to semantic in the query", fr: "Ajouter une configuration sémantique et définir queryType sur semantic dans la requête" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The problem is the order of the retrieved passages, not the generation. The semantic ranker reranks the top 50 results of the hybrid query with a language model and promotes the most semantically relevant ones, so the passages at positions 10 to 40 can move into the five that the application keeps.
    fr: |
      Le problème est l'ordre des passages récupérés, pas la génération. Le classeur sémantique reclasse les 50 premiers résultats de la requête hybride avec un modèle de langage et fait remonter les plus pertinents sur le plan sémantique : les passages des positions 10 à 40 peuvent ainsi entrer dans les cinq que l'application conserve.
  options:
    a:
      en: |
        Sending 40 passages breaks the five-passage limit of the prompt.
      fr: |
        Envoyer 40 passages enfreint la limite de cinq passages de l'invite.
    b:
      en: |
        Dropping the full-text side removes exact-term matching and gives no reranking step, so relevance does not improve.
      fr: |
        Supprimer la partie texte intégral retire la correspondance des termes exacts et n'apporte aucune étape de reclassement : la pertinence ne s'améliore pas.
    c:
      en: |
        Like temperature, top_p changes how the model samples tokens; it cannot change which passages it receives.
      fr: |
        Comme la température, top_p modifie la façon dont le modèle échantillonne les jetons ; il ne peut pas changer les passages qu'il reçoit.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
