id: ai103-5a-push-pull-facts
objective: "5.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is building the grounding index of a Foundry agent in Azure AI Search. Some content is in Azure Blob Storage and is loaded by an indexer. Other content comes from a partner API and is uploaded by a Python application that uses the push API.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée dans Azure AI Search l'index d'ancrage d'un agent Foundry. Une partie du contenu se trouve dans Stockage Blob Azure et est chargée par un indexeur. Le reste provient de l'API d'un partenaire et est chargé par une application Python qui utilise l'API push.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A skillset can chunk and vectorize the documents that the Python application uploads with the push API.
        fr: |
          Un ensemble de compétences peut découper en blocs et vectoriser les documents que l'application Python charge avec l'API push.
    - id: s2
      text:
        en: |
          The blob indexer can be scheduled to run every five minutes.
        fr: |
          L'indexeur de blobs peut être planifié pour s'exécuter toutes les cinq minutes.
    - id: s3
      text:
        en: |
          In a push batch, a document sent with the merge action fails if its key does not exist in the index.
        fr: |
          Dans un lot push, un document envoyé avec l'action merge échoue si sa clé n'existe pas dans l'index.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Skillsets are attached to indexers and do not run on their own, so AI enrichment and integrated vectorization require the pull model; pushed documents must already contain their chunks and vectors. Indexers can run on a schedule as often as every five minutes. The merge action updates an existing document and fails when the document is not found; mergeOrUpload would create it instead.
    fr: |
      Les ensembles de compétences sont attachés aux indexeurs et ne s'exécutent pas seuls ; l'enrichissement par IA et la vectorisation intégrée exigent donc le modèle pull, et les documents envoyés en push doivent déjà contenir leurs blocs et leurs vecteurs. Les indexeurs peuvent s'exécuter selon une planification aussi fréquente que toutes les cinq minutes. L'action merge met à jour un document existant et échoue si le document est introuvable ; mergeOrUpload le créerait à la place.
references:
  - title: Data import in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-what-is-data-import
