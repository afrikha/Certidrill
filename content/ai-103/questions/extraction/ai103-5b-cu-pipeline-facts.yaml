id: ai103-5b-cu-pipeline-facts
objective: "5.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders creates a custom Azure Content Understanding analyzer whose base analyzer is prebuilt-document. The analyzer definition contains a field schema and doesn't set enableOcr or enableLayout.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée un analyseur Azure Content Understanding personnalisé dont l'analyseur de base est prebuilt-document. La définition de l'analyseur contient un schéma de champs et ne définit ni enableOcr ni enableLayout.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The analyzer runs OCR and layout analysis on the documents that it processes.
        fr: L'analyseur exécute l'OCR et l'analyse de la disposition sur les documents qu'il traite.
    - id: s2
      text:
        en: prebuilt-digitalParse is the recommended analyzer for scanned, image-based PDF files.
        fr: prebuilt-digitalParse est l'analyseur recommandé pour les fichiers PDF numérisés, de type image.
    - id: s3
      text:
        en: Field extraction with this analyzer is billed by Content Understanding meters and by the tokens that the connected model deployment processes.
        fr: L'extraction de champs avec cet analyseur est facturée selon les compteurs Content Understanding et selon les jetons traités par le déploiement de modèle connecté.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      enableOcr and enableLayout default to true for document analyzers, so content extraction runs unless you turn it off. prebuilt-digitalParse reads the machine-readable structure of a file; for scanned or image-based files you use prebuilt-read or prebuilt-layout. Field extraction uses your Foundry model deployment, so you pay its input and output tokens in addition to the Content Understanding meters.
    fr: |
      enableOcr et enableLayout valent true par défaut pour les analyseurs de documents : l'extraction de contenu s'exécute, sauf si vous la désactivez. prebuilt-digitalParse lit la structure lisible par machine d'un fichier ; pour les fichiers numérisés ou de type image, vous utilisez prebuilt-read ou prebuilt-layout. L'extraction de champs utilise votre déploiement de modèle Foundry : vous payez ses jetons d'entrée et de sortie en plus des compteurs Content Understanding.
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Model deployment options for Content Understanding analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/models-deployments
