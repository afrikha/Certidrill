id: ai103-5b-read-faxed-notes
objective: "5.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys receives delivery notes as faxed images saved as PNG files. A warehouse application needs only the words and the barcode values of each note; it doesn't use tables or document structure.

    You need to choose an Azure Content Understanding analyzer. The solution must not depend on generative model deployments.

    Which analyzer should you use?
  fr: |
    Wingtip Toys reçoit des bons de livraison sous forme d'images télécopiées enregistrées en fichiers PNG. Une application d'entrepôt n'a besoin que des mots et des valeurs des codes-barres de chaque bon ; elle n'utilise ni les tableaux ni la structure du document.

    Vous devez choisir un analyseur Azure Content Understanding. La solution ne doit pas dépendre de déploiements de modèles génératifs.

    Quel analyseur devez-vous utiliser ?
body:
  options:
    - { id: a, text: prebuilt-read }
    - { id: b, text: prebuilt-digitalParse }
    - { id: c, text: prebuilt-receipt }
    - { id: d, text: prebuilt-imageSearch }
answer: { optionId: a }
explanation:
  correct:
    en: |
      prebuilt-read performs OCR and returns words, paragraphs, formulas and barcodes, without layout analysis and without a language or embedding model. It fits image-based input when only the text and barcodes are needed.
    fr: |
      prebuilt-read effectue l'OCR et renvoie les mots, les paragraphes, les formules et les codes-barres, sans analyse de la disposition et sans modèle de langage ni d'incorporation. Il convient aux entrées de type image quand seuls le texte et les codes-barres sont nécessaires.
  options:
    b: { en: "prebuilt-digitalParse reads machine-readable content from the file's internal structure; for scanned or image-based files, the documentation points to prebuilt-read or prebuilt-layout.", fr: "prebuilt-digitalParse lit le contenu lisible par machine à partir de la structure interne du fichier ; pour les fichiers numérisés ou de type image, la documentation oriente vers prebuilt-read ou prebuilt-layout." }
    c: { en: "prebuilt-receipt is a domain analyzer that extracts receipt fields with a generative model; delivery notes aren't receipts, and the solution must not depend on models.", fr: "prebuilt-receipt est un analyseur de domaine qui extrait les champs de reçus avec un modèle génératif ; les bons de livraison ne sont pas des reçus, et la solution ne doit pas dépendre de modèles." }
    d: { en: "prebuilt-imageSearch produces a description of the image for search, which relies on a generative model and doesn't return barcode values.", fr: "prebuilt-imageSearch produit une description de l'image pour la recherche, ce qui repose sur un modèle génératif et ne renvoie pas les valeurs des codes-barres." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
