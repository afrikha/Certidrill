id: ai103-5a-retrieval-methods
objective: "5.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso Pharmaceuticals grounds several Foundry agents on Azure AI Search indexes. Each agent has a different retrieval requirement.

    Which retrieval feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Pharmaceuticals ancre plusieurs agents Foundry sur des index Azure AI Search. Chaque agent a une exigence de récupération différente.

    Quelle fonctionnalité de récupération devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fts, text: { en: "Full-text search", fr: "Recherche en texte intégral" } }
    - { id: vec, text: { en: "Vector search", fr: "Recherche vectorielle" } }
    - { id: hyb, text: { en: "Hybrid search", fr: "Recherche hybride" } }
    - { id: sem, text: { en: "Semantic ranker", fr: "Classeur sémantique" } }
    - { id: score, text: { en: "Scoring profile", fr: "Profil de score" } }
  targets:
    - { id: t1, text: { en: "Match batch numbers such as LOT-2291-K exactly as they are typed", fr: "Faire correspondre des numéros de lot tels que LOT-2291-K exactement comme ils sont saisis" } }
    - { id: t2, text: { en: "Find passages that express the same idea as the question with different words", fr: "Trouver des passages qui expriment la même idée que la question avec d'autres mots" } }
    - { id: t3, text: { en: "Run term matching and similarity matching in one request and merge both result sets", fr: "Exécuter la correspondance de termes et la correspondance par similarité dans une seule requête et fusionner les deux jeux de résultats" } }
    - { id: t4, text: { en: "Rerank the top results with a language model and return extractive captions", fr: "Reclasser les premiers résultats avec un modèle de langage et renvoyer des légendes extractives" } }
answer:
  mapping: { t1: fts, t2: vec, t3: hyb, t4: sem }
explanation:
  correct:
    en: |
      Full-text search (BM25) gives precision on exact terms such as codes and names. Vector search finds conceptually similar content even when no keyword matches. Hybrid search runs both queries in parallel in one request and merges them with Reciprocal Rank Fusion (RRF). The semantic ranker reranks the top 50 results of a text or hybrid query and can return verbatim captions and answers.
    fr: |
      La recherche en texte intégral (BM25) est précise sur les termes exacts tels que des codes et des noms. La recherche vectorielle trouve du contenu conceptuellement proche même quand aucun mot clé ne correspond. La recherche hybride exécute les deux requêtes en parallèle dans une même demande et les fusionne avec Reciprocal Rank Fusion (RRF). Le classeur sémantique reclasse les 50 premiers résultats d'une requête texte ou hybride et peut renvoyer des légendes et des réponses tirées mot pour mot du contenu.
  options:
    score:
      en: |
        A scoring profile boosts results with weights and functions defined in the index; it does not use a language model.
      fr: |
        Un profil de score favorise des résultats à l'aide de pondérations et de fonctions définies dans l'index ; il n'utilise pas de modèle de langage.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
