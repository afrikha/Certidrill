id: ai103-5a-cu-skill-tables
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Insurance is creating a new skillset to index 50,000 PDF rate books into Azure AI Search for a pricing agent. Many rate tables continue across two or three pages.

    The skillset must meet the following requirements:

    - Each table must stay in one chunk, formatted as Markdown, even when it spans several pages.
    - The document analysis cost must be minimized.

    Which skill should you use to extract and chunk the content?
  fr: |
    Adatum Insurance crée un nouvel ensemble de compétences pour indexer 50 000 barèmes PDF dans Azure AI Search à destination d'un agent de tarification. De nombreux tableaux de tarifs s'étendent sur deux ou trois pages.

    L'ensemble de compétences doit satisfaire les exigences suivantes :

    - chaque tableau doit rester dans un seul bloc, au format Markdown, même lorsqu'il s'étend sur plusieurs pages ;
    - le coût de l'analyse des documents doit être réduit au minimum.

    Quelle compétence devez-vous utiliser pour extraire et découper le contenu ?
body:
  options:
    - { id: a, text: { en: "The Azure Content Understanding skill", fr: "La compétence Azure Content Understanding" } }
    - { id: b, text: { en: "The Document Layout skill with outputFormat set to text", fr: "La compétence Document Layout avec outputFormat défini sur text" } }
    - { id: c, text: { en: "The GenAI Prompt skill that rewrites each page as Markdown", fr: "La compétence GenAI Prompt qui réécrit chaque page en Markdown" } }
    - { id: d, text: { en: "The OCR skill followed by the Text Split skill", fr: "La compétence OCR suivie de la compétence Text Split" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Content Understanding skill returns `text_sections` whose content is Markdown, extracts tables that cross pages as one unit, and can build chunks that span pages. Learn describes it as less expensive than the Document Layout skill and recommends it for new skillsets.
    fr: |
      La compétence Azure Content Understanding renvoie des `text_sections` dont le contenu est en Markdown, extrait comme une seule unité les tableaux qui traversent les pages et peut créer des blocs qui s'étendent sur plusieurs pages. Learn la présente comme moins coûteuse que la compétence Document Layout et la recommande pour les nouveaux ensembles de compétences.
  options:
    b:
      en: |
        With the text output format, Document Layout returns plain-text chunks within page bounds, so a table that spans pages is split, and the layout model costs more.
      fr: |
        Avec le format de sortie text, Document Layout renvoie des blocs de texte brut limités aux pages : un tableau qui s'étend sur plusieurs pages est coupé, et le modèle de disposition coûte plus cher.
    c:
      en: |
        Calling a chat model for every page of 50,000 documents is costly, and a page-by-page prompt still cuts tables at page breaks.
      fr: |
        Appeler un modèle de conversation pour chaque page de 50 000 documents est coûteux, et une invite page par page coupe toujours les tableaux aux sauts de page.
    d:
      en: |
        OCR returns plain text without table structure, and Text Split cuts by length, not by table.
      fr: |
        L'OCR renvoie du texte brut sans structure de tableau, et Text Split coupe selon la longueur, pas selon les tableaux.
references:
  - title: Azure Content Understanding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-content-understanding
  - title: Multimodal search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/multimodal-search-overview
