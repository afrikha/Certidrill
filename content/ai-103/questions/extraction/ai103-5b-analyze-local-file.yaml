id: ai103-5b-analyze-local-file
objective: "5.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has a custom Azure Content Understanding analyzer named poAnalyzer that extracts fields from purchase orders. A Python script must analyze scanned purchase orders that are stored on a local disk and are not reachable by URL. The script prints each extracted field after the analysis completes.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un analyseur Azure Content Understanding personnalisé nommé poAnalyzer qui extrait des champs de bons de commande. Un script Python doit analyser des bons de commande numérisés stockés sur un disque local et inaccessibles par URL. Le script affiche chaque champ extrait une fois l'analyse terminée.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    client = ContentUnderstandingClient(endpoint=endpoint, credential=DefaultAzureCredential())

    with open("scans/po-1187.pdf", "rb") as f:
        data = f.read()

    poller = client.[[method]](
        analyzer_id="poAnalyzer",
        [[arg]]=data,
    )
    result = [[wait]]

    for name, field in result.contents[0].fields.items():
        print(name, field.value)
  slots:
    - id: method
      options:
        - { id: analyze, text: begin_analyze }
        - { id: binary, text: begin_analyze_binary }
        - { id: create, text: begin_create_analyzer }
    - id: arg
      options:
        - { id: inputs, text: inputs }
        - { id: resource, text: resource }
        - { id: binary, text: binary_input }
    - id: wait
      options:
        - { id: result, text: poller.result() }
        - { id: opid, text: poller.operation_id }
        - { id: status, text: poller.status() }
answer:
  values: { method: binary, arg: binary, wait: result }
explanation:
  correct:
    en: |
      begin_analyze_binary sends the bytes of a file in its binary_input parameter, which fits files that have no URL. Like begin_analyze, it starts a long-running operation and returns a poller; poller.result() waits for the operation to finish and returns the AnalysisResult, whose contents carry the fields.
    fr: |
      begin_analyze_binary envoie les octets d'un fichier dans son paramètre binary_input, ce qui convient aux fichiers sans URL. Comme begin_analyze, il démarre une opération de longue durée et renvoie un poller ; poller.result() attend la fin de l'opération et renvoie l'AnalysisResult, dont le contenu porte les champs.
  options:
    method: { en: "begin_analyze takes a list of AnalysisInput objects in inputs (for example, URLs), and begin_create_analyzer creates an analyzer definition instead of analyzing a file.", fr: "begin_analyze prend une liste d'objets AnalysisInput dans inputs (par exemple des URL), et begin_create_analyzer crée une définition d'analyseur au lieu d'analyser un fichier." }
    arg: { en: "inputs belongs to begin_analyze, and resource is the analyzer definition passed to begin_create_analyzer.", fr: "inputs appartient à begin_analyze, et resource est la définition d'analyseur passée à begin_create_analyzer." }
    wait: { en: "operation_id and status() describe the operation but don't wait for it or return the analysis result.", fr: "operation_id et status() décrivent l'opération, mais n'attendent pas sa fin et ne renvoient pas le résultat de l'analyse." }
references:
  - title: ContentUnderstandingClient Class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-contentunderstanding/azure.ai.contentunderstanding.contentunderstandingclient
  - title: Azure AI Content Understanding client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
