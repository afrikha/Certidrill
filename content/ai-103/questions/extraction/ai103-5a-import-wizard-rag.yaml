id: ai103-5a-import-wizard-rag
objective: "5.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to use the **Import data** wizard of the Azure portal, with the RAG scenario, to create the grounding index of a Foundry agent. The source documents are PDF files in an Azure Blob Storage container, and the embeddings must come from a `text-embedding-3-small` deployment in a Foundry project.

    Which two statements about the pipeline that the wizard creates are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'utiliser l'assistant **Import data** du portail Azure, avec le scénario RAG, pour créer l'index d'ancrage d'un agent Foundry. Les documents sources sont des fichiers PDF stockés dans un conteneur Stockage Blob Azure, et les embeddings doivent provenir d'un déploiement `text-embedding-3-small` d'un projet Foundry.

    Quelles sont les deux affirmations vraies concernant le pipeline créé par l'assistant ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The wizard creates a data source, a skillset, an index and an indexer.", fr: "L'assistant crée une source de données, un ensemble de compétences, un index et un indexeur." } }
    - { id: b, text: { en: "The wizard lets you set the chunk size and the overlap of the Text Split skill.", fr: "L'assistant vous permet de définir la taille des blocs et le chevauchement de la compétence Text Split." } }
    - { id: c, text: { en: "The storage account must allow public access while the wizard runs.", fr: "Le compte de stockage doit autoriser l'accès public pendant l'exécution de l'assistant." } }
    - { id: d, text: { en: "The wizard uses the push model, so the application must upload the chunks.", fr: "L'assistant utilise le modèle push : l'application doit donc charger les blocs." } }
    - { id: e, text: { en: "The wizard can also read the content from an Azure SQL Database table.", fr: "L'assistant peut aussi lire le contenu d'une table Azure SQL Database." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      The wizard generates the four objects of a pull pipeline: a data source, a skillset (Text Split, embedding skill and index projections), an index with vector fields and a vectorizer, and an indexer. All the resources must allow public access for the wizard to work; you can add firewalls and private endpoints afterward.
    fr: |
      L'assistant génère les quatre objets d'un pipeline pull : une source de données, un ensemble de compétences (Text Split, compétence d'embedding et projections d'index), un index avec des champs vectoriels et un vectoriseur, et un indexeur. Toutes les ressources doivent autoriser l'accès public pour que l'assistant fonctionne ; vous pouvez ajouter des pare-feu et des points de terminaison privés ensuite.
  options:
    b:
      en: |
        Chunking is fixed in the wizard (pages of 2,000 characters with a 500-character overlap); you change it later in the skillset.
      fr: |
        Le découpage est fixe dans l'assistant (pages de 2 000 caractères avec un chevauchement de 500 caractères) ; vous le modifiez ensuite dans l'ensemble de compétences.
    d:
      en: |
        The wizard creates an indexer, which is the pull model; the push model is not supported in the portal.
      fr: |
        L'assistant crée un indexeur, c'est-à-dire le modèle pull ; le modèle push n'est pas pris en charge dans le portail.
    e:
      en: |
        The RAG scenario of the wizard supports whole-file sources only: Blob Storage, ADLS Gen2 and OneLake.
      fr: |
        Le scénario RAG de l'assistant ne prend en charge que les sources de fichiers entiers : Stockage Blob, ADLS Gen2 et OneLake.
references:
  - title: "Quickstart: Vector search in the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/search/search-get-started-portal-import-vectors
