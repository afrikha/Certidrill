id: ai103-5a-content-paths
objective: "5.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is building one Azure AI Search index to ground a Foundry agent on four types of content.

    You need to choose how each type of content reaches the index as searchable text.

    Which approach should you use for each type of content? To answer, drag the appropriate approaches to the correct content types. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée un index Azure AI Search unique pour ancrer un agent Foundry sur quatre types de contenu.

    Vous devez choisir comment chaque type de contenu parvient dans l'index sous forme de texte recherchable.

    Quelle approche devez-vous utiliser pour chaque type de contenu ? Pour répondre, faites glisser les approches appropriées vers les types de contenu correspondants. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ocr, text: { en: "Image extraction by the indexer, then the OCR skill", fr: "Extraction des images par l'indexeur, puis compétence OCR" } }
    - { id: split, text: { en: "Document cracking by the indexer, then the Text Split skill", fr: "Craquage de documents par l'indexeur, puis compétence Text Split" } }
    - { id: audio, text: { en: "Content Understanding prebuilt-audioSearch, then index the transcript and summary", fr: "Content Understanding prebuilt-audioSearch, puis indexation de la transcription et du résumé" } }
    - { id: video, text: { en: "Content Understanding prebuilt-videoSearch, then index the segment descriptions", fr: "Content Understanding prebuilt-videoSearch, puis indexation des descriptions de segments" } }
    - { id: tags, text: { en: "The Image Analysis skill with the tags visual feature", fr: "Compétence Image Analysis avec la fonctionnalité visuelle tags" } }
    - { id: lookup, text: { en: "The Custom Entity Lookup skill", fr: "Compétence Custom Entity Lookup" } }
  targets:
    - { id: t1, text: { en: "Scanned loan forms stored as TIFF files", fr: "Formulaires de prêt numérisés stockés en fichiers TIFF" } }
    - { id: t2, text: { en: "Policy documents written in Word (DOCX)", fr: "Documents de politique rédigés dans Word (DOCX)" } }
    - { id: t3, text: { en: "Recorded customer calls (MP3)", fr: "Appels clients enregistrés (MP3)" } }
    - { id: t4, text: { en: "Training videos in which the on-screen actions must be searchable", fr: "Vidéos de formation dont les actions à l'écran doivent être recherchables" } }
answer:
  mapping: { t1: ocr, t2: split, t3: audio, t4: video }
explanation:
  correct:
    en: |
      Scanned TIFF files contain only images, so the indexer must extract them (`imageAction`) for the OCR skill to read the text. Word documents have a text layer that document cracking extracts for free; Text Split then chunks it. The blob indexer has no audio or video format, so recordings are first converted to text: `prebuilt-audioSearch` returns a transcript and a summary, and `prebuilt-videoSearch` adds a description of each segment, which covers what happens on screen.
    fr: |
      Les fichiers TIFF numérisés ne contiennent que des images : l'indexeur doit les extraire (`imageAction`) pour que la compétence OCR en lise le texte. Les documents Word possèdent une couche de texte que le craquage de documents extrait gratuitement ; Text Split la découpe ensuite en blocs. L'indexeur de blobs ne prend en charge aucun format audio ou vidéo : les enregistrements sont d'abord convertis en texte. `prebuilt-audioSearch` renvoie une transcription et un résumé, et `prebuilt-videoSearch` ajoute une description de chaque segment, qui couvre ce qui se passe à l'écran.
  options:
    tags:
      en: |
        Image Analysis tags describe visual objects; they do not read the text of a scanned form.
      fr: |
        Les étiquettes d'Image Analysis décrivent des objets visuels ; elles ne lisent pas le texte d'un formulaire numérisé.
    lookup:
      en: |
        Custom Entity Lookup matches terms from your own list in text that already exists; it produces no text from images or recordings.
      fr: |
        Custom Entity Lookup recherche les termes de votre propre liste dans un texte existant ; il ne produit aucun texte à partir d'images ou d'enregistrements.
references:
  - title: Prebuilt analyzers in Azure Content Understanding in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
  - title: Extract text and information from images by using AI enrichment
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios
