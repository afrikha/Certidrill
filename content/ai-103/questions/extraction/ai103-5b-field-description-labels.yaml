id: ai103-5b-field-description-labels
objective: "5.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a custom Azure Content Understanding analyzer for supplier order confirmations. The OrderNumber field is defined as follows:

    `"OrderNumber": { "type": "string", "method": "extract", "description": "Order number" }`

    Source and confidence estimation is enabled. Testing shows that OrderNumber is often empty for suppliers that print the value under the labels "Ref. commande" or "Our ref.".

    You need to improve the extraction of OrderNumber without changing the analyzer's other fields. What should you do?
  fr: |
    Northwind Traders dispose d'un analyseur Azure Content Understanding personnalisé pour les confirmations de commande des fournisseurs. Le champ OrderNumber est défini comme suit :

    `"OrderNumber": { "type": "string", "method": "extract", "description": "Order number" }`

    L'estimation de la source et de la confiance est activée. Les tests montrent qu'OrderNumber est souvent vide pour les fournisseurs qui impriment la valeur sous les étiquettes « Ref. commande » ou « Our ref. ».

    Vous devez améliorer l'extraction d'OrderNumber sans modifier les autres champs de l'analyseur. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the method of OrderNumber to classify.", fr: "Changer la méthode d'OrderNumber en classify." } }
    - { id: b, text: { en: "Set returnDetails to true in the analyzer configuration.", fr: "Définir returnDetails sur true dans la configuration de l'analyseur." } }
    - { id: c, text: { en: "Rewrite the OrderNumber description to name the labels that suppliers use.", fr: "Réécrire la description d'OrderNumber pour nommer les étiquettes qu'utilisent les fournisseurs." } }
    - { id: d, text: { en: "Change the type of OrderNumber to number.", fr: "Changer le type d'OrderNumber en number." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Field descriptions are sent to the model as context during field extraction, so a precise description that lists the labels used in the documents helps the model find the value. The method extract remains correct because the order number is printed in the document.
    fr: |
      Les descriptions des champs sont transmises au modèle comme contexte pendant l'extraction des champs : une description précise qui liste les étiquettes utilisées dans les documents aide le modèle à trouver la valeur. La méthode extract reste correcte, car le numéro de commande est imprimé dans le document.
  options:
    a: { en: "classify picks a value from a fixed set, but order numbers are unique values printed in the document.", fr: "classify choisit une valeur dans un ensemble fixe, alors que les numéros de commande sont des valeurs uniques imprimées dans le document." }
    b: { en: "returnDetails adds confidence, bounding boxes and spans to the content; it doesn't help the model locate the field.", fr: "returnDetails ajoute la confiance, les cadres englobants et les étendues au contenu ; il n'aide pas le modèle à localiser le champ." }
    d: { en: "The type normalizes the returned value; order numbers can contain letters, and the problem is finding the value, not its format.", fr: "Le type normalise la valeur renvoyée ; les numéros de commande peuvent contenir des lettres, et le problème est de trouver la valeur, pas son format." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Best practices for Azure Content Understanding in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
