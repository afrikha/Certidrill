id: ai103-cs3c-manual-pipeline
objective: "5.1.4"
type: ordering
caseStudy: ai103-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You are designing the indexer and skillset of relecloud-search that will index the manuals container. You need to meet the manuals requirement.

    Which five operations should run in sequence for each manual? To answer, move the appropriate operations to the answer area and arrange them in the correct order.
  fr: |
    Vous concevez l'indexeur et l'ensemble de compétences de relecloud-search qui indexeront le conteneur manuals. Vous devez satisfaire l'exigence relative aux manuels.

    Quelles sont les cinq opérations qui doivent s'exécuter dans l'ordre pour chaque manuel ? Pour répondre, déplacez les opérations appropriées vers la zone de réponse et classez-les dans l'ordre correct.
body:
  count: 5
  actions:
    - id: crack
      text:
        en: "The indexer cracks the PDF file and generates normalized images of its pages and embedded images."
        fr: "L'indexeur décode le fichier PDF et génère des images normalisées de ses pages et de ses images incorporées."
    - id: ocr
      text:
        en: "The OCR skill extracts the text from each normalized image."
        fr: "La compétence OCR extrait le texte de chaque image normalisée."
    - id: merge
      text:
        en: "The Text Merge skill inserts the extracted text into the content of the document."
        fr: "La compétence Text Merge insère le texte extrait dans le contenu du document."
    - id: split
      text:
        en: "The Text Split skill divides the merged text into chunks."
        fr: "La compétence Text Split divise le texte fusionné en segments."
    - id: embed
      text:
        en: "The Azure OpenAI Embedding skill generates a vector for each chunk by using embed-main."
        fr: "La compétence Azure OpenAI Embedding génère un vecteur pour chaque segment à l'aide d'embed-main."
    - id: entities
      text:
        en: "The Entity Recognition skill tags the part numbers that appear in each chunk."
        fr: "La compétence Entity Recognition étiquette les références de pièces qui apparaissent dans chaque segment."
    - id: language
      text:
        en: "The Language Detection skill sets the language of each normalized image."
        fr: "La compétence Language Detection définit la langue de chaque image normalisée."
answer:
  sequence: [crack, ocr, merge, split, embed]
explanation:
  correct:
    en: |
      Scanned pages contain no text layer, so the indexer must generate normalized images (`imageAction` set to `generateNormalizedImages`) for the OCR skill to read. The Text Merge skill then inserts the OCR text, including the diagram labels, at the right positions in the content. The Text Split skill chunks the merged text, and the Azure OpenAI Embedding skill vectorizes each chunk before the indexer writes chunks and vectors to the index.
    fr: |
      Les pages numérisées n'ont pas de couche de texte : l'indexeur doit donc générer des images normalisées (`imageAction` défini sur `generateNormalizedImages`) que la compétence OCR lira. La compétence Text Merge insère ensuite le texte OCR, y compris les étiquettes des schémas, aux bonnes positions dans le contenu. La compétence Text Split segmente le texte fusionné, et la compétence Azure OpenAI Embedding vectorise chaque segment avant que l'indexeur n'écrive les segments et les vecteurs dans l'index.
  options:
    entities:
      en: |
        Entity recognition is not needed to make part numbers searchable; the OCR text already contains them.
      fr: |
        La reconnaissance d'entités n'est pas nécessaire pour rendre les références de pièces recherchables : le texte OCR les contient déjà.
    language:
      en: |
        Language detection is not needed by any requirement, and it works on text, not on images.
      fr: |
        La détection de langue n'est demandée par aucune exigence, et elle s'applique à du texte, pas à des images.
references:
  - title: OCR skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
