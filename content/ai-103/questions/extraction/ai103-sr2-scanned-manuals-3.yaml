id: ai103-sr2-scanned-manuals-3
objective: "5.1.4"
type: series_yesno
series: ai103-sr2-scanned-manuals
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You enable image extraction and vectorize the page images with multimodal embeddings.
  fr: Vous activez l'extraction des images et vectorisez les images des pages avec des embeddings multimodaux.
body:
  solution:
    en: |
      You set `imageAction` to `generateNormalizedImages` in the indexer configuration. You add an Azure AI Vision multimodal embeddings skill that vectorizes each image in `/document/normalized_images/*` and you project the image vectors to the index. You leave the Text Split skill unchanged, then reset and run manuals-indexer.
    fr: |
      Vous définissez `imageAction` sur `generateNormalizedImages` dans la configuration de l'indexeur. Vous ajoutez une compétence Azure AI Vision multimodal embeddings qui vectorise chaque image de `/document/normalized_images/*` et vous projetez les vecteurs des images dans l'index. Vous laissez la compétence Text Split inchangée, puis vous réinitialisez et exécutez manuals-indexer.
answer: { value: false }
explanation:
  correct:
    en: A multimodal embeddings skill turns each image into a vector; it doesn't read the printed text. No skill performs OCR, and the Text Split skill still splits the empty `/document/content`, so the chunks still contain no text. Text from scanned pages requires an OCR skill whose output is merged into the text that is chunked.
    fr: "Une compétence d'embeddings multimodaux transforme chaque image en vecteur ; elle ne lit pas le texte imprimé. Aucune compétence n'effectue d'OCR, et la compétence Text Split découpe toujours le champ `/document/content` vide : les blocs ne contiennent toujours aucun texte. Le texte des pages numérisées nécessite une compétence OCR dont la sortie est fusionnée dans le texte découpé."
references:
  - title: Extract Text from Images by Using AI Enrichment
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios
