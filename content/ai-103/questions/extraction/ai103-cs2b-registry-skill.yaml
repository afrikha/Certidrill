id: ai103-cs2b-registry-skill
objective: "5.1.3"
type: yesno_statements
caseStudy: ai103-cs2b-trey-research
difficulty: 2
status: draft
stem:
  en: |
    To meet the compound codes requirement, you plan to add a Custom Web API skill that calls compound-registry to the skillset of trial-reports. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence relative aux codes des composés, vous prévoyez d'ajouter à l'ensemble de compétences de trial-reports une compétence Custom Web API qui appelle compound-registry. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          compound-registry must return one object for each `recordId` of the request, including the records that it fails to process.
        fr: |
          compound-registry doit renvoyer un objet pour chaque `recordId` de la requête, y compris pour les enregistrements qu'elle ne parvient pas à traiter.
    - id: s2
      text:
        en: |
          If you don't set the `timeout` parameter, the indexer waits up to two minutes for each call to compound-registry.
        fr: |
          Si vous ne définissez pas le paramètre `timeout`, l'indexeur attend jusqu'à deux minutes pour chaque appel à compound-registry.
    - id: s3
      text:
        en: |
          If you set `authResourceId` to `api://trey-registry`, the skill authenticates to compound-registry by using the managed identity of trey-search.
        fr: |
          Si vous définissez `authResourceId` sur `api://trey-registry`, la compétence s'authentifie auprès de compound-registry à l'aide de l'identité managée de trey-search.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The response must contain the same number of objects as the request, each with its `recordId`, `data`, `errors` and `warnings`; a record that fails is returned with an error, and a missing record isn't enriched. The default timeout is 30 seconds, so you must set it explicitly (for example `PT120S`; the maximum is 230 seconds). `authResourceId` enables managed identity authentication to an endpoint protected by Microsoft Entra ID; without `authIdentity`, the system-assigned identity of the search service is used, so no key is stored in the skillset.
    fr: |
      La réponse doit contenir le même nombre d'objets que la requête, chacun avec son `recordId`, `data`, `errors` et `warnings` ; un enregistrement en échec est renvoyé avec une erreur, et un enregistrement manquant n'est pas enrichi. Le délai d'expiration par défaut est de 30 secondes : vous devez donc le définir explicitement (par exemple `PT120S` ; le maximum est de 230 secondes). `authResourceId` active l'authentification par identité managée auprès d'un point de terminaison protégé par Microsoft Entra ID ; sans `authIdentity`, c'est l'identité affectée par le système du service de recherche qui est utilisée, et aucune clé n'est stockée dans l'ensemble de compétences.
references:
  - title: Custom Web API Skill in Skillsets
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api
