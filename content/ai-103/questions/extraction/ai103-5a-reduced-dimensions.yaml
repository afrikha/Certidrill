id: ai103-5a-reduced-dimensions
objective: "5.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure AI Search index named **specs-index** that has a vector field named `specVector` defined with 3,072 dimensions. A skillset uses an Azure OpenAI Embedding skill with `"modelName": "text-embedding-3-large"`.

    To reduce storage, an engineer adds `"dimensions": 1024` to the embedding skill. The next indexer run fails for every document. The vectors must keep 1,024 dimensions.

    What should you do?
  fr: |
    Adatum dispose d'un index Azure AI Search nommé **specs-index** qui contient un champ vectoriel nommé `specVector` défini avec 3 072 dimensions. Un ensemble de compétences utilise une compétence Azure OpenAI Embedding avec `"modelName": "text-embedding-3-large"`.

    Pour réduire le stockage, un ingénieur ajoute `"dimensions": 1024` à la compétence d'embedding. L'exécution suivante de l'indexeur échoue pour chaque document. Les vecteurs doivent conserver 1 024 dimensions.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a scalar quantization compression to the vector profile of specVector", fr: "Ajouter une compression par quantification scalaire au profil vectoriel de specVector" } }
    - { id: b, text: { en: "Change the modelName of the skill to text-embedding-ada-002", fr: "Remplacer le modelName de la compétence par text-embedding-ada-002" } }
    - { id: c, text: { en: "Re-create specVector with its dimensions property set to 1024", fr: "Recréer specVector avec sa propriété dimensions définie sur 1024" } }
    - { id: d, text: { en: "Set the exhaustive parameter to true in the vector queries", fr: "Définir le paramètre exhaustive sur true dans les requêtes vectorielles" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When you set `dimensions` on the embedding skill, the vector field must declare the same value. Changing the definition of an existing field usually requires a rebuild, so you re-create the field (or the index) with 1,024 dimensions and run the indexer again.
    fr: |
      Lorsque vous définissez `dimensions` sur la compétence d'embedding, le champ vectoriel doit déclarer la même valeur. La modification de la définition d'un champ existant nécessite en général une reconstruction : vous recréez donc le champ (ou l'index) avec 1 024 dimensions, puis vous réexécutez l'indexeur.
  options:
    a:
      en: |
        Quantization compresses the stored vectors, but the field still expects 3,072 values per vector, so the mismatch remains.
      fr: |
        La quantification compresse les vecteurs stockés, mais le champ attend toujours 3 072 valeurs par vecteur : l'écart demeure.
    b:
      en: |
        text-embedding-ada-002 has a fixed size of 1,536 dimensions, which matches neither the field nor the requirement.
      fr: |
        text-embedding-ada-002 a une taille fixe de 1 536 dimensions, qui ne correspond ni au champ ni à l'exigence.
    d:
      en: |
        The exhaustive parameter changes how queries search the vectors; it does not fix an indexing failure.
      fr: |
        Le paramètre exhaustive modifie la façon dont les requêtes parcourent les vecteurs ; il ne corrige pas un échec d'indexation.
references:
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
  - title: Create a vector index in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index
