id: ai103-5b-documentsearch-markdown-code
objective: "5.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is writing a Python ingestion script for a RAG index. For each PDF file in Azure Blob Storage, the script must get a Markdown representation that includes figure descriptions and a summary, without creating a custom analyzer. The script stores the Markdown with the file URL and the number of the first page of the analyzed content.

    The `client` variable is an authenticated `ContentUnderstandingClient`.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. écrit un script d'ingestion Python pour un index RAG. Pour chaque fichier PDF du Stockage Blob Azure, le script doit obtenir une représentation Markdown qui inclut la description des figures et un résumé, sans créer d'analyseur personnalisé. Le script stocke le Markdown avec l'URL du fichier et le numéro de la première page du contenu analysé.

    La variable `client` est un `ContentUnderstandingClient` authentifié.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    poller = client.begin_analyze(
        analyzer_id=[[analyzer]],
        inputs=[AnalysisInput(url=blob_url)],
    )
    result = poller.result()
    content = result.contents[0]

    record = {
        "text": content.[[text]],
        "file": blob_url,
        "first_page": content.[[page]],
    }
  slots:
    - id: analyzer
      options:
        - { id: read, text: '"prebuilt-read"' }
        - { id: docsearch, text: '"prebuilt-documentSearch"' }
        - { id: document, text: '"prebuilt-document"' }
    - id: text
      options:
        - { id: fields, text: fields }
        - { id: kind, text: kind }
        - { id: markdown, text: markdown }
    - id: page
      options:
        - { id: start, text: start_page_number }
        - { id: end, text: end_page_number }
        - { id: kind, text: kind }
answer:
  values: { analyzer: docsearch, text: markdown, page: start }
explanation:
  correct:
    en: |
      prebuilt-documentSearch is the prebuilt RAG analyzer that returns Markdown with figure descriptions and a summary, so no custom analyzer is needed. The Markdown is in the markdown property of the analysis content, and a document content object exposes start_page_number and end_page_number for its page range.
    fr: |
      prebuilt-documentSearch est l'analyseur RAG prédéfini qui renvoie du Markdown avec la description des figures et un résumé : aucun analyseur personnalisé n'est nécessaire. Le Markdown se trouve dans la propriété markdown du contenu de l'analyse, et un objet de contenu de document expose start_page_number et end_page_number pour sa plage de pages.
  options:
    analyzer: { en: "prebuilt-read returns OCR text without figure descriptions or a summary, and prebuilt-document is a base analyzer for custom analyzers.", fr: "prebuilt-read renvoie le texte de l'OCR sans description des figures ni résumé, et prebuilt-document est un analyseur de base pour les analyseurs personnalisés." }
    text: { en: "fields holds the values of a field schema, and kind indicates whether the content is a document or audiovisual content.", fr: "fields contient les valeurs d'un schéma de champs, et kind indique si le contenu est un document ou un contenu audiovisuel." }
    page: { en: "end_page_number is the last page of the content, not the first.", fr: "end_page_number est la dernière page du contenu, pas la première." }
references:
  - title: Azure AI Content Understanding client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-contentunderstanding-readme
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
