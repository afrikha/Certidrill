id: ai103-5b-file-search-data-control
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is creating a Foundry project for an HR agent. Employees will upload benefit documents, and the agent will answer questions about them by using the file search tool.

    A compliance policy requires that the uploaded files and the vector stores built from them stay in Azure resources that Proseware owns and controls.

    What should you use?
  fr: |
    Proseware, Inc. crée un projet Foundry pour un agent RH. Les employés chargeront des documents sur leurs avantages, et l'agent répondra à leurs questions à l'aide de l'outil file search.

    Une stratégie de conformité exige que les fichiers chargés et les magasins de vecteurs créés à partir de ces fichiers restent dans des ressources Azure que Proseware possède et contrôle.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The basic agent setup, with a project connection to a Proseware Azure Blob Storage account", fr: "La configuration d'agent de base, avec une connexion du projet à un compte Stockage Blob Azure de Proseware" } }
    - { id: b, text: { en: "The standard agent setup, with a connected Azure Blob Storage account and a connected Azure AI Search resource", fr: "La configuration d'agent standard, avec un compte Stockage Blob Azure connecté et une ressource Azure AI Search connectée" } }
    - { id: c, text: { en: "The basic agent setup, with conversation vector stores instead of an agent vector store", fr: "La configuration d'agent de base, avec des magasins de vecteurs de conversation au lieu d'un magasin de vecteurs d'agent" } }
    - { id: d, text: { en: "The basic agent setup, with each vector store file deleted after its conversation ends", fr: "La configuration d'agent de base, avec suppression de chaque fichier du magasin de vecteurs à la fin de sa conversation" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With the standard agent setup, file search stores files in your connected Azure Blob Storage account and builds vector stores in your connected Azure AI Search resource, so the data stays under your control. The code that creates vector stores and attaches them to the agent is the same in both setups.
    fr: |
      Avec la configuration d'agent standard, file search stocke les fichiers dans votre compte Stockage Blob Azure connecté et crée les magasins de vecteurs dans votre ressource Azure AI Search connectée : les données restent sous votre contrôle. Le code qui crée les magasins de vecteurs et les associe à l'agent est le même dans les deux configurations.
  options:
    a: { en: "In the basic setup, file search keeps files in Microsoft-managed storage and vector stores in a Microsoft-managed search resource, whatever connections the project has.", fr: "Dans la configuration de base, file search conserve les fichiers dans un stockage managé par Microsoft et les magasins de vecteurs dans une ressource de recherche managée par Microsoft, quelles que soient les connexions du projet." }
    c: { en: "Conversation vector stores are still Microsoft-managed in the basic setup; they only change the scope and the expiration of the store.", fr: "Les magasins de vecteurs de conversation restent managés par Microsoft dans la configuration de base ; ils ne changent que la portée et l'expiration du magasin." }
    d: { en: "Deleting files later doesn't change where they are stored while they are in use.", fr: "Supprimer les fichiers plus tard ne change pas l'endroit où ils sont stockés pendant leur utilisation." }
references:
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/file-search
