id: ai103-5b-search-tool-facts
objective: "5.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. adds the Azure AI Search tool to a prompt agent in Foundry Agent Service. The tool targets an index named support-kb through a project connection. Only `project_connection_id` and `index_name` are set on the tool.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. ajoute l'outil Azure AI Search à un agent d'invite de Foundry Agent Service. L'outil cible un index nommé support-kb via une connexion du projet. Seuls `project_connection_id` et `index_name` sont définis sur l'outil.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The tool returns five results for each query that the agent sends to support-kb.
        fr: L'outil renvoie cinq résultats pour chaque requête que l'agent envoie à support-kb.
    - id: s2
      text:
        en: The agent's responses include citations even if the agent's instructions don't mention citations.
        fr: Les réponses de l'agent incluent des citations même si les instructions de l'agent ne mentionnent pas les citations.
    - id: s3
      text:
        en: For a citation to include a link, support-kb must contain a retrievable field that holds the source URL.
        fr: Pour qu'une citation inclue un lien, support-kb doit contenir un champ récupérable qui contient l'URL source.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When `top_k` isn't set, the tool uses its default of 5 results, and `query_type` defaults to `vector_semantic_hybrid`. Citations appear only when the agent's instructions tell it to cite; without that, responses have no citations. The index needs a retrievable field with the source URL (and optionally a title) so that the `url_citation` annotations can link to the documents.
    fr: |
      Quand `top_k` n'est pas défini, l'outil utilise sa valeur par défaut de 5 résultats, et `query_type` vaut `vector_semantic_hybrid` par défaut. Les citations n'apparaissent que si les instructions de l'agent lui demandent de citer ses sources ; sinon, les réponses n'en contiennent pas. L'index a besoin d'un champ récupérable avec l'URL source (et éventuellement un titre) pour que les annotations `url_citation` puissent pointer vers les documents.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
