id: ai103-sr2-scanned-manuals-2
objective: "5.1.4"
type: series_yesno
series: ai103-sr2-scanned-manuals
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You enable image extraction and add OCR and Text Merge skills before the Text Split skill.
  fr: Vous activez l'extraction des images et ajoutez les compétences OCR et Text Merge avant la compétence Text Split.
body:
  solution:
    en: |
      You set `imageAction` to `generateNormalizedImages` in the indexer configuration. You add an OCR skill whose context and `image` input are `/document/normalized_images/*`, and a Text Merge skill that merges `/document/content` with `/document/normalized_images/*/text` at the offsets `/document/normalized_images/*/contentOffset` into `/document/merged_text`. You change the input of the Text Split skill to `/document/merged_text`, then reset and run manuals-indexer.
    fr: |
      Vous définissez `imageAction` sur `generateNormalizedImages` dans la configuration de l'indexeur. Vous ajoutez une compétence OCR dont le contexte et l'entrée `image` sont `/document/normalized_images/*`, ainsi qu'une compétence Text Merge qui fusionne `/document/content` avec `/document/normalized_images/*/text` aux positions `/document/normalized_images/*/contentOffset` dans `/document/merged_text`. Vous remplacez l'entrée de la compétence Text Split par `/document/merged_text`, puis vous réinitialisez et exécutez manuals-indexer.
answer: { value: true }
explanation:
  correct:
    en: With `generateNormalizedImages`, document cracking extracts the images of each PDF, here the scanned pages, into `/document/normalized_images`. The OCR skill reads their text, Text Merge inserts it into the document text, and Text Split now chunks the merged text, so each chunk carries the printed text and the embedding skill vectorizes it. Resetting the indexer makes it process the manuals it already indexed.
    fr: "Avec `generateNormalizedImages`, le craquage de documents extrait les images de chaque PDF, ici les pages numérisées, dans `/document/normalized_images`. La compétence OCR en lit le texte, Text Merge l'insère dans le texte du document, et Text Split découpe désormais le texte fusionné : chaque bloc contient le texte imprimé, que la compétence d'embedding vectorise. La réinitialisation de l'indexeur lui fait retraiter les manuels déjà indexés."
references:
  - title: Extract Text from Images by Using AI Enrichment
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios
