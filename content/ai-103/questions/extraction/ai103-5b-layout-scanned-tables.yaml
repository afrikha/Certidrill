id: ai103-5b-layout-scanned-tables
objective: "5.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys scans paper maintenance reports that contain paragraphs and tables of measurements. You need to extract the text and the table structure of each report by using Azure Content Understanding.

    The Foundry resource has no chat completion or embedding model deployments, and the solution must not require any.

    Which analyzer should you use?
  fr: |
    Tailspin Toys numérise des rapports de maintenance papier qui contiennent des paragraphes et des tableaux de mesures. Vous devez extraire le texte et la structure des tableaux de chaque rapport à l'aide d'Azure Content Understanding.

    La ressource Foundry n'a aucun déploiement de modèle de complétion de conversation ou d'incorporation, et la solution ne doit en exiger aucun.

    Quel analyseur devez-vous utiliser ?
body:
  options:
    - { id: a, text: prebuilt-read }
    - { id: b, text: prebuilt-documentSearch }
    - { id: c, text: prebuilt-layout }
    - { id: d, text: prebuilt-documentFields }
answer: { optionId: c }
explanation:
  correct:
    en: |
      prebuilt-layout returns words, paragraphs, tables and figures, plus sections and formatting, and it doesn't require a language model or an embedding model. It is the content extraction analyzer to use when tables must keep their structure.
    fr: |
      prebuilt-layout renvoie les mots, les paragraphes, les tableaux et les figures, ainsi que les sections et la mise en forme, et il ne nécessite ni modèle de langage ni modèle d'incorporation. C'est l'analyseur d'extraction de contenu à utiliser quand les tableaux doivent conserver leur structure.
  options:
    a: { en: "prebuilt-read also works without a model, but it performs basic OCR (words, paragraphs, formulas, barcodes) without layout analysis, so tables aren't returned as tables.", fr: "prebuilt-read fonctionne aussi sans modèle, mais il effectue une OCR de base (mots, paragraphes, formules, codes-barres) sans analyse de la disposition : les tableaux ne sont pas renvoyés comme des tableaux." }
    b: { en: "prebuilt-documentSearch produces summaries and figure descriptions, which use the generative model deployments that the resource doesn't have.", fr: "prebuilt-documentSearch produit des résumés et des descriptions de figures, ce qui utilise des déploiements de modèles génératifs dont la ressource ne dispose pas." }
    d: { en: "prebuilt-documentFields extracts key-value pairs; it isn't one of the analyzers that work without a language model.", fr: "prebuilt-documentFields extrait des paires clé-valeur ; ce n'est pas l'un des analyseurs qui fonctionnent sans modèle de langage." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
