id: ai103-5b-search-private-endpoint
objective: "5.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a Foundry project that uses the basic agent setup. Litware also has an Azure AI Search service named litware-search that contains an index named manuals-index. Public network access is disabled on litware-search, which is reachable only through a private endpoint in a Litware virtual network. The security team will not enable public access.

    You need an agent in Foundry Agent Service to ground its answers on manuals-index by using the Azure AI Search tool.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un projet Foundry qui utilise la configuration d'agent de base. Litware dispose aussi d'un service Azure AI Search nommé litware-search qui contient un index nommé manuals-index. L'accès réseau public est désactivé sur litware-search, qui n'est joignable que par un point de terminaison privé dans un réseau virtuel Litware. L'équipe de sécurité n'activera pas l'accès public.

    Un agent de Foundry Agent Service doit ancrer ses réponses sur manuals-index à l'aide de l'outil Azure AI Search.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the basic setup and change the project connection to litware-search to use an API key.", fr: "Conserver la configuration de base et modifier la connexion du projet à litware-search pour qu'elle utilise une clé API." } }
    - { id: b, text: { en: "Use a standard agent setup without virtual network injection, and connect to litware-search with keyless authentication.", fr: "Utiliser une configuration d'agent standard sans injection de réseau virtuel, et se connecter à litware-search avec l'authentification sans clé." } }
    - { id: c, text: { en: "Use a standard agent setup with virtual network injection, and connect to litware-search with keyless authentication.", fr: "Utiliser une configuration d'agent standard avec injection de réseau virtuel, et se connecter à litware-search avec l'authentification sans clé." } }
    - { id: d, text: { en: "Keep the basic setup and replace the Azure AI Search tool with a file search tool that targets manuals-index.", fr: "Conserver la configuration de base et remplacer l'outil Azure AI Search par un outil file search qui cible manuals-index." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Basic agent deployments don't support an Azure AI Search resource that has public network access disabled and a private endpoint; you need a standard agent setup with virtual network injection. On a private virtual network, the Azure AI Search tool must also use keyless (Microsoft Entra ID) authentication, because key-based authentication isn't supported there.
    fr: |
      Les déploiements d'agent de base ne prennent pas en charge une ressource Azure AI Search dont l'accès réseau public est désactivé et qui utilise un point de terminaison privé : il faut une configuration d'agent standard avec injection de réseau virtuel. Sur un réseau virtuel privé, l'outil Azure AI Search doit en outre utiliser l'authentification sans clé (Microsoft Entra ID), car l'authentification par clé n'y est pas prise en charge.
  options:
    a: { en: "Key-based authentication isn't supported with private virtual networking, and it doesn't remove the network limitation of the basic setup.", fr: "L'authentification par clé n'est pas prise en charge avec un réseau virtuel privé, et elle ne lève pas la limite réseau de la configuration de base." }
    b: { en: "Without virtual network injection, the tool can fail to connect to a search service that has a private endpoint, so keyless authentication alone isn't enough.", fr: "Sans injection de réseau virtuel, l'outil peut ne pas réussir à se connecter à un service de recherche doté d'un point de terminaison privé : l'authentification sans clé seule ne suffit pas." }
    d: { en: "File search uses its own vector store built from uploaded files; it doesn't query an existing Azure AI Search index.", fr: "File search utilise son propre magasin de vecteurs créé à partir de fichiers chargés ; il n'interroge pas un index Azure AI Search existant." }
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
