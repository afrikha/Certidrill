id: ai103-5b-cu-rag-flow
objective: "5.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has thousands of PDF policy documents that contain tables, charts and handwritten notes. You are building a grounded agent in Foundry Agent Service that answers questions about the policies and cites the file and page of each source.

    The Foundry resource has default chat completion and embedding deployments for Azure Content Understanding, and an Azure AI Search service is connected to the project.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. dispose de milliers de documents de stratégie PDF qui contiennent des tableaux, des graphiques et des notes manuscrites. Vous créez dans Foundry Agent Service un agent ancré qui répond aux questions sur les stratégies et cite le fichier et la page de chaque source.

    La ressource Foundry dispose de déploiements par défaut de complétion de conversation et d'incorporation pour Azure Content Understanding, et un service Azure AI Search est connecté au projet.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: analyze, text: { en: "Analyze each file with prebuilt-documentSearch to get layout-aware Markdown chunks.", fr: "Analyser chaque fichier avec prebuilt-documentSearch pour obtenir des blocs Markdown qui respectent la disposition." } }
    - { id: embed, text: { en: "Generate a vector for each chunk by using an embedding model deployment.", fr: "Générer un vecteur pour chaque bloc à l'aide d'un déploiement de modèle d'incorporation." } }
    - { id: index, text: { en: "Upload each chunk, its vector, its file name and its page number to an Azure AI Search index.", fr: "Charger chaque bloc, son vecteur, son nom de fichier et son numéro de page dans un index Azure AI Search." } }
    - { id: tool, text: { en: "Add the Azure AI Search tool for the index to the agent, and instruct the agent to cite its sources.", fr: "Ajouter à l'agent l'outil Azure AI Search pour l'index, et demander à l'agent de citer ses sources." } }
    - { id: finetune, text: { en: "Fine-tune the agent's chat model on the Markdown of the documents.", fr: "Affiner le modèle de conversation de l'agent sur le Markdown des documents." } }
    - { id: extractall, text: { en: "Create a custom analyzer that defines one extract field for each paragraph of the documents.", fr: "Créer un analyseur personnalisé qui définit un champ extract pour chaque paragraphe des documents." } }
answer:
  sequence: [ analyze, embed, index, tool ]
explanation:
  correct:
    en: |
      prebuilt-documentSearch turns each file into Markdown that keeps paragraphs, tables and figure descriptions, with chunked output ready for embedding. You embed the chunks, index them with metadata such as the file name and page so that answers can be cited, and then give the agent the Azure AI Search tool on that index with instructions to cite its sources.
    fr: |
      prebuilt-documentSearch transforme chaque fichier en Markdown qui conserve les paragraphes, les tableaux et les descriptions de figures, avec une sortie découpée en blocs prête pour l'incorporation. Vous vectorisez les blocs, vous les indexez avec des métadonnées comme le nom du fichier et la page pour que les réponses puissent être citées, puis vous donnez à l'agent l'outil Azure AI Search sur cet index avec des instructions lui demandant de citer ses sources.
  options:
    finetune: { en: "Fine-tuning changes the model's behavior, but it doesn't ground answers on retrievable passages or give citations.", fr: "L'affinage change le comportement du modèle, mais n'ancre pas les réponses sur des passages récupérables et ne fournit pas de citations." }
    extractall: { en: "Field schemas extract named values; the Markdown representation for RAG needs no field schema.", fr: "Les schémas de champs extraient des valeurs nommées ; la représentation Markdown pour le RAG ne nécessite aucun schéma de champs." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
