id: ai103-5a-exact-recall
objective: "5.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure AI Search index named **kb-index** whose vector field uses the `hnsw` algorithm. Before tuning the HNSW parameters, the team wants to measure the recall of the current configuration on a set of 200 test questions.

    You need to obtain the exact nearest neighbors of each test question to use as the ground truth. The solution must not modify kb-index.

    What should you do?
  fr: |
    Adatum dispose d'un index Azure AI Search nommé **kb-index** dont le champ vectoriel utilise l'algorithme `hnsw`. Avant d'ajuster les paramètres HNSW, l'équipe veut mesurer le rappel de la configuration actuelle sur un ensemble de 200 questions de test.

    Vous devez obtenir les plus proches voisins exacts de chaque question de test pour servir de vérité de référence. La solution ne doit pas modifier kb-index.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set exhaustive to true in each test vector query", fr: "Définir exhaustive sur true dans chaque requête vectorielle de test" } }
    - { id: b, text: { en: "Change the algorithm of the vector profile to exhaustiveKnn", fr: "Remplacer l'algorithme du profil vectoriel par exhaustiveKnn" } }
    - { id: c, text: { en: "Increase efSearch to 1000 in the hnsw parameters", fr: "Augmenter efSearch à 1000 dans les paramètres hnsw" } }
    - { id: d, text: { en: "Set k to 1000 in each test vector query", fr: "Définir k sur 1000 dans chaque requête vectorielle de test" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Fields indexed with HNSW also support an exhaustive search through the `exhaustive` query parameter: the query scans every vector and returns the exact k nearest neighbors. Building this ground truth to measure the recall of an approximate algorithm is a documented use of exhaustive KNN, and it requires no change to the index.
    fr: |
      Les champs indexés avec HNSW prennent aussi en charge une recherche exhaustive grâce au paramètre de requête `exhaustive` : la requête parcourt tous les vecteurs et renvoie les k plus proches voisins exacts. Construire cette vérité de référence pour mesurer le rappel d'un algorithme approximatif est un usage documenté du KNN exhaustif, et cela ne nécessite aucune modification de l'index.
  options:
    b:
      en: |
        Changing the algorithm modifies kb-index, and an exhaustiveKnn field no longer supports the HNSW queries you want to measure.
      fr: |
        Changer d'algorithme modifie kb-index, et un champ exhaustiveKnn ne prend plus en charge les requêtes HNSW que vous voulez mesurer.
    c:
      en: |
        efSearch is an index setting, and a higher value still returns approximate neighbors.
      fr: |
        efSearch est un paramètre de l'index, et une valeur plus élevée renvoie toujours des voisins approximatifs.
    d:
      en: |
        A larger k returns more approximate neighbors, not the exact ones.
      fr: |
        Un k plus grand renvoie davantage de voisins approximatifs, pas les voisins exacts.
references:
  - title: Relevance in vector search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-ranking
