id: ai103-5b-kb-mcp-tool
objective: "5.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a Foundry IQ knowledge base named hr-kb on an Azure AI Search service. hr-kb has one search index knowledge source named hr-policies-ks and no chat model, so it uses minimal retrieval reasoning effort.

    An Azure Functions app answers HR tickets. One step of its workflow must retrieve grounding content from hr-kb by using the GA REST API version 2026-10-01, then add that content to the prompt of a chat model. The function authenticates with its managed identity, and `question` contains the text of the ticket.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'une base de connaissances Foundry IQ nommée hr-kb sur un service Azure AI Search. hr-kb a une source de connaissances d'index de recherche nommée hr-policies-ks et aucun modèle de conversation : elle utilise l'effort de raisonnement de récupération minimal.

    Une application Azure Functions répond aux tickets RH. Une étape de son flux de travail doit récupérer du contenu d'ancrage dans hr-kb à l'aide de la version GA 2026-10-01 de l'API REST, puis ajouter ce contenu à l'invite d'un modèle de conversation. La fonction s'authentifie avec son identité managée, et `question` contient le texte du ticket.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    kb_client = [[client]](
        endpoint=search_endpoint,
        credential=DefaultAzureCredential(),
        api_version="2026-10-01",
        knowledge_base_name="hr-kb",
    )

    request = KnowledgeBaseRetrievalRequest(
        [[input]],
        retrieval_reasoning_effort=KnowledgeRetrievalMinimalReasoningEffort(),
        output_mode="extractiveData",
        knowledge_source_params=[
            SearchIndexKnowledgeSourceParams(knowledge_source_name="hr-policies-ks")
        ],
    )
    result = kb_client.retrieve(request)

    grounding = "\n".join(
        content.text for message in result.[[field]] for content in message.content
    )
  slots:
    - id: client
      options:
        - { id: search, text: SearchClient }
        - { id: kbclient, text: KnowledgeBaseRetrievalClient }
        - { id: indexclient, text: SearchIndexClient }
    - id: input
      options:
        - { id: messages, text: 'messages=[KnowledgeBaseMessage(role="user", content=[KnowledgeBaseMessageTextContent(text=question)])]' }
        - { id: vector, text: 'vector_queries=[VectorizableTextQuery(text=question, fields="contentVector")]' }
        - { id: intents, text: 'intents=[KnowledgeRetrievalSemanticIntent(search=question)]' }
    - id: field
      options:
        - { id: references, text: references }
        - { id: activity, text: activity }
        - { id: response, text: response }
answer:
  values: { client: kbclient, input: intents, field: response }
explanation:
  correct:
    en: |
      `KnowledgeBaseRetrievalClient` calls the retrieve action of a knowledge base, here with the 2026-10-01 GA API. Minimal retrieval runs without a chat model and rejects `messages`, so the request passes the question as a semantic intent. The grounding content is in `response`: chat-style messages whose text content holds the retrieved documents, each with a reference ID for citations.
    fr: |
      `KnowledgeBaseRetrievalClient` appelle l'action retrieve d'une base de connaissances, ici avec l'API GA 2026-10-01. La récupération minimale s'exécute sans modèle de conversation et rejette `messages` : la requête transmet donc la question comme intention sémantique. Le contenu d'ancrage se trouve dans `response` : des messages de type conversation dont le contenu texte contient les documents récupérés, chacun avec un ID de référence pour les citations.
  options:
    client:
      en: |
        `SearchClient` queries one index directly, without the knowledge base, and `SearchIndexClient` manages indexes; neither has a retrieve action for hr-kb.
      fr: |
        `SearchClient` interroge directement un index, sans la base de connaissances, et `SearchIndexClient` gère les index ; aucun des deux n'a d'action retrieve pour hr-kb.
    input:
      en: |
        Messages require low or medium reasoning effort with a chat model; minimal retrieval rejects them. `vector_queries` is a parameter of `SearchClient.search`, not of a knowledge base retrieval request.
      fr: |
        Les messages exigent un effort de raisonnement faible ou moyen avec un modèle de conversation ; la récupération minimale les rejette. `vector_queries` est un paramètre de `SearchClient.search`, pas d'une requête de récupération d'une base de connaissances.
    field:
      en: |
        `references` lists the source documents (document key, source data, citation URL) and `activity` holds the diagnostics of each step; neither is the grounding text to add to the prompt.
      fr: |
        `references` liste les documents sources (clé de document, données sources, URL de citation) et `activity` contient les diagnostics de chaque étape ; aucun des deux n'est le texte d'ancrage à ajouter à l'invite.
references:
  - title: Query Knowledge Base via API or MCP
    url: https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-how-to-retrieve
