id: ai103-5b-loan-bundle-classifier
objective: "5.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank receives loan applications as single PDF files. Each file bundles several multi-page documents, including US pay stubs and US bank statements, and sometimes unrelated pages such as cover letters.

    You are defining an Azure Content Understanding analyzer that meets the following requirements:

    - Each document in a file is identified and processed separately.
    - Bank statements are processed by a prebuilt analyzer without a schema that you write.
    - Pages that match no defined category aren't forced into one.

    How should you complete the analyzer definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank reçoit les demandes de prêt sous forme de fichiers PDF uniques. Chaque fichier regroupe plusieurs documents de plusieurs pages, notamment des bulletins de paie américains et des relevés bancaires américains, et parfois des pages sans rapport comme des lettres d'accompagnement.

    Vous définissez un analyseur Azure Content Understanding qui satisfait les exigences suivantes :

    - Chaque document d'un fichier est identifié et traité séparément.
    - Les relevés bancaires sont traités par un analyseur prédéfini sans schéma à écrire.
    - Les pages qui ne correspondent à aucune catégorie définie ne sont pas forcées dans l'une d'elles.

    Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "analyzerId": "woodgroveLoanSplitter",
      "baseAnalyzerId": "prebuilt-document",
      "config": {
        "[[split]]": true,
        "contentCategories": {
          "payStub": { "description": "Employee pay statement", "analyzerId": "prebuilt-payStub.us" },
          "bankStatement": { "description": "Monthly bank account statement", "analyzerId": "[[bank]]" },
          "[[rest]]": { "description": "Any page that matches no other category" }
        }
      }
    }
  slots:
    - id: split
      options:
        - { id: segment, text: enableSegment }
        - { id: perpage, text: segmentPerPage }
        - { id: omit, text: omitContent }
    - id: bank
      options:
        - { id: layout, text: prebuilt-layout }
        - { id: schema, text: prebuilt-documentFieldSchema }
        - { id: bank, text: prebuilt-bankStatement.us }
    - id: rest
      options:
        - { id: default, text: default }
        - { id: other, text: other }
        - { id: unknown, text: unknown }
answer:
  values: { split: segment, bank: bank, rest: other }
explanation:
  correct:
    en: |
      With enableSegment set to true, the service treats the file as several documents combined together and returns a category for each segment; each category's analyzerId then processes its segments. prebuilt-bankStatement.us extracts bank statement fields without a custom schema. Since the GA version, you include a category named other so that content matching none of your categories isn't forced into one of them.
    fr: |
      Avec enableSegment défini sur true, le service traite le fichier comme plusieurs documents assemblés et renvoie une catégorie pour chaque segment ; l'analyzerId de chaque catégorie traite ensuite ses segments. prebuilt-bankStatement.us extrait les champs des relevés bancaires sans schéma personnalisé. Depuis la version GA, vous incluez une catégorie nommée other pour que le contenu qui ne correspond à aucune de vos catégories ne soit pas forcé dans l'une d'elles.
  options:
    split: { en: "segmentPerPage forces one segment per page, which would split each multi-page document; omitContent only removes the content object from the response.", fr: "segmentPerPage force un segment par page, ce qui découperait chaque document de plusieurs pages ; omitContent ne fait que supprimer l'objet de contenu de la réponse." }
    bank: { en: "prebuilt-layout returns structure without named fields, and prebuilt-documentFieldSchema proposes a schema instead of extracting the statement fields.", fr: "prebuilt-layout renvoie la structure sans champs nommés, et prebuilt-documentFieldSchema propose un schéma au lieu d'extraire les champs du relevé." }
    rest: { en: "Only the category named other has this role; a category with another name is just one more category that pages can be forced into.", fr: "Seule la catégorie nommée other joue ce rôle ; une catégorie portant un autre nom n'est qu'une catégorie de plus dans laquelle des pages peuvent être forcées." }
references:
  - title: Azure Content Understanding in Foundry Tools Classifier Overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/classifier
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
