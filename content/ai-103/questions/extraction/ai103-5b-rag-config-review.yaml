id: ai103-5b-rag-config-review
objective: "5.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation indexes annual reports for a finance agent. A custom Azure Content Understanding analyzer derived from prebuilt-document produces the Markdown that is chunked and indexed. Its configuration is shown in the following table.

    Testing reveals two problems:

    - The chunks contain the financial tables as HTML, and the chunking code expects Markdown tables.
    - The agent describes each chart in general terms but can't answer questions about the values that the charts plot.

    Which setting must you change to fix each problem? To answer, select the appropriate setting value in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation indexe des rapports annuels pour un agent financier. Un analyseur Azure Content Understanding personnalisé dérivé de prebuilt-document produit le Markdown qui est découpé en blocs et indexé. Sa configuration figure dans le tableau suivant.

    Les tests révèlent deux problèmes :

    - Les blocs contiennent les tableaux financiers au format HTML, et le code de découpage attend des tableaux Markdown.
    - L'agent décrit chaque graphique en termes généraux, mais ne peut pas répondre aux questions sur les valeurs que les graphiques représentent.

    Quel paramètre devez-vous modifier pour corriger chaque problème ? Pour répondre, sélectionnez la valeur de paramètre appropriée dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Tables must be returned as Markdown tables.", fr: "Les tableaux doivent être renvoyés sous forme de tableaux Markdown." }
    - id: p2
      text: { en: "The agent must answer questions about the values that the charts plot.", fr: "L'agent doit répondre aux questions sur les valeurs que les graphiques représentent." }
  grid:
    header: [{ en: Setting, fr: Paramètre }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: returnDetails }, { text: "false", area: details }]
      - [{ text: enableOcr }, { text: "true", area: ocr }]
      - [{ text: enableLayout }, { text: "true", area: layout }]
      - [{ text: tableFormat }, { text: '"html"', area: table }]
      - [{ text: enableFigureDescription }, { text: "true", area: figdesc }]
      - [{ text: enableFigureAnalysis }, { text: "false", area: figanalysis }]
      - [{ text: omitContent }, { text: "false", area: omit }]
answer:
  values: { p1: table, p2: figanalysis }
explanation:
  correct:
    en: |
      tableFormat controls how extracted tables appear in the Markdown: "html" is the default, and "markdown" returns Markdown tables. Figure descriptions are already enabled, which explains the general descriptions of the charts; enableFigureAnalysis adds the chart data (in chart.js syntax) and diagram components, which lets the agent answer questions about the plotted values.
    fr: |
      tableFormat détermine la façon dont les tableaux extraits apparaissent dans le Markdown : "html" est la valeur par défaut, et "markdown" renvoie des tableaux Markdown. Les descriptions de figures sont déjà activées, ce qui explique les descriptions générales des graphiques ; enableFigureAnalysis ajoute les données des graphiques (en syntaxe chart.js) et les composants des diagrammes, ce qui permet à l'agent de répondre aux questions sur les valeurs représentées.
  options:
    details: { en: "returnDetails adds confidence, bounding boxes and spans; it doesn't change the table format or extract chart data.", fr: "returnDetails ajoute la confiance, les cadres englobants et les étendues ; il ne change ni le format des tableaux ni l'extraction des données des graphiques." }
    figdesc: { en: "Figure descriptions are already on and produce the general descriptions that the agent gives.", fr: "Les descriptions de figures sont déjà activées et produisent les descriptions générales que donne l'agent." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
