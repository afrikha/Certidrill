id: ai103-cs1a-policy-search
objective: "5.1.2"
type: single
caseStudy: ai103-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the queries that the Azure AI Search tool of claims-assistant sends to the policy-wording index. The solution must meet the policy search requirement. Which query configuration should you use?
  fr: |
    Vous devez configurer les requêtes que l'outil Azure AI Search de claims-assistant envoie à l'index policy-wording. La solution doit satisfaire l'exigence de recherche dans les contrats. Quelle configuration de requête devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A vector query on the vector fields, with k set to 50", fr: "Une requête vectorielle sur les champs vectoriels, avec k défini sur 50" } }
    - { id: b, text: { en: "A full-text query on the text fields, with semantic ranking", fr: "Une requête en texte intégral sur les champs texte, avec le classement sémantique" } }
    - { id: c, text: { en: "A hybrid query on the text and vector fields, with semantic ranking", fr: "Une requête hybride sur les champs texte et vectoriels, avec le classement sémantique" } }
    - { id: d, text: { en: "A hybrid query on the text and vector fields, without semantic ranking", fr: "Une requête hybride sur les champs texte et vectoriels, sans le classement sémantique" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A hybrid query runs full-text and vector queries in parallel and merges them with Reciprocal Rank Fusion (RRF). The full-text side matches exact clause codes such as EXC-14, and the vector side matches questions worded differently from the policy text. Semantic ranking then reranks the top results so that the most relevant passages come first.
    fr: |
      Une requête hybride exécute en parallèle une requête en texte intégral et une requête vectorielle, puis fusionne les résultats par Reciprocal Rank Fusion (RRF). La partie texte intégral trouve les codes de clause exacts comme EXC-14, et la partie vectorielle trouve les questions formulées différemment du texte des contrats. Le classement sémantique reclasse ensuite les meilleurs résultats pour que les passages les plus pertinents arrivent en premier.
  options:
    a:
      en: |
        A vector query finds conceptually similar content but is weak on exact identifiers such as clause codes.
      fr: |
        Une requête vectorielle trouve du contenu conceptuellement similaire, mais elle est faible sur les identifiants exacts comme les codes de clause.
    b:
      en: |
        A full-text query matches clause codes, but it misses passages whose wording differs from the question, and semantic ranking only reranks the results that were retrieved.
      fr: |
        Une requête en texte intégral trouve les codes de clause, mais elle manque les passages dont la formulation diffère de la question, et le classement sémantique ne fait que reclasser les résultats récupérés.
    d:
      en: |
        Hybrid retrieval meets the matching needs, but without semantic ranking the results keep their RRF order and are not reranked by meaning.
      fr: |
        La récupération hybride répond aux besoins de correspondance, mais sans le classement sémantique, les résultats gardent leur ordre RRF et ne sont pas reclassés selon leur sens.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
