id: ai103-5a-free-limit-timeout
objective: "5.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs an indexer that applies the OCR skill to 300 scanned warranty cards. No Foundry resource is referenced in the skillset.

    After the run, the first 20 cards contain OCR text in the index. For the other cards, the execution history of the indexer shows a "Time Out" message for the OCR skill.

    You need all the cards to be processed by the OCR skill on every run. What should you do?
  fr: |
    Tailspin Toys exécute un indexeur qui applique la compétence OCR à 300 cartes de garantie numérisées. Aucune ressource Foundry n'est référencée dans l'ensemble de compétences.

    Après l'exécution, les 20 premières cartes contiennent du texte OCR dans l'index. Pour les autres cartes, l'historique d'exécution de l'indexeur affiche un message « Time Out » pour la compétence OCR.

    Toutes les cartes doivent être traitées par la compétence OCR à chaque exécution. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Scale the search service to a higher pricing tier", fr: "Faire passer le service de recherche à un niveau tarifaire supérieur" } }
    - { id: b, text: { en: "Attach a billable Foundry resource to the skillset", fr: "Attacher une ressource Foundry facturable à l'ensemble de compétences" } }
    - { id: c, text: { en: "Set imageAction to generateNormalizedImagePerPage", fr: "Définir imageAction sur generateNormalizedImagePerPage" } }
    - { id: d, text: { en: "Add replicas to the search service", fr: "Ajouter des réplicas au service de recherche" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Without an attached Foundry resource, built-in skills such as OCR run free for 20 transactions per indexer per day. Beyond that limit, billable skill execution stops and the execution history shows a "Time Out" message. Attaching a billable Foundry resource in the `cognitiveServices` property of the skillset removes the limit; the extra transactions are billed at the Foundry Tools Standard price.
    fr: |
      Sans ressource Foundry attachée, les compétences intégrées comme OCR s'exécutent gratuitement pour 20 transactions par indexeur et par jour. Au-delà de cette limite, l'exécution des compétences facturables s'arrête et l'historique d'exécution affiche un message « Time Out ». Attacher une ressource Foundry facturable dans la propriété `cognitiveServices` de l'ensemble de compétences lève cette limite ; les transactions supplémentaires sont facturées au prix Standard de Foundry Tools.
  options:
    a:
      en: |
        The free limit applies to the skill transactions, whatever the tier of the search service.
      fr: |
        La limite gratuite s'applique aux transactions des compétences, quel que soit le niveau du service de recherche.
    c:
      en: |
        Changing how images are generated does not change the number of free OCR transactions.
      fr: |
        Modifier la façon dont les images sont générées ne change pas le nombre de transactions OCR gratuites.
    d:
      en: |
        Replicas add indexer concurrency and query capacity; they do not lift the free enrichment limit.
      fr: |
        Les réplicas augmentent la simultanéité des indexeurs et la capacité de requête ; ils ne lèvent pas la limite d'enrichissement gratuit.
references:
  - title: Attach a billable resource to a skillset in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services
