id: ai103-5a-text-query-vectorizer
objective: "5.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has an Azure AI Search index named **faq-index**. A skillset fills the `contentVector` field by using an Azure OpenAI Embedding skill that calls a deployment named **embed-small** (`text-embedding-3-small`). The index has a vector profile named `vp-1` that `contentVector` uses, and no vectorizer.

    A Python workflow must send vector queries of kind `text` that contain only the user's question, without calling an embedding model itself.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un index Azure AI Search nommé **faq-index**. Un ensemble de compétences remplit le champ `contentVector` à l'aide d'une compétence Azure OpenAI Embedding qui appelle un déploiement nommé **embed-small** (`text-embedding-3-small`). L'index possède un profil vectoriel nommé `vp-1`, utilisé par `contentVector`, et aucun vectoriseur.

    Un flux de travail Python doit envoyer des requêtes vectorielles de type `text` qui ne contiennent que la question de l'utilisateur, sans appeler lui-même un modèle d'embedding.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add to the index an azureOpenAI vectorizer that targets the embed-small deployment.", fr: "Ajouter à l'index un vectoriseur azureOpenAI qui cible le déploiement embed-small." } }
    - { id: b, text: { en: "Add to the index an azureOpenAI vectorizer that targets a text-embedding-3-large deployment.", fr: "Ajouter à l'index un vectoriseur azureOpenAI qui cible un déploiement text-embedding-3-large." } }
    - { id: c, text: { en: "Reference the vectorizer in the vp-1 vector profile.", fr: "Référencer le vectoriseur dans le profil vectoriel vp-1." } }
    - { id: d, text: { en: "Reference the vectorizer in the semantic configuration of the index.", fr: "Référencer le vectoriseur dans la configuration sémantique de l'index." } }
    - { id: e, text: { en: "Add a second Azure OpenAI Embedding skill to the skillset for the queries.", fr: "Ajouter une seconde compétence Azure OpenAI Embedding à l'ensemble de compétences pour les requêtes." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      A vectorizer converts query text to a vector at query time. It is defined in the index and assigned to vector fields through a vector profile, so you add the vectorizer and reference it in `vp-1`. It must call the same embedding model as the skill that produced the indexed vectors, here the embed-small deployment.
    fr: |
      Un vectoriseur convertit le texte de la requête en vecteur au moment de la requête. Il est défini dans l'index et attribué aux champs vectoriels par l'intermédiaire d'un profil vectoriel : vous ajoutez donc le vectoriseur et vous le référencez dans `vp-1`. Il doit appeler le même modèle d'embedding que la compétence qui a produit les vecteurs indexés, ici le déploiement embed-small.
  options:
    b:
      en: |
        Query vectors from a different model are not comparable with the indexed vectors, and text-embedding-3-large does not even produce the same number of dimensions by default.
      fr: |
        Les vecteurs de requête produits par un autre modèle ne sont pas comparables aux vecteurs indexés, et text-embedding-3-large ne produit même pas le même nombre de dimensions par défaut.
    d:
      en: |
        The semantic configuration lists text fields for the semantic ranker; vectorizers are assigned through vector profiles.
      fr: |
        La configuration sémantique liste des champs texte pour le classeur sémantique ; les vectoriseurs sont attribués par les profils vectoriels.
    e:
      en: |
        Skills run only during indexing; they never vectorize queries.
      fr: |
        Les compétences ne s'exécutent que pendant l'indexation ; elles ne vectorisent jamais les requêtes.
references:
  - title: Configure a vectorizer in a search index
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-configure-vectorizer
