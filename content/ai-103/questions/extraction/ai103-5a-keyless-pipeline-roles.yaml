id: ai103-5a-keyless-pipeline-roles
objective: "5.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso is building a RAG ingestion pipeline in an Azure AI Search service named **srch-contoso** that has a system-assigned managed identity. The indexer reads PDF files from a storage account named **stdocs**, and an Azure OpenAI Embedding skill calls an embedding deployment in an Azure OpenAI resource named **aoai-contoso**. Neither connection uses keys.

    You need to assign roles to the managed identity of srch-contoso. The solution must follow the principle of least privilege.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un pipeline d'ingestion RAG dans un service Azure AI Search nommé **srch-contoso** doté d'une identité managée affectée par le système. L'indexeur lit des fichiers PDF dans un compte de stockage nommé **stdocs**, et une compétence Azure OpenAI Embedding appelle un déploiement d'embedding d'une ressource Azure OpenAI nommée **aoai-contoso**. Aucune des deux connexions n'utilise de clé.

    Vous devez attribuer des rôles à l'identité managée de srch-contoso. La solution doit respecter le principe du moindre privilège.

    Quelles sont les deux attributions de rôle à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Storage Blob Data Contributor on stdocs", fr: "Storage Blob Data Contributor sur stdocs" } }
    - { id: b, text: { en: "Storage Blob Data Reader on stdocs", fr: "Storage Blob Data Reader sur stdocs" } }
    - { id: c, text: { en: "Cognitive Services OpenAI User on aoai-contoso", fr: "Cognitive Services OpenAI User sur aoai-contoso" } }
    - { id: d, text: { en: "Cognitive Services OpenAI Contributor on aoai-contoso", fr: "Cognitive Services OpenAI Contributor sur aoai-contoso" } }
    - { id: e, text: { en: "Search Index Data Contributor on srch-contoso", fr: "Search Index Data Contributor sur srch-contoso" } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: |
      The indexer only reads the blobs, so the search service identity needs Storage Blob Data Reader on the storage account. The embedding skill authenticates with the same identity and needs Cognitive Services OpenAI User on the Azure OpenAI resource; Learn advises against broader roles.
    fr: |
      L'indexeur se contente de lire les objets blob : l'identité du service de recherche a besoin de Storage Blob Data Reader sur le compte de stockage. La compétence d'embedding s'authentifie avec la même identité et a besoin de Cognitive Services OpenAI User sur la ressource Azure OpenAI ; Learn déconseille les rôles plus larges.
  options:
    a:
      en: |
        Storage Blob Data Contributor also grants write and delete access, which the indexer does not need.
      fr: |
        Storage Blob Data Contributor accorde aussi l'écriture et la suppression, dont l'indexeur n'a pas besoin.
    d:
      en: |
        Cognitive Services OpenAI Contributor adds management permissions beyond calling the deployment.
      fr: |
        Cognitive Services OpenAI Contributor ajoute des autorisations de gestion au-delà de l'appel du déploiement.
    e:
      en: |
        The indexer writes to its own index without a role assignment; this role is for clients that load documents.
      fr: |
        L'indexeur écrit dans son propre index sans attribution de rôle ; ce rôle est destiné aux clients qui chargent des documents.
references:
  - title: "Quickstart: Vector search in the Azure portal"
    url: https://learn.microsoft.com/en-us/azure/search/search-get-started-portal-import-vectors
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
