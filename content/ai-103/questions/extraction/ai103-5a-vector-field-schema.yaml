id: ai103-5a-vector-field-schema
objective: "5.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso is creating an Azure AI Search index named **policies-index** for a RAG application. An Azure OpenAI Embedding skill uses a `text-embedding-3-small` deployment and does not set the `dimensions` parameter.

    The index must meet the following requirements:

    - The application can filter results on the `category` field.
    - The `contentVector` field stores the vectors produced by the embedding skill.

    How should you complete the index definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un index Azure AI Search nommé **policies-index** pour une application RAG. Une compétence Azure OpenAI Embedding utilise un déploiement `text-embedding-3-small` et ne définit pas le paramètre `dimensions`.

    L'index doit satisfaire les exigences suivantes :

    - l'application peut filtrer les résultats sur le champ `category` ;
    - le champ `contentVector` stocke les vecteurs produits par la compétence d'embedding.

    Comment devez-vous compléter la définition de l'index ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "fields": [
      { "name": "id", "type": "[[keytype]]", "key": true },
      { "name": "content", "type": "Edm.String", "searchable": true },
      { "name": "category", "type": "Edm.String", "[[attr]]": true },
      {
        "name": "contentVector",
        "type": "[[vtype]]",
        "searchable": true,
        "dimensions": [[dims]],
        "vectorSearchProfile": "vp-hnsw"
      }
    ]
  slots:
    - id: keytype
      options:
        - { id: str, text: "Edm.String" }
        - { id: int, text: "Edm.Int64" }
        - { id: col, text: "Collection(Edm.String)" }
    - id: attr
      options:
        - { id: filt, text: filterable }
        - { id: facet, text: facetable }
        - { id: sort, text: sortable }
        - { id: retr, text: retrievable }
    - id: vtype
      options:
        - { id: single, text: "Collection(Edm.Single)" }
        - { id: double, text: "Collection(Edm.Double)" }
        - { id: string, text: "Collection(Edm.String)" }
    - id: dims
      options:
        - { id: d768, text: "768" }
        - { id: d1024, text: "1024" }
        - { id: d1536, text: "1536" }
        - { id: d3072, text: "3072" }
answer:
  values: { keytype: str, attr: filt, vtype: single, dims: d1536 }
explanation:
  correct:
    en: |
      The document key of an Azure AI Search index is an `Edm.String` field. A field must be `filterable` to be used in a `filter` expression. Embeddings are stored in a `Collection(Edm.Single)` vector field whose `dimensions` match the model output; without the `dimensions` parameter, the skill returns the model maximum, which is 1,536 for `text-embedding-3-small`.
    fr: |
      La clé de document d'un index Azure AI Search est un champ `Edm.String`. Un champ doit être `filterable` pour être utilisé dans une expression `filter`. Les embeddings sont stockés dans un champ vectoriel `Collection(Edm.Single)` dont `dimensions` correspond à la sortie du modèle ; sans le paramètre `dimensions`, la compétence renvoie le maximum du modèle, soit 1 536 pour `text-embedding-3-small`.
  options:
    int: { en: "A key field must be a string; numeric types cannot be the document key.", fr: "Un champ de clé doit être une chaîne ; les types numériques ne peuvent pas être la clé du document." }
    facet: { en: "facetable enables facet counts, not filter expressions.", fr: "facetable active le comptage des facettes, pas les expressions de filtre." }
    double: { en: "Collection(Edm.Double) is not a vector type; embedding models use Collection(Edm.Single).", fr: "Collection(Edm.Double) n'est pas un type vectoriel ; les modèles d'embedding utilisent Collection(Edm.Single)." }
    d3072: { en: "3,072 is the maximum of text-embedding-3-large, not of text-embedding-3-small.", fr: "3 072 est le maximum de text-embedding-3-large, pas de text-embedding-3-small." }
references:
  - title: Create a vector index in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-create-index
  - title: Azure OpenAI Embedding skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-azure-openai-embedding
