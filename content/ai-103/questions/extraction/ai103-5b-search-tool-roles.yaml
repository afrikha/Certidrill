id: ai103-5b-search-tool-roles
objective: "5.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Foundry resource named ai-tailspin that contains a project, and an Azure AI Search service named srch-tailspin. You are adding the Azure AI Search tool to an agent in the project.

    Security policy forbids API keys. The project connection to srch-tailspin will use the system-assigned managed identity of ai-tailspin.

    Which two roles should you assign to the managed identity on srch-tailspin? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une ressource Foundry nommée ai-tailspin qui contient un projet, et d'un service Azure AI Search nommé srch-tailspin. Vous ajoutez l'outil Azure AI Search à un agent du projet.

    La stratégie de sécurité interdit les clés API. La connexion du projet à srch-tailspin utilisera l'identité managée affectée par le système d'ai-tailspin.

    Quels sont les deux rôles à attribuer à l'identité managée sur srch-tailspin ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Search Index Data Reader }
    - { id: b, text: Search Index Data Contributor }
    - { id: c, text: Cognitive Services OpenAI User }
    - { id: d, text: Search Service Contributor }
    - { id: e, text: Storage Blob Data Reader }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      For keyless access from the Azure AI Search tool, the documentation has you assign Search Index Data Contributor and Search Service Contributor on the search service to the managed identity of the Foundry resource that contains the project. The project connection then uses Microsoft Entra ID instead of an API key.
    fr: |
      Pour un accès sans clé depuis l'outil Azure AI Search, la documentation fait attribuer les rôles Search Index Data Contributor et Search Service Contributor sur le service de recherche à l'identité managée de la ressource Foundry qui contient le projet. La connexion du projet utilise alors Microsoft Entra ID au lieu d'une clé API.
  options:
    a: { en: "Search Index Data Reader is the role for an application that queries an index; it isn't the role pair that the tool's keyless setup requires.", fr: "Search Index Data Reader est le rôle d'une application qui interroge un index ; ce n'est pas la paire de rôles que demande la configuration sans clé de l'outil." }
    c: { en: "Cognitive Services OpenAI User lets a caller use Azure OpenAI deployments; it grants nothing on the search service.", fr: "Cognitive Services OpenAI User permet à un appelant d'utiliser des déploiements Azure OpenAI ; il n'accorde rien sur le service de recherche." }
    e: { en: "Storage Blob Data Reader applies to Azure Storage, for example an indexer that reads blobs; the tool queries the index, not the storage account.", fr: "Storage Blob Data Reader s'applique au Stockage Azure, par exemple à un indexeur qui lit des objets blob ; l'outil interroge l'index, pas le compte de stockage." }
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
