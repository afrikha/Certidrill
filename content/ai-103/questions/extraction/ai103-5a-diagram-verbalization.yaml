id: ai103-5a-diagram-verbalization
objective: "5.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso Manufacturing indexes PDF maintenance manuals into Azure AI Search for a Foundry agent. Many procedures are explained only by flowcharts and wiring diagrams embedded in the manuals, and those images contain few words.

    The agent must answer questions whose answer is in a diagram and cite a text passage that explains the diagram. The indexer already extracts the embedded images.

    What should you add to the skillset?
  fr: |
    Contoso Manufacturing indexe des manuels de maintenance PDF dans Azure AI Search pour un agent Foundry. De nombreuses procédures ne sont expliquées que par des logigrammes et des schémas de câblage incorporés aux manuels, et ces images contiennent peu de mots.

    L'agent doit répondre aux questions dont la réponse se trouve dans un schéma et citer un passage de texte qui explique le schéma. L'indexeur extrait déjà les images incorporées.

    Que devez-vous ajouter à l'ensemble de compétences ?
body:
  options:
    - { id: a, text: { en: "The Azure Vision multimodal embeddings skill, to embed each image in the same vector space as the text", fr: "La compétence Azure Vision multimodal embeddings, pour placer chaque image dans le même espace vectoriel que le texte" } }
    - { id: b, text: { en: "The OCR skill, to extract the words of each image and merge them into the content", fr: "La compétence OCR, pour extraire les mots de chaque image et les fusionner dans le contenu" } }
    - { id: c, text: { en: "The GenAI Prompt skill, to describe each image and embed the description with the text", fr: "La compétence GenAI Prompt, pour décrire chaque image et intégrer la description au texte avant l'embedding" } }
    - { id: d, text: { en: "The Document Extraction skill, to extract the images and the page text again", fr: "La compétence Document Extraction, pour extraire de nouveau les images et le texte des pages" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Image verbalization fits diagrams and flowcharts: the GenAI Prompt skill sends each normalized image to a multimodal chat model that writes a natural-language description, which is then embedded with the surrounding text. The description is searchable by hybrid queries and gives the agent a citable passage, at the cost of one model call per image.
    fr: |
      La verbalisation d'images convient aux schémas et aux logigrammes : la compétence GenAI Prompt envoie chaque image normalisée à un modèle de conversation multimodal qui rédige une description en langage naturel, intégrée ensuite au texte environnant avant l'embedding. La description est recherchable par des requêtes hybrides et fournit à l'agent un passage citable, au prix d'un appel de modèle par image.
  options:
    a:
      en: |
        Multimodal embeddings make images findable by similarity, but the vectors do not explain the diagram and give the agent no text to cite.
      fr: |
        Les embeddings multimodaux rendent les images trouvables par similarité, mais les vecteurs n'expliquent pas le schéma et ne donnent à l'agent aucun texte à citer.
    b:
      en: |
        The diagrams contain few words, so OCR captures labels but not the meaning of the procedure.
      fr: |
        Les schémas contiennent peu de mots : l'OCR capture les libellés, mais pas le sens de la procédure.
    d:
      en: |
        The indexer already extracts the images; extracting them again produces no description.
      fr: |
        L'indexeur extrait déjà les images ; les extraire de nouveau ne produit aucune description.
references:
  - title: Multimodal search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/multimodal-search-overview
  - title: GenAI Prompt skill
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-genai-prompt
