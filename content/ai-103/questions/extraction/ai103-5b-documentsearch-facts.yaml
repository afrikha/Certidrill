id: ai103-5b-documentsearch-facts
objective: "5.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. analyzes PDF reports with the prebuilt-documentSearch analyzer of Azure Content Understanding before indexing them for an agent. Contoso doesn't create any custom analyzer.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. analyse des rapports PDF avec l'analyseur prebuilt-documentSearch d'Azure Content Understanding avant de les indexer pour un agent. Contoso ne crée aucun analyseur personnalisé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The output includes a one-paragraph summary of each report.
        fr: La sortie inclut un résumé d'un paragraphe de chaque rapport.
    - id: s2
      text:
        en: Contoso must define a field schema before the analyzer returns Markdown.
        fr: Contoso doit définir un schéma de champs avant que l'analyseur renvoie du Markdown.
    - id: s3
      text:
        en: Charts are represented in chart.js syntax, and diagrams in mermaid.js syntax.
        fr: Les graphiques sont représentés en syntaxe chart.js, et les diagrammes en syntaxe mermaid.js.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      prebuilt-documentSearch is a ready-to-use RAG analyzer: it returns the content and layout as Markdown, figure descriptions, charts as chart.js and diagrams as mermaid.js, handwritten annotations, a one-paragraph summary, and chunked output. No field schema is needed; field schemas belong to custom analyzers that extract named values.
    fr: |
      prebuilt-documentSearch est un analyseur RAG prêt à l'emploi : il renvoie le contenu et la disposition en Markdown, la description des figures, les graphiques en chart.js et les diagrammes en mermaid.js, les annotations manuscrites, un résumé d'un paragraphe et une sortie découpée en blocs. Aucun schéma de champs n'est nécessaire ; les schémas de champs concernent les analyseurs personnalisés qui extraient des valeurs nommées.
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
