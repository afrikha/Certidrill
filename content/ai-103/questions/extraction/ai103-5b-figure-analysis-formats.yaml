id: ai103-5b-figure-analysis-formats
objective: "5.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders ingests its engineering content with prebuilt-documentSearch for a knowledge agent. The content includes the following files:

    - Product manuals saved as PDF files
    - Training decks saved as PPTX files
    - Maintenance procedures saved as DOCX files
    - Scanned schematics saved as PNG files
    - Release notes saved as TXT files

    The agent must answer questions about the charts and diagrams in the content by using the output of figure analysis.

    For which two types of files does prebuilt-documentSearch perform figure analysis?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders ingère son contenu d'ingénierie avec prebuilt-documentSearch pour un agent de connaissances. Le contenu comprend les fichiers suivants :

    - Des manuels de produits enregistrés en fichiers PDF
    - Des présentations de formation enregistrées en fichiers PPTX
    - Des procédures de maintenance enregistrées en fichiers DOCX
    - Des schémas numérisés enregistrés en fichiers PNG
    - Des notes de publication enregistrées en fichiers TXT

    L'agent doit répondre aux questions sur les graphiques et les diagrammes du contenu à l'aide de la sortie de l'analyse des figures.

    Quels sont les deux types de fichiers pour lesquels prebuilt-documentSearch effectue l'analyse des figures ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The PDF product manuals", fr: "Les manuels de produits PDF" } }
    - { id: b, text: { en: "The PPTX training decks", fr: "Les présentations de formation PPTX" } }
    - { id: c, text: { en: "The DOCX maintenance procedures", fr: "Les procédures de maintenance DOCX" } }
    - { id: d, text: { en: "The PNG scanned schematics", fr: "Les schémas numérisés PNG" } }
    - { id: e, text: { en: "The TXT release notes", fr: "Les notes de publication TXT" } }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: |
      prebuilt-documentSearch accepts PDF, image, Office and text files, but its figure analysis (figure descriptions, charts as chart.js, diagrams as mermaid.js) works only for PDF and image files.
    fr: |
      prebuilt-documentSearch accepte les fichiers PDF, image, Office et texte, mais son analyse des figures (descriptions de figures, graphiques en chart.js, diagrammes en mermaid.js) ne fonctionne que pour les fichiers PDF et image.
  options:
    b: { en: "PPTX files are analyzed for their text and layout, but figure analysis isn't performed on Office files.", fr: "Les fichiers PPTX sont analysés pour leur texte et leur disposition, mais l'analyse des figures n'est pas effectuée sur les fichiers Office." }
    c: { en: "DOCX files are Office files: their content is extracted, without figure analysis.", fr: "Les fichiers DOCX sont des fichiers Office : leur contenu est extrait, sans analyse des figures." }
    e: { en: "Text files contain no figures to analyze.", fr: "Les fichiers texte ne contiennent aucune figure à analyser." }
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
