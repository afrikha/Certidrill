id: ai103-5b-stream-citations
objective: "5.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a prompt agent that uses the Azure AI Search tool. Its instructions tell it to always cite its sources. When the application calls the agent without streaming, each response contains `url_citation` annotations.

    The application now streams responses by using the code in the exhibit. The answer text is displayed correctly, but no citation is ever displayed.

    You need the streamed responses to display the citations. What should you do?
  fr: |
    Contoso, Ltd. dispose d'un agent d'invite qui utilise l'outil Azure AI Search. Ses instructions lui demandent de toujours citer ses sources. Quand l'application appelle l'agent sans diffusion en continu, chaque réponse contient des annotations `url_citation`.

    L'application diffuse désormais les réponses en continu avec le code de la pièce. Le texte de la réponse s'affiche correctement, mais aucune citation n'est jamais affichée.

    Les réponses diffusées en continu doivent afficher les citations. Que devez-vous faire ?
exhibits:
  - id: code
    title: { en: "Streaming code", fr: "Code de diffusion en continu" }
    body: |
      ```python
      stream = openai.responses.create(stream=True, input=question)
      for event in stream:
          if event.type == "response.output_text.delta":
              print(event.delta, end="")
              for annotation in getattr(event, "annotations", []):
                  if annotation.type == "url_citation":
                      print(f"\nSource: {annotation.url}")
      ```
body:
  options:
    - { id: a, text: { en: "Pass tool_choice=\"required\" so that the agent calls the search tool on every request.", fr: "Passer tool_choice=\"required\" pour que l'agent appelle l'outil de recherche à chaque requête." } }
    - { id: b, text: { en: "Set query_type to vector_semantic_hybrid on the index resource so that the tool returns citations.", fr: "Définir query_type sur vector_semantic_hybrid sur la ressource d'index pour que l'outil renvoie des citations." } }
    - { id: c, text: { en: "Add an instruction that tells the agent to render each citation as a Markdown link.", fr: "Ajouter une instruction qui demande à l'agent d'afficher chaque citation sous forme de lien Markdown." } }
    - { id: d, text: { en: "Read the annotations from the message item of the response.output_item.done events.", fr: "Lire les annotations dans l'élément de message des événements response.output_item.done." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      In a streamed response, the text deltas carry only text. The url_citation annotations are available when the message item completes, so you read them from the content of the item in the response.output_item.done event. The non-streamed responses already prove that the agent calls the tool and cites its sources.
    fr: |
      Dans une réponse diffusée en continu, les deltas de texte ne contiennent que du texte. Les annotations url_citation sont disponibles quand l'élément de message est terminé : vous les lisez dans le contenu de l'élément de l'événement response.output_item.done. Les réponses non diffusées prouvent déjà que l'agent appelle l'outil et cite ses sources.
  options:
    a: { en: "The agent already calls the tool, as the annotations of the non-streamed responses show; forcing the tool call doesn't change where the stream delivers annotations.", fr: "L'agent appelle déjà l'outil, comme le montrent les annotations des réponses non diffusées ; forcer l'appel de l'outil ne change pas l'endroit où le flux fournit les annotations." }
    b: { en: "vector_semantic_hybrid is already the default query type, and the query type changes ranking, not how citations are delivered.", fr: "vector_semantic_hybrid est déjà le type de requête par défaut, et le type de requête change le classement, pas la façon dont les citations sont fournies." }
    c: { en: "The instructions already produce citations, as the non-streamed responses show; the problem is in the event handling code.", fr: "Les instructions produisent déjà des citations, comme le montrent les réponses non diffusées ; le problème se situe dans le code de gestion des événements." }
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
