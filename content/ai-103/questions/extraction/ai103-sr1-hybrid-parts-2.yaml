stem:
  en: You run a keyword query with semantic ranking.
  fr: Vous exécutez une requête par mot clé avec classement sémantique.
body:
  solution:
    en: |
      The app runs the following query.

      ```python
      results = client.search(
          search_text=question,
          query_type="semantic",
          semantic_configuration_name="sem-cfg",
          top=5,
      )
      ```
    fr: |
      L'application exécute la requête suivante.

      ```python
      results = client.search(
          search_text=question,
          query_type="semantic",
          semantic_configuration_name="sem-cfg",
          top=5,
      )
      ```
answer: { value: false }
explanation:
  correct:
    en: The semantic ranker only reorders the results that the keyword query already returned. Passages that share no terms with the question are never retrieved by full-text search, so the conceptually similar passages are missing; a vector subquery on `contentVector` is required.
    fr: "Le classeur sémantique ne fait que réordonner les résultats déjà renvoyés par la requête par mot clé. Les passages qui n'ont aucun terme en commun avec la question ne sont jamais récupérés par la recherche en texte intégral : les passages conceptuellement proches manquent, et une sous-requête vectorielle sur `contentVector` est nécessaire."
references:
  - title: Create a Hybrid Query
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-how-to-query
