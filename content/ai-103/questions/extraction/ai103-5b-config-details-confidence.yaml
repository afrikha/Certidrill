id: ai103-5b-config-details-confidence
objective: "5.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is creating a custom Azure Content Understanding analyzer from prebuilt-document for scanned shipping manifests. The analyzer extracts fields by using the extract method.

    The analyzer must meet the following requirements:

    - Return a confidence score and a source location for each field value.
    - Return bounding boxes and text spans for the extracted content elements.

    Which two settings should you set to true in the analyzer configuration? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. crée un analyseur Azure Content Understanding personnalisé à partir de prebuilt-document pour des manifestes d'expédition numérisés. L'analyseur extrait des champs avec la méthode extract.

    L'analyseur doit satisfaire les exigences suivantes :

    - Renvoyer un score de confiance et un emplacement source pour chaque valeur de champ.
    - Renvoyer les cadres englobants et les étendues de texte des éléments de contenu extraits.

    Quels sont les deux paramètres à définir sur true dans la configuration de l'analyseur ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: enableSegment }
    - { id: b, text: estimateFieldSourceAndConfidence }
    - { id: c, text: omitContent }
    - { id: d, text: returnDetails }
    - { id: e, text: segmentPerPage }
    - { id: f, text: enableFigureAnalysis }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      estimateFieldSourceAndConfidence returns the source location and the confidence of each field value; fields that use the extract method require it. returnDetails adds confidence, bounding boxes, text spans and metadata to the content elements, at the cost of a larger response.
    fr: |
      estimateFieldSourceAndConfidence renvoie l'emplacement source et la confiance de chaque valeur de champ ; les champs qui utilisent la méthode extract l'exigent. returnDetails ajoute la confiance, les cadres englobants, les étendues de texte et les métadonnées aux éléments de contenu, au prix d'une réponse plus volumineuse.
  options:
    a: { en: "enableSegment splits a file into segments for classification with contentCategories; it adds no location data.", fr: "enableSegment découpe un fichier en segments pour la classification avec contentCategories ; il n'ajoute aucune donnée d'emplacement." }
    c: { en: "omitContent removes the content object from the response, so the content elements wouldn't be returned at all.", fr: "omitContent supprime l'objet de contenu de la réponse : les éléments de contenu ne seraient plus renvoyés du tout." }
    e: { en: "segmentPerPage forces one segment per page; it doesn't add bounding boxes or field confidence.", fr: "segmentPerPage force un segment par page ; il n'ajoute ni cadres englobants ni confiance par champ." }
    f: { en: "enableFigureAnalysis extracts chart data and diagram components from figures; it doesn't add field confidence or text spans.", fr: "enableFigureAnalysis extrait les données des graphiques et les composants des diagrammes à partir des figures ; il n'ajoute ni confiance par champ ni étendues de texte." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
