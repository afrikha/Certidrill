id: ai103-5a-ingestion-billing
objective: "5.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is estimating the cost of a RAG ingestion pipeline in Azure AI Search. The blob indexer has `imageAction` set to `generateNormalizedImages`, and the skillset contains the OCR, Text Merge, Text Split and Azure OpenAI Embedding skills. A billable Foundry resource is attached to the skillset. Most source files are digital PDFs with a text layer, and some contain scanned pages.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum estime le coût d'un pipeline d'ingestion RAG dans Azure AI Search. L'indexeur de blobs a `imageAction` défini sur `generateNormalizedImages`, et l'ensemble de compétences contient les compétences OCR, Text Merge, Text Split et Azure OpenAI Embedding. Une ressource Foundry facturable est attachée à l'ensemble de compétences. La plupart des fichiers sources sont des PDF numériques dotés d'une couche de texte, et certains contiennent des pages numérisées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Extracting the images from the PDF files incurs an Azure AI Search charge.
        fr: |
          L'extraction des images des fichiers PDF entraîne des frais Azure AI Search.
    - id: s2
      text:
        en: |
          Extracting the text layer of the digital PDFs during document cracking is billed through the Foundry resource.
        fr: |
          L'extraction de la couche de texte des PDF numériques pendant le craquage de documents est facturée par l'intermédiaire de la ressource Foundry.
    - id: s3
      text:
        en: |
          The OCR skill transactions beyond the free limit are billed through the Foundry resource.
        fr: |
          Les transactions de la compétence OCR au-delà de la limite gratuite sont facturées par l'intermédiaire de la ressource Foundry.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Setting `imageAction` to a value other than `none` adds an image extraction charge under Azure AI Search pricing. Text extraction from PDFs and other application files is free, as are the Text Merge and Text Split skills. OCR is a billable built-in skill: beyond 20 transactions per indexer per day, it is billed through the attached Foundry resource at the Standard price, and the embedding skill is billed by Azure OpenAI.
    fr: |
      Définir `imageAction` sur une valeur autre que `none` ajoute des frais d'extraction d'images selon la tarification d'Azure AI Search. L'extraction du texte des PDF et des autres fichiers d'application est gratuite, tout comme les compétences Text Merge et Text Split. OCR est une compétence intégrée facturable : au-delà de 20 transactions par indexeur et par jour, elle est facturée par l'intermédiaire de la ressource Foundry attachée au prix Standard, et la compétence d'embedding est facturée par Azure OpenAI.
references:
  - title: Attach a billable resource to a skillset in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services
  - title: Extract text and information from images by using AI enrichment
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios
