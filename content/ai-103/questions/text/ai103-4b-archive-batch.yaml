id: ai103-4b-archive-batch
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam Insurance stores 60,000 recorded claim calls in an Azure Blob Storage container. A claims agent built in Microsoft Foundry will later search the transcripts of these calls.

    You need to transcribe all the recordings. The job must submit the recordings without keeping a connection open for each file, and the transcripts can be collected several hours later.

    What should you use?
  fr: |
    Fabrikam Insurance stocke 60 000 appels de déclaration de sinistre enregistrés dans un conteneur Stockage Blob Azure. Un agent de gestion des sinistres créé dans Microsoft Foundry effectuera plus tard des recherches dans les transcriptions de ces appels.

    Vous devez transcrire tous les enregistrements. Le traitement doit soumettre les enregistrements sans garder une connexion ouverte pour chaque fichier, et les transcriptions peuvent être récupérées plusieurs heures plus tard.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The batch transcription API of Azure Speech", fr: "L'API de transcription par lots d'Azure Speech" } }
    - { id: b, text: { en: "The fast transcription API of Azure Speech", fr: "L'API de transcription rapide d'Azure Speech" } }
    - { id: c, text: { en: "Continuous real-time recognition in the Speech SDK", fr: "La reconnaissance continue en temps réel du SDK Speech" } }
    - { id: d, text: { en: "A gpt-realtime deployment called through the Realtime API", fr: "Un déploiement gpt-realtime appelé via l'API Realtime" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Batch transcription is designed for large amounts of audio stored in files and processes it asynchronously. You submit a transcription that points to the stored audio, and you retrieve the results when the job completes, which suits analysis of recorded call center calls.
    fr: |
      La transcription par lots est conçue pour de grandes quantités d'audio stocké dans des fichiers et la traite de façon asynchrone. Vous soumettez une transcription qui pointe vers l'audio stocké, puis vous récupérez les résultats à la fin du travail, ce qui convient à l'analyse d'appels de centre d'appels enregistrés.
  options:
    b:
      en: |
        Fast transcription is synchronous: each request waits for the transcript of its file, which the job must avoid.
      fr: |
        La transcription rapide est synchrone : chaque requête attend la transcription de son fichier, ce que le traitement doit éviter.
    c:
      en: |
        Real-time recognition processes a live stream at the pace of the audio and keeps a session open for each recording.
      fr: |
        La reconnaissance en temps réel traite un flux en direct au rythme de l'audio et garde une session ouverte pour chaque enregistrement.
    d:
      en: |
        The Realtime API is optimized for low-latency, interactive voice conversations, not for transcribing a stored archive.
      fr: |
        L'API Realtime est optimisée pour des conversations vocales interactives à faible latence, pas pour transcrire une archive stockée.
references:
  - title: What is speech to text?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
  - title: Create a batch transcription
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create
