id: ai103-4a-defect-codes
objective: "4.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso Manufacturing extracts defect reports from technicians' notes by using a model with strict structured outputs. The defectCode field is currently defined as a string. The quality catalog has 14 codes, DC-01 to DC-14. Reviewers find two problems:

    - Some reports contain codes that aren't in the catalog, such as DC-99 and CORR.
    - The model often confuses DC-07 (surface corrosion) with DC-08 (oxidation).

    You need to fix both problems without training a model.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Manufacturing extrait des rapports de défauts des notes des techniciens à l'aide d'un modèle avec des sorties structurées strictes. Le champ defectCode est actuellement défini comme une chaîne. Le catalogue qualité contient 14 codes, de DC-01 à DC-14. Les relecteurs constatent deux problèmes :

    - Certains rapports contiennent des codes absents du catalogue, comme DC-99 et CORR.
    - Le modèle confond souvent DC-07 (corrosion de surface) avec DC-08 (oxydation).

    Vous devez résoudre les deux problèmes sans entraîner de modèle.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a pattern of ^DC-[0-9]{2}$ to the defectCode field.", fr: "Ajouter un pattern ^DC-[0-9]{2}$ au champ defectCode." } }
    - { id: b, text: { en: "Define the defectCode field as an enum of the 14 catalog codes.", fr: "Définir le champ defectCode comme un enum des 14 codes du catalogue." } }
    - { id: c, text: { en: "Raise the temperature of the request from 0.2 to 1.2.", fr: "Augmenter la température de la requête de 0,2 à 1,2." } }
    - { id: d, text: { en: "Add a one-line definition of each catalog code to the instructions.", fr: "Ajouter une définition d'une ligne de chaque code du catalogue aux instructions." } }
    - { id: e, text: { en: "Switch the request from structured outputs to JSON mode.", fr: "Faire passer la requête des sorties structurées au mode JSON." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      An `enum` in the strict schema limits defectCode to the 14 catalog values, so codes such as DC-99 or CORR can't be returned. A short definition of each code in the instructions gives the model the domain knowledge it needs to choose between close codes such as DC-07 and DC-08.
    fr: |
      Un `enum` dans le schéma strict limite defectCode aux 14 valeurs du catalogue : des codes comme DC-99 ou CORR ne peuvent plus être renvoyés. Une courte définition de chaque code dans les instructions donne au modèle la connaissance du domaine dont il a besoin pour choisir entre des codes proches comme DC-07 et DC-08.
  options:
    a:
      en: |
        `pattern` isn't supported in structured outputs schemas, and this pattern would still accept DC-99.
      fr: |
        `pattern` n'est pas pris en charge dans les schémas de sorties structurées, et ce motif accepterait toujours DC-99.
    c:
      en: |
        A higher temperature makes the output more random, which increases the confusion between codes.
      fr: |
        Une température plus élevée rend la sortie plus aléatoire, ce qui augmente la confusion entre les codes.
    e:
      en: |
        JSON mode guarantees valid JSON only; it would remove the schema enforcement instead of adding it.
      fr: |
        Le mode JSON garantit seulement un JSON valide ; il supprimerait l'application du schéma au lieu de l'ajouter.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
