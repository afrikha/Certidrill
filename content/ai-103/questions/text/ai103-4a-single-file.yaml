id: ai103-4a-single-file
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware builds a web app in which an employee uploads one Word document at a time and receives it back in Spanish a few seconds later. The translated document must keep the formatting of the original. The solution must not use an Azure Storage account.

    What should you use?
  fr: |
    Proseware crée une application web dans laquelle un employé charge un document Word à la fois et le récupère en espagnol quelques secondes plus tard. Le document traduit doit conserver la mise en forme de l'original. La solution ne doit pas utiliser de compte Stockage Azure.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Asynchronous batch document translation", fr: "La traduction de documents asynchrone par lots" } }
    - { id: b, text: { en: "Synchronous document translation", fr: "La traduction de documents synchrone" } }
    - { id: c, text: { en: "Text translation 2026-06-06 on the extracted text", fr: "La traduction de texte 2026-06-06 sur le texte extrait" } }
    - { id: d, text: { en: "A Custom Translator model for Spanish", fr: "Un modèle Custom Translator pour l'espagnol" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Synchronous document translation translates a single document, optionally with a glossary, and keeps its structure and format. It doesn't need Blob Storage: the translated document is returned directly in the response.
    fr: |
      La traduction de documents synchrone traduit un seul document, éventuellement avec un glossaire, et conserve sa structure et sa mise en forme. Elle n'a pas besoin du stockage Blob : le document traduit est renvoyé directement dans la réponse.
  options:
    a:
      en: |
        Batch document translation requires a Blob Storage account with source and target containers.
      fr: |
        La traduction de documents par lots exige un compte de stockage Blob avec des conteneurs source et cible.
    c:
      en: |
        Text translation returns translated text only, so the formatting of the Word document is lost.
      fr: |
        La traduction de texte ne renvoie que du texte traduit : la mise en forme du document Word est perdue.
    d:
      en: |
        Custom Translator builds a custom NMT model for domain terminology; it doesn't translate document files by itself.
      fr: |
        Custom Translator crée un modèle NMT personnalisé pour la terminologie d'un domaine ; il ne traduit pas lui-même des fichiers de documents.
references:
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
