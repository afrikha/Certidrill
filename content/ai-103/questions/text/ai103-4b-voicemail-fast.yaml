id: ai103-4b-voicemail-fast
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Health is building a callback agent in Microsoft Foundry. When a patient leaves a voicemail, the telephony system saves a WAV file, and the agent must receive its transcript to schedule a callback.

    Each voicemail must be transcribed as soon as it arrives. The transcript must be returned synchronously, faster than the duration of the recording, with predictable latency.

    Which speech to text option of Azure Speech should you use?
  fr: |
    Contoso Health crée un agent de rappel dans Microsoft Foundry. Quand un patient laisse un message vocal, le système de téléphonie enregistre un fichier WAV, et l'agent doit recevoir sa transcription pour planifier un rappel.

    Chaque message vocal doit être transcrit dès son arrivée. La transcription doit être renvoyée de façon synchrone, plus vite que la durée de l'enregistrement, avec une latence prévisible.

    Quelle option de reconnaissance vocale d'Azure Speech devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The batch transcription API, with one transcription job per voicemail", fr: "L'API de transcription par lots, avec un travail de transcription par message vocal" } }
    - { id: b, text: { en: "The fast transcription API, with one request per voicemail", fr: "L'API de transcription rapide, avec une requête par message vocal" } }
    - { id: c, text: { en: "Real-time speech to text in the Speech SDK, reading the WAV file", fr: "La reconnaissance vocale en temps réel du SDK Speech, en lisant le fichier WAV" } }
    - { id: d, text: { en: "The Voice Live API, with the azure-speech transcription model", fr: "L'API Voice Live, avec le modèle de transcription azure-speech" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Fast transcription transcribes audio files and returns the result synchronously, faster than real time, for scenarios that need predictable latency such as voicemail. One request per file fits a stream of voicemails processed as they arrive.
    fr: |
      La transcription rapide transcrit des fichiers audio et renvoie le résultat de façon synchrone, plus vite que le temps réel, pour les scénarios qui demandent une latence prévisible, comme les messages vocaux. Une requête par fichier convient à un flux de messages traités à leur arrivée.
  options:
    a:
      en: |
        Batch transcription is asynchronous and designed for large volumes of stored audio: the agent would have to poll for the result.
      fr: |
        La transcription par lots est asynchrone et conçue pour de gros volumes d'audio stocké : l'agent devrait interroger le service pour obtenir le résultat.
    c:
      en: |
        Real-time recognition transcribes audio as it is recognized, at the pace of the audio, so it is not faster than the duration of the recording.
      fr: |
        La reconnaissance en temps réel transcrit l'audio au fur et à mesure, au rythme de l'audio : elle n'est pas plus rapide que la durée de l'enregistrement.
    d:
      en: |
        The Voice Live API is a speech-to-speech API for live conversations with a voice agent, not a file transcription service.
      fr: |
        L'API Voice Live est une API de parole à parole pour des conversations en direct avec un agent vocal, pas un service de transcription de fichiers.
references:
  - title: What is speech to text?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
