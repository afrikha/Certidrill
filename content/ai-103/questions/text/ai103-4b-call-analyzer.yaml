id: ai103-4b-call-analyzer
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys records every call to its customer service center. A quality agent must receive the same set of insights from every recording (the topics, the sentiment and the key insights of the call) in a consistent structure.

    The team wants a prebuilt solution and does not want to write or maintain a prompt for this extraction.

    What should you use?
  fr: |
    Tailspin Toys enregistre chaque appel de son centre de service client. Un agent qualité doit recevoir le même ensemble d'informations pour chaque enregistrement (les sujets, le sentiment et les informations clés de l'appel) dans une structure cohérente.

    L'équipe veut une solution prédéfinie et ne veut pas écrire ni maintenir d'invite pour cette extraction.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The prebuilt-audioSearch analyzer of Azure Content Understanding", fr: "L'analyseur prebuilt-audioSearch d'Azure Content Understanding" } }
    - { id: b, text: { en: "The prebuilt-callCenter analyzer of Azure Content Understanding", fr: "L'analyseur prebuilt-callCenter d'Azure Content Understanding" } }
    - { id: c, text: { en: "A gpt-audio-mini deployment that receives each recording as `input_audio`", fr: "Un déploiement gpt-audio-mini qui reçoit chaque enregistrement en `input_audio`" } }
    - { id: d, text: { en: "Batch transcription of Azure Speech with diarization enabled", fr: "La transcription par lots d'Azure Speech avec la diarisation activée" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      prebuilt-callCenter is a prebuilt Content Understanding analyzer that extracts topics, sentiment and key insights from call recordings. Because the analyzer defines the output, every call returns the same structure without any prompt to write.
    fr: |
      prebuilt-callCenter est un analyseur prédéfini de Content Understanding qui extrait les sujets, le sentiment et les informations clés des enregistrements d'appels. Comme l'analyseur définit la sortie, chaque appel renvoie la même structure sans aucune invite à écrire.
  options:
    a:
      en: |
        prebuilt-audioSearch is a RAG analyzer that returns a transcript and a one-paragraph summary, not sentiment and topics.
      fr: |
        prebuilt-audioSearch est un analyseur RAG qui renvoie une transcription et un résumé d'un paragraphe, pas le sentiment ni les sujets.
    c:
      en: |
        An audio model could extract these insights, but only with a prompt that the team would have to write and maintain.
      fr: |
        Un modèle audio pourrait extraire ces informations, mais seulement avec une invite que l'équipe devrait écrire et maintenir.
    d:
      en: |
        Batch transcription returns transcripts with speaker labels; it does not extract topics or sentiment.
      fr: |
        La transcription par lots renvoie des transcriptions avec des étiquettes d'interlocuteur ; elle n'extrait ni les sujets ni le sentiment.
references:
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
