id: ai103-4b-llm-speech-facts
objective: "4.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Media translates recorded podcasts into English text for a content agent. Each request to the fast transcription endpoint of Azure Speech contains the following `definition`.

    ```json
    {
      "enhancedMode": {
        "enabled": true,
        "task": "translate",
        "targetLanguage": "en"
      },
      "diarization": { "enabled": true, "maxSpeakers": 3 },
      "phraseList": { "phrases": ["Adatum Weekly"] }
    }
    ```

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Media traduit des podcasts enregistrés en texte anglais pour un agent de contenu. Chaque requête au point de terminaison de transcription rapide d'Azure Speech contient la `definition` suivante.

    ```json
    {
      "enhancedMode": {
        "enabled": true,
        "task": "translate",
        "targetLanguage": "en"
      },
      "diarization": { "enabled": true, "maxSpeakers": 3 },
      "phraseList": { "phrases": ["Adatum Weekly"] }
    }
    ```

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "If `targetLanguage` is removed, the request is not valid for the translate task.", fr: "Si `targetLanguage` est supprimé, la requête n'est pas valide pour la tâche translate." } }
    - { id: b, text: { en: "The result attributes every phrase to the speaker1 label, even when three people speak.", fr: "Le résultat attribue chaque phrase à l'étiquette speaker1, même quand trois personnes parlent." } }
    - { id: c, text: { en: "The result contains word-level offsetMilliseconds and durationMilliseconds values for the translated text.", fr: "Le résultat contient des valeurs offsetMilliseconds et durationMilliseconds au niveau du mot pour le texte traduit." } }
    - { id: d, text: { en: "The phrase list is applied only after a custom speech model is trained with the phrases.", fr: "La liste d'expressions n'est appliquée qu'après l'entraînement d'un modèle de reconnaissance vocale personnalisée avec les expressions." } }
    - { id: e, text: { en: "The result contains a confidence score for each phrase that the agent can use to filter results.", fr: "Le résultat contient un score de confiance pour chaque phrase, que l'agent peut utiliser pour filtrer les résultats." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The translate task of Azure LLM Speech requires `targetLanguage`. Diarization is supported for the transcribe task but not for translate, which returns only the speaker1 label.
    fr: |
      La tâche translate d'Azure LLM Speech exige `targetLanguage`. La diarisation est prise en charge pour la tâche transcribe mais pas pour translate, qui ne renvoie que l'étiquette speaker1.
  options:
    c:
      en: |
        Word-level timestamps are not supported for the translate task.
      fr: |
        Les horodatages au niveau du mot ne sont pas pris en charge pour la tâche translate.
    d:
      en: |
        A phrase list is a standard fast transcription option sent with the request; it needs no training.
      fr: |
        Une liste d'expressions est une option standard de la transcription rapide envoyée avec la requête ; elle ne demande aucun entraînement.
    e:
      en: |
        Confidence is not available with Azure LLM Speech: the value is always 0.
      fr: |
        La confiance n'est pas disponible avec Azure LLM Speech : sa valeur est toujours 0.
references:
  - title: Azure LLM Speech for transcription and translation
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/llm-speech
