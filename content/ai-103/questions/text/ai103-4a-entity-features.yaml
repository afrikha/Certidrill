id: ai103-4a-entity-features
objective: "4.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Insurance builds a claims-intake solution in Microsoft Foundry. The solution must extract several kinds of information from claim documents, as shown in the following list of requirements. The team has labeled documents only for its own entity categories.

    What should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Insurance crée une solution de réception des sinistres dans Microsoft Foundry. La solution doit extraire plusieurs types d'informations des documents de sinistre, comme l'indique la liste d'exigences suivante. L'équipe dispose de documents étiquetés uniquement pour ses propres catégories d'entités.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ner, text: { en: "Azure Language prebuilt named entity recognition (NER)", fr: "Reconnaissance d'entités nommées (NER) prédéfinie d'Azure Language" } }
    - { id: cner, text: { en: "Azure Language custom named entity recognition", fr: "Reconnaissance d'entités nommées personnalisée d'Azure Language" } }
    - { id: health, text: { en: "Azure Language Text Analytics for health", fr: "Text Analytics for health d'Azure Language" } }
    - { id: keyphrase, text: { en: "Azure Language key phrase extraction", fr: "Extraction d'expressions clés d'Azure Language" } }
    - { id: linking, text: { en: "Azure Language entity linking", fr: "Liaison d'entités d'Azure Language" } }
    - { id: model, text: { en: "A model deployment with structured outputs", fr: "Un déploiement de modèle avec des sorties structurées" } }
  targets:
    - { id: t1, text: { en: "Return the people, organizations and locations mentioned in a claim, each with a confidence score, without training a model", fr: "Renvoyer les personnes, organisations et lieux mentionnés dans un sinistre, chacun avec un score de confiance, sans entraîner de modèle" } }
    - { id: t2, text: { en: "Extract the policy numbers and broker codes defined by Woodgrove, learned from its labeled documents", fr: "Extraire les numéros de police et les codes de courtier définis par Woodgrove, appris à partir de ses documents étiquetés" } }
    - { id: t3, text: { en: "Extract the diagnoses and medications in medical reports, without training a model", fr: "Extraire les diagnostics et les médicaments des rapports médicaux, sans entraîner de modèle" } }
    - { id: t4, text: { en: "Produce one JSON object with the eight fields the claims system expects, including a one-sentence summary", fr: "Produire un objet JSON avec les huit champs attendus par le système de sinistres, dont un résumé d'une phrase" } }
answer:
  mapping: { t1: ner, t2: cner, t3: health, t4: model }
explanation:
  correct:
    en: |
      Prebuilt NER categorizes entities into predefined types such as person, organization and location, with confidence scores, without a custom model. Custom NER builds a model from your labeled data to extract your own entity categories. Text Analytics for health extracts and labels medical information from unstructured text. A model with structured outputs returns your own set of fields, including generated text such as a summary, in one schema-conformant JSON object.
    fr: |
      La NER prédéfinie classe les entités dans des types prédéfinis comme personne, organisation et lieu, avec des scores de confiance, sans modèle personnalisé. La NER personnalisée crée un modèle à partir de vos données étiquetées pour extraire vos propres catégories d'entités. Text Analytics for health extrait et étiquette les informations médicales d'un texte non structuré. Un modèle avec des sorties structurées renvoie votre propre ensemble de champs, y compris du texte généré comme un résumé, dans un seul objet JSON conforme au schéma.
  options:
    keyphrase:
      en: |
        Key phrase extraction returns the main concepts of a text as a list of phrases, not typed entities or a schema. It's a legacy feature.
      fr: |
        L'extraction d'expressions clés renvoie les concepts principaux d'un texte sous forme de liste d'expressions, pas d'entités typées ni de schéma. C'est une fonctionnalité héritée.
    linking:
      en: |
        Entity linking disambiguates entities and returns links to Wikipedia; it doesn't extract custom or medical categories.
      fr: |
        La liaison d'entités lève l'ambiguïté des entités et renvoie des liens vers Wikipédia ; elle n'extrait pas de catégories personnalisées ou médicales.
references:
  - title: What is Azure Language in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview
