id: ai103-4a-pii-request
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware Insurance redacts claim notes by calling `POST {endpoint}/language/:analyze-text?api-version=2025-11-15-preview` on an Azure Language resource. The request must meet the following requirements:

    - Return only person names and phone numbers.
    - In the redacted text, replace each value with a placeholder that shows its entity type, such as `[PERSON_1]`.

    How should you complete the request body? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware Insurance masque les notes de sinistre en appelant `POST {endpoint}/language/:analyze-text?api-version=2025-11-15-preview` sur une ressource Azure Language. La requête doit satisfaire les exigences suivantes :

    - Ne renvoyer que les noms de personnes et les numéros de téléphone.
    - Dans le texte masqué, remplacer chaque valeur par un espace réservé qui indique son type d'entité, comme `[PERSON_1]`.

    Comment devez-vous compléter le corps de la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "kind": "[[kind]]",
      "parameters": {
        "modelVersion": "latest",
        "[[filter]]": ["Person", "PhoneNumber"],
        "redactionPolicies": [
          { "policyKind": "[[policy]]", "entityTypes": ["Person", "PhoneNumber"] }
        ]
      },
      "analysisInput": {
        "documents": [
          { "id": "1", "language": "en", "text": "Call Paul Smith at 555-0100 about claim 4471." }
        ]
      }
    }
  slots:
    - id: kind
      options:
        - { id: entity, text: EntityRecognition }
        - { id: pii, text: PiiEntityRecognition }
        - { id: linking, text: EntityLinking }
    - id: filter
      options:
        - { id: categories, text: categories }
        - { id: blocklist, text: blocklistNames }
        - { id: piicategories, text: piiCategories }
    - id: policy
      options:
        - { id: charmask, text: characterMask }
        - { id: entitymask, text: entityMask }
        - { id: nomask, text: noMask }
        - { id: synthetic, text: syntheticReplacement }
answer:
  values: { kind: pii, filter: piicategories, policy: entitymask }
explanation:
  correct:
    en: |
      PII detection in text uses the `PiiEntityRecognition` kind. `piiCategories` limits the results to the listed categories. The `entityMask` redaction policy replaces each detected value with a placeholder such as `[PERSON_1]`.
    fr: |
      La détection des PII dans le texte utilise le type `PiiEntityRecognition`. `piiCategories` limite les résultats aux catégories listées. La stratégie de masquage `entityMask` remplace chaque valeur détectée par un espace réservé comme `[PERSON_1]`.
  options:
    kind:
      en: |
        `EntityRecognition` is named entity recognition, which doesn't redact text, and `EntityLinking` links entities to Wikipedia.
      fr: |
        `EntityRecognition` correspond à la reconnaissance d'entités nommées, qui ne masque pas le texte, et `EntityLinking` lie des entités à Wikipédia.
    filter:
      en: |
        `categories` and `blocklistNames` are parameters of the Content Safety analyze text API, not of PII detection.
      fr: |
        `categories` et `blocklistNames` sont des paramètres de l'API d'analyse de texte de Content Safety, pas de la détection des PII.
    policy:
      en: |
        `characterMask` replaces each character with a mask character, `noMask` omits the redacted text, and `syntheticReplacement` replaces values with realistic fake values.
      fr: |
        `characterMask` remplace chaque caractère par un caractère de masquage, `noMask` omet le texte masqué, et `syntheticReplacement` remplace les valeurs par de fausses valeurs réalistes.
references:
  - title: Identify and extract Personally Identifiable Information (PII) from text
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/how-to/redact-text-pii
