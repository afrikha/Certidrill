id: ai103-4a-tone-ignored
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Bank translates customer letters into German by using Azure Translator text translation 2026-06-06. A Microsoft Foundry resource with an LLM deployment named letters-llm is available to the Translator resource. The target of each request is shown in the Request exhibit.

    Reviewers report that the German letters use an informal register even though the request sets the tone to formal.

    You need the German letters to use a formal register.

    What should you do?
  fr: |
    Adatum Bank traduit des courriers clients en allemand à l'aide de la traduction de texte 2026-06-06 d'Azure Translator. Une ressource Microsoft Foundry avec un déploiement LLM nommé letters-llm est disponible pour la ressource Translator. La cible de chaque requête figure dans la pièce Requête.

    Les relecteurs signalent que les courriers en allemand utilisent un registre informel alors que la requête définit le ton sur formel.

    Les courriers en allemand doivent utiliser un registre formel.

    Que devez-vous faire ?
exhibits:
  - id: request
    title: { en: "Request", fr: "Requête" }
    body: |
      ```json
      "targets": [
        { "language": "de", "tone": "formal" }
      ]
      ```
body:
  options:
    - { id: a, text: { en: "Set allowFallback to false in the German target.", fr: "Définir allowFallback sur false dans la cible allemande." } }
    - { id: b, text: { en: "Set textType to html in the input.", fr: "Définir textType sur html dans l'entrée." } }
    - { id: c, text: { en: "Set deploymentName to letters-llm in the German target.", fr: "Définir deploymentName sur letters-llm dans la cible allemande." } }
    - { id: d, text: { en: "Set gender to neutral in the German target.", fr: "Définir gender sur neutral dans la cible allemande." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Without `deploymentName`, the target uses `general`, the default NMT engine. The `tone` and `gender` controls apply to LLM-based translation, so the target must name the LLM deployment for the formal tone to change the output.
    fr: |
      Sans `deploymentName`, la cible utilise `general`, le moteur NMT par défaut. Les contrôles `tone` et `gender` s'appliquent à la traduction basée sur un LLM : la cible doit nommer le déploiement LLM pour que le ton formel change la sortie.
  options:
    a:
      en: |
        `allowFallback` controls what happens when the chosen model doesn't support the language pair; the target still uses NMT.
      fr: |
        `allowFallback` détermine ce qui se passe quand le modèle choisi ne prend pas en charge la paire de langues ; la cible utilise toujours la NMT.
    b:
      en: |
        `textType` tells the service whether the input is plain text or HTML; it doesn't select the engine or the register.
      fr: |
        `textType` indique au service si l'entrée est du texte brut ou du HTML ; il ne sélectionne ni le moteur ni le registre.
    d:
      en: |
        `gender` is also an LLM control, and it sets gendered forms, not the register.
      fr: |
        `gender` est aussi un contrôle LLM, et il définit les formes genrées, pas le registre.
references:
  - title: Azure Translator in Foundry Tools 2026-06-06 translate method
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/2026-06-06/translate-api
  - title: Migrate to Translator Text API 2026-06-06
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/how-to/migrate-to-2026-06-06
