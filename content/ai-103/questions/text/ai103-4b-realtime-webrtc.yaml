id: ai103-4b-realtime-webrtc
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is building a language-learning web app. Students speak with an AI tutor from their browser. The tutor must answer with speech, students must be able to interrupt it, and the perceived latency must be as low as possible.

    Which approach should you use?
  fr: |
    Wingtip Toys crée une application web d'apprentissage des langues. Les élèves parlent à un tuteur IA depuis leur navigateur. Le tuteur doit répondre par la voix, les élèves doivent pouvoir l'interrompre, et la latence ressentie doit être la plus faible possible.

    Quelle approche devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Connect the browser to a gpt-realtime deployment through the Realtime API over WebRTC", fr: "Connecter le navigateur à un déploiement gpt-realtime via l'API Realtime sur WebRTC" } }
    - { id: b, text: { en: "Connect the browser to a gpt-realtime deployment through the Realtime API over WebSocket", fr: "Connecter le navigateur à un déploiement gpt-realtime via l'API Realtime sur WebSocket" } }
    - { id: c, text: { en: "Send each recorded turn to a gpt-audio-mini deployment through Chat Completions with audio output", fr: "Envoyer chaque tour enregistré à un déploiement gpt-audio-mini via Chat Completions avec une sortie audio" } }
    - { id: d, text: { en: "Transcribe each turn with fast transcription, prompt a gpt-4.1 deployment, and synthesize the answer", fr: "Transcrire chaque tour avec la transcription rapide, interroger un déploiement gpt-4.1, puis synthétiser la réponse" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Realtime API is optimized for low-latency, interactive voice conversations with gpt-realtime models, and it supports interruptions. WebRTC is the recommended connection for client-side applications such as web apps, with lower latency than WebSocket.
    fr: |
      L'API Realtime est optimisée pour des conversations vocales interactives à faible latence avec les modèles gpt-realtime, et elle prend en charge les interruptions. WebRTC est la connexion recommandée pour les applications côté client, comme les applications web, avec une latence plus faible que WebSocket.
  options:
    b:
      en: |
        WebSocket is intended for server-to-server connections and has higher latency than WebRTC for a browser client.
      fr: |
        WebSocket est destiné aux connexions de serveur à serveur et a une latence plus élevée que WebRTC pour un client navigateur.
    c:
      en: |
        Chat Completions with audio is a request/response pattern: each turn waits for the full recording and answer, and there is no live interruption.
      fr: |
        Chat Completions avec de l'audio est un modèle de requête et réponse : chaque tour attend l'enregistrement et la réponse complets, sans interruption en direct.
    d:
      en: |
        Chaining three services adds the latency of each hop and leaves interruption handling to your code.
      fr: |
        Enchaîner trois services ajoute la latence de chaque étape et laisse la gestion des interruptions à votre code.
references:
  - title: Use the GPT Realtime API for speech and audio with Azure OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/realtime-audio
