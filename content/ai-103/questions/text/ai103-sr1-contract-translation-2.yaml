id: ai103-sr1-contract-translation-2
objective: "4.1.3"
type: series_yesno
series: ai103-sr1-contract-translation
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You extract the text of each contract and send it to the text translation API.
  fr: Vous extrayez le texte de chaque contrat et l'envoyez à l'API de traduction de texte.
body:
  solution:
    en: |
      A scheduled job downloads each file from contracts-en, extracts its text, and sends the text to the Translator **text translation** API with French and German as target languages. The job saves each translation as a TXT file in contracts-out.
    fr: |
      Un travail planifié télécharge chaque fichier de contracts-en, en extrait le texte et envoie ce texte à l'API de **traduction de texte** de Translator avec le français et l'allemand comme langues cibles. Le travail enregistre chaque traduction sous forme de fichier TXT dans contracts-out.
answer: { value: false }
explanation:
  correct:
    en: Text translation works on plain text, so the output TXT files lose the layout and formatting of the DOCX and PDF contracts. The text of scanned PDF files is also not available without OCR, and the TSV terminology is not applied.
    fr: "La traduction de texte travaille sur du texte brut : les fichiers TXT obtenus perdent la disposition et la mise en forme des contrats DOCX et PDF. Le texte des PDF numérisés n'est pas non plus disponible sans OCR, et la terminologie du fichier TSV n'est pas appliquée."
references:
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
