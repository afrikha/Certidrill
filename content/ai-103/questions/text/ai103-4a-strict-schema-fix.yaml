id: ai103-4a-strict-schema-fix
objective: "4.1.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys extracts return requests from customer emails by using structured outputs with `strict` set to true. The JSON schema is shown in the Schema exhibit. The customer's email address appears in only some messages. The order ID always has the format ORD- followed by six digits.

    When you send the request, the service rejects the schema.

    You need to make the schema valid for strict structured outputs while still capturing the email address when it's present.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys extrait les demandes de retour des e-mails des clients à l'aide des sorties structurées avec `strict` défini sur true. Le schéma JSON figure dans la pièce Schéma. L'adresse e-mail du client n'apparaît que dans certains messages. L'ID de commande a toujours le format ORD- suivi de six chiffres.

    Lorsque vous envoyez la requête, le service rejette le schéma.

    Vous devez rendre le schéma valide pour les sorties structurées strictes tout en capturant l'adresse e-mail quand elle est présente.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
exhibits:
  - id: schema
    title: { en: "Schema", fr: "Schéma" }
    body: |
      ```json
      {
        "type": "object",
        "properties": {
          "orderId": { "type": "string", "pattern": "^ORD-[0-9]{6}$" },
          "reason": { "type": "string", "enum": ["Damaged", "WrongItem", "Late", "Other"] },
          "customerEmail": { "type": "string" }
        },
        "required": ["orderId", "reason"],
        "additionalProperties": false
      }
      ```
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set additionalProperties to true so that the model can omit customerEmail.", fr: "Définir additionalProperties sur true pour que le modèle puisse omettre customerEmail." } }
    - { id: b, text: { en: "Add customerEmail to required and set its type to [\"string\", \"null\"].", fr: "Ajouter customerEmail à required et définir son type sur [\"string\", \"null\"]." } }
    - { id: c, text: { en: "Replace the enum of reason with a pattern that lists the four values.", fr: "Remplacer l'enum de reason par un pattern qui liste les quatre valeurs." } }
    - { id: d, text: { en: "Wrap the root object in anyOf with a second object that has no customerEmail.", fr: "Envelopper l'objet racine dans un anyOf avec un second objet sans customerEmail." } }
    - { id: e, text: { en: "Remove the pattern keyword and check the order ID format in the application code.", fr: "Supprimer le mot clé pattern et vérifier le format de l'ID de commande dans le code de l'application." } }
answer: { optionIds: [b, e] }
explanation:
  correct:
    en: |
      In strict mode every property must be listed in `required`; an optional value is emulated with a union that includes `null`, so the model returns `null` when the email is absent. The `pattern` keyword isn't supported for strings in structured outputs, so you remove it and validate the order ID format in code after parsing.
    fr: |
      En mode strict, chaque propriété doit figurer dans `required` ; une valeur facultative s'émule avec une union qui inclut `null`, et le modèle renvoie `null` quand l'e-mail est absent. Le mot clé `pattern` n'est pas pris en charge pour les chaînes dans les sorties structurées : vous le supprimez et validez le format de l'ID de commande dans le code après l'analyse.
  options:
    a:
      en: |
        Strict mode requires `additionalProperties` set to `false` on every object; `true` makes the schema invalid.
      fr: |
        Le mode strict exige `additionalProperties` défini sur `false` sur chaque objet ; `true` rend le schéma non valide.
    c:
      en: |
        `enum` is supported in structured outputs, while `pattern` isn't, so this change makes the schema invalid.
      fr: |
        `enum` est pris en charge dans les sorties structurées, alors que `pattern` ne l'est pas : ce changement rend le schéma non valide.
    d:
      en: |
        The root object of a structured outputs schema can't be `anyOf`.
      fr: |
        L'objet racine d'un schéma de sorties structurées ne peut pas être `anyOf`.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
