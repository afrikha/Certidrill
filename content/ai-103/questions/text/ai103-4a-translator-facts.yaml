id: ai103-4a-translator-facts
objective: "4.1.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys plans to move its app from Azure Translator text translation v3.0 to version 2026-06-06 and to use an LLM deployment for some target languages.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys prévoit de faire passer son application de la traduction de texte v3.0 d'Azure Translator à la version 2026-06-06 et d'utiliser un déploiement LLM pour certaines langues cibles.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The app can send its existing v3.0 request bodies to version 2026-06-06 by changing only the api-version value.
        fr: L'application peut envoyer ses corps de requête v3.0 existants à la version 2026-06-06 en changeant uniquement la valeur d'api-version.
    - id: s2
      text:
        en: A translate request that uses an LLM deployment can contain up to 50 array elements.
        fr: Une requête de traduction qui utilise un déploiement LLM peut contenir jusqu'à 50 éléments de tableau.
    - id: s3
      text:
        en: Translations produced by the LLM deployment are billed per source character, like NMT translations.
        fr: Les traductions produites par le déploiement LLM sont facturées par caractère source, comme les traductions NMT.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Version 2026-06-06 isn't backward compatible with v3.0: the request uses an `inputs` array with a `targets` array instead of the `to` parameter, and the response uses a `value` array. An LLM request accepts up to 50 array elements, compared with 1,000 for NMT. NMT is billed per source character, while LLM translation is billed per input and output token at Azure OpenAI prices.
    fr: |
      La version 2026-06-06 n'est pas rétrocompatible avec la v3.0 : la requête utilise un tableau `inputs` avec un tableau `targets` au lieu du paramètre `to`, et la réponse utilise un tableau `value`. Une requête LLM accepte jusqu'à 50 éléments de tableau, contre 1 000 pour la NMT. La NMT est facturée par caractère source, alors que la traduction LLM est facturée par jeton d'entrée et de sortie, au tarif d'Azure OpenAI.
references:
  - title: Migrate to Translator Text API 2026-06-06
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/how-to/migrate-to-2026-06-06
  - title: What is Azure text translation in Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview
