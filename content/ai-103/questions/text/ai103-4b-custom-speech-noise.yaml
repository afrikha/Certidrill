id: ai103-4b-custom-speech-noise
objective: "4.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders uses a voice agent in its warehouses. Speech to text uses the base model. You measure a word error rate (WER) of 31 % on recordings made near forklifts and conveyor belts, and of 6 % on recordings made in quiet offices. The part codes are recognized correctly in the quiet recordings.

    The team already added the part codes to a phrase list, with no significant improvement on the noisy recordings.

    You need to reduce the WER on the noisy recordings. What should you do?
  fr: |
    Northwind Traders utilise un agent vocal dans ses entrepôts. La reconnaissance vocale utilise le modèle de base. Vous mesurez un taux d'erreurs de mots (WER) de 31 % sur des enregistrements réalisés près de chariots élévateurs et de convoyeurs, et de 6 % sur des enregistrements réalisés dans des bureaux calmes. Les références de pièces sont correctement reconnues dans les enregistrements calmes.

    L'équipe a déjà ajouté les références de pièces à une liste d'expressions, sans amélioration significative sur les enregistrements bruyants.

    Vous devez réduire le WER sur les enregistrements bruyants. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Train a custom speech model with plain text sentences that contain the part codes, and deploy it to a custom endpoint", fr: "Entraîner un modèle de reconnaissance vocale personnalisée avec des phrases en texte brut qui contiennent les références de pièces, et le déployer sur un point de terminaison personnalisé" } }
    - { id: b, text: { en: "Set the weight of the phrase list to 2.0, and add the most frequent warehouse words to the list", fr: "Définir le poids de la liste d'expressions sur 2.0, et ajouter à la liste les mots les plus fréquents de l'entrepôt" } }
    - { id: c, text: { en: "Train a custom speech model with warehouse audio and human-labeled transcripts, and deploy it to a custom endpoint", fr: "Entraîner un modèle de reconnaissance vocale personnalisée avec de l'audio de l'entrepôt et des transcriptions étiquetées par des humains, et le déployer sur un point de terminaison personnalisé" } }
    - { id: d, text: { en: "Enable language identification with en-US and en-GB as candidate locales, and keep the base model", fr: "Activer l'identification de la langue avec en-US et en-GB comme paramètres régionaux candidats, et conserver le modèle de base" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The errors come from the acoustic conditions, not from the vocabulary: the same words are recognized in quiet rooms. Audio data with reference transcriptions is the custom speech training data that improves accuracy for specific audio conditions, and the model must be deployed to a custom endpoint to be used in real time.
    fr: |
      Les erreurs viennent des conditions acoustiques, pas du vocabulaire : les mêmes mots sont reconnus dans des pièces calmes. L'audio accompagné de transcriptions de référence est la donnée d'entraînement de la reconnaissance vocale personnalisée qui améliore la précision dans des conditions audio précises, et le modèle doit être déployé sur un point de terminaison personnalisé pour être utilisé en temps réel.
  options:
    a:
      en: |
        Plain text adds domain vocabulary, but the part codes are already recognized in quiet recordings; text data does not adapt the model to noise.
      fr: |
        Le texte brut ajoute du vocabulaire métier, mais les références de pièces sont déjà reconnues dans les enregistrements calmes ; les données textuelles n'adaptent pas le modèle au bruit.
    b:
      en: |
        A phrase list only biases recognition toward listed words; it cannot compensate for the noise, and the list already failed to help.
      fr: |
        Une liste d'expressions ne fait qu'orienter la reconnaissance vers les mots listés ; elle ne compense pas le bruit, et la liste n'a déjà rien apporté.
    d:
      en: |
        Language identification detects the spoken language; the language is known and the problem is the acoustic environment.
      fr: |
        L'identification de la langue détecte la langue parlée ; la langue est connue et le problème vient de l'environnement acoustique.
references:
  - title: What is custom speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview
