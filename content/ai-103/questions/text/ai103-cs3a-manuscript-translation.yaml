id: ai103-cs3a-manuscript-translation
objective: "4.1.3"
type: single
caseStudy: ai103-cs3a-lucerne
difficulty: 2
status: draft
stem:
  en: |
    You need to implement the translation of a manuscript into French. The solution must meet the translation requirement and minimize development effort. What should you implement?
  fr: |
    Vous devez implémenter la traduction d'un manuscrit en français. La solution doit satisfaire l'exigence de traduction et réduire au minimum l'effort de développement. Que devez-vous implémenter ?
body:
  options:
    - id: a
      text:
        en: "A synchronous document translation request for each chapter file, with the terminology list added to each request"
        fr: "Une demande de traduction de document synchrone pour chaque fichier de chapitre, avec la liste terminologique ajoutée à chaque demande"
    - id: b
      text:
        en: "A loop that extracts the text of each chapter and sends it to vision-chat with the terminology list in the system message"
        fr: "Une boucle qui extrait le texte de chaque chapitre et l'envoie à vision-chat avec la liste terminologique dans le message système"
    - id: c
      text:
        en: "A batch document translation request with the manuscripts and editions containers as source and target, and the terminology list as a glossary"
        fr: "Une demande de traduction de documents par lots avec les conteneurs manuscripts et editions comme source et cible, et la liste terminologique comme glossaire"
    - id: d
      text:
        en: "Text translation requests for each paragraph of the chapters, followed by code that rebuilds the .docx files"
        fr: "Des demandes de traduction de texte pour chaque paragraphe des chapitres, suivies de code qui reconstruit les fichiers .docx"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Asynchronous (batch) document translation in Azure Translator processes many files in one request, reading them from a source Blob Storage container and writing the results to a target container. It preserves the document structure and layout, and it can apply a custom glossary in CSV format so that the approved terms are always used.
    fr: |
      La traduction de documents asynchrone (par lots) d'Azure Translator traite de nombreux fichiers dans une seule demande, en les lisant dans un conteneur source du Stockage Blob et en écrivant les résultats dans un conteneur cible. Elle conserve la structure et la mise en page des documents, et elle peut appliquer un glossaire personnalisé au format CSV afin que les termes approuvés soient toujours utilisés.
  options:
    a:
      en: |
        Synchronous document translation handles a single file per request, so the 20 to 30 chapter files could not be submitted in a single request.
      fr: |
        La traduction de documents synchrone traite un seul fichier par demande : les 20 à 30 fichiers de chapitre ne pourraient pas être soumis dans une seule demande.
    b:
      en: |
        Sending extracted text to a chat model loses the .docx layout, and rebuilding the files requires custom code.
      fr: |
        Envoyer le texte extrait à un modèle de conversation fait perdre la mise en page .docx, et reconstruire les fichiers exige du code personnalisé.
    d:
      en: |
        Text translation works on plain text; rebuilding the files and their layout is custom development that document translation already performs.
      fr: |
        La traduction de texte travaille sur du texte brut ; reconstruire les fichiers et leur mise en page est du développement personnalisé que la traduction de documents effectue déjà.
references:
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
