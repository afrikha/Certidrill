id: ai103-4b-agent-mode-facts
objective: "4.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Foundry Agent Service agent named claims-agent in a Foundry project named fabrikam-claims. The agent has instructions and tools.

    A Python application will give the agent a voice by calling `connect()` from the `azure-ai-voicelive` package with the `agent_name` and `project_name` parameters.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'un agent Foundry Agent Service nommé claims-agent dans un projet Foundry nommé fabrikam-claims. L'agent possède des instructions et des outils.

    Une application Python va donner une voix à l'agent en appelant `connect()` du package `azure-ai-voicelive` avec les paramètres `agent_name` et `project_name`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "If the application omits `agent_version`, the latest version of claims-agent is used.", fr: "Si l'application omet `agent_version`, la dernière version de claims-agent est utilisée." } }
    - { id: b, text: { en: "The application can authenticate with the API key of the Foundry resource.", fr: "L'application peut s'authentifier avec la clé API de la ressource Foundry." } }
    - { id: c, text: { en: "The voice and turn detection settings can be stored in the metadata of claims-agent instead of being sent by the application.", fr: "Les paramètres de voix et de détection de fin de tour peuvent être stockés dans les métadonnées de claims-agent au lieu d'être envoyés par l'application." } }
    - { id: d, text: { en: "The application can replace the instructions of claims-agent by sending the `instructions` property in `session.update`.", fr: "L'application peut remplacer les instructions de claims-agent en envoyant la propriété `instructions` dans `session.update`." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      `agent_version` is optional: when it is omitted, the latest version of the agent is used. The Voice Live configuration (voice, transcription, turn detection, noise reduction) can be stored in the agent's metadata, so the client does not have to send it.
    fr: |
      `agent_version` est facultatif : quand il est omis, la dernière version de l'agent est utilisée. La configuration Voice Live (voix, transcription, détection de fin de tour, réduction du bruit) peut être stockée dans les métadonnées de l'agent : le client n'a pas à l'envoyer.
  options:
    b:
      en: |
        The agent integration requires Microsoft Entra ID authentication; key-based authentication isn't supported in agent mode.
      fr: |
        L'intégration avec un agent exige l'authentification Microsoft Entra ID ; l'authentification par clé n'est pas prise en charge en mode agent.
    d:
      en: |
        The `instructions` property isn't supported when Voice Live uses a custom agent: the agent keeps its own instructions.
      fr: |
        La propriété `instructions` n'est pas prise en charge quand Voice Live utilise un agent personnalisé : l'agent conserve ses propres instructions.
references:
  - title: "Quickstart: Voice Agent with Foundry Agent Service (new)"
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-agents-quickstart?pivots=programming-language-python
  - title: How to use the Voice Live API
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to
