id: ai103-cs1c-catalog-json
objective: "4.1.1"
type: dropdown
caseStudy: ai103-cs1c-margiestravel
difficulty: 3
status: draft
stem:
  en: |
    You are writing the Responses API request that produces the chapter metadata. You need to meet the catalog metadata requirement. How should you complete the request body? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la requête de l'API Responses qui produit les métadonnées des chapitres. Vous devez satisfaire l'exigence relative aux métadonnées du catalogue. Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "text": {
      "format": {
        "type": "[[type]]",
        "name": "ChapterMetadata",
        "strict": true,
        "schema": {
          "type": "object",
          "properties": {
            "title": { "type": "string" },
            "places": { "type": "array", "items": { "type": "string" } },
            "summary": { "type": "string" },
            "region": { "type": [[region]] }
          },
          "required": [[required]],
          "additionalProperties": false
        }
      }
    }
  slots:
    - id: type
      options:
        - { id: jsonobject, text: "json_object" }
        - { id: jsonschema, text: "json_schema" }
        - { id: text, text: "text" }
    - id: region
      options:
        - { id: string, text: "\"string\"" }
        - { id: nullable, text: "[\"string\", \"null\"]" }
        - { id: object, text: "\"object\"" }
    - id: required
      options:
        - { id: three, text: "[\"title\", \"places\", \"summary\"]" }
        - { id: four, text: "[\"title\", \"places\", \"summary\", \"region\"]" }
        - { id: none, text: "[]" }
answer:
  values: { type: jsonschema, region: nullable, required: four }
explanation:
  correct:
    en: |
      Structured outputs use a `format` of type `json_schema` with `strict` set to true, so the model follows the supplied schema. In strict mode every field must be listed as required, and an optional value is emulated with a union type that includes null, which returns null for chapters without a single region.
    fr: |
      Les sorties structurées utilisent un `format` de type `json_schema` avec `strict` défini sur true, pour que le modèle respecte le schéma fourni. En mode strict, chaque champ doit figurer dans les champs requis, et une valeur facultative est émulée par un type union qui inclut null, ce qui renvoie null pour les chapitres sans région unique.
  options:
    jsonobject:
      en: |
        JSON mode guarantees valid JSON but does not ensure strict adherence to a schema.
      fr: |
        Le mode JSON garantit un JSON valide, mais n'assure pas le strict respect d'un schéma.
    string:
      en: |
        A plain string type cannot hold null, so chapters without a single region could not return null.
      fr: |
        Un simple type string ne peut pas contenir null : les chapitres sans région unique ne pourraient pas renvoyer null.
    three:
      en: |
        Strict mode requires every property to be listed as required; leaving region out is not allowed.
      fr: |
        Le mode strict exige que chaque propriété figure dans les champs requis ; omettre region n'est pas autorisé.
references:
  - title: Structured outputs
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
