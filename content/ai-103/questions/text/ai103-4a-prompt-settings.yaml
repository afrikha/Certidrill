id: ai103-4a-prompt-settings
objective: "4.1.4"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders uses a model deployment to produce compliance summaries of internal policy changes. A workflow reads each summary, including a requiresLegalReview field. The current request settings are shown in the following table.

    Reviewers report two problems. Answer each prompt by selecting the setting that you should change to fix the problem.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise un déploiement de modèle pour produire des synthèses de conformité des changements de stratégies internes. Un workflow lit chaque synthèse, y compris un champ requiresLegalReview. Les paramètres actuels de la requête figurent dans le tableau suivant.

    Les relecteurs signalent deux problèmes. Répondez à chaque consigne en sélectionnant le paramètre à modifier pour résoudre le problème.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Some summaries omit the requiresLegalReview field, and the workflow fails.", fr: "Certaines synthèses omettent le champ requiresLegalReview, et le workflow échoue." }
    - id: p2
      text: { en: "Obligations from the last sections of long policy documents never appear in the summaries.", fr: "Les obligations des dernières sections des longs documents de stratégie n'apparaissent jamais dans les synthèses." }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Current value", fr: "Valeur actuelle" }]
    rows:
      - [{ text: Instructions, area: instructions }, { text: { en: "Summarize the policy change for the compliance team. List each obligation with its clause number.", fr: "Summarize the policy change for the compliance team. List each obligation with its clause number." } }]
      - [{ text: { en: "Few-shot examples", fr: "Exemples few-shot" }, area: examples }, { text: { en: "None", fr: "Aucun" } }]
      - [{ text: { en: "Response format", fr: "Format de réponse" }, area: format }, { text: '{"type": "json_object"}' }]
      - [{ text: { en: "Source text", fr: "Texte source" }, area: source }, { text: { en: "The first 2,000 characters of the policy document", fr: "Les 2 000 premiers caractères du document de stratégie" } }]
      - [{ text: { en: "Temperature", fr: "Température" }, area: temperature }, { text: "0.2" }]
answer:
  values: { p1: format, p2: source }
explanation:
  correct:
    en: |
      `json_object` is JSON mode, which guarantees valid JSON but not the schema, so required fields can be missing; a `json_schema` format with strict set to true fixes it. The model receives only the first 2,000 characters of each policy, so it can't summarize obligations in the later sections; the source text must include the whole document or the retrieved sections that contain the obligations.
    fr: |
      `json_object` correspond au mode JSON, qui garantit un JSON valide mais pas le schéma : des champs obligatoires peuvent manquer, et un format `json_schema` avec strict défini sur true corrige le problème. Le modèle ne reçoit que les 2 000 premiers caractères de chaque stratégie : il ne peut pas résumer les obligations des sections suivantes, et le texte source doit inclure tout le document ou les sections récupérées qui contiennent les obligations.
  options:
    instructions:
      en: |
        The instructions already ask for each obligation; they can't make the model see text that isn't in the request.
      fr: |
        Les instructions demandent déjà chaque obligation ; elles ne peuvent pas faire voir au modèle un texte absent de la requête.
    temperature:
      en: |
        A temperature of 0.2 already gives focused output; changing it doesn't enforce a schema or add source text.
      fr: |
        Une température de 0,2 donne déjà une sortie ciblée ; la modifier n'impose pas de schéma et n'ajoute pas de texte source.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
