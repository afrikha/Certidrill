id: ai103-4a-translate-body
objective: "4.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam Shipping sends notifications to `POST https://fabrikam-tr.cognitiveservices.azure.com/translator/text/translate?api-version=2026-06-06`. An LLM deployment named translate-llm is available to the Translator resource. Each notification must meet the following requirements:

    - The Spanish translation uses translate-llm with a formal tone.
    - If translate-llm doesn't support the language pair, the request returns an error instead of falling back to a general system.
    - The French translation uses the standard NMT engine.

    How should you complete the request body? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Shipping envoie des notifications à `POST https://fabrikam-tr.cognitiveservices.azure.com/translator/text/translate?api-version=2026-06-06`. Un déploiement LLM nommé translate-llm est disponible pour la ressource Translator. Chaque notification doit satisfaire les exigences suivantes :

    - La traduction en espagnol utilise translate-llm avec un ton formel.
    - Si translate-llm ne prend pas en charge la paire de langues, la requête renvoie une erreur au lieu de se rabattre sur un système général.
    - La traduction en français utilise le moteur NMT standard.

    Comment devez-vous compléter le corps de la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "[[root]]": [
        {
          "text": "Your parcel has shipped. You can track it in your account.",
          "language": "en",
          "targets": [
            {
              "language": "es",
              "deploymentName": "[[engine]]",
              "tone": "formal",
              "allowFallback": [[fallback]]
            },
            { "language": "fr" }
          ]
        }
      ]
    }
  slots:
    - id: root
      options:
        - { id: value, text: value }
        - { id: inputs, text: inputs }
        - { id: text, text: Text }
    - id: engine
      options:
        - { id: general, text: general }
        - { id: formal, text: formal }
        - { id: llm, text: translate-llm }
    - id: fallback
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
answer:
  values: { root: inputs, engine: llm, fallback: "false" }
explanation:
  correct:
    en: |
      In version 2026-06-06, the request array is `inputs`, and each input has a `targets` array. `deploymentName` selects the engine per target: the name of an LLM deployment, or `general` (the default) for NMT, which the French target uses by omitting it. `allowFallback` defaults to true; set to false, the service returns an error instead of falling back to a general system when the chosen model doesn't support the language pair.
    fr: |
      Dans la version 2026-06-06, le tableau de la requête est `inputs`, et chaque entrée contient un tableau `targets`. `deploymentName` choisit le moteur par cible : le nom d'un déploiement LLM, ou `general` (par défaut) pour la NMT, que la cible française utilise en l'omettant. `allowFallback` vaut true par défaut ; défini sur false, le service renvoie une erreur au lieu de se rabattre sur un système général quand le modèle choisi ne prend pas en charge la paire de langues.
  options:
    root:
      en: |
        `value` is the array of the response, not of the request, and `Text` is the v3.0 request format.
      fr: |
        `value` est le tableau de la réponse, pas de la requête, et `Text` correspond au format de requête v3.0.
    engine:
      en: |
        `general` selects NMT, which ignores the tone, and `formal` is a value of `tone`, not an engine.
      fr: |
        `general` sélectionne la NMT, qui ignore le ton, et `formal` est une valeur de `tone`, pas un moteur.
references:
  - title: Azure Translator in Foundry Tools 2026-06-06 translate method
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/2026-06-06/translate-api
