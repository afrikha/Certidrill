difficulty: 1
status: draft
stem:
  en: A paralegal translates each contract in the Foundry portal every morning.
  fr: Un assistant juridique traduit chaque contrat dans le portail Foundry tous les matins.
body:
  solution:
    en: |
      Every morning, a paralegal opens document translation in the Foundry portal, uploads each contract of contracts-en, selects French and then German as the target language, downloads the translated files, and uploads them to contracts-out.
    fr: |
      Tous les matins, un assistant juridique ouvre la traduction de documents dans le portail Foundry, charge chaque contrat de contracts-en, sélectionne le français puis l'allemand comme langue cible, télécharge les fichiers traduits et les charge dans contracts-out.
answer: { value: false }
explanation:
  correct:
    en: The Foundry portal supports only synchronous translation of one file at a time, so this process depends on a person and is not an unattended nightly job. Processing about 300 files a day requires an asynchronous batch request submitted through the REST API or a client SDK.
    fr: "Le portail Foundry prend en charge uniquement la traduction synchrone d'un fichier à la fois : ce processus dépend d'une personne et n'est pas un travail nocturne sans intervention humaine. Le traitement d'environ 300 fichiers par jour nécessite une demande par lots asynchrone soumise au moyen de l'API REST ou d'un SDK client."
references:
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
