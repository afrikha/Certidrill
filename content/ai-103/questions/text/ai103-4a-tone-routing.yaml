id: ai103-4a-tone-routing
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank routes incoming customer messages to different teams based on their tone. Each message must receive exactly one label from the list formal, sarcastic, urgent or threatening, together with a one-sentence justification. The bank has no labeled examples for these labels. The solution must use services available in Microsoft Foundry.

    What should you use?
  fr: |
    Woodgrove Bank achemine les messages entrants des clients vers différentes équipes en fonction de leur ton. Chaque message doit recevoir exactement une étiquette parmi formal, sarcastic, urgent ou threatening, accompagnée d'une justification d'une phrase. La banque ne dispose d'aucun exemple étiqueté pour ces étiquettes. La solution doit utiliser des services disponibles dans Microsoft Foundry.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A model deployment with structured outputs, with a tone field defined as an enum of the four labels", fr: "Un déploiement de modèle avec des sorties structurées, avec un champ de ton défini comme un enum des quatre étiquettes" } }
    - { id: b, text: { en: "Azure Language sentiment analysis, with opinion mining enabled on each message", fr: "L'analyse des sentiments d'Azure Language, avec l'exploration d'opinions activée sur chaque message" } }
    - { id: c, text: { en: "Azure AI Content Safety text analysis, with the Hate and Violence categories", fr: "L'analyse de texte d'Azure AI Content Safety, avec les catégories Hate et Violence" } }
    - { id: d, text: { en: "Azure Language custom text classification, with a single-label project for the four labels", fr: "La classification de texte personnalisée d'Azure Language, avec un projet à étiquette unique pour les quatre étiquettes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      No Foundry Tool returns a tone label from your own list. A model classifies the message from the label definitions in its instructions, and a strict schema with an `enum` field guarantees that the label is one of the four values, with the justification in a second field.
    fr: |
      Aucun outil de Foundry Tools ne renvoie une étiquette de ton issue de votre propre liste. Un modèle classe le message à partir des définitions des étiquettes données dans ses instructions, et un schéma strict avec un champ `enum` garantit que l'étiquette est l'une des quatre valeurs, avec la justification dans un second champ.
  options:
    b:
      en: |
        Sentiment analysis returns positive, neutral or negative, and opinion mining links sentiment to aspects of the text; neither returns tone labels such as sarcastic or urgent.
      fr: |
        L'analyse des sentiments renvoie positif, neutre ou négatif, et l'exploration d'opinions lie le sentiment à des aspects du texte ; aucune ne renvoie d'étiquettes de ton comme sarcastic ou urgent.
    c:
      en: |
        Content Safety returns severity levels for harm categories; it can't label a message as formal, sarcastic or urgent.
      fr: |
        Content Safety renvoie des niveaux de gravité pour des catégories de préjudice ; il ne peut pas étiqueter un message comme formal, sarcastic ou urgent.
    d:
      en: |
        Custom text classification trains a model on labeled documents, which the bank doesn't have, and it's a legacy feature.
      fr: |
        La classification de texte personnalisée entraîne un modèle sur des documents étiquetés, dont la banque ne dispose pas, et c'est une fonctionnalité héritée.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
  - title: What is Azure Language in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview
