id: ai103-4a-domain-facts
objective: "4.1.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum Pharma customizes a model deployment in Microsoft Foundry to summarize regulatory guidance for its quality team. The guidance documents change several times a year.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Pharma personnalise un déploiement de modèle dans Microsoft Foundry pour résumer des recommandations réglementaires destinées à son équipe qualité. Les documents de recommandations changent plusieurs fois par an.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Few-shot examples included in a request permanently change how the deployed model responds to later requests.
        fr: Les exemples few-shot inclus dans une requête modifient de façon permanente la façon dont le modèle déployé répond aux requêtes suivantes.
    - id: s2
      text:
        en: Fine-tuning the model on this year's guidance replaces the need to provide the current guidance documents in each request.
        fr: Un réglage fin du modèle sur les recommandations de cette année évite de fournir les documents de recommandations actuels dans chaque requête.
    - id: s3
      text:
        en: A low temperature, such as 0.2, produces more focused output, which suits summaries of regulatory documents.
        fr: Une température basse, comme 0,2, produit une sortie plus ciblée, adaptée aux synthèses de documents réglementaires.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Few-shot examples condition the model only for the current inference; they don't change the model. Fine-tuning doesn't replace retrieval for current information, so the latest guidance must still be provided as grounding data. Lower temperature values give more focused and concrete output, which suits legal and regulatory text.
    fr: |
      Les exemples few-shot ne conditionnent le modèle que pour l'inférence en cours ; ils ne modifient pas le modèle. Le réglage fin ne remplace pas la récupération pour les informations à jour : les dernières recommandations doivent toujours être fournies comme données d'ancrage. Des températures plus basses donnent une sortie plus ciblée et concrète, adaptée aux textes juridiques et réglementaires.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/fine-tuning-considerations
