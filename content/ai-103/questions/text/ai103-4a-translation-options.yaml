id: ai103-4a-translation-options
objective: "4.1.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Aerospace has several translation requirements, as shown in the following list.

    What should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Aerospace a plusieurs exigences de traduction, comme l'indique la liste suivante.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pairs, text: { en: "referenceTextPairs in a 2026-06-06 request that uses an LLM deployment", fr: "referenceTextPairs dans une requête 2026-06-06 qui utilise un déploiement LLM" } }
    - { id: custom, text: { en: "Custom Translator", fr: "Custom Translator" } }
    - { id: batch, text: { en: "Asynchronous batch document translation", fr: "La traduction de documents asynchrone par lots" } }
    - { id: sync, text: { en: "Synchronous document translation", fr: "La traduction de documents synchrone" } }
    - { id: dictionary, text: { en: "A dynamic dictionary in text translation v3", fr: "Un dictionnaire dynamique dans la traduction de texte v3" } }
    - { id: model, text: { en: "A model prompt with a structured output", fr: "Une invite de modèle avec une sortie structurée" } }
  targets:
    - { id: t1, text: { en: "Pass three approved example translations with each request so that the output follows their style", fr: "Transmettre trois exemples de traductions approuvées avec chaque requête pour que la sortie suive leur style" } }
    - { id: t2, text: { en: "Build a neural translation model trained on parallel documents from Adatum's maintenance manuals", fr: "Créer un modèle de traduction neuronale entraîné sur des documents parallèles issus des manuels de maintenance d'Adatum" } }
    - { id: t3, text: { en: "Translate 3,000 scanned PDF files from a storage container every night, keeping their layout", fr: "Traduire chaque nuit 3 000 fichiers PDF numérisés d'un conteneur de stockage, en conservant leur mise en page" } }
    - { id: t4, text: { en: "Return the English translation, a summary and a priority of each support email in one JSON object", fr: "Renvoyer la traduction en anglais, un résumé et une priorité de chaque e-mail de support dans un seul objet JSON" } }
answer:
  mapping: { t1: pairs, t2: custom, t3: batch, t4: model }
explanation:
  correct:
    en: |
      In version 2026-06-06, `referenceTextPairs` passes up to five source and target examples that influence the style and terminology of LLM translation. Custom Translator builds custom NMT models from parallel documents for domain terminology and style. Batch document translation processes files from Blob containers, keeps the layout, and uses OCR for scanned PDF files. A model prompt with a structured output can translate, summarize and classify in one call.
    fr: |
      Dans la version 2026-06-06, `referenceTextPairs` transmet jusqu'à cinq exemples source et cible qui influencent le style et la terminologie de la traduction LLM. Custom Translator crée des modèles NMT personnalisés à partir de documents parallèles pour la terminologie et le style d'un domaine. La traduction de documents par lots traite des fichiers de conteneurs Blob, conserve la mise en page et utilise l'OCR pour les fichiers PDF numérisés. Une invite de modèle avec une sortie structurée peut traduire, résumer et classer en un seul appel.
  options:
    sync:
      en: |
        Synchronous document translation handles one file per request without Blob Storage; it doesn't suit a nightly batch of 3,000 files in a container.
      fr: |
        La traduction de documents synchrone traite un fichier par requête sans stockage Blob ; elle ne convient pas à un lot nocturne de 3 000 fichiers dans un conteneur.
    dictionary:
      en: |
        A dynamic dictionary prescribes the translation of specific words in a request; it doesn't apply the style of example sentences.
      fr: |
        Un dictionnaire dynamique impose la traduction de mots précis dans une requête ; il n'applique pas le style d'exemples de phrases.
references:
  - title: What is Azure Translator in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/overview
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
