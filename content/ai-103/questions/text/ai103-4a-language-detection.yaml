id: ai103-4a-language-detection
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Pharmaceuticals receives customer emails in about 20 languages. Before entity extraction, a pipeline must identify the language of each email, with a confidence score, and route the email to the matching regional queue. The pipeline already uses Azure Translator text translation 2026-06-06 for other tasks.

    What should you use to identify the language of each email?
  fr: |
    Contoso Pharmaceuticals reçoit des e-mails de clients dans une vingtaine de langues. Avant l'extraction des entités, un pipeline doit identifier la langue de chaque e-mail, avec un score de confiance, et acheminer l'e-mail vers la file d'attente régionale correspondante. Le pipeline utilise déjà la traduction de texte 2026-06-06 d'Azure Translator pour d'autres tâches.

    Que devez-vous utiliser pour identifier la langue de chaque e-mail ?
body:
  options:
    - { id: a, text: { en: "The language detection feature of Azure Language", fr: "La fonctionnalité de détection de langue d'Azure Language" } }
    - { id: b, text: { en: "The Detect operation of Azure Translator text translation 2026-06-06", fr: "L'opération Detect de la traduction de texte 2026-06-06 d'Azure Translator" } }
    - { id: c, text: { en: "The Transliterate operation of Azure Translator text translation 2026-06-06", fr: "L'opération Transliterate de la traduction de texte 2026-06-06 d'Azure Translator" } }
    - { id: d, text: { en: "The prebuilt named entity recognition feature of Azure Language", fr: "La fonctionnalité de reconnaissance d'entités nommées prédéfinie d'Azure Language" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Language detection is a core Azure Language feature that detects a wide range of languages and dialects and returns the detected language with a confidence score. Microsoft points to it as the replacement for the Translator Detect operation.
    fr: |
      La détection de langue est une fonctionnalité principale d'Azure Language qui détecte un large éventail de langues et de dialectes et renvoie la langue détectée avec un score de confiance. Microsoft l'indique comme remplacement de l'opération Detect de Translator.
  options:
    b:
      en: |
        The Detect operation of text translation v3 was removed in version 2026-06-06; the migration guide redirects to Azure Language detection.
      fr: |
        L'opération Detect de la traduction de texte v3 a été supprimée dans la version 2026-06-06 ; le guide de migration renvoie vers la détection de langue d'Azure Language.
    c:
      en: |
        Transliterate converts text from one writing system to another; it doesn't identify the language.
      fr: |
        Transliterate convertit un texte d'un système d'écriture à un autre ; elle n'identifie pas la langue.
    d:
      en: |
        Named entity recognition categorizes entities such as people and places; it doesn't return the language of the text.
      fr: |
        La reconnaissance d'entités nommées classe des entités comme des personnes et des lieux ; elle ne renvoie pas la langue du texte.
references:
  - title: What is Azure Language in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview
  - title: Migrate to Translator Text API 2026-06-06
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/how-to/migrate-to-2026-06-06
