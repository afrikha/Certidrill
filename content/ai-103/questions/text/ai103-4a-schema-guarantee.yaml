id: ai103-4a-schema-guarantee
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam Logistics builds a Python app that reads customer emails and sends the extracted data to an internal shipping API. The API rejects every payload that doesn't match its JSON schema. The app calls a gpt-4.1 deployment in a Microsoft Foundry project.

    You need every response from the model to match the schema of the shipping API.

    What should you use?
  fr: |
    Fabrikam Logistics crée une application Python qui lit les e-mails des clients et envoie les données extraites à une API d'expédition interne. L'API rejette toute charge utile qui ne respecte pas son schéma JSON. L'application appelle un déploiement gpt-4.1 dans un projet Microsoft Foundry.

    Chaque réponse du modèle doit respecter le schéma de l'API d'expédition.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "JSON mode, with the response format set to json_object", fr: "Le mode JSON, avec le format de réponse défini sur json_object" } }
    - { id: b, text: { en: "Structured outputs, with the schema supplied and strict set to true", fr: "Les sorties structurées, avec le schéma fourni et strict défini sur true" } }
    - { id: c, text: { en: "Instructions that contain the schema and ask for JSON output only", fr: "Des instructions qui contiennent le schéma et demandent uniquement une sortie JSON" } }
    - { id: d, text: { en: "A temperature of 0, with the schema included in the instructions", fr: "Une température de 0, avec le schéma inclus dans les instructions" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Structured outputs make the model follow the JSON schema you supply, so each response has the fields and types the API expects. You pass the schema in the request (for example as a Pydantic model or a json_schema format with strict set to true) instead of describing it in the prompt.
    fr: |
      Les sorties structurées obligent le modèle à suivre le schéma JSON que vous fournissez : chaque réponse contient les champs et les types attendus par l'API. Vous transmettez le schéma dans la requête (par exemple sous forme de modèle Pydantic ou de format json_schema avec strict défini sur true) au lieu de le décrire dans l'invite.
  options:
    a:
      en: |
        JSON mode guarantees syntactically valid JSON, but it can't ensure that the output adheres to a specific schema.
      fr: |
        Le mode JSON garantit un JSON syntaxiquement valide, mais il ne peut pas garantir que la sortie respecte un schéma précis.
    c:
      en: |
        A schema described in the prompt is only a request to the model; nothing enforces it, so fields can be missing or renamed.
      fr: |
        Un schéma décrit dans l'invite n'est qu'une demande faite au modèle ; rien ne l'impose, et des champs peuvent manquer ou être renommés.
    d:
      en: |
        A low temperature makes the output more focused and repeatable, but it doesn't force the model to follow a schema.
      fr: |
        Une température basse rend la sortie plus ciblée et plus reproductible, mais elle n'oblige pas le modèle à suivre un schéma.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
