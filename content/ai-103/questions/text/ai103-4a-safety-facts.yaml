id: ai103-4a-safety-facts
objective: "4.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses the analyze text API of Azure AI Content Safety to moderate product reviews before they're published. The team also maintains a custom text blocklist of banned terms that it updates every week.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders utilise l'API d'analyse de texte d'Azure AI Content Safety pour modérer les avis sur les produits avant leur publication. L'équipe gère aussi une liste de blocage de texte personnalisée de termes interdits qu'elle met à jour chaque semaine.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With outputType set to FourSeverityLevels, the severities returned are 0, 2, 4 and 6.
        fr: Avec outputType défini sur FourSeverityLevels, les gravités renvoyées sont 0, 2, 4 et 6.
    - id: s2
      text:
        en: If the request omits the categories field, the service analyzes the review only for the Hate category.
        fr: Si la requête omet le champ categories, le service analyse l'avis uniquement pour la catégorie Hate.
    - id: s3
      text:
        en: After the team adds terms to the blocklist, text analysis can take a few minutes to apply the new terms.
        fr: Après l'ajout de termes à la liste de blocage par l'équipe, l'analyse de texte peut mettre quelques minutes à appliquer les nouveaux termes.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      FourSeverityLevels, the default output type, returns the severities 0, 2, 4 and 6; EightSeverityLevels returns 0 to 7. When `categories` is omitted, all four harm categories (Hate, Sexual, SelfHarm and Violence) are analyzed. Changes to blocklists and their items usually take effect in text analysis within five minutes, so a test right after an update can miss a new term.
    fr: |
      FourSeverityLevels, le type de sortie par défaut, renvoie les gravités 0, 2, 4 et 6 ; EightSeverityLevels renvoie 0 à 7. Quand `categories` est omis, les quatre catégories de préjudice (Hate, Sexual, SelfHarm et Violence) sont analysées. Les modifications des listes de blocage et de leurs éléments prennent généralement effet dans l'analyse de texte en cinq minutes au plus : un test effectué juste après une mise à jour peut donc manquer un nouveau terme.
references:
  - title: "Quickstart: Analyze text content"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-text
  - title: Use blocklists for text moderation
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/how-to/use-blocklist
