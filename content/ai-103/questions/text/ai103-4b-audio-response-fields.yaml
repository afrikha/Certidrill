id: ai103-4b-audio-response-fields
objective: "4.2.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A Northwind Traders assistant sends a customer's recorded question to a gpt-audio-mini deployment with `modalities=["text", "audio"]` and `audio={"voice": "alloy", "format": "wav"}`. The application reads the fields of `completion.choices[0].message` shown in the following table.

    Answer each prompt by selecting the appropriate field.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un assistant de Northwind Traders envoie la question enregistrée d'un client à un déploiement gpt-audio-mini avec `modalities=["text", "audio"]` et `audio={"voice": "alloy", "format": "wav"}`. L'application lit les champs de `completion.choices[0].message` présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le champ approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The field that you decode from base64 and save as a WAV file", fr: "Le champ que vous décodez depuis le base64 et enregistrez sous forme de fichier WAV" }
    - id: p2
      text: { en: "The field whose value you add to the next assistant message so that the spoken answer stays in the conversation history", fr: "Le champ dont vous ajoutez la valeur au message assistant suivant pour que la réponse parlée reste dans l'historique de la conversation" }
  grid:
    header: [{ en: "Field", fr: "Champ" }]
    rows:
      - [{ text: message.refusal, area: refusal }]
      - [{ text: message.tool_calls, area: tools }]
      - [{ text: message.audio.id, area: id }]
      - [{ text: message.audio.data, area: data }]
      - [{ text: message.audio.transcript, area: transcript }]
answer:
  values: { p1: data, p2: id }
explanation:
  correct:
    en: |
      `message.audio.data` contains the base64-encoded audio of the answer, which you decode before writing the WAV file. In a multi-turn chat, the next request adds an assistant message that references the earlier answer by `audio.id`. `message.audio.transcript` holds the text of the spoken answer, which is useful for logs but does not keep the audio in the history.
    fr: |
      `message.audio.data` contient l'audio de la réponse encodé en base64, que vous décodez avant d'écrire le fichier WAV. Dans une conversation à plusieurs tours, la requête suivante ajoute un message assistant qui référence la réponse précédente par `audio.id`. `message.audio.transcript` contient le texte de la réponse parlée, utile pour les journaux, mais il ne conserve pas l'audio dans l'historique.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart
