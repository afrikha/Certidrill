id: ai103-4a-language-features
objective: "4.1.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware plans a new text-analysis solution that uses Azure Language in Foundry Tools to extract information from customer documents and to provide language features to a Foundry agent.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit une nouvelle solution d'analyse de texte qui utilise Azure Language dans Foundry Tools pour extraire des informations de documents clients et pour fournir des fonctionnalités de langage à un agent Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Key phrase extraction is one of the Azure Language features recommended for new development.
        fr: L'extraction d'expressions clés fait partie des fonctionnalités d'Azure Language recommandées pour les nouveaux développements.
    - id: s2
      text:
        en: The Azure Language MCP server is available as a remote server in the Foundry Tool Catalog, so an agent can call Azure Language features as tools.
        fr: Le serveur MCP Azure Language est disponible comme serveur distant dans le catalogue d'outils Foundry, ce qui permet à un agent d'appeler les fonctionnalités d'Azure Language comme des outils.
    - id: s3
      text:
        en: Azure Language text summarization supports both extractive and abstractive summaries.
        fr: Le résumé de texte d'Azure Language prend en charge les résumés extractifs et abstractifs.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Azure Language lists PII detection, language detection, NER and Text Analytics for health as core capabilities for new development; key phrase extraction is in the legacy group, supported for existing implementations. The Azure Language MCP server (preview) connects agents to Azure Language through the Model Context Protocol, as a remote server in the Foundry Tool Catalog or as a local server. Text summarization offers extractive summaries (key sentences selected) and abstractive summaries (new sentences generated), although summarization is also a legacy feature.
    fr: |
      Azure Language présente la détection des PII, la détection de langue, la NER et Text Analytics for health comme fonctionnalités principales pour les nouveaux développements ; l'extraction d'expressions clés fait partie du groupe hérité, pris en charge pour les implémentations existantes. Le serveur MCP Azure Language (préversion) connecte des agents à Azure Language par le Model Context Protocol, comme serveur distant dans le catalogue d'outils Foundry ou comme serveur local. Le résumé de texte propose des résumés extractifs (phrases clés sélectionnées) et abstractifs (nouvelles phrases générées), même si le résumé est aussi une fonctionnalité héritée.
references:
  - title: What is Azure Language in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview
