id: ai103-4a-aspect-sentiment
objective: "4.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware starts a new project that analyzes hotel reviews. For each review, the project must return a sentiment for each aspect that the guest mentions, such as room, staff and breakfast. Proseware's architecture policy forbids building new projects on features that have an announced retirement date. The project must not require training a model.

    What should you use?
  fr: |
    Proseware démarre un nouveau projet qui analyse des avis sur des hôtels. Pour chaque avis, le projet doit renvoyer un sentiment pour chaque aspect mentionné par le client, comme la chambre, le personnel et le petit-déjeuner. La stratégie d'architecture de Proseware interdit de créer de nouveaux projets sur des fonctionnalités dont la mise hors service est annoncée. Le projet ne doit pas nécessiter l'entraînement d'un modèle.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Language sentiment analysis, with opinion mining enabled", fr: "L'analyse des sentiments d'Azure Language, avec l'exploration d'opinions activée" } }
    - { id: b, text: { en: "A Foundry model deployment, with a strict schema of aspect and sentiment pairs", fr: "Un déploiement de modèle Foundry, avec un schéma strict de paires aspect et sentiment" } }
    - { id: c, text: { en: "Azure AI Content Safety, with a standard custom category for each aspect", fr: "Azure AI Content Safety, avec une catégorie personnalisée standard pour chaque aspect" } }
    - { id: d, text: { en: "Azure Language key phrase extraction, then sentiment analysis for each phrase", fr: "L'extraction d'expressions clés d'Azure Language, puis l'analyse des sentiments pour chaque expression" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sentiment analysis and opinion mining retire from Azure Language on March 31, 2029, and Microsoft directs new projects to Microsoft Foundry. A model prompted with the review and a strict schema (an array of aspect and sentiment pairs) returns aspect-level sentiment without any training.
    fr: |
      L'analyse des sentiments et l'exploration d'opinions sont mises hors service dans Azure Language le 31 mars 2029, et Microsoft oriente les nouveaux projets vers Microsoft Foundry. Un modèle qui reçoit l'avis et un schéma strict (un tableau de paires aspect et sentiment) renvoie un sentiment par aspect sans aucun entraînement.
  options:
    a:
      en: |
        Opinion mining returns aspect-based sentiment, but it retires with sentiment analysis on March 31, 2029, which the policy forbids for a new project.
      fr: |
        L'exploration d'opinions renvoie un sentiment par aspect, mais elle est mise hors service avec l'analyse des sentiments le 31 mars 2029, ce que la stratégie interdit pour un nouveau projet.
    c:
      en: |
        Content Safety custom categories detect harmful content patterns that you train or define; they don't return a sentiment, and the standard version requires training.
      fr: |
        Les catégories personnalisées de Content Safety détectent des modèles de contenu préjudiciable que vous entraînez ou définissez ; elles ne renvoient pas de sentiment, et la version standard exige un entraînement.
    d:
      en: |
        Both features are legacy, and sentiment analysis has an announced retirement date.
      fr: |
        Les deux fonctionnalités sont héritées, et la mise hors service de l'analyse des sentiments est annoncée.
references:
  - title: What is sentiment analysis and opinion mining in Azure Language service?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/sentiment-opinion-mining/overview
