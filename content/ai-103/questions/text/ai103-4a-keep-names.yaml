id: ai103-4a-keep-names
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware sells outdoor equipment online. Its catalog app translates product descriptions by using Azure Translator text translation v3. Product names such as Contoso Breeze must stay in English in every translated description, while the rest of the text is translated.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware vend des équipements de plein air en ligne. Son application de catalogue traduit les descriptions de produits à l'aide de la traduction de texte v3 d'Azure Translator. Les noms de produits comme Contoso Breeze doivent rester en anglais dans chaque description traduite, et le reste du texte doit être traduit.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set textType to html and wrap each product name in a span with the notranslate class.", fr: "Définir textType sur html et placer chaque nom de produit dans un span avec la classe notranslate." } }
    - { id: b, text: { en: "Keep textType as plain and wrap each product name in a span with the notranslate class.", fr: "Conserver textType sur plain et placer chaque nom de produit dans un span avec la classe notranslate." } }
    - { id: c, text: { en: "Set textType to html and wrap each product name in a span with the translate=\"no\" attribute.", fr: "Définir textType sur html et placer chaque nom de produit dans un span avec l'attribut translate=\"no\"." } }
    - { id: d, text: { en: "Set profanityAction to Marked and profanityMarker to Tag.", fr: "Définir profanityAction sur Marked et profanityMarker sur Tag." } }
    - { id: e, text: { en: "Call the Transliterate operation for each product name.", fr: "Appeler l'opération Transliterate pour chaque nom de produit." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Translator leaves content untranslated when it's marked with the `notranslate` class or the `translate="no"` attribute. Both methods work only when the input `textType` is set to `html`.
    fr: |
      Translator ne traduit pas le contenu marqué avec la classe `notranslate` ou l'attribut `translate="no"`. Les deux méthodes ne fonctionnent que si le `textType` de l'entrée est défini sur `html`.
  options:
    b:
      en: |
        The notranslate class is honored only when textType is html; with plain text, the markup is treated as ordinary text.
      fr: |
        La classe notranslate n'est prise en compte que si textType vaut html ; en texte brut, le balisage est traité comme du texte ordinaire.
    d:
      en: |
        These parameters control how profanity is handled in the translation; they don't protect product names.
      fr: |
        Ces paramètres contrôlent le traitement des grossièretés dans la traduction ; ils ne protègent pas les noms de produits.
    e:
      en: |
        Transliterate converts text to another writing system; it doesn't keep words unchanged inside a translation.
      fr: |
        Transliterate convertit un texte dans un autre système d'écriture ; elle ne conserve pas des mots inchangés dans une traduction.
references:
  - title: Prevent content translation - Azure Translator in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/how-to/prevent-translation
