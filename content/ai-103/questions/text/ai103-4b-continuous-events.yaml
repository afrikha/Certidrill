id: ai103-4b-continuous-events
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is building an in-store kiosk agent. The kiosk listens to the customer through the default microphone for the whole conversation.

    Only the final text of each phrase must be sent to the agent, and recognition must continue after each phrase until the session stops.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée un agent pour une borne en magasin. La borne écoute le client avec le microphone par défaut pendant toute la conversation.

    Seul le texte définitif de chaque phrase doit être envoyé à l'agent, et la reconnaissance doit se poursuivre après chaque phrase jusqu'à l'arrêt de la session.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import azure.cognitiveservices.speech as speechsdk

    speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
    speech_config.speech_recognition_language = "en-US"
    recognizer = speechsdk.SpeechRecognizer(speech_config=speech_config)

    def on_phrase(evt):
        if evt.result.reason == speechsdk.ResultReason.RecognizedSpeech:
            send_to_agent(evt.result.text)

    recognizer.[[evt]].connect(on_phrase)
    recognizer.session_stopped.connect(lambda evt: stop_kiosk())
    recognizer.[[start]]()
  slots:
    - id: evt
      options:
        - { id: recognizing, text: recognizing }
        - { id: recognized, text: recognized }
        - { id: started, text: session_started }
        - { id: canceled, text: canceled }
    - id: start
      options:
        - { id: once, text: recognize_once_async }
        - { id: cont, text: start_continuous_recognition }
        - { id: keyword, text: start_keyword_recognition }
answer:
  values: { evt: recognized, start: cont }
explanation:
  correct:
    en: |
      The `recognized` event fires with the final text of each recognized phrase, while `recognizing` fires several times with intermediate results. `start_continuous_recognition()` keeps recognizing phrase after phrase until `stop_continuous_recognition()` is called or the session stops.
    fr: |
      L'événement `recognized` se déclenche avec le texte définitif de chaque phrase reconnue, alors que `recognizing` se déclenche plusieurs fois avec des résultats intermédiaires. `start_continuous_recognition()` reconnaît une phrase après l'autre jusqu'à l'appel de `stop_continuous_recognition()` ou l'arrêt de la session.
  options:
    recognizing:
      en: "`recognizing` returns intermediate hypotheses while the customer is still speaking, so the agent would receive partial text."
      fr: "`recognizing` renvoie des hypothèses intermédiaires pendant que le client parle encore : l'agent recevrait du texte partiel."
    started:
      en: "`session_started` signals the start of the session and carries no recognized text."
      fr: "`session_started` signale le début de la session et ne contient aucun texte reconnu."
    canceled:
      en: "`canceled` reports an error or the end of the audio, not recognized phrases."
      fr: "`canceled` signale une erreur ou la fin de l'audio, pas des phrases reconnues."
    once:
      en: "`recognize_once_async` stops after a single utterance, so the conversation would not continue."
      fr: "`recognize_once_async` s'arrête après un seul énoncé : la conversation ne se poursuivrait pas."
    keyword:
      en: "`start_keyword_recognition` waits for a keyword model to be spoken; it is not needed for a conversation that is already active."
      fr: "`start_keyword_recognition` attend qu'un mot clé défini par un modèle soit prononcé ; il n'est pas utile pour une conversation déjà active."
references:
  - title: How to recognize speech
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech?pivots=programming-language-python
