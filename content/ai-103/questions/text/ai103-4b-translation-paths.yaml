id: ai103-4b-translation-paths
objective: "4.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has several translation needs for its customer-facing agents. You must choose the most appropriate solution for each need.

    Which solution should you use for each need? To answer, drag the appropriate solutions to the correct needs. Each solution may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a plusieurs besoins de traduction pour ses agents en contact avec les clients. Vous devez choisir la solution la plus appropriée pour chaque besoin.

    Quelle solution devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les solutions appropriées vers les besoins correspondants. Chaque solution peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: st, text: { en: "Speech translation with a TranslationRecognizer", fr: "La traduction vocale avec un TranslationRecognizer" } }
    - { id: llmspeech, text: { en: "Fast transcription with Azure LLM Speech (translate task)", fr: "La transcription rapide avec Azure LLM Speech (tâche translate)" } }
    - { id: translator, text: { en: "Azure Translator in Foundry Tools", fr: "Azure Translator dans Foundry Tools" } }
    - { id: llm, text: { en: "A language model prompted with the transcript", fr: "Un modèle de langage interrogé avec la transcription" } }
    - { id: batch, text: { en: "Batch transcription with diarization", fr: "La transcription par lots avec la diarisation" } }
  targets:
    - { id: t1, text: { en: "A sales representative's live speech translated into Spanish text while she speaks", fr: "La parole en direct d'une commerciale traduite en texte espagnol pendant qu'elle parle" } }
    - { id: t2, text: { en: "Stored recordings translated into English text in one request per file, with a prompt that sets the output format", fr: "Des enregistrements stockés traduits en texte anglais en une requête par fichier, avec une invite qui définit le format de sortie" } }
    - { id: t3, text: { en: "Transcripts already stored in a database translated by a dedicated translation service with predictable output", fr: "Des transcriptions déjà stockées dans une base de données traduites par un service de traduction dédié au résultat prévisible" } }
    - { id: t4, text: { en: "A transcript translated into informal Spanish and summarized in three bullet points", fr: "Une transcription traduite en espagnol familier et résumée en trois puces" } }
answer:
  mapping: { t1: st, t2: llmspeech, t3: translator, t4: llm }
explanation:
  correct:
    en: |
      Speech translation recognizes and translates live speech in one operation. Azure LLM Speech translates stored files through the fast transcription endpoint and accepts a prompt for the output format. Azure Translator translates existing text as a dedicated service. A language model is the choice when the translation must adapt the register and be combined with a summary. Batch transcription does not translate.
    fr: |
      La traduction vocale reconnaît et traduit la parole en direct en une seule opération. Azure LLM Speech traduit des fichiers stockés via le point de terminaison de transcription rapide et accepte une invite pour le format de sortie. Azure Translator traduit un texte existant en tant que service dédié. Un modèle de langage s'impose quand la traduction doit adapter le registre et être combinée à un résumé. La transcription par lots ne traduit pas.
references:
  - title: What is speech translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation
  - title: Azure LLM Speech for transcription and translation
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/llm-speech
