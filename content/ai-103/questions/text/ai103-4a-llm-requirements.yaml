id: ai103-4a-llm-requirements
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso Travel translates customer replies by using Azure Translator text translation 2026-06-06. The company has a Microsoft Foundry resource with an LLM deployment that Translator can use. The team reviews the following requirements to decide which targets must use the LLM deployment instead of the default engine.

    Which two requirements can be met only by setting deploymentName to the LLM deployment?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Travel traduit les réponses aux clients à l'aide de la traduction de texte 2026-06-06 d'Azure Translator. L'entreprise dispose d'une ressource Microsoft Foundry avec un déploiement LLM que Translator peut utiliser. L'équipe examine les exigences suivantes pour décider quelles cibles doivent utiliser le déploiement LLM au lieu du moteur par défaut.

    Quelles sont les deux exigences qui ne peuvent être satisfaites qu'en définissant deploymentName sur le déploiement LLM ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Send up to 800 short strings in a single translate request", fr: "Envoyer jusqu'à 800 chaînes courtes dans une seule requête de traduction" } }
    - { id: b, text: { en: "Translate replies into German with a formal register", fr: "Traduire les réponses en allemand avec un registre formel" } }
    - { id: c, text: { en: "Keep the translation billed per source character", fr: "Conserver une traduction facturée par caractère source" } }
    - { id: d, text: { en: "Use feminine grammatical forms in Spanish replies to female customers", fr: "Utiliser les formes grammaticales féminines dans les réponses en espagnol aux clientes" } }
    - { id: e, text: { en: "Call a Translator resource that is configured with a private endpoint", fr: "Appeler une ressource Translator configurée avec un point de terminaison privé" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      The `tone` (formal, informal, neutral) and `gender` (female, male, neutral) parameters of version 2026-06-06 are available with LLM-based translation. With the default `general` engine (NMT), they don't change the output.
    fr: |
      Les paramètres `tone` (formal, informal, neutral) et `gender` (female, male, neutral) de la version 2026-06-06 sont disponibles avec la traduction basée sur un LLM. Avec le moteur `general` par défaut (NMT), ils ne changent pas la sortie.
  options:
    a:
      en: |
        An LLM request accepts at most 50 array elements, while NMT accepts up to 1,000, so this requirement points to NMT.
      fr: |
        Une requête LLM accepte au plus 50 éléments de tableau, alors que la NMT en accepte jusqu'à 1 000 : cette exigence oriente vers la NMT.
    c:
      en: |
        NMT is billed per source character; LLM translation is billed per input and output token.
      fr: |
        La NMT est facturée par caractère source ; la traduction LLM est facturée par jeton d'entrée et de sortie.
    e:
      en: |
        LLM-based translation isn't available when the Translator resource is configured with a private endpoint, so this requirement rules out the LLM deployment.
      fr: |
        La traduction basée sur un LLM n'est pas disponible quand la ressource Translator est configurée avec un point de terminaison privé : cette exigence exclut le déploiement LLM.
references:
  - title: What is Azure text translation in Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/overview
  - title: Azure Translator in Foundry Tools 2026-06-06 translate method
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/2026-06-06/translate-api
