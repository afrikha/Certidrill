id: ai103-4a-obligation-schema
objective: "4.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank writes the JSON schema of a compliance summary that a model returns with strict structured outputs. A downstream workflow reads the summary and has the following requirements:

    - Each obligation has a clause number, a description and a risk level.
    - The risk level is exactly Low, Medium or High.
    - A flag indicates whether the document needs a legal review, as true or false.

    How should you complete the schema? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank écrit le schéma JSON d'une synthèse de conformité qu'un modèle renvoie avec des sorties structurées strictes. Un workflow en aval lit la synthèse et a les exigences suivantes :

    - Chaque obligation a un numéro de clause, une description et un niveau de risque.
    - Le niveau de risque vaut exactement Low, Medium ou High.
    - Un indicateur précise si le document nécessite une revue juridique, sous la forme true ou false.

    Comment devez-vous compléter le schéma ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "type": "object",
      "properties": {
        "obligations": {
          "type": "array",
          "items": {
            "type": "object",
            "properties": {
              "clause": { "type": "string" },
              "obligation": { "type": "string" },
              "riskLevel": { "type": "string", "[[keyword]]": ["Low", "Medium", "High"] }
            },
            "required": [[required]],
            "additionalProperties": false
          }
        },
        "requiresLegalReview": { "type": "[[flag]]" }
      },
      "required": ["obligations", "requiresLegalReview"],
      "additionalProperties": false
    }
  slots:
    - id: keyword
      options:
        - { id: examples, text: examples }
        - { id: enum, text: enum }
        - { id: pattern, text: pattern }
    - id: required
      options:
        - { id: clause, text: '["clause"]' }
        - { id: empty, text: "[]" }
        - { id: all, text: '["clause", "obligation", "riskLevel"]' }
    - id: flag
      options:
        - { id: boolean, text: boolean }
        - { id: string, text: string }
        - { id: "null", text: "null" }
answer:
  values: { keyword: enum, required: all, flag: boolean }
explanation:
  correct:
    en: |
      An `enum` restricts the risk level to the three allowed values, which the workflow can read without mapping. Strict mode requires every property of an object to be listed in `required`, so all three obligation fields are listed. A `boolean` type returns true or false for the legal review flag.
    fr: |
      Un `enum` limite le niveau de risque aux trois valeurs autorisées, que le workflow peut lire sans conversion. Le mode strict exige que chaque propriété d'un objet figure dans `required` : les trois champs de l'obligation sont donc listés. Un type `boolean` renvoie true ou false pour l'indicateur de revue juridique.
  options:
    keyword:
      en: |
        `pattern` isn't supported for strings in structured outputs, and `examples` doesn't restrict the values.
      fr: |
        `pattern` n'est pas pris en charge pour les chaînes dans les sorties structurées, et `examples` ne limite pas les valeurs.
    required:
      en: |
        Leaving properties out of `required` makes the schema invalid in strict mode.
      fr: |
        Omettre des propriétés de `required` rend le schéma non valide en mode strict.
    flag:
      en: |
        A `string` returns text such as "yes", and `null` allows no value other than null.
      fr: |
        Un `string` renvoie un texte comme « yes », et `null` n'autorise aucune autre valeur que null.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
