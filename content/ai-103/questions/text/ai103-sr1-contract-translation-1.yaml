id: ai103-sr1-contract-translation-1
objective: "4.1.3"
type: series_yesno
series: ai103-sr1-contract-translation
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You submit a nightly batch document translation request with a glossary.
  fr: Vous soumettez chaque nuit une demande de traduction de documents par lots avec un glossaire.
body:
  solution:
    en: |
      You upload the TSV file to a container. A scheduled job submits an **asynchronous batch** document translation request whose source is contracts-en and whose two targets, French and German, are in contracts-out. Each target references the TSV file as a **glossary**. Access to the containers and to the glossary is authorized by SAS tokens.
    fr: |
      Vous chargez le fichier TSV dans un conteneur. Un travail planifié soumet une demande de traduction de documents **par lots asynchrone** dont la source est contracts-en et dont les deux cibles, français et allemand, se trouvent dans contracts-out. Chaque cible fait référence au fichier TSV en tant que **glossaire**. L'accès aux conteneurs et au glossaire est autorisé par des jetons SAS.
answer: { value: true }
explanation:
  correct:
    en: Batch document translation reads the documents from a source blob container and writes the translated files to target containers, without any user interaction. It keeps the original structure and layout, processes scanned PDF files with OCR, and accepts glossaries in TSV, CSV, or XLIFF format to control how specific terms are translated.
    fr: "La traduction de documents par lots lit les documents dans un conteneur d'objets blob source et écrit les fichiers traduits dans des conteneurs cibles, sans aucune intervention humaine. Elle conserve la structure et la disposition d'origine, traite les PDF numérisés par OCR et accepte des glossaires aux formats TSV, CSV ou XLIFF pour contrôler la traduction de termes précis."
references:
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
