id: ai103-cs2a-attribute-schema
objective: "4.1.1"
type: dropdown
caseStudy: ai103-cs2a-tailwind-traders
difficulty: 3
status: draft
stem:
  en: |
    You are writing the Python function of Catalog Studio that extracts the attributes by using extract-chat and the OpenAI client library. The `client` and `messages` variables are already defined. The function must return a `ProductAttributes` instance. You need to meet the attributes requirement. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la fonction Python de Catalog Studio qui extrait les attributs à l'aide de extract-chat et de la bibliothèque cliente OpenAI. Les variables `client` et `messages` sont déjà définies. La fonction doit renvoyer une instance de `ProductAttributes`. Vous devez satisfaire l'exigence relative aux attributs. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from typing import Literal
    from pydantic import BaseModel

    class ProductAttributes(BaseModel):
        product_type: Literal["sofa", "chair", "table", "lamp", "rug"]
        material: str
        dimensions_cm: str
        color: [[color]]

    def extract_attributes():
        completion = client.beta.chat.completions.parse(
            model="extract-chat",
            messages=messages,
            response_format=[[format]],
        )
        return completion.choices[0].message.[[result]]
  slots:
    - id: color
      options:
        - { id: str, text: str }
        - { id: strnone, text: str | None }
        - { id: liststr, text: "list[str]" }
    - id: format
      options:
        - { id: model, text: ProductAttributes }
        - { id: jsonobject, text: '{"type": "json_object"}' }
        - { id: schema, text: ProductAttributes.model_json_schema() }
    - id: result
      options:
        - { id: parsed, text: parsed }
        - { id: content, text: content }
        - { id: refusal, text: refusal }
answer:
  values: { color: strnone, format: model, result: parsed }
explanation:
  correct:
    en: |
      With `client.beta.chat.completions.parse`, you pass the Pydantic model itself as `response_format`; the SDK turns it into a strict JSON schema, so every response follows the schema. Structured outputs require every field, so an optional value is expressed as a union with `None` (`null` in the schema): the model returns `null` when the description mentions no color. `message.parsed` contains the validated `ProductAttributes` instance.
    fr: |
      Avec `client.beta.chat.completions.parse`, vous passez le modèle Pydantic lui-même comme `response_format` ; le SDK le transforme en schéma JSON strict, et chaque réponse respecte donc le schéma. Les sorties structurées exigent tous les champs : une valeur facultative s'exprime par une union avec `None` (`null` dans le schéma). Le modèle renvoie `null` quand la description ne mentionne aucune couleur. `message.parsed` contient l'instance `ProductAttributes` validée.
  options:
    color:
      en: |
        A plain `str` forces the model to invent a color when the description has none, and a list doesn't match the single color value of the schema.
      fr: |
        Un simple `str` oblige le modèle à inventer une couleur quand la description n'en contient pas, et une liste ne correspond pas à la valeur de couleur unique du schéma.
    format:
      en: |
        JSON mode guarantees valid JSON but not adherence to the schema, and `parse` expects the model class, not a raw schema dictionary.
      fr: |
        Le mode JSON garantit un JSON valide mais pas le respect du schéma, et `parse` attend la classe du modèle, pas un dictionnaire de schéma brut.
    result:
      en: |
        `content` is the JSON text, not a `ProductAttributes` instance, and `refusal` carries a refusal message from the model, not the extracted data.
      fr: |
        `content` est le texte JSON, pas une instance de `ProductAttributes`, et `refusal` contient un message de refus du modèle, pas les données extraites.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
