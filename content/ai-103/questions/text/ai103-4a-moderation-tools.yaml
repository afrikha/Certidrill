id: ai103-4a-moderation-tools
objective: "4.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys runs a community forum and a forum assistant that answers questions. You must meet the following requirements for the posts that users submit.

    What should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys gère un forum communautaire et un assistant de forum qui répond aux questions. Vous devez satisfaire les exigences suivantes pour les messages publiés par les utilisateurs.

    Que devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: harm, text: { en: "Content Safety text analysis with harm categories", fr: "L'analyse de texte de Content Safety avec les catégories de préjudice" } }
    - { id: blocklist, text: { en: "Content Safety text analysis with a custom blocklist", fr: "L'analyse de texte de Content Safety avec une liste de blocage personnalisée" } }
    - { id: shields, text: { en: "Content Safety Prompt Shields", fr: "Prompt Shields de Content Safety" } }
    - { id: protected, text: { en: "Content Safety protected material detection", fr: "La détection de contenu protégé de Content Safety" } }
    - { id: pii, text: { en: "Azure Language PII detection", fr: "La détection des PII d'Azure Language" } }
    - { id: model, text: { en: "A model with a structured output enum", fr: "Un modèle avec un enum dans une sortie structurée" } }
  targets:
    - { id: t1, text: { en: "Give each post a severity level for hate and violence", fr: "Attribuer à chaque message un niveau de gravité pour la haine et la violence" } }
    - { id: t2, text: { en: "Flag posts that contain any of 300 banned nicknames for competing products", fr: "Signaler les messages qui contiennent l'un des 300 surnoms interdits de produits concurrents" } }
    - { id: t3, text: { en: "Detect posts that try to make the assistant ignore its system instructions", fr: "Détecter les messages qui tentent de faire ignorer ses instructions système à l'assistant" } }
    - { id: t4, text: { en: "Label each post as formal, casual or sarcastic", fr: "Étiqueter chaque message comme formal, casual ou sarcastic" } }
answer:
  mapping: { t1: harm, t2: blocklist, t3: shields, t4: model }
explanation:
  correct:
    en: |
      The analyze text API returns a severity for the Hate, Sexual, SelfHarm and Violence categories. A custom blocklist adds your own terms to the same call and reports matches in `blocklistsMatch`. Prompt Shields scans text for user input attacks against a language model. Tone has no dedicated API, so a model classifies it into the labels of an `enum`.
    fr: |
      L'API d'analyse de texte renvoie une gravité pour les catégories Hate, Sexual, SelfHarm et Violence. Une liste de blocage personnalisée ajoute vos propres termes au même appel et signale les correspondances dans `blocklistsMatch`. Prompt Shields analyse le texte à la recherche d'attaques par entrée utilisateur contre un modèle de langage. Le ton n'a pas d'API dédiée : un modèle le classe dans les étiquettes d'un `enum`.
  options:
    protected:
      en: |
        Protected material detection scans AI-generated text for known content such as song lyrics and articles; it isn't for user posts.
      fr: |
        La détection de contenu protégé analyse le texte généré par l'IA à la recherche de contenus connus comme des paroles de chansons et des articles ; elle n'est pas prévue pour les messages des utilisateurs.
    pii:
      en: |
        PII detection finds personal data; none of the requirements asks for it.
      fr: |
        La détection des PII trouve les données personnelles ; aucune des exigences ne le demande.
references:
  - title: What is Azure AI Content Safety?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
  - title: Use blocklists for text moderation
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/how-to/use-blocklist
