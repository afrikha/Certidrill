id: ai103-4a-abbreviations
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses a model deployment in Microsoft Foundry to summarize regulatory updates for its compliance team. Reviewers report that the summaries misuse the bank's internal abbreviations, such as KYC-R and SAR-L. New abbreviations appear every week. The team needs a fix that it can deploy today and update every week without training a model.

    What should you do?
  fr: |
    Woodgrove Bank utilise un déploiement de modèle dans Microsoft Foundry pour résumer les mises à jour réglementaires destinées à son équipe de conformité. Les relecteurs signalent que les résumés utilisent mal les abréviations internes de la banque, comme KYC-R et SAR-L. De nouvelles abréviations apparaissent chaque semaine. L'équipe a besoin d'un correctif qu'elle peut déployer aujourd'hui et mettre à jour chaque semaine sans entraîner de modèle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the model on the summaries that the compliance team wrote last year.", fr: "Effectuer un réglage fin du modèle sur les résumés rédigés par l'équipe de conformité l'an dernier." } }
    - { id: b, text: { en: "Raise the temperature so that the model considers other meanings.", fr: "Augmenter la température pour que le modèle envisage d'autres significations." } }
    - { id: c, text: { en: "Switch the response format of the request to JSON mode.", fr: "Passer le format de réponse de la requête en mode JSON." } }
    - { id: d, text: { en: "Add the abbreviation definitions and two example summaries to the instructions.", fr: "Ajouter les définitions des abréviations et deux exemples de résumés aux instructions." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Definitions of domain vocabulary in the instructions, together with a few examples of the expected output, condition the model for each request without changing its weights. The team can edit the prompt every week when new abbreviations appear.
    fr: |
      Des définitions du vocabulaire du domaine dans les instructions, accompagnées de quelques exemples de la sortie attendue, conditionnent le modèle pour chaque requête sans modifier ses poids. L'équipe peut modifier l'invite chaque semaine quand de nouvelles abréviations apparaissent.
  options:
    a:
      en: |
        Fine-tuning requires training, adds training and hosting costs, and would need to be repeated to learn each new abbreviation.
      fr: |
        Le réglage fin exige un entraînement, ajoute des coûts d'entraînement et d'hébergement, et devrait être répété pour apprendre chaque nouvelle abréviation.
    b:
      en: |
        A higher temperature makes the output more random, which increases the risk of misusing the abbreviations.
      fr: |
        Une température plus élevée rend la sortie plus aléatoire, ce qui augmente le risque de mal utiliser les abréviations.
    c:
      en: |
        JSON mode changes the output format, not the model's understanding of the vocabulary.
      fr: |
        Le mode JSON change le format de sortie, pas la compréhension du vocabulaire par le modèle.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
