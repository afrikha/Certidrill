id: ai103-4a-chat-json-schema
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation classifies IT support tickets by using the Chat Completions API of a model deployment named ticket-triage. The `client` and `messages` variables are already defined. The code passes the schema as a dictionary instead of a Pydantic model.

    The response must always match the schema, and the model must not add properties that the schema doesn't define.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation classe les tickets de support informatique à l'aide de l'API Chat Completions d'un déploiement de modèle nommé ticket-triage. Les variables `client` et `messages` sont déjà définies. Le code transmet le schéma sous forme de dictionnaire plutôt que de modèle Pydantic.

    La réponse doit toujours respecter le schéma, et le modèle ne doit pas ajouter de propriétés que le schéma ne définit pas.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    completion = client.chat.completions.create(
        model="ticket-triage",
        messages=messages,
        response_format={
            "type": "[[type]]",
            "json_schema": {
                "name": "ticket",
                "strict": [[strict]],
                "schema": {
                    "type": "object",
                    "properties": {
                        "priority": {"type": "string", "enum": ["P1", "P2", "P3"]},
                        "product": {"type": "string"},
                    },
                    "required": ["priority", "product"],
                    "additionalProperties": [[extra]],
                },
            },
        },
    )
  slots:
    - id: type
      options:
        - { id: jsonobject, text: json_object }
        - { id: jsonschema, text: json_schema }
        - { id: text, text: text }
    - id: strict
      options:
        - { id: "true", text: "True" }
        - { id: "false", text: "False" }
        - { id: none, text: None }
    - id: extra
      options:
        - { id: "true", text: "True" }
        - { id: "false", text: "False" }
        - { id: empty, text: "{}" }
answer:
  values: { type: jsonschema, strict: "true", extra: "false" }
explanation:
  correct:
    en: |
      A `response_format` of type `json_schema` carries the schema in the `json_schema` object, and `strict` set to `True` makes the model follow it. Strict mode requires `additionalProperties` set to `False` on every object, which also prevents properties that the schema doesn't define.
    fr: |
      Un `response_format` de type `json_schema` transporte le schéma dans l'objet `json_schema`, et `strict` défini sur `True` oblige le modèle à le suivre. Le mode strict exige `additionalProperties` défini sur `False` sur chaque objet, ce qui empêche aussi les propriétés que le schéma ne définit pas.
  options:
    type:
      en: |
        `json_object` is JSON mode: valid JSON without schema adherence. `text` returns free text.
      fr: |
        `json_object` correspond au mode JSON : un JSON valide sans respect du schéma. `text` renvoie du texte libre.
    strict:
      en: |
        Without `strict` set to `True`, the schema isn't enforced, so the output can still deviate from it.
      fr: |
        Sans `strict` défini sur `True`, le schéma n'est pas imposé : la sortie peut encore s'en écarter.
    extra:
      en: |
        `True` or an empty schema allows additional properties, which strict mode doesn't accept.
      fr: |
        `True` ou un schéma vide autorise des propriétés supplémentaires, ce que le mode strict n'accepte pas.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
