id: ai103-4b-auto-detect-source
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Bank's help desk receives calls in Spanish, Portuguese or Italian. The language of a caller is not known before the call. A help-desk agent must receive the caller's speech translated into English text in real time.

    You use a `TranslationRecognizer` with `en` as the target language. What should you add?
  fr: |
    Le support de Contoso Bank reçoit des appels en espagnol, en portugais ou en italien. La langue d'un appelant n'est pas connue avant l'appel. Un agent du support doit recevoir la parole de l'appelant traduite en texte anglais en temps réel.

    Vous utilisez un `TranslationRecognizer` avec `en` comme langue cible. Que devez-vous ajouter ?
body:
  options:
    - { id: a, text: { en: "Set `speech_recognition_language` to `es-ES`, the most frequent language of the callers", fr: "Définir `speech_recognition_language` sur `es-ES`, la langue la plus fréquente des appelants" } }
    - { id: b, text: { en: "Add es, pt and it as target languages of the `SpeechTranslationConfig`, in addition to en", fr: "Ajouter es, pt et it comme langues cibles de la `SpeechTranslationConfig`, en plus de en" } }
    - { id: c, text: { en: "Pass an `AutoDetectSourceLanguageConfig` with the es-ES, pt-BR and it-IT candidate locales to the `TranslationRecognizer`", fr: "Passer au `TranslationRecognizer` un `AutoDetectSourceLanguageConfig` avec les paramètres régionaux candidats es-ES, pt-BR et it-IT" } }
    - { id: d, text: { en: "Enable diarization on the recognizer so that the language of each caller is labeled separately", fr: "Activer la diarisation sur le module de reconnaissance pour que la langue de chaque appelant soit étiquetée séparément" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Multilingual speech translation uses language identification: you pass candidate source languages (up to 10) with an `AutoDetectSourceLanguageConfig`, and the recognizer detects the spoken language and translates it into the target languages. Intermediate translation results aren't available in this mode, but final translations are.
    fr: |
      La traduction vocale multilingue utilise l'identification de la langue : vous passez des langues sources candidates (jusqu'à 10) avec un `AutoDetectSourceLanguageConfig`, et le module de reconnaissance détecte la langue parlée et la traduit dans les langues cibles. Les résultats intermédiaires de traduction ne sont pas disponibles dans ce mode, contrairement aux traductions définitives.
  options:
    a:
      en: |
        A fixed source locale cannot recognize Portuguese or Italian callers correctly.
      fr: |
        Un paramètre régional source fixe ne peut pas reconnaître correctement les appelants qui parlent portugais ou italien.
    b:
      en: |
        Target languages are the output languages; adding them does not tell the recognizer which language is spoken.
      fr: |
        Les langues cibles sont les langues de sortie ; les ajouter n'indique pas au module de reconnaissance quelle langue est parlée.
    d:
      en: |
        Diarization separates speakers, not languages.
      fr: |
        La diarisation sépare les interlocuteurs, pas les langues.
references:
  - title: How to recognize and translate speech
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python
