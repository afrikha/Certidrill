id: ai103-cs3b-desk-interpreter
objective: "4.2.4"
type: single
caseStudy: ai103-cs3b-alpine
difficulty: 1
status: draft
stem:
  en: |
    You need to implement the live interpreter for the ticket desks. The solution must meet the ticket desks requirement and minimize development effort. What should you use?
  fr: |
    Vous devez implémenter l'interprète en direct pour les guichets. La solution doit satisfaire l'exigence relative aux guichets et réduire au minimum l'effort de développement. Que devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "Speech translation by using Live Interpreter, with English speech as the output"
        fr: "La traduction vocale à l'aide de Live Interpreter, avec de la parole anglaise en sortie"
    - id: b
      text:
        en: "Speech translation with French as the recognition language and English as the target language"
        fr: "La traduction vocale avec le français comme langue de reconnaissance et l'anglais comme langue cible"
    - id: c
      text:
        en: "Batch transcription of the desk recordings, followed by text translation and text to speech of the transcripts"
        fr: "La transcription par lots des enregistrements des guichets, suivie de la traduction de texte et de la synthèse vocale des transcriptions"
    - id: d
      text:
        en: "Real-time speech to text, followed by a prompt to chat-main that translates the text and a text to speech call"
        fr: "La reconnaissance vocale en temps réel, suivie d'une invite à chat-main qui traduit le texte et d'un appel de synthèse vocale"
answer: { optionId: a }
explanation:
  correct:
    en: |
      Live Interpreter in Azure Speech translation continuously identifies the language being spoken, without an input language to set, and handles several languages in the same session without restarting. It delivers low-latency speech-to-speech translation in a natural voice, so a single service meets the requirement.
    fr: |
      Live Interpreter, dans la traduction vocale d'Azure Speech, identifie en continu la langue parlée, sans langue d'entrée à définir, et gère plusieurs langues dans la même session sans redémarrage. Il fournit une traduction de parole à parole à faible latence avec une voix naturelle : un seul service satisfait l'exigence.
  options:
    b:
      en: |
        With a fixed recognition language, guests who speak German or Italian are not recognized correctly, and staff would have to change the setting for each guest.
      fr: |
        Avec une langue de reconnaissance fixe, les clients qui parlent allemand ou italien ne sont pas reconnus correctement, et le personnel devrait changer le paramètre pour chaque client.
    c:
      en: |
        Batch transcription processes recorded audio asynchronously, so it cannot interpret a conversation as it happens.
      fr: |
        La transcription par lots traite de l'audio enregistré de manière asynchrone : elle ne peut pas interpréter une conversation en direct.
    d:
      en: |
        Chaining three services adds latency and development effort, and the speech to text step still needs a way to detect language switches.
      fr: |
        Enchaîner trois services ajoute de la latence et de l'effort de développement, et l'étape de reconnaissance vocale doit encore détecter les changements de langue.
references:
  - title: What is speech translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation
