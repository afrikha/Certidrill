id: ai103-4b-headset-noise
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Logistics provides a voice agent to its warehouse supervisors through the Voice Live API. The supervisors wear headsets, and other employees often talk near them. The agent sometimes reacts to the speech of these employees.

    You need to keep the supervisor's voice and suppress the background speech and noise. The solution must not require target-speaker information for each supervisor.

    Which value should you set for `input_audio_noise_reduction.type`?
  fr: |
    Contoso Logistics met un agent vocal à la disposition de ses chefs d'équipe d'entrepôt via l'API Voice Live. Les chefs d'équipe portent un casque, et d'autres employés parlent souvent près d'eux. L'agent réagit parfois aux paroles de ces employés.

    Vous devez conserver la voix du chef d'équipe et supprimer les paroles et le bruit en arrière-plan. La solution ne doit pas demander d'informations sur l'interlocuteur cible pour chaque chef d'équipe.

    Quelle valeur devez-vous définir pour `input_audio_noise_reduction.type` ?
body:
  options:
    - { id: a, text: azure_deep_noise_suppression }
    - { id: b, text: azure_personal_noise_suppression }
    - { id: c, text: azure_deep_noise_suppression_headset }
    - { id: d, text: server_echo_cancellation }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `azure_deep_noise_suppression_headset` preserves the voice of the close speaker while suppressing background speech and noise, which matches supervisors who wear headsets near other talkers. It needs no enrollment of the supervisors' voices.
    fr: |
      `azure_deep_noise_suppression_headset` préserve la voix de l'interlocuteur proche tout en supprimant les paroles et le bruit en arrière-plan, ce qui correspond à des chefs d'équipe en casque entourés d'autres personnes qui parlent. Il ne demande aucun enregistrement préalable de la voix des chefs d'équipe.
  options:
    a:
      en: |
        `azure_deep_noise_suppression` suppresses background noise and favors the speakers closest to the microphone; the headset mode is the one designed to also remove nearby background speech.
      fr: |
        `azure_deep_noise_suppression` supprime le bruit de fond et privilégie les interlocuteurs les plus proches du microphone ; c'est le mode casque qui est conçu pour supprimer aussi les paroles proches en arrière-plan.
    b:
      en: |
        Personal noise suppression uses target-speaker information to keep only that speaker's voice, which the requirement excludes.
      fr: |
        La suppression personnelle du bruit utilise des informations sur l'interlocuteur cible pour ne garder que sa voix, ce que l'exigence exclut.
    d:
      en: |
        `server_echo_cancellation` is a value of `input_audio_echo_cancellation`; it prevents the agent from hearing its own output, not other people.
      fr: |
        `server_echo_cancellation` est une valeur de `input_audio_echo_cancellation` ; elle empêche l'agent d'entendre sa propre sortie, pas d'autres personnes.
references:
  - title: How to use the Voice Live API
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to
