id: ai103-4a-ticket-redaction
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation copies its customer support tickets to a data lake for analytics. Before a ticket is stored, the customer names, phone numbers and bank account numbers in the ticket text must be detected and replaced, and the stored copy must not contain the original values.

    What should you use to process the tickets?
  fr: |
    Adatum Corporation copie ses tickets de support client dans un lac de données pour l'analytique. Avant le stockage d'un ticket, les noms des clients, les numéros de téléphone et les numéros de compte bancaire du texte du ticket doivent être détectés et remplacés, et la copie stockée ne doit pas contenir les valeurs d'origine.

    Que devez-vous utiliser pour traiter les tickets ?
body:
  options:
    - { id: a, text: { en: "Azure AI Content Safety text analysis, with a blocklist of customer names", fr: "L'analyse de texte d'Azure AI Content Safety, avec une liste de blocage des noms de clients" } }
    - { id: b, text: { en: "Azure AI Content Safety Prompt Shields, run on each ticket", fr: "Prompt Shields d'Azure AI Content Safety, exécuté sur chaque ticket" } }
    - { id: c, text: { en: "Azure Language PII detection, storing the redactedText it returns", fr: "La détection des PII d'Azure Language, en stockant le redactedText qu'elle renvoie" } }
    - { id: d, text: { en: "Azure Language prebuilt NER, removing the Person entities it returns", fr: "La NER prédéfinie d'Azure Language, en supprimant les entités Person qu'elle renvoie" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      PII detection in Azure Language identifies, classifies and redacts sensitive personal data such as names, phone numbers and financial identifiers. For text input, the response includes the detected entities with their categories and confidence scores, and a redacted version of the text that you can store.
    fr: |
      La détection des PII d'Azure Language identifie, classe et masque les données personnelles sensibles comme les noms, les numéros de téléphone et les identifiants financiers. Pour une entrée de texte, la réponse contient les entités détectées avec leurs catégories et leurs scores de confiance, et une version masquée du texte que vous pouvez stocker.
  options:
    a:
      en: |
        Content Safety text analysis detects harmful content such as hate and violence. A blocklist matches fixed terms; it can't detect unknown names, phone numbers or account numbers, and it doesn't redact text.
      fr: |
        L'analyse de texte de Content Safety détecte les contenus préjudiciables comme la haine et la violence. Une liste de blocage recherche des termes fixes ; elle ne peut pas détecter des noms, numéros de téléphone ou numéros de compte inconnus, et elle ne masque pas le texte.
    b:
      en: |
        Prompt Shields detects user input attacks on a language model; it doesn't detect personal data.
      fr: |
        Prompt Shields détecte les attaques par entrée utilisateur contre un modèle de langage ; il ne détecte pas les données personnelles.
    d:
      en: |
        Prebuilt NER returns general entity categories but doesn't produce a redacted text, and it isn't the feature for sensitive identifiers such as bank account numbers.
      fr: |
        La NER prédéfinie renvoie des catégories d'entités générales mais ne produit pas de texte masqué, et ce n'est pas la fonctionnalité prévue pour les identifiants sensibles comme les numéros de compte bancaire.
references:
  - title: What is the Personally Identifiable Information (PII) detection feature in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
