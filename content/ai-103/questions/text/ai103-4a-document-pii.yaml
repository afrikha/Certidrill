id: ai103-4a-document-pii
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Legal must share 3,000 vendor contracts in DOCX and PDF format with an external auditor. Before sharing, the personal data in each contract must be redacted. The redacted files must keep the structure of the original documents. You plan to use Azure Language.

    Which PII detection option should you use?
  fr: |
    Contoso Legal doit partager 3 000 contrats fournisseurs au format DOCX et PDF avec un auditeur externe. Avant le partage, les données personnelles de chaque contrat doivent être masquées. Les fichiers masqués doivent conserver la structure des documents d'origine. Vous prévoyez d'utiliser Azure Language.

    Quelle option de détection des PII devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Text PII detection, after you extract the text of each file", fr: "La détection des PII dans le texte, après l'extraction du texte de chaque fichier" } }
    - { id: b, text: { en: "Conversation PII detection, with each page sent as a turn", fr: "La détection des PII dans les conversations, avec chaque page envoyée comme un tour" } }
    - { id: c, text: { en: "Text PII detection, with the syntheticReplacement policy", fr: "La détection des PII dans le texte, avec la stratégie syntheticReplacement" } }
    - { id: d, text: { en: "Document-based PII detection, run asynchronously on the files", fr: "La détection des PII dans les documents, exécutée de façon asynchrone sur les fichiers" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Document-based PII detection is an asynchronous operation for native .pdf, .docx and .txt files. It redacts the personal data while preserving the document structure, and it also returns JSON metadata about the detected entities.
    fr: |
      La détection des PII dans les documents est une opération asynchrone pour les fichiers natifs .pdf, .docx et .txt. Elle masque les données personnelles tout en conservant la structure du document, et renvoie aussi des métadonnées JSON sur les entités détectées.
  options:
    a:
      en: |
        Text PII is for raw strings; once the text is extracted, the redacted result no longer has the structure of the DOCX or PDF file.
      fr: |
        La détection des PII dans le texte est prévue pour des chaînes brutes ; une fois le texte extrait, le résultat masqué n'a plus la structure du fichier DOCX ou PDF.
    b:
      en: |
        Conversation PII is for turn-based chats and transcripts, not for documents.
      fr: |
        La détection des PII dans les conversations est prévue pour les chats et les transcriptions à tours de parole, pas pour les documents.
    c:
      en: |
        The redaction policy changes how values are replaced, but text PII still works on raw strings, so the document structure is lost.
      fr: |
        La stratégie de masquage change la façon dont les valeurs sont remplacées, mais la détection des PII dans le texte travaille toujours sur des chaînes brutes : la structure du document est perdue.
references:
  - title: What is the Personally Identifiable Information (PII) detection feature in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
