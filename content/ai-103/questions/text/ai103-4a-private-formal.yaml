id: ai103-4a-private-formal
objective: "4.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Health translates patient letters into Japanese by using an Azure Translator resource that is configured with a private endpoint. Security policy requires every call to AI services to go through a private endpoint. The company also has a Microsoft Foundry resource, reachable through a private endpoint, with a gpt-4.1 deployment.

    A new requirement states that the Japanese letters must use a formal register.

    What should you implement?
  fr: |
    Woodgrove Health traduit des courriers aux patients en japonais à l'aide d'une ressource Azure Translator configurée avec un point de terminaison privé. La stratégie de sécurité exige que chaque appel aux services IA passe par un point de terminaison privé. L'entreprise dispose aussi d'une ressource Microsoft Foundry, accessible par un point de terminaison privé, avec un déploiement gpt-4.1.

    Une nouvelle exigence impose que les courriers en japonais utilisent un registre formel.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Translator 2026-06-06 requests whose Japanese target sets deploymentName to the gpt-4.1 deployment and tone to formal", fr: "Des requêtes Translator 2026-06-06 dont la cible japonaise définit deploymentName sur le déploiement gpt-4.1 et tone sur formal" } }
    - { id: b, text: { en: "Translator 2026-06-06 requests whose Japanese target keeps the general engine and sets tone to formal", fr: "Des requêtes Translator 2026-06-06 dont la cible japonaise conserve le moteur general et définit tone sur formal" } }
    - { id: c, text: { en: "Requests to the gpt-4.1 deployment whose instructions specify Japanese and a formal register", fr: "Des requêtes au déploiement gpt-4.1 dont les instructions précisent le japonais et un registre formel" } }
    - { id: d, text: { en: "Translator 2026-06-06 requests whose Japanese target keeps the general engine and adds formal referenceTextPairs", fr: "Des requêtes Translator 2026-06-06 dont la cible japonaise conserve le moteur general et ajoute des referenceTextPairs formelles" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      LLM-based translation in Translator isn't available when the Translator resource uses a private endpoint, and the NMT engine ignores the tone control. An LLM-powered translation flow that calls the gpt-4.1 deployment directly, with the target language and the register in the instructions, meets the requirement while all traffic stays on private endpoints.
    fr: |
      La traduction basée sur un LLM dans Translator n'est pas disponible quand la ressource Translator utilise un point de terminaison privé, et le moteur NMT ignore le contrôle du ton. Un flux de traduction alimenté par LLM qui appelle directement le déploiement gpt-4.1, avec la langue cible et le registre dans les instructions, satisfait l'exigence tout en gardant tout le trafic sur des points de terminaison privés.
  options:
    a:
      en: |
        Translator can't use an LLM deployment while the Translator resource is configured with a private endpoint.
      fr: |
        Translator ne peut pas utiliser de déploiement LLM tant que la ressource Translator est configurée avec un point de terminaison privé.
    b:
      en: |
        With the general (NMT) engine, the tone control has no effect on the output.
      fr: |
        Avec le moteur general (NMT), le contrôle du ton n'a aucun effet sur la sortie.
    d:
      en: |
        Reference translations guide the style of LLM output; with the general (NMT) engine they don't change the register.
      fr: |
        Les traductions de référence guident le style de la sortie d'un LLM ; avec le moteur general (NMT), elles ne changent pas le registre.
references:
