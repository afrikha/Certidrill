id: ai103-cs1c-house-style
objective: "4.1.3"
type: single
caseStudy: ai103-cs1c-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the translation requirement. What should you use?
  fr: |
    Vous devez satisfaire l'exigence de traduction. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Custom Translator, with a model trained on the approved sentence pairs", fr: "Custom Translator, avec un modèle entraîné sur les paires de phrases approuvées" } }
    - { id: b, text: { en: "Text translation v3, with a dynamic dictionary that contains the approved sentence pairs", fr: "La traduction de texte v3, avec un dictionnaire dynamique qui contient les paires de phrases approuvées" } }
    - { id: c, text: { en: "Synchronous document translation, with a glossary file that contains the approved sentence pairs", fr: "La traduction de documents synchrone, avec un fichier de glossaire qui contient les paires de phrases approuvées" } }
    - { id: d, text: { en: "Adaptive custom translation, with the approved sentence pairs uploaded as segment pairs", fr: "La traduction personnalisée adaptative, avec les paires de phrases approuvées chargées comme paires de segments" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Adaptive custom translation in Azure Translator takes 5 to 10,000 prealigned source–target segment pairs and builds a custom bilingual index in minutes that adapts a supported LLM. It works with text translation 2026-06-06, which adds LLM selection, so no translation model is trained or deployed.
    fr: |
      La traduction personnalisée adaptative d'Azure Translator prend de 5 à 10 000 paires de segments source–cible préalignées et crée en quelques minutes un index bilingue personnalisé qui adapte un LLM pris en charge. Elle fonctionne avec la traduction de texte 2026-06-06, qui ajoute la sélection de LLM : aucun modèle de traduction n'est entraîné ni déployé.
  options:
    a:
      en: |
        Custom Translator builds and trains a custom translation model, which the team does not want.
      fr: |
        Custom Translator crée et entraîne un modèle de traduction personnalisé, ce que l'équipe ne veut pas.
    b:
      en: |
        A dynamic dictionary forces the translation of specific words or phrases in a request; it does not adapt an LLM to a house style.
      fr: |
        Un dictionnaire dynamique impose la traduction de mots ou d'expressions précis dans une requête ; il n'adapte pas un LLM à un style maison.
    c:
      en: |
        A glossary enforces terminology during document translation; it does not adapt an LLM to the style of whole sentences.
      fr: |
        Un glossaire impose une terminologie pendant la traduction de documents ; il n'adapte pas un LLM au style de phrases entières.
references:
  - title: What is Azure Translator in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/overview
