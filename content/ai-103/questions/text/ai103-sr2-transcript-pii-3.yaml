seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use PII detection with the Person, PhoneNumber and CreditCardNumber categories.
  fr: Vous utilisez la détection des PII avec les catégories Person, PhoneNumber et CreditCardNumber.
body:
  solution:
    en: |
      The function sends each transcript to Azure Language PII detection (`"kind": "PiiEntityRecognition"`) with `"piiCategories": ["Person", "PhoneNumber", "CreditCardNumber"]` and no redaction policy. It stores the `redactedText` value returned for the transcript.
    fr: |
      La fonction envoie chaque transcription à la détection des PII d'Azure Language (`"kind": "PiiEntityRecognition"`) avec `"piiCategories": ["Person", "PhoneNumber", "CreditCardNumber"]` et sans stratégie de masquage. Elle stocke la valeur `redactedText` renvoyée pour la transcription.
answer: { value: true }
explanation:
  correct:
    en: "PII detection is the Foundry Tool for personal data: it returns the detected entities with their category and a `redactedText` copy of the input. The three categories listed cover names, phone numbers and payment card numbers. The default redaction policy, `characterMask`, replaces each entity with masking characters and keeps the rest of the text, with its length and offsets, unchanged."
    fr: "La détection des PII est le Foundry Tool dédié aux données personnelles : elle renvoie les entités détectées avec leur catégorie et une copie `redactedText` de l'entrée. Les trois catégories listées couvrent les noms, les numéros de téléphone et les numéros de carte de paiement. La stratégie de masquage par défaut, `characterMask`, remplace chaque entité par des caractères de masquage et conserve le reste du texte sans modification, avec sa longueur et ses positions."
references:
  - title: Identify and extract Personally Identifiable Information (PII) from text
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/how-to/redact-text-pii
