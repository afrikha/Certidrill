id: ai103-4b-audio-vs-transcript
objective: "4.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Adatum Roadside Assistance records every call from stranded drivers. You are deciding, for each requirement, whether a transcript sent to a text model is enough or whether the audio must be sent to an audio-capable model such as gpt-audio.

    Which two requirements need the audio to be sent to an audio-capable model?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Roadside Assistance enregistre chaque appel des conducteurs en panne. Vous déterminez, pour chaque exigence, si une transcription envoyée à un modèle de texte suffit ou si l'audio doit être envoyé à un modèle compatible avec l'audio, comme gpt-audio.

    Quelles sont les deux exigences qui demandent d'envoyer l'audio à un modèle compatible avec l'audio ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Detect whether the driver's voice sounds panicked", fr: "Détecter si la voix du conducteur semble paniquée" } }
    - { id: b, text: { en: "Count how many times the driver mentions the word \"tow\"", fr: "Compter combien de fois le conducteur prononce le mot « remorquage »" } }
    - { id: c, text: { en: "Detect whether a siren or traffic noise can be heard behind the driver", fr: "Détecter si une sirène ou un bruit de circulation s'entend derrière le conducteur" } }
    - { id: d, text: { en: "Keep a searchable text record of every call", fr: "Conserver une trace textuelle consultable de chaque appel" } }
    - { id: e, text: { en: "Extract the vehicle's license plate number that the driver reads aloud", fr: "Extraire le numéro d'immatriculation du véhicule que le conducteur lit à voix haute" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A transcript keeps the words and loses the rest of the audio. The tone of the voice and background sounds such as a siren are not in the words, so the recording itself must reach a model that accepts audio input.
    fr: |
      Une transcription garde les mots et perd le reste de l'audio. Le ton de la voix et les bruits de fond, comme une sirène, ne figurent pas dans les mots : l'enregistrement lui-même doit atteindre un modèle qui accepte une entrée audio.
  options:
    b:
      en: |
        Counting a word only needs the words, which a transcript contains.
      fr: |
        Compter un mot ne demande que les mots, que la transcription contient.
    d:
      en: |
        A searchable record is a transcript; speech to text produces it at a lower cost than an audio model.
      fr: |
        Une trace consultable est une transcription ; la reconnaissance vocale la produit à un coût plus faible qu'un modèle audio.
    e:
      en: |
        A plate number read aloud is part of the words, so a text model can extract it from the transcript.
      fr: |
        Un numéro d'immatriculation lu à voix haute fait partie des mots : un modèle de texte peut l'extraire de la transcription.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart
