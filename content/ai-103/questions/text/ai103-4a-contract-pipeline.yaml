id: ai103-4a-contract-pipeline
objective: "4.1.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Insurance receives reinsurance contracts in German. You are building a pipeline that produces an English compliance summary of each contract by using a model deployment in Microsoft Foundry. The pipeline must meet the following requirements:

    - No personal data is sent to Azure Translator or to the model.
    - The model receives the contract in English and returns a summary that matches the compliance schema, including a requiresLegalReview field.
    - Contracts that need a legal review go to the legal review queue.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam Insurance reçoit des contrats de réassurance en allemand. Vous créez un pipeline qui produit une synthèse de conformité en anglais de chaque contrat à l'aide d'un déploiement de modèle dans Microsoft Foundry. Le pipeline doit satisfaire les exigences suivantes :

    - Aucune donnée personnelle n'est envoyée à Azure Translator ni au modèle.
    - Le modèle reçoit le contrat en anglais et renvoie une synthèse conforme au schéma de conformité, avec un champ requiresLegalReview.
    - Les contrats qui nécessitent une revue juridique vont dans la file de revue juridique.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: redact, text: { en: "Detect and redact the personal data in the German text by using Azure Language PII detection.", fr: "Détecter et masquer les données personnelles du texte allemand à l'aide de la détection des PII d'Azure Language." } }
    - { id: translate, text: { en: "Translate the redacted text into English by using Azure Translator.", fr: "Traduire le texte masqué en anglais à l'aide d'Azure Translator." } }
    - { id: summarize, text: { en: "Send the English text to the model with the compliance schema and strict structured outputs.", fr: "Envoyer le texte anglais au modèle avec le schéma de conformité et des sorties structurées strictes." } }
    - { id: route, text: { en: "Send the contract to the legal review queue when requiresLegalReview is true.", fr: "Envoyer le contrat dans la file de revue juridique quand requiresLegalReview vaut true." } }
    - { id: original, text: { en: "Translate the original contract into English by using Azure Translator.", fr: "Traduire le contrat d'origine en anglais à l'aide d'Azure Translator." } }
    - { id: safety, text: { en: "Remove the personal data by using Azure AI Content Safety text analysis.", fr: "Supprimer les données personnelles à l'aide de l'analyse de texte d'Azure AI Content Safety." } }
    - { id: tune, text: { en: "Fine-tune the model on the German contracts.", fr: "Effectuer un réglage fin du modèle sur les contrats allemands." } }
answer:
  sequence: [redact, translate, summarize, route]
explanation:
  correct:
    en: |
      Redacting first keeps personal data away from both Translator and the model. The redacted text is then translated so the model works in English, the model returns a summary that matches the strict schema, and the boolean requiresLegalReview field drives the routing to the review queue.
    fr: |
      Masquer en premier tient les données personnelles à l'écart de Translator et du modèle. Le texte masqué est ensuite traduit pour que le modèle travaille en anglais, le modèle renvoie une synthèse conforme au schéma strict, et le champ booléen requiresLegalReview pilote l'acheminement vers la file de revue.
  options:
    original:
      en: |
        Translating the original contract sends its personal data to Translator.
      fr: |
        Traduire le contrat d'origine envoie ses données personnelles à Translator.
    safety:
      en: |
        Content Safety detects harmful content; it doesn't detect or redact personal data.
      fr: |
        Content Safety détecte les contenus préjudiciables ; il ne détecte ni ne masque les données personnelles.
    tune:
      en: |
        Fine-tuning isn't needed for this pipeline, and training on unredacted contracts would expose personal data.
      fr: |
        Le réglage fin n'est pas nécessaire pour ce pipeline, et un entraînement sur des contrats non masqués exposerait des données personnelles.
references:
  - title: What is the Personally Identifiable Information (PII) detection feature in Azure Language?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
