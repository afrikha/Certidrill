stem:
  en: You use PII detection with the Person, PhoneNumber and Email categories.
  fr: Vous utilisez la détection des PII avec les catégories Person, PhoneNumber et Email.
body:
  solution:
    en: |
      The function sends each transcript to Azure Language PII detection (`"kind": "PiiEntityRecognition"`) with `"piiCategories": ["Person", "PhoneNumber", "Email"]`. It stores the `redactedText` value returned for the transcript.
    fr: |
      La fonction envoie chaque transcription à la détection des PII d'Azure Language (`"kind": "PiiEntityRecognition"`) avec `"piiCategories": ["Person", "PhoneNumber", "Email"]`. Elle stocke la valeur `redactedText` renvoyée pour la transcription.
answer: { value: false }
explanation:
  correct:
    en: When `piiCategories` is set without `default`, the API returns only the categories listed. Payment card numbers belong to the CreditCardNumber category, which isn't in the list, so they stay readable in `redactedText` and are stored in clear. Masking emails isn't required, but the missing category is what makes the solution fail.
    fr: "Lorsque `piiCategories` est défini sans `default`, l'API ne renvoie que les catégories listées. Les numéros de carte de paiement relèvent de la catégorie CreditCardNumber, absente de la liste : ils restent lisibles dans `redactedText` et sont stockés en clair. Le masquage des adresses e-mail n'est pas exigé, mais c'est la catégorie manquante qui fait échouer la solution."
references:
  - title: Identify and extract Personally Identifiable Information (PII) from text
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/how-to/redact-text-pii
  - title: Entity categories recognized by Personally Identifiable Information (PII) and Protected Health Information (PHI) detection in Azure Language in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/concepts/entity-categories
