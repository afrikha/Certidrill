id: ai103-4a-safety-request
objective: "4.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys moderates in-game chat messages by calling `POST {endpoint}/contentsafety/text:analyze?api-version=2024-09-01`. You created a text blocklist named wingtip-slurs. The request must meet the following requirements:

    - Report the Hate and Violence severity on a scale from 0 to 7.
    - Check every message against wingtip-slurs.
    - When a message matches the blocklist, return immediately without running the harm analysis.

    How should you complete the request body? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys modère les messages du chat en jeu en appelant `POST {endpoint}/contentsafety/text:analyze?api-version=2024-09-01`. Vous avez créé une liste de blocage de texte nommée wingtip-slurs. La requête doit satisfaire les exigences suivantes :

    - Indiquer la gravité Hate et Violence sur une échelle de 0 à 7.
    - Vérifier chaque message par rapport à wingtip-slurs.
    - Quand un message correspond à la liste de blocage, répondre immédiatement sans exécuter l'analyse des préjudices.

    Comment devez-vous compléter le corps de la requête ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "text": "<chat message>",
      "categories": ["Hate", "Violence"],
      "[[list]]": ["wingtip-slurs"],
      "haltOnBlocklistHit": [[halt]],
      "outputType": "[[levels]]"
    }
  slots:
    - id: list
      options:
        - { id: names, text: blocklistNames }
        - { id: match, text: blocklistsMatch }
        - { id: items, text: blocklistItems }
    - id: halt
      options:
        - { id: "true", text: "true" }
        - { id: "false", text: "false" }
    - id: levels
      options:
        - { id: four, text: FourSeverityLevels }
        - { id: eight, text: EightSeverityLevels }
answer:
  values: { list: names, halt: "true", levels: eight }
explanation:
  correct:
    en: |
      `blocklistNames` lists the blocklists to check in the analyze request. With `haltOnBlocklistHit` set to `true`, a blocklist match returns immediately without the harm analysis. `EightSeverityLevels` returns severities from 0 to 7, while the default `FourSeverityLevels` returns only 0, 2, 4 and 6.
    fr: |
      `blocklistNames` liste les listes de blocage à vérifier dans la requête d'analyse. Avec `haltOnBlocklistHit` défini sur `true`, une correspondance dans une liste de blocage renvoie immédiatement une réponse sans l'analyse des préjudices. `EightSeverityLevels` renvoie des gravités de 0 à 7, alors que la valeur par défaut `FourSeverityLevels` ne renvoie que 0, 2, 4 et 6.
  options:
    list:
      en: |
        `blocklistsMatch` is the response field that reports matches, and `blocklistItems` is the body used to add items to a blocklist.
      fr: |
        `blocklistsMatch` est le champ de réponse qui signale les correspondances, et `blocklistItems` est le corps utilisé pour ajouter des éléments à une liste de blocage.
    halt:
      en: |
        With `false`, the harm analysis runs on every message, even after a blocklist match.
      fr: |
        Avec `false`, l'analyse des préjudices s'exécute sur chaque message, même après une correspondance dans la liste de blocage.
references:
  - title: "Quickstart: Analyze text content"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-text
  - title: Use blocklists for text moderation
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/how-to/use-blocklist
