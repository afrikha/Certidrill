id: ai103-4b-brand-voice
objective: "4.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank runs a voice agent through the Voice Live API. Woodgrove has been approved for custom voice and has deployed a custom neural voice named en-US-WoodgroveNeural on the Microsoft Foundry resource that calls Voice Live.

    The agent must speak with this brand voice. What should you set in the `voice` object of the `session.update` event?
  fr: |
    Woodgrove Bank exécute un agent vocal via l'API Voice Live. Woodgrove a obtenu l'accès à la voix personnalisée et a déployé une voix neuronale personnalisée nommée en-US-WoodgroveNeural sur la ressource Microsoft Foundry qui appelle Voice Live.

    L'agent doit parler avec cette voix de marque. Que devez-vous définir dans l'objet `voice` de l'événement `session.update` ?
body:
  options:
    - { id: a, text: { en: "`type` set to `azure-standard` and `name` set to en-US-WoodgroveNeural", fr: "`type` défini sur `azure-standard` et `name` défini sur en-US-WoodgroveNeural" } }
    - { id: b, text: { en: "`type` set to `azure-custom`, `name` set to en-US-WoodgroveNeural, and the `endpoint_id` of the deployment", fr: "`type` défini sur `azure-custom`, `name` défini sur en-US-WoodgroveNeural, et l'`endpoint_id` du déploiement" } }
    - { id: c, text: { en: "`type` set to `azure-standard` and `custom_lexicon_url` set to the URL of the voice deployment", fr: "`type` défini sur `azure-standard` et `custom_lexicon_url` défini sur l'URL du déploiement de la voix" } }
    - { id: d, text: { en: "`type` set to `azure-custom`, `name` set to en-US-WoodgroveNeural, and `temperature` set to 0.8", fr: "`type` défini sur `azure-custom`, `name` défini sur en-US-WoodgroveNeural, et `temperature` défini sur 0.8" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A custom voice in Voice Live uses the `azure-custom` voice type with the voice name and the `endpoint_id` (a GUID) of its deployment. The model must be on the same Foundry resource that calls the Voice Live API, which is the case here.
    fr: |
      Une voix personnalisée dans Voice Live utilise le type de voix `azure-custom` avec le nom de la voix et l'`endpoint_id` (un GUID) de son déploiement. Le modèle doit se trouver sur la ressource Foundry qui appelle l'API Voice Live, ce qui est le cas ici.
  options:
    a:
      en: |
        `azure-standard` selects a prebuilt voice; a custom voice requires the `azure-custom` type and its endpoint ID.
      fr: |
        `azure-standard` sélectionne une voix prédéfinie ; une voix personnalisée demande le type `azure-custom` et son ID de point de terminaison.
    c:
      en: |
        `custom_lexicon_url` points to a custom lexicon that changes pronunciations; it does not select a voice.
      fr: |
        `custom_lexicon_url` pointe vers un lexique personnalisé qui modifie les prononciations ; il ne sélectionne pas de voix.
    d:
      en: |
        `temperature` is optional and only affects HD voices; without `endpoint_id`, the custom voice deployment is not identified.
      fr: |
        `temperature` est facultatif et n'agit que sur les voix HD ; sans `endpoint_id`, le déploiement de la voix personnalisée n'est pas identifié.
references:
  - title: How to customize Voice Live input and output
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to-customize
