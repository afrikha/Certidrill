id: ai103-4b-voicelive-custom-speech
objective: "4.2.2"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. trained a custom speech model for the en-US locale on a Microsoft Foundry resource named fdy-train. The company's voice agent calls the Voice Live API through another Foundry resource named fdy-live. The agent uses a gpt-4.1 deployment.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. a entraîné un modèle de reconnaissance vocale personnalisée pour le paramètre régional en-US sur une ressource Microsoft Foundry nommée fdy-train. L'agent vocal de l'entreprise appelle l'API Voice Live via une autre ressource Foundry nommée fdy-live. L'agent utilise un déploiement gpt-4.1.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The session can use the model while it remains only on fdy-train.
        fr: La session peut utiliser le modèle tant qu'il ne se trouve que sur fdy-train.
    - id: s2
      text:
        en: In `session.update`, `input_audio_transcription.custom_speech` maps the en-US locale to the ID of the custom model.
        fr: Dans `session.update`, `input_audio_transcription.custom_speech` associe le paramètre régional en-US à l'ID du modèle personnalisé.
    - id: s3
      text:
        en: The custom model can be used with `gpt-4o-transcribe` as the input audio transcription model.
        fr: Le modèle personnalisé peut être utilisé avec `gpt-4o-transcribe` comme modèle de transcription de l'audio d'entrée.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The custom speech model must be on the same Foundry resource that calls the Voice Live API, so it must be copied to fdy-live. `custom_speech` is a dictionary whose keys are locales and whose values are custom model IDs. Custom speech is supported only with the `azure-speech` transcription model; `gpt-4o-transcribe` also works only with gpt-realtime models.
    fr: |
      Le modèle de reconnaissance vocale personnalisée doit se trouver sur la ressource Foundry qui appelle l'API Voice Live : il doit donc être copié sur fdy-live. `custom_speech` est un dictionnaire dont les clés sont des paramètres régionaux et les valeurs des ID de modèles personnalisés. La reconnaissance vocale personnalisée n'est prise en charge qu'avec le modèle de transcription `azure-speech` ; `gpt-4o-transcribe` ne fonctionne d'ailleurs qu'avec les modèles gpt-realtime.
references:
  - title: How to customize Voice Live input and output
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to-customize
