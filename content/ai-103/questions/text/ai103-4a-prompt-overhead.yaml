id: ai103-4a-prompt-overhead
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware Financial generates compliance summaries of trade confirmations by using a model deployment in Microsoft Foundry. Every request includes 40 worked examples, about 9,000 tokens, and the summaries consistently meet the required style. The app sends about 50,000 requests a day. The compliance team has 3,000 expert-reviewed pairs of confirmations and summaries.

    You need to reduce the token cost and the latency of each request while keeping the same style of summaries.

    What should you do?
  fr: |
    Litware Financial génère des synthèses de conformité de confirmations de transactions à l'aide d'un déploiement de modèle dans Microsoft Foundry. Chaque requête contient 40 exemples rédigés, soit environ 9 000 jetons, et les synthèses respectent systématiquement le style exigé. L'application envoie environ 50 000 requêtes par jour. L'équipe de conformité dispose de 3 000 paires de confirmations et de synthèses vérifiées par des experts.

    Vous devez réduire le coût en jetons et la latence de chaque requête tout en conservant le même style de synthèses.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add more worked examples to the instructions to make the style more stable.", fr: "Ajouter davantage d'exemples rédigés aux instructions pour stabiliser le style." } }
    - { id: b, text: { en: "Fine-tune the model on the reviewed pairs and remove most examples from the prompt.", fr: "Effectuer un réglage fin du modèle sur les paires vérifiées et retirer la plupart des exemples de l'invite." } }
    - { id: c, text: { en: "Lower max_output_tokens so that each summary uses fewer tokens.", fr: "Réduire max_output_tokens pour que chaque synthèse utilise moins de jetons." } }
    - { id: d, text: { en: "Move the worked examples from the instructions to user messages.", fr: "Déplacer les exemples rédigés des instructions vers des messages utilisateur." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Fine-tuning trains the model on task-specific data so it learns the style and format, which reduces prompt overhead and can lower token costs and latency. The team already has high-quality reviewed examples, and the prompt-based approach already proves the target style, so the fine-tuned model can be compared with it on held-out data.
    fr: |
      Le réglage fin entraîne le modèle sur des données propres à la tâche pour qu'il apprenne le style et le format, ce qui réduit la charge de l'invite et peut diminuer le coût en jetons et la latence. L'équipe dispose déjà d'exemples vérifiés de haute qualité, et l'approche par invite démontre déjà le style visé : le modèle affiné peut être comparé à celle-ci sur des données réservées.
  options:
    a:
      en: |
        More examples make every request longer, which increases the token cost and the latency.
      fr: |
        Plus d'exemples allongent chaque requête, ce qui augmente le coût en jetons et la latence.
    c:
      en: |
        The cost comes from the 9,000 input tokens of examples; a lower output limit can truncate the summaries without removing that input.
      fr: |
        Le coût vient des 9 000 jetons d'entrée des exemples ; une limite de sortie plus basse peut tronquer les synthèses sans supprimer cette entrée.
    d:
      en: |
        Few-shot examples in user messages are still sent with every request, so the token count doesn't change.
      fr: |
        Des exemples few-shot dans des messages utilisateur sont toujours envoyés avec chaque requête : le nombre de jetons ne change pas.
references:
  - title: Fine-tuning in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/fine-tuning-considerations
