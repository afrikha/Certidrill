id: ai103-4b-translation-code
objective: "4.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Residences is building a front-desk agent for guests from Mexico. The agent recognizes the guest's speech in Spanish (Mexico) and needs the translation into English and German text. The English text is sent to the agent.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Residences crée un agent d'accueil pour des clients venus du Mexique. L'agent reconnaît la parole du client en espagnol (Mexique) et a besoin de sa traduction en texte anglais et allemand. Le texte anglais est envoyé à l'agent.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    translation_config = speechsdk.translation.SpeechTranslationConfig(
        subscription=key, region=region)
    translation_config.speech_recognition_language = "[[src]]"
    for code in ["en", "de"]:
        translation_config.[[add]](code)

    recognizer = speechsdk.translation.TranslationRecognizer(
        translation_config=translation_config)
    result = recognizer.recognize_once()
    if result.reason == speechsdk.ResultReason.TranslatedSpeech:
        send_to_agent([[read]])
  slots:
    - id: src
      options:
        - { id: esmx, text: es-MX }
        - { id: es, text: es }
        - { id: enus, text: en-US }
    - id: add
      options:
        - { id: addt, text: add_target_language }
        - { id: remove, text: remove_target_language }
        - { id: prop, text: set_property }
    - id: read
      options:
        - { id: tren, text: 'result.translations["en"]' }
        - { id: text, text: result.text }
        - { id: trenus, text: 'result.translations["en-US"]' }
answer:
  values: { src: esmx, add: addt, read: tren }
explanation:
  correct:
    en: |
      `speech_recognition_language` expects the locale of the spoken language, here `es-MX`. `add_target_language` adds each target language; at least one is required and several are supported. The `translations` dictionary is keyed by the target language codes, so the English text is `result.translations["en"]`.
    fr: |
      `speech_recognition_language` attend le paramètre régional de la langue parlée, ici `es-MX`. `add_target_language` ajoute chaque langue cible ; au moins une est requise et plusieurs sont prises en charge. Le dictionnaire `translations` est indexé par les codes des langues cibles : le texte anglais est `result.translations["en"]`.
  options:
    es:
      en: "The source language must be given in language-locale format, such as `es-MX`."
      fr: "La langue source doit être indiquée au format langue-paramètre régional, comme `es-MX`."
    enus:
      en: "`en-US` is a target of the translation, not the language spoken by the guest."
      fr: "`en-US` est une cible de la traduction, pas la langue parlée par le client."
    remove:
      en: "`remove_target_language` removes a target language instead of adding it."
      fr: "`remove_target_language` supprime une langue cible au lieu de l'ajouter."
    prop:
      en: "`set_property` sets a property by ID; it does not take a target language code."
      fr: "`set_property` définit une propriété par son ID ; il ne reçoit pas de code de langue cible."
    text:
      en: "`result.text` contains the recognized Spanish text, not the translation."
      fr: "`result.text` contient le texte espagnol reconnu, pas la traduction."
    trenus:
      en: "The dictionary keys are the codes passed to `add_target_language`, here `en` and `de`."
      fr: "Les clés du dictionnaire sont les codes passés à `add_target_language`, ici `en` et `de`."
references:
  - title: How to recognize and translate speech
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python
