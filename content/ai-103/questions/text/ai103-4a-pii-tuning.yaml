id: ai103-4a-pii-tuning
objective: "4.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam Public Safety redacts incident reports with Azure Language PII detection before analysts read them. Analysts report two problems:

    - The role words "suspect", "witness" and "officer" are redacted, which makes the reports hard to read.
    - Some redactions hide ordinary words that were detected with a low confidence score.

    You need to keep the role words in the reports and redact only entities detected with a confidence score of at least 0.8.

    Which two parameters should you configure in the PII request? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Public Safety masque les rapports d'incident avec la détection des PII d'Azure Language avant que les analystes ne les lisent. Les analystes signalent deux problèmes :

    - Les mots de rôle « suspect », « witness » et « officer » sont masqués, ce qui rend les rapports difficiles à lire.
    - Certains masquages cachent des mots ordinaires détectés avec un score de confiance faible.

    Vous devez conserver les mots de rôle dans les rapports et ne masquer que les entités détectées avec un score de confiance d'au moins 0,8.

    Quels sont les deux paramètres à configurer dans la requête PII ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A redaction policy of kind noMask", fr: "Une stratégie de masquage de type noMask" } }
    - { id: b, text: { en: "A confidenceScoreThreshold with a default of 0.8", fr: "Un confidenceScoreThreshold avec une valeur par défaut de 0,8" } }
    - { id: c, text: { en: "A piiCategories list that contains only default", fr: "Une liste piiCategories qui ne contient que default" } }
    - { id: d, text: { en: "A valueExclusionPolicy that lists the role words", fr: "Une valueExclusionPolicy qui liste les mots de rôle" } }
    - { id: e, text: { en: "An entitySynonyms list that maps the role words to Person", fr: "Une liste entitySynonyms qui associe les mots de rôle à Person" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      By default, PII detection redacts every detected entity regardless of its confidence; `confidenceScoreThreshold` keeps only the entities at or above the threshold, with optional overrides per entity. `valueExclusionPolicy` stops specific terms from being redacted even when they fall into a PII category.
    fr: |
      Par défaut, la détection des PII masque chaque entité détectée, quelle que soit sa confiance ; `confidenceScoreThreshold` ne conserve que les entités dont le score atteint au moins le seuil, avec des remplacements facultatifs par entité. `valueExclusionPolicy` empêche le masquage de termes précis même lorsqu'ils appartiennent à une catégorie de PII.
  options:
    a:
      en: |
        `noMask` omits the redacted text from the response; it doesn't change which entities are detected.
      fr: |
        `noMask` omet le texte masqué de la réponse ; il ne change pas les entités détectées.
    c:
      en: |
        `default` returns the default categories of the language, so the role words and low-confidence entities are still redacted.
      fr: |
        `default` renvoie les catégories par défaut de la langue : les mots de rôle et les entités peu fiables sont toujours masqués.
    e:
      en: |
        `entitySynonyms` helps recognize domain terms as an entity type, which would make the role words more likely to be redacted.
      fr: |
        `entitySynonyms` aide à reconnaître des termes métier comme un type d'entité, ce qui rendrait le masquage des mots de rôle plus probable.
references:
  - title: Identify and extract Personally Identifiable Information (PII) from text
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/how-to/redact-text-pii
