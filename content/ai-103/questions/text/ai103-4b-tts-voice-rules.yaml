id: ai103-4b-tts-voice-rules
objective: "4.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is adding spoken answers to its order-status agent by using the text to speech feature of the Speech SDK. The application creates a `SpeechConfig` object and a `SpeechSynthesizer` object.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders ajoute des réponses parlées à son agent de suivi des commandes à l'aide de la synthèse vocale du SDK Speech. L'application crée un objet `SpeechConfig` et un objet `SpeechSynthesizer`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If the code sets `speech_synthesis_language` to `fr-FR` and `speech_synthesis_voice_name` to `en-US-Ava:DragonHDLatestNeural`, the answer is spoken by the `en-US-Ava:DragonHDLatestNeural` voice.
        fr: Si le code définit `speech_synthesis_language` sur `fr-FR` et `speech_synthesis_voice_name` sur `en-US-Ava:DragonHDLatestNeural`, la réponse est prononcée par la voix `en-US-Ava:DragonHDLatestNeural`.
    - id: s2
      text:
        en: When the answer is sent with `speak_ssml_async` and the SSML contains a `voice` element, the voice set in `speech_synthesis_voice_name` is used instead of the SSML voice.
        fr: Quand la réponse est envoyée avec `speak_ssml_async` et que le SSML contient un élément `voice`, la voix définie dans `speech_synthesis_voice_name` est utilisée à la place de la voix du SSML.
    - id: s3
      text:
        en: To slow down a single sentence of the answer, you can wrap the sentence in an SSML `prosody` element that has a `rate` attribute.
        fr: Pour ralentir une seule phrase de la réponse, vous pouvez placer cette phrase dans un élément SSML `prosody` doté d'un attribut `rate`.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      When both properties are set, `speech_synthesis_language` is ignored and the voice named in `speech_synthesis_voice_name` speaks. When SSML with a `voice` element is used, both properties are ignored and the SSML voice is used. The `rate` attribute of `prosody` changes the speaking rate at the word or sentence level.
    fr: |
      Quand les deux propriétés sont définies, `speech_synthesis_language` est ignorée et c'est la voix nommée dans `speech_synthesis_voice_name` qui parle. Quand un SSML avec un élément `voice` est utilisé, les deux propriétés sont ignorées et c'est la voix du SSML qui est utilisée. L'attribut `rate` de `prosody` modifie le débit de parole au niveau du mot ou de la phrase.
references:
  - title: How to synthesize speech from text
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis?pivots=programming-language-python
  - title: Customize voice and sound with SSML
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-synthesis-markup-voice
