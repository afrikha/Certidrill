id: ai103-cs1b-voice-live
objective: "4.2.1"
type: single
caseStudy: ai103-cs1b-alpineski
difficulty: 1
status: draft
stem:
  en: |
    You need to build the phone concierge. The solution must meet the phone concierge requirement. What should you use?
  fr: |
    Vous devez créer le concierge téléphonique. La solution doit satisfaire l'exigence relative au concierge téléphonique. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The batch transcription API, concierge-agent, and then the text to speech REST API", fr: "L'API de transcription par lots, concierge-agent, puis l'API REST de synthèse vocale" } }
    - { id: b, text: { en: "Real-time speech to text in the Speech SDK, concierge-agent, and then text to speech", fr: "La reconnaissance vocale en temps réel du SDK Speech, concierge-agent, puis la synthèse vocale" } }
    - { id: c, text: { en: "The Voice Live API, connected over WebSocket from the telephony backend", fr: "L'API Voice Live, connectée en WebSocket depuis le back-end de téléphonie" } }
    - { id: d, text: { en: "The fast transcription API, concierge-agent, and then a custom neural voice", fr: "L'API de transcription rapide, concierge-agent, puis une voix neuronale personnalisée" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Voice Live API is a managed speech-to-speech interface that combines speech recognition, generative AI and text to speech, so you do not orchestrate the components yourself. It includes noise suppression, echo cancellation, interruption detection and end-of-turn detection, and the backend connects to it with WebSocket events.
    fr: |
      L'API Voice Live est une interface parole-parole managée qui combine la reconnaissance vocale, l'IA générative et la synthèse vocale : vous n'orchestrez donc pas les composants vous-même. Elle inclut la suppression du bruit, l'annulation de l'écho, la détection des interruptions et la détection de fin de tour, et le back-end s'y connecte par des événements WebSocket.
  options:
    b:
      en: |
        Chaining speech to text, an agent and text to speech works, but it is the separate-component orchestration that the team wants to avoid.
      fr: |
        Enchaîner la reconnaissance vocale, un agent et la synthèse vocale fonctionne, mais c'est justement l'orchestration de composants distincts que l'équipe veut éviter.
    a:
      en: |
        Batch transcription processes recorded audio asynchronously, so it cannot support a real-time conversation.
      fr: |
        La transcription par lots traite de l'audio enregistré de façon asynchrone : elle ne permet pas une conversation en temps réel.
    d:
      en: |
        Fast transcription processes audio files rather than a live stream, and this design still chains separate components.
      fr: |
        La transcription rapide traite des fichiers audio plutôt qu'un flux en direct, et cette conception enchaîne toujours des composants distincts.
references:
  - title: Voice Live API for real-time voice agents
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live
