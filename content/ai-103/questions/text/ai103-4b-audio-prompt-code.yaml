id: ai103-4b-audio-prompt-code
objective: "4.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso Electronics wants a support agent to listen to each recorded complaint and answer in text whether the customer sounds angry. The deployments have the same names as their models. The `client` object is an authenticated `AzureOpenAI` client.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Electronics veut qu'un agent de support écoute chaque réclamation enregistrée et réponde en texte si le client semble en colère. Les déploiements portent le même nom que leurs modèles. L'objet `client` est un client `AzureOpenAI` authentifié.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    with open("complaint.wav", "rb") as f:
        encoded = base64.b64encode(f.read()).decode("utf-8")

    completion = client.chat.completions.create(
        model="[[model]]",
        modalities=[[mod]],
        messages=[{
            "role": "user",
            "content": [
                {"type": "text", "text": "Does the customer sound angry? Answer in one sentence."},
                {"type": "input_audio", "input_audio": {"data": [[data]], "format": "wav"}},
            ],
        }],
    )
    print(completion.choices[0].message.content)
  slots:
    - id: model
      options:
        - { id: audio, text: gpt-audio-mini }
        - { id: tts, text: gpt-4o-mini-tts }
        - { id: realtime, text: gpt-realtime }
    - id: mod
      options:
        - { id: text, text: '["text"]' }
        - { id: both, text: '["text", "audio"]' }
        - { id: input, text: '["input_audio"]' }
    - id: data
      options:
        - { id: enc, text: encoded }
        - { id: name, text: '"complaint.wav"' }
        - { id: file, text: f }
answer:
  values: { model: audio, mod: text, data: enc }
explanation:
  correct:
    en: |
      gpt-audio-mini supports Chat Completions with audio input and text, audio or text + audio output; `modalities=["text"]` asks for a text answer only, read from `message.content`. The `input_audio` part carries the base64-encoded audio with its format.
    fr: |
      gpt-audio-mini prend en charge Chat Completions avec une entrée audio et une sortie texte, audio ou texte et audio ; `modalities=["text"]` demande une réponse uniquement textuelle, lue dans `message.content`. La partie `input_audio` transporte l'audio encodé en base64 avec son format.
  options:
    tts:
      en: "gpt-4o-mini-tts is a text to speech model; it does not reason over audio input."
      fr: "gpt-4o-mini-tts est un modèle de synthèse vocale ; il ne raisonne pas sur une entrée audio."
    realtime:
      en: "gpt-realtime is used through the Realtime API for low-latency live conversations, not for this request/response call."
      fr: "gpt-realtime s'utilise via l'API Realtime pour des conversations en direct à faible latence, pas pour cet appel de requête et réponse."
    both:
      en: "Adding audio output would also require an `audio` setting and would return a spoken answer that the requirement does not ask for."
      fr: "Ajouter la sortie audio demanderait aussi un paramètre `audio` et renverrait une réponse parlée que l'exigence ne demande pas."
    input:
      en: "`modalities` lists output modalities (text, audio); `input_audio` is a content part type."
      fr: "`modalities` liste les modalités de sortie (texte, audio) ; `input_audio` est un type de partie de contenu."
    name:
      en: "The audio is sent as base64 data, not as a file name."
      fr: "L'audio est envoyé sous forme de données base64, pas sous forme de nom de fichier."
    file:
      en: "The file object is closed after the `with` block and is not base64 data."
      fr: "L'objet fichier est fermé après le bloc `with` et ne contient pas de données base64."
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart
