id: ai103-4a-responses-parse
objective: "4.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders processes supplier invoices that arrive as email text. You write a Python function that uses the OpenAI library and the Responses API to extract the vendor, the purchase order number and the total from each email. A deployment named invoice-extract exists, and the `client` variable is already defined.

    The function must return an `Invoice` instance that was validated against the schema.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders traite des factures fournisseurs qui arrivent sous forme de texte d'e-mail. Vous écrivez une fonction Python qui utilise la bibliothèque OpenAI et l'API Responses pour extraire le fournisseur, le numéro de bon de commande et le total de chaque e-mail. Un déploiement nommé invoice-extract existe, et la variable `client` est déjà définie.

    La fonction doit renvoyer une instance de `Invoice` validée par rapport au schéma.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pydantic import BaseModel

    class Invoice(BaseModel):
        vendor: str
        po_number: str | None
        total: float

    def extract_invoice(email_text: str) -> Invoice:
        response = client.responses.[[method]](
            model="invoice-extract",
            instructions="Extract the invoice fields. Use null when a value is absent.",
            input=email_text,
            [[param]]=Invoice,
        )
        return response.[[result]]
  slots:
    - id: method
      options:
        - { id: create, text: create }
        - { id: parse, text: parse }
        - { id: retrieve, text: retrieve }
    - id: param
      options:
        - { id: responseformat, text: response_format }
        - { id: tools, text: tools }
        - { id: textformat, text: text_format }
    - id: result
      options:
        - { id: outputtext, text: output_text }
        - { id: outputparsed, text: output_parsed }
        - { id: parsed, text: parsed }
answer:
  values: { method: parse, param: textformat, result: outputparsed }
explanation:
  correct:
    en: |
      With the Responses API, `client.responses.parse` accepts a Pydantic model in the `text_format` parameter. The SDK converts the model to a JSON schema in the request and returns the validated object in `response.output_parsed`.
    fr: |
      Avec l'API Responses, `client.responses.parse` accepte un modèle Pydantic dans le paramètre `text_format`. Le SDK convertit le modèle en schéma JSON dans la requête et renvoie l'objet validé dans `response.output_parsed`.
  options:
    method:
      en: |
        `create` returns the raw response without converting it to the Pydantic model, and `retrieve` gets an existing response by its ID.
      fr: |
        `create` renvoie la réponse brute sans la convertir dans le modèle Pydantic, et `retrieve` récupère une réponse existante à partir de son ID.
    param:
      en: |
        `response_format` is the parameter of Chat Completions, not of the Responses API, and `tools` defines functions the model can call.
      fr: |
        `response_format` est le paramètre de Chat Completions, pas de l'API Responses, et `tools` définit des fonctions que le modèle peut appeler.
    result:
      en: |
        `output_text` is the JSON text, not an `Invoice` instance, and `parsed` is the property of a Chat Completions message.
      fr: |
        `output_text` est le texte JSON, pas une instance de `Invoice`, et `parsed` est la propriété d'un message Chat Completions.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
