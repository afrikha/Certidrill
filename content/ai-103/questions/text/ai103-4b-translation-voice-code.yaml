id: ai103-4b-translation-voice-code
objective: "4.2.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Travel is building a museum guide that recognizes English speech and must play the German translation aloud as soon as it is synthesized. The application uses only one target language and the event-based synthesis of speech translation.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Travel crée un guide de musée qui reconnaît la parole en anglais et doit lire à voix haute la traduction allemande dès qu'elle est synthétisée. L'application n'utilise qu'une seule langue cible et la synthèse par événement de la traduction vocale.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    translation_config = speechsdk.translation.SpeechTranslationConfig(
        subscription=key, region=region)
    translation_config.speech_recognition_language = "en-US"
    translation_config.add_target_language("de")
    translation_config.[[voice]] = "[[name]]"

    recognizer = speechsdk.translation.TranslationRecognizer(
        translation_config=translation_config)

    def play_chunk(evt):
        audio = evt.result.audio
        if len(audio) > 0:
            speaker.write(audio)

    recognizer.[[event]].connect(play_chunk)
    result = recognizer.recognize_once()
  slots:
    - id: voice
      options:
        - { id: vn, text: voice_name }
        - { id: lang, text: speech_synthesis_language }
        - { id: out, text: endpoint_id }
    - id: name
      options:
        - { id: de, text: de-DE-KatjaNeural }
        - { id: en, text: en-US-JennyNeural }
        - { id: fr, text: fr-FR-DeniseNeural }
    - id: event
      options:
        - { id: synth, text: synthesizing }
        - { id: recog, text: recognized }
        - { id: recoging, text: recognizing }
        - { id: stopped, text: session_stopped }
answer:
  values: { voice: vn, name: de, event: synth }
explanation:
  correct:
    en: |
      Setting `voice_name` on `SpeechTranslationConfig` requests a spoken translation, and the voice must be in the same language as the target, so `de` maps to a German voice such as `de-DE-KatjaNeural`. The synthesized audio arrives through the `synthesizing` event, in `evt.result.audio`. Event-based synthesis works only with a single target language.
    fr: |
      Définir `voice_name` sur `SpeechTranslationConfig` demande une traduction parlée, et la voix doit être dans la même langue que la cible : `de` correspond à une voix allemande comme `de-DE-KatjaNeural`. L'audio synthétisé arrive par l'événement `synthesizing`, dans `evt.result.audio`. La synthèse par événement ne fonctionne qu'avec une seule langue cible.
  options:
    lang:
      en: "`speech_synthesis_language` selects a default voice for text to speech; the translation voice is set with `voice_name`."
      fr: "`speech_synthesis_language` sélectionne une voix par défaut pour la synthèse vocale ; la voix de la traduction se définit avec `voice_name`."
    out:
      en: "`endpoint_id` selects a deployed custom speech model for recognition, not a voice."
      fr: "`endpoint_id` sélectionne un modèle de reconnaissance vocale personnalisée déployé pour la reconnaissance, pas une voix."
    en:
      en: "The voice must be in the target language, German, not in the source language."
      fr: "La voix doit être dans la langue cible, l'allemand, pas dans la langue source."
    fr:
      en: "A French voice does not match the German target language."
      fr: "Une voix française ne correspond pas à la langue cible allemande."
    recog:
      en: "`recognized` returns the final recognized and translated text, not synthesized audio."
      fr: "`recognized` renvoie le texte définitif reconnu et traduit, pas l'audio synthétisé."
    recoging:
      en: "`recognizing` returns intermediate translation results as text."
      fr: "`recognizing` renvoie des résultats intermédiaires de traduction sous forme de texte."
    stopped:
      en: "`session_stopped` signals the end of the session and carries no audio."
      fr: "`session_stopped` signale la fin de la session et ne contient pas d'audio."
references:
  - title: How to recognize and translate speech
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python
