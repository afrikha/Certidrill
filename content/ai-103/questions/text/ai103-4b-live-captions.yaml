id: ai103-4b-live-captions
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Events streams the keynote of its annual conference, which is delivered in English. An event agent must display French captions on screen while the speaker talks.

    The solution must use a single Azure Speech operation for recognition and translation. What should you use?
  fr: |
    Contoso Events diffuse la keynote de sa conférence annuelle, prononcée en anglais. Un agent d'événement doit afficher des sous-titres en français à l'écran pendant que l'orateur parle.

    La solution doit utiliser une seule opération Azure Speech pour la reconnaissance et la traduction. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A `SpeechRecognizer` with `speech_recognition_language` set to `fr-FR`", fr: "Un `SpeechRecognizer` avec `speech_recognition_language` défini sur `fr-FR`" } }
    - { id: b, text: { en: "A `SpeechRecognizer` for `en-US`, and then Azure Translator for each recognized phrase", fr: "Un `SpeechRecognizer` pour `en-US`, puis Azure Translator pour chaque phrase reconnue" } }
    - { id: c, text: { en: "A `TranslationRecognizer` with a `SpeechTranslationConfig` for `en-US` and the `fr` target language", fr: "Un `TranslationRecognizer` avec une `SpeechTranslationConfig` pour `en-US` et la langue cible `fr`" } }
    - { id: d, text: { en: "Batch transcription of the stream recording, and then Azure Translator for the transcript", fr: "La transcription par lots de l'enregistrement du flux, puis Azure Translator pour la transcription" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Speech translation recognizes the source speech and returns the translated text in the same operation, with interim results as speech is detected. `SpeechTranslationConfig` takes the source locale and one or more target languages, and `TranslationRecognizer` runs the recognition.
    fr: |
      La traduction vocale reconnaît la parole source et renvoie le texte traduit dans la même opération, avec des résultats intermédiaires au fur et à mesure de la détection de la parole. `SpeechTranslationConfig` reçoit le paramètre régional source et une ou plusieurs langues cibles, et `TranslationRecognizer` exécute la reconnaissance.
  options:
    a:
      en: |
        `speech_recognition_language` sets the language spoken in the audio; a `SpeechRecognizer` does not translate.
      fr: |
        `speech_recognition_language` définit la langue parlée dans l'audio ; un `SpeechRecognizer` ne traduit pas.
    b:
      en: |
        This works, but it uses two services and a second call for each phrase.
      fr: |
        Cette solution fonctionne, mais elle utilise deux services et un second appel pour chaque phrase.
    d:
      en: |
        Batch transcription is asynchronous, so captions could not follow the speaker, and Translator adds a second operation.
      fr: |
        La transcription par lots est asynchrone : les sous-titres ne pourraient pas suivre l'orateur, et Translator ajoute une seconde opération.
references:
  - title: What is speech translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation
  - title: How to recognize and translate speech
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python
