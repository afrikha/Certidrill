id: ai103-4b-patient-voicemail-audio
objective: "4.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware Health is building a triage agent for patient voicemails. Each voicemail is a WAV file of less than one minute.

    For each voicemail, the agent must decide whether the patient sounds distressed, based on the tone of voice and not only on the words, and must return a two-sentence summary. The solution must use a single model call per voicemail.

    What should you do?
  fr: |
    Litware Health crée un agent de tri pour les messages vocaux des patients. Chaque message vocal est un fichier WAV de moins d'une minute.

    Pour chaque message vocal, l'agent doit déterminer si le patient semble en détresse, d'après le ton de sa voix et pas seulement d'après ses mots, et doit renvoyer un résumé de deux phrases. La solution doit utiliser un seul appel de modèle par message vocal.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Transcribe the file with fast transcription, and send the transcript to a gpt-4.1 deployment with the triage prompt", fr: "Transcrire le fichier avec la transcription rapide, et envoyer la transcription à un déploiement gpt-4.1 avec l'invite de tri" } }
    - { id: b, text: { en: "Transcribe the file with batch transcription and diarization, and send the transcript to a gpt-4.1 deployment", fr: "Transcrire le fichier avec la transcription par lots et la diarisation, et envoyer la transcription à un déploiement gpt-4.1" } }
    - { id: c, text: { en: "Send the file to a gpt-4o-mini-transcribe deployment, with the triage instructions as the transcription prompt", fr: "Envoyer le fichier à un déploiement gpt-4o-mini-transcribe, avec les instructions de tri comme invite de transcription" } }
    - { id: d, text: { en: "Send the file as an `input_audio` content part to a gpt-audio-mini deployment, with the triage prompt as a text part", fr: "Envoyer le fichier sous forme de partie de contenu `input_audio` à un déploiement gpt-audio-mini, avec l'invite de tri comme partie texte" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      gpt-audio-mini accepts audio input in Chat Completions: the base64-encoded WAV file travels as an `input_audio` part next to the text prompt. The model hears the recording itself, including the tone of voice, and returns the assessment and the summary in one call.
    fr: |
      gpt-audio-mini accepte une entrée audio dans Chat Completions : le fichier WAV encodé en base64 est envoyé sous forme de partie `input_audio` à côté de l'invite texte. Le modèle entend l'enregistrement lui-même, y compris le ton de la voix, et renvoie l'évaluation et le résumé en un seul appel.
  options:
    a:
      en: |
        A transcript keeps only the words, so the tone of voice is lost, and the design needs two calls per voicemail.
      fr: |
        Une transcription ne garde que les mots : le ton de la voix est perdu, et cette conception demande deux appels par message vocal.
    b:
      en: |
        Batch transcription is asynchronous and still produces only text; diarization adds speaker labels, not tone.
      fr: |
        La transcription par lots est asynchrone et ne produit toujours que du texte ; la diarisation ajoute des étiquettes d'interlocuteur, pas le ton.
    c:
      en: |
        gpt-4o-mini-transcribe is a speech to text model: it returns a transcript, and its optional prompt guides the transcription instead of producing an assessment.
      fr: |
        gpt-4o-mini-transcribe est un modèle de reconnaissance vocale : il renvoie une transcription, et son invite facultative guide la transcription au lieu de produire une évaluation.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart
