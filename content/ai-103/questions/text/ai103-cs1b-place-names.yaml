id: ai103-cs1b-place-names
objective: "4.2.2"
type: single
caseStudy: ai103-cs1b-alpineski
difficulty: 2
status: draft
stem:
  en: |
    During tests of the phone concierge, the names of lifts and slopes are often transcribed incorrectly. You need to meet the place names requirement. What should you do?
  fr: |
    Pendant les tests du concierge téléphonique, les noms des remontées et des pistes sont souvent mal transcrits. Vous devez satisfaire l'exigence relative aux noms de lieux. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Train a custom speech model with text and audio that contain the names", fr: "Entraîner un modèle Custom Speech avec du texte et de l'audio qui contiennent les noms" } }
    - { id: b, text: { en: "Provide a phrase list that contains the names when each session starts", fr: "Fournir une liste d'expressions qui contient les noms au début de chaque session" } }
    - { id: c, text: { en: "Create a custom neural voice that pronounces the names correctly", fr: "Créer une voix neuronale personnalisée qui prononce correctement les noms" } }
    - { id: d, text: { en: "Enable language identification across French, English, German and Italian", fr: "Activer l'identification de la langue pour le français, l'anglais, l'allemand et l'italien" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A phrase list is a lightweight, just-in-time customization that makes listed names and terms more likely to be recognized, without any training. It is supported by the Voice Live API, and 180 names is well within the recommended size, so the list can simply be updated each season.
    fr: |
      Une liste d'expressions est une personnalisation légère et à la demande qui rend les noms et termes listés plus susceptibles d'être reconnus, sans aucun entraînement. Elle est prise en charge par l'API Voice Live, et 180 noms restent bien en deçà de la taille recommandée : la liste peut simplement être mise à jour chaque saison.
  options:
    a:
      en: |
        A custom speech model would improve recognition, but it requires training, which the requirement rules out.
      fr: |
        Un modèle Custom Speech améliorerait la reconnaissance, mais il nécessite un entraînement, ce que l'exigence exclut.
    c:
      en: |
        A custom neural voice changes the synthesized output voice; it does not improve the recognition of what guests say.
      fr: |
        Une voix neuronale personnalisée modifie la voix de sortie synthétisée ; elle n'améliore pas la reconnaissance de ce que disent les clients.
    d:
      en: |
        Language identification chooses the language of the audio, but it does not teach the recognizer proper names.
      fr: |
        L'identification de la langue choisit la langue de l'audio, mais elle n'apprend pas les noms propres au module de reconnaissance.
references:
  - title: Improve recognition accuracy with phrase list
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/improve-accuracy-phrase-list
  - title: Voice Live API for real-time voice agents
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live
