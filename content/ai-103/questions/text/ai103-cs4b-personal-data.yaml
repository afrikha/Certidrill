id: ai103-cs4b-personal-data
objective: "4.1.2"
type: single
caseStudy: ai103-cs4b-consolidated
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the personal data requirement. What should you add to gr-support?
  fr: |
    Vous devez satisfaire l'exigence relative aux données personnelles. Que devez-vous ajouter à gr-support ?
body:
  options:
    - { id: a, text: { en: "A Protected material for text control on the Output intervention point, with the Annotate and block action", fr: "Un contrôle Protected material for text sur le point d'intervention Output, avec l'action Annotate and block" } }
    - { id: b, text: { en: "A Groundedness control on the Output intervention point, with the Annotate and block action", fr: "Un contrôle Groundedness sur le point d'intervention Output, avec l'action Annotate and block" } }
    - { id: c, text: { en: "A User prompt attacks control on the User input intervention point, with the Annotate and block action", fr: "Un contrôle User prompt attacks sur le point d'intervention User input, avec l'action Annotate and block" } }
    - { id: d, text: { en: "A Personally identifiable information control on the Output intervention point, with the Annotate and block action", fr: "Un contrôle Personally identifiable information sur le point d'intervention Output, avec l'action Annotate and block" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Personally identifiable information risk (preview) is supported for agents and detects categories of personal data that include PhoneNumber, Email and Address. Scanning the Output intervention point checks the final completion returned to the customer, which covers data that came from track_parcel. Annotate and block is the action available for agents.
    fr: |
      Le risque Personally identifiable information (préversion) est pris en charge pour les agents et détecte des catégories de données personnelles qui incluent PhoneNumber, Email et Address. L'analyse du point d'intervention Output vérifie la réponse finale renvoyée au client, ce qui couvre les données provenant de track_parcel. Annotate and block est l'action disponible pour les agents.
  options:
    a: { en: "Protected material for text detects known copyrighted text, such as song lyrics or articles, not personal data.", fr: "Protected material for text détecte des textes protégés connus, comme des paroles de chansons ou des articles, pas des données personnelles." }
    b: { en: "Groundedness checks whether a response is supported by its sources; it is not available for agents and does not detect personal data.", fr: "Groundedness vérifie qu'une réponse est étayée par ses sources ; ce risque n'est pas disponible pour les agents et ne détecte pas les données personnelles." }
    c: { en: "User prompt attacks detects jailbreak attempts in the user input; it does not inspect the personal data in the responses.", fr: "User prompt attacks détecte les tentatives de jailbreak dans l'entrée utilisateur ; il n'examine pas les données personnelles des réponses." }
references:
  - title: Personally Identifiable Information (PII) Filter
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter-personal-information
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
