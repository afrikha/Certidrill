id: ai103-4b-training-data
objective: "4.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso Pharmacy is training custom speech models for the voice assistant used by its pharmacists. You must choose the training data for each improvement goal.

    Which type of data should you use for each goal? To answer, drag the appropriate data types to the correct goals. Each data type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Pharmacy entraîne des modèles de reconnaissance vocale personnalisée pour l'assistant vocal utilisé par ses pharmaciens. Vous devez choisir les données d'entraînement pour chaque objectif d'amélioration.

    Quel type de données devez-vous utiliser pour chaque objectif ? Pour répondre, faites glisser les types de données appropriés vers les objectifs correspondants. Chaque type de données peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: text, text: { en: "Plain text sentences from the domain", fr: "Phrases en texte brut issues du domaine" } }
    - { id: audio, text: { en: "Audio with human-labeled reference transcripts", fr: "Audio avec transcriptions de référence étiquetées par des humains" } }
    - { id: pron, text: { en: "Pronunciation data", fr: "Données de prononciation" } }
    - { id: format, text: { en: "Display text formatting data (inverse text normalization, rewrite)", fr: "Données de mise en forme du texte affiché (normalisation inverse du texte, réécriture)" } }
    - { id: phrase, text: { en: "A phrase list sent with each request", fr: "Une liste d'expressions envoyée avec chaque requête" } }
  targets:
    - { id: t1, text: { en: "Recognize the names of medications that pharmacists use in their sentences", fr: "Reconnaître les noms de médicaments que les pharmaciens emploient dans leurs phrases" } }
    - { id: t2, text: { en: "Improve accuracy on consultations recorded over a noisy phone line", fr: "Améliorer la précision sur des consultations enregistrées par une ligne téléphonique bruyante" } }
    - { id: t3, text: { en: "Recognize a brand name that pharmacists pronounce differently from its spelling", fr: "Reconnaître un nom de marque que les pharmaciens prononcent différemment de son orthographe" } }
    - { id: t4, text: { en: "Always display a spoken dosage in a fixed written format", fr: "Toujours afficher une posologie énoncée dans un format écrit fixe" } }
answer:
  mapping: { t1: text, t2: audio, t3: pron, t4: format }
explanation:
  correct:
    en: |
      Text data relevant to the field adds domain-specific vocabulary. Audio with reference transcriptions improves recognition for specific audio conditions such as a phone line. Pronunciation data defines custom pronunciations, and display text formatting data covers custom inverse text normalization and rewrite rules. A phrase list is sent at recognition time and is not training data.
    fr: |
      Des données textuelles propres au domaine ajoutent du vocabulaire métier. L'audio accompagné de transcriptions de référence améliore la reconnaissance dans des conditions audio précises, comme une ligne téléphonique. Les données de prononciation définissent des prononciations personnalisées, et les données de mise en forme du texte affiché couvrent la normalisation inverse du texte et les règles de réécriture personnalisées. Une liste d'expressions est envoyée au moment de la reconnaissance et ne constitue pas une donnée d'entraînement.
references:
  - title: What is custom speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview
