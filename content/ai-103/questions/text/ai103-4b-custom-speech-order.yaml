id: ai103-4b-custom-speech-order
objective: "4.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. wants a custom speech model for the real-time voice agent of its legal department. The team must measure the base model before training, compare the trained model with it on the same test data, and then use the trained model from the agent.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. veut un modèle de reconnaissance vocale personnalisée pour l'agent vocal en temps réel de son service juridique. L'équipe doit mesurer le modèle de base avant l'entraînement, comparer le modèle entraîné à celui-ci sur les mêmes données de test, puis utiliser le modèle entraîné depuis l'agent.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: project, text: { en: "Create a custom speech project.", fr: "Créer un projet de reconnaissance vocale personnalisée." } }
    - { id: base, text: { en: "Upload test data and measure the word error rate (WER) of the base model.", fr: "Charger des données de test et mesurer le taux d'erreurs de mots (WER) du modèle de base." } }
    - { id: train, text: { en: "Upload training data and train a custom model.", fr: "Charger des données d'entraînement et entraîner un modèle personnalisé." } }
    - { id: compare, text: { en: "Measure the WER of the custom model on the same test data.", fr: "Mesurer le WER du modèle personnalisé sur les mêmes données de test." } }
    - { id: deploy, text: { en: "Deploy the custom model to a custom endpoint.", fr: "Déployer le modèle personnalisé sur un point de terminaison personnalisé." } }
    - { id: phrases, text: { en: "Add the legal terms to a phrase list.", fr: "Ajouter les termes juridiques à une liste d'expressions." } }
    - { id: deploybase, text: { en: "Deploy the base model to a custom endpoint.", fr: "Déployer le modèle de base sur un point de terminaison personnalisé." } }
answer:
  sequence: [ project, base, train, compare, deploy ]
explanation:
  correct:
    en: |
      Custom speech starts with a project. You upload test data to evaluate the base model, train a model with your data, test it quantitatively with WER, and deploy it to a custom endpoint, which is required to use a custom model for real-time recognition.
    fr: |
      La reconnaissance vocale personnalisée commence par un projet. Vous chargez des données de test pour évaluer le modèle de base, vous entraînez un modèle avec vos données, vous le testez de façon quantitative avec le WER, puis vous le déployez sur un point de terminaison personnalisé, nécessaire pour utiliser un modèle personnalisé en reconnaissance en temps réel.
  options:
    phrases:
      en: "A phrase list is an alternative to training for a few terms, not a step of the custom speech workflow."
      fr: "Une liste d'expressions est une alternative à l'entraînement pour quelques termes, pas une étape du processus de reconnaissance vocale personnalisée."
    deploybase:
      en: "The base model needs no custom endpoint; only the custom model is deployed."
      fr: "Le modèle de base n'a pas besoin de point de terminaison personnalisé ; seul le modèle personnalisé est déployé."
references:
  - title: What is custom speech?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/custom-speech-overview
