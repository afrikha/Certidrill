id: ai103-cs2c-drive-thru-audio
objective: "4.2.3"
type: single
caseStudy: ai103-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You are writing the nightly job that processes the files in the recordings container. You need to meet the drive-thru quality requirement. What should the job do for each recording?
  fr: |
    Vous écrivez le traitement de nuit qui traite les fichiers du conteneur recordings. Vous devez satisfaire l'exigence relative à la qualité du service au volant. Que doit faire le traitement pour chaque enregistrement ?
body:
  options:
    - id: a
      text:
        en: |
          Transcribe the file by using Azure Speech, and then send the transcript to chat-orders with a prompt that asks for the JSON verdict.
        fr: |
          Transcrire le fichier à l'aide d'Azure Speech, puis envoyer la transcription à chat-orders avec une invite qui demande le verdict JSON.
    - id: b
      text:
        en: |
          Send the file as an `input_audio` content part to audio-mini, with `modalities` set to `["text"]` and a prompt that asks for the JSON verdict.
        fr: |
          Envoyer le fichier sous forme de partie de contenu `input_audio` à audio-mini, avec `modalities` défini sur `["text"]` et une invite qui demande le verdict JSON.
    - id: c
      text:
        en: |
          Transcribe the file by using Azure Speech, and then run sentiment analysis of Azure Language on the transcript.
        fr: |
          Transcrire le fichier à l'aide d'Azure Speech, puis exécuter l'analyse des sentiments d'Azure Language sur la transcription.
    - id: d
      text:
        en: |
          Stream the file to the Voice Live API, and ask the agent of the session to read the JSON verdict aloud.
        fr: |
          Diffuser le fichier vers l'API Voice Live, et demander à l'agent de la session de lire le verdict JSON à voix haute.
answer: { optionId: b }
explanation:
  correct:
    en: |
      gpt-audio-mini accepts audio input in Chat Completions as an `input_audio` content part (base64 data and a format such as `wav`) and supports audio input with text output. The model reasons over the audio itself, including the tone of voice, and returns the verdict in a single call. The files are well under the 20 MB limit for audio input.
    fr: |
      gpt-audio-mini accepte une entrée audio dans Chat Completions sous forme de partie de contenu `input_audio` (données base64 et un format comme `wav`) et prend en charge l'entrée audio avec une sortie texte. Le modèle raisonne sur l'audio lui-même, y compris sur le ton de la voix, et renvoie le verdict en un seul appel. Les fichiers sont bien en dessous de la limite de 20 Mo pour l'entrée audio.
  options:
    a:
      en: |
        A transcript keeps the words but loses the tone of voice, and the job would need two calls per recording.
      fr: |
        Une transcription conserve les mots mais perd le ton de la voix, et le traitement aurait besoin de deux appels par enregistrement.
    c:
      en: |
        Sentiment analysis of a transcript judges only the words, and this design also needs two calls per recording.
      fr: |
        L'analyse des sentiments d'une transcription ne juge que les mots, et cette conception nécessite aussi deux appels par enregistrement.
    d:
      en: |
        The Voice Live API is designed for real-time speech-to-speech conversations with voice agents, not for a nightly batch that returns a JSON verdict.
      fr: |
        L'API Voice Live est conçue pour des conversations vocales en temps réel avec des agents vocaux, pas pour un traitement de nuit qui renvoie un verdict JSON.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart
