id: ai103-4b-audio-input-facts
objective: "4.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Field Services sends technicians' recorded voice notes to a gpt-audio deployment through Chat Completions. The model answers questions about each note, sometimes with a spoken answer.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Field Services envoie les notes vocales enregistrées par ses techniciens à un déploiement gpt-audio via Chat Completions. Le modèle répond à des questions sur chaque note, parfois avec une réponse parlée.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A 35 MB voice note can be sent to the model in a single request.
        fr: Une note vocale de 35 Mo peut être envoyée au modèle en une seule requête.
    - id: s2
      text:
        en: To ask a follow-up question about a spoken answer, the next request can reference that answer by the value of `message.audio.id`.
        fr: Pour poser une question complémentaire sur une réponse parlée, la requête suivante peut référencer cette réponse par la valeur de `message.audio.id`.
    - id: s3
      text:
        en: When `stream` is set to true and the audio modality is requested, the output audio format must be pcm16.
        fr: Quand `stream` est défini sur true et que la modalité audio est demandée, le format de l'audio de sortie doit être pcm16.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      The maximum audio file size is 20 MB, so a 35 MB note must be split or compressed. In a multi-turn chat, the assistant message of the next request references the earlier spoken answer by its `audio.id`. With streaming and the audio modality, pcm16 is the only supported audio format.
    fr: |
      La taille maximale d'un fichier audio est de 20 Mo : une note de 35 Mo doit être découpée ou compressée. Dans une conversation à plusieurs tours, le message assistant de la requête suivante référence la réponse parlée précédente par son `audio.id`. Avec le streaming et la modalité audio, pcm16 est le seul format audio pris en charge.
references:
  - title: Quickstart - Get started with Azure OpenAI audio generation
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/audio-completions-quickstart
