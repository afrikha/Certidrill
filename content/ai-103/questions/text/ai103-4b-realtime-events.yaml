id: ai103-4b-realtime-events
objective: "4.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. is building a push-to-talk voice assistant on the GPT Realtime API with a gpt-realtime deployment. Turn detection is set to `none`, so the client decides when the user has finished speaking.

    Which client event should the application send for each action? To answer, drag the appropriate events to the correct actions. Each event may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. crée un assistant vocal « appuyer pour parler » sur l'API GPT Realtime avec un déploiement gpt-realtime. La détection de fin de tour est définie sur `none` : c'est le client qui décide quand l'utilisateur a fini de parler.

    Quel événement client l'application doit-elle envoyer pour chaque action ? Pour répondre, faites glisser les événements appropriés vers les actions correspondantes. Chaque événement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: update, text: session.update }
    - { id: append, text: input_audio_buffer.append }
    - { id: commit, text: input_audio_buffer.commit }
    - { id: create, text: response.create }
    - { id: truncate, text: conversation.item.truncate }
    - { id: done, text: response.done }
  targets:
    - { id: t1, text: { en: "Set the instructions, the voice and the turn detection mode", fr: "Définir les instructions, la voix et le mode de détection de fin de tour" } }
    - { id: t2, text: { en: "Send a chunk of microphone audio while the user holds the button", fr: "Envoyer un fragment d'audio du microphone pendant que l'utilisateur maintient le bouton" } }
    - { id: t3, text: { en: "Turn the buffered audio into a user message when the button is released", fr: "Transformer l'audio mis en mémoire tampon en message utilisateur quand le bouton est relâché" } }
    - { id: t4, text: { en: "Ask the model to generate its answer", fr: "Demander au modèle de générer sa réponse" } }
answer:
  mapping: { t1: update, t2: append, t3: commit, t4: create }
explanation:
  correct:
    en: |
      `session.update` configures the session (instructions, voice, turn detection, tools). The client appends audio with `input_audio_buffer.append` and commits the buffer with `input_audio_buffer.commit`, which creates a user message item. With turn detection set to `none`, the server does not answer on its own, so the client sends `response.create`.
    fr: |
      `session.update` configure la session (instructions, voix, détection de fin de tour, outils). Le client ajoute l'audio avec `input_audio_buffer.append` et valide la mémoire tampon avec `input_audio_buffer.commit`, ce qui crée un élément de message utilisateur. Avec la détection de fin de tour définie sur `none`, le serveur ne répond pas de lui-même : le client envoie `response.create`.
  options:
    truncate:
      en: "`conversation.item.truncate` cuts the audio of an answer before it is played, for example after an interruption."
      fr: "`conversation.item.truncate` coupe l'audio d'une réponse avant sa lecture, par exemple après une interruption."
    done:
      en: "`response.done` is a server event that signals the end of a response."
      fr: "`response.done` est un événement serveur qui signale la fin d'une réponse."
references:
  - title: Use the GPT Realtime API for speech and audio with Azure OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/realtime-audio
