stem:
  en: You use a Content Safety blocklist that contains the customer data.
  fr: Vous utilisez une liste de blocage Content Safety qui contient les données des clients.
body:
  solution:
    en: |
      You create an Azure AI Content Safety blocklist and add the names, phone numbers and payment card numbers of the customers as blocklist items. The function sends each transcript to `text:analyze` with `blocklistNames` set to this list and stores the transcript when `blocklistsMatch` is empty.
    fr: |
      Vous créez une liste de blocage Azure AI Content Safety et y ajoutez les noms, numéros de téléphone et numéros de carte de paiement des clients en tant qu'éléments. La fonction envoie chaque transcription à `text:analyze` avec `blocklistNames` défini sur cette liste et stocke la transcription lorsque `blocklistsMatch` est vide.
answer: { value: false }
explanation:
  correct:
    en: A blocklist only flags the terms it finds; the response contains `blocklistsMatch` and the harm categories, never a masked copy of the text. Blocklists are also limited to 10,000 terms in total, far below the data of two million customers. Personal data is detected and masked by Azure Language PII detection, not by Content Safety.
    fr: "Une liste de blocage ne fait que signaler les termes qu'elle trouve ; la réponse contient `blocklistsMatch` et les catégories de préjudice, jamais une copie masquée du texte. Les listes de blocage sont en outre limitées à 10 000 termes au total, bien en dessous des données de deux millions de clients. Les données personnelles sont détectées et masquées par la détection des PII d'Azure Language, et non par Content Safety."
references:
  - title: Use blocklists for text moderation
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/how-to/use-blocklist
