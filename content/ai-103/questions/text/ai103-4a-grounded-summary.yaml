id: ai103-4a-grounded-summary
objective: "4.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Legal builds an app that summarizes the obligations of supplier contracts for compliance officers. The current request contains only the instructions and the contract title, so the model writes the summary from its general knowledge. Reviewers find obligations in the summaries that don't appear in the contracts.

    You need to ensure that every obligation in a summary comes from the contract and can be checked by a reviewer.

    What should you do?
  fr: |
    Contoso Legal crée une application qui résume les obligations des contrats fournisseurs pour les responsables de la conformité. La requête actuelle ne contient que les instructions et le titre du contrat : le modèle rédige donc le résumé à partir de ses connaissances générales. Les relecteurs trouvent dans les résumés des obligations qui ne figurent pas dans les contrats.

    Vous devez garantir que chaque obligation d'un résumé provient du contrat et peut être vérifiée par un relecteur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the contract text to the prompt and require an inline clause citation for each obligation.", fr: "Ajouter le texte du contrat à l'invite et exiger une citation de clause en ligne pour chaque obligation." } }
    - { id: b, text: { en: "Lower the temperature to 0 and keep the current instructions and contract title.", fr: "Abaisser la température à 0 et conserver les instructions et le titre du contrat actuels." } }
    - { id: c, text: { en: "Fine-tune the model on 500 contracts and summaries from previous years.", fr: "Effectuer un réglage fin du modèle sur 500 contrats et résumés des années précédentes." } }
    - { id: d, text: { en: "Increase max_output_tokens so that the model can list every obligation.", fr: "Augmenter max_output_tokens pour que le modèle puisse lister chaque obligation." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Grounding data gives the model the source to draw its answer from, which is one of the most effective ways to get reliable output. Asking for citations makes the statements more likely to be grounded, and inline citations placed next to each obligation let a reviewer check the clause.
    fr: |
      Les données d'ancrage donnent au modèle la source sur laquelle s'appuyer, ce qui est l'un des moyens les plus efficaces d'obtenir une sortie fiable. Demander des citations rend les affirmations plus susceptibles d'être ancrées, et des citations en ligne placées à côté de chaque obligation permettent à un relecteur de vérifier la clause.
  options:
    b:
      en: |
        A lower temperature makes the output more focused, but the model still has no contract text to draw from.
      fr: |
        Une température plus basse rend la sortie plus ciblée, mais le modèle n'a toujours aucun texte de contrat sur lequel s'appuyer.
    c:
      en: |
        Fine-tuning adjusts style and behavior; it doesn't give the model the content of each new contract.
      fr: |
        Le réglage fin ajuste le style et le comportement ; il ne donne pas au modèle le contenu de chaque nouveau contrat.
    d:
      en: |
        A larger output limit allows longer summaries, but it doesn't make their content come from the contract.
      fr: |
        Une limite de sortie plus grande permet des résumés plus longs, mais elle ne fait pas provenir leur contenu du contrat.
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering
