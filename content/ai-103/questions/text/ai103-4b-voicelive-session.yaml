id: ai103-4b-voicelive-session
objective: "4.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Adatum Travel is building a phone agent with the Voice Live API and a gpt-4.1 deployment. The requirements are:

    - Callers speak French, Spanish or German, and natural pauses must not end their turn too early.
    - The product names "Adatum Flex" and "NorthPass" must be recognized by using a phrase list.
    - The telephony bridge sends 16 kHz audio.

    How should you complete the session configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Travel crée un agent téléphonique avec l'API Voice Live et un déploiement gpt-4.1. Les exigences sont les suivantes :

    - Les appelants parlent français, espagnol ou allemand, et les pauses naturelles ne doivent pas mettre fin trop tôt à leur tour de parole.
    - Les noms de produits « Adatum Flex » et « NorthPass » doivent être reconnus à l'aide d'une liste d'expressions.
    - La passerelle de téléphonie envoie de l'audio à 16 kHz.

    Comment devez-vous compléter la configuration de la session ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "type": "session.update",
      "session": {
        "turn_detection": { "type": "[[td]]" },
        "input_audio_sampling_rate": [[rate]],
        "input_audio_transcription": {
          "model": "[[tm]]",
          "phrase_list": ["Adatum Flex", "NorthPass"]
        }
      }
    }
  slots:
    - id: td
      options:
        - { id: server, text: server_vad }
        - { id: semantic, text: semantic_vad }
        - { id: azsem, text: azure_semantic_vad }
        - { id: azmulti, text: azure_semantic_vad_multilingual }
    - id: rate
      options:
        - { id: r8, text: "8000" }
        - { id: r16, text: "16000" }
        - { id: r24, text: "24000" }
    - id: tm
      options:
        - { id: azspeech, text: azure-speech }
        - { id: whisper, text: whisper-1 }
        - { id: gpt4o, text: gpt-4o-transcribe }
answer:
  values: { td: azmulti, rate: r16, tm: azspeech }
explanation:
  correct:
    en: |
      `azure_semantic_vad_multilingual` detects the end of a turn from what is said, works with all models and supports French, Spanish and German. `input_audio_sampling_rate` accepts 16000 or 24000 (the default), so 16000 matches the bridge. Only `azure-speech` works with a non-multimodal model such as gpt-4.1 and supports phrase lists.
    fr: |
      `azure_semantic_vad_multilingual` détecte la fin d'un tour d'après ce qui est dit, fonctionne avec tous les modèles et prend en charge le français, l'espagnol et l'allemand. `input_audio_sampling_rate` accepte 16000 ou 24000 (la valeur par défaut) : 16000 correspond à la passerelle. Seul `azure-speech` fonctionne avec un modèle non multimodal comme gpt-4.1 et prend en charge les listes d'expressions.
  options:
    server:
      en: "`server_vad` ends the turn on silence, so natural pauses can end it too early."
      fr: "`server_vad` met fin au tour sur un silence : des pauses naturelles peuvent y mettre fin trop tôt."
    semantic:
      en: "`semantic_vad` works only with gpt-realtime and gpt-realtime-mini, not with gpt-4.1."
      fr: "`semantic_vad` ne fonctionne qu'avec gpt-realtime et gpt-realtime-mini, pas avec gpt-4.1."
    azsem:
      en: "`azure_semantic_vad` is designed mainly for English; the multilingual variant covers French, Spanish and German."
      fr: "`azure_semantic_vad` est conçu principalement pour l'anglais ; c'est la variante multilingue qui couvre le français, l'espagnol et l'allemand."
    r8:
      en: "8000 is not a supported value; the supported values are 16000 and 24000."
      fr: "8000 n'est pas une valeur prise en charge ; les valeurs prises en charge sont 16000 et 24000."
    r24:
      en: "24000 is the default, but the bridge sends 16 kHz audio."
      fr: "24000 est la valeur par défaut, mais la passerelle envoie de l'audio à 16 kHz."
    whisper:
      en: "whisper-1 works only with gpt-realtime models and does not support phrase lists."
      fr: "whisper-1 ne fonctionne qu'avec les modèles gpt-realtime et ne prend pas en charge les listes d'expressions."
    gpt4o:
      en: "gpt-4o-transcribe works only with gpt-realtime models and does not support phrase lists."
      fr: "gpt-4o-transcribe ne fonctionne qu'avec les modèles gpt-realtime et ne prend pas en charge les listes d'expressions."
references:
  - title: How to use the Voice Live API
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to
  - title: How to customize Voice Live input and output
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to-customize
