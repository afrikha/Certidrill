id: ai103-4b-diarization
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation records its project meetings as mono audio files. Each meeting has up to six participants who speak in turn.

    A meeting-notes agent must receive a transcript that shows which participant said each sentence, so that it can assign action items.

    Which speech to text feature should you enable?
  fr: |
    Adatum Corporation enregistre ses réunions de projet sous forme de fichiers audio mono. Chaque réunion compte jusqu'à six participants qui parlent à tour de rôle.

    Un agent de comptes rendus doit recevoir une transcription qui indique quel participant a prononcé chaque phrase, afin d'attribuer les actions à mener.

    Quelle fonctionnalité de reconnaissance vocale devez-vous activer ?
body:
  options:
    - { id: a, text: { en: "Phrase list", fr: "Liste d'expressions" } }
    - { id: b, text: { en: "Language identification", fr: "Identification de la langue" } }
    - { id: c, text: { en: "Diarization", fr: "Diarisation" } }
    - { id: d, text: { en: "Multichannel transcription", fr: "Transcription multicanal" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Diarization distinguishes and separates the different speakers of a recording, so each part of the transcript is attributed to a speaker. Azure Speech can identify up to 35 speakers in one recording, which covers six participants.
    fr: |
      La diarisation distingue et sépare les différents interlocuteurs d'un enregistrement : chaque partie de la transcription est attribuée à un interlocuteur. Azure Speech peut identifier jusqu'à 35 interlocuteurs dans un enregistrement, ce qui couvre six participants.
  options:
    a:
      en: |
        A phrase list improves the recognition of specific words, such as product names; it does not identify speakers.
      fr: |
        Une liste d'expressions améliore la reconnaissance de mots précis, comme des noms de produits ; elle n'identifie pas les interlocuteurs.
    b:
      en: |
        Language identification detects the spoken language, not who is speaking.
      fr: |
        L'identification de la langue détecte la langue parlée, pas la personne qui parle.
    d:
      en: |
        Multichannel transcription transcribes up to two audio channels separately; the recordings are mono and have up to six speakers.
      fr: |
        La transcription multicanal transcrit séparément jusqu'à deux canaux audio ; les enregistrements sont mono et comptent jusqu'à six interlocuteurs.
references:
  - title: What is speech to text?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-to-text
