id: ai103-4a-feedback-topics
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys collects about 20,000 free-text survey answers each month. Each answer must be tagged with one or more topics from a fixed list of 12 topics defined by the product team, such as Delivery, Pricing and Assembly. The team has no labeled training data. Company policy requires new solutions to use only Azure Language features that Microsoft recommends for new development, or models in Microsoft Foundry.

    What should you use to tag the answers?
  fr: |
    Tailspin Toys recueille environ 20 000 réponses libres à des enquêtes chaque mois. Chaque réponse doit être étiquetée avec un ou plusieurs sujets d'une liste fixe de 12 sujets définie par l'équipe produit, comme Delivery, Pricing et Assembly. L'équipe ne dispose d'aucune donnée d'entraînement étiquetée. La stratégie de l'entreprise impose que les nouvelles solutions n'utilisent que les fonctionnalités d'Azure Language recommandées par Microsoft pour les nouveaux développements, ou des modèles de Microsoft Foundry.

    Que devez-vous utiliser pour étiqueter les réponses ?
body:
  options:
    - { id: a, text: { en: "Azure Language key phrase extraction, then a lookup of each phrase in the topic list", fr: "L'extraction d'expressions clés d'Azure Language, puis une recherche de chaque expression dans la liste de sujets" } }
    - { id: b, text: { en: "Azure Language custom text classification, with a multi-label project for the 12 topics", fr: "La classification de texte personnalisée d'Azure Language, avec un projet multi-étiquette pour les 12 sujets" } }
    - { id: c, text: { en: "A model deployment with structured outputs, with a topics array whose items use an enum of the 12 topics", fr: "Un déploiement de modèle avec des sorties structurées, avec un tableau de sujets dont les éléments utilisent un enum des 12 sujets" } }
    - { id: d, text: { en: "Azure Language entity linking, with each linked entity mapped to the closest topic", fr: "La liaison d'entités d'Azure Language, avec chaque entité liée associée au sujet le plus proche" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A model with structured outputs can classify text into labels you define without any training data. An `enum` on the items of an array restricts every returned topic to the 12 allowed values, and the strict schema guarantees the shape of each result.
    fr: |
      Un modèle avec des sorties structurées peut classer un texte dans des étiquettes que vous définissez, sans aucune donnée d'entraînement. Un `enum` sur les éléments d'un tableau limite chaque sujet renvoyé aux 12 valeurs autorisées, et le schéma strict garantit la forme de chaque résultat.
  options:
    a:
      en: |
        Key phrase extraction is a legacy feature, and it returns phrases taken from the text, not labels from your list.
      fr: |
        L'extraction d'expressions clés est une fonctionnalité héritée, et elle renvoie des expressions tirées du texte, pas des étiquettes de votre liste.
    b:
      en: |
        Custom text classification is a legacy feature, and it requires labeled documents to train a model, which the team doesn't have.
      fr: |
        La classification de texte personnalisée est une fonctionnalité héritée, et elle exige des documents étiquetés pour entraîner un modèle, dont l'équipe ne dispose pas.
    d:
      en: |
        Entity linking is a legacy feature that links entities to Wikipedia; it doesn't classify an answer into business topics.
      fr: |
        La liaison d'entités est une fonctionnalité héritée qui lie des entités à Wikipédia ; elle ne classe pas une réponse dans des sujets métier.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
  - title: What is Azure Language in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview
