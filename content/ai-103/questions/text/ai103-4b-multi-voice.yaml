id: ai103-4b-multi-voice
objective: "4.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Tours offers guided tours in English. Visitors listen through headsets on three audio channels: French, Spanish and Italian. A tour agent must recognize the guide's speech once and play each translation aloud on its own channel, with a voice that matches the language.

    The Speech SDK is used with a Microsoft Foundry resource. What should you do?
  fr: |
    Wingtip Tours propose des visites guidées en anglais. Les visiteurs écoutent avec un casque sur trois canaux audio : français, espagnol et italien. Un agent de visite doit reconnaître une seule fois la parole du guide et lire chaque traduction à voix haute sur son propre canal, avec une voix qui correspond à la langue.

    Le SDK Speech est utilisé avec une ressource Microsoft Foundry. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add the fr, es and it target languages, set `voice_name` to a multilingual voice, and play the audio of the `synthesizing` event on each channel", fr: "Ajouter les langues cibles fr, es et it, définir `voice_name` sur une voix multilingue, et lire l'audio de l'événement `synthesizing` sur chaque canal" } }
    - { id: b, text: { en: "Add the fr, es and it target languages, and synthesize each entry of `result.translations` with a `SpeechSynthesizer` and a voice for that language", fr: "Ajouter les langues cibles fr, es et it, et synthétiser chaque entrée de `result.translations` avec un `SpeechSynthesizer` et une voix propre à cette langue" } }
    - { id: c, text: { en: "Configure language identification with the fr-FR, es-ES and it-IT candidate locales, and set `voice_name` for each locale", fr: "Configurer l'identification de la langue avec les paramètres régionaux candidats fr-FR, es-ES et it-IT, et définir `voice_name` pour chaque paramètre régional" } }
    - { id: d, text: { en: "Create three `SpeechRecognizer` objects with `speech_recognition_language` set to fr-FR, es-ES and it-IT", fr: "Créer trois objets `SpeechRecognizer` avec `speech_recognition_language` défini sur fr-FR, es-ES et it-IT" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      One `TranslationRecognizer` can return several target languages in the `translations` dictionary. Event-based synthesis works only with a single translation, so for several languages you iterate over the dictionary and synthesize each text yourself with a `SpeechSynthesizer` and a voice in that language.
    fr: |
      Un seul `TranslationRecognizer` peut renvoyer plusieurs langues cibles dans le dictionnaire `translations`. La synthèse par événement ne fonctionne qu'avec une seule traduction : pour plusieurs langues, vous parcourez le dictionnaire et synthétisez vous-même chaque texte avec un `SpeechSynthesizer` et une voix dans cette langue.
  options:
    a:
      en: |
        The `synthesizing` event supports only one target language, and the `voice_name` value must be in the same language as that target.
      fr: |
        L'événement `synthesizing` ne prend en charge qu'une seule langue cible, et la valeur de `voice_name` doit être dans la même langue que cette cible.
    c:
      en: |
        Language identification detects the language spoken by the guide; it does not choose the output languages.
      fr: |
        L'identification de la langue détecte la langue parlée par le guide ; elle ne choisit pas les langues de sortie.
    d:
      en: |
        `speech_recognition_language` sets the language of the input speech; `SpeechRecognizer` does not translate.
      fr: |
        `speech_recognition_language` définit la langue de la parole en entrée ; `SpeechRecognizer` ne traduit pas.
references:
  - title: How to recognize and translate speech
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech?pivots=programming-language-python
  - title: What is speech translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-translation
