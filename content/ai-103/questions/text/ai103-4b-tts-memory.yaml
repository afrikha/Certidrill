id: ai103-4b-tts-memory
objective: "4.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's phone agent writes each reply as an SSML document that sets a speaking style. The server that runs the agent has no speaker: the synthesized audio must be kept in memory as bytes and sent to a telephony gateway, without writing a file.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'agent téléphonique de Woodgrove Bank rédige chaque réponse sous forme de document SSML qui définit un style d'élocution. Le serveur qui exécute l'agent n'a pas de haut-parleur : l'audio synthétisé doit être conservé en mémoire sous forme d'octets et envoyé à une passerelle de téléphonie, sans écrire de fichier.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    speech_config = speechsdk.SpeechConfig(subscription=key, endpoint=endpoint)
    speech_config.set_speech_synthesis_output_format(
        speechsdk.SpeechSynthesisOutputFormat.Riff24Khz16BitMonoPcm)
    synthesizer = speechsdk.SpeechSynthesizer(
        speech_config=speech_config, audio_config=[[out]])

    result = synthesizer.[[speak]](ssml_reply).get()
    if result.reason == speechsdk.ResultReason.[[ok]]:
        gateway.send(result.audio_data)
  slots:
    - id: out
      options:
        - { id: none, text: None }
        - { id: speaker, text: speechsdk.audio.AudioOutputConfig(use_default_speaker=True) }
        - { id: file, text: 'speechsdk.audio.AudioOutputConfig(filename="reply.wav")' }
    - id: speak
      options:
        - { id: text, text: speak_text_async }
        - { id: ssml, text: speak_ssml_async }
        - { id: start, text: start_speaking_text_async }
    - id: ok
      options:
        - { id: done, text: SynthesizingAudioCompleted }
        - { id: partial, text: SynthesizingAudio }
        - { id: recog, text: RecognizedSpeech }
answer:
  values: { out: none, speak: ssml, ok: done }
explanation:
  correct:
    en: |
      Passing `None` as `audio_config` keeps the result in memory instead of playing it, and `result.audio_data` contains the output as a `bytes` object. `speak_ssml_async` sends an SSML document, so the speaking style is applied. A finished synthesis returns the reason `SynthesizingAudioCompleted`.
    fr: |
      Passer `None` comme `audio_config` conserve le résultat en mémoire au lieu de le lire, et `result.audio_data` contient la sortie sous forme d'objet `bytes`. `speak_ssml_async` envoie un document SSML : le style d'élocution est appliqué. Une synthèse terminée renvoie la raison `SynthesizingAudioCompleted`.
  options:
    speaker:
      en: "The default speaker plays the audio on the server, which has no speaker."
      fr: "Le haut-parleur par défaut lit l'audio sur le serveur, qui n'en a pas."
    file:
      en: "This configuration writes a WAV file, which the requirement excludes."
      fr: "Cette configuration écrit un fichier WAV, ce que l'exigence exclut."
    text:
      en: "`speak_text_async` would read the SSML markup as plain text instead of interpreting it."
      fr: "`speak_text_async` lirait le balisage SSML comme du texte brut au lieu de l'interpréter."
    start:
      en: "`start_speaking_text_async` also takes plain text, not SSML."
      fr: "`start_speaking_text_async` prend lui aussi du texte brut, pas du SSML."
    partial:
      en: "`SynthesizingAudio` marks an intermediate chunk, not a completed synthesis."
      fr: "`SynthesizingAudio` désigne un fragment intermédiaire, pas une synthèse terminée."
    recog:
      en: "`RecognizedSpeech` is a speech to text result reason."
      fr: "`RecognizedSpeech` est une raison de résultat de la reconnaissance vocale."
references:
  - title: How to synthesize speech from text
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis?pivots=programming-language-python
