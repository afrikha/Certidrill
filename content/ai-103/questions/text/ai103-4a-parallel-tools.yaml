id: ai103-4a-parallel-tools
objective: "4.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware builds an order-management assistant that uses the Chat Completions API of a gpt-4.1 deployment. The request defines three function tools, each with `strict` set to `true`, so that the model extracts the order details as function arguments. During testing, some responses contain several tool calls in the same turn, and in those responses the arguments don't always match the function schemas.

    You need to ensure that the function arguments always match the schemas. The model must still be able to choose which function to call.

    What should you do?
  fr: |
    Litware crée un assistant de gestion des commandes qui utilise l'API Chat Completions d'un déploiement gpt-4.1. La requête définit trois outils de fonction, chacun avec `strict` défini sur `true`, afin que le modèle extraie les détails de la commande comme arguments de fonction. Pendant les tests, certaines réponses contiennent plusieurs appels d'outils dans le même tour, et dans ces réponses les arguments ne respectent pas toujours les schémas des fonctions.

    Vous devez garantir que les arguments des fonctions respectent toujours les schémas. Le modèle doit toujours pouvoir choisir la fonction à appeler.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set tool_choice to required in the request.", fr: "Définir tool_choice sur required dans la requête." } }
    - { id: b, text: { en: "Set response_format to json_object in the request.", fr: "Définir response_format sur json_object dans la requête." } }
    - { id: c, text: { en: "Set temperature to 0 in the request.", fr: "Définir temperature sur 0 dans la requête." } }
    - { id: d, text: { en: "Set parallel_tool_calls to false in the request.", fr: "Définir parallel_tool_calls sur false dans la requête." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Structured outputs, including strict function calling, aren't supported with parallel function calls. Setting `parallel_tool_calls` to `false` makes the model return at most one tool call per turn, so strict schema adherence applies to the arguments, and the model still chooses the function.
    fr: |
      Les sorties structurées, y compris l'appel de fonction strict, ne sont pas prises en charge avec les appels de fonction parallèles. Définir `parallel_tool_calls` sur `false` fait renvoyer au modèle un seul appel d'outil au plus par tour : le respect strict du schéma s'applique alors aux arguments, et le modèle choisit toujours la fonction.
  options:
    a:
      en: |
        `tool_choice` set to `required` forces the model to call a tool, but it doesn't stop parallel calls, which are the cause of the schema mismatch.
      fr: |
        `tool_choice` défini sur `required` oblige le modèle à appeler un outil, mais il n'empêche pas les appels parallèles, qui sont la cause de l'écart avec le schéma.
    b:
      en: |
        JSON mode applies to the message content, not to tool arguments, and it doesn't enforce a schema.
      fr: |
        Le mode JSON s'applique au contenu du message, pas aux arguments des outils, et il n'impose aucun schéma.
    c:
      en: |
        A temperature of 0 makes the output more deterministic, but it doesn't give schema adherence to parallel tool calls.
      fr: |
        Une température de 0 rend la sortie plus déterministe, mais elle n'apporte pas le respect du schéma aux appels d'outils parallèles.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
