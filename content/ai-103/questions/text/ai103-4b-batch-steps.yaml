id: ai103-4b-batch-steps
objective: "4.2.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has 8,000 recorded support calls in English on a local file share. A support agent in Microsoft Foundry will use the transcripts of these calls as knowledge. You plan to use the batch transcription API of Azure Speech with the base model.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware, Inc. dispose de 8 000 appels au support enregistrés en anglais sur un partage de fichiers local. Un agent de support dans Microsoft Foundry utilisera les transcriptions de ces appels comme connaissances. Vous prévoyez d'utiliser l'API de transcription par lots d'Azure Speech avec le modèle de base.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: upload, text: { en: "Upload the recordings to an Azure Blob Storage container that the Speech service can read.", fr: "Charger les enregistrements dans un conteneur Stockage Blob Azure que le service Speech peut lire." } }
    - { id: submit, text: { en: "Submit a transcription that sets contentContainerUrl, locale en-US and a display name.", fr: "Soumettre une transcription qui définit contentContainerUrl, le paramètre régional en-US et un nom d'affichage." } }
    - { id: poll, text: { en: "Get the transcription until its status is Succeeded.", fr: "Interroger la transcription jusqu'à ce que son état soit Succeeded." } }
    - { id: files, text: { en: "List the result files of the transcription and download the transcripts.", fr: "Lister les fichiers de résultats de la transcription et télécharger les transcriptions." } }
    - { id: endpoint, text: { en: "Deploy the base model to a custom speech endpoint.", fr: "Déployer le modèle de base sur un point de terminaison de reconnaissance vocale personnalisée." } }
    - { id: phrases, text: { en: "Add a phrase list with Proseware's product names to the transcription request.", fr: "Ajouter une liste d'expressions avec les noms de produits de Proseware à la requête de transcription." } }
answer:
  sequence: [ upload, submit, poll, files ]
explanation:
  correct:
    en: |
      Batch transcription reads audio from URLs or a storage container, so the recordings must first be in Blob Storage. You then submit the transcription with the audio location, the locale and a display name, wait for the asynchronous job to succeed, and retrieve the result files.
    fr: |
      La transcription par lots lit l'audio à partir d'URL ou d'un conteneur de stockage : les enregistrements doivent d'abord se trouver dans Stockage Blob. Vous soumettez ensuite la transcription avec l'emplacement de l'audio, le paramètre régional et un nom d'affichage, vous attendez la réussite du travail asynchrone, puis vous récupérez les fichiers de résultats.
  options:
    endpoint:
      en: "The base model needs no deployment, and even a custom model needs no hosted endpoint for batch transcription."
      fr: "Le modèle de base ne demande aucun déploiement, et même un modèle personnalisé n'a pas besoin de point de terminaison hébergé pour la transcription par lots."
    phrases:
      en: "The batch transcription API does not support phrase lists."
      fr: "L'API de transcription par lots ne prend pas en charge les listes d'expressions."
references:
  - title: Create a batch transcription
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/batch-transcription-create
