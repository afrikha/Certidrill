id: ai103-4b-phrase-list-modes
objective: "4.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is adding voice input to a field-service agent. Speech to text often misrecognizes five product names, such as "Litware Pulse" and "QuadraFix". The team wants to send these names as a phrase list with each request and does not want to train a model.

    Which two speech to text options can use the phrase list? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. ajoute la saisie vocale à un agent d'intervention sur le terrain. La reconnaissance vocale reconnaît souvent mal cinq noms de produits, comme « Litware Pulse » et « QuadraFix ». L'équipe veut envoyer ces noms sous forme de liste d'expressions avec chaque requête et ne veut pas entraîner de modèle.

    Quelles sont les deux options de reconnaissance vocale qui peuvent utiliser la liste d'expressions ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Real-time speech to text in the Speech SDK", fr: "La reconnaissance vocale en temps réel du SDK Speech" } }
    - { id: b, text: { en: "The batch transcription API", fr: "L'API de transcription par lots" } }
    - { id: c, text: { en: "The fast transcription API", fr: "L'API de transcription rapide" } }
    - { id: d, text: { en: "The Voice Live API with the whisper-1 transcription model", fr: "L'API Voice Live avec le modèle de transcription whisper-1" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Phrase lists work with real-time speech to text (Speech SDK, Speech CLI) and with the fast transcription API, on base or custom endpoints, without training. In the Speech SDK, you create the list with `PhraseListGrammar.from_recognizer` and add each phrase.
    fr: |
      Les listes d'expressions fonctionnent avec la reconnaissance vocale en temps réel (SDK Speech, Speech CLI) et avec l'API de transcription rapide, sur des points de terminaison de base ou personnalisés, sans entraînement. Dans le SDK Speech, vous créez la liste avec `PhraseListGrammar.from_recognizer` et vous y ajoutez chaque expression.
  options:
    b:
      en: |
        The batch transcription API does not support phrase lists.
      fr: |
        L'API de transcription par lots ne prend pas en charge les listes d'expressions.
    d:
      en: |
        In Voice Live, the phrase list is not supported with the whisper-1, gpt-4o-transcribe or gpt-4o-mini-transcribe transcription models; it needs azure-speech.
      fr: |
        Dans Voice Live, la liste d'expressions n'est pas prise en charge avec les modèles de transcription whisper-1, gpt-4o-transcribe ou gpt-4o-mini-transcribe ; elle demande azure-speech.
references:
  - title: Improve recognition accuracy with phrase list
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/improve-accuracy-phrase-list?pivots=programming-language-python
  - title: How to customize Voice Live input and output
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to-customize
