id: ai103-4b-llm-speech-translate
objective: "4.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware Research stores recorded interviews with Korean-speaking customers as MP3 files of up to 40 minutes. A research agent needs an English translation of each interview as text.

    The output format must be controlled by an instruction such as "Output must be in lexical format.", and each file must be processed with a single request to Azure Speech.

    What should you use?
  fr: |
    Litware Research stocke des entretiens enregistrés avec des clients coréanophones sous forme de fichiers MP3 d'une durée maximale de 40 minutes. Un agent de recherche a besoin d'une traduction anglaise de chaque entretien sous forme de texte.

    Le format de sortie doit être contrôlé par une instruction comme « Output must be in lexical format. », et chaque fichier doit être traité par une seule requête à Azure Speech.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Batch transcription with the ko-KR locale, and then Azure Translator for each transcript", fr: "La transcription par lots avec le paramètre régional ko-KR, puis Azure Translator pour chaque transcription" } }
    - { id: b, text: { en: "A `TranslationRecognizer` with continuous recognition of each file from ko-KR to en", fr: "Un `TranslationRecognizer` avec une reconnaissance continue de chaque fichier de ko-KR vers en" } }
    - { id: c, text: { en: "Fast transcription with diarization enabled, and then a gpt-4.1 deployment that translates the transcript", fr: "La transcription rapide avec la diarisation activée, puis un déploiement gpt-4.1 qui traduit la transcription" } }
    - { id: d, text: { en: "Fast transcription with enhanced mode enabled, the translate task, the en target language and the prompt", fr: "La transcription rapide avec le mode amélioré activé, la tâche translate, la langue cible en et l'invite" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Azure LLM Speech runs through enhanced mode on the fast transcription endpoint. The translate task returns the speech as text in the language set by `targetLanguage`, and the `prompt` guides the output format, all in one request per file; files under 5 hours and 500 MB are supported.
    fr: |
      Azure LLM Speech s'exécute via le mode amélioré sur le point de terminaison de transcription rapide. La tâche translate renvoie la parole sous forme de texte dans la langue définie par `targetLanguage`, et `prompt` guide le format de sortie, le tout en une requête par fichier ; les fichiers de moins de 5 heures et 500 Mo sont pris en charge.
  options:
    a:
      en: |
        This design needs two services and two requests per file, and neither step accepts a formatting prompt.
      fr: |
        Cette conception demande deux services et deux requêtes par fichier, et aucune des deux étapes n'accepte d'invite de mise en forme.
    b:
      en: |
        Speech translation processes the audio at the pace of a live stream and has no prompt to control the output format.
      fr: |
        La traduction vocale traite l'audio au rythme d'un flux en direct et n'a pas d'invite pour contrôler le format de sortie.
    c:
      en: |
        This design uses a second call to a language model for the translation, so each file needs two requests.
      fr: |
        Cette conception utilise un second appel à un modèle de langage pour la traduction : chaque fichier demande deux requêtes.
references:
  - title: Azure LLM Speech for transcription and translation
    url: https://learn.microsoft.com/en-us/azure/ai-services/speech-service/llm-speech
