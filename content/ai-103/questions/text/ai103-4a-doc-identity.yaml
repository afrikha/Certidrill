id: ai103-4a-doc-identity
objective: "4.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a single-service Azure Translator resource on the S1 tier in the West Europe region, and a storage account in the same region with a source container and a target container. Company policy forbids storage account keys and SAS tokens.

    You need to translate the documents in the source container by using asynchronous batch document translation.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'une ressource Azure Translator à service unique sur le niveau S1 dans la région Europe Ouest, et d'un compte de stockage dans la même région avec un conteneur source et un conteneur cible. La stratégie de l'entreprise interdit les clés de compte de stockage et les jetons SAS.

    Vous devez traduire les documents du conteneur source à l'aide de la traduction de documents asynchrone par lots.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: system, text: { en: "Turn on the system-assigned managed identity of the Translator resource.", fr: "Activer l'identité managée affectée par le système de la ressource Translator." } }
    - { id: role, text: { en: "Assign the Storage Blob Data Contributor role to the identity at the storage account scope.", fr: "Attribuer le rôle Storage Blob Data Contributor à l'identité dans l'étendue du compte de stockage." } }
    - { id: submit, text: { en: "Submit the batch request with the plain container URLs.", fr: "Soumettre la requête par lots avec les URL simples des conteneurs." } }
    - { id: user, text: { en: "Create a user-assigned managed identity and attach it to the Translator resource.", fr: "Créer une identité managée affectée par l'utilisateur et l'attacher à la ressource Translator." } }
    - { id: sas, text: { en: "Generate a user delegation SAS for each container and append it to the URLs.", fr: "Générer une SAS de délégation d'utilisateur pour chaque conteneur et l'ajouter aux URL." } }
    - { id: cogrole, text: { en: "Assign the Cognitive Services User role to the identity on the Translator resource.", fr: "Attribuer le rôle Cognitive Services User à l'identité sur la ressource Translator." } }
answer:
  sequence: [system, role, submit]
explanation:
  correct:
    en: |
      Document translation authorizes storage access with the system-assigned managed identity of the Translator resource, which is off by default. The identity needs the Storage Blob Data Contributor role on the storage account to read the source documents and write the translations. The batch request then uses plain container URLs; a request that contains a SAS token URL fails with managed identity authorization.
    fr: |
      La traduction de documents autorise l'accès au stockage avec l'identité managée affectée par le système de la ressource Translator, désactivée par défaut. L'identité a besoin du rôle Storage Blob Data Contributor sur le compte de stockage pour lire les documents source et écrire les traductions. La requête par lots utilise ensuite des URL de conteneurs simples ; une requête qui contient une URL avec jeton SAS échoue avec l'autorisation par identité managée.
  options:
    user:
      en: |
        Document translation doesn't support user-assigned managed identities.
      fr: |
        La traduction de documents ne prend pas en charge les identités managées affectées par l'utilisateur.
    sas:
      en: |
        The policy forbids SAS tokens, and SAS URLs make a managed identity request fail.
      fr: |
        La stratégie interdit les jetons SAS, et les URL SAS font échouer une requête par identité managée.
    cogrole:
      en: |
        The identity must access the storage account, not the Translator resource.
      fr: |
        L'identité doit accéder au compte de stockage, pas à la ressource Translator.
references:
  - title: Create and use managed identities
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/how-to-guides/create-use-managed-identities
