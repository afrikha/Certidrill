id: ai103-2d-latency-breakdown
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso's support assistant uses a **gpt-4.1** Global Standard deployment named **support-chat**. A batch job also sends long report-generation requests to support-chat throughout the business day. The trace of a typical slow answer shows the following spans:

    | Span | Duration | Details |
    | --- | --- | --- |
    | execute_tool (search) | 0.4 s | 5 passages retrieved |
    | execute_tool (get_order) | 0.3 s | Order API |
    | Model call | 10.6 s | 1,100 input tokens, 1,450 output tokens |

    You need to reduce the time until the last token of each answer is received. The assistant must keep using gpt-4.1.

    Which two actions should you perform?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant de support de Contoso utilise un déploiement Global Standard **gpt-4.1** nommé **support-chat**. Un traitement par lots envoie aussi de longues requêtes de génération de rapports à support-chat tout au long de la journée de travail. La trace d'une réponse lente type présente les étendues suivantes :

    | Étendue | Durée | Détails |
    | --- | --- | --- |
    | execute_tool (search) | 0,4 s | 5 extraits récupérés |
    | execute_tool (get_order) | 0,3 s | API des commandes |
    | Appel au modèle | 10,6 s | 1 100 jetons d'entrée, 1 450 jetons de sortie |

    Vous devez réduire le délai jusqu'à la réception du dernier jeton de chaque réponse. L'assistant doit continuer à utiliser gpt-4.1.

    Quelles sont les deux actions à effectuer ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: c, text: { en: "Retrieve two passages instead of five for each question.", fr: "Récupérer deux extraits au lieu de cinq pour chaque question." } }
    - { id: a, text: { en: "Ask for concise answers and lower the output token limit of the requests.", fr: "Demander des réponses concises et abaisser la limite de jetons de sortie des requêtes." } }
    - { id: d, text: { en: "Stream the response to the user interface.", fr: "Diffuser la réponse en continu vers l'interface utilisateur." } }
    - { id: e, text: { en: "Request three completions with n set to 3 and keep the best one.", fr: "Demander trois complétions avec n défini sur 3 et conserver la meilleure." } }
    - { id: b, text: { en: "Send the report-generation requests to a separate deployment.", fr: "Envoyer les requêtes de génération de rapports à un déploiement distinct." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "The model call dominates the trace, and its time grows with each generated token: generation size has far more influence on latency than prompt size. Fewer output tokens therefore cut the time to last token. Mixing workloads on one deployment hurts latency, because short calls wait behind long completions, so Learn recommends a separate deployment per workload."
    fr: "L'appel au modèle domine la trace, et sa durée augmente avec chaque jeton généré : la taille de la génération influe bien plus sur la latence que la taille de l'invite. Moins de jetons de sortie réduisent donc le délai jusqu'au dernier jeton. Mélanger des charges de travail sur un même déploiement nuit à la latence, car les appels courts attendent derrière les longues complétions : Learn recommande donc un déploiement distinct par charge de travail."
  options:
    c: { en: "Each prompt token adds little time compared with a generated token, and retrieval takes only 0.4 seconds.", fr: "Chaque jeton d'invite ajoute peu de temps par rapport à un jeton généré, et la récupération ne prend que 0,4 seconde." }
    d: { en: "Streaming reduces the time to the first token, not the time to receive all the tokens.", fr: "La diffusion en continu réduit le délai jusqu'au premier jeton, pas le délai de réception de tous les jetons." }
    e: { en: "Generating several completions increases latency; for the fastest response, n isn't set or is 1.", fr: "Générer plusieurs complétions augmente la latence ; pour la réponse la plus rapide, n n'est pas défini ou vaut 1." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models performance & latency
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/latency
