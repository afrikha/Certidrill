id: ai103-2b-single-vector-store
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an agent named policy-agent. Its `FileSearchTool` uses a vector store named vs-policies that contains 2,000 HR policy files. The agent must now also answer from 300 PDF files that describe employee benefits.

    The solution must keep a single agent and minimize changes.

    What should you do?
  fr: |
    Northwind Traders dispose d'un agent nommé policy-agent. Son `FileSearchTool` utilise un magasin de vecteurs nommé vs-policies qui contient 2 000 fichiers de politiques RH. L'agent doit maintenant répondre aussi à partir de 300 fichiers PDF qui décrivent les avantages sociaux.

    La solution doit conserver un seul agent et réduire au minimum les modifications.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a vector store named vs-benefits, and add a second FileSearchTool that uses it", fr: "Créer un magasin de vecteurs nommé vs-benefits, et ajouter un second FileSearchTool qui l'utilise" } }
    - { id: b, text: { en: "Upload the 300 benefits files to vs-policies", fr: "Charger les 300 fichiers sur les avantages sociaux dans vs-policies" } }
    - { id: c, text: { en: "Create a vector store named vs-benefits, and pass both vector store IDs in vector_store_ids", fr: "Créer un magasin de vecteurs nommé vs-benefits, et passer les ID des deux magasins de vecteurs dans vector_store_ids" } }
    - { id: d, text: { en: "Add the benefits files to a memory store attached with the memory search tool", fr: "Ajouter les fichiers sur les avantages sociaux à un magasin de mémoire attaché avec l'outil de recherche de mémoire" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      You can attach at most one vector store to an agent. A vector store can hold up to 10,000 files, so the 2,300 files fit in vs-policies, and the agent searches them with its existing tool.
    fr: |
      Vous pouvez attacher au plus un magasin de vecteurs à un agent. Un magasin de vecteurs peut contenir jusqu'à 10 000 fichiers : les 2 300 fichiers tiennent donc dans vs-policies, et l'agent les recherche avec son outil existant.
  options:
    a: { en: "A second file search tool would attach a second vector store to the agent, which isn't supported.", fr: "Un second outil de recherche de fichiers attacherait un second magasin de vecteurs à l'agent, ce qui n'est pas pris en charge." }
    c: { en: "At most one vector store can be attached to an agent, even in a single tool.", fr: "Au plus un magasin de vecteurs peut être attaché à un agent, même dans un seul outil." }
    d: { en: "Memory stores user-specific knowledge learned from conversations; curated documents belong in retrieval.", fr: "La mémoire stocke des connaissances propres à l'utilisateur apprises au fil des conversations ; les documents organisés relèvent de la récupération." }
references:
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/file-search
