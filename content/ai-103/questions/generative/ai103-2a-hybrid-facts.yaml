id: ai103-2a-hybrid-facts
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware's RAG application retrieves passages from Azure AI Search with a request that contains a search string, one vector query with k set to 50, and queryType set to semantic.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'application RAG de Proseware récupère des passages dans Azure AI Search avec une requête qui contient une chaîne de recherche, une requête vectorielle avec k défini sur 50, et queryType défini sur semantic.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The full-text query and the vector query run in parallel, and the response contains one result set.
        fr: La requête en texte intégral et la requête vectorielle s'exécutent en parallèle, et la réponse contient un seul jeu de résultats.
    - id: s2
      text:
        en: Adding an orderby clause on a date field keeps the relevance order and uses the date only to break ties.
        fr: L'ajout d'une clause orderby sur un champ de date conserve l'ordre de pertinence et n'utilise la date que pour départager les ex aequo.
    - id: s3
      text:
        en: Setting k to 50 is the recommended value to maximize the inputs of the semantic ranker.
        fr: Définir k sur 50 est la valeur recommandée pour maximiser les entrées du classement sémantique.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: A hybrid request runs full-text and vector search in parallel and merges them with RRF into a single result set. An explicit sort order overrides relevance-ranked results, so orderby should be omitted when you want BM25 and similarity ranking. Because semantic ranker processes up to 50 results, Learn recommends k set to 50 when semantic ranking is used.
    fr: Une requête hybride exécute en parallèle la recherche en texte intégral et la recherche vectorielle, puis les fusionne avec RRF en un seul jeu de résultats. Un ordre de tri explicite remplace le classement par pertinence ; il faut donc omettre orderby pour conserver le classement BM25 et par similarité. Comme le classement sémantique traite jusqu'à 50 résultats, Learn recommande k sur 50 lorsqu'il est utilisé.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
