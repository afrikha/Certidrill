id: ai103-2d-router-mode-choice
objective: "2.3.4"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Contoso creates three model router deployments with custom settings, one for each application:

    - **faq-router**: an internal FAQ assistant that must minimize cost; a slightly wider quality gap than the default is acceptable;
    - **legal-router**: a contract drafting assistant that must always use the highest-quality model, whatever the cost;
    - **general-router**: a general assistant that must pick the most cost-effective model within a small quality range of the best model.

    Which routing mode should you select for each deployment? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée trois déploiements de model router avec des paramètres personnalisés, un par application :

    - **faq-router** : un assistant FAQ interne qui doit réduire au minimum le coût ; un écart de qualité un peu plus large que celui par défaut est acceptable ;
    - **legal-router** : un assistant de rédaction de contrats qui doit toujours utiliser le modèle de meilleure qualité, quel que soit le coût ;
    - **general-router** : un assistant généraliste qui doit choisir le modèle le plus économique dans une faible marge de qualité par rapport au meilleur modèle.

    Quel mode de routage devez-vous sélectionner pour chaque déploiement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      faq-router: [[faq]]
      legal-router: [[legal]]
      general-router: [[general]]
    fr: |
      faq-router : [[faq]]
      legal-router : [[legal]]
      general-router : [[general]]
  slots:
    - id: faq
      options:
        - { id: balanced, text: Balanced }
        - { id: cost, text: Cost }
        - { id: quality, text: Quality }
    - id: legal
      options:
        - { id: balanced, text: Balanced }
        - { id: cost, text: Cost }
        - { id: quality, text: Quality }
    - id: general
      options:
        - { id: balanced, text: Balanced }
        - { id: cost, text: Cost }
        - { id: quality, text: Quality }
answer:
  values: { faq: cost, legal: quality, general: balanced }
explanation:
  correct:
    en: "Cost mode considers a larger quality band (about 5 to 6 % from the best model for the prompt) and picks the most cost-effective model. Quality mode picks the highest-quality model and ignores cost. Balanced, the default, considers a small quality range (about 1 to 2 %) and picks the most cost-effective model in it."
    fr: "Le mode Cost considère une marge de qualité plus large (environ 5 à 6 % par rapport au meilleur modèle pour l'invite) et choisit le modèle le plus économique. Le mode Quality choisit le modèle de meilleure qualité sans tenir compte du coût. Balanced, le mode par défaut, considère une faible marge de qualité (environ 1 à 2 %) et y choisit le modèle le plus économique."
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
