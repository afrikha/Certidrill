id: ai103-sr2-fabrication-eval-3
objective: "2.1.4"
type: series_yesno
series: ai103-sr2-fabrication-eval
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add the Groundedness evaluator and map the retrieved passages as the context.
  fr: Vous ajoutez l'évaluateur Groundedness et mappez les passages récupérés en tant que contexte.
body:
  solution:
    en: |
      You add a testing criterion with `"evaluator_name": "builtin.groundedness"`, `"initialization_parameters": {"deployment_name": "judge-model"}` and a `data_mapping` that maps `context` to `{{item.context}}` and `response` to `{{item.response}}`.
    fr: |
      Vous ajoutez un critère de test avec `"evaluator_name": "builtin.groundedness"`, `"initialization_parameters": {"deployment_name": "judge-model"}` et un `data_mapping` qui mappe `context` sur `{{item.context}}` et `response` sur `{{item.response}}`.
answer: { value: true }
explanation:
  correct:
    en: Groundedness measures whether the response aligns with the given context without fabricating content, which is exactly the requirement. It needs only `context` and `response`, so no ground truth is required, and it uses judge-model as the judge. Each row gets a 1–5 score and a pass or fail label against the default threshold of 3.
    fr: "Groundedness mesure si la réponse est cohérente avec le contexte fourni sans inventer de contenu, ce qui correspond exactement à l'exigence. Il n'a besoin que de `context` et de `response` : aucune vérité terrain n'est requise, et il utilise judge-model comme juge. Chaque ligne reçoit un score de 1 à 5 et un résultat de réussite ou d'échec par rapport au seuil par défaut de 3."
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
