id: ai103-cs2c-order-loop
objective: "2.1.5"
type: ordering
caseStudy: ai103-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You are implementing the backend requirement for the place_order tool. The backend uses an authenticated `AIProjectClient` named `project`.

    Which four actions should the backend perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous implémentez l'exigence relative au back-end pour l'outil place_order. Le back-end utilise un `AIProjectClient` authentifié nommé `project`.

    Quelles sont les quatre actions que le back-end doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: version
      text:
        en: |
          Create an agent version of order-agent whose definition includes the place_order `FunctionTool`.
        fr: |
          Créer une version de order-agent dont la définition inclut le `FunctionTool` place_order.
    - id: ask
      text:
        en: |
          Create a conversation, and send the message of the customer by calling `responses.create` with the conversation ID.
        fr: |
          Créer une conversation, et envoyer le message du client en appelant `responses.create` avec l'ID de la conversation.
    - id: run
      text:
        en: |
          For each output item of type `function_call`, run place_order with the arguments of the item.
        fr: |
          Pour chaque élément de sortie de type `function_call`, exécuter place_order avec les arguments de l'élément.
    - id: submit
      text:
        en: |
          Send a `function_call_output` item with the `call_id` of the call in the same conversation, and then read `output_text`.
        fr: |
          Envoyer un élément `function_call_output` avec le `call_id` de l'appel dans la même conversation, puis lire `output_text`.
    - id: thread
      text:
        en: |
          Create a thread and a run, and then submit the tool outputs to the run.
        fr: |
          Créer un thread et une exécution, puis soumettre les sorties de l'outil à l'exécution.
    - id: wait
      text:
        en: |
          Wait for Foundry Agent Service to call the place_order endpoint of the backend.
        fr: |
          Attendre que Foundry Agent Service appelle le point de terminaison place_order du back-end.
answer:
  sequence: [ version, ask, run, submit ]
explanation:
  correct:
    en: |
      The function tool is part of the agent version definition. The backend then sends the customer message in a conversation; when the response contains a `function_call` item, the backend runs the function itself and returns the result as a `function_call_output` that carries the same `call_id`, in the same conversation, to get the final answer. Runs expire 10 minutes after creation, so the backend must return the output quickly.
    fr: |
      L'outil de fonction fait partie de la définition de la version de l'agent. Le back-end envoie ensuite le message du client dans une conversation ; quand la réponse contient un élément `function_call`, le back-end exécute lui-même la fonction et renvoie le résultat sous forme de `function_call_output` qui porte le même `call_id`, dans la même conversation, pour obtenir la réponse finale. Les exécutions expirent 10 minutes après leur création : le back-end doit donc renvoyer la sortie rapidement.
  options:
    thread:
      en: |
        Threads, runs and submitting tool outputs to a run belong to the classic Agents API, not to the conversations and responses of the current SDK.
      fr: |
        Les threads, les exécutions et la soumission des sorties d'outils à une exécution appartiennent à l'API Agents classique, pas aux conversations et aux réponses du SDK actuel.
    wait:
      en: |
        With function calling, the agent only requests the call; the client code executes the function.
      fr: |
        Avec l'appel de fonctions, l'agent se contente de demander l'appel ; c'est le code client qui exécute la fonction.
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
