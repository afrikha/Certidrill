id: ai103-cs2b-incomplete-summaries
objective: "2.3.1"
type: yesno_statements
caseStudy: ai103-cs2b-trey-research
difficulty: 2
status: draft
stem:
  en: |
    The summarization requests to summarize-chat set `max_completion_tokens` to 4000. You are investigating the issue described in the safety summaries requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les requêtes de synthèse envoyées à summarize-chat définissent `max_completion_tokens` sur 4000. Vous analysez le problème décrit dans l'exigence relative aux synthèses de sécurité. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The 4,000 tokens of `max_completion_tokens` are reserved for the visible summary; the reasoning tokens are counted against a separate limit.
        fr: |
          Les 4 000 jetons de `max_completion_tokens` sont réservés à la synthèse visible ; les jetons de raisonnement sont décomptés sur une limite distincte.
    - id: s2
      text:
        en: |
          For an incomplete response that contains no visible text, Trey Research is still billed for the input tokens and the reasoning tokens.
        fr: |
          Pour une réponse incomplète qui ne contient aucun texte visible, Trey Research est quand même facturée pour les jetons d'entrée et les jetons de raisonnement.
    - id: s3
      text:
        en: |
          To show the reviewers how the model reached its conclusions, the app can read the reasoning tokens in the message content of the response.
        fr: |
          Pour montrer aux relecteurs comment le modèle est parvenu à ses conclusions, l'application peut lire les jetons de raisonnement dans le contenu du message de la réponse.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      For reasoning models, `max_completion_tokens` caps the reasoning tokens, the visible output and the formatting tokens together. When the model uses the whole budget, the response comes back incomplete, possibly before any visible text, and you still pay for the input and reasoning tokens; the fix is to raise the limit. Reasoning tokens never appear in the message content; the only supported way to see the reasoning is a reasoning summary, requested with the `reasoning.summary` parameter of the Responses API.
    fr: |
      Pour les modèles de raisonnement, `max_completion_tokens` plafonne ensemble les jetons de raisonnement, la sortie visible et les jetons de mise en forme. Quand le modèle consomme tout le budget, la réponse revient incomplète, parfois avant tout texte visible, et vous payez quand même les jetons d'entrée et de raisonnement ; la solution consiste à augmenter la limite. Les jetons de raisonnement n'apparaissent jamais dans le contenu du message ; le seul moyen pris en charge de voir le raisonnement est une synthèse du raisonnement, demandée avec le paramètre `reasoning.summary` de l'API Responses.
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
