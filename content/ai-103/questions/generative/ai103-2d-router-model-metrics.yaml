id: ai103-2d-router-model-metrics
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's assistant is a web application that sends all its requests directly to a model router deployment named **router-chat**. The team wants to compare the latency and the request volume of each underlying model that router-chat used during the last week, without writing code.

    What should you use?
  fr: |
    L'assistant de Fabrikam est une application web qui envoie toutes ses requêtes directement à un déploiement de model router nommé **router-chat**. L'équipe veut comparer la latence et le volume de requêtes de chaque modèle sous-jacent utilisé par router-chat au cours de la semaine écoulée, sans écrire de code.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Cost analysis in the Azure portal, filtered by the Deployment tag.", fr: "L'analyse des coûts du portail Azure, filtrée par l'étiquette Deployment." } }
    - { id: b, text: { en: "The model field of a response returned by router-chat in the playground.", fr: "Le champ model d'une réponse renvoyée par router-chat dans le terrain de jeu." } }
    - { id: c, text: { en: "The Monitor tab of an agent in the Foundry project, over the last seven days.", fr: "L'onglet Monitor d'un agent du projet Foundry, sur les sept derniers jours." } }
    - { id: d, text: { en: "Monitoring > Metrics of the resource, filtered on router-chat and split by underlying model.", fr: "Monitoring > Metrics de la ressource, filtré sur router-chat et fractionné par modèle sous-jacent." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Model router performance is monitored on the Monitoring > Metrics page of the resource in the Azure portal: you filter by the deployment name of the router and split the metrics by underlying model, which compares each model over any time range."
    fr: "Les performances du model router se surveillent dans la page Monitoring > Metrics de la ressource dans le portail Azure : vous filtrez sur le nom du déploiement du router et fractionnez les métriques par modèle sous-jacent, ce qui compare chaque modèle sur n'importe quelle période."
  options:
    a: { en: "Cost analysis shows the costs of the router deployment, which are the sum of the underlying models' costs, not latency or request volume.", fr: "L'analyse des coûts présente les coûts du déploiement de router, qui sont la somme des coûts des modèles sous-jacents, pas la latence ni le volume de requêtes." }
    b: { en: "The model field identifies the model of a single response; it doesn't aggregate a week of traffic.", fr: "Le champ model identifie le modèle d'une seule réponse ; il n'agrège pas une semaine de trafic." }
    c: { en: "The agent Monitor tab shows an agent's traffic, and the assistant doesn't run as a Foundry agent.", fr: "L'onglet Monitor d'un agent présente le trafic de cet agent, et l'assistant ne s'exécute pas comme agent Foundry." }
references:
  - title: How to use model router for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/model-router
