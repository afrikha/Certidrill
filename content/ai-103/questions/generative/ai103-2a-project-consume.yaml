id: ai103-2a-project-consume
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry project named **claims**. In the project's Foundry resource, a deployment named **claims-chat** runs the gpt-4.1-mini model.

    You are writing Python code that summarizes a claim by using the Responses API through the project client.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un projet Foundry nommé **claims**. Dans la ressource Foundry du projet, un déploiement nommé **claims-chat** exécute le modèle gpt-4.1-mini.

    Vous écrivez du code Python qui résume une déclaration de sinistre à l'aide de l'API Responses, par l'intermédiaire du client de projet.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.identity import DefaultAzureCredential
    from azure.ai.projects import AIProjectClient

    project = AIProjectClient(
        endpoint="https://adatum-ai.services.ai.azure.com/api/projects/claims",
        credential=DefaultAzureCredential(),
    )
    openai = project.get_openai_client()

    response = openai.[[api]](
        model=[[model]],
        input="Summarize this claim in two sentences: " + claim_text,
    )
    print(response.[[out]])
  slots:
    - id: api
      options:
        - { id: resp, text: responses.create }
        - { id: chat, text: chat.completions.create }
        - { id: evals, text: evals.create }
    - id: model
      options:
        - { id: model, text: "\"gpt-4.1-mini\"" }
        - { id: dep, text: "\"claims-chat\"" }
        - { id: proj, text: "\"claims\"" }
    - id: out
      options:
        - { id: choices, text: "choices[0].message.content" }
        - { id: parsed, text: output_parsed }
        - { id: text, text: output_text }
answer:
  values: { api: resp, model: dep, out: text }
explanation:
  correct:
    en: The project client returns an OpenAI-compatible client whose `responses.create` method takes an `input`. The `model` parameter takes the deployment name (claims-chat), not the name of the underlying model. The generated text is available in `response.output_text`.
    fr: Le client de projet renvoie un client compatible OpenAI dont la méthode `responses.create` prend un paramètre `input`. Le paramètre `model` reçoit le nom du déploiement (claims-chat), pas le nom du modèle sous-jacent. Le texte généré est disponible dans `response.output_text`.
  options:
    chat: { en: "Chat Completions takes a messages list, not an input parameter.", fr: "Chat Completions prend une liste messages, pas un paramètre input." }
    evals: { en: "evals.create defines an evaluation; it does not generate a response.", fr: "evals.create définit une évaluation ; il ne génère pas de réponse." }
    model: { en: "The model name is not the deployment name; the request must target the deployment.", fr: "Le nom du modèle n'est pas le nom du déploiement ; la requête doit cibler le déploiement." }
    proj: { en: "claims is the project, which is already part of the endpoint.", fr: "claims est le projet, déjà présent dans le point de terminaison." }
    choices: { en: "choices[0].message.content is the shape of a Chat Completions response.", fr: "choices[0].message.content correspond à la forme d'une réponse Chat Completions." }
    parsed: { en: "output_parsed is filled by responses.parse with a structured output format.", fr: "output_parsed est rempli par responses.parse avec un format de sortie structurée." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
  - title: Introduction to cloud evaluation with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/cloud-evaluation
