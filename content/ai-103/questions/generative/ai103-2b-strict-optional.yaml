id: ai103-2b-strict-optional
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys defines a function tool named book_flight in a Responses API request to a gpt-4.1 deployment. The tool uses `strict: true` so that the arguments always match the schema. The parameter seat_preference is optional: the model must supply a value only when the traveler states a preference.

    How should you define seat_preference in the schema?
  fr: |
    Tailspin Toys définit un outil de fonction nommé book_flight dans une requête de l'API Responses adressée à un déploiement gpt-4.1. L'outil utilise `strict: true` pour que les arguments correspondent toujours au schéma. Le paramètre seat_preference est facultatif : le modèle ne doit fournir une valeur que lorsque le voyageur indique une préférence.

    Comment devez-vous définir seat_preference dans le schéma ?
body:
  options:
    - { id: a, text: { en: "Omit it from required, and give it the type string", fr: "L'omettre de required, et lui donner le type string" } }
    - { id: b, text: { en: "Add it to required, and give it the type string with a minLength of 0", fr: "L'ajouter à required, et lui donner le type string avec un minLength de 0" } }
    - { id: c, text: { en: "Omit it from required, and set additionalProperties to true on the parameters object", fr: "L'omettre de required, et définir additionalProperties sur true dans l'objet parameters" } }
    - { id: d, text: { en: "Add it to required, and give it the type [\"string\", \"null\"]", fr: "L'ajouter à required, et lui donner le type [\"string\", \"null\"]" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With structured outputs, every field or function parameter must be listed in `required`. An optional parameter is emulated with a union type that includes `null`, so the model returns `null` when the traveler states no preference.
    fr: |
      Avec les sorties structurées, chaque champ ou paramètre de fonction doit figurer dans `required`. Un paramètre facultatif s'émule avec un type union qui inclut `null` : le modèle renvoie `null` quand le voyageur n'indique aucune préférence.
  options:
    a: { en: "Strict mode requires every parameter to be listed in required.", fr: "Le mode strict exige que chaque paramètre figure dans required." }
    b: { en: "minLength isn't supported by structured outputs, and a required string would force a value.", fr: "minLength n'est pas pris en charge par les sorties structurées, et une chaîne obligatoire imposerait une valeur." }
    c: { en: "Structured outputs require additionalProperties to be false.", fr: "Les sorties structurées exigent qu'additionalProperties soit false." }
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
