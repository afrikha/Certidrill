id: ai103-2b-file-search-code
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. wants an agent that answers employee questions from a PDF handbook. The code already has an authenticated `AIProjectClient` named `project` and the client `openai = project.get_openai_client()`. The project contains a deployment named hr-chat.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. souhaite un agent qui répond aux questions des employés à partir d'un manuel au format PDF. Le code dispose déjà d'un `AIProjectClient` authentifié nommé `project` et du client `openai = project.get_openai_client()`. Le projet contient un déploiement nommé hr-chat.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.projects.models import FileSearchTool, PromptAgentDefinition

    vector_store = openai.[[s1]].create(name="hr-handbook")

    with open("handbook.pdf", "rb") as f:
        openai.vector_stores.files.[[s2]](
            vector_store_id=vector_store.id,
            file=f,
        )

    agent = project.agents.create_version(
        agent_name="hr-agent",
        definition=PromptAgentDefinition(
            model="hr-chat",
            instructions="Answer from the HR handbook. Use file search for every question.",
            tools=[FileSearchTool([[s3]]=[vector_store.id])],
        ),
    )
  slots:
    - id: s1
      options:
        - { id: files, text: files }
        - { id: vs, text: vector_stores }
        - { id: conv, text: conversations }
    - id: s2
      options:
        - { id: list, text: list }
        - { id: retrieve, text: retrieve }
        - { id: upload, text: upload_and_poll }
    - id: s3
      options:
        - { id: vsids, text: vector_store_ids }
        - { id: index, text: index_name }
        - { id: conn, text: project_connection_id }
answer:
  values: { s1: vs, s2: upload, s3: vsids }
explanation:
  correct:
    en: |
      The OpenAI client of the project creates the vector store with `vector_stores.create()`. `vector_stores.files.upload_and_poll()` uploads the file and waits while the service chunks, embeds and indexes it. `FileSearchTool(vector_store_ids=[...])` attaches the vector store to the agent.
    fr: |
      Le client OpenAI du projet crée le magasin de vecteurs avec `vector_stores.create()`. `vector_stores.files.upload_and_poll()` charge le fichier et attend que le service le découpe, génère ses embeddings et l'indexe. `FileSearchTool(vector_store_ids=[...])` attache le magasin de vecteurs à l'agent.
  options:
    files: { en: "files.create() uploads a file but doesn't create a vector store.", fr: "files.create() charge un fichier mais ne crée pas de magasin de vecteurs." }
    list: { en: "list() returns the files of a vector store; it doesn't add one.", fr: "list() renvoie les fichiers d'un magasin de vecteurs ; il n'en ajoute pas." }
    retrieve: { en: "retrieve() reads an existing file of a vector store; it doesn't upload one.", fr: "retrieve() lit un fichier existant d'un magasin de vecteurs ; il n'en charge pas." }
    index: { en: "index_name and project_connection_id configure the Azure AI Search tool, not file search.", fr: "index_name et project_connection_id configurent l'outil Azure AI Search, pas la recherche de fichiers." }
    conn: { en: "index_name and project_connection_id configure the Azure AI Search tool, not file search.", fr: "index_name et project_connection_id configurent l'outil Azure AI Search, pas la recherche de fichiers." }
references:
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/file-search
