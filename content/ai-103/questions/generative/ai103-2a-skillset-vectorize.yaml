id: ai103-2a-skillset-vectorize
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores long PDF contracts in Azure Blob Storage. You are configuring an Azure AI Search indexer for a RAG application. The documents exceed the token input limit of the embedding model. Users will send questions as plain text, and the search service must turn them into vectors.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke de longs contrats PDF dans Stockage Blob Azure. Vous configurez un indexeur Azure AI Search pour une application RAG. Les documents dépassent la limite de jetons en entrée du modèle d'embedding. Les utilisateurs enverront leurs questions sous forme de texte brut, et le service de recherche doit les transformer en vecteurs.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the skillset, add [[split]] to divide each document into chunks, then add [[embed]] to create a vector for each chunk. In the index, assign [[vec]] to the vector field so that query text is converted to a vector at query time.
    fr: |
      Dans l'ensemble de compétences, ajoutez [[split]] pour découper chaque document en blocs, puis ajoutez [[embed]] pour créer un vecteur pour chaque bloc. Dans l'index, attribuez [[vec]] au champ vectoriel pour que le texte des requêtes soit converti en vecteur au moment de la requête.
  slots:
    - id: split
      options:
        - { id: keyphrase, text: { en: "the Key Phrase Extraction skill", fr: "la compétence Key Phrase Extraction" } }
        - { id: textsplit, text: { en: "the Text Split skill", fr: "la compétence Text Split" } }
        - { id: langdetect, text: { en: "the Language Detection skill", fr: "la compétence Language Detection" } }
    - id: embed
      options:
        - { id: aoaiembed, text: { en: "the AzureOpenAIEmbedding skill", fr: "la compétence AzureOpenAIEmbedding" } }
        - { id: entity, text: { en: "the Entity Recognition skill", fr: "la compétence Entity Recognition" } }
        - { id: translate, text: { en: "the Text Translation skill", fr: "la compétence Text Translation" } }
    - id: vec
      options:
        - { id: semconf, text: { en: "a semantic configuration", fr: "une configuration sémantique" } }
        - { id: scoring, text: { en: "a scoring profile", fr: "un profil de scoring" } }
        - { id: vectorizer, text: { en: "an Azure OpenAI vectorizer that uses the same embedding model", fr: "un vectoriseur Azure OpenAI qui utilise le même modèle d'embedding" } }
answer:
  values: { split: textsplit, embed: aoaiembed, vec: vectorizer }
explanation:
  correct:
    en: Integrated vectorization chunks documents in the skillset (for example with the Text Split skill), then calls an embedding skill such as AzureOpenAIEmbedding. At query time, a vectorizer assigned to the vector field converts text queries to vectors; it must match the embedding model used to encode the content.
    fr: La vectorisation intégrée découpe les documents dans l'ensemble de compétences (par exemple avec la compétence Text Split), puis appelle une compétence d'embedding comme AzureOpenAIEmbedding. Au moment de la requête, un vectoriseur attribué au champ vectoriel convertit les requêtes texte en vecteurs ; il doit correspondre au modèle d'embedding utilisé pour encoder le contenu.
  options:
    keyphrase: { en: "Key Phrase Extraction returns key phrases; it does not produce chunks.", fr: "Key Phrase Extraction renvoie des expressions clés ; elle ne produit pas de blocs." }
    langdetect: { en: "Language Detection identifies the language of the text; it does not split it.", fr: "Language Detection identifie la langue du texte ; elle ne le découpe pas." }
    entity: { en: "Entity Recognition extracts named entities, not embeddings.", fr: "Entity Recognition extrait des entités nommées, pas des embeddings." }
    translate: { en: "Text Translation translates content; it does not create vectors.", fr: "Text Translation traduit le contenu ; elle ne crée pas de vecteurs." }
    semconf: { en: "A semantic configuration lists fields for semantic ranker; it does not vectorize queries.", fr: "Une configuration sémantique liste des champs pour le classement sémantique ; elle ne vectorise pas les requêtes." }
    scoring: { en: "A scoring profile boosts full-text scores; it does not vectorize queries.", fr: "Un profil de scoring renforce les scores du texte intégral ; il ne vectorise pas les requêtes." }
references:
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
