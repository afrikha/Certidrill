id: ai103-2b-tracking-approach
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is designing how its Foundry agents keep track of context. You must use the simplest approach that meets each requirement.

    Which approach should you use for each requirement? To answer, drag the appropriate approaches to the correct requirements. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. conçoit la manière dont ses agents Foundry gardent le contexte. Vous devez utiliser l'approche la plus simple qui satisfait chaque exigence.

    Quelle approche devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les approches appropriées vers les exigences correspondantes. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: conv, text: { en: "A conversation object created with conversations.create()", fr: "Un objet conversation créé avec conversations.create()" } }
    - { id: prev, text: { en: "previous_response_id set to the ID of the last response", fr: "previous_response_id défini sur l'ID de la dernière réponse" } }
    - { id: memory, text: { en: "The memory search tool attached to the agent", fr: "L'outil de recherche de mémoire attaché à l'agent" } }
    - { id: files, text: { en: "The file search tool attached to the agent", fr: "L'outil de recherche de fichiers attaché à l'agent" } }
    - { id: resend, text: { en: "The application resends the full history in each request", fr: "L'application renvoie tout l'historique dans chaque requête" } }
  targets:
    - id: t1
      text: { en: "A support chat that the customer reopens the next day to continue the same exchange, with the history stored by the service", fr: "Un chat de support que le client rouvre le lendemain pour poursuivre le même échange, avec l'historique stocké par le service" }
    - id: t2
      text: { en: "A single follow-up question that builds on the previous answer, without creating a conversation object", fr: "Une seule question de suivi qui s'appuie sur la réponse précédente, sans créer d'objet conversation" }
    - id: t3
      text: { en: "Remember the preferred contact channel of each customer in all future conversations", fr: "Se souvenir du canal de contact préféré de chaque client dans toutes les conversations futures" }
answer:
  mapping: { t1: conv, t2: prev, t3: memory }
explanation:
  correct:
    en: |
      A conversation is a durable object that stores its items on the service and can be reused across sessions. Without a conversation, a follow-up can reference the stored response through `previous_response_id`. Knowledge that must persist across conversations, such as user preferences, is long-term memory, read and written by the memory search tool. File search retrieves document content, and resending the full history adds work and input tokens without being needed here.
    fr: |
      Une conversation est un objet durable qui stocke ses éléments sur le service et peut être réutilisé d'une session à l'autre. Sans conversation, une question de suivi peut faire référence à la réponse stockée via `previous_response_id`. Les connaissances qui doivent persister d'une conversation à l'autre, comme les préférences d'un utilisateur, relèvent de la mémoire à long terme, lue et écrite par l'outil de recherche de mémoire. La recherche de fichiers récupère le contenu de documents, et renvoyer tout l'historique ajoute du travail et des jetons d'entrée sans être nécessaire ici.
references:
  - title: Build with runtime components in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
  - title: What is Memory?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
