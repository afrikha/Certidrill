id: ai103-2c-keep-ownership
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry prompt agent named advisor-agent that talks to customers. A partner exposes a foreign exchange agent named fx-agent through an A2A 1.0 endpoint.

    When a customer asks about currency risk, advisor-agent must get an analysis from fx-agent, combine it with its own portfolio data, and answer the customer. advisor-agent must remain responsible for the conversation at all times, and fx-agent must never talk to the customer directly.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un agent d'invite Foundry nommé advisor-agent qui dialogue avec les clients. Un partenaire expose un agent de change nommé fx-agent par un point de terminaison A2A 1.0.

    Quand un client pose une question sur le risque de change, advisor-agent doit obtenir une analyse de fx-agent, la combiner avec ses propres données de portefeuille et répondre au client. advisor-agent doit rester responsable de la conversation à tout moment, et fx-agent ne doit jamais dialoguer directement avec le client.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Build a handoff workflow in which advisor-agent hands off to fx-agent.", fr: "Créer un workflow handoff dans lequel advisor-agent transfère la conversation à fx-agent." } }
    - { id: b, text: { en: "Build a group chat workflow in which advisor-agent and fx-agent share the conversation.", fr: "Créer un workflow group chat dans lequel advisor-agent et fx-agent partagent la conversation." } }
    - { id: c, text: { en: "Add an A2A tool to advisor-agent that uses a connection to the fx-agent endpoint.", fr: "Ajouter à advisor-agent un outil A2A qui utilise une connexion vers le point de terminaison de fx-agent." } }
    - { id: d, text: { en: "Add a connected agents tool to advisor-agent that references fx-agent.", fr: "Ajouter à advisor-agent un outil connected agents qui référence fx-agent." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the A2A tool, the remote agent processes the request and returns a response; the Foundry agent uses that response to answer the user and continues to manage the conversation. This is the agent-as-tool approach: the primary agent keeps responsibility, and control comes back to it after each subtask.
    fr: |
      Avec l'outil A2A, l'agent distant traite la requête et renvoie une réponse ; l'agent Foundry utilise cette réponse pour répondre à l'utilisateur et continue de gérer la conversation. C'est l'approche agent comme outil : l'agent principal garde la responsabilité, et le contrôle lui revient après chaque sous-tâche.
  options:
    a:
      en: |
        In a handoff, the receiving agent takes full ownership of the task and of the conversation, so fx-agent would answer the customer.
      fr: |
        Dans un handoff, l'agent qui reçoit la conversation prend l'entière responsabilité de la tâche et de la conversation : fx-agent répondrait au client.
    b:
      en: |
        In a group chat, every participant contributes to a shared conversation, so fx-agent's messages would be part of what the customer sees.
      fr: |
        Dans un group chat, chaque participant contribue à une conversation partagée : les messages de fx-agent feraient partie de ce que voit le client.
    d:
      en: |
        The connected agents tool belongs to the classic Agents API and isn't available in the new Foundry Agent Service.
      fr: |
        L'outil connected agents appartient à l'API Agents classique et n'est pas disponible dans le nouveau Foundry Agent Service.
references:
  - title: Connect to an A2A agent endpoint from Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent
  - title: Microsoft Agent Framework Workflows Orchestrations - Handoff
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/handoff
