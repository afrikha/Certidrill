id: ai103-2b-role-personas
objective: "2.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. is organizing access to its Foundry resource and its projects. Each person must receive only the permissions that the task requires.

    Which role should you assign for each task? To answer, drag the appropriate roles to the correct tasks. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. organise l'accès à sa ressource Foundry et à ses projets. Chaque personne ne doit recevoir que les autorisations nécessaires à sa tâche.

    Quel rôle devez-vous attribuer pour chaque tâche ? Pour répondre, faites glisser les rôles appropriés vers les tâches correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: user, text: Foundry User }
    - { id: pm, text: Foundry Project Manager }
    - { id: owner, text: Foundry Account Owner }
    - { id: usages, text: Cognitive Services Usages Reader }
    - { id: aidev, text: Azure AI Developer }
    - { id: reader, text: Reader }
  targets:
    - id: dev
      text: { en: "Developers: build and test agents and call models in a project", fr: "Développeurs : créer et tester des agents et appeler des modèles dans un projet" }
    - id: lead
      text: { en: "Team lead: manage a project, publish agents, and grant the Foundry User role to new developers", fr: "Responsable d'équipe : gérer un projet, publier des agents et accorder le rôle Foundry User aux nouveaux développeurs" }
    - id: admin
      text: { en: "Platform administrator: create projects and manage model deployments, activated just in time through Microsoft Entra PIM, without building agents", fr: "Administrateur de plateforme : créer des projets et gérer les déploiements de modèles, activé juste à temps via Microsoft Entra PIM, sans créer d'agents" }
    - id: finops
      text: { en: "FinOps analyst: view quota usage at the subscription scope", fr: "Analyste FinOps : consulter l'utilisation des quotas à l'étendue de l'abonnement" }
answer:
  mapping: { dev: user, lead: pm, admin: owner, finops: usages }
explanation:
  correct:
    en: |
      Foundry User grants the build and develop data actions in a project. Foundry Project Manager adds agent publishing and can assign only the Foundry User role. Foundry Account Owner creates projects and manages models without data actions, and Learn recommends activating it just in time through PIM. Cognitive Services Usages Reader gives quota visibility and works only at the subscription scope. Azure AI Developer is scoped to Azure Machine Learning workspaces and hubs, and Reader is read-only.
    fr: |
      Foundry User accorde les actions de données de création et de développement dans un projet. Foundry Project Manager y ajoute la publication d'agents et ne peut attribuer que le rôle Foundry User. Foundry Account Owner crée des projets et gère les modèles sans actions de données, et Learn recommande de l'activer juste à temps via PIM. Cognitive Services Usages Reader donne la visibilité sur les quotas et ne fonctionne qu'à l'étendue de l'abonnement. Azure AI Developer est limité aux espaces de travail et aux hubs Azure Machine Learning, et Reader est en lecture seule.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
