id: ai103-2b-api-key-tool
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a legacy reporting tool that can authenticate only with an API key. The security team has approved key-based authentication for this tool only. The tool must call a deployment named report-chat, which runs the gpt-4.1-mini model, in the Foundry resource litware-ai.

    What should the tool use?
  fr: |
    Litware, Inc. dispose d'un ancien outil de création de rapports qui ne peut s'authentifier qu'avec une clé API. L'équipe de sécurité a approuvé l'authentification par clé pour cet outil uniquement. L'outil doit appeler un déploiement nommé report-chat, qui exécute le modèle gpt-4.1-mini, dans la ressource Foundry litware-ai.

    Que doit utiliser l'outil ?
body:
  options:
    - { id: a, text: { en: "An AIProjectClient with the project endpoint and an AzureKeyCredential that contains the key", fr: "Un AIProjectClient avec le point de terminaison du projet et un AzureKeyCredential qui contient la clé" } }
    - { id: b, text: { en: "An AnthropicFoundry client with the /anthropic endpoint and the key in api_key", fr: "Un client AnthropicFoundry avec le point de terminaison /anthropic et la clé dans api_key" } }
    - { id: c, text: { en: "An OpenAI client with the base URL https://litware-ai.openai.azure.com/openai/v1/ and the key in api_key", fr: "Un client OpenAI avec l'URL de base https://litware-ai.openai.azure.com/openai/v1/ et la clé dans api_key" } }
    - { id: d, text: { en: "An OpenAI client created by get_openai_client() with the key in api_key and the project endpoint as the base URL", fr: "Un client OpenAI créé par get_openai_client() avec la clé dans api_key et le point de terminaison du projet comme URL de base" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      API keys work on the `/openai/v1` endpoint of the resource: you pass the key in `api_key` instead of a token provider, and the deployment name in `model`. The project endpoint and AIProjectClient rely on Microsoft Entra ID tokens.
    fr: |
      Les clés API fonctionnent sur le point de terminaison `/openai/v1` de la ressource : vous passez la clé dans `api_key` au lieu d'un fournisseur de jetons, et le nom du déploiement dans `model`. Le point de terminaison du projet et AIProjectClient reposent sur des jetons Microsoft Entra ID.
  options:
    a: { en: "AIProjectClient accepts only a TokenCredential, not a key credential.", fr: "AIProjectClient n'accepte qu'un TokenCredential, pas des informations d'identification par clé." }
    b: { en: "The /anthropic endpoint serves Claude models through the Anthropic SDK; report-chat runs a GPT model.", fr: "Le point de terminaison /anthropic sert les modèles Claude via le SDK Anthropic ; report-chat exécute un modèle GPT." }
    d: { en: "get_openai_client() is a method of AIProjectClient, which first requires a token credential; the project endpoint isn't the endpoint where keys work.", fr: "get_openai_client() est une méthode d'AIProjectClient, qui nécessite d'abord un TokenCredential ; le point de terminaison du projet n'est pas celui sur lequel les clés fonctionnent." }
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
