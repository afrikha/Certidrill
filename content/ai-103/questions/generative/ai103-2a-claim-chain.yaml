id: ai103-2a-claim-chain
objective: "2.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Insurance is designing a prompt chain that answers claim emails written in English. The policy terms are returned by a function named get_policy, which needs the policy number. Each reply must be grounded in the policy terms, checked by the model for unsupported statements, and approved by an adjuster before it is sent.

    Which five steps should the chain perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Insurance conçoit une chaîne d'invites qui répond aux e-mails de sinistre rédigés en anglais. Les conditions du contrat sont renvoyées par une fonction nommée get_policy, qui a besoin du numéro de contrat. Chaque réponse doit être ancrée dans les conditions du contrat, vérifiée par le modèle pour détecter les affirmations non étayées, et approuvée par un gestionnaire de sinistres avant son envoi.

    Quelles sont les cinq étapes que la chaîne doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: verify, text: { en: "Ask the model to check each statement of the draft against the policy terms.", fr: "Demander au modèle de vérifier chaque affirmation du brouillon par rapport aux conditions du contrat." } }
    - { id: extract, text: { en: "Extract the policy number and incident details from the email with structured outputs.", fr: "Extraire le numéro de contrat et les détails du sinistre de l'e-mail avec des sorties structurées." } }
    - { id: review, text: { en: "Send the checked draft to an adjuster for approval.", fr: "Envoyer le brouillon vérifié à un gestionnaire de sinistres pour approbation." } }
    - { id: tune, text: { en: "Fine-tune the model on past replies to claim emails.", fr: "Affiner le modèle sur les réponses passées aux e-mails de sinistre." } }
    - { id: lookup, text: { en: "Call get_policy with the extracted policy number.", fr: "Appeler get_policy avec le numéro de contrat extrait." } }
    - { id: translate, text: { en: "Translate the email into French with Azure Translator.", fr: "Traduire l'e-mail en français avec Azure Translator." } }
    - { id: draft, text: { en: "Generate a draft reply grounded in the returned policy terms.", fr: "Générer un brouillon de réponse ancré dans les conditions du contrat renvoyées." } }
answer:
  sequence: [ extract, lookup, draft, verify, review ]
explanation:
  correct:
    en: |
      In a prompt chain, each step consumes the output of the previous one. get_policy needs the extracted policy number, the draft needs the policy terms, the check needs the draft, and the adjuster approves only the checked draft. Structured outputs at the first step give the next step a reliable policy number.
    fr: |
      Dans une chaîne d'invites, chaque étape consomme la sortie de la précédente. get_policy a besoin du numéro de contrat extrait, le brouillon a besoin des conditions du contrat, la vérification a besoin du brouillon, et le gestionnaire n'approuve que le brouillon vérifié. Les sorties structurées à la première étape fournissent à l'étape suivante un numéro de contrat fiable.
  options:
    tune: { en: "Fine-tuning changes style or behavior; it is not a step of the chain and does not ground the reply.", fr: "L'affinage modifie le style ou le comportement ; ce n'est pas une étape de la chaîne et il n'ancre pas la réponse." }
    translate: { en: "The emails are in English and no step requires French.", fr: "Les e-mails sont en anglais et aucune étape n'exige le français." }
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
  - title: How to use function calling with Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/function-calling
