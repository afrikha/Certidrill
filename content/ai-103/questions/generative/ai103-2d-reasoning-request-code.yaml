id: ai103-2d-reasoning-request-code
objective: "2.3.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys calls an **gpt-5-mini** deployment named **triage-g5** from Python by using the OpenAI client of a Foundry project. The request uses the Responses API.

    You need to complete the call so that:

    - the model spends little effort reasoning on this simple routing task;
    - the total number of generated tokens, reasoning included, is capped at 4,000;
    - the ticket text is sent to the model.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys appelle depuis Python un déploiement **gpt-5-mini** nommé **triage-g5** à l'aide du client OpenAI d'un projet Foundry. La requête utilise l'API Responses.

    Vous devez compléter l'appel pour que :

    - le modèle consacre peu d'effort au raisonnement pour cette tâche de routage simple ;
    - le nombre total de jetons générés, raisonnement compris, soit plafonné à 4 000 ;
    - le texte du ticket soit envoyé au modèle.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = openai_client.responses.create(
        model="triage-g5",
        [[effort]],
        [[cap]]=4000,
        [[content]]=f"Route this ticket to billing, technical or account: {ticket_text}",
    )
    print(response.output_text)
  slots:
    - id: effort
      options:
        - { id: obj, text: "reasoning={\"effort\": \"low\"}" }
        - { id: temp, text: "temperature=0.2" }
        - { id: flat, text: "reasoning_effort=\"high\"" }
        - { id: topp, text: "top_p=0.1" }
    - id: cap
      options:
        - { id: maxtok, text: max_tokens }
        - { id: maxout, text: max_output_tokens }
        - { id: maxcomp, text: max_completion_tokens }
    - id: content
      options:
        - { id: messages, text: messages }
        - { id: prompt, text: prompt }
        - { id: input, text: input }
answer:
  values: { effort: obj, cap: maxout, content: input }
explanation:
  correct:
    en: In the Responses API the reasoning effort is set in the `reasoning` object, and a low effort suits a simple task. `max_output_tokens` caps the total the model generates, reasoning tokens included. The Responses API takes the prompt in the `input` parameter.
    fr: Dans l'API Responses, l'effort de raisonnement se définit dans l'objet `reasoning`, et un effort low convient à une tâche simple. `max_output_tokens` plafonne le total généré par le modèle, jetons de raisonnement compris. L'API Responses reçoit l'invite dans le paramètre `input`.
  options:
    temp: { en: "gpt-5-mini doesn't support temperature, and temperature doesn't control reasoning.", fr: "gpt-5-mini ne prend pas en charge temperature, et temperature ne contrôle pas le raisonnement." }
    flat: { en: "reasoning_effort is the Chat Completions form, and high is the opposite of the requirement.", fr: "reasoning_effort est la forme de Chat Completions, et high est l'inverse de l'exigence." }
    topp: { en: "gpt-5-mini doesn't support top_p.", fr: "gpt-5-mini ne prend pas en charge top_p." }
    maxtok: { en: "Reasoning models don't support max_tokens.", fr: "Les modèles de raisonnement ne prennent pas en charge max_tokens." }
    maxcomp: { en: "max_completion_tokens is the cap of the Chat Completions API, not of the Responses API.", fr: "max_completion_tokens est le plafond de l'API Chat Completions, pas de l'API Responses." }
    messages: { en: "messages is the parameter of the Chat Completions API.", fr: "messages est le paramètre de l'API Chat Completions." }
    prompt: { en: "The Responses API doesn't take the user text in a prompt parameter.", fr: "L'API Responses ne reçoit pas le texte utilisateur dans un paramètre prompt." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
