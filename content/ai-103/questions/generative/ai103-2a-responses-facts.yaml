id: ai103-2a-responses-facts
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware develops a document assistant that calls model deployments in a Foundry resource by using the Responses API. Some requests send PDF files as `input_file` content parts. Some deployments run reasoning models.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware développe un assistant documentaire qui appelle des déploiements de modèles d'une ressource Foundry à l'aide de l'API Responses. Certaines requêtes envoient des fichiers PDF sous forme de parties de contenu `input_file`. Certains déploiements exécutent des modèles de raisonnement.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: On a reasoning model, max_output_tokens also limits the reasoning tokens that the model generates.
        fr: Sur un modèle de raisonnement, max_output_tokens limite aussi les jetons de raisonnement que le modèle génère.
    - id: s2
      text:
        en: A single request can include three PDF files of 40 MB each as input_file parts.
        fr: Une même requête peut inclure trois fichiers PDF de 40 Mo chacun sous forme de parties input_file.
    - id: s3
      text:
        en: When store is left at its default value, the service retains response data for 30 days.
        fr: Lorsque store garde sa valeur par défaut, le service conserve les données des réponses pendant 30 jours.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: With the Responses API, max_output_tokens covers reasoning tokens, visible output tokens and formatting tokens. Each file must be under 50 MB and the combined limit per request is 50 MB, so three 40-MB files (120 MB) are rejected. By default, response data is retained for 30 days, which is what makes chaining with previous_response_id possible.
    fr: |
      Avec l'API Responses, max_output_tokens couvre les jetons de raisonnement, les jetons de sortie visibles et les jetons de mise en forme. Chaque fichier doit faire moins de 50 Mo et la limite cumulée par requête est de 50 Mo : trois fichiers de 40 Mo (120 Mo) sont refusés. Par défaut, les données des réponses sont conservées 30 jours, ce qui permet l'enchaînement avec previous_response_id.
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
  - title: Azure OpenAI reasoning models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
