id: ai103-2c-second-api-scope
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a prompt agent named orders-agent in Microsoft Foundry. orders-agent uses an OpenAPI tool to query the order API and answers customer questions with the same instructions, model and permissions for every request.

    Customers now also ask for parcel tracking. The carrier exposes a tracking REST API that has an OpenAPI 3.0 specification.

    You need orders-agent to answer tracking questions. The solution must minimize cost and complexity. What should you do?
  fr: |
    Northwind Traders dispose d'un agent d'invite nommé orders-agent dans Microsoft Foundry. orders-agent utilise un outil OpenAPI pour interroger l'API de commandes et répond aux questions des clients avec les mêmes instructions, le même modèle et les mêmes autorisations pour chaque demande.

    Les clients demandent désormais aussi le suivi des colis. Le transporteur expose une API REST de suivi dotée d'une spécification OpenAPI 3.0.

    orders-agent doit répondre aux questions de suivi. La solution doit réduire le coût et la complexité. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a tracking agent and call it from orders-agent by using an A2A tool.", fr: "Créer un agent de suivi et l'appeler depuis orders-agent à l'aide d'un outil A2A." } }
    - { id: b, text: { en: "Add a second OpenAPI tool for the tracking API to orders-agent.", fr: "Ajouter à orders-agent un second outil OpenAPI pour l'API de suivi." } }
    - { id: c, text: { en: "Create a tracking agent and route customers to it with a handoff workflow.", fr: "Créer un agent de suivi et y router les clients avec un workflow handoff." } }
    - { id: d, text: { en: "Create a tracking agent and coordinate both agents with a Magentic workflow.", fr: "Créer un agent de suivi et coordonner les deux agents avec un workflow Magentic." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The new need is one more data source that uses the same instructions, model and permissions, so a single agent with one more tool is enough. The OpenAPI tool lets the service call a REST API described by an OpenAPI 3.0 or 3.1 specification. Adding agents would add model calls, orchestration and operational overhead without separating any responsibility.
    fr: |
      Le nouveau besoin est une source de données de plus qui utilise les mêmes instructions, le même modèle et les mêmes autorisations : un seul agent avec un outil de plus suffit. L'outil OpenAPI permet au service d'appeler une API REST décrite par une spécification OpenAPI 3.0 ou 3.1. Ajouter des agents ajouterait des appels de modèle, de l'orchestration et une charge d'exploitation sans séparer aucune responsabilité.
  options:
    a:
      en: |
        A second agent behind an A2A tool works but adds an agent, a connection and extra model calls for a need that one tool covers.
      fr: |
        Un second agent derrière un outil A2A fonctionnerait, mais ajoute un agent, une connexion et des appels de modèle supplémentaires pour un besoin qu'un seul outil couvre.
    c:
      en: |
        A handoff workflow adds an orchestration layer and a second agent, which increases cost and complexity.
      fr: |
        Un workflow handoff ajoute une couche d'orchestration et un second agent, ce qui augmente le coût et la complexité.
    d:
      en: |
        Magentic is meant for open-ended tasks that need dynamic planning; it adds a manager agent and many coordination rounds.
      fr: |
        Magentic est destiné aux tâches ouvertes qui demandent une planification dynamique ; il ajoute un agent gestionnaire et de nombreux cycles de coordination.
references:
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
  - title: Operational standards for AI agents
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai-agents/single-agent-multiple-agents
