id: ai103-2a-semantic-rerank
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's RAG application sends a hybrid query to Azure AI Search and passes the top three chunks to the chat model. Tests show that the chunk that answers the question is usually in the top 10 results but rarely in the first three.

    You need to improve the order of the top results. The solution must not change the chunking or regenerate the embeddings.

    What should you do?
  fr: |
    L'application RAG de Fabrikam envoie une requête hybride à Azure AI Search et transmet les trois premiers blocs au modèle de conversation. Les tests montrent que le bloc qui répond à la question se trouve généralement parmi les 10 premiers résultats, mais rarement parmi les trois premiers.

    Vous devez améliorer l'ordre des premiers résultats. La solution ne doit ni modifier le découpage ni régénérer les embeddings.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a semantic configuration and send the query with queryType set to semantic.", fr: "Ajouter une configuration sémantique et envoyer la requête avec queryType défini sur semantic." } }
    - { id: b, text: { en: "Add an orderby clause on the last modified date of the chunks.", fr: "Ajouter une clause orderby sur la date de dernière modification des blocs." } }
    - { id: c, text: { en: "Set exhaustive to true on the vector query.", fr: "Définir exhaustive sur true dans la requête vectorielle." } }
    - { id: d, text: { en: "Remove the full-text part of the query and keep the vector query.", fr: "Supprimer la partie texte intégral de la requête et conserver la requête vectorielle." } }
answer: { optionId: a }
explanation:
  correct:
    en: Semantic ranker reranks the top results of a BM25 or RRF-ranked query with machine reading comprehension and returns them in order of @search.rerankerScore. It works on the existing index content and only needs a semantic configuration that lists the title, keywords and content fields.
    fr: Le classement sémantique reclasse les premiers résultats d'une requête classée par BM25 ou RRF à l'aide de la compréhension automatique de texte et les renvoie dans l'ordre de @search.rerankerScore. Il s'appuie sur le contenu existant de l'index et nécessite seulement une configuration sémantique qui liste les champs de titre, de mots clés et de contenu.
  options:
    b:
      en: An explicit sort order overrides relevance ranking, which would make the order worse, not better.
      fr: Un ordre de tri explicite remplace le classement par pertinence, ce qui dégraderait l'ordre au lieu de l'améliorer.
    c:
      en: Exhaustive KNN changes how nearest neighbors are found, not how the merged results are reranked for relevance.
      fr: Le KNN exhaustif change la façon de trouver les plus proches voisins, pas le reclassement des résultats fusionnés selon leur pertinence.
    d:
      en: Dropping the keyword part loses exact-term matches and does not add any reranking.
      fr: Supprimer la partie mot clé fait perdre les correspondances exactes et n'ajoute aucun reclassement.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
