id: ai103-sr2-fabrication-eval-1
objective: "2.1.4"
type: series_yesno
series: ai103-sr2-fabrication-eval
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You add the Relevance evaluator to the testing criteria.
  fr: Vous ajoutez l'évaluateur Relevance aux critères de test.
body:
  solution:
    en: |
      You add a testing criterion with `"evaluator_name": "builtin.relevance"`, `"initialization_parameters": {"deployment_name": "judge-model"}` and a `data_mapping` that maps `query` to `{{item.query}}` and `response` to `{{item.response}}`.
    fr: |
      Vous ajoutez un critère de test avec `"evaluator_name": "builtin.relevance"`, `"initialization_parameters": {"deployment_name": "judge-model"}` et un `data_mapping` qui mappe `query` sur `{{item.query}}` et `response` sur `{{item.response}}`.
answer: { value: false }
explanation:
  correct:
    en: Relevance measures whether the response addresses the query; it receives only the query and the response, never the retrieved passages. A response can answer the question directly while inventing a policy detail, and Relevance can't detect it. Detecting statements not supported by the context is the role of Groundedness.
    fr: "Relevance mesure si la réponse traite la question ; il ne reçoit que la question et la réponse, jamais les passages récupérés. Une réponse peut répondre directement à la question tout en inventant un détail de stratégie, et Relevance ne peut pas le détecter. La détection des affirmations non étayées par le contexte est le rôle de Groundedness."
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
