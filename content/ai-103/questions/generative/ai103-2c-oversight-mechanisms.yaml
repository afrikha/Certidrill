id: ai103-2c-oversight-mechanisms
objective: "2.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is adding safeguards to its agent solutions. Some agents are Foundry prompt agents; others run in workflows built in Python with Microsoft Agent Framework.

    Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys ajoute des mesures de protection à ses solutions d'agents. Certains agents sont des agents d'invite Foundry ; d'autres s'exécutent dans des workflows créés en Python avec Microsoft Agent Framework.

    Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: requireapproval, text: { en: "`require_approval` on an MCP tool", fr: "`require_approval` sur un outil MCP" } }
    - { id: allowedtools, text: { en: "A nonempty `allowed_tools` list on an MCP tool", fr: "Une liste `allowed_tools` non vide sur un outil MCP" } }
    - { id: requestinfo, text: { en: "`ctx.request_info()` in a workflow executor", fr: "`ctx.request_info()` dans un exécuteur de workflow" } }
    - { id: checkpoint, text: { en: "Checkpoint storage for the workflow", fr: "Stockage de points de contrôle pour le workflow" } }
    - { id: autonomous, text: { en: "`with_autonomous_mode()` on a handoff workflow", fr: "`with_autonomous_mode()` sur un workflow handoff" } }
  targets:
    - id: t1
      text: { en: "A prompt agent must wait for a supervisor's decision before each call to a vendor MCP tool runs.", fr: "Un agent d'invite doit attendre la décision d'un superviseur avant l'exécution de chaque appel à un outil MCP d'un éditeur." }
    - id: t2
      text: { en: "A prompt agent must be unable to call any tool of a vendor MCP server other than search_parts and get_part.", fr: "Un agent d'invite doit être incapable d'appeler un outil d'un serveur MCP d'éditeur autre que search_parts et get_part." }
    - id: t3
      text: { en: "A workflow step must ask an analyst for a missing cost center, then continue with the analyst's answer.", fr: "Une étape de workflow doit demander un centre de coûts manquant à un analyste, puis continuer avec sa réponse." }
    - id: t4
      text: { en: "Approvals that stay pending for several days must survive restarts of the process that hosts the workflow.", fr: "Les approbations qui restent en attente plusieurs jours doivent survivre aux redémarrages du processus qui héberge le workflow." }
answer:
  mapping: { t1: requireapproval, t2: allowedtools, t3: requestinfo, t4: checkpoint }
explanation:
  correct:
    en: |
      `require_approval` makes the agent return an `mcp_approval_request` and wait for an `mcp_approval_response` before the MCP call runs. A nonempty `allowed_tools` list restricts the agent to the named tools. In Agent Framework, `ctx.request_info()` pauses an executor until a response arrives, and checkpoint storage saves pending requests so that the workflow can resume after a restart.
    fr: |
      `require_approval` fait renvoyer à l'agent un `mcp_approval_request` et attendre un `mcp_approval_response` avant l'exécution de l'appel MCP. Une liste `allowed_tools` non vide limite l'agent aux outils nommés. Dans Agent Framework, `ctx.request_info()` suspend un exécuteur jusqu'à l'arrivée d'une réponse, et le stockage de points de contrôle enregistre les demandes en attente pour que le workflow reprenne après un redémarrage.
  options:
    autonomous:
      en: "`with_autonomous_mode()` makes handoff agents continue without waiting for the user, which removes a pause instead of adding one."
      fr: "`with_autonomous_mode()` fait continuer les agents d'un handoff sans attendre l'utilisateur : il supprime une pause au lieu d'en ajouter une."
references:
  - title: Connect agents to Model Context Protocol servers
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
  - title: Microsoft Agent Framework Workflows - Human-in-the-loop (HITL)
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/human-in-the-loop
