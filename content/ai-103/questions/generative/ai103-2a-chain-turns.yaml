id: ai103-2a-chain-turns
objective: "2.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys builds a tutoring application on a deployment named **tutor-chat** by using the Responses API with the default storage settings.

    The second request must reuse the context of the first exchange that the service already stores, without resending the first question or answer.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys développe une application de tutorat sur un déploiement nommé **tutor-chat** à l'aide de l'API Responses, avec les paramètres de stockage par défaut.

    La deuxième requête doit réutiliser le contexte du premier échange, que le service stocke déjà, sans renvoyer la première question ni la première réponse.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    first = openai.responses.create(
        model="tutor-chat",
        input="Define catastrophic forgetting.",
    )

    second = openai.responses.create(
        model="tutor-chat",
        [[chain]]=[[value]],
        input="Explain it for a first-year student.",
    )
    print(second.output_text)
  slots:
    - id: chain
      options:
        - { id: instr, text: instructions }
        - { id: prev, text: previous_response_id }
        - { id: store, text: store }
    - id: value
      options:
        - { id: text, text: first.output_text }
        - { id: output, text: first.output }
        - { id: id, text: first.id }
answer:
  values: { chain: prev, value: id }
explanation:
  correct:
    en: "`previous_response_id` set to the ID of the first response links the new request to the stored conversation state, so the model sees the first exchange without the application resending it."
    fr: "`previous_response_id`, défini sur l'ID de la première réponse, relie la nouvelle requête à l'état de conversation stocké : le modèle voit le premier échange sans que l'application le renvoie."
  options:
    instr: { en: "instructions sets the rules for the request; putting the previous answer there resends content and loses the first question.", fr: "instructions fixe les règles de la requête ; y placer la réponse précédente renvoie du contenu et perd la première question." }
    store: { en: "store controls whether the service keeps the response; it does not link two requests.", fr: "store indique si le service conserve la réponse ; il ne relie pas deux requêtes." }
    text: { en: "output_text is the generated text, not an identifier of the stored response.", fr: "output_text est le texte généré, pas un identifiant de la réponse stockée." }
    output: { en: "The output items are what you resend for manual chaining, which the requirement excludes.", fr: "Les éléments de sortie sont ce que l'on renvoie pour un enchaînement manuel, ce que l'exigence exclut." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
