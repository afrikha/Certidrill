id: ai103-2d-router-facts
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders creates a model router deployment with custom settings: the Balanced routing mode and a model subset of three models, including the gpt-5-mini reasoning model. The application sends `temperature` set to 0.3 in every request.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée un déploiement de model router avec des paramètres personnalisés : le mode de routage Balanced et un sous-ensemble de trois modèles, dont le modèle de raisonnement gpt-5-mini. L'application envoie `temperature` défini sur 0,3 dans chaque requête.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If the selected model has a transient issue, the router can redirect the request to another model of the subset without additional configuration."
        fr: "Si le modèle sélectionné rencontre un problème transitoire, le router peut rediriger la requête vers un autre modèle du sous-ensemble sans configuration supplémentaire."
    - id: s2
      text:
        en: "When the router sends a request to gpt-5-mini, the model applies the temperature value of 0.3."
        fr: "Quand le router envoie une requête à gpt-5-mini, le modèle applique la valeur de temperature de 0,3."
    - id: s3
      text:
        en: "When a new underlying model becomes available for model router, Northwind's deployment starts routing to it automatically."
        fr: "Quand un nouveau modèle sous-jacent devient disponible pour le model router, le déploiement de Northwind commence automatiquement à router vers lui."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      If the selected model returns a retryable error, model router fails over to the next-best model automatically, with nothing to configure. Reasoning models such as gpt-5-mini don't support temperature, and model router drops an optional parameter that the selected model doesn't support. New models are excluded from a model subset until you explicitly add them.
    fr: |
      Si le modèle sélectionné renvoie une erreur pouvant faire l'objet d'une nouvelle tentative, le model router bascule automatiquement vers le meilleur modèle suivant, sans rien à configurer. Les modèles de raisonnement comme gpt-5-mini ne prennent pas en charge temperature, et le model router supprime un paramètre facultatif que le modèle sélectionné ne prend pas en charge. Les nouveaux modèles sont exclus d'un sous-ensemble de modèles tant que vous ne les ajoutez pas explicitement.
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
  - title: How to use model router for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/model-router
