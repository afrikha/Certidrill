id: ai103-2d-router-facts
objective: "2.3.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders creates a model router deployment with custom settings: the Balanced routing mode and a model subset of three models, including one o-series reasoning model. The application sends `temperature` set to 0.3 in every request.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée un déploiement de model router avec des paramètres personnalisés : le mode de routage Balanced et un sous-ensemble de trois modèles, dont un modèle de raisonnement de la série o. L'application envoie `temperature` défini sur 0,3 dans chaque requête.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "If the selected model has a transient issue, the router can redirect the request to another model of the subset without additional configuration."
        fr: "Si le modèle sélectionné rencontre un problème transitoire, le router peut rediriger la requête vers un autre modèle du sous-ensemble sans configuration supplémentaire."
    - id: s2
      text:
        en: "When the router sends a request to the o-series model, the model applies the temperature value of 0.3."
        fr: "Quand le router envoie une requête au modèle de la série o, le modèle applique la valeur de temperature de 0,3."
    - id: s3
      text:
        en: "When a new underlying model becomes available for model router, Northwind's deployment starts routing to it automatically."
        fr: "Quand un nouveau modèle sous-jacent devient disponible pour le model router, le déploiement de Northwind commence automatiquement à router vers lui."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Failover is enabled by default, and the configured model subset also acts as the fallback set, which is why it should contain at least two models. Reasoning models don't support temperature, so the router ignores the Temperature and Top_P values when it selects an o-series model. New base models aren't included in a selection until you explicitly add them to the deployment's inclusion list.
    fr: |
      Le basculement est activé par défaut, et le sous-ensemble de modèles configuré sert aussi d'ensemble de repli, d'où l'intérêt d'y inclure au moins deux modèles. Les modèles de raisonnement ne prennent pas en charge temperature : le router ignore donc les valeurs Temperature et Top_P quand il sélectionne un modèle de la série o. Les nouveaux modèles de base ne sont pas inclus dans une sélection tant que vous ne les ajoutez pas explicitement à la liste d'inclusion du déploiement.
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
  - title: How to use model router for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/model-router
