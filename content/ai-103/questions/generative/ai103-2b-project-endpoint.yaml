id: ai103-2b-project-endpoint
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a Foundry resource named adatum-ai that contains a project named claims. A Python application will create an `AIProjectClient` to work with the agents and connections of the claims project.

    Which endpoint should the application use?
  fr: |
    Adatum Corporation dispose d'une ressource Foundry nommée adatum-ai qui contient un projet nommé claims. Une application Python va créer un `AIProjectClient` pour utiliser les agents et les connexions du projet claims.

    Quel point de terminaison l'application doit-elle utiliser ?
body:
  options:
    - { id: a, text: "https://claims.services.ai.azure.com/api/projects/adatum-ai" }
    - { id: b, text: "https://adatum-ai.openai.azure.com/openai/v1/" }
    - { id: c, text: "https://adatum-ai.services.ai.azure.com/api/projects/claims" }
    - { id: d, text: "https://adatum-ai.cognitiveservices.azure.com/" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AIProjectClient takes the project endpoint, in the form `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. The host name carries the Foundry resource and the path carries the project.
    fr: |
      AIProjectClient attend le point de terminaison du projet, sous la forme `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. Le nom d'hôte porte la ressource Foundry et le chemin porte le projet.
  options:
    a: { en: "The resource and project names are swapped: the host name must be the resource, adatum-ai.", fr: "Les noms de la ressource et du projet sont inversés : le nom d'hôte doit être la ressource, adatum-ai." }
    b: { en: "The /openai/v1 endpoint serves the OpenAI SDK and doesn't expose project features such as connections.", fr: "Le point de terminaison /openai/v1 sert le SDK OpenAI et n'expose pas les fonctionnalités du projet, comme les connexions." }
    d: { en: "The cognitiveservices.azure.com endpoint is used by the Foundry Tools SDKs.", fr: "Le point de terminaison cognitiveservices.azure.com est utilisé par les SDK Foundry Tools." }
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
