id: ai103-2a-concurrent-approval
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware is building a contract workflow with Microsoft Agent Framework. A legal review agent and a financial review agent must analyze the same contract at the same time, because neither review depends on the other. After both reviews, an agent can call a sign_contract tool, but the tool must not run until a manager has reviewed the request.

    Which two features should you use? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware développe un workflow de contrats avec Microsoft Agent Framework. Un agent de revue juridique et un agent de revue financière doivent analyser le même contrat en même temps, car aucune des deux revues ne dépend de l'autre. Après les deux revues, un agent peut appeler un outil sign_contract, mais l'outil ne doit pas s'exécuter tant qu'un responsable n'a pas examiné la demande.

    Quelles sont les deux fonctionnalités à utiliser ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Sequential orchestration for the two reviews", fr: "Une orchestration séquentielle pour les deux revues" } }
    - { id: b, text: { en: "Concurrent orchestration for the two reviews", fr: "Une orchestration concurrente pour les deux revues" } }
    - { id: c, text: { en: "Handoff orchestration between the two review agents", fr: "Une orchestration de transfert (handoff) entre les deux agents de revue" } }
    - { id: d, text: { en: "An approval-required tool for sign_contract", fr: "Un outil soumis à approbation pour sign_contract" } }
    - { id: e, text: { en: "Group chat orchestration that includes the manager as an agent", fr: "Une orchestration de conversation de groupe qui inclut le responsable comme agent" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      In concurrent orchestration, agents execute in parallel, which fits two independent reviews of the same contract. Orchestrations support human-in-the-loop through tool approval: an approval-required tool pauses the workflow for human review before it runs.
    fr: |
      Dans une orchestration concurrente, les agents s'exécutent en parallèle, ce qui convient à deux revues indépendantes du même contrat. Les orchestrations prennent en charge l'humain dans la boucle par l'approbation d'outils : un outil soumis à approbation met le workflow en pause pour un examen humain avant de s'exécuter.
  options:
    a:
      en: Sequential orchestration runs the agents one after another, not at the same time.
      fr: L'orchestration séquentielle exécute les agents l'un après l'autre, pas en même temps.
    c:
      en: Handoff transfers control from one agent to another based on context; the reviews would not run in parallel.
      fr: Le transfert passe le contrôle d'un agent à un autre selon le contexte ; les revues ne s'exécuteraient pas en parallèle.
    e:
      en: A manager modeled as an agent is still an AI agent; it gives no human approval before the tool runs.
      fr: Un responsable modélisé comme agent reste un agent IA ; il n'apporte aucune approbation humaine avant l'exécution de l'outil.
references:
  - title: Workflow orchestrations in Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations
