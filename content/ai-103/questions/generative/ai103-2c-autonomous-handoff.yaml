id: ai103-2c-autonomous-handoff
objective: "2.2.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a handoff workflow built in Python with Microsoft Agent Framework. You want the triage agent to continue on its own for a few turns instead of waiting for the customer each time it answers without a handoff.

    You change the builder as follows:

    ```python
    workflow = (
        HandoffBuilder(
            name="contoso_support",
            participants=[triage_agent, billing_agent, returns_agent],
        )
        .with_start_agent(triage_agent)
        .with_autonomous_mode(
            agents=[triage_agent],
            turn_limits={triage_agent.name: 3},
        )
        .build()
    )
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un workflow handoff créé en Python avec Microsoft Agent Framework. Vous voulez que l'agent de tri continue seul pendant quelques tours au lieu d'attendre le client chaque fois qu'il répond sans handoff.

    Vous modifiez le générateur comme suit :

    ```python
    workflow = (
        HandoffBuilder(
            name="contoso_support",
            participants=[triage_agent, billing_agent, returns_agent],
        )
        .with_start_agent(triage_agent)
        .with_autonomous_mode(
            agents=[triage_agent],
            turn_limits={triage_agent.name: 3},
        )
        .build()
    )
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When billing_agent answers without a handoff, the workflow emits a request for user input.
        fr: Quand billing_agent répond sans handoff, le workflow émet une demande d'entrée utilisateur.
    - id: s2
      text:
        en: If you remove the turn_limits argument, triage_agent can take up to 10 autonomous turns.
        fr: Si vous supprimez l'argument turn_limits, triage_agent peut effectuer jusqu'à 10 tours autonomes.
    - id: s3
      text:
        en: If you set the turn limit of triage_agent to 0, control returns to the customer immediately after a response of triage_agent that isn't a handoff.
        fr: Si vous fixez à 0 la limite de tours de triage_agent, le contrôle revient au client immédiatement après une réponse de triage_agent qui n'est pas un handoff.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Autonomous mode (experimental) applies only to the agents listed in `agents`, so billing_agent still triggers a `request_info` event with a `HandoffAgentUserRequest` when it answers without a handoff. Without `turn_limits`, the default limit is 50 autonomous turns, not 10. A limit of 0 returns control immediately after a non-handoff response.
    fr: |
      Le mode autonome (expérimental) ne s'applique qu'aux agents listés dans `agents` : billing_agent déclenche donc toujours un événement `request_info` avec un `HandoffAgentUserRequest` quand il répond sans handoff. Sans `turn_limits`, la limite par défaut est de 50 tours autonomes, et non de 10. Une limite de 0 rend le contrôle immédiatement après une réponse sans handoff.
references:
  - title: Microsoft Agent Framework Workflows Orchestrations - Handoff
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/handoff
