id: ai103-2a-o4mini-params
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware moves a financial analysis feature from a GPT-4.1 deployment to a deployment named **analyst-o4** that runs the o4-mini reasoning model. The application uses the following code.

    ```text
    response = client.chat.completions.create(
        model="analyst-o4",
        messages=[
            {"role": "developer", "content": "You are a financial analyst."},
            {"role": "user", "content": question},
        ],
        temperature=0.2,
        max_tokens=2000,
        tools=tools,
    )
    ```

    The request is rejected because of unsupported parameters.

    Which two parameters should you remove or replace? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware migre une fonctionnalité d'analyse financière d'un déploiement GPT-4.1 vers un déploiement nommé **analyst-o4** qui exécute le modèle de raisonnement o4-mini. L'application utilise le code suivant.

    ```text
    response = client.chat.completions.create(
        model="analyst-o4",
        messages=[
            {"role": "developer", "content": "You are a financial analyst."},
            {"role": "user", "content": question},
        ],
        temperature=0.2,
        max_tokens=2000,
        tools=tools,
    )
    ```

    La requête est rejetée à cause de paramètres non pris en charge.

    Quels sont les deux paramètres à supprimer ou à remplacer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: model }
    - { id: b, text: temperature }
    - { id: c, text: messages }
    - { id: d, text: max_tokens }
    - { id: e, text: tools }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Reasoning models such as o4-mini don't support `temperature` (nor `top_p`, the penalties or `logit_bias`) and don't support `max_tokens`. With Chat Completions, replace `max_tokens` with `max_completion_tokens`, which covers reasoning tokens as well as visible output tokens.
    fr: Les modèles de raisonnement comme o4-mini ne prennent pas en charge `temperature` (ni `top_p`, les pénalités ou `logit_bias`) ni `max_tokens`. Avec Chat Completions, remplacez `max_tokens` par `max_completion_tokens`, qui couvre les jetons de raisonnement en plus des jetons de sortie visibles.
  options:
    a:
      en: model must contain the deployment name, which is analyst-o4.
      fr: model doit contenir le nom du déploiement, ici analyst-o4.
    c:
      en: messages is the required input of Chat Completions; developer messages work like system messages on reasoning models.
      fr: messages est l'entrée obligatoire de Chat Completions ; les messages developer fonctionnent comme des messages système sur les modèles de raisonnement.
    e:
      en: Function calling with tools is supported by reasoning models.
      fr: L'appel de fonction avec tools est pris en charge par les modèles de raisonnement.
references:
  - title: Azure OpenAI reasoning models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
