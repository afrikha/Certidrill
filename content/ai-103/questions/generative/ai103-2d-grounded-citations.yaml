id: ai103-2d-grounded-citations
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's internal assistant uses a **gpt-4.1** deployment. Each prompt contains a system message and the policy passages that the application retrieves for the question. Retrieval returns the right passages, but auditors find statements in the answers that appear in none of the passages, especially when the passages don't contain the answer.

    You need to reduce fabricated statements by changing only the prompt.

    Which two changes should you make?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant interne de Woodgrove Bank utilise un déploiement **gpt-4.1**. Chaque invite contient un message système et les extraits de stratégie que l'application récupère pour la question. La récupération renvoie les bons extraits, mais les auditeurs trouvent dans les réponses des affirmations qui ne figurent dans aucun extrait, surtout quand les extraits ne contiennent pas la réponse.

    Vous devez réduire les affirmations inventées en modifiant uniquement l'invite.

    Quelles sont les deux modifications à apporter ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Require an inline citation of the source passage after each statement.", fr: "Exiger une citation en ligne de l'extrait source après chaque affirmation." } }
    - { id: b, text: { en: "Ask the model to answer from its general banking knowledge when unsure.", fr: "Demander au modèle de répondre à partir de ses connaissances bancaires générales en cas de doute." } }
    - { id: c, text: { en: "Instruct the model to answer only from the passages and to reply \"not found\" otherwise.", fr: "Demander au modèle de répondre uniquement à partir des extraits et de répondre « not found » sinon." } }
    - { id: d, text: { en: "Move the passages into the system message and remove the user question.", fr: "Déplacer les extraits dans le message système et supprimer la question de l'utilisateur." } }
    - { id: e, text: { en: "Add few-shot examples in which every question receives a complete answer.", fr: "Ajouter des exemples few-shot dans lesquels chaque question reçoit une réponse complète." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Restricting the model to the supplied text and giving it an "out" such as "not found" lets it decline instead of inventing an answer when the passages don't contain one. Inline citations make grounding more likely, because a fabricated statement would also need a bad citation, and Learn notes they work better than citations at the end.
    fr: "Restreindre le modèle au texte fourni et lui donner une « porte de sortie » comme « not found » lui permet de refuser au lieu d'inventer une réponse quand les extraits n'en contiennent pas. Les citations en ligne rendent l'ancrage plus probable, car une affirmation inventée exigerait aussi une mauvaise citation, et Learn indique qu'elles sont plus efficaces que des citations en fin de réponse."
  options:
    b: { en: "Answering from general knowledge is exactly how statements outside the passages appear.", fr: "Répondre à partir des connaissances générales est précisément l'origine des affirmations absentes des extraits." }
    d: { en: "Without the question the model doesn't know what to answer, and moving the passages doesn't stop it from adding content.", fr: "Sans la question, le modèle ne sait pas à quoi répondre, et déplacer les extraits ne l'empêche pas d'ajouter du contenu." }
    e: { en: "Examples that always contain a complete answer teach the model never to decline, which encourages fabrication when the passages lack the answer.", fr: "Des exemples qui contiennent toujours une réponse complète apprennent au modèle à ne jamais refuser, ce qui favorise l'invention quand les extraits n'ont pas la réponse." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
