id: ai103-2b-keyless-app-service
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. hosts a Python web app in Azure App Service. The app uses `AIProjectClient` and `get_openai_client()` to call a model deployment in a Foundry project named chat-prj.

    Security requirements:

    - No secret may be stored in the code or in the app settings.
    - The identity of the app must have the least privilege needed.

    What should you do?
  fr: |
    Proseware, Inc. héberge une application web Python dans Azure App Service. L'application utilise `AIProjectClient` et `get_openai_client()` pour appeler un déploiement de modèle dans un projet Foundry nommé chat-prj.

    Exigences de sécurité :

    - Aucun secret ne doit être stocké dans le code ni dans les paramètres de l'application.
    - L'identité de l'application doit disposer du moindre privilège nécessaire.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable a managed identity on the app, and assign it the Foundry Account Owner role on the Foundry resource", fr: "Activer une identité managée sur l'application, et lui attribuer le rôle Foundry Account Owner sur la ressource Foundry" } }
    - { id: b, text: { en: "Enable a managed identity on the app, and assign it the Reader role on the chat-prj project", fr: "Activer une identité managée sur l'application, et lui attribuer le rôle Reader sur le projet chat-prj" } }
    - { id: c, text: { en: "Store the API key of the Foundry resource in an app setting, and pass it to AIProjectClient", fr: "Stocker la clé API de la ressource Foundry dans un paramètre d'application, et la passer à AIProjectClient" } }
    - { id: d, text: { en: "Enable a managed identity on the app, and assign it the Foundry User role on the chat-prj project", fr: "Activer une identité managée sur l'application, et lui attribuer le rôle Foundry User sur le projet chat-prj" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With a managed identity, `DefaultAzureCredential` gets Microsoft Entra tokens without any stored secret. Foundry User (formerly Azure AI User) grants the data actions needed to call models and agents in a project, and assigning it at the project scope keeps the privilege narrow.
    fr: |
      Avec une identité managée, `DefaultAzureCredential` obtient des jetons Microsoft Entra sans aucun secret stocké. Foundry User (anciennement Azure AI User) accorde les actions de données nécessaires pour appeler les modèles et les agents d'un projet, et son attribution à l'étendue du projet limite le privilège.
  options:
    a: { en: "Foundry Account Owner creates projects and manages models but doesn't grant the build and develop data actions, and its scope is broader than needed.", fr: "Foundry Account Owner crée des projets et gère des modèles, mais n'accorde pas les actions de données de création et de développement, et son étendue est plus large que nécessaire." }
    b: { en: "Reader gives read-only access to the project and doesn't allow calls to a model deployment.", fr: "Reader donne un accès en lecture seule au projet et ne permet pas d'appeler un déploiement de modèle." }
    c: { en: "An API key in an app setting is a stored secret, and AIProjectClient accepts only a token credential.", fr: "Une clé API dans un paramètre d'application est un secret stocké, et AIProjectClient n'accepte que des informations d'identification par jeton." }
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
