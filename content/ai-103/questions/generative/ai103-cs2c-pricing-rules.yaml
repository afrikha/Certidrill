id: ai103-cs2c-pricing-rules
objective: "2.3.4"
type: single
caseStudy: ai103-cs2c-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the prices requirement. What should you do?
  fr: |
    Vous devez satisfaire l'exigence relative aux prix. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: |
          Copy the price list and the discount rules of pricing-api into the instructions of order-agent, and set the temperature to 0.
        fr: |
          Copier la liste des prix et les règles de remise de pricing-api dans les instructions de order-agent, et définir la température sur 0.
    - id: b
      text:
        en: |
          Add the code interpreter tool to order-agent, and instruct the agent to calculate each price in Python from the rules of pricing-api.
        fr: |
          Ajouter l'outil d'interpréteur de code à order-agent, et demander à l'agent de calculer chaque prix en Python à partir des règles de pricing-api.
    - id: c
      text:
        en: |
          Add a function tool that the backend implements by calling pricing-api, and instruct order-agent to state only the prices that the tool returns.
        fr: |
          Ajouter un outil de fonction que le back-end implémente en appelant pricing-api, et demander à order-agent de n'annoncer que les prix renvoyés par l'outil.
    - id: d
      text:
        en: |
          Export the price list and the discount rules of pricing-api as files, and add the file search tool to order-agent.
        fr: |
          Exporter la liste des prix et les règles de remise de pricing-api sous forme de fichiers, et ajouter l'outil de recherche de fichiers à order-agent.
answer: { optionId: c }
explanation:
  correct:
    en: |
      This is a hybrid design: the model handles the conversation and decides when a price is needed, and the existing rules engine performs the calculation. With function calling, the agent only requests the call; the backend runs it against pricing-api and returns the result, so every price comes from the audited, deterministic engine.
    fr: |
      Il s'agit d'une conception hybride : le modèle gère la conversation et décide quand un prix est nécessaire, et le moteur de règles existant effectue le calcul. Avec l'appel de fonctions, l'agent se contente de demander l'appel ; le back-end l'exécute auprès de pricing-api et renvoie le résultat : chaque prix provient donc du moteur audité et déterministe.
  options:
    a:
      en: |
        The model would still calculate the prices itself; a temperature of 0 reduces variability but doesn't make the arithmetic auditable or guaranteed.
      fr: |
        Le modèle calculerait toujours les prix lui-même ; une température de 0 réduit la variabilité mais ne rend pas le calcul auditable ni garanti.
    b:
      en: |
        The code that the model writes replaces the audited rules engine, so the calculation is neither the one that finance audits nor guaranteed to be identical from one run to the next.
      fr: |
        Le code écrit par le modèle remplace le moteur de règles audité : le calcul n'est ni celui qu'audite le service financier, ni garanti identique d'une exécution à l'autre.
    d:
      en: |
        File search retrieves passages of the rules, but the model would still apply them and calculate the prices.
      fr: |
        La recherche de fichiers récupère des extraits des règles, mais le modèle les appliquerait toujours et calculerait les prix.
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
