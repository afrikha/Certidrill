id: ai103-2b-openai-v1
objective: "2.1.5"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. has a Foundry resource named proseware-ai that contains a project named docs. Developers compare the OpenAI client returned by `AIProjectClient.get_openai_client()` with an OpenAI client that targets `https://proseware-ai.openai.azure.com/openai/v1/` directly.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'une ressource Foundry nommée proseware-ai qui contient un projet nommé docs. Les développeurs comparent le client OpenAI renvoyé par `AIProjectClient.get_openai_client()` avec un client OpenAI qui cible directement `https://proseware-ai.openai.azure.com/openai/v1/`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          An OpenAI client that targets the /openai/v1 endpoint of proseware-ai can call Chat Completions and generate embeddings with the deployments of the resource.
        fr: |
          Un client OpenAI qui cible le point de terminaison /openai/v1 de proseware-ai peut appeler Chat Completions et générer des embeddings avec les déploiements de la ressource.
    - id: s2
      text:
        en: |
          The /openai/v1 endpoint of proseware-ai also exposes Foundry-specific features, such as the project connections and agent versions.
        fr: |
          Le point de terminaison /openai/v1 de proseware-ai expose aussi des fonctionnalités propres à Foundry, comme les connexions du projet et les versions d'agent.
    - id: s3
      text:
        en: |
          By default, the client returned by get_openai_client() uses the project endpoint followed by /openai/v1 as its base URL.
        fr: |
          Par défaut, le client renvoyé par get_openai_client() utilise comme URL de base le point de terminaison du projet suivi de /openai/v1.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The `/openai/v1` endpoint of the resource serves the OpenAI SDK, including embeddings, Chat Completions and Azure OpenAI models, but it doesn't expose Foundry-specific features: those go through the project endpoint and AIProjectClient. `get_openai_client()` returns an `openai.OpenAI` client whose base URL defaults to the project endpoint with `/openai/v1` appended.
    fr: |
      Le point de terminaison `/openai/v1` de la ressource sert le SDK OpenAI, embeddings, Chat Completions et modèles Azure OpenAI compris, mais il n'expose pas les fonctionnalités propres à Foundry : elles passent par le point de terminaison du projet et AIProjectClient. `get_openai_client()` renvoie un client `openai.OpenAI` dont l'URL de base est par défaut le point de terminaison du projet suivi de `/openai/v1`.
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
  - title: azure.ai.projects.AIProjectClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.aiprojectclient
