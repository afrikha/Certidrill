id: ai103-2d-rules-or-model
objective: "2.3.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is building a customer service flow that combines a **gpt-4.1** deployment with a rules engine. The flow must meet the following requirements:

    - detect frustrated customers from the tone of their messages;
    - refuse refunds above 500 USD unless a manager has approved them;
    - summarize long complaint threads for the agents;
    - apply the legal 14-day withdrawal period to online orders;
    - extract the order number from free-text emails.

    Which two requirements should you implement as deterministic rules instead of instructions to the model?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys crée un flux de service client qui combine un déploiement **gpt-4.1** et un moteur de règles. Le flux doit satisfaire les exigences suivantes :

    - détecter les clients mécontents à partir du ton de leurs messages ;
    - refuser les remboursements de plus de 500 USD sans l'approbation d'un responsable ;
    - résumer les longs fils de réclamation pour les conseillers ;
    - appliquer le délai légal de rétractation de 14 jours aux commandes en ligne ;
    - extraire le numéro de commande des e-mails en texte libre.

    Quelles sont les deux exigences à implémenter sous forme de règles déterministes plutôt que d'instructions au modèle ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Detect frustrated customers from their tone", fr: "Détecter les clients mécontents à partir de leur ton" } }
    - { id: b, text: { en: "Refuse refunds above 500 USD without manager approval", fr: "Refuser les remboursements de plus de 500 USD sans approbation d'un responsable" } }
    - { id: c, text: { en: "Summarize long complaint threads", fr: "Résumer les longs fils de réclamation" } }
    - { id: d, text: { en: "Apply the 14-day withdrawal period", fr: "Appliquer le délai de rétractation de 14 jours" } }
    - { id: e, text: { en: "Extract the order number from free-text emails", fr: "Extraire le numéro de commande des e-mails en texte libre" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Fixed thresholds and legal periods must apply every time and be auditable, so they belong in code, not in an instruction that a model may not follow. The model handles the unstructured parts: reading tone, summarizing and extracting fields from free text, whose results the rules can then use."
    fr: "Les seuils fixes et les délais légaux doivent s'appliquer à chaque fois et être auditables : ils ont leur place dans le code, pas dans une instruction qu'un modèle pourrait ne pas suivre. Le modèle traite les parties non structurées : lire le ton, résumer et extraire des champs du texte libre, dont les résultats peuvent ensuite servir aux règles."
  options:
    a: { en: "Tone is expressed in many ways that fixed rules can't capture; a language model handles it.", fr: "Le ton s'exprime de multiples façons que des règles fixes ne peuvent pas saisir ; un modèle de langage le traite." }
    c: { en: "Summarization is a language generation task for the model.", fr: "La synthèse est une tâche de génération de langage pour le modèle." }
    e: { en: "Free-text emails vary too much for fixed rules; the model extracts the field, and the rules can validate it.", fr: "Les e-mails en texte libre varient trop pour des règles fixes ; le modèle extrait le champ, et les règles peuvent le valider." }
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs
