id: ai103-2b-tools-endpoint
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Foundry resource named fabrikam-ai that contains a project named moderation. A Python application must screen user posts by using the Azure AI Content Safety client library, one of the Foundry Tools SDKs.

    Which endpoint should the application pass to the Content Safety client?
  fr: |
    Fabrikam, Inc. dispose d'une ressource Foundry nommée fabrikam-ai qui contient un projet nommé moderation. Une application Python doit filtrer les publications des utilisateurs à l'aide de la bibliothèque cliente Azure AI Content Safety, l'un des SDK Foundry Tools.

    Quel point de terminaison l'application doit-elle passer au client Content Safety ?
body:
  options:
    - { id: a, text: "https://fabrikam-ai.services.ai.azure.com/api/projects/moderation" }
    - { id: b, text: "https://fabrikam-ai.openai.azure.com/openai/v1/" }
    - { id: c, text: "https://fabrikam-ai.services.ai.azure.com/anthropic" }
    - { id: d, text: "https://fabrikam-ai.cognitiveservices.azure.com/" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Foundry Tools (formerly Azure AI services) have their own SDKs with tool-specific endpoints. Vision, Content Safety, Document Intelligence, Language and Translation SDKs use the `https://<resource-name>.cognitiveservices.azure.com/` endpoint of the resource.
    fr: |
      Les Foundry Tools (anciennement Azure AI services) disposent de leurs propres SDK avec des points de terminaison spécifiques à chaque outil. Les SDK Vision, Content Safety, Document Intelligence, Language et Translation utilisent le point de terminaison `https://<resource-name>.cognitiveservices.azure.com/` de la ressource.
  options:
    a: { en: "The project endpoint is used by AIProjectClient for agents, connections and evaluations, not by the Content Safety SDK.", fr: "Le point de terminaison du projet est utilisé par AIProjectClient pour les agents, les connexions et les évaluations, pas par le SDK Content Safety." }
    b: { en: "The /openai/v1 endpoint serves the OpenAI SDK (responses, chat completions, embeddings), not Content Safety.", fr: "Le point de terminaison /openai/v1 sert le SDK OpenAI (réponses, complétions de conversation, embeddings), pas Content Safety." }
    c: { en: "The /anthropic endpoint serves the Anthropic SDK for Claude models.", fr: "Le point de terminaison /anthropic sert le SDK Anthropic pour les modèles Claude." }
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
