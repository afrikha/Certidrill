id: ai103-2d-router-claude-order
objective: "2.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation wants its application to send every request to one model router deployment. The router must choose only among a Claude model and two OpenAI models, always pick the highest-quality model for each prompt, and fail over within that set.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation veut que son application envoie chaque requête à un seul déploiement de model router. Le router doit choisir uniquement entre un modèle Claude et deux modèles OpenAI, toujours retenir le modèle de meilleure qualité pour chaque invite, et basculer au sein de cet ensemble.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: claude, text: { en: "Deploy the Claude model from the model catalog to the Foundry resource.", fr: "Déployer le modèle Claude depuis le catalogue de modèles vers la ressource Foundry." } }
    - { id: custom, text: { en: "Deploy model-router and choose Custom settings.", fr: "Déployer model-router et choisir Custom settings." } }
    - { id: subset, text: { en: "Select the Quality routing mode and route to a subset of models that contains the three models.", fr: "Sélectionner le mode de routage Quality et router vers un sous-ensemble de modèles contenant les trois modèles." } }
    - { id: call, text: { en: "Set the model parameter of the application's requests to the name of the router deployment.", fr: "Définir le paramètre model des requêtes de l'application sur le nom du déploiement du router." } }
    - { id: openai, text: { en: "Deploy each of the two OpenAI models separately before deploying the router.", fr: "Déployer séparément chacun des deux modèles OpenAI avant de déployer le router." } }
    - { id: failover, text: { en: "Turn on automatic failover in the router deployment settings.", fr: "Activer le basculement automatique dans les paramètres du déploiement du router." } }
answer:
  sequence: [ claude, custom, subset, call ]
explanation:
  correct:
    en: |
      Claude models are the exception to the rule that model router needs no separate deployments: you deploy them yourself first. Custom settings expose the routing mode and Route to a subset of models; Quality picks the highest-quality model, and the router only chooses, and fails over, among the models of the subset. The application then calls the router like any chat model, with the router deployment name in the model parameter.
    fr: |
      Les modèles Claude font exception à la règle selon laquelle le model router n'a pas besoin de déploiements distincts : vous devez d'abord les déployer vous-même. Custom settings donne accès au mode de routage et à Route to a subset of models ; Quality retient le modèle de meilleure qualité, et le router ne choisit, et ne bascule, que parmi les modèles du sous-ensemble. L'application appelle ensuite le router comme n'importe quel modèle de conversation, avec le nom du déploiement du router dans le paramètre model.
  options:
    openai: { en: "The supported OpenAI models don't need separate deployments for model router.", fr: "Les modèles OpenAI pris en charge n'ont pas besoin de déploiements distincts pour le model router." }
    failover: { en: "Failover to the next-best model is automatic and needs no configuration.", fr: "Le basculement vers le meilleur modèle suivant est automatique et ne nécessite aucune configuration." }
references:
  - title: How to use model router for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/model-router
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
