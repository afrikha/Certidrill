id: ai103-2d-critic-evaluator-match
objective: "2.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys adds a critique step to its generation pipeline and plans to use built-in evaluators of Microsoft Foundry as the critic. Each check in the answer area must use the evaluator designed for it.

    Which evaluator should you use for each check? To answer, drag the appropriate evaluators to the correct checks. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys ajoute une étape de critique à son pipeline de génération et prévoit d'utiliser des évaluateurs intégrés de Microsoft Foundry comme critique. Chaque contrôle de la zone de réponse doit utiliser l'évaluateur conçu pour lui.

    Quel évaluateur devez-vous utiliser pour chaque contrôle ? Pour répondre, faites glisser les évaluateurs appropriés vers les contrôles correspondants. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grounded, text: Groundedness }
    - { id: coherence, text: Coherence }
    - { id: fluency, text: Fluency }
    - { id: similarity, text: Similarity }
    - { id: relevance, text: Relevance }
    - { id: bleu, text: BLEU }
  targets:
    - id: t1
      text: { en: "The draft makes no claim that the retrieved context doesn't support.", fr: "Le brouillon ne contient aucune affirmation que le contexte récupéré n'étaye pas." }
    - id: t2
      text: { en: "The draft presents its ideas in a logical order that the reader can follow.", fr: "Le brouillon présente ses idées dans un ordre logique que le lecteur peut suivre." }
    - id: t3
      text: { en: "The draft is grammatically correct and easy to read.", fr: "Le brouillon est grammaticalement correct et facile à lire." }
    - id: t4
      text: { en: "The draft has the same meaning as a reference answer, even when the wording differs.", fr: "Le brouillon a le même sens qu'une réponse de référence, même quand la formulation diffère." }
answer:
  mapping: { t1: grounded, t2: coherence, t3: fluency, t4: similarity }
explanation:
  correct:
    en: "Groundedness measures how well a response aligns with the given context without fabricating content. Coherence measures the logical and orderly presentation of ideas. Fluency measures grammatical accuracy, vocabulary and overall readability. Similarity uses a judge model to measure the semantic similarity between the response and its ground truth."
    fr: "Groundedness mesure dans quelle mesure une réponse s'aligne sur le contexte fourni sans inventer de contenu. Coherence mesure la présentation logique et ordonnée des idées. Fluency mesure l'exactitude grammaticale, le vocabulaire et la lisibilité globale. Similarity utilise un modèle juge pour mesurer la similarité sémantique entre la réponse et sa vérité terrain."
  options:
    relevance: { en: "Relevance judges how accurately and directly the response addresses the query; it doesn't compare the draft with a reference answer or with the context.", fr: "Relevance juge avec quelle exactitude et quelle pertinence directe la réponse traite la requête ; il ne compare le brouillon ni à une réponse de référence ni au contexte." }
    bleu: { en: "BLEU measures how closely the words of the response match a reference text, so a correct answer with different wording scores low.", fr: "BLEU mesure la correspondance entre les mots de la réponse et un texte de référence : une réponse correcte formulée autrement obtient un score faible." }
references:
  - title: Built-in Evaluators Reference
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
  - title: General Purpose Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators
