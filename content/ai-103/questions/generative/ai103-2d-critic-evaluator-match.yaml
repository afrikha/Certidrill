id: ai103-2d-critic-evaluator-match
objective: "2.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys adds a critique step to its generation pipeline and plans to use built-in evaluators of Microsoft Foundry as the critic. Each check in the answer area must use the evaluator designed for it.

    Which evaluator should you use for each check? To answer, drag the appropriate evaluators to the correct checks. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys ajoute une étape de critique à son pipeline de génération et prévoit d'utiliser des évaluateurs intégrés de Microsoft Foundry comme critique. Chaque contrôle de la zone de réponse doit utiliser l'évaluateur conçu pour lui.

    Quel évaluateur devez-vous utiliser pour chaque contrôle ? Pour répondre, faites glisser les évaluateurs appropriés vers les contrôles correspondants. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grounded, text: Groundedness }
    - { id: adherence, text: Task Adherence }
    - { id: rubric, text: Rubric }
    - { id: completeness, text: Response Completeness }
    - { id: fluency, text: Fluency }
    - { id: bleu, text: BLEU }
  targets:
    - id: t1
      text: { en: "The draft makes no claim that the retrieved context doesn't support.", fr: "Le brouillon ne contient aucune affirmation que le contexte récupéré n'étaye pas." }
    - id: t2
      text: { en: "The agent's answer follows the tasks set by its system instructions.", fr: "La réponse de l'agent respecte les tâches fixées par ses instructions système." }
    - id: t3
      text: { en: "The draft gets a weighted score across several custom criteria, with reasoning for each criterion.", fr: "Le brouillon obtient un score pondéré sur plusieurs critères personnalisés, avec un raisonnement pour chaque critère." }
    - id: t4
      text: { en: "The draft includes all the critical information of a reference answer.", fr: "Le brouillon inclut toutes les informations essentielles d'une réponse de référence." }
answer:
  mapping: { t1: grounded, t2: adherence, t3: rubric, t4: completeness }
explanation:
  correct:
    en: "Groundedness checks that a response is grounded in the retrieved context. Task Adherence checks that an agent follows the tasks identified in its system instructions. Rubric scores a response against custom weighted criteria and returns per-dimension reasoning. Response Completeness measures whether the critical information of the ground truth appears in the response."
    fr: "Groundedness vérifie qu'une réponse est ancrée dans le contexte récupéré. Task Adherence vérifie qu'un agent suit les tâches identifiées dans ses instructions système. Rubric note une réponse selon des critères personnalisés pondérés et renvoie un raisonnement par dimension. Response Completeness mesure si les informations essentielles de la vérité terrain figurent dans la réponse."
  options:
    fluency: { en: "Fluency measures readability and language quality, not any of these checks.", fr: "Fluency mesure la lisibilité et la qualité de la langue, aucun de ces contrôles." }
    bleu: { en: "BLEU measures n-gram overlap with a reference, mainly for translation; it doesn't check for missing critical information.", fr: "BLEU mesure le recouvrement de n-grammes avec une référence, surtout pour la traduction ; il ne vérifie pas l'absence d'informations essentielles." }
references:
  - title: Built-in Evaluators Reference
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
