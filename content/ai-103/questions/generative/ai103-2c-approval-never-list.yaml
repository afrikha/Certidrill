id: ai103-2c-approval-never-list
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank adds a vendor's remote MCP server to a Foundry agent named treasury-agent. The server currently exposes 12 tools, and the vendor adds new tools every quarter. Only two tools, get_balance and list_transactions, are read-only.

    You need to configure the MCP tool so that get_balance and list_transactions run without approval, while every other tool, including tools that the vendor adds later, requires human approval. The agent must still be able to call the new tools after approval.

    Which value should you assign to `require_approval`?
  fr: |
    Woodgrove Bank ajoute le serveur MCP distant d'un éditeur à un agent Foundry nommé treasury-agent. Le serveur expose actuellement 12 outils, et l'éditeur en ajoute de nouveaux chaque trimestre. Seuls deux outils, get_balance et list_transactions, sont en lecture seule.

    Vous devez configurer l'outil MCP pour que get_balance et list_transactions s'exécutent sans approbation, tandis que tous les autres outils, y compris ceux que l'éditeur ajoutera plus tard, exigent une approbation humaine. L'agent doit toujours pouvoir appeler les nouveaux outils après approbation.

    Quelle valeur devez-vous affecter à `require_approval` ?
body:
  options:
    - { id: a, text: "`\"always\"`" }
    - { id: b, text: "`{\"always\": [<the 10 current tools other than get_balance and list_transactions>]}`" }
    - { id: c, text: "`{\"never\": [\"get_balance\", \"list_transactions\"]}`" }
    - { id: d, text: "`\"never\"`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `require_approval` accepts `always`, `never`, or an object that lists the tools for which approval is never or always required. `{"never": [...]}` exempts only the two read-only tools, so every other tool, including any tool that the vendor adds later, still requires approval.
    fr: |
      `require_approval` accepte `always`, `never` ou un objet qui liste les outils pour lesquels l'approbation n'est jamais ou toujours exigée. `{"never": [...]}` exempte uniquement les deux outils en lecture seule : tous les autres outils, y compris ceux que l'éditeur ajoutera plus tard, exigent toujours une approbation.
  options:
    a:
      en: |
        `always`, the default, also requires approval for get_balance and list_transactions.
      fr: |
        `always`, la valeur par défaut, exige aussi une approbation pour get_balance et list_transactions.
    b:
      en: |
        An `always` list covers only the tools that it names; tools that the vendor adds later wouldn't be in the list and would run without approval.
      fr: |
        Une liste `always` ne couvre que les outils qu'elle nomme ; les outils ajoutés plus tard par l'éditeur ne figureraient pas dans la liste et s'exécuteraient sans approbation.
    d:
      en: |
        `never` lets the agent call every tool, including write operations, without approval.
      fr: |
        `never` permet à l'agent d'appeler tous les outils, y compris les opérations d'écriture, sans approbation.
references:
  - title: Connect agents to Model Context Protocol servers
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
