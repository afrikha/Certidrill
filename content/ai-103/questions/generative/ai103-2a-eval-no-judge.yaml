id: ai103-2a-eval-no-judge
objective: "2.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys runs cloud evaluations in its Foundry project. The project's quota for GPT deployments is exhausted, so no deployment can be used as a judge model. The test dataset contains query, response, context and ground_truth columns.

    Which two evaluators can you still run?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys exécute des évaluations cloud dans son projet Foundry. Le quota du projet pour les déploiements GPT est épuisé : aucun déploiement ne peut servir de modèle juge. Le jeu de données de test contient les colonnes query, response, context et ground_truth.

    Quels sont les deux évaluateurs que vous pouvez quand même exécuter ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Similarity }
    - { id: b, text: Coherence }
    - { id: c, text: F1 Score }
    - { id: d, text: Relevance }
    - { id: e, text: Violence }
    - { id: f, text: Retrieval }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: F1 Score is an algorithmic evaluator that measures token overlap between the response and the ground truth, with no model call. Violence is a risk and safety evaluator that runs on Microsoft's hosted safety models in the Foundry evaluation service and needs no deployment_name.
    fr: F1 Score est un évaluateur algorithmique qui mesure le recouvrement de jetons entre la réponse et la réponse de référence, sans appel de modèle. Violence est un évaluateur de risque et de sécurité qui s'exécute sur les modèles de sécurité hébergés par Microsoft dans le service d'évaluation Foundry et ne nécessite aucun deployment_name.
  options:
    a:
      en: Similarity is the LLM-judged textual similarity evaluator; it requires a deployment_name.
      fr: Similarity est l'évaluateur de similarité textuelle jugé par un LLM ; il nécessite un deployment_name.
    b:
      en: Coherence is an LLM-as-judge evaluator that requires a deployment_name.
      fr: Coherence est un évaluateur de type LLM juge qui nécessite un deployment_name.
    d:
      en: Relevance takes a deployment_name for its judge model.
      fr: Relevance prend un deployment_name pour son modèle juge.
    f:
      en: Retrieval rates the retrieved chunks with an LLM judge and takes a deployment_name.
      fr: Retrieval note les blocs récupérés avec un LLM juge et prend un deployment_name.
references:
  - title: Textual similarity evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
