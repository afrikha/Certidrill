id: ai103-2c-eval-rule-code
objective: "2.2.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a Foundry agent named support-agent in production. You created an evaluation object named `eval_object` that runs the Task Adherence and Intent Resolution evaluators.

    You need to score completed responses of support-agent continuously. Evaluation runs must be limited to 250 per hour, and responses of the other agents in the project must not be evaluated.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un agent Foundry nommé support-agent en production. Vous avez créé un objet d'évaluation nommé `eval_object` qui exécute les évaluateurs Task Adherence et Intent Resolution.

    Vous devez noter en continu les réponses terminées de support-agent. Les exécutions d'évaluation doivent être limitées à 250 par heure, et les réponses des autres agents du projet ne doivent pas être évaluées.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    rule = project_client.[[coll]].create_or_update(
        id="support-agent-quality",
        evaluation_rule=EvaluationRule(
            display_name="Support agent quality",
            action=[[action]](eval_id=eval_object.id, max_hourly_runs=250),
            event_type=EvaluationRuleEventType.RESPONSE_COMPLETED,
            filter=EvaluationRuleFilter([[scope]]="support-agent"),
            enabled=True,
        ),
    )
  slots:
    - id: coll
      options:
        - { id: rules, text: evaluation_rules }
        - { id: evals, text: evals }
        - { id: agents, text: agents }
    - id: action
      options:
        - { id: continuous, text: ContinuousEvaluationRuleAction }
        - { id: filterclass, text: EvaluationRuleFilter }
        - { id: definition, text: PromptAgentDefinition }
    - id: scope
      options:
        - { id: displayname, text: display_name }
        - { id: agentname, text: agent_name }
        - { id: evalid, text: eval_id }
answer:
  values: { coll: rules, action: continuous, scope: agentname }
explanation:
  correct:
    en: |
      A continuous evaluation rule is created with `project_client.evaluation_rules.create_or_update`. Its action is a `ContinuousEvaluationRuleAction` that references the evaluation and sets `max_hourly_runs` (100 by default; runs beyond the limit are skipped). `EvaluationRuleEventType.RESPONSE_COMPLETED` triggers the rule when responses complete, and `EvaluationRuleFilter(agent_name=...)` limits it to one agent.
    fr: |
      Une règle d'évaluation continue est créée avec `project_client.evaluation_rules.create_or_update`. Son action est un `ContinuousEvaluationRuleAction` qui référence l'évaluation et définit `max_hourly_runs` (100 par défaut ; les exécutions au-delà de la limite sont ignorées). `EvaluationRuleEventType.RESPONSE_COMPLETED` déclenche la règle quand les réponses se terminent, et `EvaluationRuleFilter(agent_name=...)` la limite à un agent.
  options:
    evals:
      en: "`evals.create` on the OpenAI client creates the evaluation object itself, not the rule that runs it on production responses."
      fr: "`evals.create` sur le client OpenAI crée l'objet d'évaluation lui-même, pas la règle qui l'exécute sur les réponses de production."
    agents:
      en: "The agents collection creates and manages agent versions, not evaluation rules."
      fr: "La collection agents crée et gère les versions d'agent, pas les règles d'évaluation."
    filterclass:
      en: "`EvaluationRuleFilter` is the rule's filter, not its action."
      fr: "`EvaluationRuleFilter` est le filtre de la règle, pas son action."
    displayname:
      en: "`display_name` is the friendly name of the rule, not a filter on the agent."
      fr: "`display_name` est le nom convivial de la règle, pas un filtre sur l'agent."
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
