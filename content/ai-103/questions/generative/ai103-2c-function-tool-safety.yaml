id: ai103-2c-function-tool-safety
objective: "2.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a Foundry agent named crm-agent with a function tool named update_contact. The backend runs the function by using `DefaultAzureCredential`, and the function writes to the CRM database. The CRM API key is available to the function.

    You are reviewing the function code against the Microsoft Learn security recommendations for function tools. Which two practices should the code follow?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un agent Foundry nommé crm-agent doté d'un outil de fonction nommé update_contact. Le serveur principal exécute la fonction à l'aide de `DefaultAzureCredential`, et la fonction écrit dans la base de données CRM. La clé API du CRM est disponible pour la fonction.

    Vous examinez le code de la fonction au regard des recommandations de sécurité de Microsoft Learn pour les outils de fonction. Quelles sont les deux pratiques que le code doit suivre ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Return only the fields that the model needs, never the CRM API key.", fr: "Renvoyer uniquement les champs dont le modèle a besoin, jamais la clé API du CRM." } }
    - { id: b, text: { en: "Trust the arguments, because the model generated them from the schema.", fr: "Faire confiance aux arguments, car le modèle les a générés à partir du schéma." } }
    - { id: c, text: { en: "Ask the user to confirm the change before writing to the database.", fr: "Demander à l'utilisateur de confirmer la modification avant d'écrire dans la base de données." } }
    - { id: d, text: { en: "Run the credential as an identity with Owner on the subscription.", fr: "Exécuter les informations d'identification sous une identité Owner sur l'abonnement." } }
    - { id: e, text: { en: "Include the API key in the output so that the model can retry calls.", fr: "Inclure la clé API dans la sortie pour que le modèle puisse réessayer les appels." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Learn recommends not passing secrets such as API keys, tokens or connection strings in tool output and returning only the data the model needs. For functions with side effects, restrict them to safe operations or require explicit user confirmation for actions that change data.
    fr: |
      Learn recommande de ne pas transmettre de secrets tels que des clés API, des jetons ou des chaînes de connexion dans la sortie d'outil, et de ne renvoyer que les données dont le modèle a besoin. Pour les fonctions à effets de bord, limitez-les à des opérations sûres ou exigez une confirmation explicite de l'utilisateur pour les actions qui modifient des données.
  options:
    b:
      en: |
        Tool arguments are untrusted input: a prompt injection can steer them, so validate and sanitize them before use.
      fr: |
        Les arguments d'outil sont des entrées non fiables : une injection de prompt peut les orienter ; validez-les et nettoyez-les avant de les utiliser.
    d:
      en: |
        The identity used by `DefaultAzureCredential` should have the least privilege that the function needs.
      fr: |
        L'identité utilisée par `DefaultAzureCredential` doit avoir le moindre privilège nécessaire à la fonction.
    e:
      en: |
        Secrets must never be placed in tool output, where the model and the conversation history would see them.
      fr: |
        Les secrets ne doivent jamais figurer dans la sortie d'outil, où le modèle et l'historique de la conversation les verraient.
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling
