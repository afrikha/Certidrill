id: ai103-2d-usage-logging-code
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Litware's planning service calls an **o4-mini** deployment named **planner-o4** through the Responses API. You are adding token analytics to the service.

    You need to log a warning when a response is cut off, and to log the number of input tokens and the number of reasoning tokens of each response.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le service de planification de Litware appelle un déploiement **o4-mini** nommé **planner-o4** via l'API Responses. Vous ajoutez l'analytique des jetons au service.

    Vous devez journaliser un avertissement quand une réponse est interrompue, ainsi que le nombre de jetons d'entrée et le nombre de jetons de raisonnement de chaque réponse.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = openai_client.responses.create(model="planner-o4", input=request_text)

    if response.[[status]] == "incomplete":
        log_warning(response.incomplete_details.reason)

    log_metric("input_tokens", response.usage.[[inp]])
    log_metric("reasoning_tokens", response.usage.[[rsn]])
  slots:
    - id: status
      options:
        - { id: status, text: status }
        - { id: finish, text: finish_reason }
        - { id: text, text: output_text }
    - id: inp
      options:
        - { id: total, text: total_tokens }
        - { id: input, text: input_tokens }
        - { id: prompt, text: prompt_tokens }
    - id: rsn
      options:
        - { id: out, text: output_tokens }
        - { id: cc, text: completion_tokens_details.reasoning_tokens }
        - { id: resp, text: output_tokens_details.reasoning_tokens }
answer:
  values: { status: status, inp: input, rsn: resp }
explanation:
  correct:
    en: "A Responses API response that hits the token cap returns status incomplete with incomplete_details.reason, so check status on every response. Its usage object reports input_tokens, and the reasoning tokens appear in output_tokens_details.reasoning_tokens; they are billed as output tokens."
    fr: "Une réponse de l'API Responses qui atteint le plafond de jetons renvoie le statut incomplete avec incomplete_details.reason : vérifiez donc status sur chaque réponse. Son objet usage indique input_tokens, et les jetons de raisonnement figurent dans output_tokens_details.reasoning_tokens ; ils sont facturés comme des jetons de sortie."
  options:
    finish: { en: "finish_reason belongs to the choices of a Chat Completions response, not to a Responses API response.", fr: "finish_reason appartient aux choix d'une réponse Chat Completions, pas à une réponse de l'API Responses." }
    text: { en: "output_text holds the generated text, not the state of the response.", fr: "output_text contient le texte généré, pas l'état de la réponse." }
    total: { en: "total_tokens adds input and output tokens together.", fr: "total_tokens additionne les jetons d'entrée et de sortie." }
    prompt: { en: "prompt_tokens is the field name of the Chat Completions usage object.", fr: "prompt_tokens est le nom du champ de l'objet usage de Chat Completions." }
    out: { en: "output_tokens counts all output tokens, visible text included, not the reasoning tokens alone.", fr: "output_tokens compte tous les jetons de sortie, texte visible compris, pas seulement les jetons de raisonnement." }
    cc: { en: "completion_tokens_details is the Chat Completions form of the field.", fr: "completion_tokens_details est la forme Chat Completions de ce champ." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
