id: ai103-2d-critique-loop-code
objective: "2.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware Insurance writes a Python self-critique loop around a **gpt-4.1** deployment. The helper functions are already implemented:

    - `generate(question, passages)` returns a draft answer;
    - `critique(draft, evidence)` asks a second call to check the draft against the evidence and returns `{"passed": bool, "issues": [str]}`;
    - `revise(draft, issues, passages)` returns an improved draft.

    The loop must check each draft against the retrieved passages, stop as soon as a critique passes, and never exceed `MAX_ROUNDS` critique rounds.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware Insurance écrit en Python une boucle d'autocritique autour d'un déploiement **gpt-4.1**. Les fonctions utilitaires sont déjà implémentées :

    - `generate(question, passages)` renvoie un brouillon de réponse ;
    - `critique(draft, evidence)` demande à un second appel de vérifier le brouillon par rapport aux éléments fournis et renvoie `{"passed": bool, "issues": [str]}` ;
    - `revise(draft, issues, passages)` renvoie un brouillon amélioré.

    La boucle doit vérifier chaque brouillon par rapport aux extraits récupérés, s'arrêter dès qu'une critique réussit et ne jamais dépasser `MAX_ROUNDS` tours de critique.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    MAX_ROUNDS = 2

    draft = generate(question, passages)
    for _ in range([[rounds]]):
        verdict = critique(draft, [[evidence]])
        if [[stop]]:
            break
        draft = revise(draft, verdict["issues"], passages)

    return_answer(draft)
  slots:
    - id: rounds
      options:
        - { id: max, text: MAX_ROUNDS }
        - { id: lenp, text: len(passages) }
        - { id: lend, text: len(draft) }
    - id: evidence
      options:
        - { id: passages, text: passages }
        - { id: question, text: question }
        - { id: draft, text: draft }
    - id: stop
      options:
        - { id: passed, text: "verdict[\"passed\"]" }
        - { id: notpassed, text: "not verdict[\"passed\"]" }
        - { id: issues, text: "verdict[\"issues\"]" }
answer:
  values: { rounds: max, evidence: passages, stop: passed }
explanation:
  correct:
    en: "Iterating over range(MAX_ROUNDS) bounds the number of critique rounds, which caps the extra tokens and latency. The critique needs the retrieved passages to judge whether the draft is grounded. The loop breaks when the verdict passes; otherwise the draft is revised with the issues and critiqued again."
    fr: "Itérer sur range(MAX_ROUNDS) borne le nombre de tours de critique, ce qui plafonne les jetons et la latence supplémentaires. La critique a besoin des extraits récupérés pour juger si le brouillon est ancré. La boucle s'interrompt quand le verdict est positif ; sinon, le brouillon est révisé à l'aide des problèmes puis à nouveau critiqué."
  options:
    lenp: { en: "The number of passages has nothing to do with the round limit and can exceed MAX_ROUNDS.", fr: "Le nombre d'extraits n'a aucun rapport avec la limite de tours et peut dépasser MAX_ROUNDS." }
    lend: { en: "len(draft) is the length of the text in characters, which would allow hundreds of rounds.", fr: "len(draft) est la longueur du texte en caractères, ce qui autoriserait des centaines de tours." }
    question: { en: "The question alone doesn't let the critique check the draft against the sources.", fr: "La question seule ne permet pas à la critique de vérifier le brouillon par rapport aux sources." }
    draft: { en: "Checking the draft against itself can't reveal unsupported statements.", fr: "Vérifier le brouillon par rapport à lui-même ne peut pas révéler d'affirmations non étayées." }
    notpassed: { en: "This condition stops on a failed verdict and revises drafts that already passed.", fr: "Cette condition s'arrête sur un verdict d'échec et révise les brouillons déjà validés." }
    issues: { en: "A non-empty issue list means the draft failed, so the loop would stop exactly when a revision is needed.", fr: "Une liste de problèmes non vide signifie que le brouillon a échoué : la boucle s'arrêterait précisément quand une révision est nécessaire." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
