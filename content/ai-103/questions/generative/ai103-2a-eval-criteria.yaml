id: ai103-2a-eval-criteria
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders is configuring a cloud evaluation of its RAG application by using the Foundry SDK. Each item of the JSONL dataset has query, context and response fields. The evaluation must detect responses that contain claims not supported by the retrieved context, with a model deployment named **judge-mini** as the judge.

    How should you complete the testing criteria? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders configure une évaluation cloud de son application RAG à l'aide du SDK Foundry. Chaque élément du jeu de données JSONL contient les champs query, context et response. L'évaluation doit détecter les réponses qui contiennent des affirmations non étayées par le contexte récupéré, avec un déploiement de modèle nommé **judge-mini** comme juge.

    Comment devez-vous compléter les critères de test ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    testing_criteria = [
        {
            "type": "azure_ai_evaluator",
            "name": "groundedness",
            "evaluator_name": [[ev]],
            "initialization_parameters": {[[init]]: "judge-mini"},
            "data_mapping": {
                [[key]]: "{{item.context}}",
                "response": "{{item.response}}",
            },
        },
    ]
  slots:
    - id: ev
      options:
        - { id: rel, text: "\"builtin.relevance\"" }
        - { id: sim, text: "\"builtin.similarity\"" }
        - { id: grd, text: "\"builtin.groundedness\"" }
    - id: init
      options:
        - { id: dep, text: "\"deployment_name\"" }
        - { id: model, text: "\"model\"" }
        - { id: rouge, text: "\"rouge_type\"" }
    - id: key
      options:
        - { id: gt, text: "\"ground_truth\"" }
        - { id: ctx, text: "\"context\"" }
        - { id: query, text: "\"query\"" }
answer:
  values: { ev: grd, init: dep, key: ctx }
explanation:
  correct:
    en: The built-in groundedness evaluator (`builtin.groundedness`) detects fabricated content by comparing the response with the context. AI-assisted evaluators receive their judge model in `initialization_parameters` as `deployment_name`, and `data_mapping` binds the evaluator inputs, here `context` and `response`, to the dataset fields.
    fr: L'évaluateur intégré groundedness (`builtin.groundedness`) détecte le contenu inventé en comparant la réponse au contexte. Les évaluateurs assistés par IA reçoivent leur modèle juge dans `initialization_parameters` sous le nom `deployment_name`, et `data_mapping` relie les entrées de l'évaluateur, ici `context` et `response`, aux champs du jeu de données.
  options:
    rel: { en: "builtin.relevance checks whether the response addresses the query; it does not take a context.", fr: "builtin.relevance vérifie si la réponse traite la requête ; il ne prend pas de contexte." }
    sim: { en: "builtin.similarity compares the response with a ground truth answer, which the dataset does not have.", fr: "builtin.similarity compare la réponse à une réponse de référence, que le jeu de données ne contient pas." }
    model: { en: "The judge deployment is passed as deployment_name in the initialization parameters.", fr: "Le déploiement juge est passé sous le nom deployment_name dans les paramètres d'initialisation." }
    rouge: { en: "rouge_type is the initialization parameter of the ROUGE evaluator.", fr: "rouge_type est le paramètre d'initialisation de l'évaluateur ROUGE." }
    gt: { en: "ground_truth is the input of evaluators that compare with a reference answer; groundedness uses context.", fr: "ground_truth est l'entrée des évaluateurs qui comparent à une réponse de référence ; groundedness utilise context." }
    query: { en: "The retrieved passages must be mapped to context, not to query.", fr: "Les passages récupérés doivent être associés à context, pas à query." }
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
