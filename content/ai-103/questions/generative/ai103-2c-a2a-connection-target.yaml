id: ai103-2c-a2a-connection-target
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Foundry account named contoso-ai. A project named claims contains an agent named claims-agent. A project named fraud contains an agent named fraud-agent, on which incoming A2A is enabled.

    You are adding an A2A tool to claims-agent so that it can call fraud-agent. You create an A2A project connection in claims that authenticates with Microsoft Entra ID.

    Which target and audience should you configure in the connection?
  fr: |
    Contoso, Ltd. dispose d'un compte Foundry nommé contoso-ai. Un projet nommé claims contient un agent nommé claims-agent. Un projet nommé fraud contient un agent nommé fraud-agent, sur lequel l'A2A entrant est activé.

    Vous ajoutez un outil A2A à claims-agent pour qu'il puisse appeler fraud-agent. Vous créez dans claims une connexion de projet A2A qui s'authentifie avec Microsoft Entra ID.

    Quelles cible et audience devez-vous configurer dans la connexion ?
body:
  options:
    - id: a
      text:
        en: "Target: `https://contoso-ai.services.ai.azure.com/api/projects/fraud/agents/fraud-agent/endpoint/protocols/a2a`; audience: `https://ai.azure.com`"
        fr: "Cible : `https://contoso-ai.services.ai.azure.com/api/projects/fraud/agents/fraud-agent/endpoint/protocols/a2a` ; audience : `https://ai.azure.com`"
    - id: b
      text:
        en: "Target: `https://contoso-ai.services.ai.azure.com/api/projects/fraud`; audience: `https://ai.azure.com`"
        fr: "Cible : `https://contoso-ai.services.ai.azure.com/api/projects/fraud` ; audience : `https://ai.azure.com`"
    - id: c
      text:
        en: "Target: `https://contoso-ai.services.ai.azure.com/api/projects/fraud/agents/fraud-agent/endpoint/protocols/a2a`; audience: `https://management.azure.com`"
        fr: "Cible : `https://contoso-ai.services.ai.azure.com/api/projects/fraud/agents/fraud-agent/endpoint/protocols/a2a` ; audience : `https://management.azure.com`"
    - id: d
      text:
        en: "Target: `https://contoso-ai.services.ai.azure.com/api/projects/claims/agents/claims-agent/endpoint/protocols/a2a`; audience: `https://ai.azure.com`"
        fr: "Cible : `https://contoso-ai.services.ai.azure.com/api/projects/claims/agents/claims-agent/endpoint/protocols/a2a` ; audience : `https://ai.azure.com`"
answer: { optionId: a }
explanation:
  correct:
    en: |
      For a Foundry agent target, the connection points to the A2A base path of the target agent, `https://{account}.services.ai.azure.com/api/projects/{project}/agents/{agent}/endpoint/protocols/a2a`, with the audience `https://ai.azure.com`. You don't set an agent card path: Foundry resolves the default agent card path automatically.
    fr: |
      Pour un agent Foundry cible, la connexion pointe vers le chemin de base A2A de l'agent cible, `https://{account}.services.ai.azure.com/api/projects/{project}/agents/{agent}/endpoint/protocols/a2a`, avec l'audience `https://ai.azure.com`. Vous ne définissez pas de chemin de carte d'agent : Foundry résout automatiquement le chemin par défaut de la carte d'agent.
  options:
    b:
      en: |
        The project endpoint doesn't identify the agent to call; the target must be the agent's A2A base path.
      fr: |
        Le point de terminaison du projet n'identifie pas l'agent à appeler ; la cible doit être le chemin de base A2A de l'agent.
    c:
      en: |
        A token for Azure Resource Manager isn't accepted by the Foundry agent endpoint, whose audience is `https://ai.azure.com`.
      fr: |
        Un jeton pour Azure Resource Manager n'est pas accepté par le point de terminaison de l'agent Foundry, dont l'audience est `https://ai.azure.com`.
    d:
      en: |
        This is the A2A path of the calling agent itself, not of fraud-agent.
      fr: |
        Il s'agit du chemin A2A de l'agent appelant lui-même, pas de fraud-agent.
references:
  - title: Connect to an A2A agent endpoint from Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent
