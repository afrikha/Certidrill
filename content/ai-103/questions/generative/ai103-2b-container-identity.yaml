id: ai103-2b-container-identity
objective: "2.1.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is deploying a Python application to Azure Container Apps. The application calls model deployments in a Foundry project named ops-prj. It must authenticate without any key and succeed the first time it starts.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders déploie une application Python dans Azure Container Apps. L'application appelle des déploiements de modèles dans un projet Foundry nommé ops-prj. Elle doit s'authentifier sans aucune clé et réussir dès son premier démarrage.

    Quelles sont les trois actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: mi
      text:
        en: |
          Enable a system-assigned managed identity on the container app.
        fr: |
          Activer une identité managée affectée par le système sur l'application conteneur.
    - id: role
      text:
        en: |
          Assign the Foundry User role on ops-prj to the managed identity.
        fr: |
          Attribuer le rôle Foundry User sur ops-prj à l'identité managée.
    - id: deploy
      text:
        en: |
          Deploy the code that creates AIProjectClient with DefaultAzureCredential and the project endpoint read from configuration.
        fr: |
          Déployer le code qui crée AIProjectClient avec DefaultAzureCredential et le point de terminaison du projet lu dans la configuration.
    - id: key
      text:
        en: |
          Store the API key of the Foundry resource as a secret of the container app.
        fr: |
          Stocker la clé API de la ressource Foundry comme secret de l'application conteneur.
    - id: login
      text:
        en: |
          Run az login in the container image during the build.
        fr: |
          Exécuter az login dans l'image conteneur pendant la génération.
    - id: owner
      text:
        en: |
          Assign the Foundry Account Owner role on the subscription to the managed identity.
        fr: |
          Attribuer le rôle Foundry Account Owner sur l'abonnement à l'identité managée.
answer:
  sequence: [ mi, role, deploy ]
explanation:
  correct:
    en: |
      The managed identity must exist before a role can be assigned to it. The Foundry User role on the project grants the data actions needed to call the deployments. Once the role is in place, the deployed code authenticates through `DefaultAzureCredential`, which uses the managed identity in Azure.
    fr: |
      L'identité managée doit exister avant qu'un rôle puisse lui être attribué. Le rôle Foundry User sur le projet accorde les actions de données nécessaires pour appeler les déploiements. Une fois le rôle en place, le code déployé s'authentifie via `DefaultAzureCredential`, qui utilise l'identité managée dans Azure.
  options:
    key:
      en: |
        A stored API key breaks the keyless requirement.
      fr: |
        Une clé API stockée enfreint l'exigence sans clé.
    login:
      en: |
        Baking a developer sign-in into an image is neither keyless nor secure; in Azure the managed identity is used.
      fr: |
        Intégrer une connexion de développeur dans une image n'est ni sans clé ni sécurisé ; dans Azure, c'est l'identité managée qui est utilisée.
    owner:
      en: |
        Foundry Account Owner doesn't grant the data actions needed to call models, and the subscription scope is far too broad.
      fr: |
        Foundry Account Owner n'accorde pas les actions de données nécessaires pour appeler des modèles, et l'étendue de l'abonnement est beaucoup trop large.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
