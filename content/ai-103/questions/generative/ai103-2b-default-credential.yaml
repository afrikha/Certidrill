id: ai103-2b-default-credential
objective: "2.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is writing a Python application that creates an `AIProjectClient` with `DefaultAzureCredential()`. Developers run the application on their workstations during development, and it will run in an Azure App Service app that has a system-assigned managed identity in production.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. écrit une application Python qui crée un `AIProjectClient` avec `DefaultAzureCredential()`. Les développeurs exécutent l'application sur leurs postes de travail pendant le développement, et elle s'exécutera en production dans une application Azure App Service dotée d'une identité managée affectée par le système.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          On a workstation, DefaultAzureCredential can authenticate the application with the account that the developer signed in with by running az login.
        fr: |
          Sur un poste de travail, DefaultAzureCredential peut authentifier l'application avec le compte auquel le développeur s'est connecté en exécutant az login.
    - id: s2
      text:
        en: |
          In the App Service app, the same code can authenticate with the managed identity of the app without any code change.
        fr: |
          Dans l'application App Service, le même code peut s'authentifier avec l'identité managée de l'application sans aucune modification du code.
    - id: s3
      text:
        en: |
          AIProjectClient also accepts an AzureKeyCredential that contains the API key of the Foundry resource.
        fr: |
          AIProjectClient accepte aussi un AzureKeyCredential qui contient la clé API de la ressource Foundry.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      `DefaultAzureCredential` tries several credential sources in turn: locally it can use the Azure CLI session created by `az login`, and in Azure it uses the managed identity of the hosting service, so the same code works in both places. The constructor of AIProjectClient takes a `TokenCredential`; API keys work only on the `/openai/v1` endpoint with the OpenAI client.
    fr: |
      `DefaultAzureCredential` essaie plusieurs sources d'informations d'identification tour à tour : en local, il peut utiliser la session Azure CLI créée par `az login`, et dans Azure, il utilise l'identité managée du service d'hébergement : le même code fonctionne donc aux deux endroits. Le constructeur d'AIProjectClient attend un `TokenCredential` ; les clés API ne fonctionnent que sur le point de terminaison `/openai/v1` avec le client OpenAI.
references:
  - title: azure.ai.projects.AIProjectClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.aiprojectclient
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
