id: ai103-2c-evaluator-inputs
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Foundry agent named store-agent. store-agent uses the Azure AI Search tool to answer from product manuals and a function tool named reserve_item. You are designing the evaluation of store-agent with the built-in agent evaluators.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'un agent Foundry nommé store-agent. store-agent utilise l'outil Azure AI Search pour répondre à partir des manuels produits et un outil de fonction nommé reserve_item. Vous concevez l'évaluation de store-agent avec les évaluateurs d'agent intégrés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Tool Call Accuracy gives reliable results for conversations in which store-agent calls the Azure AI Search tool.
        fr: Tool Call Accuracy donne des résultats fiables pour les conversations dans lesquelles store-agent appelle l'outil Azure AI Search.
    - id: s2
      text:
        en: To use Task Navigation Efficiency, the test dataset must contain the expected sequence of actions for each item.
        fr: Pour utiliser Task Navigation Efficiency, le jeu de données de test doit contenir la séquence d'actions attendue pour chaque élément.
    - id: s3
      text:
        en: To evaluate tool calls from the agent's run rather than from the dataset, the data mapping references `{{sample.output_items}}`.
        fr: Pour évaluer les appels d'outil issus de l'exécution de l'agent plutôt que du jeu de données, le mappage de données référence `{{sample.output_items}}`.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Learn advises avoiding Tool Call Accuracy, Tool Input Accuracy, Tool Output Utilization, Tool Call Success and Groundedness when the conversation includes calls to Azure AI Search, Bing grounding, code interpreter, web search and similar built-in tools. Task Navigation Efficiency compares the actions with `expected_actions`, a ground truth that the dataset must provide. `{{item.field}}` references the test dataset, while `{{sample.output_items}}` references the agent's structured output, including tool calls and results.
    fr: |
      Learn conseille d'éviter Tool Call Accuracy, Tool Input Accuracy, Tool Output Utilization, Tool Call Success et Groundedness quand la conversation comporte des appels à Azure AI Search, Bing grounding, l'interpréteur de code, la recherche web et d'autres outils intégrés similaires. Task Navigation Efficiency compare les actions à `expected_actions`, une vérité de terrain que le jeu de données doit fournir. `{{item.field}}` référence le jeu de données de test, tandis que `{{sample.output_items}}` référence la sortie structurée de l'agent, y compris les appels d'outil et leurs résultats.
references:
  - title: Agent evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators
