id: ai103-2b-no-stored-responses
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank is building a multi-turn assistant that calls a chat model deployment directly through the Responses API, without an agent. A compliance rule states that the service must not persist any response or conversation history. The assistant must still answer follow-up questions in context.

    What should you do?
  fr: |
    Woodgrove Bank crée un assistant à plusieurs tours qui appelle directement un déploiement de modèle de conversation via l'API Responses, sans agent. Une règle de conformité impose que le service ne conserve aucune réponse ni aucun historique de conversation. L'assistant doit tout de même répondre aux questions de suivi dans leur contexte.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a conversation with conversations.create(), and pass its ID in each request", fr: "Créer une conversation avec conversations.create(), et passer son ID dans chaque requête" } }
    - { id: b, text: { en: "Set store to false, and pass previous_response_id with the ID of the last response in each request", fr: "Définir store sur false, et passer previous_response_id avec l'ID de la dernière réponse dans chaque requête" } }
    - { id: c, text: { en: "Set store to false, and pass the earlier input and output items with the new message as the input of each request", fr: "Définir store sur false, et passer les éléments d'entrée et de sortie précédents avec le nouveau message comme entrée de chaque requête" } }
    - { id: d, text: { en: "Keep the default settings, and pass previous_response_id with the ID of the last response in each request", fr: "Conserver les paramètres par défaut, et passer previous_response_id avec l'ID de la dernière réponse dans chaque requête" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      By default, the service stores response history so that `previous_response_id` can reference it. With `store=False`, the service doesn't persist the response, and the application must carry the context forward itself by passing the previous output items as input to the next request.
    fr: |
      Par défaut, le service stocke l'historique des réponses pour que `previous_response_id` puisse y faire référence. Avec `store=False`, le service ne conserve pas la réponse, et l'application doit reporter elle-même le contexte en passant les éléments de sortie précédents comme entrée de la requête suivante.
  options:
    a: { en: "A conversation is a durable object that stores the items on the service, which the rule forbids.", fr: "Une conversation est un objet durable qui stocke les éléments sur le service, ce que la règle interdit." }
    b: { en: "previous_response_id references a stored response; with store set to false, there is nothing to reference.", fr: "previous_response_id fait référence à une réponse stockée ; avec store défini sur false, il n'y a rien à référencer." }
    d: { en: "With the default settings, the service stores the response history, which the rule forbids.", fr: "Avec les paramètres par défaut, le service stocke l'historique des réponses, ce que la règle interdit." }
references:
  - title: Build with runtime components in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
