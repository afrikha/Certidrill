id: ai103-2a-rag-vs-tuning
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is building an HR assistant in a Foundry project. The assistant must answer employee questions from about 4,000 HR policy documents that are updated every week, and each answer must cite the source document.

    What should you implement?
  fr: |
    Northwind Traders développe un assistant RH dans un projet Foundry. L'assistant doit répondre aux questions des employés à partir d'environ 4 000 documents de stratégie RH mis à jour chaque semaine, et chaque réponse doit citer le document source.

    Que devez-vous implémenter ?
body:
  options:
    - { id: a, text: { en: "Fine-tune the chat model on the policy documents every week", fr: "Affiner le modèle de conversation sur les documents de stratégie chaque semaine" } }
    - { id: b, text: { en: "Set the temperature of the chat model to 0", fr: "Régler la température du modèle de conversation sur 0" } }
    - { id: c, text: { en: "Retrieval-augmented generation over an Azure AI Search index of the policies", fr: "La génération augmentée de récupération sur un index Azure AI Search des stratégies" } }
    - { id: d, text: { en: "A reasoning model deployment with a high reasoning effort", fr: "Un déploiement de modèle de raisonnement avec un effort de raisonnement élevé" } }
answer: { optionId: c }
explanation:
  correct:
    en: RAG retrieves relevant passages from an index, adds them to the prompt and lets the model answer from them, which keeps answers current as documents change and enables citations. Azure AI Search is a recommended index store for RAG, and indexing a title or URL field makes citations useful.
    fr: Le RAG récupère les passages pertinents dans un index, les ajoute à l'invite et laisse le modèle y puiser sa réponse ; les réponses restent à jour quand les documents changent et les citations deviennent possibles. Azure AI Search est un magasin d'index recommandé pour le RAG, et l'indexation d'un champ titre ou URL rend les citations utiles.
  options:
    a:
      en: Fine-tuning changes the behavior, style or task performance of a model; it is not the way to add knowledge that changes every week, and it gives no source to cite.
      fr: L'affinage modifie le comportement, le style ou la performance d'un modèle sur une tâche ; ce n'est pas le moyen d'ajouter des connaissances qui changent chaque semaine, et il ne fournit aucune source à citer.
    b:
      en: A lower temperature makes the output more deterministic but gives the model no access to the policies.
      fr: Une température plus basse rend la sortie plus déterministe, mais ne donne pas au modèle accès aux stratégies.
    d:
      en: More reasoning does not give the model the content of private documents it has never seen.
      fr: Davantage de raisonnement ne donne pas au modèle le contenu de documents privés qu'il n'a jamais vus.
references:
  - title: Retrieval augmented generation (RAG) and indexes
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation
