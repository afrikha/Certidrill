id: ai103-cs2c-allergen-agent
objective: "2.2.4"
type: single
caseStudy: ai103-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the allergens requirement. What should you add to order-agent?
  fr: |
    Vous devez satisfaire l'exigence relative aux allergènes. Que devez-vous ajouter à order-agent ?
body:
  options:
    - id: a
      text:
        en: |
          An `A2APreviewTool` that uses the allergen-a2a connection
        fr: |
          Un `A2APreviewTool` qui utilise la connexion allergen-a2a
    - id: b
      text:
        en: |
          A connected agent that references allergen-agent
        fr: |
          Un agent connecté qui référence allergen-agent
    - id: c
      text:
        en: |
          A Foundry workflow that uses the group chat pattern with allergen-agent
        fr: |
          Un workflow Foundry qui utilise le schéma de conversation de groupe avec allergen-agent
    - id: d
      text:
        en: |
          An `A2ATool` that uses the allergen-a2a connection
        fr: |
          Un `A2ATool` qui utilise la connexion allergen-a2a
answer: { optionId: d }
explanation:
  correct:
    en: |
      The A2A tool lets a Foundry agent call a remote agent through an A2A endpoint: the remote agent processes the request, and the calling agent uses the response and keeps managing the conversation with the user. `A2ATool` targets the A2A protocol 1.0 and is generally available; it references the project connection by its ID (`project.connections.get("allergen-a2a").id`).
    fr: |
      L'outil A2A permet à un agent Foundry d'appeler un agent distant par un point de terminaison A2A : l'agent distant traite la requête, et l'agent appelant utilise la réponse et continue de gérer la conversation avec l'utilisateur. `A2ATool` cible le protocole A2A 1.0 et est en disponibilité générale ; il référence la connexion de projet par son ID (`project.connections.get("allergen-a2a").id`).
  options:
    a:
      en: |
        `A2APreviewTool` targets the A2A protocol 0.3 and is in preview, which the requirement excludes; allergen-agent exposes A2A 1.0.
      fr: |
        `A2APreviewTool` cible le protocole A2A 0.3 et est en préversion, ce que l'exigence exclut ; allergen-agent expose A2A 1.0.
    b:
      en: |
        Connected agents belong to the classic Agents API and aren't available in the current Foundry Agent Service, which hosts order-agent.
      fr: |
        Les agents connectés appartiennent à l'API Agents classique et ne sont pas disponibles dans le Foundry Agent Service actuel, qui héberge order-agent.
    c:
      en: |
        Foundry workflows are in preview (and the visual designer is being retired); a workflow also orchestrates both agents instead of letting order-agent keep control of the conversation.
      fr: |
        Les workflows Foundry sont en préversion (et le concepteur visuel est en cours de mise hors service) ; un workflow orchestre aussi les deux agents au lieu de laisser order-agent garder le contrôle de la conversation.
references:
  - title: Connect to an A2A agent endpoint from Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/agent-to-agent
