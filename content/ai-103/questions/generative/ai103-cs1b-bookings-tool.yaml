id: ai103-cs1b-bookings-tool
objective: "2.2.3"
type: single
caseStudy: ai103-cs1b-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You need to give concierge-agent the ability to create bookings. The solution must meet the bookings requirement. What should you add to concierge-agent?
  fr: |
    Vous devez permettre à concierge-agent de créer des réservations. La solution doit satisfaire l'exigence relative aux réservations. Que devez-vous ajouter à concierge-agent ?
body:
  options:
    - { id: a, text: { en: "A function calling tool whose function definitions match the operations of bookings-api", fr: "Un outil d'appel de fonction dont les définitions de fonctions correspondent aux opérations de bookings-api" } }
    - { id: b, text: { en: "An OpenAPI tool that uses a project connection with an API key for bookings-api", fr: "Un outil OpenAPI qui utilise une connexion de projet avec une clé API pour bookings-api" } }
    - { id: c, text: { en: "An OpenAPI tool that uses a project connection with the project managed identity", fr: "Un outil OpenAPI qui utilise une connexion de projet avec l'identité managée du projet" } }
    - { id: d, text: { en: "An MCP tool whose server URL is the base URL of bookings-api", fr: "Un outil MCP dont l'URL de serveur est l'URL de base de bookings-api" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The OpenAPI tool lets the agent call a REST API described by an OpenAPI 3.0 or 3.1 specification, and Foundry makes the call. A connection with the `ProjectManagedIdentity` authentication type uses the managed identity of the Foundry project, so no key is stored; you grant that identity access to bookings-api.
    fr: |
      L'outil OpenAPI permet à l'agent d'appeler une API REST décrite par une spécification OpenAPI 3.0 ou 3.1, et c'est Foundry qui effectue l'appel. Une connexion avec le type d'authentification `ProjectManagedIdentity` utilise l'identité managée du projet Foundry : aucune clé n'est stockée ; vous accordez à cette identité l'accès à bookings-api.
  options:
    a:
      en: |
        With function calling, the model only returns the function name and arguments; your client code must run the function, which the requirement rules out.
      fr: |
        Avec l'appel de fonction, le modèle renvoie seulement le nom et les arguments de la fonction ; votre code client doit exécuter la fonction, ce que l'exigence exclut.
    b:
      en: |
        An API key connection works with the OpenAPI tool, but it stores a key, and bookings-api uses Microsoft Entra ID authentication.
      fr: |
        Une connexion par clé API fonctionne avec l'outil OpenAPI, mais elle stocke une clé, et bookings-api utilise l'authentification Microsoft Entra ID.
    d:
      en: |
        The MCP tool connects to an MCP server endpoint; bookings-api is a REST API, not an MCP server.
      fr: |
        L'outil MCP se connecte au point de terminaison d'un serveur MCP ; bookings-api est une API REST, pas un serveur MCP.
references:
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
