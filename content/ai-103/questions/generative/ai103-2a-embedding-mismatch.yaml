id: ai103-2a-embedding-mismatch
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware indexes its product documentation in Azure AI Search. An indexer skillset uses the AzureOpenAIEmbedding skill with a **text-embedding-3-small** deployment to fill a vector field named contentVector. The index has no vectorizer.

    A developer's RAG code computes the query vector with an existing **text-embedding-ada-002** deployment, which also returns 1,536 dimensions, and sends a vector query of kind vector. The queries run without errors, but the returned chunks are mostly unrelated to the questions.

    You need to fix the retrieval. What should you do?
  fr: |
    Litware indexe sa documentation produit dans Azure AI Search. Un ensemble de compétences d'indexeur utilise la compétence AzureOpenAIEmbedding avec un déploiement **text-embedding-3-small** pour alimenter un champ vectoriel nommé contentVector. L'index n'a pas de vectoriseur.

    Le code RAG d'un développeur calcule le vecteur de la requête avec un déploiement **text-embedding-ada-002** existant, qui renvoie lui aussi 1 536 dimensions, et envoie une requête vectorielle de type vector. Les requêtes s'exécutent sans erreur, mais les blocs renvoyés sont pour la plupart sans rapport avec les questions.

    Vous devez corriger la récupération. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase k in the vector query to 50.", fr: "Augmenter k à 50 dans la requête vectorielle." } }
    - { id: b, text: { en: "Set exhaustive to true in the vector query.", fr: "Définir exhaustive sur true dans la requête vectorielle." } }
    - { id: c, text: { en: "Add semantic ranking to the vector query.", fr: "Ajouter le classement sémantique à la requête vectorielle." } }
    - { id: d, text: { en: "Compute the query vector with the text-embedding-3-small deployment.", fr: "Calculer le vecteur de la requête avec le déploiement text-embedding-3-small." } }
answer: { optionId: d }
explanation:
  correct:
    en: A query vector is only comparable with the indexed vectors when both come from the same embedding model. Vectors from two different models can have the same number of dimensions and still live in unrelated spaces, so the similarity scores are meaningless until the query uses text-embedding-3-small too.
    fr: |
      Un vecteur de requête n'est comparable aux vecteurs indexés que si les deux proviennent du même modèle d'embedding. Les vecteurs de deux modèles différents peuvent avoir le même nombre de dimensions tout en appartenant à des espaces sans rapport : les scores de similarité n'ont aucun sens tant que la requête n'utilise pas elle aussi text-embedding-3-small.
  options:
    a:
      en: Returning more neighbors from a mismatched vector space only returns more unrelated chunks.
      fr: Renvoyer davantage de voisins depuis un espace vectoriel incompatible ne renvoie que davantage de blocs sans rapport.
    b:
      en: Exhaustive KNN finds the exact nearest neighbors, but they are still computed from an incompatible query vector.
      fr: Le KNN exhaustif trouve les plus proches voisins exacts, mais ils restent calculés à partir d'un vecteur de requête incompatible.
    c:
      en: Semantic ranking reranks only the top results; it cannot recover relevant chunks that the vector query never returned.
      fr: Le classement sémantique ne reclasse que les premiers résultats ; il ne peut pas retrouver des blocs pertinents que la requête vectorielle n'a jamais renvoyés.
references:
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
