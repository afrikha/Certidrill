id: ai103-2d-reasoning-budget-facts
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware's analysts call an **o4-mini** deployment through the Responses API with `max_output_tokens` set to 2000. Some responses return `"status": "incomplete"` with `"incomplete_details": { "reason": "max_output_tokens" }` and no visible text.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les analystes de Litware appellent un déploiement **o4-mini** via l'API Responses avec `max_output_tokens` défini sur 2000. Certaines réponses renvoient `"status": "incomplete"` avec `"incomplete_details": { "reason": "max_output_tokens" }` et aucun texte visible.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The 2,000-token cap applies to the reasoning tokens as well as to the visible output tokens."
        fr: "Le plafond de 2 000 jetons s'applique aux jetons de raisonnement aussi bien qu'aux jetons de sortie visibles."
    - id: s2
      text:
        en: "Litware isn't billed for the reasoning tokens of a response that ends incomplete before producing any visible output."
        fr: "Litware n'est pas facturé pour les jetons de raisonnement d'une réponse qui se termine incomplète avant de produire une sortie visible."
    - id: s3
      text:
        en: "Raising max_output_tokens to a generous value, such as 25,000, while the workload's typical reasoning usage is measured is a recommended first step."
        fr: "Augmenter max_output_tokens jusqu'à une valeur généreuse, par exemple 25 000, le temps de mesurer la consommation habituelle de raisonnement de la charge de travail est une première étape recommandée."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      With the Responses API, max_output_tokens caps everything the model generates, reasoning tokens included, so the budget can be spent before any visible text appears. In that case you still pay for the input and reasoning tokens, because reasoning tokens are billed as output tokens. Learn recommends reserving at least 25,000 tokens for reasoning and output while you learn a workload, then tuning the buffer.
    fr: |
      Avec l'API Responses, max_output_tokens plafonne tout ce que le modèle génère, jetons de raisonnement compris : le budget peut donc être épuisé avant qu'un texte visible n'apparaisse. Dans ce cas, vous payez tout de même les jetons d'entrée et de raisonnement, car les jetons de raisonnement sont facturés comme des jetons de sortie. Learn recommande de réserver au moins 25 000 jetons au raisonnement et à la sortie le temps de découvrir une charge de travail, puis d'ajuster cette marge.
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
