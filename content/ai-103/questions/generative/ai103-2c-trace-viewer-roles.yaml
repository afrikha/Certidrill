id: ai103-2c-trace-viewer-roles
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a Foundry project that is connected to an Application Insights resource named appi-agents. The Log Analytics tables behind appi-agents are protected.

    A support engineer named Engineer1 must investigate failed agent runs by opening traces on the Traces page of the Foundry portal. Engineer1 already has access to the project but receives authorization errors on the Traces page.

    Which two roles should you assign to Engineer1? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un projet Foundry connecté à une ressource Application Insights nommée appi-agents. Les tables Log Analytics derrière appi-agents sont protégées.

    Un ingénieur du support nommé Engineer1 doit enquêter sur des exécutions d'agent en échec en ouvrant les traces dans la page Traces du portail Foundry. Engineer1 a déjà accès au projet, mais reçoit des erreurs d'autorisation dans la page Traces.

    Quels sont les deux rôles à attribuer à Engineer1 ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Foundry Agent Consumer }
    - { id: b, text: Log Analytics Reader }
    - { id: c, text: Monitoring Contributor }
    - { id: d, text: Privileged Monitoring Data Reader }
    - { id: e, text: Storage Blob Data Reader }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Traces are stored in the connected Application Insights resource. To read them, assign the Log Analytics Reader role on that resource; when the Log Analytics tables are protected, also assign Privileged Monitoring Data Reader.
    fr: |
      Les traces sont stockées dans la ressource Application Insights connectée. Pour les lire, attribuez le rôle Log Analytics Reader sur cette ressource ; quand les tables Log Analytics sont protégées, attribuez aussi Privileged Monitoring Data Reader.
  options:
    a:
      en: |
        Foundry Agent Consumer lets an identity call agents; it doesn't grant access to telemetry in Application Insights.
      fr: |
        Foundry Agent Consumer permet à une identité d'appeler des agents ; il ne donne pas accès à la télémétrie dans Application Insights.
    c:
      en: |
        Monitoring Contributor isn't one of the roles listed for reading agent traces, and it grants write permissions on monitoring settings that the engineer doesn't need.
      fr: |
        Monitoring Contributor ne fait pas partie des rôles indiqués pour lire les traces d'agent, et il accorde des autorisations d'écriture sur les paramètres de surveillance dont l'ingénieur n'a pas besoin.
    e:
      en: |
        Traces aren't read from a storage account but from Application Insights and Log Analytics.
      fr: |
        Les traces ne sont pas lues dans un compte de stockage, mais dans Application Insights et Log Analytics.
references:
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
