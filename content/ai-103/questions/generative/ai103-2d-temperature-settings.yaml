id: ai103-2d-temperature-settings
objective: "2.3.1"
type: dropdown
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys uses two **gpt-4.1** deployments through Chat Completions:

    - **policy-summary** summarizes warranty terms for customers and must stay factual and focused;
    - **slogan-studio** proposes varied marketing slogans for new toys.

    You plan to tune only one sampling parameter per deployment, as Learn recommends. How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise deux déploiements **gpt-4.1** via Chat Completions :

    - **policy-summary** résume les conditions de garantie pour les clients et doit rester factuel et ciblé ;
    - **slogan-studio** propose des slogans marketing variés pour les nouveaux jouets.

    Vous prévoyez d'ajuster un seul paramètre d'échantillonnage par déploiement, comme le recommande Learn. Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For policy-summary, set temperature to [[t1]].
      For slogan-studio, set temperature to [[t2]].
      On both deployments, leave [[keep]] at its default value.
    fr: |
      Pour policy-summary, définir temperature sur [[t1]].
      Pour slogan-studio, définir temperature sur [[t2]].
      Sur les deux déploiements, laisser [[keep]] à sa valeur par défaut.
  slots:
    - id: t1
      options:
        - { id: v02, text: "0.2" }
        - { id: v07, text: "0.7" }
        - { id: v20, text: "2.0" }
    - id: t2
      options:
        - { id: v02, text: "0.2" }
        - { id: v07, text: "0.7" }
        - { id: v20, text: "2.0" }
    - id: keep
      options:
        - { id: maxtok, text: max_completion_tokens }
        - { id: topp, text: top_p }
        - { id: stop, text: stop }
answer:
  values: { t1: v02, t2: v07, keep: topp }
explanation:
  correct:
    en: "Temperature ranges from 0 to 2. A low value such as 0.2 makes the output focused and concrete for factual summaries, and a higher value such as 0.7 makes it more varied for creative text. top_p also controls randomness, so Learn recommends changing one of the two parameters, not both."
    fr: "Temperature va de 0 à 2. Une valeur basse comme 0,2 rend la sortie ciblée et concrète pour des synthèses factuelles, et une valeur plus élevée comme 0,7 la rend plus variée pour un texte créatif. top_p contrôle aussi le caractère aléatoire : Learn recommande donc de modifier l'un des deux paramètres, pas les deux."
  options:
    v20: { en: "2.0 is the maximum and produces highly random output, unsuitable for usable slogans or factual summaries.", fr: "2,0 est le maximum et produit une sortie très aléatoire, inadaptée à des slogans exploitables comme à des synthèses factuelles." }
    maxtok: { en: "max_completion_tokens caps the length; it isn't a sampling parameter that competes with temperature.", fr: "max_completion_tokens plafonne la longueur ; ce n'est pas un paramètre d'échantillonnage concurrent de temperature." }
    stop: { en: "stop defines stop sequences; it doesn't control randomness.", fr: "stop définit des séquences d'arrêt ; il ne contrôle pas le caractère aléatoire." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
