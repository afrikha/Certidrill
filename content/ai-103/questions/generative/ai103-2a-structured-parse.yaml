id: ai103-2a-structured-parse
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso Insurance is building a multistep pipeline. The first step extracts claim details from an email by using a deployment named **extract-chat** and the Responses API with OpenAI Python 2.x. The next step of the pipeline expects a typed `Claim` object, not free text.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Insurance développe un pipeline en plusieurs étapes. La première étape extrait les détails d'un sinistre à partir d'un e-mail à l'aide d'un déploiement nommé **extract-chat** et de l'API Responses avec OpenAI Python 2.x. L'étape suivante du pipeline attend un objet `Claim` typé, pas du texte libre.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from pydantic import BaseModel

    class Claim(BaseModel):
        policy_number: str
        incident_date: str
        amount: float

    response = openai.[[method]](
        model="extract-chat",
        input="Extract the claim details from this email: " + email_text,
        [[fmt]]=Claim,
    )
    claim = response.[[out]]
  slots:
    - id: method
      options:
        - { id: create, text: responses.create }
        - { id: parse, text: responses.parse }
        - { id: chat, text: chat.completions.create }
    - id: fmt
      options:
        - { id: respfmt, text: response_format }
        - { id: tools, text: tools }
        - { id: textfmt, text: text_format }
    - id: out
      options:
        - { id: parsed, text: output_parsed }
        - { id: text, text: output_text }
        - { id: msgparsed, text: "choices[0].message.parsed" }
answer:
  values: { method: parse, fmt: textfmt, out: parsed }
explanation:
  correct:
    en: With the Responses API, `responses.parse` takes the Pydantic model in `text_format`; the SDK converts it to a JSON Schema in `text.format` and returns the typed object in `output_parsed`. The next step then receives a validated Claim instance.
    fr: Avec l'API Responses, `responses.parse` reçoit le modèle Pydantic dans `text_format` ; le SDK le convertit en schéma JSON dans `text.format` et renvoie l'objet typé dans `output_parsed`. L'étape suivante reçoit alors une instance Claim validée.
  options:
    create: { en: "responses.create returns text; it does not convert the output into a Pydantic object.", fr: "responses.create renvoie du texte ; il ne convertit pas la sortie en objet Pydantic." }
    chat: { en: "Chat Completions takes messages, not input, and parses with beta.chat.completions.parse.", fr: "Chat Completions prend messages, pas input, et analyse la sortie avec beta.chat.completions.parse." }
    respfmt: { en: "response_format is the Chat Completions parameter for structured outputs.", fr: "response_format est le paramètre de Chat Completions pour les sorties structurées." }
    tools: { en: "tools defines functions the model can call; it does not shape the final output.", fr: "tools définit les fonctions que le modèle peut appeler ; il ne structure pas la sortie finale." }
    text: { en: "output_text is the raw text, not a typed object.", fr: "output_text est le texte brut, pas un objet typé." }
    msgparsed: { en: "choices[0].message.parsed is the Chat Completions response shape.", fr: "choices[0].message.parsed correspond à la forme d'une réponse Chat Completions." }
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
