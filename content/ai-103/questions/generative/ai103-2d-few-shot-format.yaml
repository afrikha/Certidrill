id: ai103-2d-few-shot-format
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders uses a **gpt-4.1-mini** deployment to write short replies to delivery complaints. The system message describes the expected style, but the replies still don't follow the three-part structure and the tone that the support team uses.

    You need the model to imitate approved replies. The solution must not require training a model or changing the deployment, and it must apply only to the requests that include it.

    What should you do?
  fr: |
    Northwind Traders utilise un déploiement **gpt-4.1-mini** pour rédiger de courtes réponses aux réclamations de livraison. Le message système décrit le style attendu, mais les réponses ne respectent toujours pas la structure en trois parties ni le ton qu'emploie l'équipe de support.

    Vous devez faire imiter au modèle des réponses approuvées. La solution ne doit pas nécessiter l'entraînement d'un modèle ni la modification du déploiement, et elle ne doit s'appliquer qu'aux requêtes qui l'incluent.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Fine-tune gpt-4.1-mini on a dataset of approved replies.", fr: "Affiner gpt-4.1-mini sur un jeu de données de réponses approuvées." } }
    - { id: b, text: { en: "Index the approved replies in Azure AI Search and retrieve them as grounding data.", fr: "Indexer les réponses approuvées dans Azure AI Search et les récupérer comme données d'ancrage." } }
    - { id: c, text: { en: "Add approved complaint and reply pairs as user and assistant messages after the system message.", fr: "Ajouter des paires réclamation/réponse approuvées sous forme de messages user et assistant après le message système." } }
    - { id: d, text: { en: "Raise the temperature so that the model explores more writing styles.", fr: "Augmenter la température pour que le modèle explore davantage de styles d'écriture." } }
answer: { optionId: c }
explanation:
  correct:
    en: Few-shot learning adds example user and assistant interactions to the messages array after the system message. The examples condition the model to respond in the same structure and tone for the current inference only; the model itself isn't changed.
    fr: "L'apprentissage few-shot ajoute des exemples d'échanges user et assistant au tableau messages, après le message système. Les exemples conditionnent le modèle à répondre avec la même structure et le même ton pour l'inférence en cours uniquement ; le modèle lui-même n'est pas modifié."
  options:
    a: { en: "Fine-tuning trains a new model version, which the requirements exclude.", fr: "L'affinage entraîne une nouvelle version du modèle, ce que les exigences excluent." }
    b: { en: "Grounding data supplies facts to answer from; a search index is extra infrastructure and doesn't present the replies as examples of the expected output.", fr: "Les données d'ancrage fournissent des faits à partir desquels répondre ; un index de recherche est une infrastructure supplémentaire et ne présente pas les réponses comme des exemples de la sortie attendue." }
    d: { en: "A higher temperature makes the output more random, so the replies would follow the approved style even less.", fr: "Une température plus élevée rend la sortie plus aléatoire : les réponses suivraient encore moins le style approuvé." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
