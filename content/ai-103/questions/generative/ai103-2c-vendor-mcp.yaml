id: ai103-2c-vendor-mcp
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. uses a SaaS ticketing platform. The vendor exposes its create, search and update operations as tools on a remote Model Context Protocol (MCP) server. The vendor doesn't publish an OpenAPI specification.

    You are building a prompt agent named helpdesk-agent in a Microsoft Foundry project. The agent must create and search tickets by using the vendor's tools. You need to minimize development effort.

    What should you add to helpdesk-agent?
  fr: |
    Litware, Inc. utilise une plateforme SaaS de gestion de tickets. L'éditeur expose ses opérations de création, de recherche et de mise à jour sous forme d'outils sur un serveur Model Context Protocol (MCP) distant. L'éditeur ne publie pas de spécification OpenAPI.

    Vous créez un agent d'invite nommé helpdesk-agent dans un projet Microsoft Foundry. L'agent doit créer et rechercher des tickets à l'aide des outils de l'éditeur. Vous devez réduire l'effort de développement.

    Que devez-vous ajouter à helpdesk-agent ?
body:
  options:
    - { id: a, text: { en: "An MCP tool that points to the vendor's MCP server URL", fr: "Un outil MCP qui pointe vers l'URL du serveur MCP de l'éditeur" } }
    - { id: b, text: { en: "An OpenAPI tool that points to the vendor's MCP server URL", fr: "Un outil OpenAPI qui pointe vers l'URL du serveur MCP de l'éditeur" } }
    - { id: c, text: { en: "A function tool for each vendor operation, run by your app", fr: "Un outil de fonction par opération de l'éditeur, exécuté par votre application" } }
    - { id: d, text: { en: "An A2A tool that points to the vendor's MCP server URL", fr: "Un outil A2A qui pointe vers l'URL du serveur MCP de l'éditeur" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The MCP tool gives the agent access to the tools hosted on an existing remote MCP server: you provide the server URL and a unique `server_label`, and the tools are discovered from the server. No client code has to implement the operations.
    fr: |
      L'outil MCP donne à l'agent l'accès aux outils hébergés sur un serveur MCP distant existant : vous fournissez l'URL du serveur et un `server_label` unique, et les outils sont découverts depuis le serveur. Aucun code client ne doit implémenter les opérations.
  options:
    b:
      en: |
        The OpenAPI tool needs an OpenAPI 3.0 or 3.1 specification of a REST API; the vendor publishes none, and an MCP server isn't described that way.
      fr: |
        L'outil OpenAPI a besoin d'une spécification OpenAPI 3.0 ou 3.1 d'une API REST ; l'éditeur n'en publie pas, et un serveur MCP n'est pas décrit de cette façon.
    c:
      en: |
        Function tools work, but you would have to write and run the code of every operation in your application, which doesn't minimize development effort.
      fr: |
        Des outils de fonction fonctionneraient, mais vous devriez écrire et exécuter le code de chaque opération dans votre application, ce qui ne réduit pas l'effort de développement.
    d:
      en: |
        The A2A tool calls a remote agent through the A2A protocol, not the tools of an MCP server.
      fr: |
        L'outil A2A appelle un agent distant par le protocole A2A, pas les outils d'un serveur MCP.
references:
  - title: Connect agents to Model Context Protocol servers
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
