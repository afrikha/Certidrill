id: ai103-2b-prompt-agent-type
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders needs an HR assistant in Foundry Agent Service. The assistant consists of a model deployment, instructions that define its role and goal, and the file search tool. The team doesn't want to write, package, or host any orchestration code.

    What should you create?
  fr: |
    Northwind Traders a besoin d'un assistant RH dans Foundry Agent Service. L'assistant se compose d'un déploiement de modèle, d'instructions qui définissent son rôle et son objectif, et de l'outil de recherche de fichiers. L'équipe ne veut écrire, empaqueter ni héberger aucun code d'orchestration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A prompt agent defined with PromptAgentDefinition", fr: "Un agent d'invite défini avec PromptAgentDefinition" } }
    - { id: b, text: { en: "A hosted agent packaged as a container image", fr: "Un agent hébergé empaqueté sous forme d'image conteneur" } }
    - { id: c, text: { en: "A Microsoft Agent Framework application that runs on the company's own servers", fr: "Une application Microsoft Agent Framework qui s'exécute sur les serveurs de l'entreprise" } }
    - { id: d, text: { en: "A fine-tuned model deployment that has the instructions in its training data", fr: "Un déploiement de modèle affiné dont les données d'entraînement contiennent les instructions" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A prompt agent is a persisted definition that combines a model, instructions and tools, and Foundry Agent Service runs it: no orchestration code to write or host. You create it with `project.agents.create_version()` and a `PromptAgentDefinition`.
    fr: |
      Un agent d'invite est une définition persistante qui combine un modèle, des instructions et des outils, et Foundry Agent Service l'exécute : aucun code d'orchestration à écrire ni à héberger. Vous le créez avec `project.agents.create_version()` et une `PromptAgentDefinition`.
  options:
    b: { en: "A hosted agent runs your own orchestration code, which the team doesn't want to write or package.", fr: "Un agent hébergé exécute votre propre code d'orchestration, que l'équipe ne veut ni écrire ni empaqueter." }
    c: { en: "An Agent Framework application is orchestration code that the team would have to write and host.", fr: "Une application Agent Framework est du code d'orchestration que l'équipe devrait écrire et héberger." }
    d: { en: "A fine-tuned model isn't an agent and doesn't add the file search tool.", fr: "Un modèle affiné n'est pas un agent et n'ajoute pas l'outil de recherche de fichiers." }
references:
  - title: Build with runtime components in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
