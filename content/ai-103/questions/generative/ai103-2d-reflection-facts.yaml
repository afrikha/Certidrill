id: ai103-2d-reflection-facts
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is designing reflection for two applications: a quote checker on a **gpt-4.1-mini** deployment and a planning assistant on an **o4-mini** reasoning deployment that uses the Responses API.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders conçoit la réflexion de deux applications : un vérificateur de devis sur un déploiement **gpt-4.1-mini** et un assistant de planification sur un déploiement de raisonnement **o4-mini** qui utilise l'API Responses.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Adding \"Think step by step and show all your steps\" to the prompt is a recommended technique for the planning assistant."
        fr: "Ajouter « Think step by step and show all your steps » à l'invite est une technique recommandée pour l'assistant de planification."
    - id: s2
      text:
        en: "When the planning assistant requests a reasoning summary, every response is guaranteed to include one."
        fr: "Quand l'assistant de planification demande un résumé du raisonnement, chaque réponse en contient obligatoirement un."
    - id: s3
      text:
        en: "In the quote checker, the critique of a draft can be performed by a call to a different model deployment than the one that wrote the draft."
        fr: "Dans le vérificateur de devis, la critique d'un brouillon peut être effectuée par un appel à un autre déploiement de modèle que celui qui a rédigé le brouillon."
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Chain-of-thought prompting applies only to non-reasoning models; reasoning models such as o4-mini work best with a clear goal, constraints and an output contract. Reasoning summaries aren't guaranteed for every step or request, even when enabled. The generate and critique roles are separate calls, so the critique can use another deployment, for example a judge model used by an evaluator.
    fr: |
      Le prompting par chaîne de pensée ne s'applique qu'aux modèles sans raisonnement ; les modèles de raisonnement comme o4-mini fonctionnent mieux avec un objectif clair, des contraintes et un contrat de sortie. Les résumés du raisonnement ne sont pas garantis pour chaque étape ou requête, même quand ils sont activés. Les rôles de génération et de critique sont des appels distincts : la critique peut donc utiliser un autre déploiement, par exemple le modèle juge d'un évaluateur.
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
