id: ai103-2c-group-chat-code
objective: "2.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso Pharmaceuticals is building a content workflow in Python by using Microsoft Agent Framework. A writer agent and a reviewer agent must refine a product leaflet in a shared conversation in which each agent sees the full history.

    The workflow must meet the following requirements:

    - An agent named editor_agent, not a fixed function, decides which agent speaks next.
    - The workflow stops after six assistant messages at most.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Pharmaceuticals crée un workflow de contenu en Python à l'aide de Microsoft Agent Framework. Un agent rédacteur et un agent relecteur doivent affiner une notice produit dans une conversation partagée dans laquelle chaque agent voit tout l'historique.

    Le workflow doit satisfaire les exigences suivantes :

    - Un agent nommé editor_agent, et non une fonction fixe, décide quel agent parle ensuite.
    - Le workflow s'arrête au plus tard après six messages de l'assistant.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    workflow = [[builder]](
        participants=[writer, reviewer],
        [[term]]=lambda messages: sum(1 for m in messages if m.role == "assistant") >= 6,
        [[strategy]]=editor_agent,
        intermediate_output_from=[writer, reviewer],
    ).build()
  slots:
    - id: builder
      options:
        - { id: group, text: GroupChatBuilder }
        - { id: magentic, text: MagenticBuilder }
        - { id: handoff, text: HandoffBuilder }
    - id: term
      options:
        - { id: maxround, text: max_round_count }
        - { id: termination, text: termination_condition }
        - { id: maxstall, text: max_stall_count }
    - id: strategy
      options:
        - { id: selection, text: selection_func }
        - { id: manager, text: manager_agent }
        - { id: orchestrator, text: orchestrator_agent }
answer:
  values: { builder: group, term: termination, strategy: orchestrator }
explanation:
  correct:
    en: |
      Group chat assembles agents in a star topology around an orchestrator that selects the next speaker, and every agent sees the full conversation. `orchestrator_agent` makes a full agent choose the speaker, while `selection_func` takes a plain function such as round-robin. `termination_condition` takes a callable over the conversation and stops the workflow when it returns true.
    fr: |
      Group chat organise les agents en étoile autour d'un orchestrateur qui choisit le prochain intervenant, et chaque agent voit toute la conversation. `orchestrator_agent` confie le choix de l'intervenant à un agent complet, tandis que `selection_func` reçoit une simple fonction, par exemple un tourniquet (round-robin). `termination_condition` reçoit une fonction appelable sur la conversation et arrête le workflow quand elle renvoie true.
  options:
    magentic:
      en: "`MagenticBuilder` adds a planning manager with a progress ledger, for open-ended tasks; the requirement is a moderated shared conversation."
      fr: "`MagenticBuilder` ajoute un gestionnaire qui planifie avec un registre de progression, pour des tâches ouvertes ; l'exigence est une conversation partagée modérée."
    handoff:
      en: "`HandoffBuilder` transfers ownership between agents without a central orchestrator."
      fr: "`HandoffBuilder` transfère la responsabilité entre agents sans orchestrateur central."
    maxround:
      en: "`max_round_count` is a Magentic parameter that takes a number, not a callable."
      fr: "`max_round_count` est un paramètre de Magentic qui reçoit un nombre, pas une fonction appelable."
    selection:
      en: "`selection_func` expects a function, and the requirement asks for an agent to decide."
      fr: "`selection_func` attend une fonction, et l'exigence demande qu'un agent décide."
    manager:
      en: "`manager_agent` is the parameter of `MagenticBuilder`, not of the group chat builder."
      fr: "`manager_agent` est le paramètre de `MagenticBuilder`, pas du générateur de group chat."
references:
  - title: Microsoft Agent Framework Workflows Orchestrations - Group Chat
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/group-chat
