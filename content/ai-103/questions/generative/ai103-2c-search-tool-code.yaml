id: ai103-2c-search-tool-code
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an Azure AI Search index named product-docs that contains text fields and vector fields. A Foundry project has a connection named adatum-search to the search service.

    You are adding the Azure AI Search tool to an agent by using the Python SDK. Each query must combine keyword and vector retrieval and then rerank the results semantically.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un index Azure AI Search nommé product-docs qui contient des champs de texte et des champs vectoriels. Un projet Foundry dispose d'une connexion nommée adatum-search vers le service de recherche.

    Vous ajoutez l'outil Azure AI Search à un agent à l'aide du SDK Python. Chaque requête doit combiner la récupération par mots clés et la récupération vectorielle, puis reclasser les résultats de façon sémantique.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    search_connection = project.connections.get("adatum-search")

    search_tool = AzureAISearchTool(
        azure_ai_search=[[resource]](
            indexes=[
                AISearchIndexResource(
                    project_connection_id=[[conn]],
                    index_name="product-docs",
                    query_type=AzureAISearchQueryType.[[qtype]],
                ),
            ]
        )
    )
  slots:
    - id: resource
      options:
        - { id: toolres, text: AzureAISearchToolResource }
        - { id: filesearch, text: FileSearchTool }
        - { id: indexres, text: AISearchIndexResource }
    - id: conn
      options:
        - { id: name, text: search_connection.name }
        - { id: id, text: search_connection.id }
        - { id: target, text: search_connection.target }
    - id: qtype
      options:
        - { id: semantic, text: SEMANTIC }
        - { id: vsimple, text: VECTOR_SIMPLE_HYBRID }
        - { id: vector, text: VECTOR }
        - { id: vsemantic, text: VECTOR_SEMANTIC_HYBRID }
answer:
  values: { resource: toolres, conn: id, qtype: vsemantic }
explanation:
  correct:
    en: |
      `AzureAISearchTool` takes an `AzureAISearchToolResource` whose `indexes` list holds the `AISearchIndexResource`. `project_connection_id` expects the resource ID of the project connection, which `connection.id` returns. `vector_semantic_hybrid`, also the default, runs keyword and vector queries together and applies semantic reranking.
    fr: |
      `AzureAISearchTool` reçoit un `AzureAISearchToolResource` dont la liste `indexes` contient l'`AISearchIndexResource`. `project_connection_id` attend l'ID de ressource de la connexion de projet, que renvoie `connection.id`. `vector_semantic_hybrid`, qui est aussi la valeur par défaut, exécute ensemble les requêtes par mots clés et vectorielles et applique le reclassement sémantique.
  options:
    filesearch:
      en: "`FileSearchTool` is another tool that searches vector stores; it doesn't wrap search indexes."
      fr: "`FileSearchTool` est un autre outil, qui interroge des magasins de vecteurs ; il n'encapsule pas d'index de recherche."
    indexres:
      en: "`AISearchIndexResource` describes one index and goes inside the `indexes` list, not around it."
      fr: "`AISearchIndexResource` décrit un index et se place dans la liste `indexes`, pas autour."
    name:
      en: "The parameter expects the connection's resource ID, not its name."
      fr: "Le paramètre attend l'ID de ressource de la connexion, pas son nom."
    target:
      en: "`target` is the endpoint that the connection points to, not the connection's ID."
      fr: "`target` est le point de terminaison vers lequel pointe la connexion, pas l'ID de la connexion."
    semantic:
      en: "`semantic` uses keyword retrieval with semantic reranking, without vector retrieval."
      fr: "`semantic` utilise la récupération par mots clés avec reclassement sémantique, sans récupération vectorielle."
    vsimple:
      en: "`vector_simple_hybrid` combines keyword and vector retrieval but without semantic reranking."
      fr: "`vector_simple_hybrid` combine la récupération par mots clés et vectorielle, mais sans reclassement sémantique."
    vector:
      en: "`vector` runs only the vector query."
      fr: "`vector` n'exécute que la requête vectorielle."
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search
