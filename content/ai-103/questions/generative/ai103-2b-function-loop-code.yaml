id: ai103-2b-function-loop-code
objective: "2.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an agent with a function tool named get_balance. In the application, the Python function `get_balance(account_id)` returns a dictionary such as `{"balance": 1520.75, "currency": "USD"}`. The variable `openai` is the OpenAI client for the agent, and `conversation` is an existing conversation.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un agent doté d'un outil de fonction nommé get_balance. Dans l'application, la fonction Python `get_balance(account_id)` renvoie un dictionnaire comme `{"balance": 1520.75, "currency": "USD"}`. La variable `openai` est le client OpenAI de l'agent, et `conversation` est une conversation existante.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = openai.responses.create(conversation=conversation.id, input=question)

    input_list = []
    for item in response.output:
        if item.type == "[[s1]]" and item.name == "get_balance":
            result = get_balance(**json.loads(item.[[s2]]))
            input_list.append(FunctionCallOutput(
                type="function_call_output",
                call_id=item.[[s3]],
                output=[[s4]],
            ))

    response = openai.responses.create(conversation=conversation.id, input=input_list)
    print(response.output_text)
  slots:
    - id: s1
      options:
        - { id: msg, text: message }
        - { id: fco, text: function_call_output }
        - { id: fc, text: function_call }
    - id: s2
      options:
        - { id: args, text: arguments }
        - { id: output, text: output }
        - { id: content, text: content }
    - id: s3
      options:
        - { id: id, text: id }
        - { id: callid, text: call_id }
        - { id: name, text: name }
    - id: s4
      options:
        - { id: dumps, text: json.dumps(result) }
        - { id: raw, text: result }
        - { id: itemargs, text: item.arguments }
answer:
  values: { s1: fc, s2: args, s3: callid, s4: dumps }
explanation:
  correct:
    en: |
      The model requests a call with an output item of type `function_call`, whose `arguments` property is a JSON string that the code parses before running the function. The result goes back as a `function_call_output` whose `call_id` matches the call, and whose `output` is a string, so the dictionary is serialized with `json.dumps()`.
    fr: |
      Le modèle demande un appel avec un élément de sortie de type `function_call`, dont la propriété `arguments` est une chaîne JSON que le code analyse avant d'exécuter la fonction. Le résultat est renvoyé sous forme de `function_call_output` dont le `call_id` correspond à l'appel et dont la `output` est une chaîne : le dictionnaire est donc sérialisé avec `json.dumps()`.
  options:
    fco: { en: "function_call_output is the type of the item that the application sends back, not of the request from the model.", fr: "function_call_output est le type de l'élément que l'application renvoie, pas celui de la demande du modèle." }
    id: { en: "id identifies the output item itself; the output must reference the call_id of the call.", fr: "id identifie l'élément de sortie lui-même ; la sortie doit faire référence au call_id de l'appel." }
    raw: { en: "The output must be a string; the Learn sample serializes the result with json.dumps().", fr: "La sortie doit être une chaîne ; l'exemple Learn sérialise le résultat avec json.dumps()." }
    itemargs: { en: "Returning the arguments would send the request back to the model instead of the result.", fr: "Renvoyer les arguments retournerait la demande au modèle au lieu du résultat." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
