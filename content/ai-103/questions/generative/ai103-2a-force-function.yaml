id: ai103-2a-force-function
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's support assistant uses the Chat Completions API with two functions: get_customer_profile and get_recent_transactions. On the first turn of every conversation, the model must call get_customer_profile before it does anything else, whatever the user writes.

    How should you configure the first request?
  fr: |
    L'assistant de support de Woodgrove Bank utilise l'API Chat Completions avec deux fonctions : get_customer_profile et get_recent_transactions. Au premier tour de chaque conversation, le modèle doit appeler get_customer_profile avant toute autre chose, quoi qu'écrive l'utilisateur.

    Comment devez-vous configurer la première requête ?
body:
  options:
    - { id: a, text: { en: "Set tool_choice to auto.", fr: "Définir tool_choice sur auto." } }
    - { id: b, text: { en: "Set tool_choice to none.", fr: "Définir tool_choice sur none." } }
    - { id: c, text: { en: "Set parallel_tool_calls to false.", fr: "Définir parallel_tool_calls sur false." } }
    - { id: d, text: { en: "Set tool_choice to a function object that names get_customer_profile.", fr: "Définir tool_choice sur un objet function qui nomme get_customer_profile." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Passing tool_choice as a function object, such as `{"type": "function", "function": {"name": "get_customer_profile"}}`, forces the model to call that specific function. Later turns can go back to the default auto behavior.
    fr: |
      Passer tool_choice sous forme d'objet function, par exemple `{"type": "function", "function": {"name": "get_customer_profile"}}`, oblige le modèle à appeler cette fonction précise. Les tours suivants peuvent revenir au comportement par défaut auto.
  options:
    a:
      en: With auto, the default, the model decides whether to call a function and which one, so the call is not guaranteed.
      fr: |
        Avec auto, la valeur par défaut, le modèle décide s'il appelle une fonction et laquelle : l'appel n'est pas garanti.
    b:
      en: none forces a user-facing message without any function call.
      fr: none force un message destiné à l'utilisateur sans aucun appel de fonction.
    c:
      en: parallel_tool_calls controls whether several calls can be returned at once; it does not force a specific function.
      fr: parallel_tool_calls indique si plusieurs appels peuvent être renvoyés à la fois ; il n'impose pas une fonction précise.
references:
  - title: How to use function calling with Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/function-calling
