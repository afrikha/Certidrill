id: ai103-2d-batch-overnight
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso's contact center records about 40,000 call transcripts each day. Every night, a job must summarize all the transcripts of the day with a **gpt-4.1-mini** model. The summaries are needed by the next business day, and the job must not consume the quota of the online assistant that uses the same model.

    You need to minimize the cost of the nightly summaries. Which deployment type should you use for the job?
  fr: |
    Le centre de contacts de Contoso enregistre environ 40 000 transcriptions d'appels par jour. Chaque nuit, un traitement doit résumer toutes les transcriptions de la journée avec un modèle **gpt-4.1-mini**. Les synthèses doivent être disponibles le jour ouvré suivant, et le traitement ne doit pas consommer le quota de l'assistant en ligne qui utilise le même modèle.

    Vous devez réduire au minimum le coût des synthèses nocturnes. Quel type de déploiement devez-vous utiliser pour le traitement ?
body:
  options:
    - { id: a, text: Global Standard }
    - { id: b, text: Global Batch }
    - { id: c, text: Global Provisioned }
    - { id: d, text: Data Zone Standard }
answer: { optionId: b }
explanation:
  correct:
    en: "Global Batch processes a large number of requests submitted in a single file at 50 % less cost than Global Standard, with a 24-hour target turnaround. Batch requests use a separate enqueued token quota, so they don't disrupt the online workloads."
    fr: "Global Batch traite un grand nombre de requêtes soumises dans un seul fichier pour un coût inférieur de 50 % à celui de Global Standard, avec un objectif de traitement en 24 heures. Les requêtes Batch utilisent un quota distinct de jetons en file d'attente : elles ne perturbent donc pas les charges de travail en ligne."
  options:
    a: { en: "Global Standard is billed at the full pay-as-you-go rate, and the job would share its quota with the online assistant.", fr: "Global Standard est facturé au tarif de paiement à l'utilisation complet, et le traitement partagerait son quota avec l'assistant en ligne." }
    c: { en: "Provisioned throughput reserves capacity for consistent latency, which a nightly job doesn't need, and it isn't the cheapest option for occasional bulk work.", fr: "Le débit provisionné réserve de la capacité pour une latence régulière, dont un traitement nocturne n'a pas besoin, et ce n'est pas l'option la moins chère pour un travail de masse ponctuel." }
    d: { en: "Data Zone Standard keeps processing in a data zone but has no batch discount.", fr: "Data Zone Standard maintient le traitement dans une zone de données, mais n'offre pas la remise Batch." }
references:
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
