id: ai103-2a-parallel-calls
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys' travel assistant uses function calling with the Responses API. For the prompt "Compare the weather in Lisbon, Oslo and Rome", the response contains three items of type function_call, each with its own call_id.

    You need to return the results to the model. The solution must minimize the number of requests to the API.

    What should the application do?
  fr: |
    L'assistant de voyage de Tailspin Toys utilise l'appel de fonction avec l'API Responses. Pour l'invite « Compare la météo à Lisbonne, Oslo et Rome », la réponse contient trois éléments de type function_call, chacun avec son propre call_id.

    Vous devez renvoyer les résultats au modèle. La solution doit réduire au minimum le nombre de requêtes adressées à l'API.

    Que doit faire l'application ?
body:
  options:
    - { id: a, text: { en: "Run the first call only, return its output, and let the model request the two other calls again.", fr: "Exécuter seulement le premier appel, renvoyer sa sortie et laisser le modèle redemander les deux autres appels." } }
    - { id: b, text: { en: "Run the three calls and send one function_call_output that combines the results under the first call_id.", fr: "Exécuter les trois appels et envoyer un seul function_call_output qui combine les résultats sous le premier call_id." } }
    - { id: c, text: { en: "Run the three calls and send three function_call_output items, each with its call_id, in one request.", fr: "Exécuter les trois appels et envoyer trois éléments function_call_output, chacun avec son call_id, dans une seule requête." } }
    - { id: d, text: { en: "Run the three calls and send each function_call_output in a separate request that uses previous_response_id.", fr: "Exécuter les trois appels et envoyer chaque function_call_output dans une requête distincte qui utilise previous_response_id." } }
answer: { optionId: c }
explanation:
  correct:
    en: With parallel function calling, the model returns several calls at once. The application runs all of them and returns one output per call, matched by its call_id, in a single follow-up request, which reduces the number of API calls.
    fr: Avec l'appel de fonction parallèle, le modèle renvoie plusieurs appels à la fois. L'application les exécute tous et renvoie une sortie par appel, associée à son call_id, dans une seule requête de suivi, ce qui réduit le nombre d'appels à l'API.
  options:
    a:
      en: Ignoring two calls forces extra round trips, the opposite of the requirement.
      fr: Ignorer deux appels impose des allers-retours supplémentaires, à l'opposé de l'exigence.
    b:
      en: Each function call must get its own output with the matching call_id; the two other calls would stay unanswered.
      fr: Chaque appel de fonction doit recevoir sa propre sortie avec le call_id correspondant ; les deux autres appels resteraient sans réponse.
    d:
      en: Three separate requests multiply the API calls instead of minimizing them.
      fr: Trois requêtes distinctes multiplient les appels à l'API au lieu de les réduire.
references:
  - title: How to use function calling with Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/function-calling
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
