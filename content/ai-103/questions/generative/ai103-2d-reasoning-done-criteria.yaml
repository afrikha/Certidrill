id: ai103-2d-reasoning-done-criteria
objective: "2.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware runs an agentic research workflow on a **gpt-5** deployment, a reasoning model. The developer message says: "Think step by step. Show all your reasoning. Here is the 12-step procedure you must follow: ..."

    Reviewers find that reports are sometimes returned before the figures have been checked against the cited sources. The team doesn't want to extract the model's raw reasoning.

    You need the model to check its own work before it returns a report. What should you change in the developer message?
  fr: |
    Litware exécute un workflow de recherche agentique sur un déploiement **gpt-5**, un modèle de raisonnement. Le message developer indique : « Think step by step. Show all your reasoning. Here is the 12-step procedure you must follow: ... »

    Les relecteurs constatent que des rapports sont parfois renvoyés avant que les chiffres aient été vérifiés par rapport aux sources citées. L'équipe ne veut pas extraire le raisonnement brut du modèle.

    Vous devez faire vérifier au modèle son propre travail avant qu'il renvoie un rapport. Que devez-vous modifier dans le message developer ?
body:
  options:
    - { id: a, text: { en: "Add few-shot examples that show the reasoning steps the model must reproduce for each report.", fr: "Ajouter des exemples few-shot qui montrent les étapes de raisonnement que le modèle doit reproduire pour chaque rapport." } }
    - { id: b, text: { en: "Add a 13th step that asks the model to print its reasoning so that the application can check it.", fr: "Ajouter une 13e étape qui demande au modèle d'afficher son raisonnement pour que l'application le vérifie." } }
    - { id: c, text: { en: "State the goal, the constraints, and the output contract, and define what done means and how to verify it.", fr: "Énoncer l'objectif, les contraintes et le contrat de sortie, et définir ce que signifie terminé et comment le vérifier." } }
    - { id: d, text: { en: "Keep the procedure, and add an instruction to use a temperature of 0 when it checks the figures.", fr: "Conserver la procédure, et ajouter une instruction pour utiliser une température de 0 lors de la vérification des chiffres." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Reasoning models work best with a clear goal, firm constraints and an explicit output contract, and they don't need every intermediate step prescribed. For agentic or research-heavy workflows, Learn recommends defining what counts as done and how the model should verify its own work."
    fr: "Les modèles de raisonnement fonctionnent mieux avec un objectif clair, des contraintes fermes et un contrat de sortie explicite, et ils n'ont pas besoin qu'on leur prescrive chaque étape intermédiaire. Pour les workflows agentiques ou axés sur la recherche, Learn recommande de définir ce qui compte comme terminé et comment le modèle doit vérifier son propre travail."
  options:
    a: { en: "Few-shot and chain-of-thought techniques aren't recommended for reasoning models, which don't need prescribed intermediate steps.", fr: "Les techniques few-shot et de chaîne de pensée ne sont pas recommandées pour les modèles de raisonnement, qui n'ont pas besoin d'étapes intermédiaires prescrites." }
    b: { en: "Asking the model to print its raw reasoning is an unsupported extraction method that may violate the Acceptable Use Policy.", fr: "Demander au modèle d'afficher son raisonnement brut est une méthode d'extraction non prise en charge, qui peut enfreindre la stratégie d'utilisation acceptable." }
    d: { en: "Temperature is a request parameter, not an instruction, and gpt-5 doesn't support it.", fr: "La température est un paramètre de requête, pas une instruction, et gpt-5 ne la prend pas en charge." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
