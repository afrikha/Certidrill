id: ai103-2c-tool-per-need
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso Pharmaceuticals is building a prompt agent named field-agent for its sales representatives. The agent must meet the requirements shown in the answer area. Client-side code must be written only when no service-side tool can meet a requirement.

    Which tool should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Pharmaceuticals crée un agent d'invite nommé field-agent pour ses commerciaux. L'agent doit satisfaire les exigences présentées dans la zone de réponse. Du code côté client ne doit être écrit que si aucun outil côté service ne peut satisfaire une exigence.

    Quel outil devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: openapi, text: { en: OpenAPI tool, fr: Outil OpenAPI } }
    - { id: function, text: { en: Function calling, fr: Appel de fonction } }
    - { id: filesearch, text: { en: File search, fr: Recherche de fichiers (File search) } }
    - { id: bing, text: Grounding with Bing Search }
    - { id: code, text: { en: Code interpreter, fr: Interpréteur de code (Code interpreter) } }
    - { id: a2a, text: { en: A2A tool, fr: Outil A2A } }
  targets:
    - id: t1
      text: { en: "Create sample orders in a partner REST API that publishes an OpenAPI 3.1 specification", fr: "Créer des commandes d'échantillons dans une API REST partenaire qui publie une spécification OpenAPI 3.1" }
    - id: t2
      text: { en: "Read the representative's current route from the in-memory session of the mobile app's backend", fr: "Lire la tournée actuelle du commercial dans la session en mémoire du serveur principal de l'application mobile" }
    - id: t3
      text: { en: "Answer from 400 product leaflets in PDF format uploaded to the agent", fr: "Répondre à partir de 400 notices produit au format PDF chargées dans l'agent" }
    - id: t4
      text: { en: "Answer questions about health news published on public websites today", fr: "Répondre à des questions sur l'actualité santé publiée aujourd'hui sur des sites web publics" }
answer:
  mapping: { t1: openapi, t2: function, t3: filesearch, t4: bing }
explanation:
  correct:
    en: |
      The OpenAPI tool lets the service call a REST API described by an OpenAPI 3.0 or 3.1 specification. Data that exists only in the backend's memory requires function calling, because your code runs the function. File search grounds the agent on documents uploaded to a vector store. Grounding with Bing Search retrieves current public web information.
    fr: |
      L'outil OpenAPI permet au service d'appeler une API REST décrite par une spécification OpenAPI 3.0 ou 3.1. Des données qui n'existent que dans la mémoire du serveur principal exigent l'appel de fonction, car c'est votre code qui exécute la fonction. La recherche de fichiers ancre l'agent sur des documents chargés dans un magasin de vecteurs. Grounding with Bing Search récupère des informations publiques actuelles du web.
  options:
    code:
      en: "Code interpreter runs Python in a sandbox for calculations and file processing; it doesn't reach the backend's session or the web."
      fr: "L'interpréteur de code exécute du Python dans un bac à sable pour les calculs et le traitement de fichiers ; il n'atteint ni la session du serveur principal ni le web."
    a2a:
      en: "The A2A tool delegates to another agent; none of the requirements involves a remote agent."
      fr: "L'outil A2A délègue à un autre agent ; aucune exigence ne fait intervenir un agent distant."
references:
  - title: File search tool for agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
