id: ai103-2b-search-tool-settings
objective: "2.2.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an agent that answers HR questions by using the Azure AI Search tool. The settings of the index resource in the tool definition are shown in the following table. The index contains a filterable field named department.

    For each requirement, select the setting that you must change.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un agent qui répond aux questions RH à l'aide de l'outil Azure AI Search. Les paramètres de la ressource d'index dans la définition de l'outil figurent dans le tableau suivant. L'index contient un champ filtrable nommé department.

    Pour chaque exigence, sélectionnez le paramètre que vous devez modifier.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Each query must return up to 10 results instead of the current number.", fr: "Chaque requête doit renvoyer jusqu'à 10 résultats au lieu du nombre actuel." }
    - id: p2
      text: { en: "Every query that the agent makes must be restricted to documents whose department is HR.", fr: "Chaque requête de l'agent doit être limitée aux documents dont le département est HR." }
  grid:
    header: [ { en: "Setting", fr: "Paramètre" }, { en: "Value", fr: "Valeur" } ]
    rows:
      - [ { text: project_connection_id, area: conn }, { text: "/subscriptions/.../connections/adatum-search" } ]
      - [ { text: index_name, area: index }, { text: hr-docs } ]
      - [ { text: query_type, area: qtype }, { text: vector_semantic_hybrid } ]
      - [ { text: top_k, area: topk }, { text: "5" } ]
      - [ { text: filter, area: filter }, { text: { en: "(not set)", fr: "(non défini)" } } ]
answer:
  values: { p1: topk, p2: filter }
explanation:
  correct:
    en: |
      `top_k` sets the number of results that the tool returns per query and defaults to 5. `filter` applies to all the queries that the agent makes to the index, so a filter on the department field restricts every search. `query_type` (default `vector_semantic_hybrid`) chooses the search method, and the tool targets one index through the connection.
    fr: |
      `top_k` définit le nombre de résultats que l'outil renvoie par requête et vaut 5 par défaut. `filter` s'applique à toutes les requêtes que l'agent adresse à l'index : un filtre sur le champ department limite donc chaque recherche. `query_type` (par défaut `vector_semantic_hybrid`) choisit la méthode de recherche, et l'outil cible un seul index via la connexion.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
