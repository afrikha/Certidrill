status: draft
stem:
  en: You restrict allowed_tools and use a never list for require_approval.
  fr: Vous restreignez allowed_tools et utilisez une liste never pour require_approval.
body:
  solution:
    en: |
      You define the tool as follows. When a response contains an output item of type `mcp_approval_request`, the app shows the tool name and arguments on the review page. It then sends an `mcp_approval_response` item with `approve` set to the supervisor's decision and `approval_request_id` set to the request `id`, in the same conversation.

      ```python
      tool = MCPTool(
          server_label="orders",
          server_url=ORDERS_MCP_URL,
          allowed_tools=["get_order_status", "list_orders",
                         "issue_refund", "cancel_order"],
          require_approval={"never": ["get_order_status", "list_orders"]},
      )
      ```
    fr: |
      Vous définissez l'outil comme suit. Lorsqu'une réponse contient un élément de sortie de type `mcp_approval_request`, l'application affiche le nom de l'outil et ses arguments sur la page de revue. Elle envoie ensuite, dans la même conversation, un élément `mcp_approval_response` dont `approve` reprend la décision du superviseur et dont `approval_request_id` est l'`id` de la demande.

      ```python
      tool = MCPTool(
          server_label="orders",
          server_url=ORDERS_MCP_URL,
          allowed_tools=["get_order_status", "list_orders",
                         "issue_refund", "cancel_order"],
          require_approval={"never": ["get_order_status", "list_orders"]},
      )
      ```
answer: { value: true }
explanation:
  correct:
    en: Because `delete_customer` is not in the nonempty `allowed_tools` list, the agent cannot use it. The `never` list exempts only the two read-only tools, so every call to `issue_refund` or `cancel_order` produces an `mcp_approval_request` that waits for the supervisor's `mcp_approval_response` in the same conversation.
    fr: "Comme `delete_customer` ne figure pas dans la liste `allowed_tools` non vide, l'agent ne peut pas l'utiliser. La liste `never` exempte uniquement les deux outils en lecture seule : chaque appel à `issue_refund` ou `cancel_order` produit un `mcp_approval_request` qui attend l'`mcp_approval_response` du superviseur dans la même conversation."
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
