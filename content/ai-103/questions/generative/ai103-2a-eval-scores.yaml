id: ai103-2a-eval-scores
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an evaluation with three evaluators at their default thresholds: Coherence, Violence and BLEU.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exécute une évaluation avec trois évaluateurs à leurs seuils par défaut : Coherence, Violence et BLEU.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A response with a Coherence score of 3 passes.
        fr: Une réponse avec un score Coherence de 3 réussit.
    - id: s2
      text:
        en: A response with a Violence score of 5 passes, because the score is above the threshold.
        fr: Une réponse avec un score Violence de 5 réussit, car le score est supérieur au seuil.
    - id: s3
      text:
        en: BLEU returns an integer score from 1 to 5.
        fr: BLEU renvoie un score entier de 1 à 5.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Coherence returns a 1–5 score with a default threshold of 3, and scores at or above the threshold pass. Content safety evaluators such as Violence use a 0–7 severity scale and pass only when the score is less than or equal to the threshold (3 by default), so 5 (Medium) fails. BLEU is algorithmic and returns a float between 0 and 1, with a default threshold of 0.5.
    fr: |
      Coherence renvoie un score de 1 à 5 avec un seuil par défaut de 3, et les scores supérieurs ou égaux au seuil réussissent. Les évaluateurs de sécurité du contenu comme Violence utilisent une échelle de gravité de 0 à 7 et ne réussissent que si le score est inférieur ou égal au seuil (3 par défaut) : 5 (Medium) échoue. BLEU est algorithmique et renvoie un nombre décimal entre 0 et 1, avec un seuil par défaut de 0,5.
references:
  - title: General purpose evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/general-purpose-evaluators
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
