id: ai103-2b-retrieval-and-functions
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. is building an agent named service-agent. The agent must:

    - Answer from product manuals that are already indexed in an existing Azure AI Search index maintained by the search team.
    - Read the live warranty status of a customer from an on-premises database that only the backend of the application can reach.

    Which two tools should you attach to service-agent? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. crée un agent nommé service-agent. L'agent doit :

    - Répondre à partir de manuels produits déjà indexés dans un index Azure AI Search existant géré par l'équipe de recherche.
    - Lire le statut de garantie en temps réel d'un client dans une base de données locale que seul le back-end de l'application peut atteindre.

    Quels sont les deux outils que vous devez attacher à service-agent ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The file search tool, with the manuals uploaded to a vector store", fr: "L'outil de recherche de fichiers, avec les manuels chargés dans un magasin de vecteurs" } }
    - { id: b, text: { en: "The memory search tool", fr: "L'outil de recherche de mémoire" } }
    - { id: c, text: { en: "A function tool that the backend executes", fr: "Un outil de fonction que le back-end exécute" } }
    - { id: d, text: { en: "The code interpreter tool", fr: "L'outil d'interpréteur de code" } }
    - { id: e, text: { en: "The Azure AI Search tool, connected to the existing index", fr: "L'outil Azure AI Search, connecté à l'index existant" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      The Azure AI Search tool lets the agent query an existing index through a project connection, so the search team keeps ownership of the index. With function calling, the agent only requests the call and the application runs the function, which is the way to reach a database that only the backend can access.
    fr: |
      L'outil Azure AI Search permet à l'agent d'interroger un index existant via une connexion du projet : l'équipe de recherche reste propriétaire de l'index. Avec l'appel de fonction, l'agent se contente de demander l'appel et c'est l'application qui exécute la fonction, ce qui permet d'atteindre une base de données accessible uniquement par le back-end.
  options:
    a: { en: "File search would duplicate the manuals in a new vector store instead of using the existing index.", fr: "La recherche de fichiers dupliquerait les manuels dans un nouveau magasin de vecteurs au lieu d'utiliser l'index existant." }
    b: { en: "Memory keeps user-specific knowledge across sessions; it doesn't read live data or search manuals.", fr: "La mémoire conserve des connaissances propres à l'utilisateur d'une session à l'autre ; elle ne lit pas de données en temps réel et ne recherche pas dans des manuels." }
    d: { en: "Code interpreter runs Python in a sandbox managed by the service, which can't reach the on-premises database.", fr: "L'interpréteur de code exécute du Python dans un bac à sable géré par le service, qui ne peut pas atteindre la base de données locale." }
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
