id: ai103-2d-filter-signals-grid
objective: "2.3.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys collects safety signals from the calls that its application makes to a Foundry model deployment with a content filter. The following table shows excerpts of four logged responses.

    Answer each prompt by selecting the response that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys collecte des signaux de sécurité à partir des appels que son application effectue vers un déploiement de modèle Foundry doté d'un filtre de contenu. Le tableau suivant présente des extraits de quatre réponses journalisées.

    Répondez à chaque consigne en sélectionnant la réponse qui lui correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The user's prompt was blocked by the content filter.", fr: "L'invite de l'utilisateur a été bloquée par le filtre de contenu." }
    - id: p2
      text: { en: "The content filter didn't run on the generated text.", fr: "Le filtre de contenu ne s'est pas exécuté sur le texte généré." }
  grid:
    header: [{ en: "Response", fr: "Réponse" }, { en: "HTTP status", fr: "Statut HTTP" }, { en: "Excerpt", fr: "Extrait" }]
    rows:
      - [{ text: R1, area: r1 }, { text: "200" }, { text: "\"finish_reason\": \"content_filter\"" }]
      - [{ text: R2, area: r2 }, { text: "200" }, { text: "\"finish_reason\": \"length\", \"content_filter_results\": { \"error\": { \"code\": \"content_filter_error\" } }" }]
      - [{ text: R3, area: r3 }, { text: "400" }, { text: "\"code\": \"content_filter\", \"param\": \"prompt\"" }]
      - [{ text: R4, area: r4 }, { text: "200" }, { text: "\"finish_reason\": \"stop\"" }]
answer:
  values: { p1: r3, p2: r2 }
explanation:
  correct:
    en: "A prompt classified at a filtered category and severity returns HTTP 400 with the content_filter error code. When the filtering system is down or can't complete in time, the request still succeeds without filtering, and an error object appears in content_filter_results. A finish_reason of content_filter (R1) means that the generated content was filtered, and stop (R4) is a normal completion."
    fr: "Une invite classée dans une catégorie et une gravité filtrées renvoie HTTP 400 avec le code d'erreur content_filter. Quand le système de filtrage est indisponible ou ne termine pas à temps, la requête réussit quand même sans filtrage, et un objet d'erreur apparaît dans content_filter_results. Un finish_reason content_filter (R1) signifie que le contenu généré a été filtré, et stop (R4) correspond à une complétion normale."
references:
  - title: Content filtering for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/foundry-models/concepts/content-filter
