id: ai103-2d-hybrid-compensation
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Airlines receives passenger compensation requests by email in many languages. Regulations set fixed compensation amounts based on the flight distance and the length of the delay. The airline's operations database holds the actual delay of every flight.

    Each decision must be identical for identical cases and fully auditable. The reply to the passenger must be written in the passenger's language.

    What should you do?
  fr: |
    Tailspin Airlines reçoit par e-mail, en de nombreuses langues, des demandes d'indemnisation de passagers. La réglementation fixe des montants d'indemnisation selon la distance du vol et la durée du retard. La base de données opérationnelle de la compagnie contient le retard réel de chaque vol.

    Chaque décision doit être identique pour des cas identiques et entièrement auditable. La réponse au passager doit être rédigée dans sa langue.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Put the regulation's amount table in the system message, set the temperature to 0, and have the model decide and write the reply.", fr: "Placer le tableau des montants de la réglementation dans le message système, définir la température sur 0, et laisser le modèle décider et rédiger la réponse." } }
    - { id: b, text: { en: "Have the model extract the flight and request details as JSON, compute the decision with rules in code, then have the model write the reply.", fr: "Faire extraire par le modèle les détails du vol et de la demande en JSON, calculer la décision avec des règles dans le code, puis faire rédiger la réponse par le modèle." } }
    - { id: c, text: { en: "Send each request to a model router deployment in Quality mode so that the most capable model decides and writes the reply.", fr: "Envoyer chaque demande à un déploiement de model router en mode Quality pour que le modèle le plus performant décide et rédige la réponse." } }
    - { id: d, text: { en: "Have one model decide and write the reply, and have a second model critique the decision before the reply is sent.", fr: "Faire décider et rédiger la réponse par un modèle, et faire critiquer la décision par un second modèle avant l'envoi de la réponse." } }
answer: { optionId: b }
explanation:
  correct:
    en: "In a hybrid design, the language model handles what rules can't: reading free-text emails in any language and writing the reply. The decision applies fixed thresholds to the extracted fields and the delay from the operations database in deterministic code, so identical cases get identical results that can be audited."
    fr: "Dans une conception hybride, le modèle de langage traite ce que les règles ne savent pas faire : lire des e-mails en texte libre dans n'importe quelle langue et rédiger la réponse. La décision applique des seuils fixes aux champs extraits et au retard issu de la base opérationnelle dans du code déterministe : des cas identiques obtiennent des résultats identiques et auditables."
  options:
    a: { en: "A low temperature reduces variability but doesn't make the model's decision deterministic or auditable.", fr: "Une température basse réduit la variabilité, mais ne rend la décision du modèle ni déterministe ni auditable." }
    c: { en: "A more capable model still makes a probabilistic decision that can't be reproduced or audited like a rule.", fr: "Un modèle plus performant prend toujours une décision probabiliste, qui ne peut pas être reproduite ni auditée comme une règle." }
    d: { en: "A critique pass may catch some errors, but both decisions remain model outputs, not fixed rules.", fr: "Une passe de critique peut détecter certaines erreurs, mais les deux décisions restent des sorties de modèle, pas des règles fixes." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs
