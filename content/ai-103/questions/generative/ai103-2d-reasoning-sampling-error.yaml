id: ai103-2d-reasoning-sampling-error
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam classifies support tickets by calling the Responses API. The team replaced a **gpt-4.1-mini** deployment with an **o4-mini** deployment and kept the request unchanged:

    ```json
    { "model": "o4-mini", "temperature": 0.1, "max_output_tokens": 300, "input": "..." }
    ```

    The requests now fail with an error about an unsupported parameter. When the calls worked in a test without that parameter, each classification took several seconds and used many output tokens.

    You need the requests to succeed, and you need to reduce latency and cost for this simple task while you keep the o4-mini deployment. What should you do?
  fr: |
    Fabrikam classe les tickets de support en appelant l'API Responses. L'équipe a remplacé un déploiement **gpt-4.1-mini** par un déploiement **o4-mini** sans modifier la requête :

    ```json
    { "model": "o4-mini", "temperature": 0.1, "max_output_tokens": 300, "input": "..." }
    ```

    Les requêtes échouent désormais avec une erreur indiquant un paramètre non pris en charge. Lors d'un test sans ce paramètre, les appels fonctionnaient, mais chaque classification prenait plusieurs secondes et consommait beaucoup de jetons de sortie.

    Vous devez faire aboutir les requêtes et réduire la latence et le coût de cette tâche simple tout en conservant le déploiement o4-mini. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace temperature with top_p set to 0.1, and lower max_output_tokens to 100.", fr: "Remplacer temperature par top_p défini sur 0,1, et réduire max_output_tokens à 100." } }
    - { id: b, text: { en: "Remove temperature, and set the reasoning effort to low in the reasoning object.", fr: "Supprimer temperature, et définir l'effort de raisonnement sur low dans l'objet reasoning." } }
    - { id: c, text: { en: "Set temperature to 0, and replace max_output_tokens with max_tokens set to 100.", fr: "Définir temperature sur 0, et remplacer max_output_tokens par max_tokens défini sur 100." } }
    - { id: d, text: { en: "Remove temperature, and set the reasoning effort to high in the reasoning object.", fr: "Supprimer temperature, et définir l'effort de raisonnement sur high dans l'objet reasoning." } }
answer: { optionId: b }
explanation:
  correct:
    en: Most reasoning models, o4-mini included, reject sampling parameters such as temperature and top_p, so the parameter must be removed. The reasoning effort controls how long the model thinks; a low effort reduces reasoning tokens, which are billed as output tokens, and therefore latency and cost on a simple classification.
    fr: "La plupart des modèles de raisonnement, dont o4-mini, refusent les paramètres d'échantillonnage comme temperature et top_p : le paramètre doit donc être supprimé. L'effort de raisonnement détermine la durée de réflexion du modèle ; un effort low réduit les jetons de raisonnement, facturés comme des jetons de sortie, et donc la latence et le coût d'une classification simple."
  options:
    a: { en: "top_p isn't supported by o4-mini either, and a lower cap can leave the response incomplete because reasoning tokens count against it.", fr: "top_p n'est pas non plus pris en charge par o4-mini, et un plafond plus bas peut laisser la réponse incomplète, car les jetons de raisonnement y sont décomptés." }
    c: { en: "Reasoning models reject temperature whatever its value, and max_tokens isn't supported by them either.", fr: "Les modèles de raisonnement refusent temperature quelle que soit sa valeur, et ils ne prennent pas non plus en charge max_tokens." }
    d: { en: "A high effort makes the model reason longer, which increases latency and output-token cost.", fr: "Un effort high fait raisonner le modèle plus longtemps, ce qui augmente la latence et le coût en jetons de sortie." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
