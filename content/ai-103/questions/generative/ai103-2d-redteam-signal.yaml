id: ai103-2d-redteam-signal
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs a customer agent in Foundry Agent Service. An Application Insights resource is connected to the project, and continuous evaluation already scores sampled production responses for violence and self-harm.

    The security team now wants a recurring signal, shown on the agent's Monitor tab, that reveals whether adversarial inputs can make the agent leak sensitive data or perform prohibited actions, before real attackers find these weaknesses.

    What should you configure?
  fr: |
    Wingtip Toys exécute un agent client dans Foundry Agent Service. Une ressource Application Insights est connectée au projet, et l'évaluation continue note déjà les réponses de production échantillonnées pour la violence et l'automutilation.

    L'équipe de sécurité veut maintenant un signal récurrent, affiché dans l'onglet Monitor de l'agent, qui révèle si des entrées adverses peuvent amener l'agent à divulguer des données sensibles ou à effectuer des actions interdites, avant que de vrais attaquants ne trouvent ces faiblesses.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Scheduled red team scans of the agent in the Monitor settings.", fr: "Des analyses de red teaming planifiées de l'agent dans les paramètres Monitor." } }
    - { id: b, text: { en: "Content recording in the tracing settings of the client application.", fr: "L'enregistrement du contenu dans les paramètres de suivi de l'application cliente." } }
    - { id: c, text: { en: "Additional evaluators in the existing continuous evaluation of production traffic.", fr: "Des évaluateurs supplémentaires dans l'évaluation continue existante du trafic de production." } }
    - { id: d, text: { en: "Annotate-only mode for the content filter of the agent's model deployment.", fr: "Le mode annotation seule pour le filtre de contenu du déploiement de modèle de l'agent." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Red team scans run adversarial tests against the agent to detect risks such as data leakage or prohibited actions, and they can be put on a schedule from the Monitor settings. Their outcomes appear as red teaming results on the dashboard, where a failed scan points to a security risk to remediate."
    fr: "Les analyses de red teaming exécutent des tests adverses contre l'agent pour détecter des risques comme la fuite de données ou les actions interdites, et elles peuvent être planifiées depuis les paramètres Monitor. Leurs résultats apparaissent comme résultats de red teaming dans le tableau de bord, où une analyse en échec signale un risque de sécurité à corriger."
  options:
    b: { en: "Content recording stores message contents in traces; it doesn't generate adversarial inputs or test for weaknesses.", fr: "L'enregistrement du contenu stocke le contenu des messages dans les traces ; il ne génère pas d'entrées adverses et ne teste pas les faiblesses." }
    c: { en: "Continuous evaluation scores the traffic that real users send, so it can't reveal weaknesses before attackers exploit them.", fr: "L'évaluation continue note le trafic qu'envoient les vrais utilisateurs : elle ne peut pas révéler les faiblesses avant que des attaquants ne les exploitent." }
    d: { en: "Annotate-only mode returns filter annotations without blocking; it doesn't probe the agent with attacks.", fr: "Le mode annotation seule renvoie les annotations du filtre sans bloquer ; il ne sonde pas l'agent avec des attaques." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
