id: ai103-2c-a2a-target-prereqs
objective: "2.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has two Foundry projects. A project named sales contains an agent named quote-agent. A project named pricing contains an agent named rates-agent, which is owned by another team.

    You add an A2A tool to quote-agent. Its project connection targets the A2A base path of rates-agent and authenticates with the project managed identity of sales. Calls from quote-agent to rates-agent fail.

    Which two actions should the pricing team perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose de deux projets Foundry. Un projet nommé sales contient un agent nommé quote-agent. Un projet nommé pricing contient un agent nommé rates-agent, qui appartient à une autre équipe.

    Vous ajoutez un outil A2A à quote-agent. Sa connexion de projet cible le chemin de base A2A de rates-agent et s'authentifie avec l'identité managée du projet sales. Les appels de quote-agent vers rates-agent échouent.

    Quelles sont les deux actions que l'équipe pricing doit effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable incoming A2A on rates-agent.", fr: "Activer l'A2A entrant sur rates-agent." } }
    - { id: b, text: { en: "Enable streaming responses for rates-agent.", fr: "Activer les réponses diffusées en continu pour rates-agent." } }
    - { id: c, text: { en: "Assign the managed identity of sales the Foundry Agent Consumer role on pricing.", fr: "Attribuer à l'identité managée de sales le rôle Foundry Agent Consumer sur pricing." } }
    - { id: d, text: { en: "Assign the managed identity of sales the Search Index Data Reader role on pricing.", fr: "Attribuer à l'identité managée de sales le rôle Search Index Data Reader sur pricing." } }
    - { id: e, text: { en: "Switch rates-agent to the A2A protocol version 0.3.", fr: "Faire passer rates-agent à la version 0.3 du protocole A2A." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      A Foundry agent can be called through A2A only after incoming A2A is enabled on it. The calling identity, here the project managed identity of sales, also needs the Foundry Agent Consumer role or higher on the target project.
    fr: |
      Un agent Foundry ne peut être appelé par A2A qu'une fois l'A2A entrant activé sur lui. L'identité appelante, ici l'identité managée du projet sales, a aussi besoin du rôle Foundry Agent Consumer ou supérieur sur le projet cible.
  options:
    b:
      en: |
        Streaming responses aren't supported for Foundry agent targets over A2A, and streaming isn't what blocks the calls.
      fr: |
        Les réponses diffusées en continu ne sont pas prises en charge pour les agents Foundry cibles en A2A, et ce n'est pas ce qui bloque les appels.
    d:
      en: |
        Search Index Data Reader grants access to Azure AI Search index data, not permission to call an agent.
      fr: |
        Search Index Data Reader donne accès aux données d'un index Azure AI Search, pas l'autorisation d'appeler un agent.
    e:
      en: |
        Foundry agent targets support the generally available A2A 1.0 and the preview 0.3; downgrading doesn't grant access.
      fr: |
        Les agents Foundry cibles prennent en charge A2A 1.0 en disponibilité générale et 0.3 en préversion ; revenir à une version antérieure n'accorde aucun accès.
references:
  - title: Connect to an A2A agent endpoint from Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent
