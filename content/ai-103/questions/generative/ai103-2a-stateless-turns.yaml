id: ai103-2a-stateless-turns
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum builds a multi-turn assistant on a model deployment by using the Responses API. The compliance team requires that the service does not retain response data. Each turn must still take the previous turns of the conversation into account.

    What should the application do?
  fr: |
    Adatum développe un assistant multitour sur un déploiement de modèle à l'aide de l'API Responses. L'équipe de conformité exige que le service ne conserve pas les données des réponses. Chaque tour doit néanmoins tenir compte des tours précédents de la conversation.

    Que doit faire l'application ?
body:
  options:
    - { id: a, text: { en: "Set store=False and pass previous_response_id with the ID of the last response.", fr: "Définir store=False et passer previous_response_id avec l'ID de la dernière réponse." } }
    - { id: b, text: { en: "Keep the default storage and call responses.delete for each response when the conversation ends.", fr: "Conserver le stockage par défaut et appeler responses.delete pour chaque réponse à la fin de la conversation." } }
    - { id: c, text: { en: "Set store=False and add the output items of each response to the input of the next request.", fr: "Définir store=False et ajouter les éléments de sortie de chaque réponse à l'entrée de la requête suivante." } }
    - { id: d, text: { en: "Set background=True and pass previous_response_id with the ID of the last response.", fr: "Définir background=True et passer previous_response_id avec l'ID de la dernière réponse." } }
answer: { optionId: c }
explanation:
  correct:
    en: By default, response data is retained for 30 days. With `store=False` nothing is kept by the service, so the application chains the turns itself by carrying the previous output items forward in the input list (`inputs += response.output`).
    fr: |
      Par défaut, les données des réponses sont conservées 30 jours. Avec `store=False`, le service ne conserve rien : l'application enchaîne elle-même les tours en reportant les éléments de sortie précédents dans la liste d'entrée (`inputs += response.output`).
  options:
    a:
      en: previous_response_id refers to a response stored by the service; with store=False there is no stored response to chain from.
      fr: previous_response_id fait référence à une réponse stockée par le service ; avec store=False, il n'existe aucune réponse stockée à enchaîner.
    b:
      en: The responses are stored during the whole conversation, which breaks the requirement even if they are deleted afterward.
      fr: Les réponses sont stockées pendant toute la conversation, ce qui enfreint l'exigence même si elles sont supprimées ensuite.
    d:
      en: Background mode runs long requests asynchronously; it does not stop the service from retaining responses.
      fr: Le mode arrière-plan exécute les requêtes longues de façon asynchrone ; il n'empêche pas le service de conserver les réponses.
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
