id: ai103-2a-hybrid-json
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso's RAG application queries an Azure AI Search index named **manuals** through the REST API. The index contains a searchable text field named content, a vector field named contentVector with an Azure OpenAI vectorizer, and a semantic configuration named **manuals-semantic**.

    You need a single request that combines keyword and vector retrieval for the user's question, reranks the results with semantic ranker, and returns five chunks.

    How should you complete the request body? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'application RAG de Contoso interroge un index Azure AI Search nommé **manuals** à l'aide de l'API REST. L'index contient un champ de texte interrogeable nommé content, un champ vectoriel nommé contentVector doté d'un vectoriseur Azure OpenAI, et une configuration sémantique nommée **manuals-semantic**.

    Vous avez besoin d'une seule requête qui combine la récupération par mot clé et la récupération vectorielle pour la question de l'utilisateur, reclasse les résultats avec le classement sémantique et renvoie cinq blocs.

    Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "search": [[search]],
      "vectorQueries": [
        {
          "kind": "text",
          "text": "pump rattles after a restart",
          "fields": [[field]],
          "k": 50
        }
      ],
      "queryType": [[qt]],
      "semanticConfiguration": "manuals-semantic",
      "top": 5
    }
  slots:
    - id: search
      options:
        - { id: star, text: "\"*\"" }
        - { id: question, text: "\"pump rattles after a restart\"" }
        - { id: semconf, text: "\"manuals-semantic\"" }
    - id: field
      options:
        - { id: content, text: "\"content\"" }
        - { id: vector, text: "\"contentVector\"" }
        - { id: both, text: "\"content, contentVector\"" }
    - id: qt
      options:
        - { id: simple, text: "\"simple\"" }
        - { id: full, text: "\"full\"" }
        - { id: semantic, text: "\"semantic\"" }
answer:
  values: { search: question, field: vector, qt: semantic }
explanation:
  correct:
    en: In a hybrid request, `search` carries the full-text query (the user's question) and `vectorQueries` targets the vector field; with kind text, the vectorizer on contentVector converts the text at query time. `queryType` set to semantic, with a semantic configuration, invokes semantic ranker on the merged results, and `top` limits the response to five chunks.
    fr: Dans une requête hybride, `search` porte la requête en texte intégral (la question de l'utilisateur) et `vectorQueries` cible le champ vectoriel ; avec le type text, le vectoriseur de contentVector convertit le texte au moment de la requête. `queryType` défini sur semantic, avec une configuration sémantique, appelle le classement sémantique sur les résultats fusionnés, et `top` limite la réponse à cinq blocs.
  options:
    star: { en: "search=* matches every document without a keyword query, and semantic ranker has no query text to rank.", fr: "search=* correspond à tous les documents sans requête par mot clé, et le classement sémantique n'a aucun texte de requête à classer." }
    semconf: { en: "The semantic configuration name goes in semanticConfiguration, not in the search string.", fr: "Le nom de la configuration sémantique va dans semanticConfiguration, pas dans la chaîne de recherche." }
    content: { en: "content is a text field; a vector query must target vector fields.", fr: "content est un champ de texte ; une requête vectorielle doit cibler des champs vectoriels." }
    both: { en: "fields lists vector fields only; content is not a vector field.", fr: "fields liste uniquement des champs vectoriels ; content n'est pas un champ vectoriel." }
    simple: { en: "simple is the default full-text syntax; it does not invoke semantic ranker.", fr: "simple est la syntaxe de texte intégral par défaut ; elle n'appelle pas le classement sémantique." }
    full: { en: "full enables the Lucene query syntax; it does not invoke semantic ranker.", fr: "full active la syntaxe de requête Lucene ; elle n'appelle pas le classement sémantique." }
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
