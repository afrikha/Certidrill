id: ai103-sr1-refund-approval-3
objective: "2.2.5"
type: series_yesno
series: ai103-sr1-refund-approval
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You set require_approval to always and send every approval request to a supervisor.
  fr: Vous définissez require_approval sur always et envoyez chaque demande d'approbation à un superviseur.
body:
  solution:
    en: |
      You define the tool as follows. The app sends every `mcp_approval_request` to the review page and returns the supervisor's decision in an `mcp_approval_response` item in the same conversation.

      ```python
      tool = MCPTool(
          server_label="orders",
          server_url=ORDERS_MCP_URL,
          require_approval="always",
      )
      ```
    fr: |
      Vous définissez l'outil comme suit. L'application envoie chaque `mcp_approval_request` à la page de revue et renvoie la décision du superviseur dans un élément `mcp_approval_response` dans la même conversation.

      ```python
      tool = MCPTool(
          server_label="orders",
          server_url=ORDERS_MCP_URL,
          require_approval="always",
      )
      ```
answer: { value: false }
explanation:
  correct:
    en: With `require_approval="always"`, the read-only tools also wait for a supervisor, so the agent cannot call them without waiting. Because `allowed_tools` is omitted, the agent can use every tool the server exposes, including `delete_customer`, which a supervisor could approve.
    fr: "Avec `require_approval=\"always\"`, les outils en lecture seule attendent aussi un superviseur : l'agent ne peut pas les appeler sans attendre. Comme `allowed_tools` est omis, l'agent peut utiliser tous les outils exposés par le serveur, y compris `delete_customer`, qu'un superviseur pourrait approuver."
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
