id: ai103-2d-router-context-subset
objective: "2.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware uses a model router deployment named **router-main** with the Balanced routing mode and the default set of models. Most prompts are short, but contract reviews send prompts of about 150,000 tokens, which only some of the underlying models can accept. These long requests fail intermittently, while identical requests sometimes succeed.

    You need the long requests to succeed every time. The solution must keep model router choosing the most cost-effective model for each prompt. What should you do?
  fr: |
    Litware utilise un déploiement de model router nommé **router-main** avec le mode de routage Balanced et l'ensemble de modèles par défaut. La plupart des invites sont courtes, mais les revues de contrats envoient des invites d'environ 150 000 jetons, que seuls certains des modèles sous-jacents peuvent accepter. Ces longues requêtes échouent par intermittence, alors que des requêtes identiques réussissent parfois.

    Vous devez faire réussir les longues requêtes à chaque fois. La solution doit permettre au model router de continuer à choisir le modèle le plus économique pour chaque invite. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the routing mode of router-main to Quality so that the most capable model handles each prompt.", fr: "Passer le mode de routage de router-main à Quality pour que le modèle le plus performant traite chaque invite." } }
    - { id: b, text: { en: "Raise max_output_tokens on the contract review requests so that the long prompts have enough room.", fr: "Augmenter max_output_tokens sur les requêtes de revue de contrats pour que les longues invites disposent de suffisamment de place." } }
    - { id: c, text: { en: "Send contract reviews to a router deployment whose model subset has only large-context models.", fr: "Envoyer les revues de contrats à un déploiement de router dont le sous-ensemble n'a que des modèles à grand contexte." } }
    - { id: d, text: { en: "Redeploy router-main as a Data Zone Standard deployment so that requests stay in one data zone.", fr: "Redéployer router-main comme déploiement Data Zone Standard pour que les requêtes restent dans une zone de données." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The effective context window of model router is limited by the smallest underlying model, so a large prompt succeeds only when it happens to be routed to a model that accepts it. A model subset restricted to models that support the required context removes the failing choices, and the router still picks the most cost-effective model within that subset."
    fr: "La fenêtre de contexte effective du model router est limitée par le plus petit modèle sous-jacent : une invite volumineuse ne réussit que si elle est routée par chance vers un modèle qui l'accepte. Un sous-ensemble limité aux modèles qui prennent en charge le contexte requis supprime les choix voués à l'échec, et le router choisit toujours le modèle le plus économique dans ce sous-ensemble."
  options:
    a: { en: "Quality mode picks the highest-quality model and ignores cost, which breaks the cost requirement, and it doesn't guarantee a large-context model.", fr: "Le mode Quality choisit le modèle de meilleure qualité sans tenir compte du coût, ce qui enfreint l'exigence de coût, et il ne garantit pas un modèle à grand contexte." }
    b: { en: "The output token cap doesn't change which model receives the prompt or the size of its context window.", fr: "Le plafond de jetons de sortie ne change ni le modèle qui reçoit l'invite ni la taille de sa fenêtre de contexte." }
    d: { en: "The deployment type changes where data is processed, not the models that the router can choose.", fr: "Le type de déploiement change le lieu de traitement des données, pas les modèles que le router peut choisir." }
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router
