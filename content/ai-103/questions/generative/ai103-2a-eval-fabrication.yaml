id: ai103-2a-eval-fabrication
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's RAG assistant answers questions about warranty terms. Users report that some answers state warranty periods that appear nowhere in the retrieved passages. Your test dataset contains the query, the retrieved context and the response for each item.

    You need an evaluator that detects these fabricated claims.

    Which evaluator should you use?
  fr: |
    L'assistant RAG de Fabrikam répond à des questions sur les conditions de garantie. Des utilisateurs signalent que certaines réponses indiquent des durées de garantie qui n'apparaissent nulle part dans les passages récupérés. Votre jeu de données de test contient la requête, le contexte récupéré et la réponse pour chaque élément.

    Vous avez besoin d'un évaluateur qui détecte ces affirmations inventées.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Relevance }
    - { id: b, text: Fluency }
    - { id: c, text: Coherence }
    - { id: d, text: Groundedness }
answer: { optionId: d }
explanation:
  correct:
    en: Groundedness measures whether the response aligns with the context without fabricating content; it is the precision aspect of a RAG answer. It needs the response and the context, and returns a 1–5 score with a pass or fail label.
    fr: Groundedness mesure si la réponse est cohérente avec le contexte sans inventer de contenu ; c'est l'aspect précision d'une réponse RAG. Il a besoin de la réponse et du contexte, et renvoie un score de 1 à 5 avec une étiquette réussite ou échec.
  options:
    a:
      en: Relevance checks whether the response addresses the query; an answer can be on topic and still invent a warranty period.
      fr: Relevance vérifie si la réponse traite la requête ; une réponse peut être dans le sujet et inventer quand même une durée de garantie.
    b:
      en: Fluency rates grammar and readability, not consistency with the context.
      fr: Fluency évalue la grammaire et la lisibilité, pas la cohérence avec le contexte.
    c:
      en: Coherence rates the logical presentation of ideas, not whether they are supported by the context.
      fr: Coherence évalue la présentation logique des idées, pas le fait qu'elles soient étayées par le contexte.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
