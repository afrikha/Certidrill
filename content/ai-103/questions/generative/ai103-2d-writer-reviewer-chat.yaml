id: ai103-2d-writer-reviewer-chat
objective: "2.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys uses Microsoft Agent Framework in Python. Two Foundry agents, `writer` and `reviewer`, must refine product descriptions: the writer drafts, the reviewer critiques, and the writer revises, taking turns in that order. The conversation must end once it contains six messages.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise Microsoft Agent Framework en Python. Deux agents Foundry, `writer` et `reviewer`, doivent affiner des descriptions de produits : le rédacteur rédige, le relecteur critique et le rédacteur révise, à tour de rôle dans cet ordre. La conversation doit se terminer dès qu'elle contient six messages.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from agent_framework.orchestrations import GroupChatBuilder, GroupChatState

    def round_robin_selector(state: GroupChatState) -> str:
        names = list(state.participants.keys())
        turn = [[turn]]
        return names[turn % len(names)]

    workflow = GroupChatBuilder(
        participants=[writer, reviewer],
        [[term]],
        selection_func=round_robin_selector,
    ).build()
  slots:
    - id: turn
      options:
        - { id: round, text: state.current_round }
        - { id: count, text: len(state.participants) }
        - { id: zero, text: "0" }
    - id: term
      options:
        - { id: ge6, text: "termination_condition=lambda conversation: len(conversation) >= 6" }
        - { id: lt6, text: "termination_condition=lambda conversation: len(conversation) < 6" }
        - { id: inter, text: "intermediate_output_from=[writer, reviewer]" }
answer:
  values: { turn: round, term: ge6 }
explanation:
  correct:
    en: "Group chat orchestration suits writer and reviewer refinement: an orchestrator picks the next speaker and all agents see the full history. Indexing the participants with state.current_round alternates the writer and the reviewer. The termination_condition receives the conversation and ends the chat when the function returns True, here at six messages."
    fr: "L'orchestration de conversation de groupe convient à l'affinage rédacteur-relecteur : un orchestrateur choisit le prochain intervenant et tous les agents voient l'historique complet. Indexer les participants avec state.current_round fait alterner le rédacteur et le relecteur. termination_condition reçoit la conversation et met fin à l'échange quand la fonction renvoie True, ici à six messages."
  options:
    count: { en: "The number of participants never changes, so the same agent would speak every turn.", fr: "Le nombre de participants ne change jamais : le même agent parlerait à chaque tour." }
    zero: { en: "A constant index always selects the first participant, so the reviewer never speaks.", fr: "Un index constant sélectionne toujours le premier participant : le relecteur ne parle jamais." }
    lt6: { en: "This condition is true from the first message, so the chat would end before any review.", fr: "Cette condition est vraie dès le premier message : l'échange se terminerait avant toute relecture." }
    inter: { en: "intermediate_output_from chooses whose intermediate outputs are surfaced; it doesn't end the conversation.", fr: "intermediate_output_from choisit les participants dont les sorties intermédiaires sont exposées ; il ne met pas fin à la conversation." }
references:
  - title: Microsoft Agent Framework Workflows Orchestrations - Group Chat
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/group-chat
