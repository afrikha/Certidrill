id: ai103-2d-monitor-live-evals
objective: "2.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has deployed a prompt agent named **claims-helper** in a Foundry project. The project's managed identity already has the Foundry User role, and the operations team has the Log Analytics Reader role on the resources it monitors.

    You need the **Monitor** tab of claims-helper to show token usage and latency, and evaluation scores computed on samples of production traffic.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation a déployé un agent d'invite nommé **claims-helper** dans un projet Foundry. L'identité managée du projet dispose déjà du rôle Foundry User, et l'équipe d'exploitation dispose du rôle Log Analytics Reader sur les ressources qu'elle surveille.

    Vous devez faire afficher par l'onglet **Monitor** de claims-helper l'utilisation des jetons et la latence, ainsi que des scores d'évaluation calculés sur des échantillons du trafic de production.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Connect an Application Insights resource to the project.", fr: "Connecter une ressource Application Insights au projet." } }
    - { id: b, text: { en: "Configure continuous evaluation for the agent with the evaluators to run.", fr: "Configurer l'évaluation continue de l'agent avec les évaluateurs à exécuter." } }
    - { id: c, text: { en: "Enable content recording in the client application's tracing settings.", fr: "Activer l'enregistrement du contenu dans les paramètres de suivi de l'application cliente." } }
    - { id: d, text: { en: "Schedule a red teaming scan of the agent with an attack template.", fr: "Planifier une analyse de red teaming de l'agent avec un modèle d'attaque." } }
    - { id: e, text: { en: "Run a cloud evaluation of the agent on a test dataset before each release.", fr: "Exécuter une évaluation cloud de l'agent sur un jeu de données de test avant chaque mise en production." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "The Agent Monitoring Dashboard reads its telemetry from the Application Insights resource connected to the project, which provides token usage and latency. Continuous evaluation samples live traffic as it occurs and runs the configured evaluators, whose scores appear in the evaluation metrics of the dashboard."
    fr: "Le tableau de bord de surveillance des agents lit sa télémétrie dans la ressource Application Insights connectée au projet, qui fournit l'utilisation des jetons et la latence. L'évaluation continue échantillonne le trafic réel au fil de l'eau et exécute les évaluateurs configurés, dont les scores apparaissent dans les métriques d'évaluation du tableau de bord."
  options:
    c: { en: "Content recording adds message contents to client-side traces; the dashboard doesn't need it.", fr: "L'enregistrement du contenu ajoute le contenu des messages aux traces côté client ; le tableau de bord n'en a pas besoin." }
    d: { en: "Red teaming runs adversarial tests; its results are shown separately and aren't scores on production traffic.", fr: "Le red teaming exécute des tests adverses ; ses résultats sont affichés à part et ne sont pas des scores sur le trafic de production." }
    e: { en: "A pre-release evaluation runs on a test dataset, not on samples of production traffic.", fr: "Une évaluation avant mise en production s'exécute sur un jeu de données de test, pas sur des échantillons du trafic de production." }
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
