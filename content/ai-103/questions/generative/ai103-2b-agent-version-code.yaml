id: ai103-2b-agent-version-code
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation is defining a returns agent in Python. The project contains a deployment named returns-chat, and `order_tool` is an existing `FunctionTool`. Each change to the role and goal of the agent must create a new version that the team can roll back to. The definition must not use preview features.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation définit un agent de retours en Python. Le projet contient un déploiement nommé returns-chat, et `order_tool` est un `FunctionTool` existant. Chaque modification du rôle et de l'objectif de l'agent doit créer une nouvelle version vers laquelle l'équipe peut revenir. La définition ne doit pas utiliser de fonctionnalités en préversion.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.projects.models import PromptAgentDefinition

    agent = project.agents.[[s1]](
        agent_name="returns-agent",
        definition=[[s2]](
            model="returns-chat",
            [[s3]]=(
                "You are the returns assistant of Adatum. Goal: resolve return requests. "
                "Use get_order before answering any question about an order. "
                "Never promise a refund above 500 USD; hand off to a human instead."
            ),
            tools=[order_tool],
        ),
    )
    print(agent.name, agent.version)
  slots:
    - id: s1
      options:
        - { id: delete, text: delete_version }
        - { id: create, text: create_version }
        - { id: classic, text: create_agent }
    - id: s2
      options:
        - { id: prompt, text: PromptAgentDefinition }
        - { id: workflow, text: WorkflowAgentDefinition }
        - { id: func, text: FunctionTool }
    - id: s3
      options:
        - { id: input, text: input }
        - { id: desc, text: description }
        - { id: instr, text: instructions }
answer:
  values: { s1: create, s2: prompt, s3: instr }
explanation:
  correct:
    en: |
      `project.agents.create_version()` stores the agent as a named, versioned asset: each call creates a new version, identified by the agent name and version, that you can compare and roll back to. A `PromptAgentDefinition` combines the deployment, the instructions and the tools, and `instructions` carries the role, goal and rules that govern the model.
    fr: |
      `project.agents.create_version()` stocke l'agent comme une ressource nommée et versionnée : chaque appel crée une nouvelle version, identifiée par le nom de l'agent et sa version, que vous pouvez comparer et vers laquelle vous pouvez revenir. Une `PromptAgentDefinition` combine le déploiement, les instructions et les outils, et `instructions` porte le rôle, l'objectif et les règles qui régissent le modèle.
  options:
    delete: { en: "delete_version removes an agent version.", fr: "delete_version supprime une version d'agent." }
    classic: { en: "create_agent belongs to the classic Agents API, which identified agents by a GUID instead of a name and version.", fr: "create_agent appartient à l'API Agents classique, qui identifiait les agents par un GUID au lieu d'un nom et d'une version." }
    workflow: { en: "WorkflowAgentDefinition defines a workflow agent, a preview feature that requires allow_preview.", fr: "WorkflowAgentDefinition définit un agent de workflow, une fonctionnalité en préversion qui nécessite allow_preview." }
    func: { en: "FunctionTool defines a tool, not an agent definition.", fr: "FunctionTool définit un outil, pas une définition d'agent." }
    input: { en: "input is the user input of a response request, not part of the agent definition.", fr: "input est l'entrée utilisateur d'une requête de réponse, pas un élément de la définition de l'agent." }
    desc: { en: "A description documents the agent for people; the rules that the model follows go in instructions.", fr: "Une description documente l'agent pour les personnes ; les règles que suit le modèle vont dans instructions." }
references:
  - title: Build with runtime components in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
  - title: azure.ai.projects.AIProjectClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.aiprojectclient
