id: ai103-2b-agent-consumer
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry project named fin-prj that contains five agents. A containerized application in Azure Container Apps uses a user-assigned managed identity to call the agent named loan-faq.

    The identity must be able to call loan-faq only. It must not be able to call the other agents, build agents, or manage models.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un projet Foundry nommé fin-prj qui contient cinq agents. Une application conteneurisée dans Azure Container Apps utilise une identité managée affectée par l'utilisateur pour appeler l'agent nommé loan-faq.

    L'identité doit pouvoir appeler uniquement loan-faq. Elle ne doit pas pouvoir appeler les autres agents, créer des agents ni gérer des modèles.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In the portal, assign the Foundry Agent Consumer role to the identity at the scope of the Foundry resource", fr: "Dans le portail, attribuer le rôle Foundry Agent Consumer à l'identité à l'étendue de la ressource Foundry" } }
    - { id: b, text: { en: "By using Azure CLI, assign the Foundry Agent Consumer role to the identity at the scope of the loan-faq agent", fr: "À l'aide d'Azure CLI, attribuer le rôle Foundry Agent Consumer à l'identité à l'étendue de l'agent loan-faq" } }
    - { id: c, text: { en: "By using Azure CLI, assign the Foundry Agent Consumer role to the identity at the scope of the fin-prj project", fr: "À l'aide d'Azure CLI, attribuer le rôle Foundry Agent Consumer à l'identité à l'étendue du projet fin-prj" } }
    - { id: d, text: { en: "In the portal, assign the Foundry User role to the identity at the scope of the fin-prj project", fr: "Dans le portail, attribuer le rôle Foundry User à l'identité à l'étendue du projet fin-prj" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Foundry Agent Consumer only allows calls to agent endpoints: it can't build agents or manage models. Assigned at the scope of one agent (`.../projects/<project>/agents/<agent>`), it limits access to that agent. The portal supports only account-scope assignments for this role, so the agent-scope assignment is made with Azure CLI.
    fr: |
      Foundry Agent Consumer autorise uniquement les appels aux points de terminaison des agents : il ne permet ni de créer des agents ni de gérer des modèles. Attribué à l'étendue d'un agent (`.../projects/<project>/agents/<agent>`), il limite l'accès à cet agent. Le portail ne prend en charge que les attributions de ce rôle à l'étendue du compte : l'attribution à l'étendue de l'agent se fait avec Azure CLI.
  options:
    a: { en: "At the resource scope, the identity could call every agent of every project in the resource.", fr: "À l'étendue de la ressource, l'identité pourrait appeler tous les agents de tous les projets de la ressource." }
    c: { en: "At the project scope, the role grants access to every agent endpoint in fin-prj, including the four other agents.", fr: "À l'étendue du projet, le rôle accorde l'accès à tous les points de terminaison d'agents de fin-prj, y compris les quatre autres agents." }
    d: { en: "Foundry User also grants build and develop data actions and access to every agent of the project.", fr: "Foundry User accorde aussi les actions de données de création et de développement, ainsi que l'accès à tous les agents du projet." }
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
