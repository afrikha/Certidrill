id: ai103-2c-csv-totals-tool
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. is building a sales assistant agent in Microsoft Foundry. Sales managers upload CSV exports of up to 50,000 order lines to a conversation. The agent must calculate exact totals per region and month and return a bar chart of the results.

    You must not write or host any calculation code yourself.

    Which tool should you add to the agent?
  fr: |
    Proseware, Inc. crée un agent d'assistance commerciale dans Microsoft Foundry. Les responsables commerciaux chargent dans une conversation des exports CSV contenant jusqu'à 50 000 lignes de commande. L'agent doit calculer des totaux exacts par région et par mois, et renvoyer un graphique à barres des résultats.

    Vous ne devez écrire ni héberger vous-même aucun code de calcul.

    Quel outil devez-vous ajouter à l'agent ?
body:
  options:
    - { id: a, text: File search }
    - { id: b, text: Azure AI Search }
    - { id: c, text: Grounding with Bing Search }
    - { id: d, text: Code interpreter }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Code interpreter lets the agent write and run Python code in a sandboxed environment managed by the service. The agent can load the uploaded CSV file, aggregate every row exactly and generate a chart file, without any code that you write or host.
    fr: |
      L'interpréteur de code (Code interpreter) permet à l'agent d'écrire et d'exécuter du code Python dans un environnement isolé géré par le service. L'agent peut charger le fichier CSV, agréger exactement chaque ligne et générer un fichier de graphique, sans code que vous écrivez ou hébergez.
  options:
    a:
      en: |
        File search retrieves relevant chunks of documents for the model to read; it doesn't run calculations over all rows, so the totals wouldn't be exact.
      fr: |
        La recherche de fichiers (File search) récupère des segments pertinents de documents pour que le modèle les lise ; elle n'exécute pas de calculs sur toutes les lignes, donc les totaux ne seraient pas exacts.
    b:
      en: |
        Azure AI Search grounds the agent on an existing index; it neither processes a file uploaded to the conversation nor computes aggregates and charts.
      fr: |
        Azure AI Search ancre l'agent sur un index existant ; il ne traite pas un fichier chargé dans la conversation et ne calcule ni agrégats ni graphiques.
    c:
      en: |
        Grounding with Bing Search returns public web information; it doesn't process the uploaded data.
      fr: |
        Grounding with Bing Search renvoie des informations publiques du web ; il ne traite pas les données chargées.
references:
  - title: Code Interpreter tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/code-interpreter
