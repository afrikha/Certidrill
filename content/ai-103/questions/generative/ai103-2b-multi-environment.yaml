id: ai103-2b-multi-environment
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. deploys the same Python application to development, test, and production. Each environment has its own Foundry project and its own hosting service with a managed identity.

    Requirements:

    - The same code must run unchanged in every environment.
    - No secret may be stored in the code or the configuration.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. déploie la même application Python en développement, en test et en production. Chaque environnement dispose de son propre projet Foundry et de son propre service d'hébergement doté d'une identité managée.

    Exigences :

    - Le même code doit s'exécuter sans modification dans chaque environnement.
    - Aucun secret ne doit être stocké dans le code ni dans la configuration.

    Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Hard-code the development project endpoint, and replace it in the release pipeline of each environment", fr: "Coder en dur le point de terminaison du projet de développement, et le remplacer dans le pipeline de mise en production de chaque environnement" } }
    - { id: b, text: { en: "Read the project endpoint from an environment variable that each hosting service sets", fr: "Lire le point de terminaison du projet dans une variable d'environnement définie par chaque service d'hébergement" } }
    - { id: c, text: { en: "Store the API key of each Foundry resource in an environment variable of its hosting service", fr: "Stocker la clé API de chaque ressource Foundry dans une variable d'environnement de son service d'hébergement" } }
    - { id: d, text: { en: "Create the client with DefaultAzureCredential, and assign each managed identity the Foundry User role on its project", fr: "Créer le client avec DefaultAzureCredential, et attribuer à chaque identité managée le rôle Foundry User sur son projet" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The project endpoint is the only value that changes between environments, so it belongs in configuration, such as an environment variable like FOUNDRY_PROJECT_ENDPOINT used by the Foundry samples. `DefaultAzureCredential` picks up the managed identity of each hosting service, and the Foundry User role on its own project authorizes the calls without any secret.
    fr: |
      Le point de terminaison du projet est la seule valeur qui change d'un environnement à l'autre : il a sa place dans la configuration, par exemple une variable d'environnement comme FOUNDRY_PROJECT_ENDPOINT, utilisée par les exemples Foundry. `DefaultAzureCredential` utilise l'identité managée de chaque service d'hébergement, et le rôle Foundry User sur son propre projet autorise les appels sans aucun secret.
  options:
    a: { en: "Rewriting the endpoint in the code for each environment means the code isn't the same everywhere.", fr: "Réécrire le point de terminaison dans le code pour chaque environnement signifie que le code n'est pas le même partout." }
    c: { en: "An API key in an environment variable is a secret stored in the configuration.", fr: "Une clé API dans une variable d'environnement est un secret stocké dans la configuration." }
references:
  - title: Azure AI Projects client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-projects-readme
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
