id: ai103-2b-anthropic-client
objective: "2.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. deployed the claude-sonnet-4-6 model in its Foundry resource named contoso-ai, with the deployment name review-claude. A Python application in the legal department must call this deployment with the Anthropic SDK and Microsoft Entra ID authentication.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. a déployé le modèle claude-sonnet-4-6 dans sa ressource Foundry nommée contoso-ai, sous le nom de déploiement review-claude. Une application Python du service juridique doit appeler ce déploiement avec le SDK Anthropic et l'authentification Microsoft Entra ID.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from anthropic import AnthropicFoundry
    from azure.identity import DefaultAzureCredential, get_bearer_token_provider

    token_provider = get_bearer_token_provider(
        DefaultAzureCredential(), "https://ai.azure.com/.default"
    )

    client = AnthropicFoundry(
        [[s1]]=token_provider,
        base_url="https://contoso-ai.services.ai.azure.com/[[s2]]",
    )

    message = client.messages.create(
        model=[[s3]],
        messages=[{"role": "user", "content": "Review this clause."}],
        max_tokens=1024,
    )
    print(message.content[0].text)
  slots:
    - id: s1
      options:
        - { id: adtp, text: azure_ad_token_provider }
        - { id: apikey, text: api_key }
        - { id: headers, text: default_headers }
    - id: s2
      options:
        - { id: v1, text: openai/v1 }
        - { id: anthropic, text: anthropic }
        - { id: project, text: api/projects/legal }
    - id: s3
      options:
        - { id: dep, text: '"review-claude"' }
        - { id: model, text: '"claude-sonnet-4-6"' }
        - { id: res, text: '"contoso-ai"' }
answer:
  values: { s1: adtp, s2: anthropic, s3: dep }
explanation:
  correct:
    en: |
      Claude models in Foundry are called with the Anthropic SDK on the `https://<resource-name>.services.ai.azure.com/anthropic` endpoint. The `AnthropicFoundry` client takes the Microsoft Entra token provider in `azure_ad_token_provider`, and `model` takes the deployment name.
    fr: |
      Les modèles Claude de Foundry s'appellent avec le SDK Anthropic sur le point de terminaison `https://<resource-name>.services.ai.azure.com/anthropic`. Le client `AnthropicFoundry` reçoit le fournisseur de jetons Microsoft Entra dans `azure_ad_token_provider`, et `model` attend le nom du déploiement.
  options:
    apikey: { en: "In the Learn sample for AnthropicFoundry, the Entra token provider goes in azure_ad_token_provider; api_key is for key-based authentication.", fr: "Dans l'exemple Learn pour AnthropicFoundry, le fournisseur de jetons Entra est passé dans azure_ad_token_provider ; api_key sert à l'authentification par clé." }
    headers: { en: "default_headers takes a dictionary of static headers, not a token provider.", fr: "default_headers attend un dictionnaire d'en-têtes statiques, pas un fournisseur de jetons." }
    v1: { en: "/openai/v1 serves the OpenAI SDK, not the Anthropic Messages API.", fr: "/openai/v1 sert le SDK OpenAI, pas l'API Messages d'Anthropic." }
    project: { en: "The project endpoint is used by AIProjectClient, not by the Anthropic SDK.", fr: "Le point de terminaison du projet est utilisé par AIProjectClient, pas par le SDK Anthropic." }
    model: { en: "The model parameter takes the deployment name, which differs from the model name here.", fr: "Le paramètre model attend le nom du déploiement, qui diffère ici du nom du modèle." }
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
