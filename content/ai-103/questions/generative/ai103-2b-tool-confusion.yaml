id: ai103-2b-tool-confusion
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has an order agent with two function tools: get_order_status and cancel_order. The descriptions of both tools currently read "Handles an order". The instructions of the agent don't mention the tools. Traces show that the agent sometimes calls cancel_order when a customer only asks where an order is.

    Which two changes address the cause of the problem?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un agent de commandes doté de deux outils de fonction : get_order_status et cancel_order. Les descriptions des deux outils indiquent actuellement « Handles an order ». Les instructions de l'agent ne mentionnent pas les outils. Les traces montrent que l'agent appelle parfois cancel_order quand un client demande seulement où en est une commande.

    Quelles sont les deux modifications qui traitent la cause du problème ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach the memory search tool so that the agent learns which tool each customer needs", fr: "Attacher l'outil de recherche de mémoire pour que l'agent apprenne quel outil chaque client nécessite" } }
    - { id: b, text: { en: "Rewrite each tool description to state what the tool does and when to use it", fr: "Réécrire la description de chaque outil pour indiquer ce que fait l'outil et quand l'utiliser" } }
    - { id: c, text: { en: "Set additionalProperties to true in the schemas of both tools", fr: "Définir additionalProperties sur true dans les schémas des deux outils" } }
    - { id: d, text: { en: "Increase max_output_tokens in the requests to the agent", fr: "Augmenter max_output_tokens dans les requêtes adressées à l'agent" } }
    - { id: e, text: { en: "State in the instructions that cancel_order is used only when the customer explicitly asks to cancel", fr: "Indiquer dans les instructions que cancel_order n'est utilisé que lorsque le client demande explicitement l'annulation" } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The model picks a tool from its name and description and from the rules in the instructions. Identical, vague descriptions and instructions that say nothing about the tools are the cause: precise descriptions and an explicit rule for cancel_order fix the selection.
    fr: |
      Le modèle choisit un outil d'après son nom et sa description, ainsi que d'après les règles des instructions. Des descriptions identiques et vagues, et des instructions muettes sur les outils, sont la cause : des descriptions précises et une règle explicite pour cancel_order corrigent la sélection.
  options:
    a: { en: "Memory stores user knowledge across sessions; it doesn't define when a tool applies.", fr: "La mémoire stocke des connaissances sur l'utilisateur d'une session à l'autre ; elle ne définit pas quand un outil s'applique." }
    c: { en: "additionalProperties controls undeclared arguments, not which tool the model chooses.", fr: "additionalProperties contrôle les arguments non déclarés, pas l'outil que choisit le modèle." }
    d: { en: "The output token limit doesn't influence tool selection.", fr: "La limite de jetons de sortie n'influence pas la sélection des outils." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
