id: ai103-2a-plain-function
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware is designing a multistep pipeline for supplier invoices. A model extracts the line items, a second step computes the VAT amount from those items with a fixed legal formula, and a third step drafts an email to the supplier.

    The VAT amount must be exact and reproducible, at the lowest possible cost.

    How should you implement the VAT step?
  fr: |
    Proseware conçoit un pipeline en plusieurs étapes pour les factures fournisseurs. Un modèle extrait les lignes de facture, une deuxième étape calcule le montant de TVA à partir de ces lignes avec une formule légale fixe, et une troisième étape rédige un e-mail au fournisseur.

    Le montant de TVA doit être exact et reproductible, au coût le plus bas possible.

    Comment devez-vous implémenter l'étape de TVA ?
body:
  options:
    - { id: a, text: { en: "As a call to a reasoning model with a high reasoning effort", fr: "Sous forme d'appel à un modèle de raisonnement avec un effort de raisonnement élevé" } }
    - { id: b, text: { en: "As a regular function in the pipeline code, with no model call", fr: "Sous forme de fonction classique dans le code du pipeline, sans appel de modèle" } }
    - { id: c, text: { en: "As a prompt with few-shot examples of VAT calculations", fr: "Sous forme d'invite avec des exemples few-shot de calculs de TVA" } }
    - { id: d, text: { en: "As an agent that decides by itself how to compute the amount", fr: "Sous forme d'agent qui décide lui-même comment calculer le montant" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A step that a fixed formula can solve is deterministic code, not a model task. Agent Framework guidance is to prefer a function over an AI agent whenever a function can handle the task. Code is exact, reproducible and costs no tokens.
    fr: |
      Une étape qu'une formule fixe peut résoudre relève du code déterministe, pas d'une tâche de modèle. Agent Framework recommande de préférer une fonction à un agent IA chaque fois qu'une fonction peut traiter la tâche. Le code est exact, reproductible et ne consomme aucun jeton.
  options:
    a:
      en: A reasoning model can compute the amount but is not guaranteed to be exact and adds the cost of reasoning tokens.
      fr: Un modèle de raisonnement peut calculer le montant, mais sans garantie d'exactitude et avec le coût des jetons de raisonnement.
    c:
      en: Few-shot examples improve the format, not the arithmetic exactness, and every call still costs tokens.
      fr: Les exemples few-shot améliorent le format, pas l'exactitude du calcul, et chaque appel consomme toujours des jetons.
    d:
      en: An autonomous agent adds cost and unpredictability to a step whose logic is fully known.
      fr: Un agent autonome ajoute du coût et de l'imprévisibilité à une étape dont la logique est entièrement connue.
references:
  - title: Microsoft Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/overview/
