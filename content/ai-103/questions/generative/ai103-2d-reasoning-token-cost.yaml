id: ai103-2d-reasoning-token-cost
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam classifies invoices into four categories with an **o3** deployment through the Responses API. The finance team reports that the output-token cost is far higher than expected for one-word answers. A typical response contains the following usage object:

    ```json
    "usage": {
      "input_tokens": 640,
      "output_tokens": 5210,
      "output_tokens_details": { "reasoning_tokens": 4980 },
      "total_tokens": 5850
    }
    ```

    You need to reduce the cost per request while keeping the o3 deployment and getting a complete answer for every request. What should you do?
  fr: |
    Fabrikam classe des factures en quatre catégories avec un déploiement **o3** via l'API Responses. Le service financier signale que le coût en jetons de sortie est bien plus élevé que prévu pour des réponses d'un seul mot. Une réponse type contient l'objet d'utilisation suivant :

    ```json
    "usage": {
      "input_tokens": 640,
      "output_tokens": 5210,
      "output_tokens_details": { "reasoning_tokens": 4980 },
      "total_tokens": 5850
    }
    ```

    Vous devez réduire le coût par requête tout en conservant le déploiement o3 et en obtenant une réponse complète pour chaque requête. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Shorten the instructions and the invoice text sent in the input.", fr: "Raccourcir les instructions et le texte de facture envoyés en entrée." } }
    - { id: b, text: { en: "Set max_output_tokens to 300 so that each response stops early.", fr: "Définir max_output_tokens sur 300 pour que chaque réponse s'arrête plus tôt." } }
    - { id: c, text: { en: "Lower the reasoning effort of the requests to low.", fr: "Abaisser l'effort de raisonnement des requêtes à low." } }
    - { id: d, text: { en: "Set temperature to 0 so that the model answers more directly.", fr: "Définir temperature sur 0 pour que le modèle réponde plus directement." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Almost all output tokens are reasoning tokens, which are billed as output tokens even though they never appear in the answer. A lower reasoning effort makes the model think less on this simple task, which reduces the reasoning tokens and therefore the cost."
    fr: "Presque tous les jetons de sortie sont des jetons de raisonnement, facturés comme des jetons de sortie bien qu'ils n'apparaissent jamais dans la réponse. Un effort de raisonnement plus faible fait moins réfléchir le modèle sur cette tâche simple, ce qui réduit les jetons de raisonnement et donc le coût."
  options:
    a: { en: "Input tokens are only 640 of the total; the cost comes from the reasoning tokens.", fr: "Les jetons d'entrée ne représentent que 640 jetons du total ; le coût vient des jetons de raisonnement." }
    b: { en: "The cap includes reasoning tokens, so many responses would end incomplete with no answer while the reasoning tokens are still billed.", fr: "Le plafond inclut les jetons de raisonnement : de nombreuses réponses se termineraient incomplètes, sans réponse, tandis que les jetons de raisonnement resteraient facturés." }
    d: { en: "o3 doesn't support temperature, and temperature doesn't control how long the model reasons.", fr: "o3 ne prend pas en charge temperature, et temperature ne contrôle pas la durée de raisonnement du modèle." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
