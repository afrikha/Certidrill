id: ai103-2c-search-private-index
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Foundry resource that was deployed with the basic agent setup. An Azure AI Search service named srch-legal has public network access disabled and is reachable only through a private endpoint in a virtual network named vnet-legal.

    You add the Azure AI Search tool to a prompt agent and point it to an index on srch-legal. The agent fails to connect to the index.

    Public network access on srch-legal must stay disabled. What should you do?
  fr: |
    Contoso, Ltd. dispose d'une ressource Microsoft Foundry déployée avec la configuration d'agent de base. Un service Azure AI Search nommé srch-legal a l'accès réseau public désactivé et n'est accessible que par un point de terminaison privé dans un réseau virtuel nommé vnet-legal.

    Vous ajoutez l'outil Azure AI Search à un agent d'invite et le faites pointer vers un index de srch-legal. L'agent ne parvient pas à se connecter à l'index.

    L'accès réseau public de srch-legal doit rester désactivé. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the basic setup and change the search connection to use an admin API key.", fr: "Conserver la configuration de base et modifier la connexion de recherche pour utiliser une clé API d'administration." } }
    - { id: b, text: { en: "Keep the basic setup and replace the tool with the file search tool on the same index.", fr: "Conserver la configuration de base et remplacer l'outil par l'outil de recherche de fichiers sur le même index." } }
    - { id: c, text: { en: "Use the standard agent setup with virtual network injection and a managed identity connection.", fr: "Utiliser la configuration d'agent standard avec injection de réseau virtuel et une connexion par identité managée." } }
    - { id: d, text: { en: "Keep the basic setup and create a shared private link from srch-legal to the Foundry resource.", fr: "Conserver la configuration de base et créer une liaison privée partagée de srch-legal vers la ressource Foundry." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Foundry resource with basic agent deployments doesn't support an Azure AI Search service that has public network access disabled and a private endpoint. You need the standard agent setup with virtual network injection, and in a private network the connection must use Microsoft Entra ID with a managed identity because key-based authentication isn't supported there.
    fr: |
      Une ressource Foundry avec des déploiements d'agent de base ne prend pas en charge un service Azure AI Search dont l'accès réseau public est désactivé et qui a un point de terminaison privé. Il faut la configuration d'agent standard avec injection de réseau virtuel ; dans un réseau privé, la connexion doit utiliser Microsoft Entra ID avec une identité managée, car l'authentification par clé n'y est pas prise en charge.
  options:
    a:
      en: |
        Key-based authentication isn't supported with private virtual networking, and the basic setup still can't reach the private endpoint.
      fr: |
        L'authentification par clé n'est pas prise en charge avec un réseau virtuel privé, et la configuration de base ne peut toujours pas atteindre le point de terminaison privé.
    b:
      en: |
        The file search tool searches the agent's vector stores; it can't query an Azure AI Search index.
      fr: |
        L'outil de recherche de fichiers interroge les magasins de vecteurs de l'agent ; il ne peut pas interroger un index Azure AI Search.
    d:
      en: |
        A shared private link lets the search service reach other resources privately, such as an indexer data source; it doesn't give the agent a path into vnet-legal.
      fr: |
        Une liaison privée partagée permet au service de recherche d'atteindre d'autres ressources en privé, par exemple la source de données d'un indexeur ; elle ne donne pas à l'agent un chemin vers vnet-legal.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search
