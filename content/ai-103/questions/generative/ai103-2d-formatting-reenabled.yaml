id: ai103-2d-formatting-reenabled
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware builds a code-review assistant on a **gpt-5-mini** reasoning deployment. The developer message describes the review criteria but says nothing about the layout of the answer. The web interface renders Markdown, but the reviews arrive as long paragraphs, without headings or fenced code blocks.

    You need to make the reviews use Markdown headings and fenced code blocks. What should you do?
  fr: |
    Proseware développe un assistant de revue de code sur un déploiement de raisonnement **gpt-5-mini**. Le message developer décrit les critères de revue mais ne dit rien de la mise en forme de la réponse. L'interface web affiche le Markdown, mais les revues arrivent sous forme de longs paragraphes, sans titres ni blocs de code délimités.

    Vous devez faire en sorte que les revues utilisent des titres Markdown et des blocs de code délimités. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the reasoning effort to high so that the model plans the layout of each review.", fr: "Définir l'effort de raisonnement sur high pour que le modèle planifie la disposition de chaque revue." } }
    - { id: b, text: { en: "Add \"Think step by step and show each step\" at the end of the developer message.", fr: "Ajouter « Think step by step and show each step » à la fin du message developer." } }
    - { id: c, text: { en: "Set the response format to JSON mode so that the model returns structured reviews.", fr: "Définir le format de réponse sur le mode JSON pour que le modèle renvoie des revues structurées." } }
    - { id: d, text: { en: "State the required output structure, with headings and fenced code blocks, in the developer message.", fr: "Indiquer dans le message developer la structure de sortie attendue, avec des titres et des blocs de code délimités." } }
answer: { optionId: d }
explanation:
  correct:
    en: Specifying the output structure in the prompt has a significant effect on the form of the results, and the developer message carries the instructions of the request. The model can't know that the interface renders Markdown unless the instructions say which structure to use.
    fr: Spécifier la structure de sortie dans l'invite a un effet important sur la forme des résultats, et le message developer porte les instructions de la requête. Le modèle ne peut pas savoir que l'interface affiche le Markdown si les instructions n'indiquent pas la structure à utiliser.
  options:
    a: { en: "The reasoning effort changes how much the model reasons, not the format of the answer, and it adds latency and cost.", fr: "L'effort de raisonnement modifie la quantité de raisonnement du modèle, pas le format de la réponse, et il ajoute de la latence et du coût." }
    b: { en: "Chain-of-thought prompting applies only to non-reasoning models, and it asks for the steps, not for a layout.", fr: "Le prompting par chaîne de pensée ne s'applique qu'aux modèles sans raisonnement, et il demande les étapes, pas une mise en forme." }
    c: { en: "JSON mode makes the model return JSON, which the interface wouldn't render as headings and code blocks.", fr: "Le mode JSON fait renvoyer du JSON au modèle, que l'interface n'afficherait pas sous forme de titres et de blocs de code." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
