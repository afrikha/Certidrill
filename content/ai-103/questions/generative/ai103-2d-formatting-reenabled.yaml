id: ai103-2d-formatting-reenabled
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware builds a code-review assistant on an **o3-mini** deployment. The web interface renders Markdown, but the responses arrive as plain text without code fences or headings.

    You need to increase the likelihood that the model formats its responses in Markdown. What should you do?
  fr: |
    Proseware développe un assistant de revue de code sur un déploiement **o3-mini**. L'interface web affiche le Markdown, mais les réponses arrivent en texte brut, sans blocs de code délimités ni titres.

    Vous devez augmenter la probabilité que le modèle mette en forme ses réponses en Markdown. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the reasoning effort to high so that the model plans the layout of each response.", fr: "Définir l'effort de raisonnement sur high pour que le modèle planifie la disposition de chaque réponse." } }
    - { id: b, text: { en: "Replace the developer message with a system message that contains the same instructions.", fr: "Remplacer le message developer par un message système contenant les mêmes instructions." } }
    - { id: c, text: { en: "Set the response format to JSON mode so that the model returns structured content.", fr: "Définir le format de réponse sur le mode JSON pour que le modèle renvoie un contenu structuré." } }
    - { id: d, text: { en: "Start the developer message with the string Formatting re-enabled.", fr: "Commencer le message developer par la chaîne Formatting re-enabled." } }
answer: { optionId: d }
explanation:
  correct:
    en: By default, o3-mini and o1 don't attempt to produce Markdown. Adding the string `Formatting re-enabled` at the beginning of the developer message increases the likelihood of Markdown output, without guaranteeing it; a more descriptive variant can ask for code blocks explicitly.
    fr: Par défaut, o3-mini et o1 ne cherchent pas à produire du Markdown. Ajouter la chaîne `Formatting re-enabled` au début du message developer augmente la probabilité d'une sortie en Markdown, sans la garantir ; une variante plus descriptive peut demander explicitement des blocs de code.
  options:
    a: { en: "The reasoning effort changes how long the model thinks, not whether it emits Markdown.", fr: "L'effort de raisonnement modifie la durée de réflexion du modèle, pas le fait qu'il produise du Markdown." }
    b: { en: "Developer messages are functionally the same as system messages, so switching the role changes nothing.", fr: "Les messages developer sont fonctionnellement identiques aux messages système : changer de rôle ne change rien." }
    c: { en: "JSON mode makes the model return JSON, which the interface wouldn't render as formatted Markdown.", fr: "Le mode JSON fait renvoyer du JSON au modèle, que l'interface n'afficherait pas comme du Markdown mis en forme." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
