id: ai103-2c-guardrail-tool-coverage
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has a Foundry agent named sourcing-agent that runs without human approval. It has two tools:

    - An OpenAPI tool that calls a supplier catalog API.
    - An MCP tool that connects to a vendor's remote MCP server.

    Suppliers and the vendor control the content that both tools return. You assign sourcing-agent a guardrail that contains a control for the Indirect attack risk on the Tool response intervention point, with the Annotate and block action.

    Which tool responses are scanned by this control?
  fr: |
    Northwind Traders dispose d'un agent Foundry nommé sourcing-agent qui s'exécute sans approbation humaine. Il possède deux outils :

    - Un outil OpenAPI qui appelle une API de catalogue fournisseurs.
    - Un outil MCP qui se connecte au serveur MCP distant d'un éditeur.

    Les fournisseurs et l'éditeur contrôlent le contenu que renvoient les deux outils. Vous attribuez à sourcing-agent un garde-fou qui contient un contrôle pour le risque Indirect attack sur le point d'intervention Tool response, avec l'action Annotate and block.

    Quelles réponses d'outil sont analysées par ce contrôle ?
body:
  options:
    - { id: a, text: { en: "The responses of both tools", fr: "Les réponses des deux outils" } }
    - { id: b, text: { en: "Only the responses of the OpenAPI tool", fr: "Uniquement les réponses de l'outil OpenAPI" } }
    - { id: c, text: { en: "Only the responses of the MCP tool", fr: "Uniquement les réponses de l'outil MCP" } }
    - { id: d, text: { en: "Neither, because tool controls apply only to model deployments", fr: "Aucune, car les contrôles d'outil s'appliquent uniquement aux déploiements de modèle" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Tool call and tool response controls take effect only for a list of supported tools: Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric data agent, Bing grounding, Bing Custom Search and Browser Automation. The MCP tool isn't in that list, so its responses aren't scanned; you need another safeguard for it, such as human approval of its calls.
    fr: |
      Les contrôles d'appel d'outil et de réponse d'outil ne prennent effet que pour une liste d'outils pris en charge : Azure AI Search, Azure Functions, OpenAPI, SharePoint grounding, Fabric data agent, Bing grounding, Bing Custom Search et Browser Automation. L'outil MCP ne figure pas dans cette liste : ses réponses ne sont pas analysées, et il lui faut une autre mesure de protection, par exemple l'approbation humaine de ses appels.
  options:
    a:
      en: |
        Controls configured at the tool response point don't take effect for tools outside the supported list, which excludes MCP.
      fr: |
        Les contrôles configurés au point de réponse d'outil ne prennent pas effet pour les outils hors de la liste prise en charge, qui exclut MCP.
    c:
      en: |
        MCP isn't a supported tool for tool response controls, while OpenAPI is.
      fr: |
        MCP n'est pas un outil pris en charge pour les contrôles de réponse d'outil, alors qu'OpenAPI l'est.
    d:
      en: |
        Guardrails can be applied directly to agents, and the tool call and tool response intervention points exist for agent tools.
      fr: |
        Les garde-fous peuvent être appliqués directement aux agents, et les points d'intervention d'appel et de réponse d'outil existent pour les outils d'agent.
references:
  - title: Intervention points
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/intervention-points
