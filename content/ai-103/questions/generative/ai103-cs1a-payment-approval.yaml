id: ai103-cs1a-payment-approval
objective: "2.2.5"
type: dropdown
caseStudy: ai103-cs1a-humongous
difficulty: 3
status: draft
stem:
  en: |
    You are adding payments-mcp to claims-assistant by using the Python SDK. You need to meet the payments requirement. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous ajoutez payments-mcp à claims-assistant à l'aide du SDK Python. Vous devez satisfaire l'exigence relative aux paiements. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    tool = MCPTool(
        server_label="payments",
        server_url=PAYMENTS_MCP_URL,
        require_approval=[[approval]],
        allowed_tools=[[allowed]],
        project_connection_id=PAYMENTS_CONNECTION_ID,
    )

    # After each response from claims-assistant
    for item in response.output:
        if item.type == "[[itemtype]]":
            show_to_adjuster(item.name, item.arguments, item.id)
  slots:
    - id: approval
      options:
        - { id: always, text: "\"always\"" }
        - { id: never, text: "\"never\"" }
        - { id: alwayslist, text: "{\"always\": [\"issue_payment\"]}" }
        - { id: neverlist, text: "{\"never\": [\"issue_payment\"]}" }
    - id: allowed
      options:
        - { id: empty, text: "[]" }
        - { id: three, text: "[\"get_claim_status\", \"get_payment_history\", \"issue_payment\"]" }
        - { id: one, text: "[\"issue_payment\"]" }
    - id: itemtype
      options:
        - { id: request, text: "mcp_approval_request" }
        - { id: response, text: "mcp_approval_response" }
        - { id: call, text: "function_call" }
answer:
  values: { approval: alwayslist, allowed: three, itemtype: request }
explanation:
  correct:
    en: "`{\"always\": [\"issue_payment\"]}` requires approval only for the listed tool, so status and history reads run without approval. A nonempty `allowed_tools` list restricts the agent to the named tools, which excludes cancel_payment. When a call needs approval, the response contains an `mcp_approval_request` item; the application answers with an `mcp_approval_response` in the same conversation."
    fr: "`{\"always\": [\"issue_payment\"]}` n'exige une approbation que pour l'outil listé : les lectures d'état et d'historique s'exécutent donc sans approbation. Une liste `allowed_tools` non vide limite l'agent aux outils nommés, ce qui exclut cancel_payment. Quand un appel exige une approbation, la réponse contient un élément `mcp_approval_request` ; l'application répond par un `mcp_approval_response` dans la même conversation."
  options:
    always:
      en: "\"always\" is the default and requires approval for every call, including get_claim_status and get_payment_history."
      fr: "\"always\" est la valeur par défaut et exige une approbation pour chaque appel, y compris get_claim_status et get_payment_history."
    never:
      en: "\"never\" lets the agent call issue_payment without any approval."
      fr: "\"never\" permet à l'agent d'appeler issue_payment sans aucune approbation."
    neverlist:
      en: "{\"never\": [\"issue_payment\"]} lists the tools that do not require approval, which is the opposite of the requirement."
      fr: "{\"never\": [\"issue_payment\"]} liste les outils qui n'exigent pas d'approbation, soit l'inverse de l'exigence."
    empty:
      en: "An empty list does not mean zero tools: it allows every tool of the server, including cancel_payment."
      fr: "Une liste vide ne signifie pas zéro outil : elle autorise tous les outils du serveur, y compris cancel_payment."
    one:
      en: "Allowing only issue_payment removes the status and history tools that claims-assistant must be able to call."
      fr: "N'autoriser qu'issue_payment retire les outils d'état et d'historique que claims-assistant doit pouvoir appeler."
    response:
      en: "mcp_approval_response is the item that the application sends back; it is not in the output of the agent."
      fr: "mcp_approval_response est l'élément que l'application renvoie ; il ne figure pas dans la sortie de l'agent."
references:
  - title: Connect agents to Model Context Protocol servers
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
