id: ai103-2d-trace-find-step
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs a support agent in Foundry Agent Service. An Application Insights resource is connected to the project. Users report that some answers take more than 20 seconds. Each run calls a search tool, a stock API exposed as a function, and the model.

    You need to identify which step of a slow run causes the delay. What should you use?
  fr: |
    Northwind Traders exécute un agent de support dans Foundry Agent Service. Une ressource Application Insights est connectée au projet. Des utilisateurs signalent que certaines réponses prennent plus de 20 secondes. Chaque exécution appelle un outil de recherche, une API de stock exposée comme fonction, et le modèle.

    Vous devez identifier l'étape d'une exécution lente qui provoque le délai. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The latency chart of the agent's Monitor tab for the last 24 hours.", fr: "Le graphique de latence de l'onglet Monitor de l'agent sur les dernières 24 heures." } }
    - { id: b, text: { en: "The trace of a slow run on the Traces tab, comparing the duration of each span.", fr: "La trace d'une exécution lente dans l'onglet Traces, en comparant la durée de chaque étendue." } }
    - { id: c, text: { en: "An Azure Monitor alert that fires when the average response time exceeds 20 seconds.", fr: "Une alerte Azure Monitor qui se déclenche quand le temps de réponse moyen dépasse 20 secondes." } }
    - { id: d, text: { en: "A continuous evaluation that runs the Task Completion evaluator on sampled runs.", fr: "Une évaluation continue qui exécute l'évaluateur Task Completion sur des exécutions échantillonnées." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A trace records each operation of a run as a span with its start and end times, such as the execute_tool spans of the tools and the model calls. Comparing span durations in one slow trace shows which step causes the delay."
    fr: "Une trace enregistre chaque opération d'une exécution sous forme d'étendue avec ses heures de début et de fin, comme les étendues execute_tool des outils et les appels au modèle. Comparer les durées des étendues dans une trace lente montre l'étape à l'origine du délai."
  options:
    a: { en: "The Monitor tab shows aggregate latency over time; it tells you that runs are slow, not which step is slow.", fr: "L'onglet Monitor affiche la latence agrégée dans le temps ; il indique que les exécutions sont lentes, pas quelle étape l'est." }
    c: { en: "An alert notifies you when latency rises but doesn't break a run down into its steps.", fr: "Une alerte vous prévient quand la latence augmente, mais ne décompose pas une exécution en étapes." }
    d: { en: "Task Completion judges whether the task was completed end to end; it doesn't measure the duration of each step.", fr: "Task Completion juge si la tâche a été accomplie de bout en bout ; il ne mesure pas la durée de chaque étape." }
references:
  - title: Agent tracing overview
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
