id: ai103-2c-monitor-no-data
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. deployed a prompt agent named claims-agent in a Foundry project two weeks ago. The agent handles hundreds of conversations per day.

    The operations team opens the Monitor tab of claims-agent to view token usage, latency and run success rate, but the dashboard shows no data. No other observability resource has been configured for the project.

    What should you do first?
  fr: |
    Fabrikam, Inc. a déployé il y a deux semaines un agent d'invite nommé claims-agent dans un projet Foundry. L'agent traite des centaines de conversations par jour.

    L'équipe d'exploitation ouvre l'onglet Monitor de claims-agent pour consulter l'utilisation des jetons, la latence et le taux de réussite des exécutions, mais le tableau de bord n'affiche aucune donnée. Aucune autre ressource d'observabilité n'a été configurée pour le projet.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Create a continuous evaluation rule for claims-agent.", fr: "Créer une règle d'évaluation continue pour claims-agent." } }
    - { id: b, text: { en: "Enable content recording in the client application.", fr: "Activer l'enregistrement du contenu dans l'application cliente." } }
    - { id: c, text: { en: "Schedule a red team scan from the Monitor settings.", fr: "Planifier une analyse de red teaming depuis les paramètres de Monitor." } }
    - { id: d, text: { en: "Connect an Application Insights resource to the project.", fr: "Connecter une ressource Application Insights au projet." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Agent Monitoring Dashboard reads its telemetry from an Application Insights resource connected to the project, and monitoring data is stored there. Once the resource is connected, server-side tracing of Foundry-hosted agents starts without code changes.
    fr: |
      Le tableau de bord de surveillance des agents lit sa télémétrie dans une ressource Application Insights connectée au projet, où sont stockées les données de surveillance. Une fois la ressource connectée, le traçage côté serveur des agents hébergés dans Foundry démarre sans modification du code.
  options:
    a:
      en: |
        Continuous evaluation adds evaluation scores, but the dashboard still needs a connected Application Insights resource to show any metric.
      fr: |
        L'évaluation continue ajoute des scores d'évaluation, mais le tableau de bord a toujours besoin d'une ressource Application Insights connectée pour afficher une métrique.
    b:
      en: |
        Content recording adds message contents to client-side traces; it doesn't provide the telemetry store that the dashboard reads.
      fr: |
        L'enregistrement du contenu ajoute le contenu des messages aux traces côté client ; il ne fournit pas le magasin de télémétrie que lit le tableau de bord.
    c:
      en: |
        Red team scans test the agent for risks; they don't produce token, latency or success rate metrics.
      fr: |
        Les analyses de red teaming testent les risques de l'agent ; elles ne produisent pas de métriques de jetons, de latence ou de taux de réussite.
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
