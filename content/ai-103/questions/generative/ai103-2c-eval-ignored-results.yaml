id: ai103-2c-eval-ignored-results
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has a Foundry agent named policy-agent that has a function tool named get_policy and an MCP tool. While analyzing failed conversations, you find runs in which get_policy returned the correct coverage limits, but the final answer stated a different limit.

    You need to add an evaluator to the release tests that detects this failure mode.

    Which evaluator should you use?
  fr: |
    Contoso, Ltd. dispose d'un agent Foundry nommé policy-agent doté d'un outil de fonction nommé get_policy et d'un outil MCP. En analysant des conversations en échec, vous trouvez des exécutions dans lesquelles get_policy a renvoyé les bons plafonds de garantie, mais la réponse finale indiquait un autre plafond.

    Vous devez ajouter aux tests de mise en production un évaluateur qui détecte ce type d'échec.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Tool Input Accuracy }
    - { id: b, text: Tool Output Utilization }
    - { id: c, text: Tool Call Success }
    - { id: d, text: Tool Selection }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Tool Output Utilization checks whether the agent correctly used the tool results in its reasoning and final response. Here the tool returned the right data and the answer contradicted it, which is exactly what this evaluator detects. Function and MCP tools are among the tools that the tool evaluators support.
    fr: |
      Tool Output Utilization vérifie si l'agent a correctement utilisé les résultats d'outil dans son raisonnement et sa réponse finale. Ici, l'outil a renvoyé les bonnes données et la réponse les a contredites : c'est précisément ce que détecte cet évaluateur. Les outils de fonction et MCP font partie des outils que prennent en charge les évaluateurs d'outil.
  options:
    a:
      en: |
        Tool Input Accuracy checks the parameters passed to the tool; the call itself was correct.
      fr: |
        Tool Input Accuracy vérifie les paramètres transmis à l'outil ; l'appel lui-même était correct.
    c:
      en: |
        Tool Call Success checks for technical errors or exceptions; the tool call succeeded.
      fr: |
        Tool Call Success recherche les erreurs techniques ou les exceptions ; l'appel d'outil a réussi.
    d:
      en: |
        Tool Selection checks whether the right tools were chosen; get_policy was the right tool.
      fr: |
        Tool Selection vérifie si les bons outils ont été choisis ; get_policy était le bon outil.
references:
  - title: Agent evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators
