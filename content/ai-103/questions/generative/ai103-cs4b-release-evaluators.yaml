id: ai103-cs4b-release-evaluators
objective: "2.1.4"
type: dragdrop
caseStudy: ai103-cs4b-consolidated
difficulty: 1
status: draft
stem:
  en: |
    You are configuring the evaluation runs in ops-prj. You need to meet the release evaluation requirement by using built-in evaluators.

    Which evaluator should you use for each check? To answer, drag the appropriate evaluators to the correct checks. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez les exécutions d'évaluation dans ops-prj. Vous devez satisfaire l'exigence relative à l'évaluation avant mise en production à l'aide d'évaluateurs intégrés.

    Quel évaluateur devez-vous utiliser pour chaque vérification ? Pour répondre, faites glisser les évaluateurs appropriés vers les vérifications correspondantes. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grounded, text: Groundedness }
    - { id: relevance, text: Relevance }
    - { id: toolcall, text: Tool Call Accuracy }
    - { id: intent, text: Intent Resolution }
    - { id: bleu, text: BLEU }
    - { id: xpia, text: Indirect Attack (XPIA) }
    - { id: fluency, text: Fluency }
  targets:
    - { id: check1, text: { en: "Check 1", fr: "Vérification 1" } }
    - { id: check2, text: { en: "Check 2", fr: "Vérification 2" } }
    - { id: check3, text: { en: "Check 3", fr: "Vérification 3" } }
    - { id: check4, text: { en: "Check 4", fr: "Vérification 4" } }
answer:
  mapping: { check1: grounded, check2: toolcall, check3: bleu, check4: xpia }
explanation:
  correct:
    en: |
      Groundedness measures how well a response is supported by the retrieved context, which detects unsupported claims. Tool Call Accuracy rates the overall quality of tool calls, including tool selection and parameters. BLEU measures n-gram overlap between a response and a ground truth, here the approved reference translations. Indirect Attack (XPIA) measures whether a response fell for an indirect jailbreak injected through content such as the emails, and it supports model targets such as chat-ops (not agent targets).
    fr: |
      Groundedness mesure dans quelle mesure une réponse est étayée par le contexte récupéré, ce qui détecte les affirmations non étayées. Tool Call Accuracy évalue la qualité globale des appels d'outils, y compris le choix de l'outil et les paramètres. BLEU mesure le recouvrement des n-grammes entre une réponse et une vérité de terrain, ici les traductions de référence approuvées. Indirect Attack (XPIA) mesure si une réponse a cédé à un jailbreak indirect injecté par un contenu comme les e-mails, et il prend en charge les cibles de type modèle comme chat-ops (pas les cibles de type agent).
  options:
    relevance: { en: "Relevance measures how well the response addresses the query, not whether its claims are supported by the retrieved passages.", fr: "Relevance mesure dans quelle mesure la réponse traite la question, pas si ses affirmations sont étayées par les passages récupérés." }
    intent: { en: "Intent Resolution (preview) measures whether the agent identified and addressed the user intent, not the quality of its tool calls.", fr: "Intent Resolution (préversion) mesure si l'agent a identifié et traité l'intention de l'utilisateur, pas la qualité de ses appels d'outils." }
    fluency: { en: "Fluency rates readability and language quality without comparing the notices with reference translations.", fr: "Fluency évalue la lisibilité et la qualité de la langue sans comparer les avis aux traductions de référence." }
references:
  - title: Built-in Evaluators Reference
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
