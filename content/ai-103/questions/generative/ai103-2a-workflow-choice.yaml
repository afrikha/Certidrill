id: ai103-2a-workflow-choice
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum is automating its claims process in Python. The process has well-defined steps: an intake agent validates the claim, a function checks the policy, a pricing agent computes the payout, and a function notifies the customer. The steps must always run in this order.

    What should you build?
  fr: |
    Adatum automatise son processus de sinistres en Python. Le processus comporte des étapes bien définies : un agent de réception valide la déclaration, une fonction vérifie le contrat, un agent de tarification calcule l'indemnité et une fonction prévient le client. Les étapes doivent toujours s'exécuter dans cet ordre.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "An Agent Framework workflow that connects the agents and functions through an explicit execution path", fr: "Un workflow Agent Framework qui relie les agents et les fonctions par un chemin d'exécution explicite" } }
    - { id: b, text: { en: "A single agent that has all the functions as tools and plans the steps by itself", fr: "Un agent unique qui dispose de toutes les fonctions comme outils et planifie lui-même les étapes" } }
    - { id: c, text: { en: "A Magentic orchestration in which a manager agent plans and delegates the steps dynamically", fr: "Une orchestration Magentic dans laquelle un agent gestionnaire planifie et délègue dynamiquement les étapes" } }
    - { id: d, text: { en: "A group chat orchestration in which the agents discuss the claim in a shared conversation", fr: "Une orchestration de conversation de groupe dans laquelle les agents discutent de la déclaration dans une conversation partagée" } }
answer: { optionId: a }
explanation:
  correct:
    en: Agent Framework recommends a workflow when the process has well-defined steps, when you need explicit control over execution order, and when several agents or functions must coordinate. A workflow connects agents and functions through explicit execution paths.
    fr: Agent Framework recommande un workflow lorsque le processus comporte des étapes bien définies, que vous avez besoin d'un contrôle explicite sur l'ordre d'exécution et que plusieurs agents ou fonctions doivent se coordonner. Un workflow relie agents et fonctions par des chemins d'exécution explicites.
  options:
    b:
      en: A single agent suits open-ended tasks with autonomous planning; it does not guarantee the fixed order.
      fr: Un agent unique convient aux tâches ouvertes avec planification autonome ; il ne garantit pas l'ordre fixe.
    c:
      en: In Magentic orchestration a manager agent decides the steps dynamically, which is the opposite of a fixed order.
      fr: Dans une orchestration Magentic, un agent gestionnaire décide dynamiquement des étapes, ce qui est l'inverse d'un ordre fixe.
    d:
      en: Group chat lets agents collaborate in a shared conversation; it does not enforce a sequence that includes plain functions.
      fr: La conversation de groupe permet aux agents de collaborer dans une conversation partagée ; elle n'impose pas une séquence qui inclut des fonctions classiques.
references:
  - title: Microsoft Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/overview/
  - title: Workflow orchestrations in Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations
