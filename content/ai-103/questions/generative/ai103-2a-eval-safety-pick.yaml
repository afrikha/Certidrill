id: ai103-2a-eval-safety-pick
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware is evaluating a coding assistant built on a model deployment, before release. The assistant reads web pages that users paste into the chat. The security team wants the evaluation to detect two risks:

    - responses that contain code with security flaws;
    - responses in which instructions hidden in the pasted pages took control of the model.

    Which two evaluators should you add to the evaluation? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware évalue, avant sa mise en production, un assistant de programmation basé sur un déploiement de modèle. L'assistant lit des pages web que les utilisateurs collent dans la conversation. L'équipe de sécurité veut que l'évaluation détecte deux risques :

    - des réponses qui contiennent du code présentant des failles de sécurité ;
    - des réponses dans lesquelles des instructions cachées dans les pages collées ont pris le contrôle du modèle.

    Quels sont les deux évaluateurs à ajouter à l'évaluation ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Protected material }
    - { id: b, text: Code vulnerability }
    - { id: c, text: Ungrounded attributes }
    - { id: d, text: Indirect attack }
    - { id: e, text: Prohibited actions }
    - { id: f, text: Self-harm }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: The Code vulnerability evaluator detects security weaknesses in generated code. The Indirect attack (XPIA) evaluator detects attacks injected through content the model processes, such as documents or web pages, and it supports model targets.
    fr: L'évaluateur Code vulnerability détecte les failles de sécurité dans le code généré. L'évaluateur Indirect attack (XPIA) détecte les attaques injectées par le contenu que le modèle traite, comme des documents ou des pages web, et il prend en charge les cibles de type modèle.
  options:
    a:
      en: Protected material detects protected content, such as copyrighted text, in responses; it does not detect security flaws or injected instructions.
      fr: Protected material détecte du contenu protégé, comme du texte soumis au droit d'auteur, dans les réponses ; il ne détecte ni les failles de sécurité ni les instructions injectées.
    c:
      en: Ungrounded attributes detects ungrounded inferences about emotional states or protected classes.
      fr: Ungrounded attributes détecte des déductions non étayées sur des états émotionnels ou des catégories protégées.
    e:
      en: Prohibited actions is in preview, supports agent targets only and is not available for model evaluations.
      fr: Prohibited actions est en préversion, ne prend en charge que les cibles de type agent et n'est pas disponible pour les évaluations de modèles.
    f:
      en: Self-harm detects self-harm content, which is not one of the two risks.
      fr: Self-harm détecte du contenu d'automutilation, qui ne fait pas partie des deux risques.
references:
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
