id: ai103-2b-conversation-turns
objective: "2.2.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has an existing prompt agent named hr-agent. You are writing a chat page in which each browser session is one chat with hr-agent. The service must store the history of the chat.

    Which three actions should the page perform in sequence for the first two user messages? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Contoso, Ltd. dispose d'un agent d'invite existant nommé hr-agent. Vous écrivez une page de chat dans laquelle chaque session de navigateur correspond à un chat avec hr-agent. Le service doit stocker l'historique du chat.

    Quelles sont les trois actions que la page doit effectuer dans l'ordre pour les deux premiers messages de l'utilisateur ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - id: create
      text:
        en: |
          When the chat starts, call `conversations.create()` and keep the conversation ID.
        fr: |
          Au démarrage du chat, appeler `conversations.create()` et conserver l'ID de la conversation.
    - id: first
      text:
        en: |
          Send the first user message with `responses.create()` and the conversation ID.
        fr: |
          Envoyer le premier message de l'utilisateur avec `responses.create()` et l'ID de la conversation.
    - id: second
      text:
        en: |
          Send the second user message with `responses.create()` and the same conversation ID, without resending the first message.
        fr: |
          Envoyer le deuxième message de l'utilisateur avec `responses.create()` et le même ID de conversation, sans renvoyer le premier message.
    - id: perturn
      text:
        en: |
          Create a new conversation for the second user message.
        fr: |
          Créer une nouvelle conversation pour le deuxième message de l'utilisateur.
    - id: resend
      text:
        en: |
          Send the second user message together with the first message and the first answer in `input`, with no conversation ID.
        fr: |
          Envoyer le deuxième message de l'utilisateur avec le premier message et la première réponse dans `input`, sans ID de conversation.
    - id: memory
      text:
        en: |
          Write the first turn to a memory store with `begin_update_memories()` before sending the second message.
        fr: |
          Écrire le premier tour dans un magasin de mémoire avec `begin_update_memories()` avant d'envoyer le deuxième message.
answer:
  sequence: [ create, first, second ]
explanation:
  correct:
    en: |
      A conversation stores the items of the exchange on the service. When a conversation is used to generate a response, the full conversation is provided as input to the model and the response is appended to it, so each new message only needs the same conversation ID.
    fr: |
      Une conversation stocke les éléments de l'échange sur le service. Quand une conversation sert à générer une réponse, toute la conversation est fournie en entrée au modèle et la réponse y est ajoutée : chaque nouveau message n'a donc besoin que du même ID de conversation.
  options:
    perturn:
      en: |
        A new conversation starts with an empty history, so the agent would lose the first turn.
      fr: |
        Une nouvelle conversation démarre avec un historique vide : l'agent perdrait le premier tour.
    resend:
      en: |
        Resending the history without a conversation means the service doesn't hold the chat history, which the requirement asks for.
      fr: |
        Renvoyer l'historique sans conversation signifie que le service ne conserve pas l'historique du chat, ce qu'exige la consigne.
    memory:
      en: |
        Memory keeps knowledge across sessions; it isn't needed to keep the context of one conversation.
      fr: |
        La mémoire conserve des connaissances d'une session à l'autre ; elle n'est pas nécessaire pour garder le contexte d'une conversation.
references:
  - title: Build with runtime components in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
