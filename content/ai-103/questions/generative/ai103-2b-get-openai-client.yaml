id: ai103-2b-get-openai-client
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Python application that already creates an `AIProjectClient` named `project` with `DefaultAzureCredential`. The application must now call a model deployment named summarizer through the Responses API.

    The solution must not use API keys and must minimize the amount of code.

    What should you do?
  fr: |
    Tailspin Toys dispose d'une application Python qui crée déjà un `AIProjectClient` nommé `project` avec `DefaultAzureCredential`. L'application doit maintenant appeler un déploiement de modèle nommé summarizer via l'API Responses.

    La solution ne doit pas utiliser de clés API et doit réduire au minimum la quantité de code.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call project.get_openai_client(), and then call responses.create() with model set to summarizer", fr: "Appeler project.get_openai_client(), puis appeler responses.create() avec model défini sur summarizer" } }
    - { id: b, text: { en: "Call project.deployments.get(\"summarizer\"), and then call responses.create() on the returned object", fr: "Appeler project.deployments.get(\"summarizer\"), puis appeler responses.create() sur l'objet renvoyé" } }
    - { id: c, text: { en: "Create an OpenAI client with the /openai/v1 endpoint and the resource key read from an environment variable", fr: "Créer un client OpenAI avec le point de terminaison /openai/v1 et la clé de la ressource lue dans une variable d'environnement" } }
    - { id: d, text: { en: "Call project.connections.get_default(\"AzureOpenAI\", include_credentials=True), and then build a client with the returned key", fr: "Appeler project.connections.get_default(\"AzureOpenAI\", include_credentials=True), puis créer un client avec la clé renvoyée" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      `get_openai_client()` returns an authenticated `openai.OpenAI` client whose base URL is the project endpoint followed by `/openai/v1`. It authenticates with a bearer token provider built from the credential of the project client, for the scope `https://ai.azure.com/.default`, so no key is involved. The deployment name goes in the `model` parameter.
    fr: |
      `get_openai_client()` renvoie un client `openai.OpenAI` authentifié dont l'URL de base est le point de terminaison du projet suivi de `/openai/v1`. Il s'authentifie avec un fournisseur de jetons du porteur créé à partir des informations d'identification du client de projet, pour l'étendue `https://ai.azure.com/.default` : aucune clé n'intervient. Le nom du déploiement est passé dans le paramètre `model`.
  options:
    b: { en: "deployments.get() returns information about a deployment; it doesn't return a client that can generate responses.", fr: "deployments.get() renvoie des informations sur un déploiement ; il ne renvoie pas de client capable de générer des réponses." }
    c: { en: "This works technically, but it uses an API key, which the requirements forbid.", fr: "Cela fonctionne techniquement, mais utilise une clé API, ce que les exigences interdisent." }
    d: { en: "Reading the key from a connection still authenticates with a key and adds code.", fr: "Lire la clé dans une connexion revient toujours à s'authentifier par clé et ajoute du code." }
references:
  - title: azure.ai.projects.AIProjectClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.aiprojectclient
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
