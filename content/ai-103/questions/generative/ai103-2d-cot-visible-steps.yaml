id: ai103-2d-cot-visible-steps
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware's tutoring app uses a **gpt-4.1-mini** deployment, which isn't a reasoning model, to solve multistep math word problems. About one answer in five is wrong, and teachers can't see where the model went wrong.

    You need to reduce reasoning errors and let a reviewer check each intermediate step. The solution must keep the current deployment. What should you do?
  fr: |
    L'application de tutorat de Proseware utilise un déploiement **gpt-4.1-mini**, qui n'est pas un modèle de raisonnement, pour résoudre des problèmes de mathématiques en plusieurs étapes. Environ une réponse sur cinq est fausse, et les enseignants ne voient pas où le modèle s'est trompé.

    Vous devez réduire les erreurs de raisonnement et permettre à un relecteur de vérifier chaque étape intermédiaire. La solution doit conserver le déploiement actuel. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add few-shot examples that show only each problem and its final answer.", fr: "Ajouter des exemples few-shot qui montrent seulement chaque problème et sa réponse finale." } }
    - { id: b, text: { en: "Set the temperature to 0 and ask the model to return only the final answer.", fr: "Définir la température sur 0 et demander au modèle de ne renvoyer que la réponse finale." } }
    - { id: c, text: { en: "Raise max_completion_tokens so that the model has more room to calculate.", fr: "Augmenter max_completion_tokens pour que le modèle dispose de plus de place pour calculer." } }
    - { id: d, text: { en: "Instruct the model to proceed step by step, present every step, and then state the answer.", fr: "Demander au modèle de procéder étape par étape, de présenter chaque étape, puis d'énoncer la réponse." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Chain-of-thought prompting asks a non-reasoning model to proceed step by step and present all the steps, which reduces the possibility of inaccuracy and makes the reasoning easy to assess. A fixed closing format, such as a final answer line, keeps the result easy to parse."
    fr: "Le prompting par chaîne de pensée demande à un modèle sans raisonnement de procéder étape par étape et de présenter toutes les étapes, ce qui réduit le risque d'inexactitude et rend le raisonnement facile à évaluer. Un format final fixe, comme une ligne de réponse finale, garde le résultat facile à analyser."
  options:
    a: { en: "Examples without the intermediate steps teach the model to skip them, so reviewers still see nothing to check.", fr: "Des exemples sans étapes intermédiaires apprennent au modèle à les omettre : les relecteurs n'ont toujours rien à vérifier." }
    b: { en: "A low temperature reduces variability, but returning only the answer removes the steps that reviewers need.", fr: "Une température basse réduit la variabilité, mais ne renvoyer que la réponse supprime les étapes dont les relecteurs ont besoin." }
    c: { en: "The answers aren't truncated; a larger cap doesn't make the model reason or show its steps.", fr: "Les réponses ne sont pas tronquées ; un plafond plus élevé ne fait ni raisonner le modèle ni afficher ses étapes." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
