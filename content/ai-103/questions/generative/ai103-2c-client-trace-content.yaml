id: ai103-2c-client-trace-content
objective: "2.2.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. adds client-side tracing to a Python application that calls a Foundry agent. The application uses `AIProjectInstrumentor` and exports spans to the Application Insights resource connected to the project. No other tracing setting has been changed.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. ajoute le traçage côté client à une application Python qui appelle un agent Foundry. L'application utilise `AIProjectInstrumentor` et exporte les étendues vers la ressource Application Insights connectée au projet. Aucun autre paramètre de traçage n'a été modifié.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The spans include the text of user messages and the arguments of tool calls.
        fr: Les étendues incluent le texte des messages des utilisateurs et les arguments des appels d'outil.
    - id: s2
      text:
        en: "`AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING` must be set to `true` before `AIProjectInstrumentor().instrument()` is called."
        fr: "`AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING` doit être défini sur `true` avant l'appel à `AIProjectInstrumentor().instrument()`."
    - id: s3
      text:
        en: "If the code calls `instrument(enable_content_recording=True)`, content is recorded even when `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` is `false`."
        fr: "Si le code appelle `instrument(enable_content_recording=True)`, le contenu est enregistré même quand `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` vaut `false`."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Content recording is off by default: spans don't capture message contents or tool call parameters until you enable it. `AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING` opts in to GenAI tracing and must be `true` before instrumentation. The `enable_content_recording` parameter takes priority over the environment variable; Learn recommends enabling content recording only in development unless compliance allows it.
    fr: |
      L'enregistrement du contenu est désactivé par défaut : les étendues ne capturent ni le contenu des messages ni les paramètres des appels d'outil tant que vous ne l'activez pas. `AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING` active le traçage GenAI et doit valoir `true` avant l'instrumentation. Le paramètre `enable_content_recording` est prioritaire sur la variable d'environnement ; Learn recommande de n'activer l'enregistrement du contenu qu'en développement, sauf si la conformité le permet.
references:
  - title: Add client-side tracing to Foundry agents (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
