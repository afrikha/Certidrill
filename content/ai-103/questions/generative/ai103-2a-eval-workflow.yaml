id: ai103-2a-eval-workflow
objective: "2.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso uses cloud evaluation with the Foundry SDK for its support agent. The team has four evaluation needs.

    Which evaluation workflow should you use for each need? To answer, drag the appropriate workflows to the correct needs. Each workflow may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso utilise l'évaluation cloud avec le SDK Foundry pour son agent de support. L'équipe a quatre besoins d'évaluation.

    Quel workflow d'évaluation devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les workflows appropriés vers les besoins correspondants. Chaque workflow peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dataset, text: { en: "Evaluate query-response datasets", fr: "Évaluer des jeux de données requête-réponse" } }
    - { id: target, text: { en: "Evaluate model and agent responses", fr: "Évaluer les réponses de modèles et d'agents" } }
    - { id: deployed, text: { en: "Evaluate deployed model and agent interactions", fr: "Évaluer les interactions de modèles et d'agents déployés" } }
    - { id: redteam, text: { en: "AI red teaming", fr: "Red teaming IA" } }
    - { id: synthetic, text: { en: "Generate synthetic queries", fr: "Générer des requêtes synthétiques" } }
    - { id: simulate, text: { en: "Simulate agent conversations", fr: "Simuler des conversations d'agent" } }
  targets:
    - id: t1
      text: { en: "Score a JSONL file that already contains last week's queries and the agent's responses", fr: "Noter un fichier JSONL qui contient déjà les requêtes de la semaine dernière et les réponses de l'agent" }
    - id: t2
      text: { en: "Have version 3 of the agent answer 200 test queries, then score its answers", fr: "Faire répondre la version 3 de l'agent à 200 requêtes de test, puis noter ses réponses" }
    - id: t3
      text: { en: "Score the stored responses of the agent running in production", fr: "Noter les réponses stockées de l'agent en production" }
    - id: t4
      text: { en: "Probe the agent with adversarial attacks to find safety weaknesses", fr: "Soumettre l'agent à des attaques adverses pour trouver ses faiblesses de sécurité" }
answer:
  mapping: { t1: dataset, t2: target, t3: deployed, t4: redteam }
explanation:
  correct:
    en: A dataset that already holds queries and responses is scored as a query-response dataset. When the model or agent must generate the responses first, you evaluate model and agent responses (the run targets the agent). Stored responses or traces from production are evaluated as deployed interactions, and adversarial safety testing is the role of AI red teaming.
    fr: Un jeu de données qui contient déjà les requêtes et les réponses est noté comme un jeu de données requête-réponse. Lorsque le modèle ou l'agent doit d'abord générer les réponses, vous évaluez les réponses de modèles et d'agents (l'exécution cible l'agent). Les réponses ou traces stockées en production s'évaluent comme des interactions déployées, et les tests de sécurité adverses relèvent du red teaming IA.
  options:
    synthetic: { en: "Synthetic query generation creates test queries; the needs already have their queries or responses.", fr: "La génération de requêtes synthétiques crée des requêtes de test ; les besoins disposent déjà de leurs requêtes ou réponses." }
    simulate: { en: "Simulated conversations evaluate complete multi-turn conversations, not individual answers.", fr: "Les conversations simulées évaluent des conversations multitours complètes, pas des réponses individuelles." }
references:
  - title: Introduction to cloud evaluation with Microsoft Foundry SDK
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/cloud-evaluation
