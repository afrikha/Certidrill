    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage
  - title: Memory in Microsoft Foundry Agent Service (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
