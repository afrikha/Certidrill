id: ai103-cs1b-guest-memory
objective: "2.2.2"
type: single
caseStudy: ai103-cs1b-alpineski
difficulty: 3
status: draft
stem:
  en: |
    The backend of the mobile app calls concierge-agent on behalf of all guests by using its own managed identity. Each guest has a unique guest ID in the app.

    You need to meet the guest preferences requirement. What should you do?
  fr: |
    Le back-end de l'application mobile appelle concierge-agent pour le compte de tous les clients à l'aide de sa propre identité managée. Chaque client possède un ID client unique dans l'application.

    Vous devez satisfaire l'exigence relative aux préférences des clients. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Attach the memory search tool with the scope {{$userId}}, and send the guest ID in the x-memory-user-id header of each call", fr: "Attacher l'outil de recherche en mémoire avec l'étendue {{$userId}}, et envoyer l'ID client dans l'en-tête x-memory-user-id de chaque appel" } }
    - { id: b, text: { en: "Attach the memory search tool with the scope {{$userId}}, and rely on the Microsoft Entra token of the backend for each call", fr: "Attacher l'outil de recherche en mémoire avec l'étendue {{$userId}}, et s'appuyer sur le jeton Microsoft Entra du back-end pour chaque appel" } }
    - { id: c, text: { en: "Attach the memory search tool with the scope alpineski-guests, and send the guest ID in the first message of each conversation", fr: "Attacher l'outil de recherche en mémoire avec l'étendue alpineski-guests, et envoyer l'ID client dans le premier message de chaque conversation" } }
    - { id: d, text: { en: "Attach the file search tool, and upload a preferences file named after the guest ID for each guest", fr: "Attacher l'outil de recherche de fichiers, et charger pour chaque client un fichier de préférences nommé d'après son ID client" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Memory in Foundry Agent Service (preview) keeps long-term user profile memory, such as language preference, across sessions, and the memory search tool reads and writes it without extra code. With the scope `{{$userId}}`, the service resolves the user from the `x-memory-user-id` header when it is present, which is the pattern for a backend that calls on behalf of end users.
    fr: |
      La mémoire de Foundry Agent Service (préversion) conserve une mémoire de profil utilisateur à long terme, comme la préférence de langue, d'une session à l'autre, et l'outil de recherche en mémoire la lit et l'écrit sans code supplémentaire. Avec l'étendue `{{$userId}}`, le service détermine l'utilisateur à partir de l'en-tête `x-memory-user-id` quand il est présent, ce qui correspond au modèle d'un back-end qui appelle pour le compte des utilisateurs finaux.
  options:
    b:
      en: |
        Without the header, `{{$userId}}` falls back to the tenant ID and object ID of the caller, which is the same backend identity for every guest, so all guests would share one memory partition.
      fr: |
        Sans l'en-tête, `{{$userId}}` se rabat sur l'ID de locataire et l'ID d'objet de l'appelant, soit la même identité de back-end pour tous les clients : tous les clients partageraient une seule partition de mémoire.
    c:
      en: |
        A static scope puts the memories of every guest in the same partition, whatever the messages contain.
      fr: |
        Une étendue statique place les mémoires de tous les clients dans la même partition, quel que soit le contenu des messages.
    d:
      en: |
        File search retrieves knowledge from documents; per-guest files require custom code and do not isolate guests from each other.
      fr: |
        La recherche de fichiers récupère des connaissances dans des documents ; des fichiers par client demandent du code personnalisé et n'isolent pas les clients les uns des autres.
references:
