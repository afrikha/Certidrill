id: ai103-sr2-fabrication-eval-2
objective: "2.1.4"
type: series_yesno
series: ai103-sr2-fabrication-eval
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You add the Similarity evaluator and map the retrieved passages as the ground truth.
  fr: Vous ajoutez l'évaluateur Similarity et mappez les passages récupérés en tant que vérité terrain.
body:
  solution:
    en: |
      You add a testing criterion with `"evaluator_name": "builtin.similarity"`, `"initialization_parameters": {"deployment_name": "judge-model"}` and a `data_mapping` that maps `query` to `{{item.query}}`, `response` to `{{item.response}}` and `ground_truth` to `{{item.context}}`.
    fr: |
      Vous ajoutez un critère de test avec `"evaluator_name": "builtin.similarity"`, `"initialization_parameters": {"deployment_name": "judge-model"}` et un `data_mapping` qui mappe `query` sur `{{item.query}}`, `response` sur `{{item.response}}` et `ground_truth` sur `{{item.context}}`.
answer: { value: false }
explanation:
  correct:
    en: Similarity scores how semantically close the response is to an expected answer (the ground truth). The retrieved passages aren't an expected answer, so the score reflects how much the response resembles the passages, not whether each of its statements is supported. A short, fully supported answer can score low, and a close paraphrase that adds one invented detail can score high.
    fr: "Similarity note la proximité sémantique entre la réponse et une réponse attendue (la vérité terrain). Les passages récupérés ne sont pas une réponse attendue : le score reflète la ressemblance entre la réponse et les passages, et non le fait que chacune de ses affirmations est étayée. Une réponse courte et entièrement étayée peut obtenir un score faible, et une paraphrase proche qui ajoute un détail inventé peut obtenir un score élevé."
references:
  - title: Textual Similarity Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
