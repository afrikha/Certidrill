id: ai103-2a-hybrid-codes
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso builds a RAG application for its maintenance technicians. The Azure AI Search index contains a searchable text field and a vector field for each chunk of the equipment manuals. Technicians type exact part numbers such as HX-4410-B, but also describe problems in their own words, such as "the pump rattles after a restart".

    You need to configure the retrieval query so that both kinds of questions return relevant chunks.

    What should you use?
  fr: |
    Contoso développe une application RAG pour ses techniciens de maintenance. L'index Azure AI Search contient un champ de texte interrogeable et un champ vectoriel pour chaque bloc des manuels d'équipement. Les techniciens saisissent des références exactes comme HX-4410-B, mais décrivent aussi des problèmes avec leurs propres mots, par exemple « la pompe vibre après un redémarrage ».

    Vous devez configurer la requête de récupération pour que les deux types de questions renvoient des blocs pertinents.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A full-text query only", fr: "Une requête en texte intégral uniquement" } }
    - { id: b, text: { en: "A vector query only", fr: "Une requête vectorielle uniquement" } }
    - { id: c, text: { en: "A vector query with exhaustive KNN", fr: "Une requête vectorielle avec KNN exhaustif" } }
    - { id: d, text: { en: "A hybrid query", fr: "Une requête hybride" } }
answer: { optionId: d }
explanation:
  correct:
    en: A hybrid query runs a full-text query and a vector query in the same request and merges the results. Keyword search finds exact matches such as part numbers, and vector search finds chunks that are similar in meaning to a paraphrased question.
    fr: Une requête hybride exécute une requête en texte intégral et une requête vectorielle dans la même requête et fusionne les résultats. La recherche par mot clé trouve les correspondances exactes comme les références, et la recherche vectorielle trouve les blocs proches par le sens d'une question reformulée.
  options:
    a:
      en: Full-text search alone misses chunks that describe the problem with different words.
      fr: La recherche en texte intégral seule manque les blocs qui décrivent le problème avec d'autres mots.
    b:
      en: Vector search alone is weak on exact identifiers such as part numbers.
      fr: La recherche vectorielle seule est peu efficace sur des identifiants exacts comme les références.
    c:
      en: Exhaustive KNN scans all vectors instead of using HNSW, but it is still vector-only and does not match exact terms.
      fr: Le KNN exhaustif parcourt tous les vecteurs au lieu d'utiliser HNSW, mais reste une recherche vectorielle seule qui ne cible pas les termes exacts.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
