id: ai103-2b-instructions-tool-use
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a prompt agent named returns-agent with a function tool named get_order that returns the live status of an order. During testing, the agent often answers questions about the status of an order from earlier messages in the conversation without calling get_order, and some answers are out of date. When the agent calls get_order, the tool works correctly.

    What should you do?
  fr: |
    Adatum Corporation dispose d'un agent d'invite nommé returns-agent doté d'un outil de fonction nommé get_order qui renvoie le statut en temps réel d'une commande. Pendant les tests, l'agent répond souvent aux questions sur le statut d'une commande à partir des messages précédents de la conversation sans appeler get_order, et certaines réponses sont obsolètes. Quand l'agent appelle get_order, l'outil fonctionne correctement.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Attach the memory search tool so that the agent remembers the status of each order", fr: "Attacher l'outil de recherche de mémoire pour que l'agent se souvienne du statut de chaque commande" } }
    - { id: b, text: { en: "Update the instructions to require a call to get_order before the agent answers any question about an order", fr: "Mettre à jour les instructions pour exiger un appel à get_order avant que l'agent réponde à toute question sur une commande" } }
    - { id: c, text: { en: "Upload a daily export of the orders to a vector store used by the file search tool", fr: "Charger un export quotidien des commandes dans un magasin de vecteurs utilisé par l'outil de recherche de fichiers" } }
    - { id: d, text: { en: "Lower the max_output_tokens value of the requests to shorten the answers", fr: "Réduire la valeur max_output_tokens des requêtes pour raccourcir les réponses" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The instructions define the role and the rules of the agent, including when it must use each tool. Stating that get_order must be called before any answer about an order makes the agent fetch the live status instead of reusing older messages.
    fr: |
      Les instructions définissent le rôle et les règles de l'agent, y compris le moment où il doit utiliser chaque outil. Indiquer que get_order doit être appelé avant toute réponse sur une commande amène l'agent à récupérer le statut en temps réel au lieu de réutiliser des messages plus anciens.
  options:
    a: { en: "Memory keeps user-specific knowledge across sessions; a remembered status would also become stale.", fr: "La mémoire conserve des connaissances propres à l'utilisateur d'une session à l'autre ; un statut mémorisé deviendrait lui aussi obsolète." }
    c: { en: "A daily export is out of date between exports, and the live tool already exists.", fr: "Un export quotidien est obsolète entre deux exports, et l'outil en temps réel existe déjà." }
    d: { en: "Limiting output tokens shortens answers; it doesn't make the agent call the tool.", fr: "Limiter les jetons de sortie raccourcit les réponses ; cela n'amène pas l'agent à appeler l'outil." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
