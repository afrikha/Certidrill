id: ai103-2b-connection-order
objective: "2.1.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure AI Search service that hosts an index named products, and a Foundry project named catalog. The system-assigned managed identity of the Foundry account already has the Search Index Data Contributor and Search Service Contributor roles on the search service.

    You need a Python application to create and call an agent that answers questions from the products index. The solution must use keyless authentication.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Northwind Traders dispose d'un service Azure AI Search qui héberge un index nommé products, et d'un projet Foundry nommé catalog. L'identité managée affectée par le système du compte Foundry dispose déjà des rôles Search Index Data Contributor et Search Service Contributor sur le service de recherche.

    Vous devez faire en sorte qu'une application Python crée et appelle un agent qui répond aux questions à partir de l'index products. La solution doit utiliser l'authentification sans clé.

    Quelles sont les quatre actions que vous devez effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - id: conn
      text:
        en: |
          In the catalog project, create a connection to the search service that uses Microsoft Entra ID authentication.
        fr: |
          Dans le projet catalog, créer une connexion au service de recherche qui utilise l'authentification Microsoft Entra ID.
    - id: getid
      text:
        en: |
          In the code, call `project.connections.get()` with the connection name and read the `id` of the result.
        fr: |
          Dans le code, appeler `project.connections.get()` avec le nom de la connexion et lire l'`id` du résultat.
    - id: version
      text:
        en: |
          Call `project.agents.create_version()` with an `AzureAISearchTool` whose index resource uses the connection ID and the products index.
        fr: |
          Appeler `project.agents.create_version()` avec un `AzureAISearchTool` dont la ressource d'index utilise l'ID de la connexion et l'index products.
    - id: call
      text:
        en: |
          Get an OpenAI client for the agent, and then call `responses.create()` with the question of the user.
        fr: |
          Obtenir un client OpenAI pour l'agent, puis appeler `responses.create()` avec la question de l'utilisateur.
    - id: key
      text:
        en: |
          Copy an admin key of the search service into an environment variable, and pass it to the tool definition.
        fr: |
          Copier une clé d'administration du service de recherche dans une variable d'environnement, et la passer à la définition de l'outil.
    - id: thread
      text:
        en: |
          Create a thread and a run for the agent, and then poll the run until it completes.
        fr: |
          Créer un thread et une exécution pour l'agent, puis interroger l'exécution jusqu'à ce qu'elle se termine.
answer:
  sequence: [ conn, getid, version, call ]
explanation:
  correct:
    en: |
      The Azure AI Search tool reaches the service through a project connection, so the connection must exist first. The code resolves the connection ID from its name with `project.connections.get()`, then passes it as `project_connection_id` with the index name when it creates the agent version. Finally, the application calls the agent through the OpenAI client of the project.
    fr: |
      L'outil Azure AI Search accède au service par une connexion du projet : la connexion doit donc exister en premier. Le code obtient l'ID de la connexion à partir de son nom avec `project.connections.get()`, puis le passe dans `project_connection_id` avec le nom de l'index lors de la création de la version de l'agent. Enfin, l'application appelle l'agent via le client OpenAI du projet.
  options:
    key:
      en: |
        An admin key breaks the keyless requirement; the tool takes a connection ID, not a key.
      fr: |
        Une clé d'administration enfreint l'exigence sans clé ; l'outil attend un ID de connexion, pas une clé.
    thread:
      en: |
        Threads and runs belong to the classic Agents API; the current SDK uses conversations and responses.
      fr: |
        Les threads et les exécutions appartiennent à l'API Agents classique ; le SDK actuel utilise des conversations et des réponses.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
