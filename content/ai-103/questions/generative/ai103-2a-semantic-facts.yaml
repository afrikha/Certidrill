id: ai103-2a-semantic-facts
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to enable semantic ranker on the Azure AI Search index used by its RAG application. The application will also use semantic captions as the passages it sends to the chat model.

    Which two statements about semantic ranker are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit d'activer le classement sémantique sur l'index Azure AI Search utilisé par son application RAG. L'application utilisera aussi les légendes sémantiques comme passages envoyés au modèle de conversation.

    Quelles sont les deux affirmations vraies concernant le classement sémantique ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It reruns the query over the whole index to find documents that are semantically related.", fr: "Il réexécute la requête sur l'ensemble de l'index pour trouver les documents liés par le sens." } }
    - { id: b, text: { en: "It reranks at most the top 50 results of the initial BM25 or RRF ranking.", fr: "Il reclasse au maximum les 50 premiers résultats du classement initial BM25 ou RRF." } }
    - { id: c, text: { en: "Its @search.rerankerScore ranges from 1 to 5.", fr: "Son @search.rerankerScore va de 1 à 5." } }
    - { id: d, text: { en: "The captions and answers it returns are verbatim text from the index.", fr: "Les légendes et réponses qu'il renvoie sont du texte repris mot pour mot de l'index." } }
    - { id: e, text: { en: "A query with search=* and queryType set to semantic is billed as a semantic query.", fr: "Une requête avec search=* et queryType défini sur semantic est facturée comme une requête sémantique." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Semantic ranker improves an existing BM25 or RRF ranking, and only the top 50 results go through it. Captions and answers are always verbatim extracts of the indexed content, not generated text.
    fr: Le classement sémantique améliore un classement BM25 ou RRF existant, et seuls les 50 premiers résultats le traversent. Les légendes et les réponses sont toujours des extraits mot pour mot du contenu indexé, pas du texte généré.
  options:
    a:
      en: Semantic ranker cannot rerun the query over the entire corpus; it only reranks what the initial query returned.
      fr: Le classement sémantique ne peut pas réexécuter la requête sur tout le corpus ; il reclasse seulement ce que la requête initiale a renvoyé.
    c:
      en: The reranker score ranges from 4 (highly relevant) to 0 (irrelevant).
      fr: Le score du reclasseur va de 4 (très pertinent) à 0 (non pertinent).
    e:
      en: With search=* there is no query text to rank, and such requests are not charged even when queryType is semantic.
      fr: Avec search=*, il n'y a aucun texte de requête à classer, et ces requêtes ne sont pas facturées même si queryType vaut semantic.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
