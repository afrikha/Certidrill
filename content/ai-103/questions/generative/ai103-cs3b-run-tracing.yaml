id: ai103-cs3b-run-tracing
objective: "2.3.3"
type: yesno_statements
caseStudy: ai103-cs3b-alpine
difficulty: 2
status: draft
stem:
  en: |
    To meet the observability requirement, you plan to connect alpine-insights to the concierge project from the **Traces** page of the project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence d'observabilité, vous prévoyez de connecter alpine-insights au projet concierge depuis la page **Traces** du projet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "After alpine-insights is connected, server-side traces of ski-concierge runs are collected without any change to the code of guest-api."
        fr: "Une fois alpine-insights connecté, les traces côté serveur des exécutions de ski-concierge sont collectées sans aucune modification du code de guest-api."
    - id: s2
      text:
        en: "The traces can include the arguments that ski-concierge passes to its tools and the results that the tools return."
        fr: "Les traces peuvent inclure les arguments que ski-concierge transmet à ses outils et les résultats que renvoient les outils."
    - id: s3
      text:
        en: "Assigning the operations team the Foundry User role on the concierge project is enough to let them query the telemetry stored in alpine-insights."
        fr: "Attribuer à l'équipe d'exploitation le rôle Foundry User sur le projet concierge suffit pour lui permettre d'interroger la télémétrie stockée dans alpine-insights."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Once an Application Insights resource is connected to the project, Foundry enables server-side tracing automatically, with no code change. Traces capture latency, exceptions, prompt content, retrieval operations, and tool arguments and results, so they can contain sensitive data such as guest names. Querying the telemetry requires the Log Analytics Reader role on the connected Application Insights resource; a Foundry role on the project does not grant it.
    fr: |
      Une fois une ressource Application Insights connectée au projet, Foundry active automatiquement le traçage côté serveur, sans modification du code. Les traces capturent la latence, les exceptions, le contenu des invites, les opérations de récupération ainsi que les arguments et résultats des outils : elles peuvent donc contenir des données sensibles comme des noms de clients. Interroger la télémétrie exige le rôle Log Analytics Reader sur la ressource Application Insights connectée ; un rôle Foundry sur le projet ne l'accorde pas.
references:
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
