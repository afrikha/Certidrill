id: ai103-2b-sdk-package
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. is starting a Python 3.12 application that must create versioned prompt agents in a Foundry project and call them through the Responses API. The application targets the current Foundry Agent Service, not Foundry classic.

    You need to install the client libraries that the Foundry SDK documentation uses for this scenario.

    Which command should you run?
  fr: |
    Litware, Inc. démarre une application Python 3.12 qui doit créer des agents d'invite versionnés dans un projet Foundry et les appeler via l'API Responses. L'application cible le Foundry Agent Service actuel, et non Foundry classique.

    Vous devez installer les bibliothèques clientes que la documentation du SDK Foundry utilise pour ce scénario.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: 'pip install "azure-ai-projects==1.0.0"' }
    - { id: b, text: 'pip install "azure-ai-projects>=2.3.0" "openai>=3.0.0"' }
    - { id: c, text: 'pip install "openai>=3.0.0"' }
    - { id: d, text: 'pip install azure-ai-ml' }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The 2.x Python package `azure-ai-projects` targets the new Foundry and provides `AIProjectClient`, which creates agent versions with `project.agents.create_version()`. Its `get_openai_client()` method returns an `openai` client for responses and conversations, so the documentation installs both packages together. The 2.x SDK requires Python 3.10 or later.
    fr: |
      Le package Python `azure-ai-projects` 2.x cible le nouveau Foundry et fournit `AIProjectClient`, qui crée des versions d'agent avec `project.agents.create_version()`. Sa méthode `get_openai_client()` renvoie un client `openai` pour les réponses et les conversations : la documentation installe donc les deux packages ensemble. Le SDK 2.x nécessite Python 3.10 ou version ultérieure.
  options:
    a: { en: "Version 1.0.0 of azure-ai-projects is the SDK of Foundry classic, not of the current Foundry Agent Service.", fr: "La version 1.0.0 d'azure-ai-projects est le SDK de Foundry classique, pas celui du Foundry Agent Service actuel." }
    c: { en: "The openai package alone can call responses, but it can't create agent versions in a Foundry project: that requires AIProjectClient.", fr: "Le package openai seul peut appeler des réponses, mais il ne peut pas créer de versions d'agent dans un projet Foundry : il faut AIProjectClient." }
    d: { en: "azure-ai-ml is the Azure Machine Learning SDK; it doesn't manage Foundry agents.", fr: "azure-ai-ml est le SDK d'Azure Machine Learning ; il ne gère pas les agents Foundry." }
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
