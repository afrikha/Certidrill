id: ai103-2c-triage-specialists
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation is building a customer support solution by using Microsoft Agent Framework. A triage agent receives the first message of each customer. Depending on the request, an order agent, a returns agent or a refund agent must then take full ownership of the conversation and receive its whole context. No central agent must coordinate the specialists.

    Which orchestration pattern should you use?
  fr: |
    Adatum Corporation crée une solution de support client à l'aide de Microsoft Agent Framework. Un agent de tri reçoit le premier message de chaque client. Selon la demande, un agent de commandes, un agent de retours ou un agent de remboursement doit ensuite prendre l'entière responsabilité de la conversation et en recevoir tout le contexte. Aucun agent central ne doit coordonner les spécialistes.

    Quel modèle d'orchestration devez-vous utiliser ?
body:
  options:
    - { id: a, text: Sequential }
    - { id: b, text: Concurrent }
    - { id: c, text: Handoff }
    - { id: d, text: Magentic }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In handoff orchestration, agents transfer control of the conversation to the agent that has the right expertise, without a central orchestrator. The receiving agent takes full ownership of the task and gets the full conversation context, which fits triage followed by routing to specialists.
    fr: |
      Dans l'orchestration handoff, les agents transfèrent le contrôle de la conversation à l'agent qui a l'expertise adaptée, sans orchestrateur central. L'agent qui reçoit la conversation prend l'entière responsabilité de la tâche et obtient tout le contexte de la conversation, ce qui convient à un tri suivi d'un routage vers des spécialistes.
  options:
    a:
      en: |
        Sequential runs every agent one after another in a fixed order; it doesn't choose one specialist based on the request.
      fr: |
        Sequential exécute chaque agent l'un après l'autre dans un ordre fixe ; il ne choisit pas un spécialiste selon la demande.
    b:
      en: |
        Concurrent runs agents in parallel and combines their results; the customer would get answers from every specialist.
      fr: |
        Concurrent exécute les agents en parallèle et combine leurs résultats ; le client obtiendrait les réponses de tous les spécialistes.
    d:
      en: |
        Magentic relies on a manager agent that plans and coordinates the specialists, which the requirement excludes.
      fr: |
        Magentic s'appuie sur un agent gestionnaire qui planifie et coordonne les spécialistes, ce que l'exigence exclut.
references:
  - title: Microsoft Agent Framework Workflows Orchestrations - Handoff
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/handoff
