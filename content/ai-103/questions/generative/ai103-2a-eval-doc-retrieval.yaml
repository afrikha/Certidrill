id: ai103-2a-eval-doc-retrieval
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's search team is tuning the chunk size and top_k value of a RAG application. For 300 test queries, domain experts have labeled the relevance of each document in the index on a 0–4 scale. The team wants search metrics such as NDCG and fidelity for each configuration, without the cost of a judge model.

    Which evaluator should you use?
  fr: |
    L'équipe de recherche de Contoso ajuste la taille des blocs et la valeur top_k d'une application RAG. Pour 300 requêtes de test, des experts métier ont étiqueté la pertinence de chaque document de l'index sur une échelle de 0 à 4. L'équipe veut des métriques de recherche comme NDCG et la fidélité pour chaque configuration, sans le coût d'un modèle juge.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Retrieval }
    - { id: b, text: Document Retrieval }
    - { id: c, text: Groundedness }
    - { id: d, text: Similarity }
answer: { optionId: b }
explanation:
  correct:
    en: Document Retrieval compares the retrieved documents with human relevance labels and returns search metrics such as NDCG, XDCG, fidelity, max relevance and holes. It takes no judge deployment, and Learn suggests a parameter sweep over search settings, top_k and chunk sizes with it.
    fr: Document Retrieval compare les documents récupérés à des étiquettes de pertinence humaines et renvoie des métriques de recherche comme NDCG, XDCG, la fidélité, la pertinence maximale et les trous (holes). Il ne nécessite aucun déploiement juge, et Learn suggère de l'utiliser pour un balayage des paramètres de recherche, de top_k et de la taille des blocs.
  options:
    a:
      en: Retrieval uses an LLM judge to rate the relevance of the retrieved chunks; it does not use the expert labels and has a judge cost.
      fr: Retrieval utilise un LLM juge pour noter la pertinence des blocs récupérés ; il n'exploite pas les étiquettes des experts et a un coût de juge.
    c:
      en: Groundedness evaluates the response against the context, not the quality of the search ranking.
      fr: Groundedness évalue la réponse par rapport au contexte, pas la qualité du classement de la recherche.
    d:
      en: Similarity compares a response with a ground truth answer by using an LLM judge.
      fr: Similarity compare une réponse à une réponse de référence à l'aide d'un LLM juge.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
