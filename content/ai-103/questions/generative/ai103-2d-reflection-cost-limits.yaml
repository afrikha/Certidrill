id: ai103-2d-reflection-cost-limits
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam added a generate, critique and revise loop to every response of its customer chat assistant, which runs on a **gpt-4.1** deployment. The loop repeats until the critique call finds no issue. Since the change, average latency has tripled and token costs have grown accordingly, but quality matters only for the contract summaries that the assistant produces, which are about 5 % of the requests.

    You need to keep the quality gain on contract summaries while reducing latency and cost.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a ajouté une boucle générer, critiquer et réviser à chaque réponse de son assistant de conversation client, qui s'exécute sur un déploiement **gpt-4.1**. La boucle se répète jusqu'à ce que l'appel de critique ne trouve plus aucun problème. Depuis ce changement, la latence moyenne a triplé et les coûts en jetons ont augmenté d'autant, mais la qualité n'importe que pour les synthèses de contrats que produit l'assistant, soit environ 5 % des requêtes.

    Vous devez conserver le gain de qualité sur les synthèses de contrats tout en réduisant la latence et le coût.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: d, text: { en: "Raise the temperature of the critique call so that it finds more issues.", fr: "Augmenter la température de l'appel de critique pour qu'il trouve plus de problèmes." } }
    - { id: b, text: { en: "Cap the loop at a fixed number of critique rounds, such as two.", fr: "Limiter la boucle à un nombre fixe de tours de critique, par exemple deux." } }
    - { id: c, text: { en: "Ask the critique call to rewrite the full response from scratch in each round.", fr: "Demander à l'appel de critique de réécrire entièrement la réponse à chaque tour." } }
    - { id: a, text: { en: "Run the loop only for contract summaries and answer other requests in a single call.", fr: "N'exécuter la boucle que pour les synthèses de contrats et répondre aux autres requêtes en un seul appel." } }
    - { id: e, text: { en: "Remove the issue list from the verdict and return only a numeric score.", fr: "Supprimer la liste des problèmes du verdict et ne renvoyer qu'un score numérique." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Each reflection pass adds model calls, tokens and latency, so a loop belongs on high-stakes outputs, not on every chat turn. A bounded number of rounds, combined with the pass condition, caps the worst-case cost of the requests that still go through the loop."
    fr: "Chaque passe de réflexion ajoute des appels au modèle, des jetons et de la latence : une boucle a sa place sur les sorties à fort enjeu, pas sur chaque tour de conversation. Un nombre borné de tours, associé à la condition de réussite, plafonne le coût maximal des requêtes qui passent encore par la boucle."
  options:
    c: { en: "Rewriting from scratch produces more output tokens per round and can discard the parts that were already correct.", fr: "Réécrire entièrement produit davantage de jetons de sortie à chaque tour et peut supprimer des parties déjà correctes." }
    d: { en: "A more random critique makes the verdicts less consistent and can keep the loop running longer.", fr: "Une critique plus aléatoire rend les verdicts moins réguliers et peut prolonger la boucle." }
    e: { en: "Without the issue list the revise step doesn't know what to fix, so more rounds are needed.", fr: "Sans la liste des problèmes, l'étape de révision ne sait pas quoi corriger : il faut donc davantage de tours." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
