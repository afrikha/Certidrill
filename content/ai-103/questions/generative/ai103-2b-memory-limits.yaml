id: ai103-2b-memory-limits
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. plans to give its customer agents long-term memory by using a memory store in Foundry Agent Service. The Foundry resource uses a virtual network for its other workloads.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. prévoit de doter ses agents clients d'une mémoire à long terme à l'aide d'un magasin de mémoire dans Foundry Agent Service. La ressource Foundry utilise un réseau virtuel pour ses autres charges de travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The memory store needs both a chat model deployment and an embedding model deployment.
        fr: |
          Le magasin de mémoire nécessite à la fois un déploiement de modèle de conversation et un déploiement de modèle d'embedding.
    - id: s2
      text:
        en: |
          The memory store can be integrated with the virtual network so that memory traffic stays private.
        fr: |
          Le magasin de mémoire peut être intégré au réseau virtuel pour que le trafic de la mémoire reste privé.
    - id: s3
      text:
        en: |
          A single scope of the memory store can hold up to 10,000 memories.
        fr: |
          Une seule étendue du magasin de mémoire peut contenir jusqu'à 10 000 mémoires.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Memory requires compatible Azure OpenAI chat and embedding model deployments, which are also what you are billed for. Virtual network integration isn't supported for memory stores. The quotas allow up to 100 scopes per memory store and 10,000 memories per scope.
    fr: |
      La mémoire nécessite des déploiements compatibles de modèles Azure OpenAI de conversation et d'embedding, qui sont aussi ce qui vous est facturé. L'intégration à un réseau virtuel n'est pas prise en charge pour les magasins de mémoire. Les quotas autorisent jusqu'à 100 étendues par magasin de mémoire et 10 000 mémoires par étendue.
references:
  - title: What is Memory?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
