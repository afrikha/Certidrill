id: ai103-cs1c-evaluators
objective: "2.1.4"
type: multi
caseStudy: ai103-cs1c-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to choose the built-in evaluators to list in evals/guide-tests.json. The solution must meet the answer quality requirement. Which two evaluators should you include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir les évaluateurs intégrés à lister dans evals/guide-tests.json. La solution doit satisfaire l'exigence de qualité des réponses. Quels sont les deux évaluateurs à inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Similarity }
    - { id: c, text: Relevance }
    - { id: d, text: F1 Score }
    - { id: e, text: Coherence }
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Similarity uses a judge model to measure the semantic similarity between the response and the ground truth, here the expected answers of the test file, so it tolerates different wording. Groundedness measures whether the response is supported by the context that the agent retrieved.
    fr: |
      Similarity utilise un modèle juge pour mesurer la similarité sémantique entre la réponse et la vérité de terrain, ici les réponses attendues du fichier de test : il tolère une formulation différente. Groundedness mesure si la réponse est étayée par le contexte que l'agent a récupéré.
  options:
    c:
      en: |
        Relevance measures whether the response addresses the query; it neither uses the expected answers nor checks the retrieved passages.
      fr: |
        Relevance mesure si la réponse traite la requête ; il n'utilise pas les réponses attendues et ne vérifie pas les passages récupérés.
    d:
      en: |
        F1 Score counts the tokens that the response shares with the expected answer, so a correct answer worded differently gets a low score.
      fr: |
        F1 Score compte les jetons que la réponse partage avec la réponse attendue : une réponse correcte formulée autrement obtient un score faible.
    e:
      en: |
        Coherence measures the logical flow of a response, not its meaning compared with the expected answers or its support in the passages.
      fr: |
        Coherence mesure l'enchaînement logique d'une réponse, pas son sens par rapport aux réponses attendues ni son étayage par les passages.
references:
  - title: Textual Similarity Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
