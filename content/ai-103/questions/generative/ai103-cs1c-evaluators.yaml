id: ai103-cs1c-evaluators
objective: "2.1.4"
type: multi
caseStudy: ai103-cs1c-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    You need to choose the built-in evaluators to list in evals/guide-tests.json. The solution must meet the answer quality requirement. Which two evaluators should you include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir les évaluateurs intégrés à lister dans evals/guide-tests.json. La solution doit satisfaire l'exigence de qualité des réponses. Quels sont les deux évaluateurs à inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Response Completeness }
    - { id: c, text: Relevance }
    - { id: d, text: Task Adherence }
    - { id: e, text: Coherence }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Response Completeness measures whether the response includes the critical information of the ground truth, which the expected answers in the test file provide. Task Adherence measures whether the agent follows through on its tasks according to its system instructions.
    fr: |
      Response Completeness mesure si la réponse inclut les informations essentielles de la vérité de terrain, que fournissent les réponses attendues du fichier de test. Task Adherence mesure si l'agent mène ses tâches à bien conformément à ses instructions système.
  options:
    a:
      en: |
        Groundedness compares the response with the retrieved context, not with the expected answers.
      fr: |
        Groundedness compare la réponse au contexte récupéré, pas aux réponses attendues.
    c:
      en: |
        Relevance measures whether the response addresses the query; it neither uses the expected answers nor checks the agent instructions.
      fr: |
        Relevance mesure si la réponse traite la requête ; il n'utilise pas les réponses attendues et ne vérifie pas les instructions de l'agent.
    e:
      en: |
        Coherence measures the logical consistency and flow of a response, not its completeness or its compliance with the instructions.
      fr: |
        Coherence mesure la cohérence logique et l'enchaînement d'une réponse, pas sa complétude ni son respect des instructions.
references:
  - title: Built-in evaluators reference
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
  - title: How to run an evaluation in GitHub Action (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/evaluation-github-action
