id: ai103-2b-client-code
objective: "2.1.6"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a Foundry resource named tailspin-ai with a project named travel. The project contains a deployment named travel-chat that runs the gpt-4.1-mini model. The app setting FOUNDRY_PROJECT_ENDPOINT of the hosting service contains the project endpoint, and the managed identity of the service has the Foundry User role on the project.

    You need to complete the Python code of the application. The solution must use keyless authentication.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une ressource Foundry nommée tailspin-ai avec un projet nommé travel. Le projet contient un déploiement nommé travel-chat qui exécute le modèle gpt-4.1-mini. Le paramètre d'application FOUNDRY_PROJECT_ENDPOINT du service d'hébergement contient le point de terminaison du projet, et l'identité managée du service dispose du rôle Foundry User sur le projet.

    Vous devez compléter le code Python de l'application. La solution doit utiliser l'authentification sans clé.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from azure.ai.projects import AIProjectClient
    from azure.identity import DefaultAzureCredential

    project = AIProjectClient(
        endpoint=[[s1]],
        credential=[[s2]],
    )
    openai = project.get_openai_client()

    response = openai.responses.create(
        model=[[s3]],
        input=question,
    )
    print(response.output_text)
  slots:
    - id: s1
      options:
        - { id: oai, text: '"https://tailspin-ai.openai.azure.com/openai/v1/"' }
        - { id: env, text: 'os.environ["FOUNDRY_PROJECT_ENDPOINT"]' }
        - { id: cog, text: '"https://tailspin-ai.cognitiveservices.azure.com/"' }
    - id: s2
      options:
        - { id: dac, text: DefaultAzureCredential() }
        - { id: akc, text: 'AzureKeyCredential(os.environ["TAILSPIN_AI_KEY"])' }
        - { id: tp, text: 'get_bearer_token_provider(DefaultAzureCredential(), "https://ai.azure.com/.default")' }
    - id: s3
      options:
        - { id: model, text: '"gpt-4.1-mini"' }
        - { id: project, text: '"travel"' }
        - { id: dep, text: '"travel-chat"' }
answer:
  values: { s1: env, s2: dac, s3: dep }
explanation:
  correct:
    en: |
      AIProjectClient takes the project endpoint, here read from the FOUNDRY_PROJECT_ENDPOINT setting, and a `TokenCredential` such as `DefaultAzureCredential()`, which uses the managed identity of the hosting service. The `model` parameter of `responses.create()` takes the deployment name, travel-chat, not the name of the model it runs.
    fr: |
      AIProjectClient attend le point de terminaison du projet, lu ici dans le paramètre FOUNDRY_PROJECT_ENDPOINT, et des informations d'identification `TokenCredential` comme `DefaultAzureCredential()`, qui utilise l'identité managée du service d'hébergement. Le paramètre `model` de `responses.create()` attend le nom du déploiement, travel-chat, et non le nom du modèle qu'il exécute.
  options:
    oai: { en: "The /openai/v1 endpoint is the base URL of an OpenAI client, not the endpoint of AIProjectClient.", fr: "Le point de terminaison /openai/v1 est l'URL de base d'un client OpenAI, pas le point de terminaison d'AIProjectClient." }
    cog: { en: "The cognitiveservices.azure.com endpoint is used by the Foundry Tools SDKs.", fr: "Le point de terminaison cognitiveservices.azure.com est utilisé par les SDK Foundry Tools." }
    akc: { en: "AIProjectClient accepts a TokenCredential only, and a key breaks the keyless requirement.", fr: "AIProjectClient n'accepte qu'un TokenCredential, et une clé enfreint l'exigence sans clé." }
    tp: { en: "A bearer token provider is a callable for the api_key parameter of an OpenAI client, not a TokenCredential.", fr: "Un fournisseur de jetons du porteur est une fonction destinée au paramètre api_key d'un client OpenAI, pas un TokenCredential." }
    model: { en: "The model parameter takes the deployment name, which differs from the model name here.", fr: "Le paramètre model attend le nom du déploiement, qui diffère ici du nom du modèle." }
references:
  - title: azure.ai.projects.AIProjectClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.aiprojectclient
  - title: Azure AI Projects client library for Python
    url: https://learn.microsoft.com/en-us/python/api/overview/azure/ai-projects-readme
