id: ai103-2a-structured-vs-json
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank uses a GPT model deployment to extract data from loan applications. A downstream service rejects any record that does not match its JSON schema exactly. Today the application asks for JSON in the instructions, and some responses contain extra fields or miss required ones.

    You need the model output to always follow the schema.

    What should you use?
  fr: |
    Woodgrove Bank utilise un déploiement de modèle GPT pour extraire des données de demandes de prêt. Un service en aval rejette tout enregistrement qui ne respecte pas exactement son schéma JSON. Aujourd'hui, l'application demande du JSON dans les instructions, et certaines réponses contiennent des champs en trop ou omettent des champs obligatoires.

    Vous devez faire en sorte que la sortie du modèle suive toujours le schéma.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "JSON mode", fr: "Le mode JSON" } }
    - { id: b, text: { en: "Structured outputs", fr: "Les sorties structurées" } }
    - { id: c, text: { en: "A few-shot example of the JSON in the instructions", fr: "Un exemple few-shot du JSON dans les instructions" } }
    - { id: d, text: { en: "A lower temperature on the request", fr: "Une température plus basse sur la requête" } }
answer: { optionId: b }
explanation:
  correct:
    en: Structured outputs make the model follow the JSON Schema supplied in the request (in `text.format` for the Responses API, in `response_format` for Chat Completions). This guarantees the required fields and no extra properties.
    fr: Les sorties structurées obligent le modèle à suivre le schéma JSON fourni dans la requête (dans `text.format` pour l'API Responses, dans `response_format` pour Chat Completions). Les champs obligatoires sont garantis, sans propriétés supplémentaires.
  options:
    a:
      en: JSON mode guarantees valid JSON but not adherence to a specific schema.
      fr: Le mode JSON garantit un JSON valide, mais pas le respect d'un schéma précis.
    c:
      en: Examples in the prompt improve the format but give no guarantee; this is close to what already fails today.
      fr: Des exemples dans l'invite améliorent le format sans rien garantir ; c'est proche de ce qui échoue déjà aujourd'hui.
    d:
      en: Temperature changes the randomness of the wording, not the structure of the output.
      fr: La température modifie le caractère aléatoire de la formulation, pas la structure de la sortie.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
