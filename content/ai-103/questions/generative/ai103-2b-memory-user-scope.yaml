id: ai103-2b-memory-user-scope
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has an employee portal built as a single-page application. Each employee signs in with Microsoft Entra ID, and the application calls the agent hr-helper directly with the token of the employee. hr-helper uses the memory search tool.

    Each employee must have isolated memories, and the application must not manage user identifiers for memory.

    What should you do?
  fr: |
    Litware, Inc. dispose d'un portail des employés conçu comme une application monopage. Chaque employé se connecte avec Microsoft Entra ID, et l'application appelle directement l'agent hr-helper avec le jeton de l'employé. hr-helper utilise l'outil de recherche de mémoire.

    Chaque employé doit disposer de mémoires isolées, et l'application ne doit pas gérer d'identificateurs d'utilisateur pour la mémoire.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the scope of the memory search tool to litware-employees", fr: "Définir l'étendue de l'outil de recherche de mémoire sur litware-employees" } }
    - { id: b, text: { en: "Call the memory store APIs from the application with the scope {{$userId}}", fr: "Appeler les API du magasin de mémoire depuis l'application avec l'étendue {{$userId}}" } }
    - { id: c, text: { en: "Set the scope of the memory search tool to {{$userId}}, and send the requests without an x-memory-user-id header", fr: "Définir l'étendue de l'outil de recherche de mémoire sur {{$userId}}, et envoyer les requêtes sans en-tête x-memory-user-id" } }
    - { id: d, text: { en: "Set the scope of the memory search tool to {{$userId}}, and send the email address of the employee in the x-memory-user-id header", fr: "Définir l'étendue de l'outil de recherche de mémoire sur {{$userId}}, et envoyer l'adresse e-mail de l'employé dans l'en-tête x-memory-user-id" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the scope `{{$userId}}`, the memory search tool resolves the end user on each response call. When the `x-memory-user-id` header isn't set, it falls back to the tenant ID and object ID from the Microsoft Entra token of the caller, which is the default for frontend scenarios where users authenticate directly. Each employee gets an isolated scope without any identifier managed by the application.
    fr: |
      Avec l'étendue `{{$userId}}`, l'outil de recherche de mémoire détermine l'utilisateur final à chaque appel de réponse. Quand l'en-tête `x-memory-user-id` n'est pas défini, il se rabat sur l'ID de locataire et l'ID d'objet du jeton Microsoft Entra de l'appelant, ce qui est le comportement par défaut des scénarios front-end où les utilisateurs s'authentifient directement. Chaque employé obtient une étendue isolée sans aucun identificateur géré par l'application.
  options:
    a: { en: "A static scope puts the memories of every employee in the same partition.", fr: "Une étendue statique place les mémoires de tous les employés dans la même partition." }
    b: { en: "Automatic identity resolution isn't supported by the low-level memory APIs, which need an explicit scope in each request.", fr: "La résolution automatique de l'identité n'est pas prise en charge par les API de mémoire de bas niveau, qui exigent une étendue explicite dans chaque requête." }
    d: { en: "The header is for backend or proxy scenarios, and it means that the application manages the user identifier.", fr: "L'en-tête est destiné aux scénarios de back-end ou de proxy, et il implique que l'application gère l'identificateur de l'utilisateur." }
references:
  - title: Create and use memory in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage
