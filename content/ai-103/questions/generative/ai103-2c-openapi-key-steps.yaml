id: ai103-2c-openapi-key-steps
objective: "2.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a prompt agent named travel-agent in a Foundry project. A partner booking API has an OpenAPI 3.0 specification whose `securitySchemes` section defines an API key sent in the `x-api-key` header. The partner gave you an API key.

    You need travel-agent to call the API by using the API key. The key must not appear in the specification or in the source code.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose d'un agent d'invite nommé travel-agent dans un projet Foundry. Une API de réservation d'un partenaire dispose d'une spécification OpenAPI 3.0 dont la section `securitySchemes` définit une clé API envoyée dans l'en-tête `x-api-key`. Le partenaire vous a fourni une clé API.

    travel-agent doit appeler l'API à l'aide de la clé API. La clé ne doit apparaître ni dans la spécification ni dans le code source.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: conn, text: { en: "Create a project connection that stores the key under the name `x-api-key`.", fr: "Créer une connexion de projet qui stocke la clé sous le nom `x-api-key`." } }
    - { id: tool, text: { en: "Define an `OpenApiTool` whose authentication references the connection ID.", fr: "Définir un `OpenApiTool` dont l'authentification référence l'ID de la connexion." } }
    - { id: version, text: { en: "Create a new version of travel-agent that includes the tool.", fr: "Créer une nouvelle version de travel-agent qui inclut l'outil." } }
    - { id: desc, text: { en: "Add the key to the description of the OpenAPI function definition.", fr: "Ajouter la clé à la description de la définition de fonction OpenAPI." } }
    - { id: role, text: { en: "Assign the project managed identity a role on the booking API.", fr: "Attribuer un rôle sur l'API de réservation à l'identité managée du projet." } }
    - { id: a2a, text: { en: "Enable incoming A2A on travel-agent.", fr: "Activer l'A2A entrant sur travel-agent." } }
answer:
  sequence: [conn, tool, version]
explanation:
  correct:
    en: |
      Credentials of an OpenAPI tool stay in a project connection; for API key authentication, the key name in the connection must match the header or query parameter declared in `securitySchemes`. The tool definition then references the connection ID, and the tool takes effect when you create a new agent version that includes it.
    fr: |
      Les informations d'identification d'un outil OpenAPI restent dans une connexion de projet ; pour l'authentification par clé API, le nom de la clé dans la connexion doit correspondre à l'en-tête ou au paramètre de requête déclaré dans `securitySchemes`. La définition de l'outil référence ensuite l'ID de la connexion, et l'outil prend effet quand vous créez une nouvelle version de l'agent qui l'inclut.
  options:
    desc:
      en: "The description guides the model's choice of operation; a key placed there would be exposed to the model and stored in clear text."
      fr: "La description guide le choix d'opération du modèle ; une clé placée là serait exposée au modèle et stockée en clair."
    role:
      en: "A role assignment is for managed identity authentication; the partner API uses an API key."
      fr: "Une attribution de rôle sert à l'authentification par identité managée ; l'API du partenaire utilise une clé API."
    a2a:
      en: "Incoming A2A lets other agents call travel-agent; it isn't related to calling a REST API."
      fr: "L'A2A entrant permet à d'autres agents d'appeler travel-agent ; il n'a pas de rapport avec l'appel d'une API REST."
references:
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
