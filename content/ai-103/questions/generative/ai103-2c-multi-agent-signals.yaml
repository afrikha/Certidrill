id: ai103-2c-multi-agent-signals
objective: "2.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing an agent solution for employees. The architecture team follows the Microsoft guidance on choosing between a single agent and a multi-agent system.

    The team has listed the requirements below. Which two requirements are reasons to start with a multi-agent design instead of a single agent?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit une solution d'agents pour ses employés. L'équipe d'architecture suit les recommandations de Microsoft pour choisir entre un agent unique et un système multi-agent.

    L'équipe a listé les exigences ci-dessous. Quelles sont les deux exigences qui justifient de commencer par une conception multi-agent plutôt que par un agent unique ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Payroll data and IT support data fall under different compliance boundaries.", fr: "Les données de paie et les données du support informatique relèvent de périmètres de conformité différents." } }
    - { id: b, text: { en: "The agent must answer from one more Azure AI Search index.", fr: "L'agent doit répondre à partir d'un index Azure AI Search supplémentaire." } }
    - { id: c, text: { en: "The HR team and the IT team will each build and maintain their own part.", fr: "L'équipe RH et l'équipe informatique créeront et maintiendront chacune leur propre partie." } }
    - { id: d, text: { en: "Every answer must include citations to the source documents.", fr: "Chaque réponse doit inclure des citations des documents sources." } }
    - { id: e, text: { en: "The solution must keep the number of model calls per request low.", fr: "La solution doit limiter le nombre d'appels de modèle par requête." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Microsoft's guidance is to start with a multi-agent system when the use case crosses security and compliance boundaries, involves multiple teams, or is expected to grow. Other use cases should first test whether a single agent meets the requirements.
    fr: |
      Les recommandations de Microsoft sont de commencer par un système multi-agent quand le cas d'usage franchit des périmètres de sécurité et de conformité, implique plusieurs équipes ou doit croître. Les autres cas d'usage doivent d'abord vérifier si un agent unique satisfait les exigences.
  options:
    b:
      en: |
        One more data source is met by adding a knowledge tool to the agent, not by adding agents.
      fr: |
        Une source de données de plus se traite en ajoutant un outil de connaissances à l'agent, pas en ajoutant des agents.
    d:
      en: |
        Citations come from the knowledge tool and the instructions of the agent; they don't require several agents.
      fr: |
        Les citations proviennent de l'outil de connaissances et des instructions de l'agent ; elles n'exigent pas plusieurs agents.
    e:
      en: |
        Several agents usually add model calls and coordination, so this requirement favors a single agent.
      fr: |
        Plusieurs agents ajoutent en général des appels de modèle et de la coordination : cette exigence favorise un agent unique.
references:
  - title: Operational standards for AI agents
    url: https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/ai-agents/single-agent-multiple-agents
