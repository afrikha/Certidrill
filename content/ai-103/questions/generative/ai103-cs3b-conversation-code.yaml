id: ai103-cs3b-conversation-code
objective: "2.1.6"
type: dropdown
caseStudy: ai103-cs3b-alpine
difficulty: 2
status: draft
stem:
  en: |
    You are writing the code of guest-api that sends guest utterances to ski-concierge. You need to meet the access and conversations requirements.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le code de guest-api qui envoie les énoncés des clients à ski-concierge. Vous devez satisfaire les exigences d'accès et de conversations.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.projects import AIProjectClient
    from azure.identity import DefaultAzureCredential

    project = AIProjectClient(
        endpoint="[[e1]]",
        credential=DefaultAzureCredential(),
    )
    openai = project.[[e2]](agent_name="ski-concierge")

    # First turn: create the conversation and store its ID
    conversation = openai.[[e3]].create()

    # Each turn
    response = openai.responses.create(
        [[e4]]=conversation.id,
        input=utterance,
    )
  slots:
    - id: e1
      options:
        - { id: a, text: "https://alpine-ai.services.ai.azure.com/api/projects/concierge" }
        - { id: b, text: "https://alpine-ai.openai.azure.com/openai/deployments/chat-main" }
        - { id: c, text: "https://concierge.services.ai.azure.com/api/projects/alpine-ai" }
    - id: e2
      options:
        - { id: a, text: "connections.get" }
        - { id: b, text: "agents.get" }
        - { id: c, text: "get_openai_client" }
    - id: e3
      options:
        - { id: a, text: "threads" }
        - { id: b, text: "conversations" }
        - { id: c, text: "responses" }
    - id: e4
      options:
        - { id: a, text: "thread_id" }
        - { id: b, text: "previous_response_id" }
        - { id: c, text: "conversation" }
answer:
  values: { e1: a, e2: c, e3: b, e4: c }
explanation:
  correct:
    en: |
      The project endpoint has the format `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. `get_openai_client(agent_name=...)` returns an OpenAI-compatible client bound to the agent. `conversations.create()` creates a conversation that Foundry stores, and passing its ID in the `conversation` parameter of `responses.create` lets each turn send only the new input.
    fr: |
      Le point de terminaison du projet a le format `https://<resource-name>.services.ai.azure.com/api/projects/<project-name>`. `get_openai_client(agent_name=...)` renvoie un client compatible OpenAI lié à l'agent. `conversations.create()` crée une conversation stockée par Foundry, et transmettre son ID dans le paramètre `conversation` de `responses.create` permet à chaque tour de n'envoyer que la nouvelle entrée.
  options:
    e1:
      en: |
        The `openai.azure.com/openai/deployments/...` URL targets a model deployment, not the project and its agents; the third URL swaps the resource and project names.
      fr: |
        L'URL `openai.azure.com/openai/deployments/...` cible un déploiement de modèle, pas le projet et ses agents ; la troisième URL inverse les noms de la ressource et du projet.
    e3:
      en: |
        Threads belong to the classic Agents API of the 1.x SDK; the 2.x SDK uses conversations with the Responses API.
      fr: |
        Les threads appartiennent à l'API Agents classique du SDK 1.x ; le SDK 2.x utilise des conversations avec l'API Responses.
    e4:
      en: "`previous_response_id` expects the ID of a response, not of a conversation, and `thread_id` is not a parameter of the Responses API."
      fr: "`previous_response_id` attend l'ID d'une réponse, pas d'une conversation, et `thread_id` n'est pas un paramètre de l'API Responses."
references:
  - title: "Quickstart: Create a prompt agent"
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/prompt-agent
