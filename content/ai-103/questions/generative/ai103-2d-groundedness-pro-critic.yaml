id: ai103-2d-groundedness-pro-critic
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's RAG pipeline drafts answers with a **gpt-4.1-mini** deployment. An earlier step already rejects drafts that contain claims the retrieved context doesn't support. Reviewers now report grounded drafts that drift to related topics and don't address what the user asked.

    You need to add a critique step that scores each draft against the user's question and returns a pass or fail result. The critique step must use the existing gpt-4.1-mini deployment as the judge and must not need a reference answer.

    Which evaluator should you use as the critique step?
  fr: |
    Le pipeline RAG de Contoso rédige des réponses avec un déploiement **gpt-4.1-mini**. Une étape antérieure rejette déjà les brouillons qui contiennent des affirmations que le contexte récupéré n'étaye pas. Les relecteurs signalent maintenant des brouillons ancrés qui dérivent vers des sujets voisins et ne traitent pas ce que l'utilisateur a demandé.

    Vous devez ajouter une étape de critique qui note chaque brouillon par rapport à la question de l'utilisateur et renvoie un résultat de réussite ou d'échec. L'étape de critique doit utiliser le déploiement gpt-4.1-mini existant comme juge et ne doit pas nécessiter de réponse de référence.

    Quel évaluateur devez-vous utiliser pour l'étape de critique ?
body:
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Relevance }
    - { id: c, text: Groundedness Pro }
    - { id: d, text: Response Completeness }
answer: { optionId: b }
explanation:
  correct:
    en: "Relevance measures the accuracy, completeness and direct relevance of the response to the query. It takes the query and the response, uses a judge model deployment (deployment_name), and returns a 1 to 5 score with a pass or fail result against the default threshold of 3."
    fr: "Relevance mesure l'exactitude, l'exhaustivité et la pertinence directe de la réponse par rapport à la requête. Il reçoit la requête et la réponse, utilise un déploiement de modèle juge (deployment_name) et renvoie un score de 1 à 5 avec un résultat de réussite ou d'échec par rapport au seuil par défaut de 3."
  options:
    a: { en: "Groundedness checks whether the response is supported by the context, which the earlier step already does; a grounded draft can still miss the question.", fr: "Groundedness vérifie si la réponse est étayée par le contexte, ce que fait déjà l'étape antérieure ; un brouillon ancré peut tout de même passer à côté de la question." }
    c: { en: "Groundedness Pro (preview) checks consistency with the context through Azure AI Content Safety, not whether the draft addresses the question, and it doesn't use the gpt-4.1-mini judge.", fr: "Groundedness Pro (préversion) vérifie la cohérence avec le contexte au moyen d'Azure AI Content Safety, pas si le brouillon traite la question, et il n'utilise pas le juge gpt-4.1-mini." }
    d: { en: "Response Completeness (preview) compares the response with a ground truth, which the requirements exclude.", fr: "Response Completeness (préversion) compare la réponse à une vérité terrain, ce que les exigences excluent." }
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
