id: ai103-2d-groundedness-pro-critic
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's RAG pipeline drafts answers with a **gpt-4.1-mini** deployment. Before an answer is returned, a critique step must decide whether the answer is consistent with the query and the retrieved context.

    The critique step must return a simple pass or fail decision, and the team doesn't want to deploy or pay for a separate judge model for this step.

    Which evaluator should you use as the critique step?
  fr: |
    Le pipeline RAG de Contoso rédige des réponses avec un déploiement **gpt-4.1-mini**. Avant le renvoi d'une réponse, une étape de critique doit décider si elle est cohérente avec la requête et le contexte récupéré.

    L'étape de critique doit renvoyer une simple décision de réussite ou d'échec, et l'équipe ne veut ni déployer ni payer un modèle juge distinct pour cette étape.

    Quel évaluateur devez-vous utiliser pour l'étape de critique ?
body:
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Relevance }
    - { id: c, text: Groundedness Pro }
    - { id: d, text: Response Completeness }
answer: { optionId: c }
explanation:
  correct:
    en: "Groundedness Pro (preview) uses Azure AI Content Safety to check that a response is consistent with the query and the context. It returns a pass or fail result and doesn't require a model deployment."
    fr: "Groundedness Pro (préversion) utilise Azure AI Content Safety pour vérifier qu'une réponse est cohérente avec la requête et le contexte. Il renvoie un résultat de réussite ou d'échec et ne nécessite aucun déploiement de modèle."
  options:
    a: { en: "Groundedness checks the same property but needs a judge model deployment (deployment_name) and returns a 1 to 5 score.", fr: "Groundedness vérifie la même propriété mais nécessite un déploiement de modèle juge (deployment_name) et renvoie un score de 1 à 5." }
    b: { en: "Relevance judges whether the response addresses the query, not whether it is supported by the context, and it needs a judge model.", fr: "Relevance juge si la réponse traite la requête, pas si elle est étayée par le contexte, et nécessite un modèle juge." }
    d: { en: "Response Completeness compares the response with a ground truth, which a live pipeline doesn't have, and it needs a judge model.", fr: "Response Completeness compare la réponse à une vérité terrain, dont un pipeline en production ne dispose pas, et nécessite un modèle juge." }
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
