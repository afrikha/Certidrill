id: ai103-cs2c-order-schema
objective: "2.2.1"
type: dropdown
caseStudy: ai103-cs2c-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You are defining the place_order tool of order-agent. You need to meet the orders requirement. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous définissez l'outil place_order de order-agent. Vous devez satisfaire l'exigence relative aux commandes. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    order_tool = FunctionTool(
        name="place_order",
        description="Place a pickup order in a Fourth Coffee store.",
        parameters={
            "type": "object",
            "properties": {
                "store_id": {"type": "string", "description": "Store code, for example FC-0142"},
                "drink": {"type": "string", "enum": ["latte", "cappuccino", "flat_white", "cold_brew"]},
                "size": [[size]],
                "pickup_time": {"type": ["string", "null"], "description": "Pickup time in HH:MM format, or null"},
            },
            "required": ["store_id", "drink", "size", "pickup_time"],
            "additionalProperties": [[additional]],
        },
        strict=[[strict]],
    )
  slots:
    - id: size
      options:
        - { id: enum, text: '{"type": "string", "enum": ["small", "medium", "large"]}' }
        - { id: pattern, text: '{"type": "string", "pattern": "^(small|medium|large)$"}' }
        - { id: maxlength, text: '{"type": "string", "maxLength": 6}' }
    - id: additional
      options:
        - { id: afalse, text: "False" }
        - { id: atrue, text: "True" }
    - id: strict
      options:
        - { id: strue, text: "True" }
        - { id: sfalse, text: "False" }
answer:
  values: { size: enum, additional: afalse, strict: strue }
explanation:
  correct:
    en: |
      `strict=True` makes the arguments that the model generates follow the JSON schema of the function exactly. Strict mode requires `additionalProperties` set to false on every object and every property in `required` (the optional pickup time is already a union with `null`). An `enum` is supported and limits the size to the three allowed values.
    fr: |
      `strict=True` impose que les arguments générés par le modèle suivent exactement le schéma JSON de la fonction. Le mode strict exige `additionalProperties` défini sur false sur chaque objet et chaque propriété dans `required` (l'heure de retrait facultative est déjà une union avec `null`). Un `enum` est pris en charge et limite la taille aux trois valeurs autorisées.
  options:
    size:
      en: |
        `pattern` and `maxLength` are among the string keywords that structured outputs don't support, so the schema can't be used in strict mode.
      fr: |
        `pattern` et `maxLength` font partie des mots clés de chaîne que les sorties structurées ne prennent pas en charge : le schéma ne peut donc pas être utilisé en mode strict.
    additional:
      en: |
        Strict mode requires `additionalProperties` set to false; with true, the model could add arguments that the function doesn't expect.
      fr: |
        Le mode strict exige `additionalProperties` défini sur false ; avec true, le modèle pourrait ajouter des arguments que la fonction n'attend pas.
    strict:
      en: |
        Without strict mode, the arguments are usually valid but aren't guaranteed to conform to the schema.
      fr: |
        Sans le mode strict, les arguments sont généralement valides mais leur conformité au schéma n'est pas garantie.
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
