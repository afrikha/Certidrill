id: ai103-2a-content-parts
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders inspects delivered goods. A deployment named **inspect-vision** runs a multimodal model. For each delivery, the application must send in one Responses API request a question, a photo stored at a public URL, and the delivery report, a PDF file read from the local disk.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders inspecte les marchandises livrées. Un déploiement nommé **inspect-vision** exécute un modèle multimodal. Pour chaque livraison, l'application doit envoyer dans une seule requête de l'API Responses une question, une photo stockée à une URL publique et le bon de livraison, un fichier PDF lu sur le disque local.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    with open("delivery-4471.pdf", "rb") as f:
        pdf_b64 = base64.b64encode(f.read()).decode("utf-8")

    response = openai.responses.create(
        model="inspect-vision",
        input=[{
            "role": "user",
            "content": [
                {"type": [[text]], "text": "Does the photo match the delivery report?"},
                {"type": "input_image", "image_url": photo_url},
                {
                    "type": [[file]],
                    "filename": "delivery-4471.pdf",
                    [[data]]: f"data:application/pdf;base64,{pdf_b64}",
                },
            ],
        }],
    )
  slots:
    - id: text
      options:
        - { id: outtext, text: "\"output_text\"" }
        - { id: intext, text: "\"input_text\"" }
        - { id: plain, text: "\"text\"" }
    - id: file
      options:
        - { id: infile, text: "\"input_file\"" }
        - { id: inimage, text: "\"input_image\"" }
        - { id: search, text: "\"file_search\"" }
    - id: data
      options:
        - { id: fileid, text: "\"file_id\"" }
        - { id: fileurl, text: "\"file_url\"" }
        - { id: filedata, text: "\"file_data\"" }
answer:
  values: { text: intext, file: infile, data: filedata }
explanation:
  correct:
    en: In a Responses API input message, text goes in an `input_text` part and images in an `input_image` part. A PDF goes in an `input_file` part; when the content is base64-encoded in the request, it is passed in `file_data` as a data URL, with a `filename`.
    fr: Dans un message d'entrée de l'API Responses, le texte va dans une partie `input_text` et les images dans une partie `input_image`. Un PDF va dans une partie `input_file` ; lorsque le contenu est encodé en base64 dans la requête, il est passé dans `file_data` sous forme d'URL de données, avec un `filename`.
  options:
    outtext: { en: "output_text is the type of text generated by the model, not of input content.", fr: "output_text est le type du texte généré par le modèle, pas du contenu d'entrée." }
    inimage: { en: "input_image is for images; a PDF document is sent as input_file.", fr: "input_image est réservé aux images ; un document PDF est envoyé en input_file." }
    search: { en: "file_search is a tool type that searches vector stores, not a content part.", fr: "file_search est un type d'outil qui interroge des magasins de vecteurs, pas une partie de contenu." }
    fileid: { en: "file_id references a file already uploaded with files.create; here the content is inline.", fr: "file_id référence un fichier déjà chargé avec files.create ; ici, le contenu est inclus dans la requête." }
    fileurl: { en: "file_url points to an external URL; the PDF is read from the local disk.", fr: "file_url pointe vers une URL externe ; le PDF est lu sur le disque local." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
