id: ai103-2a-router-default
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs an internal assistant in a Foundry project. Prompts range from simple rewording requests to complex multistep analyses. Today every prompt goes to the same large model, which is expensive.

    You need a single deployment that sends each prompt to the most cost-effective model while keeping quality close to the best model for that prompt. The developers must not write or maintain their own routing logic.

    What should you do?
  fr: |
    Contoso exécute un assistant interne dans un projet Foundry. Les invites vont de simples demandes de reformulation à des analyses complexes en plusieurs étapes. Aujourd'hui, chaque invite est envoyée au même grand modèle, ce qui coûte cher.

    Vous avez besoin d'un déploiement unique qui envoie chaque invite au modèle le plus rentable tout en gardant une qualité proche de celle du meilleur modèle pour cette invite. Les développeurs ne doivent ni écrire ni maintenir leur propre logique de routage.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Deploy a reasoning model and set its reasoning effort to low for every prompt.", fr: "Déployer un modèle de raisonnement et régler son effort de raisonnement sur low pour chaque invite." } }
    - { id: b, text: { en: "Deploy a small model and a large model, then classify each prompt in the application to pick one.", fr: "Déployer un petit modèle et un grand modèle, puis classer chaque invite dans l'application pour choisir l'un d'eux." } }
    - { id: c, text: { en: "Move the large model to a Global Provisioned deployment to get a lower price per token.", fr: "Passer le grand modèle à un déploiement Global Provisioned pour obtenir un prix par jeton inférieur." } }
    - { id: d, text: { en: "Deploy model router with the default routing mode and call its deployment name.", fr: "Déployer le routeur de modèles avec le mode de routage par défaut et appeler son nom de déploiement." } }
answer: { optionId: d }
explanation:
  correct:
    en: Model router is a deployable model that routes each prompt in real time to the most suitable underlying model. Its default Balanced mode considers models within about 1–2% of the best quality for the prompt and picks the most cost-effective one, so the application just calls one deployment.
    fr: Le routeur de modèles est un modèle déployable qui achemine chaque invite en temps réel vers le modèle sous-jacent le plus adapté. Son mode par défaut, Balanced, considère les modèles situés à environ 1 à 2 % de la meilleure qualité pour l'invite et choisit le plus rentable ; l'application appelle simplement un déploiement.
  options:
    a:
      en: A single model with low effort lowers cost on every prompt, including the complex ones, so quality drops where it matters.
      fr: |
        Un modèle unique avec un effort faible réduit le coût de toutes les invites, y compris les complexes : la qualité baisse là où elle compte.
    b:
      en: Classifying prompts in the application is custom routing logic that the developers would have to maintain.
      fr: Classer les invites dans l'application revient à écrire une logique de routage personnalisée que les développeurs devraient maintenir.
    c:
      en: Provisioned throughput reserves capacity for predictable latency; it does not send simple prompts to cheaper models.
      fr: Le débit provisionné réserve de la capacité pour une latence prévisible ; il n'envoie pas les invites simples vers des modèles moins chers.
references:
  - title: Model router for Microsoft Foundry concepts
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-router
