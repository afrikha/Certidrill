id: ai103-2c-pattern-per-process
objective: "2.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam, Inc. is automating three processes with Microsoft Agent Framework. Each process uses several specialized agents, as described in the answer area.

    Which orchestration pattern should you use for each process? To answer, drag the appropriate patterns to the correct processes. Each pattern may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. automatise trois processus avec Microsoft Agent Framework. Chaque processus utilise plusieurs agents spécialisés, comme décrit dans la zone de réponse.

    Quel modèle d'orchestration devez-vous utiliser pour chaque processus ? Pour répondre, faites glisser les modèles appropriés vers les processus correspondants. Chaque modèle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sequential, text: Sequential }
    - { id: concurrent, text: Concurrent }
    - { id: handoff, text: Handoff }
    - { id: groupchat, text: Group chat }
    - { id: magentic, text: Magentic }
  targets:
    - id: t1
      text: { en: "Supplier onboarding: an extraction agent reads the form, then a validation agent checks the extracted data, then a filing agent stores it, always in this order", fr: "Référencement de fournisseurs : un agent d'extraction lit le formulaire, puis un agent de validation contrôle les données extraites, puis un agent d'archivage les enregistre, toujours dans cet ordre" }
    - id: t2
      text: { en: "Bid review: a legal agent, a finance agent and a technical agent analyze the same bid independently, and their results are combined to cut total processing time", fr: "Examen des appels d'offres : un agent juridique, un agent financier et un agent technique analysent la même offre de façon indépendante, et leurs résultats sont combinés pour réduire la durée totale de traitement" }
    - id: t3
      text: { en: "Incident investigation: the steps aren't known in advance; a manager agent builds a plan, picks the next specialist each round and replans when progress stalls", fr: "Enquête sur incident : les étapes ne sont pas connues à l'avance ; un agent gestionnaire établit un plan, choisit le spécialiste suivant à chaque cycle et replanifie quand la progression stagne" }
answer:
  mapping: { t1: sequential, t2: concurrent, t3: magentic }
explanation:
  correct:
    en: |
      Sequential runs agents one after another in a defined order, each output feeding the next. Concurrent runs agents in parallel and combines their results, which lowers total latency for independent work. Magentic uses a manager agent that plans, selects the next agent and replans when progress stalls, for open-ended tasks with no known solution path.
    fr: |
      Sequential exécute les agents l'un après l'autre dans un ordre défini, chaque sortie alimentant la suivante. Concurrent exécute les agents en parallèle et combine leurs résultats, ce qui réduit la latence totale pour un travail indépendant. Magentic utilise un agent gestionnaire qui planifie, choisit l'agent suivant et replanifie quand la progression stagne, pour des tâches ouvertes sans chemin de résolution connu.
  options:
    handoff:
      en: "Handoff transfers the whole conversation to one specialist chosen from the context; none of the processes routes a user to a single specialist."
      fr: "Handoff transfère toute la conversation à un spécialiste choisi selon le contexte ; aucun processus ne route un utilisateur vers un seul spécialiste."
    groupchat:
      en: "Group chat has agents collaborate in one shared conversation, without the planning and replanning that the investigation needs."
      fr: "Group chat fait collaborer les agents dans une conversation partagée, sans la planification et la replanification dont l'enquête a besoin."
references:
  - title: Workflow orchestrations in Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/overview
  - title: Microsoft Agent Framework Workflows Orchestrations - Magentic
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/magentic
