id: ai103-2c-search-keyless-roles
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Foundry account named woodgrove-ai that contains a project named hr-assist. An Azure AI Search service named srch-hr contains an index named hr-policies.

    You are adding the Azure AI Search tool to an agent in hr-assist. The project connection to srch-hr must use Microsoft Entra ID authentication with the system-assigned managed identity of woodgrove-ai instead of an API key.

    Which two roles should you assign to the managed identity on srch-hr? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'un compte Microsoft Foundry nommé woodgrove-ai qui contient un projet nommé hr-assist. Un service Azure AI Search nommé srch-hr contient un index nommé hr-policies.

    Vous ajoutez l'outil Azure AI Search à un agent de hr-assist. La connexion de projet vers srch-hr doit utiliser l'authentification Microsoft Entra ID avec l'identité managée affectée par le système de woodgrove-ai plutôt qu'une clé API.

    Quels sont les deux rôles à attribuer à l'identité managée sur srch-hr ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Search Index Data Reader }
    - { id: b, text: Search Service Contributor }
    - { id: c, text: Reader }
    - { id: d, text: Search Index Data Contributor }
    - { id: e, text: Storage Blob Data Reader }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      For keyless access, the Azure AI Search tool uses the system-assigned managed identity of the Foundry account that contains the project. Learn lists two roles to assign to that identity on the search service: Search Index Data Contributor and Search Service Contributor.
    fr: |
      Pour un accès sans clé, l'outil Azure AI Search utilise l'identité managée affectée par le système du compte Foundry qui contient le projet. Learn indique deux rôles à attribuer à cette identité sur le service de recherche : Search Index Data Contributor et Search Service Contributor.
  options:
    a:
      en: |
        Search Index Data Reader isn't one of the roles that the tool's keyless setup requires.
      fr: |
        Search Index Data Reader ne fait pas partie des rôles qu'exige la configuration sans clé de l'outil.
    c:
      en: |
        Reader grants read access to the Azure resource in the control plane only; it doesn't give access to index data or service operations that the tool uses.
      fr: |
        Reader donne un accès en lecture à la ressource Azure dans le plan de contrôle uniquement ; il ne donne pas accès aux données d'index ni aux opérations du service qu'utilise l'outil.
    e:
      en: |
        The tool queries an existing index on the search service; it doesn't read the storage account that may hold the source documents.
      fr: |
        L'outil interroge un index existant sur le service de recherche ; il ne lit pas le compte de stockage qui contient éventuellement les documents sources.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search
