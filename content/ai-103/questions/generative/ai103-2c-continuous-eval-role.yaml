id: ai103-2c-continuous-eval-role
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry project named retail that hosts an agent named loans-agent. Application Insights is connected to the project, and the Monitor tab shows token usage and latency.

    You create a continuous evaluation rule that runs safety evaluators on completed responses of loans-agent. No evaluation results appear, and the evaluation runs fail with an authorization error.

    What should you do?
  fr: |
    Woodgrove Bank dispose d'un projet Foundry nommé retail qui héberge un agent nommé loans-agent. Application Insights est connecté au projet, et l'onglet Monitor affiche l'utilisation des jetons et la latence.

    Vous créez une règle d'évaluation continue qui exécute des évaluateurs de sécurité sur les réponses terminées de loans-agent. Aucun résultat d'évaluation n'apparaît, et les exécutions d'évaluation échouent avec une erreur d'autorisation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Log Analytics Reader role to your account on the Application Insights resource.", fr: "Attribuer le rôle Log Analytics Reader à votre compte sur la ressource Application Insights." } }
    - { id: b, text: { en: "Assign the Foundry User role to the managed identity of the retail project on the project.", fr: "Attribuer le rôle Foundry User à l'identité managée du projet retail sur le projet." } }
    - { id: c, text: { en: "Increase `max_hourly_runs` in the continuous evaluation rule action.", fr: "Augmenter `max_hourly_runs` dans l'action de la règle d'évaluation continue." } }
    - { id: d, text: { en: "Assign the Foundry Agent Consumer role to your account on the retail project.", fr: "Attribuer le rôle Foundry Agent Consumer à votre compte sur le projet retail." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Continuous evaluation runs under the project's managed identity, which needs the Foundry User role (previously named Azure AI User). You assign it in Access control (IAM) of the Foundry project resource, with the project's managed identity as the member.
    fr: |
      L'évaluation continue s'exécute sous l'identité managée du projet, qui a besoin du rôle Foundry User (anciennement Azure AI User). Vous l'attribuez dans le contrôle d'accès (IAM) de la ressource du projet Foundry, avec l'identité managée du projet comme membre.
  options:
    a:
      en: |
        Log Analytics Reader lets a user read log-based views and traces; it doesn't authorize the evaluation runs, which use the project's identity.
      fr: |
        Log Analytics Reader permet à un utilisateur de lire les vues fondées sur les journaux et les traces ; il n'autorise pas les exécutions d'évaluation, qui utilisent l'identité du projet.
    c:
      en: |
        Runs beyond `max_hourly_runs` (100 by default) are skipped, not failed with an authorization error.
      fr: |
        Les exécutions au-delà de `max_hourly_runs` (100 par défaut) sont ignorées, elles n'échouent pas avec une erreur d'autorisation.
    d:
      en: |
        Foundry Agent Consumer lets an identity call agents of a project, for example over A2A; the evaluation runs don't use your account.
      fr: |
        Foundry Agent Consumer permet à une identité d'appeler les agents d'un projet, par exemple en A2A ; les exécutions d'évaluation n'utilisent pas votre compte.
references:
  - title: Monitor agents with the Agent Monitoring Dashboard
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard
