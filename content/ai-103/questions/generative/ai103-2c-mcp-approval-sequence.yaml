id: ai103-2c-mcp-approval-sequence
objective: "2.2.5"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a Foundry prompt agent named hr-agent. hr-agent has an MCP tool for the HR system with `require_approval="always"`. The application calls hr-agent through a conversation by using the Responses API.

    An employee asks hr-agent to update their home address. You need to implement the approval flow so that an HR officer approves the tool call before it runs.

    Which four actions should the application perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation dispose d'un agent d'invite Foundry nommé hr-agent. hr-agent possède un outil MCP pour le système RH avec `require_approval="always"`. L'application appelle hr-agent dans une conversation à l'aide de l'API Responses.

    Un employé demande à hr-agent de mettre à jour son adresse personnelle. Vous devez implémenter le flux d'approbation pour qu'un responsable RH approuve l'appel d'outil avant son exécution.

    Quelles sont les quatre actions que l'application doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: send, text: { en: "Send the employee's message to hr-agent in the conversation.", fr: "Envoyer le message de l'employé à hr-agent dans la conversation." } }
    - { id: find, text: { en: "Find the `mcp_approval_request` item in the response output.", fr: "Trouver l'élément `mcp_approval_request` dans la sortie de la réponse." } }
    - { id: show, text: { en: "Show the tool name and arguments to the HR officer and record the decision.", fr: "Montrer le nom de l'outil et les arguments au responsable RH et enregistrer sa décision." } }
    - { id: reply, text: { en: "Send an `mcp_approval_response` item with `approve` and `approval_request_id` in the same conversation.", fr: "Envoyer un élément `mcp_approval_response` avec `approve` et `approval_request_id` dans la même conversation." } }
    - { id: output, text: { en: "Send a `function_call_output` item with the `call_id` of the request.", fr: "Envoyer un élément `function_call_output` avec le `call_id` de la demande." } }
    - { id: newconv, text: { en: "Create a new conversation that contains only the approval decision.", fr: "Créer une nouvelle conversation qui ne contient que la décision d'approbation." } }
answer:
  sequence: [send, find, show, reply]
explanation:
  correct:
    en: |
      When the model wants to call a tool that requires approval, the response contains an `mcp_approval_request` item with the server, tool name and arguments. The application shows them to the approver and then submits an `mcp_approval_response` item whose `approve` is the decision and whose `approval_request_id` is the ID of the request item, in the same conversation.
    fr: |
      Quand le modèle veut appeler un outil qui exige une approbation, la réponse contient un élément `mcp_approval_request` avec le serveur, le nom de l'outil et les arguments. L'application les montre à l'approbateur, puis soumet dans la même conversation un élément `mcp_approval_response` dont `approve` est la décision et `approval_request_id` l'ID de l'élément de demande.
  options:
    output:
      en: "`function_call_output` returns the result of a function tool that your code ran; MCP tools are run by the service after approval."
      fr: "`function_call_output` renvoie le résultat d'un outil de fonction exécuté par votre code ; les outils MCP sont exécutés par le service après approbation."
    newconv:
      en: "The approval response must be sent in the same conversation as the request."
      fr: "La réponse d'approbation doit être envoyée dans la même conversation que la demande."
references:
  - title: Connect agents to Model Context Protocol servers
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
