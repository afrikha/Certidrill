id: ai103-2c-trace-span-analysis
objective: "2.2.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Foundry agent named returns-agent. A customer reports that returns-agent took a long time to answer and then said that it couldn't find the status of the order.

    You open the trace of the run on the Traces page. The spans of the run are shown in the following table.

    Answer each prompt by selecting the appropriate span.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un agent Foundry nommé returns-agent. Un client signale que returns-agent a mis longtemps à répondre, puis a indiqué qu'il ne trouvait pas l'état de la commande.

    Vous ouvrez la trace de l'exécution dans la page Traces. Les étendues de l'exécution figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'étendue appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The span that accounts for most of the latency of the run", fr: "L'étendue qui représente l'essentiel de la latence de l'exécution" }
    - id: p2
      text: { en: "The span that explains why returns-agent couldn't give the order status", fr: "L'étendue qui explique pourquoi returns-agent n'a pas pu donner l'état de la commande" }
  grid:
    header: [{ en: Step, fr: Étape }, { en: Span, fr: Étendue }, { en: Duration, fr: Durée }, { en: Status, fr: État }, { en: Details, fr: Détails }]
    rows:
      - [{ text: "1" }, { text: { en: "Agent run: returns-agent", fr: "Exécution d'agent : returns-agent" }, area: run }, { text: "14.6 s" }, { text: OK }, { text: { en: "Conversation conv_8f2", fr: "Conversation conv_8f2" } }]
      - [{ text: "2" }, { text: { en: "Model call: gpt-4.1-mini", fr: "Appel de modèle : gpt-4.1-mini" }, area: model1 }, { text: "1.1 s" }, { text: OK }, { text: { en: "Requests get_order", fr: "Demande get_order" } }]
      - [{ text: "3" }, { text: { en: "Tool call: get_order", fr: "Appel d'outil : get_order" }, area: getorder }, { text: "0.4 s" }, { text: Error }, { text: { en: "HTTP 403 Forbidden from the order API", fr: "HTTP 403 Forbidden renvoyé par l'API de commandes" } }]
      - [{ text: "4" }, { text: { en: "Model call: gpt-4.1-mini", fr: "Appel de modèle : gpt-4.1-mini" }, area: model2 }, { text: "0.9 s" }, { text: OK }, { text: { en: "Requests search_customer", fr: "Demande search_customer" } }]
      - [{ text: "5" }, { text: { en: "Tool call: search_customer", fr: "Appel d'outil : search_customer" }, area: search }, { text: "11.4 s" }, { text: OK }, { text: { en: "Returns 1 customer", fr: "Renvoie 1 client" } }]
      - [{ text: "6" }, { text: { en: "Model call: gpt-4.1-mini", fr: "Appel de modèle : gpt-4.1-mini" }, area: model3 }, { text: "0.8 s" }, { text: OK }, { text: { en: "Final answer", fr: "Réponse finale" } }]
answer:
  values: { p1: search, p2: getorder }
explanation:
  correct:
    en: |
      Span durations show where latency comes from: the search_customer tool call takes 11.4 of the 14.6 seconds, so the tool, not the model, slowed the run. The get_order tool call failed with HTTP 403, an authorization error, so the agent never received the order data; the fix is to grant the identity used by the tool the required access, not to change the model. The agent run span only aggregates its child spans.
    fr: |
      Les durées des étendues montrent d'où vient la latence : l'appel d'outil search_customer prend 11,4 des 14,6 secondes, c'est donc l'outil, et non le modèle, qui a ralenti l'exécution. L'appel d'outil get_order a échoué avec HTTP 403, une erreur d'autorisation : l'agent n'a jamais reçu les données de la commande, et la correction consiste à accorder l'accès requis à l'identité utilisée par l'outil, pas à changer de modèle. L'étendue de l'exécution d'agent ne fait qu'agréger ses étendues enfants.
references:
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
