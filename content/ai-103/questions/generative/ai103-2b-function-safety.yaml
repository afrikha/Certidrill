id: ai103-2b-function-safety
objective: "2.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is implementing a function tool named get_account that reads customer records from a SQL database for an agent. The application runs the function when the agent requests it.

    Which two practices does Microsoft recommend for this function tool?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders implémente un outil de fonction nommé get_account qui lit les enregistrements clients d'une base de données SQL pour un agent. L'application exécute la fonction quand l'agent la demande.

    Quelles sont les deux pratiques que Microsoft recommande pour cet outil de fonction ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Include the database connection string in the tool output so that the model can retry", fr: "Inclure la chaîne de connexion de la base de données dans la sortie de l'outil pour que le modèle puisse réessayer" } }
    - { id: b, text: { en: "Validate and sanitize the argument values before using them in the query", fr: "Valider et assainir les valeurs des arguments avant de les utiliser dans la requête" } }
    - { id: c, text: { en: "Run the SQL text that the model generates in the arguments directly against the database", fr: "Exécuter directement sur la base de données le texte SQL que le modèle génère dans les arguments" } }
    - { id: d, text: { en: "Return only the data that the model needs to answer", fr: "Ne renvoyer que les données dont le modèle a besoin pour répondre" } }
    - { id: e, text: { en: "Run the function with an identity that has owner rights on the database so that it never fails", fr: "Exécuter la fonction avec une identité dotée de droits de propriétaire sur la base de données pour qu'elle n'échoue jamais" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Learn tells you to treat tool arguments and outputs as untrusted input, and to validate and sanitize values before you use them. It also tells you not to pass secrets in tool output and to return only the data that the model needs.
    fr: |
      Learn indique de traiter les arguments et les sorties des outils comme des entrées non fiables, et de valider et d'assainir les valeurs avant de les utiliser. Il indique aussi de ne pas transmettre de secrets dans la sortie des outils et de ne renvoyer que les données dont le modèle a besoin.
  options:
    a: { en: "Secrets such as connection strings must never be passed in tool output.", fr: "Les secrets comme les chaînes de connexion ne doivent jamais être transmis dans la sortie des outils." }
    c: { en: "Running model-generated SQL trusts the arguments instead of validating them.", fr: "Exécuter du SQL généré par le modèle revient à faire confiance aux arguments au lieu de les valider." }
    e: { en: "Learn recommends least privilege for the identity that the code uses.", fr: "Learn recommande le moindre privilège pour l'identité qu'utilise le code." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
