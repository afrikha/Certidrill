id: ai103-2a-eval-grounded-pro
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's search team tunes the retrieval step of a RAG application that answers questions about insurance contracts. For each test query, experts have labeled the relevance of the documents that should be retrieved. The team wants ranking metrics such as NDCG computed from these labels and the retrieved documents. They don't want to provide a GPT deployment as a judge.

    Which evaluator should you use?
  fr: |
    L'équipe de recherche d'Adatum ajuste l'étape de récupération d'une application RAG qui répond aux questions sur les contrats d'assurance. Pour chaque requête de test, des experts ont étiqueté la pertinence des documents qui doivent être récupérés. L'équipe veut des métriques de classement comme NDCG, calculées à partir de ces étiquettes et des documents récupérés. Elle ne veut pas fournir de déploiement GPT comme juge.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Retrieval }
    - { id: b, text: Groundedness }
    - { id: c, text: Document Retrieval }
    - { id: d, text: Relevance }
answer: { optionId: c }
explanation:
  correct:
    en: Document Retrieval compares the retrieved documents with the labeled relevance judgments (`retrieval_ground_truth` and `retrieved_documents`) and returns metrics such as NDCG, XDCG and Fidelity. It is a calculation, so it needs no judge deployment.
    fr: |
      Document Retrieval compare les documents récupérés aux jugements de pertinence étiquetés (`retrieval_ground_truth` et `retrieved_documents`) et renvoie des métriques comme NDCG, XDCG et Fidelity. C'est un calcul : il n'a pas besoin de déploiement juge.
  options:
    a:
      en: Retrieval uses an LLM judge to rate how relevant the retrieved context is to the query, without labeled judgments, and it requires a deployment_name.
      fr: Retrieval utilise un juge LLM pour noter la pertinence du contexte récupéré par rapport à la requête, sans jugements étiquetés, et il exige un deployment_name.
    b:
      en: Groundedness checks whether the response is supported by the context and requires a judge deployment; it doesn't rank retrieved documents.
      fr: Groundedness vérifie si la réponse est étayée par le contexte et exige un déploiement juge ; il ne classe pas les documents récupérés.
    d:
      en: Relevance rates whether the response addresses the query, with a judge deployment; it doesn't evaluate the retrieval ranking.
      fr: Relevance évalue si la réponse traite la requête, avec un déploiement juge ; il n'évalue pas le classement de la récupération.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
