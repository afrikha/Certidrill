id: ai103-2a-eval-grounded-pro
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's compliance team reviews a RAG application that answers questions about insurance contracts. For each test item, they want a strict true or false verdict on whether the response is consistent with the retrieved context, rather than a 1–5 score. They do not want to provide a GPT deployment as a judge.

    Which evaluator should you use?
  fr: |
    L'équipe de conformité d'Adatum examine une application RAG qui répond à des questions sur des contrats d'assurance. Pour chaque élément de test, elle veut un verdict strict vrai ou faux sur la cohérence de la réponse avec le contexte récupéré, plutôt qu'un score de 1 à 5. Elle ne veut pas fournir de déploiement GPT comme juge.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Ungrounded attributes }
    - { id: c, text: Groundedness Pro }
    - { id: d, text: Response Completeness }
answer: { optionId: c }
explanation:
  correct:
    en: Groundedness Pro (preview) checks strict consistency of the response with the context by using the Azure AI Content Safety service and returns a Boolean pass or fail. It takes query, response and context, with no judge deployment to configure.
    fr: Groundedness Pro (préversion) vérifie la cohérence stricte de la réponse avec le contexte à l'aide du service Azure AI Content Safety et renvoie un résultat booléen réussite ou échec. Il prend la requête, la réponse et le contexte, sans déploiement juge à configurer.
  options:
    a:
      en: Groundedness returns a 1–5 score and requires a deployment_name for its LLM judge.
      fr: Groundedness renvoie un score de 1 à 5 et nécessite un deployment_name pour son LLM juge.
    b:
      en: Ungrounded attributes detects ungrounded inferences about emotional states or protected classes, not general consistency with the context.
      fr: Ungrounded attributes détecte des déductions non étayées sur des états émotionnels ou des catégories protégées, pas la cohérence générale avec le contexte.
    d:
      en: Response Completeness compares the response with a ground truth answer and uses a judge deployment.
      fr: Response Completeness compare la réponse à une réponse de référence et utilise un déploiement juge.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Risk and safety evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
