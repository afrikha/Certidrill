id: ai103-2d-observability-facts
objective: "2.3.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam connects an Application Insights resource to its Foundry project and adds client-side tracing to its Python application. Some helper functions are decorated with `@trace_function`, and content recording is left at its default value.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam connecte une ressource Application Insights à son projet Foundry et ajoute le suivi côté client à son application Python. Certaines fonctions utilitaires sont décorées avec `@trace_function`, et l'enregistrement du contenu est laissé à sa valeur par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "On the Traces tab of the Foundry portal, the team can search, filter and sort the traces of the last 90 days."
        fr: "Dans l'onglet Traces du portail Foundry, l'équipe peut rechercher, filtrer et trier les traces des 90 derniers jours."
    - id: s2
      text:
        en: "The spans of the functions decorated with @trace_function record their parameters and return values only after content recording is enabled."
        fr: "Les étendues des fonctions décorées avec @trace_function n'enregistrent leurs paramètres et leurs valeurs de retour qu'après l'activation de l'enregistrement du contenu."
    - id: s3
      text:
        en: "The retention period of the trace data is set in the Foundry project, independently of the Application Insights configuration."
        fr: "La durée de rétention des données de trace se définit dans le projet Foundry, indépendamment de la configuration d'Application Insights."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The Traces tab lets you search, filter and sort traces from the last 90 days. The content recording setting doesn't affect @trace_function, which always records the parameters and the return value of the decorated function. Traces are stored in Application Insights, and their retention and sampling follow the Application Insights configuration.
    fr: |
      L'onglet Traces permet de rechercher, filtrer et trier les traces des 90 derniers jours. Le paramètre d'enregistrement du contenu n'a pas d'effet sur @trace_function, qui enregistre toujours les paramètres et la valeur de retour de la fonction décorée. Les traces sont stockées dans Application Insights, et leur rétention et leur échantillonnage suivent la configuration d'Application Insights.
references:
  - title: Set Up Tracing for AI Agents in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
  - title: Add client-side tracing to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
