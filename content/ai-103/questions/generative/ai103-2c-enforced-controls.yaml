id: ai103-2c-enforced-controls
objective: "2.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. is building a semiautonomous Foundry agent named refunds-agent. Company policy states that refunds above 200 USD must be approved by a supervisor and that refunds above 2,000 USD must never be issued by the agent. The controls must be enforced even if a prompt injection manipulates the model.

    Which two controls meet the policy without relying on the model's decision? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. crée un agent Foundry semi-autonome nommé refunds-agent. La politique de l'entreprise impose que les remboursements de plus de 200 USD soient approuvés par un superviseur et que les remboursements de plus de 2 000 USD ne soient jamais émis par l'agent. Les contrôles doivent s'appliquer même si une injection de prompt manipule le modèle.

    Quels sont les deux contrôles qui satisfont la politique sans dépendre de la décision du modèle ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add to the instructions: \"Never issue a refund above 2,000 USD.\"", fr: "Ajouter aux instructions : « N'émettez jamais de remboursement supérieur à 2 000 USD. »" } }
    - { id: b, text: { en: "Make the refund function reject any amount above 2,000 USD before it runs.", fr: "Faire rejeter par la fonction de remboursement tout montant supérieur à 2 000 USD avant son exécution." } }
    - { id: c, text: { en: "Add the Task Adherence evaluator to a continuous evaluation rule.", fr: "Ajouter l'évaluateur Task Adherence à une règle d'évaluation continue." } }
    - { id: d, text: { en: "Route refund calls above 200 USD to a tool step that waits for a supervisor's approval.", fr: "Diriger les appels de remboursement supérieurs à 200 USD vers une étape d'outil qui attend l'approbation d'un superviseur." } }
    - { id: e, text: { en: "Lower the temperature of the model deployment to 0.", fr: "Abaisser à 0 la température du déploiement de modèle." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      A check in the function code runs outside the model, so an amount above the limit is refused whatever the model produces. A human approval step on the tool call, configured in the tool or the workflow, pauses the run until a supervisor decides. Both controls hold even if the model is manipulated.
    fr: |
      Un contrôle dans le code de la fonction s'exécute en dehors du modèle : un montant supérieur à la limite est refusé quoi que produise le modèle. Une étape d'approbation humaine sur l'appel d'outil, configurée dans l'outil ou le workflow, suspend l'exécution jusqu'à la décision d'un superviseur. Les deux contrôles tiennent même si le modèle est manipulé.
  options:
    a:
      en: |
        Instructions are a request to the model, not a control; a manipulated model can ignore them.
      fr: |
        Les instructions sont une demande adressée au modèle, pas un contrôle ; un modèle manipulé peut les ignorer.
    c:
      en: |
        Continuous evaluation scores sampled responses after they complete; it detects problems but doesn't prevent a refund.
      fr: |
        L'évaluation continue note un échantillon de réponses une fois celles-ci terminées ; elle détecte les problèmes mais n'empêche pas un remboursement.
    e:
      en: |
        Temperature changes the randomness of the output; it doesn't prevent a manipulated model from calling the tool.
      fr: |
        La température modifie le caractère aléatoire de la sortie ; elle n'empêche pas un modèle manipulé d'appeler l'outil.
references:
