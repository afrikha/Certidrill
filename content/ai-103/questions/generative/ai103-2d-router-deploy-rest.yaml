id: ai103-2d-router-deploy-rest
objective: "2.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry resource named **ai-woodgrove** in West Europe. You are creating a model router deployment named **router-eu** by using the Azure Resource Manager REST API.

    The deployment must meet the following requirements:

    - prompts and responses must be processed only within the European Union data zone;
    - the `reasoning_effort` value sent by the application must be passed to the reasoning models that the router selects;
    - the router must keep receiving model and feature updates.

    How should you complete the request? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'une ressource Foundry nommée **ai-woodgrove** dans la région West Europe. Vous créez un déploiement de model router nommé **router-eu** à l'aide de l'API REST d'Azure Resource Manager.

    Le déploiement doit satisfaire les exigences suivantes :

    - les invites et les réponses doivent être traitées uniquement dans la zone de données de l'Union européenne ;
    - la valeur `reasoning_effort` envoyée par l'application doit être transmise aux modèles de raisonnement que choisit le router ;
    - le router doit continuer à recevoir les mises à jour de modèles et de fonctionnalités.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    curl -X PUT "https://management.azure.com/subscriptions/$SUB_ID/resourceGroups/rg-ai/providers/Microsoft.CognitiveServices/accounts/ai-woodgrove/deployments/router-eu?api-version=2025-10-01-preview" \
      -H "Content-Type: application/json" \
      -H "Authorization: Bearer $AZURE_AI_AUTH_TOKEN" \
      -d '{
        "sku": {"name": "[[sku]]", "capacity": 10},
        "properties": {
          "model": {"format": "OpenAI", "name": "[[model]]", "version": "[[ver]]"}
        }
      }'
  slots:
    - id: sku
      options:
        - { id: global, text: GlobalStandard }
        - { id: datazone, text: DataZoneStandard }
        - { id: provisioned, text: ProvisionedManaged }
        - { id: batch, text: DataZoneBatch }
    - id: model
      options:
        - { id: router, text: model-router }
        - { id: gpt41, text: gpt-4.1 }
        - { id: o4mini, text: o4-mini }
    - id: ver
      options:
        - { id: v0519, text: "2025-05-19" }
        - { id: v0807, text: "2025-08-07" }
        - { id: v1118, text: "2025-11-18" }
answer:
  values: { sku: datazone, model: router, ver: v1118 }
explanation:
  correct:
    en: "Model router supports Global Standard and Data Zone Standard deployments, and a Data Zone deployment processes prompts and responses only within the specified data zone. The router is deployed as the model-router model. Version 2025-11-18 is the active version that receives ongoing updates, and it's the first version that passes reasoning_effort to the selected reasoning model."
    fr: "Le model router prend en charge les déploiements Global Standard et Data Zone Standard, et un déploiement Data Zone ne traite les invites et les réponses que dans la zone de données spécifiée. Le router se déploie comme modèle model-router. La version 2025-11-18 est la version active qui reçoit les mises à jour continues, et c'est la première qui transmet reasoning_effort au modèle de raisonnement sélectionné."
  options:
    global: { en: "Global Standard may process data in any Azure region.", fr: "Global Standard peut traiter les données dans n'importe quelle région Azure." }
    provisioned: { en: "Model router doesn't support provisioned deployments.", fr: "Le model router ne prend pas en charge les déploiements provisionnés." }
    batch: { en: "Model router doesn't support batch deployments.", fr: "Le model router ne prend pas en charge les déploiements Batch." }
    gpt41: { en: "gpt-4.1 is a single model, not the router that selects among models.", fr: "gpt-4.1 est un modèle unique, pas le router qui choisit parmi des modèles." }
    o4mini: { en: "o4-mini is a single reasoning model, not the router.", fr: "o4-mini est un modèle de raisonnement unique, pas le router." }
    v0519: { en: "This version is frozen and doesn't support reasoning_effort.", fr: "Cette version est figée et ne prend pas en charge reasoning_effort." }
    v0807: { en: "This version is frozen and doesn't support reasoning_effort.", fr: "Cette version est figée et ne prend pas en charge reasoning_effort." }
references:
  - title: How to use model router for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/model-router
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/foundry/foundry-models/concepts/deployment-types
