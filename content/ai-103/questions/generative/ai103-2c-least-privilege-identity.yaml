id: ai103-2c-least-privilege-identity
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an autonomous Foundry agent named archive-agent. archive-agent uses an OpenAPI tool to call the Azure Blob Storage REST API on a storage account named stadatumarchive. The project connection uses the project managed identity with the audience `https://storage.azure.com`.

    archive-agent only needs to list and read blobs. Even if a prompt injection convinces the model to call a delete or write operation, the call must fail.

    Which role should you assign to the project managed identity on stadatumarchive?
  fr: |
    Adatum Corporation dispose d'un agent Foundry autonome nommé archive-agent. archive-agent utilise un outil OpenAPI pour appeler l'API REST de Stockage Blob Azure sur un compte de stockage nommé stadatumarchive. La connexion de projet utilise l'identité managée du projet avec l'audience `https://storage.azure.com`.

    archive-agent a seulement besoin de lister et de lire des objets blob. Même si une injection de prompt convainc le modèle d'appeler une opération de suppression ou d'écriture, l'appel doit échouer.

    Quel rôle devez-vous attribuer à l'identité managée du projet sur stadatumarchive ?
body:
  options:
    - { id: a, text: Storage Blob Data Contributor }
    - { id: b, text: Storage Account Contributor }
    - { id: c, text: Storage Blob Data Reader }
    - { id: d, text: Storage Blob Data Owner }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With project managed identity authentication, the OpenAPI tool calls the target API with the project's identity, and Learn advises assigning that identity the least-privileged role on the target service. Storage Blob Data Reader allows listing and reading blobs only, so any write or delete call that the model makes is refused by Azure Storage, whatever the agent's instructions say.
    fr: |
      Avec l'authentification par identité managée du projet, l'outil OpenAPI appelle l'API cible avec l'identité du projet, et Learn recommande d'attribuer à cette identité le rôle de moindre privilège sur le service cible. Storage Blob Data Reader permet uniquement de lister et de lire des objets blob : tout appel d'écriture ou de suppression émis par le modèle est refusé par Stockage Azure, quelles que soient les instructions de l'agent.
  options:
    a:
      en: |
        Storage Blob Data Contributor allows writing and deleting blobs, so an injected delete call would succeed.
      fr: |
        Storage Blob Data Contributor permet d'écrire et de supprimer des objets blob : un appel de suppression injecté réussirait.
    b:
      en: |
        Storage Account Contributor manages the storage account in the control plane and can obtain the account keys; it's far broader than reading blobs.
      fr: |
        Storage Account Contributor gère le compte de stockage dans le plan de contrôle et peut obtenir les clés du compte ; il est bien plus large que la lecture d'objets blob.
    d:
      en: |
        Storage Blob Data Owner grants full access to blob data, including deletion and ACL management.
      fr: |
        Storage Blob Data Owner accorde un accès complet aux données blob, y compris la suppression et la gestion des ACL.
references:
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
