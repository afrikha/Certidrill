id: ai103-2d-legal-temperature
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Legal uses a **gpt-4.1** deployment in a Foundry project to extract termination clauses from contracts. The application sends the requests with `temperature` set to 1.2 and leaves `top_p` at its default value.

    Reviewers report that the same contract produces noticeably different extractions from one run to the next. The source text is always included in the prompt.

    You need to make the output more focused and consistent. What should you do?
  fr: |
    Contoso Legal utilise un déploiement **gpt-4.1** dans un projet Foundry pour extraire les clauses de résiliation des contrats. L'application envoie les requêtes avec `temperature` défini sur 1,2 et laisse `top_p` à sa valeur par défaut.

    Les relecteurs signalent qu'un même contrat produit des extractions sensiblement différentes d'une exécution à l'autre. Le texte source est toujours inclus dans l'invite.

    Vous devez rendre la sortie plus ciblée et plus régulière. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set temperature to 0.2 and leave top_p at its default value.", fr: "Définir temperature sur 0,2 et laisser top_p à sa valeur par défaut." } }
    - { id: b, text: { en: "Set temperature to 1.8 and leave top_p at its default value.", fr: "Définir temperature sur 1,8 et laisser top_p à sa valeur par défaut." } }
    - { id: c, text: { en: "Set frequency_penalty to 1.5 and leave temperature unchanged.", fr: "Définir frequency_penalty sur 1,5 et laisser temperature inchangé." } }
    - { id: d, text: { en: "Double max_completion_tokens and leave temperature unchanged.", fr: "Doubler max_completion_tokens et laisser temperature inchangé." } }
answer: { optionId: a }
explanation:
  correct:
    en: Temperature ranges from 0 to 2 and controls randomness. A low value such as 0.2 makes the output more focused and concrete, which suits legal and extraction tasks. Learn recommends changing temperature or top_p, not both, so top_p stays at its default.
    fr: "Temperature va de 0 à 2 et contrôle le caractère aléatoire. Une valeur basse comme 0,2 rend la sortie plus ciblée et concrète, ce qui convient aux tâches juridiques et d'extraction. Learn recommande de modifier temperature ou top_p, pas les deux : top_p reste donc à sa valeur par défaut."
  options:
    b: { en: "A higher temperature makes the output more random, which increases the variation between runs.", fr: "Une température plus élevée rend la sortie plus aléatoire, ce qui augmente les écarts entre les exécutions." }
    c: { en: "frequency_penalty discourages repeated tokens; it doesn't reduce the randomness that causes different extractions.", fr: "frequency_penalty décourage la répétition de jetons ; il ne réduit pas le caractère aléatoire à l'origine des extractions différentes." }
    d: { en: "max_completion_tokens only caps the length of the output; it has no effect on its variability.", fr: "max_completion_tokens plafonne seulement la longueur de la sortie ; il n'a aucun effet sur sa variabilité." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
