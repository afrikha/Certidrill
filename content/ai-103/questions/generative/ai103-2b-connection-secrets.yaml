id: ai103-2b-connection-secrets
objective: "2.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry resource that contains two projects with a total of 12 connections. The security team plans to store the connection secrets in a key vault that Woodgrove manages, instead of the default storage.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank dispose d'une ressource Foundry qui contient deux projets totalisant 12 connexions. L'équipe de sécurité prévoit de stocker les secrets des connexions dans un coffre de clés géré par Woodgrove, au lieu du stockage par défaut.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Until a key vault connection exists, Foundry stores the connection secrets in a managed key vault that doesn't appear in the Woodgrove subscription.", fr: "Tant qu'il n'existe pas de connexion à un coffre de clés, Foundry stocke les secrets des connexions dans un coffre de clés managé qui n'apparaît pas dans l'abonnement de Woodgrove." } }
    - { id: b, text: { en: "After the key vault is attached, the secrets of the 12 existing connections are migrated to it automatically.", fr: "Une fois le coffre de clés attaché, les secrets des 12 connexions existantes y sont migrés automatiquement." } }
    - { id: c, text: { en: "The Foundry resource can have only one Azure Key Vault connection at a time.", fr: "La ressource Foundry ne peut avoir qu'une seule connexion Azure Key Vault à la fois." } }
    - { id: d, text: { en: "The Azure Key Vault connection can be deleted at any time, even while other connections exist in the projects.", fr: "La connexion Azure Key Vault peut être supprimée à tout moment, même s'il existe d'autres connexions dans les projets." } }
    - { id: e, text: { en: "By default, project.connections.get() returns the secrets stored in the connection.", fr: "Par défaut, project.connections.get() renvoie les secrets stockés dans la connexion." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Without a key vault connection, Foundry keeps connection details in a Microsoft-managed key vault that isn't visible in your subscription. You can bring your own key vault, but a Foundry resource supports only one Azure Key Vault connection at a time.
    fr: |
      Sans connexion à un coffre de clés, Foundry conserve les détails des connexions dans un coffre de clés managé par Microsoft qui n'est pas visible dans votre abonnement. Vous pouvez apporter votre propre coffre de clés, mais une ressource Foundry ne prend en charge qu'une seule connexion Azure Key Vault à la fois.
  options:
    b: { en: "Secret migration isn't supported: connections must be recreated after the key vault is attached.", fr: "La migration des secrets n'est pas prise en charge : les connexions doivent être recréées après l'attachement du coffre de clés." }
    d: { en: "The key vault connection can be deleted only if no other connections exist at the resource or project level.", fr: "La connexion au coffre de clés ne peut être supprimée que s'il n'existe aucune autre connexion au niveau de la ressource ou du projet." }
    e: { en: "include_credentials defaults to False, so get() doesn't return the secrets unless you ask for them.", fr: "include_credentials a la valeur False par défaut : get() ne renvoie pas les secrets sauf si vous les demandez." }
references:
  - title: Add a new connection to your project
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/connections-add
