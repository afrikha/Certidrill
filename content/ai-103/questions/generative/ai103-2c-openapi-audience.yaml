id: ai103-2c-openapi-audience
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. hosts a claims API in Azure App Service. The API is protected by Microsoft Entra ID; its app registration has the application ID URI `api://fabrikam-claims`. The API has an OpenAPI 3.1 specification.

    You add the API to a Foundry agent by using an OpenAPI tool. The solution must not store any key or secret, and the agent must call the API without any code in the client application.

    You create a project connection that uses the project managed identity and grant that identity access to the API. Which value should you use as the audience of the connection?
  fr: |
    Fabrikam, Inc. héberge une API de sinistres dans Azure App Service. L'API est protégée par Microsoft Entra ID ; son inscription d'application a l'URI d'ID d'application `api://fabrikam-claims`. L'API dispose d'une spécification OpenAPI 3.1.

    Vous ajoutez l'API à un agent Foundry à l'aide d'un outil OpenAPI. La solution ne doit stocker aucune clé ni aucun secret, et l'agent doit appeler l'API sans aucun code dans l'application cliente.

    Vous créez une connexion de projet qui utilise l'identité managée du projet et accordez à cette identité l'accès à l'API. Quelle valeur devez-vous utiliser comme audience de la connexion ?
body:
  options:
    - { id: a, text: "`https://fabrikam-ai.services.ai.azure.com/api/projects/claims`" }
    - { id: b, text: "`https://ai.azure.com`" }
    - { id: c, text: "`api://fabrikam-claims`" }
    - { id: d, text: "`https://management.azure.com`" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With project managed identity authentication, Foundry requests a token for the audience set in the connection and calls the API with it. The audience is the resource identifier of the target service, here the application ID URI of the API's app registration. The project's managed identity also needs the least-privileged access to the API.
    fr: |
      Avec l'authentification par identité managée du projet, Foundry demande un jeton pour l'audience définie dans la connexion et appelle l'API avec ce jeton. L'audience est l'identificateur de ressource du service cible, ici l'URI d'ID d'application de l'inscription d'application de l'API. L'identité managée du projet a aussi besoin de l'accès au moindre privilège sur l'API.
  options:
    a:
      en: |
        Learn states that the audience is the target service's resource identifier, not the Foundry project endpoint.
      fr: |
        Learn indique que l'audience est l'identificateur de ressource du service cible, pas le point de terminaison du projet Foundry.
    b:
      en: |
        `https://ai.azure.com` is the audience used to call a Foundry agent's A2A endpoint, not a custom API.
      fr: |
        `https://ai.azure.com` est l'audience utilisée pour appeler le point de terminaison A2A d'un agent Foundry, pas une API personnalisée.
    d:
      en: |
        A token for Azure Resource Manager isn't accepted by an API that expects tokens issued for its own application ID URI.
      fr: |
        Un jeton pour Azure Resource Manager n'est pas accepté par une API qui attend des jetons émis pour son propre URI d'ID d'application.
references:
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
