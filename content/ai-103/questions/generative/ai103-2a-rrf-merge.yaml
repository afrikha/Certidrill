id: ai103-2a-rrf-merge
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys sends hybrid queries to Azure AI Search from its RAG application. Each request contains a full-text query and a vector query, and the response contains a single result set.

    Which method does Azure AI Search use to merge the results of the two queries?
  fr: |
    Tailspin Toys envoie des requêtes hybrides à Azure AI Search depuis son application RAG. Chaque requête contient une requête en texte intégral et une requête vectorielle, et la réponse contient un seul jeu de résultats.

    Quelle méthode Azure AI Search utilise-t-il pour fusionner les résultats des deux requêtes ?
body:
  options:
    - { id: a, text: "BM25" }
    - { id: b, text: "Reciprocal Rank Fusion (RRF)" }
    - { id: c, text: "HNSW" }
    - { id: d, text: { en: "Exhaustive KNN", fr: "KNN exhaustif" } }
answer: { optionId: b }
explanation:
  correct:
    en: Azure AI Search runs the full-text and vector queries in parallel, then merges the two ranked lists with Reciprocal Rank Fusion (RRF) into one result set. Semantic ranking, if enabled, then reranks the top of that merged list.
    fr: Azure AI Search exécute en parallèle les requêtes en texte intégral et vectorielle, puis fusionne les deux listes classées en un seul jeu de résultats avec Reciprocal Rank Fusion (RRF). Si le classement sémantique est activé, il reclasse ensuite le haut de cette liste fusionnée.
  options:
    a:
      en: BM25 ranks the full-text results only; it does not merge them with vector results.
      fr: BM25 classe uniquement les résultats en texte intégral ; il ne les fusionne pas avec les résultats vectoriels.
    c:
      en: HNSW is the approximate nearest-neighbor algorithm used by the vector query, not the merge step.
      fr: HNSW est l'algorithme approximatif des plus proches voisins utilisé par la requête vectorielle, pas l'étape de fusion.
    d:
      en: Exhaustive KNN is an alternative to HNSW for the vector query; it does not merge result sets.
      fr: Le KNN exhaustif est une alternative à HNSW pour la requête vectorielle ; il ne fusionne pas de jeux de résultats.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
