id: ai103-2c-a2a-behavior
objective: "2.2.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a Foundry agent named intake-agent that calls a Foundry agent named triage-agent in another project by using the generally available A2A tool with protocol version 1.0. Incoming A2A is enabled on triage-agent, and all permissions are configured.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un agent Foundry nommé intake-agent qui appelle un agent Foundry nommé triage-agent dans un autre projet, à l'aide de l'outil A2A en disponibilité générale avec la version 1.0 du protocole. L'A2A entrant est activé sur triage-agent, et toutes les autorisations sont configurées.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: intake-agent can forward a scanned PDF form to triage-agent as part of the A2A request.
        fr: intake-agent peut transmettre un formulaire PDF numérisé à triage-agent dans la requête A2A.
    - id: s2
      text:
        en: The A2A connection of intake-agent must include the path of the agent card of triage-agent.
        fr: La connexion A2A d'intake-agent doit inclure le chemin de la carte d'agent de triage-agent.
    - id: s3
      text:
        en: The A2A tasks and contexts created by these calls are kept for 60 days after their most recent write.
        fr: Les tâches et contextes A2A créés par ces appels sont conservés 60 jours après leur dernière écriture.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Foundry agent targets support only the text modality over A2A, so a PDF can't be sent. For a Foundry agent target, you don't set an agent card path: Foundry resolves the default agent card path from the A2A base path. A2A tasks and contexts are retained for 60 days from their most recent write.
    fr: |
      Les agents Foundry cibles ne prennent en charge que la modalité texte en A2A : un PDF ne peut donc pas être envoyé. Pour un agent Foundry cible, vous ne définissez pas de chemin de carte d'agent : Foundry résout le chemin par défaut de la carte d'agent à partir du chemin de base A2A. Les tâches et contextes A2A sont conservés 60 jours à partir de leur dernière écriture.
references:
  - title: Connect to an A2A agent endpoint from Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/agent-to-agent
