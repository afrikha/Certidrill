id: ai103-2a-model-kinds
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Contoso Insurance is adding four AI features to its claims platform. Each feature must use the kind of model best suited to its task.

    Which kind of model should you deploy for each feature? To answer, drag the appropriate kinds of model to the correct features. Each kind of model may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Insurance ajoute quatre fonctionnalités d'IA à sa plateforme de gestion des sinistres. Chaque fonctionnalité doit utiliser le type de modèle le mieux adapté à sa tâche.

    Quel type de modèle devez-vous déployer pour chaque fonctionnalité ? Pour répondre, faites glisser les types de modèles appropriés vers les fonctionnalités correspondantes. Chaque type de modèle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: llm, text: { en: "Large language model", fr: "Grand modèle de langage" } }
    - { id: slm, text: { en: "Small language model", fr: "Petit modèle de langage" } }
    - { id: reason, text: { en: "Reasoning model", fr: "Modèle de raisonnement" } }
    - { id: multi, text: { en: "Multimodal model", fr: "Modèle multimodal" } }
    - { id: embed, text: { en: "Embedding model", fr: "Modèle d'embedding" } }
    - { id: code, text: { en: "Code model", fr: "Modèle de code" } }
  targets:
    - id: t1
      text: { en: "Sort short claim notes into five categories at the lowest cost and latency", fr: "Classer de courtes notes de sinistre dans cinq catégories au coût et à la latence les plus faibles" }
    - id: t2
      text: { en: "Describe the damage visible in the photos attached to a claim", fr: "Décrire les dommages visibles sur les photos jointes à une déclaration" }
    - id: t3
      text: { en: "Convert policy passages into vectors for a search index", fr: "Convertir des passages de contrats en vecteurs pour un index de recherche" }
    - id: t4
      text: { en: "Work through a multistep reserve calculation and explain each step", fr: "Mener un calcul de provisions en plusieurs étapes et expliquer chaque étape" }
answer:
  mapping: { t1: slm, t2: multi, t3: embed, t4: reason }
explanation:
  correct:
    en: A small language model handles a narrow classification task at lower cost and latency than a large model. A multimodal model accepts images with text in the same request. An embedding model turns text into vectors for vector search. A reasoning model spends reasoning tokens on multistep problems such as calculations and planning.
    fr: Un petit modèle de langage traite une tâche de classification ciblée avec un coût et une latence inférieurs à ceux d'un grand modèle. Un modèle multimodal accepte des images avec du texte dans la même requête. Un modèle d'embedding transforme le texte en vecteurs pour la recherche vectorielle. Un modèle de raisonnement consacre des jetons de raisonnement aux problèmes en plusieurs étapes comme les calculs et la planification.
  options:
    llm: { en: "A large language model could classify the notes, but at a higher cost and latency than a small model.", fr: "Un grand modèle de langage pourrait classer les notes, mais avec un coût et une latence supérieurs à ceux d'un petit modèle." }
    code: { en: "A code model is meant for generating and reviewing code, which none of the features requires.", fr: "Un modèle de code sert à générer et à relire du code, ce qu'aucune fonctionnalité ne demande." }
references:
  - title: Azure OpenAI reasoning models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
