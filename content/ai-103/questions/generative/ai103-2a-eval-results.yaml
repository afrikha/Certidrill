id: ai103-2a-eval-results
objective: "2.1.4"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam ran an evaluation of its RAG assistant with the Groundedness, Relevance and Coherence evaluators at their default threshold of 3. The scores of four test items are shown in the following table.

    Answer each prompt by selecting the item that matches it.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a exécuté une évaluation de son assistant RAG avec les évaluateurs Groundedness, Relevance et Coherence à leur seuil par défaut de 3. Les scores de quatre éléments de test figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant l'élément qui lui correspond.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The response addresses the question but contains claims that the retrieved context does not support", fr: "La réponse traite la question mais contient des affirmations que le contexte récupéré n'étaye pas" }
    - id: p2
      text: { en: "The response is supported by the retrieved context but does not address the question", fr: "La réponse est étayée par le contexte récupéré mais ne traite pas la question" }
  grid:
    header: [{ en: "Item", fr: "Élément" }, Groundedness, Relevance, Coherence]
    rows:
      - [{ text: item-07, area: i07 }, { text: "5" }, { text: "5" }, { text: "5" }]
      - [{ text: item-12, area: i12 }, { text: "5" }, { text: "1" }, { text: "5" }]
      - [{ text: item-19, area: i19 }, { text: "4" }, { text: "4" }, { text: "2" }]
      - [{ text: item-23, area: i23 }, { text: "2" }, { text: "5" }, { text: "4" }]
answer:
  values: { p1: i23, p2: i12 }
explanation:
  correct:
    en: Groundedness measures whether the response aligns with the context without fabricating content, and Relevance measures whether it addresses the query. item-23 fails Groundedness (2) while passing Relevance (5), so it answers the question with unsupported claims. item-12 passes Groundedness (5) but fails Relevance (1), so it is faithful to the context but off topic. item-19 only fails Coherence.
    fr: Groundedness mesure si la réponse est cohérente avec le contexte sans inventer de contenu, et Relevance mesure si elle traite la requête. item-23 échoue à Groundedness (2) tout en réussissant Relevance (5) ; il répond donc à la question avec des affirmations non étayées. item-12 réussit Groundedness (5) mais échoue à Relevance (1) ; il est fidèle au contexte mais hors sujet. item-19 n'échoue qu'à Coherence.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
