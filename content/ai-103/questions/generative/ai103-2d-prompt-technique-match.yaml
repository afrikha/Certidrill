id: ai103-2d-prompt-technique-match
objective: "2.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's content team uses a **gpt-4.1** deployment for several tasks and reports the problems listed in the answer area.

    Which prompt engineering technique should you apply to each problem? To answer, drag the appropriate techniques to the correct problems. Each technique may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe de contenu de Fabrikam utilise un déploiement **gpt-4.1** pour plusieurs tâches et signale les problèmes listés dans la zone de réponse.

    Quelle technique d'ingénierie d'invite devez-vous appliquer à chaque problème ? Pour répondre, faites glisser les techniques appropriées vers les problèmes correspondants. Chaque technique peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: prime, text: { en: "Prime the output", fr: "Amorcer la sortie" } }
    - { id: breakdown, text: { en: "Break the task down", fr: "Décomposer la tâche" } }
    - { id: fewshot, text: { en: "Few-shot learning", fr: "Apprentissage few-shot" } }
    - { id: grounding, text: { en: "Provide grounding context", fr: "Fournir un contexte d'ancrage" } }
    - { id: syntax, text: { en: "Use clear syntax such as Markdown or XML separators", fr: "Utiliser une syntaxe claire, comme des séparateurs Markdown ou XML" } }
    - { id: temp, text: { en: "Raise the temperature", fr: "Augmenter la température" } }
  targets:
    - id: t1
      text: { en: "A request for one search query returns several alternative queries.", fr: "Une demande d'une seule requête de recherche renvoie plusieurs requêtes alternatives." }
    - id: t2
      text: { en: "Fact-checking a long article with many claims misses most errors when done in one request.", fr: "La vérification d'un long article contenant de nombreuses affirmations manque la plupart des erreurs quand elle se fait en une seule requête." }
    - id: t3
      text: { en: "Answers about this week's product prices are out of date.", fr: "Les réponses sur les prix des produits de cette semaine sont obsolètes." }
    - id: t4
      text: { en: "The model confuses the instructions with the email text pasted into the same prompt.", fr: "Le modèle confond les instructions avec le texte d'e-mail collé dans la même invite." }
answer:
  mapping: { t1: prime, t2: breakdown, t3: grounding, t4: syntax }
explanation:
  correct:
    en: |
      Ending the prompt with a cue such as "One possible search query is:" primes the model to return a single query. Splitting a long fact-check into steps, first extracting the claims and then verifying each one, improves results dramatically on text with many claims. Up-to-date facts must come from grounding data, because the model can't know them. Clear separators between sections, such as Markdown headings or XML tags, make the intent and the boundaries of the pasted content explicit.
    fr: |
      Terminer l'invite par un amorçage comme « One possible search query is: » conduit le modèle à renvoyer une seule requête. Diviser une longue vérification en étapes, d'abord extraire les affirmations puis vérifier chacune, améliore nettement les résultats sur un texte riche en affirmations. Les faits à jour doivent provenir de données d'ancrage, car le modèle ne peut pas les connaître. Des séparateurs clairs entre les sections, comme des titres Markdown ou des balises XML, rendent explicites l'intention et les limites du contenu collé.
  options:
    fewshot: { en: "Examples improve format and style, but none of these problems is solved by showing sample answers.", fr: "Des exemples améliorent le format et le style, mais aucun de ces problèmes ne se résout en montrant des exemples de réponses." }
    temp: { en: "A higher temperature only makes the output more random.", fr: "Une température plus élevée rend seulement la sortie plus aléatoire." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
