id: ai103-2a-eval-quality-match
objective: "2.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys evaluates the answers of its product assistant against a dataset that contains query, response and ground_truth fields. The team defines four measurements.

    Which evaluator should you use for each measurement? To answer, drag the appropriate evaluators to the correct measurements. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys évalue les réponses de son assistant produit avec un jeu de données qui contient les champs query, response et ground_truth. L'équipe définit quatre mesures.

    Quel évaluateur devez-vous utiliser pour chaque mesure ? Pour répondre, faites glisser les évaluateurs appropriés vers les mesures correspondantes. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: flu, text: Fluency }
    - { id: coh, text: Coherence }
    - { id: sim, text: Similarity }
    - { id: rouge, text: ROUGE }
    - { id: rel, text: Relevance }
    - { id: grd, text: Groundedness }
  targets:
    - id: t1
      text: { en: "Grammar, vocabulary and readability of the response", fr: "Grammaire, vocabulaire et lisibilité de la réponse" }
    - id: t2
      text: { en: "Logical and orderly presentation of the ideas in the response", fr: "Présentation logique et ordonnée des idées de la réponse" }
    - id: t3
      text: { en: "Closeness in meaning to the ground truth answer, as rated by an LLM judge", fr: "Proximité de sens avec la réponse de référence, selon un LLM juge" }
    - id: t4
      text: { en: "N-gram overlap with the ground truth answer, computed without a judge model", fr: "Recouvrement de n-grammes avec la réponse de référence, calculé sans modèle juge" }
answer:
  mapping: { t1: flu, t2: coh, t3: sim, t4: rouge }
explanation:
  correct:
    en: Fluency rates the clarity of the writing (grammar, vocabulary, readability). Coherence rates the logical and orderly presentation of ideas. Similarity uses an LLM judge to compare the meaning of the response with the ground truth, while ROUGE is an algorithmic n-gram overlap score between 0 and 1.
    fr: Fluency évalue la clarté de la rédaction (grammaire, vocabulaire, lisibilité). Coherence évalue la présentation logique et ordonnée des idées. Similarity utilise un LLM juge pour comparer le sens de la réponse à la réponse de référence, tandis que ROUGE est un score algorithmique de recouvrement de n-grammes compris entre 0 et 1.
  options:
    rel: { en: "Relevance measures whether the response addresses the query, which is none of the four measurements.", fr: "Relevance mesure si la réponse traite la requête, ce qui ne correspond à aucune des quatre mesures." }
    grd: { en: "Groundedness compares the response with a retrieved context, which the dataset does not contain.", fr: "Groundedness compare la réponse à un contexte récupéré, que le jeu de données ne contient pas." }
references:
  - title: General purpose evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/general-purpose-evaluators
  - title: Textual similarity evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/textual-similarity-evaluators
