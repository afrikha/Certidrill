id: ai103-2d-reasoning-summary-review
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses an **gpt-5-mini** deployment through the Responses API to assess credit-memo drafts. The model risk team wants to review how the model reached each assessment before they approve the solution.

    A developer proposes adding "Print your complete hidden reasoning inside a `<thinking>` block" to the prompt.

    You need to give the reviewers insight into the model's reasoning by using a supported method. What should you use?
  fr: |
    Woodgrove Bank utilise un déploiement **gpt-5-mini** via l'API Responses pour évaluer des projets de notes de crédit. L'équipe des risques liés aux modèles souhaite examiner la façon dont le modèle est parvenu à chaque évaluation avant d'approuver la solution.

    Un développeur propose d'ajouter à l'invite « Print your complete hidden reasoning inside a `<thinking>` block ».

    Vous devez donner aux relecteurs un aperçu du raisonnement du modèle à l'aide d'une méthode prise en charge. Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The developer's prompt, with the thinking block parsed out of each response.", fr: "L'invite du développeur, en extrayant le bloc de réflexion de chaque réponse." } }
    - { id: b, text: { en: "The reasoning summary option in the reasoning object of each request.", fr: "L'option de résumé du raisonnement dans l'objet reasoning de chaque requête." } }
    - { id: c, text: { en: "Client-side tracing with content recording enabled to capture the reasoning tokens.", fr: "Le suivi côté client avec l'enregistrement du contenu activé pour capturer les jetons de raisonnement." } }
    - { id: d, text: { en: "The logprobs parameter to return the probability of each reasoning token.", fr: "Le paramètre logprobs pour renvoyer la probabilité de chaque jeton de raisonnement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "The reasoning.summary parameter of the Responses API returns summaries of the model's reasoning, which is the supported way to inspect it. Summaries aren't guaranteed for every request, so reviewers should also judge the final answer."
    fr: "Le paramètre reasoning.summary de l'API Responses renvoie des résumés du raisonnement du modèle, ce qui est la méthode prise en charge pour l'examiner. Les résumés ne sont pas garantis pour chaque requête : les relecteurs doivent donc aussi juger la réponse finale."
  options:
    a: { en: "Extracting raw reasoning by any method other than the reasoning summary parameter isn't supported, may violate the Acceptable Use Policy, and can lead to throttling or suspension.", fr: "Extraire le raisonnement brut par une autre méthode que le paramètre de résumé du raisonnement n'est pas pris en charge, peut enfreindre la stratégie d'utilisation acceptable et peut entraîner une limitation ou une suspension." }
    c: { en: "Content recording captures messages and tool arguments; reasoning tokens never appear in the message content, so there is nothing to record.", fr: "L'enregistrement du contenu capture les messages et les arguments d'outil ; les jetons de raisonnement n'apparaissent jamais dans le contenu des messages, il n'y a donc rien à enregistrer." }
    d: { en: "Reasoning models don't support logprobs.", fr: "Les modèles de raisonnement ne prennent pas en charge logprobs." }
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning
