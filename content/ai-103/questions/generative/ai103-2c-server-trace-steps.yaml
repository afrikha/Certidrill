id: ai103-2c-server-trace-steps
objective: "2.2.6"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a prompt agent named gifts-agent hosted in a Foundry project. No Application Insights resource is connected to the project. Users report that some answers of gifts-agent are wrong after a tool call.

    You need to inspect the tool calls of a failing run. You already have the Log Analytics Reader role on the Application Insights resource that you will use. The solution must not require code changes.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'un agent d'invite nommé gifts-agent hébergé dans un projet Foundry. Aucune ressource Application Insights n'est connectée au projet. Des utilisateurs signalent que certaines réponses de gifts-agent sont fausses après un appel d'outil.

    Vous devez inspecter les appels d'outil d'une exécution en échec. Vous disposez déjà du rôle Log Analytics Reader sur la ressource Application Insights que vous utiliserez. La solution ne doit pas exiger de modification du code.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: connect, text: { en: "In the Foundry portal, open Agents > Traces and connect the Application Insights resource.", fr: "Dans le portail Foundry, ouvrir Agents > Traces et connecter la ressource Application Insights." } }
    - { id: run, text: { en: "Reproduce the failing request by running gifts-agent.", fr: "Reproduire la requête en échec en exécutant gifts-agent." } }
    - { id: open, text: { en: "Open Traces, select the new trace and step through its spans.", fr: "Ouvrir Traces, sélectionner la nouvelle trace et parcourir ses étendues." } }
    - { id: sdk, text: { en: "Install the OpenTelemetry packages and instrument the client application.", fr: "Installer les packages OpenTelemetry et instrumenter l'application cliente." } }
    - { id: content, text: { en: "Set `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` to `true` in production.", fr: "Définir `OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` sur `true` en production." } }
    - { id: rule, text: { en: "Create a continuous evaluation rule for gifts-agent.", fr: "Créer une règle d'évaluation continue pour gifts-agent." } }
answer:
  sequence: [connect, run, open]
explanation:
  correct:
    en: |
      Server-side tracing starts automatically for agents hosted in Foundry once Application Insights is connected to the project, with no code changes. Traces are recorded only for runs after the connection, so you reproduce the request, then open Traces and step through the spans, which show the tool calls with their inputs and outputs.
    fr: |
      Le traçage côté serveur démarre automatiquement pour les agents hébergés dans Foundry dès qu'Application Insights est connecté au projet, sans modification du code. Les traces ne sont enregistrées que pour les exécutions postérieures à la connexion : vous reproduisez donc la requête, puis ouvrez Traces et parcourez les étendues, qui montrent les appels d'outil avec leurs entrées et sorties.
  options:
    sdk:
      en: "Client-side instrumentation is an optional second step that requires code changes; server-side tracing already covers the agent's tool calls."
      fr: "L'instrumentation côté client est une seconde étape facultative qui exige des modifications du code ; le traçage côté serveur couvre déjà les appels d'outil de l'agent."
    content:
      en: "This variable applies to client-side tracing, and Learn advises against content recording in production unless compliance allows it."
      fr: "Cette variable s'applique au traçage côté client, et Learn déconseille l'enregistrement du contenu en production, sauf si la conformité le permet."
    rule:
      en: "Continuous evaluation scores responses; it doesn't show the spans of a specific run."
      fr: "L'évaluation continue note des réponses ; elle ne montre pas les étendues d'une exécution donnée."
references:
  - title: Set up tracing in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup
