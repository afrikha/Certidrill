id: ai103-2a-local-slm
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is building a Windows application for field technicians. The application summarizes short inspection notes. Technicians often work at sites with no network connectivity, and the inspection notes must never leave the laptop. The laptops are not linked to an Azure subscription.

    You need to choose how the application runs the model.

    What should you use?
  fr: |
    Tailspin Toys développe une application Windows pour ses techniciens de terrain. L'application résume de courtes notes d'inspection. Les techniciens travaillent souvent sur des sites sans connectivité réseau, et les notes d'inspection ne doivent jamais quitter l'ordinateur portable. Les ordinateurs portables ne sont liés à aucun abonnement Azure.

    Vous devez choisir la façon dont l'application exécute le modèle.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Global Standard deployment of a large language model, called through the Responses API", fr: "Un déploiement Global Standard d'un grand modèle de langage, appelé avec l'API Responses" } }
    - { id: b, text: { en: "Foundry Local with a small model from its catalog, embedded in the application", fr: "Foundry Local avec un petit modèle de son catalogue, intégré à l'application" } }
    - { id: c, text: { en: "A Data Zone Standard deployment of a small language model, called through the Responses API", fr: "Un déploiement Data Zone Standard d'un petit modèle de langage, appelé avec l'API Responses" } }
    - { id: d, text: { en: "A Global Batch deployment of a large language model that processes the notes overnight", fr: "Un déploiement Global Batch d'un grand modèle de langage qui traite les notes pendant la nuit" } }
answer: { optionId: b }
explanation:
  correct:
    en: Foundry Local runs a curated catalog of models (such as Phi) entirely on the user's device, so the application works offline, the data never leaves the device and no Azure subscription is needed. It selects the best hardware acceleration available (GPU, NPU or CPU).
    fr: Foundry Local exécute un catalogue sélectionné de modèles (comme Phi) entièrement sur l'appareil de l'utilisateur ; l'application fonctionne hors connexion, les données ne quittent jamais l'appareil et aucun abonnement Azure n'est nécessaire. Il choisit la meilleure accélération matérielle disponible (GPU, NPU ou processeur).
  options:
    a:
      en: A cloud deployment needs network connectivity and sends the notes to Azure.
      fr: Un déploiement cloud nécessite une connectivité réseau et envoie les notes vers Azure.
    c:
      en: Data Zone Standard keeps processing inside a data zone, but the notes still leave the laptop and the call fails without connectivity.
      fr: Data Zone Standard maintient le traitement dans une zone de données, mais les notes quittent quand même l'ordinateur portable et l'appel échoue sans connectivité.
    d:
      en: A batch deployment is still a cloud deployment; it needs connectivity and an Azure subscription.
      fr: Un déploiement Batch reste un déploiement cloud ; il nécessite une connectivité et un abonnement Azure.
references:
  - title: What is Foundry Local?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-local/what-is-foundry-local
