id: ai103-2a-eval-completeness
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank's assistant explains account fees. Reviewers find that the answers are accurate but often leave out fees that the expected answer lists. The test dataset contains a ground truth answer and the response for each query.

    You need an evaluator that measures how much of the expected information each response covers.

    Which evaluator should you use?
  fr: |
    L'assistant de Woodgrove Bank explique les frais de compte. Les relecteurs constatent que les réponses sont exactes mais omettent souvent des frais que la réponse attendue mentionne. Le jeu de données de test contient une réponse de référence (ground truth) et la réponse pour chaque requête.

    Vous avez besoin d'un évaluateur qui mesure la part des informations attendues que couvre chaque réponse.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Response Completeness }
    - { id: b, text: Groundedness }
    - { id: c, text: Relevance }
    - { id: d, text: Fluency }
answer: { optionId: a }
explanation:
  correct:
    en: Response Completeness measures whether the response covers the expected information in the ground truth; it is the recall aspect, while Groundedness is the precision aspect. It needs ground_truth and response.
    fr: Response Completeness mesure si la réponse couvre les informations attendues de la réponse de référence ; c'est l'aspect rappel, alors que Groundedness est l'aspect précision. Il a besoin de ground_truth et de response.
  options:
    b:
      en: Groundedness detects claims not supported by the context; an accurate but incomplete answer passes it.
      fr: Groundedness détecte les affirmations non étayées par le contexte ; une réponse exacte mais incomplète le réussit.
    c:
      en: Relevance checks whether the response addresses the query, not whether it covers every expected fact.
      fr: Relevance vérifie si la réponse traite la requête, pas si elle couvre chaque fait attendu.
    d:
      en: Fluency rates the quality of the writing, not its content.
      fr: Fluency évalue la qualité de la rédaction, pas son contenu.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
