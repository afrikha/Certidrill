id: ai103-2a-eval-completeness
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank's assistant explains account fees. Reviewers find that the answers are accurate, on topic and free of grammar errors, but hard to follow: the steps of an explanation appear in no logical order, and the sentences don't connect to each other. The test dataset contains the query and the response for each item.

    You need an evaluator that measures this problem.

    Which evaluator should you use?
  fr: |
    L'assistant de Woodgrove Bank explique les frais de compte. Les relecteurs constatent que les réponses sont exactes, pertinentes et sans fautes de grammaire, mais difficiles à suivre : les étapes d'une explication n'apparaissent dans aucun ordre logique, et les phrases ne s'enchaînent pas. Le jeu de données de test contient la requête et la réponse de chaque élément.

    Vous avez besoin d'un évaluateur qui mesure ce problème.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Relevance }
    - { id: c, text: Coherence }
    - { id: d, text: Fluency }
answer: { optionId: c }
explanation:
  correct:
    en: Coherence measures the logical and orderly presentation of ideas in a response, with clear connections between sentences and a logical sequence. It takes the query and the response, uses a judge deployment and returns a 1–5 score.
    fr: Coherence mesure la présentation logique et ordonnée des idées d'une réponse, avec des liens clairs entre les phrases et un enchaînement logique. Il prend la requête et la réponse, utilise un déploiement juge et renvoie un score de 1 à 5.
  options:
    a:
      en: Groundedness detects claims not supported by the context; the answers are accurate.
      fr: Groundedness détecte les affirmations non étayées par le contexte ; les réponses sont exactes.
    b:
      en: Relevance checks whether the response addresses the query, and the answers are on topic.
      fr: Relevance vérifie si la réponse traite la requête, et les réponses sont pertinentes.
    d:
      en: Fluency focuses on grammatical accuracy, vocabulary and readability of the writing, which the reviewers found correct.
      fr: Fluency porte sur la correction grammaticale, le vocabulaire et la lisibilité du texte, que les relecteurs ont jugés corrects.
references:
  - title: General Purpose Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators
