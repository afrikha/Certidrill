id: ai103-2c-mcp-tool-facts
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is adding two remote MCP servers to a prompt agent named ops-agent: one for inventory and one for shipping. ops-agent uses a gpt-4.1-mini deployment, and the application sends non-streaming requests without background mode.

    The inventory tool is defined as follows:

    ```python
    inventory = MCPTool(
        server_label="inventory",
        server_url="https://mcp.tailspin.example/inventory",
        allowed_tools=[],
        require_approval="never",
        project_connection_id=INVENTORY_CONNECTION_ID,
    )
    ```

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys ajoute deux serveurs MCP distants à un agent d'invite nommé ops-agent : l'un pour le stock et l'autre pour les expéditions. ops-agent utilise un déploiement gpt-4.1-mini, et l'application envoie des requêtes non diffusées en continu, sans mode arrière-plan.

    L'outil de stock est défini comme suit :

    ```python
    inventory = MCPTool(
        server_label="inventory",
        server_url="https://mcp.tailspin.example/inventory",
        allowed_tools=[],
        require_approval="never",
        project_connection_id=INVENTORY_CONNECTION_ID,
    )
    ```

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The shipping tool can also use the value inventory for server_label because its server URL is different.
        fr: L'outil d'expédition peut aussi utiliser la valeur inventory pour server_label, car son URL de serveur est différente.
    - id: s2
      text:
        en: ops-agent can call every tool that the inventory MCP server exposes.
        fr: ops-agent peut appeler tous les outils qu'expose le serveur MCP de stock.
    - id: s3
      text:
        en: If an inventory tool takes 150 seconds to respond, the tool call fails.
        fr: Si un outil de stock met 150 secondes à répondre, l'appel d'outil échoue.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Each MCP tool needs a `server_label` that is unique within the agent, whatever its URL. An empty `allowed_tools` list doesn't mean zero tools: it allows all the tools that the server exposes; use a nonempty list to restrict them. Non-streaming MCP tool calls time out after 100 seconds; only background mode with a supported model can exceed this limit.
    fr: |
      Chaque outil MCP a besoin d'un `server_label` unique au sein de l'agent, quelle que soit son URL. Une liste `allowed_tools` vide ne signifie pas zéro outil : elle autorise tous les outils qu'expose le serveur ; utilisez une liste non vide pour les restreindre. Les appels d'outil MCP non diffusés en continu expirent au bout de 100 secondes ; seul le mode arrière-plan avec un modèle pris en charge permet de dépasser cette limite.
references:
  - title: Connect agents to Model Context Protocol servers
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
