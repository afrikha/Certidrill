id: ai103-2b-local-signin
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Fabrikam, Inc. runs a Foundry SDK sample on her workstation. The sample creates an `AIProjectClient` with `DefaultAzureCredential()`. Her account has the Foundry User role on the project, but the sample fails because no credential is available.

    What should she do?
  fr: |
    Une développeuse de Fabrikam, Inc. exécute un exemple du SDK Foundry sur son poste de travail. L'exemple crée un `AIProjectClient` avec `DefaultAzureCredential()`. Son compte dispose du rôle Foundry User sur le projet, mais l'exemple échoue parce qu'aucune information d'identification n'est disponible.

    Que doit-elle faire ?
body:
  options:
    - { id: a, text: { en: "Enable a system-assigned managed identity on the Foundry project", fr: "Activer une identité managée affectée par le système sur le projet Foundry" } }
    - { id: b, text: { en: "Set an environment variable that contains the API key of the Foundry resource", fr: "Définir une variable d'environnement qui contient la clé API de la ressource Foundry" } }
    - { id: c, text: { en: "Create the client with allow_preview=True", fr: "Créer le client avec allow_preview=True" } }
    - { id: d, text: { en: "Sign in with the Azure CLI by running az login", fr: "Se connecter avec Azure CLI en exécutant az login" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On a workstation, `DefaultAzureCredential` can use the Azure CLI session of the developer. The Foundry samples state that you must sign in with `az login` before you run them; the role assignment of the account then authorizes the calls.
    fr: |
      Sur un poste de travail, `DefaultAzureCredential` peut utiliser la session Azure CLI du développeur. Les exemples Foundry indiquent que vous devez vous connecter avec `az login` avant de les exécuter ; l'attribution de rôle du compte autorise ensuite les appels.
  options:
    a: { en: "The managed identity of the project is used by the service itself, not by code running on the workstation.", fr: "L'identité managée du projet est utilisée par le service lui-même, pas par le code exécuté sur le poste de travail." }
    b: { en: "DefaultAzureCredential doesn't read API keys, and AIProjectClient accepts only a token credential.", fr: "DefaultAzureCredential ne lit pas de clés API, et AIProjectClient n'accepte que des informations d'identification par jeton." }
    c: { en: "allow_preview enables preview features; it doesn't provide a credential.", fr: "allow_preview active des fonctionnalités en préversion ; il ne fournit pas d'informations d'identification." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
  - title: azure.ai.projects.AIProjectClient class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.aiprojectclient
