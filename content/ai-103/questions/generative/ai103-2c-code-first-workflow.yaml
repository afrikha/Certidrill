id: ai103-2c-code-first-workflow
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is building a contract pipeline in which a drafting agent, a legal review agent and a formatting agent run one after the other. The pipeline goes into production in January 2027.

    The developers want to define the orchestration in Python, keep it under source control, and run it in Microsoft Foundry.

    What should you use?
  fr: |
    Litware, Inc. crée un pipeline de contrats dans lequel un agent de rédaction, un agent de revue juridique et un agent de mise en forme s'exécutent l'un après l'autre. Le pipeline passe en production en janvier 2027.

    Les développeurs veulent définir l'orchestration en Python, la conserver sous contrôle de code source et l'exécuter dans Microsoft Foundry.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A workflow built with the sequential template of the Foundry workflow designer", fr: "Un workflow créé avec le modèle sequential du concepteur de workflows Foundry" } }
    - { id: b, text: { en: "A connected agents tool on the drafting agent that references the other two agents", fr: "Un outil connected agents sur l'agent de rédaction qui référence les deux autres agents" } }
    - { id: c, text: { en: "An Azure Logic Apps workflow that calls the three agents in order", fr: "Un workflow Azure Logic Apps qui appelle les trois agents dans l'ordre" } }
    - { id: d, text: { en: "A sequential workflow built with Microsoft Agent Framework and deployed as a hosted agent", fr: "Un workflow séquentiel créé avec Microsoft Agent Framework et déployé comme agent hébergé" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Microsoft Agent Framework defines workflows in code or declarative YAML, including the sequential orchestration, in which agents run one after another in a defined order. Learn recommends it for new workflows, and you can deploy the result to Foundry as a hosted agent.
    fr: |
      Microsoft Agent Framework définit des workflows en code ou en YAML déclaratif, dont l'orchestration sequential, dans laquelle les agents s'exécutent l'un après l'autre dans un ordre défini. Learn le recommande pour les nouveaux workflows, et vous pouvez déployer le résultat dans Foundry comme agent hébergé.
  options:
    a:
      en: |
        Foundry is retiring the workflow designer on December 1, 2026; after that date, the visual designer and in-portal execution aren't supported. It's also a visual tool rather than Python code.
      fr: |
        Foundry retire le concepteur de workflows le 1er décembre 2026 ; après cette date, le concepteur visuel et l'exécution dans le portail ne sont plus pris en charge. C'est aussi un outil visuel, pas du code Python.
    b:
      en: |
        Connected agents aren't available in the new Foundry Agent Service.
      fr: |
        Les agents connectés (connected agents) ne sont pas disponibles dans le nouveau Foundry Agent Service.
    c:
      en: |
        Logic Apps is the low-code visual option for business processes; it doesn't meet the requirement to define the orchestration in Python and run it in Foundry.
      fr: |
        Logic Apps est l'option visuelle à faible code pour les processus métier ; elle ne satisfait pas l'exigence de définir l'orchestration en Python et de l'exécuter dans Foundry.
references:
  - title: Build a workflow in Microsoft Foundry (Preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
  - title: Workflow orchestrations in Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/overview
