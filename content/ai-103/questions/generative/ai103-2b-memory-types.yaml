id: ai103-2b-memory-types
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation has a customer service agent that uses memory in Foundry Agent Service. You are documenting which memory type covers each scenario.

    How should you complete the sentences? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un agent de service client qui utilise la mémoire de Foundry Agent Service. Vous documentez le type de mémoire qui couvre chaque scénario.

    Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Remembering that a customer needs large-print documents in every conversation relies on [[s1]] memory.

      Recalling what was discussed last month about a delayed delivery relies on [[s2]] memory.

      Reusing the steps that a customer always follows to file a warranty claim relies on [[s3]] memory.
    fr: |
      Se souvenir qu'un client a besoin de documents en gros caractères dans chaque conversation repose sur la mémoire [[s1]].

      Se rappeler ce qui a été dit le mois dernier sur une livraison retardée repose sur la mémoire [[s2]].

      Réutiliser les étapes qu'un client suit toujours pour déposer une demande de garantie repose sur la mémoire [[s3]].
  slots:
    - id: s1
      options:
        - { id: up, text: { en: "user profile", fr: "de profil utilisateur (user profile)" } }
        - { id: cs, text: { en: "chat summary", fr: "de résumé de conversation (chat summary)" } }
        - { id: pr, text: { en: "procedural", fr: "procédurale (procedural)" } }
    - id: s2
      options:
        - { id: up, text: { en: "user profile", fr: "de profil utilisateur (user profile)" } }
        - { id: cs, text: { en: "chat summary", fr: "de résumé de conversation (chat summary)" } }
        - { id: pr, text: { en: "procedural", fr: "procédurale (procedural)" } }
    - id: s3
      options:
        - { id: up, text: { en: "user profile", fr: "de profil utilisateur (user profile)" } }
        - { id: cs, text: { en: "chat summary", fr: "de résumé de conversation (chat summary)" } }
        - { id: pr, text: { en: "procedural", fr: "procédurale (procedural)" } }
answer:
  values: { s1: up, s2: cs, s3: pr }
explanation:
  correct:
    en: |
      User profile memory holds durable preferences and personal context, such as language, product defaults and accessibility needs. Chat summary memory holds distilled summaries of earlier topics and threads. Procedural memory holds reusable how-to routines inferred from earlier interactions.
    fr: |
      La mémoire de profil utilisateur contient des préférences durables et un contexte personnel, comme la langue, les valeurs par défaut des produits et les besoins d'accessibilité. La mémoire de résumé de conversation contient des résumés condensés des sujets et des échanges précédents. La mémoire procédurale contient des routines réutilisables déduites des interactions précédentes.
references:
  - title: What is Memory?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
