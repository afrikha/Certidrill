id: ai103-2a-framework-facts
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans to build its multistep customer-service flows with Microsoft Agent Framework and agents that run on models deployed in its Foundry project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit de créer ses flux de service client en plusieurs étapes avec Microsoft Agent Framework et des agents qui s'exécutent sur des modèles déployés dans son projet Foundry.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Agent Framework is the successor of both Semantic Kernel and AutoGen.
        fr: Agent Framework est le successeur à la fois de Semantic Kernel et d'AutoGen.
    - id: s2
      text:
        en: A single agent is preferred over a workflow when you need explicit control over the execution order of the steps.
        fr: Un agent unique est préférable à un workflow lorsque vous avez besoin d'un contrôle explicite sur l'ordre d'exécution des étapes.
    - id: s3
      text:
        en: In a handoff orchestration, agents transfer control to each other based on the context of the conversation.
        fr: Dans une orchestration de transfert (handoff), les agents se passent le contrôle selon le contexte de la conversation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Agent Framework combines AutoGen's agent abstractions with Semantic Kernel's enterprise features and is the direct successor of both. Workflows, not single agents, are the choice when steps are well defined and the execution order must be explicit; agents suit open-ended tasks with autonomous planning. In handoff orchestration, agents pass control to one another depending on the context.
    fr: Agent Framework associe les abstractions d'agent d'AutoGen aux fonctionnalités d'entreprise de Semantic Kernel et succède directement aux deux. Ce sont les workflows, et non les agents uniques, qu'il faut choisir lorsque les étapes sont bien définies et que l'ordre d'exécution doit être explicite ; les agents conviennent aux tâches ouvertes avec planification autonome. Dans l'orchestration de transfert, les agents se passent le contrôle selon le contexte.
references:
  - title: Microsoft Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/overview/
  - title: Workflow orchestrations in Agent Framework
    url: https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations
