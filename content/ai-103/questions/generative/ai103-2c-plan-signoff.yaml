id: ai103-2c-plan-signoff
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys uses a Magentic workflow built in Python with Microsoft Agent Framework to investigate production incidents. A manager agent creates a plan and coordinates a log analysis agent and a code agent.

    Before the specialists start working, an on-call engineer must be able to approve the manager's plan or revise it.

    What should you do?
  fr: |
    Tailspin Toys utilise un workflow Magentic créé en Python avec Microsoft Agent Framework pour enquêter sur les incidents de production. Un agent gestionnaire établit un plan et coordonne un agent d'analyse des journaux et un agent de code.

    Avant que les spécialistes commencent à travailler, un ingénieur d'astreinte doit pouvoir approuver le plan du gestionnaire ou le réviser.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set `enable_plan_review=True` in `MagenticBuilder`.", fr: "Définir `enable_plan_review=True` dans `MagenticBuilder`." } }
    - { id: b, text: { en: "Set `max_stall_count=0` in `MagenticBuilder`.", fr: "Définir `max_stall_count=0` dans `MagenticBuilder`." } }
    - { id: c, text: { en: "Set `intermediate_output_from` to the manager agent.", fr: "Affecter l'agent gestionnaire à `intermediate_output_from`." } }
    - { id: d, text: { en: "Set `max_reset_count=0` in `MagenticBuilder`.", fr: "Définir `max_reset_count=0` dans `MagenticBuilder`." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Plan review lets a person approve the plan or revise it, which triggers replanning. In Python it's off by default and you opt in with `enable_plan_review=True`; the workflow then emits a plan review request that your application answers with an approval or a revision.
    fr: |
      La revue du plan permet à une personne d'approuver le plan ou de le réviser, ce qui déclenche une replanification. En Python, elle est désactivée par défaut et vous l'activez avec `enable_plan_review=True` ; le workflow émet alors une demande de revue du plan à laquelle votre application répond par une approbation ou une révision.
  options:
    b:
      en: |
        `max_stall_count` sets how many rounds without progress are allowed before an automatic reset and replan; it doesn't involve a person.
      fr: |
        `max_stall_count` définit combien de cycles sans progression sont autorisés avant une réinitialisation et une replanification automatiques ; il ne fait pas intervenir de personne.
    c:
      en: |
        `intermediate_output_from` only surfaces the outputs of the listed participants as intermediate events; nothing waits for a decision.
      fr: |
        `intermediate_output_from` fait seulement remonter les sorties des participants listés sous forme d'événements intermédiaires ; rien n'attend de décision.
    d:
      en: |
        `max_reset_count` limits the number of plan resets; it doesn't ask anyone to approve the plan.
      fr: |
        `max_reset_count` limite le nombre de réinitialisations du plan ; il ne demande à personne d'approuver le plan.
references:
  - title: Microsoft Agent Framework Workflows Orchestrations - Magentic
    url: https://learn.microsoft.com/en-us/agent-framework/user-guide/workflows/orchestrations/magentic
