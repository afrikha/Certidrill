id: ai103-2c-openapi-spec-fix
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an internal warehouse API. You plan to add the API to a Foundry agent by using an OpenAPI tool. The API key is stored in a project connection.

    The specification of the API is shown in the Specification exhibit.

    You need to make sure that the specification can be used by the OpenAPI tool.

    What should you change in the specification?
  fr: |
    Northwind Traders dispose d'une API interne d'entrepôt. Vous prévoyez d'ajouter l'API à un agent Foundry à l'aide d'un outil OpenAPI. La clé API est stockée dans une connexion de projet.

    La spécification de l'API est présentée dans la pièce Spécification.

    Vous devez vous assurer que la spécification peut être utilisée par l'outil OpenAPI.

    Que devez-vous modifier dans la spécification ?
exhibits:
  - id: spec
    title: { en: Specification, fr: Spécification }
    body: |
      ```json
      {
        "openapi": "3.0.1",
        "info": { "title": "Warehouse API", "version": "1.0" },
        "servers": [{ "url": "https://api.northwind.example/warehouse" }],
        "paths": {
          "/stock/{sku}": {
            "get": {
              "summary": "Get the stock level of a product",
              "parameters": [
                { "name": "sku", "in": "path", "required": true, "schema": { "type": "string" } }
              ]
            }
          },
          "/transfers": {
            "post": {
              "summary": "Create a stock transfer between warehouses",
              "requestBody": {
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Transfer" } } }
              }
            }
          }
        },
        "components": {
          "securitySchemes": {
            "apiKeyHeader": { "type": "apiKey", "name": "x-api-key", "in": "header" }
          }
        },
        "security": [{ "apiKeyHeader": [] }]
      }
      ```
body:
  options:
    - { id: a, text: { en: "Change the request body of the transfer operation to `multipart/form-data`.", fr: "Remplacer le corps de requête de l'opération de transfert par `multipart/form-data`." } }
    - { id: b, text: { en: "Add a unique `operationId` to each of the two operations.", fr: "Ajouter un `operationId` unique à chacune des deux opérations." } }
    - { id: c, text: { en: "Convert the specification to the Swagger 2.0 format.", fr: "Convertir la spécification au format Swagger 2.0." } }
    - { id: d, text: { en: "Add a second API key security scheme that uses a query parameter.", fr: "Ajouter un second schéma de sécurité par clé API qui utilise un paramètre de requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The OpenAPI tool turns each operation of the specification into a function that the model can choose, and every operation must have an `operationId` made of letters, `-` and `_`. Neither operation in the exhibit has one. Descriptive IDs such as `getStockLevel` also help the model pick the right operation.
    fr: |
      L'outil OpenAPI transforme chaque opération de la spécification en une fonction que le modèle peut choisir, et chaque opération doit avoir un `operationId` composé de lettres, de `-` et de `_`. Aucune des deux opérations de la pièce n'en a. Des ID descriptifs comme `getStockLevel` aident aussi le modèle à choisir la bonne opération.
  options:
    a:
      en: |
        The supported request body content types are `application/json` and `application/json-patch+json`; the current body is already supported.
      fr: |
        Les types de contenu de corps de requête pris en charge sont `application/json` et `application/json-patch+json` ; le corps actuel est déjà pris en charge.
    c:
      en: |
        The OpenAPI tool supports OpenAPI 3.0 and 3.1 specifications; the file already uses 3.0.1.
      fr: |
        L'outil OpenAPI prend en charge les spécifications OpenAPI 3.0 et 3.1 ; le fichier utilise déjà la version 3.0.1.
    d:
      en: |
        An OpenAPI tool supports only one API key security scheme; for several schemes you create several tools.
      fr: |
        Un outil OpenAPI ne prend en charge qu'un seul schéma de sécurité par clé API ; pour plusieurs schémas, vous créez plusieurs outils.
references:
  - title: Connect agents to OpenAPI tools
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi
