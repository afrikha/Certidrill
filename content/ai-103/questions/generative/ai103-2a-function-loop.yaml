id: ai103-2a-function-loop
objective: "2.1.3"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Contoso's order assistant must answer "Where is my order 5512?" by calling an existing Python function named get_order_status. The assistant uses function calling with the Responses API.

    Which five actions should the application perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    L'assistant de commande de Contoso doit répondre à « Où en est ma commande 5512 ? » en appelant une fonction Python existante nommée get_order_status. L'assistant utilise l'appel de fonction avec l'API Responses.

    Quelles sont les cinq actions que l'application doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: read, text: { en: "Read the function_call item in the response and parse its arguments.", fr: "Lire l'élément function_call de la réponse et analyser ses arguments." } }
    - { id: send, text: { en: "Send the user's question with the get_order_status definition in tools.", fr: "Envoyer la question de l'utilisateur avec la définition de get_order_status dans tools." } }
    - { id: none, text: { en: "Set tool_choice to none in the first request.", fr: "Définir tool_choice sur none dans la première requête." } }
    - { id: final, text: { en: "Return the final answer from output_text to the user.", fr: "Renvoyer à l'utilisateur la réponse finale lue dans output_text." } }
    - { id: run, text: { en: "Run get_order_status in the application with the parsed arguments.", fr: "Exécuter get_order_status dans l'application avec les arguments analysés." } }
    - { id: wait, text: { en: "Wait for the model to run get_order_status on the service side.", fr: "Attendre que le modèle exécute get_order_status côté service." } }
    - { id: output, text: { en: "Send a function_call_output item with the same call_id and the result.", fr: "Envoyer un élément function_call_output avec le même call_id et le résultat." } }
answer:
  sequence: [ send, read, run, output, final ]
explanation:
  correct:
    en: |
      The application sends the prompt with the function definitions, reads the function_call item the model generates, runs the function itself, returns the result in a function_call_output with the matching call_id, then reads the model's final answer. The model never executes the function: your application stays in control of the action.
    fr: |
      L'application envoie l'invite avec les définitions de fonctions, lit l'élément function_call généré par le modèle, exécute elle-même la fonction, renvoie le résultat dans un function_call_output avec le call_id correspondant, puis lit la réponse finale du modèle. Le modèle n'exécute jamais la fonction : votre application garde le contrôle de l'action.
  options:
    none: { en: "tool_choice none forces a text answer without any function call.", fr: "tool_choice none force une réponse textuelle sans aucun appel de fonction." }
    wait: { en: "The model only generates the call and its arguments; the application runs the function.", fr: "Le modèle génère seulement l'appel et ses arguments ; c'est l'application qui exécute la fonction." }
references:
  - title: How to use function calling with Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/function-calling
