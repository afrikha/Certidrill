id: ai103-2b-parallel-calls
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. has an agent with a function tool named check_stock. A customer asks for the stock level of three products in one message. The `output` of the response contains three items of type `function_call` for check_stock.

    What should the application do?
  fr: |
    Fabrikam, Inc. dispose d'un agent doté d'un outil de fonction nommé check_stock. Un client demande le niveau de stock de trois produits dans un seul message. La `output` de la réponse contient trois éléments de type `function_call` pour check_stock.

    Que doit faire l'application ?
body:
  options:
    - { id: a, text: { en: "Run check_stock for the first item only, return its output, and let the model answer for the three products", fr: "Exécuter check_stock pour le premier élément uniquement, renvoyer sa sortie, et laisser le modèle répondre pour les trois produits" } }
    - { id: b, text: { en: "Run check_stock for each item, and send the three function_call_output items, each with its call_id, in one responses.create() call", fr: "Exécuter check_stock pour chaque élément, et envoyer les trois éléments function_call_output, chacun avec son call_id, dans un seul appel à responses.create()" } }
    - { id: c, text: { en: "Run check_stock for each item, and send each function_call_output in a new conversation", fr: "Exécuter check_stock pour chaque élément, et envoyer chaque function_call_output dans une nouvelle conversation" } }
    - { id: d, text: { en: "Run check_stock for each item, and combine the three results in one function_call_output that carries the call_id of the first item", fr: "Exécuter check_stock pour chaque élément, et combiner les trois résultats dans un seul function_call_output qui porte le call_id du premier élément" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When the model decides that several calls are needed, the response contains several `function_call` items. The application handles each of them and returns all the results in a single `responses.create()` call, each `function_call_output` matching its call by `call_id`, in the same conversation.
    fr: |
      Quand le modèle détermine que plusieurs appels sont nécessaires, la réponse contient plusieurs éléments `function_call`. L'application traite chacun d'eux et renvoie tous les résultats dans un seul appel à `responses.create()`, chaque `function_call_output` correspondant à son appel par son `call_id`, dans la même conversation.
  options:
    a: { en: "The two other calls would stay without output, and the model would lack two stock levels.", fr: "Les deux autres appels resteraient sans sortie, et il manquerait deux niveaux de stock au modèle." }
    c: { en: "A new conversation doesn't contain the pending calls; outputs go back in the conversation that requested them.", fr: "Une nouvelle conversation ne contient pas les appels en attente ; les sorties retournent dans la conversation qui les a demandées." }
    d: { en: "Each call needs its own output with its own call_id.", fr: "Chaque appel a besoin de sa propre sortie avec son propre call_id." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
