id: ai103-2a-function-code
objective: "2.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso's order assistant uses a deployment named **orders-chat** and the Responses API with the default storage settings. The `tools` list defines a function named get_order_status.

    You need to complete the code that runs the requested function and returns its result to the model.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant de commande de Contoso utilise un déploiement nommé **orders-chat** et l'API Responses avec les paramètres de stockage par défaut. La liste `tools` définit une fonction nommée get_order_status.

    Vous devez compléter le code qui exécute la fonction demandée et renvoie son résultat au modèle.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = openai.responses.create(model="orders-chat", input=question, tools=tools)

    tool_outputs = []
    for item in response.output:
        if item.type == [[type]]:
            args = json.loads(item.[[args]])
            result = get_order_status(**args)
            tool_outputs.append({
                "type": [[outtype]],
                "call_id": item.call_id,
                "output": json.dumps(result),
            })

    final = openai.responses.create(
        model="orders-chat",
        [[link]]=response.id,
        input=tool_outputs,
        tools=tools,
    )
    print(final.output_text)
  slots:
    - id: type
      options:
        - { id: fcall, text: "\"function_call\"" }
        - { id: fout, text: "\"function_call_output\"" }
        - { id: toolcalls, text: "\"tool_calls\"" }
    - id: args
      options:
        - { id: params, text: parameters }
        - { id: name, text: name }
        - { id: arguments, text: arguments }
    - id: outtype
      options:
        - { id: ofcall, text: "\"function_call\"" }
        - { id: tool, text: "\"tool\"" }
        - { id: ofout, text: "\"function_call_output\"" }
    - id: link
      options:
        - { id: prev, text: previous_response_id }
        - { id: callid, text: call_id }
        - { id: instr, text: instructions }
answer:
  values: { type: fcall, args: arguments, outtype: ofout, link: prev }
explanation:
  correct:
    en: The model's requests are output items of type `function_call`, whose `arguments` property is a JSON string to parse. The result goes back as a `function_call_output` item with the same `call_id`, and `previous_response_id` links the follow-up request to the response that asked for the call.
    fr: Les demandes du modèle sont des éléments de sortie de type `function_call`, dont la propriété `arguments` est une chaîne JSON à analyser. Le résultat est renvoyé dans un élément `function_call_output` avec le même `call_id`, et `previous_response_id` relie la requête de suivi à la réponse qui a demandé l'appel.
  options:
    fout: { en: "function_call_output is the type of the items your application sends back, not of the model's requests.", fr: "function_call_output est le type des éléments que votre application renvoie, pas celui des demandes du modèle." }
    ofcall: { en: "function_call is the type of the model's request; the result is returned as function_call_output.", fr: "function_call est le type de la demande du modèle ; le résultat est renvoyé en function_call_output." }
    toolcalls: { en: "tool_calls is the array of a Chat Completions message, not a Responses output item type.", fr: "tool_calls est le tableau d'un message Chat Completions, pas un type d'élément de sortie de Responses." }
    params: { en: "parameters is the JSON Schema in the function definition, not the values the model chose.", fr: "parameters est le schéma JSON de la définition de fonction, pas les valeurs choisies par le modèle." }
    name: { en: "name identifies the function; the values are in arguments.", fr: "name identifie la fonction ; les valeurs se trouvent dans arguments." }
    tool: { en: "The tool role is the Chat Completions format for returning results.", fr: "Le rôle tool est le format Chat Completions pour renvoyer les résultats." }
    callid: { en: "call_id belongs inside each output item, not as a request parameter.", fr: "call_id se place dans chaque élément de sortie, pas comme paramètre de la requête." }
    instr: { en: "instructions sets the rules of the request; it does not link it to the previous response.", fr: "instructions fixe les règles de la requête ; il ne la relie pas à la réponse précédente." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
