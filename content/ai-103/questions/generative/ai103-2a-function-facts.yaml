id: ai103-2a-function-facts
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing a tool-augmented flow in which a model deployment calls six business functions through function calling. Some functions return data that a downstream service validates against a strict JSON schema.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit un flux augmenté par des outils dans lequel un déploiement de modèle appelle six fonctions métier par appel de fonction. Certaines fonctions renvoient des données qu'un service en aval valide par rapport à un schéma JSON strict.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When one response contains several function calls, the application returns one result per call, each matched to the ID of its call.
        fr: Lorsqu'une réponse contient plusieurs appels de fonction, l'application renvoie un résultat par appel, chacun associé à l'ID de son appel.
    - id: s2
      text:
        en: Each function can have a description of up to 2,000 characters to explain when the model should call it.
        fr: Chaque fonction peut avoir une description de 2 000 caractères au maximum pour expliquer quand le modèle doit l'appeler.
    - id: s3
      text:
        en: When you enable strict structured outputs for function arguments, you should set parallel_tool_calls to false.
        fr: Lorsque vous activez les sorties structurées strictes pour les arguments de fonction, vous devez définir parallel_tool_calls sur false.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Parallel calls arrive together, each with a unique ID, and the application returns one result per ID. Tool and function descriptions are currently limited to 1,024 characters. Structured outputs (strict mode) don't support parallel function calls, so parallel_tool_calls must be set to false.
    fr: |
      Les appels parallèles arrivent ensemble, chacun avec un ID unique, et l'application renvoie un résultat par ID. Les descriptions d'outils et de fonctions sont actuellement limitées à 1 024 caractères. Les sorties structurées (mode strict) ne prennent pas en charge les appels de fonction parallèles : parallel_tool_calls doit être défini sur false.
references:
  - title: How to use function calling with Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/function-calling
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
