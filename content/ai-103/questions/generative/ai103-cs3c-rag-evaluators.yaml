id: ai103-cs3c-rag-evaluators
objective: "2.1.4"
type: dragdrop
caseStudy: ai103-cs3c-relecloud
difficulty: 1
status: draft
stem:
  en: |
    You are configuring an evaluation of maintenance-assistant in the maintenance project. You need to meet the quality requirement.

    Which evaluator should you use for each measurement? To answer, drag the appropriate evaluators to the correct measurements. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous configurez une évaluation de maintenance-assistant dans le projet maintenance. Vous devez satisfaire l'exigence de qualité.

    Quel évaluateur devez-vous utiliser pour chaque mesure ? Pour répondre, faites glisser les évaluateurs appropriés vers les mesures correspondantes. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grd, text: "Groundedness" }
    - { id: ret, text: "Retrieval" }
    - { id: rel, text: "Relevance" }
    - { id: doc, text: "Document Retrieval" }
    - { id: cmp, text: "Response Completeness" }
  targets:
    - id: t1
      text:
        en: "Answers contain claims that are not supported by the retrieved passages"
        fr: "Les réponses contiennent des affirmations non étayées par les passages récupérés"
    - id: t2
      text:
        en: "The retrieved passages are relevant to the question"
        fr: "Les passages récupérés sont pertinents pour la question"
    - id: t3
      text:
        en: "Each answer addresses the question"
        fr: "Chaque réponse répond à la question"
answer:
  mapping: { t1: grd, t2: ret, t3: rel }
explanation:
  correct:
    en: |
      Groundedness checks whether the response aligns with the context without fabricating content. Retrieval uses an LLM judge to measure how relevant the retrieved chunks are to the query, with only the query and the context as inputs. Relevance measures how accurately and directly the response addresses the query.
    fr: |
      Groundedness vérifie si la réponse est cohérente avec le contexte sans inventer de contenu. Retrieval utilise un LLM juge pour mesurer la pertinence des segments récupérés par rapport à la requête, avec seulement la requête et le contexte en entrée. Relevance mesure dans quelle mesure la réponse traite la requête de manière exacte et directe.
  options:
    doc:
      en: |
        Document Retrieval compares the retrieved documents with human-labeled relevance labels, which the test dataset does not contain.
      fr: |
        Document Retrieval compare les documents récupérés à des étiquettes de pertinence attribuées par des humains, que le jeu de données de test ne contient pas.
    cmp:
      en: |
        Response Completeness compares the response with a ground truth answer, which the test dataset does not contain.
      fr: |
        Response Completeness compare la réponse à une réponse de référence (ground truth), que le jeu de données de test ne contient pas.
references:
  - title: Retrieval-Augmented Generation (RAG) evaluators
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
