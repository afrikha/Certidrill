id: ai103-2d-self-critique-order
objective: "2.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation generates summaries of insurance policies for customers by using a **gpt-4.1** deployment and passages retrieved from the policy documents. Because the summaries are high stakes, you add a self-critique loop. The loop must check every summary against the passages, fix the problems it finds, and never run more than two critique rounds.

    Which four actions should you perform in sequence for each request? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum Corporation génère pour ses clients des synthèses de polices d'assurance à l'aide d'un déploiement **gpt-4.1** et d'extraits récupérés dans les documents de police. Les synthèses étant à fort enjeu, vous ajoutez une boucle d'autocritique. La boucle doit vérifier chaque synthèse par rapport aux extraits, corriger les problèmes trouvés et ne jamais dépasser deux tours de critique.

    Quelles sont les quatre actions à effectuer dans l'ordre pour chaque requête ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: draft, text: { en: "Generate a draft summary from the retrieved passages.", fr: "Générer un brouillon de synthèse à partir des extraits récupérés." } }
    - { id: critique, text: { en: "Ask a critique call to check the draft against the passages and return a pass or fail verdict with a list of issues.", fr: "Demander à un appel de critique de vérifier le brouillon par rapport aux extraits et de renvoyer un verdict de réussite ou d'échec avec une liste de problèmes." } }
    - { id: revise, text: { en: "If the verdict fails, revise the draft by using the list of issues and the passages.", fr: "Si le verdict est un échec, réviser le brouillon à l'aide de la liste des problèmes et des extraits." } }
    - { id: stop, text: { en: "Critique again, and return the summary when the verdict passes or the second round ends.", fr: "Critiquer à nouveau, et renvoyer la synthèse quand le verdict est positif ou que le deuxième tour se termine." } }
    - { id: temp, text: { en: "Regenerate the draft at a higher temperature until the critique stops finding issues.", fr: "Régénérer le brouillon à une température plus élevée jusqu'à ce que la critique ne trouve plus de problèmes." } }
    - { id: nosrc, text: { en: "Ask the critique call to rewrite the summary from its own knowledge, without the passages.", fr: "Demander à l'appel de critique de réécrire la synthèse à partir de ses propres connaissances, sans les extraits." } }
answer:
  sequence: [ draft, critique, revise, stop ]
explanation:
  correct:
    en: |
      A self-critique loop generates a draft, critiques it against explicit criteria (here, the passages) with a structured verdict, and revises it by using the issues found. The loop then checks the revision and stops when the verdict passes or the fixed number of rounds is reached, which bounds the extra tokens and latency.
    fr: |
      Une boucle d'autocritique génère un brouillon, le critique selon des critères explicites (ici, les extraits) avec un verdict structuré, puis le révise à l'aide des problèmes trouvés. La boucle vérifie ensuite la révision et s'arrête quand le verdict est positif ou que le nombre fixe de tours est atteint, ce qui borne les jetons et la latence supplémentaires.
  options:
    temp: { en: "A higher temperature only adds randomness, and an open-ended loop breaks the two-round limit.", fr: "Une température plus élevée ajoute seulement du caractère aléatoire, et une boucle sans fin enfreint la limite de deux tours." }
    nosrc: { en: "Without the passages the critique can't check grounding, and rewriting from model knowledge introduces ungrounded content.", fr: "Sans les extraits, la critique ne peut pas vérifier l'ancrage, et réécrire à partir des connaissances du modèle introduit du contenu non ancré." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators
