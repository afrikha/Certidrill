id: ai103-2b-tool-schema-fields
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. has an agent named billing-agent with two function tools, get_invoice and get_payment. Testing shows three problems:

    - The model sometimes calls get_payment for questions about invoices.
    - The model sometimes calls get_invoice without the invoice_id argument.
    - The model sometimes adds an argument named customer_note, which get_invoice doesn't accept.

    You need to fix the tool definitions. How should you complete the sentences? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. dispose d'un agent nommé billing-agent doté de deux outils de fonction, get_invoice et get_payment. Les tests révèlent trois problèmes :

    - Le modèle appelle parfois get_payment pour des questions sur les factures.
    - Le modèle appelle parfois get_invoice sans l'argument invoice_id.
    - Le modèle ajoute parfois un argument nommé customer_note, que get_invoice n'accepte pas.

    Vous devez corriger les définitions des outils. Comment devez-vous compléter les phrases ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To help the model call get_invoice only for invoice questions, improve [[s1]] of each tool.

      To make the model always supply invoice_id, list it in [[s2]].

      To prevent arguments that the schema doesn't declare, set [[s3]].
    fr: |
      Pour aider le modèle à n'appeler get_invoice que pour les questions sur les factures, améliorez [[s1]] de chaque outil.

      Pour que le modèle fournisse toujours invoice_id, listez-le dans [[s2]].

      Pour empêcher les arguments que le schéma ne déclare pas, définissez [[s3]].
  slots:
    - id: s1
      options:
        - { id: desc, text: { en: "the description", fr: "la description" } }
        - { id: strict, text: { en: "the strict setting", fr: "le paramètre strict" } }
        - { id: type, text: { en: "the type of the parameters object", fr: "le type de l'objet parameters" } }
    - id: s2
      options:
        - { id: enum, text: { en: "an enum on invoice_id", fr: "un enum sur invoice_id" } }
        - { id: required, text: { en: "the required array", fr: "le tableau required" } }
        - { id: name, text: { en: "the name of the tool", fr: "le nom de l'outil" } }
    - id: s3
      options:
        - { id: reqempty, text: { en: "required to an empty array", fr: "required sur un tableau vide" } }
        - { id: strictfalse, text: { en: "strict to false", fr: "strict sur false" } }
        - { id: addfalse, text: { en: "additionalProperties to false", fr: "additionalProperties sur false" } }
answer:
  values: { s1: desc, s2: required, s3: addfalse }
explanation:
  correct:
    en: |
      The model chooses a tool from its name and description, so a description that states what the tool returns and when to use it fixes the wrong choice. `required` lists the arguments that the model must supply. `additionalProperties: false` forbids key-value pairs that the schema doesn't define.
    fr: |
      Le modèle choisit un outil d'après son nom et sa description : une description qui indique ce que l'outil renvoie et quand l'utiliser corrige le mauvais choix. `required` liste les arguments que le modèle doit fournir. `additionalProperties: false` interdit les paires clé-valeur que le schéma ne définit pas.
  options:
    strict: { en: "strict enforces the schema of the arguments; it doesn't tell the model when to use the tool.", fr: "strict impose le schéma des arguments ; il n'indique pas au modèle quand utiliser l'outil." }
    enum: { en: "An enum restricts the allowed values of a parameter; it doesn't make the parameter mandatory.", fr: "Un enum limite les valeurs autorisées d'un paramètre ; il ne rend pas le paramètre obligatoire." }
    strictfalse: { en: "Setting strict to false relaxes schema enforcement instead of preventing extra arguments.", fr: "Définir strict sur false assouplit l'application du schéma au lieu d'empêcher les arguments supplémentaires." }
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
