id: ai103-2d-content-recording-env
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank's Python application calls a Foundry agent and uses client-side tracing with `AIProjectInstrumentor`, exported to Application Insights. The same code runs in a development environment and in production.

    The requirements are:

    - production traces must keep the spans, durations and token counts, but must not contain user messages, tool call arguments or model outputs;
    - development traces must include the message contents and tool call parameters for debugging.

    What should you do?
  fr: |
    L'application Python de Woodgrove Bank appelle un agent Foundry et utilise le suivi côté client avec `AIProjectInstrumentor`, exporté vers Application Insights. Le même code s'exécute dans un environnement de développement et en production.

    Les exigences sont les suivantes :

    - les traces de production doivent conserver les étendues, les durées et les nombres de jetons, mais ne doivent contenir ni messages des utilisateurs, ni arguments d'appel d'outil, ni sorties du modèle ;
    - les traces de développement doivent inclure le contenu des messages et les paramètres des appels d'outil pour le débogage.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING to true in development and to false in production.", fr: "Définir AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING sur true en développement et sur false en production." } }
    - { id: b, text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true in development only and leave it unset in production.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true en développement uniquement et le laisser non défini en production." } }
    - { id: c, text: { en: "Set AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API to false in production and leave it unset in development.", fr: "Définir AZURE_TRACING_GEN_AI_INSTRUMENT_RESPONSES_API sur false en production et le laisser non défini en développement." } }
    - { id: d, text: { en: "Decorate the tool functions with @trace_function in production and remove the decorator in development.", fr: "Décorer les fonctions d'outil avec @trace_function en production et retirer le décorateur en développement." } }
answer: { optionId: b }
explanation:
  correct:
    en: "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT controls content recording: when true, built-in traces capture message contents and tool call parameters; it defaults to false. Learn recommends enabling it only in development, so production keeps the spans and metrics without the sensitive content."
    fr: "OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT contrôle l'enregistrement du contenu : à true, les traces intégrées capturent le contenu des messages et les paramètres des appels d'outil ; sa valeur par défaut est false. Learn recommande de ne l'activer qu'en développement : la production conserve ainsi les étendues et les métriques sans le contenu sensible."
  options:
    a: { en: "Turning off the GenAI tracing in production removes the spans and token counts that production must keep.", fr: "Désactiver le suivi GenAI en production supprime les étendues et les nombres de jetons que la production doit conserver." }
    c: { en: "Disabling the automatic instrumentation of the Responses API removes those spans instead of only hiding their content.", fr: "Désactiver l'instrumentation automatique de l'API Responses supprime ces étendues au lieu de masquer seulement leur contenu." }
    d: { en: "@trace_function always records parameters and return values, whatever the content recording setting, so it would add tool data to production traces.", fr: "@trace_function enregistre toujours les paramètres et les valeurs de retour, quel que soit le paramètre d'enregistrement du contenu : il ajouterait des données d'outil aux traces de production." }
references:
  - title: Add client-side tracing to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
