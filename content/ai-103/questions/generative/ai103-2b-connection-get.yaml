id: ai103-2b-connection-get
objective: "2.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has a Foundry project that contains exactly one Azure AI Search connection. The connection is named wingtip-search, and it is the default connection of its type in the project. A Python application has an authenticated `AIProjectClient` named `project`.

    You need to retrieve the object of this connection in the code.

    Which two calls should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un projet Foundry qui contient exactement une connexion Azure AI Search. La connexion est nommée wingtip-search, et c'est la connexion par défaut de son type dans le projet. Une application Python dispose d'un `AIProjectClient` authentifié nommé `project`.

    Vous devez récupérer l'objet de cette connexion dans le code.

    Quels sont les deux appels que vous devez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: 'project.indexes.get("wingtip-search")' }
    - { id: b, text: 'project.connections.get("wingtip-search")' }
    - { id: c, text: 'project.connections.get_default("AzureBlob")' }
    - { id: d, text: 'project.deployments.get("wingtip-search")' }
    - { id: e, text: 'project.connections.get_default("CognitiveSearch")' }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      `connections.get()` returns a connection by its name. `connections.get_default()` returns the default connection of a given type, and `CognitiveSearch` is the connection type value of Azure AI Search. Because wingtip-search is both the named connection and the default Azure AI Search connection, both calls return it.
    fr: |
      `connections.get()` renvoie une connexion par son nom. `connections.get_default()` renvoie la connexion par défaut d'un type donné, et `CognitiveSearch` est la valeur du type de connexion d'Azure AI Search. Comme wingtip-search est à la fois la connexion nommée et la connexion Azure AI Search par défaut, les deux appels la renvoient.
  options:
    a: { en: "project.indexes manages index assets of the project, not connections.", fr: "project.indexes gère les ressources d'index du projet, pas les connexions." }
    c: { en: "AzureBlob is the type of Blob Storage connections, not of Azure AI Search connections.", fr: "AzureBlob est le type des connexions Stockage Blob, pas celui des connexions Azure AI Search." }
    d: { en: "project.deployments returns model deployments, not connections.", fr: "project.deployments renvoie des déploiements de modèles, pas des connexions." }
references:
  - title: azure.ai.projects.operations.ConnectionsOperations class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.operations.connectionsoperations
