id: ai103-sr1-refund-approval-1
objective: "2.2.5"
type: series_yesno
series: ai103-sr1-refund-approval
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You set require_approval to never and add confirmation rules to the agent instructions.
  fr: Vous définissez require_approval sur never et ajoutez des règles de confirmation aux instructions de l'agent.
body:
  solution:
    en: |
      You define the tool as follows and add this sentence to the agent instructions: "Before you call issue_refund or cancel_order, ask for confirmation and wait for the answer."

      ```python
      tool = MCPTool(
          server_label="orders",
          server_url=ORDERS_MCP_URL,
          allowed_tools=["get_order_status", "list_orders",
                         "issue_refund", "cancel_order"],
          require_approval="never",
      )
      ```
    fr: |
      Vous définissez l'outil comme suit et ajoutez cette phrase aux instructions de l'agent : « Before you call issue_refund or cancel_order, ask for confirmation and wait for the answer. »

      ```python
      tool = MCPTool(
          server_label="orders",
          server_url=ORDERS_MCP_URL,
          allowed_tools=["get_order_status", "list_orders",
                         "issue_refund", "cancel_order"],
          require_approval="never",
      )
      ```
answer: { value: false }
explanation:
  correct:
    en: With `require_approval="never"`, the service runs every tool call without returning an approval request, so nothing forces a supervisor to approve refunds or cancellations. An instruction in the prompt only influences the model, which would ask the customer in the chat rather than a supervisor; approvals must be enforced independently of model decisions.
    fr: "Avec `require_approval=\"never\"`, le service exécute chaque appel d'outil sans renvoyer de demande d'approbation : rien n'oblige un superviseur à approuver les remboursements ou les annulations. Une instruction dans l'invite influence seulement le modèle, qui demanderait confirmation au client dans la conversation plutôt qu'à un superviseur ; les approbations doivent être appliquées indépendamment des décisions du modèle."
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
