id: ai103-2d-prompt-message-order
objective: "2.3.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Contoso builds a Chat Completions request for a **gpt-4.1-mini** deployment that classifies customer emails. The request must state the task first, show two labeled examples, include the email to classify, and counter recency bias in long emails.

    Which four elements should you include in the request, in order? To answer, move the appropriate elements from the list of elements to the answer area and arrange them in the correct order.
  fr: |
    Contoso construit une requête Chat Completions pour un déploiement **gpt-4.1-mini** qui classe les e-mails des clients. La requête doit énoncer la tâche en premier, montrer deux exemples étiquetés, inclure l'e-mail à classer et contrer le biais de récence dans les longs e-mails.

    Quels sont les quatre éléments à inclure dans la requête, dans l'ordre ? Pour répondre, déplacez les éléments appropriés de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: system, text: { en: "A system message that states the classification task and the allowed labels.", fr: "Un message système qui énonce la tâche de classification et les étiquettes autorisées." } }
    - { id: examples, text: { en: "Two pairs of user and assistant messages, each with a sample email and its label.", fr: "Deux paires de messages user et assistant, chacune avec un exemple d'e-mail et son étiquette." } }
    - { id: email, text: { en: "A user message that contains the email to classify.", fr: "Un message user qui contient l'e-mail à classer." } }
    - { id: repeat, text: { en: "A closing reminder of the allowed labels, ending with the cue Label:", fr: "Un rappel final des étiquettes autorisées, se terminant par l'amorce Label:" } }
    - { id: answer, text: { en: "An assistant message that contains the label of the email to classify.", fr: "Un message assistant qui contient l'étiquette de l'e-mail à classer." } }
    - { id: tool, text: { en: "A tool message that returns the list of labels.", fr: "Un message tool qui renvoie la liste des étiquettes." } }
answer:
  sequence: [ system, examples, email, repeat ]
explanation:
  correct:
    en: |
      Instructions go first, in the system message, before the context and the examples. Few-shot examples are added as user and assistant interactions after the system message. The email to classify follows, and repeating the instructions at the end, with a short cue that primes the expected form of the answer, counters recency bias in long content.
    fr: |
      Les instructions viennent en premier, dans le message système, avant le contexte et les exemples. Les exemples few-shot sont ajoutés sous forme d'échanges user et assistant après le message système. L'e-mail à classer suit, et la répétition des instructions à la fin, avec une courte amorce qui oriente la forme attendue de la réponse, contre le biais de récence dans les contenus longs.
  options:
    answer: { en: "The label of the email to classify is what the model must produce; supplying it defeats the request.", fr: "L'étiquette de l'e-mail à classer est ce que le modèle doit produire ; la fournir rend la requête inutile." }
    tool: { en: "A tool message answers a tool call made by the model; none is made here, and the labels belong in the instructions.", fr: "Un message tool répond à un appel d'outil du modèle ; aucun n'est effectué ici, et les étiquettes ont leur place dans les instructions." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
