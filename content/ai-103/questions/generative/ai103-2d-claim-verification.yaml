id: ai103-2d-claim-verification
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum's newsroom asks a **gpt-4.1** deployment to verify long press releases before publication. Each release contains dozens of factual claims. A single prompt that says "Check this release for factual errors" misses most of the errors that editors later find. The application can call a web search API.

    You need to improve how the model checks its own findings. What should you do?
  fr: |
    La rédaction d'Adatum demande à un déploiement **gpt-4.1** de vérifier de longs communiqués de presse avant publication. Chaque communiqué contient des dizaines d'affirmations factuelles. Une invite unique indiquant « Check this release for factual errors » manque la plupart des erreurs que les éditeurs trouvent ensuite. L'application peut appeler une API de recherche web.

    Vous devez améliorer la façon dont le modèle vérifie ses propres constats. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Send the release several times at a higher temperature and keep the errors found most often.", fr: "Envoyer le communiqué plusieurs fois à une température plus élevée et conserver les erreurs trouvées le plus souvent." } }
    - { id: b, text: { en: "Ask the model to give a confidence score for the release, and send low scores to the editors.", fr: "Demander au modèle un score de confiance pour le communiqué, et envoyer les scores faibles aux éditeurs." } }
    - { id: c, text: { en: "First have the model extract the claims, then issue a search query for each claim and check it against the results.", fr: "Faire d'abord extraire les affirmations par le modèle, puis émettre une requête de recherche pour chaque affirmation et la vérifier par rapport aux résultats." } }
    - { id: d, text: { en: "Add few-shot examples of correct press releases so that the model learns the expected facts.", fr: "Ajouter des exemples few-shot de communiqués corrects pour que le modèle apprenne les faits attendus." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Breaking the task down into smaller steps, extracting the factual claims first and then querying for each one, improves results dramatically on text with many claims. Calling search as an affordance and pasting its results back into the prompt lets the model check each claim against up-to-date evidence instead of its own parameters."
    fr: "Décomposer la tâche en étapes plus petites, en extrayant d'abord les affirmations factuelles puis en lançant une requête pour chacune, améliore nettement les résultats sur un texte riche en affirmations. Appeler la recherche comme affordance et réinjecter ses résultats dans l'invite permet au modèle de vérifier chaque affirmation par rapport à des éléments à jour plutôt qu'à ses propres paramètres."
  options:
    a: { en: "Repeating the same unchecked request with more randomness doesn't provide evidence; frequent findings can still be wrong.", fr: "Répéter la même requête non vérifiée avec plus d'aléatoire n'apporte aucun élément de preuve ; des constats fréquents peuvent rester faux." }
    b: { en: "A self-reported confidence score isn't checked against any source and doesn't point to the wrong claims.", fr: "Un score de confiance autodéclaré n'est vérifié par rapport à aucune source et ne désigne pas les affirmations fausses." }
    d: { en: "Examples condition format and style for the current request; they don't supply the facts needed to verify new claims.", fr: "Les exemples conditionnent le format et le style pour la requête en cours ; ils ne fournissent pas les faits nécessaires pour vérifier de nouvelles affirmations." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
