id: ai103-2b-conversation-items
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a support agent. The application creates a conversation by calling `openai.conversations.create()` and passes the conversation ID in each call to `responses.create()`. Some conversations become longer than the context window of the model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un agent de support. L'application crée une conversation en appelant `openai.conversations.create()` et passe l'ID de la conversation dans chaque appel à `responses.create()`. Certaines conversations deviennent plus longues que la fenêtre de contexte du modèle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The conversation stores items such as messages, tool calls, and tool outputs.
        fr: |
          La conversation stocke des éléments comme les messages, les appels d'outils et les sorties d'outils.
    - id: s2
      text:
        en: |
          When a conversation exceeds the context size of the model, the service deletes the oldest items from the conversation.
        fr: |
          Quand une conversation dépasse la taille de contexte du modèle, le service supprime les éléments les plus anciens de la conversation.
    - id: s3
      text:
        en: |
          The application can store the conversation ID and use it in a later session to continue the same exchange.
        fr: |
          L'application peut stocker l'ID de la conversation et l'utiliser lors d'une session ultérieure pour poursuivre le même échange.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Conversations are durable objects with unique IDs that can be reused across sessions, and they store items such as messages, tool calls and tool outputs. When a conversation exceeds the supported context size, the model truncates the input context: only a subset is used to generate the response, but the conversation itself isn't truncated.
    fr: |
      Les conversations sont des objets durables dotés d'ID uniques, réutilisables d'une session à l'autre, et elles stockent des éléments comme les messages, les appels d'outils et les sorties d'outils. Quand une conversation dépasse la taille de contexte prise en charge, le modèle tronque le contexte d'entrée : seul un sous-ensemble sert à générer la réponse, mais la conversation elle-même n'est pas tronquée.
references:
  - title: Build with runtime components in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components
