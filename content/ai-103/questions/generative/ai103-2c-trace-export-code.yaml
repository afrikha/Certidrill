id: ai103-2c-trace-export-code
objective: "2.2.6"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Contoso Pharmaceuticals has a Python application that calls a Foundry agent. The Foundry project is connected to an Application Insights resource.

    You need to add client-side tracing to the application. The spans must be sent to the Application Insights resource connected to the project, and the connection string must not be stored in the code or in configuration files.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Pharmaceuticals dispose d'une application Python qui appelle un agent Foundry. Le projet Foundry est connecté à une ressource Application Insights.

    Vous devez ajouter le traçage côté client à l'application. Les étendues doivent être envoyées à la ressource Application Insights connectée au projet, et la chaîne de connexion ne doit être stockée ni dans le code ni dans des fichiers de configuration.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os

    os.environ["[[optin]]"] = "true"

    from azure.ai.projects import AIProjectClient
    from azure.identity import DefaultAzureCredential
    from azure.monitor.opentelemetry import configure_azure_monitor

    with (
        DefaultAzureCredential() as credential,
        AIProjectClient(endpoint=os.environ["FOUNDRY_PROJECT_ENDPOINT"], credential=credential) as project,
    ):
        connection_string = project.[[source]].get_application_insights_connection_string()
        configure_azure_monitor(connection_string=connection_string)
  slots:
    - id: optin
      options:
        - { id: content, text: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT }
        - { id: binary, text: AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA }
        - { id: enable, text: AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING }
    - id: source
      options:
        - { id: telemetry, text: telemetry }
        - { id: connections, text: connections }
        - { id: agents, text: agents }
answer:
  values: { optin: enable, source: telemetry }
explanation:
  correct:
    en: |
      `AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING` opts in to GenAI tracing and must be set before instrumentation. `project.telemetry.get_application_insights_connection_string()` retrieves the connection string of the Application Insights resource connected to the project at run time, and `configure_azure_monitor` exports the spans to it.
    fr: |
      `AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING` active le traçage GenAI et doit être défini avant l'instrumentation. `project.telemetry.get_application_insights_connection_string()` récupère au moment de l'exécution la chaîne de connexion de la ressource Application Insights connectée au projet, et `configure_azure_monitor` y exporte les étendues.
  options:
    content:
      en: "`OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` controls content recording, which isn't required and is off by default; it doesn't turn tracing on."
      fr: "`OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT` contrôle l'enregistrement du contenu, qui n'est pas demandé et est désactivé par défaut ; il n'active pas le traçage."
    binary:
      en: "`AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA` adds image and file data to spans; it doesn't turn tracing on."
      fr: "`AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA` ajoute les données d'image et de fichier aux étendues ; il n'active pas le traçage."
    connections:
      en: "The telemetry operations of the project client return the Application Insights connection string."
      fr: "Ce sont les opérations telemetry du client de projet qui renvoient la chaîne de connexion Application Insights."
references:
  - title: Add client-side tracing to Foundry agents (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
