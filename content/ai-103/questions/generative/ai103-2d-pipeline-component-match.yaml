id: ai103-2d-pipeline-component-match
objective: "2.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware is designing a returns pipeline that orchestrates several components. Each step must use the component that meets its need at the lowest cost while keeping decisions predictable where the policy requires it.

    Which component should you use for each step? To answer, drag the appropriate components to the correct steps. Each component may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware conçoit un pipeline de retours qui orchestre plusieurs composants. Chaque étape doit utiliser le composant qui répond à son besoin au moindre coût, tout en gardant les décisions prévisibles là où la stratégie l'exige.

    Quel composant devez-vous utiliser pour chaque étape ? Pour répondre, faites glisser les composants appropriés vers les étapes correspondantes. Chaque composant peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: embed, text: { en: "Embedding model", fr: "Modèle d'embedding" } }
    - { id: slm, text: { en: "Small language model", fr: "Petit modèle de langage" } }
    - { id: multimodal, text: { en: "Multimodal model", fr: "Modèle multimodal" } }
    - { id: rules, text: { en: "Rules engine in code", fr: "Moteur de règles dans le code" } }
    - { id: reasoning, text: { en: "Large reasoning model", fr: "Grand modèle de raisonnement" } }
    - { id: imagegen, text: { en: "Image generation model", fr: "Modèle de génération d'images" } }
  targets:
    - id: t1
      text: { en: "Convert each return reason into vectors to find similar past cases.", fr: "Convertir chaque motif de retour en vecteurs pour trouver des cas passés similaires." }
    - id: t2
      text: { en: "Label each of thousands of daily return requests with one of five categories.", fr: "Étiqueter chacune des milliers de demandes de retour quotidiennes avec l'une de cinq catégories." }
    - id: t3
      text: { en: "Describe the damage visible in the photos that customers attach.", fr: "Décrire les dommages visibles sur les photos jointes par les clients." }
    - id: t4
      text: { en: "Apply the policy's fixed 30-day return window and refund cap.", fr: "Appliquer le délai de retour fixe de 30 jours et le plafond de remboursement de la stratégie." }
answer:
  mapping: { t1: embed, t2: slm, t3: multimodal, t4: rules }
explanation:
  correct:
    en: |
      A specialized pipeline uses a different component per step. An embedding model turns text into vectors for similarity search. A small language model handles a simple, high-volume classification at low cost and latency. A multimodal model accepts images and describes their content. Fixed thresholds such as a return window and a refund cap belong in deterministic rules, which give reproducible and auditable decisions.
    fr: |
      Un pipeline spécialisé utilise un composant différent à chaque étape. Un modèle d'embedding transforme le texte en vecteurs pour la recherche de similarité. Un petit modèle de langage traite une classification simple et volumineuse à faible coût et faible latence. Un modèle multimodal accepte des images et décrit leur contenu. Les seuils fixes comme un délai de retour et un plafond de remboursement relèvent de règles déterministes, qui donnent des décisions reproductibles et auditables.
  options:
    reasoning: { en: "A large reasoning model costs more and adds latency without benefit for these steps, and it doesn't make policy decisions deterministic.", fr: "Un grand modèle de raisonnement coûte plus cher et ajoute de la latence sans bénéfice pour ces étapes, et il ne rend pas les décisions de stratégie déterministes." }
    imagegen: { en: "An image generation model creates images; it doesn't analyze the customers' photos.", fr: "Un modèle de génération d'images crée des images ; il n'analyse pas les photos des clients." }
references:
  - title: Generate embeddings with Azure OpenAI
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/embeddings
