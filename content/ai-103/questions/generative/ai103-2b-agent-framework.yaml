id: ai103-2b-agent-framework
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is building a Python application in which a triage agent hands off customer requests to specialist agents. The orchestration is written in code. It will first run on the company's own Kubernetes cluster and later be deployed as a hosted agent in Foundry, and it must call the project's models through the Responses endpoint of the Foundry project.

    You need to use the orchestration layer that Microsoft recommends for hosted agents in Foundry.

    What should you use?
  fr: |
    Tailspin Toys crée une application Python dans laquelle un agent de tri transfère les demandes des clients à des agents spécialisés. L'orchestration est écrite dans le code. Elle s'exécutera d'abord sur le cluster Kubernetes de l'entreprise, puis sera déployée comme agent hébergé dans Foundry, et elle doit appeler les modèles du projet via le point de terminaison Responses du projet Foundry.

    Vous devez utiliser la couche d'orchestration que Microsoft recommande pour les agents hébergés dans Foundry.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: "AutoGen" }
    - { id: b, text: { en: "The orchestration workflow feature of Azure Language", fr: "La fonctionnalité de workflow d'orchestration d'Azure Language" } }
    - { id: c, text: { en: "Microsoft Agent Framework with its Foundry chat client", fr: "Microsoft Agent Framework avec son client de conversation Foundry" } }
    - { id: d, text: "Semantic Kernel" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft Agent Framework is an open-source SDK for Python and .NET for multi-agent orchestration, and Learn names it the recommended orchestration layer for hosted agents in Foundry. Its `FoundryChatClient` calls the Responses API of the project endpoint, either from your own infrastructure or as a hosted agent.
    fr: |
      Microsoft Agent Framework est un SDK open source pour Python et .NET destiné à l'orchestration multi-agent, et Learn le présente comme la couche d'orchestration recommandée pour les agents hébergés dans Foundry. Son `FoundryChatClient` appelle l'API Responses du point de terminaison du projet, depuis votre propre infrastructure ou en tant qu'agent hébergé.
  options:
    a: { en: "Learn advises teams that use AutoGen to consider Agent Framework as their primary orchestration layer.", fr: "Learn conseille aux équipes qui utilisent AutoGen d'envisager Agent Framework comme couche d'orchestration principale." }
    b: { en: "Orchestration workflow is a Language feature that routes utterances to conversational language understanding and question answering projects; it doesn't orchestrate Foundry agents, and it is scheduled to retire on March 31, 2029.", fr: "Le workflow d'orchestration est une fonctionnalité de Language qui route des énoncés vers des projets de compréhension du langage courant et de réponses aux questions ; il n'orchestre pas des agents Foundry, et sa mise hors service est prévue le 31 mars 2029." }
    d: { en: "Learn advises teams that use Semantic Kernel to consider Agent Framework as their primary orchestration layer.", fr: "Learn conseille aux équipes qui utilisent Semantic Kernel d'envisager Agent Framework comme couche d'orchestration principale." }
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
