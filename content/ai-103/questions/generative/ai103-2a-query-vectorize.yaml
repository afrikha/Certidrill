id: ai103-2a-query-vectorize
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum's RAG application receives questions as plain text. The Azure AI Search index has a vector field named contentVector that was filled during indexing with a **text-embedding-3-small** deployment.

    You need each question to run as a vector query against contentVector.

    Which two solutions meet the requirement? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'application RAG d'Adatum reçoit les questions sous forme de texte brut. L'index Azure AI Search possède un champ vectoriel nommé contentVector, alimenté pendant l'indexation avec un déploiement **text-embedding-3-small**.

    Chaque question doit s'exécuter sous forme de requête vectorielle sur contentVector.

    Quelles sont les deux solutions qui répondent à l'exigence ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Assign to contentVector an Azure OpenAI vectorizer that uses text-embedding-3-small, then send a vector query of kind text with the question.", fr: "Attribuer à contentVector un vectoriseur Azure OpenAI qui utilise text-embedding-3-small, puis envoyer une requête vectorielle de type text avec la question." } }
    - { id: b, text: { en: "Send the question in the search parameter, with queryType set to semantic and a semantic configuration.", fr: "Envoyer la question dans le paramètre search, avec queryType défini sur semantic et une configuration sémantique." } }
    - { id: c, text: { en: "Compute the embedding of the question in the application with text-embedding-3-small, then send a vector query of kind vector.", fr: "Calculer l'embedding de la question dans l'application avec text-embedding-3-small, puis envoyer une requête vectorielle de type vector." } }
    - { id: d, text: { en: "Send a vector query of kind text with the question, without changing the index definition.", fr: "Envoyer une requête vectorielle de type text avec la question, sans modifier la définition de l'index." } }
    - { id: e, text: { en: "Add a scoring profile that boosts contentVector, then send the question in the search parameter.", fr: "Ajouter un profil de scoring qui renforce contentVector, puis envoyer la question dans le paramètre search." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: A vector query needs a vector built with the same embedding model as the indexed content. Either a vectorizer defined in the index converts the text at query time (kind text), or the application calls the embedding model itself and sends the array (kind vector).
    fr: Une requête vectorielle nécessite un vecteur produit par le même modèle d'embedding que le contenu indexé. Soit un vectoriseur défini dans l'index convertit le texte au moment de la requête (type text), soit l'application appelle elle-même le modèle d'embedding et envoie le tableau (type vector).
  options:
    b:
      en: The search parameter runs a full-text query; semantic ranking reranks its results but does not run a vector query.
      fr: Le paramètre search exécute une requête en texte intégral ; le classement sémantique reclasse ses résultats mais n'exécute pas de requête vectorielle.
    d:
      en: A query of kind text requires a vectorizer on the field; the index has none.
      fr: Une requête de type text nécessite un vectoriseur sur le champ ; l'index n'en a pas.
    e:
      en: Scoring profiles adjust full-text scores; they do not convert the question into a vector.
      fr: Les profils de scoring ajustent les scores du texte intégral ; ils ne convertissent pas la question en vecteur.
references:
  - title: Create a vector query in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-query
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
