id: ai103-2b-strict-schema-rules
objective: "2.2.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. sends Responses API requests to a gpt-4.1 deployment with several function tools. Each tool is defined with `strict: true` so that the arguments always match its JSON Schema. One tool takes an invoice ID in the format INV-000000.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. envoie des requêtes de l'API Responses à un déploiement gpt-4.1 avec plusieurs outils de fonction. Chaque outil est défini avec `strict: true` pour que les arguments correspondent toujours à son schéma JSON. Un outil reçoit un ID de facture au format INV-000000.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The schema can use the pattern keyword to enforce the format of the invoice ID.
        fr: |
          Le schéma peut utiliser le mot clé pattern pour imposer le format de l'ID de facture.
    - id: s2
      text:
        en: |
          A schema can contain up to 100 object properties in total, with up to five levels of nesting.
        fr: |
          Un schéma peut contenir jusqu'à 100 propriétés d'objet au total, avec jusqu'à cinq niveaux d'imbrication.
    - id: s3
      text:
        en: |
          The requests should set parallel_tool_calls to false.
        fr: |
          Les requêtes doivent définir parallel_tool_calls sur false.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Structured outputs support a subset of JSON Schema: for strings, `minLength`, `maxLength`, `pattern` and `format` aren't supported, so the format must be described in the parameter description or checked by your code. A schema can have up to 100 object properties in total with up to five levels of nesting. Structured outputs aren't supported with parallel function calls, so you set `parallel_tool_calls` to `false`.
    fr: |
      Les sorties structurées prennent en charge un sous-ensemble de JSON Schema : pour les chaînes, `minLength`, `maxLength`, `pattern` et `format` ne sont pas pris en charge ; le format doit donc être décrit dans la description du paramètre ou vérifié par votre code. Un schéma peut comporter jusqu'à 100 propriétés d'objet au total avec jusqu'à cinq niveaux d'imbrication. Les sorties structurées ne sont pas prises en charge avec les appels de fonctions parallèles : vous définissez donc `parallel_tool_calls` sur `false`.
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
