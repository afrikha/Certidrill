id: ai103-2d-recency-repeat
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Corporation builds a prompt for a **gpt-4.1** deployment that starts with the instructions, including "Answer in exactly three bullet points", followed by about 20 pages of retrieved policy text and the user's question.

    The answers use the policy text correctly, but they often ignore the three-bullet instruction. Shorter prompts with the same instructions follow it.

    You need to improve adherence to the instruction without removing any policy text. What should you do first?
  fr: |
    Adatum Corporation construit pour un déploiement **gpt-4.1** une invite qui commence par les instructions, dont « Répondre en exactement trois puces », suivies d'environ 20 pages de texte de stratégie récupéré et de la question de l'utilisateur.

    Les réponses exploitent correctement le texte de stratégie, mais elles ignorent souvent l'instruction des trois puces. Des invites plus courtes contenant les mêmes instructions la respectent.

    Vous devez améliorer le respect de l'instruction sans supprimer de texte de stratégie. Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Repeat the format instruction at the end of the prompt, after the policy text.", fr: "Répéter l'instruction de format à la fin de l'invite, après le texte de stratégie." } }
    - { id: b, text: { en: "Raise the temperature so that the model weighs the instructions more.", fr: "Augmenter la température pour que le modèle accorde plus de poids aux instructions." } }
    - { id: c, text: { en: "Add a presence_penalty so that the model avoids topics it already used.", fr: "Ajouter un presence_penalty pour que le modèle évite les sujets déjà abordés." } }
    - { id: d, text: { en: "Raise max_completion_tokens so that the model has room for the format.", fr: "Augmenter max_completion_tokens pour que le modèle dispose de place pour le format." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Models are susceptible to recency bias, so information at the end of a long prompt can influence the output more than instructions placed before many pages of content. Learn suggests repeating the instructions at the end of the prompt and evaluating the impact."
    fr: "Les modèles sont sensibles au biais de récence : les informations placées à la fin d'une longue invite peuvent influencer davantage la sortie que des instructions placées avant de nombreuses pages de contenu. Learn suggère de répéter les instructions à la fin de l'invite et d'en évaluer l'effet."
  options:
    b: { en: "Temperature only controls randomness; a higher value makes the output less predictable, not more obedient.", fr: "La température contrôle seulement le caractère aléatoire ; une valeur plus élevée rend la sortie moins prévisible, pas plus obéissante." }
    c: { en: "presence_penalty discourages repeating topics; it doesn't make the model apply a format instruction.", fr: "presence_penalty décourage la répétition de sujets ; il ne fait pas appliquer une instruction de format." }
    d: { en: "The answers aren't truncated; a larger token cap doesn't change how the model follows instructions.", fr: "Les réponses ne sont pas tronquées ; un plafond de jetons plus élevé ne change pas la manière dont le modèle suit les instructions." }
references:
  - title: Prompt engineering techniques
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/prompt-engineering
