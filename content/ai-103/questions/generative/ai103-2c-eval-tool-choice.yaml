id: ai103-2c-eval-tool-choice
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has a Foundry agent named orders-agent that has five function tools. Reviews of production conversations show that orders-agent sometimes calls tools that the request doesn't need and sometimes skips a tool that it needs.

    You need an evaluator that measures, across a test dataset, whether orders-agent selects the necessary tools without unnecessary ones.

    Which evaluator should you use?
  fr: |
    Northwind Traders dispose d'un agent Foundry nommé orders-agent doté de cinq outils de fonction. L'examen des conversations de production montre qu'orders-agent appelle parfois des outils dont la demande n'a pas besoin et omet parfois un outil nécessaire.

    Vous avez besoin d'un évaluateur qui mesure, sur un jeu de données de test, si orders-agent sélectionne les outils nécessaires sans outils inutiles.

    Quel évaluateur devez-vous utiliser ?
body:
  options:
    - { id: a, text: Tool Call Success }
    - { id: b, text: Intent Resolution }
    - { id: c, text: Task Completion }
    - { id: d, text: Tool Selection }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Tool Selection is a process evaluator that checks whether the agent selected the necessary tools without unnecessary ones. It takes the query or messages together with the tool definitions and returns Pass or Fail.
    fr: |
      Tool Selection est un évaluateur de processus qui vérifie si l'agent a sélectionné les outils nécessaires sans outils inutiles. Il reçoit la requête ou les messages avec les définitions d'outils et renvoie Pass ou Fail.
  options:
    a:
      en: |
        Tool Call Success checks whether tool calls ran without technical errors or exceptions, not whether the right tools were chosen.
      fr: |
        Tool Call Success vérifie si les appels d'outil se sont exécutés sans erreur technique ni exception, pas si les bons outils ont été choisis.
    b:
      en: |
        Intent Resolution checks whether the agent correctly identified what the user wanted.
      fr: |
        Intent Resolution vérifie si l'agent a correctement identifié ce que voulait l'utilisateur.
    c:
      en: |
        Task Completion checks whether the agent completed the task with a usable deliverable, whatever tools it used.
      fr: |
        Task Completion vérifie si l'agent a terminé la tâche avec un livrable exploitable, quels que soient les outils utilisés.
references:
  - title: Agent evaluators
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators
