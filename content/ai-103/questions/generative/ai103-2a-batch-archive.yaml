id: ai103-2a-batch-archive
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has 2 million archived support tickets that must be classified by a GPT model from the Foundry model catalog. The results are needed within the next few days, and no user waits for an individual answer. There is no data residency requirement.

    You need to deploy the model for this job. The solution must minimize cost.

    Which deployment type should you use?
  fr: |
    Fabrikam dispose de 2 millions de tickets de support archivés qui doivent être classés par un modèle GPT du catalogue de modèles Foundry. Les résultats sont attendus dans les prochains jours et aucun utilisateur n'attend de réponse individuelle. Il n'existe aucune exigence de résidence des données.

    Vous devez déployer le modèle pour ce traitement. La solution doit réduire les coûts au minimum.

    Quel type de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: Global Standard }
    - { id: b, text: Global Provisioned }
    - { id: c, text: Global Batch }
    - { id: d, text: Developer }
answer: { optionId: c }
explanation:
  correct:
    en: Global Batch processes large asynchronous jobs at 50% less cost than Global Standard, with a 24-hour target turnaround and a separate enqueued token quota. A job with no real-time requirement and a deadline measured in days is the case it is designed for.
    fr: Global Batch traite de gros travaux asynchrones pour un coût inférieur de 50 % à celui de Global Standard, avec un délai cible de 24 heures et un quota de jetons en file d'attente distinct. Un travail sans exigence de temps réel, avec une échéance de plusieurs jours, est exactement le cas prévu.
  options:
    a:
      en: Global Standard bills every token at the regular pay-per-token price; it suits interactive traffic, not the cheapest bulk processing.
      fr: Global Standard facture chaque jeton au prix normal du paiement au jeton ; il convient au trafic interactif, pas au traitement en masse le moins cher.
    b:
      en: Global Provisioned reserves throughput units for predictable latency, which you pay for whether or not you use them; it does not minimize the cost of a one-off job.
      fr: Global Provisioned réserve des unités de débit pour une latence prévisible, payées qu'elles soient utilisées ou non ; il ne réduit pas le coût d'un traitement ponctuel.
    d:
      en: The Developer type is only for evaluating fine-tuned models, with a fixed 24-hour lifetime and no SLA.
      fr: Le type Developer sert uniquement à évaluer des modèles affinés, avec une durée de vie fixe de 24 heures et sans SLA.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
