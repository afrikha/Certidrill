id: ai103-2b-client-match
objective: "2.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has a Foundry resource named adatum-ai that contains a project. Several teams write Python code against it.

    You need to recommend which client each team should use.

    Which client should you recommend for each requirement? To answer, drag the appropriate clients to the correct requirements. Each client may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'une ressource Foundry nommée adatum-ai qui contient un projet. Plusieurs équipes écrivent du code Python pour cette ressource.

    Vous devez recommander le client que chaque équipe doit utiliser.

    Quel client devez-vous recommander pour chaque exigence ? Pour répondre, faites glisser les clients appropriés vers les exigences correspondantes. Chaque client peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: project, text: { en: "AIProjectClient with the project endpoint", fr: "AIProjectClient avec le point de terminaison du projet" } }
    - { id: openai, text: { en: "OpenAI client with the /openai/v1 endpoint", fr: "Client OpenAI avec le point de terminaison /openai/v1" } }
    - { id: anthropic, text: { en: "AnthropicFoundry client with the /anthropic endpoint", fr: "Client AnthropicFoundry avec le point de terminaison /anthropic" } }
    - { id: safety, text: { en: "Content Safety client with the cognitiveservices.azure.com endpoint", fr: "Client Content Safety avec le point de terminaison cognitiveservices.azure.com" } }
    - { id: framework, text: { en: "Microsoft Agent Framework workflow", fr: "Workflow Microsoft Agent Framework" } }
  targets:
    - id: t1
      text: { en: "Create a new version of a prompt agent and read a project connection", fr: "Créer une nouvelle version d'un agent d'invite et lire une connexion du projet" }
    - id: t2
      text: { en: "Call a Claude model deployment through the Messages API", fr: "Appeler un déploiement de modèle Claude via l'API Messages" }
    - id: t3
      text: { en: "Generate embeddings from an existing script that authenticates with the resource API key", fr: "Générer des embeddings depuis un script existant qui s'authentifie avec la clé API de la ressource" }
    - id: t4
      text: { en: "Detect harmful content in images uploaded by users", fr: "Détecter le contenu nuisible dans les images chargées par les utilisateurs" }
answer:
  mapping: { t1: project, t2: anthropic, t3: openai, t4: safety }
explanation:
  correct:
    en: |
      AIProjectClient on the project endpoint exposes the project operations, such as agents and connections. Claude models use the Anthropic SDK on the `/anthropic` endpoint. The `/openai/v1` endpoint serves the OpenAI SDK, including embeddings, and it is the endpoint where API keys work. Content Safety is a Foundry Tool with its own SDK on the `cognitiveservices.azure.com` endpoint. Agent Framework orchestrates agents and isn't needed for these tasks.
    fr: |
      AIProjectClient sur le point de terminaison du projet expose les opérations du projet, comme les agents et les connexions. Les modèles Claude utilisent le SDK Anthropic sur le point de terminaison `/anthropic`. Le point de terminaison `/openai/v1` sert le SDK OpenAI, embeddings compris, et c'est le point de terminaison sur lequel les clés API fonctionnent. Content Safety est un Foundry Tool doté de son propre SDK sur le point de terminaison `cognitiveservices.azure.com`. Agent Framework orchestre des agents et n'est pas nécessaire pour ces tâches.
references:
  - title: Get started with Microsoft Foundry SDKs and endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/develop/sdk-overview
