id: ai103-2a-rag-pipeline
objective: "2.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys is building a RAG application in a Foundry project that answers customer questions from its product guides. The guides are long PDF files. Answers must cite the guide they come from.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys développe dans un projet Foundry une application RAG qui répond aux questions des clients à partir de ses guides produit. Les guides sont de longs fichiers PDF. Les réponses doivent citer le guide dont elles proviennent.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: tune, text: { en: "Fine-tune the chat model on the product guides.", fr: "Affiner le modèle de conversation sur les guides produit." } }
    - { id: embed, text: { en: "Generate an embedding for each chunk with an embedding model.", fr: "Générer un embedding pour chaque bloc avec un modèle d'embedding." } }
    - { id: retrieve, text: { en: "Run a hybrid query with the customer's question to get the most relevant chunks.", fr: "Exécuter une requête hybride avec la question du client pour obtenir les blocs les plus pertinents." } }
    - { id: chunk, text: { en: "Split the guides into chunks and keep the guide title with each chunk.", fr: "Découper les guides en blocs en conservant le titre du guide avec chaque bloc." } }
    - { id: generate, text: { en: "Send the question and the retrieved chunks to the chat model and ask for an answer that cites the guide titles.", fr: "Envoyer la question et les blocs récupérés au modèle de conversation et demander une réponse qui cite les titres des guides." } }
    - { id: translate, text: { en: "Translate the customer's question with Azure Translator.", fr: "Traduire la question du client avec Azure Translator." } }
    - { id: index, text: { en: "Load the chunks, their titles and their vectors into an Azure AI Search index.", fr: "Charger les blocs, leurs titres et leurs vecteurs dans un index Azure AI Search." } }
answer:
  sequence: [ chunk, embed, index, retrieve, generate ]
explanation:
  correct:
    en: |
      Data preparation comes first: chunk the documents (long files exceed the embedding model's input limit), embed each chunk, and index the chunks with a title field for citations. At question time, the application retrieves the relevant chunks, augments the prompt with them and lets the model generate a grounded answer with citations.
    fr: |
      La préparation des données vient en premier : découper les documents (les longs fichiers dépassent la limite d'entrée du modèle d'embedding), générer l'embedding de chaque bloc et indexer les blocs avec un champ titre pour les citations. Au moment de la question, l'application récupère les blocs pertinents, augmente l'invite avec eux et laisse le modèle générer une réponse ancrée avec des citations.
  options:
    tune: { en: "Fine-tuning changes model behavior; it is not how RAG adds knowledge and it gives no citations.", fr: "L'affinage modifie le comportement du modèle ; ce n'est pas ainsi que le RAG ajoute des connaissances, et il ne fournit pas de citations." }
    translate: { en: "Nothing in the scenario requires translation.", fr: "Rien dans le scénario n'exige de traduction." }
references:
  - title: Retrieval augmented generation (RAG) and indexes
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation
