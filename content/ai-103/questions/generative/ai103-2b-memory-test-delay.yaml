id: ai103-2b-memory-test-delay
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has an agent that uses the memory search tool with the default update delay. You are writing an integration test that sends "I prefer aisle seats" in one conversation and, a few seconds later, asks for the usual seat in a new conversation. The second answer doesn't use the preference.

    The production configuration of the agent must not change. You need the test to make the memory available before the second conversation starts.

    What should the test do?
  fr: |
    Tailspin Toys dispose d'un agent qui utilise l'outil de recherche de mémoire avec le délai de mise à jour par défaut. Vous écrivez un test d'intégration qui envoie « I prefer aisle seats » dans une conversation puis, quelques secondes plus tard, demande la place habituelle dans une nouvelle conversation. La deuxième réponse n'utilise pas la préférence.

    La configuration de production de l'agent ne doit pas changer. Vous devez faire en sorte que le test rende la mémoire disponible avant le début de la deuxième conversation.

    Que doit faire le test ?
body:
  options:
    - { id: a, text: { en: "Create the memory store again with default_ttl_seconds set to 0", fr: "Recréer le magasin de mémoire avec default_ttl_seconds défini sur 0" } }
    - { id: b, text: { en: "Send the second question in the first conversation instead of a new one", fr: "Envoyer la deuxième question dans la première conversation au lieu d'une nouvelle" } }
    - { id: c, text: { en: "Create the memory store again with chat_summary_enabled set to False", fr: "Recréer le magasin de mémoire avec chat_summary_enabled défini sur False" } }
    - { id: d, text: { en: "Call begin_update_memories() with the items of the first conversation and update_delay=0, and wait for the result", fr: "Appeler begin_update_memories() avec les éléments de la première conversation et update_delay=0, et attendre le résultat" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      After each response, writes to long-term memory are debounced by `update_delay`, which defaults to 300 seconds of inactivity, so the preference isn't stored yet. Calling the update API with `update_delay=0` triggers extraction and consolidation immediately, and waiting on the poller makes sure the memory exists before the next conversation.
    fr: |
      Après chaque réponse, les écritures dans la mémoire à long terme sont différées par `update_delay`, dont la valeur par défaut est de 300 secondes d'inactivité : la préférence n'est donc pas encore stockée. Appeler l'API de mise à jour avec `update_delay=0` déclenche immédiatement l'extraction et la consolidation, et attendre le résultat de l'opération garantit que la mémoire existe avant la conversation suivante.
  options:
    a: { en: "default_ttl_seconds=0 means that memories never expire; it doesn't speed up their creation.", fr: "default_ttl_seconds=0 signifie que les mémoires n'expirent jamais ; cela n'accélère pas leur création." }
    b: { en: "The same conversation would carry the preference in its history, so the test would no longer verify memory across conversations.", fr: "La même conversation porterait la préférence dans son historique : le test ne vérifierait plus la mémoire d'une conversation à l'autre." }
    c: { en: "Disabling chat summaries removes a memory type; the user profile memory would still wait for the update delay.", fr: "Désactiver les résumés de conversation supprime un type de mémoire ; la mémoire de profil utilisateur attendrait toujours le délai de mise à jour." }
references:
  - title: Create and use memory in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage
