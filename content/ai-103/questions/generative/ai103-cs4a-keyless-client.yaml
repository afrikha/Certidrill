id: ai103-cs4a-keyless-client
objective: "2.1.6"
type: dropdown
caseStudy: ai103-cs4a-southridge
difficulty: 2
status: draft
stem:
  en: |
    You are writing the Python script in job-media that generates teasers by using the OpenAI client library. The job-media managed identity already has the required role on ai-southridge.

    You need to meet the keyless access requirement. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez le script Python de job-media qui génère les bandes-annonces à l'aide de la bibliothèque cliente OpenAI. L'identité managée de job-media dispose déjà du rôle nécessaire sur ai-southridge.

    Vous devez satisfaire l'exigence relative à l'accès sans clé. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from openai import OpenAI
    from azure.identity import ManagedIdentityCredential, get_bearer_token_provider

    token_provider = get_bearer_token_provider(
        ManagedIdentityCredential(), [[scope]])

    client = OpenAI(
        base_url="https://ai-southridge.openai.azure.com/[[path]]",
        [[auth]]=token_provider)

    video = client.videos.create(model="teaser-video", prompt=teaser_prompt)
  slots:
    - id: scope
      options:
        - { id: ai, text: "\"https://ai.azure.com/.default\"" }
        - { id: mgmt, text: "\"https://management.azure.com/.default\"" }
        - { id: storage, text: "\"https://storage.azure.com/.default\"" }
    - id: path
      options:
        - { id: v1, text: "openai/v1/" }
        - { id: deployments, text: "openai/deployments/teaser-video/" }
        - { id: project, text: "api/projects/media-prj/" }
    - id: auth
      options:
        - { id: apikey, text: api_key }
        - { id: adprovider, text: azure_ad_token_provider }
        - { id: headers, text: default_headers }
answer:
  values: { scope: ai, path: v1, auth: apikey }
explanation:
  correct:
    en: |
      The token provider requests Microsoft Entra tokens for the `https://ai.azure.com/.default` scope by using the managed identity, so no key is stored. The `OpenAI` client targets the v1 API of the resource at `/openai/v1/`, where the deployment name is passed as `model`. With the `OpenAI` class, the token provider is passed in the `api_key` parameter, which calls it to get a fresh bearer token.
    fr: |
      Le fournisseur de jetons demande des jetons Microsoft Entra pour l'étendue `https://ai.azure.com/.default` à l'aide de l'identité managée : aucune clé n'est stockée. Le client `OpenAI` cible l'API v1 de la ressource sur `/openai/v1/`, où le nom du déploiement est passé dans `model`. Avec la classe `OpenAI`, le fournisseur de jetons est passé dans le paramètre `api_key`, qui l'appelle pour obtenir un jeton du porteur à jour.
  options:
    mgmt: { en: "The Azure Resource Manager scope is for control-plane operations, not for calling a model deployment.", fr: "L'étendue d'Azure Resource Manager sert aux opérations du plan de contrôle, pas à l'appel d'un déploiement de modèle." }
    storage: { en: "The Storage scope grants tokens for Azure Storage, not for ai-southridge.", fr: "L'étendue de Stockage Azure délivre des jetons pour Stockage Azure, pas pour ai-southridge." }
    deployments: { en: "The deployment-based path belongs to the older versioned API; the v1 API takes the deployment name in the model parameter.", fr: "Le chemin basé sur le déploiement appartient à l'ancienne API versionnée ; l'API v1 prend le nom du déploiement dans le paramètre model." }
    project: { en: "The project endpoint is used by the Foundry project client, not as the base URL of the v1 OpenAI API.", fr: "Le point de terminaison du projet est utilisé par le client de projet Foundry, pas comme URL de base de l'API OpenAI v1." }
    adprovider: { en: "azure_ad_token_provider is a parameter of the AzureOpenAI class, not of the OpenAI class used here.", fr: "azure_ad_token_provider est un paramètre de la classe AzureOpenAI, pas de la classe OpenAI utilisée ici." }
    headers: { en: "default_headers expects a dictionary of static headers, not a token provider function.", fr: "default_headers attend un dictionnaire d'en-têtes statiques, pas une fonction de fournisseur de jetons." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models v1 API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/api-version-lifecycle
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
