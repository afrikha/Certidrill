id: ai103-2b-include-credentials
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Foundry project that contains a custom keys connection named weather-api. The connection stores the API key of a third-party weather service. A Python application, which already has an authenticated `AIProjectClient` named `project`, calls the weather service directly from its own code.

    The application must read the key from the connection at run time instead of storing the key in its configuration.

    Which call should the application make?
  fr: |
    Northwind Traders dispose d'un projet Foundry qui contient une connexion de clés personnalisées nommée weather-api. La connexion stocke la clé API d'un service météo tiers. Une application Python, qui dispose déjà d'un `AIProjectClient` authentifié nommé `project`, appelle le service météo directement depuis son propre code.

    L'application doit lire la clé dans la connexion au moment de l'exécution au lieu de stocker la clé dans sa configuration.

    Quel appel l'application doit-elle effectuer ?
body:
  options:
    - { id: a, text: 'project.connections.get("weather-api")' }
    - { id: b, text: 'project.connections.get_default("CustomKeys")' }
    - { id: c, text: 'project.connections.get("weather-api", include_credentials=True)' }
    - { id: d, text: 'project.connections.list(connection_type="CustomKeys")' }
answer: { optionId: c }
explanation:
  correct:
    en: |
      `connections.get()` returns the connection by name, and its keyword-only parameter `include_credentials` defaults to `False`. Setting it to `True` returns the stored credentials with the connection, so the key never appears in the code or the configuration of the application.
    fr: |
      `connections.get()` renvoie la connexion par son nom, et son paramètre nommé `include_credentials` a la valeur `False` par défaut. Avec la valeur `True`, les informations d'identification stockées sont renvoyées avec la connexion : la clé n'apparaît jamais dans le code ni dans la configuration de l'application.
  options:
    a: { en: "Without include_credentials=True, get() returns the connection without its credentials.", fr: "Sans include_credentials=True, get() renvoie la connexion sans ses informations d'identification." }
    b: { en: "get_default() returns the default connection of a type, not the connection named weather-api, and it also omits credentials by default.", fr: "get_default() renvoie la connexion par défaut d'un type, pas la connexion nommée weather-api, et omet elle aussi les informations d'identification par défaut." }
    d: { en: "list() filters connections by type but has no include_credentials parameter, so it doesn't return the key.", fr: "list() filtre les connexions par type mais n'a pas de paramètre include_credentials : elle ne renvoie pas la clé." }
references:
  - title: azure.ai.projects.operations.ConnectionsOperations class
    url: https://learn.microsoft.com/en-us/python/api/azure-ai-projects/azure.ai.projects.operations.connectionsoperations
  - title: Add a new connection to your project
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/how-to/connections-add
