id: ai103-3b-alttext-rules
objective: "3.2.4"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a learning portal. A Python app sends each course image to a vision-enabled chat model and asks for alt text. You are writing the instructions of the model so that the alt text follows the Microsoft accessibility guidance.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un portail de formation. Une application Python envoie chaque image de cours à un modèle de conversation compatible vision et demande un texte de remplacement. Vous rédigez les instructions du modèle pour que le texte de remplacement respecte les recommandations d'accessibilité de Microsoft.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When an image contains text that the surrounding page doesn't include, the alt text should include that text.
        fr: Quand une image contient du texte que la page environnante n'inclut pas, le texte de remplacement doit inclure ce texte.
    - id: s2
      text:
        en: The alt text of a search button that shows only a magnifying glass icon should describe the appearance of the icon.
        fr: Le texte de remplacement d'un bouton de recherche qui n'affiche qu'une icône de loupe doit décrire l'apparence de l'icône.
    - id: s3
      text:
        en: The thumbnail image of a course video needs alt text even when the video has closed captions.
        fr: La miniature d'une vidéo de cours a besoin d'un texte de remplacement même lorsque la vidéo comporte des sous-titres.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Embedded text goes into the alt text when the surrounding content doesn't already provide it. For a button or link that has only an image, the alt text describes what the control does ("Search this site."), not what the image looks like. Video content needs closed captions and audio descriptions, and a video thumbnail still needs its own alt text.
    fr: |
      Le texte incorporé figure dans le texte de remplacement quand le contenu environnant ne le fournit pas déjà. Pour un bouton ou un lien qui n'a qu'une image, le texte de remplacement décrit ce que fait le contrôle (« Search this site. »), pas l'apparence de l'image. Le contenu vidéo demande des sous-titres et des descriptions audio, et la miniature d'une vidéo a quand même besoin de son propre texte de remplacement.
references:
  - title: Alternative text (alt text)
    url: https://learn.microsoft.com/en-us/style-guide/accessibility/alternative-text
  - title: Graphics, Design, and Media
    url: https://learn.microsoft.com/en-us/style-guide/accessibility/graphics-design-media
