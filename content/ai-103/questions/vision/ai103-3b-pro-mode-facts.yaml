id: ai103-3b-pro-mode-facts
objective: "3.2.7"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware is comparing the standard mode and the pro mode of Azure Content Understanding before it designs its analysis pipelines.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware compare le mode standard et le mode pro d'Azure Content Understanding avant de concevoir ses pipelines d'analyse.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: An analyzer for which no mode is chosen runs in standard mode.
        fr: Un analyseur pour lequel aucun mode n'est choisi s'exécute en mode standard.
    - id: s2
      text:
        en: Pro mode can use an external knowledge base to validate the values that it outputs.
        fr: Le mode pro peut utiliser une base de connaissances externe pour valider les valeurs qu'il produit.
    - id: s3
      text:
        en: Pro mode can analyze a set of warehouse photos together to find differences between them.
        fr: Le mode pro peut analyser ensemble un lot de photos d'entrepôt pour trouver les différences entre elles.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Standard is the default mode of every analyzer. Pro mode adds reasoning, multiple input documents and an external knowledge base for linking, enrichment and validation. Pro mode is limited to documents as inputs, so it doesn't process sets of photos; for images, use single-task analyzers and compare the results in the application.
    fr: |
      Standard est le mode par défaut de tout analyseur. Le mode pro ajoute le raisonnement, plusieurs documents d'entrée et une base de connaissances externe pour la liaison, l'enrichissement et la validation. Le mode pro est limité aux documents en entrée : il ne traite pas de lots de photos ; pour les images, utilisez des analyseurs à tâche unique et comparez les résultats dans l'application.
references:
  - title: What's new in Content Understanding?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/whats-new
