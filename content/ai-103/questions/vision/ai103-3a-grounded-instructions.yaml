id: ai103-3a-grounded-instructions
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Energy field technicians photograph pressure gauges and ask a vision-enabled model deployment questions such as "What is the pressure on gauge 3?". When a gauge is blurred or outside the photo, the model sometimes returns a plausible value that isn't visible. Every answer must come only from what the photos show, and the technicians must know when a reading can't be determined.

    What should you do?
  fr: |
    Les techniciens de terrain d'Adatum Energy photographient des manomètres et posent à un déploiement de modèle compatible avec la vision des questions comme « Quelle est la pression sur le manomètre 3 ? ». Quand un manomètre est flou ou hors de la photo, le modèle renvoie parfois une valeur plausible qui n'est pas visible. Chaque réponse doit provenir uniquement de ce que montrent les photos, et les techniciens doivent savoir quand une valeur ne peut pas être déterminée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Set `temperature` to 0 and ask the model to be as accurate as possible"
        fr: "Définir `temperature` sur 0 et demander au modèle d'être aussi précis que possible"
    - id: d
      text:
        en: "Instruct the model to answer only from the photos, cite where it sees each value, and say when it can't tell"
        fr: "Demander au modèle de répondre uniquement à partir des photos, d'indiquer où il voit chaque valeur et de dire quand il ne peut pas conclure"
    - id: c
      text:
        en: "Add the gauge manufacturer's datasheet to the prompt so that the model knows the typical pressure ranges"
        fr: "Ajouter la fiche technique du fabricant des manomètres à l'invite pour que le modèle connaisse les plages de pression habituelles"
    - id: b
      text:
        en: "Set `detail` to `low` so that the model focuses on the main gauge in each photo"
        fr: "Définir `detail` sur `low` pour que le modèle se concentre sur le manomètre principal de chaque photo"
answer: { optionId: d }
explanation:
  correct:
    en: |
      A grounded visual answer comes from restricting the source to the image, asking the model to point to the visual evidence, and explicitly allowing an answer such as "can't be determined from the image". These instructions remove the incentive to fill gaps with plausible values.
    fr: |
      Une réponse visuelle ancrée s'obtient en limitant la source à l'image, en demandant au modèle de désigner la preuve visuelle et en autorisant explicitement une réponse comme « impossible à déterminer à partir de l'image ». Ces instructions retirent au modèle la tentation de combler les manques par des valeurs plausibles.
  options:
    a: { en: "A lower temperature reduces randomness but doesn't stop the model from inventing a value that isn't visible.", fr: "Une température plus basse réduit le caractère aléatoire mais n'empêche pas le modèle d'inventer une valeur qui n'est pas visible." }
    c: { en: "Typical ranges make plausible guesses easier, which is the opposite of answering only from the photo.", fr: "Les plages habituelles facilitent les suppositions plausibles, ce qui est le contraire d'une réponse fondée uniquement sur la photo." }
    b: { en: "Low detail processes a smaller version of the image and can miss fine details such as gauge readings.", fr: "Le détail faible traite une version réduite de l'image et peut manquer des détails fins comme la lecture d'un manomètre." }
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
