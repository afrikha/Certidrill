id: ai103-sr1-background-edit-2
objective: "3.1.3"
type: series_yesno
series: ai103-sr1-background-edit
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You call the edits endpoint with a mask in which the background pixels are transparent.
  fr: Vous appelez le point de terminaison edits avec un masque dont les pixels d'arrière-plan sont transparents.
body:
  solution:
    en: |
      For each photo, the script builds a 1024x1024 PNG mask from the segmentation: background pixels are fully transparent (alpha = 0) and product pixels are opaque. It sends the photo as `image`, the mask as `mask`, and a prompt that describes the snowy chalet interior to the **images/edits** endpoint of img1.
    fr: |
      Pour chaque photo, le script crée à partir de la segmentation un masque PNG de 1024x1024 : les pixels d'arrière-plan sont entièrement transparents (alpha = 0) et les pixels du produit sont opaques. Il envoie la photo comme `image`, le masque comme `mask` et une invite qui décrit l'intérieur du chalet enneigé au point de terminaison **images/edits** d'img1.
answer: { value: true }
explanation:
  correct:
    en: The edits endpoint starts from the input image, and the fully transparent areas of the mask mark the region to edit. The mask is a PNG with the same dimensions as the photo, so only the background is targeted and the opaque product area is left out of the edit.
    fr: "Le point de terminaison edits part de l'image d'entrée, et les zones entièrement transparentes du masque indiquent la région à modifier. Le masque est un PNG de mêmes dimensions que la photo : seul l'arrière-plan est ciblé et la zone opaque du produit est exclue de la modification."
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
