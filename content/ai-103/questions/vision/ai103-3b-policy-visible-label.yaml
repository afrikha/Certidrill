id: ai103-3b-policy-visible-label
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam generates product illustrations with a GPT-image-1 series model in Microsoft Foundry. A new company policy requires every published illustration to show a visible "AI-generated" mark in its lower-right corner.

    What should you do?
  fr: |
    Fabrikam génère des illustrations de produits avec un modèle de la série GPT-image-1 dans Microsoft Foundry. Une nouvelle stratégie de l'entreprise exige que chaque illustration publiée affiche une mention visible « AI-generated » dans son coin inférieur droit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Rely on the Content Credentials that are attached automatically to each generated image"
        fr: "S'appuyer sur les Content Credentials attachés automatiquement à chaque image générée"
    - id: b
      text:
        en: "Add the mark to each image in the application after generation and before publishing"
        fr: "Ajouter la mention à chaque image dans l'application après la génération et avant la publication"
    - id: c
      text:
        en: "Configure a guardrail on the deployment that annotates each generated image"
        fr: "Configurer sur le déploiement un garde-fou qui annote chaque image générée"
    - id: d
      text:
        en: "Use Content Safety Analyze Image to flag each generated image before publishing"
        fr: "Utiliser Analyze Image de Content Safety pour signaler chaque image générée avant la publication"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Azure OpenAI attaches Content Credentials to generated images as a signed C2PA manifest, which is metadata, not a visible mark. A visible label isn't a platform setting, so the application stamps it onto each image before it publishes the image.
    fr: |
      Azure OpenAI attache aux images générées des Content Credentials sous forme de manifeste C2PA signé, c'est-à-dire des métadonnées, pas une mention visible. Une mention visible n'est pas un paramètre de la plateforme : l'application l'appose donc sur chaque image avant de la publier.
  options:
    a:
      en: |
        Content Credentials disclose the origin in a manifest attached to the file; viewers don't see them in the image itself.
      fr: |
        Les Content Credentials indiquent la provenance dans un manifeste attaché au fichier ; les lecteurs ne les voient pas dans l'image elle-même.
    c:
      en: |
        Guardrail annotations are detection results returned to the caller; they don't change the pixels of the image.
      fr: |
        Les annotations des garde-fous sont des résultats de détection renvoyés à l'appelant ; elles ne modifient pas les pixels de l'image.
    d:
      en: |
        Analyze Image rates harmful content; it doesn't mark images as AI-generated.
      fr: |
        Analyze Image évalue le contenu préjudiciable ; il ne marque pas les images comme générées par l'IA.
references:
  - title: Content Credentials in Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials
