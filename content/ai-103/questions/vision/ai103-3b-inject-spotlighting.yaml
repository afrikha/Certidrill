id: ai103-3b-inject-spotlighting
objective: "3.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam sends text extracted from scanned images to a model deployment in Microsoft Foundry as documents. You plan to enable document attack detection in the guardrail of the deployment and you are evaluating spotlighting.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam envoie le texte extrait d'images numérisées à un déploiement de modèle dans Microsoft Foundry sous forme de documents. Vous prévoyez d'activer la détection des attaques par document dans le garde-fou du déploiement et vous évaluez le spotlighting.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Spotlighting is turned on automatically when you enable document attack detection.
        fr: Le spotlighting s'active automatiquement quand vous activez la détection des attaques par document.
    - id: s2
      text:
        en: Spotlighting is available only for models that are used through the Chat Completions API.
        fr: Le spotlighting n'est disponible que pour les modèles utilisés via l'API Chat Completions.
    - id: s3
      text:
        en: Spotlighting increases the number of tokens of the documents.
        fr: Le spotlighting augmente le nombre de jetons des documents.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Spotlighting is a preview feature that is off by default; you enable it with the Spotlighting toggle of the document attack control or `"spotlighting_enabled": true`. It base-64 encodes document content so that the model treats it as less trustworthy than the user and system prompts. It's available only for models used through the Chat Completions API, and it increases the document token count, which can raise costs.
    fr: |
      Le spotlighting est une fonctionnalité en préversion, désactivée par défaut ; vous l'activez avec le bouton Spotlighting du contrôle des attaques par document ou avec `"spotlighting_enabled": true`. Il encode le contenu des documents en base-64 pour que le modèle le considère comme moins fiable que les invites de l'utilisateur et du système. Il n'est disponible que pour les modèles utilisés via l'API Chat Completions, et il augmente le nombre de jetons des documents, ce qui peut augmenter les coûts.
references:
  - title: Prompt Shields in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
