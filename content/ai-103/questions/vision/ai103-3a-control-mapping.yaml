id: ai103-3a-control-mapping
objective: "3.1.5"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. builds a design tool on a `gpt-image-1` deployment. The product owner lists four requirements for the image generation requests.

    Which request parameter should you set for each requirement? To answer, drag the appropriate parameters to the correct requirements. Each parameter may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. crée un outil de conception sur un déploiement `gpt-image-1`. Le responsable produit liste quatre exigences pour les requêtes de génération d'images.

    Quel paramètre de requête devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les paramètres appropriés vers les exigences correspondantes. Chaque paramètre peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: background, text: background }
    - { id: partial, text: partial_images }
    - { id: compression, text: output_compression }
    - { id: n, text: n }
    - { id: quality, text: quality }
    - { id: fidelity, text: input_fidelity }
  targets:
    - { id: t1, text: { en: "Stickers must blend into any page color", fr: "Les autocollants doivent se fondre dans n'importe quelle couleur de page" } }
    - { id: t2, text: { en: "Users must see the image take shape while it is generated", fr: "Les utilisateurs doivent voir l'image prendre forme pendant sa génération" } }
    - { id: t3, text: { en: "JPEG thumbnails must be as small as possible", fr: "Les miniatures JPEG doivent être aussi légères que possible" } }
    - { id: t4, text: { en: "Each request must return four options to choose from", fr: "Chaque requête doit renvoyer quatre propositions au choix" } }
answer:
  mapping: { t1: background, t2: partial, t3: compression, t4: n }
explanation:
  correct:
    en: |
      `background` set to `transparent`, with PNG output, produces a transparent background. `partial_images` (with `stream` set to `true`) returns progressive previews while the image renders. `output_compression` (0 to 100) sets the compression level of JPEG output. `n` sets the number of images per request, from 1 to 10.
    fr: |
      `background` défini sur `transparent`, avec une sortie PNG, produit un arrière-plan transparent. `partial_images` (avec `stream` défini sur `true`) renvoie des aperçus progressifs pendant le rendu de l'image. `output_compression` (0 à 100) définit le niveau de compression de la sortie JPEG. `n` définit le nombre d'images par requête, de 1 à 10.
  options:
    quality: { en: "Quality trades detail for latency and cost; it isn't the setting that controls JPEG compression or the number of images.", fr: "La qualité arbitre entre le détail, la latence et le coût ; ce n'est pas le réglage qui contrôle la compression JPEG ou le nombre d'images." }
    fidelity: { en: "`input_fidelity` applies to edits and controls how closely input images, especially faces, are kept.", fr: "`input_fidelity` s'applique aux modifications et contrôle à quel point les images d'entrée, en particulier les visages, sont respectées." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
