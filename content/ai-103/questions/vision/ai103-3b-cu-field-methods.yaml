id: ai103-3b-cu-field-methods
objective: "3.2.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is creating a custom analyzer in Azure Content Understanding. The analyzer uses `prebuilt-image` as its base analyzer and processes photos of loading docks. The field schema contains the fields shown in the answer area.

    Which method should you set for each field? To answer, drag the appropriate methods to the correct fields. Each method may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders crée un analyseur personnalisé dans Azure Content Understanding. L'analyseur utilise `prebuilt-image` comme analyseur de base et traite des photos de quais de chargement. Le schéma de champs contient les champs indiqués dans la zone de réponse.

    Quelle méthode devez-vous définir pour chaque champ ? Pour répondre, faites glisser les méthodes appropriées vers les champs correspondants. Chaque méthode peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: generate, text: generate }
    - { id: classify, text: classify }
    - { id: extract, text: extract }
  targets:
    - id: count
      text: { en: "palletCount (number): number of pallets visible on the dock", fr: "palletCount (number) : nombre de palettes visibles sur le quai" }
    - id: state
      text: { en: "dockState (string): Clear, PartiallyBlocked or Blocked", fr: "dockState (string) : Clear, PartiallyBlocked ou Blocked" }
    - id: summary
      text: { en: "sceneSummary (string): one sentence that describes the activity on the dock", fr: "sceneSummary (string) : une phrase qui décrit l'activité sur le quai" }
    - id: vest
      text: { en: "driverVest (string): Worn, NotWorn or NotVisible for the forklift driver", fr: "driverVest (string) : Worn, NotWorn ou NotVisible pour le conducteur du chariot élévateur" }
answer:
  mapping: { count: generate, state: classify, summary: generate, vest: classify }
explanation:
  correct:
    en: |
      `generate` produces values that require inference or summarization, such as a count or a description of the scene. `classify` picks one value from a fixed set listed in `enum`, such as the dock state or whether the vest is worn. `extract` returns values as they appear in the content and is supported only by document analyzers, so it's never used in an image analyzer.
    fr: |
      `generate` produit des valeurs qui demandent une inférence ou une synthèse, comme un nombre ou une description de la scène. `classify` choisit une valeur dans un ensemble fixe indiqué dans `enum`, comme l'état du quai ou le port du gilet. `extract` renvoie les valeurs telles qu'elles apparaissent dans le contenu et n'est pris en charge que par les analyseurs de documents : il n'est donc jamais utilisé dans un analyseur d'images.
references:
  - title: Best practices for using Content Understanding
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
