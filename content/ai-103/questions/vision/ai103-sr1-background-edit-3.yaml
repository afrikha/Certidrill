id: ai103-sr1-background-edit-3
objective: "3.1.3"
type: series_yesno
series: ai103-sr1-background-edit
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You call the edits endpoint with a mask in which the product pixels are transparent.
  fr: Vous appelez le point de terminaison edits avec un masque dont les pixels du produit sont transparents.
body:
  solution:
    en: |
      For each photo, the script builds a 1024x1024 PNG mask from the segmentation: product pixels are fully transparent (alpha = 0) and background pixels are opaque. It sends the photo as `image`, the mask as `mask`, and a prompt that describes the snowy chalet interior to the **images/edits** endpoint of img1.
    fr: |
      Pour chaque photo, le script crée à partir de la segmentation un masque PNG de 1024x1024 : les pixels du produit sont entièrement transparents (alpha = 0) et les pixels d'arrière-plan sont opaques. Il envoie la photo comme `image`, le masque comme `mask` et une invite qui décrit l'intérieur du chalet enneigé au point de terminaison **images/edits** d'img1.
answer: { value: false }
explanation:
  correct:
    en: The fully transparent pixels of the mask mark the areas to edit. This mask is inverted, so the edit targets the product and leaves the background as it is, the opposite of the requirement.
    fr: "Les pixels entièrement transparents du masque indiquent les zones à modifier. Ce masque est inversé : la modification cible le produit et laisse l'arrière-plan inchangé, soit l'inverse de l'exigence."
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
