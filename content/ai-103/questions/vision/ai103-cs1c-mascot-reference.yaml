id: ai103-cs1c-mascot-reference
objective: "3.1.1"
type: single
caseStudy: ai103-cs1c-margiestravel
difficulty: 2
status: draft
stem:
  en: |
    An illustrator needs a new scene in which Pip skis down a snowy slope. You need to meet the illustrations requirement. What should the illustrator send to the illustrations deployment?
  fr: |
    Un illustrateur a besoin d'une nouvelle scène dans laquelle Pip descend une piste enneigée à skis. Vous devez satisfaire l'exigence relative aux illustrations. Que doit envoyer l'illustrateur au déploiement illustrations ?
body:
  options:
    - { id: a, text: { en: "An image generation request with a detailed text description of Pip and of the new scene", fr: "Une requête de génération d'image avec une description textuelle détaillée de Pip et de la nouvelle scène" } }
    - { id: b, text: { en: "An image edit request with one reference drawing and a PNG mask whose background pixels are fully transparent", fr: "Une requête de modification d'image avec un dessin de référence et un masque PNG dont les pixels de l'arrière-plan sont entièrement transparents" } }
    - { id: c, text: { en: "An image edit request with the three reference drawings as input images and a prompt that describes the new scene", fr: "Une requête de modification d'image avec les trois dessins de référence comme images d'entrée et une invite qui décrit la nouvelle scène" } }
    - { id: d, text: { en: "An image generation request with a description of the new scene and the n parameter set to 10", fr: "Une requête de génération d'image avec une description de la nouvelle scène et le paramètre n défini sur 10" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The image edit endpoint of GPT-image models accepts up to 16 input images (PNG or JPG, each under 50 MB) with a prompt. Passing the approved drawings as reference media lets the model keep Pip's appearance while the prompt describes a new scene.
    fr: |
      Le point de terminaison de modification d'image des modèles GPT-image accepte jusqu'à 16 images d'entrée (PNG ou JPG, de moins de 50 Mo chacune) avec une invite. Fournir les dessins approuvés comme médias de référence permet au modèle de conserver l'apparence de Pip pendant que l'invite décrit une nouvelle scène.
  options:
    a:
      en: |
        A generation request takes only a text prompt, so the model has no reference for Pip's approved appearance.
      fr: |
        Une requête de génération ne prend qu'une invite textuelle : le modèle n'a donc aucune référence de l'apparence approuvée de Pip.
    b:
      en: |
        A mask limits the change to the transparent area of one existing drawing; it replaces a background instead of creating a new scene.
      fr: |
        Un masque limite la modification à la zone transparente d'un dessin existant ; il remplace un arrière-plan au lieu de créer une nouvelle scène.
    d:
      en: |
        Generating 10 images from text gives more variations, but none of them is based on the reference drawings.
      fr: |
        Générer 10 images à partir de texte donne plus de variantes, mais aucune ne s'appuie sur les dessins de référence.
references:
  - title: Azure OpenAI image generation models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
