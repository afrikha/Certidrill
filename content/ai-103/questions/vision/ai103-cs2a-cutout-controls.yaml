id: ai103-cs2a-cutout-controls
objective: "3.1.5"
type: single
caseStudy: ai103-cs2a-tailwind-traders
difficulty: 1
status: draft
stem:
  en: |
    You need to configure the requests that Catalog Studio sends to img-catalog for the quick view images. Which parameters should you include in each image generation request?
  fr: |
    Vous devez configurer les requêtes que Catalog Studio envoie à img-catalog pour les images d'aperçu rapide. Quels paramètres devez-vous inclure dans chaque requête de génération d'images ?
body:
  options:
    - { id: a, text: 'n=4, background="transparent", output_format="jpeg"' }
    - { id: b, text: 'n=1, background="transparent", output_format="png"' }
    - { id: c, text: 'n=4, background="transparent", output_format="png"' }
    - { id: d, text: 'n=4, background="auto", output_format="webp"' }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `n` parameter returns between 1 and 10 images per request, so `n=4` returns the four variants in one request. With gpt-image-1, a transparent background requires `background` set to `transparent` and `output_format` set to `png`.
    fr: |
      Le paramètre `n` renvoie entre 1 et 10 images par requête : `n=4` renvoie donc les quatre variantes en une seule requête. Avec gpt-image-1, un arrière-plan transparent exige `background` défini sur `transparent` et `output_format` défini sur `png`.
  options:
    a:
      en: |
        JPEG has no transparency channel; a transparent background requires PNG output.
      fr: |
        Le format JPEG n'a pas de canal de transparence ; un arrière-plan transparent exige une sortie PNG.
    b:
      en: |
        With `n=1`, each request returns a single image instead of the four variants that the requirement asks for.
      fr: |
        Avec `n=1`, chaque requête renvoie une seule image au lieu des quatre variantes demandées par l'exigence.
    d:
      en: |
        WebP isn't a supported output format, and `auto` lets the model choose the background instead of forcing a transparent one.
      fr: |
        WebP n'est pas un format de sortie pris en charge, et `auto` laisse le modèle choisir l'arrière-plan au lieu d'imposer un arrière-plan transparent.
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
