id: ai103-3b-cu-routing
objective: "3.2.7"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders scans its incoming mail into PDF files. A single PDF file can contain several invoices followed by other letters. You are writing an Azure Content Understanding analyzer that must split each file into its separate documents and send every invoice to the `prebuilt-invoice` analyzer in the same analysis request. Other documents must not be forced into the invoice category.

    How should you complete the definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders numérise son courrier entrant en fichiers PDF. Un même fichier PDF peut contenir plusieurs factures suivies d'autres lettres. Vous rédigez un analyseur Azure Content Understanding qui doit découper chaque fichier en ses différents documents et envoyer chaque facture à l'analyseur `prebuilt-invoice` dans la même requête d'analyse. Les autres documents ne doivent pas être forcés dans la catégorie des factures.

    Comment devez-vous compléter la définition ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "analyzerId": "mailRouter",
      "baseAnalyzerId": "prebuilt-document",
      "config": {
        "enableSegment": [[seg]],
        [[cats]]: {
          "invoice": {
            "description": "A supplier invoice with an invoice number and a total",
            [[route]]: "prebuilt-invoice"
          },
          "other": {
            "description": "Any document that is not an invoice"
          }
        }
      },
      "models": { "completion": "gpt-5.2" }
    }
  slots:
    - id: seg
      options:
        - { id: "on", text: "true" }
        - { id: "off", text: "false" }
    - id: cats
      options:
        - { id: cc, text: "\"contentCategories\"" }
        - { id: fs, text: "\"fieldSchema\"" }
        - { id: segs, text: "\"segments\"" }
    - id: route
      options:
        - { id: aid, text: "\"analyzerId\"" }
        - { id: base, text: "\"baseAnalyzerId\"" }
        - { id: method, text: "\"method\"" }
answer:
  values: { seg: "on", cats: cc, route: aid }
explanation:
  correct:
    en: |
      With `enableSegment` set to `true`, the analyzer splits the content according to `contentCategories` and returns a `segments` array; with `false`, each file is classified as a whole. Each category has a `description` and an optional `analyzerId` that routes the segment to another analyzer, here `prebuilt-invoice`. The "other" category keeps non-invoices out of the invoice category: without it, content is forced into one of the listed categories.
    fr: |
      Avec `enableSegment` défini sur `true`, l'analyseur découpe le contenu selon `contentCategories` et renvoie un tableau `segments` ; avec `false`, chaque fichier est classé dans son ensemble. Chaque catégorie possède une `description` et un `analyzerId` facultatif qui route le segment vers un autre analyseur, ici `prebuilt-invoice`. La catégorie « other » évite que les autres documents se retrouvent dans la catégorie des factures : sans elle, le contenu est forcé dans l'une des catégories listées.
  options:
    "off": { en: "Without segmentation, a file that contains several documents is classified as one item.", fr: "Sans segmentation, un fichier qui contient plusieurs documents est classé comme un seul élément." }
    fs: { en: "fieldSchema defines the fields to extract, not the categories used for routing.", fr: "fieldSchema définit les champs à extraire, pas les catégories utilisées pour le routage." }
    segs: { en: "segments is the array returned in the result, not a configuration property.", fr: "segments est le tableau renvoyé dans le résultat, pas une propriété de configuration." }
    base: { en: "baseAnalyzerId sets the parent of a custom analyzer; a category routes with analyzerId.", fr: "baseAnalyzerId définit le parent d'un analyseur personnalisé ; une catégorie route avec analyzerId." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
