id: ai103-3a-face-fidelity
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Studios offers an app that changes the clothing in portrait photos of its customers, who gave their consent. The app sends each photo and a prompt such as "Change the jacket to dark green" to the edits operation of a `gpt-image-1-mini` deployment. Customers complain that their faces are no longer recognizable after the edit. The access request of Wingtip Studios for the GPT-image-1 series is already approved.

    You need the edited photos to preserve the faces of the customers. What should you do?
  fr: |
    Wingtip Studios propose une application qui modifie les vêtements sur les photos portrait de ses clients, qui ont donné leur consentement. L'application envoie chaque photo et une invite comme « Change the jacket to dark green » à l'opération de modification d'un déploiement `gpt-image-1-mini`. Les clients se plaignent que leur visage n'est plus reconnaissable après la modification. La demande d'accès de Wingtip Studios à la série GPT-image-1 est déjà approuvée.

    Vous devez faire en sorte que les photos modifiées préservent le visage des clients. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Keep the `gpt-image-1-mini` deployment and set `input_fidelity` to high in each edit request"
        fr: "Conserver le déploiement `gpt-image-1-mini` et définir `input_fidelity` sur une valeur élevée dans chaque requête de modification"
    - id: b
      text:
        en: "Deploy `gpt-image-1.5` and set `input_fidelity` to high in each edit request"
        fr: "Déployer `gpt-image-1.5` et définir `input_fidelity` sur une valeur élevée dans chaque requête de modification"
    - id: c
      text:
        en: "Keep the `gpt-image-1-mini` deployment and set `quality` to `high` in each edit request"
        fr: "Conserver le déploiement `gpt-image-1-mini` et définir `quality` sur `high` dans chaque requête de modification"
    - id: d
      text:
        en: "Deploy `gpt-image-1.5` and call the generations operation with a prompt that describes the customer"
        fr: "Déployer `gpt-image-1.5` et appeler l'opération de génération avec une invite qui décrit le client"
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `input_fidelity` parameter controls how closely the output matches the style and features of the input images, especially faces; high input fidelity preserves faces more accurately. `gpt-image-1-mini` doesn't support this parameter, so the app needs another GPT-image model such as `gpt-image-1.5`, for which access is already approved.
    fr: |
      Le paramètre `input_fidelity` contrôle à quel point la sortie respecte le style et les caractéristiques des images d'entrée, en particulier les visages ; une fidélité d'entrée élevée préserve plus précisément les visages. `gpt-image-1-mini` ne prend pas en charge ce paramètre : l'application a besoin d'un autre modèle GPT-image, comme `gpt-image-1.5`, dont l'accès est déjà approuvé.
  options:
    a: { en: "`gpt-image-1-mini` doesn't support `input_fidelity`.", fr: "`gpt-image-1-mini` ne prend pas en charge `input_fidelity`." }
    c: { en: "Quality changes the level of detail, latency and cost, not how faithfully the input face is kept.", fr: "La qualité change le niveau de détail, la latence et le coût, pas la fidélité au visage d'entrée." }
    d: { en: "A generation doesn't take the photo as input, so it can't keep the customer's real face.", fr: "Une génération ne prend pas la photo en entrée : elle ne peut pas conserver le vrai visage du client." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
