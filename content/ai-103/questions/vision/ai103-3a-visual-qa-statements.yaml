id: ai103-3a-visual-qa-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam Manufacturing builds a question-answering app for maintenance staff. The staff ask questions about photos of machine nameplates, and the answers often depend on small serial numbers printed on the plates. The app calls an o-series reasoning model deployment by using the Chat Completions API.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Manufacturing crée une application de questions-réponses pour le personnel de maintenance. Le personnel pose des questions sur des photos de plaques signalétiques de machines, et les réponses dépendent souvent de petits numéros de série imprimés sur les plaques. L'application appelle un déploiement de modèle de raisonnement de la série o à l'aide de l'API Chat Completions.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "With `detail` set to `high`, the model also examines detailed 512x512 segments of each photo, which uses more tokens."
        fr: "Avec `detail` défini sur `high`, le modèle examine aussi des segments détaillés de 512x512 de chaque photo, ce qui consomme plus de jetons."
    - id: s2
      text:
        en: "Each photo is sent in a content part of type `input_image`."
        fr: "Chaque photo est envoyée dans une partie de contenu de type `input_image`."
    - id: s3
      text:
        en: "The length of the answer is limited by setting `max_tokens` in the request."
        fr: "La longueur de la réponse se limite en définissant `max_tokens` dans la requête."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      In high-resolution mode, the model views the low-resolution image and then detailed 512x512 segments, each segment using more tokens; this helps with small text such as serial numbers. The Chat Completions API takes images as content parts of type `image_url`; `input_image` is the Responses API type. For o-series reasoning models, you use `max_completion_tokens` instead of `max_tokens`.
    fr: |
      En mode haute résolution, le modèle voit l'image basse résolution puis des segments détaillés de 512x512, chaque segment consommant davantage de jetons ; cela aide pour le petit texte comme les numéros de série. L'API Chat Completions prend les images sous forme de parties de contenu de type `image_url` ; `input_image` est le type de l'API Responses. Pour les modèles de raisonnement de la série o, on utilise `max_completion_tokens` au lieu de `max_tokens`.
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
