id: ai103-3a-responses-image-code
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Retail has a vision-enabled model deployment named `shelf-vision`. You are writing Python code that uses the Responses API to ask whether a photo of a store shelf shows empty spaces. The `client` variable is an `OpenAI` client for the v1 API, and `b64_photo` contains the base64-encoded JPEG photo.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Retail dispose d'un déploiement de modèle compatible avec la vision nommé `shelf-vision`. Vous écrivez du code Python qui utilise l'API Responses pour demander si la photo d'un rayon de magasin montre des emplacements vides. La variable `client` est un client `OpenAI` pour l'API v1, et `b64_photo` contient la photo JPEG encodée en base64.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = client.responses.create(
        model="shelf-vision",
        input=[{
            "role": "user",
            "content": [
                {"type": [[t1]], "text": "Does this shelf have empty spaces? Answer yes or no."},
                {"type": [[t2]], "image_url": f"data:image/jpeg;base64,{b64_photo}"},
            ],
        }],
    )
    print(response.[[out]])
  slots:
    - id: t1
      options:
        - { id: input_text, text: "\"input_text\"" }
        - { id: text, text: "\"text\"" }
        - { id: outtext, text: "\"output_text\"" }
    - id: t2
      options:
        - { id: input_image, text: "\"input_image\"" }
        - { id: image_url, text: "\"image_url\"" }
        - { id: input_file, text: "\"input_file\"" }
    - id: out
      options:
        - { id: output_text, text: output_text }
        - { id: choices, text: "choices[0].message.content" }
        - { id: output_parsed, text: output_parsed }
answer:
  values: { t1: input_text, t2: input_image, out: output_text }
explanation:
  correct:
    en: |
      In the Responses API, the prompt is a content part of type `input_text` and the image a content part of type `input_image`, whose `image_url` can be a URL or a base64 data URL. The text of the answer is read from `response.output_text`.
    fr: |
      Dans l'API Responses, l'invite est une partie de contenu de type `input_text` et l'image une partie de contenu de type `input_image`, dont `image_url` peut être une URL ou une URL de données base64. Le texte de la réponse se lit dans `response.output_text`.
  options:
    outtext: { en: "`output_text` is a type of the model's output, not of the user input.", fr: "`output_text` est un type de la sortie du modèle, pas de l'entrée de l'utilisateur." }
    text: { en: "`text` is the content part type of the Chat Completions API.", fr: "`text` est le type de partie de contenu de l'API Chat Completions." }
    image_url: { en: "`image_url` is the image content part type of the Chat Completions API.", fr: "`image_url` est le type de partie de contenu d'image de l'API Chat Completions." }
    input_file: { en: "`input_file` sends files such as PDFs, not images.", fr: "`input_file` envoie des fichiers comme des PDF, pas des images." }
    choices: { en: "`choices[0].message.content` is how a Chat Completions response is read.", fr: "`choices[0].message.content` est la façon de lire une réponse Chat Completions." }
    output_parsed: { en: "`output_parsed` is returned by `responses.parse` with a structured output format, not by this call.", fr: "`output_parsed` est renvoyé par `responses.parse` avec un format de sortie structurée, pas par cet appel." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
