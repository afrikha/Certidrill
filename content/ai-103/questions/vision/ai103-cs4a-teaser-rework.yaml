id: ai103-cs4a-teaser-rework
objective: "3.1.4"
type: single
caseStudy: ai103-cs4a-southridge
difficulty: 2
status: draft
stem:
  en: |
    The teasers that teaser-video generates are 12 seconds long. The marketing team reviews each teaser within an hour of its generation and then asks for at most one change.

    You need to meet the teaser rework requirement. What should the pipeline script do?
  fr: |
    Les bandes-annonces générées par teaser-video durent 12 secondes. L'équipe marketing examine chaque bande-annonce dans l'heure qui suit sa génération, puis demande au plus une modification.

    Vous devez satisfaire l'exigence relative à la retouche des bandes-annonces. Que doit faire le script de la chaîne de traitement ?
body:
  options:
    - { id: a, text: { en: "Call videos.create with the original prompt, extended with a sentence that describes the lighting change", fr: "Appeler videos.create avec l'invite d'origine, complétée par une phrase qui décrit la modification de l'éclairage" } }
    - { id: b, text: { en: "Call videos.remix with the ID of the approved teaser and a prompt that describes the lighting change", fr: "Appeler videos.remix avec l'ID de la bande-annonce approuvée et une invite qui décrit la modification de l'éclairage" } }
    - { id: c, text: { en: "Call videos.create with the approved teaser as the input video and a prompt that describes the lighting change", fr: "Appeler videos.create avec la bande-annonce approuvée comme vidéo d'entrée et une invite qui décrit la modification de l'éclairage" } }
    - { id: d, text: { en: "Send each key frame of the approved teaser to an image edits endpoint with a mask that covers the light sources", fr: "Envoyer chaque image clé de la bande-annonce approuvée à un point de terminaison de modification d'images avec un masque qui couvre les sources de lumière" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sora 2 remix modifies specific aspects of an existing generated video while preserving its core elements, so the motion and framing stay the same. Microsoft recommends limiting a remix to one clearly described adjustment, which matches the marketing request. The remix uses the ID of the previous video job, and the job is still available because jobs are kept for up to 24 hours.
    fr: |
      Le remix de Sora 2 modifie des aspects précis d'une vidéo générée existante tout en conservant ses éléments principaux, si bien que le mouvement et le cadrage restent identiques. Microsoft recommande de limiter un remix à un seul ajustement clairement décrit, ce qui correspond à la demande du marketing. Le remix utilise l'ID du travail vidéo précédent, toujours disponible puisque les travaux sont conservés jusqu'à 24 heures.
  options:
    a: { en: "A new generation starts from scratch, so the motion and framing of the approved teaser are not preserved.", fr: "Une nouvelle génération repart de zéro : le mouvement et le cadrage de la bande-annonce approuvée ne sont pas conservés." }
    c: { en: "An input video for generation can be at most five seconds long, and the 12-second teaser exceeds this limit.", fr: "Une vidéo d'entrée pour la génération dure au plus cinq secondes, et la bande-annonce de 12 secondes dépasse cette limite." }
    d: { en: "Editing frames one by one with an image model breaks the temporal consistency of the video and does not preserve the motion.", fr: "Modifier les images une par une avec un modèle d'image rompt la cohérence temporelle de la vidéo et ne conserve pas le mouvement." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
