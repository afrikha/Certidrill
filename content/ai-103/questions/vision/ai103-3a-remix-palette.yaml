id: ai103-3a-remix-palette
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys generated an 8-second clip of a toy plane with a `sora-2` deployment one hour ago, and the job status is `completed`. The art director approves the camera movement, the framing and the timing, but wants the clip in a warmer, sunset color palette.

    You need to produce the new version while keeping everything else in the clip. What should you do?
  fr: |
    Tailspin Toys a généré il y a une heure un clip de 8 secondes d'un avion jouet avec un déploiement `sora-2`, et l'état du travail est `completed`. Le directeur artistique approuve le mouvement de caméra, le cadrage et le rythme, mais veut le clip dans une palette de couleurs plus chaude, de coucher de soleil.

    Vous devez produire la nouvelle version en conservant tout le reste du clip. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Call `videos.create` with the original prompt followed by a sentence about the sunset palette"
        fr: "Appeler `videos.create` avec l'invite d'origine suivie d'une phrase sur la palette de coucher de soleil"
    - id: b
      text:
        en: "Call `videos.remix` with the ID of the completed video and a prompt about the sunset palette"
        fr: "Appeler `videos.remix` avec l'ID de la vidéo terminée et une invite sur la palette de coucher de soleil"
    - id: c
      text:
        en: "Call `videos.create` with the last frame of the clip as `input_reference` and a prompt about the palette"
        fr: "Appeler `videos.create` avec la dernière image du clip comme `input_reference` et une invite sur la palette"
    - id: d
      text:
        en: "Call `images.edit` on each frame of the clip with a prompt about the sunset palette"
        fr: "Appeler `images.edit` sur chaque image du clip avec une invite sur la palette de coucher de soleil"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Remix modifies an existing generated video with a targeted adjustment instead of regenerating it from scratch. It takes the ID of a completed video and a new prompt, and it keeps the structure, scene transitions and layout of the original. The video is one hour old, so it is still available.
    fr: |
      Le remix modifie une vidéo générée existante par un ajustement ciblé au lieu de la régénérer de zéro. Il prend l'ID d'une vidéo terminée et une nouvelle invite, et il conserve la structure, les transitions de scène et la disposition de l'original. La vidéo date d'une heure : elle est toujours disponible.
  options:
    a: { en: "A new generation starts from scratch, so the camera movement, framing and timing can all change.", fr: "Une nouvelle génération repart de zéro : le mouvement de caméra, le cadrage et le rythme peuvent tous changer." }
    c: { en: "`input_reference` anchors only the first frame of a new video; the motion and timing would be generated again.", fr: "`input_reference` sert d'ancre à la seule première image d'une nouvelle vidéo ; le mouvement et le rythme seraient générés de nouveau." }
    d: { en: "Editing frames one by one with an image model doesn't keep the consistency between frames.", fr: "Modifier les images une par une avec un modèle d'image ne préserve pas la cohérence entre les images." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
