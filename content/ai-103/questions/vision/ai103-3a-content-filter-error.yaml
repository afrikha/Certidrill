id: ai103-3a-content-filter-error
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Games uses a `gpt-image-1.5` deployment to create concept art. Some requests fail with the error code `contentFilter`. Other requests that are sent at the same time succeed.

    You need the app to handle these failures correctly. What should the app do when it receives this error?
  fr: |
    Woodgrove Games utilise un déploiement `gpt-image-1.5` pour créer des illustrations conceptuelles. Certaines requêtes échouent avec le code d'erreur `contentFilter`. D'autres requêtes envoyées au même moment réussissent.

    Vous devez faire en sorte que l'application gère correctement ces échecs. Que doit faire l'application quand elle reçoit cette erreur ?
body:
  options:
    - id: a
      text:
        en: "Retry the same request after an exponential backoff delay"
        fr: "Relancer la même requête après une attente avec interruption exponentielle"
    - id: d
      text:
        en: "Tell the user that the safety system blocked the request and ask for a revised prompt"
        fr: "Indiquer à l'utilisateur que le système de sécurité a bloqué la requête et lui demander une invite révisée"
    - id: c
      text:
        en: "Request a quota increase for the deployment in the Azure portal"
        fr: "Demander une augmentation de quota pour le déploiement dans le portail Azure"
    - id: b
      text:
        en: "Resend the same prompt with `quality` set to `low` and a smaller `size`"
        fr: "Renvoyer la même invite avec `quality` défini sur `low` et une taille `size` plus petite"
answer: { optionId: d }
explanation:
  correct:
    en: |
      The `contentFilter` error means that the guardrails blocked the prompt or the generated image. Sending the same content again would be blocked again, so the app explains the failure and asks the user to change the prompt.
    fr: |
      L'erreur `contentFilter` signifie que les garde-fous ont bloqué l'invite ou l'image générée. Le même contenu renvoyé serait de nouveau bloqué : l'application explique l'échec et demande à l'utilisateur de modifier l'invite.
  options:
    a: { en: "Backoff and retry handle rate limiting (HTTP 429); a filtered prompt fails again.", fr: "L'interruption exponentielle et la relance traitent la limitation de débit (HTTP 429) ; une invite filtrée échoue de nouveau." }
    c: { en: "Quota problems return HTTP 429, and other requests succeed at the same time.", fr: "Les problèmes de quota renvoient HTTP 429, et d'autres requêtes réussissent au même moment." }
    b: { en: "Quality and size don't change what the content filter evaluates.", fr: "La qualité et la taille ne changent pas ce qu'évalue le filtre de contenu." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
