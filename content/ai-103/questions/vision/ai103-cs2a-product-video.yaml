id: ai103-cs2a-product-video
objective: "3.1.2"
type: single
caseStudy: ai103-cs2a-tailwind-traders
difficulty: 2
status: draft
stem:
  en: |
    You are writing the code of Catalog Studio that calls video-catalog by using the OpenAI client library. You need to meet the product videos requirement. Which call should Catalog Studio make for each product?
  fr: |
    Vous écrivez le code de Catalog Studio qui appelle video-catalog à l'aide de la bibliothèque cliente OpenAI. Vous devez satisfaire l'exigence relative aux vidéos produits. Quel appel Catalog Studio doit-il effectuer pour chaque produit ?
body:
  options:
    - id: a
      text:
        en: |
          `videos.create` with a prompt, `size="1280x720"`, `seconds=8`, and the main studio photo, unchanged, as `input_reference`
        fr: |
          `videos.create` avec une invite, `size="1280x720"`, `seconds=8` et la photo studio principale, sans modification, comme `input_reference`
    - id: b
      text:
        en: |
          `videos.create` with a prompt, `size="1280x720"`, `seconds=8`, and the main studio photo, resized to 1280x720 pixels, as `input_reference`
        fr: |
          `videos.create` avec une invite, `size="1280x720"`, `seconds=8` et la photo studio principale, redimensionnée en 1280x720 pixels, comme `input_reference`
    - id: c
      text:
        en: |
          `videos.create` with a prompt that describes the product in detail, `size="1280x720"` and `seconds=8`, without an input reference
        fr: |
          `videos.create` avec une invite qui décrit le produit en détail, `size="1280x720"` et `seconds=8`, sans référence d'entrée
    - id: d
      text:
        en: |
          `videos.remix` with the main studio photo and a prompt that describes the camera movement around the product
        fr: |
          `videos.remix` avec la photo studio principale et une invite qui décrit le mouvement de caméra autour du produit
answer: { optionId: b }
explanation:
  correct:
    en: |
      Sora 2 supports image-to-video generation: the `input_reference` image becomes the starting point of the video. The reference image must match the output size exactly, so the 2048x1365 studio photo must be resized to 1280x720 for a landscape video. The `seconds` parameter accepts 4, 8 or 12.
    fr: |
      Sora 2 prend en charge la génération d'image à vidéo : l'image `input_reference` sert de point de départ à la vidéo. L'image de référence doit correspondre exactement à la taille de sortie : la photo studio de 2048x1365 pixels doit donc être redimensionnée en 1280x720 pour une vidéo paysage. Le paramètre `seconds` accepte 4, 8 ou 12.
  options:
    a:
      en: |
        A 2048x1365 reference image doesn't match the 1280x720 output size, which the input reference requires.
      fr: |
        Une image de référence de 2048x1365 pixels ne correspond pas à la taille de sortie 1280x720, ce qu'exige la référence d'entrée.
    c:
      en: |
        Without the photo, the model draws a product from the text only, so it won't look like the product in the photo.
      fr: |
        Sans la photo, le modèle dessine un produit à partir du texte seul : il ne ressemblera pas au produit de la photo.
    d:
      en: |
        Remix edits an existing generated video identified by its video ID; it doesn't create a video from a photo.
      fr: |
        Le remix modifie une vidéo générée existante, identifiée par son ID de vidéo ; il ne crée pas de vidéo à partir d'une photo.
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
