id: ai103-3a-video-face-reference
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Cycles uses a `sora-2` deployment to animate product shots. A designer calls `videos.create` with `size="1280x720"`, `seconds=8` and, as `input_reference`, a 1280x720 PNG photo in which an employee holds the new bike helmet. The request is rejected. The same request with a text prompt only succeeds.

    You need the video to start from a photo of the helmet. What should you do?
  fr: |
    Contoso Cycles utilise un déploiement `sora-2` pour animer des photos de produits. Un graphiste appelle `videos.create` avec `size="1280x720"`, `seconds=8` et, comme `input_reference`, une photo PNG de 1280x720 dans laquelle un employé tient le nouveau casque de vélo. La requête est rejetée. La même requête avec une simple invite de texte réussit.

    Vous devez faire en sorte que la vidéo commence par une photo du casque. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Use a 1280x720 photo that shows only the helmet, without the employee"
        fr: "Utiliser une photo de 1280x720 qui ne montre que le casque, sans l'employé"
    - id: b
      text:
        en: "Convert the photo of the employee to a JPEG file of the same resolution"
        fr: "Convertir la photo de l'employé en fichier JPEG de même résolution"
    - id: c
      text:
        en: "Set `size` to `720x1280` and crop the photo of the employee to 720x1280"
        fr: "Définir `size` sur `720x1280` et recadrer la photo de l'employé en 720x1280"
    - id: d
      text:
        en: "Pass the photo of the employee to `videos.remix` instead of `videos.create`"
        fr: "Passer la photo de l'employé à `videos.remix` au lieu de `videos.create`"
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Sora 2 API currently rejects input images that contain human faces, and it can't generate real people. The format (PNG) and the resolution (1280x720, equal to `size`) of the photo are already valid, so the fix is a reference image of the helmet alone.
    fr: |
      L'API Sora 2 rejette actuellement les images d'entrée qui contiennent des visages humains, et elle ne peut pas générer de personnes réelles. Le format (PNG) et la résolution (1280x720, égale à `size`) de la photo sont déjà valides : la solution consiste à utiliser une image de référence du casque seul.
  options:
    b: { en: "PNG is already an accepted format; the face in the image causes the rejection whatever the format.", fr: "PNG est déjà un format accepté ; c'est le visage présent dans l'image qui provoque le rejet, quel que soit le format." }
    c: { en: "The resolution already matches; a cropped photo that still shows the employee's face is still rejected.", fr: "La résolution correspond déjà ; une photo recadrée qui montre toujours le visage de l'employé est toujours rejetée." }
    d: { en: "A remix modifies a completed generated video identified by its ID; it doesn't take a photo as input.", fr: "Un remix modifie une vidéo générée terminée, identifiée par son ID ; il ne prend pas de photo en entrée." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
