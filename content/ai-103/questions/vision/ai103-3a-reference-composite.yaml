id: ai103-3a-reference-composite
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a `gpt-image-1.5` deployment named `promo-img` in a Microsoft Foundry resource. The marketing team supplies two PNG files for each campaign: a studio photo of a coffee grinder (4 MB) and a photo of a kitchen counter (6 MB). You need a script that produces one new picture in which the grinder stands on the kitchen counter, by using both photos as reference media.

    Which two actions should the script perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un déploiement `gpt-image-1.5` nommé `promo-img` dans une ressource Microsoft Foundry. L'équipe marketing fournit deux fichiers PNG pour chaque campagne : une photo studio d'un moulin à café (4 Mo) et une photo d'un plan de travail de cuisine (6 Mo). Vous avez besoin d'un script qui produit une nouvelle image dans laquelle le moulin est posé sur le plan de travail, en utilisant les deux photos comme médias de référence.

    Quelles sont les deux actions que le script doit effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Send both PNG files as image inputs of a single images edits request"
        fr: "Envoyer les deux fichiers PNG comme images d'entrée d'une seule requête de modification d'images"
    - id: b
      text:
        en: "Write a prompt that says how to combine the two images into the scene"
        fr: "Rédiger une invite qui indique comment combiner les deux images dans la scène"
    - id: c
      text:
        en: "Embed both photos as base64 strings in the prompt of an images generations request"
        fr: "Incorporer les deux photos sous forme de chaînes base64 dans l'invite d'une requête de génération d'images"
    - id: d
      text:
        en: "Send a mask that is fully transparent over the whole kitchen photo"
        fr: "Envoyer un masque entièrement transparent sur toute la photo de la cuisine"
    - id: e
      text:
        en: "Convert both photos to WebP files to stay under the input size limit"
        fr: "Convertir les deux photos en fichiers WebP pour rester sous la limite de taille d'entrée"
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      The generations operation takes text only; to start from existing pictures, you call the edits operation, which accepts up to 16 PNG or JPG input images of less than 50 MB each in a multipart/form-data request. The prompt tells the model how to combine the inputs, for example to place the grinder on the counter.
    fr: |
      L'opération de génération ne prend que du texte ; pour partir d'images existantes, vous appelez l'opération de modification, qui accepte jusqu'à 16 images d'entrée PNG ou JPG de moins de 50 Mo chacune dans une requête multipart/form-data. L'invite indique au modèle comment combiner les entrées, par exemple poser le moulin sur le plan de travail.
  options:
    c: { en: "The generations operation has no image input, and base64 text in a prompt is not read as an image.", fr: "L'opération de génération n'a pas d'entrée d'image, et du texte base64 dans une invite n'est pas lu comme une image." }
    d: { en: "A mask restricts which area of one image is edited; a mask that covers the whole photo doesn't combine the two images and isn't needed.", fr: "Un masque limite la zone modifiée d'une image ; un masque qui couvre toute la photo ne combine pas les deux images et n'est pas nécessaire." }
    e: { en: "Input images must be PNG or JPG, and the 4 MB and 6 MB files are already well under the 50 MB limit.", fr: "Les images d'entrée doivent être au format PNG ou JPG, et les fichiers de 4 Mo et 6 Mo sont déjà bien sous la limite de 50 Mo." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
