id: ai103-3a-remix-chain
objective: "3.1.4"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Wingtip Toys has a completed 8-second video generated by a `sora-2` deployment two hours ago, with the ID `video_A`. The creative director approves its composition and camera movement but asks for two changes: the kite in the sky must be red instead of blue, and the light must look like early morning. Each change must be reviewed before the next one is applied, and visual defects must be minimized.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Wingtip Toys dispose d'une vidéo de 8 secondes terminée, générée il y a deux heures par un déploiement `sora-2`, avec l'ID `video_A`. Le directeur de la création approuve sa composition et son mouvement de caméra mais demande deux modifications : le cerf-volant dans le ciel doit être rouge au lieu de bleu, et la lumière doit évoquer le petit matin. Chaque modification doit être vérifiée avant d'appliquer la suivante, et les défauts visuels doivent être réduits au minimum.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: r1, text: { en: "Call `videos.remix` with `video_A` and a prompt that changes the kite to red.", fr: "Appeler `videos.remix` avec `video_A` et une invite qui rend le cerf-volant rouge." } }
    - { id: p1, text: { en: "Poll the remix job until it is `completed`, then download and review the result.", fr: "Interroger le travail de remix jusqu'à ce qu'il soit `completed`, puis télécharger et vérifier le résultat." } }
    - { id: r2, text: { en: "Call `videos.remix` with the ID of the reviewed remix and a prompt that changes the light to early morning.", fr: "Appeler `videos.remix` avec l'ID du remix vérifié et une invite qui donne une lumière de petit matin." } }
    - { id: p2, text: { en: "Poll the second remix job until it is `completed`, then download and review the result.", fr: "Interroger le second travail de remix jusqu'à ce qu'il soit `completed`, puis télécharger et vérifier le résultat." } }
    - { id: both, text: { en: "Call `videos.remix` with `video_A` and a prompt that describes both changes.", fr: "Appeler `videos.remix` avec `video_A` et une invite qui décrit les deux modifications." } }
    - { id: create, text: { en: "Call `videos.create` with the original prompt rewritten to include both changes.", fr: "Appeler `videos.create` avec l'invite d'origine réécrite pour inclure les deux modifications." } }
    - { id: ra, text: { en: "Call `videos.remix` with `video_A` again and a prompt that changes the light to early morning.", fr: "Appeler de nouveau `videos.remix` avec `video_A` et une invite qui donne une lumière de petit matin." } }
answer:
  sequence: [ r1, p1, r2, p2 ]
explanation:
  correct:
    en: |
      Microsoft recommends limiting each remix to one clearly stated adjustment: narrow edits keep more fidelity and reduce visual defects. Each remix is a new asynchronous job, so you poll it, download it and review it. To apply the second change on top of the first, the second remix uses the ID of the first remix, which is itself a completed video.
    fr: |
      Microsoft recommande de limiter chaque remix à un seul ajustement clairement formulé : des modifications étroites préservent la fidélité et réduisent les défauts visuels. Chaque remix est un nouveau travail asynchrone : vous l'interrogez, le téléchargez et le vérifiez. Pour appliquer la seconde modification par-dessus la première, le second remix utilise l'ID du premier remix, qui est lui-même une vidéo terminée.
  options:
    both: { en: "Two changes in one remix go against the one-adjustment guidance and prevent reviewing each change separately.", fr: "Deux modifications dans un seul remix vont à l'encontre de la recommandation d'un seul ajustement et empêchent de vérifier chaque modification séparément." }
    create: { en: "A new generation doesn't keep the approved composition and camera movement.", fr: "Une nouvelle génération ne conserve pas la composition ni le mouvement de caméra approuvés." }
    ra: { en: "Remixing `video_A` again would produce a clip with a blue kite: the first change would be lost.", fr: "Remixer de nouveau `video_A` produirait un clip avec un cerf-volant bleu : la première modification serait perdue." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
