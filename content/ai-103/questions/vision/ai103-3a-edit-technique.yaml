id: ai103-3a-edit-technique
objective: "3.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The creative team of Fabrikam, Inc. uses a `gpt-image-1.5` deployment for four kinds of requests. You need to choose the image operation for each request.

    Which operation should you use for each request? To answer, drag the appropriate operations to the correct requests. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe créative de Fabrikam, Inc. utilise un déploiement `gpt-image-1.5` pour quatre types de demandes. Vous devez choisir l'opération d'image pour chaque demande.

    Quelle opération devez-vous utiliser pour chaque demande ? Pour répondre, faites glisser les opérations appropriées vers les demandes correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mask, text: { en: "An edit with the photo, a mask and a prompt", fr: "Une modification avec la photo, un masque et une invite" } }
    - { id: nomask, text: { en: "An edit with the photo and a prompt, without a mask", fr: "Une modification avec la photo et une invite, sans masque" } }
    - { id: multi, text: { en: "An edit with several input images and a prompt", fr: "Une modification avec plusieurs images d'entrée et une invite" } }
    - { id: generate, text: { en: "A generation with a prompt only", fr: "Une génération avec une invite uniquement" } }
    - { id: fidelity, text: { en: "A generation with a prompt and `input_fidelity`", fr: "Une génération avec une invite et `input_fidelity`" } }
  targets:
    - { id: t1, text: { en: "Replace the cloudy sky of a hotel photo and keep every other pixel unchanged", fr: "Remplacer le ciel nuageux d'une photo d'hôtel et laisser tous les autres pixels inchangés" } }
    - { id: t2, text: { en: "Turn a whole photo of a street into a watercolor painting", fr: "Transformer toute une photo de rue en peinture à l'aquarelle" } }
    - { id: t3, text: { en: "Place the product of one photo in the room shown in another photo", fr: "Placer le produit d'une photo dans la pièce montrée sur une autre photo" } }
    - { id: t4, text: { en: "Create a poster from a written description, without any existing picture", fr: "Créer une affiche à partir d'une description écrite, sans aucune image existante" } }
answer:
  mapping: { t1: mask, t2: nomask, t3: multi, t4: generate }
explanation:
  correct:
    en: |
      Inpainting uses a mask whose fully transparent pixels mark the only area to change. A prompt-driven edit without a mask may change the whole picture, which is what a full restyling needs. The edits operation accepts several input images that the prompt combines. A picture from text alone is a generation.
    fr: |
      L'inpainting utilise un masque dont les pixels entièrement transparents délimitent la seule zone à modifier. Une modification guidée par l'invite sans masque peut changer toute l'image, ce qui convient à un changement de style complet. L'opération de modification accepte plusieurs images d'entrée que l'invite combine. Une image créée à partir du seul texte relève de la génération.
  options:
    fidelity: { en: "`input_fidelity` controls how closely an edit preserves the features of input images; a generation has no input image.", fr: "`input_fidelity` contrôle à quel point une modification préserve les caractéristiques des images d'entrée ; une génération n'a pas d'image d'entrée." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
