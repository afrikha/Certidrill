id: ai103-3b-video-config
objective: "3.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is creating an Azure Content Understanding custom analyzer based on `prebuilt-video` to process recorded livestreams. The analyzer must meet the requirements shown in the answer area.

    Which `config` property should you set for each requirement? To answer, drag the appropriate properties to the correct requirements. Each property may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys crée un analyseur personnalisé Azure Content Understanding basé sur `prebuilt-video` pour traiter des diffusions en direct enregistrées. L'analyseur doit satisfaire les exigences indiquées dans la zone de réponse.

    Quelle propriété `config` devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les propriétés appropriées vers les exigences correspondantes. Chaque propriété peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: details, text: returnDetails }
    - { id: cats, text: contentCategories }
    - { id: locales, text: locales }
    - { id: omit, text: omitContent }
    - { id: seg, text: enableSegment }
    - { id: ocr, text: enableOcr }
  targets:
    - id: shots
      text: { en: "Return the timestamps of the camera shot boundaries in cameraShotTimesMs", fr: "Renvoyer les horodatages des limites des plans de caméra dans cameraShotTimesMs" }
    - id: describe
      text: { en: "Describe in natural language how the video is split: one segment per product demonstration", fr: "Décrire en langage naturel comment la vidéo est découpée : un segment par démonstration de produit" }
    - id: lang
      text: { en: "Transcribe the speech as English (United States) or French (France) only", fr: "Transcrire la parole uniquement en anglais (États-Unis) ou en français (France)" }
    - id: small
      text: { en: "Leave the original content object out of the analysis response", fr: "Exclure l'objet de contenu d'origine de la réponse d'analyse" }
answer:
  mapping: { shots: details, describe: cats, lang: locales, small: omit }
explanation:
  correct:
    en: |
      Shot boundaries in `cameraShotTimesMs` are returned only when `returnDetails` is `true`. The natural-language description of the segmentation goes in `contentCategories` (with `enableSegment` set to `true`). `locales` takes BCP-47 codes such as `en-US` and `fr-FR` to restrict transcription. `omitContent` removes the original content object from the response.
    fr: |
      Les limites des plans dans `cameraShotTimesMs` ne sont renvoyées que si `returnDetails` vaut `true`. La description en langage naturel de la segmentation se place dans `contentCategories` (avec `enableSegment` défini sur `true`). `locales` reçoit des codes BCP-47 comme `en-US` et `fr-FR` pour restreindre la transcription. `omitContent` retire l'objet de contenu d'origine de la réponse.
  options:
    seg: { en: "enableSegment turns segmentation on; the description of the segments themselves is in contentCategories.", fr: "enableSegment active la segmentation ; la description des segments se trouve dans contentCategories." }
    ocr: { en: "enableOcr is a document extraction setting; video analyzers don't support it.", fr: "enableOcr est un paramètre d'extraction de documents ; les analyseurs vidéo ne le prennent pas en charge." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Azure Content Understanding in Foundry Tools video overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
