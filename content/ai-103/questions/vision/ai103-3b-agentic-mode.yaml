id: ai103-3b-agentic-mode
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is testing the Azure Content Understanding preview API version `2026-06-01-preview`. A loan application arrives as one PDF file that contains several tables. A custom document analyzer must verify that the monthly amounts in the tables add up to the yearly total stated on another page, and return the result of this multistep check.

    Which setting should you add to the `config` object of the analyzer?
  fr: |
    Woodgrove Bank teste la version d'API en préversion `2026-06-01-preview` d'Azure Content Understanding. Une demande de prêt arrive sous la forme d'un fichier PDF qui contient plusieurs tableaux. Un analyseur de documents personnalisé doit vérifier que les montants mensuels des tableaux correspondent au total annuel indiqué sur une autre page, et renvoyer le résultat de ce contrôle en plusieurs étapes.

    Quel paramètre devez-vous ajouter à l'objet `config` de l'analyseur ?
body:
  options:
    - id: a
      text: "\"workflow\": \"agentic\""
    - id: b
      text: "\"workflow\": \"default\""
    - id: c
      text: "\"estimateFieldSourceAndConfidence\": true"
    - id: d
      text: "\"segmentPerPage\": true"
answer: { optionId: a }
explanation:
  correct:
    en: |
      In `2026-06-01-preview`, setting `config.workflow` to `"agentic"` enables agentic mode on a document analyzer, for multistep calculations, validation against conditions and analysis that requires visual inspection of tables or figures. The initial preview supports one input file per analysis request, which fits a single PDF file.
    fr: |
      Dans `2026-06-01-preview`, définir `config.workflow` sur `"agentic"` active le mode agentique sur un analyseur de documents, pour les calculs en plusieurs étapes, la validation par rapport à des conditions et l'analyse qui demande une inspection visuelle de tableaux ou de figures. La préversion initiale prend en charge un fichier d'entrée par requête d'analyse, ce qui convient à un seul fichier PDF.
  options:
    b:
      en: |
        `"default"` lets the service select a standard workflow based on the analyzer configuration, which is the same as omitting the property.
      fr: |
        `"default"` laisse le service choisir un flux standard selon la configuration de l'analyseur, ce qui revient à omettre la propriété.
    c:
      en: |
        This setting adds the source location and a confidence score to each field; it doesn't perform a multistep calculation.
      fr: |
        Ce paramètre ajoute l'emplacement source et un score de confiance à chaque champ ; il n'effectue pas de calcul en plusieurs étapes.
    d:
      en: |
        This setting forces one segment per page, which separates the tables from the page that states the total.
      fr: |
        Ce paramètre impose un segment par page, ce qui sépare les tableaux de la page qui indique le total.
references:
  - title: What's new in Content Understanding?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/whats-new
