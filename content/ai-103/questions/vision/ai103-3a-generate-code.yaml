id: ai103-3a-generate-code
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum Interiors deployed the `gpt-image-1.5` model in a Microsoft Foundry resource as a deployment named `room-art`. You are writing a Python function that creates two landscape images of a furnished room from a text prompt and saves them as PNG files. The `client` variable is an `OpenAI` client that targets the v1 API of the resource with keyless authentication.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Interiors a déployé le modèle `gpt-image-1.5` dans une ressource Microsoft Foundry sous la forme d'un déploiement nommé `room-art`. Vous écrivez une fonction Python qui crée deux images au format paysage d'une pièce meublée à partir d'une invite de texte et les enregistre dans des fichiers PNG. La variable `client` est un client `OpenAI` qui cible l'API v1 de la ressource avec une authentification sans clé.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import base64

    result = client.images.[[op]](
        model="room-art",
        prompt="Scandinavian living room with a linen sofa, morning light",
        size=[[size]],
        n=2,
    )
    for i, item in enumerate(result.data):
        with open(f"room-{i}.png", "wb") as f:
            f.write(base64.b64decode([[read]]))
  slots:
    - id: op
      options:
        - { id: generate, text: generate }
        - { id: edit, text: edit }
        - { id: variation, text: create_variation }
    - id: size
      options:
        - { id: s1024, text: "\"1024x1536\"" }
        - { id: s1536, text: "\"1536x1024\"" }
        - { id: s1792, text: "\"1792x1024\"" }
        - { id: s1920, text: "\"1920x1080\"" }
    - id: read
      options:
        - { id: b64, text: item.b64_json }
        - { id: url, text: item.url }
        - { id: revised, text: item.revised_prompt }
answer:
  values: { op: generate, size: s1536, read: b64 }
explanation:
  correct:
    en: |
      Creating images from a text prompt alone is the generations operation, `images.generate`. GPT-image-1.5 supports three fixed sizes: `1024x1024`, `1024x1536` (portrait) and `1536x1024` (landscape). GPT-image series models always return base64 data, read from `b64_json` and decoded before it is written to a file.
    fr: |
      Créer des images à partir d'une seule invite de texte relève de l'opération de génération, `images.generate`. GPT-image-1.5 prend en charge trois tailles fixes : `1024x1024`, `1024x1536` (portrait) et `1536x1024` (paysage). Les modèles de la série GPT-image renvoient toujours des données base64, lues dans `b64_json` et décodées avant d'être écrites dans un fichier.
  options:
    edit: { en: "The edits operation changes existing input images; here there is only a text prompt.", fr: "L'opération de modification change des images d'entrée existantes ; ici, il n'y a qu'une invite de texte." }
    variation: { en: "A variation starts from an existing image, not from a text prompt alone.", fr: "Une variante part d'une image existante, pas d'une seule invite de texte." }
    s1024: { en: "`1024x1536` is the portrait size, not landscape.", fr: "`1024x1536` est la taille portrait, pas paysage." }
    s1792: { en: "`1792x1024` is not one of the sizes supported by GPT-image-1.5.", fr: "`1792x1024` ne fait pas partie des tailles prises en charge par GPT-image-1.5." }
    s1920: { en: "GPT-image-1.5 only accepts its three fixed sizes; custom sizes require GPT-image-2 or later.", fr: "GPT-image-1.5 n'accepte que ses trois tailles fixes ; les tailles personnalisées nécessitent GPT-image-2 ou ultérieur." }
    url: { en: "GPT-image series models don't return URLs, only base64 data.", fr: "Les modèles de la série GPT-image ne renvoient pas d'URL, uniquement des données base64." }
    revised: { en: "This field doesn't contain the image data.", fr: "Ce champ ne contient pas les données de l'image." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
