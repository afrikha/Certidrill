id: ai103-3a-caption-config
objective: "3.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware Media uses a vision-enabled model deployment and the Responses API to caption photos. The editors report three needs.

    Which configuration should you use for each need? To answer, drag the appropriate configurations to the correct needs. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware Media utilise un déploiement de modèle compatible avec la vision et l'API Responses pour légender des photos. Les rédacteurs signalent trois besoins.

    Quelle configuration devez-vous utiliser pour chaque besoin ? Pour répondre, faites glisser les configurations appropriées vers les besoins correspondants. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: short, text: { en: "A one-sentence instruction with `detail` set to `low`", fr: "Une instruction d'une phrase avec `detail` défini sur `low`" } }
    - { id: long, text: { en: "An instruction that lists what to describe, with `detail` set to `high`", fr: "Une instruction qui liste ce qu'il faut décrire, avec `detail` défini sur `high`" } }
    - { id: tokens, text: { en: "A higher `max_output_tokens` value", fr: "Une valeur `max_output_tokens` plus élevée" } }
    - { id: temp, text: { en: "A lower `temperature` value", fr: "Une valeur `temperature` plus basse" } }
    - { id: schema, text: { en: "A strict JSON schema in `text.format`", fr: "Un schéma JSON strict dans `text.format`" } }
  targets:
    - { id: t1, text: { en: "A one-line caption for each gallery thumbnail, at the lowest token cost", fr: "Une légende d'une ligne pour chaque miniature de galerie, au coût en jetons le plus bas" } }
    - { id: t2, text: { en: "A detailed description of a market photo, including the small price signs on the stalls", fr: "Une description détaillée d'une photo de marché, y compris les petits panneaux de prix sur les étals" } }
    - { id: t3, text: { en: "Detailed descriptions that currently stop in the middle of a sentence", fr: "Des descriptions détaillées qui s'arrêtent actuellement au milieu d'une phrase" } }
answer:
  mapping: { t1: short, t2: long, t3: tokens }
explanation:
  correct:
    en: |
      Caption length and focus come from the instruction. `low` detail processes a 512x512 version of the image, with fewer tokens and lower latency, while `high` detail adds detailed segments so that the model can read small text. An answer that stops mid-sentence was cut off by the output token limit, so the limit must be raised.
    fr: |
      La longueur et l'angle de la légende viennent de l'instruction. Le détail `low` traite une version 512x512 de l'image, avec moins de jetons et une latence plus faible, tandis que le détail `high` ajoute des segments détaillés pour que le modèle puisse lire du petit texte. Une réponse qui s'arrête au milieu d'une phrase a été tronquée par la limite de jetons de sortie : il faut relever cette limite.
  options:
    temp: { en: "Temperature changes randomness; it doesn't make captions shorter, more detailed or complete.", fr: "La température change le caractère aléatoire ; elle ne rend pas les légendes plus courtes, plus détaillées ni complètes." }
    schema: { en: "A JSON schema controls the structure of the answer, not its length or level of detail.", fr: "Un schéma JSON contrôle la structure de la réponse, pas sa longueur ni son niveau de détail." }
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
