id: ai103-3b-objects-code
objective: "3.2.8"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum inspects photos of electrical cabinets. You are writing a Python function that sends a local photo to a vision-enabled chat model deployment named **vision-chat** by using the Responses API. The `client` object, the `data_url` variable (a base64 data URL of the photo) and the `schema` variable (a JSON schema) are already defined.

    The function must meet the following requirements:

    - The model must identify small components, such as fuses and terminal labels.
    - The output must always conform to `schema`.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum inspecte des photos d'armoires électriques. Vous écrivez une fonction Python qui envoie une photo locale à un déploiement de modèle de conversation compatible vision nommé **vision-chat** à l'aide de l'API Responses. L'objet `client`, la variable `data_url` (une URL de données base64 de la photo) et la variable `schema` (un schéma JSON) sont déjà définis.

    La fonction doit satisfaire les exigences suivantes :

    - Le modèle doit identifier de petits composants, comme les fusibles et les étiquettes de bornes.
    - La sortie doit toujours respecter `schema`.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = client.responses.create(
        model="vision-chat",
        input=[{
            "role": "user",
            "content": [
                {"type": "input_text",
                 "text": "List each visible component and whether it is damaged."},
                {"type": [[part]], "image_url": data_url, "detail": [[detail]]},
            ],
        }],
        text={"format": {"type": [[fmt]], "name": "components",
                         "schema": schema, "strict": True}},
    )
  slots:
    - id: part
      options:
        - { id: inimg, text: "\"input_image\"" }
        - { id: imgurl, text: "\"image_url\"" }
        - { id: infile, text: "\"input_file\"" }
    - id: detail
      options:
        - { id: high, text: "\"high\"" }
        - { id: low, text: "\"low\"" }
        - { id: auto, text: "\"auto\"" }
    - id: fmt
      options:
        - { id: schema, text: "\"json_schema\"" }
        - { id: object, text: "\"json_object\"" }
        - { id: text, text: "\"text\"" }
answer:
  values: { part: inimg, detail: high, fmt: schema }
explanation:
  correct:
    en: |
      In the Responses API, an image is a content part of type `input_image`, and a base64 data URL goes in its `image_url` property. `detail: "high"` adds detailed views of the image, which helps with small objects and text at the cost of more tokens. `text.format` with type `json_schema` and `strict: true` makes the output conform to the schema.
    fr: |
      Dans l'API Responses, une image est une partie de contenu de type `input_image`, et une URL de données base64 se place dans sa propriété `image_url`. `detail: "high"` ajoute des vues détaillées de l'image, ce qui aide pour les petits objets et le texte, au prix de jetons supplémentaires. `text.format` avec le type `json_schema` et `strict: true` fait respecter le schéma par la sortie.
  options:
    imgurl: { en: "image_url is the part type of the Chat Completions API, not of the Responses API.", fr: "image_url est le type de partie de l'API Chat Completions, pas de l'API Responses." }
    low: { en: "low processes a reduced version of the image and may miss small objects and text.", fr: "low traite une version réduite de l'image et peut manquer de petits objets et du texte." }
    auto: { en: "auto lets the model choose the resolution; it doesn't guarantee the detailed view.", fr: "auto laisse le modèle choisir la résolution ; il ne garantit pas la vue détaillée." }
    object: { en: "JSON mode returns valid JSON but doesn't enforce the schema.", fr: "Le mode JSON renvoie du JSON valide mais n'impose pas le schéma." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
