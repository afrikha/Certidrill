id: ai103-3b-video-whole
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware produces 30-second video ads for its clients. Before an ad is delivered, a Python app must store one brand-safety verdict and one summary for the complete ad. You are creating an Azure Content Understanding custom analyzer based on `prebuilt-video` with the fields `brandSafe` and `summary`.

    How should you configure segmentation in the analyzer?
  fr: |
    Proseware produit des publicités vidéo de 30 secondes pour ses clients. Avant la livraison d'une publicité, une application Python doit stocker un verdict de sécurité de marque et un résumé pour la publicité complète. Vous créez un analyseur personnalisé Azure Content Understanding basé sur `prebuilt-video` avec les champs `brandSafe` et `summary`.

    Comment devez-vous configurer la segmentation dans l'analyseur ?
body:
  options:
    - id: a
      text:
        en: "Set `enableSegment` to `true` and describe one segment per product shown in `contentCategories`"
        fr: "Définir `enableSegment` sur `true` et décrire un segment par produit montré dans `contentCategories`"
    - id: b
      text:
        en: "Set `enableSegment` to `true` and describe one segment per camera shot in `contentCategories`"
        fr: "Définir `enableSegment` sur `true` et décrire un segment par plan de caméra dans `contentCategories`"
    - id: c
      text:
        en: "Set `enableSegment` to `false` so that the whole video is analyzed as one segment"
        fr: "Définir `enableSegment` sur `false` pour que toute la vidéo soit analysée comme un seul segment"
    - id: d
      text:
        en: "Set `returnDetails` to `true` and compute the verdict from the shot boundaries in `cameraShotTimesMs`"
        fr: "Définir `returnDetails` sur `true` et calculer le verdict à partir des limites des plans dans `cameraShotTimesMs`"
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `enableSegment` set to `false`, the entire file is treated as one segment, which Learn recommends for compliance checks and full-length summaries. The fields are then returned once for the whole ad.
    fr: |
      Avec `enableSegment` défini sur `false`, tout le fichier est traité comme un seul segment, ce que Learn recommande pour les contrôles de conformité et les résumés de la vidéo entière. Les champs sont alors renvoyés une seule fois pour toute la publicité.
  options:
    a:
      en: |
        Segmenting by product returns one set of fields per product segment; the requirement is one result per ad.
      fr: |
        Segmenter par produit renvoie un ensemble de champs par segment de produit ; l'exigence est un résultat par publicité.
    b:
      en: |
        Segmenting by shot returns a verdict and a summary for each shot, not one for the complete ad.
      fr: |
        Segmenter par plan renvoie un verdict et un résumé par plan, pas un seul pour la publicité complète.
    d:
      en: |
        Shot boundaries are timestamps of camera cuts; they don't produce a brand-safety verdict.
      fr: |
        Les limites des plans sont des horodatages de changements de plan ; elles ne produisent pas de verdict de sécurité de marque.
references:
  - title: Azure Content Understanding in Foundry Tools video overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
