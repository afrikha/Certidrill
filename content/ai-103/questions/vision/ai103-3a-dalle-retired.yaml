id: ai103-3a-dalle-retired
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a Microsoft Foundry resource. Since March 2026, the catalog app of Wingtip Toys fails each time it calls a deployment named `art-gen` to create product illustrations from text prompts. The `art-gen` deployment uses the `dall-e-3` model.

    You need to restore image generation in the app. The solution must not require an application for limited access.

    What should you do?
  fr: |
    Wingtip Toys dispose d'une ressource Microsoft Foundry. Depuis mars 2026, l'application de catalogue de Wingtip Toys échoue chaque fois qu'elle appelle un déploiement nommé `art-gen` pour créer des illustrations de produits à partir d'invites de texte. Le déploiement `art-gen` utilise le modèle `dall-e-3`.

    Vous devez rétablir la génération d'images dans l'application. La solution ne doit pas nécessiter de demande d'accès limité.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Request a quota increase for the `art-gen` deployment in the Azure portal"
        fr: "Demander une augmentation de quota pour le déploiement `art-gen` dans le portail Azure"
    - id: b
      text:
        en: "Redeploy the `dall-e-3` model with a newer model version and keep the same code"
        fr: "Redéployer le modèle `dall-e-3` avec une version de modèle plus récente et conserver le même code"
    - id: c
      text:
        en: "Deploy the `gpt-image-2` model and have the app call that deployment"
        fr: "Déployer le modèle `gpt-image-2` et faire appeler ce déploiement par l'application"
    - id: d
      text:
        en: "Deploy the `gpt-image-1` model and have the app call that deployment"
        fr: "Déployer le modèle `gpt-image-1` et faire appeler ce déploiement par l'application"
answer: { optionId: c }
explanation:
  correct:
    en: |
      DALL-E 3 was retired on March 4, 2026, and its existing deployments no longer work, so the app must move to a GPT-image series model. GPT-image-2 is generally available, so it can be deployed without an access request. GPT-image series models return the image as base64 data in `b64_json`.
    fr: |
      DALL-E 3 a été mis hors service le 4 mars 2026 et ses déploiements existants ne fonctionnent plus : l'application doit passer à un modèle de la série GPT-image. GPT-image-2 est en disponibilité générale : il peut être déployé sans demande d'accès. Les modèles de la série GPT-image renvoient l'image sous forme de données base64 dans `b64_json`.
  options:
    a:
      en: "The failures are not caused by quota: the retired model's deployments are no longer functional."
      fr: "Les échecs ne viennent pas du quota : les déploiements du modèle mis hors service ne fonctionnent plus."
    b:
      en: "DALL-E 3 is retired and is no longer available for new deployments, whatever the version."
      fr: "DALL-E 3 est mis hors service et n'est plus disponible pour de nouveaux déploiements, quelle que soit la version."
    d:
      en: "GPT-image-1 is a limited access model that requires an application, which the requirement excludes."
      fr: "GPT-image-1 est un modèle en accès limité qui nécessite une demande, ce que l'exigence exclut."
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
