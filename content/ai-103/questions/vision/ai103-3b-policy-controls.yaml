id: ai103-3b-policy-controls
objective: "3.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank publishes images on its website and in its mobile app. The marketing and compliance teams defined the visual policy rules shown in the answer area.

    Which control should you use for each rule? To answer, drag the appropriate controls to the correct rules. Each control may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank publie des images sur son site web et dans son application mobile. Les équipes marketing et conformité ont défini les règles de stratégie visuelle indiquées dans la zone de réponse.

    Quel contrôle devez-vous utiliser pour chaque règle ? Pour répondre, faites glisser les contrôles appropriés vers les règles correspondantes. Chaque contrôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: safety, text: { en: "Content Safety Analyze Image API", fr: "API Analyze Image de Content Safety" } }
    - { id: cu, text: { en: "Content Understanding image analyzer with a classify field", fr: "Analyseur d'images Content Understanding avec un champ classify" } }
    - { id: creds, text: { en: "Content Credentials (C2PA)", fr: "Content Credentials (C2PA)" } }
    - { id: shields, text: { en: "Prompt Shields document attack detection", fr: "Détection des attaques par document de Prompt Shields" } }
    - { id: ground, text: { en: "Groundedness detection", fr: "Détection de l'ancrage" } }
  targets:
    - id: avatars
      text: { en: "Reject customer profile pictures that contain sexual or violent content", fr: "Rejeter les photos de profil des clients qui contiennent du contenu sexuel ou violent" }
    - id: symbols
      text: { en: "Flag marketing images that show a symbol from Woodgrove's list of prohibited symbols", fr: "Signaler les images marketing qui montrent un symbole de la liste des symboles interdits de Woodgrove" }
    - id: origin
      text: { en: "Let regulators verify that an illustration was generated by Azure OpenAI", fr: "Permettre aux régulateurs de vérifier qu'une illustration a été générée par Azure OpenAI" }
answer:
  mapping: { avatars: safety, symbols: cu, origin: creds }
explanation:
  correct:
    en: |
      Profile pictures don't go through a model, so the Analyze Image API classifies them for sexual, violence, hate and self-harm content. A company-defined list of prohibited symbols isn't a built-in harm category: a custom image analyzer with a `classify` field (for example Present, Absent, Uncertain) checks it. Generated images carry signed Content Credentials that anyone can verify.
    fr: |
      Les photos de profil ne passent pas par un modèle : l'API Analyze Image les classifie pour le contenu sexuel, la violence, la haine et l'automutilation. Une liste de symboles interdits définie par l'entreprise n'est pas une catégorie de préjudice intégrée : un analyseur d'images personnalisé avec un champ `classify` (par exemple Present, Absent, Uncertain) la vérifie. Les images générées portent des Content Credentials signés que chacun peut vérifier.
  options:
    shields: { en: "Prompt Shields detects injected instructions in text, not policy violations in images.", fr: "Prompt Shields détecte des instructions injectées dans du texte, pas des violations de stratégie dans des images." }
    ground: { en: "Groundedness detection checks whether model responses are supported by source material.", fr: "La détection de l'ancrage vérifie si les réponses d'un modèle sont étayées par les sources." }
references:
  - title: What is Azure AI Content Safety?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/overview
  - title: Content Credentials in Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials
