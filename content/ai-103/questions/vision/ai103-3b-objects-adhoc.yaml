id: ai103-3b-objects-adhoc
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso field technicians repair industrial pumps. In a mobile app, a technician takes a photo of a pump and asks questions that change from one repair to the next, such as "Which part is the pressure relief valve?" or "Is any hose connector loose?". The answers must describe the parts and their position in words.

    What should the app use to answer the questions?
  fr: |
    Les techniciens de terrain de Contoso réparent des pompes industrielles. Dans une application mobile, un technicien prend une photo d'une pompe et pose des questions qui changent d'une réparation à l'autre, comme « Quelle pièce est la soupape de surpression ? » ou « Un raccord de tuyau est-il desserré ? ». Les réponses doivent décrire les pièces et leur position en mots.

    Que doit utiliser l'application pour répondre aux questions ?
body:
  options:
    - id: a
      text:
        en: "The Azure Content Understanding `prebuilt-imageSearch` analyzer"
        fr: "L'analyseur `prebuilt-imageSearch` d'Azure Content Understanding"
    - id: b
      text:
        en: "The Azure AI Content Safety Analyze Image API"
        fr: "L'API Analyze Image d'Azure AI Content Safety"
    - id: c
      text:
        en: "A vision-enabled chat model that receives the photo and the technician's question"
        fr: "Un modèle de conversation compatible vision qui reçoit la photo et la question du technicien"
    - id: d
      text:
        en: "An Azure Content Understanding image analyzer with a fixed field schema"
        fr: "Un analyseur d'images Azure Content Understanding avec un schéma de champs fixe"
answer: { optionId: c }
explanation:
  correct:
    en: |
      A vision-enabled chat model answers a prompt about an image, so the question can change with every request. Positions described in words ("the valve at the top left of the housing") are within what a multimodal model returns; Microsoft also recommends GPT models in Foundry for flexible, custom vision solutions.
    fr: |
      Un modèle de conversation compatible vision répond à une invite portant sur une image : la question peut donc changer à chaque requête. Des positions décrites en mots (« la soupape en haut à gauche du carter ») font partie de ce que renvoie un modèle multimodal ; Microsoft recommande aussi les modèles GPT dans Foundry pour des solutions de vision souples et personnalisées.
  options:
    a:
      en: |
        `prebuilt-imageSearch` returns a general description for search and retrieval; it doesn't answer the technician's specific question.
      fr: |
        `prebuilt-imageSearch` renvoie une description générale pour la recherche et la récupération ; il ne répond pas à la question précise du technicien.
    b:
      en: |
        Content Safety classifies harmful content (hate, sexual, violence, self-harm); it doesn't identify the parts of a pump.
      fr: |
        Content Safety classifie le contenu préjudiciable (haine, contenu sexuel, violence, automutilation) ; il n'identifie pas les pièces d'une pompe.
    d:
      en: |
        An analyzer applies the same field schema to every image; it suits repeatable fields, not free questions that change with each repair.
      fr: |
        Un analyseur applique le même schéma de champs à chaque image ; il convient à des champs reproductibles, pas à des questions libres qui changent à chaque réparation.
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
  - title: Migrate from Azure Vision in Foundry Tools - Image Analysis
    url: https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/migration-options
