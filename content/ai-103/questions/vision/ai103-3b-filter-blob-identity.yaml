id: ai103-3b-filter-blob-identity
objective: "3.3.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders moderates product photos that sellers upload to a storage account named **stnwphotos**. An app will call the Azure AI Content Safety Analyze Image API and pass each photo as a `blobUrl`.

    The solution must meet the following requirements:

    - No storage account key or SAS token is stored or sent.
    - Permissions follow the principle of least privilege among the options that Content Safety supports.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders modère les photos de produits que les vendeurs chargent dans un compte de stockage nommé **stnwphotos**. Une application appellera l'API Analyze Image d'Azure AI Content Safety et transmettra chaque photo sous forme de `blobUrl`.

    La solution doit satisfaire les exigences suivantes :

    - Aucune clé de compte de stockage ni aucun jeton SAS n'est stocké ou envoyé.
    - Les autorisations respectent le principe du moindre privilège parmi les options prises en charge par Content Safety.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable a system-assigned managed identity on the Content Safety resource.", fr: "Activer une identité managée affectée par le système sur la ressource Content Safety." } }
    - { id: b, text: { en: "Assign the Storage Blob Data Contributor role on stnwphotos to the identity of the Content Safety resource.", fr: "Attribuer le rôle Storage Blob Data Contributor sur stnwphotos à l'identité de la ressource Content Safety." } }
    - { id: c, text: { en: "Assign the Storage Blob Data Reader role on stnwphotos to the identity of the Content Safety resource.", fr: "Attribuer le rôle Storage Blob Data Reader sur stnwphotos à l'identité de la ressource Content Safety." } }
    - { id: d, text: { en: "Assign the Storage Blob Data Owner role on stnwphotos to the identity of the Content Safety resource.", fr: "Attribuer le rôle Storage Blob Data Owner sur stnwphotos à l'identité de la ressource Content Safety." } }
    - { id: e, text: { en: "Assign the Storage Blob Data Contributor role on stnwphotos to the managed identity of the app.", fr: "Attribuer le rôle Storage Blob Data Contributor sur stnwphotos à l'identité managée de l'application." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      To analyze an image by blob URL, Content Safety reads the blob with its own system-assigned managed identity, so no key or SAS token is involved. Learn states that only the Storage Blob Data Contributor and Storage Blob Data Owner roles are valid for this identity; Contributor is the less privileged of the two.
    fr: |
      Pour analyser une image par URL de blob, Content Safety lit le blob avec sa propre identité managée affectée par le système : aucune clé ni aucun jeton SAS n'intervient. Learn indique que seuls les rôles Storage Blob Data Contributor et Storage Blob Data Owner sont valides pour cette identité ; Contributor est le moins privilégié des deux.
  options:
    c:
      en: |
        Storage Blob Data Reader has fewer permissions, but Learn lists only Contributor and Owner as valid roles for blob URL analysis.
      fr: |
        Storage Blob Data Reader a moins d'autorisations, mais Learn ne cite que Contributor et Owner comme rôles valides pour l'analyse par URL de blob.
    d:
      en: |
        Storage Blob Data Owner is supported but grants more than Storage Blob Data Contributor, so it doesn't meet least privilege.
      fr: |
        Storage Blob Data Owner est pris en charge mais accorde plus que Storage Blob Data Contributor : il ne respecte pas le moindre privilège.
    e:
      en: |
        The Content Safety service reads the blob, not the app, so the role must be assigned to the identity of the Content Safety resource.
      fr: |
        C'est le service Content Safety qui lit le blob, pas l'application : le rôle doit être attribué à l'identité de la ressource Content Safety.
references:
  - title: "Quickstart: Analyze image content"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image
