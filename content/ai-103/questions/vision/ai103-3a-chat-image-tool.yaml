id: ai103-3a-chat-image-tool
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is building a design assistant by using the Responses API of a Microsoft Foundry resource. The resource has a chat model deployment named `design-chat` and a `gpt-image-1.5` deployment named `design-img`. During a conversation, `design-chat` must decide by itself when a user's request needs a picture and then return the picture in the response. You must minimize custom code.

    What should you do?
  fr: |
    Tailspin Toys crée un assistant de conception à l'aide de l'API Responses d'une ressource Microsoft Foundry. La ressource dispose d'un déploiement de modèle de conversation nommé `design-chat` et d'un déploiement `gpt-image-1.5` nommé `design-img`. Pendant une conversation, `design-chat` doit décider lui-même quand la demande d'un utilisateur nécessite une image, puis renvoyer l'image dans la réponse. Vous devez réduire au minimum le code personnalisé.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add the `image_generation` tool to the request and name `design-img` in the `x-ms-oai-image-generation-deployment` header"
        fr: "Ajouter l'outil `image_generation` à la requête et indiquer `design-img` dans l'en-tête `x-ms-oai-image-generation-deployment`"
    - id: b
      text:
        en: "Set `model` to `design-img` in the Responses request and pass the conversation history as input"
        fr: "Définir `model` sur `design-img` dans la requête Responses et passer l'historique de la conversation en entrée"
    - id: c
      text:
        en: "Add an `input_image` content part to each user message and set the `detail` property to `high`"
        fr: "Ajouter une partie de contenu `input_image` à chaque message utilisateur et définir la propriété `detail` sur `high`"
    - id: d
      text:
        en: "Set `stream` to `true` and `partial_images` to `2` in the Responses request to `design-chat`"
        fr: "Définir `stream` sur `true` et `partial_images` sur `2` dans la requête Responses envoyée à `design-chat`"
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Responses API offers a built-in image generation tool, `{"type": "image_generation"}`, that a chat or reasoning model calls when it decides to draw. The image deployment is named in the `x-ms-oai-image-generation-deployment` header, and the image comes back as base64 data in the `result` of an output item of type `image_generation_call`. No function of your own is needed.
    fr: |
      L'API Responses propose un outil intégré de génération d'images, `{"type": "image_generation"}`, que le modèle de conversation ou de raisonnement appelle quand il décide de dessiner. Le déploiement d'images est indiqué dans l'en-tête `x-ms-oai-image-generation-deployment`, et l'image revient sous forme de données base64 dans le `result` d'un élément de sortie de type `image_generation_call`. Aucune fonction personnalisée n'est nécessaire.
  options:
    b: { en: "The image model doesn't hold the conversation or decide when an image is needed; the chat model does, through the tool.", fr: "Le modèle d'images ne mène pas la conversation et ne décide pas quand une image est nécessaire ; c'est le modèle de conversation qui le fait, via l'outil." }
    c: { en: "`input_image` sends an image to the model for analysis; it doesn't generate one.", fr: "`input_image` envoie une image au modèle pour qu'il l'analyse ; il n'en génère pas." }
    d: { en: "The image generation tool of the Responses API doesn't support streaming; partial images require a direct call to the image API.", fr: "L'outil de génération d'images de l'API Responses ne prend pas en charge le streaming ; les images partielles nécessitent un appel direct à l'API d'images." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
