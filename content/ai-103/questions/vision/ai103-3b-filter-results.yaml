id: ai103-3b-filter-results
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Python app that calls a vision-enabled chat model deployment by using the Chat Completions API. Users send text and images. The deployment has a guardrail that blocks sexual and violent content at the Medium blocking level, for prompts and completions.

    You are writing the error handling of the app. Which two results indicate that the guardrail blocked content?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une application Python qui appelle un déploiement de modèle de conversation compatible vision à l'aide de l'API Chat Completions. Les utilisateurs envoient du texte et des images. Le déploiement possède un garde-fou qui bloque le contenu sexuel et violent au niveau de blocage Medium, pour les invites et les complétions.

    Vous écrivez la gestion des erreurs de l'application. Quels sont les deux résultats qui indiquent que le garde-fou a bloqué du contenu ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A choice whose `finish_reason` is `content_filter`", fr: "Un choix dont la valeur de `finish_reason` est `content_filter`" } }
    - { id: b, text: { en: "An HTTP 400 response with the error code `content_filter`", fr: "Une réponse HTTP 400 avec le code d'erreur `content_filter`" } }
    - { id: c, text: { en: "A `categoriesAnalysis` entry whose `severity` is `4`", fr: "Une entrée `categoriesAnalysis` dont la valeur de `severity` est `4`" } }
    - { id: d, text: { en: "An operation status of `Failed` with the error code `contentFilter`", fr: "Un état d'opération `Failed` avec le code d'erreur `contentFilter`" } }
    - { id: e, text: { en: "A `finish_reason` of `length`", fr: "Une valeur de `finish_reason` égale à `length`" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      When the guardrail filters a prompt, the call returns HTTP 400 with the error code `content_filter`. When it filters the generated output, the response is HTTP 200 and the choice has `finish_reason` set to `content_filter`, usually with no content.
    fr: |
      Quand le garde-fou filtre une invite, l'appel renvoie HTTP 400 avec le code d'erreur `content_filter`. Quand il filtre la sortie générée, la réponse est HTTP 200 et le choix a `finish_reason` défini sur `content_filter`, généralement sans contenu.
  options:
    c:
      en: |
        `categoriesAnalysis` is the response of the Content Safety Analyze Image API, not of a chat model deployment.
      fr: |
        `categoriesAnalysis` est la réponse de l'API Analyze Image de Content Safety, pas d'un déploiement de modèle de conversation.
    d:
      en: |
        A `Failed` status with `contentFilter` is how image generation models report filtered prompts or images.
      fr: |
        Un état `Failed` avec `contentFilter` est la façon dont les modèles de génération d'images signalent des invites ou des images filtrées.
    e:
      en: |
        `length` means the output was cut by the token limit, not filtered.
      fr: |
        `length` signifie que la sortie a été coupée par la limite de jetons, pas filtrée.
references:
  - title: Content filtering for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
