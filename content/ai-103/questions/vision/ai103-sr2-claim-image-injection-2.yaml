id: ai103-sr2-claim-image-injection-2
objective: "3.3.2"
type: series_yesno
series: ai103-sr2-claim-image-injection
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You send the claim description to Prompt Shields as the user prompt.
  fr: Vous envoyez la description du sinistre à Prompt Shields en tant qu'invite utilisateur.
body:
  solution:
    en: |
      For each claim, the app calls `text:shieldPrompt` of Azure AI Content Safety with only the claim description, in `userPrompt`. If `userPromptAnalysis.attackDetected` is `true`, the app rejects the claim; otherwise, it sends the description and the images to the model.
    fr: |
      Pour chaque déclaration, l'application appelle `text:shieldPrompt` d'Azure AI Content Safety avec uniquement la description du sinistre, dans `userPrompt`. Si `userPromptAnalysis.attackDetected` vaut `true`, l'application rejette la déclaration ; sinon, elle envoie la description et les images au modèle.
answer: { value: false }
explanation:
  correct:
    en: The user prompt check inspects only what the customer typed. The injected instruction is printed inside a scanned invoice, and its text never reaches Prompt Shields, so the claim passes and the image goes to the model with the instruction. The text of the images must be extracted and sent as documents for the document attack check.
    fr: "La détection des attaques par invite utilisateur n'inspecte que ce que le client a saisi. L'instruction injectée est imprimée dans une facture numérisée et son texte n'atteint jamais Prompt Shields : la déclaration est acceptée et l'image est envoyée au modèle avec l'instruction. Le texte des images doit être extrait et envoyé sous forme de documents pour la détection des attaques par document."
references:
  - title: "Quickstart: Detect prompt attacks with Prompt Shields"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-jailbreak
