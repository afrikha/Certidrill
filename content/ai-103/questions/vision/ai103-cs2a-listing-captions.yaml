id: ai103-cs2a-listing-captions
objective: "3.2.2"
type: yesno_statements
caseStudy: ai103-cs2a-tailwind-traders
difficulty: 2
status: draft
stem:
  en: |
    You plan to meet the captions requirement by sending the photos of each listing to vision-chat. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de satisfaire l'exigence relative aux légendes en envoyant les photos de chaque fiche à vision-chat. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          To produce the detailed description, Catalog Studio can send all the photos of a listing as several `image_url` items in the content of a single user message.
        fr: |
          Pour produire la description détaillée, Catalog Studio peut envoyer toutes les photos d'une fiche sous forme de plusieurs éléments `image_url` dans le contenu d'un seul message utilisateur.
    - id: s2
      text:
        en: |
          Catalog Studio can pass the URL of each blob in the product-photos container as the `url` value of an `image_url` item.
        fr: |
          Catalog Studio peut transmettre l'URL de chaque objet blob du conteneur product-photos comme valeur `url` d'un élément `image_url`.
    - id: s3
      text:
        en: |
          Setting `detail` to `low` for the short captions reduces the number of tokens, but it can reduce the accuracy of text recognition in the photos.
        fr: |
          Définir `detail` sur `low` pour les légendes courtes réduit le nombre de jetons, mais peut réduire la précision de la reconnaissance du texte dans les photos.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The content of a user message is an array, and a chat request accepts up to 10 images, so the eight photos of a listing fit in one message for the detailed description. Image URLs must be publicly reachable because the images are fetched from Microsoft-managed infrastructure; URLs behind a firewall or a private endpoint aren't supported, so Catalog Studio must send base64 data URLs instead. With `detail` set to `low`, the model processes a 512x512 version of the image, which uses fewer tokens but can lower object and text recognition accuracy.
    fr: |
      Le contenu d'un message utilisateur est un tableau et une requête de conversation accepte jusqu'à 10 images : les huit photos d'une fiche tiennent donc dans un seul message pour la description détaillée. Les URL d'images doivent être accessibles publiquement, car les images sont récupérées depuis une infrastructure gérée par Microsoft ; les URL protégées par un pare-feu ou un point de terminaison privé ne sont pas prises en charge, et Catalog Studio doit donc envoyer des URL de données base64. Avec `detail` défini sur `low`, le modèle traite une version 512x512 de l'image, ce qui consomme moins de jetons mais peut réduire la précision de la reconnaissance des objets et du texte.
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
