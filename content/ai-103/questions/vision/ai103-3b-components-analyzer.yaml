id: ai103-3b-components-analyzer
objective: "3.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware assembles circuit boards. A camera takes a photo of every finished board. For each of 12 named components, the quality team needs one of the values Present, Missing or NotVisible, returned in the same structure for every photo so that the results feed a dashboard.

    The solution must not depend on a deprecated service and must not require training a model.

    What should you implement?
  fr: |
    Proseware assemble des cartes électroniques. Une caméra prend une photo de chaque carte terminée. Pour chacun des 12 composants nommés, l'équipe qualité a besoin d'une des valeurs Present, Missing ou NotVisible, renvoyée dans la même structure pour chaque photo afin d'alimenter un tableau de bord.

    La solution ne doit pas dépendre d'un service déprécié et ne doit pas nécessiter l'entraînement d'un modèle.

    Que devez-vous implémenter ?
body:
  options:
    - id: a
      text:
        en: "A vision-enabled chat model prompted to describe the board and to mention in free text any component that seems missing"
        fr: "Un modèle de conversation compatible vision, invité à décrire la carte et à mentionner en texte libre tout composant qui semble manquer"
    - id: b
      text:
        en: "An Azure Content Understanding analyzer based on `prebuilt-image` with one `extract` field per component and the enum Present, Missing, NotVisible"
        fr: "Un analyseur Azure Content Understanding basé sur `prebuilt-image` avec un champ `extract` par composant et l'énumération Present, Missing, NotVisible"
    - id: c
      text:
        en: "Azure Vision Image Analysis 4.0 object detection, with the returned object tags compared to the list of components"
        fr: "La détection d'objets d'Azure Vision Image Analysis 4.0, avec une comparaison des étiquettes (tags) d'objets renvoyées à la liste des composants"
    - id: d
      text:
        en: "An Azure Content Understanding analyzer based on `prebuilt-image` with one `classify` field per component and the enum Present, Missing, NotVisible"
        fr: "Un analyseur Azure Content Understanding basé sur `prebuilt-image` avec un champ `classify` par composant et l'énumération Present, Missing, NotVisible"
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Content Understanding image analyzer applies the same field schema to every photo and needs no training: its fields are defined by names and descriptions. A `classify` field returns one value from the `enum` list, which gives the dashboard a consistent value per component. Microsoft recommends Content Understanding as a managed replacement for Image Analysis.
    fr: |
      Un analyseur d'images Content Understanding applique le même schéma de champs à chaque photo et ne demande aucun entraînement : ses champs sont définis par des noms et des descriptions. Un champ `classify` renvoie une valeur de la liste `enum`, ce qui donne au tableau de bord une valeur cohérente par composant. Microsoft recommande Content Understanding comme remplaçant managé d'Image Analysis.
  options:
    a:
      en: |
        Free text doesn't give the same structure for every photo, so the dashboard can't rely on it.
      fr: |
        Un texte libre ne donne pas la même structure pour chaque photo : le tableau de bord ne peut pas s'y fier.
    b:
      en: |
        `extract` returns values as they appear in the content and is supported only by document analyzers; a choice among fixed values uses `classify`.
      fr: |
        `extract` renvoie les valeurs telles qu'elles apparaissent dans le contenu et n'est pris en charge que par les analyseurs de documents ; un choix parmi des valeurs fixes utilise `classify`.
    c:
      en: |
        Image Analysis 4.0 is deprecated and retires on September 25, 2028, and its generic tags don't name Proseware's specific components.
      fr: |
        Image Analysis 4.0 est déprécié et sera mis hors service le 25 septembre 2028, et ses étiquettes (tags) génériques ne nomment pas les composants propres à Proseware.
references:
  - title: Azure Content Understanding in Foundry Tools image overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/image/overview
  - title: What is Image Analysis?
    url: https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/overview-image-analysis
