id: ai103-3a-visual-rag
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Construction stores 20,000 site inspection photos, each with a photo ID. Project managers will ask questions such as "Which floors showed exposed wiring in March?". Each answer must be based on the photos themselves and must list the IDs of the photos that support it. A vision-enabled model deployment and an Azure AI Search service are available.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Construction stocke 20 000 photos d'inspection de chantier, chacune avec un ID de photo. Les chefs de projet poseront des questions comme « Quels étages présentaient des câbles électriques apparents en mars ? ». Chaque réponse doit s'appuyer sur les photos elles-mêmes et lister les ID des photos qui la justifient. Un déploiement de modèle compatible avec la vision et un service Azure AI Search sont disponibles.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Generate a text description of each photo and index it with the photo ID and date in Azure AI Search"
        fr: "Générer une description textuelle de chaque photo et l'indexer avec l'ID et la date de la photo dans Azure AI Search"
    - id: b
      text:
        en: "For each question, retrieve the relevant photos and send them with the question, asking the model to cite their IDs"
        fr: "Pour chaque question, récupérer les photos pertinentes et les envoyer avec la question, en demandant au modèle de citer leurs ID"
    - id: c
      text:
        en: "For each question, send all the photos of the month in one request with `detail` set to `low`"
        fr: "Pour chaque question, envoyer toutes les photos du mois dans une seule requête avec `detail` défini sur `low`"
    - id: d
      text:
        en: "For each question, send only the question and the list of photo file names to the model"
        fr: "Pour chaque question, n'envoyer au modèle que la question et la liste des noms de fichiers des photos"
    - id: e
      text:
        en: "Raise `temperature` so that the model explores more photos before it answers"
        fr: "Augmenter `temperature` pour que le modèle explore davantage de photos avant de répondre"
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      A request can carry only a limited number of images (up to 50 in the Responses API), so thousands of photos must be indexed first. Text descriptions indexed with the photo IDs let the app retrieve the relevant photos for each question. Sending those photos with the question, and asking the model to cite the photo IDs it relied on, grounds the answer in visual evidence.
    fr: |
      Une requête ne peut porter qu'un nombre limité d'images (jusqu'à 50 dans l'API Responses) : des milliers de photos doivent donc d'abord être indexées. Des descriptions textuelles indexées avec les ID de photo permettent à l'application de récupérer les photos pertinentes pour chaque question. Envoyer ces photos avec la question, en demandant au modèle de citer les ID des photos utilisées, ancre la réponse dans des preuves visuelles.
  options:
    c: { en: "A month of photos exceeds the number of images a request accepts, and low detail can miss small defects.", fr: "Un mois de photos dépasse le nombre d'images qu'accepte une requête, et le détail faible peut manquer de petits défauts." }
    d: { en: "File names aren't visual evidence: the model would answer without seeing the photos.", fr: "Les noms de fichiers ne sont pas des preuves visuelles : le modèle répondrait sans voir les photos." }
    e: { en: "Temperature changes randomness; it doesn't give the model access to more photos.", fr: "La température change le caractère aléatoire ; elle ne donne pas au modèle accès à davantage de photos." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
