id: ai103-3a-evidence-schema
objective: "3.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Utilities asks a vision-enabled model deployment questions about photos of electricity meters by using the Chat Completions API. The inspection app must receive, in every response, exactly three properties: `reading` (the answer), `answerable` (whether the photo shows the answer) and `evidence` (where in the photo the answer was found). The app must reject no response because of a missing or extra property.

    How should you complete the request body? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Utilities pose à un déploiement de modèle compatible avec la vision des questions sur des photos de compteurs électriques à l'aide de l'API Chat Completions. L'application d'inspection doit recevoir, dans chaque réponse, exactement trois propriétés : `reading` (la réponse), `answerable` (si la photo montre la réponse) et `evidence` (l'endroit de la photo où la réponse a été trouvée). L'application ne doit rejeter aucune réponse pour une propriété manquante ou en trop.

    Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "response_format": {
      "type": [[type]],
      "json_schema": {
        "name": "meter_answer",
        "strict": [[strict]],
        "schema": {
          "type": "object",
          "properties": {
            "reading": { "type": "string" },
            "answerable": { "type": "boolean" },
            "evidence": { "type": "array", "items": { "type": "string" } }
          },
          "required": [[required]],
          "additionalProperties": [[additional]]
        }
      }
    }
  slots:
    - id: type
      options:
        - { id: schema, text: "\"json_schema\"" }
        - { id: object, text: "\"json_object\"" }
        - { id: text, text: "\"text\"" }
    - id: strict
      options:
        - { id: strue, text: "true" }
        - { id: sfalse, text: "false" }
    - id: required
      options:
        - { id: all, text: "[\"reading\", \"answerable\", \"evidence\"]" }
        - { id: reading, text: "[\"reading\"]" }
        - { id: none, text: "[]" }
    - id: additional
      options:
        - { id: addfalse, text: "false" }
        - { id: addtrue, text: "true" }
answer:
  values: { type: schema, strict: strue, required: all, additional: addfalse }
explanation:
  correct:
    en: |
      Structured outputs use a `response_format` of type `json_schema` in Chat Completions, with `strict` set to `true` so that the output follows the schema. In strict mode every property must be listed in `required`, and `additionalProperties` must be `false` on every object, which guarantees exactly the three properties.
    fr: |
      Les sorties structurées utilisent un `response_format` de type `json_schema` dans Chat Completions, avec `strict` défini sur `true` pour que la sortie suive le schéma. En mode strict, chaque propriété doit figurer dans `required`, et `additionalProperties` doit valoir `false` sur chaque objet, ce qui garantit exactement les trois propriétés.
  options:
    object: { en: "JSON mode returns valid JSON but doesn't enforce the schema's properties.", fr: "Le mode JSON renvoie du JSON valide mais n'impose pas les propriétés du schéma." }
    text: { en: "`text` returns free text, not an object that follows the schema.", fr: "`text` renvoie du texte libre, pas un objet conforme au schéma." }
    sfalse: { en: "Without strict mode, the output isn't guaranteed to follow the schema.", fr: "Sans le mode strict, rien ne garantit que la sortie suive le schéma." }
    reading: { en: "Structured outputs require every property to be listed in `required`.", fr: "Les sorties structurées exigent que chaque propriété figure dans `required`." }
    none: { en: "Structured outputs require every property to be listed in `required`.", fr: "Les sorties structurées exigent que chaque propriété figure dans `required`." }
    addtrue: { en: "Structured outputs require `additionalProperties` set to `false`; extra properties would also break the requirement.", fr: "Les sorties structurées exigent `additionalProperties` défini sur `false` ; des propriétés supplémentaires enfreindraient aussi l'exigence." }
references:
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
