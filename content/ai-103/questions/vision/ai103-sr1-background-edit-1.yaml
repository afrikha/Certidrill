id: ai103-sr1-background-edit-1
objective: "3.1.3"
type: series_yesno
series: ai103-sr1-background-edit
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You call the image generations endpoint with a detailed prompt.
  fr: Vous appelez le point de terminaison de génération d'images avec une invite détaillée.
body:
  solution:
    en: |
      For each photo, the script sends a request to the **images/generations** endpoint of img1 with a prompt that describes the product in detail and asks for it to be shown in a snowy chalet interior, at size `1024x1024`.
    fr: |
      Pour chaque photo, le script envoie une requête au point de terminaison **images/generations** d'img1 avec une invite qui décrit le produit en détail et demande de le représenter dans l'intérieur d'un chalet enneigé, à la taille `1024x1024`.
answer: { value: false }
explanation:
  correct:
    en: The generations endpoint creates a new image from the text prompt alone; it does not receive the original photo. The model redraws the product from its description, so the result is not an edit of the background of the existing photo.
    fr: "Le point de terminaison de génération crée une nouvelle image à partir de la seule invite de texte ; il ne reçoit pas la photo d'origine. Le modèle redessine le produit à partir de sa description : le résultat n'est pas une modification de l'arrière-plan de la photo existante."
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
