id: ai103-3b-filter-chat-guardrail
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys has a support chat app. Customers can attach photos, and the app sends each message and its photos to a vision-enabled chat model deployed in Microsoft Foundry. You need photos that contain violent content to be blocked before the model answers. The solution must minimize development effort.

    What should you configure?
  fr: |
    Wingtip Toys dispose d'une application de conversation pour le support. Les clients peuvent joindre des photos, et l'application envoie chaque message et ses photos à un modèle de conversation compatible vision déployé dans Microsoft Foundry. Les photos au contenu violent doivent être bloquées avant que le modèle réponde. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text:
        en: "The user prompt attack control of the guardrail of the model deployment, with the block action"
        fr: "Le contrôle des attaques par invite utilisateur du garde-fou du déploiement de modèle, avec l'action de blocage"
    - id: b
      text:
        en: "A call from the app to the Content Safety Analyze Image API before each model request, with a severity threshold"
        fr: "Un appel de l'application à l'API Analyze Image de Content Safety avant chaque requête au modèle, avec un seuil de gravité"
    - id: c
      text:
        en: "The guardrail of the model deployment, with a blocking level for the Violence category on user input"
        fr: "Le garde-fou du déploiement de modèle, avec un niveau de blocage pour la catégorie Violence sur l'entrée utilisateur"
    - id: d
      text:
        en: "A Content Understanding image analyzer with a `classify` field named `isViolent` that the app checks before each request"
        fr: "Un analyseur d'images Content Understanding avec un champ `classify` nommé `isViolent` que l'application vérifie avant chaque requête"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Guardrails run automatically on the inputs and outputs of the model deployment, including images, and classify hate, sexual, violence and self-harm content. Setting a blocking level for Violence on user input blocks the request before the model answers, with no code to write: a blocked prompt returns HTTP 400 with the `content_filter` error code.
    fr: |
      Les garde-fous s'exécutent automatiquement sur les entrées et les sorties du déploiement de modèle, images comprises, et classifient la haine, le contenu sexuel, la violence et l'automutilation. Définir un niveau de blocage pour Violence sur l'entrée utilisateur bloque la requête avant que le modèle réponde, sans code à écrire : une invite bloquée renvoie HTTP 400 avec le code d'erreur `content_filter`.
  options:
    a:
      en: |
        User prompt attack detection looks for jailbreak attempts, not for violent content.
      fr: |
        La détection des attaques par invite utilisateur recherche les tentatives de jailbreak, pas le contenu violent.
    b:
      en: |
        The Analyze Image API works, but it adds an extra call and code to the app; it's meant for content that doesn't go through a model.
      fr: |
        L'API Analyze Image fonctionne, mais elle ajoute un appel et du code à l'application ; elle est destinée au contenu qui ne passe pas par un modèle.
    d:
      en: |
        A custom analyzer adds a service, a schema and code, and its field isn't a harm classifier with severity levels.
      fr: |
        Un analyseur personnalisé ajoute un service, un schéma et du code, et son champ n'est pas un classifieur de préjudices avec des niveaux de gravité.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
  - title: Content filtering for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter
