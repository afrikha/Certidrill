id: ai103-3b-cu-analyzer-json
objective: "3.2.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys inspects photos of returned products. You are writing the definition of an Azure Content Understanding custom analyzer named **returnInspection**. For each photo, the analyzer must return:

    - `damageNotes`: a free-text description of any visible damage;
    - `packaging`: exactly one of the values Sealed, Opened or Damaged.

    How should you complete the definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys inspecte des photos de produits retournés. Vous rédigez la définition d'un analyseur personnalisé Azure Content Understanding nommé **returnInspection**. Pour chaque photo, l'analyseur doit renvoyer :

    - `damageNotes` : une description libre de tout dommage visible ;
    - `packaging` : exactement une des valeurs Sealed, Opened ou Damaged.

    Comment devez-vous compléter la définition ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "analyzerId": "returnInspection",
      "description": "Photos of products returned to Tailspin Toys",
      "baseAnalyzerId": [[base]],
      "fieldSchema": {
        "name": "ReturnFields",
        "fields": {
          "damageNotes": {
            "type": "string",
            "method": [[m1]],
            "description": "Visible damage on the product, or None"
          },
          "packaging": {
            "type": "string",
            "method": [[m2]],
            "description": "State of the original packaging",
            [[list]]: ["Sealed", "Opened", "Damaged"]
          }
        }
      },
      "models": { "completion": "gpt-5.2" }
    }
  slots:
    - id: base
      options:
        - { id: image, text: "\"prebuilt-image\"" }
        - { id: search, text: "\"prebuilt-imageSearch\"" }
        - { id: doc, text: "\"prebuilt-document\"" }
        - { id: video, text: "\"prebuilt-video\"" }
    - id: m1
      options:
        - { id: gen, text: "\"generate\"" }
        - { id: ext, text: "\"extract\"" }
        - { id: cls, text: "\"classify\"" }
    - id: m2
      options:
        - { id: gen, text: "\"generate\"" }
        - { id: ext, text: "\"extract\"" }
        - { id: cls, text: "\"classify\"" }
    - id: list
      options:
        - { id: enum, text: "\"enum\"" }
        - { id: items, text: "\"items\"" }
        - { id: props, text: "\"properties\"" }
        - { id: cats, text: "\"contentCategories\"" }
answer:
  values: { base: image, m1: gen, m2: cls, list: enum }
explanation:
  correct:
    en: |
      A custom image analyzer inherits from the base analyzer `prebuilt-image`. A free-text description requires inference, so it uses `generate`. A value chosen from a fixed set uses `classify`, with the allowed values listed in `enum`.
    fr: |
      Un analyseur d'images personnalisé hérite de l'analyseur de base `prebuilt-image`. Une description libre demande une inférence : elle utilise `generate`. Une valeur choisie dans un ensemble fixe utilise `classify`, avec les valeurs autorisées listées dans `enum`.
  options:
    search: { en: "prebuilt-imageSearch is a ready-to-use analyzer for descriptions; the documented base analyzers are prebuilt-document, -audio, -video and -image.", fr: "prebuilt-imageSearch est un analyseur prêt à l'emploi pour les descriptions ; les analyseurs de base documentés sont prebuilt-document, -audio, -video et -image." }
    doc: { en: "prebuilt-document is the base for documents; these are photos of products.", fr: "prebuilt-document est la base des documents ; il s'agit ici de photos de produits." }
    ext: { en: "extract returns values as they appear and is supported for documents only.", fr: "extract renvoie les valeurs telles qu'elles apparaissent et n'est pris en charge que pour les documents." }
    items: { en: "items defines the element type of an array field.", fr: "items définit le type des éléments d'un champ tableau." }
    props: { en: "properties defines the subfields of an object field.", fr: "properties définit les sous-champs d'un champ objet." }
    cats: { en: "contentCategories is a config setting for classification and segmentation, not a field property.", fr: "contentCategories est un paramètre de config pour la classification et la segmentation, pas une propriété de champ." }
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
