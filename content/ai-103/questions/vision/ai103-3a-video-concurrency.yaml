id: ai103-3a-video-concurrency
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a `sora-2` deployment in a Microsoft Foundry resource. Every evening, a batch script submits five video creation jobs at the same time, one for each product. The first two jobs are accepted, and the other three creation requests fail. The prompts of the five jobs are similar and comply with the content policy.

    You need all five videos to be generated by the script. What should you do?
  fr: |
    Woodgrove Bank dispose d'un déploiement `sora-2` dans une ressource Microsoft Foundry. Chaque soir, un script de traitement par lots soumet cinq travaux de création vidéo en même temps, un par produit. Les deux premiers travaux sont acceptés, et les trois autres requêtes de création échouent. Les invites des cinq travaux sont similaires et respectent la stratégie de contenu.

    Vous devez faire en sorte que le script génère les cinq vidéos. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Reduce the `seconds` value of each job from 8 to 4"
        fr: "Réduire la valeur `seconds` de chaque travail de 8 à 4"
    - id: b
      text:
        en: "Change the `size` value of each job to `720x1280`"
        fr: "Changer la valeur `size` de chaque travail en `720x1280`"
    - id: c
      text:
        en: "Start a new job only when one of the running jobs has finished"
        fr: "Ne démarrer un nouveau travail que lorsqu'un des travaux en cours est terminé"
    - id: d
      text:
        en: "Combine the five products into the prompt of one 12-second job"
        fr: "Regrouper les cinq produits dans l'invite d'un seul travail de 12 secondes"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Sora 2 lets you run two video creation jobs at the same time; you wait for one to finish before you create another. The script must therefore queue the jobs and keep at most two of them running.
    fr: |
      Sora 2 permet d'exécuter deux travaux de création vidéo en même temps ; il faut attendre la fin de l'un d'eux avant d'en créer un autre. Le script doit donc mettre les travaux en file d'attente et n'en exécuter que deux au plus simultanément.
  options:
    a: { en: "A shorter duration doesn't change the limit on concurrent jobs.", fr: "Une durée plus courte ne change pas la limite de travaux simultanés." }
    b: { en: "The resolution doesn't change the limit on concurrent jobs.", fr: "La résolution ne change pas la limite de travaux simultanés." }
    d: { en: "One job produces one clip, not five separate product videos.", fr: "Un travail produit un clip, pas cinq vidéos de produit distinctes." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
