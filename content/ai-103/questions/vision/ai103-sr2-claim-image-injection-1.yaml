id: ai103-sr2-claim-image-injection-1
objective: "3.3.2"
type: series_yesno
series: ai103-sr2-claim-image-injection
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You extract the text of each image and send it to Prompt Shields as documents.
  fr: Vous extrayez le texte de chaque image et l'envoyez à Prompt Shields en tant que documents.
body:
  solution:
    en: |
      For each claim, the app first runs the Azure Content Understanding `prebuilt-read` analyzer on every image to extract its text. It then calls `text:shieldPrompt` of Azure AI Content Safety with the claim description in `userPrompt` and the text extracted from each image as one entry of `documents`. If `attackDetected` is `true` for the prompt or for any document, the app rejects the claim; otherwise, it sends the description and the images to the model.
    fr: |
      Pour chaque déclaration, l'application exécute d'abord l'analyseur `prebuilt-read` d'Azure Content Understanding sur chaque image pour en extraire le texte. Elle appelle ensuite `text:shieldPrompt` d'Azure AI Content Safety avec la description du sinistre dans `userPrompt` et le texte extrait de chaque image comme une entrée de `documents`. Si `attackDetected` vaut `true` pour l'invite ou pour l'un des documents, l'application rejette la déclaration ; sinon, elle envoie la description et les images au modèle.
answer: { value: true }
explanation:
  correct:
    en: Prompt Shields analyze text only, so the text must first be extracted from the images; `prebuilt-read` provides OCR for scanned and image-based documents. Text that comes from an uploaded file is third-party content, which the document attack check inspects through `documents`, up to five per request, one per image here. The check runs before the model call, so a claim with an attack is rejected before its images reach the model.
    fr: "Prompt Shields n'analyse que du texte : il faut donc d'abord extraire le texte des images, et `prebuilt-read` fournit l'OCR pour les documents numérisés ou sous forme d'image. Le texte provenant d'un fichier chargé est un contenu tiers, que la détection des attaques par document inspecte par le biais de `documents`, jusqu'à cinq par requête, ici un par image. La vérification s'exécute avant l'appel au modèle : une déclaration contenant une attaque est rejetée avant que ses images n'atteignent le modèle."
references:
  - title: Prompt Shields in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
