id: ai103-3b-inject-approval
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has a customer service agent that reads screenshots of payment confirmations sent by customers and can call a function named `issue_refund`. Prompt Shields document attack detection is already enabled on the text extracted from each screenshot.

    You need to ensure that no refund is issued because of an injected instruction that Prompt Shields didn't detect.

    What should you do?
  fr: |
    Litware dispose d'un agent de service client qui lit les captures d'écran de confirmations de paiement envoyées par les clients et peut appeler une fonction nommée `issue_refund`. La détection des attaques par document de Prompt Shields est déjà activée sur le texte extrait de chaque capture d'écran.

    Vous devez vous assurer qu'aucun remboursement n'est émis à cause d'une instruction injectée que Prompt Shields n'a pas détectée.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Lower the blocking level of the Hate and Violence categories of the guardrail to Low"
        fr: "Abaisser le niveau de blocage des catégories Hate et Violence du garde-fou à Low"
    - id: b
      text:
        en: "Add a system instruction that tells the agent never to follow text that appears in images"
        fr: "Ajouter une instruction système qui demande à l'agent de ne jamais suivre le texte qui apparaît dans les images"
    - id: c
      text:
        en: "Set `detail` to `low` on the image parts so that the model can't read small injected text"
        fr: "Définir `detail` sur `low` dans les parties image pour que le modèle ne puisse pas lire un petit texte injecté"
    - id: d
      text:
        en: "Make the app hold every `issue_refund` call until a staff member approves it"
        fr: "Faire en sorte que l'application retienne chaque appel à `issue_refund` jusqu'à ce qu'un membre du personnel l'approuve"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Detection can miss an attack, so the defense also limits its impact: an action with consequences, such as a payment, waits for human approval. Because the app executes the function calls that the agent requests, it can hold `issue_refund` until a staff member approves it, whatever the model was told.
    fr: |
      La détection peut manquer une attaque : la défense limite donc aussi son impact, et une action lourde de conséquences, comme un paiement, attend une approbation humaine. Comme l'application exécute les appels de fonction demandés par l'agent, elle peut retenir `issue_refund` jusqu'à l'approbation d'un membre du personnel, quoi qu'on ait dit au modèle.
  options:
    a:
      en: |
        Harm categories classify harmful content; an injected refund instruction isn't hateful or violent. Low is also the least restrictive level.
      fr: |
        Les catégories de préjudices classifient le contenu préjudiciable ; une instruction de remboursement injectée n'est ni haineuse ni violente. Low est en outre le niveau le moins restrictif.
    b:
      en: |
        The instruction reduces the risk, but an injected instruction can still override the model's behavior; it doesn't ensure that no refund is issued.
      fr: |
        L'instruction réduit le risque, mais une instruction injectée peut encore modifier le comportement du modèle ; elle ne garantit pas qu'aucun remboursement n'est émis.
    c:
      en: |
        A lower resolution degrades the reading of legitimate payment details and doesn't stop large injected text.
      fr: |
        Une résolution plus faible dégrade la lecture des informations de paiement légitimes et n'arrête pas un texte injecté de grande taille.
references:
  - title: Prompt Shields in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
