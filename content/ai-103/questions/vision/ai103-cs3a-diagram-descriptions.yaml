id: ai103-cs3a-diagram-descriptions
objective: "3.2.4"
type: yesno_statements
caseStudy: ai103-cs3a-lucerne
difficulty: 2
status: draft
stem:
  en: |
    To meet the accessibility requirement, studio-app will send each illustration to vision-chat by using the Chat Completions API and ask for the short alternative text and, for complex diagrams, the extended description. Some diagrams contain small axis labels and values, and some are made of a main image and up to three inset images stored as separate files.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pour satisfaire l'exigence d'accessibilité, studio-app enverra chaque illustration à vision-chat à l'aide de l'API Chat Completions et demandera le texte de remplacement court et, pour les diagrammes complexes, la description étendue. Certains diagrammes contiennent de petites étiquettes d'axe et des valeurs, et certains se composent d'une image principale et de jusqu'à trois images en médaillon stockées dans des fichiers distincts.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "For diagrams with small axis labels, setting `detail` to `low` for the image improves the accuracy of the extended description."
        fr: "Pour les diagrammes avec de petites étiquettes d'axe, définir `detail` sur `low` pour l'image améliore la précision de la description étendue."
    - id: s2
      text:
        en: "studio-app can send a main image and its three inset images in a single request to obtain one extended description of the whole diagram."
        fr: "studio-app peut envoyer une image principale et ses trois images en médaillon dans une seule requête pour obtenir une description étendue de l'ensemble du diagramme."
    - id: s3
      text:
        en: "studio-app can pass each image as the URL of a blob in a storage account that accepts traffic only through a private endpoint."
        fr: "studio-app peut transmettre chaque image sous la forme de l'URL d'un objet blob dans un compte de stockage qui n'accepte le trafic que par un point de terminaison privé."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      With `detail` set to `low`, the model processes a 512 x 512 version of the image, which reduces tokens but can reduce the accuracy of text recognition; small labels call for `high` or `auto`. A chat request can contain up to 10 images, so the model can describe a diagram and its insets together. Image URLs must be publicly accessible; for private storage, send the image as a base64 data URL instead.
    fr: |
      Avec `detail` défini sur `low`, le modèle traite une version 512 x 512 de l'image, ce qui réduit les jetons mais peut réduire la précision de la reconnaissance du texte ; de petites étiquettes demandent `high` ou `auto`. Une requête de conversation peut contenir jusqu'à 10 images : le modèle peut donc décrire un diagramme et ses médaillons ensemble. Les URL d'images doivent être accessibles publiquement ; pour un stockage privé, envoyez plutôt l'image sous forme d'URL de données base64.
references:
  - title: Use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
