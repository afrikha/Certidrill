id: ai103-3a-stream-preview-code
objective: "3.1.5"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has a `gpt-image-2` deployment named `sketch-img`. You are writing the Python code of a sketching app. The app must:

    - show two progressive previews of each image before the final image;
    - minimize the generation latency.

    The `show_preview()` function is already defined. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un déploiement `gpt-image-2` nommé `sketch-img`. Vous écrivez le code Python d'une application de croquis. L'application doit :

    - afficher deux aperçus progressifs de chaque image avant l'image finale ;
    - réduire au minimum la latence de génération.

    La fonction `show_preview()` est déjà définie. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    stream = client.images.generate(
        model="sketch-img",
        prompt=prompt,
        size="1024x1024",
        quality=[[quality]],
        [[flag]],
        partial_images=[[count]],
    )
    for event in stream:
        if event.type == [[evt]]:
            show_preview(event.partial_image_index, base64.b64decode(event.b64_json))
  slots:
    - id: quality
      options:
        - { id: low, text: "\"low\"" }
        - { id: medium, text: "\"medium\"" }
        - { id: high, text: "\"high\"" }
    - id: flag
      options:
        - { id: stream, text: stream=True }
        - { id: n2, text: n=2 }
        - { id: bg, text: "background=\"auto\"" }
    - id: count
      options:
        - { id: c1, text: "1" }
        - { id: c2, text: "2" }
        - { id: c4, text: "4" }
    - id: evt
      options:
        - { id: partial, text: "\"image_generation.partial_image\"" }
        - { id: call, text: "\"image_generation_call\"" }
        - { id: delta, text: "\"response.output_text.delta\"" }
answer:
  values: { quality: low, flag: stream, count: c2, evt: partial }
explanation:
  correct:
    en: |
      For GPT-image-2, the `low` quality is optimized for latency-sensitive use. Progressive previews require `stream=True` with `partial_images` set to the number of previews, here 2 (the parameter accepts at most 3). Each preview arrives as an event of type `image_generation.partial_image` that carries `partial_image_index` and the base64 data in `b64_json`.
    fr: |
      Pour GPT-image-2, la qualité `low` est optimisée pour les usages sensibles à la latence. Les aperçus progressifs nécessitent `stream=True` avec `partial_images` défini sur le nombre d'aperçus, ici 2 (le paramètre accepte au plus 3). Chaque aperçu arrive sous la forme d'un événement de type `image_generation.partial_image` qui porte `partial_image_index` et les données base64 dans `b64_json`.
  options:
    medium: { en: "Higher quality increases the generation latency.", fr: "Une qualité plus élevée augmente la latence de génération." }
    high: { en: "Higher quality increases the generation latency.", fr: "Une qualité plus élevée augmente la latence de génération." }
    n2: { en: "`n=2` returns two final images, not previews of one image.", fr: "`n=2` renvoie deux images finales, pas des aperçus d'une image." }
    bg: { en: "`background` controls transparency, not streaming.", fr: "`background` contrôle la transparence, pas le streaming." }
    c1: { en: "One partial image gives one preview, and two are required.", fr: "Une image partielle donne un aperçu, alors que deux sont exigés." }
    c4: { en: "`partial_images` accepts at most 3.", fr: "`partial_images` accepte au plus 3." }
    call: { en: "`image_generation_call` is the output item of the Responses API image generation tool, which doesn't stream.", fr: "`image_generation_call` est l'élément de sortie de l'outil de génération d'images de l'API Responses, qui ne prend pas en charge le streaming." }
    delta: { en: "This event type streams text from the Responses API, not partial images from the image API.", fr: "Ce type d'événement diffuse du texte de l'API Responses, pas des images partielles de l'API d'images." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
