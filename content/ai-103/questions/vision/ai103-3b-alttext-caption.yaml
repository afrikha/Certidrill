id: ai103-3b-alttext-caption
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys displays each product photo with a visible caption, such as "Tailspin glider kit, red". A Python app sends only the photo to a vision-enabled chat model and stores the returned alt text. Accessibility testers report that screen readers read the same information twice: the alt text repeats the caption.

    You need the alt text to follow the Microsoft accessibility guidance without adding a service.

    What should you do?
  fr: |
    Tailspin Toys affiche chaque photo de produit avec une légende visible, par exemple « Tailspin glider kit, red ». Une application Python envoie uniquement la photo à un modèle de conversation compatible vision et stocke le texte de remplacement renvoyé. Les testeurs d'accessibilité signalent que les lecteurs d'écran lisent deux fois la même information : le texte de remplacement répète la légende.

    Le texte de remplacement doit respecter les recommandations d'accessibilité de Microsoft sans ajouter de service.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Raise `max_output_tokens` so that the model returns a longer description that covers more than the caption"
        fr: "Augmenter `max_output_tokens` pour que le modèle renvoie une description plus longue qui couvre davantage que la légende"
    - id: b
      text:
        en: "Set `detail` to `high` on the image part so that the model describes more of the details that the caption doesn't mention"
        fr: "Définir `detail` sur `high` dans la partie image pour que le modèle décrive davantage les détails que la légende ne mentionne pas"
    - id: c
      text:
        en: "Send the caption and the surrounding page text with the photo, and instruct the model to convey what the photo adds without repeating them"
        fr: "Envoyer la légende et le texte environnant de la page avec la photo, et demander au modèle de transmettre ce que la photo apporte sans les répéter"
    - id: d
      text:
        en: "Use the file name of each photo as the alt text, because the file names already differ from the captions"
        fr: "Utiliser le nom du fichier de chaque photo comme texte de remplacement, car les noms de fichiers diffèrent déjà des légendes"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Alt text must convey the image's purpose in its context and must not simply repeat the surrounding text or the caption. The model can only avoid the caption if it receives it, so the request includes the caption and the page text with an instruction not to repeat them.
    fr: |
      Le texte de remplacement doit transmettre l'objectif de l'image dans son contexte et ne doit pas simplement répéter le texte environnant ou la légende. Le modèle ne peut éviter la légende que s'il la reçoit : la requête inclut donc la légende et le texte de la page avec l'instruction de ne pas les répéter.
  options:
    a:
      en: |
        A longer output doesn't remove the repetition and works against the concise, 150-character alt text that the guidance asks for.
      fr: |
        Une sortie plus longue ne supprime pas la répétition et va à l'encontre du texte de remplacement concis, de 150 caractères au plus, que demandent les recommandations.
    b:
      en: |
        `detail` changes the resolution the model sees; the model still doesn't know the caption and can still repeat it.
      fr: |
        `detail` change la résolution que voit le modèle ; le modèle ne connaît toujours pas la légende et peut encore la répéter.
    d:
      en: |
        The guidance explicitly says not to use the file name of an image as alt text.
      fr: |
        Les recommandations interdisent explicitement d'utiliser le nom du fichier d'une image comme texte de remplacement.
references:
  - title: Alternative text (alt text)
    url: https://learn.microsoft.com/en-us/style-guide/accessibility/alternative-text
