id: ai103-3a-video-job-steps
objective: "3.1.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. has a `sora-2` deployment named `clip-gen` in a Microsoft Foundry resource. You are writing a Python script that uses the OpenAI client library to turn a text prompt into an MP4 file saved on disk.

    Which three actions should the script perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware, Inc. dispose d'un déploiement `sora-2` nommé `clip-gen` dans une ressource Microsoft Foundry. Vous écrivez un script Python qui utilise la bibliothèque cliente OpenAI pour transformer une invite de texte en fichier MP4 enregistré sur le disque.

    Quelles sont les trois actions que le script doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Call `client.videos.create` with the deployment name and the prompt.", fr: "Appeler `client.videos.create` avec le nom du déploiement et l'invite." } }
    - { id: poll, text: { en: "Call `client.videos.retrieve` at intervals until the status is `completed`.", fr: "Appeler `client.videos.retrieve` à intervalles réguliers jusqu'à ce que l'état soit `completed`." } }
    - { id: download, text: { en: "Call `client.videos.download_content` with the video ID and write the content to a file.", fr: "Appeler `client.videos.download_content` avec l'ID de la vidéo et écrire le contenu dans un fichier." } }
    - { id: remix, text: { en: "Call `client.videos.remix` with the video ID to finalize the rendering.", fr: "Appeler `client.videos.remix` avec l'ID de la vidéo pour finaliser le rendu." } }
    - { id: frame, text: { en: "Call `client.images.generate` to create the first frame of the video.", fr: "Appeler `client.images.generate` pour créer la première image de la vidéo." } }
    - { id: url, text: { en: "Read the download URL from the response of `client.videos.create`.", fr: "Lire l'URL de téléchargement dans la réponse de `client.videos.create`." } }
answer:
  sequence: [ create, poll, download ]
explanation:
  correct:
    en: |
      Video generation with Sora 2 is an asynchronous job. `videos.create` returns at once with a queued job, so the script polls `videos.retrieve` until the job reaches `completed` (or `failed` or `cancelled`), and then downloads the MP4 with `videos.download_content`.
    fr: |
      La génération vidéo avec Sora 2 est un travail asynchrone. `videos.create` répond immédiatement avec un travail en file d'attente : le script interroge `videos.retrieve` jusqu'à ce que le travail atteigne `completed` (ou `failed`, ou `cancelled`), puis télécharge le fichier MP4 avec `videos.download_content`.
  options:
    remix: { en: "A remix creates a new video with a targeted change; it isn't a step of a normal generation.", fr: "Un remix crée une nouvelle vidéo avec une modification ciblée ; ce n'est pas une étape d'une génération normale." }
    frame: { en: "A first-frame image is optional (`input_reference`) and the requirement starts from text only.", fr: "Une image de première trame est facultative (`input_reference`) et l'exigence part uniquement du texte." }
    url: { en: "The creation response describes a queued job; the video content is downloaded once the job is completed.", fr: "La réponse de création décrit un travail en file d'attente ; le contenu vidéo se télécharge une fois le travail terminé." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
