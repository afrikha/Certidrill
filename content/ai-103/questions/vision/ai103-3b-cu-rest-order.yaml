id: ai103-3b-cu-rest-order
objective: "3.2.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Foundry resource. Default model deployments for Azure Content Understanding are already configured on the resource. You wrote the JSON definition of a custom image analyzer named **shelfCheck** that uses `prebuilt-image` as its base analyzer.

    You need a Python script to return the fields of **shelfCheck** for a store photo that is available at a public URL. The script calls the REST API with API version `2025-11-01`.

    Which three actions should the script perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'une ressource Microsoft Foundry. Les déploiements de modèles par défaut d'Azure Content Understanding sont déjà configurés sur la ressource. Vous avez rédigé la définition JSON d'un analyseur d'images personnalisé nommé **shelfCheck** qui utilise `prebuilt-image` comme analyseur de base.

    Un script Python doit renvoyer les champs de **shelfCheck** pour une photo de magasin disponible à une URL publique. Le script appelle l'API REST avec la version d'API `2025-11-01`.

    Quelles sont les trois actions que le script doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: put, text: { en: "Send a PUT request to `/contentunderstanding/analyzers/shelfCheck` with the analyzer definition.", fr: "Envoyer une requête PUT à `/contentunderstanding/analyzers/shelfCheck` avec la définition de l'analyseur." } }
    - { id: post, text: { en: "Send a POST request to `/contentunderstanding/analyzers/shelfCheck:analyze` with the photo URL in `inputs`.", fr: "Envoyer une requête POST à `/contentunderstanding/analyzers/shelfCheck:analyze` avec l'URL de la photo dans `inputs`." } }
    - { id: poll, text: { en: "Send GET requests to the URL of the `Operation-Location` header until `status` is `Succeeded`, then read `fields`.", fr: "Envoyer des requêtes GET à l'URL de l'en-tête `Operation-Location` jusqu'à ce que `status` vaille `Succeeded`, puis lire `fields`." } }
    - { id: label, text: { en: "Label a set of store photos in Content Understanding Studio and train the analyzer.", fr: "Étiqueter un ensemble de photos de magasin dans Content Understanding Studio et entraîner l'analyseur." } }
    - { id: safety, text: { en: "Send the photo to `/contentsafety/image:analyze` and wait for the categories analysis.", fr: "Envoyer la photo à `/contentsafety/image:analyze` et attendre l'analyse des catégories." } }
    - { id: read, text: { en: "Read the fields from the body of the 202 Accepted response of the analyze request.", fr: "Lire les champs dans le corps de la réponse 202 Accepted de la requête d'analyse." } }
answer:
  sequence: [ put, post, poll ]
explanation:
  correct:
    en: |
      A custom analyzer is created with a PUT request on its analyzer ID. Analysis is asynchronous: the POST request to `:analyze` returns 202 Accepted with an `Operation-Location` header, and you poll that URL until `status` is `Succeeded`; the result then contains the fields.
    fr: |
      Un analyseur personnalisé se crée avec une requête PUT sur son ID d'analyseur. L'analyse est asynchrone : la requête POST vers `:analyze` renvoie 202 Accepted avec un en-tête `Operation-Location`, et vous interrogez cette URL jusqu'à ce que `status` vaille `Succeeded` ; le résultat contient alors les champs.
  options:
    label: { en: "The analyzer works from its field schema and descriptions; labeling isn't required to get results.", fr: "L'analyseur fonctionne à partir de son schéma de champs et de ses descriptions ; l'étiquetage n'est pas nécessaire pour obtenir des résultats." }
    safety: { en: "Content Safety classifies harmful content; it doesn't run a Content Understanding analyzer.", fr: "Content Safety classifie le contenu préjudiciable ; il n'exécute pas d'analyseur Content Understanding." }
    read: { en: "The 202 response only acknowledges the request; the result is read from the Operation-Location URL.", fr: "La réponse 202 ne fait qu'accuser réception de la requête ; le résultat se lit à l'URL Operation-Location." }
references:
  - title: "Quickstart: Azure Content Understanding in Foundry Tools"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
