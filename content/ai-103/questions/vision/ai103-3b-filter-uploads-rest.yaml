id: ai103-3b-filter-uploads-rest
objective: "3.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a photo-sharing community for children's sports clubs. Uploaded photos are stored in Azure Blob Storage and are never sent to a generative model. The Azure AI Content Safety resource can already read the storage account.

    Before a photo is published, an Azure Function must classify it without downloading it, and reject it if any category is rated low severity or higher.

    How should you complete the design? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware gère une communauté de partage de photos pour des clubs sportifs d'enfants. Les photos chargées sont stockées dans Stockage Blob Azure et ne sont jamais envoyées à un modèle génératif. La ressource Azure AI Content Safety peut déjà lire le compte de stockage.

    Avant la publication d'une photo, une fonction Azure doit la classifier sans la télécharger, et la rejeter si une catégorie atteint une gravité faible ou plus.

    Comment devez-vous compléter la conception ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Send a POST request to [[op]].
      Pass the photo in the [[src]] property of the image object.
      Reject the photo when a returned severity is [[thr]] or higher.
    fr: |
      Envoyer une requête POST à [[op]].
      Transmettre la photo dans la propriété [[src]] de l'objet image.
      Rejeter la photo quand une gravité renvoyée vaut [[thr]] ou plus.
  slots:
    - id: op
      options:
        - { id: image, text: "/contentsafety/image:analyze" }
        - { id: text, text: "/contentsafety/text:analyze" }
        - { id: shield, text: "/contentsafety/text:shieldPrompt" }
        - { id: cu, text: "/contentunderstanding/analyzers/prebuilt-image:analyze" }
    - id: src
      options:
        - { id: blob, text: blobUrl }
        - { id: content, text: content }
        - { id: url, text: url }
    - id: thr
      options:
        - { id: s0, text: "0" }
        - { id: s2, text: "2" }
        - { id: s4, text: "4" }
        - { id: s6, text: "6" }
answer:
  values: { op: image, src: blob, thr: s2 }
explanation:
  correct:
    en: |
      Content Safety's image:analyze operation classifies an image for hate, self-harm, sexual and violence content. The image object takes either base64 `content` or a `blobUrl`; a blob URL lets the service read the photo without the function downloading it. Images return only the severities 0 (safe), 2 (low), 4 (medium) and 6 (high), so "low or higher" means 2 or higher.
    fr: |
      L'opération image:analyze de Content Safety classifie une image pour la haine, l'automutilation, le contenu sexuel et la violence. L'objet image reçoit soit un `content` en base64, soit un `blobUrl` ; une URL de blob permet au service de lire la photo sans que la fonction la télécharge. Les images ne renvoient que les gravités 0 (safe), 2 (faible), 4 (moyenne) et 6 (élevée) : « faible ou plus » signifie donc 2 ou plus.
  options:
    text: { en: "text:analyze classifies text, not images.", fr: "text:analyze classifie du texte, pas des images." }
    shield: { en: "shieldPrompt detects prompt attacks in text; it doesn't rate harmful imagery.", fr: "shieldPrompt détecte les attaques par invite dans du texte ; il n'évalue pas les images préjudiciables." }
    cu: { en: "prebuilt-image is a base analyzer for custom analyzers; it doesn't return harm severities.", fr: "prebuilt-image est un analyseur de base pour les analyseurs personnalisés ; il ne renvoie pas de gravités de préjudice." }
    content: { en: "content requires the function to read the photo and send it as base64.", fr: "content oblige la fonction à lire la photo et à l'envoyer en base64." }
    s0: { en: "0 is the safe level: every photo would be rejected.", fr: "0 est le niveau safe : toutes les photos seraient rejetées." }
    s4: { en: "4 is medium: low-severity photos would be published.", fr: "4 correspond à une gravité moyenne : les photos de gravité faible seraient publiées." }
references:
  - title: "Quickstart: Analyze image content"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image
  - title: Harm categories in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories
