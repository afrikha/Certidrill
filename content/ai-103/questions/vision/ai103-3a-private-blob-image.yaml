id: ai103-3a-private-blob-image
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Logistics stores photos of damaged parcels in a storage account that allows access only through a private endpoint in a virtual network named VNet1. An app in VNet1 sends the blob URL of each photo, in an `image_url` content part, to a `gpt-4.1` deployment in a Microsoft Foundry resource and asks for a damage assessment. The model can't read the images. The storage account must stay private.

    You need the model to analyze the photos. What should you do?
  fr: |
    Tailspin Logistics stocke les photos de colis endommagés dans un compte de stockage qui n'autorise l'accès que par un point de terminaison privé dans un réseau virtuel nommé VNet1. Une application de VNet1 envoie l'URL de blob de chaque photo, dans une partie de contenu `image_url`, à un déploiement `gpt-4.1` d'une ressource Microsoft Foundry et demande une évaluation des dommages. Le modèle ne parvient pas à lire les images. Le compte de stockage doit rester privé.

    Vous devez faire en sorte que le modèle analyse les photos. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Create a private endpoint for the Foundry resource in VNet1"
        fr: "Créer un point de terminaison privé pour la ressource Foundry dans VNet1"
    - id: b
      text:
        en: "Have the app read each blob and send the photo as a base64 data URL in the request"
        fr: "Faire lire chaque blob par l'application et envoyer la photo sous forme d'URL de données base64 dans la requête"
    - id: c
      text:
        en: "Peer VNet1 with a new virtual network that hosts a private endpoint of the Foundry resource"
        fr: "Créer un peering entre VNet1 et un nouveau réseau virtuel qui héberge un point de terminaison privé de la ressource Foundry"
    - id: d
      text:
        en: "Set the `detail` value of each image part to `high`"
        fr: "Définir la valeur `detail` de chaque partie d'image sur `high`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Image URLs sent to a vision-enabled model must be publicly accessible: URLs behind private endpoints, virtual network restrictions or firewalls aren't supported, even on a storage account in the same or a peered virtual network, because the images are fetched from Microsoft-managed infrastructure. The app can read the blob itself over the private endpoint and send the image as base64 data in a data URL.
    fr: |
      Les URL d'images envoyées à un modèle compatible avec la vision doivent être accessibles publiquement : les URL derrière un point de terminaison privé, une restriction de réseau virtuel ou un pare-feu ne sont pas prises en charge, même pour un compte de stockage du même réseau virtuel ou d'un réseau virtuel connecté par peering, car les images sont récupérées depuis une infrastructure gérée par Microsoft. L'application peut lire elle-même le blob via le point de terminaison privé et envoyer l'image sous forme de données base64 dans une URL de données.
  options:
    a: { en: "A private endpoint for the Foundry resource secures inbound calls but doesn't change how image URLs are fetched; private URLs remain unsupported.", fr: "Un point de terminaison privé pour la ressource Foundry sécurise les appels entrants mais ne change pas la façon dont les URL d'images sont récupérées ; les URL privées restent non prises en charge." }
    c: { en: "URLs on a storage account in a peered virtual network are explicitly not supported.", fr: "Les URL d'un compte de stockage situé dans un réseau virtuel connecté par peering ne sont explicitement pas prises en charge." }
    d: { en: "`detail` sets the resolution at which the image is processed; it doesn't make a private URL reachable.", fr: "`detail` définit la résolution à laquelle l'image est traitée ; il ne rend pas une URL privée accessible." }
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
