id: ai103-3a-edit-statements
objective: "3.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. is building a photo retouching feature on a `gpt-image-1.5` deployment by using the edits operation. The team lists what it expects from the feature.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. crée une fonctionnalité de retouche de photos sur un déploiement `gpt-image-1.5` à l'aide de l'opération de modification. L'équipe liste ce qu'elle attend de la fonctionnalité.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "When an edit request contains a photo and a prompt but no mask, the model may change any part of the photo."
        fr: "Quand une requête de modification contient une photo et une invite mais pas de masque, le modèle peut changer n'importe quelle partie de la photo."
    - id: s2
      text:
        en: "In a mask, the opaque pixels mark the area that the model regenerates."
        fr: "Dans un masque, les pixels opaques délimitent la zone que le modèle régénère."
    - id: s3
      text:
        en: "One edit request can include 12 input images in JPG format."
        fr: "Une requête de modification peut inclure 12 images d'entrée au format JPG."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Without a mask, a prompt-driven edit follows the prompt and isn't limited to a region. In a mask, the fully transparent pixels (alpha 0) mark the area to edit and the opaque pixels are kept. The edits operation accepts up to 16 input images, PNG or JPG, each under 50 MB.
    fr: |
      Sans masque, une modification guidée par l'invite suit l'invite et n'est pas limitée à une zone. Dans un masque, ce sont les pixels entièrement transparents (alpha 0) qui délimitent la zone à modifier, et les pixels opaques sont conservés. L'opération de modification accepte jusqu'à 16 images d'entrée, PNG ou JPG, de moins de 50 Mo chacune.
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
