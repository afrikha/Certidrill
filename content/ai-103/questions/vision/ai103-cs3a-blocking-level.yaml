id: ai103-cs3a-blocking-level
objective: "3.3.1"
type: single
caseStudy: ai103-cs3a-lucerne
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    You are configuring the guardrail that is assigned to image-gen. You need to meet the child safety requirement. Which blocking level should you set for the Sexual and Violence categories?
  fr: |
    Vous configurez le garde-fou affecté à image-gen. Vous devez satisfaire l'exigence de protection des enfants. Quel niveau de blocage devez-vous définir pour les catégories Sexual et Violence ?
body:
  options:
    - { id: a, text: "Off" }
    - { id: b, text: "Low" }
    - { id: c, text: "Medium" }
    - { id: d, text: "High" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The blocking level of a category decides which classified severities are blocked. High is the most restrictive level and blocks content classified at low, medium, and high severity, which is what the requirement asks for. Content classified as safe is annotated but never blocked.
    fr: |
      Le niveau de blocage d'une catégorie détermine les niveaux de gravité classés qui sont bloqués. High est le niveau le plus restrictif et bloque le contenu classé à une gravité faible, moyenne et élevée, ce que demande l'exigence. Le contenu classé comme sûr (safe) est annoté mais jamais bloqué.
  options:
    a:
      en: |
        Off turns off blocking for the category.
      fr: |
        Off désactive le blocage pour la catégorie.
    b:
      en: |
        Low is the least restrictive level and blocks only high-severity content.
      fr: |
        Low est le niveau le moins restrictif et ne bloque que le contenu de gravité élevée.
    c:
      en: |
        Medium blocks medium- and high-severity content, so content classified at a low severity would pass.
      fr: |
        Medium bloque le contenu de gravité moyenne et élevée ; le contenu classé à une gravité faible passerait.
references:
  - title: Harm categories and severity levels in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter-severity-levels
