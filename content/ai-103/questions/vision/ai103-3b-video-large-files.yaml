id: ai103-3b-video-large-files
objective: "3.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores recordings of its webinars in Azure Blob Storage. Each recording is an MP4 file of about 75 minutes and 1.5 GB at 1920 x 1080. The Microsoft Foundry resource can already read the storage container.

    You need to process each recording with an existing Azure Content Understanding video analyzer. The solution must minimize development effort and must not split or re-encode the files.

    What should the Python app do?
  fr: |
    Fabrikam stocke les enregistrements de ses webinaires dans Stockage Blob Azure. Chaque enregistrement est un fichier MP4 d'environ 75 minutes et 1,5 Go en 1920 x 1080. La ressource Microsoft Foundry peut déjà lire le conteneur de stockage.

    Vous devez traiter chaque enregistrement avec un analyseur vidéo Azure Content Understanding existant. La solution doit réduire au minimum l'effort de développement et ne doit ni découper ni réencoder les fichiers.

    Que doit faire l'application Python ?
body:
  options:
    - id: a
      text:
        en: "Compress each recording to less than 200 MB, then call the analyzeBinary operation with the file"
        fr: "Compresser chaque enregistrement à moins de 200 Mo, puis appeler l'opération analyzeBinary avec le fichier"
    - id: b
      text:
        en: "Cut each recording into 30-minute clips, then call the analyzeBinary operation for each clip"
        fr: "Découper chaque enregistrement en extraits de 30 minutes, puis appeler l'opération analyzeBinary pour chaque extrait"
    - id: c
      text:
        en: "Call the analyze operation and pass the blob URL of the recording in `inputs`"
        fr: "Appeler l'opération analyze et transmettre l'URL du blob de l'enregistrement dans `inputs`"
    - id: d
      text:
        en: "Call the analyzeBinary operation and upload the bytes of the recording in the request body"
        fr: "Appeler l'opération analyzeBinary et charger les octets de l'enregistrement dans le corps de la requête"
answer: { optionId: c }
explanation:
  correct:
    en: |
      With a file reference such as a Blob Storage URL, the analyze operation accepts videos up to 4 GB and two hours. Direct upload with analyzeBinary is limited to 200 MB and 30 minutes, so a 75-minute, 1.5 GB recording must be passed by URL. The resolution is within the 1920 x 1080 maximum.
    fr: |
      Avec une référence de fichier comme une URL de Stockage Blob, l'opération analyze accepte des vidéos jusqu'à 4 Go et deux heures. Le chargement direct avec analyzeBinary est limité à 200 Mo et 30 minutes : un enregistrement de 75 minutes et 1,5 Go doit donc être transmis par URL. La résolution respecte le maximum de 1920 x 1080.
  options:
    a:
      en: |
        Compression re-encodes the file, which is not allowed, and a 75-minute video still exceeds the 30-minute limit of analyzeBinary.
      fr: |
        La compression réencode le fichier, ce qui est interdit, et une vidéo de 75 minutes dépasse toujours la limite de 30 minutes d'analyzeBinary.
    b:
      en: |
        Splitting the files is not allowed and adds development effort, and segments of one recording would be analyzed separately.
      fr: |
        Le découpage des fichiers est interdit et ajoute de l'effort de développement, et les segments d'un même enregistrement seraient analysés séparément.
    d:
      en: |
        analyzeBinary accepts at most 200 MB and 30 minutes of video; the recording exceeds both limits.
      fr: |
        analyzeBinary accepte au plus 200 Mo et 30 minutes de vidéo ; l'enregistrement dépasse ces deux limites.
references:
  - title: Service quotas and limits - Content Understanding
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/service-limits
