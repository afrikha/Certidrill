id: ai103-3a-finish-reason
objective: "3.2.1"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders sends photos of delivered pallets to a vision-enabled model deployment by using the Chat Completions API, with `max_completion_tokens` set to 300. The following table shows the log of four requests.

    Answer each prompt by selecting the request in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders envoie des photos de palettes livrées à un déploiement de modèle compatible avec la vision à l'aide de l'API Chat Completions, avec `max_completion_tokens` défini sur 300. Le tableau suivant présente le journal de quatre requêtes.

    Répondez à chaque consigne en sélectionnant la requête dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The request whose answer was cut off and that needs a higher `max_completion_tokens` value", fr: "La requête dont la réponse a été tronquée et qui nécessite une valeur `max_completion_tokens` plus élevée" }
    - id: p2
      text: { en: "The request whose content was omitted because of a content filter flag", fr: "La requête dont le contenu a été omis en raison d'un signalement d'un filtre de contenu" }
  grid:
    header: [{ en: "Request", fr: "Requête" }, { en: "Images", fr: "Images" }, finish_reason, { en: "Completion tokens", fr: "Jetons de complétion" }]
    rows:
      - [{ text: req-101, area: r101 }, { text: "1" }, { text: stop }, { text: "212" }]
      - [{ text: req-102, area: r102 }, { text: "3" }, { text: length }, { text: "300" }]
      - [{ text: req-103, area: r103 }, { text: "2" }, { text: content_filter }, { text: "41" }]
      - [{ text: req-104, area: r104 }, { text: "4" }, { text: stop }, { text: "297" }]
answer:
  values: { p1: r102, p2: r103 }
explanation:
  correct:
    en: |
      A `finish_reason` of `length` means the output was cut off by the token limit, so req-102 needs a higher `max_completion_tokens` value. `content_filter` means that content was omitted because of a content filter flag, as in req-103. `stop` means the output is complete, even when it is close to the limit, as in req-104.
    fr: |
      Une valeur `finish_reason` égale à `length` signifie que la sortie a été tronquée par la limite de jetons : req-102 nécessite une valeur `max_completion_tokens` plus élevée. `content_filter` signifie que du contenu a été omis en raison d'un signalement d'un filtre de contenu, comme pour req-103. `stop` signifie que la sortie est complète, même quand elle approche la limite, comme pour req-104.
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
