id: ai103-3b-cu-receipt-photos
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum Logistics drivers photograph each signed delivery receipt with a phone. You are designing an Azure Content Understanding custom analyzer that processes the photos. The analyzer must return the receipt number and the total amount exactly as they are printed, with a confidence score for each value.

    How should you design the analyzer?
  fr: |
    Les chauffeurs d'Adatum Logistics photographient chaque bon de livraison signé avec un téléphone. Vous concevez un analyseur personnalisé Azure Content Understanding qui traite les photos. L'analyseur doit renvoyer le numéro du bon et le montant total exactement tels qu'ils sont imprimés, avec un score de confiance pour chaque valeur.

    Comment devez-vous concevoir l'analyseur ?
body:
  options:
    - id: a
      text:
        en: "Use `prebuilt-image` as the base analyzer, add the two fields with the `generate` method, and set `returnDetails` to `true`"
        fr: "Utiliser `prebuilt-image` comme analyseur de base, ajouter les deux champs avec la méthode `generate`, et définir `returnDetails` sur `true`"
    - id: b
      text:
        en: "Use `prebuilt-imageSearch` without a field schema, and read the receipt number and the total from the description it returns"
        fr: "Utiliser `prebuilt-imageSearch` sans schéma de champs, et lire le numéro du bon et le total dans la description qu'il renvoie"
    - id: c
      text:
        en: "Use `prebuilt-document` as the base analyzer, add the two fields with the `extract` method, and enable `estimateFieldSourceAndConfidence`"
        fr: "Utiliser `prebuilt-document` comme analyseur de base, ajouter les deux champs avec la méthode `extract`, et activer `estimateFieldSourceAndConfidence`"
    - id: d
      text:
        en: "Use `prebuilt-image` as the base analyzer, add the two fields with the `extract` method, and enable `estimateFieldSourceAndConfidence`"
        fr: "Utiliser `prebuilt-image` comme analyseur de base, ajouter les deux champs avec la méthode `extract`, et activer `estimateFieldSourceAndConfidence`"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Image analyzers aren't optimized for analysis that relies mainly on text in the image; Learn recommends a document field extraction schema instead. A document analyzer supports `extract`, which returns values as they appear, and `estimateFieldSourceAndConfidence`, which adds the source and a 0 to 1 confidence score to each field.
    fr: |
      Les analyseurs d'images ne sont pas optimisés pour une analyse qui repose surtout sur le texte de l'image ; Learn recommande plutôt un schéma d'extraction de champs de documents. Un analyseur de documents prend en charge `extract`, qui renvoie les valeurs telles qu'elles apparaissent, et `estimateFieldSourceAndConfidence`, qui ajoute à chaque champ sa source et un score de confiance de 0 à 1.
  options:
    a:
      en: |
        `generate` infers a value instead of returning it as printed, and an image analyzer doesn't return per-field confidence scores; image analyzers also aren't designed for text-based extraction.
      fr: |
        `generate` déduit une valeur au lieu de la renvoyer telle qu'elle est imprimée, et un analyseur d'images ne renvoie pas de score de confiance par champ ; les analyseurs d'images ne sont pas non plus conçus pour l'extraction fondée sur le texte.
    b:
      en: |
        `prebuilt-imageSearch` returns a descriptive paragraph for search and retrieval, not typed fields with confidence scores.
      fr: |
        `prebuilt-imageSearch` renvoie un paragraphe descriptif pour la recherche et la récupération, pas des champs typés avec des scores de confiance.
    d:
      en: |
        The `extract` method and `estimateFieldSourceAndConfidence` are supported only by document analyzers, not by image analyzers.
      fr: |
        La méthode `extract` et `estimateFieldSourceAndConfidence` ne sont prises en charge que par les analyseurs de documents, pas par les analyseurs d'images.
references:
