id: ai103-3a-concise-captions
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Photos sends each of 5,000 thumbnails of a stock photo gallery to a `gpt-4.1-mini` deployment by using the Responses API. The current instruction asks for a full description of the image, and each image is sent with `detail` set to `high`. The gallery needs one short caption of one sentence per thumbnail. You must minimize token usage and latency.

    What should you do?
  fr: |
    Wingtip Photos envoie chacune des 5 000 miniatures d'une galerie de photos à un déploiement `gpt-4.1-mini` à l'aide de l'API Responses. L'instruction actuelle demande une description complète de l'image, et chaque image est envoyée avec `detail` défini sur `high`. La galerie a besoin d'une courte légende d'une phrase par miniature. Vous devez réduire au minimum l'utilisation des jetons et la latence.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Deploy `gpt-4.1` and keep only the first sentence of each answer in the gallery"
        fr: "Déployer `gpt-4.1` et ne garder dans la galerie que la première phrase de chaque réponse"
    - id: b
      text:
        en: "Ask for one sentence of at most 15 words, set `detail` to `low`, and lower `max_output_tokens`"
        fr: "Demander une phrase de 15 mots au plus, définir `detail` sur `low` et réduire `max_output_tokens`"
    - id: c
      text:
        en: "Truncate each answer to 15 words in the application code before it is stored"
        fr: "Tronquer chaque réponse à 15 mots dans le code de l'application avant son stockage"
    - id: d
      text:
        en: "Set `temperature` to 0 in each request so that the answers are more focused"
        fr: "Définir `temperature` sur 0 dans chaque requête pour que les réponses soient plus ciblées"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Caption length is controlled by the instruction, so asking for one short sentence produces a concise caption without a new model. A `detail` value of `low` processes a 512x512 version of the image, which is faster and uses fewer tokens and is enough for a thumbnail, and a lower output token limit keeps the answers short.
    fr: |
      La longueur de la légende se contrôle par l'instruction : demander une courte phrase produit une légende concise sans nouveau modèle. Une valeur `detail` égale à `low` traite une version 512x512 de l'image, plus rapide et moins consommatrice de jetons, ce qui suffit pour une miniature, et une limite de jetons de sortie plus basse garde les réponses courtes.
  options:
    a: { en: "A larger model costs more, and the full descriptions still consume the same output tokens.", fr: "Un modèle plus grand coûte plus cher, et les descriptions complètes consomment toujours autant de jetons de sortie." }
    c: { en: "The model still generates full descriptions with high detail, so token usage and latency don't decrease.", fr: "Le modèle génère toujours des descriptions complètes avec un détail élevé : l'utilisation des jetons et la latence ne baissent pas." }
    d: { en: "Temperature changes randomness, not the length of the caption or the number of image tokens.", fr: "La température change le caractère aléatoire, pas la longueur de la légende ni le nombre de jetons d'image." }
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
