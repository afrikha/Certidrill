id: ai103-3a-vision-model
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum Insurance has a Microsoft Foundry resource. Adjusters upload photos of damaged vehicles, and an app must return a short written assessment of the visible damage for each photo. The assessment is generated by a model from the photo and an instruction.

    Which model should you deploy for the app?
  fr: |
    Adatum Insurance dispose d'une ressource Microsoft Foundry. Les experts chargent des photos de véhicules endommagés, et une application doit renvoyer pour chaque photo une courte évaluation écrite des dommages visibles. L'évaluation est générée par un modèle à partir de la photo et d'une instruction.

    Quel modèle devez-vous déployer pour l'application ?
body:
  options:
    - { id: a, text: "text-embedding-3-large" }
    - { id: b, text: "gpt-image-1.5" }
    - { id: c, text: "sora-2" }
    - { id: d, text: "gpt-4.1" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A vision-enabled chat model, such as a model of the GPT-4.1 series, accepts images with a text prompt and returns text. It can describe and assess what a photo shows according to the instruction.
    fr: |
      Un modèle de conversation compatible avec la vision, comme un modèle de la série GPT-4.1, accepte des images avec une invite de texte et renvoie du texte. Il peut décrire et évaluer ce que montre une photo selon l'instruction.
  options:
    a: { en: "An embedding model returns vectors, not a written assessment.", fr: "Un modèle d'incorporation renvoie des vecteurs, pas une évaluation écrite." }
    b: { en: "GPT-image models generate and edit images; their output is an image, not a text assessment.", fr: "Les modèles GPT-image génèrent et modifient des images ; leur sortie est une image, pas une évaluation écrite." }
    c: { en: "Sora 2 generates videos; it doesn't analyze photos.", fr: "Sora 2 génère des vidéos ; il n'analyse pas de photos." }
references:
  - title: How to use vision-enabled chat models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/gpt-with-vision
