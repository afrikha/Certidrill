id: ai103-3b-policy-review
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso checks every banner before publication with an Azure Content Understanding image analyzer. The analyzer has two `classify` fields: `logoVersion` (Current, Legacy, NoLogo) and `prohibitedSymbol` (Present, Absent, Uncertain).

    The solution must meet the following requirements:

    - No banner that breaks a brand rule, or whose compliance can't be confirmed, is published automatically.
    - Auditors can see, for each banner, the analysis result, the decision and who made it.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso vérifie chaque bannière avant publication avec un analyseur d'images Azure Content Understanding. L'analyseur possède deux champs `classify` : `logoVersion` (Current, Legacy, NoLogo) et `prohibitedSymbol` (Present, Absent, Uncertain).

    La solution doit satisfaire les exigences suivantes :

    - Aucune bannière qui enfreint une règle de marque, ou dont la conformité ne peut pas être confirmée, n'est publiée automatiquement.
    - Les auditeurs peuvent voir, pour chaque bannière, le résultat de l'analyse, la décision et son auteur.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the blocking level of all harm categories to High in the guardrail of the model that the analyzer uses.", fr: "Définir le niveau de blocage de toutes les catégories de préjudices sur High dans le garde-fou du modèle utilisé par l'analyseur." } }
    - { id: b, text: { en: "Store the analysis result, the decision and the reviewer's identity with each banner.", fr: "Stocker le résultat de l'analyse, la décision et l'identité du relecteur avec chaque bannière." } }
    - { id: c, text: { en: "Send each banner with a Legacy logo, a Present symbol or an Uncertain symbol to a human review queue.", fr: "Envoyer chaque bannière avec un logo Legacy, un symbole Present ou un symbole Uncertain dans une file de revue humaine." } }
    - { id: d, text: { en: "Read the Content Credentials of each banner to detect Legacy logos.", fr: "Lire les Content Credentials de chaque bannière pour détecter les logos Legacy." } }
    - { id: e, text: { en: "Change `prohibitedSymbol` to the `generate` method so that the model never returns Uncertain.", fr: "Passer `prohibitedSymbol` à la méthode `generate` pour que le modèle ne renvoie jamais Uncertain." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Brand rules and prohibited symbols are company policies, so the application acts on the analyzer's fields: any failed rule or Uncertain value goes to a human reviewer instead of being published. Storing the analysis result, the decision and the reviewer with each asset provides the audit trail.
    fr: |
      Les règles de marque et les symboles interdits sont des stratégies propres à l'entreprise : l'application agit donc sur les champs de l'analyseur, et toute règle non respectée ou valeur Uncertain part chez un relecteur humain au lieu d'être publiée. Stocker le résultat de l'analyse, la décision et le relecteur avec chaque ressource fournit la piste d'audit.
  options:
    a:
      en: |
        Guardrails classify hate, sexual, violence and self-harm content; they don't know Contoso's logo versions or symbol list.
      fr: |
        Les garde-fous classifient la haine, le contenu sexuel, la violence et l'automutilation ; ils ne connaissent ni les versions du logo de Contoso ni sa liste de symboles.
    d:
      en: |
        Content Credentials disclose that an image was AI-generated; they say nothing about the logo it shows.
      fr: |
        Les Content Credentials indiquent qu'une image a été générée par l'IA ; ils ne disent rien du logo qu'elle montre.
    e:
      en: |
        Removing the Uncertain value hides doubtful cases instead of routing them to a reviewer, and `generate` no longer restricts the output to fixed values.
      fr: |
        Supprimer la valeur Uncertain masque les cas douteux au lieu de les envoyer à un relecteur, et `generate` ne limite plus la sortie à des valeurs fixes.
references:
  - title: "What is Azure Content Understanding in Foundry Tools?"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
  - title: Best practices for using Content Understanding
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
