id: ai103-3a-video-job-handling
objective: "3.1.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation runs a nightly Python job that creates training videos with a `sora-2` deployment. The editors review the videos the following week. Last month, some videos could no longer be downloaded when the editors asked for them, and some jobs ended with the status `failed` and were retried every night with the same prompt, without success.

    You need to make the nightly job reliable. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation exécute chaque nuit un travail Python qui crée des vidéos de formation avec un déploiement `sora-2`. Les rédacteurs examinent les vidéos la semaine suivante. Le mois dernier, certaines vidéos ne pouvaient plus être téléchargées quand les rédacteurs les ont demandées, et certains travaux se sont terminés avec l'état `failed` et ont été relancés chaque nuit avec la même invite, sans succès.

    Vous devez fiabiliser le travail nocturne. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Download each completed video to storage that Adatum controls as soon as the job completes"
        fr: "Télécharger chaque vidéo terminée vers un stockage contrôlé par Adatum dès la fin du travail"
    - id: b
      text:
        en: "Read `failure_reason` of each failed job and revise the prompt when content filtering caused the failure"
        fr: "Lire `failure_reason` de chaque travail en échec et réviser l'invite quand le filtrage de contenu a provoqué l'échec"
    - id: c
      text:
        en: "Store the video ID of each job so that the editors can download the video from the API during their review"
        fr: "Stocker l'ID de vidéo de chaque travail pour que les rédacteurs puissent télécharger la vidéo depuis l'API pendant leur examen"
    - id: d
      text:
        en: "Retry each failed job immediately with the same prompt and a longer `seconds` value"
        fr: "Relancer immédiatement chaque travail en échec avec la même invite et une valeur `seconds` plus longue"
    - id: e
      text:
        en: "Call `videos.download_content` immediately after `videos.create` returns, without waiting for the status"
        fr: "Appeler `videos.download_content` immédiatement après le retour de `videos.create`, sans attendre l'état"
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      Sora 2 jobs are available for 24 hours after creation, so a video reviewed a week later must have been downloaded and stored elsewhere when its job completed. When a job fails, `failure_reason` gives the cause, such as a content policy violation; a prompt that triggers content filtering returns no video, so it must be revised rather than retried as is.
    fr: |
      Les travaux Sora 2 restent disponibles 24 heures après leur création : une vidéo examinée une semaine plus tard doit avoir été téléchargée et stockée ailleurs à la fin de son travail. Quand un travail échoue, `failure_reason` en donne la cause, par exemple une violation de la stratégie de contenu ; une invite qui déclenche le filtrage de contenu ne renvoie aucune vidéo : il faut la réviser plutôt que la relancer telle quelle.
  options:
    c: { en: "After 24 hours the job is no longer available, so the stored ID doesn't let the editors download the video a week later.", fr: "Après 24 heures, le travail n'est plus disponible : l'ID stocké ne permet pas aux rédacteurs de télécharger la vidéo une semaine plus tard." }
    d: { en: "A prompt that was filtered fails again whatever its duration; the cause must be read and the prompt revised.", fr: "Une invite filtrée échoue de nouveau quelle que soit sa durée ; il faut lire la cause et réviser l'invite." }
    e: { en: "`videos.create` returns a queued job; the content can be downloaded only after the status is `completed`.", fr: "`videos.create` renvoie un travail en file d'attente ; le contenu ne peut être téléchargé qu'une fois l'état `completed` atteint." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
