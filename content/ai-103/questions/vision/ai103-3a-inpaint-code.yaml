id: ai103-3a-inpaint-code
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a `gpt-image-1.5` deployment named `shelf-edit`. The file `aisle.png` is a 1536x1024 photo of a store aisle. You need to replace only the promotional banner that hangs above the aisle with a new banner, and leave the rest of the photo unchanged. A designer prepared three mask files:

    - `mask-a.png`: 1536x1024, fully transparent over the banner, opaque elsewhere
    - `mask-b.png`: 1024x1024, fully transparent over the banner, opaque elsewhere
    - `mask-c.png`: 1536x1024, opaque over the banner, fully transparent elsewhere

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un déploiement `gpt-image-1.5` nommé `shelf-edit`. Le fichier `aisle.png` est une photo de 1536x1024 d'un rayon de magasin. Vous devez remplacer uniquement la banderole promotionnelle suspendue au-dessus du rayon par une nouvelle banderole, et laisser le reste de la photo inchangé. Un graphiste a préparé trois fichiers de masque :

    - `mask-a.png` : 1536x1024, entièrement transparent sur la banderole, opaque ailleurs
    - `mask-b.png` : 1024x1024, entièrement transparent sur la banderole, opaque ailleurs
    - `mask-c.png` : 1536x1024, opaque sur la banderole, entièrement transparent ailleurs

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    result = client.images.[[op]](
        model="shelf-edit",
        image=open("aisle.png", "rb"),
        mask=open([[file]], "rb"),
        prompt="A red banner that reads SPRING SALE hangs above the aisle",
        size="1536x1024",
    )
    edited = base64.b64decode(result.data[0].b64_json)
  slots:
    - id: op
      options:
        - { id: edit, text: edit }
        - { id: generate, text: generate }
        - { id: variation, text: create_variation }
    - id: file
      options:
        - { id: ma, text: "\"mask-a.png\"" }
        - { id: mb, text: "\"mask-b.png\"" }
        - { id: mc, text: "\"mask-c.png\"" }
answer:
  values: { op: edit, file: ma }
explanation:
  correct:
    en: |
      Mask-based editing (inpainting) is done with the edits operation, which takes the source image, a mask and a prompt that describes the result. The mask must be a PNG file with the same dimensions as the input image, and its fully transparent pixels (alpha 0) mark the area to change, so only `mask-a.png` fits.
    fr: |
      La modification avec masque (inpainting) s'effectue avec l'opération de modification, qui prend l'image source, un masque et une invite qui décrit le résultat. Le masque doit être un fichier PNG de mêmes dimensions que l'image d'entrée, et ses pixels entièrement transparents (alpha 0) délimitent la zone à modifier : seul `mask-a.png` convient.
  options:
    generate: { en: "The generations operation takes no input image or mask; it would create a new picture.", fr: "L'opération de génération ne prend ni image d'entrée ni masque ; elle créerait une nouvelle image." }
    variation: { en: "A variation doesn't follow a prompt to change one region of the image.", fr: "Une variante ne suit pas une invite pour modifier une zone de l'image." }
    mb: { en: "The mask must have the same dimensions as the input image (1536x1024).", fr: "Le masque doit avoir les mêmes dimensions que l'image d'entrée (1536x1024)." }
    mc: { en: "This mask is inverted: it would keep the banner and regenerate the rest of the photo.", fr: "Ce masque est inversé : il conserverait la banderole et régénérerait le reste de la photo." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
