id: ai103-cs3c-video-limits
objective: "3.2.8"
type: yesno_statements
caseStudy: ai103-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You test the custom video analyzer on a sample of drone videos. The blade engineers ask what the analyzer can detect and what it costs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous testez l'analyseur vidéo personnalisé sur un échantillon de vidéos de drone. Les ingénieurs des pales demandent ce que l'analyseur peut détecter et ce qu'il coûte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A hairline crack that is visible for a fraction of a second while the drone moves fast is reliably reported by the analyzer."
        fr: "Une fissure capillaire visible une fraction de seconde pendant que le drone se déplace rapidement est signalée de manière fiable par l'analyseur."
    - id: s2
      text:
        en: "With segmentation enabled, the analyzer consumes generative model tokens even if no fields are defined."
        fr: "Avec la segmentation activée, l'analyseur consomme des jetons du modèle génératif même si aucun champ n'est défini."
    - id: s3
      text:
        en: "The noise of the drone's rotors in the audio track is described in the transcript of each segment."
        fr: "Le bruit des rotors du drone dans la piste audio est décrit dans la transcription de chaque segment."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Content Understanding samples video frames at about one frame per second, at a resolution of 512 x 512 pixels, so rapid or single-frame events and small details can be missed. Segmentation uses the generative model and consumes tokens even without fields. Only spoken words are transcribed; music, sound effects, and ambient noise are ignored.
    fr: |
      Content Understanding échantillonne les images de la vidéo à environ une image par seconde, avec une résolution de 512 x 512 pixels : les événements rapides ou visibles sur une seule image et les petits détails peuvent être manqués. La segmentation utilise le modèle génératif et consomme des jetons même sans champ. Seules les paroles sont transcrites ; la musique, les effets sonores et le bruit ambiant sont ignorés.
references:
  - title: Azure Content Understanding in Foundry Tools video overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
