id: ai103-3a-model-latency
objective: "3.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso Media is adding a banner generator to its content management system. The banners must be exactly 1536x864 pixels, and the editors want the banner to appear as fast as possible after they submit the prompt. Contoso Media has not applied for limited access to any model and doesn't plan to.

    You need to choose the model to deploy and the `quality` value to send. What should you choose?
  fr: |
    Contoso Media ajoute un générateur de bannières à son système de gestion de contenu. Les bannières doivent mesurer exactement 1536x864 pixels, et les rédacteurs veulent que la bannière apparaisse le plus vite possible après l'envoi de l'invite. Contoso Media n'a demandé l'accès limité à aucun modèle et ne prévoit pas de le faire.

    Vous devez choisir le modèle à déployer et la valeur `quality` à envoyer. Que devez-vous choisir ?
body:
  options:
    - id: a
      text:
        en: "`gpt-image-1-mini` with `quality=\"low\"`"
        fr: "`gpt-image-1-mini` avec `quality=\"low\"`"
    - id: b
      text:
        en: "`gpt-image-2` with `quality=\"high\"`"
        fr: "`gpt-image-2` avec `quality=\"high\"`"
    - id: c
      text:
        en: "`gpt-image-2` with `quality=\"low\"`"
        fr: "`gpt-image-2` avec `quality=\"low\"`"
    - id: d
      text:
        en: "`gpt-image-1.5` with `quality=\"low\"`"
        fr: "`gpt-image-1.5` avec `quality=\"low\"`"
answer: { optionId: c }
explanation:
  correct:
    en: |
      GPT-image-2 is generally available and accepts custom sizes whose edges are multiples of 16 pixels with an aspect ratio up to 3:1, so `1536x864` (16:9) is valid. Its `low` quality is optimized for latency-sensitive use.
    fr: |
      GPT-image-2 est en disponibilité générale et accepte des tailles personnalisées dont les côtés sont des multiples de 16 pixels, avec un rapport d'aspect jusqu'à 3:1 : `1536x864` (16:9) est donc valide. Sa qualité `low` est optimisée pour les usages sensibles à la latence.
  options:
    a: { en: "GPT-image-1-mini is a limited access model and only supports the sizes 1024x1024, 1024x1536 and 1536x1024.", fr: "GPT-image-1-mini est un modèle en accès limité et ne prend en charge que les tailles 1024x1024, 1024x1536 et 1536x1024." }
    b: { en: "The model fits, but `high` quality increases latency, which goes against the speed requirement.", fr: "Le modèle convient, mais la qualité `high` augmente la latence, ce qui va à l'encontre de l'exigence de rapidité." }
    d: { en: "GPT-image-1.5 is a limited access model and doesn't accept custom sizes such as 1536x864.", fr: "GPT-image-1.5 est un modèle en accès limité et n'accepte pas les tailles personnalisées comme 1536x864." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
