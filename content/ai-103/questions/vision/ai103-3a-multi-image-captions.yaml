id: ai103-3a-multi-image-captions
objective: "3.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso Real Estate sends the six photos of each property listing to a vision-enabled model deployment in one Responses API request. The listing app must store one concise caption per photo in a database table keyed by the photo ID, and it must parse the answer without custom text parsing.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso Real Estate envoie les six photos de chaque annonce immobilière à un déploiement de modèle compatible avec la vision en une seule requête de l'API Responses. L'application d'annonces doit stocker une légende concise par photo dans une table de base de données indexée par l'ID de la photo, et elle doit analyser la réponse sans analyse de texte personnalisée.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Precede each `input_image` part with an `input_text` part that gives the photo ID"
        fr: "Faire précéder chaque partie `input_image` d'une partie `input_text` qui donne l'ID de la photo"
    - id: b
      text:
        en: "Set `text.format` to a strict JSON schema with an array of photo ID and caption pairs"
        fr: "Définir `text.format` sur un schéma JSON strict avec un tableau de paires ID de photo et légende"
    - id: c
      text:
        en: "Add `maxLength` to the caption property of the JSON schema to limit each caption"
        fr: "Ajouter `maxLength` à la propriété de légende du schéma JSON pour limiter chaque légende"
    - id: d
      text:
        en: "Merge the six photos into one collage image before sending the request"
        fr: "Fusionner les six photos en une seule image de type collage avant d'envoyer la requête"
    - id: e
      text:
        en: "Set `detail` to `high` on each image so that the model keeps the photos in order"
        fr: "Définir `detail` sur `high` pour chaque image afin que le modèle garde les photos dans l'ordre"
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      A label before each image lets the model associate each caption with the right photo ID. Structured outputs with a strict JSON schema, set in `text.format` for the Responses API, make the model return an object that follows the schema, which the app can store without parsing free text.
    fr: |
      Une étiquette avant chaque image permet au modèle d'associer chaque légende au bon ID de photo. Les sorties structurées avec un schéma JSON strict, défini dans `text.format` pour l'API Responses, font renvoyer au modèle un objet conforme au schéma, que l'application peut stocker sans analyser de texte libre.
  options:
    c: { en: "`maxLength` is among the keywords that structured outputs don't support; caption length is set in the instruction.", fr: "`maxLength` fait partie des mots clés que les sorties structurées ne prennent pas en charge ; la longueur de la légende se définit dans l'instruction." }
    d: { en: "A collage loses the separation between photos and makes per-photo captions harder, not easier.", fr: "Un collage fait perdre la séparation entre les photos et complique les légendes par photo au lieu de les faciliter." }
    e: { en: "`detail` sets the image resolution processed by the model; it doesn't label or order the photos.", fr: "`detail` définit la résolution d'image traitée par le modèle ; il n'étiquette ni n'ordonne les photos." }
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
