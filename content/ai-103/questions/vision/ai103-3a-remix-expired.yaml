id: ai103-3a-remix-expired
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. generated a 12-second product clip with a `sora-2` deployment on Monday. The video was downloaded and stored in a storage account, and the application kept its video ID. On Thursday, the marketing team asks for one change to the lighting of the clip. The application calls `videos.remix` with the stored video ID, and the request fails.

    The team agrees to approve a regenerated clip first, but the lighting change must then be applied without altering the composition it approved. What should you do?
  fr: |
    Fabrikam, Inc. a généré un clip de produit de 12 secondes avec un déploiement `sora-2` le lundi. La vidéo a été téléchargée et stockée dans un compte de stockage, et l'application a conservé son ID de vidéo. Le jeudi, l'équipe marketing demande une modification de l'éclairage du clip. L'application appelle `videos.remix` avec l'ID de vidéo stocké, et la requête échoue.

    L'équipe accepte d'approuver d'abord un clip régénéré, mais la modification de l'éclairage doit ensuite être appliquée sans altérer la composition approuvée. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Retry `videos.remix` with the same video ID after a quota increase for the deployment"
        fr: "Relancer `videos.remix` avec le même ID de vidéo après une augmentation de quota du déploiement"
    - id: b
      text:
        en: "Call `videos.remix` with the URL of the stored MP4 file instead of the video ID"
        fr: "Appeler `videos.remix` avec l'URL du fichier MP4 stocké au lieu de l'ID de vidéo"
    - id: c
      text:
        en: "Generate the clip again with `videos.create`, and remix the approved new video within 24 hours"
        fr: "Générer de nouveau le clip avec `videos.create`, puis remixer la nouvelle vidéo approuvée dans les 24 heures"
    - id: d
      text:
        en: "Call `videos.retrieve` with the stored video ID to restore the job, then call `videos.remix` again"
        fr: "Appeler `videos.retrieve` avec l'ID de vidéo stocké pour restaurer le travail, puis rappeler `videos.remix`"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Video jobs remain available for 24 hours after creation; after that, you must create a new job. A remix requires the ID of a completed video that is still available, so the clip must be generated again and the change applied by remix while the new job is available. The remix then keeps the structure and layout of the approved video while it changes the lighting.
    fr: |
      Les travaux vidéo restent disponibles 24 heures après leur création ; ensuite, il faut créer un nouveau travail. Un remix nécessite l'ID d'une vidéo terminée encore disponible : le clip doit donc être généré de nouveau, puis la modification appliquée par remix tant que le nouveau travail est disponible. Le remix conserve alors la structure et la disposition de la vidéo approuvée tout en modifiant l'éclairage.
  options:
    a: { en: "The failure comes from the expired job, not from quota.", fr: "L'échec vient du travail expiré, pas du quota." }
    b: { en: "Remix identifies its source by the ID of a completed video job, not by a file URL.", fr: "Le remix identifie sa source par l'ID d'un travail vidéo terminé, pas par l'URL d'un fichier." }
    d: { en: "Retrieving the status doesn't restore a job after the 24-hour availability period.", fr: "Récupérer l'état ne restaure pas un travail après la période de disponibilité de 24 heures." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
