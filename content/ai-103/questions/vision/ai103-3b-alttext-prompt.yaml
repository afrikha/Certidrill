id: ai103-3b-alttext-prompt
objective: "3.2.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam generates alt text for the images of its product catalog website by using a vision-enabled chat model. You are writing the alt text rules in the instructions of the model. The rules must follow the Microsoft accessibility guidance for alt text.

    How should you complete the instructions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam génère le texte de remplacement des images de son site de catalogue de produits à l'aide d'un modèle de conversation compatible vision. Vous rédigez les règles du texte de remplacement dans les instructions du modèle. Les règles doivent respecter les recommandations d'accessibilité de Microsoft pour le texte de remplacement.

    Comment devez-vous compléter les instructions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Start the alt text with [[start]].
      Keep the alt text to at most [[len]] characters.
      For an image that is purely decorative, return [[deco]].
    fr: |
      Commencer le texte de remplacement par [[start]].
      Limiter le texte de remplacement à [[len]] caractères au plus.
      Pour une image purement décorative, renvoyer [[deco]].
  slots:
    - id: start
      options:
        - { id: type, text: { en: "the kind of image, such as photograph or diagram", fr: "le type d'image, par exemple photographie ou diagramme" } }
        - { id: imageof, text: { en: "the words \"Image of\"", fr: "les mots « Image of »" } }
        - { id: file, text: { en: "the file name of the image", fr: "le nom du fichier de l'image" } }
        - { id: product, text: { en: "the product SKU", fr: "la référence SKU du produit" } }
    - id: len
      options:
        - { id: l100, text: "100" }
        - { id: l150, text: "150" }
        - { id: l250, text: "250" }
        - { id: l500, text: "500" }
    - id: deco
      options:
        - { id: empty, text: { en: "an empty alt text (alt=\"\")", fr: "un texte de remplacement vide (alt=\"\")" } }
        - { id: word, text: { en: "the word \"Decorative\"", fr: "le mot « Decorative »" } }
        - { id: omit, text: { en: "no alt attribute at all", fr: "aucun attribut alt" } }
        - { id: short, text: { en: "a one-sentence description", fr: "une description d'une phrase" } }
answer:
  values: { start: type, len: l150, deco: empty }
explanation:
  correct:
    en: |
      Screen readers already announce an image, so the alt text starts by saying what the image is (a photograph, drawing, diagram, chart or screenshot). The guidance limits alt text to 150 characters. A purely decorative image needs no alt text; in web content, use a null `alt=""` instead of omitting the attribute.
    fr: |
      Les lecteurs d'écran annoncent déjà une image : le texte de remplacement commence donc par dire ce qu'est l'image (photographie, dessin, diagramme, graphique ou capture d'écran). Les recommandations limitent le texte de remplacement à 150 caractères. Une image purement décorative n'a pas besoin de texte de remplacement ; dans du contenu web, utilisez un `alt=""` vide au lieu d'omettre l'attribut.
  options:
    imageof: { en: "Don't start with \"Image\": screen readers already announce images.", fr: "Ne commencez pas par « Image » : les lecteurs d'écran annoncent déjà les images." }
    file: { en: "The guidance says never to use the file name as alt text.", fr: "Les recommandations interdisent d'utiliser le nom du fichier comme texte de remplacement." }
    omit: { en: "Omitting the attribute isn't the same as a null alt: the guidance asks for alt=\"\".", fr: "Omettre l'attribut n'équivaut pas à un alt vide : les recommandations demandent alt=\"\"." }
    word: { en: "A screen reader would read the word aloud; decorative images use a null alt.", fr: "Un lecteur d'écran lirait ce mot à voix haute ; les images décoratives utilisent un alt vide." }
references:
  - title: Alternative text (alt text)
    url: https://learn.microsoft.com/en-us/style-guide/accessibility/alternative-text
