id: ai103-3b-alttext-chart
objective: "3.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank publishes its annual report as web pages. Each page contains bar and line charts. You are building a Python app that sends each chart to a vision-enabled chat model by using the Responses API with structured outputs (`strict: true`).

    The app must meet the following requirements:

    - Screen reader users must get the purpose and key message of each chart, in line with the Microsoft accessibility guidance for alt text.
    - The full data of each chart must remain available to users who need it.
    - All the output for a chart must come from a single model call.

    Which approach should you use?
  fr: |
    Woodgrove Bank publie son rapport annuel sous forme de pages web. Chaque page contient des graphiques à barres et des graphiques en courbes. Vous créez une application Python qui envoie chaque graphique à un modèle de conversation compatible vision à l'aide de l'API Responses avec des sorties structurées (`strict: true`).

    L'application doit satisfaire les exigences suivantes :

    - Les utilisateurs de lecteurs d'écran doivent obtenir l'objectif et le message clé de chaque graphique, conformément aux recommandations d'accessibilité de Microsoft pour le texte de remplacement.
    - Les données complètes de chaque graphique doivent rester accessibles aux utilisateurs qui en ont besoin.
    - Toute la sortie d'un graphique doit provenir d'un seul appel au modèle.

    Quelle approche devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "A schema with a single `altText` field that has `\"maxLength\": 150`; instruct the model to list every data value of the chart in `altText` so that the schema enforces the limit"
        fr: "Un schéma avec un seul champ `altText` doté de `\"maxLength\": 150` ; demander au modèle de lister toutes les valeurs du graphique dans `altText` pour que le schéma impose la limite"
    - id: b
      text:
        en: "A schema with `altText` and `longDescription` fields; instruct the model to name the chart type and its key message in `altText`, put the data values in `longDescription`, and check the 150-character limit of `altText` in code"
        fr: "Un schéma avec les champs `altText` et `longDescription` ; demander au modèle de nommer le type de graphique et son message clé dans `altText`, de placer les valeurs dans `longDescription`, et vérifier dans le code la limite de 150 caractères d'`altText`"
    - id: c
      text:
        en: "A schema with a single `altText` field; instruct the model to start with \"Image of a chart\" and to describe every bar or point of the chart in reading order"
        fr: "Un schéma avec un seul champ `altText` ; demander au modèle de commencer par « Image of a chart » et de décrire chaque barre ou chaque point du graphique dans l'ordre de lecture"
    - id: d
      text:
        en: "A schema with a `caption` field; set `detail` to `high`, ask for a detailed caption of the chart, and use the caption both as the alt text and as the visible figure caption"
        fr: "Un schéma avec un champ `caption` ; définir `detail` sur `high`, demander une légende détaillée du graphique, et utiliser cette légende à la fois comme texte de remplacement et comme légende visible de la figure"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Microsoft's guidance says alt text conveys the image's purpose concisely, starts by saying what the image is (for example a chart), and stays within 150 characters; complex images such as charts get a detailed description in the surrounding text or linked content. Two fields in one schema return both texts in a single call. Structured outputs don't support the `maxLength` keyword, so the application checks the length itself.
    fr: |
      Les recommandations de Microsoft indiquent que le texte de remplacement transmet l'objectif de l'image de façon concise, commence par dire ce qu'est l'image (par exemple un graphique) et ne dépasse pas 150 caractères ; les images complexes comme les graphiques reçoivent une description détaillée dans le texte environnant ou dans un contenu lié. Deux champs dans un même schéma renvoient les deux textes en un seul appel. Les sorties structurées ne prennent pas en charge le mot clé `maxLength` : l'application vérifie donc la longueur elle-même.
  options:
    a:
      en: |
        Structured outputs don't support `maxLength`, and listing every value in the alt text contradicts the guidance: the data belongs in a detailed description.
      fr: |
        Les sorties structurées ne prennent pas en charge `maxLength`, et lister toutes les valeurs dans le texte de remplacement contredit les recommandations : les données vont dans une description détaillée.
    c:
      en: |
        Alt text must not start with "Image": screen readers already announce images. Describing every bar makes the text long and leaves no separate description of the data.
      fr: |
        Le texte de remplacement ne doit pas commencer par « Image » : les lecteurs d'écran annoncent déjà les images. Décrire chaque barre rend le texte long et ne laisse aucune description séparée des données.
    d:
      en: |
        A detailed caption is not alt text, and the guidance says the caption and the alt text must not be redundant.
      fr: |
        Une légende détaillée n'est pas un texte de remplacement, et les recommandations précisent que la légende et le texte de remplacement ne doivent pas être redondants.
references:
  - title: Alternative text (alt text)
    url: https://learn.microsoft.com/en-us/style-guide/accessibility/alternative-text
  - title: How to use structured outputs with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/structured-outputs
