id: ai103-3a-image-facts
objective: "3.1.1"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. has a Microsoft Foundry resource that contains a `gpt-image-1-mini` deployment named `draft-img` and a `gpt-image-2` deployment named `banner-img`. Both deployments use the default quota. A developer at Fabrikam calls the image API directly from Python.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. dispose d'une ressource Microsoft Foundry qui contient un déploiement `gpt-image-1-mini` nommé `draft-img` et un déploiement `gpt-image-2` nommé `banner-img`. Les deux déploiements utilisent le quota par défaut. Un développeur de Fabrikam appelle l'API d'images directement depuis Python.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A single `images.generate` request to `draft-img` with `n=4` can return four images."
        fr: "Une seule requête `images.generate` envoyée à `draft-img` avec `n=4` peut renvoyer quatre images."
    - id: s2
      text:
        en: "A request to `banner-img` with `size=\"2560x1080\"` meets the size rules of the model."
        fr: "Une requête envoyée à `banner-img` avec `size=\"2560x1080\"` respecte les règles de taille du modèle."
    - id: s3
      text:
        en: "With the default quota, `banner-img` accepts up to 50 images per minute."
        fr: "Avec le quota par défaut, `banner-img` accepte jusqu'à 50 images par minute."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      GPT-image models return 1 to 10 images per request, set with `n`. GPT-image-2 accepts custom sizes only if both edges are multiples of 16 pixels: 1080 is not (1080 / 16 = 67.5), so `2560x1080` is rejected even though its aspect ratio is under 3:1. The default quota of the GPT-image-1 series and GPT-image-2 is 5 images per minute per deployment.
    fr: |
      Les modèles GPT-image renvoient de 1 à 10 images par requête, nombre défini avec `n`. GPT-image-2 n'accepte une taille personnalisée que si les deux côtés sont des multiples de 16 pixels : ce n'est pas le cas de 1080 (1080 / 16 = 67,5), donc `2560x1080` est refusé même si son rapport d'aspect est inférieur à 3:1. Le quota par défaut de la série GPT-image-1 et de GPT-image-2 est de 5 images par minute et par déploiement.
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
