id: ai103-3a-video-create-code
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. has a `sora-2` deployment named `reel-gen`. You are writing Python code that creates a vertical social media clip of 12 seconds. The first frame of the clip must be an approved illustration stored in the file `opening.png`, which is 720 pixels wide and 1280 pixels high.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware, Inc. dispose d'un déploiement `sora-2` nommé `reel-gen`. Vous écrivez du code Python qui crée un clip vertical de 12 secondes pour les réseaux sociaux. La première image du clip doit être une illustration approuvée stockée dans le fichier `opening.png`, de 720 pixels de large et 1280 pixels de haut.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    video = client.videos.create(
        model="reel-gen",
        prompt="The illustrated fox walks out of the frame into a snowy forest",
        size=[[size]],
        seconds=[[sec]],
        [[ref]]=open("opening.png", "rb"),
    )
  slots:
    - id: size
      options:
        - { id: portrait, text: "\"720x1280\"" }
        - { id: landscape, text: "\"1280x720\"" }
        - { id: hd, text: "\"1080x1920\"" }
    - id: sec
      options:
        - { id: s10, text: "10" }
        - { id: s12, text: "12" }
        - { id: s20, text: "20" }
    - id: ref
      options:
        - { id: input_reference, text: input_reference }
        - { id: image, text: image }
        - { id: mask, text: mask }
answer:
  values: { size: portrait, sec: s12, ref: input_reference }
explanation:
  correct:
    en: |
      The `input_reference` parameter takes one image (JPEG, PNG or WebP) that anchors the first frame, and its resolution must match `size` exactly, so the 720x1280 illustration requires `size="720x1280"`, the portrait value. The `seconds` parameter of Sora 2 accepts 4 (default), 8 or 12.
    fr: |
      Le paramètre `input_reference` prend une image (JPEG, PNG ou WebP) qui sert d'ancre à la première image, et sa résolution doit correspondre exactement à `size` : l'illustration de 720x1280 impose `size="720x1280"`, la valeur portrait. Le paramètre `seconds` de Sora 2 accepte 4 (par défaut), 8 ou 12.
  options:
    landscape: { en: "`1280x720` is the landscape size and doesn't match the resolution of the reference image.", fr: "`1280x720` est la taille paysage et ne correspond pas à la résolution de l'image de référence." }
    hd: { en: "The `size` parameter of the video API accepts `720x1280` or `1280x720`.", fr: "Le paramètre `size` de l'API vidéo accepte `720x1280` ou `1280x720`." }
    s10: { en: "10 isn't one of the accepted values: 4, 8 or 12.", fr: "10 ne fait pas partie des valeurs acceptées : 4, 8 ou 12." }
    s20: { en: "20 isn't one of the accepted values: 4, 8 or 12.", fr: "20 ne fait pas partie des valeurs acceptées : 4, 8 ou 12." }
    image: { en: "`image` is a parameter of the image edits operation, not of `videos.create`.", fr: "`image` est un paramètre de l'opération de modification d'images, pas de `videos.create`." }
    mask: { en: "`mask` belongs to image edits and marks an area to change; it doesn't set the first frame of a video.", fr: "`mask` appartient à la modification d'images et délimite une zone à changer ; il ne définit pas la première image d'une vidéo." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
