id: ai103-cs1a-photo-analyzer
objective: "3.2.5"
type: yesno_statements
caseStudy: ai103-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a Content Understanding custom analyzer named photoAnalyzer that uses `prebuilt-image` as its base analyzer. photoAnalyzer will process the damage photos and return two fields named DamageDescription and DamageSeverity. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer un analyseur personnalisé Content Understanding nommé photoAnalyzer qui utilise `prebuilt-image` comme analyseur de base. photoAnalyzer traitera les photos des dommages et renverra deux champs nommés DamageDescription et DamageSeverity. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can set the method of DamageSeverity to `classify` so that the analyzer returns Minor, Moderate or Severe.
        fr: |
          Vous pouvez définir la méthode de DamageSeverity sur `classify` pour que l'analyseur renvoie Minor, Moderate ou Severe.
    - id: s2
      text:
        en: |
          You should set the method of DamageDescription to `extract` so that the analyzer describes each photo.
        fr: |
          Vous devez définir la méthode de DamageDescription sur `extract` pour que l'analyseur décrive chaque photo.
    - id: s3
      text:
        en: |
          The `models.completion` property of photoAnalyzer must contain the name of a model deployment in claims-prj.
        fr: |
          La propriété `models.completion` de photoAnalyzer doit contenir le nom d'un déploiement de modèle dans claims-prj.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "`classify` chooses a value from a predefined set, which fits a severity of Minor, Moderate or Severe. A description of a photo is inferred by the model, so it uses `generate`; `extract` returns values that appear literally in the content and is supported only by document analyzers. The `models` property contains model names, not deployment names, and each name must be one of the models that the base analyzer supports."
    fr: "`classify` choisit une valeur dans un ensemble prédéfini, ce qui convient à une gravité Minor, Moderate ou Severe. La description d'une photo est déduite par le modèle : elle utilise donc `generate` ; `extract` renvoie des valeurs qui apparaissent littéralement dans le contenu et n'est prise en charge que par les analyseurs de documents. La propriété `models` contient des noms de modèles, pas des noms de déploiements, et chaque nom doit faire partie des modèles pris en charge par l'analyseur de base."
references:
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
  - title: Best practices for Azure Content Understanding in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/best-practices
