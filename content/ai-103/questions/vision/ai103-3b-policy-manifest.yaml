id: ai103-3b-policy-manifest
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys generates campaign images with a GPT-image-1 series model deployed in Azure OpenAI in Microsoft Foundry Models. A retail partner wants to check where a published image comes from, and opens it in Content Credentials Verify.

    What will the Content Credentials manifest of the image show?
  fr: |
    Wingtip Toys génère des images de campagne avec un modèle de la série GPT-image-1 déployé dans Azure OpenAI dans Microsoft Foundry Models. Un partenaire commercial veut vérifier la provenance d'une image publiée et l'ouvre dans Content Credentials Verify.

    Que montrera le manifeste Content Credentials de l'image ?
body:
  options:
    - id: a
      text:
        en: "The description \"AI Generated Image\" and the software agent \"Azure OpenAI ImageGen\""
        fr: "La description « AI Generated Image » et l'agent logiciel « Azure OpenAI ImageGen »"
    - id: b
      text:
        en: "The description \"AI Generated Image\" and the software agent \"Azure OpenAI DALL-E\""
        fr: "La description « AI Generated Image » et l'agent logiciel « Azure OpenAI DALL-E »"
    - id: c
      text:
        en: "The prompt used to generate the image and the name of the model deployment"
        fr: "L'invite utilisée pour générer l'image et le nom du déploiement de modèle"
    - id: d
      text:
        en: "No manifest, because Content Credentials must first be enabled on the deployment"
        fr: "Aucun manifeste, car les Content Credentials doivent d'abord être activés sur le déploiement"
answer: { optionId: a }
explanation:
  correct:
    en: |
      Content Credentials, based on the C2PA specification, are applied automatically to every image generated by the DALL-E series and GPT-image-1 series models. The manifest's `description` is "AI Generated Image", its `softwareAgent` is "Azure OpenAI ImageGen" for GPT-image-1 series models, and `when` records when the credentials were created.
    fr: |
      Les Content Credentials, fondés sur la spécification C2PA, sont appliqués automatiquement à toutes les images générées par les modèles des séries DALL-E et GPT-image-1. La `description` du manifeste est « AI Generated Image », son `softwareAgent` est « Azure OpenAI ImageGen » pour les modèles de la série GPT-image-1, et `when` indique la date de création des informations.
  options:
    b:
      en: |
        "Azure OpenAI DALL-E" is the software agent for images generated by DALL-E series models.
      fr: |
        « Azure OpenAI DALL-E » est l'agent logiciel des images générées par les modèles de la série DALL-E.
    c:
      en: |
        The manifest discloses the origin (description, software agent, date), not the prompt or the deployment name.
      fr: |
        Le manifeste indique la provenance (description, agent logiciel, date), pas l'invite ni le nom du déploiement.
    d:
      en: |
        No setup is needed: Content Credentials are applied automatically.
      fr: |
        Aucune configuration n'est nécessaire : les Content Credentials sont appliqués automatiquement.
references:
  - title: Content Credentials in Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials
