id: ai103-3b-pro-mode-crosscheck
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso receives supplier invoices as PDF files. Each invoice must be validated against the matching purchase order and against Contoso's approved supplier list, and every mismatch must be flagged in the output. The team wants Azure Content Understanding to perform the validation instead of writing custom comparison code.

    Which type of Content Understanding pipeline should you use?
  fr: |
    Contoso reçoit les factures de ses fournisseurs sous forme de fichiers PDF. Chaque facture doit être validée par rapport au bon de commande correspondant et à la liste des fournisseurs approuvés de Contoso, et chaque écart doit être signalé dans la sortie. L'équipe veut qu'Azure Content Understanding effectue la validation au lieu d'écrire du code de comparaison personnalisé.

    Quel type de pipeline Content Understanding devez-vous utiliser ?
body:
  options:
    - id: a
      text:
        en: "A custom analyzer based on `prebuilt-image` that processes a picture of each invoice with `classify` fields"
        fr: "Un analyseur personnalisé basé sur `prebuilt-image` qui traite une image de chaque facture avec des champs `classify`"
    - id: b
      text:
        en: "A standard mode analyzer based on `prebuilt-invoice` for each file, with the results compared by the application"
        fr: "Un analyseur en mode standard basé sur `prebuilt-invoice` pour chaque fichier, avec une comparaison des résultats par l'application"
    - id: c
      text:
        en: "A classification analyzer whose `contentCategories` route invoices and purchase orders to two separate analyzers"
        fr: "Un analyseur de classification dont les `contentCategories` routent les factures et les bons de commande vers deux analyseurs distincts"
    - id: d
      text:
        en: "A pro mode analyzer that takes the invoice and the purchase order as inputs and uses the supplier list as an external knowledge base"
        fr: "Un analyseur en mode pro qui reçoit la facture et le bon de commande en entrée et utilise la liste des fournisseurs comme base de connaissances externe"
answer: { optionId: d }
explanation:
  correct:
    en: |
      Pro mode adds reasoning, several input documents in one analysis, and an external knowledge base for linking, enrichment and validation. It targets exactly this kind of task: validating results across documents and using reference data to produce the output, which would otherwise require custom code. Pro mode is limited to documents, which fits PDF invoices.
    fr: |
      Le mode pro ajoute le raisonnement, plusieurs documents d'entrée dans une même analyse, et une base de connaissances externe pour la liaison, l'enrichissement et la validation. Il vise précisément ce type de tâche : valider des résultats d'un document à l'autre et utiliser des données de référence pour produire la sortie, ce qui demanderait sinon du code personnalisé. Le mode pro est limité aux documents, ce qui convient à des factures PDF.
  options:
    a:
      en: |
        Image analyzers aren't optimized for text-based analysis, and a single-file analyzer can't validate against other documents.
      fr: |
        Les analyseurs d'images ne sont pas optimisés pour l'analyse fondée sur le texte, et un analyseur à fichier unique ne peut pas valider par rapport à d'autres documents.
    b:
      en: |
        Standard mode processes each file separately; the cross-document comparison would be custom code, which the team wants to avoid.
      fr: |
        Le mode standard traite chaque fichier séparément ; la comparaison entre documents serait du code personnalisé, ce que l'équipe veut éviter.
    c:
      en: |
        Routing sends each document type to its own analyzer but doesn't compare the documents with each other or with the supplier list.
      fr: |
        Le routage envoie chaque type de document à son propre analyseur, mais ne compare pas les documents entre eux ni avec la liste des fournisseurs.
references:
  - title: What's new in Content Understanding?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/whats-new
