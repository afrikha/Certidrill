difficulty: 1
status: draft
stem:
  en: You analyze each image with the Content Safety image API.
  fr: Vous analysez chaque image avec l'API d'images de Content Safety.
body:
  solution:
    en: |
      For each claim, the app sends every image to `image:analyze` of Azure AI Content Safety with the categories Hate, SelfHarm, Sexual and Violence. If any category returns a severity of 4 or higher, the app rejects the claim; otherwise, it sends the description and the images to the model.
    fr: |
      Pour chaque déclaration, l'application envoie chaque image à `image:analyze` d'Azure AI Content Safety avec les catégories Hate, SelfHarm, Sexual et Violence. Si une catégorie renvoie une gravité supérieure ou égale à 4, l'application rejette la déclaration ; sinon, elle envoie la description et les images au modèle.
answer: { value: false }
explanation:
  correct:
    en: Image analysis classifies harmful visual content into four harm categories with a severity level. A scanned invoice that asks the model to approve a payout contains no hate, sexual, violent or self-harm content, so it gets a severity of 0 and the claim is accepted. Detecting instructions requires extracting the text and checking it with Prompt Shields.
    fr: "L'analyse d'images classe le contenu visuel préjudiciable dans quatre catégories de préjudice, avec un niveau de gravité. Une facture numérisée qui demande au modèle d'approuver une indemnisation ne contient aucun contenu haineux, sexuel, violent ni d'automutilation : elle obtient une gravité de 0 et la déclaration est acceptée. La détection d'instructions nécessite d'extraire le texte et de le vérifier avec Prompt Shields."
references:
  - title: "Quickstart: Analyze image content"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image
