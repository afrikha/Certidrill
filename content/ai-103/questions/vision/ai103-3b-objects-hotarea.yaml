id: ai103-3b-objects-hotarea
objective: "3.2.8"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam Logistics is designing solutions that locate objects and regions in its media. The candidate solutions are shown in the following table.

    Answer each prompt by selecting the solution that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam Logistics conçoit des solutions qui localisent des objets et des régions dans ses médias. Les solutions envisagées figurent dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la solution qui satisfait l'exigence.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Return the start and end times of each part of a warehouse video in which a forklift is moving", fr: "Renvoyer les heures de début et de fin de chaque partie d'une vidéo d'entrepôt dans laquelle un chariot élévateur se déplace" }
    - id: p2
      text: { en: "Return the page and the bounding region of each value extracted from scanned inspection forms, with a confidence score", fr: "Renvoyer la page et la région englobante de chaque valeur extraite de formulaires d'inspection numérisés, avec un score de confiance" }
  grid:
    header: [{ en: Solution, fr: Solution }, { en: Configuration, fr: Configuration }]
    rows:
      - [{ text: { en: "Vision-enabled chat model", fr: "Modèle de conversation compatible vision" }, area: chat }, { text: { en: "Structured output that lists the objects and describes their position", fr: "Sortie structurée qui liste les objets et décrit leur position" } }]
      - [{ text: { en: "Content Understanding image analyzer", fr: "Analyseur d'images Content Understanding" }, area: image }, { text: { en: "classify field per object: Present, Absent", fr: "Champ classify par objet : Present, Absent" } }]
      - [{ text: { en: "Content Understanding video analyzer", fr: "Analyseur vidéo Content Understanding" }, area: video }, { text: { en: "enableSegment set to true, contentCategories that describes the segments", fr: "enableSegment défini sur true, contentCategories qui décrit les segments" } }]
      - [{ text: { en: "Content Understanding document analyzer", fr: "Analyseur de documents Content Understanding" }, area: doc }, { text: { en: "extract fields, estimateFieldSourceAndConfidence set to true", fr: "Champs extract, estimateFieldSourceAndConfidence défini sur true" } }]
answer:
  values: { p1: video, p2: doc }
explanation:
  correct:
    en: |
      A video analyzer with segmentation splits the video according to the natural-language description in `contentCategories` and returns each segment with its start and end times. For documents, `estimateFieldSourceAndConfidence` returns the page number, bounding box and confidence of each field; it's supported only by document analyzers. A chat model or an image analyzer works on single images and doesn't return either result.
    fr: |
      Un analyseur vidéo avec segmentation découpe la vidéo selon la description en langage naturel de `contentCategories` et renvoie chaque segment avec ses heures de début et de fin. Pour les documents, `estimateFieldSourceAndConfidence` renvoie le numéro de page, le rectangle englobant et la confiance de chaque champ ; seuls les analyseurs de documents le prennent en charge. Un modèle de conversation ou un analyseur d'images travaille sur des images isolées et ne renvoie aucun de ces deux résultats.
references:
  - title: Azure Content Understanding in Foundry Tools video overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
  - title: Azure Content Understanding in Foundry Tools - What is an analyzer? Configuration and reference
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference
