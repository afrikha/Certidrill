id: ai103-3b-video-missed-label
objective: "3.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses an Azure Content Understanding custom video analyzer to review safety training videos. A `classify` field named `hazardLabelShown` must return Yes when a hazard label appears in a video.

    In a test video, a small hazard label appears in a corner of the frame for less than half a second, and the analyzer returns No.

    Which two limitations of video analysis explain this result?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum utilise un analyseur vidéo personnalisé Azure Content Understanding pour examiner des vidéos de formation à la sécurité. Un champ `classify` nommé `hazardLabelShown` doit renvoyer Yes quand une étiquette de danger apparaît dans une vidéo.

    Dans une vidéo de test, une petite étiquette de danger apparaît dans un coin de l'image pendant moins d'une demi-seconde, et l'analyseur renvoie No.

    Quelles sont les deux limitations de l'analyse vidéo qui expliquent ce résultat ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Frames are sampled at about one frame per second.", fr: "Les images sont échantillonnées à environ une image par seconde." } }
    - { id: b, text: { en: "Sampled frames are resized to 512 x 512 pixels.", fr: "Les images échantillonnées sont redimensionnées en 512 x 512 pixels." } }
    - { id: c, text: { en: "Only spoken words are transcribed, not sound effects.", fr: "Seules les paroles sont transcrites, pas les effets sonores." } }
    - { id: d, text: { en: "Key frames are extracted only when `enableSegment` is `true`.", fr: "Les images clés ne sont extraites que si `enableSegment` vaut `true`." } }
    - { id: e, text: { en: "Shot boundaries are returned only when `returnDetails` is `true`.", fr: "Les limites des plans ne sont renvoyées que si `returnDetails` vaut `true`." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Learn documents that about one frame per second is sampled, so rapid or single-frame events can be missed, and that sampled frames are resized to 512 x 512 pixels, so small text or distant objects can be lost. A small label shown for less than half a second is exposed to both limitations.
    fr: |
      Learn indique qu'environ une image par seconde est échantillonnée, si bien que des événements rapides ou d'une seule image peuvent être manqués, et que les images échantillonnées sont redimensionnées en 512 x 512 pixels, si bien que du petit texte ou des objets lointains peuvent être perdus. Une petite étiquette affichée moins d'une demi-seconde est exposée à ces deux limitations.
  options:
    c:
      en: |
        This limitation is real, but it concerns audio; the label is a visual element.
      fr: |
        Cette limitation existe, mais elle concerne l'audio ; l'étiquette est un élément visuel.
    d:
      en: |
        Key frame extraction is part of content extraction for every video analyzer; it doesn't depend on segmentation.
      fr: |
        L'extraction des images clés fait partie de l'extraction de contenu de tout analyseur vidéo ; elle ne dépend pas de la segmentation.
    e:
      en: |
        `returnDetails` controls whether `cameraShotTimesMs` appears in the output; it doesn't change which frames the model sees.
      fr: |
        `returnDetails` détermine si `cameraShotTimesMs` figure dans la sortie ; il ne change pas les images que voit le modèle.
references:
  - title: Azure Content Understanding in Foundry Tools video overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
