id: ai103-cs3a-region-edit
objective: "3.1.3"
type: single
caseStudy: ai103-cs3a-lucerne
difficulty: 2
status: draft
stem:
  en: |
    You need to implement the partial rework requirement in studio-app for an illustration whose sky was rejected. What should studio-app send to image-gen?
  fr: |
    Vous devez implémenter l'exigence de reprise partielle dans studio-app pour une illustration dont le ciel a été rejeté. Que doit envoyer studio-app à image-gen ?
body:
  options:
    - id: a
      text:
        en: "A request to the image generations endpoint with the original prompt and an instruction to keep everything except the sky"
        fr: "Une requête au point de terminaison de génération d'images avec l'invite d'origine et une instruction de tout conserver sauf le ciel"
    - id: b
      text:
        en: "A request to the image edits endpoint with the illustration, a new prompt, and a PNG mask in which the sky pixels are fully transparent"
        fr: "Une requête au point de terminaison de modification d'images avec l'illustration, une nouvelle invite et un masque PNG dont les pixels du ciel sont entièrement transparents"
    - id: c
      text:
        en: "A request to the image edits endpoint with the illustration, a new prompt, and a PNG mask in which only the sky pixels are opaque"
        fr: "Une requête au point de terminaison de modification d'images avec l'illustration, une nouvelle invite et un masque PNG dont seuls les pixels du ciel sont opaques"
    - id: d
      text:
        en: "A request to the image edits endpoint with the illustration, a new prompt, and a JPEG mask half the size of the illustration"
        fr: "Une requête au point de terminaison de modification d'images avec l'illustration, une nouvelle invite et un masque JPEG deux fois plus petit que l'illustration"
answer: { optionId: b }
explanation:
  correct:
    en: |
      Mask-based editing (inpainting) uses the image edits endpoint with the source image, a prompt, and a mask. The fully transparent pixels of the mask (alpha 0) mark the area to change, and the opaque pixels are left unchanged. The mask must be a PNG file with the same dimensions as the source image.
    fr: |
      La modification avec masque (inpainting) utilise le point de terminaison de modification d'images avec l'image source, une invite et un masque. Les pixels entièrement transparents du masque (alpha 0) délimitent la zone à modifier, et les pixels opaques restent inchangés. Le masque doit être un fichier PNG de mêmes dimensions que l'image source.
  options:
    a:
      en: |
        The generations endpoint creates a new image from the prompt; it does not take the existing illustration as input, so the rest of the image would change.
      fr: |
        Le point de terminaison de génération crée une nouvelle image à partir de l'invite ; il ne prend pas l'illustration existante en entrée, donc le reste de l'image changerait.
    c:
      en: |
        The mask is inverted. Opaque pixels are preserved, so this mask would keep the sky and regenerate everything else.
      fr: |
        Le masque est inversé. Les pixels opaques sont conservés : ce masque garderait le ciel et régénérerait tout le reste.
    d:
      en: |
        The mask must be a PNG file with the same dimensions as the input image; a JPEG file has no alpha channel to mark the area to edit.
      fr: |
        Le masque doit être un fichier PNG de mêmes dimensions que l'image d'entrée ; un fichier JPEG n'a pas de canal alpha pour délimiter la zone à modifier.
references:
  - title: Azure OpenAI image generation models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
