id: ai103-cs4a-fanart-moderation
objective: "3.3.1"
type: dropdown
caseStudy: ai103-cs4a-southridge
difficulty: 2
status: draft
stem:
  en: |
    You are writing the Python function that moderates fan art by using cs-southridge. The `credential` and `endpoint` variables and the `downscale()` helper function are already defined.

    You need to meet the fan art moderation requirement. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la fonction Python qui modère les créations de fans à l'aide de cs-southridge. Les variables `credential` et `endpoint` ainsi que la fonction utilitaire `downscale()` sont déjà définies.

    Vous devez satisfaire l'exigence relative à la modération des créations de fans. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.ai.contentsafety import ContentSafetyClient
    from azure.ai.contentsafety.models import AnalyzeImageOptions, ImageData

    client = ContentSafetyClient(endpoint, credential)
    MAX_BYTES = [[limit]]

    def review(data: bytes) -> str:
        if len(data) > MAX_BYTES:
            data = downscale(data, MAX_BYTES)
        result = client.[[call]](AnalyzeImageOptions(image=ImageData(content=data)))
        for item in result.categories_analysis:
            if item.severity >= [[threshold]]:
                return "rejected"
        return "accepted"
  slots:
    - id: limit
      options:
        - { id: mb4, text: "4 * 1024 * 1024" }
        - { id: mb20, text: "20 * 1024 * 1024" }
        - { id: mb50, text: "50 * 1024 * 1024" }
    - id: call
      options:
        - { id: image, text: analyze_image }
        - { id: text, text: analyze_text }
    - id: threshold
      options:
        - { id: two, text: "2" }
        - { id: four, text: "4" }
        - { id: six, text: "6" }
answer:
  values: { limit: mb4, call: image, threshold: four }
explanation:
  correct:
    en: |
      The image analysis API of Azure AI Content Safety accepts files of up to 4 MB, so larger images are downscaled first. `analyze_image` takes an `AnalyzeImageOptions` object and returns one entry per category in `categories_analysis`. The image model returns only the severities 0 (safe), 2 (low), 4 (medium) and 6 (high), so rejecting medium or higher means testing for a severity of 4 or more.
    fr: |
      L'API d'analyse d'images d'Azure AI Content Safety accepte des fichiers de 4 Mo au maximum : les images plus grandes sont donc d'abord réduites. `analyze_image` prend un objet `AnalyzeImageOptions` et renvoie une entrée par catégorie dans `categories_analysis`. Le modèle d'image ne renvoie que les gravités 0 (sûr), 2 (faible), 4 (moyen) et 6 (élevé) : rejeter une gravité moyenne ou supérieure revient à tester une gravité de 4 ou plus.
  options:
    mb50: { en: "50 MB is the limit of an input image for the GPT-image edits endpoint, not of Content Safety image analysis.", fr: "50 Mo est la limite d'une image d'entrée du point de terminaison de modification de GPT-image, pas celle de l'analyse d'images de Content Safety." }
    text: { en: "analyze_text moderates text and takes AnalyzeTextOptions, not an image.", fr: "analyze_text modère du texte et prend un objet AnalyzeTextOptions, pas une image." }
    two: { en: "A threshold of 2 would also reject images classified at low severity.", fr: "Un seuil de 2 rejetterait aussi les images classées à une gravité faible." }
    six: { en: "A threshold of 6 would accept images classified at medium severity.", fr: "Un seuil de 6 accepterait les images classées à une gravité moyenne." }
references:
  - title: "Quickstart: Analyze image content"
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image
  - title: Harm categories in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/harm-categories
