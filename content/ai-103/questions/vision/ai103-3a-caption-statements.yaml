id: ai103-3a-caption-statements
objective: "3.2.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Litware Publishing has a `gpt-4.1` deployment named `caption-chat`. Its editors need concise captions for photo galleries and detailed descriptions for feature articles, and they call `caption-chat` by using the Responses API.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware Publishing dispose d'un déploiement `gpt-4.1` nommé `caption-chat`. Ses rédacteurs ont besoin de légendes concises pour les galeries de photos et de descriptions détaillées pour les articles de fond, et ils appellent `caption-chat` à l'aide de l'API Responses.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Producing detailed descriptions in addition to concise captions requires a second model deployment."
        fr: "Produire des descriptions détaillées en plus des légendes concises nécessite un second déploiement de modèle."
    - id: s2
      text:
        en: "One request can contain several `input_image` parts to caption several photos at once."
        fr: "Une requête peut contenir plusieurs parties `input_image` pour légender plusieurs photos à la fois."
    - id: s3
      text:
        en: "When `detail` is not specified, the model chooses the level of detail from the image."
        fr: "Quand `detail` n'est pas spécifié, le modèle choisit le niveau de détail en fonction de l'image."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Concise and detailed captions are two instructions on the same deployment: the prompt controls the length and focus. The Responses API accepts several images in one request, each as an `input_image` content part. The default `detail` value is `auto`, with which the model chooses based on the image.
    fr: |
      Les légendes concises et détaillées sont deux instructions sur le même déploiement : l'invite contrôle la longueur et l'angle. L'API Responses accepte plusieurs images dans une requête, chacune sous forme de partie de contenu `input_image`. La valeur `detail` par défaut est `auto` : le modèle choisit alors en fonction de l'image.
references:
  - title: Use the Azure OpenAI Responses API
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/responses
