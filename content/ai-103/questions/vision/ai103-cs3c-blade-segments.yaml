id: ai103-cs3c-blade-segments
objective: "3.2.6"
type: single
caseStudy: ai103-cs3c-relecloud
difficulty: 2
status: draft
stem:
  en: |
    You are creating a custom video analyzer in Content Understanding for the drone videos. You need to meet the inspections requirement. How should you configure the analyzer?
  fr: |
    Vous créez un analyseur vidéo personnalisé dans Content Understanding pour les vidéos de drone. Vous devez satisfaire l'exigence d'inspections. Comment devez-vous configurer l'analyseur ?
body:
  options:
    - id: a
      text:
        en: "Set `enableSegment` to `false`, add a Damage field with the `generate` method, and add a Severity field with the `classify` method and an enum of the three values"
        fr: "Définir `enableSegment` sur `false`, ajouter un champ Damage avec la méthode `generate`, et ajouter un champ Severity avec la méthode `classify` et une énumération des trois valeurs"
    - id: b
      text:
        en: "Set `enableSegment` to `true` with a content category that describes one segment per blade, add a Damage field with the `generate` method, and add a Severity field with the `classify` method and an enum of the three values"
        fr: "Définir `enableSegment` sur `true` avec une catégorie de contenu qui décrit un segment par pale, ajouter un champ Damage avec la méthode `generate`, et ajouter un champ Severity avec la méthode `classify` et une énumération des trois valeurs"
    - id: c
      text:
        en: "Set `enableSegment` to `true` with a content category that describes one segment per blade, add a Damage field with the `extract` method, and add a Severity field with the `extract` method"
        fr: "Définir `enableSegment` sur `true` avec une catégorie de contenu qui décrit un segment par pale, ajouter un champ Damage avec la méthode `extract`, et ajouter un champ Severity avec la méthode `extract`"
    - id: d
      text:
        en: "Set `enableSegment` to `false`, set `returnDetails` to `true` to get the shot boundaries, and add a Damage field and a Severity field with the `generate` method"
        fr: "Définir `enableSegment` sur `false`, définir `returnDetails` sur `true` pour obtenir les limites des plans, et ajouter un champ Damage et un champ Severity avec la méthode `generate`"
answer: { optionId: b }
explanation:
  correct:
    en: |
      With `enableSegment` set to `true`, you describe the segmentation logic in natural language in a content category, and the model creates segments with start and end times, here one per blade. The fields are filled for every segment; `generate` produces the free-form damage description, and `classify` picks the severity from the enum values.
    fr: |
      Avec `enableSegment` défini sur `true`, vous décrivez la logique de segmentation en langage naturel dans une catégorie de contenu, et le modèle crée des segments avec des heures de début et de fin, ici un par pale. Les champs sont renseignés pour chaque segment ; `generate` produit la description libre des dommages, et `classify` choisit la gravité parmi les valeurs de l'énumération.
  options:
    a:
      en: |
        With `enableSegment` set to `false`, the whole video is treated as a single segment, so the analyzer returns one entry per video instead of one per blade.
      fr: |
        Avec `enableSegment` défini sur `false`, toute la vidéo est traitée comme un seul segment : l'analyseur renvoie une entrée par vidéo au lieu d'une par pale.
    c:
      en: |
        The `extract` method is supported for documents only; video fields use `generate` or `classify`.
      fr: |
        La méthode `extract` n'est prise en charge que pour les documents ; les champs vidéo utilisent `generate` ou `classify`.
    d:
      en: |
        Shot boundaries mark camera cuts, not blades, and the video is still analyzed as one segment; a `generate` field also does not restrict the severity to the three allowed values.
      fr: |
        Les limites des plans marquent les changements de plan de la caméra, pas les pales, et la vidéo est toujours analysée comme un seul segment ; un champ `generate` ne limite pas non plus la gravité aux trois valeurs autorisées.
references:
