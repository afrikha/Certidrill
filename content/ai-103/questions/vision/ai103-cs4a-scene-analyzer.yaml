id: ai103-cs4a-scene-analyzer
objective: "3.2.6"
type: dropdown
caseStudy: ai103-cs4a-southridge
difficulty: 2
status: draft
stem:
  en: |
    You are writing the definition of the custom analyzer for the episode index. You need to meet the episode index requirement. How should you complete the analyzer definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous rédigez la définition de l'analyseur personnalisé de l'index des épisodes. Vous devez satisfaire l'exigence relative à l'index des épisodes. Comment devez-vous compléter la définition de l'analyseur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "description": "Scene index for Southridge episodes",
      "baseAnalyzerId": [[base]],
      "config": {
        "[[detail]]": true,
        "enableSegment": true,
        "contentCategories": {
          "scene": {
            "description": "Create one segment for each scene. A scene ends when the location or the time of the story changes. Segments must not overlap."
          }
        }
      },
      "fieldSchema": {
        "fields": {
          "sceneSummary": {
            "type": "string",
            "method": "generate",
            "description": "Two sentences that describe the characters and the action of the scene."
          }
        }
      }
    }
  slots:
    - id: base
      options:
        - { id: video, text: "\"prebuilt-video\"" }
        - { id: videosearch, text: "\"prebuilt-videoSearch\"" }
        - { id: image, text: "\"prebuilt-image\"" }
    - id: detail
      options:
        - { id: returndetails, text: returnDetails }
        - { id: estimate, text: estimateFieldSourceAndConfidence }
        - { id: omit, text: omitContent }
answer:
  values: { base: video, detail: returndetails }
explanation:
  correct:
    en: |
      A custom analyzer can derive only from the four base analyzers, and `prebuilt-video` is the base for video; `prebuilt-videoSearch` is a ready-to-use RAG analyzer, not a base. Shot boundary timestamps (`cameraShotTimesMs`) are returned only when `returnDetails` is `true`. Setting `enableSegment` to `true` turns on custom segmentation, which follows the natural-language rule written in `contentCategories`.
    fr: |
      Un analyseur personnalisé ne peut dériver que des quatre analyseurs de base, et `prebuilt-video` est la base pour la vidéo ; `prebuilt-videoSearch` est un analyseur RAG prêt à l'emploi, pas une base. Les horodatages des changements de plan (`cameraShotTimesMs`) ne sont renvoyés que si `returnDetails` vaut `true`. Définir `enableSegment` sur `true` active la segmentation personnalisée, qui suit la règle en langage naturel écrite dans `contentCategories`.
  options:
    videosearch: { en: "prebuilt-videoSearch cannot be used as baseAnalyzerId; custom analyzers derive only from prebuilt-audio, prebuilt-document, prebuilt-image or prebuilt-video.", fr: "prebuilt-videoSearch ne peut pas servir de baseAnalyzerId ; les analyseurs personnalisés dérivent uniquement de prebuilt-audio, prebuilt-document, prebuilt-image ou prebuilt-video." }
    image: { en: "prebuilt-image is the base analyzer for still images, not for MP4 episodes.", fr: "prebuilt-image est l'analyseur de base des images fixes, pas des épisodes MP4." }
    estimate: { en: "estimateFieldSourceAndConfidence adds source and confidence to document fields; it does not return shot timestamps.", fr: "estimateFieldSourceAndConfidence ajoute la source et la confiance aux champs des documents ; il ne renvoie pas les horodatages des plans." }
    omit: { en: "omitContent removes the extracted content from the result instead of adding details.", fr: "omitContent retire le contenu extrait du résultat au lieu d'ajouter des détails." }
references:
  - title: Azure Content Understanding in Foundry Tools video overview
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview
  - title: Azure Content Understanding in Foundry Tools prebuilt analyzers
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers
