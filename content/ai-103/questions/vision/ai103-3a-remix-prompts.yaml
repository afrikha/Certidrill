id: ai103-3a-remix-prompts
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Travel remixes clips generated by a `sora-2` deployment. The reviewers have reported many visual defects in remixed clips. You plan a set of remix prompts for a completed clip of a cyclist on a coastal road. Each remix must keep as much of the original clip as possible and minimize visual defects.

    Which two remix prompts should you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Travel remixe des clips générés par un déploiement `sora-2`. Les réviseurs ont signalé de nombreux défauts visuels dans les clips remixés. Vous préparez un ensemble d'invites de remix pour un clip terminé d'un cycliste sur une route côtière. Chaque remix doit conserver autant que possible le clip d'origine et réduire au minimum les défauts visuels.

    Quelles sont les deux invites de remix à utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "\"Change the cyclist's jacket from blue to bright yellow.\""
        fr: "« Change the cyclist's jacket from blue to bright yellow. »"
    - id: b
      text:
        en: "\"Shift the color palette to cool blue tones with soft overcast light.\""
        fr: "« Shift the color palette to cool blue tones with soft overcast light. »"
    - id: c
      text:
        en: "\"Make it night, add rain, turn the bike red, and pan the camera left.\""
        fr: "« Make it night, add rain, turn the bike red, and pan the camera left. »"
    - id: d
      text:
        en: "\"Move the whole ride to a mountain pass with a new camera angle.\""
        fr: "« Move the whole ride to a mountain pass with a new camera angle. »"
    - id: e
      text:
        en: "\"Improve the video and fix anything that looks wrong.\""
        fr: "« Improve the video and fix anything that looks wrong. »"
answer: { optionIds: [a, b] }
explanation:
  correct:
    en: |
      The remix guidance is to limit each remix to one clearly articulated adjustment, such as the color of one object or the color palette and light. Narrow edits preserve the fidelity of the original clip and reduce visual defects, while the remix keeps the structure, scene transitions and layout.
    fr: |
      La recommandation pour le remix est de limiter chaque remix à un seul ajustement clairement formulé, comme la couleur d'un objet ou la palette de couleurs et la lumière. Des modifications étroites préservent la fidélité du clip d'origine et réduisent les défauts visuels, tandis que le remix conserve la structure, les transitions de scène et la disposition.
  options:
    c: { en: "Four changes in one remix go against the one-adjustment guidance and increase the risk of defects; the camera move also conflicts with keeping the original motion.", fr: "Quatre modifications dans un seul remix vont à l'encontre de la recommandation d'un seul ajustement et augmentent le risque de défauts ; le mouvement de caméra contredit aussi la conservation du mouvement d'origine." }
    d: { en: "A new setting and a new camera angle replace the structure of the clip: that is a new generation, not a targeted remix.", fr: "Un nouveau décor et un nouvel angle de caméra remplacent la structure du clip : c'est une nouvelle génération, pas un remix ciblé." }
    e: { en: "The prompt isn't a clearly articulated adjustment, so the result is unpredictable.", fr: "L'invite n'est pas un ajustement clairement formulé : le résultat est imprévisible." }
references:
  - title: Sora 2 video generation overview (preview)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/video-generation
