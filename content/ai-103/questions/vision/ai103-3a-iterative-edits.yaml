id: ai103-3a-iterative-edits
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Home uses the edits operation of a `gpt-image-1.5` deployment to try several backgrounds behind a photo of an armchair. Each edit is sent with the output of the previous edit and a prompt such as "Put the armchair in a beach house", without a mask. After five edits, the shape and fabric of the armchair no longer match the real product.

    You need to change only the background in each iteration and keep the armchair exactly as it is in the original photo. What should you do?
  fr: |
    Contoso Home utilise l'opération de modification d'un déploiement `gpt-image-1.5` pour essayer plusieurs arrière-plans derrière la photo d'un fauteuil. Chaque modification est envoyée avec la sortie de la modification précédente et une invite comme « Put the armchair in a beach house », sans masque. Après cinq modifications, la forme et le tissu du fauteuil ne correspondent plus au produit réel.

    Vous devez changer uniquement l'arrière-plan à chaque itération et conserver le fauteuil exactement tel qu'il est sur la photo d'origine. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Send each edit with the original photo and a mask that is transparent over the background only"
        fr: "Envoyer chaque modification avec la photo d'origine et un masque transparent uniquement sur l'arrière-plan"
    - id: b
      text:
        en: "Send each edit with the previous output and set `quality` to `high` in every request"
        fr: "Envoyer chaque modification avec la sortie précédente et définir `quality` sur `high` dans chaque requête"
    - id: c
      text:
        en: "Send each edit with the original photo and a mask that is transparent over the armchair only"
        fr: "Envoyer chaque modification avec la photo d'origine et un masque transparent uniquement sur le fauteuil"
    - id: d
      text:
        en: "Call the generations operation with `n=5` and a prompt that describes the armchair in detail"
        fr: "Appeler l'opération de génération avec `n=5` et une invite qui décrit le fauteuil en détail"
answer: { optionId: a }
explanation:
  correct:
    en: |
      Without a mask, each edit can change any part of the image, and chaining edits on previous outputs lets the product drift further each time. A mask whose fully transparent pixels cover only the background keeps every opaque pixel of the armchair, and starting each try from the original photo prevents accumulated changes.
    fr: |
      Sans masque, chaque modification peut changer n'importe quelle partie de l'image, et enchaîner les modifications sur les sorties précédentes fait dériver le produit un peu plus à chaque fois. Un masque dont les pixels entièrement transparents ne couvrent que l'arrière-plan conserve tous les pixels opaques du fauteuil, et repartir de la photo d'origine pour chaque essai évite l'accumulation des changements.
  options:
    b: { en: "Higher quality adds detail but doesn't restrict the edit to the background, so the armchair still drifts.", fr: "Une qualité plus élevée ajoute du détail mais ne limite pas la modification à l'arrière-plan : le fauteuil continue de dériver." }
    c: { en: "This mask is inverted: the transparent armchair pixels would be regenerated and the background kept.", fr: "Ce masque est inversé : les pixels transparents du fauteuil seraient régénérés et l'arrière-plan conservé." }
    d: { en: "A generation doesn't take the photo as input, so the armchair would be a new rendering, not the real product.", fr: "Une génération ne prend pas la photo en entrée : le fauteuil serait un nouveau rendu, pas le produit réel." }
references:
  - title: How to Use Image Generation Models from OpenAI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/dall-e
