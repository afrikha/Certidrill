id: ai103-1c-agent-red-team-cloud
objective: "1.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation has a prompt agent named **hr-agent** in Foundry Agent Service. hr-agent uses an Azure AI Search tool to answer employee questions. The Foundry project is in the Sweden Central region. Before the release, the security team must run an adversarial scan that measures the Attack Success Rate of hr-agent for the Sensitive data leakage and Prohibited actions risk categories.

    A developer ran a red teaming scan locally from a workstation, but the results don't include these two categories.

    What should you do?
  fr: |
    Adatum Corporation dispose d'un agent d'invite nommé **hr-agent** dans Foundry Agent Service. hr-agent utilise un outil Azure AI Search pour répondre aux questions des employés. Le projet Foundry se trouve dans la région Suède Centre. Avant la mise en production, l'équipe de sécurité doit exécuter une analyse adverse qui mesure le taux de réussite des attaques de hr-agent pour les catégories de risque Sensitive data leakage et Prohibited actions.

    Un développeur a exécuté localement une analyse de red teaming depuis un poste de travail, mais les résultats n'incluent pas ces deux catégories.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run the local scan again with the Crescendo and Multi turn attack strategies.", fr: "Réexécuter l'analyse locale avec les stratégies d'attaque Crescendo et Multi turn." }
    - id: b
      text: { en: "Run the AI Red Teaming Agent scan in the cloud from the Foundry project.", fr: "Exécuter l'analyse AI Red Teaming Agent dans le cloud depuis le projet Foundry." }
    - id: c
      text: { en: "Run an evaluation of a test dataset with the Prohibited Actions and Sensitive Data Leakage evaluators.", fr: "Exécuter une évaluation d'un jeu de données de test avec les évaluateurs Prohibited Actions et Sensitive Data Leakage." }
    - id: d
      text: { en: "Assign hr-agent a guardrail with Personally identifiable information and Task Adherence controls.", fr: "Attribuer à hr-agent un garde-fou doté des contrôles Personally identifiable information et Task Adherence." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The agentic risk categories of the AI Red Teaming Agent (Prohibited actions, Sensitive data leakage and Task adherence) apply to agents only and run only in the cloud. Cloud red teaming is available in Sweden Central, and a cloud run of hr-agent, a Foundry prompt agent that uses an Azure tool, returns the Attack Success Rate for these categories.
    fr: |
      Les catégories de risque agentiques de l'AI Red Teaming Agent (Prohibited actions, Sensitive data leakage et Task adherence) s'appliquent uniquement aux agents et s'exécutent uniquement dans le cloud. Le red teaming cloud est disponible en Suède Centre, et une exécution cloud de hr-agent, un agent d'invite Foundry qui utilise un outil Azure, renvoie le taux de réussite des attaques pour ces catégories.
  options:
    a:
      en: |
        Attack strategies change how prompts are transformed; they don't make cloud-only risk categories available locally. Agentic risk tests are also single-turn.
      fr: |
        Les stratégies d'attaque modifient la transformation des invites ; elles ne rendent pas disponibles en local les catégories de risque réservées au cloud. Les tests de risques agentiques sont en outre à un seul tour.
    c:
      en: |
        These evaluators score existing conversations; they don't generate adversarial attacks or compute an Attack Success Rate.
      fr: |
        Ces évaluateurs notent des conversations existantes ; ils ne génèrent pas d'attaques adverses et ne calculent pas de taux de réussite des attaques.
    d:
      en: |
        A guardrail blocks risks at run time; it doesn't measure how vulnerable hr-agent is before release.
      fr: |
        Un garde-fou bloque les risques à l'exécution ; il ne mesure pas la vulnérabilité de hr-agent avant la mise en production.
references:
  - title: AI Red Teaming Agent
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/ai-red-teaming-agent
