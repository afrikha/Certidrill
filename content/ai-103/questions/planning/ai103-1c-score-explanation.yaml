id: ai103-1c-score-explanation
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware, Inc. runs the Violence evaluator on 200 responses of its assistant in Microsoft Foundry. Twelve responses fail. A reviewer must understand, for each failed response, why the evaluator assigned its score, without rereading every response.

    Which field of the evaluation result should the reviewer read?
  fr: |
    Proseware, Inc. exécute l'évaluateur Violence sur 200 réponses de son assistant dans Microsoft Foundry. Douze réponses échouent. Un relecteur doit comprendre, pour chaque réponse en échec, pourquoi l'évaluateur a attribué son score, sans relire chaque réponse.

    Quel champ du résultat d'évaluation le relecteur doit-il lire ?
body:
  options:
    - { id: a, text: threshold }
    - { id: b, text: label }
    - { id: c, text: reason }
    - { id: d, text: passed }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The result of each evaluated row contains a `reason` field next to the score, which explains why the severity was assigned. It's the explanation that a reviewer reads to understand a failure.
    fr: |
      Le résultat de chaque ligne évaluée contient un champ `reason` à côté du score, qui explique pourquoi la gravité a été attribuée. C'est l'explication que lit un relecteur pour comprendre un échec.
  options:
    a:
      en: |
        threshold is the value that the score is compared with, the same for every row.
      fr: |
        threshold est la valeur à laquelle le score est comparé, identique pour chaque ligne.
    b:
      en: |
        label only says pass or fail.
      fr: |
        label indique seulement pass ou fail.
    d:
      en: |
        passed is a Boolean result; it doesn't say why the response failed.
      fr: |
        passed est un résultat booléen ; il n'indique pas pourquoi la réponse a échoué.
references:
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
