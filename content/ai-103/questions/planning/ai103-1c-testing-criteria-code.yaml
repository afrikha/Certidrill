id: ai103-1c-testing-criteria-code
objective: "1.4.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank evaluates a model deployment named **chat-kb** in Microsoft Foundry. Each row of the test dataset has two fields: `query` and `context`. The evaluation run sends each query to chat-kb and evaluates the generated response.

    The run must use two criteria:

    - Violence, scored by the Foundry evaluation service.
    - A 1–5 score that measures whether the response is supported by the context of the row, judged by the **gpt-4.1-mini** deployment.

    How should you complete the Python code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank évalue un déploiement de modèle nommé **chat-kb** dans Microsoft Foundry. Chaque ligne du jeu de données de test comporte deux champs : `query` et `context`. L'exécution de l'évaluation envoie chaque requête à chat-kb et évalue la réponse générée.

    L'exécution doit utiliser deux critères :

    - Violence, noté par le service d'évaluation Foundry.
    - Un score de 1 à 5 qui mesure si la réponse est étayée par le contexte de la ligne, jugé par le déploiement **gpt-4.1-mini**.

    Comment devez-vous compléter le code Python ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    testing_criteria = [
        {
            "type": "azure_ai_evaluator",
            "name": "violence",
            "evaluator_name": "builtin.violence",
            "data_mapping": {"query": "{{item.query}}", "response": "{{sample.output_text}}"},
        },
        {
            "type": "azure_ai_evaluator",
            "name": "support",
            "evaluator_name": [[ev]],
            [[init]]: {"deployment_name": "gpt-4.1-mini"},
            "data_mapping": {"context": [[ctx]], "response": "{{sample.output_text}}"},
        },
    ]
  slots:
    - id: ev
      options:
        - { id: grd, text: '"builtin.groundedness"' }
        - { id: rel, text: '"builtin.relevance"' }
        - { id: ret, text: '"builtin.retrieval"' }
    - id: init
      options:
        - { id: initp, text: '"initialization_parameters"' }
        - { id: source, text: '"data_source"' }
        - { id: level, text: '"evaluation_level"' }
    - id: ctx
      options:
        - { id: itemctx, text: '"{{item.context}}"' }
        - { id: output, text: '"{{sample.output_text}}"' }
        - { id: items, text: '"{{sample.output_items}}"' }
        - { id: query, text: '"{{item.query}}"' }
answer:
  values: { ev: grd, init: initp, ctx: itemctx }
explanation:
  correct:
    en: |
      `builtin.groundedness` scores from 1 to 5 whether the response is supported by the context, and as an AI-assisted evaluator it receives its judge model through `initialization_parameters` with `deployment_name`. The context comes from the dataset row, so it's mapped with `{{item.context}}`, while `{{sample.output_text}}` is the response generated during the run. The Violence evaluator needs no deployment because the Foundry evaluation service hosts it.
    fr: |
      `builtin.groundedness` note de 1 à 5 si la réponse est étayée par le contexte et, en tant qu'évaluateur assisté par IA, reçoit son modèle juge par `initialization_parameters` avec `deployment_name`. Le contexte provient de la ligne du jeu de données : il est mappé avec `{{item.context}}`, tandis que `{{sample.output_text}}` est la réponse générée pendant l'exécution. L'évaluateur Violence n'a pas besoin de déploiement, car le service d'évaluation Foundry l'héberge.
  options:
    ev:
      en: |
        Relevance measures whether the response addresses the query, and Retrieval measures whether the context is relevant to the query; neither checks the response against the context.
      fr: |
        Relevance mesure si la réponse traite la requête, et Retrieval si le contexte est pertinent pour la requête ; aucun ne vérifie la réponse par rapport au contexte.
    ctx:
      en: |
        The sample fields hold what the run generates (the response text or the agent output items), not the context stored in the dataset.
      fr: |
        Les champs sample contiennent ce que l'exécution génère (le texte de réponse ou les éléments de sortie d'un agent), pas le contexte stocké dans le jeu de données.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
