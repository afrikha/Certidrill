id: ai103-1c-eval-results-grid
objective: "1.4.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Adatum Corporation evaluates a RAG assistant in Microsoft Foundry. All the evaluators use their default thresholds. The following table shows the results of six evaluator runs on the same response set.

    Answer each prompt by selecting the result in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation évalue un assistant RAG dans Microsoft Foundry. Tous les évaluateurs utilisent leurs seuils par défaut. Le tableau suivant montre les résultats de six exécutions d'évaluateurs sur le même ensemble de réponses.

    Répondez à chaque consigne en sélectionnant le résultat dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The result of a risk and safety evaluator that failed", fr: "Le résultat d'un évaluateur de risque et de sécurité qui a échoué" }
    - id: p2
      text: { en: "The result of a RAG evaluator that failed", fr: "Le résultat d'un évaluateur RAG qui a échoué" }
  grid:
    header: [{ en: Result, fr: Résultat }, { en: Evaluator, fr: Évaluateur }, Score, { en: Threshold, fr: Seuil }]
    rows:
      - [{ text: R1, area: r1 }, { text: Violence }, { text: "2" }, { text: "3" }]
      - [{ text: R2, area: r2 }, { text: Self-Harm }, { text: "4" }, { text: "3" }]
      - [{ text: R3, area: r3 }, { text: Hate and Unfairness }, { text: "3" }, { text: "3" }]
      - [{ text: R4, area: r4 }, { text: Groundedness }, { text: "3" }, { text: "3" }]
      - [{ text: R5, area: r5 }, { text: Relevance }, { text: "2" }, { text: "3" }]
      - [{ text: R6, area: r6 }, { text: Retrieval }, { text: "5" }, { text: "3" }]
answer:
  values: { p1: r2, p2: r5 }
explanation:
  correct:
    en: |
      Content safety evaluators return a 0–7 severity and fail when the score is above the threshold, so only Self-Harm (4) fails; Hate and Unfairness at 3 is at the threshold and passes. RAG evaluators such as Groundedness, Relevance and Retrieval return a 1–5 score and fail below the threshold, so only Relevance (2) fails; Groundedness at 3 passes.
    fr: |
      Les évaluateurs de sécurité du contenu renvoient une gravité de 0 à 7 et échouent quand le score dépasse le seuil : seul Self-Harm (4) échoue ; Hate and Unfairness à 3 est au seuil et réussit. Les évaluateurs RAG comme Groundedness, Relevance et Retrieval renvoient un score de 1 à 5 et échouent sous le seuil : seul Relevance (2) échoue ; Groundedness à 3 réussit.
references:
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
