id: ai103-cs2b-private-agent
objective: "1.2.1"
type: multi
caseStudy: ai103-cs2b-trey-research
difficulty: 2
status: draft
stem:
  en: |
    You are designing the agent environment of clinical-prj so that protocol-assistant can use the Azure AI Search tool with trey-search. You need to meet the network requirement.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez l'environnement d'agents de clinical-prj pour que protocol-assistant puisse utiliser l'outil Azure AI Search avec trey-search. Vous devez satisfaire l'exigence relative au réseau.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: |
          Deploy a basic agent setup for clinical-prj.
        fr: |
          Déployer une configuration d'agent de base pour clinical-prj.
    - id: b
      text:
        en: |
          Deploy a standard agent setup with virtual network injection for clinical-prj.
        fr: |
          Déployer une configuration d'agent standard avec injection de réseau virtuel pour clinical-prj.
    - id: c
      text:
        en: |
          Configure the trey-search connection to authenticate by using an API key of trey-search.
        fr: |
          Configurer la connexion trey-search pour qu'elle s'authentifie à l'aide d'une clé API de trey-search.
    - id: d
      text:
        en: |
          Configure the trey-search connection to authenticate by using the managed identity of trey-foundry.
        fr: |
          Configurer la connexion trey-search pour qu'elle s'authentifie à l'aide de l'identité managée de trey-foundry.
    - id: e
      text:
        en: |
          Enable public network access on trey-search, restricted to the outbound IP addresses of trey-foundry.
        fr: |
          Activer l'accès réseau public sur trey-search, limité aux adresses IP sortantes de trey-foundry.
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A basic agent setup doesn't support a search service whose public access is disabled and that is reached through a private endpoint; you need a standard agent setup with virtual network injection. With private networking, the connection must use Microsoft Entra ID with the managed identity of the Foundry account (with Search Index Data Contributor and Search Service Contributor on trey-search); key-based authentication isn't supported.
    fr: |
      Une configuration d'agent de base ne prend pas en charge un service de recherche dont l'accès public est désactivé et qui est joint par un point de terminaison privé ; il faut une configuration d'agent standard avec injection de réseau virtuel. Avec un réseau privé, la connexion doit utiliser Microsoft Entra ID avec l'identité managée du compte Foundry (avec Search Index Data Contributor et Search Service Contributor sur trey-search) ; l'authentification par clé n'est pas prise en charge.
  options:
    a:
      en: |
        A basic agent setup can't reach a search service that only accepts traffic through a private endpoint.
      fr: |
        Une configuration d'agent de base ne peut pas joindre un service de recherche qui n'accepte le trafic que par un point de terminaison privé.
    c:
      en: |
        Key-based authentication isn't supported when the agent reaches the search service over private networking.
      fr: |
        L'authentification par clé n'est pas prise en charge quand l'agent joint le service de recherche par un réseau privé.
    e:
      en: |
        The requirement says that public network access must stay disabled.
      fr: |
        L'exigence impose que l'accès réseau public reste désactivé.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
