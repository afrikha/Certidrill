id: ai103-1b-oidc-login-fix
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Coho Winery has a GitHub Actions workflow that evaluates a Foundry agent. The workflow uses `azure/login@v2` with the `client-id`, `tenant-id` and `subscription-id` inputs, read from GitHub variables. The client ID belongs to a user-assigned managed identity that has a federated identity credential. No client secret exists.

    The `azure/login` step fails before the evaluation starts.

    Which two issues could cause the failure?

    NOTE: Each correct selection is worth one point.
  fr: |
    Coho Winery dispose d'un flux de travail GitHub Actions qui évalue un agent Foundry. Le flux de travail utilise `azure/login@v2` avec les entrées `client-id`, `tenant-id` et `subscription-id`, lues dans des variables GitHub. L'ID client appartient à une identité managée affectée par l'utilisateur qui possède des informations d'identification fédérées. Aucune clé secrète client n'existe.

    L'étape `azure/login` échoue avant le début de l'évaluation.

    Quels sont les deux problèmes qui pourraient provoquer l'échec ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Public network access to the Foundry resource is disabled.", fr: "L'accès réseau public à la ressource Foundry est désactivé." } }
    - { id: b, text: { en: "The workflow doesn't grant the `id-token: write` permission.", fr: "Le flux de travail n'accorde pas l'autorisation `id-token: write`." } }
    - { id: c, text: { en: "No `AZURE_CLIENT_SECRET` secret is defined in the repository.", fr: "Aucun secret `AZURE_CLIENT_SECRET` n'est défini dans le dépôt." } }
    - { id: d, text: { en: "The subject of the federated credential doesn't match the `sub` claim of the job's token.", fr: "Le sujet des informations d'identification fédérées ne correspond pas à la revendication `sub` du jeton du travail." } }
    - { id: e, text: { en: "The identifiers are stored as GitHub variables instead of secrets.", fr: "Les identificateurs sont stockés dans des variables GitHub au lieu de secrets." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      With OpenID Connect, the job requests a GitHub token, which requires the `id-token: write` permission, and Microsoft Entra ID exchanges it only if the federated credential's issuer, audience and subject exactly match the token. A mismatched subject is accepted when you create the credential and fails only at the token exchange.
    fr: |
      Avec OpenID Connect, le travail demande un jeton GitHub, ce qui exige l'autorisation `id-token: write`, et Microsoft Entra ID ne l'échange que si l'émetteur, l'audience et le sujet des informations d'identification fédérées correspondent exactement au jeton. Un sujet incorrect est accepté à la création des informations d'identification et n'échoue qu'au moment de l'échange de jetons.
  options:
    a:
      en: |
        Signing in to Microsoft Entra ID doesn't go through the Foundry endpoint, so its network settings don't affect the login step.
      fr: |
        La connexion à Microsoft Entra ID ne passe pas par le point de terminaison Foundry : ses paramètres réseau n'affectent pas l'étape de connexion.
    c:
      en: |
        OpenID Connect replaces the client secret; none is needed.
      fr: |
        OpenID Connect remplace la clé secrète client ; aucune n'est nécessaire.
    e:
      en: |
        The client ID, tenant ID and subscription ID aren't secrets; Microsoft's Foundry samples read them from GitHub variables.
      fr: |
        L'ID client, l'ID de locataire et l'ID d'abonnement ne sont pas des secrets ; les exemples Foundry de Microsoft les lisent dans des variables GitHub.
references:
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
  - title: Create a trust relationship between an app and an external identity provider
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
