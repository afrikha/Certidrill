id: ai103-1c-user-delegated-access
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. builds an agent in Foundry Agent Service that summarizes the open tickets of the Payments team every night. A scheduled job starts the agent, so no user is signed in. The agent uses an internal MCP server that accepts Microsoft Entra tokens issued to agent identities and authorizes each call by app role: Tickets.Read.Payments, Tickets.Read.All and Tickets.Write.All.

    The agent must have only the access that it needs, and no secret may be stored.

    How should you configure access for the tool?
  fr: |
    Proseware, Inc. crée dans Foundry Agent Service un agent qui résume chaque nuit les tickets ouverts de l'équipe Payments. Une tâche planifiée démarre l'agent : aucun utilisateur n'est connecté. L'agent utilise un serveur MCP interne qui accepte les jetons Microsoft Entra émis pour des identités d'agent et autorise chaque appel selon le rôle d'application : Tickets.Read.Payments, Tickets.Read.All et Tickets.Write.All.

    L'agent ne doit disposer que de l'accès dont il a besoin, et aucun secret ne doit être stocké.

    Comment devez-vous configurer l'accès de l'outil ?
body:
  options:
    - id: a
      text: { en: "Use agent identity authentication, and assign the agent identity only the Tickets.Read.Payments app role.", fr: "Utiliser l'authentification par identité d'agent, et attribuer à l'identité d'agent uniquement le rôle d'application Tickets.Read.Payments." }
    - id: b
      text: { en: "Use agent identity authentication, and assign the agent identity the Tickets.Read.All app role.", fr: "Utiliser l'authentification par identité d'agent, et attribuer à l'identité d'agent le rôle d'application Tickets.Read.All." }
    - id: c
      text: { en: "Configure user delegation so that the tool acts on behalf of the signed-in user.", fr: "Configurer la délégation d'utilisateur pour que l'outil agisse pour le compte de l'utilisateur connecté." }
    - id: d
      text: { en: "Use agent identity authentication, and keep the permissions that a new agent identity receives by default.", fr: "Utiliser l'authentification par identité d'agent, et conserver les autorisations qu'une nouvelle identité d'agent reçoit par défaut." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Application-only access with the agent identity works without a signed-in user and stores no secret. A new agent identity starts with no permissions, so you grant it only the app role it needs on the target, here Tickets.Read.Payments.
    fr: |
      L'accès application uniquement avec l'identité d'agent fonctionne sans utilisateur connecté et ne stocke aucun secret. Une nouvelle identité d'agent démarre sans autorisation : vous ne lui accordez que le rôle d'application dont elle a besoin sur la cible, ici Tickets.Read.Payments.
  options:
    b:
      en: |
        Tickets.Read.All lets the agent read the tickets of every team, which exceeds what it needs.
      fr: |
        Tickets.Read.All permet à l'agent de lire les tickets de toutes les équipes, ce qui dépasse ce dont il a besoin.
    c:
      en: |
        Delegated access needs a signed-in user, and no user is signed in during the nightly run. An agent identity acting on behalf of the user is also in preview.
      fr: |
        L'accès délégué nécessite un utilisateur connecté, et aucun utilisateur n'est connecté pendant l'exécution nocturne. Une identité d'agent qui agit pour le compte de l'utilisateur est en outre en préversion.
    d:
      en: |
        A new agent identity starts without resource permissions, and Foundry assigns it no role automatically, so every call would be refused.
      fr: |
        Une nouvelle identité d'agent démarre sans autorisation sur les ressources, et Foundry ne lui attribue aucun rôle automatiquement : chaque appel serait refusé.
references:
  - title: Agent identity concepts in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
