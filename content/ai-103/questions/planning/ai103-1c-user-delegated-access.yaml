id: ai103-1c-user-delegated-access
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware, Inc. builds an agent in Foundry Agent Service that uses the Azure DevOps MCP tool to answer questions about work items. Developers use the agent from an internal application in which they sign in with Microsoft Entra ID.

    Each developer must see only the work items that they are already allowed to see in Azure DevOps. The agent must not have broad access of its own to all the projects.

    How should you configure access for the tool?
  fr: |
    Proseware, Inc. crée un agent dans Foundry Agent Service qui utilise l'outil MCP Azure DevOps pour répondre aux questions sur les éléments de travail. Les développeurs utilisent l'agent depuis une application interne dans laquelle ils se connectent avec Microsoft Entra ID.

    Chaque développeur ne doit voir que les éléments de travail qu'il est déjà autorisé à voir dans Azure DevOps. L'agent ne doit pas disposer de son propre accès étendu à tous les projets.

    Comment devez-vous configurer l'accès de l'outil ?
body:
  options:
    - id: a
      text: { en: "Use application-only access with the agent identity, and grant it read access to every Azure DevOps project.", fr: "Utiliser l'accès application uniquement avec l'identité d'agent, et lui accorder la lecture sur chaque projet Azure DevOps." }
    - id: b
      text: { en: "Store the personal access token of a service account in a custom keys project connection.", fr: "Stocker le jeton d'accès personnel d'un compte de service dans une connexion de projet à clés personnalisées." }
    - id: c
      text: { en: "Configure user delegation so that the tool acts on behalf of the signed-in developer.", fr: "Configurer la délégation d'utilisateur pour que l'outil agisse pour le compte du développeur connecté." }
    - id: d
      text: { en: "Use project managed identity authentication, and grant the identity read access to every project.", fr: "Utiliser l'authentification par identité managée du projet, et accorder à cette identité la lecture sur chaque projet." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With delegated (on-behalf-of-user) access, the agent acts for the signed-in user: the agent needs the delegated permissions, and the user needs access to the resource, so each developer sees only what Azure DevOps already allows them to see. Azure DevOps MCP is one of the tools that support on-behalf-of-user access.
    fr: |
      Avec l'accès délégué (pour le compte de l'utilisateur), l'agent agit pour l'utilisateur connecté : l'agent a besoin des autorisations déléguées et l'utilisateur doit avoir accès à la ressource. Chaque développeur ne voit donc que ce qu'Azure DevOps l'autorise déjà à voir. Azure DevOps MCP fait partie des outils qui prennent en charge l'accès pour le compte de l'utilisateur.
  options:
    a:
      en: |
        Application-only access uses the permissions of the agent identity, so every developer would see every project.
      fr: |
        L'accès application uniquement utilise les autorisations de l'identité d'agent : chaque développeur verrait tous les projets.
    b:
      en: |
        A shared token gives every developer the permissions of the service account, not their own.
      fr: |
        Un jeton partagé donne à chaque développeur les autorisations du compte de service, et non les siennes.
    d:
      en: |
        The project managed identity is a single identity shared by all callers, which gives the agent broad access of its own.
      fr: |
        L'identité managée du projet est une identité unique partagée par tous les appelants, ce qui donne à l'agent son propre accès étendu.
references:
  - title: Agent identity concepts in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/agent-identity
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
