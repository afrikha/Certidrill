id: ai103-1a-action-tools
objective: "1.1.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is adding actions to its procurement agent in Foundry Agent Service.

    Which tool should you use for each action? To answer, drag the appropriate tools to the correct actions. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys ajoute des actions à son agent d'achats dans Foundry Agent Service.

    Quel outil devez-vous utiliser pour chaque action ? Pour répondre, faites glisser les outils appropriés vers les actions correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: a2a, text: { en: "Agent-to-agent (A2A)", fr: "Agent-to-agent (A2A)" } }
    - { id: browser, text: { en: "Browser automation", fr: "Automatisation du navigateur" } }
    - { id: mcp, text: MCP }
    - { id: ci, text: { en: "Code interpreter", fr: "Interpréteur de code" } }
    - { id: fs, text: { en: "File search", fr: "Recherche de fichiers" } }
    - { id: fn, text: { en: "Function calling", fr: "Appel de fonction" } }
  targets:
    - id: delegate
      text: { en: "Delegate contract translation to the legal team's agent endpoint", fr: "Déléguer la traduction des contrats au point de terminaison de l'agent de l'équipe juridique" }
    - id: portal
      text: { en: "Fill in the order form of a supplier web portal that has no API", fr: "Remplir le formulaire de commande du portail web d'un fournisseur qui n'a pas d'API" }
    - id: server
      text: { en: "Use the stock tools that a distributor publishes on a remote Model Context Protocol server", fr: "Utiliser les outils de stock qu'un distributeur publie sur un serveur Model Context Protocol distant" }
    - id: chart
      text: { en: "Run Python to compute price trends and draw a chart from an uploaded CSV file", fr: "Exécuter du Python pour calculer l'évolution des prix et tracer un graphique à partir d'un fichier CSV chargé" }
answer:
  mapping: { delegate: a2a, portal: browser, server: mcp, chart: ci }
explanation:
  correct:
    en: |
      The A2A tool calls other agents to delegate a task. Browser automation drives a browser to operate web pages. The MCP tool connects the agent to a remote Model Context Protocol server and its tools. Code interpreter runs generated Python code in a sandbox, for example to compute statistics and create charts from files.
    fr: |
      L'outil A2A appelle d'autres agents pour leur déléguer une tâche. L'automatisation du navigateur pilote un navigateur pour manipuler des pages web. L'outil MCP connecte l'agent à un serveur Model Context Protocol distant et à ses outils. L'interpréteur de code exécute du code Python généré dans un bac à sable, par exemple pour calculer des statistiques et créer des graphiques à partir de fichiers.
  options:
    fs:
      en: File search retrieves content from uploaded files; it performs no action.
      fr: La recherche de fichiers récupère du contenu dans des fichiers chargés ; elle n'effectue aucune action.
    fn:
      en: Function calling needs your client application to run the code; each action here has a built-in tool that the service runs.
      fr: L'appel de fonction nécessite que votre application cliente exécute le code ; chaque action ici dispose d'un outil intégré exécuté par le service.
references:
  - title: What is Toolbox in Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/tool-catalog
