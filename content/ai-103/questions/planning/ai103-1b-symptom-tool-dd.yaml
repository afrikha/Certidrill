id: ai103-1b-symptom-tool-dd
objective: "1.3.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware monitors a production agent in Microsoft Foundry. Application Insights is connected to the project, and content filters are configured on the deployment.

    Which monitoring capability should you use to investigate each issue? To answer, drag the appropriate capabilities to the correct issues. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware surveille un agent de production dans Microsoft Foundry. Application Insights est connecté au projet, et des filtres de contenu sont configurés sur le déploiement.

    Quelle fonctionnalité de surveillance devez-vous utiliser pour examiner chaque problème ? Pour répondre, faites glisser les fonctionnalités appropriées vers les problèmes correspondants. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ground, text: { en: "The Groundedness evaluator", fr: "L'évaluateur Groundedness" } }
    - { id: trace, text: { en: "The trace of the run", fr: "La trace de l'exécution" } }
    - { id: blocked, text: { en: "The Blocked Volume metric", fr: "La métrique Blocked Volume" } }
    - { id: sched, text: { en: "A scheduled evaluation on a fixed test dataset", fr: "Une évaluation planifiée sur un jeu de données de test fixe" } }
    - { id: usages, text: { en: "The quota page of the Foundry portal", fr: "La page de quota du portail Foundry" } }
  targets:
    - { id: t1, text: { en: "Answers contain facts that aren't in the retrieved documents", fr: "Des réponses contiennent des faits absents des documents récupérés" } }
    - { id: t2, text: { en: "One run called the wrong tool with the wrong arguments", fr: "Une exécution a appelé le mauvais outil avec de mauvais arguments" } }
    - { id: t3, text: { en: "The share of prompts rejected by the content filters is rising", fr: "La part des invites rejetées par les filtres de contenu augmente" } }
    - { id: t4, text: { en: "Quality seems to decline slowly from month to month", fr: "La qualité semble baisser lentement de mois en mois" } }
answer:
  mapping: { t1: ground, t2: trace, t3: blocked, t4: sched }
explanation:
  correct:
    en: |
      Groundedness measures whether a response is supported by the context it was given. A trace records every model call, tool invocation and argument of a single run. Blocked Volume counts the calls rejected by the content filters over time. Running the same test dataset on a schedule and comparing the runs reveals drift. The quota page shows capacity, not quality.
    fr: |
      Groundedness mesure si une réponse est étayée par le contexte fourni. Une trace enregistre chaque appel de modèle, chaque appel d'outil et ses arguments pour une exécution. Blocked Volume compte au fil du temps les appels rejetés par les filtres de contenu. Exécuter le même jeu de test selon une planification et comparer les exécutions révèle une dérive. La page de quota montre la capacité, pas la qualité.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
  - title: Monitoring data reference for Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/openai/monitor-openai-reference
