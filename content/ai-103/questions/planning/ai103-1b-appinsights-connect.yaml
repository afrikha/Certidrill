id: ai103-1b-appinsights-connect
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank has a Foundry project that hosts three agents in production. The operations team wants to use the Foundry portal to see real-time dashboards of token consumption, latency, error rates and quality scores for the agents, and to open the trace of any run. The dashboards are empty and no trace is available.

    What should you do first?
  fr: |
    Woodgrove Bank dispose d'un projet Foundry qui héberge trois agents en production. L'équipe d'exploitation souhaite utiliser le portail Foundry pour voir des tableaux de bord en temps réel de la consommation de jetons, de la latence, des taux d'erreur et des scores de qualité des agents, et pour ouvrir la trace de n'importe quelle exécution. Les tableaux de bord sont vides et aucune trace n'est disponible.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Create a diagnostic setting on the Foundry resource that sends logs to a storage account.", fr: "Créer un paramètre de diagnostic sur la ressource Foundry qui envoie les journaux vers un compte de stockage." } }
    - { id: b, text: { en: "Connect an Azure Monitor Application Insights resource to the project.", fr: "Connecter une ressource Azure Monitor Application Insights au projet." } }
    - { id: c, text: { en: "Switch the content filter of the deployments to annotate mode.", fr: "Passer le filtre de contenu des déploiements en mode annotation." } }
    - { id: d, text: { en: "Assign the Cognitive Services Usages Reader role to the operations team.", fr: "Attribuer le rôle Cognitive Services Usages Reader à l'équipe d'exploitation." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Foundry monitoring and tracing are integrated with Azure Monitor Application Insights: the dashboards of operational metrics and quality scores and the OpenTelemetry traces of agent runs are stored there. Connecting an Application Insights resource to the project is the prerequisite for both.
    fr: |
      La surveillance et le traçage de Foundry sont intégrés à Azure Monitor Application Insights : les tableaux de bord des métriques opérationnelles et des scores de qualité, ainsi que les traces OpenTelemetry des exécutions d'agents, y sont stockés. Connecter une ressource Application Insights au projet est le prérequis des deux.
  options:
    a:
      en: |
        Resource logs in a storage account don't feed the Foundry dashboards or the traces of agent runs.
      fr: |
        Des journaux de ressource dans un compte de stockage n'alimentent ni les tableaux de bord Foundry ni les traces des exécutions d'agents.
    c:
      en: |
        Annotate mode changes how content filters handle detections; it doesn't collect metrics or traces.
      fr: |
        Le mode annotation modifie la façon dont les filtres de contenu traitent les détections ; il ne collecte ni métriques ni traces.
    d:
      en: |
        This role only lets users read quota at the subscription scope.
      fr: |
        Ce rôle permet seulement de lire le quota à l'étendue de l'abonnement.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
