id: ai103-1a-voice-agent
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Insurance wants a customer-facing agent that answers phone calls with low-latency speech. The agent must be managed by Microsoft Foundry, and the team doesn't want to write or maintain orchestration code.

    Which agent type should you create?
  fr: |
    Contoso Insurance veut un agent destiné aux clients qui répond aux appels téléphoniques avec une voix à faible latence. L'agent doit être géré par Microsoft Foundry, et l'équipe ne veut pas écrire ni maintenir de code d'orchestration.

    Quel type d'agent devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "A voice-based prompt agent", fr: "Un agent d'invite vocal" } }
    - { id: b, text: { en: "A hosted agent that exposes a WebSocket endpoint", fr: "Un agent hébergé qui expose un point de terminaison WebSocket" } }
    - { id: c, text: { en: "A workflow agent with a group-chat pattern", fr: "Un agent de workflow avec un modèle de conversation de groupe" } }
    - { id: d, text: { en: "A text prompt agent that calls Azure Speech batch transcription", fr: "Un agent d'invite textuel qui appelle la transcription par lots d'Azure Speech" } }
answer: { optionId: a }
explanation:
  correct:
    en: Foundry lets you build managed voice-based prompt agents in the portal or SDK. Like other prompt agents, they are defined by configuration, so the team writes no orchestration code, and they are designed for low-latency audio interaction such as call centers.
    fr: |
      Foundry permet de créer des agents d'invite vocaux managés dans le portail ou avec le SDK. Comme les autres agents d'invite, ils sont définis par configuration : l'équipe n'écrit aucun code d'orchestration, et ils sont conçus pour les interactions audio à faible latence, comme les centres d'appels.
  options:
    b:
      en: A hosted agent can stream audio over WebSocket, but it is your own code in a container, which the team doesn't want to maintain.
      fr: Un agent hébergé peut diffuser de l'audio par WebSocket, mais c'est votre propre code dans un conteneur, que l'équipe ne veut pas maintenir.
    c:
      en: A workflow agent coordinates several agents or steps; it isn't the agent type for real-time voice conversations.
      fr: Un agent de workflow coordonne plusieurs agents ou étapes ; ce n'est pas le type d'agent destiné aux conversations vocales en temps réel.
    d:
      en: Batch transcription processes recorded audio asynchronously; it can't support a live phone conversation.
      fr: La transcription par lots traite de l'audio enregistré de façon asynchrone ; elle ne permet pas une conversation téléphonique en direct.
references:
  - title: What is Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/what-is-azure-ai-foundry
