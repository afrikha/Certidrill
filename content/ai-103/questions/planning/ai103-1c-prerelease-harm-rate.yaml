id: ai103-1c-prerelease-harm-rate
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. is about to release a wellness chatbot built on a Microsoft Foundry model deployment. The team has a JSONL dataset of 400 test queries with the responses that the chatbot produced.

    Before the release, you need to report the percentage of these responses that contain violent or self-harm content.

    What should you do?
  fr: |
    Litware, Inc. s'apprête à mettre en production un chatbot de bien-être basé sur un déploiement de modèle Microsoft Foundry. L'équipe dispose d'un jeu de données JSONL de 400 requêtes de test avec les réponses produites par le chatbot.

    Avant la mise en production, vous devez indiquer le pourcentage de ces réponses qui contiennent du contenu violent ou d'automutilation.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign a guardrail whose Violence and Self-harm controls use the High blocking level.", fr: "Attribuer un garde-fou dont les contrôles Violence et Self-harm utilisent le niveau de blocage High." }
    - id: b
      text: { en: "Run an AI Red Teaming Agent scan that uses the Base64 attack strategy.", fr: "Exécuter une analyse AI Red Teaming Agent qui utilise la stratégie d'attaque Base64." }
    - id: c
      text: { en: "Run an evaluation of the dataset with the Violence and Self-Harm evaluators.", fr: "Exécuter une évaluation du jeu de données avec les évaluateurs Violence et Self-Harm." }
    - id: d
      text: { en: "Connect Application Insights to the project and review the traces of the chatbot.", fr: "Connecter Application Insights au projet et examiner les traces du chatbot." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Risk and safety evaluators score each response of a dataset, and the evaluation reports a defect rate: the percentage of responses with undesired content. Running the Violence and Self-Harm evaluators on the 400 rows gives the required figure before release.
    fr: |
      Les évaluateurs de risque et de sécurité notent chaque réponse d'un jeu de données, et l'évaluation indique un taux de défauts : le pourcentage de réponses au contenu indésirable. Exécuter les évaluateurs Violence et Self-Harm sur les 400 lignes donne le chiffre demandé avant la mise en production.
  options:
    a:
      en: |
        A guardrail blocks or annotates content on each live request; it doesn't measure an existing set of responses.
      fr: |
        Un garde-fou bloque ou annote le contenu de chaque requête en direct ; il ne mesure pas un ensemble de réponses existant.
    b:
      en: |
        The red teaming agent generates its own adversarial prompts and reports an attack success rate; it doesn't score the team's existing responses.
      fr: |
        L'agent de red teaming génère ses propres invites adverses et indique un taux de réussite des attaques ; il ne note pas les réponses existantes de l'équipe.
    d:
      en: |
        Traces record the steps of each run; they don't classify responses for harmful content.
      fr: |
        Les traces enregistrent les étapes de chaque exécution ; elles ne classent pas les réponses selon leur contenu nuisible.
references:
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
