id: ai103-1b-ptu-version-migrate
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Relecloud has a Microsoft Foundry resource that contains a Global Provisioned deployment named **ptu-chat**. The deployment runs version A of a model, and version B of the same model is now available.

    You need to move ptu-chat to version B. The solution must meet the following requirements:

    - The applications must keep calling the deployment named ptu-chat.
    - The number of PTUs must stay the same.
    - Administrative effort must be minimized.

    What should you do?
  fr: |
    Relecloud dispose d'une ressource Microsoft Foundry qui contient un déploiement Global Provisioned nommé **ptu-chat**. Le déploiement exécute la version A d'un modèle, et la version B du même modèle est désormais disponible.

    Vous devez faire passer ptu-chat à la version B. La solution doit répondre aux exigences suivantes :

    - Les applications doivent continuer d'appeler le déploiement nommé ptu-chat.
    - Le nombre de PTU doit rester le même.
    - L'effort d'administration doit être réduit au minimum.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the version upgrade policy of ptu-chat to OnceNewDefaultVersionAvailable.", fr: "Définir la stratégie de mise à niveau de version de ptu-chat sur OnceNewDefaultVersionAvailable." } }
    - { id: b, text: { en: "Update the model version of ptu-chat to version B in place.", fr: "Mettre à jour sur place la version du modèle de ptu-chat vers la version B." } }
    - { id: c, text: { en: "Create a Global Standard deployment of version B and set it as the spillover deployment of ptu-chat.", fr: "Créer un déploiement Global Standard de la version B et le définir comme déploiement de débordement (spillover) de ptu-chat." } }
    - { id: d, text: { en: "Create a Data Zone Provisioned deployment of version B and move the traffic to it.", fr: "Créer un déploiement Data Zone Provisioned de la version B et y basculer le trafic." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Automatic version upgrades apply only to Standard deployment types; provisioned deployments are migrated. An in-place migration keeps the deployment name and size: the service moves the traffic to the new version over a 20 to 30 minute window while the deployment shows an updating state.
    fr: |
      Les mises à niveau automatiques de version ne s'appliquent qu'aux types de déploiement Standard ; les déploiements provisionnés sont migrés. Une migration sur place conserve le nom et la taille du déploiement : le service bascule le trafic vers la nouvelle version sur une fenêtre de 20 à 30 minutes, pendant laquelle le déploiement affiche un état de mise à jour.
  options:
    a:
      en: |
        Automatic model updates aren't supported on provisioned deployment types.
      fr: |
        Les mises à jour automatiques de modèle ne sont pas prises en charge sur les types de déploiement provisionnés.
    c:
      en: |
        Spillover only serves the requests that ptu-chat can't handle, and the spillover deployment must match the model and version of the provisioned deployment.
      fr: |
        Le débordement ne traite que les requêtes que ptu-chat ne peut pas absorber, et le déploiement de débordement doit correspondre au modèle et à la version du déploiement provisionné.
    d:
      en: |
        Migrations happen only between provisioned deployments of the same deployment type, and a new deployment has a different name.
      fr: |
        Les migrations ne se font qu'entre déploiements provisionnés du même type, et un nouveau déploiement porte un autre nom.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
