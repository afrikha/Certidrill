id: ai103-1a-managed-compute
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The data science team of Litware works in a hub-based project in the Foundry (classic) portal. It needs to deploy an open model from Hugging Face for an internal summarization tool. The subscription has compute quota for the virtual machine family that the model requires.

    Which deployment option should you use?
  fr: |
    L'équipe de science des données de Litware travaille dans un projet basé sur un hub dans le portail Foundry (classique). Elle doit déployer un modèle ouvert de Hugging Face pour un outil interne de synthèse. L'abonnement dispose d'un quota de calcul pour la famille de machines virtuelles requise par le modèle.

    Quelle option de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Global Standard deployment in a Foundry resource", fr: "Un déploiement Global Standard dans une ressource Foundry" } }
    - { id: b, text: { en: "A serverless API endpoint", fr: "Un point de terminaison d'API serverless" } }
    - { id: c, text: { en: "A managed compute deployment", fr: "Un déploiement sur calcul managé" } }
    - { id: d, text: { en: "A Developer deployment", fr: "Un déploiement Developer" } }
answer: { optionId: c }
explanation:
  correct:
    en: Managed compute hosts a model on dedicated compute in a hub-based project and requires compute quota in the subscription. It is the required option for Hugging Face models, as well as for NVIDIA NIMs and custom models, and it is billed in compute core hours on a per-minute basis.
    fr: Le calcul managé héberge un modèle sur un calcul dédié dans un projet basé sur un hub et nécessite un quota de calcul dans l'abonnement. C'est l'option obligatoire pour les modèles Hugging Face, ainsi que pour les NVIDIA NIM et les modèles personnalisés, et il est facturé en heures de cœurs de calcul, à la minute.
  options:
    a:
      en: Standard deployments in Foundry resources serve Foundry Models sold by Azure and from partners and community, not Hugging Face models.
      fr: Les déploiements standard dans les ressources Foundry servent les Foundry Models vendus par Azure et ceux des partenaires et de la communauté, pas les modèles Hugging Face.
    b:
      en: Serverless API endpoints serve Foundry Models with pay-as-you-go billing; Hugging Face models require managed compute.
      fr: Les points de terminaison d'API serverless servent les Foundry Models facturés à l'utilisation ; les modèles Hugging Face nécessitent un calcul managé.
    d:
      en: The Developer type is meant for evaluating fine-tuned models, and it is deleted after 24 hours.
      fr: Le type Developer sert à évaluer des modèles affinés, et il est supprimé au bout de 24 heures.
references:
  - title: Deployment options for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/deployments-overview
