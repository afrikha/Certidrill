id: ai103-1a-rates-compliance
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank publishes its current interest rates on its public website. The rate sheets are generated every morning as PDF files in an Azure Blob Storage container, and the website is built from that container.

    You are building an agent that answers customer questions about the current rates. The compliance team requires that customer questions and the data sent for grounding stay inside the Azure compliance boundary. Answers must reflect the rates published each morning.

    What should you use to ground the agent?
  fr: |
    Woodgrove Bank publie ses taux d'intérêt actuels sur son site web public. Les fiches de taux sont générées chaque matin sous forme de fichiers PDF dans un conteneur Stockage Blob Azure, et le site web est construit à partir de ce conteneur.

    Vous créez un agent qui répond aux questions des clients sur les taux actuels. L'équipe de conformité exige que les questions des clients et les données envoyées pour l'ancrage restent dans la limite de conformité Azure. Les réponses doivent refléter les taux publiés chaque matin.

    Que devez-vous utiliser pour ancrer l'agent ?
body:
  options:
    - { id: a, text: { en: "The web search tool, with the agent instructed to prefer the bank's website", fr: "L'outil de recherche web, avec des instructions demandant à l'agent de privilégier le site de la banque" } }
    - { id: b, text: { en: "Grounding with Bing Custom Search restricted to the bank's domain", fr: "Grounding with Bing Custom Search limité au domaine de la banque" } }
    - { id: c, text: { en: "An Azure AI Search index filled by a scheduled indexer on the container, used through the Azure AI Search tool", fr: "Un index Azure AI Search alimenté par un indexeur planifié sur le conteneur, utilisé avec l'outil Azure AI Search" } }
    - { id: d, text: { en: "The code interpreter tool, with the agent instructed to download the rates page", fr: "L'outil d'interpréteur de code, avec des instructions demandant à l'agent de télécharger la page des taux" } }
answer: { optionId: c }
explanation:
  correct:
    en: An indexer pulls the PDF files from Blob Storage on a schedule, so the index reflects each morning's rate sheets. The Azure AI Search tool retrieves the indexed content and the agent answers with citations, while the data stays in Azure services.
    fr: |
      Un indexeur récupère les fichiers PDF de Stockage Blob selon une planification : l'index reflète les fiches de taux de chaque matin. L'outil Azure AI Search récupère le contenu indexé et l'agent répond avec des citations, tandis que les données restent dans les services Azure.
  options:
    a:
      en: The web search tool uses Grounding with Bing Search; data sent to Bing leaves the Azure compliance and geographic boundaries.
      fr: L'outil de recherche web utilise Grounding with Bing Search ; les données envoyées à Bing sortent des limites de conformité et géographiques d'Azure.
    b:
      en: Restricting the domains doesn't change where the data goes; data sent to Bing Custom Search also leaves the compliance boundary.
      fr: Limiter les domaines ne change pas la destination des données ; les données envoyées à Bing Custom Search sortent elles aussi de la limite de conformité.
    d:
      en: Code interpreter runs Python in a sandbox for calculations and files; it isn't a grounding tool for web content.
      fr: L'interpréteur de code exécute du Python dans un bac à sable pour des calculs et des fichiers ; ce n'est pas un outil d'ancrage sur du contenu web.
references:
  - title: Use web search tool in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/web-search
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
