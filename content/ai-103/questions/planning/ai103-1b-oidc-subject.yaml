id: ai103-1b-oidc-subject
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has a GitHub repository named **fabrikam/claims-agent**. A workflow deploys new versions of a Foundry agent. Its deploy job runs on the **main** branch and references the GitHub environment named **production**, which has required reviewers.

    The job signs in with `azure/login` and OpenID Connect as a user-assigned managed identity. You are adding a federated identity credential to the managed identity.

    You need to ensure that only the deploy job can obtain a token for the managed identity.

    Which subject identifier should you configure?
  fr: |
    Fabrikam dispose d'un dépôt GitHub nommé **fabrikam/claims-agent**. Un flux de travail déploie de nouvelles versions d'un agent Foundry. Son travail de déploiement s'exécute sur la branche **main** et fait référence à l'environnement GitHub nommé **production**, qui exige des réviseurs.

    Le travail se connecte avec `azure/login` et OpenID Connect en tant qu'identité managée affectée par l'utilisateur. Vous ajoutez des informations d'identification fédérées à l'identité managée.

    Vous devez vous assurer que seul le travail de déploiement peut obtenir un jeton pour l'identité managée.

    Quel identificateur de sujet devez-vous configurer ?
body:
  options:
    - { id: a, text: "repo:fabrikam/claims-agent:ref:refs/heads/main" }
    - { id: b, text: "repo:fabrikam/claims-agent:environment:production" }
    - { id: c, text: "repo:fabrikam/claims-agent:*" }
    - { id: d, text: "repo:fabrikam/claims-agent:pull_request" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The subject of the federated credential must exactly match the `sub` claim of the GitHub token. When a job references an environment, its token identifies the environment, so the subject is `repo:<organization>/<repository>:environment:<name>`. Only jobs that enter the protected production environment can then use the managed identity.
    fr: |
      Le sujet des informations d'identification fédérées doit correspondre exactement à la revendication `sub` du jeton GitHub. Lorsqu'un travail fait référence à un environnement, son jeton identifie l'environnement : le sujet est donc `repo:<organisation>/<dépôt>:environment:<nom>`. Seuls les travaux qui entrent dans l'environnement protégé production peuvent alors utiliser l'identité managée.
  options:
    a:
      en: |
        A job that references an environment presents an environment subject, not a branch subject, so the token exchange would fail.
      fr: |
        Un travail qui fait référence à un environnement présente un sujet d'environnement, pas de branche : l'échange de jetons échouerait.
    c:
      en: |
        Wildcard characters aren't supported in any property of a federated identity credential.
      fr: |
        Les caractères génériques ne sont pris en charge dans aucune propriété d'informations d'identification fédérées.
    d:
      en: |
        A pull request subject would let pull request workflows obtain the token, not the deploy job.
      fr: |
        Un sujet de demande de tirage permettrait aux flux de travail des demandes de tirage d'obtenir le jeton, et non au travail de déploiement.
references:
  - title: Create a trust relationship between an app and an external identity provider
    url: https://learn.microsoft.com/en-us/entra/workload-id/workload-identity-federation-create-trust
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
