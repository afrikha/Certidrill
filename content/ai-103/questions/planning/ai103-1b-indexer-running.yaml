id: ai103-1b-indexer-running
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum feeds a Foundry agent from an Azure AI Search index named **contracts-idx**. A monitoring script calls the Get Indexer Status API of the indexer every hour and raises an alert when the top-level `status` value isn't `running`.

    The script has never raised an alert, but users report that recent contracts are missing from the agent's answers. You need to update the script so that it detects the problem and identifies the documents that weren't indexed.

    What should the script check?
  fr: |
    Adatum alimente un agent Foundry à partir d'un index Azure AI Search nommé **contracts-idx**. Un script de surveillance appelle toutes les heures l'API Get Indexer Status de l'indexeur et déclenche une alerte lorsque la valeur `status` de premier niveau n'est pas `running`.

    Le script n'a jamais déclenché d'alerte, mais des utilisateurs signalent que des contrats récents manquent dans les réponses de l'agent. Vous devez mettre à jour le script pour qu'il détecte le problème et identifie les documents non indexés.

    Que doit vérifier le script ?
body:
  options:
    - { id: a, text: { en: "The `itemsFailed` and `errors` values of `lastResult`", fr: "Les valeurs `itemsFailed` et `errors` de `lastResult`" } }
    - { id: b, text: { en: "Whether the top-level `status` changes from `running` to `success`", fr: "Si la valeur `status` de premier niveau passe de `running` à `success`" } }
    - { id: c, text: { en: "The Throttled search queries percentage metric of the service", fr: "La métrique Throttled search queries percentage du service" } }
    - { id: d, text: { en: "The Search Latency metric of the service", fr: "La métrique Search Latency du service" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The top-level `running` status only means that the indexer is set up correctly and available to run. The outcome of each run is in `lastResult` and the execution history: `itemsFailed` counts the documents that weren't indexed, and `errors` gives the key of each failed document with its message.
    fr: |
      Le statut `running` de premier niveau signifie seulement que l'indexeur est correctement configuré et disponible pour s'exécuter. Le résultat de chaque exécution se trouve dans `lastResult` et l'historique d'exécution : `itemsFailed` compte les documents non indexés, et `errors` donne la clé de chaque document en échec avec son message.
  options:
    b:
      en: |
        The top-level status doesn't report run results; `success` is a status of a run in `lastResult`.
      fr: |
        Le statut de premier niveau n'indique pas les résultats d'exécution ; `success` est un statut d'exécution dans `lastResult`.
    c:
      en: |
        Throttling concerns queries, not documents missing from the index.
      fr: |
        La limitation concerne les requêtes, pas les documents absents de l'index.
    d:
      en: |
        Query latency doesn't show which documents failed to be indexed.
      fr: |
        La latence des requêtes ne montre pas quels documents n'ont pas été indexés.
references:
  - title: Monitor Indexer Status and Results
    url: https://learn.microsoft.com/en-us/azure/search/search-monitor-indexers
