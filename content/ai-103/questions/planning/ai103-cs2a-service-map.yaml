id: ai103-cs2a-service-map
objective: "1.1.2"
type: dragdrop
caseStudy: ai103-cs2a-tailwind-traders
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the other workloads requirement. Which service should you use for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence relative aux autres charges de travail. Quel service devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: translator, text: Azure Translator }
    - { id: cu, text: Azure Content Understanding }
    - { id: search, text: Azure AI Search }
    - { id: safety, text: Azure AI Content Safety }
    - { id: speech, text: Azure Speech }
    - { id: agents, text: Foundry Agent Service }
  targets:
    - id: manuals
      text: { en: "Translate the assembly manuals while keeping their layout", fr: "Traduire les notices de montage en conservant leur mise en page" }
    - id: invoices
      text: { en: "Extract fields from the supplier invoices", fr: "Extraire les champs des factures des fournisseurs" }
    - id: retrieval
      text: { en: "Retrieve catalog content by keywords and vectors", fr: "Récupérer le contenu du catalogue par mots clés et par vecteurs" }
    - id: reviews
      text: { en: "Screen customer reviews for hate and violence", fr: "Filtrer les avis clients contenant de la haine ou de la violence" }
answer:
  mapping: { manuals: translator, invoices: cu, retrieval: search, reviews: safety }
explanation:
  correct:
    en: |
      The document translation feature of Azure Translator translates Word files and preserves their structure and format. Content Understanding analyzes documents and extracts fields, including from PDF invoices. Azure AI Search runs hybrid queries that combine keyword and vector retrieval. Azure AI Content Safety detects harmful content such as hate and violence.
    fr: |
      La fonctionnalité de traduction de documents d'Azure Translator traduit les fichiers Word en conservant leur structure et leur format. Content Understanding analyse les documents et en extrait des champs, y compris dans des factures PDF. Azure AI Search exécute des requêtes hybrides qui combinent la récupération par mots clés et par vecteurs. Azure AI Content Safety détecte le contenu nuisible, comme la haine et la violence.
  options:
    speech:
      en: |
        Azure Speech converts speech to text and text to speech; none of the workloads involves audio.
      fr: |
        Azure Speech convertit la parole en texte et le texte en parole ; aucune des charges de travail ne concerne de l'audio.
    agents:
      en: |
        Foundry Agent Service hosts agents; it can call these services as tools but doesn't itself translate, extract, index or moderate content.
      fr: |
        Foundry Agent Service héberge des agents ; il peut appeler ces services comme outils, mais ne traduit, n'extrait, n'indexe et ne modère pas lui-même le contenu.
references:
  - title: What are Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/what-are-ai-services
  - title: What is Azure Translator document translation?
    url: https://learn.microsoft.com/en-us/azure/ai-services/translator/document-translation/overview
