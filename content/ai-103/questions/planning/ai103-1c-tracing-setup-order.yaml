id: ai103-1c-tracing-setup-order
objective: "1.4.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. writes a Python script that calls an agent in a Microsoft Foundry project. Application Insights is already connected to the project, the packages are installed, and `project` is an authenticated `AIProjectClient`. The client spans of the script must be exported to Application Insights and correlated with the server spans of the agent. Message contents must not be recorded.

    Which four actions should the script perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fabrikam, Inc. écrit un script Python qui appelle un agent dans un projet Microsoft Foundry. Application Insights est déjà connecté au projet, les packages sont installés, et `project` est un `AIProjectClient` authentifié. Les spans client du script doivent être exportés vers Application Insights et corrélés avec les spans serveur de l'agent. Le contenu des messages ne doit pas être enregistré.

    Quelles sont les quatre actions que le script doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: env, text: { en: "Set AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING to true.", fr: "Définir AZURE_EXPERIMENTAL_ENABLE_GENAI_TRACING sur true." } }
    - { id: mon, text: { en: "Call configure_azure_monitor() with the connection string from project.telemetry.get_application_insights_connection_string().", fr: "Appeler configure_azure_monitor() avec la chaîne de connexion de project.telemetry.get_application_insights_connection_string()." } }
    - { id: cli, text: { en: "Create the OpenAI client by calling project.get_openai_client().", fr: "Créer le client OpenAI en appelant project.get_openai_client()." } }
    - { id: req, text: { en: "Send the request to the agent by calling responses.create().", fr: "Envoyer la requête à l'agent en appelant responses.create()." } }
    - { id: cap, text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true." } }
    - { id: ins, text: { en: "Call AIProjectInstrumentor().instrument() after the response is returned.", fr: "Appeler AIProjectInstrumentor().instrument() une fois la réponse renvoyée." } }
    - { id: role, text: { en: "Assign Log Analytics Reader on Application Insights to the identity of the script.", fr: "Attribuer Log Analytics Reader sur Application Insights à l'identité du script." } }
answer:
  sequence: [env, mon, cli, req]
explanation:
  correct:
    en: |
      The tracing flag must be set before instrumentation, otherwise no spans are produced. `configure_azure_monitor()` then sets up the export to Application Insights. The OpenAI client must come from `get_openai_client()` after instrumentation so that client and server spans correlate, and only then is the request sent.
    fr: |
      L'indicateur de suivi doit être défini avant l'instrumentation, sinon aucun span n'est produit. `configure_azure_monitor()` configure ensuite l'exportation vers Application Insights. Le client OpenAI doit provenir de `get_openai_client()` après l'instrumentation pour que les spans client et serveur soient corrélés, et la requête n'est envoyée qu'ensuite.
  options:
    cap:
      en: |
        Setting the content capture variable to true records message contents, which the requirement forbids.
      fr: |
        Définir la variable de capture du contenu sur true enregistre le contenu des messages, ce que l'exigence interdit.
    ins:
      en: |
        Instrumenting after the call records nothing for that call, and configure_azure_monitor already sets up the export.
      fr: |
        Instrumenter après l'appel n'enregistre rien pour cet appel, et configure_azure_monitor configure déjà l'exportation.
    role:
      en: |
        Log Analytics Reader lets someone view traces; the script doesn't need it to send them.
      fr: |
        Log Analytics Reader permet de consulter les traces ; le script n'en a pas besoin pour les envoyer.
references:
  - title: Add client-side tracing to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
