id: ai103-1b-abusive-users
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys has a public chat application that calls a model deployment with a content filter configuration. Risks & Safety monitoring is available for the deployment, and an Azure Data Explorer database is already connected as its data store.

    The trust and safety team must identify the individual end users who repeatedly send content that the filters flag. No personal information about the users may be sent to the service.

    What should the application do?
  fr: |
    Tailspin Toys dispose d'une application de conversation publique qui appelle un déploiement de modèle doté d'une configuration de filtre de contenu. La surveillance Risks & Safety est disponible pour le déploiement, et une base de données Azure Data Explorer est déjà connectée comme magasin de données.

    L'équipe de confiance et de sécurité doit identifier les utilisateurs finaux qui envoient de façon répétée du contenu signalé par les filtres. Aucune information personnelle sur les utilisateurs ne doit être envoyée au service.

    Que doit faire l'application ?
body:
  options:
    - { id: a, text: { en: "Send the email address of the end user in the `user` parameter of each request.", fr: "Envoyer l'adresse e-mail de l'utilisateur final dans le paramètre `user` de chaque requête." } }
    - { id: b, text: { en: "Send a GUID that identifies the end user in the `user` parameter of each request.", fr: "Envoyer un GUID qui identifie l'utilisateur final dans le paramètre `user` de chaque requête." } }
    - { id: c, text: { en: "Send the RequestResponse resource logs of the Foundry resource to Log Analytics.", fr: "Envoyer les journaux de ressource RequestResponse de la ressource Foundry vers Log Analytics." } }
    - { id: d, text: { en: "Split the Blocked Volume metric by the ModelDeploymentName dimension.", fr: "Fractionner la métrique Blocked Volume par la dimension ModelDeploymentName." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Potentially abusive user detection in Risks & Safety monitoring needs a user ID sent with each request in the `user` parameter. Microsoft recommends GUID strings that contain no sensitive personal information; the report then lists each user GUID with an abuse score and the abusive requests by category.
    fr: |
      La détection des utilisateurs potentiellement abusifs de la surveillance Risks & Safety exige un ID d'utilisateur envoyé avec chaque requête dans le paramètre `user`. Microsoft recommande des chaînes GUID qui ne contiennent aucune information personnelle sensible ; le rapport liste alors chaque GUID d'utilisateur avec un score d'abus et les requêtes abusives par catégorie.
  options:
    a:
      en: |
        An email address is personal information, which the requirement forbids and Microsoft advises against.
      fr: |
        Une adresse e-mail est une information personnelle, ce que l'exigence interdit et que Microsoft déconseille.
    c:
      en: |
        Resource logs don't attribute filtered content to end users unless the application identifies them.
      fr: |
        Les journaux de ressource n'attribuent pas le contenu filtré aux utilisateurs finaux si l'application ne les identifie pas.
    d:
      en: |
        This split shows blocked calls per deployment, not per end user.
      fr: |
        Ce fractionnement montre les appels bloqués par déploiement, pas par utilisateur final.
references:
  - title: How to use Risks & Safety monitoring in Microsoft Foundry (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/risks-safety-monitor
