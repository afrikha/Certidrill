id: ai103-sr1-keyless-app-3
objective: "1.3.4"
type: series_yesno
series: ai103-sr1-keyless-app
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You use a managed identity with the Contributor role.
  fr: Vous utilisez une identité managée avec le rôle Contributor.
body:
  solution:
    en: |
      You enable a **system-assigned managed identity** for App1 and assign it the **Contributor** role on the resource group that contains tailspin-ai. In App1, you create the project client with `DefaultAzureCredential()`.
    fr: |
      Vous activez une **identité managée affectée par le système** pour App1 et vous lui attribuez le rôle **Contributor** sur le groupe de ressources qui contient tailspin-ai. Dans App1, vous créez le client du projet avec `DefaultAzureCredential()`.
answer: { value: false }
explanation:
  correct:
    en: Contributor is a control-plane role. It does not include the Foundry data actions, so App1 cannot call chat-model or run agents with its Microsoft Entra token. Contributor also lets the identity create projects and manage model deployments, which the requirements prohibit.
    fr: "Contributor est un rôle du plan de contrôle. Il n'inclut pas les actions de données Foundry : App1 ne peut donc ni appeler chat-model ni exécuter des agents avec son jeton Microsoft Entra. Contributor permet en outre à l'identité de créer des projets et de gérer les déploiements de modèles, ce que les exigences interdisent."
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-azure-ai-foundry
