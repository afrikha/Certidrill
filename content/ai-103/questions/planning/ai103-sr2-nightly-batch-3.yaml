id: ai103-sr2-nightly-batch-3
objective: "1.3.1"
type: series_yesno
series: ai103-sr2-nightly-batch
seriesOrder: 3
difficulty: 1
status: draft
stem:
  en: You create a provisioned deployment covered by a reservation for the nightly job.
  fr: Vous créez un déploiement provisionné couvert par une réservation pour le travail nocturne.
body:
  solution:
    en: |
      You create a **Global Provisioned** deployment of the same model, sized with the capacity calculator for the nightly volume, and you buy a one-month Azure reservation for its PTUs. The nightly job sends its requests to this deployment only.
    fr: |
      Vous créez un déploiement **Global Provisioned** du même modèle, dimensionné avec le calculateur de capacité pour le volume nocturne, et vous achetez une réservation Azure d'un mois pour ses PTU. Le travail nocturne envoie ses requêtes uniquement à ce déploiement.
answer: { value: false }
explanation:
  correct:
    en: A separate provisioned deployment does protect the rate limit of chat-live, but provisioned deployments are billed per PTU and per hour, whatever the number of tokens consumed. The PTUs would be paid around the clock for a job that runs only at night and has no latency requirement, so this doesn't minimize cost. A batch deployment, billed per token at a discounted rate, is designed for this workload.
    fr: "Un déploiement provisionné distinct protège bien la limite de débit de chat-live, mais les déploiements provisionnés sont facturés par PTU et par heure, quel que soit le nombre de jetons consommés. Les PTU seraient payées jour et nuit pour un travail qui ne s'exécute que la nuit et n'a aucune exigence de latence : le coût n'est pas réduit au minimum. Un déploiement de traitement par lots, facturé au jeton à un tarif réduit, est conçu pour cette charge de travail."
references:
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
