id: ai103-1a-openapi-tool
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders exposes an internal order-tracking REST API that is described by an OpenAPI 3.0 specification. You are building a prompt agent that must call this API to return the status of an order. The call must be made by Foundry Agent Service, not by the client application.

    Which tool should you add to the agent?
  fr: |
    Northwind Traders expose une API REST interne de suivi des commandes décrite par une spécification OpenAPI 3.0. Vous créez un agent d'invite qui doit appeler cette API pour renvoyer l'état d'une commande. L'appel doit être effectué par Foundry Agent Service, pas par l'application cliente.

    Quel outil devez-vous ajouter à l'agent ?
body:
  options:
    - { id: a, text: { en: "Function calling", fr: "L'appel de fonction" } }
    - { id: b, text: { en: "Code interpreter", fr: "L'interpréteur de code" } }
    - { id: c, text: { en: "OpenAPI", fr: "OpenAPI" } }
    - { id: d, text: { en: "File search with the specification uploaded", fr: "La recherche de fichiers avec la spécification chargée" } }
answer: { optionId: c }
explanation:
  correct:
    en: The OpenAPI tool calls a REST API described by an OpenAPI specification; the agent service makes the HTTP call with the operations and parameters that the specification defines.
    fr: L'outil OpenAPI appelle une API REST décrite par une spécification OpenAPI ; le service d'agent effectue l'appel HTTP avec les opérations et les paramètres définis par la spécification.
  options:
    a:
      en: With function calling, the model only returns the function name and arguments; your client application runs the call and sends back the result.
      fr: Avec l'appel de fonction, le modèle renvoie seulement le nom de la fonction et ses arguments ; c'est votre application cliente qui exécute l'appel et renvoie le résultat.
    b:
      en: Code interpreter runs Python in a sandbox for calculations and files; it isn't the tool for calling an internal API.
      fr: L'interpréteur de code exécute du Python dans un bac à sable pour des calculs et des fichiers ; ce n'est pas l'outil pour appeler une API interne.
    d:
      en: File search would let the agent read the specification, not call the API.
      fr: La recherche de fichiers permettrait à l'agent de lire la spécification, pas d'appeler l'API.
references:
  - title: What is Toolbox in Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/tool-catalog
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
