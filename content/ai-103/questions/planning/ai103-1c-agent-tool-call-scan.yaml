id: ai103-1c-agent-tool-call-scan
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. builds an agent named **mail-agent** in Foundry Agent Service. When a customer complains, mail-agent drafts a reply and calls a tool named send_email that sends the text directly to the customer. The final completion shown in the chat only says that the email was sent.

    You create a custom guardrail named **gr-mail** for mail-agent. A Hate control must block hateful content in the emails before send_email runs.

    Which intervention point should the Hate control scan?
  fr: |
    Proseware, Inc. crée un agent nommé **mail-agent** dans Foundry Agent Service. Quand un client se plaint, mail-agent rédige une réponse et appelle un outil nommé send_email qui envoie directement le texte au client. La complétion finale affichée dans la conversation indique seulement que l'e-mail a été envoyé.

    Vous créez un garde-fou personnalisé nommé **gr-mail** pour mail-agent. Un contrôle Hate doit bloquer le contenu haineux des e-mails avant l'exécution de send_email.

    Quel point d'intervention le contrôle Hate doit-il analyser ?
body:
  options:
    - { id: a, text: User input }
    - { id: b, text: Tool call }
    - { id: c, text: Tool response }
    - { id: d, text: Output }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Tool call intervention point (preview, agents only) scans the action and the data that the agent proposes to send to a tool, before the tool runs. The email text is an argument of the send_email call, so a Hate control on Tool call blocks it.
    fr: |
      Le point d'intervention Tool call (préversion, agents uniquement) analyse l'action et les données que l'agent propose d'envoyer à un outil, avant l'exécution de l'outil. Le texte de l'e-mail est un argument de l'appel send_email : un contrôle Hate sur Tool call le bloque.
  options:
    a:
      en: User input scans the customer's message, not the reply that the agent writes.
      fr: User input analyse le message du client, pas la réponse que rédige l'agent.
    c:
      en: Tool response scans what the tool returns to the agent, after the email has already been sent.
      fr: Tool response analyse ce que l'outil renvoie à l'agent, une fois l'e-mail déjà envoyé.
    d:
      en: Output scans only the final completion returned in the chat, which doesn't contain the email text.
      fr: Output n'analyse que la complétion finale renvoyée dans la conversation, qui ne contient pas le texte de l'e-mail.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
