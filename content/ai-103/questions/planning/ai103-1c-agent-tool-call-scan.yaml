id: ai103-1c-agent-tool-call-scan
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware, Inc. has a Python application that answers customer complaints. The application sends each complaint to a model deployment named **mail-gen**, which drafts a reply, and then emails the draft to the customer without review. Complaints often quote abusive messages that customers received from third parties, and the application must still process them.

    You create a custom guardrail named **gr-mail** for mail-gen. A Hate control must block hateful content in the drafted replies, without blocking complaints because of the messages they quote.

    Which intervention point should the Hate control scan?
  fr: |
    Proseware, Inc. dispose d'une application Python qui répond aux réclamations des clients. L'application envoie chaque réclamation à un déploiement de modèle nommé **mail-gen**, qui rédige une réponse, puis envoie ce brouillon par e-mail au client sans relecture. Les réclamations citent souvent des messages injurieux que les clients ont reçus de tiers, et l'application doit quand même les traiter.

    Vous créez un garde-fou personnalisé nommé **gr-mail** pour mail-gen. Un contrôle Hate doit bloquer le contenu haineux des réponses rédigées, sans bloquer les réclamations à cause des messages qu'elles citent.

    Quel point d'intervention le contrôle Hate doit-il analyser ?
body:
  options:
    - { id: a, text: User input }
    - { id: b, text: Output }
    - { id: c, text: { en: "User input and Output", fr: "User input et Output" } }
    - { id: d, text: Tool call }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The Output intervention point scans the completion that the model returns, which is the drafted reply. A Hate control with the Annotate and block action on Output blocks hateful drafts, while the prompts that quote abusive messages aren't scanned by this control.
    fr: |
      Le point d'intervention Output analyse la complétion renvoyée par le modèle, c'est-à-dire la réponse rédigée. Un contrôle Hate avec l'action Annotate and block sur Output bloque les brouillons haineux, tandis que les invites qui citent des messages injurieux ne sont pas analysées par ce contrôle.
  options:
    a:
      en: User input scans the complaint sent to the model, so it would block complaints that quote abusive messages and wouldn't scan the reply.
      fr: |
        User input analyse la réclamation envoyée au modèle : il bloquerait les réclamations qui citent des messages injurieux et n'analyserait pas la réponse.
    c:
      en: Adding User input would also block the complaints that quote abusive messages, which the requirement forbids.
      fr: Ajouter User input bloquerait aussi les réclamations qui citent des messages injurieux, ce que l'exigence interdit.
    d:
      en: Tool call (preview) applies to agents only, not to model deployments, and the application sends the email itself.
      fr: Tool call (préversion) ne s'applique qu'aux agents, pas aux déploiements de modèles, et c'est l'application qui envoie l'e-mail.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
