id: ai103-1b-pipeline-role
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores the definition of an agent in a GitHub repository. A GitHub Actions workflow signs in to Azure as a user-assigned managed identity named **id-agent-ci** by using OpenID Connect.

    On each pull request, the workflow must create a new version of the agent in a Foundry project named **sales** and run an evaluation of it. The Foundry resource, the project and the model deployments are created by a separate team; the workflow doesn't provision any resource.

    You need to grant id-agent-ci the required permissions. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Contoso stocke la définition d'un agent dans un dépôt GitHub. Un flux de travail GitHub Actions se connecte à Azure en tant qu'identité managée affectée par l'utilisateur nommée **id-agent-ci**, à l'aide d'OpenID Connect.

    À chaque demande de tirage, le flux de travail doit créer une nouvelle version de l'agent dans un projet Foundry nommé **sales** et en exécuter une évaluation. La ressource Foundry, le projet et les déploiements de modèles sont créés par une autre équipe ; le flux de travail ne provisionne aucune ressource.

    Vous devez accorder à id-agent-ci les autorisations nécessaires. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: { en: "Contributor on the subscription", fr: "Contributor sur l'abonnement" } }
    - { id: b, text: { en: "Foundry Account Owner on the Foundry resource", fr: "Foundry Account Owner sur la ressource Foundry" } }
    - { id: c, text: { en: "Foundry User on the sales project", fr: "Foundry User sur le projet sales" } }
    - { id: d, text: { en: "Foundry Owner on the Foundry resource", fr: "Foundry Owner sur la ressource Foundry" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Creating agent versions and running evaluations are data actions in a project. Foundry User grants these data actions and is the least-privileged role for this work; Microsoft recommends it at the project scope for a pipeline identity, and Contributor on a dedicated resource group only when the pipeline also provisions resources.
    fr: |
      Créer des versions d'agent et exécuter des évaluations sont des actions de données dans un projet. Foundry User accorde ces actions de données et constitue le rôle le moins privilégié pour ce travail ; Microsoft le recommande à l'étendue du projet pour une identité de pipeline, et Contributor sur un groupe de ressources dédié uniquement si le pipeline provisionne aussi des ressources.
  options:
    a:
      en: |
        Contributor has no data actions, so it can't build agents, and the subscription scope is far too broad.
      fr: |
        Contributor n'a aucune action de données : il ne peut pas créer d'agents, et l'étendue de l'abonnement est beaucoup trop large.
    b:
      en: |
        Foundry Account Owner creates projects and manages models but can't build in a project.
      fr: |
        Foundry Account Owner crée des projets et gère les modèles, mais ne peut pas créer de contenu dans un projet.
    d:
      en: |
        Foundry Owner would work but also grants resource management and role assignments, which exceeds least privilege.
      fr: |
        Foundry Owner fonctionnerait, mais accorde aussi la gestion des ressources et des attributions de rôles, ce qui dépasse le moindre privilège.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
