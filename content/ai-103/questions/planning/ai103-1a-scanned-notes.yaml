id: ai103-1a-scanned-notes
objective: "1.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has 200,000 scanned delivery notes stored as PDF files. You need to extract the text and the layout of each note, including tables, so that the content can be indexed for a RAG solution.

    Which two Foundry Tools can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose de 200 000 bons de livraison numérisés stockés sous forme de fichiers PDF. Vous devez extraire le texte et la disposition de chaque bon, y compris les tableaux, afin que le contenu puisse être indexé pour une solution RAG.

    Quels sont les deux outils de Foundry Tools que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Azure Translator }
    - { id: b, text: Azure Content Understanding }
    - { id: c, text: Azure Speech }
    - { id: d, text: Azure Document Intelligence }
    - { id: e, text: Azure Content Safety }
    - { id: f, text: Immersive Reader }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Content Understanding processes documents into Markdown for search and retrieval or into structured fields. Document Intelligence turns documents into structured data, and its layout analysis extracts text, tables and structure from scanned files.
    fr: Content Understanding transforme des documents en Markdown pour la recherche et la récupération, ou en champs structurés. Document Intelligence transforme des documents en données structurées, et son analyse de disposition extrait le texte, les tableaux et la structure des fichiers numérisés.
  options:
    a:
      en: Translator translates text and documents; it doesn't extract layout for indexing.
      fr: Translator traduit du texte et des documents ; il n'extrait pas la disposition pour l'indexation.
    c:
      en: Speech processes audio, not scanned documents.
      fr: Speech traite de l'audio, pas des documents numérisés.
    e:
      en: Content Safety detects harmful content; it doesn't extract text or tables.
      fr: Content Safety détecte le contenu nuisible ; il n'extrait ni texte ni tableaux.
    f:
      en: Immersive Reader helps users read and understand text; it isn't an extraction service.
      fr: Immersive Reader aide les utilisateurs à lire et à comprendre un texte ; ce n'est pas un service d'extraction.
references:
  - title: What are Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/what-are-ai-services
  - title: What is Azure Content Understanding in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
