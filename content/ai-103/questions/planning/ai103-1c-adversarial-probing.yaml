id: ai103-1c-adversarial-probing
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys develops a travel assistant on a Microsoft Foundry model deployment. Before the release, the security team wants an automated scan that sends adversarial prompts, including prompts hidden with encodings such as Base64 and ROT13, and reports the percentage of attacks that produce harmful responses.

    What should you use?
  fr: |
    Tailspin Toys développe un assistant de voyage sur un déploiement de modèle Microsoft Foundry. Avant la mise en production, l'équipe de sécurité veut une analyse automatisée qui envoie des invites adverses, y compris des invites masquées par des encodages comme Base64 et ROT13, et qui indique le pourcentage d'attaques qui produisent des réponses nuisibles.

    Que devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "A User prompt attacks control in the guardrail of the deployment", fr: "Un contrôle User prompt attacks dans le garde-fou du déploiement" }
    - id: b
      text: { en: "The Indirect Attack evaluator on a dataset of test conversations", fr: "L'évaluateur Indirect Attack sur un jeu de données de conversations de test" }
    - id: c
      text: { en: "An AI Red Teaming Agent scan of the deployment", fr: "Une analyse du déploiement par l'AI Red Teaming Agent" }
    - id: d
      text: { en: "Continuous evaluation on a sample of production traffic", fr: "L'évaluation continue sur un échantillon du trafic de production" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The AI Red Teaming Agent uses Microsoft's open-source PyRIT framework to generate adversarial prompts with attack strategies such as Base64 and ROT13, scores the responses with the risk and safety evaluators, and reports the Attack Success Rate (ASR), the percentage of successful attacks.
    fr: |
      L'AI Red Teaming Agent utilise le framework open source PyRIT de Microsoft pour générer des invites adverses avec des stratégies d'attaque comme Base64 et ROT13, note les réponses avec les évaluateurs de risque et de sécurité, et indique le taux de réussite des attaques (ASR), le pourcentage d'attaques réussies.
  options:
    a:
      en: |
        A guardrail control blocks attacks at run time; it doesn't generate attacks or measure how many succeed.
      fr: |
        Un contrôle de garde-fou bloque les attaques à l'exécution ; il ne génère pas d'attaques et ne mesure pas combien réussissent.
    b:
      en: |
        An evaluator only scores the conversations that you already have; it doesn't create adversarial prompts.
      fr: |
        Un évaluateur note seulement les conversations dont vous disposez ; il ne crée pas d'invites adverses.
    d:
      en: |
        Continuous evaluation scores real traffic after release, not a scan of attacks before release.
      fr: |
        L'évaluation continue note le trafic réel après la mise en production, et non une série d'attaques avant la mise en production.
references:
  - title: AI Red Teaming Agent
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/ai-red-teaming-agent
