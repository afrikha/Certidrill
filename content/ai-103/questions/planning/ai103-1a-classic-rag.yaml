id: ai103-1a-classic-rag
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fourth Coffee has a Python web app that already orchestrates calls to Azure AI Search and to a chat model. The app must keep this orchestration code, use generally available features only, and favor simplicity and speed over the highest possible relevance.

    You need to choose the retrieval pattern.

    What should you use?
  fr: |
    Fourth Coffee dispose d'une application web Python qui orchestre déjà les appels à Azure AI Search et à un modèle de conversation. L'application doit conserver ce code d'orchestration, n'utiliser que des fonctionnalités en disponibilité générale et privilégier la simplicité et la rapidité plutôt que la pertinence maximale.

    Vous devez choisir le modèle de récupération.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Agentic retrieval with a knowledge base", fr: "La récupération agentique avec une base de connaissances" } }
    - { id: b, text: { en: "Classic RAG with hybrid queries and the semantic ranker", fr: "Le RAG classique avec des requêtes hybrides et le classeur sémantique" } }
    - { id: c, text: { en: "Fine-tuning of the chat model on the documents", fr: "Le réglage fin du modèle de conversation sur les documents" } }
    - { id: d, text: { en: "A memory store that holds the documents", fr: "Un magasin de mémoire qui contient les documents" } }
answer: { optionId: b }
explanation:
  correct:
    en: Learn recommends classic RAG when you need generally available features only, when simplicity and speed come before advanced relevance, and when you want to keep existing orchestration code. Hybrid queries with semantic ranking are its recommended building blocks.
    fr: Learn recommande le RAG classique quand vous n'avez besoin que de fonctionnalités en disponibilité générale, quand la simplicité et la rapidité passent avant une pertinence avancée et quand vous voulez conserver un code d'orchestration existant. Les requêtes hybrides avec classement sémantique en sont les briques recommandées.
  options:
    a:
      en: Agentic retrieval targets agent clients and the highest relevance; its query planning is a preview capability and it replaces the app's own orchestration with new objects.
      fr: La récupération agentique cible les clients de type agent et la pertinence maximale ; sa planification des requêtes est une fonctionnalité en préversion, et elle remplace l'orchestration de l'application par de nouveaux objets.
    c:
      en: Fine-tuning changes the model's behavior; it doesn't retrieve current documents for grounding.
      fr: Le réglage fin modifie le comportement du modèle ; il ne récupère pas les documents actuels pour l'ancrage.
    d:
      en: Memory is for what an agent learns about users, not for retrieving a document corpus.
      fr: La mémoire sert à ce qu'un agent apprend sur les utilisateurs, pas à récupérer un corpus de documents.
references:
  - title: Retrieval-augmented generation (RAG) in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview
