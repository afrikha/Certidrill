id: ai103-1b-eval-data-json
objective: "1.2.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys evaluates a support agent in a GitHub Actions workflow with the `microsoft/ai-agent-evals` action. You are writing the data file referenced by the `data-path` input.

    The evaluation must check whether the agent's responses are grammatically correct and easy to read, and whether they contain violent content, for each test question.

    How should you complete the data file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys évalue un agent de support dans un flux de travail GitHub Actions avec l'action `microsoft/ai-agent-evals`. Vous écrivez le fichier de données référencé par l'entrée `data-path`.

    L'évaluation doit vérifier, pour chaque question de test, si les réponses de l'agent sont grammaticalement correctes et faciles à lire, et si elles contiennent du contenu violent.

    Comment devez-vous compléter le fichier de données ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "name": "support-regression",
      [[key]]: [
        [[ev]],
        "builtin.violence"
      ],
      "data": [
        { [[input]]: "How do I return a damaged toy?" },
        { "query": "Can I change my delivery address?" }
      ]
    }
  slots:
    - id: key
      options:
        - { id: evaluators, text: "\"evaluators\"" }
        - { id: graders, text: "\"openai_graders\"" }
        - { id: params, text: "\"evaluator_parameters\"" }
        - { id: mapping, text: "\"data_mapping\"" }
    - id: ev
      options:
        - { id: fluency, text: "\"builtin.fluency\"" }
        - { id: adherence, text: "\"builtin.task_adherence\"" }
        - { id: violence2, text: "\"builtin.violence\"" }
    - id: input
      options:
        - { id: query, text: "\"query\"" }
        - { id: truth, text: "\"ground_truth\"" }
        - { id: context, text: "\"context\"" }
answer:
  values: { key: evaluators, ev: fluency, input: query }
explanation:
  correct:
    en: |
      The data file lists evaluator names in `evaluators` and the test inputs in `data`, where each object has a `query` and optional fields such as `ground_truth` or `context`. Fluency measures grammatical accuracy and readability; the violence evaluator is already listed.
    fr: |
      Le fichier de données liste les noms d'évaluateurs dans `evaluators` et les entrées de test dans `data`, où chaque objet contient une `query` et des champs facultatifs comme `ground_truth` ou `context`. Fluency mesure la correction grammaticale et la lisibilité ; l'évaluateur de violence figure déjà dans la liste.
  options:
    graders: { en: "openai_graders configures OpenAI-based graders, not the list of built-in evaluators.", fr: "openai_graders configure des évaluateurs OpenAI, pas la liste des évaluateurs intégrés." }
    params: { en: "evaluator_parameters holds evaluator-specific initialization parameters.", fr: "evaluator_parameters contient des paramètres d'initialisation propres aux évaluateurs." }
    mapping: { en: "data_mapping maps custom data fields; it doesn't list evaluators.", fr: "data_mapping mappe des champs de données personnalisés ; il ne liste pas d'évaluateurs." }
    adherence: { en: "Task adherence (preview) checks whether the agent follows its instructions, not the quality of the language.", fr: "Task adherence (préversion) vérifie si l'agent respecte ses instructions, pas la qualité de la langue." }
    violence2: { en: "The violence evaluator is already in the list, and it doesn't check grammar or readability.", fr: "L'évaluateur de violence est déjà dans la liste, et il ne vérifie ni la grammaire ni la lisibilité." }
    truth: { en: "ground_truth is an optional expected answer; each input object needs a query.", fr: "ground_truth est une réponse attendue facultative ; chaque objet d'entrée a besoin d'une query." }
    context: { en: "context is optional supporting text, not the question sent to the agent.", fr: "context est un texte d'appui facultatif, pas la question envoyée à l'agent." }
references:
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
