id: ai103-1b-deploy-name-param
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has a Microsoft Foundry resource named **fabrikam-ai**. The resource contains one model deployment: the model **gpt-4.1-mini** is deployed with the Global Standard deployment type, and the deployment is named **chat-prod**. The resource contains no other deployment.

    You are writing a Python application that calls the model by using the OpenAI-compatible client returned by `project.get_openai_client()`.

    Which value should you pass as the `model` parameter of `responses.create()`?
  fr: |
    Fabrikam dispose d'une ressource Microsoft Foundry nommée **fabrikam-ai**. La ressource contient un seul déploiement de modèle : le modèle **gpt-4.1-mini** est déployé avec le type de déploiement Global Standard, et le déploiement est nommé **chat-prod**. La ressource ne contient aucun autre déploiement.

    Vous écrivez une application Python qui appelle le modèle à l'aide du client compatible OpenAI renvoyé par `project.get_openai_client()`.

    Quelle valeur devez-vous passer dans le paramètre `model` de `responses.create()` ?
body:
  options:
    - { id: a, text: "\"gpt-4.1-mini\"" }
    - { id: b, text: "\"chat-prod\"" }
    - { id: c, text: "\"GlobalStandard\"" }
    - { id: d, text: "\"https://fabrikam-ai.services.ai.azure.com/api/projects/support\"" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Requests are routed to a deployment, so the `model` parameter takes the deployment name that you chose when you deployed the model, here `chat-prod`. A stable deployment name also lets you change the model or its version behind the deployment without changing the code.
    fr: |
      Les requêtes sont acheminées vers un déploiement : le paramètre `model` reçoit donc le nom de déploiement choisi lors du déploiement du modèle, ici `chat-prod`. Un nom de déploiement stable permet aussi de changer le modèle ou sa version derrière le déploiement sans modifier le code.
  options:
    a:
      en: |
        gpt-4.1-mini is the model name. No deployment of fabrikam-ai is named gpt-4.1-mini, so the request would fail.
      fr: |
        gpt-4.1-mini est le nom du modèle. Aucun déploiement de fabrikam-ai ne s'appelle gpt-4.1-mini : la requête échouerait.
    c:
      en: |
        GlobalStandard is the SKU name of the deployment type, set on the deployment, not a value that identifies a deployment in a request.
      fr: |
        GlobalStandard est le nom de SKU du type de déploiement, défini sur le déploiement ; il n'identifie pas un déploiement dans une requête.
    d:
      en: |
        The project endpoint is passed to `AIProjectClient`, not as the `model` of a request.
      fr: |
        Le point de terminaison du projet est passé à `AIProjectClient`, pas comme `model` d'une requête.
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
