id: ai103-1a-slm-ticket-routing
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso receives about two million support emails per day. Each email must be assigned to one of eight fixed categories before it is routed to a team. Tests show that the task is simple and that accuracy is the same across the models you tried.

    You need to choose a model for the classification. The solution must minimize cost and latency.

    Which model should you deploy?
  fr: |
    Contoso reçoit environ deux millions d'e-mails de support par jour. Chaque e-mail doit être affecté à l'une de huit catégories fixes avant d'être acheminé vers une équipe. Les tests montrent que la tâche est simple et que la précision est la même avec tous les modèles essayés.

    Vous devez choisir un modèle pour la classification. La solution doit réduire au minimum le coût et la latence.

    Quel modèle devez-vous déployer ?
body:
  options:
    - { id: a, text: "`o3`" }
    - { id: b, text: "`gpt-4.1`" }
    - { id: c, text: "`gpt-4.1-nano`" }
    - { id: d, text: "`gpt-realtime`" }
answer: { optionId: c }
explanation:
  correct:
    en: "`gpt-4.1-nano` is a small variant of the GPT-4.1 series. For a simple, high-volume task such as classifying text into fixed categories, a small model gives the lowest cost and latency when the accuracy is sufficient."
    fr: "`gpt-4.1-nano` est une petite variante de la série GPT-4.1. Pour une tâche simple et à fort volume comme le classement de textes dans des catégories fixes, un petit modèle offre le coût et la latence les plus faibles quand la précision est suffisante."
  options:
    a:
      en: "`o3` is a reasoning model: it spends more time and tokens thinking before it answers, which adds cost and latency that a simple classification doesn't need."
      fr: "`o3` est un modèle de raisonnement : il passe plus de temps et de jetons à réfléchir avant de répondre, ce qui ajoute un coût et une latence inutiles pour une classification simple."
    b:
      en: "`gpt-4.1` is the full-size model of the series; it costs more per token than its nano variant for the same accuracy on this task."
      fr: "`gpt-4.1` est le modèle complet de la série ; il coûte plus cher par jeton que sa variante nano pour la même précision sur cette tâche."
    d:
      en: "`gpt-realtime` is designed for low-latency speech conversations, not for classifying text emails in bulk."
      fr: "`gpt-realtime` est conçu pour les conversations vocales à faible latence, pas pour classer en masse des e-mails texte."
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
