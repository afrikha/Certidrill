id: ai103-1a-standard-setup
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank is preparing a Foundry project for its first agents. The compliance team requires that all agent data, including uploaded files, conversations and vector stores, be stored in single-tenant Azure resources that the bank controls, with isolation between projects.

    Which configuration should you use?
  fr: |
    Woodgrove Bank prépare un projet Foundry pour ses premiers agents. L'équipe de conformité exige que toutes les données des agents, y compris les fichiers chargés, les conversations et les magasins de vecteurs, soient stockées dans des ressources Azure monolocataires contrôlées par la banque, avec une isolation entre les projets.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A basic agent setup with the bank's own Azure Key Vault connected", fr: "Une configuration d'agent de base avec le coffre Azure Key Vault de la banque connecté" } }
    - { id: b, text: { en: "A basic agent setup with a private endpoint on the Foundry resource", fr: "Une configuration d'agent de base avec un point de terminaison privé sur la ressource Foundry" } }
    - { id: c, text: { en: "A standard agent setup with the bank's own Azure Cosmos DB, Azure Storage and Azure AI Search", fr: "Une configuration d'agent standard avec les ressources Azure Cosmos DB, Stockage Azure et Azure AI Search de la banque" } }
    - { id: d, text: { en: "A hub-based project in the Foundry (classic) portal", fr: "Un projet basé sur un hub dans le portail Foundry (classique)" } }
answer: { optionId: c }
explanation:
  correct:
    en: A standard agent setup uses customer-managed, single-tenant resources for all customer data. Azure Cosmos DB stores messages, conversation history and agent metadata, Azure Storage stores uploaded files, and Azure AI Search stores the vector stores. Standard setup enforces project-level data isolation by default.
    fr: Une configuration d'agent standard utilise des ressources monolocataires gérées par le client pour toutes les données client. Azure Cosmos DB stocke les messages, l'historique des conversations et les métadonnées des agents, Stockage Azure stocke les fichiers chargés, et Azure AI Search stocke les magasins de vecteurs. La configuration standard applique par défaut une isolation des données au niveau du projet.
  options:
    a:
      en: Your own key vault holds connection secrets; in a basic setup, threads, messages and files still go to Microsoft-managed multitenant storage.
      fr: Votre propre coffre de clés contient les secrets des connexions ; dans une configuration de base, les threads, les messages et les fichiers restent dans un stockage multilocataire géré par Microsoft.
    b:
      en: A private endpoint controls network access; it doesn't change where a basic setup stores agent data.
      fr: Un point de terminaison privé contrôle l'accès réseau ; il ne change pas l'emplacement de stockage des données d'agent d'une configuration de base.
    d:
      en: Hub-based projects are the previous resource model; new investments target Foundry projects, and a hub doesn't by itself place agent data in the bank's resources.
      fr: Les projets basés sur un hub correspondent à l'ancien modèle de ressources ; les nouveaux investissements ciblent les projets Foundry, et un hub ne place pas à lui seul les données des agents dans les ressources de la banque.
references:
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/standard-agent-setup
