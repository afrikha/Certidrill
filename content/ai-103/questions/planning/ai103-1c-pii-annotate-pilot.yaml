id: ai103-1c-pii-annotate-pilot
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. pilots a model deployment named **chat-copy** that writes song-themed marketing copy. During the pilot, the legal team wants the application to receive a flag whenever a completion contains known copyrighted text, such as song lyrics, so that the application can log the case. Completions must not be blocked during the pilot.

    You are adding a control to the custom guardrail of chat-copy. What should you configure?
  fr: |
    Fabrikam, Inc. pilote un déploiement de modèle nommé **chat-copy** qui rédige des textes marketing sur le thème de chansons. Pendant le pilote, l'équipe juridique veut que l'application reçoive un indicateur chaque fois qu'une complétion contient un texte protégé connu, comme des paroles de chanson, afin que l'application journalise le cas. Les complétions ne doivent pas être bloquées pendant le pilote.

    Vous ajoutez un contrôle au garde-fou personnalisé de chat-copy. Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A Protected material for text control on Output with the Annotate action", fr: "Un contrôle Protected material for text sur Output avec l'action Annotate" }
    - id: b
      text: { en: "A Protected material for text control on Output with the Annotate and block action", fr: "Un contrôle Protected material for text sur Output avec l'action Annotate and block" }
    - id: c
      text: { en: "A Protected material for text control on User input with the Annotate action", fr: "Un contrôle Protected material for text sur User input avec l'action Annotate" }
    - id: d
      text: { en: "A Protected Materials evaluator that runs on the pilot conversations", fr: "Un évaluateur Protected Materials exécuté sur les conversations du pilote" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Annotate action, available for models, labels the detected content in the response and doesn't block it, so the application receives the flag and can log the case. The Output intervention point scans the completion, which is where the copyrighted text must be detected.
    fr: |
      L'action Annotate, disponible pour les modèles, étiquette le contenu détecté dans la réponse sans le bloquer : l'application reçoit l'indicateur et peut journaliser le cas. Le point d'intervention Output analyse la complétion, là où le texte protégé doit être détecté.
  options:
    b:
      en: Annotate and block would block the completions that contain copyrighted text, which the pilot forbids.
      fr: Annotate and block bloquerait les complétions qui contiennent un texte protégé, ce que le pilote interdit.
    c:
      en: User input scans the prompt, not the completion that the model returns.
      fr: User input analyse l'invite, pas la complétion que renvoie le modèle.
    d:
      en: An evaluator scores a batch of results after the fact; it doesn't flag each completion to the application at run time.
      fr: Un évaluateur note un lot de résultats après coup ; il ne signale pas chaque complétion à l'application à l'exécution.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
