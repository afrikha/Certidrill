id: ai103-1c-pii-annotate-pilot
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. pilots a model deployment named **chat-claims** that summarizes insurance claims. During the pilot, the compliance team wants the application to receive a flag whenever a completion contains personal data, so that the application can log the case. Completions must not be blocked during the pilot.

    You are adding a control to the custom guardrail of chat-claims. What should you configure?
  fr: |
    Fabrikam, Inc. pilote un déploiement de modèle nommé **chat-claims** qui résume des déclarations de sinistre. Pendant le pilote, l'équipe de conformité veut que l'application reçoive un indicateur chaque fois qu'une complétion contient des données personnelles, afin que l'application journalise le cas. Les complétions ne doivent pas être bloquées pendant le pilote.

    Vous ajoutez un contrôle au garde-fou personnalisé de chat-claims. Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A Personally identifiable information control on Output with the Annotate action", fr: "Un contrôle Personally identifiable information sur Output avec l'action Annotate" }
    - id: b
      text: { en: "A Personally identifiable information control on Output with the Annotate and block action", fr: "Un contrôle Personally identifiable information sur Output avec l'action Annotate and block" }
    - id: c
      text: { en: "A Personally identifiable information control on User input with the Annotate action", fr: "Un contrôle Personally identifiable information sur User input avec l'action Annotate" }
    - id: d
      text: { en: "A Sensitive Data Leakage evaluator that runs on the pilot conversations", fr: "Un évaluateur Sensitive Data Leakage exécuté sur les conversations du pilote" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Annotate action, available for models, labels the detected content in the response and doesn't block it, so the application receives the flag and can log the case. The Output intervention point scans the completion, which is where the personal data must be detected.
    fr: |
      L'action Annotate, disponible pour les modèles, étiquette le contenu détecté dans la réponse sans le bloquer : l'application reçoit l'indicateur et peut journaliser le cas. Le point d'intervention Output analyse la complétion, là où les données personnelles doivent être détectées.
  options:
    b:
      en: Annotate and block would block the completions that contain personal data, which the pilot forbids.
      fr: Annotate and block bloquerait les complétions qui contiennent des données personnelles, ce que le pilote interdit.
    c:
      en: User input scans the prompt, not the completion that the model returns.
      fr: User input analyse l'invite, pas la complétion que renvoie le modèle.
    d:
      en: Sensitive Data Leakage is an agent-only evaluator that scores a batch of results; it doesn't flag each completion at run time.
      fr: Sensitive Data Leakage est un évaluateur réservé aux agents qui note un lot de résultats ; il ne signale pas chaque complétion à l'exécution.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
