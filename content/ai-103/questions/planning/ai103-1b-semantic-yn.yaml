id: ai103-1b-semantic-yn
objective: "1.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank measures the relevance of the hybrid queries that ground its advisory agent. The queries run against an Azure AI Search index and use the semantic ranker (`queryType=semantic`).

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank mesure la pertinence des requêtes hybrides qui ancrent son agent de conseil. Les requêtes s'exécutent sur un index Azure AI Search et utilisent le classeur sémantique (`queryType=semantic`).

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The semantic ranker reranks only the top 50 results of the initial ranking.
        fr: |
          Le classeur sémantique reclasse uniquement les 50 premiers résultats du classement initial.
    - id: s2
      text:
        en: |
          A query that uses `queryType=semantic` with `search=*` is billed as a semantic ranker request.
        fr: |
          Une requête qui utilise `queryType=semantic` avec `search=*` est facturée comme une requête du classeur sémantique.
    - id: s3
      text:
        en: |
          The semantic ranker can return a relevant document that wasn't in the initial result set.
        fr: |
          Le classeur sémantique peut renvoyer un document pertinent qui ne figurait pas dans le jeu de résultats initial.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The semantic ranker adds a secondary ranking over the top 50 results scored by BM25 or Reciprocal Rank Fusion (RRF); it can't rerun the query over the whole corpus, so a document missing from the initial results can't appear. Charges apply only when the search string isn't empty: `search=*` isn't billed, even with `queryType=semantic`.
    fr: |
      Le classeur sémantique ajoute un classement secondaire sur les 50 premiers résultats notés par BM25 ou par Reciprocal Rank Fusion (RRF) ; il ne peut pas réexécuter la requête sur tout le corpus : un document absent des résultats initiaux ne peut donc pas apparaître. La facturation ne s'applique que si la chaîne de recherche n'est pas vide : `search=*` n'est pas facturé, même avec `queryType=semantic`.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
