id: ai103-1a-replace-thread-store
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Foundry project named **claims-prj** that uses the standard agent setup. Its capability settings reference the Azure Cosmos DB account **cosmos-a**. A new policy requires the agent state of claims-prj to be stored in another Cosmos DB account, **cosmos-b**, which has customer-managed keys.

    What should you do?
  fr: |
    Fabrikam dispose d'un projet Foundry nommé **claims-prj** qui utilise la configuration d'agent standard. Ses paramètres de capacité référencent le compte Azure Cosmos DB **cosmos-a**. Une nouvelle règle exige que l'état des agents de claims-prj soit stocké dans un autre compte Cosmos DB, **cosmos-b**, qui utilise des clés gérées par le client.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Update the capability settings of claims-prj so that they reference cosmos-b", fr: "Mettre à jour les paramètres de capacité de claims-prj pour qu'ils référencent cosmos-b" } }
    - { id: b, text: { en: "Edit the Cosmos DB connection of claims-prj so that it points to cosmos-b", fr: "Modifier la connexion Cosmos DB de claims-prj pour qu'elle pointe vers cosmos-b" } }
    - { id: c, text: { en: "Add a second Cosmos DB connection to claims-prj and make it the default", fr: "Ajouter une deuxième connexion Cosmos DB à claims-prj et la définir par défaut" } }
    - { id: d, text: { en: "Delete claims-prj and recreate it with capability settings that reference cosmos-b", fr: "Supprimer claims-prj et le recréer avec des paramètres de capacité qui référencent cosmos-b" } }
answer: { optionId: d }
explanation:
  correct:
    en: You can't update capability settings on an existing project. To change which resources a project uses for agent state, files and vectors, you delete the project and recreate it with the desired settings.
    fr: Les paramètres de capacité d'un projet existant ne peuvent pas être mis à jour. Pour changer les ressources qu'un projet utilise pour l'état, les fichiers et les vecteurs des agents, vous supprimez le projet et le recréez avec les paramètres souhaités.
  options:
    a:
      en: Capability settings can't be updated on an existing project.
      fr: Les paramètres de capacité ne peuvent pas être mis à jour sur un projet existant.
    b:
      en: Connections managed by capability settings are immutable while in use, so you can't edit or delete them directly.
      fr: |
        Les connexions gérées par les paramètres de capacité sont immuables tant qu'elles sont utilisées : vous ne pouvez ni les modifier ni les supprimer directement.
    c:
      en: The project's agent state store is set by its capability settings; adding a connection doesn't change it.
      fr: Le magasin d'état des agents du projet est défini par ses paramètres de capacité ; ajouter une connexion ne le change pas.
references:
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/standard-agent-setup
