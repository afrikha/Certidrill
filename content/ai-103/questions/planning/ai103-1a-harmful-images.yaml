id: ai103-1a-harmful-images
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Users of a Woodgrove community app upload profile pictures. Before a picture is published, the app must detect hateful or violent content and get a severity level for each harm category. The team doesn't want to train a model or write prompts.

    Which Foundry Tool should you use?
  fr: |
    Les utilisateurs d'une application communautaire de Woodgrove chargent des photos de profil. Avant la publication d'une photo, l'application doit détecter le contenu haineux ou violent et obtenir un niveau de gravité pour chaque catégorie de préjudice. L'équipe ne veut ni entraîner de modèle ni écrire d'invites.

    Quel outil de Foundry Tools devez-vous utiliser ?
body:
  options:
    - { id: a, text: Azure Vision }
    - { id: b, text: Azure Content Safety }
    - { id: c, text: Custom Vision }
    - { id: d, text: Azure Content Understanding }
answer: { optionId: b }
explanation:
  correct:
    en: Azure Content Safety is the Foundry Tool that detects unwanted content in text and images. It returns a severity level for each harm category, such as hate and violence, with no model to train and no prompt to write.
    fr: Azure Content Safety est l'outil Foundry Tools qui détecte le contenu indésirable dans le texte et les images. Il renvoie un niveau de gravité pour chaque catégorie de préjudice, comme la haine et la violence, sans modèle à entraîner ni invite à écrire.
  options:
    a:
      en: Azure Vision analyzes the content of images (tags, captions, text) but isn't the service that rates harm categories and severity levels.
      fr: Azure Vision analyse le contenu des images (étiquettes, légendes, texte), mais ce n'est pas le service qui évalue les catégories de préjudice et leurs niveaux de gravité.
    c:
      en: Custom Vision requires you to train your own image classifier, which the team doesn't want to do.
      fr: Custom Vision vous oblige à entraîner votre propre classifieur d'images, ce que l'équipe ne veut pas faire.
    d:
      en: Content Understanding extracts fields and Markdown from content according to an analyzer; it isn't the harm-detection service.
      fr: Content Understanding extrait des champs et du Markdown du contenu selon un analyseur ; ce n'est pas le service de détection des préjudices.
references:
  - title: What are Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/what-are-ai-services
