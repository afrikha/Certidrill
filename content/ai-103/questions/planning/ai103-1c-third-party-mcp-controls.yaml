id: ai103-1c-third-party-mcp-controls
objective: "1.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has an agent named **research-agent** in Foundry Agent Service. research-agent uses a third-party remote MCP server that exposes two tools: search_web, which returns the text of web pages, and create_ticket. research-agent has no guardrail of its own and inherits Microsoft.DefaultV2 from its model deployment.

    You need to meet the following requirements:

    - Instructions hidden in the web pages returned by search_web must be detected and blocked.
    - A person must confirm each ticket before create_ticket runs. search_web must run without confirmation.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un agent nommé **research-agent** dans Foundry Agent Service. research-agent utilise un serveur MCP distant tiers qui expose deux outils : search_web, qui renvoie le texte de pages web, et create_ticket. research-agent n'a pas de garde-fou propre et hérite de Microsoft.DefaultV2 de son déploiement de modèle.

    Vous devez satisfaire les exigences suivantes :

    - Les instructions cachées dans les pages web renvoyées par search_web doivent être détectées et bloquées.
    - Une personne doit confirmer chaque ticket avant l'exécution de create_ticket. search_web doit s'exécuter sans confirmation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Assign research-agent a guardrail with an Indirect attacks control on the Tool response intervention point.", fr: "Attribuer à research-agent un garde-fou doté d'un contrôle Indirect attacks sur le point d'intervention Tool response." }
    - id: b
      text: { en: "Assign research-agent a guardrail with a User prompt attacks control on the User input intervention point.", fr: "Attribuer à research-agent un garde-fou doté d'un contrôle User prompt attacks sur le point d'intervention User input." }
    - id: c
      text: { en: "Set require_approval to {\"always\": [\"create_ticket\"]} in the MCPTool.", fr: "Définir require_approval sur {\"always\": [\"create_ticket\"]} dans le MCPTool." }
    - id: d
      text: { en: "Set require_approval to {\"never\": [\"create_ticket\"]} in the MCPTool.", fr: "Définir require_approval sur {\"never\": [\"create_ticket\"]} dans le MCPTool." }
    - id: e
      text: { en: "Run the Indirect Attack evaluator on a dataset of research-agent conversations.", fr: "Exécuter l'évaluateur Indirect Attack sur un jeu de données de conversations de research-agent." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Instructions hidden in content returned by a tool are an indirect attack, and the Tool response intervention point (preview, agents only) scans what a tool returns to the agent; Microsoft.DefaultV2 doesn't detect indirect attacks. `{"always": ["create_ticket"]}` requires approval for create_ticket only, so search_web runs without confirmation.
    fr: |
      Des instructions cachées dans un contenu renvoyé par un outil constituent une attaque indirecte, et le point d'intervention Tool response (préversion, agents uniquement) analyse ce qu'un outil renvoie à l'agent ; Microsoft.DefaultV2 ne détecte pas les attaques indirectes. `{"always": ["create_ticket"]}` n'exige l'approbation que pour create_ticket : search_web s'exécute sans confirmation.
  options:
    b:
      en: |
        User prompt attacks on User input detect jailbreaks typed by the user, not instructions in tool results.
      fr: |
        User prompt attacks sur User input détecte les jailbreaks saisis par l'utilisateur, pas les instructions contenues dans les résultats d'outils.
    d:
      en: |
        {"never": ["create_ticket"]} exempts create_ticket from approval and requires it for search_web, the opposite of the requirement.
      fr: |
        {"never": ["create_ticket"]} dispense create_ticket d'approbation et l'exige pour search_web, soit l'inverse de l'exigence.
    e:
      en: |
        An evaluator scores conversations after the fact; it blocks nothing at run time. The Indirect Attack evaluator also applies to models only.
      fr: |
        Un évaluateur note des conversations après coup ; il ne bloque rien à l'exécution. L'évaluateur Indirect Attack s'applique en outre uniquement aux modèles.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
