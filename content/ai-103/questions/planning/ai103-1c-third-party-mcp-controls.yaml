id: ai103-1c-third-party-mcp-controls
objective: "1.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware, Inc. has several agents in a Foundry project. One of them, **research-agent**, uses a third-party remote MCP server that exposes two tools: search_web and create_ticket. The server accepts Microsoft Entra tokens issued to agent identities.

    You need to meet the following requirements:

    - Calls to the server must be authorized with the own Microsoft Entra identity of research-agent, not with an identity that other agents share, and no secret may be stored.
    - A person must confirm each ticket before create_ticket runs. search_web must run without confirmation.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose de plusieurs agents dans un projet Foundry. L'un d'eux, **research-agent**, utilise un serveur MCP distant tiers qui expose deux outils : search_web et create_ticket. Le serveur accepte les jetons Microsoft Entra émis pour des identités d'agent.

    Vous devez satisfaire les exigences suivantes :

    - Les appels au serveur doivent être autorisés avec l'identité Microsoft Entra propre à research-agent, et non avec une identité que d'autres agents partagent, et aucun secret ne doit être stocké.
    - Une personne doit confirmer chaque ticket avant l'exécution de create_ticket. search_web doit s'exécuter sans confirmation.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure the project connection of the MCP server with agent identity (agentic-identity) authentication.", fr: "Configurer la connexion de projet du serveur MCP avec l'authentification par identité d'agent (agentic-identity)." }
    - id: b
      text: { en: "Configure the project connection of the MCP server with project managed identity authentication.", fr: "Configurer la connexion de projet du serveur MCP avec l'authentification par identité managée du projet." }
    - id: c
      text: { en: "Set require_approval to {\"always\": [\"create_ticket\"]} in the MCPTool.", fr: "Définir require_approval sur {\"always\": [\"create_ticket\"]} dans le MCPTool." }
    - id: d
      text: { en: "Set require_approval to {\"never\": [\"create_ticket\"]} in the MCPTool.", fr: "Définir require_approval sur {\"never\": [\"create_ticket\"]} dans le MCPTool." }
    - id: e
      text: { en: "Configure the project connection of the MCP server with custom keys authentication.", fr: "Configurer la connexion de projet du serveur MCP avec l'authentification par clés personnalisées." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      With agent identity authentication, the MCP tool calls the server with the Microsoft Entra identity of the agent itself, so the server can authorize research-agent alone, and no key is stored. `{"always": ["create_ticket"]}` requires approval for create_ticket only, so search_web runs without confirmation.
    fr: |
      Avec l'authentification par identité d'agent, l'outil MCP appelle le serveur avec l'identité Microsoft Entra de l'agent lui-même : le serveur peut autoriser research-agent seul, et aucune clé n'est stockée. `{"always": ["create_ticket"]}` n'exige l'approbation que pour create_ticket : search_web s'exécute sans confirmation.
  options:
    b:
      en: |
        The project managed identity is one identity shared by the agents of the project, so the server couldn't tell research-agent from the others.
      fr: |
        L'identité managée du projet est une identité unique partagée par les agents du projet : le serveur ne pourrait pas distinguer research-agent des autres.
    d:
      en: |
        {"never": ["create_ticket"]} exempts create_ticket from approval and requires it for search_web, the opposite of the requirement.
      fr: |
        {"never": ["create_ticket"]} dispense create_ticket d'approbation et l'exige pour search_web, soit l'inverse de l'exigence.
    e:
      en: |
        Custom keys store a secret in the connection, which the requirement forbids, and the key isn't tied to the agent's identity.
      fr: |
        Les clés personnalisées stockent un secret dans la connexion, ce que l'exigence interdit, et la clé n'est pas liée à l'identité de l'agent.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
  - title: Agent identity concepts in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity
