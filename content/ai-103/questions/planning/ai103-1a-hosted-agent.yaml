id: ai103-1a-hosted-agent
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a claims-processing agent written in Python with LangGraph. The agent contains custom orchestration logic that the team must keep. The team wants to run it on Microsoft Foundry with a managed endpoint, per-session scaling and a dedicated Microsoft Entra identity, without managing a container platform.

    What should you use?
  fr: |
    Adatum dispose d'un agent de traitement des sinistres écrit en Python avec LangGraph. L'agent contient une logique d'orchestration personnalisée que l'équipe doit conserver. L'équipe veut l'exécuter sur Microsoft Foundry avec un point de terminaison managé, une mise à l'échelle par session et une identité Microsoft Entra dédiée, sans gérer de plateforme de conteneurs.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A prompt agent in Foundry Agent Service", fr: "Un agent d'invite dans Foundry Agent Service" } }
    - { id: b, text: { en: "A workflow agent in Foundry Agent Service", fr: "Un agent de workflow dans Foundry Agent Service" } }
    - { id: c, text: { en: "A hosted agent in Foundry Agent Service", fr: "Un agent hébergé dans Foundry Agent Service" } }
    - { id: d, text: { en: "A Global Batch deployment of the agent's model", fr: "Un déploiement Global Batch du modèle de l'agent" } }
answer: { optionId: c }
explanation:
  correct:
    en: Hosted agents are your own code, built with a framework such as LangGraph or Microsoft Agent Framework, packaged as a container image and run by Agent Service. The service pulls the image, assigns a dedicated Microsoft Entra agent identity, exposes an endpoint and scales per session.
    fr: Les agents hébergés sont votre propre code, écrit avec un framework comme LangGraph ou Microsoft Agent Framework, empaqueté dans une image conteneur et exécuté par Agent Service. Le service récupère l'image, attribue une identité d'agent Microsoft Entra dédiée, expose un point de terminaison et met à l'échelle par session.
  options:
    a:
      en: A prompt agent is defined only by configuration (instructions, model, tools); it can't run the team's LangGraph orchestration code.
      fr: Un agent d'invite est défini uniquement par sa configuration (instructions, modèle, outils) ; il ne peut pas exécuter le code d'orchestration LangGraph de l'équipe.
    b:
      en: A workflow agent orchestrates steps and agents with declarative definitions; it doesn't host existing framework code.
      fr: Un agent de workflow orchestre des étapes et des agents à l'aide de définitions déclaratives ; il n'héberge pas de code de framework existant.
    d:
      en: A batch deployment processes asynchronous model requests with a 24-hour target; it doesn't host an agent.
      fr: Un déploiement par lots traite des requêtes de modèle asynchrones avec un objectif de 24 heures ; il n'héberge pas d'agent.
references:
  - title: Hosted agents in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/hosted-agents
