id: ai103-1b-keyless-order
objective: "1.3.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has a web app in Azure App Service that calls an agent in a Foundry project named **hr**. The app reads an API key of the Foundry resource from an app setting.

    You need to move the app to keyless authentication and then make sure that the Foundry resource rejects keys. The app must keep working throughout the change, and the solution must follow the principle of least privilege.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'une application web dans Azure App Service qui appelle un agent d'un projet Foundry nommé **hr**. L'application lit une clé API de la ressource Foundry dans un paramètre d'application.

    Vous devez faire passer l'application à l'authentification sans clé, puis vous assurer que la ressource Foundry rejette les clés. L'application doit continuer de fonctionner pendant toute la modification, et la solution doit respecter le principe du moindre privilège.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: mi, text: { en: "Enable the system-assigned managed identity of the web app.", fr: "Activer l'identité managée affectée par le système de l'application web." } }
    - { id: role, text: { en: "Assign the Foundry User role on the hr project to the managed identity.", fr: "Attribuer le rôle Foundry User sur le projet hr à l'identité managée." } }
    - { id: code, text: { en: "Deploy code that authenticates with ManagedIdentityCredential, and remove the key from the app settings.", fr: "Déployer du code qui s'authentifie avec ManagedIdentityCredential, et supprimer la clé des paramètres d'application." } }
    - { id: disable, text: { en: "Set disableLocalAuth to true on the Foundry resource.", fr: "Définir disableLocalAuth sur true sur la ressource Foundry." } }
    - { id: kv, text: { en: "Move the key to Azure Key Vault and reference it from the app settings.", fr: "Déplacer la clé dans Azure Key Vault et la référencer depuis les paramètres d'application." } }
    - { id: contrib, text: { en: "Assign the Contributor role on the resource group to the managed identity.", fr: "Attribuer le rôle Contributor sur le groupe de ressources à l'identité managée." } }
    - { id: regen, text: { en: "Regenerate both keys of the Foundry resource.", fr: "Régénérer les deux clés de la ressource Foundry." } }
answer:
  sequence: [ mi, role, code, disable ]
explanation:
  correct:
    en: |
      The identity must exist before it can receive a role, and it needs Foundry User, the least-privileged data role, before the new code relies on it. Once the app authenticates with its managed identity and no longer uses the key, you disable local authentication, so no request fails during the change; old keys keep working until the change reaches the gateway.
    fr: |
      L'identité doit exister avant de recevoir un rôle, et elle a besoin de Foundry User, le rôle de données le moins privilégié, avant que le nouveau code ne s'appuie sur elle. Une fois que l'application s'authentifie avec son identité managée et n'utilise plus la clé, vous désactivez l'authentification locale : aucune requête n'échoue pendant la modification ; les anciennes clés restent valides jusqu'à ce que la modification atteigne la passerelle.
  options:
    kv: { en: "Key Vault protects the key but keeps key-based authentication.", fr: "Key Vault protège la clé, mais conserve l'authentification par clé." }
    contrib: { en: "Contributor has no data actions in a Foundry project and grants management rights that aren't needed.", fr: "Contributor n'a aucune action de données dans un projet Foundry et accorde des droits de gestion inutiles." }
    regen: { en: "Regenerating keys doesn't make the app keyless and would break it before the new code is deployed.", fr: "Régénérer les clés ne rend pas l'application sans clé et la casserait avant le déploiement du nouveau code." }
references:
  - title: Disable local authentication in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
