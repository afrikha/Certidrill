id: ai103-1a-agent-types
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans two agent solutions in Foundry Agent Service:

    - **Onboarding**: a repeatable process that calls the existing HR agent, then the existing IT agent, and waits for a manager's approval between the two steps. The team has already written it as a Microsoft Agent Framework workflow in Python and wants Foundry to run it with a managed endpoint.
    - **FAQ assistant**: answers employee questions from uploaded documents. It uses one model and the file search tool, needs no custom orchestration, and must reach production by the fastest path.

    Which agent type should you use for each solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit deux solutions d'agent dans Foundry Agent Service :

    - **Intégration** : un processus reproductible qui appelle l'agent RH existant, puis l'agent informatique existant, et attend l'approbation d'un responsable entre les deux étapes. L'équipe l'a déjà écrit sous forme de workflow Microsoft Agent Framework en Python et veut que Foundry l'exécute avec un point de terminaison managé.
    - **Assistant FAQ** : répond aux questions des employés à partir de documents chargés. Il utilise un modèle et l'outil de recherche de fichiers, ne nécessite aucune orchestration personnalisée et doit arriver en production par le chemin le plus rapide.

    Quel type d'agent devez-vous utiliser pour chaque solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Onboarding: [[onboarding]]

      FAQ assistant: [[faq]]
    fr: |
      Intégration : [[onboarding]]

      Assistant FAQ : [[faq]]
  slots:
    - id: onboarding
      options:
        - { id: prompt, text: { en: "Prompt agent", fr: "Agent d'invite" } }
        - { id: voice, text: { en: "Voice-based prompt agent", fr: "Agent d'invite vocal" } }
        - { id: hosted, text: { en: "Hosted agent", fr: "Agent hébergé" } }
    - id: faq
      options:
        - { id: prompt, text: { en: "Prompt agent", fr: "Agent d'invite" } }
        - { id: voice, text: { en: "Voice-based prompt agent", fr: "Agent d'invite vocal" } }
        - { id: hosted, text: { en: "Hosted agent", fr: "Agent hébergé" } }
answer:
  values: { onboarding: hosted, faq: prompt }
explanation:
  correct:
    en: Hosted agents run your own code, such as a Microsoft Agent Framework workflow that orchestrates several agents with an approval step, and Foundry gives them a managed endpoint. Microsoft recommends Agent Framework for new workflows, deployed as a hosted agent, because the visual Foundry workflows (preview) retire on December 1, 2026. Prompt agents are defined entirely by instructions, a model and tools, which is the fastest path for a single agent with no custom orchestration.
    fr: |
      Les agents hébergés exécutent votre propre code, comme un workflow Microsoft Agent Framework qui orchestre plusieurs agents avec une étape d'approbation, et Foundry leur fournit un point de terminaison managé. Microsoft recommande Agent Framework pour les nouveaux workflows, déployés comme agents hébergés, car les workflows visuels de Foundry (préversion) sont mis hors service le 1er décembre 2026. Les agents d'invite sont entièrement définis par des instructions, un modèle et des outils : c'est le chemin le plus rapide pour un agent unique sans orchestration personnalisée.
  options:
    onboarding:
      en: A prompt agent is defined by configuration and can't run the team's Agent Framework code; a voice-based prompt agent is for low-latency audio conversations.
      fr: Un agent d'invite est défini par configuration et ne peut pas exécuter le code Agent Framework de l'équipe ; un agent d'invite vocal sert aux conversations audio à faible latence.
    faq:
      en: A voice-based prompt agent adds an audio channel that the FAQ assistant doesn't need; a hosted agent means writing and packaging code.
      fr: Un agent d'invite vocal ajoute un canal audio dont l'assistant FAQ n'a pas besoin ; un agent hébergé implique d'écrire et d'empaqueter du code.
references:
  - title: What is Microsoft Foundry Agent Service?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/overview
  - title: Build a workflow in Microsoft Foundry (Preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow
