id: ai103-1a-agent-types
objective: "1.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans two agent solutions in Foundry Agent Service:

    - **Onboarding**: a repeatable process that calls the existing HR agent, then the existing IT agent, and waits for a manager's approval between the two steps. It must be built without custom code.
    - **FAQ assistant**: answers employee questions from uploaded documents. It uses one model and the file search tool, needs no custom orchestration, and must reach production by the fastest path.

    Which agent type should you use for each solution? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit deux solutions d'agent dans Foundry Agent Service :

    - **Intégration** : un processus reproductible qui appelle l'agent RH existant, puis l'agent informatique existant, et attend l'approbation d'un responsable entre les deux étapes. Il doit être créé sans code personnalisé.
    - **Assistant FAQ** : répond aux questions des employés à partir de documents chargés. Il utilise un modèle et l'outil de recherche de fichiers, ne nécessite aucune orchestration personnalisée et doit arriver en production par le chemin le plus rapide.

    Quel type d'agent devez-vous utiliser pour chaque solution ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Onboarding: [[onboarding]]

      FAQ assistant: [[faq]]
    fr: |
      Intégration : [[onboarding]]

      Assistant FAQ : [[faq]]
  slots:
    - id: onboarding
      options:
        - { id: prompt, text: { en: "Prompt agent", fr: "Agent d'invite" } }
        - { id: workflow, text: { en: "Workflow agent", fr: "Agent de workflow" } }
        - { id: hosted, text: { en: "Hosted agent", fr: "Agent hébergé" } }
    - id: faq
      options:
        - { id: prompt, text: { en: "Prompt agent", fr: "Agent d'invite" } }
        - { id: workflow, text: { en: "Workflow agent", fr: "Agent de workflow" } }
        - { id: hosted, text: { en: "Hosted agent", fr: "Agent hébergé" } }
answer:
  values: { onboarding: workflow, faq: prompt }
explanation:
  correct:
    en: Workflow agents (preview) orchestrate a sequence of actions or several agents with declarative definitions, including human-in-the-loop steps and approval workflows, without custom code. Prompt agents are defined entirely by instructions, a model and tools, which is the fastest path for a single agent with no custom orchestration.
    fr: |
      Les agents de workflow (préversion) orchestrent une séquence d'actions ou plusieurs agents à l'aide de définitions déclaratives, y compris des étapes avec intervention humaine et des workflows d'approbation, sans code personnalisé. Les agents d'invite sont entièrement définis par des instructions, un modèle et des outils : c'est le chemin le plus rapide pour un agent unique sans orchestration personnalisée.
  options:
    onboarding:
      en: A prompt agent is a single agent and doesn't coordinate other agents with an approval step; a hosted agent would require custom code.
      fr: Un agent d'invite est un agent unique et ne coordonne pas d'autres agents avec une étape d'approbation ; un agent hébergé nécessiterait du code personnalisé.
    faq:
      en: A workflow agent adds orchestration that a single FAQ agent doesn't need; a hosted agent means writing and packaging code.
      fr: Un agent de workflow ajoute une orchestration inutile pour un agent FAQ unique ; un agent hébergé implique d'écrire et d'empaqueter du code.
references:
  - title: What is Microsoft Foundry Agent Service?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/overview
