id: ai103-1a-image-search
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso Outdoor stores 80,000 product photos in Azure Blob Storage. The photos contain no text. Customers type descriptions such as "red two-person tent with a porch", and the search must return matching photos.

    You need to configure indexing and querying in Azure AI Search. The solution must not require custom code for embeddings, at indexing or at query time.

    What should you configure?
  fr: |
    Contoso Outdoor stocke 80 000 photos de produits dans Stockage Blob Azure. Les photos ne contiennent pas de texte. Les clients tapent des descriptions comme « tente rouge deux places avec auvent », et la recherche doit renvoyer les photos correspondantes.

    Vous devez configurer l'indexation et l'interrogation dans Azure AI Search. La solution ne doit pas nécessiter de code personnalisé pour les incorporations, ni à l'indexation ni au moment de la requête.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An AzureOpenAIEmbedding skill with `text-embedding-3-large` and an Azure OpenAI vectorizer", fr: "Une compétence AzureOpenAIEmbedding avec `text-embedding-3-large` et un vectoriseur Azure OpenAI" } }
    - { id: b, text: { en: "An OCR skill that writes to a searchable text field, queried with full-text search", fr: "Une compétence OCR qui écrit dans un champ texte recherchable, interrogé en texte intégral" } }
    - { id: c, text: { en: "A Custom Web API skill and a Custom Web API vectorizer that call an embedding function", fr: "Une compétence Custom Web API et un vectoriseur Custom Web API qui appellent une fonction d'incorporation" } }
    - { id: d, text: { en: "An Azure Vision multimodal embeddings skill and an Azure Vision vectorizer", fr: "Une compétence d'incorporations multimodales Azure Vision et un vectoriseur Azure Vision" } }
answer: { optionId: d }
explanation:
  correct:
    en: The Azure Vision multimodal embeddings skill (preview) vectorizes images during indexing, and its matching Azure Vision vectorizer converts text queries into vectors in the same space at query time. Integrated vectorization therefore matches text descriptions to photos without custom code.
    fr: La compétence d'incorporations multimodales Azure Vision (préversion) vectorise les images pendant l'indexation, et le vectoriseur Azure Vision correspondant convertit les requêtes texte en vecteurs dans le même espace au moment de la requête. La vectorisation intégrée fait ainsi correspondre des descriptions textuelles à des photos sans code personnalisé.
  options:
    a:
      en: The Azure OpenAI embedding models vectorize text, not image content.
      fr: Les modèles d'incorporation Azure OpenAI vectorisent du texte, pas le contenu des images.
    b:
      en: OCR extracts text from images, and these photos contain none.
      fr: L'OCR extrait le texte des images, et ces photos n'en contiennent pas.
    c:
      en: The Custom Web API skill and vectorizer call your own code, which the requirement excludes.
      fr: La compétence et le vectoriseur Custom Web API appellent votre propre code, ce que l'exigence exclut.
references:
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
