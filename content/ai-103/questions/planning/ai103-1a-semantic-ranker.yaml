id: ai103-1a-semantic-ranker
objective: "1.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to enable the semantic ranker on an Azure AI Search index that grounds a RAG application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'activer le classeur sémantique sur un index Azure AI Search qui ancre une application RAG.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The semantic ranker reorders only the top 50 results returned by the initial BM25 or RRF ranking.
        fr: Le classeur sémantique réordonne uniquement les 50 premiers résultats renvoyés par le classement initial BM25 ou RRF.
    - id: s2
      text:
        en: Semantic answers are composed by a generative model from the content of the top results.
        fr: Les réponses sémantiques sont rédigées par un modèle génératif à partir du contenu des premiers résultats.
    - id: s3
      text:
        en: A request with `queryType=semantic` and `search=*` is billed as a semantic ranking request.
        fr: Une requête avec `queryType=semantic` et `search=*` est facturée comme une requête de classement sémantique.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: The semantic ranker reranks the existing result set, made of the top 50 results of the default ranking; it doesn't rerun the query over the whole index. Captions and answers are always verbatim text extracted from the index, with no generative model. Charges apply when `queryType=semantic` is set and the search string isn't empty, so `search=*` isn't charged.
    fr: |
      Le classeur sémantique réordonne le jeu de résultats existant, constitué des 50 premiers résultats du classement par défaut ; il ne réexécute pas la requête sur tout l'index. Les légendes et les réponses sont toujours du texte extrait mot pour mot de l'index, sans modèle génératif. La facturation s'applique quand `queryType=semantic` est défini et que la chaîne de recherche n'est pas vide : `search=*` n'est donc pas facturé.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
