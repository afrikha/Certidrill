id: ai103-1a-ptu-spillover
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam serves its order assistant from a Data Zone Provisioned deployment named **orders-ptu** in a Foundry resource in the EU. The PTUs cover the normal load. During a few sales peaks per year, orders-ptu is fully utilized and returns HTTP 429 responses.

    You need the overflow requests to be served automatically during the peaks, without changing the retry logic of the client. Prompts must stay within the EU data zone, and you must not pay for extra reserved capacity all year.

    What should you do?
  fr: |
    Fabrikam sert son assistant de commandes à partir d'un déploiement Data Zone Provisioned nommé **orders-ptu** dans une ressource Foundry de l'UE. Les PTU couvrent la charge normale. Lors de quelques pics de ventes par an, orders-ptu est entièrement utilisé et renvoie des réponses HTTP 429.

    Vous devez faire en sorte que les requêtes excédentaires soient servies automatiquement pendant les pics, sans modifier la logique de nouvelle tentative du client. Les invites doivent rester dans la zone de données de l'UE, et vous ne devez pas payer de capacité réservée supplémentaire toute l'année.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Global Standard deployment of the same model in the resource and configure spillover from orders-ptu to it", fr: "Créer un déploiement Global Standard du même modèle dans la ressource et configurer le débordement d'orders-ptu vers celui-ci" } }
    - { id: b, text: { en: "Create a Data Zone Standard deployment of the same model in the resource and configure spillover from orders-ptu to it", fr: "Créer un déploiement Data Zone Standard du même modèle dans la ressource et configurer le débordement d'orders-ptu vers celui-ci" } }
    - { id: c, text: { en: "Purchase a one-year Azure reservation for additional Data Zone Provisioned PTUs", fr: "Acheter une réservation Azure d'un an pour des PTU Data Zone Provisioned supplémentaires" } }
    - { id: d, text: { en: "Replace orders-ptu with a Data Zone Batch deployment", fr: "Remplacer orders-ptu par un déploiement Data Zone Batch" } }
answer: { optionId: b }
explanation:
  correct:
    en: Spillover automatically routes overflow requests of a provisioned deployment, such as 429 responses when the PTUs are exhausted, to a standard deployment in the same Foundry resource. A Data Zone Standard target keeps processing within the EU data zone and is billed per token only when it is used.
    fr: Le débordement achemine automatiquement les requêtes excédentaires d'un déploiement provisionné, comme les réponses 429 quand les PTU sont épuisées, vers un déploiement standard de la même ressource Foundry. Une cible Data Zone Standard maintient le traitement dans la zone de données de l'UE et n'est facturée par jeton que lorsqu'elle est utilisée.
  options:
    a:
      en: A Global Standard deployment may process prompts in any Azure region, which breaks the data zone requirement.
      fr: Un déploiement Global Standard peut traiter les invites dans n'importe quelle région Azure, ce qui enfreint l'exigence de zone de données.
    c:
      en: A reservation only discounts the hourly PTU rate for a commitment; it doesn't guarantee capacity, and extra PTUs are billed all year.
      fr: Une réservation ne fait que réduire le tarif horaire des PTU en échange d'un engagement ; elle ne garantit pas la capacité, et les PTU supplémentaires sont facturées toute l'année.
    d:
      en: Batch deployments have no real-time SLA, so they can't serve an interactive assistant.
      fr: |
        Les déploiements par lots n'ont pas de SLA en temps réel : ils ne peuvent pas servir un assistant interactif.
references:
