id: ai103-1a-model-router
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an internal assistant that receives a mix of short factual questions and complex analysis requests. Today, every request goes to a single large model, which is expensive for the simple questions.

    You need a single Global Standard deployment that chooses a suitable model for each prompt in real time. For each prompt, the selected model must be the most cost-effective one whose quality is within a small range of the best model for that prompt.

    What should you deploy?
  fr: |
    Proseware exploite un assistant interne qui reçoit un mélange de questions factuelles courtes et de demandes d'analyse complexes. Aujourd'hui, toutes les requêtes sont envoyées à un seul grand modèle, ce qui coûte cher pour les questions simples.

    Vous avez besoin d'un seul déploiement Global Standard qui choisit un modèle adapté à chaque invite en temps réel. Pour chaque invite, le modèle choisi doit être le plus économique parmi ceux dont la qualité reste proche de celle du meilleur modèle pour cette invite.

    Que devez-vous déployer ?
body:
  options:
    - { id: a, text: { en: "Model router with the Quality routing mode", fr: "Le routeur de modèles avec le mode de routage Quality" } }
    - { id: b, text: { en: "Model router with the Balanced routing mode", fr: "Le routeur de modèles avec le mode de routage Balanced" } }
    - { id: c, text: { en: "An `o3` deployment with the reasoning effort set to `low`", fr: "Un déploiement `o3` avec l'effort de raisonnement défini sur `low`" } }
    - { id: d, text: { en: "A provisioned deployment with spillover to a standard deployment", fr: "Un déploiement provisionné avec débordement vers un déploiement standard" } }
answer: { optionId: b }
explanation:
  correct:
    en: Model router is a trained model that routes each prompt to the most suitable underlying model and supports Global Standard deployments. Its Balanced mode, the default, considers the models within a small quality range of the best one for the prompt and picks the most cost-effective of them.
    fr: Le routeur de modèles est un modèle entraîné qui achemine chaque invite vers le modèle sous-jacent le plus adapté, et il prend en charge les déploiements Global Standard. Son mode Balanced, utilisé par défaut, considère les modèles dont la qualité est proche de celle du meilleur modèle pour l'invite et choisit le plus économique d'entre eux.
  options:
    a:
      en: The Quality mode picks the highest-quality model for each prompt and ignores cost.
      fr: Le mode Quality choisit le modèle de la plus haute qualité pour chaque invite et ignore le coût.
    c:
      en: A single `o3` deployment sends every prompt to the same reasoning model; nothing chooses a cheaper model for simple questions.
      fr: Un déploiement `o3` unique envoie toutes les invites au même modèle de raisonnement ; rien ne choisit un modèle moins cher pour les questions simples.
    d:
      en: Spillover sends overflow traffic of a provisioned deployment to a standard deployment of the same model; it doesn't choose a model per prompt, and the requirement asks for a Global Standard deployment.
      fr: Le débordement envoie le trafic excédentaire d'un déploiement provisionné vers un déploiement standard du même modèle ; il ne choisit pas un modèle par invite, et l'exigence demande un déploiement Global Standard.
references:
  - title: Model router for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-router
