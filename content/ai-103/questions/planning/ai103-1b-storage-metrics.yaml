id: ai103-1b-storage-metrics
objective: "1.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Relecloud indexes text chunks and their embeddings in an Azure AI Search service for a RAG application. The number of documents grows every week, and the operations team wants Azure Monitor alerts before the index reaches the storage limits of the service tier, both for its total content and for its vectors.

    Which two metrics should you use?

    NOTE: Each correct selection is worth one point.
  fr: |
    Relecloud indexe des blocs de texte et leurs incorporations dans un service Azure AI Search pour une application RAG. Le nombre de documents augmente chaque semaine, et l'équipe d'exploitation souhaite des alertes Azure Monitor avant que l'index n'atteigne les limites de stockage du niveau de service, à la fois pour son contenu total et pour ses vecteurs.

    Quelles sont les deux métriques à utiliser ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Search queries per second }
    - { id: b, text: Storage usage }
    - { id: c, text: Document processed count }
    - { id: d, text: Throttled search queries percentage }
    - { id: e, text: Vector Storage usage }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Storage usage reports the storage of the service by index, text and vectors together, and Vector Storage usage reports the vector storage by index. Both have the IndexName dimension, so you can alert on a specific index before it reaches the limits of the tier.
    fr: |
      Storage usage indique le stockage du service par index, texte et vecteurs confondus, et Vector Storage usage indique le stockage vectoriel par index. Les deux ont la dimension IndexName : vous pouvez donc déclencher une alerte sur un index précis avant qu'il n'atteigne les limites du niveau.
  options:
    a:
      en: |
        Search queries per second measures query volume.
      fr: |
        Search queries per second mesure le volume de requêtes.
    c:
      en: |
        Document processed count counts the documents processed by indexers, not the storage they use.
      fr: |
        Document processed count compte les documents traités par les indexeurs, pas le stockage qu'ils utilisent.
    d:
      en: |
        Throttled search queries percentage measures dropped queries, not storage.
      fr: |
        Throttled search queries percentage mesure les requêtes rejetées, pas le stockage.
references:
  - title: Azure AI Search monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/search/monitor-azure-cognitive-search-data-reference
  - title: Monitor Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/monitor-azure-cognitive-search
