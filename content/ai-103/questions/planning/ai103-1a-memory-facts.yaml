id: ai103-1a-memory-facts
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Relecloud wants its travel agent to remember each traveler's preferences, such as seat and meal choices, across sessions and devices. The team plans to use memory in Foundry Agent Service with the memory search tool.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Relecloud veut que son agent de voyage mémorise les préférences de chaque voyageur, comme le choix du siège et du repas, d'une session et d'un appareil à l'autre. L'équipe prévoit d'utiliser la mémoire de Foundry Agent Service avec l'outil de recherche en mémoire.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If you set the `scope` of the memory search tool to `{{$userId}}`, the scope is resolved from the caller's identity, so each traveler gets only their own memories.
        fr: Si vous définissez le `scope` de l'outil de recherche en mémoire sur `{{$userId}}`, l'étendue est déterminée à partir de l'identité de l'appelant, et chaque voyageur n'obtient que ses propres souvenirs.
    - id: s2
      text:
        en: The memory store can be integrated into the virtual network of the company so that it is reachable only privately.
        fr: Le magasin de mémoire peut être intégré au réseau virtuel de l'entreprise afin de n'être accessible qu'en privé.
    - id: s3
      text:
        en: The memory feature requires a chat model deployment and an embedding model deployment.
        fr: La fonctionnalité de mémoire nécessite un déploiement de modèle de conversation et un déploiement de modèle d'incorporation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Automatic scope resolution from the caller's identity is supported with the memory search tool when `scope` is `{{$userId}}`. Memory requires compatible Azure OpenAI chat and embedding model deployments, which are billed. Virtual network integration isn't supported for memory stores, which also matters for private-network designs.
    fr: La résolution automatique de l'étendue à partir de l'identité de l'appelant est prise en charge avec l'outil de recherche en mémoire quand `scope` vaut `{{$userId}}`. La mémoire nécessite des déploiements compatibles de modèles Azure OpenAI de conversation et d'incorporation, qui sont facturés. L'intégration à un réseau virtuel n'est pas prise en charge pour les magasins de mémoire, ce qui compte aussi pour les conceptions en réseau privé.
references:
  - title: Memory in Microsoft Foundry Agent Service (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
