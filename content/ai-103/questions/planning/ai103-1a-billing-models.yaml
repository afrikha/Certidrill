id: ai103-1a-billing-models
objective: "1.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    The finance team of Northwind Traders is building a cost model for its Microsoft Foundry deployments.

    How is each deployment option billed? To answer, drag the appropriate billing methods to the correct deployment options. Each billing method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'équipe financière de Northwind Traders construit un modèle de coûts pour ses déploiements Microsoft Foundry.

    Comment chaque option de déploiement est-elle facturée ? Pour répondre, faites glisser les méthodes de facturation appropriées vers les options de déploiement correspondantes. Chaque méthode de facturation peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: token, text: { en: "Pay-per-token", fr: "Facturation par jeton" } }
    - { id: ptu, text: { en: "Hourly rate for each PTU deployed, whatever the tokens consumed", fr: "Tarif horaire pour chaque PTU déployée, quel que soit le nombre de jetons consommés" } }
    - { id: half, text: { en: "50% less than the Global Standard price", fr: "50 % de moins que le prix de Global Standard" } }
    - { id: cores, text: { en: "Compute core hours, billed per minute", fr: "Heures de cœurs de calcul, facturées à la minute" } }
    - { id: chars, text: { en: "Number of characters translated", fr: "Nombre de caractères traduits" } }
  targets:
    - id: gstd
      text: { en: "Global Standard deployment", fr: "Déploiement Global Standard" }
    - id: rprov
      text: { en: "Regional Provisioned deployment", fr: "Déploiement Regional Provisioned" }
    - id: dzbatch
      text: { en: "Data Zone Batch deployment", fr: "Déploiement Data Zone Batch" }
    - id: managed
      text: { en: "Managed compute deployment", fr: "Déploiement sur calcul managé" }
answer:
  mapping: { gstd: token, rprov: ptu, dzbatch: half, managed: cores }
explanation:
  correct:
    en: |
      Standard deployment types are billed per token. All provisioned types are billed at an hourly rate for the PTUs deployed, regardless of the tokens consumed, from creation to deletion. Batch types cost 50% less than Global Standard. Managed compute is billed in compute core hours on a per-minute basis.
    fr: |
      Les types de déploiement standard sont facturés par jeton. Tous les types provisionnés sont facturés à un tarif horaire pour les PTU déployées, quel que soit le nombre de jetons consommés, de la création à la suppression. Les types par lots coûtent 50 % de moins que Global Standard. Le calcul managé est facturé en heures de cœurs de calcul, à la minute.
  options:
    chars:
      en: Billing by translated characters applies to Azure Translator, not to a model deployment.
      fr: La facturation au nombre de caractères traduits s'applique à Azure Translator, pas à un déploiement de modèle.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: What is provisioned throughput for Foundry Models?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
