id: ai103-1b-network-yn
objective: "1.3.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Litware is deploying a Microsoft Foundry resource with a standard agent setup. The agents must use network injection to reach APIs inside the company's virtual network. Azure AI Search, Azure Storage and Azure Cosmos DB accounts are provided for the standard setup. Public network access to the Foundry resource will be disabled, and the resource will be reached through a private endpoint.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware déploie une ressource Microsoft Foundry avec une configuration d'agent standard. Les agents doivent utiliser l'injection réseau pour joindre des API situées dans le réseau virtuel de l'entreprise. Des comptes Azure AI Search, Stockage Azure et Azure Cosmos DB sont fournis pour la configuration standard. L'accès réseau public à la ressource Foundry sera désactivé, et la ressource sera jointe par un point de terminaison privé.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Creating the private endpoint of the Foundry resource also creates private endpoints for the Azure AI Search, Storage and Azure Cosmos DB accounts.
        fr: |
          La création du point de terminaison privé de la ressource Foundry crée aussi des points de terminaison privés pour les comptes Azure AI Search, Stockage et Azure Cosmos DB.
    - id: s2
      text:
        en: |
          A /28 subnet delegated to Microsoft.App/environments meets the size requirement for agent network injection.
        fr: |
          Un sous-réseau /28 délégué à Microsoft.App/environments satisfait l'exigence de taille pour l'injection réseau des agents.
    - id: s3
      text:
        en: |
          Only a private endpoint connection in the Approved state can send traffic to the Foundry resource.
        fr: |
          Seule une connexion de point de terminaison privé à l'état Approved peut envoyer du trafic à la ressource Foundry.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      Private endpoints for Azure AI Search, Storage and Azure Cosmos DB aren't created automatically with the Foundry resource; you create each of them separately. Agent network injection requires a subnet delegated to Microsoft.App/environments with a size of /27 or larger, so /28 is too small; outbound injection must also be chosen at deployment because it can't be added later. Only private endpoints in the Approved state can send traffic to a private-link resource.
    fr: |
      Les points de terminaison privés d'Azure AI Search, du Stockage et d'Azure Cosmos DB ne sont pas créés automatiquement avec la ressource Foundry ; vous créez chacun d'eux séparément. L'injection réseau des agents exige un sous-réseau délégué à Microsoft.App/environments d'une taille de /27 ou plus : un /28 est trop petit ; l'injection sortante doit aussi être choisie au déploiement, car elle ne peut pas être ajoutée ensuite. Seuls les points de terminaison privés à l'état Approved peuvent envoyer du trafic à une ressource de liaison privée.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
