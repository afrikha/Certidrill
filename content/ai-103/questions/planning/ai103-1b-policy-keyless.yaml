id: ai103-1b-policy-keyless
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has 14 subscriptions in a management group named **mg-ai**. Teams create Microsoft Foundry resources in these subscriptions on their own. The security team requires that every Foundry resource, including resources created in the future, has key access disabled, and that noncompliant resources are reported centrally.

    What should you do?
  fr: |
    Contoso dispose de 14 abonnements dans un groupe d'administration nommé **mg-ai**. Les équipes créent elles-mêmes des ressources Microsoft Foundry dans ces abonnements. L'équipe sécurité exige que l'accès par clé soit désactivé sur toutes les ressources Foundry, y compris celles qui seront créées à l'avenir, et que les ressources non conformes soient signalées de façon centralisée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Run a script that sets disableLocalAuth to true on each existing Foundry resource of the 14 subscriptions.", fr: "Exécuter un script qui définit disableLocalAuth sur true sur chaque ressource Foundry existante des 14 abonnements." } }
    - { id: b, text: { en: "Assign the built-in policy Azure AI Services resources should have key access disabled (disable local authentication) to mg-ai.", fr: "Attribuer la stratégie intégrée Azure AI Services resources should have key access disabled (disable local authentication) à mg-ai." } }
    - { id: c, text: { en: "Store the keys of every Foundry resource in Azure Key Vault and rotate them automatically every 30 days.", fr: "Stocker les clés de chaque ressource Foundry dans Azure Key Vault et les renouveler automatiquement tous les 30 jours." } }
    - { id: d, text: { en: "Assign the Foundry User role to every developer at the scope of mg-ai.", fr: "Attribuer le rôle Foundry User à chaque développeur à l'étendue de mg-ai." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The built-in Azure Policy definition *Azure AI Services resources should have key access disabled (disable local authentication)* enforces key-less access across a group of resources and reports compliance. Assigned to the management group, it covers the existing and future resources of all 14 subscriptions.
    fr: |
      La définition Azure Policy intégrée *Azure AI Services resources should have key access disabled (disable local authentication)* impose l'accès sans clé sur un ensemble de ressources et en signale la conformité. Attribuée au groupe d'administration, elle couvre les ressources existantes et futures des 14 abonnements.
  options:
    a:
      en: |
        A script fixes today's resources but doesn't cover resources created later or report compliance centrally.
      fr: |
        Un script corrige les ressources actuelles, mais ne couvre pas celles créées plus tard et ne signale pas la conformité de façon centralisée.
    c:
      en: |
        Storing and rotating keys still allows key access, which the requirement forbids.
      fr: |
        Stocker et renouveler les clés laisse l'accès par clé possible, ce que l'exigence interdit.
    d:
      en: |
        Granting roles enables Microsoft Entra authentication but doesn't disable keys, and a role at that scope is too broad.
      fr: |
        Accorder des rôles permet l'authentification Microsoft Entra, mais ne désactive pas les clés, et un rôle à cette étendue est trop large.
references:
  - title: Disable local authentication in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
