id: ai103-1a-network-injection-order
objective: "1.2.1"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Adatum plans a new Foundry resource for prompt agents and hosted agents. All agent traffic must go through a customer-managed virtual network, and agent data must be stored in a standard agent setup. The Azure Cosmos DB, Azure Storage and Azure AI Search resources already exist and already have private endpoints.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum prévoit une nouvelle ressource Foundry pour des agents d'invite et des agents hébergés. Tout le trafic des agents doit passer par un réseau virtuel géré par le client, et les données des agents doivent être stockées dans une configuration d'agent standard. Les ressources Azure Cosmos DB, Stockage Azure et Azure AI Search existent déjà et disposent déjà de points de terminaison privés.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: vnet, text: { en: "Create a virtual network with a /24 subnet delegated to `Microsoft.App/environments`.", fr: "Créer un réseau virtuel avec un sous-réseau /24 délégué à `Microsoft.App/environments`." } }
    - { id: acct, text: { en: "Create the Foundry resource with network injection into the delegated subnet.", fr: "Créer la ressource Foundry avec l'injection réseau dans le sous-réseau délégué." } }
    - { id: proj, text: { en: "Create the project with capability settings that reference the Cosmos DB, Storage and AI Search resources.", fr: "Créer le projet avec des paramètres de capacité qui référencent les ressources Cosmos DB, Stockage et AI Search." } }
    - { id: later, text: { en: "Create the Foundry resource without network injection, and add the injection after the first hosted agent is deployed.", fr: "Créer la ressource Foundry sans injection réseau, puis ajouter l'injection après le déploiement du premier agent hébergé." } }
    - { id: switch, text: { en: "Create the project with the basic agent setup, then change its capability settings to the existing resources.", fr: "Créer le projet avec la configuration d'agent de base, puis modifier ses paramètres de capacité pour utiliser les ressources existantes." } }
    - { id: web, text: { en: "Delegate the agent subnet to `Microsoft.Web/serverFarms`.", fr: "Déléguer le sous-réseau des agents à `Microsoft.Web/serverFarms`." } }
answer:
  sequence: [ vnet, acct, proj ]
explanation:
  correct:
    en: |
      The injection subnet must exist and be delegated to `Microsoft.App/environments` before the Foundry resource can inject into it, and network injection for hosted agents must be included when the Foundry account is first created. The project then declares, in its capability settings, the resources that hold agent state, files and vectors.
    fr: |
      Le sous-réseau d'injection doit exister et être délégué à `Microsoft.App/environments` avant que la ressource Foundry puisse s'y injecter, et l'injection réseau des agents hébergés doit être incluse dès la création du compte Foundry. Le projet déclare ensuite, dans ses paramètres de capacité, les ressources qui contiennent l'état, les fichiers et les vecteurs des agents.
  options:
    later:
      en: Adding network injection for hosted agents after the account is created isn't supported.
      fr: L'ajout de l'injection réseau des agents hébergés après la création du compte n'est pas pris en charge.
    switch:
      en: You can't update capability settings on an existing project; you would have to delete and recreate it.
      fr: Les paramètres de capacité d'un projet existant ne peuvent pas être modifiés ; il faudrait le supprimer et le recréer.
    web:
      en: Agent injection requires a subnet delegated to `Microsoft.App/environments`.
      fr: L'injection des agents nécessite un sous-réseau délégué à `Microsoft.App/environments`.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/virtual-networks
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/standard-agent-setup
