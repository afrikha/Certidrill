id: ai103-cs1b-deployment-types
objective: "1.2.2"
type: dragdrop
caseStudy: ai103-cs1b-alpineski
difficulty: 2
status: draft
stem:
  en: |
    You need to choose a deployment type for each workload. The solution must meet the data residency and workload requirements.

    Which deployment type should you use for each workload? To answer, drag the appropriate deployment types to the correct workloads. Each deployment type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez choisir un type de déploiement pour chaque charge de travail. La solution doit satisfaire les exigences de résidence des données et de charges de travail.

    Quel type de déploiement devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les types de déploiement appropriés vers les charges de travail correspondantes. Chaque type de déploiement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: gstd, text: Global Standard }
    - { id: gprov, text: Global Provisioned }
    - { id: gbatch, text: Global Batch }
    - { id: dzstd, text: Data Zone Standard }
    - { id: dzprov, text: Data Zone Provisioned }
    - { id: dzbatch, text: Data Zone Batch }
  targets:
    - id: concierge
      text: { en: "Model used by concierge-agent", fr: "Modèle utilisé par concierge-agent" }
    - id: reviews
      text: { en: "Monthly summarization of the guest reviews", fr: "Synthèse mensuelle des avis des clients" }
    - id: staff
      text: { en: "Internal assistant", fr: "Assistant interne" }
answer:
  mapping: { concierge: dzprov, reviews: dzbatch, staff: dzstd }
explanation:
  correct:
    en: |
      Data Zone deployment types process prompts and responses only within the data zone, and the EU data zone follows the EU Data Boundary, so the Global types are excluded. Data Zone Provisioned reserves throughput for a high, constant volume with predictable latency. Data Zone Batch processes asynchronous jobs at a 50% discount with a 24-hour target turnaround. Data Zone Standard is billed per token and suits low, bursty traffic.
    fr: |
      Les types de déploiement Data Zone traitent les invites et les réponses uniquement au sein de la zone de données, et la zone de données UE suit l'EU Data Boundary : les types Global sont donc exclus. Data Zone Provisioned réserve du débit pour un volume élevé et constant avec une latence prévisible. Data Zone Batch traite des travaux asynchrones avec une remise de 50 % et un délai cible de 24 heures. Data Zone Standard est facturé au jeton et convient à un trafic faible et irrégulier.
  options:
    gstd:
      en: |
        Global types can process data in any Azure region, which breaks the data residency requirement.
      fr: |
        Les types Global peuvent traiter les données dans n'importe quelle région Azure, ce qui enfreint l'exigence de résidence des données.
    gprov:
      en: |
        Global Provisioned gives predictable latency but can process data in any Azure region.
      fr: |
        Global Provisioned offre une latence prévisible, mais peut traiter les données dans n'importe quelle région Azure.
    gbatch:
      en: |
        Global Batch has the same discount as Data Zone Batch but can process data in any Azure region.
      fr: |
        Global Batch offre la même remise que Data Zone Batch, mais peut traiter les données dans n'importe quelle région Azure.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
