id: ai103-1a-indexing-methods
objective: "1.1.3"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing the ingestion of two content sources into Azure AI Search for a RAG solution. The following table lists the options that the team is considering.

    Answer each prompt by selecting the option that meets the requirement.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit l'ingestion de deux sources de contenu dans Azure AI Search pour une solution RAG. Le tableau suivant liste les options étudiées par l'équipe.

    Répondez à chaque consigne en sélectionnant l'option qui répond à l'exigence.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A partner's on-premises system, which no indexer supports, produces preprocessed JSON records that must be added to the index", fr: "Le système local d'un partenaire, qu'aucun indexeur ne prend en charge, produit des enregistrements JSON prétraités qui doivent être ajoutés à l'index" }
    - id: p2
      text: { en: "The text of scanned forms stored as images in Blob Storage must be searchable by keyword", fr: "Le texte de formulaires numérisés stockés sous forme d'images dans Stockage Blob doit pouvoir être recherché par mots clés" }
  grid:
    header: [{ en: "Option", fr: "Option" }, { en: "Stage", fr: "Étape" }]
    rows:
      - [{ text: { en: "Indexer (pull model)", fr: "Indexeur (modèle d'extraction)" }, area: indexer }, { text: { en: "Indexing", fr: "Indexation" } }]
      - [{ text: { en: "Push API", fr: "API push" }, area: push }, { text: { en: "Indexing", fr: "Indexation" } }]
      - [{ text: { en: "OCR skill in a skillset", fr: "Compétence OCR dans un ensemble de compétences" }, area: ocr }, { text: { en: "Indexing", fr: "Indexation" } }]
      - [{ text: { en: "Integrated vectorization", fr: "Vectorisation intégrée" }, area: vector }, { text: { en: "Indexing and query", fr: "Indexation et requête" } }]
      - [{ text: { en: "Semantic ranker", fr: "Classeur sémantique" }, area: semantic }, { text: { en: "Query", fr: "Requête" } }]
answer:
  values: { p1: push, p2: ocr }
explanation:
  correct:
    en: Indexers pull from supported Azure data sources; content that is preprocessed elsewhere or comes from an unsupported source is sent with the push API. To make text in images searchable, a skillset runs the OCR skill during indexing so the extracted text lands in a searchable field.
    fr: "Les indexeurs extraient le contenu de sources de données Azure prises en charge ; le contenu prétraité ailleurs ou issu d'une source non prise en charge est envoyé avec l'API push. Pour rendre le texte des images recherchable, un ensemble de compétences exécute la compétence OCR pendant l'indexation : le texte extrait est placé dans un champ recherchable."
  options:
    indexer:
      en: An indexer can't connect to a source that no indexer supports, and on its own it doesn't extract text from images.
      fr: Un indexeur ne peut pas se connecter à une source qu'aucun indexeur ne prend en charge, et à lui seul il n'extrait pas le texte des images.
    vector:
      en: Integrated vectorization creates embeddings for vector queries; it doesn't make image text searchable by keyword.
      fr: La vectorisation intégrée crée des incorporations pour les requêtes vectorielles ; elle ne rend pas le texte des images recherchable par mots clés.
references:
  - title: Retrieval-augmented generation (RAG) in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview
