id: ai103-1c-agent-identity-forbidden
objective: "1.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. creates a prompt agent named **docs-agent** in Foundry Agent Service. docs-agent calls an internal MCP server that reads blobs from a storage account named **stdocs**. The project connection to the MCP server uses agent identity authentication, so Agent Service passes a token of the agent identity of docs-agent with the audience of Azure Storage.

    Every read fails with HTTP 403 from stdocs. The project managed identity already has the Storage Blob Data Reader role on stdocs.

    You need docs-agent to read the blobs. The solution must follow the principle of least privilege. What should you do?
  fr: |
    Contoso, Ltd. crée un agent d'invite nommé **docs-agent** dans Foundry Agent Service. docs-agent appelle un serveur MCP interne qui lit des objets blob dans un compte de stockage nommé **stdocs**. La connexion de projet au serveur MCP utilise l'authentification par identité d'agent : Agent Service transmet un jeton de l'identité d'agent de docs-agent avec l'audience de Stockage Azure.

    Chaque lecture échoue avec HTTP 403 renvoyé par stdocs. L'identité managée du projet dispose déjà du rôle Storage Blob Data Reader sur stdocs.

    docs-agent doit pouvoir lire les objets blob. La solution doit respecter le principe du moindre privilège. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign Storage Blob Data Reader on stdocs to the agent identity of docs-agent.", fr: "Attribuer Storage Blob Data Reader sur stdocs à l'identité d'agent de docs-agent." }
    - id: b
      text: { en: "Assign Storage Blob Data Reader on the subscription to the agent identity of docs-agent.", fr: "Attribuer Storage Blob Data Reader sur l'abonnement à l'identité d'agent de docs-agent." }
    - id: c
      text: { en: "Assign Foundry User on the project to the agent identity of docs-agent.", fr: "Attribuer Foundry User sur le projet à l'identité d'agent de docs-agent." }
    - id: d
      text: { en: "Assign Storage Blob Data Contributor on stdocs to the project managed identity.", fr: "Attribuer Storage Blob Data Contributor sur stdocs à l'identité managée du projet." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A new agent identity starts with no permissions, and Foundry doesn't assign roles to it. The target resource checks the role assignments of the identity in the token, here the agent identity, so you assign the data-plane role to that identity at the narrowest scope that works: the storage account.
    fr: |
      Une nouvelle identité d'agent ne dispose d'aucune autorisation, et Foundry ne lui attribue aucun rôle. La ressource cible vérifie les attributions de rôle de l'identité présente dans le jeton, ici l'identité d'agent : vous attribuez donc le rôle de plan de données à cette identité, à l'étendue la plus restreinte qui fonctionne, le compte de stockage.
  options:
    b:
      en: |
        A subscription-wide assignment would work but grants access to every storage account, which breaks least privilege.
      fr: |
        Une attribution à l'échelle de l'abonnement fonctionnerait, mais elle donne accès à tous les comptes de stockage, ce qui ne respecte pas le moindre privilège.
    c:
      en: |
        A Foundry role on the project grants no access to the data in stdocs.
      fr: |
        Un rôle Foundry sur le projet n'accorde aucun accès aux données de stdocs.
    d:
      en: |
        The token comes from the agent identity, not from the project managed identity, so roles of the project identity aren't checked; Contributor also grants write access.
      fr: |
        Le jeton provient de l'identité d'agent, pas de l'identité managée du projet : les rôles de l'identité du projet ne sont pas vérifiés ; Contributor accorde en outre l'accès en écriture.
references:
  - title: Agent identity concepts in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/agent-identity
