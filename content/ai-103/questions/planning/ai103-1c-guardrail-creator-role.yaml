id: ai103-1c-guardrail-creator-role
objective: "1.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a Microsoft Foundry resource named **foundry-contoso** that contains a project with several model deployments. A safety engineer named User1 must create custom guardrails in the Foundry portal and assign them to the deployments.

    You need to grant User1 a role on foundry-contoso. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Contoso, Ltd. dispose d'une ressource Microsoft Foundry nommée **foundry-contoso** qui contient un projet doté de plusieurs déploiements de modèles. Un ingénieur sécurité nommé User1 doit créer des garde-fous personnalisés dans le portail Foundry et les attribuer aux déploiements.

    Vous devez attribuer un rôle à User1 sur foundry-contoso. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Foundry User }
    - { id: b, text: Reader }
    - { id: c, text: Log Analytics Reader }
    - { id: d, text: Foundry Account Owner }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Creating guardrails requires the Foundry Account Owner role or higher on the Foundry resource. Foundry Account Owner is the least privileged role that meets the requirement.
    fr: |
      La création de garde-fous exige le rôle Foundry Account Owner ou un rôle supérieur sur la ressource Foundry. Foundry Account Owner est le rôle le moins privilégié qui répond à l'exigence.
  options:
    a:
      en: Foundry User is a lower-privileged role than Foundry Account Owner, the minimum role that the guardrail creation steps require.
      fr: Foundry User est un rôle moins privilégié que Foundry Account Owner, le rôle minimal qu'exige la création de garde-fous.
    b:
      en: Reader only lets User1 view the resource.
      fr: Reader permet seulement à User1 de consulter la ressource.
    c:
      en: Log Analytics Reader lets a user read monitoring data such as traces; it grants no permission on guardrails.
      fr: Log Analytics Reader permet de lire des données de surveillance comme les traces ; il n'accorde aucune autorisation sur les garde-fous.
references:
  - title: How to configure guardrails and controls in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/how-to-create-guardrails
