id: ai103-1a-memory-and-knowledge
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso Manufacturing is building a maintenance agent. The agent must meet two requirements:

    - Remember the diagnostic routine that each technician repeats, so that it can suggest the next step in later sessions.
    - Answer from the curated maintenance manuals stored in SharePoint and Azure Blob Storage. The same manuals ground three other agents, and each technician must see only the manuals they are allowed to read.

    What should you use?
  fr: |
    Contoso Manufacturing crée un agent de maintenance. L'agent doit répondre à deux exigences :

    - Mémoriser la routine de diagnostic que chaque technicien répète, afin de proposer l'étape suivante lors des sessions ultérieures.
    - Répondre à partir des manuels de maintenance organisés stockés dans SharePoint et Stockage Blob Azure. Ces mêmes manuels ancrent trois autres agents, et chaque technicien ne doit voir que les manuels qu'il est autorisé à lire.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The memory search tool for the routines and for the manuals", fr: "L'outil de recherche en mémoire pour les routines et pour les manuels" } }
    - { id: b, text: { en: "The memory search tool for the routines and a Foundry IQ knowledge base for the manuals", fr: "L'outil de recherche en mémoire pour les routines et une base de connaissances Foundry IQ pour les manuels" } }
    - { id: c, text: { en: "The file search tool for the routines and for the manuals", fr: "L'outil de recherche de fichiers pour les routines et pour les manuels" } }
    - { id: d, text: { en: "The conversation history for the routines and a Foundry IQ knowledge base for the manuals", fr: "L'historique de la conversation pour les routines et une base de connaissances Foundry IQ pour les manuels" } }
answer: { optionId: b }
explanation:
  correct:
    en: Procedural memory keeps reusable routines inferred from earlier interactions and persists across sessions; the memory search tool reads and writes it. Curated organizational content belongs in a Foundry IQ knowledge base, which several agents can share and which enforces permissions at query time.
    fr: La mémoire procédurale conserve les routines réutilisables déduites des interactions précédentes et persiste d'une session à l'autre ; l'outil de recherche en mémoire la lit et l'écrit. Le contenu organisationnel organisé relève d'une base de connaissances Foundry IQ, que plusieurs agents peuvent partager et qui applique les autorisations au moment de la requête.
  options:
    a:
      en: Memory is for context learned about users over time; Learn recommends a knowledge base, not memory, for curated organizational content.
      fr: La mémoire sert au contexte appris sur les utilisateurs au fil du temps ; Learn recommande une base de connaissances, et non la mémoire, pour le contenu organisationnel organisé.
    c:
      en: File search indexes uploaded files; it neither learns routines from interactions nor connects to SharePoint with permission trimming.
      fr: La recherche de fichiers indexe des fichiers chargés ; elle n'apprend pas de routines à partir des interactions et ne se connecte pas à SharePoint avec filtrage par autorisations.
    d:
      en: The conversation history covers only the current session, so the routines would be lost in later sessions.
      fr: |
        L'historique de la conversation ne couvre que la session en cours : les routines seraient perdues lors des sessions ultérieures.
references:
  - title: Memory in Microsoft Foundry Agent Service (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
  - title: What is Foundry IQ?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-foundry-iq
