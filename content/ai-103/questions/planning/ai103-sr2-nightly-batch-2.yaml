id: ai103-sr2-nightly-batch-2
objective: "1.3.1"
type: series_yesno
series: ai103-sr2-nightly-batch
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: You create a Global Batch deployment and submit the reviews as a batch job.
  fr: Vous créez un déploiement Global Batch et soumettez les avis en tant que travail de traitement par lots.
body:
  solution:
    en: |
      You create a **Global Batch** deployment named **reviews-batch** of the same model. Each night, the job writes one JSONL line per review, with a unique `custom_id`, `"method": "POST"`, `"url": "/v1/chat/completions"` and the deployment name reviews-batch in `body.model`. The job uploads the file with `client.files.create(..., purpose="batch")`, then calls `client.batches.create(input_file_id=file_id, endpoint="/chat/completions", completion_window="24h")`.
    fr: |
      Vous créez un déploiement **Global Batch** nommé **reviews-batch** du même modèle. Chaque nuit, le travail écrit une ligne JSONL par avis, avec un `custom_id` unique, `"method": "POST"`, `"url": "/v1/chat/completions"` et le nom de déploiement reviews-batch dans `body.model`. Le travail charge le fichier avec `client.files.create(..., purpose="batch")`, puis appelle `client.batches.create(input_file_id=file_id, endpoint="/chat/completions", completion_window="24h")`.
answer: { value: true }
explanation:
  correct:
    en: Global Batch has a 24-hour target turnaround at 50 % less cost than Global Standard, which fits summaries that can wait up to 24 hours. Batch requests use a separate enqueued token quota, so they don't consume the rate limit of chat-live. A file holds up to 100,000 requests, and `custom_id` matches each summary to its review because responses aren't returned in order.
    fr: "Global Batch vise un délai de traitement de 24 heures pour un coût inférieur de 50 % à celui de Global Standard, ce qui convient à des résumés qui peuvent attendre jusqu'à 24 heures. Les requêtes de traitement par lots utilisent un quota distinct de jetons en file d'attente : elles ne consomment pas la limite de débit de chat-live. Un fichier contient jusqu'à 100 000 requêtes, et `custom_id` associe chaque résumé à son avis, car les réponses ne sont pas renvoyées dans l'ordre."
references:
  - title: How to use global batch processing with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/batch
