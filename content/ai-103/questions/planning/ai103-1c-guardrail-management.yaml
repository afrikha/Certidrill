id: ai103-1c-guardrail-management
objective: "1.4.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Foundry project that contains three text model deployments and two agents. You are planning how to manage guardrails in the project.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware, Inc. dispose d'un projet Microsoft Foundry qui contient trois déploiements de modèles de texte et deux agents. Vous planifiez la gestion des garde-fous du projet.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: You can add an Indirect attacks control to Microsoft.DefaultV2 so that every deployment that uses it detects document attacks.
        fr: Vous pouvez ajouter un contrôle Indirect attacks à Microsoft.DefaultV2 pour que chaque déploiement qui l'utilise détecte les attaques par document.
    - id: s2
      text:
        en: You can assign one custom guardrail to the three model deployments and to the two agents.
        fr: Vous pouvez attribuer un même garde-fou personnalisé aux trois déploiements de modèles et aux deux agents.
    - id: s3
      text:
        en: An application can apply another guardrail to a single text request by sending the name of that guardrail in the x-policy-id header.
        fr: Une application peut appliquer un autre garde-fou à une seule requête de texte en envoyant le nom de ce garde-fou dans l'en-tête x-policy-id.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Microsoft default guardrails can't be edited; to add a control, you create a custom guardrail and assign it. A single guardrail can be applied to one or many models and one or many agents in a project. The `x-policy-id` header overrides the deployment-level guardrail for that request only (not for requests with image input).
    fr: |
      Les garde-fous par défaut de Microsoft ne sont pas modifiables ; pour ajouter un contrôle, vous créez un garde-fou personnalisé et vous l'attribuez. Un même garde-fou peut s'appliquer à un ou plusieurs modèles et à un ou plusieurs agents d'un projet. L'en-tête `x-policy-id` remplace le garde-fou du déploiement pour cette seule requête (pas pour les requêtes avec une image en entrée).
references:
  - title: How to configure guardrails and controls in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/how-to-create-guardrails
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
