id: ai103-1a-training-videos
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Pharmaceuticals has 3,000 training videos. For each video, you need a description of every segment in Markdown, so that an agent can retrieve the right part of a video when employees ask a question. The solution must process the video and its audio in one service, and the team doesn't want to write code that extracts frames.

    What should you use?
  fr: |
    Contoso Pharmaceuticals dispose de 3 000 vidéos de formation. Pour chaque vidéo, vous avez besoin d'une description de chaque segment en Markdown, afin qu'un agent puisse récupérer le bon passage d'une vidéo quand les employés posent une question. La solution doit traiter la vidéo et son audio dans un seul service, et l'équipe ne veut pas écrire de code d'extraction des images.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Speech batch transcription of the audio track", fr: "La transcription par lots d'Azure Speech appliquée à la piste audio" } }
    - { id: b, text: { en: "Azure Vision image analysis on frames sampled from each video", fr: "L'analyse d'images d'Azure Vision sur des images extraites de chaque vidéo" } }
    - { id: c, text: { en: "A `sora-2` deployment that receives each video as reference media", fr: "Un déploiement `sora-2` qui reçoit chaque vidéo comme média de référence" } }
    - { id: d, text: { en: "An Azure Content Understanding analyzer with segmentation enabled", fr: "Un analyseur Azure Content Understanding avec la segmentation activée" } }
answer: { optionId: d }
explanation:
  correct:
    en: Content Understanding processes documents, images, audio and video into a user-defined output, including Markdown for search and retrieval. Segmentation is configured in the analyzer (`enableSegment`), so the service splits each video and describes each segment without any frame-extraction code.
    fr: |
      Content Understanding traite les documents, les images, l'audio et la vidéo pour produire une sortie définie par l'utilisateur, y compris du Markdown pour la recherche et la récupération. La segmentation se configure dans l'analyseur (`enableSegment`) : le service découpe chaque vidéo et décrit chaque segment sans code d'extraction d'images.
  options:
    a:
      en: Batch transcription returns only what is said; it ignores what the video shows.
      fr: La transcription par lots ne renvoie que ce qui est dit ; elle ignore ce que montre la vidéo.
    b:
      en: Image analysis works on images, so you would write code to sample frames, and it doesn't process the audio.
      fr: |
        L'analyse d'images porte sur des images : il faudrait écrire du code pour extraire des images, et elle ne traite pas l'audio.
    c:
      en: "`sora-2` generates videos; it doesn't describe existing ones."
      fr: "`sora-2` génère des vidéos ; il ne décrit pas des vidéos existantes."
references:
  - title: What is Azure Content Understanding in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
