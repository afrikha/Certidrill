id: ai103-1a-cosmos-throughput
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is deploying a standard agent setup for a Foundry project. The Azure Cosmos DB for NoSQL account **cosmos-agents** uses provisioned throughput with a total throughput limit of 1,000 RU/s. The deploying identity already has the required roles on the Cosmos DB account, the storage account and the search service.

    Provisioning fails, and the error indicates insufficient Cosmos DB capacity.

    What should you do?
  fr: |
    Fabrikam déploie une configuration d'agent standard pour un projet Foundry. Le compte Azure Cosmos DB for NoSQL **cosmos-agents** utilise le débit provisionné avec une limite de débit totale de 1 000 RU/s. L'identité de déploiement dispose déjà des rôles requis sur le compte Cosmos DB, le compte de stockage et le service de recherche.

    Le provisionnement échoue, et l'erreur indique une capacité Cosmos DB insuffisante.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Raise the total throughput limit of cosmos-agents to at least 3,000 RU/s", fr: "Augmenter la limite de débit totale de cosmos-agents à au moins 3 000 RU/s" } }
    - { id: b, text: { en: "Enable multi-region writes on cosmos-agents", fr: "Activer les écritures multirégions sur cosmos-agents" } }
    - { id: c, text: { en: "Assign the Cosmos DB Operator role to the developers of the project", fr: "Attribuer le rôle Cosmos DB Operator aux développeurs du projet" } }
    - { id: d, text: { en: "Replace cosmos-agents with an account that uses the API for MongoDB", fr: "Remplacer cosmos-agents par un compte qui utilise l'API pour MongoDB" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Cosmos DB for NoSQL account of a standard agent setup must have a total throughput limit of at least 3,000 RU/s, because each container that the setup provisions needs 1,000 RU/s. Insufficient RU/s makes provisioning fail.
    fr: Le compte Cosmos DB for NoSQL d'une configuration d'agent standard doit avoir une limite de débit totale d'au moins 3 000 RU/s, car chaque conteneur provisionné par la configuration nécessite 1 000 RU/s. Un nombre de RU/s insuffisant fait échouer le provisionnement.
  options:
    b:
      en: Multi-region writes add write regions; they don't raise the throughput limit that the setup checks.
      fr: Les écritures multirégions ajoutent des régions d'écriture ; elles n'augmentent pas la limite de débit vérifiée par la configuration.
    c:
      en: Developers need Foundry User on the project; the error is about capacity, and the deploying identity already has its roles.
      fr: Les développeurs ont besoin de Foundry User sur le projet ; l'erreur porte sur la capacité, et l'identité de déploiement possède déjà ses rôles.
    d:
      en: The standard setup requires Azure Cosmos DB for NoSQL, not the API for MongoDB.
      fr: La configuration standard nécessite Azure Cosmos DB for NoSQL, pas l'API pour MongoDB.
references:
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/standard-agent-setup
