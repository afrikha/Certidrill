id: ai103-1a-text-split-skill
objective: "1.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum indexes long policy documents for RAG. You add a Text Split skill to the skillset. Each chunk must be made of several sentences, contain at most 2,000 characters, and repeat the end of the previous chunk at its start so that context isn't lost at chunk boundaries.

    How should you complete the skill definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum indexe de longs documents de politique pour le RAG. Vous ajoutez une compétence Text Split à l'ensemble de compétences. Chaque segment doit être composé de plusieurs phrases, contenir au maximum 2 000 caractères et reprendre à son début la fin du segment précédent, afin que le contexte ne soit pas perdu aux limites des segments.

    Comment devez-vous compléter la définition de la compétence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "@odata.type": "#Microsoft.Skills.Text.SplitSkill",
      "name": "split-policies",
      "context": "/document",
      "textSplitMode": [[mode]],
      "maximumPageLength": 2000,
      "pageOverlapLength": [[overlap]],
      "inputs": [ { "name": "text", "source": "/document/content" } ],
      "outputs": [ { "name": "textItems", "targetName": "pages" } ]
    }
  slots:
    - id: mode
      options:
        - { id: pages, text: '"pages"' }
        - { id: sentences, text: '"sentences"' }
    - id: overlap
      options:
        - { id: o0, text: "0" }
        - { id: o500, text: "500" }
        - { id: o1000, text: "1000" }
        - { id: o1500, text: "1500" }
answer:
  values: { mode: pages, overlap: o500 }
explanation:
  correct:
    en: In `pages` mode (the default), chunks are made of multiple sentences, while `sentences` mode makes one chunk per sentence. `pageOverlapLength` sets how many characters from the end of the previous chunk start the next one, and it must be less than half of `maximumPageLength`, so 500 is the only valid overlap here. Learn suggests 2,000 and 500 as starting values.
    fr: En mode `pages` (par défaut), les segments sont composés de plusieurs phrases, alors que le mode `sentences` crée un segment par phrase. `pageOverlapLength` définit le nombre de caractères de la fin du segment précédent repris au début du suivant, et doit être inférieur à la moitié de `maximumPageLength` ; 500 est donc le seul chevauchement valide ici. Learn suggère 2 000 et 500 comme valeurs de départ.
  options:
    mode:
      en: "`sentences` produces chunks of a single sentence."
      fr: "`sentences` produit des segments d'une seule phrase."
    overlap:
      en: 0 gives no overlap, and 1000 or 1500 aren't less than half of the 2,000-character maximum.
      fr: 0 ne donne aucun chevauchement, et 1000 ou 1500 ne sont pas inférieurs à la moitié du maximum de 2 000 caractères.
references:
  - title: Chunk large documents for RAG and vector search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents
