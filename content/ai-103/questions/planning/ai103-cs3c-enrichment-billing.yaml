id: ai103-cs3c-enrichment-billing
objective: "1.3.3"
type: dropdown
caseStudy: ai103-cs3c-relecloud
difficulty: 3
status: draft
stem:
  en: |
    During a test run, the indexer of the manuals processes 20 documents. After that, the execution history of the indexer shows a "Time Out" message for the OCR skill, and no other manual is enriched that day. You need to ensure that the ingestion requirement and the network requirement are met.

    How should you complete the configuration? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Pendant un test, l'indexeur des manuels traite 20 documents. Ensuite, l'historique d'exécution de l'indexeur affiche un message « Time Out » pour la compétence OCR, et aucun autre manuel n'est enrichi ce jour-là. Vous devez vous assurer que l'exigence d'ingestion et l'exigence réseau sont satisfaites.

    Comment devez-vous compléter la configuration ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Cause of the problem: [[cause]]

      `@odata.type` of the `cognitiveServices` property of the skillset: [[type]]

      Role to assign to the managed identity of relecloud-search on relecloud-ai: [[role]]
    fr: |
      Cause du problème : [[cause]]

      `@odata.type` de la propriété `cognitiveServices` de l'ensemble de compétences : [[type]]

      Rôle à attribuer à l'identité managée de relecloud-search sur relecloud-ai : [[role]]
  slots:
    - id: cause
      options:
        - { id: a, text: { en: "The free enrichment limit of the skillset was reached", fr: "La limite d'enrichissement gratuit de l'ensemble de compétences a été atteinte" } }
        - { id: b, text: { en: "The storage limit of the Standard tier was reached", fr: "La limite de stockage du niveau Standard a été atteinte" } }
        - { id: c, text: { en: "The tokens-per-minute quota of embed-main was exhausted", fr: "Le quota de jetons par minute d'embed-main a été épuisé" } }
    - id: type
      options:
        - { id: a, text: "#Microsoft.Azure.Search.AIServicesByKey" }
        - { id: b, text: "#Microsoft.Azure.Search.AIServicesByIdentity" }
        - { id: c, text: "#Microsoft.Azure.Search.CognitiveServicesByKey" }
    - id: role
      options:
        - { id: a, text: "Foundry Agent Consumer" }
        - { id: b, text: "Search Index Data Reader" }
        - { id: c, text: "Cognitive Services User" }
answer:
  values: { cause: a, type: b, role: c }
explanation:
  correct:
    en: |
      Without an attached billable resource, billable skills such as OCR run for only 20 documents per indexer per day, then stop with a "Time Out" message in the execution history; 4,000 manuals in a week require attaching a Foundry resource of the `AIServices` kind to the skillset. To avoid keys, the skillset uses `#Microsoft.Azure.Search.AIServicesByIdentity`, and the managed identity of the search service gets the Cognitive Services User role on the Foundry resource.
    fr: |
      Sans ressource facturable attachée, les compétences facturables comme OCR ne s'exécutent que pour 20 documents par indexeur et par jour, puis s'arrêtent avec un message « Time Out » dans l'historique d'exécution ; 4 000 manuels en une semaine exigent d'attacher à l'ensemble de compétences une ressource Foundry de type `AIServices`. Pour éviter les clés, l'ensemble de compétences utilise `#Microsoft.Azure.Search.AIServicesByIdentity`, et l'identité managée du service de recherche reçoit le rôle Cognitive Services User sur la ressource Foundry.
  options:
    cause:
      en: |
        The storage of the index is not involved in skill execution, and embed-main is not called by the OCR skill.
      fr: |
        Le stockage de l'index n'intervient pas dans l'exécution des compétences, et embed-main n'est pas appelé par la compétence OCR.
    type:
      en: |
        The two `ByKey` types authenticate with a resource key, which breaks the network requirement.
      fr: |
        Les deux types `ByKey` s'authentifient avec une clé de ressource, ce qui enfreint l'exigence réseau.
    role:
      en: |
        Foundry Agent Consumer only allows calls to agent endpoints, and Search Index Data Reader is a role on a search service, not on a Foundry resource.
      fr: |
        Foundry Agent Consumer permet seulement d'appeler des points de terminaison d'agents, et Search Index Data Reader est un rôle sur un service de recherche, pas sur une ressource Foundry.
references:
  - title: Attach a billable resource to a skillset in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services
