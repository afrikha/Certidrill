id: ai103-1a-model-task-map
objective: "1.1.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is designing four AI features in a Foundry project. Each feature must use a model that is designed for its task.

    Which model should you deploy for each feature? To answer, drag the appropriate models to the correct features. Each model may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conçoit quatre fonctionnalités d'IA dans un projet Foundry. Chaque fonctionnalité doit utiliser un modèle conçu pour sa tâche.

    Quel modèle devez-vous déployer pour chaque fonctionnalité ? Pour répondre, faites glisser les modèles appropriés vers les fonctionnalités correspondantes. Chaque modèle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: emb, text: text-embedding-3-large }
    - { id: gpt41, text: gpt-4.1 }
    - { id: rt, text: gpt-realtime }
    - { id: img, text: gpt-image-2 }
    - { id: sora, text: sora-2 }
    - { id: whisper, text: whisper }
  targets:
    - id: vectors
      text: { en: "Represent the product manuals as vectors for semantic retrieval", fr: "Représenter les manuels produits sous forme de vecteurs pour la récupération sémantique" }
    - id: photos
      text: { en: "Answer questions about photos of damaged parcels sent by customers", fr: "Répondre aux questions sur les photos de colis endommagés envoyées par les clients" }
    - id: voice
      text: { en: "Hold a low-latency spoken conversation with callers", fr: "Tenir une conversation vocale à faible latence avec les appelants" }
    - id: visuals
      text: { en: "Create still marketing visuals from a text description", fr: "Créer des visuels marketing fixes à partir d'une description textuelle" }
answer:
  mapping: { vectors: emb, photos: gpt41, voice: rt, visuals: img }
explanation:
  correct:
    en: |
      `text-embedding-3-large` turns text into vectors and generates no text, which is what vector retrieval needs. `gpt-4.1` accepts text and image input, so it can answer questions about a photo. `gpt-realtime` is the realtime audio model for low-latency speech conversations. `gpt-image-2` generates images from a prompt.
    fr: |
      `text-embedding-3-large` transforme le texte en vecteurs et ne génère pas de texte : c'est ce dont la récupération vectorielle a besoin. `gpt-4.1` accepte du texte et des images en entrée : il peut répondre à des questions sur une photo. `gpt-realtime` est le modèle audio en temps réel pour les conversations vocales à faible latence. `gpt-image-2` génère des images à partir d'une invite.
  options:
    sora:
      en: "`sora-2` (preview) generates video from text, not still images."
      fr: "`sora-2` (préversion) génère de la vidéo à partir de texte, pas des images fixes."
    whisper:
      en: "`whisper` transcribes speech to text; it doesn't hold a spoken conversation."
      fr: "`whisper` transcrit la parole en texte ; il ne tient pas de conversation vocale."
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
