id: ai103-1c-trace-sensitive-data
objective: "1.4.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys sends the traces of its production agents to the Application Insights resource connected to its Microsoft Foundry project. A privacy review finds that traces could expose customers' personal data from conversations and custom spans.

    You need to reduce the personal data that reaches the traces.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys envoie les traces de ses agents de production à la ressource Application Insights connectée à son projet Microsoft Foundry. Une revue de confidentialité constate que les traces pourraient exposer des données personnelles de clients issues des conversations et de spans personnalisés.

    Vous devez réduire les données personnelles qui parviennent aux traces.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Keep OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT set to false in production.", fr: "Laisser OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT à false en production." }
    - id: b
      text: { en: "Set AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA to true.", fr: "Définir AZURE_TRACING_GEN_AI_INCLUDE_BINARY_DATA sur true." }
    - id: c
      text: { en: "Redact or minimize personal data before the application writes it to span attributes.", fr: "Masquer ou réduire les données personnelles avant que l'application les écrive dans des attributs de span." }
    - id: d
      text: { en: "Set AZURE_TRACING_GEN_AI_ENABLE_TRACE_CONTEXT_PROPAGATION to false.", fr: "Définir AZURE_TRACING_GEN_AI_ENABLE_TRACE_CONTEXT_PROPAGATION sur false." }
    - id: e
      text: { en: "Assign Log Analytics Reader on the Application Insights resource to all developers.", fr: "Attribuer Log Analytics Reader sur la ressource Application Insights à tous les développeurs." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Content recording, which captures message contents and tool call parameters, is off when the capture variable is false, and the guidance is to enable it in development only. Data that the application adds to its own spans must be redacted or minimized before it reaches telemetry.
    fr: |
      L'enregistrement du contenu, qui capture le contenu des messages et les paramètres des appels d'outils, est désactivé quand la variable de capture vaut false, et l'aide recommande de ne l'activer qu'en développement. Les données que l'application ajoute à ses propres spans doivent être masquées ou réduites avant d'atteindre la télémétrie.
  options:
    b:
      en: |
        Including binary data adds image and file contents to the traces instead of file IDs, which increases exposure.
      fr: |
        Inclure les données binaires ajoute le contenu des images et des fichiers aux traces au lieu des ID de fichier, ce qui augmente l'exposition.
    d:
      en: |
        Trace context propagation only adds W3C traceparent and tracestate headers to correlate calls; disabling it doesn't remove personal data.
      fr: |
        La propagation du contexte de trace ajoute seulement les en-têtes W3C traceparent et tracestate pour corréler les appels ; la désactiver ne supprime aucune donnée personnelle.
    e:
      en: |
        Granting more people read access widens the exposure of the traces instead of reducing the data they contain.
      fr: |
        Accorder la lecture à davantage de personnes élargit l'exposition des traces au lieu de réduire les données qu'elles contiennent.
references:
  - title: Agent tracing overview
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/observability/concepts/trace-agent-concept
  - title: Add client-side tracing to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
