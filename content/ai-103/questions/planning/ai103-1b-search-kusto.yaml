id: ai103-1b-search-kusto
objective: "1.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure AI Search service that serves the retrieval tool of a Foundry agent. A diagnostic setting sends the service's resource logs to a Log Analytics workspace.

    You need a query that returns the average duration of search queries for each index and each hour, to find which index slows down the agent.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un service Azure AI Search qui sert l'outil de récupération d'un agent Foundry. Un paramètre de diagnostic envoie les journaux de ressource du service vers un espace de travail Log Analytics.

    Vous avez besoin d'une requête qui renvoie la durée moyenne des requêtes de recherche par index et par heure, pour trouver l'index qui ralentit l'agent.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where OperationName == "Query.Search"
    | summarize avg([[col]]) by IndexName_s, bin(TimeGenerated, 1h)
    | order by TimeGenerated desc
  slots:
    - id: table
      options:
        - { id: diag, text: AzureDiagnostics }
        - { id: metrics, text: AzureMetrics }
        - { id: activity, text: AzureActivity }
        - { id: apptraces, text: AppTraces }
    - id: col
      options:
        - { id: duration, text: DurationMs }
        - { id: docs, text: Documents_d }
        - { id: result, text: resultSignature_d }
answer:
  values: { table: diag, col: duration }
explanation:
  correct:
    en: |
      With resource logging enabled, Azure AI Search records query and indexing operations in the `AzureDiagnostics` table, where each `Query.Search` row carries the index name (`IndexName_s`) and the duration of the operation (`DurationMs`).
    fr: |
      Lorsque la journalisation des ressources est activée, Azure AI Search enregistre les opérations de requête et d'indexation dans la table `AzureDiagnostics`, où chaque ligne `Query.Search` contient le nom de l'index (`IndexName_s`) et la durée de l'opération (`DurationMs`).
  options:
    metrics: { en: "AzureMetrics holds aggregated platform metrics, without per-query operations or index names.", fr: "AzureMetrics contient des métriques de plateforme agrégées, sans opérations par requête ni noms d'index." }
    activity: { en: "AzureActivity holds control-plane operations such as configuration changes.", fr: "AzureActivity contient les opérations du plan de contrôle, comme les modifications de configuration." }
    apptraces: { en: "AppTraces holds application telemetry from Application Insights, not search resource logs.", fr: "AppTraces contient la télémétrie d'application d'Application Insights, pas les journaux de ressource de la recherche." }
    docs: { en: "Documents_d is the number of documents returned by the query.", fr: "Documents_d est le nombre de documents renvoyés par la requête." }
    result: { en: "resultSignature_d is the HTTP status of the operation.", fr: "resultSignature_d est le statut HTTP de l'opération." }
references:
  - title: Monitor query requests in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-monitor-queries
  - title: Azure AI Search monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/search/monitor-azure-cognitive-search-data-reference
