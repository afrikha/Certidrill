id: ai103-1a-resource-project-scope
objective: "1.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has a Foundry resource named **fab-ai** that contains two projects named **sales-prj** and **hr-prj**. Model deployments and connections are created on fab-ai.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'une ressource Foundry nommée **fab-ai** qui contient deux projets nommés **sales-prj** et **hr-prj**. Les déploiements de modèles et les connexions sont créés sur fab-ai.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Agents in sales-prj and hr-prj can use the model deployments of fab-ai without a separate deployment per project.
        fr: Les agents de sales-prj et de hr-prj peuvent utiliser les déploiements de modèles de fab-ai sans déploiement distinct par projet.
    - id: s2
      text:
        en: An application can call the Translator API through the endpoint of sales-prj.
        fr: Une application peut appeler l'API Translator par le point de terminaison de sales-prj.
    - id: s3
      text:
        en: The files, agents and evaluations created in hr-prj are also available in sales-prj.
        fr: Les fichiers, les agents et les évaluations créés dans hr-prj sont aussi disponibles dans sales-prj.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Projects are development boundaries inside the Foundry resource, and teams reuse the resource's model deployments and connections without repeated setup. Project assets such as files, agents and evaluations are scoped to their project. Some APIs exist only at the Foundry resource level: Learn gives the Translator API as the example.
    fr: |
      Les projets sont des limites de développement au sein de la ressource Foundry, et les équipes réutilisent les déploiements de modèles et les connexions de la ressource sans configuration répétée. Les ressources d'un projet, comme les fichiers, les agents et les évaluations, sont limitées à ce projet. Certaines API n'existent qu'au niveau de la ressource Foundry : Learn cite l'API Translator en exemple.
references:
  - title: Microsoft Foundry architecture
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture
