id: ai103-1b-uami-python
objective: "1.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs a Python service in Azure Container Apps. The container app has no system-assigned identity and two user-assigned managed identities: **uami-orders**, which has the Foundry User role on a Foundry project named **orders**, and **uami-logs**, which is used for another purpose. Key access is disabled on the Foundry resource **woodgrove-ai**.

    The service must authenticate to the orders project as uami-orders and must never pick up another credential by accident.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank exécute un service Python dans Azure Container Apps. L'application conteneur n'a pas d'identité affectée par le système et dispose de deux identités managées affectées par l'utilisateur : **uami-orders**, qui a le rôle Foundry User sur un projet Foundry nommé **orders**, et **uami-logs**, utilisée à une autre fin. L'accès par clé est désactivé sur la ressource Foundry **woodgrove-ai**.

    Le service doit s'authentifier auprès du projet orders en tant qu'uami-orders et ne doit jamais utiliser par erreur d'autres informations d'identification.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from azure.identity import DefaultAzureCredential, ManagedIdentityCredential
    from azure.core.credentials import AzureKeyCredential
    from azure.ai.projects import AIProjectClient

    credential = [[cred]]

    project = AIProjectClient(
        endpoint=[[ep]],
        credential=credential,
    )
  slots:
    - id: cred
      options:
        - { id: miclient, text: "ManagedIdentityCredential(client_id=\"<client ID of uami-orders>\")" }
        - { id: mi, text: "ManagedIdentityCredential()" }
        - { id: dac, text: "DefaultAzureCredential()" }
        - { id: key, text: "AzureKeyCredential(os.environ[\"FOUNDRY_KEY\"])" }
    - id: ep
      options:
        - { id: project, text: "\"https://woodgrove-ai.services.ai.azure.com/api/projects/orders\"" }
        - { id: openai, text: "\"https://woodgrove-ai.openai.azure.com/\"" }
        - { id: arm, text: "\"https://management.azure.com/\"" }
answer:
  values: { cred: miclient, ep: project }
explanation:
  correct:
    en: |
      When an app runs in Azure, Microsoft recommends `ManagedIdentityCredential`, because naming the exact credential type prevents other available credentials from being picked up. With several user-assigned identities, you select one by its client ID. `AIProjectClient` takes the project endpoint, in the format `https://<resource>.services.ai.azure.com/api/projects/<project>`.
    fr: |
      Lorsqu'une application s'exécute dans Azure, Microsoft recommande `ManagedIdentityCredential`, car nommer le type exact d'informations d'identification empêche d'en utiliser d'autres par inadvertance. Avec plusieurs identités affectées par l'utilisateur, vous en choisissez une par son ID client. `AIProjectClient` prend le point de terminaison du projet, au format `https://<ressource>.services.ai.azure.com/api/projects/<projet>`.
  options:
    mi: { en: "Without a client ID, the credential looks for a system-assigned identity, which the app doesn't have.", fr: "Sans ID client, les informations d'identification cherchent une identité affectée par le système, que l'application n'a pas." }
    dac: { en: "DefaultAzureCredential tries a chain of credentials, which the requirement rules out.", fr: "DefaultAzureCredential essaie une chaîne d'informations d'identification, ce que l'exigence exclut." }
    key: { en: "Key access is disabled, and a key isn't a managed identity.", fr: "L'accès par clé est désactivé, et une clé n'est pas une identité managée." }
    openai: { en: "This is an Azure OpenAI endpoint, not the endpoint of the orders project.", fr: "Il s'agit d'un point de terminaison Azure OpenAI, pas de celui du projet orders." }
    arm: { en: "This is the Azure Resource Manager endpoint, for control-plane operations.", fr: "Il s'agit du point de terminaison Azure Resource Manager, pour les opérations du plan de contrôle." }
references:
  - title: Authenticate Azure-hosted Python apps to Azure resources using a user-assigned managed identity
    url: https://learn.microsoft.com/en-us/azure/developer/python/sdk/authentication/user-assigned-managed-identity
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
