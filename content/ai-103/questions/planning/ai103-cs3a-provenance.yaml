id: ai103-cs3a-provenance
objective: "1.4.3"
type: single
caseStudy: ai103-cs3a-lucerne
difficulty: 1
status: draft
stem:
  en: |
    You need to meet the provenance requirement for the illustrations that image-gen produces. What should you do?
  fr: |
    Vous devez satisfaire l'exigence de provenance pour les illustrations produites par image-gen. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Add code to studio-app that writes an AI-generated flag into the EXIF metadata of each image"
        fr: "Ajouter à studio-app du code qui écrit un indicateur « généré par IA » dans les métadonnées EXIF de chaque image"
    - id: b
      text:
        en: "Add code to studio-app that stamps a visible AI-generated label in a corner of each image"
        fr: "Ajouter à studio-app du code qui appose une mention visible « généré par IA » dans un coin de chaque image"
    - id: c
      text:
        en: "Rely on the Content Credentials manifest that the service attaches to each generated image"
        fr: "S'appuyer sur le manifeste Content Credentials que le service joint à chaque image générée"
    - id: d
      text:
        en: "Enable annotations in the guardrail of image-gen and store them with each image"
        fr: "Activer les annotations dans le garde-fou d'image-gen et les stocker avec chaque image"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Images generated by GPT-Image series models in Azure OpenAI automatically carry Content Credentials, based on the C2PA specification. The manifest states that the image is AI generated and is cryptographically signed by a certificate that traces back to Azure OpenAI, which makes it tamper-evident. No setup or code is needed.
    fr: |
      Les images générées par les modèles de la série GPT-Image dans Azure OpenAI portent automatiquement des Content Credentials, basés sur la spécification C2PA. Le manifeste indique que l'image est générée par IA et il est signé par un certificat rattaché à Azure OpenAI, ce qui le rend infalsifiable. Aucune configuration ni aucun code n'est nécessaire.
  options:
    a:
      en: |
        Custom EXIF fields are not signed, so anyone can change or remove them; this also adds development effort.
      fr: |
        Les champs EXIF personnalisés ne sont pas signés : n'importe qui peut les modifier ou les supprimer, et cela ajoute un effort de développement.
    b:
      en: |
        A visible label is not tamper-evident metadata and can be cropped; it also requires custom image processing code.
      fr: |
        Une mention visible n'est pas une métadonnée infalsifiable et peut être rognée ; elle exige aussi du code de traitement d'images.
    d:
      en: |
        Guardrail annotations describe the harm categories that were detected in a request; they do not travel with the image or prove its origin.
      fr: |
        Les annotations d'un garde-fou décrivent les catégories de préjudice détectées dans une requête ; elles ne suivent pas l'image et ne prouvent pas son origine.
references:
  - title: Content Credentials (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials
