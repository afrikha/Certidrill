id: ai103-1a-hybrid-pipeline-order
objective: "1.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    A RAG application of Tailspin Toys sends a hybrid query with `"queryType": "semantic"` to an Azure AI Search index. The request contains a `search` string and one vector query.

    In which order does Azure AI Search process the request? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une application RAG de Tailspin Toys envoie une requête hybride avec `"queryType": "semantic"` à un index Azure AI Search. La requête contient une chaîne `search` et une requête vectorielle.

    Dans quel ordre Azure AI Search traite-t-il la requête ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: parallel, text: { en: "Run the full-text query and the vector query in parallel.", fr: "Exécuter la requête en texte intégral et la requête vectorielle en parallèle." } }
    - { id: rrf, text: { en: "Merge the two result sets by using Reciprocal Rank Fusion (RRF).", fr: "Fusionner les deux jeux de résultats à l'aide de la fusion par rang réciproque (RRF)." } }
    - { id: rerank, text: { en: "Rerank the top 50 merged results with the semantic ranker.", fr: "Réordonner les 50 premiers résultats fusionnés avec le classeur sémantique." } }
    - { id: rerun, text: { en: "Rerun the query over the entire index with the semantic model.", fr: "Réexécuter la requête sur tout l'index avec le modèle sémantique." } }
    - { id: generate, text: { en: "Generate the semantic captions with an Azure OpenAI deployment.", fr: "Générer les légendes sémantiques avec un déploiement Azure OpenAI." } }
    - { id: sequential, text: { en: "Run the vector query only on the documents returned by the full-text query.", fr: "Exécuter la requête vectorielle uniquement sur les documents renvoyés par la requête en texte intégral." } }
answer:
  sequence: [ parallel, rrf, rerank ]
explanation:
  correct:
    en: |
      A hybrid query runs full-text search and vector search in parallel, then merges the results into one result set with RRF. The semantic ranker then adds secondary ranking over that initial RRF-ranked set, limited to its top 50 results.
    fr: |
      Une requête hybride exécute la recherche en texte intégral et la recherche vectorielle en parallèle, puis fusionne les résultats en un seul jeu avec RRF. Le classeur sémantique ajoute ensuite un classement secondaire sur ce jeu initial classé par RRF, limité à ses 50 premiers résultats.
  options:
    rerun:
      en: The semantic ranker can't rerun the query over the whole corpus; it only reranks the existing results.
      fr: Le classeur sémantique ne peut pas réexécuter la requête sur tout le corpus ; il réordonne seulement les résultats existants.
    generate:
      en: Captions are verbatim text from the index; no generative model composes them.
      fr: Les légendes sont du texte extrait mot pour mot de l'index ; aucun modèle génératif ne les rédige.
    sequential:
      en: The two queries run in parallel and independently; neither is restricted to the results of the other.
      fr: Les deux requêtes s'exécutent en parallèle et indépendamment ; aucune n'est limitée aux résultats de l'autre.
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
