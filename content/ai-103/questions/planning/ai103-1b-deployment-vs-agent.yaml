id: ai103-1b-deployment-vs-agent
objective: "1.2.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso has a Foundry project with an agent named **quote-agent**. The agent definition references a model deployment named **chat-sales**.

    The security team asks you to apply a custom content filter to the model calls, and the operations team asks you to control when the model version changes.

    Which two settings are configured on the chat-sales deployment rather than in the definition of quote-agent?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un projet Foundry contenant un agent nommé **quote-agent**. La définition de l'agent fait référence à un déploiement de modèle nommé **chat-sales**.

    L'équipe sécurité vous demande d'appliquer un filtre de contenu personnalisé aux appels du modèle, et l'équipe d'exploitation vous demande de contrôler le moment où la version du modèle change.

    Quels sont les deux paramètres configurés sur le déploiement chat-sales plutôt que dans la définition de quote-agent ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The instructions that define the role of the agent", fr: "Les instructions qui définissent le rôle de l'agent" } }
    - { id: b, text: { en: "The content filter (`raiPolicyName`)", fr: "Le filtre de contenu (`raiPolicyName`)" } }
    - { id: c, text: { en: "The list of tools that the agent can call", fr: "La liste des outils que l'agent peut appeler" } }
    - { id: d, text: { en: "The version upgrade policy (`versionUpgradeOption`)", fr: "La stratégie de mise à niveau de version (`versionUpgradeOption`)" } }
    - { id: e, text: { en: "The name of the model deployment that the agent uses", fr: "Le nom du déploiement de modèle utilisé par l'agent" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A model deployment holds the model and version, the deployment type and capacity, the content filter applied to its prompts and completions (`raiPolicyName`) and the version upgrade policy (`versionUpgradeOption`). Every agent or application that calls the deployment inherits these settings.
    fr: |
      Un déploiement de modèle porte le modèle et sa version, le type de déploiement et la capacité, le filtre de contenu appliqué à ses invites et complétions (`raiPolicyName`) et la stratégie de mise à niveau de version (`versionUpgradeOption`). Chaque agent ou application qui appelle le déploiement hérite de ces paramètres.
  options:
    a:
      en: |
        Instructions are part of the agent definition (`PromptAgentDefinition`).
      fr: |
        Les instructions font partie de la définition de l'agent (`PromptAgentDefinition`).
    c:
      en: |
        Tools are declared in the agent definition.
      fr: |
        Les outils sont déclarés dans la définition de l'agent.
    e:
      en: |
        The agent definition names the deployment in its `model` value; the deployment doesn't reference the agent.
      fr: |
        La définition de l'agent nomme le déploiement dans sa valeur `model` ; le déploiement ne fait pas référence à l'agent.
references:
  - title: Microsoft.CognitiveServices/accounts/deployments - Bicep, ARM template & Terraform AzAPI reference
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/deployments
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
