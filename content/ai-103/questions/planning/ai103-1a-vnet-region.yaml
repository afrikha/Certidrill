id: ai103-1a-vnet-region
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware is planning a standard agent setup with private networking. The current plan is:

    | Resource | Region |
    | --- | --- |
    | Foundry resource **lit-ai** | Sweden Central |
    | Virtual network **vnet-agents** with the agent subnet | West Europe |
    | Azure Cosmos DB account **cosmos-lit** | North Europe |
    | Storage account **stlitagents** and search service **srch-lit** | Sweden Central |

    You need to change the plan so that the deployment is supported. The solution must minimize the number of changes.

    What should you do?
  fr: |
    Litware planifie une configuration d'agent standard avec mise en réseau privée. Le plan actuel est le suivant :

    | Ressource | Région |
    | --- | --- |
    | Ressource Foundry **lit-ai** | Sweden Central |
    | Réseau virtuel **vnet-agents** avec le sous-réseau des agents | West Europe |
    | Compte Azure Cosmos DB **cosmos-lit** | North Europe |
    | Compte de stockage **stlitagents** et service de recherche **srch-lit** | Sweden Central |

    Vous devez modifier le plan pour que le déploiement soit pris en charge. La solution doit réduire au minimum le nombre de modifications.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Place cosmos-lit in Sweden Central.", fr: "Placer cosmos-lit dans Sweden Central." } }
    - { id: b, text: { en: "Place vnet-agents in Sweden Central.", fr: "Placer vnet-agents dans Sweden Central." } }
    - { id: c, text: { en: "Place stlitagents and srch-lit in West Europe.", fr: "Placer stlitagents et srch-lit dans West Europe." } }
    - { id: d, text: { en: "Place cosmos-lit, stlitagents and srch-lit in West Europe.", fr: "Placer cosmos-lit, stlitagents et srch-lit dans West Europe." } }
answer: { optionId: b }
explanation:
  correct:
    en: The Foundry resource must be deployed in the same region as the virtual network. Azure Cosmos DB, Azure AI Search and Azure Storage can be in other regions (with cross-region costs to consider), so placing the virtual network in Sweden Central is the only change needed.
    fr: |
      La ressource Foundry doit être déployée dans la même région que le réseau virtuel. Azure Cosmos DB, Azure AI Search et Stockage Azure peuvent se trouver dans d'autres régions (en tenant compte des coûts interrégions) : placer le réseau virtuel dans Sweden Central est donc la seule modification nécessaire.
  options:
    a:
      en: The Cosmos DB account can stay in another region; the blocking issue is the region of the virtual network.
      fr: Le compte Cosmos DB peut rester dans une autre région ; le problème bloquant est la région du réseau virtuel.
    c:
      en: Placing the storage account and search service doesn't put the Foundry resource and the virtual network in the same region.
      fr: Placer le compte de stockage et le service de recherche ne place pas la ressource Foundry et le réseau virtuel dans la même région.
    d:
      en: The connected resources can be in any region, and lit-ai would still be in a different region from vnet-agents.
      fr: Les ressources connectées peuvent se trouver dans n'importe quelle région, et lit-ai serait toujours dans une autre région que vnet-agents.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/virtual-networks
