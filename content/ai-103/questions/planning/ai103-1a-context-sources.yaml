id: ai103-1a-context-sources
objective: "1.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware is designing the context of an HR agent built with Foundry Agent Service. The agent must meet two requirements.

    What should you use for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware conçoit le contexte d'un agent RH créé avec Foundry Agent Service. L'agent doit répondre à deux exigences.

    Que devez-vous utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Answer questions about an employment contract that the employee attaches during the chat: [[attached]]

      Understand a follow-up question such as "And for part-time staff?" in the same chat: [[followup]]
    fr: |
      Répondre aux questions sur un contrat de travail que l'employé joint pendant la conversation : [[attached]]

      Comprendre une question de suivi comme « Et pour les salariés à temps partiel ? » dans la même conversation : [[followup]]
  slots:
    - id: attached
      options:
        - { id: fs, text: { en: "The file search tool", fr: "L'outil de recherche de fichiers" } }
        - { id: mem, text: { en: "The memory search tool", fr: "L'outil de recherche en mémoire" } }
        - { id: hist, text: { en: "The conversation history", fr: "L'historique de la conversation" } }
        - { id: kb, text: { en: "A Foundry IQ knowledge base", fr: "Une base de connaissances Foundry IQ" } }
    - id: followup
      options:
        - { id: fs, text: { en: "The file search tool", fr: "L'outil de recherche de fichiers" } }
        - { id: mem, text: { en: "The memory search tool", fr: "L'outil de recherche en mémoire" } }
        - { id: hist, text: { en: "The conversation history", fr: "L'historique de la conversation" } }
        - { id: kb, text: { en: "A Foundry IQ knowledge base", fr: "Une base de connaissances Foundry IQ" } }
answer:
  values: { attached: fs, followup: hist }
explanation:
  correct:
    en: Learn recommends the file search tool for documents that a user provides during an interaction. Follow-up questions in the same session rely on short-term memory, the conversation history that the agent runtime manages.
    fr: Learn recommande l'outil de recherche de fichiers pour les documents fournis par un utilisateur pendant une interaction. Les questions de suivi dans la même session s'appuient sur la mémoire à court terme, c'est-à-dire l'historique de la conversation géré par le runtime de l'agent.
  options:
    attached:
      en: Long-term memory stores what the agent learns about users, and a knowledge base is for curated organizational content, not for a file attached in one chat.
      fr: La mémoire à long terme stocke ce que l'agent apprend sur les utilisateurs, et une base de connaissances sert au contenu organisationnel organisé, pas à un fichier joint dans une conversation.
    followup:
      en: Long-term memory persists across sessions; within one conversation, the history already provides the context of the previous turns.
      fr: La mémoire à long terme persiste d'une session à l'autre ; au sein d'une conversation, l'historique fournit déjà le contexte des tours précédents.
references:
  - title: Memory in Microsoft Foundry Agent Service (preview)
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory
