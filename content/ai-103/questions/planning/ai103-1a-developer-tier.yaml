id: ai103-1a-developer-tier
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has fine-tuned a model to write insurance letters. Before production, the team wants to evaluate the fine-tuned model for a few hours at the lowest cost. The evaluation needs no SLA and no data residency guarantee.

    Which deployment type should you use for the evaluation?
  fr: |
    Contoso a affiné un modèle pour rédiger des courriers d'assurance. Avant la production, l'équipe veut évaluer le modèle affiné pendant quelques heures au coût le plus bas. L'évaluation ne nécessite ni SLA ni garantie de résidence des données.

    Quel type de déploiement devez-vous utiliser pour l'évaluation ?
body:
  options:
    - { id: a, text: Developer }
    - { id: b, text: Global Standard }
    - { id: c, text: Global Batch }
    - { id: d, text: Regional Provisioned }
answer: { optionId: a }
explanation:
  correct:
    en: The Developer deployment type (`DeveloperTier`) is designed for evaluating fine-tuned models only. It provides cost-efficient testing with pay-per-token billing, but without an SLA or data residency guarantees, and its deployments are deleted automatically after 24 hours.
    fr: Le type de déploiement Developer (`DeveloperTier`) est conçu uniquement pour l'évaluation de modèles affinés. Il offre des tests économiques avec une facturation par jeton, mais sans SLA ni garantie de résidence des données, et ses déploiements sont supprimés automatiquement au bout de 24 heures.
  options:
    b:
      en: Global Standard is the general production choice; it isn't the type designed for cheap evaluation of fine-tuned models.
      fr: Global Standard est le choix général pour la production ; ce n'est pas le type conçu pour évaluer à moindre coût des modèles affinés.
    c:
      en: Batch deployments don't support fine-tuned models and target a 24-hour turnaround.
      fr: Les déploiements par lots ne prennent pas en charge les modèles affinés et visent un délai de traitement de 24 heures.
    d:
      en: Provisioned deployments are billed per PTU per hour for reserved throughput, which is expensive for a short test.
      fr: Les déploiements provisionnés sont facturés par PTU et par heure pour un débit réservé, ce qui est coûteux pour un test court.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: Getting started with Azure OpenAI batch deployments
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/batch
