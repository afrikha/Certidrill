id: ai103-cs4b-email-spotlighting
objective: "1.4.1"
type: yesno_statements
caseStudy: ai103-cs4b-consolidated
difficulty: 3
status: draft
stem:
  en: |
    You plan to meet the email triage requirement by using Prompt Shields with spotlighting. mail-triage will pass the body of each email to chat-ops as a document. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de satisfaire l'exigence relative au tri des e-mails à l'aide de Prompt Shields avec le spotlighting. mail-triage transmettra le corps de chaque e-mail à chat-ops sous forme de document. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Spotlighting base-64 encodes the email content so that chat-ops treats it as less trustworthy than the system and user prompts, which increases the number of tokens of each request.
        fr: |
          Le spotlighting encode le contenu de l'e-mail en base 64 pour que chat-ops le considère comme moins fiable que les invites système et utilisateur, ce qui augmente le nombre de jetons de chaque requête.
    - id: s2
      text:
        en: |
          Spotlighting is applied automatically as soon as the detection of document attacks is enabled for chat-ops.
        fr: |
          Le spotlighting s'applique automatiquement dès que la détection des attaques par document est activée pour chat-ops.
    - id: s3
      text:
        en: |
          The same spotlighting configuration can be applied to the passages that support-agent retrieves from delivery-policies.
        fr: |
          La même configuration de spotlighting peut s'appliquer aux passages que support-agent récupère dans delivery-policies.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Spotlighting tags the input documents by base-64 encoding them, so the model treats them as lower trust than direct system and user prompts; it adds no direct cost but increases the document tokens. Spotlighting is off by default and must be turned on separately (`spotlighting_enabled`). It is available only for models used through the Chat Completions API, and it is not supported in the guardrails of agents such as support-agent.
    fr: |
      Le spotlighting balise les documents d'entrée en les encodant en base 64, si bien que le modèle les considère comme moins fiables que les invites système et utilisateur directes ; il n'entraîne aucun coût direct, mais augmente les jetons des documents. Il est désactivé par défaut et doit être activé séparément (`spotlighting_enabled`). Il n'est disponible que pour les modèles utilisés par l'API Chat Completions et n'est pas pris en charge dans les garde-fous des agents comme support-agent.
references:
  - title: Prompt Shields in Azure AI Content Safety
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
