id: ai103-cs4b-email-spotlighting
objective: "1.4.1"
type: yesno_statements
caseStudy: ai103-cs4b-consolidated
difficulty: 3
status: draft
stem:
  en: |
    You plan to meet the email triage requirement by using Prompt Shields in a guardrail of chat-ops. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de satisfaire l'exigence relative au tri des e-mails à l'aide de Prompt Shields dans un garde-fou de chat-ops. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          If chat-ops uses the default guardrail Microsoft.DefaultV2, the hidden instructions in the email bodies are already detected.
        fr: |
          Si chat-ops utilise le garde-fou par défaut Microsoft.DefaultV2, les instructions cachées dans le corps des e-mails sont déjà détectées.
    - id: s2
      text:
        en: |
          A guardrail of chat-ops with an Indirect attacks control and the Annotate and block action blocks the requests whose email body contains hidden instructions.
        fr: |
          Un garde-fou de chat-ops doté d'un contrôle Indirect attacks avec l'action Annotate and block bloque les requêtes dont le corps de l'e-mail contient des instructions cachées.
    - id: s3
      text:
        en: |
          A User prompt attacks control detects the hidden instructions in the email bodies that mail-triage passes as documents.
        fr: |
          Un contrôle User prompt attacks détecte les instructions cachées dans le corps des e-mails que mail-triage transmet sous forme de documents.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      User prompt attack detection is on by default, but document (indirect) attack detection is off by default and must be enabled in a guardrail control. An Indirect attacks control with Annotate and block detects instructions hidden in the documents passed with the prompt and blocks the request. User prompt attacks covers what the user types to bypass the system rules, not the content of documents.
    fr: |
      La détection des attaques par invite utilisateur est activée par défaut, mais la détection des attaques par document (indirectes) est désactivée par défaut et doit être activée dans un contrôle de garde-fou. Un contrôle Indirect attacks avec Annotate and block détecte les instructions cachées dans les documents transmis avec l'invite et bloque la requête. User prompt attacks couvre ce que l'utilisateur saisit pour contourner les règles système, pas le contenu des documents.
references:
  - title: Prompt Shields in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
