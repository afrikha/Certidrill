id: ai103-1b-indexer-params-json
objective: "1.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Lamna Healthcare indexes clinical guidelines from Blob Storage into Azure AI Search for a Foundry agent. You are updating the indexer definition to meet the following requirements:

    - The indexer must run every two hours.
    - A run must continue and report success whatever the number of documents that fail; a separate job reviews `itemsFailed` and the errors after each run.

    How should you complete the definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lamna Healthcare indexe des recommandations cliniques depuis le Stockage Blob dans Azure AI Search pour un agent Foundry. Vous mettez à jour la définition de l'indexeur pour répondre aux exigences suivantes :

    - L'indexeur doit s'exécuter toutes les deux heures.
    - Une exécution doit continuer et signaler une réussite quel que soit le nombre de documents en échec ; un traitement distinct examine `itemsFailed` et les erreurs après chaque exécution.

    Comment devez-vous compléter la définition ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "name": "guidelines-indexer",
      "dataSourceName": "guidelines-ds",
      "targetIndexName": "guidelines-idx",
      "schedule": { "interval": [[interval]] },
      "parameters": {
        "maxFailedItems": [[max]],
        "maxFailedItemsPerBatch": -1
      }
    }
  slots:
    - id: interval
      options:
        - { id: pt2h, text: "\"PT2H\"" }
        - { id: p2d, text: "\"P2D\"" }
        - { id: pt2m, text: "\"PT2M\"" }
        - { id: h2, text: "\"2h\"" }
    - id: max
      options:
        - { id: unlimited, text: "-1" }
        - { id: zero, text: "0" }
        - { id: hundred, text: "100" }
answer:
  values: { interval: pt2h, max: unlimited }
explanation:
  correct:
    en: |
      The schedule interval is an XSD dayTimeDuration value between 5 minutes and 24 hours, such as `PT2H` for every two hours. `maxFailedItems` is the number of items that can fail while the run is still considered successful; `-1` means no limit, and the default is `0`.
    fr: |
      L'intervalle de planification est une valeur XSD dayTimeDuration comprise entre 5 minutes et 24 heures, comme `PT2H` pour toutes les deux heures. `maxFailedItems` est le nombre d'éléments qui peuvent échouer sans que l'exécution cesse d'être considérée comme réussie ; `-1` signifie aucune limite, et la valeur par défaut est `0`.
  options:
    p2d: { en: "P2D is two days, beyond the maximum interval of 24 hours.", fr: "P2D correspond à deux jours, au-delà de l'intervalle maximal de 24 heures." }
    pt2m: { en: "PT2M is two minutes, below the minimum interval of 5 minutes.", fr: "PT2M correspond à deux minutes, sous l'intervalle minimal de 5 minutes." }
    h2: { en: "The interval must use the ISO 8601 duration pattern P(nD)(T(nH)(nM)).", fr: "L'intervalle doit suivre le modèle de durée ISO 8601 P(nD)(T(nH)(nM))." }
    zero: { en: "0, the default, makes the run fail at the first failed document.", fr: "0, la valeur par défaut, fait échouer l'exécution dès le premier document en échec." }
    hundred: { en: "With 100, a run with more than 100 failed documents would fail.", fr: "Avec 100, une exécution comptant plus de 100 documents en échec échouerait." }
references:
  - title: Indexers - Create
    url: https://learn.microsoft.com/en-us/rest/api/searchservice/indexers/create
  - title: Schedule Indexer Execution
    url: https://learn.microsoft.com/en-us/azure/search/search-howto-schedule-indexers
