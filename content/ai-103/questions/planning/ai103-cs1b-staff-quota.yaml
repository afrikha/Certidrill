id: ai103-cs1b-staff-quota
objective: "1.3.1"
type: yesno_statements
caseStudy: ai103-cs1b-alpineski
difficulty: 3
status: draft
stem:
  en: |
    The internal assistant sometimes receives HTTP 429 (Too Many Requests) responses from staff-dz. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'assistant interne reçoit parfois des réponses HTTP 429 (Too Many Requests) de staff-dz. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A second Data Zone Standard deployment of the same model and version in a Foundry resource in France Central would have its own quota, separate from the quota of staff-dz.
        fr: |
          Un second déploiement Data Zone Standard du même modèle et de la même version dans une ressource Foundry de France Central disposerait de son propre quota, distinct de celui de staff-dz.
    - id: s2
      text:
        en: |
          You can increase the tokens-per-minute (TPM) quota assigned to staff-dz by moving quota from another deployment.
        fr: |
          Vous pouvez augmenter le quota de jetons par minute (TPM) attribué à staff-dz en déplaçant du quota depuis un autre déploiement.
    - id: s3
      text:
        en: |
          The internal assistant should implement retry logic for requests that return HTTP 429.
        fr: |
          L'assistant interne doit implémenter une logique de nouvelle tentative pour les requêtes qui renvoient HTTP 429.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Deployments of the same model and version with the Data Zone Standard type share one quota pool per data zone in a subscription, so a deployment in another EU region adds no quota. You can raise the quota of a deployment by moving quota from another deployment, or request an increase. Microsoft recommends retry logic and gradual workload increases when 429 responses occur.
    fr: |
      Les déploiements Data Zone Standard d'un même modèle et d'une même version partagent un seul pool de quota par zone de données dans un abonnement : un déploiement dans une autre région de l'UE n'ajoute donc aucun quota. Vous pouvez augmenter le quota d'un déploiement en déplaçant du quota depuis un autre déploiement, ou demander une augmentation. Microsoft recommande une logique de nouvelle tentative et une augmentation progressive de la charge quand des réponses 429 surviennent.
references:
  - title: Azure OpenAI in Microsoft Foundry Models quotas and limits
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/quotas-limits
