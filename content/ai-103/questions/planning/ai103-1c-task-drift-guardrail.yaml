id: ai103-1c-task-drift-guardrail
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a travel booking agent in Foundry Agent Service. Some users persuade the agent to give tax advice, which is outside the task described in its instructions.

    You need to detect, at run time, agent behavior that drifts from the assigned task and block it.

    What should you add to the guardrail assigned to the agent?
  fr: |
    Contoso, Ltd. dispose d'un agent de réservation de voyages dans Foundry Agent Service. Certains utilisateurs persuadent l'agent de donner des conseils fiscaux, ce qui sort de la tâche décrite dans ses instructions.

    Vous devez détecter à l'exécution un comportement de l'agent qui s'écarte de la tâche assignée, et le bloquer.

    Que devez-vous ajouter au garde-fou attribué à l'agent ?
body:
  options:
    - { id: a, text: { en: "A Groundedness control", fr: "Un contrôle Groundedness" } }
    - { id: b, text: { en: "A Protected material for text control", fr: "Un contrôle Protected material for text" } }
    - { id: c, text: { en: "A Task Adherence control", fr: "Un contrôle Task Adherence" } }
    - { id: d, text: { en: "A Spotlighting control", fr: "Un contrôle Spotlighting" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Task Adherence (preview) is a guardrail risk that applies to models and agents; it detects agent behavior that drifts from the assigned task. With the Annotate and block action, the guardrail blocks the off-task behavior at run time.
    fr: |
      Task Adherence (préversion) est un risque de garde-fou qui s'applique aux modèles et aux agents ; il détecte un comportement de l'agent qui s'écarte de la tâche assignée. Avec l'action Annotate and block, le garde-fou bloque ce comportement hors tâche à l'exécution.
  options:
    a:
      en: |
        Groundedness (preview) flags output not supported by sources, and it doesn't take effect for agents.
      fr: |
        Groundedness (préversion) signale une sortie non étayée par les sources, et il ne s'applique pas aux agents.
    b:
      en: |
        Protected material for text detects known copyrighted text such as lyrics or articles.
      fr: |
        Protected material for text détecte un texte protégé connu, comme des paroles ou des articles.
    d:
      en: |
        Spotlighting (preview) helps a model tell untrusted input from instructions, and it doesn't take effect for agents.
      fr: |
        Spotlighting (préversion) aide un modèle à distinguer une entrée non fiable des instructions, et il ne s'applique pas aux agents.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
