id: ai103-1c-task-drift-guardrail
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso, Ltd. has a travel booking agent in Foundry Agent Service. The agent must use a flight-pricing tool that a third-party provider publishes on a remote MCP server.

    The security team asks which practice to follow before and while the agent uses this server.

    What should you recommend?
  fr: |
    Contoso, Ltd. dispose d'un agent de réservation de voyages dans Foundry Agent Service. L'agent doit utiliser un outil de tarification de vols qu'un fournisseur tiers publie sur un serveur MCP distant.

    L'équipe de sécurité demande quelle pratique suivre avant et pendant l'utilisation de ce serveur par l'agent.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Rely on the review that Microsoft performs on remote MCP servers before agents can call them", fr: "S'appuyer sur la vérification que Microsoft effectue sur les serveurs MCP distants avant que les agents puissent les appeler" } }
    - { id: b, text: { en: "Connect through a proxy that republishes the provider's tools under the company's own domain", fr: "Se connecter par un proxy qui republie les outils du fournisseur sous le domaine de l'entreprise" } }
    - { id: c, text: { en: "Connect to the server hosted by the provider itself, and review and log the data shared with it", fr: "Se connecter au serveur hébergé par le fournisseur lui-même, et examiner et journaliser les données partagées avec lui" } }
    - { id: d, text: { en: "Copy the tool descriptions of the server into the agent instructions as trusted guidance", fr: "Copier les descriptions d'outils du serveur dans les instructions de l'agent comme consignes fiables" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Microsoft doesn't test or verify third-party remote MCP servers. Learn recommends relying on servers hosted by trusted service providers themselves rather than proxies, and reviewing and logging the data that you share with them for auditing.
    fr: |
      Microsoft ne teste ni ne vérifie les serveurs MCP distants tiers. Learn recommande de s'appuyer sur des serveurs hébergés par les fournisseurs de confiance eux-mêmes plutôt que par des proxys, et d'examiner et de journaliser les données que vous partagez avec eux à des fins d'audit.
  options:
    a:
      en: |
        Microsoft has no responsibility for the remote MCP servers that you decide to use and doesn't verify them.
      fr: |
        Microsoft n'assume aucune responsabilité pour les serveurs MCP distants que vous choisissez d'utiliser et ne les vérifie pas.
    b:
      en: |
        Learn recommends servers hosted by the providers themselves rather than proxies.
      fr: |
        Learn recommande des serveurs hébergés par les fournisseurs eux-mêmes plutôt que des proxys.
    d:
      en: |
        Tool descriptions and results of remote MCP servers are untrusted input that can carry indirect prompt injection.
      fr: |
        Les descriptions d'outils et les résultats des serveurs MCP distants sont des entrées non fiables qui peuvent porter une injection d'invite indirecte.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol
