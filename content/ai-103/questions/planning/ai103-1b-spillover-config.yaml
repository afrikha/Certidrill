id: ai103-1b-spillover-config
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Coho Winery has a Microsoft Foundry resource named **coho-ai** that contains a Global Provisioned deployment named **ptu-orders**. The deployment runs **gpt-4.1** version **2025-04-14**. During seasonal peaks, ptu-orders is fully used and returns HTTP 429 responses.

    You need to ensure that the requests that ptu-orders can't serve are processed automatically. The solution must meet the following requirements:

    - The overflow must be billed pay-per-token.
    - The applications' code must not change.

    What should you do?
  fr: |
    Coho Winery dispose d'une ressource Microsoft Foundry nommée **coho-ai** qui contient un déploiement Global Provisioned nommé **ptu-orders**. Le déploiement exécute **gpt-4.1** version **2025-04-14**. Lors des pointes saisonnières, ptu-orders est entièrement utilisé et renvoie des réponses HTTP 429.

    Vous devez vous assurer que les requêtes que ptu-orders ne peut pas traiter sont traitées automatiquement. La solution doit répondre aux exigences suivantes :

    - Le débordement doit être facturé au jeton.
    - Le code des applications ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "In coho-ai, create a Global Standard deployment of gpt-4.1-mini, and set it as the spillover deployment of ptu-orders.", fr: "Dans coho-ai, créer un déploiement Global Standard de gpt-4.1-mini et le définir comme déploiement de débordement de ptu-orders." } }
    - { id: b, text: { en: "In another Foundry resource, create a Global Standard deployment of gpt-4.1 2025-04-14, and set it as the spillover deployment of ptu-orders.", fr: "Dans une autre ressource Foundry, créer un déploiement Global Standard de gpt-4.1 2025-04-14 et le définir comme déploiement de débordement de ptu-orders." } }
    - { id: c, text: { en: "In coho-ai, create a Global Standard deployment of gpt-4.1 2025-04-14, and add the x-ms-spillover-deployment header to each request.", fr: "Dans coho-ai, créer un déploiement Global Standard de gpt-4.1 2025-04-14 et ajouter l'en-tête x-ms-spillover-deployment à chaque requête." } }
    - { id: d, text: { en: "In coho-ai, create a Global Standard deployment of gpt-4.1 2025-04-14, and set it as the spillover deployment of ptu-orders.", fr: "Dans coho-ai, créer un déploiement Global Standard de gpt-4.1 2025-04-14 et le définir comme déploiement de débordement de ptu-orders." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Spillover sends the requests that a fully used provisioned deployment would reject to a standard deployment. The standard deployment must be in the same Foundry resource and match the model and version of the provisioned deployment. Setting it on ptu-orders (`spilloverDeploymentName`) applies to every request without code changes, and the spilled-over requests are billed at standard token rates.
    fr: |
      Le débordement (spillover) envoie les requêtes qu'un déploiement provisionné saturé rejetterait vers un déploiement standard. Le déploiement standard doit se trouver dans la même ressource Foundry et correspondre au modèle et à la version du déploiement provisionné. Le définir sur ptu-orders (`spilloverDeploymentName`) s'applique à toutes les requêtes sans modification du code, et les requêtes en débordement sont facturées aux tarifs standard par jeton.
  options:
    a:
      en: |
        The spillover deployment must match the model and version of ptu-orders; gpt-4.1-mini is a different model.
      fr: |
        Le déploiement de débordement doit correspondre au modèle et à la version de ptu-orders ; gpt-4.1-mini est un autre modèle.
    b:
      en: |
        The standard deployment must be in the same Foundry resource as the provisioned deployment.
      fr: |
        Le déploiement standard doit se trouver dans la même ressource Foundry que le déploiement provisionné.
    c:
      en: |
        Per-request spillover with the header requires changing the applications' code.
      fr: |
        Le débordement par requête avec l'en-tête exige de modifier le code des applications.
references:
  - title: Manage traffic with spillover for provisioned deployments
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/spillover-traffic-management
