id: ai103-1c-trace-storage
objective: "1.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders runs several agents in a Microsoft Foundry project. For auditing, every run of an agent must be recorded as a trace that shows the model calls, the tool calls with their arguments and results, and the token counts. Auditors must view the traces in the Foundry portal.

    What should you connect to the project to store the traces?
  fr: |
    Northwind Traders exécute plusieurs agents dans un projet Microsoft Foundry. Pour l'audit, chaque exécution d'un agent doit être enregistrée sous forme de trace qui montre les appels au modèle, les appels d'outils avec leurs arguments et leurs résultats, ainsi que le nombre de jetons. Les auditeurs doivent consulter les traces dans le portail Foundry.

    Que devez-vous connecter au projet pour stocker les traces ?
body:
  options:
    - { id: a, text: { en: "An Azure Storage account", fr: "Un compte Stockage Azure" } }
    - { id: b, text: { en: "An Azure Event Hubs namespace", fr: "Un espace de noms Azure Event Hubs" } }
    - { id: c, text: { en: "An Application Insights resource", fr: "Une ressource Application Insights" } }
    - { id: d, text: { en: "A Microsoft Purview account", fr: "Un compte Microsoft Purview" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Foundry tracing follows OpenTelemetry and stores traces in the Application Insights resource connected to the project. The traces contain the inputs and outputs, the tool calls and results, the token consumption and the durations, and you view them in the Foundry portal or in Application Insights.
    fr: |
      Le suivi Foundry s'appuie sur OpenTelemetry et stocke les traces dans la ressource Application Insights connectée au projet. Les traces contiennent les entrées et les sorties, les appels d'outils et leurs résultats, la consommation de jetons et les durées, et vous les consultez dans le portail Foundry ou dans Application Insights.
  options:
    a:
      en: |
        A storage account isn't where Foundry writes agent traces, and the portal doesn't read traces from it.
      fr: |
        Un compte de stockage n'est pas l'endroit où Foundry écrit les traces d'agent, et le portail n'y lit pas de traces.
    b:
      en: |
        Event Hubs streams events to other systems; it isn't the trace store that the Foundry portal reads.
      fr: |
        Event Hubs diffuse des événements vers d'autres systèmes ; ce n'est pas le magasin de traces que lit le portail Foundry.
    d:
      en: |
        Microsoft Purview governs data; it doesn't store the OpenTelemetry traces of agent runs.
      fr: |
        Microsoft Purview gouverne les données ; il ne stocke pas les traces OpenTelemetry des exécutions d'agent.
references:
  - title: Agent tracing overview
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/observability/concepts/trace-agent-concept
