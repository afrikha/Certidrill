id: ai103-1b-observability-yn
objective: "1.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is setting up the monitoring of a production agent in a Foundry project. Application Insights is connected to the project, and the model deployment has a content filter configuration.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders configure la surveillance d'un agent de production dans un projet Foundry. Application Insights est connecté au projet, et le déploiement de modèle dispose d'une configuration de filtre de contenu.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Continuous evaluation can score production traffic at a sampled rate instead of scoring every response.
        fr: |
          L'évaluation continue peut noter le trafic de production à un taux échantillonné au lieu de noter chaque réponse.
    - id: s2
      text:
        en: |
          The content filter results returned with a response indicate whether the response is supported by the retrieved documents.
        fr: |
          Les résultats du filtre de contenu renvoyés avec une réponse indiquent si la réponse est étayée par les documents récupérés.
    - id: s3
      text:
        en: |
          Foundry tracing is built on OpenTelemetry and records the model calls and tool invocations of each run.
        fr: |
          Le traçage de Foundry repose sur OpenTelemetry et enregistre les appels de modèle et les appels d'outils de chaque exécution.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Continuous evaluation measures quality and safety on production traffic at a sampled rate, which limits its cost. Content filters detect harmful content categories at run time; whether an answer is supported by its sources is measured by a groundedness evaluator. Tracing follows OpenTelemetry standards and is integrated with Application Insights to debug agent behavior.
    fr: |
      L'évaluation continue mesure la qualité et la sécurité sur le trafic de production à un taux échantillonné, ce qui limite son coût. Les filtres de contenu détectent des catégories de contenu nuisible à l'exécution ; c'est un évaluateur Groundedness qui mesure si une réponse est étayée par ses sources. Le traçage suit les standards OpenTelemetry et est intégré à Application Insights pour déboguer le comportement des agents.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
