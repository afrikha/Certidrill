id: ai103-sr1-keyless-app-2
objective: "1.3.4"
type: series_yesno
series: ai103-sr1-keyless-app
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You store the resource key in Azure Key Vault and read it with a managed identity.
  fr: Vous stockez la clé de la ressource dans Azure Key Vault et la lisez avec une identité managée.
body:
  solution:
    en: |
      You store a key of tailspin-ai as a secret in Azure Key Vault. You enable a managed identity for App1 and grant it read access to the secret. At startup, App1 reads the key and passes it to the client.
    fr: |
      Vous stockez une clé de tailspin-ai en tant que secret dans Azure Key Vault. Vous activez une identité managée pour App1 et lui accordez l'accès en lecture au secret. Au démarrage, App1 lit la clé et la transmet au client.
answer: { value: false }
explanation:
  correct:
    en: Once `disableLocalAuth` is set to `true`, the resource rejects key-based requests, so a key read from Key Vault no longer authenticates App1. Keys also have to be regenerated and redistributed, which does not meet the requirement to avoid credential rotation.
    fr: "Une fois `disableLocalAuth` défini sur `true`, la ressource refuse les requêtes authentifiées par clé : une clé lue dans Key Vault n'authentifie plus App1. Les clés doivent en outre être régénérées et redistribuées, ce qui ne respecte pas l'exigence d'éviter le renouvellement des informations d'identification."
references:
  - title: Configure keyless authentication with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/how-to/configure-entra-id
