id: ai103-cs2b-registry-throttling
objective: "1.3.3"
type: single
caseStudy: ai103-cs2b-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the ingestion quality requirement. func-registry can't be scaled out. What should you change in the definition of the compound-registry skill?
  fr: |
    Vous devez satisfaire l'exigence relative à la qualité de l'ingestion. func-registry ne peut pas faire l'objet d'une mise à l'échelle horizontale. Que devez-vous modifier dans la définition de la compétence compound-registry ?
body:
  options:
    - id: a
      text:
        en: |
          Set `timeout` to `PT230S`.
        fr: |
          Définir `timeout` sur `PT230S`.
    - id: b
      text:
        en: |
          Set `batchSize` to 2000.
        fr: |
          Définir `batchSize` sur 2000.
    - id: c
      text:
        en: |
          Set `degreeOfParallelism` to 10.
        fr: |
          Définir `degreeOfParallelism` sur 10.
    - id: d
      text:
        en: |
          Set `degreeOfParallelism` to 1.
        fr: |
          Définir `degreeOfParallelism` sur 1.
answer: { optionId: d }
explanation:
  correct:
    en: |
      The indexer retries a call that returns 429 (Too Many Requests) only twice; when the retries fail, the records of the call aren't enriched and the indexer reports a warning. compound-registry throttles because it receives too many concurrent calls: `degreeOfParallelism` defaults to 5 (range 1 to 10), so setting it to 1 sends one call at a time and reduces the load that causes the throttling.
    fr: |
      L'indexeur ne relance que deux fois un appel qui renvoie 429 (Too Many Requests) ; quand les nouvelles tentatives échouent, les enregistrements de l'appel ne sont pas enrichis et l'indexeur signale un avertissement. compound-registry limite le débit parce qu'elle reçoit trop d'appels simultanés : `degreeOfParallelism` vaut 5 par défaut (plage de 1 à 10), et le définir sur 1 envoie un seul appel à la fois, ce qui réduit la charge à l'origine de la limitation.
  options:
    a:
      en: |
        A longer timeout helps calls that take too long, but the calls fail with 429 responses, not with timeouts.
      fr: |
        Un délai d'expiration plus long aide les appels trop lents, mais les appels échouent avec des réponses 429, pas par expiration.
    b:
      en: |
        The default batch size is already 1000 records per call; larger batches make each call heavier without reducing the number of concurrent calls.
      fr: |
        La taille de lot par défaut est déjà de 1 000 enregistrements par appel ; des lots plus grands alourdissent chaque appel sans réduire le nombre d'appels simultanés.
    c:
      en: |
        Ten parallel calls instead of the default five would increase the load on compound-registry and cause more 429 responses.
      fr: |
        Dix appels parallèles au lieu des cinq par défaut augmenteraient la charge sur compound-registry et provoqueraient davantage de réponses 429.
references:
  - title: Custom Web API Skill in Skillsets
    url: https://learn.microsoft.com/en-us/azure/search/cognitive-search-custom-skill-web-api
