id: ai103-1a-foundry-iq-steps
objective: "1.1.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Relecloud stores its travel policies in an Azure Blob Storage container. You plan to ground an existing prompt agent on these policies by using Foundry IQ in the Foundry portal. The Azure AI Search service supports agentic retrieval, and a chat model deployment is available for query planning.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Relecloud stocke ses politiques de voyage dans un conteneur Stockage Blob Azure. Vous prévoyez d'ancrer un agent d'invite existant sur ces politiques à l'aide de Foundry IQ dans le portail Foundry. Le service Azure AI Search prend en charge la récupération agentique, et un déploiement de modèle de conversation est disponible pour la planification des requêtes.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ks, text: { en: "Create a knowledge source that points to the Blob Storage container.", fr: "Créer une source de connaissances qui pointe vers le conteneur Stockage Blob." } }
    - { id: kb, text: { en: "Create a knowledge base that references the knowledge source.", fr: "Créer une base de connaissances qui référence la source de connaissances." } }
    - { id: conn, text: { en: "Connect the knowledge base to the agent.", fr: "Connecter la base de connaissances à l'agent." } }
    - { id: vs, text: { en: "Create a vector store and upload the policy files to it.", fr: "Créer un magasin de vecteurs et y charger les fichiers de politiques." } }
    - { id: skill, text: { en: "Create a skillset with a Text Split skill and an embedding skill.", fr: "Créer un ensemble de compétences avec une compétence Text Split et une compétence d'incorporation." } }
    - { id: mem, text: { en: "Create a memory store scoped to each user.", fr: "Créer un magasin de mémoire limité à chaque utilisateur." } }
answer:
  sequence: [ ks, kb, conn ]
explanation:
  correct:
    en: |
      A Foundry IQ knowledge base is made of knowledge sources and retrieval parameters, so the knowledge source must exist before the knowledge base that references it. You create both on the Knowledge tab, then connect the knowledge base to the agent on the Agents tab.
    fr: |
      Une base de connaissances Foundry IQ est constituée de sources de connaissances et de paramètres de récupération : la source de connaissances doit exister avant la base de connaissances qui la référence. Vous créez les deux sous l'onglet Knowledge, puis vous connectez la base de connaissances à l'agent sous l'onglet Agents.
  options:
    vs:
      en: A vector store is used by the file search tool, not by a Foundry IQ knowledge base.
      fr: Un magasin de vecteurs est utilisé par l'outil de recherche de fichiers, pas par une base de connaissances Foundry IQ.
    skill:
      en: Indexed knowledge sources generate their chunking and embedding pipeline automatically.
      fr: Les sources de connaissances indexées génèrent automatiquement leur pipeline de segmentation et d'incorporation.
    mem:
      en: Memory stores what the agent learns about users; curated organizational content belongs in a knowledge base.
      fr: La mémoire stocke ce que l'agent apprend sur les utilisateurs ; le contenu organisationnel organisé relève d'une base de connaissances.
references:
  - title: What is Foundry IQ?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-foundry-iq
