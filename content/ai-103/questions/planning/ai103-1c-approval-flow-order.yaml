id: ai103-1c-approval-flow-order
objective: "1.4.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank builds a prompt agent in Foundry Agent Service that can block payment cards through the MCP server of its card system. Every call to the server must be confirmed by a bank employee who sees the tool name and its arguments before the call runs.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank crée un agent d'invite dans Foundry Agent Service qui peut bloquer des cartes de paiement au moyen du serveur MCP de son système de cartes. Chaque appel au serveur doit être confirmé par un employé de la banque qui voit le nom de l'outil et ses arguments avant l'exécution de l'appel.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: ver, text: { en: "Create an agent version whose MCPTool sets require_approval to \"always\".", fr: "Créer une version d'agent dont le MCPTool définit require_approval sur \"always\"." } }
    - { id: ask, text: { en: "Send the customer's request with responses.create() in a new conversation.", fr: "Envoyer la demande du client avec responses.create() dans une nouvelle conversation." } }
    - { id: rev, text: { en: "Show the tool name and arguments of each mcp_approval_request item to the employee.", fr: "Montrer à l'employé le nom de l'outil et les arguments de chaque élément mcp_approval_request." } }
    - { id: ans, text: { en: "Send an mcp_approval_response item for each request in the same conversation.", fr: "Envoyer un élément mcp_approval_response pour chaque demande dans la même conversation." } }
    - { id: newconv, text: { en: "Create another conversation for the approval responses.", fr: "Créer une autre conversation pour les réponses d'approbation." } }
    - { id: direct, text: { en: "Call the MCP server from the application with the proposed arguments.", fr: "Appeler le serveur MCP depuis l'application avec les arguments proposés." } }
    - { id: never, text: { en: "Set require_approval to \"never\" for the tools that the employee approved.", fr: "Définir require_approval sur \"never\" pour les outils que l'employé a approuvés." } }
answer:
  sequence: [ver, ask, rev, ans]
explanation:
  correct:
    en: |
      With `require_approval="always"`, the agent returns an `mcp_approval_request` item instead of calling the tool. The application shows the tool name and arguments to the employee, then sends an `mcp_approval_response` with the `approval_request_id` and the decision in the same conversation; Agent Service then calls the tool if it was approved.
    fr: |
      Avec `require_approval="always"`, l'agent renvoie un élément `mcp_approval_request` au lieu d'appeler l'outil. L'application montre le nom de l'outil et les arguments à l'employé, puis envoie un `mcp_approval_response` avec l'`approval_request_id` et la décision dans la même conversation ; Agent Service appelle alors l'outil s'il a été approuvé.
  options:
    newconv:
      en: |
        The approval must be sent in the conversation that contains the request.
      fr: |
        L'approbation doit être envoyée dans la conversation qui contient la demande.
    direct:
      en: |
        Agent Service calls the tool after the approval; calling it from the application bypasses the agent flow.
      fr: |
        Agent Service appelle l'outil après l'approbation ; l'appeler depuis l'application contourne le flux de l'agent.
    never:
      en: |
        Removing approval for approved tools would let later calls run without confirmation.
      fr: |
        Supprimer l'approbation des outils approuvés laisserait les appels suivants s'exécuter sans confirmation.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
