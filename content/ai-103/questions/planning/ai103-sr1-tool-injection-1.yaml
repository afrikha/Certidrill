id: ai103-sr1-tool-injection-1
objective: "1.4.1"
type: series_yesno
series: ai103-sr1-tool-injection
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add an Indirect attacks control on the Tool response intervention point to gr-policy.
  fr: Vous ajoutez à gr-policy un contrôle Indirect attacks sur le point d'intervention Tool response.
body:
  solution:
    en: |
      In gr-policy, you add a control for the **Indirect attacks** risk, select the **Tool response** intervention point (preview), and set the action to **Annotate and block**.
    fr: |
      Dans gr-policy, vous ajoutez un contrôle pour le risque **Indirect attacks**, sélectionnez le point d'intervention **Tool response** (préversion) et définissez l'action sur **Annotate and block**.
answer: { value: true }
explanation:
  correct:
    en: A Tool response control scans the full payload that a tool returns to the agent. With the Indirect attacks risk and the Annotate and block action, an injected instruction in a SharePoint document is detected and the agent stops before using it. The SharePoint tool supports tool response moderation, and gr-policy is the guardrail that PolicyAgent uses.
    fr: "Un contrôle Tool response analyse l'intégralité du contenu qu'un outil renvoie à l'agent. Avec le risque Indirect attacks et l'action Annotate and block, une instruction injectée dans un document SharePoint est détectée et l'agent s'arrête avant de l'utiliser. L'outil SharePoint prend en charge la modération des réponses d'outil, et gr-policy est le garde-fou utilisé par PolicyAgent."
references:
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/intervention-points
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
