id: ai103-sr1-tool-injection-1
objective: "1.4.1"
type: series_yesno
series: ai103-sr1-tool-injection
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You add an Indirect attacks control to gr-policy, and PolicyChat passes the retrieved passages as documents.
  fr: Vous ajoutez à gr-policy un contrôle Indirect attacks, et PolicyChat transmet les passages récupérés sous forme de documents.
body:
  solution:
    en: |
      In gr-policy, you add a control for the **Indirect attacks** risk on the **User input** intervention point and set the action to **Annotate and block**. PolicyChat embeds the retrieved passages in the prompt by using the document format that Prompt Shields expects, separate from the question and the system message.
    fr: |
      Dans gr-policy, vous ajoutez un contrôle pour le risque **Indirect attacks** sur le point d'intervention **User input** et définissez l'action sur **Annotate and block**. PolicyChat incorpore les passages récupérés dans l'invite au format de document attendu par Prompt Shields, séparément de la question et du message système.
answer: { value: true }
explanation:
  correct:
    en: Document (indirect) attack detection is off by default and must be enabled in a guardrail control. With the passages embedded as documents, the Indirect attacks control detects hidden instructions in them, and the Annotate and block action blocks the request before the model answers. gr-policy is the guardrail of gpt-main, so it applies to every request of PolicyChat.
    fr: "La détection des attaques par document (indirectes) est désactivée par défaut et doit être activée dans un contrôle de garde-fou. Avec les passages incorporés sous forme de documents, le contrôle Indirect attacks y détecte les instructions cachées, et l'action Annotate and block bloque la requête avant que le modèle ne réponde. gr-policy est le garde-fou de gpt-main : il s'applique à chaque requête de PolicyChat."
references:
  - title: Prompt Shields in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
