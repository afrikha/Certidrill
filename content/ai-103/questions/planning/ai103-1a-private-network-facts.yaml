id: ai103-1a-private-network-facts
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Relecloud is designing a Foundry resource with private networking for Foundry Agent Service. The agent runtime is injected into a customer-managed virtual network, and the agents use Azure Cosmos DB, Azure Storage and Azure AI Search in a standard agent setup.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Relecloud conçoit une ressource Foundry avec mise en réseau privée pour Foundry Agent Service. Le runtime des agents est injecté dans un réseau virtuel géré par le client, et les agents utilisent Azure Cosmos DB, Stockage Azure et Azure AI Search dans une configuration d'agent standard.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The private endpoints of Cosmos DB, Storage and AI Search aren't created automatically when you deploy the Foundry resource.", fr: "Les points de terminaison privés de Cosmos DB, de Stockage et d'AI Search ne sont pas créés automatiquement lors du déploiement de la ressource Foundry." } }
    - { id: b, text: { en: "Cosmos DB, Storage and AI Search must be deployed in the region of the virtual network.", fr: "Cosmos DB, Stockage et AI Search doivent être déployés dans la région du réseau virtuel." } }
    - { id: c, text: { en: "The storage account and the search service inherit the network settings of the Foundry resource.", fr: "Le compte de stockage et le service de recherche héritent des paramètres réseau de la ressource Foundry." } }
    - { id: d, text: { en: "The address space of the virtual network can use 10.0.0.0/8 but not a public range such as 44.0.0.0/16.", fr: "L'espace d'adressage du réseau virtuel peut utiliser 10.0.0.0/8, mais pas une plage publique comme 44.0.0.0/16." } }
    - { id: e, text: { en: "DNS conditional forwarders for the private zones must target 169.254.169.254.", fr: "Les redirecteurs conditionnels DNS des zones privées doivent cibler 169.254.169.254." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Private endpoints to Azure AI Search, Azure Storage and Azure Cosmos DB aren't created when you deploy the Foundry resource; you configure them. The virtual network can use private RFC 1918 ranges such as 10.0.0.0/8, which every Agent Service region supports, but not public IP ranges.
    fr: Les points de terminaison privés vers Azure AI Search, Stockage Azure et Azure Cosmos DB ne sont pas créés lors du déploiement de la ressource Foundry ; vous les configurez. Le réseau virtuel peut utiliser des plages privées RFC 1918 comme 10.0.0.0/8, prises en charge dans toutes les régions d'Agent Service, mais pas des plages d'adresses IP publiques.
  options:
    b:
      en: Only the Foundry resource must be in the region of the virtual network; the other resources can be in other regions.
      fr: Seule la ressource Foundry doit se trouver dans la région du réseau virtuel ; les autres ressources peuvent se trouver dans d'autres régions.
    c:
      en: Connected resources are independent Azure resources with their own networking and access policies, managed separately.
      fr: Les ressources connectées sont des ressources Azure indépendantes, avec leurs propres stratégies de réseau et d'accès, gérées séparément.
    e:
      en: Conditional forwarders target the Azure DNS virtual server, 168.63.129.16.
      fr: Les redirecteurs conditionnels ciblent le serveur virtuel Azure DNS, 168.63.129.16.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/virtual-networks
  - title: Microsoft Foundry architecture
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture
