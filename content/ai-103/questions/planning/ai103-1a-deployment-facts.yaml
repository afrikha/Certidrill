id: ai103-1a-deployment-facts
objective: "1.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank uses a Global Standard deployment for its chat application and plans a Global Batch deployment of the same model for nightly document classification.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank utilise un déploiement Global Standard pour son application de conversation et prévoit un déploiement Global Batch du même modèle pour classer des documents chaque nuit.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: With the Global Standard deployment, data stored at rest remains in the designated Azure geography.
        fr: Avec le déploiement Global Standard, les données stockées au repos restent dans la zone géographique Azure désignée.
    - id: s2
      text:
        en: The Global Batch deployment guarantees that every job completes within 24 hours.
        fr: Le déploiement Global Batch garantit que chaque travail se termine en moins de 24 heures.
    - id: s3
      text:
        en: The batch jobs use their own enqueued token quota, so they don't disrupt the online chat workload.
        fr: |
          Les travaux par lots utilisent leur propre quota de jetons en file d'attente : ils ne perturbent pas la charge de travail de conversation en ligne.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: For every deployment type, data stored at rest remains in the designated Azure geography; only inference processing varies. Batch requests have no real-time SLA; they target completion within 24 hours but might take longer. Global Batch has a separate enqueued token quota, which avoids any disruption of online workloads.
    fr: Pour tous les types de déploiement, les données stockées au repos restent dans la zone géographique Azure désignée ; seul le traitement de l'inférence varie. Les requêtes par lots n'ont pas de SLA en temps réel ; elles visent un achèvement en 24 heures, mais peuvent prendre plus de temps. Global Batch dispose d'un quota distinct de jetons en file d'attente, qui évite toute perturbation des charges de travail en ligne.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
