id: ai103-1a-invoice-fields
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders receives 30,000 supplier invoices per month as PDF files. You must extract the same 12 fields from each invoice. Each extracted value must come with a confidence score so that low-confidence values are sent to a human reviewer. The team wants to define the fields in a schema instead of writing and maintaining prompts.

    What should you use?
  fr: |
    Northwind Traders reçoit 30 000 factures fournisseurs par mois sous forme de fichiers PDF. Vous devez extraire les mêmes 12 champs de chaque facture. Chaque valeur extraite doit être accompagnée d'un score de confiance afin que les valeurs peu fiables soient envoyées à un réviseur humain. L'équipe veut définir les champs dans un schéma au lieu d'écrire et de maintenir des invites.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "An Azure Content Understanding analyzer", fr: "Un analyseur Azure Content Understanding" } }
    - { id: b, text: { en: "A `gpt-4.1` prompt that returns structured JSON output", fr: "Une invite `gpt-4.1` qui renvoie une sortie JSON structurée" } }
    - { id: c, text: { en: "Named entity recognition in Azure Language", fr: "La reconnaissance d'entités nommées d'Azure Language" } }
    - { id: d, text: { en: "Image analysis in Azure Vision", fr: "L'analyse d'images d'Azure Vision" } }
answer: { optionId: a }
explanation:
  correct:
    en: A Content Understanding analyzer extracts the fields that you define in a schema, with no prompt engineering. It returns a confidence score from 0 to 1 for each field value and can show where each value was found, which supports routing low-confidence values to human review.
    fr: Un analyseur Content Understanding extrait les champs définis dans un schéma, sans ingénierie d'invite. Il renvoie un score de confiance de 0 à 1 pour chaque valeur de champ et peut indiquer où chaque valeur a été trouvée, ce qui permet d'envoyer les valeurs peu fiables en révision humaine.
  options:
    b:
      en: Structured output gives a JSON shape, but the team would still write and maintain the prompt, and the model returns no per-field confidence score.
      fr: La sortie structurée donne une forme JSON, mais l'équipe devrait toujours écrire et maintenir l'invite, et le modèle ne renvoie pas de score de confiance par champ.
    c:
      en: Named entity recognition finds generic entities such as people or dates in text; it doesn't fill a custom invoice schema from PDF layouts.
      fr: La reconnaissance d'entités nommées trouve des entités génériques comme des personnes ou des dates dans un texte ; elle ne remplit pas un schéma de facture personnalisé à partir de la mise en page d'un PDF.
    d:
      en: Image analysis describes or tags images and reads text, but it doesn't map content to a field schema with confidence scores.
      fr: L'analyse d'images décrit ou étiquette des images et lit le texte, mais elle n'associe pas le contenu à un schéma de champs avec des scores de confiance.
references:
  - title: What is Azure Content Understanding in Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview
