id: ai103-1b-private-endpoint-multi
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Microsoft Foundry resource named **nw-ai** in West Europe and a virtual network named **VNet1** in the same region and subscription. An application in VNet1 calls nw-ai.

    You need to meet the following requirements:

    - nw-ai must not be reachable from the internet.
    - The application must reach nw-ai through a private IP address in VNet1, without changing the endpoint name it uses.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'une ressource Microsoft Foundry nommée **nw-ai** en West Europe et d'un réseau virtuel nommé **VNet1** dans la même région et le même abonnement. Une application de VNet1 appelle nw-ai.

    Vous devez répondre aux exigences suivantes :

    - nw-ai ne doit pas être accessible depuis Internet.
    - L'application doit joindre nw-ai par une adresse IP privée de VNet1, sans changer le nom de point de terminaison qu'elle utilise.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Set the public network access of nw-ai to Enabled from selected IP addresses, and add the address space of VNet1.", fr: "Définir l'accès réseau public de nw-ai sur Enabled from selected IP addresses et ajouter l'espace d'adressage de VNet1." } }
    - { id: b, text: { en: "Create a private endpoint for nw-ai in a subnet of VNet1.", fr: "Créer un point de terminaison privé pour nw-ai dans un sous-réseau de VNet1." } }
    - { id: c, text: { en: "Associate a network security group that denies inbound internet traffic with the subnet of the application.", fr: "Associer au sous-réseau de l'application un groupe de sécurité réseau qui refuse le trafic entrant d'Internet." } }
    - { id: d, text: { en: "Set the public network access of nw-ai to Disabled.", fr: "Définir l'accès réseau public de nw-ai sur Disabled." } }
    - { id: e, text: { en: "Enable the trusted Azure services exception on nw-ai.", fr: "Activer l'exception des services Azure approuvés sur nw-ai." } }
    - { id: f, text: { en: "Link a private DNS zone for the privatelink subdomain of the endpoint to VNet1.", fr: "Lier à VNet1 une zone DNS privée pour le sous-domaine privatelink du point de terminaison." } }
answer: { optionIds: [ b, d, f ] }
explanation:
  correct:
    en: |
      A private endpoint gives nw-ai a private IP address in VNet1; it must be in the same region and subscription as the virtual network. Setting public network access to Disabled blocks all access from the internet. A private DNS zone for the `privatelink` subdomain, linked to VNet1, resolves the usual endpoint name to the private IP address, so the application keeps the same name.
    fr: |
      Un point de terminaison privé donne à nw-ai une adresse IP privée dans VNet1 ; il doit se trouver dans la même région et le même abonnement que le réseau virtuel. Définir l'accès réseau public sur Disabled bloque tout accès depuis Internet. Une zone DNS privée pour le sous-domaine `privatelink`, liée à VNet1, résout le nom habituel du point de terminaison vers l'adresse IP privée : l'application conserve le même nom.
  options:
    a:
      en: |
        Selected IP addresses still exposes the public endpoint, and traffic doesn't use a private IP address.
      fr: |
        Les adresses IP sélectionnées laissent le point de terminaison public exposé, et le trafic n'utilise pas d'adresse IP privée.
    c:
      en: |
        An NSG on the application's subnet doesn't control who can reach the public endpoint of nw-ai.
      fr: |
        Un groupe de sécurité réseau sur le sous-réseau de l'application ne contrôle pas qui peut joindre le point de terminaison public de nw-ai.
    e:
      en: |
        The trusted services exception lets some Azure services through the firewall; it doesn't create private connectivity.
      fr: |
        L'exception des services approuvés laisse passer certains services Azure à travers le pare-feu ; elle ne crée pas de connectivité privée.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
