id: ai103-1a-batch-job-order
objective: "1.2.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys must classify 80,000 archived customer letters with `gpt-4.1` at the lowest cost. Results are needed within a few days. A Global Batch deployment named **batch-gpt41** already exists, and you have prepared a JSONL file in which each line contains a `custom_id` and a Chat Completions request for batch-gpt41.

    Which three actions should you perform in sequence by using the OpenAI Python client? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Tailspin Toys doit classer 80 000 courriers clients archivés avec `gpt-4.1` au coût le plus bas. Les résultats sont attendus sous quelques jours. Un déploiement Global Batch nommé **batch-gpt41** existe déjà, et vous avez préparé un fichier JSONL dont chaque ligne contient un `custom_id` et une requête Chat Completions pour batch-gpt41.

    Quelles sont les trois actions à effectuer dans l'ordre à l'aide du client Python OpenAI ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: upload, text: { en: "Upload the JSONL file with `purpose=\"batch\"`.", fr: "Charger le fichier JSONL avec `purpose=\"batch\"`." } }
    - { id: create, text: { en: "Create the batch job with the input file ID and `completion_window=\"24h\"`.", fr: "Créer le travail par lots avec l'ID du fichier d'entrée et `completion_window=\"24h\"`." } }
    - { id: download, text: { en: "When the job is completed, download the file referenced by `output_file_id`.", fr: "Une fois le travail terminé, télécharger le fichier référencé par `output_file_id`." } }
    - { id: finetune, text: { en: "Upload the JSONL file with `purpose=\"fine-tune\"`.", fr: "Charger le fichier JSONL avec `purpose=\"fine-tune\"`." } }
    - { id: window, text: { en: "Create the batch job with `completion_window=\"1h\"`.", fr: "Créer le travail par lots avec `completion_window=\"1h\"`." } }
    - { id: standard, text: { en: "Create a Global Standard deployment of `gpt-4.1` for the job.", fr: "Créer un déploiement Global Standard de `gpt-4.1` pour le travail." } }
answer:
  sequence: [ upload, create, download ]
explanation:
  correct:
    en: |
      You upload the input file with the `batch` purpose, then create the batch job from its file ID with the endpoint and a completion window of `24h`, which is currently the only accepted value. You poll the status, and when the job completes you download the results from `output_file_id`, using `custom_id` to match each response to its request.
    fr: |
      Vous chargez le fichier d'entrée avec l'objectif `batch`, puis vous créez le travail par lots à partir de son ID de fichier avec le point de terminaison et une fenêtre d'achèvement de `24h`, seule valeur acceptée actuellement. Vous interrogez l'état, puis, quand le travail est terminé, vous téléchargez les résultats depuis `output_file_id`, en utilisant `custom_id` pour associer chaque réponse à sa requête.
  options:
    finetune:
      en: A batch input file must be uploaded with the `batch` purpose.
      fr: Un fichier d'entrée de lot doit être chargé avec l'objectif `batch`.
    window:
      en: Any completion window other than `24h` makes the job fail.
      fr: Toute fenêtre d'achèvement autre que `24h` fait échouer le travail.
    standard:
      en: Batch jobs require a Global Batch or Data Zone Batch deployment, which already exists.
      fr: Les travaux par lots nécessitent un déploiement Global Batch ou Data Zone Batch, qui existe déjà.
references:
  - title: Getting started with Azure OpenAI batch deployments
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/batch
