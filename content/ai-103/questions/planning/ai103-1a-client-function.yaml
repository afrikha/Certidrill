id: ai103-1a-client-function
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso Energy is building a mobile app for field technicians that uses a prompt agent. When a technician asks for a live reading, the app must read a diagnostic sensor over the phone's local Bluetooth connection and give the value to the agent. The sensor isn't reachable from the internet.

    Which tool should you use for the sensor reading?
  fr: |
    Contoso Energy crée une application mobile pour les techniciens de terrain qui utilise un agent d'invite. Quand un technicien demande une mesure en direct, l'application doit lire un capteur de diagnostic par la connexion Bluetooth locale du téléphone et transmettre la valeur à l'agent. Le capteur n'est pas joignable depuis Internet.

    Quel outil devez-vous utiliser pour la lecture du capteur ?
body:
  options:
    - { id: a, text: { en: "An MCP tool", fr: "Un outil MCP" } }
    - { id: b, text: { en: "An OpenAPI tool", fr: "Un outil OpenAPI" } }
    - { id: c, text: { en: "An Azure Functions tool", fr: "Un outil Azure Functions" } }
    - { id: d, text: { en: "A function tool (function calling)", fr: "Un outil de fonction (appel de fonction)" } }
answer: { optionId: d }
explanation:
  correct:
    en: Learn recommends native function tools when the connected client must perform the action. The agent returns a `function_call` item, the mobile app reads the sensor locally, and the app sends a `function_call_output` item with the same `call_id`.
    fr: Learn recommande les outils de fonction natifs quand c'est le client connecté qui doit effectuer l'action. L'agent renvoie un élément `function_call`, l'application mobile lit le capteur localement, puis envoie un élément `function_call_output` avec le même `call_id`.
  options:
    a:
      en: The Agent Service runtime calls remote MCP servers itself; it can't reach a sensor that is only available on the phone.
      fr: Le runtime d'Agent Service appelle lui-même des serveurs MCP distants ; il ne peut pas joindre un capteur accessible uniquement depuis le téléphone.
    b:
      en: An OpenAPI tool calls an HTTP API from the service side; the sensor exposes no reachable API.
      fr: Un outil OpenAPI appelle une API HTTP côté service ; le capteur n'expose aucune API joignable.
    c:
      en: Azure Functions runs serverless code in Azure, which can't access the phone's Bluetooth connection.
      fr: Azure Functions exécute du code serverless dans Azure, qui ne peut pas accéder à la connexion Bluetooth du téléphone.
references:
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
