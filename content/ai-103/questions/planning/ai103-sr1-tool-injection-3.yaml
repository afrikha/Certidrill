id: ai103-sr1-tool-injection-3
objective: "1.4.1"
type: series_yesno
series: ai103-sr1-tool-injection
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You assign a new guardrail with an Indirect attacks control to the gpt-main deployment.
  fr: Vous attribuez au déploiement gpt-main un nouveau garde-fou doté d'un contrôle Indirect attacks.
body:
  solution:
    en: |
      You create a guardrail named **gr-model** that contains an **Indirect attacks** control on the **Tool response** intervention point with the **Annotate and block** action. You assign gr-model to the gpt-main deployment in place of Microsoft.DefaultV2. gr-policy stays assigned to PolicyAgent.
    fr: |
      Vous créez un garde-fou nommé **gr-model** qui contient un contrôle **Indirect attacks** sur le point d'intervention **Tool response** avec l'action **Annotate and block**. Vous attribuez gr-model au déploiement gpt-main à la place de Microsoft.DefaultV2. gr-policy reste attribué à PolicyAgent.
answer: { value: false }
explanation:
  correct:
    en: An agent uses the guardrail assigned to it, and that guardrail fully overrides the guardrail of its model deployment, so PolicyAgent keeps using gr-policy only. In addition, tool call and tool response controls do not run for models, only for agents.
    fr: "Un agent utilise le garde-fou qui lui est attribué, et ce garde-fou remplace entièrement celui de son déploiement de modèle : PolicyAgent continue donc d'utiliser uniquement gr-policy. De plus, les contrôles Tool call et Tool response ne s'exécutent pas pour les modèles, uniquement pour les agents."
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
