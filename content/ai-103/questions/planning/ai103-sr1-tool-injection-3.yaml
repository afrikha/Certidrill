id: ai103-sr1-tool-injection-3
objective: "1.4.1"
type: series_yesno
series: ai103-sr1-tool-injection
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You add an Indirect attacks control to gr-policy, and PolicyChat appends the passages to the question text.
  fr: Vous ajoutez à gr-policy un contrôle Indirect attacks, et PolicyChat ajoute les passages au texte de la question.
body:
  solution:
    en: |
      In gr-policy, you add a control for the **Indirect attacks** risk on the **User input** intervention point and set the action to **Annotate and block**. PolicyChat doesn't change how it builds the prompt: it appends the retrieved passages to the employee's question in a single user message, as plain text.
    fr: |
      Dans gr-policy, vous ajoutez un contrôle pour le risque **Indirect attacks** sur le point d'intervention **User input** et définissez l'action sur **Annotate and block**. PolicyChat ne change pas la façon dont il construit l'invite : il ajoute les passages récupérés à la question de l'employé dans un seul message utilisateur, en texte brut.
answer: { value: false }
explanation:
  correct:
    en: Indirect attack detection applies to the content passed as documents. Some User input controls take effect only when the application includes document embeddings, so passages appended as plain text to the user's question aren't analyzed as documents, and the embedded instructions aren't reliably detected.
    fr: "La détection des attaques indirectes s'applique au contenu transmis sous forme de documents. Certains contrôles User input ne prennent effet que si l'application inclut des documents incorporés : des passages ajoutés en texte brut à la question de l'utilisateur ne sont pas analysés comme des documents, et les instructions incorporées ne sont pas détectées de façon fiable."
references:
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
  - title: Prompt Shields in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields
