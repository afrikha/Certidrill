id: ai103-1a-agent-tools-code
objective: "1.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is creating a prompt agent named **fleet-assistant** for its delivery drivers. The agent must:

    - answer from the vehicle manuals that the team uploaded to the vector store in `vector_store`, without any retrieval code written by the team;
    - get current public information, such as road closures, without a separate Bing resource or project connection.

    The `project` variable is an authenticated `AIProjectClient`. How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée un agent d'invite nommé **fleet-assistant** pour ses livreurs. L'agent doit :

    - répondre à partir des manuels des véhicules que l'équipe a chargés dans le magasin de vecteurs `vector_store`, sans code de récupération écrit par l'équipe ;
    - obtenir des informations publiques actuelles, comme les fermetures de routes, sans ressource Bing ni connexion de projet distincte.

    La variable `project` est un `AIProjectClient` authentifié. Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    agent = project.agents.create_version(
        agent_name="fleet-assistant",
        definition=PromptAgentDefinition(
            model="gpt-4.1-mini",
            instructions="Answer from the vehicle manuals. Use the web for current road information.",
            tools=[
                [[docs]],
                [[web]],
            ],
        ),
    )
  slots:
    - id: docs
      options:
        - { id: fs, text: "FileSearchTool(vector_store_ids=[vector_store.id])" }
        - { id: ci, text: "CodeInterpreterTool()" }
        - { id: fn, text: 'FunctionTool(name="search_manuals", parameters=schema)' }
    - id: web
      options:
        - { id: ws, text: "WebSearchTool()" }
        - { id: ci, text: "CodeInterpreterTool()" }
        - { id: fs, text: "FileSearchTool(vector_store_ids=[vector_store.id])" }
answer:
  values: { docs: fs, web: ws }
explanation:
  correct:
    en: "`FileSearchTool` grounds the agent on the files of a vector store; the service rewrites the query, runs hybrid search and reranks the chunks. `WebSearchTool` gives current public web information with inline citations and needs no separate Bing resource or project connection."
    fr: "`FileSearchTool` ancre l'agent sur les fichiers d'un magasin de vecteurs ; le service réécrit la requête, exécute une recherche hybride et réordonne les segments. `WebSearchTool` fournit des informations publiques actuelles du web avec des citations intégrées, sans ressource Bing ni connexion de projet distincte."
  options:
    docs:
      en: A function tool would require the team to write and run the retrieval code; code interpreter runs Python but doesn't search a vector store.
      fr: Un outil de fonction obligerait l'équipe à écrire et à exécuter le code de récupération ; l'interpréteur de code exécute du Python, mais ne fait pas de recherche dans un magasin de vecteurs.
    web:
      en: Code interpreter has no web search capability, and the vector store holds only the uploaded manuals.
      fr: L'interpréteur de code n'a pas de capacité de recherche web, et le magasin de vecteurs ne contient que les manuels chargés.
references:
  - title: File search tool for Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/file-search
  - title: Use web search tool in Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/web-search
