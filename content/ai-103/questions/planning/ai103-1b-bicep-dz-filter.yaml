id: ai103-1b-bicep-dz-filter
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has a Microsoft Foundry resource in an EU region. You are writing a Bicep file that deploys **gpt-4.1-mini** for a real-time chat application. The deployment must meet the following requirements:

    - Prompts and completions must be processed only in EU regions, in any of them.
    - Billing must be pay-per-token.
    - The custom content filter named **litware-strict**, which already exists in the resource, must apply to the deployment.

    How should you complete the Bicep file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'une ressource Microsoft Foundry dans une région de l'UE. Vous écrivez un fichier Bicep qui déploie **gpt-4.1-mini** pour une application de conversation en temps réel. Le déploiement doit répondre aux exigences suivantes :

    - Les invites et les complétions doivent être traitées uniquement dans des régions de l'UE, quelles qu'elles soient.
    - La facturation doit se faire au jeton consommé (pay-per-token).
    - Le filtre de contenu personnalisé nommé **litware-strict**, qui existe déjà dans la ressource, doit s'appliquer au déploiement.

    Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource chat 'Microsoft.CognitiveServices/accounts/deployments@2025-06-01' = {
      parent: foundry
      name: 'chat-eu'
      sku: {
        name: [[sku]]
        capacity: 50
      }
      properties: {
        model: {
          format: 'OpenAI'
          name: 'gpt-4.1-mini'
          version: '2025-04-14'
        }
        [[filter]]: 'litware-strict'
      }
    }
  slots:
    - id: sku
      options:
        - { id: gs, text: "'GlobalStandard'" }
        - { id: dzs, text: "'DataZoneStandard'" }
        - { id: dzb, text: "'DataZoneBatch'" }
        - { id: dzp, text: "'DataZoneProvisionedManaged'" }
    - id: filter
      options:
        - { id: rai, text: raiPolicyName }
        - { id: spill, text: spilloverDeploymentName }
        - { id: parent, text: parentDeploymentName }
        - { id: vuo, text: versionUpgradeOption }
answer:
  values: { sku: dzs, filter: rai }
explanation:
  correct:
    en: |
      Data Zone Standard (`DataZoneStandard`) processes data only within the Microsoft-specified data zone (here the EU) and is billed pay-per-token. The `raiPolicyName` property of the deployment names the content filter applied to its prompts and completions.
    fr: |
      Data Zone Standard (`DataZoneStandard`) traite les données uniquement dans la zone de données définie par Microsoft (ici l'UE) et est facturé au jeton. La propriété `raiPolicyName` du déploiement désigne le filtre de contenu appliqué à ses invites et complétions.
  options:
    gs: { en: "Global Standard can process requests in any Azure region, including outside the EU.", fr: "Global Standard peut traiter les requêtes dans n'importe quelle région Azure, y compris hors de l'UE." }
    dzb: { en: "Data Zone Batch is for asynchronous jobs with a 24-hour target, not for real-time chat.", fr: "Data Zone Batch sert aux traitements asynchrones avec un objectif de 24 heures, pas à la conversation en temps réel." }
    dzp: { en: "Provisioned types are billed per reserved PTU and per hour, not per token.", fr: "Les types provisionnés sont facturés par PTU réservée et par heure, pas au jeton." }
    spill: { en: "spilloverDeploymentName names the deployment that serves overflow requests of a provisioned deployment.", fr: "spilloverDeploymentName désigne le déploiement qui traite les requêtes en débordement d'un déploiement provisionné." }
    parent: { en: "parentDeploymentName refers to a parent deployment, not to a content filter.", fr: "parentDeploymentName fait référence à un déploiement parent, pas à un filtre de contenu." }
    vuo: { en: "versionUpgradeOption only accepts the model version upgrade policies.", fr: "versionUpgradeOption n'accepte que les stratégies de mise à niveau de version du modèle." }
references:
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: Microsoft.CognitiveServices/accounts/deployments - Bicep, ARM template & Terraform AzAPI reference
    url: https://learn.microsoft.com/en-us/azure/templates/microsoft.cognitiveservices/accounts/deployments
