id: ai103-1b-agent-new-model-order
objective: "1.2.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry project that contains an agent named **triage-agent**. The current version of triage-agent uses a deployment named **chat-v1** that runs **gpt-4o**. The project's Foundry resource has no deployment of **gpt-4.1**.

    You need a new version of triage-agent that uses gpt-4.1, and you must measure its quality against the current version before anyone relies on it. The current version must remain available.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un projet Foundry qui contient un agent nommé **triage-agent**. La version actuelle de triage-agent utilise un déploiement nommé **chat-v1** qui exécute **gpt-4o**. La ressource Foundry du projet n'a aucun déploiement de **gpt-4.1**.

    Vous avez besoin d'une nouvelle version de triage-agent qui utilise gpt-4.1, et vous devez mesurer sa qualité par rapport à la version actuelle avant que quiconque ne s'y fie. La version actuelle doit rester disponible.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: deploy, text: { en: "Deploy gpt-4.1 in the Foundry resource as a deployment named chat-v2.", fr: "Déployer gpt-4.1 dans la ressource Foundry sous la forme d'un déploiement nommé chat-v2." } }
    - { id: version, text: { en: "Create a new version of triage-agent whose definition sets the model to chat-v2.", fr: "Créer une nouvelle version de triage-agent dont la définition fixe le modèle sur chat-v2." } }
    - { id: eval, text: { en: "Evaluate the new version and the current version of triage-agent on the same test dataset.", fr: "Évaluer la nouvelle version et la version actuelle de triage-agent sur le même jeu de données de test." } }
    - { id: delete, text: { en: "Delete the earlier versions of triage-agent.", fr: "Supprimer les versions antérieures de triage-agent." } }
    - { id: upgrade, text: { en: "Set the version upgrade policy of chat-v1 to OnceNewDefaultVersionAvailable.", fr: "Définir la stratégie de mise à niveau de version de chat-v1 sur OnceNewDefaultVersionAvailable." } }
    - { id: dev, text: { en: "Change the deployment type of chat-v1 to Developer.", fr: "Changer le type de déploiement de chat-v1 en Developer." } }
answer:
  sequence: [ deploy, version, eval ]
explanation:
  correct:
    en: |
      An agent definition refers to a deployment by name, so gpt-4.1 must be deployed first. Creating a new version that points to chat-v2 leaves the current version unchanged. Evaluating both versions on the same dataset then shows whether the new version is better before it's used.
    fr: |
      Une définition d'agent fait référence à un déploiement par son nom : gpt-4.1 doit donc être déployé en premier. Créer une nouvelle version qui pointe vers chat-v2 laisse la version actuelle inchangée. Évaluer ensuite les deux versions sur le même jeu de données montre si la nouvelle version est meilleure avant son utilisation.
  options:
    delete: { en: "The current version must remain available, and deleting versions removes the baseline for the comparison.", fr: "La version actuelle doit rester disponible, et supprimer des versions retire la référence de la comparaison." }
    upgrade: { en: "A version upgrade policy moves to newer versions of the same model, not from gpt-4o to gpt-4.1.", fr: "Une stratégie de mise à niveau passe à des versions plus récentes du même modèle, pas de gpt-4o à gpt-4.1." }
    dev: { en: "The Developer type is only for evaluating fine-tuned models, and it doesn't change the model.", fr: "Le type Developer sert uniquement à évaluer des modèles affinés, et il ne change pas le modèle." }
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
