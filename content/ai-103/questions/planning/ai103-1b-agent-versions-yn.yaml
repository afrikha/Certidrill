id: ai103-1b-agent-versions-yn
objective: "1.2.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Proseware has a Foundry project that contains a prompt agent named **hr-helper**. Version 3 of hr-helper was created by calling `project.agents.create_version()` with a definition that uses the model deployment **chat-hr**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un projet Foundry qui contient un agent d'invite nommé **hr-helper**. La version 3 de hr-helper a été créée en appelant `project.agents.create_version()` avec une définition qui utilise le déploiement de modèle **chat-hr**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Calling `create_version()` for hr-helper with new instructions creates version 4 of the agent.
        fr: |
          Appeler `create_version()` pour hr-helper avec de nouvelles instructions crée la version 4 de l'agent.
    - id: s2
      text:
        en: |
          When version 4 is created, version 3 is deleted from the project.
        fr: |
          Lorsque la version 4 est créée, la version 3 est supprimée du projet.
    - id: s3
      text:
        en: |
          The `model` value in the agent definition refers to the name of a deployment in the project's Foundry resource.
        fr: |
          La valeur `model` de la définition de l'agent fait référence au nom d'un déploiement de la ressource Foundry du projet.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Every change to an agent creates a new version, and each version is an immutable snapshot that remains available, so you can compare versions or go back to an earlier one. The `model` of the definition is a deployment name, which is why you deploy a model before creating the agent that uses it.
    fr: |
      Chaque modification d'un agent crée une nouvelle version, et chaque version est un instantané immuable qui reste disponible : vous pouvez comparer les versions ou revenir à une version antérieure. Le `model` de la définition est un nom de déploiement : c'est pourquoi vous déployez un modèle avant de créer l'agent qui l'utilise.
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
  - title: Agent applications in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/publish-agent
