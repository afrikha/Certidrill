id: ai103-1b-metrics-dd
objective: "1.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Relecloud has a Microsoft Foundry resource with a Global Provisioned deployment and several Global Standard deployments. The content filters of some deployments run in annotate mode, and others block content.

    You are building an Azure Monitor workbook. Which metric should you use for each chart? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Relecloud dispose d'une ressource Microsoft Foundry avec un déploiement Global Provisioned et plusieurs déploiements Global Standard. Les filtres de contenu de certains déploiements fonctionnent en mode annotation, d'autres bloquent le contenu.

    Vous créez un classeur Azure Monitor. Quelle métrique devez-vous utiliser pour chaque graphique ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Calls detected as harmful, whether blocked or only annotated: [[harm]]
      Time until the first part of a streamed response appears: [[lat]]
      Saturation of the provisioned deployment: [[ptu]]
    fr: |
      Appels détectés comme nuisibles, qu'ils soient bloqués ou seulement annotés : [[harm]]
      Délai avant l'apparition de la première partie d'une réponse en streaming : [[lat]]
      Saturation du déploiement provisionné : [[ptu]]
  slots:
    - id: harm
      options:
        - { id: harmful, text: Harmful Volume Detected }
        - { id: blocked, text: Blocked Volume }
        - { id: requests, text: Azure OpenAI Requests }
    - id: lat
      options:
        - { id: ttr, text: Time to Response }
        - { id: ttlb, text: Time to Last Byte }
        - { id: tokens, text: Processed Inference Tokens }
    - id: ptu
      options:
        - { id: util, text: Provisioned-managed Utilization V2 }
        - { id: prompt, text: Processed Prompt Tokens }
        - { id: req2, text: Azure OpenAI Requests }
answer:
  values: { harm: harmful, lat: ttr, ptu: util }
explanation:
  correct:
    en: |
      Harmful Volume Detected counts calls detected as harmful by the content filter in both block and annotate modes. Time to Response is the recommended responsiveness measure for streaming requests: the time until the first response appears. Provisioned-managed Utilization V2 is PTUs consumed divided by PTUs deployed; at 100 % or more, calls are throttled with 429.
    fr: |
      Harmful Volume Detected compte les appels détectés comme nuisibles par le filtre de contenu, en mode blocage comme en mode annotation. Time to Response est la mesure de réactivité recommandée pour les requêtes en streaming : le délai avant l'apparition de la première réponse. Provisioned-managed Utilization V2 correspond aux PTU consommées divisées par les PTU déployées ; à partir de 100 %, les appels sont limités avec une erreur 429.
  options:
    blocked: { en: "Blocked Volume counts only the calls rejected by the filter, not the annotated ones.", fr: "Blocked Volume ne compte que les appels rejetés par le filtre, pas ceux qui sont annotés." }
    requests: { en: "Azure OpenAI Requests counts all calls, harmful or not.", fr: "Azure OpenAI Requests compte tous les appels, nuisibles ou non." }
    ttlb: { en: "Time to Last Byte measures the time until the end of the response, not the first part.", fr: "Time to Last Byte mesure le délai jusqu'à la fin de la réponse, pas jusqu'à sa première partie." }
    tokens: { en: "Processed Inference Tokens counts tokens, not latency.", fr: "Processed Inference Tokens compte des jetons, pas la latence." }
    prompt: { en: "Processed Prompt Tokens counts input tokens; it doesn't relate them to the PTUs deployed.", fr: "Processed Prompt Tokens compte les jetons d'entrée ; il ne les rapporte pas aux PTU déployées." }
    req2: { en: "A request count doesn't show how much of the reserved capacity is used.", fr: "Un nombre de requêtes ne montre pas quelle part de la capacité réservée est utilisée." }
references:
  - title: Monitoring data reference for Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/openai/monitor-openai-reference
  - title: Monitor Azure OpenAI in Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/monitor-openai
