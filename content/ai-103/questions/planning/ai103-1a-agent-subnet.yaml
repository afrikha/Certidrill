id: ai103-1a-agent-subnet
objective: "1.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans private networking for Foundry Agent Service with a customer-managed virtual network named **vnet-ai**. You are designing the subnet into which the agent runtime will be injected for the Foundry resource **contoso-ai**.

    Which two requirements must the subnet meet? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit une mise en réseau privée pour Foundry Agent Service avec un réseau virtuel géré par le client nommé **vnet-ai**. Vous concevez le sous-réseau dans lequel le runtime des agents sera injecté pour la ressource Foundry **contoso-ai**.

    Quelles sont les deux exigences que le sous-réseau doit respecter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It is delegated to `Microsoft.App/environments`.", fr: "Il est délégué à `Microsoft.App/environments`." } }
    - { id: b, text: { en: "It is delegated to `Microsoft.Web/serverFarms`.", fr: "Il est délégué à `Microsoft.Web/serverFarms`." } }
    - { id: c, text: { en: "It has a size of /27 or larger.", fr: "Sa taille est /27 ou plus grande." } }
    - { id: d, text: { en: "It is shared with the agent subnets of the other Foundry resources in the region.", fr: "Il est partagé avec les sous-réseaux d'agents des autres ressources Foundry de la région." } }
    - { id: e, text: { en: "It has a size of /29 to limit address consumption.", fr: "Sa taille est /29 pour limiter la consommation d'adresses." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: The agent subnet must be delegated to `Microsoft.App/environments` and be /27 or larger; Learn suggests /24 or larger as a starting point for production. Each Foundry resource needs its own dedicated agent subnet.
    fr: Le sous-réseau des agents doit être délégué à `Microsoft.App/environments` et avoir une taille /27 ou plus grande ; Learn suggère /24 ou plus comme point de départ en production. Chaque ressource Foundry a besoin de son propre sous-réseau d'agents dédié.
  options:
    b:
      en: "`Microsoft.Web/serverFarms` is the delegation used by App Service virtual network integration, not by agent injection."
      fr: "`Microsoft.Web/serverFarms` est la délégation utilisée par l'intégration de réseau virtuel d'App Service, pas par l'injection des agents."
    d:
      en: The agent subnet can't be shared by multiple Foundry resources.
      fr: Le sous-réseau des agents ne peut pas être partagé par plusieurs ressources Foundry.
    e:
      en: A /29 subnet is smaller than the /27 minimum.
      fr: Un sous-réseau /29 est plus petit que le minimum de /27.
references:
  - title: Set up private networking for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/virtual-networks
