id: ai103-1c-enforced-tool-limits
objective: "1.4.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation has an agent named **crm-agent** in Foundry Agent Service. crm-agent uses an MCP server that exposes the tools read_account, update_account, and delete_account. The connection uses the agent identity of crm-agent, and the CRM API authorizes each call by the app roles assigned to the caller: Accounts.Read, Accounts.Write, and Accounts.Delete.

    crm-agent must never delete an account, even if a prompt injection persuades the model to try.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation dispose d'un agent nommé **crm-agent** dans Foundry Agent Service. crm-agent utilise un serveur MCP qui expose les outils read_account, update_account et delete_account. La connexion utilise l'identité d'agent de crm-agent, et l'API CRM autorise chaque appel selon les rôles d'application attribués à l'appelant : Accounts.Read, Accounts.Write et Accounts.Delete.

    crm-agent ne doit jamais supprimer un compte, même si une injection d'invite persuade le modèle d'essayer.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Set allowed_tools to [\"read_account\", \"update_account\"] in the MCPTool.", fr: "Définir allowed_tools sur [\"read_account\", \"update_account\"] dans le MCPTool." }
    - id: b
      text: { en: "Add \"Never delete an account\" to the instructions of crm-agent.", fr: "Ajouter « Ne supprime jamais un compte » aux instructions de crm-agent." }
    - id: c
      text: { en: "Assign only the Accounts.Read and Accounts.Write app roles to the agent identity.", fr: "Attribuer uniquement les rôles d'application Accounts.Read et Accounts.Write à l'identité d'agent." }
    - id: d
      text: { en: "Run the Prohibited Actions evaluator on the conversations of crm-agent every week.", fr: "Exécuter chaque semaine l'évaluateur Prohibited Actions sur les conversations de crm-agent." }
    - id: e
      text: { en: "Connect Application Insights and alert on traces that contain delete_account.", fr: "Connecter Application Insights et créer une alerte sur les traces qui contiennent delete_account." }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      A nonempty `allowed_tools` list removes delete_account from the tools that the agent can call. Without the Accounts.Delete app role, the CRM API rejects any delete call from the agent identity. Both controls are enforced outside the model, so a prompt injection can't bypass them.
    fr: |
      Une liste `allowed_tools` non vide retire delete_account des outils que l'agent peut appeler. Sans le rôle d'application Accounts.Delete, l'API CRM refuse tout appel de suppression provenant de l'identité d'agent. Les deux contrôles s'appliquent en dehors du modèle : une injection d'invite ne peut pas les contourner.
  options:
    b:
      en: |
        Instructions guide the model but don't technically prevent a call; an injected prompt can override them.
      fr: |
        Les instructions guident le modèle mais n'empêchent pas techniquement un appel ; une invite injectée peut les supplanter.
    d:
      en: |
        An evaluator detects prohibited actions after they happen; it doesn't prevent them.
      fr: |
        Un évaluateur détecte les actions interdites après coup ; il ne les empêche pas.
    e:
      en: |
        An alert reports a deletion that already happened.
      fr: |
        Une alerte signale une suppression déjà effectuée.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
  - title: Agent identity concepts in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/agent-identity
