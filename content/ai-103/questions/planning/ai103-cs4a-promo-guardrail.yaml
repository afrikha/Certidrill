id: ai103-cs4a-promo-guardrail
objective: "1.4.1"
type: yesno_statements
caseStudy: ai103-cs4a-southridge
difficulty: 3
status: draft
stem:
  en: |
    You are preparing the promotional safety requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez l'exigence relative à la sécurité des contenus promotionnels. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Before gr-promo is assigned, risks in the conversations of promo-agent are detected by using the controls of Microsoft.DefaultV2.
        fr: |
          Avant l'attribution de gr-promo, les risques des conversations de promo-agent sont détectés à l'aide des contrôles de Microsoft.DefaultV2.
    - id: s2
      text:
        en: |
          After gr-promo is assigned to promo-agent, the controls of Microsoft.DefaultV2 still run on the conversations of promo-agent in addition to the controls of gr-promo.
        fr: |
          Après l'attribution de gr-promo à promo-agent, les contrôles de Microsoft.DefaultV2 s'exécutent toujours sur les conversations de promo-agent, en plus des contrôles de gr-promo.
    - id: s3
      text:
        en: |
          A control in gr-promo with the Annotate action labels flagged content in the responses of promo-agent and still returns that content.
        fr: |
          Un contrôle de gr-promo avec l'action Annotate étiquette le contenu signalé dans les réponses de promo-agent et renvoie quand même ce contenu.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      An agent without its own guardrail inherits the guardrail of its model deployment, so promo-agent currently uses Microsoft.DefaultV2 through chat-main. A guardrail assigned to an agent fully overrides the guardrail of the underlying model, so the controls of Microsoft.DefaultV2 no longer apply to promo-agent. The Annotate action applies only to models; for agents, the available action is Annotate and block.
    fr: |
      Un agent sans garde-fou propre hérite du garde-fou de son déploiement de modèle : promo-agent utilise donc actuellement Microsoft.DefaultV2 par l'intermédiaire de chat-main. Un garde-fou attribué à un agent remplace entièrement celui du modèle sous-jacent : les contrôles de Microsoft.DefaultV2 ne s'appliquent plus à promo-agent. L'action Annotate ne s'applique qu'aux modèles ; pour les agents, l'action disponible est Annotate and block.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
