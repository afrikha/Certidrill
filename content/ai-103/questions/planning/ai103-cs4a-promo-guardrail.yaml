id: ai103-cs4a-promo-guardrail
objective: "1.4.1"
type: yesno_statements
caseStudy: ai103-cs4a-southridge
difficulty: 3
status: draft
stem:
  en: |
    You are preparing the promotional safety requirement. For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous préparez l'exigence relative à la sécurité des contenus promotionnels. Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Before gr-promo is assigned, Microsoft.DefaultV2 blocks completions of chat-main that contain Violence content of medium or high severity.
        fr: |
          Avant l'attribution de gr-promo, Microsoft.DefaultV2 bloque les complétions de chat-main qui contiennent du contenu Violence de gravité moyenne ou élevée.
    - id: s2
      text:
        en: |
          A control in gr-promo with the Annotate action labels flagged content in the completions of chat-main and still returns that content.
        fr: |
          Un contrôle de gr-promo avec l'action Annotate étiquette le contenu signalé dans les complétions de chat-main et renvoie quand même ce contenu.
    - id: s3
      text:
        en: |
          gr-promo can contain a control that scans the Tool call intervention point of chat-main.
        fr: |
          gr-promo peut contenir un contrôle qui analyse le point d'intervention Tool call de chat-main.
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: |
      Microsoft.DefaultV2 filters the four harm categories, Violence included, at the Medium blocking level on prompts and completions, which blocks medium and high severity. For model deployments, the Annotate action labels the detected content and doesn't block it. The Tool call and Tool response intervention points apply only to agents (preview), not to model deployments.
    fr: |
      Microsoft.DefaultV2 filtre les quatre catégories de préjudice, dont Violence, au niveau de blocage Medium sur les invites et les complétions, ce qui bloque les gravités moyenne et élevée. Pour les déploiements de modèles, l'action Annotate étiquette le contenu détecté sans le bloquer. Les points d'intervention Tool call et Tool response ne s'appliquent qu'aux agents (préversion), pas aux déploiements de modèles.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/foundry/guardrails/intervention-points
