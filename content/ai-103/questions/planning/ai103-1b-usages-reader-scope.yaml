id: ai103-1b-usages-reader-scope
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Northwind Traders, a FinOps analyst must see how much model quota is used and still available in the subscription that hosts the company's Microsoft Foundry resources. The analyst must not be able to change any resource.

    You assign the **Cognitive Services Usages Reader** role to the analyst on the resource group **rg-ai** that contains the Foundry resources. The analyst still can't see the quota.

    What should you do?
  fr: |
    Chez Northwind Traders, une analyste FinOps doit voir la part du quota de modèles utilisée et encore disponible dans l'abonnement qui héberge les ressources Microsoft Foundry de l'entreprise. Elle ne doit pouvoir modifier aucune ressource.

    Vous attribuez le rôle **Cognitive Services Usages Reader** à l'analyste sur le groupe de ressources **rg-ai** qui contient les ressources Foundry. L'analyste ne voit toujours pas le quota.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Cognitive Services Usages Reader at the subscription scope.", fr: "Attribuer Cognitive Services Usages Reader à l'étendue de l'abonnement." } }
    - { id: b, text: { en: "Assign Foundry User on each Foundry resource.", fr: "Attribuer Foundry User sur chaque ressource Foundry." } }
    - { id: c, text: { en: "Assign Reader on the rg-ai resource group.", fr: "Attribuer Reader sur le groupe de ressources rg-ai." } }
    - { id: d, text: { en: "Assign Cognitive Services Contributor on each Foundry resource.", fr: "Attribuer Cognitive Services Contributor sur chaque ressource Foundry." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Quota is read through a subscription-scoped Usages API, which doesn't honor assignments at the resource group, resource or project scope. Cognitive Services Usages Reader assigned at the subscription scope is the least-privileged way to view quota.
    fr: |
      Le quota est lu au moyen d'une API Usages à l'étendue de l'abonnement, qui ne tient pas compte des attributions à l'étendue d'un groupe de ressources, d'une ressource ou d'un projet. Cognitive Services Usages Reader attribué à l'étendue de l'abonnement est le moyen le moins privilégié de consulter le quota.
  options:
    b:
      en: |
        Foundry User grants data actions in projects, not access to the subscription-scoped usage data.
      fr: |
        Foundry User accorde des actions de données dans les projets, pas l'accès aux données d'utilisation à l'étendue de l'abonnement.
    c:
      en: |
        A resource group assignment doesn't authorize the subscription-scoped Usages API.
      fr: |
        Une attribution sur un groupe de ressources n'autorise pas l'API Usages à l'étendue de l'abonnement.
    d:
      en: |
        A contributor role lets the analyst change resources, which isn't allowed.
      fr: |
        Un rôle de contributeur permet à l'analyste de modifier des ressources, ce qui n'est pas autorisé.
references:
  - title: Manage Azure OpenAI in Microsoft Foundry Models quota (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/quota
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
