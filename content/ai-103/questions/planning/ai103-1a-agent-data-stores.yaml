id: ai103-1a-agent-data-stores
objective: "1.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has two Foundry projects. **pilot-prj** uses the basic agent setup. **prod-prj** uses the standard agent setup with Contoso's own resources. The security team asks where each type of agent data is stored.

    How should you complete the answer? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose de deux projets Foundry. **pilot-prj** utilise la configuration d'agent de base. **prod-prj** utilise la configuration d'agent standard avec les ressources de Contoso. L'équipe de sécurité demande où chaque type de données d'agent est stocké.

    Comment devez-vous compléter la réponse ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Conversation messages of pilot-prj: [[pilotmsg]]

      Vector stores created by the agents of prod-prj: [[prodvec]]

      Conversation history and agent metadata of prod-prj: [[prodhist]]
    fr: |
      Messages des conversations de pilot-prj : [[pilotmsg]]

      Magasins de vecteurs créés par les agents de prod-prj : [[prodvec]]

      Historique des conversations et métadonnées des agents de prod-prj : [[prodhist]]
  slots:
    - id: pilotmsg
      options:
        - { id: managed, text: { en: "Microsoft-managed multitenant storage", fr: "Un stockage multilocataire géré par Microsoft" } }
        - { id: cosmos, text: { en: "Contoso's Azure Cosmos DB for NoSQL account", fr: "Le compte Azure Cosmos DB for NoSQL de Contoso" } }
        - { id: search, text: { en: "Contoso's Azure AI Search service", fr: "Le service Azure AI Search de Contoso" } }
        - { id: storage, text: { en: "Contoso's Azure Storage account", fr: "Le compte Stockage Azure de Contoso" } }
    - id: prodvec
      options:
        - { id: managed, text: { en: "Microsoft-managed multitenant storage", fr: "Un stockage multilocataire géré par Microsoft" } }
        - { id: cosmos, text: { en: "Contoso's Azure Cosmos DB for NoSQL account", fr: "Le compte Azure Cosmos DB for NoSQL de Contoso" } }
        - { id: search, text: { en: "Contoso's Azure AI Search service", fr: "Le service Azure AI Search de Contoso" } }
        - { id: storage, text: { en: "Contoso's Azure Storage account", fr: "Le compte Stockage Azure de Contoso" } }
    - id: prodhist
      options:
        - { id: managed, text: { en: "Microsoft-managed multitenant storage", fr: "Un stockage multilocataire géré par Microsoft" } }
        - { id: cosmos, text: { en: "Contoso's Azure Cosmos DB for NoSQL account", fr: "Le compte Azure Cosmos DB for NoSQL de Contoso" } }
        - { id: search, text: { en: "Contoso's Azure AI Search service", fr: "Le service Azure AI Search de Contoso" } }
        - { id: storage, text: { en: "Contoso's Azure Storage account", fr: "Le compte Stockage Azure de Contoso" } }
answer:
  values: { pilotmsg: managed, prodvec: search, prodhist: cosmos }
explanation:
  correct:
    en: With the basic agent setup, threads, messages and files are stored in Microsoft-managed multitenant storage. With the standard setup, Azure AI Search holds the vector stores created by the agents, Azure Cosmos DB holds messages, conversation history and agent metadata, and Azure Storage holds the uploaded files.
    fr: Avec la configuration d'agent de base, les threads, les messages et les fichiers sont stockés dans un stockage multilocataire géré par Microsoft. Avec la configuration standard, Azure AI Search contient les magasins de vecteurs créés par les agents, Azure Cosmos DB contient les messages, l'historique des conversations et les métadonnées des agents, et Stockage Azure contient les fichiers chargés.
references:
  - title: Set up standard agent resources for Foundry Agent Service
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/standard-agent-setup
  - title: Microsoft Foundry architecture
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture
