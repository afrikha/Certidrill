id: ai103-1c-citation-source-url
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an agent in Foundry Agent Service that answers from an Azure AI Search index named **kb-index** by using the Azure AI Search tool. The index has the fields id, content, contentVector, and title. The instructions of the agent tell it to cite its sources, and the application reads the `url_citation` annotations of each response.

    Auditors require each answer to link to the source document that supports it. Today, the answers contain citation markers but no link.

    What should you do?
  fr: |
    Northwind Traders dispose d'un agent dans Foundry Agent Service qui répond à partir d'un index Azure AI Search nommé **kb-index** au moyen de l'outil Azure AI Search. L'index comporte les champs id, content, contentVector et title. Les instructions de l'agent lui demandent de citer ses sources, et l'application lit les annotations `url_citation` de chaque réponse.

    Les auditeurs exigent que chaque réponse contienne un lien vers le document source qui l'étaye. Aujourd'hui, les réponses contiennent des marqueurs de citation, mais aucun lien.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Make the title field searchable and filterable in kb-index.", fr: "Rendre le champ title interrogeable et filtrable dans kb-index." }
    - id: b
      text: { en: "Add a retrievable field that contains the source URL of each document to kb-index.", fr: "Ajouter à kb-index un champ récupérable qui contient l'URL source de chaque document." }
    - id: c
      text: { en: "Set OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT to true in the application.", fr: "Définir OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT sur true dans l'application." }
    - id: d
      text: { en: "Set the query type of the Azure AI Search tool to semantic.", fr: "Définir le type de requête de l'outil Azure AI Search sur semantic." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      For citations to include a link, the index needs a retrievable field that holds the source URL (and optionally a title field). The `url_citation` annotations then carry the URL, with the start and end index of the cited text, so the application can show a link to each source.
    fr: |
      Pour que les citations contiennent un lien, l'index a besoin d'un champ récupérable qui contient l'URL source (et éventuellement d'un champ de titre). Les annotations `url_citation` portent alors l'URL, avec l'index de début et de fin du texte cité, et l'application peut afficher un lien vers chaque source.
  options:
    a:
      en: |
        A title can label the citation, but without a source URL field there is still no link to the document.
      fr: |
        Un titre peut libeller la citation, mais sans champ d'URL source il n'y a toujours aucun lien vers le document.
    c:
      en: |
        Content recording adds message contents to the traces; it doesn't change the citations returned to the user.
      fr: |
        L'enregistrement du contenu ajoute le contenu des messages aux traces ; il ne modifie pas les citations renvoyées à l'utilisateur.
    d:
      en: |
        The query type changes how documents are ranked, not which fields a citation can include.
      fr: |
        Le type de requête modifie le classement des documents, pas les champs qu'une citation peut inclure.
references:
  - title: Connect an Azure AI Search index to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/ai-search
