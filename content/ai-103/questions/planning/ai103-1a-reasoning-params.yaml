id: ai103-1a-reasoning-params
objective: "1.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware uses an `o4-mini` deployment named **planner-o4-mini** to build maintenance plans for wind turbines. The plans are hard multistep problems, and their quality matters more than latency. To control cost, each request must cap the total number of tokens that the model generates, including its reasoning tokens.

    The `client` variable is an authenticated OpenAI client for the Foundry resource. The application uses the Chat Completions API.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise un déploiement `o4-mini` nommé **planner-o4-mini** pour établir des plans de maintenance d'éoliennes. Ces plans sont des problèmes complexes en plusieurs étapes, et leur qualité compte plus que la latence. Pour maîtriser les coûts, chaque requête doit plafonner le nombre total de jetons générés par le modèle, y compris ses jetons de raisonnement.

    La variable `client` est un client OpenAI authentifié pour la ressource Foundry. L'application utilise l'API Chat Completions.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    response = client.chat.completions.create(
        model="planner-o4-mini",
        messages=[
            {"role": "developer", "content": "You plan maintenance for wind turbines."},
            {"role": "user", "content": request_text},
        ],
        [[effort]],
        [[limit]]=8000,
    )
  slots:
    - id: effort
      options:
        - { id: high, text: 'reasoning_effort="high"' }
        - { id: low, text: 'reasoning_effort="low"' }
        - { id: temp, text: "temperature=0.2" }
        - { id: topp, text: "top_p=0.9" }
    - id: limit
      options:
        - { id: mct, text: max_completion_tokens }
        - { id: mt, text: max_tokens }
        - { id: mot, text: max_output_tokens }
answer:
  values: { effort: high, limit: mct }
explanation:
  correct:
    en: "`reasoning_effort` controls how much the model thinks before it answers; `high` is meant for hard reasoning and deep planning where quality matters more than latency. With the Chat Completions API, `max_completion_tokens` caps everything the model generates, reasoning tokens included."
    fr: "`reasoning_effort` contrôle le temps de réflexion du modèle avant sa réponse ; `high` est destiné au raisonnement difficile et à la planification approfondie, quand la qualité compte plus que la latence. Avec l'API Chat Completions, `max_completion_tokens` plafonne tout ce que le modèle génère, jetons de raisonnement compris."
  options:
    effort:
      en: "`low` reduces the thinking effort, the opposite of the requirement. Reasoning models other than GPT-6 Astra don't support `temperature` or `top_p`."
      fr: "`low` réduit l'effort de réflexion, à l'inverse de l'exigence. Les modèles de raisonnement autres que GPT-6 Astra ne prennent pas en charge `temperature` ni `top_p`."
    limit:
      en: "`max_tokens` isn't supported by reasoning models, and `max_output_tokens` is the parameter of the Responses API, not of Chat Completions."
      fr: "`max_tokens` n'est pas pris en charge par les modèles de raisonnement, et `max_output_tokens` est le paramètre de l'API Responses, pas de Chat Completions."
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
