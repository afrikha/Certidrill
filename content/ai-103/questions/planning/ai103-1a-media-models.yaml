id: ai103-1a-media-models
objective: "1.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    The marketing and support teams of Fourth Coffee need three new capabilities in their Foundry project.

    Which model should you deploy for each capability? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les équipes marketing et support de Fourth Coffee ont besoin de trois nouvelles fonctionnalités dans leur projet Foundry.

    Quel modèle devez-vous déployer pour chaque fonctionnalité ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Generate a 10-second product clip from a text prompt: [[video]]

      Transcribe recorded support calls into text: [[stt]]

      Find catalog items whose description is similar to a customer's request: [[similar]]
    fr: |
      Générer un clip produit de 10 secondes à partir d'une invite textuelle : [[video]]

      Transcrire en texte les appels de support enregistrés : [[stt]]

      Trouver les articles du catalogue dont la description ressemble à la demande d'un client : [[similar]]
  slots:
    - id: video
      options:
        - { id: sora, text: sora-2 }
        - { id: image, text: gpt-image-1 }
        - { id: gpt, text: gpt-4.1 }
    - id: stt
      options:
        - { id: tts, text: gpt-4o-mini-tts }
        - { id: whisper, text: whisper }
        - { id: image, text: gpt-image-1 }
    - id: similar
      options:
        - { id: nano, text: gpt-4.1-nano }
        - { id: sora, text: sora-2 }
        - { id: emb, text: text-embedding-3-small }
answer:
  values: { video: sora, stt: whisper, similar: emb }
explanation:
  correct:
    en: "`sora-2` (preview) generates video from text. `whisper` is a speech-to-text model of the audio API. `text-embedding-3-small` turns descriptions into vectors, so similar items can be found by vector similarity."
    fr: "`sora-2` (préversion) génère de la vidéo à partir de texte. `whisper` est un modèle de reconnaissance vocale de l'API audio. `text-embedding-3-small` transforme les descriptions en vecteurs, ce qui permet de trouver les articles similaires par similarité vectorielle."
  options:
    video:
      en: "`gpt-image-1` creates still images, and `gpt-4.1` generates text."
      fr: "`gpt-image-1` crée des images fixes, et `gpt-4.1` génère du texte."
    stt:
      en: "`gpt-4o-mini-tts` does the opposite (text to speech), and `gpt-image-1` generates images."
      fr: "`gpt-4o-mini-tts` fait l'inverse (synthèse vocale), et `gpt-image-1` génère des images."
    similar:
      en: "`gpt-4.1-nano` generates text rather than comparable vectors, and `sora-2` generates video."
      fr: "`gpt-4.1-nano` génère du texte plutôt que des vecteurs comparables, et `sora-2` génère de la vidéo."
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
