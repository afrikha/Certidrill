id: ai103-1b-rate-limit-yn
objective: "1.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fourth Coffee has a Global Standard deployment named **menu-chat**. The deployment has 60,000 tokens per minute (TPM), which gives it a limit of 360 requests per minute (RPM). A typical request sends 800 input tokens and generates about 300 output tokens.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fourth Coffee dispose d'un déploiement Global Standard nommé **menu-chat**. Le déploiement dispose de 60 000 jetons par minute (TPM), ce qui lui donne une limite de 360 requêtes par minute (RPM). Une requête type envoie 800 jetons d'entrée et génère environ 300 jetons de sortie.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          Setting `max_output_tokens` to 4,000 in each request makes each request count 4,000 output tokens against the TPM limit.
        fr: |
          Définir `max_output_tokens` sur 4 000 dans chaque requête fait compter 4 000 jetons de sortie par requête dans la limite de TPM.
    - id: s2
      text:
        en: |
          menu-chat can return HTTP 429 when it receives 20 requests within one second, even if it receives fewer than 360 requests in that minute.
        fr: |
          menu-chat peut renvoyer HTTP 429 lorsqu'il reçoit 20 requêtes en une seconde, même s'il reçoit moins de 360 requêtes au cours de cette minute.
    - id: s3
      text:
        en: |
          Requests that receive HTTP 429 don't count toward the rate limit of menu-chat.
        fr: |
          Les requêtes qui reçoivent HTTP 429 ne sont pas comptabilisées dans la limite de débit de menu-chat.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      The token limit is evaluated on the actual input and generated tokens; a higher output-token limit doesn't reserve tokens against TPM. Requests are evaluated over short windows, typically 1 or 10 seconds, so 360 RPM allows about 6 requests per second and a burst of 20 in one second can be throttled. Unsuccessful requests still count toward the limit, which is why clients must back off instead of resending immediately.
    fr: |
      La limite de jetons est évaluée sur les jetons d'entrée et générés réels ; une limite de jetons de sortie plus élevée ne réserve pas de jetons dans les TPM. Les requêtes sont évaluées sur de courtes fenêtres, en général 1 ou 10 secondes : 360 RPM autorisent environ 6 requêtes par seconde, et une rafale de 20 en une seconde peut être limitée. Les requêtes en échec sont quand même comptabilisées, c'est pourquoi les clients doivent temporiser au lieu de renvoyer immédiatement.
references:
  - title: Manage Azure OpenAI in Microsoft Foundry Models quota (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/quota
