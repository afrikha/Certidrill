id: ai103-1b-reranker-threshold
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Trey Research grounds an agent with hybrid queries against an Azure AI Search index. The queries use the semantic ranker. Relevance tests show that the agent receives many results that are only loosely related to the question.

    You need to keep only the results that answer the question at least partially. The same rule must work for any query.

    Which condition should the retrieval code apply to each result?
  fr: |
    Trey Research ancre un agent au moyen de requêtes hybrides sur un index Azure AI Search. Les requêtes utilisent le classeur sémantique. Des tests de pertinence montrent que l'agent reçoit de nombreux résultats seulement vaguement liés à la question.

    Vous devez conserver uniquement les résultats qui répondent au moins partiellement à la question. La même règle doit fonctionner pour n'importe quelle requête.

    Quelle condition le code de récupération doit-il appliquer à chaque résultat ?
body:
  options:
    - { id: a, text: "`@search.rerankerScore` >= 2.0" }
    - { id: b, text: "`@search.score` >= 2.0" }
    - { id: c, text: "`@search.rerankerScore` >= 0.5" }
    - { id: d, text: "`@search.score` >= 0.5" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The semantic ranker assigns `@search.rerankerScore` on a fixed scale from 0 to 4: 2 means the document answers the question partially or addresses some aspects of it, 1 means it's related and answers only a small part, and 0 means irrelevant. A threshold of 2 keeps partial or better answers; Microsoft advises against making such thresholds too granular because the score distribution can vary slightly.
    fr: |
      Le classeur sémantique attribue `@search.rerankerScore` sur une échelle fixe de 0 à 4 : 2 signifie que le document répond partiellement à la question ou en traite certains aspects, 1 qu'il est lié et n'en couvre qu'une petite partie, et 0 qu'il n'est pas pertinent. Un seuil de 2 conserve les réponses partielles ou meilleures ; Microsoft déconseille des seuils trop fins, car la distribution des scores peut varier légèrement.
  options:
    b:
      en: |
        For a hybrid query, `@search.score` is the RRF fusion score, a small value on no fixed scale, so a threshold of 2.0 isn't meaningful across queries.
      fr: |
        Pour une requête hybride, `@search.score` est le score de fusion RRF, une petite valeur sans échelle fixe : un seuil de 2,0 n'a pas de sens d'une requête à l'autre.
    c:
      en: |
        A reranker score of 1 means related but answering only a small part, so 0.5 keeps the loosely related results.
      fr: |
        Un score de reclassement de 1 signifie lié mais ne répondant qu'à une petite partie : 0,5 conserve donc les résultats vaguement liés.
    d:
      en: |
        The RRF score of a hybrid query doesn't measure whether a document answers the question.
      fr: |
        Le score RRF d'une requête hybride ne mesure pas si un document répond à la question.
references:
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
