id: ai103-1b-keys-bypass-rbac
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Foundry resource named **tailspin-ai**. The security policy states that only identities that have a Foundry role assigned may call the models of tailspin-ai. Some older applications still call the models by using an API key.

    You need to enforce the policy on tailspin-ai.

    What should you do?
  fr: |
    Tailspin Toys dispose d'une ressource Microsoft Foundry nommée **tailspin-ai**. La stratégie de sécurité stipule que seules les identités disposant d'un rôle Foundry peuvent appeler les modèles de tailspin-ai. Certaines anciennes applications appellent encore les modèles avec une clé API.

    Vous devez appliquer la stratégie sur tailspin-ai.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Regenerate both API keys of tailspin-ai.", fr: "Régénérer les deux clés API de tailspin-ai." } }
    - { id: b, text: { en: "Remove the Contributor role assignments on tailspin-ai.", fr: "Supprimer les attributions du rôle Contributor sur tailspin-ai." } }
    - { id: c, text: { en: "Set disableLocalAuth to true on tailspin-ai.", fr: "Définir disableLocalAuth sur true sur tailspin-ai." } }
    - { id: d, text: { en: "Add a private endpoint to tailspin-ai.", fr: "Ajouter un point de terminaison privé à tailspin-ai." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure RBAC applies only to Microsoft Entra ID authentication; a caller that presents an API key bypasses role assignments. Disabling local authentication makes the resource reject keys, so every caller must authenticate with Microsoft Entra ID and hold a role. The change can take minutes to hours to reach the gateway, after which old keys return HTTP 401.
    fr: |
      Azure RBAC ne s'applique qu'à l'authentification Microsoft Entra ID ; un appelant qui présente une clé API contourne les attributions de rôles. Désactiver l'authentification locale fait rejeter les clés par la ressource : chaque appelant doit alors s'authentifier avec Microsoft Entra ID et disposer d'un rôle. La modification peut mettre de quelques minutes à quelques heures à atteindre la passerelle ; ensuite, les anciennes clés renvoient HTTP 401.
  options:
    a:
      en: |
        New keys still work and still bypass Azure RBAC.
      fr: |
        Les nouvelles clés fonctionnent toujours et contournent toujours Azure RBAC.
    b:
      en: |
        Callers with a key don't need any role, so removing role assignments doesn't block them.
      fr: |
        Les appelants munis d'une clé n'ont besoin d'aucun rôle : supprimer des attributions de rôles ne les bloque pas.
    d:
      en: |
        A private endpoint controls the network path, not whether a key is accepted.
      fr: |
        Un point de terminaison privé contrôle le chemin réseau, pas l'acceptation d'une clé.
references:
  - title: Disable local authentication in Foundry Tools
    url: https://learn.microsoft.com/en-us/azure/ai-services/disable-local-auth
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
