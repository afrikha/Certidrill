id: ai103-1b-ptu-reservation-order
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys plans a Data Zone Provisioned deployment of 300 PTUs for a customer service assistant with steady traffic. The subscription already has enough PTU quota for the deployment type in the target region.

    Finance wants the discounted rate of a one-year Azure Reservation, and doesn't want to pay for a reservation if the deployment can't be created.

    What should you do first?
  fr: |
    Wingtip Toys prévoit un déploiement Data Zone Provisioned de 300 PTU pour un assistant de service client au trafic régulier. L'abonnement dispose déjà d'un quota de PTU suffisant pour ce type de déploiement dans la région cible.

    Le service financier souhaite le tarif réduit d'une réservation Azure d'un an, et ne veut pas payer une réservation si le déploiement ne peut pas être créé.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Purchase the one-year reservation for 300 PTUs so that the capacity is held for you.", fr: "Acheter la réservation d'un an de 300 PTU pour que la capacité vous soit réservée." } }
    - { id: b, text: { en: "Create the provisioned deployment with 300 PTUs.", fr: "Créer le déploiement provisionné de 300 PTU." } }
    - { id: c, text: { en: "Submit a request to increase the PTU quota of the subscription.", fr: "Soumettre une demande d'augmentation du quota de PTU de l'abonnement." } }
    - { id: d, text: { en: "Create a Data Zone Standard deployment and convert it to provisioned later.", fr: "Créer un déploiement Data Zone Standard et le convertir en provisionné plus tard." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      PTU quota is only a policy limit: it doesn't guarantee that capacity exists in the region, and a deployment fails if capacity is insufficient. A reservation is a discount on the billing meter and doesn't reserve capacity either. Microsoft recommends creating the deployment first to confirm capacity, then buying the reservation.
    fr: |
      Le quota de PTU n'est qu'une limite de stratégie : il ne garantit pas que la capacité existe dans la région, et un déploiement échoue si la capacité est insuffisante. Une réservation est une remise sur le compteur de facturation et ne réserve pas de capacité non plus. Microsoft recommande de créer d'abord le déploiement pour confirmer la capacité, puis d'acheter la réservation.
  options:
    a:
      en: |
        Reservations don't guarantee capacity; buying first risks paying for PTUs that can't be deployed.
      fr: |
        Les réservations ne garantissent pas la capacité ; acheter en premier risque de payer des PTU impossibles à déployer.
    c:
      en: |
        The quota is already sufficient; more quota wouldn't prove that capacity is available.
      fr: |
        Le quota est déjà suffisant ; plus de quota ne prouverait pas que la capacité est disponible.
    d:
      en: |
        A standard deployment doesn't confirm provisioned capacity, and it isn't the reserved throughput the team wants.
      fr: |
        Un déploiement standard ne confirme pas la capacité provisionnée, et ce n'est pas le débit réservé que souhaite l'équipe.
references:
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
