id: ai103-1b-version-validate-order
objective: "1.3.2"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Fourth Coffee has a Standard deployment named **chat-prod** with the NoAutoUpgrade policy. The deployment runs version A of a model, and version B is now available. The applications call chat-prod by name.

    You must not move chat-prod to version B until an evaluation proves that version B doesn't lower the groundedness and relevance of the answers.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Fourth Coffee dispose d'un déploiement Standard nommé **chat-prod** avec la stratégie NoAutoUpgrade. Le déploiement exécute la version A d'un modèle, et la version B est désormais disponible. Les applications appellent chat-prod par son nom.

    Vous ne devez pas faire passer chat-prod à la version B tant qu'une évaluation n'a pas prouvé que la version B ne dégrade pas l'ancrage et la pertinence des réponses.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: deploy, text: { en: "Create a deployment named chat-next that runs version B.", fr: "Créer un déploiement nommé chat-next qui exécute la version B." } }
    - { id: run, text: { en: "Run the same evaluation dataset against chat-prod and chat-next.", fr: "Exécuter le même jeu de données d'évaluation sur chat-prod et chat-next." } }
    - { id: compare, text: { en: "Compare the groundedness and relevance scores of the two runs.", fr: "Comparer les scores d'ancrage et de pertinence des deux exécutions." } }
    - { id: update, text: { en: "Update the model version of chat-prod to version B.", fr: "Mettre à jour la version du modèle de chat-prod vers la version B." } }
    - { id: policy, text: { en: "Set the policy of chat-prod to OnceNewDefaultVersionAvailable.", fr: "Définir la stratégie de chat-prod sur OnceNewDefaultVersionAvailable." } }
    - { id: filter, text: { en: "Switch the content filter of chat-next to annotate mode.", fr: "Passer le filtre de contenu de chat-next en mode annotation." } }
answer:
  sequence: [ deploy, run, compare, update ]
explanation:
  correct:
    en: |
      A separate deployment of version B lets you test it while chat-prod keeps serving version A. Running the same dataset on both deployments and comparing the scores shows whether the new version changes quality. Only then do you update the version of chat-prod, so that the applications keep calling the same deployment name.
    fr: |
      Un déploiement distinct de la version B permet de la tester pendant que chat-prod continue de servir la version A. Exécuter le même jeu de données sur les deux déploiements et comparer les scores montre si la nouvelle version modifie la qualité. Ce n'est qu'ensuite que vous mettez à jour la version de chat-prod, afin que les applications continuent d'appeler le même nom de déploiement.
  options:
    policy: { en: "An automatic upgrade policy would change the version without waiting for the evaluation.", fr: "Une stratégie de mise à niveau automatique changerait la version sans attendre l'évaluation." }
    filter: { en: "The content filter mode doesn't measure groundedness or relevance.", fr: "Le mode du filtre de contenu ne mesure ni l'ancrage ni la pertinence." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
