id: ai103-cs1a-portal-identity
objective: "1.3.4"
type: single
caseStudy: ai103-cs1a-humongous
difficulty: 2
status: draft
stem:
  en: |
    You need to configure how app-claims authenticates to claims-assistant. The solution must meet the security requirement. What should you do?
  fr: |
    Vous devez configurer la façon dont app-claims s'authentifie auprès de claims-assistant. La solution doit satisfaire l'exigence de sécurité. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign the Foundry User role to the managed identity of app-claims at the scope of ai-humongous", fr: "Attribuer le rôle Foundry User à l'identité managée d'app-claims dans l'étendue d'ai-humongous" } }
    - { id: b, text: { en: "Assign the Foundry Agent Consumer role to the managed identity of app-claims at the scope of claims-assistant", fr: "Attribuer le rôle Foundry Agent Consumer à l'identité managée d'app-claims dans l'étendue de claims-assistant" } }
    - { id: c, text: { en: "Assign the Foundry Project Manager role to the managed identity of app-claims at the scope of claims-prj", fr: "Attribuer le rôle Foundry Project Manager à l'identité managée d'app-claims dans l'étendue de claims-prj" } }
    - { id: d, text: { en: "Store the key of ai-humongous in Azure Key Vault and reference it from an app setting of app-claims", fr: "Stocker la clé d'ai-humongous dans Azure Key Vault et la référencer depuis un paramètre d'application d'app-claims" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The system-assigned managed identity of app-claims authenticates with Microsoft Entra ID, so no key is stored. Foundry Agent Consumer only allows interacting with agent endpoints, and an assignment at agent scope limits that access to claims-assistant, which is the least privilege.
    fr: |
      L'identité managée affectée par le système d'app-claims s'authentifie avec Microsoft Entra ID : aucune clé n'est stockée. Foundry Agent Consumer permet seulement d'interagir avec les points de terminaison d'agents, et une attribution dans l'étendue de l'agent limite cet accès à claims-assistant, ce qui correspond aux privilèges minimum.
  options:
    a:
      en: |
        Foundry User includes the data actions to build and develop in every project of the resource, which is far more than sending requests to one agent.
      fr: |
        Foundry User inclut les actions de données pour créer et développer dans tous les projets de la ressource, ce qui dépasse largement l'envoi de requêtes à un seul agent.
    c:
      en: |
        Foundry Project Manager can also build, publish agents and assign the Foundry User role, which exceeds the need.
      fr: |
        Foundry Project Manager peut aussi développer, publier des agents et attribuer le rôle Foundry User, ce qui dépasse le besoin.
    d:
      en: |
        A key referenced from Key Vault is still a secret that the app uses, and a resource key grants access to the whole resource.
      fr: |
        Une clé référencée depuis Key Vault reste un secret utilisé par l'application, et une clé de ressource donne accès à toute la ressource.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-azure-ai-foundry
