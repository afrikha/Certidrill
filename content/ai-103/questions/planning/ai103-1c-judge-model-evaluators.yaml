id: ai103-1c-judge-model-evaluators
objective: "1.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso, Ltd. prepares a cloud evaluation of a RAG application in Microsoft Foundry. The project contains a model deployment named **judge-mini** that the team wants to use only where an evaluator requires a judge model.

    Which two evaluators require you to specify judge-mini as the `deployment_name` in their initialization parameters?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso, Ltd. prépare une évaluation cloud d'une application RAG dans Microsoft Foundry. Le projet contient un déploiement de modèle nommé **judge-mini** que l'équipe veut utiliser uniquement lorsqu'un évaluateur exige un modèle juge.

    Pour quels deux évaluateurs devez-vous indiquer judge-mini comme `deployment_name` dans les paramètres d'initialisation ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Groundedness }
    - { id: b, text: Violence }
    - { id: c, text: Relevance }
    - { id: d, text: Groundedness Pro }
    - { id: e, text: Protected Material }
    - { id: f, text: Document Retrieval }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Groundedness and Relevance are AI-assisted evaluators: a judge model, named by `deployment_name`, reads the inputs and assigns a 1–5 score with a reason.
    fr: |
      Groundedness et Relevance sont des évaluateurs assistés par IA : un modèle juge, désigné par `deployment_name`, lit les entrées et attribue un score de 1 à 5 avec une justification.
  options:
    b:
      en: |
        Violence is a risk and safety evaluator hosted by the Foundry evaluation service; it needs no deployment.
      fr: |
        Violence est un évaluateur de risque et de sécurité hébergé par le service d'évaluation Foundry ; il ne nécessite aucun déploiement.
    d:
      en: |
        Groundedness Pro (preview) returns a true/false result and doesn't take a deployment_name.
      fr: |
        Groundedness Pro (préversion) renvoie un résultat vrai/faux et ne prend pas de deployment_name.
    e:
      en: |
        Protected Material is a risk and safety evaluator run by the Foundry evaluation service.
      fr: |
        Protected Material est un évaluateur de risque et de sécurité exécuté par le service d'évaluation Foundry.
    f:
      en: |
        Document Retrieval computes metrics such as ndcg@3 from the retrieval ground truth and the retrieved documents; it needs no judge model.
      fr: |
        Document Retrieval calcule des métriques comme ndcg@3 à partir de la vérité terrain de récupération et des documents récupérés ; il ne nécessite aucun modèle juge.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
