id: ai103-1a-agentic-retrieval
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware is building a new support agent. Users ask long, conversational questions such as "Can I return a laptop bought abroad, and does the warranty still apply after a screen repair?". Tests show that one search query per question misses part of the answer.

    You need a retrieval method in which a language model uses the question and the conversation history to generate focused subqueries, runs them in parallel and returns merged results with source references. Relevance is the priority.

    What should you use?
  fr: |
    Litware crée un nouvel agent de support. Les utilisateurs posent des questions longues et conversationnelles comme « Puis-je retourner un ordinateur portable acheté à l'étranger, et la garantie s'applique-t-elle encore après une réparation d'écran ? ». Les tests montrent qu'une seule requête de recherche par question manque une partie de la réponse.

    Vous avez besoin d'une méthode de récupération dans laquelle un modèle de langage utilise la question et l'historique de la conversation pour générer des sous-requêtes ciblées, les exécute en parallèle et renvoie des résultats fusionnés avec les références des sources. La pertinence est la priorité.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Classic RAG that sends one hybrid query per question", fr: "Le RAG classique qui envoie une requête hybride par question" } }
    - { id: b, text: { en: "Agentic retrieval through a knowledge base with the `minimal` retrieval reasoning effort", fr: "La récupération agentique par une base de connaissances avec l'effort de raisonnement de récupération `minimal`" } }
    - { id: c, text: { en: "Agentic retrieval through a knowledge base with the `low` retrieval reasoning effort", fr: "La récupération agentique par une base de connaissances avec l'effort de raisonnement de récupération `low`" } }
    - { id: d, text: { en: "A semantic query with query rewrite enabled", fr: "Une requête sémantique avec la réécriture de requête activée" } }
answer: { optionId: c }
explanation:
  correct:
    en: In agentic retrieval, a knowledge base sends the query and the conversation history to an LLM that generates focused subqueries at the `low` and `medium` retrieval reasoning efforts. The subqueries run in parallel, each is semantically reranked, and the merged content is returned with optional source references.
    fr: Dans la récupération agentique, une base de connaissances envoie la requête et l'historique de la conversation à un LLM qui génère des sous-requêtes ciblées avec les efforts de raisonnement de récupération `low` et `medium`. Les sous-requêtes s'exécutent en parallèle, chacune est réordonnée sémantiquement, et le contenu fusionné est renvoyé avec des références de sources facultatives.
  options:
    a:
      en: Classic RAG sends a single query with no LLM involvement in query planning, which is what misses parts of the answer.
      fr: |
        Le RAG classique envoie une seule requête, sans LLM pour planifier la requête : c'est justement ce qui manque une partie de la réponse.
    b:
      en: At the `minimal` effort, the query-planning step is skipped and the query goes directly to the knowledge sources.
      fr: Avec l'effort `minimal`, l'étape de planification des requêtes est ignorée et la requête est envoyée directement aux sources de connaissances.
    d:
      en: Query rewrite expands a query into similar query strings; it doesn't use the conversation history to break a multipart question into subqueries.
      fr: La réécriture de requête développe une requête en chaînes similaires ; elle n'utilise pas l'historique de la conversation pour décomposer une question en plusieurs parties en sous-requêtes.
references:
  - title: Agentic retrieval in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview
