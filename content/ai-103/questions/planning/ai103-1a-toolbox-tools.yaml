id: ai103-1a-toolbox-tools
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs five agents that need the same curated set of tools. The platform team wants to define the tools once and expose them through a single MCP-compatible endpoint, with central authentication and versioning, by using a toolbox in Microsoft Foundry.

    Which two tools can the team include in the toolbox?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exploite cinq agents qui ont besoin du même ensemble d'outils organisé. L'équipe plateforme veut définir les outils une seule fois et les exposer par un point de terminaison unique compatible MCP, avec une authentification et un contrôle de version centralisés, à l'aide d'une boîte à outils (toolbox) dans Microsoft Foundry.

    Quels sont les deux outils que l'équipe peut inclure dans la boîte à outils ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "OpenAPI", fr: "OpenAPI" } }
    - { id: b, text: { en: "Function calling", fr: "L'appel de fonction" } }
    - { id: c, text: { en: "SharePoint", fr: "SharePoint" } }
    - { id: d, text: { en: "File search", fr: "La recherche de fichiers" } }
    - { id: e, text: { en: "Azure Functions", fr: "Azure Functions" } }
    - { id: f, text: { en: "Grounding with Bing", fr: "Grounding with Bing" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: OpenAPI and file search are supported both in a toolbox and by direct integration. A toolbox also supports tools such as MCP, Azure AI Search, code interpreter, web search, browser automation and A2A.
    fr: OpenAPI et la recherche de fichiers sont pris en charge à la fois dans une boîte à outils et en intégration directe. Une boîte à outils prend aussi en charge des outils comme MCP, Azure AI Search, l'interpréteur de code, la recherche web, l'automatisation du navigateur et A2A.
  options:
    b:
      en: Function calling runs on the client side, so a toolbox can't host it.
      fr: |
        L'appel de fonction s'exécute côté client : une boîte à outils ne peut pas l'héberger.
    c:
      en: SharePoint is available only by direct integration, not in a toolbox.
      fr: SharePoint n'est disponible qu'en intégration directe, pas dans une boîte à outils.
    e:
      en: Azure Functions is available only by direct integration, not in a toolbox.
      fr: Azure Functions n'est disponible qu'en intégration directe, pas dans une boîte à outils.
    f:
      en: Grounding with Bing is available only by direct integration, not in a toolbox.
      fr: Grounding with Bing n'est disponible qu'en intégration directe, pas dans une boîte à outils.
references:
  - title: What is Toolbox in Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/tool-catalog
