id: ai103-1b-quota-move
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Trey Research has an Azure subscription with a tokens-per-minute (TPM) quota of 300,000 TPM for **gpt-4.1-mini** with the Global Standard deployment type. The quota is fully allocated to two Global Standard deployments of the same model and version:

    | Deployment | Assigned TPM | Peak usage |
    | --- | --- | --- |
    | dev-chat | 200,000 | 15,000 |
    | prod-chat | 100,000 | 100,000 |

    prod-chat returns HTTP 429 responses during peaks. You need to give prod-chat 250,000 TPM today, without waiting for any approval.

    What should you do?
  fr: |
    Trey Research dispose d'un abonnement Azure avec un quota de 300 000 jetons par minute (TPM) pour **gpt-4.1-mini** avec le type de déploiement Global Standard. Le quota est entièrement attribué à deux déploiements Global Standard du même modèle et de la même version :

    | Déploiement | TPM attribués | Utilisation en pointe |
    | --- | --- | --- |
    | dev-chat | 200 000 | 15 000 |
    | prod-chat | 100 000 | 100 000 |

    prod-chat renvoie des réponses HTTP 429 lors des pointes. Vous devez attribuer 250 000 TPM à prod-chat dès aujourd'hui, sans attendre aucune approbation.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Reduce dev-chat to 50,000 TPM, and then raise prod-chat to 250,000 TPM.", fr: "Réduire dev-chat à 50 000 TPM, puis porter prod-chat à 250 000 TPM." } }
    - { id: b, text: { en: "Create a second Global Standard deployment of the model in another region, and split the traffic.", fr: "Créer un second déploiement Global Standard du modèle dans une autre région, puis répartir le trafic." } }
    - { id: c, text: { en: "Raise prod-chat to 250,000 TPM without changing dev-chat.", fr: "Porter prod-chat à 250 000 TPM sans modifier dev-chat." } }
    - { id: d, text: { en: "Configure dev-chat as the spillover deployment of prod-chat.", fr: "Configurer dev-chat comme déploiement de débordement (spillover) de prod-chat." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Each deployment's TPM is subtracted from the quota of the model and deployment type. When the quota is fully allocated, you can give more TPM to a deployment only by reducing TPM on another deployment or by getting a quota increase approved. Moving 150,000 TPM from the underused dev-chat works immediately.
    fr: |
      Les TPM de chaque déploiement sont déduits du quota du modèle et du type de déploiement. Lorsque le quota est entièrement attribué, vous ne pouvez accorder plus de TPM à un déploiement qu'en réduisant ceux d'un autre déploiement ou en obtenant l'approbation d'une augmentation de quota. Déplacer 150 000 TPM depuis dev-chat, peu utilisé, fonctionne immédiatement.
  options:
    b:
      en: |
        Global Standard deployments of the same model and version share one quota pool across all the regions of the subscription, so a deployment in another region adds no quota.
      fr: |
        Les déploiements Global Standard d'un même modèle et d'une même version partagent un seul pool de quota pour toutes les régions de l'abonnement : un déploiement dans une autre région n'ajoute aucun quota.
    c:
      en: |
        The quota is fully allocated, so the change fails until TPM is freed or the quota is increased.
      fr: |
        Le quota est entièrement attribué : la modification échoue tant que des TPM ne sont pas libérés ou que le quota n'est pas augmenté.
    d:
      en: |
        Spillover applies to provisioned deployments, and it doesn't add TPM to prod-chat.
      fr: |
        Le débordement s'applique aux déploiements provisionnés, et il n'ajoute pas de TPM à prod-chat.
references:
