id: ai103-1b-cicd-stage-order
objective: "1.2.4"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Lamna Healthcare is building a release pipeline for a Foundry agent named **intake-agent**. The repository contains a Bicep file for the model deployment, the agent definition and an evaluation dataset. A test Foundry project and a production Foundry project exist. The GitHub environment named **production** has required reviewers.

    For each release, the pipeline must:

    - make sure that the model deployment that the agent needs exists in the test environment;
    - prove that the new agent version scores at least as well as the version in production;
    - update production only after a reviewer approves.

    Which four actions should the pipeline perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Lamna Healthcare crée un pipeline de publication pour un agent Foundry nommé **intake-agent**. Le dépôt contient un fichier Bicep pour le déploiement de modèle, la définition de l'agent et un jeu de données d'évaluation. Un projet Foundry de test et un projet Foundry de production existent. L'environnement GitHub nommé **production** exige des réviseurs.

    Pour chaque publication, le pipeline doit :

    - garantir que le déploiement de modèle dont l'agent a besoin existe dans l'environnement de test ;
    - prouver que la nouvelle version de l'agent obtient des scores au moins aussi bons que la version en production ;
    - mettre à jour la production uniquement après l'approbation d'un réviseur.

    Quelles sont les quatre actions que le pipeline doit effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: bicep, text: { en: "Deploy the Bicep file to the test Foundry resource.", fr: "Déployer le fichier Bicep sur la ressource Foundry de test." } }
    - { id: create, text: { en: "Create a new version of intake-agent in the test project from the definition in the repository.", fr: "Créer une nouvelle version d'intake-agent dans le projet de test à partir de la définition du dépôt." } }
    - { id: eval, text: { en: "Run the ai-agent-evals action to compare the new version with the production version.", fr: "Exécuter l'action ai-agent-evals pour comparer la nouvelle version à la version de production." } }
    - { id: promote, text: { en: "In a job that uses the production environment, create the new version in the production project.", fr: "Dans un travail qui utilise l'environnement production, créer la nouvelle version dans le projet de production." } }
    - { id: secret, text: { en: "Store an API key of the production resource as a repository secret.", fr: "Stocker une clé API de la ressource de production comme secret du dépôt." } }
    - { id: delete, text: { en: "Delete the earlier versions of intake-agent from the test project.", fr: "Supprimer les versions antérieures d'intake-agent du projet de test." } }
answer:
  sequence: [ bicep, create, eval, promote ]
explanation:
  correct:
    en: |
      Infrastructure as code first creates or updates the model deployment, because the agent definition refers to it by name. The pipeline then builds the new agent version, evaluates it against the production version as a quality gate, and promotes it in a job bound to the protected production environment, which waits for a reviewer.
    fr: |
      L'infrastructure en tant que code crée ou met d'abord à jour le déploiement de modèle, car la définition de l'agent y fait référence par son nom. Le pipeline crée ensuite la nouvelle version de l'agent, l'évalue par rapport à la version de production comme contrôle qualité, puis la promeut dans un travail lié à l'environnement protégé production, qui attend un réviseur.
  options:
    secret: { en: "Pipelines authenticate with Microsoft Entra ID and OpenID Connect; storing a key isn't needed and adds risk.", fr: "Les pipelines s'authentifient avec Microsoft Entra ID et OpenID Connect ; stocker une clé est inutile et ajoute un risque." }
    delete: { en: "Earlier versions aren't in the way, and deleting them removes the history used for comparison and rollback.", fr: "Les versions antérieures ne gênent pas, et les supprimer retire l'historique utilisé pour la comparaison et le retour arrière." }
references:
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
