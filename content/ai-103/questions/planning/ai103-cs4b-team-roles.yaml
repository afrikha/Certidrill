id: ai103-cs4b-team-roles
objective: "1.3.4"
type: dropdown
caseStudy: ai103-cs4b-consolidated
difficulty: 2
status: draft
stem:
  en: |
    You need to assign roles to meet the access requirement. Which role should you assign to each principal? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez attribuer des rôles pour satisfaire l'exigence relative à l'accès. Quel rôle devez-vous attribuer à chaque principal ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      - grp-agent-devs, at the scope of ops-prj: [[devs]]
      - Ines, at the scope of ops-prj: [[lead]]
      - Marco, at the scope of the subscription: [[finops]]
    fr: |
      - grp-agent-devs, à l'étendue d'ops-prj : [[devs]]
      - Ines, à l'étendue d'ops-prj : [[lead]]
      - Marco, à l'étendue de l'abonnement : [[finops]]
  slots:
    - id: devs
      options:
        - { id: user, text: Foundry User }
        - { id: pm, text: Foundry Project Manager }
        - { id: consumer, text: Foundry Agent Consumer }
        - { id: owner, text: Foundry Account Owner }
    - id: lead
      options:
        - { id: user, text: Foundry User }
        - { id: pm, text: Foundry Project Manager }
        - { id: owner, text: Foundry Account Owner }
        - { id: uaa, text: User Access Administrator }
    - id: finops
      options:
        - { id: usages, text: Cognitive Services Usages Reader }
        - { id: user, text: Foundry User }
        - { id: consumer, text: Foundry Agent Consumer }
        - { id: oaiuser, text: Cognitive Services OpenAI User }
answer:
  values: { devs: user, lead: pm, finops: usages }
explanation:
  correct:
    en: |
      Foundry User (formerly Azure AI User) is the least-privilege role for developers who build and test agents in a project. Foundry Project Manager lets Ines perform management actions on the project and conditionally assign the Foundry User role to other users, without the full resource management of Foundry Account Owner. Cognitive Services Usages Reader is the one Cognitive Services role that Microsoft recommends in Foundry scenarios, for quota visibility.
    fr: |
      Foundry User (anciennement Azure AI User) est le rôle de moindre privilège des développeurs qui créent et testent des agents dans un projet. Foundry Project Manager permet à Ines d'effectuer des actions de gestion sur le projet et d'attribuer de manière conditionnelle le rôle Foundry User à d'autres utilisateurs, sans la gestion complète des ressources qu'apporte Foundry Account Owner. Cognitive Services Usages Reader est le seul rôle Cognitive Services que Microsoft recommande dans les scénarios Foundry, pour la visibilité sur les quotas.
  options:
    consumer: { en: "Foundry Agent Consumer only lets a principal interact with agent endpoints; it does not allow building agents.", fr: "Foundry Agent Consumer permet seulement d'interagir avec les points de terminaison des agents ; il ne permet pas de créer des agents." }
    owner: { en: "Foundry Account Owner grants full access to manage projects and resources, which is more than required.", fr: "Foundry Account Owner accorde un accès complet pour gérer les projets et les ressources, ce qui dépasse le besoin." }
    uaa: { en: "User Access Administrator can assign any role but does not let Ines manage or build in the project.", fr: "User Access Administrator peut attribuer n'importe quel rôle, mais ne permet pas à Ines de gérer le projet ni d'y créer des éléments." }
    oaiuser: { en: "Roles whose names start with Cognitive Services do not apply to Foundry scenarios: only Cognitive Services Usages Reader is recommended, for quota visibility.", fr: "Les rôles dont le nom commence par Cognitive Services ne s'appliquent pas aux scénarios Foundry : seul Cognitive Services Usages Reader est recommandé, pour la visibilité sur les quotas." }
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-foundry
