id: ai103-1b-eval-baseline
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Lucerne Publishing runs the `microsoft/ai-agent-evals` GitHub Action in a release workflow. The `agent-ids` input is read from a repository variable shared with other workflows, and its value is `editor-agent:5,editor-agent:6,editor-agent:7`. You must not change this variable.

    Version 6 of editor-agent runs in production. The evaluation report must compare versions 5 and 7 with version 6.

    What should you do?
  fr: |
    Lucerne Publishing exécute l'action GitHub `microsoft/ai-agent-evals` dans un flux de travail de publication. L'entrée `agent-ids` est lue depuis une variable de dépôt partagée avec d'autres flux de travail, et sa valeur est `editor-agent:5,editor-agent:6,editor-agent:7`. Vous ne devez pas modifier cette variable.

    La version 6 d'editor-agent s'exécute en production. Le rapport d'évaluation doit comparer les versions 5 et 7 à la version 6.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the `deployment-name` input to the deployment used by version 6.", fr: "Définir l'entrée `deployment-name` sur le déploiement utilisé par la version 6." } }
    - { id: b, text: { en: "Set the `data-path` input to a dataset generated from the answers of version 6.", fr: "Définir l'entrée `data-path` sur un jeu de données généré à partir des réponses de la version 6." } }
    - { id: c, text: { en: "Set the `baseline-agent-id` input to `editor-agent:6`.", fr: "Définir l'entrée `baseline-agent-id` sur `editor-agent:6`." } }
    - { id: d, text: { en: "Run the action three times, once for each version.", fr: "Exécuter l'action trois fois, une fois par version." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When several agents are evaluated, the action compares each of them with a baseline and reports a statistical comparison. By default the baseline is the first agent of `agent-ids` (here version 5); the optional `baseline-agent-id` input sets it explicitly.
    fr: |
      Lorsque plusieurs agents sont évalués, l'action compare chacun d'eux à une référence et produit une comparaison statistique. Par défaut, la référence est le premier agent de `agent-ids` (ici la version 5) ; l'entrée facultative `baseline-agent-id` la définit explicitement.
  options:
    a:
      en: "`deployment-name` is the model deployment used to run the evaluation, not the baseline."
      fr: "`deployment-name` est le déploiement de modèle utilisé pour exécuter l'évaluation, pas la référence."
    b:
      en: "`data-path` points to the evaluators and input queries; it doesn't choose which agent is the baseline."
      fr: "`data-path` désigne les évaluateurs et les requêtes d'entrée ; il ne choisit pas l'agent de référence."
    d:
      en: |
        Separate runs evaluate each version alone and don't produce the pairwise comparison with version 6.
      fr: |
        Des exécutions séparées évaluent chaque version seule et ne produisent pas la comparaison deux à deux avec la version 6.
references:
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
