id: ai103-1b-cicd-tools-dd
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    VanArsdel is automating the delivery of a Foundry agent with GitHub Actions. No secret may be stored in the repository.

    Which tool should you use for each task? To answer, drag the appropriate tools to the correct tasks. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    VanArsdel automatise la livraison d'un agent Foundry avec GitHub Actions. Aucun secret ne doit être stocké dans le dépôt.

    Quel outil devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les outils appropriés vers les tâches correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bicep, text: { en: "A Bicep file deployed by the pipeline", fr: "Un fichier Bicep déployé par le pipeline" } }
    - { id: login, text: { en: "azure/login with OpenID Connect", fr: "azure/login avec OpenID Connect" } }
    - { id: sdk, text: { en: "A Python script that uses azure-ai-projects", fr: "Un script Python qui utilise azure-ai-projects" } }
    - { id: evals, text: "microsoft/ai-agent-evals" }
    - { id: artifact, text: "actions/upload-artifact" }
  targets:
    - { id: t1, text: { en: "Create the model deployments and role assignments", fr: "Créer les déploiements de modèles et les attributions de rôles" } }
    - { id: t2, text: { en: "Obtain a Microsoft Entra token for the pipeline identity", fr: "Obtenir un jeton Microsoft Entra pour l'identité du pipeline" } }
    - { id: t3, text: { en: "Create the new agent version from the definition in the repository", fr: "Créer la nouvelle version de l'agent à partir de la définition du dépôt" } }
    - { id: t4, text: { en: "Score agent versions on a test dataset and compare them", fr: "Noter les versions de l'agent sur un jeu de données de test et les comparer" } }
answer:
  mapping: { t1: bicep, t2: login, t3: sdk, t4: evals }
explanation:
  correct:
    en: |
      Infrastructure as code (Bicep) provisions deployments and role assignments. `azure/login` with OpenID Connect exchanges the GitHub token for a Microsoft Entra token without a stored secret. The Foundry SDK creates the agent version, and the `ai-agent-evals` action scores versions with evaluators and compares them statistically. `actions/upload-artifact` only stores files produced by a job.
    fr: |
      L'infrastructure en tant que code (Bicep) provisionne les déploiements et les attributions de rôles. `azure/login` avec OpenID Connect échange le jeton GitHub contre un jeton Microsoft Entra sans secret stocké. Le SDK Foundry crée la version de l'agent, et l'action `ai-agent-evals` note les versions avec des évaluateurs et les compare statistiquement. `actions/upload-artifact` ne fait que stocker des fichiers produits par un travail.
references:
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
  - title: Authenticate to Azure from GitHub Actions by OpenID Connect
    url: https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure-openid-connect
