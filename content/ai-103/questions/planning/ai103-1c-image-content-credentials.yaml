id: ai103-1c-image-content-credentials
objective: "1.4.3"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses a GPT-image-1 series model deployment in Azure OpenAI in Microsoft Foundry to create the illustrations of its catalog. The legal team must be able to prove later that an illustration was generated by AI.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise un déploiement de modèle de la série GPT-image-1 dans Azure OpenAI dans Microsoft Foundry pour créer les illustrations de son catalogue. L'équipe juridique doit pouvoir prouver plus tard qu'une illustration a été générée par IA.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Each generated image carries a signed C2PA manifest whose description field is "AI Generated Image".
        fr: Chaque image générée porte un manifeste C2PA signé dont le champ description vaut « AI Generated Image ».
    - id: s2
      text:
        en: You must turn on Content Credentials for the image deployment before the manifest is added to the images.
        fr: Vous devez activer Content Credentials pour le déploiement d'images avant que le manifeste soit ajouté aux images.
    - id: s3
      text:
        en: The Content Credentials Verify website can show that the credentials of an illustration were issued by Microsoft Corporation.
        fr: Le site Content Credentials Verify peut montrer que les Content Credentials d'une illustration ont été émises par Microsoft Corporation.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Images generated by the DALL-E and GPT-image-1 series in Azure OpenAI include Content Credentials: a manifest based on the C2PA specification, cryptographically signed by a certificate that traces back to Azure OpenAI, with the description "AI Generated Image", the software agent and the creation time. No setup is needed: the credentials are applied automatically. The Content Credentials Verify site shows that they were issued by Microsoft Corporation, with the date and time.
    fr: |
      Les images générées par les séries DALL-E et GPT-image-1 dans Azure OpenAI incluent des Content Credentials : un manifeste fondé sur la spécification C2PA, signé par un certificat qui remonte à Azure OpenAI, avec la description « AI Generated Image », l'agent logiciel et l'heure de création. Aucune configuration n'est nécessaire : les Content Credentials sont appliquées automatiquement. Le site Content Credentials Verify montre qu'elles ont été émises par Microsoft Corporation, avec la date et l'heure.
references:
  - title: Content Credentials in Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials
