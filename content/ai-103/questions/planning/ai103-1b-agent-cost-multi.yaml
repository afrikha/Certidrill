id: ai103-1b-agent-cost-multi
objective: "1.3.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Alpine Ski House has a Foundry agent that answers questions about ski passes. The traces show that each run sends 20 retrieved chunks to the model and that the agent writes long answers of 600 to 900 tokens, although users only need a few sentences. The bill is higher than planned.

    You need to reduce the token cost of the agent without changing the model.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Alpine Ski House dispose d'un agent Foundry qui répond aux questions sur les forfaits de ski. Les traces montrent que chaque exécution envoie 20 blocs récupérés au modèle et que l'agent rédige de longues réponses de 600 à 900 jetons, alors que les utilisateurs n'ont besoin que de quelques phrases. La facture est plus élevée que prévu.

    Vous devez réduire le coût en jetons de l'agent sans changer de modèle.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the TPM of the deployment that the agent uses.", fr: "Augmenter les TPM du déploiement utilisé par l'agent." } }
    - { id: b, text: { en: "Pass fewer retrieved chunks to the model.", fr: "Transmettre moins de blocs récupérés au modèle." } }
    - { id: c, text: { en: "Enable retries with exponential back-off in the client.", fr: "Activer les nouvelles tentatives avec temporisation exponentielle dans le client." } }
    - { id: d, text: { en: "Configure a spillover deployment for the agent's deployment.", fr: "Configurer un déploiement de débordement pour le déploiement de l'agent." } }
    - { id: e, text: { en: "Instruct the agent to answer concisely, and lower `max_output_tokens`.", fr: "Demander à l'agent de répondre de façon concise, et réduire `max_output_tokens`." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Pay-per-token billing counts input and output tokens. Sending fewer retrieved chunks shortens every prompt, and asking for concise answers with a lower `max_output_tokens` cap reduces the generated tokens. Both lower the cost of each run with the same model.
    fr: |
      La facturation au jeton compte les jetons d'entrée et de sortie. Envoyer moins de blocs récupérés raccourcit chaque invite, et demander des réponses concises avec un plafond `max_output_tokens` plus bas réduit les jetons générés. Les deux réduisent le coût de chaque exécution avec le même modèle.
  options:
    a:
      en: |
        More TPM raises the rate limit but doesn't reduce the tokens consumed or the cost per token.
      fr: |
        Plus de TPM relève la limite de débit, mais ne réduit ni les jetons consommés ni le coût par jeton.
    c:
      en: |
        Retries handle throttling; they don't reduce, and can even add, token consumption.
      fr: |
        Les nouvelles tentatives gèrent la limitation ; elles ne réduisent pas la consommation de jetons et peuvent même l'augmenter.
    d:
      en: |
        Spillover serves overflow of provisioned deployments; it doesn't make runs cheaper.
      fr: |
        Le débordement absorbe l'excédent des déploiements provisionnés ; il ne rend pas les exécutions moins chères.
references:
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: Monitoring data reference for Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/openai/monitor-openai-reference
