id: ai103-1a-reasoning-contracts
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The legal team of Fabrikam compares two versions of supplier contracts of about 40 pages each. The application must identify subtle differences in liability and termination clauses and explain their impact. Answers are reviewed the next day, so response time isn't a concern, but accuracy is critical.

    You need to choose the model configuration for this task.

    What should you use?
  fr: |
    L'équipe juridique de Fabrikam compare deux versions de contrats fournisseurs d'environ 40 pages chacune. L'application doit repérer des différences subtiles dans les clauses de responsabilité et de résiliation, et en expliquer l'impact. Les réponses sont relues le lendemain : le temps de réponse n'est pas un critère, mais la précision est essentielle.

    Vous devez choisir la configuration de modèle pour cette tâche.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A small model such as `gpt-4.1-nano` with a temperature of 0", fr: "Un petit modèle comme `gpt-4.1-nano` avec une température de 0" } }
    - { id: b, text: { en: "An embedding model such as `text-embedding-3-large` with cosine similarity", fr: "Un modèle d'incorporation comme `text-embedding-3-large` avec la similarité cosinus" } }
    - { id: c, text: { en: "Azure Language in Foundry Tools with key phrase extraction", fr: "Azure Language dans Foundry Tools avec l'extraction de phrases clés" } }
    - { id: d, text: { en: "A reasoning model such as `gpt-5.6-sol` with the reasoning effort set to `high`", fr: "Un modèle de raisonnement comme `gpt-5.6-sol` avec l'effort de raisonnement défini sur `high`" } }
answer: { optionId: d }
explanation:
  correct:
    en: Reasoning models spend more time processing a request, and Microsoft Learn lists complex document comparison (contracts, legal documents) among their strengths. The `high` reasoning effort is meant for hard tasks where quality matters more than latency, which matches a next-day review.
    fr: Les modèles de raisonnement passent plus de temps à traiter une demande, et Microsoft Learn cite la comparaison de documents complexes (contrats, documents juridiques) parmi leurs points forts. L'effort de raisonnement `high` est destiné aux tâches difficiles où la qualité compte plus que la latence, ce qui correspond à une relecture le lendemain.
  options:
    a:
      en: A temperature of 0 makes output more deterministic, but a small model doesn't gain the multistep reasoning needed to find subtle legal differences.
      fr: Une température de 0 rend la sortie plus déterministe, mais un petit modèle n'acquiert pas pour autant le raisonnement en plusieurs étapes nécessaire pour trouver des différences juridiques subtiles.
    b:
      en: Embeddings measure how similar two texts are overall; they generate no explanation of what changed or why it matters.
      fr: Les incorporations mesurent la similarité globale de deux textes ; elles ne génèrent aucune explication de ce qui a changé ni de son impact.
    c:
      en: Key phrase extraction lists the main terms of a text; it doesn't compare clauses or reason about their impact.
      fr: L'extraction de phrases clés liste les principaux termes d'un texte ; elle ne compare pas les clauses et ne raisonne pas sur leur impact.
references:
  - title: Azure OpenAI reasoning models - GPT-6 Astra and GPT-5
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/reasoning
