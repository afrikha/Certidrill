id: ai103-1b-token-metric-dd
objective: "1.3.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Proseware's Microsoft Foundry resource hosts six model deployments. The finance team wants an Azure Monitor chart that shows how many tokens each deployment consumes per day, so that it can see which workloads drive the cost.

    How should you configure the chart? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La ressource Microsoft Foundry de Proseware héberge six déploiements de modèles. L'équipe financière souhaite un graphique Azure Monitor qui montre le nombre de jetons consommés par chaque déploiement et par jour, afin de voir quelles charges de travail génèrent les coûts.

    Comment devez-vous configurer le graphique ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Metric: [[metric]]
      Split by: [[dim]]
    fr: |
      Métrique : [[metric]]
      Fractionner par : [[dim]]
  slots:
    - id: metric
      options:
        - { id: tokens, text: Processed Inference Tokens }
        - { id: requests, text: Azure OpenAI Requests }
        - { id: ttr, text: Time to Response }
        - { id: util, text: Provisioned-managed Utilization V2 }
    - id: dim
      options:
        - { id: deployment, text: ModelDeploymentName }
        - { id: status, text: StatusCode }
        - { id: spill, text: IsSpillover }
answer:
  values: { metric: tokens, dim: deployment }
explanation:
  correct:
    en: |
      Processed Inference Tokens counts the prompt (input) tokens plus the generated (output) tokens, which is what pay-per-token billing is based on. Splitting it by the ModelDeploymentName dimension shows the consumption of each deployment.
    fr: |
      Processed Inference Tokens compte les jetons d'invite (entrée) plus les jetons générés (sortie), qui sont la base de la facturation au jeton. Le fractionner par la dimension ModelDeploymentName montre la consommation de chaque déploiement.
  options:
    requests: { en: "Azure OpenAI Requests counts calls, not tokens; calls of different sizes cost different amounts.", fr: "Azure OpenAI Requests compte des appels, pas des jetons ; des appels de tailles différentes coûtent des montants différents." }
    ttr: { en: "Time to Response measures latency.", fr: "Time to Response mesure la latence." }
    util: { en: "Provisioned-managed Utilization V2 shows the use of PTUs of provisioned deployments only.", fr: "Provisioned-managed Utilization V2 indique uniquement l'utilisation des PTU des déploiements provisionnés." }
    status: { en: "StatusCode separates successful and failed calls, not deployments.", fr: "StatusCode sépare les appels réussis et en échec, pas les déploiements." }
    spill: { en: "IsSpillover separates requests that arrived through spillover.", fr: "IsSpillover distingue les requêtes arrivées par débordement." }
references:
  - title: Monitoring data reference for Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/foundry-classic/openai/monitor-openai-reference
