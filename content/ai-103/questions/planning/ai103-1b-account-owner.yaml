id: ai103-1b-account-owner
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Fabrikam, a platform administrator named Admin1 must create Foundry projects and manage model deployments in a Foundry resource named **fabrikam-ai**. Admin1 must not be able to build agents or use the data of the projects.

    You need to assign a role to Admin1 on fabrikam-ai. The solution must follow the principle of least privilege.

    Which role should you assign?
  fr: |
    Chez Fabrikam, une administratrice de plateforme nommée Admin1 doit créer des projets Foundry et gérer les déploiements de modèles dans une ressource Foundry nommée **fabrikam-ai**. Admin1 ne doit pas pouvoir créer d'agents ni utiliser les données des projets.

    Vous devez attribuer un rôle à Admin1 sur fabrikam-ai. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer ?
body:
  options:
    - { id: a, text: Foundry Owner }
    - { id: b, text: Foundry Project Manager }
    - { id: c, text: Foundry User }
    - { id: d, text: Foundry Account Owner }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Foundry Account Owner can create accounts and projects and manage models, but it has no data actions: it can't build in projects or publish agents. It's the role Microsoft recommends for administrators.
    fr: |
      Foundry Account Owner peut créer des comptes et des projets et gérer les modèles, mais ne dispose d'aucune action de données : il ne peut ni créer de contenu dans les projets ni publier d'agents. C'est le rôle que Microsoft recommande pour les administrateurs.
  options:
    a:
      en: |
        Foundry Owner also grants data actions, so Admin1 could build agents.
      fr: |
        Foundry Owner accorde aussi les actions de données : Admin1 pourrait créer des agents.
    b:
      en: |
        Foundry Project Manager builds in projects and publishes agents but can't manage models or create projects.
      fr: |
        Foundry Project Manager crée du contenu dans les projets et publie des agents, mais ne peut ni gérer les modèles ni créer de projets.
    c:
      en: |
        Foundry User grants data actions but can't create projects or deploy models.
      fr: |
        Foundry User accorde les actions de données, mais ne peut ni créer de projets ni déployer de modèles.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
