id: ai103-1a-query-vectorizer
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has an Azure AI Search index whose chunks are vectorized during indexing by an AzureOpenAIEmbedding skill that uses a `text-embedding-3-large` deployment named **emb-large**. Today, the application computes query vectors itself.

    You need the application to send plain query text in its vector queries and let Azure AI Search create the query vectors. The results must stay as relevant as they are today.

    What should you do?
  fr: |
    Northwind Traders dispose d'un index Azure AI Search dont les segments sont vectorisés pendant l'indexation par une compétence AzureOpenAIEmbedding qui utilise un déploiement `text-embedding-3-large` nommé **emb-large**. Aujourd'hui, l'application calcule elle-même les vecteurs des requêtes.

    Vous devez faire en sorte que l'application envoie le texte brut de la requête dans ses requêtes vectorielles et qu'Azure AI Search crée les vecteurs de requête. Les résultats doivent rester aussi pertinents qu'aujourd'hui.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign to the vector field an Azure OpenAI vectorizer that uses a `text-embedding-3-small` deployment", fr: "Affecter au champ vectoriel un vectoriseur Azure OpenAI qui utilise un déploiement `text-embedding-3-small`" } }
    - { id: b, text: { en: "Add a semantic configuration to the index and send semantic queries", fr: "Ajouter une configuration sémantique à l'index et envoyer des requêtes sémantiques" } }
    - { id: c, text: { en: "Assign to the vector field an Azure OpenAI vectorizer that uses the emb-large deployment", fr: "Affecter au champ vectoriel un vectoriseur Azure OpenAI qui utilise le déploiement emb-large" } }
    - { id: d, text: { en: "Add an AzureOpenAIEmbedding skill that uses emb-large to the query pipeline", fr: "Ajouter au pipeline de requête une compétence AzureOpenAIEmbedding qui utilise emb-large" } }
answer: { optionId: c }
explanation:
  correct:
    en: A vectorizer is defined in the index schema, assigned to a vector field and used automatically at query time to convert a text query to a vector. It must match the embedding model used to encode the content, so it must use the same `text-embedding-3-large` deployment as the AzureOpenAIEmbedding skill.
    fr: |
      Un vectoriseur est défini dans le schéma de l'index, affecté à un champ vectoriel et utilisé automatiquement au moment de la requête pour convertir une requête texte en vecteur. Il doit correspondre au modèle d'incorporation qui a encodé le contenu : il doit donc utiliser le même déploiement `text-embedding-3-large` que la compétence AzureOpenAIEmbedding.
  options:
    a:
      en: Query vectors from another embedding model aren't comparable with the indexed vectors, so relevance would collapse.
      fr: |
        Des vecteurs de requête issus d'un autre modèle d'incorporation ne sont pas comparables aux vecteurs indexés : la pertinence s'effondrerait.
    b:
      en: The semantic ranker reranks results; it doesn't create vectors from query text.
      fr: Le classeur sémantique réordonne les résultats ; il ne crée pas de vecteurs à partir du texte de la requête.
    d:
      en: Skills run in the indexing pipeline only; query-time vectorization is done by a vectorizer on the field.
      fr: Les compétences s'exécutent uniquement dans le pipeline d'indexation ; la vectorisation au moment de la requête est assurée par un vectoriseur sur le champ.
references:
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
