id: ai103-1c-oversight-statements
objective: "1.4.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys builds a support agent in Foundry Agent Service. The agent uses a function tool named issue_voucher, implemented in the application, and a third-party remote MCP server that exposes the tools search_kb, open_case, and close_case. The MCPTool sets `require_approval` to `{"never": ["search_kb"]}`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys crée un agent de support dans Foundry Agent Service. L'agent utilise un outil de fonction nommé issue_voucher, implémenté dans l'application, et un serveur MCP distant tiers qui expose les outils search_kb, open_case et close_case. Le MCPTool définit `require_approval` sur `{"never": ["search_kb"]}`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Calls to open_case and close_case wait for an approval before they run.
        fr: Les appels à open_case et close_case attendent une approbation avant de s'exécuter.
    - id: s2
      text:
        en: When the agent decides to issue a voucher, Agent Service runs issue_voucher and passes its output to the model.
        fr: Quand l'agent décide d'émettre un bon d'achat, Agent Service exécute issue_voucher et transmet sa sortie au modèle.
    - id: s3
      text:
        en: Microsoft tests and verifies the third-party MCP server before the agent can connect to it.
        fr: Microsoft teste et vérifie le serveur MCP tiers avant que l'agent puisse s'y connecter.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      With `{"never": [...]}`, only the listed tools skip approval; every other tool of the server still requires it. A function tool is run by the application: the model returns a `function_call` item, and the application can check or confirm the action before it runs the function and returns a `function_call_output`. Microsoft doesn't test or verify third-party remote MCP servers; their descriptions and results must be treated as untrusted input.
    fr: |
      Avec `{"never": [...]}`, seuls les outils listés sont dispensés d'approbation ; tous les autres outils du serveur l'exigent toujours. Un outil de fonction est exécuté par l'application : le modèle renvoie un élément `function_call`, et l'application peut vérifier ou faire confirmer l'action avant d'exécuter la fonction et de renvoyer un `function_call_output`. Microsoft ne teste ni ne vérifie les serveurs MCP distants tiers ; leurs descriptions et leurs résultats doivent être traités comme des entrées non fiables.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
  - title: Use function calling with Microsoft Foundry agents
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
