id: ai103-1a-foundry-iq-sources
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware is building five agents that must answer from the same company content, which is stored in SharePoint, Azure Blob Storage and OneLake. Each answer must cite its sources and include only content that the signed-in user is allowed to see.

    You need to choose the grounding service that all the agents will share.

    What should you use?
  fr: |
    Litware crée cinq agents qui doivent répondre à partir du même contenu d'entreprise, stocké dans SharePoint, Stockage Blob Azure et OneLake. Chaque réponse doit citer ses sources et ne contenir que du contenu que l'utilisateur connecté est autorisé à voir.

    Vous devez choisir le service d'ancrage que tous les agents partageront.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A file search vector store attached to each agent", fr: "Un magasin de vecteurs de recherche de fichiers attaché à chaque agent" } }
    - { id: b, text: { en: "A Foundry IQ knowledge base", fr: "Une base de connaissances Foundry IQ" } }
    - { id: c, text: { en: "A memory store shared by the agents", fr: "Un magasin de mémoire partagé par les agents" } }
    - { id: d, text: { en: "Grounding with Bing Custom Search", fr: "Grounding with Bing Custom Search" } }
answer: { optionId: b }
explanation:
  correct:
    en: A Foundry IQ knowledge base combines several knowledge sources (such as Blob Storage, SharePoint and OneLake) and can be shared by multiple agents. It uses agentic retrieval, returns source references, and enforces permissions at query time so that agents return only authorized content.
    fr: Une base de connaissances Foundry IQ combine plusieurs sources de connaissances (comme Stockage Blob, SharePoint et OneLake) et peut être partagée par plusieurs agents. Elle utilise la récupération agentique, renvoie les références des sources et applique les autorisations au moment de la requête, afin que les agents ne renvoient que du contenu autorisé.
  options:
    a:
      en: File search indexes files uploaded to a vector store; it doesn't connect to SharePoint or OneLake or trim results by user permissions.
      fr: La recherche de fichiers indexe des fichiers chargés dans un magasin de vecteurs ; elle ne se connecte pas à SharePoint ni à OneLake et ne filtre pas les résultats selon les autorisations de l'utilisateur.
    c:
      en: Memory holds what an agent learns about users across sessions; Learn recommends a knowledge base for curated organizational content.
      fr: La mémoire contient ce qu'un agent apprend sur les utilisateurs d'une session à l'autre ; Learn recommande une base de connaissances pour le contenu organisationnel organisé.
    d:
      en: Bing Custom Search grounds answers on public web domains, not on internal SharePoint, Blob Storage or OneLake content.
      fr: Bing Custom Search ancre les réponses sur des domaines web publics, pas sur le contenu interne de SharePoint, de Stockage Blob ou de OneLake.
references:
  - title: What is Foundry IQ?
    url: https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-foundry-iq
