id: ai103-sr2-nightly-batch-1
objective: "1.3.1"
type: series_yesno
series: ai103-sr2-nightly-batch
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You raise the TPM of chat-live and send the nightly requests to chat-live with retries.
  fr: Vous augmentez le TPM de chat-live et envoyez les requêtes nocturnes à chat-live avec de nouvelles tentatives.
body:
  solution:
    en: |
      You allocate unused regional quota to chat-live to raise its tokens-per-minute (TPM) limit. The nightly job sends its 60,000 requests to chat-live and retries each HTTP 429 response with exponential back-off that honors `retry-after-ms`.
    fr: |
      Vous allouez à chat-live du quota régional inutilisé pour augmenter sa limite de jetons par minute (TPM). Le travail nocturne envoie ses 60 000 requêtes à chat-live et relance chaque requête qui reçoit une réponse HTTP 429, avec un backoff exponentiel qui respecte `retry-after-ms`.
answer: { value: false }
explanation:
  correct:
    en: The nightly requests still go through chat-live, so they consume the same rate limit as the storefront assistant and can still cause 429 responses for it; retries only delay the job's own requests. The requests are also billed at the Global Standard rate, while a batch deployment processes the same work at a lower price.
    fr: "Les requêtes nocturnes passent toujours par chat-live : elles consomment la même limite de débit que l'assistant de la boutique et peuvent encore lui valoir des réponses 429 ; les nouvelles tentatives ne font que retarder les requêtes du travail. Elles sont en outre facturées au tarif Global Standard, alors qu'un déploiement de traitement par lots exécute le même travail à un prix inférieur."
references:
  - title: How to use global batch processing with Azure OpenAI in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/batch
