id: ai103-1c-filtered-call-results
objective: "1.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders calls a chat completions model deployment that has a guardrail with Annotate and block controls. You are writing the error handling of the application, which must distinguish blocked prompts, blocked completions, and responses that weren't checked.

    How does the API report each situation? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders appelle un déploiement de modèle de complétion de conversation doté d'un garde-fou avec des contrôles Annotate and block. Vous écrivez la gestion des erreurs de l'application, qui doit distinguer les invites bloquées, les complétions bloquées et les réponses qui n'ont pas été vérifiées.

    Comment l'API signale-t-elle chaque situation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      When the guardrail blocks the prompt, the call [[prompt]].

      When the guardrail blocks the completion, the call [[completion]].

      When the content filtering system is unavailable, the call [[unavailable]].
    fr: |
      Quand le garde-fou bloque l'invite, l'appel [[prompt]].

      Quand le garde-fou bloque la complétion, l'appel [[completion]].

      Quand le système de filtrage du contenu est indisponible, l'appel [[unavailable]].
  slots:
    - id: prompt
      options:
        - { id: e400, text: { en: "fails with HTTP 400 and the error code content_filter", fr: "échoue avec HTTP 400 et le code d'erreur content_filter" } }
        - { id: finish, text: { en: "returns HTTP 200 with finish_reason set to content_filter", fr: "renvoie HTTP 200 avec finish_reason défini sur content_filter" } }
        - { id: e429, text: { en: "fails with HTTP 429 and a Retry-After header", fr: "échoue avec HTTP 429 et un en-tête Retry-After" } }
        - { id: errobj, text: { en: "returns HTTP 200 with an error object in content_filter_results", fr: "renvoie HTTP 200 avec un objet error dans content_filter_results" } }
    - id: completion
      options:
        - { id: e400, text: { en: "fails with HTTP 400 and the error code content_filter", fr: "échoue avec HTTP 400 et le code d'erreur content_filter" } }
        - { id: finish, text: { en: "returns HTTP 200 with finish_reason set to content_filter", fr: "renvoie HTTP 200 avec finish_reason défini sur content_filter" } }
        - { id: e429, text: { en: "fails with HTTP 429 and a Retry-After header", fr: "échoue avec HTTP 429 et un en-tête Retry-After" } }
        - { id: errobj, text: { en: "returns HTTP 200 with an error object in content_filter_results", fr: "renvoie HTTP 200 avec un objet error dans content_filter_results" } }
    - id: unavailable
      options:
        - { id: e400, text: { en: "fails with HTTP 400 and the error code content_filter", fr: "échoue avec HTTP 400 et le code d'erreur content_filter" } }
        - { id: finish, text: { en: "returns HTTP 200 with finish_reason set to content_filter", fr: "renvoie HTTP 200 avec finish_reason défini sur content_filter" } }
        - { id: e429, text: { en: "fails with HTTP 429 and a Retry-After header", fr: "échoue avec HTTP 429 et un en-tête Retry-After" } }
        - { id: errobj, text: { en: "returns HTTP 200 with an error object in content_filter_results", fr: "renvoie HTTP 200 avec un objet error dans content_filter_results" } }
answer:
  values: { prompt: e400, completion: finish, unavailable: errobj }
explanation:
  correct:
    en: |
      A blocked prompt makes the call fail with HTTP 400 and the error code `content_filter`. A blocked completion still returns HTTP 200, with no content for that generation and `finish_reason` set to `content_filter`. If the filtering system is unavailable, the request completes with HTTP 200 without filtering, and `content_filter_results` contains an error object (code `content_filter_error`), so the application must check for it.
    fr: |
      Une invite bloquée fait échouer l'appel avec HTTP 400 et le code d'erreur `content_filter`. Une complétion bloquée renvoie quand même HTTP 200, sans contenu pour cette génération et avec `finish_reason` défini sur `content_filter`. Si le système de filtrage est indisponible, la requête aboutit avec HTTP 200 sans filtrage, et `content_filter_results` contient un objet d'erreur (code `content_filter_error`) : l'application doit donc le vérifier.
  options:
    prompt:
      en: HTTP 429 signals a rate limit, not a guardrail decision.
      fr: HTTP 429 signale une limite de débit, pas une décision du garde-fou.
    completion:
      en: A blocked completion doesn't make the call fail; only the filtered generation is marked with finish_reason content_filter.
      fr: Une complétion bloquée ne fait pas échouer l'appel ; seule la génération filtrée est marquée par finish_reason content_filter.
references:
  - title: Content filtering for Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter
