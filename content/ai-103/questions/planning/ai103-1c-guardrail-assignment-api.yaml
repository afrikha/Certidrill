id: ai103-1c-guardrail-assignment-api
objective: "1.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank automates the configuration of its Microsoft Foundry resource by using the management REST API. Two guardrails exist: **gr-legal** and **gr-strict**.

    You need to make gr-legal the guardrail of the model deployment **chat-legal**, and to let one script apply gr-strict to some of its chat completions requests only. The script must also detect a guardrail name that doesn't exist.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank automatise la configuration de sa ressource Microsoft Foundry au moyen de l'API REST de gestion. Deux garde-fous existent : **gr-legal** et **gr-strict**.

    Vous devez faire de gr-legal le garde-fou du déploiement de modèle **chat-legal**, et permettre à un script d'appliquer gr-strict à certaines de ses requêtes de complétion de conversation uniquement. Le script doit aussi détecter un nom de garde-fou inexistant.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the Deployments - Create Or Update request for chat-legal, set the [[prop]] property to gr-legal.

      In each request that must use gr-strict, send the [[header]] header with the value gr-strict.

      If that header names a guardrail that doesn't exist, the API returns the error code [[code]].
    fr: |
      Dans la requête Deployments - Create Or Update de chat-legal, définissez la propriété [[prop]] sur gr-legal.

      Dans chaque requête qui doit utiliser gr-strict, envoyez l'en-tête [[header]] avec la valeur gr-strict.

      Si cet en-tête désigne un garde-fou inexistant, l'API renvoie le code d'erreur [[code]].
  slots:
    - id: prop
      options:
        - { id: rai, text: raiPolicyName }
        - { id: upgrade, text: versionUpgradeOption }
        - { id: model, text: model }
    - id: header
      options:
        - { id: policy, text: x-policy-id }
        - { id: reqid, text: x-ms-client-request-id }
        - { id: key, text: api-key }
    - id: code
      options:
        - { id: invalid, text: InvalidContentFilterPolicy }
        - { id: filter, text: content_filter }
        - { id: filtererr, text: content_filter_error }
answer:
  values: { prop: rai, header: policy, code: invalid }
explanation:
  correct:
    en: |
      Behind the portal, a guardrail is an RAI policy: you assign it to a deployment through the `raiPolicyName` property of the Deployments - Create Or Update operation. The `x-policy-id` header overrides the deployment-level guardrail for one request. If the named policy doesn't exist, the API returns the error code `InvalidContentFilterPolicy`.
    fr: |
      Derrière le portail, un garde-fou est une stratégie RAI : vous l'attribuez à un déploiement par la propriété `raiPolicyName` de l'opération Deployments - Create Or Update. L'en-tête `x-policy-id` remplace le garde-fou du déploiement pour une requête. Si la stratégie désignée n'existe pas, l'API renvoie le code d'erreur `InvalidContentFilterPolicy`.
  options:
    prop:
      en: versionUpgradeOption controls automatic model version upgrades, and model identifies the deployed model; neither selects a guardrail.
      fr: versionUpgradeOption contrôle la mise à niveau automatique de la version du modèle, et model identifie le modèle déployé ; aucun des deux ne sélectionne un garde-fou.
    header:
      en: x-ms-client-request-id only correlates a request, and api-key carries the key used for authentication.
      fr: x-ms-client-request-id sert seulement à corréler une requête, et api-key transporte la clé d'authentification.
    code:
      en: content_filter means that content was blocked, and content_filter_error means that filtering didn't run.
      fr: content_filter signifie qu'un contenu a été bloqué, et content_filter_error que le filtrage ne s'est pas exécuté.
references:
  - title: How to configure guardrails and controls in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/how-to-create-guardrails
