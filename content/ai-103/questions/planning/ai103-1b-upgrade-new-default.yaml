id: ai103-1b-upgrade-new-default
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank has a Microsoft Foundry resource that contains a model deployment named **summarizer**. The deployment uses the Standard deployment type and is pinned to a specific model version.

    The product team wants summarizer to move automatically to each new default version of the model shortly after Microsoft designates it, without any manual action and without changing the application code.

    Which value should you set for the `versionUpgradeOption` property of summarizer?
  fr: |
    Woodgrove Bank dispose d'une ressource Microsoft Foundry qui contient un déploiement de modèle nommé **summarizer**. Le déploiement utilise le type de déploiement Standard et est épinglé sur une version précise du modèle.

    L'équipe produit souhaite que summarizer passe automatiquement à chaque nouvelle version par défaut du modèle peu après sa désignation par Microsoft, sans action manuelle et sans modifier le code de l'application.

    Quelle valeur devez-vous définir pour la propriété `versionUpgradeOption` de summarizer ?
body:
  options:
    - { id: a, text: "`OnceCurrentVersionExpired`" }
    - { id: b, text: "`NoAutoUpgrade`" }
    - { id: c, text: "`OnceNewDefaultVersionAvailable`" }
    - { id: d, text: { en: "No value (leave the property `null`)", fr: "Aucune valeur (laisser la propriété à `null`)" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With `OnceNewDefaultVersionAvailable`, the deployment upgrades automatically to the new default version within two weeks after the new version is designated as the default. The deployment name doesn't change, so the code keeps working.
    fr: |
      Avec `OnceNewDefaultVersionAvailable`, le déploiement passe automatiquement à la nouvelle version par défaut dans les deux semaines qui suivent sa désignation. Le nom du déploiement ne change pas : le code continue de fonctionner.
  options:
    a:
      en: "`OnceCurrentVersionExpired` upgrades only when the pinned version reaches its retirement date, not when a new default version is designated."
      fr: "`OnceCurrentVersionExpired` ne met à niveau qu'à la date de mise hors service de la version épinglée, pas lors de la désignation d'une nouvelle version par défaut."
    b:
      en: "`NoAutoUpgrade` never upgrades the deployment; it stops working when the version is retired."
      fr: "`NoAutoUpgrade` ne met jamais à niveau le déploiement ; il cesse de fonctionner à la mise hors service de la version."
    d:
      en: |
        A `null` value behaves like `OnceCurrentVersionExpired`, so the deployment would wait for the retirement of its version.
      fr: |
        Une valeur `null` se comporte comme `OnceCurrentVersionExpired` : le déploiement attendrait la mise hors service de sa version.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
