id: ai103-cs2c-model-upgrade
objective: "1.2.3"
type: single
caseStudy: ai103-cs2c-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to configure the version upgrade policy of chat-orders. The solution must meet the model lifecycle requirement. Which option should you select?
  fr: |
    Vous devez configurer la stratégie de mise à niveau de version de chat-orders. La solution doit satisfaire l'exigence relative au cycle de vie du modèle. Quelle option devez-vous sélectionner ?
body:
  options:
    - id: a
      text: Opt out of automatic model version upgrades
    - id: b
      text: Upgrade once new default version becomes available
    - id: c
      text: Once the current version expires
answer: { optionId: c }
explanation:
  correct:
    en: |
      With **Once the current version expires**, the deployment keeps its current version and moves automatically to the next available version when that version is retired, so order-agent keeps working.
    fr: |
      Avec **Once the current version expires**, le déploiement conserve sa version actuelle et passe automatiquement à la version disponible suivante quand cette version est mise hors service : order-agent continue donc de fonctionner.
  options:
    a:
      en: |
        An opted-out deployment stays on its version, but after the retirement it stops accepting requests and returns errors until you upgrade it manually.
      fr: |
        Un déploiement exclu des mises à niveau reste sur sa version, mais après la mise hors service il n'accepte plus de requêtes et renvoie des erreurs jusqu'à ce que vous le mettiez à niveau manuellement.
    b:
      en: |
        The deployment would move to each new default version before the current version is retired.
      fr: |
        Le déploiement passerait à chaque nouvelle version par défaut avant la mise hors service de la version actuelle.
references:
  - title: Model versioning in Microsoft Foundry Models (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/model-versions
