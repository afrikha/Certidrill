id: ai103-cs3b-agent-access
objective: "1.3.4"
type: single
caseStudy: ai103-cs3b-alpine
difficulty: 3
status: draft
stem:
  en: |
    You need to grant the managed identity of guest-api access to ski-concierge. The solution must meet the access requirement and follow the principle of least privilege. What should you do?
  fr: |
    Vous devez accorder à l'identité managée de guest-api l'accès à ski-concierge. La solution doit satisfaire l'exigence d'accès et respecter le principe du privilège minimum. Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "In the Azure portal, assign the Foundry Agent Consumer role to the identity at the scope of alpine-ai."
        fr: "Dans le portail Azure, attribuer le rôle Foundry Agent Consumer à l'identité dans l'étendue d'alpine-ai."
    - id: b
      text:
        en: "By using the Azure CLI, assign the Foundry User role to the identity at the scope of the concierge project."
        fr: "À l'aide d'Azure CLI, attribuer le rôle Foundry User à l'identité dans l'étendue du projet concierge."
    - id: c
      text:
        en: "By using the Azure CLI, assign the Foundry Agent Consumer role to the identity at the scope of ski-concierge."
        fr: "À l'aide d'Azure CLI, attribuer le rôle Foundry Agent Consumer à l'identité dans l'étendue de ski-concierge."
    - id: d
      text:
        en: "In the Azure portal, assign the Reader role to the identity at the scope of the concierge project."
        fr: "Dans le portail Azure, attribuer le rôle Reader à l'identité dans l'étendue du projet concierge."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Foundry Agent Consumer is the least-privilege role for principals that only interact with agents through their endpoints, without creating or modifying them. Assigned at the scope of a single agent, it lets guest-api call ski-concierge but not staff-assistant. The Azure portal assigns this role only at the Foundry account scope, so a project or agent scope requires the Azure CLI.
    fr: |
      Foundry Agent Consumer est le rôle de privilège minimum pour les principaux qui interagissent seulement avec des agents par leurs points de terminaison, sans les créer ni les modifier. Attribué dans l'étendue d'un seul agent, il permet à guest-api d'appeler ski-concierge mais pas staff-assistant. Le portail Azure n'attribue ce rôle que dans l'étendue du compte Foundry : une étendue de projet ou d'agent exige Azure CLI.
  options:
    a:
      en: |
        At the scope of the Foundry resource, the role applies to every agent, so guest-api could also call staff-assistant.
      fr: |
        Dans l'étendue de la ressource Foundry, le rôle s'applique à tous les agents : guest-api pourrait aussi appeler staff-assistant.
    b:
      en: |
        Foundry User grants data actions to build and develop in the project, including creating and modifying agents, and it covers every agent in the project.
      fr: |
        Foundry User accorde des actions de données pour créer et développer dans le projet, y compris créer et modifier des agents, et il couvre tous les agents du projet.
    d:
      en: |
        Reader grants control-plane read access only; it does not allow the identity to send requests to an agent endpoint.
      fr: |
        Reader accorde uniquement un accès en lecture au plan de contrôle ; il ne permet pas à l'identité d'envoyer des requêtes au point de terminaison d'un agent.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-azure-ai-foundry
