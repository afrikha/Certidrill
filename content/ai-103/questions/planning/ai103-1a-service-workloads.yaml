id: ai103-1a-service-workloads
objective: "1.1.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is planning four AI workloads on Microsoft Foundry.

    Which service should you use for each workload? To answer, drag the appropriate services to the correct workloads. Each service may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders prévoit quatre charges de travail d'IA sur Microsoft Foundry.

    Quel service devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les services appropriés vers les charges de travail correspondantes. Chaque service peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: models, text: { en: "Foundry Models (model deployment)", fr: "Foundry Models (déploiement de modèle)" } }
    - { id: search, text: Azure AI Search }
    - { id: cu, text: Azure Content Understanding }
    - { id: agents, text: Foundry Agent Service }
    - { id: speech, text: Azure Speech }
    - { id: translator, text: Azure Translator }
  targets:
    - id: gen
      text: { en: "Write product descriptions from a list of features", fr: "Rédiger des descriptions de produits à partir d'une liste de caractéristiques" }
    - id: retrieve
      text: { en: "Run keyword and vector queries over the product catalog", fr: "Exécuter des requêtes par mots clés et vectorielles sur le catalogue de produits" }
    - id: notes
      text: { en: "Convert scanned delivery notes into Markdown for a RAG index", fr: "Convertir des bons de livraison numérisés en Markdown pour un index RAG" }
    - id: assistant
      text: { en: "Run an assistant that calls tools and keeps the conversation state", fr: "Exécuter un assistant qui appelle des outils et conserve l'état de la conversation" }
answer:
  mapping: { gen: models, retrieve: search, notes: cu, assistant: agents }
explanation:
  correct:
    en: |
      A model deployment generates text. Azure AI Search runs full-text, vector and hybrid queries over an index. Content Understanding turns documents into Markdown for search and retrieval, or into fields. Foundry Agent Service runs agents and manages their conversations, tool calls and lifecycle.
    fr: |
      Un déploiement de modèle génère du texte. Azure AI Search exécute des requêtes en texte intégral, vectorielles et hybrides sur un index. Content Understanding transforme des documents en Markdown pour la recherche et la récupération, ou en champs. Foundry Agent Service exécute des agents et gère leurs conversations, leurs appels d'outils et leur cycle de vie.
  options:
    speech:
      en: Azure Speech converts speech to text and text to speech; no workload involves audio.
      fr: Azure Speech convertit la parole en texte et le texte en parole ; aucune charge de travail ne concerne de l'audio.
    translator:
      en: Azure Translator translates text and documents; no workload requires translation.
      fr: Azure Translator traduit du texte et des documents ; aucune charge de travail ne nécessite de traduction.
references:
  - title: What are Foundry Tools?
    url: https://learn.microsoft.com/en-us/azure/ai-services/what-are-ai-services
  - title: What is Microsoft Foundry Agent Service?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/overview
