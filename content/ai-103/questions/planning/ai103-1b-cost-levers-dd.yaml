id: ai103-1b-cost-levers-dd
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Margie's Travel runs several AI workloads in Microsoft Foundry and wants to lower its costs. No workload has a data residency constraint.

    Which option should you use for each workload? To answer, drag the appropriate options to the correct workloads. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Margie's Travel exécute plusieurs charges de travail IA dans Microsoft Foundry et souhaite réduire ses coûts. Aucune charge de travail n'a de contrainte de résidence des données.

    Quelle option devez-vous utiliser pour chaque charge de travail ? Pour répondre, faites glisser les options appropriées vers les charges de travail correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: batch, text: { en: "A Global Batch deployment", fr: "Un déploiement Global Batch" } }
    - { id: ptu, text: { en: "A provisioned deployment with an Azure Reservation", fr: "Un déploiement provisionné avec une réservation Azure" } }
    - { id: small, text: { en: "A deployment of a smaller, cheaper model", fr: "Un déploiement d'un modèle plus petit et moins cher" } }
    - { id: dev, text: { en: "A Developer deployment", fr: "Un déploiement Developer" } }
    - { id: spill, text: { en: "A spillover deployment", fr: "Un déploiement de débordement (spillover)" } }
  targets:
    - { id: t1, text: { en: "Classify 3 million archived reviews; results are needed within two days", fr: "Classer 3 millions d'avis archivés ; les résultats sont attendus sous deux jours" } }
    - { id: t2, text: { en: "A booking assistant with high, steady traffic around the clock that needs consistent latency", fr: "Un assistant de réservation au trafic élevé et régulier jour et nuit, qui exige une latence constante" } }
    - { id: t3, text: { en: "A routing step that only labels each message with one of five intents", fr: "Une étape de routage qui se contente d'étiqueter chaque message avec l'une de cinq intentions" } }
    - { id: t4, text: { en: "Try a fine-tuned model for a few hours before deciding to deploy it to production", fr: "Essayer un modèle affiné pendant quelques heures avant de décider de le déployer en production" } }
answer:
  mapping: { t1: batch, t2: ptu, t3: small, t4: dev }
explanation:
  correct:
    en: |
      Global Batch processes asynchronous jobs at 50 % less than Global Standard with a 24-hour target. Steady, high traffic that needs consistent latency fits provisioned throughput, and a reservation discounts its hourly price. A simple classification task doesn't need a large model, so a smaller model costs much less. The Developer type is designed for low-cost evaluation of fine-tuned models, with no SLA and a 24-hour lifetime. Spillover handles overflow of a provisioned deployment; it isn't a cost saver by itself.
    fr: |
      Global Batch traite les travaux asynchrones 50 % moins cher que Global Standard, avec un objectif de 24 heures. Un trafic élevé et régulier qui exige une latence constante correspond au débit provisionné, et une réservation réduit son tarif horaire. Une tâche de classification simple n'a pas besoin d'un grand modèle : un modèle plus petit coûte beaucoup moins cher. Le type Developer est conçu pour évaluer à faible coût des modèles affinés, sans SLA et avec une durée de vie de 24 heures. Le débordement absorbe l'excédent d'un déploiement provisionné ; il ne réduit pas les coûts à lui seul.
references:
  - title: Understanding deployment types in Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
  - title: Provisioned throughput for Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/provisioned-throughput
