id: ai103-1c-trace-viewer-role
objective: "1.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware, Inc. has a Microsoft Foundry project named **proj-claims** with a connected Application Insights resource named **appi-claims**. Agent traces are sent to appi-claims. The Log Analytics tables aren't protected.

    An auditor named User1 already has the Foundry User role on proj-claims. User1 must view the agent traces in the Foundry portal. The solution must follow the principle of least privilege.

    Which role should you assign to User1?
  fr: |
    Litware, Inc. dispose d'un projet Microsoft Foundry nommé **proj-claims** avec une ressource Application Insights connectée nommée **appi-claims**. Les traces des agents sont envoyées à appi-claims. Les tables Log Analytics ne sont pas protégées.

    Un auditeur nommé User1 dispose déjà du rôle Foundry User sur proj-claims. User1 doit consulter les traces des agents dans le portail Foundry. La solution doit respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à User1 ?
body:
  options:
    - { id: a, text: { en: "Contributor on proj-claims", fr: "Contributor sur proj-claims" } }
    - { id: b, text: { en: "Log Analytics Reader on appi-claims", fr: "Log Analytics Reader sur appi-claims" } }
    - { id: c, text: { en: "Foundry Account Owner on the Foundry resource", fr: "Foundry Account Owner sur la ressource Foundry" } }
    - { id: d, text: { en: "Storage Blob Data Reader on the storage account of the project", fr: "Storage Blob Data Reader sur le compte de stockage du projet" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Viewing traces in Foundry requires the Log Analytics Reader role on the connected Application Insights resource. Privileged Monitoring Data Reader would also be needed only if the Log Analytics tables were protected.
    fr: |
      La consultation des traces dans Foundry exige le rôle Log Analytics Reader sur la ressource Application Insights connectée. Privileged Monitoring Data Reader ne serait nécessaire en plus que si les tables Log Analytics étaient protégées.
  options:
    a:
      en: |
        Contributor on the project is what you need to set up tracing, not to read the telemetry in Application Insights.
      fr: |
        Contributor sur le projet sert à configurer le suivi, pas à lire la télémétrie dans Application Insights.
    c:
      en: |
        Foundry Account Owner manages the Foundry resource, for example its guardrails, and grants no read access to the telemetry in appi-claims.
      fr: |
        Foundry Account Owner gère la ressource Foundry, par exemple ses garde-fous, et n'accorde aucun accès en lecture à la télémétrie d'appi-claims.
    d:
      en: |
        Traces aren't stored in the storage account of the project but in Application Insights.
      fr: |
        Les traces ne sont pas stockées dans le compte de stockage du projet mais dans Application Insights.
references:
  - title: Add client-side tracing to Foundry agents
    url: https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side
  - title: Agent tracing overview
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/observability/concepts/trace-agent-concept
