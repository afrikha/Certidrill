id: ai103-1b-red-teaming
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a customer-facing agent in Microsoft Foundry. Content filters are configured, and continuous evaluation already scores a sample of production traffic for relevance and groundedness.

    The security team requires that every month the agent is probed with adversarial attacks to find new safety and security vulnerabilities, without waiting for real users to attempt them.

    What should you add?
  fr: |
    Contoso exécute un agent destiné aux clients dans Microsoft Foundry. Des filtres de contenu sont configurés, et l'évaluation continue note déjà un échantillon du trafic de production pour la pertinence et l'ancrage.

    L'équipe sécurité exige que l'agent soit soumis chaque mois à des attaques adverses afin de découvrir de nouvelles vulnérabilités de sécurité, sans attendre que de vrais utilisateurs les tentent.

    Que devez-vous ajouter ?
body:
  options:
    - { id: a, text: { en: "Scheduled red teaming runs with the AI red teaming agent", fr: "Des exécutions planifiées de red teaming avec l'agent de red teaming IA" } }
    - { id: b, text: { en: "Coherence and fluency evaluators in the continuous evaluation", fr: "Les évaluateurs Coherence et Fluency dans l'évaluation continue" } }
    - { id: c, text: { en: "A lower severity threshold in the content filter of the deployment", fr: "Un seuil de gravité plus bas dans le filtre de contenu du déploiement" } }
    - { id: d, text: { en: "An Azure Monitor alert on the Blocked Volume metric", fr: "Une alerte Azure Monitor sur la métrique Blocked Volume" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Post-production monitoring in Foundry combines operational metrics, continuous evaluation, scheduled evaluation and scheduled red teaming. Red teaming sends adversarial inputs to the agent on a schedule to probe for safety and security vulnerabilities; the AI red teaming agent builds on Microsoft's PyRIT framework.
    fr: |
      La surveillance après la mise en production dans Foundry combine les métriques opérationnelles, l'évaluation continue, l'évaluation planifiée et le red teaming planifié. Le red teaming envoie des entrées adverses à l'agent selon une planification pour détecter les vulnérabilités de sécurité ; l'agent de red teaming IA repose sur le framework PyRIT de Microsoft.
  options:
    b:
      en: |
        Coherence and fluency score language quality on real traffic; they don't generate attacks.
      fr: |
        Coherence et Fluency notent la qualité de la langue sur le trafic réel ; ils ne génèrent pas d'attaques.
    c:
      en: |
        A stricter filter blocks more content at run time but doesn't search for new vulnerabilities.
      fr: |
        Un filtre plus strict bloque davantage de contenu à l'exécution, mais ne recherche pas de nouvelles vulnérabilités.
    d:
      en: |
        An alert on blocked calls only reports what real users already sent.
      fr: |
        Une alerte sur les appels bloqués ne signale que ce que de vrais utilisateurs ont déjà envoyé.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
