id: ai103-1a-deployment-sku-bicep
objective: "1.2.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso deploys two `gpt-4.1-mini` deployments in the Foundry resource **foundry**, located in Sweden Central, by using Bicep:

    - **chat-eu** serves an interactive assistant. It must use pay-per-token billing, process prompts only within the EU Data Boundary, and have the highest default quota among the types that meet these conditions.
    - **archive-eu** classifies three million archived letters asynchronously at the lowest cost. Prompts must also be processed only within the EU Data Boundary.

    How should you complete the Bicep file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso déploie avec Bicep deux déploiements `gpt-4.1-mini` dans la ressource Foundry **foundry**, située dans Sweden Central :

    - **chat-eu** sert un assistant interactif. Il doit utiliser la facturation par jeton, traiter les invites uniquement dans l'EU Data Boundary et disposer du quota par défaut le plus élevé parmi les types qui remplissent ces conditions.
    - **archive-eu** classe trois millions de courriers archivés de façon asynchrone, au coût le plus bas. Les invites doivent aussi être traitées uniquement dans l'EU Data Boundary.

    Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource chat 'Microsoft.CognitiveServices/accounts/deployments@2025-06-01' = {
      parent: foundry
      name: 'chat-eu'
      sku: {
        name: [[chatsku]]
        capacity: 100
      }
      properties: {
        model: { format: 'OpenAI', name: 'gpt-4.1-mini', version: '2025-04-14' }
      }
    }

    resource archive 'Microsoft.CognitiveServices/accounts/deployments@2025-06-01' = {
      parent: foundry
      name: 'archive-eu'
      dependsOn: [ chat ]
      sku: {
        name: [[archivesku]]
        capacity: 100
      }
      properties: {
        model: { format: 'OpenAI', name: 'gpt-4.1-mini', version: '2025-04-14' }
      }
    }
  slots:
    - id: chatsku
      options:
        - { id: gstd, text: "'GlobalStandard'" }
        - { id: dzstd, text: "'DataZoneStandard'" }
        - { id: dzprov, text: "'DataZoneProvisionedManaged'" }
        - { id: dzbatch, text: "'DataZoneBatch'" }
    - id: archivesku
      options:
        - { id: gbatch, text: "'GlobalBatch'" }
        - { id: dzstd, text: "'DataZoneStandard'" }
        - { id: dzbatch, text: "'DataZoneBatch'" }
        - { id: gstd, text: "'GlobalStandard'" }
answer:
  values: { chatsku: dzstd, archivesku: dzbatch }
explanation:
  correct:
    en: "`DataZoneStandard` is pay-per-token, processes data within the data zone (the EU Data Boundary for an EU resource) and has higher default quotas than the geography-based types. `DataZoneBatch` offers the batch functionality of Global Batch, at 50% less than Global Standard with a 24-hour target, while processing data within the data zone only."
    fr: "`DataZoneStandard` est facturé par jeton, traite les données dans la zone de données (l'EU Data Boundary pour une ressource de l'UE) et dispose de quotas par défaut plus élevés que les types basés sur une zone géographique. `DataZoneBatch` offre les fonctionnalités de Global Batch, avec un coût inférieur de 50 % à Global Standard et un objectif de 24 heures, tout en traitant les données uniquement dans la zone de données."
  options:
    chatsku:
      en: "`GlobalStandard` may process prompts in any region, `DataZoneProvisionedManaged` is billed per PTU per hour, and `DataZoneBatch` has no real-time SLA for an interactive assistant."
      fr: "`GlobalStandard` peut traiter les invites dans n'importe quelle région, `DataZoneProvisionedManaged` est facturé par PTU et par heure, et `DataZoneBatch` n'a pas de SLA en temps réel pour un assistant interactif."
    archivesku:
      en: "`GlobalBatch` and `GlobalStandard` may process prompts outside the EU Data Boundary, and `DataZoneStandard` costs twice as much as a batch deployment for asynchronous work."
      fr: "`GlobalBatch` et `GlobalStandard` peuvent traiter les invites en dehors de l'EU Data Boundary, et `DataZoneStandard` coûte deux fois plus qu'un déploiement par lots pour un travail asynchrone."
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
