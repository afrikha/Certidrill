id: ai103-1c-defaultv2-detections
objective: "1.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum Corporation deploys a text chat model named **chat-hr** in a Microsoft Foundry project. Nobody has created or assigned a custom guardrail, so chat-hr uses the default guardrail Microsoft.DefaultV2.

    The application sends employee questions to chat-hr and inserts excerpts of HR policy files into the prompt as documents.

    Which two detections does Microsoft.DefaultV2 apply to the traffic of chat-hr?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum Corporation déploie un modèle de conversation textuel nommé **chat-hr** dans un projet Microsoft Foundry. Personne n'a créé ni attribué de garde-fou personnalisé : chat-hr utilise donc le garde-fou par défaut Microsoft.DefaultV2.

    L'application envoie les questions des employés à chat-hr et insère dans l'invite des extraits de fichiers de politique RH sous forme de documents.

    Quelles sont les deux détections que Microsoft.DefaultV2 applique au trafic de chat-hr ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "User prompt attack (jailbreak) detection on prompts", fr: "Détection des attaques par invite utilisateur (jailbreak) sur les invites" }
    - id: b
      text: { en: "Document (indirect) attack detection on the inserted documents", fr: "Détection des attaques par document (indirectes) sur les documents insérés" }
    - id: c
      text: { en: "Protected material for code detection on completions", fr: "Détection du contenu protégé pour le code sur les complétions" }
    - id: d
      text: { en: "Personally identifiable information detection on completions", fr: "Détection des informations d'identification personnelle sur les complétions" }
    - id: e
      text: { en: "Violence filtering that blocks low-severity content on prompts and completions", fr: "Filtrage de la violence qui bloque le contenu de gravité faible sur les invites et les complétions" }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      For text models, the default policy filters the four harm categories at the Medium level on prompts and completions, detects user prompt attacks (jailbreaks) on prompts, and detects protected material for text and for code on completions.
    fr: |
      Pour les modèles de texte, la stratégie par défaut filtre les quatre catégories de préjudice au niveau Medium sur les invites et les complétions, détecte les attaques par invite utilisateur (jailbreak) sur les invites, et détecte le contenu protégé pour le texte et pour le code sur les complétions.
  options:
    b:
      en: Document attack detection is off by default; you must enable it in a custom guardrail.
      fr: La détection des attaques par document est désactivée par défaut ; vous devez l'activer dans un garde-fou personnalisé.
    d:
      en: Personally identifiable information detection isn't part of the default policy; it's a preview control that you add to a custom guardrail.
      fr: La détection des informations d'identification personnelle ne fait pas partie de la stratégie par défaut ; c'est un contrôle en préversion à ajouter à un garde-fou personnalisé.
    e:
      en: The default Violence filter uses the Medium level, which blocks medium- and high-severity content but not low-severity content.
      fr: Le filtre Violence par défaut utilise le niveau Medium, qui bloque le contenu de gravité moyenne et élevée, mais pas le contenu de gravité faible.
references:
  - title: Default safety policies in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/default-safety-policies
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
