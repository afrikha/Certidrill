id: ai103-1a-embedding-models
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure AI Search index whose vectors were generated by a `text-embedding-ada-002` deployment. The team plans to use a third-generation embedding model for a new index.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un index Azure AI Search dont les vecteurs ont été générés par un déploiement `text-embedding-ada-002`. L'équipe prévoit d'utiliser un modèle d'incorporation de troisième génération pour un nouvel index.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: By default, `text-embedding-3-large` returns vectors of 3,072 dimensions.
        fr: Par défaut, `text-embedding-3-large` renvoie des vecteurs de 3 072 dimensions.
    - id: s2
      text:
        en: After you switch the application to `text-embedding-3-small`, you can query the existing index with the new query vectors because both models return 1,536 dimensions.
        fr: Après avoir basculé l'application vers `text-embedding-3-small`, vous pouvez interroger l'index existant avec les nouveaux vecteurs de requête, car les deux modèles renvoient 1 536 dimensions.
    - id: s3
      text:
        en: You can use the `dimensions` parameter of `text-embedding-3-small` to get shorter vectors.
        fr: Vous pouvez utiliser le paramètre `dimensions` de `text-embedding-3-small` pour obtenir des vecteurs plus courts.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "`text-embedding-3-large` returns 3,072 dimensions by default, and the third-generation models accept a `dimensions` parameter to reduce the output size. Vectors from different embedding models aren't comparable even when their sizes match: you can't upgrade between embedding models, so moving away from `text-embedding-ada-002` means regenerating the embeddings of the index."
    fr: "`text-embedding-3-large` renvoie 3 072 dimensions par défaut, et les modèles de troisième génération acceptent un paramètre `dimensions` pour réduire la taille de la sortie. Les vecteurs de modèles d'incorporation différents ne sont pas comparables, même quand leur taille est identique : il est impossible de passer d'un modèle d'incorporation à un autre sans régénérer les incorporations de l'index."
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
