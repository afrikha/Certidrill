id: ai103-1b-network-dd
objective: "1.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum is securing the network access of three Microsoft Foundry resources. Each resource has its own requirement.

    Which configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum sécurise l'accès réseau de trois ressources Microsoft Foundry. Chaque ressource a sa propre exigence.

    Quelle configuration devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pe, text: { en: "A private endpoint, with public network access Disabled", fr: "Un point de terminaison privé, avec l'accès réseau public sur Disabled" } }
    - { id: selip, text: { en: "Public network access Enabled from selected IP addresses", fr: "Accès réseau public Enabled from selected IP addresses" } }
    - { id: trusted, text: { en: "The trusted Azure services exception", fr: "L'exception des services Azure approuvés" } }
    - { id: inject, text: { en: "A subnet delegated to Microsoft.App/environments for agent network injection", fr: "Un sous-réseau délégué à Microsoft.App/environments pour l'injection réseau des agents" } }
    - { id: all, text: { en: "Public network access set to All networks", fr: "Accès réseau public défini sur All networks" } }
  targets:
    - { id: t1, text: { en: "Allow access only from the public IP range of the head office; no private connectivity is available", fr: "Autoriser l'accès uniquement depuis la plage d'adresses IP publiques du siège ; aucune connectivité privée n'est disponible" } }
    - { id: t2, text: { en: "Let an Azure AI Search service reach the resource, whose network access is restricted, by using its managed identity", fr: "Permettre à un service Azure AI Search de joindre la ressource, dont l'accès réseau est restreint, à l'aide de son identité managée" } }
    - { id: t3, text: { en: "Let agents call an internal API that is reachable only inside the company's virtual network", fr: "Permettre aux agents d'appeler une API interne joignable uniquement dans le réseau virtuel de l'entreprise" } }
answer:
  mapping: { t1: selip, t2: trusted, t3: inject }
explanation:
  correct:
    en: |
      Enabled from selected IP addresses keeps the public endpoint but accepts only the addresses you specify. When a Foundry resource restricts network access, the trusted Azure services exception lets services such as Azure AI Search in while keeping the rules for other callers; they authenticate with managed identity. Agents reach private resources through network injection into a subnet delegated to Microsoft.App/environments. A private endpoint requires private connectivity, and All networks restricts nothing.
    fr: |
      Enabled from selected IP addresses conserve le point de terminaison public, mais n'accepte que les adresses indiquées. Lorsqu'une ressource Foundry restreint l'accès réseau, l'exception des services Azure approuvés laisse entrer des services comme Azure AI Search tout en conservant les règles pour les autres appelants ; ils s'authentifient avec une identité managée. Les agents joignent des ressources privées par injection réseau dans un sous-réseau délégué à Microsoft.App/environments. Un point de terminaison privé exige une connectivité privée, et All networks ne restreint rien.
references:
  - title: How to configure network isolation for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/configure-private-link
