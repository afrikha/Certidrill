id: ai103-1a-chunking-facts
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys indexes 300-page product manuals in Azure AI Search for a RAG solution. The vectors are generated by a `text-embedding-3-small` deployment. The team is defining its chunking strategy.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys indexe des manuels produits de 300 pages dans Azure AI Search pour une solution RAG. Les vecteurs sont générés par un déploiement `text-embedding-3-small`. L'équipe définit sa stratégie de segmentation.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each manual can be embedded as a single input because the model accepts up to 100,000 tokens.", fr: "Chaque manuel peut être incorporé en une seule entrée, car le modèle accepte jusqu'à 100 000 jetons." } }
    - { id: b, text: { en: "Learn recommends starting with chunks of 512 tokens and an overlap of 25%.", fr: "Learn recommande de commencer avec des segments de 512 jetons et un chevauchement de 25 %." } }
    - { id: c, text: { en: "Chunking lets the portions of a manual be matched independently of each other.", fr: "La segmentation permet de faire correspondre les parties d'un manuel indépendamment les unes des autres." } }
    - { id: d, text: { en: "Chunking is a hard requirement of integrated vectorization, even for very short documents.", fr: "La segmentation est une obligation stricte de la vectorisation intégrée, même pour des documents très courts." } }
    - { id: e, text: { en: "The semantic ranker reads each whole manual, so chunk size has no effect on reranking.", fr: "Le classeur sémantique lit chaque manuel en entier : la taille des segments n'a donc aucun effet sur le reclassement." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: Learn recommends starting with 512-token chunks (about 2,000 characters) and a 25% overlap (128 tokens). Chunking subdivides large documents so that their portions can be matched independently, which also keeps each input within the limit of the embedding model.
    fr: Learn recommande de commencer avec des segments de 512 jetons (environ 2 000 caractères) et un chevauchement de 25 % (128 jetons). La segmentation subdivise les documents volumineux pour que leurs parties puissent correspondre indépendamment, ce qui maintient aussi chaque entrée dans la limite du modèle d'incorporation.
  options:
    a:
      en: The maximum input of `text-embedding-3-small` is 8,191 tokens, about 6,000 words.
      fr: L'entrée maximale de `text-embedding-3-small` est de 8 191 jetons, soit environ 6 000 mots.
    d:
      en: Chunking isn't a hard requirement; it is needed when documents exceed the input limit of the embedding model.
      fr: La segmentation n'est pas une obligation stricte ; elle devient nécessaire quand les documents dépassent la limite d'entrée du modèle d'incorporation.
    e:
      en: The semantic ranker accepts up to 2,000 tokens per document and trims longer inputs.
      fr: Le classeur sémantique accepte jusqu'à 2 000 jetons par document et tronque les entrées plus longues.
references:
  - title: Chunk large documents for RAG and vector search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-chunk-documents
  - title: Integrated vector embedding in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization
