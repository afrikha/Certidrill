id: ai103-1b-drift-causes
objective: "1.3.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs a RAG agent that answers questions from product manuals indexed in Azure AI Search. A scheduled evaluation runs every week on the same test dataset. Over three weeks, the average groundedness score fell from 4.6 to 3.7, while the latency and the error rate didn't change.

    Your team didn't change the agent definition, the code or the evaluation dataset during that period.

    Which two issues could explain the drop?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exécute un agent RAG qui répond aux questions à partir de manuels de produits indexés dans Azure AI Search. Une évaluation planifiée s'exécute chaque semaine sur le même jeu de données de test. En trois semaines, le score moyen de Groundedness est passé de 4,6 à 3,7, tandis que la latence et le taux d'erreur n'ont pas changé.

    Votre équipe n'a modifié ni la définition de l'agent, ni le code, ni le jeu de données d'évaluation pendant cette période.

    Quels sont les deux problèmes qui pourraient expliquer cette baisse ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The TPM of the model deployment was increased.", fr: "Les TPM du déploiement de modèle ont été augmentés." } }
    - { id: b, text: { en: "A spillover deployment of the same model and version was added to the deployment.", fr: "Un déploiement de débordement du même modèle et de la même version a été ajouté au déploiement." } }
    - { id: c, text: { en: "Recent indexer runs left many updated manuals out of the index because of document errors.", fr: "Les dernières exécutions de l'indexeur ont laissé de nombreux manuels mis à jour hors de l'index à cause d'erreurs de document." } }
    - { id: d, text: { en: "Diagnostic settings that send resource logs to Log Analytics were enabled on the Foundry resource.", fr: "Des paramètres de diagnostic qui envoient les journaux de ressource vers Log Analytics ont été activés sur la ressource Foundry." } }
    - { id: e, text: { en: "The model deployment has the OnceNewDefaultVersionAvailable policy, and a new default model version was designated.", fr: "Le déploiement de modèle a la stratégie OnceNewDefaultVersionAvailable, et une nouvelle version par défaut du modèle a été désignée." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Drift with no change on your side usually comes from the model or from the data. With OnceNewDefaultVersionAvailable, the deployment moves to a new default version within two weeks of its designation, and the new version can behave differently. If indexer runs fail on updated documents, retrieval returns missing or outdated context and the answers are less supported by it. Comparing scheduled evaluations run after run on the same dataset is how you detect such drift.
    fr: |
      Une dérive sans changement de votre côté vient généralement du modèle ou des données. Avec OnceNewDefaultVersionAvailable, le déploiement passe à une nouvelle version par défaut dans les deux semaines qui suivent sa désignation, et la nouvelle version peut se comporter différemment. Si des exécutions de l'indexeur échouent sur des documents mis à jour, la récupération renvoie un contexte manquant ou obsolète et les réponses s'appuient moins sur lui. Comparer des évaluations planifiées d'une exécution à l'autre sur le même jeu de données permet de détecter ce type de dérive.
  options:
    a:
      en: |
        More TPM changes the rate limit, not the content of the answers.
      fr: |
        Plus de TPM modifie la limite de débit, pas le contenu des réponses.
    b:
      en: |
        A spillover deployment runs the same model and version, so the answers don't change in nature.
      fr: |
        Un déploiement de débordement exécute le même modèle et la même version : la nature des réponses ne change pas.
    d:
      en: |
        Collecting logs doesn't change how the agent answers.
      fr: |
        Collecter des journaux ne change pas la façon dont l'agent répond.
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
