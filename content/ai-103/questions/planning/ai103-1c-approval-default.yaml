id: ai103-1c-approval-default
objective: "1.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware, Inc. creates a prompt agent in Foundry Agent Service and adds an `MCPTool` that points to the MCP server of its ticketing system. The developer sets `server_label`, `server_url`, and `project_connection_id`, but doesn't set `require_approval` or `allowed_tools`.

    What happens when the agent decides to call a tool of the server?
  fr: |
    Litware, Inc. crée un agent d'invite dans Foundry Agent Service et ajoute un `MCPTool` qui pointe vers le serveur MCP de son système de tickets. Le développeur définit `server_label`, `server_url` et `project_connection_id`, mais ne définit ni `require_approval` ni `allowed_tools`.

    Que se passe-t-il quand l'agent décide d'appeler un outil du serveur ?
body:
  options:
    - id: a
      text: { en: "The tool runs immediately, because approval is off unless you set require_approval.", fr: "L'outil s'exécute immédiatement, car l'approbation est désactivée tant que require_approval n'est pas défini." }
    - id: b
      text: { en: "The response contains an approval request, and the tool runs only after an approval is sent back.", fr: "La réponse contient une demande d'approbation, et l'outil ne s'exécute qu'après le renvoi d'une approbation." }
    - id: c
      text: { en: "The call fails, because no tool is allowed until allowed_tools lists it.", fr: "L'appel échoue, car aucun outil n'est autorisé tant qu'allowed_tools ne le liste pas." }
    - id: d
      text: { en: "The tool runs immediately for read operations, and write operations wait for approval.", fr: "L'outil s'exécute immédiatement pour les opérations de lecture, et les opérations d'écriture attendent une approbation." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The default value of `require_approval` is `"always"`: every call returns an `mcp_approval_request` item, and the tool runs only after the application sends an `mcp_approval_response` that approves it.
    fr: |
      La valeur par défaut de `require_approval` est `"always"` : chaque appel renvoie un élément `mcp_approval_request`, et l'outil ne s'exécute qu'après l'envoi par l'application d'un `mcp_approval_response` qui l'approuve.
  options:
    a:
      en: |
        Approval is on by default; you must set require_approval to "never" to remove it.
      fr: |
        L'approbation est activée par défaut ; vous devez définir require_approval sur "never" pour la supprimer.
    c:
      en: |
        When allowed_tools is omitted, all the tools of the server are available.
      fr: |
        Quand allowed_tools est omis, tous les outils du serveur sont disponibles.
    d:
      en: |
        require_approval has no read or write mode; approval varies per tool only when you list tool names in it.
      fr: |
        require_approval n'a pas de mode lecture ou écriture ; l'approbation ne varie selon l'outil que si vous y listez des noms d'outils.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
