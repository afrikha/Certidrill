id: ai103-1a-hybrid-query-json
objective: "1.1.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure AI Search index named **manuals**. The vector field **contentVector** has a vectorizer that uses the same embedding model as the indexing pipeline, and the index has a semantic configuration named **manuals-semantic**.

    The application sends the following body to the Search Documents REST API. The query must meet these requirements:

    - Run full-text and vector retrieval in the same request, with the service embedding the query text.
    - Rerank the merged results with the semantic ranker.
    - Give the semantic ranker the maximum number of results it can rerank.

    How should you complete the request body? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un index Azure AI Search nommé **manuals**. Le champ vectoriel **contentVector** possède un vectoriseur qui utilise le même modèle d'incorporation que le pipeline d'indexation, et l'index possède une configuration sémantique nommée **manuals-semantic**.

    L'application envoie le corps suivant à l'API REST Search Documents. La requête doit répondre aux exigences suivantes :

    - Exécuter la récupération en texte intégral et la récupération vectorielle dans la même requête, le service se chargeant d'incorporer le texte de la requête.
    - Réordonner les résultats fusionnés avec le classeur sémantique.
    - Fournir au classeur sémantique le nombre maximal de résultats qu'il peut réordonner.

    Comment devez-vous compléter le corps de la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "search": "replace the filter cartridge on model X200",
      "vectorQueries": [
        {
          "kind": [[kind]],
          "text": "replace the filter cartridge on model X200",
          "fields": "contentVector",
          "k": [[k]]
        }
      ],
      "queryType": [[qt]],
      "semanticConfiguration": "manuals-semantic",
      "select": "title, chunk",
      "top": 5
    }
  slots:
    - id: kind
      options:
        - { id: vector, text: '"vector"' }
        - { id: text, text: '"text"' }
        - { id: image, text: '"imageUrl"' }
    - id: k
      options:
        - { id: k5, text: "5" }
        - { id: k10, text: "10" }
        - { id: k50, text: "50" }
    - id: qt
      options:
        - { id: simple, text: '"simple"' }
        - { id: full, text: '"full"' }
        - { id: semantic, text: '"semantic"' }
answer:
  values: { kind: text, k: k50, qt: semantic }
explanation:
  correct:
    en: |
      A hybrid query is one request with both `search` and `vectorQueries`; the two run in parallel and RRF merges their results. `"kind": "text"` sends the query text, and the vectorizer of the field converts it to a vector. `"queryType": "semantic"` adds semantic reranking, which processes at most the top 50 results, so Learn recommends setting `k` to 50 to maximize its inputs.
    fr: |
      Une requête hybride est une seule requête qui contient à la fois `search` et `vectorQueries` ; les deux s'exécutent en parallèle et RRF fusionne leurs résultats. `"kind": "text"` envoie le texte de la requête, et le vectoriseur du champ le convertit en vecteur. `"queryType": "semantic"` ajoute le reclassement sémantique, qui traite au plus les 50 premiers résultats : Learn recommande donc de définir `k` sur 50 pour maximiser ses entrées.
  options:
    kind:
      en: "`vector` expects a vector computed by the application, and `imageUrl` sends an image for a multimodal vectorizer."
      fr: "`vector` attend un vecteur calculé par l'application, et `imageUrl` envoie une image à un vectoriseur multimodal."
    k:
      en: With 5 or 10 nearest neighbors, the semantic ranker receives fewer candidates than it can rerank.
      fr: Avec 5 ou 10 plus proches voisins, le classeur sémantique reçoit moins de candidats qu'il ne peut en réordonner.
    qt:
      en: "`simple` and `full` select the full-text query syntax; neither enables semantic ranking."
      fr: "`simple` et `full` sélectionnent la syntaxe de requête en texte intégral ; aucune n'active le classement sémantique."
references:
  - title: Hybrid search using vectors and full-text search in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
  - title: Semantic ranking in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/semantic-search-overview
