id: ai103-1b-safety-evaluators-prod
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Lamna Healthcare runs a Foundry agent that drafts replies to patients. Content filters are configured on the deployment. Application Insights is connected to the project.

    Compliance requires that the team measures, on a sample of production responses, how often the agent's replies make inferences about a patient's emotional state or demographic group that the patient's message doesn't support, and receives an alert when the rate rises.

    What should you configure?
  fr: |
    Lamna Healthcare exécute un agent Foundry qui rédige des réponses aux patients. Des filtres de contenu sont configurés sur le déploiement. Application Insights est connecté au projet.

    La conformité exige que l'équipe mesure, sur un échantillon de réponses de production, la fréquence à laquelle les réponses de l'agent font des déductions sur l'état émotionnel ou le groupe démographique d'un patient que son message n'étaye pas, et reçoive une alerte lorsque ce taux augmente.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An Azure Monitor alert on the Blocked Volume metric of the model deployment", fr: "Une alerte Azure Monitor sur la métrique Blocked Volume du déploiement de modèle" } }
    - { id: b, text: { en: "A scheduled evaluation with the Groundedness and Relevance evaluators on a test dataset", fr: "Une évaluation planifiée avec les évaluateurs Groundedness et Relevance sur un jeu de données de test" } }
    - { id: c, text: { en: "Tracing of every agent run, reviewed by the compliance team each week", fr: "Le traçage de chaque exécution de l'agent, examiné chaque semaine par l'équipe conformité" } }
    - { id: d, text: { en: "Continuous evaluation with the Ungrounded Attributes evaluator, plus an Azure Monitor alert", fr: "L'évaluation continue avec l'évaluateur Ungrounded Attributes, plus une alerte Azure Monitor" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Continuous evaluation scores production traffic at a sampled rate. Ungrounded Attributes, a built-in risk and safety evaluator for model and agent targets, flags inferences about personal attributes, such as an emotional state or a demographic group, that the context doesn't support. Azure Monitor alerts notify the team when outputs fail quality or safety thresholds.
    fr: |
      L'évaluation continue note le trafic de production à un taux échantillonné. Ungrounded Attributes, un évaluateur de risque et de sécurité intégré pour les cibles de type modèle et agent, signale les déductions sur des attributs personnels, comme un état émotionnel ou un groupe démographique, que le contexte n'étaye pas. Les alertes Azure Monitor préviennent l'équipe lorsque des sorties échouent aux seuils de qualité ou de sécurité.
  options:
    a:
      en: |
        Blocked Volume counts calls rejected by the content filters; harmful content blocked at run time says nothing about unsupported inferences in the replies.
      fr: |
        Blocked Volume compte les appels rejetés par les filtres de contenu ; le contenu nuisible bloqué à l'exécution n'indique rien sur les déductions non étayées des réponses.
    b:
      en: |
        A test dataset isn't production traffic, and these evaluators check general grounding and relevance, not inferences about personal attributes.
      fr: |
        Un jeu de test n'est pas du trafic de production, et ces évaluateurs vérifient l'ancrage et la pertinence en général, pas les déductions sur des attributs personnels.
    c:
      en: |
        Traces show what a run did, but they don't score the replies or raise alerts on a rate.
      fr: |
        Les traces montrent ce qu'a fait une exécution, mais elles ne notent pas les réponses et ne déclenchent pas d'alerte sur un taux.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators
