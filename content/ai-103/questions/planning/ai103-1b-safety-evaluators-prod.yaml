id: ai103-1b-safety-evaluators-prod
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Lamna Healthcare runs a Foundry agent that drafts replies to patients. Content filters are configured on the deployment. Application Insights is connected to the project.

    Compliance requires that the team measures, on a sample of production responses, how often the agent leaks sensitive data, and receives an alert when the rate rises.

    What should you configure?
  fr: |
    Lamna Healthcare exécute un agent Foundry qui rédige des réponses aux patients. Des filtres de contenu sont configurés sur le déploiement. Application Insights est connecté au projet.

    La conformité exige que l'équipe mesure, sur un échantillon de réponses de production, la fréquence à laquelle l'agent divulgue des données sensibles, et reçoive une alerte lorsque ce taux augmente.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "An Azure Monitor alert on the Blocked Volume metric of the model deployment", fr: "Une alerte Azure Monitor sur la métrique Blocked Volume du déploiement de modèle" } }
    - { id: b, text: { en: "A scheduled evaluation with the Groundedness and Relevance evaluators on a test dataset", fr: "Une évaluation planifiée avec les évaluateurs Groundedness et Relevance sur un jeu de données de test" } }
    - { id: c, text: { en: "Tracing of every agent run, reviewed by the compliance team each week", fr: "Le traçage de chaque exécution de l'agent, examiné chaque semaine par l'équipe conformité" } }
    - { id: d, text: { en: "Continuous evaluation with the Sensitive Data Leakage evaluator, plus an Azure Monitor alert", fr: "L'évaluation continue avec l'évaluateur Sensitive Data Leakage, plus une alerte Azure Monitor" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Continuous evaluation scores production traffic at a sampled rate, and Sensitive Data Leakage is one of the built-in risk and safety evaluators. Azure Monitor alerts notify the team when outputs fail quality or safety thresholds.
    fr: |
      L'évaluation continue note le trafic de production à un taux échantillonné, et Sensitive Data Leakage fait partie des évaluateurs de risque et de sécurité intégrés. Les alertes Azure Monitor préviennent l'équipe lorsque des sorties échouent aux seuils de qualité ou de sécurité.
  options:
    a:
      en: |
        Blocked Volume counts calls rejected by the content filters; it doesn't measure sensitive data leakage in responses.
      fr: |
        Blocked Volume compte les appels rejetés par les filtres de contenu ; il ne mesure pas la divulgation de données sensibles dans les réponses.
    b:
      en: |
        These evaluators measure grounding and relevance, not data leakage, and a test dataset isn't production traffic.
      fr: |
        Ces évaluateurs mesurent l'ancrage et la pertinence, pas la divulgation de données, et un jeu de test n'est pas du trafic de production.
    c:
      en: |
        Traces show what a run did, but they don't score leakage or raise alerts on a rate.
      fr: |
        Les traces montrent ce qu'a fait une exécution, mais elles ne notent pas la divulgation et ne déclenchent pas d'alerte sur un taux.
references:
  - title: Observability in generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
  - title: Built-in Evaluators Reference
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators
