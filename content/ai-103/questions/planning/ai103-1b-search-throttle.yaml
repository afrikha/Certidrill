id: ai103-1b-search-throttle
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses an Azure AI Search service as the retrieval layer of a shopping assistant. During evening peaks, the Throttled search queries percentage metric rises to 12 % and some queries return HTTP 503. Indexing runs at night and completes without errors.

    You need to reduce the number of throttled queries.

    What should you do?
  fr: |
    Wingtip Toys utilise un service Azure AI Search comme couche de récupération d'un assistant d'achat. Lors des pointes du soir, la métrique Throttled search queries percentage monte à 12 % et certaines requêtes renvoient HTTP 503. L'indexation s'exécute la nuit et se termine sans erreur.

    Vous devez réduire le nombre de requêtes limitées.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add partitions to the search service.", fr: "Ajouter des partitions au service de recherche." } }
    - { id: b, text: { en: "Enable the semantic ranker on the queries.", fr: "Activer le classeur sémantique sur les requêtes." } }
    - { id: c, text: { en: "Add replicas to the search service.", fr: "Ajouter des réplicas au service de recherche." } }
    - { id: d, text: { en: "Shorten the schedule interval of the indexer.", fr: "Raccourcir l'intervalle de planification de l'indexeur." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Throttling occurs when the search service is at capacity, and a throttled call returns HTTP 503. Adding replicas is the usual fix for query-based throttling; partitions address indexing-based throttling and storage.
    fr: |
      La limitation se produit lorsque le service de recherche atteint sa capacité, et un appel limité renvoie HTTP 503. Ajouter des réplicas est la solution habituelle à la limitation des requêtes ; les partitions répondent à la limitation de l'indexation et au stockage.
  options:
    a:
      en: |
        Partitions are the typical remedy for indexing-based throttling, and indexing isn't the problem here.
      fr: |
        Les partitions sont la solution type à la limitation de l'indexation, et l'indexation n'est pas en cause ici.
    b:
      en: |
        The semantic ranker adds processing to queries; it doesn't add capacity.
      fr: |
        Le classeur sémantique ajoute du traitement aux requêtes ; il n'ajoute pas de capacité.
    d:
      en: |
        Running the indexer more often adds load and doesn't help evening queries.
      fr: |
        Exécuter l'indexeur plus souvent ajoute de la charge et n'aide pas les requêtes du soir.
references:
  - title: Analyze performance in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-performance-analysis
  - title: Monitor query requests in Azure AI Search
    url: https://learn.microsoft.com/en-us/azure/search/search-monitor-queries
