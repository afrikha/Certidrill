id: ai103-1b-indexer-history-hot
objective: "1.3.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Proseware has an Azure AI Search indexer named **policies-indexer** that feeds the knowledge index of a Foundry agent. The **Max failed items** setting of the indexer is 20. The following table shows its last four runs, as returned by the Get Indexer Status API.

    Answer each prompt by selecting the run in the table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un indexeur Azure AI Search nommé **policies-indexer** qui alimente l'index de connaissances d'un agent Foundry. Le paramètre **Max failed items** de l'indexeur vaut 20. Le tableau suivant présente ses quatre dernières exécutions, telles que renvoyées par l'API Get Indexer Status.

    Répondez à chaque consigne en sélectionnant l'exécution dans le tableau.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The run that reported a successful result but left documents out of the index", fr: "L'exécution qui a signalé un résultat réussi mais a laissé des documents hors de l'index" }
    - id: p2
      text: { en: "The run that stopped because the number of document errors exceeded the limit", fr: "L'exécution qui s'est arrêtée parce que le nombre d'erreurs de document a dépassé la limite" }
  grid:
    header: [{ en: "Run start (UTC)", fr: "Début de l'exécution (UTC)" }, status, itemsProcessed, itemsFailed]
    rows:
      - [{ text: "08:00", area: r0800 }, { text: success }, { text: "1,240" }, { text: "0" }]
      - [{ text: "10:00", area: r1000 }, { text: success }, { text: "1,236" }, { text: "17" }]
      - [{ text: "12:00", area: r1200 }, { text: transientFailure }, { text: "0" }, { text: "0" }]
      - [{ text: "14:00", area: r1400 }, { text: persistentFailure }, { text: "512" }, { text: "21" }]
answer:
  values: { p1: r1000, p2: r1400 }
explanation:
  correct:
    en: |
      A run reports `success` as long as its document errors stay within Max failed items, so the 10:00 run succeeded while 17 documents weren't indexed: you must check `itemsFailed` and the errors, not only the status. The 14:00 run had 21 failed items, more than the limit of 20, so it ended in `persistentFailure` and indexing stopped. A `transientFailure` is a temporary failure of the run itself, not of documents.
    fr: |
      Une exécution signale `success` tant que ses erreurs de document restent dans la limite Max failed items : l'exécution de 10:00 a réussi alors que 17 documents n'ont pas été indexés. Vous devez donc vérifier `itemsFailed` et les erreurs, pas seulement le statut. L'exécution de 14:00 comptait 21 éléments en échec, au-delà de la limite de 20 : elle s'est terminée en `persistentFailure` et l'indexation s'est arrêtée. Un `transientFailure` est un échec temporaire de l'exécution elle-même, pas de documents.
references:
  - title: Monitor Indexer Status and Results
    url: https://learn.microsoft.com/en-us/azure/search/search-monitor-indexers
  - title: Indexers - Create
    url: https://learn.microsoft.com/en-us/rest/api/searchservice/indexers/create
