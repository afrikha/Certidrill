id: ai103-cs3b-peak-deployment
objective: "1.2.2"
type: single
caseStudy: ai103-cs3b-alpine
difficulty: 3
status: draft
stem:
  en: |
    You plan to replace chat-main with a new deployment of the same model for ski-concierge. You need to meet the capacity requirement. Which deployment type should you use?
  fr: |
    Vous prévoyez de remplacer chat-main par un nouveau déploiement du même modèle pour ski-concierge. Vous devez satisfaire l'exigence de capacité. Quel type de déploiement devez-vous utiliser ?
body:
  options:
    - { id: a, text: "Global Provisioned" }
    - { id: b, text: "Data Zone Standard" }
    - { id: c, text: "Data Zone Provisioned" }
    - { id: d, text: "Global Batch" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Provisioned deployment types provide guaranteed throughput and lower latency variance than the best-effort Standard types, which addresses the 429 errors and the variable latency at peak times. The Data Zone variant keeps data processing within the EU data zone, which Global deployments do not guarantee.
    fr: |
      Les types de déploiement provisionnés fournissent un débit garanti et une variance de latence plus faible que les types Standard, qui sont au mieux (best effort), ce qui répond aux erreurs 429 et à la latence variable aux heures de pointe. La variante Data Zone maintient le traitement des données dans la zone de données UE, ce que les déploiements Global ne garantissent pas.
  options:
    a:
      en: |
        Global Provisioned guarantees throughput, but a global deployment can process data in any region, which breaks the EU data zone requirement.
      fr: |
        Global Provisioned garantit le débit, mais un déploiement global peut traiter les données dans n'importe quelle région, ce qui enfreint l'exigence de zone de données UE.
    b:
      en: |
        Data Zone Standard keeps data in the EU data zone, but it is best effort and offers no guaranteed throughput or consistent latency.
      fr: |
        Data Zone Standard maintient les données dans la zone de données UE, mais il est au mieux (best effort) et n'offre ni débit garanti ni latence régulière.
    d:
      en: |
        Global Batch is for large asynchronous jobs with a 24-hour target turnaround, not for an interactive concierge.
      fr: |
        Global Batch est destiné aux gros traitements asynchrones avec un délai cible de 24 heures, pas à un concierge interactif.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
