id: ai103-cs2b-lims-tools
objective: "1.4.4"
type: single
caseStudy: ai103-cs2b-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You are adding lims-mcp to protocol-assistant as an `MCPTool`. You need to meet the laboratory data requirement. How should you configure the tool?
  fr: |
    Vous ajoutez lims-mcp à protocol-assistant sous forme de `MCPTool`. Vous devez satisfaire l'exigence relative aux données de laboratoire. Comment devez-vous configurer l'outil ?
body:
  options:
    - id: a
      text:
        en: |
          Set `require_approval` to `{"never": ["get_sample", "get_result", "list_samples"]}` and don't set `allowed_tools`.
        fr: |
          Définir `require_approval` sur `{"never": ["get_sample", "get_result", "list_samples"]}` sans définir `allowed_tools`.
    - id: b
      text:
        en: |
          Set `allowed_tools` to `[]` and `require_approval` to `"never"`.
        fr: |
          Définir `allowed_tools` sur `[]` et `require_approval` sur `"never"`.
    - id: c
      text:
        en: |
          Set `allowed_tools` to `["get_sample", "get_result", "list_samples"]` and `require_approval` to `"never"`.
        fr: |
          Définir `allowed_tools` sur `["get_sample", "get_result", "list_samples"]` et `require_approval` sur `"never"`.
    - id: d
      text:
        en: |
          Set `require_approval` to `"always"` and list the three tools in the instructions of the agent.
        fr: |
          Définir `require_approval` sur `"always"` et lister les trois outils dans les instructions de l'agent.
answer: { optionId: c }
explanation:
  correct:
    en: |
      A nonempty `allowed_tools` list restricts the agent to the listed tools of the MCP server, so update_result, delete_sample and the other tools can't be called. `require_approval="never"` removes the approval step for the three allowed tools.
    fr: |
      Une liste `allowed_tools` non vide limite l'agent aux outils listés du serveur MCP : update_result, delete_sample et les autres outils ne peuvent pas être appelés. `require_approval="never"` supprime l'étape d'approbation pour les trois outils autorisés.
  options:
    a:
      en: |
        Without `allowed_tools`, every tool of the server stays available; the other tools would only require approval, so the agent could still call them once approved.
      fr: |
        Sans `allowed_tools`, tous les outils du serveur restent disponibles ; les autres outils exigeraient seulement une approbation, et l'agent pourrait donc encore les appeler une fois approuvés.
    b:
      en: |
        An empty `allowed_tools` list allows every tool of the server, not zero tools, so delete_sample could run without approval.
      fr: |
        Une liste `allowed_tools` vide autorise tous les outils du serveur, et non aucun : delete_sample pourrait s'exécuter sans approbation.
    d:
      en: |
        `"always"` adds an approval prompt to the three read tools, and instructions don't technically prevent calls to the other tools.
      fr: |
        `"always"` ajoute une demande d'approbation aux trois outils de lecture, et des instructions n'empêchent pas techniquement les appels aux autres outils.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
