id: ai103-1b-ps-no-autoupgrade
objective: "1.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys has a Microsoft Foundry resource named **tailspin-ai** in a resource group named **rg-ai**. A Standard deployment named **claims-extract** runs a model version that the compliance team validated.

    The deployment must never move to another model version automatically. A colleague tried to change the setting by using the Azure CLI and failed.

    You decide to use Azure PowerShell. How should you complete the script? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys dispose d'une ressource Microsoft Foundry nommée **tailspin-ai** dans un groupe de ressources nommé **rg-ai**. Un déploiement Standard nommé **claims-extract** exécute une version de modèle validée par l'équipe conformité.

    Le déploiement ne doit jamais passer automatiquement à une autre version du modèle. Un collègue a tenté de modifier ce paramètre avec Azure CLI, sans succès.

    Vous décidez d'utiliser Azure PowerShell. Comment devez-vous compléter le script ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: powershell
  template: |
    $d = Get-AzCognitiveServicesAccountDeployment -ResourceGroupName rg-ai `
      -AccountName tailspin-ai -Name claims-extract

    $d.Properties.VersionUpgradeOption = [[opt]]

    [[cmd]] -ResourceGroupName rg-ai `
      -AccountName tailspin-ai -Name claims-extract `
      -Properties $d.Properties -Sku $d.Sku
  slots:
    - id: opt
      options:
        - { id: none, text: "\"NoAutoUpgrade\"" }
        - { id: exp, text: "\"OnceCurrentVersionExpired\"" }
        - { id: newdef, text: "\"OnceNewDefaultVersionAvailable\"" }
        - { id: nul, text: "$null" }
    - id: cmd
      options:
        - { id: newdep, text: New-AzCognitiveServicesAccountDeployment }
        - { id: setacc, text: Set-AzCognitiveServicesAccount }
        - { id: newacc, text: New-AzCognitiveServicesAccount }
        - { id: getdep, text: Get-AzCognitiveServicesAccountDeployment }
answer:
  values: { opt: none, cmd: newdep }
explanation:
  correct:
    en: |
      `NoAutoUpgrade` is the only policy that never changes the version; the deployment stops working when that version is retired, so you must plan the upgrade yourself. Azure PowerShell updates the setting by reading the deployment, changing `VersionUpgradeOption` and writing the deployment back with `New-AzCognitiveServicesAccountDeployment`. The Azure CLI can read the value but can't currently update it.
    fr: |
      `NoAutoUpgrade` est la seule stratégie qui ne change jamais la version ; le déploiement cesse de fonctionner à la mise hors service de cette version : vous devez donc planifier vous-même la mise à niveau. Azure PowerShell met à jour le paramètre en lisant le déploiement, en modifiant `VersionUpgradeOption`, puis en réécrivant le déploiement avec `New-AzCognitiveServicesAccountDeployment`. Azure CLI peut lire la valeur, mais ne peut pas la modifier actuellement.
  options:
    exp: { en: "With OnceCurrentVersionExpired, the deployment moves to the default version when its version is retired.", fr: "Avec OnceCurrentVersionExpired, le déploiement passe à la version par défaut à la mise hors service de sa version." }
    newdef: { en: "OnceNewDefaultVersionAvailable upgrades within two weeks after a new default version is designated.", fr: "OnceNewDefaultVersionAvailable met à niveau dans les deux semaines qui suivent la désignation d'une nouvelle version par défaut." }
    nul: { en: "A null value is equivalent to OnceCurrentVersionExpired.", fr: "Une valeur null équivaut à OnceCurrentVersionExpired." }
    setacc: { en: "Set-AzCognitiveServicesAccount changes the account (for example its local authentication setting), not a deployment.", fr: "Set-AzCognitiveServicesAccount modifie le compte (par exemple son authentification locale), pas un déploiement." }
    newacc: { en: "New-AzCognitiveServicesAccount creates a resource, not a deployment.", fr: "New-AzCognitiveServicesAccount crée une ressource, pas un déploiement." }
    getdep: { en: "Get-AzCognitiveServicesAccountDeployment only reads the deployment.", fr: "Get-AzCognitiveServicesAccountDeployment ne fait que lire le déploiement." }
references:
  - title: Azure OpenAI in Microsoft Foundry Models working with models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/working-with-models
