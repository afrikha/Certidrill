id: ai103-1a-cmk-requirements
objective: "1.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys must encrypt the data of its Foundry resource **tail-ai** with customer-managed keys stored in Azure Key Vault. The key vault uses the Azure RBAC permission model.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys doit chiffrer les données de sa ressource Foundry **tail-ai** avec des clés gérées par le client stockées dans Azure Key Vault. Le coffre de clés utilise le modèle d'autorisation Azure RBAC.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The key vault must be in the same Azure region as tail-ai.
        fr: Le coffre de clés doit se trouver dans la même région Azure que tail-ai.
    - id: s2
      text:
        en: Purge protection can stay disabled on the key vault if soft delete is enabled.
        fr: La protection contre le vidage peut rester désactivée sur le coffre de clés si la suppression réversible est activée.
    - id: s3
      text:
        en: Until you configure customer-managed keys, the data of tail-ai isn't encrypted at rest.
        fr: Tant que vous n'avez pas configuré de clés gérées par le client, les données de tail-ai ne sont pas chiffrées au repos.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Customer-managed keys require a key vault in the same region as the Foundry resource, with both soft delete and purge protection enabled, and a managed identity with key permissions such as Key Vault Crypto User. Without them, data is still encrypted at rest and in transit with Microsoft-managed keys (FIPS 140-2 compliant 256-bit AES).
    fr: Les clés gérées par le client nécessitent un coffre de clés dans la même région que la ressource Foundry, avec la suppression réversible et la protection contre le vidage activées, ainsi qu'une identité managée disposant d'autorisations sur les clés, comme Key Vault Crypto User. Sans elles, les données restent chiffrées au repos et en transit avec des clés gérées par Microsoft (AES 256 bits conforme FIPS 140-2).
references:
  - title: Microsoft Foundry architecture
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture
