id: ai103-1a-image-input-models
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys is building an app in which employees take a photo of a whiteboard after a meeting. The app sends the photo and a short instruction to a model, which returns a written summary of the diagram on the whiteboard.

    You need to choose a model for the app.

    Which two models can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys crée une application dans laquelle les employés photographient un tableau blanc après une réunion. L'application envoie la photo et une courte instruction à un modèle, qui renvoie un résumé écrit du schéma dessiné sur le tableau.

    Vous devez choisir un modèle pour l'application.

    Quels sont les deux modèles que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: gpt-4o }
    - { id: b, text: o3-mini }
    - { id: c, text: gpt-oss-120b }
    - { id: d, text: gpt-4.1 }
    - { id: e, text: text-embedding-3-large }
    - { id: f, text: whisper }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "`gpt-4o` and `gpt-4.1` are multimodal models that accept text and image input and generate text, so they can read a photo and summarize what it shows."
    fr: "`gpt-4o` et `gpt-4.1` sont des modèles multimodaux qui acceptent du texte et des images en entrée et génèrent du texte : ils peuvent lire une photo et résumer ce qu'elle montre."
  options:
    b:
      en: "`o3-mini` is a reasoning model that accepts text input only."
      fr: "`o3-mini` est un modèle de raisonnement qui n'accepte que du texte en entrée."
    c:
      en: "`gpt-oss-120b` is an open-weight reasoning model that accepts text only."
      fr: "`gpt-oss-120b` est un modèle de raisonnement à poids ouverts qui n'accepte que du texte."
    e:
      en: An embedding model returns vectors; it generates no summary.
      fr: Un modèle d'incorporation renvoie des vecteurs ; il ne génère aucun résumé.
    f:
      en: "`whisper` transcribes audio; it doesn't process images."
      fr: "`whisper` transcrit de l'audio ; il ne traite pas les images."
references:
  - title: Foundry Models sold by Azure
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
