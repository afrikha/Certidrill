id: ai103-sr1-keyless-app-1
objective: "1.3.4"
type: series_yesno
series: ai103-sr1-keyless-app
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You use a system-assigned managed identity with the Foundry User role.
  fr: Vous utilisez une identité managée affectée par le système avec le rôle Foundry User.
body:
  solution:
    en: |
      You enable a **system-assigned managed identity** for App1 and assign it the **Foundry User** role (previously named Azure AI User) at the scope of tailspin-ai. In App1, you create the project client with `DefaultAzureCredential()`.
    fr: |
      Vous activez une **identité managée affectée par le système** pour App1 et vous lui attribuez le rôle **Foundry User** (anciennement nommé Azure AI User) à l'étendue de tailspin-ai. Dans App1, vous créez le client du projet avec `DefaultAzureCredential()`.
answer: { value: true }
explanation:
  correct:
    en: When App1 runs in App Service, `DefaultAzureCredential` obtains a Microsoft Entra token from the managed identity, so no key or secret is stored and authentication keeps working after `disableLocalAuth` is set to `true`. Foundry User grants the data actions needed to call models and build agents, but it cannot create projects or manage models.
    fr: "Lorsque App1 s'exécute dans App Service, `DefaultAzureCredential` obtient un jeton Microsoft Entra à partir de l'identité managée : aucune clé ni aucun secret n'est stocké, et l'authentification continue de fonctionner une fois `disableLocalAuth` défini sur `true`. Foundry User accorde les actions de données nécessaires pour appeler des modèles et créer des agents, mais ne permet ni de créer des projets ni de gérer des modèles."
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/rbac-azure-ai-foundry
  - title: Configure keyless authentication with Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/how-to/configure-entra-id
