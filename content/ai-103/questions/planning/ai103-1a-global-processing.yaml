id: ai103-1a-global-processing
objective: "1.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a Foundry resource in the Sweden Central region. The legal team is reviewing the deployment types that the developers are allowed to create, and needs to know which ones can process prompts outside the EU Data Boundary.

    Which two deployment types can process prompts outside the EU Data Boundary?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une ressource Foundry dans la région Sweden Central. L'équipe juridique examine les types de déploiement que les développeurs sont autorisés à créer et doit savoir lesquels peuvent traiter des invites en dehors de l'EU Data Boundary.

    Quels sont les deux types de déploiement qui peuvent traiter des invites en dehors de l'EU Data Boundary ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: GlobalStandard }
    - { id: b, text: DataZoneStandard }
    - { id: c, text: DataZoneProvisionedManaged }
    - { id: d, text: GlobalBatch }
    - { id: e, text: DataZoneBatch }
    - { id: f, text: Standard }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Global deployment types, including Global Standard and Global Batch, may process prompts in any Azure region, although data stored at rest remains in the resource's geography. Data zone types process data within the data zone (for the EU, within the EU Data Boundary), and Standard processes it within the Azure geography of the resource.
    fr: Les types de déploiement globaux, dont Global Standard et Global Batch, peuvent traiter les invites dans n'importe quelle région Azure, même si les données stockées au repos restent dans la zone géographique de la ressource. Les types Data Zone traitent les données dans la zone de données (pour l'UE, dans l'EU Data Boundary), et Standard les traite dans la zone géographique Azure de la ressource.
  options:
    b:
      en: Data Zone Standard processes data within the data zone.
      fr: Data Zone Standard traite les données dans la zone de données.
    c:
      en: Data Zone Provisioned processes data within the data zone.
      fr: Data Zone Provisioned traite les données dans la zone de données.
    e:
      en: Data Zone Batch processes data within the data zone only.
      fr: Data Zone Batch traite les données uniquement dans la zone de données.
    f:
      en: Standard processes prompts and responses within the Azure geography of the resource.
      fr: Standard traite les invites et les réponses dans la zone géographique Azure de la ressource.
references:
  - title: Deployment types for Microsoft Foundry Models
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/deployment-types
