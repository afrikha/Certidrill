id: ai103-1b-skill-failures-metric
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso enriches maintenance reports with an Azure AI Search skillset that contains an OCR skill, a text split skill, an embedding skill and a custom Web API skill. Some reports reach the index without vectors or text.

    You need an Azure Monitor chart that shows, over the last week, which skill of the skillset fails most often.

    Which metric should you chart?
  fr: |
    Contoso enrichit des rapports de maintenance avec un ensemble de compétences Azure AI Search qui contient une compétence OCR, une compétence de fractionnement de texte, une compétence d'incorporation et une compétence API web personnalisée. Certains rapports arrivent dans l'index sans vecteurs ni texte.

    Vous avez besoin d'un graphique Azure Monitor qui montre, sur la dernière semaine, quelle compétence de l'ensemble échoue le plus souvent.

    Quelle métrique devez-vous représenter ?
body:
  options:
    - { id: a, text: { en: "Document processed count, filtered on Failed and split by IndexerName", fr: "Document processed count, filtrée sur Failed et fractionnée par IndexerName" } }
    - { id: b, text: { en: "Indexer Processed Files (bytes), split by DataSourceName", fr: "Indexer Processed Files (bytes), fractionnée par DataSourceName" } }
    - { id: c, text: { en: "Search Latency, with an alert on its average value", fr: "Search Latency, avec une alerte sur sa valeur moyenne" } }
    - { id: d, text: { en: "Skill execution invocation count, filtered on Failed and split by SkillName", fr: "Skill execution invocation count, filtrée sur Failed et fractionnée par SkillName" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Skill execution invocation count counts skill executions and has the Failed, SkillName, SkillType and SkillsetName dimensions, so filtering on failed executions and splitting by skill shows which skill fails. You can then open a debug session on a failed document to see the inputs of that skill.
    fr: |
      Skill execution invocation count compte les exécutions de compétences et possède les dimensions Failed, SkillName, SkillType et SkillsetName : filtrer sur les exécutions en échec et fractionner par compétence montre quelle compétence échoue. Vous pouvez ensuite ouvrir une session de débogage sur un document en échec pour voir les entrées de cette compétence.
  options:
    a:
      en: |
        Document processed count shows failed documents per indexer; it doesn't break failures down by skill.
      fr: |
        Document processed count montre les documents en échec par indexeur ; il ne ventile pas les échecs par compétence.
    b:
      en: |
        This metric measures the bytes of source data read, not skill failures.
      fr: |
        Cette métrique mesure les octets de données source lus, pas les échecs de compétences.
    c:
      en: |
        Search Latency measures query response time and has no dimension.
      fr: |
        Search Latency mesure le temps de réponse des requêtes et n'a aucune dimension.
references:
  - title: Azure AI Search monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/search/monitor-azure-cognitive-search-data-reference
