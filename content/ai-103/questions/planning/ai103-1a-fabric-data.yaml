id: ai103-1a-fabric-data
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum keeps its sales figures in Microsoft Fabric, where the analytics team has already published a Fabric data agent over the sales lakehouse. You are building a prompt agent in Foundry Agent Service that must answer sales managers' questions, such as "What were the returns in March by region?", from this Fabric data.

    Which tool should you add to the agent?
  fr: |
    Adatum conserve ses chiffres de vente dans Microsoft Fabric, où l'équipe d'analyse a déjà publié un agent de données Fabric sur le lakehouse des ventes. Vous créez dans Foundry Agent Service un agent d'invite qui doit répondre aux questions des responsables commerciaux, comme « Quels ont été les retours de mars par région ? », à partir de ces données Fabric.

    Quel outil devez-vous ajouter à l'agent ?
body:
  options:
    - { id: a, text: { en: "The SharePoint tool", fr: "L'outil SharePoint" } }
    - { id: b, text: { en: "The Fabric data agent tool", fr: "L'outil Fabric data agent" } }
    - { id: c, text: { en: "The file search tool with a daily CSV export of the lakehouse", fr: "L'outil de recherche de fichiers avec un export CSV quotidien du lakehouse" } }
    - { id: d, text: { en: "The web search tool", fr: "L'outil de recherche web" } }
answer: { optionId: b }
explanation:
  correct:
    en: The Fabric data agent tool connects a Foundry agent to a Fabric data agent, so the agent answers from Microsoft Fabric data instead of copies. It is a knowledge tool that brings enterprise data into the agent's answers.
    fr: |
      L'outil Fabric data agent connecte un agent Foundry à un agent de données Fabric : l'agent répond à partir des données Microsoft Fabric plutôt que de copies. C'est un outil de connaissances qui apporte des données d'entreprise dans les réponses de l'agent.
  options:
    a:
      en: The SharePoint tool grounds the agent on Microsoft 365 documents, not on Fabric data.
      fr: L'outil SharePoint ancre l'agent sur des documents Microsoft 365, pas sur des données Fabric.
    c:
      en: A daily export is a stale copy to maintain, and file search retrieves text chunks rather than answering aggregate questions over the data.
      fr: Un export quotidien est une copie périmée à maintenir, et la recherche de fichiers récupère des segments de texte au lieu de répondre à des questions d'agrégation sur les données.
    d:
      en: Web search returns public web information; the sales data is internal.
      fr: La recherche web renvoie des informations publiques du web ; les données de vente sont internes.
references:
  - title: What is Toolbox in Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/tool-catalog
