id: ai103-1a-resource-layout
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    At Northwind Traders, three product teams will build agents in production on Microsoft Foundry. The teams must share the same model deployments and connections, without a new IT setup for each team. The agents, files and evaluations of each team must be isolated from the other teams. The solution must minimize administrative effort.

    What should you create?
  fr: |
    Chez Northwind Traders, trois équipes produit vont créer des agents en production sur Microsoft Foundry. Les équipes doivent partager les mêmes déploiements de modèles et les mêmes connexions, sans nouvelle configuration informatique pour chaque équipe. Les agents, les fichiers et les évaluations de chaque équipe doivent être isolés de ceux des autres équipes. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous créer ?
body:
  options:
    - { id: a, text: { en: "One Foundry resource that contains one project per team", fr: "Une ressource Foundry qui contient un projet par équipe" } }
    - { id: b, text: { en: "One Foundry resource per team, each with one project", fr: "Une ressource Foundry par équipe, chacune avec un projet" } }
    - { id: c, text: { en: "One Foundry resource with a single project shared by the three teams", fr: "Une ressource Foundry avec un projet unique partagé par les trois équipes" } }
    - { id: d, text: { en: "One hub per team, with an Azure OpenAI resource and an Azure AI services resource", fr: "Un hub par équipe, avec une ressource Azure OpenAI et une ressource Azure AI services" } }
answer: { optionId: a }
explanation:
  correct:
    en: The Foundry resource holds governance settings such as networking, security and model deployments. Projects are development boundaries inside it; teams reuse the resource's deployments and connections, while project assets such as files, agents and evaluations are scoped to each project.
    fr: La ressource Foundry contient les paramètres de gouvernance comme la mise en réseau, la sécurité et les déploiements de modèles. Les projets sont des limites de développement en son sein ; les équipes réutilisent les déploiements et les connexions de la ressource, tandis que les ressources des projets, comme les fichiers, les agents et les évaluations, sont limitées à chaque projet.
  options:
    b:
      en: Separate resources would require separate deployments and connections for each team, which adds administrative effort.
      fr: Des ressources distinctes nécessiteraient des déploiements et des connexions distincts pour chaque équipe, ce qui ajoute de l'effort d'administration.
    c:
      en: A single shared project gives no isolation between the teams' agents, files and evaluations.
      fr: Un projet unique partagé n'offre aucune isolation entre les agents, les fichiers et les évaluations des équipes.
    d:
      en: The hub with separate Azure OpenAI and Azure AI services resources is the previous model; it multiplies resources to manage.
      fr: Le hub avec des ressources Azure OpenAI et Azure AI services distinctes correspond à l'ancien modèle ; il multiplie les ressources à gérer.
references:
  - title: Microsoft Foundry architecture
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/architecture
  - title: What is Microsoft Foundry?
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/what-is-azure-ai-foundry
