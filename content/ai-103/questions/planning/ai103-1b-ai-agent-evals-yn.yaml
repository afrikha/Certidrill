id: ai103-1b-ai-agent-evals-yn
objective: "1.2.4"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Trey Research adds the following step to a GitHub Actions workflow:

    ```yaml
    - uses: microsoft/ai-agent-evals@v3-beta
      with:
        azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        deployment-name: eval-judge
        agent-ids: "lab-agent:8,lab-agent:9"
        data-path: ${{ github.workspace }}/evals/lab.json
    ```

    Both versions of lab-agent use a model deployment named **chat-lab**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Trey Research ajoute l'étape suivante à un flux de travail GitHub Actions :

    ```yaml
    - uses: microsoft/ai-agent-evals@v3-beta
      with:
        azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
        deployment-name: eval-judge
        agent-ids: "lab-agent:8,lab-agent:9"
        data-path: ${{ github.workspace }}/evals/lab.json
    ```

    Les deux versions de lab-agent utilisent un déploiement de modèle nommé **chat-lab**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          The run summary shows the score of each metric with a confidence interval.
        fr: |
          Le résumé de l'exécution affiche le score de chaque métrique avec un intervalle de confiance.
    - id: s2
      text:
        en: |
          Version 9 of lab-agent is used as the baseline of the comparison.
        fr: |
          La version 9 de lab-agent sert de référence pour la comparaison.
    - id: s3
      text:
        en: |
          The step fails because `deployment-name` must be set to chat-lab, the deployment that the agents use.
        fr: |
          L'étape échoue, car `deployment-name` doit être défini sur chat-lab, le déploiement utilisé par les agents.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The report shows each metric with confidence intervals and, for several agents, a pairwise statistical comparison. Without `baseline-agent-id`, the first agent listed (version 8) is the baseline. `deployment-name` is the model deployment used to run the evaluation, which can be different from the deployment that the agents call.
    fr: |
      Le rapport affiche chaque métrique avec des intervalles de confiance et, pour plusieurs agents, une comparaison statistique deux à deux. Sans `baseline-agent-id`, le premier agent listé (version 8) sert de référence. `deployment-name` est le déploiement de modèle utilisé pour exécuter l'évaluation, qui peut différer du déploiement appelé par les agents.
references:
  - title: How to run an evaluation in GitHub Action
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action
