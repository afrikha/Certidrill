id: ai103-1b-devops-eval-task
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum uses Azure Pipelines to release a Foundry agent. Before each release, the pipeline must run the agent on a test dataset, score the responses with built-in evaluators and compare the new agent version with the current one. The pipeline already has an Azure Resource Manager service connection that uses Microsoft Entra ID.

    Which task should you add to the pipeline?
  fr: |
    Adatum utilise Azure Pipelines pour publier un agent Foundry. Avant chaque publication, le pipeline doit exécuter l'agent sur un jeu de données de test, noter les réponses avec des évaluateurs intégrés et comparer la nouvelle version de l'agent à la version actuelle. Le pipeline dispose déjà d'une connexion de service Azure Resource Manager qui utilise Microsoft Entra ID.

    Quelle tâche devez-vous ajouter au pipeline ?
body:
  options:
    - { id: a, text: "AzureResourceManagerTemplateDeployment@3" }
    - { id: b, text: "PublishTestResults@2" }
    - { id: c, text: "AIAgentEvaluation@2" }
    - { id: d, text: "AzureFunctionApp@2" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The AI Agent Evaluation extension for Azure DevOps adds the `AIAgentEvaluation@2` task. It takes the project endpoint, the deployment used for evaluation, the agent IDs as `name:version` and a data file, and compares the agents with statistical tests. Microsoft recommends authenticating with an Azure Resource Manager service connection through an `AzureCLI@2` step before the task.
    fr: |
      L'extension AI Agent Evaluation pour Azure DevOps ajoute la tâche `AIAgentEvaluation@2`. Elle reçoit le point de terminaison du projet, le déploiement utilisé pour l'évaluation, les ID d'agents au format `nom:version` et un fichier de données, puis compare les agents par des tests statistiques. Microsoft recommande de s'authentifier avec une connexion de service Azure Resource Manager dans une étape `AzureCLI@2` placée avant la tâche.
  options:
    a:
      en: |
        This task deploys ARM templates; it doesn't evaluate agents.
      fr: |
        Cette tâche déploie des modèles ARM ; elle n'évalue pas d'agents.
    b:
      en: |
        This task publishes test result files produced by another tool; it doesn't run evaluators.
      fr: |
        Cette tâche publie des fichiers de résultats de tests produits par un autre outil ; elle n'exécute pas d'évaluateurs.
    d:
      en: |
        This task deploys code to Azure Functions.
      fr: |
        Cette tâche déploie du code dans Azure Functions.
references:
  - title: How to run an evaluation in Azure DevOps
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-azure-devops
