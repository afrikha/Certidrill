id: ai103-1b-contributor-no-data
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At Adatum, a developer named Dev1 has the Contributor role on the resource group that contains a Foundry resource and its project named **claims**. Dev1 can deploy models in the portal, but a Python script that creates an agent in the claims project with `DefaultAzureCredential` fails with an authorization error.

    You need Dev1 to be able to build and test agents in the claims project. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Chez Adatum, un développeur nommé Dev1 dispose du rôle Contributor sur le groupe de ressources qui contient une ressource Foundry et son projet nommé **claims**. Dev1 peut déployer des modèles dans le portail, mais un script Python qui crée un agent dans le projet claims avec `DefaultAzureCredential` échoue avec une erreur d'autorisation.

    Dev1 doit pouvoir créer et tester des agents dans le projet claims. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Assign Dev1 the Owner role on the resource group.", fr: "Attribuer à Dev1 le rôle Owner sur le groupe de ressources." } }
    - { id: b, text: { en: "Assign Dev1 the Foundry Account Owner role on the Foundry resource.", fr: "Attribuer à Dev1 le rôle Foundry Account Owner sur la ressource Foundry." } }
    - { id: c, text: { en: "Assign Dev1 the Foundry User role on the claims project.", fr: "Attribuer à Dev1 le rôle Foundry User sur le projet claims." } }
    - { id: d, text: { en: "Assign Dev1 the Cognitive Services Contributor role on the Foundry resource.", fr: "Attribuer à Dev1 le rôle Cognitive Services Contributor sur la ressource Foundry." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Building agents is a data action. Contributor, like Owner, has no data actions in a Foundry project, which is why the script fails. Foundry User grants the data actions of a project and is the least-privileged role for developers who build and test agents.
    fr: |
      Créer des agents est une action de données. Contributor, comme Owner, n'a aucune action de données dans un projet Foundry : c'est pourquoi le script échoue. Foundry User accorde les actions de données d'un projet et constitue le rôle le moins privilégié pour les développeurs qui créent et testent des agents.
  options:
    a:
      en: |
        Owner can assign roles and manage resources, but it has no data actions either.
      fr: |
        Owner peut attribuer des rôles et gérer les ressources, mais il n'a pas non plus d'actions de données.
    b:
      en: |
        Foundry Account Owner manages resources and models but can't build in projects.
      fr: |
        Foundry Account Owner gère les ressources et les modèles, mais ne peut pas créer de contenu dans les projets.
    d:
      en: |
        Microsoft advises against Cognitive Services roles (other than Usages Reader) for Foundry projects.
      fr: |
        Microsoft déconseille les rôles Cognitive Services (à part Usages Reader) pour les projets Foundry.
references:
  - title: Role-based access control for Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/rbac-foundry
