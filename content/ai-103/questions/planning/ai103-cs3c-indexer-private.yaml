id: ai103-cs3c-indexer-private
objective: "1.3.4"
type: multi
caseStudy: ai103-cs3c-relecloud
difficulty: 3
status: draft
stem:
  en: |
    The indexer of relecloud-search must read the manuals from stturbinemedia. You need to meet the network requirement.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'indexeur de relecloud-search doit lire les manuels dans stturbinemedia. Vous devez satisfaire l'exigence réseau.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text:
        en: "On relecloud-search, create a shared private link to stturbinemedia with the `blob` group ID."
        fr: "Sur relecloud-search, créer une liaison privée partagée vers stturbinemedia avec l'ID de groupe `blob`."
    - id: b
      text:
        en: "On stturbinemedia, add the outbound IP addresses of relecloud-search to the firewall rules."
        fr: "Sur stturbinemedia, ajouter les adresses IP sortantes de relecloud-search aux règles de pare-feu."
    - id: c
      text:
        en: "On stturbinemedia, approve the pending private endpoint connection from relecloud-search."
        fr: "Sur stturbinemedia, approuver la connexion de point de terminaison privé en attente provenant de relecloud-search."
    - id: d
      text:
        en: "On relecloud-search, create a private endpoint for inbound queries in the virtual network of the technicians."
        fr: "Sur relecloud-search, créer un point de terminaison privé pour les requêtes entrantes dans le réseau virtuel des techniciens."
    - id: e
      text:
        en: "In the indexer definition, set `executionEnvironment` to `private`."
        fr: "Dans la définition de l'indexeur, définir `executionEnvironment` sur `private`."
    - id: f
      text:
        en: "In the data source definition, replace the connection string with a SAS token for the manuals container."
        fr: "Dans la définition de la source de données, remplacer la chaîne de connexion par un jeton SAS pour le conteneur manuals."
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: |
      A shared private link lets the search service make outbound connections to stturbinemedia through a private endpoint instead of the public endpoint; for Blob Storage the group ID is `blob`. The resulting private endpoint connection stays pending until the storage account owner approves it. The indexer must then run in the private execution environment to use the link.
    fr: |
      Une liaison privée partagée permet au service de recherche d'établir des connexions sortantes vers stturbinemedia par un point de terminaison privé au lieu du point de terminaison public ; pour le Stockage Blob, l'ID de groupe est `blob`. La connexion de point de terminaison privé qui en résulte reste en attente jusqu'à ce que le propriétaire du compte de stockage l'approuve. L'indexeur doit ensuite s'exécuter dans l'environnement d'exécution privé pour utiliser la liaison.
  options:
    b:
      en: |
        IP firewall rules still send the traffic to the public endpoint of the storage account, whose public network access is disabled.
      fr: |
        Les règles de pare-feu IP envoient toujours le trafic vers le point de terminaison public du compte de stockage, dont l'accès réseau public est désactivé.
    d:
      en: |
        A private endpoint on the search service secures inbound traffic to relecloud-search, not the outbound connections of its indexer.
      fr: |
        Un point de terminaison privé sur le service de recherche sécurise le trafic entrant vers relecloud-search, pas les connexions sortantes de son indexeur.
    f:
      en: |
        A SAS token is a key-based credential and does not change the network path of the indexer.
      fr: |
        Un jeton SAS est une information d'identification basée sur une clé et ne change pas le chemin réseau de l'indexeur.
references:
  - title: Make outbound connections through a shared private link
    url: https://learn.microsoft.com/en-us/azure/search/search-indexer-howto-access-private
