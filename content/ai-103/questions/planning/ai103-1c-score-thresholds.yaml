id: ai103-1c-score-thresholds
objective: "1.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders runs an evaluation of its RAG application in Microsoft Foundry with the Violence, Groundedness, and Response Completeness evaluators. All the evaluators use their default thresholds.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders exécute une évaluation de son application RAG dans Microsoft Foundry avec les évaluateurs Violence, Groundedness et Response Completeness. Tous les évaluateurs utilisent leurs seuils par défaut.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A response that gets a Violence score of 3 passes the Violence evaluator.
        fr: Une réponse qui obtient un score Violence de 3 réussit l'évaluateur Violence.
    - id: s2
      text:
        en: A response that gets a Groundedness score of 2 passes the Groundedness evaluator.
        fr: Une réponse qui obtient un score Groundedness de 2 réussit l'évaluateur Groundedness.
    - id: s3
      text:
        en: Each row of the dataset must contain a ground truth answer for the Response Completeness evaluator.
        fr: Chaque ligne du jeu de données doit contenir une réponse de référence (ground truth) pour l'évaluateur Response Completeness.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The content safety evaluators return a severity from 0 to 7 and pass when the score is at or below the default threshold of 3, so a Violence score of 3 passes. The 1–5 quality evaluators such as Groundedness pass when the score is at or above the default threshold of 3, so a score of 2 fails. Response Completeness compares the response with a `ground_truth` input, which each row must provide.
    fr: |
      Les évaluateurs de sécurité du contenu renvoient une gravité de 0 à 7 et réussissent quand le score est inférieur ou égal au seuil par défaut de 3 : un score Violence de 3 réussit. Les évaluateurs de qualité notés de 1 à 5, comme Groundedness, réussissent quand le score est supérieur ou égal au seuil par défaut de 3 : un score de 2 échoue. Response Completeness compare la réponse à une entrée `ground_truth`, que chaque ligne doit fournir.
references:
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
