id: ai103-1c-evaluator-per-issue
objective: "1.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. reviews user complaints about a support agent built in Foundry Agent Service. The agent retrieves passages from a knowledge index and calls tools that return customer records. Experts have written reference answers for a test dataset.

    Which evaluator should you run to measure each issue? To answer, drag the appropriate evaluators to the correct issues. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. examine les plaintes des utilisateurs concernant un agent de support créé dans Foundry Agent Service. L'agent récupère des passages dans un index de connaissances et appelle des outils qui renvoient des fiches client. Des experts ont rédigé des réponses de référence pour un jeu de données de test.

    Quel évaluateur devez-vous exécuter pour mesurer chaque problème ? Pour répondre, faites glisser les évaluateurs appropriés vers les problèmes correspondants. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grd, text: Groundedness }
    - { id: ret, text: Retrieval }
    - { id: rel, text: Relevance }
    - { id: tsel, text: Tool Selection }
    - { id: cmp, text: Response Completeness }
    - { id: sdl, text: Sensitive Data Leakage }
  targets:
    - id: t1
      text: { en: "Answers contain statements that the retrieved passages don't support.", fr: "Les réponses contiennent des affirmations que les passages récupérés n'étayent pas." }
    - id: t2
      text: { en: "The retrieved passages don't relate to the user's question.", fr: "Les passages récupérés n'ont pas de rapport avec la question de l'utilisateur." }
    - id: t3
      text: { en: "Answers quote accurate passages that don't address what the user asked.", fr: "Les réponses citent des passages exacts qui ne traitent pas ce que l'utilisateur a demandé." }
    - id: t4
      text: { en: "The agent calls the customer-records tool for questions that need no customer record.", fr: "L'agent appelle l'outil de fiches client pour des questions qui ne nécessitent aucune fiche client." }
answer:
  mapping: { t1: grd, t2: ret, t3: rel, t4: tsel }
explanation:
  correct:
    en: |
      Groundedness checks the response against the context. Retrieval checks whether the retrieved context is relevant to the query. Relevance checks whether the response addresses the query. Tool Selection checks whether the agent chose the right tools without unnecessary ones.
    fr: |
      Groundedness vérifie la réponse par rapport au contexte. Retrieval vérifie si le contexte récupéré est pertinent pour la requête. Relevance vérifie si la réponse traite la requête. Tool Selection vérifie si l'agent a choisi les bons outils, sans outils inutiles.
  options:
    cmp:
      en: |
        Response Completeness (preview) compares the response with the reference answer; it measures missing facts, not whether the answer addresses the question.
      fr: |
        Response Completeness (préversion) compare la réponse à la réponse de référence ; il mesure les faits manquants, pas si la réponse traite la question.
    sdl:
      en: |
        Sensitive Data Leakage (preview) detects sensitive information exposed by an agent, not unnecessary tool calls.
      fr: |
        Sensitive Data Leakage (préversion) détecte les informations sensibles exposées par un agent, pas les appels d'outils inutiles.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Agent evaluators for generative AI
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/agent-evaluators
