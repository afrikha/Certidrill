id: ai103-1c-evaluator-per-issue
objective: "1.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam, Inc. reviews user complaints about a support agent built in Foundry Agent Service. The agent retrieves passages from a knowledge index and calls tools that return customer records. Experts have written reference answers for a test dataset.

    Which evaluator should you run to measure each issue? To answer, drag the appropriate evaluators to the correct issues. Each evaluator may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. examine les plaintes des utilisateurs concernant un agent de support créé dans Foundry Agent Service. L'agent récupère des passages dans un index de connaissances et appelle des outils qui renvoient des fiches client. Des experts ont rédigé des réponses de référence pour un jeu de données de test.

    Quel évaluateur devez-vous exécuter pour mesurer chaque problème ? Pour répondre, faites glisser les évaluateurs appropriés vers les problèmes correspondants. Chaque évaluateur peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: grd, text: Groundedness }
    - { id: ret, text: Retrieval }
    - { id: cmp, text: Response Completeness }
    - { id: sdl, text: Sensitive Data Leakage }
    - { id: rel, text: Relevance }
    - { id: pa, text: Prohibited Actions }
  targets:
    - id: t1
      text: { en: "Answers contain statements that the retrieved passages don't support.", fr: "Les réponses contiennent des affirmations que les passages récupérés n'étayent pas." }
    - id: t2
      text: { en: "The retrieved passages don't relate to the user's question.", fr: "Les passages récupérés n'ont pas de rapport avec la question de l'utilisateur." }
    - id: t3
      text: { en: "Answers leave out facts that appear in the reference answers.", fr: "Les réponses omettent des faits qui figurent dans les réponses de référence." }
    - id: t4
      text: { en: "The agent copies card numbers from tool results into its responses.", fr: "L'agent recopie dans ses réponses des numéros de carte issus des résultats d'outils." }
answer:
  mapping: { t1: grd, t2: ret, t3: cmp, t4: sdl }
explanation:
  correct:
    en: |
      Groundedness checks the response against the context. Retrieval checks whether the retrieved context is relevant to the query. Response Completeness compares the response with the ground truth answer. Sensitive Data Leakage (preview, agents only) detects sensitive information exposed in agent responses and tool calls.
    fr: |
      Groundedness vérifie la réponse par rapport au contexte. Retrieval vérifie si le contexte récupéré est pertinent pour la requête. Response Completeness compare la réponse à la réponse de référence. Sensitive Data Leakage (préversion, agents uniquement) détecte les informations sensibles exposées dans les réponses et les appels d'outils de l'agent.
  options:
    rel:
      en: |
        Relevance measures whether the response addresses the query; it doesn't look at the retrieved passages.
      fr: |
        Relevance mesure si la réponse traite la requête ; il n'examine pas les passages récupérés.
    pa:
      en: |
        Prohibited Actions looks for disallowed actions taken by the agent, not for sensitive data disclosed in a response.
      fr: |
        Prohibited Actions recherche les actions interdites effectuées par l'agent, pas les données sensibles divulguées dans une réponse.
references:
  - title: Retrieval-Augmented Generation (RAG) Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/rag-evaluators
  - title: Risk and Safety Evaluators for Generative AI
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/evaluation-evaluators/risk-safety-evaluators
