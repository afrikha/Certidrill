id: ai103-1c-violence-blocking-level
objective: "1.4.1"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys uses a model deployment named **story-gen** in a Microsoft Foundry project to write adventure stories for a game. The deployment uses the default guardrail, which blocks many stories that describe battles.

    You create a custom guardrail for story-gen. Its Violence control must still block completions that contain high-severity violence, but it must return completions that contain low- or medium-severity violence.

    Which blocking level should you set for the Violence control on the Output intervention point?
  fr: |
    Wingtip Toys utilise un déploiement de modèle nommé **story-gen** dans un projet Microsoft Foundry pour écrire des histoires d'aventure pour un jeu. Le déploiement utilise le garde-fou par défaut, qui bloque de nombreuses histoires décrivant des batailles.

    Vous créez un garde-fou personnalisé pour story-gen. Son contrôle Violence doit toujours bloquer les complétions qui contiennent de la violence de gravité élevée, mais il doit renvoyer les complétions qui contiennent de la violence de gravité faible ou moyenne.

    Quel niveau de blocage devez-vous définir pour le contrôle Violence sur le point d'intervention Output ?
body:
  options:
    - { id: a, text: "Off" }
    - { id: b, text: Low }
    - { id: c, text: Medium }
    - { id: d, text: High }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Low is the least restrictive blocking level: it blocks only high-severity content. Low- and medium-severity violence is therefore returned, while high-severity violence is still blocked.
    fr: |
      Le niveau Low est le niveau de blocage le moins restrictif : il ne bloque que le contenu de gravité élevée. La violence de gravité faible ou moyenne est donc renvoyée, tandis que la violence de gravité élevée reste bloquée.
  options:
    a:
      en: Off blocks nothing, so high-severity violence would be returned too. Turning off output filtering is also limited to customers approved for modified guardrails.
      fr: |
        Off ne bloque rien : la violence de gravité élevée serait aussi renvoyée. La désactivation du filtrage des sorties est en outre réservée aux clients approuvés pour les garde-fous modifiés.
    c:
      en: Medium, the level of the default guardrail, blocks medium- and high-severity content, so the medium-severity battle scenes would still be blocked.
      fr: |
        Medium, le niveau du garde-fou par défaut, bloque le contenu de gravité moyenne et élevée : les scènes de bataille de gravité moyenne seraient toujours bloquées.
    d:
      en: High is the most restrictive level; it blocks low-, medium- and high-severity content.
      fr: High est le niveau le plus restrictif ; il bloque le contenu de gravité faible, moyenne et élevée.
references:
  - title: Guardrails and controls overview in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/guardrails-overview
