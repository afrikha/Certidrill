id: ai103-sr1-tool-injection-2
objective: "1.4.1"
type: series_yesno
series: ai103-sr1-tool-injection
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add a User prompt attacks control on the User input intervention point to gr-policy.
  fr: Vous ajoutez à gr-policy un contrôle User prompt attacks sur le point d'intervention User input.
body:
  solution:
    en: |
      In gr-policy, you add a control for the **User prompt attacks** risk, select the **User input** intervention point, and set the action to **Annotate and block**.
    fr: |
      Dans gr-policy, vous ajoutez un contrôle pour le risque **User prompt attacks**, sélectionnez le point d'intervention **User input** et définissez l'action sur **Annotate and block**.
answer: { value: false }
explanation:
  correct:
    en: A User prompt attacks control detects jailbreak attempts that users type to bypass the system rules. The manipulating instructions arrive in the retrieved passages, which is a document (indirect) attack that this control doesn't cover.
    fr: "Un contrôle User prompt attacks détecte les tentatives de jailbreak que les utilisateurs saisissent pour contourner les règles système. Les instructions malveillantes arrivent dans les passages récupérés : c'est une attaque par document (indirecte), que ce contrôle ne couvre pas."
references:
  - title: Prompt Shields in Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/content-filter-prompt-shields
