id: ai103-sr1-tool-injection-2
objective: "1.4.1"
type: series_yesno
series: ai103-sr1-tool-injection
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You add a User prompt attacks control on the User input intervention point to gr-policy.
  fr: Vous ajoutez à gr-policy un contrôle User prompt attacks sur le point d'intervention User input.
body:
  solution:
    en: |
      In gr-policy, you add a control for the **User prompt attacks** risk, select the **User input** intervention point, and set the action to **Annotate and block**.
    fr: |
      Dans gr-policy, vous ajoutez un contrôle pour le risque **User prompt attacks**, sélectionnez le point d'intervention **User input** et définissez l'action sur **Annotate and block**.
answer: { value: false }
explanation:
  correct:
    en: A User input control scans only the query that the employee sends to the agent, so it detects jailbreak attempts typed by users. The manipulating instructions arrive in content returned by the SharePoint tool, which this control does not scan.
    fr: "Un contrôle User input analyse uniquement la requête que l'employé envoie à l'agent : il détecte les tentatives de jailbreak saisies par les utilisateurs. Les instructions malveillantes arrivent dans le contenu renvoyé par l'outil SharePoint, que ce contrôle n'analyse pas."
references:
  - title: Intervention points concepts
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/guardrails/intervention-points
