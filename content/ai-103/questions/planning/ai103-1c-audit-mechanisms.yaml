id: ai103-1c-audit-mechanisms
objective: "1.4.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank builds agents in Foundry Agent Service and generates marketing images with Azure OpenAI. The audit team lists four requirements.

    Which mechanism meets each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée des agents dans Foundry Agent Service et génère des images marketing avec Azure OpenAI. L'équipe d'audit liste quatre exigences.

    Quel mécanisme répond à chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: trc, text: { en: "Tracing in Application Insights", fr: "Suivi dans Application Insights" } }
    - { id: cc, text: Content Credentials }
    - { id: apr, text: { en: "require_approval on the MCP tool", fr: "require_approval sur l'outil MCP" } }
    - { id: cit, text: { en: "url_citation annotations", fr: "Annotations url_citation" } }
    - { id: eva, text: { en: "Risk and safety evaluators", fr: "Évaluateurs de risque et de sécurité" } }
    - { id: blk, text: { en: "A guardrail blocklist", fr: "Une liste de blocage de garde-fou" } }
  targets:
    - id: t1
      text: { en: "Prove later which tool an agent called, with which arguments, and what the tool returned.", fr: "Prouver plus tard quel outil un agent a appelé, avec quels arguments, et ce que l'outil a renvoyé." }
    - id: t2
      text: { en: "Show that an image in a brochure was created by an Azure OpenAI image model.", fr: "Montrer qu'une image d'une brochure a été créée par un modèle d'image Azure OpenAI." }
    - id: t3
      text: { en: "A manager must confirm each transfer before the agent calls the transfer tool of an MCP server.", fr: "Un responsable doit confirmer chaque virement avant que l'agent appelle l'outil de virement d'un serveur MCP." }
    - id: t4
      text: { en: "Link each answer of a knowledge agent to the indexed document it comes from.", fr: "Relier chaque réponse d'un agent de connaissances au document indexé dont elle provient." }
answer:
  mapping: { t1: trc, t2: cc, t3: apr, t4: cit }
explanation:
  correct:
    en: |
      Traces in Application Insights record each tool call with its arguments and result. Content Credentials are a signed C2PA manifest that Azure OpenAI adds to generated images. `require_approval` makes the agent wait for a human decision before it calls an MCP tool. `url_citation` annotations link an answer of the Azure AI Search tool to its source document.
    fr: |
      Les traces dans Application Insights enregistrent chaque appel d'outil avec ses arguments et son résultat. Les Content Credentials sont un manifeste C2PA signé qu'Azure OpenAI ajoute aux images générées. `require_approval` fait attendre à l'agent une décision humaine avant d'appeler un outil MCP. Les annotations `url_citation` relient une réponse de l'outil Azure AI Search à son document source.
  options:
    eva:
      en: |
        Evaluators score batches of responses for harmful content; they don't record or prove individual actions.
      fr: |
        Les évaluateurs notent des lots de réponses selon leur contenu nuisible ; ils n'enregistrent pas et ne prouvent pas les actions individuelles.
    blk:
      en: |
        A blocklist filters listed terms in inputs or outputs; it provides no audit record.
      fr: |
        Une liste de blocage filtre les termes listés dans les entrées ou les sorties ; elle ne fournit aucun enregistrement d'audit.
references:
  - title: Agent tracing overview
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/observability/concepts/trace-agent-concept
  - title: Content Credentials in Azure OpenAI (classic)
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-credentials
