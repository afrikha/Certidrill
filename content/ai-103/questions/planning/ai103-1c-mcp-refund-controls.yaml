id: ai103-1c-mcp-refund-controls
objective: "1.4.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam, Inc. connects an agent in Foundry Agent Service to the MCP server of its billing system. The server exposes five tools: get_invoice, list_invoices, refund_invoice, delete_invoice, and update_customer.

    You need to meet the following requirements:

    - The agent can call only get_invoice, list_invoices, and refund_invoice.
    - Each refund must be approved by a person.
    - Calls to get_invoice and list_invoices must run without approval.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam, Inc. connecte un agent de Foundry Agent Service au serveur MCP de son système de facturation. Le serveur expose cinq outils : get_invoice, list_invoices, refund_invoice, delete_invoice et update_customer.

    Vous devez satisfaire les exigences suivantes :

    - L'agent ne peut appeler que get_invoice, list_invoices et refund_invoice.
    - Chaque remboursement doit être approuvé par une personne.
    - Les appels à get_invoice et list_invoices doivent s'exécuter sans approbation.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    tool = MCPTool(
        server_label="fabrikam-billing",
        server_url="https://billing.fabrikam.com/mcp",
        allowed_tools=[[tools]],
        require_approval=[[approval]],
        project_connection_id="billing-connection",
    )
  slots:
    - id: tools
      options:
        - { id: three, text: '["get_invoice", "list_invoices", "refund_invoice"]' }
        - { id: empty, text: "[]" }
        - { id: refund, text: '["refund_invoice"]' }
        - { id: blocked, text: '["delete_invoice", "update_customer"]' }
    - id: approval
      options:
        - { id: alwaysrefund, text: '{"always": ["refund_invoice"]}' }
        - { id: neverrefund, text: '{"never": ["refund_invoice"]}' }
        - { id: always, text: '"always"' }
        - { id: never, text: '"never"' }
answer:
  values: { tools: three, approval: alwaysrefund }
explanation:
  correct:
    en: |
      A nonempty `allowed_tools` list restricts the agent to the listed tools, so delete_invoice and update_customer can't be called. `{"always": ["refund_invoice"]}` requires approval only for the listed tool, so the two read tools run without approval.
    fr: |
      Une liste `allowed_tools` non vide limite l'agent aux outils listés : delete_invoice et update_customer ne peuvent pas être appelés. `{"always": ["refund_invoice"]}` n'exige l'approbation que pour l'outil listé : les deux outils de lecture s'exécutent sans approbation.
  options:
    tools:
      en: |
        An empty list allows every tool of the server, a list with refund_invoice alone removes the read tools, and allowed_tools is an allow list, so listing the two other tools would allow only them.
      fr: |
        Une liste vide autorise tous les outils du serveur, une liste avec refund_invoice seul retire les outils de lecture, et allowed_tools est une liste d'autorisation : lister les deux autres outils n'autoriserait qu'eux.
    approval:
      en: |
        {"never": ["refund_invoice"]} exempts the refund from approval and requires it for the read tools; "always" also requires approval for the read tools, and "never" removes approval from the refund.
      fr: |
        {"never": ["refund_invoice"]} dispense le remboursement d'approbation et l'exige pour les outils de lecture ; "always" exige aussi l'approbation pour les outils de lecture, et "never" supprime l'approbation du remboursement.
references:
  - title: Connect agents to MCP server endpoints
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol
