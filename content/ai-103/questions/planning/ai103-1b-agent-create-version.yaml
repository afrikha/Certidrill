id: ai103-1b-agent-create-version
objective: "1.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has a Foundry project named **support** in a Microsoft Foundry resource named **northwind-ai**. The resource has a model deployment named **chat-prod** that runs **gpt-4.1-mini**.

    You are writing a Python script by using the `azure-ai-projects` 2.x package. The script must:

    - create a prompt agent named **support-agent** that uses chat-prod, or create a new version of the agent if it already exists;
    - start a multi-turn conversation with the agent, with the conversation state kept by the service.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un projet Foundry nommé **support** dans une ressource Microsoft Foundry nommée **northwind-ai**. La ressource comporte un déploiement de modèle nommé **chat-prod** qui exécute **gpt-4.1-mini**.

    Vous écrivez un script Python avec le package `azure-ai-projects` 2.x. Le script doit :

    - créer un agent d'invite nommé **support-agent** qui utilise chat-prod, ou créer une nouvelle version de l'agent s'il existe déjà ;
    - démarrer une conversation multitour avec l'agent, dont l'état est conservé par le service.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    project = AIProjectClient(
        endpoint="https://northwind-ai.services.ai.azure.com/api/projects/support",
        credential=DefaultAzureCredential(),
    )

    agent = [[create]](
        agent_name="support-agent",
        definition=PromptAgentDefinition(
            model=[[model]],
            instructions="Answer questions about Northwind orders.",
        ),
    )

    openai = project.get_openai_client(agent_name="support-agent")
    conversation = openai.[[conv]].create()
    response = openai.responses.create(
        conversation=conversation.id,
        input="Where is my order 4512?",
    )
  slots:
    - id: create
      options:
        - { id: cv, text: project.agents.create_version }
        - { id: dep, text: project.deployments.get }
        - { id: oai, text: project.get_openai_client }
        - { id: conn, text: project.connections.get }
    - id: model
      options:
        - { id: depname, text: "\"chat-prod\"" }
        - { id: modname, text: "\"gpt-4.1-mini\"" }
        - { id: fmt, text: "\"OpenAI\"" }
        - { id: sku, text: "\"GlobalStandard\"" }
    - id: conv
      options:
        - { id: convs, text: conversations }
        - { id: resp, text: responses }
        - { id: files, text: files }
answer:
  values: { create: cv, model: depname, conv: convs }
explanation:
  correct:
    en: |
      `project.agents.create_version()` creates the agent, or a new version of it if an agent with that name already exists. The `model` of a `PromptAgentDefinition` is the name of a deployment in the project's Foundry resource, here chat-prod. `openai.conversations.create()` creates a conversation object; passing its ID to each `responses.create()` call keeps the multi-turn context on the service side.
    fr: |
      `project.agents.create_version()` crée l'agent, ou une nouvelle version s'il existe déjà un agent portant ce nom. Le `model` d'un `PromptAgentDefinition` est le nom d'un déploiement de la ressource Foundry du projet, ici chat-prod. `openai.conversations.create()` crée un objet conversation ; passer son ID à chaque appel de `responses.create()` conserve le contexte multitour côté service.
  options:
    dep: { en: "project.deployments.get reads a model deployment; it doesn't create an agent.", fr: "project.deployments.get lit un déploiement de modèle ; il ne crée pas d'agent." }
    oai: { en: "get_openai_client returns a client; it doesn't take an agent definition.", fr: "get_openai_client renvoie un client ; il ne prend pas de définition d'agent." }
    conn: { en: "project.connections.get reads a connection to another resource.", fr: "project.connections.get lit une connexion vers une autre ressource." }
    modname: { en: "The model name isn't the name of a deployment in northwind-ai.", fr: "Le nom du modèle n'est pas le nom d'un déploiement de northwind-ai." }
    fmt: { en: "OpenAI is the model format of the deployment.", fr: "OpenAI est le format de modèle du déploiement." }
    sku: { en: "GlobalStandard is the deployment type of chat-prod.", fr: "GlobalStandard est le type de déploiement de chat-prod." }
    resp: { en: "responses.create sends a request; it doesn't create the conversation object whose ID is passed.", fr: "responses.create envoie une requête ; il ne crée pas l'objet conversation dont l'ID est passé." }
    files: { en: "files uploads files; it doesn't hold conversation state.", fr: "files charge des fichiers ; il ne conserve pas l'état de la conversation." }
references:
  - title: "Quickstart: Get started with Microsoft Foundry SDK"
    url: https://learn.microsoft.com/en-us/azure/foundry/quickstarts/get-started-code
