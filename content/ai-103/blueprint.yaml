# AI-103 — Developing AI Apps and Agents on Azure
# (certification: Microsoft Certified: Azure AI Apps and Agents Developer Associate)
# Source: official study guide, "Skills measured as of April 16, 2026"
# https://learn.microsoft.com/en-us/credentials/certifications/resources/study-guides/ai-103
# (en-us and fr-fr pages checked on 2026-11-16).
# Real exam: 120 minutes of exam time (certification page: "You will have 120 minutes to
# complete this assessment", "You may have interactive components"), passing score 700/1000,
# Microsoft Learn available during the exam (associate level). Microsoft does not publish the
# number of questions nor the question types; case study and Yes/No series are assumed, as on
# other associate exams. Code is Python (audience profile), hence more drop-down completions
# than AZ-104. Readiness and progression rules are those of AZ-104.
# active: false until the bank and the course are reviewed and published.
certification:
  code: ai-103
  title: Developing AI Apps and Agents on Azure
  vendor: Microsoft
  active: false

blueprint:
  version: "2026-04-16"
  durationMin: 120
  # Microsoft does not publish the number of questions. The simulator draws a total in this range.
  questionCount: { min: 45, max: 58 }
  passScore: 700
  maxScore: 1000

  # Target share of each question type in an exam (0..1). series_yesno is
  # driven by structure.series below and is therefore not listed here.
  typeMix:
    single: { min: 0.35, max: 0.45 }
    multi: { min: 0.10, max: 0.15 }
    yesno_statements: { min: 0.08, max: 0.12 }
    dropdown: { min: 0.15, max: 0.20 }
    dragdrop: { min: 0.05, max: 0.10 }
    ordering: { min: 0.05, max: 0.08 }
    hotarea: { min: 0.00, max: 0.03 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 1, max: 1 }
      questionsEach: { min: 4, max: 6 }
      # Where case-study sections go: "start", "end" or "random" (drawn per exam).
      placement: random
    series:
      # One Yes/No series of 3 questions per exam.
      count: { min: 1, max: 1 }
      questionsEach: { min: 3, max: 3 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`. Meeting the rules alone is not enough: 3 exams at
    # exactly 800 with a weakest domain at 760 give 79 ("almost ready").
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 700 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      # A first exam at 850 gives 50 + 225 + 100 + 75 = 450 XP: level 3 at once.
      levels:
        - { xp: 0, title: { en: Prompt apprentice, fr: Apprenti des invites } }
        - { xp: 150, title: { en: Model picker, fr: Sélectionneur de modèles } }
        - { xp: 400, title: { en: Foundry explorer, fr: Explorateur Foundry } }
        - { xp: 750, title: { en: RAG builder, fr: Bâtisseur RAG } }
        - { xp: 1200, title: { en: Agent wrangler, fr: Dresseur d'agents } }
        - { xp: 1750, title: { en: Vision specialist, fr: Spécialiste vision } }
        - { xp: 2400, title: { en: Guardrail keeper, fr: Gardien des garde-fous } }
        - { xp: 3150, title: { en: AI engineer, fr: Ingénieur IA } }
        - { xp: 4000, title: { en: Agent architect, fr: Architecte d'agents } }
        - { xp: 5000, title: { en: Foundry legend, fr: Légende Foundry } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }

domains:
  - code: planning
    order: 1
    weight: { min: 0.25, max: 0.30 }
    title:
      en: Plan and manage an Azure AI solution
      fr: Planifier et gérer une solution IA Azure
  - code: generative
    order: 2
    weight: { min: 0.30, max: 0.35 }
    title:
      en: Implement generative AI and agentic solutions
      fr: Implémenter des solutions d'IA et d'agent génératives
  - code: vision
    order: 3
    weight: { min: 0.10, max: 0.15 }
    title:
      en: Implement computer vision solutions
      fr: Implémenter des solutions de vision par ordinateur
  - code: text
    order: 4
    weight: { min: 0.10, max: 0.15 }
    title:
      en: Implement text analysis solutions
      fr: Implémenter des solutions d'analyse de texte
  - code: extraction
    order: 5
    weight: { min: 0.10, max: 0.15 }
    title:
      en: Implement information extraction solutions
      fr: Implémenter des solutions d'extraction d'informations
