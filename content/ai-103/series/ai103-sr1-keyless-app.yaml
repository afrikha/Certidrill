id: ai103-sr1-keyless-app
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Tailspin Toys has a Microsoft Foundry resource named **tailspin-ai** that contains a Foundry project named **support**. The project has a model deployment named **chat-model**.

    You are developing a Python web app named **App1** that will run in Azure App Service. App1 will use the Foundry SDK to send requests to chat-model and to create and run agents in the support project.

    You need to configure how App1 authenticates to tailspin-ai. The solution must meet the following requirements:

    - Key-based authentication will be disabled on tailspin-ai by setting `disableLocalAuth` to `true`.
    - App1 must not store or rotate any credential.
    - The identity used by App1 must not be able to create projects or manage model deployments.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Tailspin Toys dispose d'une ressource Microsoft Foundry nommée **tailspin-ai** qui contient un projet Foundry nommé **support**. Le projet comporte un déploiement de modèle nommé **chat-model**.

    Vous développez une application web Python nommée **App1** qui s'exécutera dans Azure App Service. App1 utilisera le SDK Foundry pour envoyer des requêtes à chat-model, ainsi que pour créer et exécuter des agents dans le projet support.

    Vous devez configurer la façon dont App1 s'authentifie auprès de tailspin-ai. La solution doit répondre aux exigences suivantes :

    - L'authentification par clé sera désactivée sur tailspin-ai en définissant `disableLocalAuth` sur `true`.
    - App1 ne doit stocker ni renouveler aucune information d'identification.
    - L'identité utilisée par App1 ne doit pas pouvoir créer de projets ni gérer les déploiements de modèles.
