id: ai103-sr2-scanned-manuals
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware, Inc. stores 12,000 maintenance manuals as PDF files in an Azure Blob Storage container. The manuals were scanned: their pages are images and contain no text layer.

    An Azure AI Search indexer named **manuals-indexer** loads the container into an index for a RAG app. Its configuration sets `dataToExtract` to `contentAndMetadata` and `parsingMode` to `default`, and doesn't set `imageAction`. Its skillset uses a Text Split skill that splits `/document/content` into `/document/pages/*`, an Azure OpenAI Embedding skill that vectorizes each page, and index projections that write one chunk per page.

    After the indexer ran, the chunks in the index contain no text. You need to ensure that each chunk contains the text printed on the scanned pages and is vectorized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware, Inc. stocke 12 000 manuels de maintenance sous forme de fichiers PDF dans un conteneur Stockage Blob Azure. Les manuels ont été numérisés : leurs pages sont des images et ne contiennent aucune couche de texte.

    Un indexeur Recherche Azure AI nommé **manuals-indexer** charge le conteneur dans un index pour une application RAG. Sa configuration définit `dataToExtract` sur `contentAndMetadata` et `parsingMode` sur `default`, et ne définit pas `imageAction`. Son ensemble de compétences utilise une compétence Text Split qui découpe `/document/content` en `/document/pages/*`, une compétence Azure OpenAI Embedding qui vectorise chaque page, et des projections d'index qui écrivent un bloc par page.

    Après l'exécution de l'indexeur, les blocs de l'index ne contiennent aucun texte. Vous devez faire en sorte que chaque bloc contienne le texte imprimé sur les pages numérisées et soit vectorisé.
