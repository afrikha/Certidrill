id: ai103-sr2-nightly-batch
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Wingtip Toys has a Microsoft Foundry resource named **wingtip-ai**. The resource has a Global Standard model deployment named **chat-live** that serves the online storefront assistant during the day. The model of chat-live is also available for Global Batch deployments.

    Every night, a Python job must summarize about 60,000 new product reviews by sending one chat completion request per review. The summaries can be delivered at any time within 24 hours after the job is submitted.

    You need to design how the nightly job calls the model. The solution must meet the following requirements:

    - The nightly job must not consume the rate limit of chat-live or cause HTTP 429 responses for the storefront assistant.
    - The cost of the nightly summaries must be minimized.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Wingtip Toys dispose d'une ressource Microsoft Foundry nommée **wingtip-ai**. La ressource comporte un déploiement de modèle Global Standard nommé **chat-live** qui sert l'assistant de la boutique en ligne pendant la journée. Le modèle de chat-live est également disponible pour les déploiements Global Batch.

    Chaque nuit, un travail Python doit résumer environ 60 000 nouveaux avis sur les produits en envoyant une requête de complétion de conversation par avis. Les résumés peuvent être livrés à tout moment dans les 24 heures qui suivent l'envoi du travail.

    Vous devez concevoir la façon dont le travail nocturne appelle le modèle. La solution doit répondre aux exigences suivantes :

    - Le travail nocturne ne doit pas consommer la limite de débit de chat-live ni provoquer de réponses HTTP 429 pour l'assistant de la boutique.
    - Le coût des résumés nocturnes doit être réduit au minimum.
