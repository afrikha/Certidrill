id: ai103-sr1-tool-injection
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank uses Foundry Agent Service to host an agent named **PolicyAgent**. PolicyAgent uses a model deployment named **gpt-main** and the SharePoint tool to answer employee questions from internal policy documents. External contractors can edit some of these documents.

    A custom guardrail named **gr-policy** is assigned to PolicyAgent. gr-policy contains controls for the Hate, Sexual, Self-harm, and Violence risks only. The gpt-main deployment uses the **Microsoft.DefaultV2** guardrail.

    You need to ensure that when a document returned by the SharePoint tool contains embedded instructions that try to manipulate PolicyAgent, the content is detected and the agent run is stopped before PolicyAgent acts on it.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank utilise Foundry Agent Service pour héberger un agent nommé **PolicyAgent**. PolicyAgent utilise un déploiement de modèle nommé **gpt-main** et l'outil SharePoint pour répondre aux questions des employés à partir de documents de stratégie internes. Des prestataires externes peuvent modifier certains de ces documents.

    Un garde-fou personnalisé nommé **gr-policy** est attribué à PolicyAgent. gr-policy contient uniquement des contrôles pour les risques Hate, Sexual, Self-harm et Violence. Le déploiement gpt-main utilise le garde-fou **Microsoft.DefaultV2**.

    Vous devez vous assurer que, lorsqu'un document renvoyé par l'outil SharePoint contient des instructions incorporées qui tentent de manipuler PolicyAgent, ce contenu est détecté et l'exécution de l'agent est arrêtée avant que PolicyAgent n'agisse en conséquence.
