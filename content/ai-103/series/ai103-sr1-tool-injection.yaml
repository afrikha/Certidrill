id: ai103-sr1-tool-injection
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Woodgrove Bank has a Python application named **PolicyChat** that answers employee questions from internal policy documents. For each question, PolicyChat retrieves passages from an Azure AI Search index and sends them, with the question, to a model deployment named **gpt-main** through the Chat Completions API. External contractors can edit some of these documents.

    A custom guardrail named **gr-policy** is assigned to gpt-main. gr-policy contains controls for the Hate, Sexual, Self-harm, and Violence risks only.

    You need to ensure that when a retrieved passage contains embedded instructions that try to manipulate the model, the content is detected and the request is blocked before the model acts on it.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Woodgrove Bank dispose d'une application Python nommée **PolicyChat** qui répond aux questions des employés à partir de documents de stratégie internes. Pour chaque question, PolicyChat récupère des passages dans un index Azure AI Search et les envoie, avec la question, à un déploiement de modèle nommé **gpt-main** via l'API Chat Completions. Des prestataires externes peuvent modifier certains de ces documents.

    Un garde-fou personnalisé nommé **gr-policy** est attribué à gpt-main. gr-policy contient uniquement des contrôles pour les risques Hate, Sexual, Self-harm et Violence.

    Vous devez vous assurer que, lorsqu'un passage récupéré contient des instructions incorporées qui tentent de manipuler le modèle, ce contenu est détecté et la requête est bloquée avant que le modèle n'agisse en conséquence.
