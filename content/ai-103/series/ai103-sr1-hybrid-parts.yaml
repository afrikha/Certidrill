id: ai103-sr1-hybrid-parts
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders indexes its equipment maintenance manuals in Azure AI Search. The index **manuals-idx** contains a searchable text field named `content` and a searchable vector field named `contentVector` that has a vectorizer assigned. A semantic configuration named **sem-cfg** is defined on the index.

    A Python RAG app uses `SearchClient` from the `azure-search-documents` package to retrieve five passages for each user question and passes them to a chat model.

    User questions often combine an exact part number, such as `HX-4471-B`, with wording that differs from the wording of the manuals. You need to configure the query so that:

    - Passages that contain the exact part number are retrieved.
    - Passages that are conceptually similar to the question are retrieved even when they share no words with it.
    - The five passages returned are reranked by a model that evaluates how well each passage matches the meaning of the question.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders indexe ses manuels de maintenance d'équipements dans Recherche Azure AI. L'index **manuals-idx** contient un champ de texte pouvant faire l'objet d'une recherche nommé `content` et un champ vectoriel pouvant faire l'objet d'une recherche nommé `contentVector` auquel un vectoriseur est attribué. Une configuration sémantique nommée **sem-cfg** est définie sur l'index.

    Une application RAG Python utilise `SearchClient` du package `azure-search-documents` pour récupérer cinq passages pour chaque question d'utilisateur et les transmet à un modèle de conversation.

    Les questions des utilisateurs associent souvent une référence de pièce exacte, telle que `HX-4471-B`, à une formulation différente de celle des manuels. Vous devez configurer la requête de sorte que :

    - Les passages qui contiennent la référence de pièce exacte soient récupérés.
    - Les passages conceptuellement proches de la question soient récupérés même s'ils n'ont aucun mot en commun avec elle.
    - Les cinq passages renvoyés soient reclassés par un modèle qui évalue dans quelle mesure chaque passage correspond au sens de la question.
