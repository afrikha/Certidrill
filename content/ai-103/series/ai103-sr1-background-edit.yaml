id: ai103-sr1-background-edit
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Proseware sells furniture online. Its catalog contains 2,000 product photos, each a 1024x1024 PNG file. For each photo, Proseware also has a segmentation that identifies which pixels belong to the product.

    You have a Microsoft Foundry project that contains a deployment named **img1** of a GPT-image series model that supports the image edits endpoint.

    For a winter campaign, you need a Python script that produces a version of each photo in which only the background area is changed to a snowy chalet interior. The product area of each photo must not be targeted by the edit.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Proseware vend des meubles en ligne. Son catalogue contient 2 000 photos de produits, chacune étant un fichier PNG de 1024x1024. Pour chaque photo, Proseware dispose également d'une segmentation qui identifie les pixels appartenant au produit.

    Vous disposez d'un projet Microsoft Foundry qui contient un déploiement nommé **img1** d'un modèle de la série GPT-image prenant en charge le point de terminaison de modification d'images (edits).

    Pour une campagne d'hiver, vous avez besoin d'un script Python qui produit une version de chaque photo dans laquelle seule la zone d'arrière-plan est remplacée par l'intérieur d'un chalet enneigé. La zone du produit de chaque photo ne doit pas être ciblée par la modification.
