id: ai103-sr1-contract-translation
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware has an Azure Translator in Foundry Tools resource and an Azure Storage account. Every day, about 300 English contracts are added to a blob container named **contracts-en**. The contracts are DOCX files and scanned PDF files. After each nightly run, an existing process archives the files of contracts-en and empties the container.

    The legal team maintains a TSV file that lists how specific legal terms must be translated into French and German.

    You need to implement a solution that meets the following requirements:

    - Each night, an unattended job translates the contracts in contracts-en into French and German and writes the translated files to a container named **contracts-out**.
    - The translated files keep the layout and formatting of the original contracts.
    - The terms listed in the TSV file are translated as the legal team specifies.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware dispose d'une ressource Azure Translator dans Foundry Tools et d'un compte Stockage Azure. Chaque jour, environ 300 contrats en anglais sont ajoutés à un conteneur d'objets blob nommé **contracts-en**. Les contrats sont des fichiers DOCX et des fichiers PDF numérisés. Après chaque exécution nocturne, un processus existant archive les fichiers de contracts-en et vide le conteneur.

    L'équipe juridique tient à jour un fichier TSV qui indique comment certains termes juridiques doivent être traduits en français et en allemand.

    Vous devez implémenter une solution qui répond aux exigences suivantes :

    - Chaque nuit, un travail sans intervention humaine traduit les contrats de contracts-en en français et en allemand et écrit les fichiers traduits dans un conteneur nommé **contracts-out**.
    - Les fichiers traduits conservent la disposition et la mise en forme des contrats d'origine.
    - Les termes listés dans le fichier TSV sont traduits comme l'équipe juridique l'indique.
