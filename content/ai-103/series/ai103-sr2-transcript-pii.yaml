id: ai103-sr2-transcript-pii
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Northwind Traders runs a customer support chat in English and has about two million customers. Each chat transcript is saved as a plain-text string. Before a transcript is written to the analytics store, a Python function must process it.

    You need to configure the processing step. The solution must meet the following requirements:

    - Customer names, phone numbers and payment card numbers must be replaced by masking characters.
    - The rest of each transcript must be stored unchanged so that analysts can read it.
    - The step must use a Foundry Tool that returns a documented, predictable output, not a generative model.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Northwind Traders exploite un service de chat de support client en anglais et compte environ deux millions de clients. Chaque transcription de conversation est enregistrée sous forme de chaîne de texte brut. Avant qu'une transcription ne soit écrite dans le magasin d'analytique, une fonction Python doit la traiter.

    Vous devez configurer l'étape de traitement. La solution doit répondre aux exigences suivantes :

    - Les noms des clients, les numéros de téléphone et les numéros de carte de paiement doivent être remplacés par des caractères de masquage.
    - Le reste de chaque transcription doit être stocké sans modification afin que les analystes puissent le lire.
    - L'étape doit utiliser un Foundry Tool qui renvoie une sortie documentée et prévisible, et non un modèle génératif.
