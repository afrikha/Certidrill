id: ai103-sr2-fabrication-eval
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Litware, Inc. has a RAG assistant that answers employee questions about HR policies. The assistant retrieves policy passages from an index and passes them to a chat model. You have a Foundry project that contains a judge model deployment named **judge-model**.

    You export 400 production conversations to a test dataset. Each row contains three fields: `query` (the employee question), `context` (the passages retrieved for that question) and `response` (the answer of the assistant). The dataset contains no expected answers, and none can be written.

    You need to configure a cloud evaluation in the Foundry project that meets the following requirements:

    - Each response that contains statements not supported by its retrieved passages must be flagged.
    - Each row must receive a pass or fail result.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Litware, Inc. dispose d'un assistant RAG qui répond aux questions des employés sur les stratégies RH. L'assistant récupère des passages de stratégies dans un index et les transmet à un modèle de conversation. Vous disposez d'un projet Foundry qui contient un déploiement de modèle juge nommé **judge-model**.

    Vous exportez 400 conversations de production dans un jeu de données de test. Chaque ligne contient trois champs : `query` (la question de l'employé), `context` (les passages récupérés pour cette question) et `response` (la réponse de l'assistant). Le jeu de données ne contient aucune réponse attendue, et aucune ne peut être rédigée.

    Vous devez configurer une évaluation cloud dans le projet Foundry qui réponde aux exigences suivantes :

    - Chaque réponse qui contient des affirmations non étayées par les passages récupérés doit être signalée.
    - Chaque ligne doit recevoir un résultat de réussite ou d'échec.
