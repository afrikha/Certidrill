id: ai103-sr1-refund-approval
status: draft
stem:
  en: |
    **Note:** This question is part of a series of questions that present the same scenario. Each question in the series contains a unique solution that might meet the stated goals. Some question sets might have more than one correct solution, while others might not have a correct solution.

    Fabrikam is building an order-support agent in Foundry Agent Service by using the `azure-ai-projects` Python SDK. The agent connects to a remote MCP server labeled **orders** through an `MCPTool`. The server exposes five tools: `get_order_status`, `list_orders`, `issue_refund`, `cancel_order`, and `delete_customer`.

    Customers chat with the agent through Fabrikam's web app. Support supervisors use a review page in the same app.

    You need to meet the following requirements:

    - The agent can call `get_order_status` and `list_orders` without waiting for anyone.
    - Each call to `issue_refund` or `cancel_order` runs only after a support supervisor approves that specific call.
    - The agent must never be able to call `delete_customer`.
  fr: |
    **Remarque :** cette question fait partie d'une série de questions présentant le même scénario. Chaque question de la série propose une solution unique susceptible d'atteindre les objectifs fixés. Certaines séries peuvent avoir plusieurs solutions correctes, d'autres aucune.

    Fabrikam crée un agent de support des commandes dans Foundry Agent Service à l'aide du SDK Python `azure-ai-projects`. L'agent se connecte à un serveur MCP distant étiqueté **orders** par l'intermédiaire d'un `MCPTool`. Le serveur expose cinq outils : `get_order_status`, `list_orders`, `issue_refund`, `cancel_order` et `delete_customer`.

    Les clients conversent avec l'agent depuis l'application web de Fabrikam. Les superviseurs du support utilisent une page de revue dans la même application.

    Vous devez répondre aux exigences suivantes :

    - L'agent peut appeler `get_order_status` et `list_orders` sans attendre personne.
    - Chaque appel à `issue_refund` ou `cancel_order` s'exécute uniquement après qu'un superviseur du support a approuvé cet appel précis.
    - L'agent ne doit jamais pouvoir appeler `delete_customer`.
