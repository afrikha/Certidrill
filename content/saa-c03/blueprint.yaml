# SAA-C03 — AWS Certified Solutions Architect – Associate
# Everything describing the exam is data: changing it requires no code change.
# Sources (checked on 2026-11-19):
#   - AWS Certified Solutions Architect - Associate (SAA-C03) Exam Guide, version 1.1,
#     published October 29, 2026 (version 1.0: August 28, 2026), English and fr_fr:
#     https://docs.aws.amazon.com/aws-certification/latest/solutions-architect-associate-03/solutions-architect-associate-03.pdf
#     (fr: same path under /fr_fr/; the HTML pages could not be read, the PDFs were).
#   - Certification page: https://aws.amazon.com/certification/certified-solutions-architect-associate/
#     (130 minutes, 65 questions, multiple choice or multiple response; no successor
#     version announced; only the Italian-language version retires after December 31, 2026).
# Exam facts: 65 questions = 50 scored + 15 unscored (not identified); scaled score
# 100–1,000, pass at 720, compensatory scoring; response types: multiple choice
# (1 correct of 4) and multiple response (2 or more correct of 5 or more).
# Unscored questions are not modelled: the mock exam scores all 65 questions.
# Domain weights: share of scored content as published (30 / 26 / 24 / 20 %).
certification:
  code: saa-c03
  title: AWS Certified Solutions Architect – Associate
  vendor: AWS
  active: false

blueprint:
  version: "2026-10-29"
  durationMin: 130
  questionCount: { min: 65, max: 65 }
  passScore: 720
  maxScore: 1000
  # AWS gives no partial credit on multiple-response questions (see docs/SPECS-AWS.md §3.3);
  # ignored by the loader until that rule is implemented.
  scoring:
    multi: all_or_nothing

  # Target share of each question type in an exam (0..1). The real exam has only
  # multiple choice (single) and multiple response (multi).
  typeMix:
    single: { min: 0.78, max: 0.88 }
    multi: { min: 0.12, max: 0.22 }

  difficultyMix: { easy: 0.30, medium: 0.50, hard: 0.20 }

  structure:
    caseStudies:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
      placement: end
    series:
      count: { min: 0, max: 0 }
      questionsEach: { min: 0, max: 0 }
    maxPerObjective: 2
    warningsMin: [10, 5]
    # Readiness index (0–100), the central indicator of the dashboard.
    # index = weighted sum of four criteria, each worth 0–100 points:
    #   level       — weighted average of the last `window` exams, weights 1, 2, …, n
    #                 from the oldest to the latest
    #   consistency — lowest of the last `recent` exams
    #   domains     — weakest domain, averaged over the last `recent` exams
    #   freshness   — share of never-seen questions, and date of the last exam
    # Scores map to points linearly: `scale.from` or less → 0, `scale.to` or more → 100.
    # "Ready" = index at `bands.ready` or more AND five rules (minAttempts,
    # consecutive × minScore, domainFloor, freshness.minNewShare: at least that
    # share of never-seen questions in the `recent` exams, freshness.zeroDays: a
    # last exam at most that old); while a rule fails, the index stays
    # under `bands.ready`.
    readiness:
      minAttempts: 3
      consecutive: 3
      minScore: 800
      domainFloor: 650
      recent: 3
      window: 5
      scale: { from: 600, to: 850 }
      weights: { level: 0.5, consistency: 0.2, domains: 0.2, freshness: 0.1 }
      bands: { progressing: 50, almost: 70, ready: 85 }
      # Recency: full up to staleDays after the last exam, then down to 0 at zeroDays;
      # past zeroDays, no "ready" until a new exam.
      freshness: { staleDays: 30, zeroDays: 90, minNewShare: 0.5 }
    # XP, levels, domain mastery and badges: the "gaming" side. They reward
    # effort and progress; only the readiness index says "ready".
    progression:
      xp:
        base: 50            # any finished exam
        scoreFrom: 400      # score XP = (score - 400) × 0.5: 0 at 400, 300 at 1000
        perPoint: 0.5
        knownShare: 0.5     # only half the score XP on questions already seen
        passBonus: 100      # at 720 or more
        bestBonus: 75       # best score so far
        domainBonus: 50     # per domain at least 50 points above the previous exam
        domainGain: 50
      levels:
        - { xp: 0, title: { en: Cloud trainee, fr: Stagiaire cloud } }
        - { xp: 150, title: { en: Console explorer, fr: Explorateur de la console } }
        - { xp: 400, title: { en: VPC builder, fr: Bâtisseur de VPC } }
        - { xp: 750, title: { en: IAM guardian, fr: Gardien IAM } }
        - { xp: 1200, title: { en: Junior architect, fr: Architecte junior } }
        - { xp: 1750, title: { en: Resilience designer, fr: Concepteur de la résilience } }
        - { xp: 2400, title: { en: Performance tuner, fr: Optimiseur de performances } }
        - { xp: 3150, title: { en: Cost strategist, fr: Stratège des coûts } }
        - { xp: 4000, title: { en: Solutions architect, fr: Architecte de solutions } }
        - { xp: 5000, title: { en: Well-Architected legend, fr: Légende Well-Architected } }
      mastery: { bronze: 650, silver: 700, gold: 850 }
      badges:
        hatTrick: { count: 3, min: 800 }
        regular: { weeks: 4 }
        comeback: { gain: 150 }

domains:
  - code: secure
    order: 1
    weight: { min: 0.30, max: 0.30 }
    title:
      en: Design Secure Architectures
      fr: Conception d'architectures sécurisées
  - code: resilient
    order: 2
    weight: { min: 0.26, max: 0.26 }
    title:
      en: Design Resilient Architectures
      fr: Conception d'architectures résilientes
  - code: performance
    order: 3
    weight: { min: 0.24, max: 0.24 }
    title:
      en: Design High-Performing Architectures
      fr: Conception d'architectures hautement performantes
  - code: cost
    order: 4
    weight: { min: 0.20, max: 0.20 }
    title:
      en: Design Cost-Optimized Architectures
      fr: Conception d'architectures optimisées en termes de coûts
