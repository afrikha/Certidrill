id: saac03-2c-beanstalk-immutable-policy
objective: "2.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys a web application with AWS Elastic Beanstalk. During a recent rolling deployment, a failed batch left the environment running a mix of old and new application versions. For future deployments, the company wants a full set of new instances to be launched in a separate Auto Scaling group. If the new instances fail health checks, they must be terminated and the original instances must remain untouched.

    Which deployment policy should the company use?
  fr: |
    Une entreprise déploie une application web avec AWS Elastic Beanstalk. Lors d'un récent déploiement progressif, un lot en échec a laissé l'environnement exécuter un mélange d'anciennes et de nouvelles versions de l'application. Pour les prochains déploiements, l'entreprise souhaite qu'un ensemble complet de nouvelles instances soit lancé dans un groupe Auto Scaling distinct. Si les nouvelles instances échouent aux vérifications de l'état, elles doivent être résiliées et les instances d'origine doivent rester intactes.

    Quelle politique de déploiement (deployment policy) l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: All at once
    - id: b
      text: Rolling
    - id: c
      text: Rolling with additional batch
    - id: d
      text: Immutable
answer: { optionId: d }
explanation:
  correct:
    en: |
      An immutable deployment launches a full set of new instances running the new version in a separate Auto Scaling group, alongside the old instances. If the new instances do not pass health checks, Elastic Beanstalk terminates them and leaves the original instances untouched, so no mixed-version state remains.
    fr: |
      Un déploiement immuable (Immutable) lance un ensemble complet de nouvelles instances exécutant la nouvelle version dans un groupe Auto Scaling distinct, à côté des anciennes instances. Si les nouvelles instances échouent aux vérifications de l'état, Elastic Beanstalk les résilie et laisse les instances d'origine intactes : aucun état à versions mélangées ne subsiste.
  options:
    a:
      en: |
        All at once deploys the new version to the existing instances at the same time, with a short outage, and a failure affects every instance.
      fr: |
        All at once déploie la nouvelle version sur les instances existantes en même temps, avec une courte interruption, et un échec touche toutes les instances.
    b:
      en: |
        Rolling updates the existing instances in batches; a failed batch can leave old and new versions mixed, which is the problem the company had.
      fr: |
        Rolling met à jour les instances existantes par lots ; un lot en échec peut laisser un mélange d'anciennes et de nouvelles versions, le problème rencontré par l'entreprise.
    c:
      en: |
        Rolling with additional batch keeps full capacity with one extra batch, but it still updates the existing instances in batches and can leave mixed versions.
      fr: |
        Rolling with additional batch maintient la pleine capacité grâce à un lot supplémentaire, mais il met toujours à jour les instances existantes par lots et peut laisser des versions mélangées.
references:
  - title: Deployment policies and settings
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features.rolling-version-deploy.html
