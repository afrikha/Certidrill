id: saac03-2c-s3-replication-time-control
objective: "2.2.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial company replicates trading records from an Amazon S3 bucket in us-east-1 to a bucket in us-west-2 with S3 Cross-Region Replication. A new regulation requires a predictable replication time that is backed by a service level agreement. The company must also receive an alert whenever an object takes longer than 15 minutes to replicate.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une société financière réplique des enregistrements de transactions d'un compartiment Amazon S3 dans us-east-1 vers un compartiment dans us-west-2 avec S3 Cross-Region Replication. Une nouvelle réglementation exige un délai de réplication prévisible, garanti par un accord de niveau de service (SLA). L'entreprise doit aussi recevoir une alerte chaque fois qu'un objet met plus de 15 minutes à être répliqué.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Invoke an AWS Lambda function on each upload that copies the object to us-west-2 and publishes an alert if the copy takes too long."
        fr: "Appeler, à chaque chargement, une fonction AWS Lambda qui copie l'objet vers us-west-2 et publie une alerte si la copie prend trop de temps."
    - id: b
      text:
        en: "Schedule an S3 Batch Replication job every 15 minutes and review the job completion reports."
        fr: "Planifier une tâche S3 Batch Replication toutes les 15 minutes et examiner les rapports d'exécution des tâches."
    - id: c
      text:
        en: "Enable S3 Replication Time Control on the replication rule and send OperationMissedThreshold event notifications to an Amazon SNS topic."
        fr: "Activer S3 Replication Time Control sur la règle de réplication et envoyer les notifications d'événements OperationMissedThreshold vers une rubrique Amazon SNS."
    - id: d
      text:
        en: "Enable S3 Transfer Acceleration on both buckets and create a CloudWatch alarm on the bucket size metric."
        fr: "Activer S3 Transfer Acceleration sur les deux compartiments et créer une alarme CloudWatch sur la métrique de taille du compartiment."
answer: { optionId: c }
explanation:
  correct:
    en: |
      S3 Replication Time Control (S3 RTC) replicates most objects in seconds, comes with an SLA for replication within 15 minutes, and enables replication metrics. Its OperationMissedThreshold event reports objects that did not replicate within 15 minutes and can be delivered to Amazon SNS, Amazon SQS, or AWS Lambda.
    fr: |
      S3 Replication Time Control (S3 RTC) réplique la plupart des objets en quelques secondes, s'accompagne d'un SLA de réplication en 15 minutes et active les métriques de réplication. Son événement OperationMissedThreshold signale les objets non répliqués en 15 minutes et peut être envoyé vers Amazon SNS, Amazon SQS ou AWS Lambda.
  options:
    a:
      en: |
        Custom copy code replaces a managed feature with code to maintain and offers no SLA on replication time.
      fr: |
        Du code de copie personnalisé remplace une fonctionnalité gérée par du code à maintenir et n'offre aucun SLA sur le délai de réplication.
    b:
      en: |
        Batch Replication is for existing or failed objects on demand; scheduling it adds work and provides no replication-time SLA.
      fr: |
        Batch Replication sert à répliquer à la demande des objets existants ou en échec ; la planifier ajoute du travail et n'apporte aucun SLA de délai de réplication.
    d:
      en: |
        Transfer Acceleration speeds up client uploads only, and bucket size does not reveal late replication of individual objects.
      fr: |
        Transfer Acceleration accélère uniquement les chargements des clients, et la taille du compartiment ne révèle pas le retard de réplication d'objets individuels.
references:
  - title: Meeting compliance requirements with S3 Replication Time Control
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-time-control.html
