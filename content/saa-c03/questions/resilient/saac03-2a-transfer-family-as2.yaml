id: saac03-2a-transfer-family-as2
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer exchanges EDI purchase orders with large retail trading partners. The partners require the AS2 protocol with signed and encrypted messages and message disposition notifications (MDNs). The manufacturer wants the received documents stored in Amazon S3 and does not want to install or operate AS2 server software.

    Which solution will meet these requirements?
  fr: |
    Un fabricant échange des bons de commande EDI avec de grands partenaires commerciaux de la distribution. Les partenaires exigent le protocole AS2 avec des messages signés et chiffrés et des accusés de réception (MDN). Le fabricant veut que les documents reçus soient stockés dans Amazon S3 et ne veut ni installer ni exploiter de logiciel serveur AS2.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Transfer Family server that uses the AS2 protocol, and configure profiles, agreements and certificates for each trading partner.", fr: "Créer un serveur AWS Transfer Family qui utilise le protocole AS2, et configurer des profils, des accords et des certificats pour chaque partenaire commercial." }
    - id: b
      text: { en: "Create an AWS Transfer Family server that uses the SFTP protocol, and create one SFTP user for each trading partner.", fr: "Créer un serveur AWS Transfer Family qui utilise le protocole SFTP, et créer un utilisateur SFTP pour chaque partenaire commercial." }
    - id: c
      text: { en: "Create an Amazon AppFlow flow for each trading partner that copies the purchase orders to Amazon S3.", fr: "Créer un flux Amazon AppFlow pour chaque partenaire commercial qui copie les bons de commande dans Amazon S3." }
    - id: d
      text: { en: "Install commercial AS2 software on EC2 instances in an Auto Scaling group, and copy the received files to Amazon S3.", fr: "Installer un logiciel AS2 commercial sur des instances EC2 dans un groupe Auto Scaling, et copier les fichiers reçus dans Amazon S3." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AWS Transfer Family supports AS2 in addition to SFTP, FTPS and FTP, and stores AS2 messages in Amazon S3. Local and partner profiles, agreements and X.509 certificates define each trading relationship, and Transfer Family handles signing, encryption and MDNs without any server software to run.
    fr: |
      AWS Transfer Family prend en charge AS2 en plus de SFTP, FTPS et FTP, et stocke les messages AS2 dans Amazon S3. Des profils locaux et partenaires, des accords et des certificats X.509 définissent chaque relation commerciale, et Transfer Family gère la signature, le chiffrement et les MDN sans logiciel serveur à exploiter.
  options:
    b: { en: "SFTP is a different protocol; partners that require AS2 with MDN receipts cannot use an SFTP endpoint.", fr: "SFTP est un autre protocole ; des partenaires qui exigent AS2 avec des accusés MDN ne peuvent pas utiliser un point de terminaison SFTP." }
    c: { en: "Amazon AppFlow transfers data between SaaS applications and AWS services; it does not receive AS2 messages from trading partners.", fr: "Amazon AppFlow transfère des données entre des applications SaaS et des services AWS ; il ne reçoit pas de messages AS2 de partenaires commerciaux." }
    d: { en: "Self-managed AS2 software on EC2 meets the protocol need, but the manufacturer must install, patch and operate it, which it wants to avoid.", fr: "Un logiciel AS2 autogéré sur EC2 répond au besoin de protocole, mais le fabricant doit l'installer, le corriger et l'exploiter, ce qu'il veut éviter." }
references:
  - title: What is AWS Transfer Family?
    url: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
  - title: Configuring AS2
    url: https://docs.aws.amazon.com/transfer/latest/userguide/create-b2b-server.html
