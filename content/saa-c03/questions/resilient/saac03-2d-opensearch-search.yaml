id: saac03-2d-opensearch-search
objective: "2.2.20"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company stores its product catalog of several million items in an Amazon Aurora MySQL-Compatible Edition database. Customers search the catalog with free-text queries on product names and descriptions. The current SQL queries that use LIKE patterns are slow and load the database during sales events.

    The company wants a purpose-built, highly available service for full-text search, and the database must remain the system of record.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution stocke son catalogue de plusieurs millions de produits dans une base de données Amazon Aurora MySQL-Compatible Edition. Les clients recherchent dans le catalogue par requêtes en texte libre sur les noms et les descriptions des produits. Les requêtes SQL actuelles, qui utilisent des motifs LIKE, sont lentes et chargent la base pendant les périodes de soldes.

    L'entreprise veut un service spécialisé et hautement disponible pour la recherche en texte intégral, et la base de données doit rester le système de référence.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Index the catalog in an Amazon OpenSearch Service domain that spans multiple Availability Zones, and send the search queries to the domain.", fr: "Indexer le catalogue dans un domaine Amazon OpenSearch Service réparti sur plusieurs zones de disponibilité, et envoyer les requêtes de recherche au domaine." } }
    - { id: b, text: { en: "Add Aurora Replicas in other Availability Zones, and send the existing LIKE search queries to the cluster reader endpoint.", fr: "Ajouter des réplicas Aurora dans d'autres zones de disponibilité, et envoyer les requêtes de recherche LIKE existantes au point de terminaison du lecteur du cluster." } }
    - { id: c, text: { en: "Load the catalog into an Amazon Redshift cluster every hour, and send the customer search queries to the cluster.", fr: "Charger le catalogue toutes les heures dans un cluster Amazon Redshift, et envoyer les requêtes de recherche des clients au cluster." } }
    - { id: d, text: { en: "Cache the results of previous search queries in Amazon ElastiCache, and query the database only when the cache has no result.", fr: "Mettre en cache les résultats des requêtes de recherche précédentes dans Amazon ElastiCache, et n'interroger la base de données qu'en l'absence de résultat en cache." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon OpenSearch Service is the purpose-built AWS service for full-text, website, and application search. A domain with nodes allocated across two or three Availability Zones stays available if a zone fails. The catalog stays in Aurora as the system of record, and only the search index lives in OpenSearch Service.
    fr: |
      Amazon OpenSearch Service est le service AWS spécialisé dans la recherche en texte intégral, la recherche de sites web et la recherche applicative. Un domaine dont les nœuds sont répartis sur deux ou trois zones de disponibilité reste disponible en cas de panne d'une zone. Le catalogue reste dans Aurora comme système de référence, et seul l'index de recherche réside dans OpenSearch Service.
  options:
    b: { en: "Replicas offload the reads from the writer, but each LIKE query stays just as slow because the database engine is not built for full-text search.", fr: "Les réplicas déchargent les lectures de l'instance d'écriture, mais chaque requête LIKE reste aussi lente, car le moteur de base de données n'est pas conçu pour la recherche en texte intégral." }
    c: { en: "Redshift is a data warehouse for analytical SQL queries, not a low-latency search engine for customer-facing free-text search.", fr: "Redshift est un entrepôt de données pour les requêtes SQL analytiques, pas un moteur de recherche à faible latence pour la recherche en texte libre des clients." }
    d: { en: "A cache only helps for repeated identical queries; every new search term still runs a slow LIKE query on the database.", fr: "Un cache n'aide que pour des requêtes identiques répétées ; chaque nouveau terme de recherche exécute toujours une requête LIKE lente sur la base de données." }
references:
  - title: What is Amazon OpenSearch Service?
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
  - title: Amazon OpenSearch Service FAQs
    url: https://aws.amazon.com/opensearch-service/faqs/
