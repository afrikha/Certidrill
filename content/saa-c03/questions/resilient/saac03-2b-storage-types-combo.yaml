id: saac03-2b-storage-types-combo
objective: "2.1.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company is rebuilding its photo-sharing application on AWS. Users upload photos that must be stored durably and served to browsers over HTTPS at very large scale. The application servers run on Linux Amazon EC2 instances in an Auto Scaling group across two Availability Zones and need a shared POSIX-compliant directory for working files that all instances read and write.

    Which combination of storage services will meet these requirements with the LEAST operational overhead? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de médias reconstruit son application de partage de photos sur AWS. Les utilisateurs chargent des photos qui doivent être stockées de manière durable et servies aux navigateurs via HTTPS à très grande échelle. Les serveurs d'application s'exécutent sur des instances Amazon EC2 Linux d'un groupe Auto Scaling réparti sur deux zones de disponibilité et ont besoin d'un répertoire partagé conforme à POSIX pour des fichiers de travail que toutes les instances lisent et écrivent.

    Quelle combinaison de services de stockage répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Use an Amazon EBS io2 volume with Multi-Attach enabled for the shared working directory.", fr: "Utiliser un volume Amazon EBS io2 avec Multi-Attach activé pour le répertoire de travail partagé." }
    - id: b
      text: { en: "Store the uploaded photos on Amazon EBS gp3 volumes attached to the application servers.", fr: "Stocker les photos chargées sur des volumes Amazon EBS gp3 attachés aux serveurs d'application." }
    - id: c
      text: { en: "Store the uploaded photos in an Amazon S3 bucket.", fr: "Stocker les photos chargées dans un compartiment Amazon S3." }
    - id: d
      text: { en: "Use an Amazon EFS file system for the shared working directory.", fr: "Utiliser un système de fichiers Amazon EFS pour le répertoire de travail partagé." }
    - id: e
      text: { en: "Use the instance store volumes of the application servers for the shared working directory.", fr: "Utiliser les volumes de stockage d'instance des serveurs d'application pour le répertoire de travail partagé." }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: Object storage fits the photos. Amazon S3 stores objects durably, scales without capacity management, and serves them over HTTPS. File storage fits the shared directory. Amazon EFS is a managed NFS file system with POSIX permissions that instances in several Availability Zones can mount at the same time.
    fr: "Le stockage d'objets convient aux photos : Amazon S3 stocke les objets de manière durable, évolue sans gestion de capacité et les sert via HTTPS. Le stockage de fichiers convient au répertoire partagé : Amazon EFS est un système de fichiers NFS géré avec des autorisations POSIX que des instances de plusieurs zones de disponibilité peuvent monter simultanément."
  options:
    a:
      en: Multi-Attach is limited to instances in one Availability Zone and needs a cluster-aware file system, so it cannot serve a group that spans two zones.
      fr: Multi-Attach est limité aux instances d'une seule zone de disponibilité et nécessite un système de fichiers en cluster ; il ne peut donc pas servir un groupe réparti sur deux zones.
    b:
      en: Block volumes belong to one instance and one Availability Zone; serving photos from them requires managing capacity, replication, and web serving yourself.
      fr: Les volumes de blocs appartiennent à une instance et à une zone de disponibilité ; servir les photos depuis ces volumes impose de gérer soi-même la capacité, la réplication et la diffusion web.
    e:
      en: Instance store is temporary storage local to each instance; it is not shared and its data is lost when the instance stops or terminates.
      fr: Le stockage d'instance est un stockage temporaire local à chaque instance ; il n'est pas partagé et ses données sont perdues à l'arrêt ou à la résiliation de l'instance.
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
  - title: Attach an EBS volume to multiple EC2 instances using Multi-Attach
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html
