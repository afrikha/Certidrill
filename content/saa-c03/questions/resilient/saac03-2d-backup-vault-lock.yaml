id: saac03-2d-backup-vault-lock
objective: "2.2.17"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company protects its production workloads with AWS Backup. After a ransomware attack at a partner, the company wants its recovery points to be impossible to delete before their 30-day retention ends, even by the root user of the production account or by an attacker who obtains administrator credentials in that account. A copy of each recovery point must also exist outside the production account.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise protège ses charges de travail de production avec AWS Backup. Après une attaque par rançongiciel chez un partenaire, l'entreprise veut que ses points de récupération ne puissent pas être supprimés avant la fin de leur conservation de 30 jours, même par l'utilisateur racine du compte de production ou par un attaquant qui obtient des informations d'identification d'administrateur dans ce compte. Une copie de chaque point de récupération doit aussi exister en dehors du compte de production.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply AWS Backup Vault Lock in governance mode, with a 30-day minimum retention, to the backup vaults.", fr: "Appliquer AWS Backup Vault Lock en mode gouvernance, avec une conservation minimale de 30 jours, aux coffres-forts de sauvegarde." } }
    - { id: b, text: { en: "Encrypt the backup vaults with a customer managed AWS KMS key that has automatic key rotation enabled.", fr: "Chiffrer les coffres-forts de sauvegarde avec une clé AWS KMS gérée par le client dont la rotation automatique est activée." } }
    - { id: c, text: { en: "Apply AWS Backup Vault Lock in compliance mode, with a 30-day minimum retention, to the backup vaults.", fr: "Appliquer AWS Backup Vault Lock en mode conformité, avec une conservation minimale de 30 jours, aux coffres-forts de sauvegarde." } }
    - { id: d, text: { en: "Add a copy action to the backup plan rules that copies each recovery point to a backup vault in another account of the organization.", fr: "Ajouter aux règles du plan de sauvegarde une action de copie de chaque point de récupération vers un coffre-fort de sauvegarde d'un autre compte de l'organisation." } }
    - { id: e, text: { en: "Enable S3 Versioning and MFA delete on the bucket in which AWS Backup stores the recovery points.", fr: "Activer S3 Versioning et MFA delete sur le compartiment dans lequel AWS Backup stocke les points de récupération." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      In compliance mode, once the grace time (at least 3 days) has expired, Vault Lock cannot be changed or removed by any user, including the root user, or by AWS, and recovery points cannot be deleted before their retention ends. A copy action to a vault in another account of the organization keeps a second copy outside the production account, so compromised credentials in that account cannot reach it.
    fr: |
      En mode conformité, une fois le délai de grâce (au moins 3 jours) expiré, Vault Lock ne peut plus être modifié ni supprimé par aucun utilisateur, y compris l'utilisateur racine, ni par AWS, et les points de récupération ne peuvent pas être supprimés avant la fin de leur conservation. Une action de copie vers un coffre-fort d'un autre compte de l'organisation conserve une seconde copie hors du compte de production, hors d'atteinte d'informations d'identification compromises dans ce compte.
  options:
    a: { en: "In governance mode, users with sufficient IAM permissions can remove the lock, so an administrator or an attacker with administrator credentials could still delete backups.", fr: "En mode gouvernance, les utilisateurs disposant d'autorisations IAM suffisantes peuvent retirer le verrou : un administrateur ou un attaquant muni d'informations d'identification d'administrateur pourrait encore supprimer les sauvegardes." }
    b: { en: "Encryption and key rotation protect the confidentiality of backups; they do not prevent anyone from deleting them.", fr: "Le chiffrement et la rotation des clés protègent la confidentialité des sauvegardes ; ils n'empêchent personne de les supprimer." }
    e: { en: "AWS Backup stores recovery points in backup vaults, not in a bucket that the customer manages, so there is no bucket on which to set these options.", fr: "AWS Backup stocke les points de récupération dans des coffres-forts de sauvegarde, pas dans un compartiment géré par le client : il n'y a aucun compartiment sur lequel définir ces options." }
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
  - title: Managing AWS Backup resources across multiple AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
