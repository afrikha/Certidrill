id: saac03-2c-public-subnet-igw-route
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company launched Amazon EC2 web servers that have public IPv4 addresses in a new subnet of a VPC. An internet gateway is attached to the VPC. Users cannot reach the web servers from the internet. The security groups and network ACLs allow inbound HTTPS. The subnet's route table contains only the local route.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a lancé des serveurs web Amazon EC2 dotés d'adresses IPv4 publiques dans un nouveau sous-réseau d'un VPC. Une passerelle Internet est attachée au VPC. Les utilisateurs ne peuvent pas atteindre les serveurs web depuis Internet. Les groupes de sécurité et les listes ACL réseau autorisent le trafic HTTPS entrant. La table de routage du sous-réseau ne contient que la route locale.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a NAT gateway in the subnet and add a 0.0.0.0/0 route that targets the NAT gateway to the subnet's route table."
        fr: "Créer une passerelle NAT dans le sous-réseau et ajouter à la table de routage du sous-réseau une route 0.0.0.0/0 qui cible la passerelle NAT."
    - id: b
      text:
        en: "Add a route for the VPC CIDR block that targets the internet gateway to the subnet's route table."
        fr: "Ajouter à la table de routage du sous-réseau une route pour le bloc CIDR du VPC qui cible la passerelle Internet."
    - id: c
      text:
        en: "Add a 0.0.0.0/0 route that targets the internet gateway to the subnet's route table."
        fr: "Ajouter à la table de routage du sous-réseau une route 0.0.0.0/0 qui cible la passerelle Internet."
    - id: d
      text:
        en: "Create an egress-only internet gateway and add a ::/0 route that targets it to the subnet's route table."
        fr: "Créer une passerelle Internet de sortie uniquement et ajouter à la table de routage du sous-réseau une route ::/0 qui la cible."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A subnet is public only when its route table has a route to an internet gateway. Adding 0.0.0.0/0 with the internet gateway as target sends internet-bound traffic, including the responses to users, through the gateway, which performs one-to-one NAT for the instances' public IPv4 addresses.
    fr: |
      Un sous-réseau n'est public que si sa table de routage contient une route vers une passerelle Internet. Ajouter 0.0.0.0/0 avec la passerelle Internet comme cible envoie le trafic destiné à Internet, y compris les réponses aux utilisateurs, via la passerelle, qui effectue une traduction d'adresses un-à-un pour les adresses IPv4 publiques des instances.
  options:
    a:
      en: |
        A NAT gateway lets instances initiate outbound connections but blocks connections initiated from the internet, so users still cannot reach the servers.
      fr: |
        Une passerelle NAT permet aux instances d'initier des connexions sortantes, mais bloque les connexions initiées depuis Internet : les utilisateurs ne peuvent toujours pas atteindre les serveurs.
    b:
      en: |
        Traffic to the VPC CIDR block is already handled by the local route; internet users' addresses are outside that range and would still have no route.
      fr: |
        Le trafic vers le bloc CIDR du VPC est déjà géré par la route locale ; les adresses des utilisateurs d'Internet sont hors de cette plage et n'auraient toujours pas de route.
    d:
      en: |
        An egress-only internet gateway handles outbound IPv6 traffic only and blocks inbound connections; the servers use IPv4.
      fr: |
        Une passerelle Internet de sortie uniquement ne gère que le trafic IPv6 sortant et bloque les connexions entrantes ; les serveurs utilisent IPv4.
references:
  - title: Enable internet access for a VPC using an internet gateway
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html
