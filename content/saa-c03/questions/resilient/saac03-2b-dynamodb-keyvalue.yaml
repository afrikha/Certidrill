id: saac03-2b-dynamodb-keyvalue
objective: "2.1.22"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company needs a database for player profiles and game state. The data is always accessed by player ID, its attributes change often, and the database must deliver consistent single-digit millisecond latency for millions of players. The company does not want to manage servers or plan capacity in advance.

    Which database service should the company use?
  fr: |
    Une société de jeux vidéo a besoin d'une base de données pour les profils de joueurs et l'état des parties. Les données sont toujours consultées par ID de joueur, leurs attributs changent souvent, et la base de données doit offrir une latence constante de l'ordre de quelques millisecondes pour des millions de joueurs. L'entreprise ne veut ni gérer de serveurs ni planifier la capacité à l'avance.

    Quel service de base de données l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon DynamoDB with on-demand capacity mode", fr: "Amazon DynamoDB en mode de capacité à la demande" }
    - id: b
      text: { en: "Amazon RDS for MySQL with read replicas", fr: "Amazon RDS for MySQL avec des réplicas en lecture" }
    - id: c
      text: { en: "Amazon Redshift with a provisioned cluster", fr: "Amazon Redshift avec un cluster provisionné" }
    - id: d
      text: { en: "Amazon Neptune with Neptune Replicas", fr: "Amazon Neptune avec des réplicas Neptune" }
answer: { optionId: a }
explanation:
  correct:
    en: DynamoDB is a serverless NoSQL key-value and document database built for consistent single-digit millisecond performance at any scale. Items accessed by a partition key such as the player ID fit its model, flexible attributes need no schema change, and on-demand mode scales automatically without capacity planning.
    fr: DynamoDB est une base de données NoSQL clé-valeur et documents sans serveur, conçue pour des performances constantes de l'ordre de quelques millisecondes à n'importe quelle échelle. Des éléments consultés par une clé de partition comme l'ID du joueur correspondent à son modèle, des attributs flexibles ne nécessitent aucun changement de schéma, et le mode à la demande se met à l'échelle automatiquement sans planification de capacité.
  options:
    b:
      en: RDS requires choosing and managing instance sizes and a fixed relational schema; read replicas do not scale writes.
      fr: RDS impose de choisir et de gérer des tailles d'instance et un schéma relationnel fixe ; les réplicas en lecture ne mettent pas les écritures à l'échelle.
    c:
      en: Redshift is a data warehouse for analytical queries, not a low-latency store for individual player records.
      fr: Redshift est un entrepôt de données pour les requêtes analytiques, pas un magasin à faible latence pour des enregistrements de joueurs individuels.
    d:
      en: Neptune is a graph database for highly connected data; simple lookups by player ID do not need graph traversals.
      fr: Neptune est une base de données orientée graphe pour des données fortement connectées ; de simples recherches par ID de joueur n'ont pas besoin de parcours de graphe.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
