id: saac03-2c-lambda-reserved-concurrency
objective: "2.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has two AWS Lambda functions in the same account and Region. One is a customer-facing checkout function. The other is a nightly batch function that processes files uploaded to Amazon S3. When the batch runs, it scales up and uses most of the account's concurrency, and the checkout invocations are throttled. The checkout function must always have capacity for 300 concurrent executions, and the batch function must be capped so that it cannot starve other functions. The solution must not add cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de deux fonctions AWS Lambda dans le même compte et la même Région. L'une est une fonction de paiement destinée aux clients. L'autre est une fonction de traitement par lots nocturne qui traite les fichiers chargés dans Amazon S3. Lorsque le traitement par lots s'exécute, il monte en charge et utilise l'essentiel de la concurrence du compte, et les appels de la fonction de paiement sont limités. La fonction de paiement doit toujours disposer d'une capacité de 300 exécutions simultanées, et la fonction de traitement par lots doit être plafonnée pour ne pas priver les autres fonctions de capacité. La solution ne doit pas ajouter de coût.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Configure reserved concurrency of 300 on the checkout function and a lower reserved concurrency on the batch function."
        fr: "Configurer une concurrence réservée de 300 sur la fonction de paiement et une concurrence réservée plus faible sur la fonction de traitement par lots."
    - id: b
      text:
        en: "Configure provisioned concurrency of 300 on the checkout function and leave the batch function unchanged."
        fr: "Configurer une concurrence provisionnée de 300 sur la fonction de paiement et laisser la fonction de traitement par lots inchangée."
    - id: c
      text:
        en: "Request an increase of the account's concurrent executions quota and leave both functions without reserved concurrency."
        fr: "Demander une augmentation du quota d'exécutions simultanées du compte et laisser les deux fonctions sans concurrence réservée."
    - id: d
      text:
        en: "Increase the memory of the batch function so that each invocation finishes faster and uses less concurrency."
        fr: "Augmenter la mémoire de la fonction de traitement par lots afin que chaque appel se termine plus vite et utilise moins de concurrence."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Reserved concurrency sets both the maximum and the minimum concurrency of a function: no other function can use the reserved units, and the function cannot scale beyond them. Reserving 300 for checkout guarantees its capacity, and a reservation on the batch function caps it; reserved concurrency incurs no additional charge.
    fr: |
      La concurrence réservée fixe à la fois la concurrence maximale et minimale d'une fonction : aucune autre fonction ne peut utiliser les unités réservées, et la fonction ne peut pas les dépasser. Réserver 300 pour la fonction de paiement garantit sa capacité, et une réservation sur la fonction de traitement par lots la plafonne ; la concurrence réservée n'entraîne aucun coût supplémentaire.
  options:
    b:
      en: |
        Provisioned concurrency is billed, and without a cap the batch function can still consume the rest of the account's concurrency.
      fr: |
        La concurrence provisionnée est facturée, et sans plafond la fonction de traitement par lots peut toujours consommer le reste de la concurrence du compte.
    c:
      en: |
        A higher quota is still shared; the batch function can scale into it, so checkout capacity is not guaranteed and the batch function is not capped.
      fr: |
        Un quota plus élevé reste partagé ; la fonction de traitement par lots peut l'occuper, donc la capacité de paiement n'est pas garantie et le traitement par lots n'est pas plafonné.
    d:
      en: |
        Shorter invocations may reduce concurrency, but nothing guarantees 300 units for checkout or caps the batch function, and more memory costs more.
      fr: |
        Des appels plus courts peuvent réduire la concurrence, mais rien ne garantit 300 unités au paiement ni ne plafonne le traitement par lots, et plus de mémoire coûte plus cher.
references:
  - title: Configuring reserved concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-concurrency.html
