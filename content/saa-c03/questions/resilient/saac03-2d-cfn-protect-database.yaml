id: saac03-2d-cfn-protect-database
objective: "2.2.13"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company manages a production Amazon RDS for PostgreSQL DB instance and its application resources in one AWS CloudFormation stack. During a cleanup of test environments, an engineer almost deleted the production stack.

    The company now requires that any attempt to delete the stack fails until someone deliberately turns the protection off. If the stack is eventually deleted, the DB instance must keep running with its data.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise gère une instance de base de données Amazon RDS for PostgreSQL de production et les ressources de son application dans une même pile AWS CloudFormation. Lors d'un nettoyage des environnements de test, un ingénieur a failli supprimer la pile de production.

    L'entreprise exige désormais que toute tentative de suppression de la pile échoue tant que quelqu'un n'a pas délibérément désactivé la protection. Si la pile est finalement supprimée, l'instance de base de données doit continuer à s'exécuter avec ses données.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the DeletionPolicy attribute of the DB instance resource to Snapshot.", fr: "Définir l'attribut DeletionPolicy de la ressource d'instance de base de données sur Snapshot." } }
    - { id: b, text: { en: "Enable termination protection on the stack.", fr: "Activer la protection contre la résiliation sur la pile." } }
    - { id: c, text: { en: "Apply a stack policy that denies Update:Delete on the DB instance resource.", fr: "Appliquer une politique de pile qui refuse Update:Delete sur la ressource d'instance de base de données." } }
    - { id: d, text: { en: "Schedule drift detection on the stack every hour.", fr: "Planifier la détection de dérive sur la pile toutes les heures." } }
    - { id: e, text: { en: "Set the DeletionPolicy attribute of the DB instance resource to Retain.", fr: "Définir l'attribut DeletionPolicy de la ressource d'instance de base de données sur Retain." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Termination protection, disabled by default, makes a stack deletion fail until a user with the right permission disables it. DeletionPolicy Retain tells CloudFormation to keep the resource when the stack is deleted, so the DB instance continues to run with its data and is simply no longer managed by the stack.
    fr: |
      La protection contre la résiliation, désactivée par défaut, fait échouer la suppression d'une pile tant qu'un utilisateur disposant de l'autorisation adéquate ne la désactive pas. DeletionPolicy Retain indique à CloudFormation de conserver la ressource lorsque la pile est supprimée : l'instance de base de données continue de s'exécuter avec ses données et n'est simplement plus gérée par la pile.
  options:
    a: { en: "Snapshot takes a final snapshot and then deletes the DB instance, so the database stops running; the data must be restored to a new instance.", fr: "Snapshot crée un instantané final puis supprime l'instance de base de données : la base cesse de s'exécuter et les données doivent être restaurées dans une nouvelle instance." }
    c: { en: "A stack policy applies only during stack updates; it does not prevent the deletion of the whole stack.", fr: "Une politique de pile ne s'applique que pendant les mises à jour de la pile ; elle n'empêche pas la suppression de la pile entière." }
    d: { en: "Drift detection reports configuration differences; it neither blocks a deletion nor keeps the database.", fr: "La détection de dérive signale des écarts de configuration ; elle ne bloque pas une suppression et ne conserve pas la base de données." }
references:
  - title: Protect CloudFormation stacks from being deleted
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-protect-stacks.html
  - title: DeletionPolicy attribute
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-attribute-deletionpolicy.html
