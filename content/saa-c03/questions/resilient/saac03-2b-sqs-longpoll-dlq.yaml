id: saac03-2b-sqs-longpoll-dlq
objective: "2.1.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs consumers on Amazon EC2 instances that poll an Amazon SQS standard queue with the default settings. The queue is often empty, and the company pays for a large number of ReceiveMessage requests that return no messages. Some malformed messages fail processing every time and are retried until they expire after 4 days. The company wants to reduce the number of empty responses and to move a message aside for analysis after five failed processing attempts.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute sur des instances Amazon EC2 des consommateurs qui interrogent une file d'attente standard Amazon SQS configurée avec les paramètres par défaut. La file d'attente est souvent vide, et l'entreprise paie un grand nombre de requêtes ReceiveMessage qui ne renvoient aucun message. Certains messages mal formés échouent à chaque traitement et sont retentés jusqu'à leur expiration après 4 jours. L'entreprise veut réduire le nombre de réponses vides et mettre un message de côté pour analyse après cinq tentatives de traitement échouées.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Set the DelaySeconds attribute of the queue to 15 minutes.", fr: "Définir l'attribut DelaySeconds de la file d'attente sur 15 minutes." }
    - id: b
      text: { en: "Set the ReceiveMessageWaitTimeSeconds attribute of the queue to 20 seconds.", fr: "Définir l'attribut ReceiveMessageWaitTimeSeconds de la file d'attente sur 20 secondes." }
    - id: c
      text: { en: "Reduce the visibility timeout of the queue to 0 seconds.", fr: "Réduire le délai de visibilité de la file d'attente à 0 seconde." }
    - id: d
      text: { en: "Increase the message retention period of the queue to 14 days.", fr: "Augmenter la période de conservation des messages de la file d'attente à 14 jours." }
    - id: e
      text: { en: "Create a second queue, and configure a redrive policy on the source queue that uses it as a dead-letter queue with maxReceiveCount set to 5.", fr: "Créer une deuxième file d'attente et configurer sur la file source une politique de redirection qui l'utilise comme file d'attente de lettres mortes avec maxReceiveCount défini sur 5." }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: A ReceiveMessageWaitTimeSeconds value greater than 0 turns on long polling (20 seconds is the maximum), so SQS waits for a message instead of returning empty responses, which reduces billed requests. A redrive policy with maxReceiveCount 5 moves a message to the dead-letter queue after five receives without deletion, so the malformed messages can be analyzed instead of being retried until they expire.
    fr: Une valeur de ReceiveMessageWaitTimeSeconds supérieure à 0 active l'interrogation longue (20 secondes au maximum) ; SQS attend alors un message au lieu de renvoyer des réponses vides, ce qui réduit les requêtes facturées. Une politique de redirection avec maxReceiveCount égal à 5 déplace un message vers la file d'attente de lettres mortes après cinq réceptions sans suppression, ce qui permet d'analyser les messages mal formés au lieu de les retenter jusqu'à leur expiration.
  options:
    a:
      en: A delay postpones the delivery of new messages; it does not reduce empty responses and does not isolate failing messages.
      fr: Un délai retarde la remise des nouveaux messages ; il ne réduit pas les réponses vides et n'isole pas les messages en échec.
    c:
      en: A visibility timeout of 0 makes received messages visible to other consumers immediately, which causes duplicate processing and isolates nothing.
      fr: Un délai de visibilité de 0 rend les messages reçus immédiatement visibles pour les autres consommateurs, ce qui provoque des traitements en double et n'isole rien.
    d:
      en: A longer retention period keeps the failing messages in the queue even longer, which makes the retry problem worse.
      fr: Une période de conservation plus longue garde les messages en échec encore plus longtemps dans la file d'attente, ce qui aggrave le problème des tentatives répétées.
references:
  - title: Amazon SQS short and long polling
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-short-and-long-polling.html
  - title: Using dead-letter queues in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
