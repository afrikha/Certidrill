id: saac03-2a-alb-path-routing
objective: "2.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs two microservices on Amazon ECS. Requests for /orders/* must go to the order microservice, and requests for /catalog/* must go to the catalog microservice. Clients must use a single HTTPS endpoint, and each microservice must scale independently.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute deux microservices sur Amazon ECS. Les requêtes vers /orders/* doivent aller au microservice de commandes, et les requêtes vers /catalog/* au microservice de catalogue. Les clients doivent utiliser un point de terminaison HTTPS unique, et chaque microservice doit se mettre à l'échelle de façon indépendante.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a Network Load Balancer with one TCP listener on a different port for each microservice and one target group per port.", fr: "Créer un Network Load Balancer avec un écouteur TCP sur un port différent pour chaque microservice et un groupe cible par port." }
    - id: b
      text: { en: "Create an Application Load Balancer with an HTTPS listener and path-pattern rules that forward to one target group per microservice.", fr: "Créer un Application Load Balancer avec un écouteur HTTPS et des règles path-pattern qui transfèrent vers un groupe cible par microservice." }
    - id: c
      text: { en: "Create a Gateway Load Balancer, and register the tasks of both microservices in one target group behind its listener.", fr: "Créer un Gateway Load Balancer, et enregistrer les tâches des deux microservices dans un groupe cible derrière son écouteur." }
    - id: d
      text: { en: "Create two Amazon Route 53 weighted records, one for each microservice, that point to the tasks of that microservice.", fr: "Créer deux enregistrements pondérés Amazon Route 53, un par microservice, qui pointent vers les tâches de ce microservice." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Application Load Balancer works at the HTTP layer, and its listener rules can match a path-pattern condition and forward each path to its own target group. Each ECS service registers in its target group and scales on its own, behind a single HTTPS endpoint.
    fr: |
      Un Application Load Balancer fonctionne au niveau HTTP, et les règles de son écouteur peuvent tester une condition path-pattern et transférer chaque chemin vers son propre groupe cible. Chaque service ECS s'enregistre dans son groupe cible et se met à l'échelle seul, derrière un point de terminaison HTTPS unique.
  options:
    a: { en: "A Network Load Balancer works at layer 4 and cannot read URL paths; separate ports also break the single endpoint requirement.", fr: "Un Network Load Balancer fonctionne en couche 4 et ne peut pas lire les chemins d'URL ; des ports distincts enfreignent aussi l'exigence de point de terminaison unique." }
    c: { en: "A Gateway Load Balancer distributes IP traffic to virtual appliances such as firewalls; it does not route HTTP requests by path.", fr: "Un Gateway Load Balancer distribue du trafic IP vers des appliances virtuelles comme des pare-feu ; il ne route pas les requêtes HTTP selon le chemin." }
    d: { en: "DNS resolves host names, not URL paths, so weighted records cannot send /orders and /catalog to different services.", fr: "Le DNS résout des noms d'hôte, pas des chemins d'URL : des enregistrements pondérés ne peuvent pas envoyer /orders et /catalog vers des services différents." }
references:
  - title: Condition types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-condition-types.html
