id: saac03-2b-sfn-callback-approval
objective: "2.1.16"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company automates expense reimbursements with AWS Step Functions. When an expense is above a threshold, a manager must approve or reject it by choosing a link in an email. Managers sometimes take up to 5 days to respond. The workflow must pause without running any compute while it waits, and then continue on the approved or rejected path.

    Which solution will meet these requirements?
  fr: |
    Une entreprise automatise les remboursements de frais avec AWS Step Functions. Lorsqu'une dépense dépasse un seuil, un responsable doit l'approuver ou la rejeter en choisissant un lien dans un e-mail. Les responsables mettent parfois jusqu'à 5 jours à répondre. Le flux de travail doit se mettre en pause sans exécuter de calcul pendant l'attente, puis continuer sur la branche approuvée ou rejetée.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a Standard workflow with a .waitForTaskToken task that sends the task token in the email, and have the link call SendTaskSuccess or SendTaskFailure.", fr: "Utiliser un flux de travail Standard avec une tâche .waitForTaskToken qui envoie le jeton de tâche dans l'e-mail, et faire appeler SendTaskSuccess ou SendTaskFailure par le lien." }
    - id: b
      text: { en: "Use an Express workflow with a .waitForTaskToken task that sends the task token in the email, and have the link call SendTaskSuccess or SendTaskFailure.", fr: "Utiliser un flux de travail Express avec une tâche .waitForTaskToken qui envoie le jeton de tâche dans l'e-mail, et faire appeler SendTaskSuccess ou SendTaskFailure par le lien." }
    - id: c
      text: { en: "Use a Standard workflow that invokes an AWS Lambda function, which polls an Amazon DynamoDB table every minute until the decision is recorded.", fr: "Utiliser un flux de travail Standard qui appelle une fonction AWS Lambda interrogeant une table Amazon DynamoDB chaque minute jusqu'à l'enregistrement de la décision." }
    - id: d
      text: { en: "Use a Standard workflow that sends the request to an Amazon SQS delay queue, and read the decision when the message becomes visible.", fr: "Utiliser un flux de travail Standard qui envoie la demande dans une file d'attente à délai Amazon SQS, et lire la décision lorsque le message devient visible." }
answer: { optionId: a }
explanation:
  correct:
    en: The Wait for Callback pattern (.waitForTaskToken) pauses the task until an external process returns the task token with SendTaskSuccess or SendTaskFailure, and human approval is a typical use case. A Standard workflow can wait for up to one year, so a 5-day wait is supported, and no compute runs while the execution is paused.
    fr: Le modèle d'attente de rappel (.waitForTaskToken) met la tâche en pause jusqu'à ce qu'un processus externe renvoie le jeton de tâche avec SendTaskSuccess ou SendTaskFailure, et l'approbation humaine en est un cas d'usage typique. Un flux de travail Standard peut attendre jusqu'à un an ; une attente de 5 jours est donc prise en charge, et aucun calcul ne s'exécute pendant la pause.
  options:
    b:
      en: Express workflows run for at most 5 minutes and do not support the .waitForTaskToken callback pattern.
      fr: Les flux de travail Express durent au plus 5 minutes et ne prennent pas en charge le modèle de rappel .waitForTaskToken.
    c:
      en: A Lambda function runs for at most 15 minutes and consumes compute while it polls, which violates the requirement.
      fr: Une fonction Lambda s'exécute au plus 15 minutes et consomme du calcul pendant qu'elle interroge la table, ce qui enfreint l'exigence.
    d:
      en: An SQS delay lasts at most 15 minutes and only postpones delivery; it does not wait for the manager's decision.
      fr: Un délai SQS dure au plus 15 minutes et ne fait que retarder la remise ; il n'attend pas la décision du responsable.
references:
  - title: Discover service integration patterns in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/connect-to-resource.html
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
