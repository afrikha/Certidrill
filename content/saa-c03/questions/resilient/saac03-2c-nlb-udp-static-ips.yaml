id: saac03-2c-nlb-udp-static-ips
objective: "2.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company runs multiplayer game servers that use a custom UDP protocol on Amazon EC2 instances in two Availability Zones. The firewalls of business customers allow only a fixed set of IP addresses, so the game endpoint must have one static IP address in each Availability Zone. The load balancer must distribute the UDP traffic to healthy instances only.

    Which solution will meet these requirements?
  fr: |
    Une société de jeux vidéo exécute des serveurs de jeu multijoueur qui utilisent un protocole UDP personnalisé sur des instances Amazon EC2 dans deux zones de disponibilité. Les pare-feu des clients professionnels n'autorisent qu'un ensemble fixe d'adresses IP : le point de terminaison du jeu doit donc avoir une adresse IP statique dans chaque zone de disponibilité. L'équilibreur de charge doit distribuer le trafic UDP uniquement vers les instances saines.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Application Load Balancer with an HTTP listener, and associate an Elastic IP address with each of its subnets."
        fr: "Créer un Application Load Balancer avec un écouteur HTTP, et associer une adresse IP Elastic à chacun de ses sous-réseaux."
    - id: b
      text:
        en: "Create an Amazon CloudFront distribution that uses the EC2 instances as custom origins."
        fr: "Créer une distribution Amazon CloudFront qui utilise les instances EC2 comme origines personnalisées."
    - id: c
      text:
        en: "Create a Network Load Balancer with a UDP listener, and associate an Elastic IP address with each of its subnets."
        fr: "Créer un Network Load Balancer avec un écouteur UDP, et associer une adresse IP Elastic à chacun de ses sous-réseaux."
    - id: d
      text:
        en: "Create a Gateway Load Balancer, and register the EC2 instances in a GENEVE target group."
        fr: "Créer un Gateway Load Balancer, et enregistrer les instances EC2 dans un groupe cible GENEVE."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Network Load Balancer operates at layer 4 and supports UDP listeners and target groups. It has a static IP address in each enabled Availability Zone, and an internet-facing NLB can use one Elastic IP address per subnet; it routes traffic only to healthy targets.
    fr: |
      Un Network Load Balancer fonctionne à la couche 4 et prend en charge les écouteurs et groupes cibles UDP. Il dispose d'une adresse IP statique dans chaque zone de disponibilité activée, et un NLB accessible depuis Internet peut utiliser une adresse IP Elastic par sous-réseau ; il ne route le trafic que vers les cibles saines.
  options:
    a:
      en: |
        An Application Load Balancer handles HTTP and HTTPS only and does not support Elastic IP addresses; its IP addresses can change.
      fr: |
        Un Application Load Balancer ne gère que HTTP et HTTPS et ne prend pas en charge les adresses IP Elastic ; ses adresses IP peuvent changer.
    b:
      en: |
        CloudFront delivers HTTP and HTTPS content from edge locations; it does not carry a custom UDP protocol or offer fixed per-zone addresses.
      fr: |
        CloudFront distribue du contenu HTTP et HTTPS depuis des emplacements périphériques ; il ne transporte pas un protocole UDP personnalisé et n'offre pas d'adresses fixes par zone.
    d:
      en: |
        A Gateway Load Balancer sends traffic to inline virtual appliances such as firewalls over GENEVE; it is not an endpoint for game clients.
      fr: |
        Un Gateway Load Balancer envoie le trafic vers des appliances virtuelles en ligne comme des pare-feu via GENEVE ; ce n'est pas un point de terminaison pour les clients du jeu.
references:
  - title: What is a Network Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
