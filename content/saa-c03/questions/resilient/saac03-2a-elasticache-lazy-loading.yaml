id: saac03-2a-elasticache-lazy-loading
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news website runs on Amazon EC2 instances and stores articles in an Amazon RDS for PostgreSQL database. The same article queries run thousands of times each minute, and the database CPU utilization is high. The company wants sub-millisecond read latency for these queries and less load on the database. Article data can be a few minutes out of date.

    Which solution will meet these requirements?
  fr: |
    Un site d'actualités s'exécute sur des instances Amazon EC2 et stocke ses articles dans une base de données Amazon RDS for PostgreSQL. Les mêmes requêtes d'articles s'exécutent des milliers de fois par minute, et l'utilisation du processeur de la base de données est élevée. L'entreprise veut une latence de lecture inférieure à la milliseconde pour ces requêtes et une charge réduite sur la base de données. Les données des articles peuvent avoir quelques minutes de retard.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Convert the database to a Multi-AZ DB instance deployment with a standby instance in a second Availability Zone.", fr: "Convertir la base de données en déploiement d'instance de base de données Multi-AZ avec une instance de secours dans une deuxième zone de disponibilité." }
    - id: b
      text: { en: "Modify the DB instance to a larger instance class with more vCPUs and memory, and increase its allocated storage.", fr: "Passer l'instance de base de données à une classe d'instance plus grande avec plus de processeurs virtuels et de mémoire, et augmenter son stockage alloué." }
    - id: c
      text: { en: "Add an Amazon ElastiCache cache, and have the application cache query results with a TTL after each cache miss.", fr: "Ajouter un cache Amazon ElastiCache, et faire mettre en cache par l'application les résultats des requêtes avec une durée de vie (TTL) après chaque échec d'accès au cache." }
    - id: d
      text: { en: "Create two RDS read replicas in the same Region, and send the article queries to the replicas through their endpoints.", fr: "Créer deux réplicas en lecture RDS dans la même Région, et envoyer les requêtes d'articles aux réplicas via leurs points de terminaison." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An in-memory ElastiCache cache returns repeated query results with sub-millisecond latency. With lazy loading, only requested data is cached, and the TTL bounds how stale an article can become; cache hits no longer reach the database, which lowers its CPU load.
    fr: |
      Un cache en mémoire ElastiCache renvoie les résultats de requêtes répétées avec une latence inférieure à la milliseconde. Avec le chargement différé (lazy loading), seules les données demandées sont mises en cache, et la durée de vie limite l'ancienneté d'un article ; les accès réussis au cache n'atteignent plus la base de données, ce qui réduit sa charge processeur.
  options:
    a: { en: "Multi-AZ adds a standby for availability; the standby does not serve reads, so neither latency nor load improves.", fr: "Multi-AZ ajoute une instance de secours pour la disponibilité ; elle ne sert pas les lectures : ni la latence ni la charge ne s'améliorent." }
    b: { en: "A larger instance class adds capacity, but disk-backed database queries still take milliseconds, not sub-millisecond time.", fr: "Une classe d'instance plus grande ajoute de la capacité, mais les requêtes sur une base de données adossée à des disques prennent toujours des millisecondes, pas moins d'une milliseconde." }
    d: { en: "Read replicas spread the read load, but each query still runs on a database engine, so latency stays in milliseconds.", fr: "Les réplicas en lecture répartissent la charge de lecture, mais chaque requête s'exécute toujours sur un moteur de base de données : la latence reste de l'ordre de la milliseconde." }
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
