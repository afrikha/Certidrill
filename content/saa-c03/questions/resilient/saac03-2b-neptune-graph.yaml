id: saac03-2b-neptune-graph
objective: "2.1.22"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A bank wants to detect fraud rings by analyzing the relationships between customers, accounts, devices, and transactions. Queries must traverse many levels of connections, for example to find accounts that share a device with an account that received a flagged transfer, and must return results in milliseconds.

    Which database service is the BEST fit for this workload?
  fr: |
    Une banque veut détecter des réseaux de fraude en analysant les relations entre clients, comptes, appareils et transactions. Les requêtes doivent parcourir de nombreux niveaux de connexions, par exemple pour trouver les comptes qui partagent un appareil avec un compte ayant reçu un virement signalé, et doivent renvoyer des résultats en quelques millisecondes.

    Quel service de base de données est le MIEUX adapté à cette charge de travail ?
body:
  options:
    - id: a
      text: { en: "Amazon DynamoDB", fr: "Amazon DynamoDB" }
    - id: b
      text: { en: "Amazon RDS for PostgreSQL", fr: "Amazon RDS for PostgreSQL" }
    - id: c
      text: { en: "Amazon Neptune", fr: "Amazon Neptune" }
    - id: d
      text: { en: "Amazon Keyspaces (for Apache Cassandra)", fr: "Amazon Keyspaces (for Apache Cassandra)" }
answer: { optionId: c }
explanation:
  correct:
    en: Neptune is a managed graph database built to store billions of relationships and query them with millisecond latency, using Gremlin, openCypher, or SPARQL. Fraud detection is one of its documented use cases, because multi-hop traversals are what graph databases do efficiently.
    fr: Neptune est une base de données orientée graphe gérée, conçue pour stocker des milliards de relations et les interroger avec une latence de l'ordre de la milliseconde, en Gremlin, openCypher ou SPARQL. La détection de fraude fait partie de ses cas d'usage documentés, car les parcours à plusieurs sauts sont précisément ce qu'une base orientée graphe exécute efficacement.
  options:
    a:
      en: DynamoDB excels at key-value lookups, but it has no joins or graph traversals, so multi-level relationship queries would need many requests and custom code.
      fr: DynamoDB excelle dans les recherches clé-valeur, mais n'offre ni jointures ni parcours de graphe ; des requêtes relationnelles à plusieurs niveaux exigeraient de nombreuses requêtes et du code personnalisé.
    b:
      en: A relational database can model relationships, but deep multi-level traversals require many self-joins that become slow as the depth grows.
      fr: Une base relationnelle peut modéliser des relations, mais des parcours profonds à plusieurs niveaux exigent de nombreuses auto-jointures qui ralentissent avec la profondeur.
    d:
      en: Keyspaces is a wide-column database for high-throughput key-based access; it is not designed for relationship traversals.
      fr: Keyspaces est une base de données à colonnes larges pour des accès par clé à haut débit ; elle n'est pas conçue pour les parcours de relations.
references:
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
