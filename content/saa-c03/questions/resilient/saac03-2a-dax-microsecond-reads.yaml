id: saac03-2a-dax-microsecond-reads
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company stores player profiles in an Amazon DynamoDB table. The workload is read-heavy and uses eventually consistent reads. A new feature needs microsecond read latency for these profiles. The developers want to make the fewest possible changes to the application code.

    Which solution will meet these requirements?
  fr: |
    Une société de jeux vidéo stocke les profils des joueurs dans une table Amazon DynamoDB. La charge de travail est dominée par les lectures et utilise des lectures à cohérence éventuelle. Une nouvelle fonctionnalité exige une latence de lecture de l'ordre de la microseconde pour ces profils. Les développeurs veulent apporter le moins de modifications possible au code de l'application.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an Amazon ElastiCache for Valkey cluster, and add cache-aside logic to every read and write path of the application.", fr: "Déployer un cluster Amazon ElastiCache for Valkey, et ajouter une logique de cache-aside à chaque chemin de lecture et d'écriture de l'application." }
    - id: b
      text: { en: "Deploy a DynamoDB Accelerator (DAX) cluster, and configure the application to use the DAX client with the cluster endpoint.", fr: "Déployer un cluster DynamoDB Accelerator (DAX), et configurer l'application pour qu'elle utilise le client DAX avec le point de terminaison du cluster." }
    - id: c
      text: { en: "Convert the table to a DynamoDB global table with replicas in two additional Regions.", fr: "Convertir la table en table globale DynamoDB avec des réplicas dans deux Régions supplémentaires." }
    - id: d
      text: { en: "Switch the table to provisioned capacity mode, and double its read capacity units.", fr: "Passer la table en mode de capacité provisionnée, et doubler ses unités de capacité de lecture." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      DAX is an in-memory cache for DynamoDB that reduces eventually consistent read latency from single-digit milliseconds to microseconds. It is API-compatible with DynamoDB, so the application only switches to the DAX client and keeps the same calls.
    fr: |
      DAX est un cache en mémoire pour DynamoDB qui fait passer la latence des lectures à cohérence éventuelle de quelques millisecondes à quelques microsecondes. Il est compatible avec l'API DynamoDB : l'application passe simplement au client DAX et conserve les mêmes appels.
  options:
    a: { en: "ElastiCache can also return data in microseconds, but the developers must write and maintain caching logic in the application, which is more code change.", fr: "ElastiCache peut aussi renvoyer des données en quelques microsecondes, mais les développeurs doivent écrire et maintenir la logique de cache dans l'application, ce qui représente davantage de modifications du code." }
    c: { en: "Global tables replicate data to other Regions for multi-Region availability and locality; reads still take milliseconds.", fr: "Les tables globales répliquent les données vers d'autres Régions pour la disponibilité multi-Région et la proximité ; les lectures prennent toujours des millisecondes." }
    d: { en: "More read capacity raises throughput, not latency; DynamoDB reads remain in the millisecond range.", fr: "Davantage de capacité de lecture augmente le débit, pas la latence ; les lectures DynamoDB restent de l'ordre de la milliseconde." }
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
