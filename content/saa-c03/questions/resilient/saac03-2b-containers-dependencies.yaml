id: saac03-2b-containers-dependencies
objective: "2.1.20"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company runs five long-running internal web applications on the same group of Amazon EC2 instances. The applications need different and conflicting versions of the same libraries and language runtimes, and a deployment of one application often breaks another. The company wants each application packaged with its own dependencies so that it runs the same way in development, test, and production, while the applications continue to share the underlying compute.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exécute cinq applications web internes de longue durée sur le même groupe d'instances Amazon EC2. Les applications ont besoin de versions différentes et incompatibles des mêmes bibliothèques et environnements d'exécution, et le déploiement d'une application en casse souvent une autre. L'entreprise veut que chaque application soit empaquetée avec ses propres dépendances pour s'exécuter de la même façon en développement, en test et en production, tout en continuant à partager la capacité de calcul sous-jacente.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Give each application its own dedicated EC2 instances built from a separate AMI.", fr: "Attribuer à chaque application ses propres instances EC2 dédiées créées à partir d'une AMI distincte." }
    - id: b
      text: { en: "Rewrite each application as AWS Lambda functions that share a common Lambda layer.", fr: "Réécrire chaque application sous forme de fonctions AWS Lambda partageant une couche Lambda commune." }
    - id: c
      text: { en: "Install every library version on each instance, and select versions with environment variables.", fr: "Installer toutes les versions des bibliothèques sur chaque instance, et choisir les versions avec des variables d'environnement." }
    - id: d
      text: { en: "Package each application as a container image, and run the images as Amazon ECS services on a shared cluster.", fr: "Empaqueter chaque application sous forme d'image de conteneur, et exécuter les images en tant que services Amazon ECS sur un cluster partagé." }
answer: { optionId: d }
explanation:
  correct:
    en: A container image packages an application with its own libraries and runtime, so the same image runs identically in every environment and does not conflict with other applications on the same host. An ECS cluster runs the containers of all five applications on shared capacity.
    fr: Une image de conteneur empaquette une application avec ses propres bibliothèques et son environnement d'exécution ; la même image s'exécute donc à l'identique dans chaque environnement et n'entre pas en conflit avec les autres applications du même hôte. Un cluster ECS exécute les conteneurs des cinq applications sur une capacité partagée.
  options:
    a:
      en: Separate instances isolate the dependencies but stop sharing compute, which increases cost and does not package the application for every environment.
      fr: Des instances séparées isolent les dépendances mais ne partagent plus le calcul, ce qui augmente le coût et n'empaquette pas l'application pour chaque environnement.
    b:
      en: Rewriting long-running web applications as functions is a major redesign, and a shared layer reintroduces the shared dependencies.
      fr: Réécrire des applications web de longue durée sous forme de fonctions est une refonte majeure, et une couche partagée réintroduit des dépendances communes.
    c:
      en: Side-by-side installations on the hosts remain fragile and environment-specific; they are exactly the problem that packaging removes.
      fr: Des installations côte à côte sur les hôtes restent fragiles et propres à chaque environnement ; c'est précisément le problème que l'empaquetage supprime.
references:
  - title: Amazon ECS services
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_services.html
