id: saac03-2c-rds-proxy-reader-endpoint
objective: "2.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon Aurora PostgreSQL DB cluster with one writer and three Aurora Replicas. A Lambda-based application connects through an RDS Proxy. All reporting queries currently use the proxy's default endpoint, so they run on the writer and slow down transactions. The company wants the read-only reporting queries to be spread across the replicas while keeping connection pooling. When a replica becomes unavailable, connections must move to another replica without DNS caching delays.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un cluster de base de données Amazon Aurora PostgreSQL avec une instance d'écriture et trois Aurora Replicas. Une application fondée sur Lambda se connecte via un RDS Proxy. Toutes les requêtes de rapport utilisent actuellement le point de terminaison par défaut du proxy : elles s'exécutent sur l'instance d'écriture et ralentissent les transactions. L'entreprise souhaite que les requêtes de rapport en lecture seule soient réparties sur les réplicas tout en conservant le pool de connexions. Lorsqu'un réplica devient indisponible, les connexions doivent passer vers un autre réplica sans délai lié au cache DNS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Point the reporting functions directly to the Aurora cluster reader endpoint instead of the proxy."
        fr: "Diriger les fonctions de rapport directement vers le point de terminaison du lecteur du cluster Aurora au lieu du proxy."
    - id: b
      text:
        en: "Modify the proxy's default endpoint so that it becomes a read-only endpoint for the reporting queries."
        fr: "Modifier le point de terminaison par défaut du proxy afin qu'il devienne un point de terminaison en lecture seule pour les requêtes de rapport."
    - id: c
      text:
        en: "Create a read-only endpoint on the existing proxy and send the reporting queries to that endpoint."
        fr: "Créer un point de terminaison en lecture seule sur le proxy existant et envoyer les requêtes de rapport vers ce point de terminaison."
    - id: d
      text:
        en: "Increase the proxy's maximum connections percentage to 100 so that the writer accepts more reporting connections."
        fr: "Porter à 100 le pourcentage maximal de connexions du proxy afin que l'instance d'écriture accepte davantage de connexions de rapport."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A read-only (reader) proxy endpoint routes connections to the reader instances of the Aurora cluster and keeps the proxy's connection pooling. When a reader becomes unavailable, RDS Proxy sends connections only to available readers, with no DNS caching delay, and multiplexed connections move to another reader without interruption.
    fr: |
      Un point de terminaison de proxy en lecture seule (lecteur) route les connexions vers les instances de lecture du cluster Aurora et conserve le pool de connexions du proxy. Lorsqu'un lecteur devient indisponible, RDS Proxy n'envoie les connexions qu'aux lecteurs disponibles, sans délai lié au cache DNS, et les connexions multiplexées passent vers un autre lecteur sans interruption.
  options:
    a:
      en: |
        The cluster reader endpoint spreads reads, but the functions lose connection pooling and depend on DNS to move away from an unavailable replica.
      fr: |
        Le point de terminaison du lecteur du cluster répartit les lectures, mais les fonctions perdent le pool de connexions et dépendent du DNS pour quitter un réplica indisponible.
    b:
      en: |
        The default proxy endpoint cannot be modified; it is always read/write and sends traffic to the writer.
      fr: |
        Le point de terminaison par défaut du proxy ne peut pas être modifié ; il est toujours en lecture/écriture et envoie le trafic vers l'instance d'écriture.
    d:
      en: |
        More connections to the writer increase its load; the reporting queries would still run on the writer.
      fr: |
        Davantage de connexions vers l'instance d'écriture augmentent sa charge ; les requêtes de rapport s'exécuteraient toujours sur elle.
references:
  - title: Working with Amazon RDS Proxy endpoints
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/rds-proxy-endpoints.html
