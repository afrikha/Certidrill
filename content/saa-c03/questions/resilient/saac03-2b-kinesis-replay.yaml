id: saac03-2b-kinesis-replay
objective: "2.1.19"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company collects player clickstream events. Several independent applications (a real-time leaderboard, a fraud detector, and an archiving job) must each read the full stream of events, and events for the same player must be read in the order in which they were produced. After deploying a new model, the fraud team must be able to reprocess the events of the last 3 days.

    Which service should the company use to ingest the events?
  fr: |
    Une société de jeux vidéo collecte les événements de parcours de navigation (clickstream) des joueurs. Plusieurs applications indépendantes (un classement en temps réel, un détecteur de fraude et une tâche d'archivage) doivent chacune lire l'intégralité du flux d'événements, et les événements d'un même joueur doivent être lus dans l'ordre de leur production. Après le déploiement d'un nouveau modèle, l'équipe fraude doit pouvoir retraiter les événements des 3 derniers jours.

    Quel service l'entreprise doit-elle utiliser pour ingérer les événements ?
body:
  options:
    - id: a
      text: { en: "An Amazon SQS FIFO queue that uses the player ID as the message group ID", fr: "Une file d'attente FIFO Amazon SQS qui utilise l'ID du joueur comme ID de groupe de messages" }
    - id: b
      text: { en: "An Amazon SNS standard topic with an Amazon SQS standard queue subscribed for each application", fr: "Une rubrique standard Amazon SNS avec une file d'attente standard Amazon SQS abonnée pour chaque application" }
    - id: c
      text: { en: "An Amazon Kinesis data stream that uses the player ID as the partition key and a 7-day retention period", fr: "Un flux de données Amazon Kinesis qui utilise l'ID du joueur comme clé de partition et une conservation de 7 jours" }
    - id: d
      text: { en: "An Amazon EventBridge custom event bus with a rule that sends the events to each application", fr: "Un bus d'événements personnalisé Amazon EventBridge avec une règle qui envoie les événements à chaque application" }
answer: { optionId: c }
explanation:
  correct:
    en: In Kinesis Data Streams, the partition key maps each record to a shard, and records with the same key are ordered in that shard. Several consumer applications read the same stream independently and concurrently, and records stay in the stream for the retention period (24 hours by default, up to 365 days), so they can be read again after consumption.
    fr: Dans Kinesis Data Streams, la clé de partition associe chaque enregistrement à une partition (shard), et les enregistrements d'une même clé sont ordonnés dans cette partition. Plusieurs applications consommatrices lisent le même flux de manière indépendante et simultanée, et les enregistrements restent dans le flux pendant la période de conservation (24 heures par défaut, jusqu'à 365 jours) ; ils peuvent donc être relus après leur consommation.
  options:
    a:
      en: A FIFO queue keeps order per group, but each message goes to one consumer and is deleted after processing, so the applications cannot all read it or replay it.
      fr: Une file d'attente FIFO conserve l'ordre par groupe, mais chaque message va à un seul consommateur et est supprimé après traitement ; les applications ne peuvent donc pas toutes le lire ni le rejouer.
    b:
      en: Fanout gives each application a copy, but standard topics and queues do not guarantee ordering, and consumed messages are deleted.
      fr: La diffusion donne une copie à chaque application, mais les rubriques et files d'attente standard ne garantissent pas l'ordre, et les messages consommés sont supprimés.
    d:
      en: EventBridge routes events to targets with rules, but it does not provide per-player ordering to several readers of one ordered stream.
      fr: EventBridge achemine les événements vers des cibles avec des règles, mais il n'offre pas d'ordre par joueur à plusieurs lecteurs d'un même flux ordonné.
references:
  - title: Amazon Kinesis Data Streams Terminology and concepts
    url: https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html
  - title: Change the data retention period
    url: https://docs.aws.amazon.com/streams/latest/dev/kinesis-extended-retention.html
