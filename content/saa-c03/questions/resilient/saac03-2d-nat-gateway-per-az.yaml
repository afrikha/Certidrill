id: saac03-2d-nat-gateway-per-az
objective: "2.2.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A VPC has private subnets in three Availability Zones. The route tables of all private subnets send 0.0.0.0/0 to one zonal NAT gateway in a public subnet in Availability Zone A. During an outage of Availability Zone A, the instances in the other two Availability Zones could not reach a third-party payment API on the internet.

    The company wants outbound IPv4 internet access from the private subnets to survive the failure of any single Availability Zone.

    Which solution will meet these requirements?
  fr: |
    Un VPC comporte des sous-réseaux privés dans trois zones de disponibilité. Les tables de routage de tous les sous-réseaux privés envoient 0.0.0.0/0 vers une seule passerelle NAT zonale située dans un sous-réseau public de la zone de disponibilité A. Pendant une panne de la zone de disponibilité A, les instances des deux autres zones de disponibilité n'ont pas pu joindre une API de paiement tierce sur Internet.

    L'entreprise veut que l'accès Internet IPv4 sortant depuis les sous-réseaux privés résiste à la panne de n'importe quelle zone de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a second NAT gateway in Availability Zone A and add it as another target of the 0.0.0.0/0 route in each private route table.", fr: "Créer une deuxième passerelle NAT dans la zone de disponibilité A et l'ajouter comme autre cible de la route 0.0.0.0/0 dans chaque table de routage privée." } }
    - { id: b, text: { en: "Replace the NAT gateway with a NAT instance in an Auto Scaling group that keeps one instance running in Availability Zone A, with the source/destination check disabled.", fr: "Remplacer la passerelle NAT par une instance NAT dans un groupe Auto Scaling qui maintient une instance en fonctionnement dans la zone de disponibilité A, avec la vérification source/destination désactivée." } }
    - { id: c, text: { en: "Add an egress-only internet gateway to the VPC, and update every private route table to send 0.0.0.0/0 to the egress-only internet gateway.", fr: "Ajouter une passerelle Internet de sortie uniquement au VPC, et mettre à jour chaque table de routage privée pour envoyer 0.0.0.0/0 vers cette passerelle." } }
    - { id: d, text: { en: "Create a NAT gateway in each Availability Zone, and give each zone's private subnets a route table that sends 0.0.0.0/0 to the NAT gateway in the same zone.", fr: "Créer une passerelle NAT dans chaque zone de disponibilité, et associer aux sous-réseaux privés de chaque zone une table de routage qui envoie 0.0.0.0/0 vers la passerelle NAT de la même zone." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A zonal NAT gateway is redundant only inside its own Availability Zone, so resources in other zones that share it lose internet access when that zone fails. AWS recommends one NAT gateway per Availability Zone, with per-zone route tables so that each private subnet uses the NAT gateway in its own zone. A regional NAT gateway, which expands automatically to the zones that have workloads, is another way to remove this single point of failure.
    fr: |
      Une passerelle NAT zonale n'est redondante qu'à l'intérieur de sa propre zone de disponibilité : les ressources des autres zones qui la partagent perdent l'accès à Internet lorsque cette zone tombe en panne. AWS recommande une passerelle NAT par zone de disponibilité, avec des tables de routage par zone afin que chaque sous-réseau privé utilise la passerelle NAT de sa propre zone. Une passerelle NAT régionale, qui s'étend automatiquement aux zones qui hébergent des charges de travail, est une autre façon de supprimer ce point de défaillance unique.
  options:
    a: { en: "A route has only one target, and a second NAT gateway in the same Availability Zone would fail with it.", fr: "Une route n'a qu'une seule cible, et une deuxième passerelle NAT dans la même zone de disponibilité tomberait en panne avec elle." }
    b: { en: "The NAT instance still runs in Availability Zone A only, and the company would have to manage and patch it.", fr: "L'instance NAT ne s'exécute toujours que dans la zone de disponibilité A, et l'entreprise devrait la gérer et la corriger." }
    c: { en: "An egress-only internet gateway handles outbound IPv6 traffic only; it cannot provide IPv4 internet access.", fr: "Une passerelle Internet de sortie uniquement ne gère que le trafic IPv6 sortant ; elle ne peut pas fournir d'accès Internet IPv4." }
references:
  - title: NAT gateway basics
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html
  - title: Regional NAT gateways for automatic multi-AZ expansion
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
