id: saac03-2a-apigw-stage-cache
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs a REST API in Amazon API Gateway. A Lambda function behind the API reads hotel availability from an Amazon RDS database. Most requests are identical GET requests, and the returned data can be up to 5 minutes old. During peaks, the database is overloaded. The company wants to reduce the number of calls that reach the backend with the LEAST development effort.

    Which solution will meet these requirements?
  fr: |
    Une agence de voyages exécute une API REST dans Amazon API Gateway. Une fonction Lambda derrière l'API lit la disponibilité des hôtels dans une base de données Amazon RDS. La plupart des requêtes sont des requêtes GET identiques, et les données renvoyées peuvent dater de 5 minutes au plus. Pendant les pics, la base de données est surchargée. L'entreprise veut réduire le nombre d'appels qui atteignent le backend avec le MOINS d'effort de développement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an Amazon ElastiCache cluster, and modify the Lambda function to store query results in the cache.", fr: "Déployer un cluster Amazon ElastiCache, et modifier la fonction Lambda pour qu'elle stocke les résultats des requêtes dans le cache." }
    - id: b
      text: { en: "Create an RDS read replica, and modify the Lambda function to send its queries to the replica.", fr: "Créer un réplica en lecture RDS, et modifier la fonction Lambda pour qu'elle envoie ses requêtes au réplica." }
    - id: c
      text: { en: "Configure reserved concurrency on the Lambda function to limit the number of concurrent database queries.", fr: "Configurer une simultanéité réservée sur la fonction Lambda pour limiter le nombre de requêtes simultanées vers la base de données." }
    - id: d
      text: { en: "Enable API Gateway caching on the production stage with a time-to-live (TTL) of 300 seconds.", fr: "Activer la mise en cache API Gateway sur l'étape de production avec une durée de vie (TTL) de 300 secondes." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      API Gateway caching is enabled per stage of a REST API and caches GET responses for the TTL (300 seconds by default, 3,600 seconds maximum). Identical requests are answered from the cache without invoking the Lambda function or querying the database, and no code changes are required.
    fr: |
      La mise en cache API Gateway s'active par étape d'une API REST et met en cache les réponses GET pendant la durée de vie (300 secondes par défaut, 3 600 secondes au maximum). Les requêtes identiques sont servies depuis le cache sans appeler la fonction Lambda ni interroger la base de données, et aucune modification du code n'est nécessaire.
  options:
    a:
      en: |
        ElastiCache reduces database load, but the function must be rewritten to implement the caching logic, and every request still invokes Lambda.
      fr: |
        ElastiCache réduit la charge de la base de données, mais la fonction doit être réécrite pour implémenter la logique de cache, et chaque requête appelle toujours Lambda.
    b:
      en: |
        A read replica offloads the primary database, but every request still reaches the backend and the function code must change.
      fr: |
        Un réplica en lecture décharge la base de données principale, mais chaque requête atteint toujours le backend et le code de la fonction doit être modifié.
    c:
      en: |
        Reserved concurrency caps the number of concurrent executions, so excess requests are throttled instead of answered; it does not serve repeated requests.
      fr: |
        La simultanéité réservée plafonne le nombre d'exécutions simultanées : les requêtes en excès sont limitées au lieu d'être servies ; elle ne répond pas aux requêtes répétées.
references:
  - title: Cache settings for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
