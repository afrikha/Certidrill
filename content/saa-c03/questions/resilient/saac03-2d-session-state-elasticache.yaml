id: saac03-2d-session-state-elasticache
objective: "2.2.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ecommerce application runs on Amazon EC2 instances in an Auto Scaling group across two Availability Zones behind an Application Load Balancer. The application keeps shopping cart session data in the memory of each instance, and sticky sessions are enabled on the target group. When an instance fails or is terminated during scale-in, its users lose their carts.

    The developers can change the session storage settings of the application framework. The session store must keep sub-millisecond access latency and survive the failure of an Availability Zone.

    Which solution will meet these requirements?
  fr: |
    Une application de commerce électronique s'exécute sur des instances Amazon EC2 d'un groupe Auto Scaling réparti sur deux zones de disponibilité, derrière un Application Load Balancer. L'application conserve les données de session des paniers dans la mémoire de chaque instance, et les sessions permanentes sont activées sur le groupe cible. Lorsqu'une instance tombe en panne ou est arrêtée lors d'une réduction de capacité, ses utilisateurs perdent leur panier.

    Les développeurs peuvent modifier les paramètres de stockage des sessions du framework applicatif. Le magasin de sessions doit garder une latence d'accès inférieure à la milliseconde et résister à la panne d'une zone de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the session data in an Amazon ElastiCache for Valkey cluster with a replica in each Availability Zone and Multi-AZ enabled.", fr: "Stocker les données de session dans un cluster Amazon ElastiCache for Valkey avec un réplica dans chaque zone de disponibilité et Multi-AZ activé." } }
    - { id: b, text: { en: "Store the session data on an Amazon EBS io2 volume with Multi-Attach enabled, attached to all instances.", fr: "Stocker les données de session sur un volume Amazon EBS io2 avec Multi-Attach activé, attaché à toutes les instances." } }
    - { id: c, text: { en: "Increase the duration of the load balancer-generated stickiness cookie to 7 days.", fr: "Porter à 7 jours la durée du cookie de permanence généré par l'équilibreur de charge." } }
    - { id: d, text: { en: "Store the session data on the instance store volumes of each instance.", fr: "Stocker les données de session sur les volumes de stockage d'instance de chaque instance." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Moving session state out of the instances to a shared in-memory store makes the web tier stateless, so any instance can serve any user and losing an instance no longer loses carts. ElastiCache for Valkey provides sub-millisecond in-memory access, and replicas in another Availability Zone with Multi-AZ let the cache survive the loss of a zone.
    fr: |
      Sortir l'état des sessions des instances vers un magasin en mémoire partagé rend le niveau web sans état : n'importe quelle instance peut servir n'importe quel utilisateur, et la perte d'une instance ne fait plus perdre de paniers. ElastiCache for Valkey offre un accès en mémoire inférieur à la milliseconde, et des réplicas dans une autre zone de disponibilité avec Multi-AZ permettent au cache de survivre à la perte d'une zone.
  options:
    b: { en: "Multi-Attach volumes can be attached only to instances in the same Availability Zone and need a cluster-aware file system, so they do not survive a zone failure.", fr: "Les volumes Multi-Attach ne peuvent être attachés qu'à des instances de la même zone de disponibilité et exigent un système de fichiers en cluster : ils ne résistent pas à une panne de zone." }
    c: { en: "Stickiness only routes a user back to the same instance; when that instance fails, the session data in its memory is lost regardless of the cookie duration.", fr: "La permanence ne fait que renvoyer un utilisateur vers la même instance ; si cette instance tombe en panne, les données de session de sa mémoire sont perdues, quelle que soit la durée du cookie." }
    d: { en: "Instance store is local to one instance and is lost when the instance stops or fails, so it has the same problem as memory.", fr: "Le stockage d'instance est local à une instance et perdu à son arrêt ou en cas de panne : il pose le même problème que la mémoire." }
references:
  - title: Common ElastiCache Use Cases and How ElastiCache Can Help
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html
  - title: What is Amazon ElastiCache?
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
