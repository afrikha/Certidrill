id: saac03-2b-sqs-fifo-order
objective: "2.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company processes account transactions that a web application submits to a message queue. Transactions for the same account must be processed in the exact order in which they were submitted. A transaction must not be processed twice when the web application retries a send request after a network error. Transactions for different accounts must be processed in parallel.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers traite des transactions de compte qu'une application web envoie dans une file d'attente de messages. Les transactions d'un même compte doivent être traitées exactement dans l'ordre de leur envoi. Une transaction ne doit pas être traitée deux fois lorsque l'application web renvoie une demande d'envoi après une erreur réseau. Les transactions de comptes différents doivent être traitées en parallèle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use an Amazon SQS FIFO queue, set the message group ID to the account ID, and send a message deduplication ID with each transaction.", fr: "Utiliser une file d'attente FIFO Amazon SQS, définir l'ID de groupe de messages sur l'ID du compte et envoyer un ID de déduplication avec chaque transaction." }
    - id: b
      text: { en: "Use an Amazon SQS standard queue, and set the visibility timeout to a value longer than the maximum processing time of a transaction.", fr: "Utiliser une file d'attente standard Amazon SQS et définir un délai de visibilité supérieur à la durée maximale de traitement d'une transaction." }
    - id: c
      text: { en: "Use an Amazon SNS standard topic with a subscribed Amazon SQS standard queue, and apply a subscription filter policy on the account ID.", fr: "Utiliser une rubrique standard Amazon SNS avec une file d'attente standard Amazon SQS abonnée, et appliquer une politique de filtre d'abonnement sur l'ID du compte." }
    - id: d
      text: { en: "Use an Amazon SQS standard queue with long polling enabled, and process all transactions with a single consumer instance.", fr: "Utiliser une file d'attente standard Amazon SQS avec l'interrogation longue activée, et traiter toutes les transactions avec une seule instance consommatrice." }
answer: { optionId: a }
explanation:
  correct:
    en: A FIFO queue strictly preserves the order of messages within a message group and provides exactly-once processing. Using the account ID as the message group ID keeps each account's transactions in order while different groups are processed in parallel, and the deduplication ID makes a retried send of the same transaction a duplicate that SQS does not add to the queue.
    fr: Une file d'attente FIFO préserve strictement l'ordre des messages au sein d'un groupe de messages et assure un traitement unique (exactly-once). Utiliser l'ID du compte comme ID de groupe de messages garde les transactions de chaque compte dans l'ordre tout en traitant les différents groupes en parallèle, et l'ID de déduplication fait d'un renvoi de la même transaction un doublon que SQS n'ajoute pas à la file d'attente.
  options:
    b:
      en: A standard queue offers best-effort ordering and at-least-once delivery. A longer visibility timeout reduces redeliveries during processing but guarantees neither order nor the absence of duplicates.
      fr: Une file d'attente standard offre un ordre au mieux (best-effort) et une remise au moins une fois. Un délai de visibilité plus long réduit les nouvelles remises pendant le traitement, mais ne garantit ni l'ordre ni l'absence de doublons.
    c:
      en: Standard topics and queues do not guarantee ordering. A filter policy only selects which messages a subscription receives; it neither orders nor deduplicates them.
      fr: Les rubriques et files d'attente standard ne garantissent pas l'ordre. Une politique de filtre sélectionne seulement les messages qu'un abonnement reçoit ; elle ne les ordonne pas et ne les déduplique pas.
    d:
      en: A single consumer removes the required parallelism, and a standard queue can still deliver messages out of order or more than once.
      fr: Un seul consommateur supprime le parallélisme exigé, et une file d'attente standard peut toujours remettre les messages dans le désordre ou plusieurs fois.
references:
  - title: Amazon SQS FIFO queues
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html
