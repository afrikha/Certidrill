id: saac03-2c-ebs-snapshots-az-loss
objective: "2.2.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a legacy single-instance application on an Amazon EC2 instance in one Availability Zone. All the application data is on one gp3 Amazon EBS volume. The company wants to be able to recover the data in another Availability Zone of the same Region if the first zone is lost, with an RPO of 1 hour. The solution must be the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application héritée à instance unique sur une instance Amazon EC2 dans une zone de disponibilité. Toutes les données de l'application se trouvent sur un volume Amazon EBS gp3. L'entreprise souhaite pouvoir récupérer les données dans une autre zone de disponibilité de la même Région en cas de perte de la première zone, avec un RPO d'une heure. La solution doit être la moins coûteuse.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the volume to io2 and enable Multi-Attach to attach it to a standby instance in a second Availability Zone."
        fr: "Passer le volume en io2 et activer Multi-Attach pour l'attacher à une instance de secours dans une deuxième zone de disponibilité."
    - id: b
      text:
        en: "Change the volume type to io2 to increase its durability and keep the volume in the same Availability Zone."
        fr: "Passer le volume au type io2 pour augmenter sa durabilité et conserver le volume dans la même zone de disponibilité."
    - id: c
      text:
        en: "Attach a second gp3 volume to the instance and mirror the two volumes with RAID 1 in the operating system."
        fr: "Attacher un second volume gp3 à l'instance et mettre en miroir les deux volumes en RAID 1 dans le système d'exploitation."
    - id: d
      text:
        en: "Create hourly EBS snapshots with Amazon Data Lifecycle Manager, and restore a volume from the latest snapshot in another zone if needed."
        fr: "Créer des instantanés EBS toutes les heures avec Amazon Data Lifecycle Manager, et restaurer si nécessaire un volume à partir du dernier instantané dans une autre zone."
answer: { optionId: d }
explanation:
  correct:
    en: |
      An EBS volume can be attached only to instances in its own Availability Zone, so it does not survive the loss of that zone. EBS snapshots are stored in Amazon S3 and their data is replicated across all zones of the Region, so a new volume can be created from them in any zone; hourly incremental snapshots meet the 1-hour RPO at low cost.
    fr: |
      Un volume EBS ne peut être attaché qu'à des instances de sa propre zone de disponibilité : il ne survit pas à la perte de cette zone. Les instantanés EBS sont stockés dans Amazon S3 et leurs données sont répliquées dans toutes les zones de la Région : un nouveau volume peut en être créé dans n'importe quelle zone ; des instantanés incrémentiels horaires respectent le RPO d'une heure à faible coût.
  options:
    a:
      en: |
        The volume and the instances it is attached to must be in the same Availability Zone, so Multi-Attach cannot reach another zone, and io2 costs more.
      fr: |
        Le volume et les instances auxquelles il est attaché doivent se trouver dans la même zone de disponibilité : Multi-Attach ne peut pas atteindre une autre zone, et io2 coûte plus cher.
    b:
      en: |
        A more durable volume still exists in only one Availability Zone and is lost if that zone is lost.
      fr: |
        Un volume plus durable n'existe toujours que dans une seule zone de disponibilité et est perdu si cette zone l'est.
    c:
      en: |
        Both volumes are in the same Availability Zone as the instance, so the mirror is lost together with the zone.
      fr: |
        Les deux volumes se trouvent dans la même zone de disponibilité que l'instance : le miroir est perdu avec la zone.
references:
  - title: Amazon EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-snapshots.html
  - title: Amazon EBS volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
