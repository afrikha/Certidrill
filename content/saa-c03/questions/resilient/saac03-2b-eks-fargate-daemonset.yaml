id: saac03-2b-eks-fargate-daemonset
objective: "2.1.14"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon EKS, and all its stateless pods run on AWS Fargate. The security team now requires a monitoring agent to run as a Kubernetes DaemonSet, and a new image-processing workload needs GPUs. The company wants to keep its existing Fargate pods and minimize the infrastructure that it manages.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise Amazon EKS, et tous ses pods sans état s'exécutent sur AWS Fargate. L'équipe de sécurité exige désormais qu'un agent de supervision s'exécute en tant que DaemonSet Kubernetes, et une nouvelle charge de travail de traitement d'images a besoin de GPU. L'entreprise veut conserver ses pods Fargate existants et réduire au minimum l'infrastructure qu'elle gère.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Add an Amazon EKS managed node group of GPU instances, and run the DaemonSet and the image-processing workload on its EC2 nodes.", fr: "Ajouter un groupe de nœuds gérés Amazon EKS composé d'instances GPU, et exécuter le DaemonSet et le traitement d'images sur ses nœuds EC2." }
    - id: b
      text: { en: "Add a Fargate profile for the monitoring namespace, and request GPU resources in the pod specification of the image-processing workload.", fr: "Ajouter un profil Fargate pour l'espace de noms de supervision, et demander des ressources GPU dans la spécification de pod du traitement d'images." }
    - id: c
      text: { en: "Run the monitoring agent as a privileged container in every Fargate pod, and move the image-processing workload to AWS Lambda.", fr: "Exécuter l'agent de supervision comme conteneur privilégié dans chaque pod Fargate, et déplacer le traitement d'images vers AWS Lambda." }
    - id: d
      text: { en: "Migrate all workloads to a self-managed Kubernetes cluster on EC2 instances that run the DaemonSet and the GPU workload.", fr: "Migrer toutes les charges de travail vers un cluster Kubernetes autogéré sur des instances EC2 qui exécutent le DaemonSet et la charge GPU." }
answer: { optionId: a }
explanation:
  correct:
    en: Amazon EKS on Fargate does not support DaemonSets, privileged containers, or GPUs. A managed node group adds EC2 nodes whose lifecycle EKS automates, so the DaemonSet and the GPU workload can run on those nodes while the existing pods stay on Fargate.
    fr: Amazon EKS sur Fargate ne prend en charge ni les DaemonSets, ni les conteneurs privilégiés, ni les GPU. Un groupe de nœuds gérés ajoute des nœuds EC2 dont EKS automatise le cycle de vie ; le DaemonSet et la charge GPU peuvent ainsi s'exécuter sur ces nœuds pendant que les pods existants restent sur Fargate.
  options:
    b:
      en: A Fargate profile only selects which pods run on Fargate; Fargate still runs no DaemonSets and offers no GPUs.
      fr: Un profil Fargate sélectionne seulement les pods qui s'exécutent sur Fargate ; Fargate n'exécute toujours pas de DaemonSets et ne propose pas de GPU.
    c:
      en: Privileged containers are not supported on Fargate, and Lambda does not provide GPUs; the requirement is also a DaemonSet, not a per-pod agent.
      fr: Les conteneurs privilégiés ne sont pas pris en charge sur Fargate, et Lambda ne fournit pas de GPU ; l'exigence porte en outre sur un DaemonSet, pas sur un agent par pod.
    d:
      en: A self-managed cluster supports both needs but brings back control plane and node management, the opposite of the stated goal.
      fr: Un cluster autogéré répond aux deux besoins, mais réintroduit la gestion du plan de contrôle et des nœuds, à l'opposé de l'objectif énoncé.
references:
  - title: Simplify compute management with AWS Fargate
    url: https://docs.aws.amazon.com/eks/latest/userguide/fargate.html
