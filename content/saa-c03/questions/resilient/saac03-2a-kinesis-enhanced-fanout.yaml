id: saac03-2a-kinesis-enhanced-fanout
objective: "2.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company streams telemetry through an Amazon Kinesis data stream in provisioned mode. Three consumer applications read the stream with GetRecords. After two more consumer applications were added, the consumers receive ReadProvisionedThroughputExceeded errors and their read latency rises to about 1 second. Each of the five applications must read the whole stream with a latency of about 70 ms. The write throughput is sufficient, and the company does not want to change the number of shards.

    Which solution will meet these requirements?
  fr: |
    Une entreprise diffuse de la télémétrie via un flux de données Amazon Kinesis en mode provisionné. Trois applications consommatrices lisent le flux avec GetRecords. Après l'ajout de deux autres applications consommatrices, les consommateurs reçoivent des erreurs ReadProvisionedThroughputExceeded et leur latence de lecture monte à environ 1 seconde. Chacune des cinq applications doit lire tout le flux avec une latence d'environ 70 ms. Le débit d'écriture est suffisant, et l'entreprise ne veut pas modifier le nombre de partitions (shards).

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Register each application as an enhanced fan-out consumer of the stream so that it receives records through SubscribeToShard.", fr: "Enregistrer chaque application comme consommateur à diffusion améliorée (enhanced fan-out) du flux afin qu'elle reçoive les enregistrements via SubscribeToShard." }
    - id: b
      text: { en: "Increase the data retention period of the stream to 7 days so that the consumers can catch up later.", fr: "Porter la période de conservation des données du flux à 7 jours afin que les consommateurs puissent rattraper leur retard plus tard." }
    - id: c
      text: { en: "Have the consumers call GetRecords less often with a larger record limit on each call.", fr: "Faire appeler GetRecords moins souvent par les consommateurs, avec une limite d'enregistrements plus élevée à chaque appel." }
    - id: d
      text: { en: "Have one consumer copy the records to an Amazon SQS standard queue that the other applications poll.", fr: "Faire copier les enregistrements par un consommateur dans une file d'attente Amazon SQS standard que les autres applications interrogent." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Standard consumers share a fixed 2 MB/s of read throughput per shard, so latency rises (about 1,000 ms with five consumers) and reads are throttled. Each enhanced fan-out consumer gets its own dedicated throughput of up to 2 MB/s per shard, with records pushed over HTTP/2, and latency stays around 70 ms whether there is one consumer or five, without resharding.
    fr: |
      Les consommateurs standard partagent un débit de lecture fixe de 2 Mo/s par partition : la latence augmente (environ 1 000 ms avec cinq consommateurs) et les lectures sont limitées. Chaque consommateur à diffusion améliorée obtient son propre débit dédié jusqu'à 2 Mo/s par partition, avec des enregistrements poussés via HTTP/2, et la latence reste d'environ 70 ms avec un ou cinq consommateurs, sans repartitionnement.
  options:
    b: { en: "A longer retention period lets consumers read older data but adds no read throughput and does not lower latency.", fr: "Une période de conservation plus longue permet de lire des données plus anciennes, mais n'ajoute aucun débit de lecture et ne réduit pas la latence." }
    c: { en: "Fewer, larger calls still share the same 2 MB/s per shard among five consumers, and polling less often raises latency.", fr: "Des appels moins nombreux et plus volumineux partagent toujours les mêmes 2 Mo/s par partition entre cinq consommateurs, et interroger moins souvent augmente la latence." }
    d: { en: "Messages in one SQS queue are consumed by one application each, so the other applications would not all read every record, and latency increases.", fr: "Les messages d'une file SQS sont consommés chacun par une seule application : les autres applications ne liraient pas toutes chaque enregistrement, et la latence augmente." }
references:
  - title: Develop enhanced fan-out consumers with dedicated throughput
    url: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
