id: saac03-2a-dynamodb-streams-trigger
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores orders in an Amazon DynamoDB table. Whenever the status of an order item changes to SHIPPED, a confirmation email must be sent to the customer. The company does not want to change the code of the application that writes the orders, and it does not want to run any servers or poll the table.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke ses commandes dans une table Amazon DynamoDB. Chaque fois que le statut d'un élément de commande passe à SHIPPED, un e-mail de confirmation doit être envoyé au client. L'entreprise ne veut pas modifier le code de l'application qui écrit les commandes, et ne veut ni exécuter de serveurs ni interroger la table.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the order application to publish a message to an Amazon SNS topic after each status update.", fr: "Modifier l'application de commandes pour qu'elle publie un message dans une rubrique Amazon SNS après chaque mise à jour de statut." }
    - id: b
      text: { en: "Create a scheduled Amazon EventBridge rule that invokes a Lambda function every minute to scan the table for shipped orders.", fr: "Créer une règle Amazon EventBridge planifiée qui appelle une fonction Lambda toutes les minutes pour analyser la table à la recherche des commandes expédiées." }
    - id: c
      text: { en: "Enable Time to Live (TTL) on the table, and send the email when DynamoDB deletes the expired items.", fr: "Activer la durée de vie (TTL) sur la table, et envoyer l'e-mail quand DynamoDB supprime les éléments expirés." }
    - id: d
      text: { en: "Enable DynamoDB Streams on the table, and use the stream to trigger a Lambda function that sends the email when the new status is SHIPPED.", fr: "Activer DynamoDB Streams sur la table, et utiliser le flux pour déclencher une fonction Lambda qui envoie l'e-mail quand le nouveau statut est SHIPPED." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      DynamoDB Streams captures every item modification as a stream record. When the stream is associated with a Lambda function, the Lambda service reads the stream and invokes the function with the changed items, so the function can check the new status and send the email without any change to the writing application.
    fr: |
      DynamoDB Streams capture chaque modification d'élément sous forme d'enregistrement de flux. Quand le flux est associé à une fonction Lambda, le service Lambda lit le flux et appelle la fonction avec les éléments modifiés : la fonction peut vérifier le nouveau statut et envoyer l'e-mail sans aucune modification de l'application qui écrit.
  options:
    a: { en: "Publishing to SNS from the application requires changing its code, which the requirements forbid.", fr: "Publier dans SNS depuis l'application impose de modifier son code, ce que les exigences interdisent." }
    b: { en: "Scanning the table every minute is polling, consumes read capacity and adds delay.", fr: "Analyser la table toutes les minutes revient à l'interroger, consomme de la capacité de lecture et ajoute du délai." }
    c: { en: "TTL deletes items after an expiration time; it is unrelated to a status change and would remove the orders.", fr: "La durée de vie supprime les éléments après une date d'expiration ; elle n'a aucun lien avec un changement de statut et supprimerait les commandes." }
references:
  - title: DynamoDB Streams and AWS Lambda triggers
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.Lambda.html
