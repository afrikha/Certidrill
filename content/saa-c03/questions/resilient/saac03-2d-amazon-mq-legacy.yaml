id: saac03-2d-amazon-mq-legacy
objective: "2.2.19"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating an on-premises order processing system to AWS. The system's components exchange messages through JMS with a self-managed Apache ActiveMQ broker, which is a single point of failure.

    The company wants a managed message broker that stays available if an Availability Zone fails, without rewriting the messaging code of the application.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre vers AWS un système de traitement des commandes sur site. Les composants du système échangent des messages en JMS via un agent de messages (broker) Apache ActiveMQ autogéré, qui constitue un point de défaillance unique.

    L'entreprise veut un agent de messages géré qui reste disponible en cas de panne d'une zone de disponibilité, sans réécrire le code de messagerie de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Replace the broker with Amazon SQS standard queues.", fr: "Remplacer l'agent par des files d'attente standard Amazon SQS." } }
    - { id: b, text: { en: "Replace the broker with Amazon SNS topics and subscriptions.", fr: "Remplacer l'agent par des rubriques et des abonnements Amazon SNS." } }
    - { id: c, text: { en: "Create an Amazon MQ for ActiveMQ broker with an active/standby deployment across two Availability Zones.", fr: "Créer un agent Amazon MQ for ActiveMQ avec un déploiement actif/de secours sur deux zones de disponibilité." } }
    - { id: d, text: { en: "Install ActiveMQ on an Amazon EC2 instance with an Amazon EBS volume and enable EC2 automatic recovery.", fr: "Installer ActiveMQ sur une instance Amazon EC2 avec un volume Amazon EBS et activer la récupération automatique EC2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Amazon MQ is a managed broker service for Apache ActiveMQ Classic and RabbitMQ, so existing brokers can be migrated without rewriting messaging code. An active/standby deployment runs a redundant pair of brokers in two Availability Zones with Amazon EFS storage; if the active broker fails, the standby becomes active, and clients that use the failover transport reconnect to it.
    fr: |
      Amazon MQ est un service d'agent de messages géré pour Apache ActiveMQ Classic et RabbitMQ : les agents existants peuvent être migrés sans réécrire le code de messagerie. Un déploiement actif/de secours exécute une paire redondante d'agents dans deux zones de disponibilité avec un stockage Amazon EFS ; si l'agent actif tombe en panne, l'agent de secours devient actif, et les clients qui utilisent le transport de basculement s'y reconnectent.
  options:
    a: { en: "SQS is highly available, but it has its own API; the JMS messaging code would have to be rewritten.", fr: "SQS est hautement disponible, mais il possède sa propre API ; le code de messagerie JMS devrait être réécrit." }
    b: { en: "SNS is a publish/subscribe service with its own API, so the application messaging code would have to change.", fr: "SNS est un service de publication/abonnement doté de sa propre API : le code de messagerie de l'application devrait changer." }
    d: { en: "A self-managed broker on one instance is not managed and still fails if its Availability Zone fails.", fr: "Un agent autogéré sur une seule instance n'est pas géré et tombe toujours en panne si sa zone de disponibilité tombe en panne." }
references:
  - title: What is Amazon MQ?
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
  - title: Deployment options for Amazon MQ for ActiveMQ brokers
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/amazon-mq-broker-architecture.html
