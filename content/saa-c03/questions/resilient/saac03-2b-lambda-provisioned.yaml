id: saac03-2b-lambda-provisioned
objective: "2.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a customer-facing API on Amazon API Gateway and AWS Lambda. The Node.js functions load large libraries during initialization. During business hours, users report occasional slow responses when Lambda starts new execution environments. The company wants consistently low latency during business hours and accepts an additional charge for it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une API destinée à ses clients sur Amazon API Gateway et AWS Lambda. Les fonctions Node.js chargent des bibliothèques volumineuses pendant leur initialisation. Pendant les heures ouvrables, les utilisateurs signalent des réponses parfois lentes lorsque Lambda démarre de nouveaux environnements d'exécution. L'entreprise veut une latence faible et constante pendant les heures ouvrables et accepte un coût supplémentaire pour cela.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure provisioned concurrency on an alias of each function, and raise it during business hours with scheduled Application Auto Scaling actions.", fr: "Configurer la simultanéité provisionnée sur un alias de chaque fonction, et l'augmenter pendant les heures ouvrables avec des actions planifiées Application Auto Scaling." }
    - id: b
      text: { en: "Configure reserved concurrency on each function with a value equal to the expected peak concurrency during business hours.", fr: "Configurer la simultanéité réservée sur chaque fonction avec une valeur égale à la simultanéité de pointe attendue pendant les heures ouvrables." }
    - id: c
      text: { en: "Increase the timeout of each function to 15 minutes so that slow initializations complete before the request fails.", fr: "Augmenter le délai d'expiration de chaque fonction à 15 minutes afin que les initialisations lentes se terminent avant l'échec de la requête." }
    - id: d
      text: { en: "Configure API Gateway throttling to limit the number of requests per second that reach the functions during business hours.", fr: "Configurer la limitation (throttling) d'API Gateway pour limiter le nombre de requêtes par seconde qui atteignent les fonctions pendant les heures ouvrables." }
answer: { optionId: a }
explanation:
  correct:
    en: Provisioned concurrency keeps a set number of execution environments initialized and ready, so requests served by them avoid cold-start latency. It is configured on a version or alias, incurs an additional charge, and can be scheduled with Application Auto Scaling to cover only business hours.
    fr: La simultanéité provisionnée maintient un nombre défini d'environnements d'exécution initialisés et prêts ; les requêtes qu'ils traitent évitent ainsi la latence des démarrages à froid. Elle se configure sur une version ou un alias, entraîne un coût supplémentaire et peut être planifiée avec Application Auto Scaling pour ne couvrir que les heures ouvrables.
  options:
    b:
      en: Reserved concurrency guarantees and caps the concurrency of a function, but it does not pre-initialize environments, so cold starts still occur.
      fr: La simultanéité réservée garantit et plafonne la simultanéité d'une fonction, mais elle ne pré-initialise pas d'environnements ; les démarrages à froid se produisent donc toujours.
    c:
      en: A longer timeout does not make initialization faster; users would still wait for cold starts.
      fr: Un délai d'expiration plus long n'accélère pas l'initialisation ; les utilisateurs attendraient toujours les démarrages à froid.
    d:
      en: Throttling rejects requests above a rate; it does not reduce the latency of the requests that are accepted.
      fr: La limitation rejette les requêtes au-delà d'un débit ; elle ne réduit pas la latence des requêtes acceptées.
references:
  - title: Configuring provisioned concurrency for an Event Function
    url: https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html
  - title: Understanding Lambda Event Function scaling
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
