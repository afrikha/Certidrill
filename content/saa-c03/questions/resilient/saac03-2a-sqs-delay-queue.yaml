id: saac03-2a-sqs-delay-queue
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online store sends each new order to an Amazon SQS standard queue that fulfillment workers consume. Customers can cancel an order free of charge during the first 5 minutes. The company wants the workers to receive every order only 5 minutes after it is sent to the queue, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une boutique en ligne envoie chaque nouvelle commande dans une file d'attente Amazon SQS standard que consomment des workers de préparation. Les clients peuvent annuler gratuitement une commande pendant les 5 premières minutes. L'entreprise veut que les workers ne reçoivent chaque commande que 5 minutes après son envoi dans la file, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the visibility timeout of the queue to 5 minutes so that new messages stay hidden from the workers.", fr: "Définir le délai de visibilité de la file d'attente à 5 minutes afin que les nouveaux messages restent masqués aux workers." }
    - id: b
      text: { en: "Have each worker wait 5 minutes after it receives a message before it starts processing the order.", fr: "Faire attendre chaque worker 5 minutes après la réception d'un message avant qu'il commence à traiter la commande." }
    - id: c
      text: { en: "Set the message retention period of the queue to 5 minutes so that orders are released after that time.", fr: "Définir la période de conservation des messages de la file d'attente à 5 minutes afin que les commandes soient libérées après ce délai." }
    - id: d
      text: { en: "Configure the queue as a delay queue by setting its delivery delay to 300 seconds.", fr: "Configurer la file d'attente comme file d'attente à délai en définissant son délai de remise à 300 secondes." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A delay queue postpones the delivery of every new message for the configured delay (from 0 seconds up to 15 minutes), so the messages stay invisible to consumers from the moment they are sent. A 300-second delivery delay gives customers their 5-minute cancellation window with a single queue setting.
    fr: |
      Une file d'attente à délai reporte la remise de chaque nouveau message pendant le délai configuré (de 0 seconde à 15 minutes) : les messages restent invisibles pour les consommateurs dès leur envoi. Un délai de remise de 300 secondes donne aux clients leur fenêtre d'annulation de 5 minutes avec un seul paramètre de file.
  options:
    a: { en: "The visibility timeout hides a message only after a consumer has received it, so new orders are still delivered at once.", fr: "Le délai de visibilité ne masque un message qu'après sa réception par un consommateur : les nouvelles commandes sont toujours remises immédiatement." }
    b: { en: "Waiting inside the worker ties up workers, requires code changes, and risks the message becoming visible again to another worker.", fr: "Attendre dans le worker immobilise les workers, exige des modifications du code et risque de rendre le message à nouveau visible pour un autre worker." }
    c: { en: "The retention period deletes messages that are older than the period, so the orders would be lost instead of delayed.", fr: "La période de conservation supprime les messages plus anciens que la période : les commandes seraient perdues au lieu d'être retardées." }
references:
  - title: Amazon SQS delay queues
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-delay-queues.html
