id: saac03-2a-alb-deregistration-delay
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a file upload service on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Some uploads take up to 8 minutes. When the group scales in, users whose uploads are in progress on the terminated instances receive errors. The target group uses its default settings. The company wants in-progress uploads to finish during scale-in while keeping automatic scaling.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un service d'envoi de fichiers sur des instances Amazon EC2 dans un groupe Auto Scaling derrière un Application Load Balancer. Certains envois durent jusqu'à 8 minutes. Quand le groupe réduit sa capacité, les utilisateurs dont l'envoi est en cours sur les instances arrêtées reçoivent des erreurs. Le groupe cible utilise ses paramètres par défaut. L'entreprise veut que les envois en cours se terminent pendant la réduction de capacité, tout en conservant la mise à l'échelle automatique.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on duration-based stickiness on the target group so that each user stays on the same instance.", fr: "Activer la persistance basée sur la durée (duration-based stickiness) sur le groupe cible afin que chaque utilisateur reste sur la même instance." }
    - id: b
      text: { en: "Increase the health check grace period of the Auto Scaling group to 10 minutes.", fr: "Porter le délai de grâce de la vérification de l'état du groupe Auto Scaling à 10 minutes." }
    - id: c
      text: { en: "Increase the deregistration delay of the target group to a value longer than the longest upload, such as 600 seconds.", fr: "Augmenter le délai de désinscription (deregistration delay) du groupe cible à une valeur supérieure à l'envoi le plus long, par exemple 600 secondes." }
    - id: d
      text: { en: "Enable instance scale-in protection on every instance in the Auto Scaling group.", fr: "Activer la protection contre la diminution de la taille (scale-in protection) sur chaque instance du groupe Auto Scaling." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      When a target is deregistered, the load balancer stops sending it new requests and waits for the deregistration delay (300 seconds by default) so that in-flight requests can complete before the instance is terminated. The default is shorter than an 8-minute upload, so raising the delay above the longest upload lets uploads finish while the group still scales in.
    fr: |
      Quand une cible est désinscrite, l'équilibreur de charge cesse de lui envoyer de nouvelles requêtes et attend le délai de désinscription (300 secondes par défaut) pour que les requêtes en cours se terminent avant l'arrêt de l'instance. La valeur par défaut est plus courte qu'un envoi de 8 minutes : porter le délai au-delà de l'envoi le plus long permet aux envois de se terminer, tandis que le groupe continue de réduire sa capacité.
  options:
    a: { en: "Stickiness keeps users on one instance but does not delay its termination, so uploads on that instance still fail.", fr: "La persistance garde les utilisateurs sur une instance, mais ne retarde pas son arrêt : les envois sur cette instance échouent toujours." }
    b: { en: "The grace period delays health checks of new instances; it has no effect on instances that are being terminated.", fr: "Le délai de grâce retarde les vérifications de l'état des nouvelles instances ; il n'a aucun effet sur les instances en cours d'arrêt." }
    d: { en: "Protecting every instance prevents scale-in entirely, which removes the automatic scaling that the company wants to keep.", fr: "Protéger chaque instance empêche toute réduction de capacité, ce qui supprime la mise à l'échelle automatique que l'entreprise veut conserver." }
references:
  - title: Edit target group attributes for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
