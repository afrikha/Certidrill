id: saac03-2b-efs-shared-linux
objective: "2.1.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a content management system on Linux Amazon EC2 instances in an Auto Scaling group that spans three Availability Zones. All instances must read and write the same set of files concurrently through a standard POSIX file system interface. The storage must remain available if one Availability Zone fails.

    Which storage solution will meet these requirements?
  fr: |
    Une entreprise exécute un système de gestion de contenu sur des instances Amazon EC2 Linux d'un groupe Auto Scaling réparti sur trois zones de disponibilité. Toutes les instances doivent lire et écrire simultanément le même ensemble de fichiers via une interface de système de fichiers POSIX standard. Le stockage doit rester disponible en cas de panne d'une zone de disponibilité.

    Quelle solution de stockage permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon EBS gp3 volume attached to each instance, with the files synchronized between volumes by a scheduled script.", fr: "Un volume Amazon EBS gp3 attaché à chaque instance, avec des fichiers synchronisés entre les volumes par un script planifié." }
    - id: b
      text: { en: "An Amazon EFS Regional file system mounted on every instance in the Auto Scaling group.", fr: "Un système de fichiers régional Amazon EFS monté sur chaque instance du groupe Auto Scaling." }
    - id: c
      text: { en: "An Amazon EBS io2 volume with Multi-Attach enabled and attached to every instance in the Auto Scaling group.", fr: "Un volume Amazon EBS io2 avec Multi-Attach activé, attaché à chaque instance du groupe Auto Scaling." }
    - id: d
      text: { en: "An Amazon S3 bucket that the application accesses through the S3 API for every file operation.", fr: "Un compartiment Amazon S3 auquel l'application accède via l'API S3 pour chaque opération sur les fichiers." }
answer: { optionId: b }
explanation:
  correct:
    en: Amazon EFS is a shared file system accessed over NFS with POSIX permissions, and many instances can mount it at the same time. A Regional file system stores data redundantly across multiple Availability Zones, so it stays available if one zone fails.
    fr: Amazon EFS est un système de fichiers partagé accessible via NFS avec des autorisations POSIX, que de nombreuses instances peuvent monter en même temps. Un système de fichiers régional stocke les données de manière redondante dans plusieurs zones de disponibilité ; il reste donc disponible si une zone tombe en panne.
  options:
    a:
      en: Separate block volumes are not a shared file system; a sync script gives no concurrent consistent access and adds operational work.
      fr: Des volumes de blocs séparés ne forment pas un système de fichiers partagé ; un script de synchronisation n'offre pas d'accès simultané cohérent et ajoute du travail d'exploitation.
    c:
      en: Multi-Attach works only for instances in the same Availability Zone and needs a cluster-aware file system, so it cannot serve instances in three zones.
      fr: Multi-Attach ne fonctionne que pour des instances de la même zone de disponibilité et nécessite un système de fichiers en cluster ; il ne peut donc pas servir des instances réparties sur trois zones.
    d:
      en: Amazon S3 is object storage accessed through an API, not a POSIX file system interface.
      fr: Amazon S3 est un stockage d'objets accessible via une API, pas une interface de système de fichiers POSIX.
references:
  - title: What is Amazon Elastic File System?
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
  - title: Attach an EBS volume to multiple EC2 instances using Multi-Attach
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html
