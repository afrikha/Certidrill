id: saac03-2a-stateless-s3-sessions
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A photo-sharing application runs on a single Amazon EC2 instance. The application stores uploaded photos on the instance's Amazon EBS volume and keeps user sessions in local memory. The company wants to run the application on multiple instances in an Auto Scaling group across several Availability Zones so that any instance can serve any request.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application de partage de photos s'exécute sur une seule instance Amazon EC2. L'application stocke les photos envoyées sur le volume Amazon EBS de l'instance et conserve les sessions des utilisateurs en mémoire locale. L'entreprise veut exécuter l'application sur plusieurs instances dans un groupe Auto Scaling réparti sur plusieurs zones de disponibilité, afin que n'importe quelle instance puisse servir n'importe quelle requête.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store the uploaded photos in an Amazon S3 bucket instead of on the local EBS volume.", fr: "Stocker les photos envoyées dans un compartiment Amazon S3 au lieu du volume EBS local." } }
    - { id: b, text: { en: "Enable sticky sessions on the load balancer target group.", fr: "Activer les sessions permanentes sur le groupe cible de l'équilibreur de charge." } }
    - { id: c, text: { en: "Use EBS Multi-Attach to share the existing volume with all the instances.", fr: "Utiliser EBS Multi-Attach pour partager le volume existant avec toutes les instances." } }
    - { id: d, text: { en: "Store the user sessions in an Amazon ElastiCache cache.", fr: "Stocker les sessions des utilisateurs dans un cache Amazon ElastiCache." } }
    - { id: e, text: { en: "Move the application to a larger instance type.", fr: "Passer l'application à un type d'instance plus grand." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      To scale horizontally, the instances must not depend on locally stored data. Photos in Amazon S3 and sessions in ElastiCache are reachable by every instance in every Availability Zone, so any instance can serve any request and instances can be added or replaced freely.
    fr: |
      Pour une mise à l'échelle horizontale, les instances ne doivent pas dépendre de données stockées localement. Les photos dans Amazon S3 et les sessions dans ElastiCache sont accessibles à toutes les instances dans toutes les zones de disponibilité : n'importe quelle instance peut servir n'importe quelle requête, et les instances peuvent être ajoutées ou remplacées librement.
  options:
    b: { en: "Sticky sessions tie each user to one instance and leave the photos on local volumes, so the application stays stateful.", fr: "Les sessions permanentes lient chaque utilisateur à une instance et laissent les photos sur des volumes locaux : l'application reste avec état." }
    c: { en: "Multi-Attach works only for Provisioned IOPS volumes within one Availability Zone and needs a cluster-aware file system, so it cannot span several Availability Zones.", fr: "Multi-Attach ne fonctionne que pour des volumes Provisioned IOPS dans une seule zone de disponibilité et exige un système de fichiers adapté aux clusters : il ne peut pas couvrir plusieurs zones de disponibilité." }
    e: { en: "A larger instance is vertical scaling; the application still runs on one instance and keeps its local state.", fr: "Une instance plus grande relève de la mise à l'échelle verticale ; l'application s'exécute toujours sur une seule instance et conserve son état local." }
references:
  - title: REL05-BP06 Make systems stateless where possible
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_mitigate_interaction_failure_stateless.html
