id: saac03-2d-docdb-neptune
objective: "2.2.20"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A social commerce startup is building a new application on AWS. The product catalog is stored as documents whose attributes vary by product, and the developers already use MongoDB drivers. A recommendation feature must query multi-hop relationships, such as products bought by customers who follow the same creators as the current user.

    The startup wants fully managed, purpose-built databases for each workload.

    Which combination of services will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une start-up de commerce social crée une nouvelle application sur AWS. Le catalogue de produits est stocké sous forme de documents dont les attributs varient selon le produit, et les développeurs utilisent déjà des pilotes MongoDB. Une fonctionnalité de recommandation doit interroger des relations à plusieurs sauts, comme les produits achetés par les clients qui suivent les mêmes créateurs que l'utilisateur courant.

    La start-up veut des bases de données spécialisées et entièrement gérées pour chaque charge de travail.

    Quelle combinaison de services répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Amazon Keyspaces (for Apache Cassandra) for the product catalog", fr: "Amazon Keyspaces (for Apache Cassandra) pour le catalogue de produits" } }
    - { id: b, text: { en: "Amazon Redshift for the recommendation feature", fr: "Amazon Redshift pour la fonctionnalité de recommandation" } }
    - { id: c, text: { en: "Amazon DocumentDB (with MongoDB compatibility) for the product catalog", fr: "Amazon DocumentDB (with MongoDB compatibility) pour le catalogue de produits" } }
    - { id: d, text: { en: "Amazon RDS for MySQL with recursive SQL joins for the recommendation feature", fr: "Amazon RDS for MySQL avec des jointures SQL récursives pour la fonctionnalité de recommandation" } }
    - { id: e, text: { en: "Amazon Neptune for the recommendation feature", fr: "Amazon Neptune pour la fonctionnalité de recommandation" } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Amazon DocumentDB is a fully managed document database that runs the same application code, drivers, and tools as MongoDB, and its storage keeps six copies of the data across three Availability Zones. Amazon Neptune is a fully managed graph database built to store billions of relationships and query them with millisecond latency, which suits recommendation engines.
    fr: |
      Amazon DocumentDB est une base de données documentaire entièrement gérée qui exécute le même code applicatif, les mêmes pilotes et les mêmes outils que MongoDB, et son stockage conserve six copies des données dans trois zones de disponibilité. Amazon Neptune est une base de données orientée graphe entièrement gérée, conçue pour stocker des milliards de relations et les interroger avec une latence de quelques millisecondes, ce qui convient aux moteurs de recommandation.
  options:
    a: { en: "Keyspaces is compatible with Apache Cassandra, not MongoDB, so the existing MongoDB drivers would not work.", fr: "Keyspaces est compatible avec Apache Cassandra, pas avec MongoDB : les pilotes MongoDB existants ne fonctionneraient pas." }
    b: { en: "Redshift is a data warehouse for analytical queries, not a database for low-latency traversal of relationships in an application.", fr: "Redshift est un entrepôt de données pour les requêtes analytiques, pas une base de données pour le parcours à faible latence de relations dans une application." }
    d: { en: "Multi-hop relationship queries with repeated joins in a relational database are complex and slow; RDS is not the purpose-built choice for graph workloads.", fr: "Des requêtes de relations à plusieurs sauts avec des jointures répétées dans une base relationnelle sont complexes et lentes ; RDS n'est pas le choix spécialisé pour les charges de travail de graphe." }
references:
  - title: What is Amazon DocumentDB (with MongoDB compatibility)
    url: https://docs.aws.amazon.com/documentdb/latest/developerguide/what-is.html
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
