id: saac03-2c-api-gateway-usage-plans
objective: "2.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company exposes a REST API in Amazon API Gateway to partner companies. One partner's batch job sends bursts of requests that consume most of the account's throughput in the Region, and the other partners receive 429 Too Many Requests errors. The company wants to limit each partner to an agreed request rate and burst and to track each partner's usage, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels expose une API REST dans Amazon API Gateway à des entreprises partenaires. Le traitement par lots d'un partenaire envoie des rafales de requêtes qui consomment l'essentiel du débit du compte dans la Région, et les autres partenaires reçoivent des erreurs 429 Too Many Requests. L'entreprise souhaite limiter chaque partenaire à un débit et à une rafale convenus et suivre l'utilisation de chacun, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Ask AWS Support to lower the account-level throttling limit for API Gateway in the Region."
        fr: "Demander au support AWS de réduire la limite de limitation au niveau du compte pour API Gateway dans la Région."
    - id: b
      text:
        en: "Create an API key for each partner and a usage plan with throttling and quota settings, and associate it with the API stage."
        fr: "Créer une clé d'API pour chaque partenaire et un plan d'utilisation avec des paramètres de limitation et de quota, puis l'associer à l'étape de l'API."
    - id: c
      text:
        en: "Configure stage-level throttling for the API stage with the rate and burst agreed with the partners."
        fr: "Configurer une limitation au niveau de l'étape de l'API avec le débit et la rafale convenus avec les partenaires."
    - id: d
      text:
        en: "Place an Amazon SQS queue in front of the API to buffer the requests from all partners."
        fr: "Placer une file d'attente Amazon SQS devant l'API pour mettre en mémoire tampon les requêtes de tous les partenaires."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Usage plans set per-client throttling (rate and burst) and quotas based on API keys, so each partner gets its own limit and its usage can be tracked per key. API Gateway applies the usage plan limits first, then stage, account, and Regional limits, and throttled clients receive 429 responses.
    fr: |
      Les plans d'utilisation définissent une limitation par client (débit et rafale) et des quotas fondés sur des clés d'API : chaque partenaire a sa propre limite et son utilisation peut être suivie par clé. API Gateway applique d'abord les limites du plan d'utilisation, puis celles de l'étape, du compte et de la Région, et les clients limités reçoivent des réponses 429.
  options:
    a:
      en: |
        A lower account limit affects every partner together; it does not stop one partner from consuming the shared capacity.
      fr: |
        Une limite de compte plus basse touche tous les partenaires ensemble ; elle n'empêche pas un partenaire de consommer la capacité partagée.
    c:
      en: |
        Stage-level throttling applies to all clients of the stage together, not to each partner separately, and it does not track usage per partner.
      fr: |
        La limitation au niveau de l'étape s'applique à tous les clients de l'étape ensemble, pas à chaque partenaire séparément, et ne suit pas l'utilisation par partenaire.
    d:
      en: |
        A queue changes the synchronous API into an asynchronous design and does not enforce per-partner limits.
      fr: |
        Une file d'attente transforme l'API synchrone en conception asynchrone et n'impose pas de limites par partenaire.
references:
  - title: Throttle requests to your REST APIs for better throughput in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
