id: saac03-2d-cross-account-observability
objective: "2.2.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with 40 member accounts. All workloads run in a single AWS Region. Each account publishes application metrics and logs to Amazon CloudWatch and sends traces to AWS X-Ray.

    The central operations team wants to search and correlate the metrics, logs, and traces of all accounts from one monitoring account. Accounts that are added to the organization later must be included automatically. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations avec 40 comptes membres. Toutes les charges de travail s'exécutent dans une seule Région AWS. Chaque compte publie des métriques et des journaux d'application dans Amazon CloudWatch et envoie des traces à AWS X-Ray.

    L'équipe centrale des opérations veut rechercher et corréler les métriques, les journaux et les traces de tous les comptes depuis un seul compte de surveillance. Les comptes ajoutés plus tard à l'organisation doivent être inclus automatiquement. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "In each member account, create CloudWatch Logs subscription filters that stream every log group to an Amazon Data Firehose stream in the central account, which delivers the data to Amazon OpenSearch Service.", fr: "Dans chaque compte membre, créer des filtres d'abonnement CloudWatch Logs qui diffusent chaque groupe de journaux vers un flux Amazon Data Firehose du compte central, qui livre les données à Amazon OpenSearch Service." } }
    - { id: b, text: { en: "Create an AWS Config aggregator in the central account that collects configuration and compliance data from all accounts in the organization.", fr: "Créer un agrégateur AWS Config dans le compte central qui collecte les données de configuration et de conformité de tous les comptes de l'organisation." } }
    - { id: c, text: { en: "Create an IAM role in each member account that the operations team assumes to open the CloudWatch and X-Ray consoles of that account.", fr: "Créer dans chaque compte membre un rôle IAM que l'équipe des opérations endosse pour ouvrir les consoles CloudWatch et X-Ray de ce compte." } }
    - { id: d, text: { en: "Set up CloudWatch cross-account observability with the central account as the monitoring account, and link the organization as the source of metrics, logs, and traces.", fr: "Configurer l'observabilité entre comptes CloudWatch avec le compte central comme compte de surveillance, et lier l'organisation comme source des métriques, des journaux et des traces." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      CloudWatch cross-account observability links source accounts to a monitoring account in the same Region and shares the selected telemetry types, including CloudWatch metrics, CloudWatch Logs log groups, and X-Ray traces. When the link targets the organization (or an OU), accounts added later are onboarded as source accounts automatically. There is no pipeline to build or maintain.
    fr: |
      L'observabilité entre comptes CloudWatch relie des comptes sources à un compte de surveillance de la même Région et partage les types de télémétrie choisis, dont les métriques CloudWatch, les groupes de journaux CloudWatch Logs et les traces X-Ray. Lorsque la liaison cible l'organisation (ou une unité d'organisation), les comptes ajoutés plus tard deviennent automatiquement des comptes sources. Il n'y a aucun pipeline à construire ni à maintenir.
  options:
    a: { en: "This centralizes logs only, not metrics or traces, and requires subscription filters to be created and maintained in every account, including new ones.", fr: "Cette solution ne centralise que les journaux, pas les métriques ni les traces, et exige de créer et de maintenir des filtres d'abonnement dans chaque compte, y compris les nouveaux." }
    b: { en: "A Config aggregator collects resource configuration and compliance data, not application metrics, logs, or traces.", fr: "Un agrégateur Config collecte des données de configuration et de conformité des ressources, pas des métriques, journaux ou traces d'application." }
    c: { en: "Switching roles shows one account at a time, so the team cannot correlate telemetry across accounts, and each new account needs a new role.", fr: "Le changement de rôle n'affiche qu'un compte à la fois : l'équipe ne peut pas corréler la télémétrie entre comptes, et chaque nouveau compte exige un nouveau rôle." }
references:
  - title: CloudWatch cross-account observability
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Unified-Cross-Account.html
