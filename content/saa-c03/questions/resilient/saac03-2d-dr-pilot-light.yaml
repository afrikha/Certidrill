id: saac03-2d-dr-pilot-light
objective: "2.2.18"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ordering application runs on Amazon EC2 instances in an Auto Scaling group with an Amazon RDS for MySQL DB instance in us-east-1. The disaster recovery (DR) requirements for a Regional outage are an RPO of a few minutes and an RTO of 1 hour.

    The application servers do not need to run in the DR Region before a disaster. The company wants to minimize the cost of the DR environment.

    Which solution will meet these requirements?
  fr: |
    Une application de commandes s'exécute sur des instances Amazon EC2 d'un groupe Auto Scaling avec une instance de base de données Amazon RDS for MySQL dans us-east-1. Les exigences de reprise après sinistre (DR) en cas de panne régionale sont un RPO de quelques minutes et un RTO d'une heure.

    Les serveurs d'application n'ont pas besoin de s'exécuter dans la Région de DR avant un sinistre. L'entreprise veut réduire au minimum le coût de l'environnement de DR.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Copy daily RDS snapshots and the AMIs to us-west-2 with AWS Backup, and after a disaster restore the database and launch the Auto Scaling group from the AMIs.", fr: "Copier chaque jour des instantanés RDS et les AMI vers us-west-2 avec AWS Backup, puis après un sinistre restaurer la base de données et lancer le groupe Auto Scaling à partir des AMI." } }
    - { id: b, text: { en: "Run a scaled-down Auto Scaling group of two instances behind an Application Load Balancer in us-west-2, with a cross-Region read replica, and scale out after a disaster.", fr: "Exécuter dans us-west-2 un groupe Auto Scaling réduit à deux instances derrière un Application Load Balancer, avec un réplica en lecture entre Régions, et augmenter la capacité après un sinistre." } }
    - { id: c, text: { en: "Create a cross-Region read replica and copy the AMIs and launch template to us-west-2 with an Auto Scaling group at zero capacity; after a disaster, promote the replica and scale out.", fr: "Créer un réplica en lecture entre Régions et copier les AMI et le modèle de lancement vers us-west-2 avec un groupe Auto Scaling d'une capacité nulle ; après un sinistre, promouvoir le réplica et augmenter la capacité." } }
    - { id: d, text: { en: "Migrate the database to an Aurora global database, and run the full application at production capacity in both Regions with write forwarding from us-west-2.", fr: "Migrer la base de données vers une base de données globale Aurora, et exécuter l'application complète à la capacité de production dans les deux Régions avec le transfert d'écriture depuis us-west-2." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      This is pilot light. The core of the workload, the database, is replicated continuously, so the RPO stays within minutes, while the application servers are switched off (zero capacity) and cost nothing until they are needed. Promoting the replica and scaling out the group from prepared AMIs and launch templates fits within a 1-hour RTO.
    fr: |
      Il s'agit de l'environnement de veille (pilot light). Le cœur de la charge de travail, la base de données, est répliqué en continu, si bien que le RPO reste de quelques minutes, tandis que les serveurs d'application sont éteints (capacité nulle) et ne coûtent rien tant qu'ils ne sont pas nécessaires. Promouvoir le réplica et augmenter la capacité du groupe à partir d'AMI et de modèles de lancement préparés tient dans un RTO d'une heure.
  options:
    a: { en: "Daily snapshot copies give an RPO of up to 24 hours, which exceeds the required few minutes.", fr: "Des copies quotidiennes d'instantanés donnent un RPO pouvant atteindre 24 heures, ce qui dépasse les quelques minutes exigées." }
    b: { en: "This warm standby meets the objectives, but running instances and a load balancer at all times costs more than needed, since the servers do not have to run before a disaster.", fr: "Ce secours semi-automatique respecte les objectifs, mais exécuter en permanence des instances et un équilibreur de charge coûte plus que nécessaire, puisque les serveurs n'ont pas à s'exécuter avant un sinistre." }
    d: { en: "Running the full application in two Regions is the most expensive strategy and goes far beyond a 1-hour RTO.", fr: "Exécuter l'application complète dans deux Régions est la stratégie la plus coûteuse et va bien au-delà d'un RTO d'une heure." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
