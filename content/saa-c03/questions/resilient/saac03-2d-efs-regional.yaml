id: saac03-2d-efs-regional
objective: "2.2.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a content management application on Amazon EC2 Linux instances in an Auto Scaling group that spans three Availability Zones. All instances must read and write the same set of files at the same time through a shared NFS file system. The files must remain available if one Availability Zone fails.

    Which storage solution will meet these requirements?
  fr: |
    Une entreprise exécute une application de gestion de contenu sur des instances Amazon EC2 Linux dans un groupe Auto Scaling qui couvre trois zones de disponibilité. Toutes les instances doivent lire et écrire simultanément le même ensemble de fichiers via un système de fichiers NFS partagé. Les fichiers doivent rester disponibles si une zone de disponibilité tombe en panne.

    Quelle solution de stockage répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "An Amazon EFS One Zone file system in the first Availability Zone, mounted by all instances.", fr: "Un système de fichiers Amazon EFS One Zone dans la première zone de disponibilité, monté par toutes les instances." } }
    - { id: b, text: { en: "An Amazon EBS io2 volume with Multi-Attach enabled, attached to all instances.", fr: "Un volume Amazon EBS io2 avec Multi-Attach activé, attaché à toutes les instances." } }
    - { id: c, text: { en: "An Amazon EFS Regional file system with a mount target in each Availability Zone.", fr: "Un système de fichiers Amazon EFS régional avec une cible de montage dans chaque zone de disponibilité." } }
    - { id: d, text: { en: "Instance store volumes on each instance, kept in sync by a scheduled rsync job.", fr: "Des volumes de stockage d'instance sur chaque instance, synchronisés par une tâche rsync planifiée." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An EFS Regional file system stores data redundantly across multiple Availability Zones of the Region and stays available when an Availability Zone is lost. Instances in every Availability Zone mount it over NFS through the mount target of their zone and share the same files concurrently.
    fr: |
      Un système de fichiers EFS régional stocke les données de façon redondante dans plusieurs zones de disponibilité de la Région et reste disponible en cas de perte d'une zone de disponibilité. Les instances de chaque zone de disponibilité le montent en NFS via la cible de montage de leur zone et partagent simultanément les mêmes fichiers.
  options:
    a: { en: "EFS One Zone stores data in a single Availability Zone and is not resilient to the loss of that zone.", fr: "EFS One Zone stocke les données dans une seule zone de disponibilité et ne résiste pas à la perte de cette zone." }
    b: { en: "Multi-Attach works only for instances in the same Availability Zone as the volume and needs a cluster-aware file system; it is not an NFS share.", fr: "Multi-Attach ne fonctionne que pour des instances situées dans la même zone de disponibilité que le volume et exige un système de fichiers en cluster ; ce n'est pas un partage NFS." }
    d: { en: "Instance store data is lost when an instance stops or fails, and periodic copies do not give concurrent access to the same files.", fr: "Les données du stockage d'instance sont perdues à l'arrêt ou en cas de panne de l'instance, et des copies périodiques ne donnent pas un accès simultané aux mêmes fichiers." }
references:
  - title: Features of Amazon EFS
    url: https://docs.aws.amazon.com/efs/latest/ug/features.html
  - title: Attach an EBS volume to multiple EC2 instances using Multi-Attach
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html
