id: saac03-2b-sfn-express
objective: "2.1.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ride-sharing company processes vehicle location events at a rate of tens of thousands of events per second. Each event goes through a short workflow that validates it, enriches it, and stores it in Amazon DynamoDB. Each workflow completes in less than 2 seconds, and every step is idempotent. The company wants to orchestrate the steps with AWS Step Functions.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise de VTC traite des événements de localisation de véhicules à raison de dizaines de milliers d'événements par seconde. Chaque événement passe par un court flux de travail qui le valide, l'enrichit et le stocke dans Amazon DynamoDB. Chaque flux de travail se termine en moins de 2 secondes, et chaque étape est idempotente. L'entreprise veut orchestrer les étapes avec AWS Step Functions.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Use a Standard workflow for each event, and retrieve the execution history through the Step Functions API.", fr: "Utiliser un flux de travail Standard pour chaque événement, et récupérer l'historique d'exécution via l'API Step Functions." }
    - id: b
      text: { en: "Use a Standard workflow with a Distributed Map state that starts a child workflow execution for each event.", fr: "Utiliser un flux de travail Standard avec un état Distributed Map qui démarre une exécution de flux de travail enfant par événement." }
    - id: c
      text: { en: "Use an Express workflow for each event, and send the execution logs to Amazon CloudWatch Logs.", fr: "Utiliser un flux de travail Express pour chaque événement, et envoyer les journaux d'exécution vers Amazon CloudWatch Logs." }
    - id: d
      text: { en: "Use a Standard workflow in which each step waits for a callback task token before it continues.", fr: "Utiliser un flux de travail Standard dans lequel chaque étape attend un jeton de tâche de rappel avant de continuer." }
answer: { optionId: c }
explanation:
  correct:
    en: Express workflows are designed for high-volume, short-duration event processing (up to 5 minutes). They are billed on the number of executions, their duration, and memory, and have no state transition rate limit. Their at-least-once semantics are acceptable because the steps are idempotent, and their history is inspected through CloudWatch Logs.
    fr: Les flux de travail Express sont conçus pour le traitement d'événements à fort volume et de courte durée (jusqu'à 5 minutes). Ils sont facturés selon le nombre d'exécutions, leur durée et la mémoire, et n'ont pas de limite de débit de transitions d'état. Leur sémantique « au moins une fois » est acceptable puisque les étapes sont idempotentes, et leur historique se consulte via CloudWatch Logs.
  options:
    a:
      en: Standard workflows are billed per state transition and are subject to state transition throttling quotas, which is costly and constraining at tens of thousands of events per second.
      fr: Les flux de travail Standard sont facturés par transition d'état et soumis à des quotas de limitation des transitions d'état, ce qui est coûteux et contraignant à des dizaines de milliers d'événements par seconde.
    b:
      en: Distributed Map processes large datasets in parallel; each child execution of a Standard workflow still incurs per-transition charges, and the events arrive as a stream, not as a dataset.
      fr: Distributed Map traite de grands jeux de données en parallèle ; chaque exécution enfant d'un flux Standard entraîne toujours une facturation par transition, et les événements arrivent en flux, pas sous forme de jeu de données.
    d:
      en: Callback tokens are for waiting on external processes such as approvals; they add latency and transitions without any benefit here.
      fr: Les jetons de rappel servent à attendre des processus externes comme des approbations ; ils ajoutent de la latence et des transitions sans aucun avantage ici.
references:
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
