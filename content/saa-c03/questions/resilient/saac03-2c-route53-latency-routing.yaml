id: saac03-2c-route53-latency-routing
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs identical copies of its web application behind Application Load Balancers in the us-east-1, eu-west-1, and ap-southeast-1 Regions. Users around the world must be sent to the Region that gives them the fastest response. The company uses Amazon Route 53 for DNS.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute des copies identiques de son application web derrière des Application Load Balancers dans les Régions us-east-1, eu-west-1 et ap-southeast-1. Les utilisateurs du monde entier doivent être dirigés vers la Région qui leur offre la réponse la plus rapide. L'entreprise utilise Amazon Route 53 pour le DNS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create weighted alias records with equal weights that point to the three load balancers."
        fr: "Créer des enregistrements d'alias pondérés de poids égal qui pointent vers les trois équilibreurs de charge."
    - id: b
      text:
        en: "Create latency alias records, one for each Region, that point to the three load balancers."
        fr: "Créer des enregistrements d'alias de latence, un par Région, qui pointent vers les trois équilibreurs de charge."
    - id: c
      text:
        en: "Create a multivalue answer record that returns the addresses of the three load balancers."
        fr: "Créer un enregistrement de réponse à valeurs multiples qui renvoie les adresses des trois équilibreurs de charge."
    - id: d
      text:
        en: "Create failover alias records with us-east-1 as primary and the two other Regions as secondary."
        fr: "Créer des enregistrements d'alias de basculement avec us-east-1 comme principal et les deux autres Régions comme secondaires."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The latency routing policy is used when resources run in several AWS Regions and each user should be routed to the Region with the best latency. Route 53 answers each query with the record of the Region that has the lowest latency for that user.
    fr: |
      La politique de routage par latence s'utilise lorsque des ressources s'exécutent dans plusieurs Régions AWS et que chaque utilisateur doit être dirigé vers la Région offrant la meilleure latence. Route 53 répond à chaque requête avec l'enregistrement de la Région qui présente la latence la plus faible pour cet utilisateur.
  options:
    a:
      en: |
        Weighted routing splits traffic in fixed proportions; a user in Asia would often be sent to a distant Region.
      fr: |
        Le routage pondéré répartit le trafic selon des proportions fixes ; un utilisateur en Asie serait souvent dirigé vers une Région éloignée.
    c:
      en: |
        Multivalue answer returns up to eight healthy records selected at random, without considering latency.
      fr: |
        Le routage à valeurs multiples renvoie jusqu'à huit enregistrements sains choisis au hasard, sans tenir compte de la latence.
    d:
      en: |
        Failover routing is active-passive: all users go to the primary Region while it is healthy, regardless of their location.
      fr: |
        Le routage de basculement est actif-passif : tous les utilisateurs vont vers la Région principale tant qu'elle est saine, quel que soit leur emplacement.
references:
  - title: Choosing a routing policy
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html
