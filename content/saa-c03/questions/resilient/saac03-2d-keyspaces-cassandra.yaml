id: saac03-2d-keyspaces-cassandra
objective: "2.2.20"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company stores vehicle telemetry in a self-managed Apache Cassandra cluster on Amazon EC2. The operations team spends a lot of time replacing failed nodes, patching, and adding capacity.

    The company wants a serverless, highly available database service that scales automatically and lets it keep its existing Cassandra application code and tools.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique stocke la télémétrie de ses véhicules dans un cluster Apache Cassandra autogéré sur Amazon EC2. L'équipe des opérations passe beaucoup de temps à remplacer des nœuds défaillants, à appliquer des correctifs et à ajouter de la capacité.

    L'entreprise veut un service de base de données serverless et hautement disponible qui se met à l'échelle automatiquement et lui permet de conserver son code applicatif et ses outils Cassandra existants.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Migrate the data to Amazon DynamoDB tables in on-demand capacity mode.", fr: "Migrer les données vers des tables Amazon DynamoDB en mode de capacité à la demande." } }
    - { id: b, text: { en: "Migrate the data to Amazon DocumentDB (with MongoDB compatibility).", fr: "Migrer les données vers Amazon DocumentDB (with MongoDB compatibility)." } }
    - { id: c, text: { en: "Migrate the data to Amazon Neptune.", fr: "Migrer les données vers Amazon Neptune." } }
    - { id: d, text: { en: "Migrate the data to Amazon Keyspaces (for Apache Cassandra).", fr: "Migrer les données vers Amazon Keyspaces (for Apache Cassandra)." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon Keyspaces is a managed, serverless, Apache Cassandra-compatible database service. Existing Cassandra workloads run with the same application code and developer tools, and tables scale up and down automatically with traffic, so there are no nodes to replace or patch.
    fr: |
      Amazon Keyspaces est un service de base de données géré, serverless et compatible Apache Cassandra. Les charges de travail Cassandra existantes s'exécutent avec le même code applicatif et les mêmes outils de développement, et les tables se mettent à l'échelle automatiquement selon le trafic : il n'y a aucun nœud à remplacer ni à corriger.
  options:
    a: { en: "DynamoDB is serverless, but it has its own API, so the Cassandra application code would have to be rewritten.", fr: "DynamoDB est serverless, mais il possède sa propre API : le code applicatif Cassandra devrait être réécrit." }
    b: { en: "DocumentDB is compatible with MongoDB, not Cassandra, so the application would have to change.", fr: "DocumentDB est compatible avec MongoDB, pas avec Cassandra : l'application devrait changer." }
    c: { en: "Neptune is a graph database queried with Gremlin, openCypher, or SPARQL; it does not run Cassandra workloads.", fr: "Neptune est une base de données orientée graphe interrogée en Gremlin, openCypher ou SPARQL ; elle n'exécute pas de charges de travail Cassandra." }
references:
  - title: What is Amazon Keyspaces (for Apache Cassandra)?
    url: https://docs.aws.amazon.com/keyspaces/latest/devguide/what-is-keyspaces.html
