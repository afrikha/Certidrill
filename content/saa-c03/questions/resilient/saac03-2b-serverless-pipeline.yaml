id: saac03-2b-serverless-pipeline
objective: "2.1.21"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company receives CSV files that partners upload to an Amazon S3 bucket at irregular intervals, from a few files per week to hundreds per hour. Each file must be parsed in less than 1 minute, and each row must be stored so that the tracking application can retrieve it by shipment ID with single-digit millisecond latency. The company wants no servers to manage and no charges for idle capacity.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de logistique reçoit des fichiers CSV que des partenaires chargent dans un compartiment Amazon S3 à intervalles irréguliers, de quelques fichiers par semaine à des centaines par heure. Chaque fichier doit être analysé en moins d'une minute, et chaque ligne doit être stockée pour que l'application de suivi puisse la récupérer par ID d'expédition avec une latence de l'ordre de quelques millisecondes. L'entreprise ne veut aucun serveur à gérer et aucun coût de capacité inactive.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Store the rows in an Amazon RDS for PostgreSQL DB instance with an index on the shipment ID.", fr: "Stocker les lignes dans une instance Amazon RDS for PostgreSQL avec un index sur l'ID d'expédition." }
    - id: b
      text: { en: "Configure an S3 event notification that invokes an AWS Lambda function to parse each new file.", fr: "Configurer une notification d'événement S3 qui appelle une fonction AWS Lambda pour analyser chaque nouveau fichier." }
    - id: c
      text: { en: "Run an Auto Scaling group of Amazon EC2 instances that polls the bucket every minute for new files.", fr: "Exécuter un groupe Auto Scaling d'instances Amazon EC2 qui interroge le compartiment chaque minute à la recherche de nouveaux fichiers." }
    - id: d
      text: { en: "Store the rows in an Amazon DynamoDB table in on-demand capacity mode with the shipment ID as the partition key.", fr: "Stocker les lignes dans une table Amazon DynamoDB en mode de capacité à la demande avec l'ID d'expédition comme clé de partition." }
    - id: e
      text: { en: "Load the rows into an Amazon Redshift provisioned cluster that the tracking application queries.", fr: "Charger les lignes dans un cluster provisionné Amazon Redshift interrogé par l'application de suivi." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: An S3 event notification invokes Lambda only when a file arrives, and a sub-minute parse fits well within the Lambda timeout. DynamoDB is a serverless key-value database with single-digit millisecond performance, and on-demand mode bills per request and scales to zero, so nothing is paid for idle capacity.
    fr: Une notification d'événement S3 n'appelle Lambda qu'à l'arrivée d'un fichier, et une analyse de moins d'une minute tient largement dans le délai d'expiration de Lambda. DynamoDB est une base de données clé-valeur sans serveur aux performances de l'ordre de quelques millisecondes, et le mode à la demande facture par requête et descend à zéro ; rien n'est donc payé pour une capacité inactive.
  options:
    a:
      en: An RDS DB instance is billed every hour whether or not files arrive, so idle capacity is charged.
      fr: Une instance RDS est facturée chaque heure, que des fichiers arrivent ou non ; la capacité inactive est donc facturée.
    c:
      en: EC2 instances are servers to manage, and polling keeps them running between uploads.
      fr: Les instances EC2 sont des serveurs à gérer, et l'interrogation les maintient en marche entre les chargements.
    e:
      en: Redshift is a data warehouse for analytics, not a low-latency lookup store, and a provisioned cluster is billed while idle.
      fr: Redshift est un entrepôt de données pour l'analyse, pas un magasin de recherche à faible latence, et un cluster provisionné est facturé pendant l'inactivité.
references:
  - title: Amazon S3 Event Notifications
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
