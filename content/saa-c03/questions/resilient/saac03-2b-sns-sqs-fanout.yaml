id: saac03-2b-sns-sqs-fanout
objective: "2.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce company runs an order service that must notify three independent backend applications (billing, shipping, and analytics) each time an order is placed. Each application must receive its own copy of every order message and must be able to process the messages at its own pace, even if the application is temporarily offline.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce électronique exécute un service de commandes qui doit notifier trois applications backend indépendantes (facturation, expédition et analyse) chaque fois qu'une commande est passée. Chaque application doit recevoir sa propre copie de chaque message de commande et pouvoir traiter les messages à son propre rythme, même si elle est temporairement hors ligne.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send each order message to a single Amazon SQS standard queue that all three applications poll.", fr: "Envoyer chaque message de commande dans une seule file d'attente standard Amazon SQS interrogée par les trois applications." }
    - id: b
      text: { en: "Publish each order message to an Amazon SNS topic that has an HTTPS subscription for the endpoint of each application.", fr: "Publier chaque message de commande dans une rubrique Amazon SNS qui possède un abonnement HTTPS vers le point de terminaison de chaque application." }
    - id: c
      text: { en: "Publish each order message to an Amazon SNS topic, and subscribe a separate Amazon SQS queue for each application to the topic.", fr: "Publier chaque message de commande dans une rubrique Amazon SNS, et abonner à la rubrique une file d'attente Amazon SQS distincte pour chaque application." }
    - id: d
      text: { en: "Send each order message to an Amazon SQS FIFO queue, and use a different message group ID for each application.", fr: "Envoyer chaque message de commande dans une file d'attente FIFO Amazon SQS, avec un ID de groupe de messages différent pour chaque application." }
answer: { optionId: c }
explanation:
  correct:
    en: This is the SNS-to-SQS fanout pattern. Amazon SNS delivers a copy of each published message to every subscribed queue, and each SQS queue stores its copy until the application polls and processes it. The applications are decoupled from the order service and from each other, and none of them needs to be online when the message is published.
    fr: "C'est le modèle de diffusion (fanout) SNS vers SQS. Amazon SNS remet une copie de chaque message publié à chaque file d'attente abonnée, et chaque file d'attente SQS conserve sa copie jusqu'à ce que l'application l'interroge et la traite. Les applications sont découplées du service de commandes et entre elles, et aucune n'a besoin d'être en ligne au moment de la publication."
  options:
    a:
      en: Consumers of one queue compete for messages. Each message is processed by only one application, so the three applications do not each get a copy.
      fr: Les consommateurs d'une même file d'attente se partagent les messages. Chaque message n'est traité que par une seule application ; les trois applications ne reçoivent donc pas chacune une copie.
    b:
      en: HTTPS subscriptions push messages to endpoints that must be reachable. Nothing stores the messages for an application that is offline for a long time or that wants to consume at its own pace.
      fr: Les abonnements HTTPS poussent les messages vers des points de terminaison qui doivent être joignables. Rien ne conserve les messages pour une application hors ligne pendant longtemps ou qui veut consommer à son propre rythme.
    d:
      en: A message group ID orders related messages inside one FIFO queue. Each message is still delivered to only one consumer, so the message is not copied to each application.
      fr: Un ID de groupe de messages ordonne les messages liés au sein d'une file d'attente FIFO. Chaque message n'est toujours remis qu'à un seul consommateur ; il n'est donc pas copié pour chaque application.
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
