id: saac03-2d-xray-apigw-lambda
objective: "2.2.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a serverless order API. An Amazon API Gateway REST API invokes AWS Lambda functions that write to an Amazon DynamoDB table. Customers report that some requests are slow, and the developers cannot tell whether the time is spent in API Gateway or in one of the functions.

    A solutions architect must give the developers an end-to-end view of sampled requests, with a breakdown of the time spent in each component, with the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une API de commandes serverless. Une API REST Amazon API Gateway appelle des fonctions AWS Lambda qui écrivent dans une table Amazon DynamoDB. Des clients signalent que certaines requêtes sont lentes, et les développeurs ne savent pas si le temps est passé dans API Gateway ou dans l'une des fonctions.

    Un architecte de solutions doit fournir aux développeurs une vue de bout en bout des requêtes échantillonnées, avec la répartition du temps passé dans chaque composant, avec le MOINS de charge opérationnelle possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on AWS CloudTrail data events for the Lambda functions and query the events with Amazon Athena.", fr: "Activer les événements de données AWS CloudTrail pour les fonctions Lambda et interroger les événements avec Amazon Athena." } }
    - { id: b, text: { en: "Enable AWS X-Ray tracing on the API Gateway stage and redeploy the API.", fr: "Activer le suivi AWS X-Ray sur l'étape API Gateway et redéployer l'API." } }
    - { id: c, text: { en: "Enable API Gateway access logging to Amazon CloudWatch Logs and create a metric filter on the latency field.", fr: "Activer la journalisation des accès API Gateway vers Amazon CloudWatch Logs et créer un filtre de métriques sur le champ de latence." } }
    - { id: d, text: { en: "Enable active tracing on the Lambda functions so that Lambda sends trace segments to AWS X-Ray.", fr: "Activer le suivi actif sur les fonctions Lambda afin que Lambda envoie des segments de trace à AWS X-Ray." } }
    - { id: e, text: { en: "Create VPC Flow Logs for the VPC and analyze them with CloudWatch Logs Insights.", fr: "Créer des journaux de flux VPC pour le VPC et les analyser avec CloudWatch Logs Insights." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      AWS X-Ray builds end-to-end traces and a service map from segments sent by each component. X-Ray tracing is a stage setting of an API Gateway REST API, and active tracing is a configuration setting of a Lambda function (`TracingConfig` mode `Active`); neither requires new infrastructure. Together they show, for each sampled request, the time spent in API Gateway and in each function.
    fr: |
      AWS X-Ray construit des traces de bout en bout et une cartographie des services à partir des segments envoyés par chaque composant. Le suivi X-Ray est un paramètre d'étape d'une API REST API Gateway, et le suivi actif est un paramètre de configuration d'une fonction Lambda (mode `Active` de `TracingConfig`) ; aucun des deux ne demande d'infrastructure supplémentaire. Ensemble, ils montrent pour chaque requête échantillonnée le temps passé dans API Gateway et dans chaque fonction.
  options:
    a: { en: "CloudTrail data events record who invoked a function and when; they contain no timing breakdown of a request across components.", fr: "Les événements de données CloudTrail enregistrent qui a appelé une fonction et quand ; ils ne contiennent aucune répartition du temps d'une requête entre les composants." }
    c: { en: "Access logs give the total latency seen by API Gateway, not the time spent inside each function or downstream call, and they do not link the components of a request.", fr: "Les journaux d'accès donnent la latence totale vue par API Gateway, pas le temps passé dans chaque fonction ou appel en aval, et ils ne relient pas les composants d'une requête." }
    e: { en: "Flow logs record IP traffic metadata (addresses, ports, bytes), not application-level latency per request.", fr: "Les journaux de flux enregistrent des métadonnées de trafic IP (adresses, ports, octets), pas la latence applicative par requête." }
references:
  - title: Amazon API Gateway active tracing support for AWS X-Ray
    url: https://docs.aws.amazon.com/xray/latest/devguide/xray-services-apigateway.html
  - title: Visualize Lambda Event Function invocations using AWS X-Ray
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-xray.html
