id: saac03-2a-gateway-endpoints-tier
objective: "2.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    The application tier of a three-tier application runs in private subnets in two Availability Zones. It reads and writes large volumes of data in Amazon S3 and Amazon DynamoDB in the same Region through NAT gateways, and the NAT gateway data processing charges are high. The application tier still needs the NAT gateways to call a few third-party APIs on the internet. The company wants the S3 and DynamoDB traffic to stay on the AWS network in the MOST cost-effective way.

    Which solution will meet these requirements?
  fr: |
    Le niveau application d'une application à trois niveaux s'exécute dans des sous-réseaux privés de deux zones de disponibilité. Il lit et écrit de gros volumes de données dans Amazon S3 et Amazon DynamoDB dans la même Région via des passerelles NAT, et les frais de traitement de données des passerelles NAT sont élevés. Le niveau application a toujours besoin des passerelles NAT pour appeler quelques API tierces sur Internet. L'entreprise veut que le trafic vers S3 et DynamoDB reste sur le réseau AWS de la façon la PLUS rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create interface VPC endpoints for Amazon S3 and DynamoDB in the private subnets, and enable private DNS on the endpoints.", fr: "Créer des points de terminaison de VPC d'interface pour Amazon S3 et DynamoDB dans les sous-réseaux privés, et activer le DNS privé sur ces points de terminaison." }
    - id: b
      text: { en: "Move the application tier to public subnets, and assign a public IP address to each instance.", fr: "Déplacer le niveau application dans des sous-réseaux publics, et attribuer une adresse IP publique à chaque instance." }
    - id: c
      text: { en: "Create gateway VPC endpoints for Amazon S3 and DynamoDB, and associate them with the route tables of the private subnets.", fr: "Créer des points de terminaison de VPC de passerelle pour Amazon S3 et DynamoDB, et les associer aux tables de routage des sous-réseaux privés." }
    - id: d
      text: { en: "Replace the NAT gateways with NAT instances on smaller EC2 instance types in each Availability Zone.", fr: "Remplacer les passerelles NAT par des instances NAT sur des types d'instances EC2 plus petits dans chaque zone de disponibilité." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Gateway endpoints exist for Amazon S3 and DynamoDB only and have no additional charge. They add a route to the service prefix list in the selected route tables, so traffic to these services in the same Region bypasses the NAT gateways and stays on the AWS network, while other internet traffic still uses the NAT gateways.
    fr: |
      Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB et n'entraînent aucun coût supplémentaire. Ils ajoutent une route vers la liste de préfixes du service dans les tables de routage sélectionnées : le trafic vers ces services dans la même Région contourne les passerelles NAT et reste sur le réseau AWS, tandis que le reste du trafic Internet utilise toujours les passerelles NAT.
  options:
    a: { en: "Interface endpoints also keep the traffic private, but they are billed per hour and per gigabyte processed, so they cost more than free gateway endpoints.", fr: "Les points de terminaison d'interface gardent aussi le trafic privé, mais ils sont facturés à l'heure et au gigaoctet traité : ils coûtent plus cher que les points de terminaison de passerelle gratuits." }
    b: { en: "Public subnets expose the application tier to the internet and break the multi-tier design.", fr: "Des sous-réseaux publics exposent le niveau application à Internet et cassent la conception à plusieurs niveaux." }
    d: { en: "NAT instances still carry all the traffic, add instances to manage and patch, and reduce availability.", fr: "Des instances NAT transportent toujours tout le trafic, ajoutent des instances à gérer et à corriger, et réduisent la disponibilité." }
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
