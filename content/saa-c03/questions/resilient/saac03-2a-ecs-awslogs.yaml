id: saac03-2a-ecs-awslogs
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating a web application to containers on Amazon ECS with AWS Fargate. On premises, the application wrote its logs to local files that operators read on the servers. On Fargate, operators cannot sign in to the hosts, and the logs are lost when tasks stop. The application can be configured to write its logs to standard output. The company wants the logs centralized, searchable and retained after tasks stop, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre une application web vers des conteneurs sur Amazon ECS avec AWS Fargate. Sur site, l'application écrivait ses journaux dans des fichiers locaux que les opérateurs lisaient sur les serveurs. Sur Fargate, les opérateurs ne peuvent pas se connecter aux hôtes, et les journaux sont perdus à l'arrêt des tâches. L'application peut être configurée pour écrire ses journaux sur la sortie standard. L'entreprise veut des journaux centralisés, consultables et conservés après l'arrêt des tâches, avec le MOINS d'effort.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the awslogs log driver in the container definition so that container output is sent to Amazon CloudWatch Logs.", fr: "Configurer le pilote de journalisation awslogs dans la définition de conteneur afin que la sortie du conteneur soit envoyée à Amazon CloudWatch Logs." }
    - id: b
      text: { en: "Write the logs to the task's ephemeral storage, and run a cron job in the container that copies them to Amazon S3 every hour.", fr: "Écrire les journaux dans le stockage éphémère de la tâche, et exécuter dans le conteneur une tâche cron qui les copie dans Amazon S3 toutes les heures." }
    - id: c
      text: { en: "Enable VPC Flow Logs on the subnets of the tasks, and publish the flow logs to Amazon CloudWatch Logs.", fr: "Activer les journaux de flux VPC sur les sous-réseaux des tâches, et publier les journaux de flux dans Amazon CloudWatch Logs." }
    - id: d
      text: { en: "Turn on AWS CloudTrail for the account, and search the trail for the application log entries.", fr: "Activer AWS CloudTrail pour le compte, et rechercher les entrées de journal de l'application dans le journal de suivi." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The awslogs log driver, set in the logConfiguration of the task definition, sends the container's stdout and stderr to CloudWatch Logs, where logs are retained and searchable after tasks stop. It works on Fargate and needs only task definition settings and the usual permissions of the task execution role.
    fr: |
      Le pilote de journalisation awslogs, défini dans la logConfiguration de la définition de tâche, envoie stdout et stderr du conteneur à CloudWatch Logs, où les journaux restent conservés et consultables après l'arrêt des tâches. Il fonctionne sur Fargate et ne nécessite que des paramètres de la définition de tâche et les autorisations habituelles du rôle d'exécution de tâche.
  options:
    b: { en: "Ephemeral storage is deleted when the task stops, so logs written since the last copy are lost, and the cron job is extra code to maintain.", fr: "Le stockage éphémère est supprimé à l'arrêt de la tâche : les journaux écrits depuis la dernière copie sont perdus, et la tâche cron est du code supplémentaire à maintenir." }
    c: { en: "VPC Flow Logs capture IP traffic metadata, not application log messages.", fr: "Les journaux de flux VPC capturent des métadonnées de trafic IP, pas les messages de journal de l'application." }
    d: { en: "CloudTrail records AWS API calls, not the output of the application.", fr: "CloudTrail enregistre les appels d'API AWS, pas la sortie de l'application." }
references:
  - title: Send Amazon ECS logs to CloudWatch
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/using_awslogs.html
