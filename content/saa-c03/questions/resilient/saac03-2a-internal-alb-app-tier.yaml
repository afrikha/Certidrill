id: saac03-2a-internal-alb-app-tier
objective: "2.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    In a multi-tier application, web servers in an Auto Scaling group in private subnets call an application tier over HTTP. The application tier runs in another Auto Scaling group in private subnets of two Availability Zones, and its instance IP addresses change as it scales. The application tier must not be reachable from the internet, and requests must be spread across the healthy application instances.

    Which solution will meet these requirements?
  fr: |
    Dans une application à plusieurs niveaux, des serveurs web d'un groupe Auto Scaling situés dans des sous-réseaux privés appellent un niveau application en HTTP. Le niveau application s'exécute dans un autre groupe Auto Scaling dans des sous-réseaux privés de deux zones de disponibilité, et les adresses IP de ses instances changent au fil de la mise à l'échelle. Le niveau application ne doit pas être accessible depuis Internet, et les requêtes doivent être réparties entre les instances d'application saines.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a second internet-facing Application Load Balancer for the application tier, and restrict it with a security group that allows only the web servers.", fr: "Créer un second Application Load Balancer accessible sur Internet pour le niveau application, et le restreindre avec un groupe de sécurité qui n'autorise que les serveurs web." }
    - id: b
      text: { en: "Create an internal Application Load Balancer in the private subnets, attach it to the application tier's Auto Scaling group, and have the web servers call its DNS name.", fr: "Créer un Application Load Balancer interne dans les sous-réseaux privés, l'attacher au groupe Auto Scaling du niveau application, et faire appeler son nom DNS par les serveurs web." }
    - id: c
      text: { en: "Create an A record for each application instance in a Route 53 public hosted zone, and have the web servers resolve the records.", fr: "Créer un enregistrement A pour chaque instance d'application dans une zone hébergée publique Route 53, et faire résoudre ces enregistrements par les serveurs web." }
    - id: d
      text: { en: "Associate an Elastic IP address with each application instance, and configure the web servers with the list of addresses.", fr: "Associer une adresse IP Elastic à chaque instance d'application, et configurer les serveurs web avec la liste des adresses." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The nodes of an internal load balancer have only private IP addresses, so it accepts requests only from clients that can reach the VPC. Attaching it to the application tier's Auto Scaling group registers new instances automatically, and it routes each request to healthy targets in both Availability Zones.
    fr: |
      Les nœuds d'un équilibreur de charge interne n'ont que des adresses IP privées : il n'accepte que les requêtes des clients qui ont accès au VPC. L'attacher au groupe Auto Scaling du niveau application enregistre automatiquement les nouvelles instances, et il dirige chaque requête vers des cibles saines dans les deux zones de disponibilité.
  options:
    a: { en: "An internet-facing load balancer has public IP addresses and a publicly reachable DNS name, which exposes the application tier to the internet.", fr: "Un équilibreur de charge accessible sur Internet a des adresses IP publiques et un nom DNS joignable publiquement, ce qui expose le niveau application à Internet." }
    c: { en: "Static DNS records do not follow scaling events, are not health aware, and publish the instances in a public zone.", fr: "Des enregistrements DNS statiques ne suivent pas les événements de mise à l'échelle, ne tiennent pas compte de l'état des instances et publient les instances dans une zone publique." }
    d: { en: "Elastic IP addresses are public addresses, and a fixed list neither balances load nor follows instances that are replaced.", fr: "Les adresses IP Elastic sont des adresses publiques, et une liste fixe n'équilibre pas la charge et ne suit pas les instances remplacées." }
references:
  - title: How Elastic Load Balancing works
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
