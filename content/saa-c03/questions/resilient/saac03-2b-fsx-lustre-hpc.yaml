id: saac03-2b-fsx-lustre-hpc
objective: "2.1.22"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An automotive company runs computational fluid dynamics simulations on hundreds of Linux Amazon EC2 instances. The input datasets are stored in Amazon S3. The simulations need a shared POSIX file system with sub-millisecond latency and very high aggregate throughput, and the results must be written back to the S3 bucket when the jobs finish.

    Which storage solution will meet these requirements?
  fr: |
    Un constructeur automobile exécute des simulations de mécanique des fluides numérique sur des centaines d'instances Amazon EC2 Linux. Les jeux de données d'entrée sont stockés dans Amazon S3. Les simulations ont besoin d'un système de fichiers POSIX partagé avec une latence inférieure à la milliseconde et un débit agrégé très élevé, et les résultats doivent être réécrits dans le compartiment S3 à la fin des tâches.

    Quelle solution de stockage permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon EFS Regional file system that AWS DataSync fills from the S3 bucket before each run", fr: "Un système de fichiers régional Amazon EFS qu'AWS DataSync remplit depuis le compartiment S3 avant chaque exécution" }
    - id: b
      text: { en: "An Amazon FSx for Lustre file system linked to the S3 bucket through a data repository association", fr: "Un système de fichiers Amazon FSx for Lustre lié au compartiment S3 par une association de référentiel de données" }
    - id: c
      text: { en: "An Amazon FSx for Windows File Server file system that the instances mount over SMB", fr: "Un système de fichiers Amazon FSx for Windows File Server que les instances montent via SMB" }
    - id: d
      text: { en: "The S3 bucket itself, accessed through the S3 API by every instance during the simulation", fr: "Le compartiment S3 lui-même, auquel chaque instance accède via l'API S3 pendant la simulation" }
answer: { optionId: b }
explanation:
  correct:
    en: FSx for Lustre is a managed high-performance POSIX file system for HPC and machine learning, with sub-millisecond latencies and very high throughput. When it is linked to an S3 bucket, the objects appear as files, and data can be exported back to S3 when the jobs finish.
    fr: FSx for Lustre est un système de fichiers POSIX hautes performances géré pour le HPC et le machine learning, avec des latences inférieures à la milliseconde et un débit très élevé. Lorsqu'il est lié à un compartiment S3, les objets apparaissent comme des fichiers, et les données peuvent être réexportées vers S3 à la fin des tâches.
  options:
    a:
      en: EFS is a general-purpose shared file system with no native link to S3; copying data in and out with DataSync adds steps, and EFS is not built for this HPC performance profile.
      fr: EFS est un système de fichiers partagé généraliste sans lien natif avec S3 ; copier les données dans les deux sens avec DataSync ajoute des étapes, et EFS n'est pas conçu pour ce profil de performances HPC.
    c:
      en: FSx for Windows File Server provides SMB shares for Windows workloads, not a Lustre-class parallel file system linked to S3.
      fr: FSx for Windows File Server fournit des partages SMB pour des charges Windows, pas un système de fichiers parallèle de type Lustre lié à S3.
    d:
      en: S3 is object storage accessed through an API; it is not a shared POSIX file system.
      fr: S3 est un stockage d'objets accessible via une API ; ce n'est pas un système de fichiers POSIX partagé.
references:
  - title: What is Amazon FSx for Lustre?
    url: https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html
