id: saac03-2a-apigw-private-api
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs an internal API on AWS Lambda. Only applications that run in two of the company's VPCs must be able to call the API. The traffic must not traverse the public internet, and the API must reject requests that come from any other network.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers exécute une API interne sur AWS Lambda. Seules les applications qui s'exécutent dans deux des VPC de l'entreprise doivent pouvoir appeler l'API. Le trafic ne doit pas transiter par Internet, et l'API doit rejeter les requêtes provenant de tout autre réseau.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an API Gateway HTTP API, create a VPC link to each VPC, and restrict access with a JWT authorizer.", fr: "Créer une API HTTP API Gateway, créer un lien VPC vers chaque VPC, et restreindre l'accès avec un mécanisme d'autorisation JWT." }
    - id: b
      text: { en: "Create a private API Gateway REST API, create an interface VPC endpoint for API Gateway in each VPC, and add a resource policy that allows only those endpoints.", fr: "Créer une API REST API Gateway privée, créer un point de terminaison de VPC d'interface pour API Gateway dans chaque VPC, et ajouter une politique de ressource qui n'autorise que ces points de terminaison." }
    - id: c
      text: { en: "Create an edge-optimized REST API, and attach an AWS WAF web ACL that allows only the NAT gateway IP addresses of the two VPCs.", fr: "Créer une API REST optimisée pour la périphérie, et associer une ACL web AWS WAF qui n'autorise que les adresses IP des passerelles NAT des deux VPC." }
    - id: d
      text: { en: "Create a Regional REST API, and add a resource policy that allows only requests whose aws:SourceVpc value matches one of the two VPCs.", fr: "Créer une API REST régionale, et ajouter une politique de ressource qui n'autorise que les requêtes dont la valeur aws:SourceVpc correspond à l'un des deux VPC." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A private REST API can be invoked only from a VPC through an interface VPC endpoint (AWS PrivateLink), so traffic stays on the AWS network. A resource policy with an `aws:SourceVpce` (or `aws:SourceVpc`) condition limits the callers to the endpoints of the two VPCs and denies every other source.
    fr: |
      Une API REST privée ne peut être appelée que depuis un VPC via un point de terminaison de VPC d'interface (AWS PrivateLink) : le trafic reste sur le réseau AWS. Une politique de ressource avec une condition `aws:SourceVpce` (ou `aws:SourceVpc`) limite les appelants aux points de terminaison des deux VPC et refuse toute autre source.
  options:
    a:
      en: |
        HTTP APIs cannot be private; their VPC links connect the API to private backend resources, not clients to the API, so the API stays publicly reachable.
      fr: |
        Les API HTTP ne peuvent pas être privées ; leurs liens VPC connectent l'API à des ressources backend privées, pas les clients à l'API : l'API reste accessible publiquement.
    c:
      en: |
        An edge-optimized endpoint is public, and calls through NAT gateways cross the internet, which violates the requirement.
      fr: |
        Un point de terminaison optimisé pour la périphérie est public, et les appels via des passerelles NAT traversent Internet, ce qui enfreint l'exigence.
    d:
      en: |
        A Regional endpoint is public and is reached over the internet, and the aws:SourceVpc key is present only in requests that arrive through a VPC endpoint, so this design is neither private nor workable.
      fr: |
        Un point de terminaison régional est public et joint via Internet, et la clé aws:SourceVpc n'est présente que dans les requêtes qui arrivent par un point de terminaison de VPC : cette conception n'est ni privée ni fonctionnelle.
references:
  - title: Private REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-private-apis.html
