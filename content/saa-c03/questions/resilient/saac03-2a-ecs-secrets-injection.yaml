id: saac03-2a-ecs-secrets-injection
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is containerizing a legacy Java application to run on Amazon ECS with AWS Fargate. Today, the database password is hard-coded in a properties file that is copied into the image. The security team requires that the image contain no credentials and that the password be stored encrypted and managed centrally. The application can already read the password from an environment variable, and its code must not change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conteneurise une application Java existante pour l'exécuter sur Amazon ECS avec AWS Fargate. Aujourd'hui, le mot de passe de la base de données est codé en dur dans un fichier de propriétés copié dans l'image. L'équipe de sécurité exige que l'image ne contienne aucune information d'identification et que le mot de passe soit stocké chiffré et géré de façon centralisée. L'application sait déjà lire le mot de passe dans une variable d'environnement, et son code ne doit pas changer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the password as a plaintext value in the environment section of the container definition in the task definition.", fr: "Ajouter le mot de passe en clair dans la section environment de la définition de conteneur de la définition de tâche." }
    - id: b
      text: { en: "Store the password in AWS Secrets Manager, and reference the secret in the secrets section of the container definition.", fr: "Stocker le mot de passe dans AWS Secrets Manager, et référencer le secret dans la section secrets de la définition de conteneur." }
    - id: c
      text: { en: "Pass the password as a Docker build argument when the image is built, and set the environment variable from it.", fr: "Transmettre le mot de passe comme argument de build Docker lors de la création de l'image, et en déduire la variable d'environnement." }
    - id: d
      text: { en: "Store the password in an Amazon S3 object, and download it in the container entrypoint script at startup.", fr: "Stocker le mot de passe dans un objet Amazon S3, et le télécharger dans le script de point d'entrée du conteneur au démarrage." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `secrets` parameter of an ECS container definition injects a Secrets Manager secret into the container as an environment variable when the container starts. The task execution role needs permission to read the secret, the image contains no credentials, and the application code does not change.
    fr: |
      Le paramètre `secrets` d'une définition de conteneur ECS injecte un secret Secrets Manager dans le conteneur sous forme de variable d'environnement au démarrage du conteneur. Le rôle d'exécution de tâche doit avoir l'autorisation de lire le secret, l'image ne contient aucune information d'identification, et le code de l'application ne change pas.
  options:
    a: { en: "Plaintext environment values are visible in the task definition, so the password is neither encrypted nor centrally managed.", fr: "Les valeurs d'environnement en clair sont visibles dans la définition de tâche : le mot de passe n'est ni chiffré ni géré de façon centralisée." }
    c: { en: "Build arguments end up in the image metadata and layers, so the image would still contain the password.", fr: "Les arguments de build se retrouvent dans les métadonnées et les couches de l'image : l'image contiendrait toujours le mot de passe." }
    d: { en: "An S3 object is not a managed secret, and adding a download step changes the image and its startup logic.", fr: "Un objet S3 n'est pas un secret géré, et ajouter une étape de téléchargement modifie l'image et sa logique de démarrage." }
references:
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
