id: saac03-2c-warm-standby-reduced-traffic
objective: "2.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application in us-east-1 and plans disaster recovery in us-west-2. In a disaster, us-west-2 must be able to serve a reduced amount of production traffic immediately, without first launching or starting servers, and then scale to full capacity. The database must be replicated continuously to us-west-2. The company wants the lowest-cost strategy that meets these requirements.

    Which disaster recovery strategy should the company use?
  fr: |
    Une entreprise exécute une application web dans us-east-1 et prévoit une reprise après sinistre dans us-west-2. En cas de sinistre, us-west-2 doit pouvoir servir immédiatement une partie réduite du trafic de production, sans lancer ni démarrer de serveurs au préalable, puis passer à pleine capacité. La base de données doit être répliquée en continu vers us-west-2. L'entreprise souhaite la stratégie la moins coûteuse qui réponde à ces exigences.

    Quelle stratégie de reprise après sinistre l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text:
        en: "Pilot light: replicate the database, keep AMIs and launch templates ready, and keep zero application servers running until failover."
        fr: "Environnement de veille (pilot light) : répliquer la base de données, garder les AMI et les modèles de lancement prêts, et n'exécuter aucun serveur d'application avant le basculement."
    - id: b
      text:
        en: "Warm standby: replicate the database and run a scaled-down but fully functional copy of the application that scales up after failover."
        fr: "Secours semi-automatique (warm standby) : répliquer la base de données et exécuter une copie réduite mais entièrement fonctionnelle de l'application, qui monte en charge après le basculement."
    - id: c
      text:
        en: "Multi-site active/active: run full production capacity in both Regions and serve traffic from both Regions at all times."
        fr: "Multisite actif/actif : exécuter la pleine capacité de production dans les deux Régions et servir le trafic depuis les deux Régions en permanence."
    - id: d
      text:
        en: "Backup and restore: copy nightly backups to us-west-2 and redeploy the stack from infrastructure as code after a disaster."
        fr: "Sauvegarde et restauration : copier des sauvegardes nocturnes vers us-west-2 et redéployer la pile à partir de l'infrastructure en tant que code après un sinistre."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Warm standby keeps a scaled-down but fully functional copy of production running in the recovery Region, so it can handle reduced traffic immediately and only needs to scale up. Continuous replication keeps the RPO near zero, and the cost stays below an active/active deployment.
    fr: |
      Le secours semi-automatique (warm standby) maintient dans la Région de reprise une copie réduite mais entièrement fonctionnelle de la production : elle peut traiter immédiatement un trafic réduit et n'a qu'à monter en charge. La réplication continue maintient un RPO proche de zéro, pour un coût inférieur à un déploiement actif/actif.
  options:
    a:
      en: |
        Pilot light is cheaper, but it cannot process requests until servers are switched on or deployed, which the requirement forbids.
      fr: |
        L'environnement de veille (pilot light) est moins cher, mais il ne peut pas traiter de requêtes tant que les serveurs ne sont pas démarrés ou déployés, ce que l'exigence interdit.
    c:
      en: |
        Active/active meets the requirement but runs full capacity in both Regions, so it is not the lowest-cost strategy.
      fr: |
        L'actif/actif répond à l'exigence mais exécute la pleine capacité dans les deux Régions : ce n'est pas la stratégie la moins coûteuse.
    d:
      en: |
        Backup and restore has nothing running in the recovery Region and loses up to a day of data, so it fails both the immediate-traffic and the continuous-replication requirements.
      fr: |
        Avec la sauvegarde et restauration, rien ne s'exécute dans la Région de reprise et jusqu'à un jour de données peut être perdu : les exigences de trafic immédiat et de réplication continue ne sont pas respectées.
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
