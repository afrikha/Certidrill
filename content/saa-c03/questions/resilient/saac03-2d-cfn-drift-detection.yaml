id: saac03-2d-cfn-drift-detection
objective: "2.2.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company deploys its production environment with AWS CloudFormation. An auditor suspects that administrators changed some resource properties, such as security group rules and instance types, directly in the AWS Management Console after the deployment.

    A solutions architect must identify which resources of the stack no longer match the template, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise déploie son environnement de production avec AWS CloudFormation. Un auditeur soupçonne que des administrateurs ont modifié certaines propriétés de ressources, comme des règles de groupes de sécurité et des types d'instances, directement dans l'AWS Management Console après le déploiement.

    Un architecte de solutions doit identifier les ressources de la pile qui ne correspondent plus au modèle, avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a change set from the original template and review the changes that the change set lists.", fr: "Créer un jeu de modifications à partir du modèle d'origine et examiner les modifications qu'il répertorie." } }
    - { id: b, text: { en: "Search the AWS CloudTrail event history for modification API calls on each resource of the stack.", fr: "Rechercher dans l'historique des événements AWS CloudTrail les appels d'API de modification sur chaque ressource de la pile." } }
    - { id: c, text: { en: "Run drift detection on the stack and review the drift status and property differences of each resource.", fr: "Exécuter la détection de dérive sur la pile et examiner le statut de dérive et les écarts de propriétés de chaque ressource." } }
    - { id: d, text: { en: "Enable termination protection on the stack and review the stack events.", fr: "Activer la protection contre la résiliation sur la pile et examiner les événements de la pile." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Drift detection compares the actual configuration of the stack resources with the configuration defined by the template and its parameters. It reports each resource as drifted (property changed or resource deleted) and shows the expected and actual values. It only reports drift; the company then decides how to correct it.
    fr: |
      La détection de dérive compare la configuration réelle des ressources de la pile à la configuration définie par le modèle et ses paramètres. Elle signale chaque ressource ayant dérivé (propriété modifiée ou ressource supprimée) et affiche les valeurs attendues et réelles. Elle ne fait que signaler la dérive ; l'entreprise décide ensuite comment la corriger.
  options:
    a: { en: "A change set compares a submitted template with the stack's current template, not with the real resource configuration, so it shows no out-of-band changes.", fr: "Un jeu de modifications compare un modèle soumis au modèle actuel de la pile, pas à la configuration réelle des ressources : il ne montre donc aucune modification faite hors de CloudFormation." }
    b: { en: "CloudTrail can reveal the changes, but correlating the events of every resource by hand is far more effort than one drift detection run.", fr: "CloudTrail peut révéler les modifications, mais corréler à la main les événements de chaque ressource demande bien plus d'effort qu'une seule détection de dérive." }
    d: { en: "Termination protection only prevents the stack from being deleted; stack events list CloudFormation operations, not console changes.", fr: "La protection contre la résiliation empêche seulement la suppression de la pile ; les événements de la pile listent les opérations CloudFormation, pas les modifications faites dans la console." }
references:
  - title: Detect unmanaged configuration changes to stacks and resources with drift detection
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-drift.html
