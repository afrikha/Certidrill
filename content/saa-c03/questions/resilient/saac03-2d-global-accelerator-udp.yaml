id: saac03-2d-global-accelerator-udp
objective: "2.2.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs multiplayer game servers behind Network Load Balancers in us-west-2 and eu-central-1. Game clients connect over UDP. Several partner networks allow outbound traffic only to a short, fixed list of IP addresses.

    If the game servers in one Region become unhealthy, new player connections must go to the healthy Region within seconds, without depending on how long clients cache DNS records.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute des serveurs de jeu multijoueur derrière des Network Load Balancers dans us-west-2 et eu-central-1. Les clients du jeu se connectent en UDP. Plusieurs réseaux partenaires n'autorisent le trafic sortant que vers une liste courte et fixe d'adresses IP.

    Si les serveurs de jeu d'une Région deviennent défaillants, les nouvelles connexions des joueurs doivent aller vers la Région saine en quelques secondes, sans dépendre de la durée pendant laquelle les clients mettent en cache les enregistrements DNS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Global Accelerator standard accelerator with an endpoint group in each Region that contains the Region's Network Load Balancer.", fr: "Créer un accélérateur standard AWS Global Accelerator avec, dans chaque Région, un groupe de points de terminaison qui contient le Network Load Balancer de la Région." } }
    - { id: b, text: { en: "Create an Amazon CloudFront distribution with an origin group that contains the two Network Load Balancers.", fr: "Créer une distribution Amazon CloudFront avec un groupe d'origines qui contient les deux Network Load Balancers." } }
    - { id: c, text: { en: "Create Amazon Route 53 failover records that point to the two Network Load Balancers, with health checks on each load balancer.", fr: "Créer des enregistrements de basculement Amazon Route 53 qui pointent vers les deux Network Load Balancers, avec des vérifications de l'état sur chaque équilibreur de charge." } }
    - { id: d, text: { en: "Replace the Network Load Balancers with Application Load Balancers and use Route 53 latency-based routing.", fr: "Remplacer les Network Load Balancers par des Application Load Balancers et utiliser le routage basé sur la latence de Route 53." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A standard accelerator provides two static anycast IPv4 addresses that partners can allow once. It supports TCP and UDP, continuously checks endpoint health, and sends new connections to a healthy endpoint group in another Region as soon as an endpoint becomes unhealthy. Because clients always connect to the same IP addresses, failover does not depend on DNS caching.
    fr: |
      Un accélérateur standard fournit deux adresses IPv4 anycast statiques que les partenaires peuvent autoriser une fois pour toutes. Il prend en charge TCP et UDP, vérifie en continu l'état des points de terminaison et envoie les nouvelles connexions vers un groupe de points de terminaison sain d'une autre Région dès qu'un point de terminaison devient défaillant. Comme les clients se connectent toujours aux mêmes adresses IP, le basculement ne dépend pas de la mise en cache DNS.
  options:
    b: { en: "CloudFront serves HTTP and HTTPS content; it does not carry UDP game traffic.", fr: "CloudFront sert du contenu HTTP et HTTPS ; il ne transporte pas le trafic de jeu UDP." }
    c: { en: "DNS failover depends on clients honoring the record TTL, and the IP addresses that clients reach change between Regions, which breaks the fixed allow lists.", fr: "Le basculement DNS dépend du respect du TTL par les clients, et les adresses IP jointes changent d'une Région à l'autre, ce qui casse les listes d'autorisation fixes." }
    d: { en: "Application Load Balancers handle HTTP and HTTPS only, not UDP, and latency-based routing still relies on DNS.", fr: "Les Application Load Balancers ne gèrent que HTTP et HTTPS, pas UDP, et le routage basé sur la latence repose toujours sur le DNS." }
references:
  - title: How AWS Global Accelerator works
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html
  - title: What is AWS Global Accelerator?
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
