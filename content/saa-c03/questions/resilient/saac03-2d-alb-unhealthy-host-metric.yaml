id: saac03-2d-alb-unhealthy-host-metric
objective: "2.2.15"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application runs on Amazon EC2 instances that are registered in a target group behind an Application Load Balancer. The business requires the operations team to be alerted as soon as any registered target fails the load balancer health checks, so that the team can investigate before the remaining capacity is too low for users.

    Which Amazon CloudWatch metric should the alarm use?
  fr: |
    Une application s'exécute sur des instances Amazon EC2 enregistrées dans un groupe cible derrière un Application Load Balancer. L'entreprise exige que l'équipe des opérations soit alertée dès qu'une cible enregistrée échoue aux vérifications de l'état de l'équilibreur de charge, afin d'enquêter avant que la capacité restante ne devienne insuffisante pour les utilisateurs.

    Quelle métrique Amazon CloudWatch l'alarme doit-elle utiliser ?
body:
  options:
    - { id: a, text: "HTTPCode_ELB_5XX_Count" }
    - { id: b, text: "RequestCountPerTarget" }
    - { id: c, text: "TargetResponseTime" }
    - { id: d, text: "UnHealthyHostCount" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      UnHealthyHostCount reports the number of targets that the load balancer considers unhealthy. An alarm on a value greater than zero fires as soon as one target fails its health checks, before users lose capacity. AWS recommends watching the Minimum statistic to detect a target that every load balancer node considers unhealthy.
    fr: |
      UnHealthyHostCount indique le nombre de cibles que l'équilibreur de charge considère comme défaillantes. Une alarme sur une valeur supérieure à zéro se déclenche dès qu'une cible échoue à ses vérifications de l'état, avant que les utilisateurs ne perdent de capacité. AWS recommande de surveiller la statistique Minimum pour détecter une cible que tous les nœuds de l'équilibreur de charge considèrent comme défaillante.
  options:
    a: { en: "This metric counts 5xx errors generated by the load balancer itself; it does not report the health of individual targets.", fr: "Cette métrique compte les erreurs 5xx générées par l'équilibreur de charge lui-même ; elle n'indique pas l'état des cibles individuelles." }
    b: { en: "This metric measures the average load per target, not whether targets pass health checks.", fr: "Cette métrique mesure la charge moyenne par cible, pas la réussite des vérifications de l'état." }
    c: { en: "This metric measures how long targets take to respond; a target can fail health checks without any change in latency for the other targets.", fr: "Cette métrique mesure le temps de réponse des cibles ; une cible peut échouer aux vérifications de l'état sans aucun changement de latence pour les autres cibles." }
references:
  - title: CloudWatch metrics for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-cloudwatch-metrics.html
