id: saac03-2b-lambda-timeout-fargate
objective: "2.1.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly data-transformation job written in Python on an always-on Amazon EC2 instance. The job takes about 3 hours to complete and cannot be split into smaller units of work. The company wants to move to a serverless model in which it manages no servers and pays for compute only while the job runs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une tâche nocturne de transformation de données écrite en Python sur une instance Amazon EC2 toujours active. La tâche dure environ 3 heures et ne peut pas être découpée en unités de travail plus petites. L'entreprise veut passer à un modèle sans serveur dans lequel elle ne gère aucun serveur et ne paie le calcul que pendant l'exécution de la tâche.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy the job as an AWS Lambda function with the maximum timeout, and invoke it every night with an Amazon EventBridge Scheduler schedule.", fr: "Déployer la tâche sous forme de fonction AWS Lambda avec le délai d'expiration maximal, et l'appeler chaque nuit avec une planification Amazon EventBridge Scheduler." }
    - id: b
      text: { en: "Deploy the job as an AWS Lambda function, and configure provisioned concurrency so that the function can run for the full duration of the job.", fr: "Déployer la tâche sous forme de fonction AWS Lambda, et configurer la simultanéité provisionnée pour que la fonction puisse s'exécuter pendant toute la durée de la tâche." }
    - id: c
      text: { en: "Run the job on an EC2 Spot Instance that an Auto Scaling scheduled action launches every night and terminates in the morning.", fr: "Exécuter la tâche sur une instance Spot EC2 qu'une action planifiée Auto Scaling lance chaque nuit et résilie le matin." }
    - id: d
      text: { en: "Package the job as a container image, and run it as an Amazon ECS task on AWS Fargate that an Amazon EventBridge Scheduler schedule starts every night.", fr: "Empaqueter la tâche sous forme d'image de conteneur, et l'exécuter en tant que tâche Amazon ECS sur AWS Fargate qu'une planification Amazon EventBridge Scheduler démarre chaque nuit." }
answer: { optionId: d }
explanation:
  correct:
    en: A Fargate task has no maximum run time comparable to Lambda's, so it can run the 3-hour job in one piece. Fargate is serverless and bills for the vCPU and memory of the task only while it runs, and EventBridge Scheduler can start the task on a nightly cron schedule.
    fr: Une tâche Fargate n'a pas de durée d'exécution maximale comparable à celle de Lambda ; elle peut donc exécuter la tâche de 3 heures d'un seul tenant. Fargate est sans serveur et facture le vCPU et la mémoire de la tâche uniquement pendant son exécution, et EventBridge Scheduler peut démarrer la tâche selon une planification cron nocturne.
  options:
    a:
      en: The 3-hour job is far longer than the maximum timeout of a Lambda function (minutes, not hours), and the job cannot be split.
      fr: La tâche de 3 heures est bien plus longue que la durée maximale d'une fonction Lambda (des minutes, pas des heures), et elle ne peut pas être découpée.
    b:
      en: Provisioned concurrency keeps execution environments initialized to reduce cold starts. It does not extend the maximum timeout of a function.
      fr: La simultanéité provisionnée garde des environnements d'exécution initialisés pour réduire les démarrages à froid. Elle n'allonge pas le délai d'expiration maximal d'une fonction.
    c:
      en: The company would still manage EC2 instances, which is not a serverless model, and a Spot interruption could stop a job that cannot be split or resumed.
      fr: L'entreprise gérerait toujours des instances EC2, ce qui n'est pas un modèle sans serveur, et une interruption Spot pourrait arrêter une tâche qui ne peut être ni découpée ni reprise.
references:
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: Schedule types in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
