id: saac03-2b-scheduler-cron
objective: "2.1.21"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a script on a dedicated Amazon EC2 instance every night at 01:00 in the Europe/Paris time zone. The script calls several AWS APIs to clean up unused resources and finishes in about 3 minutes. The instance is idle the rest of the day. The company wants to remove the instance and reduce operational overhead, and the run time must follow daylight saving time changes in Paris.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un script sur une instance Amazon EC2 dédiée chaque nuit à 01 h 00 dans le fuseau horaire Europe/Paris. Le script appelle plusieurs API AWS pour nettoyer les ressources inutilisées et se termine en 3 minutes environ. L'instance est inactive le reste de la journée. L'entreprise veut supprimer l'instance et réduire la charge opérationnelle, et l'heure d'exécution doit suivre les changements d'heure d'été à Paris.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use Auto Scaling scheduled actions to launch an instance from an AMI that runs the script at 01:00 and to terminate it at 01:30.", fr: "Utiliser des actions planifiées Auto Scaling pour lancer à 01 h 00 une instance à partir d'une AMI qui exécute le script, et la résilier à 01 h 30." }
    - id: b
      text: { en: "Run the script in a container as an Amazon ECS service on AWS Fargate with a desired count of 1 that sleeps until 01:00.", fr: "Exécuter le script dans un conteneur en tant que service Amazon ECS sur AWS Fargate avec un nombre souhaité de 1 qui attend jusqu'à 01 h 00." }
    - id: c
      text: { en: "Convert the script to an AWS Lambda function, and invoke it with an Amazon EventBridge Scheduler cron schedule in the Europe/Paris time zone.", fr: "Convertir le script en fonction AWS Lambda, et l'appeler avec une planification cron Amazon EventBridge Scheduler dans le fuseau horaire Europe/Paris." }
    - id: d
      text: { en: "Store the script in an Amazon S3 bucket, and configure an S3 Lifecycle rule that runs the script every night at 01:00.", fr: "Stocker le script dans un compartiment Amazon S3, et configurer une règle S3 Lifecycle qui exécute le script chaque nuit à 01 h 00." }
answer: { optionId: c }
explanation:
  correct:
    en: A 3-minute script fits within the Lambda timeout, and Lambda bills only for the run. EventBridge Scheduler is a serverless scheduler that supports cron schedules in a specified time zone and adjusts them automatically for daylight saving time, so no server or custom scheduling remains.
    fr: Un script de 3 minutes tient dans le délai d'expiration de Lambda, et Lambda ne facture que l'exécution. EventBridge Scheduler est un planificateur sans serveur qui prend en charge les planifications cron dans un fuseau horaire spécifié et les ajuste automatiquement à l'heure d'été ; il ne reste ni serveur ni planification personnalisée.
  options:
    a:
      en: The company would still manage an AMI and EC2 instances, which does not remove the server or reduce operational overhead much.
      fr: L'entreprise gérerait toujours une AMI et des instances EC2, ce qui ne supprime pas le serveur et réduit peu la charge opérationnelle.
    b:
      en: A service task that runs all day to wait for 01:00 is billed continuously and still needs custom scheduling logic.
      fr: Une tâche de service qui tourne toute la journée pour attendre 01 h 00 est facturée en continu et nécessite toujours une logique de planification personnalisée.
    d:
      en: S3 Lifecycle rules transition or expire objects; they cannot run scripts.
      fr: Les règles S3 Lifecycle font changer de classe de stockage ou expirer des objets ; elles ne peuvent pas exécuter de scripts.
references:
  - title: Schedule types in EventBridge Scheduler
    url: https://docs.aws.amazon.com/scheduler/latest/UserGuide/schedule-types.html
