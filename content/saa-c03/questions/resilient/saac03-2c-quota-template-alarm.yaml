id: saac03-2c-quota-template-alarm
objective: "2.2.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with all features enabled and creates a new member account in a commercial Region for each new project. Every project needs a higher AWS Lambda concurrent executions quota than the default value. The increase must be requested automatically when each new account is created. The operations team must also be notified when an account's usage reaches 80 % of the quota.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise AWS Organizations avec toutes les fonctionnalités activées et crée un nouveau compte membre dans une Région commerciale pour chaque nouveau projet. Chaque projet a besoin d'un quota d'exécutions simultanées AWS Lambda supérieur à la valeur par défaut. L'augmentation doit être demandée automatiquement à la création de chaque nouveau compte. L'équipe d'exploitation doit aussi être avertie lorsque l'utilisation d'un compte atteint 80 % du quota.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Attach a service control policy to the organizational unit that raises the Lambda concurrency quota of its accounts."
        fr: "Attacher une politique de contrôle des services à l'unité d'organisation pour augmenter le quota de concurrence Lambda de ses comptes."
    - id: b
      text:
        en: "Add the increased quota value to a Service Quotas quota request template and enable template association with the organization."
        fr: "Ajouter la valeur de quota augmentée à un modèle de demande de quota Service Quotas et activer l'association du modèle à l'organisation."
    - id: c
      text:
        en: "Create an AWS Budgets alert that triggers at 80 % of the forecasted Lambda spend in each account."
        fr: "Créer une alerte AWS Budgets qui se déclenche à 80 % des dépenses Lambda prévues dans chaque compte."
    - id: d
      text:
        en: "Create a CloudWatch alarm from the Service Quotas console on the quota's usage with an 80 % threshold that notifies an SNS topic."
        fr: "Créer depuis la console Service Quotas une alarme CloudWatch sur l'utilisation du quota avec un seuil de 80 % qui notifie une rubrique SNS."
    - id: e
      text:
        en: "Create an AWS Config rule that marks accounts with the default quota value as noncompliant."
        fr: "Créer une règle AWS Config qui marque comme non conformes les comptes ayant la valeur de quota par défaut."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A quota request template, once associated with an organization that has all features enabled, automatically submits the configured increase requests whenever a new account is created in the organization. For notification, Service Quotas can create a CloudWatch alarm on a quota's utilization with the threshold you choose, and the alarm can notify an SNS topic.
    fr: |
      Un modèle de demande de quota, une fois associé à une organisation dont toutes les fonctionnalités sont activées, soumet automatiquement les demandes d'augmentation configurées à chaque création de compte dans l'organisation. Pour la notification, Service Quotas peut créer une alarme CloudWatch sur l'utilisation d'un quota avec le seuil choisi, et l'alarme peut notifier une rubrique SNS.
  options:
    a:
      en: |
        SCPs only limit the permissions available in member accounts; they never grant permissions or change quotas.
      fr: |
        Les politiques de contrôle des services ne font que limiter les autorisations disponibles dans les comptes membres ; elles n'accordent jamais d'autorisations et ne modifient pas les quotas.
    c:
      en: |
        Budgets track costs, not quota utilization; spend does not tell how close concurrency is to its quota.
      fr: |
        Budgets suit les coûts, pas l'utilisation des quotas ; les dépenses n'indiquent pas à quel point la concurrence est proche de son quota.
    e:
      en: |
        A Config rule only evaluates compliance; it neither requests the increase nor alerts on usage reaching 80 % of the quota.
      fr: |
        Une règle Config ne fait qu'évaluer la conformité ; elle ne demande pas l'augmentation et n'alerte pas lorsque l'utilisation atteint 80 % du quota.
references:
  - title: Using Service Quotas request templates
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/organization-templates.html
  - title: Service Quotas and Amazon CloudWatch alarms
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/configure-cloudwatch.html
