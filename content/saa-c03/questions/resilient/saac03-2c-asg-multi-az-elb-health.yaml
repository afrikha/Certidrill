id: saac03-2c-asg-multi-az-elb-health
objective: "2.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. All the instances run in one Availability Zone. Sometimes the application process stops responding while the EC2 status checks still pass, and the instance stays in service until an engineer replaces it. The company wants the application to survive the loss of an Availability Zone and wants unhealthy instances to be replaced automatically.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 dans un groupe Auto Scaling derrière un Application Load Balancer. Toutes les instances s'exécutent dans une seule zone de disponibilité. Parfois, le processus de l'application cesse de répondre alors que les contrôles d'état EC2 réussissent toujours, et l'instance reste en service jusqu'à ce qu'un ingénieur la remplace. L'entreprise souhaite que l'application survive à la perte d'une zone de disponibilité et que les instances défaillantes soient remplacées automatiquement.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Configure the Auto Scaling group to use subnets in at least two Availability Zones, and enable the same zones on the load balancer."
        fr: "Configurer le groupe Auto Scaling pour utiliser des sous-réseaux dans au moins deux zones de disponibilité, et activer les mêmes zones sur l'équilibreur de charge."
    - id: b
      text:
        en: "Create CloudWatch alarms that use the EC2 automatic recovery action on each instance."
        fr: "Créer des alarmes CloudWatch qui utilisent l'action de récupération automatique EC2 sur chaque instance."
    - id: c
      text:
        en: "Turn on Elastic Load Balancing health checks for the Auto Scaling group."
        fr: "Activer les vérifications de l'état Elastic Load Balancing pour le groupe Auto Scaling."
    - id: d
      text:
        en: "Turn on cross-zone load balancing for the load balancer."
        fr: "Activer l'équilibrage de charge entre zones sur l'équilibreur de charge."
    - id: e
      text:
        en: "Increase the health check grace period of the Auto Scaling group to 30 minutes."
        fr: "Porter le délai de grâce de la vérification de l'état du groupe Auto Scaling à 30 minutes."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Spreading the group across subnets in several Availability Zones removes the single-zone point of failure. By default, Auto Scaling uses only EC2 status checks; turning on ELB health checks makes the group also replace instances that fail the load balancer's target health checks, such as a hung application.
    fr: |
      Répartir le groupe sur des sous-réseaux de plusieurs zones de disponibilité supprime le point de défaillance unique de la zone. Par défaut, Auto Scaling n'utilise que les contrôles d'état EC2 ; activer les vérifications de l'état ELB fait aussi remplacer par le groupe les instances qui échouent aux vérifications de l'état des cibles de l'équilibreur, comme une application bloquée.
  options:
    b:
      en: |
        Automatic recovery reacts to failed system status checks; the instance passes its status checks here, so a hung application is not detected.
      fr: |
        La récupération automatique réagit aux échecs des contrôles d'état système ; ici l'instance réussit ses contrôles, donc une application bloquée n'est pas détectée.
    d:
      en: |
        Cross-zone load balancing is always enabled at the load balancer level for an ALB, and it does not add zones to the Auto Scaling group.
      fr: |
        L'équilibrage de charge entre zones est toujours activé au niveau de l'équilibreur pour un ALB, et il n'ajoute pas de zones au groupe Auto Scaling.
    e:
      en: |
        A longer grace period only delays health checks on new instances; it does not detect or replace hung instances.
      fr: |
        Un délai de grâce plus long retarde seulement les vérifications sur les nouvelles instances ; il ne détecte ni ne remplace les instances bloquées.
references:
  - title: Health checks for instances in an Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html
