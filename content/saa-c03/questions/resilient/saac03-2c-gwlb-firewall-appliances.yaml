id: saac03-2c-gwlb-firewall-appliances
objective: "2.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must inspect all traffic that enters and leaves its application VPCs with a fleet of third-party virtual firewall appliances. The appliances run in a central security VPC. The fleet must scale horizontally, traffic must bypass unhealthy appliances automatically, and each traffic flow must stay on the same appliance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit inspecter tout le trafic qui entre dans ses VPC d'application et qui en sort avec une flotte d'appliances de pare-feu virtuelles tierces. Les appliances s'exécutent dans un VPC de sécurité central. La flotte doit évoluer horizontalement, le trafic doit contourner automatiquement les appliances défaillantes, et chaque flux doit rester sur la même appliance.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy a Network Load Balancer in the security VPC with the appliances as targets, and peer each application VPC with the security VPC."
        fr: "Déployer un Network Load Balancer dans le VPC de sécurité avec les appliances comme cibles, et appairer chaque VPC d'application avec le VPC de sécurité."
    - id: b
      text:
        en: "Deploy a Gateway Load Balancer in the security VPC with the appliances as targets, and use Gateway Load Balancer endpoints as the next hop in the application VPC route tables."
        fr: "Déployer un Gateway Load Balancer dans le VPC de sécurité avec les appliances comme cibles, et utiliser des points de terminaison Gateway Load Balancer comme tronçon suivant dans les tables de routage des VPC d'application."
    - id: c
      text:
        en: "Deploy an Application Load Balancer in the security VPC with the appliances as targets, and create a listener rule for each port to inspect."
        fr: "Déployer un Application Load Balancer dans le VPC de sécurité avec les appliances comme cibles, et créer une règle d'écouteur pour chaque port à inspecter."
    - id: d
      text:
        en: "Use Route 53 Resolver DNS Firewall rules in each application VPC and forward the matching queries to the appliances."
        fr: "Utiliser des règles Route 53 Resolver DNS Firewall dans chaque VPC d'application et transférer les requêtes correspondantes vers les appliances."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Gateway Load Balancer deploys, scales, and manages virtual appliances such as firewalls and IDS/IPS as a transparent network gateway. It sends traffic only to healthy appliances, keeps each flow on the same appliance, and exchanges traffic with them over GENEVE on port 6081. Gateway Load Balancer endpoints in the application VPCs are used as route table next hops.
    fr: |
      Un Gateway Load Balancer déploie, met à l'échelle et gère des appliances virtuelles comme des pare-feu et des IDS/IPS en tant que passerelle réseau transparente. Il n'envoie le trafic qu'aux appliances saines, maintient chaque flux sur la même appliance et échange le trafic avec elles via GENEVE sur le port 6081. Des points de terminaison Gateway Load Balancer dans les VPC d'application servent de tronçon suivant dans les tables de routage.
  options:
    a:
      en: |
        A Network Load Balancer is a destination endpoint, not a transparent next hop; traffic between the application VPCs and the internet would not be steered through it by peering.
      fr: |
        Un Network Load Balancer est un point de terminaison de destination, pas un tronçon suivant transparent ; l'appairage ne ferait pas transiter par lui le trafic entre les VPC d'application et Internet.
    c:
      en: |
        An Application Load Balancer handles HTTP and HTTPS requests at layer 7; it cannot pass all IP traffic transparently to inline appliances.
      fr: |
        Un Application Load Balancer traite des requêtes HTTP et HTTPS à la couche 7 ; il ne peut pas transmettre de façon transparente tout le trafic IP vers des appliances en ligne.
    d:
      en: |
        DNS Firewall filters DNS queries only; it does not send the application traffic through the firewall appliances.
      fr: |
        DNS Firewall filtre uniquement les requêtes DNS ; il ne fait pas transiter le trafic applicatif par les appliances de pare-feu.
references:
  - title: What is a Gateway Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
