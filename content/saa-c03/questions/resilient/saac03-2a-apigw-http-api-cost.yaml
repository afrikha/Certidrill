id: saac03-2a-apigw-http-api-cost
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A startup is building a backend for its mobile app. Users sign in with an Amazon Cognito user pool, and the app sends stateless HTTPS requests that must be forwarded to AWS Lambda functions. The API does not need response caching, request validation, API keys or AWS WAF. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une start-up crée le backend de son application mobile. Les utilisateurs se connectent avec un groupe d'utilisateurs Amazon Cognito, et l'application envoie des requêtes HTTPS sans état qui doivent être transmises à des fonctions AWS Lambda. L'API n'a besoin ni de mise en cache des réponses, ni de validation des requêtes, ni de clés d'API, ni d'AWS WAF. L'entreprise souhaite la solution la PLUS rentable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an API Gateway HTTP API with Lambda proxy integrations and a JWT authorizer that uses the Cognito user pool as the token issuer.", fr: "Créer une API HTTP API Gateway avec des intégrations de proxy Lambda et un mécanisme d'autorisation JWT qui utilise le groupe d'utilisateurs Cognito comme émetteur des jetons." }
    - id: b
      text: { en: "Create an API Gateway REST API with Lambda proxy integrations and a Cognito user pool authorizer on each method.", fr: "Créer une API REST API Gateway avec des intégrations de proxy Lambda et un mécanisme d'autorisation de groupe d'utilisateurs Cognito sur chaque méthode." }
    - id: c
      text: { en: "Create an API Gateway REST API with a private endpoint type and a Lambda authorizer that validates the Cognito tokens.", fr: "Créer une API REST API Gateway avec un type de point de terminaison privé et un mécanisme d'autorisation Lambda qui valide les jetons Cognito." }
    - id: d
      text: { en: "Create an API Gateway WebSocket API with a $default route that is integrated with the Lambda functions.", fr: "Créer une API WebSocket API Gateway avec une route $default intégrée aux fonctions Lambda." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      HTTP APIs are designed with fewer features so that they can be offered at a lower price than REST APIs, and they support Lambda proxy integrations and JWT authorizers that validate tokens issued by a Cognito user pool. Because the API needs none of the REST-only features (caching, request validation, API keys, AWS WAF), the HTTP API is the most cost-effective choice.
    fr: |
      Les API HTTP proposent moins de fonctionnalités afin d'être facturées moins cher que les API REST, et elles prennent en charge les intégrations de proxy Lambda et les mécanismes d'autorisation JWT qui valident les jetons émis par un groupe d'utilisateurs Cognito. Comme l'API n'a besoin d'aucune fonctionnalité réservée aux API REST (mise en cache, validation des requêtes, clés d'API, AWS WAF), l'API HTTP est le choix le plus rentable.
  options:
    b:
      en: |
        A REST API with a Cognito authorizer works, but REST APIs cost more than HTTP APIs and the extra features they include are not needed here.
      fr: |
        Une API REST avec un mécanisme d'autorisation Cognito fonctionne, mais les API REST coûtent plus cher que les API HTTP et leurs fonctionnalités supplémentaires ne sont pas nécessaires ici.
    c:
      en: |
        A private REST API can be called only from inside a VPC through an interface VPC endpoint, so mobile clients on the internet could not reach it.
      fr: |
        Une API REST privée ne peut être appelée que depuis un VPC via un point de terminaison de VPC d'interface : les clients mobiles sur Internet ne pourraient pas l'atteindre.
    d:
      en: |
        WebSocket APIs keep persistent bidirectional connections for push scenarios; they do not fit stateless request-response HTTPS calls.
      fr: |
        Les API WebSocket maintiennent des connexions bidirectionnelles persistantes pour les scénarios de diffusion vers le client ; elles ne conviennent pas à des appels HTTPS requête-réponse sans état.
references:
  - title: Choose between REST APIs and HTTP APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/http-api-vs-rest.html
