id: saac03-2a-secrets-replica-region
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application in the us-east-1 Region with a warm standby copy in the us-west-2 Region. The database credentials are stored in AWS Secrets Manager in us-east-1 and are rotated automatically every 30 days. During an outage of us-east-1, the standby application must retrieve the current credentials from within us-west-2. Rotations must reach us-west-2 without any custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application dans la Région us-east-1 avec une copie de secours semi-automatique (warm standby) dans la Région us-west-2. Les informations d'identification de la base de données sont stockées dans AWS Secrets Manager dans us-east-1 et sont renouvelées automatiquement tous les 30 jours. Pendant une panne de us-east-1, l'application de secours doit récupérer les informations d'identification à jour depuis us-west-2. Les rotations doivent atteindre us-west-2 sans aucun code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the standby application to call the Secrets Manager endpoint in us-east-1 to retrieve the secret.", fr: "Configurer l'application de secours pour qu'elle appelle le point de terminaison Secrets Manager de us-east-1 afin de récupérer le secret." }
    - id: b
      text: { en: "Create a Lambda function that copies the secret value to a SecureString parameter in us-west-2 after each rotation.", fr: "Créer une fonction Lambda qui copie la valeur du secret dans un paramètre SecureString de us-west-2 après chaque rotation." }
    - id: c
      text: { en: "Create a multi-Region AWS KMS key, and replicate the key to us-west-2 for the standby application.", fr: "Créer une clé AWS KMS multi-Région, et répliquer la clé vers us-west-2 pour l'application de secours." }
    - id: d
      text: { en: "Replicate the secret to us-west-2, and configure the standby application to read the replica secret in us-west-2.", fr: "Répliquer le secret vers us-west-2, et configurer l'application de secours pour qu'elle lise le secret réplica dans us-west-2." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Secrets Manager can replicate a secret to other Regions. When the primary secret is rotated, the new value propagates to every replica, so the replica in us-west-2 stays current with no custom code. During a disaster, the standby application reads the replica in its own Region, and the replica can be promoted to a standalone secret.
    fr: |
      Secrets Manager peut répliquer un secret vers d'autres Régions. Quand le secret principal est renouvelé, la nouvelle valeur se propage à chaque réplica : le réplica de us-west-2 reste à jour sans code personnalisé. Pendant un sinistre, l'application de secours lit le réplica dans sa propre Région, et le réplica peut être promu en secret autonome.
  options:
    a: { en: "Calling the us-east-1 endpoint works only while us-east-1 is available, so it fails during the outage.", fr: "Appeler le point de terminaison de us-east-1 ne fonctionne que tant que us-east-1 est disponible : cela échoue pendant la panne." }
    b: { en: "A copy function is custom code to write and maintain, which the requirements exclude.", fr: "Une fonction de copie est du code personnalisé à écrire et à maintenir, ce que les exigences excluent." }
    c: { en: "Replicating a KMS key copies key material, not the secret, so us-west-2 still has no credentials to read.", fr: "Répliquer une clé KMS copie le matériel de clé, pas le secret : us-west-2 n'a toujours aucune information d'identification à lire." }
references:
  - title: Replicate AWS Secrets Manager secrets across Regions
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/create-manage-multi-region-secrets.html
