id: saac03-2a-predictive-warm-pool
objective: "2.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group that already has a target tracking scaling policy. New instances need about 10 minutes to initialize. Every workday, traffic ramps up steeply at 8:00 AM, and the pattern has been consistent for months. Unexpected spikes also occur during the day. The company wants capacity in place before the daily ramp without maintaining a schedule, and instances added for unexpected spikes must start serving traffic quickly.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 dans un groupe Auto Scaling qui dispose déjà d'une politique de mise à l'échelle avec suivi de cible. Les nouvelles instances mettent environ 10 minutes à s'initialiser. Chaque jour ouvré, le trafic augmente fortement à 8 h 00, et ce modèle est constant depuis des mois. Des pics inattendus surviennent aussi dans la journée. L'entreprise veut que la capacité soit en place avant la hausse quotidienne sans maintenir de planification, et que les instances ajoutées lors des pics inattendus commencent rapidement à servir le trafic.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a recurring scheduled action that raises the desired capacity at 7:45 AM every workday.", fr: "Créer une action planifiée récurrente qui augmente la capacité souhaitée à 7 h 45 chaque jour ouvré." } }
    - { id: b, text: { en: "Increase the health check grace period of the group to 10 minutes.", fr: "Porter le délai de grâce de la vérification de l'état du groupe à 10 minutes." } }
    - { id: c, text: { en: "Add a predictive scaling policy to the Auto Scaling group.", fr: "Ajouter une politique de mise à l'échelle prédictive au groupe Auto Scaling." } }
    - { id: d, text: { en: "Change the launch template to use a larger instance type.", fr: "Modifier le modèle de lancement pour utiliser un type d'instance plus grand." } }
    - { id: e, text: { en: "Add a warm pool of pre-initialized instances in the Stopped state to the Auto Scaling group.", fr: "Ajouter au groupe Auto Scaling un groupe d'instances pré-initialisées (warm pool) à l'état Stopped." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      Predictive scaling learns daily and weekly patterns from historical data and launches capacity before the forecast load, so slow-to-initialize instances are ready for the 8:00 AM ramp with no schedule to maintain. A warm pool keeps pre-initialized instances (stopped instances cost only their volumes and Elastic IP addresses), so when the target tracking policy scales out for an unexpected spike, the instances start serving quickly.
    fr: |
      La mise à l'échelle prédictive apprend les modèles quotidiens et hebdomadaires à partir de l'historique et lance la capacité avant la charge prévue : les instances lentes à initialiser sont prêtes pour la hausse de 8 h 00, sans planification à maintenir. Un groupe d'instances pré-initialisées (warm pool) conserve des instances déjà initialisées (les instances arrêtées ne coûtent que leurs volumes et adresses IP Elastic) : quand la politique de suivi de cible augmente la capacité lors d'un pic inattendu, les instances servent rapidement le trafic.
  options:
    a: { en: "A scheduled action works for the ramp, but it is a schedule that the company must maintain, which it wants to avoid, and it does not help with unexpected spikes.", fr: "Une action planifiée fonctionne pour la hausse, mais c'est une planification à maintenir, ce que l'entreprise veut éviter, et elle n'aide pas lors des pics inattendus." }
    b: { en: "The grace period only delays health checks of new instances; it does not make them ready sooner.", fr: "Le délai de grâce retarde seulement les vérifications de l'état des nouvelles instances ; il ne les rend pas prêtes plus tôt." }
    d: { en: "Larger instances add capacity per instance but do not anticipate the ramp or shorten the initialization of new instances.", fr: "Des instances plus grandes ajoutent de la capacité par instance, mais n'anticipent pas la hausse et ne raccourcissent pas l'initialisation des nouvelles instances." }
references:
  - title: Predictive scaling for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html
  - title: Decrease latency for applications with long boot times using warm pools
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-warm-pools.html
