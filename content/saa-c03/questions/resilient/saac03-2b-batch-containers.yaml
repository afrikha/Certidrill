id: saac03-2b-batch-containers
objective: "2.1.20"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A pharmaceutical research company runs thousands of independent simulation jobs every week. Each job is packaged as a container image, runs for 1 to 6 hours, and can be restarted if it is interrupted. The company wants a managed service that queues the jobs, provisions compute capacity (including Spot Instances) based on the queued work, and runs the jobs, without the company building or operating its own scheduler.

    Which solution will meet these requirements?
  fr: |
    Une société de recherche pharmaceutique exécute chaque semaine des milliers de tâches de simulation indépendantes. Chaque tâche est empaquetée sous forme d'image de conteneur, dure de 1 à 6 heures et peut être relancée si elle est interrompue. L'entreprise veut un service géré qui met les tâches en file d'attente, provisionne la capacité de calcul (y compris des instances Spot) selon le travail en attente et exécute les tâches, sans construire ni exploiter son propre planificateur.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy the container images as AWS Lambda functions that an Amazon SQS queue invokes for each job.", fr: "Déployer les images de conteneur sous forme de fonctions AWS Lambda qu'une file d'attente Amazon SQS appelle pour chaque tâche." }
    - id: b
      text: { en: "Submit the jobs to an AWS Batch job queue that uses a managed compute environment with EC2 Spot Instances.", fr: "Soumettre les tâches à une file d'attente de tâches AWS Batch qui utilise un environnement de calcul géré avec des instances Spot EC2." }
    - id: c
      text: { en: "Create one Amazon ECS service for each job with a desired count of 1, and delete the service when the job ends.", fr: "Créer un service Amazon ECS par tâche avec un nombre souhaité de 1, et supprimer le service à la fin de la tâche." }
    - id: d
      text: { en: "Run the jobs on an Amazon EKS cluster with a custom job scheduler that the team writes and maintains.", fr: "Exécuter les tâches sur un cluster Amazon EKS avec un planificateur de tâches personnalisé que l'équipe écrit et maintient." }
answer: { optionId: b }
explanation:
  correct:
    en: AWS Batch is a fully managed service for batch computing. It provisions compute in response to submitted jobs, scales the capacity (EC2 On-Demand or Spot Instances, or Fargate), and distributes the containerized jobs, so the company does not install or operate any batch software.
    fr: AWS Batch est un service entièrement géré de calcul par lots. Il provisionne le calcul en fonction des tâches soumises, met la capacité à l'échelle (instances EC2 à la demande ou Spot, ou Fargate) et répartit les tâches conteneurisées ; l'entreprise n'installe ni n'exploite aucun logiciel de traitement par lots.
  options:
    a:
      en: A Lambda function runs for at most 15 minutes, far shorter than jobs that last up to 6 hours.
      fr: Une fonction Lambda s'exécute au plus 15 minutes, bien moins que des tâches qui durent jusqu'à 6 heures.
    c:
      en: An ECS service keeps tasks running and restarts them when they exit, which suits long-running applications, not jobs that run to completion; managing thousands of services is custom scheduling.
      fr: Un service ECS maintient les tâches en cours d'exécution et les redémarre lorsqu'elles se terminent, ce qui convient aux applications de longue durée, pas aux tâches qui s'exécutent jusqu'à leur fin ; gérer des milliers de services revient à une planification personnalisée.
    d:
      en: A custom scheduler is exactly what the company does not want to build and operate.
      fr: Un planificateur personnalisé est précisément ce que l'entreprise ne veut pas construire ni exploiter.
references:
  - title: What is AWS Batch?
    url: https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html
