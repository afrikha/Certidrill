id: saac03-2c-polly-lesson-audio
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-learning company publishes text-based lessons as files in an Amazon S3 bucket. The company wants to offer an audio version of each lesson in natural-sounding voices. Each audio file must be generated automatically when a lesson is published and stored for later playback, without voice actors.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'apprentissage en ligne publie des leçons sous forme de fichiers texte dans un compartiment Amazon S3. L'entreprise souhaite proposer une version audio de chaque leçon avec des voix naturelles. Chaque fichier audio doit être généré automatiquement lors de la publication d'une leçon et stocké pour une lecture ultérieure, sans comédiens.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Invoke an AWS Lambda function on each upload that calls Amazon Polly to synthesize speech and saves the audio file in Amazon S3."
        fr: "Appeler, à chaque chargement, une fonction AWS Lambda qui utilise Amazon Polly pour synthétiser la parole et enregistre le fichier audio dans Amazon S3."
    - id: b
      text:
        en: "Invoke an AWS Lambda function on each upload that calls Amazon Transcribe to produce audio and saves the audio file in Amazon S3."
        fr: "Appeler, à chaque chargement, une fonction AWS Lambda qui utilise Amazon Transcribe pour produire l'audio et enregistre le fichier audio dans Amazon S3."
    - id: c
      text:
        en: "Invoke an AWS Lambda function on each upload that calls Amazon Lex to produce audio and saves the audio file in Amazon S3."
        fr: "Appeler, à chaque chargement, une fonction AWS Lambda qui utilise Amazon Lex pour produire l'audio et enregistre le fichier audio dans Amazon S3."
    - id: d
      text:
        en: "Invoke an AWS Lambda function on each upload that calls Amazon Comprehend to produce audio and saves the audio file in Amazon S3."
        fr: "Appeler, à chaque chargement, une fonction AWS Lambda qui utilise Amazon Comprehend pour produire l'audio et enregistre le fichier audio dans Amazon S3."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon Polly is the text-to-speech service: it converts text into lifelike speech in many languages and voices, and the generated audio can be stored and replayed at no additional cost. An S3-triggered Lambda function automates the conversion at publication.
    fr: |
      Amazon Polly est le service de synthèse vocale : il convertit du texte en parole réaliste dans de nombreuses langues et voix, et l'audio généré peut être stocké et rejoué sans frais supplémentaires. Une fonction Lambda déclenchée par S3 automatise la conversion lors de la publication.
  options:
    b:
      en: |
        Amazon Transcribe does the opposite conversion: it turns speech into text.
      fr: |
        Amazon Transcribe effectue la conversion inverse : il transforme la parole en texte.
    c:
      en: |
        Amazon Lex builds conversational chatbots and voice bots; it is not designed to narrate long documents into audio files.
      fr: |
        Amazon Lex sert à créer des chatbots et des assistants vocaux conversationnels ; il n'est pas conçu pour lire de longs documents dans des fichiers audio.
    d:
      en: |
        Amazon Comprehend extracts insights such as entities and sentiment from text; it does not generate speech.
      fr: |
        Amazon Comprehend extrait des informations comme les entités et le sentiment d'un texte ; il ne génère pas de parole.
references:
  - title: What Is Amazon Polly?
    url: https://docs.aws.amazon.com/polly/latest/dg/what-is.html
