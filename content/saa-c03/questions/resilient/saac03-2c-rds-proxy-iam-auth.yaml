id: saac03-2c-rds-proxy-iam-auth
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application on Amazon EC2 instances uses an Amazon Aurora MySQL DB cluster. A new security policy states that the application must not store any database password in its code or configuration, and that it must authenticate to the database tier with the IAM credentials of the instance role. The application also opens many short-lived connections, so the company needs connection pooling in front of the cluster.

    Which solution will meet these requirements?
  fr: |
    Une application sur des instances Amazon EC2 utilise un cluster de base de données Amazon Aurora MySQL. Une nouvelle politique de sécurité impose que l'application ne stocke aucun mot de passe de base de données dans son code ou sa configuration, et qu'elle s'authentifie auprès du niveau base de données avec les informations d'identification IAM du rôle de l'instance. L'application ouvre aussi de nombreuses connexions de courte durée : l'entreprise a donc besoin d'un pool de connexions devant le cluster.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an RDS Proxy that requires IAM authentication for client connections and uses a Secrets Manager secret to connect to the cluster."
        fr: "Créer un RDS Proxy qui exige l'authentification IAM pour les connexions clientes et utilise un secret Secrets Manager pour se connecter au cluster."
    - id: b
      text:
        en: "Store the database password as a SecureString parameter in Parameter Store and have the application read it at startup."
        fr: "Stocker le mot de passe de la base de données comme paramètre SecureString dans Parameter Store et le faire lire par l'application au démarrage."
    - id: c
      text:
        en: "Enable IAM database authentication on the cluster and have the application connect directly to the cluster endpoint."
        fr: "Activer l'authentification de base de données IAM sur le cluster et faire en sorte que l'application se connecte directement au point de terminaison du cluster."
    - id: d
      text:
        en: "Store the database password in the EC2 user data and pass it to the application as an environment variable."
        fr: "Stocker le mot de passe de la base de données dans les données utilisateur EC2 et le transmettre à l'application comme variable d'environnement."
answer: { optionId: a }
explanation:
  correct:
    en: |
      RDS Proxy pools and shares database connections, and it can enforce IAM authentication for the clients that connect to it, so the application uses its instance role instead of a password. The proxy itself reaches the database with credentials stored in Secrets Manager (or with IAM database authentication), which the application never handles.
    fr: |
      RDS Proxy regroupe et partage les connexions à la base de données, et il peut imposer l'authentification IAM aux clients qui s'y connectent : l'application utilise son rôle d'instance au lieu d'un mot de passe. Le proxy lui-même atteint la base avec des informations d'identification stockées dans Secrets Manager (ou avec l'authentification de base de données IAM), que l'application ne manipule jamais.
  options:
    b:
      en: |
        The application still retrieves and uses a database password and does not authenticate with IAM, and there is no connection pooling.
      fr: |
        L'application récupère et utilise toujours un mot de passe de base de données et ne s'authentifie pas avec IAM, et il n'y a pas de pool de connexions.
    c:
      en: |
        IAM database authentication removes the password, but connecting directly to the cluster provides no connection pooling.
      fr: |
        L'authentification de base de données IAM supprime le mot de passe, mais la connexion directe au cluster n'offre aucun pool de connexions.
    d:
      en: |
        User data is instance configuration, so the password would be stored in configuration, which the policy forbids, and there is no pooling.
      fr: |
        Les données utilisateur font partie de la configuration de l'instance : le mot de passe serait stocké dans la configuration, ce que la politique interdit, et il n'y a pas de pool de connexions.
references:
  - title: Amazon RDS Proxy for Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/rds-proxy.html
