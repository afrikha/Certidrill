id: saac03-2c-static-stability-capacity
objective: "2.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a critical stateless application on Amazon EC2 instances in an Auto Scaling group across three Availability Zones behind an Application Load Balancer. The application needs 12 instances to handle peak load. If one Availability Zone fails during a peak, the application must keep serving the full peak load without depending on launching new instances during the event.

    Which configuration will meet these requirements?
  fr: |
    Une entreprise exécute une application critique sans état sur des instances Amazon EC2 dans un groupe Auto Scaling réparti sur trois zones de disponibilité derrière un Application Load Balancer. L'application a besoin de 12 instances pour absorber la charge de pointe. Si une zone de disponibilité tombe en panne pendant une pointe, l'application doit continuer à servir toute la charge de pointe sans dépendre du lancement de nouvelles instances pendant l'incident.

    Quelle configuration permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set a minimum of 12 instances (4 per zone) and rely on Auto Scaling to replace the lost instances in the remaining zones."
        fr: "Définir un minimum de 12 instances (4 par zone) et compter sur Auto Scaling pour remplacer les instances perdues dans les zones restantes."
    - id: b
      text:
        en: "Set a minimum of 12 instances (4 per zone) and add a target tracking policy that keeps average CPU utilization at 50 %."
        fr: "Définir un minimum de 12 instances (4 par zone) et ajouter une politique de suivi de cible qui maintient l'utilisation moyenne du processeur à 50 %."
    - id: c
      text:
        en: "Set a minimum of 18 instances (6 per zone) across the three Availability Zones."
        fr: "Définir un minimum de 18 instances (6 par zone) sur les trois zones de disponibilité."
    - id: d
      text:
        en: "Set a minimum of 12 instances in one zone and add a warm pool of stopped instances in the two other zones."
        fr: "Définir un minimum de 12 instances dans une seule zone et ajouter un groupe d'instances pré-initialisées (warm pool) arrêtées dans les deux autres zones."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Static stability means the system keeps working during a failure without relying on control plane actions such as launching instances. Pre-provisioning enough capacity in every zone (12 needed divided by 2 surviving zones = 6 per zone, 18 in total) lets the remaining zones absorb the full load immediately.
    fr: |
      La stabilité statique signifie que le système continue de fonctionner pendant une panne sans dépendre d'actions du plan de contrôle comme le lancement d'instances. Provisionner à l'avance une capacité suffisante dans chaque zone (12 instances nécessaires divisées par 2 zones restantes = 6 par zone, 18 au total) permet aux zones restantes d'absorber immédiatement toute la charge.
  options:
    a:
      en: |
        After the failure only 8 instances remain until replacements launch, so the application depends on the EC2 control plane during the event.
      fr: |
        Après la panne, il ne reste que 8 instances jusqu'au lancement des remplacements : l'application dépend du plan de contrôle EC2 pendant l'incident.
    b:
      en: |
        A scaling policy still has to launch instances after the failure, which is the dependency the company wants to avoid.
      fr: |
        Une politique de mise à l'échelle doit toujours lancer des instances après la panne, ce qui est la dépendance que l'entreprise veut éviter.
    d:
      en: |
        All running capacity is in one zone, so losing that zone stops the application, and the warm pool instances must be started first.
      fr: |
        Toute la capacité active est dans une seule zone : la perte de cette zone arrête l'application, et les instances du warm pool doivent d'abord être démarrées.
references:
  - title: Static stability
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/static-stability.html
