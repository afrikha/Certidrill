id: saac03-2a-security-group-chaining
objective: "2.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A three-tier application uses an internet-facing Application Load Balancer with the security group sg-alb, application instances on port 8080 with the security group sg-app, and an Amazon RDS for PostgreSQL DB instance on port 5432 with the security group sg-db. The application instances scale in and out, so their IP addresses change. The company wants least-privilege access: the application instances must accept traffic only from the load balancer, and the database must accept traffic only from the application instances.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une application à trois niveaux utilise un Application Load Balancer accessible sur Internet avec le groupe de sécurité sg-alb, des instances d'application sur le port 8080 avec le groupe de sécurité sg-app, et une instance de base de données Amazon RDS for PostgreSQL sur le port 5432 avec le groupe de sécurité sg-db. Les instances d'application augmentent et diminuent en nombre : leurs adresses IP changent. L'entreprise veut un accès selon le principe du moindre privilège : les instances d'application ne doivent accepter que le trafic de l'équilibreur de charge, et la base de données uniquement celui des instances d'application.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an inbound rule to sg-app that allows TCP port 8080 from the source sg-alb.", fr: "Ajouter à sg-app une règle entrante qui autorise le port TCP 8080 depuis la source sg-alb." } }
    - { id: b, text: { en: "Add an inbound rule to sg-app that allows TCP port 8080 from 0.0.0.0/0.", fr: "Ajouter à sg-app une règle entrante qui autorise le port TCP 8080 depuis 0.0.0.0/0." } }
    - { id: c, text: { en: "Add an inbound rule to sg-db that allows TCP port 5432 from the source sg-app.", fr: "Ajouter à sg-db une règle entrante qui autorise le port TCP 5432 depuis la source sg-app." } }
    - { id: d, text: { en: "Add an inbound rule to sg-db that allows TCP port 5432 from the CIDR block of the VPC.", fr: "Ajouter à sg-db une règle entrante qui autorise le port TCP 5432 depuis le bloc CIDR du VPC." } }
    - { id: e, text: { en: "Add an outbound rule to sg-db that denies all traffic to the public subnets.", fr: "Ajouter à sg-db une règle sortante qui refuse tout le trafic vers les sous-réseaux publics." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A security group rule can use another security group as its source, which allows traffic from every resource that has that group, whatever its IP address. Referencing sg-alb in sg-app and sg-app in sg-db chains the tiers with least privilege and keeps working as instances are added or replaced.
    fr: |
      Une règle de groupe de sécurité peut utiliser un autre groupe de sécurité comme source, ce qui autorise le trafic de toute ressource associée à ce groupe, quelle que soit son adresse IP. Référencer sg-alb dans sg-app et sg-app dans sg-db enchaîne les niveaux selon le moindre privilège et continue de fonctionner quand des instances sont ajoutées ou remplacées.
  options:
    b: { en: "0.0.0.0/0 lets any source reach port 8080, which bypasses the load balancer and violates least privilege.", fr: "0.0.0.0/0 permet à n'importe quelle source d'atteindre le port 8080, ce qui contourne l'équilibreur de charge et enfreint le moindre privilège." }
    d: { en: "The VPC CIDR block also includes the load balancer and every other resource in the VPC, which is broader than the application instances.", fr: "Le bloc CIDR du VPC inclut aussi l'équilibreur de charge et toutes les autres ressources du VPC, ce qui est plus large que les seules instances d'application." }
    e: { en: "Security groups support only allow rules, so a deny rule cannot be created; outbound rules also do not control who can connect to the database.", fr: "Les groupes de sécurité ne prennent en charge que des règles d'autorisation : une règle de refus ne peut pas être créée ; les règles sortantes ne contrôlent pas non plus qui peut se connecter à la base de données." }
references:
  - title: Security group rules
    url: https://docs.aws.amazon.com/vpc/latest/userguide/security-group-rules.html
