id: saac03-2a-microservice-own-data
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has split its monolithic application into order, inventory and customer microservices that run on Amazon ECS. The three microservices still read and write the same tables in one shared Amazon RDS database. Last week, a schema change made by the inventory team broke the order microservice. The company wants each team to change and deploy its microservice independently.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution a découpé son application monolithique en microservices de commandes, d'inventaire et de clients qui s'exécutent sur Amazon ECS. Les trois microservices lisent et écrivent toujours les mêmes tables dans une base de données Amazon RDS partagée. La semaine dernière, une modification de schéma de l'équipe inventaire a cassé le microservice de commandes. L'entreprise veut que chaque équipe puisse modifier et déployer son microservice de façon indépendante.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a read replica of the shared database for each microservice, and keep all the writes on the primary instance.", fr: "Créer un réplica en lecture de la base partagée pour chaque microservice, et conserver toutes les écritures sur l'instance principale." }
    - id: b
      text: { en: "Place an Amazon RDS Proxy in front of the shared database, and connect the three microservices through the proxy.", fr: "Placer un Amazon RDS Proxy devant la base partagée, et connecter les trois microservices via le proxy." }
    - id: c
      text: { en: "Give each microservice its own data store that only it accesses, and expose its data to the others through its API or through events.", fr: "Donner à chaque microservice son propre magasin de données auquel lui seul accède, et exposer ses données aux autres via son API ou via des événements." }
    - id: d
      text: { en: "Combine the three microservices in a single ECS task definition so that they are always deployed together.", fr: "Regrouper les trois microservices dans une seule définition de tâche ECS afin qu'ils soient toujours déployés ensemble." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In a microservices architecture, each service maintains its own data instead of sharing one database, which keeps the services independent and decentralized. Other services reach that data only through the owning service's API or the events it publishes, so a schema change stays internal to one team.
    fr: |
      Dans une architecture de microservices, chaque service gère ses propres données au lieu de partager une base unique, ce qui garde les services indépendants et décentralisés. Les autres services n'accèdent à ces données que via l'API du service propriétaire ou les événements qu'il publie : une modification de schéma reste interne à une équipe.
  options:
    a: { en: "Read replicas copy the same schema, so a schema change still affects every microservice.", fr: "Les réplicas en lecture copient le même schéma : une modification de schéma affecte toujours tous les microservices." }
    b: { en: "RDS Proxy pools database connections; the services still share one schema and remain coupled.", fr: "RDS Proxy mutualise les connexions à la base de données ; les services partagent toujours un schéma et restent couplés." }
    d: { en: "Deploying the services together increases coupling, which is the opposite of independent deployments.", fr: "Déployer les services ensemble augmente le couplage, ce qui est l'inverse de déploiements indépendants." }
references:
  - title: Distributed data management
    url: https://docs.aws.amazon.com/whitepapers/latest/microservices-on-aws/distributed-data-management.html
