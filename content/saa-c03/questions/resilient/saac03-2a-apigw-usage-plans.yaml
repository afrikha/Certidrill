id: saac03-2a-apigw-usage-plans
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company exposes a REST API through Amazon API Gateway. The company sells three subscription tiers. Each customer must receive a request rate limit and a monthly request quota that depend on its tier, and the company must be able to identify which customer sent each request.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels expose une API REST via Amazon API Gateway. L'entreprise vend trois niveaux d'abonnement. Chaque client doit recevoir une limite de débit de requêtes et un quota mensuel de requêtes qui dépendent de son niveau, et l'entreprise doit pouvoir identifier le client qui a envoyé chaque requête.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an HTTP API with a JWT authorizer, and configure route-level throttling for each subscription tier.", fr: "Créer une API HTTP avec un mécanisme d'autorisation JWT, et configurer une limitation au niveau des routes pour chaque niveau d'abonnement." }
    - id: b
      text: { en: "Associate an AWS WAF web ACL with the API stage, and create one rate-based rule for each subscription tier.", fr: "Associer une ACL web AWS WAF à l'étape de l'API, et créer une règle basée sur le débit pour chaque niveau d'abonnement." }
    - id: c
      text: { en: "Create one usage plan for each tier, issue an API key to each customer, and associate each key with the usage plan of its tier.", fr: "Créer un plan d'utilisation par niveau, attribuer une clé d'API à chaque client, et associer chaque clé au plan d'utilisation de son niveau." }
    - id: d
      text: { en: "Deploy one API stage for each tier, and configure the default stage-level throttling of each stage for that tier.", fr: "Déployer une étape d'API par niveau, et configurer la limitation par défaut au niveau de chaque étape pour ce niveau." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Usage plans set a throttling rate and a request quota that apply to each API key associated with the plan, and the API key identifies the calling customer. Creating one plan per tier and one key per customer gives every customer the limits of its tier. API keys identify and meter clients; they should be combined with an authorizer (IAM, Lambda or Amazon Cognito) rather than used as the only access control.
    fr: |
      Les plans d'utilisation définissent une limitation de débit et un quota de requêtes qui s'appliquent à chaque clé d'API associée au plan, et la clé d'API identifie le client appelant. Un plan par niveau et une clé par client donnent à chaque client les limites de son niveau. Les clés d'API identifient et mesurent les clients ; elles doivent être combinées à un mécanisme d'autorisation (IAM, Lambda ou Amazon Cognito) plutôt que servir de seul contrôle d'accès.
  options:
    a:
      en: |
        HTTP APIs do not support API keys, usage plans or per-client throttling; route throttling applies to all callers of the route together, and there is no monthly quota.
      fr: |
        Les API HTTP ne prennent en charge ni les clés d'API, ni les plans d'utilisation, ni la limitation par client ; la limitation d'une route s'applique à tous ses appelants ensemble, et il n'existe pas de quota mensuel.
    b:
      en: |
        AWS WAF rate-based rules count requests over a short time window per aggregation key such as the source IP address; they do not provide monthly quotas per customer.
      fr: |
        Les règles basées sur le débit d'AWS WAF comptent les requêtes sur une courte fenêtre de temps par clé d'agrégation, comme l'adresse IP source ; elles ne fournissent pas de quota mensuel par client.
    d:
      en: |
        Stage-level throttling limits all clients of the stage together, so one busy customer consumes the limit of the whole tier, and it provides neither quotas nor customer identification.
      fr: |
        La limitation au niveau de l'étape s'applique à tous les clients de l'étape ensemble : un client très actif consomme la limite de tout le niveau, et elle ne fournit ni quota ni identification des clients.
references:
  - title: Usage plans and API keys for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
