id: saac03-2c-active-active-global-tables
objective: "2.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs its API in us-east-1 and eu-west-1. Users must read and write data in their nearest Region with low latency. If either Region becomes unavailable, the other Region must continue to accept writes with an RTO near zero, without any manual database promotion or failover operation.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de paiement exécute son API dans us-east-1 et eu-west-1. Les utilisateurs doivent lire et écrire des données dans leur Région la plus proche avec une faible latence. Si l'une des Régions devient indisponible, l'autre doit continuer à accepter les écritures avec un RTO proche de zéro, sans promotion manuelle de base de données ni opération de basculement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use an Aurora global database with the primary cluster in us-east-1 and a secondary cluster in eu-west-1, and use Route 53 failover routing."
        fr: "Utiliser une base de données globale Aurora avec le cluster principal dans us-east-1 et un cluster secondaire dans eu-west-1, et le routage de basculement Route 53."
    - id: b
      text:
        en: "Use RDS for MySQL in us-east-1 with a cross-Region read replica in eu-west-1, and promote the replica if us-east-1 fails."
        fr: "Utiliser RDS for MySQL dans us-east-1 avec un réplica en lecture entre Régions dans eu-west-1, et promouvoir le réplica en cas de défaillance de us-east-1."
    - id: c
      text:
        en: "Use a DynamoDB table in us-east-1 and copy its on-demand backups to eu-west-1 every hour for restoration after a failure."
        fr: "Utiliser une table DynamoDB dans us-east-1 et copier ses sauvegardes à la demande vers eu-west-1 toutes les heures pour une restauration après une défaillance."
    - id: d
      text:
        en: "Use a DynamoDB global table with replicas in both Regions, and use Route 53 latency routing with health checks to the Regional APIs."
        fr: "Utiliser une table globale DynamoDB avec des réplicas dans les deux Régions, et le routage par latence Route 53 avec des vérifications de l'état vers les API régionales."
answer: { optionId: d }
explanation:
  correct:
    en: |
      DynamoDB global tables are multi-active: every replica accepts local reads and writes, and there is no primary table, so losing a Region requires no promotion or database failover. Route 53 latency routing with health checks sends users to the nearest healthy Region, which gives a multi-site active/active design with an RTO near zero.
    fr: |
      Les tables globales DynamoDB sont multi-actives : chaque réplica accepte les lectures et les écritures locales et il n'y a pas de table principale, donc la perte d'une Région n'exige ni promotion ni basculement de base de données. Le routage par latence Route 53 avec vérifications de l'état dirige les utilisateurs vers la Région saine la plus proche, ce qui donne une conception multisite actif/actif avec un RTO proche de zéro.
  options:
    a:
      en: |
        An Aurora global database has a single primary Region that processes all writes, and recovery after a Regional outage requires a global database failover operation.
      fr: |
        Une base de données globale Aurora a une seule Région principale, qui traite toutes les écritures, et la reprise après une panne régionale exige une opération de basculement de la base globale.
    b:
      en: |
        European users cannot write locally, and promoting the replica is a manual step that adds recovery time.
      fr: |
        Les utilisateurs européens ne peuvent pas écrire localement, et la promotion du réplica est une étape manuelle qui allonge le temps de récupération.
    c:
      en: |
        Restoring from backups is a backup and restore strategy with an RTO of hours and up to an hour of data loss, and users in Europe cannot write locally.
      fr: |
        La restauration à partir de sauvegardes est une stratégie de sauvegarde et restauration avec un RTO de plusieurs heures et jusqu'à une heure de perte de données, et les utilisateurs européens ne peuvent pas écrire localement.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
