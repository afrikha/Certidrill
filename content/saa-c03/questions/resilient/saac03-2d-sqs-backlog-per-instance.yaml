id: saac03-2d-sqs-backlog-per-instance
objective: "2.2.15"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company processes uploaded images with Amazon EC2 instances in an Auto Scaling group. The instances poll an Amazon SQS queue. The business requires every image to be processed within 2 minutes of upload. Each instance processes one message in about 2 seconds.

    The current scaling policy tracks average CPU utilization and reacts too slowly when uploads spike. A solutions architect must choose a scaling metric that reflects the business requirement without running more instances than necessary.

    Which solution will meet these requirements?
  fr: |
    Une entreprise traite des images chargées par ses utilisateurs avec des instances Amazon EC2 d'un groupe Auto Scaling. Les instances interrogent une file d'attente Amazon SQS. L'entreprise exige que chaque image soit traitée dans les 2 minutes qui suivent son chargement. Chaque instance traite un message en 2 secondes environ.

    La politique de mise à l'échelle actuelle suit l'utilisation moyenne du processeur et réagit trop lentement lors des pics de chargement. Un architecte de solutions doit choisir une métrique de mise à l'échelle qui reflète l'exigence métier sans exécuter plus d'instances que nécessaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a target tracking policy on the ApproximateNumberOfMessagesVisible metric of the queue, with a target value of 60.", fr: "Créer une politique de suivi de la cible sur la métrique ApproximateNumberOfMessagesVisible de la file d'attente, avec une valeur cible de 60." } }
    - { id: b, text: { en: "Create a target tracking policy on the backlog per instance (queue messages divided by InService instances), with a target of 60.", fr: "Créer une politique de suivi de la cible sur le backlog par instance (messages de la file divisés par les instances InService), avec une cible de 60." } }
    - { id: c, text: { en: "Create a step scaling policy that adds two instances when the average CPU utilization of the group exceeds 50 percent.", fr: "Créer une politique de mise à l'échelle par étapes qui ajoute deux instances lorsque l'utilisation moyenne du processeur du groupe dépasse 50 %." } }
    - { id: d, text: { en: "Create a scheduled scaling action that doubles the capacity of the group every weekday during business hours.", fr: "Créer une action de mise à l'échelle planifiée qui double la capacité du groupe chaque jour ouvré pendant les heures ouvrées." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The acceptable backlog per instance is the longest acceptable latency divided by the processing time of one message, here 120 / 2 = 60 messages. Tracking the backlog per instance (queue depth divided by the number of InService instances, which metric math can compute) scales the group in proportion to the work that each instance faces, so the 2-minute target holds when uploads spike.
    fr: |
      Le backlog acceptable par instance est la latence maximale acceptable divisée par le temps de traitement d'un message, ici 120 / 2 = 60 messages. Suivre le backlog par instance (profondeur de la file divisée par le nombre d'instances InService, calculable avec les mathématiques de métriques) adapte le groupe en proportion du travail de chaque instance : l'objectif de 2 minutes est tenu lors des pics de chargement.
  options:
    a: { en: "Queue depth alone ignores how many instances are running, so the policy adds more instances than needed while the queue drains; 60 messages for the whole group is also far below what the requirement allows.", fr: "La profondeur de la file seule ignore le nombre d'instances en cours d'exécution : la politique ajoute plus d'instances que nécessaire pendant que la file se vide, et 60 messages pour tout le groupe est bien en deçà de ce que l'exigence autorise." }
    c: { en: "CPU utilization does not reflect how long images wait in the queue, which is the business requirement; it is the metric that already reacts too slowly.", fr: "L'utilisation du processeur ne reflète pas le temps d'attente des images dans la file, qui est l'exigence métier ; c'est précisément la métrique qui réagit déjà trop lentement." }
    d: { en: "A fixed schedule cannot react to unpredictable upload spikes and wastes capacity when there are no uploads.", fr: "Une planification fixe ne peut pas réagir à des pics de chargement imprévisibles et gaspille de la capacité en l'absence de chargements." }
references:
  - title: Scaling policy based on Amazon SQS
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
