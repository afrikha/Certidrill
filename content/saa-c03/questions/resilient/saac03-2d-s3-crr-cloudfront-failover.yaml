id: saac03-2d-s3-crr-cloudfront-failover
objective: "2.2.14"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A media company serves a static website and its images from an Amazon S3 bucket in eu-west-1 through an Amazon CloudFront distribution. Editors upload new objects several times each day.

    The company requires the website to keep serving all content, including recently uploaded objects, if Amazon S3 in eu-west-1 becomes unavailable. Failover must happen without manual DNS changes.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de médias sert un site web statique et ses images depuis un compartiment Amazon S3 de eu-west-1, via une distribution Amazon CloudFront. Des rédacteurs chargent de nouveaux objets plusieurs fois par jour.

    L'entreprise exige que le site continue à servir tout le contenu, y compris les objets chargés récemment, si Amazon S3 devient indisponible dans eu-west-1. Le basculement doit se faire sans modification manuelle du DNS.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Configure S3 Same-Region Replication from the bucket to a second bucket in eu-west-1 that another account owns.", fr: "Configurer S3 Same-Region Replication du compartiment vers un deuxième compartiment de eu-west-1 appartenant à un autre compte." } }
    - { id: b, text: { en: "Configure S3 Cross-Region Replication from the bucket to a bucket in a second Region.", fr: "Configurer S3 Cross-Region Replication du compartiment vers un compartiment d'une deuxième Région." } }
    - { id: c, text: { en: "Enable S3 Transfer Acceleration on the bucket and use the accelerate endpoint for uploads.", fr: "Activer S3 Transfer Acceleration sur le compartiment et utiliser le point de terminaison accéléré pour les chargements." } }
    - { id: d, text: { en: "Increase the default TTL of the CloudFront cache behavior to 30 days so that objects stay at edge locations.", fr: "Augmenter à 30 jours le TTL par défaut du comportement de cache CloudFront pour que les objets restent dans les emplacements périphériques." } }
    - { id: e, text: { en: "Create a CloudFront origin group with the original bucket as the primary origin and the replica bucket as the secondary origin.", fr: "Créer un groupe d'origines CloudFront avec le compartiment d'origine comme origine principale et le compartiment réplica comme origine secondaire." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      Cross-Region Replication (which requires S3 Versioning on both buckets) copies every new and updated object to a bucket in another Region. A CloudFront origin group sends each cache miss to the primary origin and retries on the secondary origin when the primary returns a configured status code, cannot be reached, or times out. Origin failover applies to GET, HEAD, and OPTIONS requests, which is what a static website uses, and the DNS name of the distribution does not change.
    fr: |
      S3 Cross-Region Replication (qui exige S3 Versioning sur les deux compartiments) copie chaque objet nouveau ou mis à jour vers un compartiment d'une autre Région. Un groupe d'origines CloudFront envoie chaque échec de cache à l'origine principale et réessaie sur l'origine secondaire lorsque l'origine principale renvoie un code d'état configuré, est injoignable ou expire. Le basculement d'origine s'applique aux requêtes GET, HEAD et OPTIONS, qui sont celles d'un site statique, et le nom DNS de la distribution ne change pas.
  options:
    a: { en: "Both buckets would be in eu-west-1, so a Regional outage of S3 would affect them both.", fr: "Les deux compartiments seraient dans eu-west-1 : une panne régionale de S3 les toucherait tous les deux." }
    c: { en: "Transfer Acceleration speeds up long-distance uploads to the bucket; it adds no second copy of the data.", fr: "Transfer Acceleration accélère les chargements longue distance vers le compartiment ; il n'ajoute aucune seconde copie des données." }
    d: { en: "A longer TTL only helps for objects already cached at an edge location; cache misses and newly uploaded objects would still fail.", fr: "Un TTL plus long n'aide que pour les objets déjà en cache dans un emplacement périphérique ; les échecs de cache et les objets récemment chargés échoueraient toujours." }
references:
  - title: Optimize high availability with CloudFront origin failover
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/high_availability_origin_failover.html
  - title: Replicating objects within and across Regions
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html
