id: saac03-2c-rds-proxy-failover
objective: "2.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application on Amazon EC2 instances connects to an Amazon RDS for PostgreSQL Multi-AZ DB instance. During failover tests, the application shows errors for longer than expected, because the clients keep cached DNS entries that point to the old primary and must re-establish all their connections. The company wants the application to be more resilient to database failover and to preserve client connections where possible. The only change allowed in the application is the database endpoint.

    Which solution will meet these requirements?
  fr: |
    Une application sur des instances Amazon EC2 se connecte à une instance de base de données Amazon RDS for PostgreSQL Multi-AZ. Lors des tests de basculement, l'application affiche des erreurs plus longtemps que prévu, car les clients conservent en cache des entrées DNS qui pointent vers l'ancienne instance principale et doivent rétablir toutes leurs connexions. L'entreprise souhaite que l'application résiste mieux au basculement de la base de données et que les connexions clientes soient préservées lorsque c'est possible. La seule modification autorisée dans l'application est le point de terminaison de la base de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a read replica and change the application to connect to the replica endpoint."
        fr: "Créer un réplica en lecture et modifier l'application pour qu'elle se connecte au point de terminaison du réplica."
    - id: b
      text:
        en: "Create an RDS Proxy for the DB instance and change the application to connect to the proxy endpoint."
        fr: "Créer un RDS Proxy pour l'instance de base de données et modifier l'application pour qu'elle se connecte au point de terminaison du proxy."
    - id: c
      text:
        en: "Create a Route 53 private hosted zone CNAME record with a 5-second TTL that points to the DB instance endpoint."
        fr: "Créer dans une zone hébergée privée Route 53 un enregistrement CNAME avec un TTL de 5 secondes qui pointe vers le point de terminaison de l'instance."
    - id: d
      text:
        en: "Create a Network Load Balancer that targets the IP address of the DB instance and connect through the load balancer."
        fr: "Créer un Network Load Balancer qui cible l'adresse IP de l'instance de base de données et se connecter via l'équilibreur de charge."
answer: { optionId: b }
explanation:
  correct:
    en: |
      RDS Proxy makes applications more resilient to database failures: it connects to the standby DB instance automatically while preserving the application connections. Clients keep talking to the proxy endpoint, so they no longer depend on their DNS cache to find the new primary.
    fr: |
      RDS Proxy rend les applications plus résilientes aux défaillances de base de données : il se connecte automatiquement à l'instance de secours tout en préservant les connexions de l'application. Les clients continuent de communiquer avec le point de terminaison du proxy et ne dépendent plus de leur cache DNS pour trouver la nouvelle instance principale.
  options:
    a:
      en: |
        A read replica is read-only and is a separate database; it does not help the writer connections survive a Multi-AZ failover.
      fr: |
        Un réplica en lecture est en lecture seule et constitue une base distincte ; il n'aide pas les connexions d'écriture à survivre à un basculement Multi-AZ.
    c:
      en: |
        Another CNAME still resolves to the RDS endpoint, client caching behavior does not change, and connections are still dropped at failover.
      fr: |
        Un autre CNAME résout toujours vers le point de terminaison RDS, le comportement du cache des clients ne change pas, et les connexions sont toujours coupées au basculement.
    d:
      en: |
        The DB instance's IP address changes when the standby is promoted, so the load balancer would keep sending traffic to the old address.
      fr: |
        L'adresse IP de l'instance change lorsque l'instance de secours est promue : l'équilibreur continuerait d'envoyer le trafic vers l'ancienne adresse.
references:
  - title: Amazon RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
