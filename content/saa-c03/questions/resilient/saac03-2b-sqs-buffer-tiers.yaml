id: saac03-2b-sqs-buffer-tiers
objective: "2.1.19"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's web tier sends image-processing requests directly to a processing tier over HTTP. During traffic spikes, the processing tier becomes overloaded and requests are lost. The requests do not need to be processed immediately, but none of them can be lost. The company wants to decouple the two tiers.

    Which solution will meet these requirements?
  fr: |
    Le niveau web d'une entreprise envoie des demandes de traitement d'images directement à un niveau de traitement via HTTP. Pendant les pics de trafic, le niveau de traitement est surchargé et des demandes sont perdues. Les demandes n'ont pas besoin d'être traitées immédiatement, mais aucune ne doit être perdue. L'entreprise veut découpler les deux niveaux.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Place a Network Load Balancer in front of the processing tier, and send the requests to the load balancer.", fr: "Placer un Network Load Balancer devant le niveau de traitement, et envoyer les demandes à l'équilibreur de charge." }
    - id: b
      text: { en: "Have the web tier send each request to an Amazon SQS queue, and have the processing tier poll the queue.", fr: "Faire envoyer chaque demande par le niveau web dans une file d'attente Amazon SQS, et faire interroger la file par le niveau de traitement." }
    - id: c
      text: { en: "Move the processing tier to a larger instance type so that it can handle the traffic spikes.", fr: "Passer le niveau de traitement à un type d'instance plus grand afin qu'il absorbe les pics de trafic." }
    - id: d
      text: { en: "Have the web tier publish each request to an Amazon SNS topic with an HTTP subscription to the processing tier.", fr: "Faire publier chaque demande par le niveau web dans une rubrique Amazon SNS avec un abonnement HTTP vers le niveau de traitement." }
answer: { optionId: b }
explanation:
  correct:
    en: An SQS queue stores the requests durably until the processing tier polls and deletes them, so a spike only makes the queue grow instead of overloading the consumers. The web tier no longer depends on the availability or speed of the processing tier, which is loose coupling.
    fr: Une file d'attente SQS stocke les demandes de manière durable jusqu'à ce que le niveau de traitement les interroge et les supprime ; un pic ne fait donc qu'allonger la file au lieu de surcharger les consommateurs. Le niveau web ne dépend plus de la disponibilité ni de la vitesse du niveau de traitement, ce qui constitue un couplage faible.
  options:
    a:
      en: A load balancer spreads requests across targets but does not store them; overloaded targets still drop requests.
      fr: Un équilibreur de charge répartit les demandes entre les cibles mais ne les stocke pas ; des cibles surchargées perdent toujours des demandes.
    c:
      en: A larger instance raises capacity but keeps the tiers tightly coupled; a bigger spike would still lose requests.
      fr: Une instance plus grande augmente la capacité mais garde les niveaux fortement couplés ; un pic plus important ferait toujours perdre des demandes.
    d:
      en: SNS pushes messages to the HTTP endpoint immediately and does not hold them for the consumer to process at its own pace.
      fr: SNS pousse immédiatement les messages vers le point de terminaison HTTP et ne les conserve pas pour que le consommateur les traite à son rythme.
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
