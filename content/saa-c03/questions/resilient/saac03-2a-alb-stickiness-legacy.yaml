id: saac03-2a-alb-stickiness-legacy
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a vendor web application on Amazon EC2. The application keeps session state in memory, and the company cannot modify it because it has no access to the source code. To improve availability, the company now runs the application on several instances in an Auto Scaling group behind an Application Load Balancer across two Availability Zones. Users are signed out when consecutive requests reach different instances. Users must stay on the same instance during their session, and users on a failed instance can sign in again.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute sur Amazon EC2 une application web d'éditeur. L'application conserve l'état de session en mémoire, et l'entreprise ne peut pas la modifier, car elle n'a pas accès au code source. Pour améliorer la disponibilité, l'entreprise exécute désormais l'application sur plusieurs instances dans un groupe Auto Scaling derrière un Application Load Balancer sur deux zones de disponibilité. Les utilisateurs sont déconnectés quand des requêtes successives atteignent des instances différentes. Les utilisateurs doivent rester sur la même instance pendant leur session, et ceux d'une instance défaillante peuvent se reconnecter.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the session state in an Amazon ElastiCache cache that all the instances share.", fr: "Stocker l'état de session dans un cache Amazon ElastiCache partagé par toutes les instances." }
    - id: b
      text: { en: "Replace the load balancer with Route 53 multivalue answer records that return the IP addresses of the instances.", fr: "Remplacer l'équilibreur de charge par des enregistrements Route 53 à réponses multivaleurs qui renvoient les adresses IP des instances." }
    - id: c
      text: { en: "Turn off cross-zone load balancing on the target group so that each user stays in one Availability Zone.", fr: "Désactiver l'équilibrage de charge entre zones sur le groupe cible afin que chaque utilisateur reste dans une zone de disponibilité." }
    - id: d
      text: { en: "Turn on duration-based stickiness on the target group so that the load balancer cookie keeps each user on one instance.", fr: "Activer la persistance basée sur la durée (duration-based stickiness) sur le groupe cible afin que le cookie de l'équilibreur de charge maintienne chaque utilisateur sur une instance." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Externalizing state is the preferred design, but it requires changing the application. With duration-based stickiness, the load balancer generates its own AWSALB cookie and routes each user's requests to the same target, which suits a stateful application without its own session cookie. If that target becomes unhealthy, the load balancer selects a new target, which the company accepts.
    fr: |
      Externaliser l'état est la conception à privilégier, mais elle impose de modifier l'application. Avec la persistance basée sur la durée, l'équilibreur de charge génère son propre cookie AWSALB et dirige les requêtes de chaque utilisateur vers la même cible, ce qui convient à une application avec état sans cookie de session propre. Si cette cible devient défaillante, l'équilibreur en choisit une nouvelle, ce que l'entreprise accepte.
  options:
    a: { en: "A shared session store is the stateless design, but the application must be changed to use it, which is impossible here.", fr: "Un magasin de sessions partagé correspond à la conception sans état, mais l'application doit être modifiée pour l'utiliser, ce qui est impossible ici." }
    b: { en: "DNS answers are cached and are not tied to a user session, so requests from one user can still reach different instances.", fr: "Les réponses DNS sont mises en cache et ne sont pas liées à une session utilisateur : les requêtes d'un même utilisateur peuvent toujours atteindre des instances différentes." }
    c: { en: "Without cross-zone load balancing, requests are still spread across the instances of a zone, and ALB sticky sessions are not supported when it is turned off.", fr: "Sans équilibrage entre zones, les requêtes sont toujours réparties entre les instances d'une zone, et les sessions permanentes ALB ne sont pas prises en charge lorsqu'il est désactivé." }
references:
  - title: Edit target group attributes for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/edit-target-group-attributes.html
