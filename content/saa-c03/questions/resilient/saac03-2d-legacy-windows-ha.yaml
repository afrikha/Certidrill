id: saac03-2d-legacy-windows-ha
objective: "2.2.19"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a legacy .NET application on Windows-based Amazon EC2 instances. The application stores documents on an SMB file share hosted by one Windows file server instance and uses a Microsoft SQL Server database installed on another instance. Both servers are in the same Availability Zone.

    The application code cannot be changed, but the share path and the database connection string can be updated. The company wants to remove these single points of failure with the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application .NET héritée sur des instances Amazon EC2 Windows. L'application stocke des documents sur un partage de fichiers SMB hébergé par une instance de serveur de fichiers Windows et utilise une base de données Microsoft SQL Server installée sur une autre instance. Les deux serveurs se trouvent dans la même zone de disponibilité.

    Le code de l'application ne peut pas être modifié, mais le chemin du partage et la chaîne de connexion à la base de données peuvent être mis à jour. L'entreprise veut supprimer ces points de défaillance uniques avec le MOINS de charge opérationnelle possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Move the documents to an Amazon FSx for Windows File Server Multi-AZ file system and update the share path.", fr: "Déplacer les documents vers un système de fichiers Amazon FSx for Windows File Server Multi-AZ et mettre à jour le chemin du partage." } }
    - { id: b, text: { en: "Move the documents to an Amazon EFS Regional file system and mount it on the Windows instances.", fr: "Déplacer les documents vers un système de fichiers Amazon EFS régional et le monter sur les instances Windows." } }
    - { id: c, text: { en: "Move the documents to an Amazon FSx for Windows File Server Single-AZ file system and update the share path.", fr: "Déplacer les documents vers un système de fichiers Amazon FSx for Windows File Server Single-AZ et mettre à jour le chemin du partage." } }
    - { id: d, text: { en: "Migrate the database to an Amazon RDS for SQL Server Multi-AZ deployment and update the connection string.", fr: "Migrer la base de données vers un déploiement Amazon RDS for SQL Server Multi-AZ et mettre à jour la chaîne de connexion." } }
    - { id: e, text: { en: "Store the documents in an Amazon S3 bucket and access them through the S3 API.", fr: "Stocker les documents dans un compartiment Amazon S3 et y accéder via l'API S3." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      FSx for Windows File Server Multi-AZ runs a preferred and a standby file server in two Availability Zones and fails over automatically, typically in less than 30 seconds, while the DNS name stays the same for Windows clients. RDS for SQL Server Multi-AZ keeps a synchronized standby and fails over automatically behind the same endpoint. Both are managed services that need only a configuration change in the application.
    fr: |
      FSx for Windows File Server Multi-AZ exécute un serveur de fichiers préféré et un serveur de secours dans deux zones de disponibilité et bascule automatiquement, généralement en moins de 30 secondes, tandis que le nom DNS reste le même pour les clients Windows. RDS for SQL Server Multi-AZ maintient une instance de secours synchronisée et bascule automatiquement derrière le même point de terminaison. Les deux sont des services gérés qui n'exigent qu'une modification de configuration de l'application.
  options:
    b: { en: "Amazon EFS is not supported on Windows-based EC2 instances, and it provides NFS, not SMB.", fr: "Amazon EFS n'est pas pris en charge sur les instances EC2 Windows, et il fournit du NFS, pas du SMB." }
    c: { en: "A Single-AZ file system runs in one Availability Zone, so it remains a single point of failure if that zone fails.", fr: "Un système de fichiers Single-AZ s'exécute dans une seule zone de disponibilité : il reste un point de défaillance unique si cette zone tombe en panne." }
    e: { en: "Accessing objects through the S3 API requires changing the application code, which is not allowed.", fr: "Accéder aux objets via l'API S3 exige de modifier le code de l'application, ce qui n'est pas permis." }
references:
  - title: "Availability and durability: Single-AZ and Multi-AZ file systems"
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/high-availability-multiAZ.html
  - title: Multi-AZ deployments for Amazon RDS for Microsoft SQL Server
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_SQLServerMultiAZ.html
