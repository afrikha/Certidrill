id: saac03-2d-dx-vpn-backup
objective: "2.2.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company connects its data center to several VPCs through a transit gateway and a single 1 Gbps AWS Direct Connect connection. Traffic averages 300 Mbps.

    Management wants connectivity between the data center and AWS to continue if the Direct Connect connection or the Direct Connect location fails. Reduced performance is acceptable during such a failure. The solution must be the MOST cost-effective.

    Which solution will meet these requirements?
  fr: |
    Une entreprise relie son centre de données à plusieurs VPC via une passerelle de transit et une seule connexion AWS Direct Connect de 1 Gbit/s. Le trafic moyen est de 300 Mbit/s.

    La direction veut que la connectivité entre le centre de données et AWS se maintienne si la connexion Direct Connect ou l'emplacement Direct Connect tombe en panne. Des performances réduites sont acceptables pendant une telle panne. La solution doit être la PLUS rentable possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an AWS Site-to-Site VPN connection to the transit gateway as a backup path, with BGP preferring the Direct Connect routes.", fr: "Créer une connexion AWS Site-to-Site VPN vers la passerelle de transit comme chemin de secours, avec BGP qui privilégie les routes Direct Connect." } }
    - { id: b, text: { en: "Order a second dedicated Direct Connect connection at a different Direct Connect location, and use BGP to share the traffic.", fr: "Commander une deuxième connexion Direct Connect dédiée dans un autre emplacement Direct Connect, et utiliser BGP pour répartir le trafic." } }
    - { id: c, text: { en: "Order a second Direct Connect connection that terminates on a different device at the same Direct Connect location.", fr: "Commander une deuxième connexion Direct Connect qui aboutit sur un autre équipement du même emplacement Direct Connect." } }
    - { id: d, text: { en: "Create a second transit virtual interface on the existing Direct Connect connection and associate it with the transit gateway.", fr: "Créer une deuxième interface virtuelle de transit sur la connexion Direct Connect existante et l'associer à la passerelle de transit." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The AWS Well-Architected Reliability Pillar describes a Site-to-Site VPN that terminates on a transit gateway as a cost-effective backup to a primary Direct Connect connection. The VPN runs over the internet, so it does not share the Direct Connect connection or location, and each tunnel supports up to 1.25 Gbps, which covers the 300 Mbps average at reduced but acceptable performance.
    fr: |
      Le pilier Fiabilité d'AWS Well-Architected décrit un Site-to-Site VPN qui aboutit sur une passerelle de transit comme une solution de secours rentable pour une connexion Direct Connect principale. Le VPN passe par Internet : il ne partage ni la connexion ni l'emplacement Direct Connect, et chaque tunnel prend en charge jusqu'à 1,25 Gbit/s, ce qui couvre les 300 Mbit/s moyens avec des performances réduites mais acceptables.
  options:
    b: { en: "A second connection at another location is the more resilient design, but it costs much more than a VPN, and the company accepts reduced performance during a failure.", fr: "Une deuxième connexion dans un autre emplacement est la conception la plus résiliente, mais elle coûte bien plus cher qu'un VPN, et l'entreprise accepte des performances réduites pendant une panne." }
    c: { en: "Both connections would share the same Direct Connect location, so a location failure would still cut connectivity, and it costs more than a VPN.", fr: "Les deux connexions partageraient le même emplacement Direct Connect : une panne de l'emplacement couperait toujours la connectivité, et cela coûte plus cher qu'un VPN." }
    d: { en: "A second virtual interface runs on the same physical connection, so it fails together with that connection.", fr: "Une deuxième interface virtuelle utilise la même connexion physique : elle tombe en panne en même temps que cette connexion." }
references:
  - title: REL02-BP02 Provision redundant connectivity between private networks in the cloud and on-premises environments
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_planning_network_topology_ha_conn_private_networks.html
  - title: AWS Direct Connect Resiliency Toolkit
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_toolkit.html
