id: saac03-2c-s3-one-zone-ia-thumbnails
objective: "2.2.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A photo-sharing company stores original images in S3 Standard. The application also generates thumbnails, which are stored in a separate Amazon S3 bucket. The thumbnails can be regenerated from the originals if they are lost. They are accessed infrequently, but when they are requested they must be returned in milliseconds.

    Which storage class for the thumbnails will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise de partage de photos stocke les images originales dans S3 Standard. L'application génère aussi des miniatures, stockées dans un compartiment Amazon S3 distinct. Les miniatures peuvent être régénérées à partir des originaux en cas de perte. Elles sont rarement consultées, mais lorsqu'elles sont demandées, elles doivent être renvoyées en quelques millisecondes.

    Quelle classe de stockage pour les miniatures permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: S3 Standard
    - id: b
      text: S3 One Zone-IA
    - id: c
      text: S3 Glacier Deep Archive
    - id: d
      text: S3 Standard-IA
answer: { optionId: b }
explanation:
  correct:
    en: |
      S3 One Zone-IA stores data in a single Availability Zone, so it costs less than S3 Standard-IA, with millisecond access for infrequently accessed data. It is not resilient to the physical loss of that zone, which is acceptable here because the thumbnails can be re-created from the originals.
    fr: |
      S3 One Zone-IA stocke les données dans une seule zone de disponibilité : il coûte moins cher que S3 Standard-IA, avec un accès en millisecondes pour des données rarement consultées. Il ne résiste pas à la perte physique de cette zone, ce qui est acceptable ici puisque les miniatures peuvent être recréées à partir des originaux.
  options:
    a:
      en: |
        S3 Standard has the highest storage price of these classes and is designed for frequently accessed data.
      fr: |
        S3 Standard a le prix de stockage le plus élevé parmi ces classes et est conçu pour des données fréquemment consultées.
    c:
      en: |
        Deep Archive objects must be restored before they can be read, which takes hours, not milliseconds.
      fr: |
        Les objets Deep Archive doivent être restaurés avant de pouvoir être lus, ce qui prend des heures, pas des millisecondes.
    d:
      en: |
        Standard-IA meets the access requirement, but it stores data across at least three zones and costs more than One Zone-IA for data that can be re-created.
      fr: |
        Standard-IA répond à l'exigence d'accès, mais il stocke les données dans au moins trois zones et coûte plus cher que One Zone-IA pour des données recréables.
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
