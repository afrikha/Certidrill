id: saac03-2b-lambda-reserved
objective: "2.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uploads thousands of small files to an Amazon S3 bucket during a nightly batch. An S3 event notification invokes an AWS Lambda function for each new object, and the function writes data to a legacy database that accepts at most 50 concurrent connections. During the batch, the function scales out and the database rejects connections. No event can be lost, other functions in the account must not be affected, and the company does not want to add infrastructure.

    Which solution will meet these requirements?
  fr: |
    Une entreprise charge des milliers de petits fichiers dans un compartiment Amazon S3 pendant un traitement par lots nocturne. Une notification d'événement S3 appelle une fonction AWS Lambda pour chaque nouvel objet, et la fonction écrit des données dans une base de données héritée qui accepte au plus 50 connexions simultanées. Pendant le traitement, la fonction monte en charge et la base de données rejette des connexions. Aucun événement ne doit être perdu, les autres fonctions du compte ne doivent pas être affectées, et l'entreprise ne veut pas ajouter d'infrastructure.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure provisioned concurrency of 50 on the function.", fr: "Configurer une simultanéité provisionnée de 50 sur la fonction." }
    - id: b
      text: { en: "Increase the memory of the function to the maximum so that each invocation finishes faster.", fr: "Augmenter la mémoire de la fonction au maximum afin que chaque appel se termine plus vite." }
    - id: c
      text: { en: "Configure reserved concurrency of 50 on the function.", fr: "Configurer une simultanéité réservée de 50 sur la fonction." }
    - id: d
      text: { en: "Request an increase of the concurrent executions quota of the account.", fr: "Demander une augmentation du quota d'exécutions simultanées du compte." }
answer: { optionId: c }
explanation:
  correct:
    en: Reserved concurrency caps the maximum concurrency of the function at 50 and reserves that capacity, so the function never opens more than 50 connections and other functions keep the rest of the account pool. S3 invokes the function asynchronously, and Lambda returns throttled asynchronous events to its queue and retries them for up to 6 hours by default, so the events are not lost.
    fr: La simultanéité réservée plafonne la simultanéité maximale de la fonction à 50 et réserve cette capacité ; la fonction n'ouvre donc jamais plus de 50 connexions et les autres fonctions conservent le reste du pool du compte. S3 appelle la fonction de façon asynchrone, et Lambda remet les événements asynchrones limités dans sa file d'attente et les retente jusqu'à 6 heures par défaut ; les événements ne sont donc pas perdus.
  options:
    a:
      en: Provisioned concurrency pre-initializes 50 environments but does not cap the function. When they are busy, the function scales into unreserved concurrency and still overloads the database, at an additional charge.
      fr: La simultanéité provisionnée pré-initialise 50 environnements mais ne plafonne pas la fonction. Lorsqu'ils sont occupés, la fonction utilise la simultanéité non réservée et surcharge toujours la base de données, avec un coût supplémentaire.
    b:
      en: Faster invocations may reduce concurrency somewhat, but nothing limits the number of simultaneous connections to 50.
      fr: Des appels plus rapides peuvent réduire un peu la simultanéité, mais rien ne limite à 50 le nombre de connexions simultanées.
    d:
      en: A higher account quota lets the function scale out even more and makes the connection problem worse.
      fr: Un quota de compte plus élevé permet à la fonction de monter encore plus en charge et aggrave le problème de connexions.
references:
  - title: Understanding Lambda Event Function scaling
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
  - title: How Lambda handles errors and retries with asynchronous invocation
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-error-handling.html
