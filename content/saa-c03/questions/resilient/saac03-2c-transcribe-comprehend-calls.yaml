id: saac03-2c-transcribe-comprehend-calls
objective: "2.2.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A call center stores recordings of customer calls as audio files in an Amazon S3 bucket. The company wants a text transcript of each call. Then the company wants to identify the overall sentiment of each conversation and detect personal data, such as phone numbers and addresses, in the transcripts. The solution must use managed AI services only.

    Which combination of services will meet these requirements? (Choose two.)
  fr: |
    Un centre d'appels stocke les enregistrements des appels clients sous forme de fichiers audio dans un compartiment Amazon S3. L'entreprise souhaite obtenir une transcription textuelle de chaque appel. Elle souhaite ensuite identifier le sentiment global de chaque conversation et détecter les données personnelles, comme les numéros de téléphone et les adresses, dans les transcriptions. La solution doit utiliser uniquement des services d'IA gérés.

    Quelle combinaison de services permet de répondre à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Amazon Transcribe to convert the recordings to text."
        fr: "Amazon Transcribe pour convertir les enregistrements en texte."
    - id: b
      text:
        en: "Amazon Polly to convert the recordings to text."
        fr: "Amazon Polly pour convertir les enregistrements en texte."
    - id: c
      text:
        en: "Amazon Lex to detect the sentiment and personal data in the transcripts."
        fr: "Amazon Lex pour détecter le sentiment et les données personnelles dans les transcriptions."
    - id: d
      text:
        en: "Amazon Comprehend to detect the sentiment and personal data in the transcripts."
        fr: "Amazon Comprehend pour détecter le sentiment et les données personnelles dans les transcriptions."
    - id: e
      text:
        en: "Amazon Rekognition to detect the sentiment and personal data in the transcripts."
        fr: "Amazon Rekognition pour détecter le sentiment et les données personnelles dans les transcriptions."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Amazon Transcribe is the automatic speech recognition service that converts audio files stored in S3 to text. Amazon Comprehend then analyzes the transcripts: it returns the dominant sentiment and detects personally identifiable information such as addresses and phone numbers.
    fr: |
      Amazon Transcribe est le service de reconnaissance vocale automatique qui convertit en texte les fichiers audio stockés dans S3. Amazon Comprehend analyse ensuite les transcriptions : il renvoie le sentiment dominant et détecte les informations d'identification personnelle comme les adresses et les numéros de téléphone.
  options:
    b:
      en: |
        Amazon Polly converts text to speech, the opposite of what is needed.
      fr: |
        Amazon Polly convertit du texte en parole, l'inverse de ce qui est nécessaire.
    c:
      en: |
        Amazon Lex builds conversational interfaces (chatbots); it is not a text analytics service for sentiment and personal data detection.
      fr: |
        Amazon Lex sert à créer des interfaces conversationnelles (chatbots) ; ce n'est pas un service d'analyse de texte pour détecter le sentiment et les données personnelles.
    e:
      en: |
        Amazon Rekognition analyzes images and videos, not the text of transcripts.
      fr: |
        Amazon Rekognition analyse des images et des vidéos, pas le texte des transcriptions.
references:
  - title: What is Amazon Transcribe?
    url: https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html
  - title: What is Amazon Comprehend?
    url: https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html
