id: saac03-2c-nat-gateway-private-route
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a VPC with an internet gateway, a public subnet, and a private subnet in one Availability Zone. Amazon EC2 instances in the private subnet have no public IP addresses and must download software updates from the internet over IPv4. Hosts on the internet must not be able to initiate connections to these instances. The company has decided to use one zonal public NAT gateway.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise dispose d'un VPC avec une passerelle Internet, un sous-réseau public et un sous-réseau privé dans une seule zone de disponibilité. Les instances Amazon EC2 du sous-réseau privé n'ont pas d'adresse IP publique et doivent télécharger des mises à jour logicielles depuis Internet en IPv4. Les hôtes d'Internet ne doivent pas pouvoir initier de connexions vers ces instances. L'entreprise a choisi d'utiliser une passerelle NAT publique zonale.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create the NAT gateway in the private subnet and associate an Elastic IP address with it."
        fr: "Créer la passerelle NAT dans le sous-réseau privé et lui associer une adresse IP Elastic."
    - id: b
      text:
        en: "Create the NAT gateway in the public subnet and associate an Elastic IP address with it."
        fr: "Créer la passerelle NAT dans le sous-réseau public et lui associer une adresse IP Elastic."
    - id: c
      text:
        en: "Add a 0.0.0.0/0 route that targets the internet gateway to the private subnet's route table."
        fr: "Ajouter à la table de routage du sous-réseau privé une route 0.0.0.0/0 qui cible la passerelle Internet."
    - id: d
      text:
        en: "Add a 0.0.0.0/0 route that targets the NAT gateway to the private subnet's route table."
        fr: "Ajouter à la table de routage du sous-réseau privé une route 0.0.0.0/0 qui cible la passerelle NAT."
    - id: e
      text:
        en: "Add a 0.0.0.0/0 route that targets the NAT gateway to the public subnet's route table."
        fr: "Ajouter à la table de routage du sous-réseau public une route 0.0.0.0/0 qui cible la passerelle NAT."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A zonal public NAT gateway is created in a public subnet with an Elastic IP address and sends its traffic to the internet gateway. The private subnet's route table then needs a 0.0.0.0/0 route to the NAT gateway, so the instances can initiate outbound connections while unsolicited inbound connections are not possible.
    fr: |
      Une passerelle NAT publique zonale se crée dans un sous-réseau public avec une adresse IP Elastic et envoie son trafic vers la passerelle Internet. La table de routage du sous-réseau privé a ensuite besoin d'une route 0.0.0.0/0 vers la passerelle NAT : les instances peuvent initier des connexions sortantes, tandis que les connexions entrantes non sollicitées sont impossibles.
  options:
    a:
      en: |
        A zonal public NAT gateway must be in a public subnet so that its traffic can reach the internet gateway.
      fr: |
        Une passerelle NAT publique zonale doit se trouver dans un sous-réseau public pour que son trafic atteigne la passerelle Internet.
    c:
      en: |
        A route to the internet gateway would make the subnet public, and instances without public IP addresses still could not reach the internet that way.
      fr: |
        Une route vers la passerelle Internet rendrait le sous-réseau public, et des instances sans adresse IP publique ne pourraient toujours pas atteindre Internet de cette façon.
    e:
      en: |
        The public subnet must keep its default route to the internet gateway; sending it to the NAT gateway breaks the NAT gateway's own path to the internet.
      fr: |
        Le sous-réseau public doit conserver sa route par défaut vers la passerelle Internet ; la diriger vers la passerelle NAT casse le chemin de la passerelle NAT elle-même vers Internet.
references:
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
  - title: Configure route tables
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html
