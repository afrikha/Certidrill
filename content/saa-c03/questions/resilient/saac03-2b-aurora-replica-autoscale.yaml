id: saac03-2b-aurora-replica-autoscale
objective: "2.1.15"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL DB cluster with one writer instance and one Aurora Replica. Read traffic from a mobile app is unpredictable and sometimes grows fivefold for a few hours. The company wants read capacity to grow and shrink automatically with demand, and new readers must start receiving read connections without application configuration changes.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute un cluster de bases de données Amazon Aurora MySQL avec une instance d'écriture et un réplica Aurora. Le trafic en lecture d'une application mobile est imprévisible et est parfois multiplié par cinq pendant quelques heures. L'entreprise veut que la capacité de lecture augmente et diminue automatiquement selon la demande, et les nouveaux lecteurs doivent recevoir des connexions en lecture sans modification de la configuration de l'application.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure the application to send read queries to the cluster endpoint.", fr: "Configurer l'application pour qu'elle envoie les requêtes en lecture au point de terminaison du cluster." }
    - id: b
      text: { en: "Change the writer instance to the largest available instance class.", fr: "Passer l'instance d'écriture à la plus grande classe d'instance disponible." }
    - id: c
      text: { en: "Configure the application to send read queries to the instance endpoint of the existing Aurora Replica.", fr: "Configurer l'application pour qu'elle envoie les requêtes en lecture au point de terminaison d'instance du réplica Aurora existant." }
    - id: d
      text: { en: "Configure the application to send read queries to the reader endpoint of the cluster.", fr: "Configurer l'application pour qu'elle envoie les requêtes en lecture au point de terminaison du lecteur du cluster." }
    - id: e
      text: { en: "Add an Aurora Auto Scaling target tracking policy for Aurora Replicas based on average reader CPU utilization.", fr: "Ajouter une politique Aurora Auto Scaling avec suivi de cible pour les réplicas Aurora, basée sur l'utilisation moyenne du processeur des lecteurs." }
answer: { optionIds: [ d, e ] }
explanation:
  correct:
    en: Aurora Auto Scaling adds and removes Aurora Replicas (up to 15) with a target tracking policy on a metric such as average reader CPU utilization. The reader endpoint balances connections across all Aurora Replicas, so replicas added by Auto Scaling receive read connections without any change to the application.
    fr: Aurora Auto Scaling ajoute et supprime des réplicas Aurora (jusqu'à 15) avec une politique de suivi de cible sur une métrique comme l'utilisation moyenne du processeur des lecteurs. Le point de terminaison du lecteur répartit les connexions entre tous les réplicas Aurora ; les réplicas ajoutés par Auto Scaling reçoivent donc des connexions en lecture sans aucune modification de l'application.
  options:
    a:
      en: The cluster endpoint connects to the writer (primary) instance, so reads would not use the replicas.
      fr: Le point de terminaison du cluster se connecte à l'instance d'écriture (principale) ; les lectures n'utiliseraient donc pas les réplicas.
    b:
      en: A larger writer is a fixed, manual scale-up; it does not grow and shrink with demand.
      fr: Une instance d'écriture plus grande est une montée en puissance fixe et manuelle ; elle n'augmente ni ne diminue selon la demande.
    c:
      en: An instance endpoint targets one specific DB instance; new replicas would not receive traffic unless the application configuration changed.
      fr: Un point de terminaison d'instance cible une instance précise ; les nouveaux réplicas ne recevraient pas de trafic sans modification de la configuration de l'application.
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
  - title: Amazon Aurora endpoint connections
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html
