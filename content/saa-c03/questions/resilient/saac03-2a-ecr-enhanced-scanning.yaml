id: saac03-2a-ecr-enhanced-scanning
objective: "2.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating its Java applications into containers and stores the images in Amazon ECR. The security team requires every image to be scanned automatically when it is pushed and to be rescanned when new vulnerabilities are published. The scans must cover programming language packages, such as Java libraries, in addition to operating system packages.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre ses applications Java vers des conteneurs et stocke les images dans Amazon ECR. L'équipe de sécurité exige que chaque image soit analysée automatiquement lors de son envoi et analysée de nouveau quand de nouvelles vulnérabilités sont publiées. Les analyses doivent couvrir les packages des langages de programmation, comme les bibliothèques Java, en plus des packages du système d'exploitation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Turn on basic scanning with scan on push for all the repositories of the registry.", fr: "Activer l'analyse de base avec analyse lors de l'envoi (scan on push) pour tous les référentiels du registre." }
    - id: b
      text: { en: "Add a weekly step to the build pipeline that starts a manual basic scan of the latest images.", fr: "Ajouter au pipeline de build une étape hebdomadaire qui lance une analyse de base manuelle des dernières images." }
    - id: c
      text: { en: "Turn on enhanced scanning for the registry, with continuous scanning powered by Amazon Inspector.", fr: "Activer l'analyse améliorée pour le registre, avec une analyse continue fournie par Amazon Inspector." }
    - id: d
      text: { en: "Turn on tag immutability for the repositories so that scanned images cannot be overwritten.", fr: "Activer l'immuabilité des balises pour les référentiels afin que les images analysées ne puissent pas être remplacées." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      ECR enhanced scanning uses Amazon Inspector to find vulnerabilities in both operating system and programming language packages. It supports scan on push and continuous scanning, which updates findings when new vulnerabilities appear and sends events to Amazon EventBridge.
    fr: |
      L'analyse améliorée d'ECR utilise Amazon Inspector pour détecter les vulnérabilités des packages du système d'exploitation et des langages de programmation. Elle prend en charge l'analyse lors de l'envoi et l'analyse continue, qui met à jour les résultats quand de nouvelles vulnérabilités apparaissent et envoie des événements à Amazon EventBridge.
  options:
    a: { en: "Basic scanning covers only operating system vulnerabilities and does not rescan images continuously.", fr: "L'analyse de base ne couvre que les vulnérabilités du système d'exploitation et ne réanalyse pas les images en continu." }
    b: { en: "Manual basic scans are neither automatic on push nor triggered by new vulnerabilities, and they miss language packages.", fr: "Des analyses de base manuelles ne sont ni automatiques lors de l'envoi ni déclenchées par de nouvelles vulnérabilités, et elles ignorent les packages des langages." }
    d: { en: "Tag immutability prevents tags from being overwritten; it does not scan images.", fr: "L'immuabilité des balises empêche le remplacement des balises ; elle n'analyse pas les images." }
references:
  - title: Scan images for software vulnerabilities in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-scanning.html
