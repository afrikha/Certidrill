id: saac03-2a-cloudfront-two-origins
objective: "2.1.7"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A retail company serves static assets from an Amazon S3 bucket and dynamic pages from an Application Load Balancer in one AWS Region. Customers are located around the world. The company wants a single domain name for the website, static assets cached at edge locations, dynamic requests carried over the AWS network from edge locations close to the users, and an S3 bucket that can be read only through the website.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de distribution sert des ressources statiques depuis un compartiment Amazon S3 et des pages dynamiques depuis un Application Load Balancer dans une Région AWS. Les clients sont répartis dans le monde entier. L'entreprise veut un nom de domaine unique pour le site, des ressources statiques mises en cache dans des emplacements périphériques, des requêtes dynamiques acheminées sur le réseau AWS depuis des emplacements périphériques proches des utilisateurs, et un compartiment S3 lisible uniquement via le site web.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a CloudFront distribution with the bucket and the ALB as origins, and a /static/* cache behavior for the S3 origin.", fr: "Créer une distribution CloudFront avec le compartiment et l'ALB comme origines, et un comportement de cache /static/* pour l'origine S3." } }
    - { id: b, text: { en: "Enable S3 Transfer Acceleration on the bucket, and link the static assets to the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment, et lier les ressources statiques au point de terminaison accéléré." } }
    - { id: c, text: { en: "Create an AWS Global Accelerator accelerator with the ALB and the S3 bucket as its endpoints.", fr: "Créer un accélérateur AWS Global Accelerator avec l'ALB et le compartiment S3 comme points de terminaison." } }
    - { id: d, text: { en: "Configure an origin access control for the S3 origin, and a bucket policy that allows the CloudFront service principal only for that distribution.", fr: "Configurer un contrôle d'accès d'origine pour l'origine S3, et une politique de compartiment qui n'autorise le principal de service CloudFront que pour cette distribution." } }
    - { id: e, text: { en: "Enable S3 static website hosting, and add the website endpoint to the distribution as a custom origin with public read access.", fr: "Activer l'hébergement de site web statique S3, et ajouter le point de terminaison de site web à la distribution comme origine personnalisée avec accès public en lecture." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      One CloudFront distribution can have several origins and route requests by path pattern, so static assets are cached at the edge while dynamic requests go to the ALB through the edge network, all under one domain name. Origin access control with a bucket policy limited to that distribution lets only CloudFront read the bucket.
    fr: |
      Une distribution CloudFront peut avoir plusieurs origines et router les requêtes selon un modèle de chemin : les ressources statiques sont mises en cache en périphérie tandis que les requêtes dynamiques vont à l'ALB via le réseau périphérique, le tout sous un seul nom de domaine. Le contrôle d'accès d'origine avec une politique de compartiment limitée à cette distribution ne laisse que CloudFront lire le compartiment.
  options:
    b: { en: "Transfer Acceleration speeds up long-distance transfers to and from the bucket but does not cache content, and it adds a second domain name.", fr: "Transfer Acceleration accélère les transferts longue distance vers et depuis le compartiment, mais ne met pas le contenu en cache, et ajoute un second nom de domaine." }
    c: { en: "S3 buckets are not Global Accelerator endpoints, and Global Accelerator does not cache static content.", fr: "Les compartiments S3 ne sont pas des points de terminaison Global Accelerator, et Global Accelerator ne met pas le contenu statique en cache." }
    e: { en: "A website endpoint must be a custom origin that cannot use origin access control, so the bucket would have to be public.", fr: "Un point de terminaison de site web doit être une origine personnalisée qui ne peut pas utiliser le contrôle d'accès d'origine : le compartiment devrait être public." }
references:
  - title: Restrict access to an Amazon S3 origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
