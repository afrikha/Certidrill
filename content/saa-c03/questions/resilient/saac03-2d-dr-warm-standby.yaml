id: saac03-2d-dr-warm-standby
objective: "2.2.18"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software as a service (SaaS) company runs its platform on Amazon EC2 instances behind an Application Load Balancer, with an Amazon Aurora PostgreSQL-Compatible Edition database, in one AWS Region. The disaster recovery (DR) requirements are an RPO of less than 1 minute and an RTO of 10 minutes.

    The DR Region must be able to accept customer traffic immediately after a failover, at reduced capacity while it scales up. The budget does not allow a second full-size production environment.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciel en tant que service (SaaS) exécute sa plateforme sur des instances Amazon EC2 derrière un Application Load Balancer, avec une base de données Amazon Aurora PostgreSQL-Compatible Edition, dans une seule Région AWS. Les exigences de reprise après sinistre (DR) sont un RPO inférieur à 1 minute et un RTO de 10 minutes.

    La Région de DR doit pouvoir accepter le trafic client immédiatement après un basculement, à capacité réduite pendant qu'elle monte en charge. Le budget ne permet pas un second environnement de production à pleine taille.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add an Aurora global database secondary cluster and an Auto Scaling group with a desired capacity of zero in the DR Region, and scale out the group after a failover.", fr: "Ajouter un cluster secondaire de base de données globale Aurora et un groupe Auto Scaling d'une capacité souhaitée nulle dans la Région de DR, et augmenter la capacité du groupe après un basculement." } }
    - { id: b, text: { en: "Add an Aurora global database secondary cluster and a scaled-down, fully functional application tier behind an Application Load Balancer in the DR Region, with Route 53 failover routing.", fr: "Ajouter un cluster secondaire de base de données globale Aurora et un niveau applicatif réduit et entièrement fonctionnel derrière un Application Load Balancer dans la Région de DR, avec le routage de basculement Route 53." } }
    - { id: c, text: { en: "Copy Aurora snapshots and AMIs to the DR Region every hour with AWS Backup, and deploy the full environment from AWS CloudFormation templates after a disaster.", fr: "Copier toutes les heures des instantanés Aurora et des AMI vers la Région de DR avec AWS Backup, et déployer l'environnement complet à partir de modèles AWS CloudFormation après un sinistre." } }
    - { id: d, text: { en: "Run a second full-capacity copy of the platform with an Aurora global database secondary cluster in the DR Region, and route customers to both Regions with latency-based routing.", fr: "Exécuter une seconde copie de la plateforme à pleine capacité avec un cluster secondaire de base de données globale Aurora dans la Région de DR, et répartir les clients entre les deux Régions avec le routage basé sur la latence." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      This is warm standby. The Aurora global database secondary cluster keeps the data within seconds of the primary, and the scaled-down application tier is already deployed and running, so it can serve traffic at reduced capacity as soon as Route 53 fails over. The tier then scales up to full capacity, which keeps the cost below a second full-size environment.
    fr: |
      Il s'agit du secours semi-automatique (warm standby). Le cluster secondaire de la base de données globale Aurora garde les données à quelques secondes du cluster principal, et le niveau applicatif réduit est déjà déployé et en fonctionnement : il peut servir le trafic à capacité réduite dès que Route 53 bascule. Le niveau monte ensuite à pleine capacité, ce qui maintient le coût en dessous d'un second environnement à pleine taille.
  options:
    a: { en: "This pilot light design cannot process requests until instances are launched and become healthy, so the DR Region cannot accept traffic immediately.", fr: "Cette conception en environnement de veille ne peut traiter aucune requête tant que des instances ne sont pas lancées et saines : la Région de DR ne peut pas accepter le trafic immédiatement." }
    c: { en: "Hourly copies give an RPO of up to 1 hour, and deploying and restoring an environment takes much longer than 10 minutes.", fr: "Des copies horaires donnent un RPO pouvant atteindre 1 heure, et déployer puis restaurer un environnement prend bien plus de 10 minutes." }
    d: { en: "A second full-capacity environment is multi-site active/active, which the budget does not allow.", fr: "Un second environnement à pleine capacité correspond à l'actif/actif multisite, que le budget ne permet pas." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: Using Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html
