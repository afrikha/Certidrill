id: saac03-2b-cross-region-rr
objective: "2.1.15"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance in the us-east-1 Region. The company is opening an office in Europe and wants users there to run read-only queries with low latency. The company also wants a copy of the database in the eu-west-1 Region that can become a writable database if us-east-1 is unavailable. The company does not want to change its database engine.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL dans la Région us-east-1. Elle ouvre un bureau en Europe et veut que les utilisateurs de ce bureau exécutent des requêtes en lecture seule avec une faible latence. Elle veut aussi une copie de la base de données dans la Région eu-west-1 qui puisse devenir une base de données accessible en écriture si us-east-1 est indisponible. L'entreprise ne veut pas changer de moteur de base de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a cross-Region read replica of the DB instance in eu-west-1, and promote it if us-east-1 becomes unavailable.", fr: "Créer un réplica en lecture entre Régions de l'instance dans eu-west-1, et le promouvoir si us-east-1 devient indisponible." }
    - id: b
      text: { en: "Migrate the database to Amazon Aurora MySQL, and add eu-west-1 as a secondary Region of an Aurora global database.", fr: "Migrer la base de données vers Amazon Aurora MySQL, et ajouter eu-west-1 comme Région secondaire d'une base de données globale Aurora." }
    - id: c
      text: { en: "Convert the DB instance to a Multi-AZ deployment, and place the standby instance in eu-west-1.", fr: "Convertir l'instance en déploiement Multi-AZ, et placer l'instance de secours dans eu-west-1." }
    - id: d
      text: { en: "Copy the automated snapshots to eu-west-1 every day, and restore the latest snapshot when European users need data.", fr: "Copier chaque jour les instantanés automatisés dans eu-west-1, et restaurer le dernier instantané lorsque les utilisateurs européens ont besoin des données." }
answer: { optionId: a }
explanation:
  correct:
    en: RDS read replicas can be created in a different AWS Region. The replica in eu-west-1 serves local read-only queries with low latency, and it can be promoted to a standalone, writable DB instance for disaster recovery. The engine stays RDS for MySQL.
    fr: Les réplicas en lecture RDS peuvent être créés dans une autre Région AWS. Le réplica dans eu-west-1 sert les requêtes locales en lecture seule avec une faible latence, et il peut être promu en instance autonome accessible en écriture pour la reprise après sinistre. Le moteur reste RDS for MySQL.
  options:
    b:
      en: An Aurora global database meets the read and recovery needs, but it requires migrating to Aurora, which the company does not want.
      fr: Une base de données globale Aurora répond aux besoins de lecture et de reprise, mais elle impose une migration vers Aurora, ce que l'entreprise ne veut pas.
    c:
      en: A Multi-AZ standby is placed in another Availability Zone of the same Region and cannot serve reads.
      fr: Une instance de secours Multi-AZ est placée dans une autre zone de disponibilité de la même Région et ne peut pas servir de lectures.
    d:
      en: Daily snapshots give stale data and no continuously available database for European queries.
      fr: Des instantanés quotidiens fournissent des données obsolètes et aucune base de données disponible en continu pour les requêtes européennes.
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
