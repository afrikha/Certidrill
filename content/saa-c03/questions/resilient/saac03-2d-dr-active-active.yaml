id: saac03-2d-dr-active-active
objective: "2.2.18"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A global payments company runs a transaction API on AWS Lambda and Amazon DynamoDB in us-east-1. The company is expanding to Europe. Customers on each continent must be served from the nearest Region, and both Regions must accept writes at all times.

    If one Region fails, customers must continue to work with near-zero RTO and RPO, without any failover or scale-up action.

    Which solution will meet these requirements?
  fr: |
    Une entreprise mondiale de paiements exécute une API de transactions sur AWS Lambda et Amazon DynamoDB dans us-east-1. L'entreprise se développe en Europe. Les clients de chaque continent doivent être servis depuis la Région la plus proche, et les deux Régions doivent accepter des écritures en permanence.

    Si une Région tombe en panne, les clients doivent continuer à travailler avec un RTO et un RPO proches de zéro, sans aucune action de basculement ni de montée en charge.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a DynamoDB global table with a replica in eu-west-1, deploy a scaled-down copy of the API in eu-west-1, and use Route 53 failover routing to send traffic there when us-east-1 fails.", fr: "Créer une table globale DynamoDB avec un réplica dans eu-west-1, déployer une copie réduite de l'API dans eu-west-1, et utiliser le routage de basculement Route 53 pour y envoyer le trafic en cas de panne de us-east-1." } }
    - { id: b, text: { en: "Turn on DynamoDB point-in-time recovery, export the table to an S3 bucket in eu-west-1 every hour, and redeploy the API there with AWS CloudFormation after a failure.", fr: "Activer la restauration à un instant dans le passé de DynamoDB, exporter la table toutes les heures vers un compartiment S3 de eu-west-1, et y redéployer l'API avec AWS CloudFormation après une panne." } }
    - { id: c, text: { en: "Create a DynamoDB global table with a replica in eu-west-1, deploy the full API in both Regions, and use Route 53 latency-based routing with health checks.", fr: "Créer une table globale DynamoDB avec un réplica dans eu-west-1, déployer l'API complète dans les deux Régions, et utiliser le routage basé sur la latence de Route 53 avec des vérifications de l'état." } }
    - { id: d, text: { en: "Keep the API in us-east-1, switch the table to on-demand capacity mode, and rely on the Multi-AZ replication of DynamoDB.", fr: "Conserver l'API dans us-east-1, passer la table en mode de capacité à la demande, et s'appuyer sur la réplication Multi-AZ de DynamoDB." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      This is multi-site active/active. DynamoDB global tables replicate the table between Regions and accept writes in every replica Region. With the full API in both Regions and latency-based routing with health checks, each customer is served by the nearest healthy Region, and if a Region fails its traffic simply goes to the other Region, with no failover or scale-up step, for near-zero RTO.
    fr: |
      Il s'agit de l'actif/actif multisite. Les tables globales DynamoDB répliquent la table entre les Régions et acceptent des écritures dans chaque Région réplica. Avec l'API complète dans les deux Régions et le routage basé sur la latence avec des vérifications de l'état, chaque client est servi par la Région saine la plus proche, et si une Région tombe en panne, son trafic part simplement vers l'autre Région, sans étape de basculement ni de montée en charge, pour un RTO proche de zéro.
  options:
    a: { en: "This warm standby sends no traffic to Europe in normal operation and requires a failover and a scale-up when us-east-1 fails, which the requirements forbid.", fr: "Ce secours semi-automatique n'envoie aucun trafic vers l'Europe en fonctionnement normal et exige un basculement et une montée en charge en cas de panne de us-east-1, ce que les exigences interdisent." }
    b: { en: "Hourly exports and a redeployment give an RPO of up to 1 hour and an RTO of hours, and Europe is not served from a local Region.", fr: "Des exportations horaires et un redéploiement donnent un RPO pouvant atteindre 1 heure et un RTO de plusieurs heures, et l'Europe n'est pas servie depuis une Région locale." }
    d: { en: "DynamoDB replicates data across Availability Zones within one Region only, so a Regional failure would stop the API.", fr: "DynamoDB ne réplique les données qu'entre les zones de disponibilité d'une seule Région : une panne régionale arrêterait l'API." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
  - title: Global tables - multi-active, multi-Region replication
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
