id: saac03-2b-eks-migrate-k8s
objective: "2.1.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs dozens of microservices on a self-managed Kubernetes cluster in its data center. The teams deploy with Kubernetes manifests and Helm charts. The company wants to move the workloads to AWS, stop managing the Kubernetes control plane, and keep its existing Kubernetes tooling and manifests with minimal changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des dizaines de microservices sur un cluster Kubernetes autogéré dans son centre de données. Les équipes déploient avec des manifestes Kubernetes et des charts Helm. L'entreprise veut déplacer les charges de travail vers AWS, ne plus gérer le plan de contrôle Kubernetes et conserver ses outils et manifestes Kubernetes existants avec un minimum de modifications.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Rewrite the microservices as AWS Lambda functions behind Amazon API Gateway.", fr: "Réécrire les microservices sous forme de fonctions AWS Lambda derrière Amazon API Gateway." }
    - id: b
      text: { en: "Convert the manifests to Amazon ECS task definitions, and run the services on AWS Fargate.", fr: "Convertir les manifestes en définitions de tâches Amazon ECS, et exécuter les services sur AWS Fargate." }
    - id: c
      text: { en: "Run the microservices on an Amazon EKS cluster, and deploy them with the existing manifests and Helm charts.", fr: "Exécuter les microservices sur un cluster Amazon EKS, et les déployer avec les manifestes et charts Helm existants." }
    - id: d
      text: { en: "Install Kubernetes on Amazon EC2 instances in an Auto Scaling group, and deploy the existing manifests.", fr: "Installer Kubernetes sur des instances Amazon EC2 d'un groupe Auto Scaling, et déployer les manifestes existants." }
answer: { optionId: c }
explanation:
  correct:
    en: Amazon EKS runs a Kubernetes control plane that AWS manages, and it is certified Kubernetes-conformant. Kubernetes-compatible applications and community tooling therefore work without refactoring, so the existing manifests and Helm charts can be reused.
    fr: Amazon EKS exécute un plan de contrôle Kubernetes géré par AWS et est certifié conforme à Kubernetes. Les applications compatibles Kubernetes et les outils de la communauté fonctionnent donc sans refactorisation, et les manifestes et charts Helm existants peuvent être réutilisés.
  options:
    a:
      en: Rewriting every microservice as functions is a major change, not a migration with minimal changes.
      fr: Réécrire chaque microservice sous forme de fonctions est un changement majeur, pas une migration avec un minimum de modifications.
    b:
      en: Amazon ECS has its own task definition format and APIs; Kubernetes manifests and Helm charts would have to be converted and the tooling replaced.
      fr: Amazon ECS a son propre format de définition de tâche et ses propres API ; les manifestes Kubernetes et charts Helm devraient être convertis et les outils remplacés.
    d:
      en: A Kubernetes cluster installed on EC2 is still self-managed, so the company would keep operating the control plane.
      fr: Un cluster Kubernetes installé sur EC2 reste autogéré ; l'entreprise continuerait donc d'exploiter le plan de contrôle.
references:
  - title: What is Amazon EKS?
    url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
