id: saac03-2d-synthetics-canary
objective: "2.2.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company runs its booking website on Amazon EC2 instances behind an Application Load Balancer. Almost all traffic arrives during business hours. Twice last month, the sign-in and flight search workflow broke during the night, and the company learned about it only when customers complained the next morning.

    The company wants to detect a broken sign-in or search workflow within minutes, at any hour, even when no customers are using the website. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages exécute son site de réservation sur des instances Amazon EC2 derrière un Application Load Balancer. Presque tout le trafic arrive pendant les heures ouvrées. Deux fois le mois dernier, le parcours de connexion et de recherche de vols est tombé en panne pendant la nuit, et l'entreprise ne l'a appris que lorsque des clients se sont plaints le lendemain matin.

    L'entreprise veut détecter en quelques minutes, à toute heure, un parcours de connexion ou de recherche défaillant, même lorsqu'aucun client n'utilise le site. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create Amazon CloudWatch Synthetics canaries that run the sign-in and search steps every 5 minutes, and a CloudWatch alarm on canary failures.", fr: "Créer des canaris Amazon CloudWatch Synthetics qui exécutent les étapes de connexion et de recherche toutes les 5 minutes, et une alarme CloudWatch sur les échecs des canaris." } }
    - { id: b, text: { en: "Create an Amazon Route 53 health check on the website home page URL and a CloudWatch alarm on the health check status.", fr: "Créer une vérification de l'état Amazon Route 53 sur l'URL de la page d'accueil du site et une alarme CloudWatch sur le statut de cette vérification." } }
    - { id: c, text: { en: "Enable AWS X-Ray tracing in the application and create a CloudWatch alarm on the fault rate shown in the X-Ray traces.", fr: "Activer le suivi AWS X-Ray dans l'application et créer une alarme CloudWatch sur le taux d'erreurs visible dans les traces X-Ray." } }
    - { id: d, text: { en: "Store the load balancer access logs in Amazon S3 and run a scheduled Amazon Athena query every night to find HTTP 5xx responses.", fr: "Stocker les journaux d'accès de l'équilibreur de charge dans Amazon S3 et exécuter chaque nuit une requête Amazon Athena planifiée pour trouver les réponses HTTP 5xx." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      CloudWatch Synthetics canaries are scripts that run on a schedule (as often as once per minute) and follow the same steps as a customer, so they test the workflow even when there is no customer traffic. Canary results are published as CloudWatch metrics, so an alarm can notify the team within minutes. The service is managed; the company only maintains the canary script.
    fr: |
      Les canaris CloudWatch Synthetics sont des scripts exécutés selon une planification (jusqu'à une fois par minute) qui suivent les mêmes étapes qu'un client ; ils testent donc le parcours même sans trafic client. Les résultats des canaris sont publiés sous forme de métriques CloudWatch, si bien qu'une alarme peut prévenir l'équipe en quelques minutes. Le service est géré ; l'entreprise ne maintient que le script du canari.
  options:
    b: { en: "A health check requests one URL. The home page can respond normally while the sign-in or search steps are broken.", fr: "Une vérification de l'état interroge une seule URL. La page d'accueil peut répondre normalement alors que les étapes de connexion ou de recherche sont en panne." }
    c: { en: "X-Ray only traces real requests. With no customers at night there are no traces, so a broken workflow stays invisible until traffic returns.", fr: "X-Ray ne trace que les requêtes réelles. Sans clients la nuit, il n'y a aucune trace, et un parcours défaillant reste invisible jusqu'au retour du trafic." }
    d: { en: "Access logs only contain real requests, and a nightly query cannot detect a failure within minutes.", fr: "Les journaux d'accès ne contiennent que des requêtes réelles, et une requête nocturne ne peut pas détecter une panne en quelques minutes." }
references:
  - title: Synthetic monitoring (canaries)
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch_Synthetics_Canaries.html
