id: saac03-2c-backup-restore-cross-region
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an internal reporting application on Amazon EC2 instances with Amazon EBS volumes and an Amazon RDS for MySQL DB instance. The application is not business critical. If the primary Region becomes unavailable, the application must be recovered in another Region with an RPO of 24 hours and an RTO of 24 hours. The infrastructure is already defined in AWS CloudFormation templates.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exécute une application interne de rapports sur des instances Amazon EC2 avec des volumes Amazon EBS et une instance de base de données Amazon RDS for MySQL. L'application n'est pas critique pour l'activité. Si la Région principale devient indisponible, l'application doit être récupérée dans une autre Région avec un RPO de 24 heures et un RTO de 24 heures. L'infrastructure est déjà définie dans des modèles AWS CloudFormation.

    Quelle solution permet de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Backup daily backup plan with a copy rule to a backup vault in the recovery Region, and restore and redeploy with CloudFormation after a disaster."
        fr: "Créer un plan AWS Backup quotidien avec une règle de copie vers un coffre-fort de sauvegarde (backup vault) dans la Région de reprise, puis restaurer et redéployer avec CloudFormation après un sinistre."
    - id: b
      text:
        en: "Create a cross-Region read replica of the database and keep stopped copies of the EC2 instances in the recovery Region."
        fr: "Créer un réplica en lecture entre Régions de la base de données et conserver des copies arrêtées des instances EC2 dans la Région de reprise."
    - id: c
      text:
        en: "Run a scaled-down copy of the application in an Auto Scaling group in the recovery Region and replicate the database continuously."
        fr: "Exécuter une copie réduite de l'application dans un groupe Auto Scaling dans la Région de reprise et répliquer la base de données en continu."
    - id: d
      text:
        en: "Convert the DB instance to Multi-AZ and run the EC2 instances in an Auto Scaling group across two Availability Zones."
        fr: "Convertir l'instance de base de données en Multi-AZ et exécuter les instances EC2 dans un groupe Auto Scaling sur deux zones de disponibilité."
answer: { optionId: a }
explanation:
  correct:
    en: |
      With RPO and RTO measured in hours, backup and restore is the cheapest strategy: nothing runs in the recovery Region, only backups are stored there. An AWS Backup plan rule can copy each scheduled backup to a vault in another Region, and the stack is redeployed from the CloudFormation templates when needed.
    fr: |
      Avec un RPO et un RTO de l'ordre de plusieurs heures, la sauvegarde et restauration est la stratégie la moins chère : rien ne s'exécute dans la Région de reprise, seules les sauvegardes y sont stockées. Une règle de plan AWS Backup peut copier chaque sauvegarde planifiée vers un coffre-fort d'une autre Région, et la pile est redéployée à partir des modèles CloudFormation si nécessaire.
  options:
    b:
      en: |
        This is a pilot light design: the always-on replica costs more than backups and is not needed for a 24-hour RPO.
      fr: |
        Il s'agit d'un environnement de veille (pilot light) : le réplica toujours actif coûte plus cher que des sauvegardes et n'est pas nécessaire pour un RPO de 24 heures.
    c:
      en: |
        Warm standby keeps servers and replication running all the time, which costs far more than a 24-hour RTO justifies.
      fr: |
        Le secours semi-automatique (warm standby) maintient en permanence des serveurs et une réplication, ce qui coûte bien plus que ne le justifie un RTO de 24 heures.
    d:
      en: |
        Multi-AZ protects against the failure of an Availability Zone, not the loss of the whole Region.
      fr: |
        Multi-AZ protège contre la défaillance d'une zone de disponibilité, pas contre la perte de toute la Région.
references:
  - title: Creating backup copies across AWS Regions
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
