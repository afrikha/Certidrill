id: saac03-2c-rds-proxy-lambda-connections
objective: "2.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's serverless API uses AWS Lambda functions that connect to an Amazon RDS for MySQL DB instance. During traffic spikes, thousands of concurrent invocations open new database connections, and the DB instance reaches its maximum number of connections and rejects requests. The API must keep serving every request during spikes, and the company does not want to scale up the DB instance.

    Which solution will meet these requirements?
  fr: |
    L'API sans serveur d'une entreprise utilise des fonctions AWS Lambda qui se connectent à une instance de base de données Amazon RDS for MySQL. Lors des pics de trafic, des milliers d'appels simultanés ouvrent de nouvelles connexions à la base, et l'instance atteint son nombre maximal de connexions et rejette des requêtes. L'API doit continuer à servir toutes les requêtes pendant les pics, et l'entreprise ne souhaite pas augmenter la taille de l'instance de base de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add an RDS read replica and point all the Lambda functions to the replica endpoint."
        fr: "Ajouter un réplica en lecture RDS et diriger toutes les fonctions Lambda vers le point de terminaison du réplica."
    - id: b
      text:
        en: "Set the reserved concurrency of the Lambda functions to 10 to limit the number of connections."
        fr: "Définir la concurrence réservée des fonctions Lambda à 10 pour limiter le nombre de connexions."
    - id: c
      text:
        en: "Raise the max_connections parameter in a custom DB parameter group to the highest allowed value."
        fr: "Porter le paramètre max_connections à la valeur maximale autorisée dans un groupe de paramètres de base de données personnalisé."
    - id: d
      text:
        en: "Create an RDS Proxy for the DB instance and change the Lambda connection settings to use the proxy endpoint."
        fr: "Créer un RDS Proxy pour l'instance de base de données et modifier les paramètres de connexion Lambda pour utiliser le point de terminaison du proxy."
answer: { optionId: d }
explanation:
  correct:
    en: |
      RDS Proxy maintains a pool of database connections and shares them among many client connections, so functions can reach high concurrency without exhausting the database connections. AWS recommends it for functions that open and close many short-lived connections; requests that cannot be served at once are queued instead of failing.
    fr: |
      RDS Proxy maintient un pool de connexions à la base de données et les partage entre de nombreuses connexions clientes : les fonctions peuvent atteindre une forte concurrence sans épuiser les connexions de la base. AWS le recommande pour les fonctions qui ouvrent et ferment de nombreuses connexions de courte durée ; les requêtes qui ne peuvent pas être servies immédiatement sont mises en file d'attente au lieu d'échouer.
  options:
    a:
      en: |
        A read replica is read-only, so the API's writes would fail, and the replica has the same connection limit problem.
      fr: |
        Un réplica en lecture est en lecture seule : les écritures de l'API échoueraient, et le réplica a le même problème de limite de connexions.
    b:
      en: |
        Limiting concurrency to 10 throttles the API during spikes, which violates the requirement to serve every request.
      fr: |
        Limiter la concurrence à 10 provoque la limitation de l'API pendant les pics, ce qui viole l'exigence de servir toutes les requêtes.
    c:
      en: |
        More connections consume more memory and CPU on the same instance; without pooling, thousands of concurrent invocations can still exhaust it.
      fr: |
        Davantage de connexions consomment davantage de mémoire et de processeur sur la même instance ; sans pool de connexions, des milliers d'appels simultanés peuvent toujours l'épuiser.
references:
  - title: Using AWS Lambda with Amazon RDS
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-database.html
  - title: Amazon RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
