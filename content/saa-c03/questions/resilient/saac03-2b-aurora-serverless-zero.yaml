id: saac03-2b-aurora-serverless-zero
objective: "2.1.21"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has dozens of development and test environments, each with its own MySQL-compatible database. The databases are used only a few hours per day at unpredictable times and are idle at night and on weekends. Developers accept a delay of about 15 seconds on the first connection after an idle period. The company wants to minimize database compute costs without writing or maintaining start and stop scripts.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de dizaines d'environnements de développement et de test, chacun avec sa propre base de données compatible MySQL. Les bases de données ne sont utilisées que quelques heures par jour à des moments imprévisibles et sont inactives la nuit et le week-end. Les développeurs acceptent un délai d'environ 15 secondes à la première connexion après une période d'inactivité. L'entreprise veut réduire au minimum les coûts de calcul des bases de données sans écrire ni maintenir de scripts de démarrage et d'arrêt.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use Amazon RDS for MySQL DB instances of the smallest instance class in Multi-AZ deployments.", fr: "Utiliser des instances Amazon RDS for MySQL de la plus petite classe d'instance en déploiement Multi-AZ." }
    - id: b
      text: { en: "Use Amazon RDS for MySQL DB instances, and buy Reserved DB Instances for all environments.", fr: "Utiliser des instances Amazon RDS for MySQL, et acheter des instances de base de données réservées pour tous les environnements." }
    - id: c
      text: { en: "Use Aurora provisioned clusters, and stop them every night with a scheduled AWS Lambda function.", fr: "Utiliser des clusters Aurora provisionnés, et les arrêter chaque nuit avec une fonction AWS Lambda planifiée." }
    - id: d
      text: { en: "Use Aurora Serverless v2 clusters with a minimum capacity of 0 ACUs so that idle instances pause automatically.", fr: "Utiliser des clusters Aurora Serverless v2 avec une capacité minimale de 0 ACU pour que les instances inactives se mettent automatiquement en pause." }
answer: { optionId: d }
explanation:
  correct:
    en: With a minimum capacity of 0 ACUs, Aurora Serverless v2 instances pause automatically after a period without connections, and no instance capacity is charged while they are paused (storage is still billed). A new connection resumes the instance, typically in about 15 seconds, which the developers accept, and auto-pause is recommended for development and test clusters.
    fr: Avec une capacité minimale de 0 ACU, les instances Aurora Serverless v2 se mettent automatiquement en pause après une période sans connexion, et aucune capacité d'instance n'est facturée pendant la pause (le stockage reste facturé). Une nouvelle connexion réactive l'instance, généralement en 15 secondes environ, ce que les développeurs acceptent, et la pause automatique est recommandée pour les clusters de développement et de test.
  options:
    a:
      en: Small Multi-AZ instances still run and are billed around the clock, and Multi-AZ doubles the instances for environments that do not need high availability.
      fr: De petites instances Multi-AZ tournent et sont facturées en permanence, et Multi-AZ double les instances pour des environnements qui n'ont pas besoin de haute disponibilité.
    b:
      en: Reserved DB Instances lower the hourly rate but commit to paying for every hour, including idle nights and weekends.
      fr: Les instances de base de données réservées réduisent le tarif horaire mais engagent à payer chaque heure, y compris les nuits et week-ends d'inactivité.
    c:
      en: Scheduled stop functions are scripts to write and maintain, and a fixed schedule does not match unpredictable usage.
      fr: Des fonctions d'arrêt planifiées sont des scripts à écrire et à maintenir, et un horaire fixe ne correspond pas à une utilisation imprévisible.
references:
  - title: Scaling to Zero ACUs with automatic pause and resume for Aurora serverless
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2-auto-pause.html
