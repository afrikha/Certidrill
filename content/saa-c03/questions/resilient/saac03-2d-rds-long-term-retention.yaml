id: saac03-2d-rds-long-term-retention
objective: "2.2.17"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL DB instance with automated backups retained for 14 days. A new regulation requires a monthly backup of the database to be kept for 7 years. The company must also keep the ability to restore the database to any point in time within the last 14 days.

    The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for PostgreSQL dont les sauvegardes automatiques sont conservées 14 jours. Une nouvelle réglementation exige qu'une sauvegarde mensuelle de la base soit conservée 7 ans. L'entreprise doit aussi garder la possibilité de restaurer la base à n'importe quel instant des 14 derniers jours.

    La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the 14-day automated backups, and create an AWS Backup plan with a monthly rule and a 7-year retention period that is assigned to the DB instance.", fr: "Conserver les sauvegardes automatiques de 14 jours, et créer un plan AWS Backup avec une règle mensuelle et une période de conservation de 7 ans, affecté à l'instance de base de données." } }
    - { id: b, text: { en: "Change the backup retention period of the automated backups to 2,555 days.", fr: "Porter à 2 555 jours la période de conservation des sauvegardes automatiques." } }
    - { id: c, text: { en: "Create an Amazon EventBridge schedule that invokes an AWS Lambda function each month to create a manual snapshot, and a second function that deletes snapshots older than 7 years.", fr: "Créer une planification Amazon EventBridge qui appelle chaque mois une fonction AWS Lambda pour créer un instantané manuel, et une seconde fonction qui supprime les instantanés de plus de 7 ans." } }
    - { id: d, text: { en: "Create a cross-Region read replica of the DB instance and keep it for 7 years.", fr: "Créer un réplica en lecture entre Régions de l'instance de base de données et le conserver 7 ans." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The automated backups keep providing point-in-time restore for the last 14 days. An AWS Backup plan adds snapshot backups on a monthly schedule and deletes each one automatically when its 7-year retention ends, with no code to maintain.
    fr: |
      Les sauvegardes automatiques continuent de permettre la restauration à un instant donné sur les 14 derniers jours. Un plan AWS Backup ajoute des sauvegardes par instantané selon une planification mensuelle et supprime automatiquement chacune d'elles à la fin de sa conservation de 7 ans, sans code à maintenir.
  options:
    b: { en: "The automated backup retention period of a DB instance can be set from 0 to 35 days only.", fr: "La période de conservation des sauvegardes automatiques d'une instance de base de données ne peut être définie que de 0 à 35 jours." }
    c: { en: "This works, but two custom functions must be written and maintained, which is more overhead than a managed backup plan.", fr: "Cela fonctionne, mais deux fonctions personnalisées doivent être écrites et maintenues, ce qui représente plus de charge qu'un plan de sauvegarde géré." }
    d: { en: "A read replica holds only the current data; it is not a backup and cannot restore the database to an earlier month.", fr: "Un réplica en lecture ne contient que les données actuelles ; ce n'est pas une sauvegarde et il ne permet pas de restaurer la base à un mois antérieur." }
references:
  - title: Backup retention period
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.BackupRetention.html
  - title: Create a backup plan
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/creating-a-backup-plan.html
