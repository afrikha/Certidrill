id: saac03-2a-beanstalk-worker-tier
objective: "2.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application in an AWS Elastic Beanstalk web server environment. Generating a PDF report takes up to 2 minutes and slows down the web requests. The company wants to move report generation to a separate tier that scales independently of the web tier, with the LEAST operational overhead. The report code can be invoked through an HTTP POST request.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web dans un environnement de serveur web AWS Elastic Beanstalk. La génération d'un rapport PDF dure jusqu'à 2 minutes et ralentit les requêtes web. L'entreprise veut déplacer la génération des rapports vers un niveau distinct qui se met à l'échelle indépendamment du niveau web, avec le MOINS de charge opérationnelle. Le code des rapports peut être appelé par une requête HTTP POST.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the web server environment to a larger instance type so that report generation has more resources.", fr: "Passer l'environnement de serveur web à un type d'instance plus grand afin que la génération des rapports dispose de plus de ressources." }
    - id: b
      text: { en: "Run report generation as a cron job on the instances of the web server environment during off-peak hours.", fr: "Exécuter la génération des rapports comme tâche cron sur les instances de l'environnement de serveur web aux heures creuses." }
    - id: c
      text: { en: "Launch EC2 instances that run a custom daemon which polls an Amazon SQS queue and generates the reports.", fr: "Lancer des instances EC2 qui exécutent un démon personnalisé chargé d'interroger une file d'attente Amazon SQS et de générer les rapports." }
    - id: d
      text: { en: "Create an Elastic Beanstalk worker environment, and have the web tier send report requests to the queue of the worker environment.", fr: "Créer un environnement de travail (worker) Elastic Beanstalk, et faire envoyer les demandes de rapport par le niveau web dans la file d'attente de l'environnement de travail." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An Elastic Beanstalk worker environment offloads long-running tasks from the web server tier. Elastic Beanstalk manages an SQS queue and a daemon that posts each message to the application over HTTP on localhost, deletes the message after a 200 OK response, and scales the worker instances with Auto Scaling.
    fr: |
      Un environnement de travail Elastic Beanstalk décharge le niveau serveur web des tâches longues. Elastic Beanstalk gère une file d'attente SQS et un démon qui envoie chaque message à l'application en HTTP sur localhost, supprime le message après une réponse 200 OK, et met à l'échelle les instances de travail avec Auto Scaling.
  options:
    a: { en: "Larger web instances keep report generation in the web tier, so it neither scales independently nor stops slowing web requests.", fr: "Des instances web plus grandes gardent la génération des rapports dans le niveau web : elle ne se met pas à l'échelle indépendamment et continue de ralentir les requêtes web." }
    b: { en: "A cron job on the web instances still runs in the web tier and delays reports that users request during the day.", fr: "Une tâche cron sur les instances web s'exécute toujours dans le niveau web et retarde les rapports demandés par les utilisateurs pendant la journée." }
    c: { en: "A custom polling daemon on self-managed EC2 instances works but adds code and instances to operate, which is more overhead than a worker environment.", fr: "Un démon d'interrogation personnalisé sur des instances EC2 autogérées fonctionne, mais ajoute du code et des instances à exploiter, soit plus de charge qu'un environnement de travail." }
references:
  - title: Elastic Beanstalk worker environments
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/using-features-managing-env-tiers.html
