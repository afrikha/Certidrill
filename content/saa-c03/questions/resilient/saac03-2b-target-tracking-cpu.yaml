id: saac03-2b-target-tracking-cpu
objective: "2.1.18"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Traffic varies throughout the day with no predictable pattern. The company wants the group to add and remove instances automatically to keep the average CPU utilization near 50%, without creating or tuning CloudWatch alarms and step adjustments itself.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer. Le trafic varie au cours de la journée sans modèle prévisible. L'entreprise veut que le groupe ajoute et supprime automatiquement des instances pour maintenir l'utilisation moyenne du processeur autour de 50 %, sans créer ni ajuster elle-même des alarmes CloudWatch et des ajustements par étapes.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a simple scaling policy that adds one instance when a CloudWatch alarm detects CPU utilization above 50%.", fr: "Créer une politique de mise à l'échelle simple qui ajoute une instance lorsqu'une alarme CloudWatch détecte une utilisation du processeur supérieure à 50 %." }
    - id: b
      text: { en: "Create scheduled actions that set the desired capacity of the group every hour based on last week's traffic.", fr: "Créer des actions planifiées qui définissent la capacité souhaitée du groupe chaque heure d'après le trafic de la semaine précédente." }
    - id: c
      text: { en: "Create a target tracking scaling policy that uses the ASGAverageCPUUtilization metric with a target value of 50.", fr: "Créer une politique de mise à l'échelle avec suivi de cible qui utilise la métrique ASGAverageCPUUtilization avec une valeur cible de 50." }
    - id: d
      text: { en: "Create a step scaling policy with CloudWatch alarms at 40%, 50%, and 60% CPU utilization and matching step adjustments.", fr: "Créer une politique de mise à l'échelle par étapes avec des alarmes CloudWatch à 40 %, 50 % et 60 % d'utilisation du processeur et des ajustements correspondants." }
answer: { optionId: c }
explanation:
  correct:
    en: A target tracking scaling policy keeps a metric near a target value, like a thermostat. With the predefined ASGAverageCPUUtilization metric and a target of 50, EC2 Auto Scaling creates and manages the CloudWatch alarms and calculates the scale-out and scale-in adjustments itself.
    fr: Une politique de mise à l'échelle avec suivi de cible maintient une métrique autour d'une valeur cible, comme un thermostat. Avec la métrique prédéfinie ASGAverageCPUUtilization et une cible de 50, EC2 Auto Scaling crée et gère les alarmes CloudWatch et calcule lui-même les ajustements d'augmentation et de diminution.
  options:
    a:
      en: A simple scaling policy needs alarms that the company creates and tunes, and it only adds instances in fixed amounts without keeping a target.
      fr: Une politique de mise à l'échelle simple nécessite des alarmes que l'entreprise crée et ajuste, et elle ajoute des instances par quantités fixes sans maintenir de cible.
    b:
      en: Scheduled actions suit predictable patterns; the traffic here has none, so the capacity would not follow the actual load.
      fr: Les actions planifiées suivent des modèles prévisibles ; le trafic ici n'en a pas, et la capacité ne suivrait donc pas la charge réelle.
    d:
      en: Step scaling works, but the company must define and maintain the alarms and step adjustments, which the requirement excludes.
      fr: La mise à l'échelle par étapes fonctionne, mais l'entreprise doit définir et maintenir les alarmes et les ajustements, ce que l'exigence exclut.
references:
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
