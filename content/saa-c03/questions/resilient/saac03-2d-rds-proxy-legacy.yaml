id: saac03-2d-rds-proxy-legacy
objective: "2.2.19"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A legacy Java application on Amazon EC2 connects to an Amazon RDS for MySQL Multi-AZ DB instance. The application opens many short-lived connections during traffic peaks, which sometimes exhausts the database connection limit. During each Multi-AZ failover, the application returns errors for several minutes until its connections are re-established.

    The company cannot change the application code, but it can change the database endpoint in a configuration file.

    Which solution will meet these requirements?
  fr: |
    Une application Java héritée sur Amazon EC2 se connecte à une instance de base de données Amazon RDS for MySQL Multi-AZ. L'application ouvre de nombreuses connexions de courte durée pendant les pics de trafic, ce qui épuise parfois la limite de connexions de la base. Lors de chaque basculement Multi-AZ, l'application renvoie des erreurs pendant plusieurs minutes, jusqu'au rétablissement de ses connexions.

    L'entreprise ne peut pas modifier le code de l'application, mais elle peut changer le point de terminaison de la base de données dans un fichier de configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a read replica of the DB instance and point the application configuration to the replica endpoint.", fr: "Créer un réplica en lecture de l'instance de base de données et faire pointer la configuration de l'application vers le point de terminaison du réplica." } }
    - { id: b, text: { en: "Create an Amazon RDS Proxy for the DB instance and point the application configuration to the proxy endpoint.", fr: "Créer un Amazon RDS Proxy pour l'instance de base de données et faire pointer la configuration de l'application vers le point de terminaison du proxy." } }
    - { id: c, text: { en: "Place an Amazon ElastiCache cluster in front of the database to cache query results.", fr: "Placer un cluster Amazon ElastiCache devant la base de données pour mettre en cache les résultats des requêtes." } }
    - { id: d, text: { en: "Change the DB instance to a larger instance class that supports more connections.", fr: "Passer l'instance de base de données sur une classe d'instance plus grande qui prend en charge davantage de connexions." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      RDS Proxy keeps a pool of database connections and reuses them, so connection storms from the application no longer exhaust the database, and it can queue or throttle excess requests. During a failover, the proxy connects to the standby while preserving the application connections, which makes the application more resilient. Most applications can use RDS Proxy with no code change, only a new endpoint.
    fr: |
      RDS Proxy maintient un pool de connexions à la base de données et les réutilise : les rafales de connexions de l'application n'épuisent plus la base, et le proxy peut mettre en file d'attente ou limiter les demandes excédentaires. Lors d'un basculement, le proxy se connecte à l'instance de secours tout en préservant les connexions de l'application, ce qui rend l'application plus résiliente. La plupart des applications peuvent utiliser RDS Proxy sans modification du code, avec un simple nouveau point de terminaison.
  options:
    a: { en: "A read replica is read-only, so the application could not write, and it does not pool connections or shorten failovers.", fr: "Un réplica en lecture est en lecture seule : l'application ne pourrait pas écrire, et il ne regroupe pas les connexions ni n'écourte les basculements." }
    c: { en: "Using a cache requires changing the application code to read from and write to the cache, which is not allowed.", fr: "Utiliser un cache exige de modifier le code de l'application pour qu'elle lise et écrive dans le cache, ce qui n'est pas permis." }
    d: { en: "A larger instance raises the connection limit but does nothing to reduce the impact of failovers on the application.", fr: "Une instance plus grande relève la limite de connexions mais ne réduit en rien l'impact des basculements sur l'application." }
references:
  - title: Amazon RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
