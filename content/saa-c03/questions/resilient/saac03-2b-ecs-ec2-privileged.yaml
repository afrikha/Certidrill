id: saac03-2b-ecs-ec2-privileged
objective: "2.1.20"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A security vendor is containerizing two components on Amazon ECS. A network-monitoring agent must run in privileged mode and needs access to devices of the host. A web dashboard is a stateless container with no special requirements. The vendor wants to minimize the infrastructure that it manages.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de sécurité conteneurise deux composants sur Amazon ECS. Un agent de supervision réseau doit s'exécuter en mode privilégié et a besoin d'accéder à des périphériques de l'hôte. Un tableau de bord web est un conteneur sans état sans exigence particulière. L'éditeur veut réduire au minimum l'infrastructure qu'il gère.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run the monitoring agent on ECS container instances with the EC2 launch type, and run the dashboard on AWS Fargate.", fr: "Exécuter l'agent de supervision sur des instances de conteneur ECS avec le type de lancement EC2, et exécuter le tableau de bord sur AWS Fargate." }
    - id: b
      text: { en: "Run both components on AWS Fargate, and set the privileged parameter to true in the task definition of the agent.", fr: "Exécuter les deux composants sur AWS Fargate, et définir le paramètre privileged sur true dans la définition de tâche de l'agent." }
    - id: c
      text: { en: "Run both components on AWS Fargate, and add the required Linux capabilities and devices in the task definition of the agent.", fr: "Exécuter les deux composants sur AWS Fargate, et ajouter les capacités Linux et périphériques nécessaires dans la définition de tâche de l'agent." }
    - id: d
      text: { en: "Run both components on ECS container instances with the EC2 launch type in one Auto Scaling group.", fr: "Exécuter les deux composants sur des instances de conteneur ECS avec le type de lancement EC2 dans un même groupe Auto Scaling." }
answer: { optionId: a }
explanation:
  correct:
    en: The privileged parameter and host devices are not valid for tasks on Fargate, so the agent needs EC2 container instances. The dashboard has no such need and can run on Fargate, where AWS manages the infrastructure, which keeps the managed fleet as small as possible.
    fr: Le paramètre privileged et les périphériques de l'hôte ne sont pas valides pour les tâches sur Fargate ; l'agent a donc besoin d'instances de conteneur EC2. Le tableau de bord n'a pas ce besoin et peut s'exécuter sur Fargate, où AWS gère l'infrastructure, ce qui réduit au minimum le parc à gérer.
  options:
    b:
      en: The privileged parameter is not valid for Fargate tasks.
      fr: Le paramètre privileged n'est pas valide pour les tâches Fargate.
    c:
      en: On Fargate, the only Linux capability that can be added is CAP_SYS_PTRACE, and the devices parameter is not supported.
      fr: Sur Fargate, la seule capacité Linux qui peut être ajoutée est CAP_SYS_PTRACE, et le paramètre devices n'est pas pris en charge.
    d:
      en: Running the dashboard on EC2 instances works, but it adds instances to manage for a container that could run on Fargate.
      fr: Exécuter le tableau de bord sur des instances EC2 fonctionne, mais ajoute des instances à gérer pour un conteneur qui pourrait s'exécuter sur Fargate.
references:
  - title: Amazon ECS task definition differences for Fargate
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-tasks-services.html
