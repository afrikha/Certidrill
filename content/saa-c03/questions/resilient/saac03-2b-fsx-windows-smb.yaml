id: saac03-2b-fsx-windows-smb
objective: "2.1.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating Windows applications to Amazon EC2. The applications store user files on an on-premises Windows file server, access them over the SMB protocol, and rely on Microsoft Active Directory users and Windows access control lists (ACLs). The new file storage must be fully managed and must remain available if an Availability Zone fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre des applications Windows vers Amazon EC2. Les applications stockent des fichiers utilisateur sur un serveur de fichiers Windows local, y accèdent via le protocole SMB et s'appuient sur les utilisateurs Microsoft Active Directory et les listes de contrôle d'accès (ACL) Windows. Le nouveau stockage de fichiers doit être entièrement géré et rester disponible en cas de panne d'une zone de disponibilité.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an Amazon FSx for Windows File Server Multi-AZ file system joined to the Active Directory domain.", fr: "Déployer un système de fichiers Multi-AZ Amazon FSx for Windows File Server joint au domaine Active Directory." }
    - id: b
      text: { en: "Deploy an Amazon EFS Regional file system, and mount it from the Windows EC2 instances.", fr: "Déployer un système de fichiers régional Amazon EFS, et le monter depuis les instances EC2 Windows." }
    - id: c
      text: { en: "Deploy an Amazon FSx for Lustre persistent file system linked to an Amazon S3 bucket.", fr: "Déployer un système de fichiers persistant Amazon FSx for Lustre lié à un compartiment Amazon S3." }
    - id: d
      text: { en: "Attach an Amazon EBS volume to a Windows EC2 instance, and share its folders over SMB.", fr: "Attacher un volume Amazon EBS à une instance EC2 Windows, et partager ses dossiers via SMB." }
answer: { optionId: a }
explanation:
  correct:
    en: FSx for Windows File Server provides fully managed Windows file shares over SMB, joins a Microsoft Active Directory for user authentication, and enforces Windows ACLs on files and folders. A Multi-AZ file system maintains a standby file server in another Availability Zone and fails over to it.
    fr: FSx for Windows File Server fournit des partages de fichiers Windows entièrement gérés via SMB, rejoint un Microsoft Active Directory pour l'authentification des utilisateurs et applique les ACL Windows aux fichiers et dossiers. Un système de fichiers Multi-AZ maintient un serveur de fichiers de secours dans une autre zone de disponibilité et bascule vers celui-ci.
  options:
    b:
      en: Amazon EFS uses NFS, and using it with Windows-based EC2 instances is not supported.
      fr: Amazon EFS utilise NFS, et son utilisation avec des instances EC2 Windows n'est pas prise en charge.
    c:
      en: FSx for Lustre is a high-performance file system for Linux clients (HPC, machine learning); it does not provide SMB shares with Active Directory and Windows ACLs.
      fr: FSx for Lustre est un système de fichiers hautes performances pour clients Linux (HPC, machine learning) ; il ne fournit pas de partages SMB avec Active Directory et ACL Windows.
    d:
      en: A file server on one EC2 instance is self-managed and depends on a single instance and Availability Zone.
      fr: Un serveur de fichiers sur une seule instance EC2 est autogéré et dépend d'une seule instance et d'une seule zone de disponibilité.
references:
  - title: What is FSx for Windows File Server?
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
