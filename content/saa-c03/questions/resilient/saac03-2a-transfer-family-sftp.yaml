id: saac03-2a-transfer-family-sftp
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company receives daily inventory files from 40 partners. The partners send the files with their existing SFTP clients and cannot change their tools. The company wants to store the files in Amazon S3 and does not want to manage any servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique reçoit chaque jour des fichiers d'inventaire de 40 partenaires. Les partenaires envoient les fichiers avec leurs clients SFTP existants et ne peuvent pas changer d'outils. L'entreprise veut stocker les fichiers dans Amazon S3 et ne veut gérer aucun serveur.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run SFTP server software on EC2 instances in an Auto Scaling group, and copy the received files to Amazon S3 with a scheduled script.", fr: "Exécuter un logiciel de serveur SFTP sur des instances EC2 dans un groupe Auto Scaling, et copier les fichiers reçus dans Amazon S3 avec un script planifié." }
    - id: b
      text: { en: "Create an AWS Transfer Family server that uses the SFTP protocol with Amazon S3 as its storage, and create a user for each partner.", fr: "Créer un serveur AWS Transfer Family qui utilise le protocole SFTP avec Amazon S3 comme stockage, et créer un utilisateur pour chaque partenaire." }
    - id: c
      text: { en: "Ask each partner to deploy an AWS DataSync agent, and create a DataSync task that copies its files to Amazon S3.", fr: "Demander à chaque partenaire de déployer un agent AWS DataSync, et créer une tâche DataSync qui copie ses fichiers dans Amazon S3." }
    - id: d
      text: { en: "Deploy an Amazon S3 File Gateway, and give each partner access to an SMB file share on the gateway.", fr: "Déployer une passerelle Amazon S3 File Gateway, et donner à chaque partenaire l'accès à un partage de fichiers SMB sur la passerelle." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Transfer Family is a fully managed service that provides SFTP, FTPS, FTP and AS2 endpoints that store files directly in Amazon S3 or Amazon EFS. Partners keep their SFTP clients, and the company has no server infrastructure to run, patch or scale.
    fr: |
      AWS Transfer Family est un service entièrement géré qui fournit des points de terminaison SFTP, FTPS, FTP et AS2 qui stockent les fichiers directement dans Amazon S3 ou Amazon EFS. Les partenaires conservent leurs clients SFTP, et l'entreprise n'a aucune infrastructure de serveurs à exécuter, corriger ou mettre à l'échelle.
  options:
    a: { en: "EC2 instances running SFTP software are servers that the company must patch, scale and monitor, which violates the requirement.", fr: "Des instances EC2 qui exécutent un logiciel SFTP sont des serveurs que l'entreprise doit corriger, mettre à l'échelle et surveiller, ce qui enfreint l'exigence." }
    c: { en: "DataSync agents would have to be deployed at every partner site, which changes the partners' tools instead of accepting SFTP uploads.", fr: "Des agents DataSync devraient être déployés chez chaque partenaire, ce qui change les outils des partenaires au lieu d'accepter des envois SFTP." }
    d: { en: "S3 File Gateway exposes NFS and SMB file shares, not SFTP, and the gateway appliance must be deployed and maintained.", fr: "S3 File Gateway expose des partages de fichiers NFS et SMB, pas SFTP, et l'appliance de passerelle doit être déployée et maintenue." }
references:
  - title: What is AWS Transfer Family?
    url: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
