id: saac03-2c-route53-geolocation-rights
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video streaming company has distribution rights for its catalog only in Europe and North America. It runs one application stack in eu-west-1 and another in us-east-1. Users in Europe must always be served by eu-west-1, and users in North America must always be served by us-east-1. Users from any other location, including queries whose location cannot be identified, must receive a static page that explains that the service is not available. The company uses Amazon Route 53.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de streaming vidéo détient des droits de diffusion pour son catalogue uniquement en Europe et en Amérique du Nord. Elle exécute une pile applicative dans eu-west-1 et une autre dans us-east-1. Les utilisateurs d'Europe doivent toujours être servis par eu-west-1, et ceux d'Amérique du Nord toujours par us-east-1. Les utilisateurs de tout autre emplacement, y compris les requêtes dont l'emplacement ne peut pas être identifié, doivent recevoir une page statique indiquant que le service n'est pas disponible. L'entreprise utilise Amazon Route 53.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create geolocation records for Europe and North America that point to the two stacks, and a default geolocation record that points to the static page."
        fr: "Créer des enregistrements de géolocalisation pour l'Europe et l'Amérique du Nord qui pointent vers les deux piles, et un enregistrement de géolocalisation par défaut qui pointe vers la page statique."
    - id: b
      text:
        en: "Create latency records that point to the two stacks, and a third latency record that points to the static page."
        fr: "Créer des enregistrements de latence qui pointent vers les deux piles, et un troisième enregistrement de latence qui pointe vers la page statique."
    - id: c
      text:
        en: "Create geoproximity records for the two stacks and the static page, and set a positive bias on the two stacks."
        fr: "Créer des enregistrements de géoproximité pour les deux piles et la page statique, et définir un biais positif sur les deux piles."
    - id: d
      text:
        en: "Create weighted records that send 50 % of queries to each stack, and associate a health check with each record."
        fr: "Créer des enregistrements pondérés qui envoient 50 % des requêtes vers chaque pile, et associer une vérification de l'état à chaque enregistrement."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Geolocation routing chooses the answer from the location that DNS queries come from (continent, country, or US state), which supports restricting distribution to locations where the company has rights. A default record answers the queries that match no location record or cannot be mapped to a location; without it, Route 53 returns no answer.
    fr: |
      Le routage par géolocalisation choisit la réponse selon l'emplacement d'origine des requêtes DNS (continent, pays ou État américain), ce qui permet de limiter la diffusion aux emplacements où l'entreprise détient des droits. Un enregistrement par défaut répond aux requêtes qui ne correspondent à aucun enregistrement d'emplacement ou dont l'emplacement est inconnu ; sans lui, Route 53 ne renvoie aucune réponse.
  options:
    b:
      en: |
        Latency routing picks the Region with the best latency, not the user's location; a European user could reach us-east-1, and some users could get the static page.
      fr: |
        Le routage par latence choisit la Région offrant la meilleure latence, pas l'emplacement de l'utilisateur ; un utilisateur européen pourrait atteindre us-east-1, et certains utilisateurs pourraient obtenir la page statique.
    c:
      en: |
        Geoproximity routes by distance to the resources, adjusted by bias; it does not guarantee that every European user reaches eu-west-1 or that other locations get the static page.
      fr: |
        La géoproximité route selon la distance aux ressources, ajustée par un biais ; elle ne garantit pas que chaque utilisateur européen atteigne eu-west-1 ni que les autres emplacements reçoivent la page statique.
    d:
      en: |
        Weighted routing ignores the user's location, so users would be split between the stacks and no one would get the static page.
      fr: |
        Le routage pondéré ignore l'emplacement de l'utilisateur : les utilisateurs seraient répartis entre les piles et personne ne recevrait la page statique.
references:
  - title: Geolocation routing
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy-geo.html
