id: saac03-2b-eventbridge-saas
objective: "2.1.17"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a third-party SaaS help desk application that is an Amazon EventBridge partner. When a ticket with urgent priority is created, the company wants to start an AWS Step Functions workflow. All other ticket events must be sent to an Amazon SQS queue for later analysis. The company does not want to write or host any polling code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise une application SaaS tierce de support client qui est partenaire d'Amazon EventBridge. Lorsqu'un ticket de priorité urgente est créé, l'entreprise veut démarrer un flux de travail AWS Step Functions. Tous les autres événements de ticket doivent être envoyés dans une file d'attente Amazon SQS pour une analyse ultérieure. L'entreprise ne veut ni écrire ni héberger de code d'interrogation.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Write an AWS Lambda function that calls the API of the SaaS application every minute and routes each new ticket based on its priority.", fr: "Écrire une fonction AWS Lambda qui appelle l'API de l'application SaaS chaque minute et achemine chaque nouveau ticket selon sa priorité." }
    - id: b
      text: { en: "Associate the partner event source with a partner event bus, and create rules whose event patterns route urgent tickets to Step Functions and other tickets to SQS.", fr: "Associer la source d'événement partenaire à un bus d'événements partenaire, et créer des règles dont les modèles d'événement acheminent les tickets urgents vers Step Functions et les autres vers SQS." }
    - id: c
      text: { en: "Create an Amazon SNS topic for the SaaS application, and subscribe the Step Functions state machine and the SQS queue with filter policies.", fr: "Créer une rubrique Amazon SNS pour l'application SaaS, et y abonner la machine d'état Step Functions et la file d'attente SQS avec des politiques de filtre." }
    - id: d
      text: { en: "Configure webhooks in the SaaS application that call an Application Load Balancer in front of EC2 instances that route the tickets.", fr: "Configurer dans l'application SaaS des webhooks qui appellent un Application Load Balancer placé devant des instances EC2 qui acheminent les tickets." }
answer: { optionId: b }
explanation:
  correct:
    en: An EventBridge partner creates a partner event source in the account; associating it with a partner event bus activates it. Rules on that bus then match event patterns, such as the ticket priority, and send each event to its target, Step Functions or SQS, with no code to write or host.
    fr: Un partenaire EventBridge crée une source d'événement partenaire dans le compte ; l'associer à un bus d'événements partenaire l'active. Des règles sur ce bus comparent ensuite les modèles d'événement, comme la priorité du ticket, et envoient chaque événement à sa cible, Step Functions ou SQS, sans code à écrire ni à héberger.
  options:
    a:
      en: A polling function is custom code to build and maintain, and it adds delay; the requirement excludes polling code.
      fr: Une fonction d'interrogation est du code personnalisé à construire et à maintenir, et elle ajoute du délai ; l'exigence exclut le code d'interrogation.
    c:
      en: A Step Functions state machine is not an SNS subscription type, and the SaaS application would need credentials to publish to the company's topic.
      fr: Une machine d'état Step Functions n'est pas un type d'abonnement SNS, et l'application SaaS aurait besoin d'identifiants pour publier dans la rubrique de l'entreprise.
    d:
      en: A webhook receiver on EC2 means servers and routing code to manage, which is not the least operational overhead.
      fr: Un récepteur de webhooks sur EC2 implique des serveurs et du code de routage à gérer, ce qui n'est pas la charge opérationnelle minimale.
references:
  - title: Receiving events from a SaaS partner with Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-saas.html
