id: saac03-2b-eventbridge-rule-dlq
objective: "2.1.19"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company's microservices publish events to an Amazon EventBridge custom event bus. A new billing microservice must receive only the events in which the detail.status field equals PAYMENT_FAILED, and the publishing microservices must not be changed. Events that EventBridge cannot deliver to the billing target after all retries must be kept for later reprocessing.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Les microservices d'une entreprise publient des événements sur un bus d'événements personnalisé Amazon EventBridge. Un nouveau microservice de facturation doit recevoir uniquement les événements dont le champ detail.status est égal à PAYMENT_FAILED, et les microservices éditeurs ne doivent pas être modifiés. Les événements qu'EventBridge ne parvient pas à remettre à la cible de facturation après toutes les nouvelles tentatives doivent être conservés pour un retraitement ultérieur.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure an Amazon SQS FIFO queue as the dead-letter queue of the rule target.", fr: "Configurer une file d'attente FIFO Amazon SQS comme file d'attente de lettres mortes de la cible de la règle." }
    - id: b
      text: { en: "Change the publishing microservices to send PAYMENT_FAILED events directly to the billing microservice.", fr: "Modifier les microservices éditeurs pour qu'ils envoient les événements PAYMENT_FAILED directement au microservice de facturation." }
    - id: c
      text: { en: "Create a rule on the custom event bus with an event pattern that matches detail.status PAYMENT_FAILED and targets the billing microservice.", fr: "Créer sur le bus d'événements personnalisé une règle dont le modèle d'événement correspond à detail.status PAYMENT_FAILED et qui cible le microservice de facturation." }
    - id: d
      text: { en: "Attach an Amazon SNS subscription filter policy to the custom event bus for the billing microservice.", fr: "Attacher au bus d'événements personnalisé une politique de filtre d'abonnement Amazon SNS pour le microservice de facturation." }
    - id: e
      text: { en: "Configure an Amazon SQS standard queue as the dead-letter queue of the rule target.", fr: "Configurer une file d'attente standard Amazon SQS comme file d'attente de lettres mortes de la cible de la règle." }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: An EventBridge rule filters events with an event pattern and sends only the matching events to its target, so publishers stay unchanged. A dead-letter queue on the target receives events that could not be delivered after retries were exhausted (or that failed without retry, such as missing permissions), and EventBridge supports only standard SQS queues for this.
    fr: Une règle EventBridge filtre les événements avec un modèle d'événement et n'envoie que les événements correspondants à sa cible ; les éditeurs restent inchangés. Une file d'attente de lettres mortes sur la cible reçoit les événements non remis après épuisement des nouvelles tentatives (ou en échec sans nouvelle tentative, par exemple faute d'autorisations), et EventBridge ne prend en charge que les files d'attente SQS standard pour cela.
  options:
    a:
      en: EventBridge dead-letter queues must be standard SQS queues; a FIFO queue cannot be used.
      fr: Les files d'attente de lettres mortes EventBridge doivent être des files SQS standard ; une file FIFO ne peut pas être utilisée.
    b:
      en: Changing the publishers violates the requirement and couples them tightly to the billing microservice.
      fr: Modifier les éditeurs enfreint l'exigence et les couple fortement au microservice de facturation.
    d:
      en: Subscription filter policies belong to SNS subscriptions, not to EventBridge event buses; EventBridge filters with rule event patterns.
      fr: Les politiques de filtre d'abonnement appartiennent aux abonnements SNS, pas aux bus d'événements EventBridge ; EventBridge filtre avec les modèles d'événement des règles.
references:
  - title: Using dead-letter queues to process undelivered events in EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rule-dlq.html
