id: saac03-2a-eventbridge-cross-account
objective: "2.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an organization in AWS Organizations with 30 member accounts. The security team wants every EC2 instance state-change event from all the member accounts to be delivered, as it occurs, to a central event bus in a security account, where a rule invokes an AWS Lambda function. The solution must require the LEAST custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une organisation AWS Organizations avec 30 comptes membres. L'équipe de sécurité veut que chaque événement de changement d'état d'instance EC2 de tous les comptes membres soit remis, au moment où il se produit, à un bus d'événements central d'un compte de sécurité, où une règle appelle une fonction AWS Lambda. La solution doit nécessiter le MOINS de code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy a Lambda function in each member account that calls DescribeInstances every minute and sends changes to the security account.", fr: "Déployer dans chaque compte membre une fonction Lambda qui appelle DescribeInstances toutes les minutes et envoie les changements au compte de sécurité." }
    - id: b
      text: { en: "Add a policy to the central event bus that allows the organization to put events, and create a rule in each member account that targets the central bus.", fr: "Ajouter au bus d'événements central une politique qui autorise l'organisation à publier des événements, et créer dans chaque compte membre une règle qui cible le bus central." }
    - id: c
      text: { en: "Turn on AWS CloudTrail in each account, and have the Lambda function read the trail log files from Amazon S3 every 5 minutes.", fr: "Activer AWS CloudTrail dans chaque compte, et faire lire toutes les 5 minutes les fichiers journaux du suivi dans Amazon S3 par la fonction Lambda." }
    - id: d
      text: { en: "Create an Amazon SQS queue in the security account, and deploy a forwarding Lambda function in each member account that writes events to it.", fr: "Créer une file d'attente Amazon SQS dans le compte de sécurité, et déployer dans chaque compte membre une fonction Lambda de transfert qui y écrit les événements." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      EventBridge can send events between accounts. A resource-based policy on the receiving event bus grants events:PutEvents, for example to the whole organization with the aws:PrincipalOrgID condition, and a rule in each sending account matches the EC2 state-change events and targets the central bus (with an IAM role). No code is needed apart from the Lambda function that processes the events.
    fr: |
      EventBridge peut envoyer des événements entre comptes. Une politique basée sur les ressources sur le bus récepteur accorde events:PutEvents, par exemple à toute l'organisation avec la condition aws:PrincipalOrgID, et une règle dans chaque compte émetteur sélectionne les événements de changement d'état EC2 et cible le bus central (avec un rôle IAM). Aucun code n'est nécessaire en dehors de la fonction Lambda qui traite les événements.
  options:
    a: { en: "Polling DescribeInstances is custom code in 30 accounts, adds delay and can miss short-lived state changes.", fr: "Interroger DescribeInstances représente du code personnalisé dans 30 comptes, ajoute du délai et peut manquer des changements d'état brefs." }
    c: { en: "Reading trail files every 5 minutes is polling with delay and requires parsing code; it does not deliver events as they occur.", fr: "Lire les fichiers de suivi toutes les 5 minutes revient à interroger avec du délai et exige du code d'analyse ; les événements ne sont pas remis au moment où ils se produisent." }
    d: { en: "A forwarding function in every account is custom code to deploy and maintain, while EventBridge can route the events natively.", fr: "Une fonction de transfert dans chaque compte est du code personnalisé à déployer et à maintenir, alors qu'EventBridge peut router les événements nativement." }
references:
  - title: Sending and receiving events between AWS accounts in Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-cross-account.html
