id: saac03-2b-lambda-container-image
objective: "2.1.20"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data team builds all its software as container images with an existing CI pipeline that pushes the images to Amazon ECR. A new component must process each file uploaded to an Amazon S3 bucket. Each run lasts less than 3 minutes, uploads happen only a few times per day at random times, and the image is 3 GB because it includes machine learning libraries. The team wants to keep its container tooling and pay nothing for compute when no file is being processed.

    Which solution will meet these requirements?
  fr: |
    Une équipe data construit tous ses logiciels sous forme d'images de conteneur avec un pipeline CI existant qui pousse les images vers Amazon ECR. Un nouveau composant doit traiter chaque fichier chargé dans un compartiment Amazon S3. Chaque exécution dure moins de 3 minutes, les chargements n'ont lieu que quelques fois par jour à des heures aléatoires, et l'image fait 3 Go car elle inclut des bibliothèques de machine learning. L'équipe veut conserver ses outils de conteneurs et ne rien payer en calcul lorsqu'aucun fichier n'est traité.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run the image as an Amazon ECS service on AWS Fargate with a desired count of 1 that polls an Amazon SQS queue of S3 events.", fr: "Exécuter l'image en tant que service Amazon ECS sur AWS Fargate avec un nombre souhaité de 1 qui interroge une file d'attente Amazon SQS d'événements S3." }
    - id: b
      text: { en: "Run the image on an Amazon EKS cluster with a managed node group, and scale the deployment based on S3 events.", fr: "Exécuter l'image sur un cluster Amazon EKS avec un groupe de nœuds gérés, et mettre le déploiement à l'échelle selon les événements S3." }
    - id: c
      text: { en: "Create an AWS Lambda function from the image in Amazon ECR, and invoke it with an S3 event notification.", fr: "Créer une fonction AWS Lambda à partir de l'image dans Amazon ECR, et l'appeler avec une notification d'événement S3." }
    - id: d
      text: { en: "Repackage the code and libraries as a Lambda .zip deployment package with layers, and invoke it with an S3 event notification.", fr: "Réempaqueter le code et les bibliothèques en package de déploiement Lambda .zip avec des couches, et l'appeler avec une notification d'événement S3." }
answer: { optionId: c }
explanation:
  correct:
    en: Lambda can run functions packaged as container images stored in an Amazon ECR repository in the same Region, up to 10 GB uncompressed. The team keeps its image build pipeline, S3 invokes the function only when a file arrives, and Lambda bills only for the time the function runs.
    fr: Lambda peut exécuter des fonctions empaquetées sous forme d'images de conteneur stockées dans un référentiel Amazon ECR de la même Région, jusqu'à 10 Go non compressés. L'équipe conserve son pipeline de construction d'images, S3 n'appelle la fonction qu'à l'arrivée d'un fichier, et Lambda ne facture que la durée d'exécution de la fonction.
  options:
    a:
      en: A service with a desired count of 1 keeps a task running all day, so the team pays for compute while no file is processed.
      fr: Un service avec un nombre souhaité de 1 garde une tâche en cours d'exécution toute la journée ; l'équipe paie donc du calcul alors qu'aucun fichier n'est traité.
    b:
      en: An EKS cluster has a control plane charge and EC2 nodes that run continuously, which does not meet the pay-nothing-when-idle requirement.
      fr: Un cluster EKS entraîne des frais de plan de contrôle et des nœuds EC2 qui tournent en continu, ce qui ne respecte pas l'exigence de ne rien payer en période d'inactivité.
    d:
      en: A .zip package with layers is limited to 250 MB unzipped, far below 3 GB, and it abandons the container tooling.
      fr: Un package .zip avec des couches est limité à 250 Mo décompressés, bien en dessous de 3 Go, et il abandonne les outils de conteneurs.
references:
  - title: Create a Lambda Event Function using a container image
    url: https://docs.aws.amazon.com/lambda/latest/dg/images-create.html
  - title: Lambda quotas
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
