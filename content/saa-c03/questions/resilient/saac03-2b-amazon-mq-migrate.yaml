id: saac03-2b-amazon-mq-migrate
objective: "2.1.19"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating an on-premises order management system to AWS. Its applications exchange messages through an Apache ActiveMQ broker by using JMS clients. The company must not rewrite the messaging code of the applications and wants AWS to handle broker setup, maintenance, and version upgrades.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise migre un système local de gestion des commandes vers AWS. Ses applications échangent des messages via un agent de messages (broker) Apache ActiveMQ à l'aide de clients JMS. L'entreprise ne doit pas réécrire le code de messagerie des applications et veut qu'AWS prenne en charge la configuration, la maintenance et les mises à niveau de version de l'agent.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon MQ for ActiveMQ broker, and point the applications to the broker endpoints.", fr: "Créer un agent Amazon MQ for ActiveMQ, et faire pointer les applications vers les points de terminaison de l'agent." }
    - id: b
      text: { en: "Create Amazon SQS standard queues, and change the applications to use the AWS SDK.", fr: "Créer des files d'attente standard Amazon SQS, et modifier les applications pour qu'elles utilisent le SDK AWS." }
    - id: c
      text: { en: "Install ActiveMQ on Amazon EC2 instances in an Auto Scaling group, and point the applications to them.", fr: "Installer ActiveMQ sur des instances Amazon EC2 d'un groupe Auto Scaling, et faire pointer les applications vers celles-ci." }
    - id: d
      text: { en: "Create an Amazon Kinesis data stream, and change the applications to use the Kinesis Client Library.", fr: "Créer un flux de données Amazon Kinesis, et modifier les applications pour qu'elles utilisent la Kinesis Client Library." }
answer: { optionId: a }
explanation:
  correct:
    en: Amazon MQ is a managed message broker service for Apache ActiveMQ Classic and RabbitMQ. Existing brokers can be migrated to it without rewriting messaging code because the applications keep the same industry-standard protocols, and AWS handles setup, maintenance, and version upgrades in a maintenance window.
    fr: Amazon MQ est un service d'agent de messages géré pour Apache ActiveMQ Classic et RabbitMQ. Les agents existants peuvent y être migrés sans réécrire le code de messagerie, car les applications conservent les mêmes protocoles standard, et AWS prend en charge la configuration, la maintenance et les mises à niveau de version pendant une fenêtre de maintenance.
  options:
    b:
      en: SQS requires changing the messaging code to the SQS API, which the company must not do.
      fr: SQS impose de modifier le code de messagerie pour utiliser l'API SQS, ce que l'entreprise ne doit pas faire.
    c:
      en: A self-managed broker on EC2 keeps the code unchanged, but the company would still install, patch, and upgrade the broker itself.
      fr: Un agent autogéré sur EC2 conserve le code, mais l'entreprise devrait toujours installer, corriger et mettre à niveau l'agent elle-même.
    d:
      en: Kinesis is a streaming service with its own API; using it means rewriting the producers and consumers.
      fr: Kinesis est un service de streaming doté de sa propre API ; l'utiliser implique de réécrire les producteurs et les consommateurs.
references:
  - title: What is Amazon MQ?
    url: https://docs.aws.amazon.com/amazon-mq/latest/developer-guide/welcome.html
