id: saac03-2b-scheduled-scaling-event
objective: "2.1.18"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company runs its sales website on Amazon EC2 instances in an Auto Scaling group that uses a target tracking scaling policy. Sales for a major concert will open on a known date at exactly 10:00 AM, and traffic is expected to reach 10 times the normal level within seconds. Such an event has never happened before, and new instances take several minutes to become ready. The required capacity must be in place before sales open.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie exécute son site de vente sur des instances Amazon EC2 d'un groupe Auto Scaling qui utilise une politique de mise à l'échelle avec suivi de cible. La vente d'un grand concert ouvrira à une date connue à 10 h 00 précises, et le trafic devrait atteindre 10 fois le niveau normal en quelques secondes. Un tel événement ne s'est jamais produit, et les nouvelles instances mettent plusieurs minutes à être prêtes. La capacité nécessaire doit être en place avant l'ouverture des ventes.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a one-time scheduled action that raises the minimum and desired capacity of the group shortly before 10:00 AM on that date.", fr: "Créer une action planifiée ponctuelle qui augmente la capacité minimale et souhaitée du groupe peu avant 10 h 00 à cette date." }
    - id: b
      text: { en: "Lower the target value of the target tracking policy so that the group scales out earlier when traffic starts to rise.", fr: "Abaisser la valeur cible de la politique de suivi de cible pour que le groupe augmente sa capacité plus tôt lorsque le trafic commence à monter." }
    - id: c
      text: { en: "Add a step scaling policy that adds a large number of instances when CPU utilization exceeds 80%.", fr: "Ajouter une politique de mise à l'échelle par étapes qui ajoute un grand nombre d'instances lorsque l'utilisation du processeur dépasse 80 %." }
    - id: d
      text: { en: "Add a predictive scaling policy that forecasts the capacity of the group from its historical load.", fr: "Ajouter une politique de mise à l'échelle prédictive qui prévoit la capacité du groupe à partir de sa charge historique." }
answer: { optionId: a }
explanation:
  correct:
    en: Scheduled scaling changes the desired, minimum, and maximum capacity at a specific time for predictable load changes, and a scheduled action can run one time only. Raising the minimum and desired capacity before 10:00 AM gives the new instances time to become ready, and the target tracking policy keeps working afterward.
    fr: La mise à l'échelle planifiée modifie la capacité souhaitée, minimale et maximale à une heure précise pour des variations de charge prévisibles, et une action planifiée peut ne s'exécuter qu'une seule fois. Augmenter la capacité minimale et souhaitée avant 10 h 00 laisse aux nouvelles instances le temps d'être prêtes, et la politique de suivi de cible continue de fonctionner ensuite.
  options:
    b:
      en: "Target tracking is reactive: it scales out only after the metric rises, and new instances take minutes, so capacity arrives too late for a spike within seconds."
      fr: "Le suivi de cible est réactif : il n'augmente la capacité qu'après la hausse de la métrique, et les nouvelles instances prennent des minutes ; la capacité arrive donc trop tard pour un pic en quelques secondes."
    c:
      en: Step scaling is also reactive and starts only when the alarm fires, after the traffic has arrived.
      fr: La mise à l'échelle par étapes est elle aussi réactive et ne démarre que lorsque l'alarme se déclenche, après l'arrivée du trafic.
    d:
      en: Predictive scaling forecasts recurring daily or weekly patterns from history; a one-time event that has never happened is not in the history.
      fr: La mise à l'échelle prédictive prévoit des modèles quotidiens ou hebdomadaires récurrents à partir de l'historique ; un événement ponctuel qui ne s'est jamais produit n'y figure pas.
references:
  - title: Scheduled scaling for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html
  - title: Predictive scaling for Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html
