id: saac03-2c-egress-only-ipv6
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a dual-stack VPC. Amazon EC2 instances in a private subnet use their IPv6 addresses to call a partner's API on the internet over IPv6. The company must ensure at the routing level, even if a security group is misconfigured, that no host on the internet can initiate an IPv6 connection to these instances. The company wants to avoid hourly gateway charges.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un VPC à double pile. Les instances Amazon EC2 d'un sous-réseau privé utilisent leurs adresses IPv6 pour appeler l'API d'un partenaire sur Internet en IPv6. L'entreprise doit garantir au niveau du routage, même si un groupe de sécurité est mal configuré, qu'aucun hôte d'Internet ne peut initier une connexion IPv6 vers ces instances. L'entreprise souhaite éviter les frais horaires de passerelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add a ::/0 route that targets the internet gateway to the private subnet's route table and rely on security groups to block inbound traffic."
        fr: "Ajouter à la table de routage du sous-réseau privé une route ::/0 qui cible la passerelle Internet et compter sur les groupes de sécurité pour bloquer le trafic entrant."
    - id: b
      text:
        en: "Create an egress-only internet gateway and add a ::/0 route that targets it to the private subnet's route table."
        fr: "Créer une passerelle Internet de sortie uniquement et ajouter à la table de routage du sous-réseau privé une route ::/0 qui la cible."
    - id: c
      text:
        en: "Create a NAT gateway in a public subnet and add a ::/0 route that targets it to the private subnet's route table."
        fr: "Créer une passerelle NAT dans un sous-réseau public et ajouter à la table de routage du sous-réseau privé une route ::/0 qui la cible."
    - id: d
      text:
        en: "Create a gateway VPC endpoint for the partner's API and add its prefix list route to the private subnet's route table."
        fr: "Créer un point de terminaison de VPC de type passerelle pour l'API du partenaire et ajouter la route de sa liste de préfixes à la table de routage du sous-réseau privé."
answer: { optionId: b }
explanation:
  correct:
    en: |
      An egress-only internet gateway lets instances initiate outbound IPv6 connections and returns the responses, but it prevents internet hosts from initiating IPv6 connections to the instances. The gateway itself has no charge; only data transfer is billed.
    fr: |
      Une passerelle Internet de sortie uniquement permet aux instances d'initier des connexions IPv6 sortantes et leur renvoie les réponses, mais elle empêche les hôtes d'Internet d'initier des connexions IPv6 vers les instances. La passerelle elle-même est gratuite ; seul le transfert de données est facturé.
  options:
    a:
      en: |
        IPv6 addresses are public, so a route to the internet gateway allows inbound connections whenever a security group permits them; it does not meet the routing-level requirement.
      fr: |
        Les adresses IPv6 sont publiques : une route vers la passerelle Internet autorise les connexions entrantes dès qu'un groupe de sécurité les permet ; l'exigence au niveau du routage n'est pas respectée.
    c:
      en: |
        A NAT gateway has hourly charges, and it is not the component for outbound-only IPv6 to IPv6 internet access; the egress-only internet gateway is.
      fr: |
        Une passerelle NAT est facturée à l'heure, et ce n'est pas le composant prévu pour un accès Internet IPv6 vers IPv6 en sortie uniquement ; c'est le rôle de la passerelle Internet de sortie uniquement.
    d:
      en: |
        Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; they cannot reach a partner's API on the internet.
      fr: |
        Les points de terminaison de type passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; ils ne permettent pas d'atteindre l'API d'un partenaire sur Internet.
references:
  - title: Enable outbound IPv6 traffic using an egress-only internet gateway
    url: https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html
