id: saac03-2b-sfn-standard-orchestration
objective: "2.1.16"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company processes claims through five AWS Lambda functions that run in sequence. Each function calls the next one directly, and the error handling and retry logic is duplicated in every function. The company wants a visual workflow with built-in retries, branching based on the claim type, and an execution history for audits. Some claims take up to 2 days to complete.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une compagnie d'assurance traite les sinistres avec cinq fonctions AWS Lambda qui s'exécutent en séquence. Chaque fonction appelle directement la suivante, et la logique de gestion des erreurs et de nouvelles tentatives est dupliquée dans chaque fonction. L'entreprise veut un flux de travail visuel avec des nouvelles tentatives intégrées, un branchement selon le type de sinistre et un historique d'exécution pour les audits. Certains sinistres prennent jusqu'à 2 jours.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Chain the functions through Amazon SQS queues, and keep the retry and branching code in each function.", fr: "Enchaîner les fonctions via des files d'attente Amazon SQS, et conserver le code de nouvelles tentatives et de branchement dans chaque fonction." }
    - id: b
      text: { en: "Publish an Amazon SNS message at the end of each function to invoke the next function in the sequence.", fr: "Publier un message Amazon SNS à la fin de chaque fonction pour appeler la fonction suivante de la séquence." }
    - id: c
      text: { en: "Run a scheduler on an Amazon EC2 instance that invokes each function and records the results in Amazon DynamoDB.", fr: "Exécuter un planificateur sur une instance Amazon EC2 qui appelle chaque fonction et enregistre les résultats dans Amazon DynamoDB." }
    - id: d
      text: { en: "Create an AWS Step Functions Standard workflow that invokes the functions and uses Retry, Catch, and Choice states.", fr: "Créer un flux de travail Standard AWS Step Functions qui appelle les fonctions et utilise des états Retry, Catch et Choice." }
answer: { optionId: d }
explanation:
  correct:
    en: Step Functions orchestrates the functions as a visual state machine. Retry and Catch fields handle errors declaratively, and a Choice state branches on the claim type, so the duplicated logic leaves the functions. A Standard workflow can run for up to one year, which covers 2-day claims, and keeps an execution history that can be retrieved for 90 days after completion.
    fr: Step Functions orchestre les fonctions sous forme de machine d'état visuelle. Les champs Retry et Catch gèrent les erreurs de façon déclarative, et un état Choice crée un branchement selon le type de sinistre ; la logique dupliquée quitte donc les fonctions. Un flux de travail Standard peut durer jusqu'à un an, ce qui couvre les sinistres de 2 jours, et conserve un historique d'exécution consultable pendant 90 jours après la fin.
  options:
    a:
      en: Queues decouple the steps, but retries, branching, and auditing stay as custom code in every function, with no visual workflow.
      fr: Les files d'attente découplent les étapes, mais les nouvelles tentatives, le branchement et l'audit restent du code personnalisé dans chaque fonction, sans flux de travail visuel.
    b:
      en: SNS chaining still spreads the orchestration across the functions and provides no workflow view, branching, or execution history.
      fr: L'enchaînement par SNS répartit toujours l'orchestration entre les fonctions et ne fournit ni vue du flux de travail, ni branchement, ni historique d'exécution.
    c:
      en: A custom scheduler on EC2 is server-based code to build and maintain, which adds operational overhead.
      fr: Un planificateur personnalisé sur EC2 est du code sur serveur à construire et à maintenir, ce qui ajoute de la charge opérationnelle.
references:
  - title: Choosing workflow type in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/choosing-workflow-type.html
