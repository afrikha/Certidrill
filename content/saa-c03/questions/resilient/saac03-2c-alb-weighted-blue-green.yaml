id: saac03-2c-alb-weighted-blue-green
objective: "2.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs version 1 of an application on Amazon EC2 instances registered in a target group behind an Application Load Balancer. The company deploys version 2 on a separate, new set of instances and must not modify the version 1 instances during the test. The company wants to send 10 % of requests to version 2 first and then all requests. If errors appear, all traffic must return to version 1 within seconds for every client, without waiting for DNS caches to expire.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute la version 1 d'une application sur des instances Amazon EC2 enregistrées dans un groupe cible derrière un Application Load Balancer. L'entreprise déploie la version 2 sur un nouvel ensemble d'instances distinct et ne doit pas modifier les instances de la version 1 pendant le test. L'entreprise souhaite envoyer d'abord 10 % des requêtes vers la version 2, puis toutes les requêtes. En cas d'erreurs, tout le trafic doit revenir vers la version 1 en quelques secondes pour chaque client, sans attendre l'expiration des caches DNS.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Put version 2 behind a second load balancer and use Route 53 weighted records with weights of 90 and 10 for the two load balancers."
        fr: "Placer la version 2 derrière un second équilibreur de charge et utiliser des enregistrements pondérés Route 53 avec des poids de 90 et 10 pour les deux équilibreurs."
    - id: b
      text:
        en: "Register version 2 in a second target group and use a listener rule forward action with weights of 90 and 10 for the two target groups."
        fr: "Enregistrer la version 2 dans un second groupe cible et utiliser une action de transfert de règle d'écouteur avec des poids de 90 et 10 pour les deux groupes cibles."
    - id: c
      text:
        en: "Deploy version 2 to a second Elastic Beanstalk environment and swap the environment URLs when the test succeeds."
        fr: "Déployer la version 2 dans un second environnement Elastic Beanstalk et permuter les URL des environnements lorsque le test réussit."
    - id: d
      text:
        en: "Update the launch template with the version 2 AMI and start an instance refresh with a minimum healthy percentage of 90 %."
        fr: "Mettre à jour le modèle de lancement avec l'AMI de la version 2 et démarrer une actualisation des instances avec un pourcentage minimal d'instances saines de 90 %."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A forward action can send requests to several target groups in proportion to their weights (0 to 999). Because the load balancer applies the weights, changing them back to 100/0 takes effect for all clients right away, with no DNS caching involved, while the blue instances stay untouched.
    fr: |
      Une action de transfert (forward) peut envoyer les requêtes vers plusieurs groupes cibles proportionnellement à leurs poids (0 à 999). Comme c'est l'équilibreur de charge qui applique les poids, les rétablir à 100/0 prend effet immédiatement pour tous les clients, sans cache DNS, tandis que les instances bleues restent intactes.
  options:
    a:
      en: |
        Weighted DNS records shift traffic, but clients and resolvers cache answers until the TTL expires, so a rollback is not immediate for every client.
      fr: |
        Les enregistrements DNS pondérés déplacent le trafic, mais les clients et les résolveurs mettent les réponses en cache jusqu'à l'expiration du TTL : un retour arrière n'est pas immédiat pour tous les clients.
    c:
      en: |
        Swapping environment URLs is a DNS-based cutover of all traffic at once; it cannot send 10 % first and depends on DNS caches for rollback.
      fr: |
        La permutation des URL d'environnement bascule tout le trafic d'un coup via le DNS ; elle ne peut pas envoyer d'abord 10 % et dépend des caches DNS pour le retour arrière.
    d:
      en: |
        An instance refresh replaces the version 1 instances, which the company must not modify, and rolling back means another replacement.
      fr: |
        Une actualisation des instances remplace les instances de la version 1, que l'entreprise ne doit pas modifier, et un retour arrière implique un nouveau remplacement.
references:
  - title: Action types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
