id: saac03-2a-dynamodb-on-demand-spikes
objective: "2.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A ticketing company stores reservations in an Amazon DynamoDB table that uses provisioned capacity with auto scaling. When ticket sales open, write traffic rises within seconds from almost zero to about 3,000 writes per second, and requests are throttled before auto scaling adds capacity. Sales open at irregular times that are not announced in advance. The company wants to stop the throttling without paying for unused capacity between sales, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une société de billetterie stocke les réservations dans une table Amazon DynamoDB en capacité provisionnée avec mise à l'échelle automatique. À l'ouverture des ventes, le trafic d'écriture passe en quelques secondes de presque zéro à environ 3 000 écritures par seconde, et des requêtes sont limitées avant que la mise à l'échelle automatique n'ajoute de la capacité. Les ventes ouvrent à des moments irréguliers qui ne sont pas annoncés à l'avance. L'entreprise veut supprimer la limitation sans payer de capacité inutilisée entre les ventes, avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the provisioned write capacity permanently to the peak value, and remove the auto scaling policy.", fr: "Fixer en permanence la capacité d'écriture provisionnée à la valeur de pointe, et supprimer la politique de mise à l'échelle automatique." }
    - id: b
      text: { en: "Create scheduled scaling actions for the table that raise the write capacity at the start of each sale.", fr: "Créer des actions de mise à l'échelle planifiées pour la table qui augmentent la capacité d'écriture au début de chaque vente." }
    - id: c
      text: { en: "Switch the table to on-demand capacity mode.", fr: "Passer la table en mode de capacité à la demande." }
    - id: d
      text: { en: "Send the reservations to an Amazon SQS queue, and have a consumer write them to the table at a steady rate.", fr: "Envoyer les réservations dans une file d'attente Amazon SQS, et faire écrire les réservations dans la table à un rythme régulier par un consommateur." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In on-demand mode, DynamoDB serves requests without capacity planning and bills per request, so there is no charge for idle capacity between sales. It instantly accommodates up to double the previous peak traffic on the table, so recurring spikes of about 3,000 writes per second are served without any scaling delay.
    fr: |
      En mode à la demande, DynamoDB traite les requêtes sans planification de capacité et facture à la requête : aucune capacité inactive n'est facturée entre les ventes. Il absorbe instantanément jusqu'au double du pic de trafic précédent de la table : les pics récurrents d'environ 3 000 écritures par seconde sont servis sans délai de mise à l'échelle.
  options:
    a: { en: "Provisioning the peak permanently stops throttling, but the company pays for the peak capacity even when there is no sale.", fr: "Provisionner la pointe en permanence supprime la limitation, mais l'entreprise paie la capacité de pointe même en l'absence de vente." }
    b: { en: "Scheduled actions need known times, and the sales open at unannounced times.", fr: "Les actions planifiées nécessitent des horaires connus, et les ventes ouvrent à des moments non annoncés." }
    d: { en: "A queue smooths writes but changes the application flow, delays reservations and adds components to operate.", fr: "Une file d'attente lisse les écritures, mais modifie le flux de l'application, retarde les réservations et ajoute des composants à exploiter." }
references:
  - title: DynamoDB on-demand capacity mode
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
