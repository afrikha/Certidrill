id: saac03-2a-cache-write-through-ttl
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An ecommerce company caches product prices in Amazon ElastiCache. The application uses only lazy loading. After a price changes in the database, customers sometimes see the old price for a long time. The company wants the cached price to be updated as soon as it changes, and it does not want keys that are no longer read to occupy cache memory indefinitely.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise de commerce en ligne met en cache les prix de ses produits dans Amazon ElastiCache. L'application utilise uniquement le chargement différé (lazy loading). Après la modification d'un prix dans la base de données, les clients voient parfois l'ancien prix pendant longtemps. L'entreprise veut que le prix mis en cache soit mis à jour dès qu'il change, et ne veut pas que des clés qui ne sont plus lues occupent indéfiniment la mémoire du cache.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Update the cache entry every time the application writes a price to the database.", fr: "Mettre à jour l'entrée du cache chaque fois que l'application écrit un prix dans la base de données." } }
    - { id: b, text: { en: "Move the cache to a larger node type with more memory for the price keys.", fr: "Passer le cache à un type de nœud plus grand avec davantage de mémoire pour les clés de prix." } }
    - { id: c, text: { en: "Enable Multi-AZ with automatic failover for the cache in the Region.", fr: "Activer Multi-AZ avec basculement automatique pour le cache dans la Région." } }
    - { id: d, text: { en: "Set a time to live (TTL) on each key that the application writes to the cache.", fr: "Définir une durée de vie (TTL) sur chaque clé que l'application écrit dans le cache." } }
    - { id: e, text: { en: "Add read replicas to the cache to serve more of the price read requests.", fr: "Ajouter des réplicas en lecture au cache pour servir davantage de requêtes de lecture de prix." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Write-through updates the cache whenever data is written to the database, so the cached price is never stale. Write-through also caches data that may never be read; a TTL on each key makes unused keys expire, and AWS recommends combining lazy loading, write-through and TTL.
    fr: |
      L'écriture simultanée (write-through) met à jour le cache chaque fois que des données sont écrites dans la base : le prix mis en cache n'est jamais obsolète. L'écriture simultanée met aussi en cache des données qui ne seront peut-être jamais lues ; une durée de vie sur chaque clé fait expirer les clés inutilisées, et AWS recommande de combiner chargement différé, écriture simultanée et durée de vie.
  options:
    b: { en: "More memory delays evictions but neither refreshes stale prices nor removes unused keys.", fr: "Davantage de mémoire retarde les évictions, mais ne rafraîchit pas les prix obsolètes et ne supprime pas les clés inutilisées." }
    c: { en: "Multi-AZ improves the availability of the cache; it has no effect on data freshness.", fr: "Multi-AZ améliore la disponibilité du cache ; il n'a aucun effet sur la fraîcheur des données." }
    e: { en: "Read replicas scale reads, and they copy the same stale values as the primary node.", fr: "Les réplicas en lecture mettent à l'échelle les lectures, et ils copient les mêmes valeurs obsolètes que le nœud principal." }
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
