id: saac03-2c-keyspaces-cassandra-migration
objective: "2.1.23"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs a self-managed Apache Cassandra cluster on Amazon EC2 instances to store package-tracking events. The operations team spends many hours patching nodes and adding capacity before peak seasons. The application uses Cassandra Query Language (CQL) through Cassandra drivers, and the company does not want to rewrite its data access code. The company wants a serverless database that scales automatically with traffic.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de logistique exécute un cluster Apache Cassandra autogéré sur des instances Amazon EC2 pour stocker les événements de suivi des colis. L'équipe d'exploitation passe de nombreuses heures à appliquer des correctifs aux nœuds et à ajouter de la capacité avant les périodes de pointe. L'application utilise le langage CQL (Cassandra Query Language) via des pilotes Cassandra, et l'entreprise ne souhaite pas réécrire son code d'accès aux données. L'entreprise souhaite une base de données sans serveur qui s'adapte automatiquement au trafic.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Migrate the tables to Amazon Keyspaces (for Apache Cassandra) and keep the existing CQL application code."
        fr: "Migrer les tables vers Amazon Keyspaces (for Apache Cassandra) et conserver le code CQL existant de l'application."
    - id: b
      text:
        en: "Migrate the data to Amazon DynamoDB and rewrite the data access layer to use the DynamoDB API."
        fr: "Migrer les données vers Amazon DynamoDB et réécrire la couche d'accès aux données pour utiliser l'API DynamoDB."
    - id: c
      text:
        en: "Migrate the data to Amazon DocumentDB (with MongoDB compatibility) and convert the queries to MongoDB syntax."
        fr: "Migrer les données vers Amazon DocumentDB (with MongoDB compatibility) et convertir les requêtes en syntaxe MongoDB."
    - id: d
      text:
        en: "Keep Cassandra on EC2 and run the nodes in an Auto Scaling group that uses larger instance types."
        fr: "Conserver Cassandra sur EC2 et exécuter les nœuds dans un groupe Auto Scaling qui utilise des types d'instances plus grands."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon Keyspaces is a serverless, Cassandra-compatible managed database: there are no servers to patch, tables scale up and down with traffic, and existing Cassandra workloads run with the same application code and developer tools. It removes the cluster management work without a rewrite.
    fr: |
      Amazon Keyspaces est une base de données gérée sans serveur compatible avec Cassandra : aucun serveur à corriger, les tables s'adaptent automatiquement au trafic, et les charges de travail Cassandra existantes s'exécutent avec le même code d'application et les mêmes outils. Il supprime la gestion du cluster sans réécriture.
  options:
    b:
      en: |
        DynamoDB is serverless, but it does not speak CQL, so the data access layer would have to be rewritten, which the company wants to avoid.
      fr: |
        DynamoDB est sans serveur, mais il ne prend pas en charge CQL : la couche d'accès aux données devrait être réécrite, ce que l'entreprise veut éviter.
    c:
      en: |
        DocumentDB is compatible with MongoDB, not Cassandra, so every query would have to be converted and the drivers replaced.
      fr: |
        DocumentDB est compatible avec MongoDB, pas avec Cassandra : chaque requête devrait être convertie et les pilotes remplacés.
    d:
      en: |
        The cluster stays self-managed: the team still patches nodes and manages Cassandra capacity, so the operational overhead does not decrease.
      fr: |
        Le cluster reste autogéré : l'équipe continue d'appliquer les correctifs et de gérer la capacité de Cassandra, donc la charge opérationnelle ne diminue pas.
references:
  - title: What is Amazon Keyspaces (for Apache Cassandra)?
    url: https://docs.aws.amazon.com/keyspaces/latest/devguide/what-is-keyspaces.html
