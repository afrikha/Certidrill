id: saac03-2a-rds-write-scale-up
objective: "2.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Amazon RDS for MySQL DB instance reaches 95% CPU utilization during a nightly batch import. The import consists almost entirely of INSERT and UPDATE statements, and read traffic is low at that time. The company wants to improve the import performance without changing the application code.

    Which solution will meet these requirements?
  fr: |
    Une instance de base de données Amazon RDS for MySQL atteint 95 % d'utilisation du processeur pendant une importation par lots nocturne. L'importation est presque entièrement composée d'instructions INSERT et UPDATE, et le trafic de lecture est faible à ce moment-là. L'entreprise veut améliorer les performances de l'importation sans modifier le code de l'application.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create two read replicas, and keep the import connected to the primary DB instance.", fr: "Créer deux réplicas en lecture, et laisser l'importation connectée à l'instance de base de données principale." }
    - id: b
      text: { en: "Modify the DB instance to a larger DB instance class with more vCPUs and memory.", fr: "Modifier l'instance de base de données pour une classe d'instance plus grande avec davantage de processeurs virtuels et de mémoire." }
    - id: c
      text: { en: "Convert the DB instance to a Multi-AZ DB instance deployment.", fr: "Convertir l'instance de base de données en déploiement d'instance de base de données Multi-AZ." }
    - id: d
      text: { en: "Place an Amazon ElastiCache cluster in front of the database to absorb the import traffic.", fr: "Placer un cluster Amazon ElastiCache devant la base de données pour absorber le trafic de l'importation." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      All writes of a single RDS DB instance run on that instance, so a write-bound workload needs more compute on the primary. Changing the DB instance class scales the instance vertically, adding CPU and memory without any change to the application.
    fr: |
      Toutes les écritures d'une instance RDS s'exécutent sur cette instance : une charge limitée par les écritures a besoin de plus de puissance de calcul sur l'instance principale. Changer la classe d'instance met l'instance à l'échelle verticalement, en ajoutant du processeur et de la mémoire sans aucune modification de l'application.
  options:
    a: { en: "Read replicas accept only read-only connections; every INSERT and UPDATE still runs on the primary, so the import does not speed up.", fr: "Les réplicas en lecture n'acceptent que des connexions en lecture seule ; chaque INSERT et UPDATE s'exécute toujours sur l'instance principale : l'importation n'accélère pas." }
    c: { en: "A Multi-AZ standby provides failover and does not process the writes of the primary, so it adds no write capacity.", fr: "L'instance de secours Multi-AZ assure le basculement et ne traite pas les écritures de l'instance principale : elle n'ajoute aucune capacité d'écriture." }
    d: { en: "A cache speeds up repeated reads; writes must still reach the database, and using a cache requires code changes.", fr: "Un cache accélère les lectures répétées ; les écritures doivent toujours atteindre la base de données, et utiliser un cache impose des modifications du code." }
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
  - title: DB instance classes
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.html
