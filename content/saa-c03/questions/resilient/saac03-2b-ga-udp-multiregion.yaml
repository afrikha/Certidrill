id: saac03-2b-ga-udp-multiregion
objective: "2.1.22"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A gaming company runs multiplayer game servers that use UDP on Amazon EC2 instances in the us-east-1 and eu-west-1 Regions. Players' firewalls must allow-list a fixed set of IP addresses. Players must be routed over the AWS global network to the nearest healthy Region, and traffic must move to the other Region within about a minute if a Region becomes unhealthy, without depending on DNS caching by clients.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société de jeux vidéo exécute des serveurs de jeu multijoueur qui utilisent UDP sur des instances Amazon EC2 dans les Régions us-east-1 et eu-west-1. Les pare-feu des joueurs doivent autoriser un ensemble fixe d'adresses IP. Les joueurs doivent être acheminés via le réseau mondial AWS vers la Région saine la plus proche, et le trafic doit passer vers l'autre Région en une minute environ si une Région devient défaillante, sans dépendre de la mise en cache DNS par les clients.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Create an AWS Global Accelerator standard accelerator with an endpoint group in each Region.", fr: "Créer un accélérateur standard AWS Global Accelerator avec un groupe de points de terminaison dans chaque Région." }
    - id: b
      text: { en: "Place an Application Load Balancer in front of the game servers in each Region, and add the load balancers as endpoints.", fr: "Placer un Application Load Balancer devant les serveurs de jeu de chaque Région, et ajouter les équilibreurs de charge comme points de terminaison." }
    - id: c
      text: { en: "Place a Network Load Balancer with UDP listeners in front of the game servers in each Region, and add the load balancers as endpoints.", fr: "Placer un Network Load Balancer avec des écouteurs UDP devant les serveurs de jeu de chaque Région, et ajouter les équilibreurs de charge comme points de terminaison." }
    - id: d
      text: { en: "Create an Amazon CloudFront distribution that uses the game servers of both Regions as origins.", fr: "Créer une distribution Amazon CloudFront qui utilise les serveurs de jeu des deux Régions comme origines." }
    - id: e
      text: { en: "Create Amazon Route 53 latency-based records with health checks that point to Elastic IP addresses in each Region.", fr: "Créer des enregistrements Amazon Route 53 basés sur la latence avec des vérifications de l'état qui pointent vers des adresses IP Elastic dans chaque Région." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Global Accelerator provides static anycast IP addresses for the life of the accelerator, supports TCP and UDP, routes clients over the AWS global network to the nearest healthy endpoint, and removes an unhealthy endpoint in less than a minute without relying on DNS. Network Load Balancers handle layer 4 UDP traffic and are supported endpoints in each Region's endpoint group.
    fr: Global Accelerator fournit des adresses IP anycast statiques pendant toute la vie de l'accélérateur, prend en charge TCP et UDP, achemine les clients via le réseau mondial AWS vers le point de terminaison sain le plus proche et retire un point de terminaison défaillant en moins d'une minute, sans dépendre du DNS. Les Network Load Balancers gèrent le trafic UDP de couche 4 et sont des points de terminaison pris en charge dans le groupe de chaque Région.
  options:
    b:
      en: An Application Load Balancer handles HTTP and HTTPS at layer 7 and cannot carry the UDP game traffic.
      fr: Un Application Load Balancer gère HTTP et HTTPS en couche 7 et ne peut pas transporter le trafic de jeu UDP.
    d:
      en: CloudFront serves HTTP-based web content; it does not proxy UDP game traffic or provide a fixed set of IP addresses.
      fr: CloudFront sert du contenu web basé sur HTTP ; il ne relaie pas le trafic de jeu UDP et ne fournit pas d'ensemble fixe d'adresses IP.
    e:
      en: Route 53 failover depends on DNS answers that clients and resolvers can cache for an unpredictable time, which the requirement excludes.
      fr: Le basculement Route 53 dépend de réponses DNS que les clients et les résolveurs peuvent mettre en cache pendant une durée imprévisible, ce que l'exigence exclut.
references:
  - title: What is AWS Global Accelerator?
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
  - title: AWS Global Accelerator FAQs
    url: https://aws.amazon.com/global-accelerator/faqs/
