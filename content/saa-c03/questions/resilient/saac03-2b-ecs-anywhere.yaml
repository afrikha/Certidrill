id: saac03-2b-ecs-anywhere
objective: "2.1.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs containerized data-processing workloads on Amazon ECS in AWS. Some of the same containers must also run on the company's existing Linux servers in its factories, because the data must be processed on premises. The company wants to manage both environments with the same ECS APIs, task definitions, and console, without operating a container orchestrator on premises. The on-premises tasks only send results to AWS and receive no inbound traffic.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle exécute des charges de traitement de données conteneurisées sur Amazon ECS dans AWS. Certains de ces conteneurs doivent aussi s'exécuter sur les serveurs Linux existants de ses usines, car les données doivent être traitées sur site. L'entreprise veut gérer les deux environnements avec les mêmes API ECS, définitions de tâches et console, sans exploiter d'orchestrateur de conteneurs sur site. Les tâches sur site envoient seulement des résultats vers AWS et ne reçoivent aucun trafic entrant.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Install Amazon EKS Anywhere on the factory servers, and convert the ECS task definitions to Kubernetes manifests.", fr: "Installer Amazon EKS Anywhere sur les serveurs des usines, et convertir les définitions de tâches ECS en manifestes Kubernetes." }
    - id: b
      text: { en: "Install AWS Outposts servers in each factory, and run the ECS tasks on the Outposts capacity.", fr: "Installer des serveurs AWS Outposts dans chaque usine, et exécuter les tâches ECS sur la capacité Outposts." }
    - id: c
      text: { en: "Run the containers with Docker on the factory servers, and start them with AWS Systems Manager Run Command.", fr: "Exécuter les conteneurs avec Docker sur les serveurs des usines, et les démarrer avec AWS Systems Manager Run Command." }
    - id: d
      text: { en: "Use Amazon ECS Anywhere to register the factory servers as external instances of an ECS cluster, and run the tasks on them.", fr: "Utiliser Amazon ECS Anywhere pour enregistrer les serveurs des usines comme instances externes d'un cluster ECS, et y exécuter les tâches." }
answer: { optionId: d }
explanation:
  correct:
    en: ECS Anywhere registers on-premises servers or virtual machines as external instances of an ECS cluster, managed through the SSM Agent, and runs tasks on them with the EXTERNAL launch type. The same ECS APIs and task definitions are used, and AWS operates the control plane. External instances do not support Elastic Load Balancing, which suits these outbound-only processing workloads.
    fr: ECS Anywhere enregistre des serveurs ou machines virtuelles locaux comme instances externes d'un cluster ECS, gérées via l'agent SSM, et y exécute des tâches avec le type de lancement EXTERNAL. Les mêmes API ECS et définitions de tâches sont utilisées, et AWS exploite le plan de contrôle. Les instances externes ne prennent pas en charge Elastic Load Balancing, ce qui convient à ces traitements qui n'émettent que du trafic sortant.
  options:
    a:
      en: EKS Anywhere is a Kubernetes distribution that the company operates on premises; it changes the orchestrator and requires converting the task definitions.
      fr: EKS Anywhere est une distribution Kubernetes que l'entreprise exploite sur site ; elle change d'orchestrateur et impose de convertir les définitions de tâches.
    b:
      en: Outposts installs new AWS-owned hardware; the requirement is to use the existing factory servers.
      fr: Outposts installe un nouveau matériel appartenant à AWS ; l'exigence est d'utiliser les serveurs existants des usines.
    c:
      en: Run Command only runs commands; the company would have to build scheduling, restarts, and deployments itself instead of using ECS.
      fr: Run Command exécute seulement des commandes ; l'entreprise devrait construire elle-même la planification, les redémarrages et les déploiements au lieu d'utiliser ECS.
references:
  - title: Amazon ECS clusters for external instances
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-anywhere.html
