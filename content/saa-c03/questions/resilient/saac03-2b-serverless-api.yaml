id: saac03-2b-serverless-api
objective: "2.1.21"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is building the backend API of a mobile app. Traffic is very low most of the day, with short unpredictable bursts and long periods without any request. The company wants to pay only for actual usage, manage no servers, and have every layer of the API scale automatically.

    Which architecture will meet these requirements?
  fr: |
    Une startup construit l'API backend d'une application mobile. Le trafic est très faible la majeure partie de la journée, avec de courts pics imprévisibles et de longues périodes sans aucune requête. L'entreprise veut payer uniquement l'utilisation réelle, ne gérer aucun serveur et que chaque couche de l'API se mette à l'échelle automatiquement.

    Quelle architecture permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Application Load Balancer, an Auto Scaling group of Amazon EC2 instances, and an Amazon RDS for MySQL DB instance", fr: "Un Application Load Balancer, un groupe Auto Scaling d'instances Amazon EC2 et une instance Amazon RDS for MySQL" }
    - id: b
      text: { en: "Amazon API Gateway, AWS Lambda functions, and an Amazon DynamoDB table in on-demand capacity mode", fr: "Amazon API Gateway, des fonctions AWS Lambda et une table Amazon DynamoDB en mode de capacité à la demande" }
    - id: c
      text: { en: "An Application Load Balancer, an Amazon ECS service on AWS Fargate with two tasks, and an Aurora provisioned cluster", fr: "Un Application Load Balancer, un service Amazon ECS sur AWS Fargate avec deux tâches et un cluster Aurora provisionné" }
    - id: d
      text: { en: "An AWS Elastic Beanstalk web server environment with an Amazon RDS for PostgreSQL DB instance", fr: "Un environnement de serveur web AWS Elastic Beanstalk avec une instance Amazon RDS for PostgreSQL" }
answer: { optionId: b }
explanation:
  correct:
    en: API Gateway, Lambda, and DynamoDB are serverless. Lambda bills per invocation and duration, and DynamoDB on-demand capacity bills per request and scales to zero when there is no traffic, so idle periods cost almost nothing and bursts scale automatically.
    fr: API Gateway, Lambda et DynamoDB sont sans serveur. Lambda facture par appel et par durée, et la capacité à la demande de DynamoDB facture par requête et descend à zéro en l'absence de trafic ; les périodes d'inactivité ne coûtent donc presque rien et les pics sont absorbés automatiquement.
  options:
    a:
      en: EC2 instances and an RDS DB instance are servers that run and are billed even when no request arrives.
      fr: Les instances EC2 et l'instance RDS sont des serveurs qui tournent et sont facturés même en l'absence de requêtes.
    c:
      en: Two always-running Fargate tasks and a provisioned Aurora cluster are billed around the clock, including during idle periods.
      fr: Deux tâches Fargate toujours actives et un cluster Aurora provisionné sont facturés en permanence, y compris pendant les périodes d'inactivité.
    d:
      en: Elastic Beanstalk simplifies deployment, but it runs EC2 instances and a DB instance that are billed while idle.
      fr: Elastic Beanstalk simplifie le déploiement, mais il exécute des instances EC2 et une instance de base de données facturées pendant l'inactivité.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
