id: saac03-2c-aurora-global-switchover
objective: "2.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an Amazon Aurora global database with the primary cluster in us-east-1 and a secondary cluster in eu-west-1. The applications connect through the global database writer endpoint. For a compliance exercise, the company must move the primary role to eu-west-1 for one week. The operation must lose no data, must keep us-east-1 in the global database as a secondary, and must not require changes to the application connection settings.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise une base de données globale Amazon Aurora avec le cluster principal dans us-east-1 et un cluster secondaire dans eu-west-1. Les applications se connectent via le point de terminaison d'écriture de la base de données globale. Pour un exercice de conformité, l'entreprise doit déplacer le rôle principal vers eu-west-1 pendant une semaine. L'opération ne doit perdre aucune donnée, doit conserver us-east-1 dans la base globale en tant que secondaire, et ne doit pas exiger de modification des paramètres de connexion des applications.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Perform a global database failover to the eu-west-1 cluster with the option that allows data loss."
        fr: "Effectuer un basculement (failover) de la base de données globale vers le cluster eu-west-1 avec l'option qui autorise la perte de données."
    - id: b
      text:
        en: "Detach the eu-west-1 cluster from the global database and promote it to a standalone cluster."
        fr: "Détacher le cluster eu-west-1 de la base de données globale et le promouvoir en cluster autonome."
    - id: c
      text:
        en: "Perform a global database switchover to the eu-west-1 cluster."
        fr: "Effectuer une permutation (switchover) de la base de données globale vers le cluster eu-west-1."
    - id: d
      text:
        en: "Create a new Aurora cluster in eu-west-1 from a snapshot and point the applications to its cluster endpoint."
        fr: "Créer un nouveau cluster Aurora dans eu-west-1 à partir d'un instantané et diriger les applications vers son point de terminaison de cluster."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A switchover (formerly managed planned failover) is designed for planned operations such as regional rotation: Aurora synchronizes the secondary before switching, so the RPO is 0, and the old primary becomes a secondary in the same topology. The global writer endpoint follows the new primary, so connection settings do not change.
    fr: |
      Une permutation (switchover, anciennement « basculement planifié géré ») est conçue pour les opérations planifiées comme la rotation régionale : Aurora synchronise le secondaire avant la permutation, donc le RPO est nul, et l'ancien principal devient un secondaire dans la même topologie. Le point de terminaison d'écriture global suit le nouveau principal : les paramètres de connexion ne changent pas.
  options:
    a:
      en: |
        Failover is for unplanned Regional outages; it can lose the writes that were not yet replicated, which violates the no-data-loss requirement.
      fr: |
        Le basculement (failover) est destiné aux pannes régionales imprévues ; il peut perdre les écritures pas encore répliquées, ce qui viole l'exigence d'absence de perte de données.
    b:
      en: |
        Detaching removes the cluster from the global database and breaks the topology; the applications would also need its new endpoint.
      fr: |
        Le détachement retire le cluster de la base globale et casse la topologie ; les applications auraient aussi besoin de son nouveau point de terminaison.
    d:
      en: |
        A cluster restored from a snapshot misses the changes made after the snapshot, is outside the global database, and requires new connection settings.
      fr: |
        Un cluster restauré à partir d'un instantané ne contient pas les modifications postérieures à l'instantané, est hors de la base globale et exige de nouveaux paramètres de connexion.
references:
  - title: Using switchover or failover in Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database-disaster-recovery.html
