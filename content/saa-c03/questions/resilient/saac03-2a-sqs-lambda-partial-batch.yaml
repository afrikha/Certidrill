id: saac03-2a-sqs-lambda-partial-batch
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function consumes an Amazon SQS standard queue through an event source mapping with a batch size of 10. When one message in a batch fails, the whole batch returns to the queue, so messages that were already processed successfully are processed again. A few malformed messages fail every time and are retried indefinitely. The company must keep batch processing for throughput.

    Which combination of actions will resolve these issues? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une fonction AWS Lambda consomme une file d'attente Amazon SQS standard via un mappage de source d'événement avec une taille de lot de 10. Quand un message d'un lot échoue, tout le lot revient dans la file : les messages déjà traités avec succès sont traités de nouveau. Quelques messages mal formés échouent à chaque fois et sont relancés indéfiniment. L'entreprise doit conserver le traitement par lots pour le débit.

    Quelle combinaison d'actions permet de résoudre ces problèmes ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on ReportBatchItemFailures for the event source mapping, and return the failed message IDs.", fr: "Activer ReportBatchItemFailures pour le mappage de source d'événement, et renvoyer les ID des messages en échec." } }
    - { id: b, text: { en: "Configure a dead-letter queue on the Lambda function to receive its failed invocations.", fr: "Configurer une file d'attente de lettres mortes sur la fonction Lambda pour recevoir ses appels en échec." } }
    - { id: c, text: { en: "Set the batch size of the event source mapping to 1 so that each message is processed separately.", fr: "Définir la taille de lot du mappage de source d'événement à 1 afin que chaque message soit traité séparément." } }
    - { id: d, text: { en: "Configure a redrive policy with a dead-letter queue and a maxReceiveCount on the source SQS queue.", fr: "Configurer une politique de redirection avec une file d'attente de lettres mortes et un maxReceiveCount sur la file SQS source." } }
    - { id: e, text: { en: "Increase the timeout of the Lambda function to the maximum value of 15 minutes.", fr: "Porter le délai d'expiration de la fonction Lambda à sa valeur maximale de 15 minutes." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      By default, a failed batch makes every message of the batch visible again. With partial batch responses (ReportBatchItemFailures), the function returns only the failed message IDs, so Lambda deletes the successful messages and returns only the failed ones to the queue. A redrive policy on the source queue moves a message to the dead-letter queue after maxReceiveCount receives, which isolates the malformed messages.
    fr: |
      Par défaut, un lot en échec rend à nouveau visibles tous les messages du lot. Avec les réponses de lot partielles (ReportBatchItemFailures), la fonction ne renvoie que les ID des messages en échec : Lambda supprime les messages traités avec succès et ne remet dans la file que ceux en échec. Une politique de redirection sur la file source déplace un message vers la file de lettres mortes après maxReceiveCount réceptions, ce qui isole les messages mal formés.
  options:
    b: { en: "For a function triggered by Amazon SQS, the dead-letter queue must be configured on the SQS queue; a function dead-letter queue applies to asynchronous invocations.", fr: "Pour une fonction déclenchée par Amazon SQS, la file de lettres mortes doit être configurée sur la file SQS ; une file de lettres mortes de fonction s'applique aux appels asynchrones." }
    c: { en: "A batch size of 1 avoids reprocessing but gives up the batch processing that the company must keep, and malformed messages are still retried indefinitely.", fr: "Une taille de lot de 1 évite le retraitement, mais abandonne le traitement par lots que l'entreprise doit conserver, et les messages mal formés sont toujours relancés indéfiniment." }
    e: { en: "A longer timeout does not help messages that fail because they are malformed, and the whole batch still returns on any failure.", fr: "Un délai d'expiration plus long n'aide pas les messages qui échouent parce qu'ils sont mal formés, et tout le lot revient toujours en cas d'échec." }
references:
  - title: Handling errors for an SQS event source in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-errorhandling.html
  - title: Using dead-letter queues in Amazon SQS
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
