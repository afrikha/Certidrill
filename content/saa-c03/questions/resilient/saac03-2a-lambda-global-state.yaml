id: saac03-2a-lambda-global-state
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An AWS Lambda function processes orders and keeps a running count of the orders processed each day in a global variable. A second function reads the count at midnight to build a daily report. Under heavy load, the reported totals are too low, and the count sometimes starts again from zero during the day. The company needs an accurate daily count with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite des commandes et tient dans une variable globale le compte des commandes traitées chaque jour. Une seconde fonction lit ce compte à minuit pour produire un rapport quotidien. Sous forte charge, les totaux du rapport sont trop faibles, et le compte repart parfois de zéro en cours de journée. L'entreprise a besoin d'un compte quotidien exact avec le MOINS d'effort.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the memory of the function so that its execution environment is kept for the whole day.", fr: "Augmenter la mémoire de la fonction afin que son environnement d'exécution soit conservé toute la journée." }
    - id: b
      text: { en: "Store the count in an Amazon DynamoDB item, and increment it in each invocation with an UpdateItem update expression.", fr: "Stocker le compte dans un élément Amazon DynamoDB, et l'incrémenter à chaque appel avec une expression de mise à jour UpdateItem." }
    - id: c
      text: { en: "Write the count to a file in the /tmp directory of the function, and read the file in each invocation.", fr: "Écrire le compte dans un fichier du répertoire /tmp de la fonction, et lire ce fichier à chaque appel." }
    - id: d
      text: { en: "Set the reserved concurrency of the function to 1 so that all invocations share one global variable.", fr: "Définir la simultanéité réservée de la fonction à 1 afin que tous les appels partagent une même variable globale." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Concurrent invocations run in separate execution environments, and Lambda terminates environments every few hours or after a failure, so state kept in memory or in /tmp is neither shared nor durable. Keeping the count in DynamoDB and incrementing it with UpdateItem (an atomic counter) makes the function stateless and gives one shared, persistent total.
    fr: |
      Les appels simultanés s'exécutent dans des environnements d'exécution distincts, et Lambda arrête les environnements toutes les quelques heures ou après une erreur : un état conservé en mémoire ou dans /tmp n'est ni partagé ni durable. Conserver le compte dans DynamoDB et l'incrémenter avec UpdateItem (compteur atomique) rend la fonction sans état et donne un total unique et persistant.
  options:
    a: { en: "Memory size does not control how long Lambda keeps an execution environment, and concurrent environments would still keep separate counts.", fr: "La taille mémoire ne détermine pas la durée de conservation d'un environnement d'exécution, et des environnements simultanés garderaient toujours des comptes séparés." }
    c: { en: "/tmp belongs to one execution environment, so each concurrent environment has its own file, and the file disappears when the environment is replaced.", fr: "/tmp appartient à un seul environnement d'exécution : chaque environnement simultané a son propre fichier, qui disparaît quand l'environnement est remplacé." }
    d: { en: "One environment at a time limits throughput and still loses the count when Lambda replaces the environment.", fr: "Un seul environnement à la fois limite le débit et perd toujours le compte quand Lambda remplace l'environnement." }
references:
  - title: Understanding the Lambda execution environment lifecycle
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-runtime-environment.html
  - title: Working with items and attributes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html
