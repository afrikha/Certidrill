id: saac03-2c-textract-claim-forms
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company receives scanned claim forms as PDF and image files. The company needs to extract the printed and handwritten values from the form fields and tables and load them into a database. The company does not want to build or train machine learning models.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance reçoit des formulaires de sinistre numérisés sous forme de fichiers PDF et d'images. L'entreprise doit extraire les valeurs imprimées et manuscrites des champs de formulaire et des tableaux, puis les charger dans une base de données. L'entreprise ne souhaite pas créer ni entraîner de modèles de machine learning.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use Amazon Rekognition text detection to read the words on each page and rebuild the form structure in custom code."
        fr: "Utiliser la détection de texte d'Amazon Rekognition pour lire les mots de chaque page et reconstruire la structure du formulaire dans du code personnalisé."
    - id: b
      text:
        en: "Use Amazon Textract document analysis with the forms and tables features to extract the fields and table cells."
        fr: "Utiliser l'analyse de documents d'Amazon Textract avec les fonctionnalités de formulaires et de tableaux pour extraire les champs et les cellules."
    - id: c
      text:
        en: "Use Amazon Comprehend entity detection on each file to extract the fields and table cells."
        fr: "Utiliser la détection d'entités d'Amazon Comprehend sur chaque fichier pour extraire les champs et les cellules."
    - id: d
      text:
        en: "Use Amazon SageMaker AI to train a custom document model that extracts the fields and table cells."
        fr: "Utiliser Amazon SageMaker AI pour entraîner un modèle de documents personnalisé qui extrait les champs et les cellules."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amazon Textract detects typed and handwritten text in images and PDF files, and its document analysis extracts structured data from forms and tables. It is a managed service with pretrained models, so no machine learning work is needed.
    fr: |
      Amazon Textract détecte le texte dactylographié et manuscrit dans les images et les fichiers PDF, et son analyse de documents extrait des données structurées des formulaires et des tableaux. C'est un service géré avec des modèles préentraînés : aucun travail de machine learning n'est nécessaire.
  options:
    a:
      en: |
        Rekognition can detect text in images, but it does not return form fields or table structure, so custom code would have to rebuild them.
      fr: |
        Rekognition peut détecter du texte dans des images, mais il ne renvoie ni les champs de formulaire ni la structure des tableaux : du code personnalisé devrait les reconstruire.
    c:
      en: |
        Comprehend finds entities in text that has already been extracted; it does not read form fields and tables from scanned pages.
      fr: |
        Comprehend trouve des entités dans un texte déjà extrait ; il ne lit pas les champs de formulaire et les tableaux de pages numérisées.
    d:
      en: |
        Training a custom model is exactly the machine learning work the company wants to avoid.
      fr: |
        Entraîner un modèle personnalisé correspond exactement au travail de machine learning que l'entreprise veut éviter.
references:
  - title: What is Amazon Textract?
    url: https://docs.aws.amazon.com/textract/latest/dg/what-is.html
