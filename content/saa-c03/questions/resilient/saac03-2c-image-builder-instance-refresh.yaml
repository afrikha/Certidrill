id: saac03-2c-image-builder-instance-refresh
objective: "2.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web fleet on Amazon EC2 instances in an Auto Scaling group. Each month, engineers connect to the running instances to install operating system patches, and the instances have drifted apart in configuration. The company wants to adopt immutable infrastructure: every change must be delivered as a new tested image, and running instances must never be modified.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute une flotte web sur des instances Amazon EC2 dans un groupe Auto Scaling. Chaque mois, des ingénieurs se connectent aux instances en cours d'exécution pour installer les correctifs du système d'exploitation, et la configuration des instances a fini par diverger. L'entreprise souhaite adopter une infrastructure immuable : chaque modification doit être livrée sous forme d'une nouvelle image testée, et les instances en cours d'exécution ne doivent jamais être modifiées.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Use a scheduled EC2 Image Builder pipeline to build and test a patched AMI, update the launch template, and start an instance refresh."
        fr: "Utiliser un pipeline EC2 Image Builder planifié pour créer et tester une AMI corrigée, mettre à jour le modèle de lancement et démarrer une actualisation des instances."
    - id: b
      text:
        en: "Use AWS Systems Manager Patch Manager with a maintenance window to patch the running instances each month."
        fr: "Utiliser AWS Systems Manager Patch Manager avec une fenêtre de maintenance pour corriger chaque mois les instances en cours d'exécution."
    - id: c
      text:
        en: "Use AWS Systems Manager Run Command to run the patch script on all running instances at the same time."
        fr: "Utiliser AWS Systems Manager Run Command pour exécuter le script de correctifs sur toutes les instances en cours d'exécution en même temps."
    - id: d
      text:
        en: "Patch one instance by hand each month, create an AMI from it, and terminate the other instances one at a time."
        fr: "Corriger manuellement une instance chaque mois, créer une AMI à partir de celle-ci, et résilier les autres instances une par une."
answer: { optionId: a }
explanation:
  correct:
    en: |
      EC2 Image Builder rebuilds the image from an updated base on a schedule, runs test components, and distributes the AMI only if the tests pass, instead of patching running servers. An instance refresh then replaces the instances of the Auto Scaling group in a rolling fashion with instances launched from the new launch template version.
    fr: |
      EC2 Image Builder reconstruit l'image à partir d'une base à jour selon une planification, exécute des composants de test et ne distribue l'AMI que si les tests réussissent, au lieu de corriger les serveurs en cours d'exécution. Une actualisation des instances remplace ensuite progressivement les instances du groupe Auto Scaling par des instances lancées à partir de la nouvelle version du modèle de lancement.
  options:
    b:
      en: |
        Patch Manager modifies the running instances in place, which is the opposite of immutable infrastructure.
      fr: |
        Patch Manager modifie les instances en cours d'exécution sur place, ce qui est l'inverse d'une infrastructure immuable.
    c:
      en: |
        Run Command also changes the running instances in place, and running it on all instances at once risks an outage.
      fr: |
        Run Command modifie aussi les instances en cours d'exécution sur place, et l'exécuter sur toutes les instances à la fois risque de provoquer une interruption.
    d:
      en: |
        The image is built from a hand-modified instance, is not tested automatically, and the replacement is manual, so the operational overhead is high.
      fr: |
        L'image est créée à partir d'une instance modifiée à la main, n'est pas testée automatiquement, et le remplacement est manuel : la charge opérationnelle est élevée.
references:
  - title: What is Image Builder?
    url: https://docs.aws.amazon.com/imagebuilder/latest/userguide/what-is-image-builder.html
  - title: Use an instance refresh to update instances in an Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/asg-instance-refresh.html
