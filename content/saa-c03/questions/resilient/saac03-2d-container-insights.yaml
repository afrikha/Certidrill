id: saac03-2d-container-insights
objective: "2.2.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs about 30 microservices on Amazon ECS with AWS Fargate. When a service degrades, the operations team needs CPU and memory utilization at the cluster, service, and task levels, together with diagnostic information such as container restart failures, to find the failing service quickly.

    The solution must not require any change to the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une trentaine de microservices sur Amazon ECS avec AWS Fargate. Lorsqu'un service se dégrade, l'équipe des opérations a besoin de l'utilisation du processeur et de la mémoire au niveau du cluster, du service et de la tâche, ainsi que d'informations de diagnostic comme les échecs de redémarrage de conteneurs, pour trouver rapidement le service défaillant.

    La solution ne doit exiger aucune modification du code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Enable Amazon CloudWatch Container Insights on the ECS cluster.", fr: "Activer Amazon CloudWatch Container Insights sur le cluster ECS." } }
    - { id: b, text: { en: "Instrument each microservice with the AWS X-Ray SDK and review the X-Ray service map.", fr: "Instrumenter chaque microservice avec le kit SDK AWS X-Ray et consulter la cartographie des services X-Ray." } }
    - { id: c, text: { en: "Create an AWS CloudTrail trail that records all Amazon ECS API calls in the account.", fr: "Créer un journal de suivi AWS CloudTrail qui enregistre tous les appels d'API Amazon ECS du compte." } }
    - { id: d, text: { en: "Enable VPC Flow Logs on the elastic network interfaces of the tasks.", fr: "Activer les journaux de flux VPC sur les interfaces réseau Elastic des tâches." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Container Insights collects performance data from ECS (including Fargate) and EKS and aggregates CPU, memory, disk, and network metrics at the cluster, service, and task levels. It also adds diagnostic information such as container restart failures. It is turned on as a cluster setting, with no code change.
    fr: |
      Container Insights collecte les données de performances d'ECS (y compris Fargate) et d'EKS, et agrège les métriques de processeur, de mémoire, de disque et de réseau au niveau du cluster, du service et de la tâche. Il ajoute aussi des informations de diagnostic comme les échecs de redémarrage de conteneurs. Il s'active par un paramètre du cluster, sans modification du code.
  options:
    b: { en: "Instrumenting with the X-Ray SDK changes the application code, and traces show request latency, not CPU and memory utilization per task.", fr: "L'instrumentation avec le kit SDK X-Ray modifie le code de l'application, et les traces montrent la latence des requêtes, pas l'utilisation du processeur et de la mémoire par tâche." }
    c: { en: "CloudTrail records API activity (who changed what), not resource utilization or container health.", fr: "CloudTrail enregistre l'activité des API (qui a modifié quoi), pas l'utilisation des ressources ni l'état des conteneurs." }
    d: { en: "Flow logs record network traffic metadata only; they contain no CPU, memory, or restart data.", fr: "Les journaux de flux n'enregistrent que des métadonnées de trafic réseau ; ils ne contiennent aucune donnée de processeur, de mémoire ou de redémarrage." }
references:
  - title: Container Insights
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/ContainerInsights.html
