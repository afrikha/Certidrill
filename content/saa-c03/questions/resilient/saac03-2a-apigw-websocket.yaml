id: saac03-2a-apigw-websocket
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An online gaming company is building a live leaderboard. Each player's browser must keep a persistent connection, and the backend must push score updates to connected players as soon as scores change, without the browsers polling for updates. The backend logic runs on AWS Lambda, and the company wants a fully managed API service.

    Which solution will meet these requirements?
  fr: |
    Une société de jeux en ligne crée un classement en direct. Le navigateur de chaque joueur doit garder une connexion persistante, et le backend doit envoyer les mises à jour des scores aux joueurs connectés dès que les scores changent, sans que les navigateurs interrogent le serveur. La logique du backend s'exécute sur AWS Lambda, et l'entreprise souhaite un service d'API entièrement géré.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an API Gateway WebSocket API whose routes invoke Lambda functions, and push updates over the open client connections.", fr: "Créer une API WebSocket API Gateway dont les routes appellent des fonctions Lambda, et envoyer les mises à jour sur les connexions ouvertes des clients." }
    - id: b
      text: { en: "Create an API Gateway REST API with caching enabled, and have each browser request the leaderboard every second.", fr: "Créer une API REST API Gateway avec la mise en cache activée, et faire en sorte que chaque navigateur demande le classement toutes les secondes." }
    - id: c
      text: { en: "Create an API Gateway HTTP API with a Lambda integration that returns the latest scores on each client request.", fr: "Créer une API HTTP API Gateway avec une intégration Lambda qui renvoie les derniers scores à chaque requête du client." }
    - id: d
      text: { en: "Create an Amazon SQS queue for each player, and have each browser long poll its queue for new scores.", fr: "Créer une file d'attente Amazon SQS par joueur, et faire en sorte que chaque navigateur interroge sa file d'attente par interrogation longue (long polling)." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An API Gateway WebSocket API maintains bidirectional connections, so the backend can send data to connected clients without any client request. It is the managed API Gateway option for chat, collaboration, multiplayer games and live dashboards, and its routes integrate with Lambda.
    fr: |
      Une API WebSocket API Gateway maintient des connexions bidirectionnelles : le backend peut envoyer des données aux clients connectés sans requête de leur part. C'est l'option gérée d'API Gateway pour les messageries instantanées, la collaboration, les jeux multijoueurs et les tableaux de bord en direct, et ses routes s'intègrent à Lambda.
  options:
    b:
      en: |
        Requesting the leaderboard every second is polling, which the requirements exclude, even if caching lowers the backend load.
      fr: |
        Demander le classement toutes les secondes revient à interroger le serveur, ce que les exigences excluent, même si la mise en cache réduit la charge du backend.
    c:
      en: |
        HTTP APIs are request-response only; the server cannot push an update until the client sends another request.
      fr: |
        Les API HTTP fonctionnent uniquement en requête-réponse ; le serveur ne peut pas envoyer de mise à jour tant que le client n'envoie pas une nouvelle requête.
    d:
      en: |
        Long polling is still polling, and one queue per player is not an API service that browsers can use directly.
      fr: |
        L'interrogation longue reste une interrogation, et une file d'attente par joueur n'est pas un service d'API que les navigateurs peuvent utiliser directement.
references:
  - title: API Gateway WebSocket APIs
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-websocket-api.html
