id: saac03-2c-rpo-rto-definitions
objective: "2.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's business continuity plan states that, after a disruption, its order application must be available again within 2 hours. The plan also states that no more than 15 minutes of order data can be lost. A solutions architect must translate these statements into recovery objectives for the disaster recovery design.

    Which statement correctly describes the objectives and their consequence?
  fr: |
    Le plan de continuité d'activité d'une entreprise indique qu'après une interruption, son application de commandes doit être de nouveau disponible en 2 heures. Le plan indique aussi qu'au plus 15 minutes de données de commandes peuvent être perdues. Un architecte de solutions doit traduire ces exigences en objectifs de récupération pour la conception de la reprise après sinistre.

    Quelle affirmation décrit correctement les objectifs et leur conséquence ?
body:
  options:
    - id: a
      text:
        en: "The RPO is 2 hours and the RTO is 15 minutes, so the application must be restored within 15 minutes."
        fr: "Le RPO est de 2 heures et le RTO de 15 minutes : l'application doit être restaurée en 15 minutes."
    - id: b
      text:
        en: "The RTO is 2 hours and the RPO is 2 hours, so a backup taken every hour is sufficient."
        fr: "Le RTO est de 2 heures et le RPO de 2 heures : une sauvegarde toutes les heures suffit."
    - id: c
      text:
        en: "The RTO is 2 hours and the RPO is 15 minutes, so recovery points must be created at least every 15 minutes."
        fr: "Le RTO est de 2 heures et le RPO de 15 minutes : des points de récupération doivent être créés au moins toutes les 15 minutes."
    - id: d
      text:
        en: "The RTO is 2 hours and the RPO is 15 minutes, so the recovery site must run at full production capacity at all times."
        fr: "Le RTO est de 2 heures et le RPO de 15 minutes : le site de reprise doit fonctionner à pleine capacité de production en permanence."
answer: { optionId: c }
explanation:
  correct:
    en: |
      The recovery time objective (RTO) is the maximum acceptable delay between the interruption and the restoration of service: 2 hours. The recovery point objective (RPO) is the maximum acceptable time since the last recovery point, which defines the acceptable data loss: 15 minutes, so data must be backed up or replicated at least that often.
    fr: |
      L'objectif de temps de récupération (RTO) est le délai maximal acceptable entre l'interruption et le rétablissement du service : 2 heures. L'objectif de point de récupération (RPO) est le temps maximal acceptable depuis le dernier point de récupération, qui définit la perte de données acceptable : 15 minutes, donc les données doivent être sauvegardées ou répliquées au moins aussi souvent.
  options:
    a:
      en: |
        The two objectives are inverted: the time to restore service is the RTO (2 hours), and the acceptable data loss is the RPO (15 minutes).
      fr: |
        Les deux objectifs sont inversés : le délai de rétablissement du service est le RTO (2 heures), et la perte de données acceptable est le RPO (15 minutes).
    b:
      en: |
        The acceptable data loss is 15 minutes, not 2 hours; hourly backups could lose up to an hour of orders.
      fr: |
        La perte de données acceptable est de 15 minutes, pas de 2 heures ; des sauvegardes horaires pourraient faire perdre jusqu'à une heure de commandes.
    d:
      en: |
        A 2-hour RTO does not require a full-capacity recovery site; that level (multi-site active/active) targets a near-zero RTO and costs far more.
      fr: |
        Un RTO de 2 heures n'impose pas un site de reprise à pleine capacité ; ce niveau (multisite actif/actif) vise un RTO proche de zéro et coûte bien plus cher.
references:
  - title: Business Continuity Plan (BCP)
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/business-continuity-plan-bcp.html
