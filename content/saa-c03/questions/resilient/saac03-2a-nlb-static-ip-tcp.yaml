id: saac03-2a-nlb-static-ip-tcp
objective: "2.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading company runs an application that uses a proprietary TCP protocol on Amazon EC2 instances in two Availability Zones of one AWS Region. Its clients allow outbound traffic only to a fixed list of IP addresses. The load balancer must handle millions of requests per second with very low latency, and the application must see the original client IP addresses.

    Which solution will meet these requirements?
  fr: |
    Une société de trading exécute une application qui utilise un protocole TCP propriétaire sur des instances Amazon EC2 dans deux zones de disponibilité d'une Région AWS. Ses clients n'autorisent le trafic sortant que vers une liste fixe d'adresses IP. L'équilibreur de charge doit traiter des millions de requêtes par seconde avec une latence très faible, et l'application doit voir les adresses IP d'origine des clients.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a Network Load Balancer with a TCP listener, associate an Elastic IP address with each subnet, and register the instances by instance ID.", fr: "Créer un Network Load Balancer avec un écouteur TCP, associer une adresse IP Elastic à chaque sous-réseau, et enregistrer les instances par ID d'instance." }
    - id: b
      text: { en: "Create an Application Load Balancer with an HTTPS listener, and read the client addresses from the X-Forwarded-For header.", fr: "Créer un Application Load Balancer avec un écouteur HTTPS, et lire les adresses des clients dans l'en-tête X-Forwarded-For." }
    - id: c
      text: { en: "Create an Amazon CloudFront distribution with the instances as a custom origin, and publish the CloudFront IP ranges to the clients.", fr: "Créer une distribution Amazon CloudFront avec les instances comme origine personnalisée, et publier les plages d'adresses IP CloudFront auprès des clients." }
    - id: d
      text: { en: "Create a Gateway Load Balancer, and register the instances in a target group that uses the GENEVE protocol.", fr: "Créer un Gateway Load Balancer, et enregistrer les instances dans un groupe cible qui utilise le protocole GENEVE." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A Network Load Balancer works at layer 4, supports TCP, and handles millions of requests per second. It has a static IP address in each enabled Availability Zone, and an internet-facing NLB can use one Elastic IP address per subnet; with instance targets, the client IP address is preserved.
    fr: |
      Un Network Load Balancer fonctionne en couche 4, prend en charge TCP et traite des millions de requêtes par seconde. Il dispose d'une adresse IP statique dans chaque zone de disponibilité activée, et un NLB accessible sur Internet peut utiliser une adresse IP Elastic par sous-réseau ; avec des cibles de type instance, l'adresse IP du client est préservée.
  options:
    b: { en: "An Application Load Balancer handles only HTTP and HTTPS, so it cannot carry a proprietary TCP protocol, and its IP addresses are not static.", fr: "Un Application Load Balancer ne gère que HTTP et HTTPS : il ne peut pas transporter un protocole TCP propriétaire, et ses adresses IP ne sont pas statiques." }
    c: { en: "CloudFront serves HTTP and HTTPS traffic, not a proprietary TCP protocol, and its IP ranges are large and change over time.", fr: "CloudFront sert du trafic HTTP et HTTPS, pas un protocole TCP propriétaire, et ses plages d'adresses IP sont vastes et évoluent." }
    d: { en: "A Gateway Load Balancer sends traffic to inspection appliances over GENEVE; it is not a front end for client connections to an application.", fr: "Un Gateway Load Balancer envoie le trafic vers des appliances d'inspection via GENEVE ; ce n'est pas un point d'entrée pour les connexions des clients à une application." }
references:
  - title: What is a Network Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
