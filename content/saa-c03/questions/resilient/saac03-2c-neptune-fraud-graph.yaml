id: saac03-2c-neptune-fraud-graph
objective: "2.1.23"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company wants to detect fraud rings by analyzing the relationships between customer accounts, devices, payment cards, and IP addresses. Investigators run queries that follow several levels of connections, such as finding every account that shares a device with an account that was flagged. The company wants a fully managed database that is purpose-built for this type of query.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers souhaite détecter des réseaux de fraude en analysant les relations entre les comptes clients, les appareils, les cartes de paiement et les adresses IP. Les enquêteurs exécutent des requêtes qui suivent plusieurs niveaux de connexions, par exemple pour trouver tous les comptes qui partagent un appareil avec un compte signalé. L'entreprise souhaite une base de données entièrement gérée, conçue spécifiquement pour ce type de requête.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Store the data in Amazon DynamoDB tables and run Scan operations to follow the connections between items."
        fr: "Stocker les données dans des tables Amazon DynamoDB et exécuter des opérations Scan pour suivre les connexions entre les éléments."
    - id: b
      text:
        en: "Store the data in Amazon RDS for PostgreSQL and use recursive SQL joins to follow the connections."
        fr: "Stocker les données dans Amazon RDS for PostgreSQL et utiliser des jointures SQL récursives pour suivre les connexions."
    - id: c
      text:
        en: "Store the data in Amazon Neptune and query the relationships with Gremlin or openCypher."
        fr: "Stocker les données dans Amazon Neptune et interroger les relations avec Gremlin ou openCypher."
    - id: d
      text:
        en: "Store the data in Amazon Redshift and run analytical SQL queries to follow the connections."
        fr: "Stocker les données dans Amazon Redshift et exécuter des requêtes SQL analytiques pour suivre les connexions."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Amazon Neptune is a fully managed graph database whose engine is built to store billions of relationships and traverse them with millisecond latency. Fraud detection is one of its documented use cases, and multi-hop queries are written in Gremlin or openCypher (property graph) or SPARQL (RDF).
    fr: |
      Amazon Neptune est une base de données orientée graphe entièrement gérée, dont le moteur est conçu pour stocker des milliards de relations et les parcourir avec une latence de l'ordre de la milliseconde. La détection de fraude fait partie de ses cas d'utilisation documentés, et les requêtes à plusieurs sauts s'écrivent en Gremlin ou openCypher (graphe de propriétés) ou en SPARQL (RDF).
  options:
    a:
      en: |
        DynamoDB is a key-value and document database with no join operator; following connections with Scan operations reads whole tables and is slow and expensive.
      fr: |
        DynamoDB est une base clé-valeur et document sans opérateur de jointure ; suivre des connexions avec des opérations Scan lit des tables entières, ce qui est lent et coûteux.
    b:
      en: |
        Recursive joins can work on small data sets, but a relational engine is not purpose-built for deep relationship traversals, which become slower as the number of hops grows.
      fr: |
        Les jointures récursives peuvent fonctionner sur de petits jeux de données, mais un moteur relationnel n'est pas conçu pour les parcours de relations profonds, qui ralentissent à mesure que le nombre de sauts augmente.
    d:
      en: |
        Redshift is a data warehouse for analytical aggregations over large tables, not a graph engine for interactive multi-hop relationship queries.
      fr: |
        Redshift est un entrepôt de données destiné aux agrégations analytiques sur de grandes tables, pas un moteur de graphe pour des requêtes interactives de relations à plusieurs sauts.
references:
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
