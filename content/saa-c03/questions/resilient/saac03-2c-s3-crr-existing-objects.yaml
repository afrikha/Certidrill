id: saac03-2c-s3-crr-existing-objects
objective: "2.2.11"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company has an Amazon S3 bucket in eu-west-1 that already contains 50 TB of objects. S3 Versioning is not enabled on the bucket. A new compliance rule requires a copy of all existing objects and all future objects in a bucket in eu-central-1.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise dispose d'un compartiment Amazon S3 dans eu-west-1 qui contient déjà 50 To d'objets. La gestion des versions S3 (S3 Versioning) n'est pas activée sur le compartiment. Une nouvelle règle de conformité exige une copie de tous les objets existants et de tous les objets futurs dans un compartiment situé dans eu-central-1.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable S3 Versioning on both buckets and create a replication rule from the source bucket to the destination bucket."
        fr: "Activer S3 Versioning sur les deux compartiments et créer une règle de réplication du compartiment source vers le compartiment de destination."
    - id: b
      text:
        en: "Create an S3 Lifecycle rule on the source bucket that transitions the objects to the destination bucket."
        fr: "Créer une règle S3 Lifecycle sur le compartiment source qui fait passer les objets vers le compartiment de destination."
    - id: c
      text:
        en: "Enable S3 Transfer Acceleration on the source bucket so that objects are copied to eu-central-1."
        fr: "Activer S3 Transfer Acceleration sur le compartiment source afin que les objets soient copiés vers eu-central-1."
    - id: d
      text:
        en: "Run an S3 Batch Replication job to replicate the objects that existed before the replication rule was created."
        fr: "Exécuter une tâche S3 Batch Replication pour répliquer les objets qui existaient avant la création de la règle de réplication."
    - id: e
      text:
        en: "Enable S3 Object Lock in governance mode on the destination bucket."
        fr: "Activer S3 Object Lock en mode gouvernance sur le compartiment de destination."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Live replication requires S3 Versioning on both the source and the destination buckets, and it automatically replicates new objects after the rule is in place. Objects that existed before the configuration are not replicated by live replication; S3 Batch Replication replicates them on demand as a Batch Operations job.
    fr: |
      La réplication en continu exige S3 Versioning sur les compartiments source et de destination, et elle réplique automatiquement les nouveaux objets une fois la règle en place. Les objets existant avant la configuration ne sont pas répliqués par la réplication en continu ; S3 Batch Replication les réplique à la demande sous forme de tâche Batch Operations.
  options:
    b:
      en: |
        Lifecycle rules transition objects between storage classes or expire them in the same bucket; they cannot copy objects to another bucket.
      fr: |
        Les règles Lifecycle font passer les objets d'une classe de stockage à une autre ou les font expirer dans le même compartiment ; elles ne copient pas d'objets vers un autre compartiment.
    c:
      en: |
        Transfer Acceleration speeds up client uploads over long distances; it does not copy objects between buckets.
      fr: |
        Transfer Acceleration accélère les chargements des clients sur de longues distances ; il ne copie pas d'objets entre compartiments.
    e:
      en: |
        Object Lock protects object versions from deletion or overwrite; it does not copy anything to the bucket.
      fr: |
        Object Lock protège les versions d'objets contre la suppression ou l'écrasement ; il ne copie rien vers le compartiment.
references:
  - title: Requirements and considerations for replication
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-requirements.html
  - title: Replicating existing objects with Batch Replication
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-batch-replication-batch.html
