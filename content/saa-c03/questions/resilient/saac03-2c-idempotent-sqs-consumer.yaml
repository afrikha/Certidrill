id: saac03-2c-idempotent-sqs-consumer
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An order service sends payment requests to an Amazon SQS standard queue. An AWS Lambda function consumes the messages and charges the customers' cards. Auditors found rare duplicate charges that occurred when the same message was processed twice. The company wants to keep the standard queue and must ensure that a payment is never charged twice.

    Which solution will meet these requirements?
  fr: |
    Un service de commandes envoie des demandes de paiement à une file d'attente Amazon SQS standard. Une fonction AWS Lambda consomme les messages et débite les cartes des clients. Les auditeurs ont constaté de rares doubles débits, survenus lorsque le même message a été traité deux fois. L'entreprise souhaite conserver la file d'attente standard et doit garantir qu'un paiement n'est jamais débité deux fois.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Make the consumer idempotent by recording each payment ID in DynamoDB with a conditional write and skipping IDs that already exist."
        fr: "Rendre le consommateur idempotent en enregistrant chaque ID de paiement dans DynamoDB avec une écriture conditionnelle et en ignorant les ID déjà présents."
    - id: b
      text:
        en: "Increase the visibility timeout of the queue to 12 hours so that a message cannot be received twice."
        fr: "Porter le délai de visibilité de la file d'attente à 12 heures afin qu'un message ne puisse pas être reçu deux fois."
    - id: c
      text:
        en: "Enable long polling on the queue by setting the receive message wait time to 20 seconds."
        fr: "Activer l'attente active de longue durée (long polling) sur la file en fixant le temps d'attente de réception des messages à 20 secondes."
    - id: d
      text:
        en: "Configure a dead-letter queue with a maximum receive count of 1 for the payment queue."
        fr: "Configurer une file d'attente de lettres mortes avec un nombre maximal de réceptions de 1 pour la file des paiements."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Standard queues provide at-least-once delivery: on rare occasions a copy of a message is delivered again, so AWS recommends designing consumers to be idempotent. A conditional write on the payment ID lets the function detect a message it already processed and skip the second charge.
    fr: |
      Les files d'attente standard offrent une livraison au moins une fois : en de rares occasions, une copie d'un message est de nouveau livrée, et AWS recommande donc de concevoir des consommateurs idempotents. Une écriture conditionnelle sur l'ID de paiement permet à la fonction de détecter un message déjà traité et d'éviter le second débit.
  options:
    b:
      en: |
        The visibility timeout only hides a message while it is being processed; it does not prevent the duplicate copies that at-least-once delivery can produce.
      fr: |
        Le délai de visibilité masque seulement un message pendant son traitement ; il n'empêche pas les copies en double que la livraison au moins une fois peut produire.
    c:
      en: |
        Long polling reduces empty responses and cost; it has no effect on duplicate deliveries.
      fr: |
        L'attente active de longue durée réduit les réponses vides et le coût ; elle n'a aucun effet sur les livraisons en double.
    d:
      en: |
        A dead-letter queue isolates messages that fail repeatedly; a duplicate that is processed successfully never reaches it.
      fr: |
        Une file d'attente de lettres mortes isole les messages qui échouent de manière répétée ; un doublon traité avec succès ne l'atteint jamais.
references:
  - title: Amazon SQS at-least-once delivery
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/standard-queues-at-least-once-delivery.html
