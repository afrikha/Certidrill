id: saac03-2c-ecr-immutable-lambda-versions
objective: "2.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company deploys container images from Amazon ECR to Amazon ECS and also runs AWS Lambda functions. In a recent incident, a team pushed a new image with the tag v1.4.2, which production was already using, and the tag silently pointed to different code. In another incident, an event source invoked a function through its unqualified ARN, and a developer had edited the function code directly. The company wants every deployed artifact reference to always point to the same code.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise déploie des images de conteneur d'Amazon ECR vers Amazon ECS et exécute aussi des fonctions AWS Lambda. Lors d'un récent incident, une équipe a poussé une nouvelle image avec la balise v1.4.2, déjà utilisée en production, et la balise a pointé sans avertissement vers un code différent. Lors d'un autre incident, une source d'événements a appelé une fonction via son ARN non qualifié, alors qu'un développeur avait modifié directement le code de la fonction. L'entreprise souhaite que chaque référence d'artefact déployé pointe toujours vers le même code.

    Quelle combinaison d'actions permet de répondre à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Turn on image scanning on push for the ECR repository."
        fr: "Activer l'analyse des images lors de l'envoi (scan on push) pour le référentiel ECR."
    - id: b
      text:
        en: "Add an ECR lifecycle policy that expires untagged images after one day."
        fr: "Ajouter une politique de cycle de vie ECR qui fait expirer les images sans balise après un jour."
    - id: c
      text:
        en: "Set the tag mutability of the ECR repository to IMMUTABLE."
        fr: "Définir la mutabilité des balises du référentiel ECR sur IMMUTABLE."
    - id: d
      text:
        en: "Configure reserved concurrency on each Lambda function."
        fr: "Configurer une concurrence réservée sur chaque fonction Lambda."
    - id: e
      text:
        en: "Publish a Lambda version for each release and invoke the function through an alias that points to that version."
        fr: "Publier une version Lambda pour chaque livraison et appeler la fonction via un alias qui pointe vers cette version."
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      With tag immutability turned on, pushing an image with a tag that already exists fails with ImageTagAlreadyExistsException, so v1.4.2 always identifies the same image. A published Lambda version is immutable (code and most settings cannot change), whereas the unqualified ARN runs the editable $LATEST; an alias pointing to a published version gives a stable reference.
    fr: |
      Avec l'immuabilité des balises activée, l'envoi d'une image avec une balise existante échoue avec ImageTagAlreadyExistsException : v1.4.2 désigne toujours la même image. Une version Lambda publiée est immuable (le code et la plupart des paramètres ne peuvent plus changer), alors que l'ARN non qualifié exécute $LATEST, modifiable ; un alias qui pointe vers une version publiée fournit une référence stable.
  options:
    a:
      en: |
        Image scanning looks for software vulnerabilities; it does not stop a tag from being overwritten.
      fr: |
        L'analyse des images recherche des vulnérabilités logicielles ; elle n'empêche pas l'écrasement d'une balise.
    b:
      en: |
        A lifecycle policy cleans up old images; the overwritten tag would still point to the new image.
      fr: |
        Une politique de cycle de vie nettoie les anciennes images ; la balise écrasée pointerait toujours vers la nouvelle image.
    d:
      en: |
        Reserved concurrency controls how many instances of a function can run; it does not freeze the function code.
      fr: |
        La concurrence réservée contrôle le nombre d'instances d'une fonction qui peuvent s'exécuter ; elle ne fige pas le code de la fonction.
references:
  - title: Preventing image tags from being overwritten in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/image-tag-mutability.html
  - title: Manage Lambda Event Function versions
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-versions.html
