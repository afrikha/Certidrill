id: saac03-2c-dynamodb-elasticache-pair
objective: "2.1.23"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A gaming company is building a new backend. The player profile store must handle millions of requests per second at peak with consistent single-digit millisecond latency, and the company does not want to manage servers. A separate reporting service runs the same expensive read queries against an Amazon RDS for MySQL DB instance many times each minute. The company wants to keep the results of these queries in memory so that repeated requests do not reach the database.

    Which combination of solutions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société de jeux vidéo développe un nouveau backend. Le magasin des profils de joueurs doit traiter des millions de requêtes par seconde en pointe avec une latence constante de l'ordre de quelques millisecondes, et l'entreprise ne souhaite pas gérer de serveurs. Un service de rapports distinct exécute les mêmes requêtes de lecture coûteuses sur une instance de base de données Amazon RDS for MySQL plusieurs fois par minute. L'entreprise souhaite conserver les résultats de ces requêtes en mémoire afin que les requêtes répétées n'atteignent pas la base de données.

    Quelle combinaison de solutions permet de répondre à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Store the player profiles in an Amazon Redshift Serverless workgroup."
        fr: "Stocker les profils de joueurs dans un groupe de travail Amazon Redshift Serverless."
    - id: b
      text:
        en: "Store the player profiles in an Amazon DynamoDB table that uses on-demand capacity mode."
        fr: "Stocker les profils de joueurs dans une table Amazon DynamoDB qui utilise le mode de capacité à la demande."
    - id: c
      text:
        en: "Store the player profiles in an Amazon Neptune DB cluster."
        fr: "Stocker les profils de joueurs dans un cluster de base de données Amazon Neptune."
    - id: d
      text:
        en: "Add an Amazon ElastiCache cache in front of the RDS for MySQL DB instance and cache the reporting query results."
        fr: "Ajouter un cache Amazon ElastiCache devant l'instance de base de données RDS for MySQL et y mettre en cache les résultats des requêtes de rapport."
    - id: e
      text:
        en: "Create an RDS read replica and point the reporting service to the replica endpoint."
        fr: "Créer un réplica en lecture RDS et diriger le service de rapports vers le point de terminaison du réplica."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      DynamoDB is a serverless key-value and document database designed for single-digit millisecond performance at any scale, and on-demand mode scales with traffic without capacity planning. ElastiCache is a managed in-memory cache: the reporting service reads cached results from memory and only goes to MySQL on a cache miss.
    fr: |
      DynamoDB est une base de données clé-valeur et document sans serveur conçue pour des performances de l'ordre de quelques millisecondes à n'importe quelle échelle, et le mode à la demande suit le trafic sans planification de capacité. ElastiCache est un cache en mémoire géré : le service de rapports lit les résultats en mémoire et n'interroge MySQL qu'en cas d'absence dans le cache.
  options:
    a:
      en: |
        Redshift is a data warehouse for analytics, not an operational store for millions of single-item reads and writes per second at millisecond latency.
      fr: |
        Redshift est un entrepôt de données pour l'analytique, pas un magasin opérationnel pour des millions de lectures et d'écritures unitaires par seconde à une latence de quelques millisecondes.
    c:
      en: |
        Neptune is purpose-built for relationship traversals; simple profile lookups by key do not need a graph database, and Neptune is not designed for this request volume per key.
      fr: |
        Neptune est conçu pour parcourir des relations ; de simples lectures de profils par clé n'ont pas besoin d'une base orientée graphe, et Neptune n'est pas conçu pour ce volume de requêtes par clé.
    e:
      en: |
        A read replica offloads the primary, but every repeated query still runs on a database engine; it does not keep the results in memory as required.
      fr: |
        Un réplica en lecture décharge l'instance principale, mais chaque requête répétée s'exécute encore sur un moteur de base de données ; les résultats ne sont pas conservés en mémoire comme exigé.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: What is Amazon ElastiCache?
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html
