id: saac03-2c-alb-path-oidc-auth
objective: "2.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs two microservices on Amazon ECS behind one internet-facing Application Load Balancer that has an HTTPS listener. Requests to /orders/* must go to the orders service, and requests to /catalog/* must go to the catalog service. Employees must sign in through the company's OpenID Connect (OIDC) compliant identity provider before any request reaches the services. The company does not want to add authentication code to the services.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute deux microservices sur Amazon ECS derrière un seul Application Load Balancer accessible depuis Internet, doté d'un écouteur HTTPS. Les requêtes vers /orders/* doivent aller au service des commandes, et les requêtes vers /catalog/* au service du catalogue. Les employés doivent se connecter via le fournisseur d'identité de l'entreprise, conforme à OpenID Connect (OIDC), avant qu'une requête n'atteigne les services. L'entreprise ne souhaite pas ajouter de code d'authentification aux services.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez-en deux.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create listener rules with path-pattern conditions that forward /orders/* and /catalog/* to two separate target groups."
        fr: "Créer des règles d'écouteur avec des conditions path-pattern qui transfèrent /orders/* et /catalog/* vers deux groupes cibles distincts."
    - id: b
      text:
        en: "Replace the Application Load Balancer with a Network Load Balancer that has one TLS listener for each service."
        fr: "Remplacer l'Application Load Balancer par un Network Load Balancer doté d'un écouteur TLS pour chaque service."
    - id: c
      text:
        en: "Create listener rules with source-ip conditions that allow only the IP address range of the identity provider."
        fr: "Créer des règles d'écouteur avec des conditions source-ip qui n'autorisent que la plage d'adresses IP du fournisseur d'identité."
    - id: d
      text:
        en: "Add an authenticate-oidc action before the forward action in the HTTPS listener rules."
        fr: "Ajouter une action authenticate-oidc avant l'action forward dans les règles de l'écouteur HTTPS."
    - id: e
      text:
        en: "Place a Gateway Load Balancer in front of the Application Load Balancer to authenticate the requests."
        fr: "Placer un Gateway Load Balancer devant l'Application Load Balancer pour authentifier les requêtes."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Path-pattern conditions route requests by URL path (path-based routing) to different target groups. On an HTTPS listener, an authenticate-oidc action authenticates users with an OIDC-compliant identity provider before the forward action runs, so the services receive only authenticated requests without their own authentication code.
    fr: |
      Les conditions path-pattern routent les requêtes selon le chemin de l'URL (routage basé sur le chemin) vers des groupes cibles différents. Sur un écouteur HTTPS, une action authenticate-oidc authentifie les utilisateurs auprès d'un fournisseur d'identité conforme à OIDC avant l'action forward : les services ne reçoivent que des requêtes authentifiées, sans code d'authentification propre.
  options:
    b:
      en: |
        A Network Load Balancer works at layer 4: it cannot route by URL path or authenticate users.
      fr: |
        Un Network Load Balancer fonctionne à la couche 4 : il ne peut ni router selon le chemin de l'URL ni authentifier les utilisateurs.
    c:
      en: |
        Requests come from the employees' devices, not from the identity provider, and an IP filter is not a sign-in.
      fr: |
        Les requêtes proviennent des appareils des employés, pas du fournisseur d'identité, et un filtre IP n'est pas une authentification.
    e:
      en: |
        A Gateway Load Balancer distributes traffic to virtual network appliances such as firewalls; it does not authenticate users.
      fr: |
        Un Gateway Load Balancer distribue le trafic vers des appliances réseau virtuelles comme des pare-feu ; il n'authentifie pas les utilisateurs.
references:
  - title: Authenticate users using an Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
  - title: Condition types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-condition-types.html
