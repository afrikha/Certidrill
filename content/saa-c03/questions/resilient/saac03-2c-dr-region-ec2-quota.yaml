id: saac03-2c-dr-region-ec2-quota
objective: "2.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 On-Demand Instances that use 400 vCPUs in us-east-1. The company uses a pilot light disaster recovery strategy in us-west-2, where the account runs only a small database replica. During a recovery test, the Auto Scaling group in us-west-2 failed to launch most of its instances because the account exceeded its vCPU limit. The company must ensure that a failover can scale to full production capacity.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 à la demande qui utilisent 400 vCPU dans us-east-1. L'entreprise applique une stratégie de reprise après sinistre de type environnement de veille (pilot light) dans us-west-2, où le compte n'exécute qu'un petit réplica de base de données. Lors d'un test de reprise, le groupe Auto Scaling de us-west-2 n'a pas pu lancer la plupart de ses instances, car le compte a dépassé sa limite de vCPU. L'entreprise doit garantir qu'un basculement peut monter jusqu'à la pleine capacité de production.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Request an increase of the On-Demand Instances vCPU quota in us-east-1 so that it covers both Regions."
        fr: "Demander une augmentation du quota de vCPU des instances à la demande dans us-east-1 afin qu'il couvre les deux Régions."
    - id: b
      text:
        en: "Purchase a Compute Savings Plan that covers 400 vCPUs so that the capacity is available in any Region."
        fr: "Acheter un Compute Savings Plan qui couvre 400 vCPU afin que la capacité soit disponible dans n'importe quelle Région."
    - id: c
      text:
        en: "Request an increase of the On-Demand Instances vCPU quota in us-west-2 to cover full production capacity plus a buffer, and check quotas in each recovery test."
        fr: "Demander une augmentation du quota de vCPU des instances à la demande dans us-west-2 pour couvrir la pleine capacité de production plus une marge, et vérifier les quotas à chaque test de reprise."
    - id: d
      text:
        en: "Change the launch template in us-west-2 to use larger instance types so that fewer instances are needed."
        fr: "Modifier le modèle de lancement dans us-west-2 pour utiliser des types d'instances plus grands afin d'avoir besoin de moins d'instances."
answer: { optionId: c }
explanation:
  correct:
    en: |
      EC2 quotas such as the On-Demand vCPU quota apply per Region, so a recovery Region needs its own increase that covers the failover capacity. The Well-Architected Reliability Pillar recommends keeping a gap between quotas and maximum usage to accommodate failover and checking quotas in the failover location before failing over.
    fr: |
      Les quotas EC2 comme le quota de vCPU à la demande s'appliquent par Région : une Région de reprise a besoin de sa propre augmentation couvrant la capacité de basculement. Le pilier Fiabilité du Well-Architected Framework recommande de garder un écart entre les quotas et l'utilisation maximale pour absorber un basculement, et de vérifier les quotas dans l'emplacement de basculement avant de basculer.
  options:
    a:
      en: |
        This quota is Region-based; an increase in us-east-1 does not change the limit in us-west-2.
      fr: |
        Ce quota est régional ; une augmentation dans us-east-1 ne change pas la limite dans us-west-2.
    b:
      en: |
        Savings Plans are a pricing commitment; they do not raise service quotas or reserve capacity.
      fr: |
        Les Savings Plans sont un engagement tarifaire ; ils n'augmentent pas les quotas de service et ne réservent pas de capacité.
    d:
      en: |
        The quota counts vCPUs, so larger instances with the same total vCPUs hit the same limit.
      fr: |
        Le quota compte les vCPU : des instances plus grandes avec le même total de vCPU atteignent la même limite.
references:
  - title: REL01-BP06 Ensure that a sufficient gap exists between the current quotas and the maximum usage to accommodate failover
    url: https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/rel_manage_service_limits_suff_buffer_limits.html
  - title: What is Service Quotas?
    url: https://docs.aws.amazon.com/servicequotas/latest/userguide/intro.html
