id: saac03-2a-valkey-vs-memcached
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores user shopping carts in a cache so that its web tier stays stateless. The cart data uses hash data structures. The cached data must survive the failure of a cache node, and the cache must fail over automatically to another Availability Zone. The company wants a node-based cluster so that it can choose the node types.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke les paniers des utilisateurs dans un cache afin que son niveau web reste sans état. Les données des paniers utilisent des structures de type hachage (hash). Les données en cache doivent survivre à la défaillance d'un nœud de cache, et le cache doit basculer automatiquement vers une autre zone de disponibilité. L'entreprise veut un cluster basé sur des nœuds afin de pouvoir choisir les types de nœuds.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon ElastiCache for Memcached cluster with nodes spread across two Availability Zones in the Region.", fr: "Créer un cluster Amazon ElastiCache for Memcached avec des nœuds répartis sur deux zones de disponibilité de la Région." }
    - id: b
      text: { en: "Run open source cache software on EC2 instances in an Auto Scaling group that spans two Availability Zones.", fr: "Exécuter un logiciel de cache open source sur des instances EC2 dans un groupe Auto Scaling qui couvre deux zones de disponibilité." }
    - id: c
      text: { en: "Create a DynamoDB Accelerator (DAX) cluster with nodes in three Availability Zones, and write the carts through it.", fr: "Créer un cluster DynamoDB Accelerator (DAX) avec des nœuds dans trois zones de disponibilité, et écrire les paniers par son intermédiaire." }
    - id: d
      text: { en: "Create an Amazon ElastiCache for Valkey replication group with a replica in a second Availability Zone and Multi-AZ enabled.", fr: "Créer un groupe de réplication Amazon ElastiCache for Valkey avec un réplica dans une deuxième zone de disponibilité et Multi-AZ activé." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Node-based ElastiCache clusters for Valkey (or Redis OSS) support complex data types such as hashes, replication to read replicas, and automatic failover. With a replica in another Availability Zone and Multi-AZ enabled, ElastiCache promotes the replica when the primary node fails, so the cart data is preserved.
    fr: |
      Les clusters ElastiCache basés sur des nœuds pour Valkey (ou Redis OSS) prennent en charge des types de données complexes comme les hachages, la réplication vers des réplicas en lecture et le basculement automatique. Avec un réplica dans une autre zone de disponibilité et Multi-AZ activé, ElastiCache promeut le réplica en cas de défaillance du nœud principal : les données des paniers sont préservées.
  options:
    a: { en: "Node-based Memcached clusters have no replication and no automatic failover, and they support only simple data types; data on a failed node is lost.", fr: "Les clusters Memcached basés sur des nœuds n'offrent ni réplication ni basculement automatique, et ne prennent en charge que des types de données simples ; les données d'un nœud défaillant sont perdues." }
    b: { en: "A self-managed cache on EC2 provides no built-in replication or failover, and the company must operate and patch it.", fr: "Un cache autogéré sur EC2 n'offre ni réplication ni basculement intégrés, et l'entreprise doit l'exploiter et le corriger." }
    c: { en: "DAX is a read-through and write-through cache for DynamoDB tables only; it is not a general-purpose key-value store with hash data types.", fr: "DAX est un cache en lecture et en écriture réservé aux tables DynamoDB ; ce n'est pas un magasin clé-valeur généraliste avec des types de données de hachage." }
references:
  - title: Comparing node-based Valkey, Memcached, and Redis OSS clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html
