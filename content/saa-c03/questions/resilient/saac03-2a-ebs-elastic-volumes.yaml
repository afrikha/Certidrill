id: saac03-2a-ebs-elastic-volumes
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A database runs on an Amazon EC2 instance and stores its data on an Amazon EBS gp3 volume. The database needs more storage, more IOPS and more throughput. The company must make the change without stopping the instance or detaching the volume.

    Which solution will meet these requirements?
  fr: |
    Une base de données s'exécute sur une instance Amazon EC2 et stocke ses données sur un volume Amazon EBS gp3. La base de données a besoin de plus de stockage, d'IOPS et de débit. L'entreprise doit effectuer la modification sans arrêter l'instance ni détacher le volume.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a snapshot of the volume, create a larger volume from the snapshot, and swap the volumes on the instance.", fr: "Créer un instantané du volume, créer un volume plus grand à partir de l'instantané, et échanger les volumes sur l'instance." }
    - id: b
      text: { en: "Stop the instance, change it to a larger instance type, and start it again.", fr: "Arrêter l'instance, la passer à un type d'instance plus grand, et la redémarrer." }
    - id: c
      text: { en: "Add an instance store volume to the instance, and move the database files to it.", fr: "Ajouter un volume de stockage d'instance à l'instance, et y déplacer les fichiers de la base de données." }
    - id: d
      text: { en: "Modify the existing gp3 volume to increase its size, IOPS and throughput, and then extend the file system.", fr: "Modifier le volume gp3 existant pour augmenter sa taille, ses IOPS et son débit, puis étendre le système de fichiers." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Elastic Volumes lets you increase the size and adjust the IOPS and throughput of an attached EBS volume while the instance keeps running, on supported instances. After the size increase, the operating system's file system is extended to use the new space.
    fr: |
      Elastic Volumes permet d'augmenter la taille et d'ajuster les IOPS et le débit d'un volume EBS attaché pendant que l'instance continue de fonctionner, sur les instances prises en charge. Après l'augmentation de taille, le système de fichiers du système d'exploitation est étendu pour utiliser le nouvel espace.
  options:
    a: { en: "Swapping volumes requires detaching the old volume and interrupts the database, which the requirements forbid.", fr: "Échanger les volumes impose de détacher l'ancien volume et interrompt la base de données, ce que les exigences interdisent." }
    b: { en: "Changing the instance type requires stopping the instance, and it does not change the volume's storage, IOPS or throughput.", fr: "Changer de type d'instance impose d'arrêter l'instance, et cela ne change ni le stockage, ni les IOPS, ni le débit du volume." }
    c: { en: "Instance store is ephemeral and is lost when the instance stops; it cannot be added to a running instance either.", fr: "Le stockage d'instance est éphémère et perdu à l'arrêt de l'instance ; il ne peut pas non plus être ajouté à une instance en cours d'exécution." }
references:
  - title: Modify an Amazon EBS volume using Elastic Volumes operations
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html
