id: saac03-2a-vertical-instance-resize
objective: "2.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a licensed analytics server on a single EBS-backed Amazon EC2 instance of the m6i.xlarge type. The license covers exactly one server, and the software keeps its working state on the instance, so it cannot run on several instances. During monthly reporting, users receive out-of-memory errors. A short maintenance window is acceptable.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un serveur d'analyse sous licence sur une seule instance Amazon EC2 adossée à EBS de type m6i.xlarge. La licence couvre exactement un serveur, et le logiciel conserve son état de travail sur l'instance : il ne peut pas s'exécuter sur plusieurs instances. Pendant les rapports mensuels, les utilisateurs reçoivent des erreurs de mémoire insuffisante. Une courte fenêtre de maintenance est acceptable.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Stop the instance, change its instance type to a memory optimized type such as r6i.2xlarge, and start it again.", fr: "Arrêter l'instance, changer son type pour un type à mémoire optimisée comme r6i.2xlarge, puis la redémarrer." }
    - id: b
      text: { en: "Create an Auto Scaling group of three instances from an AMI of the server, and place it behind an Application Load Balancer.", fr: "Créer un groupe Auto Scaling de trois instances à partir d'une AMI du serveur, et le placer derrière un Application Load Balancer." }
    - id: c
      text: { en: "Create an Amazon CloudWatch alarm that recovers the instance automatically when a status check fails.", fr: "Créer une alarme Amazon CloudWatch qui récupère automatiquement l'instance quand une vérification d'état échoue." }
    - id: d
      text: { en: "Launch the instance in a cluster placement group to increase its network performance.", fr: "Lancer l'instance dans un groupe de placement de cluster pour augmenter ses performances réseau." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      When an application cannot be distributed across instances, it must scale vertically. For an EBS-backed instance, changing to a compatible, larger instance type (here a memory optimized R family type) requires stopping the instance, which fits the maintenance window, and gives the server more memory.
    fr: |
      Quand une application ne peut pas être répartie sur plusieurs instances, elle doit être mise à l'échelle verticalement. Pour une instance adossée à EBS, passer à un type d'instance compatible et plus grand (ici un type à mémoire optimisée de la famille R) impose d'arrêter l'instance, ce que permet la fenêtre de maintenance, et donne plus de mémoire au serveur.
  options:
    b: { en: "Horizontal scaling breaks the single-server license and the application's local state.", fr: "La mise à l'échelle horizontale enfreint la licence à serveur unique et casse l'état local de l'application." }
    c: { en: "Automatic recovery restores an impaired instance on new hardware but keeps the same instance type and memory.", fr: "La récupération automatique rétablit une instance défaillante sur un nouveau matériel, mais conserve le même type d'instance et la même mémoire." }
    d: { en: "A cluster placement group lowers latency between instances; it adds no memory to the server.", fr: "Un groupe de placement de cluster réduit la latence entre instances ; il n'ajoute aucune mémoire au serveur." }
references:
  - title: Amazon EC2 instance type changes
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-resize.html
