id: saac03-2d-rds-replica-lag
objective: "2.2.15"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A news website stores articles in an Amazon RDS for MySQL DB instance. Two read replicas serve the article pages. The editorial team requires that readers never see content that is more than 30 seconds older than the content on the primary DB instance.

    Which Amazon CloudWatch metric should a solutions architect monitor to detect when a read replica no longer meets this requirement?
  fr: |
    Un site d'actualités stocke ses articles dans une instance de base de données Amazon RDS for MySQL. Deux réplicas en lecture servent les pages d'articles. L'équipe éditoriale exige que les lecteurs ne voient jamais un contenu antérieur de plus de 30 secondes à celui de l'instance de base de données principale.

    Quelle métrique Amazon CloudWatch un architecte de solutions doit-il surveiller pour détecter qu'un réplica en lecture ne respecte plus cette exigence ?
body:
  options:
    - { id: a, text: "ReplicaLag" }
    - { id: b, text: "DatabaseConnections" }
    - { id: c, text: "ReadLatency" }
    - { id: d, text: "CPUUtilization" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      For read replica configurations, ReplicaLag reports in seconds how far a read replica lags behind its source DB instance. An alarm when ReplicaLag exceeds 30 seconds on a replica maps directly to the business requirement.
    fr: |
      Pour les configurations de réplicas en lecture, ReplicaLag indique en secondes le retard d'un réplica en lecture sur son instance de base de données source. Une alarme lorsque ReplicaLag dépasse 30 secondes sur un réplica correspond directement à l'exigence métier.
  options:
    b: { en: "This metric counts client network connections to the instance; it says nothing about how current the replica data is.", fr: "Cette métrique compte les connexions réseau des clients à l'instance ; elle n'indique rien sur la fraîcheur des données du réplica." }
    c: { en: "ReadLatency is the average time per disk I/O operation, not the replication delay.", fr: "ReadLatency est le temps moyen par opération d'E/S disque, pas le délai de réplication." }
    d: { en: "High CPU can be one cause of lag, but CPU utilization does not measure the lag itself.", fr: "Une forte utilisation du processeur peut être une cause de retard, mais elle ne mesure pas le retard lui-même." }
references:
  - title: Amazon CloudWatch metrics for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-metrics.html
