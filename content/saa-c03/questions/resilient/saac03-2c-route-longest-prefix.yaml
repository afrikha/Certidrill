id: saac03-2c-route-longest-prefix
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A subnet in a VPC is associated with the following route table.

    | Destination | Target |
    | --- | --- |
    | 10.0.0.0/16 | local |
    | 10.20.0.0/16 | pcx-0a1b2c3d (VPC peering connection) |
    | 10.20.8.0/24 | tgw-0e4f5a6b (transit gateway) |
    | 0.0.0.0/0 | nat-0c7d8e9f (NAT gateway) |

    An instance in the subnet sends traffic to 10.20.8.25 and to 10.20.3.7.

    How is this traffic routed?
  fr: |
    Un sous-réseau d'un VPC est associé à la table de routage suivante.

    | Destination | Cible |
    | --- | --- |
    | 10.0.0.0/16 | local |
    | 10.20.0.0/16 | pcx-0a1b2c3d (connexion d'appairage de VPC) |
    | 10.20.8.0/24 | tgw-0e4f5a6b (passerelle de transit) |
    | 0.0.0.0/0 | nat-0c7d8e9f (passerelle NAT) |

    Une instance du sous-réseau envoie du trafic vers 10.20.8.25 et vers 10.20.3.7.

    Comment ce trafic est-il routé ?
body:
  options:
    - id: a
      text:
        en: "Traffic to 10.20.8.25 goes to the transit gateway, and traffic to 10.20.3.7 goes to the VPC peering connection."
        fr: "Le trafic vers 10.20.8.25 passe par la passerelle de transit, et le trafic vers 10.20.3.7 par la connexion d'appairage de VPC."
    - id: b
      text:
        en: "Traffic to both addresses goes to the VPC peering connection, because its route covers both addresses."
        fr: "Le trafic vers les deux adresses passe par la connexion d'appairage de VPC, car sa route couvre les deux adresses."
    - id: c
      text:
        en: "Traffic to both addresses goes to the transit gateway, because transit gateway routes take priority over peering routes."
        fr: "Le trafic vers les deux adresses passe par la passerelle de transit, car les routes de passerelle de transit sont prioritaires sur les routes d'appairage."
    - id: d
      text:
        en: "Traffic to 10.20.8.25 goes to the VPC peering connection, and traffic to 10.20.3.7 goes to the NAT gateway."
        fr: "Le trafic vers 10.20.8.25 passe par la connexion d'appairage de VPC, et le trafic vers 10.20.3.7 par la passerelle NAT."
answer: { optionId: a }
explanation:
  correct:
    en: |
      VPC routing uses the most specific route that matches the destination (longest prefix match). 10.20.8.25 matches both 10.20.0.0/16 and 10.20.8.0/24, and the /24 route to the transit gateway is more specific. 10.20.3.7 matches only 10.20.0.0/16 (and the default route), so it uses the peering connection.
    fr: |
      Le routage VPC utilise la route la plus spécifique qui correspond à la destination (correspondance du préfixe le plus long). 10.20.8.25 correspond à la fois à 10.20.0.0/16 et à 10.20.8.0/24, et la route /24 vers la passerelle de transit est plus spécifique. 10.20.3.7 ne correspond qu'à 10.20.0.0/16 (et à la route par défaut) : il utilise la connexion d'appairage.
  options:
    b:
      en: |
        The /16 peering route matches both addresses, but the more specific /24 route wins for 10.20.8.25.
      fr: |
        La route d'appairage /16 correspond aux deux adresses, mais la route /24, plus spécifique, l'emporte pour 10.20.8.25.
    c:
      en: |
        The target type does not decide; the prefix length does. 10.20.3.7 is outside 10.20.8.0/24, so the transit gateway route does not apply to it.
      fr: |
        Ce n'est pas le type de cible qui décide, mais la longueur du préfixe. 10.20.3.7 est hors de 10.20.8.0/24 : la route de la passerelle de transit ne s'applique pas.
    d:
      en: |
        The default route 0.0.0.0/0 is the least specific route; it is used only when no other route matches, and 10.20.3.7 matches the peering route.
      fr: |
        La route par défaut 0.0.0.0/0 est la moins spécifique ; elle n'est utilisée que si aucune autre route ne correspond, et 10.20.3.7 correspond à la route d'appairage.
references:
  - title: How route priority works
    url: https://docs.aws.amazon.com/vpc/latest/userguide/route-tables-priority.html
