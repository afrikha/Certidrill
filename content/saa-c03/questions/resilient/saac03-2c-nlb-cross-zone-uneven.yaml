id: saac03-2c-nlb-cross-zone-uneven
objective: "2.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses a Network Load Balancer with a TCP listener in two Availability Zones for an application that uses a custom TCP protocol. Because of capacity constraints, the target group has 2 instances in the first zone and 8 instances in the second zone. Clients connect to the IP addresses of both load balancer nodes about equally. The 2 instances in the first zone are overloaded while the other instances are underused. The company wants the load spread evenly across all 10 instances without changing the number of instances in each zone.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise un Network Load Balancer avec un écouteur TCP dans deux zones de disponibilité pour une application qui utilise un protocole TCP personnalisé. En raison de contraintes de capacité, le groupe cible compte 2 instances dans la première zone et 8 instances dans la seconde. Les clients se connectent à peu près également aux adresses IP des deux nœuds de l'équilibreur. Les 2 instances de la première zone sont surchargées, tandis que les autres sont sous-utilisées. L'entreprise souhaite répartir la charge uniformément sur les 10 instances sans modifier le nombre d'instances dans chaque zone.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on cross-zone load balancing for the Network Load Balancer."
        fr: "Activer l'équilibrage de charge entre zones pour le Network Load Balancer."
    - id: b
      text:
        en: "Replace the Network Load Balancer with an Application Load Balancer that has an HTTPS listener."
        fr: "Remplacer le Network Load Balancer par un Application Load Balancer doté d'un écouteur HTTPS."
    - id: c
      text:
        en: "Turn on sticky sessions for the target group so that clients stay on the same instance."
        fr: "Activer les sessions permanentes (sticky sessions) pour le groupe cible afin que les clients restent sur la même instance."
    - id: d
      text:
        en: "Configure the least outstanding requests routing algorithm on the target group."
        fr: "Configurer l'algorithme de routage least outstanding requests sur le groupe cible."
answer: { optionId: a }
explanation:
  correct:
    en: |
      Cross-zone load balancing is turned off by default for Network Load Balancers, so each node sends its 50 % of traffic only to targets in its own zone: each of the 2 instances receives 25 %, and each of the 8 instances receives 6.25 %. With cross-zone load balancing on, each node distributes across all 10 targets, so each receives about 10 %.
    fr: |
      L'équilibrage de charge entre zones est désactivé par défaut pour les Network Load Balancers : chaque nœud envoie ses 50 % du trafic uniquement vers les cibles de sa zone, soit 25 % pour chacune des 2 instances et 6,25 % pour chacune des 8 instances. Une fois l'équilibrage entre zones activé, chaque nœud répartit le trafic sur les 10 cibles, qui reçoivent chacune environ 10 %.
  options:
    b:
      en: |
        An Application Load Balancer works with HTTP and HTTPS, and the application uses a custom TCP protocol.
      fr: |
        Un Application Load Balancer fonctionne avec HTTP et HTTPS, et l'application utilise un protocole TCP personnalisé.
    c:
      en: |
        Stickiness keeps clients on the same target; it does not move traffic from the first zone's nodes to the second zone's targets.
      fr: |
        La persistance maintient les clients sur la même cible ; elle ne déplace pas le trafic des nœuds de la première zone vers les cibles de la seconde.
    d:
      en: |
        Least outstanding requests is a routing algorithm for Application Load Balancer target groups, and the imbalance comes from the zonal routing, not the algorithm.
      fr: |
        Least outstanding requests est un algorithme de routage des groupes cibles d'Application Load Balancer, et le déséquilibre vient du routage par zone, pas de l'algorithme.
references:
  - title: How Elastic Load Balancing works
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/userguide/how-elastic-load-balancing-works.html
