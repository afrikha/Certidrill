id: saac03-2b-sqs-backlog-scaling
objective: "2.1.18"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company processes messages from an Amazon SQS queue with Amazon EC2 instances in an Auto Scaling group. Each instance processes about 10 messages per second, and a message must not wait more than 60 seconds in the queue. The current scaling policy tracks the number of visible messages in the queue, and it often launches far more instances than needed while the queue is draining. The company wants the group to scale in proportion to the work per instance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise traite les messages d'une file d'attente Amazon SQS avec des instances Amazon EC2 d'un groupe Auto Scaling. Chaque instance traite environ 10 messages par seconde, et un message ne doit pas attendre plus de 60 secondes dans la file d'attente. La politique de mise à l'échelle actuelle suit le nombre de messages visibles dans la file d'attente, et elle lance souvent beaucoup plus d'instances que nécessaire pendant que la file se vide. L'entreprise veut que le groupe se mette à l'échelle en proportion du travail par instance.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a target tracking scaling policy on the ASGAverageCPUUtilization metric with a target value of 70.", fr: "Utiliser une politique de suivi de cible sur la métrique ASGAverageCPUUtilization avec une valeur cible de 70." }
    - id: b
      text: { en: "Use a step scaling policy on the ApproximateAgeOfOldestMessage metric with alarms at 30 and 60 seconds.", fr: "Utiliser une politique de mise à l'échelle par étapes sur la métrique ApproximateAgeOfOldestMessage avec des alarmes à 30 et 60 secondes." }
    - id: c
      text: { en: "Use a target tracking scaling policy on the ApproximateNumberOfMessagesVisible metric with a target value of 600.", fr: "Utiliser une politique de suivi de cible sur la métrique ApproximateNumberOfMessagesVisible avec une valeur cible de 600." }
    - id: d
      text: { en: "Use a target tracking scaling policy on a backlog-per-instance metric (messages divided by InService instances) with a target value of 600.", fr: "Utiliser une politique de suivi de cible sur une métrique de backlog par instance (messages divisés par les instances InService) avec une valeur cible de 600." }
answer: { optionId: d }
explanation:
  correct:
    en: AWS recommends scaling an SQS worker fleet on backlog per instance, the number of messages available divided by the number of InService instances. The acceptable backlog per instance is the acceptable latency divided by the processing time per message, here 60 / 0.1 = 600. Target tracking on this metric adds or removes instances in proportion to the work each one has.
    fr: AWS recommande de mettre à l'échelle un parc de traitement SQS sur le backlog par instance, c'est-à-dire le nombre de messages disponibles divisé par le nombre d'instances InService. Le backlog acceptable par instance est la latence acceptable divisée par le temps de traitement d'un message, ici 60 / 0,1 = 600. Le suivi de cible sur cette métrique ajoute ou retire des instances en proportion du travail de chacune.
  options:
    a:
      en: CPU utilization does not reflect the queue backlog or the 60-second latency requirement; instances can be idle while messages wait, or busy with an empty queue.
      fr: L'utilisation du processeur ne reflète ni le backlog de la file d'attente ni l'exigence de latence de 60 secondes ; les instances peuvent être inactives alors que des messages attendent, ou occupées avec une file vide.
    b:
      en: Step scaling on message age reacts only after messages are already old, and it does not relate the backlog to the number of instances.
      fr: La mise à l'échelle par étapes sur l'âge des messages ne réagit que lorsque les messages sont déjà anciens, et elle ne rapporte pas le backlog au nombre d'instances.
    c:
      en: The queue length alone ignores how many instances are running, which is the cause of the overprovisioning while the queue drains.
      fr: La longueur de la file d'attente seule ignore le nombre d'instances en cours d'exécution, ce qui cause justement le surprovisionnement pendant que la file se vide.
references:
  - title: Scaling policy based on Amazon SQS
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
