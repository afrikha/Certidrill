id: saac03-2c-comprehend-review-sentiment
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company collects thousands of written product reviews each day in an Amazon S3 bucket. The marketing team wants each review to be classified automatically as positive, negative, neutral, or mixed. The company does not want to build or train machine learning models.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail collecte chaque jour des milliers d'avis écrits sur ses produits dans un compartiment Amazon S3. L'équipe marketing souhaite que chaque avis soit classé automatiquement comme positif, négatif, neutre ou mitigé. L'entreprise ne souhaite pas créer ni entraîner de modèles de machine learning.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use Amazon Polly to analyze each review and return the sentiment of the text."
        fr: "Utiliser Amazon Polly pour analyser chaque avis et renvoyer le sentiment du texte."
    - id: b
      text:
        en: "Use Amazon Rekognition to analyze each review and return the sentiment of the text."
        fr: "Utiliser Amazon Rekognition pour analyser chaque avis et renvoyer le sentiment du texte."
    - id: c
      text:
        en: "Use Amazon Translate to analyze each review and return the sentiment of the text."
        fr: "Utiliser Amazon Translate pour analyser chaque avis et renvoyer le sentiment du texte."
    - id: d
      text:
        en: "Use Amazon Comprehend to analyze each review and return the sentiment of the text."
        fr: "Utiliser Amazon Comprehend pour analyser chaque avis et renvoyer le sentiment du texte."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon Comprehend is a managed natural language processing service. Its sentiment analysis returns the dominant sentiment of a document (positive, negative, neutral, or mixed) with pretrained models, in real time or as asynchronous jobs for large document sets.
    fr: |
      Amazon Comprehend est un service géré de traitement du langage naturel. Son analyse des sentiments renvoie le sentiment dominant d'un document (positif, négatif, neutre ou mitigé) avec des modèles préentraînés, en temps réel ou par tâches asynchrones pour de grands ensembles de documents.
  options:
    a:
      en: |
        Amazon Polly converts text to lifelike speech; it does not analyze the meaning or sentiment of text.
      fr: |
        Amazon Polly convertit du texte en parole réaliste ; il n'analyse ni le sens ni le sentiment d'un texte.
    b:
      en: |
        Amazon Rekognition analyzes images and videos; it can detect text in an image but does not determine the sentiment of written reviews.
      fr: |
        Amazon Rekognition analyse des images et des vidéos ; il peut détecter du texte dans une image, mais ne détermine pas le sentiment d'avis écrits.
    c:
      en: |
        Amazon Translate translates text between languages; it does not classify sentiment.
      fr: |
        Amazon Translate traduit du texte d'une langue à une autre ; il ne classe pas le sentiment.
references:
  - title: What is Amazon Comprehend?
    url: https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html
