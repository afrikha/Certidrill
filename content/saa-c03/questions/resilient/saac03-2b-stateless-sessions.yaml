id: saac03-2b-stateless-sessions
objective: "2.1.18"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. The application keeps user session data in memory on each instance. When the group scales in or replaces an unhealthy instance, the users on that instance are logged out. The company wants the group to scale freely without any impact on user sessions.

    Which solutions will meet these requirements? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer. L'application conserve les données de session des utilisateurs en mémoire sur chaque instance. Lorsque le groupe réduit sa capacité ou remplace une instance défaillante, les utilisateurs de cette instance sont déconnectés. L'entreprise veut que le groupe puisse se mettre à l'échelle librement sans aucun impact sur les sessions des utilisateurs.

    Quelles solutions permettent de répondre à ces exigences ? (Choisissez-en deux.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Store the session data in an Amazon ElastiCache for Valkey cache that all instances use.", fr: "Stocker les données de session dans un cache Amazon ElastiCache for Valkey utilisé par toutes les instances." }
    - id: b
      text: { en: "Store the session data on the Amazon EBS root volume of each instance.", fr: "Stocker les données de session sur le volume racine Amazon EBS de chaque instance." }
    - id: c
      text: { en: "Enable sticky sessions on the target group of the Application Load Balancer.", fr: "Activer les sessions permanentes sur le groupe cible de l'Application Load Balancer." }
    - id: d
      text: { en: "Store the session data in an Amazon DynamoDB table that all instances use.", fr: "Stocker les données de session dans une table Amazon DynamoDB utilisée par toutes les instances." }
    - id: e
      text: { en: "Enable scale-in protection on all instances in the Auto Scaling group.", fr: "Activer la protection contre la diminution de capacité (scale-in protection) sur toutes les instances du groupe Auto Scaling." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Moving the session state out of the instances makes the web tier stateless, so any instance can serve any request and instances can be added, removed, or replaced without losing sessions. An in-memory ElastiCache for Valkey cache and a DynamoDB table are both shared, managed stores that fit session data.
    fr: Déplacer l'état de session hors des instances rend le niveau web sans état ; n'importe quelle instance peut alors servir n'importe quelle requête, et les instances peuvent être ajoutées, supprimées ou remplacées sans perte de session. Un cache en mémoire ElastiCache for Valkey et une table DynamoDB sont deux magasins partagés et gérés adaptés aux données de session.
  options:
    b:
      en: Data on an instance's root volume is still tied to that instance; other instances cannot read it, and it disappears with the instance.
      fr: Les données du volume racine d'une instance restent liées à cette instance ; les autres instances ne peuvent pas les lire, et elles disparaissent avec l'instance.
    c:
      en: Sticky sessions bind a user to one instance; when that instance is terminated, the in-memory session is still lost.
      fr: Les sessions permanentes lient un utilisateur à une instance ; lorsque cette instance est résiliée, la session en mémoire est toujours perdue.
    e:
      en: Scale-in protection prevents the group from scaling in, which defeats free scaling, and does not stop unhealthy instances from being replaced.
      fr: La protection contre la diminution de capacité empêche le groupe de réduire sa capacité, ce qui va à l'encontre d'une mise à l'échelle libre, et n'empêche pas le remplacement des instances défaillantes.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: Common ElastiCache Use Cases and How ElastiCache Can Help
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/elasticache-use-cases.html
