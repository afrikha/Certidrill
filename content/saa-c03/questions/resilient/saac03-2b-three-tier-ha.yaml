id: saac03-2b-three-tier-ha
objective: "2.1.17"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is deploying a multi-tier web application in one AWS Region. Users must reach the application from the internet only through a load balancer. The application servers and the relational database must not be directly reachable from the internet. Every tier must remain available if one Availability Zone fails.

    Which architecture will meet these requirements?
  fr: |
    Une entreprise déploie une application web à plusieurs niveaux dans une Région AWS. Les utilisateurs ne doivent accéder à l'application depuis Internet que par un équilibreur de charge. Les serveurs d'application et la base de données relationnelle ne doivent pas être directement accessibles depuis Internet. Chaque niveau doit rester disponible en cas de panne d'une zone de disponibilité.

    Quelle architecture permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An internet-facing Application Load Balancer in public subnets, an Auto Scaling group in private subnets, and an Amazon RDS Multi-AZ DB instance in private subnets, all in two Availability Zones.", fr: "Un Application Load Balancer accessible sur Internet dans des sous-réseaux publics, un groupe Auto Scaling dans des sous-réseaux privés et une instance Amazon RDS Multi-AZ dans des sous-réseaux privés, le tout sur deux zones de disponibilité." }
    - id: b
      text: { en: "An internet-facing Application Load Balancer in public subnets, an Auto Scaling group of instances with public IP addresses in public subnets, and an Amazon RDS Multi-AZ DB instance in private subnets, all in two Availability Zones.", fr: "Un Application Load Balancer accessible sur Internet dans des sous-réseaux publics, un groupe Auto Scaling d'instances avec adresses IP publiques dans des sous-réseaux publics et une instance Amazon RDS Multi-AZ dans des sous-réseaux privés, le tout sur deux zones de disponibilité." }
    - id: c
      text: { en: "An internet-facing Application Load Balancer in public subnets and an Auto Scaling group in private subnets in two Availability Zones, and an Amazon RDS DB instance with a read replica in the same Availability Zone.", fr: "Un Application Load Balancer accessible sur Internet dans des sous-réseaux publics et un groupe Auto Scaling dans des sous-réseaux privés sur deux zones de disponibilité, et une instance Amazon RDS avec un réplica en lecture dans la même zone de disponibilité." }
    - id: d
      text: { en: "An internet-facing Application Load Balancer in public subnets and an Auto Scaling group in private subnets in two Availability Zones, and a Single-AZ Amazon RDS DB instance in a private subnet.", fr: "Un Application Load Balancer accessible sur Internet dans des sous-réseaux publics et un groupe Auto Scaling dans des sous-réseaux privés sur deux zones de disponibilité, et une instance Amazon RDS mono-AZ dans un sous-réseau privé." }
answer: { optionId: a }
explanation:
  correct:
    en: The internet-facing ALB in public subnets is the only entry point, while the Auto Scaling group and the database sit in private subnets with no direct internet exposure. Spanning two Availability Zones keeps the load balancer and the application tier available, and the Multi-AZ DB instance keeps a synchronous standby in a second zone for failover.
    fr: L'ALB accessible sur Internet dans des sous-réseaux publics est le seul point d'entrée, tandis que le groupe Auto Scaling et la base de données se trouvent dans des sous-réseaux privés sans exposition directe à Internet. L'extension sur deux zones de disponibilité garde l'équilibreur de charge et le niveau application disponibles, et l'instance Multi-AZ maintient une instance de secours synchrone dans une deuxième zone pour le basculement.
  options:
    b:
      en: Instances with public IP addresses in public subnets can be reached directly from the internet, which violates the requirement.
      fr: Des instances avec adresses IP publiques dans des sous-réseaux publics sont directement accessibles depuis Internet, ce qui enfreint l'exigence.
    c:
      en: A read replica in the same Availability Zone does not survive the loss of that zone, and a replica is not an automatic failover target.
      fr: Un réplica en lecture dans la même zone de disponibilité ne survit pas à la perte de cette zone, et un réplica n'est pas une cible de basculement automatique.
    d:
      en: A Single-AZ DB instance makes the database tier unavailable if its Availability Zone fails.
      fr: Une instance mono-AZ rend le niveau base de données indisponible si sa zone de disponibilité tombe en panne.
references:
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
