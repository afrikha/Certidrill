id: saac03-2b-instance-store-scratch
objective: "2.1.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research team runs a genomics pipeline on a fleet of Amazon EC2 instances. Each job writes hundreds of gigabytes of intermediate scratch files that need the lowest possible latency and very high I/O. The scratch files can be regenerated if they are lost, and the final results are copied to Amazon S3 at the end of each job. The team wants to avoid paying for separate storage volumes for the scratch files.

    Which storage option should the team use for the scratch files?
  fr: |
    Une équipe de recherche exécute un pipeline de génomique sur un parc d'instances Amazon EC2. Chaque tâche écrit des centaines de gigaoctets de fichiers temporaires intermédiaires qui nécessitent la latence la plus faible possible et des E/S très élevées. Les fichiers temporaires peuvent être régénérés s'ils sont perdus, et les résultats finaux sont copiés dans Amazon S3 à la fin de chaque tâche. L'équipe veut éviter de payer des volumes de stockage distincts pour les fichiers temporaires.

    Quelle option de stockage l'équipe doit-elle utiliser pour les fichiers temporaires ?
body:
  options:
    - id: a
      text: { en: "Amazon EBS io2 Block Express volumes attached to each instance", fr: "Des volumes Amazon EBS io2 Block Express attachés à chaque instance" }
    - id: b
      text: { en: "An Amazon EFS file system shared by all instances of the fleet", fr: "Un système de fichiers Amazon EFS partagé par toutes les instances du parc" }
    - id: c
      text: { en: "An Amazon S3 bucket that each instance accesses through the S3 API", fr: "Un compartiment Amazon S3 auquel chaque instance accède via l'API S3" }
    - id: d
      text: { en: "Instance store volumes on an instance type that includes local NVMe SSD storage", fr: "Des volumes de stockage d'instance sur un type d'instance qui inclut un stockage SSD NVMe local" }
answer: { optionId: d }
explanation:
  correct:
    en: Instance store volumes are block storage physically attached to the host, which gives very low latency and high I/O, and their cost is included in the price of the instance. The data is temporary and is lost when the instance stops or terminates, which is acceptable for scratch data that can be regenerated and whose results are copied to S3.
    fr: Les volumes de stockage d'instance sont un stockage en mode bloc physiquement attaché à l'hôte, ce qui offre une latence très faible et des E/S élevées, et leur coût est inclus dans le prix de l'instance. Les données sont temporaires et perdues à l'arrêt ou à la résiliation de l'instance, ce qui est acceptable pour des données temporaires régénérables dont les résultats sont copiés dans S3.
  options:
    a:
      en: io2 Block Express volumes deliver high performance, but they are network-attached volumes billed separately, which the team wants to avoid.
      fr: Les volumes io2 Block Express offrent des performances élevées, mais ce sont des volumes attachés via le réseau et facturés séparément, ce que l'équipe veut éviter.
    b:
      en: Amazon EFS is network storage billed separately, with higher latency than local disks; sharing is not needed for per-job scratch files.
      fr: Amazon EFS est un stockage réseau facturé séparément, avec une latence plus élevée que des disques locaux ; le partage n'est pas nécessaire pour des fichiers temporaires propres à chaque tâche.
    c:
      en: Amazon S3 is object storage accessed over the network through an API; it does not give the lowest latency for intensive scratch I/O.
      fr: Amazon S3 est un stockage d'objets accessible via le réseau par une API ; il n'offre pas la latence la plus faible pour des E/S temporaires intensives.
references:
  - title: Instance store temporary block storage for EC2 instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html
