id: saac03-2c-retry-backoff-jitter
objective: "2.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A fleet of worker processes calls an AWS service API. During peak periods, the API returns throttling errors. Every worker retries immediately, and the retries arrive at the same moments, which causes even more throttling. The company wants the workers to recover from these transient errors without overloading the service.

    Which solution will meet these requirements?
  fr: |
    Une flotte de processus de travail appelle l'API d'un service AWS. En période de pointe, l'API renvoie des erreurs de limitation (throttling). Chaque processus relance immédiatement sa requête, et les nouvelles tentatives arrivent aux mêmes instants, ce qui aggrave encore la limitation. L'entreprise souhaite que les processus se rétablissent de ces erreurs passagères sans surcharger le service.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Retry failed calls in a loop with no delay until each call succeeds."
        fr: "Relancer les appels en échec dans une boucle sans délai jusqu'à ce que chaque appel réussisse."
    - id: b
      text:
        en: "Retry failed calls after a fixed 1-second delay on every worker, with no limit on attempts."
        fr: "Relancer les appels en échec après un délai fixe de 1 seconde sur chaque processus, sans limite de tentatives."
    - id: c
      text:
        en: "Retry failed calls with exponential backoff and jitter, up to a maximum number of attempts."
        fr: "Relancer les appels en échec avec un délai exponentiel (exponential backoff) et une gigue (jitter), jusqu'à un nombre maximal de tentatives."
    - id: d
      text:
        en: "Disable retries and raise the client timeout to 5 minutes so that each call waits longer."
        fr: "Désactiver les nouvelles tentatives et porter le délai d'expiration du client à 5 minutes pour que chaque appel attende plus longtemps."
answer: { optionId: c }
explanation:
  correct:
    en: |
      The retry with backoff pattern increases the wait time between attempts so that a throttled service can recover, and a maximum number of attempts prevents endless retries. Jitter randomizes each delay so that many clients do not retry at the same moment; the AWS SDKs' standard retry mode uses exponential backoff with jitter.
    fr: |
      Le modèle de nouvelle tentative avec délai (retry with backoff) augmente le temps d'attente entre les tentatives afin que le service limité puisse se rétablir, et un nombre maximal de tentatives évite les boucles sans fin. La gigue rend chaque délai aléatoire pour que de nombreux clients ne relancent pas au même instant ; le mode de nouvelle tentative standard des SDK AWS utilise un délai exponentiel avec gigue.
  options:
    a:
      en: |
        Immediate retries add load at the worst moment and keep the service throttled.
      fr: |
        Des relances immédiates ajoutent de la charge au pire moment et maintiennent la limitation du service.
    b:
      en: |
        A fixed delay keeps all workers synchronized, so their retries still arrive together, and unlimited attempts can retry forever.
      fr: |
        Un délai fixe garde tous les processus synchronisés : leurs relances arrivent toujours ensemble, et des tentatives illimitées peuvent se répéter indéfiniment.
    d:
      en: |
        A throttled request is rejected quickly; a longer timeout does not make it succeed, and without retries the transient error is not recovered.
      fr: |
        Une requête limitée est rejetée rapidement ; un délai d'expiration plus long ne la fait pas réussir, et sans nouvelle tentative l'erreur passagère n'est pas récupérée.
references:
  - title: Retry with backoff pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/retry-backoff.html
  - title: Retry behavior
    url: https://docs.aws.amazon.com/sdkref/latest/guide/feature-retry-behavior.html
