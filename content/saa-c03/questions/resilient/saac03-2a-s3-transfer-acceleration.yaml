id: saac03-2a-s3-transfer-acceleration
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research institute has laboratories on four continents. Each laboratory uploads multi-gigabyte result files over the internet to a single Amazon S3 bucket in the eu-west-1 Region by using the S3 API. Uploads from the most distant laboratories are slow. The institute wants faster uploads to the existing bucket with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un institut de recherche possède des laboratoires sur quatre continents. Chaque laboratoire envoie via Internet des fichiers de résultats de plusieurs gigaoctets vers un compartiment Amazon S3 unique de la Région eu-west-1 en utilisant l'API S3. Les envois depuis les laboratoires les plus éloignés sont lents. L'institut veut des envois plus rapides vers le compartiment existant avec le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Site-to-Site VPN connection from each laboratory to a VPC in eu-west-1, and upload through the VPN.", fr: "Créer une connexion AWS Site-to-Site VPN entre chaque laboratoire et un VPC de eu-west-1, et envoyer les fichiers via le VPN." }
    - id: b
      text: { en: "Create a bucket in the Region closest to each laboratory, and configure S3 Replication from each bucket to the bucket in eu-west-1.", fr: "Créer un compartiment dans la Région la plus proche de chaque laboratoire, et configurer S3 Replication de chaque compartiment vers le compartiment de eu-west-1." }
    - id: c
      text: { en: "Enable S3 Transfer Acceleration on the bucket, and configure the laboratories to upload through the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment, et configurer les laboratoires pour qu'ils envoient via le point de terminaison accéléré." }
    - id: d
      text: { en: "Order an AWS Direct Connect connection for each laboratory, and upload through a public virtual interface.", fr: "Commander une connexion AWS Direct Connect pour chaque laboratoire, et envoyer les fichiers via une interface virtuelle publique." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      S3 Transfer Acceleration routes data that arrives at the nearest CloudFront edge location to the bucket over an optimized AWS network path. It is designed for uploads from around the world to a centralized bucket, needs only a bucket setting and the `s3-accelerate` endpoint, and keeps the existing bucket.
    fr: |
      S3 Transfer Acceleration achemine les données qui arrivent à l'emplacement périphérique CloudFront le plus proche vers le compartiment par un chemin réseau AWS optimisé. Il est conçu pour des envois du monde entier vers un compartiment centralisé, ne nécessite qu'un paramètre du compartiment et le point de terminaison `s3-accelerate`, et conserve le compartiment existant.
  options:
    a: { en: "A Site-to-Site VPN still runs over the internet from each laboratory, adds encryption overhead and does not shorten the path.", fr: "Un Site-to-Site VPN passe toujours par Internet depuis chaque laboratoire, ajoute la charge du chiffrement et ne raccourcit pas le chemin." }
    b: { en: "Regional buckets with replication can work, but the institute must create and operate several buckets and replication rules, and files reach eu-west-1 only after replication.", fr: "Des compartiments régionaux avec réplication peuvent fonctionner, mais l'institut doit créer et exploiter plusieurs compartiments et règles de réplication, et les fichiers n'arrivent dans eu-west-1 qu'après la réplication." }
    d: { en: "Direct Connect circuits on four continents involve long provisioning, high cost and physical connections to manage.", fr: "Des circuits Direct Connect sur quatre continents impliquent un long provisionnement, un coût élevé et des connexions physiques à gérer." }
references:
  - title: Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html
