id: saac03-2c-az-id-cross-account
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has two AWS accounts. A latency-sensitive application in account B must run in the same physical Availability Zone as a database that runs in us-east-1a in account A. The account B team launched the application instances in us-east-1a in account B, but measurements show cross-zone latency between the application and the database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de deux comptes AWS. Une application sensible à la latence dans le compte B doit s'exécuter dans la même zone de disponibilité physique qu'une base de données qui s'exécute dans us-east-1a dans le compte A. L'équipe du compte B a lancé les instances de l'application dans us-east-1a dans le compte B, mais les mesures montrent une latence inter-zones entre l'application et la base de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Relaunch the instances in us-east-1a with a cluster placement group, because zone names refer to the same location in every account."
        fr: "Relancer les instances dans us-east-1a avec un groupe de placement de cluster, car les noms de zone désignent le même emplacement dans tous les comptes."
    - id: b
      text:
        en: "Find the AZ ID of the database's zone in account A, and launch the instances in the zone that has the same AZ ID in account B."
        fr: "Trouver l'ID de zone de disponibilité (AZ ID) de la zone de la base de données dans le compte A, et lancer les instances dans la zone qui a le même AZ ID dans le compte B."
    - id: c
      text:
        en: "Create a VPC peering connection between the two accounts so that traffic between the instances stays inside one zone."
        fr: "Créer une connexion d'appairage de VPC entre les deux comptes afin que le trafic entre les instances reste dans une seule zone."
    - id: d
      text:
        en: "Deploy the instances in a Local Zone of us-east-1 that is closer to the database."
        fr: "Déployer les instances dans une Local Zone de us-east-1 plus proche de la base de données."
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS maps physical Availability Zones to zone names randomly for each account, so us-east-1a in account A can be a different location from us-east-1a in account B. The AZ ID (for example, use1-az2) identifies the same physical zone in every account, so matching AZ IDs places the instances next to the database.
    fr: |
      AWS associe de façon aléatoire les zones de disponibilité physiques aux noms de zone dans chaque compte : us-east-1a dans le compte A peut être un emplacement différent de us-east-1a dans le compte B. L'AZ ID (par exemple use1-az2) identifie la même zone physique dans tous les comptes ; faire correspondre les AZ ID place les instances à côté de la base de données.
  options:
    a:
      en: |
        Zone names are not consistent across accounts, which is the cause of the problem; a placement group cannot fix a launch in the wrong physical zone.
      fr: |
        Les noms de zone ne sont pas cohérents d'un compte à l'autre, ce qui est la cause du problème ; un groupe de placement ne corrige pas un lancement dans la mauvaise zone physique.
    c:
      en: |
        Peering provides connectivity between VPCs but does not change where the instances run, so the traffic still crosses zones.
      fr: |
        L'appairage fournit la connectivité entre VPC mais ne change pas l'emplacement des instances : le trafic traverse toujours des zones.
    d:
      en: |
        A Local Zone extends the Region closer to end users; it is a different location from the database's Availability Zone and would not remove the latency.
      fr: |
        Une Local Zone étend la Région au plus près des utilisateurs finaux ; c'est un emplacement différent de la zone de disponibilité de la base de données, ce qui ne supprime pas la latence.
references:
  - title: Availability Zone IDs for your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/working-with-az-ids.html
