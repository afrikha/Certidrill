id: saac03-2d-stacksets-auto-deploy
objective: "2.2.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. The security team maintains an AWS CloudFormation template that creates a baseline in each account: an IAM role for incident response and a set of Amazon CloudWatch alarms. New accounts are created in the Workloads organizational unit (OU) every week.

    The baseline must be deployed automatically to every existing and new account in the Workloads OU, and removed when an account leaves the OU. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations. L'équipe de sécurité maintient un modèle AWS CloudFormation qui crée une base de référence dans chaque compte : un rôle IAM pour la réponse aux incidents et un ensemble d'alarmes Amazon CloudWatch. De nouveaux comptes sont créés chaque semaine dans l'unité d'organisation (OU) Workloads.

    La base de référence doit être déployée automatiquement dans chaque compte existant et nouveau de l'OU Workloads, et supprimée lorsqu'un compte quitte l'OU. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a StackSet with self-managed permissions, and add the ID of each new account to the StackSet after the account is created.", fr: "Créer un StackSet avec des autorisations autogérées, et ajouter l'ID de chaque nouveau compte au StackSet après la création du compte." } }
    - { id: b, text: { en: "Create an Amazon EventBridge rule on account creation events that invokes an AWS Lambda function to create the stack in the new account.", fr: "Créer une règle Amazon EventBridge sur les événements de création de compte qui appelle une fonction AWS Lambda chargée de créer la pile dans le nouveau compte." } }
    - { id: c, text: { en: "Attach a service control policy (SCP) to the Workloads OU that requires the IAM role and the alarms to exist in each account.", fr: "Attacher à l'OU Workloads une politique de contrôle des services (SCP) qui exige la présence du rôle IAM et des alarmes dans chaque compte." } }
    - { id: d, text: { en: "Create a StackSet with service-managed permissions that targets the Workloads OU, with automatic deployment enabled and stacks deleted on account removal.", fr: "Créer un StackSet avec des autorisations gérées par le service qui cible l'OU Workloads, avec le déploiement automatique activé et la suppression des piles au retrait d'un compte." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A StackSet with service-managed permissions deploys stacks to the accounts of target OUs through the Organizations integration. With automatic deployment enabled, CloudFormation creates the stack in each account added to the OU and, with the delete option, removes it from accounts that leave the OU. No per-account action or custom code is needed.
    fr: |
      Un StackSet avec des autorisations gérées par le service déploie des piles dans les comptes des OU cibles grâce à l'intégration avec Organizations. Avec le déploiement automatique activé, CloudFormation crée la pile dans chaque compte ajouté à l'OU et, avec l'option de suppression, la retire des comptes qui quittent l'OU. Aucune action par compte ni aucun code personnalisé n'est nécessaire.
  options:
    a: { en: "Self-managed permissions require IAM roles created in each account and a manual update for every new account, which is not automatic.", fr: "Les autorisations autogérées exigent des rôles IAM créés dans chaque compte et une mise à jour manuelle pour chaque nouveau compte : ce n'est pas automatique." }
    b: { en: "This is custom code to build and maintain, and it does not remove the baseline when an account leaves the OU.", fr: "C'est du code personnalisé à construire et à maintenir, et il ne retire pas la base de référence lorsqu'un compte quitte l'OU." }
    c: { en: "SCPs only limit the permissions available in accounts; they never create resources.", fr: "Les SCP ne font que limiter les autorisations disponibles dans les comptes ; elles ne créent jamais de ressources." }
references:
  - title: Enable or disable automatic deployments for StackSets in AWS Organizations
    url: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-orgs-manage-auto-deployment.html
