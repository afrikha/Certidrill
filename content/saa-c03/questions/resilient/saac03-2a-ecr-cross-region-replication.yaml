id: saac03-2a-ecr-cross-region-replication
objective: "2.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating its container applications to Amazon ECS in the us-east-1 Region and is adding a disaster recovery environment in the us-west-2 Region. A CI pipeline pushes the images to a private Amazon ECR registry in us-east-1. Every new image must be available automatically in us-west-2 without any change to the pipeline.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre ses applications conteneurisées vers Amazon ECS dans la Région us-east-1 et ajoute un environnement de reprise après sinistre dans la Région us-west-2. Un pipeline CI envoie les images dans un registre Amazon ECR privé de us-east-1. Chaque nouvelle image doit être disponible automatiquement dans us-west-2 sans aucune modification du pipeline.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the pipeline so that it pushes each image to the registries of both Regions.", fr: "Modifier le pipeline pour qu'il envoie chaque image dans les registres des deux Régions." }
    - id: b
      text: { en: "Export the images as archives to an Amazon S3 bucket, and configure S3 Cross-Region Replication to a bucket in us-west-2.", fr: "Exporter les images sous forme d'archives dans un compartiment Amazon S3, et configurer S3 Cross-Region Replication vers un compartiment de us-west-2." }
    - id: c
      text: { en: "Create a Lambda function that runs daily to pull the new images from us-east-1 and push them to us-west-2.", fr: "Créer une fonction Lambda exécutée chaque jour qui récupère les nouvelles images de us-east-1 et les envoie dans us-west-2." }
    - id: d
      text: { en: "Configure private image replication in the ECR registry settings with a rule that replicates images to us-west-2.", fr: "Configurer la réplication d'images privée dans les paramètres du registre ECR avec une règle qui réplique les images vers us-west-2." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon ECR private image replication is configured in the registry settings and copies images to other Regions or accounts automatically, optionally filtered by repository prefix. Images pushed after the rule is created are replicated with no pipeline change; existing images need a backfill.
    fr: |
      La réplication d'images privée d'Amazon ECR se configure dans les paramètres du registre et copie automatiquement les images vers d'autres Régions ou comptes, avec un filtrage facultatif par préfixe de référentiel. Les images envoyées après la création de la règle sont répliquées sans modifier le pipeline ; les images existantes nécessitent un rattrapage (backfill).
  options:
    a: { en: "Pushing to two registries works but requires changing the pipeline, which the requirements forbid.", fr: "Envoyer dans deux registres fonctionne, mais impose de modifier le pipeline, ce que les exigences interdisent." }
    b: { en: "Exporting archives to S3 requires new pipeline steps, and the DR Region would get archives in a bucket instead of images in its ECR registry.", fr: "Exporter des archives vers S3 exige de nouvelles étapes dans le pipeline, et la Région de reprise recevrait des archives dans un compartiment au lieu d'images dans son registre ECR." }
    c: { en: "A daily custom function is code to maintain and leaves the DR Region up to a day behind.", fr: "Une fonction personnalisée quotidienne est du code à maintenir et laisse la Région de reprise jusqu'à un jour en retard." }
references:
  - title: Private image replication in Amazon ECR
    url: https://docs.aws.amazon.com/AmazonECR/latest/userguide/replication.html
