id: saac03-2d-dr-backup-restore
objective: "2.2.18"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an internal reporting application on Amazon EC2 instances with an Amazon RDS database in one AWS Region. The business states that, after a Region-wide disaster, the application can be unavailable for up to 24 hours and can lose up to 12 hours of data.

    The company wants the lowest-cost disaster recovery (DR) strategy that meets these objectives.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application interne de reporting sur des instances Amazon EC2 avec une base de données Amazon RDS dans une seule Région AWS. L'entreprise indique qu'après un sinistre touchant toute la Région, l'application peut rester indisponible jusqu'à 24 heures et perdre jusqu'à 12 heures de données.

    L'entreprise veut la stratégie de reprise après sinistre (DR) la moins coûteuse qui respecte ces objectifs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Pilot light: run a cross-Region read replica of the database at all times, and keep copies of the AMIs and launch templates in the second Region.", fr: "Environnement de veille (pilot light) : exécuter en permanence un réplica en lecture entre Régions de la base de données, et conserver des copies des AMI et des modèles de lancement dans la deuxième Région." } }
    - { id: b, text: { en: "Backup and restore: copy EC2 and RDS backups to a second Region every 6 hours with AWS Backup, and redeploy with AWS CloudFormation after a disaster.", fr: "Sauvegarde et restauration : copier toutes les 6 heures les sauvegardes EC2 et RDS vers une deuxième Région avec AWS Backup, et redéployer avec AWS CloudFormation après un sinistre." } }
    - { id: c, text: { en: "Warm standby: run a scaled-down but fully functional copy of the application and a database replica in a second Region at all times.", fr: "Secours semi-automatique (warm standby) : exécuter en permanence une copie réduite mais entièrement fonctionnelle de l'application et un réplica de la base de données dans une deuxième Région." } }
    - { id: d, text: { en: "Multi-site active/active: run the full application and database in two Regions, and route users to both Regions with Amazon Route 53.", fr: "Actif/actif multisite : exécuter l'application et la base de données complètes dans deux Régions, et répartir les utilisateurs entre les deux Régions avec Amazon Route 53." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Backup and restore is the lowest-cost DR strategy, suited to RPO and RTO measured in hours. Copies every 6 hours keep the data loss within the 12-hour RPO, and redeploying the infrastructure from CloudFormation templates and restoring the backups fits within a 24-hour RTO. No resources run in the second Region until a disaster.
    fr: |
      La sauvegarde et restauration est la stratégie de DR la moins coûteuse, adaptée à un RPO et un RTO de l'ordre de plusieurs heures. Des copies toutes les 6 heures maintiennent la perte de données dans le RPO de 12 heures, et le redéploiement de l'infrastructure à partir de modèles CloudFormation puis la restauration des sauvegardes tiennent dans un RTO de 24 heures. Aucune ressource ne s'exécute dans la deuxième Région avant un sinistre.
  options:
    a: { en: "Pilot light meets the objectives, but the replica runs and is paid for at all times, so it costs more than the objectives require.", fr: "L'environnement de veille respecte les objectifs, mais le réplica s'exécute et est facturé en permanence : il coûte plus que ce qu'exigent les objectifs." }
    c: { en: "Warm standby keeps a working copy of the whole application running, which is far more expensive than needed for a 24-hour RTO.", fr: "Le secours semi-automatique maintient en fonctionnement une copie de toute l'application, ce qui est bien plus coûteux que nécessaire pour un RTO de 24 heures." }
    d: { en: "Active/active is the most complex and costly strategy, designed for near-zero RTO and RPO.", fr: "L'actif/actif est la stratégie la plus complexe et la plus coûteuse, conçue pour un RTO et un RPO proches de zéro." }
references:
  - title: Disaster recovery options in the cloud
    url: https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/disaster-recovery-options-in-the-cloud.html
