id: saac03-2b-multiaz-vs-rr
objective: "2.1.15"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a critical Amazon RDS for PostgreSQL DB instance in a single Availability Zone. If that Availability Zone becomes unavailable, the database must fail over automatically to another Availability Zone without losing committed transactions. The application does not need additional read capacity.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for PostgreSQL critique dans une seule zone de disponibilité. Si cette zone de disponibilité devient indisponible, la base de données doit basculer automatiquement vers une autre zone de disponibilité sans perdre de transactions validées. L'application n'a pas besoin de capacité de lecture supplémentaire.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a read replica in another Availability Zone, and promote it to a standalone DB instance if the primary fails.", fr: "Créer un réplica en lecture dans une autre zone de disponibilité, et le promouvoir en instance autonome si l'instance principale tombe en panne." }
    - id: b
      text: { en: "Modify the DB instance to use a Multi-AZ DB instance deployment with a standby in another Availability Zone.", fr: "Modifier l'instance de base de données pour utiliser un déploiement d'instance Multi-AZ avec une instance de secours dans une autre zone de disponibilité." }
    - id: c
      text: { en: "Create a cross-Region read replica, and use Amazon Route 53 failover routing to send traffic to it if the primary fails.", fr: "Créer un réplica en lecture entre Régions, et utiliser le routage de basculement Amazon Route 53 pour lui envoyer le trafic si l'instance principale tombe en panne." }
    - id: d
      text: { en: "Set the automated backup retention period to 35 days, and restore the DB instance in another Availability Zone if needed.", fr: "Définir la période de conservation des sauvegardes automatisées sur 35 jours, et restaurer l'instance dans une autre zone de disponibilité si nécessaire." }
answer: { optionId: b }
explanation:
  correct:
    en: A Multi-AZ DB instance deployment keeps a standby in a different Availability Zone that is updated with synchronous replication, so committed transactions are already on the standby. RDS provides failover to the standby when the primary or its Availability Zone fails. The standby does not serve reads, which matches the absence of a read-scaling need.
    fr: Un déploiement d'instance de base de données Multi-AZ maintient une instance de secours dans une autre zone de disponibilité, mise à jour par réplication synchrone ; les transactions validées sont donc déjà sur l'instance de secours. RDS assure le basculement vers celle-ci lorsque l'instance principale ou sa zone de disponibilité tombe en panne. L'instance de secours ne sert pas de lectures, ce qui correspond à l'absence de besoin de mise à l'échelle des lectures.
  options:
    a:
      en: Read replicas use asynchronous replication, so recent transactions can be lost, and promotion is a manual step rather than an automatic failover.
      fr: Les réplicas en lecture utilisent une réplication asynchrone ; des transactions récentes peuvent donc être perdues, et la promotion est une étape manuelle et non un basculement automatique.
    c:
      en: A cross-Region replica is also asynchronous and must be promoted; DNS failover does not make the replica writable.
      fr: Un réplica entre Régions est lui aussi asynchrone et doit être promu ; le basculement DNS ne rend pas le réplica accessible en écriture.
    d:
      en: Restoring from backups is a manual recovery that takes time and loses changes after the last restorable point; it is not an automatic failover.
      fr: La restauration à partir de sauvegardes est une reprise manuelle qui prend du temps et perd les modifications postérieures au dernier point restaurable ; ce n'est pas un basculement automatique.
references:
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
