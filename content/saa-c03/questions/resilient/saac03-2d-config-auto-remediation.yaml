id: saac03-2d-config-auto-remediation
objective: "2.2.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's security standard forbids security groups that allow inbound SSH (TCP port 22) from 0.0.0.0/0. Developers sometimes add such rules manually while they troubleshoot instances and forget to remove them.

    The company wants these rules to be detected and removed automatically shortly after they are created, and it wants a history of the compliance status of each security group. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    La norme de sécurité d'une entreprise interdit les groupes de sécurité qui autorisent le SSH entrant (port TCP 22) depuis 0.0.0.0/0. Des développeurs ajoutent parfois manuellement de telles règles pendant qu'ils dépannent des instances et oublient de les supprimer.

    L'entreprise veut que ces règles soient détectées et supprimées automatiquement peu après leur création, et elle veut un historique de l'état de conformité de chaque groupe de sécurité. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge Scheduler schedule that runs an AWS Lambda function every hour to scan all security groups and delete the offending rules.", fr: "Créer une planification Amazon EventBridge Scheduler qui exécute toutes les heures une fonction AWS Lambda chargée d'analyser tous les groupes de sécurité et de supprimer les règles en cause." } }
    - { id: b, text: { en: "Deploy the AWS Config managed rule that checks for unrestricted incoming SSH traffic, with automatic remediation that runs an AWS Systems Manager Automation document to remove the rule.", fr: "Déployer la règle gérée AWS Config qui détecte le trafic SSH entrant non restreint, avec une correction automatique qui exécute un document AWS Systems Manager Automation pour supprimer la règle." } }
    - { id: c, text: { en: "Run AWS CloudFormation drift detection every day on the stacks that create the security groups.", fr: "Exécuter chaque jour la détection de dérive AWS CloudFormation sur les piles qui créent les groupes de sécurité." } }
    - { id: d, text: { en: "Attach a service control policy (SCP) that denies the ec2:AuthorizeSecurityGroupIngress action to all accounts.", fr: "Attacher à tous les comptes une politique de contrôle des services (SCP) qui refuse l'action ec2:AuthorizeSecurityGroupIngress." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An AWS Config rule evaluates each security group when its configuration changes and records its compliance history. Auto remediation associates a Systems Manager Automation document with the rule, so AWS Config runs the fix on every noncompliant resource, with optional retries. AWS provides both the managed rule and managed remediation documents, so there is no code to maintain.
    fr: |
      Une règle AWS Config évalue chaque groupe de sécurité lorsque sa configuration change et enregistre son historique de conformité. La correction automatique associe un document Systems Manager Automation à la règle : AWS Config exécute alors la correction sur chaque ressource non conforme, avec des tentatives supplémentaires facultatives. AWS fournit à la fois la règle gérée et des documents de correction gérés : il n'y a aucun code à maintenir.
  options:
    a: { en: "A custom function is code to write and maintain, an hourly scan leaves rules open for up to an hour, and it keeps no compliance history.", fr: "Une fonction personnalisée est du code à écrire et à maintenir, une analyse horaire laisse les règles ouvertes jusqu'à une heure, et elle ne conserve aucun historique de conformité." }
    c: { en: "Drift detection only reports differences from the template; it does not fix them, and it does not cover security groups created outside the stacks.", fr: "La détection de dérive ne fait que signaler les écarts par rapport au modèle ; elle ne les corrige pas et ne couvre pas les groupes de sécurité créés hors des piles." }
    d: { en: "The SCP blocks every inbound rule change, including legitimate ones, and it neither detects nor removes rules that already exist.", fr: "La SCP bloque toute modification de règle entrante, y compris les modifications légitimes, et elle ne détecte ni ne supprime les règles déjà existantes." }
references:
  - title: Setting Up Auto Remediation for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/setup-autoremediation.html
  - title: Remediating Noncompliant Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
