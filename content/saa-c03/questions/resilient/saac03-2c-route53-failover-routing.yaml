id: saac03-2c-route53-failover-routing
objective: "2.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web application behind an Application Load Balancer in us-east-1. It also hosts a static maintenance website in an Amazon S3 bucket in us-west-2. The company wants an active-passive configuration: users must reach the application while it is healthy, and Route 53 must automatically send them to the maintenance website when the application becomes unhealthy.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web derrière un Application Load Balancer dans us-east-1. Elle héberge aussi un site web de maintenance statique dans un compartiment Amazon S3 dans us-west-2. L'entreprise souhaite une configuration actif-passif : les utilisateurs doivent atteindre l'application tant qu'elle est saine, et Route 53 doit les diriger automatiquement vers le site de maintenance lorsque l'application devient défaillante.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create weighted alias records with weights of 100 and 0 for the load balancer and the website, without health checks."
        fr: "Créer des enregistrements d'alias pondérés avec des poids de 100 et 0 pour l'équilibreur de charge et le site web, sans vérification de l'état."
    - id: b
      text:
        en: "Create a primary failover alias record for the load balancer with Evaluate Target Health set to Yes, and a secondary record for the website."
        fr: "Créer un enregistrement d'alias de basculement principal pour l'équilibreur de charge avec Evaluate Target Health défini sur Yes, et un enregistrement secondaire pour le site web."
    - id: c
      text:
        en: "Create latency alias records for the load balancer and the website, and enable Evaluate Target Health on both records."
        fr: "Créer des enregistrements d'alias de latence pour l'équilibreur de charge et le site web, et activer Evaluate Target Health sur les deux enregistrements."
    - id: d
      text:
        en: "Create a simple routing record that contains the addresses of both the load balancer and the website."
        fr: "Créer un enregistrement de routage simple qui contient les adresses de l'équilibreur de charge et du site web."
answer: { optionId: b }
explanation:
  correct:
    en: |
      The failover routing policy implements active-passive failover: Route 53 answers with the primary record while it is healthy and returns the secondary record only when the primary is unhealthy. For an alias record that points to a load balancer, Evaluate Target Health gives the record the health of its target without a separate health check.
    fr: |
      La politique de routage de basculement met en œuvre un basculement actif-passif : Route 53 répond avec l'enregistrement principal tant qu'il est sain et ne renvoie l'enregistrement secondaire que lorsque le principal est défaillant. Pour un enregistrement d'alias qui pointe vers un équilibreur de charge, Evaluate Target Health donne à l'enregistrement l'état de sa cible sans vérification de l'état distincte.
  options:
    a:
      en: |
        Weighted records fall back to zero-weight records only when the nonzero-weight records are unhealthy; without any health evaluation, Route 53 never detects the failure.
      fr: |
        Les enregistrements pondérés ne se replient sur les enregistrements de poids nul que lorsque les enregistrements de poids non nul sont défaillants ; sans évaluation de l'état, Route 53 ne détecte jamais la panne.
    c:
      en: |
        Latency routing is active-active: some users would be sent to the maintenance website even while the application is healthy.
      fr: |
        Le routage par latence est actif-actif : certains utilisateurs seraient dirigés vers le site de maintenance alors que l'application est saine.
    d:
      en: |
        A simple record returns all values without health checks, so clients would pick either destination at random.
      fr: |
        Un enregistrement simple renvoie toutes les valeurs sans vérification de l'état : les clients choisiraient l'une ou l'autre destination au hasard.
references:
  - title: Active-active and active-passive failover
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-types.html
