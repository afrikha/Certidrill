id: saac03-2b-ecs-service-desired
objective: "2.1.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a containerized order API on Amazon ECS with AWS Fargate. Four copies of the API must always run across two Availability Zones behind an Application Load Balancer. Any copy that stops or fails the load balancer health check must be replaced automatically, without custom code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une API de commandes conteneurisée sur Amazon ECS avec AWS Fargate. Quatre copies de l'API doivent toujours s'exécuter sur deux zones de disponibilité derrière un Application Load Balancer. Toute copie qui s'arrête ou échoue au contrôle d'intégrité de l'équilibreur de charge doit être remplacée automatiquement, sans code personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Start four standalone tasks with the RunTask API, and register them with the target group of the load balancer.", fr: "Démarrer quatre tâches autonomes avec l'API RunTask, et les enregistrer dans le groupe cible de l'équilibreur de charge." }
    - id: b
      text: { en: "Create an ECS service with a desired count of 4 that is associated with the target group of the load balancer.", fr: "Créer un service ECS avec un nombre souhaité de 4, associé au groupe cible de l'équilibreur de charge." }
    - id: c
      text: { en: "Create an ECS scheduled task that starts four tasks every 5 minutes and registers them with the target group.", fr: "Créer une tâche planifiée ECS qui démarre quatre tâches toutes les 5 minutes et les enregistre dans le groupe cible." }
    - id: d
      text: { en: "Create an ECS service that uses the DAEMON scheduling strategy to run one task on each Fargate node.", fr: "Créer un service ECS qui utilise la stratégie de planification DAEMON pour exécuter une tâche sur chaque nœud Fargate." }
answer: { optionId: b }
explanation:
  correct:
    en: An ECS service keeps the desired number of tasks running. If a task stops, or fails a container or load balancer target group health check, the service scheduler launches a replacement and registers it with the target group. This is the recommended scheduler for long-running stateless applications.
    fr: Un service ECS maintient le nombre souhaité de tâches en cours d'exécution. Si une tâche s'arrête, ou échoue à un contrôle d'intégrité du conteneur ou du groupe cible de l'équilibreur de charge, le planificateur du service lance une tâche de remplacement et l'enregistre dans le groupe cible. C'est le planificateur recommandé pour les applications sans état de longue durée.
  options:
    a:
      en: ECS does not maintain or replace standalone tasks; replacing failed tasks would require custom code.
      fr: ECS ne maintient pas et ne remplace pas les tâches autonomes ; remplacer les tâches en échec nécessiterait du code personnalisé.
    c:
      en: Scheduled tasks are for periodic jobs that run to completion. Starting new tasks on a timer neither keeps exactly four copies nor replaces unhealthy ones.
      fr: Les tâches planifiées servent aux traitements périodiques qui s'exécutent jusqu'à leur fin. Démarrer des tâches selon un minuteur ne maintient pas exactement quatre copies et ne remplace pas les copies défaillantes.
    d:
      en: The DAEMON strategy runs one task per container instance and is not supported with Fargate, which has no nodes to manage.
      fr: La stratégie DAEMON exécute une tâche par instance de conteneur et n'est pas prise en charge avec Fargate, qui n'a pas de nœuds à gérer.
references:
  - title: Amazon ECS services
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_services.html
