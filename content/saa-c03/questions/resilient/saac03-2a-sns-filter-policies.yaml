id: saac03-2a-sns-filter-policies
objective: "2.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An order service publishes all order events (created, paid, shipped and cancelled) to one Amazon SNS topic, with the event type in a message attribute named event_type. The shipping service must process only paid events, and the support service must process only cancelled events, each from its own Amazon SQS queue. The order service must not change, and the services must not receive events that they do not need.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un service de commandes publie tous les événements de commande (création, paiement, expédition et annulation) dans une rubrique Amazon SNS, avec le type d'événement dans un attribut de message nommé event_type. Le service d'expédition ne doit traiter que les événements de paiement, et le service de support que les événements d'annulation, chacun depuis sa propre file d'attente Amazon SQS. Le service de commandes ne doit pas changer, et les services ne doivent pas recevoir d'événements dont ils n'ont pas besoin.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create one SNS topic for each event type, and update the order service to publish to the matching topic.", fr: "Créer une rubrique SNS par type d'événement, et modifier le service de commandes pour qu'il publie dans la rubrique correspondante." } }
    - { id: b, text: { en: "Subscribe the SQS queue of each service to the existing SNS topic.", fr: "Abonner la file d'attente SQS de chaque service à la rubrique SNS existante." } }
    - { id: c, text: { en: "Attach a filter policy to each subscription that matches the event_type value that the service needs.", fr: "Attacher à chaque abonnement une politique de filtre qui correspond à la valeur event_type dont le service a besoin." } }
    - { id: d, text: { en: "Have each service receive every message and delete the messages that it does not need.", fr: "Faire recevoir tous les messages par chaque service, qui supprime les messages dont il n'a pas besoin." } }
    - { id: e, text: { en: "Add a queue policy to each SQS queue that rejects messages with other event_type values.", fr: "Ajouter à chaque file d'attente SQS une politique de file qui rejette les messages ayant d'autres valeurs event_type." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      By default, a subscriber receives every message published to the topic. A filter policy on a subscription, applied to message attributes (or to the message body), makes SNS deliver only the messages that match, so each queue receives only the events its service needs, with no change to the publisher.
    fr: |
      Par défaut, un abonné reçoit tous les messages publiés dans la rubrique. Une politique de filtre sur un abonnement, appliquée aux attributs de message (ou au corps du message), fait remettre par SNS uniquement les messages correspondants : chaque file ne reçoit que les événements dont son service a besoin, sans modifier l'éditeur.
  options:
    a: { en: "Separate topics would work but require changing the order service, which the requirements forbid.", fr: "Des rubriques distinctes fonctionneraient, mais imposent de modifier le service de commandes, ce que les exigences interdisent." }
    d: { en: "Receiving and discarding unneeded messages is exactly what the services must avoid, and it wastes processing and requests.", fr: "Recevoir puis supprimer les messages inutiles est précisément ce que les services doivent éviter, et cela gaspille traitements et requêtes." }
    e: { en: "SQS queue policies control which principals can access the queue; they cannot filter messages by attribute value.", fr: "Les politiques de file SQS contrôlent quels principaux peuvent accéder à la file ; elles ne peuvent pas filtrer les messages selon la valeur d'un attribut." }
references:
  - title: Amazon SNS message filtering
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html
