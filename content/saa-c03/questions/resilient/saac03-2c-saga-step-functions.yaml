id: saac03-2c-saga-step-functions
objective: "2.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A travel company splits its booking application into three microservices for flights, hotels, and car rentals. Each microservice has its own database. A booking must complete in all three services or, if any step fails, the steps that already completed must be reversed. The company wants a managed orchestrator with built-in retry and error handling, and it wants to write as little coordination code as possible.

    Which solution will meet these requirements?
  fr: |
    Une agence de voyages divise son application de réservation en trois microservices pour les vols, les hôtels et la location de voitures. Chaque microservice possède sa propre base de données. Une réservation doit aboutir dans les trois services ou, si une étape échoue, les étapes déjà réalisées doivent être annulées. L'entreprise souhaite un orchestrateur géré avec une gestion intégrée des nouvelles tentatives et des erreurs, et elle souhaite écrire le moins de code de coordination possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Move the three databases into one Amazon Aurora cluster and run the three updates inside a single SQL transaction."
        fr: "Regrouper les trois bases de données dans un seul cluster Amazon Aurora et exécuter les trois mises à jour dans une seule transaction SQL."
    - id: b
      text:
        en: "Implement saga orchestration with an AWS Step Functions Standard workflow that calls each service and runs compensating steps in Catch handlers."
        fr: "Mettre en œuvre une orchestration de saga avec un flux de travail AWS Step Functions Standard qui appelle chaque service et exécute des étapes de compensation dans des gestionnaires Catch."
    - id: c
      text:
        en: "Publish each booking to an Amazon SNS topic that the three services subscribe to, and let each service process the booking independently."
        fr: "Publier chaque réservation dans une rubrique Amazon SNS à laquelle les trois services sont abonnés, et laisser chaque service traiter la réservation de façon indépendante."
    - id: d
      text:
        en: "Send the three booking steps to an Amazon SQS FIFO queue so that the services process them in a strict order."
        fr: "Envoyer les trois étapes de réservation dans une file d'attente Amazon SQS FIFO afin que les services les traitent dans un ordre strict."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A saga is a sequence of local transactions in which a failure triggers compensating transactions that undo the earlier steps. AWS Step Functions can act as the saga orchestrator: the workflow calls each service, retries transient errors, and routes failures to compensating steps, and the service runs across multiple Availability Zones.
    fr: |
      Une saga est une suite de transactions locales dans laquelle un échec déclenche des transactions de compensation qui annulent les étapes précédentes. AWS Step Functions peut servir d'orchestrateur de saga : le flux de travail appelle chaque service, relance les erreurs passagères et dirige les échecs vers les étapes de compensation, et le service s'exécute sur plusieurs zones de disponibilité.
  options:
    a:
      en: |
        Merging the databases breaks the microservice design, in which each service owns its data store; this is a redesign, not coordination.
      fr: |
        Regrouper les bases de données casse la conception en microservices, dans laquelle chaque service possède son magasin de données ; c'est une refonte, pas une coordination.
    c:
      en: |
        Fan-out delivers the booking to every service, but nothing reverses completed steps when one service fails.
      fr: |
        La diffusion livre la réservation à chaque service, mais rien n'annule les étapes réalisées lorsqu'un service échoue.
    d:
      en: |
        A FIFO queue guarantees ordering, not compensation; a failed step still leaves the earlier bookings in place.
      fr: |
        Une file d'attente FIFO garantit l'ordre, pas la compensation ; une étape en échec laisse en place les réservations précédentes.
references:
  - title: Saga orchestration pattern
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/cloud-design-patterns/saga-orchestration.html
