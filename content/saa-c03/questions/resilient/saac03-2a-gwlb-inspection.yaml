id: saac03-2a-gwlb-inspection
objective: "2.1.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company must inspect all inbound internet traffic to an application VPC with a fleet of third-party firewall virtual appliances from an AWS Marketplace vendor. The appliances run in a separate inspection VPC. The fleet must scale horizontally, traffic must be spread across healthy appliances, and the inspection must be transparent to the application.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise doit inspecter tout le trafic entrant depuis Internet vers un VPC d'application avec un parc d'appliances virtuelles de pare-feu tierces d'un éditeur d'AWS Marketplace. Les appliances s'exécutent dans un VPC d'inspection distinct. Le parc doit se mettre à l'échelle horizontalement, le trafic doit être réparti entre les appliances saines, et l'inspection doit être transparente pour l'application.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy a Network Load Balancer in the inspection VPC with a TCP listener in front of the appliances.", fr: "Déployer un Network Load Balancer dans le VPC d'inspection avec un écouteur TCP devant les appliances." } }
    - { id: b, text: { en: "Deploy a Gateway Load Balancer in the inspection VPC, and register the appliances in its target group.", fr: "Déployer un Gateway Load Balancer dans le VPC d'inspection, et enregistrer les appliances dans son groupe cible." } }
    - { id: c, text: { en: "Replace the appliances with security group rules on the application instances.", fr: "Remplacer les appliances par des règles de groupe de sécurité sur les instances de l'application." } }
    - { id: d, text: { en: "Peer the two VPCs, and add routes that point to the network interface of one appliance.", fr: "Relier les deux VPC par peering, et ajouter des routes qui pointent vers l'interface réseau d'une appliance." } }
    - { id: e, text: { en: "Create Gateway Load Balancer endpoints in the application VPC, and route inbound traffic through them.", fr: "Créer des points de terminaison Gateway Load Balancer dans le VPC d'application, et y faire passer le trafic entrant par les tables de routage." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      A Gateway Load Balancer operates at layer 3, acts as a transparent gateway, and distributes traffic to a scalable target group of third-party appliances by using GENEVE. Gateway Load Balancer endpoints in the application VPC connect to it privately, and route table entries (including an ingress route table on the internet gateway) send the traffic through the endpoints for inspection.
    fr: |
      Un Gateway Load Balancer fonctionne en couche 3, agit comme une passerelle transparente et distribue le trafic vers un groupe cible évolutif d'appliances tierces via GENEVE. Des points de terminaison Gateway Load Balancer dans le VPC d'application s'y connectent de façon privée, et des entrées de tables de routage (y compris une table de routage d'entrée associée à la passerelle Internet) font passer le trafic par ces points de terminaison pour inspection.
  options:
    a: { en: "A Network Load Balancer accepts traffic sent to its own addresses on its listener ports; it cannot be a transparent route table next hop for all IP traffic, so it cannot insert the appliances into the traffic path.", fr: "Un Network Load Balancer accepte le trafic envoyé à ses propres adresses sur les ports de ses écouteurs ; il ne peut pas être une cible de table de routage transparente pour tout le trafic IP : il ne peut pas insérer les appliances dans le chemin du trafic." }
    c: { en: "Security groups filter ports and addresses but are not the third-party inspection appliances that the company requires.", fr: "Les groupes de sécurité filtrent les ports et les adresses, mais ne sont pas les appliances d'inspection tierces exigées par l'entreprise." }
    d: { en: "Routing to a single appliance interface neither spreads traffic across the fleet nor survives the failure of that appliance.", fr: "Router vers l'interface d'une seule appliance ne répartit pas le trafic sur le parc et ne survit pas à la défaillance de cette appliance." }
references:
  - title: What is a Gateway Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
