id: saac03-2b-fargate-no-servers
objective: "2.1.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has packaged its web API as a container image stored in Amazon ECR. The API must run continuously behind an Application Load Balancer. The team does not want to provision, patch, or scale any Amazon EC2 instances or cluster capacity for the containers.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une startup a empaqueté son API web sous forme d'image de conteneur stockée dans Amazon ECR. L'API doit s'exécuter en continu derrière un Application Load Balancer. L'équipe ne veut ni provisionner, ni corriger, ni mettre à l'échelle des instances Amazon EC2 ou une capacité de cluster pour les conteneurs.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon ECS cluster that uses an Auto Scaling group of EC2 instances as a capacity provider, and run the API as an ECS service.", fr: "Créer un cluster Amazon ECS qui utilise un groupe Auto Scaling d'instances EC2 comme fournisseur de capacité, et exécuter l'API en tant que service ECS." }
    - id: b
      text: { en: "Run the API as an Amazon ECS service that uses AWS Fargate, and register the service with the target group of the Application Load Balancer.", fr: "Exécuter l'API en tant que service Amazon ECS qui utilise AWS Fargate, et enregistrer le service dans le groupe cible de l'Application Load Balancer." }
    - id: c
      text: { en: "Launch EC2 instances from an Amazon ECS-optimized AMI in an Auto Scaling group, and run the container with Docker on each instance.", fr: "Lancer des instances EC2 à partir d'une AMI optimisée pour Amazon ECS dans un groupe Auto Scaling, et exécuter le conteneur avec Docker sur chaque instance." }
    - id: d
      text: { en: "Create an Amazon EKS cluster with self-managed nodes, and deploy the API as a Kubernetes deployment.", fr: "Créer un cluster Amazon EKS avec des nœuds autogérés, et déployer l'API en tant que déploiement Kubernetes." }
answer: { optionId: b }
explanation:
  correct:
    en: AWS Fargate is serverless compute for containers. With an ECS service on Fargate, AWS provisions and manages the underlying infrastructure, the service keeps the desired number of tasks running, and the tasks register with the load balancer target group. The team manages no instances.
    fr: AWS Fargate est un moteur de calcul sans serveur pour les conteneurs. Avec un service ECS sur Fargate, AWS provisionne et gère l'infrastructure sous-jacente, le service maintient le nombre souhaité de tâches en cours d'exécution, et les tâches s'enregistrent dans le groupe cible de l'équilibreur de charge. L'équipe ne gère aucune instance.
  options:
    a:
      en: The EC2 capacity provider still requires the team to manage the instances of the Auto Scaling group (AMI updates, patching, sizing).
      fr: Le fournisseur de capacité EC2 oblige toujours l'équipe à gérer les instances du groupe Auto Scaling (mises à jour d'AMI, correctifs, dimensionnement).
    c:
      en: Running Docker directly on EC2 instances means managing the instances and the container lifecycle without any orchestrator.
      fr: Exécuter Docker directement sur des instances EC2 implique de gérer les instances et le cycle de vie des conteneurs sans aucun orchestrateur.
    d:
      en: Self-managed nodes are EC2 instances that the team must provision, patch, and scale.
      fr: Les nœuds autogérés sont des instances EC2 que l'équipe doit provisionner, corriger et mettre à l'échelle.
references:
  - title: Amazon ECS services
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs_services.html
