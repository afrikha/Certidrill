id: saac03-2b-sqs-visibility-timeout
objective: "2.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon SQS standard queue to distribute video transcoding requests to a fleet of Amazon EC2 worker instances. Each request takes between 2 and 4 minutes to process, and a worker deletes the message when processing completes. The queue uses the default settings. The operations team notices that many videos are processed two or three times by different workers, although no worker fails.

    Which solution will resolve this issue with the LEAST operational overhead?
  fr: |
    Une entreprise utilise une file d'attente standard Amazon SQS pour distribuer des demandes de transcodage vidéo à un parc d'instances de traitement Amazon EC2. Chaque demande prend entre 2 et 4 minutes de traitement, et une instance supprime le message à la fin du traitement. La file d'attente utilise les paramètres par défaut. L'équipe d'exploitation constate que de nombreuses vidéos sont traitées deux ou trois fois par des instances différentes, alors qu'aucune instance ne tombe en panne.

    Quelle solution permet de résoudre ce problème avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Replace the queue with an Amazon SQS FIFO queue that uses content-based deduplication.", fr: "Remplacer la file d'attente par une file d'attente FIFO Amazon SQS qui utilise la déduplication basée sur le contenu." }
    - id: b
      text: { en: "Enable long polling by setting the ReceiveMessageWaitTimeSeconds attribute of the queue to 20 seconds.", fr: "Activer l'interrogation longue en définissant l'attribut ReceiveMessageWaitTimeSeconds de la file d'attente sur 20 secondes." }
    - id: c
      text: { en: "Configure a dead-letter queue for the queue with a redrive policy that sets maxReceiveCount to 1.", fr: "Configurer une file d'attente de lettres mortes avec une politique de redirection qui définit maxReceiveCount sur 1." }
    - id: d
      text: { en: "Increase the visibility timeout of the queue to a value longer than the maximum processing time, such as 5 minutes.", fr: "Augmenter le délai de visibilité de la file d'attente à une valeur supérieure à la durée maximale de traitement, par exemple 5 minutes." }
answer: { optionId: d }
explanation:
  correct:
    en: The default visibility timeout is 30 seconds. Because processing takes minutes, each message becomes visible again before the first worker deletes it, and another worker receives it. Setting the visibility timeout above the longest processing time keeps the message hidden until the worker finishes and deletes it.
    fr: "Le délai de visibilité par défaut est de 30 secondes. Comme le traitement dure plusieurs minutes, chaque message redevient visible avant que la première instance ne le supprime, et une autre instance le reçoit. Définir un délai de visibilité supérieur à la durée de traitement la plus longue garde le message masqué jusqu'à ce que l'instance termine et le supprime."
  options:
    a:
      en: Deduplication only discards duplicate sends within the deduplication interval. A FIFO queue also uses a visibility timeout, so a message that is not deleted in time is delivered again.
      fr: La déduplication écarte seulement les envois en double pendant l'intervalle de déduplication. Une file d'attente FIFO utilise aussi un délai de visibilité ; un message non supprimé à temps est donc remis de nouveau.
    b:
      en: Long polling reduces empty and false empty responses. It has no effect on when a received message becomes visible again.
      fr: L'interrogation longue réduit les réponses vides et faussement vides. Elle n'a aucun effet sur le moment où un message reçu redevient visible.
    c:
      en: A dead-letter queue isolates messages that are received too many times. With maxReceiveCount set to 1, messages that become visible again while still being processed would be moved aside instead of fixing the cause.
      fr: Une file d'attente de lettres mortes isole les messages reçus trop de fois. Avec maxReceiveCount défini sur 1, les messages qui redeviennent visibles pendant leur traitement seraient mis de côté, sans corriger la cause.
references:
  - title: Amazon SQS visibility timeout
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
