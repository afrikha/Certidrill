id: saac03-2c-route53-private-alarm-check
objective: "2.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a Route 53 private hosted zone with failover routing for an internal API. The primary record points to an Amazon EC2 instance in one VPC, and the secondary record points to an instance in another VPC. The instances have only private IP addresses, and security policy forbids public IP addresses on them. Route 53 must fail over when the primary instance fails its EC2 status checks.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise une zone hébergée privée Route 53 avec un routage de basculement pour une API interne. L'enregistrement principal pointe vers une instance Amazon EC2 dans un VPC, et l'enregistrement secondaire vers une instance dans un autre VPC. Les instances n'ont que des adresses IP privées, et la politique de sécurité interdit de leur attribuer des adresses IP publiques. Route 53 doit basculer lorsque l'instance principale échoue à ses contrôles d'état EC2.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a Route 53 endpoint health check that monitors the private IP address of the primary instance, and associate it with the primary record."
        fr: "Créer une vérification de l'état de point de terminaison Route 53 qui surveille l'adresse IP privée de l'instance principale, et l'associer à l'enregistrement principal."
    - id: b
      text:
        en: "Associate an Elastic IP address with the primary instance, and create an endpoint health check that monitors that address."
        fr: "Associer une adresse IP Elastic à l'instance principale, et créer une vérification de l'état de point de terminaison qui surveille cette adresse."
    - id: c
      text:
        en: "Leave the primary record without a health check, because Route 53 detects failed instances in private hosted zones automatically."
        fr: "Laisser l'enregistrement principal sans vérification de l'état, car Route 53 détecte automatiquement les instances défaillantes dans les zones hébergées privées."
    - id: d
      text:
        en: "Create a CloudWatch alarm on the instance's StatusCheckFailed metric and a Route 53 health check that monitors the alarm, and associate it with the primary record."
        fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed de l'instance et une vérification de l'état Route 53 qui surveille l'alarme, et l'associer à l'enregistrement principal."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Route 53 health checkers run outside the VPC, so they cannot reach private IP addresses. A health check based on the data stream of a CloudWatch alarm, such as an alarm on StatusCheckFailed, lets Route 53 evaluate instances that have only private IP addresses and fail over to the secondary record.
    fr: |
      Les vérificateurs d'état Route 53 s'exécutent hors du VPC et ne peuvent donc pas atteindre des adresses IP privées. Une vérification de l'état fondée sur le flux de données d'une alarme CloudWatch, par exemple une alarme sur StatusCheckFailed, permet à Route 53 d'évaluer des instances qui n'ont que des adresses IP privées et de basculer vers l'enregistrement secondaire.
  options:
    a:
      en: |
        Endpoint health checks are sent from Route 53 health checkers on the internet, which cannot reach a private IP address in a VPC.
      fr: |
        Les vérifications de point de terminaison sont envoyées par les vérificateurs d'état Route 53 sur Internet, qui ne peuvent pas atteindre une adresse IP privée dans un VPC.
    b:
      en: |
        A public address would make the endpoint health check work, but the security policy forbids public IP addresses on the instances.
      fr: |
        Une adresse publique permettrait la vérification de point de terminaison, mais la politique de sécurité interdit les adresses IP publiques sur les instances.
    c:
      en: |
        Route 53 has no way to know that an instance failed unless a health check is associated with the record or alias target health is evaluated.
      fr: |
        Route 53 ne peut pas savoir qu'une instance est défaillante si aucune vérification de l'état n'est associée à l'enregistrement et si l'état de la cible d'alias n'est pas évalué.
references:
  - title: Configuring failover in a private hosted zone
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-private-hosted-zones.html
