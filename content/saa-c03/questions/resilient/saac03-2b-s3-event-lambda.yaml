id: saac03-2b-s3-event-lambda
objective: "2.1.17"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A real estate company lets agents upload property photos to an Amazon S3 bucket. Each new photo must be resized into three thumbnail sizes within seconds of the upload. The upload volume varies from zero to thousands of photos per hour. The company wants an event-driven solution with no servers to manage.

    Which solution will meet these requirements?
  fr: |
    Une agence immobilière permet à ses agents de charger des photos de biens dans un compartiment Amazon S3. Chaque nouvelle photo doit être redimensionnée en trois tailles de miniatures quelques secondes après son chargement. Le volume de chargements varie de zéro à des milliers de photos par heure. L'entreprise veut une solution basée sur les événements, sans serveur à gérer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run a cron job on an Amazon EC2 instance every minute that lists new objects in the bucket and resizes them.", fr: "Exécuter chaque minute une tâche cron sur une instance Amazon EC2 qui liste les nouveaux objets du compartiment et les redimensionne." }
    - id: b
      text: { en: "Turn on daily S3 Inventory reports, and process the listed objects with an AWS Batch job every morning.", fr: "Activer des rapports S3 Inventory quotidiens, et traiter chaque matin les objets listés avec une tâche AWS Batch." }
    - id: c
      text: { en: "Configure an S3 Lifecycle rule that transitions each new object to a thumbnails prefix after it is uploaded.", fr: "Configurer une règle S3 Lifecycle qui fait passer chaque nouvel objet vers un préfixe de miniatures après son chargement." }
    - id: d
      text: { en: "Configure an S3 event notification for object-created events that invokes an AWS Lambda function to create the thumbnails.", fr: "Configurer une notification d'événement S3 pour les événements de création d'objet qui appelle une fonction AWS Lambda pour créer les miniatures." }
answer: { optionId: d }
explanation:
  correct:
    en: S3 event notifications can invoke a Lambda function when an object is created, usually within seconds. Lambda scales with the number of uploads and costs nothing when there are none. Writing the thumbnails to another bucket or prefix avoids a recursive invocation loop.
    fr: Les notifications d'événement S3 peuvent appeler une fonction Lambda lors de la création d'un objet, généralement en quelques secondes. Lambda évolue avec le nombre de chargements et ne coûte rien en leur absence. Écrire les miniatures dans un autre compartiment ou préfixe évite une boucle d'appels récursifs.
  options:
    a:
      en: Polling from an EC2 instance means managing a server and adds up to a minute of delay; it is not event-driven.
      fr: Interroger depuis une instance EC2 implique de gérer un serveur et ajoute jusqu'à une minute de délai ; ce n'est pas basé sur les événements.
    b:
      en: Inventory reports are produced daily or weekly, so thumbnails would be created hours after the upload.
      fr: Les rapports d'inventaire sont produits chaque jour ou chaque semaine ; les miniatures seraient donc créées des heures après le chargement.
    c:
      en: Lifecycle rules transition objects between storage classes or expire them; they do not run code to resize images.
      fr: Les règles de cycle de vie font passer des objets d'une classe de stockage à une autre ou les font expirer ; elles n'exécutent pas de code pour redimensionner des images.
references:
  - title: Amazon S3 Event Notifications
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
