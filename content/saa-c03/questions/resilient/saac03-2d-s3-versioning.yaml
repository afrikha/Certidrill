id: saac03-2d-s3-versioning
objective: "2.2.17"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A design agency stores project files in an Amazon S3 bucket. Users sometimes overwrite or delete files by mistake. The agency needs to be able to recover any earlier version of a file for 90 days after it was replaced or deleted.

    The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une agence de design stocke des fichiers de projets dans un compartiment Amazon S3. Des utilisateurs écrasent ou suppriment parfois des fichiers par erreur. L'agence doit pouvoir récupérer n'importe quelle version antérieure d'un fichier pendant 90 jours après son remplacement ou sa suppression.

    La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a lifecycle rule that transitions all objects to S3 Glacier Flexible Retrieval one day after they are created.", fr: "Créer une règle de cycle de vie qui fait passer tous les objets vers S3 Glacier Flexible Retrieval un jour après leur création." } }
    - { id: b, text: { en: "Enable server access logging on the bucket so that deleted files can be identified and uploaded again.", fr: "Activer la journalisation des accès au serveur sur le compartiment afin d'identifier les fichiers supprimés et de les charger à nouveau." } }
    - { id: c, text: { en: "Run an S3 Batch Operations job every night that copies all objects to a second bucket.", fr: "Exécuter chaque nuit une tâche S3 Batch Operations qui copie tous les objets vers un deuxième compartiment." } }
    - { id: d, text: { en: "Enable S3 Versioning and add a lifecycle rule that expires noncurrent versions 90 days after they become noncurrent.", fr: "Activer S3 Versioning et ajouter une règle de cycle de vie qui fait expirer les versions non actuelles 90 jours après qu'elles le sont devenues." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With S3 Versioning, an overwrite creates a new version and a delete inserts a delete marker, so every earlier version stays recoverable. A lifecycle rule on noncurrent versions removes them automatically after 90 days, which limits storage cost without any manual task.
    fr: |
      Avec S3 Versioning, un écrasement crée une nouvelle version et une suppression insère un marqueur de suppression : chaque version antérieure reste récupérable. Une règle de cycle de vie sur les versions non actuelles les supprime automatiquement après 90 jours, ce qui limite le coût de stockage sans aucune tâche manuelle.
  options:
    a: { en: "Changing the storage class does not keep earlier versions; an overwrite or delete still replaces or removes the only copy.", fr: "Changer de classe de stockage ne conserve pas les versions antérieures ; un écrasement ou une suppression remplace ou retire toujours l'unique copie." }
    b: { en: "Access logs record requests, not object data, so they cannot restore a deleted or overwritten file.", fr: "Les journaux d'accès enregistrent les requêtes, pas les données des objets : ils ne peuvent pas restaurer un fichier supprimé ou écrasé." }
    c: { en: "A nightly copy keeps only the latest state of each object, loses changes made during the day, and adds a job to run and monitor.", fr: "Une copie nocturne ne conserve que le dernier état de chaque objet, perd les modifications faites dans la journée et ajoute une tâche à exécuter et à surveiller." }
references:
  - title: Retaining multiple versions of objects with S3 Versioning
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
