id: saac03-2c-single-region-multi-az
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company must keep all patient data inside one country, and that country has a single AWS Region. The application runs on Amazon EC2 instances in one Availability Zone and uses an Amazon RDS for PostgreSQL Single-AZ DB instance. The company needs the application and the database to keep running if a data center fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé doit conserver toutes les données des patients dans un seul pays, et ce pays dispose d'une seule Région AWS. L'application s'exécute sur des instances Amazon EC2 dans une seule zone de disponibilité et utilise une instance de base de données Amazon RDS for PostgreSQL Single-AZ. L'entreprise a besoin que l'application et la base de données continuent de fonctionner en cas de défaillance d'un centre de données.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy a copy of the application in a second Region and replicate the database with a cross-Region read replica."
        fr: "Déployer une copie de l'application dans une deuxième Région et répliquer la base de données avec un réplica en lecture entre Régions."
    - id: b
      text:
        en: "Move the instances to larger instance types and enable EC2 automatic recovery in the current Availability Zone."
        fr: "Passer à des types d'instances plus grands et activer la récupération automatique EC2 dans la zone de disponibilité actuelle."
    - id: c
      text:
        en: "Run the instances in an Auto Scaling group across two Availability Zones behind a load balancer, and convert the DB instance to Multi-AZ."
        fr: "Exécuter les instances dans un groupe Auto Scaling sur deux zones de disponibilité derrière un équilibreur de charge, et convertir l'instance de base de données en Multi-AZ."
    - id: d
      text:
        en: "Place the application behind Amazon CloudFront and cache the application pages at edge locations in the country."
        fr: "Placer l'application derrière Amazon CloudFront et mettre en cache les pages de l'application dans des emplacements périphériques du pays."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Availability Zones are isolated locations inside a Region, so spreading the instances across several zones and using a Multi-AZ DB instance protects against the failure of one location while all data stays in the country's Region. A Region is the residency boundary; AWS does not replicate resources to other Regions unless you configure it.
    fr: |
      Les zones de disponibilité sont des emplacements isolés au sein d'une Région : répartir les instances sur plusieurs zones et utiliser une instance de base de données Multi-AZ protège contre la défaillance d'un emplacement, tandis que toutes les données restent dans la Région du pays. La Région est la limite de résidence ; AWS ne réplique pas les ressources vers d'autres Régions sauf si vous le configurez.
  options:
    a:
      en: |
        A second Region would be outside the country, because the country has only one Region; the data residency requirement would be violated.
      fr: |
        Une deuxième Région se trouverait hors du pays, puisque le pays ne compte qu'une Région ; l'exigence de résidence des données ne serait pas respectée.
    b:
      en: |
        Everything stays in one Availability Zone, so a failure of that location still stops the application and the Single-AZ database.
      fr: |
        Tout reste dans une seule zone de disponibilité : une défaillance de cet emplacement arrête toujours l'application et la base de données Single-AZ.
    d:
      en: |
        CloudFront caches content, but the application servers and the database remain in one Availability Zone and stop if it fails.
      fr: |
        CloudFront met le contenu en cache, mais les serveurs d'application et la base de données restent dans une seule zone de disponibilité et s'arrêtent en cas de défaillance.
references:
  - title: Regions and Zones
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html
