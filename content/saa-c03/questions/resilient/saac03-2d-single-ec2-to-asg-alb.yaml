id: saac03-2d-single-ec2-to-asg-alb
objective: "2.2.16"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a stateless web application on a single Amazon EC2 instance with an Elastic IP address in one Availability Zone. Last month, a failure of the instance took the website down for several hours.

    The company needs the website to remain available if an instance or an entire Availability Zone fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web sans état sur une seule instance Amazon EC2, avec une adresse IP Elastic, dans une zone de disponibilité. Le mois dernier, une panne de l'instance a rendu le site indisponible pendant plusieurs heures.

    L'entreprise a besoin que le site reste disponible en cas de panne d'une instance ou d'une zone de disponibilité entière.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Move the application to a larger instance type and enable EC2 automatic instance recovery.", fr: "Passer l'application sur un type d'instance plus grand et activer la récupération automatique de l'instance EC2." } }
    - { id: b, text: { en: "Run the application from an AMI in an Auto Scaling group across two or more Availability Zones behind an Application Load Balancer, with ELB health checks.", fr: "Exécuter l'application à partir d'une AMI dans un groupe Auto Scaling réparti sur au moins deux zones de disponibilité derrière un Application Load Balancer, avec des vérifications de l'état ELB." } }
    - { id: c, text: { en: "Take daily EBS snapshots with Amazon Data Lifecycle Manager and launch a new instance from the latest snapshot when the instance fails.", fr: "Créer des instantanés EBS quotidiens avec Amazon Data Lifecycle Manager et lancer une nouvelle instance à partir du dernier instantané en cas de panne de l'instance." } }
    - { id: d, text: { en: "Launch a second instance in the same Availability Zone in a cluster placement group and put both instances behind an Application Load Balancer.", fr: "Lancer une deuxième instance dans la même zone de disponibilité, dans un groupe de placement de cluster, et placer les deux instances derrière un Application Load Balancer." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Auto Scaling group that spans several Availability Zones keeps instances in more than one zone, and the Application Load Balancer sends traffic only to healthy targets. With ELB health checks, the group replaces instances that fail, and if a whole zone is lost the remaining zones keep serving users. Because the application is stateless, any instance can serve any request.
    fr: |
      Un groupe Auto Scaling réparti sur plusieurs zones de disponibilité maintient des instances dans plus d'une zone, et l'Application Load Balancer n'envoie le trafic qu'aux cibles saines. Avec les vérifications de l'état ELB, le groupe remplace les instances défaillantes, et si une zone entière est perdue, les autres zones continuent de servir les utilisateurs. Comme l'application est sans état, n'importe quelle instance peut traiter n'importe quelle requête.
  options:
    a: { en: "Recovery helps only when the underlying host fails; there is still a single instance in a single Availability Zone.", fr: "La récupération n'aide qu'en cas de panne de l'hôte sous-jacent ; il reste une seule instance dans une seule zone de disponibilité." }
    c: { en: "Restoring from a snapshot is a manual recovery with downtime, which is the problem the company wants to avoid.", fr: "La restauration à partir d'un instantané est une reprise manuelle avec interruption de service, précisément ce que l'entreprise veut éviter." }
    d: { en: "Both instances stay in one Availability Zone, and a cluster placement group packs them close together, so a zone failure still stops the website.", fr: "Les deux instances restent dans une seule zone de disponibilité, et un groupe de placement de cluster les regroupe physiquement : une panne de zone arrête toujours le site." }
references:
  - title: Use Elastic Load Balancing to distribute incoming application traffic in your Auto Scaling group
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/autoscaling-load-balancer.html
  - title: Auto Scaling group Availability Zone distribution
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-availability-zone-balanced.html
