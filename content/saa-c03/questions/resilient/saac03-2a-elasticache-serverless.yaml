id: saac03-2a-elasticache-serverless
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company is launching an application whose traffic is unpredictable and spikes suddenly during live events. The application needs a Valkey-compatible cache in front of its Amazon Aurora database. The cache must be highly available across multiple Availability Zones. The team does not want to forecast or manage cache capacity, and the solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias lance une application dont le trafic est imprévisible et connaît des pics soudains pendant les événements en direct. L'application a besoin d'un cache compatible Valkey devant sa base de données Amazon Aurora. Le cache doit être hautement disponible sur plusieurs zones de disponibilité. L'équipe ne veut ni prévoir ni gérer la capacité du cache, et la solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon ElastiCache Serverless cache for Valkey, and configure the application to use the cache endpoint.", fr: "Créer un cache Amazon ElastiCache sans serveur pour Valkey, et configurer l'application pour qu'elle utilise le point de terminaison du cache." }
    - id: b
      text: { en: "Create a node-based ElastiCache for Valkey cluster with cluster mode enabled, replicas in three Availability Zones, and auto scaling policies on CPU and memory.", fr: "Créer un cluster ElastiCache for Valkey basé sur des nœuds avec le mode cluster activé, des réplicas dans trois zones de disponibilité et des politiques de mise à l'échelle automatique sur le processeur et la mémoire." }
    - id: c
      text: { en: "Create a node-based ElastiCache for Memcached cluster with nodes in three Availability Zones, and add nodes before each live event.", fr: "Créer un cluster ElastiCache for Memcached basé sur des nœuds avec des nœuds dans trois zones de disponibilité, et ajouter des nœuds avant chaque événement en direct." }
    - id: d
      text: { en: "Add Aurora Replicas with Aurora Auto Scaling, and direct the cached reads to the reader endpoint.", fr: "Ajouter des réplicas Aurora avec Aurora Auto Scaling, et diriger les lectures mises en cache vers le point de terminaison du lecteur." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      ElastiCache Serverless requires no capacity planning; it scales vertically and horizontally on its own and always stores data redundantly across multiple Availability Zones. Applications use a single endpoint, and software upgrades are applied automatically, which gives the lowest operational overhead for unpredictable traffic.
    fr: |
      ElastiCache sans serveur ne demande aucune planification de capacité ; il se met à l'échelle verticalement et horizontalement de lui-même et stocke toujours les données de façon redondante sur plusieurs zones de disponibilité. Les applications utilisent un point de terminaison unique, et les mises à niveau logicielles sont appliquées automatiquement, ce qui offre la plus faible charge opérationnelle pour un trafic imprévisible.
  options:
    b: { en: "A node-based cluster with auto scaling works, but the team must choose node types, tune scaling policies, monitor capacity and manage upgrades, which is more overhead than serverless.", fr: "Un cluster basé sur des nœuds avec mise à l'échelle automatique fonctionne, mais l'équipe doit choisir les types de nœuds, régler les politiques, surveiller la capacité et gérer les mises à niveau, ce qui représente plus de charge que le mode sans serveur." }
    c: { en: "Memcached is not Valkey-compatible, node-based Memcached has no replication, and adding nodes manually before events is capacity management.", fr: "Memcached n'est pas compatible Valkey, Memcached basé sur des nœuds n'offre pas de réplication, et ajouter des nœuds manuellement avant les événements relève de la gestion de capacité." }
    d: { en: "Aurora Replicas scale database reads but are not a Valkey-compatible in-memory cache.", fr: "Les réplicas Aurora mettent à l'échelle les lectures de la base de données, mais ne sont pas un cache en mémoire compatible Valkey." }
references:
  - title: Choosing between deployment options
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.deployment.html
