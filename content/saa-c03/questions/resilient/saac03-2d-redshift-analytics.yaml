id: saac03-2d-redshift-analytics
objective: "2.2.20"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs complex analytical SQL queries that join several years of sales history directly on its production Amazon RDS for PostgreSQL database. The queries slow down order processing. The data volume is expected to grow to several petabytes.

    The company wants a purpose-built, fully managed service for these analytical queries that works with its existing SQL-based business intelligence (BI) tools.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des requêtes SQL analytiques complexes qui joignent plusieurs années d'historique des ventes directement sur sa base de données de production Amazon RDS for PostgreSQL. Ces requêtes ralentissent le traitement des commandes. Le volume de données devrait atteindre plusieurs pétaoctets.

    L'entreprise veut un service spécialisé et entièrement géré pour ces requêtes analytiques, compatible avec ses outils de business intelligence (BI) existants basés sur SQL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Load the sales history into Amazon DynamoDB and run the reports with DynamoDB queries.", fr: "Charger l'historique des ventes dans Amazon DynamoDB et produire les rapports avec des requêtes DynamoDB." } }
    - { id: b, text: { en: "Load the sales history into an Amazon Redshift data warehouse and connect the BI tools to it.", fr: "Charger l'historique des ventes dans un entrepôt de données Amazon Redshift et y connecter les outils de BI." } }
    - { id: c, text: { en: "Cache the results of the analytical queries in Amazon ElastiCache for Valkey.", fr: "Mettre en cache les résultats des requêtes analytiques dans Amazon ElastiCache for Valkey." } }
    - { id: d, text: { en: "Load the sales history into Amazon Neptune and connect the BI tools to it.", fr: "Charger l'historique des ventes dans Amazon Neptune et y connecter les outils de BI." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Amazon Redshift is a fully managed, petabyte-scale data warehouse built for analytical SQL queries. BI tools connect to it with the same SQL-based tools that the company already uses, and moving the analytical workload off RDS stops it from slowing order processing.
    fr: |
      Amazon Redshift est un entrepôt de données entièrement géré, à l'échelle du pétaoctet, conçu pour les requêtes SQL analytiques. Les outils de BI s'y connectent avec les mêmes outils basés sur SQL que l'entreprise utilise déjà, et sortir la charge analytique de RDS l'empêche de ralentir le traitement des commandes.
  options:
    a: { en: "DynamoDB is a key-value and document database for transactional access patterns; it does not run complex SQL joins for BI tools.", fr: "DynamoDB est une base de données clé-valeur et document pour des modèles d'accès transactionnels ; elle n'exécute pas de jointures SQL complexes pour des outils de BI." }
    c: { en: "A cache stores results that have already been computed; the analytical queries would still run on the production database.", fr: "Un cache stocke des résultats déjà calculés ; les requêtes analytiques s'exécuteraient toujours sur la base de données de production." }
    d: { en: "Neptune is a graph database for highly connected data, not a SQL data warehouse for BI reporting.", fr: "Neptune est une base de données orientée graphe pour des données fortement connectées, pas un entrepôt de données SQL pour le reporting BI." }
references:
  - title: What is Amazon Redshift?
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html
