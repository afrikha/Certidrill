id: saac03-2b-sfn-distributed-map
objective: "2.1.16"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores millions of scanned documents as objects in an Amazon S3 bucket. An AWS Lambda function must extract metadata from each existing document. The company wants to process the objects in parallel with thousands of concurrent invocations, track the result of each item, and stop the job automatically if more than 5% of the items fail, without writing custom orchestration code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des millions de documents numérisés sous forme d'objets dans un compartiment Amazon S3. Une fonction AWS Lambda doit extraire les métadonnées de chaque document existant. L'entreprise veut traiter les objets en parallèle avec des milliers d'appels simultanés, suivre le résultat de chaque élément et arrêter automatiquement la tâche si plus de 5 % des éléments échouent, sans écrire de code d'orchestration personnalisé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a Step Functions Standard workflow with an inline Map state that iterates over the object keys passed in the execution input.", fr: "Utiliser un flux de travail Standard Step Functions avec un état Map inline qui parcourt les clés d'objet passées dans l'entrée de l'exécution." }
    - id: b
      text: { en: "Use a Step Functions Standard workflow with a Distributed Map state that reads the objects from the bucket and tolerates at most 5% failed items.", fr: "Utiliser un flux de travail Standard Step Functions avec un état Distributed Map qui lit les objets du compartiment et tolère au plus 5 % d'éléments en échec." }
    - id: c
      text: { en: "Configure an S3 event notification for object-created events that invokes the Lambda function for each document in the bucket.", fr: "Configurer une notification d'événement S3 pour les événements de création d'objet qui appelle la fonction Lambda pour chaque document du compartiment." }
    - id: d
      text: { en: "Use a Step Functions Express workflow with a Distributed Map state that reads the objects from the bucket and tolerates at most 5% failed items.", fr: "Utiliser un flux de travail Express Step Functions avec un état Distributed Map qui lit les objets du compartiment et tolère au plus 5 % d'éléments en échec." }
answer: { optionId: b }
explanation:
  correct:
    en: In Distributed mode, a Map state reads a large set of S3 objects as its dataset and runs each item as a child workflow execution, with up to 10,000 in parallel. A tolerated failure percentage fails the Map Run when too many items fail, and each child execution has its own history.
    fr: En mode distribué, un état Map lit un grand ensemble d'objets S3 comme jeu de données et exécute chaque élément comme une exécution de flux de travail enfant, jusqu'à 10 000 en parallèle. Un pourcentage d'échecs toléré fait échouer le Map Run lorsque trop d'éléments échouent, et chaque exécution enfant a son propre historique.
  options:
    a:
      en: Inline mode is limited by the execution input size and history, and AWS recommends Distributed mode beyond 40 concurrent iterations or a 256 KiB dataset; millions of keys do not fit.
      fr: Le mode inline est limité par la taille de l'entrée et de l'historique de l'exécution, et AWS recommande le mode distribué au-delà de 40 itérations simultanées ou d'un jeu de données de 256 Kio ; des millions de clés ne tiennent pas.
    c:
      en: Event notifications fire only for new events, so existing documents would not be processed, and there is no failure threshold.
      fr: Les notifications d'événement ne se déclenchent que pour de nouveaux événements ; les documents existants ne seraient donc pas traités, et il n'existe aucun seuil d'échec.
    d:
      en: The Distributed Map state is supported in Standard workflows, not in Express workflows, and an Express workflow also stops after 5 minutes.
      fr: L'état Distributed Map est pris en charge dans les flux de travail Standard, pas dans les flux Express, et un flux Express s'arrête en outre après 5 minutes.
references:
  - title: Using Map state in Distributed mode for large-scale parallel workloads in Step Functions
    url: https://docs.aws.amazon.com/step-functions/latest/dg/state-map-distributed.html
