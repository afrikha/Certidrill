id: saac03-2a-lambda-async-destination
objective: "2.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Amazon S3 event notifications invoke an AWS Lambda function asynchronously to process uploaded invoices. Some invocations still fail after Lambda's automatic retries, and those events are lost. The operations team needs a record of each failed event, including the original request payload and the error details, so that it can reprocess the event later. The solution must require the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Des notifications d'événements Amazon S3 appellent de façon asynchrone une fonction AWS Lambda qui traite les factures envoyées. Certains appels échouent encore après les nouvelles tentatives automatiques de Lambda, et ces événements sont perdus. L'équipe d'exploitation a besoin d'un enregistrement de chaque événement en échec, avec la charge utile d'origine et le détail de l'erreur, pour pouvoir retraiter l'événement plus tard. La solution doit nécessiter le MOINS d'effort.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the timeout and the memory of the function so that fewer invocations fail.", fr: "Augmenter le délai d'expiration et la mémoire de la fonction afin que moins d'appels échouent." }
    - id: b
      text: { en: "Enable S3 Versioning on the bucket so that every uploaded invoice can be processed again.", fr: "Activer S3 Versioning sur le compartiment afin que chaque facture envoyée puisse être traitée de nouveau." }
    - id: c
      text: { en: "Configure an on-failure destination, such as an SQS queue, for the function's asynchronous invocations.", fr: "Configurer une destination en cas d'échec, comme une file d'attente SQS, pour les appels asynchrones de la fonction." }
    - id: d
      text: { en: "Turn on AWS CloudTrail data events for Lambda, and search the trail for failed invocations.", fr: "Activer les événements de données AWS CloudTrail pour Lambda, et rechercher les appels en échec dans le journal de suivi." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For asynchronous invocations, Lambda can send a record of each invocation that fails all its attempts (or exceeds its maximum event age) to an on-failure destination such as an SQS queue, an SNS topic, an EventBridge event bus, another function or an S3 bucket. The record contains the request payload and the response with the error details, so the event can be reprocessed.
    fr: |
      Pour les appels asynchrones, Lambda peut envoyer un enregistrement de chaque appel qui échoue à toutes ses tentatives (ou dépasse son âge maximal d'événement) vers une destination en cas d'échec, comme une file SQS, une rubrique SNS, un bus d'événements EventBridge, une autre fonction ou un compartiment S3. L'enregistrement contient la charge utile de la requête et la réponse avec le détail de l'erreur : l'événement peut être retraité.
  options:
    a: { en: "More timeout and memory may reduce some failures, but failed events are still discarded with no record.", fr: "Plus de délai et de mémoire peuvent réduire certains échecs, mais les événements en échec restent supprimés sans aucun enregistrement." }
    b: { en: "Versioning keeps object versions but does not record which events failed or why.", fr: "Le contrôle de version conserve les versions des objets, mais n'enregistre ni quels événements ont échoué ni pourquoi." }
    d: { en: "CloudTrail records API activity, not the event payloads and function errors needed to reprocess events.", fr: "CloudTrail enregistre l'activité des API, pas les charges utiles des événements ni les erreurs de la fonction nécessaires au retraitement." }
references:
  - title: Capturing records of Lambda asynchronous invocations
    url: https://docs.aws.amazon.com/lambda/latest/dg/invocation-async-retain-records.html
