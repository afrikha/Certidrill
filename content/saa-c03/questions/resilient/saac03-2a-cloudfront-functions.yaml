id: saac03-2a-cloudfront-functions
objective: "2.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media website is served through Amazon CloudFront and receives millions of requests per second. At the edge, the company must rewrite legacy URLs from /old/ paths to /new/ paths on each viewer request and add a security header to each viewer response. The logic is simple header and URL manipulation with no network calls. The company wants the lowest latency and cost.

    Which solution will meet these requirements?
  fr: |
    Un site web de médias est servi via Amazon CloudFront et reçoit des millions de requêtes par seconde. En périphérie, l'entreprise doit réécrire les anciennes URL des chemins /old/ vers les chemins /new/ à chaque requête de l'utilisateur et ajouter un en-tête de sécurité à chaque réponse à l'utilisateur. La logique se limite à une manipulation simple d'en-têtes et d'URL, sans appel réseau. L'entreprise veut la latence et le coût les plus faibles.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Write Lambda@Edge functions, and associate them with the viewer request and viewer response events of the cache behavior.", fr: "Écrire des fonctions Lambda@Edge, et les associer aux événements de requête et de réponse utilisateur (viewer) du comportement de cache." }
    - id: b
      text: { en: "Write CloudFront Functions, and associate them with the viewer request and viewer response events of the cache behavior.", fr: "Écrire des fonctions CloudFront Functions, et les associer aux événements de requête et de réponse utilisateur (viewer) du comportement de cache." }
    - id: c
      text: { en: "Add redirect rules to the origin Application Load Balancer, and add the security header in the application on the origin servers.", fr: "Ajouter des règles de redirection sur l'Application Load Balancer d'origine, et ajouter l'en-tête de sécurité dans l'application sur les serveurs d'origine." }
    - id: d
      text: { en: "Configure redirection rules in the static website configuration of the origin S3 bucket, and enable compression on the distribution.", fr: "Configurer des règles de redirection dans la configuration de site web statique du compartiment S3 d'origine, et activer la compression sur la distribution." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      CloudFront Functions run lightweight JavaScript on viewer request and viewer response events with submillisecond execution and scale to millions of requests per second. URL rewrites and header manipulation are their typical use cases, so they meet the needs at the lowest latency and cost.
    fr: |
      CloudFront Functions exécutent du JavaScript léger sur les événements de requête et de réponse utilisateur, avec une exécution inférieure à la milliseconde, et montent jusqu'à des millions de requêtes par seconde. Les réécritures d'URL et la manipulation d'en-têtes sont leurs cas d'usage typiques : elles répondent au besoin avec la latence et le coût les plus faibles.
  options:
    a: { en: "Lambda@Edge also works, but it is designed for heavier logic (network access, up to 30 seconds), scales to about 10,000 requests per second per Region and costs more for simple manipulations.", fr: "Lambda@Edge fonctionne aussi, mais il est conçu pour une logique plus lourde (accès réseau, jusqu'à 30 secondes), monte à environ 10 000 requêtes par seconde par Région et coûte plus cher pour des manipulations simples." }
    c: { en: "Logic at the origin runs only on cache misses or adds a round trip to the origin, so it is neither at the edge nor the lowest latency.", fr: "Une logique à l'origine ne s'exécute que lors des échecs d'accès au cache ou ajoute un aller-retour vers l'origine : elle n'est ni en périphérie ni à la latence la plus faible." }
    d: { en: "S3 website redirection rules run at the origin, cannot add the security header, and compression does not address the requirement.", fr: "Les règles de redirection de site web S3 s'exécutent à l'origine, ne peuvent pas ajouter l'en-tête de sécurité, et la compression ne répond pas à l'exigence." }
references:
  - title: Differences between CloudFront Functions and Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
