id: saac03-2d-ec2-recover-legacy
objective: "2.2.19"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a legacy license server on a single Amazon EC2 instance that uses only Amazon EBS volumes. The license file is bound to the instance ID and the private IP address of the instance. The application cannot be modified and cannot run on more than one instance.

    The company wants the instance to recover automatically if the underlying host hardware fails, and the operations team must receive an email each time a recovery occurs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un serveur de licences hérité sur une seule instance Amazon EC2 qui n'utilise que des volumes Amazon EBS. Le fichier de licence est lié à l'ID de l'instance et à son adresse IP privée. L'application ne peut pas être modifiée et ne peut pas s'exécuter sur plus d'une instance.

    L'entreprise veut que l'instance soit récupérée automatiquement en cas de panne du matériel de l'hôte sous-jacent, et l'équipe des opérations doit recevoir un e-mail à chaque récupération.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Place the instance in an Auto Scaling group with a minimum, maximum, and desired capacity of one, across two Availability Zones, with an Amazon SNS notification for launch events.", fr: "Placer l'instance dans un groupe Auto Scaling d'une capacité minimale, maximale et souhaitée d'une instance, sur deux zones de disponibilité, avec une notification Amazon SNS pour les événements de lancement." } }
    - { id: b, text: { en: "Create a CloudWatch alarm on the StatusCheckFailed_Instance metric with the EC2 reboot action and an Amazon SNS topic that has an email subscription.", fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed_Instance avec l'action de redémarrage EC2 et une rubrique Amazon SNS dotée d'un abonnement par e-mail." } }
    - { id: c, text: { en: "Create an Amazon EventBridge rule on instance state changes that invokes an AWS Lambda function to launch a replacement instance from the latest AMI and send an email.", fr: "Créer une règle Amazon EventBridge sur les changements d'état de l'instance qui appelle une fonction AWS Lambda chargée de lancer une instance de remplacement à partir de la dernière AMI et d'envoyer un e-mail." } }
    - { id: d, text: { en: "Create a CloudWatch alarm on the StatusCheckFailed_System metric with the EC2 recover action and an Amazon SNS topic that has an email subscription.", fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed_System avec l'action de récupération EC2 et une rubrique Amazon SNS dotée d'un abonnement par e-mail." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A failed system status check indicates a problem with the underlying host. The recover action moves the instance to new hardware and keeps its instance ID, private and Elastic IP addresses, metadata, and attached EBS volumes, so the license stays valid. CloudWatch action-based recovery can notify an SNS topic, which emails the team; simplified automatic recovery, on by default for supported instances, notifies only through the AWS Health Dashboard.
    fr: |
      L'échec d'une vérification du statut du système signale un problème de l'hôte sous-jacent. L'action de récupération déplace l'instance vers un nouveau matériel et conserve son ID d'instance, ses adresses IP privées et Elastic, ses métadonnées et ses volumes EBS attachés : la licence reste valide. La récupération basée sur une action CloudWatch peut notifier une rubrique SNS, qui envoie un e-mail à l'équipe ; la récupération automatique simplifiée, active par défaut sur les instances prises en charge, ne notifie que via AWS Health Dashboard.
  options:
    a: { en: "Auto Scaling replaces a failed instance with a new instance that has a new instance ID and private IP address, which invalidates the license.", fr: "Auto Scaling remplace une instance défaillante par une nouvelle instance dotée d'un nouvel ID et d'une nouvelle adresse IP privée, ce qui invalide la licence." }
    b: { en: "The instance status check detects problems inside the instance, such as the operating system, and a reboot keeps the instance on the same faulty host.", fr: "La vérification du statut de l'instance détecte des problèmes internes à l'instance, comme le système d'exploitation, et un redémarrage laisse l'instance sur le même hôte défaillant." }
    c: { en: "A replacement instance launched from an AMI gets a new instance ID, and the custom function adds code to maintain.", fr: "Une instance de remplacement lancée à partir d'une AMI reçoit un nouvel ID d'instance, et la fonction personnalisée ajoute du code à maintenir." }
references:
  - title: Automatic instance recovery
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-recover.html
