id: saac03-2a-cloudfront-s3-oac
objective: "2.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts a static website (HTML pages, scripts and images) in an Amazon S3 bucket in the us-east-1 Region. Users in Europe and Asia report slow page loads. The bucket must not be publicly accessible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge un site web statique (pages HTML, scripts et images) dans un compartiment Amazon S3 de la Région us-east-1. Les utilisateurs d'Europe et d'Asie signalent des chargements de pages lents. Le compartiment ne doit pas être accessible publiquement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 static website hosting, and grant public read access to the objects through a bucket policy.", fr: "Activer l'hébergement de site web statique S3, et accorder l'accès public en lecture aux objets par une politique de compartiment." }
    - id: b
      text: { en: "Replicate the bucket to Regions in Europe and Asia, and use Route 53 latency-based routing to the website endpoint of each bucket.", fr: "Répliquer le compartiment vers des Régions d'Europe et d'Asie, et utiliser le routage basé sur la latence de Route 53 vers le point de terminaison de site web de chaque compartiment." }
    - id: c
      text: { en: "Create an AWS Global Accelerator accelerator, and add the S3 bucket as an endpoint.", fr: "Créer un accélérateur AWS Global Accelerator, et ajouter le compartiment S3 comme point de terminaison." }
    - id: d
      text: { en: "Create a CloudFront distribution with the bucket as its origin and an origin access control, and allow only that distribution in the bucket policy.", fr: "Créer une distribution CloudFront avec le compartiment comme origine et un contrôle d'accès d'origine, et n'autoriser que cette distribution dans la politique de compartiment." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      CloudFront caches the static content at edge locations close to the users, which reduces load times worldwide. With origin access control (OAC), CloudFront signs its requests to the bucket, and a bucket policy that allows the `cloudfront.amazonaws.com` service principal for that distribution's ARN keeps the bucket private.
    fr: |
      CloudFront met en cache le contenu statique dans des emplacements périphériques proches des utilisateurs, ce qui réduit les temps de chargement partout dans le monde. Avec le contrôle d'accès d'origine (OAC), CloudFront signe ses requêtes vers le compartiment, et une politique de compartiment qui autorise le principal de service `cloudfront.amazonaws.com` pour l'ARN de cette distribution garde le compartiment privé.
  options:
    a: { en: "Website hosting with public read access makes the bucket public, and it does not bring the content closer to distant users.", fr: "L'hébergement de site web avec accès public en lecture rend le compartiment public, et ne rapproche pas le contenu des utilisateurs éloignés." }
    b: { en: "S3 website endpoints require public access, and running replicated buckets in several Regions adds cost and management compared with a CDN.", fr: "Les points de terminaison de site web S3 exigent un accès public, et exploiter des compartiments répliqués dans plusieurs Régions ajoute du coût et de la gestion par rapport à un CDN." }
    c: { en: "Global Accelerator endpoints are load balancers, EC2 instances and Elastic IP addresses, not S3 buckets, and it does not cache content.", fr: "Les points de terminaison de Global Accelerator sont des équilibreurs de charge, des instances EC2 et des adresses IP Elastic, pas des compartiments S3, et il ne met pas le contenu en cache." }
references:
  - title: Restrict access to an Amazon S3 origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
