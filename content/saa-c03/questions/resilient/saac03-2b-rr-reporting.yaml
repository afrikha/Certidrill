id: saac03-2b-rr-reporting
objective: "2.1.15"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance that supports an online store. The business intelligence team runs long reporting queries during business hours, which slows down customer transactions. The reports can use data that is a few seconds behind the production data.

    Which solution will improve the performance of the online store with the LEAST operational overhead?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL qui prend en charge une boutique en ligne. L'équipe de business intelligence exécute de longues requêtes de reporting pendant les heures ouvrables, ce qui ralentit les transactions des clients. Les rapports peuvent utiliser des données en retard de quelques secondes sur les données de production.

    Quelle solution permet d'améliorer les performances de la boutique en ligne avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Convert the DB instance to a Multi-AZ DB instance deployment, and run the reports against the standby instance.", fr: "Convertir l'instance de base de données en déploiement d'instance de base de données Multi-AZ, et exécuter les rapports sur l'instance de secours." }
    - id: b
      text: { en: "Restore the latest automated snapshot to a new DB instance every night, and run the reports against that instance.", fr: "Restaurer chaque nuit le dernier instantané automatisé dans une nouvelle instance de base de données, et exécuter les rapports sur celle-ci." }
    - id: c
      text: { en: "Create a read replica of the DB instance, and point the reporting tool to the endpoint of the read replica.", fr: "Créer un réplica en lecture de l'instance de base de données, et faire pointer l'outil de reporting vers le point de terminaison du réplica." }
    - id: d
      text: { en: "Move the DB instance to a larger instance class, and keep running the reports against the primary instance.", fr: "Passer l'instance de base de données à une classe d'instance supérieure, et continuer à exécuter les rapports sur l'instance principale." }
answer: { optionId: c }
explanation:
  correct:
    en: A read replica is a read-only copy that RDS keeps up to date with asynchronous replication. Routing the reporting queries to the replica removes that load from the primary instance, and the reports tolerate the small replication lag. Business reporting is one of the documented use cases for read replicas.
    fr: Un réplica en lecture est une copie en lecture seule que RDS maintient à jour par réplication asynchrone. Diriger les requêtes de reporting vers le réplica retire cette charge de l'instance principale, et les rapports tolèrent le faible retard de réplication. Le reporting métier fait partie des cas d'usage documentés des réplicas en lecture.
  options:
    a:
      en: In a Multi-AZ DB instance deployment, the standby cannot serve read traffic; it exists only for high availability and failover.
      fr: Dans un déploiement d'instance de base de données Multi-AZ, l'instance de secours ne peut pas servir de trafic en lecture ; elle n'existe que pour la haute disponibilité et le basculement.
    b:
      en: A nightly restore gives data up to a day old and adds a recurring manual process, which does not meet the freshness need or minimize overhead.
      fr: Une restauration nocturne fournit des données vieilles d'un jour au plus et ajoute un processus récurrent, ce qui ne répond pas au besoin de fraîcheur et ne réduit pas la charge opérationnelle.
    d:
      en: A larger instance costs more for every hour and still makes reports and transactions compete for the same resources.
      fr: Une instance plus grande coûte plus cher à chaque heure et laisse toujours les rapports et les transactions se disputer les mêmes ressources.
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
