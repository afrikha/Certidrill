id: saac03-2d-aurora-global-db
objective: "2.2.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs an Amazon Aurora MySQL-Compatible Edition DB cluster in us-east-1. A new business continuity requirement states that if the whole Region becomes unavailable, the database must be recoverable in us-west-2 with an RPO of a few seconds and an RTO of minutes. Analysts in the western United States also need low-latency read access to the data.

    The application must continue to use a MySQL-compatible database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute un cluster de bases de données Amazon Aurora MySQL-Compatible Edition dans us-east-1. Une nouvelle exigence de continuité d'activité impose que, si toute la Région devient indisponible, la base de données puisse être récupérée dans us-west-2 avec un RPO de quelques secondes et un RTO de quelques minutes. Des analystes de l'ouest des États-Unis ont aussi besoin d'un accès en lecture à faible latence aux données.

    L'application doit continuer à utiliser une base de données compatible MySQL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Add Aurora Replicas in two other Availability Zones of us-east-1 and rely on automatic failover.", fr: "Ajouter des réplicas Aurora dans deux autres zones de disponibilité de us-east-1 et s'appuyer sur le basculement automatique." } }
    - { id: b, text: { en: "Convert the cluster to an Aurora global database with a secondary cluster in us-west-2.", fr: "Convertir le cluster en base de données globale Aurora avec un cluster secondaire dans us-west-2." } }
    - { id: c, text: { en: "Create an AWS Backup plan that copies cluster snapshots to us-west-2 every hour.", fr: "Créer un plan AWS Backup qui copie des instantanés du cluster vers us-west-2 toutes les heures." } }
    - { id: d, text: { en: "Migrate the data to Amazon DynamoDB global tables with replicas in us-east-1 and us-west-2.", fr: "Migrer les données vers des tables globales Amazon DynamoDB avec des réplicas dans us-east-1 et us-west-2." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An Aurora global database replicates the cluster storage to up to 10 read-only secondary Regions with latency typically under one second, which gives an RPO of seconds. The secondary cluster serves low-latency reads in us-west-2, and a cross-Region failover promotes it to primary within minutes. The engine stays Aurora MySQL, so the application does not change.
    fr: |
      Une base de données globale Aurora réplique le stockage du cluster vers un maximum de 10 Régions secondaires en lecture seule, avec une latence généralement inférieure à une seconde, ce qui donne un RPO de quelques secondes. Le cluster secondaire sert des lectures à faible latence dans us-west-2, et un basculement entre Régions le promeut en cluster principal en quelques minutes. Le moteur reste Aurora MySQL : l'application ne change pas.
  options:
    a: { en: "Aurora Replicas protect against an Availability Zone failure, but they all stay in us-east-1 and do not survive a Regional outage.", fr: "Les réplicas Aurora protègent contre la panne d'une zone de disponibilité, mais ils restent tous dans us-east-1 et ne survivent pas à une panne régionale." }
    c: { en: "Hourly snapshot copies give an RPO of up to one hour, restoring a cluster takes longer than minutes, and snapshots provide no read access.", fr: "Des copies horaires d'instantanés donnent un RPO pouvant atteindre une heure, la restauration d'un cluster prend plus que quelques minutes, et les instantanés n'offrent aucun accès en lecture." }
    d: { en: "DynamoDB is not MySQL-compatible, so the application would have to be rewritten.", fr: "DynamoDB n'est pas compatible MySQL : l'application devrait être réécrite." }
references:
  - title: Using Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html
