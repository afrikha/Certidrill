id: saac03-2d-backup-org-policies
objective: "2.2.17"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 accounts in AWS Organizations that run Amazon EC2 instances, Amazon EBS volumes, Amazon RDS databases, and Amazon DynamoDB tables. A new compliance rule requires daily backups of every resource tagged backup=daily, kept for 35 days, with a copy in a second AWS Region.

    The compliance team must define this rule once for all accounts and monitor backup jobs centrally. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 60 comptes dans AWS Organizations qui exécutent des instances Amazon EC2, des volumes Amazon EBS, des bases de données Amazon RDS et des tables Amazon DynamoDB. Une nouvelle règle de conformité exige des sauvegardes quotidiennes de chaque ressource étiquetée backup=daily, conservées 35 jours, avec une copie dans une deuxième Région AWS.

    L'équipe de conformité doit définir cette règle une seule fois pour tous les comptes et surveiller les tâches de sauvegarde de façon centralisée. La solution doit avoir le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use AWS CloudFormation StackSets to deploy an AWS Lambda function in each account that snapshots the tagged resources daily, copies the snapshots to the second Region, and deletes them after 35 days.", fr: "Utiliser AWS CloudFormation StackSets pour déployer dans chaque compte une fonction AWS Lambda qui crée chaque jour des instantanés des ressources étiquetées, les copie vers la deuxième Région et les supprime après 35 jours." } }
    - { id: b, text: { en: "Create Amazon Data Lifecycle Manager policies in each account that target the tagged resources, keep the snapshots for 35 days, and copy them to the second Region.", fr: "Créer dans chaque compte des politiques Amazon Data Lifecycle Manager qui ciblent les ressources étiquetées, conservent les instantanés 35 jours et les copient vers la deuxième Région." } }
    - { id: c, text: { en: "Enable backup policies and cross-account monitoring in AWS Backup, and attach an organization backup policy that backs up tagged resources daily for 35 days with a cross-Region copy.", fr: "Activer les politiques de sauvegarde et la surveillance entre comptes dans AWS Backup, et attacher une politique de sauvegarde d'organisation qui sauvegarde chaque jour les ressources étiquetées pendant 35 jours avec une copie entre Régions." } }
    - { id: d, text: { en: "Use AWS CloudFormation StackSets to set a 35-day automated backup retention on every RDS database and to turn on point-in-time recovery for every DynamoDB table.", fr: "Utiliser AWS CloudFormation StackSets pour définir une conservation des sauvegardes automatiques de 35 jours sur chaque base de données RDS et activer la restauration à un instant dans le passé sur chaque table DynamoDB." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      AWS Backup protects EC2, EBS, RDS, DynamoDB, and other services with one backup plan. When the management account enables backup policies and cross-account monitoring, an Organizations backup policy applies the same plan (schedule, retention, copy to another Region, tag-based selection) to every account it is attached to, including accounts added later, and backup jobs can be monitored centrally.
    fr: |
      AWS Backup protège EC2, EBS, RDS, DynamoDB et d'autres services avec un seul plan de sauvegarde. Lorsque le compte de gestion active les politiques de sauvegarde et la surveillance entre comptes, une politique de sauvegarde Organizations applique le même plan (planification, conservation, copie vers une autre Région, sélection par étiquette) à chaque compte auquel elle est attachée, y compris les comptes ajoutés plus tard, et les tâches de sauvegarde peuvent être surveillées de façon centralisée.
  options:
    a: { en: "Custom functions in 60 accounts are code to write, deploy, and maintain, with no central monitoring.", fr: "Des fonctions personnalisées dans 60 comptes sont du code à écrire, à déployer et à maintenir, sans surveillance centralisée." }
    b: { en: "Data Lifecycle Manager manages EBS snapshots and EBS-backed AMIs only, so RDS and DynamoDB are not covered, and the policies must be managed in each account.", fr: "Data Lifecycle Manager ne gère que les instantanés EBS et les AMI basées sur EBS : RDS et DynamoDB ne sont pas couverts, et les politiques doivent être gérées dans chaque compte." }
    d: { en: "This covers only RDS and DynamoDB, creates no copy in the second Region, and gives no central view of backup jobs.", fr: "Cette solution ne couvre que RDS et DynamoDB, ne crée aucune copie dans la deuxième Région et n'offre aucune vue centralisée des tâches de sauvegarde." }
references:
  - title: Managing AWS Backup resources across multiple AWS accounts
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/manage-cross-account.html
  - title: Create a backup plan
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/creating-a-backup-plan.html
