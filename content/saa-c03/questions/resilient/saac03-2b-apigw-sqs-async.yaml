id: saac03-2b-apigw-sqs-async
objective: "2.1.17"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company exposes a REST API on Amazon API Gateway. A POST /reports request invokes an AWS Lambda function synchronously, and the function generates a report in up to 10 minutes. Clients often receive timeout errors, and request bursts sometimes exceed what the report generator can handle. The company wants clients to receive an immediate acknowledgment, requests to be buffered during bursts, and failed report generations to be retried.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise expose une API REST sur Amazon API Gateway. Une requête POST /reports appelle de façon synchrone une fonction AWS Lambda qui génère un rapport en 10 minutes au plus. Les clients reçoivent souvent des erreurs d'expiration, et les pics de requêtes dépassent parfois ce que le générateur de rapports peut absorber. L'entreprise veut que les clients reçoivent un accusé de réception immédiat, que les requêtes soient mises en mémoire tampon pendant les pics et que les générations de rapport en échec soient retentées.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Increase the integration timeout of the POST method and the timeout of the Lambda function to 15 minutes.", fr: "Augmenter le délai d'expiration de l'intégration de la méthode POST et celui de la fonction Lambda à 15 minutes." }
    - id: b
      text: { en: "Change the POST method to an AWS service integration that sends the request body to an Amazon SQS queue.", fr: "Remplacer l'intégration de la méthode POST par une intégration de service AWS qui envoie le corps de la requête dans une file d'attente Amazon SQS." }
    - id: c
      text: { en: "Configure an event source mapping so that the queue invokes the report-generation Lambda function.", fr: "Configurer un mappage de source d'événement pour que la file d'attente appelle la fonction Lambda de génération de rapports." }
    - id: d
      text: { en: "Enable API Gateway caching on the stage for the POST /reports method.", fr: "Activer la mise en cache API Gateway sur l'étape pour la méthode POST /reports." }
    - id: e
      text: { en: "Configure provisioned concurrency on the report-generation Lambda function.", fr: "Configurer la simultanéité provisionnée sur la fonction Lambda de génération de rapports." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: An AWS service integration lets API Gateway write the request directly to an SQS queue and return a response as soon as the message is accepted, which gives an immediate acknowledgment and buffers bursts. An event source mapping then invokes the function from the queue at the pace Lambda can sustain; if a generation fails, the message becomes visible again and is retried (a dead-letter queue can catch repeated failures).
    fr: Une intégration de service AWS permet à API Gateway d'écrire directement la requête dans une file d'attente SQS et de répondre dès que le message est accepté, ce qui donne un accusé de réception immédiat et absorbe les pics. Un mappage de source d'événement appelle ensuite la fonction depuis la file d'attente au rythme que Lambda peut soutenir ; si une génération échoue, le message redevient visible et est retenté (une file d'attente de lettres mortes peut recueillir les échecs répétés).
  options:
    a:
      en: Longer timeouts keep the client connection open for the whole generation, so the acknowledgment is not immediate and bursts are not buffered.
      fr: Des délais d'expiration plus longs gardent la connexion du client ouverte pendant toute la génération ; l'accusé de réception n'est donc pas immédiat et les pics ne sont pas absorbés.
    d:
      en: Caching returns stored responses for repeated requests; it does not queue new report requests or retry failures.
      fr: La mise en cache renvoie des réponses stockées pour des requêtes répétées ; elle ne met pas en file d'attente les nouvelles demandes de rapport et ne retente pas les échecs.
    e:
      en: Provisioned concurrency only reduces cold starts; the request still waits for the whole 10-minute generation.
      fr: La simultanéité provisionnée réduit seulement les démarrages à froid ; la requête attend toujours toute la génération de 10 minutes.
references:
  - title: Integrate Amazon API Gateway with Amazon SQS to handle asynchronous REST APIs
    url: https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/integrate-amazon-api-gateway-with-amazon-sqs-to-handle-asynchronous-rest-apis.html
  - title: Amazon SQS visibility timeout
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
