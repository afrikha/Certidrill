id: saac03-2d-r53-alarm-health-check
objective: "2.2.15"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an internal reporting application on one Amazon EC2 instance in a private subnet in us-east-1, and a standby instance in us-west-2. Employees resolve the application name through an Amazon Route 53 private hosted zone that contains failover records with the private IP addresses of the two instances. The instances have no public IP addresses.

    The company wants DNS to fail over to us-west-2 automatically when the primary instance fails its EC2 status checks.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application interne de reporting sur une instance Amazon EC2 d'un sous-réseau privé de us-east-1, et une instance de secours dans us-west-2. Les employés résolvent le nom de l'application via une zone hébergée privée Amazon Route 53 qui contient des enregistrements de basculement avec les adresses IP privées des deux instances. Les instances n'ont pas d'adresse IP publique.

    L'entreprise veut que le DNS bascule automatiquement vers us-west-2 lorsque l'instance principale échoue à ses vérifications de statut EC2.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Route 53 endpoint health check that sends HTTP requests to the private IP address of the primary instance, and associate it with the primary failover record.", fr: "Créer une vérification de l'état Route 53 de point de terminaison qui envoie des requêtes HTTP à l'adresse IP privée de l'instance principale, et l'associer à l'enregistrement de basculement principal." } }
    - { id: b, text: { en: "Create a calculated health check whose only child is an endpoint health check on the private IP address of the primary instance, and associate it with the primary failover record.", fr: "Créer une vérification de l'état calculée dont le seul enfant est une vérification de l'état de point de terminaison sur l'adresse IP privée de l'instance principale, et l'associer à l'enregistrement de basculement principal." } }
    - { id: c, text: { en: "Create a CloudWatch alarm on the StatusCheckFailed metric of the primary instance, create a Route 53 health check that monitors the alarm, and associate it with the primary failover record.", fr: "Créer une alarme CloudWatch sur la métrique StatusCheckFailed de l'instance principale, créer une vérification de l'état Route 53 qui surveille l'alarme, et l'associer à l'enregistrement de basculement principal." } }
    - { id: d, text: { en: "Enable EC2 automatic instance recovery on the primary instance and replace the failover records with a simple record that contains its private IP address.", fr: "Activer la récupération automatique de l'instance EC2 principale et remplacer les enregistrements de basculement par un enregistrement simple qui contient son adresse IP privée." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Route 53 health checkers run outside the VPC, so they cannot reach an instance that has only a private IP address. The documented approach for private hosted zones is a CloudWatch alarm on a metric that reflects the resource health (here the EC2 StatusCheckFailed metric) and a Route 53 health check based on the data stream of that alarm. When the alarm data shows a failure, the primary record becomes unhealthy and Route 53 answers with the secondary record.
    fr: |
      Les vérificateurs d'état Route 53 s'exécutent hors du VPC : ils ne peuvent pas joindre une instance qui n'a qu'une adresse IP privée. L'approche documentée pour les zones hébergées privées consiste à créer une alarme CloudWatch sur une métrique qui reflète l'état de la ressource (ici la métrique EC2 StatusCheckFailed) et une vérification de l'état Route 53 basée sur le flux de données de cette alarme. Lorsque les données de l'alarme indiquent une panne, l'enregistrement principal devient défaillant et Route 53 répond avec l'enregistrement secondaire.
  options:
    a: { en: "Endpoint health checks are sent from outside the VPC and need a public IP address to check an instance, so they cannot reach the private IP address.", fr: "Les vérifications de l'état de point de terminaison sont envoyées depuis l'extérieur du VPC et exigent une adresse IP publique pour vérifier une instance : elles ne peuvent pas joindre l'adresse IP privée." }
    b: { en: "A calculated health check only combines other health checks; its child endpoint check has the same problem of not reaching a private IP address.", fr: "Une vérification de l'état calculée ne fait que combiner d'autres vérifications ; sa vérification enfant de point de terminaison a le même problème d'accès à une adresse IP privée." }
    d: { en: "Instance recovery only helps with failures of the underlying host in us-east-1, and a simple record can never send users to us-west-2.", fr: "La récupération d'instance ne traite que les pannes de l'hôte sous-jacent dans us-east-1, et un enregistrement simple ne peut jamais envoyer les utilisateurs vers us-west-2." }
references:
  - title: Configuring failover in a private hosted zone
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/dns-failover-private-hosted-zones.html
  - title: Types of Amazon Route 53 health checks
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/health-checks-types.html
