id: saac03-2c-opensearch-product-search
objective: "2.1.23"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online retailer stores 20 million product descriptions in an Amazon Aurora PostgreSQL DB cluster. Customers complain that the site search is slow and returns poor results because it runs SQL `LIKE` queries. The company needs full-text search with relevance ranking and tolerance for typing errors. The search tier must be a managed service that can run across multiple Availability Zones.

    Which solution will meet these requirements?
  fr: |
    Un détaillant en ligne stocke 20 millions de descriptions de produits dans un cluster de base de données Amazon Aurora PostgreSQL. Les clients se plaignent que la recherche du site est lente et renvoie de mauvais résultats, car elle exécute des requêtes SQL `LIKE`. L'entreprise a besoin d'une recherche en texte intégral avec classement par pertinence et tolérance aux fautes de frappe. Le niveau de recherche doit être un service géré qui peut s'exécuter dans plusieurs zones de disponibilité.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add Aurora Replicas to the cluster and send the `LIKE` search queries to the reader endpoint."
        fr: "Ajouter des Aurora Replicas au cluster et envoyer les requêtes de recherche `LIKE` au point de terminaison du lecteur."
    - id: b
      text:
        en: "Cache the search results in Amazon ElastiCache with a 24-hour time to live for each entry."
        fr: "Mettre en cache les résultats de recherche dans Amazon ElastiCache avec une durée de vie de 24 heures par entrée."
    - id: c
      text:
        en: "Export the catalog to Amazon S3 every hour and run the search queries with Amazon Athena."
        fr: "Exporter le catalogue vers Amazon S3 toutes les heures et exécuter les requêtes de recherche avec Amazon Athena."
    - id: d
      text:
        en: "Index the catalog in an Amazon OpenSearch Service domain that uses Multi-AZ and send search requests to it."
        fr: "Indexer le catalogue dans un domaine Amazon OpenSearch Service qui utilise Multi-AZ et lui envoyer les requêtes de recherche."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon OpenSearch Service is a managed search and analytics engine that indexes and searches large collections of data, with relevance scoring and fuzzy matching built in. Domain nodes can be spread across two or three Availability Zones, and the service replaces failed nodes automatically.
    fr: |
      Amazon OpenSearch Service est un moteur de recherche et d'analyse géré qui indexe et recherche de grandes collections de données, avec un score de pertinence et une correspondance approximative intégrés. Les nœuds du domaine peuvent être répartis sur deux ou trois zones de disponibilité, et le service remplace automatiquement les nœuds défaillants.
  options:
    a:
      en: |
        Replicas add read capacity, but `LIKE` queries still have no relevance ranking or typo tolerance, so the search quality does not improve.
      fr: |
        Les réplicas ajoutent de la capacité de lecture, mais les requêtes `LIKE` n'offrent toujours ni classement par pertinence ni tolérance aux fautes de frappe : la qualité de la recherche ne s'améliore pas.
    b:
      en: |
        A cache only speeds up repeated identical searches; it does not provide full-text search, ranking, or typo tolerance.
      fr: |
        Un cache n'accélère que les recherches identiques répétées ; il n'apporte ni recherche en texte intégral, ni classement, ni tolérance aux fautes de frappe.
    c:
      en: |
        Athena runs ad hoc SQL over files in S3; it is not an interactive search engine with relevance ranking, and hourly exports make results stale.
      fr: |
        Athena exécute des requêtes SQL ponctuelles sur des fichiers dans S3 ; ce n'est pas un moteur de recherche interactif avec classement par pertinence, et les exports horaires rendent les résultats obsolètes.
references:
  - title: What is Amazon OpenSearch Service?
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
