id: saac03-2a-fargate-efs-shared
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is moving a content management application to Amazon ECS on AWS Fargate. Several tasks that run in different Availability Zones must read and write the same set of files, and the files must persist after the tasks stop. The company does not want to manage any storage servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre une application de gestion de contenu vers Amazon ECS sur AWS Fargate. Plusieurs tâches qui s'exécutent dans des zones de disponibilité différentes doivent lire et écrire le même ensemble de fichiers, et les fichiers doivent persister après l'arrêt des tâches. L'entreprise ne veut gérer aucun serveur de stockage.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Define an Amazon EFS volume in the task definition, and mount it in the application container.", fr: "Définir un volume Amazon EFS dans la définition de tâche, et le monter dans le conteneur de l'application." }
    - id: b
      text: { en: "Increase the Fargate ephemeral storage of each task, and write the files to it.", fr: "Augmenter le stockage éphémère Fargate de chaque tâche, et y écrire les fichiers." }
    - id: c
      text: { en: "Attach an Amazon EBS volume to each task, and write the files to that volume.", fr: "Attacher un volume Amazon EBS à chaque tâche, et écrire les fichiers sur ce volume." }
    - id: d
      text: { en: "Configure a bind mount to a host path in the task definition, and write the files to the host.", fr: "Configurer un montage lié (bind mount) vers un chemin de l'hôte dans la définition de tâche, et écrire les fichiers sur l'hôte." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon EFS is a managed, shared file system that ECS tasks on Fargate (platform version 1.4.0 or later) and on EC2 can mount. All tasks access the same persistent storage regardless of where they run, and AWS manages the storage infrastructure.
    fr: |
      Amazon EFS est un système de fichiers partagé et géré que les tâches ECS sur Fargate (version de plateforme 1.4.0 ou ultérieure) et sur EC2 peuvent monter. Toutes les tâches accèdent au même stockage persistant, où qu'elles s'exécutent, et AWS gère l'infrastructure de stockage.
  options:
    b: { en: "Fargate ephemeral storage belongs to one task and is deleted when the task stops, so it is neither shared nor persistent.", fr: "Le stockage éphémère Fargate appartient à une seule tâche et est supprimé à l'arrêt de la tâche : il n'est ni partagé ni persistant." }
    c: { en: "An EBS volume is attached to a single task in one Availability Zone, so tasks cannot share the same files.", fr: "Un volume EBS est attaché à une seule tâche dans une zone de disponibilité : les tâches ne peuvent pas partager les mêmes fichiers." }
    d: { en: "On Fargate the host is managed by AWS and its storage is tied to the task, so bind mounts are not shared between tasks and do not persist.", fr: "Sur Fargate, l'hôte est géré par AWS et son stockage est lié à la tâche : les montages liés ne sont pas partagés entre tâches et ne persistent pas." }
references:
  - title: Use Amazon EFS volumes with Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/efs-volumes.html
