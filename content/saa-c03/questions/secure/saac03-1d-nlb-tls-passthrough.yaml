id: saac03-1d-nlb-tls-passthrough
objective: "1.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment company runs an API on Amazon EC2 instances in multiple Availability Zones. Each instance holds the private key of the API's TLS certificate. A compliance requirement states that client traffic must be encrypted end to end and that no intermediate component may decrypt it, including the load balancer. The API must remain highly available behind a single endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de paiement exécute une API sur des instances Amazon EC2 réparties dans plusieurs zones de disponibilité. Chaque instance détient la clé privée du certificat TLS de l'API. Une exigence de conformité impose que le trafic client soit chiffré de bout en bout et qu'aucun composant intermédiaire, y compris l'équilibreur de charge, ne le déchiffre. L'API doit rester hautement disponible derrière un point de terminaison unique.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use a Network Load Balancer with a TCP listener on port 443 that forwards traffic to a TCP target group of the instances.", fr: "Utiliser un Network Load Balancer avec un écouteur TCP sur le port 443 qui transfère le trafic vers un groupe cible TCP contenant les instances." }
    - id: b
      text: { en: "Use an Application Load Balancer with an HTTPS listener and an ACM certificate that forwards traffic to an HTTPS target group.", fr: "Utiliser un Application Load Balancer avec un écouteur HTTPS et un certificat ACM qui transfère le trafic vers un groupe cible HTTPS." }
    - id: c
      text: { en: "Use a Network Load Balancer with a TLS listener on port 443 and an ACM certificate that forwards traffic to a TLS target group.", fr: "Utiliser un Network Load Balancer avec un écouteur TLS sur le port 443 et un certificat ACM qui transfère le trafic vers un groupe cible TLS." }
    - id: d
      text: { en: "Use an Amazon CloudFront distribution with the HTTPS only viewer protocol policy and the instances as a custom HTTPS origin.", fr: "Utiliser une distribution Amazon CloudFront avec la politique de protocole utilisateur HTTPS only et les instances comme origine HTTPS personnalisée." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With a TCP listener on port 443, a Network Load Balancer passes the encrypted stream to the targets without decrypting it, so only the instances terminate TLS. The NLB still distributes connections across the Availability Zones behind one endpoint.
    fr: |
      Avec un écouteur TCP sur le port 443, un Network Load Balancer transmet le flux chiffré aux cibles sans le déchiffrer : seules les instances mettent fin à TLS. Le NLB répartit toujours les connexions entre les zones de disponibilité derrière un point de terminaison unique.
  options:
    b:
      en: |
        An ALB HTTPS listener terminates TLS and decrypts the requests before re-encrypting them to the HTTPS targets, so the load balancer sees the plaintext.
      fr: |
        Un écouteur HTTPS d'ALB met fin à TLS et déchiffre les requêtes avant de les rechiffrer vers les cibles HTTPS : l'équilibreur de charge voit donc le texte en clair.
    c:
      en: |
        A TLS listener uses the server certificate to terminate the connection and decrypt it at the NLB, even if traffic is re-encrypted to the targets.
      fr: |
        Un écouteur TLS utilise le certificat de serveur pour mettre fin à la connexion et la déchiffrer sur le NLB, même si le trafic est rechiffré vers les cibles.
    d:
      en: |
        CloudFront terminates the viewer TLS connection at the edge and opens a separate connection to the origin, so it decrypts the traffic.
      fr: |
        CloudFront met fin à la connexion TLS de l'utilisateur en périphérie et ouvre une connexion distincte vers l'origine : il déchiffre donc le trafic.
references:
  - title: Listeners for your Network Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/load-balancer-listeners.html
