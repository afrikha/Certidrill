id: saac03-1a-roles-anywhere-onprem
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs batch applications on servers in its own data center. The applications upload results to Amazon S3. The company has an internal public key infrastructure (PKI) that already issues an X.509 certificate to every server. The company wants the applications to use short-term AWS credentials and the same IAM roles and policies as its workloads that run on AWS.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle exécute des applications de traitement par lots sur des serveurs de son propre centre de données. Les applications chargent leurs résultats dans Amazon S3. L'entreprise dispose d'une infrastructure à clé publique (PKI) interne qui émet déjà un certificat X.509 pour chaque serveur. L'entreprise veut que les applications utilisent des informations d'identification AWS à court terme et les mêmes rôles et politiques IAM que ses charges de travail exécutées sur AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Register the company's CA as a trust anchor in IAM Roles Anywhere and create a profile for the role.", fr: "Inscrire l'autorité de certification de l'entreprise comme ancre d'approbation dans IAM Roles Anywhere et créer un profil pour le rôle." }
    - id: b
      text: { en: "Attach an instance profile that contains the IAM role to each of the on-premises servers.", fr: "Attacher à chacun des serveurs sur site un profil d'instance contenant le rôle IAM." }
    - id: c
      text: { en: "Store an IAM user's access keys in AWS Secrets Manager and have the applications read them at startup.", fr: "Stocker les clés d'accès d'un utilisateur IAM dans AWS Secrets Manager et faire lire ces clés par les applications au démarrage." }
    - id: d
      text: { en: "Use an Amazon Cognito identity pool with developer-authenticated identities for each server.", fr: "Utiliser un groupe d'identités Amazon Cognito avec des identités authentifiées par le développeur pour chaque serveur." }
answer: { optionId: a }
explanation:
  correct:
    en: "IAM Roles Anywhere gives workloads outside AWS temporary credentials. The workload authenticates with an X.509 certificate from a CA registered as a trust anchor, and a profile defines which IAM roles it can assume, so the servers use the same roles and policies as AWS-hosted workloads."
    fr: "IAM Roles Anywhere fournit des informations d'identification temporaires aux charges de travail situées hors d'AWS. La charge de travail s'authentifie avec un certificat X.509 émis par une autorité inscrite comme ancre d'approbation, et un profil définit les rôles IAM qu'elle peut endosser : les serveurs utilisent les mêmes rôles et politiques que les charges de travail hébergées sur AWS."
  options:
    b:
      en: "Instance profiles deliver role credentials through the EC2 instance metadata service; they cannot be attached to servers outside Amazon EC2."
      fr: "Les profils d'instance fournissent les informations d'identification du rôle via le service de métadonnées d'instance EC2 ; ils ne peuvent pas être attachés à des serveurs hors d'Amazon EC2."
    c:
      en: "IAM user access keys are long-term credentials, and the applications would still need credentials to read the secret."
      fr: "Les clés d'accès d'un utilisateur IAM sont des informations d'identification à long terme, et les applications auraient encore besoin d'informations d'identification pour lire le secret."
    d:
      en: "Identity pools target end users of web and mobile apps; developer-authenticated identities require custom authentication code and do not reuse the existing PKI."
      fr: "Les groupes d'identités ciblent les utilisateurs finaux d'applications web et mobiles ; les identités authentifiées par le développeur exigent du code d'authentification spécifique et ne réutilisent pas la PKI existante."
references:
  - title: What is AWS Identity and Access Management Roles Anywhere?
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
