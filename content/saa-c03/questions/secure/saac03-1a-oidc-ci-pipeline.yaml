id: saac03-1a-oidc-ci-pipeline
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company runs its CI/CD workflows on GitHub Actions. The workflows deploy static website files to an Amazon S3 bucket. Today, the workflows use the access keys of an IAM user that are stored as repository secrets. The security team wants to remove all long-term AWS credentials from the pipeline. The company does not operate a certificate authority.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels exécute ses workflows CI/CD sur GitHub Actions. Les workflows déploient les fichiers d'un site web statique dans un compartiment (bucket) Amazon S3. Aujourd'hui, les workflows utilisent les clés d'accès d'un utilisateur IAM stockées comme secrets du dépôt. L'équipe de sécurité veut supprimer toutes les informations d'identification AWS à long terme du pipeline. L'entreprise n'exploite pas d'autorité de certification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Rotate the IAM user's access keys every 30 days with an AWS Lambda function that updates the repository secrets.", fr: "Faire pivoter les clés d'accès de l'utilisateur IAM tous les 30 jours avec une fonction AWS Lambda qui met à jour les secrets du dépôt." }
    - id: b
      text: { en: "Configure IAM Roles Anywhere with a trust anchor and issue a certificate to each workflow runner.", fr: "Configurer IAM Roles Anywhere avec une ancre d'approbation (trust anchor) et émettre un certificat pour chaque exécuteur de workflow." }
    - id: c
      text: { en: "Create an Amazon Cognito user pool for the workflows and grant the user pool access to the bucket.", fr: "Créer un groupe d'utilisateurs (user pool) Amazon Cognito pour les workflows et accorder à ce groupe l'accès au compartiment." }
    - id: d
      text: { en: "Create an IAM OIDC identity provider for GitHub and an IAM role that the workflows assume with their OIDC token.", fr: "Créer un fournisseur d'identité OIDC IAM pour GitHub et un rôle IAM que les workflows endossent avec leur jeton OIDC." }
answer: { optionId: d }
explanation:
  correct:
    en: "OIDC federation is designed for machine-to-machine cases such as CI/CD pipelines. The workflow receives a JSON Web Token from GitHub and exchanges it for temporary credentials of an IAM role whose trust policy names the OIDC provider, so no AWS key is stored in the repository."
    fr: "La fédération OIDC est conçue pour les cas de machine à machine comme les pipelines CI/CD. Le workflow reçoit un jeton web JSON (JWT) de GitHub et l'échange contre des informations d'identification temporaires d'un rôle IAM dont la politique d'approbation (trust policy) désigne le fournisseur OIDC : aucune clé AWS n'est stockée dans le dépôt."
  options:
    a:
      en: "Rotation shortens the exposure window, but the keys remain long-term credentials stored in the pipeline."
      fr: "La rotation réduit la fenêtre d'exposition, mais les clés restent des informations d'identification à long terme stockées dans le pipeline."
    b:
      en: "IAM Roles Anywhere requires X.509 certificates issued by a certificate authority registered as a trust anchor, and the company does not operate one."
      fr: "IAM Roles Anywhere exige des certificats X.509 émis par une autorité de certification inscrite comme ancre d'approbation, et l'entreprise n'en exploite pas."
    c:
      en: "A user pool authenticates app users; it is not an IAM principal and cannot be granted S3 permissions directly."
      fr: "Un groupe d'utilisateurs authentifie les utilisateurs d'une application ; ce n'est pas un principal IAM et il ne peut pas recevoir directement d'autorisations S3."
references:
  - title: OIDC federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_oidc.html
