id: saac03-1c-rds-pitr-cross-region-copy
objective: "1.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A logistics company runs an Amazon RDS for PostgreSQL DB instance. The company must be able to restore the database to any point in time within the last 14 days in the primary AWS Region. It must also keep daily backups in a second Region for 30 days so that it can recover if the primary Region becomes unavailable.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise de logistique exploite une instance de base de données Amazon RDS for PostgreSQL. L'entreprise doit pouvoir restaurer la base de données à n'importe quel instant des 14 derniers jours dans la Région AWS principale. Elle doit aussi conserver des sauvegardes quotidiennes dans une deuxième Région pendant 30 jours afin de pouvoir récupérer si la Région principale devient indisponible.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Set the backup retention period of the DB instance's automated backups to 14 days."
        fr: "Définir sur 14 jours la période de conservation des sauvegardes automatisées de l'instance de base de données."
    - id: b
      text:
        en: "Convert the DB instance to a Multi-AZ deployment with a standby in another Availability Zone."
        fr: "Convertir l'instance de base de données en déploiement Multi-AZ avec une instance de secours dans une autre zone de disponibilité."
    - id: c
      text:
        en: "Create an AWS Backup plan that copies daily backups to a vault in the second Region with a 30-day retention."
        fr: "Créer un plan AWS Backup qui copie des sauvegardes quotidiennes vers un coffre de la deuxième Région, avec une conservation de 30 jours."
    - id: d
      text:
        en: "Create a read replica of the DB instance in the same Availability Zone as the primary instance."
        fr: "Créer un réplica en lecture de l'instance de base de données dans la même zone de disponibilité que l'instance principale."
    - id: e
      text:
        en: "Take a manual DB snapshot every 14 days and copy each snapshot to the second Region."
        fr: "Prendre un instantané de base de données manuel tous les 14 jours et copier chaque instantané dans la deuxième Région."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Automated backups with a retention period of 14 days let RDS restore the DB instance to any point in time within that period; the period can be set from 0 to 35 days. An AWS Backup plan with a copy rule copies each daily backup to a vault in another Region with its own retention, which provides the Regional recovery copy.
    fr: |
      Des sauvegardes automatisées avec une période de conservation de 14 jours permettent à RDS de restaurer l'instance à n'importe quel instant de cette période ; la période peut être réglée de 0 à 35 jours. Un plan AWS Backup avec une règle de copie copie chaque sauvegarde quotidienne vers un coffre d'une autre Région avec sa propre conservation, ce qui fournit la copie de récupération régionale.
  options:
    b:
      en: |
        Multi-AZ improves availability within one Region; it is not a backup and does not protect against a Regional outage or logical errors.
      fr: |
        Multi-AZ améliore la disponibilité dans une Région ; ce n'est pas une sauvegarde et il ne protège ni contre une panne régionale ni contre les erreurs logiques.
    d:
      en: |
        A read replica in the same Availability Zone neither provides point-in-time recovery nor protects against the loss of the Region.
      fr: |
        Un réplica en lecture dans la même zone de disponibilité n'offre pas de restauration à un instant dans le passé et ne protège pas contre la perte de la Région.
    e:
      en: |
        A manual snapshot every 14 days provides neither point-in-time recovery nor daily backups in the second Region.
      fr: |
        Un instantané manuel tous les 14 jours n'offre ni restauration à un instant dans le passé ni sauvegardes quotidiennes dans la deuxième Région.
references:
  - title: Backup retention period
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.BackupRetention.html
  - title: Creating backup copies across AWS Regions
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/cross-region-backup.html
