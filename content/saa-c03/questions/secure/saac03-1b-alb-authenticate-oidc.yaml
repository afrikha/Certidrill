id: saac03-1b-alb-authenticate-oidc
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an internal web application on Amazon EC2 instances behind an Application Load Balancer (ALB) that has an HTTPS listener. The application has no authentication logic. Employees must sign in through the corporate OpenID Connect (OIDC) identity provider before any request reaches the instances. The company does not want to modify the application code.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute une application web interne sur des instances Amazon EC2 derrière un Application Load Balancer (ALB) doté d'un écouteur HTTPS. L'application n'a aucune logique d'authentification. Les employés doivent se connecter par le fournisseur d'identité OpenID Connect (OIDC) de l'entreprise avant qu'une requête n'atteigne les instances. L'entreprise ne veut pas modifier le code de l'application.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon Cognito identity pool, and require browsers to sign each request with temporary AWS credentials.", fr: "Créer un pool d'identités Amazon Cognito, et exiger que les navigateurs signent chaque requête avec des informations d'identification AWS temporaires." }
    - id: b
      text: { en: "Associate a security group with the ALB that allows HTTPS only from the IP addresses of authenticated users.", fr: "Associer à l'ALB un groupe de sécurité qui n'autorise HTTPS que depuis les adresses IP des utilisateurs authentifiés." }
    - id: c
      text: { en: "Place Amazon API Gateway with a Lambda authorizer that validates OIDC tokens in front of the instances.", fr: "Placer devant les instances Amazon API Gateway avec un autorisateur Lambda qui valide les jetons OIDC." }
    - id: d
      text: { en: "Add an authenticate-oidc action for the corporate IdP to the HTTPS listener rule, before the forward action.", fr: "Ajouter à la règle de l'écouteur HTTPS une action authenticate-oidc pour l'IdP de l'entreprise, avant l'action forward." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An ALB can authenticate users with any OIDC-compliant IdP (authenticate-oidc) or an Amazon Cognito user pool (authenticate-cognito) on HTTPS listeners. Unauthenticated users are redirected to the IdP, and authenticated requests are forwarded with the user claims in the signed x-amzn-oidc-data header, so the application needs no change.
    fr: |
      Un ALB peut authentifier les utilisateurs avec n'importe quel IdP compatible OIDC (authenticate-oidc) ou un groupe d'utilisateurs Amazon Cognito (authenticate-cognito) sur des écouteurs HTTPS. Les utilisateurs non authentifiés sont redirigés vers l'IdP, et les requêtes authentifiées sont transmises avec les revendications de l'utilisateur dans l'en-tête signé x-amzn-oidc-data : l'application n'a besoin d'aucune modification.
  options:
    a:
      en: |
        Signing requests with AWS credentials requires application and browser code changes, and identity pools are not an authentication front end for a web app behind an ALB.
      fr: |
        Signer les requêtes avec des informations d'identification AWS exige de modifier le code de l'application et du navigateur, et les pools d'identités ne sont pas une façade d'authentification pour une application web derrière un ALB.
    b:
      en: |
        Security groups filter by IP address and port; they cannot authenticate users.
      fr: |
        Les groupes de sécurité filtrent par adresse IP et par port ; ils ne peuvent pas authentifier des utilisateurs.
    c:
      en: |
        Adding API Gateway and a custom authorizer changes the architecture and adds a function to maintain, which is more overhead than the ALB's built-in authentication.
      fr: |
        Ajouter API Gateway et un autorisateur personnalisé modifie l'architecture et ajoute une fonction à maintenir, ce qui est plus lourd que l'authentification intégrée de l'ALB.
references:
  - title: Authenticate users using an Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
