id: saac03-1a-artifact-soc-report
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment company hosts its platform on AWS. An external auditor asks for evidence that the physical and infrastructure security controls of the AWS data centers have been independently audited, including the latest SOC 2 and PCI DSS reports. The company must provide the documents as quickly as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de paiement héberge sa plateforme sur AWS. Un auditeur externe demande la preuve que les contrôles de sécurité physiques et d'infrastructure des centres de données AWS ont été audités de manière indépendante, y compris les derniers rapports SOC 2 et PCI DSS. L'entreprise doit fournir les documents le plus rapidement possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Download the SOC 2 and PCI DSS reports from AWS Artifact and provide them to the auditor.", fr: "Télécharger les rapports SOC 2 et PCI DSS depuis AWS Artifact et les fournir à l'auditeur." }
    - id: b
      text: { en: "Deploy AWS Config conformance packs for PCI DSS and give the auditor the compliance results.", fr: "Déployer des packs de conformité AWS Config pour PCI DSS et donner à l'auditeur les résultats de conformité." }
    - id: c
      text: { en: "Enable the PCI DSS standard in AWS Security Hub and export the control findings for the auditor.", fr: "Activer la norme PCI DSS dans AWS Security Hub et exporter les résultats des contrôles pour l'auditeur." }
    - id: d
      text: { en: "Arrange for the auditor to inspect an AWS data center in the Region that the company uses.", fr: "Organiser pour l'auditeur une inspection d'un centre de données AWS de la Région utilisée par l'entreprise." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Artifact provides on-demand, free access to AWS security and compliance documents such as SOC and PCI reports and ISO certifications. These third-party reports cover the controls that AWS is responsible for and can be given to auditors; the company still documents its own controls."
    fr: "AWS Artifact donne un accès gratuit et à la demande aux documents de sécurité et de conformité d'AWS, comme les rapports SOC et PCI et les certifications ISO. Ces rapports tiers couvrent les contrôles dont AWS est responsable et peuvent être remis aux auditeurs ; l'entreprise documente toujours ses propres contrôles."
  options:
    b:
      en: "Conformance packs evaluate the configuration of the company's own resources; they say nothing about AWS data center controls."
      fr: "Les packs de conformité évaluent la configuration des ressources de l'entreprise ; ils ne disent rien des contrôles des centres de données AWS."
    c:
      en: "Security Hub checks the company's resources against a standard; its findings are about the customer side of the model, not an independent audit of AWS."
      fr: "Security Hub contrôle les ressources de l'entreprise par rapport à une norme ; ses résultats portent sur la part client du modèle, pas sur un audit indépendant d'AWS."
    d:
      en: "Customers do not get physical access to AWS data centers; AWS provides third-party audit reports instead."
      fr: "Les clients n'ont pas d'accès physique aux centres de données AWS ; AWS fournit plutôt des rapports d'audit tiers."
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
