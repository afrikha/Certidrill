id: saac03-1d-kms-rotation-effects
objective: "1.3.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company plans to enable automatic rotation on the customer managed AWS KMS key that protects an Amazon DynamoDB table and several Amazon S3 buckets. Several applications reference the key by its ARN. The operations team asks what will happen to these applications and to the data that is already encrypted when the first rotation occurs.

    Which statement describes the result of the rotation?
  fr: |
    Une entreprise prévoit d'activer la rotation automatique sur la clé AWS KMS gérée par le client qui protège une table Amazon DynamoDB et plusieurs compartiments Amazon S3. Plusieurs applications référencent la clé par son ARN. L'équipe d'exploitation demande ce qui arrivera à ces applications et aux données déjà chiffrées lors de la première rotation.

    Quelle affirmation décrit le résultat de la rotation ?
body:
  options:
    - id: a
      text: { en: "The key ID and ARN stay the same, and AWS KMS uses the retained previous key material to decrypt existing data without re-encryption.", fr: "L'ID et l'ARN de la clé restent identiques, et AWS KMS utilise le matériel de clé précédent qu'il conserve pour déchiffrer les données existantes sans rechiffrement." }
    - id: b
      text: { en: "The key ID and ARN stay the same, but the existing data must be re-encrypted with the new key material before the old material is deleted.", fr: "L'ID et l'ARN de la clé restent identiques, mais les données existantes doivent être rechiffrées avec le nouveau matériel de clé avant la suppression de l'ancien." }
    - id: c
      text: { en: "AWS KMS creates a new key with a new ARN, so the applications must be updated to reference the new key.", fr: "AWS KMS crée une nouvelle clé avec un nouvel ARN : les applications doivent donc être mises à jour pour référencer la nouvelle clé." }
    - id: d
      text: { en: "AWS KMS also rotates every data key it generated in the past, so the services re-encrypt their data automatically.", fr: "AWS KMS effectue aussi la rotation de chaque clé de données qu'il a générée par le passé : les services rechiffrent donc automatiquement leurs données." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Rotation changes only the current key material; the KMS key remains the same logical resource with the same key ID and ARN. AWS KMS keeps all previous key material and automatically uses the right one to decrypt, so no data is re-encrypted and no application changes.
    fr: |
      La rotation ne change que le matériel de clé actuel ; la clé KMS reste la même ressource logique, avec le même ID et le même ARN. AWS KMS conserve tout le matériel de clé précédent et utilise automatiquement le bon pour déchiffrer : aucune donnée n'est rechiffrée et aucune application ne change.
  options:
    b:
      en: |
        AWS KMS never deletes previous key material during rotation, and re-encryption is not required.
      fr: |
        AWS KMS ne supprime jamais le matériel de clé précédent lors d'une rotation, et aucun rechiffrement n'est nécessaire.
    c:
      en: |
        Creating a new key and updating references describes manual rotation, not automatic rotation.
      fr: |
        Créer une nouvelle clé et mettre à jour les références correspond à la rotation manuelle, pas à la rotation automatique.
    d:
      en: |
        Rotation does not rotate the data keys that the KMS key generated and does not re-encrypt any data.
      fr: |
        La rotation n'effectue pas la rotation des clés de données générées par la clé KMS et ne rechiffre aucune donnée.
references:
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
