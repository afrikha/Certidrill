id: saac03-1d-cloudfront-acm-region
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company hosts a web application behind an Application Load Balancer in the eu-west-1 Region. The company requested a public AWS Certificate Manager (ACM) certificate for www.example.com in eu-west-1 and attached it to the HTTPS listener of the load balancer. The company is now creating an Amazon CloudFront distribution in front of the load balancer, but the certificate does not appear when the company configures the alternate domain name of the distribution.

    Viewers must connect to www.example.com over HTTPS through CloudFront.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge une application web derrière un Application Load Balancer dans la Région eu-west-1. Elle a demandé un certificat public AWS Certificate Manager (ACM) pour www.example.com dans eu-west-1 et l'a attaché à l'écouteur HTTPS de l'équilibreur de charge. L'entreprise crée maintenant une distribution Amazon CloudFront devant l'équilibreur de charge, mais le certificat n'apparaît pas lorsqu'elle configure le nom de domaine alternatif de la distribution.

    Les utilisateurs doivent se connecter à www.example.com en HTTPS via CloudFront.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Share the eu-west-1 certificate with the CloudFront service by using AWS Resource Access Manager (AWS RAM).", fr: "Partager le certificat de eu-west-1 avec le service CloudFront à l'aide d'AWS Resource Access Manager (AWS RAM)." }
    - id: b
      text: { en: "Request a public ACM certificate for www.example.com in the us-east-1 Region and associate it with the distribution.", fr: "Demander un certificat ACM public pour www.example.com dans la Région us-east-1 et l'associer à la distribution." }
    - id: c
      text: { en: "Associate the eu-west-1 certificate with the distribution by passing its ARN in an AWS CLI update-distribution call.", fr: "Associer le certificat de eu-west-1 à la distribution en passant son ARN dans un appel update-distribution de l'AWS CLI." }
    - id: d
      text: { en: "Set the viewer protocol policy of the default cache behavior to Redirect HTTP to HTTPS.", fr: "Définir la politique de protocole utilisateur du comportement de cache par défaut sur Redirect HTTP to HTTPS." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      To require HTTPS between viewers and CloudFront with an ACM certificate, the certificate must be requested or imported in the US East (N. Virginia) Region (us-east-1). The eu-west-1 certificate can stay on the load balancer for the connection between CloudFront and the origin.
    fr: |
      Pour exiger HTTPS entre les utilisateurs et CloudFront avec un certificat ACM, le certificat doit être demandé ou importé dans la Région USA Est (Virginie du Nord) (us-east-1). Le certificat de eu-west-1 peut rester sur l'équilibreur de charge pour la connexion entre CloudFront et l'origine.
  options:
    a:
      en: |
        AWS RAM does not make an ACM certificate from another Region usable by CloudFront; the Region requirement remains.
      fr: |
        AWS RAM ne permet pas à CloudFront d'utiliser un certificat ACM d'une autre Région ; l'exigence de Région demeure.
    c:
      en: |
        CloudFront accepts ACM certificates for viewers only from us-east-1, whatever tool is used to associate them.
      fr: |
        CloudFront n'accepte pour les utilisateurs que des certificats ACM de us-east-1, quel que soit l'outil utilisé pour les associer.
    d:
      en: |
        The viewer protocol policy forces HTTPS, but the distribution still needs a valid certificate for the alternate domain name.
      fr: |
        La politique de protocole utilisateur impose HTTPS, mais la distribution a toujours besoin d'un certificat valide pour le nom de domaine alternatif.
references:
  - title: Requirements for using SSL/TLS certificates with CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cnames-and-https-requirements.html
