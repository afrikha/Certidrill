id: saac03-1c-recycle-bin-snapshots
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company keeps thousands of Amazon EBS snapshots that an Amazon Data Lifecycle Manager policy creates. Twice this year, an administrator deleted the wrong snapshots, and the data was lost. The company needs to be able to restore snapshots for 14 days after they are deleted, without changing the existing backup process and with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise conserve des milliers d'instantanés Amazon EBS créés par une politique Amazon Data Lifecycle Manager. Deux fois cette année, un administrateur a supprimé les mauvais instantanés, et les données ont été perdues. L'entreprise doit pouvoir restaurer les instantanés pendant 14 jours après leur suppression, sans modifier le processus de sauvegarde existant et avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Copy every snapshot to a second AWS Region with an AWS Lambda function that runs after each Data Lifecycle Manager run."
        fr: "Copier chaque instantané dans une deuxième Région AWS avec une fonction AWS Lambda exécutée après chaque exécution de Data Lifecycle Manager."
    - id: b
      text:
        en: "Enable EBS fast snapshot restore on the snapshots in each Availability Zone."
        fr: "Activer la restauration rapide d'instantanés EBS sur les instantanés dans chaque zone de disponibilité."
    - id: c
      text:
        en: "Archive all snapshots to the EBS Snapshots Archive tier so that they cannot be deleted."
        fr: "Archiver tous les instantanés dans le niveau EBS Snapshots Archive pour qu'ils ne puissent pas être supprimés."
    - id: d
      text:
        en: "Create a Recycle Bin retention rule for EBS snapshots with a retention period of 14 days."
        fr: "Créer une règle de conservation de la Corbeille (Recycle Bin) pour les instantanés EBS avec une période de conservation de 14 jours."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Recycle Bin supports EBS snapshots, EBS-backed AMIs and EBS volumes. When a resource that matches a retention rule is deleted, it is kept in the Recycle Bin for the rule's retention period and can be restored at any time before the period expires; the existing snapshot process does not change.
    fr: |
      La Corbeille (Recycle Bin) prend en charge les instantanés EBS, les AMI basées sur EBS et les volumes EBS. Lorsqu'une ressource visée par une règle de conservation est supprimée, elle est conservée dans la Corbeille pendant la période de la règle et peut être restaurée à tout moment avant son expiration ; le processus d'instantanés existant ne change pas.
  options:
    a:
      en: |
        Custom copy code adds overhead and storage in another Region; an administrator could still delete the wrong copies.
      fr: |
        Un code de copie personnalisé ajoute de la charge et du stockage dans une autre Région ; un administrateur pourrait toujours supprimer les mauvaises copies.
    b:
      en: |
        Fast snapshot restore removes the latency of the first access to blocks of restored volumes; it does not protect against deletion.
      fr: |
        La restauration rapide d'instantanés supprime la latence du premier accès aux blocs des volumes restaurés ; elle ne protège pas contre la suppression.
    c:
      en: |
        Archived snapshots can still be deleted, and archiving changes the backup process and adds restore delays.
      fr: |
        Les instantanés archivés peuvent toujours être supprimés, et l'archivage modifie le processus de sauvegarde et ajoute des délais de restauration.
references:
  - title: Recover deleted EBS volumes, EBS snapshots, and EBS-backed AMIs with Recycle Bin
    url: https://docs.aws.amazon.com/ebs/latest/userguide/recycle-bin.html
