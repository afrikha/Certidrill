id: saac03-1c-three-tier-subnet-placement
objective: "1.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company is deploying a three-tier web application in a new VPC: an internet-facing Application Load Balancer (ALB), application servers on Amazon EC2, and an Amazon RDS database. Customers must reach the application only through the ALB. The application servers and the database must not be directly reachable from the internet.

    Which subnet design will meet these requirements?
  fr: |
    Une compagnie d'assurance déploie une application web à trois niveaux dans un nouveau VPC : un Application Load Balancer (ALB) accessible depuis Internet, des serveurs d'application sur Amazon EC2 et une base de données Amazon RDS. Les clients ne doivent atteindre l'application que par l'ALB. Les serveurs d'application et la base de données ne doivent pas être directement joignables depuis Internet.

    Quelle conception des sous-réseaux répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Place the ALB, the application servers and the database in public subnets, and restrict access with security groups."
        fr: "Placer l'ALB, les serveurs d'application et la base de données dans des sous-réseaux publics, et restreindre l'accès avec des groupes de sécurité."
    - id: b
      text:
        en: "Place the ALB and the application servers in public subnets, and place the database in private subnets."
        fr: "Placer l'ALB et les serveurs d'application dans des sous-réseaux publics, et placer la base de données dans des sous-réseaux privés."
    - id: c
      text:
        en: "Place the ALB in public subnets, and place the application servers and the database in private subnets."
        fr: "Placer l'ALB dans des sous-réseaux publics, et placer les serveurs d'application et la base de données dans des sous-réseaux privés."
    - id: d
      text:
        en: "Place an internal ALB, the application servers and the database in private subnets without any internet gateway."
        fr: "Placer un ALB interne, les serveurs d'application et la base de données dans des sous-réseaux privés sans aucune passerelle Internet."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Only the internet-facing ALB needs to be in public subnets, which have a direct route to an internet gateway. The application servers and the database go in private subnets, which have no direct route to the internet gateway, so internet hosts cannot reach them; the ALB forwards requests to the application servers inside the VPC.
    fr: |
      Seul l'ALB accessible depuis Internet doit se trouver dans des sous-réseaux publics, qui ont une route directe vers une passerelle Internet. Les serveurs d'application et la base de données vont dans des sous-réseaux privés, sans route directe vers la passerelle Internet : les hôtes d'Internet ne peuvent pas les atteindre, et l'ALB transmet les requêtes aux serveurs d'application à l'intérieur du VPC.
  options:
    a:
      en: |
        Public subnets give the servers and the database a direct path from the internet; security groups alone then become the only barrier, which does not meet the requirement.
      fr: |
        Des sous-réseaux publics donnent aux serveurs et à la base de données un chemin direct depuis Internet ; les groupes de sécurité deviennent alors la seule barrière, ce qui ne répond pas à l'exigence.
    b:
      en: |
        Application servers in public subnets can be directly reachable from the internet.
      fr: |
        Des serveurs d'application placés dans des sous-réseaux publics peuvent être directement joignables depuis Internet.
    d:
      en: |
        An internal ALB without an internet gateway cannot be reached by customers on the internet.
      fr: |
        Un ALB interne sans passerelle Internet ne peut pas être atteint par les clients sur Internet.
references:
  - title: Subnets for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
