id: saac03-1c-kms-envelope-encryption
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video analytics application running on Amazon EC2 must encrypt 2 GB files on local disk before it sends them to a partner over SFTP. The company's policy requires that the encryption keys be protected by an AWS KMS customer managed key and that the root key never leave AWS KMS unencrypted.

    Which solution will meet these requirements?
  fr: |
    Une application d'analyse vidéo exécutée sur Amazon EC2 doit chiffrer des fichiers de 2 Go sur le disque local avant de les envoyer à un partenaire par SFTP. La politique de l'entreprise exige que les clés de chiffrement soient protégées par une clé AWS KMS gérée par le client et que la clé racine ne quitte jamais AWS KMS en clair.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Call the AWS KMS Encrypt operation with the customer managed key on each 2 GB file."
        fr: "Appeler l'opération AWS KMS Encrypt avec la clé gérée par le client sur chaque fichier de 2 Go."
    - id: b
      text:
        en: "Export the key material of the customer managed key to the instance and use it to encrypt the files locally."
        fr: "Exporter les éléments de clé de la clé gérée par le client vers l'instance et les utiliser pour chiffrer les fichiers localement."
    - id: c
      text:
        en: "Call GenerateDataKey with the customer managed key, encrypt each file locally with the plaintext data key, and store the encrypted data key with the file."
        fr: "Appeler GenerateDataKey avec la clé gérée par le client, chiffrer chaque fichier localement avec la clé de données en clair, et stocker la clé de données chiffrée avec le fichier."
    - id: d
      text:
        en: "Upload each file to an S3 bucket that uses SSE-KMS with the customer managed key, and download it before sending it over SFTP."
        fr: "Charger chaque fichier dans un compartiment S3 qui utilise SSE-KMS avec la clé gérée par le client, puis le télécharger avant de l'envoyer par SFTP."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Envelope encryption encrypts the data with a data key and then protects the data key under the KMS key. GenerateDataKey returns a plaintext data key for local encryption and a copy encrypted under the KMS key, which can be stored safely next to the encrypted file; the KMS key itself never leaves AWS KMS unencrypted.
    fr: |
      Le chiffrement d'enveloppe chiffre les données avec une clé de données, puis protège cette clé de données sous la clé KMS. GenerateDataKey renvoie une clé de données en clair pour le chiffrement local et une copie chiffrée sous la clé KMS, que l'on peut stocker sans risque à côté du fichier chiffré ; la clé KMS elle-même ne quitte jamais AWS KMS en clair.
  options:
    a:
      en: |
        The Encrypt operation encrypts at most 4,096 bytes of data, such as a database password, not multi-gigabyte files.
      fr: |
        L'opération Encrypt chiffre au plus 4 096 octets de données, comme un mot de passe de base de données, et non des fichiers de plusieurs gigaoctets.
    b:
      en: |
        AWS KMS does not export the key material of KMS keys; KMS keys never leave the HSMs unencrypted.
      fr: |
        AWS KMS n'exporte pas les éléments de clé des clés KMS ; les clés KMS ne quittent jamais les HSM en clair.
    d:
      en: |
        SSE-KMS protects the objects only while they are stored in S3; the downloaded files are decrypted, so the files sent over SFTP are not encrypted.
      fr: |
        SSE-KMS ne protège les objets que pendant leur stockage dans S3 ; les fichiers téléchargés sont déchiffrés, de sorte que les fichiers envoyés par SFTP ne sont pas chiffrés.
references:
  - title: AWS KMS cryptography essentials
    url: https://docs.aws.amazon.com/kms/latest/developerguide/kms-cryptography.html
