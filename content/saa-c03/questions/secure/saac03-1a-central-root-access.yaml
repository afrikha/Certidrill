id: saac03-1a-central-root-access
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 200 member accounts in an organization in AWS Organizations with all features enabled. Each member account still has a root user password and MFA device that the security team must secure and review. Occasionally, an engineer applies an Amazon S3 bucket policy that denies all principals, and the root user is needed to fix it. The company wants to reduce the effort of protecting root credentials while still being able to fix such policies.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 200 comptes membres dans une organisation AWS Organizations avec toutes les fonctionnalités activées. Chaque compte membre a toujours un mot de passe d'utilisateur racine et un appareil MFA que l'équipe de sécurité doit sécuriser et contrôler. De temps en temps, un ingénieur applique une politique de compartiment Amazon S3 qui refuse tous les principaux, et l'utilisateur racine est nécessaire pour la corriger. L'entreprise veut réduire l'effort de protection des informations d'identification racine tout en pouvant corriger ces politiques.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an SCP to all member accounts that denies every action of the root user, and review the SCP each quarter.", fr: "Attacher à tous les comptes membres une SCP qui refuse toutes les actions de l'utilisateur racine, et revoir la SCP chaque trimestre." }
    - id: b
      text: { en: "Store the root password and MFA seed of each account in a vault that requires two approvers.", fr: "Stocker le mot de passe racine et la graine MFA de chaque compte dans un coffre qui exige deux approbateurs." }
    - id: c
      text: { en: "Create an IAM role with AdministratorAccess in each member account that engineers assume to delete the bucket policies.", fr: "Créer dans chaque compte membre un rôle IAM avec AdministratorAccess que les ingénieurs endossent pour supprimer les politiques de compartiment." }
    - id: d
      text: { en: "Centrally remove the member root credentials and run root-only fixes as privileged tasks from the management account.", fr: "Supprimer de manière centralisée les informations racine des membres et exécuter les corrections réservées à la racine comme tâches privilégiées depuis le compte de gestion." }
answer: { optionId: d }
explanation:
  correct:
    en: "Centralized root access management lets the management account, or a delegated administrator for IAM, remove the root password, access keys, signing certificates and MFA of member accounts. Privileged tasks, such as removing a bucket policy that denies all principals, can then be run centrally through short-term root sessions, which CloudTrail logs as sts:AssumeRoot events."
    fr: "La gestion centralisée de l'accès racine permet au compte de gestion, ou à un administrateur délégué pour IAM, de supprimer le mot de passe, les clés d'accès, les certificats de signature et la MFA racine des comptes membres. Les tâches privilégiées, comme la suppression d'une politique de compartiment qui refuse tous les principaux, s'exécutent alors de manière centralisée via des sessions racine de courte durée, que CloudTrail journalise comme événements sts:AssumeRoot."
  options:
    a:
      en: "The SCP limits root actions, but the root credentials still exist in 200 accounts and must be protected, and it would also block the fix."
      fr: "La SCP limite les actions racine, mais les informations d'identification racine existent toujours dans 200 comptes et doivent être protégées, et elle bloquerait aussi la correction."
    b:
      en: "A vault with approvals protects the credentials but keeps 200 sets of root credentials to secure, review and recover, which does not reduce the effort."
      fr: "Un coffre avec approbations protège les informations d'identification mais conserve 200 jeux d'identifiants racine à sécuriser, contrôler et récupérer, ce qui ne réduit pas l'effort."
    c:
      en: "A bucket policy that denies all principals also denies IAM roles, even with AdministratorAccess; only a root session can edit or delete it."
      fr: "Une politique de compartiment qui refuse tous les principaux refuse aussi les rôles IAM, même avec AdministratorAccess ; seule une session racine peut la modifier ou la supprimer."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
