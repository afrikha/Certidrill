id: saac03-1d-kms-cross-account
objective: "1.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Account A (111122223333) owns an Amazon S3 bucket whose objects are encrypted with SSE-KMS by using a customer managed key in account A. An analytics IAM role in account B (444455556666) must read and decrypt the objects. The bucket policy already allows the role to call s3:GetObject on the bucket, but the requests fail with an access denied error from AWS KMS.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Le compte A (111122223333) possède un compartiment Amazon S3 dont les objets sont chiffrés en SSE-KMS avec une clé gérée par le client du compte A. Un rôle IAM d'analyse du compte B (444455556666) doit lire et déchiffrer les objets. La politique de compartiment autorise déjà le rôle à appeler s3:GetObject sur le compartiment, mais les requêtes échouent avec une erreur d'accès refusé renvoyée par AWS KMS.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In account A, add a statement to the key policy that allows account B or the analytics role to use kms:Decrypt.", fr: "Dans le compte A, ajouter à la politique de clé une instruction qui autorise le compte B ou le rôle d'analyse à utiliser kms:Decrypt." } }
    - { id: b, text: { en: "In account B, attach an IAM policy to the analytics role that allows kms:Decrypt on the ARN of the key in account A.", fr: "Dans le compte B, attacher au rôle d'analyse une politique IAM qui autorise kms:Decrypt sur l'ARN de la clé du compte A." } }
    - { id: c, text: { en: "In account B, attach an SCP to the account that allows kms:Decrypt on all KMS keys.", fr: "Dans le compte B, attacher au compte une SCP qui autorise kms:Decrypt sur toutes les clés KMS." } }
    - { id: d, text: { en: "In account B, create an alias that points to the key in account A and reference it in the analytics code.", fr: "Dans le compte B, créer un alias qui pointe vers la clé du compte A et le référencer dans le code d'analyse." } }
    - { id: e, text: { en: "In account A, enable automatic rotation of the key so that account B receives a copy of the key material.", fr: "Dans le compte A, activer la rotation automatique de la clé pour que le compte B reçoive une copie du matériel de clé." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Cross-account use of a KMS key needs two policies. The key policy in the owning account must allow the external account or principal, and an IAM policy in the external account must delegate that permission to the role. Effective permissions are the intersection of both.
    fr: |
      L'utilisation d'une clé KMS entre comptes nécessite deux politiques. La politique de clé du compte propriétaire doit autoriser le compte ou le principal externe, et une politique IAM du compte externe doit déléguer cette autorisation au rôle. Les autorisations effectives sont l'intersection des deux.
  options:
    c:
      en: |
        SCPs do not grant permissions; the key policy in account A would still not allow account B.
      fr: |
        Les SCP n'accordent pas d'autorisations ; la politique de clé du compte A n'autoriserait toujours pas le compte B.
    d:
      en: |
        An alias belongs to the account and Region where it is created and cannot point to a key in another account; it would not grant access anyway.
      fr: |
        Un alias appartient au compte et à la Région où il est créé et ne peut pas pointer vers une clé d'un autre compte ; il n'accorderait de toute façon aucun accès.
    e:
      en: |
        Rotation creates new key material inside AWS KMS; key material is never shared with another account.
      fr: |
        La rotation crée un nouveau matériel de clé dans AWS KMS ; le matériel de clé n'est jamais partagé avec un autre compte.
references:
  - title: Allowing users in other accounts to use a KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html
