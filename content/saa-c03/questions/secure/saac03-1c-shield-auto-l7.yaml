id: saac03-1c-shield-auto-l7
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming news company subscribes to AWS Shield Advanced and protects its Amazon CloudFront distribution, which has an AWS WAF web ACL associated with it. During recent HTTP floods, the security team had to write and deploy AWS WAF rules by hand while the attack was in progress.

    The company wants application layer DDoS attacks against the distribution to be mitigated with AWS WAF rules that are created and managed for it during the attack, without manual intervention.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'actualités sur les jeux vidéo est abonnée à AWS Shield Advanced et protège sa distribution Amazon CloudFront, à laquelle une liste ACL web AWS WAF est associée. Lors de récentes inondations HTTP, l'équipe de sécurité a dû écrire et déployer à la main des règles AWS WAF pendant l'attaque.

    L'entreprise veut que les attaques DDoS de la couche application contre la distribution soient atténuées par des règles AWS WAF créées et gérées pour elle pendant l'attaque, sans intervention manuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on proactive engagement so that the Shield Response Team contacts the company when an attack is detected."
        fr: "Activer l'engagement proactif pour que la Shield Response Team contacte l'entreprise lorsqu'une attaque est détectée."
    - id: b
      text:
        en: "Turn on Shield Advanced automatic application layer DDoS mitigation for the protected distribution."
        fr: "Activer l'atténuation automatique des attaques DDoS de la couche application de Shield Advanced pour la distribution protégée."
    - id: c
      text:
        en: "Associate an Amazon Route 53 health check with the protected distribution to enable health-based detection."
        fr: "Associer un contrôle d'état Amazon Route 53 à la distribution protégée pour activer la détection fondée sur l'état."
    - id: d
      text:
        en: "Create an AWS Firewall Manager security group policy that applies to the distribution's origin."
        fr: "Créer une politique de groupe de sécurité AWS Firewall Manager qui s'applique à l'origine de la distribution."
answer: { optionId: b }
explanation:
  correct:
    en: |
      With automatic application layer DDoS mitigation, Shield Advanced enforces AWS WAF rate limiting on requests from known DDoS sources and automatically adds and manages custom AWS WAF protections in response to detected attacks. It works through the web ACL associated with the protected resource and adds a rule group that uses 150 web ACL capacity units.
    fr: |
      Avec l'atténuation automatique des attaques DDoS de la couche application, Shield Advanced applique une limitation de débit AWS WAF aux requêtes provenant de sources DDoS connues, et ajoute et gère automatiquement des protections AWS WAF personnalisées en réponse aux attaques détectées. Elle s'appuie sur la liste ACL web associée à la ressource protégée et y ajoute un groupe de règles qui consomme 150 unités de capacité (WCU).
  options:
    a:
      en: |
        Proactive engagement makes the SRT contact you when a health check becomes unhealthy during an event; it does not create rules automatically.
      fr: |
        L'engagement proactif conduit la SRT à vous contacter lorsqu'un contrôle d'état devient défaillant pendant un événement ; il ne crée pas de règles automatiquement.
    c:
      en: |
        Health-based detection makes detection faster and reduces false positives, but on its own it does not add or manage AWS WAF rules.
      fr: |
        La détection fondée sur l'état accélère la détection et réduit les faux positifs, mais elle n'ajoute ni ne gère à elle seule des règles AWS WAF.
    d:
      en: |
        Security group policies manage layer 3 and 4 rules on network interfaces; they cannot mitigate HTTP floods and do not apply to a CloudFront distribution.
      fr: |
        Les politiques de groupe de sécurité gèrent des règles de couches 3 et 4 sur des interfaces réseau ; elles ne peuvent pas atténuer des inondations HTTP et ne s'appliquent pas à une distribution CloudFront.
