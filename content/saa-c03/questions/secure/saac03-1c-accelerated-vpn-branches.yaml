id: saac03-1c-accelerated-vpn-branches
objective: "1.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has branch offices in South America, Africa and Asia that connect to VPCs in a single AWS Region with Site-to-Site VPN connections over the internet. The VPCs are attached to a transit gateway. The branches experience unstable VPN performance because of long and congested internet paths. The company wants the VPN traffic to enter the AWS global network as close to each branch as possible, without ordering new circuits.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède des agences en Amérique du Sud, en Afrique et en Asie qui se connectent à des VPC d'une seule Région AWS par des connexions Site-to-Site VPN sur Internet. Les VPC sont attachés à une passerelle de transit. Les agences subissent des performances VPN instables à cause de chemins Internet longs et encombrés. L'entreprise veut que le trafic VPN entre sur le réseau mondial AWS au plus près de chaque agence, sans commander de nouveaux circuits.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on acceleration for the existing VPN connections in the transit gateway attachment settings."
        fr: "Activer l'accélération des connexions VPN existantes dans les paramètres de l'attachement de la passerelle de transit."
    - id: b
      text:
        en: "Create new accelerated Site-to-Site VPN connections attached to the transit gateway, and move each branch's customer gateway to its new connection."
        fr: "Créer de nouvelles connexions Site-to-Site VPN accélérées attachées à la passerelle de transit, et faire basculer la passerelle client de chaque agence vers sa nouvelle connexion."
    - id: c
      text:
        en: "Create accelerated Site-to-Site VPN connections that terminate on a virtual private gateway in each VPC."
        fr: "Créer des connexions Site-to-Site VPN accélérées qui se terminent sur une passerelle réseau privé virtuel dans chaque VPC."
    - id: d
      text:
        en: "Put an Amazon CloudFront distribution in front of the transit gateway to route the VPN traffic through edge locations."
        fr: "Placer une distribution Amazon CloudFront devant la passerelle de transit pour faire passer le trafic VPN par les emplacements périphériques."
answer: { optionId: b }
explanation:
  correct:
    en: |
      An accelerated Site-to-Site VPN connection uses AWS Global Accelerator to route traffic to the AWS edge location closest to the customer gateway, then across the AWS global network. Acceleration is supported only for VPN connections attached to a transit gateway and can be enabled only when a connection is created, so the branches move to new connections.
    fr: |
      Une connexion Site-to-Site VPN accélérée utilise AWS Global Accelerator pour router le trafic vers l'emplacement périphérique AWS le plus proche de la passerelle client, puis sur le réseau mondial AWS. L'accélération n'est prise en charge que pour les connexions VPN attachées à une passerelle de transit et ne peut être activée qu'à la création d'une connexion : les agences basculent donc vers de nouvelles connexions.
  options:
    a:
      en: |
        Acceleration cannot be turned on or off for an existing VPN connection; a new connection is required.
      fr: |
        L'accélération ne peut pas être activée ou désactivée sur une connexion VPN existante ; une nouvelle connexion est nécessaire.
    c:
      en: |
        Virtual private gateways do not support accelerated VPN connections.
      fr: |
        Les passerelles réseau privé virtuel ne prennent pas en charge les connexions VPN accélérées.
    d:
      en: |
        CloudFront delivers HTTP-based content and cannot carry IPsec VPN tunnels to a transit gateway.
      fr: |
        CloudFront distribue du contenu HTTP et ne peut pas transporter des tunnels VPN IPsec vers une passerelle de transit.
references:
  - title: Accelerated AWS Site-to-Site VPN connections
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/accelerated-vpn.html
