id: saac03-1b-identity-center-abac
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses IAM Identity Center with its corporate identity provider (IdP) as the identity source. In the IdP, each of the 400 developers has a project attribute. The developers belong to 40 project teams, and each team must access only the AWS resources tagged with its project name. Teams are created and reorganized often, and the cloud team does not want to create or update permission sets when that happens.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise IAM Identity Center avec son fournisseur d'identité (IdP) d'entreprise comme source d'identité. Dans l'IdP, chacun des 400 développeurs possède un attribut project. Les développeurs appartiennent à 40 équipes projet, et chaque équipe ne doit accéder qu'aux ressources AWS étiquetées avec le nom de son projet. Des équipes sont souvent créées et réorganisées, et l'équipe cloud ne veut pas créer ni modifier d'ensembles d'autorisations à chaque fois.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Map project as an attribute for access control, and use one permission set that matches aws:PrincipalTag/project to the resource tag.", fr: "Mapper project comme attribut de contrôle d'accès, et utiliser un seul ensemble d'autorisations qui compare aws:PrincipalTag/project à l'étiquette de la ressource." }
    - id: b
      text: { en: "Create one permission set per project team, and assign each permission set to the matching IdP group in every account.", fr: "Créer un ensemble d'autorisations par équipe projet, et attribuer chacun au groupe de l'IdP correspondant dans chaque compte." }
    - id: c
      text: { en: "Create one IAM role per developer in each account, with a policy that lists the ARNs of the team's resources.", fr: "Créer un rôle IAM par développeur dans chaque compte, avec une politique qui liste les ARN des ressources de l'équipe." }
    - id: d
      text: { en: "Create one SCP per project team that denies access to resources that do not carry the team's tag.", fr: "Créer une SCP par équipe projet qui refuse l'accès aux ressources ne portant pas l'étiquette de l'équipe." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Attribute-based access control (ABAC) in IAM Identity Center passes user attributes from the identity source into the session as principal tags. One permission set whose policy matches aws:PrincipalTag/project to aws:ResourceTag/project serves every team; when a developer changes teams, only the IdP attribute changes.
    fr: |
      Le contrôle d'accès basé sur les attributs (ABAC) d'IAM Identity Center transmet les attributs utilisateur de la source d'identité à la session sous forme d'étiquettes de principal. Un seul ensemble d'autorisations dont la politique fait correspondre aws:PrincipalTag/project à aws:ResourceTag/project sert toutes les équipes ; quand un développeur change d'équipe, seul l'attribut de l'IdP change.
  options:
    b:
      en: |
        One permission set per team works, but each new or renamed team requires a new permission set and new assignments.
      fr: |
        Un ensemble d'autorisations par équipe fonctionne, mais chaque équipe nouvelle ou renommée exige un nouvel ensemble d'autorisations et de nouvelles attributions.
    c:
      en: |
        Per-developer roles with resource lists must be updated whenever people or resources change, which is the most overhead.
      fr: |
        Des rôles par développeur avec des listes de ressources doivent être mis à jour à chaque changement de personnes ou de ressources : c'est la charge la plus lourde.
    d:
      en: |
        SCPs apply to whole accounts or OUs, not to individual users, and they never grant access.
      fr: |
        Les SCP s'appliquent à des comptes ou des OU entiers, pas à des utilisateurs individuels, et elles n'accordent jamais d'accès.
references:
  - title: Attribute-based access control
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/abac.html
