id: saac03-1d-encrypt-requires-new
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An audit of a company's AWS account found the resources listed in the options. The company must encrypt the data at rest of each resource with a customer managed AWS KMS key.

    For which resources must the company create a new resource and copy, replicate or restore the data into it to meet this requirement? (Choose three.)
  fr: |
    Un audit du compte AWS d'une entreprise a relevé les ressources indiquées dans les options. L'entreprise doit chiffrer les données au repos de chaque ressource avec une clé AWS KMS gérée par le client.

    Pour quelles ressources l'entreprise doit-elle créer une nouvelle ressource et y copier, répliquer ou restaurer les données pour répondre à cette exigence ? (Choisissez trois réponses.)
body:
  choose: 3
  options:
    - { id: a, text: { en: "An unencrypted Amazon EBS volume attached to an EC2 instance", fr: "Un volume Amazon EBS non chiffré attaché à une instance EC2" } }
    - { id: b, text: { en: "An Amazon DynamoDB table that uses the default AWS owned key", fr: "Une table Amazon DynamoDB qui utilise la clé détenue par AWS par défaut" } }
    - { id: c, text: { en: "An unencrypted Amazon Aurora MySQL DB cluster", fr: "Un cluster de base de données Amazon Aurora MySQL non chiffré" } }
    - { id: d, text: { en: "An Amazon SQS queue with server-side encryption disabled", fr: "Une file d'attente Amazon SQS dont le chiffrement côté serveur est désactivé" } }
    - { id: e, text: { en: "An unencrypted Amazon EFS file system", fr: "Un système de fichiers Amazon EFS non chiffré" } }
    - { id: f, text: { en: "An Amazon S3 bucket whose default encryption is SSE-S3, for objects written from now on", fr: "Un compartiment Amazon S3 dont le chiffrement par défaut est SSE-S3, pour les objets écrits désormais" } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: |
      An existing unencrypted EBS volume cannot be encrypted in place (create an encrypted volume from a snapshot), an Aurora DB cluster gets its encryption setting at creation (restore a snapshot into an encrypted cluster), and an EFS file system cannot change its encryption setting after creation (replicate the data to a new encrypted file system).
    fr: |
      Un volume EBS non chiffré existant ne peut pas être chiffré sur place (il faut créer un volume chiffré à partir d'un instantané), un cluster Aurora reçoit son paramètre de chiffrement à la création (il faut restaurer un instantané dans un cluster chiffré), et un système de fichiers EFS ne peut pas changer son paramètre de chiffrement après sa création (il faut répliquer les données vers un nouveau système de fichiers chiffré).
  options:
    b:
      en: |
        DynamoDB is always encrypted at rest, and the table can be switched from the AWS owned key to a customer managed key at any time.
      fr: |
        DynamoDB est toujours chiffré au repos, et la table peut passer à tout moment de la clé détenue par AWS à une clé gérée par le client.
    d:
      en: |
        Server-side encryption with a KMS key can be enabled on an existing SQS queue.
      fr: |
        Le chiffrement côté serveur avec une clé KMS peut être activé sur une file d'attente SQS existante.
    f:
      en: |
        The default encryption of an existing bucket can be changed to SSE-KMS at any time for new objects.
      fr: |
        Le chiffrement par défaut d'un compartiment existant peut être changé à tout moment en SSE-KMS pour les nouveaux objets.
references:
  - title: Encrypting data at rest
    url: https://docs.aws.amazon.com/efs/latest/ug/encryption-at-rest.html
  - title: DynamoDB encryption at rest
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/EncryptionAtRest.html
