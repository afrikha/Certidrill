id: saac03-1b-nacl-ephemeral-ports
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Web servers in a public subnet serve HTTPS (TCP 443) to clients on the internet. The company associates a new custom network ACL with the subnet. The network ACL contains only its default rules, which deny all inbound and outbound traffic. The security groups already allow the required traffic. The company must add only the network ACL rules that are needed for internet clients to reach the web servers.

    Which network ACL rules should the company add? (Choose two.)
  fr: |
    Des serveurs web d'un sous-réseau public servent du HTTPS (TCP 443) à des clients sur Internet. L'entreprise associe une nouvelle ACL réseau personnalisée au sous-réseau. Cette ACL réseau ne contient que ses règles par défaut, qui refusent tout le trafic entrant et sortant. Les groupes de sécurité autorisent déjà le trafic requis. L'entreprise doit ajouter uniquement les règles d'ACL réseau nécessaires pour que les clients Internet joignent les serveurs web.

    Quelles règles d'ACL réseau l'entreprise doit-elle ajouter ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An inbound rule that allows TCP 443 from 0.0.0.0/0", fr: "Une règle entrante qui autorise TCP 443 depuis 0.0.0.0/0" } }
    - { id: b, text: { en: "An inbound rule that allows TCP 1024-65535 from 0.0.0.0/0", fr: "Une règle entrante qui autorise TCP 1024-65535 depuis 0.0.0.0/0" } }
    - { id: c, text: { en: "An outbound rule that allows TCP 443 to 0.0.0.0/0", fr: "Une règle sortante qui autorise TCP 443 vers 0.0.0.0/0" } }
    - { id: d, text: { en: "An outbound rule that allows all ICMP traffic to 0.0.0.0/0", fr: "Une règle sortante qui autorise tout le trafic ICMP vers 0.0.0.0/0" } }
    - { id: e, text: { en: "An outbound rule that allows TCP 1024-65535 to 0.0.0.0/0", fr: "Une règle sortante qui autorise TCP 1024-65535 vers 0.0.0.0/0" } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |
      Network ACLs are stateless, so the response traffic needs its own rule. Clients connect to port 443, which needs an inbound rule, and the servers reply to the client's ephemeral port, which depends on the client operating system. AWS suggests opening 1024-65535 outbound to cover the different clients on the internet.
    fr: |
      Les ACL réseau sont sans état : le trafic de réponse a besoin de sa propre règle. Les clients se connectent au port 443, ce qui exige une règle entrante, et les serveurs répondent sur le port éphémère du client, qui dépend de son système d'exploitation. AWS suggère d'ouvrir 1024-65535 en sortie pour couvrir les différents clients d'Internet.
  options:
    b:
      en: |
        Inbound ephemeral ports are needed only for responses to connections that the servers start themselves, which is not required here.
      fr: |
        Les ports éphémères entrants ne sont nécessaires que pour les réponses aux connexions initiées par les serveurs eux-mêmes, ce qui n'est pas requis ici.
    c:
      en: |
        Responses go to the client's ephemeral port, not to port 443, so this rule does not allow the replies.
      fr: |
        Les réponses vont vers le port éphémère du client, pas vers le port 443 : cette règle n'autorise pas les réponses.
    d:
      en: |
        ICMP is not needed to serve HTTPS, and it does not carry the TCP responses.
      fr: |
        ICMP n'est pas nécessaire pour servir du HTTPS, et il ne transporte pas les réponses TCP.
references:
  - title: Custom network ACLs for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/custom-network-acl.html
  - title: Control subnet traffic with network access control lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
