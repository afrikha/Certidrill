id: saac03-1b-sg-reference-app-tier
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a web tier and an application tier in two separate Auto Scaling groups in the same VPC. The application servers listen on TCP port 8080. Only the web servers must be able to reach the application servers on that port. Instance IP addresses change as the groups scale in and out.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute un niveau web et un niveau application dans deux groupes Auto Scaling distincts du même VPC. Les serveurs d'application écoutent sur le port TCP 8080. Seuls les serveurs web doivent pouvoir joindre les serveurs d'application sur ce port. Les adresses IP des instances changent à mesure que les groupes se réduisent et s'étendent.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Add an inbound rule to the application servers' security group that allows TCP 8080 from the CIDR ranges of the web subnets.", fr: "Ajouter au groupe de sécurité des serveurs d'application une règle entrante qui autorise TCP 8080 depuis les plages CIDR des sous-réseaux web." }
    - id: b
      text: { en: "Add network ACL rules to the application subnets that allow TCP 8080 from each web server's IP address.", fr: "Ajouter aux sous-réseaux d'application des règles d'ACL réseau qui autorisent TCP 8080 depuis l'adresse IP de chaque serveur web." }
    - id: c
      text: { en: "Add an outbound rule to the web servers' security group that allows TCP 8080 to the application subnets, and no other rule.", fr: "Ajouter au groupe de sécurité des serveurs web une règle sortante qui autorise TCP 8080 vers les sous-réseaux d'application, et aucune autre règle." }
    - id: d
      text: { en: "Add an inbound rule to the application servers' security group that allows TCP 8080 from the web servers' security group.", fr: "Ajouter au groupe de sécurité des serveurs d'application une règle entrante qui autorise TCP 8080 depuis le groupe de sécurité des serveurs web." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A security group rule can use another security group as its source. Traffic is allowed from any network interface associated with the web servers' security group, whatever its IP address, so new instances are covered automatically and other resources in the web subnets are excluded.
    fr: |
      Une règle de groupe de sécurité peut utiliser un autre groupe de sécurité comme source. Le trafic est autorisé depuis toute interface réseau associée au groupe de sécurité des serveurs web, quelle que soit son adresse IP : les nouvelles instances sont couvertes automatiquement et les autres ressources des sous-réseaux web sont exclues.
  options:
    a:
      en: |
        Subnet CIDR ranges also allow any other resource in the web subnets, so the web servers are not the only allowed sources.
      fr: |
        Les plages CIDR des sous-réseaux autorisent aussi toute autre ressource des sous-réseaux web : les serveurs web ne sont pas les seules sources autorisées.
    b:
      en: |
        Per-instance IP rules must be updated every time the group scales, which is high overhead and error-prone.
      fr: |
        Des règles par adresse IP d'instance doivent être mises à jour à chaque mise à l'échelle du groupe, ce qui est lourd et source d'erreurs.
    c:
      en: |
        Without an inbound rule on the application servers' security group, the traffic is still blocked when it arrives.
      fr: |
        Sans règle entrante sur le groupe de sécurité des serveurs d'application, le trafic reste bloqué à son arrivée.
references:
  - title: Control traffic to your AWS resources using security groups
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
