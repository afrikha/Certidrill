id: saac03-1b-cloudfront-signed-cookies
objective: "1.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A training company streams video courses to paying subscribers through Amazon CloudFront. Each course consists of hundreds of HLS segment files. Only signed-in subscribers must be able to view the files, and the company does not want to change the URLs of the existing files.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de formation diffuse des cours vidéo à des abonnés payants par Amazon CloudFront. Chaque cours se compose de centaines de fichiers de segments HLS. Seuls les abonnés connectés doivent pouvoir voir les fichiers, et l'entreprise ne veut pas modifier les URL des fichiers existants.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Generate a CloudFront signed URL for every segment file when a subscriber opens a course.", fr: "Générer une URL signée CloudFront pour chaque fichier de segment lorsqu'un abonné ouvre un cours." }
    - id: b
      text: { en: "Issue CloudFront signed cookies at sign-in, and require a trusted key group on the distribution.", fr: "Émettre des cookies signés CloudFront à la connexion, et exiger un groupe de clés approuvé sur la distribution." }
    - id: c
      text: { en: "Generate S3 presigned URLs for every segment file, and let subscribers download from S3 directly.", fr: "Générer des URL présignées S3 pour chaque fichier de segment, et laisser les abonnés télécharger directement depuis S3." }
    - id: d
      text: { en: "Add an AWS WAF rule to the distribution that allows requests only from the subscribers' IP addresses.", fr: "Ajouter à la distribution une règle AWS WAF qui n'autorise que les requêtes provenant des adresses IP des abonnés." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Signed cookies give access to many restricted files, such as all the segments of an HLS video, and they keep the existing URLs unchanged. The distribution requires signed requests through a trusted key group, and the application sets the cookies when a subscriber signs in.
    fr: |
      Les cookies signés donnent accès à de nombreux fichiers restreints, comme tous les segments d'une vidéo HLS, et conservent les URL existantes. La distribution exige des requêtes signées par un groupe de clés approuvé, et l'application place les cookies lorsqu'un abonné se connecte.
  options:
    a:
      en: |
        Signed URLs suit individual files and change every URL, which the company wants to avoid.
      fr: |
        Les URL signées conviennent à des fichiers individuels et modifient chaque URL, ce que l'entreprise veut éviter.
    c:
      en: |
        Presigned S3 URLs bypass CloudFront and change every URL.
      fr: |
        Les URL présignées S3 contournent CloudFront et modifient chaque URL.
    d:
      en: |
        Subscriber IP addresses change and are unknown in advance, so IP rules cannot identify signed-in subscribers.
      fr: |
        Les adresses IP des abonnés changent et sont inconnues à l'avance : des règles IP ne peuvent pas identifier les abonnés connectés.
references:
  - title: Decide to use signed URLs or signed cookies
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-choosing-signed-urls-cookies.html
