id: saac03-1d-backup-vault-lock
objective: "1.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Backup to protect its production databases. After a ransomware incident at a competitor, the company requires that recovery points stored in its backup vault cannot be deleted or have their retention shortened by anyone, including administrators and the root user, until each retention period ends.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Backup pour protéger ses bases de données de production. Après un incident de rançongiciel chez un concurrent, l'entreprise exige que les points de récupération stockés dans son coffre-fort de sauvegarde ne puissent être ni supprimés ni voir leur conservation raccourcie par quiconque, y compris les administrateurs et l'utilisateur racine, avant la fin de chaque période de conservation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Apply AWS Backup Vault Lock in governance mode to the vault and restrict the IAM permissions that can remove the lock.", fr: "Appliquer AWS Backup Vault Lock en mode gouvernance au coffre-fort et restreindre les autorisations IAM capables de retirer le verrou." }
    - id: b
      text: { en: "Apply AWS Backup Vault Lock in compliance mode to the vault and let the grace time expire.", fr: "Appliquer AWS Backup Vault Lock en mode conformité au coffre-fort et laisser expirer le délai de grâce." }
    - id: c
      text: { en: "Add a vault access policy that denies backup:DeleteRecoveryPoint to every principal in the account.", fr: "Ajouter une politique d'accès au coffre-fort qui refuse backup:DeleteRecoveryPoint à tous les principaux du compte." }
    - id: d
      text: { en: "Add a copy rule to the backup plan that copies every recovery point to a vault in a second Region.", fr: "Ajouter au plan de sauvegarde une règle de copie qui copie chaque point de récupération vers un coffre-fort d'une deuxième Région." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      In compliance mode, AWS Backup Vault Lock makes the vault WORM. Once the grace time (at least 72 hours) has passed, no user, including the root user, and not even AWS, can delete recovery points early or change or remove the lock.
    fr: |
      En mode conformité, AWS Backup Vault Lock rend le coffre-fort WORM. Une fois le délai de grâce (au moins 72 heures) écoulé, aucun utilisateur, y compris l'utilisateur racine, ni même AWS, ne peut supprimer prématurément des points de récupération ni modifier ou retirer le verrou.
  options:
    a:
      en: |
        In governance mode, users with sufficient IAM permissions can still manage or remove the lock, so administrators are not fully excluded.
      fr: |
        En mode gouvernance, les utilisateurs disposant d'autorisations IAM suffisantes peuvent toujours gérer ou retirer le verrou : les administrateurs ne sont donc pas totalement exclus.
    c:
      en: |
        An administrator or the root user can edit or remove the vault access policy and then delete the recovery points.
      fr: |
        Un administrateur ou l'utilisateur racine peut modifier ou supprimer la politique d'accès au coffre-fort, puis supprimer les points de récupération.
    d:
      en: |
        Copies in another Region improve resilience, but they can be deleted by administrators just like the originals.
      fr: |
        Des copies dans une autre Région améliorent la résilience, mais les administrateurs peuvent les supprimer comme les originaux.
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
