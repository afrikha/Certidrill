id: saac03-1d-cloudtrail-tamper-proof
objective: "1.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company must retain the AWS CloudTrail logs of all the accounts in its organization for 7 years to meet a financial regulation. Auditors must be able to prove that no log file was modified or deleted after delivery. No user, including the root user of the log archive account, can be able to delete a log file during the retention period.

    The logs will be delivered to a new Amazon S3 bucket in a dedicated log archive account.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise doit conserver pendant 7 ans les journaux AWS CloudTrail de tous les comptes de son organisation pour respecter une réglementation financière. Les auditeurs doivent pouvoir prouver qu'aucun fichier journal n'a été modifié ni supprimé après sa livraison. Aucun utilisateur, y compris l'utilisateur racine du compte d'archivage des journaux, ne doit pouvoir supprimer un fichier journal pendant la période de conservation.

    Les journaux seront livrés dans un nouveau compartiment Amazon S3 situé dans un compte d'archivage des journaux dédié.

    Quelle combinaison d'étapes permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an organization trail with log file integrity validation enabled that delivers to the bucket.", fr: "Créer un journal de suivi d'organisation, avec la validation de l'intégrité des fichiers journaux activée, qui livre vers le compartiment." } }
    - { id: b, text: { en: "Enable S3 Object Lock on the bucket with a default retention of 7 years in governance mode.", fr: "Activer S3 Object Lock sur le compartiment avec une conservation par défaut de 7 ans en mode gouvernance." } }
    - { id: c, text: { en: "Enable S3 Object Lock on the bucket with a default retention of 7 years in compliance mode.", fr: "Activer S3 Object Lock sur le compartiment avec une conservation par défaut de 7 ans en mode conformité." } }
    - { id: d, text: { en: "Configure the trail to encrypt the log files with SSE-KMS by using a customer managed key.", fr: "Configurer le journal de suivi pour chiffrer les fichiers journaux en SSE-KMS avec une clé gérée par le client." } }
    - { id: e, text: { en: "Add an S3 Lifecycle rule that transitions the log files to S3 Glacier Deep Archive after 90 days.", fr: "Ajouter une règle S3 Lifecycle qui fait passer les fichiers journaux vers S3 Glacier Deep Archive après 90 jours." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Log file integrity validation makes CloudTrail deliver signed hourly digest files (SHA-256 hashes, RSA signatures), so auditors can prove whether a log file was modified or deleted. Object Lock in compliance mode stores the files as WORM objects that no user, including the root user, can delete or overwrite before the retention date.
    fr: |
      La validation de l'intégrité des fichiers journaux fait livrer par CloudTrail des fichiers de condensat horaires signés (hachages SHA-256, signatures RSA), ce qui permet aux auditeurs de prouver si un fichier journal a été modifié ou supprimé. S3 Object Lock en mode conformité stocke les fichiers comme des objets WORM qu'aucun utilisateur, y compris l'utilisateur racine, ne peut supprimer ni remplacer avant la date de fin de conservation.
  options:
    b:
      en: |
        In governance mode, users with the `s3:BypassGovernanceRetention` permission can delete protected versions, so the logs are not protected from every user.
      fr: |
        En mode gouvernance, les utilisateurs disposant de l'autorisation `s3:BypassGovernanceRetention` peuvent supprimer les versions protégées ; les journaux ne sont donc pas protégés contre tous les utilisateurs.
    d:
      en: |
        SSE-KMS protects the confidentiality of the logs. It neither proves integrity nor prevents deletion.
      fr: |
        SSE-KMS protège la confidentialité des journaux. Il ne prouve pas leur intégrité et n'empêche pas leur suppression.
    e:
      en: |
        A transition to Deep Archive reduces storage cost, but archived objects can still be deleted and their integrity is not proven.
      fr: |
        Un passage vers Deep Archive réduit le coût de stockage, mais les objets archivés peuvent toujours être supprimés et leur intégrité n'est pas prouvée.
references:
  - title: Validating CloudTrail log file integrity
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-validation-intro.html
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
