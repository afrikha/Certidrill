id: saac03-1c-nacl-ephemeral-outbound
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts a public website on Amazon EC2 instances in a public subnet. The instances' security group allows inbound HTTPS from 0.0.0.0/0 and keeps the default outbound rule. The company associated a new custom network ACL with the subnet. The network ACL has one inbound rule that allows TCP port 443 from 0.0.0.0/0 and no other rules except the default deny rules.

    Users report that connections to the website time out. Which change will resolve the issue?
  fr: |
    Une entreprise héberge un site web public sur des instances Amazon EC2 dans un sous-réseau public. Le groupe de sécurité des instances autorise le HTTPS entrant depuis 0.0.0.0/0 et conserve la règle sortante par défaut. L'entreprise a associé une nouvelle ACL réseau personnalisée au sous-réseau. Cette ACL réseau contient une règle entrante qui autorise le port TCP 443 depuis 0.0.0.0/0 et aucune autre règle en dehors des règles de refus par défaut.

    Les utilisateurs signalent que les connexions au site web expirent. Quelle modification résout le problème ?
body:
  options:
    - id: a
      text:
        en: "Add an outbound rule to the security group that allows TCP ports 1024-65535 to 0.0.0.0/0."
        fr: "Ajouter au groupe de sécurité une règle sortante qui autorise les ports TCP 1024-65535 vers 0.0.0.0/0."
    - id: b
      text:
        en: "Add an inbound rule to the network ACL that allows TCP ports 1024-65535 from 0.0.0.0/0."
        fr: "Ajouter à l'ACL réseau une règle entrante qui autorise les ports TCP 1024-65535 depuis 0.0.0.0/0."
    - id: c
      text:
        en: "Add an outbound rule to the network ACL that allows TCP ports 1024-65535 to 0.0.0.0/0."
        fr: "Ajouter à l'ACL réseau une règle sortante qui autorise les ports TCP 1024-65535 vers 0.0.0.0/0."
    - id: d
      text:
        en: "Add an outbound rule to the network ACL that allows TCP port 443 to 0.0.0.0/0."
        fr: "Ajouter à l'ACL réseau une règle sortante qui autorise le port TCP 443 vers 0.0.0.0/0."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Network ACLs are stateless: return traffic is not allowed automatically. The responses from the web servers go back to the clients' ephemeral ports, so the network ACL needs an outbound rule that allows TCP 1024-65535. A new custom network ACL denies all traffic that no rule allows.
    fr: |
      Les ACL réseau sont sans état : le trafic de retour n'est pas autorisé automatiquement. Les réponses des serveurs web repartent vers les ports éphémères des clients ; l'ACL réseau a donc besoin d'une règle sortante qui autorise le TCP 1024-65535. Une nouvelle ACL réseau personnalisée refuse tout le trafic qu'aucune règle n'autorise.
  options:
    a:
      en: |
        Security groups are stateful, so responses to allowed inbound traffic are already allowed out. The block is in the network ACL.
      fr: |
        Les groupes de sécurité sont avec état : les réponses au trafic entrant autorisé sortent déjà. Le blocage se trouve dans l'ACL réseau.
    b:
      en: |
        The responses leave the subnet; an inbound rule does not allow outbound return traffic.
      fr: |
        Les réponses sortent du sous-réseau ; une règle entrante n'autorise pas le trafic de retour sortant.
    d:
      en: |
        The responses are sent from port 443 to the clients' ephemeral ports, so an outbound rule for destination port 443 does not match them.
      fr: |
        Les réponses partent du port 443 vers les ports éphémères des clients : une règle sortante pour le port de destination 443 ne les couvre pas.
references:
  - title: Control subnet traffic with network access control lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
  - title: Control traffic to your AWS resources using security groups
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
