id: saac03-1d-kms-admins-vs-users
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company encrypts sensitive data with a customer managed AWS KMS key. The security team requires separation of duties: the IAM role used by the key administrators must be able to manage the key (edit the key policy, enable rotation, schedule deletion) but must not be able to decrypt data. The IAM role of the application must be able to encrypt and decrypt data but must not be able to manage the key.

    Which solution will meet these requirements?
  fr: |
    Une entreprise chiffre des données sensibles avec une clé AWS KMS gérée par le client. L'équipe de sécurité exige une séparation des tâches : le rôle IAM utilisé par les administrateurs de la clé doit pouvoir gérer la clé (modifier la politique de clé, activer la rotation, planifier la suppression) mais ne doit pas pouvoir déchiffrer les données. Le rôle IAM de l'application doit pouvoir chiffrer et déchiffrer les données mais ne doit pas pouvoir gérer la clé.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach the AWSKeyManagementServicePowerUser managed policy to both roles and rely on the default key policy.", fr: "Attacher la politique gérée AWSKeyManagementServicePowerUser aux deux rôles et s'appuyer sur la politique de clé par défaut." }
    - id: b
      text: { en: "Write a key policy that allows management actions to the administrator role and cryptographic actions to the application role.", fr: "Rédiger une politique de clé qui autorise les actions de gestion au rôle d'administrateur et les actions de chiffrement au rôle de l'application." }
    - id: c
      text: { en: "Attach an SCP that grants kms:Encrypt and kms:Decrypt to the application role and kms:PutKeyPolicy to the administrator role.", fr: "Attacher une SCP qui accorde kms:Encrypt et kms:Decrypt au rôle de l'application et kms:PutKeyPolicy au rôle d'administrateur." }
    - id: d
      text: { en: "Encrypt the data with the AWS managed key for the service and grant each role access through its IAM policy.", fr: "Chiffrer les données avec la clé gérée par AWS du service et accorder l'accès à chaque rôle par sa politique IAM." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The key policy is the primary access control for a KMS key. A key administrators statement allows management actions (such as kms:PutKeyPolicy, kms:EnableKeyRotation, kms:ScheduleKeyDeletion) without cryptographic operations, and a key users statement allows kms:Encrypt, kms:Decrypt and kms:GenerateDataKey* for the application role only.
    fr: |
      La politique de clé est le principal contrôle d'accès d'une clé KMS. Une instruction pour les administrateurs de clé autorise les actions de gestion (comme kms:PutKeyPolicy, kms:EnableKeyRotation, kms:ScheduleKeyDeletion) sans opérations de chiffrement, et une instruction pour les utilisateurs de clé autorise kms:Encrypt, kms:Decrypt et kms:GenerateDataKey* au seul rôle de l'application.
  options:
    a:
      en: |
        The same identity policy on both roles cannot separate key management from key use, which is the requirement.
      fr: |
        La même politique d'identité sur les deux rôles ne peut pas séparer la gestion de la clé de son utilisation, ce qui est l'exigence.
    c:
      en: |
        SCPs never grant permissions; they only set the maximum permissions available in member accounts.
      fr: |
        Les SCP n'accordent jamais d'autorisations ; elles définissent seulement les autorisations maximales disponibles dans les comptes membres.
    d:
      en: |
        The key policy of an AWS managed key cannot be changed, and nobody can administer the key, so the required separation cannot be configured.
      fr: |
        La politique de clé d'une clé gérée par AWS ne peut pas être modifiée et personne ne peut administrer cette clé : la séparation exigée ne peut donc pas être configurée.
references:
  - title: Default key policy
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
