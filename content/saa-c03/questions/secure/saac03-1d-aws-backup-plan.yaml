id: saac03-1d-aws-backup-plan
objective: "1.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs workloads on Amazon EC2 instances with Amazon EBS volumes, Amazon RDS DB instances, Amazon DynamoDB tables and Amazon EFS file systems. Today, each team scripts its own backups. A new policy requires daily backups of every resource tagged backup=daily, retention of 35 days, and a copy of each backup in a second AWS Region.

    The company wants a central solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute des charges de travail sur des instances Amazon EC2 avec des volumes Amazon EBS, des instances de base de données Amazon RDS, des tables Amazon DynamoDB et des systèmes de fichiers Amazon EFS. Aujourd'hui, chaque équipe écrit ses propres scripts de sauvegarde. Une nouvelle politique impose une sauvegarde quotidienne de chaque ressource étiquetée backup=daily, une conservation de 35 jours et une copie de chaque sauvegarde dans une deuxième Région AWS.

    L'entreprise souhaite une solution centralisée avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Schedule AWS Lambda functions with Amazon EventBridge to create and copy snapshots and backups of each service through the AWS SDK.", fr: "Planifier avec Amazon EventBridge des fonctions AWS Lambda qui créent et copient les instantanés et sauvegardes de chaque service via le kit SDK AWS." }
    - id: b
      text: { en: "Create Amazon Data Lifecycle Manager policies that target the backup=daily tag and copy snapshots to the second Region.", fr: "Créer des politiques Amazon Data Lifecycle Manager qui ciblent l'étiquette backup=daily et copient les instantanés vers la deuxième Région." }
    - id: c
      text: { en: "Configure the native backup feature of each service separately and copy the backups to the second Region with S3 Cross-Region Replication.", fr: "Configurer séparément la fonction de sauvegarde native de chaque service et copier les sauvegardes vers la deuxième Région avec S3 Cross-Region Replication." }
    - id: d
      text: { en: "Create an AWS Backup plan with a daily rule, 35-day retention and a cross-Region copy, and assign resources by the backup=daily tag.", fr: "Créer un plan AWS Backup avec une règle quotidienne, une conservation de 35 jours et une copie entre Régions, et affecter les ressources par l'étiquette backup=daily." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      AWS Backup centralizes policy-based backups for EC2, EBS, RDS, DynamoDB, EFS and other services. A backup plan defines the schedule, the retention and a copy to another Region, and resources are assigned to the plan by tag, so new tagged resources are protected automatically.
    fr: |
      AWS Backup centralise des sauvegardes fondées sur des politiques pour EC2, EBS, RDS, DynamoDB, EFS et d'autres services. Un plan de sauvegarde définit la planification, la conservation et une copie vers une autre Région, et les ressources sont affectées au plan par étiquette : les nouvelles ressources étiquetées sont protégées automatiquement.
  options:
    a:
      en: |
        Custom Lambda code for four services must be written, tested and maintained, which is not the least operational overhead.
      fr: |
        Du code Lambda personnalisé pour quatre services doit être écrit, testé et maintenu, ce qui n'est pas la charge opérationnelle la plus faible.
    b:
      en: |
        Amazon Data Lifecycle Manager automates EBS snapshots and EBS-backed AMIs only; it does not back up RDS, DynamoDB or EFS.
      fr: |
        Amazon Data Lifecycle Manager automatise uniquement les instantanés EBS et les AMI basées sur EBS ; il ne sauvegarde ni RDS, ni DynamoDB, ni EFS.
    c:
      en: |
        Service-native backups are not stored in buckets that the company can replicate with S3 Cross-Region Replication, and managing each service separately is not central.
      fr: |
        Les sauvegardes natives des services ne sont pas stockées dans des compartiments que l'entreprise pourrait répliquer avec S3 Cross-Region Replication, et gérer chaque service séparément n'est pas centralisé.
references:
  - title: What is AWS Backup?
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html
  - title: Automate backups with Amazon Data Lifecycle Manager
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-lifecycle.html
