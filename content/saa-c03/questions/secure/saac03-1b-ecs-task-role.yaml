id: saac03-1b-ecs-task-role
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs two containerized services as Amazon ECS tasks on the same Amazon EC2 container instances. The orders service must write items to an Amazon DynamoDB table, and the reporting service must read objects from an S3 bucket. Each service must receive only the permissions that it needs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute deux services conteneurisés sous forme de tâches Amazon ECS sur les mêmes instances de conteneur Amazon EC2. Le service de commandes doit écrire des éléments dans une table Amazon DynamoDB, et le service de rapports doit lire des objets dans un compartiment S3. Chaque service ne doit recevoir que les autorisations dont il a besoin.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add both sets of permissions to the IAM role in the container instances' instance profile.", fr: "Ajouter les deux ensembles d'autorisations au rôle IAM du profil d'instance des instances de conteneur." }
    - id: b
      text: { en: "Add the DynamoDB and S3 permissions to the task execution role that both task definitions use.", fr: "Ajouter les autorisations DynamoDB et S3 au rôle d'exécution de tâche utilisé par les deux définitions de tâche." }
    - id: c
      text: { en: "Create a separate task IAM role for each service with only its permissions, and set it in that service's task definition.", fr: "Créer un rôle IAM de tâche distinct pour chaque service avec ses seules autorisations, et le définir dans la définition de tâche du service." }
    - id: d
      text: { en: "Pass the access keys of a different IAM user to each service as environment variables in the task definitions.", fr: "Transmettre à chaque service les clés d'accès d'un utilisateur IAM différent comme variables d'environnement dans les définitions de tâche." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A task IAM role delivers credentials to the containers of one task, and the application code uses them to call AWS services. When a task role is set, the SDK in the containers uses only that role and does not inherit the instance role, so each service gets exactly its own permissions.
    fr: |
      Un rôle IAM de tâche fournit des informations d'identification aux conteneurs d'une tâche, et le code de l'application les utilise pour appeler les services AWS. Lorsqu'un rôle de tâche est défini, le SDK des conteneurs utilise uniquement ce rôle et n'hérite pas du rôle de l'instance : chaque service obtient exactement ses propres autorisations.
  options:
    a:
      en: |
        Every task on the instance could use the instance role, so both services would get both permissions.
      fr: |
        Toutes les tâches de l'instance pourraient utiliser le rôle de l'instance : les deux services obtiendraient les deux autorisations.
    b:
      en: |
        The task execution role is used by the ECS agent to pull images, send logs and fetch secrets; it is not the role the application code uses, and sharing it would mix permissions.
      fr: |
        Le rôle d'exécution de tâche sert à l'agent ECS pour extraire les images, envoyer les journaux et récupérer les secrets ; ce n'est pas le rôle utilisé par le code de l'application, et le partager mélangerait les autorisations.
    d:
      en: |
        Access keys in task definitions are long-term credentials that are visible in plain text.
      fr: |
        Des clés d'accès dans les définitions de tâche sont des informations d'identification à long terme visibles en clair.
references:
  - title: Amazon ECS task IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
