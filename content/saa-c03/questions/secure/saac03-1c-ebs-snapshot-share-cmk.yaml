id: saac03-1c-ebs-snapshot-share-cmk
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must share an Amazon EBS snapshot of a database volume with a partner's AWS account so that the partner can create a volume from it. The snapshot is encrypted with the AWS managed key aws/ebs. The data must stay encrypted, and only the partner account may receive access.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit partager un instantané Amazon EBS d'un volume de base de données avec le compte AWS d'un partenaire, afin que celui-ci puisse en créer un volume. L'instantané est chiffré avec la clé gérée par AWS aws/ebs. Les données doivent rester chiffrées, et seul le compte du partenaire doit recevoir l'accès.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Modify the create volume permissions of the snapshot to share it directly with the partner account."
        fr: "Modifier les autorisations de création de volume de l'instantané pour le partager directement avec le compte du partenaire."
    - id: b
      text:
        en: "Edit the key policy of the aws/ebs key to allow the partner account to use the key, and then share the snapshot."
        fr: "Modifier la politique de la clé aws/ebs pour autoriser le compte du partenaire à utiliser la clé, puis partager l'instantané."
    - id: c
      text:
        en: "Make the snapshot public for a short period, and ask the partner to copy it into its own account during that period."
        fr: "Rendre l'instantané public pendant une courte période, et demander au partenaire de le copier dans son propre compte pendant cette période."
    - id: d
      text:
        en: "Copy the snapshot with a customer managed key, allow the partner account in the key policy, and share the copy."
        fr: "Copier l'instantané avec une clé gérée par le client, autoriser le compte du partenaire dans la politique de clé, et partager la copie."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Only snapshots encrypted with a customer managed key can be shared with other accounts, and the key must be shared as well: its key policy must allow the partner's principals, whose IAM policies must allow the same actions. Copying the snapshot with a customer managed key re-encrypts it so that it can be shared.
    fr: |
      Seuls les instantanés chiffrés avec une clé gérée par le client peuvent être partagés avec d'autres comptes, et la clé doit l'être aussi : sa politique de clé doit autoriser les principaux du partenaire, dont les politiques IAM doivent autoriser les mêmes actions. Copier l'instantané avec une clé gérée par le client le rechiffre pour qu'il puisse être partagé.
  options:
    a:
      en: |
        A snapshot encrypted under an AWS managed key cannot be shared by granting create volume permission alone.
      fr: |
        Un instantané chiffré avec une clé gérée par AWS ne peut pas être partagé en accordant seulement l'autorisation de création de volume.
    b:
      en: |
        The policy of an AWS managed key is controlled by AWS and cannot be edited.
      fr: |
        La politique d'une clé gérée par AWS est contrôlée par AWS et ne peut pas être modifiée.
    c:
      en: |
        Only unencrypted snapshots can be shared publicly, and public sharing would give access to everyone, not only the partner.
      fr: |
        Seuls les instantanés non chiffrés peuvent être partagés publiquement, et un partage public donnerait l'accès à tous, pas seulement au partenaire.
references:
  - title: Share an Amazon EBS snapshot with other AWS accounts
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modifying-snapshot-permissions.html
