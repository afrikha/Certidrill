id: saac03-1a-boundary-effective-perms
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An IAM role used by a developer has the AdministratorAccess policy attached. The role also has a permissions boundary that allows only Amazon S3 and Amazon CloudWatch actions. There is no SCP or resource-based policy that affects the request. The developer uses the role to call ec2:RunInstances.

    What is the result of the request?
  fr: |
    Un rôle IAM utilisé par un développeur a la politique AdministratorAccess attachée. Le rôle a aussi une limite d'autorisations (permissions boundary) qui n'autorise que les actions Amazon S3 et Amazon CloudWatch. Aucune SCP ni politique basée sur les ressources n'affecte la requête. Le développeur utilise le rôle pour appeler ec2:RunInstances.

    Quel est le résultat de la requête ?
body:
  options:
    - id: a
      text: { en: "The request is allowed because the identity-based policy explicitly allows all actions.", fr: "La requête est autorisée, car la politique basée sur l'identité autorise explicitement toutes les actions." }
    - id: b
      text: { en: "The request is allowed because a permissions boundary applies only to IAM actions.", fr: "La requête est autorisée, car une limite d'autorisations ne s'applique qu'aux actions IAM." }
    - id: c
      text: { en: "The request is allowed only if the developer also has an IAM user with EC2 permissions.", fr: "La requête n'est autorisée que si le développeur dispose aussi d'un utilisateur IAM avec des autorisations EC2." }
    - id: d
      text: { en: "The request is denied because ec2:RunInstances is not allowed by the permissions boundary.", fr: "La requête est refusée, car ec2:RunInstances n'est pas autorisé par la limite d'autorisations." }
answer: { optionId: d }
explanation:
  correct:
    en: "When a permissions boundary is set, the effective permissions of the role are the intersection of its identity-based policies and the boundary. AdministratorAccess allows the action, but the boundary does not, so the request is implicitly denied."
    fr: "Lorsqu'une limite d'autorisations est définie, les autorisations effectives du rôle sont l'intersection de ses politiques basées sur l'identité et de la limite. AdministratorAccess autorise l'action, mais pas la limite : la requête est implicitement refusée."
  options:
    a:
      en: "An allow in the identity-based policy is not enough; the boundary must also allow the action."
      fr: "Une autorisation dans la politique basée sur l'identité ne suffit pas ; la limite doit aussi autoriser l'action."
    b:
      en: "A permissions boundary caps all actions that identity-based policies grant, not only IAM actions."
      fr: "Une limite d'autorisations plafonne toutes les actions accordées par les politiques basées sur l'identité, pas seulement les actions IAM."
    c:
      en: "The permissions of another identity do not combine with the role session; only the role's policies and boundary are evaluated."
      fr: "Les autorisations d'une autre identité ne se cumulent pas avec la session du rôle ; seules les politiques et la limite du rôle sont évaluées."
references:
  - title: Permissions boundaries for IAM entities
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
