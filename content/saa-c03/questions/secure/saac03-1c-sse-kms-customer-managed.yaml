id: saac03-1c-sse-kms-customer-managed
objective: "1.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial company stores reports in an Amazon S3 bucket. Its security policy requires that the company control the key policy of the encryption key, audit every use of the key in AWS CloudTrail, and be able to disable the key immediately if a breach is suspected.

    Which encryption option will meet these requirements?
  fr: |
    Une entreprise financière stocke des rapports dans un compartiment Amazon S3. Sa politique de sécurité exige que l'entreprise contrôle la politique de clé de la clé de chiffrement, audite chaque utilisation de la clé dans AWS CloudTrail et puisse désactiver la clé immédiatement en cas de suspicion de violation.

    Quelle option de chiffrement répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Server-side encryption with Amazon S3 managed keys (SSE-S3)."
        fr: "Le chiffrement côté serveur avec des clés gérées par Amazon S3 (SSE-S3)."
    - id: b
      text:
        en: "Server-side encryption with AWS KMS keys (SSE-KMS) that uses the AWS managed key aws/s3."
        fr: "Le chiffrement côté serveur avec des clés AWS KMS (SSE-KMS) qui utilise la clé gérée par AWS aws/s3."
    - id: c
      text:
        en: "Server-side encryption with AWS KMS keys (SSE-KMS) that uses a customer managed key."
        fr: "Le chiffrement côté serveur avec des clés AWS KMS (SSE-KMS) qui utilise une clé gérée par le client."
    - id: d
      text:
        en: "Server-side encryption with customer-provided keys (SSE-C)."
        fr: "Le chiffrement côté serveur avec des clés fournies par le client (SSE-C)."
answer: { optionId: c }
explanation:
  correct:
    en: |
      With a customer managed key, the company exclusively controls the key policy and the key lifecycle, including enabling and disabling the key, and every use is logged in CloudTrail. SSE-KMS with that key encrypts the objects in S3.
    fr: |
      Avec une clé gérée par le client, l'entreprise contrôle exclusivement la politique de clé et le cycle de vie de la clé, y compris son activation et sa désactivation, et chaque utilisation est journalisée dans CloudTrail. SSE-KMS avec cette clé chiffre les objets dans S3.
  options:
    a:
      en: |
        With SSE-S3, Amazon S3 manages the keys; the company has no key policy to control and cannot disable the key.
      fr: |
        Avec SSE-S3, Amazon S3 gère les clés ; l'entreprise n'a aucune politique de clé à contrôler et ne peut pas désactiver la clé.
    b:
      en: |
        The key policy of an AWS managed key is controlled by the service; the company can view it and audit its use but cannot change its policy or disable it.
      fr: |
        La politique de clé d'une clé gérée par AWS est contrôlée par le service ; l'entreprise peut la consulter et en auditer l'utilisation, mais ne peut ni modifier sa politique ni la désactiver.
    d:
      en: |
        With SSE-C, the application supplies the key with every request; there is no KMS key policy and no CloudTrail record of key use, and new general purpose buckets have SSE-C disabled by default since April 2026.
      fr: |
        Avec SSE-C, l'application fournit la clé à chaque requête ; il n'y a ni politique de clé KMS ni trace CloudTrail de l'utilisation de la clé, et SSE-C est désactivé par défaut sur les nouveaux compartiments à usage général depuis avril 2026.
references:
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
  - title: Protecting data with server-side encryption
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html
