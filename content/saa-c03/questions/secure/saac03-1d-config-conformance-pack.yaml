id: saac03-1d-config-conformance-pack
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with 40 member accounts. To prepare for a HIPAA assessment, the company must continuously evaluate the configuration of its resources in every account against a set of rules mapped to HIPAA requirements. Noncompliant resources, such as S3 buckets that accept unencrypted HTTP requests, must be fixed automatically.

    The company wants to deploy and manage the rules and the fixes as a single unit with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations avec 40 comptes membres. Pour préparer une évaluation HIPAA, elle doit évaluer en continu la configuration de ses ressources dans chaque compte par rapport à un ensemble de règles associées aux exigences HIPAA. Les ressources non conformes, comme des compartiments S3 qui acceptent des requêtes HTTP non chiffrées, doivent être corrigées automatiquement.

    L'entreprise souhaite déployer et gérer les règles et les corrections comme un tout, avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an AWS Config conformance pack across the organization with rules and Systems Manager Automation remediation actions.", fr: "Déployer dans toute l'organisation un pack de conformité AWS Config avec des règles et des actions de correction Systems Manager Automation." }
    - id: b
      text: { en: "Create an organization trail in AWS CloudTrail and run scheduled Amazon Athena queries that flag noncompliant API calls.", fr: "Créer un journal de suivi d'organisation dans AWS CloudTrail et exécuter des requêtes Amazon Athena planifiées qui signalent les appels d'API non conformes." }
    - id: c
      text: { en: "Enable Amazon Inspector in every account and send its findings to an Amazon SNS topic for the operations team.", fr: "Activer Amazon Inspector dans chaque compte et envoyer ses résultats vers une rubrique Amazon SNS destinée à l'équipe d'exploitation." }
    - id: d
      text: { en: "Write AWS Lambda functions that inspect each resource daily and correct its configuration through the AWS SDK.", fr: "Écrire des fonctions AWS Lambda qui inspectent chaque ressource chaque jour et corrigent sa configuration via le kit SDK AWS." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A conformance pack is a collection of AWS Config rules and remediation actions deployed as a single entity, and a custom pack can be deployed across an organization. Remediation runs through Systems Manager Automation documents, so noncompliant resources are fixed without custom code.
    fr: |
      Un pack de conformité est un ensemble de règles AWS Config et d'actions de correction déployé comme une seule entité, et un pack personnalisé peut être déployé dans toute une organisation. La correction s'exécute via des documents Systems Manager Automation, sans code personnalisé.
  options:
    b:
      en: |
        CloudTrail records API activity, not the current configuration of resources, and Athena queries only report; nothing is remediated.
      fr: |
        CloudTrail enregistre l'activité des API, pas la configuration actuelle des ressources, et les requêtes Athena ne font que signaler ; rien n'est corrigé.
    c:
      en: |
        Amazon Inspector finds software vulnerabilities and network exposure. It does not evaluate configuration rules mapped to HIPAA or remediate resources.
      fr: |
        Amazon Inspector détecte les vulnérabilités logicielles et l'exposition réseau. Il n'évalue pas de règles de configuration associées à HIPAA et ne corrige pas les ressources.
    d:
      en: |
        Custom Lambda functions could work, but they are code to write and maintain in 40 accounts, and the checks run only once a day instead of continuously.
      fr: |
        Des fonctions Lambda personnalisées pourraient fonctionner, mais c'est du code à écrire et maintenir dans 40 comptes, et les vérifications ne s'exécutent qu'une fois par jour au lieu d'en continu.
references:
  - title: Conformance Packs for AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/conformance-packs.html
  - title: Remediating Noncompliant Resources with AWS Config
    url: https://docs.aws.amazon.com/config/latest/developerguide/remediation.html
