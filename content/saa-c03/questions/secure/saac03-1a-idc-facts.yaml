id: saac03-1a-idc-facts
objective: "1.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans to enable IAM Identity Center for its organization in AWS Organizations. The company has workforce users in Microsoft Entra ID and a few contractors whom it wants to create directly in AWS. A solutions architect is reviewing how IAM Identity Center works before designing the solution.

    Which statements are true? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise prévoit d'activer IAM Identity Center pour son organisation AWS Organizations. Elle a des utilisateurs du personnel dans Microsoft Entra ID et quelques prestataires qu'elle souhaite créer directement dans AWS. Un architecte de solutions étudie le fonctionnement d'IAM Identity Center avant de concevoir la solution.

    Quelles affirmations sont vraies ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The organization can have only one identity source at a time in IAM Identity Center.", fr: "L'organisation ne peut avoir qu'une seule source d'identité à la fois dans IAM Identity Center." } }
    - { id: b, text: { en: "Assigning a permission set to a user creates an IAM user with the same name in each target account.", fr: "Attribuer un ensemble d'autorisations à un utilisateur crée un utilisateur IAM du même nom dans chaque compte cible." } }
    - { id: c, text: { en: "An account instance of IAM Identity Center can assign permission sets in all member accounts of the organization.", fr: "Une instance de compte d'IAM Identity Center peut attribuer des ensembles d'autorisations dans tous les comptes membres de l'organisation." } }
    - { id: d, text: { en: "Assigning a permission set to an account creates IAM roles controlled by IAM Identity Center in that account.", fr: "Attribuer un ensemble d'autorisations à un compte crée dans ce compte des rôles IAM contrôlés par IAM Identity Center." } }
    - { id: e, text: { en: "The AWS account session duration of a permission set cannot be longer than one hour.", fr: "La durée de session de compte AWS d'un ensemble d'autorisations ne peut pas dépasser une heure." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "IAM Identity Center supports one identity source per organization, so the contractors would have to be created in Entra ID, or the company would have to use the Identity Center directory for everyone. When a permission set is assigned, IAM Identity Center provisions matching IAM roles in each target account and keeps them in sync."
    fr: "IAM Identity Center prend en charge une seule source d'identité par organisation : les prestataires devraient être créés dans Entra ID, ou l'entreprise devrait utiliser le répertoire Identity Center pour tout le monde. Lorsqu'un ensemble d'autorisations est attribué, IAM Identity Center crée les rôles IAM correspondants dans chaque compte cible et les maintient synchronisés."
  options:
    b:
      en: "Permission sets are provisioned as IAM roles, not IAM users; users get temporary credentials when they assume the roles."
      fr: "Les ensembles d'autorisations sont provisionnés sous forme de rôles IAM, pas d'utilisateurs IAM ; les utilisateurs obtiennent des informations d'identification temporaires en endossant les rôles."
    c:
      en: "Only an organization instance can manage access to AWS accounts; an account instance is limited to the account where it is enabled."
      fr: "Seule une instance d'organisation peut gérer l'accès aux comptes AWS ; une instance de compte est limitée au compte où elle est activée."
    e:
      en: "The session duration defaults to one hour but can be set up to 12 hours."
      fr: "La durée de session est d'une heure par défaut, mais elle peut être portée jusqu'à 12 heures."
references:
  - title: Manage your identity source
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source.html
  - title: Manage AWS accounts with permission sets
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
