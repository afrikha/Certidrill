id: saac03-1c-sg-reference-db-tier
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a three-tier application in a VPC. An Application Load Balancer sends traffic to application servers in an Auto Scaling group, and the application servers connect to an Amazon RDS for PostgreSQL DB instance on port 5432. Application servers are launched and terminated many times a day, and their private IP addresses change. Other workloads run in the same subnets as the application servers.

    Only the application servers must be able to connect to the database, with the LEAST administrative effort. Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application à trois niveaux dans un VPC. Un Application Load Balancer envoie le trafic à des serveurs d'application d'un groupe Auto Scaling, et ces serveurs se connectent à une instance de base de données Amazon RDS for PostgreSQL sur le port 5432. Les serveurs d'application sont lancés et résiliés de nombreuses fois par jour, et leurs adresses IP privées changent. D'autres charges de travail s'exécutent dans les mêmes sous-réseaux que les serveurs d'application.

    Seuls les serveurs d'application doivent pouvoir se connecter à la base de données, avec le MOINS d'effort d'administration possible. Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add an inbound rule to the network ACL of the database subnets that allows port 5432 from the CIDR blocks of the application subnets."
        fr: "Ajouter à l'ACL réseau des sous-réseaux de base de données une règle entrante qui autorise le port 5432 depuis les blocs CIDR des sous-réseaux d'application."
    - id: b
      text:
        en: "Add an inbound rule to the database security group that allows port 5432 from the security group of the application servers."
        fr: "Ajouter au groupe de sécurité de la base de données une règle entrante qui autorise le port 5432 depuis le groupe de sécurité des serveurs d'application."
    - id: c
      text:
        en: "Run an AWS Lambda function on each scaling event that adds the private IP address of each new server to the database security group."
        fr: "Exécuter une fonction AWS Lambda à chaque événement de mise à l'échelle pour ajouter l'adresse IP privée de chaque nouveau serveur au groupe de sécurité de la base de données."
    - id: d
      text:
        en: "Add an inbound rule to the database security group that allows port 5432 from the CIDR blocks of the application subnets."
        fr: "Ajouter au groupe de sécurité de la base de données une règle entrante qui autorise le port 5432 depuis les blocs CIDR des sous-réseaux d'application."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A security group rule can use another security group as its source. Any network interface associated with the application servers' security group is allowed, whatever its IP address, so new instances are covered automatically and other workloads in the same subnets are not.
    fr: |
      Une règle de groupe de sécurité peut utiliser un autre groupe de sécurité comme source. Toute interface réseau associée au groupe de sécurité des serveurs d'application est autorisée, quelle que soit son adresse IP : les nouvelles instances sont couvertes automatiquement, et les autres charges de travail des mêmes sous-réseaux ne le sont pas.
  options:
    a:
      en: |
        A subnet CIDR rule also admits the other workloads in the application subnets, and stateless network ACLs need matching outbound rules for return traffic.
      fr: |
        Une règle par CIDR de sous-réseau admet aussi les autres charges de travail des sous-réseaux d'application, et les ACL réseau sans état ont besoin de règles sortantes correspondantes pour le trafic de retour.
    c:
      en: |
        Maintaining IP-based rules with custom code works but adds code to write and maintain, and stale rules can remain when instances terminate.
      fr: |
        Maintenir des règles par adresse IP avec du code personnalisé fonctionne, mais ajoute du code à écrire et à maintenir, et des règles obsolètes peuvent subsister quand les instances sont résiliées.
    d:
      en: |
        Allowing the subnet CIDR blocks also allows the other workloads that run in those subnets.
      fr: |
        Autoriser les blocs CIDR des sous-réseaux autorise aussi les autres charges de travail qui s'exécutent dans ces sous-réseaux.
references:
  - title: Control traffic to your AWS resources using security groups
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html
