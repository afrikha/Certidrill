id: saac03-1a-lambda-least-privilege
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company has an AWS Lambda function that writes order records to an Amazon DynamoDB table named Orders. The function only adds new items; it never reads, updates or deletes items. The account contains several other DynamoDB tables. The security team requires the function's permissions to follow the principle of least privilege.

    Which permissions should the function's execution role have?
  fr: |
    Une entreprise d'e-commerce dispose d'une fonction AWS Lambda qui écrit des enregistrements de commandes dans une table Amazon DynamoDB nommée Orders. La fonction ne fait qu'ajouter de nouveaux éléments ; elle ne lit, ne met à jour ni ne supprime jamais d'éléments. Le compte contient plusieurs autres tables DynamoDB. L'équipe de sécurité exige que les autorisations de la fonction respectent le principe du moindre privilège.

    Quelles autorisations le rôle d'exécution de la fonction doit-il avoir ?
body:
  options:
    - id: a
      text: { en: "The AmazonDynamoDBFullAccess AWS managed policy.", fr: "La politique gérée par AWS AmazonDynamoDBFullAccess." }
    - id: b
      text: { en: "Allow dynamodb:PutItem on the ARN of the Orders table.", fr: "Autoriser dynamodb:PutItem sur l'ARN de la table Orders." }
    - id: c
      text: { en: "Allow dynamodb:* on the ARN of the Orders table.", fr: "Autoriser dynamodb:* sur l'ARN de la table Orders." }
    - id: d
      text: { en: "Allow dynamodb:PutItem on all resources (\"*\").", fr: "Autoriser dynamodb:PutItem sur toutes les ressources (« * »)." }
answer: { optionId: b }
explanation:
  correct:
    en: "Least privilege means granting only the actions that the task needs, on the specific resources it uses. The function only creates items, so dynamodb:PutItem scoped to the ARN of the Orders table is sufficient; the role also needs its usual permissions to write logs to CloudWatch Logs."
    fr: "Le moindre privilège consiste à n'accorder que les actions nécessaires à la tâche, sur les ressources précises qu'elle utilise. La fonction ne fait que créer des éléments : dynamodb:PutItem limité à l'ARN de la table Orders suffit ; le rôle a aussi besoin de ses autorisations habituelles pour écrire des journaux dans CloudWatch Logs."
  options:
    a:
      en: "The full-access managed policy grants every DynamoDB action on every table, far more than the function needs."
      fr: "La politique gérée d'accès complet accorde toutes les actions DynamoDB sur toutes les tables, bien plus que nécessaire."
    c:
      en: "Scoping to the table is correct, but dynamodb:* also allows reads, updates, deletes and table deletion, which the function never performs."
      fr: "Limiter à la table est correct, mais dynamodb:* autorise aussi les lectures, mises à jour, suppressions et la suppression de la table, que la fonction n'effectue jamais."
    d:
      en: "The action is correct, but a wildcard resource lets the function write to every other table in the account."
      fr: "L'action est correcte, mais une ressource générique permet à la fonction d'écrire dans toutes les autres tables du compte."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
