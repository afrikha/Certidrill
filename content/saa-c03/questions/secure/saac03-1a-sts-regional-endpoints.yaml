id: saac03-1a-sts-regional-endpoints
objective: "1.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs applications in the US East (N. Virginia) and Asia Pacific (Hong Kong) Regions. The Hong Kong Region is enabled for the account. The applications call the global AWS STS endpoint, sts.amazonaws.com, to assume roles, and the credentials that they receive are rejected in Hong Kong. The company also wants to reduce STS latency for the Hong Kong application and remove its dependency on a single Region for credential issuance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des applications dans les Régions US East (N. Virginia) et Asia Pacific (Hong Kong). La Région Hong Kong est activée pour le compte. Les applications appellent le point de terminaison global d'AWS STS, sts.amazonaws.com, pour endosser des rôles, et les informations d'identification obtenues sont rejetées à Hong Kong. L'entreprise veut aussi réduire la latence STS de l'application de Hong Kong et supprimer sa dépendance à une seule Région pour l'émission des informations d'identification.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the session token version of the global endpoint to version 2 tokens, which are valid in all Regions.", fr: "Passer la version des jetons de session du point de terminaison global aux jetons de version 2, valides dans toutes les Régions." }
    - id: b
      text: { en: "Disable and re-enable the Hong Kong Region for the account so that STS issues new tokens.", fr: "Désactiver puis réactiver la Région Hong Kong pour le compte afin que STS émette de nouveaux jetons." }
    - id: c
      text: { en: "Configure each application to call the AWS STS Regional endpoint of the Region where it runs.", fr: "Configurer chaque application pour qu'elle appelle le point de terminaison Régional AWS STS de la Région où elle s'exécute." }
    - id: d
      text: { en: "Replace the roles with IAM users in the Hong Kong Region and give the application long-term access keys.", fr: "Remplacer les rôles par des utilisateurs IAM dans la Région Hong Kong et donner à l'application des clés d'accès à long terme." }
answer: { optionId: c }
explanation:
  correct:
    en: "Session tokens from STS Regional endpoints are valid in all Regions, while tokens from the global endpoint are valid only in Regions enabled by default unless the token version is changed. The global endpoint is hosted in US East (N. Virginia); calling the local Regional endpoint lowers latency and aligns credential issuance with the Region of each application."
    fr: "Les jetons de session émis par les points de terminaison Régionaux STS sont valides dans toutes les Régions, alors que ceux du point de terminaison global ne sont valides que dans les Régions activées par défaut, sauf changement de version de jeton. Le point de terminaison global est hébergé dans US East (N. Virginia) ; appeler le point de terminaison Régional local réduit la latence et aligne l'émission des informations d'identification sur la Région de chaque application."
  options:
    a:
      en: "Version 2 tokens fix the validity problem, but the Hong Kong application still calls an endpoint in N. Virginia, so latency and the single-Region dependency remain."
      fr: "Les jetons de version 2 corrigent le problème de validité, mais l'application de Hong Kong appelle toujours un point de terminaison en Virginie du Nord : la latence et la dépendance à une seule Région demeurent."
    b:
      en: "Re-enabling the Region does not change the scope of tokens issued by the global endpoint, and disabling an opt-in Region in use is disruptive."
      fr: "Réactiver la Région ne change pas la portée des jetons émis par le point de terminaison global, et désactiver une Région à adhésion en cours d'utilisation perturbe le service."
    d:
      en: "IAM users with long-term access keys go against AWS best practices for workloads, which should use temporary credentials from roles."
      fr: "Des utilisateurs IAM avec des clés d'accès à long terme vont à l'encontre des bonnes pratiques AWS pour les charges de travail, qui doivent utiliser les informations d'identification temporaires des rôles."
references:
  - title: Manage AWS STS in an AWS Region
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_temp_enable-regions.html
