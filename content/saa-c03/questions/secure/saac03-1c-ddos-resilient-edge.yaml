id: saac03-1c-ddos-resilient-edge
objective: "1.2.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A travel company hosts its booking website on Amazon EC2 instances in an Auto Scaling group behind an internet-facing Application Load Balancer (ALB) in one AWS Region. The website has been the target of DDoS attacks at both the network layer and the HTTP layer. The company wants to absorb volumetric attacks as far as possible from the origin and to block abusive HTTP request rates.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise de voyages héberge son site de réservation sur des instances Amazon EC2 d'un groupe Auto Scaling derrière un Application Load Balancer (ALB) accessible depuis Internet, dans une Région AWS. Le site a subi des attaques DDoS sur la couche réseau et sur la couche HTTP. L'entreprise veut absorber les attaques volumétriques le plus loin possible de l'origine et bloquer les débits de requêtes HTTP abusifs.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Serve the website through an Amazon CloudFront distribution that uses the ALB as its origin."
        fr: "Servir le site au moyen d'une distribution Amazon CloudFront qui utilise l'ALB comme origine."
    - id: b
      text:
        en: "Associate an AWS WAF web ACL that contains rate-based rules with the CloudFront distribution."
        fr: "Associer à la distribution CloudFront une liste ACL web AWS WAF qui contient des règles basées sur le débit."
    - id: c
      text:
        en: "Move the instances to public subnets and assign an Elastic IP address to each instance to spread the traffic."
        fr: "Déplacer les instances dans des sous-réseaux publics et attribuer une adresse IP Elastic à chaque instance pour répartir le trafic."
    - id: d
      text:
        en: "Replace the ALB with a Network Load Balancer and associate an AWS WAF web ACL with the Network Load Balancer."
        fr: "Remplacer l'ALB par un Network Load Balancer et associer une liste ACL web AWS WAF au Network Load Balancer."
    - id: e
      text:
        en: "Enable Amazon Inspector on the instances so that it blocks the IP addresses that send attack traffic."
        fr: "Activer Amazon Inspector sur les instances pour qu'il bloque les adresses IP qui envoient le trafic d'attaque."
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      CloudFront serves traffic from edge locations, where Shield Standard gives its most complete protection against network and transport layer attacks, so volumetric floods are absorbed far from the ALB. An AWS WAF web ACL with rate-based rules on the distribution blocks clients that exceed a request rate, which addresses HTTP floods.
    fr: |
      CloudFront sert le trafic depuis des emplacements périphériques, où Shield Standard offre sa protection la plus complète contre les attaques des couches réseau et transport : les inondations volumétriques sont absorbées loin de l'ALB. Une liste ACL web AWS WAF avec des règles basées sur le débit sur la distribution bloque les clients qui dépassent un débit de requêtes, ce qui traite les inondations HTTP.
  options:
    c:
      en: |
        Exposing every instance directly increases the attack surface and removes the protection of the load balancer and the edge.
      fr: |
        Exposer chaque instance directement augmente la surface d'attaque et supprime la protection de l'équilibreur de charge et de la périphérie.
    d:
      en: |
        AWS WAF cannot be associated with a Network Load Balancer; it supports CloudFront, ALB, API Gateway REST APIs and a few other layer 7 resources.
      fr: |
        AWS WAF ne peut pas être associé à un Network Load Balancer ; il prend en charge CloudFront, l'ALB, les API REST API Gateway et quelques autres ressources de couche 7.
    e:
      en: |
        Amazon Inspector scans workloads for software vulnerabilities and unintended network exposure; it does not block traffic.
      fr: |
        Amazon Inspector analyse les charges de travail pour y détecter des vulnérabilités logicielles et une exposition réseau involontaire ; il ne bloque pas le trafic.
references:
  - title: AWS Shield Standard overview
    url: https://docs.aws.amazon.com/waf/latest/developerguide/ddos-standard-summary.html
  - title: Resources that you can protect with AWS WAF
    url: https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html
