id: saac03-1b-ec2-instance-profile
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A web application on Amazon EC2 instances reads and writes objects in an S3 bucket. A developer stored the access key ID and secret access key of an IAM user in the application's configuration file. The security team wants to remove all long-term credentials from the instances without changing how the AWS SDK is called in the code.

    Which solution will meet these requirements?
  fr: |
    Une application web sur des instances Amazon EC2 lit et écrit des objets dans un compartiment S3. Un développeur a stocké l'ID de clé d'accès et la clé d'accès secrète d'un utilisateur IAM dans le fichier de configuration de l'application. L'équipe de sécurité veut supprimer toutes les informations d'identification à long terme des instances sans changer la façon dont le kit SDK AWS est appelé dans le code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM role with the required S3 permissions and attach it to the instances through an instance profile.", fr: "Créer un rôle IAM doté des autorisations S3 requises et l'attacher aux instances par un profil d'instance." }
    - id: b
      text: { en: "Move the access keys from the configuration file to environment variables set in the instance user data.", fr: "Déplacer les clés d'accès du fichier de configuration vers des variables d'environnement définies dans les données utilisateur de l'instance." }
    - id: c
      text: { en: "Encrypt the configuration file with AWS KMS and rotate the IAM user's access keys every 90 days.", fr: "Chiffrer le fichier de configuration avec AWS KMS et renouveler les clés d'accès de l'utilisateur IAM tous les 90 jours." }
    - id: d
      text: { en: "Store the access keys in a private S3 bucket that only the instances can read at startup.", fr: "Stocker les clés d'accès dans un compartiment S3 privé que seules les instances peuvent lire au démarrage." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An IAM role attached through an instance profile gives the instances temporary credentials that are delivered by the instance metadata service and rotated automatically. The AWS SDK finds these credentials through its default credential provider chain, so no code change is required.
    fr: |
      Un rôle IAM attaché par un profil d'instance fournit aux instances des informations d'identification temporaires, délivrées par le service de métadonnées d'instance et renouvelées automatiquement. Le kit SDK AWS les trouve par sa chaîne de fournisseurs d'informations d'identification par défaut : aucune modification du code n'est nécessaire.
  options:
    b:
      en: |
        Environment variables still hold the same long-term keys, and user data can be read from the instance.
      fr: |
        Les variables d'environnement contiennent toujours les mêmes clés à long terme, et les données utilisateur sont lisibles depuis l'instance.
    c:
      en: |
        Encryption and rotation reduce the risk but keep long-term credentials on the instances.
      fr: |
        Le chiffrement et la rotation réduisent le risque, mais conservent des informations d'identification à long terme sur les instances.
    d:
      en: |
        The keys are still long-term credentials, and the instances would need another credential to read that bucket.
      fr: |
        Les clés restent des informations d'identification à long terme, et les instances auraient besoin d'une autre information d'identification pour lire ce compartiment.
references:
  - title: Use an IAM role to grant permissions to applications running on Amazon EC2 instances
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html
