id: saac03-1a-saml-trust-condition
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A university federates its SAML 2.0 identity provider with a single AWS account by using an IAM SAML identity provider. Staff and students both authenticate through the identity provider, which sends an affiliation attribute in the SAML assertion. Only users whose affiliation is staff must be able to assume the IAM role that administers the research Amazon EC2 instances.

    Which solution will meet these requirements?
  fr: |
    Une université fédère son fournisseur d'identité SAML 2.0 avec un seul compte AWS à l'aide d'un fournisseur d'identité SAML IAM. Le personnel et les étudiants s'authentifient tous via le fournisseur d'identité, qui envoie un attribut d'affiliation dans l'assertion SAML. Seuls les utilisateurs dont l'affiliation est « staff » doivent pouvoir endosser le rôle IAM qui administre les instances Amazon EC2 de recherche.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a condition on the SAML affiliation attribute to the permissions policy of the role.", fr: "Ajouter une condition sur l'attribut d'affiliation SAML dans la politique d'autorisations du rôle." }
    - id: b
      text: { en: "Add a condition on the SAML affiliation attribute to the trust policy of the role.", fr: "Ajouter une condition sur l'attribut d'affiliation SAML dans la politique d'approbation du rôle." }
    - id: c
      text: { en: "Attach a permissions boundary to the role that allows EC2 actions only for staff users.", fr: "Attacher au rôle une limite d'autorisations (permissions boundary) qui n'autorise les actions EC2 que pour les utilisateurs du personnel." }
    - id: d
      text: { en: "Create an IAM user group named staff and add the role to the group.", fr: "Créer un groupe d'utilisateurs IAM nommé staff et y ajouter le rôle." }
answer: { optionId: b }
explanation:
  correct:
    en: "The trust policy of a role decides who can assume it. For SAML federation, the trust policy names the SAML provider as principal for sts:AssumeRoleWithSAML and can add conditions on SAML attributes, so only assertions with the staff affiliation are accepted."
    fr: "La politique d'approbation d'un rôle décide qui peut l'endosser. Pour la fédération SAML, elle désigne le fournisseur SAML comme principal pour sts:AssumeRoleWithSAML et peut ajouter des conditions sur les attributs SAML : seules les assertions portant l'affiliation « staff » sont acceptées."
  options:
    a:
      en: "The permissions policy defines what the role can do after it is assumed; it does not control who can assume the role."
      fr: "La politique d'autorisations définit ce que le rôle peut faire une fois endossé ; elle ne contrôle pas qui peut l'endosser."
    c:
      en: "A permissions boundary only caps the permissions of the role; it does not distinguish which federated users can assume it."
      fr: "Une limite d'autorisations ne fait que plafonner les autorisations du rôle ; elle ne distingue pas les utilisateurs fédérés qui peuvent l'endosser."
    d:
      en: "IAM user groups contain only IAM users; a role cannot be a member of a group, and federated users are not IAM users."
      fr: "Les groupes d'utilisateurs IAM ne contiennent que des utilisateurs IAM ; un rôle ne peut pas être membre d'un groupe, et les utilisateurs fédérés ne sont pas des utilisateurs IAM."
references:
  - title: SAML 2.0 federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html
