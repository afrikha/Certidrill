id: saac03-1a-external-access-analyzer
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 15 AWS accounts in an organization in AWS Organizations. The security team must continuously identify Amazon S3 buckets, IAM roles, AWS KMS keys and Amazon SQS queues that grant access to principals outside the organization.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 15 comptes AWS dans une organisation AWS Organizations. L'équipe de sécurité doit identifier en continu les compartiments (buckets) Amazon S3, les rôles IAM, les clés AWS KMS et les files d'attente Amazon SQS qui accordent l'accès à des principaux extérieurs à l'organisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM Access Analyzer external access analyzer with the organization as the zone of trust.", fr: "Créer un analyseur d'accès externe IAM Access Analyzer avec l'organisation comme zone de confiance." }
    - id: b
      text: { en: "Enable Amazon Macie in all accounts and review its findings for the S3 buckets.", fr: "Activer Amazon Macie dans tous les comptes et examiner ses résultats pour les compartiments S3." }
    - id: c
      text: { en: "Enable Amazon GuardDuty in all accounts and review the findings about unusual API calls.", fr: "Activer Amazon GuardDuty dans tous les comptes et examiner les résultats sur les appels d'API inhabituels." }
    - id: d
      text: { en: "Enable Amazon Inspector in all accounts and review the findings for the listed resources.", fr: "Activer Amazon Inspector dans tous les comptes et examiner les résultats pour les ressources listées." }
answer: { optionId: a }
explanation:
  correct:
    en: "An external access analyzer finds resources such as S3 buckets, IAM roles, KMS keys and SQS queues whose policies grant access to principals outside the zone of trust. With the organization as the zone of trust, access between member accounts is trusted and only access from outside generates findings. Analyzers are Regional, so one is needed in each Region in use."
    fr: "Un analyseur d'accès externe trouve les ressources comme les compartiments S3, rôles IAM, clés KMS et files SQS dont les politiques accordent l'accès à des principaux hors de la zone de confiance. Avec l'organisation comme zone de confiance, l'accès entre comptes membres est approuvé et seul l'accès depuis l'extérieur génère des résultats. Les analyseurs sont Régionaux : il en faut un dans chaque Région utilisée."
  options:
    b:
      en: "Macie discovers sensitive data in S3; it does not analyze the policies of IAM roles, KMS keys or SQS queues for external access."
      fr: "Macie découvre des données sensibles dans S3 ; il n'analyse pas les politiques des rôles IAM, des clés KMS ou des files SQS pour détecter un accès externe."
    c:
      en: "GuardDuty detects threats from activity such as suspicious API calls; it does not report which resource policies grant external access."
      fr: "GuardDuty détecte des menaces à partir de l'activité, comme des appels d'API suspects ; il ne signale pas quelles politiques de ressources accordent un accès externe."
    d:
      en: "Inspector scans workloads such as EC2 instances, container images and Lambda functions for vulnerabilities, not resource policies."
      fr: "Inspector analyse les vulnérabilités de charges de travail comme les instances EC2, les images de conteneur et les fonctions Lambda, pas les politiques de ressources."
references:
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
