id: saac03-1b-rcp-data-perimeter
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has 200 member accounts in AWS Organizations. Developers in the member accounts write their own S3 bucket policies. The security team must ensure that no principal outside the organization can access any S3 bucket in the member accounts, even when a bucket policy grants that access to a specific external account. The control must be enforced centrally and must not require changes to existing bucket policies.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 200 comptes membres dans AWS Organizations. Les développeurs des comptes membres rédigent eux-mêmes leurs politiques de compartiment S3. L'équipe de sécurité doit garantir qu'aucun principal extérieur à l'organisation ne puisse accéder à un compartiment S3 des comptes membres, même lorsqu'une politique de compartiment accorde cet accès à un compte externe précis. Le contrôle doit être appliqué de manière centralisée et ne doit pas exiger de modifier les politiques de compartiment existantes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an SCP to the root that denies S3 actions when aws:PrincipalOrgID does not equal the organization ID.", fr: "Attacher à la racine une SCP qui refuse les actions S3 lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation." }
    - id: b
      text: { en: "Enable S3 Block Public Access at the account level in every member account of the organization.", fr: "Activer S3 Block Public Access au niveau du compte dans chaque compte membre de l'organisation." }
    - id: c
      text: { en: "Attach an RCP to the root that denies S3 actions when aws:PrincipalOrgID does not equal the organization ID.", fr: "Attacher à la racine une RCP qui refuse les actions S3 lorsque aws:PrincipalOrgID n'est pas égal à l'ID de l'organisation." }
    - id: d
      text: { en: "Enable IAM Access Analyzer in each account to report buckets that are shared with external entities.", fr: "Activer IAM Access Analyzer dans chaque compte pour signaler les compartiments partagés avec des entités externes." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A resource control policy (RCP) sets the maximum permissions on resources in member accounts, and it applies to requests from principals inside and outside the organization. A Deny on S3 actions for callers whose aws:PrincipalOrgID is not the organization ID blocks external access even if a bucket policy allows it (in practice, add exceptions for AWS service principals that must reach the buckets).
    fr: |
      Une politique de contrôle des ressources (RCP) fixe les autorisations maximales sur les ressources des comptes membres, et elle s'applique aux requêtes des principaux internes comme externes à l'organisation. Un Deny sur les actions S3 pour les appelants dont aws:PrincipalOrgID n'est pas l'ID de l'organisation bloque l'accès externe même si une politique de compartiment l'autorise (en pratique, on ajoute des exceptions pour les principaux de service AWS qui doivent accéder aux compartiments).
  options:
    a:
      en: |
        SCPs apply only to principals managed by accounts in the organization; they do not limit what a bucket policy grants to an external account.
      fr: |
        Les SCP s'appliquent uniquement aux principaux gérés par les comptes de l'organisation ; elles ne limitent pas ce qu'une politique de compartiment accorde à un compte externe.
    b:
      en: |
        Block Public Access blocks public policies and ACLs, but a policy that grants access to one specific external account is not public, so it stays effective.
      fr: |
        Block Public Access bloque les politiques et ACL publiques, mais une politique qui accorde l'accès à un compte externe précis n'est pas publique : elle reste effective.
    d:
      en: |
        IAM Access Analyzer reports external sharing but does not prevent it.
      fr: |
        IAM Access Analyzer signale le partage externe mais ne l'empêche pas.
references:
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
