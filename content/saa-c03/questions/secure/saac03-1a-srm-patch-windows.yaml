id: saac03-1a-srm-patch-windows
objective: "1.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses Amazon RDS for MySQL and Amazon DynamoDB for an order processing application. A new internal policy states that database patching must not occur during business hours, from 08:00 to 20:00 local time. The company wants to meet this policy with the LEAST operational effort while keeping the databases patched.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise Amazon RDS for MySQL et Amazon DynamoDB pour une application de traitement des commandes. Une nouvelle politique interne stipule que l'application de correctifs aux bases de données ne doit pas avoir lieu pendant les heures ouvrées, de 08:00 à 20:00 heure locale. L'entreprise veut respecter cette politique avec le MOINS d'effort opérationnel tout en gardant les bases de données à jour.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the RDS maintenance window outside business hours, apply mandatory updates early, and take no patching action for DynamoDB.", fr: "Définir la fenêtre de maintenance RDS hors heures ouvrées, appliquer tôt les mises à jour obligatoires, et ne rien faire pour les correctifs de DynamoDB." }
    - id: b
      text: { en: "Set a preferred maintenance window outside business hours for both the RDS DB instance and each DynamoDB table.", fr: "Définir une fenêtre de maintenance préférée hors heures ouvrées pour l'instance de base de données RDS et pour chaque table DynamoDB." }
    - id: c
      text: { en: "Turn off automatic minor version upgrades on the RDS DB instance so that AWS never applies any patch without approval.", fr: "Désactiver les mises à niveau automatiques de version mineure sur l'instance RDS pour qu'AWS n'applique jamais aucun correctif sans approbation." }
    - id: d
      text: { en: "Convert the RDS DB instance to a Multi-AZ deployment so that patches cause no downtime at any time of day.", fr: "Convertir l'instance de base de données RDS en déploiement Multi-AZ pour que les correctifs ne provoquent aucune interruption, quelle que soit l'heure." }
answer: { optionId: a }
explanation:
  correct:
    en: "Patching is a shared control. For a single-tenant managed service such as RDS, the customer chooses the maintenance window; mandatory updates can be applied outside it after their apply date, so the company should apply them earlier. For a multi-tenant service such as DynamoDB, AWS applies patches with no customer action."
    fr: "L'application de correctifs est un contrôle partagé. Pour un service géré à locataire unique comme RDS, le client choisit la fenêtre de maintenance ; les mises à jour obligatoires peuvent être appliquées hors de cette fenêtre après leur date d'application : l'entreprise doit donc les appliquer avant. Pour un service multilocataire comme DynamoDB, AWS applique les correctifs sans action du client."
  options:
    b:
      en: "DynamoDB has no maintenance window to configure; AWS patches it without customer action."
      fr: "DynamoDB n'a pas de fenêtre de maintenance à configurer ; AWS le corrige sans action du client."
    c:
      en: "Turning off automatic minor version upgrades does not stop mandatory operating system and security updates, and it leaves the engine unpatched."
      fr: "Désactiver les mises à niveau automatiques de version mineure n'arrête pas les mises à jour obligatoires du système et de sécurité, et laisse le moteur sans correctifs."
    d:
      en: "Multi-AZ reduces the impact of OS patching but still needs a short failover, and engine upgrades affect both instances; it does not control when patching happens."
      fr: "Multi-AZ réduit l'impact des correctifs du système mais nécessite toujours un court basculement, et les mises à niveau du moteur touchent les deux instances ; il ne contrôle pas le moment des correctifs."
references:
  - title: Maintaining a DB instance
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
