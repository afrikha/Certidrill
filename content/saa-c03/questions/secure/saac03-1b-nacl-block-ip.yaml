id: saac03-1b-nacl-block-ip
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's web application runs on Amazon EC2 instances in a public subnet, without a load balancer. Logs show repeated malicious requests from a single public IP address. The security team must block all traffic from that IP address to the subnet immediately, and all other internet clients must keep their access.

    Which solution will meet these requirements?
  fr: |
    L'application web d'une entreprise s'exécute sur des instances Amazon EC2 d'un sous-réseau public, sans équilibreur de charge. Les journaux montrent des requêtes malveillantes répétées provenant d'une seule adresse IP publique. L'équipe de sécurité doit bloquer immédiatement tout le trafic de cette adresse IP vers le sous-réseau, et tous les autres clients Internet doivent conserver leur accès.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an inbound deny rule for the IP address to the subnet's network ACL, numbered lower than the allow rules.", fr: "Ajouter à l'ACL réseau du sous-réseau une règle entrante de refus pour l'adresse IP, avec un numéro inférieur à ceux des règles d'autorisation." }
    - id: b
      text: { en: "Add an inbound deny rule for the IP address to the security group that is attached to the instances.", fr: "Ajouter au groupe de sécurité attaché aux instances une règle entrante de refus pour l'adresse IP." }
    - id: c
      text: { en: "Remove the inbound rule that allows HTTPS from 0.0.0.0/0 from the security group of the instances.", fr: "Supprimer du groupe de sécurité des instances la règle entrante qui autorise HTTPS depuis 0.0.0.0/0." }
    - id: d
      text: { en: "Enable Amazon GuardDuty in the account so that it blocks the malicious IP address automatically.", fr: "Activer Amazon GuardDuty dans le compte afin qu'il bloque automatiquement l'adresse IP malveillante." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Network ACLs support both allow and deny rules, evaluated in order from the lowest rule number; the first match applies. A deny rule for the address with a lower number than the broad allow rule blocks only that source at the subnet boundary.
    fr: |
      Les ACL réseau prennent en charge des règles d'autorisation et de refus, évaluées dans l'ordre à partir du plus petit numéro ; la première règle correspondante s'applique. Une règle de refus pour l'adresse, avec un numéro inférieur à la règle d'autorisation générale, bloque uniquement cette source à la limite du sous-réseau.
  options:
    b:
      en: |
        Security groups support allow rules only; they cannot deny a specific source.
      fr: |
        Les groupes de sécurité n'acceptent que des règles d'autorisation ; ils ne peuvent pas refuser une source précise.
    c:
      en: |
        Removing the rule blocks every internet client, not just the malicious address.
      fr: |
        Supprimer la règle bloque tous les clients Internet, et pas seulement l'adresse malveillante.
    d:
      en: |
        GuardDuty detects threats and creates findings; it does not block traffic by itself.
      fr: |
        GuardDuty détecte les menaces et crée des résultats ; il ne bloque pas le trafic par lui-même.
references:
  - title: Control subnet traffic with network access control lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
