id: saac03-1b-bucket-policy-sourcevpce
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores confidential files in an S3 bucket. Applications in one VPC access the bucket through a gateway endpoint with the ID vpce-1a2b3c4d. A new requirement states that the bucket must reject every request that does not arrive through this endpoint, even from IAM principals that have S3 permissions.

    Which solution will meet this requirement?
  fr: |
    Une entreprise stocke des fichiers confidentiels dans un compartiment S3. Des applications d'un VPC accèdent au compartiment par un point de terminaison de passerelle dont l'ID est vpce-1a2b3c4d. Une nouvelle exigence impose que le compartiment rejette toute requête qui n'arrive pas par ce point de terminaison, même provenant de principaux IAM disposant d'autorisations S3.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Attach an endpoint policy to vpce-1a2b3c4d that allows S3 actions only on this bucket.", fr: "Attacher à vpce-1a2b3c4d une politique de point de terminaison qui autorise les actions S3 uniquement sur ce compartiment." }
    - id: b
      text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SourceVpce is not vpce-1a2b3c4d.", fr: "Ajouter une instruction de politique de compartiment qui refuse toutes les actions S3 lorsque aws:SourceVpce n'est pas vpce-1a2b3c4d." }
    - id: c
      text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SourceIp is not in the VPC CIDR range.", fr: "Ajouter une instruction de politique de compartiment qui refuse toutes les actions S3 lorsque aws:SourceIp n'appartient pas à la plage CIDR du VPC." }
    - id: d
      text: { en: "Enable S3 Block Public Access on the bucket and at the account level.", fr: "Activer S3 Block Public Access sur le compartiment et au niveau du compte." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The aws:SourceVpce condition key contains the ID of the VPC endpoint that a request came through. A Deny for every request whose aws:SourceVpce differs from vpce-1a2b3c4d rejects all other paths, whatever IAM allows. Such a policy also blocks access from the S3 console, because console requests do not come through the endpoint.
    fr: |
      La clé de condition aws:SourceVpce contient l'ID du point de terminaison de VPC par lequel la requête est arrivée. Un Deny pour toute requête dont aws:SourceVpce diffère de vpce-1a2b3c4d rejette tous les autres chemins, quoi que IAM autorise. Une telle politique bloque aussi l'accès depuis la console S3, car les requêtes de la console ne passent pas par le point de terminaison.
  options:
    a:
      en: |
        The endpoint policy limits what can be reached through the endpoint, but requests that do not use the endpoint are not affected.
      fr: |
        La politique de point de terminaison limite ce qui est accessible par le point de terminaison, mais les requêtes qui ne l'utilisent pas ne sont pas concernées.
    c:
      en: |
        Requests through a VPC endpoint carry private source addresses, which aws:SourceIp does not match; use aws:SourceVpce or aws:SourceVpc instead.
      fr: |
        Les requêtes passant par un point de terminaison de VPC portent des adresses sources privées, que aws:SourceIp ne prend pas en compte ; il faut utiliser aws:SourceVpce ou aws:SourceVpc.
    d:
      en: |
        Block Public Access stops public access but still allows authorized principals from anywhere.
      fr: |
        Block Public Access empêche l'accès public mais autorise toujours les principaux autorisés depuis n'importe où.
references:
  - title: Controlling access from VPC endpoints with bucket policies
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
