id: saac03-1a-cognito-per-user-prefix
objective: "1.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has a single-page web application whose users sign in with an Amazon Cognito user pool. Users must upload and download their own documents directly from the browser to an Amazon S3 bucket. Each user must be able to access only the objects under a prefix that belongs to that user. The company does not want to deploy or maintain any backend code for file transfers, and the number of users is expected to grow to hundreds of thousands.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une application web monopage dont les utilisateurs se connectent avec un groupe d'utilisateurs (user pool) Amazon Cognito. Les utilisateurs doivent charger et télécharger leurs propres documents directement depuis le navigateur dans un compartiment (bucket) Amazon S3. Chaque utilisateur ne doit pouvoir accéder qu'aux objets situés sous un préfixe qui lui appartient. L'entreprise ne veut déployer ni maintenir aucun code backend pour les transferts de fichiers, et le nombre d'utilisateurs devrait atteindre plusieurs centaines de milliers.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one IAM role per user with a policy for that user's prefix, and map each user to the role in the user pool.", fr: "Créer un rôle IAM par utilisateur avec une politique pour le préfixe de cet utilisateur, et associer chaque utilisateur à son rôle dans le groupe d'utilisateurs." }
    - id: b
      text: { en: "Deploy an AWS Lambda function behind Amazon API Gateway that returns a presigned URL for the user's prefix on each request.", fr: "Déployer une fonction AWS Lambda derrière Amazon API Gateway qui renvoie à chaque requête une URL présignée pour le préfixe de l'utilisateur." }
    - id: c
      text: { en: "Configure the user pool as the identity source of IAM Identity Center and assign each user a permission set for the bucket.", fr: "Configurer le groupe d'utilisateurs comme source d'identité d'IAM Identity Center et attribuer à chaque utilisateur un ensemble d'autorisations pour le compartiment." }
    - id: d
      text: { en: "Add the user pool to an identity pool whose role allows S3 access to a prefix named with ${cognito-identity.amazonaws.com:sub}.", fr: "Ajouter le groupe d'utilisateurs à un groupe d'identités dont le rôle autorise l'accès S3 à un préfixe nommé avec ${cognito-identity.amazonaws.com:sub}." }
answer: { optionId: d }
explanation:
  correct:
    en: "The identity pool exchanges the user pool token for temporary credentials of one authenticated IAM role. The role policy uses the ${cognito-identity.amazonaws.com:sub} variable, the identity ID of each user in the identity pool, in the object path, so a single policy confines every user to their own prefix with no backend code."
    fr: "Le groupe d'identités échange le jeton du groupe d'utilisateurs contre des informations d'identification temporaires d'un seul rôle IAM authentifié. La politique du rôle utilise la variable ${cognito-identity.amazonaws.com:sub}, l'ID d'identité de chaque utilisateur dans le groupe d'identités, dans le chemin des objets : une seule politique cantonne chaque utilisateur à son préfixe, sans code backend."
  options:
    a:
      en: "One role per user cannot scale to hundreds of thousands of users because of IAM role quotas, and a user pool alone does not issue AWS credentials."
      fr: "Un rôle par utilisateur ne peut pas passer à des centaines de milliers d'utilisateurs en raison des quotas de rôles IAM, et un groupe d'utilisateurs seul ne délivre pas d'informations d'identification AWS."
    b:
      en: "Presigned URLs work, but the Lambda function and API are backend code to deploy and maintain, which the company wants to avoid."
      fr: "Les URL présignées fonctionnent, mais la fonction Lambda et l'API sont du code backend à déployer et maintenir, ce que l'entreprise veut éviter."
    c:
      en: "IAM Identity Center is for workforce access to AWS accounts and applications; a Cognito user pool is not one of its identity sources."
      fr: "IAM Identity Center sert à l'accès du personnel aux comptes et applications AWS ; un groupe d'utilisateurs Cognito ne fait pas partie de ses sources d'identité."
references:
  - title: "Amazon S3: Allows Amazon Cognito users to access objects in their bucket"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_examples_s3_cognito-bucket.html
  - title: Amazon Cognito identity pools
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-identity.html
