id: saac03-1a-kms-cross-account-read
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores reports in an Amazon S3 bucket in a data account. The objects are encrypted with SSE-KMS by using a customer managed key in the data account. An analytics IAM role in a separate analytics account has an identity-based policy that allows s3:GetObject on the bucket, and the bucket policy allows the role to read the objects. Requests from the role fail with an access denied error. The data must stay encrypted with the same customer managed key.

    Which solution will resolve the issue?
  fr: |
    Une entreprise stocke des rapports dans un compartiment (bucket) Amazon S3 d'un compte de données. Les objets sont chiffrés avec SSE-KMS à l'aide d'une clé gérée par le client du compte de données. Un rôle IAM d'analyse, dans un compte d'analyse distinct, possède une politique basée sur l'identité qui autorise s3:GetObject sur le compartiment, et la politique de compartiment autorise le rôle à lire les objets. Les requêtes du rôle échouent avec une erreur d'accès refusé. Les données doivent rester chiffrées avec la même clé gérée par le client.

    Quelle solution résout le problème ?
body:
  options:
    - id: a
      text: { en: "Add a statement that allows kms:Decrypt by the analytics role to the bucket policy in the data account.", fr: "Ajouter à la politique de compartiment du compte de données une instruction qui autorise kms:Decrypt pour le rôle d'analyse." }
    - id: b
      text: { en: "Add kms:Decrypt on the key to the identity-based policy of the analytics role, and change nothing else.", fr: "Ajouter kms:Decrypt sur la clé à la politique basée sur l'identité du rôle d'analyse, sans rien changer d'autre." }
    - id: c
      text: { en: "Allow the role in the key policy, and add kms:Decrypt on the key to the role's identity-based policy.", fr: "Autoriser le rôle dans la politique de clé, et ajouter kms:Decrypt sur la clé à la politique basée sur l'identité du rôle." }
    - id: d
      text: { en: "Allow the role in the key policy, and remove the identity-based policy from the analytics role.", fr: "Autoriser le rôle dans la politique de clé, et retirer la politique basée sur l'identité du rôle d'analyse." }
answer: { optionId: c }
explanation:
  correct:
    en: "Reading an SSE-KMS object requires kms:Decrypt on the key in addition to s3:GetObject. Cross-account use of a KMS key needs two allows: the key policy in the key-owning account must allow the external role, and the role's IAM policy in its own account must allow the KMS actions on that key."
    fr: "Lire un objet chiffré avec SSE-KMS exige kms:Decrypt sur la clé en plus de s3:GetObject. L'utilisation intercompte d'une clé KMS nécessite deux autorisations : la politique de clé du compte propriétaire doit autoriser le rôle externe, et la politique IAM du rôle, dans son propre compte, doit autoriser les actions KMS sur cette clé."
  options:
    a:
      en: "A bucket policy controls access to S3 actions on the bucket; it cannot grant permissions on a KMS key, which are governed by the key policy."
      fr: "Une politique de compartiment contrôle l'accès aux actions S3 sur le compartiment ; elle ne peut pas accorder d'autorisations sur une clé KMS, régies par la politique de clé."
    b:
      en: "The identity-based policy alone is not enough across accounts: the key policy in the data account must also allow the role."
      fr: "La politique basée sur l'identité ne suffit pas seule entre comptes : la politique de clé du compte de données doit aussi autoriser le rôle."
    d:
      en: "Without an identity-based policy the role has no permission in its own account, so both the S3 and the KMS requests would be denied."
      fr: "Sans politique basée sur l'identité, le rôle n'a aucune autorisation dans son propre compte : les requêtes S3 et KMS seraient refusées."
references:
  - title: Allowing users in other accounts to use a KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html
  - title: Cross-account policy evaluation logic
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
