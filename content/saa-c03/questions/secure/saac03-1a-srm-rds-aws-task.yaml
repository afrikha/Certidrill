id: saac03-1a-srm-rds-aws-task
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its customer database on Amazon RDS for PostgreSQL. A new security officer wants to know which security task AWS performs for the DB instance so that the company does not duplicate the work.

    Which task does AWS perform?
  fr: |
    Une entreprise exécute sa base de données clients sur Amazon RDS for PostgreSQL. Un nouveau responsable de la sécurité veut savoir quelle tâche de sécurité AWS effectue pour l'instance de base de données, afin que l'entreprise ne fasse pas le travail en double.

    Quelle tâche AWS effectue-t-il ?
body:
  options:
    - id: a
      text: { en: "Configuring the security group rules that control which clients can connect to the DB instance.", fr: "Configurer les règles du groupe de sécurité qui contrôlent quels clients peuvent se connecter à l'instance de base de données." }
    - id: b
      text: { en: "Creating the database users and granting them privileges on the tables.", fr: "Créer les utilisateurs de la base de données et leur accorder des privilèges sur les tables." }
    - id: c
      text: { en: "Choosing whether the DB instance storage is encrypted at rest.", fr: "Choisir si le stockage de l'instance de base de données est chiffré au repos." }
    - id: d
      text: { en: "Applying operating system and database engine patches during the maintenance window.", fr: "Appliquer les correctifs du système d'exploitation et du moteur de base de données pendant la fenêtre de maintenance." }
answer: { optionId: d }
explanation:
  correct:
    en: "For Amazon RDS, AWS maintains the underlying hardware, operating system and database engine, and applies required patches during the DB instance's weekly maintenance window. The customer still controls network access, IAM permissions, encryption settings and database logins."
    fr: "Pour Amazon RDS, AWS maintient le matériel sous-jacent, le système d'exploitation et le moteur de base de données, et applique les correctifs requis pendant la fenêtre de maintenance hebdomadaire de l'instance. Le client contrôle toujours l'accès réseau, les autorisations IAM, les paramètres de chiffrement et les connexions à la base."
  options:
    a:
      en: "Security groups that control connections to the DB instance are configured by the customer."
      fr: "Les groupes de sécurité qui contrôlent les connexions à l'instance de base de données sont configurés par le client."
    b:
      en: "Database logins and privileges are managed by the customer with the engine's own security features."
      fr: "Les connexions et privilèges de la base sont gérés par le client avec les fonctions de sécurité du moteur."
    c:
      en: "The customer decides whether to enable encryption at rest and which key to use."
      fr: "Le client décide d'activer ou non le chiffrement au repos et choisit la clé à utiliser."
references:
  - title: Maintaining a DB instance
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_UpgradeDBInstance.Maintenance.html
