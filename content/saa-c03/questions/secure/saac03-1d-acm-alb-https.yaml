id: saac03-1d-acm-alb-https
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs its public website on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer (ALB). The website currently accepts only HTTP. The company's domain is hosted in Amazon Route 53.

    The company must encrypt traffic between browsers and the website with a certificate that browsers trust. Certificate renewal must be automatic, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail exécute son site web public sur des instances Amazon EC2 d'un groupe Auto Scaling, derrière un Application Load Balancer (ALB). Le site n'accepte actuellement que HTTP. Le domaine de l'entreprise est hébergé dans Amazon Route 53.

    L'entreprise doit chiffrer le trafic entre les navigateurs et le site web avec un certificat approuvé par les navigateurs. Le renouvellement du certificat doit être automatique, avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Request a public certificate in AWS Certificate Manager (ACM) with DNS validation and add an HTTPS listener with it to the ALB.", fr: "Demander un certificat public dans AWS Certificate Manager (ACM) avec validation DNS et ajouter à l'ALB un écouteur HTTPS qui l'utilise." }
    - id: b
      text: { en: "Buy a certificate from a third-party certificate authority and install it on every EC2 instance through the launch template.", fr: "Acheter un certificat auprès d'une autorité de certification tierce et l'installer sur chaque instance EC2 via le modèle de lancement." }
    - id: c
      text: { en: "Generate a self-signed certificate, import it into ACM, and add an HTTPS listener with it to the ALB.", fr: "Générer un certificat auto-signé, l'importer dans ACM et ajouter à l'ALB un écouteur HTTPS qui l'utilise." }
    - id: d
      text: { en: "Request a private certificate in ACM from an AWS Private CA and add an HTTPS listener with it to the ALB.", fr: "Demander dans ACM un certificat privé émis par une autorité AWS Private CA et ajouter à l'ALB un écouteur HTTPS qui l'utilise." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A public ACM certificate is trusted by browsers and can be deployed on an HTTPS listener of the ALB, which terminates TLS. With DNS validation, ACM renews the certificate automatically as long as it is in use and the CNAME validation record stays in DNS.
    fr: |
      Un certificat ACM public est approuvé par les navigateurs et peut être déployé sur un écouteur HTTPS de l'ALB, qui met fin à la connexion TLS. Avec la validation DNS, ACM renouvelle automatiquement le certificat tant qu'il est utilisé et que l'enregistrement CNAME de validation reste dans le DNS.
  options:
    b:
      en: |
        A third-party certificate on each instance must be renewed and redeployed manually, which adds operational overhead.
      fr: |
        Un certificat tiers installé sur chaque instance doit être renouvelé et redéployé manuellement, ce qui ajoute de la charge opérationnelle.
    c:
      en: |
        Browsers do not trust a self-signed certificate, and ACM does not renew imported certificates.
      fr: |
        Les navigateurs n'approuvent pas un certificat auto-signé, et ACM ne renouvelle pas les certificats importés.
    d:
      en: |
        Private certificates are trusted only by clients configured to trust the private CA, not by public browsers.
      fr: |
        Les certificats privés ne sont approuvés que par les clients configurés pour faire confiance à l'autorité privée, pas par les navigateurs publics.
references:
  - title: Managed certificate renewal in AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/managed-renewal.html
  - title: Create an HTTPS listener for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/create-https-listener.html
