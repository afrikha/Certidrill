id: saac03-1a-cognito-mobile-upload
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company is building a mobile app. Users sign in with their Google or Apple accounts and upload photos directly from the app to an Amazon S3 bucket. The app must not contain any long-term AWS credentials.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages développe une application mobile. Les utilisateurs se connectent avec leur compte Google ou Apple et chargent des photos directement depuis l'application dans un compartiment (bucket) Amazon S3. L'application ne doit contenir aucune information d'identification AWS à long terme.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM user for each app user and store the user's access keys on the device after sign-in.", fr: "Créer un utilisateur IAM pour chaque utilisateur de l'application et stocker ses clés d'accès sur l'appareil après la connexion." }
    - id: b
      text: { en: "Use an Amazon Cognito identity pool that federates the social providers and maps signed-in users to an IAM role.", fr: "Utiliser un groupe d'identités (identity pool) Amazon Cognito qui fédère les fournisseurs sociaux et associe les utilisateurs connectés à un rôle IAM." }
    - id: c
      text: { en: "Add the app users to IAM Identity Center and assign them a permission set that allows uploads to the bucket.", fr: "Ajouter les utilisateurs de l'application à IAM Identity Center et leur attribuer un ensemble d'autorisations qui autorise les chargements dans le compartiment." }
    - id: d
      text: { en: "Embed the access keys of one IAM user in the app and restrict that user to s3:PutObject on the photo bucket only.", fr: "Intégrer dans l'application les clés d'accès d'un utilisateur IAM et restreindre cet utilisateur à s3:PutObject sur le seul compartiment de photos." }
answer: { optionId: b }
explanation:
  correct:
    en: "An Amazon Cognito identity pool exchanges tokens from public providers such as Google or Apple for temporary AWS credentials of an IAM role. The app signs its S3 requests with these short-term credentials, so no long-term key is shipped in the app."
    fr: "Un groupe d'identités Amazon Cognito échange les jetons de fournisseurs publics comme Google ou Apple contre des informations d'identification AWS temporaires d'un rôle IAM. L'application signe ses requêtes S3 avec ces informations à court terme : aucune clé à long terme n'est livrée dans l'application."
  options:
    a:
      en: "IAM users have long-term access keys, and creating one per consumer does not scale; this fails the no long-term credentials requirement."
      fr: "Les utilisateurs IAM ont des clés d'accès à long terme, et en créer un par client ne passe pas à l'échelle ; cela ne respecte pas l'exigence d'absence d'informations d'identification à long terme."
    c:
      en: "IAM Identity Center serves workforce users who access AWS accounts and applications, not consumers of a mobile app who sign in with social accounts."
      fr: "IAM Identity Center sert les utilisateurs du personnel qui accèdent aux comptes et applications AWS, pas les clients d'une application mobile qui se connectent avec des comptes sociaux."
    d:
      en: "Keys embedded in an app are long-term credentials that anyone can extract from the app package."
      fr: "Des clés intégrées dans une application sont des informations d'identification à long terme que n'importe qui peut extraire du paquet de l'application."
references:
  - title: Amazon Cognito identity pools
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-identity.html
