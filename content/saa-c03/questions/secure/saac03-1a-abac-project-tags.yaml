id: saac03-1a-abac-project-tags
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company creates several new projects every week. Each project uses Amazon EC2 instances and other resources that are tagged with the project name. Engineers who are assigned to a project must be able to start and stop only that project's instances. The company wants to avoid writing or updating IAM policies when projects are added.

    Which solution will meet these requirements?
  fr: |
    Une société de conseil crée chaque semaine plusieurs nouveaux projets. Chaque projet utilise des instances Amazon EC2 et d'autres ressources balisées avec le nom du projet. Les ingénieurs affectés à un projet doivent pouvoir démarrer et arrêter uniquement les instances de ce projet. L'entreprise veut éviter d'écrire ou de mettre à jour des politiques IAM lors de l'ajout de projets.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one IAM policy for each project that lists the instance IDs of the project, and attach it to the project's engineers.", fr: "Créer une politique IAM par projet qui liste les ID d'instance du projet, et l'attacher aux ingénieurs du projet." }
    - id: b
      text: { en: "Tag each engineer's role with the project and allow the actions when aws:ResourceTag/project matches ${aws:PrincipalTag/project}.", fr: "Baliser le rôle de chaque ingénieur avec le projet et autoriser les actions quand aws:ResourceTag/project correspond à ${aws:PrincipalTag/project}." }
    - id: c
      text: { en: "Create a separate AWS account for each project and give the engineers administrator access to their project account.", fr: "Créer un compte AWS distinct par projet et donner aux ingénieurs un accès administrateur à leur compte de projet." }
    - id: d
      text: { en: "Allow ec2:StartInstances and ec2:StopInstances on all instances for every engineer and audit the actions with CloudTrail.", fr: "Autoriser ec2:StartInstances et ec2:StopInstances sur toutes les instances pour chaque ingénieur et auditer les actions avec CloudTrail." }
answer: { optionId: b }
explanation:
  correct:
    en: "Attribute-based access control (ABAC) compares a tag of the principal with a tag of the resource. One policy that requires the instance's project tag to match the principal's project tag covers every current and future project, so new projects only need correctly tagged roles and resources."
    fr: "Le contrôle d'accès basé sur les attributs (ABAC) compare une balise du principal à une balise de la ressource. Une seule politique exigeant que la balise project de l'instance corresponde à celle du principal couvre tous les projets actuels et futurs : les nouveaux projets n'ont besoin que de rôles et de ressources correctement balisés."
  options:
    a:
      en: "Per-project policies with resource lists are the RBAC approach that requires new or updated policies for every project and every new instance."
      fr: "Des politiques par projet avec des listes de ressources correspondent à l'approche RBAC, qui exige des politiques nouvelles ou mises à jour pour chaque projet et chaque nouvelle instance."
    c:
      en: "An account per project isolates projects but adds heavy account management every week and grants far more than start and stop permissions."
      fr: "Un compte par projet isole les projets mais ajoute chaque semaine une lourde gestion de comptes et accorde bien plus que les autorisations de démarrage et d'arrêt."
    d:
      en: "Auditing after the fact does not restrict engineers to their own project's instances."
      fr: "Un audit a posteriori ne limite pas les ingénieurs aux instances de leur propre projet."
references:
  - title: Define permissions based on attributes with ABAC authorization
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction_attribute-based-access-control.html
