id: saac03-1b-cognito-identity-pool-prefix
objective: "1.1.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is building a mobile app. Users sign in with their Google or Apple accounts. After sign-in, the app must upload photos directly to an S3 bucket, and each user must be able to write only under a prefix that belongs to that user. The app must not contain long-term AWS credentials.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe une application mobile. Les utilisateurs se connectent avec leur compte Google ou Apple. Après la connexion, l'application doit charger des photos directement dans un compartiment S3, et chaque utilisateur ne doit pouvoir écrire que sous un préfixe qui lui appartient. L'application ne doit contenir aucune information d'identification AWS à long terme.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one IAM user per app user at first sign-in, and send that user's access keys to the app over HTTPS.", fr: "Créer un utilisateur IAM par utilisateur de l'application lors de la première connexion, et envoyer ses clés d'accès à l'application en HTTPS." }
    - id: b
      text: { en: "Use IAM Identity Center with Google as the external identity provider, and assign a permission set to the app users.", fr: "Utiliser IAM Identity Center avec Google comme fournisseur d'identité externe, et attribuer un ensemble d'autorisations aux utilisateurs de l'application." }
    - id: c
      text: { en: "Create an Amazon Cognito user pool federated with Google and Apple, and sign the S3 requests with the user pool ID token.", fr: "Créer un groupe d'utilisateurs Amazon Cognito fédéré avec Google et Apple, et signer les requêtes S3 avec le jeton d'ID du groupe d'utilisateurs." }
    - id: d
      text: { en: "Use an Amazon Cognito identity pool for Google and Apple, with a role policy scoped by ${cognito-identity.amazonaws.com:sub}.", fr: "Utiliser un pool d'identités Amazon Cognito pour Google et Apple, avec une politique de rôle limitée par ${cognito-identity.amazonaws.com:sub}." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Cognito identity pool exchanges the Google or Apple token for temporary AWS credentials of an IAM role (AssumeRoleWithWebIdentity). In the role's policy, the ${cognito-identity.amazonaws.com:sub} variable is replaced by each user's identity ID, so the S3 resource ARN restricts every user to their own prefix.
    fr: |
      Un pool d'identités Cognito échange le jeton Google ou Apple contre des informations d'identification AWS temporaires d'un rôle IAM (AssumeRoleWithWebIdentity). Dans la politique du rôle, la variable ${cognito-identity.amazonaws.com:sub} est remplacée par l'ID d'identité de chaque utilisateur : l'ARN de ressource S3 limite ainsi chaque utilisateur à son propre préfixe.
  options:
    a:
      en: |
        Creating IAM users for app users distributes long-term credentials and does not scale to a consumer audience.
      fr: |
        Créer des utilisateurs IAM pour les utilisateurs de l'application distribue des informations d'identification à long terme et ne passe pas à l'échelle pour un public grand public.
    b:
      en: |
        IAM Identity Center manages workforce access to AWS accounts and applications, not consumer sign-in for a mobile app.
      fr: |
        IAM Identity Center gère l'accès des collaborateurs aux comptes et applications AWS, pas la connexion des clients d'une application mobile.
    c:
      en: |
        A user pool authenticates users and issues tokens, but those tokens cannot sign S3 requests; an identity pool is needed to obtain AWS credentials.
      fr: |
        Un groupe d'utilisateurs authentifie les utilisateurs et émet des jetons, mais ces jetons ne peuvent pas signer des requêtes S3 ; un pool d'identités est nécessaire pour obtenir des informations d'identification AWS.
references:
  - title: Amazon Cognito identity pools
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-identity.html
  - title: IAM roles
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/iam-roles.html
