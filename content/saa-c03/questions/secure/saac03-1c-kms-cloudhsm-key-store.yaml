id: saac03-1c-kms-cloudhsm-key-store
objective: "1.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A government contractor encrypts Amazon EBS volumes and Amazon RDS databases with AWS KMS. A new contract requires that the key material be stored in single-tenant hardware security modules (HSMs) that the contractor owns and manages. The key material may stay inside AWS. The contractor wants to keep using the native AWS KMS integration of EBS and RDS without changing applications.

    Which solution will meet these requirements?
  fr: |
    Un sous-traitant gouvernemental chiffre des volumes Amazon EBS et des bases de données Amazon RDS avec AWS KMS. Un nouveau contrat exige que les éléments de clé soient stockés dans des modules de sécurité matériels (HSM) à locataire unique que le sous-traitant possède et gère. Les éléments de clé peuvent rester dans AWS. Le sous-traitant veut continuer à utiliser l'intégration native d'AWS KMS dans EBS et RDS sans modifier les applications.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS CloudHSM cluster, connect it to an AWS CloudHSM key store in AWS KMS, and create the KMS keys in that key store."
        fr: "Créer un cluster AWS CloudHSM, le connecter à un magasin de clés AWS CloudHSM dans AWS KMS, et créer les clés KMS dans ce magasin."
    - id: b
      text:
        en: "Create customer managed KMS keys in the standard AWS KMS key store, which uses FIPS 140-3 Level 3 validated HSMs."
        fr: "Créer des clés KMS gérées par le client dans le magasin de clés AWS KMS standard, qui utilise des HSM validés FIPS 140-3 niveau 3."
    - id: c
      text:
        en: "Create an external key store in AWS KMS that uses an XKS proxy to reach HSMs in the contractor's data center."
        fr: "Créer dans AWS KMS un magasin de clés externe qui utilise un proxy XKS pour atteindre des HSM du centre de données du sous-traitant."
    - id: d
      text:
        en: "Create an AWS CloudHSM cluster and change the applications to encrypt data with keys stored in the cluster through PKCS #11."
        fr: "Créer un cluster AWS CloudHSM et modifier les applications pour qu'elles chiffrent les données avec des clés stockées dans le cluster au moyen de PKCS #11."
answer: { optionId: a }
explanation:
  correct:
    en: |
      An AWS CloudHSM key store is a custom key store backed by single-tenant HSMs in a CloudHSM cluster that the customer owns and manages, hosted within AWS. KMS keys created in it work with AWS services such as EBS and RDS, which are low-TPS workloads suited to custom key stores. AWS prefers CloudHSM key stores when a custom key store is required.
    fr: |
      Un magasin de clés AWS CloudHSM est un magasin de clés personnalisé reposant sur des HSM à locataire unique d'un cluster CloudHSM que le client possède et gère, hébergé dans AWS. Les clés KMS qui y sont créées fonctionnent avec des services AWS comme EBS et RDS, des charges de travail à faible nombre de transactions par seconde adaptées aux magasins de clés personnalisés. AWS privilégie les magasins de clés CloudHSM lorsqu'un magasin de clés personnalisé est nécessaire.
  options:
    b:
      en: |
        The standard key store uses validated HSMs that AWS KMS manages, not single-tenant HSMs that the contractor owns.
      fr: |
        Le magasin de clés standard utilise des HSM validés gérés par AWS KMS, et non des HSM à locataire unique que le sous-traitant possède.
    c:
      en: |
        An external key store is meant for an explicit requirement to keep key material outside AWS; it has the highest latency and the most dependencies, and AWS does not recommend it otherwise.
      fr: |
        Un magasin de clés externe répond à une exigence explicite de conserver les éléments de clé hors d'AWS ; il a la latence la plus élevée et le plus de dépendances, et AWS ne le recommande pas dans les autres cas.
    d:
      en: |
        Using CloudHSM directly through PKCS #11 requires application changes and loses the native KMS integration of EBS and RDS.
      fr: |
        Utiliser CloudHSM directement par PKCS #11 exige de modifier les applications et fait perdre l'intégration KMS native d'EBS et de RDS.
references:
  - title: Key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-store-overview.html
  - title: What is AWS CloudHSM?
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html
