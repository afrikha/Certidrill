id: saac03-1a-mgmt-account-practices
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is creating an organization in AWS Organizations for 60 accounts. A solutions architect must define how the management account will be used so that the organization follows AWS best practices for the management account.

    Which actions should the solutions architect take? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée une organisation AWS Organizations pour 60 comptes. Un architecte de solutions doit définir l'utilisation du compte de gestion afin que l'organisation suive les bonnes pratiques AWS relatives au compte de gestion.

    Quelles actions l'architecte de solutions doit-il effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach an SCP to the management account to restrict what its administrators and roles can do.", fr: "Attacher une SCP au compte de gestion pour restreindre ce que ses administrateurs et rôles peuvent faire." } }
    - { id: b, text: { en: "Deploy workloads only in member accounts and keep in the management account only what must be managed there.", fr: "Déployer les charges de travail uniquement dans des comptes membres et ne garder dans le compte de gestion que ce qui doit y être géré." } }
    - { id: c, text: { en: "Host the shared application databases in the management account so that all accounts can reach them.", fr: "Héberger dans le compte de gestion les bases de données applicatives partagées pour que tous les comptes puissent y accéder." } }
    - { id: d, text: { en: "Give every developer read-only access to the management account so that they can view consolidated billing.", fr: "Donner à chaque développeur un accès en lecture seule au compte de gestion pour qu'il puisse consulter la facturation consolidée." } }
    - { id: e, text: { en: "Register member accounts as delegated administrators for supported services such as IAM Identity Center.", fr: "Inscrire des comptes membres comme administrateurs délégués des services compatibles, comme IAM Identity Center." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "AWS recommends using the management account only for tasks that require it and not deploying workloads in it, because SCPs do not apply to it and privileged operations run there. Delegating the administration of supported services to member accounts reduces how many people need access to the management account."
    fr: "AWS recommande de n'utiliser le compte de gestion que pour les tâches qui l'exigent et de ne pas y déployer de charges de travail, car les SCP ne s'y appliquent pas et des opérations privilégiées s'y exécutent. Déléguer l'administration des services compatibles à des comptes membres réduit le nombre de personnes devant accéder au compte de gestion."
  options:
    a:
      en: "SCPs do not affect users or roles in the management account, so this SCP would restrict nothing."
      fr: "Les SCP n'affectent pas les utilisateurs ni les rôles du compte de gestion : cette SCP ne restreindrait rien."
    c:
      en: "Workloads, including shared databases, belong in member accounts; putting them in the management account widens access to the most privileged account."
      fr: "Les charges de travail, y compris les bases de données partagées, doivent être dans des comptes membres ; les placer dans le compte de gestion élargit l'accès au compte le plus privilégié."
    d:
      en: "Access to the management account must be limited to the administrators who need to manage the organization; developers do not need it for their work."
      fr: "L'accès au compte de gestion doit être limité aux administrateurs qui doivent gérer l'organisation ; les développeurs n'en ont pas besoin pour leur travail."
references:
  - title: Best practices for the management account
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_best-practices_mgmt-acct.html
