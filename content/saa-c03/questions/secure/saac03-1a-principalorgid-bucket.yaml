id: saac03-1a-principalorgid-bucket
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an Amazon S3 bucket in a shared-services account that stores approved software packages. IAM roles in every account of the company's organization in AWS Organizations must be able to download the packages. The company creates new accounts every month and does not want to update the bucket policy when an account is added. Principals outside the organization must not have access.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise dispose dans un compte de services partagés d'un compartiment (bucket) Amazon S3 qui stocke des paquets logiciels approuvés. Les rôles IAM de tous les comptes de l'organisation AWS Organizations de l'entreprise doivent pouvoir télécharger les paquets. L'entreprise crée de nouveaux comptes chaque mois et ne veut pas mettre à jour la politique de compartiment à chaque ajout de compte. Les principaux extérieurs à l'organisation ne doivent pas avoir accès.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "List the account ID of every member account in the Principal element of the bucket policy.", fr: "Lister l'ID de chaque compte membre dans l'élément Principal de la politique de compartiment." }
    - id: b
      text: { en: "Create an IAM user group in each account and name these groups as principals in the bucket policy.", fr: "Créer un groupe d'utilisateurs IAM dans chaque compte et désigner ces groupes comme principaux dans la politique de compartiment." }
    - id: c
      text: { en: "Allow all principals in the bucket policy with a condition on the aws:SourceIp key that lists the corporate IP ranges.", fr: "Autoriser tous les principaux dans la politique de compartiment avec une condition sur la clé aws:SourceIp qui liste les plages IP de l'entreprise." }
    - id: d
      text: { en: "Allow s3:GetObject in the bucket policy with a condition on the aws:PrincipalOrgID key set to the organization ID.", fr: "Autoriser s3:GetObject dans la politique de compartiment avec une condition sur la clé aws:PrincipalOrgID définie sur l'ID de l'organisation." }
answer: { optionId: d }
explanation:
  correct:
    en: "The aws:PrincipalOrgID condition key compares the organization ID of the requesting principal with the value in the policy. One statement covers every current and future account of the organization, and principals of other organizations or standalone accounts are not matched. The roles still need identity-based permissions for s3:GetObject in their own accounts."
    fr: "La clé de condition aws:PrincipalOrgID compare l'ID d'organisation du principal à l'origine de la requête avec la valeur de la politique. Une seule instruction couvre tous les comptes actuels et futurs de l'organisation, et les principaux d'autres organisations ou de comptes autonomes ne correspondent pas. Les rôles ont toujours besoin d'autorisations basées sur l'identité pour s3:GetObject dans leurs propres comptes."
  options:
    a:
      en: "Listing account IDs works, but the bucket policy must be edited every time an account is created, which the company wants to avoid."
      fr: "Lister les ID de compte fonctionne, mais la politique de compartiment doit être modifiée à chaque création de compte, ce que l'entreprise veut éviter."
    b:
      en: "An IAM user group cannot be a principal in a resource-based policy, and roles cannot be members of groups."
      fr: "Un groupe d'utilisateurs IAM ne peut pas être un principal dans une politique basée sur les ressources, et les rôles ne peuvent pas être membres de groupes."
    c:
      en: "An IP condition does not identify the organization: any principal from those addresses would get access, and requests from AWS workloads or through VPC endpoints do not carry the corporate public IP addresses."
      fr: "Une condition sur l'adresse IP n'identifie pas l'organisation : tout principal utilisant ces adresses aurait accès, et les requêtes des charges de travail AWS ou passant par des points de terminaison de VPC ne portent pas les adresses IP publiques de l'entreprise."
references:
  - title: AWS global condition context keys
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html
