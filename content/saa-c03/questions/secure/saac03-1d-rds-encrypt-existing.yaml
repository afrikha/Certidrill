id: saac03-1d-rds-encrypt-existing
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a production Amazon RDS for MySQL DB instance that was created without encryption at rest. An auditor requires the database storage, its automated backups and its snapshots to be encrypted with a customer managed AWS KMS key. A maintenance window of 2 hours is approved for the change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL de production qui a été créée sans chiffrement au repos. Un auditeur exige que le stockage de la base de données, ses sauvegardes automatiques et ses instantanés soient chiffrés avec une clé AWS KMS gérée par le client. Une fenêtre de maintenance de 2 heures est approuvée pour ce changement.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Copy a snapshot with encryption and the customer managed key, restore a new DB instance from the copy, and switch the application to it.", fr: "Copier un instantané avec chiffrement et la clé gérée par le client, restaurer une nouvelle instance à partir de la copie, puis y basculer l'application." }
    - id: b
      text: { en: "Modify the DB instance to enable storage encryption with the customer managed key, and apply the change immediately during the window.", fr: "Modifier l'instance de base de données pour activer le chiffrement du stockage avec la clé gérée par le client, et appliquer le changement immédiatement pendant la fenêtre." }
    - id: c
      text: { en: "Create a read replica that is encrypted with the customer managed key, then promote the read replica and switch the application to it.", fr: "Créer un réplica en lecture chiffré avec la clé gérée par le client, puis promouvoir ce réplica et y basculer l'application." }
    - id: d
      text: { en: "Enable Amazon EBS encryption by default in the Region with the customer managed key, then reboot the DB instance.", fr: "Activer le chiffrement par défaut d'Amazon EBS dans la Région avec la clé gérée par le client, puis redémarrer l'instance de base de données." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Encryption of an RDS DB instance can be chosen only at creation. To encrypt an existing instance, copy an unencrypted snapshot with encryption enabled (choosing the KMS key), restore a new DB instance from the encrypted copy, and redirect the application. Backups and snapshots of the new instance are then encrypted with the same key.
    fr: |
      Le chiffrement d'une instance de base de données RDS ne peut être choisi qu'à sa création. Pour chiffrer une instance existante, il faut copier un instantané non chiffré en activant le chiffrement (avec la clé KMS choisie), restaurer une nouvelle instance à partir de la copie chiffrée et rediriger l'application. Les sauvegardes et instantanés de la nouvelle instance sont alors chiffrés avec la même clé.
  options:
    b:
      en: |
        RDS cannot turn on encryption for an existing unencrypted DB instance by modifying it.
      fr: |
        RDS ne permet pas d'activer le chiffrement d'une instance de base de données non chiffrée existante en la modifiant.
    c:
      en: |
        RDS does not allow an encrypted read replica of an unencrypted source DB instance.
      fr: |
        RDS n'autorise pas de réplica en lecture chiffré pour une instance source non chiffrée.
    d:
      en: |
        EBS encryption by default applies to new EBS volumes in the account, not to the storage of an existing RDS DB instance.
      fr: |
        Le chiffrement par défaut d'EBS s'applique aux nouveaux volumes EBS du compte, pas au stockage d'une instance RDS existante.
references:
  - title: Encrypting Amazon RDS resources
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html
