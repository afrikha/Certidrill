id: saac03-1d-aws-managed-key-share
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A research company stores 2 TB of datasets in an Amazon S3 bucket. The bucket default encryption is SSE-KMS with the AWS managed key aws/s3, and all existing objects use that key. A partner organization in another AWS account must now be able to read all the datasets, existing and new. The bucket policy already grants the partner account s3:GetObject, but the partner's requests are denied.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de recherche stocke 2 To de jeux de données dans un compartiment Amazon S3. Le chiffrement par défaut du compartiment est SSE-KMS avec la clé gérée par AWS aws/s3, et tous les objets existants utilisent cette clé. Une organisation partenaire, dans un autre compte AWS, doit désormais pouvoir lire tous les jeux de données, existants et nouveaux. La politique de compartiment accorde déjà s3:GetObject au compte partenaire, mais les requêtes du partenaire sont refusées.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Edit the key policy of the aws/s3 key to allow the partner account to use kms:Decrypt, and keep the current default encryption of the bucket.", fr: "Modifier la politique de clé de la clé aws/s3 pour autoriser le compte partenaire à utiliser kms:Decrypt, et conserver le chiffrement par défaut actuel du compartiment." }
    - id: b
      text: { en: "Ask the partner to attach an IAM policy that allows kms:Decrypt on the ARN of the aws/s3 key to the roles that read the datasets.", fr: "Demander au partenaire d'attacher aux rôles qui lisent les jeux de données une politique IAM qui autorise kms:Decrypt sur l'ARN de la clé aws/s3." }
    - id: c
      text: { en: "Create a customer managed key that allows the partner account, and set it as the default encryption key of the bucket for all uploads.", fr: "Créer une clé gérée par le client qui autorise le compte partenaire, et la définir comme clé de chiffrement par défaut du compartiment pour tous les chargements." }
    - id: d
      text: { en: "Create a customer managed key that allows the partner account, make it the bucket default, and re-encrypt existing objects with S3 Batch Operations.", fr: "Créer une clé gérée par le client qui autorise le compte partenaire, la définir par défaut pour le compartiment et rechiffrer les objets existants avec S3 Batch Operations." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Resources encrypted under an AWS managed key cannot be shared with other accounts, because its key policy cannot be changed. A customer managed key with a key policy that allows the partner works for new objects once it is the bucket default, and the existing objects must be copied in place (S3 Batch Operations Copy) to be re-encrypted under it. The partner also needs an IAM policy for the new key.
    fr: |
      Les ressources chiffrées sous une clé gérée par AWS ne peuvent pas être partagées avec d'autres comptes, car sa politique de clé ne peut pas être modifiée. Une clé gérée par le client dont la politique autorise le partenaire fonctionne pour les nouveaux objets une fois définie par défaut, et les objets existants doivent être copiés sur place (opération Copy de S3 Batch Operations) pour être rechiffrés sous cette clé. Le partenaire a aussi besoin d'une politique IAM pour la nouvelle clé.
  options:
    a:
      en: |
        The key policy of an AWS managed key can be viewed but never changed.
      fr: |
        La politique de clé d'une clé gérée par AWS peut être consultée mais jamais modifiée.
    b:
      en: |
        An IAM policy in the partner account cannot work without a key policy that allows the account, which the aws/s3 key will never have.
      fr: |
        Une politique IAM du compte partenaire ne peut pas fonctionner sans une politique de clé qui autorise ce compte, ce que la clé aws/s3 n'aura jamais.
    c:
      en: |
        Changing the default encryption does not re-encrypt existing objects, so the existing datasets stay under aws/s3 and remain unreadable for the partner.
      fr: |
        Changer le chiffrement par défaut ne rechiffre pas les objets existants : les jeux de données existants restent sous aws/s3 et restent illisibles pour le partenaire.
references:
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
  - title: Protecting data with encryption
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryption.html
