id: saac03-1d-s3-batch-replication
objective: "1.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company configured a replication rule on an Amazon S3 bucket that already contained 40 million objects. New objects now appear in the destination bucket, but none of the objects that existed before the rule was created have been replicated. The company must replicate the existing objects to the destination with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a configuré une règle de réplication sur un compartiment Amazon S3 qui contenait déjà 40 millions d'objets. Les nouveaux objets apparaissent désormais dans le compartiment de destination, mais aucun des objets qui existaient avant la création de la règle n'a été répliqué. L'entreprise doit répliquer les objets existants vers la destination avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Delete the replication rule and create it again with a higher priority so that it applies to all objects.", fr: "Supprimer la règle de réplication et la recréer avec une priorité plus élevée pour qu'elle s'applique à tous les objets." }
    - id: b
      text: { en: "Enable delete marker replication on the rule so that S3 re-evaluates the existing objects.", fr: "Activer la réplication des marqueurs de suppression sur la règle pour que S3 réévalue les objets existants." }
    - id: c
      text: { en: "Run an S3 Batch Replication job with a manifest generated by Amazon S3 from the replication configuration.", fr: "Exécuter un travail S3 Batch Replication avec un manifeste généré par Amazon S3 à partir de la configuration de réplication." }
    - id: d
      text: { en: "Enable S3 Replication Time Control on the rule so that all objects are replicated within 15 minutes.", fr: "Activer S3 Replication Time Control sur la règle pour que tous les objets soient répliqués en moins de 15 minutes." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Live replication copies only objects written after the rule exists. S3 Batch Replication is an on-demand Batch Operations job that replicates existing objects, and S3 can generate its manifest from the replication configuration of the bucket.
    fr: |
      La réplication en direct ne copie que les objets écrits après la création de la règle. S3 Batch Replication est un travail Batch Operations à la demande qui réplique les objets existants, et S3 peut générer son manifeste à partir de la configuration de réplication du compartiment.
  options:
    a:
      en: |
        Priority only decides which rule wins when rules overlap; a recreated rule still applies only to new objects.
      fr: |
        La priorité ne détermine que la règle qui l'emporte lorsque des règles se chevauchent ; une règle recréée ne s'applique toujours qu'aux nouveaux objets.
    b:
      en: |
        Delete marker replication controls whether delete markers are copied; it does not replicate existing objects.
      fr: |
        La réplication des marqueurs de suppression détermine si les marqueurs de suppression sont copiés ; elle ne réplique pas les objets existants.
    d:
      en: |
        S3 RTC applies to new objects of live replication; it does not replicate objects that existed before the rule.
      fr: |
        S3 RTC s'applique aux nouveaux objets de la réplication en direct ; il ne réplique pas les objets antérieurs à la règle.
references:
  - title: Replicating existing objects with Batch Replication
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/s3-batch-replication-batch.html
  - title: What does Amazon S3 replicate?
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-what-is-isnot-replicated.html
