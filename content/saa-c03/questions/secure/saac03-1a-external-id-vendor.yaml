id: saac03-1a-external-id-vendor
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company subscribes to a third-party cost monitoring service that runs in the vendor's own AWS account. The vendor needs read access to the company's account and serves many other customers. The company wants to prevent other customers of the vendor from tricking the vendor into accessing the company's account.

    Which solution will meet these requirements?
  fr: |
    Une entreprise s'abonne à un service tiers de suivi des coûts qui s'exécute dans le propre compte AWS du fournisseur. Le fournisseur a besoin d'un accès en lecture au compte de l'entreprise et sert de nombreux autres clients. L'entreprise veut empêcher d'autres clients du fournisseur d'amener ce dernier à accéder à son compte.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM user with read-only permissions and send its access keys to the vendor over an encrypted channel.", fr: "Créer un utilisateur IAM avec des autorisations en lecture seule et envoyer ses clés d'accès au fournisseur par un canal chiffré." }
    - id: b
      text: { en: "Create a role that trusts the vendor's account with no conditions, and keep the role ARN confidential.", fr: "Créer un rôle qui approuve le compte du fournisseur sans condition, et garder l'ARN du rôle confidentiel." }
    - id: c
      text: { en: "Create a role that trusts the vendor's account and requires the vendor's external ID in the trust policy.", fr: "Créer un rôle qui approuve le compte du fournisseur et exige l'ID externe du fournisseur dans la politique d'approbation." }
    - id: d
      text: { en: "Create a role that trusts all AWS principals, and require MFA in the trust policy of the role.", fr: "Créer un rôle qui approuve tous les principaux AWS, et exiger la MFA dans la politique d'approbation du rôle." }
answer: { optionId: c }
explanation:
  correct:
    en: "This is the confused deputy problem. The vendor generates a unique external ID for each customer and sends it in every AssumeRole call made on that customer's behalf. Because the role's trust policy requires that external ID, another customer who supplies the company's role ARN cannot make the vendor assume the role."
    fr: "C'est le problème de l'adjoint confus (confused deputy). Le fournisseur génère un ID externe unique par client et l'envoie dans chaque appel AssumeRole effectué pour ce client. Comme la politique d'approbation du rôle exige cet ID externe, un autre client qui fournirait l'ARN du rôle de l'entreprise ne peut pas amener le fournisseur à endosser le rôle."
  options:
    a:
      en: "Long-term access keys given to a third party go against best practices and do not address the confused deputy risk."
      fr: "Des clés d'accès à long terme remises à un tiers vont à l'encontre des bonnes pratiques et ne traitent pas le risque d'adjoint confus."
    b:
      en: "A role ARN is not a secret, so a trust policy without the external ID condition remains exposed to the confused deputy problem."
      fr: "Un ARN de rôle n'est pas un secret : une politique d'approbation sans condition d'ID externe reste exposée au problème de l'adjoint confus."
    d:
      en: "Trusting all principals lets any AWS account try to assume the role, and a vendor's automated service cannot provide MFA."
      fr: "Approuver tous les principaux permet à n'importe quel compte AWS de tenter d'endosser le rôle, et le service automatisé d'un fournisseur ne peut pas fournir de MFA."
references:
  - title: The confused deputy problem
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/confused-deputy.html
