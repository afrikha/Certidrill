id: saac03-1b-rds-iam-auth
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An application on Amazon EC2 connects to an Amazon RDS for MySQL DB instance. The security team requires that no database password be stored anywhere, including in a secrets store, and that database access be controlled through IAM. The application opens few new connections.

    Which solution will meet these requirements?
  fr: |
    Une application sur Amazon EC2 se connecte à une instance de base de données Amazon RDS for MySQL. L'équipe de sécurité exige qu'aucun mot de passe de base de données ne soit stocké nulle part, y compris dans un magasin de secrets, et que l'accès à la base de données soit contrôlé par IAM. L'application ouvre peu de nouvelles connexions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable IAM database authentication, and have the application generate an authentication token with the instance's IAM role.", fr: "Activer l'authentification de base de données IAM, et faire générer un jeton d'authentification par l'application avec le rôle IAM de l'instance." }
    - id: b
      text: { en: "Store the password in AWS Secrets Manager with automatic rotation, and allow the instance role to read the secret.", fr: "Stocker le mot de passe dans AWS Secrets Manager avec rotation automatique, et autoriser le rôle de l'instance à lire le secret." }
    - id: c
      text: { en: "Enable Kerberos authentication with AWS Managed Microsoft AD, and join the EC2 instances to the directory.", fr: "Activer l'authentification Kerberos avec AWS Managed Microsoft AD, et joindre les instances EC2 à l'annuaire." }
    - id: d
      text: { en: "Store an encrypted password in the instance user data, and decrypt it with AWS KMS when the application starts.", fr: "Stocker un mot de passe chiffré dans les données utilisateur de l'instance, et le déchiffrer avec AWS KMS au démarrage de l'application." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With IAM database authentication, the application uses its IAM credentials (here the instance role) to generate a signed authentication token, valid for 15 minutes, instead of a password. Access is controlled by IAM policies that allow rds-db:connect, and no database password needs to be stored.
    fr: |
      Avec l'authentification de base de données IAM, l'application utilise ses informations d'identification IAM (ici le rôle de l'instance) pour générer un jeton d'authentification signé, valable 15 minutes, à la place d'un mot de passe. L'accès est contrôlé par des politiques IAM qui autorisent rds-db:connect, et aucun mot de passe de base de données ne doit être stocké.
  options:
    b:
      en: |
        Secrets Manager is a secrets store, and the requirement forbids storing the password there.
      fr: |
        Secrets Manager est un magasin de secrets, et l'exigence interdit d'y stocker le mot de passe.
    c:
      en: |
        Kerberos authentication is controlled by the directory, not by IAM, and adds a directory to operate.
      fr: |
        L'authentification Kerberos est contrôlée par l'annuaire, et non par IAM, et ajoute un annuaire à exploiter.
    d:
      en: |
        The password is still stored, in user data that can be read from the instance.
      fr: |
        Le mot de passe reste stocké, dans des données utilisateur lisibles depuis l'instance.
references:
  - title: IAM database authentication for MariaDB, MySQL, and PostgreSQL
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/UsingWithRDS.IAMDBAuth.html
