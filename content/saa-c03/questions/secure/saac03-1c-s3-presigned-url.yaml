id: saac03-1c-s3-presigned-url
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An architecture firm stores project drawings in a private Amazon S3 bucket. The firm occasionally needs to let an external client, who has no AWS account, download one specific drawing for a few hours. The bucket must stay private and no new long-term credentials may be created.

    Which solution will meet these requirements?
  fr: |
    Un cabinet d'architecture stocke ses plans de projets dans un compartiment Amazon S3 privé. Le cabinet doit parfois permettre à un client externe, qui n'a pas de compte AWS, de télécharger un plan précis pendant quelques heures. Le compartiment doit rester privé et aucune nouvelle information d'identification à long terme ne doit être créée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Generate a presigned URL for the object with an expiration time of a few hours and send it to the client."
        fr: "Générer une URL présignée pour l'objet avec une durée d'expiration de quelques heures et l'envoyer au client."
    - id: b
      text:
        en: "Add a bucket policy statement that allows s3:GetObject on the object to all principals, and remove it after a few hours."
        fr: "Ajouter à la politique du compartiment une instruction qui autorise s3:GetObject sur l'objet pour tous les principaux, et la supprimer après quelques heures."
    - id: c
      text:
        en: "Create an IAM user for the client with read access to the object, and delete the user after the download."
        fr: "Créer pour le client un utilisateur IAM disposant d'un accès en lecture à l'objet, et supprimer l'utilisateur après le téléchargement."
    - id: d
      text:
        en: "Enable S3 Transfer Acceleration on the bucket and send the accelerated endpoint of the object to the client."
        fr: "Activer S3 Transfer Acceleration sur le compartiment et envoyer au client le point de terminaison accéléré de l'objet."
answer: { optionId: a }
explanation:
  correct:
    en: |
      A presigned URL grants time-limited access to one object using the permissions of the principal that created it. The client needs no AWS credentials, the bucket stays private, and the URL stops working when it expires.
    fr: |
      Une URL présignée accorde un accès limité dans le temps à un objet en utilisant les autorisations du principal qui l'a créée. Le client n'a besoin d'aucune information d'identification AWS, le compartiment reste privé, et l'URL cesse de fonctionner à son expiration.
  options:
    b:
      en: |
        A statement for all principals makes the object public during that window, which breaks the requirement that the bucket stays private.
      fr: |
        Une instruction pour tous les principaux rend l'objet public pendant cette période, ce qui contredit l'exigence d'un compartiment privé.
    c:
      en: |
        An IAM user has long-term credentials, which the firm does not want to create.
      fr: |
        Un utilisateur IAM dispose d'informations d'identification à long terme, que le cabinet ne veut pas créer.
    d:
      en: |
        Transfer Acceleration speeds up transfers but grants no access; the request still needs authorization.
      fr: |
        Transfer Acceleration accélère les transferts mais n'accorde aucun accès ; la requête doit toujours être autorisée.
references:
  - title: Download and upload objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/using-presigned-url.html
