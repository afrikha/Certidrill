id: saac03-1a-switch-role-replaces
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An administrator signs in to the AWS Management Console with an IAM user in account A. The user's policies allow full access to an Amazon S3 bucket in account A. The administrator switches to a read-only role in account B to review resources there. While still using the role, the administrator can no longer upload objects to the bucket in account A.

    What is the reason for this behavior?
  fr: |
    Un administrateur se connecte à l'AWS Management Console avec un utilisateur IAM du compte A. Les politiques de l'utilisateur autorisent un accès complet à un compartiment (bucket) Amazon S3 du compte A. L'administrateur passe à un rôle en lecture seule du compte B pour y examiner des ressources. Tant qu'il utilise ce rôle, l'administrateur ne peut plus charger d'objets dans le compartiment du compte A.

    Quelle est la raison de ce comportement ?
body:
  options:
    - id: a
      text: { en: "Switching roles automatically adds an explicit deny for account A to the user's policies.", fr: "Le changement de rôle ajoute automatiquement un refus explicite pour le compte A aux politiques de l'utilisateur." }
    - id: b
      text: { en: "Console sessions that use a role from another account expire after 15 minutes.", fr: "Les sessions de console qui utilisent un rôle d'un autre compte expirent au bout de 15 minutes." }
    - id: c
      text: { en: "The bucket policy in account A blocks requests from principals in other accounts by default.", fr: "La politique de compartiment du compte A bloque par défaut les requêtes des principaux d'autres comptes." }
    - id: d
      text: { en: "While the role is active, its permissions replace the user's permissions instead of adding to them.", fr: "Tant que le rôle est actif, ses autorisations remplacent celles de l'utilisateur au lieu de s'y ajouter." }
answer: { optionId: d }
explanation:
  correct:
    en: "User permissions and role permissions are not cumulative: only one set is active at a time. While the administrator uses the read-only role, only that role's permissions apply; choosing Switch back restores the user's permissions."
    fr: "Les autorisations de l'utilisateur et celles du rôle ne se cumulent pas : un seul ensemble est actif à la fois. Tant que l'administrateur utilise le rôle en lecture seule, seules les autorisations de ce rôle s'appliquent ; le retour à l'utilisateur (Switch back) rétablit ses autorisations."
  options:
    a:
      en: "No deny is added; the user's policies are simply set aside while the role session is active."
      fr: "Aucun refus n'est ajouté ; les politiques de l'utilisateur sont simplement mises de côté pendant la session du rôle."
    b:
      en: "The console role session lasts one hour by default, and the issue occurs immediately, not after an expiration."
      fr: "La session de rôle dans la console dure une heure par défaut, et le problème se produit immédiatement, pas après une expiration."
    c:
      en: "The requests now come from the role in account B, which has read-only permissions; a bucket policy does not block other accounts by default, it simply grants nothing unless it allows them."
      fr: "Les requêtes proviennent désormais du rôle du compte B, qui a des autorisations en lecture seule ; une politique de compartiment ne bloque pas les autres comptes par défaut, elle n'accorde simplement rien si elle ne les autorise pas."
references:
  - title: Switch from a user to an IAM role (console)
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-console.html
