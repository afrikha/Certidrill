id: saac03-1a-idc-multi-account-sso
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company manages 40 AWS accounts in AWS Organizations with all features enabled. Employees currently sign in to each account with a separate IAM user. The company wants employees to sign in once and access the accounts they need with permissions that match their job function. The solution must use temporary credentials and have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution gère 40 comptes AWS dans AWS Organizations avec toutes les fonctionnalités activées. Les employés se connectent actuellement à chaque compte avec un utilisateur IAM distinct. L'entreprise veut que les employés se connectent une seule fois et accèdent aux comptes dont ils ont besoin, avec des autorisations adaptées à leur fonction. La solution doit utiliser des informations d'identification temporaires et entraîner le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep one IAM user per employee in each account and enforce a strong password policy and MFA in every account.", fr: "Conserver un utilisateur IAM par employé dans chaque compte et imposer une politique de mot de passe robuste et la MFA dans chaque compte." }
    - id: b
      text: { en: "Enable an account instance of IAM Identity Center in each member account and create the users in each instance.", fr: "Activer une instance de compte d'IAM Identity Center dans chaque compte membre et créer les utilisateurs dans chaque instance." }
    - id: c
      text: { en: "Enable an organization instance of IAM Identity Center and assign permission sets to groups for the required accounts.", fr: "Activer une instance d'organisation d'IAM Identity Center et attribuer des ensembles d'autorisations à des groupes pour les comptes requis." }
    - id: d
      text: { en: "Create IAM users in a central account and create a cross-account IAM role in each of the 40 accounts for each job function.", fr: "Créer des utilisateurs IAM dans un compte central et créer un rôle IAM intercompte par fonction dans chacun des 40 comptes." }
answer: { optionId: c }
explanation:
  correct:
    en: "An organization instance of IAM Identity Center is the only instance type that manages access to AWS accounts. Permission sets define job-function permissions once; Identity Center provisions the matching IAM roles in each assigned account, and users sign in once through the AWS access portal and receive temporary credentials."
    fr: "Une instance d'organisation d'IAM Identity Center est le seul type d'instance qui gère l'accès aux comptes AWS. Les ensembles d'autorisations définissent une seule fois les autorisations par fonction ; Identity Center crée les rôles IAM correspondants dans chaque compte attribué, et les utilisateurs se connectent une seule fois via le portail d'accès AWS et reçoivent des informations d'identification temporaires."
  options:
    a:
      en: "IAM users have long-term passwords and keys, and users still sign in to each account separately. This fails the single sign-in and temporary credentials requirements."
      fr: "Les utilisateurs IAM ont des mots de passe et des clés à long terme, et les employés se connectent toujours à chaque compte séparément. Cette option ne respecte ni la connexion unique ni l'exigence d'informations d'identification temporaires."
    b:
      en: "An account instance is bound to one account and is meant for isolated application deployments; it cannot manage access to AWS accounts, and 40 separate instances add overhead."
      fr: "Une instance de compte est liée à un seul compte et sert à des déploiements isolés d'applications ; elle ne peut pas gérer l'accès aux comptes AWS, et 40 instances distinctes ajoutent de la charge."
    d:
      en: "Role switching from a central account works with temporary credentials, but creating and maintaining roles in 40 accounts by hand has much more operational overhead than permission sets."
      fr: "Le changement de rôle depuis un compte central fonctionne avec des informations d'identification temporaires, mais créer et maintenir à la main des rôles dans 40 comptes entraîne bien plus de charge que les ensembles d'autorisations."
references:
  - title: What is IAM Identity Center?
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
  - title: Manage AWS accounts with permission sets
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/permissionsetsconcept.html
