id: saac03-1a-group-not-principal
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has an IAM user group named Finance in the same AWS account as an Amazon S3 bucket that stores invoices. A solutions architect tries to save a bucket policy whose Principal element contains the ARN of the Finance group, and the policy is rejected. All members of the group must be able to read the invoices.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un groupe d'utilisateurs IAM nommé Finance dans le même compte AWS qu'un compartiment (bucket) Amazon S3 qui stocke des factures. Un architecte de solutions essaie d'enregistrer une politique de compartiment dont l'élément Principal contient l'ARN du groupe Finance, et la politique est rejetée. Tous les membres du groupe doivent pouvoir lire les factures.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an identity-based policy to the Finance group that allows s3:GetObject on the invoice objects.", fr: "Attacher au groupe Finance une politique basée sur l'identité qui autorise s3:GetObject sur les objets de factures." }
    - id: b
      text: { en: "Use a wildcard in the group ARN of the bucket policy so that it matches the members of the group.", fr: "Utiliser un caractère générique dans l'ARN du groupe de la politique de compartiment pour qu'il corresponde aux membres du groupe." }
    - id: c
      text: { en: "Add an IAM role to the Finance group and name that role as the principal in the bucket policy.", fr: "Ajouter un rôle IAM au groupe Finance et désigner ce rôle comme principal dans la politique de compartiment." }
    - id: d
      text: { en: "Nest the Finance group in a new parent group whose ARN the bucket policy accepts as a principal.", fr: "Imbriquer le groupe Finance dans un nouveau groupe parent dont la politique de compartiment accepte l'ARN comme principal." }
answer: { optionId: a }
explanation:
  correct:
    en: "A user group is not an authenticated principal, so it cannot appear in the Principal element of a resource-based policy. Attaching an identity-based policy to the group gives every member the permission, and in the same account an allow from the identity-based policy is enough."
    fr: "Un groupe d'utilisateurs n'est pas un principal authentifié : il ne peut pas figurer dans l'élément Principal d'une politique basée sur les ressources. Attacher une politique basée sur l'identité au groupe donne l'autorisation à chaque membre, et dans le même compte, une autorisation de la politique basée sur l'identité suffit."
  options:
    b:
      en: "Groups cannot be principals in any form; a wildcard does not turn a group ARN into a valid principal."
      fr: "Les groupes ne peuvent être principaux sous aucune forme ; un caractère générique ne fait pas d'un ARN de groupe un principal valide."
    c:
      en: "Groups contain only IAM users; roles cannot be added to a group."
      fr: "Les groupes ne contiennent que des utilisateurs IAM ; on ne peut pas ajouter de rôle à un groupe."
    d:
      en: "Groups cannot be nested, and no group ARN is accepted as a principal."
      fr: "Les groupes ne peuvent pas être imbriqués, et aucun ARN de groupe n'est accepté comme principal."
references:
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
  - title: Policy evaluation logic
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
