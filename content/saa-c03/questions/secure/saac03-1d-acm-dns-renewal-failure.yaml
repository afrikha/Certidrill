id: saac03-1d-acm-dns-renewal-failure
objective: "1.3.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company requested public AWS Certificate Manager (ACM) certificates with DNS validation for several domains. The company expected ACM to renew all of them automatically. The operations team received an AWS Health event saying that ACM could not automatically validate one of the domains for renewal.

    Which issues could prevent ACM from renewing this certificate automatically? (Choose two.)
  fr: |
    Une entreprise a demandé des certificats publics AWS Certificate Manager (ACM) avec validation DNS pour plusieurs domaines. Elle s'attendait à ce qu'ACM les renouvelle tous automatiquement. L'équipe d'exploitation a reçu un événement AWS Health indiquant qu'ACM n'a pas pu valider automatiquement l'un des domaines pour le renouvellement.

    Quels problèmes pourraient empêcher ACM de renouveler automatiquement ce certificat ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The CNAME validation record that ACM provided was deleted from the public DNS zone of the domain.", fr: "L'enregistrement CNAME de validation fourni par ACM a été supprimé de la zone DNS publique du domaine." } }
    - { id: b, text: { en: "The certificate is no longer associated with any AWS service, such as a load balancer or a CloudFront distribution.", fr: "Le certificat n'est plus associé à aucun service AWS, comme un équilibreur de charge ou une distribution CloudFront." } }
    - { id: c, text: { en: "The HTTPS listener that uses the certificate uses a security policy that does not allow TLS 1.3.", fr: "L'écouteur HTTPS qui utilise le certificat utilise une politique de sécurité qui n'autorise pas TLS 1.3." } }
    - { id: d, text: { en: "Automatic key rotation is disabled on the customer managed AWS KMS keys of the account.", fr: "La rotation automatique des clés est désactivée sur les clés AWS KMS gérées par le client du compte." } }
    - { id: e, text: { en: "The certificate is used in a Region that is different from the Region of the Route 53 hosted zone.", fr: "Le certificat est utilisé dans une Région différente de celle de la zone hébergée Route 53." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      ACM renews a DNS-validated certificate automatically only if the certificate is in use by an AWS service and every ACM-provided CNAME record is present and resolvable in public DNS. Deleting a CNAME record or detaching the certificate from all resources prevents automatic validation.
    fr: |
      ACM ne renouvelle automatiquement un certificat validé par DNS que si le certificat est utilisé par un service AWS et si chaque enregistrement CNAME fourni par ACM est présent et résolvable dans le DNS public. Supprimer un enregistrement CNAME ou détacher le certificat de toutes les ressources empêche la validation automatique.
  options:
    c:
      en: |
        The listener's security policy controls the TLS versions and ciphers negotiated with clients; it plays no role in certificate renewal.
      fr: |
        La politique de sécurité de l'écouteur contrôle les versions de TLS et les chiffrements négociés avec les clients ; elle ne joue aucun rôle dans le renouvellement du certificat.
    d:
      en: |
        KMS key rotation is unrelated to ACM certificate renewal.
      fr: |
        La rotation des clés KMS n'a aucun lien avec le renouvellement des certificats ACM.
    e:
      en: |
        Route 53 is a global service; DNS validation works whatever the Region of the certificate.
      fr: |
        Route 53 est un service global ; la validation DNS fonctionne quelle que soit la Région du certificat.
references:
  - title: Renewal for domains validated by DNS
    url: https://docs.aws.amazon.com/acm/latest/userguide/dns-renewal-validation.html
