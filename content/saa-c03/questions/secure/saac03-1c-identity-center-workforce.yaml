id: saac03-1c-identity-center-workforce
objective: "1.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 40 AWS accounts in an organization in AWS Organizations. Its employees already sign in to internal applications through a SAML 2.0 identity provider. The company wants employees to use their existing corporate credentials to access the AWS accounts, with permissions managed centrally by job function. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 40 comptes AWS dans une organisation AWS Organizations. Ses employés se connectent déjà aux applications internes par un fournisseur d'identité SAML 2.0. L'entreprise veut que les employés utilisent leurs informations d'identification d'entreprise existantes pour accéder aux comptes AWS, avec des autorisations gérées de manière centralisée selon la fonction. La solution doit demander le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable an organization instance of IAM Identity Center, connect the SAML identity provider as the identity source, and assign permission sets to groups for each account."
        fr: "Activer une instance d'organisation d'IAM Identity Center, connecter le fournisseur d'identité SAML comme source d'identité et attribuer des jeux d'autorisations aux groupes pour chaque compte."
    - id: b
      text:
        en: "Create an IAM user for each employee in every account and attach IAM policies that match each job function."
        fr: "Créer un utilisateur IAM pour chaque employé dans chaque compte et attacher des politiques IAM correspondant à chaque fonction."
    - id: c
      text:
        en: "Create an Amazon Cognito user pool federated with the SAML identity provider and use it to sign employees in to the AWS Management Console."
        fr: "Créer un groupe d'utilisateurs Amazon Cognito fédéré avec le fournisseur d'identité SAML et l'utiliser pour connecter les employés à l'AWS Management Console."
    - id: d
      text:
        en: "Create an IAM SAML identity provider and a set of IAM roles in each of the 40 accounts, and maintain the trust settings in each account."
        fr: "Créer un fournisseur d'identité SAML IAM et un ensemble de rôles IAM dans chacun des 40 comptes, et maintenir les paramètres d'approbation dans chaque compte."
answer: { optionId: a }
explanation:
  correct:
    en: |
      IAM Identity Center connects workforce users from an existing identity provider and, in an organization instance, uses permission sets to create permissions for job functions and provision them across AWS accounts. The company federates once, with one certificate to manage, instead of configuring each account.
    fr: |
      IAM Identity Center connecte les utilisateurs du personnel d'un fournisseur d'identité existant et, dans une instance d'organisation, utilise des jeux d'autorisations pour créer des autorisations par fonction et les provisionner dans les comptes AWS. L'entreprise ne fédère qu'une fois, avec un seul certificat à gérer, au lieu de configurer chaque compte.
  options:
    b:
      en: |
        IAM users create long-term credentials in every account and do not reuse the corporate credentials; this is the highest overhead.
      fr: |
        Des utilisateurs IAM créent des informations d'identification à long terme dans chaque compte et ne réutilisent pas celles de l'entreprise ; c'est la solution la plus lourde.
    c:
      en: |
        Cognito user pools authenticate users of customer-facing applications; they are not the AWS service for workforce access to AWS accounts.
      fr: |
        Les groupes d'utilisateurs Cognito authentifient les utilisateurs d'applications destinées aux clients ; ce n'est pas le service AWS d'accès du personnel aux comptes AWS.
    d:
      en: |
        Per-account SAML federation works, but configuring and maintaining 40 identity providers and role sets is far more overhead than central permission sets.
      fr: |
        La fédération SAML compte par compte fonctionne, mais configurer et maintenir 40 fournisseurs d'identité et jeux de rôles est bien plus lourd que des jeux d'autorisations centralisés.
references:
  - title: What is IAM Identity Center?
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/what-is.html
