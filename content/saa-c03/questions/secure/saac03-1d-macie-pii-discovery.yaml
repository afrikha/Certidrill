id: saac03-1d-macie-pii-discovery
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company stores customer documents in more than 300 Amazon S3 buckets across several accounts. A new privacy regulation requires the company to identify continuously which buckets contain personally identifiable information (PII), such as passport numbers and credit card numbers.

    The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers stocke des documents clients dans plus de 300 compartiments Amazon S3 répartis sur plusieurs comptes. Une nouvelle réglementation sur la protection de la vie privée impose à l'entreprise d'identifier en continu les compartiments qui contiennent des informations d'identification personnelle (PII), comme des numéros de passeport et de carte de crédit.

    La solution doit présenter le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run scheduled Amazon Athena queries that apply regular expressions to the objects in every bucket.", fr: "Exécuter des requêtes Amazon Athena planifiées qui appliquent des expressions régulières aux objets de chaque compartiment." }
    - id: b
      text: { en: "Enable Amazon GuardDuty S3 Protection in every account and review the findings it generates.", fr: "Activer Amazon GuardDuty S3 Protection dans chaque compte et examiner les résultats générés." }
    - id: c
      text: { en: "Enable Amazon Inspector in every account and scan the buckets for sensitive data.", fr: "Activer Amazon Inspector dans chaque compte et analyser les compartiments à la recherche de données sensibles." }
    - id: d
      text: { en: "Enable Amazon Macie with automated sensitive data discovery, managed centrally through AWS Organizations.", fr: "Activer Amazon Macie avec la découverte automatisée des données sensibles, gérée de façon centralisée via AWS Organizations." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Amazon Macie uses machine learning and pattern matching with managed data identifiers to find PII such as passport and credit card numbers in S3. Automated sensitive data discovery continuously samples the bucket inventory, and Macie can be managed for all accounts through AWS Organizations.
    fr: |
      Amazon Macie utilise le machine learning et la correspondance de modèles, avec des identifiants de données gérés, pour trouver des PII comme des numéros de passeport ou de carte de crédit dans S3. La découverte automatisée des données sensibles échantillonne en continu l'inventaire des compartiments, et Macie peut être géré pour tous les comptes via AWS Organizations.
  options:
    a:
      en: |
        Custom Athena queries with hand-written patterns are code to build, schedule and maintain for 300 buckets, which is not the least operational overhead.
      fr: |
        Des requêtes Athena personnalisées avec des modèles écrits à la main représentent du code à créer, planifier et maintenir pour 300 compartiments, ce qui n'est pas la charge opérationnelle la plus faible.
    b:
      en: |
        GuardDuty S3 Protection detects suspicious access activity on buckets. It does not inspect object content for PII.
      fr: |
        GuardDuty S3 Protection détecte les activités d'accès suspectes sur les compartiments. Il n'inspecte pas le contenu des objets à la recherche de PII.
    c:
      en: |
        Amazon Inspector scans workloads such as EC2 instances, container images and Lambda functions for vulnerabilities. It does not classify data in S3.
      fr: |
        Amazon Inspector analyse des charges de travail comme les instances EC2, les images de conteneur et les fonctions Lambda à la recherche de vulnérabilités. Il ne classe pas les données dans S3.
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
