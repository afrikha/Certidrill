id: saac03-1a-mfa-get-session-token
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores audit evidence in an Amazon S3 bucket. The bucket policy denies s3:DeleteObject unless the request is authenticated with MFA. A small group of auditors use IAM users with virtual MFA devices and run scripts with the AWS CLI in the same account as the bucket. The auditors must be able to delete objects from their scripts when needed.

    How should the auditors obtain credentials for their scripts?
  fr: |
    Une entreprise stocke des preuves d'audit dans un compartiment (bucket) Amazon S3. La politique de compartiment refuse s3:DeleteObject sauf si la requête est authentifiée avec la MFA. Un petit groupe d'auditeurs utilise des utilisateurs IAM avec des appareils MFA virtuels et exécute des scripts avec l'AWS CLI dans le même compte que le compartiment. Les auditeurs doivent pouvoir supprimer des objets depuis leurs scripts si nécessaire.

    Comment les auditeurs doivent-ils obtenir les informations d'identification de leurs scripts ?
body:
  options:
    - id: a
      text: { en: "Use the IAM users' access keys directly, because MFA devices are already assigned to the users.", fr: "Utiliser directement les clés d'accès des utilisateurs IAM, puisque des appareils MFA leur sont déjà attribués." }
    - id: b
      text: { en: "Call sts:GetSessionToken with the MFA device ARN and a current code, and use the temporary credentials.", fr: "Appeler sts:GetSessionToken avec l'ARN de l'appareil MFA et un code actuel, et utiliser les informations temporaires." }
    - id: c
      text: { en: "Call sts:GetFederationToken with the MFA device ARN, then use the returned federated user credentials.", fr: "Appeler sts:GetFederationToken avec l'ARN de l'appareil MFA, puis utiliser les informations d'identification d'utilisateur fédéré renvoyées." }
    - id: d
      text: { en: "Sign in to the console with MFA and copy the console session cookie into the CLI configuration.", fr: "Se connecter à la console avec la MFA et copier le cookie de session de la console dans la configuration de la CLI." }
answer: { optionId: b }
explanation:
  correct:
    en: "MFA-protected API access works only with temporary credentials. GetSessionToken, called with the device identifier and a current code, returns credentials that carry MFA context, so each S3 request satisfies aws:MultiFactorAuthPresent, which suits same-account access and resource-based policies that require MFA."
    fr: "L'accès aux API protégé par MFA ne fonctionne qu'avec des informations d'identification temporaires. GetSessionToken, appelé avec l'identifiant de l'appareil et un code actuel, renvoie des informations portant le contexte MFA : chaque requête S3 satisfait aws:MultiFactorAuthPresent, ce qui convient à l'accès dans le même compte et aux politiques basées sur les ressources qui exigent la MFA."
  options:
    a:
      en: "Long-term access keys never carry MFA information, so requests made with them cannot satisfy an MFA condition."
      fr: "Les clés d'accès à long terme ne portent jamais d'information MFA : les requêtes faites avec elles ne peuvent pas satisfaire une condition MFA."
    c:
      en: "GetFederationToken does not support MFA, so its credentials cannot satisfy the bucket policy."
      fr: "GetFederationToken ne prend pas en charge la MFA : ses informations d'identification ne peuvent pas satisfaire la politique de compartiment."
    d:
      en: "Console session cookies are not AWS CLI credentials and cannot be used to sign API requests from scripts."
      fr: "Les cookies de session de la console ne sont pas des informations d'identification de l'AWS CLI et ne peuvent pas signer les requêtes d'API des scripts."
references:
  - title: Secure API access with MFA
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_configure-api-require.html
