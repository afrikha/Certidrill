id: saac03-1c-kms-cross-account-decrypt
objective: "1.3.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A data provider stores files in an Amazon S3 bucket in account A. The objects are encrypted with SSE-KMS by using a customer managed key in account A. An analytics role in account B must read the objects. The bucket policy already allows the role to call s3:GetObject, but requests fail with an access denied error from AWS KMS.

    Which combination of changes will allow the role to read the objects while following the principle of least privilege? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Un fournisseur de données stocke des fichiers dans un compartiment Amazon S3 du compte A. Les objets sont chiffrés avec SSE-KMS au moyen d'une clé gérée par le client du compte A. Un rôle d'analyse du compte B doit lire les objets. La politique du compartiment autorise déjà le rôle à appeler s3:GetObject, mais les requêtes échouent avec une erreur d'accès refusé renvoyée par AWS KMS.

    Quelle combinaison de modifications permet au rôle de lire les objets dans le respect du principe du moindre privilège ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "In account A, add a statement to the key policy that allows the account B role to use kms:Decrypt on the key."
        fr: "Dans le compte A, ajouter à la politique de clé une instruction qui autorise le rôle du compte B à utiliser kms:Decrypt sur la clé."
    - id: b
      text:
        en: "In account B, create an alias that points to the key in account A, and grant the role access to the alias."
        fr: "Dans le compte B, créer un alias qui pointe vers la clé du compte A, et accorder au rôle l'accès à cet alias."
    - id: c
      text:
        en: "In account B, attach an IAM policy to the role that allows kms:Decrypt on the ARN of the key in account A."
        fr: "Dans le compte B, attacher au rôle une politique IAM qui autorise kms:Decrypt sur l'ARN de la clé du compte A."
    - id: d
      text:
        en: "In account A, enable automatic rotation of the key so that account B receives the new key material."
        fr: "Dans le compte A, activer la rotation automatique de la clé pour que le compte B reçoive les nouveaux éléments de clé."
    - id: e
      text:
        en: "In account A, add a statement to the key policy that allows all principals (*) to use kms:Decrypt on the key."
        fr: "Dans le compte A, ajouter à la politique de clé une instruction qui autorise tous les principaux (*) à utiliser kms:Decrypt sur la clé."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Cross-account use of a KMS key needs permission in both accounts: the key policy in account A determines who can use the key, and an IAM policy in account B delegates that permission to the role. Neither policy alone is sufficient. Granting only kms:Decrypt to the specific role follows least privilege.
    fr: |
      L'utilisation intercompte d'une clé KMS exige une autorisation dans les deux comptes : la politique de clé du compte A détermine qui peut utiliser la clé, et une politique IAM du compte B délègue cette autorisation au rôle. Aucune des deux ne suffit seule. N'accorder que kms:Decrypt au rôle concerné respecte le moindre privilège.
  options:
    b:
      en: |
        An alias is a name in the account and Region that owns it; aliases cannot refer to keys in other accounts and grant no permissions.
      fr: |
        Un alias est un nom dans le compte et la Région qui le détiennent ; un alias ne peut pas faire référence à une clé d'un autre compte et n'accorde aucune autorisation.
    d:
      en: |
        Rotation changes the key material inside KMS; it does not share anything with another account or grant permissions.
      fr: |
        La rotation change les éléments de clé à l'intérieur de KMS ; elle ne partage rien avec un autre compte et n'accorde aucune autorisation.
    e:
      en: |
        A wildcard principal without conditions would let any principal with matching IAM permissions use the key, which violates least privilege.
      fr: |
        Un principal générique sans conditions permettrait à tout principal disposant des autorisations IAM correspondantes d'utiliser la clé, ce qui contredit le moindre privilège.
references:
  - title: Allowing users in other accounts to use a KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html
