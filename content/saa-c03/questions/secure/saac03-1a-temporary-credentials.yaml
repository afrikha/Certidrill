id: saac03-1a-temporary-credentials
objective: "1.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    During a security review, a company finds IAM user access keys in configuration files on Amazon EC2 instances and in the laptops of its administrators. The company wants to reduce the risk of leaked long-term credentials and follow AWS security best practices.

    Which actions should the company take? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Lors d'une revue de sécurité, une entreprise trouve des clés d'accès d'utilisateurs IAM dans des fichiers de configuration sur des instances Amazon EC2 et sur les ordinateurs portables de ses administrateurs. L'entreprise veut réduire le risque de fuite d'informations d'identification à long terme et suivre les bonnes pratiques de sécurité AWS.

    Quelles actions l'entreprise doit-elle effectuer ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Attach IAM roles to the EC2 instances through instance profiles and remove the access keys from the instances.", fr: "Attacher des rôles IAM aux instances EC2 via des profils d'instance et retirer les clés d'accès des instances." } }
    - { id: b, text: { en: "Encrypt the configuration files that contain the access keys with an AWS KMS customer managed key.", fr: "Chiffrer avec une clé gérée par le client AWS KMS les fichiers de configuration qui contiennent les clés d'accès." } }
    - { id: c, text: { en: "Create access keys for the root user and give them to the administrators instead.", fr: "Créer des clés d'accès pour l'utilisateur racine et les donner plutôt aux administrateurs." } }
    - { id: d, text: { en: "Have the administrators sign in through IAM Identity Center and use temporary credentials for the AWS CLI.", fr: "Faire se connecter les administrateurs via IAM Identity Center et utiliser des informations d'identification temporaires pour l'AWS CLI." } }
    - { id: e, text: { en: "Replace the individual IAM users with one shared IAM user whose keys are rotated every 90 days.", fr: "Remplacer les utilisateurs IAM individuels par un seul utilisateur IAM partagé dont les clés sont renouvelées tous les 90 jours." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "AWS recommends temporary credentials everywhere it is possible. Workloads on EC2 receive automatically rotated role credentials through the instance profile, and human users federate through IAM Identity Center to get short-term credentials for the console and the AWS CLI."
    fr: "AWS recommande les informations d'identification temporaires partout où c'est possible. Les charges de travail sur EC2 reçoivent via le profil d'instance des informations d'identification de rôle renouvelées automatiquement, et les utilisateurs humains se fédèrent via IAM Identity Center pour obtenir des informations à court terme pour la console et l'AWS CLI."
  options:
    b:
      en: "Encrypting the files still leaves long-term keys on the instances, and the application needs another credential to decrypt them."
      fr: "Chiffrer les fichiers laisse toujours des clés à long terme sur les instances, et l'application a besoin d'une autre information d'identification pour les déchiffrer."
    c:
      en: "Root user access keys must not be created: the root user has unrestricted access to the account, including billing."
      fr: "Il ne faut pas créer de clés d'accès pour l'utilisateur racine : il a un accès sans restriction au compte, facturation comprise."
    e:
      en: "A shared user removes individual accountability and keeps long-term keys; rotation only shortens their exposure."
      fr: "Un utilisateur partagé supprime la traçabilité individuelle et conserve des clés à long terme ; la rotation ne fait que réduire leur exposition."
references:
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
