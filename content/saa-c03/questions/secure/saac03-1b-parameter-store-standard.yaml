id: saac03-1b-parameter-store-standard
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 300 configuration values for its microservices, such as feature flags, endpoint URLs, and a few third-party API keys that must be stored encrypted. Each value is smaller than 2 KB. The values change rarely, and none of them needs automatic rotation or expiration. The applications must read the values through an AWS API.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise dispose de 300 valeurs de configuration pour ses microservices, comme des indicateurs de fonctionnalité, des URL de points de terminaison et quelques clés d'API tierces qui doivent être stockées chiffrées. Chaque valeur fait moins de 2 Ko. Les valeurs changent rarement, et aucune n'a besoin de rotation automatique ni d'expiration. Les applications doivent lire les valeurs par une API AWS.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Store every value as a separate secret in AWS Secrets Manager.", fr: "Stocker chaque valeur comme un secret distinct dans AWS Secrets Manager." }
    - id: b
      text: { en: "Store the values as standard parameters in Parameter Store, using the SecureString type for the API keys.", fr: "Stocker les valeurs comme paramètres standard dans Parameter Store, avec le type SecureString pour les clés d'API." }
    - id: c
      text: { en: "Store the values as advanced parameters in Parameter Store, using the SecureString type for the API keys.", fr: "Stocker les valeurs comme paramètres avancés dans Parameter Store, avec le type SecureString pour les clés d'API." }
    - id: d
      text: { en: "Store the values in an encrypted table of an Amazon RDS for MySQL DB instance.", fr: "Stocker les valeurs dans une table chiffrée d'une instance de base de données Amazon RDS for MySQL." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Standard parameters in AWS Systems Manager Parameter Store have no additional charge, hold values up to 4 KB, and support up to 10,000 parameters per account and Region. The SecureString type encrypts the API keys with AWS KMS, which covers every requirement at the lowest cost.
    fr: |
      Les paramètres standard d'AWS Systems Manager Parameter Store n'entraînent aucun coût supplémentaire, acceptent des valeurs jusqu'à 4 Ko et jusqu'à 10 000 paramètres par compte et par Région. Le type SecureString chiffre les clés d'API avec AWS KMS, ce qui couvre toutes les exigences au coût le plus bas.
  options:
    a:
      en: |
        Secrets Manager charges for each secret every month; for 300 values that need no rotation, it costs more than Parameter Store.
      fr: |
        Secrets Manager facture chaque secret tous les mois ; pour 300 valeurs sans rotation, il coûte plus cher que Parameter Store.
    c:
      en: |
        Advanced parameters are charged and are needed only for values above 4 KB, parameter policies or cross-account sharing.
      fr: |
        Les paramètres avancés sont facturés et ne sont nécessaires que pour des valeurs de plus de 4 Ko, des politiques de paramètres ou le partage entre comptes.
    d:
      en: |
        A DB instance is billed for every hour it runs and must be managed, which is far more expensive for a few hundred small values.
      fr: |
        Une instance de base de données est facturée à chaque heure de fonctionnement et doit être gérée, ce qui coûte bien plus cher pour quelques centaines de petites valeurs.
references:
  - title: Choosing parameter tiers in Parameter Store
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/parameter-store-advanced-parameters.html
