id: saac03-1c-waf-ip-reputation-bots
objective: "1.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An online marketplace serves its website through an Amazon CloudFront distribution that has an AWS WAF web ACL associated with it. The company sees two problems: requests from IP addresses that AWS threat intelligence associates with malicious activity, and scrapers that copy product prices. The company wants to address both problems with AWS managed protections instead of writing and maintaining its own rules.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une place de marché en ligne sert son site web au moyen d'une distribution Amazon CloudFront à laquelle une liste ACL web AWS WAF est associée. L'entreprise constate deux problèmes : des requêtes provenant d'adresses IP que le renseignement sur les menaces d'AWS associe à des activités malveillantes, et des robots d'extraction qui copient les prix des produits. L'entreprise veut traiter ces deux problèmes avec des protections gérées par AWS au lieu d'écrire et de maintenir ses propres règles.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add the AWS managed Amazon IP reputation list rule group to the web ACL."
        fr: "Ajouter à la liste ACL web le groupe de règles géré AWS Amazon IP reputation list."
    - id: b
      text:
        en: "Enable Amazon GuardDuty and let it update the web ACL with the IP addresses in its findings."
        fr: "Activer Amazon GuardDuty et le laisser mettre à jour la liste ACL web avec les adresses IP de ses résultats."
    - id: c
      text:
        en: "Add the AWS WAF Bot Control managed rule group to the web ACL."
        fr: "Ajouter à la liste ACL web le groupe de règles géré AWS WAF Bot Control."
    - id: d
      text:
        en: "Deploy AWS Network Firewall in front of the CloudFront distribution with a managed threat signature rule group."
        fr: "Déployer AWS Network Firewall devant la distribution CloudFront avec un groupe de règles géré de signatures de menaces."
    - id: e
      text:
        en: "Configure CloudFront geographic restrictions with a block list of the countries where scrapers are detected."
        fr: "Configurer les restrictions géographiques de CloudFront avec une liste de blocage des pays où des robots d'extraction sont détectés."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      The Amazon IP reputation list rule group is based on Amazon internal threat intelligence and blocks IP addresses actively engaged in malicious activity or reconnaissance. The Bot Control rule group monitors, blocks or rate limits bots such as scrapers and crawlers, with a targeted level for bots that do not identify themselves. AWS maintains both rule groups.
    fr: |
      Le groupe de règles Amazon IP reputation list repose sur le renseignement interne d'Amazon sur les menaces et bloque les adresses IP activement impliquées dans des activités malveillantes ou de reconnaissance. Le groupe de règles Bot Control surveille, bloque ou limite le débit de robots comme les extracteurs et les robots d'indexation, avec un niveau ciblé pour les robots qui ne s'identifient pas. AWS maintient ces deux groupes de règles.
  options:
    b:
      en: |
        GuardDuty generates findings but does not update web ACLs by itself; this would require custom automation.
      fr: |
        GuardDuty génère des résultats mais ne met pas à jour les listes ACL web par lui-même ; il faudrait une automatisation personnalisée.
    d:
      en: |
        Network Firewall protects traffic at the perimeter of a VPC; it cannot be placed in front of a CloudFront distribution.
      fr: |
        Network Firewall protège le trafic au périmètre d'un VPC ; il ne peut pas être placé devant une distribution CloudFront.
    e:
      en: |
        Blocking countries also blocks legitimate buyers there, and scrapers can use addresses in any country.
      fr: |
        Bloquer des pays bloque aussi les acheteurs légitimes qui s'y trouvent, et les robots d'extraction peuvent utiliser des adresses de n'importe quel pays.
references:
  - title: IP reputation rule groups
    url: https://docs.aws.amazon.com/waf/latest/developerguide/aws-managed-rule-groups-ip-rep.html
  - title: AWS WAF Bot Control
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-bot-control.html
