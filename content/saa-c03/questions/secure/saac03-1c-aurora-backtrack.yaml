id: saac03-1c-aurora-backtrack
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company runs an Amazon Aurora MySQL DB cluster that was created with Backtrack enabled and a target backtrack window of 24 hours. An operator ran an UPDATE statement without a WHERE clause 20 minutes ago. The company must return the whole cluster to its state just before the statement within minutes, and the application must keep using the same cluster endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie exploite un cluster de bases de données Amazon Aurora MySQL créé avec Backtrack activé et une fenêtre cible de retour arrière de 24 heures. Un opérateur a exécuté il y a 20 minutes une instruction UPDATE sans clause WHERE. L'entreprise doit ramener tout le cluster à son état juste avant l'instruction en quelques minutes, et l'application doit continuer à utiliser le même point de terminaison de cluster.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Restore the cluster to a point in time just before the statement, and point the application to the new cluster."
        fr: "Restaurer le cluster à un instant juste avant l'instruction, et faire pointer l'application vers le nouveau cluster."
    - id: b
      text:
        en: "Backtrack the DB cluster to a time just before the statement was run."
        fr: "Effectuer un retour arrière (backtrack) du cluster à un instant juste avant l'exécution de l'instruction."
    - id: c
      text:
        en: "Promote an Aurora Replica of the cluster to be the new writer instance."
        fr: "Promouvoir un réplica Aurora du cluster comme nouvelle instance d'écriture."
    - id: d
      text:
        en: "Restore the most recent automated DB cluster snapshot to a new cluster."
        fr: "Restaurer l'instantané de cluster automatisé le plus récent dans un nouveau cluster."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Backtracking rewinds an Aurora MySQL DB cluster in place to an earlier time within the backtrack window, typically in minutes, without creating a new cluster, so the endpoint does not change. Backtracking causes a brief disruption and affects the whole cluster.
    fr: |
      Le retour arrière rembobine sur place un cluster Aurora MySQL à un instant antérieur de la fenêtre de retour arrière, généralement en quelques minutes, sans créer de nouveau cluster : le point de terminaison ne change pas. Le retour arrière provoque une brève interruption et concerne tout le cluster.
  options:
    a:
      en: |
        Point-in-time restore launches a new DB cluster, which can take hours and gives the application a new endpoint.
      fr: |
        La restauration à un instant dans le passé lance un nouveau cluster, ce qui peut prendre des heures et donne un nouveau point de terminaison à l'application.
    c:
      en: |
        Aurora Replicas share the cluster volume, so they already contain the bad update.
      fr: |
        Les réplicas Aurora partagent le volume du cluster : ils contiennent déjà la mise à jour erronée.
    d:
      en: |
        A snapshot restore creates a new cluster with a new endpoint and loses the changes made since the snapshot.
      fr: |
        Restaurer un instantané crée un nouveau cluster avec un nouveau point de terminaison et perd les modifications effectuées depuis l'instantané.
references:
  - title: Backtracking an Aurora DB cluster
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Managing.Backtrack.html
