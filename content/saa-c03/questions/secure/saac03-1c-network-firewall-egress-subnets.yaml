id: saac03-1c-network-firewall-egress-subnets
objective: "1.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs workloads in private subnets that reach the internet through NAT gateways. A new policy requires that all outbound internet traffic from these subnets be inspected with intrusion prevention signatures and that HTTPS connections be allowed only to an approved list of partner domain names, based on the TLS Server Name Indication (SNI). The company wants a managed AWS service.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute des charges de travail dans des sous-réseaux privés qui atteignent Internet par des passerelles NAT. Une nouvelle politique impose que tout le trafic Internet sortant de ces sous-réseaux soit inspecté avec des signatures de prévention des intrusions et que les connexions HTTPS ne soient autorisées que vers une liste approuvée de noms de domaine partenaires, d'après l'indication du nom du serveur (SNI) TLS. L'entreprise veut un service AWS géré.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add outbound security group rules that allow HTTPS only to the approved partner domain names, and enable Amazon GuardDuty to detect intrusions."
        fr: "Ajouter des règles sortantes de groupe de sécurité qui n'autorisent le HTTPS que vers les noms de domaine partenaires approuvés, et activer Amazon GuardDuty pour détecter les intrusions."
    - id: b
      text:
        en: "Create an Amazon Route 53 Resolver DNS Firewall rule group that allows only the approved domain names, associate it with the VPC, and block all other queries."
        fr: "Créer un groupe de règles Amazon Route 53 Resolver DNS Firewall qui n'autorise que les noms de domaine approuvés, l'associer au VPC et bloquer toutes les autres requêtes."
    - id: c
      text:
        en: "Associate an AWS WAF web ACL that allows only the approved domain names and uses the IP reputation rule group with each NAT gateway."
        fr: "Associer à chaque passerelle NAT une liste ACL web AWS WAF qui n'autorise que les noms de domaine approuvés et utilise le groupe de règles de réputation IP."
    - id: d
      text:
        en: "Deploy AWS Network Firewall with a domain allow list and IPS rules in dedicated firewall subnets, and route the private subnets' internet traffic through it."
        fr: "Déployer AWS Network Firewall avec une liste de domaines autorisés et des règles IPS dans des sous-réseaux de pare-feu dédiés, et y faire passer le trafic Internet des sous-réseaux privés."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Network Firewall is a managed stateful firewall and intrusion prevention service that uses Suricata-compatible rules and can filter traffic by domain name. Its endpoints sit in dedicated firewall subnets, and VPC route tables steer the protected subnets' traffic through them, which adds an inspection tier between the private subnets and the NAT gateways.
    fr: |
      Network Firewall est un service géré de pare-feu avec état et de prévention des intrusions qui utilise des règles compatibles Suricata et peut filtrer le trafic par nom de domaine. Ses points de terminaison se trouvent dans des sous-réseaux de pare-feu dédiés, et les tables de routage du VPC y dirigent le trafic des sous-réseaux protégés, ce qui ajoute un niveau d'inspection entre les sous-réseaux privés et les passerelles NAT.
  options:
    a:
      en: |
        Security group rules use IP addresses, CIDR blocks, prefix lists or other security groups, not domain names, and GuardDuty detects threats without inspecting or blocking traffic inline.
      fr: |
        Les règles de groupe de sécurité utilisent des adresses IP, des blocs CIDR, des listes de préfixes ou d'autres groupes de sécurité, pas des noms de domaine, et GuardDuty détecte des menaces sans inspecter ni bloquer le trafic en ligne.
    b:
      en: |
        DNS Firewall filters DNS queries only; it applies no intrusion prevention signatures and does not inspect the TLS SNI of connections.
      fr: |
        DNS Firewall ne filtre que les requêtes DNS ; il n'applique aucune signature de prévention des intrusions et n'inspecte pas le SNI TLS des connexions.
    c:
      en: |
        AWS WAF cannot be associated with a NAT gateway; it protects layer 7 resources such as CloudFront, ALB and API Gateway against inbound web requests.
      fr: |
        AWS WAF ne peut pas être associé à une passerelle NAT ; il protège des ressources de couche 7 comme CloudFront, l'ALB et API Gateway contre les requêtes web entrantes.
references:
  - title: What is AWS Network Firewall?
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/what-is-aws-network-firewall.html
