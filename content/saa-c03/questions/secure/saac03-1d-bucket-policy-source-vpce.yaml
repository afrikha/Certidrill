id: saac03-1d-bucket-policy-source-vpce
objective: "1.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company runs an application on Amazon EC2 instances in private subnets. The instances access an Amazon S3 bucket of medical images through a gateway VPC endpoint. A security review requires that the bucket deny every request that does not arrive through this specific VPC endpoint.

    Which solution will meet this requirement?
  fr: |
    Une entreprise du secteur de la santé exécute une application sur des instances Amazon EC2 situées dans des sous-réseaux privés. Les instances accèdent à un compartiment Amazon S3 d'images médicales via un point de terminaison de VPC de passerelle. Un audit de sécurité exige que le compartiment refuse toute requête qui n'arrive pas par ce point de terminaison de VPC précis.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SourceIp is not the CIDR block of the private subnets.", fr: "Ajouter une instruction de politique de compartiment qui refuse toutes les actions S3 lorsque aws:SourceIp ne correspond pas au bloc CIDR des sous-réseaux privés." }
    - id: b
      text: { en: "Associate a security group with the gateway endpoint that allows HTTPS only from the security group of the instances.", fr: "Associer au point de terminaison de passerelle un groupe de sécurité qui autorise HTTPS uniquement depuis le groupe de sécurité des instances." }
    - id: c
      text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SourceVpce is not the ID of the gateway endpoint.", fr: "Ajouter une instruction de politique de compartiment qui refuse toutes les actions S3 lorsque aws:SourceVpce ne correspond pas à l'ID du point de terminaison de passerelle." }
    - id: d
      text: { en: "Add a network ACL rule to the private subnets that denies outbound traffic to the public IP ranges of Amazon S3.", fr: "Ajouter aux sous-réseaux privés une règle de liste ACL réseau qui refuse le trafic sortant vers les plages d'adresses IP publiques d'Amazon S3." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `aws:SourceVpce` condition key contains the ID of the VPC endpoint that a request came through. A Deny statement with `StringNotEquals` on this key rejects all requests that do not use the endpoint; a separate Allow is still needed to grant access, and console access from outside the VPC is blocked too.
    fr: |
      La clé de condition `aws:SourceVpce` contient l'ID du point de terminaison de VPC par lequel une requête est arrivée. Une instruction Deny avec `StringNotEquals` sur cette clé rejette toutes les requêtes qui n'utilisent pas le point de terminaison ; un Allow distinct reste nécessaire pour accorder l'accès, et l'accès à la console depuis l'extérieur du VPC est également bloqué.
  options:
    a:
      en: |
        Requests that pass through a VPC endpoint carry private source addresses, so aws:SourceIp with private ranges is not the way to identify them; aws:SourceVpce or aws:VpcSourceIp is used instead.
      fr: |
        Les requêtes qui passent par un point de terminaison de VPC portent des adresses source privées : aws:SourceIp avec des plages privées n'est pas le moyen de les identifier ; on utilise plutôt aws:SourceVpce ou aws:VpcSourceIp.
    b:
      en: |
        Gateway endpoints do not support security groups, and a security group would not stop requests from other networks that reach the bucket directly.
      fr: |
        Les points de terminaison de passerelle ne prennent pas en charge les groupes de sécurité, et un groupe de sécurité n'arrêterait pas les requêtes d'autres réseaux qui atteignent directement le compartiment.
    d:
      en: |
        A network ACL only affects traffic from those subnets; requests from anywhere else can still reach the bucket.
      fr: |
        Une liste ACL réseau n'agit que sur le trafic de ces sous-réseaux ; des requêtes venant de n'importe où ailleurs peuvent toujours atteindre le compartiment.
references:
  - title: Controlling access from VPC endpoints with bucket policies
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
