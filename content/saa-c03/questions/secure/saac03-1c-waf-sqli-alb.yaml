id: saac03-1c-waf-sqli-alb
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company runs an order-tracking web application on Amazon EC2 instances behind an Application Load Balancer (ALB). The application queries an Amazon RDS for MySQL database. A security review shows that attackers are sending requests with SQL injection patterns in query strings and form fields.

    The company needs to block these requests before they reach the instances, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail exécute une application web de suivi des commandes sur des instances Amazon EC2 derrière un Application Load Balancer (ALB). L'application interroge une base de données Amazon RDS for MySQL. Un audit de sécurité montre que des attaquants envoient des requêtes contenant des motifs d'injection SQL dans les chaînes de requête et les champs de formulaire.

    L'entreprise doit bloquer ces requêtes avant qu'elles n'atteignent les instances, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Rely on AWS Shield Standard, which inspects requests to the ALB and drops those that contain SQL injection patterns."
        fr: "S'appuyer sur AWS Shield Standard, qui inspecte les requêtes envoyées à l'ALB et rejette celles qui contiennent des motifs d'injection SQL."
    - id: b
      text:
        en: "Associate an AWS WAF web ACL with the ALB and add the AWS managed SQL database rule group to the web ACL."
        fr: "Associer une liste ACL web AWS WAF à l'ALB et ajouter à cette liste le groupe de règles géré AWS pour les bases de données SQL."
    - id: c
      text:
        en: "Add inbound rules to the instances' security group that deny requests containing SQL keywords on port 443."
        fr: "Ajouter au groupe de sécurité des instances des règles entrantes qui refusent les requêtes contenant des mots-clés SQL sur le port 443."
    - id: d
      text:
        en: "Enable Amazon GuardDuty so that it detects the SQL injection attempts and blocks the source IP addresses."
        fr: "Activer Amazon GuardDuty pour qu'il détecte les tentatives d'injection SQL et bloque les adresses IP sources."
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS WAF inspects HTTP(S) requests at layer 7 and can be associated with an ALB. The AWS managed rule group `AWSManagedRulesSQLiRuleSet` blocks SQL injection patterns in query arguments, body, headers, URI path and cookies, and AWS maintains its rules, so no custom rule writing is needed.
    fr: |
      AWS WAF inspecte les requêtes HTTP(S) au niveau de la couche 7 et peut être associé à un ALB. Le groupe de règles géré AWS `AWSManagedRulesSQLiRuleSet` bloque les motifs d'injection SQL dans les arguments de requête, le corps, les en-têtes, le chemin d'URI et les cookies, et AWS en maintient les règles : il n'y a aucune règle personnalisée à écrire.
  options:
    a:
      en: |
        Shield Standard protects against common network and transport layer (layer 3 and 4) DDoS attacks. It does not inspect application payloads for SQL injection.
      fr: |
        Shield Standard protège contre les attaques DDoS courantes des couches réseau et transport (couches 3 et 4). Il n'inspecte pas le contenu applicatif pour y détecter une injection SQL.
    c:
      en: |
        Security groups only contain allow rules based on protocol, port and source. They cannot deny traffic or inspect the content of HTTP requests.
      fr: |
        Les groupes de sécurité ne contiennent que des règles d'autorisation fondées sur le protocole, le port et la source. Ils ne peuvent ni refuser du trafic ni inspecter le contenu des requêtes HTTP.
    d:
      en: |
        GuardDuty is a threat detection service that generates findings. It does not sit in the request path and does not block requests by itself.
      fr: |
        GuardDuty est un service de détection des menaces qui génère des résultats. Il ne se trouve pas sur le chemin des requêtes et ne bloque pas les requêtes par lui-même.
references:
