id: saac03-1c-dynamodb-pitr
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company stores player profiles in an Amazon DynamoDB table. A faulty deployment could corrupt items at any time. The company needs to restore the table data to its state at any point in time in the last 35 days, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de jeux stocke les profils des joueurs dans une table Amazon DynamoDB. Un déploiement défectueux pourrait corrompre des éléments à tout moment. L'entreprise doit pouvoir restaurer les données de la table dans leur état à n'importe quel instant des 35 derniers jours, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Schedule a daily on-demand backup of the table with an Amazon EventBridge rule."
        fr: "Planifier une sauvegarde à la demande quotidienne de la table avec une règle Amazon EventBridge."
    - id: b
      text:
        en: "Convert the table to a global table with a replica in a second AWS Region."
        fr: "Convertir la table en table globale avec un réplica dans une deuxième Région AWS."
    - id: c
      text:
        en: "Turn on point-in-time recovery for the table with a recovery period of 35 days."
        fr: "Activer la restauration à un instant dans le passé (PITR) pour la table avec une période de récupération de 35 jours."
    - id: d
      text:
        en: "Stream item changes with DynamoDB Streams to an AWS Lambda function that writes each change to Amazon S3."
        fr: "Diffuser les modifications des éléments avec DynamoDB Streams vers une fonction AWS Lambda qui écrit chaque modification dans Amazon S3."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Point-in-time recovery maintains continuous backups for a recovery period of 1 to 35 days and restores the table to any point in that window. The restore always creates a new table, and DynamoDB manages the backups with no scheduling.
    fr: |
      La restauration PITR conserve des sauvegardes continues pendant une période de récupération de 1 à 35 jours et restaure la table à n'importe quel instant de cette fenêtre. La restauration crée toujours une nouvelle table, et DynamoDB gère les sauvegardes sans planification.
  options:
    a:
      en: |
        Daily backups only allow restoring to the time of a backup, so up to a day of changes can be lost.
      fr: |
        Des sauvegardes quotidiennes ne permettent de restaurer qu'à l'heure d'une sauvegarde : jusqu'à une journée de modifications peut être perdue.
    b:
      en: |
        Global tables replicate every write, including corrupted ones, to the replica; they are not a backup.
      fr: |
        Les tables globales répliquent chaque écriture, y compris les écritures corrompues ; ce ne sont pas des sauvegardes.
    d:
      en: |
        A custom change log requires code to build and maintain and offers no built-in restore of the table.
      fr: |
        Un journal des modifications personnalisé exige du code à créer et à maintenir et n'offre aucune restauration intégrée de la table.
references:
  - title: Enable point-in-time recovery in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/PointInTimeRecovery_Howitworks.html
