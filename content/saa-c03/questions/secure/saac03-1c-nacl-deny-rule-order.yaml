id: saac03-1c-nacl-deny-rule-order
objective: "1.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's web servers run in a public subnet. The subnet's network ACL has inbound rule 100, which allows TCP port 443 from 0.0.0.0/0. The security team has identified a CIDR block, 198.51.100.0/24, that is sending malicious traffic to the web servers. All other internet clients must keep access.

    Which solution will block traffic from this CIDR block?
  fr: |
    Les serveurs web d'une entreprise s'exécutent dans un sous-réseau public. L'ACL réseau du sous-réseau contient la règle entrante 100, qui autorise le port TCP 443 depuis 0.0.0.0/0. L'équipe de sécurité a identifié un bloc CIDR, 198.51.100.0/24, qui envoie du trafic malveillant aux serveurs web. Tous les autres clients d'Internet doivent conserver l'accès.

    Quelle solution bloque le trafic provenant de ce bloc CIDR ?
body:
  options:
    - id: a
      text:
        en: "Add an inbound deny rule for 198.51.100.0/24 to the web servers' security group."
        fr: "Ajouter une règle de refus entrante pour 198.51.100.0/24 au groupe de sécurité des serveurs web."
    - id: b
      text:
        en: "Add inbound rule 90 to the network ACL that denies all traffic from 198.51.100.0/24."
        fr: "Ajouter à l'ACL réseau la règle entrante 90 qui refuse tout le trafic provenant de 198.51.100.0/24."
    - id: c
      text:
        en: "Add inbound rule 110 to the network ACL that denies all traffic from 198.51.100.0/24."
        fr: "Ajouter à l'ACL réseau la règle entrante 110 qui refuse tout le trafic provenant de 198.51.100.0/24."
    - id: d
      text:
        en: "Add a route for 198.51.100.0/24 to the subnet's route table that targets the local route."
        fr: "Ajouter à la table de routage du sous-réseau une route pour 198.51.100.0/24 qui cible la route locale."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Network ACL rules are evaluated in order, starting with the lowest number, and the first matching rule applies. A deny rule numbered 90 matches traffic from 198.51.100.0/24 before rule 100 allows it, while other clients still match rule 100.
    fr: |
      Les règles d'une ACL réseau sont évaluées dans l'ordre, en commençant par le numéro le plus bas, et la première règle correspondante s'applique. Une règle de refus numérotée 90 intercepte le trafic de 198.51.100.0/24 avant que la règle 100 ne l'autorise, tandis que les autres clients correspondent toujours à la règle 100.
  options:
    a:
      en: |
        Security groups support allow rules only; they cannot explicitly deny a CIDR block.
      fr: |
        Les groupes de sécurité ne prennent en charge que des règles d'autorisation ; ils ne peuvent pas refuser explicitement un bloc CIDR.
    c:
      en: |
        Rule 100 allows the traffic first, so evaluation stops before rule 110 is reached.
      fr: |
        La règle 100 autorise le trafic en premier : l'évaluation s'arrête avant d'atteindre la règle 110.
    d:
      en: |
        Route tables control where outbound traffic from the subnet is sent; they do not filter incoming traffic, and the local route only covers the VPC CIDR.
      fr: |
        Les tables de routage déterminent où est envoyé le trafic sortant du sous-réseau ; elles ne filtrent pas le trafic entrant, et la route locale ne couvre que le CIDR du VPC.
references:
  - title: Control subnet traffic with network access control lists
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html
