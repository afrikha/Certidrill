id: saac03-1c-object-lock-legal-hold
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores contracts in an S3 bucket that has S3 Object Lock enabled with a 1-year default retention in governance mode. The legal department has been notified of litigation and must preserve 200 specific contracts until the case is closed. Nobody knows how long the case will last, and the retention of the other contracts must not change.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des contrats dans un compartiment S3 dont S3 Object Lock est activé avec une conservation par défaut d'un an en mode gouvernance. Le service juridique a été informé d'un litige et doit préserver 200 contrats précis jusqu'à la clôture de l'affaire. Personne ne sait combien de temps durera l'affaire, et la conservation des autres contrats ne doit pas changer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Place a legal hold on the 200 contract object versions, and remove it when the case is closed."
        fr: "Placer une conservation légale (legal hold) sur les versions des 200 contrats, et la retirer à la clôture de l'affaire."
    - id: b
      text:
        en: "Change the bucket's default retention to compliance mode with a 10-year retention period."
        fr: "Passer la conservation par défaut du compartiment en mode conformité avec une période de conservation de 10 ans."
    - id: c
      text:
        en: "Transition the 200 contracts to the S3 Glacier Deep Archive storage class with a lifecycle rule."
        fr: "Faire passer les 200 contrats dans la classe de stockage S3 Glacier Deep Archive avec une règle de cycle de vie."
    - id: d
      text:
        en: "Set a retention period of 100 years in compliance mode on the 200 contract object versions."
        fr: "Définir une période de conservation de 100 ans en mode conformité sur les versions des 200 contrats."
answer: { optionId: a }
explanation:
  correct:
    en: |
      A legal hold gives the same protection as a retention period but has no expiration date: it stays in place until it is explicitly removed. It is independent of the retention period and is set per object version, so only the 200 contracts are affected.
    fr: |
      Une conservation légale offre la même protection qu'une période de conservation, mais sans date d'expiration : elle reste en place jusqu'à son retrait explicite. Elle est indépendante de la période de conservation et se définit par version d'objet : seuls les 200 contrats sont concernés.
  options:
    b:
      en: |
        The bucket default applies to new objects across the bucket, which changes the retention of other contracts, and a fixed period does not match an unknown case duration.
      fr: |
        La valeur par défaut du compartiment s'applique aux nouveaux objets de tout le compartiment, ce qui modifie la conservation des autres contrats, et une période fixe ne correspond pas à une durée d'affaire inconnue.
    c:
      en: |
        A storage class changes cost and retrieval time; it does not prevent deletion.
      fr: |
        Une classe de stockage change le coût et le délai de récupération ; elle n'empêche pas la suppression.
    d:
      en: |
        Compliance mode retention cannot be shortened, so the contracts could not be released when the case closes.
      fr: |
        Une conservation en mode conformité ne peut pas être raccourcie : les contrats ne pourraient pas être libérés à la clôture de l'affaire.
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
