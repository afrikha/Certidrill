id: saac03-1c-firewall-manager-waf-org
objective: "1.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 AWS accounts in an organization in AWS Organizations, with AWS Config enabled in all accounts. Application teams create new Application Load Balancers and Amazon CloudFront distributions every week. The security team must ensure that a baseline set of AWS WAF rules is automatically applied to every existing and future load balancer and distribution in all accounts.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise dispose de 60 comptes AWS dans une organisation AWS Organizations, avec AWS Config activé dans tous les comptes. Les équipes d'application créent chaque semaine de nouveaux Application Load Balancers et de nouvelles distributions Amazon CloudFront. L'équipe de sécurité doit garantir qu'un ensemble de règles AWS WAF de référence est appliqué automatiquement à chaque équilibreur de charge et à chaque distribution, existants et futurs, dans tous les comptes.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text:
        en: "Use AWS CloudFormation StackSets to deploy a web ACL to every account, and ask the teams to associate it with their resources."
        fr: "Utiliser AWS CloudFormation StackSets pour déployer une liste ACL web dans chaque compte, et demander aux équipes de l'associer à leurs ressources."
    - id: b
      text:
        en: "Attach a service control policy to the organization root that denies the creation of load balancers and distributions without a web ACL."
        fr: "Attacher à la racine de l'organisation une politique de contrôle des services qui refuse la création d'équilibreurs de charge et de distributions sans liste ACL web."
    - id: c
      text:
        en: "Designate an AWS Firewall Manager administrator account and create an AWS WAF policy that applies to load balancers and distributions across the organization."
        fr: "Désigner un compte administrateur AWS Firewall Manager et créer une politique AWS WAF qui s'applique aux équilibreurs de charge et aux distributions de toute l'organisation."
    - id: d
      text:
        en: "Subscribe all accounts to AWS Shield Advanced so that a baseline web ACL is added to each new load balancer and distribution."
        fr: "Abonner tous les comptes à AWS Shield Advanced pour qu'une liste ACL web de référence soit ajoutée à chaque nouvel équilibreur de charge et à chaque nouvelle distribution."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Firewall Manager centrally manages AWS WAF rules across the accounts of an organization. Its prerequisites are AWS Organizations, a Firewall Manager administrator account and AWS Config. An AWS WAF policy applies the web ACL rules to in-scope resources automatically, including resources created later.
    fr: |
      Firewall Manager gère de façon centralisée les règles AWS WAF dans les comptes d'une organisation. Ses prérequis sont AWS Organizations, un compte administrateur Firewall Manager et AWS Config. Une politique AWS WAF applique automatiquement les règles de la liste ACL web aux ressources concernées, y compris celles créées ultérieurement.
  options:
    a:
      en: |
        StackSets can deploy the web ACL, but association with each new resource stays manual, so coverage is not guaranteed.
      fr: |
        StackSets peut déployer la liste ACL web, mais l'association à chaque nouvelle ressource reste manuelle : la couverture n'est pas garantie.
    b:
      en: |
        SCPs only restrict permissions and cannot apply rules to resources; this condition would also block teams rather than protect their resources automatically.
      fr: |
        Les SCP ne font que restreindre des autorisations et ne peuvent pas appliquer de règles aux ressources ; cette condition bloquerait aussi les équipes au lieu de protéger automatiquement leurs ressources.
    d:
      en: |
        Shield Advanced protects only resources that you add explicitly or through a Firewall Manager policy, and subscribing does not deploy baseline AWS WAF rules.
      fr: |
        Shield Advanced ne protège que les ressources ajoutées explicitement ou par une politique Firewall Manager, et l'abonnement ne déploie pas de règles AWS WAF de référence.
references:
  - title: AWS Firewall Manager prerequisites
    url: https://docs.aws.amazon.com/waf/latest/developerguide/fms-prereq.html
