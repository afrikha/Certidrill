id: saac03-1b-detective-investigation
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon GuardDuty reports a finding that an EC2 instance is communicating with an unusual IP address. A security analyst must investigate the root cause: which API calls, network flows and IAM roles were related to the instance over the past weeks. The analyst wants linked, visual data and does not want to write custom log queries.

    Which AWS service should the analyst use?
  fr: |
    Amazon GuardDuty signale un résultat indiquant qu'une instance EC2 communique avec une adresse IP inhabituelle. Un analyste de sécurité doit rechercher la cause première : quels appels d'API, flux réseau et rôles IAM étaient liés à l'instance au cours des dernières semaines. L'analyste veut des données reliées et visuelles et ne veut pas écrire de requêtes personnalisées sur les journaux.

    Quel service AWS l'analyste doit-il utiliser ?
body:
  options:
    - id: a
      text: "AWS Security Hub CSPM"
    - id: b
      text: "Amazon Inspector"
    - id: c
      text: "Amazon Detective"
    - id: d
      text: "AWS Config"
answer: { optionId: c }
explanation:
  correct:
    en: |
      Amazon Detective builds a behavior graph from CloudTrail events, VPC Flow Logs and GuardDuty findings. It provides interactive visualizations of the resources and activity linked to a finding over time, so analysts can find the root cause without writing queries.
    fr: |
      Amazon Detective construit un graphe de comportement à partir des événements CloudTrail, des journaux de flux VPC et des résultats GuardDuty. Il fournit des visualisations interactives des ressources et des activités liées à un résultat dans le temps : les analystes trouvent la cause première sans écrire de requêtes.
  options:
    a:
      en: |
        Security Hub CSPM aggregates and prioritizes findings and runs posture checks, but it does not provide the investigation graph of related activity.
      fr: |
        Security Hub CSPM agrège et hiérarchise les résultats et effectue des vérifications de posture, mais ne fournit pas le graphe d'investigation des activités liées.
    b:
      en: |
        Inspector finds software vulnerabilities and network exposure; it does not investigate API or network activity.
      fr: |
        Inspector trouve des vulnérabilités logicielles et des expositions réseau ; il n'enquête pas sur l'activité des API ou du réseau.
    d:
      en: |
        AWS Config records configuration changes of resources, not API calls and network flows linked to a threat.
      fr: |
        AWS Config enregistre les changements de configuration des ressources, pas les appels d'API et les flux réseau liés à une menace.
references:
  - title: What is Amazon Detective?
    url: https://docs.aws.amazon.com/detective/latest/userguide/what-is-detective.html
