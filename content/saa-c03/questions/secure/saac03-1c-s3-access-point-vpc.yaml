id: saac03-1c-s3-access-point-vpc
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research institute stores shared genomics datasets in one Amazon S3 bucket used by 40 project teams. The bucket policy has become hard to manage and is close to its size limit. Each team needs its own permissions on its datasets, and some teams must be able to access their data only from a specific VPC. The institute wants to delegate access management per team without copying the data.

    Which solution will meet these requirements?
  fr: |
    Un institut de recherche stocke des jeux de données génomiques partagés dans un compartiment Amazon S3 utilisé par 40 équipes de projet. La politique du compartiment est devenue difficile à gérer et approche de sa taille maximale. Chaque équipe a besoin de ses propres autorisations sur ses jeux de données, et certaines équipes ne doivent pouvoir accéder à leurs données que depuis un VPC précis. L'institut veut déléguer la gestion des accès par équipe sans copier les données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Split the bucket policy into several smaller bucket policies, one for each team, and attach all of them to the same bucket."
        fr: "Diviser la politique du compartiment en plusieurs politiques de compartiment plus petites, une par équipe, et les attacher toutes au même compartiment."
    - id: b
      text:
        en: "Use S3 Same-Region Replication to copy each team's datasets to a dedicated bucket with its own bucket policy."
        fr: "Utiliser S3 Same-Region Replication pour copier les jeux de données de chaque équipe dans un compartiment dédié doté de sa propre politique."
    - id: c
      text:
        en: "Enable ACLs on the bucket and grant each team's IAM role access to its objects through object ACLs."
        fr: "Activer les ACL sur le compartiment et accorder au rôle IAM de chaque équipe l'accès à ses objets au moyen d'ACL d'objet."
    - id: d
      text:
        en: "Create an S3 access point per team with its own policy, and use a VPC network origin for the teams that need VPC-only access."
        fr: "Créer un point d'accès S3 par équipe avec sa propre politique, et utiliser une origine réseau VPC pour les équipes qui ont besoin d'un accès limité au VPC."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Access points are named network endpoints attached to a bucket, each with its own access point policy that works with the bucket policy. This spreads the permissions over many policies, and any access point can be configured to accept requests only from a VPC.
    fr: |
      Les points d'accès sont des points de terminaison réseau nommés attachés à un compartiment, chacun doté de sa propre politique de point d'accès qui fonctionne conjointement avec la politique du compartiment. Cela répartit les autorisations entre de nombreuses politiques, et chaque point d'accès peut être configuré pour n'accepter que des requêtes provenant d'un VPC.
  options:
    a:
      en: |
        A bucket has only one bucket policy, whose size is limited to 20 KB.
      fr: |
        Un compartiment n'a qu'une seule politique de compartiment, dont la taille est limitée à 20 Ko.
    b:
      en: |
        Replication copies the data, which the institute wants to avoid, and adds storage and replication costs.
      fr: |
        La réplication copie les données, ce que l'institut veut éviter, et ajoute des coûts de stockage et de réplication.
    c:
      en: |
        AWS recommends keeping ACLs disabled, and ACLs cannot restrict access to requests coming from a specific VPC.
      fr: |
        AWS recommande de laisser les ACL désactivées, et les ACL ne peuvent pas limiter l'accès aux requêtes provenant d'un VPC précis.
references:
  - title: Managing access to shared datasets with access points
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html
  - title: Managing access with S3 Access Grants
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-grants.html
