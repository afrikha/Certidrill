id: saac03-1b-s3-presigned-upload
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A mobile app lets users upload profile pictures. The backend runs on AWS Lambda behind Amazon API Gateway, and large images exceed the API's maximum payload size. The company wants the app to upload images directly to a private S3 bucket, without giving AWS credentials to the app users.

    Which solution will meet these requirements?
  fr: |
    Une application mobile permet aux utilisateurs de charger des photos de profil. Le backend s'exécute sur AWS Lambda derrière Amazon API Gateway, et les grandes images dépassent la taille de charge utile maximale de l'API. L'entreprise veut que l'application charge les images directement dans un compartiment S3 privé, sans donner d'informations d'identification AWS aux utilisateurs de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Have the Lambda function create an S3 presigned URL for a PUT request, and have the app upload the image with that URL.", fr: "Faire créer par la fonction Lambda une URL présignée S3 pour une requête PUT, et faire charger l'image par l'application avec cette URL." }
    - id: b
      text: { en: "Make the bucket publicly writable, and limit the allowed origins to the app's domain with a CORS configuration.", fr: "Rendre le compartiment accessible en écriture publique, et limiter les origines autorisées au domaine de l'application avec une configuration CORS." }
    - id: c
      text: { en: "Create an IAM user for the app, and embed the user's access keys in the app package.", fr: "Créer un utilisateur IAM pour l'application, et intégrer ses clés d'accès dans le package de l'application." }
    - id: d
      text: { en: "Enable S3 Transfer Acceleration on the bucket, and send unsigned upload requests to the accelerated endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment, et envoyer des requêtes de chargement non signées vers le point de terminaison accéléré." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A presigned URL lets someone upload an object without AWS credentials or permissions of their own. It is limited by the permissions of the principal that created it (here the function's role) and expires after a set time, so the bucket stays private.
    fr: |
      Une URL présignée permet de charger un objet sans posséder d'informations d'identification ni d'autorisations AWS. Elle est limitée par les autorisations du principal qui l'a créée (ici le rôle de la fonction) et expire après une durée définie : le compartiment reste privé.
  options:
    b:
      en: |
        A publicly writable bucket lets anyone upload anything; CORS only controls browser cross-origin requests and is not access control.
      fr: |
        Un compartiment accessible en écriture publique permet à n'importe qui de charger n'importe quoi ; CORS ne contrôle que les requêtes multi-origines des navigateurs et n'est pas un contrôle d'accès.
    c:
      en: |
        Access keys embedded in an app can be extracted by anyone who has the app.
      fr: |
        Des clés d'accès intégrées à une application peuvent être extraites par quiconque possède l'application.
    d:
      en: |
        Transfer Acceleration speeds up uploads but does not authorize them; unsigned requests to a private bucket are denied.
      fr: |
        Transfer Acceleration accélère les chargements mais ne les autorise pas ; les requêtes non signées vers un compartiment privé sont refusées.
references:
  - title: Uploading objects with presigned URLs
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/PresignedUrlUploadObject.html
