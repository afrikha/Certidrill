id: saac03-1c-s3-access-grants-directory
objective: "1.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company's employees sign in through IAM Identity Center, which is connected to the corporate directory. An internal application lets employees open files in Amazon S3. Access must be granted per S3 prefix based on the employees' directory groups, and auditors require that each AWS CloudTrail data event for Amazon S3 identify the individual employee on whose behalf the data was accessed. The company does not want to map each user to a separate IAM role.

    Which solution will meet these requirements?
  fr: |
    Les employés d'une entreprise de médias se connectent par IAM Identity Center, qui est relié à l'annuaire de l'entreprise. Une application interne permet aux employés d'ouvrir des fichiers dans Amazon S3. L'accès doit être accordé par préfixe S3 selon les groupes d'annuaire des employés, et les auditeurs exigent que chaque événement de données AWS CloudTrail pour Amazon S3 identifie l'employé pour le compte duquel les données ont été consultées. L'entreprise ne veut pas associer chaque utilisateur à un rôle IAM distinct.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create one IAM role for each directory group, and have the application assume the role that matches the user's group before it calls Amazon S3."
        fr: "Créer un rôle IAM par groupe d'annuaire, et faire endosser par l'application le rôle correspondant au groupe de l'utilisateur avant d'appeler Amazon S3."
    - id: b
      text:
        en: "Use S3 Access Grants with grants for directory groups on each prefix, integrated with IAM Identity Center trusted identity propagation."
        fr: "Utiliser S3 Access Grants avec des octrois aux groupes d'annuaire sur chaque préfixe, intégré à la propagation d'identité approuvée d'IAM Identity Center."
    - id: c
      text:
        en: "Create an S3 access point for each employee with an access point policy that allows the employee's prefixes."
        fr: "Créer un point d'accès S3 par employé avec une politique de point d'accès qui autorise les préfixes de l'employé."
    - id: d
      text:
        en: "Create an Amazon Cognito identity pool that maps directory groups to IAM roles with prefix-based policies."
        fr: "Créer un groupe d'identités Amazon Cognito qui associe les groupes d'annuaire à des rôles IAM dotés de politiques par préfixe."
answer: { optionId: b }
explanation:
  correct:
    en: |
      S3 Access Grants grants read, write or read-write access per prefix to IAM principals and directly to users or groups from a corporate directory. With IAM Identity Center trusted identity propagation, the application requests data on behalf of the authenticated user without mapping the user to an IAM principal, and each CloudTrail data event references the end user.
    fr: |
      S3 Access Grants accorde un accès en lecture, en écriture ou en lecture-écriture par préfixe à des principaux IAM et directement à des utilisateurs ou groupes d'un annuaire d'entreprise. Avec la propagation d'identité approuvée d'IAM Identity Center, l'application demande les données pour le compte de l'utilisateur authentifié sans l'associer à un principal IAM, et chaque événement de données CloudTrail fait référence à l'utilisateur final.
  options:
    a:
      en: |
        CloudTrail would record the group role session, not a reliable reference to the individual directory user, and the application must implement the group-to-role logic itself.
      fr: |
        CloudTrail enregistrerait la session du rôle de groupe et non une référence fiable à l'utilisateur d'annuaire individuel, et l'application devrait implémenter elle-même la logique d'association groupe-rôle.
    c:
      en: |
        One access point per employee does not scale, does not use directory groups, and clients need a way to discover the right access point.
      fr: |
        Un point d'accès par employé ne passe pas à l'échelle, n'utilise pas les groupes d'annuaire, et les clients ont besoin d'un moyen de découvrir le bon point d'accès.
    d:
      en: |
        Cognito identity pools target application end users; they still map users to IAM roles, which the company wants to avoid.
      fr: |
        Les groupes d'identités Cognito visent les utilisateurs finaux d'applications ; ils associent toujours les utilisateurs à des rôles IAM, ce que l'entreprise veut éviter.
references:
  - title: Managing access with S3 Access Grants
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-grants.html
