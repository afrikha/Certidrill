id: saac03-1d-object-lock-legal-hold
objective: "1.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores contracts in an Amazon S3 bucket that has S3 Object Lock enabled with no default retention. The legal department receives a litigation notice: about 2,000 specific contract versions must be protected from deletion and overwrite until the case is closed. Nobody knows how long the case will last, and the legal team must be able to release the protection as soon as the case ends.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des contrats dans un compartiment Amazon S3 dont S3 Object Lock est activé, sans conservation par défaut. Le service juridique reçoit un avis de litige : environ 2 000 versions de contrats précises doivent être protégées contre la suppression et le remplacement jusqu'à la clôture de l'affaire. Personne ne sait combien de temps durera l'affaire, et l'équipe juridique doit pouvoir lever la protection dès la fin de l'affaire.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Apply a retention period of 10 years in compliance mode to the contract versions.", fr: "Appliquer aux versions des contrats une période de conservation de 10 ans en mode conformité." }
    - id: b
      text: { en: "Apply a retention period of 1 year in governance mode to the contract versions and extend it each year.", fr: "Appliquer aux versions des contrats une période de conservation d'un an en mode gouvernance et la prolonger chaque année." }
    - id: c
      text: { en: "Enable MFA delete on the bucket so that deleting any object version requires multi-factor authentication.", fr: "Activer la suppression MFA sur le compartiment pour que la suppression de toute version d'objet exige une authentification multifacteur." }
    - id: d
      text: { en: "Place a legal hold on the contract versions and give the legal team the s3:PutObjectLegalHold permission.", fr: "Placer une conservation légale sur les versions des contrats et donner à l'équipe juridique l'autorisation s3:PutObjectLegalHold." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A legal hold protects an object version from deletion and overwrite like a retention period, but it has no expiration date. It stays in place until a user with the s3:PutObjectLegalHold permission removes it, which matches a case of unknown duration.
    fr: |
      Une conservation légale protège une version d'objet contre la suppression et le remplacement comme une période de conservation, mais elle n'a pas de date d'expiration. Elle reste en place jusqu'à ce qu'un utilisateur disposant de l'autorisation s3:PutObjectLegalHold la retire, ce qui correspond à une affaire de durée inconnue.
  options:
    a:
      en: |
        In compliance mode, the retention period cannot be shortened, so the legal team could not release the versions when the case closes.
      fr: |
        En mode conformité, la période de conservation ne peut pas être raccourcie : l'équipe juridique ne pourrait pas libérer les versions à la clôture de l'affaire.
    b:
      en: |
        A fixed period that must be extended every year adds manual work and risks lapsing if someone forgets; it does not model an open-ended hold.
      fr: |
        Une période fixe à prolonger chaque année ajoute du travail manuel et risque d'expirer en cas d'oubli ; elle ne modélise pas une conservation sans échéance.
    c:
      en: |
        MFA delete applies to the whole bucket rather than to specific versions, and the root user with its MFA device can still delete versions at any time.
      fr: |
        La suppression MFA s'applique à tout le compartiment et non à des versions précises, et l'utilisateur racine muni de son dispositif MFA peut toujours supprimer des versions à tout moment.
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
