id: saac03-1a-data-residency-region
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company in Germany is moving a customer database and its document archive to AWS. A regulation requires that customer data be stored only in Germany. The application must also remain available if one data center fails.

    Which solution will meet these requirements?
  fr: |
    Une compagnie d'assurance allemande migre une base de données clients et son archive de documents vers AWS. Une réglementation impose que les données des clients soient stockées uniquement en Allemagne. L'application doit aussi rester disponible en cas de panne d'un centre de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy the resources in the Europe (Frankfurt) Region across multiple Availability Zones and do not configure cross-Region replication.", fr: "Déployer les ressources dans la Région Europe (Francfort) sur plusieurs zones de disponibilité et ne configurer aucune réplication entre Régions." }
    - id: b
      text: { en: "Deploy the resources in the Europe (Ireland) Region across multiple Availability Zones and serve users in Germany through Amazon CloudFront.", fr: "Déployer les ressources dans la Région Europe (Irlande) sur plusieurs zones de disponibilité et servir les utilisateurs allemands via Amazon CloudFront." }
    - id: c
      text: { en: "Deploy the resources in a single Availability Zone of the Europe (Frankfurt) Region and replicate the data to the Europe (Paris) Region.", fr: "Déployer les ressources dans une seule zone de disponibilité de la Région Europe (Francfort) et répliquer les données dans la Région Europe (Paris)." }
    - id: d
      text: { en: "Store the data in Amazon CloudFront edge locations in Germany and run the application in any Region of the European Union.", fr: "Stocker les données dans des emplacements périphériques Amazon CloudFront en Allemagne et exécuter l'application dans n'importe quelle Région de l'Union européenne." }
answer: { optionId: a }
explanation:
  correct:
    en: "Each Region is isolated, and data created in a Region stays there unless the customer uses a replication or copy feature. Using the Frankfurt Region keeps the data in Germany, and spreading the resources across Availability Zones, which are physically separate data centers, protects against the failure of one of them."
    fr: "Chaque Région est isolée, et les données créées dans une Région y restent sauf si le client utilise une fonctionnalité de réplication ou de copie. La Région de Francfort garde les données en Allemagne, et répartir les ressources sur plusieurs zones de disponibilité, physiquement séparées, protège contre la panne de l'une d'elles."
  options:
    b:
      en: "The Ireland Region is outside Germany, so the data would not stay in Germany; CloudFront does not change where the origin data is stored."
      fr: "La Région Irlande est hors d'Allemagne : les données n'y resteraient pas ; CloudFront ne change pas le lieu de stockage des données d'origine."
    c:
      en: "Replicating to Paris moves data out of Germany, and a single Availability Zone does not survive the failure of that zone's data center."
      fr: "Répliquer vers Paris fait sortir les données d'Allemagne, et une seule zone de disponibilité ne survit pas à la panne de son centre de données."
    d:
      en: "Edge locations cache content for delivery; they are not a storage location for a database or an archive."
      fr: "Les emplacements périphériques mettent en cache du contenu pour sa diffusion ; ce ne sont pas des lieux de stockage pour une base de données ou une archive."
references:
  - title: Regions
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/regions.html
