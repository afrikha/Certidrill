id: saac03-1c-private-ip-vpn-dx
objective: "1.2.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank connects its data center to AWS through AWS Direct Connect. Compliance now requires IPsec encryption for all traffic between the data center and its VPCs. The security team does not allow a public virtual interface, because it would open access between the data center and all AWS public services, and the IPsec tunnel endpoints must use private IP addresses only. The VPCs are attached to a transit gateway.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une banque relie son centre de données à AWS par AWS Direct Connect. La conformité exige désormais un chiffrement IPsec pour tout le trafic entre le centre de données et ses VPC. L'équipe de sécurité n'autorise pas d'interface virtuelle publique, car elle ouvrirait l'accès entre le centre de données et tous les services publics AWS, et les extrémités des tunnels IPsec ne doivent utiliser que des adresses IP privées. Les VPC sont attachés à une passerelle de transit.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create a transit VIF to a Direct Connect gateway associated with the transit gateway, with the transit gateway CIDR in the allowed prefixes."
        fr: "Créer une interface virtuelle de transit vers une passerelle Direct Connect associée à la passerelle de transit, avec le CIDR de la passerelle de transit dans les préfixes autorisés."
    - id: b
      text:
        en: "Create a public virtual interface and a Site-to-Site VPN connection that terminates on the public tunnel endpoints of the transit gateway."
        fr: "Créer une interface virtuelle publique et une connexion Site-to-Site VPN qui se termine sur les extrémités publiques des tunnels de la passerelle de transit."
    - id: c
      text:
        en: "Create a Site-to-Site VPN attachment on the transit gateway that uses private IP addresses and the Direct Connect gateway attachment as its transport."
        fr: "Créer sur la passerelle de transit un attachement Site-to-Site VPN qui utilise des adresses IP privées et l'attachement de la passerelle Direct Connect comme transport."
    - id: d
      text:
        en: "Enable MACsec on the existing hosted connection to encrypt traffic end to end between the data center and the VPCs."
        fr: "Activer MACsec sur la connexion hébergée existante pour chiffrer le trafic de bout en bout entre le centre de données et les VPC."
    - id: e
      text:
        en: "Create an accelerated Site-to-Site VPN connection on the transit gateway and route it over the Direct Connect connection."
        fr: "Créer une connexion Site-to-Site VPN accélérée sur la passerelle de transit et la faire passer par la connexion Direct Connect."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      Private IP Site-to-Site VPN runs IPsec over a Direct Connect transit virtual interface, without public IP addresses. The transit VIF connects to a Direct Connect gateway associated with the transit gateway, whose private IP CIDR is in the allowed prefixes. The VPN attachment on the transit gateway uses private IP addresses on both tunnel ends and the Direct Connect gateway attachment as transport.
    fr: |
      Le VPN Site-to-Site à IP privées fait passer IPsec sur une interface virtuelle de transit Direct Connect, sans adresses IP publiques. L'interface virtuelle de transit se connecte à une passerelle Direct Connect associée à la passerelle de transit, dont le CIDR IP privé figure dans les préfixes autorisés. L'attachement VPN de la passerelle de transit utilise des adresses IP privées aux deux extrémités des tunnels et l'attachement de la passerelle Direct Connect comme transport.
  options:
    b:
      en: |
        A public virtual interface and public tunnel endpoints are exactly what the security team forbids.
      fr: |
        Une interface virtuelle publique et des extrémités de tunnel publiques sont précisément ce que l'équipe de sécurité interdit.
    d:
      en: |
        MACsec is not supported on hosted connections, and it encrypts only the link to the Direct Connect location, not end to end and not with IPsec.
      fr: |
        MACsec n'est pas pris en charge sur les connexions hébergées, et il ne chiffre que la liaison jusqu'à l'emplacement Direct Connect, pas de bout en bout ni avec IPsec.
    e:
      en: |
        Accelerated VPN sends the tunnels to the nearest AWS edge location through AWS Global Accelerator, uses public tunnel endpoints and cannot be used with a Direct Connect public virtual interface; it does not provide private IP tunnels over Direct Connect.
      fr: |
        Le VPN accéléré envoie les tunnels vers l'emplacement périphérique AWS le plus proche par AWS Global Accelerator, utilise des extrémités de tunnel publiques et ne peut pas être utilisé avec une interface virtuelle publique Direct Connect ; il ne fournit pas de tunnels à IP privées sur Direct Connect.
references:
  - title: Private IP AWS Site-to-Site VPN with Direct Connect
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/private-ip-dx.html
