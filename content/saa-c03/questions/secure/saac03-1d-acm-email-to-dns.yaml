id: saac03-1d-acm-email-to-dns
objective: "1.3.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a public AWS Certificate Manager (ACM) certificate on the HTTPS listener of an Application Load Balancer. The certificate was issued with email validation. Last year, the renewal email went to a former employee and the certificate almost expired. The company's domain is hosted in Amazon Route 53.

    The company wants future renewals to happen without any human action.

    Which solution will meet this requirement?
  fr: |
    Une entreprise utilise un certificat public AWS Certificate Manager (ACM) sur l'écouteur HTTPS d'un Application Load Balancer. Le certificat a été émis avec une validation par e-mail. L'an dernier, l'e-mail de renouvellement est parvenu à un ancien employé et le certificat a failli expirer. Le domaine de l'entreprise est hébergé dans Amazon Route 53.

    L'entreprise souhaite que les futurs renouvellements se fassent sans aucune intervention humaine.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Export the certificate from ACM, then reimport it into ACM every year after renewing it with the certificate authority.", fr: "Exporter le certificat depuis ACM, puis le réimporter dans ACM chaque année après l'avoir renouvelé auprès de l'autorité de certification." }
    - id: b
      text: { en: "Request a new public ACM certificate with DNS validation, add its CNAME records in Route 53, and use it on the listener.", fr: "Demander un nouveau certificat ACM public avec validation DNS, ajouter ses enregistrements CNAME dans Route 53 et l'utiliser sur l'écouteur." }
    - id: c
      text: { en: "Create an Amazon CloudWatch alarm on the DaysToExpiry metric of the certificate that notifies the security team.", fr: "Créer une alarme Amazon CloudWatch sur la métrique DaysToExpiry du certificat qui avertit l'équipe de sécurité." }
    - id: d
      text: { en: "Request a private certificate from an AWS Private CA in ACM and replace the certificate on the listener.", fr: "Demander dans ACM un certificat privé émis par une autorité AWS Private CA et remplacer le certificat sur l'écouteur." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      ACM renews DNS-validated certificates automatically while the certificate is in use and the ACM CNAME records stay in public DNS. Email-validated certificates need the domain owner to approve each renewal, and ACM is deprecating email validation for public certificates during 2027.
    fr: |
      ACM renouvelle automatiquement les certificats validés par DNS tant que le certificat est utilisé et que les enregistrements CNAME d'ACM restent dans le DNS public. Les certificats validés par e-mail exigent que le propriétaire du domaine approuve chaque renouvellement, et ACM abandonne progressivement la validation par e-mail des certificats publics au cours de 2027.
  options:
    a:
      en: |
        Imported certificates are never renewed by ACM; reimporting every year is exactly the manual work the company wants to avoid.
      fr: |
        ACM ne renouvelle jamais les certificats importés ; les réimporter chaque année est précisément le travail manuel que l'entreprise veut éviter.
    c:
      en: |
        An alarm warns the team before expiry but someone must still act to renew the certificate.
      fr: |
        Une alarme avertit l'équipe avant l'expiration, mais quelqu'un doit toujours agir pour renouveler le certificat.
    d:
      en: |
        A private certificate is not trusted by public browsers, so the website would show certificate errors.
      fr: |
        Un certificat privé n'est pas approuvé par les navigateurs publics : le site web afficherait des erreurs de certificat.
references:
  - title: Renewal for domains validated by DNS
    url: https://docs.aws.amazon.com/acm/latest/userguide/dns-renewal-validation.html
  - title: Renewal for email-validated domains
    url: https://docs.aws.amazon.com/acm/latest/userguide/email-renewal-validation.html
