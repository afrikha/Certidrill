id: saac03-1a-vpc-sharing-ou
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company uses AWS Organizations. A networking account owns a VPC with subnets, route tables and network ACLs that the network team manages. Application teams in an organizational unit (OU) each have their own account and must launch Amazon EC2 instances into these centrally managed subnets. The instances must be owned by and billed to each application account, and the company wants to keep the number of VPCs to a minimum.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias utilise AWS Organizations. Un compte réseau possède un VPC avec des sous-réseaux, des tables de routage et des ACL réseau gérés par l'équipe réseau. Les équipes applicatives d'une unité d'organisation (UO) disposent chacune de leur propre compte et doivent lancer des instances Amazon EC2 dans ces sous-réseaux gérés de manière centralisée. Les instances doivent appartenir à chaque compte applicatif et lui être facturées, et l'entreprise veut limiter le nombre de VPC au minimum.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a VPC in each application account and connect each VPC to the networking VPC with VPC peering.", fr: "Créer un VPC dans chaque compte applicatif et relier chaque VPC au VPC réseau par peering de VPC." }
    - id: b
      text: { en: "Share the subnets with the OU by using AWS Resource Access Manager (AWS RAM) with sharing enabled for AWS Organizations.", fr: "Partager les sous-réseaux avec l'UO à l'aide d'AWS Resource Access Manager (AWS RAM), avec le partage activé pour AWS Organizations." }
    - id: c
      text: { en: "Create a VPC in each application account and attach every VPC to a transit gateway in the networking account.", fr: "Créer un VPC dans chaque compte applicatif et attacher chaque VPC à une passerelle de transit (transit gateway) du compte réseau." }
    - id: d
      text: { en: "Create an IAM role in the networking account that application teams assume to launch their instances in the networking VPC.", fr: "Créer dans le compte réseau un rôle IAM que les équipes applicatives endossent pour lancer leurs instances dans le VPC réseau." }
answer: { optionId: b }
explanation:
  correct:
    en: "VPC sharing lets the VPC owner share subnets through AWS RAM with accounts of the same organization, here a whole OU. Participants launch their own resources, which they own and pay for, into the shared subnets, while the owner keeps control of the VPC network configuration. Only one VPC is needed."
    fr: "Le partage de VPC permet au propriétaire du VPC de partager des sous-réseaux via AWS RAM avec des comptes de la même organisation, ici une UO entière. Les participants lancent dans les sous-réseaux partagés leurs propres ressources, dont ils sont propriétaires et qu'ils paient, tandis que le propriétaire garde le contrôle de la configuration réseau du VPC. Un seul VPC suffit."
  options:
    a:
      en: "Peering adds one VPC per application account, which fails the requirement to minimize the number of VPCs, and the instances would not be in the central subnets."
      fr: "Le peering ajoute un VPC par compte applicatif, ce qui ne respecte pas l'exigence de limiter le nombre de VPC, et les instances ne seraient pas dans les sous-réseaux centraux."
    c:
      en: "A transit gateway connects many VPCs, but each application account still needs its own VPC, and the instances are not launched into the centrally managed subnets."
      fr: "Une passerelle de transit relie de nombreux VPC, mais chaque compte applicatif a toujours besoin de son propre VPC, et les instances ne sont pas lancées dans les sous-réseaux gérés de manière centralisée."
    d:
      en: "Instances launched with a role in the networking account belong to and are billed to the networking account, not to the application accounts."
      fr: "Les instances lancées avec un rôle du compte réseau appartiennent au compte réseau et lui sont facturées, pas aux comptes applicatifs."
references:
  - title: Share your VPC subnets with other accounts
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html
  - title: What is AWS Resource Access Manager?
    url: https://docs.aws.amazon.com/ram/latest/userguide/what-is.html
