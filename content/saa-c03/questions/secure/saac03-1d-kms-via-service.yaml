id: saac03-1d-kms-via-service
objective: "1.3.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores confidential reports in an Amazon S3 bucket encrypted with SSE-KMS and a customer managed key in the us-west-2 Region. A reporting IAM role needs to read the objects through Amazon S3. The security team wants to make sure that the role cannot call AWS KMS Decrypt directly with the key, for example on ciphertext copied out of another system, and can use the key only when S3 makes the request on its behalf.

    Which key policy change will meet these requirements?
  fr: |
    Une entreprise stocke des rapports confidentiels dans un compartiment Amazon S3 chiffré en SSE-KMS avec une clé gérée par le client dans la Région us-west-2. Un rôle IAM de reporting doit lire les objets via Amazon S3. L'équipe de sécurité veut s'assurer que le rôle ne peut pas appeler directement Decrypt d'AWS KMS avec la clé, par exemple sur un texte chiffré copié depuis un autre système, et qu'il ne peut utiliser la clé que lorsque S3 fait la requête en son nom.

    Quelle modification de la politique de clé permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Allow kms:Decrypt to the role only with a condition that kms:ViaService equals s3.us-west-2.amazonaws.com.", fr: "Autoriser kms:Decrypt au rôle uniquement avec une condition selon laquelle kms:ViaService est égal à s3.us-west-2.amazonaws.com." }
    - id: b
      text: { en: "Allow kms:Decrypt to the role only with a condition that kms:CallerAccount equals the company's account ID.", fr: "Autoriser kms:Decrypt au rôle uniquement avec une condition selon laquelle kms:CallerAccount est égal à l'ID du compte de l'entreprise." }
    - id: c
      text: { en: "Allow kms:Decrypt to the role only with a condition that aws:SourceIp matches the CIDR block of the company's VPC.", fr: "Autoriser kms:Decrypt au rôle uniquement avec une condition selon laquelle aws:SourceIp correspond au bloc CIDR du VPC de l'entreprise." }
    - id: d
      text: { en: "Allow kms:Decrypt to the role only with a condition that kms:GrantIsForAWSResource is true.", fr: "Autoriser kms:Decrypt au rôle uniquement avec une condition selon laquelle kms:GrantIsForAWSResource a la valeur true." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The `kms:ViaService` condition key limits use of the key to requests that an integrated AWS service makes on behalf of the principal. With the value `s3.us-west-2.amazonaws.com`, the role can decrypt objects through S3 but a direct Decrypt call from the role is denied.
    fr: |
      La clé de condition `kms:ViaService` limite l'utilisation de la clé aux requêtes qu'un service AWS intégré fait pour le compte du principal. Avec la valeur `s3.us-west-2.amazonaws.com`, le rôle peut déchiffrer les objets via S3, mais un appel Decrypt direct du rôle est refusé.
  options:
    b:
      en: |
        kms:CallerAccount matches every identity in the account, including direct Decrypt calls by the role.
      fr: |
        kms:CallerAccount correspond à toutes les identités du compte, y compris aux appels Decrypt directs du rôle.
    c:
      en: |
        A source IP condition does not distinguish a direct Decrypt call made by the role from the VPC from a request that S3 makes on the role's behalf.
      fr: |
        Une condition sur l'adresse IP source ne distingue pas un appel Decrypt direct du rôle depuis le VPC d'une requête que S3 fait pour le compte du rôle.
    d:
      en: |
        kms:GrantIsForAWSResource applies only to the grant operations (CreateGrant, ListGrants, RevokeGrant), not to Decrypt.
      fr: |
        kms:GrantIsForAWSResource ne s'applique qu'aux opérations d'octroi (CreateGrant, ListGrants, RevokeGrant), pas à Decrypt.
references:
  - title: AWS KMS condition keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/conditions-kms.html
