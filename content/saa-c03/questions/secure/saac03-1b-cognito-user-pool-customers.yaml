id: saac03-1b-cognito-user-pool-customers
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building a customer-facing web application. Customers must be able to sign up with an email address, sign in with a password or with their Google account, and use multi-factor authentication (MFA). The application must receive standard tokens that identify the signed-in user. The company does not want to build or operate its own user directory.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe une application web destinée à ses clients. Les clients doivent pouvoir s'inscrire avec une adresse e-mail, se connecter avec un mot de passe ou avec leur compte Google, et utiliser l'authentification multifacteur (MFA). L'application doit recevoir des jetons standard qui identifient l'utilisateur connecté. L'entreprise ne veut pas créer ni exploiter son propre annuaire d'utilisateurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM user for each customer, and require MFA for every customer through an IAM policy.", fr: "Créer un utilisateur IAM pour chaque client, et exiger la MFA de chaque client par une politique IAM." }
    - id: b
      text: { en: "Use IAM Identity Center with Google as the external identity provider and MFA enabled.", fr: "Utiliser IAM Identity Center avec Google comme fournisseur d'identité externe et la MFA activée." }
    - id: c
      text: { en: "Use an Amazon Cognito identity pool that allows unauthenticated (guest) access to the application.", fr: "Utiliser un pool d'identités Amazon Cognito qui autorise l'accès non authentifié (invité) à l'application." }
    - id: d
      text: { en: "Use an Amazon Cognito user pool with Google as a federated identity provider and MFA enabled.", fr: "Utiliser un groupe d'utilisateurs Amazon Cognito avec Google comme fournisseur d'identité fédéré et la MFA activée." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Cognito user pool is a managed user directory and OIDC identity provider for applications. It supports sign-up and sign-in, social providers such as Google, SAML and OIDC federation, and MFA, and it issues ID and access tokens to the application.
    fr: |
      Un groupe d'utilisateurs Cognito est un annuaire d'utilisateurs géré et un fournisseur d'identité OIDC pour les applications. Il prend en charge l'inscription et la connexion, des fournisseurs sociaux comme Google, la fédération SAML et OIDC, ainsi que la MFA, et il émet des jetons d'ID et d'accès à l'application.
  options:
    a:
      en: |
        IAM users are for access to AWS, not for application customers, and they would have to be managed one by one.
      fr: |
        Les utilisateurs IAM servent à accéder à AWS, pas aux clients d'une application, et ils devraient être gérés un par un.
    b:
      en: |
        IAM Identity Center manages workforce access to AWS accounts and applications, not customer sign-up for a web application.
      fr: |
        IAM Identity Center gère l'accès des collaborateurs aux comptes et applications AWS, pas l'inscription des clients d'une application web.
    c:
      en: |
        An identity pool issues AWS credentials; it does not provide sign-up, password sign-in or MFA, and unauthenticated access identifies no user.
      fr: |
        Un pool d'identités émet des informations d'identification AWS ; il ne fournit ni inscription, ni connexion par mot de passe, ni MFA, et l'accès non authentifié n'identifie aucun utilisateur.
references:
  - title: Authenticating users with Amazon Cognito user pools
    url: https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-pools.html
