id: saac03-1c-object-lock-compliance-worm
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A brokerage firm must store trade confirmations in Amazon S3 in a write-once-read-many (WORM) format for 7 years. Regulators require that no user, including the root user of the AWS account, can overwrite or delete a confirmation or shorten its retention during those 7 years.

    Which solution will meet these requirements?
  fr: |
    Une société de courtage doit stocker des confirmations d'opérations dans Amazon S3 dans un format WORM (écriture unique, lectures multiples) pendant 7 ans. Les autorités de régulation exigent qu'aucun utilisateur, y compris l'utilisateur racine du compte AWS, ne puisse écraser ou supprimer une confirmation ni raccourcir sa conservation pendant ces 7 ans.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable S3 Object Lock on the bucket with a default retention of 7 years in governance mode."
        fr: "Activer S3 Object Lock sur le compartiment avec une conservation par défaut de 7 ans en mode gouvernance."
    - id: b
      text:
        en: "Enable S3 Versioning with MFA delete on the bucket, and add a lifecycle rule that expires objects after 7 years."
        fr: "Activer S3 Versioning avec MFA delete sur le compartiment, et ajouter une règle de cycle de vie qui fait expirer les objets après 7 ans."
    - id: c
      text:
        en: "Enable S3 Object Lock on the bucket and place a legal hold on each confirmation when it is uploaded."
        fr: "Activer S3 Object Lock sur le compartiment et placer une conservation légale (legal hold) sur chaque confirmation lors de son chargement."
    - id: d
      text:
        en: "Enable S3 Object Lock on the bucket with a default retention of 7 years in compliance mode."
        fr: "Activer S3 Object Lock sur le compartiment avec une conservation par défaut de 7 ans en mode conformité."
answer: { optionId: d }
explanation:
  correct:
    en: |
      S3 Object Lock stores objects in a WORM model and has been assessed for SEC 17a-4, CFTC and FINRA requirements. In compliance mode, no user, including the root user, can overwrite or delete a protected object version, change its mode or shorten its retention until the retain-until date.
    fr: |
      S3 Object Lock stocke les objets selon un modèle WORM et a été évalué au regard des exigences SEC 17a-4, CFTC et FINRA. En mode conformité, aucun utilisateur, y compris l'utilisateur racine, ne peut écraser ou supprimer une version d'objet protégée, modifier son mode ou raccourcir sa conservation avant la date de fin de conservation.
  options:
    a:
      en: |
        In governance mode, users with the s3:BypassGovernanceRetention permission can delete objects or change their retention.
      fr: |
        En mode gouvernance, les utilisateurs disposant de l'autorisation s3:BypassGovernanceRetention peuvent supprimer des objets ou modifier leur conservation.
    b:
      en: |
        MFA delete adds a factor for permanent deletes but does not prevent the root user from deleting, and it cannot be used with lifecycle configurations.
      fr: |
        MFA delete ajoute un facteur pour les suppressions définitives mais n'empêche pas l'utilisateur racine de supprimer, et il ne peut pas être utilisé avec des configurations de cycle de vie.
    c:
      en: |
        A legal hold has no expiration and can be removed by any user with the s3:PutObjectLegalHold permission, so it does not enforce a fixed 7-year retention.
      fr: |
        Une conservation légale n'a pas d'expiration et peut être retirée par tout utilisateur disposant de l'autorisation s3:PutObjectLegalHold : elle n'impose pas une conservation fixe de 7 ans.
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
  - title: Configuring MFA delete
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/MultiFactorAuthenticationDelete.html
