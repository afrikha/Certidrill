id: saac03-1c-public-subnet-definition
objective: "1.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A solutions architect is reviewing a VPC that has four subnets. The architect must identify which subnets are public subnets so that the team can confirm that no database is deployed in them.

    Which characteristic makes a subnet a public subnet?
  fr: |
    Un architecte de solutions examine un VPC qui contient quatre sous-réseaux. L'architecte doit identifier les sous-réseaux publics afin que l'équipe puisse confirmer qu'aucune base de données n'y est déployée.

    Quelle caractéristique fait d'un sous-réseau un sous-réseau public ?
body:
  options:
    - id: a
      text:
        en: "The subnet's network ACL allows all inbound and outbound traffic from 0.0.0.0/0."
        fr: "L'ACL réseau du sous-réseau autorise tout le trafic entrant et sortant depuis et vers 0.0.0.0/0."
    - id: b
      text:
        en: "The route table associated with the subnet has a route to a NAT gateway."
        fr: "La table de routage associée au sous-réseau a une route vers une passerelle NAT."
    - id: c
      text:
        en: "The route table associated with the subnet has a direct route to an internet gateway."
        fr: "La table de routage associée au sous-réseau a une route directe vers une passerelle Internet."
    - id: d
      text:
        en: "The subnet has a route to a Site-to-Site VPN connection through a virtual private gateway."
        fr: "Le sous-réseau a une route vers une connexion Site-to-Site VPN par l'intermédiaire d'une passerelle réseau privé virtuel."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A public subnet is defined by its routing: its route table has a direct route to an internet gateway, so resources with public IP addresses in it can access the internet and be reached from it.
    fr: |
      Un sous-réseau public est défini par son routage : sa table de routage a une route directe vers une passerelle Internet, de sorte que les ressources qui y ont une adresse IP publique peuvent accéder à Internet et être jointes depuis Internet.
  options:
    a:
      en: |
        Network ACL rules filter traffic but do not provide a path to the internet; a subnet without an internet gateway route stays private whatever its network ACL allows.
      fr: |
        Les règles d'ACL réseau filtrent le trafic mais ne fournissent pas de chemin vers Internet ; un sous-réseau sans route vers une passerelle Internet reste privé, quoi qu'autorise son ACL réseau.
    b:
      en: |
        A route to a NAT gateway is the typical setup of a private subnet that needs outbound-only internet access.
      fr: |
        Une route vers une passerelle NAT est la configuration typique d'un sous-réseau privé qui a besoin d'un accès Internet en sortie uniquement.
    d:
      en: |
        A route to a Site-to-Site VPN connection without an internet gateway route defines a VPN-only subnet.
      fr: |
        Une route vers une connexion Site-to-Site VPN sans route vers une passerelle Internet définit un sous-réseau réservé au VPN.
references:
  - title: Subnets for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
