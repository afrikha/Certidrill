id: saac03-1a-srm-fargate-shift
objective: "1.1.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs containerized microservices on Amazon ECS with the EC2 launch type. The operations team patches the container instances and manages the Auto Scaling group that provides cluster capacity. The company plans to move the services to AWS Fargate.

    Which responsibilities will move from the company to AWS after the migration? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute des microservices conteneurisés sur Amazon ECS avec le type de lancement EC2. L'équipe d'exploitation applique les correctifs aux instances de conteneur et gère le groupe Auto Scaling qui fournit la capacité du cluster. L'entreprise prévoit de migrer les services vers AWS Fargate.

    Quelles responsabilités passeront de l'entreprise à AWS après la migration ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Patching the operating system and kernel of the hosts that run the tasks.", fr: "Appliquer les correctifs au système d'exploitation et au noyau des hôtes qui exécutent les tâches." } }
    - { id: b, text: { en: "Updating the operating system packages inside the container images.", fr: "Mettre à jour les paquets du système d'exploitation à l'intérieur des images de conteneur." } }
    - { id: c, text: { en: "Defining least-privilege IAM task roles for each of the services.", fr: "Définir des rôles de tâche IAM de moindre privilège pour chacun des services." } }
    - { id: d, text: { en: "Provisioning and scaling the cluster of virtual machines that run the containers.", fr: "Provisionner et mettre à l'échelle le cluster de machines virtuelles qui exécutent les conteneurs." } }
    - { id: e, text: { en: "Configuring the security groups that are attached to the tasks.", fr: "Configurer les groupes de sécurité qui sont attachés aux tâches." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "With Fargate, the company no longer provisions, configures or scales clusters of virtual machines. AWS also patches the Fargate platform: kernel and operating system updates ship as new platform version revisions, and new tasks always start on the latest patched revision."
    fr: "Avec Fargate, l'entreprise ne provisionne, ne configure et ne met plus à l'échelle de clusters de machines virtuelles. AWS corrige aussi la plateforme Fargate : les mises à jour du noyau et du système d'exploitation sont livrées dans de nouvelles révisions de version de plateforme, et les nouvelles tâches démarrent toujours sur la dernière révision corrigée."
  options:
    b:
      en: "The contents of container images, including their OS packages, remain the customer's responsibility with Fargate."
      fr: "Le contenu des images de conteneur, y compris leurs paquets système, reste de la responsabilité du client avec Fargate."
    c:
      en: "IAM task roles and their permissions are still defined by the customer."
      fr: "Les rôles de tâche IAM et leurs autorisations sont toujours définis par le client."
    e:
      en: "Network access controls such as the security groups of the tasks are still configured by the customer."
      fr: "Les contrôles d'accès réseau comme les groupes de sécurité des tâches sont toujours configurés par le client."
references:
  - title: Architect for AWS Fargate for Amazon ECS
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
