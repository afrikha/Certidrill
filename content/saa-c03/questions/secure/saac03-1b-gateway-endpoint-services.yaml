id: saac03-1b-gateway-endpoint-services
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company wants workloads in private subnets to reach AWS services without a NAT gateway. To avoid hourly endpoint charges, the company plans to use gateway VPC endpoints wherever they are available, and interface endpoints only for the other services.

    Which AWS services support gateway VPC endpoints? (Choose two.)
  fr: |
    Une entreprise veut que les charges de travail de ses sous-réseaux privés joignent des services AWS sans passerelle NAT. Pour éviter les frais horaires de points de terminaison, elle prévoit d'utiliser des points de terminaison de VPC de passerelle partout où ils existent, et des points de terminaison d'interface seulement pour les autres services.

    Quels services AWS prennent en charge les points de terminaison de VPC de passerelle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Amazon S3" }
    - { id: b, text: "Amazon SQS" }
    - { id: c, text: "AWS Secrets Manager" }
    - { id: d, text: "Amazon DynamoDB" }
    - { id: e, text: "Amazon Elastic Container Registry (Amazon ECR)" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB. They do not use AWS PrivateLink, they work by adding a prefix list route to the selected route tables, and they have no additional charge.
    fr: |
      Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB. Ils n'utilisent pas AWS PrivateLink, fonctionnent en ajoutant une route vers une liste de préfixes dans les tables de routage sélectionnées, et n'entraînent aucun coût supplémentaire.
  options:
    b:
      en: |
        Amazon SQS is reached privately through an interface endpoint (AWS PrivateLink).
      fr: |
        Amazon SQS est joint de manière privée par un point de terminaison d'interface (AWS PrivateLink).
    c:
      en: |
        Secrets Manager supports interface endpoints only.
      fr: |
        Secrets Manager ne prend en charge que les points de terminaison d'interface.
    e:
      en: |
        Amazon ECR uses interface endpoints; it also needs the S3 gateway endpoint for image layers, but ECR itself has no gateway endpoint.
      fr: |
        Amazon ECR utilise des points de terminaison d'interface ; il a aussi besoin du point de terminaison de passerelle S3 pour les couches d'image, mais ECR lui-même n'a pas de point de terminaison de passerelle.
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
