id: saac03-1b-cloudfront-oac
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company serves static images from an S3 bucket through an Amazon CloudFront distribution. Users can also download the images directly from the bucket's S3 URLs, which bypasses CloudFront. The company wants users to access the images only through CloudFront, and the bucket must stay private.

    Which solution will meet these requirements?
  fr: |
    Une entreprise diffuse des images statiques depuis un compartiment S3 par une distribution Amazon CloudFront. Les utilisateurs peuvent aussi télécharger les images directement depuis les URL S3 du compartiment, ce qui contourne CloudFront. L'entreprise veut que les utilisateurs accèdent aux images uniquement par CloudFront, et le compartiment doit rester privé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 static website hosting, and configure the website endpoint as a custom origin of the distribution.", fr: "Activer l'hébergement de site web statique S3, et configurer le point de terminaison du site web comme origine personnalisée de la distribution." }
    - id: b
      text: { en: "Add a bucket policy that allows s3:GetObject from the published CloudFront IP address ranges.", fr: "Ajouter une politique de compartiment qui autorise s3:GetObject depuis les plages d'adresses IP publiées de CloudFront." }
    - id: c
      text: { en: "Configure origin access control (OAC) on the distribution, and allow only that distribution in the bucket policy.", fr: "Configurer un contrôle d'accès d'origine (OAC) sur la distribution, et n'autoriser que cette distribution dans la politique de compartiment." }
    - id: d
      text: { en: "Turn on S3 Transfer Acceleration, and remove public access from the bucket.", fr: "Activer S3 Transfer Acceleration, et supprimer l'accès public au compartiment." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With origin access control, CloudFront signs its requests to S3. The bucket policy allows the cloudfront.amazonaws.com service principal with an AWS:SourceArn condition set to the distribution ARN, so only that distribution can read the objects and direct S3 requests are denied. AWS recommends OAC over the legacy origin access identity.
    fr: |
      Avec le contrôle d'accès d'origine, CloudFront signe ses requêtes vers S3. La politique de compartiment autorise le principal de service cloudfront.amazonaws.com avec une condition AWS:SourceArn égale à l'ARN de la distribution : seule cette distribution peut lire les objets, et les requêtes S3 directes sont refusées. AWS recommande OAC plutôt que l'ancienne identité d'accès d'origine (OAI).
  options:
    a:
      en: |
        A website endpoint must be publicly readable, and website endpoints cannot use OAC.
      fr: |
        Un point de terminaison de site web doit être lisible publiquement, et les points de terminaison de site web ne peuvent pas utiliser OAC.
    b:
      en: |
        IP ranges would let any CloudFront distribution, including other customers' distributions, read the bucket, and the ranges change over time.
      fr: |
        Des plages IP permettraient à n'importe quelle distribution CloudFront, y compris celles d'autres clients, de lire le compartiment, et ces plages changent avec le temps.
    d:
      en: |
        Transfer Acceleration speeds up transfers to S3; it does not give CloudFront private access to the bucket.
      fr: |
        Transfer Acceleration accélère les transferts vers S3 ; il ne donne pas à CloudFront un accès privé au compartiment.
references:
  - title: Restrict access to an Amazon S3 origin
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html
