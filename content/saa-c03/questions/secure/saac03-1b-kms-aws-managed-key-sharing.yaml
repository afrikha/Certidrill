id: saac03-1b-kms-aws-managed-key-sharing
objective: "1.1.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores exported data in an S3 bucket in its production account. The objects are encrypted with SSE-KMS by using the AWS managed key aws/s3. An analytics team in another AWS account has been granted s3:GetObject on the bucket through the bucket policy and through an IAM policy in its own account, but every download fails with an access denied error. The objects must remain encrypted with SSE-KMS.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des données exportées dans un compartiment S3 de son compte de production. Les objets sont chiffrés avec SSE-KMS à l'aide de la clé gérée par AWS aws/s3. Une équipe d'analyse d'un autre compte AWS a reçu s3:GetObject sur le compartiment par la politique de compartiment et par une politique IAM de son propre compte, mais chaque téléchargement échoue avec une erreur d'accès refusé. Les objets doivent rester chiffrés avec SSE-KMS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Edit the key policy of the aws/s3 key to allow kms:Decrypt for the analytics team's IAM role in the other account.", fr: "Modifier la politique de clé de la clé aws/s3 pour autoriser kms:Decrypt au rôle IAM de l'équipe d'analyse dans l'autre compte." }
    - id: b
      text: { en: "Re-encrypt the objects with a customer managed key, and allow the analytics role to use the key in both policies.", fr: "Rechiffrer les objets avec une clé gérée par le client, et autoriser le rôle d'analyse à utiliser la clé dans les deux politiques." }
    - id: c
      text: { en: "Add kms:Decrypt on the aws/s3 key ARN to the IAM policy of the analytics team's role in its own account.", fr: "Ajouter kms:Decrypt sur l'ARN de la clé aws/s3 à la politique IAM du rôle de l'équipe d'analyse, dans son propre compte." }
    - id: d
      text: { en: "Change the bucket's default encryption to SSE-S3 for new objects and keep the existing objects unchanged.", fr: "Passer le chiffrement par défaut du compartiment à SSE-S3 pour les nouveaux objets et laisser les objets existants inchangés." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Resources encrypted under an AWS managed key cannot be shared with other accounts, because the key policy of an AWS managed key is controlled by the service and cannot be changed. A customer managed key lets the company add the external role to the key policy; the analytics account then delegates kms:Decrypt to the role in its IAM policy.
    fr: |
      Les ressources chiffrées avec une clé gérée par AWS ne peuvent pas être partagées avec d'autres comptes, car la politique de clé d'une clé gérée par AWS est contrôlée par le service et ne peut pas être modifiée. Une clé gérée par le client permet d'ajouter le rôle externe à la politique de clé ; le compte d'analyse délègue ensuite kms:Decrypt au rôle dans sa politique IAM.
  options:
    a:
      en: |
        You can view the key policy of an AWS managed key but you cannot change it.
      fr: |
        Vous pouvez consulter la politique de clé d'une clé gérée par AWS, mais pas la modifier.
    c:
      en: |
        An IAM policy can only delegate what the key policy allows, and the aws/s3 key policy does not allow other accounts.
      fr: |
        Une politique IAM ne peut déléguer que ce que la politique de clé autorise, et la politique de la clé aws/s3 n'autorise pas d'autres comptes.
    d:
      en: |
        This drops SSE-KMS for new objects, which breaks the requirement, and the existing objects would still be unreadable.
      fr: |
        Cette solution abandonne SSE-KMS pour les nouveaux objets, contrairement à l'exigence, et les objets existants resteraient illisibles.
references:
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
  - title: Allowing users in other accounts to use a KMS key
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-modifying-external-accounts.html
