id: saac03-1a-managed-policy-versions
objective: "1.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company attaches the same set of permissions to 20 IAM roles used by different applications. Changes to the permissions are made several times each month. When a change breaks an application, administrators must be able to return all 20 roles to the previous permissions in one step.

    Which solution will meet these requirements?
  fr: |
    Une entreprise attache le même ensemble d'autorisations à 20 rôles IAM utilisés par différentes applications. Les autorisations sont modifiées plusieurs fois par mois. Lorsqu'une modification casse une application, les administrateurs doivent pouvoir ramener les 20 rôles aux autorisations précédentes en une seule étape.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the permissions as an inline policy on each role and keep a copy of each version in a Git repository.", fr: "Stocker les autorisations comme politique en ligne sur chaque rôle et garder une copie de chaque version dans un dépôt Git." }
    - id: b
      text: { en: "Attach the closest AWS managed policy to the roles and set its previous version as the default when needed.", fr: "Attacher aux rôles la politique gérée par AWS la plus proche et définir sa version précédente comme version par défaut si nécessaire." }
    - id: c
      text: { en: "Attach one customer managed policy to the 20 roles and set an earlier policy version as the default to roll back.", fr: "Attacher une seule politique gérée par le client aux 20 rôles et définir une version antérieure de la politique comme version par défaut pour revenir en arrière." }
    - id: d
      text: { en: "Put the permissions in an SCP attached to the account and detach the SCP when a change causes a problem.", fr: "Placer les autorisations dans une SCP attachée au compte et détacher la SCP quand une modification pose problème." }
answer: { optionId: c }
explanation:
  correct:
    en: "A customer managed policy is a standalone policy that can be attached to many roles, and IAM keeps up to five versions of it. Setting an earlier version as the default changes the effective permissions of every attached role at once, which provides a one-step rollback."
    fr: "Une politique gérée par le client est une politique autonome qui peut être attachée à de nombreux rôles, et IAM en conserve jusqu'à cinq versions. Définir une version antérieure comme version par défaut change d'un coup les autorisations effectives de tous les rôles attachés : le retour arrière se fait en une étape."
  options:
    a:
      en: "IAM does not version inline policies, and restoring 20 inline policies from Git takes 20 separate changes."
      fr: "IAM ne versionne pas les politiques en ligne, et restaurer 20 politiques en ligne depuis Git demande 20 modifications distinctes."
    b:
      en: "Customers cannot edit AWS managed policies or choose their default version; AWS controls both."
      fr: "Les clients ne peuvent ni modifier les politiques gérées par AWS ni choisir leur version par défaut ; AWS contrôle les deux."
    d:
      en: "SCPs do not grant permissions; they only set the maximum available permissions for the accounts they are attached to."
      fr: "Les SCP n'accordent pas d'autorisations ; elles définissent seulement les autorisations maximales disponibles pour les comptes auxquels elles sont attachées."
references:
  - title: Versioning IAM policies
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_managed-versioning.html
