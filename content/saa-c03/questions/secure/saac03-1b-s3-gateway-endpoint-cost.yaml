id: saac03-1b-s3-gateway-endpoint-cost
objective: "1.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Amazon EC2 instances in private subnets download large datasets from an S3 bucket in the same Region through a NAT gateway. The NAT gateway's data processing charges are high. The company wants the traffic to S3 to stay on the AWS network.

    Which solution is the MOST cost-effective?
  fr: |
    Des instances Amazon EC2 situées dans des sous-réseaux privés téléchargent de grands jeux de données depuis un compartiment S3 de la même Région via une passerelle NAT. Les frais de traitement des données de la passerelle NAT sont élevés. L'entreprise veut que le trafic vers S3 reste sur le réseau AWS.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Create an interface VPC endpoint for Amazon S3 in each private subnet, and use the endpoint DNS names.", fr: "Créer un point de terminaison de VPC d'interface pour Amazon S3 dans chaque sous-réseau privé, et utiliser les noms DNS du point de terminaison." }
    - id: b
      text: { en: "Create a gateway VPC endpoint for Amazon S3, and associate it with the route tables of the private subnets.", fr: "Créer un point de terminaison de VPC de passerelle pour Amazon S3, et l'associer aux tables de routage des sous-réseaux privés." }
    - id: c
      text: { en: "Move the instances to public subnets, and assign them public IP addresses to reach Amazon S3.", fr: "Déplacer les instances dans des sous-réseaux publics, et leur attribuer des adresses IP publiques pour joindre Amazon S3." }
    - id: d
      text: { en: "Replace the NAT gateway with a NAT instance that runs on a smaller EC2 instance type.", fr: "Remplacer la passerelle NAT par une instance NAT exécutée sur un type d'instance EC2 plus petit." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A gateway endpoint for S3 adds a route to the S3 prefix list in the selected route tables, so traffic from those subnets reaches S3 in the same Region privately. Gateway endpoints have no additional charge, which removes the NAT gateway processing cost for this traffic.
    fr: |
      Un point de terminaison de passerelle pour S3 ajoute, dans les tables de routage sélectionnées, une route vers la liste de préfixes S3 : le trafic de ces sous-réseaux joint S3 dans la même Région de manière privée. Les points de terminaison de passerelle n'entraînent aucun coût supplémentaire, ce qui supprime les frais de traitement NAT pour ce trafic.
  options:
    a:
      en: |
        Interface endpoints for S3 keep traffic private but are billed per hour and per GB processed, so they cost more than a gateway endpoint.
      fr: |
        Les points de terminaison d'interface pour S3 gardent le trafic privé mais sont facturés à l'heure et au Go traité : ils coûtent plus qu'un point de terminaison de passerelle.
    c:
      en: |
        Public subnets expose the instances to the internet, which weakens the design that the private subnets provide.
      fr: |
        Des sous-réseaux publics exposent les instances à Internet, ce qui affaiblit la conception assurée par les sous-réseaux privés.
    d:
      en: |
        A NAT instance still processes the traffic, must be managed and patched, and is a single point of failure.
      fr: |
        Une instance NAT traite toujours le trafic, doit être gérée et mise à jour, et constitue un point de défaillance unique.
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
