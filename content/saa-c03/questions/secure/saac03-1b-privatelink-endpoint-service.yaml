id: saac03-1b-privatelink-endpoint-service
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company provides an API that runs on Amazon EC2 instances behind a Network Load Balancer in its VPC. Hundreds of customers must consume the API from VPCs in their own AWS accounts, and many of those VPCs use CIDR ranges that overlap with the provider VPC. Traffic must not traverse the internet, and customers must not be able to reach any other resource in the provider VPC.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels fournit une API qui s'exécute sur des instances Amazon EC2 derrière un Network Load Balancer dans son VPC. Des centaines de clients doivent consommer l'API depuis des VPC de leurs propres comptes AWS, et beaucoup de ces VPC utilisent des plages CIDR qui chevauchent celle du VPC du fournisseur. Le trafic ne doit pas passer par Internet, et les clients ne doivent pouvoir joindre aucune autre ressource du VPC du fournisseur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a VPC peering connection with each customer VPC, and restrict access with security groups.", fr: "Créer une connexion d'appairage de VPC avec chaque VPC client, et restreindre l'accès avec des groupes de sécurité." }
    - id: b
      text: { en: "Share a transit gateway with the customers through AWS RAM, and attach every customer VPC to it.", fr: "Partager une passerelle de transit avec les clients via AWS RAM, et y attacher chaque VPC client." }
    - id: c
      text: { en: "Create a VPC endpoint service for the Network Load Balancer, and have customers create interface endpoints to it.", fr: "Créer un service de point de terminaison de VPC pour le Network Load Balancer, et faire créer aux clients des points de terminaison d'interface vers celui-ci." }
    - id: d
      text: { en: "Expose the API through a public Application Load Balancer that allows only the customers' NAT gateway IP addresses.", fr: "Exposer l'API par un Application Load Balancer public qui autorise uniquement les adresses IP des passerelles NAT des clients." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With AWS PrivateLink, the provider creates an endpoint service in front of a Network Load Balancer and allows specific principals. Each customer creates an interface endpoint in its own subnets, so traffic stays on the AWS network, overlapping CIDR ranges do not matter, and only the service is exposed, not the provider VPC.
    fr: |
      Avec AWS PrivateLink, le fournisseur crée un service de point de terminaison devant un Network Load Balancer et autorise des principaux précis. Chaque client crée un point de terminaison d'interface dans ses propres sous-réseaux : le trafic reste sur le réseau AWS, les plages CIDR qui se chevauchent n'ont pas d'importance, et seul le service est exposé, pas le VPC du fournisseur.
  options:
    a:
      en: |
        VPC peering cannot be created between VPCs with overlapping CIDR ranges, and it opens routing between whole VPCs.
      fr: |
        L'appairage de VPC est impossible entre des VPC dont les plages CIDR se chevauchent, et il ouvre le routage entre des VPC entiers.
    b:
      en: |
        A transit gateway routes between whole VPCs, so overlapping ranges conflict and customers gain network paths to the provider VPC.
      fr: |
        Une passerelle de transit route entre des VPC entiers : les plages qui se chevauchent entrent en conflit et les clients obtiennent des chemins réseau vers le VPC du fournisseur.
    d:
      en: |
        A public load balancer sends the traffic over the internet, which the requirements forbid.
      fr: |
        Un équilibreur de charge public fait passer le trafic par Internet, ce que les exigences interdisent.
references:
  - title: Share your services through AWS PrivateLink
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-share-your-services.html
