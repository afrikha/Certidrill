id: saac03-1c-api-waf-secrets-combo
objective: "1.2.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company exposes a public REST API built with Amazon API Gateway and AWS Lambda functions that query an Amazon Aurora MySQL DB cluster. A penetration test found SQL injection attempts against the API and database credentials stored in plaintext in the Lambda environment variables. The company must block SQL injection requests before they reach the functions, remove the credentials from the function configuration, and rotate the credentials automatically.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API REST publique construite avec Amazon API Gateway et des fonctions AWS Lambda qui interrogent un cluster de bases de données Amazon Aurora MySQL. Un test d'intrusion a relevé des tentatives d'injection SQL contre l'API et des informations d'identification de base de données stockées en clair dans les variables d'environnement Lambda. L'entreprise doit bloquer les requêtes d'injection SQL avant qu'elles n'atteignent les fonctions, retirer les informations d'identification de la configuration des fonctions et en assurer la rotation automatique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Protect the API stage with AWS Shield Advanced, and store the credentials in AWS Secrets Manager with rotation turned on for the functions to retrieve at runtime."
        fr: "Protéger l'étape de l'API avec AWS Shield Advanced, et stocker les informations d'identification dans AWS Secrets Manager avec la rotation activée, pour que les fonctions les récupèrent à l'exécution."
    - id: b
      text:
        en: "Associate an AWS WAF web ACL with the SQL database managed rule group with the API stage, and encrypt the environment variables with a customer managed AWS KMS key."
        fr: "Associer à l'étape de l'API une liste ACL web AWS WAF avec le groupe de règles géré pour les bases de données SQL, et chiffrer les variables d'environnement avec une clé AWS KMS gérée par le client."
    - id: c
      text:
        en: "Attach a security group to the functions that blocks SQL injection payloads, and store the credentials in AWS Secrets Manager with rotation turned on."
        fr: "Attacher aux fonctions un groupe de sécurité qui bloque les charges utiles d'injection SQL, et stocker les informations d'identification dans AWS Secrets Manager avec la rotation activée."
    - id: d
      text:
        en: "Associate an AWS WAF web ACL with the SQL database managed rule group with the API stage, and store the credentials in AWS Secrets Manager with rotation turned on for the functions to retrieve at runtime."
        fr: "Associer à l'étape de l'API une liste ACL web AWS WAF avec le groupe de règles géré pour les bases de données SQL, et stocker les informations d'identification dans AWS Secrets Manager avec la rotation activée, pour que les fonctions les récupèrent à l'exécution."
answer: { optionId: d }
explanation:
  correct:
    en: |
      AWS WAF can be associated with an API Gateway REST API stage, and the AWS managed SQL database rule group blocks SQL injection patterns before requests invoke the functions. Secrets Manager removes the credentials from the function configuration and rotates them; the functions read the secret at runtime with their execution role.
    fr: |
      AWS WAF peut être associé à une étape d'API REST API Gateway, et le groupe de règles géré AWS pour les bases de données SQL bloque les motifs d'injection SQL avant que les requêtes n'invoquent les fonctions. Secrets Manager retire les informations d'identification de la configuration des fonctions et en assure la rotation ; les fonctions lisent le secret à l'exécution avec leur rôle d'exécution.
  options:
    a:
      en: |
        Shield Advanced addresses DDoS attacks; it does not inspect requests for SQL injection on its own.
      fr: |
        Shield Advanced traite les attaques DDoS ; il n'inspecte pas à lui seul les requêtes pour y détecter une injection SQL.
    b:
      en: |
        Encrypting the environment variables keeps the credentials in the function configuration and does not rotate them.
      fr: |
        Chiffrer les variables d'environnement laisse les informations d'identification dans la configuration de la fonction et n'en assure pas la rotation.
    c:
      en: |
        Security groups filter by protocol, port and source only; they cannot inspect HTTP payloads, and the API requests do not pass through a function security group.
      fr: |
        Les groupes de sécurité ne filtrent que par protocole, port et source ; ils ne peuvent pas inspecter le contenu HTTP, et les requêtes de l'API ne traversent pas un groupe de sécurité de fonction.
references:
  - title: Resources that you can protect with AWS WAF
    url: https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html
  - title: Rotate AWS Secrets Manager secrets
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
