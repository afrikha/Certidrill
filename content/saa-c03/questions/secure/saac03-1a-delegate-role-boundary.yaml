id: saac03-1a-delegate-role-boundary
objective: "1.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's developers must be able to create IAM roles for the AWS Lambda functions that they build, without waiting for the central security team. The security team must ensure that no role created by a developer can ever have more permissions than a set that the security team defines, even if a developer attaches the AdministratorAccess policy to the role. The developers must not be able to remove this control.

    Which solution will meet these requirements?
  fr: |
    Les développeurs d'une entreprise doivent pouvoir créer des rôles IAM pour les fonctions AWS Lambda qu'ils développent, sans attendre l'équipe de sécurité centrale. L'équipe de sécurité doit garantir qu'aucun rôle créé par un développeur ne puisse jamais avoir plus d'autorisations qu'un ensemble défini par l'équipe de sécurité, même si un développeur attache la politique AdministratorAccess au rôle. Les développeurs ne doivent pas pouvoir supprimer ce contrôle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an SCP to the developers' account that denies iam:CreateRole and iam:AttachRolePolicy to all principals.", fr: "Attacher au compte des développeurs une SCP qui refuse iam:CreateRole et iam:AttachRolePolicy à tous les principaux." }
    - id: b
      text: { en: "Give the developers the IAMFullAccess policy and review new roles weekly with IAM Access Analyzer.", fr: "Donner aux développeurs la politique IAMFullAccess et examiner chaque semaine les nouveaux rôles avec IAM Access Analyzer." }
    - id: c
      text: { en: "Require a security-team permissions boundary on every role that developers create, and deny changes to that boundary.", fr: "Exiger une limite d'autorisations de l'équipe de sécurité sur chaque rôle créé par les développeurs, et refuser toute modification de cette limite." }
    - id: d
      text: { en: "Have the developers create the roles in the security team's account and assume them from their own account when needed.", fr: "Faire créer les rôles par les développeurs dans le compte de l'équipe de sécurité et les endosser depuis leur propre compte si nécessaire." }
answer: { optionId: c }
explanation:
  correct:
    en: "A permissions boundary sets the maximum permissions of a role; the effective permissions are the intersection of its identity-based policies and the boundary, so AdministratorAccess cannot exceed it. The iam:PermissionsBoundary condition forces every new role to carry the boundary, and denying actions that edit or remove boundaries keeps developers from bypassing it."
    fr: "Une limite d'autorisations fixe les autorisations maximales d'un rôle ; les autorisations effectives sont l'intersection de ses politiques basées sur l'identité et de la limite : AdministratorAccess ne peut pas la dépasser. La condition iam:PermissionsBoundary oblige chaque nouveau rôle à porter la limite, et refuser les actions qui modifient ou retirent les limites empêche les développeurs de la contourner."
  options:
    a:
      en: "Denying role creation blocks the developers entirely, which fails the requirement to let them create roles themselves."
      fr: "Refuser la création de rôles bloque complètement les développeurs, ce qui ne respecte pas l'exigence de les laisser créer eux-mêmes des rôles."
    b:
      en: "IAMFullAccess lets developers create roles with any permissions, including administrator access; a weekly review detects escalation only after it happens."
      fr: "IAMFullAccess permet aux développeurs de créer des rôles avec n'importe quelles autorisations, y compris administrateur ; un examen hebdomadaire ne détecte l'élévation qu'après coup."
    d:
      en: "Creating roles in the security account gives developers IAM rights in that account and does not cap the permissions of the roles."
      fr: "Créer les rôles dans le compte de sécurité donne aux développeurs des droits IAM dans ce compte et ne plafonne pas les autorisations des rôles."
references:
  - title: Permissions boundaries for IAM entities
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
