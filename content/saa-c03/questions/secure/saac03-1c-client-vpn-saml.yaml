id: saac03-1c-client-vpn-saml
objective: "1.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A consulting company has 300 consultants who work from client sites and home offices. They need secure access from their laptops to internal applications that run in private subnets of a VPC. Consultants must authenticate with the company's existing SAML 2.0 identity provider. The company does not want to deploy or maintain VPN servers.

    Which solution will meet these requirements?
  fr: |
    Une société de conseil compte 300 consultants qui travaillent chez des clients et à domicile. Ils ont besoin d'un accès sécurisé depuis leurs ordinateurs portables à des applications internes qui s'exécutent dans des sous-réseaux privés d'un VPC. Les consultants doivent s'authentifier auprès du fournisseur d'identité SAML 2.0 existant de l'entreprise. L'entreprise ne veut ni déployer ni maintenir de serveurs VPN.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Site-to-Site VPN connection for each consultant and configure each laptop as a customer gateway."
        fr: "Créer une connexion AWS Site-to-Site VPN pour chaque consultant et configurer chaque ordinateur portable comme passerelle client."
    - id: b
      text:
        en: "Deploy a bastion host in a public subnet that allows SSH from 0.0.0.0/0, and give each consultant an SSH key pair."
        fr: "Déployer un hôte bastion dans un sous-réseau public qui autorise SSH depuis 0.0.0.0/0, et remettre une paire de clés SSH à chaque consultant."
    - id: c
      text:
        en: "Create an AWS Client VPN endpoint associated with the VPC that uses SAML-based federated authentication with the identity provider."
        fr: "Créer un point de terminaison AWS Client VPN associé au VPC qui utilise l'authentification fédérée SAML avec le fournisseur d'identité."
    - id: d
      text:
        en: "Order an AWS Direct Connect hosted connection and share it with the consultants through their home internet providers."
        fr: "Commander une connexion hébergée AWS Direct Connect et la partager avec les consultants par l'intermédiaire de leurs fournisseurs d'accès Internet."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Client VPN is a managed, client-based VPN service: users connect from any location with an OpenVPN-based client. It supports Active Directory, mutual certificate and SAML-based federated authentication, so consultants sign in with the existing identity provider and no VPN servers need to be operated.
    fr: |
      Client VPN est un service VPN géré basé sur des clients : les utilisateurs se connectent depuis n'importe quel lieu avec un client basé sur OpenVPN. Il prend en charge l'authentification Active Directory, l'authentification mutuelle par certificat et l'authentification fédérée SAML : les consultants se connectent avec le fournisseur d'identité existant, et aucun serveur VPN n'est à exploiter.
  options:
    a:
      en: |
        Site-to-Site VPN connects networks through customer gateway devices; it is not a remote access solution for individual laptops.
      fr: |
        Site-to-Site VPN relie des réseaux par des dispositifs de passerelle client ; ce n'est pas une solution d'accès à distance pour des ordinateurs portables individuels.
    b:
      en: |
        SSH open to the internet with distributed key pairs does not use the SAML identity provider and widens the attack surface.
      fr: |
        Un SSH ouvert sur Internet avec des paires de clés distribuées n'utilise pas le fournisseur d'identité SAML et élargit la surface d'attaque.
    d:
      en: |
        Direct Connect links a network at a Direct Connect location to AWS; it cannot be extended to individual users over home internet connections.
      fr: |
        Direct Connect relie à AWS un réseau présent dans un emplacement Direct Connect ; il ne peut pas être étendu à des utilisateurs individuels sur leurs connexions Internet domestiques.
references:
  - title: What is AWS Client VPN?
    url: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html
  - title: Client authentication in AWS Client VPN
    url: https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/client-authentication.html
