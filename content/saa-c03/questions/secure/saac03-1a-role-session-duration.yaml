id: saac03-1a-role-session-duration
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Data engineers run long data processing scripts from their laptops by using the AWS CLI. They obtain credentials by assuming an IAM role in an analytics account directly with their federated identity. The scripts fail after one hour because the credentials expire. The scripts take up to 8 hours, and the engineers must not be prompted again during a run.

    Which solution will meet these requirements?
  fr: |
    Des ingénieurs de données exécutent depuis leurs ordinateurs portables de longs scripts de traitement avec l'AWS CLI. Ils obtiennent des informations d'identification en endossant directement, avec leur identité fédérée, un rôle IAM d'un compte d'analyse. Les scripts échouent au bout d'une heure, car les informations d'identification expirent. Les scripts durent jusqu'à 8 heures, et les ingénieurs ne doivent pas être sollicités à nouveau pendant une exécution.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the role's maximum session duration to 9 hours and request 9-hour sessions when assuming it.", fr: "Définir la durée maximale de session du rôle à 9 heures et demander des sessions de 9 heures lors de son endossement." }
    - id: b
      text: { en: "Have the scripts assume a second role from the first role session to get new credentials every hour.", fr: "Faire endosser par les scripts un second rôle depuis la première session de rôle pour obtenir de nouvelles informations chaque heure." }
    - id: c
      text: { en: "Request an increase of the AWS STS request quota for the analytics account in the Region.", fr: "Demander une augmentation du quota de requêtes AWS STS pour le compte d'analyse dans la Région." }
    - id: d
      text: { en: "Create IAM users with access keys for the engineers to use only for the long-running scripts.", fr: "Créer des utilisateurs IAM avec des clés d'accès que les ingénieurs utiliseront uniquement pour les scripts longs." }
answer: { optionId: a }
explanation:
  correct:
    en: "AssumeRole credentials last one hour by default. The role's maximum session duration can be set from 1 to 12 hours, and the caller can then request a longer duration up to that maximum, so a 9-hour session covers the 8-hour scripts."
    fr: "Les informations d'identification d'AssumeRole durent une heure par défaut. La durée maximale de session du rôle peut être fixée de 1 à 12 heures, et l'appelant peut alors demander une durée plus longue jusqu'à ce maximum : une session de 9 heures couvre les scripts de 8 heures."
  options:
    b:
      en: "Role chaining limits each session to one hour, and refreshing credentials in the middle of a run adds complexity without extending the original session."
      fr: "Le chaînage de rôles limite chaque session à une heure, et renouveler les informations en cours d'exécution ajoute de la complexité sans prolonger la session d'origine."
    c:
      en: "The STS request quota limits the number of calls per second; it has no effect on how long credentials last."
      fr: "Le quota de requêtes STS limite le nombre d'appels par seconde ; il n'a aucun effet sur la durée de validité des informations d'identification."
    d:
      en: "IAM users with access keys are long-term credentials, which AWS advises against for human users."
      fr: "Des utilisateurs IAM avec des clés d'accès sont des informations d'identification à long terme, déconseillées par AWS pour les utilisateurs humains."
references:
  - title: AssumeRole
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
