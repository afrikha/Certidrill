id: saac03-1b-alb-https-redirect
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a public website on Amazon EC2 instances behind an Application Load Balancer that has only an HTTP listener on port 80. The company must encrypt all traffic between users and the load balancer. Users who type an http:// address must be sent automatically to the HTTPS site, and the certificate must renew automatically.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute un site web public sur des instances Amazon EC2 derrière un Application Load Balancer qui n'a qu'un écouteur HTTP sur le port 80. L'entreprise doit chiffrer tout le trafic entre les utilisateurs et l'équilibreur de charge. Les utilisateurs qui saisissent une adresse http:// doivent être envoyés automatiquement vers le site HTTPS, et le certificat doit se renouveler automatiquement.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Upload a self-signed certificate to IAM, and attach it to a new HTTPS listener on port 443 of the load balancer.", fr: "Charger un certificat auto-signé dans IAM, et l'attacher à un nouvel écouteur HTTPS sur le port 443 de l'équilibreur de charge." } }
    - { id: b, text: { en: "Request a public certificate from AWS Certificate Manager (ACM), and attach it to a new HTTPS listener on port 443.", fr: "Demander un certificat public à AWS Certificate Manager (ACM), et l'attacher à un nouvel écouteur HTTPS sur le port 443." } }
    - { id: c, text: { en: "Change the default action of the HTTP listener to a redirect to HTTPS on port 443 with status code HTTP_301.", fr: "Remplacer l'action par défaut de l'écouteur HTTP par une redirection vers HTTPS sur le port 443 avec le code d'état HTTP_301." } }
    - { id: d, text: { en: "Delete the HTTP listener, and remove the port 80 inbound rule from the load balancer's security group.", fr: "Supprimer l'écouteur HTTP, et retirer la règle entrante du port 80 du groupe de sécurité de l'équilibreur de charge." } }
    - { id: e, text: { en: "Install certificates on the EC2 instances, and keep only the HTTP listener on the load balancer.", fr: "Installer des certificats sur les instances EC2, et ne garder que l'écouteur HTTP sur l'équilibreur de charge." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      An HTTPS listener with a public ACM certificate encrypts traffic between users and the load balancer, and ACM renews the certificates it provides automatically. A redirect action on the HTTP listener sends http:// requests to HTTPS on port 443 while keeping the host, path and query.
    fr: |
      Un écouteur HTTPS avec un certificat ACM public chiffre le trafic entre les utilisateurs et l'équilibreur de charge, et ACM renouvelle automatiquement les certificats qu'il fournit. Une action de redirection sur l'écouteur HTTP envoie les requêtes http:// vers HTTPS sur le port 443 en conservant l'hôte, le chemin et la chaîne de requête.
  options:
    a:
      en: |
        Browsers do not trust a self-signed certificate, and certificates in IAM must be replaced manually.
      fr: |
        Les navigateurs n'approuvent pas un certificat auto-signé, et les certificats stockés dans IAM doivent être remplacés manuellement.
    d:
      en: |
        Without an HTTP listener, users who type http:// get a connection error instead of a redirect.
      fr: |
        Sans écouteur HTTP, les utilisateurs qui saisissent http:// obtiennent une erreur de connexion au lieu d'une redirection.
    e:
      en: |
        Traffic between users and the load balancer would still be unencrypted HTTP.
      fr: |
        Le trafic entre les utilisateurs et l'équilibreur de charge resterait en HTTP non chiffré.
references:
  - title: Action types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
  - title: SSL certificates for your Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/https-listener-certificates.html
