id: saac03-1a-org-trail-all-accounts
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company has 25 AWS accounts in an organization in AWS Organizations. The security team must record the API activity of every account, including accounts that are added later, in one central Amazon S3 bucket. Administrators of member accounts must not be able to stop the logging or change its configuration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de services financiers dispose de 25 comptes AWS dans une organisation AWS Organizations. L'équipe de sécurité doit enregistrer l'activité d'API de chaque compte, y compris des comptes ajoutés plus tard, dans un seul compartiment (bucket) Amazon S3 central. Les administrateurs des comptes membres ne doivent pas pouvoir arrêter la journalisation ni modifier sa configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS CloudTrail organization trail from the management account and deliver the logs to the central S3 bucket.", fr: "Créer un journal de suivi d'organisation AWS CloudTrail depuis le compte de gestion et livrer les journaux dans le compartiment S3 central." }
    - id: b
      text: { en: "Create a CloudTrail trail in each member account that delivers to the central S3 bucket, and attach an IAM policy that denies CloudTrail changes.", fr: "Créer un journal de suivi CloudTrail dans chaque compte membre qui livre dans le compartiment S3 central, et attacher une politique IAM qui refuse les modifications de CloudTrail." }
    - id: c
      text: { en: "Use the CloudTrail event history of each account and export the events to the central S3 bucket every day.", fr: "Utiliser l'historique des événements CloudTrail de chaque compte et exporter les événements chaque jour vers le compartiment S3 central." }
    - id: d
      text: { en: "Create an AWS Config aggregator in the management account that collects the configuration items of all accounts.", fr: "Créer un agrégateur AWS Config dans le compte de gestion qui collecte les éléments de configuration de tous les comptes." }
answer: { optionId: a }
explanation:
  correct:
    en: "An organization trail logs the events of the management account and of every member account, and it is added automatically to accounts that join the organization. Member accounts can see the trail but cannot stop logging, delete it or modify it; only the management account or a delegated administrator can."
    fr: "Un journal de suivi d'organisation enregistre les événements du compte de gestion et de chaque compte membre, et il est ajouté automatiquement aux comptes qui rejoignent l'organisation. Les comptes membres voient le journal de suivi mais ne peuvent ni arrêter la journalisation, ni le supprimer, ni le modifier ; seuls le compte de gestion ou un administrateur délégué le peuvent."
  options:
    b:
      en: "Per-account trails must be created again for each new account, and an administrator of a member account can remove an IAM policy from their own account, so the trail stays under local control."
      fr: "Les journaux de suivi par compte doivent être recréés pour chaque nouveau compte, et un administrateur d'un compte membre peut retirer une politique IAM de son propre compte : le journal de suivi reste sous contrôle local."
    c:
      en: "Event history is a per-account view of recent management events, not a central trail; a daily export is custom work and does not prevent local changes."
      fr: "L'historique des événements est une vue par compte des événements de gestion récents, pas un journal de suivi central ; un export quotidien est un développement spécifique et n'empêche pas les modifications locales."
    d:
      en: "AWS Config records resource configuration changes, not the API activity of the accounts."
      fr: "AWS Config enregistre les modifications de configuration des ressources, pas l'activité d'API des comptes."
references:
  - title: Creating a trail for an organization
    url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/creating-trail-organization.html
