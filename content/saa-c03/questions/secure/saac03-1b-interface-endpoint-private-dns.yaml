id: saac03-1b-interface-endpoint-private-dns
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Applications on Amazon EC2 instances in private subnets call AWS Secrets Manager and AWS KMS by using the default endpoints of the AWS SDK. The VPC has no internet gateway and no NAT gateway, and DNS resolution and DNS hostnames are enabled. The company does not want to change the application code or the SDK configuration.

    Which solution will meet these requirements?
  fr: |
    Des applications sur des instances Amazon EC2 situées dans des sous-réseaux privés appellent AWS Secrets Manager et AWS KMS avec les points de terminaison par défaut du kit SDK AWS. Le VPC n'a ni passerelle Internet ni passerelle NAT, et la résolution DNS et les noms d'hôte DNS sont activés. L'entreprise ne veut modifier ni le code de l'application ni la configuration du SDK.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create gateway VPC endpoints for Secrets Manager and AWS KMS, and add them to the private route tables.", fr: "Créer des points de terminaison de VPC de passerelle pour Secrets Manager et AWS KMS, et les ajouter aux tables de routage privées." }
    - id: b
      text: { en: "Create a VPC peering connection to a shared services VPC that has a NAT gateway, and route to it.", fr: "Créer une connexion d'appairage de VPC vers un VPC de services partagés doté d'une passerelle NAT, et y router le trafic." }
    - id: c
      text: { en: "Create interface VPC endpoints for both services with private DNS enabled, and allow HTTPS from the instances in their security group.", fr: "Créer des points de terminaison de VPC d'interface pour les deux services avec le DNS privé activé, et autoriser HTTPS depuis les instances dans leur groupe de sécurité." }
    - id: d
      text: { en: "Create interface VPC endpoints for both services with private DNS disabled, and allow HTTPS from the instances in their security group.", fr: "Créer des points de terminaison de VPC d'interface pour les deux services avec le DNS privé désactivé, et autoriser HTTPS depuis les instances dans leur groupe de sécurité." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Secrets Manager and AWS KMS support interface endpoints (AWS PrivateLink). With private DNS enabled, the default service names resolve to the endpoints' private IP addresses, so the SDK's default endpoints work unchanged. The endpoint security group must allow inbound HTTPS (TCP 443) from the instances.
    fr: |
      Secrets Manager et AWS KMS prennent en charge les points de terminaison d'interface (AWS PrivateLink). Avec le DNS privé activé, les noms de service par défaut se résolvent vers les adresses IP privées des points de terminaison : les points de terminaison par défaut du SDK fonctionnent sans changement. Le groupe de sécurité des points de terminaison doit autoriser le HTTPS entrant (TCP 443) depuis les instances.
  options:
    a:
      en: |
        Gateway endpoints exist only for Amazon S3 and DynamoDB.
      fr: |
        Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB.
    b:
      en: |
        VPC peering does not support edge-to-edge routing, so instances cannot use a NAT gateway in the peer VPC.
      fr: |
        L'appairage de VPC ne prend pas en charge le routage de bout en bout (edge-to-edge) : les instances ne peuvent pas utiliser une passerelle NAT du VPC appairé.
    d:
      en: |
        Without private DNS, the default service names still resolve to public IP addresses, so the applications would have to use the endpoint-specific DNS names, which changes the SDK configuration.
      fr: |
        Sans DNS privé, les noms de service par défaut se résolvent toujours vers des adresses IP publiques : les applications devraient utiliser les noms DNS propres aux points de terminaison, ce qui modifie la configuration du SDK.
references:
  - title: Access an AWS service using an interface VPC endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
