id: saac03-1b-s3-cross-account-role
objective: "1.1.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Example Corp has two AWS accounts. Account A owns an S3 bucket that stores reports encrypted with SSE-S3. An application in account B runs on Amazon EC2 instances that use an IAM role named ReportReader. The application must read objects from the bucket. The solution must follow the principle of least privilege.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Example Corp possède deux comptes AWS. Le compte A détient un compartiment S3 qui stocke des rapports chiffrés avec SSE-S3. Une application du compte B s'exécute sur des instances Amazon EC2 qui utilisent un rôle IAM nommé ReportReader. L'application doit lire les objets du compartiment. La solution doit respecter le principe du moindre privilège.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "In account A, add a bucket policy statement that allows s3:GetObject on the bucket's objects for the ReportReader role ARN.", fr: "Dans le compte A, ajouter une instruction de politique de compartiment qui autorise s3:GetObject sur les objets du compartiment pour l'ARN du rôle ReportReader." } }
    - { id: b, text: { en: "In account A, create an IAM user with s3:GetObject permissions and store its access keys on the EC2 instances.", fr: "Dans le compte A, créer un utilisateur IAM avec des autorisations s3:GetObject et stocker ses clés d'accès sur les instances EC2." } }
    - { id: c, text: { en: "In account B, add a statement to the ReportReader role's trust policy that trusts account A.", fr: "Dans le compte B, ajouter à la politique d'approbation du rôle ReportReader une instruction qui approuve le compte A." } }
    - { id: d, text: { en: "In account B, attach an identity-based policy to the ReportReader role that allows s3:GetObject on the bucket's objects.", fr: "Dans le compte B, attacher au rôle ReportReader une politique basée sur l'identité qui autorise s3:GetObject sur les objets du compartiment." } }
    - { id: e, text: { en: "In account A, attach an SCP that allows account B to read the objects in the bucket.", fr: "Dans le compte A, attacher une SCP qui autorise le compte B à lire les objets du compartiment." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Cross-account access to S3 needs permission from both sides: the bucket policy in the owning account must allow the external principal, and the principal's own account must grant the same action through an identity-based policy. Naming the role ARN and only s3:GetObject keeps the access to the minimum.
    fr: |
      L'accès intercompte à S3 exige une autorisation des deux côtés : la politique de compartiment du compte propriétaire doit autoriser le principal externe, et le compte de ce principal doit accorder la même action par une politique basée sur l'identité. Cibler l'ARN du rôle et seulement s3:GetObject réduit l'accès au strict nécessaire.
  options:
    b:
      en: |
        Long-term access keys on instances are a security risk; the instances already have a role that can receive the permission.
      fr: |
        Des clés d'accès à long terme sur les instances constituent un risque ; les instances disposent déjà d'un rôle qui peut recevoir l'autorisation.
    c:
      en: |
        The trust policy controls who can assume ReportReader (here, EC2). The role does not need to trust account A to call S3 in that account.
      fr: |
        La politique d'approbation contrôle qui peut assumer ReportReader (ici, EC2). Le rôle n'a pas besoin d'approuver le compte A pour appeler S3 dans ce compte.
    e:
      en: |
        SCPs never grant permissions, and the accounts are not stated to be in the same organization.
      fr: |
        Les SCP n'accordent jamais d'autorisations, et rien n'indique que les comptes appartiennent à la même organisation.
references:
  - title: "Example 2: Bucket owner granting cross-account bucket permissions"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-walkthroughs-managing-access-example2.html
