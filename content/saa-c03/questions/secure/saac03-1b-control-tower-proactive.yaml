id: saac03-1b-control-tower-proactive
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company governs its multi-account environment with AWS Control Tower. All infrastructure is deployed with AWS CloudFormation stacks. The security team wants to stop noncompliant resources, such as S3 buckets that lack required configuration properties, from being provisioned. The check must evaluate the resource configuration before the resources are created, not after.

    Which solution will meet these requirements?
  fr: |
    Une entreprise gouverne son environnement multicompte avec AWS Control Tower. Toute l'infrastructure est déployée avec des piles AWS CloudFormation. L'équipe de sécurité veut empêcher le provisionnement de ressources non conformes, par exemple des compartiments S3 auxquels manquent des propriétés de configuration requises. La vérification doit évaluer la configuration des ressources avant leur création, et non après.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Control Tower proactive controls, which are implemented with CloudFormation hooks, on the OUs.", fr: "Activer sur les OU des contrôles proactifs de Control Tower, implémentés avec des hooks CloudFormation." }
    - id: b
      text: { en: "Enable Control Tower detective controls, which are implemented with AWS Config rules, on the OUs.", fr: "Activer sur les OU des contrôles de détection de Control Tower, implémentés avec des règles AWS Config." }
    - id: c
      text: { en: "Enable Control Tower preventive controls, which are implemented with SCPs, on the OUs.", fr: "Activer sur les OU des contrôles préventifs de Control Tower, implémentés avec des SCP." }
    - id: d
      text: { en: "Enable the AWS Foundational Security Best Practices standard in AWS Security Hub CSPM for all accounts.", fr: "Activer la norme AWS Foundational Security Best Practices dans AWS Security Hub CSPM pour tous les comptes." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Proactive controls are CloudFormation hooks (preCreate and preUpdate handlers) that check the properties of resources in a stack operation before they are provisioned. They only cover resources deployed through CloudFormation, which matches this company.
    fr: |
      Les contrôles proactifs sont des hooks CloudFormation (gestionnaires preCreate et preUpdate) qui vérifient les propriétés des ressources d'une opération de pile avant leur provisionnement. Ils ne couvrent que les ressources déployées avec CloudFormation, ce qui correspond à cette entreprise.
  options:
    b:
      en: |
        Detective controls evaluate resources with AWS Config after they exist; they report noncompliance but do not stop provisioning.
      fr: |
        Les contrôles de détection évaluent les ressources avec AWS Config une fois qu'elles existent ; ils signalent la non-conformité mais n'empêchent pas le provisionnement.
    c:
      en: |
        Preventive controls deny API actions for principals; they do not evaluate the full set of configuration properties of the resources in a template.
      fr: |
        Les contrôles préventifs refusent des actions d'API pour des principaux ; ils n'évaluent pas l'ensemble des propriétés de configuration des ressources d'un modèle.
    d:
      en: |
        Security Hub CSPM controls check resources that are already deployed, so they detect issues after creation.
      fr: |
        Les contrôles de Security Hub CSPM vérifient des ressources déjà déployées : ils détectent les problèmes après la création.
references:
  - title: Proactive controls
    url: https://docs.aws.amazon.com/controltower/latest/controlreference/proactive-controls.html
