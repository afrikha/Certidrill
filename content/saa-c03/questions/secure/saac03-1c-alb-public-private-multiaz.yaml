id: saac03-1c-alb-public-private-multiaz
objective: "1.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is deploying a customer portal on Amazon EC2 instances behind an internet-facing Application Load Balancer (ALB). The portal must remain available if one Availability Zone fails. The instances must not have public IP addresses, must not be directly reachable from the internet, and must download software updates through the NAT gateways that already serve the VPC's private subnets.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise déploie un portail client sur des instances Amazon EC2 derrière un Application Load Balancer (ALB) accessible depuis Internet. Le portail doit rester disponible en cas de défaillance d'une zone de disponibilité. Les instances ne doivent pas avoir d'adresses IP publiques, ne doivent pas être directement joignables depuis Internet et doivent télécharger les mises à jour logicielles par les passerelles NAT qui desservent déjà les sous-réseaux privés du VPC.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create the ALB in one public subnet in each of two Availability Zones."
        fr: "Créer l'ALB dans un sous-réseau public dans chacune de deux zones de disponibilité."
    - id: b
      text:
        en: "Create the ALB in a single public subnet and enable cross-zone load balancing."
        fr: "Créer l'ALB dans un seul sous-réseau public et activer l'équilibrage de charge entre zones."
    - id: c
      text:
        en: "Launch the instances in public subnets in two Availability Zones and disable public IP address assignment."
        fr: "Lancer les instances dans des sous-réseaux publics de deux zones de disponibilité et désactiver l'attribution d'adresses IP publiques."
    - id: d
      text:
        en: "Launch the instances in private subnets in the same two Availability Zones and register them with the ALB target group."
        fr: "Lancer les instances dans des sous-réseaux privés des deux mêmes zones de disponibilité et les enregistrer dans le groupe cible de l'ALB."
    - id: e
      text:
        en: "Assign an Elastic IP address to each instance and allow inbound traffic only from the ALB security group."
        fr: "Attribuer une adresse IP Elastic à chaque instance et n'autoriser le trafic entrant que depuis le groupe de sécurité de l'ALB."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      An internet-facing ALB is placed in public subnets, at least one in each of two or more Availability Zones, so it keeps serving traffic if a zone fails. The instances go in private subnets in the same zones and are registered as targets: the ALB reaches them through their private IP addresses, and the internet cannot reach them directly.
    fr: |
      Un ALB accessible depuis Internet est placé dans des sous-réseaux publics, au moins un dans chacune de deux zones de disponibilité ou plus, afin de continuer à servir le trafic en cas de défaillance d'une zone. Les instances vont dans des sous-réseaux privés des mêmes zones et sont enregistrées comme cibles : l'ALB les atteint par leurs adresses IP privées, et Internet ne peut pas les atteindre directement.
  options:
    b:
      en: |
        An ALB requires subnets in at least two Availability Zones; a single subnet would also leave the load balancer without a node if that zone failed.
      fr: |
        Un ALB exige des sous-réseaux dans au moins deux zones de disponibilité ; un seul sous-réseau laisserait en outre l'équilibreur de charge sans nœud en cas de défaillance de cette zone.
    c:
      en: |
        Instances without public IP addresses in public subnets cannot reach the internet: the subnet routes internet traffic to the internet gateway, not to a NAT gateway, so the instances could not download updates.
      fr: |
        Des instances sans adresse IP publique dans des sous-réseaux publics ne peuvent pas atteindre Internet : le sous-réseau route le trafic Internet vers la passerelle Internet, pas vers une passerelle NAT, et les instances ne pourraient pas télécharger les mises à jour.
    e:
      en: |
        Elastic IP addresses are public IP addresses, which the requirements forbid.
      fr: |
        Les adresses IP Elastic sont des adresses IP publiques, ce que les exigences interdisent.
references:
  - title: Subnets for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
