id: saac03-1b-iam-roles-anywhere
objective: "1.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a batch application on servers in its on-premises data center. The application uploads files to an S3 bucket by using the access keys of an IAM user. The company already operates a private certificate authority (CA) that issues X.509 certificates to its servers. The company wants to remove the long-term access keys and use temporary credentials, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application de traitement par lots sur des serveurs de son centre de données sur site. L'application charge des fichiers dans un compartiment S3 avec les clés d'accès d'un utilisateur IAM. L'entreprise exploite déjà une autorité de certification (CA) privée qui délivre des certificats X.509 à ses serveurs. L'entreprise veut supprimer les clés d'accès à long terme et utiliser des informations d'identification temporaires, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the access keys in AWS Secrets Manager, and rotate them automatically every 30 days with a Lambda function.", fr: "Stocker les clés d'accès dans AWS Secrets Manager, et les renouveler automatiquement tous les 30 jours avec une fonction Lambda." }
    - id: b
      text: { en: "Create an Amazon Cognito identity pool and register each server as an unauthenticated identity.", fr: "Créer un pool d'identités Amazon Cognito et enregistrer chaque serveur comme identité non authentifiée." }
    - id: c
      text: { en: "Connect the data center with AWS Site-to-Site VPN, and attach an IAM instance profile to each on-premises server.", fr: "Relier le centre de données par AWS Site-to-Site VPN, et attacher un profil d'instance IAM à chaque serveur sur site." }
    - id: d
      text: { en: "Configure IAM Roles Anywhere with the private CA as a trust anchor, and use the server certificates to get role credentials.", fr: "Configurer IAM Roles Anywhere avec la CA privée comme ancre d'approbation, et utiliser les certificats des serveurs pour obtenir les informations du rôle." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      IAM Roles Anywhere lets workloads outside AWS obtain temporary credentials for an IAM role by authenticating with X.509 certificates. The company registers its existing CA as a trust anchor, creates a profile that lists the role, and the servers call CreateSession (for example through the credential helper) instead of using access keys.
    fr: |
      IAM Roles Anywhere permet à des charges de travail extérieures à AWS d'obtenir des informations d'identification temporaires d'un rôle IAM en s'authentifiant avec des certificats X.509. L'entreprise enregistre sa CA existante comme ancre d'approbation, crée un profil qui liste le rôle, et les serveurs appellent CreateSession (par exemple via l'assistant d'informations d'identification) au lieu d'utiliser des clés d'accès.
  options:
    a:
      en: |
        Rotated access keys are still long-term credentials of an IAM user, and the servers would need credentials to call Secrets Manager.
      fr: |
        Des clés d'accès renouvelées restent des informations d'identification à long terme d'un utilisateur IAM, et les serveurs auraient besoin d'informations d'identification pour appeler Secrets Manager.
    b:
      en: |
        Cognito identity pools are designed for application end users, and unauthenticated identities would let anyone with the pool ID get credentials.
      fr: |
        Les pools d'identités Cognito sont conçus pour les utilisateurs finaux d'applications, et des identités non authentifiées permettraient à quiconque connaît l'ID du pool d'obtenir des informations d'identification.
    c:
      en: |
        Instance profiles can be attached only to EC2 instances, not to on-premises servers, even over a VPN.
      fr: |
        Les profils d'instance ne peuvent être attachés qu'à des instances EC2, pas à des serveurs sur site, même via un VPN.
references:
  - title: What is AWS Identity and Access Management Roles Anywhere?
    url: https://docs.aws.amazon.com/rolesanywhere/latest/userguide/introduction.html
