id: saac03-1a-idc-external-idp-scim
objective: "1.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company manages its workforce identities in Okta. The company has 30 AWS accounts in AWS Organizations. Employees must sign in to AWS with their Okta credentials, and when a user or group is created or removed in Okta, the change must appear in AWS automatically. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé gère les identités de son personnel dans Okta. L'entreprise dispose de 30 comptes AWS dans AWS Organizations. Les employés doivent se connecter à AWS avec leurs identifiants Okta, et lorsqu'un utilisateur ou un groupe est créé ou supprimé dans Okta, la modification doit apparaître automatiquement dans AWS. La solution doit entraîner le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM SAML identity provider for Okta and federated IAM roles in each of the 30 accounts.", fr: "Créer un fournisseur d'identité SAML IAM pour Okta et des rôles IAM fédérés dans chacun des 30 comptes." }
    - id: b
      text: { en: "Connect IAM Identity Center to Okta through AD Connector and synchronize the users and groups every hour.", fr: "Connecter IAM Identity Center à Okta via AD Connector et synchroniser les utilisateurs et les groupes toutes les heures." }
    - id: c
      text: { en: "Set Okta as the external identity provider of IAM Identity Center and enable SCIM automatic provisioning.", fr: "Définir Okta comme fournisseur d'identité externe d'IAM Identity Center et activer le provisionnement automatique SCIM." }
    - id: d
      text: { en: "Keep the Identity Center directory as the identity source and export the Okta users to it with a nightly script.", fr: "Conserver le répertoire Identity Center comme source d'identité et y exporter les utilisateurs Okta avec un script nocturne." }
answer: { optionId: c }
explanation:
  correct:
    en: "IAM Identity Center can use an external identity provider such as Okta as its identity source. SAML 2.0 handles single sign-on, and SCIM provisioning keeps users and groups synchronized automatically; permission sets then grant access to the 30 accounts from one place."
    fr: "IAM Identity Center peut utiliser un fournisseur d'identité externe comme Okta comme source d'identité. SAML 2.0 assure l'authentification unique, et le provisionnement SCIM synchronise automatiquement les utilisateurs et les groupes ; les ensembles d'autorisations accordent ensuite l'accès aux 30 comptes depuis un seul endroit."
  options:
    a:
      en: "Per-account IAM SAML federation works, but it requires a provider and roles in all 30 accounts and does not synchronize groups into AWS, so it has much more overhead."
      fr: "La fédération SAML IAM par compte fonctionne, mais elle exige un fournisseur et des rôles dans les 30 comptes et ne synchronise pas les groupes dans AWS : elle entraîne beaucoup plus de charge."
    b:
      en: "AD Connector is a proxy to a Microsoft Active Directory; Okta is not an Active Directory domain."
      fr: "AD Connector est un proxy vers un annuaire Microsoft Active Directory ; Okta n'est pas un domaine Active Directory."
    d:
      en: "A nightly export is custom code, changes are not immediate, and users would get separate credentials instead of signing in with Okta."
      fr: "Un export nocturne est du code spécifique, les modifications ne sont pas immédiates, et les utilisateurs auraient des identifiants distincts au lieu de se connecter avec Okta."
references:
  - title: Manage your identity source
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source.html
