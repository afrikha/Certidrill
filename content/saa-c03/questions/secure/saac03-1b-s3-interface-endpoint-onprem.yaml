id: saac03-1b-s3-interface-endpoint-onprem
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's on-premises data center connects to a VPC through an AWS Direct Connect private virtual interface. On-premises servers must upload data to Amazon S3 over this connection by using private IP addresses, without traversing the internet. The VPC already has a gateway endpoint for S3 that EC2 instances use.

    Which solution will meet these requirements?
  fr: |
    Le centre de données sur site d'une entreprise est relié à un VPC par une interface virtuelle privée AWS Direct Connect. Des serveurs sur site doivent charger des données dans Amazon S3 par cette connexion en utilisant des adresses IP privées, sans passer par Internet. Le VPC dispose déjà d'un point de terminaison de passerelle pour S3 utilisé par des instances EC2.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an interface VPC endpoint for Amazon S3 in the VPC, and have the on-premises servers use it over Direct Connect.", fr: "Créer un point de terminaison de VPC d'interface pour Amazon S3 dans le VPC, et le faire utiliser par les serveurs sur site via Direct Connect." }
    - id: b
      text: { en: "Advertise the S3 prefix list to the on-premises routers so that traffic flows through the existing gateway endpoint.", fr: "Annoncer la liste de préfixes S3 aux routeurs sur site afin que le trafic passe par le point de terminaison de passerelle existant." }
    - id: c
      text: { en: "Create a Direct Connect public virtual interface, and send the uploads to the public S3 endpoints over it.", fr: "Créer une interface virtuelle publique Direct Connect, et envoyer les chargements vers les points de terminaison S3 publics par celle-ci." }
    - id: d
      text: { en: "Attach a transit gateway to the VPC, and route the on-premises traffic to the gateway endpoint through it.", fr: "Attacher une passerelle de transit au VPC, et router le trafic sur site vers le point de terminaison de passerelle par son intermédiaire." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Interface endpoints for S3 have private IP addresses in your subnets and can be reached from on premises over Direct Connect or Site-to-Site VPN. Gateway endpoints cannot be used from on premises. Both endpoint types can coexist in the same VPC, so the EC2 instances can keep the free gateway endpoint.
    fr: |
      Les points de terminaison d'interface pour S3 ont des adresses IP privées dans vos sous-réseaux et sont accessibles depuis le site via Direct Connect ou Site-to-Site VPN. Les points de terminaison de passerelle ne sont pas utilisables depuis le site. Les deux types peuvent coexister dans le même VPC : les instances EC2 peuvent conserver le point de terminaison de passerelle gratuit.
  options:
    b:
      en: |
        A gateway endpoint is a route target inside the VPC; traffic that arrives from on premises cannot use it.
      fr: |
        Un point de terminaison de passerelle est une cible de route à l'intérieur du VPC ; le trafic venant du site ne peut pas l'utiliser.
    c:
      en: |
        A public virtual interface avoids the internet but reaches S3 public IP addresses, which fails the private IP requirement.
      fr: |
        Une interface virtuelle publique évite Internet mais joint les adresses IP publiques de S3, ce qui ne respecte pas l'exigence d'adresses IP privées.
    d:
      en: |
        A transit gateway does not make a gateway endpoint reachable from outside the VPC.
      fr: |
        Une passerelle de transit ne rend pas un point de terminaison de passerelle accessible depuis l'extérieur du VPC.
references:
  - title: AWS PrivateLink for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html
