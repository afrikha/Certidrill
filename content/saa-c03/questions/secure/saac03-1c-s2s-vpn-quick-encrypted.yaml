id: saac03-1c-s2s-vpn-quick-encrypted
objective: "1.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company needs to connect its on-premises data center to a single VPC within a few days. The traffic must be encrypted in transit and can travel over the company's existing internet connection. The company wants a managed AWS service on the AWS side.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle doit connecter son centre de données sur site à un VPC unique en quelques jours. Le trafic doit être chiffré en transit et peut emprunter la connexion Internet existante de l'entreprise. L'entreprise veut un service AWS géré du côté AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Order an AWS Direct Connect dedicated connection and create a private virtual interface to the VPC."
        fr: "Commander une connexion dédiée AWS Direct Connect et créer une interface virtuelle privée vers le VPC."
    - id: b
      text:
        en: "Create an AWS Site-to-Site VPN connection between a customer gateway and a virtual private gateway attached to the VPC."
        fr: "Créer une connexion AWS Site-to-Site VPN entre une passerelle client et une passerelle réseau privé virtuel attachée au VPC."
    - id: c
      text:
        en: "Create an AWS Client VPN endpoint and install the VPN client on every server in the data center."
        fr: "Créer un point de terminaison AWS Client VPN et installer le client VPN sur chaque serveur du centre de données."
    - id: d
      text:
        en: "Create a VPC peering connection between the VPC and the data center network."
        fr: "Créer une connexion d'appairage de VPC entre le VPC et le réseau du centre de données."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Site-to-Site VPN creates IPsec-encrypted tunnels over the internet between the on-premises customer gateway device and a virtual private gateway (or a transit gateway). Each connection has two tunnels for high availability, and it can be set up quickly without new physical circuits.
    fr: |
      Site-to-Site VPN crée des tunnels chiffrés IPsec sur Internet entre le dispositif de passerelle client sur site et une passerelle réseau privé virtuel (ou une passerelle de transit). Chaque connexion comporte deux tunnels pour la haute disponibilité, et elle se met en place rapidement, sans nouveau circuit physique.
  options:
    a:
      en: |
        A dedicated Direct Connect connection requires a physical cross-connect that usually takes much longer than a few days, and Direct Connect does not encrypt traffic by default.
      fr: |
        Une connexion Direct Connect dédiée exige une interconnexion physique dont la mise en place prend généralement bien plus de quelques jours, et Direct Connect ne chiffre pas le trafic par défaut.
    c:
      en: |
        Client VPN gives individual users remote access; it is not designed to connect a whole data center network to a VPC.
      fr: |
        Client VPN donne un accès à distance à des utilisateurs individuels ; il n'est pas conçu pour connecter tout le réseau d'un centre de données à un VPC.
    d:
      en: |
        VPC peering connects two VPCs; it cannot connect a VPC to an on-premises network.
      fr: |
        L'appairage de VPC relie deux VPC ; il ne peut pas relier un VPC à un réseau sur site.
references:
  - title: What is AWS Site-to-Site VPN?
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html
  - title: Encryption in AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html
