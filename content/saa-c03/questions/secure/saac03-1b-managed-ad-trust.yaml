id: saac03-1b-managed-ad-trust
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating Windows applications that rely on Active Directory features such as Kerberos authentication and Group Policy to Amazon EC2. The applications must keep authenticating users even if the network link to the on-premises data center fails. On-premises users must be able to access the migrated applications with their existing domain accounts. The company does not want to manage domain controllers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre vers Amazon EC2 des applications Windows qui reposent sur des fonctionnalités Active Directory comme l'authentification Kerberos et la stratégie de groupe. Les applications doivent continuer à authentifier les utilisateurs même si la liaison réseau avec le centre de données sur site tombe en panne. Les utilisateurs sur site doivent pouvoir accéder aux applications migrées avec leurs comptes de domaine existants. L'entreprise ne veut pas gérer de contrôleurs de domaine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy AWS Managed Microsoft AD, join the instances to it, and create a trust relationship with the on-premises domain.", fr: "Déployer AWS Managed Microsoft AD, y joindre les instances et créer une relation d'approbation avec le domaine sur site." }
    - id: b
      text: { en: "Deploy AD Connector and join the instances to the on-premises domain through it.", fr: "Déployer AD Connector et joindre les instances au domaine sur site par son intermédiaire." }
    - id: c
      text: { en: "Deploy Simple AD and recreate the on-premises users and groups in it.", fr: "Déployer Simple AD et y recréer les utilisateurs et groupes sur site." }
    - id: d
      text: { en: "Install Active Directory Domain Services on EC2 instances and promote them to domain controllers of the on-premises domain.", fr: "Installer les services de domaine Active Directory sur des instances EC2 et les promouvoir contrôleurs du domaine sur site." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      AWS Managed Microsoft AD is an actual Active Directory that AWS operates in your VPC, so the applications keep Kerberos and Group Policy even if the on-premises link fails. A trust relationship with the self-managed domain lets on-premises users reach the applications with their existing accounts.
    fr: |
      AWS Managed Microsoft AD est un véritable Active Directory qu'AWS exploite dans votre VPC : les applications conservent Kerberos et la stratégie de groupe même si la liaison sur site tombe. Une relation d'approbation avec le domaine autogéré permet aux utilisateurs sur site d'accéder aux applications avec leurs comptes existants.
  options:
    b:
      en: |
        AD Connector forwards every request to on-premises domain controllers, so authentication stops when the link fails.
      fr: |
        AD Connector transmet chaque requête aux contrôleurs de domaine sur site : l'authentification s'arrête lorsque la liaison tombe.
    c:
      en: |
        Simple AD does not support trusts, and recreating users gives them new accounts instead of their existing ones.
      fr: |
        Simple AD ne prend pas en charge les approbations, et recréer les utilisateurs leur donne de nouveaux comptes au lieu de leurs comptes existants.
    d:
      en: |
        Self-managed domain controllers on EC2 would work but must be patched and operated by the company.
      fr: |
        Des contrôleurs de domaine autogérés sur EC2 fonctionneraient, mais l'entreprise devrait les mettre à jour et les exploiter.
references:
  - title: Creating a trust relationship between your AWS Managed Microsoft AD and self-managed AD
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/ms_ad_setup_trust.html
