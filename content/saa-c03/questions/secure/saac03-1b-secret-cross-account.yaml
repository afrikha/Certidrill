id: saac03-1b-secret-cross-account
objective: "1.1.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores database credentials as a secret in AWS Secrets Manager in a shared services account. The secret is encrypted with the AWS managed key aws/secretsmanager. An application in a separate workload account must read the secret by using its IAM role. The workload account will update the role's identity-based policy to allow secretsmanager:GetSecretValue on the secret and kms:Decrypt on the key that encrypts it.

    Which combination of steps must the company take in the shared services account? (Choose two.)
  fr: |
    Une entreprise stocke des informations d'identification de base de données sous forme de secret dans AWS Secrets Manager, dans un compte de services partagés. Le secret est chiffré avec la clé gérée par AWS aws/secretsmanager. Une application d'un compte de charge de travail distinct doit lire le secret avec son rôle IAM. Le compte de charge de travail mettra à jour la politique basée sur l'identité du rôle pour autoriser secretsmanager:GetSecretValue sur le secret et kms:Decrypt sur la clé qui le chiffre.

    Quelle combinaison d'étapes l'entreprise doit-elle réaliser dans le compte de services partagés ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Update the key policy of aws/secretsmanager to allow kms:Decrypt for the application role.", fr: "Mettre à jour la politique de clé de aws/secretsmanager pour autoriser kms:Decrypt au rôle de l'application." } }
    - { id: b, text: { en: "Encrypt the secret with a customer managed key whose key policy allows kms:Decrypt for the application role.", fr: "Chiffrer le secret avec une clé gérée par le client dont la politique de clé autorise kms:Decrypt au rôle de l'application." } }
    - { id: c, text: { en: "Attach a resource-based policy to the secret that allows secretsmanager:GetSecretValue for the application role.", fr: "Attacher au secret une politique basée sur les ressources qui autorise secretsmanager:GetSecretValue au rôle de l'application." } }
    - { id: d, text: { en: "Configure Secrets Manager replication to copy the secret into the workload account.", fr: "Configurer la réplication Secrets Manager pour copier le secret dans le compte de charge de travail." } }
    - { id: e, text: { en: "Turn on automatic rotation so that each new version is shared with the workload account.", fr: "Activer la rotation automatique afin que chaque nouvelle version soit partagée avec le compte de charge de travail." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      Cross-account access to a secret requires a resource-based policy on the secret that allows the external principal, plus an identity-based policy in the caller's account. The secret must be encrypted with a customer managed key whose key policy lets the external role decrypt; the AWS managed key aws/secretsmanager cannot be used for cross-account access.
    fr: |
      L'accès intercompte à un secret exige une politique basée sur les ressources sur le secret qui autorise le principal externe, ainsi qu'une politique basée sur l'identité dans le compte de l'appelant. Le secret doit être chiffré avec une clé gérée par le client dont la politique de clé permet au rôle externe de déchiffrer ; la clé gérée par AWS aws/secretsmanager ne peut pas servir à un accès intercompte.
  options:
    a:
      en: |
        The key policy of an AWS managed key cannot be changed, and Secrets Manager does not support cross-account access with aws/secretsmanager.
      fr: |
        La politique de clé d'une clé gérée par AWS ne peut pas être modifiée, et Secrets Manager ne prend pas en charge l'accès intercompte avec aws/secretsmanager.
    d:
      en: |
        Secrets Manager replication copies a secret to other Regions of the same account, not to another account.
      fr: |
        La réplication Secrets Manager copie un secret vers d'autres Régions du même compte, pas vers un autre compte.
    e:
      en: |
        Rotation changes the secret value on a schedule; it does not grant access to other accounts.
      fr: |
        La rotation modifie la valeur du secret selon un calendrier ; elle n'accorde pas d'accès à d'autres comptes.
references:
  - title: Access AWS Secrets Manager secrets from a different account
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/auth-and-access_examples_cross.html
