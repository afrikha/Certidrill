id: saac03-1a-srm-lambda-container-image
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company packages an AWS Lambda function as a container image that is built from an AWS-provided Lambda base image. AWS has released a new runtime version that contains security fixes. The security team wants the function to run on the patched runtime.

    What must the company do?
  fr: |
    Une entreprise empaquette une fonction AWS Lambda sous forme d'image de conteneur construite à partir d'une image de base Lambda fournie par AWS. AWS a publié une nouvelle version de l'environnement d'exécution qui contient des correctifs de sécurité. L'équipe de sécurité veut que la fonction s'exécute sur l'environnement d'exécution corrigé.

    Que doit faire l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Nothing, because Lambda updates the runtime of container image functions in the Auto update mode.", fr: "Rien, car Lambda met à jour l'environnement d'exécution des fonctions à image de conteneur en mode de mise à jour Auto." }
    - id: b
      text: { en: "Change the runtime update mode of the function to Function update.", fr: "Passer le mode de mise à jour de l'environnement d'exécution de la fonction à Function update." }
    - id: c
      text: { en: "Rebuild the image from the updated base image and deploy the new image to the function.", fr: "Reconstruire l'image à partir de l'image de base mise à jour et déployer la nouvelle image sur la fonction." }
    - id: d
      text: { en: "Open an AWS Support case to have the runtime of the function patched.", fr: "Ouvrir un dossier AWS Support pour faire corriger l'environnement d'exécution de la fonction." }
answer: { optionId: c }
explanation:
  correct:
    en: "For functions deployed as container images, the runtime is part of the image. Lambda publishes new base images, and the customer must rebuild the image from the updated base image and redeploy the function to pick up the patched runtime."
    fr: "Pour les fonctions déployées sous forme d'images de conteneur, l'environnement d'exécution fait partie de l'image. Lambda publie de nouvelles images de base, et le client doit reconstruire l'image à partir de l'image de base mise à jour et redéployer la fonction pour bénéficier de l'environnement corrigé."
  options:
    a:
      en: "Automatic runtime updates apply to functions that use Lambda-managed runtimes from .zip archives; Lambda does not rebuild container images."
      fr: "Les mises à jour automatiques s'appliquent aux fonctions qui utilisent des environnements gérés par Lambda à partir d'archives .zip ; Lambda ne reconstruit pas les images de conteneur."
    b:
      en: "Runtime update modes control managed runtimes of .zip functions; they do not change the contents of a container image."
      fr: "Les modes de mise à jour contrôlent les environnements gérés des fonctions .zip ; ils ne modifient pas le contenu d'une image de conteneur."
    d:
      en: "AWS Support does not modify customer images; updating the image is the customer's responsibility."
      fr: "AWS Support ne modifie pas les images des clients ; la mise à jour de l'image relève de la responsabilité du client."
references:
  - title: Understanding how Lambda manages runtime updates
    url: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html
