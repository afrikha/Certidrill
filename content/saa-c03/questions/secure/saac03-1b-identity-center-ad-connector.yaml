id: saac03-1b-identity-center-ad-connector
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 2,000 employees whose identities are stored in an on-premises Microsoft Active Directory. The on-premises network connects to AWS through AWS Direct Connect. The company uses 25 AWS accounts in AWS Organizations. Employees must sign in to the AWS accounts with their existing Active Directory credentials, and administrators must assign access by Active Directory group. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise compte 2 000 employés dont les identités sont stockées dans un Microsoft Active Directory sur site. Le réseau sur site est relié à AWS par AWS Direct Connect. L'entreprise utilise 25 comptes AWS dans AWS Organizations. Les employés doivent se connecter aux comptes AWS avec leurs informations d'identification Active Directory existantes, et les administrateurs doivent attribuer les accès par groupe Active Directory. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create IAM users in each account with the same names as in Active Directory, and add them to IAM groups.", fr: "Créer dans chaque compte des utilisateurs IAM portant les mêmes noms que dans Active Directory, et les ajouter à des groupes IAM." }
    - id: b
      text: { en: "Create an Amazon Cognito user pool, import the Active Directory users into it, and map pool groups to IAM roles.", fr: "Créer un groupe d'utilisateurs Amazon Cognito, y importer les utilisateurs Active Directory et associer les groupes du pool à des rôles IAM." }
    - id: c
      text: { en: "Connect IAM Identity Center to Active Directory through AD Connector, and assign permission sets to Active Directory groups.", fr: "Connecter IAM Identity Center à Active Directory via AD Connector, et attribuer des ensembles d'autorisations aux groupes Active Directory." }
    - id: d
      text: { en: "Configure a SAML identity provider and IAM roles in each of the 25 accounts, and map groups to roles in every account.", fr: "Configurer un fournisseur d'identité SAML et des rôles IAM dans chacun des 25 comptes, et associer les groupes aux rôles dans chaque compte." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      IAM Identity Center can use Active Directory as its identity source through AD Connector or AWS Managed Microsoft AD. Users and groups are synchronized, authentication is passed through to Active Directory, and permission sets assigned to groups give access to many accounts from one place.
    fr: |
      IAM Identity Center peut utiliser Active Directory comme source d'identité via AD Connector ou AWS Managed Microsoft AD. Les utilisateurs et les groupes sont synchronisés, l'authentification est transmise à Active Directory, et les ensembles d'autorisations attribués aux groupes donnent accès à de nombreux comptes depuis un seul endroit.
  options:
    a:
      en: |
        Duplicating 2,000 users in 25 accounts creates separate passwords and constant maintenance; users do not keep their Active Directory credentials.
      fr: |
        Dupliquer 2 000 utilisateurs dans 25 comptes crée des mots de passe distincts et une maintenance permanente ; les utilisateurs ne conservent pas leurs informations d'identification Active Directory.
    b:
      en: |
        Cognito user pools are designed for customer-facing applications, and importing users creates a second directory with its own passwords.
      fr: |
        Les groupes d'utilisateurs Cognito sont conçus pour des applications destinées aux clients, et l'importation crée un second annuaire avec ses propres mots de passe.
    d:
      en: |
        Per-account SAML federation works, but configuring and maintaining it in 25 accounts is much more overhead than Identity Center.
      fr: |
        La fédération SAML par compte fonctionne, mais la configurer et la maintenir dans 25 comptes représente une charge bien supérieure à Identity Center.
references:
  - title: Microsoft AD directory
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source-ad.html
