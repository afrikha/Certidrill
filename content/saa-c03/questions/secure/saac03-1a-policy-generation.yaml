id: saac03-1a-policy-generation
objective: "1.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A development team gave a new IAM role broad AWS managed policies while it built an application. The application has now run in a test account for two months, and AWS CloudTrail has logged all its activity. The security team wants to replace the broad policies with a policy that grants only the services and actions that the application actually used, with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une équipe de développement a attribué de larges politiques gérées par AWS à un nouveau rôle IAM pendant qu'elle développait une application. L'application s'exécute désormais depuis deux mois dans un compte de test, et AWS CloudTrail a journalisé toute son activité. L'équipe de sécurité veut remplacer les politiques larges par une politique qui n'accorde que les services et actions réellement utilisés par l'application, avec le MOINS d'effort.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Review the AWS Trusted Advisor security checks and remove the policies that they report as risky.", fr: "Consulter les vérifications de sécurité d'AWS Trusted Advisor et retirer les politiques qu'elles signalent comme risquées." }
    - id: b
      text: { en: "Download the IAM credential report and write a policy from the services listed for the role.", fr: "Télécharger le rapport sur les informations d'identification IAM et écrire une politique à partir des services listés pour le rôle." }
    - id: c
      text: { en: "Use IAM Access Analyzer to generate a policy from the role's CloudTrail activity, and test it.", fr: "Utiliser IAM Access Analyzer pour générer une politique à partir de l'activité CloudTrail du rôle, et la tester." }
    - id: d
      text: { en: "Create an AWS Config rule that flags the AWS managed policies that are attached to the role.", fr: "Créer une règle AWS Config qui signale les politiques gérées par AWS attachées au rôle." }
answer: { optionId: c }
explanation:
  correct:
    en: "IAM Access Analyzer policy generation reads the CloudTrail events of a user or role for a chosen period and generates a policy based on the services and actions that were used. The team reviews and tests the generated policy before replacing the broad managed policies, which moves the role toward least privilege."
    fr: "La génération de politiques d'IAM Access Analyzer lit les événements CloudTrail d'un utilisateur ou d'un rôle sur une période choisie et génère une politique fondée sur les services et actions utilisés. L'équipe vérifie et teste la politique générée avant de remplacer les politiques gérées larges, ce qui rapproche le rôle du moindre privilège."
  options:
    a:
      en: "Trusted Advisor checks report general risks such as missing root MFA; they do not build a policy from a role's activity."
      fr: "Les vérifications de Trusted Advisor signalent des risques généraux comme l'absence de MFA sur l'utilisateur racine ; elles ne construisent pas de politique à partir de l'activité d'un rôle."
    b:
      en: "The credential report covers IAM users and their passwords, access keys and MFA, not roles or the actions they used."
      fr: "Le rapport sur les informations d'identification couvre les utilisateurs IAM et leurs mots de passe, clés d'accès et MFA, pas les rôles ni les actions utilisées."
    d:
      en: "A Config rule only flags the attachment; the team would still have to work out the required actions by hand."
      fr: "Une règle Config ne fait que signaler l'attachement ; l'équipe devrait encore déterminer à la main les actions nécessaires."
references:
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
  - title: Security best practices in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html
