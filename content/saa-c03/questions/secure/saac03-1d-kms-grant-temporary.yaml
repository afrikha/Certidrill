id: saac03-1d-kms-grant-temporary
objective: "1.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly batch job that needs to decrypt data with a customer managed AWS KMS key. The job's IAM role must have permission to use the key only while the job runs. The orchestration script must give and remove the permission programmatically at the start and at the end of each run, without editing the key policy or any IAM policy.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute chaque nuit une tâche par lots qui doit déchiffrer des données avec une clé AWS KMS gérée par le client. Le rôle IAM de la tâche ne doit avoir l'autorisation d'utiliser la clé que pendant l'exécution de la tâche. Le script d'orchestration doit accorder et retirer l'autorisation par programmation au début et à la fin de chaque exécution, sans modifier la politique de clé ni aucune politique IAM.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Have the script add the job role to the key policy at the start of the run and remove it at the end.", fr: "Faire ajouter le rôle de la tâche à la politique de clé par le script au début de l'exécution, puis le retirer à la fin." }
    - id: b
      text: { en: "Have the script create a KMS grant that allows Decrypt for the job role at the start of the run and retire the grant at the end.", fr: "Faire créer par le script un octroi KMS qui autorise Decrypt pour le rôle de la tâche au début de l'exécution, puis retirer l'octroi à la fin." }
    - id: c
      text: { en: "Attach an IAM policy to the job role that allows kms:Decrypt with an aws:CurrentTime condition for the nightly window.", fr: "Attacher au rôle de la tâche une politique IAM qui autorise kms:Decrypt avec une condition aws:CurrentTime pour la fenêtre de nuit." }
    - id: d
      text: { en: "Have the script enable the key at the start of the run and disable the key at the end.", fr: "Faire activer la clé par le script au début de l'exécution, puis la désactiver à la fin." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A grant gives a principal permission to use one KMS key for specific operations without changing any policy, and it is deleted by retiring or revoking it. Grants are designed for temporary permissions; a grant token lets the job use the permission immediately despite eventual consistency.
    fr: |
      Un octroi donne à un principal l'autorisation d'utiliser une clé KMS pour des opérations précises sans modifier aucune politique, et il est supprimé en le retirant ou en le révoquant. Les octrois sont conçus pour les autorisations temporaires ; un jeton d'octroi permet à la tâche d'utiliser l'autorisation immédiatement malgré la cohérence à terme.
  options:
    a:
      en: |
        Editing the key policy on each run is exactly what the requirement forbids, and it is error-prone.
      fr: |
        Modifier la politique de clé à chaque exécution est précisément ce que l'exigence interdit, et c'est source d'erreurs.
    c:
      en: |
        A time-window condition is an IAM policy to maintain and does not follow the real start and end of each run.
      fr: |
        Une condition de fenêtre horaire est une politique IAM à maintenir et ne suit pas le début et la fin réels de chaque exécution.
    d:
      en: |
        Disabling the key blocks every user of the key, not only the job role, and does not control which principal can use it.
      fr: |
        Désactiver la clé bloque tous ses utilisateurs, pas seulement le rôle de la tâche, et ne contrôle pas quel principal peut l'utiliser.
references:
  - title: Grants in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/grants.html
