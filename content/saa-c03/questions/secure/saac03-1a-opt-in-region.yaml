id: saac03-1a-opt-in-region
objective: "1.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company in Dubai wants to deploy a new application in the Middle East (UAE) Region to keep latency low for local users. In an existing AWS account, a solutions architect cannot launch any resources in this Region, although the same IAM permissions work in the US East (N. Virginia) Region.

    What should the solutions architect do first?
  fr: |
    Une entreprise de logistique de Dubaï veut déployer une nouvelle application dans la Région Middle East (UAE) pour garder une faible latence pour les utilisateurs locaux. Dans un compte AWS existant, un architecte de solutions ne peut lancer aucune ressource dans cette Région, alors que les mêmes autorisations IAM fonctionnent dans la Région US East (N. Virginia).

    Que doit faire l'architecte de solutions en premier ?
body:
  options:
    - id: a
      text: { en: "Request a service quota increase for Amazon EC2 instances in the Middle East (UAE) Region.", fr: "Demander une augmentation du quota de service pour les instances Amazon EC2 dans la Région Middle East (UAE)." }
    - id: b
      text: { en: "Activate the AWS STS Regional endpoint for the Region in the IAM account settings.", fr: "Activer le point de terminaison Régional AWS STS de la Région dans les paramètres du compte IAM." }
    - id: c
      text: { en: "Enable the Middle East (UAE) Region for the account because it is an opt-in Region.", fr: "Activer la Région Middle East (UAE) pour le compte, car c'est une Région à adhésion (opt-in)." }
    - id: d
      text: { en: "Create a new AWS account in AWS GovCloud (US) and deploy the application there.", fr: "Créer un nouveau compte AWS dans AWS GovCloud (US) et y déployer l'application." }
answer: { optionId: c }
explanation:
  correct:
    en: "Regions introduced after March 20, 2019, such as Middle East (UAE), are disabled by default and must be enabled for the account before they can be used. Once the Region is enabled, AWS STS is activated in it automatically and resources can be launched."
    fr: "Les Régions lancées après le 20 mars 2019, comme Middle East (UAE), sont désactivées par défaut et doivent être activées pour le compte avant toute utilisation. Une fois la Région activée, AWS STS y est activé automatiquement et des ressources peuvent être lancées."
  options:
    a:
      en: "Quotas apply only after the Region is enabled; a disabled Region rejects every request regardless of quotas."
      fr: "Les quotas ne s'appliquent qu'une fois la Région activée ; une Région désactivée rejette toutes les requêtes, quels que soient les quotas."
    b:
      en: "For Regions that must be enabled, STS is activated automatically when the Region is enabled and cannot be activated for a disabled Region."
      fr: "Pour les Régions à activer, STS est activé automatiquement à l'activation de la Région et ne peut pas l'être pour une Région désactivée."
    d:
      en: "AWS GovCloud (US) accounts can use only the two GovCloud (US) Regions, not the Middle East (UAE) Region."
      fr: "Les comptes AWS GovCloud (US) ne peuvent utiliser que les deux Régions GovCloud (US), pas la Région Middle East (UAE)."
references:
  - title: AWS Regions
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html
