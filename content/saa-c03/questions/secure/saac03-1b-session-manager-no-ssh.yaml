id: saac03-1b-session-manager-no-ssh
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Administrators connect to Linux EC2 instances in private subnets through a bastion host that allows TCP 22 from the corporate IP range. The private subnets reach the internet through a NAT gateway. The security team wants to close all inbound ports on every instance, remove the bastion host and the SSH keys, control access with IAM, and log every session to Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Des administrateurs se connectent à des instances EC2 Linux situées dans des sous-réseaux privés via un hôte bastion qui autorise TCP 22 depuis la plage IP de l'entreprise. Les sous-réseaux privés accèdent à Internet par une passerelle NAT. L'équipe de sécurité veut fermer tous les ports entrants sur chaque instance, supprimer l'hôte bastion et les clés SSH, contrôler l'accès avec IAM et journaliser chaque session dans Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use Systems Manager Session Manager with an instance profile that allows Systems Manager, and enable session logging to S3.", fr: "Utiliser Systems Manager Session Manager avec un profil d'instance qui autorise Systems Manager, et activer la journalisation des sessions dans S3." }
    - id: b
      text: { en: "Use EC2 Instance Connect with a public IP address on each instance, and allow TCP 22 from the corporate range.", fr: "Utiliser EC2 Instance Connect avec une adresse IP publique sur chaque instance, et autoriser TCP 22 depuis la plage de l'entreprise." }
    - id: c
      text: { en: "Replace the bastion host with an AWS Client VPN endpoint, and keep the SSH keys and port 22 on the instances.", fr: "Remplacer l'hôte bastion par un point de terminaison AWS Client VPN, et conserver les clés SSH et le port 22 sur les instances." }
    - id: d
      text: { en: "Move the bastion host to a private subnet, and allow TCP 22 on it only from a Network Load Balancer.", fr: "Déplacer l'hôte bastion dans un sous-réseau privé, et n'y autoriser TCP 22 que depuis un Network Load Balancer." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Session Manager opens shell sessions through the SSM Agent, which connects outbound to Systems Manager, so no inbound port, bastion host or SSH key is needed. Access is granted with IAM policies, API calls are recorded in CloudTrail, and session logs can be sent to S3 or CloudWatch Logs.
    fr: |
      Session Manager ouvre des sessions shell par l'intermédiaire de l'agent SSM, qui se connecte en sortie à Systems Manager : aucun port entrant, hôte bastion ni clé SSH n'est nécessaire. L'accès est accordé par des politiques IAM, les appels d'API sont enregistrés dans CloudTrail, et les journaux de session peuvent être envoyés vers S3 ou CloudWatch Logs.
  options:
    b:
      en: |
        This keeps port 22 open and adds public IP addresses, the opposite of the requirement.
      fr: |
        Cette solution garde le port 22 ouvert et ajoute des adresses IP publiques, à l'inverse de l'exigence.
    c:
      en: |
        Client VPN replaces the bastion host but keeps SSH keys and an open port 22 on the instances.
      fr: |
        Client VPN remplace l'hôte bastion mais conserve les clés SSH et un port 22 ouvert sur les instances.
    d:
      en: |
        The bastion host and port 22 remain, and access is still based on SSH keys rather than IAM.
      fr: |
        L'hôte bastion et le port 22 demeurent, et l'accès repose toujours sur des clés SSH plutôt que sur IAM.
references:
  - title: AWS Systems Manager Session Manager
    url: https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html
