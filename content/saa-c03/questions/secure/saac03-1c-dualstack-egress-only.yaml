id: saac03-1c-dualstack-egress-only
objective: "1.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is migrating an application to a dual-stack VPC. The application servers run in private subnets and have both IPv4 addresses and globally unique IPv6 addresses. The servers must reach external APIs over both IPv4 and IPv6. The routing design itself must prevent internet hosts from initiating connections to the servers over either protocol, independently of the security group rules.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre une application vers un VPC double pile. Les serveurs d'application s'exécutent dans des sous-réseaux privés et disposent à la fois d'adresses IPv4 et d'adresses IPv6 globalement uniques. Les serveurs doivent atteindre des API externes en IPv4 et en IPv6. La conception du routage doit elle-même empêcher les hôtes d'Internet d'initier des connexions vers les serveurs dans les deux protocoles, indépendamment des règles des groupes de sécurité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "In the private subnets' route table, route 0.0.0.0/0 to a public NAT gateway and route ::/0 to an egress-only internet gateway."
        fr: "Dans la table de routage des sous-réseaux privés, router 0.0.0.0/0 vers une passerelle NAT publique et ::/0 vers une passerelle Internet de sortie uniquement."
    - id: b
      text:
        en: "In the private subnets' route table, route both 0.0.0.0/0 and ::/0 to an egress-only internet gateway."
        fr: "Dans la table de routage des sous-réseaux privés, router 0.0.0.0/0 et ::/0 vers une passerelle Internet de sortie uniquement."
    - id: c
      text:
        en: "In the private subnets' route table, route 0.0.0.0/0 to a public NAT gateway and route ::/0 to the internet gateway."
        fr: "Dans la table de routage des sous-réseaux privés, router 0.0.0.0/0 vers une passerelle NAT publique et ::/0 vers la passerelle Internet."
    - id: d
      text:
        en: "In the private subnets' route table, route both 0.0.0.0/0 and ::/0 to the internet gateway, and remove all inbound security group rules."
        fr: "Dans la table de routage des sous-réseaux privés, router 0.0.0.0/0 et ::/0 vers la passerelle Internet, et supprimer toutes les règles entrantes des groupes de sécurité."
answer: { optionId: a }
explanation:
  correct:
    en: |
      IPv6 addresses are public by default, so outbound-only IPv6 access uses an egress-only internet gateway, which is stateful and blocks connections initiated from the internet. For IPv4, a NAT gateway provides the same outbound-only behavior. Each protocol needs its own route target.
    fr: |
      Les adresses IPv6 sont publiques par défaut : l'accès IPv6 en sortie uniquement passe par une passerelle Internet de sortie uniquement, qui est avec état et bloque les connexions initiées depuis Internet. Pour IPv4, une passerelle NAT offre le même comportement en sortie uniquement. Chaque protocole a besoin de sa propre cible de route.
  options:
    b:
      en: |
        An egress-only internet gateway is for IPv6 traffic only; IPv4 outbound-only access needs a NAT gateway.
      fr: |
        Une passerelle Internet de sortie uniquement ne sert qu'au trafic IPv6 ; l'accès IPv4 en sortie uniquement exige une passerelle NAT.
    c:
      en: |
        Routing ::/0 to the internet gateway gives the servers' public IPv6 addresses two-way internet reachability, so only security groups would block inbound connections.
      fr: |
        Router ::/0 vers la passerelle Internet rend les adresses IPv6 publiques des serveurs joignables dans les deux sens : seuls les groupes de sécurité bloqueraient alors les connexions entrantes.
    d:
      en: |
        This relies on security group rules, which the requirement explicitly excludes; the routing itself would allow inbound connections.
      fr: |
        Cette option repose sur les règles des groupes de sécurité, ce que l'exigence exclut explicitement ; le routage lui-même autoriserait les connexions entrantes.
references:
  - title: Enable outbound IPv6 traffic using an egress-only internet gateway
    url: https://docs.aws.amazon.com/vpc/latest/userguide/egress-only-internet-gateway.html
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
