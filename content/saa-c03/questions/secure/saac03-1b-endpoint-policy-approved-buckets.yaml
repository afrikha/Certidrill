id: saac03-1b-endpoint-policy-approved-buckets
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Amazon EC2 instances in private subnets access Amazon S3 only through a gateway endpoint. To reduce the risk of data exfiltration, the security team requires that the instances be able to access only the company's three approved buckets, even if the instances' IAM role allows access to other buckets.

    Which solution will meet these requirements?
  fr: |
    Des instances Amazon EC2 situées dans des sous-réseaux privés accèdent à Amazon S3 uniquement par un point de terminaison de passerelle. Pour réduire le risque d'exfiltration de données, l'équipe de sécurité exige que les instances ne puissent accéder qu'aux trois compartiments approuvés de l'entreprise, même si le rôle IAM des instances autorise l'accès à d'autres compartiments.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a bucket policy to each of the three approved buckets that allows access only from the gateway endpoint.", fr: "Ajouter à chacun des trois compartiments approuvés une politique de compartiment qui autorise l'accès uniquement depuis le point de terminaison de passerelle." }
    - id: b
      text: { en: "Add network ACL rules that allow outbound HTTPS only to the IP addresses of the three approved buckets.", fr: "Ajouter des règles d'ACL réseau qui autorisent le HTTPS sortant uniquement vers les adresses IP des trois compartiments approuvés." }
    - id: c
      text: { en: "Change the instances' security group to allow outbound HTTPS only to the S3 prefix list of the Region.", fr: "Modifier le groupe de sécurité des instances pour autoriser le HTTPS sortant uniquement vers la liste de préfixes S3 de la Région." }
    - id: d
      text: { en: "Attach an endpoint policy to the gateway endpoint that allows S3 actions only on the three approved buckets.", fr: "Attacher au point de terminaison de passerelle une politique de point de terminaison qui autorise les actions S3 uniquement sur les trois compartiments approuvés." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      An endpoint policy is a resource-based policy on the VPC endpoint. Access must be allowed by the endpoint policy and by the IAM and bucket policies, so a policy that allows only the three bucket ARNs blocks requests to any other bucket through the endpoint, whatever the role allows.
    fr: |
      Une politique de point de terminaison est une politique basée sur les ressources attachée au point de terminaison de VPC. L'accès doit être autorisé par cette politique et par les politiques IAM et de compartiment : une politique qui n'autorise que les ARN des trois compartiments bloque les requêtes vers tout autre compartiment via le point de terminaison, quoi que le rôle autorise.
  options:
    a:
      en: |
        Bucket policies on the approved buckets do not stop the instances from reaching other buckets, including buckets in other accounts.
      fr: |
        Des politiques sur les compartiments approuvés n'empêchent pas les instances d'atteindre d'autres compartiments, y compris dans d'autres comptes.
    b:
      en: |
        Buckets share the S3 IP address ranges, so IP-based rules cannot isolate individual buckets.
      fr: |
        Les compartiments partagent les plages d'adresses IP de S3 : des règles fondées sur les IP ne peuvent pas isoler des compartiments individuels.
    c:
      en: |
        The S3 prefix list covers every bucket in the Region, so it does not restrict access to the three approved buckets.
      fr: |
        La liste de préfixes S3 couvre tous les compartiments de la Région : elle ne restreint pas l'accès aux trois compartiments approuvés.
references:
  - title: Control access to VPC endpoints using endpoint policies
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-access.html
