id: saac03-1a-cross-account-s3-both-sides
objective: "1.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application runs on Amazon EC2 instances in account A with an instance profile role named AppRole. The application must write objects to an Amazon S3 bucket in account B. The objects are encrypted with SSE-S3. The company wants the application to use the AppRole credentials directly, without assuming another role.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application s'exécute sur des instances Amazon EC2 du compte A avec un rôle de profil d'instance nommé AppRole. L'application doit écrire des objets dans un compartiment (bucket) Amazon S3 du compte B. Les objets sont chiffrés avec SSE-S3. L'entreprise veut que l'application utilise directement les informations d'identification d'AppRole, sans endosser d'autre rôle.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a statement to the bucket policy in account B that allows AppRole to call s3:PutObject on the bucket.", fr: "Ajouter à la politique de compartiment du compte B une instruction qui autorise AppRole à appeler s3:PutObject sur le compartiment." } }
    - { id: b, text: { en: "Create a role in account B whose trust policy trusts AppRole, and give that role s3:PutObject on the bucket.", fr: "Créer dans le compte B un rôle dont la politique d'approbation approuve AppRole, et donner à ce rôle s3:PutObject sur le compartiment." } }
    - { id: c, text: { en: "Add s3:PutObject on the bucket in account B to the identity-based policy of AppRole in account A.", fr: "Ajouter s3:PutObject sur le compartiment du compte B à la politique basée sur l'identité d'AppRole dans le compte A." } }
    - { id: d, text: { en: "Attach an SCP to account A that allows s3:PutObject on the bucket in account B for all principals.", fr: "Attacher au compte A une SCP qui autorise s3:PutObject sur le compartiment du compte B pour tous les principaux." } }
    - { id: e, text: { en: "Share the bucket with account A through a resource share in AWS Resource Access Manager (AWS RAM).", fr: "Partager le compartiment avec le compte A via un partage de ressources AWS Resource Access Manager (AWS RAM)." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A cross-account request is allowed only if both accounts allow it: the identity-based policy of AppRole in account A must allow the S3 action on the bucket, and the bucket policy in account B must allow AppRole. With SSE-S3, no KMS key policy is involved."
    fr: "Une requête intercompte n'est autorisée que si les deux comptes l'autorisent : la politique basée sur l'identité d'AppRole dans le compte A doit autoriser l'action S3 sur le compartiment, et la politique de compartiment du compte B doit autoriser AppRole. Avec SSE-S3, aucune politique de clé KMS n'intervient."
  options:
    b:
      en: "A role in account B is the alternative design based on role assumption, which the company explicitly does not want."
      fr: "Un rôle dans le compte B correspond à l'autre conception, fondée sur l'endossement de rôle, que l'entreprise exclut explicitement."
    d:
      en: "SCPs never grant permissions; they only limit the maximum permissions of the accounts they apply to."
      fr: "Les SCP n'accordent jamais d'autorisations ; elles limitent seulement les autorisations maximales des comptes auxquels elles s'appliquent."
    e:
      en: "Cross-account access to an S3 bucket is granted with the bucket policy, not by sharing the bucket through AWS RAM."
      fr: "L'accès intercompte à un compartiment S3 s'accorde avec la politique de compartiment, pas en partageant le compartiment via AWS RAM."
references:
  - title: Cross-account policy evaluation logic
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic-cross-account.html
