id: saac03-1c-alb-cognito-social
objective: "1.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A fitness company runs a members-only web application on Amazon EC2 instances behind an Application Load Balancer (ALB) with an HTTPS listener. The company wants members to sign in with their existing social media accounts before any request reaches the application. The development team cannot change the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de fitness exécute une application web réservée aux membres sur des instances Amazon EC2 derrière un Application Load Balancer (ALB) doté d'un écouteur HTTPS. L'entreprise veut que les membres se connectent avec leurs comptes de réseaux sociaux existants avant qu'une requête n'atteigne l'application. L'équipe de développement ne peut pas modifier le code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon Cognito identity pool for the social identity providers, and have the application exchange member tokens for temporary AWS credentials."
        fr: "Créer un groupe d'identités Amazon Cognito pour les fournisseurs d'identité sociaux, et faire échanger par l'application les jetons des membres contre des informations d'identification AWS temporaires."
    - id: b
      text:
        en: "Create an Amazon Cognito user pool federated with the social identity providers, and add an authenticate-cognito action to the ALB HTTPS listener rules."
        fr: "Créer un groupe d'utilisateurs Amazon Cognito fédéré avec les fournisseurs d'identité sociaux, et ajouter une action authenticate-cognito aux règles de l'écouteur HTTPS de l'ALB."
    - id: c
      text:
        en: "Put an Amazon API Gateway REST API in front of the ALB and write an AWS Lambda authorizer that validates the social media tokens."
        fr: "Placer une API REST Amazon API Gateway devant l'ALB et écrire un mécanisme d'autorisation AWS Lambda qui valide les jetons des réseaux sociaux."
    - id: d
      text:
        en: "Associate an AWS WAF web ACL with the ALB that blocks requests without a valid social media session cookie."
        fr: "Associer à l'ALB une liste ACL web AWS WAF qui bloque les requêtes dépourvues de cookie de session de réseau social valide."
answer: { optionId: b }
explanation:
  correct:
    en: |
      An ALB HTTPS listener can authenticate users with an `authenticate-cognito` action before forwarding requests. A Cognito user pool federates with social identity providers, and the ALB passes the user claims to the targets in headers, so the application needs no change.
    fr: |
      Un écouteur HTTPS d'ALB peut authentifier les utilisateurs avec une action `authenticate-cognito` avant de transmettre les requêtes. Un groupe d'utilisateurs Cognito se fédère avec des fournisseurs d'identité sociaux, et l'ALB transmet les revendications de l'utilisateur aux cibles dans des en-têtes : l'application n'a pas besoin d'être modifiée.
  options:
    a:
      en: |
        An identity pool issues temporary AWS credentials to already authenticated users; the application would need new code to handle the tokens, and nothing would authenticate requests at the ALB.
      fr: |
        Un groupe d'identités délivre des informations d'identification AWS temporaires à des utilisateurs déjà authentifiés ; l'application aurait besoin de nouveau code pour gérer les jetons, et rien n'authentifierait les requêtes au niveau de l'ALB.
    c:
      en: |
        A Lambda authorizer requires custom token validation code and adds another tier; the ALB can do the authentication itself.
      fr: |
        Un mécanisme d'autorisation Lambda exige du code de validation de jetons personnalisé et ajoute un niveau supplémentaire ; l'ALB peut réaliser l'authentification lui-même.
    d:
      en: |
        AWS WAF can inspect cookies but cannot run a sign-in flow or validate a social login session.
      fr: |
        AWS WAF peut inspecter des cookies, mais ne peut ni exécuter un parcours de connexion ni valider une session de connexion sociale.
references:
  - title: Authenticate users using an Application Load Balancer
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html
