id: saac03-1a-deny-without-mfa
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company still has IAM users for a team of contractors. The users have console passwords and access keys. The security team wants a policy attached to the users' group that blocks all actions, except the actions needed to set up an MFA device, whenever a request is not MFA-authenticated. Requests made directly with the users' long-term access keys must also be blocked.

    Which statement should the policy contain?
  fr: |
    Une entreprise a encore des utilisateurs IAM pour une équipe de prestataires. Les utilisateurs ont des mots de passe de console et des clés d'accès. L'équipe de sécurité veut attacher au groupe des utilisateurs une politique qui bloque toutes les actions, sauf celles nécessaires pour configurer un appareil MFA, chaque fois qu'une requête n'est pas authentifiée par MFA. Les requêtes effectuées directement avec les clés d'accès à long terme des utilisateurs doivent aussi être bloquées.

    Quelle instruction la politique doit-elle contenir ?
body:
  options:
    - id: a
      text: { en: "A Deny statement with NotAction for the MFA setup actions and a Bool condition where aws:MultiFactorAuthPresent is false.", fr: "Une instruction Deny avec NotAction pour les actions de configuration MFA et une condition Bool où aws:MultiFactorAuthPresent vaut false." }
    - id: b
      text: { en: "An Allow statement for all actions with a BoolIfExists condition where aws:MultiFactorAuthPresent is true.", fr: "Une instruction Allow pour toutes les actions avec une condition BoolIfExists où aws:MultiFactorAuthPresent vaut true." }
    - id: c
      text: { en: "A Deny statement with NotAction for the MFA setup actions and a BoolIfExists condition where aws:MultiFactorAuthPresent is false.", fr: "Une instruction Deny avec NotAction pour les actions de configuration MFA et une condition BoolIfExists où aws:MultiFactorAuthPresent vaut false." }
    - id: d
      text: { en: "A Deny statement with NotAction for the MFA setup actions and a NumericGreaterThan condition on aws:MultiFactorAuthAge.", fr: "Une instruction Deny avec NotAction pour les actions de configuration MFA et une condition NumericGreaterThan sur aws:MultiFactorAuthAge." }
answer: { optionId: c }
explanation:
  correct:
    en: "Requests signed with long-term access keys may not contain the aws:MultiFactorAuthPresent key. With BoolIfExists, a missing key makes the condition true, so the Deny applies both to sessions without MFA and to requests made with access keys; once the user authenticates with MFA, the key is true and the Deny does not apply."
    fr: "Les requêtes signées avec des clés d'accès à long terme peuvent ne pas contenir la clé aws:MultiFactorAuthPresent. Avec BoolIfExists, une clé absente rend la condition vraie : le Deny s'applique à la fois aux sessions sans MFA et aux requêtes faites avec des clés d'accès ; une fois l'utilisateur authentifié par MFA, la clé vaut true et le Deny ne s'applique pas."
  options:
    a:
      en: "With Bool, a missing key does not match, so requests made with long-term access keys would not be denied."
      fr: "Avec Bool, une clé absente ne correspond pas : les requêtes faites avec des clés d'accès à long terme ne seraient pas refusées."
    b:
      en: "BoolIfExists with true would also match requests that lack the key, so this Allow would grant everything to long-term access keys without MFA."
      fr: "BoolIfExists avec true correspondrait aussi aux requêtes sans la clé : cette instruction Allow accorderait tout aux clés d'accès à long terme sans MFA."
    d:
      en: "aws:MultiFactorAuthAge is absent when MFA was not used, so a numeric condition on it does not match those requests and the Deny would not apply."
      fr: "aws:MultiFactorAuthAge est absente quand la MFA n'a pas été utilisée : une condition numérique sur cette clé ne correspond pas à ces requêtes et le Deny ne s'appliquerait pas."
references:
  - title: "AWS: Allows MFA-authenticated IAM users to manage their own credentials on the Security credentials page"
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_examples_aws_my-sec-creds-self-manage.html
  - title: Secure API access with MFA
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa_configure-api-require.html
