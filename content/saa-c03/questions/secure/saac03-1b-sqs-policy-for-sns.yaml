id: saac03-1b-sqs-policy-for-sns
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company subscribes an Amazon SQS standard queue to an Amazon SNS topic in the same account. The queue is not encrypted. Messages that are published to the topic never arrive in the queue. The company wants to fix the issue while following the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    Une entreprise abonne une file d'attente Amazon SQS standard à une rubrique Amazon SNS du même compte. La file d'attente n'est pas chiffrée. Les messages publiés dans la rubrique n'arrivent jamais dans la file d'attente. L'entreprise veut corriger le problème en respectant le principe du moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a queue policy statement that allows sqs:SendMessage for sns.amazonaws.com with aws:SourceArn set to the topic ARN.", fr: "Ajouter à la politique de la file d'attente une instruction qui autorise sqs:SendMessage pour sns.amazonaws.com avec aws:SourceArn égal à l'ARN de la rubrique." }
    - id: b
      text: { en: "Add a statement to the queue policy that allows sqs:* for every principal (\"*\") without any condition.", fr: "Ajouter à la politique de la file d'attente une instruction qui autorise sqs:* pour tous les principaux (« * ») sans condition." }
    - id: c
      text: { en: "Attach an IAM policy that allows sqs:SendMessage on the queue to the IAM user who created the SNS topic.", fr: "Attacher à l'utilisateur IAM qui a créé la rubrique une politique IAM qui autorise sqs:SendMessage sur la file d'attente." }
    - id: d
      text: { en: "Add a statement to the topic policy that allows sqs:ReceiveMessage on the queue ARN for the SNS service principal.", fr: "Ajouter à la politique de la rubrique une instruction qui autorise sqs:ReceiveMessage sur la file d'attente pour le principal de service SNS." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SNS delivers to SQS as the sns.amazonaws.com service principal, so the queue's access policy must allow sqs:SendMessage for that principal. The aws:SourceArn condition limits the grant to this topic and protects against the confused deputy problem.
    fr: |
      SNS livre les messages à SQS en tant que principal de service sns.amazonaws.com : la politique d'accès de la file d'attente doit donc autoriser sqs:SendMessage pour ce principal. La condition aws:SourceArn limite l'autorisation à cette rubrique et protège contre le problème de l'adjoint confus (confused deputy).
  options:
    b:
      en: |
        Allowing every action to every principal works but makes the queue public, which violates least privilege.
      fr: |
        Autoriser toutes les actions à tous les principaux fonctionne, mais rend la file d'attente publique, ce qui viole le moindre privilège.
    c:
      en: |
        Messages are sent by the SNS service, not by the user who created the topic, so the user's permissions do not matter.
      fr: |
        Les messages sont envoyés par le service SNS, et non par l'utilisateur qui a créé la rubrique : les autorisations de cet utilisateur n'ont pas d'importance.
    d:
      en: |
        The permission belongs on the queue, and SNS needs to send messages, not receive them.
      fr: |
        L'autorisation doit figurer sur la file d'attente, et SNS doit envoyer des messages, pas les recevoir.
references:
  - title: Subscribing an Amazon SQS queue to an Amazon SNS topic
    url: https://docs.aws.amazon.com/sns/latest/dg/subscribe-sqs-queue-to-sns-topic.html
