id: saac03-1c-waf-rate-login-scope
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online banking portal is served through an Amazon CloudFront distribution with an Application Load Balancer as the origin. The `/login` page is receiving an HTTP request flood from thousands of IP addresses in many countries, which locks out legitimate customers. Customers in all countries must keep access to the portal.

    The company needs to limit how many requests each client IP address can send to the `/login` path without affecting the rest of the site, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Un portail bancaire en ligne est servi par une distribution Amazon CloudFront dont l'origine est un Application Load Balancer. La page `/login` reçoit une inondation de requêtes HTTP provenant de milliers d'adresses IP dans de nombreux pays, ce qui bloque l'accès des clients légitimes. Les clients de tous les pays doivent conserver l'accès au portail.

    L'entreprise doit limiter le nombre de requêtes que chaque adresse IP cliente peut envoyer au chemin `/login` sans affecter le reste du site, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Add deny rules for the attacking IP addresses to the network ACL of the subnets that contain the load balancer."
        fr: "Ajouter des règles de refus pour les adresses IP attaquantes dans l'ACL réseau des sous-réseaux qui contiennent l'équilibreur de charge."
    - id: b
      text:
        en: "Configure CloudFront geographic restrictions to block the countries where most of the attacking IP addresses are located."
        fr: "Configurer les restrictions géographiques de CloudFront pour bloquer les pays où se trouvent la plupart des adresses IP attaquantes."
    - id: c
      text:
        en: "Enable AWS Shield Standard on the distribution so that it rate limits requests sent to the login page."
        fr: "Activer AWS Shield Standard sur la distribution pour qu'il limite le débit des requêtes envoyées à la page de connexion."
    - id: d
      text:
        en: "Add a rate-based rule that aggregates by IP address with a scope-down statement on the `/login` URI path to a web ACL on the distribution."
        fr: "Ajouter à une liste ACL web de la distribution une règle basée sur le débit, agrégée par adresse IP, avec une instruction de restriction sur le chemin d'URI `/login`."
answer: { optionId: d }
explanation:
  correct:
    en: |
      An AWS WAF rate-based rule counts requests per aggregation key (here the client IP address) over its evaluation window and blocks the keys that exceed the limit. A scope-down statement restricts counting to requests whose URI path is `/login`, so the rest of the site is not affected, and AWS WAF manages the blocked IP list automatically.
    fr: |
      Une règle AWS WAF basée sur le débit compte les requêtes par clé d'agrégation (ici l'adresse IP cliente) sur sa fenêtre d'évaluation et bloque les clés qui dépassent la limite. Une instruction de restriction (scope-down) limite le comptage aux requêtes dont le chemin d'URI est `/login`, ce qui n'affecte pas le reste du site, et AWS WAF gère automatiquement la liste des adresses IP bloquées.
  options:
    a:
      en: |
        Behind CloudFront, the load balancer sees CloudFront addresses, not the clients' addresses. Network ACLs also hold a limited number of rules and would need constant manual updates for thousands of changing IP addresses.
      fr: |
        Derrière CloudFront, l'équilibreur de charge voit les adresses de CloudFront, pas celles des clients. De plus, les ACL réseau contiennent un nombre limité de règles et demanderaient des mises à jour manuelles constantes pour des milliers d'adresses IP changeantes.
    b:
      en: |
        Blocking whole countries would also block legitimate customers, which violates the requirement that customers in all countries keep access.
      fr: |
        Bloquer des pays entiers bloquerait aussi des clients légitimes, ce qui contredit l'exigence d'accès pour les clients de tous les pays.
    c:
      en: |
        Shield Standard is always on and mitigates common layer 3 and layer 4 attacks; it offers no per-path, per-IP rate limiting of HTTP requests.
      fr: |
        Shield Standard est toujours actif et atténue les attaques courantes des couches 3 et 4 ; il n'offre aucune limitation de débit des requêtes HTTP par chemin et par adresse IP.
references:
  - title: Using rate-based rule statements in AWS WAF
    url: https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html
  - title: Restrict the geographic distribution of your content
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/georestrictions.html
