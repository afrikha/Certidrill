id: saac03-1d-s3-replication-time-control
objective: "1.3.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial company replicates trade confirmation files from an Amazon S3 bucket in one AWS Region to a bucket in another Region. A regulator requires that new files be replicated within 15 minutes under a service level agreement, and the operations team must receive an event whenever a file takes longer than that.

    The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise financière réplique des fichiers de confirmation d'opérations d'un compartiment Amazon S3 d'une Région AWS vers un compartiment d'une autre Région. Un régulateur exige que les nouveaux fichiers soient répliqués en moins de 15 minutes dans le cadre d'un contrat de niveau de service, et l'équipe d'exploitation doit recevoir un événement chaque fois qu'un fichier dépasse ce délai.

    L'entreprise souhaite la solution présentant le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 Replication Time Control (S3 RTC) on the replication rule and subscribe to the OperationMissedThreshold event.", fr: "Activer S3 Replication Time Control (S3 RTC) sur la règle de réplication et s'abonner à l'événement OperationMissedThreshold." }
    - id: b
      text: { en: "Run an S3 Batch Replication job every 15 minutes and alert the team when a job reports failed objects.", fr: "Exécuter un travail S3 Batch Replication toutes les 15 minutes et alerter l'équipe lorsqu'un travail signale des objets en échec." }
    - id: c
      text: { en: "Enable S3 Transfer Acceleration on both buckets and create an Amazon CloudWatch alarm on the replication latency.", fr: "Activer S3 Transfer Acceleration sur les deux compartiments et créer une alarme Amazon CloudWatch sur la latence de réplication." }
    - id: d
      text: { en: "Invoke an AWS Lambda function on each PUT event that copies the object to the other Region and publishes delays to Amazon SNS.", fr: "Appeler à chaque événement PUT une fonction AWS Lambda qui copie l'objet vers l'autre Région et publie les retards dans Amazon SNS." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      S3 RTC replicates most new objects in seconds and the large majority within 15 minutes, backed by an SLA. It automatically enables S3 Replication metrics and S3 Event Notifications such as OperationMissedThreshold, which fires when an object exceeds the 15-minute threshold.
    fr: |
      S3 RTC réplique la plupart des nouveaux objets en quelques secondes et la grande majorité en moins de 15 minutes, avec un contrat de niveau de service. Il active automatiquement les métriques de réplication S3 et des notifications d'événements S3 comme OperationMissedThreshold, émis lorsqu'un objet dépasse le seuil de 15 minutes.
  options:
    b:
      en: |
        Batch Replication is an on-demand job for existing or failed objects; S3 RTC and its SLA do not apply to it.
      fr: |
        Batch Replication est un travail à la demande pour les objets existants ou en échec ; S3 RTC et son contrat de niveau de service ne s'y appliquent pas.
    c:
      en: |
        Transfer Acceleration speeds up client transfers to a bucket; it gives no replication SLA and no threshold events.
      fr: |
        Transfer Acceleration accélère les transferts des clients vers un compartiment ; il n'apporte ni contrat de niveau de service de réplication ni événements de seuil.
    d:
      en: |
        A custom Lambda copy has no SLA and adds code to maintain, which is not the least operational overhead.
      fr: |
        Une copie personnalisée par Lambda n'a pas de contrat de niveau de service et ajoute du code à maintenir, ce qui n'est pas la charge opérationnelle la plus faible.
references:
  - title: Meeting compliance requirements with S3 Replication Time Control
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-time-control.html
