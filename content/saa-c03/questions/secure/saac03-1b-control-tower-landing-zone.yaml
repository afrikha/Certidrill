id: saac03-1b-control-tower-landing-zone
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is planning a new multi-account AWS environment. It needs a dedicated account for centralized logs, a dedicated account for security audits, single sign-on for its engineers, and preconfigured governance rules that are applied automatically to every new account. The company wants to set up and operate this environment with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une start-up prépare un nouvel environnement AWS multicompte. Elle a besoin d'un compte dédié aux journaux centralisés, d'un compte dédié aux audits de sécurité, de l'authentification unique pour ses ingénieurs et de règles de gouvernance préconfigurées appliquées automatiquement à chaque nouveau compte. L'entreprise veut mettre en place et exploiter cet environnement avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create the organization and accounts manually in AWS Organizations, then write SCPs and AWS Config rules for each new account.", fr: "Créer manuellement l'organisation et les comptes dans AWS Organizations, puis écrire des SCP et des règles AWS Config pour chaque nouveau compte." }
    - id: b
      text: { en: "Set up a landing zone with AWS Control Tower and provision every new account with Account Factory.", fr: "Mettre en place une zone d'atterrissage (landing zone) avec AWS Control Tower et provisionner chaque nouveau compte avec Account Factory." }
    - id: c
      text: { en: "Use AWS CloudFormation StackSets to deploy IAM users with the same password policy in each account.", fr: "Utiliser AWS CloudFormation StackSets pour déployer dans chaque compte des utilisateurs IAM avec la même politique de mots de passe." }
    - id: d
      text: { en: "Publish an account template in AWS Service Catalog and create IAM users in each account for the engineers.", fr: "Publier un modèle de compte dans AWS Service Catalog et créer des utilisateurs IAM dans chaque compte pour les ingénieurs." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Control Tower builds a well-architected landing zone by orchestrating AWS Organizations, IAM Identity Center and AWS Service Catalog. It creates the shared log archive and audit accounts, enables controls (guardrails), and Account Factory provisions new accounts with those controls already applied.
    fr: |
      AWS Control Tower crée une zone d'atterrissage conforme aux bonnes pratiques en orchestrant AWS Organizations, IAM Identity Center et AWS Service Catalog. Il crée les comptes partagés d'archive des journaux et d'audit, active des contrôles (garde-fous), et Account Factory provisionne les nouveaux comptes avec ces contrôles déjà appliqués.
  options:
    a:
      en: |
        Building and maintaining the structure and the rules by hand for each account is exactly the overhead that Control Tower removes.
      fr: |
        Construire et maintenir à la main la structure et les règles pour chaque compte représente exactement la charge que Control Tower supprime.
    c:
      en: |
        StackSets deploy resources into existing accounts but do not create the landing zone, and IAM users per account do not provide single sign-on.
      fr: |
        StackSets déploie des ressources dans des comptes existants mais ne crée pas la zone d'atterrissage, et des utilisateurs IAM par compte n'offrent pas d'authentification unique.
    d:
      en: |
        A Service Catalog template alone does not create the log and audit accounts or the governance controls, and IAM users are not single sign-on.
      fr: |
        Un modèle Service Catalog seul ne crée ni les comptes de journaux et d'audit ni les contrôles de gouvernance, et des utilisateurs IAM ne constituent pas une authentification unique.
references:
