id: saac03-1a-root-only-task
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's administrators sign in with an IAM role that has the AdministratorAccess policy. They need to complete several tasks in a standalone AWS account that is not part of an organization.

    Which task requires the administrators to sign in as the root user?
  fr: |
    Les administrateurs d'une entreprise se connectent avec un rôle IAM doté de la politique AdministratorAccess. Ils doivent effectuer plusieurs tâches dans un compte AWS autonome qui ne fait partie d'aucune organisation.

    Quelle tâche oblige les administrateurs à se connecter en tant qu'utilisateur racine ?
body:
  options:
    - id: a
      text: { en: "Creating an IAM role for Amazon EC2 instances.", fr: "Créer un rôle IAM pour des instances Amazon EC2." }
    - id: b
      text: { en: "Enabling a multi-Region AWS CloudTrail trail.", fr: "Activer un journal de suivi AWS CloudTrail multirégion." }
    - id: c
      text: { en: "Configuring MFA Delete on an Amazon S3 bucket.", fr: "Configurer MFA Delete sur un compartiment (bucket) Amazon S3." }
    - id: d
      text: { en: "Attaching a permissions boundary to an IAM user.", fr: "Attacher une limite d'autorisations à un utilisateur IAM." }
answer: { optionId: c }
explanation:
  correct:
    en: "Configuring MFA Delete on an S3 bucket is one of the tasks that only the root user can perform. Other root-only tasks include changing the account settings of a standalone account, closing the account and editing a bucket policy that denies all principals."
    fr: "Configurer MFA Delete sur un compartiment S3 fait partie des tâches que seul l'utilisateur racine peut effectuer. Parmi les autres tâches réservées à l'utilisateur racine figurent la modification des paramètres d'un compte autonome, la fermeture du compte et la modification d'une politique de compartiment qui refuse tous les principaux."
  options:
    a:
      en: "Creating roles is an IAM action that any principal with the right IAM permissions can perform."
      fr: "Créer des rôles est une action IAM que tout principal disposant des autorisations IAM nécessaires peut effectuer."
    b:
      en: "Creating a trail requires CloudTrail permissions, which AdministratorAccess includes."
      fr: "Créer un journal de suivi exige des autorisations CloudTrail, incluses dans AdministratorAccess."
    d:
      en: "Setting a permissions boundary is an IAM action available to administrators with IAM permissions."
      fr: "Définir une limite d'autorisations est une action IAM accessible aux administrateurs disposant d'autorisations IAM."
references:
  - title: AWS account root user
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html
