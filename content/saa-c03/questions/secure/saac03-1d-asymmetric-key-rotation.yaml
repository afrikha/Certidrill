id: saac03-1d-asymmetric-key-rotation
objective: "1.3.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A software company signs its release packages with an asymmetric RSA AWS KMS key. The signing service references the key through the alias alias/release-signing. A new policy requires the signing key to be rotated every year. The company's verification service calls the AWS KMS Verify operation for customers, and it must still be able to verify packages that were signed before a rotation.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de logiciels signe ses paquets de publication avec une clé AWS KMS RSA asymétrique. Le service de signature référence la clé par l'alias alias/release-signing. Une nouvelle politique impose une rotation annuelle de la clé de signature. Le service de vérification de l'entreprise appelle l'opération Verify d'AWS KMS pour les clients, et il doit toujours pouvoir vérifier les paquets signés avant une rotation.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable automatic key rotation on the asymmetric key with a rotation period of 365 days.", fr: "Activer la rotation automatique de la clé asymétrique avec une période de rotation de 365 jours." }
    - id: b
      text: { en: "Call the on-demand rotation operation on the asymmetric key once a year.", fr: "Appeler une fois par an l'opération de rotation à la demande sur la clé asymétrique." }
    - id: c
      text: { en: "Each year, create a new asymmetric key, point the alias to it, and schedule the deletion of the previous key.", fr: "Chaque année, créer une nouvelle clé asymétrique, faire pointer l'alias vers elle et planifier la suppression de la clé précédente." }
    - id: d
      text: { en: "Each year, create a new asymmetric key, point the alias to it, and keep the previous key enabled for verification.", fr: "Chaque année, créer une nouvelle clé asymétrique, faire pointer l'alias vers elle et garder la clé précédente activée pour la vérification." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Asymmetric KMS keys support neither automatic nor on-demand rotation, so they are rotated manually by creating a new key and updating the alias. The previous key must stay enabled, because Verify with an asymmetric key needs the key that created the signature, identified by its key ID.
    fr: |
      Les clés KMS asymétriques ne prennent en charge ni la rotation automatique ni la rotation à la demande : leur rotation est manuelle, en créant une nouvelle clé et en mettant à jour l'alias. La clé précédente doit rester activée, car Verify avec une clé asymétrique exige la clé qui a créé la signature, identifiée par son ID de clé.
  options:
    a:
      en: |
        Automatic rotation applies only to symmetric encryption keys with AWS KMS generated key material, not to asymmetric keys.
      fr: |
        La rotation automatique ne s'applique qu'aux clés de chiffrement symétriques dont le matériel de clé est généré par AWS KMS, pas aux clés asymétriques.
    b:
      en: |
        On-demand rotation is not supported for asymmetric keys.
      fr: |
        La rotation à la demande n'est pas prise en charge pour les clés asymétriques.
    c:
      en: |
        After the previous key is deleted, the Verify operation can no longer check the packages that this key signed.
      fr: |
        Une fois la clé précédente supprimée, l'opération Verify ne peut plus contrôler les paquets que cette clé a signés.
references:
  - title: Rotate keys manually
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys-manually.html
  - title: Rotate AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html
