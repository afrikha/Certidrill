id: saac03-1a-root-usage-alerts
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's security team must be alerted within minutes whenever the root user of any production account signs in or makes an API call. The alerts must go to the team's email distribution list.

    Which solutions will meet these requirements? (Choose two.)
  fr: |
    L'équipe de sécurité d'une entreprise doit être alertée en quelques minutes chaque fois que l'utilisateur racine d'un compte de production se connecte ou effectue un appel d'API. Les alertes doivent être envoyées à la liste de diffusion de l'équipe.

    Quelles solutions répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an Amazon EventBridge rule that matches root user activity recorded by CloudTrail and sends it to an Amazon SNS topic.", fr: "Créer une règle Amazon EventBridge qui détecte l'activité de l'utilisateur racine enregistrée par CloudTrail et l'envoie à une rubrique Amazon SNS." } }
    - { id: b, text: { en: "Generate the IAM credential report every day and email the password_last_used value of the root user.", fr: "Générer chaque jour le rapport sur les informations d'identification IAM et envoyer par e-mail la valeur password_last_used de l'utilisateur racine." } }
    - { id: c, text: { en: "Enable Amazon GuardDuty and send its root credential usage findings to an Amazon SNS topic through EventBridge.", fr: "Activer Amazon GuardDuty et envoyer ses résultats d'utilisation des informations d'identification racine à une rubrique Amazon SNS via EventBridge." } }
    - { id: d, text: { en: "Turn on the AWS Trusted Advisor check for root MFA and subscribe the team to its weekly email.", fr: "Activer la vérification AWS Trusted Advisor de la MFA racine et abonner l'équipe à son e-mail hebdomadaire." } }
    - { id: e, text: { en: "Create an IAM Access Analyzer unused access analyzer and review its findings for the root user.", fr: "Créer un analyseur d'accès inutilisé IAM Access Analyzer et examiner ses résultats pour l'utilisateur racine." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "AWS recommends detecting root credential use with an EventBridge rule that notifies security staff through Amazon SNS, or with the GuardDuty finding for root credential usage, which can also be routed to SNS. Both react to events within minutes."
    fr: "AWS recommande de détecter l'utilisation des informations d'identification racine avec une règle EventBridge qui prévient l'équipe de sécurité via Amazon SNS, ou avec le résultat GuardDuty d'utilisation des informations d'identification racine, qui peut aussi être acheminé vers SNS. Les deux réagissent aux événements en quelques minutes."
  options:
    b:
      en: "A daily report is not an alert within minutes, and it covers only sign-ins with the password, not every API call."
      fr: "Un rapport quotidien n'est pas une alerte en quelques minutes, et il ne couvre que les connexions par mot de passe, pas chaque appel d'API."
    d:
      en: "This check reports whether MFA is enabled on the root user; it does not detect sign-ins or API calls."
      fr: "Cette vérification indique si la MFA est activée sur l'utilisateur racine ; elle ne détecte ni les connexions ni les appels d'API."
    e:
      en: "Unused access analyzers report unused roles, users and permissions; they do not alert on root activity."
      fr: "Les analyseurs d'accès inutilisé signalent les rôles, utilisateurs et autorisations inutilisés ; ils n'alertent pas sur l'activité racine."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
