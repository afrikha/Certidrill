id: saac03-1c-backup-airgapped-vault
objective: "1.3.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company backs up its Amazon EC2 instances and Amazon EBS volumes with AWS Backup in a production account. To prepare for a ransomware incident, the company requires that backups cannot be deleted before their retention ends by anyone, including the root user of the production account. If the production account is compromised, a separate recovery account must be able to restore directly from the backups without first copying them.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise sauvegarde ses instances Amazon EC2 et ses volumes Amazon EBS avec AWS Backup dans un compte de production. Pour se préparer à un incident de rançongiciel, l'entreprise exige que personne, y compris l'utilisateur racine du compte de production, ne puisse supprimer les sauvegardes avant la fin de leur conservation. Si le compte de production est compromis, un compte de récupération distinct doit pouvoir restaurer directement à partir des sauvegardes sans les copier au préalable.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text:
        en: "Copy the backups to a logically air-gapped vault, and share the vault with the recovery account through AWS Resource Access Manager (AWS RAM)."
        fr: "Copier les sauvegardes dans un coffre isolé logiquement (logically air-gapped vault), et partager ce coffre avec le compte de récupération par AWS Resource Access Manager (AWS RAM)."
    - id: b
      text:
        en: "Apply AWS Backup Vault Lock in governance mode to the backup vault in the production account."
        fr: "Appliquer AWS Backup Vault Lock en mode gouvernance au coffre de sauvegarde du compte de production."
    - id: c
      text:
        en: "Apply AWS Backup Vault Lock in compliance mode to the backup vault in the production account, and copy the backups to the recovery account before each restore."
        fr: "Appliquer AWS Backup Vault Lock en mode conformité au coffre de sauvegarde du compte de production, et copier les sauvegardes dans le compte de récupération avant chaque restauration."
    - id: d
      text:
        en: "Create a Recycle Bin retention rule for EBS snapshots and AMIs in the production account."
        fr: "Créer une règle de conservation de la Corbeille (Recycle Bin) pour les instantanés EBS et les AMI dans le compte de production."
answer: { optionId: a }
explanation:
  correct:
    en: |
      A logically air-gapped vault stores backups in an AWS Backup service-owned account and is always locked with Vault Lock in compliance mode, so no user, including the root user, can delete backups early. It can be shared with other accounts through AWS RAM, and the recipient account can restore directly from it.
    fr: |
      Un coffre isolé logiquement stocke les sauvegardes dans un compte détenu par le service AWS Backup et est toujours verrouillé par Vault Lock en mode conformité : aucun utilisateur, y compris l'utilisateur racine, ne peut supprimer les sauvegardes avant terme. Il peut être partagé avec d'autres comptes par AWS RAM, et le compte destinataire peut restaurer directement à partir de ce coffre.
  options:
    b:
      en: |
        In governance mode, users with sufficient IAM permissions can still change or remove the lock and delete backups.
      fr: |
        En mode gouvernance, des utilisateurs disposant d'autorisations IAM suffisantes peuvent encore modifier ou retirer le verrou et supprimer des sauvegardes.
    c:
      en: |
        Compliance mode makes the backups immutable, but restoring from the recovery account first requires a copy, which the company wants to avoid and which adds steps during an incident.
      fr: |
        Le mode conformité rend les sauvegardes immuables, mais restaurer depuis le compte de récupération exige d'abord une copie, ce que l'entreprise veut éviter et qui ajoute des étapes pendant un incident.
    d:
      en: |
        Recycle Bin only retains deleted resources inside the same account; it does not give another account restore access.
      fr: |
        La Corbeille ne conserve les ressources supprimées que dans le même compte ; elle ne donne pas à un autre compte un accès en restauration.
references:
  - title: Logically air-gapped vault
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
