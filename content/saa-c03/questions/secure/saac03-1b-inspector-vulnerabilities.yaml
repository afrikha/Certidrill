id: saac03-1b-inspector-vulnerabilities
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs workloads on Amazon EC2 instances, stores container images in Amazon ECR, and uses AWS Lambda functions. The security team needs continuous, automated detection of known software vulnerabilities (CVEs) in these resources. Resources must be rescanned automatically when a new CVE is published or a package changes.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute des charges de travail sur des instances Amazon EC2, stocke des images de conteneur dans Amazon ECR et utilise des fonctions AWS Lambda. L'équipe de sécurité a besoin d'une détection continue et automatisée des vulnérabilités logicielles connues (CVE) dans ces ressources. Les ressources doivent être réanalysées automatiquement lorsqu'une nouvelle CVE est publiée ou qu'un package change.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Activate Amazon Inspector for EC2, Amazon ECR and Lambda scanning.", fr: "Activer Amazon Inspector pour l'analyse d'EC2, d'Amazon ECR et de Lambda." }
    - id: b
      text: { en: "Enable Amazon GuardDuty with Runtime Monitoring for the workloads.", fr: "Activer Amazon GuardDuty avec Runtime Monitoring pour les charges de travail." }
    - id: c
      text: { en: "Enable Amazon Macie automated sensitive data discovery for the account.", fr: "Activer la découverte automatisée des données sensibles d'Amazon Macie pour le compte." }
    - id: d
      text: { en: "Run an open source CVE scanner from a scheduled AWS Lambda function.", fr: "Exécuter un scanner de CVE open source depuis une fonction AWS Lambda planifiée." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Amazon Inspector automatically discovers EC2 instances, ECR container images and Lambda functions and continually scans them for software vulnerabilities and unintended network exposure. It rescans when a package changes or a new CVE is published, and it closes findings when they are remediated.
    fr: |
      Amazon Inspector découvre automatiquement les instances EC2, les images de conteneur ECR et les fonctions Lambda, et les analyse en continu à la recherche de vulnérabilités logicielles et d'expositions réseau involontaires. Il relance l'analyse lorsqu'un package change ou qu'une nouvelle CVE est publiée, et il clôt les résultats une fois corrigés.
  options:
    b:
      en: |
        GuardDuty Runtime Monitoring detects threats from operating system activity; it is not a CVE vulnerability scanner.
      fr: |
        GuardDuty Runtime Monitoring détecte des menaces à partir de l'activité du système d'exploitation ; ce n'est pas un scanner de vulnérabilités CVE.
    c:
      en: |
        Macie discovers sensitive data in S3; it does not scan software for vulnerabilities.
      fr: |
        Macie découvre des données sensibles dans S3 ; il n'analyse pas les logiciels à la recherche de vulnérabilités.
    d:
      en: |
        A custom scanner must be built, updated and run on a schedule, so it is neither continuous nor low overhead.
      fr: |
        Un scanner personnalisé doit être créé, mis à jour et exécuté selon un calendrier : il n'est ni continu ni peu coûteux en exploitation.
references:
  - title: What is Amazon Inspector?
    url: https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html
