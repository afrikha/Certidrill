id: saac03-1d-kms-rotation-period
objective: "1.3.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company encrypts application data with a symmetric customer managed AWS KMS key whose key material was generated by AWS KMS. A new security standard requires the key material to be rotated every 180 days. Data encrypted before a rotation must stay decryptable, and the application must not change.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise chiffre les données d'une application avec une clé AWS KMS symétrique gérée par le client, dont le matériel de clé a été généré par AWS KMS. Une nouvelle norme de sécurité impose une rotation du matériel de clé tous les 180 jours. Les données chiffrées avant une rotation doivent rester déchiffrables, et l'application ne doit pas changer.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Create a new KMS key every 180 days, point the application's alias to it, and keep the old key enabled.", fr: "Créer une nouvelle clé KMS tous les 180 jours, faire pointer l'alias de l'application vers elle et garder l'ancienne clé activée." }
    - id: b
      text: { en: "Switch the application to the AWS managed key of the service, which AWS KMS rotates automatically.", fr: "Faire passer l'application à la clé gérée par AWS du service, dont AWS KMS assure la rotation automatique." }
    - id: c
      text: { en: "Enable automatic key rotation on the key with a rotation period of 180 days.", fr: "Activer la rotation automatique de la clé avec une période de rotation de 180 jours." }
    - id: d
      text: { en: "Schedule an AWS Lambda function every 180 days that re-encrypts all the data with a newly created key.", fr: "Planifier tous les 180 jours une fonction AWS Lambda qui rechiffre toutes les données avec une clé nouvellement créée." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Automatic rotation is available for symmetric encryption KMS keys with AWS KMS generated key material, and the rotation period can be set between 90 and 2,560 days (365 by default). AWS KMS keeps the previous key material, so older ciphertext still decrypts and the key ID does not change.
    fr: |
      La rotation automatique est disponible pour les clés KMS de chiffrement symétriques dont le matériel de clé est généré par AWS KMS, et la période de rotation peut être définie entre 90 et 2 560 jours (365 par défaut). AWS KMS conserve le matériel de clé précédent : les anciens textes chiffrés se déchiffrent toujours et l'ID de la clé ne change pas.
  options:
    a:
      en: |
        Manual rotation through a new key and an alias works, but it is a recurring manual task that automatic rotation already performs.
      fr: |
        La rotation manuelle par une nouvelle clé et un alias fonctionne, mais c'est une tâche manuelle récurrente que la rotation automatique effectue déjà.
    b:
      en: |
        AWS managed keys rotate every year, and that schedule cannot be changed to 180 days.
      fr: |
        Les clés gérées par AWS font l'objet d'une rotation chaque année, et ce calendrier ne peut pas être ramené à 180 jours.
    d:
      en: |
        Re-encrypting all the data is unnecessary for rotation and adds code, cost and risk.
      fr: |
        Rechiffrer toutes les données est inutile pour la rotation et ajoute du code, des coûts et des risques.
references:
  - title: Enable automatic key rotation
    url: https://docs.aws.amazon.com/kms/latest/developerguide/rotating-keys-enable.html
