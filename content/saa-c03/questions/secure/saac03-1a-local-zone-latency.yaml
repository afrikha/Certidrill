id: saac03-1a-local-zone-latency
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A visual effects studio in Los Angeles runs its rendering pipeline in a VPC in the US West (Oregon) Region. Artists in Los Angeles need virtual workstations on Amazon EC2 with single-digit millisecond latency from the studio's broadband and AWS Direct Connect connections. The workstations must stay in the existing VPC and be managed with the same AWS APIs, and the studio does not want to host or maintain AWS hardware.

    Which solution will meet these requirements?
  fr: |
    Un studio d'effets visuels de Los Angeles exécute sa chaîne de rendu dans un VPC de la Région US West (Oregon). Les artistes de Los Angeles ont besoin de stations de travail virtuelles sur Amazon EC2 avec une latence de l'ordre de quelques millisecondes depuis les connexions haut débit et AWS Direct Connect du studio. Les stations de travail doivent rester dans le VPC existant et être gérées avec les mêmes API AWS, et le studio ne veut ni héberger ni maintenir de matériel AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Order an AWS Outposts rack for the studio and create a subnet on the Outpost for the workstations.", fr: "Commander un rack AWS Outposts pour le studio et créer un sous-réseau sur l'Outpost pour les stations de travail." }
    - id: b
      text: { en: "Create a subnet in an AWS Wavelength Zone and connect the workstations through a carrier gateway.", fr: "Créer un sous-réseau dans une zone AWS Wavelength et relier les stations de travail via une passerelle d'opérateur (carrier gateway)." }
    - id: c
      text: { en: "Keep the workstations in the Oregon Region and put an Amazon CloudFront distribution in front of them.", fr: "Garder les stations de travail dans la Région Oregon et placer une distribution Amazon CloudFront devant elles." }
    - id: d
      text: { en: "Enable the Los Angeles Local Zone and create a subnet in it in the existing VPC for the workstations.", fr: "Activer la Local Zone de Los Angeles et y créer, dans le VPC existant, un sous-réseau pour les stations de travail." }
answer: { optionId: d }
explanation:
  correct:
    en: "A Local Zone extends a parent Region, here US West (Oregon), close to a large metropolitan area for low-latency use cases such as virtual workstations. After enabling it, you create a subnet in the Local Zone in the existing VPC, and traffic over Direct Connect reaches the Local Zone without going through the parent Region."
    fr: "Une Local Zone étend une Région parente, ici US West (Oregon), au plus près d'une grande métropole pour des usages à faible latence comme les stations de travail virtuelles. Après son activation, on crée un sous-réseau dans la Local Zone au sein du VPC existant, et le trafic Direct Connect atteint la Local Zone sans passer par la Région parente."
  options:
    a:
      en: "Outposts would meet the latency need, but the studio would host AWS hardware on its premises and provide its power, space and networking, which it wants to avoid."
      fr: "Outposts satisferait l'exigence de latence, mais le studio hébergerait du matériel AWS dans ses locaux et fournirait alimentation, espace et réseau, ce qu'il veut éviter."
    b:
      en: "Wavelength Zones sit in telecom providers' 5G networks for mobile devices; the artists connect over broadband and Direct Connect, not a carrier network."
      fr: "Les zones Wavelength se trouvent dans les réseaux 5G des opérateurs télécoms pour les appareils mobiles ; les artistes se connectent par haut débit et Direct Connect, pas via un réseau d'opérateur."
    c:
      en: "CloudFront caches HTTP content at edge locations; it does not reduce the latency of interactive sessions to instances that stay in Oregon."
      fr: "CloudFront met en cache du contenu HTTP dans des emplacements périphériques ; il ne réduit pas la latence des sessions interactives vers des instances restées en Oregon."
references:
  - title: How AWS Local Zones work
    url: https://docs.aws.amazon.com/local-zones/latest/ug/how-local-zones-work.html
  - title: What is AWS Local Zones?
    url: https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html
