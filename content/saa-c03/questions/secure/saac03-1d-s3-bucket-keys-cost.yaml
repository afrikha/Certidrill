id: saac03-1d-s3-bucket-keys-cost
objective: "1.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company stores millions of small images in an Amazon S3 bucket. The bucket uses SSE-KMS with a customer managed key, which the security team requires. The application reads and writes thousands of objects each second, and the monthly AWS KMS request charges have become a large part of the bill.

    The company must reduce the KMS request costs without changing the application code and while keeping the customer managed key.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias stocke des millions de petites images dans un compartiment Amazon S3. Le compartiment utilise SSE-KMS avec une clé gérée par le client, exigée par l'équipe de sécurité. L'application lit et écrit des milliers d'objets par seconde, et les frais mensuels de requêtes AWS KMS sont devenus une part importante de la facture.

    L'entreprise doit réduire les coûts des requêtes KMS sans modifier le code de l'application et en conservant la clé gérée par le client.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the default encryption of the bucket to SSE-S3 and re-encrypt the existing objects with S3 Batch Operations.", fr: "Passer le chiffrement par défaut du compartiment en SSE-S3 et rechiffrer les objets existants avec S3 Batch Operations." }
    - id: b
      text: { en: "Request an increase of the AWS KMS request rate quota for cryptographic operations in the Region.", fr: "Demander une augmentation du quota de débit de requêtes AWS KMS pour les opérations de chiffrement dans la Région." }
    - id: c
      text: { en: "Change the default encryption of the bucket to DSSE-KMS with the same customer managed key.", fr: "Passer le chiffrement par défaut du compartiment en DSSE-KMS avec la même clé gérée par le client." }
    - id: d
      text: { en: "Enable S3 Bucket Keys in the default encryption configuration of the bucket.", fr: "Activer les clés de compartiment S3 dans la configuration de chiffrement par défaut du compartiment." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With an S3 Bucket Key, S3 obtains a short-lived bucket-level key from AWS KMS and uses it to create data keys locally, which can reduce KMS request costs by up to 99 percent. It is enabled on the bucket without changing client applications, and the objects remain encrypted under the same customer managed key.
    fr: |
      Avec une clé de compartiment S3, S3 obtient d'AWS KMS une clé de courte durée au niveau du compartiment et l'utilise pour créer localement les clés de données, ce qui peut réduire les coûts des requêtes KMS jusqu'à 99 %. Elle s'active sur le compartiment sans modifier les applications clientes, et les objets restent chiffrés sous la même clé gérée par le client.
  options:
    a:
      en: |
        SSE-S3 removes the KMS charges but no longer uses the customer managed key that the security team requires.
      fr: |
        SSE-S3 supprime les frais KMS mais n'utilise plus la clé gérée par le client exigée par l'équipe de sécurité.
    b:
      en: |
        A higher quota prevents throttling but does not lower the number of billed KMS requests.
      fr: |
        Un quota plus élevé évite la limitation mais ne réduit pas le nombre de requêtes KMS facturées.
    c:
      en: |
        DSSE-KMS adds a second encryption layer and more KMS calls, and S3 Bucket Keys are not supported with it, so costs increase.
      fr: |
        DSSE-KMS ajoute une deuxième couche de chiffrement et davantage d'appels KMS, et les clés de compartiment S3 ne sont pas prises en charge avec lui : les coûts augmentent.
references:
  - title: Reducing the cost of SSE-KMS with Amazon S3 Bucket Keys
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/bucket-key.html
