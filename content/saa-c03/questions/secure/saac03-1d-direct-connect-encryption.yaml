id: saac03-1d-direct-connect-encryption
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company connects its data center to its VPCs through a 10 Gbps AWS Direct Connect dedicated connection. The Direct Connect location and the company's router support MACsec. A new regulation requires all traffic between the data center and AWS over this connection to be encrypted.

    Which solutions will meet this requirement? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise relie son centre de données à ses VPC via une connexion dédiée AWS Direct Connect de 10 Gbit/s. L'emplacement Direct Connect et le routeur de l'entreprise prennent en charge MACsec. Une nouvelle réglementation impose que tout le trafic entre le centre de données et AWS sur cette connexion soit chiffré.

    Quelles solutions permettent de répondre à cette exigence ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable MACsec on the dedicated connection with a CKN/CAK pair and set the encryption mode to must_encrypt.", fr: "Activer MACsec sur la connexion dédiée avec une paire CKN/CAK et définir le mode de chiffrement sur must_encrypt." } }
    - { id: b, text: { en: "Configure BGP MD5 authentication on the virtual interfaces of the connection.", fr: "Configurer l'authentification BGP MD5 sur les interfaces virtuelles de la connexion." } }
    - { id: c, text: { en: "Create a private IP AWS Site-to-Site VPN over a transit virtual interface to a transit gateway.", fr: "Créer un AWS Site-to-Site VPN à adresses IP privées sur une interface virtuelle de transit vers une passerelle de transit." } }
    - { id: d, text: { en: "Replace the dedicated connection with a hosted connection from a Direct Connect partner and enable MACsec on it.", fr: "Remplacer la connexion dédiée par une connexion hébergée d'un partenaire Direct Connect et y activer MACsec." } }
    - { id: e, text: { en: "Enable jumbo frames on the private virtual interfaces so that traffic is encapsulated end to end.", fr: "Activer les trames jumbo sur les interfaces virtuelles privées pour que le trafic soit encapsulé de bout en bout." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      MACsec provides Layer 2 encryption between the company's router and the Direct Connect device on dedicated connections; the must_encrypt mode sends no traffic if MACsec cannot be established. A private IP Site-to-Site VPN runs IPsec over a transit VIF to a transit gateway, which encrypts the traffic at Layer 3 without public IP addresses.
    fr: |
      MACsec assure un chiffrement de couche 2 entre le routeur de l'entreprise et l'équipement Direct Connect sur les connexions dédiées ; le mode must_encrypt n'envoie aucun trafic si MACsec ne peut pas être établi. Un Site-to-Site VPN à adresses IP privées exécute IPsec sur une interface virtuelle de transit vers une passerelle de transit, ce qui chiffre le trafic en couche 3 sans adresse IP publique.
  options:
    b:
      en: |
        BGP MD5 authenticates the BGP session between the routers; it does not encrypt the data traffic.
      fr: |
        BGP MD5 authentifie la session BGP entre les routeurs ; il ne chiffre pas le trafic de données.
    d:
      en: |
        MACsec is not supported on hosted connections.
      fr: |
        MACsec n'est pas pris en charge sur les connexions hébergées.
    e:
      en: |
        Jumbo frames only change the maximum transmission unit (MTU); they add no encryption.
      fr: |
        Les trames jumbo modifient seulement l'unité de transmission maximale (MTU) ; elles n'ajoutent aucun chiffrement.
references:
  - title: MAC Security in Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html
  - title: Private IP AWS Site-to-Site VPN with Direct Connect
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/private-ip-dx.html
