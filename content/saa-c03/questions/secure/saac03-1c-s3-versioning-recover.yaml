id: saac03-1c-s3-versioning-recover
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A publishing company stores manuscripts in an Amazon S3 bucket. Editors sometimes overwrite a manuscript with the wrong file or delete it by mistake. The company needs to be able to recover the previous content of any object after an accidental overwrite or delete.

    Which solution will meet these requirements?
  fr: |
    Une maison d'édition stocke des manuscrits dans un compartiment Amazon S3. Les éditeurs écrasent parfois un manuscrit avec le mauvais fichier ou le suppriment par erreur. L'entreprise doit pouvoir récupérer le contenu précédent de n'importe quel objet après un écrasement ou une suppression accidentels.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Turn on default encryption with SSE-KMS for the bucket."
        fr: "Activer le chiffrement par défaut SSE-KMS pour le compartiment."
    - id: b
      text:
        en: "Set S3 Object Ownership on the bucket to Bucket owner enforced."
        fr: "Définir S3 Object Ownership du compartiment sur Bucket owner enforced."
    - id: c
      text:
        en: "Turn on S3 Transfer Acceleration for the bucket."
        fr: "Activer S3 Transfer Acceleration pour le compartiment."
    - id: d
      text:
        en: "Turn on S3 Versioning for the bucket."
        fr: "Activer S3 Versioning pour le compartiment."
answer: { optionId: d }
explanation:
  correct:
    en: |
      With versioning, an overwrite creates a new object version and a simple delete inserts a delete marker instead of removing the data. The previous version stays in the bucket and can be restored at any time.
    fr: |
      Avec la gestion des versions, un écrasement crée une nouvelle version de l'objet et une suppression simple insère un marqueur de suppression au lieu de supprimer les données. La version précédente reste dans le compartiment et peut être restaurée à tout moment.
  options:
    a:
      en: |
        Encryption protects data confidentiality; it keeps no previous versions.
      fr: |
        Le chiffrement protège la confidentialité des données ; il ne conserve aucune version précédente.
    b:
      en: |
        Object Ownership controls object ownership and ACLs; it does not keep earlier content.
      fr: |
        Object Ownership contrôle la propriété des objets et les ACL ; il ne conserve pas le contenu antérieur.
    c:
      en: |
        Transfer Acceleration speeds up long-distance transfers; it provides no recovery capability.
      fr: |
        Transfer Acceleration accélère les transferts sur de longues distances ; il n'offre aucune capacité de récupération.
references:
  - title: Retaining multiple versions of objects with S3 Versioning
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html
