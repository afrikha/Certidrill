id: saac03-1a-outposts-onprem
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A hospital group runs imaging systems in its own data center. A new application must process the images with very low latency to these on-premises systems, and patient data must be processed and stored on the hospital's premises. The IT team wants to run Amazon EC2 and Amazon RDS with the same AWS APIs and tools that it uses in its VPC in the Region.

    Which solution will meet these requirements?
  fr: |
    Un groupe hospitalier exploite des systèmes d'imagerie dans son propre centre de données. Une nouvelle application doit traiter les images avec une latence très faible vers ces systèmes sur site, et les données des patients doivent être traitées et stockées dans les locaux de l'hôpital. L'équipe informatique veut exécuter Amazon EC2 et Amazon RDS avec les mêmes API et outils AWS que dans son VPC de la Région.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Install an AWS Outposts rack in the hospital data center and create Outpost subnets for the resources.", fr: "Installer un rack AWS Outposts dans le centre de données de l'hôpital et créer des sous-réseaux Outpost pour les ressources." }
    - id: b
      text: { en: "Deploy the EC2 and RDS resources in the AWS Local Zone that is closest to the hospital's location.", fr: "Déployer les ressources EC2 et RDS dans la Local Zone AWS la plus proche de l'emplacement de l'hôpital." }
    - id: c
      text: { en: "Deploy the EC2 and RDS resources in the nearest Region and connect the data center with AWS Direct Connect.", fr: "Déployer les ressources EC2 et RDS dans la Région la plus proche et relier le centre de données avec AWS Direct Connect." }
    - id: d
      text: { en: "Deploy the EC2 and RDS resources in a Wavelength Zone of the hospital's mobile network operator.", fr: "Déployer les ressources EC2 et RDS dans une zone Wavelength de l'opérateur mobile de l'hôpital." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Outposts brings AWS-managed compute and storage capacity to the customer's site as an extension of an Availability Zone and Region. Resources such as EC2 instances and RDS databases run in Outpost subnets on premises, close to local systems, and are managed with the same APIs and tools as in the Region."
    fr: "AWS Outposts apporte sur le site du client une capacité de calcul et de stockage gérée par AWS, comme extension d'une zone de disponibilité et d'une Région. Des ressources comme les instances EC2 et les bases RDS s'exécutent sur site dans des sous-réseaux Outpost, au plus près des systèmes locaux, et se gèrent avec les mêmes API et outils que dans la Région."
  options:
    b:
      en: "A Local Zone is an AWS facility near a metropolitan area, not the hospital's premises, so the data would leave the site."
      fr: "Une Local Zone est une infrastructure AWS proche d'une métropole, pas les locaux de l'hôpital : les données quitteraient le site."
    c:
      en: "Direct Connect gives a private connection to the Region, but the data would be processed and stored in AWS data centers, not on premises."
      fr: "Direct Connect fournit une connexion privée vers la Région, mais les données seraient traitées et stockées dans les centres de données AWS, pas sur site."
    d:
      en: "Wavelength Zones are in telecom providers' facilities at the edge of 5G networks, not on the hospital's premises."
      fr: "Les zones Wavelength se trouvent dans les installations des opérateurs télécoms, en périphérie des réseaux 5G, pas dans les locaux de l'hôpital."
references:
  - title: What is AWS Outposts?
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
