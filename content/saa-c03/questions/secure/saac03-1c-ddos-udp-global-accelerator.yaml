id: saac03-1c-ddos-udp-global-accelerator
objective: "1.2.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A game studio runs a multiplayer game server fleet on Amazon EC2 instances behind Network Load Balancers in two AWS Regions. The game uses a custom UDP protocol. Players worldwide must connect to a single pair of static IP addresses that partner networks can allowlist, and traffic must enter the AWS network close to the players. The studio also needs DDoS protection with access to the Shield Response Team.

    Which solution will meet these requirements?
  fr: |
    Un studio de jeux exécute un parc de serveurs de jeu multijoueur sur des instances Amazon EC2 derrière des Network Load Balancers dans deux Régions AWS. Le jeu utilise un protocole UDP personnalisé. Les joueurs du monde entier doivent se connecter à une seule paire d'adresses IP statiques que les réseaux partenaires peuvent ajouter à leurs listes d'autorisation, et le trafic doit entrer sur le réseau AWS au plus près des joueurs. Le studio a aussi besoin d'une protection DDoS avec accès à la Shield Response Team.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon CloudFront distribution with the load balancers as origins, associate an AWS WAF web ACL, and protect the distribution with AWS Shield Advanced."
        fr: "Créer une distribution Amazon CloudFront avec les équilibreurs de charge comme origines, lui associer une liste ACL web AWS WAF et la protéger avec AWS Shield Advanced."
    - id: b
      text:
        en: "Assign Elastic IP addresses to the load balancers, protect them with AWS Shield Advanced, and use Amazon Route 53 latency-based routing between the Regions."
        fr: "Attribuer des adresses IP Elastic aux équilibreurs de charge, les protéger avec AWS Shield Advanced et utiliser le routage Amazon Route 53 basé sur la latence entre les Régions."
    - id: c
      text:
        en: "Create an AWS Global Accelerator standard accelerator with the load balancers as endpoints, and protect the accelerator with AWS Shield Advanced."
        fr: "Créer un accélérateur standard AWS Global Accelerator avec les équilibreurs de charge comme points de terminaison, et protéger l'accélérateur avec AWS Shield Advanced."
    - id: d
      text:
        en: "Associate an AWS WAF web ACL with rate-based rules with each load balancer, and subscribe to AWS Shield Advanced for both Regions."
        fr: "Associer à chaque équilibreur de charge une liste ACL web AWS WAF avec des règles basées sur le débit, et souscrire à AWS Shield Advanced pour les deux Régions."
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Global Accelerator standard accelerator provides two static anycast IP addresses, supports TCP and UDP, and brings traffic onto the AWS global network at the edge location closest to each player before sending it to the Regional endpoints. Standard accelerators are a resource type that Shield Advanced protects, which adds SRT access.
    fr: |
      Un accélérateur standard Global Accelerator fournit deux adresses IP anycast statiques, prend en charge TCP et UDP, et fait entrer le trafic sur le réseau mondial AWS à l'emplacement périphérique le plus proche de chaque joueur avant de l'envoyer vers les points de terminaison régionaux. Les accélérateurs standard font partie des ressources que Shield Advanced protège, ce qui ajoute l'accès à la SRT.
  options:
    a:
      en: |
        CloudFront serves HTTP and HTTPS (and WebSocket) traffic; it cannot carry a custom UDP game protocol and does not provide a fixed pair of static IP addresses.
      fr: |
        CloudFront sert du trafic HTTP et HTTPS (et WebSocket) ; il ne peut pas transporter un protocole de jeu UDP personnalisé et ne fournit pas une paire fixe d'adresses IP statiques.
    b:
      en: |
        Each load balancer has its own Regional addresses, so players and partners would not use a single pair of static IP addresses, and traffic would cross the internet to the Region instead of entering AWS at the edge.
      fr: |
        Chaque équilibreur de charge a ses propres adresses régionales : joueurs et partenaires n'utiliseraient pas une seule paire d'adresses IP statiques, et le trafic traverserait Internet jusqu'à la Région au lieu d'entrer sur AWS en périphérie.
    d:
      en: |
        AWS WAF cannot be associated with a Network Load Balancer, and it inspects only HTTP(S) requests, not a UDP protocol.
      fr: |
        AWS WAF ne peut pas être associé à un Network Load Balancer, et il n'inspecte que des requêtes HTTP(S), pas un protocole UDP.
