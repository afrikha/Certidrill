id: saac03-1b-ecs-secret-injection
objective: "1.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs an application on Amazon ECS with AWS Fargate. The container reads a database password from an environment variable named DB_PASSWORD, which is currently written in plain text in the task definition. The password is now stored in AWS Secrets Manager and is encrypted with a customer managed AWS KMS key. The company must stop exposing the password in the task definition without changing the application code.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute une application sur Amazon ECS avec AWS Fargate. Le conteneur lit un mot de passe de base de données dans une variable d'environnement nommée DB_PASSWORD, actuellement écrite en clair dans la définition de tâche. Le mot de passe est désormais stocké dans AWS Secrets Manager et chiffré avec une clé AWS KMS gérée par le client. L'entreprise doit cesser d'exposer le mot de passe dans la définition de tâche sans modifier le code de l'application.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant secretsmanager:GetSecretValue and kms:Decrypt to the task IAM role so that ECS can inject the secret.", fr: "Accorder secretsmanager:GetSecretValue et kms:Decrypt au rôle IAM de tâche afin qu'ECS puisse injecter le secret." } }
    - { id: b, text: { en: "Replace the DB_PASSWORD environment entry with a secrets entry whose valueFrom is the secret's ARN.", fr: "Remplacer l'entrée d'environnement DB_PASSWORD par une entrée secrets dont valueFrom est l'ARN du secret." } }
    - { id: c, text: { en: "Copy the password into the container image at build time, and remove it from the task definition.", fr: "Copier le mot de passe dans l'image de conteneur lors de la génération, et le retirer de la définition de tâche." } }
    - { id: d, text: { en: "Turn on automatic rotation so that running tasks receive each new password value without being restarted.", fr: "Activer la rotation automatique afin que les tâches en cours reçoivent chaque nouvelle valeur du mot de passe sans redémarrage." } }
    - { id: e, text: { en: "Grant the task execution role secretsmanager:GetSecretValue on the secret and kms:Decrypt on the customer managed key.", fr: "Accorder au rôle d'exécution de tâche secretsmanager:GetSecretValue sur le secret et kms:Decrypt sur la clé gérée par le client." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      The secrets parameter of a container definition maps an environment variable name to a Secrets Manager ARN in valueFrom, and ECS injects the value when the container starts. The ECS agent retrieves the value with the task execution role, which needs secretsmanager:GetSecretValue and, for a customer managed key, kms:Decrypt.
    fr: |
      Le paramètre secrets d'une définition de conteneur associe un nom de variable d'environnement à un ARN Secrets Manager dans valueFrom, et ECS injecte la valeur au démarrage du conteneur. L'agent ECS récupère la valeur avec le rôle d'exécution de tâche, qui a besoin de secretsmanager:GetSecretValue et, pour une clé gérée par le client, de kms:Decrypt.
  options:
    a:
      en: |
        The task role is used by the application code; secret injection is performed with the task execution role.
      fr: |
        Le rôle de tâche est utilisé par le code de l'application ; l'injection de secrets s'effectue avec le rôle d'exécution de tâche.
    c:
      en: |
        A password baked into an image is exposed to anyone who can pull the image and cannot change without a rebuild.
      fr: |
        Un mot de passe intégré à une image est exposé à quiconque peut extraire l'image et ne peut pas changer sans nouvelle génération.
    d:
      en: |
        Injected values are read only when the container starts; running tasks keep the old value until they are replaced.
      fr: |
        Les valeurs injectées ne sont lues qu'au démarrage du conteneur ; les tâches en cours conservent l'ancienne valeur jusqu'à leur remplacement.
references:
  - title: Pass Secrets Manager secrets through Amazon ECS environment variables
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/secrets-envvar-secrets-manager.html
  - title: Amazon ECS task execution IAM role
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_execution_IAM_role.html
