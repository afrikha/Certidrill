id: saac03-1d-s3-crr-prerequisites
objective: "1.3.9"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores product images in an Amazon S3 bucket in the us-east-1 Region. For disaster recovery, every new object must be copied automatically to a bucket in the eu-west-1 Region owned by the same account. Neither bucket uses S3 Object Lock.

    Which combination of steps must the company take to configure the replication? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke des images de produits dans un compartiment Amazon S3 de la Région us-east-1. Pour la reprise après sinistre, chaque nouvel objet doit être copié automatiquement vers un compartiment de la Région eu-west-1 appartenant au même compte. Aucun des deux compartiments n'utilise S3 Object Lock.

    Quelle combinaison d'étapes l'entreprise doit-elle réaliser pour configurer la réplication ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable S3 Versioning on both the source bucket and the destination bucket.", fr: "Activer S3 Versioning sur le compartiment source et sur le compartiment de destination." } }
    - { id: b, text: { en: "Enable S3 Transfer Acceleration on the destination bucket to receive the replicas.", fr: "Activer S3 Transfer Acceleration sur le compartiment de destination pour recevoir les réplicas." } }
    - { id: c, text: { en: "Provide an IAM role that Amazon S3 assumes to replicate objects to the destination bucket.", fr: "Fournir un rôle IAM qu'Amazon S3 assume pour répliquer les objets vers le compartiment de destination." } }
    - { id: d, text: { en: "Configure both buckets to use the same storage class and the same default encryption.", fr: "Configurer les deux compartiments pour qu'ils utilisent la même classe de stockage et le même chiffrement par défaut." } }
    - { id: e, text: { en: "Create an S3 Lifecycle rule on the source bucket that copies new objects to the destination bucket.", fr: "Créer une règle S3 Lifecycle sur le compartiment source qui copie les nouveaux objets vers le compartiment de destination." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      S3 replication requires S3 Versioning on both the source and destination buckets, and an IAM role that S3 assumes to read the source objects and write the replicas. Live replication then copies the new objects asynchronously.
    fr: |
      La réplication S3 exige S3 Versioning sur les compartiments source et de destination, ainsi qu'un rôle IAM que S3 assume pour lire les objets source et écrire les réplicas. La réplication en direct copie ensuite les nouveaux objets de façon asynchrone.
  options:
    b:
      en: |
        Transfer Acceleration speeds up client uploads over long distances; replication does not need it.
      fr: |
        Transfer Acceleration accélère les chargements des clients sur de longues distances ; la réplication n'en a pas besoin.
    d:
      en: |
        Replicas can use a different storage class and the buckets can have different encryption settings; this is not a requirement.
      fr: |
        Les réplicas peuvent utiliser une autre classe de stockage et les compartiments peuvent avoir des paramètres de chiffrement différents ; ce n'est pas une exigence.
    e:
      en: |
        Lifecycle rules transition or expire objects; they do not copy objects to another bucket.
      fr: |
        Les règles de cycle de vie font changer de classe ou expirer les objets ; elles ne copient pas d'objets vers un autre compartiment.
references:
  - title: Requirements and considerations for replication
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-requirements.html
