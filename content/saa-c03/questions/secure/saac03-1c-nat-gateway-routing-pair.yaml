id: saac03-1c-nat-gateway-routing-pair
objective: "1.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing a VPC for an application whose Amazon EC2 instances run in private subnets. The instances must send outbound requests to a payment provider on the internet through a zonal public NAT gateway. The instances must not have public IP addresses.

    Which configurations are required for this design? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise conçoit un VPC pour une application dont les instances Amazon EC2 s'exécutent dans des sous-réseaux privés. Les instances doivent envoyer des requêtes sortantes à un prestataire de paiement sur Internet par l'intermédiaire d'une passerelle NAT publique zonale. Les instances ne doivent pas avoir d'adresses IP publiques.

    Quelles configurations sont nécessaires pour cette conception ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create the NAT gateway in a public subnet whose route table has a 0.0.0.0/0 route to an internet gateway."
        fr: "Créer la passerelle NAT dans un sous-réseau public dont la table de routage a une route 0.0.0.0/0 vers une passerelle Internet."
    - id: b
      text:
        en: "Associate a security group with the NAT gateway that allows outbound HTTPS to the payment provider."
        fr: "Associer à la passerelle NAT un groupe de sécurité qui autorise le HTTPS sortant vers le prestataire de paiement."
    - id: c
      text:
        en: "Add a 0.0.0.0/0 route to the internet gateway in the private subnets' route table."
        fr: "Ajouter une route 0.0.0.0/0 vers la passerelle Internet dans la table de routage des sous-réseaux privés."
    - id: d
      text:
        en: "Add a 0.0.0.0/0 route to the NAT gateway in the private subnets' route table."
        fr: "Ajouter une route 0.0.0.0/0 vers la passerelle NAT dans la table de routage des sous-réseaux privés."
    - id: e
      text:
        en: "Create the NAT gateway in one of the private subnets so that it is close to the instances."
        fr: "Créer la passerelle NAT dans l'un des sous-réseaux privés afin qu'elle soit proche des instances."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A zonal public NAT gateway is created in a public subnet, with an Elastic IP address, and that subnet routes internet traffic to the internet gateway. The private subnets then route 0.0.0.0/0 to the NAT gateway, so the instances reach the internet without public IP addresses and cannot receive unsolicited inbound connections.
    fr: |
      Une passerelle NAT publique zonale est créée dans un sous-réseau public, avec une adresse IP Elastic, et ce sous-réseau route le trafic Internet vers la passerelle Internet. Les sous-réseaux privés routent ensuite 0.0.0.0/0 vers la passerelle NAT : les instances atteignent Internet sans adresse IP publique et ne peuvent pas recevoir de connexions entrantes non sollicitées.
  options:
    b:
      en: |
        Security groups cannot be associated with a NAT gateway; traffic is filtered with the instances' security groups and the subnets' network ACLs.
      fr: |
        On ne peut pas associer de groupe de sécurité à une passerelle NAT ; le trafic est filtré par les groupes de sécurité des instances et les ACL réseau des sous-réseaux.
    c:
      en: |
        Instances without public IP addresses cannot use a direct route to the internet gateway, and this route would turn the subnets into public subnets.
      fr: |
        Des instances sans adresse IP publique ne peuvent pas utiliser une route directe vers la passerelle Internet, et cette route ferait des sous-réseaux des sous-réseaux publics.
    e:
      en: |
        A zonal public NAT gateway in a private subnet has no route to the internet gateway, so it cannot forward traffic to the internet.
      fr: |
        Une passerelle NAT publique zonale placée dans un sous-réseau privé n'a pas de route vers la passerelle Internet ; elle ne peut donc pas transférer le trafic vers Internet.
references:
