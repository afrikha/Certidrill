id: saac03-1c-secrets-manager-rds-rotation
objective: "1.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's web application on Amazon EC2 reads the user name and password of its Amazon RDS for MySQL database from a configuration file on each instance. A security audit requires that the database credentials be removed from the instances and rotated automatically on a schedule. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    L'application web d'une entreprise sur Amazon EC2 lit le nom d'utilisateur et le mot de passe de sa base de données Amazon RDS for MySQL dans un fichier de configuration présent sur chaque instance. Un audit de sécurité exige que les informations d'identification de la base de données soient retirées des instances et fassent l'objet d'une rotation automatique planifiée. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Encrypt the configuration file with an AWS KMS key and decrypt it when the application starts."
        fr: "Chiffrer le fichier de configuration avec une clé AWS KMS et le déchiffrer au démarrage de l'application."
    - id: b
      text:
        en: "Pass the credentials to the instances in the EC2 user data and replace the launch template every month."
        fr: "Transmettre les informations d'identification aux instances dans les données utilisateur EC2 et remplacer le modèle de lancement chaque mois."
    - id: c
      text:
        en: "Store the credentials in AWS Secrets Manager, turn on rotation for the secret, and have the application retrieve the secret at runtime."
        fr: "Stocker les informations d'identification dans AWS Secrets Manager, activer la rotation du secret et faire récupérer le secret par l'application à l'exécution."
    - id: d
      text:
        en: "Store the credentials as an AWS Systems Manager Parameter Store SecureString and have the application read the parameter at startup."
        fr: "Stocker les informations d'identification comme paramètre SecureString d'AWS Systems Manager Parameter Store et faire lire le paramètre par l'application au démarrage."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Secrets Manager stores the credentials encrypted, controls access to them with IAM, and rotates them on a schedule; for Amazon RDS it can use managed rotation, so no rotation code is needed. The application calls Secrets Manager with its instance role, so no credentials are left on the instances.
    fr: |
      Secrets Manager stocke les informations d'identification chiffrées, en contrôle l'accès avec IAM et en assure la rotation selon une planification ; pour Amazon RDS, il peut utiliser la rotation gérée, sans code de rotation à écrire. L'application appelle Secrets Manager avec le rôle de son instance : aucune information d'identification ne reste sur les instances.
  options:
    a:
      en: |
        The credentials stay on the instances, and nothing rotates the database password.
      fr: |
        Les informations d'identification restent sur les instances, et rien n'assure la rotation du mot de passe de la base de données.
    b:
      en: |
        User data is readable from the instance and is not a secret store; replacing templates by hand is not automatic rotation.
      fr: |
        Les données utilisateur sont lisibles depuis l'instance et ne constituent pas un magasin de secrets ; remplacer des modèles à la main n'est pas une rotation automatique.
    d:
      en: |
        A SecureString parameter is encrypted, but Parameter Store has no built-in rotation of database credentials.
      fr: |
        Un paramètre SecureString est chiffré, mais Parameter Store n'offre aucune rotation intégrée des informations d'identification de base de données.
references:
  - title: Rotate AWS Secrets Manager secrets
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
  - title: Password management with Amazon RDS and AWS Secrets Manager
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-secrets-manager.html
