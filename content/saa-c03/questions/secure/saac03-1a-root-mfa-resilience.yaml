id: saac03-1a-root-mfa-resilience
objective: "1.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A bank's root user of its AWS Organizations management account is protected by a virtual MFA app on one administrator's phone. The security team wants phishing-resistant MFA for this root user, and the company must not lose root access if one MFA device is lost or one person is unavailable. No single person may be able to sign in as root alone.

    Which solution will meet these requirements?
  fr: |
    L'utilisateur racine du compte de gestion AWS Organizations d'une banque est protégé par une application MFA virtuelle sur le téléphone d'un administrateur. L'équipe de sécurité veut une MFA résistante à l'hameçonnage pour cet utilisateur racine, et l'entreprise ne doit pas perdre l'accès racine si un appareil MFA est perdu ou si une personne est indisponible. Aucune personne seule ne doit pouvoir se connecter en tant qu'utilisateur racine.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace the virtual MFA app with SMS text message MFA sent to a shared team phone number.", fr: "Remplacer l'application MFA virtuelle par une MFA par SMS envoyée à un numéro de téléphone partagé de l'équipe." }
    - id: b
      text: { en: "Install the same virtual MFA app on the phones of all administrators and share the root password with each of them.", fr: "Installer la même application MFA virtuelle sur les téléphones de tous les administrateurs et partager le mot de passe racine avec chacun d'eux." }
    - id: c
      text: { en: "Register two FIDO security keys held by different custodians, and keep the root password with a separate group.", fr: "Enregistrer deux clés de sécurité FIDO détenues par des dépositaires différents, et confier le mot de passe racine à un groupe distinct." }
    - id: d
      text: { en: "Register one hardware TOTP token and store it in a safe with the root password written on paper.", fr: "Enregistrer un jeton TOTP matériel et le ranger dans un coffre-fort avec le mot de passe racine écrit sur papier." }
answer: { optionId: c }
explanation:
  correct:
    en: "FIDO security keys are phishing-resistant, and the root user can register up to eight MFA devices, so a second key avoids lockout. Splitting custody, with one group holding the password and others holding the MFA devices, means that at least two people must work together to sign in."
    fr: "Les clés de sécurité FIDO résistent à l'hameçonnage, et l'utilisateur racine peut enregistrer jusqu'à huit appareils MFA : une seconde clé évite le blocage. Répartir la garde, un groupe détenant le mot de passe et d'autres les appareils MFA, oblige au moins deux personnes à agir ensemble pour se connecter."
  options:
    a:
      en: "SMS-based MFA is no longer supported by AWS, and it is not phishing-resistant."
      fr: "La MFA par SMS n'est plus prise en charge par AWS et ne résiste pas à l'hameçonnage."
    b:
      en: "Virtual TOTP apps are not phishing-resistant, and giving every administrator both the password and MFA lets one person sign in alone."
      fr: "Les applications TOTP virtuelles ne résistent pas à l'hameçonnage, et donner à chaque administrateur le mot de passe et la MFA permet à une seule personne de se connecter."
    d:
      en: "A single TOTP token is not phishing-resistant and is a single point of failure; storing it with the password lets one person sign in alone."
      fr: "Un seul jeton TOTP ne résiste pas à l'hameçonnage et constitue un point de défaillance unique ; le ranger avec le mot de passe permet à une seule personne de se connecter."
references:
  - title: AWS Multi-factor authentication in IAM
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
