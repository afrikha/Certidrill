id: saac03-1a-root-user-new-account
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup has just created its first AWS account. The founders currently use the root user for all daily administration, including deployments from the AWS CLI. They want to secure the account according to AWS best practices.

    Which solution will meet these requirements?
  fr: |
    Une start-up vient de créer son premier compte AWS. Les fondateurs utilisent actuellement l'utilisateur racine pour toute l'administration quotidienne, y compris les déploiements depuis l'AWS CLI. Ils veulent sécuriser le compte selon les bonnes pratiques AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable MFA on the root user, use an administrative user in IAM Identity Center daily, and keep root for root-only tasks.", fr: "Activer la MFA sur l'utilisateur racine, utiliser au quotidien un utilisateur administratif d'IAM Identity Center, et réserver la racine aux tâches qui l'exigent." }
    - id: b
      text: { en: "Create access keys for the root user for the CLI deployments, store them in AWS Secrets Manager, and rotate them every 90 days.", fr: "Créer des clés d'accès pour l'utilisateur racine pour les déploiements CLI, les stocker dans AWS Secrets Manager et les renouveler tous les 90 jours." }
    - id: c
      text: { en: "Share the root user password among the founders through a password manager, and enable MFA on a phone that they all can use.", fr: "Partager le mot de passe de l'utilisateur racine entre les fondateurs via un gestionnaire de mots de passe, et activer la MFA sur un téléphone accessible à tous." }
    - id: d
      text: { en: "Delete the root user after creating an IAM user with the AdministratorAccess policy for each founder.", fr: "Supprimer l'utilisateur racine après avoir créé, pour chaque fondateur, un utilisateur IAM avec la politique AdministratorAccess." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS recommends protecting the root user with MFA and not using it for everyday tasks. An administrative user in IAM Identity Center provides temporary credentials for the console and the CLI, and the root user is kept for the few tasks that only it can perform."
    fr: "AWS recommande de protéger l'utilisateur racine avec la MFA et de ne pas l'utiliser pour les tâches courantes. Un utilisateur administratif dans IAM Identity Center fournit des informations d'identification temporaires pour la console et la CLI, et l'utilisateur racine est réservé aux quelques tâches que lui seul peut effectuer."
  options:
    b:
      en: "AWS advises against creating root user access keys at all, because the root user has full access to every service and to billing."
      fr: "AWS déconseille toute création de clés d'accès pour l'utilisateur racine, car il a un accès complet à tous les services et à la facturation."
    c:
      en: "Root credentials should be shared only with people who strictly need them, and daily administration should not use the root user at all."
      fr: "Les informations d'identification racine ne doivent être partagées qu'avec les personnes qui en ont strictement besoin, et l'administration quotidienne ne doit pas du tout utiliser l'utilisateur racine."
    d:
      en: "The root user of a standalone account cannot be deleted; some tasks, such as closing the account, require it."
      fr: "L'utilisateur racine d'un compte autonome ne peut pas être supprimé ; certaines tâches, comme la fermeture du compte, l'exigent."
references:
  - title: Root user best practices for your AWS account
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/root-user-best-practices.html
