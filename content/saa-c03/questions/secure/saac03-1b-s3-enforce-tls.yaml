id: saac03-1b-s3-enforce-tls
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company stores patient documents in an S3 bucket. A compliance audit requires that every request to the bucket use HTTPS (TLS) and that every request sent over plain HTTP be rejected, whichever principal sends it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise du secteur de la santé stocke des documents de patients dans un compartiment S3. Un audit de conformité exige que chaque requête vers le compartiment utilise HTTPS (TLS) et que chaque requête envoyée en HTTP simple soit rejetée, quel que soit le principal qui l'envoie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable default encryption with SSE-KMS on the bucket by using a customer managed key.", fr: "Activer le chiffrement par défaut avec SSE-KMS sur le compartiment à l'aide d'une clé gérée par le client." }
    - id: b
      text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SecureTransport is false.", fr: "Ajouter une instruction de politique de compartiment qui refuse toutes les actions S3 lorsque aws:SecureTransport est false." }
    - id: c
      text: { en: "Enable S3 Block Public Access on the bucket and at the level of the account.", fr: "Activer S3 Block Public Access sur le compartiment et au niveau du compte." }
    - id: d
      text: { en: "Enable S3 Object Lock in compliance mode with a default retention period on the bucket.", fr: "Activer S3 Object Lock en mode conformité avec une période de conservation par défaut sur le compartiment." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The aws:SecureTransport condition key is false when a request is sent over HTTP. A Deny statement for all principals in the bucket policy rejects those requests, whatever permissions the callers have, so only TLS connections can reach the bucket.
    fr: |
      La clé de condition aws:SecureTransport vaut false lorsqu'une requête est envoyée en HTTP. Une instruction Deny pour tous les principaux dans la politique de compartiment rejette ces requêtes, quelles que soient les autorisations des appelants : seules les connexions TLS peuvent atteindre le compartiment.
  options:
    a:
      en: |
        Default encryption protects data at rest; it does not control the protocol used in transit.
      fr: |
        Le chiffrement par défaut protège les données au repos ; il ne contrôle pas le protocole utilisé en transit.
    c:
      en: |
        Block Public Access prevents public access; it does not reject authorized requests sent over HTTP.
      fr: |
        Block Public Access empêche l'accès public ; il ne rejette pas les requêtes autorisées envoyées en HTTP.
    d:
      en: |
        Object Lock prevents objects from being deleted or overwritten; it has no effect on the transport protocol.
      fr: |
        Object Lock empêche la suppression ou l'écrasement des objets ; il n'a aucun effet sur le protocole de transport.
references:
  - title: Security best practices for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
