id: saac03-1c-kms-multi-region-keys
objective: "1.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payments company runs an active-active application in us-east-1 and eu-west-1. The application uses client-side encryption with the AWS Encryption SDK to encrypt records before it writes them to a data store that replicates between the Regions. Records encrypted in one Region must be decrypted in the other Region without a cross-Region call to AWS KMS and without re-encrypting the data. The company currently uses a single-Region customer managed key in us-east-1.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de paiements exécute une application active-active dans us-east-1 et eu-west-1. L'application utilise le chiffrement côté client avec l'AWS Encryption SDK pour chiffrer les enregistrements avant de les écrire dans un magasin de données répliqué entre les Régions. Les enregistrements chiffrés dans une Région doivent pouvoir être déchiffrés dans l'autre sans appel interrégional à AWS KMS et sans rechiffrer les données. L'entreprise utilise actuellement une clé gérée par le client à Région unique dans us-east-1.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Convert the existing single-Region key to a multi-Region key, and replicate it to eu-west-1."
        fr: "Convertir la clé à Région unique existante en clé multirégionale, et la répliquer dans eu-west-1."
    - id: b
      text:
        en: "Create a new single-Region key in eu-west-1 with the same alias, and have each Region's application use its local key."
        fr: "Créer une nouvelle clé à Région unique dans eu-west-1 avec le même alias, et faire utiliser à l'application de chaque Région sa clé locale."
    - id: c
      text:
        en: "Keep the key in us-east-1, and have the application in eu-west-1 call the AWS KMS endpoint in us-east-1 to decrypt."
        fr: "Conserver la clé dans us-east-1, et faire appeler par l'application de eu-west-1 le point de terminaison AWS KMS de us-east-1 pour déchiffrer."
    - id: d
      text:
        en: "Create a new multi-Region primary key in us-east-1, replicate it to eu-west-1, and use the related keys in each Region for new records."
        fr: "Créer une nouvelle clé principale multirégionale dans us-east-1, la répliquer dans eu-west-1, et utiliser les clés associées de chaque Région pour les nouveaux enregistrements."
answer: { optionId: d }
explanation:
  correct:
    en: |
      Related multi-Region keys share the same key ID and key material, so ciphertext produced by one of them can be decrypted by the related key in another Region without a cross-Region call or re-encryption. The AWS Encryption SDK supports multi-Region keys for client-side encryption. Each related key is still managed separately in its Region.
    fr: |
      Des clés multirégionales associées partagent le même ID de clé et les mêmes éléments de clé : un texte chiffré produit par l'une peut être déchiffré par la clé associée d'une autre Région sans appel interrégional ni rechiffrement. L'AWS Encryption SDK prend en charge les clés multirégionales pour le chiffrement côté client. Chaque clé associée reste gérée séparément dans sa Région.
  options:
    a:
      en: |
        An existing single-Region key cannot be converted to a multi-Region key.
      fr: |
        Une clé à Région unique existante ne peut pas être convertie en clé multirégionale.
    b:
      en: |
        Separate single-Region keys have different key material, so one cannot decrypt the other's ciphertext; an alias is only a name.
      fr: |
        Des clés à Région unique distinctes ont des éléments de clé différents : l'une ne peut pas déchiffrer le texte chiffré de l'autre ; un alias n'est qu'un nom.
    c:
      en: |
        Calling the KMS endpoint in another Region is exactly the cross-Region call that the company wants to avoid, and it adds latency and a Regional dependency.
      fr: |
        Appeler le point de terminaison KMS d'une autre Région est précisément l'appel interrégional que l'entreprise veut éviter, et cela ajoute de la latence et une dépendance régionale.
references:
  - title: Multi-Region keys in AWS KMS
    url: https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html
