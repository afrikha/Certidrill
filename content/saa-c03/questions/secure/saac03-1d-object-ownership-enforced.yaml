id: saac03-1d-object-ownership-enforced
objective: "1.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company created an Amazon S3 bucket several years ago with ACLs enabled and the Object writer ownership setting. Several partner accounts upload files to it. The company's own analytics roles cannot read many of the partner files because those objects are owned by the partner accounts.

    The company wants to own every object in the bucket and to manage all access only with policies.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a créé il y a plusieurs années un compartiment Amazon S3 avec les ACL activées et le paramètre de propriété Object writer. Plusieurs comptes partenaires y chargent des fichiers. Les rôles d'analyse de l'entreprise ne peuvent pas lire de nombreux fichiers des partenaires, car ces objets appartiennent aux comptes partenaires.

    L'entreprise souhaite posséder chaque objet du compartiment et gérer tous les accès uniquement au moyen de politiques.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep the Object writer setting and add a bucket policy that requires the bucket-owner-full-control ACL on every upload.", fr: "Conserver le paramètre Object writer et ajouter une politique de compartiment qui exige l'ACL bucket-owner-full-control sur chaque chargement." }
    - id: b
      text: { en: "Change S3 Object Ownership to Bucket owner enforced after confirming that the bucket policy grants the partners' access.", fr: "Passer S3 Object Ownership à Bucket owner enforced après avoir vérifié que la politique de compartiment accorde l'accès des partenaires." }
    - id: c
      text: { en: "Turn on S3 Block Public Access for the bucket so that the partner ACLs no longer apply to the objects.", fr: "Activer S3 Block Public Access pour le compartiment afin que les ACL des partenaires ne s'appliquent plus aux objets." }
    - id: d
      text: { en: "Enable S3 Versioning so that each new version of a partner file is owned by the bucket owner.", fr: "Activer S3 Versioning pour que chaque nouvelle version d'un fichier partenaire appartienne au propriétaire du compartiment." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With Bucket owner enforced, ACLs are disabled, the bucket owner owns every object in the bucket, and access is controlled only by policies (IAM, bucket and VPC endpoint policies). AWS recommends reviewing the bucket policy first so that it grants the access that ACLs used to give.
    fr: |
      Avec Bucket owner enforced, les ACL sont désactivées, le propriétaire du compartiment possède chaque objet du compartiment et l'accès est contrôlé uniquement par des politiques (politiques IAM, de compartiment et de point de terminaison de VPC). AWS recommande de vérifier d'abord la politique de compartiment pour qu'elle accorde les accès que donnaient les ACL.
  options:
    a:
      en: |
        With Object writer, the uploading account owns the object even with that ACL, and ACLs remain in use, so access is not managed only with policies.
      fr: |
        Avec Object writer, le compte qui charge l'objet en reste propriétaire même avec cette ACL, et les ACL restent utilisées : l'accès n'est donc pas géré uniquement par des politiques.
    c:
      en: |
        Block Public Access only blocks or ignores public ACLs and policies; it does not change object ownership or disable private ACLs.
      fr: |
        Block Public Access bloque ou ignore seulement les ACL et politiques publiques ; il ne change pas la propriété des objets et ne désactive pas les ACL privées.
    d:
      en: |
        Versioning keeps multiple versions of objects; it has no effect on who owns them.
      fr: |
        La gestion des versions conserve plusieurs versions des objets ; elle n'a aucun effet sur leur propriétaire.
references:
  - title: Controlling ownership of objects and disabling ACLs for your bucket
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html
