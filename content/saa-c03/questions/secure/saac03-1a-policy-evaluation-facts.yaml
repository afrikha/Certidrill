id: saac03-1a-policy-evaluation-facts
objective: "1.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A solutions architect is designing the authorization model for a single AWS account that uses IAM users, groups, roles, identity-based policies and Amazon S3 bucket policies. The architect needs to explain how IAM evaluates requests inside this account to the development teams.

    Which statements are correct? (Choose two.)
  fr: |
    Un architecte de solutions conçoit le modèle d'autorisation d'un seul compte AWS qui utilise des utilisateurs, groupes et rôles IAM, des politiques basées sur l'identité et des politiques de compartiment Amazon S3. L'architecte doit expliquer aux équipes de développement comment IAM évalue les requêtes dans ce compte.

    Quelles affirmations sont correctes ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "An explicit deny in any applicable policy overrides any allow.", fr: "Un refus explicite dans n'importe quelle politique applicable l'emporte sur toute autorisation." } }
    - { id: b, text: { en: "A request is allowed only if both the identity-based policy and the bucket policy allow it.", fr: "Une requête n'est autorisée que si la politique basée sur l'identité et la politique de compartiment l'autorisent toutes les deux." } }
    - { id: c, text: { en: "A permissions boundary attached to a user grants the permissions that it lists.", fr: "Une limite d'autorisations attachée à un utilisateur accorde les autorisations qu'elle liste." } }
    - { id: d, text: { en: "An action is allowed when an identity-based policy, a resource-based policy or both allow it, unless it is explicitly denied.", fr: "Une action est autorisée lorsqu'une politique basée sur l'identité, une politique basée sur les ressources ou les deux l'autorisent, sauf refus explicite." } }
    - { id: e, text: { en: "A user's permissions are the sum of the permissions of every role that the user can assume.", fr: "Les autorisations d'un utilisateur sont la somme des autorisations de tous les rôles qu'il peut endosser." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An explicit deny in any applicable policy always wins. Within one account, identity-based and resource-based policies are combined as a union: an allow from either one is enough when nothing denies the request."
    fr: "Un refus explicite dans toute politique applicable l'emporte toujours. Dans un même compte, les politiques basées sur l'identité et sur les ressources se combinent en union : une autorisation de l'une ou de l'autre suffit si rien ne refuse la requête."
  options:
    b:
      en: "Both sides must allow a request only across accounts; in the same account either policy type is enough."
      fr: "Les deux côtés ne doivent autoriser une requête qu'entre comptes ; dans le même compte, l'un ou l'autre type de politique suffit."
    c:
      en: "A permissions boundary grants nothing by itself; it only limits what identity-based policies can grant."
      fr: "Une limite d'autorisations n'accorde rien par elle-même ; elle limite seulement ce que les politiques basées sur l'identité peuvent accorder."
    e:
      en: "Role permissions are not added to the user's: when the user assumes a role, the role's permissions replace the user's for that session."
      fr: "Les autorisations d'un rôle ne s'ajoutent pas à celles de l'utilisateur : quand l'utilisateur endosse un rôle, elles remplacent les siennes pour cette session."
references:
  - title: Policy evaluation logic
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html
