id: saac03-1b-saml-federation-single-account
objective: "1.1.11"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has a single AWS account and an on-premises identity provider (IdP) that supports SAML 2.0. The company does not plan to use AWS Organizations or IAM Identity Center. Employees must access the AWS Management Console with their corporate credentials, with permissions based on their IdP groups. The company must not create an IAM user for each employee.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise possède un seul compte AWS et un fournisseur d'identité (IdP) sur site compatible SAML 2.0. L'entreprise ne prévoit pas d'utiliser AWS Organizations ni IAM Identity Center. Les employés doivent accéder à la AWS Management Console avec leurs informations d'identification d'entreprise, avec des autorisations fondées sur leurs groupes de l'IdP. L'entreprise ne doit pas créer d'utilisateur IAM pour chaque employé.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a SAML identity provider in IAM by uploading the metadata document of the corporate IdP.", fr: "Créer un fournisseur d'identité SAML dans IAM en chargeant le document de métadonnées de l'IdP d'entreprise." } }
    - { id: b, text: { en: "Create one IAM user per department and share its password with the department's employees.", fr: "Créer un utilisateur IAM par service et partager son mot de passe avec les employés du service." } }
    - { id: c, text: { en: "Create an Amazon Cognito identity pool that gives the corporate IdP users unauthenticated guest access.", fr: "Créer un pool d'identités Amazon Cognito qui accorde aux utilisateurs de l'IdP d'entreprise un accès invité non authentifié." } }
    - { id: d, text: { en: "Create IAM roles whose trust policies allow sts:AssumeRoleWithSAML from the provider, and map IdP groups to the roles.", fr: "Créer des rôles IAM dont les politiques d'approbation autorisent sts:AssumeRoleWithSAML depuis le fournisseur, et associer les groupes de l'IdP aux rôles." } }
    - { id: e, text: { en: "Deploy AD Connector in the account, and register it in IAM as the SAML identity provider for the console.", fr: "Déployer AD Connector dans le compte, et l'enregistrer dans IAM comme fournisseur d'identité SAML pour la console." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For SAML 2.0 federation into one account, you register the corporate IdP in IAM as a SAML identity provider, then create IAM roles whose trust policy names that provider as the federated principal. The IdP sends the role in the SAML assertion according to the user's groups, and AWS STS returns temporary credentials for the role.
    fr: |
      Pour une fédération SAML 2.0 dans un compte, vous enregistrez l'IdP d'entreprise dans IAM comme fournisseur d'identité SAML, puis vous créez des rôles IAM dont la politique d'approbation désigne ce fournisseur comme principal fédéré. L'IdP indique le rôle dans l'assertion SAML selon les groupes de l'utilisateur, et AWS STS renvoie des informations d'identification temporaires pour ce rôle.
  options:
    b:
      en: |
        Shared IAM users break accountability and still create long-term credentials, which the company wants to avoid.
      fr: |
        Des utilisateurs IAM partagés empêchent la traçabilité et créent tout de même des informations d'identification à long terme, ce que l'entreprise veut éviter.
    c:
      en: |
        Cognito identity pools serve application users, and unauthenticated access would bypass the corporate sign-in.
      fr: |
        Les pools d'identités Cognito servent aux utilisateurs d'applications, et un accès non authentifié contournerait la connexion d'entreprise.
    e:
      en: |
        AD Connector proxies requests to Active Directory; it is not a SAML identity provider, and the company's IdP is SAML-based.
      fr: |
        AD Connector relaie des requêtes vers Active Directory ; ce n'est pas un fournisseur d'identité SAML, et l'IdP de l'entreprise repose sur SAML.
references:
  - title: SAML 2.0 federation
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_providers_saml.html
