id: saac03-1d-dsse-kms-two-layers
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A defense contractor stores technical documents in an Amazon S3 bucket. A contract requires every object to be protected at rest by two independent layers of encryption, with the encryption keys controlled in AWS KMS by the contractor.

    The solution must have the LEAST operational overhead and must not require changes to the applications that upload the documents.

    Which solution will meet these requirements?
  fr: |
    Un sous-traitant de la défense stocke des documents techniques dans un compartiment Amazon S3. Un contrat impose que chaque objet soit protégé au repos par deux couches de chiffrement indépendantes, avec des clés de chiffrement contrôlées par le sous-traitant dans AWS KMS.

    La solution doit présenter le MOINS de charge opérationnelle possible et ne doit pas nécessiter de modifier les applications qui chargent les documents.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set the default encryption of the bucket to SSE-KMS with a customer managed key and enable S3 Bucket Keys.", fr: "Définir le chiffrement par défaut du compartiment sur SSE-KMS avec une clé gérée par le client et activer les clés de compartiment S3." }
    - id: b
      text: { en: "Set the default encryption of the bucket to DSSE-KMS with a customer managed key.", fr: "Définir le chiffrement par défaut du compartiment sur DSSE-KMS avec une clé gérée par le client." }
    - id: c
      text: { en: "Change the applications to encrypt each document with the Amazon S3 Encryption Client before uploading it to an SSE-KMS bucket.", fr: "Modifier les applications pour chiffrer chaque document avec Amazon S3 Encryption Client avant de le charger dans un compartiment SSE-KMS." }
    - id: d
      text: { en: "Keep the default SSE-S3 encryption of the bucket and enable S3 Versioning and S3 Object Lock.", fr: "Conserver le chiffrement SSE-S3 par défaut du compartiment et activer S3 Versioning et S3 Object Lock." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Dual-layer server-side encryption with AWS KMS keys (DSSE-KMS) applies two independent layers of AES-256 encryption to each object and can be set as the default encryption of the bucket. The applications keep uploading as before, and the key is controlled in AWS KMS.
    fr: |
      Le chiffrement côté serveur double couche avec des clés AWS KMS (DSSE-KMS) applique deux couches indépendantes de chiffrement AES-256 à chaque objet et peut être défini comme chiffrement par défaut du compartiment. Les applications continuent de charger les objets comme avant, et la clé est contrôlée dans AWS KMS.
  options:
    a:
      en: |
        SSE-KMS applies a single layer of encryption; S3 Bucket Keys only reduce the number of requests to AWS KMS.
      fr: |
        SSE-KMS n'applique qu'une seule couche de chiffrement ; les clés de compartiment S3 réduisent seulement le nombre de requêtes vers AWS KMS.
    c:
      en: |
        Client-side encryption plus SSE-KMS gives two layers, but it requires changing the applications and managing the client library.
      fr: |
        Le chiffrement côté client associé à SSE-KMS donne deux couches, mais il impose de modifier les applications et de gérer la bibliothèque cliente.
    d:
      en: |
        SSE-S3 is a single layer with keys managed by S3, not by the contractor in AWS KMS. Versioning and Object Lock protect against deletion and add no encryption layer.
      fr: |
        SSE-S3 est une seule couche avec des clés gérées par S3, et non par le sous-traitant dans AWS KMS. La gestion des versions et Object Lock protègent contre la suppression et n'ajoutent aucune couche de chiffrement.
references:
  - title: Using dual-layer server-side encryption with AWS KMS keys (DSSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingDSSEncryption.html
