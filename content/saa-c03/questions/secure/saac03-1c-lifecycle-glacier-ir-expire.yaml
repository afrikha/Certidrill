id: saac03-1c-lifecycle-glacier-ir-expire
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's retention policy requires that application audit logs in Amazon S3 be kept for exactly 1 year and then deleted. The logs are read often during the first 30 days. After 30 days, auditors open them only a few times a year, but they must get them within milliseconds. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    La politique de conservation d'une entreprise exige que les journaux d'audit d'application stockés dans Amazon S3 soient conservés exactement 1 an, puis supprimés. Les journaux sont souvent lus pendant les 30 premiers jours. Après 30 jours, les auditeurs ne les ouvrent que quelques fois par an, mais ils doivent les obtenir en quelques millisecondes. L'entreprise veut la solution la PLUS économique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use a lifecycle rule that transitions objects to S3 Glacier Flexible Retrieval after 30 days and expires them after 365 days."
        fr: "Utiliser une règle de cycle de vie qui fait passer les objets dans S3 Glacier Flexible Retrieval après 30 jours et les fait expirer après 365 jours."
    - id: b
      text:
        en: "Use a lifecycle rule that transitions objects to S3 Glacier Deep Archive after 30 days and expires them after 365 days."
        fr: "Utiliser une règle de cycle de vie qui fait passer les objets dans S3 Glacier Deep Archive après 30 jours et les fait expirer après 365 jours."
    - id: c
      text:
        en: "Use a lifecycle rule that transitions objects to S3 Glacier Instant Retrieval after 30 days and expires them after 365 days."
        fr: "Utiliser une règle de cycle de vie qui fait passer les objets dans S3 Glacier Instant Retrieval après 30 jours et les fait expirer après 365 jours."
    - id: d
      text:
        en: "Keep the objects in S3 Standard and run a daily AWS Lambda function that deletes objects older than 365 days."
        fr: "Conserver les objets dans S3 Standard et exécuter chaque jour une fonction AWS Lambda qui supprime les objets de plus de 365 jours."
answer: { optionId: c }
explanation:
  correct:
    en: |
      S3 Glacier Instant Retrieval suits data that is accessed a few times a year but needs millisecond access, at a lower storage price than the infrequent access classes. Its 90-day minimum storage duration is met because objects stay there from day 30 to day 365, and the lifecycle expiration action deletes them at the end of the retention period.
    fr: |
      S3 Glacier Instant Retrieval convient aux données consultées quelques fois par an mais qui exigent un accès en millisecondes, avec un prix de stockage inférieur à celui des classes à accès peu fréquent. Sa durée minimale de stockage de 90 jours est respectée puisque les objets y restent du jour 30 au jour 365, et l'action d'expiration du cycle de vie les supprime à la fin de la période de conservation.
  options:
    a:
      en: |
        Glacier Flexible Retrieval has retrieval times of minutes to hours, which fails the millisecond requirement.
      fr: |
        Glacier Flexible Retrieval a des délais de récupération de quelques minutes à quelques heures, ce qui ne respecte pas l'exigence d'un accès en millisecondes.
    b:
      en: |
        Glacier Deep Archive has retrieval times of hours and a 180-day minimum storage duration.
      fr: |
        Glacier Deep Archive a des délais de récupération de plusieurs heures et une durée minimale de stockage de 180 jours.
    d:
      en: |
        Keeping rarely read data in S3 Standard costs more, and custom deletion code adds overhead that a lifecycle expiration action avoids.
      fr: |
        Conserver dans S3 Standard des données rarement lues coûte plus cher, et un code de suppression personnalisé ajoute une charge qu'une action d'expiration du cycle de vie évite.
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
  - title: Managing the lifecycle of objects
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html
