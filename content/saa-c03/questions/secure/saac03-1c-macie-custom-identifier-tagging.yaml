id: saac03-1c-macie-custom-identifier-tagging
objective: "1.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An insurance company uses Amazon Macie to classify data in its Amazon S3 buckets. Its documents also contain internal policy numbers in a proprietary format (two letters followed by ten digits) that the managed data identifiers do not detect. When Macie finds policy numbers in an object, the company wants the object to be tagged automatically as confidential so that its retention rules apply.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une compagnie d'assurance utilise Amazon Macie pour classer les données de ses compartiments Amazon S3. Ses documents contiennent aussi des numéros de police internes dans un format propriétaire (deux lettres suivies de dix chiffres) que les identificateurs de données gérés ne détectent pas. Lorsque Macie trouve des numéros de police dans un objet, l'entreprise veut que l'objet soit automatiquement balisé comme confidentiel afin que ses règles de conservation s'appliquent.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create a Macie custom data identifier with a regular expression that matches the policy number format."
        fr: "Créer un identificateur de données personnalisé Macie avec une expression régulière correspondant au format des numéros de police."
    - id: b
      text:
        en: "Add the policy number format to a Macie allow list so that Macie reports matching text as sensitive data in its findings."
        fr: "Ajouter le format des numéros de police à une liste d'autorisation Macie pour que Macie signale le texte correspondant comme donnée sensible dans ses résultats."
    - id: c
      text:
        en: "Turn on S3 Inventory for the buckets so that the inventory reports flag the objects that contain policy numbers."
        fr: "Activer S3 Inventory pour les compartiments afin que les rapports d'inventaire signalent les objets contenant des numéros de police."
    - id: d
      text:
        en: "Create an Amazon EventBridge rule for Macie sensitive data findings that invokes an AWS Lambda function to tag the objects."
        fr: "Créer une règle Amazon EventBridge pour les résultats de données sensibles de Macie qui appelle une fonction AWS Lambda pour baliser les objets."
    - id: e
      text:
        en: "Configure Macie to write its classification results automatically into the object metadata of each affected object."
        fr: "Configurer Macie pour qu'il écrive automatiquement ses résultats de classification dans les métadonnées de chaque objet concerné."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A custom data identifier is a regular expression, optionally refined with keywords and a proximity rule, that supplements the managed data identifiers for proprietary data types. Macie publishes sensitive data findings to EventBridge automatically, and a rule can invoke a Lambda function that acts on the affected objects, such as adding a tag.
    fr: |
      Un identificateur de données personnalisé est une expression régulière, éventuellement affinée par des mots-clés et une règle de proximité, qui complète les identificateurs de données gérés pour les types de données propriétaires. Macie publie automatiquement ses résultats de données sensibles dans EventBridge, et une règle peut appeler une fonction Lambda qui agit sur les objets concernés, par exemple en ajoutant une balise.
  options:
    b:
      en: |
        Allow lists define text that Macie ignores; they do the opposite of what is needed.
      fr: |
        Les listes d'autorisation définissent du texte que Macie ignore ; elles font l'inverse de ce qui est demandé.
    c:
      en: |
        S3 Inventory reports object metadata; it does not inspect object content.
      fr: |
        S3 Inventory fournit des métadonnées d'objets ; il n'inspecte pas le contenu des objets.
    e:
      en: |
        Macie does not modify objects or their metadata; it generates findings that other services can act on.
      fr: |
        Macie ne modifie ni les objets ni leurs métadonnées ; il génère des résultats sur lesquels d'autres services peuvent agir.
references:
  - title: Building custom data identifiers
    url: https://docs.aws.amazon.com/macie/latest/user/custom-data-identifiers.html
  - title: Processing Macie findings with Amazon EventBridge
    url: https://docs.aws.amazon.com/macie/latest/user/findings-monitor-events-eventbridge.html
