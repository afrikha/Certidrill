id: saac03-1c-nat-gateway-private-egress
objective: "1.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs batch-processing Amazon EC2 instances in private subnets of a VPC. The instances use IPv4 only and must download software updates from the internet. Hosts on the internet must not be able to initiate connections to the instances. The company wants a managed solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique exécute des instances Amazon EC2 de traitement par lots dans des sous-réseaux privés d'un VPC. Les instances utilisent uniquement IPv4 et doivent télécharger des mises à jour logicielles depuis Internet. Les hôtes d'Internet ne doivent pas pouvoir initier de connexions vers les instances. L'entreprise veut une solution gérée avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Attach an egress-only internet gateway to the VPC and add a 0.0.0.0/0 route to it in the private subnets' route table."
        fr: "Attacher une passerelle Internet de sortie uniquement au VPC et ajouter une route 0.0.0.0/0 vers celle-ci dans la table de routage des sous-réseaux privés."
    - id: b
      text:
        en: "Add a 0.0.0.0/0 route to the internet gateway in the private subnets' route table and assign public IPv4 addresses to the instances."
        fr: "Ajouter une route 0.0.0.0/0 vers la passerelle Internet dans la table de routage des sous-réseaux privés et attribuer des adresses IPv4 publiques aux instances."
    - id: c
      text:
        en: "Launch a NAT instance from a Linux AMI in a public subnet and add a 0.0.0.0/0 route to it in the private subnets' route table."
        fr: "Lancer une instance NAT à partir d'une AMI Linux dans un sous-réseau public et ajouter une route 0.0.0.0/0 vers celle-ci dans la table de routage des sous-réseaux privés."
    - id: d
      text:
        en: "Create a public NAT gateway and add a 0.0.0.0/0 route to the NAT gateway in the private subnets' route table."
        fr: "Créer une passerelle NAT publique et ajouter une route 0.0.0.0/0 vers la passerelle NAT dans la table de routage des sous-réseaux privés."
answer: { optionId: d }
explanation:
  correct:
    en: |
      A public NAT gateway is a managed service that lets instances in private subnets connect to the internet while external hosts cannot initiate connections to them. The private subnets send their internet-bound IPv4 traffic to the NAT gateway through a 0.0.0.0/0 route.
    fr: |
      Une passerelle NAT publique est un service géré qui permet aux instances de sous-réseaux privés de se connecter à Internet sans que des hôtes externes puissent initier de connexions vers elles. Les sous-réseaux privés envoient leur trafic IPv4 destiné à Internet vers la passerelle NAT au moyen d'une route 0.0.0.0/0.
  options:
    a:
      en: |
        An egress-only internet gateway works only for IPv6 traffic; it cannot be used for a 0.0.0.0/0 IPv4 route.
      fr: |
        Une passerelle Internet de sortie uniquement ne fonctionne que pour le trafic IPv6 ; elle ne peut pas servir de cible à une route IPv4 0.0.0.0/0.
    b:
      en: |
        A route to the internet gateway plus public IP addresses makes the subnets public, so internet hosts could initiate connections to the instances.
      fr: |
        Une route vers la passerelle Internet associée à des adresses IP publiques rend les sous-réseaux publics : des hôtes d'Internet pourraient alors initier des connexions vers les instances.
    c:
      en: |
        A NAT instance works, but the company must patch, scale and make it highly available itself, which is more operational overhead than a managed NAT gateway.
      fr: |
        Une instance NAT fonctionne, mais l'entreprise doit elle-même la corriger, la dimensionner et la rendre hautement disponible, ce qui représente plus de charge opérationnelle qu'une passerelle NAT gérée.
references:
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
