id: saac03-1b-scp-no-grant
objective: "1.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations. A member account is in an OU that has an allow-list SCP that permits only Amazon S3 and Amazon DynamoDB actions. A developer in this account uses a new IAM role that has no permissions policies attached. The developer receives AccessDenied errors when listing the objects of an S3 bucket in the same account. The bucket has no bucket policy. The company must keep the SCP in place.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations. Un compte membre se trouve dans une OU à laquelle est attachée une SCP de type liste d'autorisation qui permet uniquement les actions Amazon S3 et Amazon DynamoDB. Un développeur de ce compte utilise un nouveau rôle IAM auquel aucune politique d'autorisations n'est attachée. Le développeur reçoit des erreurs AccessDenied lorsqu'il liste les objets d'un compartiment S3 du même compte. Le compartiment n'a pas de politique de compartiment. L'entreprise doit conserver la SCP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an identity-based policy to the developer's IAM role that allows s3:ListBucket on the bucket.", fr: "Attacher au rôle IAM du développeur une politique basée sur l'identité qui autorise s3:ListBucket sur le compartiment." }
    - id: b
      text: { en: "Add an explicit Allow statement for s3:ListBucket on the bucket to the SCP attached to the OU.", fr: "Ajouter à la SCP attachée à l'OU une instruction Allow explicite pour s3:ListBucket sur le compartiment." }
    - id: c
      text: { en: "Attach the FullAWSAccess SCP directly to the member account in addition to the OU's SCP.", fr: "Attacher la SCP FullAWSAccess directement au compte membre, en plus de la SCP de l'OU." }
    - id: d
      text: { en: "Move the member account directly under the organization root so that the OU's SCP no longer applies.", fr: "Déplacer le compte membre directement sous la racine de l'organisation pour que la SCP de l'OU ne s'applique plus." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      SCPs never grant permissions: they only set the maximum permissions available to principals in member accounts. The SCP already allows S3 actions, but the role has no identity-based policy, so nothing grants the access. Attaching a policy that allows s3:ListBucket gives the developer access within the SCP's limits.
    fr: |
      Les SCP n'accordent jamais d'autorisations : elles fixent seulement les autorisations maximales disponibles pour les principaux des comptes membres. La SCP autorise déjà les actions S3, mais le rôle n'a aucune politique basée sur l'identité, donc rien n'accorde l'accès. Attacher une politique qui autorise s3:ListBucket donne l'accès au développeur dans les limites de la SCP.
  options:
    b:
      en: |
        The SCP already allows S3 actions, and adding Allow statements to an SCP still grants nothing to the role.
      fr: |
        La SCP autorise déjà les actions S3, et ajouter des instructions Allow à une SCP n'accorde toujours rien au rôle.
    c:
      en: |
        FullAWSAccess is also an SCP, so it grants no permission to the role, and the OU's SCP still caps what the account can do.
      fr: |
        FullAWSAccess est aussi une SCP : elle n'accorde donc aucune autorisation au rôle, et la SCP de l'OU plafonne toujours ce que le compte peut faire.
    d:
      en: |
        Moving the account removes the guardrail the company wants to keep, and the role would still have no permissions.
      fr: |
        Déplacer le compte supprime le garde-fou que l'entreprise veut conserver, et le rôle n'aurait toujours aucune autorisation.
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
