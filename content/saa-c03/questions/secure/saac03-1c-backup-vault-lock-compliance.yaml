id: saac03-1c-backup-vault-lock-compliance
objective: "1.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank uses AWS Backup to protect its databases and file systems. Its retention policy states that every backup in the vault must be kept for at least 35 days and no more than 365 days, and that no one, including the root user, can delete a backup early or change these limits. The compliance team wants a few days to test the configuration and remove it if needed before it becomes permanent.

    Which solution will meet these requirements?
  fr: |
    Une banque utilise AWS Backup pour protéger ses bases de données et ses systèmes de fichiers. Sa politique de conservation stipule que chaque sauvegarde du coffre doit être conservée au moins 35 jours et au plus 365 jours, et que personne, y compris l'utilisateur racine, ne peut supprimer une sauvegarde avant terme ni modifier ces limites. L'équipe de conformité veut quelques jours pour tester la configuration et la retirer si nécessaire avant qu'elle ne devienne permanente.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Apply AWS Backup Vault Lock in governance mode with a minimum retention of 35 days and a maximum retention of 365 days."
        fr: "Appliquer AWS Backup Vault Lock en mode gouvernance avec une conservation minimale de 35 jours et une conservation maximale de 365 jours."
    - id: b
      text:
        en: "Attach a service control policy that denies backup:DeleteRecoveryPoint to all accounts, and set a 35-day retention in the backup plan."
        fr: "Attacher une politique de contrôle des services qui refuse backup:DeleteRecoveryPoint à tous les comptes, et définir une conservation de 35 jours dans le plan de sauvegarde."
    - id: c
      text:
        en: "Apply AWS Backup Vault Lock in compliance mode with a grace time of 3 days, a minimum retention of 35 days and a maximum retention of 365 days."
        fr: "Appliquer AWS Backup Vault Lock en mode conformité avec un délai de grâce de 3 jours, une conservation minimale de 35 jours et une conservation maximale de 365 jours."
    - id: d
      text:
        en: "Enable S3 Object Lock in compliance mode on the backup vault with a default retention of 35 days."
        fr: "Activer S3 Object Lock en mode conformité sur le coffre de sauvegarde avec une conservation par défaut de 35 jours."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Vault Lock in compliance mode cannot be altered or deleted by any user or by AWS once its grace time expires; the grace time must be at least 3 days, and during it the lock can still be changed or removed. The minimum and maximum retention settings make backup and copy jobs with retention outside 35 to 365 days fail, and early deletion is denied even to the root user.
    fr: |
      Un Vault Lock en mode conformité ne peut plus être modifié ni supprimé par aucun utilisateur ni par AWS une fois son délai de grâce expiré ; ce délai doit être d'au moins 3 jours, et pendant ce délai le verrou peut encore être modifié ou retiré. Les paramètres de conservation minimale et maximale font échouer les tâches de sauvegarde et de copie dont la conservation sort de l'intervalle de 35 à 365 jours, et la suppression anticipée est refusée même à l'utilisateur racine.
  options:
    a:
      en: |
        Governance mode lets users with sufficient IAM permissions change or remove the lock, so it never becomes permanent.
      fr: |
        Le mode gouvernance permet aux utilisateurs disposant d'autorisations IAM suffisantes de modifier ou de retirer le verrou : il ne devient jamais permanent.
    b:
      en: |
        An SCP can be detached by the management account administrators, so the protection is not permanent, and it does not enforce a maximum retention.
      fr: |
        Une SCP peut être détachée par les administrateurs du compte de gestion : la protection n'est pas permanente, et elle n'impose pas de conservation maximale.
    d:
      en: |
        S3 Object Lock applies to S3 buckets, not to AWS Backup vaults.
      fr: |
        S3 Object Lock s'applique aux compartiments S3, pas aux coffres AWS Backup.
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
