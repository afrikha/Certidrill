id: saac03-1c-tgw-isolated-shared
objective: "1.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 25 VPCs for separate business units and one shared services VPC that hosts directory and logging servers. The on-premises data center connects to AWS through a single Site-to-Site VPN connection. The business unit VPCs must not be able to communicate with each other, but each of them must reach the shared services VPC and the on-premises network. The company expects to add more VPCs and wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 25 VPC pour des unités commerciales distinctes et d'un VPC de services partagés qui héberge des serveurs d'annuaire et de journalisation. Le centre de données sur site se connecte à AWS par une seule connexion Site-to-Site VPN. Les VPC des unités commerciales ne doivent pas pouvoir communiquer entre eux, mais chacun doit atteindre le VPC de services partagés et le réseau sur site. L'entreprise prévoit d'ajouter d'autres VPC et veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a VPC peering connection between each business unit VPC and the shared services VPC, and terminate the VPN connection on a virtual private gateway attached to the shared services VPC."
        fr: "Créer une connexion d'appairage de VPC entre chaque VPC d'unité commerciale et le VPC de services partagés, et terminer la connexion VPN sur une passerelle réseau privé virtuel attachée au VPC de services partagés."
    - id: b
      text:
        en: "Attach all VPCs and the VPN connection to a transit gateway that uses its default route table, with route propagation enabled for every attachment."
        fr: "Attacher tous les VPC et la connexion VPN à une passerelle de transit qui utilise sa table de routage par défaut, avec la propagation des routes activée pour chaque attachement."
    - id: c
      text:
        en: "Attach all VPCs and the VPN connection to a transit gateway with two route tables: business unit VPCs associate with one table, and shared services and VPN attachments associate with the other and propagate to both."
        fr: "Attacher tous les VPC et la connexion VPN à une passerelle de transit avec deux tables de routage : les VPC des unités commerciales sont associés à l'une, et les attachements du VPC partagé et du VPN sont associés à l'autre et propagent leurs routes vers les deux."
    - id: d
      text:
        en: "Create a separate Site-to-Site VPN connection from the data center to a virtual private gateway in each VPC, and peer each business unit VPC with the shared services VPC."
        fr: "Créer une connexion Site-to-Site VPN distincte entre le centre de données et une passerelle réseau privé virtuel dans chaque VPC, et appairer chaque VPC d'unité commerciale avec le VPC de services partagés."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each transit gateway attachment is associated with one route table and can propagate its routes to several. Business unit VPCs associate with an isolated route table that only contains routes propagated by the shared services VPC and the VPN, so they cannot reach each other. The shared route table receives the business unit routes, so shared services and on-premises can reach every VPC, and new VPCs only need one attachment.
    fr: |
      Chaque attachement de passerelle de transit est associé à une seule table de routage et peut propager ses routes vers plusieurs. Les VPC des unités commerciales sont associés à une table de routage isolée qui ne contient que les routes propagées par le VPC de services partagés et par le VPN : ils ne peuvent donc pas se joindre entre eux. La table partagée reçoit les routes des unités commerciales : les services partagés et le réseau sur site atteignent chaque VPC, et un nouveau VPC ne demande qu'un attachement.
  options:
    a:
      en: |
        VPC peering is not transitive, so the business unit VPCs cannot reach the on-premises network through the VPN gateway of the shared services VPC.
      fr: |
        L'appairage de VPC n'est pas transitif : les VPC des unités commerciales ne peuvent pas atteindre le réseau sur site par la passerelle VPN du VPC de services partagés.
    b:
      en: |
        With a single route table that receives every propagation, all attachments learn routes to each other, so the business unit VPCs can communicate.
      fr: |
        Avec une seule table de routage qui reçoit toutes les propagations, tous les attachements apprennent les routes des autres : les VPC des unités commerciales peuvent alors communiquer.
    d:
      en: |
        This works, but managing 26 VPN connections and 25 peering connections, and adding more for each new VPC, is far more operational overhead.
      fr: |
        Cette solution fonctionne, mais gérer 26 connexions VPN et 25 connexions d'appairage, et en ajouter pour chaque nouveau VPC, représente beaucoup plus de charge opérationnelle.
references:
  - title: How AWS Transit Gateway works
    url: https://docs.aws.amazon.com/vpc/latest/tgw/how-transit-gateways-work.html
