id: saac03-1d-ebs-encryption-default
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's development teams launch Amazon EC2 instances in the us-east-1 Region from many different launch templates and scripts. A security review found that some new Amazon EBS volumes are not encrypted.

    All new EBS volumes in the Region must be encrypted at rest. The existing launch templates and scripts must keep working without changes, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Les équipes de développement d'une entreprise lancent des instances Amazon EC2 dans la Région us-east-1 à partir de nombreux modèles de lancement et scripts différents. Un audit de sécurité a révélé que certains nouveaux volumes Amazon EBS ne sont pas chiffrés.

    Tous les nouveaux volumes EBS de la Région doivent être chiffrés au repos. Les modèles de lancement et les scripts existants doivent continuer à fonctionner sans modification, avec le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy the encrypted-volumes AWS Config managed rule and notify each team when it reports a noncompliant volume.", fr: "Déployer la règle gérée AWS Config encrypted-volumes et avertir chaque équipe lorsqu'elle signale un volume non conforme." }
    - id: b
      text: { en: "Ask every team to update its launch templates and scripts so that each block device mapping sets encryption.", fr: "Demander à chaque équipe de mettre à jour ses modèles de lancement et scripts pour que chaque mappage de périphérique de stockage active le chiffrement." }
    - id: c
      text: { en: "Enable Amazon EBS encryption by default in the us-east-1 Region for the account.", fr: "Activer le chiffrement par défaut d'Amazon EBS dans la Région us-east-1 pour le compte." }
    - id: d
      text: { en: "Attach an SCP that denies ec2:CreateVolume and ec2:RunInstances requests that create unencrypted volumes.", fr: "Attacher une SCP qui refuse les requêtes ec2:CreateVolume et ec2:RunInstances qui créent des volumes non chiffrés." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      EBS encryption by default is a per-Region account setting. After it is enabled, every new volume (including the volumes created at instance launch) is encrypted with the default KMS key, even if the request does not ask for encryption, so templates and scripts need no change.
    fr: |
      Le chiffrement par défaut d'EBS est un paramètre de compte propre à chaque Région. Une fois activé, chaque nouveau volume (y compris ceux créés au lancement d'une instance) est chiffré avec la clé KMS par défaut, même si la requête ne demande pas de chiffrement ; les modèles et les scripts n'ont donc pas besoin d'être modifiés.
  options:
    a:
      en: |
        The Config rule only detects unencrypted volumes after they exist; it does not encrypt them.
      fr: |
        La règle Config détecte seulement les volumes non chiffrés après leur création ; elle ne les chiffre pas.
    b:
      en: |
        Updating every template and script is manual work that depends on each team, and the requirement says they must keep working without changes.
      fr: |
        Mettre à jour chaque modèle et script est un travail manuel qui dépend de chaque équipe, et l'exigence impose qu'ils continuent de fonctionner sans modification.
    d:
      en: |
        The SCP would block the unencrypted requests, so existing templates and scripts that do not request encryption would start to fail.
      fr: |
        La SCP bloquerait les requêtes non chiffrées : les modèles et scripts existants qui ne demandent pas de chiffrement commenceraient à échouer.
references:
  - title: Enable Amazon EBS encryption by default
    url: https://docs.aws.amazon.com/ebs/latest/userguide/encryption-by-default.html
