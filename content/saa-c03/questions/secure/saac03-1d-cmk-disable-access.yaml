id: saac03-1d-cmk-disable-access
objective: "1.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A legal services company stores case files in an Amazon S3 bucket. The security team must be able to make all objects in the bucket unreadable immediately, during an incident, by taking one action on the encryption key, and must be able to review every use of that key in AWS CloudTrail. The applications that read and write the objects must not change.

    Which solution will meet these requirements?
  fr: |
    Un cabinet de services juridiques stocke des dossiers dans un compartiment Amazon S3. En cas d'incident, l'équipe de sécurité doit pouvoir rendre immédiatement illisibles tous les objets du compartiment par une seule action sur la clé de chiffrement, et doit pouvoir examiner chaque utilisation de cette clé dans AWS CloudTrail. Les applications qui lisent et écrivent les objets ne doivent pas changer.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use SSE-S3 default encryption and deny s3:GetObject in the bucket policy during an incident.", fr: "Utiliser le chiffrement par défaut SSE-S3 et refuser s3:GetObject dans la politique de compartiment en cas d'incident." }
    - id: b
      text: { en: "Use SSE-KMS default encryption with the AWS managed key aws/s3 and disable that key during an incident.", fr: "Utiliser le chiffrement par défaut SSE-KMS avec la clé gérée par AWS aws/s3 et désactiver cette clé en cas d'incident." }
    - id: c
      text: { en: "Use SSE-KMS default encryption with a customer managed key and disable that key during an incident.", fr: "Utiliser le chiffrement par défaut SSE-KMS avec une clé gérée par le client et désactiver cette clé en cas d'incident." }
    - id: d
      text: { en: "Use client-side encryption with keys stored in AWS Secrets Manager and delete the secret during an incident.", fr: "Utiliser le chiffrement côté client avec des clés stockées dans AWS Secrets Manager et supprimer le secret en cas d'incident." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With SSE-KMS and a customer managed key, S3 needs AWS KMS to decrypt the data keys, so disabling the key makes every object unreadable until it is re-enabled. Use of a customer managed key is logged in the company's CloudTrail, and S3 encrypts and decrypts transparently, so the applications do not change.
    fr: |
      Avec SSE-KMS et une clé gérée par le client, S3 a besoin d'AWS KMS pour déchiffrer les clés de données : désactiver la clé rend tous les objets illisibles jusqu'à sa réactivation. L'utilisation d'une clé gérée par le client est journalisée dans le CloudTrail de l'entreprise, et S3 chiffre et déchiffre de façon transparente : les applications ne changent pas.
  options:
    a:
      en: |
        With SSE-S3, the keys are managed by S3 and there is no key the company can disable or audit; a bucket policy change is an access control, not an action on the key.
      fr: |
        Avec SSE-S3, les clés sont gérées par S3 et il n'existe aucune clé que l'entreprise puisse désactiver ou auditer ; modifier la politique de compartiment est un contrôle d'accès, pas une action sur la clé.
    b:
      en: |
        AWS managed keys cannot be disabled, deleted or have their key policy changed; only the service uses them on the company's behalf.
      fr: |
        Les clés gérées par AWS ne peuvent être ni désactivées ni supprimées, et leur politique de clé ne peut pas être modifiée ; seul le service les utilise pour le compte de l'entreprise.
    d:
      en: |
        Client-side encryption requires changing the applications to encrypt and decrypt the data, and the use of a key stored in a secret is not recorded in CloudTrail as key usage.
      fr: |
        Le chiffrement côté client impose de modifier les applications pour qu'elles chiffrent et déchiffrent les données, et l'utilisation d'une clé stockée dans un secret n'est pas enregistrée dans CloudTrail comme une utilisation de clé.
references:
  - title: AWS KMS keys
    url: https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html
