id: saac03-1b-firewall-manager-sg-audit
objective: "1.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 150 accounts in AWS Organizations. The security team must find and automatically remediate security group rules that allow SSH (TCP 22) from 0.0.0.0/0 in every account, including accounts created in the future. The team wants to manage this from a single administrator account with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 150 comptes dans AWS Organizations. L'équipe de sécurité doit détecter et corriger automatiquement les règles de groupe de sécurité qui autorisent SSH (TCP 22) depuis 0.0.0.0/0 dans chaque compte, y compris les comptes créés à l'avenir. L'équipe veut gérer cela depuis un seul compte administrateur, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy a Lambda function in each account that scans security groups every hour and deletes the offending rules.", fr: "Déployer dans chaque compte une fonction Lambda qui analyse les groupes de sécurité toutes les heures et supprime les règles en cause." }
    - id: b
      text: { en: "Attach an SCP to the root that denies ec2:AuthorizeSecurityGroupIngress in all member accounts.", fr: "Attacher à la racine une SCP qui refuse ec2:AuthorizeSecurityGroupIngress dans tous les comptes membres." }
    - id: c
      text: { en: "Create an AWS Firewall Manager content audit security group policy with automatic remediation for the organization.", fr: "Créer une politique de groupe de sécurité AWS Firewall Manager d'audit de contenu avec correction automatique pour l'organisation." }
    - id: d
      text: { en: "Enable Amazon Inspector in every account to report instances that are reachable on port 22.", fr: "Activer Amazon Inspector dans chaque compte pour signaler les instances joignables sur le port 22." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Firewall Manager security group policies manage security groups across an organization from the Firewall Manager administrator account. A content audit policy finds rules that break the policy, such as SSH open to 0.0.0.0/0, and can remediate them automatically, and Firewall Manager keeps applying it as new accounts and resources appear.
    fr: |
      Les politiques de groupe de sécurité de Firewall Manager gèrent les groupes de sécurité de toute une organisation depuis le compte administrateur Firewall Manager. Une politique d'audit de contenu trouve les règles non conformes, comme SSH ouvert à 0.0.0.0/0, et peut les corriger automatiquement, et Firewall Manager continue de l'appliquer à mesure que de nouveaux comptes et ressources apparaissent.
  options:
    a:
      en: |
        Custom functions in 150 accounts must be written, deployed to new accounts and maintained, which is high overhead.
      fr: |
        Des fonctions personnalisées dans 150 comptes doivent être écrites, déployées dans les nouveaux comptes et maintenues, ce qui est lourd.
    b:
      en: |
        This blocks every inbound rule change, including legitimate ones, and does nothing about the rules that already exist.
      fr: |
        Cette SCP bloque toute modification de règle entrante, y compris légitime, et ne traite pas les règles déjà existantes.
    d:
      en: |
        Inspector can report network exposure, but it does not remediate security group rules.
      fr: |
        Inspector peut signaler une exposition réseau, mais il ne corrige pas les règles de groupe de sécurité.
references:
  - title: Using security group policies in Firewall Manager to manage Amazon VPC security groups
    url: https://docs.aws.amazon.com/waf/latest/developerguide/security-group-policies.html
