id: saac03-1a-az-id-cross-account
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has two AWS accounts that were created in 2018 and 2021. An application in the first account must run in the same physical Availability Zone as a database in the second account in the US East (N. Virginia) Region to avoid cross-AZ latency. The application team plans to use the Availability Zone that is named us-east-1a in both accounts.

    What should a solutions architect recommend?
  fr: |
    Une entreprise dispose de deux comptes AWS créés en 2018 et en 2021. Une application du premier compte doit s'exécuter dans la même zone de disponibilité physique qu'une base de données du second compte, dans la Région US East (N. Virginia), pour éviter la latence entre zones. L'équipe applicative prévoit d'utiliser la zone de disponibilité nommée us-east-1a dans les deux comptes.

    Que doit recommander un architecte de solutions ?
body:
  options:
    - id: a
      text: { en: "Use us-east-1a in both accounts because Availability Zone names map to the same location in every account.", fr: "Utiliser us-east-1a dans les deux comptes, car les noms de zone de disponibilité correspondent au même emplacement dans tous les comptes." }
    - id: b
      text: { en: "Select the Availability Zone by its AZ ID, such as use1-az1, in both accounts instead of by its name.", fr: "Sélectionner la zone de disponibilité par son ID d'AZ, par exemple use1-az1, dans les deux comptes plutôt que par son nom." }
    - id: c
      text: { en: "Create a cluster placement group in each account with the same name to place the resources together.", fr: "Créer dans chaque compte un groupe de placement de cluster portant le même nom pour regrouper les ressources." }
    - id: d
      text: { en: "Move both workloads to a Local Zone, which has the same identifier in every account.", fr: "Déplacer les deux charges de travail vers une Local Zone, qui a le même identifiant dans tous les comptes." }
answer: { optionId: b }
explanation:
  correct:
    en: "For accounts created before November 2025 in the oldest Regions, AZ names are mapped to physical locations independently for each account, so us-east-1a can be different zones. AZ IDs identify the same physical location in every account and are the way to coordinate placement across accounts."
    fr: "Pour les comptes créés avant novembre 2025 dans les Régions les plus anciennes, les noms d'AZ sont associés aux emplacements physiques indépendamment pour chaque compte : us-east-1a peut désigner des zones différentes. Les ID d'AZ identifient le même emplacement physique dans tous les comptes et permettent de coordonner le placement entre comptes."
  options:
    a:
      en: "For these older accounts, the name-to-location mapping is independent per account, so the same name can point to different physical zones."
      fr: "Pour ces comptes anciens, la correspondance nom-emplacement est indépendante par compte : le même nom peut désigner des zones physiques différentes."
    c:
      en: "Placement groups are per-account constructs and their names do not coordinate placement across accounts; they also do not apply to a managed database in another account."
      fr: "Les groupes de placement sont propres à chaque compte et leur nom ne coordonne pas le placement entre comptes ; ils ne s'appliquent pas non plus à une base de données gérée d'un autre compte."
    d:
      en: "A Local Zone is a Region extension close to a metropolitan area; moving there changes the architecture and is not needed to align two Availability Zones."
      fr: "Une Local Zone est une extension de Région proche d'une métropole ; y migrer change l'architecture et n'est pas nécessaire pour aligner deux zones de disponibilité."
references:
  - title: AWS Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-availability-zones.html
