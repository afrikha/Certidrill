id: saac03-1c-dx-macsec
objective: "1.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading firm connects its data center to AWS with a 100 Gbps AWS Direct Connect dedicated connection. A new regulation requires the firm to encrypt traffic on the link between its router at the Direct Connect location and the AWS device. The firm needs to keep close to the full line rate, which rules out tunneling the traffic through IPsec VPN connections.

    Which solution will meet these requirements?
  fr: |
    Une société de courtage relie son centre de données à AWS par une connexion dédiée AWS Direct Connect de 100 Gbit/s. Une nouvelle réglementation lui impose de chiffrer le trafic sur la liaison entre son routeur dans l'emplacement Direct Connect et l'équipement AWS. La société doit conserver un débit proche de la pleine capacité de la ligne, ce qui exclut de faire passer le trafic dans des tunnels VPN IPsec.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable MAC Security (MACsec) on the dedicated connection, using a MACsec-capable router at the Direct Connect location."
        fr: "Activer MAC Security (MACsec) sur la connexion dédiée, avec un routeur compatible MACsec dans l'emplacement Direct Connect."
    - id: b
      text:
        en: "Replace the connection with a 10 Gbps hosted connection from a Direct Connect partner and enable MACsec on it."
        fr: "Remplacer la connexion par une connexion hébergée de 10 Gbit/s d'un partenaire Direct Connect et y activer MACsec."
    - id: c
      text:
        en: "Rely on the default encryption that Direct Connect applies to all traffic on dedicated connections."
        fr: "S'appuyer sur le chiffrement par défaut que Direct Connect applique à tout le trafic des connexions dédiées."
    - id: d
      text:
        en: "Create a public virtual interface and send all traffic through AWS Site-to-Site VPN tunnels to a virtual private gateway."
        fr: "Créer une interface virtuelle publique et faire passer tout le trafic dans des tunnels AWS Site-to-Site VPN vers une passerelle réseau privé virtuel."
answer: { optionId: a }
explanation:
  correct:
    en: |
      MACsec is an IEEE standard that provides layer 2 point-to-point encryption, integrity and origin authenticity on the cross-connect between the customer router and the AWS device. It is supported on 10, 100 and 400 Gbps dedicated connections at selected locations and runs at line rate, unlike IPsec tunnels.
    fr: |
      MACsec est une norme IEEE qui fournit un chiffrement point à point de couche 2, l'intégrité et l'authenticité d'origine sur l'interconnexion entre le routeur du client et l'équipement AWS. Il est pris en charge sur les connexions dédiées de 10, 100 et 400 Gbit/s dans certains emplacements et fonctionne au débit de la ligne, contrairement aux tunnels IPsec.
  options:
    b:
      en: |
        MACsec is not supported on hosted connections, and a 10 Gbps connection would not keep the current capacity.
      fr: |
        MACsec n'est pas pris en charge sur les connexions hébergées, et une connexion de 10 Gbit/s ne conserverait pas la capacité actuelle.
    c:
      en: |
        Direct Connect does not encrypt traffic in transit by default.
      fr: |
        Direct Connect ne chiffre pas le trafic en transit par défaut.
    d:
      en: |
        This is the IPsec tunneling that the firm ruled out; VPN tunnels have bandwidth quotas far below 100 Gbps (up to 1.25 Gbps for a standard tunnel).
      fr: |
        C'est le tunnel IPsec que la société a exclu ; les tunnels VPN ont des quotas de bande passante très inférieurs à 100 Gbit/s (jusqu'à 1,25 Gbit/s pour un tunnel standard).
references:
  - title: MAC Security in Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/MACsec.html
  - title: Encryption in AWS Direct Connect
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html
