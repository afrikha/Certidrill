id: saac03-1d-noncurrent-version-cleanup
objective: "1.3.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company stores configuration snapshots in an Amazon S3 bucket with S3 Versioning enabled. The application overwrites and deletes objects many times each day, and storage costs keep growing. The company must still be able to recover any overwritten or deleted object for 30 days, after which old data must be removed permanently. Delete markers that no longer have any version under them must be cleaned up.

    Which combination of S3 Lifecycle actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise stocke des instantanés de configuration dans un compartiment Amazon S3 où S3 Versioning est activé. L'application remplace et supprime des objets de nombreuses fois par jour, et les coûts de stockage ne cessent d'augmenter. L'entreprise doit toujours pouvoir récupérer tout objet remplacé ou supprimé pendant 30 jours ; ensuite, les anciennes données doivent être supprimées définitivement. Les marqueurs de suppression qui n'ont plus aucune version en dessous d'eux doivent être nettoyés.

    Quelle combinaison d'actions S3 Lifecycle permet de répondre à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A NoncurrentVersionExpiration action with NoncurrentDays set to 30", fr: "Une action NoncurrentVersionExpiration avec NoncurrentDays défini sur 30" } }
    - { id: b, text: { en: "An Expiration action that expires current versions 30 days after creation", fr: "Une action Expiration qui fait expirer les versions actuelles 30 jours après leur création" } }
    - { id: c, text: { en: "An ExpiredObjectDeleteMarker action that removes expired object delete markers", fr: "Une action ExpiredObjectDeleteMarker qui supprime les marqueurs de suppression d'objet expirés" } }
    - { id: d, text: { en: "A Transition action that moves current versions to S3 Glacier Deep Archive after 30 days", fr: "Une action Transition qui déplace les versions actuelles vers S3 Glacier Deep Archive après 30 jours" } }
    - { id: e, text: { en: "A NoncurrentVersionTransition action that moves noncurrent versions to S3 Standard-IA after 30 days", fr: "Une action NoncurrentVersionTransition qui déplace les versions non actuelles vers S3 Standard-IA après 30 jours" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      NoncurrentVersionExpiration permanently deletes versions 30 days after they become noncurrent, which keeps the 30-day recovery window and then removes the old data. ExpiredObjectDeleteMarker removes delete markers that have no noncurrent version left beneath them.
    fr: |
      NoncurrentVersionExpiration supprime définitivement les versions 30 jours après qu'elles sont devenues non actuelles, ce qui préserve la fenêtre de récupération de 30 jours puis supprime les anciennes données. ExpiredObjectDeleteMarker supprime les marqueurs de suppression sous lesquels il ne reste plus aucune version non actuelle.
  options:
    b:
      en: |
        In a versioned bucket, expiring current versions only adds delete markers and creates more noncurrent versions; it removes live data instead of old data.
      fr: |
        Dans un compartiment versionné, faire expirer les versions actuelles ne fait qu'ajouter des marqueurs de suppression et crée davantage de versions non actuelles ; cela supprime des données actives au lieu des anciennes données.
    d:
      en: |
        Moving current versions to Deep Archive does not remove old versions, and the 180-day minimum storage duration adds charges for data overwritten often.
      fr: |
        Déplacer les versions actuelles vers Deep Archive ne supprime pas les anciennes versions, et la durée minimale de stockage de 180 jours ajoute des frais pour des données souvent remplacées.
    e:
      en: |
        Moving noncurrent versions to Standard-IA lowers their storage price but never deletes them, so the old data is not removed.
      fr: |
        Déplacer les versions non actuelles vers Standard-IA réduit leur prix de stockage mais ne les supprime jamais : les anciennes données ne sont pas éliminées.
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
