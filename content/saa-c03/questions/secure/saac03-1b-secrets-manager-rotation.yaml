id: saac03-1b-secrets-manager-rotation
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An application on Amazon EC2 connects to an Amazon RDS for PostgreSQL database. The database password is hardcoded in the application's configuration file. A security review requires that the password be removed from the file, stored encrypted, and rotated automatically every 30 days. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une application sur Amazon EC2 se connecte à une base de données Amazon RDS for PostgreSQL. Le mot de passe de la base de données est codé en dur dans le fichier de configuration de l'application. Une revue de sécurité exige que le mot de passe soit retiré du fichier, stocké chiffré et renouvelé automatiquement tous les 30 jours. La solution doit exiger le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the password as a SecureString parameter in Parameter Store, and run a custom script on a schedule to change it.", fr: "Stocker le mot de passe comme paramètre SecureString dans Parameter Store, et exécuter un script personnalisé planifié pour le changer." }
    - id: b
      text: { en: "Encrypt the configuration file with an AWS KMS key, and store it in an S3 bucket with versioning enabled.", fr: "Chiffrer le fichier de configuration avec une clé AWS KMS, et le stocker dans un compartiment S3 avec la gestion des versions activée." }
    - id: c
      text: { en: "Store the password in AWS Secrets Manager with automatic rotation every 30 days, and retrieve it at run time.", fr: "Stocker le mot de passe dans AWS Secrets Manager avec une rotation automatique tous les 30 jours, et le récupérer à l'exécution." }
    - id: d
      text: { en: "Store the password on an encrypted EBS volume attached to the instance, and change it manually every month.", fr: "Stocker le mot de passe sur un volume EBS chiffré attaché à l'instance, et le changer manuellement chaque mois." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Secrets Manager stores the secret encrypted with AWS KMS and rotates it automatically on a schedule, updating both the secret and the database credentials. The application calls Secrets Manager at run time, so no password remains in the configuration file.
    fr: |
      Secrets Manager stocke le secret chiffré avec AWS KMS et le renouvelle automatiquement selon un calendrier, en mettant à jour à la fois le secret et les informations d'identification de la base de données. L'application appelle Secrets Manager à l'exécution : aucun mot de passe ne reste dans le fichier de configuration.
  options:
    a:
      en: |
        Parameter Store has no built-in rotation, so the company would have to write and maintain the rotation script.
      fr: |
        Parameter Store n'a pas de rotation intégrée : l'entreprise devrait écrire et maintenir le script de rotation.
    b:
      en: |
        An encrypted file still contains a static password, and nothing rotates it.
      fr: |
        Un fichier chiffré contient toujours un mot de passe statique, et rien ne le renouvelle.
    d:
      en: |
        Manual monthly changes are not automatic rotation and add operational work.
      fr: |
        Des changements manuels mensuels ne constituent pas une rotation automatique et ajoutent du travail opérationnel.
references:
  - title: Rotate AWS Secrets Manager secrets
    url: https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html
