id: saac03-1a-srm-ec2-guest-os
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating a custom application from its data center to Amazon EC2 instances that run Linux. The company's auditors ask which security task the company remains responsible for under the AWS shared responsibility model.

    Which task is the company's responsibility?
  fr: |
    Une entreprise migre une application spécifique de son centre de données vers des instances Amazon EC2 sous Linux. Les auditeurs de l'entreprise demandent de quelle tâche de sécurité l'entreprise reste responsable selon le modèle de responsabilité partagée AWS.

    Quelle tâche relève de la responsabilité de l'entreprise ?
body:
  options:
    - id: a
      text: { en: "Patching the hypervisor of the hosts that run the instances.", fr: "Appliquer les correctifs à l'hyperviseur des hôtes qui exécutent les instances." }
    - id: b
      text: { en: "Applying security patches to the guest operating system of the instances.", fr: "Appliquer les correctifs de sécurité au système d'exploitation invité des instances." }
    - id: c
      text: { en: "Controlling physical access to the data centers that host the instances.", fr: "Contrôler l'accès physique aux centres de données qui hébergent les instances." }
    - id: d
      text: { en: "Replacing failed disks and network devices in the AWS infrastructure.", fr: "Remplacer les disques et équipements réseau défaillants de l'infrastructure AWS." }
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EC2 is an infrastructure service: the customer manages the guest operating system, including updates and security patches, the software installed on the instances and the security groups. AWS is responsible for the security of the cloud, from the virtualization layer down to the physical facilities."
    fr: "Amazon EC2 est un service d'infrastructure : le client gère le système d'exploitation invité, y compris les mises à jour et correctifs de sécurité, les logiciels installés sur les instances et les groupes de sécurité. AWS est responsable de la sécurité du cloud, de la couche de virtualisation jusqu'aux installations physiques."
  options:
    a:
      en: "The hypervisor and virtualization layer are part of the infrastructure that AWS secures and patches."
      fr: "L'hyperviseur et la couche de virtualisation font partie de l'infrastructure qu'AWS sécurise et corrige."
    c:
      en: "Physical and environmental controls are inherited from AWS; customers do not manage data center access."
      fr: "Les contrôles physiques et environnementaux sont hérités d'AWS ; les clients ne gèrent pas l'accès aux centres de données."
    d:
      en: "Hardware maintenance of the AWS infrastructure is part of the security of the cloud, which AWS handles."
      fr: "La maintenance matérielle de l'infrastructure AWS fait partie de la sécurité du cloud, prise en charge par AWS."
references:
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
