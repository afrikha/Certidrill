id: saac03-1a-source-identity
objective: "1.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Employees of a company sign in through a SAML identity provider and assume roles in several AWS accounts. Some automation then assumes further roles from these sessions. The security team must be able to see, in AWS CloudTrail, which employee is behind every action, including actions taken in chained role sessions. Employees must not be able to choose a value that impersonates someone else.

    Which solution will meet these requirements?
  fr: |
    Les employés d'une entreprise se connectent via un fournisseur d'identité SAML et endossent des rôles dans plusieurs comptes AWS. Une automatisation endosse ensuite d'autres rôles à partir de ces sessions. L'équipe de sécurité doit pouvoir voir dans AWS CloudTrail quel employé est à l'origine de chaque action, y compris dans les sessions de rôles chaînées. Les employés ne doivent pas pouvoir choisir une valeur qui usurpe l'identité d'un autre.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Ask each employee to set their user name as the role session name whenever they assume a role.", fr: "Demander à chaque employé de définir son nom d'utilisateur comme nom de session de rôle à chaque endossement." }
    - id: b
      text: { en: "Have the identity provider set a source identity and require sts:SourceIdentity in the trust policies.", fr: "Faire définir une identité source (source identity) par le fournisseur d'identité et exiger sts:SourceIdentity dans les politiques d'approbation." }
    - id: c
      text: { en: "Enable CloudTrail data events for all Amazon S3 buckets and Lambda functions in every account.", fr: "Activer les événements de données CloudTrail pour tous les compartiments Amazon S3 et fonctions Lambda de chaque compte." }
    - id: d
      text: { en: "Pass the employee name as a session tag that is not marked as transitive in the role chain.", fr: "Transmettre le nom de l'employé comme balise de session non marquée comme transitive dans la chaîne de rôles." }
answer: { optionId: b }
explanation:
  correct:
    en: "A source identity identifies who called the role and persists across chained role sessions; it is recorded in CloudTrail. When the identity provider sets it in the assertion and the trust policies require sts:SourceIdentity, every session carries the employee's identity, which cannot be changed later in the chain."
    fr: "Une identité source indique qui a appelé le rôle et persiste dans les sessions de rôles chaînées ; elle est enregistrée dans CloudTrail. Lorsque le fournisseur d'identité la définit dans l'assertion et que les politiques d'approbation exigent sts:SourceIdentity, chaque session porte l'identité de l'employé, qui ne peut plus être modifiée plus loin dans la chaîne."
  options:
    a:
      en: "The caller chooses the role session name freely, so an employee could use another person's name, and the name does not follow chained sessions."
      fr: "L'appelant choisit librement le nom de session de rôle : un employé pourrait utiliser le nom d'une autre personne, et ce nom ne suit pas les sessions chaînées."
    c:
      en: "Data events add object-level activity but do not identify the employee behind a chained role session."
      fr: "Les événements de données ajoutent l'activité au niveau des objets, mais n'identifient pas l'employé derrière une session de rôle chaînée."
    d:
      en: "A session tag that is not transitive is not passed to the next session in a role chain, so later actions lose the employee's name."
      fr: "Une balise de session non transitive n'est pas transmise à la session suivante d'une chaîne de rôles : les actions ultérieures perdent le nom de l'employé."
references:
  - title: AssumeRole
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
