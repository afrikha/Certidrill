id: saac03-1b-network-firewall-domain-egress
objective: "1.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Workloads in private subnets of several VPCs reach the internet through a central egress VPC that contains NAT gateways. A new policy requires that outbound HTTPS traffic be allowed only to a list of approved domain names, such as .example-partner.com, and that all other outbound web traffic be dropped. The company wants a managed service that inspects the traffic in the network path without decrypting it.

    Which solution will meet these requirements?
  fr: |
    Des charges de travail situées dans des sous-réseaux privés de plusieurs VPC accèdent à Internet par un VPC de sortie central qui contient des passerelles NAT. Une nouvelle politique impose que le trafic HTTPS sortant soit autorisé uniquement vers une liste de noms de domaine approuvés, comme .example-partner.com, et que tout autre trafic web sortant soit abandonné. L'entreprise veut un service géré qui inspecte le trafic sur le chemin réseau sans le déchiffrer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the workloads' security groups with outbound rules that reference the approved domain names.", fr: "Configurer les groupes de sécurité des charges de travail avec des règles sortantes qui référencent les noms de domaine approuvés." }
    - id: b
      text: { en: "Deploy AWS Network Firewall in the egress VPC with a stateful domain list rule group for the approved domains.", fr: "Déployer AWS Network Firewall dans le VPC de sortie avec un groupe de règles avec état de type liste de domaines pour les domaines approuvés." }
    - id: c
      text: { en: "Add network ACL rules in the egress VPC that allow outbound traffic only to the approved domain names.", fr: "Ajouter dans le VPC de sortie des règles d'ACL réseau qui autorisent le trafic sortant uniquement vers les noms de domaine approuvés." }
    - id: d
      text: { en: "Associate an AWS WAF web ACL with the NAT gateways, with a rule that matches the approved domain names.", fr: "Associer aux passerelles NAT une liste ACL web AWS WAF, avec une règle qui correspond aux noms de domaine approuvés." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A Network Firewall stateful domain list rule group allows or denies traffic by domain name. For HTTPS it reads the Server Name Indication (SNI) in the TLS handshake, and for HTTP the Host header, so no decryption is needed. In allowlist mode, traffic to other domains is dropped.
    fr: |
      Un groupe de règles avec état de type liste de domaines de Network Firewall autorise ou refuse le trafic selon le nom de domaine. Pour HTTPS, il lit l'indication du nom du serveur (SNI) dans la négociation TLS et, pour HTTP, l'en-tête Host : aucun déchiffrement n'est nécessaire. En mode liste d'autorisation, le trafic vers les autres domaines est abandonné.
  options:
    a:
      en: |
        Security group rules use IP ranges, prefix lists or other security groups as targets; they cannot reference domain names.
      fr: |
        Les règles de groupe de sécurité utilisent comme cibles des plages IP, des listes de préfixes ou d'autres groupes de sécurité ; elles ne peuvent pas référencer de noms de domaine.
    c:
      en: |
        Network ACL rules match CIDR ranges and ports only, not domain names.
      fr: |
        Les règles d'ACL réseau ne correspondent qu'à des plages CIDR et à des ports, pas à des noms de domaine.
    d:
      en: |
        AWS WAF protects resources such as CloudFront, Application Load Balancers and API Gateway; it cannot be associated with a NAT gateway or filter outbound traffic.
      fr: |
        AWS WAF protège des ressources comme CloudFront, les Application Load Balancers et API Gateway ; il ne peut pas être associé à une passerelle NAT ni filtrer le trafic sortant.
references:
  - title: Stateful domain list rule groups in AWS Network Firewall
    url: https://docs.aws.amazon.com/network-firewall/latest/developerguide/stateful-rule-groups-domain-names.html
