id: saac03-1c-lake-formation-row-column
objective: "1.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has a data lake in Amazon S3 that is cataloged in the AWS Glue Data Catalog and queried with Amazon Athena. A `sales` table contains customer email addresses and a `region` column. Regional analysts must query only the rows of their own region and must never see the email column. The company wants to manage these permissions centrally with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de vente au détail possède un lac de données dans Amazon S3, catalogué dans AWS Glue Data Catalog et interrogé avec Amazon Athena. Une table `sales` contient les adresses e-mail des clients et une colonne `region`. Les analystes régionaux ne doivent interroger que les lignes de leur région et ne doivent jamais voir la colonne des adresses e-mail. L'entreprise veut gérer ces autorisations de manière centralisée avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write S3 bucket policies that grant each analyst group access to the prefix of its region, and remove the email column from the files."
        fr: "Écrire des politiques de compartiment S3 qui accordent à chaque groupe d'analystes l'accès au préfixe de sa région, et retirer la colonne des adresses e-mail des fichiers."
    - id: b
      text:
        en: "Register the data lake with AWS Lake Formation and grant each analyst group SELECT through a data filter that excludes the email column and filters rows on the region."
        fr: "Enregistrer le lac de données dans AWS Lake Formation et accorder SELECT à chaque groupe d'analystes au moyen d'un filtre de données qui exclut la colonne des adresses e-mail et filtre les lignes sur la région."
    - id: c
      text:
        en: "Create an Athena workgroup for each region and attach IAM policies that limit each workgroup to its region's queries."
        fr: "Créer un groupe de travail Athena par région et attacher des politiques IAM qui limitent chaque groupe de travail aux requêtes de sa région."
    - id: d
      text:
        en: "Run Amazon Macie on the bucket and configure it to hide the email column from the analysts."
        fr: "Exécuter Amazon Macie sur le compartiment et le configurer pour masquer la colonne des adresses e-mail aux analystes."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Lake Formation adds a grant and revoke permission model over the Data Catalog and enforces database, table, column, row and cell-level permissions in services such as Athena. A data filter combines column exclusion with a row filter expression, so one grant per analyst group meets both requirements.
    fr: |
      Lake Formation ajoute un modèle d'autorisations par octroi et révocation sur le Data Catalog et applique des autorisations au niveau de la base de données, de la table, de la colonne, de la ligne et de la cellule dans des services comme Athena. Un filtre de données combine l'exclusion de colonnes et une expression de filtrage des lignes : un seul octroi par groupe d'analystes répond aux deux exigences.
  options:
    a:
      en: |
        Bucket policies work on objects and prefixes, not on columns or rows, and rewriting the files is extra effort that also removes data other users need.
      fr: |
        Les politiques de compartiment portent sur des objets et des préfixes, pas sur des colonnes ou des lignes, et réécrire les fichiers demande un effort supplémentaire tout en supprimant des données utiles à d'autres utilisateurs.
    c:
      en: |
        Workgroups separate query settings and costs; IAM policies on them cannot restrict which columns or rows a query returns.
      fr: |
        Les groupes de travail séparent les paramètres et les coûts des requêtes ; des politiques IAM qui les visent ne peuvent pas restreindre les colonnes ou les lignes renvoyées par une requête.
    d:
      en: |
        Macie discovers and reports sensitive data in S3; it does not control or mask what Athena returns.
      fr: |
        Macie découvre et signale les données sensibles dans S3 ; il ne contrôle ni ne masque ce que renvoie Athena.
references:
  - title: What is AWS Lake Formation?
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
