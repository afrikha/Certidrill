id: saac03-1d-block-public-access-account
objective: "1.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's AWS account contains 120 Amazon S3 buckets that store internal data, and teams create new buckets every week. None of the buckets should ever be publicly accessible. The company must prevent public access even if a user later attaches a public bucket policy or a public ACL to any existing or future bucket in the account.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Le compte AWS d'une entreprise contient 120 compartiments Amazon S3 qui stockent des données internes, et les équipes créent de nouveaux compartiments chaque semaine. Aucun compartiment ne doit jamais être accessible publiquement. L'entreprise doit empêcher l'accès public même si un utilisateur attache plus tard une politique de compartiment publique ou une ACL publique à un compartiment existant ou futur du compte.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Turn on S3 Block Public Access on each existing bucket and add the setting to the bucket creation procedure of each team.", fr: "Activer S3 Block Public Access sur chaque compartiment existant et ajouter ce paramètre à la procédure de création de compartiments de chaque équipe." }
    - id: b
      text: { en: "Enable Amazon Macie and send its bucket policy findings about public buckets to the security team.", fr: "Activer Amazon Macie et envoyer à l'équipe de sécurité ses résultats de politique concernant les compartiments publics." }
    - id: c
      text: { en: "Turn on all four S3 Block Public Access settings at the account level.", fr: "Activer les quatre paramètres S3 Block Public Access au niveau du compte." }
    - id: d
      text: { en: "Deploy the s3-bucket-public-read-prohibited AWS Config rule and review the noncompliant buckets each week.", fr: "Déployer la règle AWS Config s3-bucket-public-read-prohibited et examiner chaque semaine les compartiments non conformes." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Account-level S3 Block Public Access applies to every bucket and access point in the account, including buckets created later. With all four settings on, public ACLs and public bucket policies are blocked or ignored, whatever is attached to a bucket.
    fr: |
      S3 Block Public Access au niveau du compte s'applique à chaque compartiment et point d'accès du compte, y compris aux compartiments créés ultérieurement. Avec les quatre paramètres activés, les ACL publiques et les politiques de compartiment publiques sont bloquées ou ignorées, quoi qu'on attache à un compartiment.
  options:
    a:
      en: |
        Bucket-level settings must be managed on each bucket, and a user who can change a bucket's settings can turn them off; AWS recommends the account level for BlockPublicPolicy.
      fr: |
        Les paramètres au niveau du compartiment doivent être gérés sur chaque compartiment, et un utilisateur qui peut modifier les paramètres d'un compartiment peut les désactiver ; AWS recommande le niveau du compte pour BlockPublicPolicy.
    b:
      en: |
        Macie detects public buckets and reports findings, but it does not prevent public access.
      fr: |
        Macie détecte les compartiments publics et génère des résultats, mais il n'empêche pas l'accès public.
    d:
      en: |
        An AWS Config rule is a detective control; buckets stay public until someone fixes them.
      fr: |
        Une règle AWS Config est un contrôle de détection ; les compartiments restent publics jusqu'à ce que quelqu'un les corrige.
references:
  - title: Blocking public access to your Amazon S3 storage
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
