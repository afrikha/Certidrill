id: saac03-1b-apigw-lambda-authorizer
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company exposes a REST API in Amazon API Gateway to partner applications. Partners authenticate against the company's existing proprietary token service, which issues opaque tokens that can be validated only by calling that service. The company must reject requests with invalid tokens at API Gateway before they reach the backend, and it must not move partner identities to another system.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose une API REST dans Amazon API Gateway à des applications partenaires. Les partenaires s'authentifient auprès du service de jetons propriétaire existant de l'entreprise, qui émet des jetons opaques qu'on ne peut valider qu'en appelant ce service. L'entreprise doit rejeter dans API Gateway les requêtes porteuses de jetons non valides avant qu'elles n'atteignent le backend, et elle ne doit pas déplacer les identités des partenaires vers un autre système.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon Cognito user pool authorizer, and import the partner accounts into the user pool.", fr: "Créer un autorisateur de groupe d'utilisateurs Amazon Cognito, et importer les comptes des partenaires dans le groupe d'utilisateurs." }
    - id: b
      text: { en: "Require an API key on every method, and give each partner its own API key in a usage plan.", fr: "Exiger une clé d'API sur chaque méthode, et donner à chaque partenaire sa propre clé d'API dans un plan d'utilisation." }
    - id: c
      text: { en: "Create a Lambda authorizer that validates each token by calling the token service and returns an IAM policy.", fr: "Créer un autorisateur Lambda qui valide chaque jeton en appelant le service de jetons et renvoie une politique IAM." }
    - id: d
      text: { en: "Attach a resource policy that allows execute-api:Invoke only for requests that include an Authorization header.", fr: "Attacher une politique de ressource qui n'autorise execute-api:Invoke que pour les requêtes contenant un en-tête Authorization." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A Lambda authorizer runs custom logic on a bearer token or request parameters before API Gateway calls the backend. The function can call the proprietary service to validate the opaque token and return an IAM policy that allows or denies the request; API Gateway can also cache the result.
    fr: |
      Un autorisateur Lambda exécute une logique personnalisée sur un jeton porteur ou des paramètres de requête avant qu'API Gateway n'appelle le backend. La fonction peut appeler le service propriétaire pour valider le jeton opaque et renvoyer une politique IAM qui autorise ou refuse la requête ; API Gateway peut aussi mettre le résultat en cache.
  options:
    a:
      en: |
        A Cognito user pool authorizer validates Cognito tokens, which requires moving the partner identities into a user pool.
      fr: |
        Un autorisateur de groupe d'utilisateurs Cognito valide des jetons Cognito, ce qui oblige à déplacer les identités des partenaires dans un groupe d'utilisateurs.
    b:
      en: |
        API keys identify clients for usage plans and throttling; they are not a way to validate the partners' tokens.
      fr: |
        Les clés d'API identifient les clients pour les plans d'utilisation et la limitation ; elles ne permettent pas de valider les jetons des partenaires.
    d:
      en: |
        A resource policy cannot validate the content of a token, so any request with any Authorization value would pass.
      fr: |
        Une politique de ressource ne peut pas valider le contenu d'un jeton : toute requête avec n'importe quelle valeur Authorization passerait.
references:
  - title: Control and manage access to REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html
