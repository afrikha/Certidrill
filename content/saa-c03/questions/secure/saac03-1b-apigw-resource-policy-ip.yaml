id: saac03-1b-apigw-resource-policy-ip
objective: "1.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a Regional REST API in Amazon API Gateway. The API must accept requests only from the company's two office networks, which use known public CIDR ranges. Requests from any other source must be rejected by API Gateway before they reach the backend. The company does not want to change the backend code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une API REST régionale dans Amazon API Gateway. L'API doit accepter uniquement les requêtes provenant des deux réseaux de bureaux de l'entreprise, qui utilisent des plages CIDR publiques connues. Les requêtes de toute autre source doivent être rejetées par API Gateway avant d'atteindre le backend. L'entreprise ne veut pas modifier le code du backend.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a usage plan that requires API keys, and give the keys only to users in the two office networks.", fr: "Créer un plan d'utilisation qui exige des clés d'API, et ne remettre les clés qu'aux utilisateurs des deux réseaux de bureaux." }
    - id: b
      text: { en: "Associate a security group with the API stage that allows inbound HTTPS only from the two CIDR ranges.", fr: "Associer à l'étape de l'API un groupe de sécurité qui autorise le trafic HTTPS entrant uniquement depuis les deux plages CIDR." }
    - id: c
      text: { en: "Attach a resource policy to the API that denies execute-api:Invoke when aws:SourceIp is not in the two CIDR ranges.", fr: "Attacher à l'API une politique de ressource qui refuse execute-api:Invoke lorsque aws:SourceIp n'appartient pas aux deux plages CIDR." }
    - id: d
      text: { en: "Add logic to the backend that reads the X-Forwarded-For header and rejects requests from other sources.", fr: "Ajouter au backend une logique qui lit l'en-tête X-Forwarded-For et rejette les requêtes des autres sources." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      API Gateway resource policies are attached to a REST API and can allow or deny invocation based on source IP ranges, VPCs, VPC endpoints or AWS accounts. A Deny on execute-api:Invoke for sources outside the two CIDR ranges blocks other callers at API Gateway, with no backend change.
    fr: |
      Les politiques de ressource API Gateway s'attachent à une API REST et peuvent autoriser ou refuser l'appel selon des plages d'adresses IP sources, des VPC, des points de terminaison de VPC ou des comptes AWS. Un Deny sur execute-api:Invoke pour les sources hors des deux plages CIDR bloque les autres appelants dans API Gateway, sans modifier le backend.
  options:
    a:
      en: |
        API keys and usage plans track and throttle usage; they are not an authentication or source restriction mechanism, and keys can be shared.
      fr: |
        Les clés d'API et les plans d'utilisation suivent et limitent l'utilisation ; ce n'est pas un mécanisme d'authentification ni de restriction de source, et les clés peuvent être partagées.
    b:
      en: |
        A public Regional API endpoint is not placed in your VPC, so you cannot attach a security group to it.
      fr: |
        Un point de terminaison d'API régional public ne se trouve pas dans votre VPC : vous ne pouvez pas lui associer de groupe de sécurité.
    d:
      en: |
        This requires a backend code change, and the requests still reach the backend.
      fr: |
        Cette solution exige de modifier le code du backend, et les requêtes atteignent quand même le backend.
references:
  - title: Control access to a REST API with API Gateway resource policies
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-resource-policies.html
