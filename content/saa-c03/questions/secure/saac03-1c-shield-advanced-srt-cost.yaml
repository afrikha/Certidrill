id: saac03-1c-shield-advanced-srt-cost
objective: "1.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company streams live sports events through an Amazon CloudFront distribution and uses Amazon Route 53 for DNS. During a previous large DDoS attack, the company's AWS bill increased sharply because of the extra data transfer. The company wants access to AWS DDoS experts during attacks and protection against DDoS-related spikes in its AWS bill.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias diffuse des événements sportifs en direct au moyen d'une distribution Amazon CloudFront et utilise Amazon Route 53 pour le DNS. Lors d'une précédente attaque DDoS de grande ampleur, sa facture AWS a fortement augmenté à cause du transfert de données supplémentaire. L'entreprise souhaite pouvoir faire appel à des experts DDoS d'AWS pendant les attaques et être protégée contre les pics de facturation AWS liés aux attaques DDoS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Rely on AWS Shield Standard, which is already active on the CloudFront distribution and the Route 53 hosted zone."
        fr: "S'appuyer sur AWS Shield Standard, déjà actif sur la distribution CloudFront et sur la zone hébergée Route 53."
    - id: b
      text:
        en: "Associate an AWS WAF web ACL that contains rate-based rules with the CloudFront distribution."
        fr: "Associer à la distribution CloudFront une liste ACL web AWS WAF qui contient des règles basées sur le débit."
    - id: c
      text:
        en: "Subscribe to AWS Shield Advanced and add the CloudFront distribution and the hosted zone as protected resources."
        fr: "Souscrire à AWS Shield Advanced et ajouter la distribution CloudFront et la zone hébergée comme ressources protégées."
    - id: d
      text:
        en: "Enable Amazon GuardDuty and send its DDoS findings to an Amazon SNS topic that the operations team monitors."
        fr: "Activer Amazon GuardDuty et envoyer ses résultats liés aux attaques DDoS vers une rubrique Amazon SNS surveillée par l'équipe d'exploitation."
answer: { optionId: c }
explanation:
  correct:
    en: |
      Shield Advanced gives access to the Shield Response Team (SRT) during attacks and offers cost protection in the form of service credits for DDoS-related spikes in charges on protected resources. CloudFront distributions and Route 53 hosted zones are supported protected resources; Shield Advanced protects only the resources that you explicitly add. SRT engagement also requires a Business or Enterprise Support plan.
    fr: |
      Shield Advanced donne accès à la Shield Response Team (SRT) pendant les attaques et offre une protection des coûts, sous forme de crédits de service, contre les pics de facturation liés aux attaques DDoS sur les ressources protégées. Les distributions CloudFront et les zones hébergées Route 53 font partie des ressources prises en charge ; Shield Advanced ne protège que les ressources que vous ajoutez explicitement. Le recours à la SRT exige aussi un plan Business Support ou Enterprise Support.
  options:
    a:
      en: |
        Shield Standard is free and automatic, but it includes neither SRT access nor cost protection.
      fr: |
        Shield Standard est gratuit et automatique, mais il n'inclut ni l'accès à la SRT ni la protection des coûts.
    b:
      en: |
        Rate-based rules help against HTTP floods, but AWS WAF on its own provides no DDoS experts and no billing protection.
      fr: |
        Les règles basées sur le débit aident contre les inondations HTTP, mais AWS WAF seul n'offre ni experts DDoS ni protection de la facturation.
    d:
      en: |
        GuardDuty detects threats and generates findings; it provides neither DDoS response experts nor credits for attack-related charges.
      fr: |
        GuardDuty détecte les menaces et génère des résultats ; il ne fournit ni experts de réponse aux attaques DDoS ni crédits pour les frais liés aux attaques.
references:
