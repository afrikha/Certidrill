id: saac03-1a-validate-policies-pipeline
objective: "1.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company deploys IAM policies through an infrastructure as code pipeline. Before any deployment, the pipeline must reject policies that contain grammar errors or that break AWS policy best practices. It must also reject any updated policy that grants more access than the currently approved version of the same policy. Problems must be detected before the policies reach AWS accounts.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise déploie des politiques IAM via un pipeline d'infrastructure en tant que code. Avant tout déploiement, le pipeline doit rejeter les politiques qui contiennent des erreurs de grammaire ou qui enfreignent les bonnes pratiques AWS en matière de politiques. Il doit aussi rejeter toute politique mise à jour qui accorde plus d'accès que la version actuellement approuvée de la même politique. Les problèmes doivent être détectés avant que les politiques n'atteignent les comptes AWS.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run IAM Access Analyzer policy validation in the pipeline and fail the build on errors and security warnings.", fr: "Exécuter la validation de politiques d'IAM Access Analyzer dans le pipeline et faire échouer le pipeline en cas d'erreurs et d'avertissements de sécurité." } }
    - { id: b, text: { en: "Deploy an AWS Config managed rule that flags IAM policies that grant administrator access.", fr: "Déployer une règle gérée AWS Config qui signale les politiques IAM accordant un accès administrateur." } }
    - { id: c, text: { en: "Run an IAM Access Analyzer custom policy check that fails when an updated policy grants new access.", fr: "Exécuter une vérification de politique personnalisée d'IAM Access Analyzer qui échoue si une politique mise à jour accorde un nouvel accès." } }
    - { id: d, text: { en: "Enable an IAM Access Analyzer external access analyzer in each account that receives the policies.", fr: "Activer un analyseur d'accès externe IAM Access Analyzer dans chaque compte qui reçoit les politiques." } }
    - { id: e, text: { en: "Review the AWS Trusted Advisor security checks of each target account after every deployment.", fr: "Consulter les vérifications de sécurité d'AWS Trusted Advisor de chaque compte cible après chaque déploiement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Policy validation checks a policy against IAM policy grammar and AWS best practices and returns errors, security warnings, warnings and suggestions, so the pipeline can stop on findings. Custom policy checks compare a policy with a reference, such as the approved version, and flag statements that grant new access. Both run on the policy documents before deployment."
    fr: "La validation de politiques contrôle une politique par rapport à la grammaire des politiques IAM et aux bonnes pratiques AWS et renvoie erreurs, avertissements de sécurité, avertissements et suggestions : le pipeline peut s'arrêter sur ces résultats. Les vérifications de politiques personnalisées comparent une politique à une référence, comme la version approuvée, et signalent les instructions qui accordent un nouvel accès. Les deux s'exécutent sur les documents de politique avant le déploiement."
  options:
    b:
      en: "AWS Config evaluates policies after they exist in the account, so problems are detected after deployment, and the rule does not compare versions."
      fr: "AWS Config évalue les politiques une fois qu'elles existent dans le compte : les problèmes sont détectés après le déploiement, et la règle ne compare pas les versions."
    d:
      en: "An external access analyzer reports resources shared outside the zone of trust after they are deployed; it does not gate identity policies in a pipeline."
      fr: "Un analyseur d'accès externe signale les ressources partagées hors de la zone de confiance une fois déployées ; il ne filtre pas les politiques d'identité dans un pipeline."
    e:
      en: "Trusted Advisor checks run on the deployed account and do not validate policy grammar or compare policy versions."
      fr: "Les vérifications de Trusted Advisor s'exécutent sur le compte déployé et ne valident ni la grammaire des politiques ni ne comparent leurs versions."
references:
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
