id: saac03-1d-air-gapped-vault
objective: "1.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations and AWS Backup. Its security plan assumes that an attacker could gain administrator access to a production account. Backups of the production account must be immutable, must survive a compromise of that account, and must be restorable directly from a separate recovery account to reduce the recovery time objective (RTO).

    The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations et AWS Backup. Son plan de sécurité suppose qu'un attaquant pourrait obtenir un accès administrateur à un compte de production. Les sauvegardes du compte de production doivent être immuables, doivent résister à une compromission de ce compte et doivent pouvoir être restaurées directement depuis un compte de récupération distinct afin de réduire l'objectif de temps de récupération (RTO).

    L'entreprise souhaite la solution présentant le MOINS de charge opérationnelle possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Copy the backups to a logically air-gapped vault and share the vault with the recovery account through AWS Resource Access Manager (AWS RAM).", fr: "Copier les sauvegardes vers un coffre-fort isolé logiquement et partager ce coffre-fort avec le compte de récupération via AWS Resource Access Manager (AWS RAM)." }
    - id: b
      text: { en: "Copy the backups to a vault in another Region of the production account and apply AWS Backup Vault Lock in governance mode.", fr: "Copier les sauvegardes vers un coffre-fort d'une autre Région du compte de production et appliquer AWS Backup Vault Lock en mode gouvernance." }
    - id: c
      text: { en: "Copy the backups to a standard vault in a central backup account and copy them again into the recovery account during an incident.", fr: "Copier les sauvegardes vers un coffre-fort standard d'un compte de sauvegarde central, puis les recopier dans le compte de récupération lors d'un incident." }
    - id: d
      text: { en: "Share daily Amazon EBS snapshots and RDS snapshots of the production account with the recovery account by using snapshot permissions.", fr: "Partager les instantanés Amazon EBS et RDS quotidiens du compte de production avec le compte de récupération au moyen des autorisations d'instantané." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A logically air-gapped vault is always locked with AWS Backup Vault Lock in compliance mode and stores backups outside the production account. It can be shared through AWS RAM with another account, which can restore the backups directly, so recovery is faster and does not depend on the compromised account.
    fr: |
      Un coffre-fort isolé logiquement est toujours verrouillé par AWS Backup Vault Lock en mode conformité et stocke les sauvegardes en dehors du compte de production. Il peut être partagé via AWS RAM avec un autre compte, qui peut restaurer directement les sauvegardes : la récupération est plus rapide et ne dépend pas du compte compromis.
  options:
    b:
      en: |
        The copies stay in the compromised account, and a governance-mode lock can be removed by an administrator with sufficient permissions.
      fr: |
        Les copies restent dans le compte compromis, et un verrou en mode gouvernance peut être retiré par un administrateur disposant des autorisations suffisantes.
    c:
      en: |
        A standard vault without Vault Lock is not immutable, and copying the backups again during an incident increases the RTO and the manual work.
      fr: |
        Un coffre-fort standard sans Vault Lock n'est pas immuable, et recopier les sauvegardes lors d'un incident augmente le RTO et le travail manuel.
    d:
      en: |
        Shared snapshots remain owned by the production account, so an attacker with administrator access can delete them; they are not immutable.
      fr: |
        Les instantanés partagés restent la propriété du compte de production : un attaquant disposant d'un accès administrateur peut les supprimer ; ils ne sont pas immuables.
references:
  - title: Logically air-gapped vault
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/logicallyairgappedvault.html
