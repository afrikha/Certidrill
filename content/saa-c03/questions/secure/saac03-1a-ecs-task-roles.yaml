id: saac03-1a-ecs-task-roles
objective: "1.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs two containerized applications on the same Amazon EC2 instance. The first application reads from an Amazon SQS queue, and the second writes to an Amazon DynamoDB table. Both use the instance profile role, which allows both sets of actions. A security review requires each application to have only its own permissions, without long-term credentials, and the company wants to keep running both applications on shared EC2 capacity.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute deux applications conteneurisées sur la même instance Amazon EC2. La première lit une file d'attente Amazon SQS, et la seconde écrit dans une table Amazon DynamoDB. Les deux utilisent le rôle du profil d'instance, qui autorise les deux ensembles d'actions. Une revue de sécurité exige que chaque application n'ait que ses propres autorisations, sans informations d'identification à long terme, et l'entreprise veut continuer à exécuter les deux applications sur une capacité EC2 partagée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach a second instance profile to the instance so that each application uses its own role.", fr: "Attacher un second profil d'instance à l'instance pour que chaque application utilise son propre rôle." }
    - id: b
      text: { en: "Create an IAM user for each application and store each user's access keys in the container environment variables.", fr: "Créer un utilisateur IAM par application et stocker les clés d'accès de chaque utilisateur dans les variables d'environnement du conteneur." }
    - id: c
      text: { en: "Add conditions on the container name to the instance profile role so that each application gets only its actions.", fr: "Ajouter au rôle du profil d'instance des conditions sur le nom du conteneur pour que chaque application n'obtienne que ses actions." }
    - id: d
      text: { en: "Run the applications as Amazon ECS tasks on the instance and give each task definition its own IAM task role.", fr: "Exécuter les applications comme tâches Amazon ECS sur l'instance et donner à chaque définition de tâche son propre rôle de tâche IAM." }
answer: { optionId: d }
explanation:
  correct:
    en: "An EC2 instance can have only one role at a time, shared by every application on it. Amazon ECS tasks can each have their own IAM role, so each application receives temporary credentials limited to its own permissions while the tasks still run on the same EC2 capacity."
    fr: "Une instance EC2 ne peut avoir qu'un seul rôle à la fois, partagé par toutes ses applications. Les tâches Amazon ECS peuvent chacune avoir leur propre rôle IAM : chaque application reçoit des informations d'identification temporaires limitées à ses autorisations, tout en s'exécutant sur la même capacité EC2."
  options:
    a:
      en: "Only one role can be assigned to an instance at a time, so a second instance profile cannot be attached."
      fr: "Un seul rôle peut être attribué à une instance à la fois : un second profil d'instance ne peut pas être attaché."
    b:
      en: "IAM user access keys are long-term credentials, which the security review forbids."
      fr: "Les clés d'accès des utilisateurs IAM sont des informations d'identification à long terme, interdites par la revue de sécurité."
    c:
      en: "Requests made with the instance profile credentials carry no container identity that a policy condition could use to separate the applications."
      fr: "Les requêtes faites avec les informations d'identification du profil d'instance ne portent aucune identité de conteneur qu'une condition de politique pourrait utiliser pour séparer les applications."
references:
  - title: Use an IAM role to grant permissions to applications running on Amazon EC2 instances
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2.html
