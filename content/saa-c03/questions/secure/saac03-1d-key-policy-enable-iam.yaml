id: saac03-1d-key-policy-enable-iam
objective: "1.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company created a customer managed AWS KMS key with the AWS CLI and supplied a custom key policy whose only statement gives full access to an IAM role named KeyAdmins. A developer then attached an IAM policy that allows kms:Decrypt on the key ARN to the IAM role of a Lambda function. The function still receives an AccessDeniedException when it calls Decrypt.

    The company wants to manage access to the key for application roles by using IAM policies from now on.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a créé une clé AWS KMS gérée par le client avec l'AWS CLI et a fourni une politique de clé personnalisée dont la seule instruction donne un accès complet à un rôle IAM nommé KeyAdmins. Un développeur a ensuite attaché au rôle IAM d'une fonction Lambda une politique IAM qui autorise kms:Decrypt sur l'ARN de la clé. La fonction reçoit toujours une AccessDeniedException lorsqu'elle appelle Decrypt.

    L'entreprise souhaite désormais gérer l'accès des rôles d'application à la clé au moyen de politiques IAM.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add kms:Decrypt to an SCP attached to the account so that the IAM policy of the Lambda role takes effect.", fr: "Ajouter kms:Decrypt à une SCP attachée au compte pour que la politique IAM du rôle Lambda prenne effet." }
    - id: b
      text: { en: "Attach a permissions boundary that allows kms:* on the key ARN to the IAM role of the Lambda function.", fr: "Attacher au rôle IAM de la fonction Lambda une limite d'autorisations qui autorise kms:* sur l'ARN de la clé." }
    - id: c
      text: { en: "Add a key policy statement that allows kms:* to the account principal so that IAM policies take effect.", fr: "Ajouter une instruction de politique de clé qui autorise kms:* au principal du compte pour que les politiques IAM prennent effet." }
    - id: d
      text: { en: "Enable automatic key rotation so that AWS KMS generates new key material that the IAM policy applies to.", fr: "Activer la rotation automatique de la clé pour qu'AWS KMS génère un nouveau matériel de clé auquel la politique IAM s'applique." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      IAM policies grant access to a KMS key only if the key policy allows the account principal (`arn:aws:iam::111122223333:root`). That statement, which the default key policy contains, delegates access control to IAM; without it, the IAM policy of the Lambda role has no effect.
    fr: |
      Les politiques IAM n'accordent l'accès à une clé KMS que si la politique de clé autorise le principal du compte (`arn:aws:iam::111122223333:root`). Cette instruction, présente dans la politique de clé par défaut, délègue le contrôle d'accès à IAM ; sans elle, la politique IAM du rôle Lambda est sans effet.
  options:
    a:
      en: |
        An SCP only limits the maximum permissions of the account; it cannot make an IAM policy effective on a key whose key policy ignores IAM.
      fr: |
        Une SCP limite seulement les autorisations maximales du compte ; elle ne peut pas rendre une politique IAM effective sur une clé dont la politique ignore IAM.
    b:
      en: |
        A permissions boundary limits the permissions of a role and never grants access; the key policy still blocks the request.
      fr: |
        Une limite d'autorisations restreint les autorisations d'un rôle et n'accorde jamais d'accès ; la politique de clé bloque toujours la requête.
    d:
      en: |
        Rotation changes the key material, not who is allowed to use the key.
      fr: |
        La rotation change le matériel de clé, pas les principaux autorisés à utiliser la clé.
references:
  - title: Default key policy
    url: https://docs.aws.amazon.com/kms/latest/developerguide/key-policy-default.html
