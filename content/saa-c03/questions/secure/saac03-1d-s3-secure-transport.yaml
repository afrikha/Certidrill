id: saac03-1d-s3-secure-transport
objective: "1.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company stores payroll exports in an Amazon S3 bucket. Several internal applications and partner scripts access the bucket. A security policy requires that the bucket reject any request that is not sent over an encrypted (HTTPS) connection.

    Which solution will meet this requirement?
  fr: |
    Une entreprise stocke des exports de paie dans un compartiment Amazon S3. Plusieurs applications internes et scripts de partenaires accèdent au compartiment. Une politique de sécurité impose que le compartiment rejette toute requête qui n'est pas envoyée sur une connexion chiffrée (HTTPS).

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Set the default encryption of the bucket to SSE-KMS with a customer managed key.", fr: "Définir le chiffrement par défaut du compartiment sur SSE-KMS avec une clé gérée par le client." }
    - id: b
      text: { en: "Turn on all four S3 Block Public Access settings for the bucket.", fr: "Activer les quatre paramètres S3 Block Public Access pour le compartiment." }
    - id: c
      text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SecureTransport is false.", fr: "Ajouter une instruction de politique de compartiment qui refuse toutes les actions S3 lorsque aws:SecureTransport a la valeur false." }
    - id: d
      text: { en: "Create a gateway VPC endpoint for S3 and route the application subnets through it.", fr: "Créer un point de terminaison de VPC de passerelle pour S3 et faire passer les sous-réseaux des applications par celui-ci." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `aws:SecureTransport` condition key is false when a request uses plain HTTP. A Deny statement in the bucket policy with this condition rejects every non-TLS request, whoever sends it; the `s3-bucket-ssl-requests-only` AWS Config rule can then verify the control.
    fr: |
      La clé de condition `aws:SecureTransport` vaut false lorsqu'une requête utilise HTTP en clair. Une instruction Deny avec cette condition dans la politique de compartiment rejette toute requête non TLS, quel que soit l'émetteur ; la règle AWS Config `s3-bucket-ssl-requests-only` peut ensuite vérifier ce contrôle.
  options:
    a:
      en: |
        SSE-KMS encrypts the objects at rest. It does not reject requests sent over HTTP.
      fr: |
        SSE-KMS chiffre les objets au repos. Il ne rejette pas les requêtes envoyées en HTTP.
    b:
      en: |
        Block Public Access prevents public access through policies and ACLs; it does not look at the transport protocol.
      fr: |
        Block Public Access empêche l'accès public via les politiques et les ACL ; il ne tient pas compte du protocole de transport.
    d:
      en: |
        A gateway endpoint changes how traffic from the VPC is routed to S3; requests can still use HTTP, and partner scripts outside the VPC are not affected.
      fr: |
        Un point de terminaison de passerelle change la façon dont le trafic du VPC est acheminé vers S3 ; les requêtes peuvent toujours utiliser HTTP, et les scripts des partenaires hors du VPC ne sont pas concernés.
references:
  - title: Security best practices for Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
