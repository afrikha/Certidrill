id: saac03-1a-idc-delegated-admin
objective: "1.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an organization instance of IAM Identity Center in its AWS Organizations management account. Members of the identity team sign in to the management account every day to assign users and groups to member accounts. The security team wants to reduce the number of people who have access to the management account while letting the identity team keep doing these assignments.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise une instance d'organisation d'IAM Identity Center dans le compte de gestion de son organisation AWS Organizations. Les membres de l'équipe identité se connectent chaque jour au compte de gestion pour attribuer des utilisateurs et des groupes aux comptes membres. L'équipe de sécurité veut réduire le nombre de personnes ayant accès au compte de gestion tout en permettant à l'équipe identité de continuer ces attributions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Register a member account as the delegated administrator for IAM Identity Center and give the identity team access to that account only.", fr: "Inscrire un compte membre comme administrateur délégué d'IAM Identity Center et ne donner à l'équipe identité l'accès qu'à ce compte." }
    - id: b
      text: { en: "Move the organization instance of IAM Identity Center from the management account to a dedicated identity member account.", fr: "Déplacer l'instance d'organisation d'IAM Identity Center du compte de gestion vers un compte membre dédié à l'identité." }
    - id: c
      text: { en: "Create IAM users for the identity team in the management account and attach an SCP that limits them to IAM Identity Center actions.", fr: "Créer des utilisateurs IAM pour l'équipe identité dans le compte de gestion et attacher une SCP qui les limite aux actions d'IAM Identity Center." }
    - id: d
      text: { en: "Enable an account instance of IAM Identity Center in a member account and let the identity team manage assignments there.", fr: "Activer une instance de compte d'IAM Identity Center dans un compte membre et laisser l'équipe identité y gérer les attributions." }
answer: { optionId: a }
explanation:
  correct:
    en: "IAM Identity Center always resides in the management account, but most administrative tasks, including assigning users and groups to member accounts, can be delegated to a registered member account. The identity team then works in that account, and fewer people need access to the management account."
    fr: "IAM Identity Center réside toujours dans le compte de gestion, mais la plupart des tâches d'administration, dont l'attribution d'utilisateurs et de groupes aux comptes membres, peuvent être déléguées à un compte membre inscrit. L'équipe identité travaille alors dans ce compte, et moins de personnes ont besoin d'accéder au compte de gestion."
  options:
    b:
      en: "An organization instance of IAM Identity Center always resides in the management account; it cannot be moved to a member account."
      fr: "Une instance d'organisation d'IAM Identity Center réside toujours dans le compte de gestion ; elle ne peut pas être déplacée vers un compte membre."
    c:
      en: "The identity team would still sign in to the management account, and SCPs do not apply to the management account, so the SCP would not limit them."
      fr: "L'équipe identité se connecterait toujours au compte de gestion, et les SCP ne s'appliquent pas au compte de gestion : la SCP ne les limiterait pas."
    d:
      en: "An account instance cannot manage access to AWS accounts; only the organization instance can assign users and groups to member accounts."
      fr: "Une instance de compte ne peut pas gérer l'accès aux comptes AWS ; seule l'instance d'organisation peut attribuer des utilisateurs et des groupes aux comptes membres."
references:
  - title: Delegated administration
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/delegated-admin.html
