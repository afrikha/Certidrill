id: saac03-1a-unused-access-analyzer
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has hundreds of IAM roles and IAM users across the accounts of its organization. The security team must be notified continuously about roles that are no longer used, access keys and passwords that are unused, and services and actions that are granted but not used, so that it can remove them. The solution must require the LEAST custom development.

    Which solution will meet these requirements?
  fr: |
    Une entreprise a des centaines de rôles et d'utilisateurs IAM répartis dans les comptes de son organisation. L'équipe de sécurité doit être informée en continu des rôles qui ne sont plus utilisés, des clés d'accès et mots de passe inutilisés, et des services et actions accordés mais non utilisés, afin de les supprimer. La solution doit exiger le MOINS de développement spécifique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Generate the IAM credential report in each account every week and compare the reports with a script.", fr: "Générer chaque semaine le rapport sur les informations d'identification IAM dans chaque compte et comparer les rapports avec un script." }
    - id: b
      text: { en: "Query the CloudTrail logs of all accounts with Amazon Athena every day to list the principals that made no calls.", fr: "Interroger chaque jour les journaux CloudTrail de tous les comptes avec Amazon Athena pour lister les principaux qui n'ont fait aucun appel." }
    - id: c
      text: { en: "Export the last accessed information of every role and user each month and review it manually.", fr: "Exporter chaque mois les informations de dernier accès de chaque rôle et utilisateur et les examiner manuellement." }
    - id: d
      text: { en: "Create an IAM Access Analyzer unused access analyzer for the organization and act on its findings.", fr: "Créer un analyseur d'accès inutilisé IAM Access Analyzer pour l'organisation et traiter ses résultats." }
answer: { optionId: d }
explanation:
  correct:
    en: "An unused access analyzer continuously monitors IAM roles and users and generates findings for unused roles, unused access keys, unused passwords, and unused services and actions. It requires no code, and it is billed per role and user analyzed each month."
    fr: "Un analyseur d'accès inutilisé surveille en continu les rôles et utilisateurs IAM et génère des résultats pour les rôles, clés d'accès et mots de passe inutilisés ainsi que pour les services et actions non utilisés. Il ne demande aucun code et il est facturé par rôle et utilisateur analysés chaque mois."
  options:
    a:
      en: "The credential report covers IAM users only, not roles or unused permissions, and comparing reports is custom work."
      fr: "Le rapport sur les informations d'identification ne couvre que les utilisateurs IAM, pas les rôles ni les autorisations inutilisées, et comparer les rapports est un travail spécifique."
    b:
      en: "Athena queries can find inactive principals, but writing and maintaining them is custom development, and they do not compare activity with granted permissions."
      fr: "Des requêtes Athena peuvent trouver les principaux inactifs, mais les écrire et les maintenir est un développement spécifique, et elles ne comparent pas l'activité aux autorisations accordées."
    c:
      en: "Last accessed information supports this analysis, but a monthly manual review is neither continuous nor low effort at this scale."
      fr: "Les informations de dernier accès permettent cette analyse, mais un examen manuel mensuel n'est ni continu ni peu coûteux en effort à cette échelle."
references:
  - title: Using AWS Identity and Access Management Access Analyzer
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html
  - title: Refine permissions in AWS using last accessed information
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_last-accessed.html
