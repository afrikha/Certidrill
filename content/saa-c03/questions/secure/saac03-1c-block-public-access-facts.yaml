id: saac03-1c-block-public-access-facts
objective: "1.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is defining a data governance standard for Amazon S3. The standard will require S3 Block Public Access on all accounts, buckets and access points. Before the standard is approved, the security team asks a solutions architect to confirm how Block Public Access behaves.

    Which statements about S3 Block Public Access are correct? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise définit une norme de gouvernance des données pour Amazon S3. Cette norme imposera S3 Block Public Access sur tous les comptes, compartiments et points d'accès. Avant son approbation, l'équipe de sécurité demande à un architecte de solutions de confirmer le comportement de Block Public Access.

    Quelles affirmations sur S3 Block Public Access sont exactes ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "When the account, bucket and access point settings differ, Amazon S3 applies the most restrictive combination of them."
        fr: "Lorsque les paramètres du compte, du compartiment et du point d'accès diffèrent, Amazon S3 applique leur combinaison la plus restrictive."
    - id: b
      text:
        en: "Turning on BlockPublicPolicy rewrites existing bucket policies to remove the statements that grant public access."
        fr: "L'activation de BlockPublicPolicy réécrit les politiques de compartiment existantes pour supprimer les instructions qui accordent un accès public."
    - id: c
      text:
        en: "The Block Public Access settings of an access point can be changed at any time after the access point is created."
        fr: "Les paramètres Block Public Access d'un point d'accès peuvent être modifiés à tout moment après la création du point d'accès."
    - id: d
      text:
        en: "RestrictPublicBuckets limits a bucket with a public policy to AWS service principals and authorized users of the owner account."
        fr: "RestrictPublicBuckets limite un compartiment doté d'une politique publique aux principaux de service AWS et aux utilisateurs autorisés du compte propriétaire."
    - id: e
      text:
        en: "Account-level Block Public Access settings apply only to buckets that are created after the settings are turned on."
        fr: "Les paramètres Block Public Access au niveau du compte ne s'appliquent qu'aux compartiments créés après leur activation."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Amazon S3 evaluates the access point, bucket and account settings together and applies the most restrictive combination. RestrictPublicBuckets keeps a bucket or access point with a public policy reachable only by AWS service principals and authorized users of the owner's account.
    fr: |
      Amazon S3 évalue ensemble les paramètres du point d'accès, du compartiment et du compte, et applique la combinaison la plus restrictive. RestrictPublicBuckets fait qu'un compartiment ou un point d'accès doté d'une politique publique n'est accessible qu'aux principaux de service AWS et aux utilisateurs autorisés du compte propriétaire.
  options:
    b:
      en: |
        Block Public Access settings do not alter existing policies or ACLs; removing a setting makes a resource with a public policy public again.
      fr: |
        Les paramètres Block Public Access ne modifient pas les politiques ni les ACL existantes ; retirer un paramètre rend de nouveau public une ressource dotée d'une politique publique.
    c:
      en: |
        An access point's Block Public Access settings can be specified only when the access point is created.
      fr: |
        Les paramètres Block Public Access d'un point d'accès ne peuvent être définis qu'à la création du point d'accès.
    e:
      en: |
        Account-level settings apply to all buckets and access points owned by the account, existing ones included.
      fr: |
        Les paramètres au niveau du compte s'appliquent à tous les compartiments et points d'accès du compte, y compris ceux qui existent déjà.
references:
  - title: Blocking public access to your Amazon S3 storage
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html
