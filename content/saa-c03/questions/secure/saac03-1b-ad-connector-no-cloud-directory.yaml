id: saac03-1b-ad-connector-no-cloud-directory
objective: "1.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants employees to use their on-premises Active Directory credentials to sign in to the AWS Management Console through IAM role-based access. A security policy forbids running any directory or domain controller in AWS: every authentication request must be forwarded to the on-premises domain controllers. Existing password policies and RADIUS-based MFA must keep applying. The on-premises network connects to a VPC through AWS Site-to-Site VPN.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut que ses employés utilisent leurs informations d'identification Active Directory sur site pour se connecter à la AWS Management Console par un accès fondé sur des rôles IAM. Une politique de sécurité interdit d'exécuter un annuaire ou un contrôleur de domaine dans AWS : chaque demande d'authentification doit être transmise aux contrôleurs de domaine sur site. Les politiques de mots de passe existantes et la MFA basée sur RADIUS doivent continuer à s'appliquer. Le réseau sur site est relié à un VPC par AWS Site-to-Site VPN.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy AWS Managed Microsoft AD in the VPC and create a two-way forest trust with the on-premises domain.", fr: "Déployer AWS Managed Microsoft AD dans le VPC et créer une approbation de forêt bidirectionnelle avec le domaine sur site." }
    - id: b
      text: { en: "Deploy AD Connector in the VPC and point it to the on-premises domain controllers.", fr: "Déployer AD Connector dans le VPC et le faire pointer vers les contrôleurs de domaine sur site." }
    - id: c
      text: { en: "Deploy Simple AD in the VPC and synchronize it with the on-premises domain.", fr: "Déployer Simple AD dans le VPC et le synchroniser avec le domaine sur site." }
    - id: d
      text: { en: "Launch EC2 instances in the VPC as additional domain controllers of the on-premises domain.", fr: "Lancer des instances EC2 dans le VPC comme contrôleurs de domaine supplémentaires du domaine sur site." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AD Connector is a directory gateway that redirects authentication and lookup requests to the on-premises Active Directory without caching any directory information in AWS. On-premises password policies keep applying, it supports RADIUS-based MFA, and it enables IAM role-based console access with corporate credentials.
    fr: |
      AD Connector est une passerelle d'annuaire qui redirige les demandes d'authentification et de recherche vers l'Active Directory sur site, sans mettre en cache d'informations d'annuaire dans AWS. Les politiques de mots de passe sur site continuent de s'appliquer, il prend en charge la MFA basée sur RADIUS, et il permet un accès à la console fondé sur des rôles IAM avec les informations d'identification d'entreprise.
  options:
    a:
      en: |
        AWS Managed Microsoft AD runs domain controllers in AWS, which the security policy forbids.
      fr: |
        AWS Managed Microsoft AD exécute des contrôleurs de domaine dans AWS, ce que la politique de sécurité interdit.
    c:
      en: |
        Simple AD is a separate directory hosted in AWS; it does not synchronize with or trust an on-premises domain.
      fr: |
        Simple AD est un annuaire distinct hébergé dans AWS ; il ne se synchronise pas avec un domaine sur site et ne l'approuve pas.
    d:
      en: |
        Domain controllers on EC2 replicate the directory into AWS, which the policy forbids, and they must be managed by the company.
      fr: |
        Des contrôleurs de domaine sur EC2 répliquent l'annuaire dans AWS, ce que la politique interdit, et l'entreprise doit les gérer.
references:
  - title: AD Connector
    url: https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_ad_connector.html
