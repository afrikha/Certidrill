id: saac03-1c-isolated-db-subnets
objective: "1.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A healthcare company runs application servers in private subnets that reach the internet through a NAT gateway. The company is adding Amazon EC2 instances that run a self-managed database. A compliance rule states that the database tier must have no network path to destinations outside the VPC, not even outbound, and that this must be enforced by routing rather than by instance-level firewall rules.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé exécute des serveurs d'application dans des sous-réseaux privés qui atteignent Internet par une passerelle NAT. L'entreprise ajoute des instances Amazon EC2 qui exécutent une base de données autogérée. Une règle de conformité impose que le niveau base de données n'ait aucun chemin réseau vers des destinations extérieures au VPC, pas même en sortie, et que cela soit garanti par le routage plutôt que par des règles de pare-feu au niveau des instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Launch the database instances in the application servers' private subnets and remove all outbound rules from the database security group."
        fr: "Lancer les instances de base de données dans les sous-réseaux privés des serveurs d'application et supprimer toutes les règles sortantes du groupe de sécurité de la base de données."
    - id: b
      text:
        en: "Launch the database instances in new subnets associated with a route table that contains only the local route of the VPC."
        fr: "Lancer les instances de base de données dans de nouveaux sous-réseaux associés à une table de routage qui ne contient que la route locale du VPC."
    - id: c
      text:
        en: "Launch the database instances in new subnets whose route table sends 0.0.0.0/0 to a private NAT gateway."
        fr: "Lancer les instances de base de données dans de nouveaux sous-réseaux dont la table de routage envoie 0.0.0.0/0 vers une passerelle NAT privée."
    - id: d
      text:
        en: "Launch the database instances in the application servers' private subnets and add a network ACL outbound deny rule for 0.0.0.0/0."
        fr: "Lancer les instances de base de données dans les sous-réseaux privés des serveurs d'application et ajouter à l'ACL réseau une règle sortante de refus pour 0.0.0.0/0."
answer: { optionId: b }
explanation:
  correct:
    en: |
      A subnet whose route table has no routes to destinations outside the VPC is an isolated subnet: its resources can only communicate with other resources in the same VPC. Placing the database tier in dedicated subnets with only the local route enforces the rule at the routing level, while the application subnets keep their NAT gateway route.
    fr: |
      Un sous-réseau dont la table de routage n'a aucune route vers des destinations extérieures au VPC est un sous-réseau isolé : ses ressources ne peuvent communiquer qu'avec d'autres ressources du même VPC. Placer le niveau base de données dans des sous-réseaux dédiés avec la seule route locale garantit la règle au niveau du routage, tandis que les sous-réseaux d'application conservent leur route vers la passerelle NAT.
  options:
    a:
      en: |
        The database would share a route table that has a path to the NAT gateway; the control relies only on a security group, which the rule does not accept.
      fr: |
        La base de données partagerait une table de routage qui a un chemin vers la passerelle NAT ; le contrôle reposerait seulement sur un groupe de sécurité, ce que la règle n'accepte pas.
    c:
      en: |
        A private NAT gateway still provides a path to other VPCs or on-premises networks, which are destinations outside the VPC.
      fr: |
        Une passerelle NAT privée fournit encore un chemin vers d'autres VPC ou des réseaux sur site, qui sont des destinations extérieures au VPC.
    d:
      en: |
        A network ACL is a filter, not routing, and denying 0.0.0.0/0 outbound in the shared subnets would also break the application servers' internet access.
      fr: |
        Une ACL réseau est un filtre, pas du routage, et refuser 0.0.0.0/0 en sortie dans les sous-réseaux partagés couperait aussi l'accès Internet des serveurs d'application.
references:
  - title: Subnets for your VPC
    url: https://docs.aws.amazon.com/vpc/latest/userguide/configure-subnets.html
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
