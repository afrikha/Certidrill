id: saac03-1b-scp-region-restriction
objective: "1.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A financial services company uses AWS Organizations to manage 40 AWS accounts in several organizational units (OUs). A new regulation requires that workloads in all member accounts run only in the eu-west-1 and eu-central-1 Regions. Administrators in the member accounts have full IAM permissions in their own accounts. The company must enforce the requirement centrally, including for accounts that join the organization later.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers utilise AWS Organizations pour gérer 40 comptes AWS répartis dans plusieurs unités d'organisation (OU). Une nouvelle réglementation impose que les charges de travail de tous les comptes membres s'exécutent uniquement dans les Régions eu-west-1 et eu-central-1. Les administrateurs des comptes membres disposent de toutes les autorisations IAM dans leur propre compte. L'entreprise doit appliquer cette exigence de manière centralisée, y compris pour les comptes qui rejoindront l'organisation plus tard.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an AWS Config rule in every account that flags resources created outside the two approved Regions.", fr: "Déployer dans chaque compte une règle AWS Config qui signale les ressources créées en dehors des deux Régions approuvées." }
    - id: b
      text: { en: "Attach a permissions boundary to every IAM role in the member accounts that denies actions outside the two approved Regions.", fr: "Attacher à chaque rôle IAM des comptes membres une limite d'autorisations qui refuse les actions en dehors des deux Régions approuvées." }
    - id: c
      text: { en: "Attach an SCP to the organization root that denies actions when aws:RequestedRegion is not one of the two approved Regions.", fr: "Attacher à la racine de l'organisation une SCP qui refuse les actions lorsque aws:RequestedRegion n'est pas l'une des deux Régions approuvées." }
    - id: d
      text: { en: "Create an IAM policy in the management account that denies actions outside the two approved Regions and assign it to every member account.", fr: "Créer dans le compte de gestion une politique IAM qui refuse les actions en dehors des deux Régions approuvées et l'affecter à chaque compte membre." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A service control policy (SCP) attached to the root applies to every member account, including accounts added later, and limits all IAM users and roles in them, even administrators. A Deny statement on the aws:RequestedRegion condition key, with exceptions for global services such as IAM, enforces the Region restriction centrally.
    fr: |
      Une politique de contrôle des services (SCP) attachée à la racine s'applique à tous les comptes membres, y compris ceux ajoutés plus tard, et limite tous les utilisateurs et rôles IAM qu'ils contiennent, même les administrateurs. Une instruction Deny sur la clé de condition aws:RequestedRegion, avec des exceptions pour les services globaux comme IAM, applique la restriction de Région de manière centralisée.
  options:
    a:
      en: |
        An AWS Config rule only detects noncompliant resources after they are created; it does not prevent them.
      fr: |
        Une règle AWS Config détecte seulement les ressources non conformes après leur création ; elle ne les empêche pas.
    b:
      en: |
        Permissions boundaries are set role by role, and administrators with full IAM permissions in the account can remove them. They are not applied automatically to new accounts.
      fr: |
        Les limites d'autorisations se définissent rôle par rôle, et des administrateurs disposant de toutes les autorisations IAM dans le compte peuvent les retirer. Elles ne s'appliquent pas automatiquement aux nouveaux comptes.
    d:
      en: |
        IAM policies are attached to users, groups and roles inside one account; an IAM policy cannot be assigned to other accounts.
      fr: |
        Les politiques IAM s'attachent à des utilisateurs, groupes et rôles d'un même compte ; une politique IAM ne peut pas être affectée à d'autres comptes.
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
