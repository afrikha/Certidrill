id: saac03-1d-artifact-audit-reports
objective: "1.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company runs its patient portal on AWS. An external auditor asks the company for the current AWS SOC 2 Type II report and the AWS ISO 27001 certification to verify the controls that AWS operates under the shared responsibility model.

    The company must provide these documents with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise du secteur de la santé exécute son portail patients sur AWS. Un auditeur externe demande à l'entreprise le rapport SOC 2 Type II actuel d'AWS et la certification ISO 27001 d'AWS afin de vérifier les contrôles qu'AWS exploite dans le cadre du modèle de responsabilité partagée.

    L'entreprise doit fournir ces documents avec le MOINS d'effort possible.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Open an AWS Support case to ask AWS to email the SOC 2 and ISO 27001 reports to the auditor.", fr: "Ouvrir un dossier AWS Support pour demander à AWS d'envoyer par e-mail les rapports SOC 2 et ISO 27001 à l'auditeur." }
    - id: b
      text: { en: "Download the SOC 2 report and the ISO 27001 certification on demand from AWS Artifact.", fr: "Télécharger à la demande le rapport SOC 2 et la certification ISO 27001 depuis AWS Artifact." }
    - id: c
      text: { en: "Enable the CIS AWS Foundations Benchmark standard in AWS Security Hub CSPM and export the findings.", fr: "Activer la norme CIS AWS Foundations Benchmark dans AWS Security Hub CSPM et exporter les résultats." }
    - id: d
      text: { en: "Deploy an AWS Config conformance pack in every account and export its compliance report.", fr: "Déployer un pack de conformité AWS Config dans chaque compte et exporter son rapport de conformité." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Artifact is the self-service portal for AWS security and compliance documents, such as SOC reports, PCI reports and ISO certifications. The company downloads them on demand, at no charge, and hands them to the auditor as audit artifacts.
    fr: |
      AWS Artifact est le portail en libre-service des documents de sécurité et de conformité d'AWS, comme les rapports SOC, les rapports PCI et les certifications ISO. L'entreprise les télécharge à la demande, sans frais, et les remet à l'auditeur comme pièces d'audit.
  options:
    a:
      en: |
        The reports are available on demand in AWS Artifact; going through a support case adds delay and effort for documents that are already self-service.
      fr: |
        Les rapports sont disponibles à la demande dans AWS Artifact ; passer par un dossier de support ajoute du délai et de l'effort pour des documents déjà en libre-service.
    c:
      en: |
        Security Hub CSPM evaluates the company's own resources against a standard. It does not provide the reports that attest to the controls AWS operates.
      fr: |
        Security Hub CSPM évalue les ressources de l'entreprise par rapport à une norme. Il ne fournit pas les rapports qui attestent des contrôles exploités par AWS.
    d:
      en: |
        A conformance pack evaluates the configuration of the company's resources. It says nothing about the controls on the AWS side of the shared responsibility model.
      fr: |
        Un pack de conformité évalue la configuration des ressources de l'entreprise. Il ne dit rien des contrôles du côté AWS du modèle de responsabilité partagée.
references:
  - title: What is AWS Artifact?
    url: https://docs.aws.amazon.com/artifact/latest/ug/what-is-aws-artifact.html
