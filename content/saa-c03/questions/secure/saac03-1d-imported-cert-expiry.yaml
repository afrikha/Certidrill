id: saac03-1d-imported-cert-expiry
objective: "1.3.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses an extended validation certificate from a third-party certificate authority on an Amazon CloudFront distribution. The certificate was imported into AWS Certificate Manager (ACM) in the us-east-1 Region. The security team must start an automated renewal workflow, implemented as an AWS Lambda function, when the certificate approaches expiration.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise un certificat à validation étendue émis par une autorité de certification tierce sur une distribution Amazon CloudFront. Le certificat a été importé dans AWS Certificate Manager (ACM) dans la Région us-east-1. L'équipe de sécurité doit lancer un processus de renouvellement automatisé, implémenté sous forme de fonction AWS Lambda, lorsque le certificat approche de son expiration.

    Quelle solution permet de répondre à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Rely on ACM managed renewal to renew the certificate and invoke the function when the renewal completes.", fr: "S'appuyer sur le renouvellement géré d'ACM pour renouveler le certificat et appeler la fonction lorsque le renouvellement est terminé." }
    - id: b
      text: { en: "Schedule the function every day to list the certificates in ACM, compare their expiration dates, and start the workflow when needed.", fr: "Planifier chaque jour la fonction pour qu'elle liste les certificats dans ACM, compare leurs dates d'expiration et lance le processus si nécessaire." }
    - id: c
      text: { en: "Create an AWS CloudTrail trail and a metric filter on RenewCertificate API calls that invokes the function.", fr: "Créer un journal de suivi AWS CloudTrail et un filtre de métriques sur les appels d'API RenewCertificate qui appelle la fonction." }
    - id: d
      text: { en: "Create an Amazon EventBridge rule for the ACM Certificate Approaching Expiration event that invokes the function.", fr: "Créer une règle Amazon EventBridge pour l'événement ACM Certificate Approaching Expiration qui appelle la fonction." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      ACM does not renew imported certificates. It sends the ACM Certificate Approaching Expiration event to EventBridge daily for active certificates, including imported ones, starting 45 days before expiration by default. An EventBridge rule on this event can invoke the Lambda function that reissues and reimports the certificate.
    fr: |
      ACM ne renouvelle pas les certificats importés. Il envoie chaque jour à EventBridge l'événement ACM Certificate Approaching Expiration pour les certificats actifs, y compris les certificats importés, à partir de 45 jours avant l'expiration par défaut. Une règle EventBridge sur cet événement peut appeler la fonction Lambda qui fait réémettre et réimporter le certificat.
  options:
    a:
      en: |
        Managed renewal is not available for imported certificates; the certificate would expire.
      fr: |
        Le renouvellement géré n'est pas disponible pour les certificats importés : le certificat expirerait.
    b:
      en: |
        A daily polling function works but is custom code that duplicates the event ACM already publishes.
      fr: |
        Une fonction d'interrogation quotidienne fonctionne, mais c'est du code personnalisé qui reproduit l'événement qu'ACM publie déjà.
    c:
      en: |
        RenewCertificate is not called for an imported certificate nearing expiration, so the filter would never fire.
      fr: |
        RenewCertificate n'est pas appelé pour un certificat importé proche de l'expiration : le filtre ne se déclencherait jamais.
references:
  - title: Amazon EventBridge support for ACM
    url: https://docs.aws.amazon.com/acm/latest/userguide/supported-events.html
  - title: Import certificates into AWS Certificate Manager
    url: https://docs.aws.amazon.com/acm/latest/userguide/import-certificate.html
