id: saac03-1a-session-policy-tenant
objective: "1.1.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS company stores the data of each tenant under a separate prefix in one Amazon S3 bucket. A backend service on Amazon ECS handles requests for thousands of tenants. For each request, the service must use credentials that can access only the current tenant's prefix, to limit the impact of a bug. The company adds tenants every day and does not want to create or update any IAM role or policy when a tenant is added.

    Which solution will meet these requirements?
  fr: |
    Une entreprise SaaS stocke les données de chaque locataire sous un préfixe distinct dans un seul compartiment (bucket) Amazon S3. Un service backend sur Amazon ECS traite les requêtes de milliers de locataires. Pour chaque requête, le service doit utiliser des informations d'identification qui n'accèdent qu'au préfixe du locataire courant, afin de limiter l'impact d'un bogue. L'entreprise ajoute des locataires chaque jour et ne veut créer ni mettre à jour aucun rôle ni aucune politique IAM lors de l'ajout d'un locataire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one IAM role per tenant with a policy for its prefix, and have the service assume the tenant's role for each request.", fr: "Créer un rôle IAM par locataire avec une politique pour son préfixe, et faire endosser par le service le rôle du locataire à chaque requête." }
    - id: b
      text: { en: "Attach a permissions boundary for the current tenant's prefix to the ECS task role before each request.", fr: "Attacher au rôle de tâche ECS, avant chaque requête, une limite d'autorisations pour le préfixe du locataire courant." }
    - id: c
      text: { en: "Create an IAM user per tenant and have the service load that user's access keys for each request.", fr: "Créer un utilisateur IAM par locataire et faire charger par le service les clés d'accès de cet utilisateur à chaque requête." }
    - id: d
      text: { en: "Have the service assume one shared role for each request and pass an inline session policy limited to the tenant's prefix.", fr: "Faire endosser par le service un seul rôle partagé à chaque requête et transmettre une politique de session en ligne limitée au préfixe du locataire." }
answer: { optionId: d }
explanation:
  correct:
    en: "A session policy passed in the AssumeRole call restricts that session: its permissions are the intersection of the role's identity-based policy and the session policy. The service generates the policy for the tenant's prefix at request time, so one shared role serves every tenant and nothing in IAM changes when a tenant is added."
    fr: "Une politique de session transmise dans l'appel AssumeRole restreint cette session : ses autorisations sont l'intersection de la politique basée sur l'identité du rôle et de la politique de session. Le service génère la politique pour le préfixe du locataire au moment de la requête : un seul rôle partagé sert tous les locataires et rien ne change dans IAM lors de l'ajout d'un locataire."
  options:
    a:
      en: "A role per tenant meets the isolation need, but it requires a new role and policy every day, and thousands of roles approach the IAM roles quota."
      fr: "Un rôle par locataire répond au besoin d'isolation, mais il exige chaque jour un nouveau rôle et une nouvelle politique, et des milliers de rôles approchent du quota de rôles IAM."
    b:
      en: "Changing the boundary of the shared task role for each request is an IAM update per request, and it affects all concurrent requests of the task."
      fr: "Modifier la limite du rôle de tâche partagé à chaque requête est une mise à jour IAM par requête, et elle affecte toutes les requêtes simultanées de la tâche."
    c:
      en: "IAM users per tenant add an identity for each new tenant and rely on long-term access keys."
      fr: "Des utilisateurs IAM par locataire ajoutent une identité pour chaque nouveau locataire et reposent sur des clés d'accès à long terme."
references:
  - title: AssumeRole
    url: https://docs.aws.amazon.com/STS/latest/APIReference/API_AssumeRole.html
