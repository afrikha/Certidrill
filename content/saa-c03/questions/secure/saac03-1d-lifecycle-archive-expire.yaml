id: saac03-1d-lifecycle-archive-expire
objective: "1.3.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An insurance company stores scanned claim documents in an Amazon S3 bucket. Documents are read often during the first 90 days and almost never afterward; retrieval within 48 hours is acceptable after 90 days. A data retention policy requires each document to be deleted 7 years after its creation.

    Which solution will meet these requirements MOST cost-effectively with the LEAST operational overhead?
  fr: |
    Une compagnie d'assurance stocke des documents de sinistres numérisés dans un compartiment Amazon S3. Les documents sont souvent lus pendant les 90 premiers jours, puis presque jamais ; au-delà de 90 jours, une récupération en 48 heures est acceptable. Une politique de conservation des données impose de supprimer chaque document 7 ans après sa création.

    Quelle solution permet de répondre à ces exigences de la façon la PLUS rentable et avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - id: a
      text: { en: "Add an S3 Lifecycle rule that transitions objects to S3 Glacier Deep Archive after 90 days and expires them after 7 years.", fr: "Ajouter une règle S3 Lifecycle qui fait passer les objets vers S3 Glacier Deep Archive après 90 jours et les fait expirer après 7 ans." }
    - id: b
      text: { en: "Schedule an AWS Lambda function each day that copies 90-day-old objects to S3 Glacier Deep Archive and deletes 7-year-old objects.", fr: "Planifier chaque jour une fonction AWS Lambda qui copie les objets de 90 jours vers S3 Glacier Deep Archive et supprime les objets de 7 ans." }
    - id: c
      text: { en: "Store the objects in S3 Intelligent-Tiering with the Archive Access tier activated for objects not accessed for 90 days.", fr: "Stocker les objets dans S3 Intelligent-Tiering avec le niveau Archive Access activé pour les objets non consultés depuis 90 jours." }
    - id: d
      text: { en: "Enable S3 Object Lock in compliance mode with a default retention of 7 years and store the objects in S3 Glacier Deep Archive.", fr: "Activer S3 Object Lock en mode conformité avec une conservation par défaut de 7 ans et stocker les objets dans S3 Glacier Deep Archive." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A lifecycle rule combines a Transition action (to S3 Glacier Deep Archive after 90 days, the cheapest class for data rarely read with hours of retrieval time) and an Expiration action at 7 years. S3 applies both automatically to every object, including new ones.
    fr: |
      Une règle de cycle de vie combine une action Transition (vers S3 Glacier Deep Archive après 90 jours, la classe la moins chère pour des données rarement lues avec une récupération en quelques heures) et une action Expiration à 7 ans. S3 applique les deux automatiquement à chaque objet, y compris aux nouveaux.
  options:
    b:
      en: |
        A custom function works but is code to maintain and run daily, which does not have the least operational overhead.
      fr: |
        Une fonction personnalisée fonctionne mais représente du code à maintenir et à exécuter chaque jour, ce qui n'a pas la charge opérationnelle la plus faible.
    c:
      en: |
        Intelligent-Tiering adds a monitoring charge per object and does not delete objects, so the 7-year deletion still needs a lifecycle rule.
      fr: |
        Intelligent-Tiering ajoute des frais de surveillance par objet et ne supprime pas les objets : la suppression à 7 ans nécessite toujours une règle de cycle de vie.
    d:
      en: |
        Object Lock prevents deletion during the retention period; it never deletes objects. Storing documents in Deep Archive from day one also breaks the frequent reads of the first 90 days.
      fr: |
        Object Lock empêche la suppression pendant la période de conservation ; il ne supprime jamais les objets. Stocker les documents dans Deep Archive dès le premier jour empêche aussi les lectures fréquentes des 90 premiers jours.
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
