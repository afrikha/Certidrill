id: saac03-1d-scp-data-residency
objective: "1.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A European company uses AWS Organizations. A data residency regulation requires that no workload in any member account, including accounts created in the future, runs outside the eu-central-1 and eu-west-1 Regions. Administrators of the member accounts must not be able to bypass the control.

    The company must prevent the creation of resources in other Regions, not only detect it.

    Which solution will meet these requirements?
  fr: |
    Une entreprise européenne utilise AWS Organizations. Une réglementation sur la résidence des données impose qu'aucune charge de travail d'un compte membre, y compris des comptes créés à l'avenir, ne s'exécute en dehors des Régions eu-central-1 et eu-west-1. Les administrateurs des comptes membres ne doivent pas pouvoir contourner ce contrôle.

    L'entreprise doit empêcher la création de ressources dans d'autres Régions, et pas seulement la détecter.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy an AWS Config rule in every account that detects resources outside the two Regions and notifies the security team.", fr: "Déployer dans chaque compte une règle AWS Config qui détecte les ressources situées hors des deux Régions et avertit l'équipe de sécurité." }
    - id: b
      text: { en: "Attach an IAM policy to every IAM role in each member account that denies actions outside the two Regions.", fr: "Attacher à chaque rôle IAM de chaque compte membre une politique IAM qui refuse les actions hors des deux Régions." }
    - id: c
      text: { en: "Attach an SCP to the organization root that denies actions when aws:RequestedRegion is not one of the two Regions.", fr: "Attacher à la racine de l'organisation une SCP qui refuse les actions lorsque aws:RequestedRegion ne correspond à aucune des deux Régions." }
    - id: d
      text: { en: "Create an AWS Organizations tag policy that requires a Region tag with one of the two approved values on every resource.", fr: "Créer une politique de balises AWS Organizations qui exige sur chaque ressource une balise Region avec l'une des deux valeurs approuvées." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An SCP attached to the root applies to every member account, including new ones, and member account administrators cannot remove it. A Deny statement conditioned on `aws:RequestedRegion` blocks requests to other Regions; global services such as IAM are usually exempted with `NotAction`.
    fr: |
      Une SCP attachée à la racine s'applique à chaque compte membre, y compris aux nouveaux, et les administrateurs des comptes membres ne peuvent pas la retirer. Une instruction Deny conditionnée par `aws:RequestedRegion` bloque les requêtes vers les autres Régions ; les services globaux comme IAM sont généralement exclus avec `NotAction`.
  options:
    a:
      en: |
        An AWS Config rule is a detective control. The resource is already created when the rule reports it.
      fr: |
        Une règle AWS Config est un contrôle de détection. La ressource est déjà créée quand la règle la signale.
    b:
      en: |
        Account administrators can detach or edit IAM policies, and roles or accounts created later are not covered automatically.
      fr: |
        Les administrateurs de compte peuvent détacher ou modifier les politiques IAM, et les rôles ou comptes créés ultérieurement ne sont pas couverts automatiquement.
    d:
      en: |
        A tag policy standardizes tag values. It does not stop anyone from creating resources in another Region.
      fr: |
        Une politique de balises normalise les valeurs des balises. Elle n'empêche personne de créer des ressources dans une autre Région.
references:
  - title: Service control policy examples
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html
