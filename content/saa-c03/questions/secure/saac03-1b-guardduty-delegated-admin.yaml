id: saac03-1b-guardduty-delegated-admin
objective: "1.1.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company has 120 accounts in AWS Organizations and creates new accounts every week. The security team must enable Amazon GuardDuty in every existing and future account in the Regions that the company uses. The team must review all findings from a dedicated security tooling account. The solution must require the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise possède 120 comptes dans AWS Organizations et crée de nouveaux comptes chaque semaine. L'équipe de sécurité doit activer Amazon GuardDuty dans chaque compte existant et futur, dans les Régions que l'entreprise utilise. L'équipe doit examiner tous les résultats depuis un compte dédié aux outils de sécurité. La solution doit exiger le MOINS de charge opérationnelle possible.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable GuardDuty in the management account and send an invitation from it to each member account.", fr: "Activer GuardDuty dans le compte de gestion et envoyer depuis celui-ci une invitation à chaque compte membre." } }
    - { id: b, text: { en: "From the management account, designate the security tooling account as the GuardDuty delegated administrator in each Region used.", fr: "Depuis le compte de gestion, désigner le compte des outils de sécurité comme administrateur délégué GuardDuty dans chaque Région utilisée." } }
    - { id: c, text: { en: "Deploy a CloudFormation StackSet that enables GuardDuty and an EventBridge rule that forwards findings in every account.", fr: "Déployer un StackSet CloudFormation qui active GuardDuty et une règle EventBridge qui transfère les résultats dans chaque compte." } }
    - { id: d, text: { en: "Attach an SCP to the organization root that requires GuardDuty to be enabled in every member account.", fr: "Attacher à la racine de l'organisation une SCP qui exige l'activation de GuardDuty dans chaque compte membre." } }
    - { id: e, text: { en: "In the delegated administrator account, configure GuardDuty to auto-enable all organization member accounts, including new ones.", fr: "Dans le compte administrateur délégué, configurer GuardDuty pour activer automatiquement tous les comptes membres de l'organisation, y compris les nouveaux." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: |
      With AWS Organizations, the management account designates a member account as the GuardDuty delegated administrator. GuardDuty is Regional, so this is done in each Region, with the same account everywhere. The delegated administrator then turns on auto-enable for all members (ALL), which covers existing and new accounts and centralizes their findings.
    fr: |
      Avec AWS Organizations, le compte de gestion désigne un compte membre comme administrateur délégué GuardDuty. GuardDuty est un service régional : cette désignation se fait dans chaque Région, avec le même compte partout. L'administrateur délégué active ensuite l'activation automatique pour tous les membres (ALL), ce qui couvre les comptes existants et nouveaux et centralise leurs résultats.
  options:
    a:
      en: |
        Invitations must be sent and accepted account by account, and AWS advises against using the management account as the GuardDuty administrator.
      fr: |
        Les invitations doivent être envoyées et acceptées compte par compte, et AWS déconseille d'utiliser le compte de gestion comme administrateur GuardDuty.
    c:
      en: |
        A StackSet can work, but it is custom automation to build and maintain, which is more overhead than the native Organizations integration.
      fr: |
        Un StackSet peut fonctionner, mais c'est une automatisation personnalisée à construire et à maintenir, plus lourde que l'intégration native avec Organizations.
    d:
      en: |
        SCPs only restrict permissions; they cannot enable a service or force a configuration.
      fr: |
        Les SCP ne font que restreindre des autorisations ; elles ne peuvent ni activer un service ni imposer une configuration.
references:
  - title: Managing GuardDuty accounts with AWS Organizations
    url: https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_organizations.html
