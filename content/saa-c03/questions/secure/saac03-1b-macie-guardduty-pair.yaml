id: saac03-1b-macie-guardduty-pair
objective: "1.2.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A retail company has two new security requirements. First, it must identify S3 objects that contain credit card numbers or other personal data. Second, it must detect activity that suggests compromised IAM credentials, such as API calls from known malicious IP addresses. The company wants managed AWS services that require no agents.

    Which AWS services will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de distribution a deux nouvelles exigences de sécurité. D'abord, elle doit identifier les objets S3 qui contiennent des numéros de carte bancaire ou d'autres données personnelles. Ensuite, elle doit détecter les activités qui suggèrent des informations d'identification IAM compromises, comme des appels d'API depuis des adresses IP malveillantes connues. L'entreprise veut des services AWS gérés qui ne nécessitent aucun agent.

    Quels services AWS répondent à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: "Amazon Inspector" }
    - { id: b, text: "Amazon Macie" }
    - { id: c, text: "AWS Config" }
    - { id: d, text: "Amazon GuardDuty" }
    - { id: e, text: "AWS Trusted Advisor" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      Amazon Macie uses machine learning and pattern matching to discover sensitive data such as PII, financial data and credentials in S3 objects. Amazon GuardDuty analyzes CloudTrail management events, VPC Flow Logs and DNS logs with threat intelligence to detect threats such as compromised credentials, without any agent for these sources.
    fr: |
      Amazon Macie utilise l'apprentissage automatique et la correspondance de motifs pour découvrir des données sensibles, comme des données personnelles, financières ou des informations d'identification, dans des objets S3. Amazon GuardDuty analyse les événements de gestion CloudTrail, les journaux de flux VPC et les journaux DNS avec du renseignement sur les menaces pour détecter des menaces comme des informations d'identification compromises, sans agent pour ces sources.
  options:
    a:
      en: |
        Amazon Inspector scans EC2 instances, container images and Lambda functions for software vulnerabilities; it does not classify S3 data or detect credential misuse.
      fr: |
        Amazon Inspector analyse les instances EC2, les images de conteneur et les fonctions Lambda à la recherche de vulnérabilités logicielles ; il ne classe pas les données S3 et ne détecte pas l'usage abusif d'informations d'identification.
    c:
      en: |
        AWS Config records and evaluates resource configurations; it does not inspect object contents or detect malicious API activity.
      fr: |
        AWS Config enregistre et évalue les configurations des ressources ; il n'inspecte pas le contenu des objets et ne détecte pas d'activité d'API malveillante.
    e:
      en: |
        Trusted Advisor checks the account against best practices; it does not discover sensitive data or detect active threats.
      fr: |
        Trusted Advisor vérifie le compte par rapport aux bonnes pratiques ; il ne découvre pas de données sensibles et ne détecte pas de menaces actives.
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
  - title: What is Amazon GuardDuty?
    url: https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html
