id: saac03-1c-dx-maximum-resiliency
objective: "1.2.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A payment processor runs a critical workload that exchanges data between its data centers and AWS over AWS Direct Connect. The connectivity must survive the complete failure of a Direct Connect location and, at the same time, the failure of a single device at the remaining location, while keeping the consistent performance of Direct Connect during failover. The company wants the design that AWS associates with a 99.99% Direct Connect SLA.

    Which solution will meet these requirements?
  fr: |
    Un processeur de paiements exécute une charge de travail critique qui échange des données entre ses centres de données et AWS par AWS Direct Connect. La connectivité doit résister à la défaillance complète d'un emplacement Direct Connect et, en même temps, à la défaillance d'un seul équipement dans l'emplacement restant, tout en conservant les performances régulières de Direct Connect pendant le basculement. L'entreprise veut la conception qu'AWS associe à un SLA Direct Connect de 99,99 %.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use two separate connections that terminate on separate devices at a single Direct Connect location."
        fr: "Utiliser deux connexions distinctes qui se terminent sur des équipements distincts dans un seul emplacement Direct Connect."
    - id: b
      text:
        en: "Use one connection at each of two Direct Connect locations, with one connection per location."
        fr: "Utiliser une connexion dans chacun de deux emplacements Direct Connect, soit une connexion par emplacement."
    - id: c
      text:
        en: "Use one Direct Connect connection as the primary path and an AWS Site-to-Site VPN connection over the internet as the backup path."
        fr: "Utiliser une connexion Direct Connect comme chemin principal et une connexion AWS Site-to-Site VPN sur Internet comme chemin de secours."
    - id: d
      text:
        en: "Use separate connections that terminate on separate devices at more than one Direct Connect location."
        fr: "Utiliser des connexions distinctes qui se terminent sur des équipements distincts dans plusieurs emplacements Direct Connect."
answer: { optionId: d }
explanation:
  correct:
    en: |
      The maximum resiliency model of the Direct Connect Resiliency Toolkit uses separate connections that terminate on separate devices in more than one location. It protects against device, connectivity and complete location failures and is associated with a 99.99% SLA when all SLA requirements are met.
    fr: |
      Le modèle de résilience maximale du Direct Connect Resiliency Toolkit utilise des connexions distinctes qui se terminent sur des équipements distincts dans plusieurs emplacements. Il protège contre les défaillances d'équipement, de connectivité et d'emplacement complet, et il est associé à un SLA de 99,99 % lorsque toutes les conditions du SLA sont remplies.
  options:
    a:
      en: |
        This is the development and test model: it survives a device failure but not the loss of the whole location.
      fr: |
        C'est le modèle de développement et de test : il résiste à la défaillance d'un équipement, mais pas à la perte de tout l'emplacement.
    b:
      en: |
        This is the high resiliency model (99.9%): after a location failure, a single device failure at the other location would cut connectivity.
      fr: |
        C'est le modèle de haute résilience (99,9 %) : après la défaillance d'un emplacement, la défaillance d'un seul équipement dans l'autre emplacement couperait la connectivité.
    c:
      en: |
        A VPN backup over the internet does not keep Direct Connect's consistent performance during failover, and one connection is not covered by the 99.99% model.
      fr: |
        Un VPN de secours sur Internet ne conserve pas les performances régulières de Direct Connect pendant le basculement, et une seule connexion n'est pas couverte par le modèle à 99,99 %.
references:
  - title: AWS Direct Connect Resiliency Toolkit
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/resiliency_toolkit.html
