id: saac03-1b-identity-center-entra-scim
objective: "1.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company manages its workforce identities in Microsoft Entra ID and has 30 AWS accounts in AWS Organizations. Employees must sign in to the AWS access portal with their Entra ID credentials. When HR adds or removes an employee in Entra ID, the change must be reflected in AWS automatically, without manual user management in AWS.

    Which solution will meet these requirements?
  fr: |
    Une entreprise gère les identités de ses collaborateurs dans Microsoft Entra ID et possède 30 comptes AWS dans AWS Organizations. Les employés doivent se connecter au portail d'accès AWS avec leurs informations d'identification Entra ID. Lorsque les RH ajoutent ou suppriment un employé dans Entra ID, la modification doit être répercutée automatiquement dans AWS, sans gestion manuelle des utilisateurs dans AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep the Identity Center directory as the identity source, and import the users every night with a CSV script.", fr: "Conserver l'annuaire Identity Center comme source d'identité, et importer les utilisateurs chaque nuit avec un script CSV." }
    - id: b
      text: { en: "Set Microsoft Entra ID as the external identity provider of IAM Identity Center, and enable automatic provisioning with SCIM.", fr: "Définir Microsoft Entra ID comme fournisseur d'identité externe d'IAM Identity Center, et activer le provisionnement automatique avec SCIM." }
    - id: c
      text: { en: "Create an IAM SAML identity provider for Entra ID in each account, and create an IAM user for each employee.", fr: "Créer un fournisseur d'identité SAML IAM pour Entra ID dans chaque compte, et créer un utilisateur IAM pour chaque employé." }
    - id: d
      text: { en: "Deploy AD Connector in a shared VPC and point it to the Microsoft Entra ID tenant.", fr: "Déployer AD Connector dans un VPC partagé et le faire pointer vers le locataire Microsoft Entra ID." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      IAM Identity Center supports an external SAML 2.0 identity provider such as Microsoft Entra ID as its identity source. With SCIM automatic provisioning, the IdP creates, updates and removes users and groups in Identity Center, so HR changes flow to AWS without manual work.
    fr: |
      IAM Identity Center prend en charge un fournisseur d'identité SAML 2.0 externe, comme Microsoft Entra ID, comme source d'identité. Avec le provisionnement automatique SCIM, l'IdP crée, met à jour et supprime les utilisateurs et les groupes dans Identity Center : les changements des RH arrivent dans AWS sans travail manuel.
  options:
    a:
      en: |
        With the Identity Center directory, users do not sign in with Entra ID credentials, and a nightly script is manual management that you must maintain.
      fr: |
        Avec l'annuaire Identity Center, les utilisateurs ne se connectent pas avec leurs informations Entra ID, et un script nocturne est une gestion manuelle à maintenir.
    c:
      en: |
        IAM users per employee in 30 accounts are exactly the manual user management to avoid, and they do not follow HR changes.
      fr: |
        Des utilisateurs IAM par employé dans 30 comptes représentent exactement la gestion manuelle à éviter, et ils ne suivent pas les changements des RH.
    d:
      en: |
        AD Connector connects to Active Directory domain controllers; it cannot connect to a Microsoft Entra ID tenant.
      fr: |
        AD Connector se connecte à des contrôleurs de domaine Active Directory ; il ne peut pas se connecter à un locataire Microsoft Entra ID.
references:
  - title: Provision users and groups from an external identity provider using SCIM
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/provision-automatically.html
  - title: Manage your identity source
    url: https://docs.aws.amazon.com/singlesignon/latest/userguide/manage-your-identity-source.html
