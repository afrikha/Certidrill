id: saac03-1b-lambda-resource-policy
objective: "1.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an AWS Lambda function in account A. An application in account B must invoke the function directly by using its own IAM role. The application role already has an identity-based policy that allows lambda:InvokeFunction on the function's ARN. The company must follow the principle of least privilege.

    Which additional configuration will meet these requirements?
  fr: |
    Une entreprise exécute une fonction AWS Lambda dans le compte A. Une application du compte B doit appeler directement la fonction avec son propre rôle IAM. Le rôle de l'application dispose déjà d'une politique basée sur l'identité qui autorise lambda:InvokeFunction sur l'ARN de la fonction. L'entreprise doit respecter le principe du moindre privilège.

    Quelle configuration supplémentaire répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an IAM role in account A with lambda:* permissions that the application assumes before each invocation.", fr: "Créer dans le compte A un rôle IAM doté des autorisations lambda:* que l'application assume avant chaque appel." }
    - id: b
      text: { en: "Attach an SCP to account B that allows lambda:InvokeFunction on the function's ARN.", fr: "Attacher au compte B une SCP qui autorise lambda:InvokeFunction sur l'ARN de la fonction." }
    - id: c
      text: { en: "Add the application role's ARN to the trust policy of the function's execution role.", fr: "Ajouter l'ARN du rôle de l'application à la politique d'approbation du rôle d'exécution de la fonction." }
    - id: d
      text: { en: "Add a statement to the function's resource-based policy that allows lambda:InvokeFunction for the application role's ARN.", fr: "Ajouter à la politique basée sur les ressources de la fonction une instruction qui autorise lambda:InvokeFunction pour l'ARN du rôle de l'application." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A Lambda function's resource-based policy grants other accounts, principals or AWS services permission to invoke it. Combined with the identity-based policy already in account B, a statement that allows only lambda:InvokeFunction for that role ARN completes the cross-account permission with the least privilege.
    fr: |
      La politique basée sur les ressources d'une fonction Lambda accorde à d'autres comptes, principaux ou services AWS l'autorisation de l'appeler. Combinée à la politique basée sur l'identité déjà présente dans le compte B, une instruction qui autorise seulement lambda:InvokeFunction pour l'ARN de ce rôle complète l'autorisation intercompte avec le moindre privilège.
  options:
    a:
      en: |
        lambda:* grants far more than invocation, and role chaining adds steps that the resource-based policy makes unnecessary.
      fr: |
        lambda:* accorde bien plus que l'appel, et le chaînage de rôles ajoute des étapes que la politique basée sur les ressources rend inutiles.
    b:
      en: |
        SCPs never grant permissions; account A must still allow the caller.
      fr: |
        Les SCP n'accordent jamais d'autorisations ; le compte A doit toujours autoriser l'appelant.
    c:
      en: |
        The execution role is the role the function assumes to call other services; it does not control who can invoke the function.
      fr: |
        Le rôle d'exécution est celui que la fonction assume pour appeler d'autres services ; il ne contrôle pas qui peut appeler la fonction.
references:
  - title: Working with resource-based policies in Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/access-control-resource-based.html
