id: saac03-1a-region-az-facts
objective: "1.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A solutions architect is preparing a design review for a company that will run regulated workloads on AWS. The review must state how AWS Regions and Availability Zones isolate resources and data.

    Which statements are correct? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un architecte de solutions prépare une revue de conception pour une entreprise qui exécutera des charges de travail réglementées sur AWS. La revue doit indiquer comment les Régions AWS et les zones de disponibilité isolent les ressources et les données.

    Quelles affirmations sont correctes ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Data stored in a Region is automatically copied to a second Region for durability.", fr: "Les données stockées dans une Région sont automatiquement copiées dans une seconde Région pour leur durabilité." } }
    - { id: b, text: { en: "Each public Region contains at least three physically separate Availability Zones.", fr: "Chaque Région publique contient au moins trois zones de disponibilité physiquement séparées." } }
    - { id: c, text: { en: "Resources created in one Region do not exist in another Region unless they are explicitly replicated or copied.", fr: "Les ressources créées dans une Région n'existent dans aucune autre Région, sauf réplication ou copie explicite." } }
    - { id: d, text: { en: "A failure of a service in one Region also stops that service in all other Regions.", fr: "Une panne d'un service dans une Région arrête aussi ce service dans toutes les autres Régions." } }
    - { id: e, text: { en: "An Availability Zone name such as eu-west-1a always identifies the same physical zone in every AWS account.", fr: "Un nom de zone de disponibilité comme eu-west-1a désigne toujours la même zone physique dans tous les comptes AWS." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Public Regions have at least three independent, physically separate Availability Zones. Regions are isolated from each other, and resources and data created in one Region stay there unless the customer uses a replication or copy feature, which makes cross-Region data protection a customer design choice."
    fr: "Les Régions publiques comptent au moins trois zones de disponibilité indépendantes et physiquement séparées. Les Régions sont isolées les unes des autres, et les ressources et données créées dans une Région y restent sauf si le client utilise une fonctionnalité de réplication ou de copie : la protection des données entre Régions est un choix de conception du client."
  options:
    a:
      en: "AWS does not replicate data across Regions on its own; the customer must configure replication or copies."
      fr: "AWS ne réplique pas de lui-même les données entre Régions ; le client doit configurer une réplication ou des copies."
    d:
      en: "Regions are independent fault isolation boundaries: a service failure is limited to one Region."
      fr: "Les Régions sont des limites d'isolation des pannes indépendantes : une panne de service est limitée à une Région."
    e:
      en: "In older accounts, AZ names are mapped independently per account; only AZ IDs identify the same location in every account."
      fr: "Dans les comptes anciens, les noms d'AZ sont associés indépendamment pour chaque compte ; seuls les ID d'AZ identifient le même emplacement dans tous les comptes."
references:
  - title: Regions
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-fault-isolation-boundaries/regions.html
  - title: AWS Availability Zones
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-availability-zones.html
