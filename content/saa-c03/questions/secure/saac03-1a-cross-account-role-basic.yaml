id: saac03-1a-cross-account-role-basic
objective: "1.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has a development account and a production account. Three operations engineers have IAM users in the development account. Occasionally, they must troubleshoot resources in the production account. The company does not want to create IAM users in the production account.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un compte de développement et d'un compte de production. Trois ingénieurs d'exploitation ont des utilisateurs IAM dans le compte de développement. De temps en temps, ils doivent diagnostiquer des ressources du compte de production. L'entreprise ne veut pas créer d'utilisateurs IAM dans le compte de production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Share the access keys of a production IAM user with the engineers through AWS Secrets Manager.", fr: "Partager avec les ingénieurs les clés d'accès d'un utilisateur IAM de production via AWS Secrets Manager." }
    - id: b
      text: { en: "Create a role in the production account that trusts the development account, and let the engineers assume it.", fr: "Créer dans le compte de production un rôle qui approuve le compte de développement, et laisser les ingénieurs l'endosser." }
    - id: c
      text: { en: "Add the production account ID to the policy of the engineers' IAM user group so that it applies in both accounts.", fr: "Ajouter l'ID du compte de production à la politique du groupe d'utilisateurs IAM des ingénieurs pour qu'elle s'applique aux deux comptes." }
    - id: d
      text: { en: "Create a VPC peering connection between the accounts so that the engineers can reach the production resources.", fr: "Créer une connexion de peering de VPC entre les comptes pour que les ingénieurs puissent atteindre les ressources de production." }
answer: { optionId: b }
explanation:
  correct:
    en: "Cross-account access with roles needs two halves: the role's trust policy in the production account trusts the development account, and the engineers' identity-based policies in the development account allow sts:AssumeRole on the role. The engineers then switch to the role and get temporary credentials."
    fr: "L'accès intercompte par rôles comporte deux moitiés : la politique d'approbation du rôle, dans le compte de production, approuve le compte de développement, et les politiques basées sur l'identité des ingénieurs, dans le compte de développement, autorisent sts:AssumeRole sur le rôle. Les ingénieurs passent alors au rôle et obtiennent des informations d'identification temporaires."
  options:
    a:
      en: "This requires an IAM user in production, which the company does not want, and it shares long-term keys among people."
      fr: "Cela exige un utilisateur IAM en production, ce que l'entreprise refuse, et partage des clés à long terme entre plusieurs personnes."
    c:
      en: "A group policy applies only to its members in the development account; it cannot grant permissions inside the production account, which must trust the users through a role."
      fr: "Une politique de groupe ne s'applique qu'à ses membres du compte de développement ; elle ne peut pas accorder d'autorisations dans le compte de production, qui doit approuver les utilisateurs via un rôle."
    d:
      en: "VPC peering provides network connectivity, not permissions to call AWS APIs in another account."
      fr: "Le peering de VPC fournit une connectivité réseau, pas des autorisations d'appel des API AWS dans un autre compte."
references:
  - title: IAM roles
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_terms-and-concepts.html
