id: saac03-1a-group-managed-policy
objective: "1.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research institute has 50 IAM users who work as data analysts. All analysts need the same permissions to query data with Amazon Athena and to read one Amazon S3 bucket. Analysts join and leave the team every month, and the permissions change a few times each year. The solution must minimize administrative effort.

    Which solution will meet these requirements?
  fr: |
    Un institut de recherche compte 50 utilisateurs IAM qui travaillent comme analystes de données. Tous les analystes ont besoin des mêmes autorisations pour interroger des données avec Amazon Athena et lire un compartiment (bucket) Amazon S3. Des analystes arrivent et partent chaque mois, et les autorisations changent quelques fois par an. La solution doit réduire au minimum l'effort d'administration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach an inline policy with the permissions to each analyst's IAM user.", fr: "Attacher une politique en ligne contenant les autorisations à l'utilisateur IAM de chaque analyste." }
    - id: b
      text: { en: "Create an IAM user group for each analyst and nest these groups in an Analysts group that has the policy.", fr: "Créer un groupe d'utilisateurs IAM par analyste et imbriquer ces groupes dans un groupe Analysts qui porte la politique." }
    - id: c
      text: { en: "Attach a customer managed policy to each analyst's IAM user and update all 50 attachments when the permissions change.", fr: "Attacher une politique gérée par le client à l'utilisateur IAM de chaque analyste et mettre à jour les 50 attachements quand les autorisations changent." }
    - id: d
      text: { en: "Create an Analysts IAM user group with a customer managed policy and add or remove users from the group.", fr: "Créer un groupe d'utilisateurs IAM Analysts avec une politique gérée par le client et y ajouter ou en retirer les utilisateurs." }
answer: { optionId: d }
explanation:
  correct:
    en: "A user group lets you manage the permissions of many users at once: users inherit the policies attached to the group. Adding or removing a user from the group grants or removes access, and editing the single customer managed policy updates everyone."
    fr: "Un groupe d'utilisateurs permet de gérer les autorisations de nombreux utilisateurs à la fois : les utilisateurs héritent des politiques attachées au groupe. Ajouter ou retirer un utilisateur du groupe accorde ou supprime l'accès, et modifier l'unique politique gérée par le client met tout le monde à jour."
  options:
    a:
      en: "Fifty inline policies must be created and edited one by one, which maximizes the administrative effort."
      fr: "Cinquante politiques en ligne doivent être créées et modifiées une par une, ce qui maximise l'effort d'administration."
    b:
      en: "IAM user groups cannot be nested; a group can contain only users."
      fr: "Les groupes d'utilisateurs IAM ne peuvent pas être imbriqués ; un groupe ne peut contenir que des utilisateurs."
    c:
      en: "A managed policy can be edited once, but attaching and detaching it user by user as people join and leave adds effort that a group avoids."
      fr: "Une politique gérée se modifie une seule fois, mais l'attacher et la détacher utilisateur par utilisateur au gré des arrivées et départs ajoute un effort qu'un groupe évite."
references:
  - title: IAM user groups
    url: https://docs.aws.amazon.com/IAM/latest/UserGuide/id_groups.html
