id: saac03-1c-macie-automated-discovery
objective: "1.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company has more than 300 Amazon S3 buckets created by different teams over several years. The compliance team must classify the data and find out which buckets contain personally identifiable information (PII), and it wants continuous visibility as new data is added. The company wants a managed service with the LEAST effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé possède plus de 300 compartiments Amazon S3 créés par différentes équipes au fil des années. L'équipe de conformité doit classer les données et déterminer quels compartiments contiennent des informations d'identification personnelle (PII), et elle veut une visibilité continue à mesure que de nouvelles données sont ajoutées. L'entreprise veut un service géré avec le MOINS d'effort possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Enable Amazon GuardDuty S3 Protection on all accounts and review its findings for buckets that contain PII."
        fr: "Activer Amazon GuardDuty S3 Protection sur tous les comptes et examiner ses résultats pour repérer les compartiments contenant des PII."
    - id: b
      text:
        en: "Enable Amazon Macie with automated sensitive data discovery for the S3 buckets."
        fr: "Activer Amazon Macie avec la découverte automatisée des données sensibles pour les compartiments S3."
    - id: c
      text:
        en: "Turn on S3 Inventory for each bucket and query the inventory reports with Amazon Athena to find PII."
        fr: "Activer S3 Inventory pour chaque compartiment et interroger les rapports d'inventaire avec Amazon Athena pour trouver les PII."
    - id: d
      text:
        en: "Enable Amazon Inspector on all accounts and review its findings for buckets that contain PII."
        fr: "Activer Amazon Inspector sur tous les comptes et examiner ses résultats pour repérer les compartiments contenant des PII."
answer: { optionId: b }
explanation:
  correct:
    en: |
      Macie uses managed data identifiers, based on machine learning and pattern matching, to detect sensitive data such as PII, financial information and credentials in S3 objects. Automated sensitive data discovery continually evaluates the bucket inventory and samples representative objects, which gives broad, ongoing visibility without defining jobs.
    fr: |
      Macie utilise des identificateurs de données gérés, fondés sur l'apprentissage automatique et la correspondance de motifs, pour détecter dans les objets S3 des données sensibles comme des PII, des informations financières et des informations d'identification. La découverte automatisée des données sensibles évalue en continu l'inventaire des compartiments et échantillonne des objets représentatifs, ce qui offre une visibilité large et continue sans définir de tâches.
  options:
    a:
      en: |
        GuardDuty S3 Protection detects suspicious API activity on buckets; it does not inspect object content for PII.
      fr: |
        GuardDuty S3 Protection détecte une activité d'API suspecte sur les compartiments ; il n'inspecte pas le contenu des objets pour y trouver des PII.
    c:
      en: |
        S3 Inventory lists object metadata such as size, storage class and encryption status; it does not read object content.
      fr: |
        S3 Inventory répertorie des métadonnées d'objets comme la taille, la classe de stockage et l'état de chiffrement ; il ne lit pas le contenu des objets.
    d:
      en: |
        Amazon Inspector scans workloads such as EC2 instances, container images and Lambda functions for vulnerabilities; it does not classify S3 data.
      fr: |
        Amazon Inspector analyse des charges de travail comme les instances EC2, les images de conteneur et les fonctions Lambda pour y détecter des vulnérabilités ; il ne classe pas les données S3.
references:
  - title: What is Amazon Macie?
    url: https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html
