id: saac03-1c-object-ownership-enforced
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company receives daily files from three partner AWS accounts, which upload objects to a bucket in the company's account. Some uploaded objects remain owned by the partner accounts, so the company cannot manage access to them with its bucket policy. The company wants to own every object in the bucket and to control access only with policies.

    Which solution will meet these requirements?
  fr: |
    Une entreprise reçoit chaque jour des fichiers de trois comptes AWS partenaires, qui chargent des objets dans un compartiment de son compte. Certains objets chargés restent la propriété des comptes partenaires : l'entreprise ne peut donc pas en gérer l'accès avec sa politique de compartiment. L'entreprise veut posséder chaque objet du compartiment et contrôler l'accès uniquement avec des politiques.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Set S3 Object Ownership on the bucket to Object writer."
        fr: "Définir S3 Object Ownership du compartiment sur Object writer."
    - id: b
      text:
        en: "Create an S3 access point for each partner account with its own access point policy."
        fr: "Créer un point d'accès S3 pour chaque compte partenaire avec sa propre politique de point d'accès."
    - id: c
      text:
        en: "Set S3 Object Ownership on the bucket to Bucket owner enforced."
        fr: "Définir S3 Object Ownership du compartiment sur Bucket owner enforced."
    - id: d
      text:
        en: "Enable S3 Versioning on the bucket so that each upload creates a version owned by the bucket owner."
        fr: "Activer S3 Versioning sur le compartiment pour que chaque chargement crée une version appartenant au propriétaire du compartiment."
answer: { optionId: c }
explanation:
  correct:
    en: |
      With the Bucket owner enforced setting, ACLs are disabled and the bucket owner automatically owns every object in the bucket. Access is then defined only by policies, which is the setting AWS recommends for most use cases and the default for new buckets.
    fr: |
      Avec le paramètre Bucket owner enforced, les ACL sont désactivées et le propriétaire du compartiment possède automatiquement chaque objet du compartiment. L'accès n'est alors défini que par des politiques ; c'est le paramètre qu'AWS recommande dans la plupart des cas et la valeur par défaut des nouveaux compartiments.
  options:
    a:
      en: |
        With Object writer, the uploading account owns the object, which is the current problem.
      fr: |
        Avec Object writer, le compte qui charge l'objet en est propriétaire, ce qui correspond au problème actuel.
    b:
      en: |
        Access points simplify access management for shared datasets but do not change who owns the uploaded objects.
      fr: |
        Les points d'accès simplifient la gestion des accès aux jeux de données partagés, mais ne changent pas le propriétaire des objets chargés.
    d:
      en: |
        Versioning keeps multiple versions of objects; it does not change object ownership.
      fr: |
        La gestion des versions conserve plusieurs versions des objets ; elle ne change pas la propriété des objets.
references:
  - title: Controlling ownership of objects and disabling ACLs for your bucket
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/about-object-ownership.html
