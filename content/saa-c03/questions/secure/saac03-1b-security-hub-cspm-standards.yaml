id: saac03-1b-security-hub-cspm-standards
objective: "1.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 60 accounts in AWS Organizations and uses Amazon GuardDuty, Amazon Inspector and Amazon Macie. The security team wants one place to view the findings of these services from all accounts. The team also needs continuous automated checks of the accounts against the AWS Foundational Security Best Practices standard.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 60 comptes dans AWS Organizations et utilise Amazon GuardDuty, Amazon Inspector et Amazon Macie. L'équipe de sécurité veut un seul endroit pour consulter les résultats de ces services pour tous les comptes. L'équipe a aussi besoin de vérifications automatisées et continues des comptes par rapport à la norme AWS Foundational Security Best Practices.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Amazon Detective with a delegated administrator account, and add all member accounts to the behavior graph.", fr: "Activer Amazon Detective avec un compte administrateur délégué, et ajouter tous les comptes membres au graphe de comportement." }
    - id: b
      text: { en: "Enable AWS Security Hub CSPM with a delegated administrator, and enable the AWS Foundational Security Best Practices standard.", fr: "Activer AWS Security Hub CSPM avec un administrateur délégué, et activer la norme AWS Foundational Security Best Practices." }
    - id: c
      text: { en: "Create an organization trail in AWS CloudTrail, and query the trail's logs with Amazon Athena from one account.", fr: "Créer un journal de suivi d'organisation dans AWS CloudTrail, et interroger ses journaux avec Amazon Athena depuis un seul compte." }
    - id: d
      text: { en: "Review the security checks of AWS Trusted Advisor for all accounts from the organization's management account.", fr: "Consulter les vérifications de sécurité d'AWS Trusted Advisor pour tous les comptes depuis le compte de gestion de l'organisation." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      AWS Security Hub CSPM collects findings from services such as GuardDuty, Inspector and Macie across accounts, normalizes them in the AWS Security Finding Format, and runs control checks for standards such as AWS Foundational Security Best Practices. Most control checks rely on AWS Config, which must be enabled and recording resources.
    fr: |
      AWS Security Hub CSPM collecte les résultats de services comme GuardDuty, Inspector et Macie pour plusieurs comptes, les normalise au format AWS Security Finding Format et exécute des vérifications de contrôles pour des normes comme AWS Foundational Security Best Practices. La plupart des vérifications reposent sur AWS Config, qui doit être activé et enregistrer les ressources.
  options:
    a:
      en: |
        Detective helps investigate findings, but it does not aggregate all findings or run best practice checks.
      fr: |
        Detective aide à enquêter sur les résultats, mais il n'agrège pas tous les résultats et n'exécute pas de vérifications de bonnes pratiques.
    c:
      en: |
        CloudTrail records API activity; it neither collects the other services' findings nor checks a security standard.
      fr: |
        CloudTrail enregistre l'activité des API ; il ne collecte pas les résultats des autres services et ne vérifie pas de norme de sécurité.
    d:
      en: |
        Trusted Advisor offers some security checks, but it does not aggregate GuardDuty, Inspector and Macie findings or implement the AWS Foundational Security Best Practices standard.
      fr: |
        Trusted Advisor propose quelques vérifications de sécurité, mais il n'agrège pas les résultats de GuardDuty, Inspector et Macie et n'implémente pas la norme AWS Foundational Security Best Practices.
references:
  - title: Introduction to AWS Security Hub CSPM
    url: https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html
