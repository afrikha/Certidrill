id: saac03-1d-rds-force-ssl
objective: "1.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL 14 DB instance that uses the default DB parameter group. Some reporting tools still connect without SSL/TLS. A new compliance rule requires the database to reject every client connection that is not encrypted in transit.

    Which solution will meet this requirement?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for PostgreSQL 14 qui utilise le groupe de paramètres de base de données par défaut. Certains outils de reporting se connectent encore sans SSL/TLS. Une nouvelle règle de conformité impose que la base de données rejette toute connexion cliente qui n'est pas chiffrée en transit.

    Quelle solution permet de répondre à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Copy a snapshot of the DB instance with encryption enabled and restore a new encrypted DB instance from it.", fr: "Copier un instantané de l'instance de base de données avec le chiffrement activé et restaurer à partir de celui-ci une nouvelle instance chiffrée." }
    - id: b
      text: { en: "Change the security group of the DB instance to allow port 5432 only from the subnets of the reporting tools.", fr: "Modifier le groupe de sécurité de l'instance pour autoriser le port 5432 uniquement depuis les sous-réseaux des outils de reporting." }
    - id: c
      text: { en: "Modify the DB instance to use the latest certificate authority (CA) for its server certificate.", fr: "Modifier l'instance de base de données pour qu'elle utilise la dernière autorité de certification (CA) pour son certificat de serveur." }
    - id: d
      text: { en: "Set rds.force_ssl to 1 in a custom DB parameter group, associate the group with the DB instance, and reboot it.", fr: "Définir rds.force_ssl sur 1 dans un groupe de paramètres de base de données personnalisé, associer ce groupe à l'instance et la redémarrer." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When `rds.force_ssl` is 1, RDS for PostgreSQL rejects connections that do not use SSL. The default parameter group cannot be edited, so the value is set in a custom group that is associated with the instance, followed by a reboot. The parameter is on by default only from PostgreSQL 15.
    fr: |
      Lorsque `rds.force_ssl` vaut 1, RDS for PostgreSQL rejette les connexions qui n'utilisent pas SSL. Le groupe de paramètres par défaut ne peut pas être modifié : la valeur est définie dans un groupe personnalisé associé à l'instance, suivi d'un redémarrage. Le paramètre n'est activé par défaut qu'à partir de PostgreSQL 15.
  options:
    a:
      en: |
        Snapshot encryption protects data at rest; it does not force clients to use TLS.
      fr: |
        Le chiffrement des instantanés protège les données au repos ; il n'oblige pas les clients à utiliser TLS.
    b:
      en: |
        The security group limits which sources can connect; the connections allowed can still be unencrypted.
      fr: |
        Le groupe de sécurité limite les sources qui peuvent se connecter ; les connexions autorisées peuvent rester non chiffrées.
    c:
      en: |
        Updating the server certificate keeps TLS connections valid, but clients can still connect without SSL.
      fr: |
        Mettre à jour le certificat de serveur garde les connexions TLS valides, mais les clients peuvent toujours se connecter sans SSL.
references:
  - title: Using SSL with a PostgreSQL DB instance
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/PostgreSQL.Concepts.General.SSL.html
