id: saac03-1d-cloudhsm-key-store
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A bank stores transaction archives in Amazon S3 with SSE-KMS. A new regulation requires that the key material protecting the archives be generated and used only in single-tenant hardware security modules (HSMs) that the bank owns and manages. The bank must continue to use SSE-KMS so that the applications that write to S3 do not change.

    Which solution will meet these requirements?
  fr: |
    Une banque stocke des archives de transactions dans Amazon S3 avec SSE-KMS. Une nouvelle réglementation impose que le matériel de clé qui protège les archives soit généré et utilisé uniquement dans des modules de sécurité matériels (HSM) à locataire unique que la banque possède et gère. La banque doit continuer à utiliser SSE-KMS afin que les applications qui écrivent dans S3 ne changent pas.

    Quelle solution permet de répondre à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a customer managed KMS key with imported key material that the bank generates on premises, and use it for SSE-KMS.", fr: "Créer une clé KMS gérée par le client avec du matériel de clé importé que la banque génère sur site, et l'utiliser pour SSE-KMS." }
    - id: b
      text: { en: "Create an AWS CloudHSM key store backed by a CloudHSM cluster that the bank manages, and use a KMS key from it for SSE-KMS.", fr: "Créer un magasin de clés AWS CloudHSM adossé à un cluster CloudHSM géré par la banque, et utiliser une clé KMS de ce magasin pour SSE-KMS." }
    - id: c
      text: { en: "Create an AWS CloudHSM cluster and change the applications to encrypt the archives with the PKCS #11 library before upload.", fr: "Créer un cluster AWS CloudHSM et modifier les applications pour chiffrer les archives avec la bibliothèque PKCS #11 avant le chargement." }
    - id: d
      text: { en: "Create a multi-Region customer managed KMS key and use it for SSE-KMS in the Region of the bucket.", fr: "Créer une clé KMS multi-Régions gérée par le client et l'utiliser pour SSE-KMS dans la Région du compartiment." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      An AWS CloudHSM key store is an AWS KMS custom key store backed by a CloudHSM cluster that the customer owns and manages; its KMS keys are generated and used inside those single-tenant HSMs. The keys work like any customer managed key with integrated services, so S3 keeps using SSE-KMS and the applications do not change.
    fr: |
      Un magasin de clés AWS CloudHSM est un magasin de clés personnalisé AWS KMS adossé à un cluster CloudHSM que le client possède et gère ; ses clés KMS sont générées et utilisées dans ces HSM à locataire unique. Les clés fonctionnent comme toute clé gérée par le client avec les services intégrés : S3 continue d'utiliser SSE-KMS et les applications ne changent pas.
  options:
    a:
      en: |
        With imported key material, the bank generates the material, but the key is used in the HSMs of AWS KMS, which the bank does not own or manage.
      fr: |
        Avec du matériel de clé importé, la banque génère le matériel, mais la clé est utilisée dans les HSM d'AWS KMS, que la banque ne possède ni ne gère.
    c:
      en: |
        Client-side encryption with CloudHSM meets the HSM requirement, but it changes the applications and abandons SSE-KMS.
      fr: |
        Le chiffrement côté client avec CloudHSM répond à l'exigence sur les HSM, mais il modifie les applications et abandonne SSE-KMS.
    d:
      en: |
        Multi-Region keys replicate key material across Regions within AWS KMS; they do not move the keys into HSMs the bank manages. Custom key stores do not support multi-Region keys either.
      fr: |
        Les clés multi-Régions répliquent le matériel de clé entre Régions dans AWS KMS ; elles ne placent pas les clés dans des HSM gérés par la banque. Les magasins de clés personnalisés ne prennent d'ailleurs pas en charge les clés multi-Régions.
references:
  - title: AWS CloudHSM key stores
    url: https://docs.aws.amazon.com/kms/latest/developerguide/keystore-cloudhsm.html
  - title: What is AWS CloudHSM?
    url: https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html
