id: saac03-1b-scp-management-account
objective: "1.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations. The security team attached an SCP to the organization root that denies cloudtrail:StopLogging and cloudtrail:DeleteTrail. During an audit, the team discovers that an administrator stopped logging on a trail in the management account, where several production workloads also run. The company must ensure that the protection applies to all of its workloads.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations. L'équipe de sécurité a attaché à la racine de l'organisation une SCP qui refuse cloudtrail:StopLogging et cloudtrail:DeleteTrail. Lors d'un audit, l'équipe découvre qu'un administrateur a arrêté la journalisation d'un journal de suivi (trail) dans le compte de gestion, où s'exécutent aussi plusieurs charges de travail de production. L'entreprise doit garantir que la protection s'applique à toutes ses charges de travail.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Attach the same SCP directly to the management account so that it applies there in addition to the root attachment.", fr: "Attacher la même SCP directement au compte de gestion afin qu'elle s'y applique en plus de l'attachement à la racine." }
    - id: b
      text: { en: "Add an aws:PrincipalAccount condition with the management account ID to the SCP so that it also matches that account.", fr: "Ajouter à la SCP une condition aws:PrincipalAccount avec l'ID du compte de gestion afin qu'elle cible aussi ce compte." }
    - id: c
      text: { en: "Replace the SCP with a resource control policy (RCP) attached to the root so that the trails in every account are protected.", fr: "Remplacer la SCP par une politique de contrôle des ressources (RCP) attachée à la racine afin de protéger les journaux de suivi de tous les comptes." }
    - id: d
      text: { en: "Move the workloads from the management account to member accounts, and limit access to the management account to a few administrators.", fr: "Déplacer les charges de travail du compte de gestion vers des comptes membres, et limiter l'accès au compte de gestion à quelques administrateurs." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      SCPs never affect users or roles in the management account, wherever the policy is attached. The only way to put workloads under the SCP is to run them in member accounts. AWS recommends keeping the management account free of workloads and tightly restricting who can use it.
    fr: |
      Les SCP n'affectent jamais les utilisateurs ou les rôles du compte de gestion, quel que soit l'endroit où la politique est attachée. La seule façon de placer les charges de travail sous la SCP est de les exécuter dans des comptes membres. AWS recommande de ne pas exécuter de charges de travail dans le compte de gestion et de limiter strictement les personnes qui l'utilisent.
  options:
    a:
      en: |
        An SCP attached to the management account has no effect on that account's principals.
      fr: |
        Une SCP attachée au compte de gestion n'a aucun effet sur les principaux de ce compte.
    b:
      en: |
        No condition can make an SCP apply to the management account; SCPs affect only member accounts.
      fr: |
        Aucune condition ne permet d'appliquer une SCP au compte de gestion ; les SCP n'affectent que les comptes membres.
    c:
      en: |
        RCPs do not affect resources in the management account either, so they do not solve the problem in that account.
      fr: |
        Les RCP n'affectent pas non plus les ressources du compte de gestion, et elles ne règlent donc pas le problème dans ce compte.
references:
  - title: Service control policies (SCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html
  - title: Resource control policies (RCPs)
    url: https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_rcps.html
