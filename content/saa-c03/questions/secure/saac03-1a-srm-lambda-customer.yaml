id: saac03-1a-srm-lambda-customer
objective: "1.1.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is moving a scheduled job from Amazon EC2 to AWS Lambda. The function uses a Lambda-managed Python runtime with the default runtime update mode, and it is deployed as a .zip file archive that includes third-party libraries. The security team must document the responsibilities that stay with the company after the move.

    Which responsibilities remain with the company? (Choose three.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise déplace une tâche planifiée d'Amazon EC2 vers AWS Lambda. La fonction utilise un environnement d'exécution Python géré par Lambda avec le mode de mise à jour par défaut, et elle est déployée sous forme d'archive .zip qui inclut des bibliothèques tierces. L'équipe de sécurité doit documenter les responsabilités qui restent à l'entreprise après la migration.

    Quelles responsabilités restent à l'entreprise ? (Choisissez trois réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Securing the function code.", fr: "Sécuriser le code de la fonction." } }
    - { id: b, text: { en: "Updating the third-party libraries in the deployment package.", fr: "Mettre à jour les bibliothèques tierces du paquet de déploiement." } }
    - { id: c, text: { en: "Applying security patches to the managed Python runtime.", fr: "Appliquer les correctifs de sécurité à l'environnement d'exécution Python géré." } }
    - { id: d, text: { en: "Patching the operating system of the hosts that run the function.", fr: "Appliquer les correctifs au système d'exploitation des hôtes qui exécutent la fonction." } }
    - { id: e, text: { en: "Granting least-privilege permissions to the function's execution role.", fr: "Accorder des autorisations de moindre privilège au rôle d'exécution de la fonction." } }
    - { id: f, text: { en: "Adding servers to handle more concurrent invocations.", fr: "Ajouter des serveurs pour gérer davantage d'appels simultanés." } }
answer: { optionIds: [ a, b, e ] }
explanation:
  correct:
    en: "With Lambda, AWS manages the infrastructure, the hosts and, in the default Auto update mode, the managed runtime versions. The customer stays responsible for the code, the dependencies packaged with it, which take precedence over runtime-provided versions, and the IAM permissions of the execution role."
    fr: "Avec Lambda, AWS gère l'infrastructure, les hôtes et, en mode de mise à jour Auto par défaut, les versions de l'environnement d'exécution géré. Le client reste responsable du code, des dépendances incluses dans le paquet, qui priment sur les versions fournies par l'environnement d'exécution, et des autorisations IAM du rôle d'exécution."
  options:
    c:
      en: "In Auto mode, Lambda updates managed runtimes to the latest secure runtime version itself."
      fr: "En mode Auto, Lambda met lui-même à jour les environnements d'exécution gérés vers la dernière version sécurisée."
    d:
      en: "The hosts and their operating system are part of the infrastructure that AWS manages for Lambda."
      fr: "Les hôtes et leur système d'exploitation font partie de l'infrastructure qu'AWS gère pour Lambda."
    f:
      en: "Lambda scales the execution environments automatically; the customer does not provision servers."
      fr: "Lambda met à l'échelle automatiquement les environnements d'exécution ; le client ne provisionne pas de serveurs."
references:
  - title: Understanding how Lambda manages runtime updates
    url: https://docs.aws.amazon.com/lambda/latest/dg/runtimes-update.html
  - title: Shared Responsibility Model
    url: https://aws.amazon.com/compliance/shared-responsibility-model/
