id: saac03-3a-amazon-mq-activemq
objective: "3.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating an on-premises Java application to AWS. The application's components communicate through an Apache ActiveMQ broker by using JMS and STOMP clients. The company wants a managed message broker so that it no longer maintains broker servers, and it does not want to rewrite the messaging code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre vers AWS une application Java sur site. Les composants de l'application communiquent via un agent de messages Apache ActiveMQ à l'aide de clients JMS et STOMP. L'entreprise souhaite un agent de messages géré pour ne plus maintenir de serveurs d'agent, et ne veut pas réécrire le code de messagerie.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace the broker with Amazon SQS queues and Amazon SNS topics.", fr: "Remplacer l'agent par des files d'attente Amazon SQS et des rubriques Amazon SNS." }
    - id: b
      text: { en: "Replace the broker with an Amazon Kinesis data stream.", fr: "Remplacer l'agent par un flux de données Amazon Kinesis." }
    - id: c
      text: { en: "Migrate the broker to Amazon MQ for ActiveMQ and update the connection endpoints.", fr: "Migrer l'agent vers Amazon MQ pour ActiveMQ et mettre à jour les points de terminaison de connexion." }
    - id: d
      text: { en: "Replace the broker with an Amazon EventBridge event bus and rules.", fr: "Remplacer l'agent par un bus d'événements et des règles Amazon EventBridge." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon MQ is a managed broker service for Apache ActiveMQ and RabbitMQ that supports industry-standard protocols such as JMS and STOMP. Existing brokers can move to Amazon MQ without rewriting messaging code; in most cases only the connection endpoints change.
    fr: |-
      Amazon MQ est un service d'agent de messages géré pour Apache ActiveMQ et RabbitMQ qui prend en charge des protocoles standard tels que JMS et STOMP. Les agents existants peuvent migrer vers Amazon MQ sans réécriture du code de messagerie ; dans la plupart des cas, seuls les points de terminaison de connexion changent.
  options:
    a:
      en: |-
        SQS and SNS use their own AWS APIs and do not speak STOMP, so the messaging code would have to be rewritten.
      fr: |-
        SQS et SNS utilisent leurs propres API AWS et ne prennent pas en charge STOMP : le code de messagerie devrait être réécrit.
    b:
      en: |-
        Kinesis Data Streams is a streaming service with its own API; the application would need to be redesigned.
      fr: |-
        Kinesis Data Streams est un service de streaming doté de sa propre API ; l'application devrait être repensée.
    d:
      en: |-
        EventBridge routes events through its own API and does not support the JMS or STOMP protocols the clients use.
      fr: |-
        EventBridge achemine les événements via sa propre API et ne prend pas en charge les protocoles JMS ou STOMP utilisés par les clients.
references:
