id: saac03-3c-firehose-clickstream
objective: "3.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to capture clickstream events from its website continuously and deliver them to Amazon S3 within a few minutes for analysis. No application needs to read the events before they reach S3. The company does not want to write consumer code or manage capacity.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise souhaite capturer en continu les événements de parcours de navigation (clickstream) de son site web et les livrer dans Amazon S3 en quelques minutes pour analyse. Aucune application n'a besoin de lire les événements avant leur arrivée dans S3. L'entreprise ne veut ni écrire de code consommateur ni gérer de capacité.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Send the events to an Amazon SQS queue and use an AWS Lambda function to write each message to S3 as an object.", fr: "Envoyer les événements dans une file d'attente Amazon SQS et utiliser une fonction AWS Lambda qui écrit chaque message dans S3 sous forme d'objet." } }
    - { id: b, text: { en: "Send the events to an Amazon Kinesis data stream in provisioned mode and run a consumer application on EC2 that writes to S3.", fr: "Envoyer les événements dans un flux de données Amazon Kinesis en mode provisionné et exécuter sur EC2 une application consommatrice qui écrit dans S3." } }
    - { id: c, text: { en: "Send the events to an Amazon Data Firehose stream that has the S3 bucket as its destination.", fr: "Envoyer les événements vers un flux Amazon Data Firehose dont la destination est le compartiment S3." } }
    - { id: d, text: { en: "Write the events to local files on the web servers and copy them with an AWS DataSync task every hour.", fr: "Écrire les événements dans des fichiers locaux sur les serveurs web et les copier avec une tâche AWS DataSync toutes les heures." } }
answer: { optionId: c }
explanation:
  correct:
    en: Amazon Data Firehose is a fully managed service that receives streaming data and delivers it to destinations such as Amazon S3. It buffers records by size or time, can batch, compress and encrypt them, and scales automatically, with no consumer code and no capacity to manage.
    fr: "Amazon Data Firehose est un service entièrement géré qui reçoit des données en streaming et les livre à des destinations comme Amazon S3. Il met les enregistrements en mémoire tampon selon une taille ou une durée, peut les regrouper, les compresser et les chiffrer, et s'adapte automatiquement, sans code consommateur ni capacité à gérer."
  options:
    a: { en: "This requires custom code and creates one small object per event, which is inefficient for analysis.", fr: "Cette solution exige du code personnalisé et crée un petit objet par événement, ce qui est inefficace pour l'analyse." }
    b: { en: "A provisioned stream needs shard management, and the EC2 consumer is code and servers to operate.", fr: "Un flux provisionné demande de gérer les partitions (shards), et le consommateur EC2 représente du code et des serveurs à exploiter." }
    d: { en: "DataSync copies files between storage systems; hourly copies miss the few-minute target and add file handling on the web servers.", fr: "DataSync copie des fichiers entre systèmes de stockage ; des copies horaires manquent l'objectif de quelques minutes et ajoutent une gestion de fichiers sur les serveurs web." }
references:
  - title: What is Amazon Data Firehose?
    url: https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html
