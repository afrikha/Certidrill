id: saac03-3c-firehose-json-to-parquet
objective: "3.5.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company delivers JSON events to Amazon S3 with an Amazon Data Firehose stream. The analytics team requires the data to be stored in Apache Parquet format so that Amazon Athena queries are faster and cheaper. The schema of the events is already defined in a table in the AWS Glue Data Catalog. The company wants no code and no servers to manage.

    Which solution will meet these requirements?
  fr: |
    Une entreprise livre des événements JSON dans Amazon S3 avec un flux Amazon Data Firehose. L'équipe d'analytique exige que les données soient stockées au format Apache Parquet afin que les requêtes Amazon Athena soient plus rapides et moins coûteuses. Le schéma des événements est déjà défini dans une table d'AWS Glue Data Catalog. L'entreprise ne veut ni code ni serveur à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Configure the Firehose stream to compress the delivered objects with GZIP.", fr: "Configurer le flux Firehose pour compresser les objets livrés avec GZIP." } }
    - { id: b, text: { en: "Add an AWS Lambda transformation function to the stream that writes the records in Parquet format.", fr: "Ajouter au flux une fonction de transformation AWS Lambda qui écrit les enregistrements au format Parquet." } }
    - { id: c, text: { en: "Enable record format conversion on the Firehose stream to Apache Parquet with the schema from the Glue table.", fr: "Activer la conversion du format des enregistrements sur le flux Firehose vers Apache Parquet avec le schéma de la table Glue." } }
    - { id: d, text: { en: "Run an Amazon EMR cluster every night that converts the delivered JSON objects to Parquet.", fr: "Exécuter chaque nuit un cluster Amazon EMR qui convertit en Parquet les objets JSON livrés." } }
answer: { optionId: c }
explanation:
  correct:
    en: Firehose can convert JSON input to Apache Parquet or Apache ORC before writing to Amazon S3. The conversion uses a schema stored in the AWS Glue Data Catalog, a JSON deserializer and a Parquet serializer, all configured on the stream, with no code.
    fr: "Firehose peut convertir des données d'entrée JSON en Apache Parquet ou Apache ORC avant de les écrire dans Amazon S3. La conversion utilise un schéma stocké dans AWS Glue Data Catalog, un désérialiseur JSON et un sérialiseur Parquet, le tout configuré sur le flux, sans code."
  options:
    a: { en: "GZIP reduces the size of the objects but keeps the data as row-based JSON, not Parquet.", fr: "GZIP réduit la taille des objets, mais conserve les données en JSON orienté lignes, pas en Parquet." }
    b: { en: "A Lambda function is custom code, and Firehose already converts JSON to Parquet natively.", fr: "Une fonction Lambda est du code personnalisé, et Firehose convertit déjà nativement le JSON en Parquet." }
    d: { en: "A nightly EMR cluster adds infrastructure and code, and the data stays in JSON until the job runs.", fr: "Un cluster EMR nocturne ajoute de l'infrastructure et du code, et les données restent en JSON jusqu'à l'exécution de la tâche." }
references:
  - title: Convert input data format in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/record-format-conversion.html
