id: saac03-3b-aurora-promotion-tiers
objective: "3.3.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An Amazon Aurora MySQL DB cluster has a db.r6g.2xlarge writer and three Aurora Replicas, all in promotion tier 1: R1 (db.r6g.2xlarge), R2 (db.r6g.large) and R3 (db.r6g.4xlarge, used by a reporting tool). If the writer fails, R1 must be promoted first. R3 must be promoted only if no other replica is available.

    Which solution will meet these requirements?
  fr: |
    Un cluster de bases de données Amazon Aurora MySQL possède une instance d'écriture db.r6g.2xlarge et trois réplicas Aurora, tous au niveau de promotion 1 : R1 (db.r6g.2xlarge), R2 (db.r6g.large) et R3 (db.r6g.4xlarge, utilisé par un outil de reporting). Si l'instance d'écriture tombe en panne, R1 doit être promu en premier. R3 ne doit être promu que si aucun autre réplica n'est disponible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep all replicas in tier 1, because Aurora always promotes the replica whose class matches the writer.", fr: "Laisser tous les réplicas au niveau 1, car Aurora promeut toujours le réplica dont la classe correspond à celle de l'instance d'écriture." }
    - id: b
      text: { en: "Set R1 to tier 15 and R3 to tier 0, because Aurora promotes the replica with the highest tier number first.", fr: "Placer R1 au niveau 15 et R3 au niveau 0, car Aurora promeut d'abord le réplica dont le numéro de niveau est le plus élevé." }
    - id: c
      text: { en: "Enable Aurora Auto Scaling so that new replicas with the writer's class become the preferred failover targets.", fr: "Activer Aurora Auto Scaling afin que de nouveaux réplicas de la classe de l'instance d'écriture deviennent les cibles de basculement préférées." }
    - id: d
      text: { en: "Set R1 to tier 0 and R3 to tier 15, and leave R2 in tier 1.", fr: "Placer R1 au niveau 0 et R3 au niveau 15, et laisser R2 au niveau 1." }
answer: { optionId: d }
explanation:
  correct:
    en: Aurora promotes the replica with the highest priority, which is the lowest tier number (0 is highest, 15 is lowest). With R1 in tier 0, R2 in tier 1 and R3 in tier 15, R1 is promoted first and R3 is chosen only when no replica in a higher tier is available. Changing a tier does not trigger a failover.
    fr: Aurora promeut le réplica de plus haute priorité, c'est-à-dire de plus petit numéro de niveau (0 est la priorité la plus haute, 15 la plus basse). Avec R1 au niveau 0, R2 au niveau 1 et R3 au niveau 15, R1 est promu en premier et R3 n'est choisi que si aucun réplica d'un niveau prioritaire n'est disponible. Changer de niveau ne déclenche pas de basculement.
  options:
    a:
      en: Among replicas with the same priority, Aurora promotes the largest one, so R3 (db.r6g.4xlarge) would be promoted first.
      fr: Entre réplicas de même priorité, Aurora promeut le plus grand ; R3 (db.r6g.4xlarge) serait donc promu en premier.
    b:
      en: Tier 0 is the highest priority, so this configuration makes R3 the first replica to be promoted.
      fr: Le niveau 0 est la priorité la plus haute ; cette configuration fait donc de R3 le premier réplica promu.
    c:
      en: Replicas created by Aurora Auto Scaling get promotion tier 15 by default, and auto scaling does not change the order of the existing replicas.
      fr: Les réplicas créés par Aurora Auto Scaling reçoivent par défaut le niveau de promotion 15, et la mise à l'échelle automatique ne change pas l'ordre des réplicas existants.
references:
  - title: High availability for Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html
