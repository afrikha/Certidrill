id: saac03-3b-dbtype-redshift
objective: "3.3.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company stores 300 TB of historical sales data and wants analysts to run complex analytical SQL queries on it from business intelligence (BI) tools. The production order database runs on Amazon Aurora MySQL and must not be slowed by these queries. The company wants to avoid managing capacity for the analytics workload.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution stocke 300 To de données de ventes historiques et veut que ses analystes y exécutent des requêtes SQL analytiques complexes depuis des outils de décisionnel (BI). La base de commandes de production fonctionne sur Amazon Aurora MySQL et ne doit pas être ralentie par ces requêtes. L'entreprise veut éviter de gérer la capacité de la charge analytique.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add Aurora Replicas to the production cluster and point the BI tools to the reader endpoint.", fr: "Ajouter des réplicas Aurora au cluster de production et diriger les outils BI vers le point de terminaison du lecteur." }
    - id: b
      text: { en: "Load the sales data into Amazon Redshift Serverless and connect the BI tools to it.", fr: "Charger les données de ventes dans Amazon Redshift Serverless et y connecter les outils BI." }
    - id: c
      text: { en: "Copy the sales data into an Amazon DynamoDB table with global secondary indexes for each report.", fr: "Copier les données de ventes dans une table Amazon DynamoDB avec des index secondaires globaux pour chaque rapport." }
    - id: d
      text: { en: "Load the sales data into Amazon DocumentDB and run the reports with aggregation pipelines.", fr: "Charger les données de ventes dans Amazon DocumentDB et exécuter les rapports avec des pipelines d'agrégation." }
answer: { optionId: b }
explanation:
  correct:
    en: Redshift is a fully managed, petabyte-scale data warehouse that BI tools query with SQL. Redshift Serverless provisions and scales capacity automatically and does not charge when the warehouse is idle, and the analytics run apart from the production database.
    fr: Redshift est un entrepôt de données entièrement géré à l'échelle du pétaoctet que les outils BI interrogent en SQL. Redshift Serverless provisionne et fait évoluer la capacité automatiquement et ne facture rien lorsque l'entrepôt est inactif, et l'analytique s'exécute à l'écart de la base de production.
  options:
    a:
      en: An Aurora cluster volume grows to at most 256 TiB, below 300 TB, and an OLTP engine with instances to size is not designed for warehouse-scale analytics.
      fr: Un volume de cluster Aurora atteint au plus 256 Tio, moins que 300 To, et un moteur OLTP dont les instances doivent être dimensionnées n'est pas conçu pour une analytique à l'échelle d'un entrepôt.
    c:
      en: DynamoDB is built for known key-based access patterns, not complex ad hoc analytical SQL from BI tools.
      fr: DynamoDB est conçu pour des modèles d'accès connus fondés sur des clés, pas pour des requêtes SQL analytiques ad hoc complexes depuis des outils BI.
    d:
      en: DocumentDB is an operational document database with instances to manage; it is not a SQL data warehouse for BI tools.
      fr: DocumentDB est une base de documents opérationnelle dont les instances doivent être gérées ; ce n'est pas un entrepôt de données SQL pour les outils BI.
references:
  - title: What is Amazon Redshift?
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html
