id: saac03-3b-gwlb-appliances
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's security team requires all traffic entering an application VPC to be inspected by a fleet of third-party firewall appliances that run on Amazon EC2. The appliance fleet must scale horizontally, each flow must stay on the same appliance, and the inspection must be transparent to the application servers.

    Which solution will meet these requirements?
  fr: |
    L'équipe de sécurité d'une entreprise exige que tout le trafic entrant dans un VPC d'application soit inspecté par une flotte d'appliances de pare-feu tierces qui s'exécutent sur Amazon EC2. La flotte d'appliances doit évoluer horizontalement, chaque flux doit rester sur la même appliance, et l'inspection doit être transparente pour les serveurs d'applications.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Place a Network Load Balancer in front of the appliances and point the application clients to its DNS name.", fr: "Placer un Network Load Balancer devant les appliances et diriger les clients de l'application vers son nom DNS." }
    - id: b
      text: { en: "Associate an AWS WAF web ACL with an Application Load Balancer in front of the application servers.", fr: "Associer une liste ACL web AWS WAF à un Application Load Balancer placé devant les serveurs d'applications." }
    - id: c
      text: { en: "Route traffic through a NAT gateway and use security group rules on the appliances to filter it.", fr: "Faire passer le trafic par une passerelle NAT et filtrer avec des règles de groupe de sécurité sur les appliances." }
    - id: d
      text: { en: "Register the appliances with a Gateway Load Balancer and route traffic through Gateway Load Balancer endpoints.", fr: "Enregistrer les appliances auprès d'un Gateway Load Balancer et faire passer le trafic par des points de terminaison Gateway Load Balancer." }
answer: { optionId: d }
explanation:
  correct:
    en: A Gateway Load Balancer works at layer 3, listens for all IP packets and distributes them to virtual appliances such as firewalls by using GENEVE on port 6081. It keeps each flow on the same appliance, and Gateway Load Balancer endpoints in route tables insert the inspection transparently into the traffic path.
    fr: Un Gateway Load Balancer fonctionne en couche 3, écoute tous les paquets IP et les distribue vers des appliances virtuelles comme des pare-feu à l'aide de GENEVE sur le port 6081. Il maintient chaque flux sur la même appliance, et des points de terminaison Gateway Load Balancer dans les tables de routage insèrent l'inspection de façon transparente dans le chemin du trafic.
  options:
    a:
      en: Clients would have to send traffic to the NLB's address, so the inspection is not transparent, and the appliances would then need to forward traffic themselves.
      fr: Les clients devraient envoyer le trafic vers l'adresse du NLB ; l'inspection n'est donc pas transparente, et les appliances devraient ensuite transmettre elles-mêmes le trafic.
    b:
      en: AWS WAF filters HTTP requests with its own rules; it does not send traffic through the required third-party appliances.
      fr: AWS WAF filtre les requêtes HTTP avec ses propres règles ; il ne fait pas passer le trafic par les appliances tierces exigées.
    c:
      en: A NAT gateway handles outbound address translation and does not distribute inbound traffic across an appliance fleet.
      fr: Une passerelle NAT gère la traduction d'adresses sortante et ne distribue pas le trafic entrant sur une flotte d'appliances.
references:
  - title: What is a Gateway Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
