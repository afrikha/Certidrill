id: saac03-3b-rds-io2-iops
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A financial services company runs an OLTP workload on Amazon RDS for PostgreSQL with 2 TiB of storage. Load testing shows that the database needs a sustained 100,000 IOPS with consistent sub-millisecond I/O latency. The DB instance class is already large enough.

    Which storage configuration will meet these requirements?
  fr: |
    Une entreprise de services financiers exécute une charge de travail OLTP sur Amazon RDS for PostgreSQL avec 2 Tio de stockage. Les tests de charge montrent que la base de données a besoin de 100 000 IOPS soutenues avec une latence d'E/S constamment inférieure à la milliseconde. La classe d'instance de base de données est déjà assez grande.

    Quelle configuration de stockage répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "General Purpose SSD (gp3) storage with 100,000 provisioned IOPS", fr: "Stockage SSD à usage général (gp3) avec 100 000 IOPS provisionnées" }
    - id: b
      text: { en: "General Purpose SSD (gp2) storage enlarged until its baseline reaches 100,000 IOPS", fr: "Stockage SSD à usage général (gp2) agrandi jusqu'à ce que sa performance de base atteigne 100 000 IOPS" }
    - id: c
      text: { en: "General Purpose SSD (gp3) storage at its 12,000 IOPS baseline, with a memory-optimized instance class", fr: "Stockage SSD à usage général (gp3) à sa performance de base de 12 000 IOPS, avec une classe d'instance à mémoire optimisée" }
    - id: d
      text: { en: "Provisioned IOPS SSD (io2 Block Express) storage with 100,000 provisioned IOPS", fr: "Stockage SSD IOPS provisionnées (io2 Block Express) avec 100 000 IOPS provisionnées" }
answer: { optionId: d }
explanation:
  correct:
    en: io2 Block Express supports up to 256,000 IOPS on RDS with sub-millisecond average latency on Nitro-based instances, and is recommended for business-critical transactional workloads. 100,000 IOPS on 2 TiB is well within its IOPS-to-storage ratio.
    fr: io2 Block Express prend en charge jusqu'à 256 000 IOPS sur RDS, avec une latence moyenne inférieure à la milliseconde sur les instances basées sur Nitro, et il est recommandé pour les charges transactionnelles critiques. 100 000 IOPS sur 2 Tio restent largement dans son ratio IOPS/stockage.
  options:
    a:
      en: For RDS for PostgreSQL, gp3 storage can be provisioned up to 64,000 IOPS, which is below the requirement.
      fr: Pour RDS for PostgreSQL, le stockage gp3 peut être provisionné jusqu'à 64 000 IOPS, ce qui est inférieur à l'exigence.
    b:
      en: gp2 is a previous-generation type limited to 64,000 IOPS on RDS, so no volume size reaches 100,000 IOPS.
      fr: gp2 est un type de génération précédente limité à 64 000 IOPS sur RDS ; aucune taille de volume n'atteint donc 100 000 IOPS.
    c:
      en: A larger instance class does not raise storage IOPS; 12,000 IOPS is far below the measured need.
      fr: Une classe d'instance plus grande n'augmente pas les IOPS du stockage ; 12 000 IOPS restent très en dessous du besoin mesuré.
references:
  - title: Amazon RDS DB instance storage
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Storage.html
