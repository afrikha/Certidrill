id: saac03-3b-alb-path-routing
objective: "3.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is splitting a monolithic web application into microservices that run on Amazon ECS. Requests to /api/* must go to the API service, and requests to /images/* must go to the image service. Clients must keep using a single HTTPS endpoint.

    Which solution will meet these requirements?
  fr: |
    Une entreprise découpe une application web monolithique en microservices qui s'exécutent sur Amazon ECS. Les requêtes vers /api/* doivent aller au service d'API, et les requêtes vers /images/* au service d'images. Les clients doivent continuer à utiliser un seul point de terminaison HTTPS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A Network Load Balancer with a TLS listener for each service on a different port", fr: "Un Network Load Balancer avec un écouteur TLS pour chaque service sur un port différent" }
    - id: b
      text: { en: "Amazon Route 53 weighted records that send a share of the traffic to each service", fr: "Des enregistrements Amazon Route 53 pondérés qui envoient une part du trafic à chaque service" }
    - id: c
      text: { en: "An Application Load Balancer with an HTTPS listener and rules that match path patterns", fr: "Un Application Load Balancer avec un écouteur HTTPS et des règles qui correspondent à des modèles de chemin" }
    - id: d
      text: { en: "A Gateway Load Balancer with a target group for each service", fr: "Un Gateway Load Balancer avec un groupe cible pour chaque service" }
answer: { optionId: c }
explanation:
  correct:
    en: An Application Load Balancer works at layer 7 and evaluates listener rules in priority order. Path conditions forward /api/* and /images/* to different target groups behind one HTTPS listener and one DNS name.
    fr: Un Application Load Balancer fonctionne en couche 7 et évalue les règles d'écouteur par ordre de priorité. Des conditions de chemin transmettent /api/* et /images/* à des groupes cibles différents derrière un seul écouteur HTTPS et un seul nom DNS.
  options:
    a:
      en: A Network Load Balancer works at layer 4 and cannot inspect URL paths; separate ports would also change the endpoint clients use.
      fr: Un Network Load Balancer fonctionne en couche 4 et ne peut pas examiner les chemins d'URL ; des ports distincts modifieraient aussi le point de terminaison utilisé par les clients.
    b:
      en: DNS routing works on host names, not URL paths, so weighted records would send requests to a service regardless of the path.
      fr: Le routage DNS porte sur les noms d'hôte, pas sur les chemins d'URL ; des enregistrements pondérés enverraient donc les requêtes à un service quel que soit le chemin.
    d:
      en: A Gateway Load Balancer distributes IP traffic to virtual appliances such as firewalls; it does not route HTTP requests by path.
      fr: Un Gateway Load Balancer distribue le trafic IP vers des appliances virtuelles comme des pare-feu ; il n'achemine pas les requêtes HTTP selon le chemin.
references:
  - title: What is an Application Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
