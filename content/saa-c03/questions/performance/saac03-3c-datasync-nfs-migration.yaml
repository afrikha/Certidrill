id: saac03-3c-datasync-nfs-migration
objective: "3.5.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company must migrate 80 TB of data from an on-premises NFS file server to Amazon EFS over its existing AWS Direct Connect connection. Users keep changing files until the cutover, so the company must run incremental transfers until then and must verify the integrity of the transferred data.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise doit migrer 80 To de données d'un serveur de fichiers NFS sur site vers Amazon EFS via sa connexion AWS Direct Connect existante. Les utilisateurs continuent de modifier les fichiers jusqu'à la bascule : l'entreprise doit donc exécuter des transferts incrémentiels jusque-là et vérifier l'intégrité des données transférées.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Mount the NFS share on EC2 instances and run rsync scripts from cron jobs, then compare checksums with a script.", fr: "Monter le partage NFS sur des instances EC2 et exécuter des scripts rsync via des tâches cron, puis comparer les sommes de contrôle avec un script." } }
    - { id: b, text: { en: "Deploy an AWS DataSync agent on premises and create a scheduled task from the NFS location to the EFS location.", fr: "Déployer un agent AWS DataSync sur site et créer une tâche planifiée de l'emplacement NFS vers l'emplacement EFS." } }
    - { id: c, text: { en: "Create an AWS Transfer Family SFTP server backed by EFS and have users upload their files with SFTP clients.", fr: "Créer un serveur SFTP AWS Transfer Family adossé à EFS et faire charger les fichiers par les utilisateurs avec des clients SFTP." } }
    - { id: d, text: { en: "Deploy Amazon S3 File Gateway, copy the files to its share, and then copy the objects from S3 to EFS.", fr: "Déployer Amazon S3 File Gateway, copier les fichiers sur son partage, puis copier les objets de S3 vers EFS." } }
answer: { optionId: b }
explanation:
  correct:
    en: AWS DataSync transfers data from NFS, SMB, HDFS or object storage to AWS storage services including Amazon EFS. Scheduled task executions copy only what changed, DataSync validates data integrity and encrypts data in transit, and it can use the Direct Connect connection through a VPC endpoint.
    fr: "AWS DataSync transfère des données depuis NFS, SMB, HDFS ou un stockage objet vers les services de stockage AWS, dont Amazon EFS. Les exécutions planifiées de la tâche ne copient que ce qui a changé, DataSync valide l'intégrité des données et les chiffre en transit, et il peut utiliser la connexion Direct Connect via un point de terminaison de VPC."
  options:
    a: { en: "Scripts, cron jobs and custom checksum comparisons are code and servers to build and operate.", fr: "Des scripts, des tâches cron et des comparaisons de sommes de contrôle maison représentent du code et des serveurs à créer et à exploiter." }
    c: { en: "Manual uploads by users are neither incremental nor automated, and they add work for every user.", fr: "Des chargements manuels par les utilisateurs ne sont ni incrémentiels ni automatisés, et ils ajoutent du travail pour chaque utilisateur." }
    d: { en: "Going through S3 adds a second copy step to EFS that the company would have to build and manage.", fr: "Passer par S3 ajoute une seconde étape de copie vers EFS que l'entreprise devrait créer et gérer." }
references:
  - title: What is AWS DataSync?
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
