id: saac03-3a-sns-sqs-fanout
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce application emits an event each time an order is placed. Three independent services (billing, shipping and analytics) must each process every order event at their own pace. If one service is unavailable for several hours, its events must be kept until it recovers, without affecting the other services.

    Which solution will meet these requirements?
  fr: |
    Une application de commerce électronique émet un événement à chaque commande passée. Trois services indépendants (facturation, expédition et analytique) doivent chacun traiter chaque événement de commande à leur propre rythme. Si un service est indisponible pendant plusieurs heures, ses événements doivent être conservés jusqu'à son rétablissement, sans affecter les autres services.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send the events to one Amazon SQS standard queue that all three services poll.", fr: "Envoyer les événements à une seule file d'attente Amazon SQS standard interrogée par les trois services." }
    - id: b
      text: { en: "Publish the events to an Amazon SNS topic with an HTTPS subscription for each service.", fr: "Publier les événements dans une rubrique Amazon SNS avec un abonnement HTTPS pour chaque service." }
    - id: c
      text: { en: "Send the events to one Amazon SQS FIFO queue with a different message group ID for each service.", fr: "Envoyer les événements à une seule file d'attente Amazon SQS FIFO avec un ID de groupe de messages différent par service." }
    - id: d
      text: { en: "Publish the events to an Amazon SNS topic and subscribe a separate Amazon SQS queue for each service.", fr: "Publier les événements dans une rubrique Amazon SNS et abonner une file d'attente Amazon SQS distincte pour chaque service." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      In the SNS-to-SQS fanout pattern, one publish to the topic delivers a copy of the message to every subscribed queue. Each service polls its own queue at its own pace, and the queue stores messages while the service is down, so one consumer's outage does not affect the others.
    fr: |-
      Dans le modèle de diffusion (fanout) SNS vers SQS, une seule publication dans la rubrique remet une copie du message à chaque file d'attente abonnée. Chaque service interroge sa propre file à son rythme, et la file conserve les messages pendant l'indisponibilité du service : la panne d'un consommateur n'affecte pas les autres.
  options:
    a:
      en: |-
        With a single queue, each message is processed by only one consumer and then deleted, so the services would compete for messages instead of each getting every event.
      fr: |-
        Avec une seule file d'attente, chaque message n'est traité que par un consommateur puis supprimé : les services se disputeraient les messages au lieu de recevoir chacun tous les événements.
    b:
      en: |-
        SNS pushes each event to the HTTPS endpoint and relies on delivery retries rather than a durable per-service buffer, so a service cannot pull its events at its own pace after a long outage.
      fr: |-
        SNS pousse chaque événement vers le point de terminaison HTTPS et s'appuie sur de nouvelles tentatives de remise plutôt que sur une mémoire tampon durable par service : un service ne peut pas récupérer ses événements à son rythme après une longue panne.
    c:
      en: |-
        Message groups order messages inside one queue; each message still belongs to one group and is consumed once, so the three services would not each receive every event.
      fr: |-
        Les groupes de messages ordonnent les messages au sein d'une file ; chaque message appartient toujours à un seul groupe et n'est consommé qu'une fois : les trois services ne recevraient pas chacun tous les événements.
references:
  - title: Fanout Amazon SNS notifications to Amazon SQS queues for asynchronous processing - Amazon Simple Notification Service
    url: https://docs.aws.amazon.com/sns/latest/dg/sns-sqs-as-subscriber.html
