id: saac03-3c-sqs-large-payload
objective: "3.5.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's ingestion pipeline sends job messages through an Amazon SQS standard queue to a fleet of Java workers. A new requirement adds a document of up to 50 MB to each job. The company wants to keep using SQS and make the fewest possible changes to the producers and workers.

    Which solution will meet these requirements?
  fr: |
    Le pipeline d'ingestion d'une entreprise envoie des messages de tâche via une file d'attente standard Amazon SQS à une flotte de workers Java. Une nouvelle exigence ajoute à chaque tâche un document pouvant atteindre 50 Mo. L'entreprise souhaite continuer à utiliser SQS et apporter le moins de modifications possible aux producteurs et aux workers.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Set the maximum message size attribute of the queue to 50 MB.", fr: "Définir l'attribut de taille maximale des messages de la file d'attente sur 50 Mo." } }
    - { id: b, text: { en: "Replace the queue with an SQS FIFO queue, which accepts larger messages.", fr: "Remplacer la file d'attente par une file d'attente SQS FIFO, qui accepte des messages plus volumineux." } }
    - { id: c, text: { en: "Send each document as an Amazon SNS message to a topic that the workers subscribe to.", fr: "Envoyer chaque document comme message Amazon SNS vers une rubrique à laquelle les workers sont abonnés." } }
    - { id: d, text: { en: "Use the Amazon SQS Extended Client Library for Java to store each document in Amazon S3 and send a reference in the message.", fr: "Utiliser l'Amazon SQS Extended Client Library for Java pour stocker chaque document dans Amazon S3 et envoyer une référence dans le message." } }
answer: { optionId: d }
explanation:
  correct:
    en: The maximum SQS message size is 1 MiB. The Amazon SQS Extended Client Library for Java stores the payload in Amazon S3 and sends a message that contains a reference to it, for payloads up to 2 GB, so producers and workers keep the SQS programming model.
    fr: "La taille maximale d'un message SQS est de 1 Mio. L'Amazon SQS Extended Client Library for Java stocke la charge utile dans Amazon S3 et envoie un message qui contient une référence vers celle-ci, pour des charges utiles jusqu'à 2 Go : producteurs et workers conservent le modèle de programmation SQS."
  options:
    a: { en: "The message size attribute cannot exceed the 1 MiB quota.", fr: "L'attribut de taille des messages ne peut pas dépasser le quota de 1 Mio." }
    b: { en: "FIFO queues have the same maximum message size as standard queues.", fr: "Les files d'attente FIFO ont la même taille maximale de message que les files standard." }
    c: { en: "Replacing SQS with SNS changes the architecture, and SNS messages are also far below 50 MB.", fr: "Remplacer SQS par SNS change l'architecture, et les messages SNS sont eux aussi bien en dessous de 50 Mo." }
references:
  - title: Amazon SQS message quotas
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/quotas-messages.html
