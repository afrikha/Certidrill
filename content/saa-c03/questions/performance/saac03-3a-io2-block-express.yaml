id: saac03-3a-io2-block-express
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is moving a critical OLTP database to a single Amazon EC2 instance built on the Nitro System. The database vendor requires one block storage volume that sustains 150,000 IOPS with consistent sub-millisecond latency. The data must survive instance stops and failures, and the company wants the highest durability that Amazon EBS offers.

    Which storage configuration will meet these requirements?
  fr: |
    Une entreprise déplace une base de données OLTP critique vers une seule instance Amazon EC2 basée sur le système Nitro. L'éditeur de la base de données exige un seul volume de stockage en mode bloc qui soutient 150 000 IOPS avec une latence constante inférieure à la milliseconde. Les données doivent survivre aux arrêts et aux pannes de l'instance, et l'entreprise souhaite la durabilité la plus élevée offerte par Amazon EBS.

    Quelle configuration de stockage répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "One Amazon EBS gp3 volume provisioned with its maximum IOPS", fr: "Un volume Amazon EBS gp3 provisionné avec son maximum d'IOPS" }
    - id: b
      text: { en: "One NVMe instance store volume on a storage optimized instance", fr: "Un volume de stockage d'instance NVMe sur une instance optimisée pour le stockage" }
    - id: c
      text: { en: "One Amazon EBS io1 volume provisioned with its maximum IOPS", fr: "Un volume Amazon EBS io1 provisionné avec son maximum d'IOPS" }
    - id: d
      text: { en: "One Amazon EBS io2 Block Express volume provisioned with 150,000 IOPS", fr: "Un volume Amazon EBS io2 Block Express provisionné avec 150 000 IOPS" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      io2 Block Express supports up to 256,000 IOPS per volume with consistent sub-millisecond latency and is designed for 99.999% durability, the highest of the EBS volume types. It is persistent block storage, so the data survives instance stops and failures.
    fr: |-
      io2 Block Express prend en charge jusqu'à 256 000 IOPS par volume avec une latence constante inférieure à la milliseconde et est conçu pour une durabilité de 99,999 %, la plus élevée des types de volumes EBS. C'est un stockage en mode bloc persistant : les données survivent aux arrêts et aux pannes de l'instance.
  options:
    a:
      en: |-
        A gp3 volume tops out at 80,000 IOPS and is designed for 99.8%–99.9% durability, so it misses both the IOPS and the durability requirements.
      fr: |-
        Un volume gp3 plafonne à 80 000 IOPS et est conçu pour une durabilité de 99,8 % à 99,9 % : il ne répond ni à l'exigence d'IOPS ni à celle de durabilité.
    b:
      en: |-
        Instance store data is lost when the instance stops or its disk fails, so it does not meet the persistence requirement.
      fr: |-
        Les données du stockage d'instance sont perdues à l'arrêt de l'instance ou en cas de panne de son disque : cela ne répond pas à l'exigence de persistance.
    c:
      en: |-
        An io1 volume supports at most 64,000 IOPS and has 99.8%–99.9% durability.
      fr: |-
        Un volume io1 prend en charge au maximum 64 000 IOPS, avec une durabilité de 99,8 % à 99,9 %.
references:
  - title: Amazon EBS volume types - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
