id: saac03-3a-asg-warm-pool
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances in an Auto Scaling group. Each new instance takes about 15 minutes to boot because it writes a large reference dataset to its Amazon EBS root volume, so scale-out events cause high latency. The company does not want to keep extra instances running all the time and wants to keep costs as low as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 dans un groupe Auto Scaling. Chaque nouvelle instance met environ 15 minutes à démarrer, car elle écrit un volumineux jeu de données de référence sur son volume racine Amazon EBS : les événements d'augmentation de capacité provoquent donc une latence élevée. L'entreprise ne veut pas maintenir en permanence des instances supplémentaires en cours d'exécution et souhaite des coûts aussi bas que possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a warm pool to the Auto Scaling group with instances kept in the Running state.", fr: "Ajouter au groupe Auto Scaling un groupe d'instances pré-initialisées (warm pool) dont les instances restent à l'état Running." }
    - id: b
      text: { en: "Increase the minimum capacity of the Auto Scaling group to cover the peak load.", fr: "Augmenter la capacité minimale du groupe Auto Scaling pour couvrir la charge de pointe." }
    - id: c
      text: { en: "Add a warm pool to the Auto Scaling group with instances kept in the Stopped state.", fr: "Ajouter au groupe Auto Scaling un groupe d'instances pré-initialisées (warm pool) dont les instances restent à l'état Stopped." }
    - id: d
      text: { en: "Add a launch lifecycle hook that keeps new instances in the Pending:Wait state until initialization finishes.", fr: "Ajouter un hook de cycle de vie au lancement qui maintient les nouvelles instances à l'état Pending:Wait jusqu'à la fin de l'initialisation." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A warm pool holds pre-initialized instances next to the Auto Scaling group, so scale-out uses instances that have already done their long first boot. In the Stopped state, the lowest-cost option, the company pays only for the EBS volumes and any attached Elastic IP addresses, not for instance hours.
    fr: |-
      Un groupe d'instances pré-initialisées (warm pool) conserve, à côté du groupe Auto Scaling, des instances déjà initialisées : l'augmentation de capacité utilise des instances qui ont déjà effectué leur long premier démarrage. À l'état Stopped, l'option la moins coûteuse, l'entreprise ne paie que les volumes EBS et les éventuelles adresses IP Elastic attachées, pas les heures d'instance.
  options:
    a:
      en: |-
        Warm pool instances in the Running state are billed as full running instances, which AWS strongly discourages for cost reasons.
      fr: |-
        Les instances d'un warm pool à l'état Running sont facturées comme des instances en cours d'exécution, ce qu'AWS déconseille fortement pour des raisons de coût.
    b:
      en: |-
        A higher minimum keeps extra instances running all the time, which the company wants to avoid.
      fr: |-
        Un minimum plus élevé maintient en permanence des instances supplémentaires en cours d'exécution, ce que l'entreprise veut éviter.
    d:
      en: |-
        A lifecycle hook makes sure instances are ready before they receive traffic, but it does not shorten the 15-minute boot, so latency during scale-out remains.
      fr: |-
        Un hook de cycle de vie garantit que les instances sont prêtes avant de recevoir du trafic, mais ne raccourcit pas le démarrage de 15 minutes : la latence lors de l'augmentation de capacité demeure.
references:
  - title: Decrease latency for applications with long boot times using warm pools - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-warm-pools.html
