id: saac03-3c-ga-alb-static-multiregion
objective: "3.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an HTTPS application behind Application Load Balancers (ALBs) in us-east-1 and eu-west-1. The ALBs use path-based routing rules. Corporate customers allow outbound traffic only to a short list of IP addresses in their firewalls. The company needs IP addresses that never change, must send each user to the nearest healthy Region, and must fail over automatically if a Region becomes unhealthy.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application HTTPS derrière des Application Load Balancers (ALB) dans us-east-1 et eu-west-1. Les ALB utilisent des règles de routage basées sur le chemin. Les entreprises clientes n'autorisent le trafic sortant que vers une courte liste d'adresses IP dans leurs pare-feu. L'entreprise a besoin d'adresses IP qui ne changent jamais, doit diriger chaque utilisateur vers la Région saine la plus proche et doit basculer automatiquement si une Région devient défaillante.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a Network Load Balancer with Elastic IP addresses in us-east-1, register the us-east-1 ALB as its target, and give customers those addresses.", fr: "Créer un Network Load Balancer avec des adresses IP Elastic dans us-east-1, y enregistrer l'ALB de us-east-1 comme cible et communiquer ces adresses aux clients." } }
    - { id: b, text: { en: "Create an AWS Global Accelerator custom routing accelerator and add both ALBs as its endpoints.", fr: "Créer un accélérateur de routage personnalisé (custom routing) AWS Global Accelerator et y ajouter les deux ALB comme points de terminaison." } }
    - { id: c, text: { en: "Create Amazon Route 53 latency-based alias records with health checks for both ALBs and give customers the current ALB IP addresses.", fr: "Créer des enregistrements d'alias Amazon Route 53 à routage basé sur la latence avec vérifications de l'état pour les deux ALB et communiquer aux clients les adresses IP actuelles des ALB." } }
    - { id: d, text: { en: "Create an AWS Global Accelerator standard accelerator with one endpoint group per Region that contains that Region's ALB.", fr: "Créer un accélérateur standard AWS Global Accelerator avec un groupe de points de terminaison par Région contenant l'ALB de cette Région." } }
answer: { optionId: d }
explanation:
  correct:
    en: A standard accelerator provides two static anycast IPv4 addresses that stay assigned for the life of the accelerator. It accepts ALBs as endpoints in several Regions, routes users over the AWS global network to the nearest healthy endpoint and reacts to health changes. The ALBs keep their path-based routing rules behind the accelerator.
    fr: "Un accélérateur standard fournit deux adresses IPv4 anycast statiques qui restent attribuées pendant toute la vie de l'accélérateur. Il accepte des ALB comme points de terminaison dans plusieurs Régions, achemine les utilisateurs via le réseau mondial AWS vers le point de terminaison sain le plus proche et réagit aux changements d'état. Les ALB conservent leurs règles de routage basées sur le chemin derrière l'accélérateur."
  options:
    a: { en: "The Elastic IP addresses are static, but all traffic goes to us-east-1: there is no routing to the nearest Region and no failover to eu-west-1.", fr: "Les adresses IP Elastic sont statiques, mais tout le trafic va vers us-east-1 : pas de routage vers la Région la plus proche ni de basculement vers eu-west-1." }
    b: { en: "Custom routing accelerators support only VPC subnet endpoints; ALBs are endpoints of standard accelerators.", fr: "Les accélérateurs de routage personnalisé ne prennent en charge que des points de terminaison de type sous-réseau VPC ; les ALB sont des points de terminaison d'accélérateurs standard." }
    c: { en: "Route 53 handles latency and failover, but ALB IP addresses change over time, so customer firewall rules would break.", fr: "Route 53 gère la latence et le basculement, mais les adresses IP des ALB changent au fil du temps : les règles des pare-feu clients cesseraient de fonctionner." }
references:
  - title: What is AWS Global Accelerator?
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
