id: saac03-3c-dms-cdc-minimal-downtime
objective: "3.5.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must migrate a 3 TB on-premises MySQL database to Amazon Aurora MySQL. The database must stay in use by the application during the migration, and the application can tolerate only a few minutes of downtime at cutover. Binary logging in row format is enabled on the source.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit migrer une base de données MySQL sur site de 3 To vers Amazon Aurora MySQL. La base doit rester utilisée par l'application pendant la migration, et l'application ne tolère que quelques minutes d'interruption lors de la bascule. La journalisation binaire au format ligne est activée sur la source.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Export the database with mysqldump, upload the dump to Amazon S3, and import it into Aurora during a maintenance window.", fr: "Exporter la base avec mysqldump, charger le fichier dans Amazon S3 et l'importer dans Aurora pendant une fenêtre de maintenance." } }
    - { id: b, text: { en: "Create an AWS DMS task of type full load plus change data capture (CDC) and cut over when the replication lag is close to zero.", fr: "Créer une tâche AWS DMS de type chargement complet plus capture des données modifiées (CDC) et basculer lorsque le retard de réplication est proche de zéro." } }
    - { id: c, text: { en: "Copy the MySQL data files to Amazon S3 with AWS DataSync and restore an Aurora cluster from the files.", fr: "Copier les fichiers de données MySQL dans Amazon S3 avec AWS DataSync et restaurer un cluster Aurora à partir de ces fichiers." } }
    - { id: d, text: { en: "Create an AWS DMS task of type full load only and run it every night until the cutover date.", fr: "Créer une tâche AWS DMS de type chargement complet uniquement et l'exécuter chaque nuit jusqu'à la date de bascule." } }
answer: { optionId: b }
explanation:
  correct:
    en: A full load plus CDC task migrates the existing data and then applies the changes that it reads from the MySQL binary logs, so the target stays synchronized while the application keeps using the source. When the lag is minimal, the application is switched to Aurora with only a short interruption.
    fr: "Une tâche de chargement complet plus CDC migre les données existantes, puis applique les modifications qu'elle lit dans les journaux binaires MySQL : la cible reste synchronisée pendant que l'application continue d'utiliser la source. Lorsque le retard est minimal, l'application bascule vers Aurora avec une courte interruption."
  options:
    a: { en: "Changes made after the dump are lost unless the database is stopped, so a 3 TB dump and import means hours of downtime.", fr: "Les modifications postérieures à l'export sont perdues sauf si la base est arrêtée : un export et un import de 3 To imposent des heures d'interruption." }
    c: { en: "Copying the files of a running database gives an inconsistent copy, and changes made after the copy are not replicated.", fr: "Copier les fichiers d'une base en cours d'exécution donne une copie incohérente, et les modifications postérieures à la copie ne sont pas répliquées." }
    d: { en: "A full load task does not capture ongoing changes; the final load would still require a long downtime.", fr: "Une tâche de chargement complet ne capture pas les modifications en continu ; le chargement final exigerait toujours une longue interruption." }
references:
  - title: Creating tasks for ongoing replication using AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html
