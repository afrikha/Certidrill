id: saac03-3b-az-id-cross-account
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has two AWS accounts in the same AWS Region. Account A runs a latency-sensitive database in a subnet that the console of account A shows in Availability Zone us-east-1a. Account B must deploy application servers in the same physical Availability Zone as the database to minimize latency and avoid cross-AZ data transfer. An engineer plans to use us-east-1a in account B as well.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède deux comptes AWS dans la même Région AWS. Le compte A exécute une base de données sensible à la latence dans un sous-réseau que la console du compte A affiche dans la zone de disponibilité us-east-1a. Le compte B doit déployer des serveurs d'applications dans la même zone de disponibilité physique que la base de données pour réduire la latence au minimum et éviter les transferts de données entre zones de disponibilité. Un ingénieur prévoit d'utiliser également us-east-1a dans le compte B.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use us-east-1a in account B, because Availability Zone names map to the same physical location in every account of an organization.", fr: "Utiliser us-east-1a dans le compte B, car les noms de zones de disponibilité correspondent au même emplacement physique dans tous les comptes d'une organisation." }
    - id: b
      text: { en: "Launch the servers of account B in a spread placement group so that AWS places them next to the database of account A.", fr: "Lancer les serveurs du compte B dans un groupe de placement par répartition afin qu'AWS les place à côté de la base de données du compte A." }
    - id: c
      text: { en: "Look up the AZ ID of the database subnet in account A and deploy in the subnet of account B that has the same AZ ID.", fr: "Rechercher l'ID de zone de disponibilité (AZ ID) du sous-réseau de la base de données dans le compte A et déployer dans le sous-réseau du compte B qui a le même AZ ID." }
    - id: d
      text: { en: "Use the AWS Health Dashboard of account B to display the physical data center behind each Availability Zone name.", fr: "Utiliser AWS Health Dashboard du compte B pour afficher le centre de données physique associé à chaque nom de zone de disponibilité." }
answer: { optionId: c }
explanation:
  correct:
    en: AWS maps Availability Zone names to physical zones randomly for each account, so us-east-1a in one account can be a different location than us-east-1a in another. An AZ ID such as use1-az1 identifies the same physical zone in every account, so matching AZ IDs puts both workloads in the same zone.
    fr: AWS associe aléatoirement les noms de zones de disponibilité aux zones physiques pour chaque compte ; us-east-1a dans un compte peut donc être un autre emplacement que us-east-1a dans un autre compte. Un AZ ID tel que use1-az1 désigne la même zone physique dans tous les comptes ; faire correspondre les AZ ID place donc les deux charges de travail dans la même zone.
  options:
    a:
      en: Availability Zone names are mapped independently for each account, even inside an organization; the same name can point to different physical zones.
      fr: Les noms de zones de disponibilité sont associés indépendamment pour chaque compte, même au sein d'une organisation ; un même nom peut désigner des zones physiques différentes.
    b:
      en: A spread placement group spreads the account's own instances across distinct hardware; it cannot place them next to resources of another account.
      fr: Un groupe de placement par répartition répartit les instances du compte sur du matériel distinct ; il ne peut pas les placer à côté des ressources d'un autre compte.
    d:
      en: The AWS Health Dashboard reports service events and scheduled changes; it does not show physical data centers. The AZ ID is the supported way to identify a zone across accounts.
      fr: AWS Health Dashboard signale les événements de service et les modifications planifiées ; il n'affiche pas de centres de données physiques. L'AZ ID est le moyen prévu pour identifier une zone entre comptes.
references:
  - title: Availability Zone IDs for your AWS resources
    url: https://docs.aws.amazon.com/ram/latest/userguide/working-with-az-ids.html
