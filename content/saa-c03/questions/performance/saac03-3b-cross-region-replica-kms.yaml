id: saac03-3b-cross-region-replica-kms
objective: "3.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance in us-east-1. The DB instance is encrypted with an AWS KMS key in us-east-1, and automated backups are turned off. The company needs an encrypted read replica in eu-west-1 to serve reports for European users.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL dans us-east-1. L'instance est chiffrée avec une clé AWS KMS de us-east-1, et les sauvegardes automatisées sont désactivées. L'entreprise a besoin d'un réplica en lecture chiffré dans eu-west-1 pour servir des rapports aux utilisateurs européens.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Turn on automated backups for the source DB instance.", fr: "Activer les sauvegardes automatisées pour l'instance source." } }
    - { id: b, text: { en: "Decrypt the source DB instance before creating the replica.", fr: "Déchiffrer l'instance source avant de créer le réplica." } }
    - { id: c, text: { en: "Specify the us-east-1 KMS key ARN for the replica.", fr: "Spécifier l'ARN de la clé KMS de us-east-1 pour le réplica." } }
    - { id: d, text: { en: "Turn on Multi-AZ for the source DB instance.", fr: "Activer Multi-AZ pour l'instance source." } }
    - { id: e, text: { en: "Specify a KMS key in eu-west-1 for the replica.", fr: "Spécifier une clé KMS de eu-west-1 pour le réplica." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: RDS requires automated backups (a retention period other than 0) on the source before it can create a read replica. For an encrypted cross-Region replica, the source must be encrypted and the replica must use a KMS key in the destination Region.
    fr: RDS exige que les sauvegardes automatisées soient activées sur la source (période de rétention différente de 0) avant de pouvoir créer un réplica en lecture. Pour un réplica chiffré entre Régions, la source doit être chiffrée et le réplica doit utiliser une clé KMS de la Région de destination.
  options:
    b:
      en: An encrypted source is required for an encrypted cross-Region replica; decrypting it would defeat the requirement, and RDS cannot simply decrypt an existing instance.
      fr: Une source chiffrée est nécessaire pour un réplica chiffré entre Régions ; la déchiffrer irait à l'encontre de l'exigence, et RDS ne peut pas simplement déchiffrer une instance existante.
    c:
      en: KMS keys are Regional; the replica in eu-west-1 must be encrypted with a key that exists in eu-west-1.
      fr: Les clés KMS sont régionales ; le réplica de eu-west-1 doit être chiffré avec une clé qui existe dans eu-west-1.
    d:
      en: Multi-AZ improves the availability of the source but is not required to create a read replica.
      fr: Multi-AZ améliore la disponibilité de la source mais n'est pas nécessaire pour créer un réplica en lecture.
references:
  - title: Creating a read replica in a different AWS Region
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.XRgn.html
  - title: Creating a read replica
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.Create.html
