id: saac03-3b-rds-proxy-failover
objective: "3.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on Amazon EC2 instances that connects to an Amazon RDS for PostgreSQL Multi-AZ DB instance. During failovers, the application loses its connections, and some clients keep trying the old IP address until their DNS cache expires. The company wants the application to keep its connections during failovers without changing its connection-handling code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application sur des instances Amazon EC2 qui se connecte à une instance de base de données Amazon RDS for PostgreSQL Multi-AZ. Pendant les basculements, l'application perd ses connexions, et certains clients continuent d'essayer l'ancienne adresse IP jusqu'à l'expiration de leur cache DNS. L'entreprise veut que l'application conserve ses connexions pendant les basculements sans modifier son code de gestion des connexions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Put a Network Load Balancer in front of the DB instance with its IP address as the target.", fr: "Placer un Network Load Balancer devant l'instance de base de données avec son adresse IP comme cible." }
    - id: b
      text: { en: "Lower the DNS cache TTL in the application and add retry logic after each failover.", fr: "Réduire la TTL du cache DNS dans l'application et ajouter une logique de nouvelle tentative après chaque basculement." }
    - id: c
      text: { en: "Create an RDS read replica and promote it manually when the primary fails.", fr: "Créer un réplica en lecture RDS et le promouvoir manuellement lorsque l'instance principale tombe en panne." }
    - id: d
      text: { en: "Connect the application through an Amazon RDS Proxy endpoint instead of the DB instance endpoint.", fr: "Connecter l'application via un point de terminaison Amazon RDS Proxy au lieu du point de terminaison de l'instance de base de données." }
answer: { optionId: d }
explanation:
  correct:
    en: RDS Proxy sits between the application and the database and automatically connects to the standby DB instance during a failure while preserving the application's connections. The application connects to a stable proxy endpoint, so DNS changes of the DB instance no longer affect it.
    fr: RDS Proxy se place entre l'application et la base de données et se connecte automatiquement à l'instance de secours en cas de panne, tout en préservant les connexions de l'application. L'application se connecte à un point de terminaison de proxy stable ; les changements DNS de l'instance de base de données ne l'affectent donc plus.
  options:
    a:
      en: The NLB target would keep the old IP address after a failover, because the new primary has a different address, and connections would still drop.
      fr: La cible du NLB conserverait l'ancienne adresse IP après un basculement, car la nouvelle instance principale a une autre adresse, et les connexions seraient toujours coupées.
    b:
      en: This changes the connection-handling code, which the requirement forbids, and connections are still lost at each failover.
      fr: Cela modifie le code de gestion des connexions, ce que l'exigence interdit, et les connexions sont toujours perdues à chaque basculement.
    c:
      en: Manual promotion is slower than Multi-AZ failover and gives the database a new endpoint, so connections are lost and the application must be reconfigured.
      fr: Une promotion manuelle est plus lente qu'un basculement Multi-AZ et donne à la base un nouveau point de terminaison ; les connexions sont perdues et l'application doit être reconfigurée.
references:
  - title: Amazon RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
