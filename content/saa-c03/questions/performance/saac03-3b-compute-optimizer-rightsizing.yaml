id: saac03-3b-compute-optimizer-rightsizing
objective: "3.2.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs about 400 Amazon EC2 instances and 150 x86_64 AWS Lambda functions across several AWS accounts. Many instances were sized by guesswork, and the company suspects that some are overprovisioned while others are constrained. The company needs recommendations for instance types and Lambda memory sizes based on the actual utilization of each resource, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute environ 400 instances Amazon EC2 et 150 fonctions AWS Lambda x86_64 dans plusieurs comptes AWS. De nombreuses instances ont été dimensionnées au jugé, et l'entreprise soupçonne que certaines sont surdimensionnées tandis que d'autres sont limitées. L'entreprise a besoin de recommandations de types d'instance et de tailles de mémoire Lambda fondées sur l'utilisation réelle de chaque ressource, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Install the CloudWatch agent on every instance and build dashboards that engineers review each month to choose new sizes.", fr: "Installer l'agent CloudWatch sur chaque instance et créer des tableaux de bord que les ingénieurs examinent chaque mois pour choisir les nouvelles tailles." }
    - id: b
      text: { en: "Deploy AWS Config conformance packs that flag instances and functions whose configuration differs from a sizing standard.", fr: "Déployer des packs de conformité AWS Config qui signalent les instances et fonctions dont la configuration diffère d'une norme de dimensionnement." }
    - id: c
      text: { en: "Opt in to AWS Compute Optimizer and use its recommendations, which analyze the CloudWatch utilization metrics of each resource.", fr: "S'inscrire à AWS Compute Optimizer et utiliser ses recommandations, qui analysent les métriques d'utilisation CloudWatch de chaque ressource." }
    - id: d
      text: { en: "Use AWS Systems Manager Inventory to collect the configuration of each instance and function and compare it with vendor sizing guides.", fr: "Utiliser AWS Systems Manager Inventory pour collecter la configuration de chaque instance et fonction et la comparer aux guides de dimensionnement des éditeurs." }
answer: { optionId: c }
explanation:
  correct:
    en: Compute Optimizer analyzes resource configuration and CloudWatch utilization metrics (14 days by default) and recommends EC2 instance types, Auto Scaling group configurations and Lambda memory sizes. It is a managed service that only requires opting in, so it has the least operational overhead.
    fr: Compute Optimizer analyse la configuration des ressources et les métriques d'utilisation CloudWatch (14 jours par défaut) et recommande des types d'instance EC2, des configurations de groupes Auto Scaling et des tailles de mémoire Lambda. C'est un service géré qui demande seulement une inscription ; c'est donc la solution qui a le moins de charge opérationnelle.
  options:
    a:
      en: Dashboards provide data, but engineers must analyze it and decide sizes by hand every month, which is high operational overhead.
      fr: Les tableaux de bord fournissent des données, mais les ingénieurs doivent les analyser et choisir les tailles à la main chaque mois, ce qui représente une charge opérationnelle élevée.
    b:
      en: AWS Config evaluates configuration compliance against rules; it does not analyze utilization or recommend instance types or memory sizes.
      fr: AWS Config évalue la conformité de la configuration à des règles ; il n'analyse pas l'utilisation et ne recommande ni types d'instance ni tailles de mémoire.
    d:
      en: Inventory collects metadata, not utilization metrics, and a manual comparison with vendor guides is neither data-driven nor low effort.
      fr: Inventory collecte des métadonnées, pas des métriques d'utilisation, et une comparaison manuelle avec des guides d'éditeurs n'est ni fondée sur les données ni peu coûteuse en effort.
references:
  - title: What is AWS Compute Optimizer?
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is-compute-optimizer.html
