id: saac03-3c-msk-kafka-migration
objective: "3.5.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed Apache Kafka cluster on premises. Dozens of producer and consumer applications use the Kafka APIs and open-source Kafka tools. The company wants to move the streaming platform to AWS without changing the application code and wants AWS to manage cluster operations such as broker replacement.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute un cluster Apache Kafka autogéré sur site. Des dizaines d'applications productrices et consommatrices utilisent les API Kafka et des outils Kafka open source. L'entreprise souhaite déplacer la plateforme de streaming vers AWS sans modifier le code des applications et veut qu'AWS gère les opérations du cluster, comme le remplacement des brokers.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Install Apache Kafka on Amazon EC2 instances in an Auto Scaling group spread across three Availability Zones.", fr: "Installer Apache Kafka sur des instances Amazon EC2 d'un Auto Scaling group réparti sur trois zones de disponibilité." } }
    - { id: b, text: { en: "Replace Kafka with Amazon Kinesis Data Streams and update the applications to use the Kinesis Client Library.", fr: "Remplacer Kafka par Amazon Kinesis Data Streams et mettre à jour les applications pour utiliser la Kinesis Client Library." } }
    - { id: c, text: { en: "Replace Kafka with Amazon MQ brokers and connect the applications to the brokers.", fr: "Remplacer Kafka par des brokers Amazon MQ et y connecter les applications." } }
    - { id: d, text: { en: "Create an Amazon Managed Streaming for Apache Kafka (Amazon MSK) cluster and point the applications to its brokers.", fr: "Créer un cluster Amazon Managed Streaming for Apache Kafka (Amazon MSK) et diriger les applications vers ses brokers." } }
answer: { optionId: d }
explanation:
  correct:
    en: Amazon MSK runs open-source Apache Kafka, so existing applications, tools and plugins work without code changes. AWS manages the control plane, detects common failures and replaces unhealthy brokers, while the applications keep producing and consuming with the usual Kafka APIs.
    fr: "Amazon MSK exécute Apache Kafka open source : les applications, outils et plug-ins existants fonctionnent sans modification de code. AWS gère le plan de contrôle, détecte les pannes courantes et remplace les brokers défaillants, tandis que les applications continuent de produire et de consommer avec les API Kafka habituelles."
  options:
    a: { en: "Self-managed Kafka on EC2 keeps broker patching, replacement and scaling with the company.", fr: "Kafka autogéré sur EC2 laisse à l'entreprise la correction, le remplacement et la mise à l'échelle des brokers." }
    b: { en: "Kinesis Data Streams has its own APIs, so every application would have to be rewritten.", fr: "Kinesis Data Streams possède ses propres API : chaque application devrait être réécrite." }
    c: { en: "Amazon MQ is a managed broker for ActiveMQ and RabbitMQ, not Kafka, so the applications would have to change.", fr: "Amazon MQ est un broker géré pour ActiveMQ et RabbitMQ, pas pour Kafka : les applications devraient être modifiées." }
references:
  - title: Welcome to the Amazon MSK Developer Guide
    url: https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html
