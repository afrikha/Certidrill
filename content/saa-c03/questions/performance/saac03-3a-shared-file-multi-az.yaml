id: saac03-3a-shared-file-multi-az
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing storage for two applications. Each application runs on Amazon EC2 instances in multiple Availability Zones, and all instances of an application must access the same files at the same time. The storage must stay available, with no data loss, if one Availability Zone fails. One application runs on Linux and uses NFS; the other runs on Windows and uses SMB.

    Which storage options should the company use? (Choose two.)
  fr: |
    Une entreprise conçoit le stockage de deux applications. Chaque application s'exécute sur des instances Amazon EC2 dans plusieurs zones de disponibilité, et toutes les instances d'une application doivent accéder simultanément aux mêmes fichiers. Le stockage doit rester disponible, sans perte de données, en cas de défaillance d'une zone de disponibilité. L'une des applications s'exécute sous Linux et utilise NFS ; l'autre s'exécute sous Windows et utilise SMB.

    Quelles options de stockage l'entreprise doit-elle utiliser ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "An Amazon EFS Regional file system for the Linux application", fr: "Un système de fichiers Amazon EFS régional (Regional) pour l'application Linux" }
    - id: b
      text: { en: "An Amazon EFS One Zone file system for the Linux application", fr: "Un système de fichiers Amazon EFS One Zone pour l'application Linux" }
    - id: c
      text: { en: "An Amazon EBS io2 volume with Multi-Attach enabled for the Linux application", fr: "Un volume Amazon EBS io2 avec Multi-Attach activé pour l'application Linux" }
    - id: d
      text: { en: "A Multi-AZ Amazon FSx for Windows File Server file system for the Windows application", fr: "Un système de fichiers Amazon FSx for Windows File Server Multi-AZ pour l'application Windows" }
    - id: e
      text: { en: "A Single-AZ Amazon FSx for Windows File Server file system for the Windows application", fr: "Un système de fichiers Amazon FSx for Windows File Server Single-AZ pour l'application Windows" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      An EFS Regional file system stores data redundantly across multiple Availability Zones and stays available if a zone is lost, and instances in every zone can mount it over NFS. A Multi-AZ FSx for Windows File Server file system keeps a standby file server in another Availability Zone and fails over automatically for the SMB clients.
    fr: |-
      Un système de fichiers EFS régional stocke les données de façon redondante dans plusieurs zones de disponibilité et reste disponible en cas de perte d'une zone ; les instances de chaque zone peuvent le monter en NFS. Un système de fichiers FSx for Windows File Server Multi-AZ maintient un serveur de fichiers de secours dans une autre zone de disponibilité et bascule automatiquement pour les clients SMB.
  options:
    b:
      en: |-
        EFS One Zone stores data in a single Availability Zone; if that zone is lost, the data might be lost.
      fr: |-
        EFS One Zone stocke les données dans une seule zone de disponibilité ; si cette zone est perdue, les données risquent de l'être aussi.
    c:
      en: |-
        Multi-Attach works only with instances in the same Availability Zone, and the volume itself lives in one zone.
      fr: |-
        Multi-Attach ne fonctionne qu'avec des instances de la même zone de disponibilité, et le volume lui-même réside dans une seule zone.
    e:
      en: |-
        A Single-AZ file system is highly available only within one Availability Zone; it does not survive the loss of that zone.
      fr: |-
        Un système de fichiers Single-AZ n'est hautement disponible qu'au sein d'une seule zone de disponibilité ; il ne résiste pas à la perte de cette zone.
references:
  - title: What is Amazon Elastic File System? - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
  - title: What is FSx for Windows File Server? - Amazon FSx for Windows File Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
