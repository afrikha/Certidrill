id: saac03-3c-firehose-dynamic-partitioning
objective: "3.5.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A multi-tenant SaaS company is creating a new Amazon Data Firehose stream to deliver usage events to Amazon S3. Each event contains a customer_id field. Analysts query one customer at a time with Amazon Athena and want each query to scan only that customer's data. The company has 3,000 customers and does not want to run a separate application to reorganize the data.

    How should the company configure ingestion?
  fr: |
    Une entreprise SaaS multilocataire crée un nouveau flux Amazon Data Firehose pour livrer des événements d'utilisation dans Amazon S3. Chaque événement contient un champ customer_id. Les analystes interrogent un client à la fois avec Amazon Athena et veulent que chaque requête n'analyse que les données de ce client. L'entreprise compte 3 000 clients et ne veut pas exécuter d'application distincte pour réorganiser les données.

    Comment l'entreprise doit-elle configurer l'ingestion ?
body:
  options:
    - { id: a, text: { en: "Enable dynamic partitioning on the Firehose stream with customer_id as the partitioning key in the S3 prefix.", fr: "Activer le partitionnement dynamique sur le flux Firehose avec customer_id comme clé de partitionnement dans le préfixe S3." } }
    - { id: b, text: { en: "Create one Firehose stream per customer, each with its own S3 prefix.", fr: "Créer un flux Firehose par client, chacun avec son propre préfixe S3." } }
    - { id: c, text: { en: "Run a nightly AWS Glue job that moves the delivered objects into one prefix per customer.", fr: "Exécuter chaque nuit une tâche AWS Glue qui déplace les objets livrés dans un préfixe par client." } }
    - { id: d, text: { en: "Increase the buffer size of the Firehose stream so that each object contains more events.", fr: "Augmenter la taille de la mémoire tampon du flux Firehose afin que chaque objet contienne plus d'événements." } }
answer: { optionId: a }
explanation:
  correct:
    en: Dynamic partitioning makes Firehose continuously group records by keys found in the data, such as customer_id, and deliver each group to its own S3 prefix. Athena then scans only the partition of the queried customer, which reduces the data scanned and the cost, without a separate partitioning application.
    fr: "Le partitionnement dynamique permet à Firehose de regrouper en continu les enregistrements selon des clés présentes dans les données, comme customer_id, et de livrer chaque groupe dans son propre préfixe S3. Athena n'analyse alors que la partition du client interrogé, ce qui réduit les données analysées et le coût, sans application de partitionnement distincte."
  options:
    b: { en: "Thousands of streams, and changes to every producer to pick the right one, add far more management than one partitioned stream.", fr: "Des milliers de flux, et des modifications de chaque producteur pour choisir le bon, ajoutent beaucoup plus de gestion qu'un seul flux partitionné." }
    c: { en: "A nightly job is the separate reorganizing application that the company wants to avoid, and data stays unpartitioned until it runs.", fr: "Une tâche nocturne est précisément l'application de réorganisation que l'entreprise veut éviter, et les données restent non partitionnées jusqu'à son exécution." }
    d: { en: "Larger buffers create bigger objects but still mix all customers, so each query scans every customer's data.", fr: "Des tampons plus grands créent des objets plus gros, mais mélangent toujours tous les clients : chaque requête analyse les données de tous les clients." }
references:
  - title: Partition streaming data in Amazon Data Firehose
    url: https://docs.aws.amazon.com/firehose/latest/dev/dynamic-partitioning.html
