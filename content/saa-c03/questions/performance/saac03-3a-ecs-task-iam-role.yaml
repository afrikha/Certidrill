id: saac03-3a-ecs-task-iam-role
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs several services in one Amazon ECS cluster on Amazon EC2 container instances. A new reporting service must read objects from one Amazon S3 bucket. The other services that run on the same instances must not be able to access that bucket. The solution must follow the principle of least privilege.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute plusieurs services dans un même cluster Amazon ECS sur des instances de conteneur Amazon EC2. Un nouveau service de rapports doit lire des objets d'un compartiment Amazon S3. Les autres services qui s'exécutent sur les mêmes instances ne doivent pas pouvoir accéder à ce compartiment. La solution doit respecter le principe du moindre privilège.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the S3 read permissions to the IAM role in the instance profile of the container instances.", fr: "Ajouter les autorisations de lecture S3 au rôle IAM du profil d'instance des instances de conteneur." }
    - id: b
      text: { en: "Add the S3 read permissions to the task execution role of the reporting service.", fr: "Ajouter les autorisations de lecture S3 au rôle d'exécution de tâche du service de rapports." }
    - id: c
      text: { en: "Set an IAM role with the S3 read permissions as the task IAM role of the reporting service.", fr: "Définir un rôle IAM doté des autorisations de lecture S3 comme rôle IAM de tâche du service de rapports." }
    - id: d
      text: { en: "Create an IAM user with the S3 read permissions and pass its access keys to the container as environment variables.", fr: "Créer un utilisateur IAM doté des autorisations de lecture S3 et transmettre ses clés d'accès au conteneur sous forme de variables d'environnement." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      A task IAM role gives credentials to the application code in the containers of one task definition, so only the reporting service gets the S3 permissions. Instance profile permissions, in contrast, are shared by every task on the instance.
    fr: |-
      Un rôle IAM de tâche fournit des informations d'identification au code applicatif des conteneurs d'une définition de tâche : seul le service de rapports obtient les autorisations S3. Les autorisations du profil d'instance, au contraire, sont partagées par toutes les tâches de l'instance.
  options:
    a:
      en: |-
        Permissions on the instance profile are available to every task on the instance, so the other services could also read the bucket.
      fr: |-
        Les autorisations du profil d'instance sont accessibles à toutes les tâches de l'instance : les autres services pourraient aussi lire le compartiment.
    b:
      en: |-
        The task execution role is used by the ECS agent to pull images and run the task, not by the application code to call S3.
      fr: |-
        Le rôle d'exécution de tâche est utilisé par l'agent ECS pour extraire les images et exécuter la tâche, pas par le code applicatif pour appeler S3.
    d:
      en: |-
        Long-term access keys in environment variables can leak and must be rotated by hand; a role provides temporary credentials automatically.
      fr: |-
        Des clés d'accès à long terme dans des variables d'environnement peuvent fuiter et doivent faire l'objet d'une rotation manuelle ; un rôle fournit automatiquement des informations d'identification temporaires.
references:
  - title: Amazon ECS task IAM role - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-iam-roles.html
