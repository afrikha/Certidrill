id: saac03-3b-lambda-tmp-and-cpu
objective: "3.2.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an AWS Lambda function to process video files of up to 6 GB. The function downloads each file from Amazon S3 to the /tmp directory and then runs a CPU-intensive analysis. The function is configured with 1,024 MB of memory and 512 MB of ephemeral storage. Invocations fail with "No space left on device" errors, and the analysis step is too slow. The solution must not add any other AWS resources.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise utilise une fonction AWS Lambda pour traiter des fichiers vidéo pouvant atteindre 6 Go. La fonction télécharge chaque fichier depuis Amazon S3 dans le répertoire /tmp, puis exécute une analyse gourmande en processeur. La fonction est configurée avec 1 024 Mo de mémoire et 512 Mo de stockage éphémère. Les invocations échouent avec des erreurs « No space left on device », et l'étape d'analyse est trop lente. La solution ne doit ajouter aucune autre ressource AWS.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Increase the function's ephemeral storage to 10,240 MB.", fr: "Augmenter le stockage éphémère de la fonction à 10 240 Mo." } }
    - { id: b, text: { en: "Increase the function's timeout to 15 minutes.", fr: "Augmenter le délai d'expiration de la fonction à 15 minutes." } }
    - { id: c, text: { en: "Configure reserved concurrency for the function.", fr: "Configurer la simultanéité réservée pour la fonction." } }
    - { id: d, text: { en: "Increase the function's memory setting.", fr: "Augmenter le paramètre de mémoire de la fonction." } }
    - { id: e, text: { en: "Turn on Lambda SnapStart for the function.", fr: "Activer Lambda SnapStart pour la fonction." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Ephemeral storage can be set from 512 MB to 10,240 MB, which gives /tmp enough space for a 6 GB file without adding Amazon EFS or another resource. Lambda allocates CPU power in proportion to memory, so a higher memory setting speeds up the CPU-intensive analysis.
    fr: Le stockage éphémère peut être réglé de 512 Mo à 10 240 Mo, ce qui donne à /tmp assez d'espace pour un fichier de 6 Go sans ajouter Amazon EFS ni une autre ressource. Lambda alloue la puissance de processeur proportionnellement à la mémoire ; un paramètre de mémoire plus élevé accélère donc l'analyse gourmande en processeur.
  options:
    b:
      en: A longer timeout does not create disk space in /tmp and does not make the analysis faster.
      fr: Un délai d'expiration plus long ne crée pas d'espace disque dans /tmp et n'accélère pas l'analyse.
    c:
      en: Reserved concurrency guarantees and caps the number of concurrent executions; it changes neither the disk space nor the CPU of each execution.
      fr: La simultanéité réservée garantit et plafonne le nombre d'exécutions simultanées ; elle ne modifie ni l'espace disque ni le processeur de chaque exécution.
    e:
      en: SnapStart reduces initialization (cold-start) latency; it does not help with disk space or CPU-bound processing.
      fr: SnapStart réduit la latence d'initialisation (démarrage à froid) ; il n'aide ni pour l'espace disque ni pour un traitement limité par le processeur.
references:
