id: saac03-3a-eks-existing-kubernetes
objective: "3.2.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs containerized applications on a self-managed Kubernetes cluster on premises. The teams deploy with Helm charts and kubectl and use several Kubernetes community plugins. The company is moving the applications to AWS and wants AWS to manage the Kubernetes control plane while the teams keep their existing manifests and tooling.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des applications conteneurisées sur un cluster Kubernetes autogéré sur site. Les équipes déploient avec des charts Helm et kubectl et utilisent plusieurs plugins de la communauté Kubernetes. L'entreprise migre les applications vers AWS et souhaite qu'AWS gère le plan de contrôle Kubernetes, tandis que les équipes conservent leurs manifestes et leurs outils existants.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Migrate the applications to Amazon ECS and rewrite the manifests as ECS task definitions.", fr: "Migrer les applications vers Amazon ECS et réécrire les manifestes sous forme de définitions de tâches ECS." }
    - id: b
      text: { en: "Install Kubernetes on Amazon EC2 instances and run the control plane on those instances.", fr: "Installer Kubernetes sur des instances Amazon EC2 et y exécuter le plan de contrôle." }
    - id: c
      text: { en: "Deploy the applications as Docker platform environments in AWS Elastic Beanstalk.", fr: "Déployer les applications dans des environnements de plateforme Docker d'AWS Elastic Beanstalk." }
    - id: d
      text: { en: "Migrate the applications to an Amazon EKS cluster.", fr: "Migrer les applications vers un cluster Amazon EKS." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon EKS is a managed Kubernetes service in which AWS manages the control plane. EKS is certified Kubernetes-conformant, so Kubernetes-compatible applications deploy without refactoring and the teams can keep using community tooling and plugins such as Helm and kubectl.
    fr: |-
      Amazon EKS est un service Kubernetes géré dans lequel AWS gère le plan de contrôle. EKS est certifié conforme à Kubernetes : les applications compatibles Kubernetes se déploient sans refonte, et les équipes peuvent continuer à utiliser les outils et plugins de la communauté tels que Helm et kubectl.
  options:
    a:
      en: |-
        ECS has its own API and task definitions, so the teams would have to rewrite their manifests and drop their Kubernetes tooling.
      fr: |-
        ECS possède sa propre API et ses définitions de tâches : les équipes devraient réécrire leurs manifestes et abandonner leurs outils Kubernetes.
    b:
      en: |-
        A self-managed control plane on EC2 keeps the company responsible for operating Kubernetes, which it wants AWS to do.
      fr: |-
        Un plan de contrôle autogéré sur EC2 laisse à l'entreprise la responsabilité d'exploiter Kubernetes, ce qu'elle veut confier à AWS.
    c:
      en: |-
        Elastic Beanstalk Docker environments do not accept Kubernetes manifests or Helm charts.
      fr: |-
        Les environnements Docker d'Elastic Beanstalk n'acceptent ni manifestes Kubernetes ni charts Helm.
references:
  - title: What is Amazon EKS? - Amazon EKS
    url: https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html
