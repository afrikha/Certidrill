id: saac03-3c-kds-enhanced-fanout
objective: "3.5.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an Amazon Kinesis data stream with 10 shards. Producers write well below the write limits of the shards. Five consumer applications read the stream with the standard GetRecords API. The consumers receive ReadProvisionedThroughputExceeded errors, and records take about one second to reach them. Each consumer must receive records with a latency of about 70 ms, without any change to the producers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un flux de données Amazon Kinesis de 10 partitions (shards). Les producteurs écrivent bien en dessous des limites d'écriture des partitions. Cinq applications consommatrices lisent le flux avec l'API standard GetRecords. Les consommateurs reçoivent des erreurs ReadProvisionedThroughputExceeded, et les enregistrements mettent environ une seconde à leur parvenir. Chaque consommateur doit recevoir les enregistrements avec une latence d'environ 70 ms, sans aucune modification des producteurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Register each consumer application as an enhanced fan-out consumer and read the shards with SubscribeToShard.", fr: "Enregistrer chaque application consommatrice comme consommateur à diffusion améliorée (enhanced fan-out) et lire les partitions avec SubscribeToShard." } }
    - { id: b, text: { en: "Double the number of shards of the stream and keep the consumers on the GetRecords API.", fr: "Doubler le nombre de partitions du flux et conserver les consommateurs sur l'API GetRecords." } }
    - { id: c, text: { en: "Increase the data retention period of the stream from 24 hours to 7 days.", fr: "Augmenter la période de conservation des données du flux de 24 heures à 7 jours." } }
    - { id: d, text: { en: "Replace the consumers with one Amazon Data Firehose stream that delivers the records to all five applications.", fr: "Remplacer les consommateurs par un flux Amazon Data Firehose qui livre les enregistrements aux cinq applications." } }
answer: { optionId: a }
explanation:
  correct:
    en: An enhanced fan-out consumer gets its own 2 MB/s of read throughput per shard, not shared with other consumers, and records are pushed over HTTP/2 with SubscribeToShard. Propagation delay is typically about 70 ms whether there is one consumer or five, while shared-throughput consumers see about 1,000 ms with five consumers.
    fr: "Un consommateur à diffusion améliorée obtient son propre débit de lecture de 2 Mo/s par partition, non partagé avec les autres consommateurs, et les enregistrements lui sont poussés via HTTP/2 avec SubscribeToShard. Le délai de propagation est généralement d'environ 70 ms avec un ou cinq consommateurs, contre environ 1 000 ms pour cinq consommateurs à débit partagé."
  options:
    b: { en: "More shards add shared read capacity, but five polling consumers still share each shard's throughput and stay far above 70 ms of latency.", fr: "Plus de partitions ajoutent de la capacité de lecture partagée, mais cinq consommateurs qui interrogent le flux partagent toujours le débit de chaque partition et restent loin au-dessus de 70 ms de latence." }
    c: { en: "Retention controls how long records stay available; it has no effect on read throughput or latency.", fr: "La conservation détermine la durée de disponibilité des enregistrements ; elle n'a aucun effet sur le débit de lecture ni sur la latence." }
    d: { en: "A Firehose stream buffers records and delivers them to one destination; it does not serve five applications with low latency.", fr: "Un flux Firehose met les enregistrements en mémoire tampon et les livre à une seule destination ; il ne sert pas cinq applications avec une faible latence." }
references:
  - title: Develop enhanced fan-out consumers with dedicated throughput
    url: https://docs.aws.amazon.com/streams/latest/dev/enhanced-consumers.html
