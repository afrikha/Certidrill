id: saac03-3c-emr-spot-task-nodes
objective: "3.5.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a long-running Amazon EMR cluster for business-critical daily jobs. The jobs store intermediate data in HDFS. During peak hours the company adds processing capacity and wants to reduce the cost of that extra capacity. The solution must not risk HDFS data loss or termination of the cluster.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute un cluster Amazon EMR permanent pour des tâches quotidiennes critiques. Les tâches stockent des données intermédiaires dans HDFS. Aux heures de pointe, l'entreprise ajoute de la capacité de traitement et souhaite réduire le coût de cette capacité supplémentaire. La solution ne doit faire courir aucun risque de perte de données HDFS ni d'arrêt du cluster.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Run the primary node on a Spot Instance.", fr: "Exécuter le nœud primaire sur une instance Spot." } }
    - { id: b, text: { en: "Run the primary node and the core nodes on On-Demand Instances.", fr: "Exécuter le nœud primaire et les nœuds principaux (core) sur des instances à la demande." } }
    - { id: c, text: { en: "Add the peak capacity as core nodes on Spot Instances.", fr: "Ajouter la capacité de pointe sous forme de nœuds principaux (core) sur des instances Spot." } }
    - { id: d, text: { en: "Add the peak capacity as a task instance group that uses Spot Instances.", fr: "Ajouter la capacité de pointe sous forme de groupe d'instances de tâche qui utilise des instances Spot." } }
    - { id: e, text: { en: "Move every node of the cluster to Spot Instances in an instance fleet.", fr: "Passer tous les nœuds du cluster sur des instances Spot dans une flotte d'instances." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: For long-running and data-critical clusters, AWS recommends On-Demand Instances for the primary and core nodes so that the cluster and its HDFS data are not affected by Spot interruptions. Task nodes process data but store no HDFS data, so Spot task nodes add cheap peak capacity and their interruption loses no data.
    fr: "Pour les clusters permanents et critiques pour les données, AWS recommande des instances à la demande pour le nœud primaire et les nœuds principaux, afin que le cluster et ses données HDFS ne soient pas affectés par les interruptions Spot. Les nœuds de tâche traitent des données sans en stocker dans HDFS : des nœuds de tâche Spot ajoutent une capacité de pointe peu coûteuse, et leur interruption ne fait perdre aucune donnée."
  options:
    a: { en: "If the primary node is interrupted, the whole cluster terminates.", fr: "Si le nœud primaire est interrompu, tout le cluster s'arrête." }
    c: { en: "Core nodes store HDFS data, so a Spot interruption can lose data.", fr: "Les nœuds principaux stockent des données HDFS : une interruption Spot peut faire perdre des données." }
    e: { en: "An all-Spot cluster suits transient, cost-driven or test workloads; interruptions of the primary or core nodes could terminate the cluster or lose HDFS data.", fr: "Un cluster entièrement Spot convient aux charges éphémères, axées sur le coût ou de test ; l'interruption du nœud primaire ou des nœuds principaux pourrait arrêter le cluster ou faire perdre des données HDFS." }
references:
  - title: Configuring Amazon EMR cluster instance types and best practices for Spot instances
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-plan-instances-guidelines.html
