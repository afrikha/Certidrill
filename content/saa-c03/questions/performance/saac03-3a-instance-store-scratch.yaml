id: saac03-3a-instance-store-scratch
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video rendering application runs on a fleet of Amazon EC2 instances. Each instance downloads source files from Amazon S3, writes large temporary files during rendering, and uploads the result back to Amazon S3. The temporary files need the lowest possible storage latency and can be re-created if an instance fails. The company does not want to pay separately for the temporary storage.

    Which storage option should the company use for the temporary files?
  fr: |
    Une application de rendu vidéo s'exécute sur un parc d'instances Amazon EC2. Chaque instance télécharge des fichiers sources depuis Amazon S3, écrit de gros fichiers temporaires pendant le rendu, puis charge le résultat dans Amazon S3. Les fichiers temporaires exigent la latence de stockage la plus faible possible et peuvent être recréés si une instance tombe en panne. L'entreprise ne souhaite pas payer séparément le stockage temporaire.

    Quelle option de stockage l'entreprise doit-elle utiliser pour les fichiers temporaires ?
body:
  options:
    - id: a
      text: { en: "The NVMe instance store volumes of an instance type that includes them", fr: "Les volumes de stockage d'instance NVMe d'un type d'instance qui en comporte" }
    - id: b
      text: { en: "An Amazon EBS io2 Block Express volume attached to each instance", fr: "Un volume Amazon EBS io2 Block Express attaché à chaque instance" }
    - id: c
      text: { en: "An Amazon EFS file system shared by all the instances", fr: "Un système de fichiers Amazon EFS partagé par toutes les instances" }
    - id: d
      text: { en: "An Amazon S3 bucket used as a scratch location through the AWS SDK", fr: "Un compartiment Amazon S3 utilisé comme espace de travail temporaire via le kit SDK AWS" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Instance store volumes are disks physically attached to the host, included in the instance price, and suited to buffers, caches and scratch data. Their data is lost when the instance stops, hibernates or terminates, which is acceptable here because the temporary files can be re-created.
    fr: |-
      Les volumes de stockage d'instance sont des disques physiquement attachés à l'hôte, inclus dans le prix de l'instance et adaptés aux tampons, caches et données temporaires. Leurs données sont perdues à l'arrêt, à la mise en veille prolongée ou à la résiliation de l'instance, ce qui est acceptable ici puisque les fichiers temporaires peuvent être recréés.
  options:
    b:
      en: |-
        io2 Block Express gives very low latency, but it is network-attached storage billed separately for capacity and IOPS, which the company wants to avoid.
      fr: |-
        io2 Block Express offre une latence très faible, mais c'est un stockage réseau facturé séparément pour la capacité et les IOPS, ce que l'entreprise veut éviter.
    c:
      en: |-
        EFS is shared network file storage billed for the data stored; its latency is higher than local disks and sharing is not needed for per-instance scratch files.
      fr: |-
        EFS est un stockage de fichiers réseau partagé, facturé selon les données stockées ; sa latence est supérieure à celle des disques locaux, et le partage n'est pas nécessaire pour des fichiers temporaires propres à chaque instance.
    d:
      en: |-
        S3 is object storage reached over the network, with higher latency than local block storage and request and storage charges.
      fr: |-
        S3 est un stockage d'objets accessible par le réseau, avec une latence supérieure à celle d'un stockage en mode bloc local et des frais de requêtes et de stockage.
references:
  - title: Data persistence for Amazon EC2 instance store volumes - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-store-lifetime.html
  - title: Instance store temporary block storage for EC2 instances - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html
