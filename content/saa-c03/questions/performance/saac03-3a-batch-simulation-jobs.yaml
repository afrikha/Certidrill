id: saac03-3a-batch-simulation-jobs
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A pharmaceutical company submits thousands of containerized simulation jobs every night. Each job runs for 2 to 4 hours, some jobs must wait for others to finish, and the company wants to use Spot Instances where possible. The company needs a managed service that queues the jobs and provisions the right amount of compute capacity for them automatically.

    Which AWS service will meet these requirements?
  fr: |
    Une entreprise pharmaceutique soumet chaque nuit des milliers de tâches de simulation conteneurisées. Chaque tâche dure de 2 à 4 heures, certaines doivent attendre la fin d'autres tâches, et l'entreprise souhaite utiliser des instances Spot lorsque c'est possible. L'entreprise a besoin d'un service géré qui met les tâches en file d'attente et provisionne automatiquement la capacité de calcul adaptée.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "AWS Lambda", fr: "AWS Lambda" }
    - id: b
      text: { en: "Amazon EMR", fr: "Amazon EMR" }
    - id: c
      text: { en: "AWS Batch", fr: "AWS Batch" }
    - id: d
      text: { en: "AWS Elastic Beanstalk", fr: "AWS Elastic Beanstalk" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      AWS Batch is a fully managed service that plans, schedules and runs containerized batch workloads. It queues submitted jobs, supports dependencies between jobs, and automatically provisions EC2 (including Spot) or Fargate capacity based on what the jobs need.
    fr: |-
      AWS Batch est un service entièrement géré qui planifie, ordonnance et exécute des charges de travail par lots conteneurisées. Il met en file d'attente les tâches soumises, prend en charge les dépendances entre tâches et provisionne automatiquement la capacité EC2 (y compris Spot) ou Fargate selon les besoins des tâches.
  options:
    a:
      en: |-
        Jobs of up to 4 hours are far longer than the maximum timeout of a Lambda function (minutes, not hours).
      fr: |-
        Des tâches pouvant durer 4 heures sont bien plus longues que la durée maximale d'une fonction Lambda (des minutes, pas des heures).
    b:
      en: |-
        EMR runs big data frameworks such as Apache Spark and Hadoop on clusters; it is not a scheduler for generic containerized batch jobs.
      fr: |-
        EMR exécute des frameworks big data tels qu'Apache Spark et Hadoop sur des clusters ; ce n'est pas un ordonnanceur de tâches par lots conteneurisées génériques.
    d:
      en: |-
        Elastic Beanstalk deploys and scales web applications; it does not queue jobs or manage dependencies between them.
      fr: |-
        Elastic Beanstalk déploie et met à l'échelle des applications web ; il ne met pas de tâches en file d'attente et ne gère pas leurs dépendances.
references:
  - title: What is AWS Batch? - AWS Batch
    url: https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html
  - title: Lambda quotas - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
