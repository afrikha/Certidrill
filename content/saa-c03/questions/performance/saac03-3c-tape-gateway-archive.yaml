id: saac03-3c-tape-gateway-archive
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company backs up its on-premises servers to a physical tape library with a backup application that writes to tape drives. The company wants to stop buying, storing and shipping tapes, and to keep backups for 10 years at the lowest storage cost. The backup jobs and the backup application must keep working with a tape interface.

    Which solution will meet these requirements?
  fr: |
    Une entreprise sauvegarde ses serveurs sur site sur une bibliothèque de bandes physique avec une application de sauvegarde qui écrit sur des lecteurs de bandes. L'entreprise veut cesser d'acheter, de stocker et d'expédier des bandes, et conserver les sauvegardes 10 ans au coût de stockage le plus bas. Les tâches et l'application de sauvegarde doivent continuer à fonctionner avec une interface de bandes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy Amazon S3 File Gateway, back up to its file share, and add an S3 Lifecycle rule that moves objects to S3 Glacier Deep Archive.", fr: "Déployer Amazon S3 File Gateway, sauvegarder sur son partage de fichiers et ajouter une règle S3 Lifecycle qui déplace les objets vers S3 Glacier Deep Archive." } }
    - { id: b, text: { en: "Deploy a Tape Gateway, point the backup application to its virtual tape library, and archive ejected tapes to S3 Glacier Deep Archive.", fr: "Déployer une Tape Gateway, diriger l'application de sauvegarde vers sa bibliothèque de bandes virtuelle et archiver les bandes éjectées dans S3 Glacier Deep Archive." } }
    - { id: c, text: { en: "Create an AWS DataSync task that reads the tape library and writes the backups to S3 Glacier Deep Archive.", fr: "Créer une tâche AWS DataSync qui lit la bibliothèque de bandes et écrit les sauvegardes dans S3 Glacier Deep Archive." } }
    - { id: d, text: { en: "Deploy a Volume Gateway with cached volumes, back up to the volumes, and keep EBS snapshots of the volumes for 10 years.", fr: "Déployer une Volume Gateway avec des volumes mis en cache, sauvegarder sur ces volumes et conserver des instantanés EBS des volumes pendant 10 ans." } }
answer: { optionId: b }
explanation:
  correct:
    en: Tape Gateway replaces physical tape infrastructure with cloud-backed virtual tapes, so the backup application keeps writing to a tape interface. Archived virtual tapes are stored in S3 Glacier Flexible Retrieval or S3 Glacier Deep Archive; Deep Archive is the lowest-cost option for backups kept for 10 years.
    fr: "Tape Gateway remplace l'infrastructure de bandes physique par des bandes virtuelles adossées au cloud : l'application de sauvegarde continue d'écrire sur une interface de bandes. Les bandes virtuelles archivées sont stockées dans S3 Glacier Flexible Retrieval ou S3 Glacier Deep Archive ; Deep Archive est l'option la moins coûteuse pour des sauvegardes conservées 10 ans."
  options:
    a: { en: "A file share is not a tape interface: the backup jobs would have to be reconfigured to write to files.", fr: "Un partage de fichiers n'est pas une interface de bandes : les tâches de sauvegarde devraient être reconfigurées pour écrire dans des fichiers." }
    c: { en: "DataSync reads file systems and object storage, not tape libraries, and it does not give the backup application a tape interface.", fr: "DataSync lit des systèmes de fichiers et du stockage objet, pas des bibliothèques de bandes, et il ne fournit pas d'interface de bandes à l'application de sauvegarde." }
    d: { en: "Cached volumes are iSCSI block volumes, not tapes, and long-term EBS snapshots cost more than Glacier Deep Archive.", fr: "Les volumes mis en cache sont des volumes en mode bloc iSCSI, pas des bandes, et des instantanés EBS de longue durée coûtent plus cher que Glacier Deep Archive." }
references:
  - title: What is Tape Gateway?
    url: https://docs.aws.amazon.com/storagegateway/latest/tgw/WhatIsStorageGateway.html
