id: saac03-3a-ecs-capacity-provider-scaling
objective: "3.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs a web service on Amazon ECS with the EC2 launch type. The cluster's container instances belong to an Auto Scaling group. Traffic is unpredictable. The company wants the number of tasks to increase when the service's CPU utilization rises, and the cluster to add instances automatically so that new tasks are not left in the PROVISIONING state, then remove unused instances when traffic falls. The solution must have the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute un service web sur Amazon ECS avec le type de lancement EC2. Les instances de conteneur du cluster appartiennent à un groupe Auto Scaling. Le trafic est imprévisible. L'entreprise souhaite que le nombre de tâches augmente quand l'utilisation du processeur du service croît, et que le cluster ajoute automatiquement des instances pour que les nouvelles tâches ne restent pas à l'état PROVISIONING, puis retire les instances inutilisées quand le trafic baisse. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure ECS Service Auto Scaling with a target tracking policy on the service's average CPU utilization.", fr: "Configurer ECS Service Auto Scaling avec une stratégie de suivi de la cible sur l'utilisation moyenne du processeur du service." }
    - id: b
      text: { en: "Use an Auto Scaling group capacity provider with managed scaling in the cluster's capacity provider strategy.", fr: "Utiliser un fournisseur de capacité de groupe Auto Scaling avec mise à l'échelle gérée dans la stratégie de fournisseurs de capacité du cluster." }
    - id: c
      text: { en: "Add a target tracking policy on ASGAverageCPUUtilization directly to the Auto Scaling group of the container instances.", fr: "Ajouter directement au groupe Auto Scaling des instances de conteneur une stratégie de suivi de la cible sur ASGAverageCPUUtilization." }
    - id: d
      text: { en: "Increase the CPU and memory values in the task definition of the service.", fr: "Augmenter les valeurs de processeur et de mémoire dans la définition de tâche du service." }
    - id: e
      text: { en: "Create scheduled actions that change the desired task count of the service each hour.", fr: "Créer des actions planifiées qui modifient chaque heure le nombre de tâches souhaité du service." }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |-
      Service Auto Scaling uses Application Auto Scaling to change the service's desired task count, and target tracking on average CPU is its simplest policy type. A capacity provider with managed scaling lets ECS scale the Auto Scaling group out and in based on the capacity the tasks need, so tasks waiting in PROVISIONING get instances and idle instances are removed.
    fr: |-
      Service Auto Scaling utilise Application Auto Scaling pour modifier le nombre de tâches souhaité du service, et le suivi de la cible sur le processeur moyen est son type de stratégie le plus simple. Un fournisseur de capacité avec mise à l'échelle gérée permet à ECS d'augmenter et de réduire le groupe Auto Scaling selon la capacité dont les tâches ont besoin : les tâches en attente à l'état PROVISIONING obtiennent des instances et les instances inactives sont retirées.
  options:
    c:
      en: |-
        Instance CPU does not reflect tasks that are waiting for capacity, and it is not aware of which instances run tasks, so it can add instances too late or remove busy ones.
      fr: |-
        Le processeur des instances ne reflète pas les tâches en attente de capacité et ignore quelles instances exécutent des tâches : il peut ajouter des instances trop tard ou retirer des instances occupées.
    d:
      en: |-
        Larger tasks change the size of each task, not the number of tasks or instances, and do not respond to traffic changes.
      fr: |-
        Des tâches plus grandes modifient la taille de chaque tâche, pas le nombre de tâches ou d'instances, et ne réagissent pas aux variations de trafic.
    e:
      en: |-
        Scheduled actions suit known patterns; traffic is unpredictable, and the schedules would not add container instances.
      fr: |-
        Les actions planifiées suivent des schémas connus ; le trafic est imprévisible, et les planifications n'ajouteraient pas d'instances de conteneur.
references:
  - title: Amazon ECS capacity providers for EC2 workloads - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/asg-capacity-providers.html
  - title: Automatically scale your Amazon ECS service - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html
