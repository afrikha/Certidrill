id: saac03-3b-keyspaces-cassandra
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed Apache Cassandra cluster on Amazon EC2 instances for a messaging application. The operations team spends a lot of time patching nodes and adding capacity. The company wants a serverless database that scales automatically and lets the application keep its existing Cassandra Query Language (CQL) code and drivers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Apache Cassandra autogéré sur des instances Amazon EC2 pour une application de messagerie. L'équipe d'exploitation passe beaucoup de temps à appliquer des correctifs aux nœuds et à ajouter de la capacité. L'entreprise veut une base de données sans serveur qui évolue automatiquement et permet à l'application de conserver son code CQL (Cassandra Query Language) et ses pilotes existants.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Migrate the data to Amazon DynamoDB and use DynamoDB on-demand capacity mode.", fr: "Migrer les données vers Amazon DynamoDB et utiliser le mode de capacité à la demande de DynamoDB." }
    - id: b
      text: { en: "Migrate the data to Amazon Keyspaces (for Apache Cassandra).", fr: "Migrer les données vers Amazon Keyspaces (for Apache Cassandra)." }
    - id: c
      text: { en: "Migrate the data to Amazon DocumentDB (with MongoDB compatibility).", fr: "Migrer les données vers Amazon DocumentDB (with MongoDB compatibility)." }
    - id: d
      text: { en: "Move the Cassandra nodes into an EC2 Auto Scaling group that scales on CPU utilization.", fr: "Déplacer les nœuds Cassandra dans un groupe Auto Scaling EC2 qui évolue selon l'utilisation du processeur." }
answer: { optionId: b }
explanation:
  correct:
    en: Amazon Keyspaces is a serverless, managed database that is compatible with Apache Cassandra, so existing Cassandra application code and tools keep working. It scales tables automatically with traffic, and there are no servers to patch.
    fr: Amazon Keyspaces est une base de données gérée sans serveur compatible avec Apache Cassandra ; le code d'application et les outils Cassandra existants continuent donc de fonctionner. Il fait évoluer les tables automatiquement selon le trafic, et il n'y a aucun serveur à corriger.
  options:
    a:
      en: DynamoDB is serverless but uses its own API, so the CQL code and Cassandra drivers would have to be rewritten.
      fr: DynamoDB est sans serveur mais utilise sa propre API ; le code CQL et les pilotes Cassandra devraient donc être réécrits.
    c:
      en: DocumentDB is compatible with MongoDB drivers and APIs, not with CQL.
      fr: DocumentDB est compatible avec les pilotes et API MongoDB, pas avec CQL.
    d:
      en: The cluster stays self-managed, so patching remains, and adding Cassandra nodes requires data rebalancing that CPU-based scaling does not handle.
      fr: Le cluster reste autogéré, les correctifs restent donc à appliquer, et l'ajout de nœuds Cassandra demande un rééquilibrage des données que la mise à l'échelle sur le processeur ne gère pas.
references:
  - title: What is Amazon Keyspaces (for Apache Cassandra)?
    url: https://docs.aws.amazon.com/keyspaces/latest/devguide/what-is-keyspaces.html
