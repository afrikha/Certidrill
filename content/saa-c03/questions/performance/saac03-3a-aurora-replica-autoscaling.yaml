id: saac03-3a-aurora-replica-autoscaling
objective: "3.2.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL DB cluster with one writer and two Aurora Replicas. The application sends its read queries to the reader endpoint. Read traffic varies widely and unpredictably during the day, and at peaks the replicas reach 90% CPU utilization. The company wants replicas to be added and removed automatically with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite un cluster de bases de données Amazon Aurora MySQL composé d'un rédacteur et de deux réplicas Aurora. L'application envoie ses requêtes de lecture au point de terminaison du lecteur. Le trafic de lecture varie fortement et de manière imprévisible au cours de la journée, et lors des pointes les réplicas atteignent 90 % d'utilisation du processeur. L'entreprise souhaite que des réplicas soient ajoutés et supprimés automatiquement, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Change the writer DB instance to a larger instance class.", fr: "Passer l'instance de base de données du rédacteur à une classe d'instance plus grande." }
    - id: b
      text: { en: "Create a CloudWatch alarm on replica CPU that invokes a Lambda function to add or remove replicas.", fr: "Créer une alarme CloudWatch sur le processeur des réplicas qui appelle une fonction Lambda pour ajouter ou supprimer des réplicas." }
    - id: c
      text: { en: "Add an Aurora Auto Scaling policy that tracks a target average CPU utilization of the Aurora Replicas.", fr: "Ajouter une stratégie Aurora Auto Scaling qui suit une utilisation moyenne cible du processeur des réplicas Aurora." }
    - id: d
      text: { en: "Convert the cluster to an Aurora global database with a secondary cluster in another Region.", fr: "Convertir le cluster en base de données globale Aurora avec un cluster secondaire dans une autre Région." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Aurora Auto Scaling uses a target tracking policy, managed through Application Auto Scaling, to add Aurora Replicas when the average metric across readers rises and remove them when demand drops. Because the application uses the reader endpoint, it can use new replicas without changes.
    fr: |-
      Aurora Auto Scaling utilise une stratégie de suivi de la cible, gérée via Application Auto Scaling, pour ajouter des réplicas Aurora quand la métrique moyenne des lecteurs augmente et les supprimer quand la demande baisse. Comme l'application utilise le point de terminaison du lecteur, elle peut utiliser les nouveaux réplicas sans modification.
  options:
    a:
      en: |-
        The reads go to the replicas, and Aurora Auto Scaling does not apply to the writer; a larger writer does not relieve the readers.
      fr: |-
        Les lectures vont aux réplicas, et Aurora Auto Scaling ne s'applique pas au rédacteur ; un rédacteur plus grand ne soulage pas les lecteurs.
    b:
      en: |-
        A custom alarm and function can work, but the company would build and maintain logic that Aurora Auto Scaling provides natively.
      fr: |-
        Une alarme et une fonction personnalisées peuvent fonctionner, mais l'entreprise devrait créer et maintenir une logique qu'Aurora Auto Scaling fournit nativement.
    d:
      en: |-
        A global database adds a cluster in another Region for disaster recovery and global reads; it does not add replicas automatically in the primary cluster.
      fr: |-
        Une base de données globale ajoute un cluster dans une autre Région pour la reprise après sinistre et les lectures mondiales ; elle n'ajoute pas automatiquement de réplicas dans le cluster principal.
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas - Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
