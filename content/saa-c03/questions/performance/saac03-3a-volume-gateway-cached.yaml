id: saac03-3a-volume-gateway-cached
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's on-premises application stores 200 TB of data on iSCSI volumes. The storage array is reaching end of life, and the company will keep only about 20 TB of local disk capacity. About 10% of the data is accessed in any given week, and that data must be served with low latency. The application requires block storage and cannot be modified.

    Which solution will meet these requirements?
  fr: |
    L'application sur site d'une entreprise stocke 200 To de données sur des volumes iSCSI. La baie de stockage arrive en fin de vie, et l'entreprise ne conservera qu'environ 20 To de capacité disque locale. Environ 10 % des données sont consultées au cours d'une semaine donnée, et ces données doivent être servies avec une faible latence. L'application exige un stockage en mode bloc et ne peut pas être modifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy Volume Gateway with stored volumes on the 20 TB of local disks.", fr: "Déployer Volume Gateway avec des volumes stockés sur les 20 To de disques locaux." }
    - id: b
      text: { en: "Deploy Volume Gateway with cached volumes and use the local disks as the gateway cache.", fr: "Déployer Volume Gateway avec des volumes mis en cache et utiliser les disques locaux comme cache de la passerelle." }
    - id: c
      text: { en: "Deploy Amazon S3 File Gateway and use the local disks as the cache for an NFS file share.", fr: "Déployer Amazon S3 File Gateway et utiliser les disques locaux comme cache d'un partage de fichiers NFS." }
    - id: d
      text: { en: "Create an Amazon FSx for NetApp ONTAP file system and connect the application to iSCSI LUNs over AWS Direct Connect.", fr: "Créer un système de fichiers Amazon FSx for NetApp ONTAP et connecter l'application à des LUN iSCSI via AWS Direct Connect." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Cached volumes store the primary data in Amazon S3 and keep the frequently accessed subset on the local cache disks, so 20 TB of local capacity is enough for the 10% working set. The application keeps iSCSI block access and gets low latency for the data it uses most.
    fr: |-
      Les volumes mis en cache stockent les données principales dans Amazon S3 et conservent le sous-ensemble fréquemment consulté sur les disques de cache locaux : 20 To de capacité locale suffisent pour les 10 % de données actives. L'application conserve un accès en mode bloc iSCSI et bénéficie d'une faible latence pour les données qu'elle utilise le plus.
  options:
    a:
      en: |-
        Stored volumes keep the entire dataset on premises, which needs about 200 TB of local disk, far more than the 20 TB the company will keep.
      fr: |-
        Les volumes stockés conservent la totalité du jeu de données sur site, ce qui exige environ 200 To de disque local, bien plus que les 20 To que l'entreprise conservera.
    c:
      en: |-
        S3 File Gateway provides NFS or SMB file shares, not block storage, so the application would have to change.
      fr: |-
        S3 File Gateway fournit des partages de fichiers NFS ou SMB, pas un stockage en mode bloc : l'application devrait être modifiée.
    d:
      en: |-
        FSx for ONTAP can serve iSCSI LUNs, but with no local cache every read crosses the Direct Connect link, so the frequently accessed data is not served with on-premises latency.
      fr: |-
        FSx for ONTAP peut servir des LUN iSCSI, mais sans cache local chaque lecture traverse la liaison Direct Connect : les données fréquemment consultées ne sont pas servies avec une latence locale.
references:
