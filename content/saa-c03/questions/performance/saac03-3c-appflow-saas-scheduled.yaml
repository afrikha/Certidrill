id: saac03-3c-appflow-saas-scheduled
objective: "3.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A marketing team needs opportunity records from its Salesforce organization copied to an Amazon S3 data lake every hour. The team has no developers and wants a fully managed solution that requires no code.

    Which solution will meet these requirements?
  fr: |
    Une équipe marketing a besoin que les enregistrements d'opportunités de son organisation Salesforce soient copiés toutes les heures dans un lac de données Amazon S3. L'équipe n'a pas de développeurs et souhaite une solution entièrement gérée qui ne demande aucun code.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon AppFlow flow with Salesforce as the source, S3 as the destination, and an hourly schedule trigger.", fr: "Créer un flux Amazon AppFlow avec Salesforce comme source, S3 comme destination et un déclencheur planifié toutes les heures." } }
    - { id: b, text: { en: "Create an AWS Lambda function that calls the Salesforce API and schedule it with an Amazon EventBridge rule every hour.", fr: "Créer une fonction AWS Lambda qui appelle l'API Salesforce et la planifier toutes les heures avec une règle Amazon EventBridge." } }
    - { id: c, text: { en: "Create an AWS DataSync task with Salesforce as the source location and schedule it to run every hour.", fr: "Créer une tâche AWS DataSync avec Salesforce comme emplacement source et la planifier toutes les heures." } }
    - { id: d, text: { en: "Create an AWS DMS replication task with Salesforce as the source endpoint and S3 as the target endpoint.", fr: "Créer une tâche de réplication AWS DMS avec Salesforce comme point de terminaison source et S3 comme point de terminaison cible." } }
answer: { optionId: a }
explanation:
  correct:
    en: Amazon AppFlow is a fully managed integration service that moves data between SaaS applications such as Salesforce and AWS services such as Amazon S3. Flows are configured without code and can run on demand, on a schedule or on events.
    fr: "Amazon AppFlow est un service d'intégration entièrement géré qui déplace des données entre des applications SaaS comme Salesforce et des services AWS comme Amazon S3. Les flux se configurent sans code et peuvent s'exécuter à la demande, selon une planification ou sur événement."
  options:
    b: { en: "A Lambda function is custom code that the team would have to write and maintain.", fr: "Une fonction Lambda est du code personnalisé que l'équipe devrait écrire et maintenir." }
    c: { en: "DataSync transfers files and objects between storage systems such as NFS, SMB, HDFS and object storage; Salesforce is not a supported location.", fr: "DataSync transfère des fichiers et des objets entre systèmes de stockage comme NFS, SMB, HDFS et le stockage objet ; Salesforce n'est pas un emplacement pris en charge." }
    d: { en: "AWS DMS migrates and replicates databases; a SaaS application such as Salesforce is not one of its source endpoints.", fr: "AWS DMS migre et réplique des bases de données ; une application SaaS comme Salesforce ne fait pas partie de ses points de terminaison source." }
references:
  - title: What is Amazon AppFlow?
    url: https://docs.aws.amazon.com/appflow/latest/userguide/what-is-appflow.html
