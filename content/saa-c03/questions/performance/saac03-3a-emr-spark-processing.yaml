id: saac03-3a-emr-spark-processing
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company has existing Apache Spark applications that process about 50 TB of sales data every night. The company is moving the data to Amazon S3 and wants to keep running the Spark applications with minimal changes. The company does not want to install, configure or tune the Spark and Hadoop software on its own servers.

    Which AWS service should the company use?
  fr: |
    Une entreprise de distribution dispose d'applications Apache Spark existantes qui traitent chaque nuit environ 50 To de données de ventes. L'entreprise déplace les données vers Amazon S3 et souhaite continuer à exécuter les applications Spark avec un minimum de modifications. Elle ne veut pas installer, configurer ni optimiser elle-même les logiciels Spark et Hadoop sur ses propres serveurs.

    Quel service AWS l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Amazon EMR", fr: "Amazon EMR" }
    - id: b
      text: { en: "AWS Batch", fr: "AWS Batch" }
    - id: c
      text: { en: "AWS Lambda", fr: "AWS Lambda" }
    - id: d
      text: { en: "Amazon Kinesis Data Streams", fr: "Amazon Kinesis Data Streams" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon EMR is a managed cluster platform for big data frameworks such as Apache Spark and Hadoop. It provisions and configures the cluster software and reads and writes data in Amazon S3, so the existing Spark applications run with minimal changes.
    fr: |-
      Amazon EMR est une plateforme de clusters gérée pour les frameworks big data tels qu'Apache Spark et Hadoop. Il provisionne et configure les logiciels du cluster et lit et écrit les données dans Amazon S3 : les applications Spark existantes s'exécutent avec un minimum de modifications.
  options:
    b:
      en: |-
        AWS Batch schedules containerized jobs, but the company would have to build and maintain its own Spark environment inside the containers.
      fr: |-
        AWS Batch ordonnance des tâches conteneurisées, mais l'entreprise devrait créer et maintenir son propre environnement Spark dans les conteneurs.
    c:
      en: |-
        Lambda is an event-driven function service with short invocation time limits; it does not provide a Spark runtime for multi-terabyte distributed processing.
      fr: |-
        Lambda est un service de fonctions événementielles aux durées d'invocation limitées ; il ne fournit pas d'environnement Spark pour un traitement distribué de plusieurs téraoctets.
    d:
      en: |-
        Kinesis Data Streams ingests real-time streaming data; it does not run batch Spark applications.
      fr: |-
        Kinesis Data Streams ingère des données en streaming en temps réel ; il n'exécute pas d'applications Spark par lots.
references:
  - title: What is Amazon EMR? - Amazon EMR
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-what-is-emr.html
