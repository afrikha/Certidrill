id: saac03-3b-aurora-read-autoscaling
objective: "3.3.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A news company runs an Amazon Aurora MySQL DB cluster with one writer and two Aurora Replicas. Write traffic is stable, but read traffic spikes unpredictably when stories go viral, and the replicas reach 90% CPU. The company wants read capacity to follow demand automatically, and the application must start using new replicas without configuration changes.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise de presse exécute un cluster de bases de données Amazon Aurora MySQL avec une instance d'écriture et deux réplicas Aurora. Le trafic d'écriture est stable, mais le trafic de lecture augmente de façon imprévisible lorsque des articles deviennent viraux, et les réplicas atteignent 90 % d'utilisation du processeur. L'entreprise veut que la capacité de lecture suive automatiquement la demande, et l'application doit commencer à utiliser les nouveaux réplicas sans modification de configuration.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Scale the writer DB instance up to a larger instance class.", fr: "Faire évoluer l'instance d'écriture vers une classe d'instance plus grande." } }
    - { id: b, text: { en: "Configure the application to send its read queries to the instance endpoint of each replica.", fr: "Configurer l'application pour envoyer ses requêtes de lecture au point de terminaison d'instance de chaque réplica." } }
    - { id: c, text: { en: "Create an Aurora Auto Scaling policy that tracks the average CPU utilization of the replicas.", fr: "Créer une politique Aurora Auto Scaling qui suit l'utilisation moyenne du processeur des réplicas." } }
    - { id: d, text: { en: "Change the cluster storage configuration to Aurora I/O-Optimized.", fr: "Changer la configuration de stockage du cluster en Aurora I/O-Optimized." } }
    - { id: e, text: { en: "Configure the application to send its read queries to the cluster's reader endpoint.", fr: "Configurer l'application pour envoyer ses requêtes de lecture au point de terminaison du lecteur du cluster." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Aurora Auto Scaling uses a target tracking policy on a CloudWatch metric such as average replica CPU to add Aurora Replicas during spikes (up to 15) and remove them afterward. The reader endpoint balances connections across all available replicas, so the application uses new replicas without knowing their host names.
    fr: Aurora Auto Scaling applique une politique de suivi de cible sur une métrique CloudWatch, comme l'utilisation moyenne du processeur des réplicas, pour ajouter des réplicas Aurora pendant les pics (jusqu'à 15) et les supprimer ensuite. Le point de terminaison du lecteur répartit les connexions entre tous les réplicas disponibles ; l'application utilise donc les nouveaux réplicas sans connaître leurs noms d'hôte.
  options:
    a:
      en: The writer is not the bottleneck, and Aurora Auto Scaling does not scale the writer; a larger writer does not add read capacity on the replicas.
      fr: L'instance d'écriture n'est pas le goulot d'étranglement, et Aurora Auto Scaling ne la fait pas évoluer ; une instance d'écriture plus grande n'ajoute pas de capacité de lecture sur les réplicas.
    b:
      en: Instance endpoints point to fixed instances, so the application would need a configuration change for every replica that Aurora Auto Scaling adds.
      fr: Les points de terminaison d'instance désignent des instances fixes ; l'application devrait donc être reconfigurée pour chaque réplica ajouté par Aurora Auto Scaling.
    d:
      en: I/O-Optimized changes how storage I/O is billed; it does not add replicas or reduce replica CPU usage.
      fr: I/O-Optimized change la facturation des E/S de stockage ; il n'ajoute pas de réplicas et ne réduit pas l'utilisation du processeur des réplicas.
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
  - title: Amazon Aurora endpoint connections
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html
