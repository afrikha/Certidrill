id: saac03-3a-local-zones-latency
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A visual effects studio in the Los Angeles area wants to run virtual workstations for its video editors on Amazon EC2. The editors need very low latency between their offices and the workstations. The company has no data center, and it wants to manage the workstations in its existing VPC in the us-west-2 Region with the same AWS APIs and tools.

    Which solution will meet these requirements?
  fr: |
    Un studio d'effets visuels de la région de Los Angeles souhaite exécuter sur Amazon EC2 des stations de travail virtuelles pour ses monteurs vidéo. Les monteurs ont besoin d'une latence très faible entre leurs bureaux et les stations de travail. L'entreprise ne dispose d'aucun centre de données et veut gérer les stations de travail dans son VPC existant de la Région us-west-2, avec les mêmes API et outils AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Order an AWS Outposts rack and run the workstations on that rack.", fr: "Commander un rack AWS Outposts et y exécuter les stations de travail." }
    - id: b
      text: { en: "Enable the Los Angeles Local Zone and launch the workstations in a VPC subnet there.", fr: "Activer la Local Zone de Los Angeles et y lancer les stations de travail dans un sous-réseau du VPC." }
    - id: c
      text: { en: "Deploy the workstations in an AWS Wavelength Zone of a 5G carrier network.", fr: "Déployer les stations de travail dans une Wavelength Zone d'un opérateur 5G." }
    - id: d
      text: { en: "Launch the workstations in a cluster placement group in a us-west-2 Availability Zone.", fr: "Lancer les stations de travail dans un groupe de placement de cluster d'une zone de disponibilité de us-west-2." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A Local Zone is an extension of an AWS Region placed close to large population and industry centers, and virtual workstations are one of its listed low-latency use cases. You enable the zone, create a subnet in it that is part of the existing VPC, and launch resources there with the usual APIs.
    fr: |-
      Une Local Zone est une extension d'une Région AWS située près de grands centres de population et d'activité, et les stations de travail virtuelles font partie de ses cas d'usage à faible latence. On active la zone, on y crée un sous-réseau qui fait partie du VPC existant, puis on y lance des ressources avec les API habituelles.
  options:
    a:
      en: |-
        Outposts installs AWS infrastructure in the customer's own facility, and the studio has no data center to host it.
      fr: |-
        Outposts installe une infrastructure AWS dans les locaux du client, et le studio ne dispose d'aucun centre de données pour l'héberger.
    c:
      en: |-
        Wavelength Zones sit inside 5G carrier networks to serve mobile devices; the editors work from office networks.
      fr: |-
        Les Wavelength Zones se trouvent dans les réseaux des opérateurs 5G pour servir des appareils mobiles ; les monteurs travaillent depuis des réseaux de bureau.
    d:
      en: |-
        A cluster placement group lowers latency between instances in the group, not between the offices and the Region, which stays far away.
      fr: |-
        Un groupe de placement de cluster réduit la latence entre les instances du groupe, pas entre les bureaux et la Région, qui reste éloignée.
