id: saac03-3b-cache-lazy-ttl
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company caches user profiles in Amazon ElastiCache for Valkey by using lazy loading. Keys are written without an expiration. Over time, the cache has filled with profiles that are rarely read, and some cached profiles are days out of date. The company wants to limit how stale cached data can become and stop unused keys from accumulating, without changing the database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise met en cache des profils utilisateurs dans Amazon ElastiCache for Valkey en chargement différé (lazy loading). Les clés sont écrites sans expiration. Au fil du temps, le cache s'est rempli de profils rarement lus, et certains profils en cache ont plusieurs jours de retard. L'entreprise veut limiter le degré d'obsolescence des données en cache et empêcher l'accumulation de clés inutilisées, sans modifier la base de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace lazy loading with a write-through strategy that writes every profile update to the cache without an expiration.", fr: "Remplacer le chargement différé par une stratégie d'écriture simultanée qui écrit chaque mise à jour de profil dans le cache sans expiration." }
    - id: b
      text: { en: "Add more shards to the ElastiCache cluster so that the cache can hold every profile.", fr: "Ajouter des partitions (shards) au cluster ElastiCache afin que le cache puisse contenir tous les profils." }
    - id: c
      text: { en: "Migrate the cache to ElastiCache for Memcached so that the cache uses multithreaded nodes.", fr: "Migrer le cache vers ElastiCache for Memcached afin que le cache utilise des nœuds multithread." }
    - id: d
      text: { en: "Set a time to live (TTL) on every key that the application writes to the cache.", fr: "Définir une durée de vie (TTL) sur chaque clé que l'application écrit dans le cache." }
answer: { optionId: d }
explanation:
  correct:
    en: A TTL makes each key expire after a set number of seconds. The next read of an expired key is a miss that reloads fresh data from the database, which bounds staleness, and keys that are never read again expire instead of cluttering the cache.
    fr: Une TTL fait expirer chaque clé après un nombre de secondes défini. La lecture suivante d'une clé expirée est un échec de cache qui recharge des données à jour depuis la base, ce qui borne l'obsolescence, et les clés qui ne sont plus lues expirent au lieu d'encombrer le cache.
  options:
    a:
      en: Write-through without expiration keeps data fresh but writes every profile, read or not, which increases cache churn instead of reducing unused keys.
      fr: L'écriture simultanée sans expiration garde les données à jour mais écrit tous les profils, lus ou non, ce qui augmente l'encombrement du cache au lieu de réduire les clés inutilisées.
    b:
      en: More shards add capacity for unused keys, and cached profiles still never refresh.
      fr: Davantage de partitions ajoute de la capacité pour des clés inutilisées, et les profils en cache ne sont toujours jamais rafraîchis.
    c:
      en: Changing the engine does not change the caching strategy; without expiration, keys remain stale and accumulate.
      fr: Changer de moteur ne change pas la stratégie de mise en cache ; sans expiration, les clés restent obsolètes et s'accumulent.
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
