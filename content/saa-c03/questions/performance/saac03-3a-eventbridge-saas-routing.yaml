id: saac03-3a-eventbridge-saas-routing
objective: "3.2.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses a SaaS ticketing application that is an Amazon EventBridge partner. Every new ticket must be archived by an AWS Lambda function, and tickets with a priority field of "high" must also start an AWS Step Functions workflow. The company does not want to poll the SaaS API and wants to write as little integration code as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise une application SaaS de gestion de tickets partenaire d'Amazon EventBridge. Chaque nouveau ticket doit être archivé par une fonction AWS Lambda, et les tickets dont le champ de priorité vaut « high » doivent en plus démarrer un flux de travail AWS Step Functions. L'entreprise ne veut pas interroger l'API SaaS et souhaite écrire le moins de code d'intégration possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Schedule a Lambda function every minute to call the SaaS API, then invoke the archive function and the workflow.", fr: "Planifier une fonction Lambda chaque minute pour appeler l'API SaaS, puis appeler la fonction d'archivage et le flux de travail." }
    - id: b
      text: { en: "Associate the partner event source with an event bus and create EventBridge rules whose event patterns route events to the targets.", fr: "Associer la source d'événement partenaire à un bus d'événements et créer des règles EventBridge dont les modèles d'événements acheminent les événements vers les cibles." }
    - id: c
      text: { en: "Have the SaaS application send webhooks to an Amazon SQS queue that an EC2 instance reads to route the tickets.", fr: "Faire envoyer par l'application SaaS des webhooks vers une file d'attente Amazon SQS lue par une instance EC2 qui achemine les tickets." }
    - id: d
      text: { en: "Create an Amazon SNS topic for the tickets and subscribe both targets with a filter policy on the priority field.", fr: "Créer une rubrique Amazon SNS pour les tickets et y abonner les deux cibles avec une politique de filtre sur le champ de priorité." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A SaaS partner creates a partner event source that you accept by associating it with an event bus. EventBridge rules then match events by their content with event patterns, so one rule sends every ticket to the archive function and another sends only high-priority tickets to the workflow, with no polling or routing code.
    fr: |-
      Un partenaire SaaS crée une source d'événement partenaire que l'on accepte en l'associant à un bus d'événements. Des règles EventBridge filtrent ensuite les événements selon leur contenu grâce à des modèles d'événements : une règle envoie chaque ticket à la fonction d'archivage, une autre n'envoie que les tickets prioritaires au flux de travail, sans interrogation ni code de routage.
  options:
    a:
      en: |-
        Polling the SaaS API every minute adds code, delay and API calls, which the company wants to avoid.
      fr: |-
        Interroger l'API SaaS chaque minute ajoute du code, du délai et des appels d'API, ce que l'entreprise veut éviter.
    c:
      en: |-
        A custom router on EC2 adds a server and routing code to maintain.
      fr: |-
        Un routeur personnalisé sur EC2 ajoute un serveur et du code de routage à maintenir.
    d:
      en: |-
        The SaaS partner integration delivers events to EventBridge, not to an SNS topic, so the company would need code to bridge the events into SNS.
      fr: |-
        L'intégration du partenaire SaaS remet les événements à EventBridge, pas à une rubrique SNS : l'entreprise aurait besoin de code pour transférer les événements vers SNS.
references:
  - title: Receiving events from a SaaS partner with Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-saas.html
  - title: Rules in Amazon EventBridge - Amazon EventBridge
    url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-rules.html
