id: saac03-3c-tgw-growing-vpcs
objective: "3.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 12 VPCs in one AWS Region. The VPCs are connected to each other by a full mesh of VPC peering connections, and each VPC has its own AWS Site-to-Site VPN connection to the on-premises data center. The company plans to add 30 more VPCs over the next year. Every VPC must be able to reach every other VPC and the data center.

    The company wants a network design that scales with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 12 VPC dans une Région AWS. Les VPC sont reliés entre eux par un maillage complet de connexions d'appairage de VPC (VPC peering), et chaque VPC possède sa propre connexion AWS Site-to-Site VPN vers le centre de données sur site. L'entreprise prévoit d'ajouter 30 VPC au cours de l'année. Chaque VPC doit pouvoir joindre tous les autres VPC ainsi que le centre de données.

    L'entreprise souhaite une conception réseau qui évolue avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Keep the full mesh and use AWS CloudFormation to create the peering connections and routes for each new VPC.", fr: "Conserver le maillage complet et utiliser AWS CloudFormation pour créer les connexions d'appairage et les routes de chaque nouveau VPC." } }
    - { id: b, text: { en: "Peer every VPC with a single hub VPC and route on-premises traffic through the VPN connection of the hub VPC.", fr: "Appairer chaque VPC à un unique VPC central et acheminer le trafic sur site par la connexion VPN du VPC central." } }
    - { id: c, text: { en: "Create a transit gateway, attach every VPC and one Site-to-Site VPN connection to it, and route through its route tables.", fr: "Créer une passerelle de transit, y attacher chaque VPC et une seule connexion Site-to-Site VPN, et router via ses tables de routage." } }
    - { id: d, text: { en: "Publish an endpoint service in each VPC with AWS PrivateLink and create interface endpoints in every other VPC.", fr: "Publier un service de point de terminaison dans chaque VPC avec AWS PrivateLink et créer des points de terminaison d'interface dans tous les autres VPC." } }
answer: { optionId: c }
explanation:
  correct:
    en: A transit gateway is a regional hub that interconnects VPCs and on-premises networks. Each new VPC needs only one attachment, and a single VPN (or Direct Connect gateway) attachment serves all VPCs through the transit gateway route tables, so the number of connections grows linearly instead of quadratically.
    fr: "Une passerelle de transit est un hub régional qui interconnecte des VPC et des réseaux sur site. Chaque nouveau VPC ne demande qu'un attachement, et un seul attachement VPN (ou passerelle Direct Connect) dessert tous les VPC via les tables de routage de la passerelle de transit : le nombre de connexions croît de façon linéaire et non plus quadratique."
  options:
    a: { en: "Automation does not change the fact that 42 VPCs need 861 peering connections, plus one VPN per VPC: the design remains hard to operate.", fr: "L'automatisation ne change rien au fait que 42 VPC exigent 861 connexions d'appairage, plus un VPN par VPC : la conception reste difficile à exploiter." }
    b: { en: "VPC peering is not transitive: spoke VPCs cannot reach each other or use the VPN connection of the hub VPC.", fr: "L'appairage de VPC n'est pas transitif : les VPC périphériques ne peuvent ni se joindre entre eux ni utiliser la connexion VPN du VPC central." }
    d: { en: "PrivateLink exposes individual services in one direction; it does not provide general routing between networks or to the data center.", fr: "PrivateLink expose des services précis dans un seul sens ; il ne fournit pas de routage général entre réseaux ni vers le centre de données." }
references:
  - title: What is AWS Transit Gateway for Amazon VPC?
    url: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
