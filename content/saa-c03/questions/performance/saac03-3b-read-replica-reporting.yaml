id: saac03-3b-read-replica-reporting
objective: "3.3.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its order application on an Amazon RDS for PostgreSQL DB instance. Analysts run long reporting queries during business hours, and order processing slows down while the reports run. The reports can use data that is a few minutes behind production.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute son application de commandes sur une instance de base de données Amazon RDS for PostgreSQL. Des analystes exécutent de longues requêtes de reporting pendant les heures ouvrées, et le traitement des commandes ralentit pendant l'exécution des rapports. Les rapports peuvent utiliser des données en retard de quelques minutes sur la production.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable Multi-AZ on the DB instance and run the reports on the standby.", fr: "Activer Multi-AZ sur l'instance de base de données et exécuter les rapports sur l'instance de secours." }
    - id: b
      text: { en: "Create a read replica of the DB instance and run the reports on it.", fr: "Créer un réplica en lecture de l'instance de base de données et y exécuter les rapports." }
    - id: c
      text: { en: "Restore the latest automated snapshot to a new DB instance each night and run the reports on it.", fr: "Restaurer chaque nuit le dernier instantané automatisé dans une nouvelle instance de base de données et y exécuter les rapports." }
    - id: d
      text: { en: "Run the reports against the DB instance through an Amazon RDS Proxy endpoint.", fr: "Exécuter les rapports sur l'instance de base de données via un point de terminaison Amazon RDS Proxy." }
answer: { optionId: b }
explanation:
  correct:
    en: A read replica is a read-only copy that RDS updates asynchronously from the primary, so reporting queries run on separate compute and stop competing with order processing. A replication lag of a few minutes is acceptable here.
    fr: Un réplica en lecture est une copie en lecture seule que RDS met à jour de façon asynchrone depuis l'instance principale ; les requêtes de reporting s'exécutent sur une capacité de calcul distincte et ne concurrencent plus le traitement des commandes. Un retard de réplication de quelques minutes est acceptable ici.
  options:
    a:
      en: The standby of a Multi-AZ DB instance deployment cannot serve read traffic.
      fr: L'instance de secours d'un déploiement d'instance de base de données Multi-AZ ne peut pas servir de trafic de lecture.
    c:
      en: Nightly restores give data up to a day old during business hours, which exceeds the few minutes allowed.
      fr: Des restaurations nocturnes fournissent pendant les heures ouvrées des données vieilles d'un jour au plus, ce qui dépasse les quelques minutes autorisées.
    d:
      en: RDS Proxy pools connections, but the queries still run on the same DB instance and keep competing with order processing.
      fr: RDS Proxy mutualise les connexions, mais les requêtes s'exécutent toujours sur la même instance et continuent de concurrencer le traitement des commandes.
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
