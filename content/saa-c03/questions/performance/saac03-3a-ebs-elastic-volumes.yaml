id: saac03-3a-ebs-elastic-volumes
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A production application runs on a current-generation Amazon EC2 instance. Its 500 GiB Amazon EBS gp3 data volume is almost full, and the company expects the data to quadruple this year. The company must increase the volume to 2 TiB and raise its provisioned IOPS without downtime and with the LEAST operational effort.

    Which solution will meet these requirements?
  fr: |
    Une application de production s'exécute sur une instance Amazon EC2 de génération actuelle. Son volume de données Amazon EBS gp3 de 500 Gio est presque plein, et l'entreprise prévoit que les données quadrupleront cette année. L'entreprise doit porter le volume à 2 Tio et augmenter ses IOPS provisionnées sans interruption de service et avec le MOINS d'effort opérationnel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a snapshot, create a 2 TiB volume from it, stop the instance, and swap the volumes.", fr: "Créer un instantané, créer un volume de 2 Tio à partir de celui-ci, arrêter l'instance et échanger les volumes." }
    - id: b
      text: { en: "Attach a second 2 TiB volume and copy the data to it with rsync, then detach the old volume.", fr: "Attacher un second volume de 2 Tio et y copier les données avec rsync, puis détacher l'ancien volume." }
    - id: c
      text: { en: "Change the instance to a larger instance type so that it gets more EBS bandwidth and storage.", fr: "Passer à un type d'instance plus grand afin d'obtenir plus de bande passante EBS et de stockage." }
    - id: d
      text: { en: "Modify the volume size and IOPS with Elastic Volumes, then extend the file system.", fr: "Modifier la taille et les IOPS du volume avec Elastic Volumes, puis étendre le système de fichiers." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Elastic Volumes lets you increase the size and change the type, IOPS and throughput of an attached volume without detaching it or restarting the instance. After the modification reaches the optimizing state, you extend the file system to use the new space.
    fr: |-
      Elastic Volumes permet d'augmenter la taille et de modifier le type, les IOPS et le débit d'un volume attaché sans le détacher ni redémarrer l'instance. Une fois la modification à l'état optimizing, il suffit d'étendre le système de fichiers pour utiliser le nouvel espace.
  options:
    a:
      en: |-
        Stopping the instance to swap volumes causes downtime and takes more steps than an in-place modification.
      fr: |-
        Arrêter l'instance pour échanger les volumes entraîne une interruption de service et demande plus d'étapes qu'une modification sur place.
    b:
      en: |-
        Copying data to a new volume and switching the application over takes much more effort and needs a cutover window.
      fr: |-
        Copier les données vers un nouveau volume et y basculer l'application demande beaucoup plus d'effort et une fenêtre de bascule.
    c:
      en: |-
        The instance type does not change the size of an EBS volume; resizing an instance also requires stopping it.
      fr: |-
        Le type d'instance ne change pas la taille d'un volume EBS ; redimensionner une instance exige en outre de l'arrêter.
references:
  - title: Modify an Amazon EBS volume using Elastic Volumes operations - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html
