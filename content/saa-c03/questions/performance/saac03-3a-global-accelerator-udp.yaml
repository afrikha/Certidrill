id: saac03-3a-global-accelerator-udp
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company runs its multiplayer game servers on Amazon EC2 instances behind Network Load Balancers in two AWS Regions. The game uses a custom UDP protocol. Players' networks must allow traffic to a small, fixed set of IP addresses, and player traffic should travel over the AWS global network as early as possible. If the endpoints in one Region become unhealthy, traffic must move to the other Region in less than a minute.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux exécute ses serveurs de jeu multijoueur sur des instances Amazon EC2 derrière des Network Load Balancers dans deux Régions AWS. Le jeu utilise un protocole UDP personnalisé. Les réseaux des joueurs doivent autoriser le trafic vers un petit ensemble fixe d'adresses IP, et le trafic des joueurs doit emprunter le réseau mondial AWS le plus tôt possible. Si les points de terminaison d'une Région deviennent défaillants, le trafic doit basculer vers l'autre Région en moins d'une minute.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon CloudFront distribution with both Network Load Balancers as origins in an origin group.", fr: "Créer une distribution Amazon CloudFront avec les deux Network Load Balancers comme origines d'un groupe d'origines." }
    - id: b
      text: { en: "Create Amazon Route 53 failover records that point to the two Network Load Balancers.", fr: "Créer des enregistrements de basculement Amazon Route 53 qui pointent vers les deux Network Load Balancers." }
    - id: c
      text: { en: "Create an AWS Global Accelerator standard accelerator with both Network Load Balancers as endpoints.", fr: "Créer un accélérateur standard AWS Global Accelerator avec les deux Network Load Balancers comme points de terminaison." }
    - id: d
      text: { en: "Replace the Network Load Balancers with Application Load Balancers that have Elastic IP addresses.", fr: "Remplacer les Network Load Balancers par des Application Load Balancers dotés d'adresses IP Elastic." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Global Accelerator gives the application static anycast IP addresses from the AWS edge network and carries TCP or UDP traffic over the AWS global network to the optimal healthy regional endpoint. It suits UDP gaming and can take an unhealthy endpoint out of service in under a minute.
    fr: |-
      Global Accelerator attribue à l'application des adresses IP anycast statiques issues du réseau périphérique AWS et transporte le trafic TCP ou UDP via le réseau mondial AWS jusqu'au point de terminaison régional sain optimal. Il convient aux jeux en UDP et peut retirer du service un point de terminaison défaillant en moins d'une minute.
  options:
    a:
      en: |-
        CloudFront delivers HTTP and HTTPS content; it does not carry a custom UDP protocol, and it does not provide a fixed set of IP addresses.
      fr: |-
        CloudFront diffuse du contenu HTTP et HTTPS ; il ne transporte pas un protocole UDP personnalisé et ne fournit pas un ensemble fixe d'adresses IP.
    b:
      en: |-
        DNS failover returns the load balancers' own addresses, depends on client DNS caching, and does not route traffic onto the AWS network at the edge.
      fr: |-
        Le basculement DNS renvoie les adresses propres des équilibreurs de charge, dépend de la mise en cache DNS des clients et n'achemine pas le trafic sur le réseau AWS dès la périphérie.
    d:
      en: |-
        Application Load Balancers handle HTTP and HTTPS only, so they cannot serve the UDP game traffic, and they cannot use Elastic IP addresses.
      fr: |-
        Les Application Load Balancers ne gèrent que HTTP et HTTPS : ils ne peuvent pas servir le trafic de jeu UDP et ne peuvent pas utiliser d'adresses IP Elastic.
references:
