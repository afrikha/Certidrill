id: saac03-3c-s3-file-gateway-smb
objective: "3.5.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's on-premises applications read and write files on SMB shares, and the local storage array is almost full. The company wants to store the data durably in Amazon S3 and manage it with S3 Lifecycle policies. The applications must keep using SMB without any change, with low-latency access to recently used files.

    Which solution will meet these requirements?
  fr: |
    Les applications sur site d'une entreprise lisent et écrivent des fichiers sur des partages SMB, et la baie de stockage locale est presque pleine. L'entreprise souhaite stocker les données de façon durable dans Amazon S3 et les gérer avec des politiques S3 Lifecycle. Les applications doivent continuer à utiliser SMB sans aucune modification, avec un accès à faible latence aux fichiers récemment utilisés.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Use AWS DataSync to copy the shares to S3 every night and delete the copied files from the local array.", fr: "Utiliser AWS DataSync pour copier les partages dans S3 chaque nuit et supprimer les fichiers copiés de la baie locale." } }
    - { id: b, text: { en: "Deploy a Volume Gateway with stored volumes and attach the volumes to the application servers over iSCSI.", fr: "Déployer une Volume Gateway avec des volumes stockés et attacher les volumes aux serveurs d'applications via iSCSI." } }
    - { id: c, text: { en: "Deploy Amazon S3 File Gateway on premises and create an SMB file share that is backed by an S3 bucket.", fr: "Déployer Amazon S3 File Gateway sur site et créer un partage de fichiers SMB adossé à un compartiment S3." } }
    - { id: d, text: { en: "Create an AWS Transfer Family server that stores files in S3 and point the applications to it.", fr: "Créer un serveur AWS Transfer Family qui stocke les fichiers dans S3 et y diriger les applications." } }
answer: { optionId: c }
explanation:
  correct:
    en: Amazon S3 File Gateway presents NFS and SMB file shares on premises and stores the files as objects in Amazon S3, where lifecycle policies, versioning and replication apply. Its local cache gives low-latency access to recently used data, so the applications keep their SMB access unchanged.
    fr: "Amazon S3 File Gateway présente des partages de fichiers NFS et SMB sur site et stocke les fichiers sous forme d'objets dans Amazon S3, où s'appliquent les politiques de cycle de vie, la gestion des versions et la réplication. Son cache local offre un accès à faible latence aux données récemment utilisées : les applications conservent leur accès SMB sans modification."
  options:
    a: { en: "Once files are deleted locally, the applications can no longer open them over SMB.", fr: "Une fois les fichiers supprimés localement, les applications ne peuvent plus les ouvrir via SMB." }
    b: { en: "Volume Gateway presents iSCSI block volumes, not SMB shares, and keeps the full dataset on premises with stored volumes.", fr: "Volume Gateway présente des volumes en mode bloc iSCSI, pas des partages SMB, et conserve tout le jeu de données sur site avec les volumes stockés." }
    d: { en: "Transfer Family offers SFTP, FTPS, FTP and AS2 endpoints, not SMB shares, so the applications would have to change.", fr: "Transfer Family propose des points de terminaison SFTP, FTPS, FTP et AS2, pas des partages SMB : les applications devraient être modifiées." }
references:
  - title: What is Amazon S3 File Gateway
    url: https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html
