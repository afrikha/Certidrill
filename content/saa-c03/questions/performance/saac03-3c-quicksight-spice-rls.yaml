id: saac03-3c-quicksight-spice-rls
objective: "3.5.11"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company publishes an AWS Quick Sight dashboard (Enterprise edition) to 200 regional sales managers. The dataset uses direct query against Amazon Athena, and every visual change runs new queries, so the dashboard is slow and Athena costs are rising. The data changes once a day. Each manager must see only the sales of their own region in the same dashboard.

    Which combination of actions will meet these requirements with the LEAST operational overhead? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise publie un tableau de bord AWS Quick Sight (édition Enterprise) pour 200 responsables commerciaux régionaux. Le jeu de données utilise une requête directe vers Amazon Athena, et chaque modification d'un visuel exécute de nouvelles requêtes : le tableau de bord est lent et les coûts Athena augmentent. Les données changent une fois par jour. Chaque responsable ne doit voir que les ventes de sa région dans le même tableau de bord.

    Quelle combinaison d'actions répond à ces exigences avec le MOINS de charge opérationnelle possible ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Grant each manager an IAM policy that limits s3:GetObject to the S3 prefix of the manager's region.", fr: "Accorder à chaque responsable une politique IAM qui limite s3:GetObject au préfixe S3 de sa région." } }
    - { id: b, text: { en: "Create one Athena workgroup per region with a per-query data usage limit.", fr: "Créer un groupe de travail Athena par région avec une limite d'utilisation des données par requête." } }
    - { id: c, text: { en: "Import the dataset into SPICE and schedule a daily refresh after the data changes.", fr: "Importer le jeu de données dans SPICE et planifier une actualisation quotidienne après la modification des données." } }
    - { id: d, text: { en: "Create one dataset and one dashboard copy per region and share each copy with the managers of that region.", fr: "Créer un jeu de données et une copie du tableau de bord par région et partager chaque copie avec les responsables de cette région." } }
    - { id: e, text: { en: "Apply row-level security to the dataset with a permissions dataset that maps each manager to a region.", fr: "Appliquer la sécurité au niveau des lignes au jeu de données avec un jeu de données d'autorisations qui associe chaque responsable à une région." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: SPICE is the in-memory engine of Quick Sight; dashboards query the imported copy instead of the source, which speeds up analyses, and with a per-query data source such as Athena the company pays only when the dataset is created and refreshed. Row-level security with a permissions dataset filters the rows that each user or group can see in the shared dashboard.
    fr: "SPICE est le moteur en mémoire de Quick Sight ; les tableaux de bord interrogent la copie importée plutôt que la source, ce qui accélère les analyses, et avec une source facturée à la requête comme Athena l'entreprise ne paie qu'à la création et à l'actualisation du jeu de données. La sécurité au niveau des lignes avec un jeu de données d'autorisations filtre les lignes que chaque utilisateur ou groupe voit dans le tableau de bord partagé."
  options:
    a: { en: "Quick Sight reads the data with its own permissions, so IAM policies on the managers do not filter what the dashboard shows them.", fr: "Quick Sight lit les données avec ses propres autorisations : des politiques IAM attribuées aux responsables ne filtrent pas ce que le tableau de bord leur montre." }
    b: { en: "Workgroups separate query settings and cost controls; they neither speed up the dashboard nor filter rows per manager.", fr: "Les groupes de travail séparent les paramètres et les contrôles de coûts des requêtes ; ils n'accélèrent pas le tableau de bord et ne filtrent pas les lignes par responsable." }
    d: { en: "Per-region copies multiply the datasets and dashboards to maintain, which is more overhead than one dashboard with row-level security.", fr: "Des copies par région multiplient les jeux de données et tableaux de bord à maintenir, soit plus de charge qu'un seul tableau de bord avec sécurité au niveau des lignes." }
references:
  - title: Importing data into SPICE
    url: https://docs.aws.amazon.com/quicksight/latest/user/spice.html
  - title: Using row-level security with user-based rules to restrict access to a dataset
    url: https://docs.aws.amazon.com/quicksight/latest/user/restrict-access-to-a-data-set-using-row-level-security.html
