id: saac03-3a-graviton-price-performance
objective: "3.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a fleet of Java microservices on general purpose x86-based Amazon EC2 instances. The services run on the JVM and do not depend on any native x86 libraries. The company wants better price performance for this general purpose workload with minimal or no changes to the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un parc de microservices Java sur des instances Amazon EC2 à usage général basées sur x86. Les services s'exécutent sur la JVM et ne dépendent d'aucune bibliothèque native x86. L'entreprise souhaite un meilleur rapport prix/performances pour cette charge à usage général, avec peu ou pas de modifications du code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Move the services to memory optimized instances of the X family.", fr: "Déplacer les services vers des instances optimisées pour la mémoire de la famille X." }
    - id: b
      text: { en: "Move the services to Graviton-based general purpose instances, such as M7g.", fr: "Déplacer les services vers des instances à usage général Graviton, comme M7g." }
    - id: c
      text: { en: "Move the services to EC2 Dedicated Hosts of the same instance family.", fr: "Déplacer les services vers des hôtes dédiés EC2 de la même famille d'instances." }
    - id: d
      text: { en: "Rewrite the services as AWS Lambda functions behind API Gateway.", fr: "Réécrire les services sous forme de fonctions AWS Lambda derrière API Gateway." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Instances powered by AWS Graviton (Arm-based, with a g in the family name such as M7g) are designed to give better price performance than comparable x86 instances. Applications in interpreted or JVM languages such as Java run on them with minimal or no changes when they do not rely on native x86 instructions.
    fr: |-
      Les instances équipées de processeurs AWS Graviton (architecture Arm, avec un g dans le nom de famille comme M7g) sont conçues pour offrir un meilleur rapport prix/performances que des instances x86 comparables. Les applications écrites dans des langages interprétés ou JVM comme Java s'y exécutent avec peu ou pas de modifications lorsqu'elles ne dépendent pas d'instructions x86 natives.
  options:
    a:
      en: |-
        Memory optimized instances cost more for a general purpose workload that does not need a large memory ratio.
      fr: |-
        Les instances optimisées pour la mémoire coûtent plus cher pour une charge à usage général qui n'a pas besoin d'un rapport mémoire élevé.
    c:
      en: |-
        Dedicated Hosts provide physical servers for licensing or compliance needs and cost more; they do not improve price performance.
      fr: |-
        Les hôtes dédiés fournissent des serveurs physiques pour des besoins de licences ou de conformité et coûtent plus cher ; ils n'améliorent pas le rapport prix/performances.
    d:
      en: |-
        Rewriting microservices as functions is a major code change, which the company wants to avoid.
      fr: |-
        Réécrire les microservices en fonctions est une modification majeure du code, ce que l'entreprise veut éviter.
references:
