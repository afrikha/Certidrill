id: saac03-3b-dx-ipsec-encryption
objective: "3.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A bank needs connectivity between its data center and a VPC that provides the consistent low latency of a dedicated connection. A compliance rule also requires that all traffic between the data center and the VPC is encrypted end to end with IPsec.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une banque a besoin d'une connectivité entre son centre de données et un VPC qui offre la latence faible et constante d'une connexion dédiée. Une règle de conformité exige aussi que tout le trafic entre le centre de données et le VPC soit chiffré de bout en bout avec IPsec.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an AWS Client VPN endpoint for the data center servers.", fr: "Créer un point de terminaison AWS Client VPN pour les serveurs du centre de données." } }
    - { id: b, text: { en: "Order an AWS Direct Connect connection and create a public virtual interface.", fr: "Commander une connexion AWS Direct Connect et créer une interface virtuelle publique." } }
    - { id: c, text: { en: "Create a Site-to-Site VPN connection that uses only the internet as its transport.", fr: "Créer une connexion Site-to-Site VPN qui utilise uniquement Internet comme transport." } }
    - { id: d, text: { en: "Create interface VPC endpoints for every service that the data center uses.", fr: "Créer des points de terminaison d'interface de VPC pour chaque service utilisé par le centre de données." } }
    - { id: e, text: { en: "Create a Site-to-Site VPN connection to the virtual private gateway over the Direct Connect connection.", fr: "Créer une connexion Site-to-Site VPN vers la passerelle réseau privé virtuel par l'intermédiaire de la connexion Direct Connect." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: A Direct Connect public virtual interface gives a dedicated path to public AWS endpoints, including the Site-to-Site VPN endpoints. IPsec VPN tunnels to the VPC's virtual private gateway over that path combine end-to-end IPsec encryption with the low, consistent latency of Direct Connect.
    fr: Une interface virtuelle publique Direct Connect offre un chemin dédié vers les points de terminaison AWS publics, y compris ceux de Site-to-Site VPN. Des tunnels VPN IPsec vers la passerelle réseau privé virtuel du VPC sur ce chemin combinent le chiffrement IPsec de bout en bout et la latence faible et constante de Direct Connect.
  options:
    a:
      en: Client VPN connects individual users over the internet; it is not a site-to-site design and does not use a dedicated connection.
      fr: Client VPN connecte des utilisateurs individuels via Internet ; ce n'est pas une architecture de site à site et elle n'utilise pas de connexion dédiée.
    c:
      en: An internet-only VPN provides IPsec but its latency varies with internet conditions, which fails the consistency requirement.
      fr: Un VPN uniquement sur Internet fournit IPsec, mais sa latence varie selon l'état d'Internet, ce qui ne satisfait pas l'exigence de constance.
    d:
      en: Interface endpoints give private access to services from inside the VPC; they provide neither the hybrid connection nor IPsec encryption.
      fr: Les points de terminaison d'interface donnent un accès privé aux services depuis le VPC ; ils ne fournissent ni la connexion hybride ni le chiffrement IPsec.
references:
  - title: AWS Direct Connect + AWS Site-to-Site VPN
    url: https://docs.aws.amazon.com/whitepapers/latest/aws-vpc-connectivity-options/aws-direct-connect-site-to-site-vpn.html
