id: saac03-3b-transit-gateway-hub
objective: "3.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 40 VPCs in one AWS Region and a Site-to-Site VPN connection to its data center. The VPCs are connected by a growing mesh of VPC peering connections that is hard to manage, and the data center cannot reach most VPCs. The company wants a central hub that routes traffic between all VPCs and the data center.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 40 VPC dans une Région AWS et une connexion Site-to-Site VPN vers son centre de données. Les VPC sont reliés par un maillage croissant d'appairages de VPC difficile à gérer, et le centre de données ne peut pas joindre la plupart des VPC. L'entreprise veut un concentrateur central qui achemine le trafic entre tous les VPC et le centre de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add the missing VPC peering connections so that every VPC is peered with every other VPC.", fr: "Ajouter les appairages de VPC manquants afin que chaque VPC soit appairé avec tous les autres." }
    - id: b
      text: { en: "Create a transit gateway, attach all VPCs, and attach the VPN connection to the transit gateway.", fr: "Créer une passerelle de transit, y attacher tous les VPC et y attacher la connexion VPN." }
    - id: c
      text: { en: "Configure AWS VPN CloudHub on the virtual private gateway of one VPC.", fr: "Configurer AWS VPN CloudHub sur la passerelle réseau privé virtuel d'un VPC." }
    - id: d
      text: { en: "Create a VPC endpoint service in each VPC and interface endpoints in the other VPCs.", fr: "Créer un service de point de terminaison de VPC dans chaque VPC et des points de terminaison d'interface dans les autres VPC." }
answer: { optionId: b }
explanation:
  correct:
    en: A transit gateway is a Regional network transit hub that interconnects VPCs and on-premises networks. Each VPC and the VPN connection is one attachment, and transit gateway route tables route traffic between any attachments, which replaces the peering mesh.
    fr: Une passerelle de transit est un concentrateur réseau régional qui interconnecte des VPC et des réseaux sur site. Chaque VPC et la connexion VPN constituent chacun un attachement, et les tables de routage de la passerelle de transit acheminent le trafic entre les attachements, ce qui remplace le maillage d'appairages.
  options:
    a:
      en: A full mesh of 40 VPCs needs 780 peering connections, and peering is not transitive, so the data center still cannot reach VPCs through the VPN.
      fr: Un maillage complet de 40 VPC demande 780 appairages, et l'appairage n'est pas transitif ; le centre de données ne peut donc toujours pas joindre les VPC via le VPN.
    c:
      en: VPN CloudHub lets several on-premises sites communicate through one virtual private gateway; it does not route between VPCs.
      fr: VPN CloudHub permet à plusieurs sites sur site de communiquer via une passerelle réseau privé virtuel ; il n'achemine pas le trafic entre VPC.
    d:
      en: PrivateLink exposes individual services one way; it does not provide general routing between VPCs and the data center.
      fr: PrivateLink expose des services individuels dans un seul sens ; il ne fournit pas de routage général entre les VPC et le centre de données.
references:
  - title: What is AWS Transit Gateway for Amazon VPC?
    url: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
