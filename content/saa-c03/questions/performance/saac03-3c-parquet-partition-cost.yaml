id: saac03-3c-parquet-partition-cost
objective: "3.5.14"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company stores 3 years of web server logs as uncompressed CSV files in a single Amazon S3 prefix. Analysts use Amazon Athena, and most queries read a few columns for a single day. Queries are slow, and the company pays for the large amount of data that each query scans.

    Which actions will reduce the amount of data scanned by the queries? (Choose two.)

    Each correct answer presents a complete solution.
  fr: |
    Une entreprise stocke 3 ans de journaux de serveur web sous forme de fichiers CSV non compressés dans un seul préfixe Amazon S3. Les analystes utilisent Amazon Athena, et la plupart des requêtes lisent quelques colonnes pour une seule journée. Les requêtes sont lentes, et l'entreprise paie pour la grande quantité de données que chaque requête analyse.

    Quelles actions réduisent la quantité de données analysées par les requêtes ? (Choisissez-en deux.)

    Chaque bonne réponse constitue une solution complète.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Convert the files to Apache Parquet.", fr: "Convertir les fichiers en Apache Parquet." } }
    - { id: b, text: { en: "Move the files to the S3 Standard-IA storage class.", fr: "Déplacer les fichiers vers la classe de stockage S3 Standard-IA." } }
    - { id: c, text: { en: "Split the files into many smaller CSV files in the same prefix.", fr: "Découper les fichiers en de nombreux fichiers CSV plus petits dans le même préfixe." } }
    - { id: d, text: { en: "Partition the data by date and filter on the partition column in the queries.", fr: "Partitionner les données par date et filtrer sur la colonne de partition dans les requêtes." } }
    - { id: e, text: { en: "Enable S3 Versioning on the bucket.", fr: "Activer la gestion des versions S3 sur le compartiment." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: Parquet is a columnar format compressed by column, and Athena uses block statistics to skip data, so queries that need a few columns read far less data. Partitioning by date lets Athena scan only the partitions named in the WHERE clause, which reduces the data scanned and the cost.
    fr: "Parquet est un format en colonnes compressé par colonne, et Athena utilise les statistiques des blocs pour ignorer des données : les requêtes qui ont besoin de quelques colonnes lisent beaucoup moins de données. Le partitionnement par date permet à Athena de n'analyser que les partitions indiquées dans la clause WHERE, ce qui réduit les données analysées et le coût."
  options:
    b: { en: "The storage class changes storage price and adds retrieval fees; Athena still scans the same data.", fr: "La classe de stockage change le prix du stockage et ajoute des frais d'extraction ; Athena analyse toujours les mêmes données." }
    c: { en: "Many small files in one prefix still hold all rows and columns, and they add per-file overhead to each query.", fr: "De nombreux petits fichiers dans un même préfixe contiennent toujours toutes les lignes et colonnes, et ajoutent une surcharge par fichier à chaque requête." }
    e: { en: "Versioning keeps previous object versions; it does not change what a query reads.", fr: "La gestion des versions conserve les versions précédentes des objets ; elle ne change pas ce qu'une requête lit." }
references:
  - title: Use columnar storage formats
    url: https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html
  - title: Partition your data
    url: https://docs.aws.amazon.com/athena/latest/ug/partitions.html
