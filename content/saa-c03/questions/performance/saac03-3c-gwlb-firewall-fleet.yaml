id: saac03-3c-gwlb-firewall-fleet
objective: "3.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must inspect all inbound and outbound traffic of its application VPCs with a third-party firewall appliance from AWS Marketplace that runs on Amazon EC2. The fleet of appliances must scale horizontally, and the inspection must be transparent to the applications, without any change to their configuration.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise doit inspecter tout le trafic entrant et sortant de ses VPC applicatifs avec une appliance de pare-feu tierce d'AWS Marketplace qui s'exécute sur Amazon EC2. La flotte d'appliances doit évoluer horizontalement, et l'inspection doit être transparente pour les applications, sans aucune modification de leur configuration.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Place the appliances behind a Gateway Load Balancer in a security VPC and route application traffic through Gateway Load Balancer endpoints.", fr: "Placer les appliances derrière un Gateway Load Balancer dans un VPC de sécurité et router le trafic applicatif via des points de terminaison Gateway Load Balancer." } }
    - { id: b, text: { en: "Place the appliances behind a Network Load Balancer and configure each application to use the load balancer as its proxy.", fr: "Placer les appliances derrière un Network Load Balancer et configurer chaque application pour utiliser l'équilibreur de charge comme proxy." } }
    - { id: c, text: { en: "Place the appliances behind an Application Load Balancer and register them in a target group that uses the HTTP protocol.", fr: "Placer les appliances derrière un Application Load Balancer et les enregistrer dans un groupe cible qui utilise le protocole HTTP." } }
    - { id: d, text: { en: "Run one large appliance instance and point the default route of every application subnet to its network interface.", fr: "Exécuter une seule grande instance d'appliance et faire pointer la route par défaut de chaque sous-réseau applicatif vers son interface réseau." } }
answer: { optionId: a }
explanation:
  correct:
    en: A Gateway Load Balancer is built for third-party virtual appliances such as firewalls and IDS/IPS. It works at layer 3 as a transparent gateway, exchanges traffic with the appliances using GENEVE on port 6081, keeps flows sticky to one appliance and scales the fleet. Route tables send application traffic to Gateway Load Balancer endpoints, so applications need no change.
    fr: "Un Gateway Load Balancer est conçu pour les appliances virtuelles tierces comme les pare-feu et les IDS/IPS. Il fonctionne en couche 3 comme une passerelle transparente, échange le trafic avec les appliances via GENEVE sur le port 6081, maintient chaque flux sur la même appliance et met la flotte à l'échelle. Les tables de routage envoient le trafic applicatif vers des points de terminaison Gateway Load Balancer, sans modification des applications."
  options:
    b: { en: "Configuring each application to use a proxy is a change to the applications and is not transparent inspection.", fr: "Configurer chaque application pour utiliser un proxy modifie les applications et ne constitue pas une inspection transparente." }
    c: { en: "An Application Load Balancer handles HTTP and HTTPS requests only; it cannot forward all IP traffic transparently to appliances.", fr: "Un Application Load Balancer ne traite que les requêtes HTTP et HTTPS ; il ne peut pas transmettre tout le trafic IP de façon transparente vers des appliances." }
    d: { en: "A single instance does not scale horizontally and is a single point of failure.", fr: "Une instance unique n'évolue pas horizontalement et constitue un point de défaillance unique." }
references:
  - title: What is a Gateway Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
