id: saac03-3b-oracle-to-aurora-pg
objective: "3.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company plans to migrate an on-premises Oracle database to Amazon Aurora PostgreSQL-Compatible Edition. The database contains tables, views and PL/SQL stored procedures. The Oracle database must stay in production during the migration, and the cutover must cause minimal downtime.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise prévoit de migrer une base de données Oracle sur site vers Amazon Aurora PostgreSQL-Compatible Edition. La base contient des tables, des vues et des procédures stockées PL/SQL. La base Oracle doit rester en production pendant la migration, et la bascule doit entraîner un temps d'arrêt minimal.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Export the data with Oracle Data Pump and import the dump file into Aurora PostgreSQL.", fr: "Exporter les données avec Oracle Data Pump et importer le fichier de vidage dans Aurora PostgreSQL." } }
    - { id: b, text: { en: "Use DMS Schema Conversion to convert the schema and code objects to PostgreSQL.", fr: "Utiliser DMS Schema Conversion pour convertir le schéma et les objets de code vers PostgreSQL." } }
    - { id: c, text: { en: "Create an Aurora Replica of the on-premises Oracle database and promote it at cutover.", fr: "Créer un réplica Aurora de la base Oracle sur site et le promouvoir lors de la bascule." } }
    - { id: d, text: { en: "Use AWS DataSync to copy the Oracle data files to the Aurora cluster volume.", fr: "Utiliser AWS DataSync pour copier les fichiers de données Oracle vers le volume de cluster Aurora." } }
    - { id: e, text: { en: "Run an AWS DMS task with full load and ongoing replication (CDC).", fr: "Exécuter une tâche AWS DMS avec chargement complet et réplication continue (CDC)." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Oracle to PostgreSQL is a heterogeneous migration, so the schema and PL/SQL code must be converted first; DMS Schema Conversion supports Oracle to Aurora PostgreSQL. An AWS DMS full-load-plus-CDC task then copies the data and keeps applying changes while Oracle stays in production, so the cutover only waits for the last changes.
    fr: "Oracle vers PostgreSQL est une migration hétérogène : le schéma et le code PL/SQL doivent d'abord être convertis, et DMS Schema Conversion prend en charge Oracle vers Aurora PostgreSQL. Une tâche AWS DMS avec chargement complet et CDC copie ensuite les données et continue d'appliquer les modifications pendant qu'Oracle reste en production ; la bascule n'attend donc que les dernières modifications."
  options:
    a:
      en: Data Pump produces Oracle-format dump files that only an Oracle database can import, and an export/import requires downtime.
      fr: Data Pump produit des fichiers de vidage au format Oracle que seule une base Oracle peut importer, et un export/import impose un temps d'arrêt.
    c:
      en: Aurora Replicas belong to an Aurora cluster and replicate from its own writer; they cannot replicate from an external Oracle database.
      fr: Les réplicas Aurora appartiennent à un cluster Aurora et répliquent depuis son instance d'écriture ; ils ne peuvent pas répliquer depuis une base Oracle externe.
    d:
      en: DataSync copies files, and the Aurora cluster volume is not a file system; Oracle data files are not usable by PostgreSQL.
      fr: DataSync copie des fichiers, et le volume de cluster Aurora n'est pas un système de fichiers ; les fichiers de données Oracle ne sont pas utilisables par PostgreSQL.
references:
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
  - title: Creating tasks for ongoing replication using AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html
