id: saac03-3c-kds-lambda-firehose-iot
objective: "3.5.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company collects telemetry readings from 50,000 industrial sensors every second. The readings of each sensor must be processed in order, and the latest aggregated value per sensor must be written to an Amazon DynamoDB table within seconds. All raw readings must also be archived to Amazon S3 in large batched objects for later analysis. The company wants a serverless design with the LEAST operational overhead.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise collecte chaque seconde les mesures de télémétrie de 50 000 capteurs industriels. Les mesures de chaque capteur doivent être traitées dans l'ordre, et la dernière valeur agrégée de chaque capteur doit être écrite dans une table Amazon DynamoDB en quelques secondes. Toutes les mesures brutes doivent aussi être archivées dans Amazon S3 sous forme de gros objets regroupés pour une analyse ultérieure. L'entreprise souhaite une conception sans serveur avec le MOINS de charge opérationnelle possible.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Send the readings to an Amazon SQS standard queue and process them with an AWS Lambda function that writes to DynamoDB.", fr: "Envoyer les mesures dans une file d'attente standard Amazon SQS et les traiter avec une fonction AWS Lambda qui écrit dans DynamoDB." } }
    - { id: b, text: { en: "Have the Lambda function also write each reading to Amazon S3 as a separate object.", fr: "Faire aussi écrire par la fonction Lambda chaque mesure dans Amazon S3 sous forme d'objet distinct." } }
    - { id: c, text: { en: "Create an Amazon Data Firehose stream that uses the data stream as its source and delivers batched records to Amazon S3.", fr: "Créer un flux Amazon Data Firehose qui utilise le flux de données comme source et livre des enregistrements regroupés dans Amazon S3." } }
    - { id: d, text: { en: "Run an AWS Glue crawler on the data stream every minute to copy the readings to Amazon S3.", fr: "Exécuter chaque minute un robot d'analyse AWS Glue sur le flux de données pour copier les mesures dans Amazon S3." } }
    - { id: e, text: { en: "Send the readings to an Amazon Kinesis data stream with the sensor ID as the partition key and process them with an AWS Lambda function that writes to DynamoDB.", fr: "Envoyer les mesures dans un flux de données Amazon Kinesis avec l'ID du capteur comme clé de partition et les traiter avec une fonction AWS Lambda qui écrit dans DynamoDB." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: Records with the same partition key land in the same shard, and Lambda processes the records of each shard in order, so a Lambda event source mapping updates DynamoDB within seconds. A Firehose stream can read the same data stream as another consumer and deliver buffered batches to S3, with no archiving code to write.
    fr: "Les enregistrements qui ont la même clé de partition arrivent dans la même partition (shard), et Lambda traite les enregistrements de chaque partition dans l'ordre : un mappage de source d'événement Lambda met à jour DynamoDB en quelques secondes. Un flux Firehose peut lire le même flux de données en tant que consommateur supplémentaire et livrer des lots mis en mémoire tampon dans S3, sans code d'archivage à écrire."
  options:
    a: { en: "SQS standard queues offer best-effort ordering, so the readings of a sensor could be processed out of order.", fr: "Les files d'attente standard SQS n'offrent qu'un ordre au mieux : les mesures d'un capteur pourraient être traitées dans le désordre." }
    b: { en: "One object per reading creates billions of small objects and adds code, instead of large batched objects.", fr: "Un objet par mesure crée des milliards de petits objets et ajoute du code, au lieu de gros objets regroupés." }
    d: { en: "Crawlers infer schemas and populate the Data Catalog; they do not copy records from a stream to S3.", fr: "Les robots d'analyse déduisent des schémas et alimentent le Data Catalog ; ils ne copient pas d'enregistrements d'un flux vers S3." }
references:
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
  - title: Configure source settings for Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/firehose/latest/dev/writing-with-kinesis-streams.html
