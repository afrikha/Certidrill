id: saac03-3a-volume-gateway-stored
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a latency-sensitive application on premises that uses iSCSI block storage. The application reads randomly across its entire 12 TB dataset, and the company has enough local disk capacity for the full dataset. The company wants durable off-site backups in AWS that can be restored to Amazon EC2 if the data center fails. The application cannot be modified.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute sur site une application sensible à la latence qui utilise un stockage en mode bloc iSCSI. L'application effectue des lectures aléatoires sur l'ensemble de son jeu de données de 12 To, et l'entreprise dispose d'une capacité disque locale suffisante pour la totalité du jeu de données. L'entreprise souhaite des sauvegardes hors site durables dans AWS, restaurables sur Amazon EC2 en cas de panne du centre de données. L'application ne peut pas être modifiée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy Volume Gateway with stored volumes and schedule snapshots of the volumes to AWS.", fr: "Déployer Volume Gateway avec des volumes stockés et planifier des instantanés des volumes vers AWS." }
    - id: b
      text: { en: "Deploy Volume Gateway with cached volumes and schedule snapshots of the volumes to AWS.", fr: "Déployer Volume Gateway avec des volumes mis en cache et planifier des instantanés des volumes vers AWS." }
    - id: c
      text: { en: "Deploy Amazon S3 File Gateway and move the dataset to an SMB file share backed by Amazon S3.", fr: "Déployer Amazon S3 File Gateway et déplacer le jeu de données vers un partage de fichiers SMB adossé à Amazon S3." }
    - id: d
      text: { en: "Deploy Tape Gateway and have the application write its data to the virtual tape library.", fr: "Déployer Tape Gateway et faire écrire l'application dans la bibliothèque de bandes virtuelles." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      With stored volumes, the primary data stays on the on-premises gateway, which gives low-latency access to the entire dataset. The gateway asynchronously backs up point-in-time snapshots to Amazon S3, and those snapshots can be restored on premises or to EC2 as EBS volumes.
    fr: |-
      Avec les volumes stockés, les données principales restent sur la passerelle sur site, ce qui offre un accès à faible latence à l'ensemble du jeu de données. La passerelle sauvegarde de manière asynchrone des instantanés ponctuels dans Amazon S3, restaurables sur site ou sur EC2 sous forme de volumes EBS.
  options:
    b:
      en: |-
        Cached volumes keep the primary data in Amazon S3 and only frequently accessed data locally, so random reads across the whole dataset would often go to AWS and add latency.
      fr: |-
        Les volumes mis en cache conservent les données principales dans Amazon S3 et seulement les données fréquemment consultées en local : les lectures aléatoires sur tout le jeu de données passeraient souvent par AWS et ajouteraient de la latence.
    c:
      en: |-
        S3 File Gateway exposes NFS or SMB file shares, not iSCSI block storage, so the application would have to change.
      fr: |-
        S3 File Gateway expose des partages de fichiers NFS ou SMB, pas un stockage en mode bloc iSCSI : l'application devrait être modifiée.
    d:
      en: |-
        Tape Gateway presents a virtual tape library for backup software; it is not primary block storage for a running application.
      fr: |-
        Tape Gateway présente une bibliothèque de bandes virtuelles pour les logiciels de sauvegarde ; ce n'est pas un stockage en mode bloc principal pour une application en production.
references:
  - title: What is Volume Gateway? - AWS Storage Gateway
    url: https://docs.aws.amazon.com/storagegateway/latest/vgw/WhatIsStorageGateway.html
