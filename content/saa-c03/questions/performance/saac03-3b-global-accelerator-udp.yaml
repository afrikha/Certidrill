id: saac03-3b-global-accelerator-udp
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company runs multiplayer game servers on Amazon EC2 behind Network Load Balancers in two AWS Regions. The game uses UDP. Players' corporate networks must allowlist a fixed set of IP addresses, and traffic must fail over quickly to the other Region if an endpoint becomes unhealthy. The company wants traffic to enter the AWS global network as close to players as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo exécute des serveurs de jeu multijoueur sur Amazon EC2 derrière des Network Load Balancers dans deux Régions AWS. Le jeu utilise UDP. Les réseaux d'entreprise des joueurs doivent autoriser un ensemble fixe d'adresses IP, et le trafic doit basculer rapidement vers l'autre Région si un point de terminaison devient défaillant. L'entreprise veut que le trafic entre sur le réseau mondial AWS au plus près des joueurs.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon CloudFront distribution with the two Network Load Balancers as origins.", fr: "Créer une distribution Amazon CloudFront avec les deux Network Load Balancers comme origines." }
    - id: b
      text: { en: "Create Amazon Route 53 latency-based records that point to the two Network Load Balancers.", fr: "Créer des enregistrements Amazon Route 53 de routage basé sur la latence qui pointent vers les deux Network Load Balancers." }
    - id: c
      text: { en: "Replace the Network Load Balancers with Application Load Balancers that have Elastic IP addresses.", fr: "Remplacer les Network Load Balancers par des Application Load Balancers dotés d'adresses IP Elastic." }
    - id: d
      text: { en: "Create an AWS Global Accelerator standard accelerator with an endpoint group in each Region.", fr: "Créer un accélérateur standard AWS Global Accelerator avec un groupe de points de terminaison dans chaque Région." }
answer: { optionId: d }
explanation:
  correct:
    en: Global Accelerator provides two static anycast IPv4 addresses announced from AWS edge locations, so players allowlist a fixed set of addresses and enter the AWS global network nearby. It is a network layer service that supports TCP and UDP, checks endpoint health and directs traffic only to healthy endpoints across Regions.
    fr: Global Accelerator fournit deux adresses IPv4 anycast statiques annoncées depuis les emplacements périphériques AWS ; les joueurs autorisent un ensemble fixe d'adresses et entrent sur le réseau mondial AWS à proximité. C'est un service de couche réseau qui prend en charge TCP et UDP, vérifie l'état des points de terminaison et n'achemine le trafic que vers les points de terminaison sains, entre Régions.
  options:
    a:
      en: CloudFront delivers HTTP and HTTPS content and does not proxy UDP game traffic, and it has no fixed set of IP addresses to allowlist.
      fr: CloudFront distribue du contenu HTTP et HTTPS et ne relaie pas le trafic de jeu UDP, et il ne dispose pas d'un ensemble fixe d'adresses IP à autoriser.
    b:
      en: DNS records resolve to the load balancers' addresses, not to a fixed allowlist, and failover depends on clients' DNS caching.
      fr: Les enregistrements DNS se résolvent vers les adresses des équilibreurs de charge, pas vers une liste fixe, et le basculement dépend de la mise en cache DNS des clients.
    c:
      en: Application Load Balancers handle HTTP and HTTPS only, not UDP, and Elastic IP addresses cannot be associated with them.
      fr: Les Application Load Balancers ne gèrent que HTTP et HTTPS, pas UDP, et on ne peut pas leur associer d'adresses IP Elastic.
references:
  - title: What is AWS Global Accelerator?
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html
  - title: How AWS Global Accelerator works
    url: https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html
