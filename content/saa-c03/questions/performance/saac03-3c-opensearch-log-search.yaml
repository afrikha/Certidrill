id: saac03-3c-opensearch-log-search
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs hundreds of microservices that produce application logs. The operations team needs to run full-text keyword searches on the logs within seconds of the events, and to build interactive dashboards for troubleshooting and real-time application monitoring.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des centaines de microservices qui produisent des journaux d'application. L'équipe d'exploitation doit effectuer des recherches plein texte par mots-clés dans les journaux quelques secondes après les événements, et créer des tableaux de bord interactifs pour le dépannage et la surveillance des applications en temps réel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Stream the logs to Amazon OpenSearch Service and build the dashboards in OpenSearch Dashboards.", fr: "Diffuser les journaux vers Amazon OpenSearch Service et créer les tableaux de bord dans OpenSearch Dashboards." } }
    - { id: b, text: { en: "Store the logs in Amazon S3 every hour and query them with Amazon Athena from a reporting tool.", fr: "Stocker les journaux dans Amazon S3 toutes les heures et les interroger avec Amazon Athena depuis un outil de reporting." } }
    - { id: c, text: { en: "Load the logs into Amazon Redshift every hour and build reports on the warehouse tables.", fr: "Charger les journaux dans Amazon Redshift toutes les heures et créer des rapports sur les tables de l'entrepôt." } }
    - { id: d, text: { en: "Write the logs to an Amazon DynamoDB table and run Scan operations that filter on keywords.", fr: "Écrire les journaux dans une table Amazon DynamoDB et exécuter des opérations Scan filtrées par mots-clés." } }
answer: { optionId: a }
explanation:
  correct:
    en: Amazon OpenSearch Service is a managed search and analytics engine built for log analytics, real-time application monitoring and clickstream analysis. It indexes logs as they arrive for full-text search and includes OpenSearch Dashboards for interactive visualization.
    fr: "Amazon OpenSearch Service est un moteur de recherche et d'analytique géré conçu pour l'analyse de journaux, la surveillance des applications en temps réel et l'analyse du parcours de navigation. Il indexe les journaux dès leur arrivée pour la recherche plein texte et inclut OpenSearch Dashboards pour la visualisation interactive."
  options:
    b: { en: "Hourly files in S3 do not give results within seconds, and Athena is a SQL engine, not a full-text search index.", fr: "Des fichiers horaires dans S3 ne donnent pas de résultats en quelques secondes, et Athena est un moteur SQL, pas un index de recherche plein texte." }
    c: { en: "Redshift is a data warehouse for structured analytical queries; hourly loads and SQL do not provide near real-time full-text search.", fr: "Redshift est un entrepôt de données pour des requêtes analytiques structurées ; des chargements horaires et le SQL n'offrent pas de recherche plein texte quasi temps réel." }
    d: { en: "Scans read the entire table and are slow and costly; DynamoDB has no full-text search or dashboards.", fr: "Les opérations Scan lisent toute la table, ce qui est lent et coûteux ; DynamoDB n'offre ni recherche plein texte ni tableaux de bord." }
references:
  - title: What is Amazon OpenSearch Service?
    url: https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html
