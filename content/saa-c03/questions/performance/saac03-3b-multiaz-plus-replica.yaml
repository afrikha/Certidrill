id: saac03-3b-multiaz-plus-replica
objective: "3.3.10"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL Single-AZ DB instance. The company has two new requirements: the database must fail over automatically to another Availability Zone if its zone fails, and a read-heavy dashboard must stop adding load to the primary instance. The dashboard can show data that is a few seconds old.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL mono-AZ. L'entreprise a deux nouvelles exigences : la base de données doit basculer automatiquement vers une autre zone de disponibilité si sa zone tombe en panne, et un tableau de bord intensif en lecture ne doit plus ajouter de charge à l'instance principale. Le tableau de bord peut afficher des données vieilles de quelques secondes.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a read replica and rely on RDS to promote it automatically if the primary fails.", fr: "Créer un réplica en lecture et compter sur RDS pour le promouvoir automatiquement si l'instance principale tombe en panne." } }
    - { id: b, text: { en: "Convert the DB instance to a Multi-AZ DB instance deployment.", fr: "Convertir l'instance de base de données en déploiement d'instance de base de données Multi-AZ." } }
    - { id: c, text: { en: "Increase the backup retention period of the DB instance to 35 days.", fr: "Porter la période de rétention des sauvegardes de l'instance à 35 jours." } }
    - { id: d, text: { en: "Create a read replica and point the dashboard queries to its endpoint.", fr: "Créer un réplica en lecture et diriger les requêtes du tableau de bord vers son point de terminaison." } }
    - { id: e, text: { en: "Send the dashboard queries to the Multi-AZ standby endpoint.", fr: "Envoyer les requêtes du tableau de bord au point de terminaison de l'instance de secours Multi-AZ." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A Multi-AZ DB instance deployment keeps a synchronous standby in another Availability Zone and fails over to it automatically. A read replica serves the dashboard's read-only queries from separate compute, and its asynchronous lag of a few seconds is acceptable.
    fr: Un déploiement d'instance de base de données Multi-AZ maintient une instance de secours synchrone dans une autre zone de disponibilité et bascule automatiquement vers elle. Un réplica en lecture sert les requêtes en lecture seule du tableau de bord sur une capacité de calcul distincte, et son retard asynchrone de quelques secondes est acceptable.
  options:
    a:
      en: Promoting a read replica is a manual action that turns it into a standalone instance; it is not an automatic failover.
      fr: La promotion d'un réplica en lecture est une action manuelle qui le transforme en instance autonome ; ce n'est pas un basculement automatique.
    c:
      en: Longer backup retention improves point-in-time recovery but provides neither automatic failover nor read offloading.
      fr: Une rétention plus longue améliore la restauration à un instant donné mais n'apporte ni basculement automatique ni déchargement des lectures.
    e:
      en: The standby of a Multi-AZ DB instance deployment cannot serve read traffic and has no endpoint for queries.
      fr: L'instance de secours d'un déploiement d'instance de base de données Multi-AZ ne peut pas servir de trafic de lecture et n'a pas de point de terminaison pour les requêtes.
references:
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
