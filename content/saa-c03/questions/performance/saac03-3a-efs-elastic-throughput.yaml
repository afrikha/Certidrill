id: saac03-3a-efs-elastic-throughput
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores 100 GiB of shared data on an Amazon EFS file system that uses Bursting throughput mode. The workload is spiky and unpredictable: it is mostly idle, but during some hours it needs several hundred MiB/s, and it then runs out of burst credits and is throttled. The company expects throughput needs to grow and wants throughput to scale automatically while paying only for the data it actually reads and writes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke 100 Gio de données partagées sur un système de fichiers Amazon EFS en mode de débit Bursting. La charge de travail est irrégulière et imprévisible : elle est surtout inactive, mais certaines heures elle a besoin de plusieurs centaines de Mio/s, épuise alors ses crédits de rafale et subit une limitation. L'entreprise prévoit une hausse de ses besoins en débit et souhaite que le débit s'adapte automatiquement, en ne payant que les données réellement lues et écrites.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Switch the file system to Provisioned throughput mode set to the peak throughput.", fr: "Passer le système de fichiers en mode de débit Provisioned, réglé sur le débit de pointe." }
    - id: b
      text: { en: "Switch the file system to Elastic throughput mode.", fr: "Passer le système de fichiers en mode de débit Elastic." }
    - id: c
      text: { en: "Add filler data to the file system so that its baseline throughput increases.", fr: "Ajouter des données de remplissage au système de fichiers afin d'augmenter son débit de référence." }
    - id: d
      text: { en: "Replace the file system with an EFS file system that uses Max I/O performance mode.", fr: "Remplacer le système de fichiers par un système de fichiers EFS en mode de performances Max I/O." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Elastic throughput, the default and recommended mode, scales throughput up and down automatically with the workload and charges only for the data and metadata read and written. AWS recommends it for spiky or unpredictable workloads with a low average-to-peak ratio, and it uses no burst credits.
    fr: |-
      Le débit Elastic, mode par défaut et recommandé, augmente et réduit automatiquement le débit selon la charge et ne facture que les données et métadonnées lues et écrites. AWS le recommande pour les charges irrégulières ou imprévisibles dont le rapport moyenne/pointe est faible, et il n'utilise pas de crédits de rafale.
  options:
    a:
      en: |-
        Provisioned throughput charges for the provisioned level all the time, even when the workload is idle, and must be adjusted by hand as needs grow.
      fr: |-
        Le débit Provisioned facture en permanence le niveau provisionné, même quand la charge est inactive, et doit être ajusté manuellement à mesure que les besoins augmentent.
    c:
      en: |-
        In Bursting mode baseline throughput grows with stored data, so filler data would work only by paying for storage the company does not need.
      fr: |-
        En mode Bursting, le débit de référence augmente avec les données stockées : des données de remplissage ne fonctionneraient qu'en payant un stockage inutile.
    d:
      en: |-
        Max I/O is a previous-generation performance mode with higher latency that is not supported with Elastic throughput; it does not remove the throughput limit.
      fr: |-
        Max I/O est un mode de performances de génération précédente, à latence plus élevée, non pris en charge avec le débit Elastic ; il ne supprime pas la limite de débit.
references:
  - title: Amazon EFS performance specifications - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/performance.html
