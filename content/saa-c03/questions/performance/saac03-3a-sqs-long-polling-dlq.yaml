id: saac03-3a-sqs-long-polling-dlq
objective: "3.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon SQS standard queue between two application tiers. The consumers poll the queue continuously, and most ReceiveMessage calls return no messages, which increases request costs. In addition, a few malformed messages fail processing every time and keep returning to the queue. The company wants to reduce the empty responses and isolate the failing messages for analysis.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise une file d'attente Amazon SQS standard entre deux niveaux d'application. Les consommateurs interrogent la file en continu, et la plupart des appels ReceiveMessage ne renvoient aucun message, ce qui augmente le coût des requêtes. De plus, quelques messages mal formés échouent à chaque traitement et reviennent sans cesse dans la file. L'entreprise souhaite réduire les réponses vides et isoler les messages en échec pour les analyser.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Increase the message retention period of the queue to 14 days.", fr: "Porter la période de conservation des messages de la file à 14 jours." }
    - id: b
      text: { en: "Set the visibility timeout of the queue to 0 seconds.", fr: "Régler le délai de visibilité de la file à 0 seconde." }
    - id: c
      text: { en: "Configure a dead-letter queue and a redrive policy with a maxReceiveCount of 5.", fr: "Configurer une file d'attente de lettres mortes et une politique de redirection avec un maxReceiveCount de 5." }
    - id: d
      text: { en: "Set the ReceiveMessageWaitTimeSeconds attribute of the queue to 20.", fr: "Régler l'attribut ReceiveMessageWaitTimeSeconds de la file à 20." }
    - id: e
      text: { en: "Set a delivery delay of 15 minutes on the queue.", fr: "Définir un délai de remise de 15 minutes sur la file." }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |-
      A wait time greater than 0 (up to 20 seconds) turns on long polling, so ReceiveMessage waits for a message instead of returning empty responses, which lowers the number of billable requests. A dead-letter queue with a redrive policy moves a message after maxReceiveCount failed receives, isolating the malformed messages.
    fr: |-
      Un temps d'attente supérieur à 0 (jusqu'à 20 secondes) active l'interrogation longue : ReceiveMessage attend un message au lieu de renvoyer des réponses vides, ce qui réduit le nombre de requêtes facturables. Une file d'attente de lettres mortes avec une politique de redirection déplace un message après maxReceiveCount réceptions en échec, ce qui isole les messages mal formés.
  options:
    a:
      en: |-
        Longer retention keeps the failing messages cycling in the queue even longer.
      fr: |-
        Une conservation plus longue fait circuler les messages en échec encore plus longtemps dans la file.
    b:
      en: |-
        A visibility timeout of 0 makes messages visible again immediately, which causes more duplicate processing and does not isolate failures.
      fr: |-
        Un délai de visibilité de 0 rend les messages immédiatement visibles à nouveau, ce qui multiplie les traitements en double sans isoler les échecs.
    e:
      en: |-
        A delivery delay postpones new messages but does not stop consumers from receiving empty responses or isolate failing messages.
      fr: |-
        Un délai de remise retarde les nouveaux messages, mais n'empêche pas les réponses vides et n'isole pas les messages en échec.
references:
  - title: Amazon SQS short and long polling - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-short-and-long-polling.html
  - title: Using dead-letter queues in Amazon SQS - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-dead-letter-queues.html
