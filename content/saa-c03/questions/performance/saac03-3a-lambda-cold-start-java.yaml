id: saac03-3a-lambda-cold-start-java
objective: "3.2.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company exposes an API through Amazon API Gateway and an AWS Lambda function that uses the Java 21 managed runtime. The function's initialization takes several seconds, so users see slow responses whenever Lambda creates new execution environments during traffic increases. The company must reduce this startup latency.

    Which actions will meet this requirement? (Choose two.) Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise expose une API via Amazon API Gateway et une fonction AWS Lambda qui utilise l'environnement d'exécution géré Java 21. L'initialisation de la fonction prend plusieurs secondes : les utilisateurs constatent des réponses lentes chaque fois que Lambda crée de nouveaux environnements d'exécution lors des hausses de trafic. L'entreprise doit réduire cette latence de démarrage.

    Quelles actions répondent à cette exigence ? (Choisissez deux réponses.) Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Turn on Lambda SnapStart and invoke the function through a published version or an alias.", fr: "Activer Lambda SnapStart et appeler la fonction via une version publiée ou un alias." }
    - id: b
      text: { en: "Configure reserved concurrency for the function.", fr: "Configurer une simultanéité réservée pour la fonction." }
    - id: c
      text: { en: "Configure provisioned concurrency on an alias of the function.", fr: "Configurer une simultanéité provisionnée sur un alias de la fonction." }
    - id: d
      text: { en: "Increase the function timeout to 900 seconds.", fr: "Augmenter le délai d'expiration de la fonction à 900 secondes." }
    - id: e
      text: { en: "Increase the function's ephemeral storage to 10,240 MB.", fr: "Augmenter le stockage éphémère de la fonction à 10 240 Mo." }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      SnapStart, supported for Java 11 and later, initializes the function when a version is published, snapshots the initialized environment and resumes new environments from that snapshot. Provisioned concurrency keeps a set number of environments initialized before requests arrive. Each removes the initialization delay on its own; they cannot be combined on the same version.
    fr: |-
      SnapStart, pris en charge pour Java 11 et versions ultérieures, initialise la fonction lors de la publication d'une version, prend un instantané de l'environnement initialisé et reprend les nouveaux environnements à partir de cet instantané. La simultanéité provisionnée maintient un nombre défini d'environnements initialisés avant l'arrivée des requêtes. Chacune supprime à elle seule le délai d'initialisation ; elles ne peuvent pas être combinées sur la même version.
  options:
    b:
      en: |-
        Reserved concurrency sets aside and caps capacity for the function, but environments are still created on demand, so cold starts remain.
      fr: |-
        La simultanéité réservée réserve et plafonne de la capacité pour la fonction, mais les environnements sont toujours créés à la demande : les démarrages à froid subsistent.
    d:
      en: |-
        The timeout only limits how long an invocation may run; it does not make initialization faster.
      fr: |-
        Le délai d'expiration limite seulement la durée d'une invocation ; il n'accélère pas l'initialisation.
    e:
      en: |-
        More /tmp storage does not speed up initialization, and SnapStart does not support ephemeral storage above 512 MB.
      fr: |-
        Davantage de stockage /tmp n'accélère pas l'initialisation, et SnapStart ne prend pas en charge un stockage éphémère supérieur à 512 Mo.
references:
  - title: Improving startup performance with Lambda SnapStart - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/snapstart.html
  - title: Understanding Lambda Event Function scaling - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
