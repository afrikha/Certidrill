id: saac03-3c-transfer-sftp-ip-allowlist
objective: "3.5.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses an AWS Transfer Family SFTP server to receive files from partners into Amazon S3. The security team requires that only the partners' known public IP address ranges can connect to the server. The partners also require fixed IP addresses for the server so that they can allow them in their own outbound firewalls.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise un serveur SFTP AWS Transfer Family pour recevoir les fichiers de ses partenaires dans Amazon S3. L'équipe de sécurité exige que seules les plages d'adresses IP publiques connues des partenaires puissent se connecter au serveur. Les partenaires exigent aussi des adresses IP fixes pour le serveur afin de les autoriser dans leurs propres pare-feu sortants.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Associate an AWS WAF web ACL with an IP set rule that allows the partner ranges with the Transfer Family server.", fr: "Associer au serveur Transfer Family une liste ACL web AWS WAF avec une règle d'ensemble d'adresses IP qui autorise les plages des partenaires." } }
    - { id: b, text: { en: "Add a bucket policy that allows s3:PutObject only when aws:SourceIp matches the partner IP address ranges.", fr: "Ajouter une politique de compartiment qui n'autorise s3:PutObject que lorsque aws:SourceIp correspond aux plages d'adresses IP des partenaires." } }
    - { id: c, text: { en: "Use an internet-facing VPC hosted endpoint with Elastic IP addresses and a security group that allows only the partner ranges.", fr: "Utiliser un point de terminaison hébergé dans un VPC accessible depuis Internet, avec des adresses IP Elastic et un groupe de sécurité limité aux plages des partenaires." } }
    - { id: d, text: { en: "Use a VPC hosted, internal endpoint and require each partner to connect through an AWS Client VPN endpoint.", fr: "Utiliser un point de terminaison interne hébergé dans un VPC et obliger chaque partenaire à se connecter via un point de terminaison AWS Client VPN." } }
answer: { optionId: c }
explanation:
  correct:
    en: A VPC hosted server endpoint can be internet-facing with one Elastic IP address per subnet, which gives partners fixed addresses to allow. Access to an internet-facing VPC endpoint is limited to the source IP addresses that its security group allows, so an inbound rule on port 22 for the partner ranges enforces the allow list.
    fr: "Un point de terminaison de serveur hébergé dans un VPC peut être accessible depuis Internet avec une adresse IP Elastic par sous-réseau, ce qui donne aux partenaires des adresses fixes à autoriser. L'accès à un point de terminaison VPC accessible depuis Internet est limité aux adresses IP source autorisées par son groupe de sécurité : une règle entrante sur le port 22 pour les plages des partenaires applique la liste d'autorisation."
  options:
    a: { en: "AWS WAF protects resources such as CloudFront, Application Load Balancers and API Gateway; it cannot be associated with a Transfer Family server.", fr: "AWS WAF protège des ressources comme CloudFront, les Application Load Balancers et API Gateway ; il ne peut pas être associé à un serveur Transfer Family." }
    b: { en: "Transfer Family writes to S3 with its IAM role, so the bucket never sees the partner IP addresses, and the server still accepts connections from anyone.", fr: "Transfer Family écrit dans S3 avec son rôle IAM : le compartiment ne voit jamais les adresses IP des partenaires, et le serveur accepte toujours les connexions de tous." }
    d: { en: "Client VPN for every partner adds endpoints, certificates and client software to manage, and partners would change their process.", fr: "Un Client VPN pour chaque partenaire ajoute des points de terminaison, des certificats et un logiciel client à gérer, et les partenaires devraient modifier leur processus." }
references:
  - title: Create a server in a virtual private cloud
    url: https://docs.aws.amazon.com/transfer/latest/userguide/create-server-in-vpc.html
  - title: Resources that you can protect with AWS WAF
    url: https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works-resources.html
