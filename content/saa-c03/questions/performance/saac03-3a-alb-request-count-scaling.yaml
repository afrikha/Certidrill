id: saac03-3a-alb-request-count-scaling
objective: "3.2.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A web application runs on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Most of each request is spent waiting for an external API, so CPU utilization stays below 20% even when the instances are overloaded. Load testing shows that each instance performs well up to about 1,000 requests per minute.

    Which scaling configuration will keep performance stable as traffic changes?
  fr: |
    Une application web s'exécute sur des instances Amazon EC2 d'un groupe Auto Scaling, derrière un Application Load Balancer. Chaque requête passe l'essentiel de son temps à attendre une API externe : l'utilisation du processeur reste inférieure à 20 % même lorsque les instances sont surchargées. Les tests de charge montrent que chaque instance fonctionne bien jusqu'à environ 1 000 requêtes par minute.

    Quelle configuration de mise à l'échelle maintient des performances stables lorsque le trafic varie ?
body:
  options:
    - id: a
      text: { en: "A target tracking policy on ASGAverageCPUUtilization with a target value of 15", fr: "Une stratégie de suivi de la cible sur ASGAverageCPUUtilization avec une valeur cible de 15" }
    - id: b
      text: { en: "A target tracking policy on ALBRequestCountPerTarget with a target value of 1,000", fr: "Une stratégie de suivi de la cible sur ALBRequestCountPerTarget avec une valeur cible de 1 000" }
    - id: c
      text: { en: "A target tracking policy on the load balancer's total RequestCount metric with a target value of 1,000", fr: "Une stratégie de suivi de la cible sur la métrique RequestCount totale de l'équilibreur de charge avec une valeur cible de 1 000" }
    - id: d
      text: { en: "A target tracking policy on the load balancer's TargetResponseTime metric with a target value of 1 second", fr: "Une stratégie de suivi de la cible sur la métrique TargetResponseTime de l'équilibreur de charge avec une valeur cible de 1 seconde" }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      ALBRequestCountPerTarget is a predefined target tracking metric that measures the average request count per target, so it changes in proportion to the number of instances. Setting its target to the measured per-instance capacity adds instances before they become overloaded, even though CPU stays low.
    fr: |-
      ALBRequestCountPerTarget est une métrique prédéfinie de suivi de la cible qui mesure le nombre moyen de requêtes par cible : elle varie proportionnellement au nombre d'instances. Régler sa cible sur la capacité mesurée par instance ajoute des instances avant leur surcharge, même si le processeur reste bas.
  options:
    a:
      en: |-
        CPU stays low whether or not the instances are overloaded, so it is not a reliable signal for this I/O-bound application.
      fr: |-
        Le processeur reste bas que les instances soient surchargées ou non : ce n'est pas un signal fiable pour cette application limitée par les E/S.
    c:
      en: |-
        The total request count does not change based on the group's capacity, so AWS states that it does not work as a target tracking metric.
      fr: |-
        Le nombre total de requêtes ne varie pas en fonction de la capacité du groupe : AWS indique qu'il ne convient pas comme métrique de suivi de la cible.
    d:
      en: |-
        Response time does not decrease in proportion to added instances; AWS gives load balancer latency as an example of a metric that does not work for target tracking.
      fr: |-
        Le temps de réponse ne diminue pas proportionnellement aux instances ajoutées ; AWS cite la latence de l'équilibreur de charge comme exemple de métrique qui ne convient pas au suivi de la cible.
references:
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
