id: saac03-3c-glue-job-bookmarks
objective: "3.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Glue ETL job runs every hour and transforms CSV files from an Amazon S3 prefix into Apache Parquet files in another prefix. Each run reads every file in the source prefix, so the target contains duplicate records and the job duration and cost grow every day. The source files must be kept.

    Which solution will make each run process only the files that arrived since the previous run with the LEAST effort?
  fr: |
    Une tâche ETL AWS Glue s'exécute toutes les heures et transforme les fichiers CSV d'un préfixe Amazon S3 en fichiers Apache Parquet dans un autre préfixe. Chaque exécution lit tous les fichiers du préfixe source : la cible contient des enregistrements en double, et la durée et le coût de la tâche augmentent chaque jour. Les fichiers source doivent être conservés.

    Quelle solution permet à chaque exécution de ne traiter que les fichiers arrivés depuis l'exécution précédente avec le MOINS d'effort possible ?
body:
  options:
    - { id: a, text: { en: "Add an S3 Lifecycle rule that deletes the source files one hour after they are created.", fr: "Ajouter une règle S3 Lifecycle qui supprime les fichiers source une heure après leur création." } }
    - { id: b, text: { en: "Increase the number of workers of the job so that each run finishes before the next one starts.", fr: "Augmenter le nombre de workers de la tâche afin que chaque exécution se termine avant le début de la suivante." } }
    - { id: c, text: { en: "Enable job bookmarks on the job so that AWS Glue tracks the data that earlier runs already processed.", fr: "Activer les signets de tâche (job bookmarks) sur la tâche afin qu'AWS Glue suive les données déjà traitées par les exécutions précédentes." } }
    - { id: d, text: { en: "Write the list of processed file names to an Amazon DynamoDB table and filter it in the job script.", fr: "Écrire la liste des noms de fichiers traités dans une table Amazon DynamoDB et la filtrer dans le script de la tâche." } }
answer: { optionId: c }
explanation:
  correct:
    en: Job bookmarks persist state between runs of an AWS Glue job so that scheduled reruns process only new data and do not reprocess old data or create duplicates in the target. They support Amazon S3 sources in formats including CSV, and they are enabled with a job option rather than with custom code.
    fr: "Les signets de tâche conservent un état entre les exécutions d'une tâche AWS Glue : les exécutions planifiées ne traitent que les nouvelles données, sans retraiter les anciennes ni créer de doublons dans la cible. Ils prennent en charge les sources Amazon S3 dans des formats dont CSV, et s'activent par une option de la tâche plutôt que par du code personnalisé."
  options:
    a: { en: "The source files must be kept, and deleting them by age is unreliable if a run fails or is delayed.", fr: "Les fichiers source doivent être conservés, et les supprimer selon leur âge n'est pas fiable si une exécution échoue ou prend du retard." }
    b: { en: "More workers make the job faster but it still reads every file and keeps creating duplicates.", fr: "Plus de workers accélèrent la tâche, mais elle lit toujours tous les fichiers et continue de créer des doublons." }
    d: { en: "Custom tracking in DynamoDB rebuilds a feature that AWS Glue already provides, with more code to maintain.", fr: "Un suivi maison dans DynamoDB recrée une fonctionnalité qu'AWS Glue fournit déjà, avec davantage de code à maintenir." }
references:
  - title: Tracking processed data using job bookmarks
    url: https://docs.aws.amazon.com/glue/latest/dg/monitor-continuations.html
