id: saac03-3c-managed-grafana-ops
objective: "3.5.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's site reliability engineering team wants operational dashboards that correlate Amazon CloudWatch metrics, AWS X-Ray traces and metrics stored in Amazon Managed Service for Prometheus. The team already uses Grafana dashboards on premises and wants AWS to handle provisioning, scaling and maintenance of the Grafana servers. Users must sign in through AWS IAM Identity Center.

    Which solution will meet these requirements?
  fr: |
    L'équipe d'ingénierie de fiabilité des sites d'une entreprise souhaite des tableaux de bord opérationnels qui mettent en corrélation les métriques Amazon CloudWatch, les traces AWS X-Ray et les métriques stockées dans Amazon Managed Service for Prometheus. L'équipe utilise déjà des tableaux de bord Grafana sur site et veut qu'AWS prenne en charge le provisionnement, la mise à l'échelle et la maintenance des serveurs Grafana. Les utilisateurs doivent se connecter via AWS IAM Identity Center.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Install Grafana on Amazon EC2 instances in an Auto Scaling group and configure the data sources.", fr: "Installer Grafana sur des instances Amazon EC2 d'un Auto Scaling group et configurer les sources de données." } }
    - { id: b, text: { en: "Create an Amazon Managed Grafana workspace with IAM Identity Center authentication and add the three data sources.", fr: "Créer un espace de travail Amazon Managed Grafana avec l'authentification IAM Identity Center et ajouter les trois sources de données." } }
    - { id: c, text: { en: "Build the dashboards in Amazon OpenSearch Dashboards after exporting the metrics and traces to OpenSearch Service.", fr: "Créer les tableaux de bord dans OpenSearch Dashboards après avoir exporté les métriques et les traces vers OpenSearch Service." } }
    - { id: d, text: { en: "Export the metrics and traces to Amazon S3 every hour and build AWS Quick Sight analyses on Athena tables.", fr: "Exporter les métriques et les traces dans Amazon S3 toutes les heures et créer des analyses AWS Quick Sight sur des tables Athena." } }
answer: { optionId: b }
explanation:
  correct:
    en: Amazon Managed Grafana is a fully managed service in which AWS provisions, scales and maintains the Grafana servers. Its workspaces connect directly to data sources such as CloudWatch, X-Ray and Amazon Managed Service for Prometheus, and users authenticate through IAM Identity Center or a SAML 2.0 identity provider.
    fr: "Amazon Managed Grafana est un service entièrement géré dans lequel AWS provisionne, met à l'échelle et maintient les serveurs Grafana. Ses espaces de travail se connectent directement à des sources de données comme CloudWatch, X-Ray et Amazon Managed Service for Prometheus, et les utilisateurs s'authentifient via IAM Identity Center ou un fournisseur d'identité SAML 2.0."
  options:
    a: { en: "Self-managed Grafana on EC2 leaves provisioning, scaling and patching with the team.", fr: "Grafana autogéré sur EC2 laisse le provisionnement, la mise à l'échelle et les correctifs à l'équipe." }
    c: { en: "Exporting metrics and traces to OpenSearch adds pipelines, and the team would lose its existing Grafana dashboards.", fr: "Exporter métriques et traces vers OpenSearch ajoute des pipelines, et l'équipe perdrait ses tableaux de bord Grafana existants." }
    d: { en: "Hourly exports add delay and pipelines; Quick Sight is a BI service, not an operational observability tool over these sources.", fr: "Des exports horaires ajoutent du délai et des pipelines ; Quick Sight est un service de BI, pas un outil d'observabilité opérationnelle sur ces sources." }
references:
  - title: What is Amazon Managed Grafana?
    url: https://docs.aws.amazon.com/grafana/latest/userguide/what-is-Amazon-Managed-Service-Grafana.html
