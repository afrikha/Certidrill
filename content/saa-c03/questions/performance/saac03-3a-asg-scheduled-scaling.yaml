id: saac03-3a-asg-scheduled-scaling
objective: "3.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An internal HR application runs on Amazon EC2 instances in an Auto Scaling group. Every weekday, employees start using it at 8:00 AM New York time and stop at 6:00 PM. The company knows that 12 instances are needed during business hours and 2 instances at other times. Capacity must be in place before employees arrive, and the company wants to minimize cost outside business hours.

    Which solution will meet these requirements?
  fr: |
    Une application RH interne s'exécute sur des instances Amazon EC2 dans un groupe Auto Scaling. Chaque jour ouvré, les employés commencent à l'utiliser à 8 h 00 (heure de New York) et cessent à 18 h 00. L'entreprise sait qu'il faut 12 instances pendant les heures ouvrées et 2 instances le reste du temps. La capacité doit être en place avant l'arrivée des employés, et l'entreprise veut réduire au minimum les coûts en dehors des heures ouvrées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a target tracking scaling policy that keeps the group's average CPU utilization at 50%.", fr: "Créer une stratégie de mise à l'échelle de suivi de la cible qui maintient l'utilisation moyenne du processeur du groupe à 50 %." }
    - id: b
      text: { en: "Create recurring scheduled actions in the America/New_York time zone that set the desired capacity for each period.", fr: "Créer des actions planifiées récurrentes dans le fuseau horaire America/New_York qui règlent la capacité souhaitée de chaque période." }
    - id: c
      text: { en: "Create a step scaling policy that adds instances when a CloudWatch alarm on CPU utilization is in the ALARM state.", fr: "Créer une stratégie de mise à l'échelle par étapes qui ajoute des instances lorsqu'une alarme CloudWatch sur l'utilisation du processeur passe à l'état ALARM." }
    - id: d
      text: { en: "Set the minimum capacity of the Auto Scaling group to 12 instances at all times.", fr: "Régler en permanence la capacité minimale du groupe Auto Scaling à 12 instances." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Scheduled scaling fits load changes that are known in advance. Recurring scheduled actions (cron expressions) set the desired capacity at specific times, and an IANA time zone such as America/New_York keeps the schedule on local time, including daylight saving changes.
    fr: |-
      La mise à l'échelle planifiée convient aux variations de charge connues à l'avance. Des actions planifiées récurrentes (expressions cron) règlent la capacité souhaitée à des heures précises, et un fuseau horaire IANA tel qu'America/New_York cale la planification sur l'heure locale, changements d'heure compris.
  options:
    a:
      en: |-
        Target tracking reacts after the load arrives, so the capacity would not be ready before employees start working.
      fr: |-
        Le suivi de la cible réagit une fois la charge arrivée : la capacité ne serait pas prête avant que les employés commencent à travailler.
    c:
      en: |-
        Step scaling is also reactive; it adds instances only after the CPU alarm fires.
      fr: |-
        La mise à l'échelle par étapes est elle aussi réactive ; elle n'ajoute des instances qu'après le déclenchement de l'alarme sur le processeur.
    d:
      en: |-
        A permanent minimum of 12 instances keeps unneeded capacity running nights and weekends, which does not minimize cost.
      fr: |-
        Un minimum permanent de 12 instances maintient une capacité inutile la nuit et le week-end, ce qui ne réduit pas les coûts.
references:
  - title: Scheduled scaling for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html
