id: saac03-3a-s3-file-gateway-nfs
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research laboratory runs Linux analysis servers on premises. The servers write instrument output files to an NFS share on a NAS that is almost full and will not be expanded. The company wants to store the files durably in Amazon S3 as individual objects so that analytics jobs in AWS can read them directly. The on-premises servers must keep low-latency access to recently written files and must continue to use NFS without application changes.

    Which solution will meet these requirements?
  fr: |
    Un laboratoire de recherche exécute des serveurs d'analyse Linux sur site. Les serveurs écrivent les fichiers produits par les instruments sur un partage NFS hébergé par un NAS presque plein, qui ne sera pas étendu. L'entreprise souhaite stocker les fichiers de manière durable dans Amazon S3 sous forme d'objets individuels, afin que des tâches d'analyse dans AWS puissent les lire directement. Les serveurs sur site doivent conserver un accès à faible latence aux fichiers récemment écrits et continuer à utiliser NFS sans modification de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy Amazon S3 File Gateway on premises and mount its NFS file share on the analysis servers.", fr: "Déployer Amazon S3 File Gateway sur site et monter son partage de fichiers NFS sur les serveurs d'analyse." }
    - id: b
      text: { en: "Deploy Volume Gateway with cached volumes on premises and attach the iSCSI volumes to the analysis servers.", fr: "Déployer Volume Gateway avec des volumes mis en cache sur site et attacher les volumes iSCSI aux serveurs d'analyse." }
    - id: c
      text: { en: "Use AWS DataSync to copy the NFS share on the NAS to an S3 bucket every night.", fr: "Utiliser AWS DataSync pour copier chaque nuit le partage NFS du NAS vers un compartiment S3." }
    - id: d
      text: { en: "Create an Amazon EFS file system and mount it on the analysis servers over AWS Direct Connect.", fr: "Créer un système de fichiers Amazon EFS et le monter sur les serveurs d'analyse via AWS Direct Connect." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      S3 File Gateway presents an NFS (or SMB) file share on premises and stores each file as one object in the S3 bucket, in its native format, so AWS analytics jobs can read the objects directly. Its local cache gives the servers low-latency access to recently used data, and the application keeps using NFS unchanged.
    fr: |-
      S3 File Gateway expose un partage de fichiers NFS (ou SMB) sur site et stocke chaque fichier sous la forme d'un objet du compartiment S3, dans son format natif : les tâches d'analyse dans AWS lisent donc directement les objets. Son cache local offre aux serveurs un accès à faible latence aux données récemment utilisées, et l'application continue d'utiliser NFS sans modification.
  options:
    b:
      en: |-
        Volume Gateway provides iSCSI block volumes, not an NFS share, and the data is not stored as individual S3 objects that analytics jobs can read.
      fr: |-
        Volume Gateway fournit des volumes en mode bloc iSCSI, pas un partage NFS, et les données ne sont pas stockées sous forme d'objets S3 individuels lisibles par les tâches d'analyse.
    c:
      en: |-
        DataSync copies data, but the files still live on the full NAS first, which cannot be expanded, and the nightly copy does not relieve on-premises capacity.
      fr: |-
        DataSync copie les données, mais les fichiers restent d'abord sur le NAS plein, qui ne peut pas être étendu, et la copie nocturne ne libère pas de capacité sur site.
    d:
      en: |-
        EFS is a file system, not S3 objects, and it has no on-premises cache, so every access crosses the Direct Connect link.
      fr: |-
        EFS est un système de fichiers, pas un stockage d'objets S3, et il n'offre aucun cache sur site : chaque accès traverse la liaison Direct Connect.
references:
