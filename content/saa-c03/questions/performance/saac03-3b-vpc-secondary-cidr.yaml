id: saac03-3b-vpc-secondary-cidr
objective: "3.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's VPC uses the 10.0.0.0/20 CIDR block, and all its subnets are almost out of IPv4 addresses. The company must add subnets for a new container workload. The new workload must run in the same VPC so that it can reference the existing security groups, and the existing instances must keep their IP addresses.

    Which solution will meet these requirements?
  fr: |
    Le VPC d'une entreprise utilise le bloc CIDR 10.0.0.0/20, et tous ses sous-réseaux ont presque épuisé leurs adresses IPv4. L'entreprise doit ajouter des sous-réseaux pour une nouvelle charge de travail de conteneurs. La nouvelle charge doit s'exécuter dans le même VPC afin de pouvoir référencer les groupes de sécurité existants, et les instances existantes doivent conserver leurs adresses IP.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the VPC's primary CIDR block from 10.0.0.0/20 to 10.0.0.0/16.", fr: "Modifier le bloc CIDR principal du VPC de 10.0.0.0/20 en 10.0.0.0/16." }
    - id: b
      text: { en: "Create a NAT gateway so that the new containers share the addresses of the existing subnets.", fr: "Créer une passerelle NAT afin que les nouveaux conteneurs partagent les adresses des sous-réseaux existants." }
    - id: c
      text: { en: "Create a new VPC with a larger CIDR block and connect it to the existing VPC with VPC peering.", fr: "Créer un nouveau VPC avec un bloc CIDR plus grand et le relier au VPC existant par appairage de VPC (VPC peering)." }
    - id: d
      text: { en: "Associate a secondary IPv4 CIDR block, such as 10.1.0.0/16, with the VPC and create the new subnets in it.", fr: "Associer un bloc CIDR IPv4 secondaire, par exemple 10.1.0.0/16, au VPC et y créer les nouveaux sous-réseaux." }
answer: { optionId: d }
explanation:
  correct:
    en: A VPC can have secondary IPv4 CIDR blocks that do not overlap existing ones, and new subnets can be created in them. The existing subnets and addresses do not change, and the new subnets are in the same VPC, so they can use the existing security groups.
    fr: Un VPC peut recevoir des blocs CIDR IPv4 secondaires qui ne chevauchent pas les blocs existants, et de nouveaux sous-réseaux peuvent y être créés. Les sous-réseaux et adresses existants ne changent pas, et les nouveaux sous-réseaux sont dans le même VPC ; ils peuvent donc utiliser les groupes de sécurité existants.
  options:
    a:
      en: The size of an existing VPC CIDR block cannot be changed, and the primary block cannot be removed.
      fr: La taille d'un bloc CIDR de VPC existant ne peut pas être modifiée, et le bloc principal ne peut pas être supprimé.
    b:
      en: A NAT gateway translates outbound traffic; every network interface still needs its own private IP address from a subnet.
      fr: Une passerelle NAT traduit le trafic sortant ; chaque interface réseau a toujours besoin de sa propre adresse IP privée dans un sous-réseau.
    c:
      en: Resources in a separate VPC are not in the same VPC as the existing security groups, which the requirement demands.
      fr: Les ressources d'un VPC distinct ne sont pas dans le même VPC que les groupes de sécurité existants, ce qu'exige l'énoncé.
references:
  - title: VPC CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html
