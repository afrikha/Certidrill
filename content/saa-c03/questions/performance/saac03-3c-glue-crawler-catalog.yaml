id: saac03-3c-glue-crawler-catalog
objective: "3.5.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company lands JSON files in an Amazon S3 bucket every day under new prefixes such as year=2026/month=11/day=19/. Analysts query the data with Amazon Athena. New fields are occasionally added to the files. The company needs the table definitions and partitions in the AWS Glue Data Catalog to stay up to date with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dépose chaque jour des fichiers JSON dans un compartiment Amazon S3, sous de nouveaux préfixes comme year=2026/month=11/day=19/. Les analystes interrogent les données avec Amazon Athena. De nouveaux champs sont parfois ajoutés aux fichiers. L'entreprise doit maintenir à jour les définitions de tables et les partitions dans AWS Glue Data Catalog avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Ask an analyst to run the MSCK REPAIR TABLE statement in Athena every morning.", fr: "Demander à un analyste d'exécuter l'instruction MSCK REPAIR TABLE dans Athena chaque matin." } }
    - { id: b, text: { en: "Write an AWS Lambda function that parses each new file and runs ALTER TABLE statements in Athena.", fr: "Écrire une fonction AWS Lambda qui analyse chaque nouveau fichier et exécute des instructions ALTER TABLE dans Athena." } }
    - { id: c, text: { en: "Create an AWS Glue crawler on the S3 path and run it on a daily schedule after the files arrive.", fr: "Créer un robot d'analyse (crawler) AWS Glue sur le chemin S3 et l'exécuter selon une planification quotidienne après l'arrivée des fichiers." } }
    - { id: d, text: { en: "Create an AWS Lake Formation data filter on the table that includes all columns and all rows.", fr: "Créer sur la table un filtre de données AWS Lake Formation qui inclut toutes les colonnes et toutes les lignes." } }
answer: { optionId: c }
explanation:
  correct:
    en: An AWS Glue crawler infers the schema of the data and writes table definitions to the Data Catalog. On scheduled runs it detects new or changed files, adds new partitions from the Hive-style folder structure and updates the schema, with no code to maintain.
    fr: "Un robot d'analyse AWS Glue déduit le schéma des données et écrit les définitions de tables dans le Data Catalog. Lors des exécutions planifiées, il détecte les fichiers nouveaux ou modifiés, ajoute les nouvelles partitions à partir de l'arborescence de type Hive et met à jour le schéma, sans code à maintenir."
  options:
    a: { en: "MSCK REPAIR TABLE loads new Hive-style partitions but does not update the schema, and running it by hand every day is manual work.", fr: "MSCK REPAIR TABLE charge les nouvelles partitions de type Hive, mais ne met pas à jour le schéma, et l'exécuter à la main chaque jour est une tâche manuelle." }
    b: { en: "A custom Lambda function would work but is code to write and maintain, unlike a managed crawler.", fr: "Une fonction Lambda personnalisée fonctionnerait, mais c'est du code à écrire et à maintenir, contrairement à un robot d'analyse géré." }
    d: { en: "Lake Formation data filters restrict which rows and columns principals can read; they do not catalog data.", fr: "Les filtres de données Lake Formation restreignent les lignes et les colonnes que les principaux peuvent lire ; ils ne cataloguent pas les données." }
references:
  - title: Using crawlers to populate the Data Catalog
    url: https://docs.aws.amazon.com/glue/latest/dg/add-crawler.html
  - title: Partition your data
    url: https://docs.aws.amazon.com/athena/latest/ug/partitions.html
