id: saac03-3a-lambda-reserved-concurrency
objective: "3.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An AWS Lambda function processes incoming orders and calls a partner's HTTP API for each order. The partner's API accepts at most 50 concurrent requests and returns errors above that level. During traffic spikes, Lambda scales the function to hundreds of concurrent executions and overwhelms the partner's API. The company wants to fix this with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une fonction AWS Lambda traite les commandes entrantes et appelle l'API HTTP d'un partenaire pour chaque commande. L'API du partenaire accepte au maximum 50 requêtes simultanées et renvoie des erreurs au-delà. Lors des pics de trafic, Lambda porte la fonction à des centaines d'exécutions simultanées et sature l'API du partenaire. L'entreprise souhaite corriger ce problème avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure provisioned concurrency of 50 for the function.", fr: "Configurer une simultanéité provisionnée de 50 pour la fonction." }
    - id: b
      text: { en: "Add code that counts active calls in an Amazon DynamoDB table and waits when the count reaches 50.", fr: "Ajouter du code qui compte les appels actifs dans une table Amazon DynamoDB et attend lorsque le compte atteint 50." }
    - id: c
      text: { en: "Increase the memory of the function so that each invocation finishes faster.", fr: "Augmenter la mémoire de la fonction afin que chaque invocation se termine plus vite." }
    - id: d
      text: { en: "Configure reserved concurrency of 50 for the function.", fr: "Configurer une simultanéité réservée de 50 pour la fonction." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Reserved concurrency sets the maximum number of concurrent execution environments for a function, so it cannot scale beyond 50 and overload the downstream API; requests above the limit are throttled. It has no additional charge and needs no code.
    fr: |-
      La simultanéité réservée fixe le nombre maximal d'environnements d'exécution simultanés d'une fonction : elle ne peut pas dépasser 50 et saturer l'API en aval ; les requêtes au-delà de la limite sont limitées (throttled). Elle n'entraîne aucun coût supplémentaire et ne demande aucun code.
  options:
    a:
      en: |-
        Provisioned concurrency pre-initializes 50 environments, but without reserved concurrency, extra requests spill over into unreserved concurrency, so the function still scales past 50.
      fr: |-
        La simultanéité provisionnée pré-initialise 50 environnements, mais sans simultanéité réservée les requêtes supplémentaires débordent sur la simultanéité non réservée : la fonction dépasse toujours 50.
    b:
      en: |-
        A custom counter adds code, a table and race conditions to manage, whereas reserved concurrency is a single setting.
      fr: |-
        Un compteur personnalisé ajoute du code, une table et des conditions de concurrence à gérer, alors que la simultanéité réservée est un simple paramètre.
    c:
      en: |-
        More memory may shorten each invocation, but it does not cap how many invocations run at the same time.
      fr: |-
        Plus de mémoire peut raccourcir chaque invocation, mais ne plafonne pas le nombre d'invocations simultanées.
references:
  - title: Understanding Lambda Event Function scaling - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
