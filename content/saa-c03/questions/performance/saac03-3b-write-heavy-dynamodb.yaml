id: saac03-3b-write-heavy-dynamodb
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company collects clickstream events from its website. The workload writes about 50,000 small events per second and reads them back only by session ID, with no joins or complex queries. The current Amazon RDS for MySQL DB instance has reached its write limit. The company wants a database that scales writes horizontally without servers to manage.

    Which solution will meet these requirements?
  fr: |
    Une entreprise collecte les événements de parcours de navigation (clickstream) de son site web. La charge de travail écrit environ 50 000 petits événements par seconde et ne les relit que par ID de session, sans jointures ni requêtes complexes. L'instance de base de données Amazon RDS for MySQL actuelle a atteint sa limite d'écriture. L'entreprise veut une base de données qui fait évoluer les écritures horizontalement sans serveur à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add RDS read replicas and distribute the event writes across the replicas.", fr: "Ajouter des réplicas en lecture RDS et répartir les écritures d'événements entre ces réplicas." }
    - id: b
      text: { en: "Convert the RDS DB instance to a Multi-AZ DB instance deployment.", fr: "Convertir l'instance de base de données RDS en déploiement d'instance de base de données Multi-AZ." }
    - id: c
      text: { en: "Place an Amazon ElastiCache cluster in front of the RDS DB instance to absorb the events.", fr: "Placer un cluster Amazon ElastiCache devant l'instance de base de données RDS pour absorber les événements." }
    - id: d
      text: { en: "Store the events in an Amazon DynamoDB table keyed by session ID.", fr: "Stocker les événements dans une table Amazon DynamoDB dont la clé est l'ID de session." }
answer: { optionId: d }
explanation:
  correct:
    en: DynamoDB is a serverless key-value and document database with single-digit millisecond performance at any scale. Writes are spread across partitions by partition key, and a high-cardinality key such as the session ID distributes this write-intensive workload evenly.
    fr: DynamoDB est une base de données clé-valeur et de documents sans serveur, avec des performances de l'ordre de quelques millisecondes à n'importe quelle échelle. Les écritures sont réparties entre les partitions selon la clé de partition, et une clé à forte cardinalité comme l'ID de session répartit uniformément cette charge intensive en écriture.
  options:
    a:
      en: Read replicas accept only read-only connections; all writes still go to the single primary instance.
      fr: Les réplicas en lecture n'acceptent que des connexions en lecture seule ; toutes les écritures sont toujours envoyées à l'unique instance principale.
    b:
      en: Multi-AZ adds a synchronous standby for availability; it does not scale writes and can even add write latency.
      fr: Multi-AZ ajoute une instance de secours synchrone pour la disponibilité ; il ne fait pas évoluer les écritures et peut même augmenter leur latence.
    c:
      en: A cache offloads repeated reads; every event must still be written to the database, which remains the bottleneck.
      fr: Un cache décharge les lectures répétées ; chaque événement doit toujours être écrit dans la base de données, qui reste le goulot d'étranglement.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
