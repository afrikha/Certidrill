id: saac03-3c-glue-databrew-analysts
objective: "3.5.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Business analysts at an insurance company receive CSV files in Amazon S3 every week. They must remove duplicate rows, correct invalid values and standardize date formats before they publish the cleaned files to S3 for reporting. The analysts have no programming skills and want a visual interface in which they can save the cleaning steps and reapply them to each new file.

    Which solution will meet these requirements?
  fr: |
    Les analystes métier d'une compagnie d'assurance reçoivent chaque semaine des fichiers CSV dans Amazon S3. Ils doivent supprimer les lignes en double, corriger les valeurs non valides et normaliser les formats de date avant de publier les fichiers nettoyés dans S3 pour le reporting. Les analystes n'ont aucune compétence en programmation et veulent une interface visuelle dans laquelle ils peuvent enregistrer les étapes de nettoyage et les réappliquer à chaque nouveau fichier.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Have the analysts write PySpark scripts and run them as AWS Glue ETL jobs every week.", fr: "Faire écrire des scripts PySpark par les analystes et les exécuter chaque semaine en tant que tâches ETL AWS Glue." } }
    - { id: b, text: { en: "Use AWS Glue DataBrew projects to build a recipe of transformations and run it as a job on each new file.", fr: "Utiliser des projets AWS Glue DataBrew pour créer une recette de transformations et l'exécuter en tant que tâche sur chaque nouveau fichier." } }
    - { id: c, text: { en: "Launch an Amazon EMR cluster with notebooks in which the analysts clean the data with Spark code.", fr: "Lancer un cluster Amazon EMR avec des blocs-notes dans lesquels les analystes nettoient les données avec du code Spark." } }
    - { id: d, text: { en: "Load each file into Amazon Redshift and have the analysts clean the data with SQL stored procedures.", fr: "Charger chaque fichier dans Amazon Redshift et faire nettoyer les données par les analystes avec des procédures stockées SQL." } }
answer: { optionId: b }
explanation:
  correct:
    en: AWS Glue DataBrew is a serverless, visual data preparation tool with more than 250 ready-made transformations for cleaning and normalizing data without code. Analysts build a recipe of steps in a project and run it as a job on new data, with the output written to Amazon S3.
    fr: "AWS Glue DataBrew est un outil visuel de préparation de données sans serveur qui propose plus de 250 transformations prêtes à l'emploi pour nettoyer et normaliser les données sans code. Les analystes créent une recette d'étapes dans un projet et l'exécutent en tant que tâche sur les nouvelles données, avec un résultat écrit dans Amazon S3."
  options:
    a: { en: "PySpark scripts require programming skills that the analysts do not have.", fr: "Les scripts PySpark exigent des compétences en programmation que les analystes n'ont pas." }
    c: { en: "EMR notebooks require Spark code and a cluster to manage, which the analysts cannot do.", fr: "Les blocs-notes EMR exigent du code Spark et un cluster à gérer, ce que les analystes ne savent pas faire." }
    d: { en: "Stored procedures are code, and loading files into a warehouse only to clean them adds cost and work.", fr: "Les procédures stockées sont du code, et charger des fichiers dans un entrepôt seulement pour les nettoyer ajoute du coût et du travail." }
references:
  - title: What is AWS Glue DataBrew?
    url: https://docs.aws.amazon.com/databrew/latest/dg/what-is.html
