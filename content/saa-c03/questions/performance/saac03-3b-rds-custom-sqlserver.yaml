id: saac03-3b-rds-custom-sqlserver
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating a packaged application that uses Microsoft SQL Server. The vendor requires a monitoring agent to be installed on the database host and requires privileged access to the operating system for custom patches. The company wants AWS to automate backups and other database administration tasks as much as possible.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise migre une application packagée qui utilise Microsoft SQL Server. L'éditeur exige qu'un agent de supervision soit installé sur l'hôte de la base de données et exige un accès privilégié au système d'exploitation pour des correctifs personnalisés. L'entreprise veut qu'AWS automatise autant que possible les sauvegardes et les autres tâches d'administration de la base.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Amazon RDS for SQL Server with a custom option group that installs the agent", fr: "Amazon RDS for SQL Server avec un groupe d'options personnalisé qui installe l'agent" }
    - id: b
      text: { en: "SQL Server installed on Amazon EC2 instances with backup scripts scheduled by the operations team", fr: "SQL Server installé sur des instances Amazon EC2 avec des scripts de sauvegarde planifiés par l'équipe d'exploitation" }
    - id: c
      text: { en: "Amazon RDS Custom for SQL Server, with the agent installed on the host by a privileged OS user", fr: "Amazon RDS Custom for SQL Server, avec l'agent installé sur l'hôte par un utilisateur privilégié du système d'exploitation" }
    - id: d
      text: { en: "Amazon Aurora PostgreSQL with Babelfish so that the application keeps sending T-SQL queries", fr: "Amazon Aurora PostgreSQL avec Babelfish afin que l'application continue d'envoyer des requêtes T-SQL" }
answer: { optionId: c }
explanation:
  correct:
    en: RDS Custom supports Oracle and SQL Server for legacy and packaged applications that need privileged access to the host, for example to install agents or custom patches. It keeps RDS automation such as backups, so it needs less effort than a self-managed installation.
    fr: RDS Custom prend en charge Oracle et SQL Server pour les applications héritées et packagées qui ont besoin d'un accès privilégié à l'hôte, par exemple pour installer des agents ou des correctifs personnalisés. Il conserve l'automatisation RDS, comme les sauvegardes, et demande donc moins d'effort qu'une installation autogérée.
  options:
    a:
      en: Amazon RDS for SQL Server gives no shell or host access, so the vendor's agent and OS patches cannot be installed.
      fr: Amazon RDS for SQL Server ne donne aucun accès shell ni à l'hôte ; l'agent de l'éditeur et les correctifs du système d'exploitation ne peuvent donc pas être installés.
    b:
      en: EC2 meets the access requirement, but the team must build and run backups and all other database administration itself, which is more operational overhead.
      fr: EC2 répond à l'exigence d'accès, mais l'équipe doit mettre en place et exploiter les sauvegardes et toute l'administration de la base elle-même, ce qui représente plus de charge opérationnelle.
    d:
      en: Babelfish changes the engine to PostgreSQL, which the vendor does not support, and Aurora gives no access to the host operating system.
      fr: Babelfish change le moteur pour PostgreSQL, que l'éditeur ne prend pas en charge, et Aurora ne donne aucun accès au système d'exploitation de l'hôte.
references:
  - title: Amazon RDS Custom
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-custom.html
  - title: Amazon RDS for Microsoft SQL Server
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html
