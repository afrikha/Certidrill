id: saac03-3a-sqs-fifo-ordering
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A banking application sends account transactions as messages to a consumer service. For each account, the transactions must be processed in exactly the order in which they were sent, and no duplicate messages can be introduced into the queue. Transactions for different accounts can be processed in parallel.

    Which solution will meet these requirements?
  fr: |
    Une application bancaire envoie les opérations des comptes sous forme de messages à un service consommateur. Pour chaque compte, les opérations doivent être traitées exactement dans l'ordre d'envoi, et aucun message en double ne doit être introduit dans la file d'attente. Les opérations de comptes différents peuvent être traitées en parallèle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon SQS standard queue with long polling enabled", fr: "Une file d'attente Amazon SQS standard avec l'interrogation longue activée" }
    - id: b
      text: { en: "An Amazon SQS standard queue configured as a delay queue", fr: "Une file d'attente Amazon SQS standard configurée comme file d'attente de délai" }
    - id: c
      text: { en: "An Amazon SNS standard topic with one subscription per account", fr: "Une rubrique Amazon SNS standard avec un abonnement par compte" }
    - id: d
      text: { en: "An Amazon SQS FIFO queue that uses the account ID as the message group ID", fr: "Une file d'attente Amazon SQS FIFO qui utilise l'ID de compte comme ID de groupe de messages" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      SQS FIFO queues preserve the order in which messages are sent and provide exactly-once processing with no duplicates introduced. Ordering is kept within each message group, so using the account ID as the group ID orders each account's transactions while different accounts are processed in parallel.
    fr: |-
      Les files d'attente SQS FIFO préservent l'ordre d'envoi des messages et assurent un traitement unique, sans introduction de doublons. L'ordre est garanti au sein de chaque groupe de messages : utiliser l'ID de compte comme ID de groupe ordonne les opérations de chaque compte, tandis que les comptes différents sont traités en parallèle.
  options:
    a:
      en: |-
        Standard queues provide best-effort ordering and at-least-once delivery; long polling only reduces empty responses.
      fr: |-
        Les files d'attente standard offrent un ordre au mieux et une remise au moins une fois ; l'interrogation longue ne fait que réduire les réponses vides.
    b:
      en: |-
        A delay queue postpones delivery of new messages; it does not add ordering or remove duplicates.
      fr: |-
        Une file d'attente de délai retarde la remise des nouveaux messages ; elle n'ajoute ni ordre ni suppression des doublons.
    c:
      en: |-
        A standard SNS topic does not guarantee ordering or deduplication, and a subscription per account does not scale.
      fr: |-
        Une rubrique SNS standard ne garantit ni l'ordre ni la déduplication, et un abonnement par compte n'est pas évolutif.
references:
  - title: Amazon SQS FIFO queues - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-fifo-queues.html
