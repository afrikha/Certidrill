id: saac03-3b-multi-tier-vpc
objective: "3.4.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is designing a three-tier web application in a VPC that spans two Availability Zones. Users reach the application from the internet. The application servers and the database must not have public IP addresses, each tier must accept traffic only from the tier in front of it, and every tier must survive the loss of one Availability Zone.

    Which combination of steps will meet these requirements? (Choose three.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise conçoit une application web à trois niveaux dans un VPC qui couvre deux zones de disponibilité. Les utilisateurs accèdent à l'application depuis Internet. Les serveurs d'applications et la base de données ne doivent pas avoir d'adresse IP publique, chaque niveau ne doit accepter que le trafic du niveau placé devant lui, et chaque niveau doit résister à la perte d'une zone de disponibilité.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en trois.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - { id: a, text: { en: "Deploy an internet-facing Application Load Balancer in public subnets in both Availability Zones.", fr: "Déployer un Application Load Balancer accessible sur Internet dans des sous-réseaux publics des deux zones de disponibilité." } }
    - { id: b, text: { en: "Place the database in a public subnet and restrict access with a network ACL.", fr: "Placer la base de données dans un sous-réseau public et restreindre l'accès avec une liste ACL réseau." } }
    - { id: c, text: { en: "Run the application servers in an Auto Scaling group in private subnets of both zones, allowing traffic only from the ALB's security group.", fr: "Exécuter les serveurs d'applications dans un groupe Auto Scaling dans des sous-réseaux privés des deux zones, en n'autorisant que le trafic du groupe de sécurité de l'ALB." } }
    - { id: d, text: { en: "Assign public IP addresses to the application servers and register them with the ALB.", fr: "Attribuer des adresses IP publiques aux serveurs d'applications et les enregistrer auprès de l'ALB." } }
    - { id: e, text: { en: "Deploy an Amazon RDS Multi-AZ database in private subnets, allowing traffic only from the application servers' security group.", fr: "Déployer une base de données Amazon RDS Multi-AZ dans des sous-réseaux privés, en n'autorisant que le trafic du groupe de sécurité des serveurs d'applications." } }
    - { id: f, text: { en: "Deploy all three tiers in a single Availability Zone to minimize latency between them.", fr: "Déployer les trois niveaux dans une seule zone de disponibilité pour réduire au minimum la latence entre eux." } }
answer: { optionIds: [ a, c, e ] }
explanation:
  correct:
    en: The internet-facing ALB in public subnets of both zones is the only public entry point. The application servers in private subnets of both zones accept traffic only from the ALB's security group, and the Multi-AZ database in private subnets accepts traffic only from the application tier's security group and fails over to the other zone.
    fr: L'ALB accessible sur Internet, dans des sous-réseaux publics des deux zones, est le seul point d'entrée public. Les serveurs d'applications, dans des sous-réseaux privés des deux zones, n'acceptent que le trafic du groupe de sécurité de l'ALB, et la base de données Multi-AZ, dans des sous-réseaux privés, n'accepte que le trafic du groupe de sécurité du niveau application et bascule vers l'autre zone.
  options:
    b:
      en: A database in a public subnet has a route to the internet gateway, and a network ACL cannot reference the application tier the way a security group can.
      fr: Une base de données dans un sous-réseau public dispose d'une route vers la passerelle Internet, et une liste ACL réseau ne peut pas référencer le niveau application comme le fait un groupe de sécurité.
    d:
      en: Public IP addresses on the application servers violate the requirement and expose them directly to the internet.
      fr: Des adresses IP publiques sur les serveurs d'applications enfreignent l'exigence et les exposent directement à Internet.
    f:
      en: A single Availability Zone cannot survive the loss of that zone.
      fr: Une seule zone de disponibilité ne peut pas résister à la perte de cette zone.
references:
  - title: What is an Application Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
