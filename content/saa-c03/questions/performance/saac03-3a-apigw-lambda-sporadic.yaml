id: saac03-3a-apigw-lambda-sporadic
objective: "3.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is building a REST API for a mobile app. Traffic is unpredictable: the API is idle for hours and then receives short bursts of thousands of requests. Each request runs for less than a second. The startup does not want to manage servers and wants to pay only when requests are processed.

    Which solution will meet these requirements?
  fr: |
    Une start-up développe une API REST pour une application mobile. Le trafic est imprévisible : l'API reste inactive pendant des heures, puis reçoit de courtes rafales de milliers de requêtes. Chaque requête dure moins d'une seconde. La start-up ne veut pas gérer de serveurs et souhaite payer uniquement lorsque des requêtes sont traitées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon API Gateway with AWS Lambda functions as the backend", fr: "Amazon API Gateway avec des fonctions AWS Lambda comme backend" }
    - id: b
      text: { en: "An Application Load Balancer in front of an Auto Scaling group with a minimum of one EC2 instance", fr: "Un Application Load Balancer devant un groupe Auto Scaling d'au moins une instance EC2" }
    - id: c
      text: { en: "An Amazon ECS service on EC2 container instances behind an Application Load Balancer", fr: "Un service Amazon ECS sur des instances de conteneur EC2 derrière un Application Load Balancer" }
    - id: d
      text: { en: "An AWS Elastic Beanstalk web server environment with load balancing", fr: "Un environnement de serveur web AWS Elastic Beanstalk avec répartition de charge" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      API Gateway and Lambda are serverless and scale automatically with the request rate. Both are billed per request (and, for Lambda, per execution duration), so the startup pays nothing while the API is idle and manages no servers.
    fr: |-
      API Gateway et Lambda sont sans serveur et s'adaptent automatiquement au nombre de requêtes. Les deux sont facturés à la requête (et, pour Lambda, à la durée d'exécution) : la start-up ne paie rien tant que l'API est inactive et ne gère aucun serveur.
  options:
    b:
      en: |-
        The instances and the load balancer are billed by the hour even when the API is idle, and the startup manages the instances.
      fr: |-
        Les instances et l'équilibreur de charge sont facturés à l'heure même quand l'API est inactive, et la start-up gère les instances.
    c:
      en: |-
        ECS on EC2 requires the startup to manage and pay for container instances that run continuously.
      fr: |-
        ECS sur EC2 exige que la start-up gère et paie des instances de conteneur qui s'exécutent en permanence.
    d:
      en: |-
        Elastic Beanstalk simplifies deployment, but its EC2 instances run and are billed continuously.
      fr: |-
        Elastic Beanstalk simplifie le déploiement, mais ses instances EC2 s'exécutent et sont facturées en permanence.
references:
  - title: Lambda quotas - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: Understanding Lambda Event Function scaling - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/lambda-concurrency.html
