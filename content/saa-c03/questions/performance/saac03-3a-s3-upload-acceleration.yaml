id: saac03-3a-s3-upload-acceleration
objective: "3.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A video sharing company stores uploads in a single Amazon S3 general purpose bucket in the us-east-1 Region. Users on several continents upload files of 2 GB to 5 GB over the internet. Uploads from distant users are slow, and when a connection drops, the whole upload restarts from the beginning.

    Which combination of actions will improve upload speed and resilience? (Choose two.)
  fr: |
    Une entreprise de partage de vidéos stocke les fichiers chargés dans un seul compartiment S3 à usage général de la Région us-east-1. Des utilisateurs de plusieurs continents chargent via Internet des fichiers de 2 à 5 Go. Les chargements des utilisateurs éloignés sont lents et, lorsqu'une connexion est interrompue, tout le chargement recommence depuis le début.

    Quelle combinaison d'actions améliore la vitesse et la résilience des chargements ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "Enable S3 Transfer Acceleration on the bucket and have clients upload to the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et faire charger les clients via le point de terminaison accéléré." }
    - id: b
      text: { en: "Configure S3 Cross-Region Replication from the bucket to buckets in other Regions.", fr: "Configurer S3 Cross-Region Replication du compartiment vers des compartiments d'autres Régions." }
    - id: c
      text: { en: "Upload the objects directly into the S3 Standard-IA storage class.", fr: "Charger les objets directement dans la classe de stockage S3 Standard-IA." }
    - id: d
      text: { en: "Spread the object keys across many prefixes to raise the bucket's request rate.", fr: "Répartir les clés d'objets entre de nombreux préfixes pour augmenter le taux de requêtes du compartiment." }
    - id: e
      text: { en: "Change the clients to use multipart upload and send the parts in parallel.", fr: "Modifier les clients pour utiliser le chargement en plusieurs parties et envoyer les parties en parallèle." }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: |-
      Transfer Acceleration routes uploads through CloudFront edge locations, which speeds up long-distance transfers to a centralized bucket. Multipart upload, recommended for objects of 100 MB or more, uploads parts in parallel to improve throughput, and only the failed parts need to be retried after a network error.
    fr: |-
      Transfer Acceleration achemine les chargements via les emplacements périphériques CloudFront, ce qui accélère les transferts longue distance vers un compartiment centralisé. Le chargement en plusieurs parties, recommandé pour les objets de 100 Mo ou plus, envoie les parties en parallèle pour améliorer le débit, et seules les parties en échec doivent être renvoyées après une erreur réseau.
  options:
    b:
      en: |-
        Replication copies objects after they reach the source bucket; it does not make the original upload faster or more resilient.
      fr: |-
        La réplication copie les objets une fois arrivés dans le compartiment source ; elle ne rend pas le chargement initial plus rapide ni plus résilient.
    c:
      en: |-
        The storage class changes storage and retrieval pricing, not the speed or resilience of the upload.
      fr: |-
        La classe de stockage modifie la tarification du stockage et de la récupération, pas la vitesse ni la résilience du chargement.
    d:
      en: |-
        Each prefix already supports at least 3,500 write requests per second; the problem is distance and large files, not the request rate.
      fr: |-
        Chaque préfixe prend déjà en charge au moins 3 500 requêtes d'écriture par seconde ; le problème est la distance et la taille des fichiers, pas le taux de requêtes.
references:
  - title: Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html
  - title: Uploading and copying objects using multipart upload in Amazon S3 - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html
