id: saac03-3c-lf-tag-based-access
objective: "3.5.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company's data lake in Amazon S3 is governed by AWS Lake Formation and contains 4,000 tables in the AWS Glue Data Catalog. Teams add new tables every week. Access is granted by department and by data classification (public, internal, confidential). Administrators currently grant permissions table by table, and every new table needs new grants for many principals.

    Which solution will make permission management scale with the LEAST operational overhead?
  fr: |
    Le lac de données d'une entreprise dans Amazon S3 est gouverné par AWS Lake Formation et contient 4 000 tables dans AWS Glue Data Catalog. Les équipes ajoutent de nouvelles tables chaque semaine. L'accès est accordé par département et par classification des données (public, interne, confidentiel). Les administrateurs accordent actuellement les autorisations table par table, et chaque nouvelle table exige de nouvelles autorisations pour de nombreux principaux.

    Quelle solution permet à la gestion des autorisations d'évoluer avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Write IAM policies that list the ARN of each table for each department and update them when tables are added.", fr: "Écrire des politiques IAM qui listent l'ARN de chaque table pour chaque département et les mettre à jour à chaque ajout de table." } }
    - { id: b, text: { en: "Create LF-Tags for department and classification, assign them to databases and tables, and grant permissions on LF-Tag expressions.", fr: "Créer des LF-Tags pour le département et la classification, les attribuer aux bases de données et aux tables, et accorder les autorisations sur des expressions de LF-Tags." } }
    - { id: c, text: { en: "Create a Lake Formation data filter for each table and grant each filter to the principals that need it.", fr: "Créer un filtre de données Lake Formation pour chaque table et accorder chaque filtre aux principaux qui en ont besoin." } }
    - { id: d, text: { en: "Store each department's tables under a separate S3 prefix and control access with S3 bucket policies.", fr: "Stocker les tables de chaque département sous un préfixe S3 distinct et contrôler l'accès avec des politiques de compartiment S3." } }
answer: { optionId: b }
explanation:
  correct:
    en: Lake Formation tag-based access control grants permissions on LF-Tag values instead of on named resources. Tables inherit LF-Tags from their database, so a new table gets access as soon as it is tagged, and the number of grants grows with principals plus resources instead of principals times resources.
    fr: "Le contrôle d'accès basé sur les balises de Lake Formation accorde les autorisations sur des valeurs de LF-Tags plutôt que sur des ressources nommées. Les tables héritent des LF-Tags de leur base de données : une nouvelle table devient accessible dès qu'elle est balisée, et le nombre d'autorisations croît comme la somme des principaux et des ressources, et non comme leur produit."
  options:
    a: { en: "Per-table IAM policies are the same named-resource approach, with updates for every new table.", fr: "Des politiques IAM par table reprennent l'approche par ressources nommées, avec des mises à jour à chaque nouvelle table." }
    c: { en: "Data filters restrict rows and columns inside one table; one filter per table still means work for every new table.", fr: "Les filtres de données restreignent les lignes et colonnes d'une table ; un filtre par table impose toujours du travail à chaque nouvelle table." }
    d: { en: "Bucket policies work on S3 paths, not on Data Catalog tables, and cannot express classification-based access across departments.", fr: "Les politiques de compartiment portent sur des chemins S3, pas sur des tables du Data Catalog, et ne peuvent pas exprimer un accès par classification entre départements." }
references:
  - title: Lake Formation tag-based access control
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/tag-based-access-control.html
