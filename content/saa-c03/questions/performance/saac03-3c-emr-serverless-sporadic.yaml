id: saac03-3c-emr-serverless-sporadic
objective: "3.5.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data engineering team runs Apache Spark jobs a few times each week. The data volume and the duration of each job are unpredictable. The team wants to run its existing open-source Spark applications without choosing instance types, sizing clusters, or paying for idle capacity between jobs.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une équipe d'ingénierie des données exécute des tâches Apache Spark quelques fois par semaine. Le volume de données et la durée de chaque tâche sont imprévisibles. L'équipe souhaite exécuter ses applications Spark open source existantes sans choisir de types d'instances, sans dimensionner de clusters et sans payer de capacité inactive entre les tâches.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Keep a long-running Amazon EMR cluster on EC2 sized for the largest job and submit the jobs as steps.", fr: "Conserver un cluster Amazon EMR permanent sur EC2 dimensionné pour la plus grosse tâche et soumettre les tâches sous forme d'étapes." } }
    - { id: b, text: { en: "Create an Amazon EMR Serverless application for Spark and submit each job run to it.", fr: "Créer une application Amazon EMR Serverless pour Spark et y soumettre chaque exécution de tâche." } }
    - { id: c, text: { en: "Launch a transient Amazon EMR cluster on EC2 for each job with instance types chosen per job.", fr: "Lancer un cluster Amazon EMR éphémère sur EC2 pour chaque tâche, avec des types d'instances choisis pour chacune." } }
    - { id: d, text: { en: "Rewrite the Spark applications as SQL and run them in an Amazon Redshift provisioned cluster.", fr: "Réécrire les applications Spark en SQL et les exécuter dans un cluster Amazon Redshift provisionné." } }
answer: { optionId: b }
explanation:
  correct:
    en: Amazon EMR Serverless runs Spark and Hive applications without clusters to configure or operate. It determines the resources each job needs, provisions workers, scales them during the job and releases them when the job finishes, so there is no sizing and no idle capacity.
    fr: "Amazon EMR Serverless exécute des applications Spark et Hive sans cluster à configurer ni à exploiter. Il détermine les ressources dont chaque tâche a besoin, provisionne des workers, les met à l'échelle pendant la tâche et les libère à la fin : aucun dimensionnement et aucune capacité inactive."
  options:
    a: { en: "A long-running cluster sized for the peak is billed while idle between jobs and must be managed.", fr: "Un cluster permanent dimensionné pour la pointe est facturé pendant l'inactivité entre les tâches et doit être géré." }
    c: { en: "Transient clusters avoid idle cost but the team still chooses instance types and sizes a cluster for every job.", fr: "Des clusters éphémères évitent le coût d'inactivité, mais l'équipe choisit toujours les types d'instances et dimensionne un cluster pour chaque tâche." }
    d: { en: "Rewriting Spark applications as SQL is a large change, and a provisioned warehouse is billed when idle.", fr: "Réécrire des applications Spark en SQL est une modification importante, et un entrepôt provisionné est facturé pendant l'inactivité." }
references:
  - title: What is Amazon EMR Serverless?
    url: https://docs.aws.amazon.com/emr/latest/EMR-Serverless-UserGuide/emr-serverless.html
