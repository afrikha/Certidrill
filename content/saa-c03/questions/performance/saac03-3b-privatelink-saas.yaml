id: saac03-3b-privatelink-saas
objective: "3.4.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A SaaS provider runs an API on Amazon EC2 instances in its own VPC. Hundreds of customers must reach the API privately from their own VPCs in other AWS accounts in the same Region, and many customer VPCs use CIDR blocks that overlap the provider's VPC. Only customers may initiate connections, and the API must not be exposed to the internet.

    Which solution will meet these requirements?
  fr: |
    Un fournisseur SaaS exécute une API sur des instances Amazon EC2 dans son propre VPC. Des centaines de clients doivent joindre l'API de façon privée depuis leurs propres VPC, dans d'autres comptes AWS de la même Région, et de nombreux VPC clients utilisent des blocs CIDR qui chevauchent celui du VPC du fournisseur. Seuls les clients peuvent initier des connexions, et l'API ne doit pas être exposée sur Internet.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a VPC peering connection between the provider VPC and each customer VPC.", fr: "Créer un appairage de VPC (VPC peering) entre le VPC du fournisseur et chaque VPC client." }
    - id: b
      text: { en: "Attach the provider VPC and every customer VPC to a shared transit gateway.", fr: "Attacher le VPC du fournisseur et chaque VPC client à une passerelle de transit partagée." }
    - id: c
      text: { en: "Publish the API through an internet-facing Network Load Balancer whose security group allows only customer IP ranges.", fr: "Publier l'API via un Network Load Balancer accessible sur Internet dont le groupe de sécurité n'autorise que les plages IP des clients." }
    - id: d
      text: { en: "Put a Network Load Balancer in front of the API, create a VPC endpoint service, and let customers create interface endpoints.", fr: "Placer un Network Load Balancer devant l'API, créer un service de point de terminaison de VPC et laisser les clients créer des points de terminaison d'interface." }
answer: { optionId: d }
explanation:
  correct:
    en: With AWS PrivateLink, the provider puts a Network Load Balancer in front of the service and creates an endpoint service, and each consumer creates an interface endpoint in its own subnets. Connections are initiated only from consumer VPCs, traffic does not use the internet, and overlapping CIDR blocks are supported because consumers reach the service through network interfaces in their own VPC.
    fr: Avec AWS PrivateLink, le fournisseur place un Network Load Balancer devant le service et crée un service de point de terminaison, et chaque consommateur crée un point de terminaison d'interface dans ses propres sous-réseaux. Les connexions ne sont initiées que depuis les VPC consommateurs, le trafic n'utilise pas Internet, et les blocs CIDR qui se chevauchent sont pris en charge, car les consommateurs joignent le service via des interfaces réseau de leur propre VPC.
  options:
    a:
      en: VPC peering cannot connect VPCs with overlapping CIDR blocks, allows traffic in both directions and needs one connection per customer.
      fr: L'appairage de VPC ne peut pas relier des VPC dont les blocs CIDR se chevauchent, autorise le trafic dans les deux sens et exige une connexion par client.
    b:
      en: A transit gateway routes by destination IP address, so overlapping CIDR blocks conflict, and it opens routed connectivity in both directions.
      fr: Une passerelle de transit achemine selon l'adresse IP de destination ; les blocs CIDR qui se chevauchent entrent donc en conflit, et elle ouvre une connectivité routée dans les deux sens.
    c:
      en: An internet-facing load balancer exposes the API on the internet, which the requirement forbids.
      fr: Un équilibreur de charge accessible sur Internet expose l'API sur Internet, ce que l'exigence interdit.
references:
  - title: Share your services through AWS PrivateLink
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/privatelink-share-your-services.html
  - title: AWS PrivateLink
