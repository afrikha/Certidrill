id: saac03-3b-rds-proxy-lambda
objective: "3.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an API on AWS Lambda functions that query an Amazon RDS for MySQL DB instance. During traffic bursts, thousands of concurrent function invocations open new database connections, and the database returns "too many connections" errors. The company wants to fix the errors with the fewest changes to the application code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une API sur des fonctions AWS Lambda qui interrogent une instance de base de données Amazon RDS for MySQL. Pendant les pics de trafic, des milliers d'invocations simultanées ouvrent de nouvelles connexions à la base, et celle-ci renvoie des erreurs « too many connections ». L'entreprise veut corriger ces erreurs avec le moins de modifications possible du code de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon RDS Proxy for the DB instance and point the functions to the proxy endpoint.", fr: "Créer un Amazon RDS Proxy pour l'instance de base de données et faire pointer les fonctions vers le point de terminaison du proxy." }
    - id: b
      text: { en: "Create an RDS read replica and point the functions to the replica endpoint.", fr: "Créer un réplica en lecture RDS et faire pointer les fonctions vers le point de terminaison du réplica." }
    - id: c
      text: { en: "Set the reserved concurrency of each function to 10 so that fewer connections are opened.", fr: "Définir la simultanéité réservée de chaque fonction à 10 afin d'ouvrir moins de connexions." }
    - id: d
      text: { en: "Convert the DB instance to a Multi-AZ DB instance deployment to add a standby.", fr: "Convertir l'instance de base de données en déploiement d'instance de base de données Multi-AZ pour ajouter une instance de secours." }
answer: { optionId: a }
explanation:
  correct:
    en: RDS Proxy keeps a pool of database connections and reuses them across clients, which removes the overhead of opening a connection per invocation and lets you cap the connections to the database. The functions only change their connection endpoint.
    fr: RDS Proxy maintient un pool de connexions à la base de données et les réutilise entre clients, ce qui supprime le coût d'ouverture d'une connexion par invocation et permet de plafonner les connexions à la base. Les fonctions changent seulement leur point de terminaison de connexion.
  options:
    b:
      en: A read replica accepts only reads and still receives one connection per invocation, so writes fail and the connection storm moves to the replica.
      fr: Un réplica en lecture n'accepte que les lectures et reçoit toujours une connexion par invocation ; les écritures échouent et l'afflux de connexions se reporte sur le réplica.
    c:
      en: Limiting concurrency throttles the API during bursts, so requests fail instead of being served.
      fr: Limiter la simultanéité restreint l'API pendant les pics ; les requêtes échouent au lieu d'être servies.
    d:
      en: The Multi-AZ standby does not serve traffic, so the connection limit of the primary does not change.
      fr: L'instance de secours Multi-AZ ne sert pas de trafic ; la limite de connexions de l'instance principale ne change donc pas.
references:
  - title: Amazon RDS Proxy
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
