id: saac03-3c-transfer-family-partner-sftp
objective: "3.5.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company receives nightly batch files from 40 external partners. The partners upload the files with their existing SFTP clients to an on-premises SFTP server. The company wants to retire the server and land the files directly in Amazon S3 for processing. The partners must not change their SFTP clients or transfer process.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de services financiers reçoit chaque nuit des fichiers par lots de 40 partenaires externes. Les partenaires chargent les fichiers avec leurs clients SFTP existants sur un serveur SFTP sur site. L'entreprise souhaite retirer ce serveur et déposer les fichiers directement dans Amazon S3 pour traitement. Les partenaires ne doivent changer ni leurs clients SFTP ni leur processus de transfert.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle possible ?
body:
  options:
    - { id: a, text: { en: "Give each partner presigned S3 URLs every night and ask them to upload the files with HTTPS requests.", fr: "Remettre chaque nuit des URL S3 présignées à chaque partenaire et leur demander de charger les fichiers par requêtes HTTPS." } }
    - { id: b, text: { en: "Run an open-source SFTP server on EC2 instances in an Auto Scaling group that copies the received files to S3.", fr: "Exécuter un serveur SFTP open source sur des instances EC2 d'un Auto Scaling group qui copie les fichiers reçus dans S3." } }
    - { id: c, text: { en: "Create an Amazon Data Firehose stream with an HTTP endpoint and ask the partners to send their files to it.", fr: "Créer un flux Amazon Data Firehose avec un point de terminaison HTTP et demander aux partenaires d'y envoyer leurs fichiers." } }
    - { id: d, text: { en: "Create an AWS Transfer Family server that uses the SFTP protocol and stores the uploaded files in the S3 bucket.", fr: "Créer un serveur AWS Transfer Family qui utilise le protocole SFTP et stocke les fichiers chargés dans le compartiment S3." } }
answer: { optionId: d }
explanation:
  correct:
    en: AWS Transfer Family is a managed file transfer service that supports SFTP, FTPS, FTP and AS2 with Amazon S3 or Amazon EFS as storage. Partners keep using their SFTP clients against the managed endpoint, files land directly in S3, and there is no server to patch or scale.
    fr: "AWS Transfer Family est un service de transfert de fichiers géré qui prend en charge SFTP, FTPS, FTP et AS2 avec Amazon S3 ou Amazon EFS comme stockage. Les partenaires continuent d'utiliser leurs clients SFTP avec le point de terminaison géré, les fichiers arrivent directement dans S3, et il n'y a aucun serveur à corriger ni à mettre à l'échelle."
  options:
    a: { en: "Presigned URLs force the partners to change their transfer process from SFTP to HTTPS.", fr: "Les URL présignées obligent les partenaires à passer d'un transfert SFTP à HTTPS." }
    b: { en: "Self-managed SFTP servers work but must be patched, secured and scaled, which is more overhead than a managed service.", fr: "Des serveurs SFTP autogérés fonctionnent, mais doivent être corrigés, sécurisés et mis à l'échelle, ce qui représente plus de charge qu'un service géré." }
    c: { en: "Firehose ingests streaming records, not SFTP file uploads, and the partners would have to change their process.", fr: "Firehose ingère des enregistrements en streaming, pas des chargements de fichiers SFTP, et les partenaires devraient modifier leur processus." }
references:
  - title: What is AWS Transfer Family?
    url: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
