id: saac03-3b-mysql-homogeneous-dms
objective: "3.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company wants to move a 2 TB on-premises MySQL 8.0 database to Amazon RDS for MySQL. The application must keep writing to the on-premises database until the cutover, and the cutover window must be as short as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise veut déplacer une base de données MySQL 8.0 sur site de 2 To vers Amazon RDS for MySQL. L'application doit continuer à écrire dans la base sur site jusqu'à la bascule, et la fenêtre de bascule doit être aussi courte que possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Take a mysqldump backup during a weekend maintenance window and restore it into the RDS DB instance.", fr: "Effectuer une sauvegarde mysqldump pendant une fenêtre de maintenance du week-end et la restaurer dans l'instance de base de données RDS." }
    - id: b
      text: { en: "Run DMS Schema Conversion on the MySQL schema, then run an AWS DMS full-load-only task during the cutover.", fr: "Exécuter DMS Schema Conversion sur le schéma MySQL, puis une tâche AWS DMS de chargement complet uniquement pendant la bascule." }
    - id: c
      text: { en: "Run an AWS DMS task with full load and ongoing replication, and switch the application when the target is in sync.", fr: "Exécuter une tâche AWS DMS avec chargement complet et réplication continue, et basculer l'application lorsque la cible est synchronisée." }
    - id: d
      text: { en: "Copy the MySQL data directory to an Amazon S3 File Gateway and attach the share to the RDS DB instance.", fr: "Copier le répertoire de données MySQL vers une passerelle Amazon S3 File Gateway et attacher le partage à l'instance de base de données RDS." }
answer: { optionId: c }
explanation:
  correct:
    en: MySQL to RDS for MySQL is a homogeneous migration, so no schema conversion is needed. A full-load-plus-CDC task copies the existing data and then applies ongoing changes from the binary log while the source stays in use, so the cutover only needs the most recent changes.
    fr: MySQL vers RDS for MySQL est une migration homogène ; aucune conversion de schéma n'est nécessaire. Une tâche avec chargement complet et CDC copie les données existantes, puis applique les modifications continues issues du journal binaire pendant que la source reste utilisée ; la bascule n'a donc besoin que des modifications les plus récentes.
  options:
    a:
      en: Writes made after the dump are lost unless the application stops, so this approach needs a long outage for a 2 TB database.
      fr: Les écritures effectuées après le vidage sont perdues sauf si l'application s'arrête ; cette approche impose donc une longue interruption pour une base de 2 To.
    b:
      en: Schema conversion is meant for heterogeneous migrations, and a full load alone during the cutover means downtime for the whole 2 TB copy.
      fr: La conversion de schéma est prévue pour les migrations hétérogènes, et un chargement complet seul pendant la bascule impose un arrêt pendant toute la copie des 2 To.
    d:
      en: RDS does not mount file shares as its data directory; RDS manages its own storage and cannot use copied MySQL data files.
      fr: RDS ne monte pas de partage de fichiers comme répertoire de données ; RDS gère son propre stockage et ne peut pas utiliser des fichiers de données MySQL copiés.
references:
  - title: Creating tasks for ongoing replication using AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Task.CDC.html
