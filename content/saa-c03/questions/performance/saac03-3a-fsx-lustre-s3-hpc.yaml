id: saac03-3a-fsx-lustre-s3-hpc
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A genomics company stores raw sequencing data as objects in an Amazon S3 bucket. Several times each month, the company runs a large Linux compute cluster on Amazon EC2 that must read this data through a shared file system with sub-millisecond latency and very high aggregate throughput. The file system must present the S3 objects as files and write results back to the bucket.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de génomique stocke des données de séquençage brutes sous forme d'objets dans un compartiment Amazon S3. Plusieurs fois par mois, l'entreprise exécute sur Amazon EC2 un grand cluster de calcul Linux qui doit lire ces données via un système de fichiers partagé, avec une latence inférieure à la milliseconde et un débit agrégé très élevé. Le système de fichiers doit présenter les objets S3 sous forme de fichiers et réécrire les résultats dans le compartiment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EFS file system that uses Max I/O mode and copy the data into it before each run.", fr: "Créer un système de fichiers Amazon EFS en mode Max I/O et y copier les données avant chaque exécution." }
    - id: b
      text: { en: "Deploy Amazon S3 File Gateway on an EC2 instance and mount its NFS share on the cluster nodes.", fr: "Déployer Amazon S3 File Gateway sur une instance EC2 et monter son partage NFS sur les nœuds du cluster." }
    - id: c
      text: { en: "Create an Amazon FSx for Windows File Server file system and copy the data into it before each run.", fr: "Créer un système de fichiers Amazon FSx for Windows File Server et y copier les données avant chaque exécution." }
    - id: d
      text: { en: "Create an Amazon FSx for Lustre file system linked to the S3 bucket and mount it on the cluster nodes.", fr: "Créer un système de fichiers Amazon FSx for Lustre lié au compartiment S3 et le monter sur les nœuds du cluster." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      FSx for Lustre is built for HPC and ML workloads, with sub-millisecond latency and up to multiple TBps of throughput. When linked to an S3 bucket, it transparently presents the objects as files and can write data back to S3, so no copy step is needed.
    fr: |-
      FSx for Lustre est conçu pour les charges HPC et ML, avec une latence inférieure à la milliseconde et un débit pouvant atteindre plusieurs To/s. Lié à un compartiment S3, il présente de manière transparente les objets sous forme de fichiers et peut réécrire les données dans S3 : aucune étape de copie n'est nécessaire.
  options:
    a:
      en: |-
        EFS has no link to an S3 bucket, and Max I/O is a previous-generation mode with higher per-operation latency, not sub-millisecond HPC performance.
      fr: |-
        EFS n'a pas de lien avec un compartiment S3, et Max I/O est un mode de génération précédente dont la latence par opération est plus élevée, sans performances HPC inférieures à la milliseconde.
    b:
      en: |-
        S3 File Gateway is meant for hybrid file access through a cache; a single gateway does not deliver the aggregate throughput a large compute cluster needs.
      fr: |-
        S3 File Gateway est destiné à l'accès hybride aux fichiers via un cache ; une seule passerelle ne fournit pas le débit agrégé dont un grand cluster de calcul a besoin.
    c:
      en: |-
        FSx for Windows File Server serves SMB shares for Windows workloads; it has no S3 link and is not designed for Linux HPC clusters.
      fr: |-
        FSx for Windows File Server sert des partages SMB pour des charges Windows ; il n'a pas de lien avec S3 et n'est pas conçu pour des clusters HPC Linux.
references:
  - title: What is Amazon FSx for Lustre? - FSx for Lustre
    url: https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html
