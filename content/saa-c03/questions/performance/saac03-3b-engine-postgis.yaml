id: saac03-3b-engine-postgis
objective: "3.3.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company is building a route-planning application on AWS. The application must run geospatial queries such as distance calculations and polygon containment by using PostGIS functions. The company wants a managed relational database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique développe une application de planification d'itinéraires sur AWS. L'application doit exécuter des requêtes géospatiales, comme des calculs de distance et des tests d'inclusion dans un polygone, à l'aide des fonctions PostGIS. L'entreprise veut une base de données relationnelle gérée.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon RDS for MariaDB", fr: "Amazon RDS for MariaDB" } }
    - { id: b, text: { en: "Amazon RDS for PostgreSQL with the PostGIS extension", fr: "Amazon RDS for PostgreSQL avec l'extension PostGIS" } }
    - { id: c, text: { en: "Amazon RDS for MySQL with a larger instance class", fr: "Amazon RDS for MySQL avec une classe d'instance plus grande" } }
    - { id: d, text: { en: "Amazon DynamoDB with a global secondary index on coordinates", fr: "Amazon DynamoDB avec un index secondaire global sur les coordonnées" } }
answer: { optionId: b }
explanation:
  correct:
    en: PostGIS is a PostgreSQL extension that adds spatial data types and thousands of geospatial functions. RDS for PostgreSQL supports it, and a user with rds_superuser privileges enables it with CREATE EXTENSION.
    fr: PostGIS est une extension PostgreSQL qui ajoute des types de données spatiales et des milliers de fonctions géospatiales. RDS for PostgreSQL la prend en charge, et un utilisateur disposant des privilèges rds_superuser l'active avec CREATE EXTENSION.
  options:
    a:
      en: MariaDB is a MySQL-family engine; PostGIS runs only on PostgreSQL.
      fr: MariaDB est un moteur de la famille MySQL ; PostGIS ne fonctionne que sur PostgreSQL.
    c:
      en: The instance size does not add extensions; PostGIS functions are not available on MySQL.
      fr: La taille de l'instance n'ajoute pas d'extensions ; les fonctions PostGIS ne sont pas disponibles sur MySQL.
    d:
      en: DynamoDB is a NoSQL key-value database without PostGIS or SQL spatial functions.
      fr: DynamoDB est une base NoSQL clé-valeur sans PostGIS ni fonctions spatiales SQL.
references:
  - title: Managing spatial data with the PostGIS extension
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Appendix.PostgreSQL.CommonDBATasks.PostGIS.html
