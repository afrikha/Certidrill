id: saac03-3b-nlb-static-ip
objective: "3.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A trading platform receives order messages from partners over a custom TCP protocol. The partners' firewalls allow outbound traffic only to a fixed IP address in each Availability Zone. The load balancer must handle millions of requests per second with very low latency and must not terminate or inspect the application protocol.

    Which solution will meet these requirements?
  fr: |
    Une plateforme de trading reçoit des messages d'ordres de ses partenaires via un protocole TCP personnalisé. Les pare-feu des partenaires n'autorisent le trafic sortant que vers une adresse IP fixe dans chaque zone de disponibilité. L'équilibreur de charge doit gérer des millions de requêtes par seconde avec une très faible latence et ne doit ni terminer ni inspecter le protocole applicatif.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An internet-facing Network Load Balancer with a TCP listener and an Elastic IP address in each subnet", fr: "Un Network Load Balancer accessible sur Internet avec un écouteur TCP et une adresse IP Elastic dans chaque sous-réseau" }
    - id: b
      text: { en: "An internet-facing Application Load Balancer with an HTTPS listener and host-based rules", fr: "Un Application Load Balancer accessible sur Internet avec un écouteur HTTPS et des règles basées sur l'hôte" }
    - id: c
      text: { en: "A Gateway Load Balancer with the order servers registered as appliance targets", fr: "Un Gateway Load Balancer avec les serveurs d'ordres enregistrés comme cibles d'appliance" }
    - id: d
      text: { en: "An Amazon CloudFront distribution with the order servers as a custom origin", fr: "Une distribution Amazon CloudFront avec les serveurs d'ordres comme origine personnalisée" }
answer: { optionId: a }
explanation:
  correct:
    en: A Network Load Balancer works at layer 4, supports TCP and handles millions of requests per second. It gets a static IP address per Availability Zone, and an internet-facing NLB can use one Elastic IP address per subnet, which gives partners fixed addresses to allow.
    fr: Un Network Load Balancer fonctionne en couche 4, prend en charge TCP et gère des millions de requêtes par seconde. Il obtient une adresse IP statique par zone de disponibilité, et un NLB accessible sur Internet peut utiliser une adresse IP Elastic par sous-réseau, ce qui donne aux partenaires des adresses fixes à autoriser.
  options:
    b:
      en: An ALB handles only HTTP and HTTPS at layer 7, so it cannot carry a custom TCP protocol, and its IP addresses are not fixed.
      fr: Un ALB ne gère que HTTP et HTTPS en couche 7 ; il ne peut donc pas transporter un protocole TCP personnalisé, et ses adresses IP ne sont pas fixes.
    c:
      en: A Gateway Load Balancer sends traffic to inspection appliances through GENEVE; it is not a front end for application servers.
      fr: Un Gateway Load Balancer envoie le trafic vers des appliances d'inspection via GENEVE ; ce n'est pas un frontal pour des serveurs d'applications.
    d:
      en: CloudFront delivers HTTP and HTTPS content and does not forward a custom TCP protocol or provide fixed addresses per zone.
      fr: CloudFront distribue du contenu HTTP et HTTPS et ne transmet pas de protocole TCP personnalisé ni ne fournit d'adresses fixes par zone.
references:
  - title: What is a Network Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
