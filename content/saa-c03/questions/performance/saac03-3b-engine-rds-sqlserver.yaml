id: saac03-3b-engine-rds-sqlserver
objective: "3.3.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating an in-house application that relies on Microsoft SQL Server-specific T-SQL stored procedures. The vendor of a reporting add-on supports only SQL Server. The application needs no access to the database host. The company wants a managed database with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre une application interne qui s'appuie sur des procédures stockées T-SQL propres à Microsoft SQL Server. L'éditeur d'un module de reporting ne prend en charge que SQL Server. L'application n'a besoin d'aucun accès à l'hôte de la base de données. L'entreprise veut une base de données gérée avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon Aurora PostgreSQL with Babelfish turned on", fr: "Amazon Aurora PostgreSQL avec Babelfish activé" } }
    - { id: b, text: { en: "Amazon RDS Custom for SQL Server", fr: "Amazon RDS Custom for SQL Server" } }
    - { id: c, text: { en: "SQL Server installed on Amazon EC2 instances", fr: "SQL Server installé sur des instances Amazon EC2" } }
    - { id: d, text: { en: "Amazon RDS for SQL Server", fr: "Amazon RDS for SQL Server" } }
answer: { optionId: d }
explanation:
  correct:
    en: RDS for SQL Server runs the SQL Server engine itself, so T-SQL procedures and the vendor's add-on keep working, and AWS manages patching, backups and failover. Because no host access is needed, the fully managed option has the least overhead.
    fr: RDS for SQL Server exécute le moteur SQL Server lui-même ; les procédures T-SQL et le module de l'éditeur continuent donc de fonctionner, et AWS gère les correctifs, les sauvegardes et le basculement. Comme aucun accès à l'hôte n'est nécessaire, l'option entièrement gérée est celle qui a le moins de charge.
  options:
    a:
      en: Babelfish lets Aurora PostgreSQL understand T-SQL, but the engine is PostgreSQL, which the add-on vendor does not support.
      fr: Babelfish permet à Aurora PostgreSQL de comprendre le T-SQL, mais le moteur est PostgreSQL, que l'éditeur du module ne prend pas en charge.
    b:
      en: RDS Custom is for applications that need privileged access to the host and OS, and it leaves more of the environment to the customer; that access is not needed here.
      fr: RDS Custom est destiné aux applications qui ont besoin d'un accès privilégié à l'hôte et au système d'exploitation, et il laisse davantage de l'environnement au client ; cet accès n'est pas nécessaire ici.
    c:
      en: SQL Server on EC2 works but makes the company responsible for installation, patching, backups and high availability.
      fr: SQL Server sur EC2 fonctionne mais rend l'entreprise responsable de l'installation, des correctifs, des sauvegardes et de la haute disponibilité.
references:
  - title: Amazon RDS for Microsoft SQL Server
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html
