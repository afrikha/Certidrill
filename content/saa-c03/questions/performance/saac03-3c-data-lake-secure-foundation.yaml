id: saac03-3c-data-lake-secure-foundation
objective: "3.5.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is building a new data lake in Amazon S3. Data will be cataloged in the AWS Glue Data Catalog and queried with Amazon Athena, Amazon EMR and Amazon Redshift Spectrum. The security team requires central management of table-level and column-level permissions that all these engines enforce. All data must be encrypted at rest with keys whose policies the company controls and whose use it can audit.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise crée un nouveau lac de données dans Amazon S3. Les données seront cataloguées dans AWS Glue Data Catalog et interrogées avec Amazon Athena, Amazon EMR et Amazon Redshift Spectrum. L'équipe de sécurité exige une gestion centrale des autorisations au niveau des tables et des colonnes, appliquées par tous ces moteurs. Toutes les données doivent être chiffrées au repos avec des clés dont l'entreprise contrôle les politiques et dont elle peut auditer l'utilisation.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Keep the default server-side encryption with Amazon S3 managed keys (SSE-S3) on the buckets.", fr: "Conserver le chiffrement côté serveur par défaut avec des clés gérées par Amazon S3 (SSE-S3) sur les compartiments." } }
    - { id: b, text: { en: "Register the S3 locations with Lake Formation and grant table and column permissions on Data Catalog resources in Lake Formation.", fr: "Enregistrer les emplacements S3 auprès de Lake Formation et accorder les autorisations sur les tables et les colonnes des ressources du Data Catalog dans Lake Formation." } }
    - { id: c, text: { en: "Write S3 bucket policies that grant each analyst access to the objects that contain the columns they may read.", fr: "Écrire des politiques de compartiment S3 qui accordent à chaque analyste l'accès aux objets contenant les colonnes qu'il peut lire." } }
    - { id: d, text: { en: "Configure default bucket encryption with SSE-KMS and a customer managed AWS KMS key.", fr: "Configurer le chiffrement par défaut des compartiments avec SSE-KMS et une clé AWS KMS gérée par le client." } }
    - { id: e, text: { en: "Enable S3 Versioning and MFA delete on every bucket of the data lake.", fr: "Activer la gestion des versions S3 et la suppression MFA sur chaque compartiment du lac de données." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Registering S3 locations with Lake Formation brings the data under Lake Formation permissions, which are granted centrally on Data Catalog tables and columns and enforced by Athena, EMR, Redshift Spectrum and AWS Glue. SSE-KMS with a customer managed key lets the company define the key policy, rotate or disable the key, and audit its use in AWS CloudTrail.
    fr: "Enregistrer les emplacements S3 auprès de Lake Formation place les données sous les autorisations Lake Formation, accordées de façon centrale sur les tables et les colonnes du Data Catalog et appliquées par Athena, EMR, Redshift Spectrum et AWS Glue. SSE-KMS avec une clé gérée par le client permet à l'entreprise de définir la politique de clé, de faire pivoter ou de désactiver la clé et d'en auditer l'utilisation dans AWS CloudTrail."
  options:
    a: { en: "With SSE-S3, Amazon S3 manages the keys: the company has no key policy to control and no per-key usage to audit.", fr: "Avec SSE-S3, Amazon S3 gère les clés : l'entreprise n'a aucune politique de clé à contrôler ni d'utilisation par clé à auditer." }
    c: { en: "Bucket policies work at the object level; they cannot grant access to some columns of a table.", fr: "Les politiques de compartiment fonctionnent au niveau des objets ; elles ne peuvent pas accorder l'accès à certaines colonnes d'une table." }
    e: { en: "Versioning and MFA delete protect against deletion; they provide neither fine-grained permissions nor encryption.", fr: "La gestion des versions et la suppression MFA protègent contre la suppression ; elles n'apportent ni autorisations précises ni chiffrement." }
references:
  - title: What is AWS Lake Formation?
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html
  - title: Using server-side encryption with AWS KMS keys (SSE-KMS)
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingKMSEncryption.html
