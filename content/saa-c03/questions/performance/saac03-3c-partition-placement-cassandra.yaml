id: saac03-3c-partition-placement-cassandra
objective: "3.4.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a 30-node Apache Cassandra cluster on Amazon EC2 instances in one Availability Zone to keep inter-node latency low. The cluster will grow to 60 nodes. The company wants to reduce the risk that a single hardware failure affects several replicas of the same data. Cassandra is rack-aware and must know which nodes share the same underlying hardware so that it can place replicas accordingly.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Apache Cassandra de 30 nœuds sur des instances Amazon EC2 dans une seule zone de disponibilité afin de limiter la latence entre les nœuds. Le cluster passera à 60 nœuds. L'entreprise veut réduire le risque qu'une seule panne matérielle touche plusieurs réplicas des mêmes données. Cassandra tient compte des racks et doit savoir quels nœuds partagent le même matériel sous-jacent afin de placer les réplicas en conséquence.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Launch the nodes in a partition placement group and map each partition to a Cassandra rack.", fr: "Lancer les nœuds dans un groupe de placement de partition et associer chaque partition à un rack Cassandra." } }
    - { id: b, text: { en: "Launch the nodes in a spread placement group so that each node runs on distinct hardware.", fr: "Lancer les nœuds dans un groupe de placement de répartition afin que chaque nœud s'exécute sur un matériel distinct." } }
    - { id: c, text: { en: "Launch the nodes in a cluster placement group and enable Cassandra replication across the nodes.", fr: "Lancer les nœuds dans un groupe de placement de cluster et activer la réplication Cassandra entre les nœuds." } }
    - { id: d, text: { en: "Launch the nodes as Dedicated Instances so that they run on hardware dedicated to the company's account.", fr: "Lancer les nœuds en tant qu'instances dédiées afin qu'ils s'exécutent sur un matériel réservé au compte de l'entreprise." } }
answer: { optionId: a }
explanation:
  correct:
    en: In a partition placement group, each partition has its own racks, network and power, so a hardware failure affects only one partition. The group supports up to seven partitions per Availability Zone with no instance limit other than account quotas, and it exposes the partition of each instance so that topology-aware applications such as Cassandra can place replicas in different partitions.
    fr: "Dans un groupe de placement de partition, chaque partition dispose de ses propres racks, réseau et alimentation : une panne matérielle n'affecte qu'une partition. Le groupe accepte jusqu'à sept partitions par zone de disponibilité, sans limite d'instances autre que les quotas du compte, et expose la partition de chaque instance afin que les applications sensibles à la topologie comme Cassandra placent les réplicas dans des partitions différentes."
  options:
    b: { en: "A spread placement group allows at most seven running instances per Availability Zone, far fewer than the 60 nodes required in one zone.", fr: "Un groupe de placement de répartition autorise au plus sept instances en cours d'exécution par zone de disponibilité, bien moins que les 60 nœuds requis dans une zone." }
    c: { en: "A cluster placement group packs the nodes close together, which increases the chance that one hardware failure hits several replicas.", fr: "Un groupe de placement de cluster rapproche les nœuds, ce qui augmente le risque qu'une seule panne matérielle touche plusieurs réplicas." }
    d: { en: "Dedicated Instances isolate the account's instances from other customers, but several nodes of the account can still share the same hardware.", fr: "Les instances dédiées isolent les instances du compte de celles des autres clients, mais plusieurs nœuds du compte peuvent toujours partager le même matériel." }
references:
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
