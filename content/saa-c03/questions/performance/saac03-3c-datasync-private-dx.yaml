id: saac03-3c-datasync-private-dx
objective: "3.5.10"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company copies about 30 TB of new files every week from an on-premises NFS file server to Amazon S3 with AWS DataSync. The data center is connected to a VPC through an AWS Direct Connect private virtual interface. A new security policy requires that the transfer traffic between the DataSync agent and AWS never traverse the public internet.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise copie chaque semaine environ 30 To de nouveaux fichiers d'un serveur de fichiers NFS sur site vers Amazon S3 avec AWS DataSync. Le centre de données est relié à un VPC par une interface virtuelle privée AWS Direct Connect. Une nouvelle politique de sécurité exige que le trafic de transfert entre l'agent DataSync et AWS ne traverse jamais l'Internet public.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create an interface VPC endpoint for DataSync in the VPC that the Direct Connect connection reaches.", fr: "Créer un point de terminaison de VPC d'interface pour DataSync dans le VPC que joint la connexion Direct Connect." } }
    - { id: b, text: { en: "Keep the agent on the public service endpoint and enable S3 Transfer Acceleration on the destination bucket.", fr: "Conserver l'agent sur le point de terminaison de service public et activer S3 Transfer Acceleration sur le compartiment de destination." } }
    - { id: c, text: { en: "Keep the agent on the public service endpoint and switch it to the FIPS service endpoint.", fr: "Conserver l'agent sur le point de terminaison de service public et le passer sur le point de terminaison de service FIPS." } }
    - { id: d, text: { en: "Deploy and activate a DataSync agent that uses the VPC service endpoint, and run the task with that agent.", fr: "Déployer et activer un agent DataSync qui utilise le point de terminaison de service VPC, et exécuter la tâche avec cet agent." } }
    - { id: e, text: { en: "Replace DataSync with Amazon S3 File Gateway and copy the files to its NFS share.", fr: "Remplacer DataSync par Amazon S3 File Gateway et copier les fichiers sur son partage NFS." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: With a VPC service endpoint, the agent communicates with DataSync through an AWS PrivateLink interface endpoint in the VPC, so the traffic flows over Direct Connect into the VPC instead of the public internet. An agent uses only one endpoint type, so the company must deploy and activate an agent for the VPC endpoint and use it for the task.
    fr: "Avec un point de terminaison de service VPC, l'agent communique avec DataSync via un point de terminaison d'interface AWS PrivateLink dans le VPC : le trafic passe par Direct Connect jusqu'au VPC au lieu de l'Internet public. Un agent n'utilise qu'un seul type de point de terminaison : l'entreprise doit donc déployer et activer un agent pour le point de terminaison VPC et l'utiliser pour la tâche."
  options:
    b: { en: "The public service endpoint sends data over the public internet, and Transfer Acceleration also uses the internet to reach edge locations.", fr: "Le point de terminaison de service public envoie les données sur l'Internet public, et Transfer Acceleration utilise aussi Internet pour joindre les emplacements périphériques." }
    c: { en: "A FIPS service endpoint uses FIPS-compliant processes but still sends the data over the public internet.", fr: "Un point de terminaison de service FIPS utilise des processus conformes FIPS, mais envoie toujours les données sur l'Internet public." }
    e: { en: "Changing the transfer service does not by itself keep traffic off the internet, and it gives up the scheduled DataSync task.", fr: "Changer de service de transfert ne garde pas à lui seul le trafic hors d'Internet, et abandonne la tâche DataSync planifiée." }
references:
  - title: Choosing a service endpoint for your AWS DataSync agent
    url: https://docs.aws.amazon.com/datasync/latest/userguide/choose-service-endpoint.html
