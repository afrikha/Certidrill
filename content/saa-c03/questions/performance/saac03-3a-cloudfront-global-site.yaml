id: saac03-3a-cloudfront-global-site
objective: "3.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts a website on Amazon EC2 instances behind an Application Load Balancer in the us-west-2 Region. The site serves images, CSS and JavaScript files as well as dynamic pages. Users in Europe and Asia report slow page loads. The company wants static files to be cached close to users and wants to reduce latency for all users without deploying the application to other Regions.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge un site web sur des instances Amazon EC2 derrière un Application Load Balancer dans la Région us-west-2. Le site sert des images, des fichiers CSS et JavaScript ainsi que des pages dynamiques. Les utilisateurs d'Europe et d'Asie signalent des chargements de pages lents. L'entreprise souhaite que les fichiers statiques soient mis en cache près des utilisateurs et veut réduire la latence pour tous les utilisateurs sans déployer l'application dans d'autres Régions.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon CloudFront distribution with the Application Load Balancer as the origin.", fr: "Créer une distribution Amazon CloudFront avec l'Application Load Balancer comme origine." }
    - id: b
      text: { en: "Create an AWS Global Accelerator standard accelerator with the Application Load Balancer as the endpoint.", fr: "Créer un accélérateur standard AWS Global Accelerator avec l'Application Load Balancer comme point de terminaison." }
    - id: c
      text: { en: "Create an Amazon Route 53 latency-based routing record that points to the Application Load Balancer.", fr: "Créer un enregistrement Amazon Route 53 avec routage basé sur la latence qui pointe vers l'Application Load Balancer." }
    - id: d
      text: { en: "Move the instances to a larger instance type and add more instances to the target group.", fr: "Passer les instances à un type d'instance plus grand et ajouter des instances au groupe cible." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      CloudFront caches copies of files in edge locations worldwide and routes each request over the AWS backbone to the edge location with the lowest latency. It accelerates both static and dynamic content, and an Application Load Balancer can be its origin.
    fr: |-
      CloudFront met en cache des copies des fichiers dans des emplacements périphériques du monde entier et achemine chaque requête via le réseau principal AWS vers l'emplacement périphérique offrant la latence la plus faible. Il accélère le contenu statique comme dynamique, et un Application Load Balancer peut être son origine.
  options:
    b:
      en: |-
        Global Accelerator improves the network path to the Region, but it proxies packets and does not cache the static files close to users.
      fr: |-
        Global Accelerator améliore le chemin réseau vers la Région, mais il relaie les paquets et ne met pas en cache les fichiers statiques près des utilisateurs.
    c:
      en: |-
        Latency-based routing chooses among endpoints in several Regions; with a single Region it changes nothing and caches nothing.
      fr: |-
        Le routage basé sur la latence choisit parmi des points de terminaison situés dans plusieurs Régions ; avec une seule Région, il ne change rien et ne met rien en cache.
    d:
      en: |-
        More or larger instances add server capacity, but they do not reduce the network distance between distant users and us-west-2.
      fr: |-
        Des instances plus nombreuses ou plus grandes ajoutent de la capacité serveur, mais ne réduisent pas la distance réseau entre les utilisateurs éloignés et us-west-2.
references:
  - title: What is Amazon CloudFront? - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
