id: saac03-3c-datasync-bandwidth-schedule
objective: "3.5.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an AWS DataSync task to copy new files from an on-premises NFS server to Amazon S3. The task currently runs on demand during business hours and saturates the company's internet link, which slows down users. The company wants the task to run automatically every night and never use more than 50 MiB/s of bandwidth.

    Which combination of configuration changes will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise utilise une tâche AWS DataSync pour copier les nouveaux fichiers d'un serveur NFS sur site vers Amazon S3. La tâche s'exécute actuellement à la demande pendant les heures de bureau et sature le lien Internet de l'entreprise, ce qui ralentit les utilisateurs. L'entreprise veut que la tâche s'exécute automatiquement chaque nuit et n'utilise jamais plus de 50 Mio/s de bande passante.

    Quelle combinaison de modifications de configuration répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a second DataSync agent to the task to spread the transfer across agents.", fr: "Ajouter un deuxième agent DataSync à la tâche pour répartir le transfert entre les agents." } }
    - { id: b, text: { en: "Set a bandwidth limit of 50 MiB/s on the task.", fr: "Définir une limite de bande passante de 50 Mio/s sur la tâche." } }
    - { id: c, text: { en: "Configure a daily task schedule that starts the task at night.", fr: "Configurer une planification quotidienne de la tâche qui la démarre la nuit." } }
    - { id: d, text: { en: "Switch the agent to the FIPS service endpoint.", fr: "Passer l'agent sur le point de terminaison de service FIPS." } }
    - { id: e, text: { en: "Configure the task to verify all data in the destination after each transfer.", fr: "Configurer la tâche pour vérifier toutes les données de la destination après chaque transfert." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: A DataSync task accepts a bandwidth limit in MiB/s (BytesPerSecond in the API) that applies to each execution and can be changed while a task runs. A task schedule (hourly, daily, weekly or a cron or rate expression, at least 1 hour apart) starts the transfers automatically at night.
    fr: "Une tâche DataSync accepte une limite de bande passante en Mio/s (BytesPerSecond dans l'API) qui s'applique à chaque exécution et peut être modifiée pendant l'exécution. Une planification de tâche (horaire, quotidienne, hebdomadaire, ou expression cron ou rate, à au moins 1 heure d'intervalle) démarre automatiquement les transferts la nuit."
  options:
    a: { en: "More agents increase parallelism and bandwidth use; they do not cap it or schedule the task.", fr: "Plus d'agents augmentent le parallélisme et la bande passante consommée ; ils ne la plafonnent pas et ne planifient pas la tâche." }
    d: { en: "The FIPS endpoint changes the cryptographic processes used, not bandwidth or timing.", fr: "Le point de terminaison FIPS change les processus cryptographiques utilisés, pas la bande passante ni l'horaire." }
    e: { en: "Full verification adds work after each transfer; it neither limits bandwidth nor moves the task to the night.", fr: "Une vérification complète ajoute du travail après chaque transfert ; elle ne limite pas la bande passante et ne déplace pas la tâche la nuit." }
references:
  - title: Setting bandwidth limits for your AWS DataSync task
    url: https://docs.aws.amazon.com/datasync/latest/userguide/configure-bandwidth.html
  - title: Scheduling when your AWS DataSync task runs
    url: https://docs.aws.amazon.com/datasync/latest/userguide/task-scheduling.html
