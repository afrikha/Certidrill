id: saac03-3c-nlb-udp-static-ip
objective: "3.4.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a telemetry service on Amazon EC2 instances in an Auto Scaling group across three Availability Zones. Millions of field devices send data to the service over UDP. The device firmware can be configured only with fixed IP addresses, and the service must handle millions of requests per second with very low latency.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un service de télémétrie sur des instances Amazon EC2 dans un Auto Scaling group réparti sur trois zones de disponibilité. Des millions d'appareils de terrain envoient des données au service en UDP. Le micrologiciel des appareils ne peut être configuré qu'avec des adresses IP fixes, et le service doit traiter des millions de requêtes par seconde avec une latence très faible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an Application Load Balancer with an HTTPS listener and give the devices its DNS name.", fr: "Déployer un Application Load Balancer avec un écouteur HTTPS et fournir son nom DNS aux appareils." } }
    - { id: b, text: { en: "Use Amazon Route 53 multivalue answer routing with health checks that returns the public IP addresses of the instances.", fr: "Utiliser le routage à réponses multivaleurs d'Amazon Route 53 avec des vérifications de l'état qui renvoie les adresses IP publiques des instances." } }
    - { id: c, text: { en: "Deploy a Network Load Balancer with a UDP listener and associate one Elastic IP address with each of its subnets.", fr: "Déployer un Network Load Balancer avec un écouteur UDP et associer une adresse IP Elastic à chacun de ses sous-réseaux." } }
    - { id: d, text: { en: "Deploy a Gateway Load Balancer and register the instances in its target group.", fr: "Déployer un Gateway Load Balancer et enregistrer les instances dans son groupe cible." } }
answer: { optionId: c }
explanation:
  correct:
    en: A Network Load Balancer operates at layer 4, supports UDP listeners and target groups, and scales to millions of requests per second with very low latency. Each load balancer node has a static IP address per Availability Zone, and an internet-facing NLB can use one Elastic IP address per subnet, which the devices can be configured with.
    fr: "Un Network Load Balancer fonctionne en couche 4, prend en charge les écouteurs et groupes cibles UDP et traite des millions de requêtes par seconde avec une latence très faible. Chaque nœud de l'équilibreur de charge a une adresse IP statique par zone de disponibilité, et un NLB accessible depuis Internet peut utiliser une adresse IP Elastic par sous-réseau, que les appareils peuvent recevoir dans leur configuration."
  options:
    a: { en: "An Application Load Balancer handles HTTP and HTTPS only and has no fixed IP addresses.", fr: "Un Application Load Balancer ne traite que HTTP et HTTPS et n'a pas d'adresses IP fixes." }
    b: { en: "Instances in an Auto Scaling group are replaced and get new public IP addresses, and the firmware cannot use DNS names.", fr: "Les instances d'un Auto Scaling group sont remplacées et reçoivent de nouvelles adresses IP publiques, et le micrologiciel ne peut pas utiliser de noms DNS." }
    d: { en: "A Gateway Load Balancer distributes traffic to virtual appliances such as firewalls using GENEVE; it is not a front end for client traffic.", fr: "Un Gateway Load Balancer distribue le trafic vers des appliances virtuelles comme des pare-feu via GENEVE ; ce n'est pas un point d'entrée pour le trafic des clients." }
references:
  - title: What is a Network Load Balancer?
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html
