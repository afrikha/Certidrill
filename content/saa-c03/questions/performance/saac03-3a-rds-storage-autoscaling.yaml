id: saac03-3a-rds-storage-autoscaling
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL DB instance whose storage use grows unpredictably. Last quarter the instance ran out of storage and the application failed. The company wants storage to increase automatically before it runs out, without downtime and with the LEAST operational overhead. Storage must never grow beyond 2,000 GiB, and the company does not want to pay for storage before it is needed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite une instance de base de données Amazon RDS for PostgreSQL dont l'utilisation du stockage croît de manière imprévisible. Le trimestre dernier, l'instance a manqué d'espace de stockage et l'application est tombée en panne. L'entreprise souhaite que le stockage augmente automatiquement avant d'être saturé, sans interruption de service et avec le MOINS de charge opérationnelle. Le stockage ne doit jamais dépasser 2 000 Gio, et l'entreprise ne veut pas payer de stockage avant d'en avoir besoin.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable RDS storage autoscaling on the DB instance with a maximum storage threshold of 2,000 GiB.", fr: "Activer la mise à l'échelle automatique du stockage RDS sur l'instance de base de données avec un seuil de stockage maximal de 2 000 Gio." }
    - id: b
      text: { en: "Modify the DB instance now to allocate 2,000 GiB of storage.", fr: "Modifier dès maintenant l'instance de base de données pour allouer 2 000 Gio de stockage." }
    - id: c
      text: { en: "Create a CloudWatch alarm on FreeStorageSpace that invokes a Lambda function to increase the allocated storage.", fr: "Créer une alarme CloudWatch sur FreeStorageSpace qui appelle une fonction Lambda pour augmenter le stockage alloué." }
    - id: d
      text: { en: "Create a read replica with more storage each time space runs low and promote it to replace the primary.", fr: "Créer un réplica en lecture doté de plus de stockage chaque fois que l'espace se raréfie, puis le promouvoir pour remplacer l'instance principale." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      RDS storage autoscaling increases allocated storage automatically when free space falls to 10% or less for at least five minutes, up to the maximum storage threshold you set. Enabling it requires no reboot or downtime, and storage is added only when it is needed.
    fr: |-
      La mise à l'échelle automatique du stockage RDS augmente automatiquement le stockage alloué lorsque l'espace libre tombe à 10 % ou moins pendant au moins cinq minutes, jusqu'au seuil de stockage maximal défini. Son activation n'exige ni redémarrage ni interruption, et le stockage n'est ajouté que lorsqu'il est nécessaire.
  options:
    b:
      en: |-
        Allocating 2,000 GiB now avoids running out, but the company pays for storage long before it is needed.
      fr: |-
        Allouer 2 000 Gio dès maintenant évite la saturation, mais l'entreprise paie un stockage bien avant d'en avoir besoin.
    c:
      en: |-
        A custom alarm and function can work, but the company must build, test and maintain code that RDS storage autoscaling already provides.
      fr: |-
        Une alarme et une fonction personnalisées peuvent fonctionner, mais l'entreprise doit créer, tester et maintenir du code que la mise à l'échelle automatique du stockage RDS fournit déjà.
    d:
      en: |-
        Repeatedly creating and promoting replicas is manual, causes a brief interruption at each promotion and changes the endpoint.
      fr: |-
        Créer et promouvoir régulièrement des réplicas est manuel, provoque une brève interruption à chaque promotion et change le point de terminaison.
references:
  - title: Managing capacity automatically with Amazon RDS storage autoscaling - Amazon Relational Database Service
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html
