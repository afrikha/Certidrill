id: saac03-3b-read-replica-backups
objective: "3.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company wants to create a read replica of an Amazon RDS for PostgreSQL DB instance to offload reporting queries. The read replica cannot be created. The source DB instance is a Single-AZ deployment on gp3 storage, and its backup retention period is set to 0 days.

    What should the company do to create the read replica?
  fr: |
    Une entreprise veut créer un réplica en lecture d'une instance de base de données Amazon RDS for PostgreSQL pour décharger des requêtes de reporting. Le réplica en lecture ne peut pas être créé. L'instance source est un déploiement mono-AZ sur un stockage gp3, et sa période de rétention des sauvegardes est définie à 0 jour.

    Que doit faire l'entreprise pour créer le réplica en lecture ?
body:
  options:
    - id: a
      text: { en: "Convert the source DB instance to a Multi-AZ DB instance deployment.", fr: "Convertir l'instance source en déploiement d'instance de base de données Multi-AZ." }
    - id: b
      text: { en: "Change the storage of the source DB instance to Provisioned IOPS SSD.", fr: "Changer le stockage de l'instance source en SSD IOPS provisionnées." }
    - id: c
      text: { en: "Turn on automated backups by setting a backup retention period greater than 0 days.", fr: "Activer les sauvegardes automatisées en définissant une période de rétention des sauvegardes supérieure à 0 jour." }
    - id: d
      text: { en: "Take a manual DB snapshot of the source and share it with the account.", fr: "Créer un instantané de base de données manuel de la source et le partager avec le compte." }
answer: { optionId: c }
explanation:
  correct:
    en: Automatic backups must be enabled on the source DB instance before RDS can create a read replica, which means a backup retention period other than 0. RDS creates the replica from a snapshot of the source and then replicates changes asynchronously.
    fr: Les sauvegardes automatisées doivent être activées sur l'instance source avant que RDS puisse créer un réplica en lecture, c'est-à-dire avec une période de rétention des sauvegardes différente de 0. RDS crée le réplica à partir d'un instantané de la source, puis réplique les modifications de façon asynchrone.
  options:
    a:
      en: Multi-AZ is not a prerequisite for read replicas; a Single-AZ source can have read replicas once automated backups are on.
      fr: Multi-AZ n'est pas un prérequis des réplicas en lecture ; une source mono-AZ peut avoir des réplicas en lecture dès que les sauvegardes automatisées sont activées.
    b:
      en: The storage type of the source does not prevent replica creation; gp3 sources support read replicas.
      fr: Le type de stockage de la source n'empêche pas la création d'un réplica ; les sources gp3 prennent en charge les réplicas en lecture.
    d:
      en: A manual snapshot can be restored to a separate DB instance, but that instance does not replicate changes from the source.
      fr: Un instantané manuel peut être restauré dans une instance distincte, mais cette instance ne réplique pas les modifications de la source.
references:
  - title: Creating a read replica
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.Create.html
