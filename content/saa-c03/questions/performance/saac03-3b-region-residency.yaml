id: saac03-3b-region-residency
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A healthcare company is moving its patient portal to AWS. A regulation requires that patient data is stored only in Germany. Most users are in Germany, and the database must stay available if a single data center fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé migre son portail patients vers AWS. Une réglementation impose que les données des patients soient stockées uniquement en Allemagne. La plupart des utilisateurs se trouvent en Allemagne, et la base de données doit rester disponible en cas de panne d'un seul centre de données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy the application and an Amazon RDS Multi-AZ database in the Europe (Frankfurt) Region.", fr: "Déployer l'application et une base de données Amazon RDS Multi-AZ dans la Région Europe (Francfort)." }
    - id: b
      text: { en: "Deploy the application and a Single-AZ RDS database in the Europe (Frankfurt) Region, and copy daily snapshots to the Europe (Ireland) Region.", fr: "Déployer l'application et une base de données RDS mono-AZ dans la Région Europe (Francfort), et copier des instantanés quotidiens vers la Région Europe (Irlande)." }
    - id: c
      text: { en: "Deploy the application and an RDS Multi-AZ database in the Europe (Ireland) Region, and serve users through Amazon CloudFront edge locations in Germany.", fr: "Déployer l'application et une base de données RDS Multi-AZ dans la Région Europe (Irlande), et servir les utilisateurs via des emplacements périphériques Amazon CloudFront en Allemagne." }
    - id: d
      text: { en: "Deploy the application and an RDS database in the Europe (Frankfurt) Region, with a cross-Region read replica in the Europe (Paris) Region for failover.", fr: "Déployer l'application et une base de données RDS dans la Région Europe (Francfort), avec un réplica en lecture entre Régions dans la Région Europe (Paris) pour le basculement." }
answer: { optionId: a }
explanation:
  correct:
    en: A Region is a separate geographic area, and choosing the Region in Germany keeps the data there and close to most users. Each Region contains several isolated Availability Zones, and a Multi-AZ deployment keeps a synchronous standby in another Availability Zone, so the database survives the failure of one data center.
    fr: Une Région est une zone géographique distincte ; choisir la Région située en Allemagne y conserve les données, à proximité de la plupart des utilisateurs. Chaque Région contient plusieurs zones de disponibilité isolées, et un déploiement Multi-AZ maintient une instance de secours synchrone dans une autre zone de disponibilité ; la base de données résiste donc à la panne d'un centre de données.
  options:
    b:
      en: Snapshot copies to Ireland store patient data outside Germany, and a Single-AZ database is not available during a data center failure.
      fr: Les copies d'instantanés vers l'Irlande stockent des données de patients hors d'Allemagne, et une base de données mono-AZ n'est pas disponible pendant une panne de centre de données.
    c:
      en: The data would be stored in Ireland, which violates the residency requirement; edge locations cache content but do not change where the database lives.
      fr: Les données seraient stockées en Irlande, ce qui enfreint l'exigence de résidence ; les emplacements périphériques mettent du contenu en cache mais ne changent pas l'emplacement de la base de données.
    d:
      en: A replica in the Paris Region copies patient data to France, which violates the residency requirement.
      fr: Un réplica dans la Région Paris copie des données de patients en France, ce qui enfreint l'exigence de résidence.
references:
  - title: AWS Regions
    url: https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
