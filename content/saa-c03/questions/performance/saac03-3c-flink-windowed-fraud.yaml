id: saac03-3c-flink-windowed-fraud
objective: "3.5.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A payment company streams card transactions into an Amazon Kinesis data stream. The company must detect suspicious patterns by computing stateful aggregations over 5-minute sliding windows per card, and must write alerts to another stream within seconds. The company does not want to provision or manage servers or clusters.

    Which solution will meet these requirements?
  fr: |
    Une société de paiement diffuse les transactions par carte dans un flux de données Amazon Kinesis. L'entreprise doit détecter des schémas suspects en calculant des agrégations avec état sur des fenêtres glissantes de 5 minutes par carte, et doit écrire les alertes dans un autre flux en quelques secondes. L'entreprise ne veut ni provisionner ni gérer de serveurs ou de clusters.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deliver the transactions to Amazon S3 with Amazon Data Firehose and run Amazon Athena queries every 5 minutes.", fr: "Livrer les transactions dans Amazon S3 avec Amazon Data Firehose et exécuter des requêtes Amazon Athena toutes les 5 minutes." } }
    - { id: b, text: { en: "Run a Spark Streaming application on a long-running Amazon EMR cluster on EC2 that reads the stream.", fr: "Exécuter une application Spark Streaming sur un cluster Amazon EMR permanent sur EC2 qui lit le flux." } }
    - { id: c, text: { en: "Process the stream with an Amazon Managed Service for Apache Flink application that writes alerts to the output stream.", fr: "Traiter le flux avec une application Amazon Managed Service for Apache Flink qui écrit les alertes dans le flux de sortie." } }
    - { id: d, text: { en: "Load the transactions into Amazon Redshift every 5 minutes and run a stored procedure that writes the alerts.", fr: "Charger les transactions dans Amazon Redshift toutes les 5 minutes et exécuter une procédure stockée qui écrit les alertes." } }
answer: { optionId: c }
explanation:
  correct:
    en: Amazon Managed Service for Apache Flink runs Apache Flink applications that process streaming data continuously, with windowed and stateful operations, in Java, Scala, Python or SQL. The service provisions compute, scales automatically and manages checkpoints, so there are no servers or clusters to manage.
    fr: "Amazon Managed Service for Apache Flink exécute des applications Apache Flink qui traitent en continu des données en streaming, avec des opérations fenêtrées et avec état, en Java, Scala, Python ou SQL. Le service provisionne le calcul, s'adapte automatiquement et gère les points de contrôle : il n'y a ni serveur ni cluster à gérer."
  options:
    a: { en: "Buffered delivery plus scheduled queries adds minutes of delay and cannot keep per-card state across windows.", fr: "Une livraison mise en mémoire tampon suivie de requêtes planifiées ajoute des minutes de délai et ne peut pas conserver d'état par carte entre les fenêtres." }
    b: { en: "Spark Streaming could do the processing, but a long-running EMR cluster is infrastructure that the company must size and manage.", fr: "Spark Streaming pourrait effectuer le traitement, mais un cluster EMR permanent est une infrastructure que l'entreprise doit dimensionner et gérer." }
    d: { en: "Micro-batch loads into a warehouse do not deliver alerts within seconds, and a provisioned warehouse must be managed.", fr: "Des chargements par micro-lots dans un entrepôt ne livrent pas d'alertes en quelques secondes, et un entrepôt provisionné doit être géré." }
references:
  - title: What is Amazon Managed Service for Apache Flink?
    url: https://docs.aws.amazon.com/managed-flink/latest/java/what-is.html
