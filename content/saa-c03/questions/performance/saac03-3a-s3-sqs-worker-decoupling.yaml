id: saac03-3a-s3-sqs-worker-decoupling
objective: "3.2.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A photo-sharing application runs on Amazon EC2 instances that receive uploads and resize each image before responding to the user. During traffic spikes, the resizing work makes uploads time out. The company is changing the application to upload images directly to an Amazon S3 bucket and wants the image processing tier to scale independently of the upload tier. No processing job can be lost if the processing tier is unavailable for a while.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application de partage de photos s'exécute sur des instances Amazon EC2 qui reçoivent les fichiers chargés et redimensionnent chaque image avant de répondre à l'utilisateur. Lors des pics de trafic, le redimensionnement fait expirer les chargements. L'entreprise modifie l'application pour charger les images directement dans un compartiment Amazon S3 et souhaite que le niveau de traitement des images soit mis à l'échelle indépendamment du niveau de chargement. Aucune tâche de traitement ne doit être perdue si le niveau de traitement est indisponible pendant un certain temps.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Configure S3 event notifications for object creation that send messages directly to an Amazon SQS FIFO queue.", fr: "Configurer des notifications d'événements S3 pour la création d'objets qui envoient des messages directement à une file d'attente Amazon SQS FIFO." }
    - id: b
      text: { en: "Configure S3 event notifications for object creation that send messages to an Amazon SQS standard queue.", fr: "Configurer des notifications d'événements S3 pour la création d'objets qui envoient des messages à une file d'attente Amazon SQS standard." }
    - id: c
      text: { en: "Run the processing workers in an Auto Scaling group that polls the queue and scales on the queue backlog.", fr: "Exécuter les instances de traitement dans un groupe Auto Scaling qui interroge la file et se met à l'échelle selon l'arriéré de la file." }
    - id: d
      text: { en: "Have the upload tier call the processing tier synchronously through an internal Application Load Balancer.", fr: "Faire appeler le niveau de traitement de manière synchrone par le niveau de chargement via un Application Load Balancer interne." }
    - id: e
      text: { en: "Move the upload tier to a larger instance type so that it resizes images faster.", fr: "Passer le niveau de chargement à un type d'instance plus grand afin qu'il redimensionne les images plus vite." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      S3 event notifications can send object-created events to an SQS queue, which stores each job durably until a worker processes it, even when the workers are down. Workers in an Auto Scaling group poll the queue and scale on the backlog, independently of the upload tier.
    fr: |-
      Les notifications d'événements S3 peuvent envoyer les événements de création d'objets à une file d'attente SQS, qui stocke chaque tâche de façon durable jusqu'à son traitement, même lorsque les instances de traitement sont arrêtées. Les instances d'un groupe Auto Scaling interrogent la file et se mettent à l'échelle selon l'arriéré, indépendamment du niveau de chargement.
  options:
    a:
      en: |-
        SQS FIFO queues are not supported as S3 event notification destinations; S3 would need EventBridge to reach a FIFO queue, and ordering is not required here.
      fr: |-
        Les files d'attente SQS FIFO ne sont pas prises en charge comme destinations des notifications d'événements S3 ; il faudrait passer par EventBridge, et l'ordre n'est pas exigé ici.
    d:
      en: |-
        A synchronous call keeps the tiers coupled: if the processing tier is slow or down, uploads fail or jobs are lost.
      fr: |-
        Un appel synchrone maintient le couplage des niveaux : si le niveau de traitement est lent ou arrêté, les chargements échouent ou des tâches sont perdues.
    e:
      en: |-
        Bigger instances only delay the problem; processing stays inside the upload tier and cannot scale on its own.
      fr: |-
        Des instances plus grandes ne font que repousser le problème ; le traitement reste dans le niveau de chargement et ne peut pas être mis à l'échelle séparément.
references:
  - title: Amazon S3 Event Notifications - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
  - title: Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
