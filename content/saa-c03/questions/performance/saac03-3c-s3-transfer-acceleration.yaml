id: saac03-3c-s3-transfer-acceleration
objective: "3.5.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's customers in Asia, Europe and South America upload files of 1 GB to 5 GB to a central Amazon S3 bucket in us-east-1. The customers report slow uploads over long distances. The company wants to speed up the uploads with the fewest changes to its upload client, which can change only the endpoint it uses.

    Which solution will meet these requirements?
  fr: |
    Les clients d'une entreprise en Asie, en Europe et en Amérique du Sud chargent des fichiers de 1 Go à 5 Go dans un compartiment Amazon S3 central situé dans us-east-1. Les clients signalent des chargements lents sur de longues distances. L'entreprise souhaite accélérer les chargements avec le moins de modifications possible de son client de chargement, qui ne peut changer que le point de terminaison utilisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a bucket in each continent's Region, have customers upload to the nearest one, and replicate the objects to us-east-1.", fr: "Créer un compartiment dans une Région de chaque continent, faire charger les clients vers le plus proche et répliquer les objets vers us-east-1." } }
    - { id: b, text: { en: "Create an AWS Global Accelerator standard accelerator with the S3 bucket as its endpoint.", fr: "Créer un accélérateur standard AWS Global Accelerator avec le compartiment S3 comme point de terminaison." } }
    - { id: c, text: { en: "Move the bucket objects to the S3 Express One Zone storage class to increase request performance.", fr: "Déplacer les objets du compartiment vers la classe de stockage S3 Express One Zone pour augmenter les performances des requêtes." } }
    - { id: d, text: { en: "Enable S3 Transfer Acceleration on the bucket and point the client to the bucket's accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et diriger le client vers le point de terminaison accéléré du compartiment." } }
answer: { optionId: d }
explanation:
  correct:
    en: S3 Transfer Acceleration routes uploads through the nearest Amazon CloudFront edge location and then over an optimized AWS network path to the bucket. It fits customers around the world who upload to a centralized bucket, and the client only switches to the bucket-name.s3-accelerate.amazonaws.com endpoint.
    fr: "S3 Transfer Acceleration fait passer les chargements par l'emplacement périphérique Amazon CloudFront le plus proche, puis par un chemin réseau AWS optimisé jusqu'au compartiment. Il convient à des clients du monde entier qui chargent vers un compartiment centralisé, et le client passe simplement au point de terminaison bucket-name.s3-accelerate.amazonaws.com."
  options:
    a: { en: "Regional buckets and replication work but require routing logic in the client and more buckets and rules to manage.", fr: "Des compartiments régionaux et la réplication fonctionnent, mais exigent une logique de routage dans le client et davantage de compartiments et de règles à gérer." }
    b: { en: "Global Accelerator endpoints are load balancers, EC2 instances or Elastic IP addresses; an S3 bucket is not a supported endpoint.", fr: "Les points de terminaison de Global Accelerator sont des équilibreurs de charge, des instances EC2 ou des adresses IP Elastic ; un compartiment S3 n'est pas un point de terminaison pris en charge." }
    c: { en: "A storage class does not shorten the long network path between distant customers and us-east-1.", fr: "Une classe de stockage ne raccourcit pas le long chemin réseau entre des clients éloignés et us-east-1." }
references:
  - title: Configuring fast, secure file transfers using Amazon S3 Transfer Acceleration
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html
