id: saac03-3a-asg-predictive-dynamic
objective: "3.2.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An e-commerce company runs its web tier on Amazon EC2 instances in an Auto Scaling group. Traffic follows a daily pattern with a large evening peak, but the timing and size of the peak shift from week to week. New instances need about 10 minutes to initialize, so capacity added after the load arrives is too late. Unplanned flash sales can also cause sudden spikes. The company has several months of traffic history.

    Which combination of scaling policies will meet these requirements with the LEAST operational overhead? (Choose two.)
  fr: |
    Une entreprise de commerce électronique exécute son niveau web sur des instances Amazon EC2 dans un groupe Auto Scaling. Le trafic suit un schéma quotidien avec une forte pointe en soirée, mais l'heure et l'ampleur de la pointe varient d'une semaine à l'autre. Les nouvelles instances ont besoin d'environ 10 minutes pour s'initialiser : une capacité ajoutée après l'arrivée de la charge arrive trop tard. Des ventes flash imprévues peuvent aussi provoquer des pics soudains. L'entreprise dispose de plusieurs mois d'historique de trafic.

    Quelle combinaison de stratégies de mise à l'échelle répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text: { en: "A predictive scaling policy in forecast and scale mode", fr: "Une stratégie de mise à l'échelle prédictive en mode forecast and scale" }
    - id: b
      text: { en: "A predictive scaling policy in forecast only mode", fr: "Une stratégie de mise à l'échelle prédictive en mode forecast only" }
    - id: c
      text: { en: "A scheduled action for each evening peak, updated every week", fr: "Une action planifiée pour chaque pointe du soir, mise à jour chaque semaine" }
    - id: d
      text: { en: "A target tracking scaling policy on average CPU utilization", fr: "Une stratégie de mise à l'échelle de suivi de la cible sur l'utilisation moyenne du processeur" }
    - id: e
      text: { en: "A longer health check grace period for the Auto Scaling group", fr: "Une période de grâce de vérification de l'état plus longue pour le groupe Auto Scaling" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      Predictive scaling learns daily and weekly patterns from historical data and launches capacity before the forecast load, which suits cyclical traffic and long initialization times; it must be in forecast and scale mode to act. AWS recommends combining it with dynamic scaling such as target tracking, which scales out when traffic is higher than forecast, as during flash sales.
    fr: |-
      La mise à l'échelle prédictive apprend les schémas quotidiens et hebdomadaires à partir de l'historique et lance de la capacité avant la charge prévue, ce qui convient au trafic cyclique et aux initialisations longues ; elle doit être en mode forecast and scale pour agir. AWS recommande de la combiner à une mise à l'échelle dynamique comme le suivi de la cible, qui ajoute de la capacité quand le trafic dépasse la prévision, comme lors des ventes flash.
  options:
    b:
      en: |-
        In forecast only mode, predictive scaling generates forecasts but does not scale the group.
      fr: |-
        En mode forecast only, la mise à l'échelle prédictive génère des prévisions mais ne met pas le groupe à l'échelle.
    c:
      en: |-
        Because the peak shifts every week, the scheduled actions would need constant manual updates, which adds operational overhead that predictive scaling avoids.
      fr: |-
        Comme la pointe varie chaque semaine, les actions planifiées exigeraient des mises à jour manuelles permanentes, une charge opérationnelle que la mise à l'échelle prédictive évite.
    e:
      en: |-
        The grace period delays health checks on new instances; it does not add capacity earlier or react to spikes.
      fr: |-
        La période de grâce retarde les vérifications de l'état des nouvelles instances ; elle n'ajoute pas de capacité plus tôt et ne réagit pas aux pics.
references:
  - title: How predictive scaling works - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/predictive-scaling-policy-overview.html
  - title: Predictive scaling for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html
