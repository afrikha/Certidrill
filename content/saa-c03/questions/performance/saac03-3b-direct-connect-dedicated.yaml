id: saac03-3b-direct-connect-dedicated
objective: "3.4.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company transfers several terabytes of data every day between its data center and a VPC over a Site-to-Site VPN connection. Transfers are slow, and latency varies with internet conditions. The company needs a private connection with 10 Gbps of dedicated bandwidth and consistent network performance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise transfère chaque jour plusieurs téraoctets de données entre son centre de données et un VPC via une connexion Site-to-Site VPN. Les transferts sont lents, et la latence varie selon l'état d'Internet. L'entreprise a besoin d'une connexion privée avec 10 Gbit/s de bande passante dédiée et des performances réseau constantes.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add a second Site-to-Site VPN connection and use both tunnels of each connection.", fr: "Ajouter une deuxième connexion Site-to-Site VPN et utiliser les deux tunnels de chaque connexion." }
    - id: b
      text: { en: "Order a 10 Gbps AWS Direct Connect dedicated connection and create a private virtual interface.", fr: "Commander une connexion dédiée AWS Direct Connect de 10 Gbit/s et créer une interface virtuelle privée." }
    - id: c
      text: { en: "Deploy an AWS Client VPN endpoint and connect the data center servers to it.", fr: "Déployer un point de terminaison AWS Client VPN et y connecter les serveurs du centre de données." }
    - id: d
      text: { en: "Turn on acceleration for the existing Site-to-Site VPN connection.", fr: "Activer l'accélération pour la connexion Site-to-Site VPN existante." }
answer: { optionId: b }
explanation:
  correct:
    en: Direct Connect links the data center to a Direct Connect location over a dedicated fiber connection, bypassing internet service providers, with port speeds such as 10 Gbps. A private virtual interface reaches the VPC over private IP addresses with consistent performance.
    fr: Direct Connect relie le centre de données à un emplacement Direct Connect par une connexion fibre dédiée, sans passer par les fournisseurs d'accès à Internet, avec des débits de port tels que 10 Gbit/s. Une interface virtuelle privée atteint le VPC par des adresses IP privées avec des performances constantes.
  options:
    a:
      en: VPN tunnels still run over the internet with variable latency, and each standard tunnel is limited to 1.25 Gbps.
      fr: Les tunnels VPN passent toujours par Internet avec une latence variable, et chaque tunnel standard est limité à 1,25 Gbit/s.
    c:
      en: Client VPN connects individual users to AWS over the internet; it is not a dedicated site-to-site link.
      fr: Client VPN connecte des utilisateurs individuels à AWS via Internet ; ce n'est pas une liaison dédiée de site à site.
    d:
      en: Acceleration carries the tunnels over the AWS global network from a nearby edge location, but it is still an internet VPN with per-tunnel limits, not dedicated bandwidth.
      fr: L'accélération transporte les tunnels sur le réseau mondial AWS depuis un emplacement périphérique proche, mais cela reste un VPN sur Internet avec des limites par tunnel, pas une bande passante dédiée.
references:
  - title: What is Direct Connect?
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html
  - title: What is AWS Site-to-Site VPN?
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html
