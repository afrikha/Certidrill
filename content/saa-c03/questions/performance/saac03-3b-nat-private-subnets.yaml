id: saac03-3b-nat-private-subnets
objective: "3.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs web servers on Amazon EC2 instances in private subnets of a VPC that has an internet gateway and public subnets. The servers must download operating system patches from the internet, but nobody on the internet may start connections to them. The servers have no public IP addresses.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute des serveurs web sur des instances Amazon EC2 dans les sous-réseaux privés d'un VPC qui possède une passerelle Internet et des sous-réseaux publics. Les serveurs doivent télécharger des correctifs du système d'exploitation depuis Internet, mais personne sur Internet ne doit pouvoir initier de connexion vers eux. Les serveurs n'ont pas d'adresse IP publique.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Associate an Elastic IP address with each web server.", fr: "Associer une adresse IP Elastic à chaque serveur web." } }
    - { id: b, text: { en: "Create a public NAT gateway in a public subnet.", fr: "Créer une passerelle NAT publique dans un sous-réseau public." } }
    - { id: c, text: { en: "Add a 0.0.0.0/0 route to the internet gateway in the private subnets' route table.", fr: "Ajouter une route 0.0.0.0/0 vers la passerelle Internet dans la table de routage des sous-réseaux privés." } }
    - { id: d, text: { en: "Add a 0.0.0.0/0 route to the NAT gateway in the private subnets' route table.", fr: "Ajouter une route 0.0.0.0/0 vers la passerelle NAT dans la table de routage des sous-réseaux privés." } }
    - { id: e, text: { en: "Create a private NAT gateway in a private subnet.", fr: "Créer une passerelle NAT privée dans un sous-réseau privé." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A public NAT gateway is created in a public subnet with an Elastic IP address and sends traffic to the internet gateway. Pointing the private subnets' default route to it lets the servers start outbound connections, while the internet cannot start unsolicited connections to them.
    fr: Une passerelle NAT publique est créée dans un sous-réseau public avec une adresse IP Elastic et envoie le trafic vers la passerelle Internet. Diriger la route par défaut des sous-réseaux privés vers elle permet aux serveurs d'initier des connexions sortantes, alors qu'Internet ne peut pas initier de connexions non sollicitées vers eux.
  options:
    a:
      en: Elastic IP addresses make the servers directly reachable from the internet, which violates the requirement.
      fr: Des adresses IP Elastic rendent les serveurs directement joignables depuis Internet, ce qui enfreint l'exigence.
    c:
      en: A route to the internet gateway turns the subnets into public subnets, and instances without public IP addresses still cannot reach the internet that way.
      fr: Une route vers la passerelle Internet transforme les sous-réseaux en sous-réseaux publics, et des instances sans adresse IP publique ne peuvent toujours pas joindre Internet de cette façon.
    e:
      en: A private NAT gateway only connects to other VPCs or on-premises networks through a transit gateway or virtual private gateway; it cannot reach the internet.
      fr: Une passerelle NAT privée ne se connecte qu'à d'autres VPC ou à des réseaux sur site via une passerelle de transit ou une passerelle réseau privé virtuel ; elle ne peut pas joindre Internet.
references:
  - title: NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-nat-gateway.html
