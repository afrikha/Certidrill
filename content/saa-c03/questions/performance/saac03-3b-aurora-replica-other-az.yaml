id: saac03-3b-aurora-replica-other-az
objective: "3.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL DB cluster that has a single writer DB instance in one Availability Zone and no Aurora Replicas. A new requirement states that if the Availability Zone of the writer fails, the database must accept writes again in less than 1 minute. The solution must keep all resources in the current AWS Region.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster de bases de données Amazon Aurora MySQL qui comporte une seule instance d'écriture dans une zone de disponibilité et aucun réplica Aurora. Une nouvelle exigence impose que, si la zone de disponibilité de l'instance d'écriture tombe en panne, la base de données accepte de nouveau les écritures en moins d'une minute. La solution doit conserver toutes les ressources dans la Région AWS actuelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Rely on the Aurora cluster volume, which already stores six copies of the data across several Availability Zones.", fr: "S'appuyer sur le volume de cluster Aurora, qui stocke déjà six copies des données dans plusieurs zones de disponibilité." }
    - id: b
      text: { en: "Add an Aurora Replica in a different Availability Zone so that Aurora can promote it if the writer fails.", fr: "Ajouter un réplica Aurora dans une autre zone de disponibilité afin qu'Aurora puisse le promouvoir si l'instance d'écriture tombe en panne." }
    - id: c
      text: { en: "Add an Aurora Replica in the same Availability Zone as the writer so that Aurora can promote it if the writer fails.", fr: "Ajouter un réplica Aurora dans la même zone de disponibilité que l'instance d'écriture afin qu'Aurora puisse le promouvoir si celle-ci tombe en panne." }
    - id: d
      text: { en: "Create an Aurora global database with a secondary cluster and fail over to the secondary cluster when the zone fails.", fr: "Créer une base de données globale Aurora avec un cluster secondaire et basculer vers ce cluster secondaire lorsque la zone tombe en panne." }
answer: { optionId: b }
explanation:
  correct:
    en: When the writer fails, Aurora promotes an existing Aurora Replica, which typically restores service in less than 60 seconds. Placing the replica in another Availability Zone keeps it running when the writer's zone fails, and the shared cluster volume already spans several zones.
    fr: Lorsque l'instance d'écriture tombe en panne, Aurora promeut un réplica Aurora existant, ce qui rétablit généralement le service en moins de 60 secondes. Placer le réplica dans une autre zone de disponibilité le maintient en service quand la zone de l'instance d'écriture tombe en panne, et le volume de cluster partagé couvre déjà plusieurs zones.
  options:
    a:
      en: The storage survives the zone failure, but without a replica Aurora must recover or create a primary instance, which typically takes up to 10 minutes.
      fr: Le stockage survit à la panne de zone, mais sans réplica Aurora doit récupérer ou créer une instance principale, ce qui prend généralement jusqu'à 10 minutes.
    c:
      en: A replica in the same Availability Zone fails together with the writer when that zone fails.
      fr: Un réplica dans la même zone de disponibilité tombe en panne en même temps que l'instance d'écriture lorsque cette zone tombe en panne.
    d:
      en: A global database places the secondary cluster in another Region, which violates the requirement to keep resources in the current Region.
      fr: Une base de données globale place le cluster secondaire dans une autre Région, ce qui enfreint l'exigence de conserver les ressources dans la Région actuelle.
references:
  - title: High availability for Amazon Aurora
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html
