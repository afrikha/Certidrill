id: saac03-3c-redshift-warehouse
objective: "3.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company has 40 TB of structured sales, inventory and customer data. About 300 analysts use a business intelligence (BI) tool all day long to run complex SQL queries with joins and aggregations across these datasets. The analysts need consistently fast query performance, and the data will grow to several hundred terabytes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution dispose de 40 To de données structurées de ventes, de stocks et de clients. Environ 300 analystes utilisent toute la journée un outil de business intelligence (BI) pour exécuter des requêtes SQL complexes avec des jointures et des agrégations sur ces jeux de données. Les analystes ont besoin de performances de requête rapides et constantes, et les données atteindront plusieurs centaines de téraoctets.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Store the data in Amazon DynamoDB tables with global secondary indexes and connect the BI tool to DynamoDB.", fr: "Stocker les données dans des tables Amazon DynamoDB avec des index secondaires globaux et connecter l'outil BI à DynamoDB." } }
    - { id: b, text: { en: "Load the data into an Amazon Redshift data warehouse and connect the BI tool to it.", fr: "Charger les données dans un entrepôt de données Amazon Redshift et y connecter l'outil BI." } }
    - { id: c, text: { en: "Load the data into an Amazon Aurora PostgreSQL DB cluster and add read replicas for the analysts.", fr: "Charger les données dans un cluster de bases de données Amazon Aurora PostgreSQL et ajouter des réplicas en lecture pour les analystes." } }
    - { id: d, text: { en: "Store the data in Amazon ElastiCache for Redis and run the queries against the cache.", fr: "Stocker les données dans Amazon ElastiCache for Redis et exécuter les requêtes sur le cache." } }
answer: { optionId: b }
explanation:
  correct:
    en: Amazon Redshift is a fully managed, petabyte-scale data warehouse designed for complex analytical SQL queries on large structured datasets. Analysts connect their usual SQL-based BI tools, and the warehouse scales well beyond the expected few hundred terabytes.
    fr: "Amazon Redshift est un entrepôt de données entièrement géré à l'échelle du pétaoctet, conçu pour les requêtes SQL analytiques complexes sur de grands jeux de données structurés. Les analystes y connectent leurs outils BI habituels basés sur SQL, et l'entrepôt évolue bien au-delà des quelques centaines de téraoctets prévues."
  options:
    a: { en: "DynamoDB is a key-value and document database; it does not run SQL joins and aggregations for BI workloads.", fr: "DynamoDB est une base de données clé-valeur et documents ; elle n'exécute pas les jointures et agrégations SQL d'une charge BI." }
    c: { en: "Aurora is a relational database built for transactional workloads; large analytical scans across hundreds of terabytes are not its use case.", fr: "Aurora est une base de données relationnelle conçue pour les charges transactionnelles ; les grandes analyses sur des centaines de téraoctets ne sont pas son cas d'usage." }
    d: { en: "ElastiCache is an in-memory cache for low-latency key lookups, not an analytical store for hundreds of terabytes queried with SQL.", fr: "ElastiCache est un cache en mémoire pour des recherches par clé à faible latence, pas un magasin analytique de centaines de téraoctets interrogé en SQL." }
references:
  - title: What is Amazon Redshift?
    url: https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html
