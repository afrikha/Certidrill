id: saac03-3b-dbtype-aurora-joins
objective: "3.3.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is building an order management system. Analysts and the application run ad hoc SQL queries that join customers, orders, invoices and payments. Several operations must update multiple tables in a single ACID transaction, and the development team already uses MySQL tools.

    Which database will meet these requirements?
  fr: |
    Une entreprise développe un système de gestion des commandes. Les analystes et l'application exécutent des requêtes SQL ad hoc qui joignent clients, commandes, factures et paiements. Plusieurs opérations doivent mettre à jour plusieurs tables dans une seule transaction ACID, et l'équipe de développement utilise déjà des outils MySQL.

    Quelle base de données répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon DynamoDB with transactions" }
    - { id: b, text: "Amazon DocumentDB (with MongoDB compatibility)" }
    - { id: c, text: "Amazon Keyspaces (for Apache Cassandra)" }
    - { id: d, text: "Amazon Aurora MySQL-Compatible Edition" }
answer: { optionId: d }
explanation:
  correct:
    en: Aurora MySQL is a managed relational database compatible with MySQL, so existing MySQL tools work. It supports SQL joins across tables, ad hoc queries and multi-table ACID transactions, which fit an order management schema.
    fr: Aurora MySQL est une base relationnelle gérée compatible avec MySQL ; les outils MySQL existants fonctionnent donc. Elle prend en charge les jointures SQL entre tables, les requêtes ad hoc et les transactions ACID multi-tables, ce qui convient à un schéma de gestion des commandes.
  options:
    a:
      en: DynamoDB supports ACID transactions but has no JOIN operator and is designed around known access patterns, not ad hoc relational queries.
      fr: DynamoDB prend en charge les transactions ACID mais n'a pas d'opérateur JOIN et est conçu autour de modèles d'accès connus, pas de requêtes relationnelles ad hoc.
    b:
      en: DocumentDB is a MongoDB-compatible document database; it does not run SQL joins or work with MySQL tools.
      fr: DocumentDB est une base de documents compatible MongoDB ; elle n'exécute pas de jointures SQL et ne fonctionne pas avec les outils MySQL.
    c:
      en: Keyspaces is a Cassandra-compatible wide-column database queried with CQL; it does not support joins across tables.
      fr: Keyspaces est une base à colonnes larges compatible Cassandra interrogée en CQL ; elle ne prend pas en charge les jointures entre tables.
references:
  - title: What is Amazon Aurora?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
