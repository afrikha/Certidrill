id: saac03-3a-hpc-cluster-efa
objective: "3.2.9"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    An engineering company runs a tightly coupled computational fluid dynamics simulation that uses MPI across 64 Amazon EC2 instances. Most of the traffic flows between the instances, and the simulation needs the lowest and most consistent inter-node latency and the highest throughput that EC2 can provide.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société d'ingénierie exécute une simulation de mécanique des fluides numérique fortement couplée qui utilise MPI sur 64 instances Amazon EC2. L'essentiel du trafic circule entre les instances, et la simulation exige la latence entre nœuds la plus faible et la plus constante ainsi que le débit le plus élevé qu'EC2 puisse offrir.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Launch all the instances in a cluster placement group in a single Availability Zone.", fr: "Lancer toutes les instances dans un groupe de placement de cluster au sein d'une seule zone de disponibilité." }
    - id: b
      text: { en: "Launch the instances in a spread placement group across three Availability Zones.", fr: "Lancer les instances dans un groupe de placement réparti sur trois zones de disponibilité." }
    - id: c
      text: { en: "Launch the instances in a partition placement group with seven partitions.", fr: "Lancer les instances dans un groupe de placement par partition comportant sept partitions." }
    - id: d
      text: { en: "Use an EFA-supported instance type and attach an Elastic Fabric Adapter to each instance.", fr: "Utiliser un type d'instance compatible EFA et attacher un Elastic Fabric Adapter à chaque instance." }
    - id: e
      text: { en: "Spread the instances across two AWS Regions and connect the VPCs with peering.", fr: "Répartir les instances sur deux Régions AWS et relier les VPC par peering." }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |-
      A cluster placement group packs instances into the same high-bisection bandwidth network segment of one Availability Zone for low latency and high throughput, which suits traffic that flows mostly between the instances. An Elastic Fabric Adapter lets MPI applications bypass the operating system kernel for lower and more consistent latency; EFA traffic cannot cross Availability Zones, which matches a single-zone cluster placement group.
    fr: |-
      Un groupe de placement de cluster regroupe les instances dans le même segment réseau à bande passante bisectionnelle élevée d'une zone de disponibilité, pour une faible latence et un débit élevé, ce qui convient à un trafic circulant surtout entre les instances. Un Elastic Fabric Adapter permet aux applications MPI de contourner le noyau du système d'exploitation pour une latence plus faible et plus constante ; le trafic EFA ne peut pas franchir les zones de disponibilité, ce qui correspond à un groupe de placement de cluster dans une seule zone.
  options:
    b:
      en: |-
        A spread placement group puts each instance on distinct hardware to limit correlated failures, supports at most seven running instances per Availability Zone, and adds cross-zone latency.
      fr: |-
        Un groupe de placement réparti place chaque instance sur un matériel distinct pour limiter les pannes corrélées, n'accepte que sept instances en cours d'exécution par zone de disponibilité et ajoute une latence entre zones.
    c:
      en: |-
        Partition placement groups reduce correlated hardware failures for distributed stores such as HDFS or Cassandra; they do not minimize inter-node latency.
      fr: |-
        Les groupes de placement par partition réduisent les pannes matérielles corrélées pour des systèmes distribués comme HDFS ou Cassandra ; ils ne réduisent pas au minimum la latence entre nœuds.
    e:
      en: |-
        Spreading a tightly coupled job across Regions adds large network latency, and EFA traffic cannot cross VPCs.
      fr: |-
        Répartir une tâche fortement couplée sur plusieurs Régions ajoute une forte latence réseau, et le trafic EFA ne peut pas franchir les VPC.
references:
  - title: Placement strategies for your placement groups - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
  - title: Elastic Fabric Adapter for AI/ML and HPC workloads on Amazon EC2 - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/efa.html
