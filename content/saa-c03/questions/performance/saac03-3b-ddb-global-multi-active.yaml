id: saac03-3b-ddb-global-multi-active
objective: "3.3.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A global retailer is designing a shopping cart service for customers in North America, Europe and Asia. The service stores carts as key-value items. Customers in each geography must read and write their carts with low latency in their nearest AWS Region, and if one Region fails, the other Regions must keep accepting writes without a failover step.

    Which solution will meet these requirements?
  fr: |
    Un distributeur mondial conçoit un service de panier d'achat pour des clients en Amérique du Nord, en Europe et en Asie. Le service stocke les paniers sous forme d'éléments clé-valeur. Les clients de chaque zone géographique doivent lire et écrire leur panier avec une faible latence dans la Région AWS la plus proche, et si une Région tombe en panne, les autres Régions doivent continuer à accepter les écritures sans étape de basculement.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Aurora global database with a secondary cluster in each other Region and write forwarding enabled", fr: "Une base de données globale Aurora avec un cluster secondaire dans chaque autre Région et le transfert d'écriture activé" }
    - id: b
      text: { en: "An Amazon RDS for MySQL DB instance in one Region with a cross-Region read replica in each other Region", fr: "Une instance de base de données Amazon RDS for MySQL dans une Région avec un réplica en lecture entre Régions dans chaque autre Région" }
    - id: c
      text: { en: "An Amazon DynamoDB global table with a replica in each of the three Regions", fr: "Une table globale Amazon DynamoDB avec un réplica dans chacune des trois Régions" }
    - id: d
      text: { en: "An Amazon DynamoDB table in one Region, with AWS Global Accelerator routing all users to that Region", fr: "Une table Amazon DynamoDB dans une seule Région, avec AWS Global Accelerator qui achemine tous les utilisateurs vers cette Région" }
answer: { optionId: c }
explanation:
  correct:
    en: DynamoDB global tables are multi-active, so every replica accepts reads and writes locally, and changes replicate asynchronously between Regions. If one Region is interrupted, applications in the other Regions keep reading and writing their local replicas.
    fr: "Les tables globales DynamoDB sont multi-actives : chaque réplica accepte localement les lectures et les écritures, et les modifications sont répliquées de façon asynchrone entre Régions. Si une Région est interrompue, les applications des autres Régions continuent de lire et d'écrire dans leur réplica local."
  options:
    a:
      en: An Aurora global database has a single primary Region for writes; write forwarding sends writes to that Region, so writes are not local and stop until a failover if the primary Region fails.
      fr: Une base de données globale Aurora n'a qu'une seule Région principale pour les écritures ; le transfert d'écriture envoie les écritures vers cette Région, elles ne sont donc pas locales et s'arrêtent jusqu'à un basculement si la Région principale tombe en panne.
    b:
      en: Read replicas accept only reads, so all writes travel to one Region, and losing that Region requires promoting a replica.
      fr: Les réplicas en lecture n'acceptent que les lectures ; toutes les écritures vont donc vers une seule Région, et la perte de celle-ci impose de promouvoir un réplica.
    d:
      en: Global Accelerator improves the network path, but all data stays in one Region, so a Regional failure stops all writes.
      fr: Global Accelerator améliore le chemin réseau, mais toutes les données restent dans une seule Région ; une panne régionale arrête donc toutes les écritures.
references:
  - title: Global tables - multi-active, multi-Region replication
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html
  - title: Using Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html
