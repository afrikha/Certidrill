id: saac03-3a-gp2-to-gp3-iops
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a MySQL database on an Amazon EC2 instance. The data is on a 200 GiB Amazon EBS gp2 volume, which has a baseline of 600 IOPS. During business hours the volume runs out of burst credits and query latency increases. The workload needs a sustained 5,000 IOPS and 250 MiB/s of throughput, and the data size will not grow.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exécute une base de données MySQL sur une instance Amazon EC2. Les données se trouvent sur un volume Amazon EBS gp2 de 200 Gio, dont la base de référence est de 600 IOPS. Pendant les heures ouvrées, le volume épuise ses crédits de rafale et la latence des requêtes augmente. La charge de travail exige 5 000 IOPS soutenues et un débit de 250 Mio/s, et la taille des données n'augmentera pas.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Increase the size of the gp2 volume to 1,700 GiB so that its baseline exceeds 5,000 IOPS.", fr: "Augmenter la taille du volume gp2 à 1 700 Gio afin que sa base de référence dépasse 5 000 IOPS." }
    - id: b
      text: { en: "Change the volume to io2 and provision 5,000 IOPS.", fr: "Passer le volume en io2 et provisionner 5 000 IOPS." }
    - id: c
      text: { en: "Change the volume to gp3 and provision 5,000 IOPS and 250 MiB/s of throughput.", fr: "Passer le volume en gp3 et provisionner 5 000 IOPS et un débit de 250 Mio/s." }
    - id: d
      text: { en: "Change the volume to st1 to get higher throughput for the database.", fr: "Passer le volume en st1 afin d'obtenir un débit plus élevé pour la base de données." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      gp3 includes 3,000 IOPS and 125 MiB/s regardless of size, and lets you provision more IOPS and throughput independently of capacity, with no burst credits. A 200 GiB gp3 volume can be set to 5,000 IOPS and 250 MiB/s, and gp3 storage costs less per GiB than gp2. The change can be made in place with Elastic Volumes.
    fr: |-
      gp3 inclut 3 000 IOPS et 125 Mio/s quelle que soit la taille, et permet de provisionner davantage d'IOPS et de débit indépendamment de la capacité, sans crédits de rafale. Un volume gp3 de 200 Gio peut être configuré à 5 000 IOPS et 250 Mio/s, et le stockage gp3 coûte moins cher au Gio que gp2. La modification se fait sur place avec Elastic Volumes.
  options:
    a:
      en: |-
        gp2 delivers 3 IOPS per GiB, so this works, but the company would pay for about 1,500 GiB of storage it does not need.
      fr: |-
        gp2 fournit 3 IOPS par Gio, donc cela fonctionne, mais l'entreprise paierait environ 1 500 Gio de stockage inutile.
    b:
      en: |-
        io2 meets the performance target, but Provisioned IOPS SSD storage and IOPS cost more than gp3 for a requirement that gp3 already covers.
      fr: |-
        io2 atteint l'objectif de performances, mais le stockage et les IOPS SSD à IOPS provisionnées coûtent plus cher que gp3 pour un besoin que gp3 couvre déjà.
    d:
      en: |-
        st1 is a throughput-optimized HDD for large sequential I/O, limited to 500 IOPS, so it cannot serve the random I/O of a database.
      fr: |-
        st1 est un HDD optimisé pour le débit des E/S séquentielles volumineuses, limité à 500 IOPS : il ne peut pas servir les E/S aléatoires d'une base de données.
