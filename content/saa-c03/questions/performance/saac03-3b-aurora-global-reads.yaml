id: saac03-3b-aurora-global-reads
objective: "3.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Aurora MySQL DB cluster in us-east-1 and is opening operations in Europe. European users need low-latency reads from a database in eu-west-1, with replication lag that is typically under 1 second. If us-east-1 has an outage, the company wants to make eu-west-1 the primary with minimal data loss. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster de bases de données Amazon Aurora MySQL dans us-east-1 et ouvre des activités en Europe. Les utilisateurs européens ont besoin de lectures à faible latence depuis une base de données dans eu-west-1, avec un retard de réplication généralement inférieur à 1 seconde. En cas de panne de us-east-1, l'entreprise veut faire de eu-west-1 la Région principale avec une perte de données minimale. La solution doit avoir le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Copy automated snapshots to eu-west-1 every hour and restore the latest snapshot into a cluster there for reads.", fr: "Copier chaque heure les instantanés automatisés vers eu-west-1 et y restaurer le plus récent dans un cluster pour les lectures." }
    - id: b
      text: { en: "Run an AWS DMS task with ongoing replication from the us-east-1 cluster to a separate Aurora cluster in eu-west-1.", fr: "Exécuter une tâche AWS DMS avec réplication continue depuis le cluster de us-east-1 vers un cluster Aurora distinct dans eu-west-1." }
    - id: c
      text: { en: "Add an Aurora Replica to the existing cluster and place it in an Availability Zone of eu-west-1.", fr: "Ajouter un réplica Aurora au cluster existant et le placer dans une zone de disponibilité de eu-west-1." }
    - id: d
      text: { en: "Convert the cluster to an Aurora global database and add a secondary cluster in eu-west-1.", fr: "Convertir le cluster en base de données globale Aurora et ajouter un cluster secondaire dans eu-west-1." }
answer: { optionId: d }
explanation:
  correct:
    en: Aurora Global Database replicates from the primary Region to up to 10 read-only secondary Regions on dedicated infrastructure, with latency typically under a second. Secondary clusters serve local reads, and a failover promotes a secondary Region with lower RPO and RTO than traditional replication.
    fr: Aurora Global Database réplique depuis la Région principale vers jusqu'à 10 Régions secondaires en lecture seule sur une infrastructure dédiée, avec une latence généralement inférieure à une seconde. Les clusters secondaires servent des lectures locales, et un basculement promeut une Région secondaire avec un RPO et un RTO plus faibles qu'une réplication traditionnelle.
  options:
    a:
      en: Hourly snapshots give data up to an hour old, far above the 1-second lag, and the restore process must be run and maintained.
      fr: Des instantanés horaires fournissent des données vieilles d'une heure au plus, bien au-delà du retard de 1 seconde, et le processus de restauration doit être exécuté et maintenu.
    b:
      en: DMS CDC has no latency SLA and can lag by minutes, and the replication task is extra infrastructure to operate.
      fr: La CDC de DMS n'a pas de SLA de latence et peut avoir plusieurs minutes de retard, et la tâche de réplication est une infrastructure supplémentaire à exploiter.
    c:
      en: Aurora Replicas belong to the cluster's own Region; a cluster cannot place a replica in an Availability Zone of another Region.
      fr: Les réplicas Aurora appartiennent à la Région du cluster ; un cluster ne peut pas placer de réplica dans une zone de disponibilité d'une autre Région.
references:
  - title: Using Amazon Aurora Global Database
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html
