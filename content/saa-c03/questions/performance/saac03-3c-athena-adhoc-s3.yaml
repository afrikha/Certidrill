id: saac03-3c-athena-adhoc-s3
objective: "3.5.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exports application logs as CSV files to an Amazon S3 bucket every day. A few times each month, analysts need to run ad hoc SQL queries on the files. The company does not want to manage any infrastructure and wants to pay only for the queries that the analysts run.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exporte chaque jour des journaux d'application au format CSV dans un compartiment Amazon S3. Quelques fois par mois, des analystes doivent exécuter des requêtes SQL ponctuelles sur ces fichiers. L'entreprise ne veut gérer aucune infrastructure et souhaite payer uniquement pour les requêtes que les analystes exécutent.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Load the files into a provisioned Amazon Redshift cluster and run the queries from the query editor.", fr: "Charger les fichiers dans un cluster Amazon Redshift provisionné et exécuter les requêtes depuis l'éditeur de requêtes." } }
    - { id: b, text: { en: "Run a long-running Amazon EMR cluster with Apache Hive and create Hive tables on the S3 data.", fr: "Exécuter un cluster Amazon EMR permanent avec Apache Hive et créer des tables Hive sur les données S3." } }
    - { id: c, text: { en: "Import the files into an Amazon RDS for PostgreSQL DB instance every day and query the database.", fr: "Importer chaque jour les fichiers dans une instance de base de données Amazon RDS for PostgreSQL et interroger la base." } }
    - { id: d, text: { en: "Define tables for the files in the AWS Glue Data Catalog and query them in place with Amazon Athena.", fr: "Définir des tables pour les fichiers dans AWS Glue Data Catalog et les interroger sur place avec Amazon Athena." } }
answer: { optionId: d }
explanation:
  correct:
    en: Amazon Athena is a serverless interactive query service that runs standard SQL directly on data in Amazon S3. There is no infrastructure to set up or manage, and the company pays only for the queries it runs, which fits occasional ad hoc analysis.
    fr: "Amazon Athena est un service de requêtes interactives sans serveur qui exécute du SQL standard directement sur les données d'Amazon S3. Il n'y a aucune infrastructure à configurer ni à gérer, et l'entreprise paie uniquement les requêtes exécutées, ce qui convient à une analyse ponctuelle."
  options:
    a: { en: "A provisioned Redshift cluster must be sized and is billed while it runs, even when no one queries it.", fr: "Un cluster Redshift provisionné doit être dimensionné et il est facturé tant qu'il s'exécute, même sans requête." }
    b: { en: "A long-running EMR cluster is infrastructure to manage and is billed for its instances all month.", fr: "Un cluster EMR permanent est une infrastructure à gérer, facturée pour ses instances tout le mois." }
    c: { en: "A DB instance must be managed, is billed continuously, and requires a daily import job.", fr: "Une instance de base de données doit être gérée, est facturée en continu et exige une tâche d'import quotidienne." }
references:
  - title: What is Amazon Athena?
    url: https://docs.aws.amazon.com/athena/latest/ug/what-is.html
