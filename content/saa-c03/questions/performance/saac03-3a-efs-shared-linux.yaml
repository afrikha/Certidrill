id: saac03-3a-efs-shared-linux
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs a content management application on Linux Amazon EC2 instances in an Auto Scaling group that spans three Availability Zones. All instances must read and write the same files at the same time by using standard POSIX file system semantics. The storage must grow automatically as editors add content, without capacity planning.

    Which storage solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute une application de gestion de contenu sur des instances Amazon EC2 Linux dans un groupe Auto Scaling réparti sur trois zones de disponibilité. Toutes les instances doivent lire et écrire les mêmes fichiers simultanément en utilisant la sémantique standard d'un système de fichiers POSIX. Le stockage doit croître automatiquement à mesure que les rédacteurs ajoutent du contenu, sans planification de capacité.

    Quelle solution de stockage répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon EBS gp3 volume with Multi-Attach enabled, attached to every instance", fr: "Un volume Amazon EBS gp3 avec Multi-Attach activé, attaché à chaque instance" }
    - id: b
      text: { en: "An Amazon S3 bucket that the application accesses through the AWS SDK", fr: "Un compartiment Amazon S3 auquel l'application accède via le kit SDK AWS" }
    - id: c
      text: { en: "An Amazon EFS Regional file system mounted on every instance", fr: "Un système de fichiers Amazon EFS régional (Regional) monté sur chaque instance" }
    - id: d
      text: { en: "An Amazon FSx for Windows File Server file system shared over SMB", fr: "Un système de fichiers Amazon FSx for Windows File Server partagé en SMB" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Amazon EFS is an NFS file system with POSIX permissions that many instances can mount concurrently. A Regional file system stores data across multiple Availability Zones, and EFS grows and shrinks automatically as files are added and removed, with no capacity to provision.
    fr: |-
      Amazon EFS est un système de fichiers NFS avec permissions POSIX que de nombreuses instances peuvent monter simultanément. Un système de fichiers régional stocke les données dans plusieurs zones de disponibilité, et EFS croît et décroît automatiquement à mesure que des fichiers sont ajoutés ou supprimés, sans capacité à provisionner.
  options:
    a:
      en: |-
        gp3 volumes do not support Multi-Attach (only io1 and io2 do), and Multi-Attach works only within one Availability Zone.
      fr: |-
        Les volumes gp3 ne prennent pas en charge Multi-Attach (seuls io1 et io2 le font), et Multi-Attach ne fonctionne qu'au sein d'une seule zone de disponibilité.
    b:
      en: |-
        S3 is object storage accessed through an API, not a POSIX file system, so the application would need code changes.
      fr: |-
        S3 est un stockage d'objets accessible par API, pas un système de fichiers POSIX : l'application devrait être modifiée.
    d:
      en: |-
        FSx for Windows File Server provides SMB shares with Windows semantics and a provisioned storage capacity; it is not the POSIX file system that scales automatically.
      fr: |-
        FSx for Windows File Server fournit des partages SMB avec une sémantique Windows et une capacité de stockage provisionnée ; ce n'est pas le système de fichiers POSIX à croissance automatique demandé.
references:
  - title: What is Amazon Elastic File System? - Amazon Elastic File System
    url: https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html
