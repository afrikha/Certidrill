id: saac03-3c-lf-row-filter-country
objective: "3.5.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores a sales table in an Amazon S3 data lake that is governed by AWS Lake Formation. Analysts query the table with Amazon Athena. The data is not partitioned by country. Analysts in each country must see only the rows of their own country, and the company does not want to maintain copies of the data.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke une table des ventes dans un lac de données Amazon S3 gouverné par AWS Lake Formation. Les analystes interrogent la table avec Amazon Athena. Les données ne sont pas partitionnées par pays. Les analystes de chaque pays ne doivent voir que les lignes de leur pays, et l'entreprise ne veut pas gérer de copies des données.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run a nightly AWS Glue job that writes one copy of the table per country and grant each team access to its copy.", fr: "Exécuter chaque nuit une tâche AWS Glue qui écrit une copie de la table par pays et accorder à chaque équipe l'accès à sa copie." } }
    - { id: b, text: { en: "Create one Athena workgroup per country and assign each team of analysts to its workgroup.", fr: "Créer un groupe de travail Athena par pays et affecter chaque équipe d'analystes à son groupe de travail." } }
    - { id: c, text: { en: "Attach IAM policies that limit each team's s3:GetObject permission to the objects of its country.", fr: "Attacher des politiques IAM qui limitent l'autorisation s3:GetObject de chaque équipe aux objets de son pays." } }
    - { id: d, text: { en: "Create a Lake Formation data filter per country with a row filter expression and grant SELECT with that filter to the team.", fr: "Créer un filtre de données Lake Formation par pays avec une expression de filtre de lignes et accorder SELECT avec ce filtre à l'équipe." } }
answer: { optionId: d }
explanation:
  correct:
    en: Lake Formation data filters attached to a SELECT grant provide row-level security; a row filter expression such as country='FR' limits the rows each principal sees. Athena enforces the filters at query time on the single copy of the data.
    fr: "Les filtres de données Lake Formation associés à une autorisation SELECT assurent la sécurité au niveau des lignes ; une expression de filtre de lignes comme country='FR' limite les lignes visibles par chaque principal. Athena applique les filtres lors de la requête, sur l'unique copie des données."
  options:
    a: { en: "Per-country copies are exactly what the company wants to avoid, and they add jobs, storage and delay.", fr: "Des copies par pays sont précisément ce que l'entreprise veut éviter, et elles ajoutent des tâches, du stockage et du délai." }
    b: { en: "Workgroups separate query execution settings and costs; they do not restrict which rows a user can read.", fr: "Les groupes de travail séparent les paramètres d'exécution et les coûts des requêtes ; ils ne restreignent pas les lignes qu'un utilisateur peut lire." }
    c: { en: "The rows of all countries are mixed in the same objects, so object-level permissions cannot separate them.", fr: "Les lignes de tous les pays sont mélangées dans les mêmes objets : des autorisations au niveau objet ne peuvent pas les séparer." }
references:
  - title: Data filtering and cell-level security in Lake Formation
    url: https://docs.aws.amazon.com/lake-formation/latest/dg/data-filtering.html
