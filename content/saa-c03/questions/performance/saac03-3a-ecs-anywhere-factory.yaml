id: saac03-3a-ecs-anywhere-factory
objective: "3.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturer already runs containerized services on Amazon ECS in an AWS Region. For latency and data residency reasons, some data-processing containers must run on the company's existing Linux servers in its factories. These containers process data locally and send results to AWS; they receive no inbound traffic. The company wants to manage them with the same ECS control plane and APIs as its cloud workloads, without operating a container orchestrator on premises.

    Which solution will meet these requirements?
  fr: |
    Un fabricant exécute déjà des services conteneurisés sur Amazon ECS dans une Région AWS. Pour des raisons de latence et de résidence des données, certains conteneurs de traitement de données doivent s'exécuter sur les serveurs Linux existants de ses usines. Ces conteneurs traitent les données localement et envoient les résultats vers AWS ; ils ne reçoivent aucun trafic entrant. L'entreprise souhaite les gérer avec le même plan de contrôle et les mêmes API ECS que ses charges de travail cloud, sans exploiter d'orchestrateur de conteneurs sur site.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Register the factory servers as external instances in an ECS cluster by using Amazon ECS Anywhere.", fr: "Enregistrer les serveurs des usines comme instances externes dans un cluster ECS à l'aide d'Amazon ECS Anywhere." }
    - id: b
      text: { en: "Install Amazon EKS Anywhere on the factory servers and deploy the containers to it.", fr: "Installer Amazon EKS Anywhere sur les serveurs des usines et y déployer les conteneurs." }
    - id: c
      text: { en: "Order AWS Outposts racks for each factory and run the ECS tasks on them.", fr: "Commander des racks AWS Outposts pour chaque usine et y exécuter les tâches ECS." }
    - id: d
      text: { en: "Run the containers as ECS tasks on AWS Fargate in the Region nearest to the factories.", fr: "Exécuter les conteneurs en tant que tâches ECS sur AWS Fargate dans la Région la plus proche des usines." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      ECS Anywhere registers on-premises servers or VMs as external instances of an ECS cluster, and tasks run on them with the EXTERNAL launch type, managed by the regional ECS control plane. It is best suited to workloads that generate outbound traffic or process data, like these containers.
    fr: |-
      ECS Anywhere enregistre des serveurs ou des machines virtuelles sur site comme instances externes d'un cluster ECS, et les tâches s'y exécutent avec le type de lancement EXTERNAL, sous le contrôle du plan de contrôle ECS régional. Il convient particulièrement aux charges qui génèrent du trafic sortant ou traitent des données, comme ces conteneurs.
  options:
    b:
      en: |-
        EKS Anywhere runs Kubernetes clusters that the company operates in its own data centers; it is not the ECS control plane the company already uses.
      fr: |-
        EKS Anywhere exécute des clusters Kubernetes que l'entreprise exploite dans ses propres centres de données ; ce n'est pas le plan de contrôle ECS qu'elle utilise déjà.
    c:
      en: |-
        Outposts installs new AWS-owned hardware; the company wants to use its existing factory servers.
      fr: |-
        Outposts installe un nouveau matériel appartenant à AWS ; l'entreprise veut utiliser ses serveurs d'usine existants.
    d:
      en: |-
        Fargate runs in AWS, so the data would leave the factories, which breaks the latency and data residency requirements.
      fr: |-
        Fargate s'exécute dans AWS : les données quitteraient les usines, ce qui contrevient aux exigences de latence et de résidence des données.
references:
  - title: Amazon ECS clusters for external instances - Amazon Elastic Container Service
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-anywhere.html
