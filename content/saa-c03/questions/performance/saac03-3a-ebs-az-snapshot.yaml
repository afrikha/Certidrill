id: saac03-3a-ebs-az-snapshot
objective: "3.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an application on an Amazon EC2 instance in Availability Zone A. The application data is on a 500 GiB Amazon EBS gp3 data volume. The company must move the application to a new instance in Availability Zone B in the same AWS Region and keep all the data on block storage.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application sur une instance Amazon EC2 dans la zone de disponibilité A. Les données de l'application se trouvent sur un volume de données Amazon EBS gp3 de 500 Gio. L'entreprise doit déplacer l'application vers une nouvelle instance dans la zone de disponibilité B de la même Région AWS et conserver toutes les données sur un stockage en mode bloc.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Detach the volume from the instance and attach it to the new instance in Availability Zone B.", fr: "Détacher le volume de l'instance et l'attacher à la nouvelle instance dans la zone de disponibilité B." }
    - id: b
      text: { en: "Enable Multi-Attach on the volume and attach it to both instances at the same time.", fr: "Activer Multi-Attach sur le volume et l'attacher simultanément aux deux instances." }
    - id: c
      text: { en: "Create a snapshot of the volume and restore it to a new volume in Availability Zone B.", fr: "Créer un instantané du volume et le restaurer dans un nouveau volume de la zone de disponibilité B." }
    - id: d
      text: { en: "Use Elastic Volumes to change the Availability Zone of the volume to Availability Zone B.", fr: "Utiliser Elastic Volumes pour remplacer la zone de disponibilité du volume par la zone de disponibilité B." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      An EBS volume and the instance it is attached to must be in the same Availability Zone. Snapshots are not tied to an Availability Zone, so you snapshot the volume and create a new volume from that snapshot in the target zone.
    fr: |-
      Un volume EBS et l'instance à laquelle il est attaché doivent se trouver dans la même zone de disponibilité. Les instantanés ne sont pas liés à une zone de disponibilité : on crée un instantané du volume, puis un nouveau volume à partir de cet instantané dans la zone cible.
  options:
    a:
      en: |-
        A volume can be attached only to an instance in its own Availability Zone, so it cannot be attached in zone B.
      fr: |-
        Un volume ne peut être attaché qu'à une instance de sa propre zone de disponibilité : il ne peut pas être attaché dans la zone B.
    b:
      en: |-
        Multi-Attach is supported only on io1 and io2 volumes, and only for instances in the same Availability Zone.
      fr: |-
        Multi-Attach n'est pris en charge que sur les volumes io1 et io2, et seulement pour des instances de la même zone de disponibilité.
    d:
      en: |-
        Elastic Volumes changes the size, type, IOPS and throughput of a volume; it cannot move a volume to another Availability Zone.
      fr: |-
        Elastic Volumes modifie la taille, le type, les IOPS et le débit d'un volume ; il ne peut pas déplacer un volume vers une autre zone de disponibilité.
references:
  - title: Amazon EBS volumes - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes.html
