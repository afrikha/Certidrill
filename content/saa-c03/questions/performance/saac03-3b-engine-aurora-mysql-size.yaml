id: saac03-3b-engine-aurora-mysql-size
objective: "3.3.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an open-source content platform that is certified only for MySQL 8.0. The database is expected to grow to about 100 TiB over the next three years. The company wants a managed database whose storage grows automatically, without moving to a different engine family.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une plateforme de contenu open source certifiée uniquement pour MySQL 8.0. La base de données devrait atteindre environ 100 Tio au cours des trois prochaines années. L'entreprise veut une base de données gérée dont le stockage augmente automatiquement, sans changer de famille de moteur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Amazon RDS for MySQL with storage autoscaling turned on", fr: "Amazon RDS for MySQL avec la mise à l'échelle automatique du stockage activée" } }
    - { id: b, text: { en: "Amazon Aurora PostgreSQL-Compatible Edition", fr: "Amazon Aurora PostgreSQL-Compatible Edition" } }
    - { id: c, text: { en: "Amazon Aurora MySQL-Compatible Edition", fr: "Amazon Aurora MySQL-Compatible Edition" } }
    - { id: d, text: { en: "Amazon RDS for PostgreSQL on io2 Block Express storage", fr: "Amazon RDS for PostgreSQL sur un stockage io2 Block Express" } }
answer: { optionId: c }
explanation:
  correct:
    en: Aurora MySQL is compatible with MySQL, so the platform keeps its engine family, and its cluster volume grows automatically up to 256 TiB. That covers the expected 100 TiB without storage management.
    fr: Aurora MySQL est compatible avec MySQL ; la plateforme conserve donc sa famille de moteur, et son volume de cluster augmente automatiquement jusqu'à 256 Tio. Cela couvre les 100 Tio attendus sans gestion du stockage.
  options:
    a:
      en: RDS for MySQL storage is limited to 64 TiB (65,536 GiB), below the expected 100 TiB, even with storage autoscaling.
      fr: Le stockage de RDS for MySQL est limité à 64 Tio (65 536 Gio), en dessous des 100 Tio attendus, même avec la mise à l'échelle automatique du stockage.
    b:
      en: Aurora PostgreSQL would grow large enough, but the platform is certified only for MySQL.
      fr: Aurora PostgreSQL pourrait grandir suffisamment, mais la plateforme est certifiée uniquement pour MySQL.
    d:
      en: PostgreSQL is a different engine family, and RDS storage is limited to 64 TiB.
      fr: PostgreSQL est une autre famille de moteur, et le stockage RDS est limité à 64 Tio.
references:
