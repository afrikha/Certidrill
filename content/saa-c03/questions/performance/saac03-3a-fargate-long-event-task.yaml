id: saac03-3a-fargate-long-event-task
objective: "3.2.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company analyzes each video that is uploaded to an Amazon S3 bucket. The analysis is packaged as a container image, needs 14 GB of memory and runs for 25 to 40 minutes per video. The company wants each upload to start the analysis automatically, by using serverless services only, with no servers or clusters of instances to manage.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias analyse chaque vidéo chargée dans un compartiment Amazon S3. L'analyse est empaquetée dans une image de conteneur, exige 14 Go de mémoire et dure de 25 à 40 minutes par vidéo. L'entreprise souhaite que chaque chargement lance automatiquement l'analyse, en utilisant uniquement des services sans serveur, sans serveur ni cluster d'instances à gérer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure an S3 event notification that invokes a Lambda function built from the container image with 10,240 MB of memory.", fr: "Configurer une notification d'événement S3 qui appelle une fonction Lambda créée à partir de l'image de conteneur avec 10 240 Mo de mémoire." }
    - id: b
      text: { en: "Send the bucket's events to Amazon EventBridge with a rule that runs an Amazon ECS task on AWS Fargate.", fr: "Envoyer les événements du compartiment à Amazon EventBridge avec une règle qui exécute une tâche Amazon ECS sur AWS Fargate." }
    - id: c
      text: { en: "Configure an S3 event notification that sends messages to an Amazon SQS queue polled by an Auto Scaling group of EC2 instances.", fr: "Configurer une notification d'événement S3 qui envoie des messages à une file d'attente Amazon SQS interrogée par un groupe Auto Scaling d'instances EC2." }
    - id: d
      text: { en: "Turn on Lambda SnapStart for a function that runs the analysis and invoke it from an S3 event notification.", fr: "Activer Lambda SnapStart pour une fonction qui exécute l'analyse et l'appeler depuis une notification d'événement S3." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      S3 can send events to Amazon EventBridge, and an EventBridge rule can start an ECS task on Fargate for each new object. Fargate runs the container without servers or clusters to manage and supports both the memory size and the run time, which exceed Lambda limits.
    fr: |-
      S3 peut envoyer des événements à Amazon EventBridge, et une règle EventBridge peut démarrer une tâche ECS sur Fargate pour chaque nouvel objet. Fargate exécute le conteneur sans serveur ni cluster à gérer et prend en charge à la fois la taille mémoire et la durée d'exécution, qui dépassent les limites de Lambda.
  options:
    a:
      en: |-
        Lambda memory is limited to 10,240 MB and a standard invocation to 900 seconds, below the 14 GB and 25 to 40 minutes the analysis needs.
      fr: |-
        La mémoire Lambda est limitée à 10 240 Mo et une invocation standard à 900 secondes, en dessous des 14 Go et des 25 à 40 minutes nécessaires à l'analyse.
    c:
      en: |-
        This works, but the company would manage EC2 instances, which the requirement excludes.
      fr: |-
        Cela fonctionne, mais l'entreprise devrait gérer des instances EC2, ce que l'exigence exclut.
    d:
      en: |-
        SnapStart only reduces startup latency; it does not raise the Lambda memory and timeout limits.
      fr: |-
        SnapStart réduit seulement la latence de démarrage ; il n'augmente pas les limites de mémoire et de délai d'expiration de Lambda.
references:
  - title: Lambda quotas - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: Amazon S3 Event Notifications - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html
