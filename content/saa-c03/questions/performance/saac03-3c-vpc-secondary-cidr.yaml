id: saac03-3c-vpc-secondary-cidr
objective: "3.4.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs a web application on Amazon EC2 instances in an Auto Scaling group. The instances use two subnets in a VPC whose only CIDR block is 10.0.0.0/24, and the whole block is already allocated to those subnets. During peak events, the Auto Scaling group fails to launch instances because the subnets have no free IP addresses. The company expects traffic to triple next year.

    The company needs to let the Auto Scaling group scale out with the LEAST disruption to the running application, without migrating it to another VPC.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.
  fr: |
    Une entreprise exécute une application web sur des instances Amazon EC2 dans un Auto Scaling group. Les instances utilisent deux sous-réseaux d'un VPC dont le seul bloc d'adresse CIDR est 10.0.0.0/24, entièrement attribué à ces sous-réseaux. Lors des pics d'activité, l'Auto Scaling group ne parvient pas à lancer d'instances, car les sous-réseaux n'ont plus d'adresses IP libres. L'entreprise prévoit que le trafic triplera l'an prochain.

    L'entreprise doit permettre à l'Auto Scaling group d'augmenter sa capacité en perturbant le MOINS possible l'application en cours d'exécution, sans la migrer vers un autre VPC.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the primary CIDR block of the VPC from 10.0.0.0/24 to 10.0.0.0/16.", fr: "Modifier le bloc d'adresse CIDR principal du VPC de 10.0.0.0/24 en 10.0.0.0/16." } }
    - { id: b, text: { en: "Associate a secondary IPv4 CIDR block, such as 10.1.0.0/16, with the existing VPC.", fr: "Associer un bloc d'adresse CIDR IPv4 secondaire, par exemple 10.1.0.0/16, au VPC existant." } }
    - { id: c, text: { en: "Attach a second elastic network interface to each instance to give it additional IP addresses.", fr: "Attacher une deuxième interface réseau Elastic à chaque instance pour lui donner des adresses IP supplémentaires." } }
    - { id: d, text: { en: "Create a new VPC with a /16 CIDR block, peer it with the existing VPC, and move the Auto Scaling group.", fr: "Créer un nouveau VPC avec un bloc d'adresse CIDR /16, l'appairer au VPC existant et y déplacer l'Auto Scaling group." } }
    - { id: e, text: { en: "Create new subnets from the added CIDR block in each Availability Zone and add them to the Auto Scaling group.", fr: "Créer de nouveaux sous-réseaux à partir du bloc d'adresse CIDR ajouté dans chaque zone de disponibilité et les ajouter à l'Auto Scaling group." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: You can add secondary IPv4 CIDR blocks (from /28 to /16) to an existing VPC at any time, as long as they do not overlap the blocks already associated. New subnets carved from that block in each Availability Zone can then be added to the Auto Scaling group, which launches instances in them without touching the running instances.
    fr: "Vous pouvez à tout moment ajouter des blocs d'adresse CIDR IPv4 secondaires (de /28 à /16) à un VPC existant, à condition qu'ils ne chevauchent pas les blocs déjà associés. De nouveaux sous-réseaux créés à partir de ce bloc dans chaque zone de disponibilité peuvent ensuite être ajoutés à l'Auto Scaling group, qui y lance des instances sans toucher aux instances en cours d'exécution."
  options:
    a: { en: "You cannot resize a CIDR block that is already associated with a VPC, and the primary block cannot be removed.", fr: "Vous ne pouvez pas redimensionner un bloc d'adresse CIDR déjà associé à un VPC, et le bloc principal ne peut pas être dissocié." }
    c: { en: "Each additional network interface takes more addresses from the same exhausted subnets; it does not add address space.", fr: "Chaque interface réseau supplémentaire consomme d'autres adresses des mêmes sous-réseaux saturés ; elle n'ajoute aucun espace d'adressage." }
    d: { en: "A new VPC means migrating the application, which the requirements exclude and which causes more disruption.", fr: "Un nouveau VPC impose de migrer l'application, ce que les exigences excluent et qui perturbe davantage le service." }
references:
  - title: VPC CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/vpc-cidr-blocks.html
  - title: Subnet CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html
