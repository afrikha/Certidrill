id: saac03-3b-cloudfront-functions
objective: "3.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A media company serves a popular website through Amazon CloudFront at millions of requests per second. The company must normalize the case of query string values to improve the cache hit ratio and rewrite some URL paths for an A/B test. The logic is a few lines of code, does not call any network service, and must add as little latency and cost as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias sert un site web très fréquenté via Amazon CloudFront à des millions de requêtes par seconde. L'entreprise doit normaliser la casse des valeurs de chaînes de requête pour améliorer le taux d'accès au cache et réécrire certains chemins d'URL pour un test A/B. La logique tient en quelques lignes de code, n'appelle aucun service réseau et doit ajouter le moins de latence et de coût possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A Lambda@Edge function associated with the origin request event of the cache behavior", fr: "Une fonction Lambda@Edge associée à l'événement de requête d'origine du comportement de cache" }
    - id: b
      text: { en: "A Lambda function behind Amazon API Gateway placed between CloudFront and the origin", fr: "Une fonction Lambda derrière Amazon API Gateway placée entre CloudFront et l'origine" }
    - id: c
      text: { en: "A CloudFront Functions function associated with the viewer request event of the cache behavior", fr: "Une fonction CloudFront Functions associée à l'événement de requête de l'utilisateur du comportement de cache" }
    - id: d
      text: { en: "An AWS WAF web ACL with rules that match the query strings, associated with the distribution", fr: "Une liste ACL web AWS WAF avec des règles qui correspondent aux chaînes de requête, associée à la distribution" }
answer: { optionId: c }
explanation:
  correct:
    en: CloudFront Functions runs lightweight JavaScript at the edge on viewer request and viewer response events, scales to millions of requests per second and runs in under a millisecond. Cache key normalization and URL rewrites are its typical use cases, and running on the viewer request lets the normalized key be used for the cache lookup.
    fr: CloudFront Functions exécute du JavaScript léger en périphérie sur les événements de requête et de réponse de l'utilisateur, évolue jusqu'à des millions de requêtes par seconde et s'exécute en moins d'une milliseconde. La normalisation de la clé de cache et la réécriture d'URL sont ses cas d'utilisation types, et l'exécution sur la requête de l'utilisateur permet d'utiliser la clé normalisée pour la recherche dans le cache.
  options:
    a:
      en: Lambda@Edge suits heavier logic that needs network or body access; it scales to about 10,000 requests per second per Region and adds more latency and cost, and origin requests happen after the cache lookup.
      fr: Lambda@Edge convient à une logique plus lourde qui a besoin d'un accès réseau ou au corps des requêtes ; il évolue jusqu'à environ 10 000 requêtes par seconde par Région et ajoute plus de latence et de coût, et les requêtes d'origine interviennent après la recherche dans le cache.
    b:
      en: An extra API Gateway and Lambda hop runs in one Region after the cache, which adds latency and cost and does not change the cache key.
      fr: Un saut supplémentaire API Gateway et Lambda s'exécute dans une seule Région après le cache, ce qui ajoute latence et coût et ne modifie pas la clé de cache.
    d:
      en: AWS WAF allows, blocks or counts requests; it does not normalize query strings or rewrite URLs for caching.
      fr: AWS WAF autorise, bloque ou compte les requêtes ; il ne normalise pas les chaînes de requête et ne réécrit pas les URL pour la mise en cache.
references:
  - title: Differences between CloudFront Functions and Lambda@Edge
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
