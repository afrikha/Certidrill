id: saac03-3a-st1-sequential-logs
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a log processing application on an Amazon EC2 instance. Every day the application reads and writes about 10 TiB of large log files sequentially and needs about 400 MiB/s of throughput from a single Amazon EBS volume. Random I/O performance is not important.

    Which EBS volume type will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exécute une application de traitement de journaux sur une instance Amazon EC2. Chaque jour, l'application lit et écrit séquentiellement environ 10 Tio de gros fichiers journaux et a besoin d'un débit d'environ 400 Mio/s depuis un seul volume Amazon EBS. Les performances des E/S aléatoires ne sont pas importantes.

    Quel type de volume EBS répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Cold HDD (sc1)", fr: "HDD à froid (sc1)" }
    - id: b
      text: { en: "General Purpose SSD (gp3)", fr: "SSD à usage général (gp3)" }
    - id: c
      text: { en: "Throughput Optimized HDD (st1)", fr: "HDD à débit optimisé (st1)" }
    - id: d
      text: { en: "Provisioned IOPS SSD (io2)", fr: "SSD à IOPS provisionnées (io2)" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      st1 is a low-cost HDD volume designed for frequently accessed, throughput-intensive sequential workloads such as log processing and big data, with up to 500 MiB/s per volume. It covers the 400 MiB/s requirement at a lower price per GiB than the SSD types.
    fr: |-
      st1 est un volume HDD peu coûteux conçu pour les charges séquentielles fréquemment consultées et gourmandes en débit, comme le traitement de journaux et le big data, avec jusqu'à 500 Mio/s par volume. Il couvre le besoin de 400 Mio/s à un prix au Gio inférieur à celui des types SSD.
  options:
    a:
      en: |-
        sc1 is cheaper, but it is meant for infrequently accessed data and is limited to 250 MiB/s per volume, below the requirement.
      fr: |-
        sc1 est moins cher, mais il est destiné aux données rarement consultées et limité à 250 Mio/s par volume, en dessous du besoin.
    b:
      en: |-
        gp3 can deliver the throughput, but SSD storage costs more per GiB than st1 for 10 TiB of sequentially accessed data.
      fr: |-
        gp3 peut fournir ce débit, mais le stockage SSD coûte plus cher au Gio que st1 pour 10 Tio de données lues séquentiellement.
    d:
      en: |-
        io2 is built for IOPS-intensive, latency-sensitive workloads and is the most expensive option; random I/O performance is not needed here.
      fr: |-
        io2 est conçu pour les charges intensives en IOPS et sensibles à la latence et c'est l'option la plus coûteuse ; les performances en E/S aléatoires ne sont pas nécessaires ici.
references:
  - title: Amazon EBS volume types - Amazon EBS
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
