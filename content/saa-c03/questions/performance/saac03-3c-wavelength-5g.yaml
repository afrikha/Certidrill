id: saac03-3c-wavelength-5g
objective: "3.4.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A gaming company is building an augmented reality game for players who connect from mobile devices over a telecommunications carrier's 5G network in several cities. The game servers must provide the lowest possible latency to the mobile devices, and traffic from the devices to the game servers must not leave the carrier's network.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo développe un jeu en réalité augmentée destiné à des joueurs qui se connectent depuis des appareils mobiles via le réseau 5G d'un opérateur de télécommunications dans plusieurs villes. Les serveurs de jeu doivent offrir la latence la plus faible possible aux appareils mobiles, et le trafic des appareils vers les serveurs de jeu ne doit pas quitter le réseau de l'opérateur.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy the game servers in AWS Local Zones near each city and expose them through public IP addresses.", fr: "Déployer les serveurs de jeu dans des AWS Local Zones proches de chaque ville et les exposer via des adresses IP publiques." } }
    - { id: b, text: { en: "Deploy the game servers in the parent Region and place an Amazon CloudFront distribution in front of them.", fr: "Déployer les serveurs de jeu dans la Région parente et placer une distribution Amazon CloudFront devant eux." } }
    - { id: c, text: { en: "Deploy the game servers on AWS Outposts racks installed in the company's offices in each city.", fr: "Déployer les serveurs de jeu sur des racks AWS Outposts installés dans les bureaux de l'entreprise dans chaque ville." } }
    - { id: d, text: { en: "Deploy the game servers in the carrier's AWS Wavelength Zones and route device traffic through a carrier gateway.", fr: "Déployer les serveurs de jeu dans les AWS Wavelength Zones de l'opérateur et acheminer le trafic des appareils via une passerelle d'opérateur (carrier gateway)." } }
answer: { optionId: d }
explanation:
  correct:
    en: Wavelength Zones are AWS infrastructure deployed inside the carrier's data centers at the edge of the 5G network. A carrier gateway lets traffic from the carrier network reach instances in the Wavelength Zone directly, so mobile traffic stays inside the carrier network and latency is minimal.
    fr: "Les Wavelength Zones sont une infrastructure AWS déployée dans les centres de données de l'opérateur, en périphérie du réseau 5G. Une passerelle d'opérateur permet au trafic du réseau de l'opérateur d'atteindre directement les instances de la Wavelength Zone : le trafic mobile reste dans le réseau de l'opérateur et la latence est minimale."
  options:
    a: { en: "Local Zones bring AWS close to large population centers, but they are not inside the carrier network: device traffic would leave it to reach them.", fr: "Les Local Zones rapprochent AWS des grands centres de population, mais elles ne sont pas dans le réseau de l'opérateur : le trafic des appareils devrait en sortir pour les atteindre." }
    b: { en: "CloudFront caches and accelerates HTTP content at edge locations; interactive game traffic would still travel to the Region outside the carrier network.", fr: "CloudFront met en cache et accélère le contenu HTTP dans les emplacements périphériques ; le trafic de jeu interactif irait toujours jusqu'à la Région, hors du réseau de l'opérateur." }
    c: { en: "Outposts run AWS infrastructure in the customer's own facilities, not in the carrier network, so device traffic would still leave the carrier network.", fr: "Outposts exécute l'infrastructure AWS dans les locaux du client, pas dans le réseau de l'opérateur : le trafic des appareils quitterait toujours le réseau de l'opérateur." }
references:
  - title: What is AWS Wavelength?
    url: https://docs.aws.amazon.com/wavelength/latest/developerguide/what-is-wavelength.html
  - title: What is AWS Local Zones?
    url: https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html
