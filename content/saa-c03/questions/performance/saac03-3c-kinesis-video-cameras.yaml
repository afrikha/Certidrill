id: saac03-3c-kinesis-video-cameras
objective: "3.5.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A public transport company wants to stream live video from 2,000 cameras installed in its buses to AWS. The video must be stored for 7 days, played back on demand, and analyzed frame by frame by machine learning applications.

    Which AWS service should the company use to ingest the video?
  fr: |
    Une entreprise de transport public souhaite diffuser vers AWS la vidéo en direct de 2 000 caméras installées dans ses bus. La vidéo doit être stockée 7 jours, relue à la demande et analysée image par image par des applications de machine learning.

    Quel service AWS l'entreprise doit-elle utiliser pour ingérer la vidéo ?
body:
  options:
    - { id: a, text: "Amazon Kinesis Data Streams" }
    - { id: b, text: "Amazon Data Firehose" }
    - { id: c, text: "Amazon Kinesis Video Streams" }
    - { id: d, text: "Amazon Managed Streaming for Apache Kafka (Amazon MSK)" }
answer: { optionId: c }
explanation:
  correct:
    en: Amazon Kinesis Video Streams is a fully managed service for streaming live video from millions of devices such as cameras. It stores media durably for a configured retention period, indexes it by time, and lets applications access the data frame by frame for real-time or batch analysis.
    fr: "Amazon Kinesis Video Streams est un service entièrement géré qui diffuse la vidéo en direct de millions d'appareils comme des caméras. Il stocke les médias de façon durable pendant une période de conservation configurée, les indexe dans le temps et permet aux applications d'accéder aux données image par image pour une analyse en temps réel ou par lots."
  options:
    a: { en: "Kinesis Data Streams handles generic data records; it has no media storage, time indexing or playback for video.", fr: "Kinesis Data Streams traite des enregistrements de données génériques ; il n'offre ni stockage de médias, ni indexation temporelle, ni lecture vidéo." }
    b: { en: "Firehose buffers and delivers records to destinations such as S3; it does not ingest live video for frame-by-frame processing or playback.", fr: "Firehose met en mémoire tampon et livre des enregistrements à des destinations comme S3 ; il n'ingère pas de vidéo en direct pour un traitement image par image ou une relecture." }
    d: { en: "Amazon MSK runs Apache Kafka for event streaming; it provides no video-specific ingestion, storage or playback.", fr: "Amazon MSK exécute Apache Kafka pour le streaming d'événements ; il ne fournit ni ingestion, ni stockage, ni lecture propres à la vidéo." }
references:
  - title: What is Amazon Kinesis Video Streams?
    url: https://docs.aws.amazon.com/kinesisvideostreams/latest/dg/what-is-kinesis-video.html
