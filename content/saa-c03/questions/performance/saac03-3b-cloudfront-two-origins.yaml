id: saac03-3b-cloudfront-two-origins
objective: "3.4.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A travel company hosts its website in a single AWS Region. Images, CSS and JavaScript files are in an Amazon S3 bucket, and dynamic pages are served by an Application Load Balancer. Users around the world report slow page loads. The company wants to reduce latency for all users and offload requests from the origins with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de voyages héberge son site web dans une seule Région AWS. Les images et les fichiers CSS et JavaScript se trouvent dans un compartiment Amazon S3, et les pages dynamiques sont servies par un Application Load Balancer. Des utilisateurs du monde entier signalent des chargements de pages lents. L'entreprise veut réduire la latence pour tous les utilisateurs et décharger les origines avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a CloudFront distribution with the S3 bucket and the ALB as origins, and a cache behavior for each path pattern.", fr: "Créer une distribution CloudFront avec le compartiment S3 et l'ALB comme origines, et un comportement de cache pour chaque modèle de chemin." }
    - id: b
      text: { en: "Create an AWS Global Accelerator accelerator with the S3 bucket and the ALB as endpoints in one endpoint group.", fr: "Créer un accélérateur AWS Global Accelerator avec le compartiment S3 et l'ALB comme points de terminaison dans un groupe de points de terminaison." }
    - id: c
      text: { en: "Enable S3 Transfer Acceleration on the bucket and point the website to the accelerated endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et faire pointer le site web vers le point de terminaison accéléré." }
    - id: d
      text: { en: "Deploy copies of the website in four Regions and use Route 53 latency-based routing between them.", fr: "Déployer des copies du site web dans quatre Régions et utiliser le routage Route 53 basé sur la latence entre elles." }
answer: { optionId: a }
explanation:
  correct:
    en: CloudFront serves static and dynamic content from edge locations, routes each request to the edge location with the lowest latency, and caches objects there. Requests that reach the origins travel over the AWS backbone, and cache behaviors send each path pattern to the right origin, the S3 bucket or the ALB.
    fr: CloudFront sert du contenu statique et dynamique depuis des emplacements périphériques, achemine chaque requête vers l'emplacement de plus faible latence et y met les objets en cache. Les requêtes qui atteignent les origines passent par le réseau principal AWS, et les comportements de cache envoient chaque modèle de chemin vers la bonne origine, le compartiment S3 ou l'ALB.
  options:
    b:
      en: Global Accelerator does not cache content, and an S3 bucket is not a supported endpoint type (ALB, NLB, EC2 instance, Elastic IP address).
      fr: Global Accelerator ne met pas de contenu en cache, et un compartiment S3 n'est pas un type de point de terminaison pris en charge (ALB, NLB, instance EC2, adresse IP Elastic).
    c:
      en: Transfer Acceleration speeds up transfers to and from the bucket but provides no caching and does nothing for the dynamic pages.
      fr: Transfer Acceleration accélère les transferts vers et depuis le compartiment mais n'offre aucune mise en cache et n'aide pas les pages dynamiques.
    d:
      en: Running four copies of the stack adds deployment, data synchronization and cost, which is far from the least operational overhead.
      fr: Exécuter quatre copies de la pile ajoute du déploiement, de la synchronisation de données et des coûts, ce qui est loin de la plus faible charge opérationnelle.
references:
  - title: What is Amazon CloudFront?
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html
