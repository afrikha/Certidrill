id: saac03-3a-sqs-backlog-per-instance
objective: "3.2.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Worker instances in an Auto Scaling group process messages from an Amazon SQS queue. Each message takes an average of 2 seconds to process, and the company accepts a maximum latency of 60 seconds for a message. The current target tracking policy uses the number of visible messages in the queue as its metric, and the group adds far more instances than needed while the queue drains.

    How should the company configure scaling?
  fr: |
    Des instances de traitement d'un groupe Auto Scaling traitent les messages d'une file d'attente Amazon SQS. Chaque message demande en moyenne 2 secondes de traitement, et l'entreprise accepte une latence maximale de 60 secondes par message. La stratégie de suivi de la cible actuelle utilise comme métrique le nombre de messages visibles dans la file, et le groupe ajoute bien plus d'instances que nécessaire pendant que la file se vide.

    Comment l'entreprise doit-elle configurer la mise à l'échelle ?
body:
  options:
    - id: a
      text: { en: "Use a target tracking policy on the backlog per instance (visible messages divided by InService instances) with a target value of 30.", fr: "Utiliser une stratégie de suivi de la cible sur l'arriéré par instance (messages visibles divisés par le nombre d'instances InService) avec une valeur cible de 30." }
    - id: b
      text: { en: "Use a target tracking policy on the backlog per instance (visible messages divided by InService instances) with a target value of 120.", fr: "Utiliser une stratégie de suivi de la cible sur l'arriéré par instance (messages visibles divisés par le nombre d'instances InService) avec une valeur cible de 120." }
    - id: c
      text: { en: "Keep the target tracking policy on the number of visible messages and set its target value to 30.", fr: "Conserver la stratégie de suivi de la cible sur le nombre de messages visibles et régler sa valeur cible à 30." }
    - id: d
      text: { en: "Replace the policy with a target tracking policy on ASGAverageCPUUtilization with a target value of 70.", fr: "Remplacer la stratégie par une stratégie de suivi de la cible sur ASGAverageCPUUtilization avec une valeur cible de 70." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      AWS recommends scaling an SQS worker fleet on backlog per instance, which accounts for how many instances share the work. The target is the acceptable backlog per instance, which is the acceptable latency divided by the average processing time, here 60 / 2 = 30 messages. Metric math can compute the backlog without publishing a custom metric.
    fr: |-
      AWS recommande de mettre à l'échelle un parc de traitement SQS selon l'arriéré par instance, qui tient compte du nombre d'instances qui se partagent le travail. La cible est l'arriéré acceptable par instance, soit la latence acceptable divisée par la durée moyenne de traitement, ici 60 / 2 = 30 messages. Les calculs de métriques (metric math) permettent de calculer l'arriéré sans publier de métrique personnalisée.
  options:
    b:
      en: |-
        The right metric, but 120 comes from multiplying latency by processing time; each instance would hold 4 minutes of work, beyond the 60-second latency.
      fr: |-
        La métrique est la bonne, mais 120 provient de la multiplication de la latence par la durée de traitement ; chaque instance aurait 4 minutes de travail, au-delà de la latence de 60 secondes.
    c:
      en: |-
        The queue length does not change in proportion to the number of instances, which is why the group over-provisions; changing the target value does not fix that.
      fr: |-
        La longueur de la file ne varie pas proportionnellement au nombre d'instances, d'où le surprovisionnement ; modifier la valeur cible n'y remédie pas.
    d:
      en: |-
        CPU utilization does not show how much work is waiting in the queue, so it does not keep message latency under 60 seconds.
      fr: |-
        L'utilisation du processeur n'indique pas la quantité de travail en attente dans la file : elle ne maintient pas la latence des messages sous 60 secondes.
references:
  - title: Scaling policy based on Amazon SQS - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
