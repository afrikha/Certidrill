id: saac03-3c-athena-ctas-one-time
objective: "3.5.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has 5 TB of historical sales data in CSV files in Amazon S3. The data is cataloged as a table in the AWS Glue Data Catalog and covers the years 2016 to 2025. The company needs a one-time conversion of the data to Apache Parquet, partitioned by year, for Amazon Athena. The team knows SQL and does not want to provision or manage any infrastructure or write ETL code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de 5 To de données de ventes historiques dans des fichiers CSV dans Amazon S3. Les données sont cataloguées sous forme de table dans AWS Glue Data Catalog et couvrent les années 2016 à 2025. L'entreprise a besoin d'une conversion ponctuelle des données en Apache Parquet, partitionnées par année, pour Amazon Athena. L'équipe connaît SQL et ne veut ni provisionner ni gérer d'infrastructure, ni écrire de code ETL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Launch an Amazon EMR cluster with Apache Spark, convert the files, and terminate the cluster.", fr: "Lancer un cluster Amazon EMR avec Apache Spark, convertir les fichiers, puis arrêter le cluster." } }
    - { id: b, text: { en: "Run an Amazon Athena CREATE TABLE AS SELECT (CTAS) query with the Parquet format and the year as the partition column.", fr: "Exécuter une requête Amazon Athena CREATE TABLE AS SELECT (CTAS) avec le format Parquet et l'année comme colonne de partition." } }
    - { id: c, text: { en: "Create an S3 Batch Operations job that copies each CSV object to a new object in Parquet format.", fr: "Créer une tâche S3 Batch Operations qui copie chaque objet CSV vers un nouvel objet au format Parquet." } }
    - { id: d, text: { en: "Replay the CSV files through an Amazon Data Firehose stream with record format conversion to Parquet.", fr: "Renvoyer les fichiers CSV dans un flux Amazon Data Firehose avec conversion du format des enregistrements vers Parquet." } }
answer: { optionId: b }
explanation:
  correct:
    en: An Athena CTAS query creates a new table from the results of a SELECT and writes the data to S3 in a columnar format such as Parquet, optionally partitioned. It is serverless SQL, and ten yearly partitions stay well within the partition limit of a single CTAS query.
    fr: "Une requête CTAS Athena crée une nouvelle table à partir des résultats d'un SELECT et écrit les données dans S3 dans un format en colonnes comme Parquet, éventuellement partitionné. C'est du SQL sans serveur, et dix partitions annuelles restent largement sous la limite de partitions d'une seule requête CTAS."
  options:
    a: { en: "EMR works but is infrastructure to provision and Spark code to write, which the team wants to avoid.", fr: "EMR fonctionne, mais c'est une infrastructure à provisionner et du code Spark à écrire, ce que l'équipe veut éviter." }
    c: { en: "Batch Operations copies objects or invokes code on them; copying does not change the file format without a custom Lambda function.", fr: "Batch Operations copie des objets ou appelle du code sur ceux-ci ; une copie ne change pas le format des fichiers sans fonction Lambda personnalisée." }
    d: { en: "Firehose format conversion accepts only JSON input, so CSV data would first need a transformation function, and replaying 5 TB adds a pipeline to build.", fr: "La conversion de format de Firehose n'accepte que des données JSON : le CSV exigerait d'abord une fonction de transformation, et renvoyer 5 To ajoute un pipeline à construire." }
references:
  - title: Create a table from query results (CTAS)
    url: https://docs.aws.amazon.com/athena/latest/ug/ctas.html
  - title: Use columnar storage formats
    url: https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html
