id: saac03-3b-ddb-rcu-strong
objective: "3.3.4"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A company is designing an Amazon DynamoDB table in provisioned capacity mode. Each item is 6 KB. The application must perform 120 strongly consistent reads of single items per second at peak.

    How many read capacity units (RCUs) must the company provision to meet this requirement?
  fr: |
    Une entreprise conçoit une table Amazon DynamoDB en mode de capacité provisionnée. Chaque élément fait 6 Ko. L'application doit effectuer 120 lectures fortement cohérentes d'éléments individuels par seconde en période de pointe.

    Combien d'unités de capacité de lecture (RCU) l'entreprise doit-elle provisionner pour répondre à cette exigence ?
body:
  options:
    - { id: a, text: "120" }
    - { id: b, text: "180" }
    - { id: c, text: "240" }
    - { id: d, text: "360" }
answer: { optionId: c }
explanation:
  correct:
    en: One RCU provides one strongly consistent read per second for an item up to 4 KB, and item sizes are rounded up to the next 4 KB. A 6 KB item therefore needs 2 RCUs per strongly consistent read, and 120 reads per second need 2 × 120 = 240 RCUs.
    fr: Une RCU fournit une lecture fortement cohérente par seconde pour un élément de 4 Ko au plus, et la taille de l'élément est arrondie au multiple de 4 Ko supérieur. Un élément de 6 Ko nécessite donc 2 RCU par lecture fortement cohérente, et 120 lectures par seconde nécessitent 2 × 120 = 240 RCU.
  options:
    a:
      en: 120 RCUs would be enough only for eventually consistent reads, which use half the capacity of strongly consistent reads.
      fr: 120 RCU suffiraient seulement pour des lectures à cohérence éventuelle, qui consomment moitié moins de capacité que les lectures fortement cohérentes.
    b:
      en: 180 divides the total size by 4 KB without rounding each item up; DynamoDB rounds every item up to the next 4 KB.
      fr: 180 divise la taille totale par 4 Ko sans arrondir chaque élément ; DynamoDB arrondit chaque élément au multiple de 4 Ko supérieur.
    d:
      en: 360 counts 3 RCUs per read, as if items were rounded to 12 KB; a 6 KB item needs only 2 RCUs per strongly consistent read.
      fr: 360 compte 3 RCU par lecture, comme si les éléments étaient arrondis à 12 Ko ; un élément de 6 Ko ne nécessite que 2 RCU par lecture fortement cohérente.
references:
  - title: DynamoDB provisioned capacity mode
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/provisioned-capacity-mode.html
