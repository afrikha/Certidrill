id: saac03-3b-ddb-on-demand-launch
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A startup is launching a mobile app that stores user data in Amazon DynamoDB. The company cannot predict the traffic, which might be very low for weeks and then spike suddenly after marketing campaigns. The team does not want to plan or manage table capacity and wants to pay only for the requests that the app makes.

    Which solution will meet these requirements?
  fr: |
    Une start-up lance une application mobile qui stocke les données des utilisateurs dans Amazon DynamoDB. L'entreprise ne peut pas prévoir le trafic, qui pourrait rester très faible pendant des semaines puis augmenter brusquement après des campagnes marketing. L'équipe ne veut ni planifier ni gérer la capacité des tables et veut payer uniquement pour les requêtes effectuées par l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use provisioned capacity mode with auto scaling between a minimum and a maximum number of capacity units.", fr: "Utiliser le mode de capacité provisionnée avec la mise à l'échelle automatique entre un nombre minimal et maximal d'unités de capacité." }
    - id: b
      text: { en: "Use on-demand capacity mode so that the table scales with traffic and is billed per read and write request.", fr: "Utiliser le mode de capacité à la demande afin que la table évolue avec le trafic et soit facturée par requête de lecture et d'écriture." }
    - id: c
      text: { en: "Use provisioned capacity mode and purchase reserved capacity sized for the expected peak traffic.", fr: "Utiliser le mode de capacité provisionnée et acheter de la capacité réservée dimensionnée pour le pic de trafic attendu." }
    - id: d
      text: { en: "Use provisioned capacity mode with low capacity and add a DynamoDB Accelerator (DAX) cluster to absorb the spikes.", fr: "Utiliser le mode de capacité provisionnée avec une faible capacité et ajouter un cluster DynamoDB Accelerator (DAX) pour absorber les pics." }
answer: { optionId: b }
explanation:
  correct:
    en: On-demand mode is the default, serverless throughput option. It charges per request, costs nothing for throughput when there is no traffic, and needs no capacity planning, which suits unpredictable applications that start small.
    fr: Le mode à la demande est l'option de débit par défaut, sans serveur. Il facture chaque requête, ne coûte rien en débit en l'absence de trafic et ne demande aucune planification de capacité, ce qui convient aux applications imprévisibles qui démarrent petit.
  options:
    a:
      en: Auto scaling still requires choosing minimum, maximum and target values, and the minimum capacity is billed even when the app is idle.
      fr: La mise à l'échelle automatique exige toujours de choisir des valeurs minimale, maximale et cible, et la capacité minimale est facturée même lorsque l'application est inactive.
    c:
      en: Reserved capacity is a commitment for steady, predictable usage, which contradicts both the unknown traffic and the pay-per-request requirement.
      fr: La capacité réservée est un engagement pour une utilisation stable et prévisible, ce qui contredit à la fois le trafic inconnu et l'exigence de paiement à la requête.
    d:
      en: DAX caches reads only; write spikes are still throttled by low provisioned capacity, and the cluster adds infrastructure to manage.
      fr: DAX ne met en cache que les lectures ; les pics d'écriture restent limités par la faible capacité provisionnée, et le cluster ajoute de l'infrastructure à gérer.
references:
  - title: DynamoDB on-demand capacity mode
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/on-demand-capacity-mode.html
