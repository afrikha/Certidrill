id: saac03-3b-cache-engine-leaderboard
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company needs an in-memory store for a real-time leaderboard that ranks millions of players by score. The data structure must keep players sorted by score natively. The cache must replicate data and fail over automatically if the primary node or its Availability Zone fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de jeux vidéo a besoin d'un magasin en mémoire pour un classement en temps réel qui ordonne des millions de joueurs selon leur score. La structure de données doit maintenir nativement les joueurs triés par score. Le cache doit répliquer les données et basculer automatiquement si le nœud principal ou sa zone de disponibilité tombe en panne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon ElastiCache for Valkey with sorted sets, a replica in another Availability Zone and Multi-AZ enabled", fr: "Amazon ElastiCache for Valkey avec des ensembles triés (sorted sets), un réplica dans une autre zone de disponibilité et Multi-AZ activé" }
    - id: b
      text: { en: "Amazon ElastiCache for Memcached with several nodes spread across two Availability Zones", fr: "Amazon ElastiCache for Memcached avec plusieurs nœuds répartis sur deux zones de disponibilité" }
    - id: c
      text: { en: "DynamoDB Accelerator (DAX) in front of a DynamoDB table that stores the scores", fr: "DynamoDB Accelerator (DAX) devant une table DynamoDB qui stocke les scores" }
    - id: d
      text: { en: "Amazon API Gateway caching on the stage that serves the leaderboard API", fr: "La mise en cache Amazon API Gateway sur l'étape qui sert l'API du classement" }
answer: { optionId: a }
explanation:
  correct:
    en: Valkey (and Redis OSS) in ElastiCache supports complex data types such as sorted sets, which keep members ordered by score. It also supports replication and Multi-AZ with automatic failover, which Memcached does not.
    fr: Valkey (comme Redis OSS) dans ElastiCache prend en charge des types de données complexes tels que les ensembles triés, qui maintiennent les membres ordonnés par score. Il prend aussi en charge la réplication et Multi-AZ avec basculement automatique, ce que Memcached ne fait pas.
  options:
    b:
      en: Memcached supports only simple data types and has no replication or automatic failover, so a failed node loses its data.
      fr: Memcached ne prend en charge que des types de données simples et n'offre ni réplication ni basculement automatique ; un nœud en panne perd donc ses données.
    c:
      en: DAX caches DynamoDB reads; it offers no sorted-set structure to rank players, so the ranking logic would have to be built in the application.
      fr: DAX met en cache les lectures DynamoDB ; il n'offre pas de structure d'ensemble trié pour classer les joueurs, et la logique de classement devrait être construite dans l'application.
    d:
      en: API Gateway caching stores whole API responses for a TTL; it is not a data store that maintains a sorted ranking.
      fr: La mise en cache API Gateway stocke des réponses d'API complètes pendant une TTL ; ce n'est pas un magasin de données qui maintient un classement trié.
references:
  - title: Comparing node-based Valkey, Memcached, and Redis OSS clusters
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/SelectEngine.html
