id: saac03-3c-quicksight-embedded
objective: "3.5.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software-as-a-service (SaaS) company wants to show interactive analytics dashboards inside its web application to thousands of external customers. The customers sign in to the application with its own login and do not have AWS accounts or BI tool licenses. The company does not want to build a charting front end or run visualization servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logiciel en tant que service (SaaS) souhaite afficher des tableaux de bord analytiques interactifs dans son application web pour des milliers de clients externes. Les clients se connectent à l'application avec son propre système d'authentification et n'ont ni compte AWS ni licence d'outil BI. L'entreprise ne veut ni développer une interface de graphiques ni exploiter de serveurs de visualisation.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create an Amazon Managed Grafana workspace and give each customer a user account in the workspace.", fr: "Créer un espace de travail Amazon Managed Grafana et donner à chaque client un compte utilisateur dans l'espace de travail." } }
    - { id: b, text: { en: "Run open-source charting libraries in containers on Amazon ECS and build the dashboards in the application code.", fr: "Exécuter des bibliothèques de graphiques open source dans des conteneurs sur Amazon ECS et créer les tableaux de bord dans le code de l'application." } }
    - { id: c, text: { en: "Embed AWS Quick Sight dashboards in the application and generate embed URLs for anonymous users with the embedding API.", fr: "Intégrer des tableaux de bord AWS Quick Sight dans l'application et générer des URL d'intégration pour utilisateurs anonymes avec l'API d'intégration." } }
    - { id: d, text: { en: "Create an IAM user for each customer and share Amazon CloudWatch dashboards with those users.", fr: "Créer un utilisateur IAM pour chaque client et partager des tableaux de bord Amazon CloudWatch avec ces utilisateurs." } }
answer: { optionId: c }
explanation:
  correct:
    en: Quick Sight embedded analytics (Enterprise edition) adds dashboards and visuals to an application, styled to match it. Anonymous, unauthenticated visitors can view embedded dashboards through URLs generated with GenerateEmbedUrlForAnonymousUser, so customers need no AWS identity and the company builds no charting layer.
    fr: "L'analytique intégrée de Quick Sight (édition Enterprise) ajoute des tableaux de bord et des visuels à une application, avec un style adapté à celle-ci. Des visiteurs anonymes non authentifiés peuvent consulter les tableaux de bord intégrés via des URL générées avec GenerateEmbedUrlForAnonymousUser : les clients n'ont besoin d'aucune identité AWS et l'entreprise ne développe aucune couche de graphiques."
  options:
    a: { en: "Managed Grafana targets operational dashboards for authenticated users of a workspace, priced per active user, not embedding for anonymous customers.", fr: "Managed Grafana vise des tableaux de bord opérationnels pour des utilisateurs authentifiés d'un espace de travail, facturés par utilisateur actif, pas l'intégration pour des clients anonymes." }
    b: { en: "Building dashboards with charting libraries is the front-end work the company wants to avoid.", fr: "Créer des tableaux de bord avec des bibliothèques de graphiques est le travail d'interface que l'entreprise veut éviter." }
    d: { en: "IAM users for thousands of external customers are an identity burden, and CloudWatch dashboards are for monitoring, not customer analytics.", fr: "Des utilisateurs IAM pour des milliers de clients externes représentent une lourde gestion d'identités, et les tableaux de bord CloudWatch servent à la surveillance, pas à l'analytique client." }
references:
  - title: Embedded analytics for AWS Quick Sight
    url: https://docs.aws.amazon.com/quicksight/latest/user/embedded-analytics.html
