id: saac03-3a-tape-gateway-deep-archive
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A financial services company backs up its on-premises servers to a physical tape library. The backup software uses an industry-standard iSCSI tape library interface. The company wants to stop handling physical tapes, keep its existing backup software and workflows, and keep tapes that must be retained for 10 years and are almost never read at the lowest possible storage cost.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société de services financiers sauvegarde ses serveurs sur site sur une bibliothèque de bandes physique. Le logiciel de sauvegarde utilise une interface de bibliothèque de bandes iSCSI standard. L'entreprise souhaite ne plus manipuler de bandes physiques, conserver son logiciel et ses procédures de sauvegarde, et conserver au coût de stockage le plus bas possible les bandes qui doivent être gardées 10 ans et ne sont presque jamais lues.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Archive the ejected virtual tapes to S3 Glacier Flexible Retrieval.", fr: "Archiver les bandes virtuelles éjectées dans S3 Glacier Flexible Retrieval." }
    - id: b
      text: { en: "Deploy Tape Gateway on premises and configure the backup software to use its virtual tape library.", fr: "Déployer Tape Gateway sur site et configurer le logiciel de sauvegarde pour utiliser sa bibliothèque de bandes virtuelles." }
    - id: c
      text: { en: "Archive the ejected virtual tapes to S3 Glacier Deep Archive.", fr: "Archiver les bandes virtuelles éjectées dans S3 Glacier Deep Archive." }
    - id: d
      text: { en: "Deploy Amazon S3 File Gateway and change the backup jobs to write to an SMB file share.", fr: "Déployer Amazon S3 File Gateway et modifier les tâches de sauvegarde pour écrire sur un partage de fichiers SMB." }
    - id: e
      text: { en: "Use AWS DataSync to copy the contents of the tape library to Amazon S3 every night.", fr: "Utiliser AWS DataSync pour copier chaque nuit le contenu de la bibliothèque de bandes vers Amazon S3." }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |-
      Tape Gateway presents an iSCSI virtual tape library to the existing backup software, so the jobs and workflows stay the same while virtual tapes are stored in Amazon S3. Ejected tapes can be archived to S3 Glacier Flexible Retrieval or S3 Glacier Deep Archive; Deep Archive is the lowest-cost choice for tapes that are kept for years and almost never read.
    fr: |-
      Tape Gateway présente une bibliothèque de bandes virtuelles iSCSI au logiciel de sauvegarde existant : les tâches et procédures restent identiques, et les bandes virtuelles sont stockées dans Amazon S3. Les bandes éjectées peuvent être archivées dans S3 Glacier Flexible Retrieval ou S3 Glacier Deep Archive ; Deep Archive est le choix le moins coûteux pour des bandes conservées des années et presque jamais lues.
  options:
    a:
      en: |-
        Glacier Flexible Retrieval works for archived tapes, but it costs more per GB than Deep Archive, so it does not give the lowest storage cost.
      fr: |-
        Glacier Flexible Retrieval convient aux bandes archivées, mais il coûte plus cher au Go que Deep Archive : il n'offre pas le coût de stockage le plus bas.
    d:
      en: |-
        Writing to a file share replaces the tape-based backup workflow, which the company wants to keep.
      fr: |-
        Écrire sur un partage de fichiers remplace la procédure de sauvegarde sur bandes, que l'entreprise veut conserver.
    e:
      en: |-
        DataSync transfers files between storage systems; it does not replace a tape library or read physical tapes, and the company would still handle tapes.
      fr: |-
        DataSync transfère des fichiers entre systèmes de stockage ; il ne remplace pas une bibliothèque de bandes et ne lit pas de bandes physiques, que l'entreprise continuerait donc à manipuler.
references:
