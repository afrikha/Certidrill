id: saac03-3b-elasticache-multi-az
objective: "3.3.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An application caches session data in Amazon ElastiCache for Valkey (cluster mode disabled) that runs on a single node. If the node or its Availability Zone fails, the cache must keep serving the application within seconds, and the application must keep writing to the same primary endpoint.

    Which combination of steps will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application met en cache des données de session dans Amazon ElastiCache for Valkey (mode cluster désactivé) qui s'exécute sur un seul nœud. Si le nœud ou sa zone de disponibilité tombe en panne, le cache doit continuer à servir l'application en quelques secondes, et l'application doit continuer à écrire sur le même point de terminaison principal.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Schedule daily backups and restore the latest one to a new cluster after a failure.", fr: "Planifier des sauvegardes quotidiennes et restaurer la plus récente dans un nouveau cluster après une panne." } }
    - { id: b, text: { en: "Add a read replica in a different Availability Zone from the primary node.", fr: "Ajouter un réplica en lecture dans une zone de disponibilité différente de celle du nœud principal." } }
    - { id: c, text: { en: "Migrate the cache to Memcached and spread its nodes across Availability Zones.", fr: "Migrer le cache vers Memcached et répartir ses nœuds entre les zones de disponibilité." } }
    - { id: d, text: { en: "Place a Network Load Balancer in front of the cache nodes.", fr: "Placer un Network Load Balancer devant les nœuds du cache." } }
    - { id: e, text: { en: "Enable Multi-AZ with automatic failover on the replication group.", fr: "Activer Multi-AZ avec basculement automatique sur le groupe de réplication." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: Multi-AZ requires at least one replica in a different Availability Zone from the primary. When the primary fails, ElastiCache promotes the replica with the least lag, writes resume typically within seconds, and the primary endpoint's DNS name moves to the new primary, so the application needs no change.
    fr: Multi-AZ exige au moins un réplica dans une zone de disponibilité différente de celle du nœud principal. Lorsque le nœud principal tombe en panne, ElastiCache promeut le réplica le moins en retard, les écritures reprennent généralement en quelques secondes, et le nom DNS du point de terminaison principal est reporté sur le nouveau nœud principal ; l'application n'a donc rien à changer.
  options:
    a:
      en: Restoring a backup to a new cluster takes much longer than seconds and gives the application a new endpoint.
      fr: Restaurer une sauvegarde dans un nouveau cluster prend bien plus que quelques secondes et donne à l'application un nouveau point de terminaison.
    c:
      en: Memcached has no replication or automatic failover, so the data of a failed node is lost.
      fr: Memcached n'offre ni réplication ni basculement automatique ; les données d'un nœud en panne sont donc perdues.
    d:
      en: A load balancer would spread writes over nodes that are not primaries and does not provide replication or failover.
      fr: Un équilibreur de charge répartirait les écritures sur des nœuds qui ne sont pas principaux et n'apporte ni réplication ni basculement.
references:
  - title: Minimizing downtime in ElastiCache by using Multi-AZ with Valkey and Redis OSS
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/AutoFailover.html
