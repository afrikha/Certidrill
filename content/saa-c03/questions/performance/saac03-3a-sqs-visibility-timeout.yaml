id: saac03-3a-sqs-visibility-timeout
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's worker instances read messages from an Amazon SQS standard queue that uses the default settings. Processing a message takes up to 3 minutes, after which the worker deletes it. The company notices that many messages are processed two or three times by different workers, although the workers report no errors.

    Which change will resolve the issue?
  fr: |
    Les instances de traitement d'une entreprise lisent des messages dans une file d'attente Amazon SQS standard qui utilise les paramètres par défaut. Le traitement d'un message dure jusqu'à 3 minutes, après quoi l'instance le supprime. L'entreprise constate que de nombreux messages sont traités deux ou trois fois par des instances différentes, alors que celles-ci ne signalent aucune erreur.

    Quelle modification résout le problème ?
body:
  options:
    - id: a
      text: { en: "Enable long polling by setting the receive message wait time of the queue to 20 seconds.", fr: "Activer l'interrogation longue en réglant à 20 secondes le temps d'attente de réception des messages de la file." }
    - id: b
      text: { en: "Configure a dead-letter queue with a maximum receive count of 1.", fr: "Configurer une file d'attente de lettres mortes avec un nombre maximal de réceptions de 1." }
    - id: c
      text: { en: "Increase the visibility timeout of the queue to longer than the maximum processing time.", fr: "Augmenter le délai de visibilité de la file au-delà de la durée maximale de traitement." }
    - id: d
      text: { en: "Increase the message retention period of the queue to 14 days.", fr: "Porter la période de conservation des messages de la file à 14 jours." }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      The default visibility timeout is 30 seconds. If a message is not deleted before the timeout expires, it becomes visible again and another worker receives it. Setting the timeout above the maximum processing time (or extending it with ChangeMessageVisibility while processing) stops the duplicate processing.
    fr: |-
      Le délai de visibilité par défaut est de 30 secondes. Si un message n'est pas supprimé avant son expiration, il redevient visible et une autre instance le reçoit. Régler le délai au-delà de la durée maximale de traitement (ou le prolonger avec ChangeMessageVisibility pendant le traitement) met fin aux traitements en double.
  options:
    a:
      en: |-
        Long polling reduces empty and false empty responses; it does not keep a message hidden while it is being processed.
      fr: |-
        L'interrogation longue réduit les réponses vides et faussement vides ; elle ne masque pas un message pendant son traitement.
    b:
      en: |-
        A dead-letter queue with a count of 1 would move healthy messages after one receive, losing retries, without fixing the timeout that causes the duplicates.
      fr: |-
        Une file d'attente de lettres mortes avec un nombre de 1 déplacerait des messages sains après une seule réception, supprimant les nouvelles tentatives, sans corriger le délai à l'origine des doublons.
    d:
      en: |-
        Retention controls how long unprocessed messages stay in the queue, not whether they reappear during processing.
      fr: |-
        La conservation détermine combien de temps les messages non traités restent dans la file, pas s'ils réapparaissent pendant le traitement.
references:
  - title: Amazon SQS visibility timeout - Amazon Simple Queue Service
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html
