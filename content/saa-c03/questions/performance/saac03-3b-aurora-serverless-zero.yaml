id: saac03-3b-aurora-serverless-zero
objective: "3.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has an internal PostgreSQL application that employees use for a few hours each week at irregular times. The rest of the time the database receives no connections. The company wants a managed relational database that scales capacity automatically, does not charge for compute capacity while it is idle, and can tolerate a short delay of about 15 seconds on the first connection after an idle period.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise dispose d'une application PostgreSQL interne que les employés utilisent quelques heures par semaine à des moments irréguliers. Le reste du temps, la base de données ne reçoit aucune connexion. L'entreprise veut une base de données relationnelle gérée qui fait évoluer sa capacité automatiquement, ne facture pas de capacité de calcul pendant qu'elle est inactive, et peut tolérer un court délai d'environ 15 secondes sur la première connexion après une période d'inactivité.

    Quelle solution répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "An Aurora PostgreSQL cluster that uses Aurora Serverless instances with a minimum capacity of 0 ACUs", fr: "Un cluster Aurora PostgreSQL qui utilise des instances Aurora Serverless avec une capacité minimale de 0 ACU" }
    - id: b
      text: { en: "An Aurora PostgreSQL cluster with a provisioned db.r6g.large writer instance", fr: "Un cluster Aurora PostgreSQL avec une instance d'écriture provisionnée db.r6g.large" }
    - id: c
      text: { en: "An Amazon RDS for PostgreSQL DB instance on a burstable db.t4g.micro instance class", fr: "Une instance de base de données Amazon RDS for PostgreSQL sur une classe d'instance à performances extensibles db.t4g.micro" }
    - id: d
      text: { en: "An Amazon DynamoDB table in on-demand capacity mode", fr: "Une table Amazon DynamoDB en mode de capacité à la demande" }
answer: { optionId: a }
explanation:
  correct:
    en: Aurora Serverless scales capacity automatically in half-ACU steps. With a minimum capacity of 0 ACUs, instances pause after a period without connections, compute is not billed while paused, and a new connection resumes the instance, which typically takes about 15 seconds.
    fr: Aurora Serverless fait évoluer la capacité automatiquement par paliers d'une demi-ACU. Avec une capacité minimale de 0 ACU, les instances se mettent en pause après une période sans connexion, le calcul n'est pas facturé pendant la pause, et une nouvelle connexion relance l'instance, ce qui prend généralement environ 15 secondes.
  options:
    b:
      en: A provisioned instance is billed for every hour it runs, including the many idle hours, and its capacity does not scale automatically.
      fr: Une instance provisionnée est facturée pour chaque heure de fonctionnement, y compris les nombreuses heures d'inactivité, et sa capacité n'évolue pas automatiquement.
    c:
      en: A burstable instance is cheaper but is still billed while idle and does not scale capacity automatically.
      fr: Une instance à performances extensibles coûte moins cher mais reste facturée pendant l'inactivité et ne fait pas évoluer sa capacité automatiquement.
    d:
      en: DynamoDB scales to zero but is a NoSQL database, not a PostgreSQL-compatible relational database, so the application would have to be rewritten.
      fr: DynamoDB descend à zéro mais c'est une base NoSQL, pas une base relationnelle compatible PostgreSQL ; l'application devrait donc être réécrite.
references:
  - title: Scaling to Zero ACUs with automatic pause and resume for Aurora serverless
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2-auto-pause.html
  - title: Using Aurora serverless
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.html
