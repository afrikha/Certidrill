id: saac03-3a-s3-strong-consistency
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An order processing application writes a JSON document to an Amazon S3 bucket and, a few milliseconds later, another component reads the same object or lists the bucket to find it. Sometimes the application overwrites an existing object and immediately reads it again. The developers are worried that the readers might receive stale data and want the simplest solution.

    What should a solutions architect recommend?
  fr: |
    Une application de traitement des commandes écrit un document JSON dans un compartiment Amazon S3 et, quelques millisecondes plus tard, un autre composant lit le même objet ou liste le compartiment pour le trouver. Il arrive que l'application remplace un objet existant et le relise immédiatement. Les développeurs craignent que les lecteurs reçoivent des données obsolètes et souhaitent la solution la plus simple.

    Que doit recommander un architecte de solutions ?
body:
  options:
    - id: a
      text: { en: "Keep the current design, because S3 reads are already consistent after a successful write.", fr: "Conserver la conception actuelle, car les lectures S3 sont déjà cohérentes après une écriture réussie." }
    - id: b
      text: { en: "Enable S3 Versioning on the bucket so that readers always retrieve the latest version of each object.", fr: "Activer S3 Versioning sur le compartiment afin que les lecteurs récupèrent toujours la dernière version de chaque objet." }
    - id: c
      text: { en: "Track each write in an Amazon DynamoDB table and have readers wait until the item appears before reading.", fr: "Suivre chaque écriture dans une table Amazon DynamoDB et faire attendre les lecteurs jusqu'à l'apparition de l'élément avant de lire." }
    - id: d
      text: { en: "Add a delay of several seconds in the readers before each GET or LIST request.", fr: "Ajouter un délai de plusieurs secondes dans les lecteurs avant chaque requête GET ou LIST." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Amazon S3 provides strong read-after-write consistency in all AWS Regions for new objects, overwrites and deletes. Any GET or LIST that starts after a successful PUT response returns the data written, so no extra mechanism is needed.
    fr: |-
      Amazon S3 offre une cohérence forte en lecture après écriture dans toutes les Régions AWS, pour les nouveaux objets, les remplacements et les suppressions. Toute requête GET ou LIST lancée après une réponse PUT réussie renvoie les données écrites : aucun mécanisme supplémentaire n'est nécessaire.
  options:
    b:
      en: |-
        Versioning keeps previous versions of objects for recovery; it is not needed for consistency, which S3 already provides.
      fr: |-
        La gestion des versions conserve les versions précédentes des objets à des fins de récupération ; elle n'est pas nécessaire à la cohérence, que S3 assure déjà.
    c:
      en: |-
        A tracking table adds cost and code to solve a problem that does not exist, since S3 reads are already strongly consistent.
      fr: |-
        Une table de suivi ajoute du coût et du code pour résoudre un problème qui n'existe pas, puisque les lectures S3 sont déjà fortement cohérentes.
    d:
      en: |-
        Artificial delays only add latency; S3 already returns the latest data immediately after a successful write.
      fr: |-
        Des délais artificiels ne font qu'ajouter de la latence ; S3 renvoie déjà les dernières données immédiatement après une écriture réussie.
references:
  - title: What is Amazon S3? - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
