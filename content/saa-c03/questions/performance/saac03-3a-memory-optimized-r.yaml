id: saac03-3a-memory-optimized-r
objective: "3.2.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is moving a self-managed in-memory analytics database to Amazon EC2. The database keeps its whole 400 GiB working set in RAM and needs only a moderate number of vCPUs. The company wants the instance family that offers the most memory per vCPU for this workload at the lowest cost.

    Which instance family should the company choose?
  fr: |
    Une entreprise déplace vers Amazon EC2 une base de données analytique en mémoire autogérée. La base de données conserve la totalité de son jeu de travail de 400 Gio en RAM et n'a besoin que d'un nombre modéré de vCPU. L'entreprise souhaite la famille d'instances qui offre le plus de mémoire par vCPU pour cette charge, au coût le plus bas.

    Quelle famille d'instances l'entreprise doit-elle choisir ?
body:
  options:
    - id: a
      text: { en: "Compute optimized (C family)", fr: "Optimisée pour le calcul (famille C)" }
    - id: b
      text: { en: "Burstable general purpose (T family)", fr: "Usage général à capacité extensible (famille T)" }
    - id: c
      text: { en: "Storage optimized (I family)", fr: "Optimisée pour le stockage (famille I)" }
    - id: d
      text: { en: "Memory optimized (R family)", fr: "Optimisée pour la mémoire (famille R)" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Memory optimized instances such as the R family are designed for workloads that process large data sets in memory, such as in-memory databases, caches and real-time analytics. They provide a high ratio of memory to vCPUs, so the company does not pay for CPU it does not need.
    fr: |-
      Les instances optimisées pour la mémoire, comme la famille R, sont conçues pour les charges qui traitent de grands jeux de données en mémoire, telles que les bases de données en mémoire, les caches et l'analytique en temps réel. Elles offrent un rapport mémoire/vCPU élevé : l'entreprise ne paie pas de processeur inutile.
  options:
    a:
      en: |-
        Compute optimized instances have a low memory-to-vCPU ratio, so reaching 400 GiB of RAM would mean paying for many unneeded vCPUs.
      fr: |-
        Les instances optimisées pour le calcul ont un faible rapport mémoire/vCPU : atteindre 400 Gio de RAM obligerait à payer de nombreux vCPU inutiles.
    b:
      en: |-
        Burstable instances suit workloads with a low baseline CPU and small to medium memory needs, not a 400 GiB in-memory database.
      fr: |-
        Les instances à capacité extensible conviennent aux charges dont le processeur de référence est faible et les besoins en mémoire petits à moyens, pas à une base en mémoire de 400 Gio.
    c:
      en: |-
        Storage optimized instances are built for high I/O to local storage; this workload keeps its data in RAM.
      fr: |-
        Les instances optimisées pour le stockage sont conçues pour des E/S élevées sur un stockage local ; cette charge conserve ses données en RAM.
references:
  - title: Amazon EC2 FAQs – AWS
    url: https://aws.amazon.com/ec2/faqs/
  - title: Specifications for Amazon EC2 memory optimized instances - Amazon EC2
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/mo.html
