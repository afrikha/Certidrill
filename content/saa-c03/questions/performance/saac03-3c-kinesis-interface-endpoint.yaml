id: saac03-3c-kinesis-interface-endpoint
objective: "3.5.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs data producers on Amazon EC2 instances in private subnets that have no route to the internet. The producers must send records to an Amazon Kinesis data stream in the same AWS Region. The security policy requires that this traffic never traverse the internet and that only the company's stream can be reached through the path that is used.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des producteurs de données sur des instances Amazon EC2 dans des sous-réseaux privés sans route vers Internet. Les producteurs doivent envoyer des enregistrements à un flux de données Amazon Kinesis dans la même Région AWS. La politique de sécurité exige que ce trafic ne traverse jamais Internet et que seul le flux de l'entreprise soit joignable par le chemin utilisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Create a NAT gateway in a public subnet and add a default route to it from the private subnets.", fr: "Créer une passerelle NAT dans un sous-réseau public et ajouter une route par défaut vers celle-ci depuis les sous-réseaux privés." } }
    - { id: b, text: { en: "Create a gateway VPC endpoint for Kinesis Data Streams with an endpoint policy that allows only the company's stream, and add it to the route tables.", fr: "Créer un point de terminaison de VPC de passerelle pour Kinesis Data Streams avec une politique de point de terminaison qui n'autorise que le flux de l'entreprise, et l'ajouter aux tables de routage." } }
    - { id: c, text: { en: "Create an AWS Site-to-Site VPN connection from the VPC and send the records through the VPN tunnel.", fr: "Créer une connexion AWS Site-to-Site VPN depuis le VPC et envoyer les enregistrements par le tunnel VPN." } }
    - { id: d, text: { en: "Create an interface VPC endpoint for Kinesis Data Streams with an endpoint policy that allows access only to the company's stream.", fr: "Créer un point de terminaison de VPC d'interface pour Kinesis Data Streams avec une politique de point de terminaison qui n'autorise l'accès qu'au flux de l'entreprise." } }
answer: { optionId: d }
explanation:
  correct:
    en: An interface VPC endpoint (AWS PrivateLink) places network interfaces with private IP addresses in the subnets, so traffic to Kinesis Data Streams stays on the Amazon network without an internet gateway or NAT device. An endpoint policy restricts which streams and actions can be reached through the endpoint.
    fr: "Un point de terminaison de VPC d'interface (AWS PrivateLink) place des interfaces réseau à adresses IP privées dans les sous-réseaux : le trafic vers Kinesis Data Streams reste sur le réseau Amazon, sans passerelle Internet ni périphérique NAT. Une politique de point de terminaison restreint les flux et les actions accessibles par ce point de terminaison."
  options:
    a: { en: "A NAT gateway sends the traffic to the public Kinesis endpoint over an internet path and does not restrict which streams are reachable.", fr: "Une passerelle NAT envoie le trafic vers le point de terminaison public de Kinesis par un chemin Internet et ne restreint pas les flux joignables." }
    b: { en: "Gateway endpoints exist only for Amazon S3 and Amazon DynamoDB; Kinesis Data Streams uses interface endpoints.", fr: "Les points de terminaison de passerelle n'existent que pour Amazon S3 et Amazon DynamoDB ; Kinesis Data Streams utilise des points de terminaison d'interface." }
    c: { en: "A Site-to-Site VPN connects the VPC to another network; it does not provide private access to an AWS service endpoint.", fr: "Un Site-to-Site VPN relie le VPC à un autre réseau ; il ne fournit pas d'accès privé à un point de terminaison de service AWS." }
references:
  - title: Use Amazon Kinesis Data Streams with interface VPC endpoints
    url: https://docs.aws.amazon.com/streams/latest/dev/vpc.html
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
