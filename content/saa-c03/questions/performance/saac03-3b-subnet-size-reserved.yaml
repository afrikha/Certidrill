id: saac03-3b-subnet-size-reserved
objective: "3.4.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A company is planning the subnets of a new VPC. Each application subnet must provide at least 27 IPv4 addresses that can be assigned to network interfaces. To conserve address space, each subnet must use the smallest CIDR block that meets this requirement.

    Which subnet size should the company use?
  fr: |
    Une entreprise planifie les sous-réseaux d'un nouveau VPC. Chaque sous-réseau d'application doit fournir au moins 27 adresses IPv4 attribuables à des interfaces réseau. Pour économiser l'espace d'adressage, chaque sous-réseau doit utiliser le plus petit bloc CIDR qui répond à cette exigence.

    Quelle taille de sous-réseau l'entreprise doit-elle utiliser ?
body:
  options:
    - { id: a, text: "/28" }
    - { id: b, text: "/27" }
    - { id: c, text: "/26" }
    - { id: d, text: "/25" }
answer: { optionId: b }
explanation:
  correct:
    en: AWS reserves five IPv4 addresses in every subnet (the network address, the VPC router, the DNS server, one for future use and the broadcast address). A /27 has 32 addresses, so 27 remain assignable, which exactly meets the requirement.
    fr: AWS réserve cinq adresses IPv4 dans chaque sous-réseau (l'adresse réseau, le routeur du VPC, le serveur DNS, une pour un usage futur et l'adresse de diffusion). Un /27 compte 32 adresses ; il en reste donc 27 attribuables, ce qui répond exactement à l'exigence.
  options:
    a:
      en: A /28 has 16 addresses, so only 11 are assignable after the five reserved addresses.
      fr: Un /28 compte 16 adresses ; seules 11 sont donc attribuables après les cinq adresses réservées.
    c:
      en: A /26 provides 59 assignable addresses, which works but is not the smallest block that meets the requirement.
      fr: Un /26 fournit 59 adresses attribuables, ce qui fonctionne mais n'est pas le plus petit bloc qui répond à l'exigence.
    d:
      en: A /25 provides 123 assignable addresses and wastes even more address space.
      fr: Un /25 fournit 123 adresses attribuables et gaspille encore plus d'espace d'adressage.
references:
  - title: Subnet CIDR blocks
    url: https://docs.aws.amazon.com/vpc/latest/userguide/subnet-sizing.html
