id: saac03-3a-target-tracking-cpu
objective: "3.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a CPU-bound web application on Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Load testing shows that response times stay acceptable while average CPU utilization is around 50%. Traffic changes unpredictably during the day. The company wants the group to add and remove instances automatically to stay near that level, with the LEAST configuration effort.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web limitée par le processeur sur des instances Amazon EC2 d'un groupe Auto Scaling, derrière un Application Load Balancer. Les tests de charge montrent que les temps de réponse restent acceptables tant que l'utilisation moyenne du processeur est d'environ 50 %. Le trafic varie de manière imprévisible au cours de la journée. L'entreprise souhaite que le groupe ajoute et retire automatiquement des instances pour rester proche de ce niveau, avec le MOINS d'effort de configuration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create two CloudWatch alarms on CPU utilization and a step scaling policy for each alarm.", fr: "Créer deux alarmes CloudWatch sur l'utilisation du processeur et une stratégie de mise à l'échelle par étapes pour chaque alarme." }
    - id: b
      text: { en: "Create scheduled actions that change the desired capacity every hour.", fr: "Créer des actions planifiées qui modifient la capacité souhaitée toutes les heures." }
    - id: c
      text: { en: "Create a CloudWatch alarm on CPU utilization that notifies the operations team through Amazon SNS.", fr: "Créer une alarme CloudWatch sur l'utilisation du processeur qui avertit l'équipe d'exploitation via Amazon SNS." }
    - id: d
      text: { en: "Create a target tracking scaling policy on ASGAverageCPUUtilization with a target value of 50.", fr: "Créer une stratégie de mise à l'échelle de suivi de la cible sur ASGAverageCPUUtilization avec une valeur cible de 50." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      A target tracking policy keeps a metric near a target value; ASGAverageCPUUtilization is a predefined metric, so you only set the target. Amazon EC2 Auto Scaling creates and manages the CloudWatch alarms and calculates the scaling adjustments itself.
    fr: |-
      Une stratégie de suivi de la cible maintient une métrique proche d'une valeur cible ; ASGAverageCPUUtilization est une métrique prédéfinie, il suffit donc de fixer la cible. Amazon EC2 Auto Scaling crée et gère lui-même les alarmes CloudWatch et calcule les ajustements de capacité.
  options:
    a:
      en: |-
        Step scaling can work, but the company must create and tune the alarms and the step adjustments, which is more configuration.
      fr: |-
        La mise à l'échelle par étapes peut fonctionner, mais l'entreprise doit créer et ajuster les alarmes et les étapes, ce qui demande plus de configuration.
    b:
      en: |-
        Scheduled actions fit predictable load; the traffic here is unpredictable.
      fr: |-
        Les actions planifiées conviennent à une charge prévisible ; ici, le trafic est imprévisible.
    c:
      en: |-
        A notification requires people to change capacity by hand; it does not scale the group automatically.
      fr: |-
        Une notification exige que des personnes modifient la capacité manuellement ; elle ne met pas le groupe à l'échelle automatiquement.
references:
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
