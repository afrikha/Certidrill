id: saac03-3c-emr-existing-hadoop
objective: "3.5.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an on-premises Hadoop cluster with Apache Spark and Apache Hive jobs that process several terabytes of data every night. The company wants to move the jobs to AWS with minimal changes to the code, keep the same open-source frameworks, and store the data in Amazon S3.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster Hadoop sur site avec des tâches Apache Spark et Apache Hive qui traitent plusieurs téraoctets de données chaque nuit. L'entreprise souhaite déplacer les tâches vers AWS avec un minimum de modifications du code, conserver les mêmes frameworks open source et stocker les données dans Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Run the jobs on Amazon EMR clusters that read and write the data in Amazon S3.", fr: "Exécuter les tâches sur des clusters Amazon EMR qui lisent et écrivent les données dans Amazon S3." } }
    - { id: b, text: { en: "Rewrite the jobs as SQL stored procedures in an Amazon Redshift provisioned cluster.", fr: "Réécrire les tâches sous forme de procédures stockées SQL dans un cluster Amazon Redshift provisionné." } }
    - { id: c, text: { en: "Package each job as a container and run it with AWS Batch on Amazon EC2 Spot Instances.", fr: "Empaqueter chaque tâche dans un conteneur et l'exécuter avec AWS Batch sur des instances Spot Amazon EC2." } }
    - { id: d, text: { en: "Rewrite the jobs as AWS Lambda functions that are triggered when files arrive in S3.", fr: "Réécrire les tâches sous forme de fonctions AWS Lambda déclenchées à l'arrivée des fichiers dans S3." } }
answer: { optionId: a }
explanation:
  correct:
    en: Amazon EMR is a managed cluster platform that runs big data frameworks such as Apache Hadoop, Spark and Hive on AWS. Existing Spark and Hive jobs run with few changes, and EMR reads and writes data in Amazon S3.
    fr: "Amazon EMR est une plateforme de clusters gérée qui exécute sur AWS des frameworks big data comme Apache Hadoop, Spark et Hive. Les tâches Spark et Hive existantes s'exécutent avec peu de modifications, et EMR lit et écrit les données dans Amazon S3."
  options:
    b: { en: "Rewriting Spark and Hive jobs as stored procedures is a large code change and abandons the open-source frameworks.", fr: "Réécrire des tâches Spark et Hive en procédures stockées est une modification de code importante qui abandonne les frameworks open source." }
    c: { en: "AWS Batch runs containerized jobs but provides no Hadoop, Spark or Hive cluster; the company would have to build that itself.", fr: "AWS Batch exécute des tâches conteneurisées, mais ne fournit aucun cluster Hadoop, Spark ou Hive ; l'entreprise devrait le construire elle-même." }
    d: { en: "Lambda functions are not a runtime for Spark or Hive, so every job would need a full rewrite.", fr: "Les fonctions Lambda ne sont pas un environnement d'exécution pour Spark ou Hive : chaque tâche devrait être entièrement réécrite." }
references:
  - title: What is Amazon EMR?
    url: https://docs.aws.amazon.com/emr/latest/ManagementGuide/emr-what-is-emr.html
