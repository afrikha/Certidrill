id: saac03-3a-cloudfront-functions-headers
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A news website is served through Amazon CloudFront and receives millions of requests per second during major events. On every viewer request, before CloudFront checks its cache, the company must normalize the query string to improve the cache hit ratio and add a header that carries the viewer's IP address. The logic is a few lines of JavaScript and needs no network calls. The company wants the lowest added latency and cost.

    Which solution will meet these requirements?
  fr: |
    Un site d'actualités est servi par Amazon CloudFront et reçoit des millions de requêtes par seconde lors des grands événements. À chaque requête d'utilisateur, avant que CloudFront ne consulte son cache, l'entreprise doit normaliser la chaîne de requête pour améliorer le taux d'accès au cache et ajouter un en-tête contenant l'adresse IP de l'utilisateur. La logique tient en quelques lignes de JavaScript et n'exige aucun appel réseau. L'entreprise veut la latence ajoutée et le coût les plus faibles.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Associate a Lambda@Edge function with the viewer request event of the distribution.", fr: "Associer une fonction Lambda@Edge à l'événement de requête utilisateur (viewer request) de la distribution." }
    - id: b
      text: { en: "Associate a CloudFront Functions function with the viewer request event of the distribution.", fr: "Associer une fonction CloudFront Functions à l'événement de requête utilisateur (viewer request) de la distribution." }
    - id: c
      text: { en: "Associate a Lambda@Edge function with the origin request event of the distribution.", fr: "Associer une fonction Lambda@Edge à l'événement de requête à l'origine (origin request) de la distribution." }
    - id: d
      text: { en: "Route all requests through Amazon API Gateway with a Lambda function that rewrites them before CloudFront.", fr: "Faire passer toutes les requêtes par Amazon API Gateway avec une fonction Lambda qui les réécrit avant CloudFront." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      CloudFront Functions runs lightweight JavaScript on viewer request and viewer response events with submillisecond execution and scales to millions of requests per second. Cache key normalization and header manipulation are its typical use cases, and it is cheaper than Lambda@Edge.
    fr: |-
      CloudFront Functions exécute du JavaScript léger sur les événements de requête et de réponse utilisateur, avec une exécution inférieure à la milliseconde et une capacité de millions de requêtes par seconde. La normalisation de la clé de cache et la manipulation d'en-têtes sont ses cas d'usage typiques, et il coûte moins cher que Lambda@Edge.
  options:
    a:
      en: |-
        Lambda@Edge can do this, but it scales to about 10,000 requests per second per Region, adds more latency and costs more; it is meant for heavier logic, network access or the request body.
      fr: |-
        Lambda@Edge peut le faire, mais il monte à environ 10 000 requêtes par seconde par Région, ajoute plus de latence et coûte plus cher ; il est destiné à une logique plus lourde, à l'accès réseau ou au corps de la requête.
    c:
      en: |-
        Origin request functions run only on cache misses, after the cache lookup, so they cannot normalize the cache key for every viewer request.
      fr: |-
        Les fonctions sur requête à l'origine ne s'exécutent qu'en cas d'absence dans le cache, après la consultation du cache : elles ne peuvent pas normaliser la clé de cache pour chaque requête utilisateur.
    d:
      en: |-
        Putting API Gateway and Lambda in front of CloudFront adds a Regional hop, latency and cost for every request instead of running at the edge.
      fr: |-
        Placer API Gateway et Lambda devant CloudFront ajoute un passage par une Région, de la latence et du coût à chaque requête au lieu d'agir en périphérie.
references:
  - title: Differences between CloudFront Functions and Lambda@Edge - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
  - title: Customize at the edge with CloudFront Functions - Amazon CloudFront
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cloudfront-functions.html
