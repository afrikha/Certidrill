id: saac03-3b-lambda-cpu-memory
objective: "3.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company runs an AWS Lambda function that resizes product images uploaded to Amazon S3. The function is configured with 512 MB of memory. Amazon CloudWatch shows that each invocation uses at most 300 MB of memory, but the processing is CPU-bound and each invocation takes several seconds. The company wants to reduce the duration of each invocation with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias exécute une fonction AWS Lambda qui redimensionne les images de produits chargées dans Amazon S3. La fonction est configurée avec 512 Mo de mémoire. Amazon CloudWatch montre que chaque invocation utilise au plus 300 Mo de mémoire, mais le traitement est limité par le processeur et chaque invocation dure plusieurs secondes. L'entreprise veut réduire la durée de chaque invocation avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the timeout of the function so that each invocation has more time to finish its processing.", fr: "Augmenter le délai d'expiration de la fonction afin que chaque invocation dispose de plus de temps pour terminer son traitement." }
    - id: b
      text: { en: "Increase the memory setting of the function so that Lambda allocates proportionally more CPU power to it.", fr: "Augmenter le paramètre de mémoire de la fonction afin que Lambda lui alloue proportionnellement plus de puissance de processeur." }
    - id: c
      text: { en: "Configure provisioned concurrency so that execution environments are initialized before the invocations arrive.", fr: "Configurer la simultanéité provisionnée afin que les environnements d'exécution soient initialisés avant l'arrivée des invocations." }
    - id: d
      text: { en: "Increase the ephemeral storage of the function so that the /tmp directory has more space for the images.", fr: "Augmenter le stockage éphémère de la fonction afin que le répertoire /tmp dispose de plus d'espace pour les images." }
answer: { optionId: b }
explanation:
  correct:
    en: Lambda allocates CPU power in proportion to the configured memory (128 MB to 10,240 MB), so a CPU-bound function runs faster with more memory even if it does not need the extra RAM. It is a single configuration change, with no code or infrastructure to manage.
    fr: Lambda alloue la puissance de processeur proportionnellement à la mémoire configurée (de 128 Mo à 10 240 Mo) ; une fonction limitée par le processeur s'exécute donc plus vite avec plus de mémoire, même si elle n'a pas besoin de la RAM supplémentaire. C'est une simple modification de configuration, sans code ni infrastructure à gérer.
  options:
    a:
      en: A longer timeout only lets a slow invocation run longer; it does not make the processing faster.
      fr: Un délai d'expiration plus long permet seulement à une invocation lente de s'exécuter plus longtemps ; il n'accélère pas le traitement.
    c:
      en: Provisioned concurrency removes cold-start initialization time, but the duration here comes from CPU-bound processing inside each invocation.
      fr: La simultanéité provisionnée supprime le temps d'initialisation des démarrages à froid, mais ici la durée provient du traitement limité par le processeur dans chaque invocation.
    d:
      en: Ephemeral storage adds disk space in /tmp; it does not add CPU power, and lack of disk space is not the problem.
      fr: Le stockage éphémère ajoute de l'espace disque dans /tmp ; il n'ajoute pas de puissance de processeur, et le manque d'espace disque n'est pas le problème.
references:
  - title: Configure Lambda Event Function memory
    url: https://docs.aws.amazon.com/lambda/latest/dg/configuration-memory.html
