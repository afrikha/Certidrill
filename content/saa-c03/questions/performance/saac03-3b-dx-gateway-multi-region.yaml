id: saac03-3b-dx-gateway-multi-region
objective: "3.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company has an AWS Direct Connect connection at a location in the United States and uses a private virtual interface to reach a VPC in us-east-1 through its virtual private gateway. The company is deploying a new VPC with a virtual private gateway in eu-west-1. The data center must reach both VPCs privately over the existing Direct Connect connection, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une connexion AWS Direct Connect dans un emplacement aux États-Unis et utilise une interface virtuelle privée pour joindre un VPC de us-east-1 via sa passerelle réseau privé virtuel. L'entreprise déploie un nouveau VPC doté d'une passerelle réseau privé virtuel dans eu-west-1. Le centre de données doit joindre les deux VPC de façon privée par la connexion Direct Connect existante, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Order a second Direct Connect connection at a location in Europe for the eu-west-1 VPC.", fr: "Commander une deuxième connexion Direct Connect dans un emplacement en Europe pour le VPC de eu-west-1." }
    - id: b
      text: { en: "Create a second private virtual interface that connects directly to the virtual private gateway in eu-west-1.", fr: "Créer une deuxième interface virtuelle privée qui se connecte directement à la passerelle réseau privé virtuel de eu-west-1." }
    - id: c
      text: { en: "Create a Direct Connect gateway, associate both virtual private gateways with it, and attach a private virtual interface to it.", fr: "Créer une passerelle Direct Connect, y associer les deux passerelles réseau privé virtuel et y attacher une interface virtuelle privée." }
    - id: d
      text: { en: "Peer the us-east-1 VPC with the eu-west-1 VPC and route data center traffic for eu-west-1 through the peering connection.", fr: "Appairer le VPC de us-east-1 avec celui de eu-west-1 et faire passer le trafic du centre de données destiné à eu-west-1 par l'appairage." }
answer: { optionId: c }
explanation:
  correct:
    en: A Direct Connect gateway is a globally available resource that can be associated with virtual private gateways in any Region (except China Regions). A private virtual interface attached to it reaches the VPCs in both Regions over the existing connection.
    fr: Une passerelle Direct Connect est une ressource disponible mondialement qui peut être associée à des passerelles réseau privé virtuel de n'importe quelle Région (sauf les Régions de Chine). Une interface virtuelle privée qui lui est attachée joint les VPC des deux Régions par la connexion existante.
  options:
    a:
      en: A second connection adds lead time, port costs and equipment to manage, while the existing connection can already reach other Regions through a Direct Connect gateway.
      fr: Une deuxième connexion ajoute des délais, des coûts de port et des équipements à gérer, alors que la connexion existante peut déjà joindre d'autres Régions via une passerelle Direct Connect.
    b:
      en: Without a Direct Connect gateway, a private virtual interface connects to a single VPC's virtual private gateway in the same Region.
      fr: Sans passerelle Direct Connect, une interface virtuelle privée se connecte à la passerelle réseau privé virtuel d'un seul VPC dans la même Région.
    d:
      en: VPC peering is not transitive, so traffic from the data center cannot cross the us-east-1 VPC to reach the peered VPC.
      fr: L'appairage de VPC n'est pas transitif ; le trafic du centre de données ne peut donc pas traverser le VPC de us-east-1 pour atteindre le VPC appairé.
references:
  - title: Direct Connect gateways
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/direct-connect-gateways-intro.html
  - title: What is Direct Connect?
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html
