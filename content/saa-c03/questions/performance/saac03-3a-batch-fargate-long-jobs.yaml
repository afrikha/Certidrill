id: saac03-3a-batch-fargate-long-jobs
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a containerized data processing job several times a day, sometimes in bursts of dozens of submissions. Each job is a single uninterrupted computation of about 3 hours that needs 4 vCPUs and 16 GB of memory and no GPU. Jobs submitted in a burst must wait in a queue until capacity is available. The company does not want to choose, patch or scale any EC2 instances.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise exécute plusieurs fois par jour une tâche de traitement de données conteneurisée, parfois par salves de dizaines de soumissions. Chaque tâche est un calcul unique et ininterrompu d'environ 3 heures qui exige 4 vCPU et 16 Go de mémoire, sans GPU. Les tâches soumises en salve doivent attendre dans une file d'attente jusqu'à ce que de la capacité soit disponible. L'entreprise ne veut choisir, corriger ni mettre à l'échelle aucune instance EC2.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Package the job as a Lambda container image with maximum memory and invoke it asynchronously.", fr: "Empaqueter la tâche dans une image de conteneur Lambda avec la mémoire maximale et l'appeler de manière asynchrone." }
    - id: b
      text: { en: "Submit the jobs to an AWS Batch job queue that uses a Fargate compute environment.", fr: "Soumettre les tâches à une file d'attente de tâches AWS Batch qui utilise un environnement de calcul Fargate." }
    - id: c
      text: { en: "Submit the jobs to an AWS Batch job queue that uses an EC2 compute environment with an AMI the company maintains.", fr: "Soumettre les tâches à une file d'attente de tâches AWS Batch qui utilise un environnement de calcul EC2 avec une AMI maintenue par l'entreprise." }
    - id: d
      text: { en: "Run the jobs on an Auto Scaling group of EC2 instances that poll an Amazon SQS queue.", fr: "Exécuter les tâches sur un groupe Auto Scaling d'instances EC2 qui interrogent une file d'attente Amazon SQS." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      An AWS Batch job queue holds submitted jobs until capacity is available, and a Fargate compute environment runs each job as a serverless container with its own isolation boundary. The company specifies only vCPUs and memory, with no servers, AMIs or cluster scaling to manage.
    fr: |-
      Une file d'attente de tâches AWS Batch conserve les tâches soumises jusqu'à ce que de la capacité soit disponible, et un environnement de calcul Fargate exécute chaque tâche dans un conteneur sans serveur doté de sa propre frontière d'isolation. L'entreprise ne spécifie que les vCPU et la mémoire, sans serveur, AMI ni mise à l'échelle de cluster à gérer.
  options:
    a:
      en: |-
        A 3-hour uninterrupted computation is far longer than the maximum timeout of a Lambda function (minutes, not hours), so it cannot run in one invocation.
      fr: |-
        Un calcul ininterrompu de 3 heures est bien plus long que la durée maximale d'une fonction Lambda (des minutes, pas des heures) : il ne peut pas s'exécuter en une seule invocation.
    c:
      en: |-
        An EC2 compute environment runs the jobs, but the company would maintain the AMI and the instance configuration, which it wants to avoid.
      fr: |-
        Un environnement de calcul EC2 exécute les tâches, mais l'entreprise devrait maintenir l'AMI et la configuration des instances, ce qu'elle veut éviter.
    d:
      en: |-
        The company would have to choose, patch and scale the instances and write the queue-polling logic itself.
      fr: |-
        L'entreprise devrait choisir, corriger et mettre à l'échelle les instances et écrire elle-même la logique d'interrogation de la file d'attente.
references:
  - title: Fargate compute environments - AWS Batch
    url: https://docs.aws.amazon.com/batch/latest/userguide/fargate.html
  - title: Lambda quotas - AWS Lambda
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
