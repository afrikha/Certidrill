id: saac03-3a-storage-optimized-nosql
objective: "3.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed NoSQL database cluster on Amazon EC2. The database needs tens of thousands of low-latency random IOPS per node and the lowest possible storage latency. The database replicates every write to three nodes in different Availability Zones, so the loss of a single node's local data is acceptable.

    Which instance choice will meet these requirements?
  fr: |
    Une entreprise exploite un cluster de bases de données NoSQL autogéré sur Amazon EC2. La base de données exige des dizaines de milliers d'IOPS aléatoires à faible latence par nœud et la latence de stockage la plus faible possible. La base de données réplique chaque écriture sur trois nœuds situés dans des zones de disponibilité différentes : la perte des données locales d'un seul nœud est acceptable.

    Quel choix d'instance répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Storage optimized I-family instances that store the data on their NVMe SSD instance store volumes", fr: "Des instances optimisées pour le stockage de la famille I qui stockent les données sur leurs volumes de stockage d'instance NVMe SSD" }
    - id: b
      text: { en: "Storage optimized D-family instances that store the data on their HDD instance store volumes", fr: "Des instances optimisées pour le stockage de la famille D qui stockent les données sur leurs volumes de stockage d'instance HDD" }
    - id: c
      text: { en: "General purpose M-family instances that store the data on Amazon EBS gp3 volumes", fr: "Des instances à usage général de la famille M qui stockent les données sur des volumes Amazon EBS gp3" }
    - id: d
      text: { en: "Burstable T-family instances that store the data on Amazon EBS st1 volumes", fr: "Des instances à capacité extensible de la famille T qui stockent les données sur des volumes Amazon EBS st1" }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      Storage optimized instances deliver tens of thousands of low-latency random IOPS from local storage, and I-family instances use NVMe SSD instance store volumes attached to the host. Instance store data is lost if the instance stops or fails, which is acceptable because the database replicates each write to other nodes.
    fr: |-
      Les instances optimisées pour le stockage fournissent des dizaines de milliers d'IOPS aléatoires à faible latence depuis un stockage local, et les instances de la famille I utilisent des volumes de stockage d'instance NVMe SSD attachés à l'hôte. Les données du stockage d'instance sont perdues si l'instance s'arrête ou tombe en panne, ce qui est acceptable puisque la base de données réplique chaque écriture sur d'autres nœuds.
  options:
    b:
      en: |-
        D-family HDD instance storage is built for high sequential throughput on dense storage, not for low-latency random IOPS.
      fr: |-
        Le stockage d'instance HDD de la famille D est conçu pour un débit séquentiel élevé sur un stockage dense, pas pour des IOPS aléatoires à faible latence.
    c:
      en: |-
        gp3 volumes are network-attached, so their latency is higher than local NVMe storage, which does not give the lowest possible latency.
      fr: |-
        Les volumes gp3 sont attachés via le réseau : leur latence est supérieure à celle d'un stockage NVMe local, ce qui n'offre pas la latence la plus faible possible.
    d:
      en: |-
        st1 is an HDD volume limited to 500 IOPS for large sequential I/O, and burstable instances do not suit a sustained database workload.
      fr: |-
        st1 est un volume HDD limité à 500 IOPS pour des E/S séquentielles volumineuses, et les instances à capacité extensible ne conviennent pas à une charge de base de données soutenue.
references:
  - title: Specifications for Amazon EC2 storage optimized instances - Amazon EC2
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/so.html
  - title: Data persistence for Amazon EC2 instance store volumes - Amazon Elastic Compute Cloud
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-store-lifetime.html
