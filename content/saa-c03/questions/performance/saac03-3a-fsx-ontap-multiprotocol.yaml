id: saac03-3a-fsx-ontap-multiprotocol
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an on-premises NetApp ONTAP storage cluster. The same volumes are accessed by Linux servers over NFS and by Windows clients over SMB, and several databases use iSCSI LUNs from the cluster. The company wants to move this storage to a fully managed AWS service, replicate the data during the migration by using NetApp SnapMirror, and keep every application on the protocol it uses today.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exploite sur site un cluster de stockage NetApp ONTAP. Les mêmes volumes sont accessibles par des serveurs Linux en NFS et par des clients Windows en SMB, et plusieurs bases de données utilisent des LUN iSCSI du cluster. L'entreprise souhaite déplacer ce stockage vers un service AWS entièrement géré, répliquer les données pendant la migration à l'aide de NetApp SnapMirror et conserver pour chaque application le protocole qu'elle utilise aujourd'hui.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Migrate the volumes to Amazon FSx for NetApp ONTAP and replicate them with SnapMirror.", fr: "Migrer les volumes vers Amazon FSx for NetApp ONTAP et les répliquer avec SnapMirror." }
    - id: b
      text: { en: "Migrate the volumes to Amazon FSx for OpenZFS and replicate them with AWS DataSync.", fr: "Migrer les volumes vers Amazon FSx for OpenZFS et les répliquer avec AWS DataSync." }
    - id: c
      text: { en: "Migrate the NFS data to Amazon EFS and the SMB data to Amazon FSx for Windows File Server.", fr: "Migrer les données NFS vers Amazon EFS et les données SMB vers Amazon FSx for Windows File Server." }
    - id: d
      text: { en: "Migrate the volumes to Amazon FSx for Windows File Server and replicate them with AWS DataSync.", fr: "Migrer les volumes vers Amazon FSx for Windows File Server et les répliquer avec AWS DataSync." }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      FSx for NetApp ONTAP is a fully managed ONTAP file system that gives multi-protocol access to the same data over NFS, SMB, iSCSI and NVMe from Linux, Windows and macOS clients. It supports NetApp SnapMirror, so the on-premises volumes can be replicated to it during the migration.
    fr: |-
      FSx for NetApp ONTAP est un système de fichiers ONTAP entièrement géré qui offre un accès multiprotocole aux mêmes données en NFS, SMB, iSCSI et NVMe depuis des clients Linux, Windows et macOS. Il prend en charge NetApp SnapMirror : les volumes sur site peuvent y être répliqués pendant la migration.
  options:
    b:
      en: |-
        FSx for OpenZFS is accessed over NFS only; it does not serve SMB shares or iSCSI LUNs, and it does not use SnapMirror.
      fr: |-
        FSx for OpenZFS est accessible uniquement en NFS ; il ne sert ni partages SMB ni LUN iSCSI, et n'utilise pas SnapMirror.
    c:
      en: |-
        Splitting the data between two services breaks the shared multi-protocol access to the same volumes, provides no iSCSI LUNs and cannot use SnapMirror.
      fr: |-
        Répartir les données entre deux services supprime l'accès multiprotocole partagé aux mêmes volumes, ne fournit pas de LUN iSCSI et ne permet pas d'utiliser SnapMirror.
    d:
      en: |-
        FSx for Windows File Server serves SMB only, so the Linux NFS clients and the iSCSI databases would have to change protocols.
      fr: |-
        FSx for Windows File Server ne sert que le protocole SMB : les clients Linux NFS et les bases de données iSCSI devraient changer de protocole.
references:
