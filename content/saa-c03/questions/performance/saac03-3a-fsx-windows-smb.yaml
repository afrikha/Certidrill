id: saac03-3a-fsx-windows-smb
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating Windows-based application servers to Amazon EC2. The applications use SMB file shares whose NTFS permissions are granted to Microsoft Active Directory groups. The company wants a fully managed file service that supports native SMB access and Active Directory authentication and that remains available if an Availability Zone fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise migre vers Amazon EC2 des serveurs d'applications Windows. Les applications utilisent des partages de fichiers SMB dont les permissions NTFS sont accordées à des groupes Microsoft Active Directory. L'entreprise souhaite un service de fichiers entièrement géré qui prend en charge l'accès SMB natif et l'authentification Active Directory, et qui reste disponible en cas de défaillance d'une zone de disponibilité.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EFS file system and mount it on the Windows instances.", fr: "Créer un système de fichiers Amazon EFS et le monter sur les instances Windows." }
    - id: b
      text: { en: "Create a Multi-AZ Amazon FSx for Windows File Server file system joined to the Active Directory domain.", fr: "Créer un système de fichiers Amazon FSx for Windows File Server Multi-AZ joint au domaine Active Directory." }
    - id: c
      text: { en: "Create an Amazon FSx for Lustre file system and share it with the Windows instances.", fr: "Créer un système de fichiers Amazon FSx for Lustre et le partager avec les instances Windows." }
    - id: d
      text: { en: "Attach Amazon EBS volumes to a Windows EC2 instance and share its folders over SMB.", fr: "Attacher des volumes Amazon EBS à une instance EC2 Windows et partager ses dossiers en SMB." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      FSx for Windows File Server is a fully managed Windows file server accessed over SMB, joined to an Active Directory domain and using Windows ACLs. The Multi-AZ deployment type keeps a standby file server in another Availability Zone and fails over automatically.
    fr: |-
      FSx for Windows File Server est un serveur de fichiers Windows entièrement géré, accessible en SMB, joint à un domaine Active Directory et utilisant les ACL Windows. Le type de déploiement Multi-AZ maintient un serveur de fichiers de secours dans une autre zone de disponibilité et bascule automatiquement.
  options:
    a:
      en: |-
        Amazon EFS is not supported on Windows-based EC2 instances; it is an NFS file system for Linux.
      fr: |-
        Amazon EFS n'est pas pris en charge sur les instances EC2 Windows ; c'est un système de fichiers NFS pour Linux.
    c:
      en: |-
        FSx for Lustre is a high-performance file system for Linux HPC and ML workloads; it does not provide SMB shares with Active Directory permissions.
      fr: |-
        FSx for Lustre est un système de fichiers hautes performances pour les charges HPC et ML sous Linux ; il ne fournit pas de partages SMB avec des permissions Active Directory.
    d:
      en: |-
        A self-managed file server on one instance is not fully managed, and its EBS volumes live in a single Availability Zone.
      fr: |-
        Un serveur de fichiers autogéré sur une seule instance n'est pas entièrement géré, et ses volumes EBS résident dans une seule zone de disponibilité.
references:
  - title: What is FSx for Windows File Server? - Amazon FSx for Windows File Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
