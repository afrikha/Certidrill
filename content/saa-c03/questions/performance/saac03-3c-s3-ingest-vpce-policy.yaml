id: saac03-3c-s3-ingest-vpce-policy
objective: "3.5.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company ingests sensor files into an Amazon S3 bucket from an application that runs on Amazon EC2 instances in private subnets of a VPC. The security team requires that the upload traffic stay on the AWS network without a NAT device. The bucket must reject every request that does not arrive through the company's designated VPC endpoint.

    Which combination of actions will meet these requirements? (Choose two.)

    Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise ingère des fichiers de capteurs dans un compartiment Amazon S3 depuis une application qui s'exécute sur des instances Amazon EC2 dans les sous-réseaux privés d'un VPC. L'équipe de sécurité exige que le trafic de chargement reste sur le réseau AWS, sans périphérique NAT. Le compartiment S3 doit rejeter toute requête qui n'arrive pas par le point de terminaison de VPC désigné de l'entreprise.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez-en deux.)

    Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable S3 Transfer Acceleration on the bucket so that the uploads use the AWS edge network.", fr: "Activer S3 Transfer Acceleration sur le compartiment afin que les chargements utilisent le réseau périphérique AWS." } }
    - { id: b, text: { en: "Create a gateway VPC endpoint for Amazon S3 and associate it with the route tables of the private subnets.", fr: "Créer un point de terminaison de VPC de passerelle pour Amazon S3 et l'associer aux tables de routage des sous-réseaux privés." } }
    - { id: c, text: { en: "Create a NAT gateway with an Elastic IP address and allow only that address in the bucket policy.", fr: "Créer une passerelle NAT avec une adresse IP Elastic et n'autoriser que cette adresse dans la politique de compartiment." } }
    - { id: d, text: { en: "Add a bucket policy statement that denies all S3 actions when aws:SourceVpce does not equal the endpoint ID.", fr: "Ajouter à la politique de compartiment une instruction qui refuse toutes les actions S3 lorsque aws:SourceVpce n'est pas égal à l'ID du point de terminaison." } }
    - { id: e, text: { en: "Turn on S3 Object Lock in governance mode on the bucket for all uploaded objects.", fr: "Activer S3 Object Lock en mode gouvernance sur le compartiment pour tous les objets chargés." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A gateway VPC endpoint for S3 routes traffic from the private subnets to S3 through the route tables, with no NAT device or internet gateway and at no extra charge. A bucket policy that denies requests whose aws:SourceVpce key does not match the endpoint ID makes the bucket reject anything that does not come through that endpoint.
    fr: "Un point de terminaison de VPC de passerelle pour S3 achemine le trafic des sous-réseaux privés vers S3 via les tables de routage, sans périphérique NAT ni passerelle Internet et sans frais supplémentaires. Une politique de compartiment qui refuse les requêtes dont la clé aws:SourceVpce ne correspond pas à l'ID du point de terminaison fait rejeter par le compartiment tout ce qui ne passe pas par ce point de terminaison."
  options:
    a: { en: "Transfer Acceleration speeds up long-distance uploads through CloudFront edge locations over the internet; it does not keep traffic inside the VPC.", fr: "Transfer Acceleration accélère les chargements longue distance via les emplacements périphériques CloudFront sur Internet ; il ne garde pas le trafic dans le VPC." }
    c: { en: "The requirements exclude a NAT device, and traffic through it reaches the public S3 endpoint instead of a VPC endpoint.", fr: "Les exigences excluent tout périphérique NAT, et le trafic qui le traverse atteint le point de terminaison public de S3 plutôt qu'un point de terminaison de VPC." }
    e: { en: "Object Lock prevents objects from being deleted or overwritten; it does not control the network path of requests.", fr: "Object Lock empêche la suppression ou l'écrasement des objets ; il ne contrôle pas le chemin réseau des requêtes." }
references:
  - title: Controlling access from VPC endpoints with bucket policies
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies-vpc-endpoint.html
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
