id: saac03-3b-dax-microsecond
objective: "3.3.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A sports betting company stores odds in an Amazon DynamoDB table. The same items are read thousands of times per second, and the application can use eventually consistent reads. A new feature requires read latency in microseconds instead of milliseconds. The developers want to make only minimal changes to the existing DynamoDB code.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de paris sportifs stocke des cotes dans une table Amazon DynamoDB. Les mêmes éléments sont lus des milliers de fois par seconde, et l'application peut utiliser des lectures à cohérence éventuelle. Une nouvelle fonctionnalité exige une latence de lecture de l'ordre de la microseconde au lieu de la milliseconde. Les développeurs veulent n'apporter que des modifications minimales au code DynamoDB existant.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an Amazon ElastiCache for Valkey cluster and implement lazy loading in the application.", fr: "Ajouter un cluster Amazon ElastiCache for Valkey et implémenter le chargement différé dans l'application." }
    - id: b
      text: { en: "Increase the read capacity of the table so that reads are served faster.", fr: "Augmenter la capacité de lecture de la table afin que les lectures soient servies plus rapidement." }
    - id: c
      text: { en: "Create a DynamoDB Accelerator (DAX) cluster and switch the application to the DAX client.", fr: "Créer un cluster DynamoDB Accelerator (DAX) et faire passer l'application au client DAX." }
    - id: d
      text: { en: "Convert the table to a global table with a replica in a second AWS Region.", fr: "Convertir la table en table globale avec un réplica dans une deuxième Région AWS." }
answer: { optionId: c }
explanation:
  correct:
    en: DAX is a DynamoDB-compatible in-memory cache that reduces eventually consistent read latency from milliseconds to microseconds. Its API is compatible with DynamoDB, so the application only changes its client, and repeated reads of the same keys give a high cache hit rate.
    fr: DAX est un cache en mémoire compatible avec DynamoDB qui réduit la latence des lectures à cohérence éventuelle de la milliseconde à la microseconde. Son API est compatible avec DynamoDB ; l'application change donc seulement de client, et les lectures répétées des mêmes clés donnent un taux de succès du cache élevé.
  options:
    a:
      en: ElastiCache can reach microseconds, but the application must implement and maintain the caching logic itself, which is more than a minimal change.
      fr: ElastiCache peut atteindre la microseconde, mais l'application doit implémenter et maintenir elle-même la logique de cache, ce qui dépasse une modification minimale.
    b:
      en: More capacity prevents throttling but does not change DynamoDB's single-digit millisecond latency.
      fr: Plus de capacité évite la limitation mais ne change pas la latence de quelques millisecondes de DynamoDB.
    d:
      en: A replica in another Region helps users near that Region, but reads still have millisecond latency.
      fr: Un réplica dans une autre Région aide les utilisateurs proches de cette Région, mais les lectures gardent une latence de l'ordre de la milliseconde.
references:
  - title: In-memory acceleration with DynamoDB Accelerator (DAX)
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
