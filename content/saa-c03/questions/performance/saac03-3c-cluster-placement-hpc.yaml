id: saac03-3c-cluster-placement-hpc
objective: "3.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A research company runs a tightly coupled computational fluid dynamics simulation on 16 Amazon EC2 instances. During each run, the instances exchange large volumes of data with each other, and the simulation time depends mostly on network latency between the nodes.

    The company needs the lowest possible latency and the highest throughput between the instances.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de recherche exécute une simulation de mécanique des fluides fortement couplée sur 16 instances Amazon EC2. Pendant chaque exécution, les instances échangent de gros volumes de données entre elles, et la durée de la simulation dépend surtout de la latence réseau entre les nœuds.

    L'entreprise a besoin de la latence la plus faible possible et du débit le plus élevé entre les instances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Launch the instances in a spread placement group across three Availability Zones.", fr: "Lancer les instances dans un groupe de placement de répartition (spread) sur trois zones de disponibilité." } }
    - { id: b, text: { en: "Launch the instances in a cluster placement group in a single Availability Zone.", fr: "Lancer les instances dans un groupe de placement de cluster (cluster) dans une seule zone de disponibilité." } }
    - { id: c, text: { en: "Launch the instances in a partition placement group with one partition in each Availability Zone.", fr: "Lancer les instances dans un groupe de placement de partition (partition) avec une partition par zone de disponibilité." } }
    - { id: d, text: { en: "Launch the instances in an Auto Scaling group across three Availability Zones behind a Network Load Balancer.", fr: "Lancer les instances dans un Auto Scaling group sur trois zones de disponibilité derrière un Network Load Balancer." } }
answer: { optionId: b }
explanation:
  correct:
    en: A cluster placement group packs instances close together inside one Availability Zone to give low network latency and high throughput between them. It is the strategy for tightly coupled HPC workloads in which most traffic flows between the instances of the group.
    fr: "Un groupe de placement de cluster regroupe les instances à proximité les unes des autres dans une seule zone de disponibilité pour offrir une faible latence réseau et un débit élevé entre elles. C'est la stratégie adaptée aux charges HPC fortement couplées, dont l'essentiel du trafic circule entre les instances du groupe."
  options:
    a: { en: "A spread placement group puts each instance on distinct hardware to limit correlated failures (seven running instances per Availability Zone at most); spreading across zones adds latency.", fr: "Un groupe de placement de répartition place chaque instance sur un matériel distinct pour limiter les pannes corrélées (sept instances en cours d'exécution au plus par zone de disponibilité) ; répartir sur plusieurs zones ajoute de la latence." }
    c: { en: "Partition placement groups isolate groups of instances on separate racks for large replicated workloads such as HDFS or Cassandra; they do not minimize latency.", fr: "Les groupes de placement de partition isolent des groupes d'instances sur des racks distincts pour de grandes charges répliquées comme HDFS ou Cassandra ; ils ne réduisent pas la latence." }
    d: { en: "A load balancer distributes client traffic; it does nothing for traffic between the nodes, and spreading them across zones increases latency.", fr: "Un équilibreur de charge distribue le trafic des clients ; il n'agit pas sur le trafic entre les nœuds, et les répartir sur plusieurs zones augmente la latence." }
references:
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
