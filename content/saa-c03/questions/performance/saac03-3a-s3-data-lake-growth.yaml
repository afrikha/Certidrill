id: saac03-3a-s3-data-lake-growth
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company collects clickstream data that currently totals 40 TB. The volume is expected to grow unpredictably to several petabytes over the next three years. Analysts will query the data with Amazon Athena and process it with Amazon EMR. The company does not want to plan or provision storage capacity.

    Which storage service will meet these requirements?
  fr: |
    Une entreprise de distribution collecte des données de parcours de navigation (clickstream) qui totalisent actuellement 40 To. Ce volume devrait croître de manière imprévisible jusqu'à plusieurs pétaoctets au cours des trois prochaines années. Les analystes interrogeront les données avec Amazon Athena et les traiteront avec Amazon EMR. L'entreprise ne souhaite ni planifier ni provisionner de capacité de stockage.

    Quel service de stockage répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon EBS Throughput Optimized HDD (st1) volumes attached to an EC2 instance", fr: "Des volumes Amazon EBS HDD à débit optimisé (st1) attachés à une instance EC2" }
    - id: b
      text: { en: "An Amazon FSx for Lustre file system", fr: "Un système de fichiers Amazon FSx for Lustre" }
    - id: c
      text: { en: "An Amazon EFS file system", fr: "Un système de fichiers Amazon EFS" }
    - id: d
      text: { en: "Amazon S3", fr: "Amazon S3" }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Amazon S3 stores a virtually unlimited amount of data with no capacity to provision, and there is no limit on the number of prefixes or objects in a bucket. Athena queries data in place in S3, and EMR reads and writes S3 directly, so S3 is the natural data lake storage.
    fr: |-
      Amazon S3 stocke une quantité de données pratiquement illimitée sans capacité à provisionner, et le nombre de préfixes ou d'objets d'un compartiment n'est pas limité. Athena interroge les données directement dans S3, et EMR lit et écrit directement dans S3 : S3 est donc le stockage naturel d'un lac de données.
  options:
    a:
      en: |-
        EBS volumes have a fixed provisioned size (st1 up to 16 TiB each), must be attached to instances and resized by the company, and Athena cannot query them.
      fr: |-
        Les volumes EBS ont une taille provisionnée fixe (jusqu'à 16 Tio chacun pour st1), doivent être attachés à des instances et redimensionnés par l'entreprise, et Athena ne peut pas les interroger.
    b:
      en: |-
        FSx for Lustre requires the company to provision storage capacity, and Athena does not query it.
      fr: |-
        FSx for Lustre exige que l'entreprise provisionne une capacité de stockage, et Athena ne l'interroge pas.
    c:
      en: |-
        EFS grows automatically, but Athena does not query data stored in EFS, and file storage costs more than object storage at petabyte scale.
      fr: |-
        EFS croît automatiquement, mais Athena n'interroge pas les données stockées dans EFS, et le stockage de fichiers coûte plus cher que le stockage d'objets à l'échelle du pétaoctet.
references:
  - title: "Best practices design patterns: optimizing Amazon S3 performance - Amazon Simple Storage Service"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/optimizing-performance.html
  - title: What is Amazon S3? - Amazon Simple Storage Service
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html
