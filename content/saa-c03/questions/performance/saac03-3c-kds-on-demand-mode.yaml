id: saac03-3c-kds-on-demand-mode
objective: "3.5.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is launching a new mobile application that sends events to an Amazon Kinesis data stream. Traffic is unpredictable: it is close to zero at night and can spike sharply after marketing campaigns. The team does not want to plan capacity or manage shards, and it does not want to pay for peak capacity that it uses only occasionally.

    How should the company configure the data stream?
  fr: |
    Une entreprise lance une nouvelle application mobile qui envoie des événements à un flux de données Amazon Kinesis. Le trafic est imprévisible : il est proche de zéro la nuit et peut augmenter fortement après les campagnes marketing. L'équipe ne veut ni planifier la capacité ni gérer de partitions (shards), et ne veut pas payer une capacité de pointe qu'elle n'utilise qu'occasionnellement.

    Comment l'entreprise doit-elle configurer le flux de données ?
body:
  options:
    - { id: a, text: { en: "Use provisioned capacity mode with enough shards for the highest expected peak.", fr: "Utiliser le mode de capacité provisionné avec suffisamment de partitions pour la pointe la plus élevée prévue." } }
    - { id: b, text: { en: "Use provisioned capacity mode and a scheduled AWS Lambda function that calls UpdateShardCount.", fr: "Utiliser le mode de capacité provisionné et une fonction AWS Lambda planifiée qui appelle UpdateShardCount." } }
    - { id: c, text: { en: "Use provisioned capacity mode and increase the data retention period to absorb the spikes.", fr: "Utiliser le mode de capacité provisionné et augmenter la période de conservation des données pour absorber les pics." } }
    - { id: d, text: { en: "Use on-demand capacity mode (On-demand Standard) so that the stream scales automatically.", fr: "Utiliser le mode de capacité à la demande (On-demand Standard) afin que le flux s'adapte automatiquement." } }
answer: { optionId: d }
explanation:
  correct:
    en: In On-demand Standard mode, Kinesis Data Streams manages capacity and scales automatically, with billing per GB written and read. AWS recommends it for highly variable or unpredictable traffic, so the team neither plans shards nor pays for idle peak capacity.
    fr: "En mode On-demand Standard, Kinesis Data Streams gère la capacité et s'adapte automatiquement, avec une facturation par Go écrit et lu. AWS le recommande pour un trafic très variable ou imprévisible : l'équipe ne planifie pas de partitions et ne paie pas de capacité de pointe inutilisée."
  options:
    a: { en: "Sizing for the peak means paying for that capacity all the time, even at night.", fr: "Dimensionner pour la pointe revient à payer cette capacité en permanence, même la nuit." }
    b: { en: "A custom scaling function is capacity management the team wants to avoid, and fixed schedules miss unpredictable spikes.", fr: "Une fonction de mise à l'échelle maison est une gestion de capacité que l'équipe veut éviter, et des horaires fixes ratent les pics imprévisibles." }
    c: { en: "Retention controls how long records are kept; it does not raise the write capacity of the shards.", fr: "La conservation détermine la durée de stockage des enregistrements ; elle n'augmente pas la capacité d'écriture des partitions." }
references:
  - title: Choose the right mode to stream in
    url: https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html
