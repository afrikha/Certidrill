id: saac03-3b-apigw-stage-cache
objective: "3.3.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exposes product details through an Amazon API Gateway REST API backed by AWS Lambda. Most requests are identical GET requests, and the responses can be up to 5 minutes old. The company wants to reduce the number of Lambda invocations and the response latency with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose les détails de ses produits via une API REST Amazon API Gateway reposant sur AWS Lambda. La plupart des requêtes sont des requêtes GET identiques, et les réponses peuvent avoir jusqu'à 5 minutes. L'entreprise veut réduire le nombre d'invocations Lambda et la latence des réponses avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure provisioned concurrency on the Lambda function.", fr: "Configurer la simultanéité provisionnée sur la fonction Lambda." }
    - id: b
      text: { en: "Enable API caching on the API Gateway stage with a TTL of 300 seconds.", fr: "Activer la mise en cache de l'API sur l'étape API Gateway avec une TTL de 300 secondes." }
    - id: c
      text: { en: "Add an Amazon ElastiCache cluster that the Lambda function queries before the database.", fr: "Ajouter un cluster Amazon ElastiCache que la fonction Lambda interroge avant la base de données." }
    - id: d
      text: { en: "Increase the memory setting of the Lambda function.", fr: "Augmenter le paramètre de mémoire de la fonction Lambda." }
answer: { optionId: b }
explanation:
  correct:
    en: API Gateway caching stores endpoint responses on the stage for a TTL (default 300 seconds, maximum 3,600), and by default caches GET methods. Cached requests are answered by API Gateway without invoking the backend, which reduces both latency and Lambda invocations with a stage setting.
    fr: La mise en cache API Gateway conserve les réponses du point de terminaison sur l'étape pendant une TTL (300 secondes par défaut, 3 600 au maximum) et met en cache par défaut les méthodes GET. Les requêtes en cache reçoivent une réponse d'API Gateway sans invoquer le backend, ce qui réduit la latence et les invocations Lambda par un simple paramètre d'étape.
  options:
    a:
      en: Provisioned concurrency reduces cold starts, but every request still invokes the function.
      fr: La simultanéité provisionnée réduit les démarrages à froid, mais chaque requête invoque toujours la fonction.
    c:
      en: The function is still invoked for every request, and the cache cluster and its code add operational overhead.
      fr: La fonction est toujours invoquée pour chaque requête, et le cluster de cache et son code ajoutent de la charge opérationnelle.
    d:
      en: More memory can shorten each invocation but does not reduce the number of invocations.
      fr: Plus de mémoire peut raccourcir chaque invocation mais ne réduit pas le nombre d'invocations.
references:
  - title: Cache settings for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-caching.html
