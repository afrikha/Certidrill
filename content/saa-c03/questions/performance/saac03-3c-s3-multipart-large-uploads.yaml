id: saac03-3c-s3-multipart-large-uploads
objective: "3.5.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company uploads video files of 2 GB to 40 GB from its studio to an Amazon S3 bucket over a high-bandwidth connection. Each file is sent in a single upload request. The uploads do not use the available bandwidth, and a network error forces the company to restart the whole file.

    Which solution will increase upload throughput and reduce the impact of network errors?
  fr: |
    Une entreprise de médias charge depuis son studio des fichiers vidéo de 2 Go à 40 Go dans un compartiment Amazon S3, via une connexion à haut débit. Chaque fichier est envoyé en une seule requête de chargement. Les chargements n'exploitent pas la bande passante disponible, et une erreur réseau oblige l'entreprise à recommencer le fichier entier.

    Quelle solution augmente le débit des chargements et réduit l'impact des erreurs réseau ?
body:
  options:
    - { id: a, text: { en: "Compress each file before the upload and keep sending it in a single PutObject request.", fr: "Compresser chaque fichier avant le chargement et continuer à l'envoyer en une seule requête PutObject." } }
    - { id: b, text: { en: "Use multipart upload to split each file into parts and upload the parts in parallel.", fr: "Utiliser le chargement partitionné (multipart upload) pour découper chaque fichier en parties et charger les parties en parallèle." } }
    - { id: c, text: { en: "Upload the files to the S3 One Zone-IA storage class instead of S3 Standard.", fr: "Charger les fichiers dans la classe de stockage S3 One Zone-IA au lieu de S3 Standard." } }
    - { id: d, text: { en: "Enable S3 Versioning on the bucket so that interrupted uploads are kept as earlier versions.", fr: "Activer la gestion des versions S3 sur le compartiment afin que les chargements interrompus soient conservés comme versions antérieures." } }
answer: { optionId: b }
explanation:
  correct:
    en: AWS recommends multipart upload for objects of 100 MB or more. Parts are uploaded in parallel to improve throughput, and a network error requires resending only the failed part instead of the whole file.
    fr: "AWS recommande le chargement partitionné pour les objets de 100 Mo ou plus. Les parties sont chargées en parallèle pour améliorer le débit, et une erreur réseau n'oblige à renvoyer que la partie en échec au lieu du fichier entier."
  options:
    a: { en: "Video is already compressed, and a single request still uses one stream and must restart from the beginning after an error.", fr: "La vidéo est déjà compressée, et une requête unique utilise toujours un seul flux et doit repartir du début après une erreur." }
    c: { en: "The storage class changes storage price and resilience, not upload speed or error recovery.", fr: "La classe de stockage change le prix et la résilience du stockage, pas la vitesse de chargement ni la reprise après erreur." }
    d: { en: "Versioning keeps versions of completed objects; a failed single upload creates no object to keep.", fr: "La gestion des versions conserve les versions d'objets complets ; un chargement unique en échec ne crée aucun objet à conserver." }
references:
  - title: Uploading and copying objects using multipart upload in Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html
