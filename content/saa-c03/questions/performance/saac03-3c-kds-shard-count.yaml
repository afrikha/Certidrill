id: saac03-3c-kds-shard-count
objective: "3.5.6"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    A company is creating an Amazon Kinesis data stream in provisioned capacity mode. Producers will write 4,000 records per second with an average record size of 3 KiB. Two consumer applications will each read all the data with the standard GetRecords API (shared throughput). The company wants the MOST cost-effective number of shards that avoids throttling.

    How many shards should the stream have?
  fr: |
    Une entreprise crée un flux de données Amazon Kinesis en mode de capacité provisionné. Les producteurs écriront 4 000 enregistrements par seconde, d'une taille moyenne de 3 Kio. Deux applications consommatrices liront chacune toutes les données avec l'API standard GetRecords (débit partagé). L'entreprise souhaite le nombre de partitions (shards) le plus économique qui évite toute limitation.

    Combien de partitions le flux doit-il avoir ?
body:
  options:
    - { id: a, text: "4" }
    - { id: b, text: "6" }
    - { id: c, text: "12" }
    - { id: d, text: "24" }
answer: { optionId: c }
explanation:
  correct:
    en: "Each shard accepts 1 MiB/s or 1,000 records/s of writes and serves 2 MiB/s of shared reads. Writes are 4,000 × 3 KiB = 12,000 KiB/s, about 11.7 MiB/s, so 12 shards are needed; reads are 2 × 11.7 = 23.4 MiB/s, which 12 shards (24 MiB/s) also cover. The 4,000 records/s need only 4 shards, so bandwidth decides: 12 shards."
    fr: "Chaque partition accepte 1 Mio/s ou 1 000 enregistrements/s en écriture et fournit 2 Mio/s de lecture partagée. Les écritures représentent 4 000 × 3 Kio = 12 000 Kio/s, soit environ 11,7 Mio/s : il faut 12 partitions ; les lectures représentent 2 × 11,7 = 23,4 Mio/s, que 12 partitions (24 Mio/s) couvrent aussi. Les 4 000 enregistrements/s ne demandent que 4 partitions : c'est le débit qui décide, soit 12 partitions."
  options:
    a: { en: "Four shards cover the record rate only; they accept 4 MiB/s of writes, far below the 11.7 MiB/s produced.", fr: "Quatre partitions ne couvrent que le nombre d'enregistrements ; elles acceptent 4 Mio/s en écriture, bien moins que les 11,7 Mio/s produits." }
    b: { en: "Six shards would be enough for 12 MiB/s of reads, but the write limit is 1 MiB/s per shard, so writes would be throttled.", fr: "Six partitions suffiraient pour 12 Mio/s de lecture, mais la limite d'écriture est de 1 Mio/s par partition : les écritures seraient limitées." }
    d: { en: "The two consumers share the 2 MiB/s read capacity of each shard; 12 shards already serve 24 MiB/s, so doubling the count only adds cost.", fr: "Les deux consommateurs partagent les 2 Mio/s de lecture de chaque partition ; 12 partitions fournissent déjà 24 Mio/s, doubler leur nombre ne fait qu'ajouter du coût." }
references:
  - title: Choose the right mode to stream in
    url: https://docs.aws.amazon.com/streams/latest/dev/how-do-i-size-a-stream.html
  - title: Quotas and limits
    url: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
