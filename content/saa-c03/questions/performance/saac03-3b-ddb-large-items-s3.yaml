id: saac03-3b-ddb-large-items-s3
objective: "3.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A real estate company stores property listings in an Amazon DynamoDB table. The application now embeds each listing's high-resolution photos, about 2 MB in total, directly in the item, and these writes fail with a ValidationException. The listing metadata must remain queryable in DynamoDB.

    Which solution will meet these requirements?
  fr: |
    Une entreprise immobilière stocke des annonces dans une table Amazon DynamoDB. L'application intègre désormais les photos haute résolution de chaque annonce, environ 2 Mo au total, directement dans l'élément, et ces écritures échouent avec une ValidationException. Les métadonnées des annonces doivent rester interrogeables dans DynamoDB.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the photos as objects in Amazon S3 and save each object key in the listing item.", fr: "Stocker les photos sous forme d'objets dans Amazon S3 et enregistrer la clé de chaque objet dans l'élément de l'annonce." }
    - id: b
      text: { en: "Switch the table to on-demand capacity mode so that large writes are not limited.", fr: "Passer la table en mode de capacité à la demande afin que les écritures volumineuses ne soient pas limitées." }
    - id: c
      text: { en: "Increase the provisioned write capacity of the table to cover 2 MB writes.", fr: "Augmenter la capacité d'écriture provisionnée de la table pour couvrir des écritures de 2 Mo." }
    - id: d
      text: { en: "Put a DynamoDB Accelerator (DAX) cluster in front of the table to buffer the large writes.", fr: "Placer un cluster DynamoDB Accelerator (DAX) devant la table pour mettre en mémoire tampon les écritures volumineuses." }
answer: { optionId: a }
explanation:
  correct:
    en: DynamoDB limits each item to 400 KB, and larger writes fail with a ValidationException. The recommended pattern stores large values in Amazon S3 and keeps the object identifier in the item, so the metadata stays in DynamoDB while the photos live in S3.
    fr: DynamoDB limite chaque élément à 400 Ko, et les écritures plus volumineuses échouent avec une ValidationException. Le modèle recommandé stocke les valeurs volumineuses dans Amazon S3 et conserve l'identifiant de l'objet dans l'élément ; les métadonnées restent dans DynamoDB tandis que les photos sont dans S3.
  options:
    b:
      en: The capacity mode does not change the 400 KB item size limit, so the writes still fail.
      fr: Le mode de capacité ne modifie pas la limite de 400 Ko par élément ; les écritures échouent donc toujours.
    c:
      en: More capacity units do not raise the maximum item size; the error is a size validation, not throttling.
      fr: Davantage d'unités de capacité n'augmente pas la taille maximale d'un élément ; l'erreur est une validation de taille, pas une limitation de débit.
    d:
      en: DAX is a read cache that passes writes through to DynamoDB, so the item size limit still applies.
      fr: DAX est un cache de lecture qui transmet les écritures à DynamoDB ; la limite de taille des éléments s'applique donc toujours.
references:
  - title: Best practices for storing large items and attributes in DynamoDB
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-use-s3-too.html
