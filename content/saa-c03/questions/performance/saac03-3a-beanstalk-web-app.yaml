id: saac03-3a-beanstalk-web-app
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small development team has built a Java web application. The team wants to upload the application code and have AWS provision the Amazon EC2 instances, load balancing, automatic scaling and health monitoring. The team wants to keep access to the underlying resources in its account and to avoid writing infrastructure templates.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une petite équipe de développement a créé une application web Java. L'équipe souhaite charger le code de l'application et laisser AWS provisionner les instances Amazon EC2, la répartition de charge, la mise à l'échelle automatique et la surveillance de l'état. L'équipe veut conserver l'accès aux ressources sous-jacentes de son compte et éviter d'écrire des modèles d'infrastructure.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Write an AWS CloudFormation template that creates an Application Load Balancer and an Auto Scaling group.", fr: "Écrire un modèle AWS CloudFormation qui crée un Application Load Balancer et un groupe Auto Scaling." }
    - id: b
      text: { en: "Deploy the application to an AWS Elastic Beanstalk environment.", fr: "Déployer l'application dans un environnement AWS Elastic Beanstalk." }
    - id: c
      text: { en: "Create the load balancer, launch template and Auto Scaling group manually in the console.", fr: "Créer manuellement dans la console l'équilibreur de charge, le modèle de lancement et le groupe Auto Scaling." }
    - id: d
      text: { en: "Package the application as a container and run it as an AWS Batch job.", fr: "Empaqueter l'application dans un conteneur et l'exécuter comme une tâche AWS Batch." }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      Elastic Beanstalk takes an uploaded source bundle and creates the environment for it, including EC2 instances, load balancing, scaling and health monitoring. The resources stay in the team's account, and Elastic Beanstalk itself has no additional charge.
    fr: |-
      Elastic Beanstalk prend un bundle source chargé et crée l'environnement correspondant, avec instances EC2, répartition de charge, mise à l'échelle et surveillance de l'état. Les ressources restent dans le compte de l'équipe, et Elastic Beanstalk lui-même n'entraîne aucun coût supplémentaire.
  options:
    a:
      en: |-
        A CloudFormation template works, but the team wants to avoid writing infrastructure templates and would also have to build the deployment process.
      fr: |-
        Un modèle CloudFormation fonctionne, mais l'équipe veut éviter d'écrire des modèles d'infrastructure et devrait aussi créer le processus de déploiement.
    c:
      en: |-
        Building each resource by hand and deploying code to the instances creates far more operational work than a managed platform.
      fr: |-
        Créer chaque ressource manuellement et déployer le code sur les instances représente beaucoup plus de travail opérationnel qu'une plateforme gérée.
    d:
      en: |-
        AWS Batch runs jobs that finish; it does not host a long-running web application behind a load balancer.
      fr: |-
        AWS Batch exécute des tâches qui se terminent ; il n'héberge pas d'application web permanente derrière un équilibreur de charge.
references:
  - title: What is AWS Elastic Beanstalk? - AWS Elastic Beanstalk
    url: https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html
