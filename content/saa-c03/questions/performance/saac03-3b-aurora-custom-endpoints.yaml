id: saac03-3b-aurora-custom-endpoints
objective: "3.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon Aurora PostgreSQL DB cluster with a writer, three db.r6g.large Aurora Replicas that serve application reads, and two db.r6g.4xlarge Aurora Replicas added for analytical reports. Reports must run only on the two large replicas, and application reads must never reach the large replicas. Both workloads must keep working if one replica of their group fails.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un cluster de bases de données Amazon Aurora PostgreSQL avec une instance d'écriture, trois réplicas Aurora db.r6g.large qui servent les lectures de l'application, et deux réplicas Aurora db.r6g.4xlarge ajoutés pour des rapports analytiques. Les rapports doivent s'exécuter uniquement sur les deux grands réplicas, et les lectures de l'application ne doivent jamais atteindre les grands réplicas. Les deux charges de travail doivent continuer à fonctionner si un réplica de leur groupe tombe en panne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send reports to the reader endpoint and send application reads to the cluster endpoint of the DB cluster.", fr: "Envoyer les rapports au point de terminaison du lecteur et les lectures de l'application au point de terminaison du cluster de bases de données." }
    - id: b
      text: { en: "Create a custom endpoint for the two large replicas (reports) and another for the three small replicas (application).", fr: "Créer un point de terminaison personnalisé pour les deux grands réplicas (rapports) et un autre pour les trois petits réplicas (application)." }
    - id: c
      text: { en: "Send reports to the instance endpoint of one large replica and send application reads to the reader endpoint.", fr: "Envoyer les rapports au point de terminaison d'instance d'un grand réplica et les lectures de l'application au point de terminaison du lecteur." }
    - id: d
      text: { en: "Create an Amazon RDS Proxy for the cluster and send both workloads to the read-only endpoint of the proxy.", fr: "Créer un Amazon RDS Proxy pour le cluster et envoyer les deux charges de travail au point de terminaison en lecture seule du proxy." }
answer: { optionId: b }
explanation:
  correct:
    en: A custom endpoint load-balances connections across a chosen subset of DB instances, which is designed for clusters whose instances have different capacities. One custom endpoint per group isolates the workloads, and each endpoint still works if one of its members fails.
    fr: Un point de terminaison personnalisé répartit les connexions entre un sous-ensemble choisi d'instances, ce qui est prévu pour les clusters dont les instances ont des capacités différentes. Un point de terminaison personnalisé par groupe isole les charges de travail, et chacun continue de fonctionner si l'un de ses membres tombe en panne.
  options:
    a:
      en: The reader endpoint balances across all replicas, so reports would also run on the small replicas, and the cluster endpoint sends application reads to the writer.
      fr: Le point de terminaison du lecteur répartit la charge entre tous les réplicas ; les rapports s'exécuteraient donc aussi sur les petits réplicas, et le point de terminaison du cluster envoie les lectures de l'application à l'instance d'écriture.
    c:
      en: An instance endpoint targets one instance and does not fail over, and the reader endpoint would still send application reads to the large replicas.
      fr: Un point de terminaison d'instance cible une seule instance et ne bascule pas, et le point de terminaison du lecteur enverrait toujours des lectures de l'application aux grands réplicas.
    d:
      en: A single read-only endpoint spreads both workloads over all replicas, so it cannot keep reports and application reads on separate instances.
      fr: Un seul point de terminaison en lecture seule répartit les deux charges de travail sur tous les réplicas ; il ne peut donc pas maintenir les rapports et les lectures de l'application sur des instances distinctes.
references:
  - title: Amazon Aurora endpoint connections
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html
