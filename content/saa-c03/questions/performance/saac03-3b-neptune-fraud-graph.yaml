id: saac03-3b-neptune-fraud-graph
objective: "3.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payments company wants to detect fraud rings by following relationships between accounts, devices, cards and transactions. Typical queries traverse several hops of connections, for example accounts that share a device with an account that shares a card with a known fraudster. The queries must return in milliseconds over billions of relationships, and the database must be fully managed.

    Which database service will meet these requirements?
  fr: |
    Une entreprise de paiement veut détecter des réseaux de fraude en suivant les relations entre comptes, appareils, cartes et transactions. Les requêtes types parcourent plusieurs niveaux de connexions, par exemple les comptes qui partagent un appareil avec un compte qui partage une carte avec un fraudeur connu. Les requêtes doivent répondre en quelques millisecondes sur des milliards de relations, et la base de données doit être entièrement gérée.

    Quel service de base de données répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon Redshift" }
    - { id: b, text: "Amazon Keyspaces (for Apache Cassandra)" }
    - { id: c, text: "Amazon DynamoDB" }
    - { id: d, text: "Amazon Neptune" }
answer: { optionId: d }
explanation:
  correct:
    en: Neptune is a fully managed graph database built to store billions of relationships and query them with millisecond latency by using Gremlin, openCypher or SPARQL. Fraud detection over multi-hop relationships is one of its core use cases.
    fr: Neptune est une base de données orientée graphe entièrement gérée, conçue pour stocker des milliards de relations et les interroger avec une latence de l'ordre de la milliseconde à l'aide de Gremlin, openCypher ou SPARQL. La détection de fraude sur des relations à plusieurs niveaux fait partie de ses cas d'utilisation principaux.
  options:
    a:
      en: Redshift is a data warehouse for analytical SQL over large datasets; recursive multi-hop traversals are neither its model nor a millisecond operation there.
      fr: Redshift est un entrepôt de données pour des requêtes SQL analytiques sur de grands jeux de données ; les parcours récursifs à plusieurs niveaux ne correspondent pas à son modèle et n'y sont pas des opérations de l'ordre de la milliseconde.
    b:
      en: Keyspaces is a wide-column database queried by partition key; following chains of relationships would require many round trips coded in the application.
      fr: Keyspaces est une base de données à colonnes larges interrogée par clé de partition ; suivre des chaînes de relations demanderait de nombreux allers-retours codés dans l'application.
    c:
      en: DynamoDB is a key-value and document database without joins; each hop would be a separate request assembled by the application.
      fr: DynamoDB est une base de données clé-valeur et de documents sans jointures ; chaque niveau serait une requête distincte assemblée par l'application.
references:
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
