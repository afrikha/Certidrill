id: saac03-3c-ipam-multi-account
objective: "3.4.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Organizations with 200 accounts in four AWS Regions and expects to reach 500 accounts. Application teams choose the CIDR blocks of their VPCs themselves. Several VPCs could not be connected to the corporate transit gateway because their CIDR blocks overlap with existing networks.

    The network team must automatically assign non-overlapping CIDR blocks to new VPCs according to central rules and monitor IP address usage across the organization, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise utilise AWS Organizations avec 200 comptes répartis dans quatre Régions AWS et prévoit d'atteindre 500 comptes. Les équipes applicatives choisissent elles-mêmes les blocs d'adresse CIDR de leurs VPC. Plusieurs VPC n'ont pas pu être reliés à la passerelle de transit de l'entreprise, car leurs blocs d'adresse CIDR chevauchent des réseaux existants.

    L'équipe réseau doit attribuer automatiquement des blocs d'adresse CIDR sans chevauchement aux nouveaux VPC selon des règles centrales et surveiller l'utilisation des adresses IP dans toute l'organisation, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Deploy an AWS Config rule in every account that detects VPCs with overlapping CIDR blocks and notifies the network team.", fr: "Déployer dans chaque compte une règle AWS Config qui détecte les VPC dont les blocs d'adresse CIDR se chevauchent et avertit l'équipe réseau." } }
    - { id: b, text: { en: "Store allocated CIDR blocks in an Amazon DynamoDB table and have teams call an AWS Lambda function that returns a free block.", fr: "Stocker les blocs d'adresse CIDR attribués dans une table Amazon DynamoDB et faire appeler par les équipes une fonction AWS Lambda qui renvoie un bloc libre." } }
    - { id: c, text: { en: "Create one transit gateway route table per team so that teams can keep choosing overlapping CIDR blocks.", fr: "Créer une table de routage de passerelle de transit par équipe afin que les équipes puissent continuer à choisir des blocs d'adresse CIDR qui se chevauchent." } }
    - { id: d, text: { en: "Use Amazon VPC IP Address Manager (IPAM) integrated with AWS Organizations, with Regional pools that allocate CIDR blocks to new VPCs.", fr: "Utiliser Amazon VPC IP Address Manager (IPAM) intégré à AWS Organizations, avec des pools régionaux qui attribuent les blocs d'adresse CIDR aux nouveaux VPC." } }
answer: { optionId: d }
explanation:
  correct:
    en: Amazon VPC IPAM organizes the address space into pools, automatically allocates CIDR blocks to VPCs according to allocation rules, and monitors IP address usage. Its integration with AWS Organizations extends this management to every account, so the company gets central, rule-based allocation without custom code.
    fr: "Amazon VPC IPAM organise l'espace d'adressage en pools, attribue automatiquement des blocs d'adresse CIDR aux VPC selon des règles d'allocation et surveille l'utilisation des adresses IP. Son intégration à AWS Organizations étend cette gestion à tous les comptes : l'entreprise obtient une attribution centrale fondée sur des règles, sans code personnalisé."
  options:
    a: { en: "AWS Config only detects the problem after the VPC exists; it does not assign CIDR blocks.", fr: "AWS Config détecte seulement le problème une fois le VPC créé ; il n'attribue aucun bloc d'adresse CIDR." }
    b: { en: "A custom allocation service works but is code that the company must build, secure and maintain, which is more overhead than a managed feature.", fr: "Un service d'allocation maison fonctionne, mais c'est du code que l'entreprise doit développer, sécuriser et maintenir, soit plus de charge qu'une fonctionnalité gérée." }
    c: { en: "Separate route tables can isolate overlapping networks but do not let them communicate, and nothing assigns non-overlapping blocks.", fr: "Des tables de routage distinctes peuvent isoler des réseaux qui se chevauchent, mais ne leur permettent pas de communiquer, et rien n'attribue de blocs sans chevauchement." }
references:
  - title: What is IPAM?
    url: https://docs.aws.amazon.com/vpc/latest/ipam/what-it-is-ipam.html
