id: saac03-3a-kinesis-multi-consumer
objective: "3.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company ingests about 50,000 clickstream records per second from its websites. Three applications must each read every record independently, with sub-second latency, and records for the same user session must be processed in order. A new analytics application that the company will add later must be able to reprocess the last 7 days of records. Producers and consumers must scale independently.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias ingère environ 50 000 enregistrements de parcours de navigation par seconde depuis ses sites web. Trois applications doivent chacune lire chaque enregistrement indépendamment, avec une latence inférieure à la seconde, et les enregistrements d'une même session utilisateur doivent être traités dans l'ordre. Une nouvelle application d'analyse que l'entreprise ajoutera plus tard doit pouvoir retraiter les enregistrements des 7 derniers jours. Les producteurs et les consommateurs doivent être mis à l'échelle indépendamment.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Send the records to an Amazon SQS standard queue that the three applications poll.", fr: "Envoyer les enregistrements à une file d'attente Amazon SQS standard interrogée par les trois applications." }
    - id: b
      text: { en: "Publish the records to an Amazon SNS topic with an Amazon SQS queue subscribed for each application.", fr: "Publier les enregistrements dans une rubrique Amazon SNS à laquelle est abonnée une file d'attente Amazon SQS par application." }
    - id: c
      text: { en: "Send the records to an Amazon Data Firehose stream that delivers them to an Amazon S3 bucket for the applications.", fr: "Envoyer les enregistrements à un flux Amazon Data Firehose qui les livre dans un compartiment Amazon S3 pour les applications." }
    - id: d
      text: { en: "Write the records to a Kinesis data stream keyed by session ID with a 7-day retention period.", fr: "Écrire les enregistrements dans un flux de données Kinesis partitionné par ID de session, avec une conservation de 7 jours." }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      Kinesis Data Streams lets multiple applications read the same stream concurrently and independently, with a put-to-get delay typically under one second. The partition key maps all records of a session to the same shard, which keeps them in sequence, and retention can be raised from the default 24 hours (up to 365 days), so a later consumer can reread the last 7 days.
    fr: |-
      Kinesis Data Streams permet à plusieurs applications de lire le même flux simultanément et indépendamment, avec un délai entre écriture et lecture généralement inférieur à une seconde. La clé de partition affecte tous les enregistrements d'une session à la même partition (shard), ce qui préserve leur séquence, et la conservation peut être portée au-delà des 24 heures par défaut (jusqu'à 365 jours) : un consommateur ajouté plus tard peut relire les 7 derniers jours.
  options:
    a:
      en: |-
        Each SQS message is consumed by one application and then deleted, so the three applications would not each get every record, and a standard queue does not keep order.
      fr: |-
        Chaque message SQS est consommé par une seule application puis supprimé : les trois applications ne recevraient pas chacune tous les enregistrements, et une file standard ne conserve pas l'ordre.
    b:
      en: |-
        Fanout gives each application a copy, but a new application cannot reprocess records that were published before its queue was subscribed.
      fr: |-
        La diffusion donne une copie à chaque application, mais une nouvelle application ne peut pas retraiter les enregistrements publiés avant l'abonnement de sa file.
    c:
      en: |-
        Firehose buffers records before delivering them to S3, so the applications would not read them with sub-second latency.
      fr: |-
        Firehose met les enregistrements en mémoire tampon avant de les livrer dans S3 : les applications ne les liraient pas avec une latence inférieure à la seconde.
references:
