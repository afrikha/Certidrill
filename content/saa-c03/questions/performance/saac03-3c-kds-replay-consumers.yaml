id: saac03-3c-kds-replay-consumers
objective: "3.5.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An e-commerce company captures clickstream events from its website. Three independent applications must each process every event in real time, and the events of each user session must be processed in order. After a bug fix, an application must be able to reprocess the events of the last 3 days.

    Which solution will meet these requirements?
  fr: |
    Une entreprise d'e-commerce capture les événements de parcours de navigation de son site web. Trois applications indépendantes doivent chacune traiter chaque événement en temps réel, et les événements de chaque session utilisateur doivent être traités dans l'ordre. Après la correction d'un bogue, une application doit pouvoir retraiter les événements des 3 derniers jours.

    Quelle solution répond à ces exigences ?
body:
  options:
    - { id: a, text: { en: "Send the events to an Amazon SQS standard queue with a 4-day message retention period that the three applications poll.", fr: "Envoyer les événements dans une file d'attente standard Amazon SQS avec une période de conservation des messages de 4 jours, interrogée par les trois applications." } }
    - { id: b, text: { en: "Send the events to an Amazon Kinesis data stream with the session ID as the partition key and a retention period of at least 3 days.", fr: "Envoyer les événements dans un flux de données Amazon Kinesis avec l'ID de session comme clé de partition et une période de conservation d'au moins 3 jours." } }
    - { id: c, text: { en: "Send the events to an Amazon SNS standard topic with an Amazon SQS standard queue subscribed for each application.", fr: "Envoyer les événements vers une rubrique standard Amazon SNS avec une file d'attente standard Amazon SQS abonnée pour chaque application." } }
    - { id: d, text: { en: "Send the events to an Amazon Data Firehose stream that delivers them to Amazon S3, where they are kept for 30 days.", fr: "Envoyer les événements vers un flux Amazon Data Firehose qui les livre dans Amazon S3, où ils sont conservés 30 jours." } }
answer: { optionId: b }
explanation:
  correct:
    en: In a Kinesis data stream, several consumers read the same records independently, and records with the same partition key go to the same shard, where they are read in order. Retention can be extended from 24 hours up to 365 days, so a consumer can read the last 3 days again from an earlier position.
    fr: "Dans un flux de données Kinesis, plusieurs consommateurs lisent les mêmes enregistrements de façon indépendante, et les enregistrements qui ont la même clé de partition vont dans la même partition (shard), où ils sont lus dans l'ordre. La conservation peut passer de 24 heures à 365 jours : un consommateur peut relire les 3 derniers jours à partir d'une position antérieure."
  options:
    a: { en: "A message in a queue is processed by one consumer and then deleted; standard queues do not guarantee order and cannot replay messages.", fr: "Un message d'une file d'attente est traité par un seul consommateur puis supprimé ; les files standard ne garantissent pas l'ordre et ne permettent pas de rejouer les messages." }
    c: { en: "Fan-out gives each application a copy, but standard topics and queues do not preserve order, and deleted messages cannot be reprocessed.", fr: "La diffusion donne une copie à chaque application, mais les rubriques et files standard ne préservent pas l'ordre, et les messages supprimés ne peuvent pas être retraités." }
    d: { en: "Firehose delivers buffered batches to a destination; the copies in S3 allow reprocessing, but the applications cannot consume each event in real time and in order.", fr: "Firehose livre des lots mis en mémoire tampon à une destination ; les copies dans S3 permettent de retraiter, mais les applications ne peuvent pas consommer chaque événement en temps réel et dans l'ordre." }
references:
  - title: Quotas and limits
    url: https://docs.aws.amazon.com/streams/latest/dev/service-sizes-and-limits.html
  - title: Using Lambda to process records from Amazon Kinesis Data Streams
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-kinesis.html
