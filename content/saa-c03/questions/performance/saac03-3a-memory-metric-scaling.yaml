id: saac03-3a-memory-metric-scaling
objective: "3.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Java application runs on Linux Amazon EC2 instances in an Auto Scaling group. The application becomes unresponsive when memory utilization exceeds 80%, while CPU utilization stays low. The company wants the group to add instances automatically when average memory utilization across the group rises above 70%.

    Which combination of actions will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Java s'exécute sur des instances Amazon EC2 Linux d'un groupe Auto Scaling. L'application ne répond plus lorsque l'utilisation de la mémoire dépasse 80 %, alors que l'utilisation du processeur reste faible. L'entreprise souhaite que le groupe ajoute automatiquement des instances lorsque l'utilisation moyenne de la mémoire du groupe dépasse 70 %.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Turn on detailed monitoring for the instances in the launch template.", fr: "Activer la surveillance détaillée des instances dans le modèle de lancement." }
    - id: b
      text: { en: "Install the CloudWatch agent through the launch template to publish mem_used_percent for the group.", fr: "Installer l'agent CloudWatch via le modèle de lancement pour publier mem_used_percent pour le groupe." }
    - id: c
      text: { en: "Create a target tracking scaling policy on ASGAverageNetworkIn.", fr: "Créer une stratégie de mise à l'échelle de suivi de la cible sur ASGAverageNetworkIn." }
    - id: d
      text: { en: "Create a target tracking scaling policy that uses the custom memory metric with a target value of 70.", fr: "Créer une stratégie de mise à l'échelle de suivi de la cible qui utilise la métrique de mémoire personnalisée avec une valeur cible de 70." }
    - id: e
      text: { en: "Create a step scaling policy on the EC2 CPUUtilization metric.", fr: "Créer une stratégie de mise à l'échelle par étapes sur la métrique EC2 CPUUtilization." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |-
      EC2 does not publish memory utilization by default, so the CloudWatch agent must collect it; on Linux it provides mem_used_percent in the CWAgent namespace. Target tracking accepts custom CloudWatch metrics that change in proportion to the number of instances, so a policy on the group's average memory metric with a target of 70 adds instances before the application fails.
    fr: |-
      EC2 ne publie pas l'utilisation de la mémoire par défaut : l'agent CloudWatch doit la collecter ; sous Linux, il fournit mem_used_percent dans l'espace de noms CWAgent. Le suivi de la cible accepte des métriques CloudWatch personnalisées qui varient proportionnellement au nombre d'instances : une stratégie sur la mémoire moyenne du groupe avec une cible de 70 ajoute des instances avant la défaillance de l'application.
  options:
    a:
      en: |-
        Detailed monitoring publishes the default EC2 metrics every minute instead of every five minutes, but it does not add memory metrics.
      fr: |-
        La surveillance détaillée publie les métriques EC2 par défaut toutes les minutes au lieu de toutes les cinq minutes, mais n'ajoute pas de métriques de mémoire.
    c:
      en: |-
        Network traffic does not indicate memory pressure, which is the condition that makes the application fail.
      fr: |-
        Le trafic réseau n'indique pas la pression sur la mémoire, qui est la condition provoquant la défaillance de l'application.
    e:
      en: |-
        CPU utilization stays low when memory runs out, so a CPU-based policy would not scale at the right time.
      fr: |-
        L'utilisation du processeur reste faible quand la mémoire s'épuise : une stratégie fondée sur le processeur ne se déclencherait pas au bon moment.
references:
  - title: Metrics collected by the CloudWatch agent - Amazon CloudWatch
    url: https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/metrics-collected-by-CloudWatch-agent.html
  - title: Target tracking scaling policies for Amazon EC2 Auto Scaling - Amazon EC2 Auto Scaling
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
