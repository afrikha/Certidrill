id: saac03-3b-dbtype-dynamodb-state
objective: "3.3.12"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A mobile game stores each player's state, such as inventory and progress, and always reads and writes it by player ID. At peak, the game serves millions of requests per second and needs consistent single-digit millisecond latency. The data model has no joins, and the company does not want to manage database servers.

    Which database will meet these requirements?
  fr: |
    Un jeu mobile stocke l'état de chaque joueur, comme son inventaire et sa progression, et le lit et l'écrit toujours par ID de joueur. En période de pointe, le jeu sert des millions de requêtes par seconde et a besoin d'une latence constante de quelques millisecondes. Le modèle de données n'a pas de jointures, et l'entreprise ne veut pas gérer de serveurs de base de données.

    Quelle base de données répond à ces exigences ?
body:
  options:
    - { id: a, text: "Amazon DynamoDB" }
    - { id: b, text: "Amazon Aurora MySQL" }
    - { id: c, text: "Amazon Redshift" }
    - { id: d, text: "Amazon Neptune" }
answer: { optionId: a }
explanation:
  correct:
    en: DynamoDB is a serverless key-value and document database with single-digit millisecond performance at any scale. Access by a known key such as the player ID is its ideal pattern, and gaming player data is a common DynamoDB use case.
    fr: DynamoDB est une base de données clé-valeur et de documents sans serveur, avec des performances de l'ordre de quelques millisecondes à n'importe quelle échelle. L'accès par une clé connue comme l'ID du joueur est son modèle idéal, et les données de joueurs de jeux vidéo sont un cas d'utilisation courant de DynamoDB.
  options:
    b:
      en: Aurora is a relational database with instances to size; writes go to a single writer instance, which does not suit millions of key lookups per second as well.
      fr: Aurora est une base relationnelle dont les instances doivent être dimensionnées ; les écritures passent par une seule instance d'écriture, ce qui convient moins bien à des millions d'accès par clé par seconde.
    c:
      en: Redshift is a data warehouse for analytics, not for low-latency reads and writes of individual records.
      fr: Redshift est un entrepôt de données pour l'analytique, pas pour des lectures et écritures à faible latence d'enregistrements individuels.
    d:
      en: Neptune is a graph database for highly connected data; player state accessed by key does not need graph traversals.
      fr: Neptune est une base orientée graphe pour des données fortement connectées ; un état de joueur accédé par clé n'a pas besoin de parcours de graphe.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
