id: saac03-3b-replica-vs-multiaz
objective: "3.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A solutions architect is reviewing a design that uses Amazon RDS for MySQL with a Multi-AZ DB instance deployment and one read replica. The team must understand how each copy of the data is replicated before it decides where to send read traffic and how to plan for a Regional outage.

    Which statements are correct? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Un architecte de solutions examine une conception qui utilise Amazon RDS for MySQL avec un déploiement d'instance de base de données Multi-AZ et un réplica en lecture. L'équipe doit comprendre comment chaque copie des données est répliquée avant de décider où envoyer le trafic de lecture et comment se préparer à une panne régionale.

    Quelles affirmations sont correctes ? (Choisissez-en deux.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The read replica is updated asynchronously, so it can lag behind the primary.", fr: "Le réplica en lecture est mis à jour de façon asynchrone ; il peut donc être en retard sur l'instance principale." } }
    - { id: b, text: { en: "The Multi-AZ standby can serve read-only queries to offload the primary.", fr: "L'instance de secours Multi-AZ peut servir des requêtes en lecture seule pour décharger l'instance principale." } }
    - { id: c, text: { en: "The Multi-AZ standby is updated asynchronously to avoid adding write latency.", fr: "L'instance de secours Multi-AZ est mise à jour de façon asynchrone pour éviter d'ajouter de la latence d'écriture." } }
    - { id: d, text: { en: "The read replica can be created in a different AWS Region from the primary.", fr: "Le réplica en lecture peut être créé dans une Région AWS différente de celle de l'instance principale." } }
    - { id: e, text: { en: "RDS adds read replicas automatically when the primary's CPU usage is high.", fr: "RDS ajoute automatiquement des réplicas en lecture lorsque l'utilisation du processeur de l'instance principale est élevée." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: RDS copies changes to a read replica asynchronously, so reads from the replica can return slightly stale data. A read replica can also be placed in another Region, which serves local reads there and can be promoted for disaster recovery.
    fr: RDS copie les modifications vers un réplica en lecture de façon asynchrone ; les lectures sur le réplica peuvent donc renvoyer des données légèrement obsolètes. Un réplica en lecture peut aussi être placé dans une autre Région, où il sert des lectures locales et peut être promu pour la reprise après sinistre.
  options:
    b:
      en: The standby of a Multi-AZ DB instance deployment cannot serve read traffic; it exists only for failover.
      fr: L'instance de secours d'un déploiement d'instance de base de données Multi-AZ ne peut pas servir de trafic de lecture ; elle n'existe que pour le basculement.
    c:
      en: The Multi-AZ standby is replicated synchronously, which can increase write and commit latency.
      fr: L'instance de secours Multi-AZ est répliquée de façon synchrone, ce qui peut augmenter la latence d'écriture et de validation.
    e:
      en: RDS does not scale read replicas automatically; they are created manually. Automatic replica scaling is an Aurora feature.
      fr: RDS ne fait pas évoluer automatiquement les réplicas en lecture ; ils sont créés manuellement. La mise à l'échelle automatique des réplicas est une fonctionnalité d'Aurora.
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
  - title: Multi-AZ DB instance deployments for Amazon RDS
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
