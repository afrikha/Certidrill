id: saac03-3b-ddb-write-sharding
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A ticketing company stores sales events in an Amazon DynamoDB table whose partition key is the event date. During large on-sale events, almost all writes target the same date, and write requests are throttled even though the consumed write capacity of the table is far below its provisioned capacity. The company must sustain higher write throughput for a single date.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie stocke des événements de vente dans une table Amazon DynamoDB dont la clé de partition est la date de l'événement. Pendant les grandes ouvertures de ventes, presque toutes les écritures ciblent la même date, et les requêtes d'écriture sont limitées (throttling) alors que la capacité d'écriture consommée par la table est très inférieure à sa capacité provisionnée. L'entreprise doit soutenir un débit d'écriture plus élevé pour une même date.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Increase the provisioned write capacity units of the table to absorb the write peaks.", fr: "Augmenter les unités de capacité d'écriture provisionnées de la table pour absorber les pics d'écriture." }
    - id: b
      text: { en: "Add a calculated suffix to the partition key values so that the writes for one date spread across partitions.", fr: "Ajouter un suffixe calculé aux valeurs de la clé de partition afin que les écritures d'une même date se répartissent entre les partitions." }
    - id: c
      text: { en: "Create a global secondary index whose partition key is the event date to take part of the writes.", fr: "Créer un index secondaire global dont la clé de partition est la date de l'événement pour prendre une partie des écritures." }
    - id: d
      text: { en: "Place a DynamoDB Accelerator (DAX) cluster in front of the table to absorb the write peaks.", fr: "Placer un cluster DynamoDB Accelerator (DAX) devant la table pour absorber les pics d'écriture." }
answer: { optionId: b }
explanation:
  correct:
    en: Throttling with unused table capacity points to a hot partition key. Write sharding adds a random or calculated suffix to the key so that writes for one date spread evenly across many partitions, which increases parallelism and overall throughput. Reads for a whole date then query each suffix and merge the results.
    fr: Une limitation alors que la capacité de la table est inutilisée révèle une clé de partition « chaude ». Le partitionnement des écritures (write sharding) ajoute un suffixe aléatoire ou calculé à la clé afin que les écritures d'une même date se répartissent uniformément sur de nombreuses partitions, ce qui augmente le parallélisme et le débit global. La lecture de toute une date interroge ensuite chaque suffixe et fusionne les résultats.
  options:
    a:
      en: The table already has spare capacity; more capacity does not remove the per-partition concentration of a single key value.
      fr: La table dispose déjà de capacité inutilisée ; plus de capacité ne supprime pas la concentration de toutes les écritures sur une seule valeur de clé.
    c:
      en: A GSI keyed on the same date is just as hot, and every write to the table must also be written to the index.
      fr: Un GSI dont la clé est la même date est tout aussi « chaud », et chaque écriture dans la table doit aussi être écrite dans l'index.
    d:
      en: DAX accelerates reads; writes still go to DynamoDB and to the same hot partition.
      fr: DAX accélère les lectures ; les écritures sont toujours envoyées à DynamoDB et à la même partition « chaude ».
references:
  - title: Using write sharding to distribute workloads evenly in your DynamoDB table
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/bp-partition-key-sharding.html
