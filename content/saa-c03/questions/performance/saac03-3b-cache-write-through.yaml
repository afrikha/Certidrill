id: saac03-3b-cache-write-through
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ecommerce company caches product prices from an Amazon RDS database in Amazon ElastiCache by using lazy loading with a 1-hour TTL. Prices are read thousands of times per second. After a price change, customers sometimes see the old price for up to an hour. The company requires that the cache reflects every price change as soon as the database is updated, while keeping read latency low.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de commerce électronique met en cache dans Amazon ElastiCache les prix des produits d'une base de données Amazon RDS, en chargement différé (lazy loading) avec une durée de vie (TTL) d'une heure. Les prix sont lus des milliers de fois par seconde. Après une modification de prix, les clients voient parfois l'ancien prix pendant une heure. L'entreprise exige que le cache reflète chaque modification de prix dès que la base de données est mise à jour, tout en gardant une faible latence de lecture.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Keep lazy loading and increase the TTL so that more reads are served from the cache.", fr: "Conserver le chargement différé et augmenter la TTL afin que davantage de lectures soient servies par le cache." }
    - id: b
      text: { en: "Keep lazy loading and remove the cache, sending all reads to an RDS read replica.", fr: "Conserver le chargement différé et supprimer le cache, en envoyant toutes les lectures vers un réplica en lecture RDS." }
    - id: c
      text: { en: "Add a write-through strategy that updates the cached price every time the application writes it to the database.", fr: "Ajouter une stratégie d'écriture simultanée (write-through) qui met à jour le prix en cache chaque fois que l'application l'écrit dans la base de données." }
    - id: d
      text: { en: "Keep lazy loading and add more nodes to the ElastiCache cluster so that the cache can hold more keys.", fr: "Conserver le chargement différé et ajouter des nœuds au cluster ElastiCache afin que le cache puisse contenir plus de clés." }
answer: { optionId: c }
explanation:
  correct:
    en: With write-through, the application updates the cache in the same operation that writes to the database, so cached data is never stale. Reads keep hitting the cache, and the extra latency is paid on writes, which are rare here.
    fr: Avec l'écriture simultanée, l'application met à jour le cache dans la même opération que l'écriture en base de données ; les données en cache ne sont donc jamais obsolètes. Les lectures continuent d'être servies par le cache, et la latence supplémentaire porte sur les écritures, rares ici.
  options:
    a:
      en: A longer TTL keeps outdated prices in the cache even longer; lazy loading does not update the cache when the database changes.
      fr: Une TTL plus longue conserve les prix obsolètes encore plus longtemps ; le chargement différé ne met pas à jour le cache lorsque la base de données change.
    b:
      en: Read replicas are updated asynchronously and have higher read latency than an in-memory cache, so they meet neither requirement as well.
      fr: Les réplicas en lecture sont mis à jour de façon asynchrone et ont une latence de lecture supérieure à celle d'un cache en mémoire ; ils répondent donc moins bien aux deux exigences.
    d:
      en: More nodes add capacity, but cached prices still stay stale until the TTL expires.
      fr: Davantage de nœuds ajoute de la capacité, mais les prix en cache restent obsolètes jusqu'à l'expiration de la TTL.
references:
  - title: Caching strategies for Memcached
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
