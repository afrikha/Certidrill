id: saac03-4a-efs-lifecycle-tiers
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores engineering project files on an Amazon EFS Regional file system that uses Elastic throughput. Files are actively used for about 4 weeks, are then opened a few times a quarter for about 2 months, and after that are opened a few times a year or less. Users must keep accessing every file through the same mount path. The company wants to lower storage costs with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise stocke des fichiers de projets d'ingénierie sur un système de fichiers Amazon EFS régional qui utilise le débit Elastic. Les fichiers sont activement utilisés pendant environ 4 semaines, puis ouverts quelques fois par trimestre pendant environ 2 mois, puis quelques fois par an ou moins. Les utilisateurs doivent continuer à accéder à chaque fichier par le même chemin de montage. L'entreprise veut réduire ses coûts de stockage avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure EFS lifecycle management to move files to EFS Infrequent Access after 30 days and to EFS Archive after 90 days without access.", fr: "Configurer la gestion du cycle de vie EFS pour déplacer les fichiers vers EFS Infrequent Access après 30 jours et vers EFS Archive après 90 jours sans accès." }
    - id: b
      text: { en: "Use AWS DataSync to move files older than 30 days to an S3 bucket with a lifecycle rule to S3 Glacier Deep Archive.", fr: "Utiliser AWS DataSync pour déplacer les fichiers de plus de 30 jours vers un compartiment S3 doté d'une règle de cycle de vie vers S3 Glacier Deep Archive." }
    - id: c
      text: { en: "Create an EFS One Zone file system and copy the files to it with AWS DataSync, then delete the Regional file system.", fr: "Créer un système de fichiers EFS One Zone, y copier les fichiers avec AWS DataSync, puis supprimer le système de fichiers régional." }
    - id: d
      text: { en: "Run a nightly cron job on an EC2 instance that compresses files older than 90 days in place on the file system.", fr: "Exécuter chaque nuit sur une instance EC2 une tâche cron qui compresse sur place les fichiers de plus de 90 jours." }
answer: { optionId: a }
explanation:
  correct:
    en: "EFS lifecycle management moves files that have not been accessed for a set time to EFS Infrequent Access, designed for data used a few times a quarter, and to EFS Archive, designed for data used a few times a year or less. Files keep the same path, metadata stays in Standard, and EFS Archive is supported on Regional file systems that use Elastic throughput."
    fr: "La gestion du cycle de vie EFS déplace les fichiers non consultés depuis une durée donnée vers EFS Infrequent Access, conçu pour des données utilisées quelques fois par trimestre, et vers EFS Archive, conçu pour des données utilisées quelques fois par an ou moins. Les fichiers gardent le même chemin, les métadonnées restent dans Standard, et EFS Archive est pris en charge sur les systèmes de fichiers régionaux qui utilisent le débit Elastic."
  options:
    b:
      en: "Moving files to S3 changes how users reach them, and Deep Archive objects must be restored before they can be read."
      fr: "Déplacer les fichiers vers Amazon S3 change la manière dont les utilisateurs y accèdent, et les objets Deep Archive doivent être restaurés avant d'être lus."
    c:
      en: "One Zone storage is cheaper but keeps data in a single Availability Zone and does not tier cold files; the migration also changes the mount target."
      fr: "Le stockage One Zone est moins cher mais garde les données dans une seule zone de disponibilité et ne hiérarchise pas les fichiers froids ; la migration change aussi la cible de montage."
    d:
      en: "A custom cron job is code to run and maintain on an instance, and compressed files are no longer usable by applications in their original form."
      fr: "Une tâche cron personnalisée est du code à exécuter et maintenir sur une instance, et des fichiers compressés ne sont plus utilisables tels quels par les applications."
references:
  - title: Managing storage lifecycle
    url: https://docs.aws.amazon.com/efs/latest/ug/lifecycle-management-efs.html
  - title: Amazon Elastic File System (EFS) | Cloud File Storage | FAQs
    url: https://aws.amazon.com/efs/faq/
