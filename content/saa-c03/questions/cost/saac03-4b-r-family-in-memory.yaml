id: saac03-4b-r-family-in-memory
objective: "4.2.14"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating a self-managed in-memory analytics engine to Amazon EC2. The engine needs much more memory per vCPU than general purpose instances provide, its entire working set must fit in RAM, and its CPU usage is moderate. The company wants to avoid paying for vCPUs that it does not need.

    Which instance family should a solutions architect choose?
  fr: |
    Une entreprise migre vers Amazon EC2 un moteur d'analyse en mémoire qu'elle gère elle-même. Le moteur a besoin de beaucoup plus de mémoire par vCPU que n'en offrent les instances à usage général, tout son jeu de données de travail doit tenir en RAM, et son utilisation du processeur est modérée. L'entreprise veut éviter de payer des vCPU dont elle n'a pas besoin.

    Quelle famille d'instances un architecte de solutions doit-il choisir ?
body:
  options:
    - id: a
      text:
        en: "Compute optimized instances (C family)"
        fr: "Instances optimisées pour le calcul (famille C)"
    - id: b
      text:
        en: "Memory optimized instances (R family)"
        fr: "Instances optimisées pour la mémoire (famille R)"
    - id: c
      text:
        en: "Storage optimized instances (I family)"
        fr: "Instances optimisées pour le stockage (famille I)"
    - id: d
      text:
        en: "Burstable performance instances (T family)"
        fr: "Instances à performances extensibles (famille T)"
answer: { optionId: b }
explanation:
  correct:
    en: "Memory optimized instances such as the R family are designed for workloads that process large data sets in memory. They offer more memory per vCPU than general purpose instances, so the company gets the RAM it needs without paying for extra vCPUs."
    fr: "Les instances optimisées pour la mémoire, comme la famille R, sont conçues pour les charges de travail qui traitent de grands jeux de données en mémoire. Elles offrent plus de mémoire par vCPU que les instances à usage général : l'entreprise obtient la RAM nécessaire sans payer de vCPU supplémentaires."
  options:
    a:
      en: "Compute optimized instances have less memory per vCPU than general purpose instances, so reaching the RAM target would mean paying for many unused vCPUs."
      fr: "Les instances optimisées pour le calcul ont moins de mémoire par vCPU que les instances à usage général : atteindre la quantité de RAM voulue obligerait à payer de nombreux vCPU inutilisés."
    c:
      en: "Storage optimized instances target high I/O on local storage, not a large memory-to-vCPU ratio."
      fr: "Les instances optimisées pour le stockage visent des E/S élevées sur le stockage local, pas un rapport mémoire/vCPU élevé."
    d:
      en: "Burstable instances are for low average CPU with occasional bursts and offer small amounts of memory."
      fr: "Les instances extensibles sont destinées à une faible utilisation moyenne du processeur avec des pics occasionnels et offrent peu de mémoire."
references:
  - title: "Specifications for Amazon EC2 memory optimized instances"
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/mo.html
  - title: "Amazon EC2 instance type naming conventions"
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-type-names.html
