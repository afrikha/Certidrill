id: saac03-4b-cloudfront-functions-headers
objective: "4.2.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A news website serves all its traffic through an Amazon CloudFront distribution and receives millions of requests per second during breaking news. The company must add security headers to every response and redirect requests for old URLs to new paths. The logic is a few lines of JavaScript, makes no network calls, and does not read the request body.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Un site d'actualités sert tout son trafic via une distribution Amazon CloudFront et reçoit des millions de requêtes par seconde lors des événements majeurs. L'entreprise doit ajouter des en-têtes de sécurité à chaque réponse et rediriger les requêtes visant d'anciennes URL vers de nouveaux chemins. La logique tient en quelques lignes de JavaScript, n'effectue aucun appel réseau et ne lit pas le corps de la requête.

    Quelle solution répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Associate Lambda@Edge functions with the origin request and origin response events of the distribution."
        fr: "Associer des fonctions Lambda@Edge aux événements de requête et de réponse d'origine de la distribution."
    - id: b
      text:
        en: "Add Amazon EC2 instances behind the origin load balancer to rewrite the requests and add the headers."
        fr: "Ajouter des instances Amazon EC2 derrière l'équilibreur de charge d'origine pour réécrire les requêtes et ajouter les en-têtes."
    - id: c
      text:
        en: "Associate CloudFront Functions with the viewer request and viewer response events of the distribution."
        fr: "Associer des CloudFront Functions aux événements de requête et de réponse utilisateur (viewer) de la distribution."
    - id: d
      text:
        en: "Place Amazon API Gateway with AWS Lambda functions between CloudFront and the origin to rewrite the traffic."
        fr: "Placer Amazon API Gateway avec des fonctions AWS Lambda entre CloudFront et l'origine pour réécrire le trafic."
answer: { optionId: c }
explanation:
  correct:
    en: "CloudFront Functions run lightweight JavaScript at the edge locations on viewer request and viewer response events, scale to millions of requests per second, and are designed for header manipulation and URL redirects or rewrites. They are the cheaper edge option when the code needs no network access and no request body."
    fr: "Les CloudFront Functions exécutent du JavaScript léger dans les emplacements périphériques sur les événements de requête et de réponse utilisateur, évoluent jusqu'à des millions de requêtes par seconde et sont conçues pour la manipulation d'en-têtes et les redirections ou réécritures d'URL. C'est l'option périphérique la moins chère lorsque le code n'a besoin ni d'accès réseau ni du corps de la requête."
  options:
    a:
      en: "Lambda@Edge is meant for longer logic that needs network access or the request body. It costs more per request, and origin events do not run on cache hits, so redirects of cached URLs would be missed."
      fr: "Lambda@Edge est destiné à une logique plus longue qui nécessite un accès réseau ou le corps de la requête. Il coûte plus cher par requête, et les événements d'origine ne s'exécutent pas en cas d'accès au cache : les redirections d'URL en cache seraient manquées."
    b:
      en: "Extra EC2 instances add servers to manage and pay for, and they only see requests that miss the cache."
      fr: "Des instances EC2 supplémentaires ajoutent des serveurs à gérer et à payer, et ne voient que les requêtes absentes du cache."
    d:
      en: "API Gateway and Lambda add per-request charges and latency for logic that CloudFront can run at the edge."
      fr: "API Gateway et Lambda ajoutent des frais par requête et de la latence pour une logique que CloudFront peut exécuter en périphérie."
references:
  - title: "Differences between CloudFront Functions and Lambda@Edge"
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/edge-functions-choosing.html
