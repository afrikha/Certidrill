id: saac03-4a-glacier-instant-images
objective: "4.1.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A hospital stores medical images in Amazon S3. Images older than 1 year are accessed about once a quarter, but when a doctor requests one, it must be displayed within milliseconds. The images must be stored across multiple Availability Zones.

    Which storage class is the MOST cost-effective for images older than 1 year?
  fr: |
    Un hôpital stocke des images médicales dans Amazon S3. Les images de plus d'un an sont consultées environ une fois par trimestre, mais lorsqu'un médecin en demande une, elle doit s'afficher en quelques millisecondes. Les images doivent être stockées dans plusieurs zones de disponibilité.

    Quelle classe de stockage est la PLUS rentable pour les images de plus d'un an ?
body:
  options:
    - id: a
      text: { en: "S3 Glacier Instant Retrieval", fr: "S3 Glacier Instant Retrieval" }
    - id: b
      text: { en: "S3 Glacier Flexible Retrieval", fr: "S3 Glacier Flexible Retrieval" }
    - id: c
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: d
      text: { en: "S3 One Zone-IA", fr: "S3 One Zone-IA" }
answer: { optionId: a }
explanation:
  correct:
    en: "S3 Glacier Instant Retrieval is designed for long-lived archive data accessed about once a quarter that still needs millisecond retrieval. It stores data across at least three Availability Zones at a lower storage price than Standard-IA, with a 90-day minimum storage duration that long-lived images easily meet."
    fr: "S3 Glacier Instant Retrieval est conçu pour des données d'archive de longue durée consultées environ une fois par trimestre et qui exigent malgré tout une récupération en millisecondes. Il stocke les données dans au moins trois zones de disponibilité, à un prix de stockage inférieur à S3 Standard-IA, avec une durée minimale de 90 jours que des images conservées longtemps respectent sans difficulté."
  options:
    b:
      en: "Glacier Flexible Retrieval requires a restore that takes minutes to hours, so images could not be displayed within milliseconds."
      fr: "S3 Glacier Flexible Retrieval exige une restauration de quelques minutes à quelques heures : les images ne pourraient pas s'afficher en millisecondes."
    c:
      en: "Standard-IA meets the requirements but is designed for monthly access and has a higher storage price than Glacier Instant Retrieval."
      fr: "S3 Standard-IA répond aux exigences, mais il est conçu pour un accès mensuel et son prix de stockage est supérieur à celui de S3 Glacier Instant Retrieval."
    d:
      en: "One Zone-IA stores data in a single Availability Zone, which breaks the multiple-AZ requirement."
      fr: "S3 One Zone-IA stocke les données dans une seule zone de disponibilité, ce qui enfreint l'exigence de plusieurs zones de disponibilité."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
