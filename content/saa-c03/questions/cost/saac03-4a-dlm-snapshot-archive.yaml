id: saac03-4a-dlm-snapshot-archive
objective: "4.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must keep one snapshot per month of each Amazon EBS data volume for 5 years to satisfy auditors. These monthly snapshots are almost never restored, and a slow restore is acceptable. Daily snapshots, which are restored more often, must be kept for 7 days. The company wants to automate the snapshot lifecycle and minimize snapshot storage costs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit conserver pendant 5 ans un instantané par mois de chaque volume de données Amazon EBS pour satisfaire les auditeurs. Ces instantanés mensuels ne sont presque jamais restaurés, et une restauration lente est acceptable. Les instantanés quotidiens, restaurés plus souvent, doivent être conservés 7 jours. L'entreprise veut automatiser le cycle de vie des instantanés et réduire au minimum leurs coûts de stockage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A Data Lifecycle Manager policy whose daily schedule archives each snapshot to EBS Snapshots Archive for 7 days, and whose monthly schedule keeps snapshots in the standard tier for 5 years.", fr: "Une politique Data Lifecycle Manager dont la planification quotidienne archive chaque instantané dans EBS Snapshots Archive pendant 7 jours, et dont la planification mensuelle conserve les instantanés au niveau standard pendant 5 ans." }
    - id: b
      text: { en: "A Data Lifecycle Manager policy with a daily schedule retained for 7 days, and a monthly schedule that archives its snapshots to EBS Snapshots Archive for 5 years.", fr: "Une politique Data Lifecycle Manager avec une planification quotidienne conservée 7 jours, et une planification mensuelle qui archive ses instantanés dans EBS Snapshots Archive pendant 5 ans." }
    - id: c
      text: { en: "A Data Lifecycle Manager policy with a daily schedule retained for 5 years in the standard tier, with fast snapshot restore enabled.", fr: "Une politique Data Lifecycle Manager avec une planification quotidienne conservée 5 ans au niveau standard, avec la restauration rapide d'instantanés activée." }
    - id: d
      text: { en: "A monthly AWS Lambda function that copies the snapshots to an S3 bucket with a lifecycle rule to S3 Glacier Deep Archive.", fr: "Une fonction AWS Lambda mensuelle qui copie les instantanés dans un compartiment S3 doté d'une règle de cycle de vie vers S3 Glacier Deep Archive." }
answer: { optionId: b }
explanation:
  correct:
    en: "EBS Snapshots Archive lowers snapshot storage costs by up to 75% for snapshots kept 90 days or more and rarely accessed. Data Lifecycle Manager can archive snapshots for one schedule of a policy when that schedule creates snapshots monthly or at least every 28 days, with at least 90 days of archive retention, so the monthly schedule archives and the daily schedule simply expires after 7 days."
    fr: "EBS Snapshots Archive réduit jusqu'à 75 % le coût de stockage des instantanés conservés 90 jours ou plus et rarement consultés. Data Lifecycle Manager peut archiver les instantanés d'une planification d'une politique lorsque cette planification crée des instantanés chaque mois ou au moins tous les 28 jours, avec une rétention d'archive d'au moins 90 jours : la planification mensuelle archive et la planification quotidienne expire simplement après 7 jours."
  options:
    a:
      en: "Archiving is not allowed for a daily schedule and requires at least 90 days in the archive tier; keeping monthly snapshots in the standard tier for 5 years also costs more."
      fr: "L'archivage n'est pas autorisé pour une planification quotidienne et exige au moins 90 jours au niveau archive ; conserver les instantanés mensuels au niveau standard pendant 5 ans coûte en outre plus cher."
    c:
      en: "Keeping every daily snapshot for 5 years far exceeds the requirement, and fast snapshot restore adds charges for a capability the audit snapshots do not need."
      fr: "Conserver chaque instantané quotidien pendant 5 ans dépasse largement l'exigence, et la restauration rapide d'instantanés ajoute des frais pour une fonctionnalité inutile aux instantanés d'audit."
    d:
      en: "EBS snapshots cannot be copied into your own S3 bucket as objects, and a custom function adds code to maintain."
      fr: "Les instantanés EBS ne peuvent pas être copiés sous forme d'objets dans votre propre compartiment S3, et une fonction personnalisée ajoute du code à maintenir."
references:
  - title: Archive Amazon EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-archive.html
  - title: Create Amazon Data Lifecycle Manager custom policy for EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-ami-policy.html
