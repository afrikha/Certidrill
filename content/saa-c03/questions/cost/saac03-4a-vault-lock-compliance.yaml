id: saac03-4a-vault-lock-compliance
objective: "4.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company uses AWS Backup to protect its production databases. After a ransomware incident at a competitor, the security team requires that no user, including the root user of the account, can delete recovery points or shorten their retention for 1 year. Once it takes effect, the protection itself must be impossible to remove.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers utilise AWS Backup pour protéger ses bases de données de production. Après une attaque par rançongiciel chez un concurrent, l'équipe de sécurité exige qu'aucun utilisateur, y compris l'utilisateur racine du compte, ne puisse supprimer des points de récupération ou raccourcir leur rétention pendant 1 an. Une fois en vigueur, la protection elle-même doit être impossible à supprimer.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Apply AWS Backup Vault Lock in governance mode to the backup vault with a minimum retention of 365 days.", fr: "Appliquer AWS Backup Vault Lock en mode gouvernance au coffre-fort de sauvegarde avec une rétention minimale de 365 jours." }
    - id: b
      text: { en: "Apply AWS Backup Vault Lock in compliance mode to the backup vault with a minimum retention of 365 days.", fr: "Appliquer AWS Backup Vault Lock en mode conformité au coffre-fort de sauvegarde avec une rétention minimale de 365 jours." }
    - id: c
      text: { en: "Attach a service control policy that denies the deletion of recovery points to all accounts in the organization.", fr: "Attacher à tous les comptes de l'organisation une politique de contrôle des services qui interdit la suppression des points de récupération." }
    - id: d
      text: { en: "Copy the recovery points to an S3 bucket that has S3 Object Lock enabled in governance mode.", fr: "Copier les points de récupération dans un compartiment S3 pour lequel S3 Object Lock est activé en mode gouvernance." }
answer: { optionId: b }
explanation:
  correct:
    en: "Vault Lock enforces write-once-read-many protection on all recovery points in a vault. In compliance mode, once the grace time of at least 3 days expires, the lock and the vault cannot be changed or deleted by any user, including the root user, or by AWS, and recovery points cannot be deleted before the minimum retention."
    fr: "Vault Lock impose une protection WORM (écriture unique, lectures multiples) à tous les points de récupération d'un coffre-fort. En mode conformité, une fois expiré le délai de grâce d'au moins 3 jours, ni le verrou ni le coffre-fort ne peuvent être modifiés ou supprimés par un utilisateur, y compris l'utilisateur racine, ni par AWS, et les points de récupération ne peuvent pas être supprimés avant la rétention minimale."
  options:
    a:
      en: "In governance mode, users with sufficient IAM permissions can still remove the lock and delete recovery points."
      fr: "En mode gouvernance, des utilisateurs disposant des autorisations IAM suffisantes peuvent toujours supprimer le verrou et les points de récupération."
    c:
      en: "An SCP can be detached by organization administrators and does not apply to the management account, so the protection is not permanent."
      fr: "Une SCP peut être détachée par les administrateurs de l'organisation et ne s'applique pas au compte de gestion : la protection n'est pas définitive."
    d:
      en: "AWS Backup stores recovery points in backup vaults, not in your own S3 buckets, and governance mode can be bypassed by privileged users."
      fr: "AWS Backup stocke les points de récupération dans des coffres-forts de sauvegarde, pas dans vos propres compartiments S3, et le mode gouvernance peut être contourné par des utilisateurs privilégiés."
references:
  - title: AWS Backup Vault Lock
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html
