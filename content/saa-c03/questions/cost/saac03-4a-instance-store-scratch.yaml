id: saac03-4a-instance-store-scratch
objective: "4.1.11"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A video transcoding fleet runs on Amazon EC2 instances. During each job, an instance writes hundreds of GB of intermediate files to local disk, needs the highest possible random I/O performance, and discards the files when the job ends. Source and output files are stored in Amazon S3, so losing the intermediate files if an instance stops is acceptable.

    Which storage option is the MOST cost-effective for the intermediate files?
  fr: |
    Un parc de transcodage vidéo s'exécute sur des instances Amazon EC2. Pendant chaque tâche, une instance écrit des centaines de Go de fichiers intermédiaires sur disque local, a besoin des meilleures performances d'E/S aléatoires possibles et supprime les fichiers à la fin de la tâche. Les fichiers source et de sortie sont stockés dans Amazon S3 : perdre les fichiers intermédiaires si une instance s'arrête est donc acceptable.

    Quelle option de stockage est la PLUS rentable pour les fichiers intermédiaires ?
body:
  options:
    - id: a
      text: { en: "Amazon EBS Provisioned IOPS SSD (io2 Block Express) volumes attached to each instance", fr: "Des volumes Amazon EBS Provisioned IOPS SSD (io2 Block Express) attachés à chaque instance" }
    - id: b
      text: { en: "Instance store volumes on an instance type that includes local NVMe SSD storage", fr: "Des volumes de stockage d'instance sur un type d'instance qui inclut un stockage SSD NVMe local" }
    - id: c
      text: { en: "A shared Amazon EFS file system with Provisioned Throughput", fr: "Un système de fichiers Amazon EFS partagé avec débit provisionné" }
    - id: d
      text: { en: "An S3 Express One Zone directory bucket in the same Availability Zone", fr: "Un compartiment de répertoire S3 Express One Zone dans la même zone de disponibilité" }
answer: { optionId: b }
explanation:
  correct:
    en: "Instance store volumes are disks physically attached to the host, which gives very high local I/O performance for buffers, caches and scratch data. They have no additional charge because they are included in the instance price, and their temporary nature is acceptable for intermediate files."
    fr: "Les volumes de stockage d'instance sont des disques physiquement attachés à l'hôte, ce qui offre de très hautes performances d'E/S locales pour les tampons, caches et données temporaires. Ils n'entraînent aucun frais supplémentaire, car ils sont inclus dans le prix de l'instance, et leur caractère temporaire convient à des fichiers intermédiaires."
  options:
    a:
      en: "io2 Block Express provides durable, high-IOPS storage, but provisioned IOPS and capacity are billed separately, which is costly for throwaway data."
      fr: "io2 Block Express fournit un stockage durable à IOPS élevées, mais les IOPS et la capacité provisionnées sont facturées en plus, ce qui est coûteux pour des données jetables."
    c:
      en: "A network file system adds per-GB storage and throughput charges and has higher latency than local disks; sharing is not needed here."
      fr: "Un système de fichiers réseau ajoute des frais de stockage et de débit par Go et présente une latence plus élevée que des disques locaux ; le partage n'est pas nécessaire ici."
    d:
      en: "S3 Express One Zone is object storage accessed over the network with per-GB and per-request charges, not a local disk for random I/O."
      fr: "S3 Express One Zone est un stockage d'objets accessible par le réseau, avec des frais par Go et par requête, pas un disque local pour des E/S aléatoires."
references:
  - title: Instance store temporary block storage for EC2 instances
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html
