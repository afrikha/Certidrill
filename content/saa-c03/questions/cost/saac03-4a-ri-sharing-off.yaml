id: saac03-4a-ri-sharing-off
objective: "4.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A holding company manages the AWS accounts of its subsidiaries in one organization in AWS Organizations with consolidated billing. One subsidiary is being prepared for sale. Its account must stop receiving Reserved Instance and Savings Plans discounts purchased by other accounts, and its own commitments must stop benefiting other accounts. The account must stay in the organization until the sale is complete.

    Which solution will meet these requirements?
  fr: |
    Une holding gère les comptes AWS de ses filiales dans une organisation AWS Organizations avec facturation consolidée. Une filiale est en cours de cession. Son compte ne doit plus bénéficier des remises des instances réservées et des Savings Plans achetés par d'autres comptes, et ses propres engagements ne doivent plus profiter aux autres comptes. Le compte doit rester dans l'organisation jusqu'à la finalisation de la cession.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "From the management account, deactivate Reserved Instances and Savings Plans discount sharing for the subsidiary's account.", fr: "Depuis le compte de gestion, désactiver le partage des remises des instances réservées et des Savings Plans pour le compte de la filiale." }
    - id: b
      text: { en: "Attach a service control policy (SCP) to the subsidiary's account that denies purchasing Reserved Instances and Savings Plans.", fr: "Attacher au compte de la filiale une politique de contrôle des services (SCP) qui interdit l'achat d'instances réservées et de Savings Plans." }
    - id: c
      text: { en: "Move the subsidiary's account into a separate organizational unit (OU) that has its own cost allocation tags.", fr: "Déplacer le compte de la filiale dans une unité d'organisation (OU) distincte qui possède ses propres balises de répartition des coûts." }
    - id: d
      text: { en: "Remove the subsidiary's account from the organization, then invite it back after the sale is complete.", fr: "Retirer le compte de la filiale de l'organisation, puis l'inviter à nouveau une fois la cession finalisée." }
answer: { optionId: a }
explanation:
  correct:
    en: "The management account can deactivate Reserved Instances and Savings Plans discount sharing for individual member accounts in the billing preferences. Sharing applies only between accounts that both have it activated, so the subsidiary's account neither receives nor gives shared discounts while it stays in the organization."
    fr: "Le compte de gestion peut désactiver, dans les préférences de facturation, le partage des remises des instances réservées et des Savings Plans pour des comptes membres précis. Le partage ne s'applique qu'entre comptes pour lesquels il est activé : le compte de la filiale ne reçoit plus et ne donne plus de remises partagées, tout en restant dans l'organisation."
  options:
    b:
      en: "An SCP only limits new purchases in the account; the account would still receive discounts shared by other accounts and share its existing commitments."
      fr: "Une SCP limite seulement les nouveaux achats dans le compte ; le compte recevrait toujours les remises partagées par d'autres comptes et partagerait ses engagements existants."
    c:
      en: "Organizational units and cost allocation tags do not change how commitment discounts are shared across the organization."
      fr: "Les unités d'organisation et les balises de répartition des coûts ne modifient pas le partage des remises d'engagement dans l'organisation."
    d:
      en: "Removing the account breaks the requirement that it stays in the organization until the sale is complete."
      fr: "Retirer le compte enfreint l'exigence de le maintenir dans l'organisation jusqu'à la finalisation de la cession."
references:
  - title: Reserved Instances and Savings Plans discount sharing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
