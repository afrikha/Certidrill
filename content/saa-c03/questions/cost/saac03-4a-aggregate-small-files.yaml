id: saac03-4a-aggregate-small-files
objective: "4.1.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A law firm must archive 300 million scanned document files that average 8 KB each. The files must be retained for 10 years and will be retrieved only in rare legal cases, when retrieving a whole case folder within 48 hours is acceptable. The firm wants the LOWEST total cost for uploading and storing the archive.

    Which solution will meet these requirements?
  fr: |
    Un cabinet d'avocats doit archiver 300 millions de fichiers de documents numérisés d'une taille moyenne de 8 Ko. Les fichiers doivent être conservés 10 ans et ne seront récupérés que dans de rares procédures, pour lesquelles récupérer un dossier complet en 48 heures est acceptable. Le cabinet veut le coût total le PLUS bas pour le chargement et le stockage de l'archive.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Upload each file individually to S3 Glacier Deep Archive by setting the storage class in each PUT request.", fr: "Charger chaque fichier individuellement dans S3 Glacier Deep Archive en indiquant la classe de stockage dans chaque requête PUT." }
    - id: b
      text: { en: "Upload each file to S3 Standard and add a lifecycle rule that transitions objects to S3 Glacier Deep Archive after 1 day.", fr: "Charger chaque fichier dans S3 Standard et ajouter une règle de cycle de vie qui fait passer les objets à S3 Glacier Deep Archive après 1 jour." }
    - id: c
      text: { en: "Bundle the files of each case folder into compressed archives of several GB and upload the archives to S3 Glacier Deep Archive.", fr: "Regrouper les fichiers de chaque dossier dans des archives compressées de plusieurs Go et charger ces archives dans S3 Glacier Deep Archive." }
    - id: d
      text: { en: "Upload each file to S3 Intelligent-Tiering and activate the Deep Archive Access tier for the bucket.", fr: "Charger chaque fichier dans S3 Intelligent-Tiering et activer le niveau Deep Archive Access pour le compartiment." }
answer: { optionId: c }
explanation:
  correct:
    en: "Every object stored in S3 Glacier Deep Archive carries about 40 KB of metadata, 8 KB of it billed at S3 Standard rates, which is five times the size of an 8 KB file, and every PUT or transition is a billed request. Aggregating the small files into a few large archives makes the per-object overhead and request charges negligible, and Deep Archive is the cheapest class when a 48-hour retrieval is acceptable."
    fr: "Chaque objet stocké dans S3 Glacier Deep Archive porte environ 40 Ko de métadonnées, dont 8 Ko facturés au tarif S3 Standard, soit cinq fois la taille d'un fichier de 8 Ko, et chaque PUT ou transition est une requête facturée. Regrouper les petits fichiers dans quelques grandes archives rend négligeables la surcharge par objet et les frais de requêtes, et Deep Archive est la classe la moins chère lorsqu'une récupération en 48 heures est acceptable."
  options:
    a:
      en: "300 million individual PUT requests and 40 KB of metadata overhead per object make this far more expensive than archiving aggregated files."
      fr: "300 millions de requêtes PUT individuelles et 40 Ko de surcharge de métadonnées par objet rendent cette option bien plus chère que l'archivage de fichiers regroupés."
    b:
      en: "Each object pays for a PUT and a transition request, keeps the 40 KB overhead, and by default lifecycle rules do not transition objects smaller than 128 KB."
      fr: "Chaque objet paie une requête PUT et une requête de transition, conserve la surcharge de 40 Ko, et par défaut les règles de cycle de vie ne font pas passer les objets de moins de 128 Ko."
    d:
      en: "Objects smaller than 128 KB are not monitored by Intelligent-Tiering and always stay in the Frequent Access tier, so they would never be archived."
      fr: "Les objets de moins de 128 Ko ne sont pas surveillés par S3 Intelligent-Tiering et restent toujours au niveau Frequent Access : ils ne seraient jamais archivés."
references:
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
