id: saac03-4a-glacier-flexible-hours
objective: "4.1.19"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A satellite imaging company keeps raw imagery in Amazon S3 for 5 years. The imagery is retrieved once or twice a year for reprocessing, and the reprocessing pipeline needs the data to be available within 6 hours of a request. Millisecond access is not required.

    Which storage class is the MOST cost-effective?
  fr: |
    Une entreprise d'imagerie satellite conserve des images brutes dans Amazon S3 pendant 5 ans. Les images sont récupérées une ou deux fois par an pour un retraitement, et le pipeline de retraitement a besoin que les données soient disponibles dans les 6 heures suivant une demande. L'accès en millisecondes n'est pas requis.

    Quelle classe de stockage est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "S3 Glacier Deep Archive", fr: "S3 Glacier Deep Archive" }
    - id: b
      text: { en: "S3 Glacier Instant Retrieval", fr: "S3 Glacier Instant Retrieval" }
    - id: c
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: d
      text: { en: "S3 Glacier Flexible Retrieval", fr: "S3 Glacier Flexible Retrieval" }
answer: { optionId: d }
explanation:
  correct:
    en: "S3 Glacier Flexible Retrieval is designed for archive data accessed about once a year. A standard retrieval completes in 3 to 5 hours, within the 6-hour requirement, and bulk retrievals are free, at a lower storage price than the classes that offer millisecond access."
    fr: "S3 Glacier Flexible Retrieval est conçu pour des données d'archive consultées environ une fois par an. Une récupération standard aboutit en 3 à 5 heures, dans la limite des 6 heures, et les récupérations en bloc (Bulk) sont gratuites, à un prix de stockage inférieur à celui des classes qui offrent un accès en millisecondes."
  options:
    a:
      en: "Deep Archive is cheaper to store, but a standard retrieval takes up to 12 hours and a bulk retrieval up to 48 hours, which fails the 6-hour requirement."
      fr: "S3 Glacier Deep Archive coûte moins cher en stockage, mais une récupération standard prend jusqu'à 12 heures et une récupération en bloc jusqu'à 48 heures, ce qui ne respecte pas l'exigence de 6 heures."
    b:
      en: "Glacier Instant Retrieval provides millisecond access, which is not required, at a higher storage price than Flexible Retrieval."
      fr: "S3 Glacier Instant Retrieval fournit un accès en millisecondes, non requis, à un prix de stockage supérieur à celui de Flexible Retrieval."
    c:
      en: "Standard-IA is designed for data accessed about once a month and has a much higher storage price than the Glacier archive classes."
      fr: "S3 Standard-IA est conçu pour des données consultées environ une fois par mois et son prix de stockage est bien supérieur à celui des classes d'archive Glacier."
references:
  - title: Understanding archive retrieval options
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/restoring-objects-retrieval-options.html
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
