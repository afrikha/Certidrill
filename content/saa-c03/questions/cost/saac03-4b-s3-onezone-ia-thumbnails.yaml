id: saac03-4b-s3-onezone-ia-thumbnails
objective: "4.1.21"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An e-commerce company generates image thumbnails from original product photos that are stored in S3 Standard. The thumbnails are stored in a separate S3 bucket, are accessed a few times each month, and must be returned in milliseconds when requested. If the thumbnails are lost, the company can regenerate them from the original photos.

    Which storage class should the company use for the thumbnails to meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise de commerce électronique génère des miniatures à partir des photos de produits originales stockées en S3 Standard. Les miniatures sont stockées dans un compartiment S3 distinct, sont consultées quelques fois par mois et doivent être renvoyées en quelques millisecondes lorsqu'elles sont demandées. En cas de perte, l'entreprise peut régénérer les miniatures à partir des photos originales.

    Quelle classe de stockage l'entreprise doit-elle utiliser pour les miniatures afin de répondre à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "S3 Standard"
        fr: "S3 Standard"
    - id: b
      text:
        en: "S3 Glacier Flexible Retrieval"
        fr: "S3 Glacier Flexible Retrieval"
    - id: c
      text:
        en: "S3 Standard-IA"
        fr: "S3 Standard-IA"
    - id: d
      text:
        en: "S3 One Zone-IA"
        fr: "S3 One Zone-IA"
answer: { optionId: d }
explanation:
  correct:
    en: "S3 One Zone-IA offers millisecond access at a lower price than S3 Standard-IA because it stores data in a single Availability Zone. AWS recommends it for infrequently accessed data that can be re-created, which is the case for thumbnails generated from the originals."
    fr: "S3 One Zone-IA offre un accès en quelques millisecondes à un prix inférieur à S3 Standard-IA, car il stocke les données dans une seule zone de disponibilité. AWS le recommande pour les données rarement consultées qui peuvent être recréées, ce qui est le cas des miniatures générées à partir des originaux."
  options:
    a:
      en: "S3 Standard has the highest storage price of these options and is meant for frequently accessed data."
      fr: "S3 Standard a le prix de stockage le plus élevé de ces options et est destiné aux données fréquemment consultées."
    b:
      en: "S3 Glacier Flexible Retrieval requires a restore that takes minutes to hours, so it cannot return thumbnails in milliseconds."
      fr: "S3 Glacier Flexible Retrieval exige une restauration qui prend de quelques minutes à quelques heures : il ne peut pas renvoyer les miniatures en quelques millisecondes."
    c:
      en: "S3 Standard-IA meets the access requirements but costs more than S3 One Zone-IA, and its multi-AZ resilience is not needed for data that can be regenerated."
      fr: "S3 Standard-IA répond aux exigences d'accès mais coûte plus cher que S3 One Zone-IA, et sa résilience multi-AZ n'est pas nécessaire pour des données régénérables."
references:
  - title: "Understanding and managing Amazon S3 storage classes"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
