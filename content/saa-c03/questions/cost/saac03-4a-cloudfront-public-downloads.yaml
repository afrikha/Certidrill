id: saac03-4a-cloudfront-public-downloads
objective: "4.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A software company distributes installer files from an Amazon S3 bucket in us-east-1 to anonymous users around the world. The same few files are downloaded millions of times each month, and S3 data transfer out and GET requests have become the largest items on the bill. The files must remain downloadable by anyone without AWS credentials.

    Which solution is the MOST cost-effective?
  fr: |
    Un éditeur de logiciels distribue des fichiers d'installation depuis un compartiment Amazon S3 situé dans us-east-1 à des utilisateurs anonymes du monde entier. Les mêmes quelques fichiers sont téléchargés des millions de fois par mois, et le transfert de données sortant d'Amazon S3 ainsi que les requêtes GET sont devenus les principaux postes de la facture. Les fichiers doivent rester téléchargeables par tous, sans informations d'identification AWS.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Enable Requester Pays on the bucket so that the users who download the files pay for the transfer.", fr: "Activer le paiement par le demandeur (Requester Pays) sur le compartiment pour que les utilisateurs qui téléchargent paient le transfert." }
    - id: b
      text: { en: "Serve the files through an Amazon CloudFront distribution that uses the bucket as its origin with origin access control.", fr: "Servir les fichiers via une distribution Amazon CloudFront qui utilise le compartiment comme origine avec un contrôle d'accès d'origine (OAC)." }
    - id: c
      text: { en: "Enable S3 Transfer Acceleration on the bucket and publish download links that use the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et publier des liens de téléchargement qui utilisent le point de terminaison accéléré." }
    - id: d
      text: { en: "Change the storage class of the files to S3 Standard-IA to lower the cost of the bucket.", fr: "Changer la classe de stockage des fichiers en S3 Standard-IA pour réduire le coût du compartiment." }
answer: { optionId: b }
explanation:
  correct:
    en: "Data transferred from S3 to CloudFront is not charged, and CloudFront edge locations cache the popular files, so most downloads no longer generate S3 GET requests or S3 data transfer out. Origin access control keeps the bucket private while the distribution stays public."
    fr: "Le transfert de données d'Amazon S3 vers CloudFront n'est pas facturé, et les emplacements périphériques CloudFront mettent en cache les fichiers populaires : la plupart des téléchargements ne génèrent plus de requêtes GET ni de transfert sortant depuis Amazon S3. Le contrôle d'accès d'origine garde le compartiment privé tandis que la distribution reste publique."
  options:
    a:
      en: "Requester Pays requires authenticated requests and blocks anonymous access, so users without AWS credentials could no longer download the files."
      fr: "Le paiement par le demandeur exige des requêtes authentifiées et bloque l'accès anonyme : les utilisateurs sans informations d'identification AWS ne pourraient plus télécharger les fichiers."
    c:
      en: "Transfer Acceleration adds a per-GB charge on top of data transfer; it speeds up long-distance transfers but increases cost."
      fr: "Transfer Acceleration ajoute des frais par Go en plus du transfert de données ; il accélère les transferts longue distance mais augmente le coût."
    d:
      en: "Storage is not the cost driver, and Standard-IA adds a per-GB retrieval fee that millions of downloads would make very expensive."
      fr: "Le stockage n'est pas le poste principal, et S3 Standard-IA ajoute des frais de récupération par Go que des millions de téléchargements rendraient très coûteux."
references:
  - title: S3 Pricing
    url: https://aws.amazon.com/s3/pricing/
