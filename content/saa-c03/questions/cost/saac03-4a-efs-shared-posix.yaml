id: saac03-4a-efs-shared-posix
objective: "4.1.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a content management system on 12 Linux Amazon EC2 instances spread across three Availability Zones. All instances must read and write the same files concurrently through a POSIX-compliant file system, and the storage must grow automatically as content is added.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un système de gestion de contenu sur 12 instances Amazon EC2 Linux réparties sur trois zones de disponibilité. Toutes les instances doivent lire et écrire simultanément les mêmes fichiers via un système de fichiers conforme POSIX, et le stockage doit croître automatiquement à mesure que du contenu est ajouté.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Block storage: one Amazon EBS gp3 volume attached to each instance", fr: "Stockage en bloc : un volume Amazon EBS gp3 attaché à chaque instance" }
    - id: b
      text: { en: "Object storage: an Amazon S3 bucket accessed through the S3 API", fr: "Stockage d'objets : un compartiment Amazon S3 accessible par l'API S3" }
    - id: c
      text: { en: "File storage: an Amazon EFS file system mounted on every instance", fr: "Stockage de fichiers : un système de fichiers Amazon EFS monté sur chaque instance" }
    - id: d
      text: { en: "Instance storage: instance store volumes synchronized every hour", fr: "Stockage d'instance : des volumes de stockage d'instance synchronisés toutes les heures" }
answer: { optionId: c }
explanation:
  correct:
    en: "Amazon EFS is shared file storage that many Linux instances in several Availability Zones can mount at the same time with NFS and POSIX semantics. An EFS file system grows and shrinks automatically as files are added and removed, and you pay only for the storage you use."
    fr: "Amazon EFS est un stockage de fichiers partagé que de nombreuses instances Linux de plusieurs zones de disponibilité peuvent monter simultanément en NFS, avec une sémantique POSIX. Un système de fichiers EFS croît et décroît automatiquement à mesure que des fichiers sont ajoutés ou supprimés, et vous ne payez que le stockage utilisé."
  options:
    a:
      en: "Each EBS volume is block storage attached to one instance in one Availability Zone, so the instances would not share the same files, and volumes have a fixed size."
      fr: "Chaque volume EBS est un stockage en bloc attaché à une instance dans une zone de disponibilité : les instances ne partageraient pas les mêmes fichiers, et les volumes ont une taille fixe."
    b:
      en: "S3 is object storage accessed through an API; it is not a POSIX file system that applications can mount and lock files in."
      fr: "Amazon S3 est un stockage d'objets accessible par API ; ce n'est pas un système de fichiers POSIX que les applications peuvent monter et sur lequel elles peuvent verrouiller des fichiers."
    d:
      en: "Instance store is temporary block storage local to each host; hourly synchronization is not concurrent shared access and data is lost with the instance."
      fr: "Le stockage d'instance est un stockage en bloc temporaire local à chaque hôte ; une synchronisation horaire n'est pas un accès partagé simultané, et les données sont perdues avec l'instance."
references:
  - title: Amazon Elastic File System (EFS) | Cloud File Storage | FAQs
    url: https://aws.amazon.com/efs/faq/
