id: saac03-4b-compute-savings-plan-flex
objective: "4.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a steady workload 24 hours a day on Amazon EC2 instances in the eu-west-1 Region. Over the next 3 years, the company plans to move part of the workload to Amazon ECS on AWS Fargate and might move some instances to the eu-central-1 Region. The company wants the largest discount that will keep applying after these changes, without exchanging or modifying any commitment.

    Which purchasing option will meet these requirements?
  fr: |
    Une entreprise exécute une charge de travail stable 24 heures sur 24 sur des instances Amazon EC2 dans la Région eu-west-1. Au cours des 3 prochaines années, elle prévoit de migrer une partie de la charge de travail vers Amazon ECS sur AWS Fargate et pourrait déplacer certaines instances vers la Région eu-central-1. L'entreprise souhaite la remise la plus élevée qui continuera de s'appliquer après ces changements, sans échanger ni modifier d'engagement.

    Quelle option d'achat répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "A 3-year Compute Savings Plan"
        fr: "Un Compute Savings Plan sur 3 ans"
    - id: b
      text:
        en: "A 3-year EC2 Instance Savings Plan for the current instance family in eu-west-1"
        fr: "Un EC2 Instance Savings Plan sur 3 ans pour la famille d'instances actuelle dans eu-west-1"
    - id: c
      text:
        en: "3-year Standard Reserved Instances for the current instance types in eu-west-1"
        fr: "Des Standard Reserved Instances sur 3 ans pour les types d'instances actuels dans eu-west-1"
    - id: d
      text:
        en: "Spot Instances requested through an EC2 Fleet in both Regions"
        fr: "Des Spot Instances demandées via une EC2 Fleet dans les deux Régions"
answer: { optionId: a }
explanation:
  correct:
    en: "A Compute Savings Plan applies to EC2 usage in any instance family, size, Region, operating system and tenancy, and it also covers AWS Fargate and AWS Lambda usage. The discount therefore keeps applying when the workload moves to Fargate or to another Region, with no exchange."
    fr: "Un Compute Savings Plan s'applique à l'utilisation EC2 quels que soient la famille et la taille d'instance, la Région, le système d'exploitation et la location, et couvre aussi l'utilisation d'AWS Fargate et d'AWS Lambda. La remise continue donc de s'appliquer lorsque la charge de travail passe sur Fargate ou dans une autre Région, sans échange."
  options:
    b:
      en: "An EC2 Instance Savings Plan offers a deeper discount but applies only to one instance family in one Region, and it never covers Fargate."
      fr: "Un EC2 Instance Savings Plan offre une remise plus élevée, mais ne s'applique qu'à une famille d'instances dans une Région, et ne couvre jamais Fargate."
    c:
      en: "Standard Reserved Instances are tied to their instance attributes and Region, and they do not apply to Fargate."
      fr: "Les Standard Reserved Instances sont liées à leurs attributs d'instance et à leur Région, et ne s'appliquent pas à Fargate."
    d:
      en: "Spot Instances can be interrupted, which is not suitable for a steady workload that must run all day, and they are not a commitment-based discount."
      fr: "Les Spot Instances peuvent être interrompues, ce qui ne convient pas à une charge de travail stable qui doit tourner en continu, et ne constituent pas une remise liée à un engagement."
references:
  - title: "Savings Plans types"
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html
