id: saac03-4c-alb-redirect-fixed-response
objective: "4.4.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's website runs behind an Application Load Balancer. A separate Auto Scaling group of EC2 instances does only two things: it redirects HTTP requests to HTTPS, and it returns a static 503 maintenance message during planned outages. The company wants to remove this fleet to cut costs and management effort.

    Which solution will meet these requirements?
  fr: |
    Le site web d'une entreprise fonctionne derrière un Application Load Balancer. Un groupe Auto Scaling distinct d'instances EC2 ne fait que deux choses : il redirige les requêtes HTTP vers HTTPS et renvoie un message de maintenance 503 statique pendant les interruptions planifiées. L'entreprise veut supprimer cette flotte pour réduire les coûts et l'effort de gestion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Configure the Application Load Balancer with a redirect action on the HTTP listener and a fixed-response rule on the HTTPS listener for maintenance.", fr: "Configurer l'Application Load Balancer avec une action redirect sur l'écouteur HTTP et une règle fixed-response sur l'écouteur HTTPS pour la maintenance." }
    - id: b
      text: { en: "Move the redirect and maintenance logic to AWS Lambda functions registered as targets of a Network Load Balancer.", fr: "Déplacer la logique de redirection et de maintenance dans des fonctions AWS Lambda enregistrées comme cibles d'un Network Load Balancer." }
    - id: c
      text: { en: "Replace the fleet with Spot Instances in the same Auto Scaling group.", fr: "Remplacer la flotte par des instances Spot dans le même groupe Auto Scaling." }
    - id: d
      text: { en: "Create an Amazon Route 53 failover record that points to a static maintenance page and redirects HTTP to HTTPS.", fr: "Créer un enregistrement de basculement Amazon Route 53 qui pointe vers une page de maintenance statique et redirige HTTP vers HTTPS." }
answer: { optionId: a }
explanation:
  correct:
    en: Application Load Balancer listener rules support a redirect action (for example HTTP to HTTPS with a 301) and a fixed-response action that returns a custom 2XX, 4XX or 5XX status with a message. The load balancer handles both, so the instances are no longer needed.
    fr: Les règles d'écouteur de l'Application Load Balancer prennent en charge une action redirect (par exemple de HTTP vers HTTPS avec un code 301) et une action fixed-response qui renvoie un code 2XX, 4XX ou 5XX personnalisé avec un message. L'équilibreur de charge gère les deux ; les instances ne sont donc plus nécessaires.
  options:
    b:
      en: Network Load Balancers cannot use Lambda functions as targets, and custom code is still more to manage than built-in listener actions.
      fr: Les Network Load Balancers ne peuvent pas utiliser des fonctions Lambda comme cibles, et du code personnalisé reste plus lourd à gérer que des actions d'écouteur intégrées.
    c:
      en: Spot Instances lower the price of the fleet but keep instances to manage, and they can be interrupted.
      fr: Les instances Spot réduisent le prix de la flotte mais conservent des instances à gérer, et elles peuvent être interrompues.
    d:
      en: DNS answers queries with records; Route 53 cannot redirect HTTP requests to HTTPS, and a failover record depends on health checks, not on planned maintenance.
      fr: Le DNS répond aux requêtes par des enregistrements ; Route 53 ne peut pas rediriger des requêtes HTTP vers HTTPS, et un enregistrement de basculement dépend de vérifications de l'état, pas de maintenances planifiées.
references:
  - title: Action types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-action-types.html
