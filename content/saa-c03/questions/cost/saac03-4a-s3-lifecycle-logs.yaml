id: saac03-4a-s3-lifecycle-logs
objective: "4.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company stores application log files of several megabytes each in an Amazon S3 bucket. Logs are read often during their first 30 days. From day 30 to day 90, the security team reads them a few times and needs millisecond access. After 90 days, logs are kept for compliance and are almost never read, and a retrieval time of up to 48 hours is acceptable. Logs must be deleted after 7 years.

    Which S3 Lifecycle design is the MOST cost-effective?
  fr: |
    Une entreprise stocke dans un compartiment Amazon S3 des fichiers journaux d'application de plusieurs mégaoctets chacun. Les journaux sont lus souvent pendant leurs 30 premiers jours. Du 30e au 90e jour, l'équipe de sécurité les lit quelques fois et a besoin d'un accès en millisecondes. Après 90 jours, les journaux sont conservés pour la conformité et ne sont presque plus lus, et un délai de récupération pouvant aller jusqu'à 48 heures est acceptable. Les journaux doivent être supprimés après 7 ans.

    Quelle conception de cycle de vie S3 est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Transition to S3 Standard-IA after 30 days and to S3 Glacier Instant Retrieval after 90 days, then expire after 7 years.", fr: "Transition vers S3 Standard-IA après 30 jours et vers S3 Glacier Instant Retrieval après 90 jours, puis expiration après 7 ans." }
    - id: b
      text: { en: "Transition to S3 Glacier Flexible Retrieval after 30 days and to S3 Glacier Deep Archive after 90 days, then expire after 7 years.", fr: "Transition vers S3 Glacier Flexible Retrieval après 30 jours et vers S3 Glacier Deep Archive après 90 jours, puis expiration après 7 ans." }
    - id: c
      text: { en: "Transition to S3 One Zone-IA after 30 days and keep the logs in that class until they expire after 7 years.", fr: "Transition vers S3 One Zone-IA après 30 jours et conservation des journaux dans cette classe jusqu'à leur expiration après 7 ans." }
    - id: d
      text: { en: "Transition to S3 Standard-IA after 30 days and to S3 Glacier Deep Archive after 90 days, then expire after 7 years.", fr: "Transition vers S3 Standard-IA après 30 jours et vers S3 Glacier Deep Archive après 90 jours, puis expiration après 7 ans." }
answer: { optionId: d }
explanation:
  correct:
    en: "S3 Standard-IA keeps millisecond access at a lower storage price for logs read only a few times between day 30 and day 90, and it is billed for its 30-day minimum before the next transition. S3 Glacier Deep Archive is the cheapest class for data read less than once a year when a retrieval of up to 48 hours is acceptable, and an expiration action deletes the logs after 7 years."
    fr: "S3 Standard-IA conserve l'accès en millisecondes à un prix de stockage plus bas pour des journaux lus seulement quelques fois entre le 30e et le 90e jour, et sa durée minimale de 30 jours est respectée avant la transition suivante. S3 Glacier Deep Archive est la classe la moins chère pour des données lues moins d'une fois par an lorsqu'une récupération en 48 heures maximum est acceptable, et une action d'expiration supprime les journaux après 7 ans."
  options:
    a:
      en: "Glacier Instant Retrieval provides millisecond access that is not needed after 90 days, at a higher storage price than Deep Archive for the 7-year retention."
      fr: "Glacier Instant Retrieval offre un accès en millisecondes inutile après 90 jours, à un prix de stockage supérieur à Deep Archive pour une rétention de 7 ans."
    b:
      en: "Glacier Flexible Retrieval requires a restore that takes minutes to hours, so it fails the millisecond access needed between day 30 and day 90."
      fr: "Glacier Flexible Retrieval exige une restauration de quelques minutes à quelques heures : il ne satisfait pas l'accès en millisecondes nécessaire entre le 30e et le 90e jour."
    c:
      en: "Keeping 7 years of logs in One Zone-IA costs much more than Deep Archive, and the data would be stored in a single Availability Zone."
      fr: "Conserver 7 ans de journaux dans One Zone-IA coûte bien plus cher que Deep Archive, et les données seraient stockées dans une seule zone de disponibilité."
references:
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
