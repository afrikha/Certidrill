id: saac03-4c-regional-nat-gateway
objective: "4.4.8"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs production workloads in private subnets of a VPC. The teams often move workloads into additional Availability Zones. Today the network team creates a zonal NAT gateway and a public subnet in each new zone and edits the route tables, and mistakes have caused outages. The company needs highly available outbound internet access with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des charges de travail de production dans les sous-réseaux privés d'un VPC. Les équipes déplacent souvent des charges de travail vers d'autres zones de disponibilité. Aujourd'hui, l'équipe réseau crée une passerelle NAT zonale et un sous-réseau public dans chaque nouvelle zone et modifie les tables de routage, et des erreurs ont provoqué des interruptions. L'entreprise a besoin d'un accès Internet sortant hautement disponible avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a regional NAT gateway in automatic mode and point the default route of every private subnet to its NAT gateway ID.", fr: "Créer une passerelle NAT régionale en mode automatique et faire pointer l'itinéraire par défaut de chaque sous-réseau privé vers l'ID de cette passerelle NAT." }
    - id: b
      text: { en: "Keep one zonal NAT gateway per Availability Zone and create them with an AWS CloudFormation template each time a zone is added.", fr: "Conserver une passerelle NAT zonale par zone de disponibilité et la créer avec un modèle AWS CloudFormation chaque fois qu'une zone est ajoutée." }
    - id: c
      text: { en: "Replace the NAT gateways with one zonal NAT gateway shared by all Availability Zones.", fr: "Remplacer les passerelles NAT par une seule passerelle NAT zonale partagée par toutes les zones de disponibilité." }
    - id: d
      text: { en: "Replace the NAT gateways with NAT instances in an Auto Scaling group that spans all Availability Zones.", fr: "Remplacer les passerelles NAT par des instances NAT dans un groupe Auto Scaling couvrant toutes les zones de disponibilité." }
answer: { optionId: a }
explanation:
  correct:
    en: A regional NAT gateway automatically expands into the zones where workloads run and contracts when a zone has none, which makes it highly available by default. It needs no public subnet, and one NAT gateway ID works in the routes of private subnets in all zones, so nothing has to be created or edited when a zone is added.
    fr: Une passerelle NAT régionale s'étend automatiquement aux zones où s'exécutent des charges de travail et se retire d'une zone qui n'en a plus, ce qui la rend hautement disponible par défaut. Elle ne nécessite aucun sous-réseau public, et un seul ID de passerelle NAT fonctionne dans les itinéraires des sous-réseaux privés de toutes les zones ; rien n'est donc à créer ni à modifier lorsqu'une zone est ajoutée.
  options:
    b:
      en: Templates reduce errors, but someone must still deploy a NAT gateway, a public subnet and route changes for every new zone.
      fr: Les modèles réduisent les erreurs, mais il faut toujours déployer une passerelle NAT, un sous-réseau public et des modifications d'itinéraires pour chaque nouvelle zone.
    c:
      en: A zonal NAT gateway is redundant only within its own zone; if that zone fails, every other zone loses internet access.
      fr: Une passerelle NAT zonale n'est redondante que dans sa propre zone ; si cette zone tombe en panne, toutes les autres zones perdent l'accès à Internet.
    d:
      en: NAT instances must be patched and need route updates when an instance is replaced, which adds overhead instead of removing it.
      fr: Les instances NAT doivent recevoir des correctifs et exigent une mise à jour des itinéraires lorsqu'une instance est remplacée, ce qui ajoute de la charge au lieu d'en retirer.
references:
  - title: Regional NAT gateways for automatic multi-AZ expansion
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateways-regional.html
