id: saac03-4c-rds-mysql-to-aurora-replica
objective: "4.3.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a 3 TB Amazon RDS for MySQL DB instance. The company wants to move the database to an Amazon Aurora MySQL DB cluster in the same Region. The application must keep accepting writes during the data copy, and the cutover must cause only a brief interruption. No extra migration service should be deployed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL de 3 To. Elle veut déplacer la base de données vers un cluster de bases de données Amazon Aurora MySQL dans la même Région. L'application doit continuer à accepter des écritures pendant la copie des données, et la bascule ne doit provoquer qu'une brève interruption. Aucun service de migration supplémentaire ne doit être déployé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Restore the latest automated snapshot of the DB instance as an Aurora MySQL DB cluster and point the application to the cluster.", fr: "Restaurer le dernier instantané automatisé de l'instance de base de données en tant que cluster de bases de données Aurora MySQL et y diriger l'application." }
    - id: b
      text: { en: "Create an Aurora read replica of the DB instance, stop writes when the replica lag reaches zero, promote the Aurora cluster and point the application to it.", fr: "Créer un réplica en lecture Aurora de l'instance de base de données, arrêter les écritures lorsque le décalage du réplica atteint zéro, promouvoir le cluster Aurora et y diriger l'application." }
    - id: c
      text: { en: "Convert the schema with DMS Schema Conversion, then export the tables with mysqldump and import them into the Aurora MySQL DB cluster.", fr: "Convertir le schéma avec DMS Schema Conversion, puis exporter les tables avec mysqldump et les importer dans le cluster de bases de données Aurora MySQL." }
    - id: d
      text: { en: "Add an Aurora Replica to the RDS for MySQL DB instance and fail over to it.", fr: "Ajouter un réplica Aurora à l'instance de base de données RDS for MySQL et basculer vers celui-ci." }
answer: { optionId: b }
explanation:
  correct:
    en: An Aurora read replica of an RDS for MySQL DB instance is loaded from a snapshot and then kept current with binary log replication while the source keeps taking writes. At cutover the company stops writes, waits for zero lag, promotes the cluster to stand-alone and switches the application endpoint.
    fr: Un réplica en lecture Aurora d'une instance RDS for MySQL est chargé à partir d'un instantané puis maintenu à jour par réplication des journaux binaires pendant que la source continue d'accepter des écritures. Lors de la bascule, l'entreprise arrête les écritures, attend un décalage nul, promeut le cluster en cluster autonome et change le point de terminaison de l'application.
  options:
    a:
      en: Writes made after the snapshot are not in the new cluster, so writes would have to stop for the whole restore of 3 TB.
      fr: Les écritures effectuées après l'instantané ne figurent pas dans le nouveau cluster ; il faudrait donc arrêter les écritures pendant toute la restauration des 3 To.
    c:
      en: MySQL to Aurora MySQL needs no schema conversion, and a dump and import of 3 TB requires a long write freeze.
      fr: Le passage de MySQL à Aurora MySQL ne nécessite aucune conversion de schéma, et un export puis un import de 3 To imposent un long gel des écritures.
    d:
      en: Aurora Replicas belong to an Aurora cluster and share its storage volume; they cannot be attached to an RDS for MySQL DB instance.
      fr: Les réplicas Aurora appartiennent à un cluster Aurora et partagent son volume de stockage ; ils ne peuvent pas être rattachés à une instance RDS for MySQL.
references:
  - title: Migrating data from an RDS for MySQL DB instance to an Amazon Aurora MySQL DB cluster by using an Aurora read replica
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/AuroraMySQL.Migrating.RDSMySQL.Replica.html
