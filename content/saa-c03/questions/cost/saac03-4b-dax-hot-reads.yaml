id: saac03-4b-dax-hot-reads
objective: "4.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A retail company stores its product catalog in an Amazon DynamoDB table in provisioned capacity mode. During flash sales, a small number of popular items are read millions of times, and the company provisions very high read capacity to avoid throttling. The application tolerates eventually consistent reads and needs microsecond read latency for these items. The company wants to reduce read capacity costs with minimal application changes.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution stocke son catalogue de produits dans une table Amazon DynamoDB en mode de capacité provisionnée. Pendant les ventes flash, un petit nombre d'articles populaires sont lus des millions de fois, et l'entreprise provisionne une capacité de lecture très élevée pour éviter la limitation. L'application tolère des lectures à cohérence éventuelle et a besoin d'une latence de lecture de l'ordre de la microseconde pour ces articles. L'entreprise souhaite réduire les coûts de capacité de lecture avec un minimum de modifications de l'application.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Switch the table to on-demand capacity mode."
        fr: "Passer la table en mode de capacité à la demande."
    - id: b
      text:
        en: "Deploy a DynamoDB Accelerator (DAX) cluster and point the application's DynamoDB client to the DAX endpoint."
        fr: "Déployer un cluster DynamoDB Accelerator (DAX) et faire pointer le client DynamoDB de l'application vers le point de terminaison DAX."
    - id: c
      text:
        en: "Create a global secondary index that contains only the popular items, and read from the index."
        fr: "Créer un index secondaire global qui ne contient que les articles populaires, et lire depuis cet index."
    - id: d
      text:
        en: "Deploy an Amazon ElastiCache cluster and rewrite the data access layer to use a cache-aside pattern."
        fr: "Déployer un cluster Amazon ElastiCache et réécrire la couche d'accès aux données pour utiliser un modèle cache-aside."
answer: { optionId: b }
explanation:
  correct:
    en: "DAX is an in-memory cache that is API-compatible with DynamoDB, so the application needs only minimal changes to use it. It returns eventually consistent reads in microseconds and serves repeated reads of hot items from memory, which reduces the read capacity that the table must provision."
    fr: "DAX est un cache en mémoire compatible avec l'API DynamoDB : l'application n'a besoin que de modifications minimes pour l'utiliser. Il renvoie les lectures à cohérence éventuelle en quelques microsecondes et sert depuis la mémoire les lectures répétées des articles populaires, ce qui réduit la capacité de lecture que la table doit provisionner."
  options:
    a:
      en: "On-demand mode removes capacity planning, but every read is still billed and latency stays in milliseconds."
      fr: "Le mode à la demande supprime la planification de la capacité, mais chaque lecture reste facturée et la latence reste de l'ordre de la milliseconde."
    c:
      en: "Reads from a global secondary index also consume read capacity and do not give microsecond latency."
      fr: "Les lectures depuis un index secondaire global consomment aussi de la capacité de lecture et n'offrent pas une latence de l'ordre de la microseconde."
    d:
      en: "ElastiCache could cache the items, but rewriting the data access layer is more than a minimal application change."
      fr: "ElastiCache pourrait mettre les articles en cache, mais réécrire la couche d'accès aux données dépasse une modification minimale de l'application."
references:
  - title: "In-memory acceleration with DynamoDB Accelerator (DAX)"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/DAX.html
