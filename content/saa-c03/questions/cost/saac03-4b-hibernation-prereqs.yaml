id: saac03-4b-hibernation-prereqs
objective: "4.2.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs an analytics application on Linux On-Demand Instances that have 64 GiB of RAM and are used only during business hours. Each time the application starts, it spends 25 minutes loading reference data into memory, so the company keeps the instances running overnight. The company will launch replacement instances so that it can stop them at night and resume them in the morning with the data already in memory.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute une application d'analyse sur des instances à la demande Linux dotées de 64 Gio de RAM, utilisées uniquement pendant les heures de bureau. À chaque démarrage, l'application passe 25 minutes à charger des données de référence en mémoire : l'entreprise laisse donc les instances fonctionner la nuit. L'entreprise va lancer des instances de remplacement afin de pouvoir les arrêter la nuit et les reprendre le matin avec les données déjà en mémoire.

    Quelle combinaison d'étapes répondra à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Launch the replacement instances from an AMI whose root device is an instance store volume."
        fr: "Lancer les instances de remplacement à partir d'une AMI dont le périphérique racine est un volume de stockage d'instance."
    - id: b
      text:
        en: "Enable hibernation when launching the replacement instances."
        fr: "Activer la mise en veille prolongée lors du lancement des instances de remplacement."
    - id: c
      text:
        en: "Use an encrypted EBS root volume that is large enough for the RAM contents plus the operating system and application."
        fr: "Utiliser un volume racine EBS chiffré assez grand pour contenir la RAM, le système d'exploitation et l'application."
    - id: d
      text:
        en: "Stop the current instances and modify them to enable hibernation before using them again."
        fr: "Arrêter les instances actuelles et les modifier pour activer la mise en veille prolongée avant de les réutiliser."
    - id: e
      text:
        en: "Launch the replacement instances as Dedicated Instances."
        fr: "Lancer les instances de remplacement en tant qu'instances dédiées (Dedicated Instances)."
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Hibernation saves the RAM contents to the EBS root volume and restores them at start, so processes resume with their data loaded, and the company pays only for EBS storage while the instance is stopped. Hibernation must be enabled at launch, and the root volume must be an encrypted EBS volume large enough to hold the RAM contents; 64 GiB is below the 150 GiB limit for Linux."
    fr: "La mise en veille prolongée enregistre le contenu de la RAM sur le volume racine EBS et le restaure au démarrage : les processus reprennent avec leurs données chargées, et l'entreprise ne paie que le stockage EBS pendant l'arrêt de l'instance. La mise en veille prolongée doit être activée au lancement, et le volume racine doit être un volume EBS chiffré assez grand pour contenir la RAM ; 64 Gio est inférieur à la limite de 150 Gio pour Linux."
  options:
    a:
      en: "Hibernation requires an EBS root volume; an instance store root cannot keep the RAM contents."
      fr: "La mise en veille prolongée exige un volume racine EBS ; une racine en stockage d'instance ne peut pas conserver le contenu de la RAM."
    d:
      en: "Hibernation can be enabled only when an instance is launched, not on an existing running or stopped instance."
      fr: "La mise en veille prolongée ne peut être activée qu'au lancement d'une instance, pas sur une instance existante, qu'elle soit en cours d'exécution ou arrêtée."
    e:
      en: "Dedicated tenancy adds cost and is not needed for hibernation."
      fr: "La location dédiée ajoute un coût et n'est pas nécessaire à la mise en veille prolongée."
references:
  - title: "Prerequisites for EC2 instance hibernation"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/hibernating-prerequisites.html
  - title: "Hibernate your Amazon EC2 instance"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html
