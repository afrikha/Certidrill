id: saac03-4a-ebs-shrink
objective: "4.1.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company provisioned a 4 TiB Amazon EBS gp3 data volume for a file-processing application. After six months, the volume holds only 600 GiB of data, and growth is expected to stay below 100 GiB per year. The company wants to stop paying for the unused capacity.

    Which solution will meet this requirement?
  fr: |
    Une entreprise a provisionné un volume de données Amazon EBS gp3 de 4 Tio pour une application de traitement de fichiers. Après six mois, le volume ne contient que 600 Gio de données, et la croissance devrait rester inférieure à 100 Gio par an. L'entreprise veut cesser de payer pour la capacité inutilisée.

    Quelle solution répond à cette exigence ?
body:
  options:
    - id: a
      text: { en: "Use Elastic Volumes to reduce the volume size to 1 TiB while the volume stays attached.", fr: "Utiliser Elastic Volumes pour réduire la taille du volume à 1 Tio pendant qu'il reste attaché." }
    - id: b
      text: { en: "Change the volume type to General Purpose SSD (gp2), which bills only for the data written.", fr: "Changer le type de volume en General Purpose SSD (gp2), qui ne facture que les données écrites." }
    - id: c
      text: { en: "Opt in to AWS Compute Optimizer so that it resizes the volume automatically to match the data.", fr: "Activer AWS Compute Optimizer pour qu'il redimensionne automatiquement le volume en fonction des données." }
    - id: d
      text: { en: "Create a new 1 TiB gp3 volume, copy the data with a file-level copy tool, and delete the original volume.", fr: "Créer un nouveau volume gp3 de 1 Tio, y copier les données avec un outil de copie de fichiers, puis supprimer le volume d'origine." }
answer: { optionId: d }
explanation:
  correct:
    en: "EBS volumes are billed for their provisioned size, and Elastic Volumes can increase the size of a volume but never decrease it. To get a smaller volume, AWS documents creating a new volume and copying the data with an application-level tool such as rsync or robocopy, which leaves room for several years of growth."
    fr: "Les volumes EBS sont facturés selon leur taille provisionnée, et Elastic Volumes peut augmenter la taille d'un volume mais jamais la réduire. Pour obtenir un volume plus petit, AWS indique de créer un nouveau volume et d'y copier les données avec un outil applicatif comme rsync ou robocopy, ce qui laisse ici de la marge pour plusieurs années de croissance."
  options:
    a:
      en: "Elastic Volumes supports only size increases; a request to decrease the size fails."
      fr: "Elastic Volumes ne prend en charge que les augmentations de taille ; une demande de réduction échoue."
    b:
      en: "gp2 volumes are also billed for their provisioned size, and gp2 costs more per GiB than gp3."
      fr: "Les volumes gp2 sont eux aussi facturés selon leur taille provisionnée, et gp2 coûte plus cher par Gio que gp3."
    c:
      en: "Compute Optimizer only recommends a volume type, size and IOPS; it does not modify volumes, and it cannot shrink one either."
      fr: "Compute Optimizer ne fait que recommander un type de volume, une taille et des IOPS ; il ne modifie pas les volumes et ne pourrait pas non plus en réduire un."
references:
  - title: Modify an Amazon EBS volume using Elastic Volumes operations
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html
