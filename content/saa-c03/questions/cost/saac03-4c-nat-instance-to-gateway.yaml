id: saac03-4c-nat-instance-to-gateway
objective: "4.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a production VPC across two Availability Zones. Each zone has a NAT instance on a large network-optimized EC2 instance type, chosen only to get enough bandwidth for peak hours. The operations team patches the instances every month and runs scripts to replace a failed instance. The company wants to stop paying for idle peak capacity and reduce administration.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un VPC de production sur deux zones de disponibilité. Chaque zone possède une instance NAT sur un grand type d'instance EC2 optimisé pour le réseau, choisi uniquement pour obtenir assez de bande passante aux heures de pointe. L'équipe des opérations applique les correctifs aux instances chaque mois et exécute des scripts pour remplacer une instance défaillante. L'entreprise veut cesser de payer une capacité de pointe inutilisée et réduire l'administration.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace each NAT instance with a NAT gateway in the same Availability Zone and update each private route table to use the NAT gateway in its zone.", fr: "Remplacer chaque instance NAT par une passerelle NAT dans la même zone de disponibilité et mettre à jour chaque table de routage privée pour utiliser la passerelle NAT de sa zone." }
    - id: b
      text: { en: "Move the NAT instances to Reserved Instances of the same instance type.", fr: "Faire passer les instances NAT en instances réservées du même type d'instance." }
    - id: c
      text: { en: "Place each NAT instance in an Auto Scaling group with a minimum and maximum of one instance.", fr: "Placer chaque instance NAT dans un groupe Auto Scaling avec un minimum et un maximum d'une instance." }
    - id: d
      text: { en: "Replace the NAT instances with a single smaller NAT instance in one Availability Zone.", fr: "Remplacer les instances NAT par une seule instance NAT plus petite dans une zone de disponibilité." }
answer: { optionId: a }
explanation:
  correct:
    en: A NAT gateway is managed by AWS, redundant within its zone, and scales automatically from 5 Gbps up to 100 Gbps, so no instance has to be oversized for the peak or patched. It is billed per hour and per GB processed, so the company pays for the traffic it actually sends. One NAT gateway per zone keeps the existing zone resilience.
    fr: Une passerelle NAT est gérée par AWS, redondante dans sa zone et évolue automatiquement de 5 Gbit/s jusqu'à 100 Gbit/s ; aucune instance n'a donc besoin d'être surdimensionnée pour le pic ni de recevoir des correctifs. Elle est facturée à l'heure et par Go traité ; l'entreprise paie donc le trafic qu'elle envoie réellement. Une passerelle NAT par zone conserve la résilience actuelle par zone.
  options:
    b:
      en: Reserved Instances lower the hourly rate but keep the oversized instances and all of the patching and replacement work.
      fr: Les instances réservées réduisent le tarif horaire mais conservent les instances surdimensionnées et tout le travail de correctifs et de remplacement.
    c:
      en: An Auto Scaling group can replace a failed instance, but the instance still needs patching, route updates after replacement and peak sizing.
      fr: Un groupe Auto Scaling peut remplacer une instance défaillante, mais l'instance demande toujours des correctifs, une mise à jour des itinéraires après remplacement et un dimensionnement pour le pic.
    d:
      en: A single small instance cannot carry the peak bandwidth and removes the zone resilience of a production VPC.
      fr: Une seule petite instance ne peut pas absorber la bande passante de pointe et supprime la résilience par zone d'un VPC de production.
references:
  - title: NAT gateway basics
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html
  - title: NAT instances
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_NAT_Instance.html
