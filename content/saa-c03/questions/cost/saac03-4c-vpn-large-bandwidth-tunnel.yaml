id: saac03-4c-vpn-large-bandwidth-tunnel
objective: "4.4.14"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company in the eu-west-1 Region connects its data center to one VPC with an AWS Site-to-Site VPN connection on a virtual private gateway. Replication traffic now needs about 4 Gbps, but each standard tunnel supports up to 1.25 Gbps. The customer gateway has a fixed public IP address and supports BGP. The company wants to reach the bandwidth with the FEWEST VPN connections to manage and without Direct Connect.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de la Région eu-west-1 relie son centre de données à un VPC avec une connexion AWS Site-to-Site VPN sur une passerelle réseau privé virtuel. Le trafic de réplication a maintenant besoin d'environ 4 Gbit/s, mais chaque tunnel standard prend en charge jusqu'à 1,25 Gbit/s. La passerelle client a une adresse IP publique fixe et prend en charge BGP. L'entreprise veut atteindre cette bande passante avec le MOINS de connexions VPN possible à gérer et sans Direct Connect.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the tunnels of the existing VPN connection on the virtual private gateway to use large bandwidth tunnels.", fr: "Modifier les tunnels de la connexion VPN existante sur la passerelle réseau privé virtuel pour utiliser des tunnels à large bande passante." }
    - id: b
      text: { en: "Attach the VPC to a transit gateway and create one VPN connection on the transit gateway with large bandwidth tunnels of up to 5 Gbps.", fr: "Attacher le VPC à une passerelle de transit et créer une connexion VPN sur celle-ci avec des tunnels à large bande passante allant jusqu'à 5 Gbit/s." }
    - id: c
      text: { en: "Create three more VPN connections with static routing on the virtual private gateway and spread the traffic with ECMP.", fr: "Créer trois connexions VPN supplémentaires à routage statique sur la passerelle réseau privé virtuel et répartir le trafic avec ECMP." }
    - id: d
      text: { en: "Turn on acceleration for the existing VPN connection so that it uses the AWS Global Accelerator network.", fr: "Activer l'accélération sur la connexion VPN existante afin qu'elle utilise le réseau AWS Global Accelerator." }
answer: { optionId: b }
explanation:
  correct:
    en: Large bandwidth tunnels support up to 5 Gbps each and are available for VPN connections on a transit gateway or AWS Cloud WAN, with a customer gateway that has a fixed IP address. One such connection covers 4 Gbps; beyond 5 Gbps, ECMP across several connections with dynamic routing would be needed.
    fr: Les tunnels à large bande passante prennent en charge jusqu'à 5 Gbit/s chacun et sont disponibles pour les connexions VPN sur une passerelle de transit ou AWS Cloud WAN, avec une passerelle client disposant d'une adresse IP fixe. Une seule connexion de ce type couvre 4 Gbit/s ; au-delà de 5 Gbit/s, il faudrait ECMP sur plusieurs connexions avec routage dynamique.
  options:
    a:
      en: Large bandwidth tunnels are not supported for virtual private gateway attachments.
      fr: Les tunnels à large bande passante ne sont pas pris en charge pour les attachements de passerelle réseau privé virtuel.
    c:
      en: ECMP aggregation of VPN tunnels works on a transit gateway and requires dynamic routing; it is not supported for VPN connections with static routing.
      fr: L'agrégation ECMP de tunnels VPN fonctionne sur une passerelle de transit et exige le routage dynamique ; elle n'est pas prise en charge pour les connexions VPN à routage statique.
    d:
      en: Acceleration improves the path to AWS but does not raise the per-tunnel bandwidth limit, and accelerated VPN cannot use large bandwidth tunnels.
      fr: L'accélération améliore le chemin vers AWS mais ne relève pas la limite de bande passante par tunnel, et un VPN accéléré ne peut pas utiliser de tunnels à large bande passante.
references:
  - title: Tunnel options for your AWS Site-to-Site VPN connection
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPNTunnels.html
  - title: AWS Site-to-Site VPN quotas
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/vpn-limits.html
