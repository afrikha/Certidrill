id: saac03-4c-tags-network-costs
objective: "4.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs workloads for three business units in one AWS account. Each business unit has its own NAT gateways, VPC interface endpoints and Application Load Balancers. The finance team wants the monthly cost of these network resources broken down by business unit in AWS Cost Explorer.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise exécute les charges de travail de trois divisions dans un seul compte AWS. Chaque division possède ses propres passerelles NAT, points de terminaison d'interface et Application Load Balancers. L'équipe financière veut voir dans AWS Cost Explorer le coût mensuel de ces ressources réseau ventilé par division.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Apply a BusinessUnit tag with the business unit name to each network resource.", fr: "Appliquer une balise BusinessUnit portant le nom de la division à chaque ressource réseau." } }
    - { id: b, text: { en: "Create a separate VPC for each business unit and enable VPC Flow Logs.", fr: "Créer un VPC distinct pour chaque division et activer les journaux de flux VPC." } }
    - { id: c, text: { en: "Activate the BusinessUnit tag key as a cost allocation tag in the Billing and Cost Management console.", fr: "Activer la clé de balise BusinessUnit comme balise de répartition des coûts dans la console Billing and Cost Management." } }
    - { id: d, text: { en: "Create an AWS Budgets usage budget for each business unit.", fr: "Créer un budget d'utilisation AWS Budgets pour chaque division." } }
    - { id: e, text: { en: "Turn on AWS Config to record the configuration of every network resource.", fr: "Activer AWS Config pour enregistrer la configuration de chaque ressource réseau." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: User-defined tags must first be applied to the resources, and then the tag key must be activated as a cost allocation tag before Cost Explorer and the cost reports can group costs by it. Tag keys can take up to 24 hours to appear on the cost allocation tags page, and activation can take up to another 24 hours.
    fr: Les balises définies par l'utilisateur doivent d'abord être appliquées aux ressources, puis la clé de balise doit être activée comme balise de répartition des coûts pour que Cost Explorer et les rapports de coûts puissent regrouper les coûts selon elle. Les clés de balise peuvent mettre jusqu'à 24 heures pour apparaître sur la page des balises de répartition des coûts, et l'activation peut prendre jusqu'à 24 heures de plus.
  options:
    b:
      en: Flow logs record IP traffic, not costs, and separate VPCs do not create a cost breakdown in Cost Explorer.
      fr: Les journaux de flux enregistrent le trafic IP, pas les coûts, et des VPC distincts ne créent pas de ventilation des coûts dans Cost Explorer.
    d:
      en: Budgets alert on thresholds; without activated tags they cannot attribute the network costs to a business unit.
      fr: Les budgets alertent sur des seuils ; sans balises activées, ils ne peuvent pas attribuer les coûts réseau à une division.
    e:
      en: AWS Config tracks resource configuration changes; it does not allocate costs.
      fr: AWS Config suit les modifications de configuration des ressources ; il ne répartit pas les coûts.
references:
  - title: Activating user-defined cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/activating-tags.html
