id: saac03-4a-fsx-windows-smb
objective: "4.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company is migrating a Windows-based document management application to AWS. The application servers run Windows Server, store documents in shared folders accessed over SMB, and use Microsoft Active Directory groups to control access to the folders. The company wants a fully managed file storage service.

    Which storage service will meet these requirements?
  fr: |
    Une entreprise migre vers AWS une application de gestion documentaire basée sur Windows. Les serveurs d'application exécutent Windows Server, stockent les documents dans des dossiers partagés accessibles en SMB et utilisent des groupes Microsoft Active Directory pour contrôler l'accès aux dossiers. L'entreprise veut un service de stockage de fichiers entièrement géré.

    Quel service de stockage répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon EFS with an EFS access point for each application server", fr: "Amazon EFS avec un point d'accès EFS pour chaque serveur d'application" }
    - id: b
      text: { en: "Amazon FSx for Windows File Server joined to the Active Directory domain", fr: "Amazon FSx for Windows File Server joint au domaine Active Directory" }
    - id: c
      text: { en: "Amazon FSx for Lustre linked to an Amazon S3 bucket", fr: "Amazon FSx for Lustre lié à un compartiment Amazon S3" }
    - id: d
      text: { en: "Amazon S3 with a bucket policy for each Active Directory group", fr: "Amazon S3 avec une politique de compartiment pour chaque groupe Active Directory" }
answer: { optionId: b }
explanation:
  correct:
    en: "FSx for Windows File Server is a fully managed file system built on Windows, accessed over SMB, and joined to Microsoft Active Directory when it is created, so folder permissions keep using AD users and groups."
    fr: "FSx for Windows File Server est un système de fichiers entièrement géré, basé sur Windows, accessible en SMB et joint à Microsoft Active Directory lors de sa création : les autorisations des dossiers continuent d'utiliser les utilisateurs et groupes AD."
  options:
    a:
      en: "Amazon EFS is an NFS file system for Linux clients; it does not provide SMB shares for Windows servers."
      fr: "Amazon EFS est un système de fichiers NFS pour clients Linux ; il ne fournit pas de partages SMB pour des serveurs Windows."
    c:
      en: "FSx for Lustre is a high-performance POSIX file system for Linux HPC and ML workloads, not an SMB file share."
      fr: "FSx for Lustre est un système de fichiers POSIX hautes performances pour les charges HPC et ML sous Linux, pas un partage de fichiers SMB."
    d:
      en: "Amazon S3 is object storage accessed through an API; it does not offer SMB shared folders with Active Directory permissions."
      fr: "Amazon S3 est un stockage d'objets accessible par API ; il n'offre pas de dossiers partagés SMB avec des autorisations Active Directory."
references:
  - title: What is FSx for Windows File Server?
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html
