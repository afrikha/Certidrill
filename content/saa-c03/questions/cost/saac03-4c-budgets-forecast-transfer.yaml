id: saac03-4c-budgets-forecast-transfer
objective: "4.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A video company's data transfer costs vary a lot from month to month. The operations team wants an email as soon as the data transfer costs for the current month are predicted to exceed $20,000, before the money is actually spent. The solution must require no custom code.

    Which solution will meet these requirements?
  fr: |
    Les coûts de transfert de données d'une entreprise vidéo varient beaucoup d'un mois à l'autre. L'équipe des opérations veut recevoir un e-mail dès que les coûts de transfert de données du mois en cours sont prévus au-delà de 20 000 $, avant que l'argent ne soit réellement dépensé. La solution ne doit exiger aucun code personnalisé.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Budgets monthly cost budget filtered on data transfer with an alert on forecasted costs above $20,000.", fr: "Créer un budget de coûts mensuel AWS Budgets filtré sur le transfert de données avec une alerte sur les coûts prévus au-delà de 20 000 $." }
    - id: b
      text: { en: "Create an Amazon CloudWatch billing alarm on the EstimatedCharges metric with a threshold of $20,000.", fr: "Créer une alarme de facturation Amazon CloudWatch sur la métrique EstimatedCharges avec un seuil de 20 000 $." }
    - id: c
      text: { en: "Open AWS Cost Explorer each morning and check the forecast for data transfer costs.", fr: "Ouvrir AWS Cost Explorer chaque matin et vérifier la prévision des coûts de transfert de données." }
    - id: d
      text: { en: "Deliver the AWS Cost and Usage Report to Amazon S3 and query it daily with Amazon Athena.", fr: "Livrer AWS Cost and Usage Report dans Amazon S3 et l'interroger chaque jour avec Amazon Athena." }
answer: { optionId: a }
explanation:
  correct:
    en: AWS Budgets cost budgets can be filtered to a cost dimension and notify an email address or an Amazon SNS topic when costs are forecasted to exceed the budget, not only when they have already occurred. It is configured in the console with no code.
    fr: Les budgets de coûts AWS Budgets peuvent être filtrés sur une dimension de coût et avertir une adresse e-mail ou une rubrique Amazon SNS lorsque les coûts sont prévus au-delà du budget, et pas seulement lorsqu'ils sont déjà engagés. La configuration se fait dans la console, sans code.
  options:
    b:
      en: The EstimatedCharges metric reflects charges already incurred, so the alarm fires after the money is spent, not on a forecast.
      fr: La métrique EstimatedCharges reflète les frais déjà engagés ; l'alarme se déclenche donc une fois l'argent dépensé, pas sur une prévision.
    c:
      en: Cost Explorer can forecast costs, but a manual daily check is not an automatic alert.
      fr: Cost Explorer peut prévoir les coûts, mais une vérification manuelle quotidienne n'est pas une alerte automatique.
    d:
      en: Querying the report gives detailed past usage; turning it into a forecast and an email needs custom code.
      fr: Interroger le rapport donne une utilisation passée détaillée ; en tirer une prévision et un e-mail exige du code personnalisé.
references:
  - title: Managing your costs with AWS Budgets
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
