id: saac03-4c-private-ip-vpn-over-dx
objective: "4.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A healthcare company connects its data center to several VPCs through a 1 Gbps AWS Direct Connect hosted connection, a transit virtual interface and a transit gateway. A new regulation requires all traffic to be encrypted in transit. Traffic must stay on the private Direct Connect link, and no public IP addresses can be used for the encryption endpoints. The company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de santé relie son centre de données à plusieurs VPC via une connexion hébergée AWS Direct Connect de 1 Gbit/s, une interface virtuelle de transit et une passerelle de transit. Une nouvelle réglementation exige que tout le trafic soit chiffré en transit. Le trafic doit rester sur la liaison Direct Connect privée, et aucune adresse IP publique ne peut être utilisée pour les points de terminaison de chiffrement. L'entreprise veut le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable MACsec on the existing hosted connection.", fr: "Activer MACsec sur la connexion hébergée existante." }
    - id: b
      text: { en: "Create a Site-to-Site VPN connection to the transit gateway over the internet and remove the Direct Connect connection.", fr: "Créer une connexion Site-to-Site VPN vers la passerelle de transit via Internet et supprimer la connexion Direct Connect." }
    - id: c
      text: { en: "Deploy third-party VPN appliances on EC2 instances in each VPC and build IPsec tunnels to them over the transit virtual interface.", fr: "Déployer des appliances VPN tierces sur des instances EC2 dans chaque VPC et construire des tunnels IPsec vers elles via l'interface virtuelle de transit." }
    - id: d
      text: { en: "Create a Private IP Site-to-Site VPN connection on the transit gateway that runs over the Direct Connect transit virtual interface.", fr: "Créer une connexion Site-to-Site VPN à IP privées sur la passerelle de transit, qui passe par l'interface virtuelle de transit Direct Connect." }
answer: { optionId: d }
explanation:
  correct:
    en: Private IP VPN runs IPsec over Direct Connect through a transit virtual interface, with private IP addresses on both the transit gateway and customer gateway ends. It encrypts traffic on the private link without public endpoints and without third-party VPN equipment to manage.
    fr: Le VPN à IP privées fait passer IPsec sur Direct Connect via une interface virtuelle de transit, avec des adresses IP privées aux deux extrémités, côté passerelle de transit et côté passerelle client. Il chiffre le trafic sur la liaison privée sans point de terminaison public et sans équipement VPN tiers à gérer.
  options:
    a:
      en: MACsec is supported only on 10, 100 and 400 Gbps dedicated connections; it is not available on 1 Gbps or hosted connections.
      fr: MACsec n'est pris en charge que sur les connexions dédiées de 10, 100 et 400 Gbit/s ; il n'est pas disponible sur les connexions de 1 Gbit/s ni sur les connexions hébergées.
    b:
      en: An internet VPN uses public endpoints and moves the traffic off the private Direct Connect link, which breaks two requirements.
      fr: Un VPN sur Internet utilise des points de terminaison publics et fait sortir le trafic de la liaison Direct Connect privée, ce qui enfreint deux exigences.
    c:
      en: Self-managed appliances in every VPC can encrypt the traffic, but they must be sized, patched and made highly available, which is far more overhead.
      fr: Des appliances autogérées dans chaque VPC peuvent chiffrer le trafic, mais elles doivent être dimensionnées, corrigées et rendues hautement disponibles, ce qui représente bien plus d'effort.
references:
