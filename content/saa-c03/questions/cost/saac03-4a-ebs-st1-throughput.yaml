id: saac03-4a-ebs-st1-throughput
objective: "4.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a log-processing application on an Amazon EC2 instance. Every night, the application reads 12 TiB of log files sequentially in large blocks and needs about 400 MiB/s of throughput. The logs are stored on a dedicated data volume, not on the boot volume. The company wants the lowest storage cost that meets the throughput requirement.

    Which Amazon EBS volume type should the company use for the data volume?
  fr: |
    Une entreprise exécute une application de traitement de journaux sur une instance Amazon EC2. Chaque nuit, l'application lit séquentiellement 12 Tio de fichiers journaux par gros blocs et a besoin d'un débit d'environ 400 Mio/s. Les journaux sont stockés sur un volume de données dédié, pas sur le volume de démarrage. L'entreprise veut le coût de stockage le plus bas qui satisfait l'exigence de débit.

    Quel type de volume Amazon EBS l'entreprise doit-elle utiliser pour le volume de données ?
body:
  options:
    - id: a
      text: { en: "Cold HDD (sc1)", fr: "Cold HDD (sc1)" }
    - id: b
      text: { en: "Throughput Optimized HDD (st1)", fr: "Throughput Optimized HDD (st1)" }
    - id: c
      text: { en: "General Purpose SSD (gp3) with 400 MiB/s of provisioned throughput", fr: "General Purpose SSD (gp3) avec 400 Mio/s de débit provisionné" }
    - id: d
      text: { en: "Provisioned IOPS SSD (io2 Block Express)", fr: "Provisioned IOPS SSD (io2 Block Express)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Throughput Optimized HDD (st1) is designed for large sequential workloads such as big data, data warehouses and log processing, delivers up to 500 MiB/s per volume, and costs less per GiB than SSD volumes. It cannot be a boot volume, which does not matter for a data volume."
    fr: "Throughput Optimized HDD (st1) est conçu pour les charges séquentielles volumineuses comme le big data, les entrepôts de données et le traitement de journaux, offre jusqu'à 500 Mio/s par volume et coûte moins cher par Gio que les volumes SSD. Il ne peut pas servir de volume de démarrage, ce qui est sans importance pour un volume de données."
  options:
    a:
      en: "Cold HDD (sc1) is the cheapest volume type, but its maximum throughput of 250 MiB/s is below the 400 MiB/s requirement."
      fr: "Cold HDD (sc1) est le type de volume le moins cher, mais son débit maximal de 250 Mio/s est inférieur à l'exigence de 400 Mio/s."
    c:
      en: "gp3 can deliver 400 MiB/s, but SSD storage costs more per GiB than st1 and the extra throughput is billed on top of the 125 MiB/s baseline."
      fr: "gp3 peut fournir 400 Mio/s, mais le stockage SSD coûte plus cher par Gio que st1, et le débit supplémentaire est facturé en plus des 125 Mio/s de base."
    d:
      en: "io2 Block Express is designed for IOPS-intensive, latency-sensitive databases and is the most expensive option for a sequential throughput workload."
      fr: "io2 Block Express est conçu pour les bases de données exigeantes en IOPS et sensibles à la latence ; c'est l'option la plus chère pour une charge séquentielle axée sur le débit."
references:
  - title: Amazon EBS volume types
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
