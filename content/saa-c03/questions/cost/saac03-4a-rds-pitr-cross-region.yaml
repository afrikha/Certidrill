id: saac03-4a-rds-pitr-cross-region
objective: "4.1.17"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a production database on Amazon RDS for MySQL. The company must be able to restore the database to any second within the last 14 days. In addition, one backup per month must be kept for 1 year in a second AWS Region for disaster recovery. The company wants to manage both requirements in one place with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une base de données de production sur Amazon RDS for MySQL. Elle doit pouvoir restaurer la base de données à n'importe quelle seconde des 14 derniers jours. En outre, une sauvegarde par mois doit être conservée pendant 1 an dans une seconde Région AWS pour la reprise après sinistre. L'entreprise veut gérer ces deux exigences à un seul endroit, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An AWS Backup plan with a continuous backup rule retained for 1 year that copies the continuous backups to the second Region.", fr: "Un plan AWS Backup avec une règle de sauvegarde continue conservée 1 an qui copie les sauvegardes continues dans la seconde Région." }
    - id: b
      text: { en: "A cross-Region read replica of the DB instance in the second Region, kept for 1 year.", fr: "Un réplica en lecture entre Régions de l'instance dans la seconde Région, conservé 1 an." }
    - id: c
      text: { en: "An Amazon Data Lifecycle Manager policy that takes monthly snapshots of the DB instance and copies them to the second Region.", fr: "Une politique Amazon Data Lifecycle Manager qui prend des instantanés mensuels de l'instance et les copie dans la seconde Région." }
    - id: d
      text: { en: "An AWS Backup plan with a continuous backup rule retained for 14 days and a monthly rule that copies each backup to the second Region with 1-year retention.", fr: "Un plan AWS Backup avec une règle de sauvegarde continue conservée 14 jours et une règle mensuelle qui copie chaque sauvegarde dans la seconde Région avec une rétention de 1 an." }
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Backup supports continuous backups and point-in-time recovery for Amazon RDS, with a retention of up to 35 days, which covers the 14-day requirement. A second rule in the same backup plan takes a monthly snapshot backup and copies it to a backup vault in the other Region with its own 1-year lifecycle."
    fr: "AWS Backup prend en charge les sauvegardes continues et la restauration à un instant dans le passé pour Amazon RDS, avec une rétention pouvant atteindre 35 jours, ce qui couvre l'exigence de 14 jours. Une seconde règle du même plan de sauvegarde prend une sauvegarde mensuelle par instantané et la copie dans un coffre-fort de sauvegarde de l'autre Région, avec son propre cycle de vie de 1 an."
  options:
    a:
      en: "Continuous backups can be retained for at most 35 days, and RDS continuous backups cannot be copied because transaction logs are not copied."
      fr: "Les sauvegardes continues peuvent être conservées 35 jours au maximum, et les sauvegardes continues RDS ne peuvent pas être copiées, car les journaux de transactions ne le sont pas."
    b:
      en: "A read replica mirrors the current data, including accidental deletions; it provides no history of monthly backups to restore from."
      fr: "Un réplica en lecture reflète les données actuelles, y compris les suppressions accidentelles ; il ne fournit aucun historique de sauvegardes mensuelles à restaurer."
    c:
      en: "Data Lifecycle Manager manages EBS snapshots and EBS-backed AMIs only; it cannot back up RDS DB instances."
      fr: "Data Lifecycle Manager ne gère que les instantanés EBS et les AMI basées sur EBS ; il ne peut pas sauvegarder des instances RDS."
references:
  - title: Continuous backups and point-in-time recovery (PITR)
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/point-in-time-recovery.html
  - title: Backup plan options and configuration
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/plan-options-and-configuration.html
