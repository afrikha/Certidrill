id: saac03-4c-neptune-fraud-graph
objective: "4.3.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A payments company wants to detect fraud rings by following relationships between accounts, devices, cards and addresses several hops deep. The queries must return in milliseconds over billions of relationships. The company wants a fully managed database built for this access pattern.

    Which AWS service will meet these requirements?
  fr: |
    Une société de paiement veut détecter des réseaux de fraude en suivant, sur plusieurs niveaux, les relations entre comptes, appareils, cartes et adresses. Les requêtes doivent répondre en quelques millisecondes sur des milliards de relations. L'entreprise veut une base de données entièrement gérée conçue pour ce modèle d'accès.

    Quel service AWS répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon Neptune", fr: "Amazon Neptune" }
    - id: b
      text: { en: "Amazon Redshift", fr: "Amazon Redshift" }
    - id: c
      text: { en: "Amazon DynamoDB", fr: "Amazon DynamoDB" }
    - id: d
      text: { en: "Amazon Aurora MySQL", fr: "Amazon Aurora MySQL" }
answer: { optionId: a }
explanation:
  correct:
    en: Neptune is a fully managed graph database designed to store billions of relationships and query them with millisecond latency. Fraud detection over connected entities is one of its documented use cases, queried with Gremlin, openCypher or SPARQL.
    fr: Neptune est une base de données orientée graphe entièrement gérée, conçue pour stocker des milliards de relations et les interroger avec une latence de l'ordre de la milliseconde. La détection de fraude sur des entités connectées fait partie de ses cas d'usage documentés, avec des requêtes Gremlin, openCypher ou SPARQL.
  options:
    b:
      en: Redshift is a columnar data warehouse for analytic aggregates, not for millisecond traversals of relationships.
      fr: Redshift est un entrepôt de données en colonnes pour des agrégats analytiques, pas pour des parcours de relations en quelques millisecondes.
    c:
      en: DynamoDB delivers fast key-value access but has no JOIN or graph traversal; multi-hop queries would need many round trips and application logic.
      fr: DynamoDB offre un accès clé-valeur rapide mais aucune jointure ni aucun parcours de graphe ; des requêtes sur plusieurs niveaux exigeraient de nombreux allers-retours et de la logique applicative.
    d:
      en: A relational engine needs one self-join per hop; deep relationship queries over billions of rows become slow and costly.
      fr: Un moteur relationnel exige une auto-jointure par niveau ; des requêtes profondes sur des milliards de lignes deviennent lentes et coûteuses.
references:
  - title: What Is Amazon Neptune?
    url: https://docs.aws.amazon.com/neptune/latest/userguide/intro.html
