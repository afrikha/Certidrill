id: saac03-4a-backup-central-org
objective: "4.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs workloads on Amazon EC2, Amazon RDS, Amazon DynamoDB and Amazon EFS in 20 AWS accounts that belong to one organization in AWS Organizations. Each team currently maintains its own backup scripts. The company wants consistent daily backups with 35-day retention in every account and wants to manage backups from a central place with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des charges de travail sur Amazon EC2, Amazon RDS, Amazon DynamoDB et Amazon EFS dans 20 comptes AWS qui appartiennent à une même organisation AWS Organizations. Chaque équipe maintient actuellement ses propres scripts de sauvegarde. L'entreprise veut des sauvegardes quotidiennes homogènes, conservées 35 jours, dans tous les comptes, et veut gérer les sauvegardes depuis un point central avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use AWS Backup with backup policies in AWS Organizations that apply the same backup plan to all accounts.", fr: "Utiliser AWS Backup avec des politiques de sauvegarde AWS Organizations qui appliquent le même plan de sauvegarde à tous les comptes." }
    - id: b
      text: { en: "Create Amazon Data Lifecycle Manager policies in each account that back up all the resources daily.", fr: "Créer dans chaque compte des politiques Amazon Data Lifecycle Manager qui sauvegardent chaque jour toutes les ressources." }
    - id: c
      text: { en: "Deploy AWS Lambda functions in each account that create snapshots daily and delete old snapshots.", fr: "Déployer dans chaque compte des fonctions AWS Lambda qui créent des instantanés chaque jour et suppriment les anciens." }
    - id: d
      text: { en: "Deploy AWS Config rules that detect resources without recent backups and notify each team.", fr: "Déployer des règles AWS Config qui détectent les ressources sans sauvegarde récente et préviennent chaque équipe." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Backup centralizes policy-based backups for EC2, RDS, DynamoDB, EFS and many other services. With AWS Organizations, backup policies deploy the same backup plan, schedule and retention to every account in the organization, with no scripts to maintain."
    fr: "AWS Backup centralise des sauvegardes basées sur des politiques pour EC2, RDS, DynamoDB, EFS et de nombreux autres services. Avec AWS Organizations, les politiques de sauvegarde déploient le même plan, la même planification et la même rétention dans tous les comptes de l'organisation, sans script à maintenir."
  options:
    b:
      en: "Data Lifecycle Manager manages only EBS snapshots and EBS-backed AMIs; it cannot back up RDS, DynamoDB or EFS, and it is configured account by account."
      fr: "Data Lifecycle Manager ne gère que les instantanés EBS et les AMI basées sur EBS ; il ne sauvegarde ni RDS, ni DynamoDB, ni EFS, et se configure compte par compte."
    c:
      en: "Custom Lambda functions in 20 accounts are code to write, deploy and maintain, which is the opposite of the least operational overhead."
      fr: "Des fonctions Lambda personnalisées dans 20 comptes sont du code à écrire, déployer et maintenir, l'opposé du moins de charge opérationnelle."
    d:
      en: "AWS Config rules only detect noncompliant resources; they do not take any backups."
      fr: "Les règles AWS Config ne font que détecter les ressources non conformes ; elles n'effectuent aucune sauvegarde."
references:
  - title: What is AWS Backup?
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/whatisbackup.html
