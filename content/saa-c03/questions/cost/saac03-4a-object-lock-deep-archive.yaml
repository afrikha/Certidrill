id: saac03-4a-object-lock-deep-archive
objective: "4.1.17"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A brokerage firm must retain trade confirmation records in Amazon S3 for 7 years in a write-once-read-many (WORM) form that no user, including the root user, can delete or overwrite during the retention period. The records are almost never read after 30 days, and a retrieval time of up to 48 hours is acceptable. The firm wants the MOST cost-effective solution.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une société de courtage doit conserver dans Amazon S3, pendant 7 ans, des confirmations d'opérations sous une forme WORM (écriture unique, lectures multiples) qu'aucun utilisateur, y compris l'utilisateur racine, ne peut supprimer ni écraser pendant la période de rétention. Les enregistrements ne sont presque plus lus après 30 jours, et un délai de récupération pouvant aller jusqu'à 48 heures est acceptable. La société veut la solution la PLUS rentable.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable S3 Object Lock on the bucket with a default retention of 7 years in compliance mode.", fr: "Activer S3 Object Lock sur le compartiment avec une rétention par défaut de 7 ans en mode conformité." } }
    - { id: b, text: { en: "Enable S3 Object Lock on the bucket with a default retention of 7 years in governance mode.", fr: "Activer S3 Object Lock sur le compartiment avec une rétention par défaut de 7 ans en mode gouvernance." } }
    - { id: c, text: { en: "Add an S3 Lifecycle rule that transitions the records to S3 Glacier Instant Retrieval after 30 days.", fr: "Ajouter une règle de cycle de vie S3 qui fait passer les enregistrements à S3 Glacier Instant Retrieval après 30 jours." } }
    - { id: d, text: { en: "Add a bucket policy that denies the s3:DeleteObject action to every principal in the account.", fr: "Ajouter une politique de compartiment qui refuse l'action s3:DeleteObject à tous les principaux du compte." } }
    - { id: e, text: { en: "Add an S3 Lifecycle rule that transitions the records to S3 Glacier Deep Archive after 30 days.", fr: "Ajouter une règle de cycle de vie S3 qui fait passer les enregistrements à S3 Glacier Deep Archive après 30 jours." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "In compliance mode, no user, including the root user, can overwrite or delete a protected object version, and the retention period cannot be shortened. Object Lock is kept through S3 Lifecycle transitions between storage classes, so the records can move to S3 Glacier Deep Archive, the cheapest class when a retrieval of up to 48 hours is acceptable."
    fr: "En mode conformité, aucun utilisateur, y compris l'utilisateur racine, ne peut écraser ni supprimer une version d'objet protégée, et la période de rétention ne peut pas être raccourcie. Object Lock est maintenu lors des transitions de cycle de vie S3 entre classes de stockage : les enregistrements peuvent passer à S3 Glacier Deep Archive, la classe la moins chère lorsqu'une récupération en 48 heures maximum est acceptable."
  options:
    b:
      en: "In governance mode, users with the s3:BypassGovernanceRetention permission can delete protected versions or change their retention."
      fr: "En mode gouvernance, les utilisateurs disposant de l'autorisation s3:BypassGovernanceRetention peuvent supprimer des versions protégées ou modifier leur rétention."
    c:
      en: "Glacier Instant Retrieval gives millisecond access that is not needed, at a higher storage price than Deep Archive."
      fr: "S3 Glacier Instant Retrieval offre un accès en millisecondes inutile ici, à un prix de stockage supérieur à celui de Deep Archive."
    d:
      en: "A bucket policy is not WORM: an administrator or the root user can change or remove it, and it does not prevent overwrites."
      fr: "Une politique de compartiment n'est pas une protection WORM : un administrateur ou l'utilisateur racine peut la modifier ou la supprimer, et elle n'empêche pas les écrasements."
references:
  - title: Locking objects with Object Lock
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock.html
  - title: Object Lock considerations
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lock-managing.html
