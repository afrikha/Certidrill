id: saac03-4b-dynamodb-ttl-archive
objective: "4.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company stores user session records in an Amazon DynamoDB table. Each record must expire 24 hours after the session ends, and removal within a few days after expiration is acceptable. An auditor requires a copy of every removed record in Amazon S3. The table receives heavy write traffic, and the company does not want the deletions to consume write capacity. The solution must require the LEAST operational overhead.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise stocke des enregistrements de sessions utilisateur dans une table Amazon DynamoDB. Chaque enregistrement doit expirer 24 heures après la fin de la session, et une suppression dans les quelques jours qui suivent l'expiration est acceptable. Un auditeur exige une copie de chaque enregistrement supprimé dans Amazon S3. La table reçoit un trafic d'écriture important, et l'entreprise ne veut pas que les suppressions consomment de capacité d'écriture. La solution doit impliquer le MOINS de charge opérationnelle.

    Quelle combinaison d'étapes répondra à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Enable Time to Live (TTL) on the table with an attribute that stores each record's expiration time in epoch seconds."
        fr: "Activer la durée de vie (TTL) sur la table avec un attribut qui stocke l'heure d'expiration de chaque enregistrement en secondes epoch."
    - id: b
      text:
        en: "Schedule an AWS Lambda function that scans the table every hour and deletes expired records with BatchWriteItem."
        fr: "Planifier une fonction AWS Lambda qui analyse la table chaque heure et supprime les enregistrements expirés avec BatchWriteItem."
    - id: c
      text:
        en: "Enable point-in-time recovery on the table with a recovery period of 1 day."
        fr: "Activer la restauration à un instant dans le passé sur la table avec une période de restauration de 1 jour."
    - id: d
      text:
        en: "Change the table class to DynamoDB Standard-Infrequent Access."
        fr: "Passer la table dans la classe de table DynamoDB Standard-Infrequent Access."
    - id: e
      text:
        en: "Enable DynamoDB Streams and use an AWS Lambda function, filtered on TTL service deletions, to write the removed records to Amazon S3."
        fr: "Activer DynamoDB Streams et utiliser une fonction AWS Lambda, filtrée sur les suppressions effectuées par le service TTL, pour écrire les enregistrements supprimés dans Amazon S3."
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "TTL deletes expired items, typically within a few days after expiration, without consuming write throughput. TTL deletions appear in DynamoDB Streams as service deletions (userIdentity type Service, principal dynamodb.amazonaws.com), so a Lambda event filter can invoke the function only for those records and copy them to S3."
    fr: "La TTL supprime les éléments expirés, généralement dans les quelques jours qui suivent l'expiration, sans consommer de débit d'écriture. Les suppressions TTL apparaissent dans DynamoDB Streams comme des suppressions de service (userIdentity de type Service, principal dynamodb.amazonaws.com) : un filtre d'événements Lambda peut n'appeler la fonction que pour ces enregistrements et les copier dans S3."
  options:
    b:
      en: "Scans consume read capacity and the deletes consume write capacity, and the function is custom code to maintain."
      fr: "Les analyses consomment de la capacité de lecture et les suppressions de la capacité d'écriture, et la fonction est du code personnalisé à maintenir."
    c:
      en: "Point-in-time recovery protects the table against accidental writes; it neither removes records nor archives them to S3."
      fr: "La restauration à un instant dans le passé protège la table contre les écritures accidentelles ; elle ne supprime pas les enregistrements et ne les archive pas dans S3."
    d:
      en: "The Standard-IA table class lowers storage prices for rarely accessed tables; it does not expire or archive records."
      fr: "La classe de table Standard-IA réduit le prix du stockage pour les tables rarement consultées ; elle ne fait ni expirer ni archiver les enregistrements."
references:
  - title: "Using time to live (TTL) in DynamoDB"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html
  - title: "DynamoDB Streams and Time to Live"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/time-to-live-ttl-streams.html
