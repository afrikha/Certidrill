id: saac03-4a-transfer-family-sftp
objective: "4.1.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A logistics company receives daily shipment files from 300 external partners, who upload the files over SFTP to an on-premises Linux server. The company wants to retire the server and store the files directly in Amazon S3. Partners must keep using their existing SFTP clients, and the company wants the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de logistique reçoit chaque jour des fichiers d'expédition de 300 partenaires externes, qui les chargent en SFTP sur un serveur Linux sur site. L'entreprise veut mettre ce serveur hors service et stocker les fichiers directement dans Amazon S3. Les partenaires doivent continuer à utiliser leurs clients SFTP existants, et l'entreprise veut le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Run an SFTP server on Amazon EC2 instances in an Auto Scaling group and copy the files to S3 with a cron job.", fr: "Exécuter un serveur SFTP sur des instances Amazon EC2 d'un Auto Scaling group et copier les fichiers vers Amazon S3 avec une tâche cron." }
    - id: b
      text: { en: "Create an AWS Transfer Family server with the SFTP protocol that stores the uploaded files in the S3 bucket.", fr: "Créer un serveur AWS Transfer Family avec le protocole SFTP qui stocke les fichiers chargés dans le compartiment S3." }
    - id: c
      text: { en: "Install an AWS DataSync agent at each partner site and schedule tasks that copy files to the S3 bucket.", fr: "Installer un agent AWS DataSync sur le site de chaque partenaire et planifier des tâches qui copient les fichiers vers le compartiment S3." }
    - id: d
      text: { en: "Deploy Amazon S3 File Gateway and give each partner an SMB share backed by the S3 bucket.", fr: "Déployer Amazon S3 File Gateway et donner à chaque partenaire un partage SMB adossé au compartiment S3." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Transfer Family is a fully managed SFTP, FTPS, FTP and AS2 service that stores files directly in Amazon S3 or Amazon EFS. Partners keep their SFTP clients, and the company has no file transfer servers to run, patch or scale."
    fr: "AWS Transfer Family est un service SFTP, FTPS, FTP et AS2 entièrement géré qui stocke les fichiers directement dans Amazon S3 ou Amazon EFS. Les partenaires conservent leurs clients SFTP, et l'entreprise n'a aucun serveur de transfert de fichiers à exploiter, corriger ou dimensionner."
  options:
    a:
      en: "Self-managed SFTP servers on EC2 plus a copy job must be patched, scaled and monitored, which is more operational overhead."
      fr: "Des serveurs SFTP autogérés sur EC2 et une tâche de copie doivent être corrigés, dimensionnés et surveillés, ce qui représente plus de charge opérationnelle."
    c:
      en: "DataSync agents would have to be deployed and managed at 300 external sites, and partners would stop using their SFTP clients."
      fr: "Il faudrait déployer et gérer des agents DataSync sur 300 sites externes, et les partenaires n'utiliseraient plus leurs clients SFTP."
    d:
      en: "S3 File Gateway serves NFS and SMB shares on a local network; it does not accept SFTP uploads from external partners."
      fr: "S3 File Gateway sert des partages NFS et SMB sur un réseau local ; il n'accepte pas de chargements SFTP de partenaires externes."
references:
  - title: What is AWS Transfer Family?
    url: https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html
