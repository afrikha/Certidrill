id: saac03-4c-sqs-buffer-writes
objective: "4.4.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A ticketing company receives orders through an API. During ticket releases, the order rate jumps to ten times the normal rate for about 15 minutes, and the Amazon RDS for PostgreSQL database that stores the orders becomes overloaded. Orders can be confirmed to customers by email within a few minutes, but no order can be lost. The company does not want to pay for a database sized for the peak.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de billetterie reçoit des commandes via une API. Lors des mises en vente, le débit de commandes est multiplié par dix pendant environ 15 minutes, et la base de données Amazon RDS for PostgreSQL qui stocke les commandes est surchargée. Les commandes peuvent être confirmées aux clients par e-mail sous quelques minutes, mais aucune commande ne doit être perdue. L'entreprise ne veut pas payer une base de données dimensionnée pour le pic.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Set a low throttling limit on the API so that excess order requests are rejected with HTTP 429 errors.", fr: "Définir une limitation basse sur l'API afin que les requêtes de commande excédentaires soient rejetées avec des erreurs HTTP 429." }
    - id: b
      text: { en: "Add two read replicas to the DB instance and spread the order writes across them.", fr: "Ajouter deux réplicas en lecture à l'instance de base de données et répartir entre eux les écritures de commandes." }
    - id: c
      text: { en: "Have the API send each order to an Amazon SQS queue, and have consumers write the orders to the database at a rate it can sustain.", fr: "Faire envoyer chaque commande par l'API dans une file d'attente Amazon SQS, et faire écrire les commandes dans la base de données par des consommateurs à un rythme qu'elle peut supporter." }
    - id: d
      text: { en: "Scale the DB instance to a larger instance class permanently so it can absorb the peak.", fr: "Passer définitivement l'instance de base de données à une classe d'instance plus grande pour qu'elle absorbe le pic." }
answer: { optionId: c }
explanation:
  correct:
    en: An SQS queue durably buffers the burst, and consumers pull messages at a pace the database can handle, so the database is sized for the average rate instead of the peak. Messages stay in the queue until a consumer processes and deletes them, so no order is lost, and the delay of a few minutes is acceptable.
    fr: Une file d'attente SQS absorbe le pic de manière durable, et les consommateurs récupèrent les messages au rythme que la base de données peut supporter ; celle-ci est donc dimensionnée pour le débit moyen plutôt que pour le pic. Les messages restent dans la file jusqu'à ce qu'un consommateur les traite et les supprime ; aucune commande n'est donc perdue, et le délai de quelques minutes est acceptable.
  options:
    a:
      en: Throttling protects the database by rejecting requests, so orders are lost unless every client retries, which breaks the requirement.
      fr: La limitation protège la base de données en rejetant des requêtes ; des commandes sont donc perdues si chaque client ne réessaie pas, ce qui enfreint l'exigence.
    b:
      en: Read replicas serve reads only; writes must still go to the primary instance.
      fr: Les réplicas en lecture ne servent que les lectures ; les écritures doivent toujours aller à l'instance principale.
    d:
      en: A permanently larger instance absorbs the peak but is paid for every hour, which the company wants to avoid.
      fr: Une instance définitivement plus grande absorbe le pic mais est payée à chaque heure, ce que l'entreprise veut éviter.
references:
  - title: What is Amazon Simple Queue Service?
    url: https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html
