id: saac03-4b-aurora-serverless-zero-acu
objective: "4.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs dozens of development databases on provisioned Amazon Aurora PostgreSQL-Compatible Edition DB instances that run version 16.4. Each database is used for a few hours on some workdays and is idle the rest of the time, often for days. Developers accept a short delay when they connect to an idle database. The company wants to minimize compute costs without managing start and stop schedules.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute des dizaines de bases de données de développement sur des instances de base de données provisionnées Amazon Aurora PostgreSQL-Compatible Edition en version 16.4. Chaque base est utilisée quelques heures certains jours ouvrés et reste inactive le reste du temps, souvent pendant plusieurs jours. Les développeurs acceptent un court délai lorsqu'ils se connectent à une base inactive. L'entreprise souhaite réduire au minimum les coûts de calcul sans gérer de calendriers de démarrage et d'arrêt.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Convert the DB instances to Aurora Serverless v2 with a minimum capacity of 0 ACUs so that idle instances pause automatically."
        fr: "Convertir les instances de base de données en Aurora Serverless v2 avec une capacité minimale de 0 ACU pour que les instances inactives se mettent en pause automatiquement."
    - id: b
      text:
        en: "Convert the DB instances to Aurora Serverless v2 with a minimum capacity of 0.5 ACUs."
        fr: "Convertir les instances de base de données en Aurora Serverless v2 avec une capacité minimale de 0,5 ACU."
    - id: c
      text:
        en: "Purchase Reserved DB instances for the provisioned DB instances."
        fr: "Acheter des instances de base de données réservées pour les instances de base de données provisionnées."
    - id: d
      text:
        en: "Add an RDS Proxy in front of each database to pool connections while the databases are idle."
        fr: "Ajouter un RDS Proxy devant chaque base de données pour regrouper les connexions pendant que les bases sont inactives."
answer: { optionId: a }
explanation:
  correct:
    en: "With a minimum capacity of 0 ACUs, an Aurora Serverless v2 instance pauses after a period with no user connections, and the company pays only for storage while it is paused. It resumes automatically, typically in about 15 seconds, when a developer connects, so no schedule is needed."
    fr: "Avec une capacité minimale de 0 ACU, une instance Aurora Serverless v2 se met en pause après une période sans connexion utilisateur, et l'entreprise ne paie que le stockage pendant la pause. Elle reprend automatiquement, généralement en 15 secondes environ, lorsqu'un développeur se connecte : aucun calendrier n'est nécessaire."
  options:
    b:
      en: "A minimum of 0.5 ACUs turns off automatic pause, so each idle database is still billed for 0.5 ACU every hour."
      fr: "Un minimum de 0,5 ACU désactive la pause automatique : chaque base inactive est toujours facturée 0,5 ACU par heure."
    c:
      en: "Reservations lower the hourly price but still pay for every hour, including the days when the databases are idle."
      fr: "Les réservations réduisent le tarif horaire, mais paient toujours chaque heure, y compris les jours où les bases sont inactives."
    d:
      en: "RDS Proxy adds its own charges and keeps connections open, which would prevent Aurora Serverless v2 from pausing."
      fr: "RDS Proxy ajoute ses propres frais et garde des connexions ouvertes, ce qui empêcherait Aurora Serverless v2 de se mettre en pause."
references:
  - title: "Scaling to Zero ACUs with automatic pause and resume for Aurora serverless"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2-auto-pause.html
