id: saac03-4c-cur-athena-transfer
objective: "4.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's network team must find which individual resources generated the regional data transfer charges of the last month, hour by hour, and join the results with an internal inventory table in SQL. The analysis must use AWS billing data at line-item level.

    Which solution will meet these requirements?
  fr: |
    L'équipe réseau d'une entreprise doit identifier, heure par heure, les ressources individuelles qui ont généré les frais de transfert de données régionaux du mois dernier, et joindre les résultats à une table d'inventaire interne en SQL. L'analyse doit utiliser les données de facturation AWS au niveau des éléments de ligne.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Use the AWS Cost Explorer monthly view grouped by service.", fr: "Utiliser la vue mensuelle d'AWS Cost Explorer regroupée par service." }
    - id: b
      text: { en: "Create an AWS Budgets usage budget for data transfer and review its alert history.", fr: "Créer un budget d'utilisation AWS Budgets pour le transfert de données et examiner l'historique de ses alertes." }
    - id: c
      text: { en: "Configure the AWS Cost and Usage Report with hourly granularity and resource IDs, deliver it to Amazon S3 and query it with Amazon Athena.", fr: "Configurer AWS Cost and Usage Report avec une granularité horaire et les ID de ressources, le livrer dans Amazon S3 et l'interroger avec Amazon Athena." }
    - id: d
      text: { en: "Review the AWS Health Dashboard events for the account.", fr: "Consulter les événements d'AWS Health Dashboard pour le compte." }
answer: { optionId: c }
explanation:
  correct:
    en: The Cost and Usage Report contains a line item for each combination of product, usage type and operation, can be broken down by the hour and can include resource IDs. It is delivered to an S3 bucket that the company owns and can be queried with Athena, so it can be joined with other tables in SQL.
    fr: AWS Cost and Usage Report contient un élément de ligne pour chaque combinaison de produit, de type d'utilisation et d'opération, peut être ventilé par heure et peut inclure les ID de ressources. Il est livré dans un compartiment S3 appartenant à l'entreprise et peut être interrogé avec Athena ; il peut donc être joint à d'autres tables en SQL.
  options:
    a:
      en: A monthly view grouped by service shows totals, not hourly costs per resource, and it cannot be joined with an inventory table in SQL.
      fr: Une vue mensuelle regroupée par service affiche des totaux, pas des coûts horaires par ressource, et elle ne peut pas être jointe à une table d'inventaire en SQL.
    b:
      en: A budget tracks a threshold and sends alerts; it gives no per-resource line items.
      fr: Un budget suit un seuil et envoie des alertes ; il ne fournit aucun élément de ligne par ressource.
    d:
      en: AWS Health Dashboard reports service events and scheduled changes, not billing data.
      fr: AWS Health Dashboard signale des événements de service et des modifications planifiées, pas des données de facturation.
references:
  - title: What are AWS Cost and Usage Reports?
    url: https://docs.aws.amazon.com/cur/latest/userguide/what-is-cur.html
