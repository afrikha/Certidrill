id: saac03-4a-internet-upload-cost
objective: "4.1.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company must move 8 TB of archived project files from its data center to an Amazon S3 bucket within the next 2 weeks. This is a one-time transfer. The data center has a 1 Gbps internet connection that is mostly idle, and the bucket is in the AWS Region closest to the data center.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise doit transférer 8 To de fichiers de projets archivés de son centre de données vers un compartiment Amazon S3 dans les 2 prochaines semaines. Il s'agit d'un transfert ponctuel. Le centre de données dispose d'une connexion Internet de 1 Gbit/s peu utilisée, et le compartiment se trouve dans la Région AWS la plus proche du centre de données.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Order an AWS Direct Connect dedicated connection and transfer the files over it.", fr: "Commander une connexion dédiée AWS Direct Connect et transférer les fichiers par celle-ci." }
    - id: b
      text: { en: "Upload the files over the existing internet connection with multipart uploads to the bucket.", fr: "Charger les fichiers par la connexion Internet existante, avec des chargements partitionnés vers le compartiment." }
    - id: c
      text: { en: "Enable S3 Transfer Acceleration and upload the files through the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration et charger les fichiers via le point de terminaison accéléré." }
    - id: d
      text: { en: "Create an AWS Site-to-Site VPN connection and upload the files through the VPN tunnels.", fr: "Créer une connexion AWS Site-to-Site VPN et charger les fichiers par les tunnels VPN." }
answer: { optionId: b }
explanation:
  correct:
    en: "Data transferred into Amazon S3 from the internet is not charged, so uploading over the existing connection costs only the PUT requests. At 1 Gbps, 8 TB takes less than a day of transfer time, well within the 2-week window, and multipart uploads use the bandwidth in parallel."
    fr: "Le transfert de données entrant dans Amazon S3 depuis Internet n'est pas facturé : charger par la connexion existante ne coûte que les requêtes PUT. À 1 Gbit/s, 8 To demandent moins d'une journée de transfert, bien dans le délai de 2 semaines, et les chargements partitionnés exploitent la bande passante en parallèle."
  options:
    a:
      en: "Direct Connect adds port-hour charges and provisioning lead time for a one-time transfer that the existing connection already handles."
      fr: "Direct Connect ajoute des frais horaires de port et un délai de mise en service pour un transfert ponctuel que la connexion existante gère déjà."
    c:
      en: "Transfer Acceleration charges an additional fee per GB and is designed for long-distance transfers, not for a bucket in the nearest Region."
      fr: "Transfer Acceleration facture des frais supplémentaires par Go et est conçu pour les transferts longue distance, pas pour un compartiment situé dans la Région la plus proche."
    d:
      en: "A Site-to-Site VPN adds hourly connection charges and uses the same internet link, so it costs more without making the transfer faster."
      fr: "Un Site-to-Site VPN ajoute des frais horaires de connexion et utilise le même lien Internet : il coûte plus cher sans accélérer le transfert."
references:
  - title: S3 Pricing
    url: https://aws.amazon.com/s3/pricing/
