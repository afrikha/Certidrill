id: saac03-4a-rds-storage-autoscaling
objective: "4.1.15"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an Amazon RDS for PostgreSQL DB instance with 500 GiB of allocated gp3 storage. Data growth is unpredictable, and last month the database ran out of space during a large import, which caused an outage. The company wants storage to grow automatically when free space runs low, up to a limit of 2 TiB, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for PostgreSQL avec 500 Gio de stockage gp3 alloué. La croissance des données est imprévisible, et le mois dernier la base de données a manqué d'espace pendant une importation volumineuse, ce qui a provoqué une panne. L'entreprise veut que le stockage augmente automatiquement lorsque l'espace libre devient faible, jusqu'à une limite de 2 Tio, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable RDS storage autoscaling on the DB instance and set the maximum storage threshold to 2 TiB.", fr: "Activer la mise à l'échelle automatique du stockage RDS sur l'instance et définir le seuil de stockage maximal à 2 Tio." }
    - id: b
      text: { en: "Create a CloudWatch alarm on FreeStorageSpace that invokes a Lambda function that modifies the allocated storage.", fr: "Créer une alarme CloudWatch sur FreeStorageSpace qui appelle une fonction Lambda chargée de modifier le stockage alloué." }
    - id: c
      text: { en: "Create a read replica and promote it whenever the primary DB instance runs low on storage.", fr: "Créer un réplica en lecture et le promouvoir chaque fois que l'instance principale manque de stockage." }
    - id: d
      text: { en: "Modify the DB instance now to allocate 2 TiB of storage so that it never runs out of space.", fr: "Modifier dès maintenant l'instance pour allouer 2 Tio de stockage afin qu'elle ne manque jamais d'espace." }
answer: { optionId: a }
explanation:
  correct:
    en: "RDS storage autoscaling increases allocated storage automatically when free space falls to 10% or less for at least 5 minutes, adding at least 10 GiB or 10% at a time, up to the maximum storage threshold you set. It is a setting on the DB instance and changing it causes no downtime."
    fr: "La mise à l'échelle automatique du stockage RDS augmente automatiquement le stockage alloué lorsque l'espace libre tombe à 10 % ou moins pendant au moins 5 minutes, par paliers d'au moins 10 Gio ou 10 %, jusqu'au seuil de stockage maximal défini. C'est un paramètre de l'instance, et sa modification n'entraîne aucune interruption."
  options:
    b:
      en: "An alarm and a Lambda function reproduce a built-in feature with custom code to write and maintain."
      fr: "Une alarme et une fonction Lambda reproduisent une fonctionnalité intégrée avec du code personnalisé à écrire et à maintenir."
    c:
      en: "A read replica scales reads; promoting it does not add storage and disrupts the application."
      fr: "Un réplica en lecture met à l'échelle les lectures ; le promouvoir n'ajoute pas de stockage et perturbe l'application."
    d:
      en: "Allocating 2 TiB now means paying for storage that is not used, and allocated storage cannot be decreased later."
      fr: "Allouer 2 Tio dès maintenant revient à payer du stockage inutilisé, et le stockage alloué ne peut plus être réduit ensuite."
references:
  - title: Managing capacity automatically with Amazon RDS storage autoscaling
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PIOPS.Autoscaling.html
