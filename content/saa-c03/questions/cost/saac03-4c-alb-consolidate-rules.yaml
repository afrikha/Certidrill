id: saac03-4c-alb-consolidate-rules
objective: "4.4.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs 12 HTTP microservices on Amazon ECS. Each microservice has its own internet-facing Application Load Balancer and its own subdomain, such as orders.example.com and billing.example.com. Most microservices receive little traffic. The company wants to reduce load balancing costs without changing the subdomains.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute 12 microservices HTTP sur Amazon ECS. Chaque microservice possède son propre Application Load Balancer accessible depuis Internet et son propre sous-domaine, par exemple orders.example.com et billing.example.com. La plupart des microservices reçoivent peu de trafic. L'entreprise veut réduire ses coûts de répartition de charge sans modifier les sous-domaines.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Replace each Application Load Balancer with a Network Load Balancer.", fr: "Remplacer chaque Application Load Balancer par un Network Load Balancer." }
    - id: b
      text: { en: "Use one Application Load Balancer with a host-header listener rule for each subdomain that forwards to the target group of the matching microservice.", fr: "Utiliser un seul Application Load Balancer avec, pour chaque sous-domaine, une règle d'écouteur host-header qui transmet au groupe cible du microservice correspondant." }
    - id: c
      text: { en: "Use one Gateway Load Balancer with one target group for each microservice.", fr: "Utiliser un seul Gateway Load Balancer avec un groupe cible par microservice." }
    - id: d
      text: { en: "Turn off cross-zone load balancing on each Application Load Balancer.", fr: "Désactiver la répartition de charge entre zones sur chaque Application Load Balancer." }
answer: { optionId: b }
explanation:
  correct:
    en: Each Application Load Balancer is billed for every hour it runs plus LCU usage, so 12 lightly used load balancers mostly pay idle hourly charges. One ALB can route by host header to up to 100 target groups (and 100 rules by default), so the 12 subdomains keep working through a single load balancer.
    fr: Chaque Application Load Balancer est facturé pour chaque heure de fonctionnement, en plus de l'utilisation des LCU ; 12 équilibreurs de charge peu utilisés paient donc surtout des frais horaires à vide. Un seul ALB peut router selon l'en-tête host vers jusqu'à 100 groupes cibles (et 100 règles par défaut) ; les 12 sous-domaines continuent donc de fonctionner via un seul équilibreur de charge.
  options:
    a:
      en: Twelve Network Load Balancers still incur twelve hourly charges, and NLBs work at layer 4, so they cannot route by host name.
      fr: Douze Network Load Balancers entraînent toujours douze frais horaires, et les NLB fonctionnent à la couche 4 ; ils ne peuvent donc pas router selon le nom d'hôte.
    c:
      en: A Gateway Load Balancer distributes traffic to third-party virtual appliances such as firewalls; it does not route HTTP requests by host name.
      fr: Un Gateway Load Balancer distribue le trafic vers des appliances virtuelles tierces comme des pare-feu ; il ne route pas les requêtes HTTP selon le nom d'hôte.
    d:
      en: Cross-zone load balancing only changes how requests are spread across zones; each of the twelve load balancers still incurs its hourly charge.
      fr: La répartition de charge entre zones ne change que la répartition des requêtes entre les zones ; chacun des douze équilibreurs de charge entraîne toujours ses frais horaires.
references:
  - title: Condition types for listener rules
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-condition-types.html
  - title: Quotas for your Application Load Balancers
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-limits.html
