id: saac03-4a-cur-athena
objective: "4.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The finance team of an e-commerce company needs line-item cost and usage data at hourly granularity, including resource IDs, so that analysts can run SQL queries and join the data with internal chargeback tables. The data must be delivered automatically to an Amazon S3 bucket every day.

    Which solution will meet these requirements?
  fr: |
    L'équipe financière d'une entreprise de commerce en ligne a besoin de données de coûts et d'utilisation ligne par ligne, avec une granularité horaire et les ID de ressources, afin que les analystes puissent exécuter des requêtes SQL et joindre ces données à des tables internes de refacturation. Les données doivent être livrées automatiquement chaque jour dans un compartiment Amazon S3.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Download monthly cost reports as CSV files from AWS Cost Explorer and upload them to the S3 bucket.", fr: "Télécharger chaque mois des rapports de coûts au format CSV depuis AWS Cost Explorer et les charger dans le compartiment S3." }
    - id: b
      text: { en: "Configure AWS Budgets reports that are sent every day to the finance team by email.", fr: "Configurer des rapports AWS Budgets envoyés chaque jour par e-mail à l'équipe financière." }
    - id: c
      text: { en: "Create a Cost and Usage Report 2.0 export in AWS Data Exports to the S3 bucket and query it with Amazon Athena.", fr: "Créer une exportation Cost and Usage Report 2.0 dans AWS Data Exports vers le compartiment S3 et l'interroger avec Amazon Athena." }
    - id: d
      text: { en: "Configure AWS Cost Anomaly Detection with an Amazon SNS subscription that sends daily alerts.", fr: "Configurer AWS Cost Anomaly Detection avec un abonnement Amazon SNS qui envoie des alertes quotidiennes." }
answer: { optionId: c }
explanation:
  correct:
    en: "The AWS Cost and Usage Report is the most detailed cost and usage dataset: it has line items per product, usage type and operation, can be aggregated by hour, can include resource IDs, and is delivered to an S3 bucket you own. CUR 2.0, created in AWS Data Exports, is the recommended version, and Amazon Athena can query it with SQL."
    fr: "AWS Cost and Usage Report est le jeu de données de coûts et d'utilisation le plus détaillé : il contient des lignes par produit, type d'utilisation et opération, peut être agrégé par heure, peut inclure les ID de ressources et est livré dans un compartiment S3 qui vous appartient. CUR 2.0, créé dans AWS Data Exports, est la version recommandée, et Amazon Athena peut l'interroger en SQL."
  options:
    a:
      en: "Cost Explorer is a visual analysis tool; manual CSV downloads are neither line-item data with resource IDs nor an automatic daily delivery."
      fr: "Cost Explorer est un outil d'analyse visuelle ; des téléchargements CSV manuels ne fournissent ni des données ligne par ligne avec ID de ressources ni une livraison quotidienne automatique."
    b:
      en: "AWS Budgets tracks costs against thresholds and sends alerts or summary reports; it does not deliver line-item data for SQL analysis."
      fr: "AWS Budgets suit les coûts par rapport à des seuils et envoie des alertes ou des rapports de synthèse ; il ne livre pas de données ligne par ligne pour une analyse SQL."
    d:
      en: "Cost Anomaly Detection alerts on unusual spend; it does not provide the full cost and usage dataset."
      fr: "Cost Anomaly Detection alerte sur les dépenses inhabituelles ; il ne fournit pas le jeu de données complet des coûts et de l'utilisation."
references:
  - title: What are AWS Cost and Usage Reports?
    url: https://docs.aws.amazon.com/cur/latest/userguide/what-is-cur.html
  - title: What is AWS Data Exports?
    url: https://docs.aws.amazon.com/cur/latest/userguide/what-is-data-exports.html
