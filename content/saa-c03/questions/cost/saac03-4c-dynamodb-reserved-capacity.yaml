id: saac03-4c-dynamodb-reserved-capacity
objective: "4.3.12"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A gaming company stores player profiles in an Amazon DynamoDB table that uses on-demand capacity mode and the DynamoDB Standard table class. After a year in production, read and write traffic is steady around the clock and the company can forecast it for at least the next year. Throughput is by far the largest part of the table cost. The company wants to reduce the cost of the table.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise de jeux vidéo stocke les profils des joueurs dans une table Amazon DynamoDB qui utilise le mode de capacité à la demande et la classe de table DynamoDB Standard. Après un an de production, le trafic de lecture et d'écriture est stable jour et nuit, et l'entreprise peut le prévoir pour au moins l'année à venir. Le débit représente de loin la plus grande part du coût de la table. L'entreprise veut réduire le coût de la table.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Keep on-demand capacity mode and purchase DynamoDB reserved capacity for the baseline traffic.", fr: "Conserver le mode de capacité à la demande et acheter de la capacité réservée DynamoDB pour le trafic de base." }
    - id: b
      text: { en: "Switch the table to the DynamoDB Standard-IA table class and purchase DynamoDB reserved capacity.", fr: "Faire passer la table à la classe de table DynamoDB Standard-IA et acheter de la capacité réservée DynamoDB." }
    - id: c
      text: { en: "Switch to provisioned capacity mode with auto scaling and purchase DynamoDB reserved capacity for the baseline traffic.", fr: "Passer en mode de capacité provisionnée avec la mise à l'échelle automatique et acheter de la capacité réservée DynamoDB pour le trafic de base." }
    - id: d
      text: { en: "Keep on-demand capacity mode and add a DynamoDB Accelerator (DAX) cluster in front of the table.", fr: "Conserver le mode de capacité à la demande et ajouter un cluster DynamoDB Accelerator (DAX) devant la table." }
answer: { optionId: c }
explanation:
  correct:
    en: Provisioned mode suits steady workloads with forecastable capacity, and auto scaling adjusts it to small variations. Reserved capacity, bought for a 1-year term (3 years in some Regions), discounts the committed provisioned throughput further.
    fr: Le mode provisionné convient aux charges de travail stables dont la capacité est prévisible, et la mise à l'échelle automatique l'ajuste aux petites variations. La capacité réservée, achetée pour un an (trois ans dans certaines Régions), réduit encore le prix du débit provisionné engagé.
  options:
    a:
      en: Reserved capacity applies only to provisioned capacity mode; it cannot be purchased for an on-demand table.
      fr: La capacité réservée s'applique uniquement au mode de capacité provisionnée ; elle ne peut pas être achetée pour une table à la demande.
    b:
      en: Reserved capacity is not available for the Standard-IA table class, and Standard-IA targets tables where storage, not throughput, dominates the cost.
      fr: La capacité réservée n'est pas disponible pour la classe de table Standard-IA, et Standard-IA vise les tables dont le coût est dominé par le stockage, pas par le débit.
    d:
      en: DAX is an in-memory cache billed per node; it helps read latency but does not discount write traffic and adds cost.
      fr: DAX est un cache en mémoire facturé par nœud ; il améliore la latence de lecture mais ne réduit pas le coût des écritures et ajoute une dépense.
references:
