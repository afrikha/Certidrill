id: saac03-4c-athena-parquet-columnar
objective: "4.3.13"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A marketing company stores 40 TB of clickstream data in an Amazon S3 bucket as uncompressed CSV files with 120 columns. Analysts query the data with Amazon Athena, and almost every query reads fewer than 10 columns. Athena costs are growing quickly. The company wants to reduce query costs.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise de marketing stocke 40 To de données de parcours de navigation dans un compartiment Amazon S3, sous forme de fichiers CSV non compressés de 120 colonnes. Les analystes interrogent les données avec Amazon Athena, et presque toutes les requêtes lisent moins de 10 colonnes. Les coûts d'Athena augmentent rapidement. L'entreprise veut réduire le coût des requêtes.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Convert the data to compressed Apache Parquet files with an Athena CTAS query and query the Parquet table.", fr: "Convertir les données en fichiers Apache Parquet compressés avec une requête CTAS Athena et interroger la table Parquet." }
    - id: b
      text: { en: "Compress the CSV files with gzip and keep querying them with Athena.", fr: "Compresser les fichiers CSV avec gzip et continuer à les interroger avec Athena." }
    - id: c
      text: { en: "Load the data into an Amazon RDS for PostgreSQL DB instance and run the queries there.", fr: "Charger les données dans une instance de base de données Amazon RDS for PostgreSQL et y exécuter les requêtes." }
    - id: d
      text: { en: "Move the CSV files to the S3 Standard-IA storage class and keep querying them with Athena.", fr: "Déplacer les fichiers CSV vers la classe de stockage S3 Standard-IA et continuer à les interroger avec Athena." }
answer: { optionId: a }
explanation:
  correct:
    en: Athena charges by the amount of data scanned. Parquet is a columnar format, compressed per column, so a query that needs 10 of 120 columns reads only those columns and can skip blocks by using column statistics. A CTAS query converts the existing CSV data without extra infrastructure.
    fr: Athena facture selon la quantité de données analysées. Parquet est un format en colonnes, compressé colonne par colonne ; une requête qui a besoin de 10 colonnes sur 120 ne lit donc que celles-ci et peut ignorer des blocs grâce aux statistiques des colonnes. Une requête CTAS convertit les données CSV existantes sans infrastructure supplémentaire.
  options:
    b:
      en: Gzip reduces the bytes scanned, but each query still reads every column of every row, so the savings are much smaller than with a columnar format.
      fr: Gzip réduit les octets analysés, mais chaque requête lit toujours toutes les colonnes de chaque ligne ; l'économie est donc bien plus faible qu'avec un format en colonnes.
    c:
      en: A row-oriented OLTP database is a poor fit for 40 TB of analytic scans and adds an instance and storage to pay for continuously.
      fr: Une base de données OLTP orientée lignes convient mal à 40 To d'analyses et ajoute une instance et du stockage à payer en continu.
    d:
      en: Standard-IA lowers storage price but adds a per-GB retrieval fee on every read; it does not reduce the data that Athena scans.
      fr: Standard-IA réduit le prix du stockage mais ajoute des frais de récupération par Go à chaque lecture ; il ne réduit pas les données analysées par Athena.
references:
  - title: Use columnar storage formats
    url: https://docs.aws.amazon.com/athena/latest/ug/columnar-storage.html
