id: saac03-4c-flow-logs-cross-az
objective: "4.4.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    AWS Cost Explorer shows that a company's charges for data transfer between Availability Zones tripled last month. The VPC hosts more than 200 EC2 instances and containers. Before redesigning anything, the network team must find which pairs of source and destination IP addresses, and in which zones, carry the most traffic. The team wants to analyze the data with SQL.

    Which solution will meet these requirements?
  fr: |
    AWS Cost Explorer montre que les frais de transfert de données entre zones de disponibilité d'une entreprise ont triplé le mois dernier. Le VPC héberge plus de 200 instances EC2 et conteneurs. Avant toute refonte, l'équipe réseau doit déterminer quels couples d'adresses IP source et destination, et dans quelles zones, transportent le plus de trafic. L'équipe veut analyser les données en SQL.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable AWS CloudTrail data events for the VPC and query the trail with Amazon Athena.", fr: "Activer les événements de données AWS CloudTrail pour le VPC et interroger le journal d'activité avec Amazon Athena." }
    - id: b
      text: { en: "Run VPC Reachability Analyzer between every pair of instances in different zones.", fr: "Exécuter VPC Reachability Analyzer entre chaque paire d'instances situées dans des zones différentes." }
    - id: c
      text: { en: "Group the costs by usage type in AWS Cost Explorer and filter on the regional data transfer usage types.", fr: "Regrouper les coûts par type d'utilisation dans AWS Cost Explorer et filtrer sur les types d'utilisation du transfert de données régional." }
    - id: d
      text: { en: "Create VPC flow logs with a custom format that includes the az-id and bytes fields, publish them to Amazon S3 and query them with Amazon Athena.", fr: "Créer des journaux de flux VPC au format personnalisé incluant les champs az-id et bytes, les publier dans Amazon S3 et les interroger avec Amazon Athena." }
answer: { optionId: d }
explanation:
  correct:
    en: VPC flow logs record the IP traffic of each network interface, with source and destination addresses and bytes; the az-id field (version 4) is available in a custom format. Published to Amazon S3, the records can be queried with Athena, and collection does not affect network throughput or latency.
    fr: Les journaux de flux VPC enregistrent le trafic IP de chaque interface réseau, avec les adresses source et destination et le nombre d'octets ; le champ az-id (version 4) est disponible dans un format personnalisé. Publiés dans Amazon S3, les enregistrements peuvent être interrogés avec Athena, et la collecte n'a aucun effet sur le débit ni sur la latence du réseau.
  options:
    a:
      en: CloudTrail records API calls made to AWS services, not the network traffic between instances.
      fr: CloudTrail enregistre les appels d'API vers les services AWS, pas le trafic réseau entre instances.
    b:
      en: Reachability Analyzer checks whether a path is allowed by the configuration; it does not measure how much traffic flows.
      fr: Reachability Analyzer vérifie si un chemin est autorisé par la configuration ; il ne mesure pas la quantité de trafic qui circule.
    c:
      en: Cost Explorer confirms the size of the inter-zone charge but does not show which source and destination addresses generate it.
      fr: Cost Explorer confirme le montant des frais entre zones mais n'indique pas quelles adresses source et destination les génèrent.
references:
  - title: Flow log records
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-log-records.html
  - title: Logging IP traffic using VPC Flow Logs
    url: https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html
