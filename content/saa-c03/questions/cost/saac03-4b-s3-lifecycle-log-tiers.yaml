id: saac03-4b-s3-lifecycle-log-tiers
objective: "4.1.20"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company stores application logs in an Amazon S3 bucket in the S3 Standard storage class. Analysts query the logs frequently during the first 30 days. From day 31 to day 90, the logs are read a few times each month and must be returned in milliseconds. After 90 days, the logs are kept for 7 years for compliance and are almost never read, and a retrieval time of up to 12 hours is acceptable. The logs must remain available if an Availability Zone is lost.

    Which S3 Lifecycle configuration will meet these requirements MOST cost-effectively?
  fr: |
    Une société de services financiers stocke des journaux d'application dans un compartiment Amazon S3, dans la classe de stockage S3 Standard. Les analystes interrogent fréquemment les journaux pendant les 30 premiers jours. Du 31e au 90e jour, les journaux sont lus quelques fois par mois et doivent être renvoyés en quelques millisecondes. Après 90 jours, les journaux sont conservés 7 ans pour des raisons de conformité et ne sont presque jamais lus ; un délai de récupération allant jusqu'à 12 heures est acceptable. Les journaux doivent rester disponibles en cas de perte d'une zone de disponibilité.

    Quelle configuration S3 Lifecycle répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Transition the objects to S3 One Zone-IA after 30 days and to S3 Glacier Deep Archive after 90 days, and expire them after 7 years."
        fr: "Faire passer les objets en S3 One Zone-IA après 30 jours, puis en S3 Glacier Deep Archive après 90 jours, et les faire expirer après 7 ans."
    - id: b
      text:
        en: "Transition the objects to S3 Standard-IA after 30 days and to S3 Glacier Flexible Retrieval after 90 days, and expire them after 7 years."
        fr: "Faire passer les objets en S3 Standard-IA après 30 jours, puis en S3 Glacier Flexible Retrieval après 90 jours, et les faire expirer après 7 ans."
    - id: c
      text:
        en: "Transition the objects to S3 Standard-IA after 30 days and to S3 Glacier Deep Archive after 90 days, and expire them after 7 years."
        fr: "Faire passer les objets en S3 Standard-IA après 30 jours, puis en S3 Glacier Deep Archive après 90 jours, et les faire expirer après 7 ans."
    - id: d
      text:
        en: "Transition the objects to S3 Intelligent-Tiering after 30 days and expire them after 7 years."
        fr: "Faire passer les objets en S3 Intelligent-Tiering après 30 jours et les faire expirer après 7 ans."
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Standard-IA keeps millisecond access at a lower storage price for data that is read a few times a month, and it stores data across multiple Availability Zones. S3 Glacier Deep Archive is the lowest-cost storage class, and its Standard retrieval tier restores objects within 12 hours. The objects stay 60 days in Standard-IA, which respects its 30-day minimum storage duration."
    fr: "S3 Standard-IA conserve un accès en quelques millisecondes à un prix de stockage plus bas pour des données lues quelques fois par mois, et stocke les données dans plusieurs zones de disponibilité. S3 Glacier Deep Archive est la classe de stockage la moins chère, et son niveau de récupération Standard restaure les objets en moins de 12 heures. Les objets restent 60 jours en Standard-IA, ce qui respecte sa durée minimale de stockage de 30 jours."
  options:
    a:
      en: "S3 One Zone-IA stores data in a single Availability Zone, so the logs would not survive the loss of that zone during days 31 to 90."
      fr: "S3 One Zone-IA stocke les données dans une seule zone de disponibilité : les journaux ne survivraient pas à la perte de cette zone entre le 31e et le 90e jour."
    b:
      en: "S3 Glacier Flexible Retrieval meets the retrieval requirement but costs more to store than S3 Glacier Deep Archive, which already restores within 12 hours."
      fr: "S3 Glacier Flexible Retrieval respecte le délai de récupération, mais son stockage coûte plus cher que S3 Glacier Deep Archive, qui restaure déjà en moins de 12 heures."
    d:
      en: "The access pattern is known, so a fixed lifecycle is cheaper. S3 Intelligent-Tiering adds a per-object monitoring fee and does not move objects to deep archive pricing unless the optional archive tiers are activated."
      fr: "Le modèle d'accès est connu : un cycle de vie fixe est moins cher. S3 Intelligent-Tiering ajoute des frais de surveillance par objet et ne place pas les objets au tarif d'archivage profond sans activer les niveaux d'archivage facultatifs."
references:
  - title: "Understanding and managing Amazon S3 storage classes"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
  - title: "Understanding S3 Glacier storage classes for long-term data storage"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/glacier-storage-classes.html
