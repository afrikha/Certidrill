id: saac03-4b-compute-optimizer-memory
objective: "4.2.15"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Compute Optimizer to rightsize its Amazon EC2 instances. For a fleet of memory-intensive Java applications, Compute Optimizer recommends smaller instance types, and the operations team notices that the recommendations do not take memory use into account. The team is concerned that the applications will run out of memory after downsizing.

    What should a solutions architect do so that the recommendations account for actual memory use?
  fr: |
    Une entreprise utilise AWS Compute Optimizer pour redimensionner ses instances Amazon EC2. Pour un parc d'applications Java gourmandes en mémoire, Compute Optimizer recommande des types d'instances plus petits, et l'équipe d'exploitation remarque que les recommandations ne tiennent pas compte de l'utilisation de la mémoire. L'équipe craint que les applications manquent de mémoire après la réduction de taille.

    Que doit faire un architecte de solutions pour que les recommandations tiennent compte de l'utilisation réelle de la mémoire ?
body:
  options:
    - id: a
      text:
        en: "Install the Amazon CloudWatch agent on the instances so that they publish memory utilization metrics."
        fr: "Installer l'agent Amazon CloudWatch sur les instances pour qu'elles publient des métriques d'utilisation de la mémoire."
    - id: b
      text:
        en: "Enable detailed monitoring on the instances so that metrics are published at 1-minute intervals."
        fr: "Activer la surveillance détaillée sur les instances pour que les métriques soient publiées toutes les minutes."
    - id: c
      text:
        en: "Activate the enhanced infrastructure metrics preference to extend the lookback period to 93 days."
        fr: "Activer la préférence de métriques d'infrastructure améliorées pour étendre la période d'analyse à 93 jours."
    - id: d
      text:
        en: "Use the AWS Cost Explorer rightsizing recommendations instead of Compute Optimizer."
        fr: "Utiliser les recommandations de dimensionnement d'AWS Cost Explorer au lieu de Compute Optimizer."
answer: { optionId: a }
explanation:
  correct:
    en: "Memory utilization is not a default EC2 metric. Compute Optimizer analyzes the memory of EC2 instances only when the CloudWatch agent is installed (or when memory metrics are ingested from a supported observability partner), and it then uses that data in its recommendations."
    fr: "L'utilisation de la mémoire n'est pas une métrique EC2 par défaut. Compute Optimizer n'analyse la mémoire des instances EC2 que si l'agent CloudWatch est installé (ou si des métriques de mémoire sont importées depuis un partenaire d'observabilité pris en charge), et utilise alors ces données dans ses recommandations."
  options:
    b:
      en: "Detailed monitoring increases the frequency of the default metrics, but those metrics still do not include memory."
      fr: "La surveillance détaillée augmente la fréquence des métriques par défaut, mais ces métriques n'incluent toujours pas la mémoire."
    c:
      en: "Enhanced infrastructure metrics lengthen the lookback period from 14 to up to 93 days, but they do not add memory data."
      fr: "Les métriques d'infrastructure améliorées allongent la période d'analyse de 14 jusqu'à 93 jours, mais n'ajoutent pas de données de mémoire."
    d:
      en: "Switching tools does not create the missing memory metric; memory data still requires the CloudWatch agent."
      fr: "Changer d'outil ne crée pas la métrique de mémoire manquante ; les données de mémoire exigent toujours l'agent CloudWatch."
references:
  - title: "EC2 instance metrics"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/ec2-metrics-analyzed.html
  - title: "Metrics analyzed by AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/metrics.html
