id: saac03-4b-downsize-same-family
objective: "4.2.15"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs an internal application on an m6i.4xlarge instance (16 vCPUs, 64 GiB of memory). Over the last 4 weeks, peak CPU use was the equivalent of 1.6 vCPUs and peak memory use was 8 GiB, and the workload is not expected to grow. The application needs consistent CPU performance, and peak CPU and memory utilization must stay below 70% of the instance's capacity.

    Which instance type will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exécute une application interne sur une instance m6i.4xlarge (16 vCPU, 64 Gio de mémoire). Au cours des 4 dernières semaines, l'utilisation maximale du processeur a équivalu à 1,6 vCPU et l'utilisation maximale de la mémoire a été de 8 Gio, et la charge de travail ne devrait pas augmenter. L'application a besoin de performances de processeur constantes, et l'utilisation maximale du processeur et de la mémoire doit rester inférieure à 70 % de la capacité de l'instance.

    Quel type d'instance répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "m6i.large (2 vCPUs, 8 GiB of memory)"
        fr: "m6i.large (2 vCPU, 8 Gio de mémoire)"
    - id: b
      text:
        en: "m6i.2xlarge (8 vCPUs, 32 GiB of memory)"
        fr: "m6i.2xlarge (8 vCPU, 32 Gio de mémoire)"
    - id: c
      text:
        en: "r6i.xlarge (4 vCPUs, 32 GiB of memory)"
        fr: "r6i.xlarge (4 vCPU, 32 Gio de mémoire)"
    - id: d
      text:
        en: "m6i.xlarge (4 vCPUs, 16 GiB of memory)"
        fr: "m6i.xlarge (4 vCPU, 16 Gio de mémoire)"
answer: { optionId: d }
explanation:
  correct:
    en: "On an m6i.xlarge, the peaks reach 40% of CPU (1.6 of 4 vCPUs) and 50% of memory (8 of 16 GiB), both below the 70% limit. It is the smallest size of the same fixed-performance family that keeps the required headroom, so it costs less than the larger options."
    fr: "Sur une m6i.xlarge, les pointes atteignent 40 % du processeur (1,6 sur 4 vCPU) et 50 % de la mémoire (8 sur 16 Gio), deux valeurs inférieures à la limite de 70 %. C'est la plus petite taille de la même famille à performances fixes qui conserve la marge exigée : elle coûte moins cher que les options plus grandes."
  options:
    a:
      en: "Peak memory would reach 100% of the 8 GiB, far above the 70% limit."
      fr: "La mémoire atteindrait en pointe 100 % des 8 Gio, bien au-delà de la limite de 70 %."
    b:
      en: "This size meets the limits but has twice the capacity of m6i.xlarge and costs more."
      fr: "Cette taille respecte les limites, mais offre deux fois la capacité de m6i.xlarge et coûte plus cher."
    c:
      en: "This memory optimized size meets the limits but provides memory that the application does not need, at a higher price than m6i.xlarge."
      fr: "Cette taille optimisée pour la mémoire respecte les limites, mais fournit de la mémoire dont l'application n'a pas besoin, à un prix supérieur à m6i.xlarge."
references:
  - title: "Amazon EC2 instance type naming conventions"
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/instance-type-names.html
  - title: "Metrics analyzed by AWS Compute Optimizer"
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/metrics.html
