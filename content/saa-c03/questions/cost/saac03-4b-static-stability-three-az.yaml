id: saac03-4b-static-stability-three-az
objective: "4.2.13"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A production payment application needs at least 6 Amazon EC2 instances running at all times to handle its load, including while one Availability Zone is unavailable. The company does not want to depend on launching new instances during an Availability Zone failure. The AWS Region has three Availability Zones, and the application can run in any of them.

    Which Auto Scaling group configuration will meet these requirements MOST cost-effectively?
  fr: |
    Une application de paiement en production a besoin d'au moins 6 instances Amazon EC2 en fonctionnement en permanence pour absorber sa charge, y compris lorsqu'une zone de disponibilité est indisponible. L'entreprise ne souhaite pas dépendre du lancement de nouvelles instances pendant une panne de zone de disponibilité. La Région AWS compte trois zones de disponibilité, et l'application peut s'exécuter dans n'importe laquelle.

    Quelle configuration de groupe Auto Scaling répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Run 6 instances in two Availability Zones, with 3 instances in each zone."
        fr: "Exécuter 6 instances dans deux zones de disponibilité, à raison de 3 instances par zone."
    - id: b
      text:
        en: "Run 12 instances in two Availability Zones, with 6 instances in each zone."
        fr: "Exécuter 12 instances dans deux zones de disponibilité, à raison de 6 instances par zone."
    - id: c
      text:
        en: "Run 9 instances in three Availability Zones, with 3 instances in each zone."
        fr: "Exécuter 9 instances dans trois zones de disponibilité, à raison de 3 instances par zone."
    - id: d
      text:
        en: "Run 6 instances in three Availability Zones, with 2 instances in each zone, and let Auto Scaling replace lost capacity."
        fr: "Exécuter 6 instances dans trois zones de disponibilité, à raison de 2 instances par zone, et laisser Auto Scaling remplacer la capacité perdue."
answer: { optionId: c }
explanation:
  correct:
    en: "A statically stable design keeps enough capacity in the remaining zones to carry the full load without launching instances. With Z zones, each zone needs N/(Z-1) instances: 6/(3-1) = 3 per zone, or 9 instances in total, which is less than the 12 instances that two zones would require."
    fr: "Une conception statiquement stable conserve dans les zones restantes assez de capacité pour supporter toute la charge sans lancer d'instances. Avec Z zones, chaque zone a besoin de N/(Z-1) instances : 6/(3-1) = 3 par zone, soit 9 instances au total, ce qui est moins que les 12 instances qu'exigeraient deux zones."
  options:
    a:
      en: "If one zone fails, only 3 instances remain, which is below the 6 instances that the load requires."
      fr: "Si une zone tombe en panne, il ne reste que 3 instances, soit moins que les 6 instances qu'exige la charge."
    b:
      en: "This design is statically stable, but it runs 12 instances instead of 9."
      fr: "Cette conception est statiquement stable, mais elle exécute 12 instances au lieu de 9."
    d:
      en: "Losing a zone leaves 4 instances, and the design depends on launching replacements during the failure, which the company wants to avoid."
      fr: "La perte d'une zone laisse 4 instances, et la conception dépend du lancement d'instances de remplacement pendant la panne, ce que l'entreprise veut éviter."
references:
  - title: "REL11-BP05 Use static stability to prevent bimodal behavior"
    url: https://docs.aws.amazon.com/wellarchitected/latest/framework/rel_withstand_component_failures_static_stability.html
