id: saac03-4a-auto-growing-storage
objective: "4.1.15"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is choosing storage for new workloads and wants to avoid capacity planning. Storage must grow automatically as data is added, with no allocated size, maximum storage threshold or scaling automation to configure.

    Which two storage options meet this requirement? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise choisit le stockage de nouvelles charges de travail et veut éviter la planification de capacité. Le stockage doit croître automatiquement à mesure que des données sont ajoutées, sans taille allouée, sans seuil de stockage maximal et sans automatisation de mise à l'échelle à configurer.

    Quelles sont les deux options de stockage qui répondent à cette exigence ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "An Amazon Aurora DB cluster volume", fr: "Un volume de cluster de bases de données Amazon Aurora" } }
    - { id: b, text: { en: "An Amazon RDS for MySQL DB instance", fr: "Une instance de base de données Amazon RDS for MySQL" } }
    - { id: c, text: { en: "An Amazon EBS gp3 volume", fr: "Un volume Amazon EBS gp3" } }
    - { id: d, text: { en: "An Amazon EFS file system", fr: "Un système de fichiers Amazon EFS" } }
    - { id: e, text: { en: "An Amazon FSx for Windows File Server file system", fr: "Un système de fichiers Amazon FSx for Windows File Server" } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "An Aurora cluster volume grows automatically as the database grows, and you are charged only for the space used. An EFS file system also grows and shrinks automatically as files are added and removed, with no storage to provision."
    fr: "Un volume de cluster Aurora croît automatiquement avec la base de données, et seul l'espace utilisé est facturé. Un système de fichiers EFS croît et décroît lui aussi automatiquement à mesure que des fichiers sont ajoutés et supprimés, sans stockage à provisionner."
  options:
    b:
      en: "An RDS DB instance has allocated storage; automatic growth requires enabling storage autoscaling with a maximum storage threshold."
      fr: "Une instance RDS a un stockage alloué ; la croissance automatique exige d'activer la mise à l'échelle automatique du stockage avec un seuil maximal."
    c:
      en: "An EBS volume has a fixed provisioned size that must be increased with Elastic Volumes and then extended in the file system."
      fr: "Un volume EBS a une taille provisionnée fixe qu'il faut augmenter avec Elastic Volumes, puis étendre dans le système de fichiers."
    e:
      en: "FSx for Windows File Server has provisioned storage capacity; automatic increases need a CloudWatch alarm and an automation solution that you deploy."
      fr: "FSx for Windows File Server a une capacité de stockage provisionnée ; les augmentations automatiques exigent une alarme CloudWatch et une solution d'automatisation à déployer."
references:
  - title: Amazon Aurora storage
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.StorageReliability.html
  - title: Managing storage on FSx for Windows File Server
    url: https://docs.aws.amazon.com/fsx/latest/WindowsGuide/managing-storage-capacity.html
