id: saac03-4c-batch-single-az
objective: "4.4.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly simulation on 40 EC2 instances launched across three Availability Zones. The instances exchange several hundred terabytes with one another during each run. The job can simply be restarted the next night if it fails, and it has no availability requirement. A review shows that data transfer between zones is the largest cost of the job.

    Which change will reduce the cost of the job the MOST?
  fr: |
    Une entreprise exécute chaque nuit une simulation sur 40 instances EC2 lancées dans trois zones de disponibilité. Les instances échangent plusieurs centaines de téraoctets entre elles à chaque exécution. La tâche peut simplement être relancée la nuit suivante en cas d'échec et n'a aucune exigence de disponibilité. Un examen montre que le transfert de données entre zones est le coût le plus important de la tâche.

    Quelle modification réduit le PLUS le coût de la tâche ?
body:
  options:
    - id: a
      text: { en: "Launch all the instances in a cluster placement group in a single Availability Zone.", fr: "Lancer toutes les instances dans un groupe de placement de cluster dans une seule zone de disponibilité." }
    - id: b
      text: { en: "Launch the instances in a spread placement group across the three Availability Zones.", fr: "Lancer les instances dans un groupe de placement réparti (spread) sur les trois zones de disponibilité." }
    - id: c
      text: { en: "Assign Elastic IP addresses to the instances and send the traffic to the public addresses.", fr: "Attribuer des adresses IP Elastic aux instances et envoyer le trafic vers les adresses publiques." }
    - id: d
      text: { en: "Enable enhanced networking with the Elastic Network Adapter (ENA) on all the instances.", fr: "Activer la mise en réseau améliorée avec Elastic Network Adapter (ENA) sur toutes les instances." }
answer: { optionId: a }
explanation:
  correct:
    en: Traffic between Availability Zones is billed per GB in each direction, while traffic between instances in the same zone over private IP addresses has no transfer charge. A cluster placement group keeps the instances in one zone and also gives them higher per-flow throughput, and the job does not need multi-zone resilience.
    fr: Le trafic entre zones de disponibilité est facturé par Go dans chaque sens, alors que le trafic entre instances d'une même zone via des adresses IP privées n'entraîne aucun frais de transfert. Un groupe de placement de cluster garde les instances dans une seule zone et leur donne aussi un débit par flux plus élevé, et la tâche n'a pas besoin de résilience multizone.
  options:
    b:
      en: A spread placement group places instances on distinct hardware for resilience; across three zones it keeps the inter-zone charges.
      fr: Un groupe de placement réparti place les instances sur du matériel distinct pour la résilience ; sur trois zones, il conserve les frais entre zones.
    c:
      en: Sending traffic to public addresses does not remove the inter-zone charge, and the Elastic IP addresses are billed.
      fr: Envoyer le trafic vers des adresses publiques ne supprime pas les frais entre zones, et les adresses IP Elastic sont facturées.
    d:
      en: Enhanced networking raises bandwidth and lowers latency, but the traffic still crosses zones and is billed the same way.
      fr: La mise en réseau améliorée augmente la bande passante et réduit la latence, mais le trafic traverse toujours les zones et reste facturé de la même façon.
references:
  - title: Placement strategies for your placement groups
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
  - title: Amazon VPC pricing
    url: https://aws.amazon.com/vpc/pricing/
