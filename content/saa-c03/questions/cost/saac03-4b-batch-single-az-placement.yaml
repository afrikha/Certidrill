id: saac03-4b-batch-single-az-placement
objective: "4.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a nightly simulation on a fleet of 40 Amazon EC2 instances that are spread across three Availability Zones. During each run, the instances exchange several terabytes of data with each other, and the company pays data transfer charges for this traffic. If a run fails, it can be restarted the next night, so the workload does not need to tolerate the loss of an Availability Zone.

    Which solution will reduce the cost of this workload?
  fr: |
    Une entreprise exécute chaque nuit une simulation sur un parc de 40 instances Amazon EC2 réparties dans trois zones de disponibilité. Pendant chaque exécution, les instances échangent plusieurs téraoctets de données entre elles, et l'entreprise paie des frais de transfert de données pour ce trafic. Si une exécution échoue, elle peut être relancée la nuit suivante : la charge de travail n'a donc pas besoin de tolérer la perte d'une zone de disponibilité.

    Quelle solution réduira le coût de cette charge de travail ?
body:
  options:
    - id: a
      text:
        en: "Launch the instances in a spread placement group across the three Availability Zones."
        fr: "Lancer les instances dans un groupe de placement par répartition (spread) couvrant les trois zones de disponibilité."
    - id: b
      text:
        en: "Move half of the instances to a second AWS Region and connect the two VPCs with VPC peering."
        fr: "Déplacer la moitié des instances vers une deuxième Région AWS et relier les deux VPC par appairage de VPC (VPC peering)."
    - id: c
      text:
        en: "Assign an Elastic IP address to each instance and send the traffic to these public addresses."
        fr: "Attribuer une adresse IP Elastic à chaque instance et envoyer le trafic vers ces adresses publiques."
    - id: d
      text:
        en: "Launch all the instances in one Availability Zone in a cluster placement group."
        fr: "Lancer toutes les instances dans une seule zone de disponibilité, dans un groupe de placement de cluster."
answer: { optionId: d }
explanation:
  correct:
    en: "Data transfer between Availability Zones in the same Region is charged in both directions, so keeping all the instances in one zone removes that charge. A cluster placement group also places the instances close together for low latency and high throughput, which suits a tightly coupled simulation that does not need zone-level resilience."
    fr: "Le transfert de données entre zones de disponibilité d'une même Région est facturé dans les deux sens : regrouper toutes les instances dans une seule zone supprime ces frais. Un groupe de placement de cluster rapproche en outre les instances pour une faible latence et un débit élevé, ce qui convient à une simulation fortement couplée qui n'a pas besoin de résilience au niveau de la zone."
  options:
    a:
      en: "A spread placement group keeps the instances in several zones, so cross-AZ charges remain, and it supports only seven running instances per zone."
      fr: "Un groupe de placement par répartition laisse les instances dans plusieurs zones, donc les frais inter-AZ subsistent, et il n'accepte que sept instances en cours d'exécution par zone."
    b:
      en: "Data transferred out of a Region to another Region is charged, so this adds cost and latency instead of removing it."
      fr: "Le transfert de données sortant d'une Région vers une autre Région est facturé : cela ajoute du coût et de la latence au lieu d'en supprimer."
    c:
      en: "Routing the traffic through public IPv4 addresses adds public IP charges and does not avoid data transfer charges between zones."
      fr: "Faire passer le trafic par des adresses IPv4 publiques ajoute des frais d'adresses IP publiques et n'évite pas les frais de transfert entre zones."
references:
  - title: "Understanding data transfer charges"
    url: https://docs.aws.amazon.com/cur/latest/userguide/cur-data-transfers-charges.html
  - title: "Placement strategies for your placement groups"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/placement-strategies.html
