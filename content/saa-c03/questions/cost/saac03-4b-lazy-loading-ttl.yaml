id: saac03-4b-lazy-loading-ttl
objective: "4.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A travel company caches the results of expensive Amazon RDS for PostgreSQL queries in Amazon ElastiCache. The database holds millions of hotel records, but users request only a small fraction of them, and the company wants to keep the cache cluster as small as possible. Prices change a few times each day, and showing a price that is up to 5 minutes old is acceptable.

    Which caching strategy will meet these requirements?
  fr: |
    Une agence de voyages met en cache dans Amazon ElastiCache les résultats de requêtes coûteuses sur Amazon RDS for PostgreSQL. La base de données contient des millions de fiches d'hôtels, mais les utilisateurs n'en demandent qu'une petite partie, et l'entreprise souhaite garder le cluster de cache aussi petit que possible. Les prix changent plusieurs fois par jour, et afficher un prix datant de 5 minutes au plus est acceptable.

    Quelle stratégie de mise en cache répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Write-through caching that writes every database update to the cache, with no expiration on cached items"
        fr: "Une mise en cache en écriture immédiate (write-through) qui écrit chaque mise à jour de la base dans le cache, sans expiration des éléments en cache"
    - id: b
      text:
        en: "Lazy loading that adds items to the cache on a cache miss, with no expiration on cached items"
        fr: "Un chargement différé (lazy loading) qui ajoute les éléments au cache en cas d'échec d'accès au cache, sans expiration des éléments en cache"
    - id: c
      text:
        en: "Lazy loading that adds items to the cache on a cache miss, with a TTL of 300 seconds on each cached item"
        fr: "Un chargement différé (lazy loading) qui ajoute les éléments au cache en cas d'échec d'accès au cache, avec une durée de vie (TTL) de 300 secondes pour chaque élément en cache"
    - id: d
      text:
        en: "Write-through caching that writes every database update to the cache, with a TTL of 24 hours on each cached item"
        fr: "Une mise en cache en écriture immédiate (write-through) qui écrit chaque mise à jour de la base dans le cache, avec une durée de vie (TTL) de 24 heures pour chaque élément en cache"
answer: { optionId: c }
explanation:
  correct:
    en: "Lazy loading caches only the data that is actually requested, which keeps the cache small when users read a small fraction of the records. A 300-second TTL makes each item expire after 5 minutes, so the next read reloads it from the database and prices are never more than 5 minutes old."
    fr: "Le chargement différé ne met en cache que les données réellement demandées, ce qui garde le cache petit lorsque les utilisateurs ne lisent qu'une petite partie des fiches. Une durée de vie de 300 secondes fait expirer chaque élément au bout de 5 minutes : la lecture suivante le recharge depuis la base, et les prix n'ont jamais plus de 5 minutes."
  options:
    a:
      en: "Write-through caches every written record, including the many that are never read, which enlarges the cache. Without expiration, unread items stay forever."
      fr: "L'écriture immédiate met en cache chaque fiche écrite, y compris les nombreuses fiches jamais lues, ce qui agrandit le cache. Sans expiration, les éléments non lus restent indéfiniment."
    b:
      en: "Without a TTL, a cached price is never refreshed after it changes in the database, so users can see stale prices indefinitely."
      fr: "Sans TTL, un prix en cache n'est jamais actualisé après sa modification dans la base : les utilisateurs peuvent voir des prix obsolètes indéfiniment."
    d:
      en: "Write-through still caches every written record, and a 24-hour TTL does not limit how long unread items occupy the cache in a useful way."
      fr: "L'écriture immédiate met toujours en cache chaque fiche écrite, et une TTL de 24 heures ne limite pas utilement la durée pendant laquelle les éléments non lus occupent le cache."
references:
  - title: "Caching strategies for Memcached"
    url: https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Strategies.html
