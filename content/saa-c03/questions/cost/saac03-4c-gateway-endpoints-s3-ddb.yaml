id: saac03-4c-gateway-endpoints-s3-ddb
objective: "4.4.10"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    An analytics application runs on EC2 instances in private subnets. The instances read large objects from Amazon S3 buckets and write items to Amazon DynamoDB tables, all in the same Region. All of this traffic currently goes through NAT gateways, which generate high data processing charges. The instances must remain in private subnets.

    Which combination of steps will reduce these charges MOST cost-effectively? (Choose two.)
  fr: |
    Une application d'analyse s'exécute sur des instances EC2 dans des sous-réseaux privés. Les instances lisent de gros objets dans des compartiments Amazon S3 et écrivent des éléments dans des tables Amazon DynamoDB, le tout dans la même Région. Tout ce trafic passe actuellement par des passerelles NAT, qui génèrent des frais de traitement des données élevés. Les instances doivent rester dans des sous-réseaux privés.

    Quelle combinaison d'étapes réduit ces frais de la manière la PLUS rentable ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a gateway VPC endpoint for Amazon S3 and associate it with the private subnet route tables.", fr: "Créer un point de terminaison de passerelle pour Amazon S3 et l'associer aux tables de routage des sous-réseaux privés." } }
    - { id: b, text: { en: "Create an interface VPC endpoint for Amazon S3 in each Availability Zone.", fr: "Créer un point de terminaison d'interface pour Amazon S3 dans chaque zone de disponibilité." } }
    - { id: c, text: { en: "Create a gateway VPC endpoint for Amazon DynamoDB and associate it with the private subnet route tables.", fr: "Créer un point de terminaison de passerelle pour Amazon DynamoDB et l'associer aux tables de routage des sous-réseaux privés." } }
    - { id: d, text: { en: "Move the instances to public subnets and assign them Elastic IP addresses.", fr: "Déplacer les instances vers des sous-réseaux publics et leur attribuer des adresses IP Elastic." } }
    - { id: e, text: { en: "Enable S3 Transfer Acceleration on the buckets.", fr: "Activer S3 Transfer Acceleration sur les compartiments." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Gateway endpoints exist for Amazon S3 and DynamoDB and have no hourly or data processing charges. Once associated with the route tables, the endpoint route (a prefix list) takes precedence for traffic to the service in the same Region, so this traffic no longer passes through the NAT gateways.
    fr: Les points de terminaison de passerelle existent pour Amazon S3 et DynamoDB et n'ont ni frais horaires ni frais de traitement des données. Une fois associé aux tables de routage, l'itinéraire du point de terminaison (une liste de préfixes) est prioritaire pour le trafic vers le service dans la même Région ; ce trafic ne passe donc plus par les passerelles NAT.
  options:
    b:
      en: An interface endpoint for S3 also avoids the NAT gateway, but it is billed per hour in each zone and per GB, whereas the gateway endpoint is free.
      fr: Un point de terminaison d'interface pour S3 évite aussi la passerelle NAT, mais il est facturé à l'heure dans chaque zone et par Go, alors que le point de terminaison de passerelle est gratuit.
    d:
      en: Public subnets break the requirement that the instances stay private, and Elastic IP addresses are billed.
      fr: Des sous-réseaux publics enfreignent l'exigence de garder les instances privées, et les adresses IP Elastic sont facturées.
    e:
      en: Transfer Acceleration speeds up long-distance transfers over the internet for an extra per-GB fee; it does not remove the NAT processing charge.
      fr: Transfer Acceleration accélère les transferts longue distance via Internet moyennant un coût par Go supplémentaire ; il ne supprime pas les frais de traitement de la passerelle NAT.
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
