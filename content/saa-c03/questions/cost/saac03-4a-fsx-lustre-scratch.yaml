id: saac03-4a-fsx-lustre-scratch
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A biotech company runs a weekly genome analysis job on a fleet of Linux Amazon EC2 instances. The job reads 50 TB of input data from an Amazon S3 bucket, needs a shared POSIX file system with sub-millisecond latency and very high aggregate throughput, and writes its results back to S3. The file system is needed only during the 12-hour job, and the data can be reloaded from S3 if a file server fails.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise de biotechnologie exécute chaque semaine une analyse de génomes sur un parc d'instances Amazon EC2 Linux. La tâche lit 50 To de données d'entrée dans un compartiment Amazon S3, a besoin d'un système de fichiers POSIX partagé avec une latence inférieure à la milliseconde et un débit global très élevé, et écrit ses résultats dans Amazon S3. Le système de fichiers n'est nécessaire que pendant les 12 heures de la tâche, et les données peuvent être rechargées depuis Amazon S3 en cas de défaillance d'un serveur de fichiers.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "An Amazon FSx for Lustre persistent file system with SSD storage, kept running between jobs", fr: "Un système de fichiers Amazon FSx for Lustre persistant avec stockage SSD, conservé entre les tâches" }
    - id: b
      text: { en: "An Amazon EFS file system with Provisioned Throughput, kept running between jobs", fr: "Un système de fichiers Amazon EFS avec débit provisionné, conservé entre les tâches" }
    - id: c
      text: { en: "Amazon EBS io2 Block Express volumes shared by the instances with Multi-Attach", fr: "Des volumes Amazon EBS io2 Block Express partagés entre les instances avec Multi-Attach" }
    - id: d
      text: { en: "An Amazon FSx for Lustre scratch file system linked to the bucket, created for each job and deleted afterward", fr: "Un système de fichiers Amazon FSx for Lustre de type scratch lié au compartiment, créé pour chaque tâche puis supprimé" }
answer: { optionId: d }
explanation:
  correct:
    en: "FSx for Lustre delivers the latency and throughput that HPC jobs need, and a file system linked to S3 presents the objects as files and can write results back. The scratch deployment type is designed for temporary storage and short-term processing: its data is not replicated, which is acceptable here, and creating it only for the job avoids paying between runs."
    fr: "FSx for Lustre offre la latence et le débit dont les tâches HPC ont besoin, et un système de fichiers lié à Amazon S3 présente les objets comme des fichiers et peut y réécrire les résultats. Le type de déploiement scratch est conçu pour le stockage temporaire et les traitements de courte durée : ses données ne sont pas répliquées, ce qui est acceptable ici, et ne le créer que pour la tâche évite de payer entre deux exécutions."
  options:
    a:
      en: "A persistent file system replicates data and replaces failed servers, durability the job does not need, and keeping it running all week adds cost."
      fr: "Un système de fichiers persistant réplique les données et remplace les serveurs défaillants, une durabilité inutile ici, et le conserver toute la semaine ajoute des coûts."
    b:
      en: "Amazon EFS does not reach the latency and aggregate throughput of Lustre for this job, and keeping provisioned throughput all week adds cost."
      fr: "Amazon EFS n'atteint pas la latence et le débit global de Lustre pour cette tâche, et conserver un débit provisionné toute la semaine ajoute des coûts."
    c:
      en: "Multi-Attach volumes are block storage limited to instances in one Availability Zone and need a cluster-aware file system; they are not a managed shared file system linked to S3."
      fr: "Les volumes Multi-Attach sont du stockage en bloc limité aux instances d'une même zone de disponibilité et exigent un système de fichiers compatible cluster ; ce n'est pas un système de fichiers partagé géré lié à Amazon S3."
references:
  - title: What is Amazon FSx for Lustre?
    url: https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html
