id: saac03-4c-peering-three-vpcs
objective: "4.4.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has three VPCs in the same Region with non-overlapping CIDR blocks. Each VPC must communicate with the other two, and large volumes of data move between them every day. The company does not plan to add more VPCs and has no on-premises connectivity. The company wants the MOST cost-effective design.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de trois VPC dans la même Région, avec des blocs CIDR qui ne se chevauchent pas. Chaque VPC doit communiquer avec les deux autres, et de gros volumes de données circulent entre eux chaque jour. L'entreprise ne prévoit pas d'ajouter d'autres VPC et n'a aucune connectivité sur site. Elle veut la conception la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a transit gateway, attach the three VPCs and update the route tables.", fr: "Créer une passerelle de transit, y attacher les trois VPC et mettre à jour les tables de routage." }
    - id: b
      text: { en: "Create two VPC peering connections through a central VPC and route traffic between the other two VPCs through it.", fr: "Créer deux connexions d'appairage de VPC via un VPC central et acheminer par celui-ci le trafic entre les deux autres VPC." }
    - id: c
      text: { en: "Create three VPC peering connections, one between each pair of VPCs, and update the route tables.", fr: "Créer trois connexions d'appairage de VPC, une entre chaque paire de VPC, et mettre à jour les tables de routage." }
    - id: d
      text: { en: "Create a Site-to-Site VPN connection between each pair of VPCs.", fr: "Créer une connexion Site-to-Site VPN entre chaque paire de VPC." }
answer: { optionId: c }
explanation:
  correct:
    en: A full mesh of three VPCs needs only three peering connections, which are easy to manage at this size. VPC peering has no hourly charge and no data processing charge; only standard data transfer applies. A transit gateway adds an hourly charge per attachment and a per-GB processing charge on all the daily traffic.
    fr: Un maillage complet de trois VPC ne demande que trois connexions d'appairage, faciles à gérer à cette échelle. L'appairage de VPC n'a ni frais horaires ni frais de traitement des données ; seul le transfert de données standard s'applique. Une passerelle de transit ajoute des frais horaires par attachement et des frais de traitement par Go sur tout le trafic quotidien.
  options:
    a:
      en: A transit gateway works, but its attachment hours and per-GB data processing make it more expensive for three VPCs with heavy traffic.
      fr: Une passerelle de transit fonctionne, mais ses heures d'attachement et son traitement des données par Go la rendent plus chère pour trois VPC à fort trafic.
    b:
      en: VPC peering is not transitive, so the two outer VPCs cannot reach each other through the central VPC.
      fr: L'appairage de VPC n'est pas transitif ; les deux VPC extérieurs ne peuvent donc pas se joindre via le VPC central.
    d:
      en: AWS Site-to-Site VPN connects a VPC to a remote customer gateway; it is not a VPC-to-VPC service and would add hourly connection charges.
      fr: AWS Site-to-Site VPN relie un VPC à une passerelle client distante ; ce n'est pas un service de VPC à VPC, et il ajouterait des frais horaires de connexion.
references:
  - title: How VPC peering connections work
    url: https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html
  - title: What is AWS Transit Gateway for Amazon VPC?
    url: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
