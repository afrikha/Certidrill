id: saac03-4b-anomaly-detection-dynamodb
objective: "4.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's Amazon DynamoDB costs vary by season, so a fixed monthly threshold either raises false alarms or misses real problems. The company wants to be notified automatically when DynamoDB spending deviates from its normal pattern, for example after a faulty deployment causes excessive reads. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Les coûts Amazon DynamoDB d'une entreprise varient selon les saisons : un seuil mensuel fixe déclenche donc de fausses alertes ou manque de vrais problèmes. L'entreprise souhaite être avertie automatiquement lorsque les dépenses DynamoDB s'écartent de leur schéma habituel, par exemple après un déploiement défectueux qui provoque des lectures excessives. La solution doit impliquer le MOINS de charge opérationnelle.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a cost budget for DynamoDB in AWS Budgets with a fixed alert threshold that is adjusted each month."
        fr: "Créer dans AWS Budgets un budget de coûts pour DynamoDB avec un seuil d'alerte fixe ajusté chaque mois."
    - id: b
      text:
        en: "Export CUR 2.0 data each day and run an Amazon Athena query that compares DynamoDB costs with the previous week."
        fr: "Exporter chaque jour les données CUR 2.0 et exécuter une requête Amazon Athena qui compare les coûts DynamoDB à ceux de la semaine précédente."
    - id: c
      text:
        en: "Create a CloudWatch alarm with a static threshold on the ConsumedReadCapacityUnits metric of each table."
        fr: "Créer une alarme CloudWatch avec un seuil statique sur la métrique ConsumedReadCapacityUnits de chaque table."
    - id: d
      text:
        en: "Create an AWS Cost Anomaly Detection monitor for AWS services with an alert subscription for the operations team."
        fr: "Créer un moniteur AWS Cost Anomaly Detection pour les services AWS, avec un abonnement aux alertes pour l'équipe d'exploitation."
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Cost Anomaly Detection uses machine learning models that learn spending patterns, including seasonality and growth, to reduce false positives. A monitor for AWS services evaluates each service separately, and an alert subscription sends notifications by email or Amazon SNS without any thresholds to maintain by hand."
    fr: "AWS Cost Anomaly Detection utilise des modèles d'apprentissage automatique qui apprennent les schémas de dépenses, y compris la saisonnalité et la croissance, afin de réduire les faux positifs. Un moniteur pour les services AWS évalue chaque service séparément, et un abonnement aux alertes envoie des notifications par e-mail ou via Amazon SNS sans seuil à maintenir manuellement."
  options:
    a:
      en: "A fixed threshold is exactly what causes the false alarms, and adjusting it each month is manual work."
      fr: "Un seuil fixe est précisément ce qui provoque les fausses alertes, et l'ajuster chaque mois est un travail manuel."
    b:
      en: "A custom daily query works but must be built and maintained, and a week-over-week comparison ignores seasonality."
      fr: "Une requête quotidienne personnalisée fonctionne, mais doit être créée et maintenue, et une comparaison d'une semaine sur l'autre ignore la saisonnalité."
    c:
      en: "Static per-table alarms track usage, not spending, and they have the same seasonal threshold problem."
      fr: "Des alarmes statiques par table suivent l'utilisation, pas les dépenses, et posent le même problème de seuil saisonnier."
references:
  - title: "Detecting unusual spend with AWS Cost Anomaly Detection"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/manage-ad.html
