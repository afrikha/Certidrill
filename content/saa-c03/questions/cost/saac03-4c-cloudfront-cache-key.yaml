id: saac03-4c-cloudfront-cache-key
objective: "4.4.11"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A news company serves article pages through an Amazon CloudFront distribution in front of an Application Load Balancer in one Region. The cache policy includes all query strings and the User-Agent header in the cache key, but the pages vary only by the article query string parameter. Viewers are spread worldwide, and the origin receives many requests for the same pages from different edge locations. The company wants to reduce the load and cost of the origin.

    Which actions will meet this requirement? (Choose two.)
  fr: |
    Une entreprise de presse diffuse ses pages d'articles via une distribution Amazon CloudFront placée devant un Application Load Balancer dans une Région. La politique de cache inclut toutes les chaînes de requête et l'en-tête User-Agent dans la clé de cache, alors que les pages ne varient que selon le paramètre de chaîne de requête article. Les lecteurs sont répartis dans le monde entier, et l'origine reçoit de nombreuses requêtes pour les mêmes pages depuis différents emplacements périphériques. L'entreprise veut réduire la charge et le coût de l'origine.

    Quelles actions répondent à cette exigence ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the cache policy so that the cache key includes only the article query string and no headers.", fr: "Modifier la politique de cache pour que la clé de cache n'inclue que la chaîne de requête article et aucun en-tête." } }
    - { id: b, text: { en: "Add the Accept-Language and Referer headers to the cache key.", fr: "Ajouter les en-têtes Accept-Language et Referer à la clé de cache." } }
    - { id: c, text: { en: "Enable CloudFront Origin Shield in the Region closest to the origin.", fr: "Activer CloudFront Origin Shield dans la Région la plus proche de l'origine." } }
    - { id: d, text: { en: "Set the minimum and default TTL of the cache policy to 0 seconds.", fr: "Définir à 0 seconde la durée de vie (TTL) minimale et par défaut de la politique de cache." } }
    - { id: e, text: { en: "Add an origin group with a second Application Load Balancer as the failover origin.", fr: "Ajouter un groupe d'origines avec un second Application Load Balancer comme origine de basculement." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: CloudFront caches a separate object for every combination of values in the cache key, so User-Agent and unused query strings split one page into many cache entries; keeping only the article parameter raises the cache hit ratio. Origin Shield adds a central caching layer in front of the origin, so each object needs only one origin request no matter how many edge locations ask for it.
    fr: CloudFront met en cache un objet distinct pour chaque combinaison de valeurs de la clé de cache ; User-Agent et les chaînes de requête inutiles divisent donc une page en de nombreuses entrées de cache, et ne garder que le paramètre article augmente le taux d'accès au cache. Origin Shield ajoute une couche de cache centrale devant l'origine ; chaque objet ne demande donc qu'une requête à l'origine, quel que soit le nombre d'emplacements périphériques qui le demandent.
  options:
    b:
      en: More headers in the cache key create even more variants of each page and lower the cache hit ratio.
      fr: Davantage d'en-têtes dans la clé de cache créent encore plus de variantes de chaque page et réduisent le taux d'accès au cache.
    d:
      en: A TTL of 0 makes CloudFront revalidate with the origin far more often, which increases origin load.
      fr: Une TTL de 0 oblige CloudFront à revalider beaucoup plus souvent auprès de l'origine, ce qui augmente la charge de l'origine.
    e:
      en: An origin group adds failover for availability; it does not reduce the number of requests that reach the origin.
      fr: Un groupe d'origines ajoute un basculement pour la disponibilité ; il ne réduit pas le nombre de requêtes qui atteignent l'origine.
references:
  - title: Increase the proportion of requests that are served directly from the CloudFront caches (cache hit ratio)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-hit-ratio.html
