id: saac03-4a-requester-pays-partners
objective: "4.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A genomics research institute stores a 400 TB reference dataset in an Amazon S3 bucket. Partner universities download large parts of the dataset from their own AWS accounts, and the institute's request and data transfer charges have grown sharply. The institute wants each partner to pay for the requests and downloads that it generates, while the institute continues to pay only for storage.

    Which solution will meet these requirements?
  fr: |
    Un institut de recherche en génomique stocke un jeu de données de référence de 400 To dans un compartiment Amazon S3. Des universités partenaires téléchargent de grandes parties de ce jeu de données depuis leurs propres comptes AWS, et les frais de requêtes et de transfert de données de l'institut ont fortement augmenté. L'institut veut que chaque partenaire paie les requêtes et les téléchargements qu'il génère, l'institut continuant à ne payer que le stockage.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Generate presigned URLs for the objects and send them to each partner every week.", fr: "Générer des URL présignées pour les objets et les envoyer chaque semaine à chaque partenaire." }
    - id: b
      text: { en: "Create an Amazon CloudFront distribution in front of the bucket and share its domain name with the partners.", fr: "Créer une distribution Amazon CloudFront devant le compartiment et communiquer son nom de domaine aux partenaires." }
    - id: c
      text: { en: "Enable Requester Pays on the bucket and have the partners send authenticated requests that acknowledge the charges.", fr: "Activer le paiement par le demandeur (Requester Pays) sur le compartiment et faire envoyer par les partenaires des requêtes authentifiées qui acceptent les frais." }
    - id: d
      text: { en: "Enable S3 Transfer Acceleration on the bucket and have the partners download through the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et faire télécharger les partenaires via le point de terminaison accéléré." }
answer: { optionId: c }
explanation:
  correct:
    en: "With Requester Pays, the requester pays the request and data download costs and the bucket owner keeps paying only for storage. Every request must be authenticated so that S3 can identify the account to bill, and the requester must acknowledge the charges in the request."
    fr: "Avec le paiement par le demandeur, le demandeur paie les requêtes et le téléchargement des données, et le propriétaire du compartiment ne paie plus que le stockage. Chaque requête doit être authentifiée pour qu'Amazon S3 identifie le compte à facturer, et le demandeur doit accepter les frais dans la requête."
  options:
    a:
      en: "A presigned URL performs the request with the institute's own credentials, so the institute is still billed for the requests and the downloads."
      fr: "Une URL présignée exécute la requête avec les informations d'identification de l'institut : c'est donc toujours l'institut qui est facturé pour les requêtes et les téléchargements."
    b:
      en: "CloudFront charges are billed to the account that owns the distribution, which is the institute; the cost is moved, not shifted to the partners."
      fr: "Les frais CloudFront sont facturés au compte propriétaire de la distribution, c'est-à-dire l'institut : le coût est déplacé, pas transféré aux partenaires."
    d:
      en: "Transfer Acceleration speeds up long-distance transfers and adds charges for the bucket owner; it does not make the partners pay."
      fr: "Transfer Acceleration accélère les transferts longue distance et ajoute des frais pour le propriétaire du compartiment ; il ne fait pas payer les partenaires."
references:
  - title: Using Requester Pays general purpose buckets for storage transfers and usage
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/RequesterPaysBuckets.html
