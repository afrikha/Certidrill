id: saac03-4a-explorer-and-budgets
objective: "4.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    The cloud center of excellence of a company has two requirements. Managers must explore the last 12 months of spend in graphs, grouped by service and by member account, without building a data pipeline. Each project owner must receive an email when the forecasted monthly cost of the project's tagged resources is going to exceed a fixed amount.

    Which combination of AWS tools will meet these requirements with the LEAST operational overhead? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Le centre d'excellence cloud d'une entreprise a deux exigences. Les responsables doivent explorer les dépenses des 12 derniers mois sous forme de graphiques, regroupées par service et par compte membre, sans construire de pipeline de données. Chaque responsable de projet doit recevoir un e-mail lorsque le coût mensuel prévisionnel des ressources balisées de son projet va dépasser un montant fixe.

    Quelle combinaison d'outils AWS répond à ces exigences avec le MOINS de charge opérationnelle ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "AWS Cost Explorer", fr: "AWS Cost Explorer" } }
    - { id: b, text: { en: "AWS Cost and Usage Report queried with Amazon Athena", fr: "AWS Cost and Usage Report interrogé avec Amazon Athena" } }
    - { id: c, text: { en: "AWS Budgets", fr: "AWS Budgets" } }
    - { id: d, text: { en: "AWS Cost Anomaly Detection", fr: "AWS Cost Anomaly Detection" } }
    - { id: e, text: { en: "AWS CloudTrail Lake", fr: "AWS CloudTrail Lake" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Cost Explorer shows up to 13 months of history plus the current month in ready-made graphs that can be grouped by service or account, with nothing to build. AWS Budgets sends email or SNS alerts when actual or forecasted cost exceeds a fixed amount, and a budget can be filtered on a cost allocation tag for each project."
    fr: "Cost Explorer affiche jusqu'à 13 mois d'historique plus le mois en cours dans des graphiques prêts à l'emploi, regroupables par service ou par compte, sans rien construire. AWS Budgets envoie des alertes par e-mail ou SNS lorsque le coût réel ou prévisionnel dépasse un montant fixe, et chaque budget peut être filtré sur une balise de répartition des coûts du projet."
  options:
    b:
      en: "The Cost and Usage Report needs an S3 export, Athena tables and queries or dashboards to build: that is a data pipeline, with more overhead."
      fr: "Cost and Usage Report impose une exportation S3, des tables et requêtes Athena ou des tableaux de bord à construire : c'est un pipeline de données, avec plus de charge."
    d:
      en: "Cost Anomaly Detection uses machine learning to flag unusual spend; it does not alert against a fixed forecasted amount."
      fr: "Cost Anomaly Detection utilise le machine learning pour signaler des dépenses inhabituelles ; il n'alerte pas par rapport à un montant prévisionnel fixe."
    e:
      en: "CloudTrail Lake stores and queries API activity events, not cost data."
      fr: "CloudTrail Lake stocke et interroge des événements d'activité d'API, pas des données de coûts."
references:
  - title: Analyzing your costs and usage with AWS Cost Explorer
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html
  - title: Managing your costs with AWS Budgets
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
