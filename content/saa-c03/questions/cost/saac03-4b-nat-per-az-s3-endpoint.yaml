id: saac03-4b-nat-per-az-s3-endpoint
objective: "4.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A company runs Amazon EC2 instances in private subnets in two Availability Zones. All the private subnets route internet-bound traffic to a single NAT gateway in the first Availability Zone. The instances download several terabytes each day from an Amazon S3 bucket in the same AWS Region and also download software updates from the internet. A cost review shows high NAT gateway data processing charges and high data transfer charges between Availability Zones. The company wants to reduce these charges.

    Which combination of steps will meet this requirement MOST cost-effectively? (Choose two.)
  fr: |
    Une entreprise exécute des instances Amazon EC2 dans des sous-réseaux privés répartis sur deux zones de disponibilité. Tous les sous-réseaux privés acheminent le trafic destiné à Internet vers une seule passerelle NAT située dans la première zone de disponibilité. Les instances téléchargent chaque jour plusieurs téraoctets depuis un compartiment Amazon S3 de la même Région AWS, ainsi que des mises à jour logicielles depuis Internet. Une revue des coûts montre des frais élevés de traitement des données de la passerelle NAT et des frais élevés de transfert de données entre zones de disponibilité. L'entreprise souhaite réduire ces frais.

    Quelle combinaison d'étapes répondra à cette exigence de la manière la PLUS rentable ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create an S3 gateway endpoint and associate it with the route tables of the private subnets."
        fr: "Créer un point de terminaison de passerelle S3 et l'associer aux tables de routage des sous-réseaux privés."
    - id: b
      text:
        en: "Create an S3 interface endpoint in each Availability Zone and enable private DNS for it."
        fr: "Créer un point de terminaison d'interface S3 dans chaque zone de disponibilité et activer le DNS privé."
    - id: c
      text:
        en: "Create a NAT gateway in the second Availability Zone and point that zone's private route table to it."
        fr: "Créer une passerelle NAT dans la deuxième zone de disponibilité et faire pointer la table de routage privée de cette zone vers elle."
    - id: d
      text:
        en: "Replace the NAT gateway with a single new NAT gateway in a public subnet of the second Availability Zone."
        fr: "Remplacer la passerelle NAT par une seule nouvelle passerelle NAT dans un sous-réseau public de la deuxième zone de disponibilité."
    - id: e
      text:
        en: "Replace the NAT gateway route in the private route tables with a route to the internet gateway."
        fr: "Remplacer, dans les tables de routage privées, la route vers la passerelle NAT par une route vers la passerelle Internet."
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A gateway endpoint for Amazon S3 has no additional charge and sends S3 traffic directly from the subnets, so it no longer passes through the NAT gateway or crosses zones. A NAT gateway in each Availability Zone keeps the remaining internet traffic in its own zone, which removes the cross-AZ data transfer to the single NAT gateway."
    fr: "Un point de terminaison de passerelle pour Amazon S3 n'entraîne aucun frais supplémentaire et achemine le trafic S3 directement depuis les sous-réseaux : il ne passe plus par la passerelle NAT et ne traverse plus les zones. Une passerelle NAT dans chaque zone de disponibilité garde le trafic Internet restant dans sa propre zone, ce qui supprime le transfert inter-AZ vers la passerelle NAT unique."
  options:
    b:
      en: "Interface endpoints also bypass the NAT gateway, but they are billed per hour and per gigabyte processed, whereas a gateway endpoint for S3 is free."
      fr: "Les points de terminaison d'interface évitent aussi la passerelle NAT, mais ils sont facturés à l'heure et au gigaoctet traité, alors qu'un point de terminaison de passerelle pour S3 est gratuit."
    d:
      en: "A single NAT gateway in the other zone only shifts the cross-AZ traffic to the instances of the first zone."
      fr: "Une passerelle NAT unique dans l'autre zone ne fait que reporter le trafic inter-AZ sur les instances de la première zone."
    e:
      en: "Instances in private subnets have no public IP addresses, so a route to the internet gateway would break their internet access and expose the subnets."
      fr: "Les instances des sous-réseaux privés n'ont pas d'adresse IP publique : une route vers la passerelle Internet couperait leur accès à Internet et exposerait les sous-réseaux."
references:
  - title: "Gateway endpoints"
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
  - title: "Pricing for NAT gateways"
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html
