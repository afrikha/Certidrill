id: saac03-4a-backup-cold-storage
objective: "4.1.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company uses AWS Backup to protect an Amazon EFS file system. Compliance rules require daily backups kept for 30 days and monthly backups kept for 7 years. Monthly backups are rarely restored. The company wants to minimize backup storage costs.

    Which backup plan configuration will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise utilise AWS Backup pour protéger un système de fichiers Amazon EFS. Les règles de conformité exigent des sauvegardes quotidiennes conservées 30 jours et des sauvegardes mensuelles conservées 7 ans. Les sauvegardes mensuelles sont rarement restaurées. L'entreprise veut réduire au minimum les coûts de stockage des sauvegardes.

    Quelle configuration de plan de sauvegarde répond à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "One rule that creates daily backups, moves each backup to cold storage after 1 day, and deletes it after 7 years.", fr: "Une seule règle qui crée des sauvegardes quotidiennes, déplace chaque sauvegarde vers le stockage à froid après 1 jour et la supprime après 7 ans." }
    - id: b
      text: { en: "A daily rule that moves backups to cold storage after 7 days and deletes them after 30 days, and a monthly rule kept in warm storage for 7 years.", fr: "Une règle quotidienne qui déplace les sauvegardes vers le stockage à froid après 7 jours et les supprime après 30 jours, et une règle mensuelle conservée 7 ans en stockage à chaud." }
    - id: c
      text: { en: "A daily rule with 30-day retention, and a monthly rule that copies each backup to an S3 bucket with a lifecycle rule to S3 Glacier Deep Archive.", fr: "Une règle quotidienne avec une rétention de 30 jours, et une règle mensuelle qui copie chaque sauvegarde dans un compartiment S3 avec une règle de cycle de vie vers S3 Glacier Deep Archive." }
    - id: d
      text: { en: "A daily rule with 30-day retention in warm storage, and a monthly rule that moves backups to cold storage after 30 days and deletes them after 7 years.", fr: "Une règle quotidienne avec une rétention de 30 jours en stockage à chaud, et une règle mensuelle qui déplace les sauvegardes vers le stockage à froid après 30 jours et les supprime après 7 ans." }
answer: { optionId: d }
explanation:
  correct:
    en: "Two rules separate the two retention needs. Daily backups stay in warm storage and expire after 30 days, which is shorter than the 90-day minimum of cold storage, so moving them would cost more. Monthly backups move to the cheaper cold storage tier, supported for EFS, and stay there far longer than the 90-day minimum."
    fr: "Deux règles séparent les deux besoins de rétention. Les sauvegardes quotidiennes restent en stockage à chaud et expirent après 30 jours, une durée inférieure au minimum de 90 jours du stockage à froid : les y déplacer coûterait plus cher. Les sauvegardes mensuelles passent au stockage à froid, moins cher et pris en charge pour EFS, et y restent bien au-delà du minimum de 90 jours."
  options:
    a:
      en: "Keeping every daily backup for 7 years multiplies the stored data far beyond what the rules require, and AWS recommends keeping backups warm for at least 8 days."
      fr: "Conserver chaque sauvegarde quotidienne pendant 7 ans multiplie les données stockées bien au-delà des exigences, et AWS recommande de garder les sauvegardes à chaud au moins 8 jours."
    b:
      en: "A backup in cold storage must stay there at least 90 days, so a daily rule that deletes backups 30 days after creation cannot use cold storage; keeping monthly backups warm for 7 years is also the expensive tier."
      fr: "Une sauvegarde en stockage à froid doit y rester au moins 90 jours : une règle qui supprime les sauvegardes 30 jours après leur création ne peut pas utiliser le stockage à froid ; garder les sauvegardes mensuelles à chaud pendant 7 ans utilise en outre le niveau le plus cher."
    c:
      en: "AWS Backup copies recovery points to other backup vaults, in the same or other Regions and accounts, not to a regular S3 bucket with lifecycle rules."
      fr: "AWS Backup copie les points de récupération vers d'autres coffres-forts de sauvegarde, dans la même Région ou d'autres Régions et comptes, pas vers un compartiment S3 ordinaire doté de règles de cycle de vie."
references:
  - title: Backup plan options and configuration
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/plan-options-and-configuration.html
