id: saac03-4b-ecs-anywhere-existing-servers
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company recently bought new servers for its on-premises data center and must keep using them for several years. The company is containerizing the applications that run on these servers, and it already runs containers on Amazon ECS in an AWS Region. The company wants to manage all its containers from the same ECS control plane. The on-premises applications only make outbound calls.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise a récemment acheté de nouveaux serveurs pour son centre de données sur site et doit continuer à les utiliser pendant plusieurs années. Elle conteneurise les applications qui s'exécutent sur ces serveurs et exécute déjà des conteneurs sur Amazon ECS dans une Région AWS. L'entreprise souhaite gérer tous ses conteneurs depuis le même plan de contrôle ECS. Les applications sur site n'effectuent que des appels sortants.

    Quelle solution répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Register the existing servers as external instances in an ECS cluster by using Amazon ECS Anywhere."
        fr: "Enregistrer les serveurs existants comme instances externes dans un cluster ECS à l'aide d'Amazon ECS Anywhere."
    - id: b
      text:
        en: "Order an AWS Outposts rack and run the containers in an ECS cluster on the Outpost subnets."
        fr: "Commander un rack AWS Outposts et exécuter les conteneurs dans un cluster ECS sur les sous-réseaux de l'Outpost."
    - id: c
      text:
        en: "Migrate the containers to Amazon ECS on AWS Fargate in the Region and decommission the servers."
        fr: "Migrer les conteneurs vers Amazon ECS sur AWS Fargate dans la Région et mettre les serveurs hors service."
    - id: d
      text:
        en: "Deploy the containers in an AWS Local Zone that is connected to the data center through AWS Site-to-Site VPN."
        fr: "Déployer les conteneurs dans une AWS Local Zone reliée au centre de données par AWS Site-to-Site VPN."
answer: { optionId: a }
explanation:
  correct:
    en: "Amazon ECS Anywhere registers on-premises servers or VMs as external instances of an ECS cluster, so the company manages them with the same ECS control plane and runs tasks with the EXTERNAL launch type. It reuses hardware that the company already owns, and external instances are well suited to applications that make outbound calls."
    fr: "Amazon ECS Anywhere enregistre des serveurs ou des machines virtuelles sur site comme instances externes d'un cluster ECS : l'entreprise les gère avec le même plan de contrôle ECS et exécute des tâches avec le type de lancement EXTERNAL. La solution réutilise du matériel que l'entreprise possède déjà, et les instances externes conviennent bien aux applications qui effectuent des appels sortants."
  options:
    b:
      en: "Outposts brings new AWS-owned hardware with its own charges, while the company already owns servers that it must use."
      fr: "Outposts apporte du nouveau matériel appartenant à AWS, avec ses propres frais, alors que l'entreprise possède déjà des serveurs qu'elle doit utiliser."
    c:
      en: "Moving to Fargate ignores the requirement to keep using the servers that were just purchased."
      fr: "Passer à Fargate ne respecte pas l'exigence de continuer à utiliser les serveurs qui viennent d'être achetés."
    d:
      en: "A Local Zone is AWS infrastructure outside the data center; the company would pay for new capacity and leave its servers unused."
      fr: "Une Local Zone est une infrastructure AWS extérieure au centre de données ; l'entreprise paierait une nouvelle capacité et laisserait ses serveurs inutilisés."
references:
  - title: "Amazon ECS clusters for external instances"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-anywhere.html
