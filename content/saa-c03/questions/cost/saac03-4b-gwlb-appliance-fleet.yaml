id: saac03-4b-gwlb-appliance-fleet
objective: "4.2.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company inspects all traffic that enters its VPCs with third-party firewall appliances that run on Amazon EC2 instances. Administrators maintain custom scripts that update route tables to fail over between appliance instances, and the appliances are sized for peak traffic all the time. The company wants the appliance fleet to scale with traffic and to receive the traffic transparently, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise inspecte tout le trafic entrant dans ses VPC avec des appliances de pare-feu tierces exécutées sur des instances Amazon EC2. Les administrateurs maintiennent des scripts personnalisés qui mettent à jour les tables de routage pour basculer entre les instances d'appliance, et les appliances sont dimensionnées en permanence pour le trafic de pointe. L'entreprise souhaite que le parc d'appliances évolue avec le trafic et reçoive le trafic de manière transparente, avec le MOINS de charge opérationnelle.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Place the appliances behind an Application Load Balancer and send the inbound traffic to the load balancer's DNS name."
        fr: "Placer les appliances derrière un Application Load Balancer et envoyer le trafic entrant vers le nom DNS de l'équilibreur de charge."
    - id: b
      text:
        en: "Place the appliances behind a Network Load Balancer and keep the custom scripts to update the route tables during failover."
        fr: "Placer les appliances derrière un Network Load Balancer et conserver les scripts personnalisés pour mettre à jour les tables de routage lors du basculement."
    - id: c
      text:
        en: "Deploy AWS Network Firewall in front of the appliances and keep the appliance instances sized for peak traffic."
        fr: "Déployer AWS Network Firewall devant les appliances et conserver des instances d'appliance dimensionnées pour la pointe."
    - id: d
      text:
        en: "Register the appliances, in an Auto Scaling group, with a Gateway Load Balancer, and route traffic through Gateway Load Balancer endpoints."
        fr: "Enregistrer les appliances, dans un groupe Auto Scaling, auprès d'un Gateway Load Balancer, et acheminer le trafic via des points de terminaison Gateway Load Balancer."
answer: { optionId: d }
explanation:
  correct:
    en: "A Gateway Load Balancer is built to deploy, scale and manage virtual appliances such as firewalls. It acts as a transparent gateway for all IP traffic, sends it to healthy appliances with GENEVE, and route tables point to Gateway Load Balancer endpoints, so no failover scripts are needed and an Auto Scaling group can size the fleet to the traffic."
    fr: "Un Gateway Load Balancer est conçu pour déployer, mettre à l'échelle et gérer des appliances virtuelles comme des pare-feu. Il agit comme une passerelle transparente pour tout le trafic IP, l'envoie aux appliances saines avec GENEVE, et les tables de routage pointent vers des points de terminaison Gateway Load Balancer : aucun script de basculement n'est nécessaire et un groupe Auto Scaling peut dimensionner le parc en fonction du trafic."
  options:
    a:
      en: "An Application Load Balancer handles only HTTP and HTTPS and terminates connections, so it is not a transparent path for all inbound traffic."
      fr: "Un Application Load Balancer ne gère que HTTP et HTTPS et termine les connexions : ce n'est pas un chemin transparent pour tout le trafic entrant."
    b:
      en: "Keeping the custom failover scripts keeps the operational overhead that the company wants to remove."
      fr: "Conserver les scripts de basculement personnalisés maintient la charge opérationnelle que l'entreprise veut supprimer."
    c:
      en: "Adding a second inspection service increases cost, and the third-party appliances still do not scale with traffic."
      fr: "Ajouter un second service d'inspection augmente le coût, et les appliances tierces n'évoluent toujours pas avec le trafic."
references:
  - title: "What is a Gateway Load Balancer?"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/gateway/introduction.html
