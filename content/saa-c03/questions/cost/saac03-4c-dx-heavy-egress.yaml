id: saac03-4c-dx-heavy-egress
objective: "4.4.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company copies about 500 TB of processed results each month from Amazon EC2 instances in a VPC to its on-premises data center. The transfer runs at a steady rate all month over the internet, and data transfer out is now the largest item on the AWS bill. The company also wants more consistent network performance than the internet provides. The data center is near an AWS Direct Connect location.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise de recherche copie chaque mois environ 500 To de résultats traités depuis des instances Amazon EC2 d'un VPC vers son centre de données sur site. Le transfert s'effectue à débit constant tout le mois via Internet, et le transfert de données sortant est devenu le poste le plus important de la facture AWS. L'entreprise veut aussi des performances réseau plus régulières que celles d'Internet. Le centre de données se trouve près d'un emplacement AWS Direct Connect.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Create an AWS Site-to-Site VPN connection to the data center and send the results through the VPN tunnels.", fr: "Créer une connexion AWS Site-to-Site VPN vers le centre de données et envoyer les résultats dans les tunnels VPN." }
    - id: b
      text: { en: "Order an AWS Direct Connect connection sized for the traffic, create a private virtual interface and send the results over it.", fr: "Commander une connexion AWS Direct Connect dimensionnée pour le trafic, créer une interface virtuelle privée et envoyer les résultats par celle-ci." }
    - id: c
      text: { en: "Write the results to an Amazon S3 bucket with S3 Transfer Acceleration enabled and download them from the data center.", fr: "Écrire les résultats dans un compartiment Amazon S3 avec S3 Transfer Acceleration activé et les télécharger depuis le centre de données." }
    - id: d
      text: { en: "Put the EC2 instances behind an AWS Global Accelerator accelerator and download the results through its static IP addresses.", fr: "Placer les instances EC2 derrière un accélérateur AWS Global Accelerator et télécharger les résultats via ses adresses IP statiques." }
answer: { optionId: b }
explanation:
  correct:
    en: Direct Connect charges port hours plus data transfer out at Direct Connect rates, which are typically lower than internet data transfer out rates, and inbound data is free. For a steady, very large outbound volume the savings exceed the port cost, and the private link bypasses internet providers for more consistent performance.
    fr: Direct Connect facture des heures de port plus le transfert de données sortant aux tarifs Direct Connect, généralement inférieurs aux tarifs de transfert sortant vers Internet, et les données entrantes sont gratuites. Pour un volume sortant constant et très important, l'économie dépasse le coût du port, et la liaison privée contourne les fournisseurs Internet pour des performances plus régulières.
  options:
    a:
      en: VPN traffic still travels over the internet and is billed at the standard data transfer out rates, plus VPN connection hours.
      fr: Le trafic VPN passe toujours par Internet et est facturé aux tarifs standard de transfert de données sortant, en plus des heures de connexion VPN.
    c:
      en: Transfer Acceleration adds a per-GB charge on top of normal data transfer out and still uses the internet.
      fr: Transfer Acceleration ajoute un coût par Go en plus du transfert de données sortant normal et utilise toujours Internet.
    d:
      en: Global Accelerator adds a fixed hourly fee and a per-GB premium on top of standard data transfer out, so it raises the cost.
      fr: Global Accelerator ajoute des frais horaires fixes et un supplément par Go au transfert de données sortant standard ; il augmente donc le coût.
