id: saac03-4b-wavelength-5g-game
objective: "4.2.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A gaming company is launching a multiplayer game for smartphones that connect through a telecommunications carrier's 5G network. The game servers must give these players the lowest possible latency, and player traffic must reach the servers without leaving the carrier's network. The company wants to keep using Amazon EC2 and its existing VPC in the parent AWS Region.

    Which solution will meet these requirements?
  fr: |
    Un éditeur de jeux lance un jeu multijoueur pour smartphones connectés via le réseau 5G d'un opérateur de télécommunications. Les serveurs de jeu doivent offrir à ces joueurs la latence la plus faible possible, et le trafic des joueurs doit atteindre les serveurs sans quitter le réseau de l'opérateur. L'entreprise souhaite continuer à utiliser Amazon EC2 et son VPC existant dans la Région AWS parente.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy the game servers in an AWS Local Zone in the players' metropolitan area."
        fr: "Déployer les serveurs de jeu dans une AWS Local Zone de la zone métropolitaine des joueurs."
    - id: b
      text:
        en: "Extend the VPC to an AWS Wavelength Zone and run the game servers in a Wavelength subnet with a carrier gateway."
        fr: "Étendre le VPC à une AWS Wavelength Zone et exécuter les serveurs de jeu dans un sous-réseau Wavelength avec une passerelle d'opérateur."
    - id: c
      text:
        en: "Place an Amazon CloudFront distribution in front of game servers that run in the parent Region."
        fr: "Placer une distribution Amazon CloudFront devant des serveurs de jeu exécutés dans la Région parente."
    - id: d
      text:
        en: "Use AWS Global Accelerator to route players to game servers that run in the parent Region."
        fr: "Utiliser AWS Global Accelerator pour acheminer les joueurs vers des serveurs de jeu exécutés dans la Région parente."
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Wavelength places AWS compute at the edge of carrier 5G networks. The company extends its VPC to a Wavelength Zone, runs EC2 instances in a Wavelength subnet, and a carrier gateway accepts traffic from the carrier network, so mobile traffic reaches the servers without leaving that network."
    fr: "AWS Wavelength place de la capacité de calcul AWS en périphérie des réseaux 5G des opérateurs. L'entreprise étend son VPC à une Wavelength Zone et exécute des instances EC2 dans un sous-réseau Wavelength ; une passerelle d'opérateur accepte le trafic du réseau de l'opérateur, si bien que le trafic mobile atteint les serveurs sans quitter ce réseau."
  options:
    a:
      en: "A Local Zone is an AWS facility in a metropolitan area. Traffic from the 5G devices must leave the carrier network to reach it."
      fr: "Une Local Zone est une installation AWS située dans une zone métropolitaine. Le trafic des appareils 5G doit quitter le réseau de l'opérateur pour l'atteindre."
    c:
      en: "CloudFront caches HTTP content at edge locations; the game servers would still run in the Region, outside the carrier network."
      fr: "CloudFront met en cache du contenu HTTP dans des emplacements périphériques ; les serveurs de jeu resteraient dans la Région, hors du réseau de l'opérateur."
    d:
      en: "Global Accelerator improves the path to a Region over the AWS network, but the servers stay in the Region and traffic leaves the carrier network."
      fr: "Global Accelerator améliore le chemin vers une Région via le réseau AWS, mais les serveurs restent dans la Région et le trafic quitte le réseau de l'opérateur."
references:
  - title: "What is AWS Wavelength?"
    url: https://docs.aws.amazon.com/wavelength/latest/developerguide/what-is-wavelength.html
