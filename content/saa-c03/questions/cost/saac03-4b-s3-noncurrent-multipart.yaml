id: saac03-4b-s3-noncurrent-multipart
objective: "4.1.20"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company has S3 Versioning enabled on a bucket that stores video project files. Editors overwrite the files many times each day, and the storage costs of the bucket keep growing. An S3 Storage Lens report shows that most of the storage is used by noncurrent object versions and by parts of multipart uploads that were never completed. The company must be able to recover the previous version of a file for 30 days after it is overwritten.

    Which combination of actions will reduce storage costs while meeting these requirements? (Choose two.)
  fr: |
    Une entreprise de médias a activé S3 Versioning sur un compartiment qui stocke des fichiers de projets vidéo. Les monteurs écrasent les fichiers de nombreuses fois par jour, et les coûts de stockage du compartiment ne cessent d'augmenter. Un rapport S3 Storage Lens montre que la majeure partie du stockage est occupée par des versions d'objets non actuelles et par des parties de chargements partitionnés (multipart uploads) qui n'ont jamais été terminés. L'entreprise doit pouvoir récupérer la version précédente d'un fichier pendant 30 jours après son écrasement.

    Quelle combinaison d'actions permet de réduire les coûts de stockage tout en répondant à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Add an S3 Lifecycle rule that permanently deletes noncurrent versions 30 days after they become noncurrent."
        fr: "Ajouter une règle S3 Lifecycle qui supprime définitivement les versions non actuelles 30 jours après qu'elles sont devenues non actuelles."
    - id: b
      text:
        en: "Suspend S3 Versioning on the bucket so that overwrites stop creating noncurrent versions."
        fr: "Suspendre S3 Versioning sur le compartiment pour que les écrasements ne créent plus de versions non actuelles."
    - id: c
      text:
        en: "Add an S3 Lifecycle rule that transitions current versions to S3 Glacier Deep Archive after 30 days."
        fr: "Ajouter une règle S3 Lifecycle qui fait passer les versions actuelles en S3 Glacier Deep Archive après 30 jours."
    - id: d
      text:
        en: "Add an S3 Lifecycle rule that aborts incomplete multipart uploads 7 days after they are initiated."
        fr: "Ajouter une règle S3 Lifecycle qui annule les chargements partitionnés incomplets 7 jours après leur lancement."
    - id: e
      text:
        en: "Enable S3 Object Lock in compliance mode with a default retention period of 30 days."
        fr: "Activer S3 Object Lock en mode conformité avec une période de conservation par défaut de 30 jours."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "A NoncurrentVersionExpiration action with 30 noncurrent days keeps each previous version for the required 30 days and then deletes it, which removes most of the growth. An AbortIncompleteMultipartUpload action stops abandoned uploads and deletes their stored parts, which are billed but never usable."
    fr: "Une action NoncurrentVersionExpiration avec 30 jours de non-actualité conserve chaque version précédente pendant les 30 jours exigés, puis la supprime, ce qui élimine l'essentiel de la croissance. Une action AbortIncompleteMultipartUpload arrête les chargements abandonnés et supprime leurs parties stockées, qui sont facturées sans jamais être utilisables."
  options:
    b:
      en: "Suspending versioning keeps the existing noncurrent versions and removes the ability to recover overwritten files, which breaks the 30-day recovery requirement."
      fr: "Suspendre le versioning conserve les versions non actuelles existantes et supprime la possibilité de récupérer les fichiers écrasés, ce qui ne respecte pas l'exigence de récupération de 30 jours."
    c:
      en: "Editors use the current files every day, so archiving them would add restore delays and retrieval fees. It also does nothing about noncurrent versions or incomplete uploads."
      fr: "Les monteurs utilisent les fichiers actuels chaque jour : les archiver ajouterait des délais de restauration et des frais de récupération. Cela ne traite pas non plus les versions non actuelles ni les chargements incomplets."
    e:
      en: "Object Lock prevents versions from being deleted during the retention period. It protects data but does not reduce storage."
      fr: "Object Lock empêche la suppression des versions pendant la période de conservation. Il protège les données mais ne réduit pas le stockage."
references:
  - title: "Examples of S3 Lifecycle configurations"
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-configuration-examples.html
