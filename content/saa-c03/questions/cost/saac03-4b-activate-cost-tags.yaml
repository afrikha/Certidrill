id: saac03-4b-activate-cost-tags
objective: "4.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Organizations with consolidated billing. Developers in several member accounts tag every Amazon EC2 instance with a Project tag key. The finance team signs in to the management account but cannot group EC2 costs by Project in AWS Cost Explorer.

    Which action will allow the finance team to view the costs by project?
  fr: |
    Une entreprise utilise AWS Organizations avec la facturation consolidée. Dans plusieurs comptes membres, les développeurs ajoutent à chaque instance Amazon EC2 une balise dont la clé est Project. L'équipe financière se connecte au compte de gestion, mais ne parvient pas à regrouper les coûts EC2 par Project dans AWS Cost Explorer.

    Quelle action permettra à l'équipe financière de consulter les coûts par projet ?
body:
  options:
    - id: a
      text:
        en: "Activate the Project tag key as a user-defined cost allocation tag in the Billing and Cost Management console of the management account."
        fr: "Activer la clé de balise Project comme balise de répartition des coûts définie par l'utilisateur dans la console Billing and Cost Management du compte de gestion."
    - id: b
      text:
        en: "Activate the Project tag key as a user-defined cost allocation tag in the Billing and Cost Management console of each member account."
        fr: "Activer la clé de balise Project comme balise de répartition des coûts définie par l'utilisateur dans la console Billing and Cost Management de chaque compte membre."
    - id: c
      text:
        en: "Create an AWS Config rule in each member account that requires the Project tag on every EC2 instance."
        fr: "Créer dans chaque compte membre une règle AWS Config qui exige la balise Project sur chaque instance EC2."
    - id: d
      text:
        en: "Create a tag-based resource group in AWS Resource Groups for each project in each member account."
        fr: "Créer dans chaque compte membre un groupe de ressources basé sur les balises dans AWS Resource Groups pour chaque projet."
answer: { optionId: a }
explanation:
  correct:
    en: "Resource tags appear in Cost Explorer and cost reports only after their keys are activated as cost allocation tags. In an organization, only the management account has access to the cost allocation tags page, so the finance team must activate the Project key there. Activation can take up to 24 hours to take effect."
    fr: "Les balises des ressources n'apparaissent dans Cost Explorer et les rapports de coûts qu'une fois leurs clés activées comme balises de répartition des coûts. Dans une organisation, seul le compte de gestion a accès à la page des balises de répartition des coûts : l'équipe financière doit donc y activer la clé Project. L'activation peut prendre jusqu'à 24 heures."
  options:
    b:
      en: "Member accounts of an organization do not have access to the cost allocation tags manager; only the management account does."
      fr: "Les comptes membres d'une organisation n'ont pas accès au gestionnaire des balises de répartition des coûts ; seul le compte de gestion y a accès."
    c:
      en: "The instances are already tagged. Enforcing tags does not make them available as a billing dimension."
      fr: "Les instances sont déjà balisées. Imposer les balises ne les rend pas disponibles comme dimension de facturation."
    d:
      en: "Resource groups organize resources for management tasks; they do not add a dimension to Cost Explorer."
      fr: "Les groupes de ressources organisent les ressources pour les tâches de gestion ; ils n'ajoutent pas de dimension dans Cost Explorer."
references:
  - title: "Organizing and tracking costs using AWS cost allocation tags"
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
  - title: "Activating user-defined cost allocation tags"
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/activating-tags.html
