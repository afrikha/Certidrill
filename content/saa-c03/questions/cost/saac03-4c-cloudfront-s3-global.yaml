id: saac03-4c-cloudfront-s3-global
objective: "4.4.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company serves product images and videos directly from an Amazon S3 bucket in one Region to customers on several continents. Customers far from the Region report slow downloads, and data transfer out from Amazon S3 is a large part of the bill. The company wants to improve download speed and lower delivery costs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise diffuse des images et des vidéos de produits directement depuis un compartiment Amazon S3 d'une Région vers des clients sur plusieurs continents. Les clients éloignés de la Région signalent des téléchargements lents, et le transfert de données sortant d'Amazon S3 représente une grande partie de la facture. L'entreprise veut améliorer la vitesse de téléchargement et réduire les coûts de diffusion.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Enable S3 Transfer Acceleration on the bucket and give customers the accelerated endpoint URLs.", fr: "Activer S3 Transfer Acceleration sur le compartiment et fournir aux clients les URL du point de terminaison accéléré." }
    - id: b
      text: { en: "Replicate the bucket to a bucket in each continent with S3 Cross-Region Replication and use Route 53 latency-based routing.", fr: "Répliquer le compartiment vers un compartiment sur chaque continent avec S3 Cross-Region Replication et utiliser le routage basé sur la latence de Route 53." }
    - id: c
      text: { en: "Create an AWS Global Accelerator accelerator with the bucket as its endpoint.", fr: "Créer un accélérateur AWS Global Accelerator avec le compartiment comme point de terminaison." }
    - id: d
      text: { en: "Create an Amazon CloudFront distribution with the bucket as its origin and an origin access control, and serve the content through CloudFront.", fr: "Créer une distribution Amazon CloudFront avec le compartiment comme origine et un contrôle d'accès à l'origine, et diffuser le contenu via CloudFront." }
answer: { optionId: d }
explanation:
  correct:
    en: CloudFront caches the objects at edge locations close to the customers, so repeated downloads are served from the cache instead of the Region. Data transferred out from Amazon S3 to CloudFront is free, and an origin access control keeps the bucket private behind the distribution.
    fr: CloudFront met les objets en cache dans des emplacements périphériques proches des clients ; les téléchargements répétés sont donc servis depuis le cache plutôt que depuis la Région. Le transfert de données sortant d'Amazon S3 vers CloudFront est gratuit, et un contrôle d'accès à l'origine garde le compartiment privé derrière la distribution.
  options:
    a:
      en: Transfer Acceleration speeds up transfers but adds a per-GB fee on top of S3 data transfer out, and it does not cache content, so costs rise.
      fr: Transfer Acceleration accélère les transferts mais ajoute un coût par Go au transfert sortant de S3 et ne met rien en cache ; les coûts augmentent donc.
    b:
      en: Several replicated buckets multiply storage and replication transfer costs, and each download is still billed as S3 data transfer out.
      fr: Plusieurs compartiments répliqués multiplient les coûts de stockage et de transfert de réplication, et chaque téléchargement reste facturé comme transfert sortant de S3.
    c:
      en: Global Accelerator does not cache content and does not support an S3 bucket as an endpoint; its endpoints are load balancers, EC2 instances and Elastic IP addresses.
      fr: Global Accelerator ne met pas de contenu en cache et ne prend pas en charge un compartiment S3 comme point de terminaison ; ses points de terminaison sont des équilibreurs de charge, des instances EC2 et des adresses IP Elastic.
references:
  - title: Amazon S3 pricing
    url: https://aws.amazon.com/s3/pricing/
  - title: Increase the proportion of requests that are served directly from the CloudFront caches (cache hit ratio)
    url: https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/cache-hit-ratio.html
