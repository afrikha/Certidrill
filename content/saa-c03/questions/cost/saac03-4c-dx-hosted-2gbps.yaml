id: saac03-4c-dx-hosted-2gbps
objective: "4.4.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company needs a private AWS Direct Connect link between its data center and AWS. Measurements show a steady 1.5 Gbps of traffic, with modest growth expected over the next three years. The company's colocation facility is served by an AWS Direct Connect Partner that offers hosted connections from 50 Mbps to 10 Gbps. The company wants the MOST cost-effective connection that provides enough bandwidth.

    Which connection should the company order?
  fr: |
    Une entreprise a besoin d'une liaison AWS Direct Connect privée entre son centre de données et AWS. Les mesures montrent un trafic constant de 1,5 Gbit/s, avec une croissance modérée prévue sur les trois prochaines années. Le site d'hébergement de l'entreprise est desservi par un partenaire AWS Direct Connect qui propose des connexions hébergées de 50 Mbit/s à 10 Gbit/s. L'entreprise veut la connexion la PLUS rentable qui offre assez de bande passante.

    Quelle connexion l'entreprise doit-elle commander ?
body:
  options:
    - id: a
      text: { en: "A 1 Gbps Direct Connect dedicated connection", fr: "Une connexion dédiée Direct Connect de 1 Gbit/s" }
    - id: b
      text: { en: "A 5 Gbps Direct Connect hosted connection from the Direct Connect Partner", fr: "Une connexion hébergée Direct Connect de 5 Gbit/s auprès du partenaire Direct Connect" }
    - id: c
      text: { en: "A 10 Gbps Direct Connect dedicated connection", fr: "Une connexion dédiée Direct Connect de 10 Gbit/s" }
    - id: d
      text: { en: "A 2 Gbps Direct Connect hosted connection from the Direct Connect Partner", fr: "Une connexion hébergée Direct Connect de 2 Gbit/s auprès du partenaire Direct Connect" }
answer: { optionId: d }
explanation:
  correct:
    en: Hosted connections are provisioned by Direct Connect Partners at speeds from 50 Mbps to 25 Gbps, including 2 Gbps, so the company pays port hours only for the capacity it needs. Some Partners can also change the speed of a hosted connection later without recreating it.
    fr: Les connexions hébergées sont fournies par des partenaires Direct Connect à des débits de 50 Mbit/s à 25 Gbit/s, dont 2 Gbit/s ; l'entreprise ne paie donc des heures de port que pour la capacité dont elle a besoin. Certains partenaires peuvent aussi modifier plus tard le débit d'une connexion hébergée sans la recréer.
  options:
    a:
      en: 1 Gbps is below the measured 1.5 Gbps, and traffic above the port speed cannot get through.
      fr: 1 Gbit/s est inférieur aux 1,5 Gbit/s mesurés, et le trafic au-delà du débit du port ne peut pas passer.
    b:
      en: A 5 Gbps hosted connection works but costs more per port hour for capacity that the company does not need; modest growth fits within 2 Gbps, and some Partners can raise the speed later.
      fr: Une connexion hébergée de 5 Gbit/s fonctionne mais coûte plus cher par heure de port pour une capacité dont l'entreprise n'a pas besoin ; une croissance modérée tient dans 2 Gbit/s, et certains partenaires peuvent augmenter le débit plus tard.
    c:
      en: A 10 Gbps port provides far more capacity than needed and has a much higher port-hour charge; dedicated ports come only in 1, 10, 100 and 400 Gbps.
      fr: Un port de 10 Gbit/s fournit bien plus de capacité que nécessaire et a un coût horaire de port beaucoup plus élevé ; les ports dédiés n'existent qu'à 1, 10, 100 et 400 Gbit/s.
references:
  - title: Hosted Direct Connect connections
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/hosted_connection.html
  - title: Dedicated Direct Connect connections
    url: https://docs.aws.amazon.com/directconnect/latest/UserGuide/dedicated_connection.html
