id: saac03-4b-cur-hourly-athena
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company's FinOps team must build a chargeback model that joins AWS billing data with an internal asset inventory. The team needs hourly cost line items that include the ID of each Amazon EC2 instance, and it wants to query the data with SQL without managing any servers.

    Which solution will meet these requirements?
  fr: |
    L'équipe FinOps d'une entreprise doit créer un modèle de refacturation qui croise les données de facturation AWS avec un inventaire interne des ressources. L'équipe a besoin de lignes de coûts horaires qui incluent l'ID de chaque instance Amazon EC2, et souhaite interroger les données en SQL sans gérer de serveurs.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use AWS Cost Explorer with daily granularity, group the costs by linked account, and download the results as CSV files."
        fr: "Utiliser AWS Cost Explorer avec une granularité quotidienne, regrouper les coûts par compte lié et télécharger les résultats au format CSV."
    - id: b
      text:
        en: "Create a CUR 2.0 export with hourly granularity and resource IDs, deliver it to Amazon S3, and query it with Amazon Athena."
        fr: "Créer une exportation CUR 2.0 avec une granularité horaire et les ID de ressources, la livrer dans Amazon S3 et l'interroger avec Amazon Athena."
    - id: c
      text:
        en: "Create a cost budget for each EC2 instance in AWS Budgets and send the budget notifications to an Amazon SNS topic."
        fr: "Créer un budget de coûts pour chaque instance EC2 dans AWS Budgets et envoyer les notifications de budget vers une rubrique Amazon SNS."
    - id: d
      text:
        en: "Enable AWS Cost Anomaly Detection for all services and query the detected anomalies with Amazon Athena."
        fr: "Activer AWS Cost Anomaly Detection pour tous les services et interroger les anomalies détectées avec Amazon Athena."
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Data Exports can create a Cost and Usage Report 2.0 export with hourly granularity and resource-level line items that include the resource ID, delivered to Amazon S3. Amazon Athena is a serverless service that queries the CUR data in S3 with standard SQL, so the team can join it with its inventory without running servers."
    fr: "AWS Data Exports peut créer une exportation Cost and Usage Report 2.0 avec une granularité horaire et des lignes au niveau des ressources qui incluent l'ID de ressource, livrée dans Amazon S3. Amazon Athena est un service sans serveur qui interroge les données CUR dans S3 en SQL standard : l'équipe peut les croiser avec son inventaire sans exécuter de serveurs."
  options:
    a:
      en: "Daily Cost Explorer results grouped by account contain neither hourly line items nor instance IDs, and CSV downloads are not a SQL query solution."
      fr: "Les résultats quotidiens de Cost Explorer regroupés par compte ne contiennent ni lignes horaires ni ID d'instances, et des téléchargements CSV ne constituent pas une solution d'interrogation SQL."
    c:
      en: "Budgets track spending against thresholds and send alerts; they do not provide line-item billing data."
      fr: "Les budgets suivent les dépenses par rapport à des seuils et envoient des alertes ; ils ne fournissent pas de données de facturation ligne par ligne."
    d:
      en: "Cost Anomaly Detection reports unusual spending; it does not provide the complete hourly billing data needed for chargeback."
      fr: "Cost Anomaly Detection signale des dépenses inhabituelles ; il ne fournit pas les données de facturation horaires complètes nécessaires à la refacturation."
references:
  - title: "Cost and Usage Report (CUR) 2.0"
    url: https://docs.aws.amazon.com/cur/latest/userguide/table-dictionary-cur2.html
  - title: "Querying Cost and Usage Reports using Amazon Athena"
    url: https://docs.aws.amazon.com/cur/latest/userguide/cur-query-athena.html
