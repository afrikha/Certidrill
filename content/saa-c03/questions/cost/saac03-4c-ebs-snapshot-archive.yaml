id: saac03-4c-ebs-snapshot-archive
objective: "4.3.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company must keep a monthly snapshot of the Amazon EBS volumes of its accounting servers for 7 years for compliance. The snapshots are restored very rarely, and a restore that takes a few days is acceptable. The company currently keeps the monthly snapshots in the standard snapshot tier. The company wants to reduce storage costs with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise doit conserver pendant 7 ans, pour des raisons de conformité, un instantané mensuel des volumes Amazon EBS de ses serveurs comptables. Les instantanés sont très rarement restaurés, et une restauration qui prend quelques jours est acceptable. L'entreprise conserve actuellement les instantanés mensuels dans le niveau d'instantané standard. Elle veut réduire les coûts de stockage avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon Data Lifecycle Manager policy with a monthly schedule and an archive rule that moves each snapshot to the EBS Snapshots Archive tier.", fr: "Créer une politique Amazon Data Lifecycle Manager avec une planification mensuelle et une règle d'archivage qui déplace chaque instantané vers le niveau EBS Snapshots Archive." }
    - id: b
      text: { en: "Create an S3 Lifecycle rule that transitions the EBS snapshots to S3 Glacier Deep Archive after 30 days.", fr: "Créer une règle S3 Lifecycle qui fait passer les instantanés EBS vers S3 Glacier Deep Archive après 30 jours." }
    - id: c
      text: { en: "Create an Amazon Data Lifecycle Manager policy with a daily schedule that keeps the snapshots in the standard tier for 7 years.", fr: "Créer une politique Amazon Data Lifecycle Manager avec une planification quotidienne qui conserve les instantanés dans le niveau standard pendant 7 ans." }
    - id: d
      text: { en: "Enable fast snapshot restore on the monthly snapshots and delete the older incremental snapshots.", fr: "Activer la restauration rapide d'instantanés sur les instantanés mensuels et supprimer les anciens instantanés incrémentiels." }
answer: { optionId: a }
explanation:
  correct:
    en: The archive tier costs up to 75 percent less than the standard tier for snapshots kept 90 days or longer and rarely accessed, and monthly or yearly compliance snapshots are a documented use case. Data Lifecycle Manager can create the monthly snapshots and archive them automatically (archive rules need a schedule of at least 28 days and an archive retention of at least 90 days).
    fr: Le niveau d'archivage coûte jusqu'à 75 % de moins que le niveau standard pour des instantanés conservés 90 jours ou plus et rarement consultés, et les instantanés de conformité mensuels ou annuels sont un cas d'usage documenté. Data Lifecycle Manager peut créer les instantanés mensuels et les archiver automatiquement (les règles d'archivage exigent une planification d'au moins 28 jours et une conservation en archive d'au moins 90 jours).
  options:
    b:
      en: EBS snapshots are not objects in a bucket you own, so S3 Lifecycle rules cannot transition them to an S3 storage class.
      fr: Les instantanés EBS ne sont pas des objets d'un compartiment S3 qui vous appartient ; les règles S3 Lifecycle ne peuvent donc pas les faire passer vers une classe de stockage S3.
    c:
      en: Daily snapshots kept in the standard tier for 7 years increase the cost instead of reducing it.
      fr: Des instantanés quotidiens conservés 7 ans dans le niveau standard augmentent le coût au lieu de le réduire.
    d:
      en: Fast snapshot restore is billed per snapshot and per Availability Zone to speed up volume creation; it raises cost and is not needed for rare restores.
      fr: La restauration rapide d'instantanés est facturée par instantané et par zone de disponibilité pour accélérer la création de volumes ; elle augmente le coût et n'est pas utile pour des restaurations rares.
references:
  - title: Archive Amazon EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-archive.html
  - title: Create Amazon Data Lifecycle Manager custom policy for EBS snapshots
    url: https://docs.aws.amazon.com/ebs/latest/userguide/snapshot-ami-policy.html
