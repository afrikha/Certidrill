id: saac03-4a-fsx-ontap-multiprotocol
objective: "4.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A media company is moving an on-premises NetApp storage array to AWS. Linux render nodes must keep accessing the project files over NFS, and Windows editing workstations must keep accessing the same files over SMB. About 70% of the data is rarely accessed after a project ends, but it must stay in the same folders and remain readable without a restore step. The company wants a fully managed service that keeps the cold data on lower-cost storage automatically.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de médias migre une baie de stockage NetApp sur site vers AWS. Des nœuds de rendu Linux doivent continuer à accéder aux fichiers des projets en NFS, et des stations de montage Windows doivent continuer à accéder aux mêmes fichiers en SMB. Environ 70 % des données sont rarement consultées une fois le projet terminé, mais elles doivent rester dans les mêmes dossiers et rester lisibles sans étape de restauration. L'entreprise veut un service entièrement géré qui place automatiquement les données froides sur un stockage moins coûteux.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Amazon FSx for Windows File Server with HDD storage, mapped by the Linux render nodes over SMB", fr: "Amazon FSx for Windows File Server avec stockage HDD, monté par les nœuds de rendu Linux en SMB" }
    - id: b
      text: { en: "Amazon EFS with lifecycle management to EFS Infrequent Access and EFS Archive", fr: "Amazon EFS avec gestion du cycle de vie vers EFS Infrequent Access et EFS Archive" }
    - id: c
      text: { en: "Amazon FSx for NetApp ONTAP with automatic tiering of cold data to the capacity pool tier", fr: "Amazon FSx for NetApp ONTAP avec hiérarchisation automatique des données froides vers le niveau capacity pool" }
    - id: d
      text: { en: "Amazon S3 File Gateway on Amazon EC2 with an S3 Lifecycle rule to S3 Glacier Deep Archive", fr: "Amazon S3 File Gateway sur Amazon EC2 avec une règle de cycle de vie S3 vers S3 Glacier Deep Archive" }
answer: { optionId: c }
explanation:
  correct:
    en: "FSx for NetApp ONTAP gives Linux, Windows and macOS clients access to the same data over NFS and SMB. Its automatic data tiering moves infrequently accessed data from SSD to a lower-cost, elastic capacity pool tier while the files stay in place and readable, and the service is fully managed."
    fr: "FSx for NetApp ONTAP donne aux clients Linux, Windows et macOS l'accès aux mêmes données en NFS et en SMB. Sa hiérarchisation automatique déplace les données peu consultées du SSD vers un niveau capacity pool élastique et moins coûteux, les fichiers restant en place et lisibles, et le service est entièrement géré."
  options:
    a:
      en: "FSx for Windows File Server serves SMB only, so the render nodes could not keep using NFS, and it has no automatic tiering of cold data."
      fr: "FSx for Windows File Server ne sert que le SMB : les nœuds de rendu ne pourraient plus utiliser NFS, et il n'offre pas de hiérarchisation automatique des données froides."
    b:
      en: "Amazon EFS tiers data automatically but serves NFS only; the Windows workstations could not access the files over SMB."
      fr: "Amazon EFS hiérarchise les données automatiquement mais ne sert que le NFS ; les stations Windows ne pourraient pas accéder aux fichiers en SMB."
    d:
      en: "Objects in S3 Glacier Deep Archive must be restored before they can be read, which breaks the no-restore requirement, and a gateway on EC2 is not a fully managed file service."
      fr: "Les objets de S3 Glacier Deep Archive doivent être restaurés avant lecture, ce qui enfreint l'exigence d'absence de restauration, et une passerelle sur EC2 n'est pas un service de fichiers entièrement géré."
references:
  - title: What is Amazon FSx for NetApp ONTAP?
    url: https://docs.aws.amazon.com/fsx/latest/ONTAPGuide/what-is-fsx-ontap.html
