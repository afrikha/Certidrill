id: saac03-4a-multipart-abort
objective: "4.1.12"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A video production company uploads raw footage files of 20 GB to 80 GB from its studio to an Amazon S3 bucket in the nearest Region over a 10 Gbps connection. Uploads are slow because each file is sent as a single stream, and when the connection drops, the whole file is sent again. The company also pays storage charges for uploads that were started but never completed. The company wants faster, more resilient uploads and wants to stop paying for abandoned uploads, at the lowest cost.

    Which combination of actions will meet these requirements? (Choose two.)
  fr: |
    Une société de production vidéo charge des fichiers de rushes de 20 Go à 80 Go depuis son studio vers un compartiment Amazon S3 de la Région la plus proche, via une connexion de 10 Gbit/s. Les chargements sont lents car chaque fichier est envoyé en un seul flux, et lorsque la connexion tombe, tout le fichier est renvoyé. L'entreprise paie aussi des frais de stockage pour des chargements commencés mais jamais terminés. Elle veut des chargements plus rapides et plus résilients, et ne plus payer pour les chargements abandonnés, au coût le plus bas.

    Quelle combinaison d'actions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable S3 Transfer Acceleration on the bucket and upload through the accelerate endpoint.", fr: "Activer S3 Transfer Acceleration sur le compartiment et charger via le point de terminaison accéléré." } }
    - { id: b, text: { en: "Add an S3 Lifecycle rule that expires objects 7 days after creation.", fr: "Ajouter une règle de cycle de vie S3 qui fait expirer les objets 7 jours après leur création." } }
    - { id: c, text: { en: "Use multipart upload with parts sent in parallel, so that only failed parts are sent again.", fr: "Utiliser le chargement partitionné avec des parties envoyées en parallèle, afin de ne renvoyer que les parties en échec." } }
    - { id: d, text: { en: "Run an S3 Batch Operations copy job on each file after it is uploaded.", fr: "Exécuter une tâche de copie S3 Batch Operations sur chaque fichier après son chargement." } }
    - { id: e, text: { en: "Add an S3 Lifecycle rule with the AbortIncompleteMultipartUpload action.", fr: "Ajouter une règle de cycle de vie S3 avec l'action AbortIncompleteMultipartUpload." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: "AWS recommends multipart upload for objects of 100 MB or more: parts are uploaded in parallel for higher throughput, and a failed part is retransmitted alone. Parts of an incomplete multipart upload are billed until the upload is completed or stopped, so a lifecycle rule with AbortIncompleteMultipartUpload removes abandoned uploads automatically."
    fr: "AWS recommande le chargement partitionné pour les objets de 100 Mo ou plus : les parties sont chargées en parallèle pour un meilleur débit, et une partie en échec est renvoyée seule. Les parties d'un chargement partitionné incomplet sont facturées jusqu'à ce que le chargement soit terminé ou arrêté : une règle de cycle de vie avec AbortIncompleteMultipartUpload supprime automatiquement les chargements abandonnés."
  options:
    a:
      en: "Transfer Acceleration helps long-distance transfers and adds a per-GB charge; the studio already uploads to the nearest Region, and single-stream uploads would remain."
      fr: "Transfer Acceleration aide les transferts longue distance et ajoute des frais par Go ; le studio charge déjà vers la Région la plus proche, et les chargements en un seul flux resteraient."
    b:
      en: "Expiration deletes completed objects, including the footage, and does not remove incomplete multipart uploads."
      fr: "L'expiration supprime les objets terminés, y compris les rushes, et ne supprime pas les chargements partitionnés incomplets."
    d:
      en: "Batch Operations runs bulk operations on objects that already exist; it does not speed up or protect the uploads, and each job is billed."
      fr: "Batch Operations exécute des opérations en masse sur des objets existants ; il n'accélère ni ne protège les chargements, et chaque tâche est facturée."
references:
  - title: Uploading and copying objects using multipart upload in Amazon S3
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/mpuoverview.html
