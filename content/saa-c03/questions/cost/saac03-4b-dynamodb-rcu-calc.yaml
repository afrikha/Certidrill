id: saac03-4b-dynamodb-rcu-calc
objective: "4.3.5"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A company is designing an Amazon DynamoDB table in provisioned capacity mode. Each item is 10 KB. The application will perform 50 eventually consistent reads per second at a steady rate and does not use transactions.

    How many read capacity units (RCUs) must the company provision to support this read rate without overprovisioning?
  fr: |
    Une entreprise conçoit une table Amazon DynamoDB en mode de capacité provisionnée. Chaque élément fait 10 Ko. L'application effectuera 50 lectures à cohérence éventuelle par seconde à un rythme constant et n'utilise pas de transactions.

    Combien d'unités de capacité de lecture (RCU) l'entreprise doit-elle provisionner pour supporter ce rythme de lecture sans surprovisionnement ?
body:
  options:
    - id: a
      text:
        en: "63"
        fr: "63"
    - id: b
      text:
        en: "75"
        fr: "75"
    - id: c
      text:
        en: "125"
        fr: "125"
    - id: d
      text:
        en: "150"
        fr: "150"
answer: { optionId: b }
explanation:
  correct:
    en: "Read size is rounded up to the next 4 KB, so a 10 KB item counts as 3 units of 4 KB. A strongly consistent read of it would cost 3 RCUs, and an eventually consistent read costs half, 1.5 RCUs. 50 reads per second x 1.5 = 75 RCUs."
    fr: "La taille lue est arrondie au multiple de 4 Ko supérieur : un élément de 10 Ko compte pour 3 unités de 4 Ko. Une lecture fortement cohérente coûterait 3 RCU, et une lecture à cohérence éventuelle en coûte la moitié, soit 1,5 RCU. 50 lectures par seconde x 1,5 = 75 RCU."
  options:
    a:
      en: "63 comes from using the exact size (10 / 4 = 2.5) without rounding up to whole 4 KB units, then halving."
      fr: "63 vient de l'utilisation de la taille exacte (10 / 4 = 2,5) sans arrondi à des unités entières de 4 Ko, puis de la division par deux."
    c:
      en: "125 comes from 2.5 RCUs per read without rounding and without halving for eventual consistency."
      fr: "125 vient de 2,5 RCU par lecture, sans arrondi et sans division par deux pour la cohérence éventuelle."
    d:
      en: "150 RCUs would be needed for strongly consistent reads; eventually consistent reads cost half."
      fr: "150 RCU seraient nécessaires pour des lectures fortement cohérentes ; les lectures à cohérence éventuelle coûtent moitié moins."
references:
  - title: "DynamoDB provisioned capacity mode"
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/provisioned-capacity-mode.html
