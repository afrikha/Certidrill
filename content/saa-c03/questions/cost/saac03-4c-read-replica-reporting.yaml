id: saac03-4c-read-replica-reporting
objective: "4.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs its order application on an Amazon RDS for MySQL Multi-AZ DB instance deployment. Every night, analysts run long reporting queries that slow down the application. The queries can tolerate data that is a few seconds old. The company wants the MOST cost-effective solution that does not require a larger DB instance class.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute son application de commandes sur un déploiement d'instance de base de données Multi-AZ Amazon RDS for MySQL. Chaque nuit, des analystes lancent de longues requêtes de reporting qui ralentissent l'application. Les requêtes tolèrent des données vieilles de quelques secondes. L'entreprise veut la solution la PLUS rentable qui n'exige pas une classe d'instance de base de données plus grande.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Point the reporting queries at the standby instance of the Multi-AZ deployment.", fr: "Diriger les requêtes de reporting vers l'instance de secours du déploiement Multi-AZ." }
    - id: b
      text: { en: "Create a read replica of the DB instance and point the reporting queries at the read replica endpoint.", fr: "Créer un réplica en lecture de l'instance de base de données et diriger les requêtes de reporting vers le point de terminaison du réplica en lecture." }
    - id: c
      text: { en: "Restore a new DB instance from the latest snapshot every night and run the reports on it.", fr: "Restaurer chaque nuit une nouvelle instance de base de données à partir du dernier instantané et y exécuter les rapports." }
    - id: d
      text: { en: "Add an Amazon ElastiCache cluster in front of the database to cache the reporting queries.", fr: "Ajouter un cluster Amazon ElastiCache devant la base de données pour mettre en cache les requêtes de reporting." }
answer: { optionId: b }
explanation:
  correct:
    en: A read replica receives changes asynchronously from the primary and can serve read traffic, which is the documented way to move reporting queries off the production DB instance. Its slight lag is acceptable here.
    fr: Un réplica en lecture reçoit les modifications de l'instance principale de manière asynchrone et peut servir le trafic de lecture ; c'est la méthode documentée pour déplacer les requêtes de reporting hors de l'instance de production. Son léger décalage est acceptable ici.
  options:
    a:
      en: In a Multi-AZ DB instance deployment, the standby is replicated synchronously for high availability and cannot serve read traffic.
      fr: Dans un déploiement d'instance de base de données Multi-AZ, l'instance de secours est répliquée de manière synchrone pour la haute disponibilité et ne peut pas servir le trafic de lecture.
    c:
      en: A nightly restore takes time, serves data that can be up to a day old and needs automation to create and delete the instance; a read replica is simpler and current.
      fr: Une restauration nocturne prend du temps, fournit des données pouvant dater d'un jour et demande une automatisation pour créer et supprimer l'instance ; un réplica en lecture est plus simple et à jour.
    d:
      en: Long ad hoc reporting queries scan large data sets and rarely repeat, so a cache does not remove their load and adds a cluster to pay for.
      fr: De longues requêtes de reporting ad hoc parcourent de grands volumes et se répètent rarement ; un cache ne supprime donc pas leur charge et ajoute un cluster à payer.
references:
  - title: Working with DB instance read replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html
