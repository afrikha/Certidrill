id: saac03-4a-small-objects-standard
objective: "4.1.9"
type: single
difficulty: 3
status: draft
stem:
  en: |
    An IoT analytics company stores 800 million JSON objects in S3 Standard. The objects average 20 KB. Each object is read frequently during its first month and then only occasionally, and every read must return in milliseconds. A solutions architect must decide where to keep objects that are older than 30 days.

    Which option is the MOST cost-effective for these objects?
  fr: |
    Une entreprise d'analyse IoT stocke 800 millions d'objets JSON dans S3 Standard. Les objets font en moyenne 20 Ko. Chaque objet est lu fréquemment pendant son premier mois, puis seulement de temps en temps, et chaque lecture doit aboutir en quelques millisecondes. Un architecte de solutions doit décider où conserver les objets de plus de 30 jours.

    Quelle option est la PLUS rentable pour ces objets ?
body:
  options:
    - id: a
      text: { en: "Transition them to S3 Standard-IA with a lifecycle rule that allows objects smaller than 128 KB.", fr: "Les faire passer à S3 Standard-IA avec une règle de cycle de vie qui autorise les objets de moins de 128 Ko." }
    - id: b
      text: { en: "Transition them to S3 Glacier Instant Retrieval with a lifecycle rule that allows objects smaller than 128 KB.", fr: "Les faire passer à S3 Glacier Instant Retrieval avec une règle de cycle de vie qui autorise les objets de moins de 128 Ko." }
    - id: c
      text: { en: "Transition them to S3 Glacier Flexible Retrieval with a lifecycle rule that allows objects smaller than 128 KB.", fr: "Les faire passer à S3 Glacier Flexible Retrieval avec une règle de cycle de vie qui autorise les objets de moins de 128 Ko." }
    - id: d
      text: { en: "Keep them in S3 Standard and do not add a lifecycle transition rule.", fr: "Les conserver dans S3 Standard sans ajouter de règle de transition de cycle de vie." }
answer: { optionId: d }
explanation:
  correct:
    en: "S3 Standard-IA and S3 Glacier Instant Retrieval bill a minimum object size of 128 KB, so each 20 KB object would be billed more than six times its size, which cancels the lower per-GB price. Each transition is also a billed request, multiplied here by 800 million objects. For small objects that need millisecond reads, staying in S3 Standard is the cheapest choice."
    fr: "S3 Standard-IA et S3 Glacier Instant Retrieval facturent une taille d'objet minimale de 128 Ko : chaque objet de 20 Ko serait facturé plus de six fois sa taille, ce qui annule le prix par Go plus bas. Chaque transition est en outre une requête facturée, multipliée ici par 800 millions d'objets. Pour de petits objets qui exigent des lectures en millisecondes, rester dans S3 Standard est le choix le moins cher."
  options:
    a:
      en: "Billing at the 128 KB minimum size, plus per-GB retrieval fees and 800 million transition requests, makes Standard-IA cost more than Standard here."
      fr: "La facturation à la taille minimale de 128 Ko, les frais de récupération par Go et 800 millions de requêtes de transition rendent S3 Standard-IA plus cher que Standard ici."
    b:
      en: "Glacier Instant Retrieval also bills a 128 KB minimum object size, has a 90-day minimum duration and charges higher retrieval fees."
      fr: "S3 Glacier Instant Retrieval facture aussi une taille minimale de 128 Ko, impose une durée minimale de 90 jours et applique des frais de récupération plus élevés."
    c:
      en: "Glacier Flexible Retrieval requires a restore before reading, so it fails the millisecond requirement, and it adds 40 KB of metadata per object."
      fr: "S3 Glacier Flexible Retrieval exige une restauration avant lecture : il ne satisfait pas l'exigence de millisecondes, et ajoute 40 Ko de métadonnées par objet."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
  - title: Transitioning objects using Amazon S3 Lifecycle
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/lifecycle-transition-general-considerations.html
