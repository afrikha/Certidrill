id: saac03-4c-vpn-backup-dx
objective: "4.4.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company connects its data center to a VPC with a single 1 Gbps AWS Direct Connect dedicated connection and a private virtual interface. The company needs a backup path in case the Direct Connect connection fails. During a failure, reduced bandwidth and higher latency are acceptable for a few hours. The company wants the MOST cost-effective backup.

    Which solution will meet these requirements?
  fr: |
    Une entreprise relie son centre de données à un VPC avec une seule connexion dédiée AWS Direct Connect de 1 Gbit/s et une interface virtuelle privée. Elle a besoin d'un chemin de secours en cas de panne de la connexion Direct Connect. Pendant une panne, une bande passante réduite et une latence plus élevée sont acceptables pendant quelques heures. L'entreprise veut la solution de secours la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Order a second 1 Gbps Direct Connect dedicated connection at a different Direct Connect location.", fr: "Commander une seconde connexion dédiée Direct Connect de 1 Gbit/s dans un autre emplacement Direct Connect." }
    - id: b
      text: { en: "Add a second 1 Gbps dedicated connection to a link aggregation group (LAG) with the existing connection.", fr: "Ajouter une seconde connexion dédiée de 1 Gbit/s à un groupe d'agrégation de liens (LAG) avec la connexion existante." }
    - id: c
      text: { en: "Create an AWS Site-to-Site VPN connection over the internet to the same VPC and use BGP so that traffic fails over to the VPN.", fr: "Créer une connexion AWS Site-to-Site VPN via Internet vers le même VPC et utiliser BGP pour que le trafic bascule vers le VPN." }
    - id: d
      text: { en: "Create a public virtual interface on the existing connection to reach the VPC through public endpoints.", fr: "Créer une interface virtuelle publique sur la connexion existante pour joindre le VPC via des points de terminaison publics." }
answer: { optionId: c }
explanation:
  correct:
    en: A Site-to-Site VPN costs only connection hours and data transfer, and with a backup IPsec VPN all VPC traffic fails over to it automatically when Direct Connect fails. Lower bandwidth and internet latency during a failure are acceptable, so this is the cheapest backup path.
    fr: Une connexion Site-to-Site VPN ne coûte que des heures de connexion et du transfert de données, et avec un VPN IPsec de secours, tout le trafic du VPC bascule automatiquement vers celui-ci en cas de panne de Direct Connect. Une bande passante plus faible et la latence d'Internet sont acceptables pendant une panne ; c'est donc le chemin de secours le moins cher.
  options:
    a:
      en: A second connection at another location gives the highest resilience, but its port hours and circuit cost much more than a VPN that the company accepts.
      fr: Une seconde connexion dans un autre emplacement offre la meilleure résilience, mais ses heures de port et son circuit coûtent bien plus qu'un VPN, que l'entreprise accepte.
    b:
      en: A LAG uses connections at the same Direct Connect location, so it does not protect against a failure of that location, and it adds a second port to pay for.
      fr: Un LAG utilise des connexions du même emplacement Direct Connect ; il ne protège donc pas contre une panne de cet emplacement, et il ajoute un second port à payer.
    d:
      en: A virtual interface on the same connection fails with that connection, so it is not a backup path.
      fr: Une interface virtuelle sur la même connexion tombe en panne avec celle-ci ; ce n'est donc pas un chemin de secours.
references:
  - title: AWS Direct Connect FAQs
    url: https://aws.amazon.com/directconnect/faqs/
