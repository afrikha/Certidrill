id: saac03-4c-cross-region-replica-move
objective: "4.3.14"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance in the us-east-1 Region. To meet a data residency requirement, the database must move to the eu-west-1 Region. Writes can be stopped for only a few minutes during the cutover. The company wants the solution with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL dans la Région us-east-1. Pour répondre à une exigence de résidence des données, la base de données doit être déplacée vers la Région eu-west-1. Les écritures ne peuvent être arrêtées que quelques minutes pendant la bascule. L'entreprise veut la solution qui impose le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Take a DB snapshot, copy it to eu-west-1, restore a new DB instance from the copy and point the application to it.", fr: "Prendre un instantané de la base de données, le copier vers eu-west-1, restaurer une nouvelle instance de base de données à partir de la copie et y diriger l'application." }
    - id: b
      text: { en: "Create an AWS DMS replication instance, source and target endpoints, and a full-load and CDC task to a new DB instance in eu-west-1.", fr: "Créer une instance de réplication AWS DMS, des points de terminaison source et cible, et une tâche de chargement complet et CDC vers une nouvelle instance de base de données dans eu-west-1." }
    - id: c
      text: { en: "Create a cross-Region read replica in eu-west-1, stop writes when the replica lag is zero, promote the replica and point the application to it.", fr: "Créer un réplica en lecture entre Régions dans eu-west-1, arrêter les écritures lorsque le décalage du réplica est nul, promouvoir le réplica et y diriger l'application." }
    - id: d
      text: { en: "Modify the DB instance to a Multi-AZ deployment with the standby in eu-west-1, then force a failover to the standby.", fr: "Convertir l'instance de base de données en déploiement Multi-AZ avec l'instance de secours dans eu-west-1, puis forcer un basculement vers celle-ci." }
answer: { optionId: c }
explanation:
  correct:
    en: Migrating to another Region is a documented use of cross-Region read replicas. RDS copies the data and keeps the replica in sync with built-in asynchronous replication, so the only write outage is the short wait for zero lag plus the promotion.
    fr: La migration vers une autre Région est un usage documenté des réplicas en lecture entre Régions. RDS copie les données et maintient le réplica synchronisé grâce à la réplication asynchrone intégrée ; la seule interruption des écritures est donc la courte attente d'un décalage nul puis la promotion.
  options:
    a:
      en: Writes made after the snapshot would be lost, so writes must stop for the whole copy and restore, which takes far longer than a few minutes.
      fr: Les écritures effectuées après l'instantané seraient perdues ; il faudrait donc arrêter les écritures pendant toute la copie et la restauration, ce qui prend bien plus que quelques minutes.
    b:
      en: DMS with CDC also keeps downtime short, but the replication instance, endpoints and task are extra components to configure and monitor.
      fr: DMS avec CDC limite aussi l'interruption, mais l'instance de réplication, les points de terminaison et la tâche sont des composants supplémentaires à configurer et à surveiller.
    d:
      en: A Multi-AZ standby is always in another Availability Zone of the same Region; it cannot be placed in another Region.
      fr: Une instance de secours Multi-AZ se trouve toujours dans une autre zone de disponibilité de la même Région ; elle ne peut pas être placée dans une autre Région.
references:
  - title: Creating a read replica in a different AWS Region
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.XRgn.html
