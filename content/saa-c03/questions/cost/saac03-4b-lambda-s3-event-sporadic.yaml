id: saac03-4b-lambda-s3-event-sporadic
objective: "4.2.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a PDF conversion script on an Amazon EC2 instance that runs 24 hours a day. The script polls an Amazon S3 bucket every minute and converts each new file in less than 30 seconds. About 300 files arrive each day at unpredictable times, so the instance is idle most of the time. The company wants to reduce costs and stop managing servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un script de conversion de PDF sur une instance Amazon EC2 qui fonctionne 24 heures sur 24. Le script interroge un compartiment Amazon S3 chaque minute et convertit chaque nouveau fichier en moins de 30 secondes. Environ 300 fichiers arrivent chaque jour à des moments imprévisibles : l'instance est donc inactive la plupart du temps. L'entreprise souhaite réduire les coûts et ne plus gérer de serveurs.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Move the script to a smaller EC2 instance and purchase a Reserved Instance for it."
        fr: "Déplacer le script vers une instance EC2 plus petite et acheter une Reserved Instance pour celle-ci."
    - id: b
      text:
        en: "Run the script as an AWS Lambda function that S3 event notifications invoke when new objects are created."
        fr: "Exécuter le script dans une fonction AWS Lambda appelée par les notifications d'événements S3 lors de la création de nouveaux objets."
    - id: c
      text:
        en: "Run the script in an Amazon ECS service on AWS Fargate with one task that runs continuously."
        fr: "Exécuter le script dans un service Amazon ECS sur AWS Fargate avec une tâche qui s'exécute en continu."
    - id: d
      text:
        en: "Move the script to an EC2 Spot Instance that keeps polling the bucket every minute."
        fr: "Déplacer le script vers une Spot Instance EC2 qui continue d'interroger le compartiment chaque minute."
answer: { optionId: b }
explanation:
  correct:
    en: "With S3 event notifications, Amazon S3 invokes the Lambda function asynchronously each time an object is created. The company pays only for the short conversions that actually run, with no idle compute and no servers to manage."
    fr: "Avec les notifications d'événements S3, Amazon S3 appelle la fonction Lambda de manière asynchrone à chaque création d'objet. L'entreprise ne paie que les courtes conversions réellement exécutées, sans capacité de calcul inactive ni serveur à gérer."
  options:
    a:
      en: "A smaller reserved instance lowers the price but still pays for a server that is idle most of the day and must still be managed."
      fr: "Une instance réservée plus petite baisse le prix, mais paie toujours un serveur inactif la majeure partie de la journée et qu'il faut toujours gérer."
    c:
      en: "A continuously running Fargate task removes server management but still pays for compute 24 hours a day."
      fr: "Une tâche Fargate exécutée en continu supprime la gestion des serveurs, mais paie toujours la capacité de calcul 24 heures sur 24."
    d:
      en: "A Spot Instance is cheaper but is still a server to manage, can be interrupted, and stays idle most of the time."
      fr: "Une Spot Instance est moins chère, mais reste un serveur à gérer, peut être interrompue et reste inactive la plupart du temps."
references:
  - title: "Process Amazon S3 event notifications with Lambda"
    url: https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html
