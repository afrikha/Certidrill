id: saac03-4c-timestream-influxdb
objective: "4.3.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company collects temperature and vibration readings from factory sensors every second. The readings are written to a self-managed InfluxDB 2.x server on Amazon EC2, and dashboards query recent data in real time. The company wants a managed time series database that keeps its existing InfluxDB code and tools, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle collecte chaque seconde des mesures de température et de vibration provenant de capteurs d'usine. Les mesures sont écrites dans un serveur InfluxDB 2.x autogéré sur Amazon EC2, et des tableaux de bord interrogent les données récentes en temps réel. L'entreprise veut une base de données de séries chronologiques gérée qui conserve son code et ses outils InfluxDB existants, avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Store the readings in an Amazon DynamoDB table with the sensor ID as partition key and the timestamp as sort key.", fr: "Stocker les mesures dans une table Amazon DynamoDB avec l'ID du capteur comme clé de partition et l'horodatage comme clé de tri." }
    - id: b
      text: { en: "Migrate the database to Amazon Timestream for InfluxDB.", fr: "Migrer la base de données vers Amazon Timestream for InfluxDB." }
    - id: c
      text: { en: "Load the readings into an Amazon Redshift cluster every hour with the COPY command.", fr: "Charger les mesures toutes les heures dans un cluster Amazon Redshift avec la commande COPY." }
    - id: d
      text: { en: "Store the readings in an Aurora PostgreSQL DB cluster with one table for each sensor.", fr: "Stocker les mesures dans un cluster de bases de données Aurora PostgreSQL avec une table par capteur." }
answer: { optionId: b }
explanation:
  correct:
    en: Timestream for InfluxDB is a managed time series database engine that provides open-source InfluxDB 2.x capabilities, so existing InfluxDB code and tools keep working. AWS handles backups and software updates, and queries can return in single-digit milliseconds for real-time dashboards.
    fr: Timestream for InfluxDB est un moteur de base de données de séries chronologiques géré qui fournit les fonctionnalités de la version open source d'InfluxDB 2.x ; le code et les outils InfluxDB existants continuent donc de fonctionner. AWS gère les sauvegardes et les mises à jour logicielles, et les requêtes peuvent répondre en quelques millisecondes pour les tableaux de bord en temps réel.
  options:
    a:
      en: DynamoDB can store time-ordered items, but the InfluxDB queries and tools would have to be rewritten, and time series aggregations must be coded in the application.
      fr: DynamoDB peut stocker des éléments ordonnés dans le temps, mais les requêtes et outils InfluxDB devraient être réécrits, et les agrégations de séries chronologiques devraient être codées dans l'application.
    c:
      en: Hourly batch loads into a data warehouse cannot feed real-time dashboards, and the InfluxDB code would not run on Redshift.
      fr: Des chargements par lots toutes les heures dans un entrepôt de données ne peuvent pas alimenter des tableaux de bord en temps réel, et le code InfluxDB ne fonctionnerait pas sur Redshift.
    d:
      en: A relational schema with a table per sensor is hard to manage and requires rewriting every InfluxDB query in SQL.
      fr: Un schéma relationnel avec une table par capteur est difficile à gérer et oblige à réécrire chaque requête InfluxDB en SQL.
references:
  - title: What is Timestream for InfluxDB?
    url: https://docs.aws.amazon.com/timestream/latest/developerguide/timestream-for-influxdb.html
