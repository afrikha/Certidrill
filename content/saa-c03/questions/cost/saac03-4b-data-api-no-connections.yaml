id: saac03-4b-data-api-no-connections
objective: "4.3.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company is building an internal tool with AWS Lambda functions that run occasional SQL queries against an Amazon Aurora PostgreSQL-Compatible Edition cluster that runs version 16.4. The security team does not want the functions to store database credentials, and the developers do not want to configure the functions for VPC access or manage connection pools. Traffic is low and irregular, so the company wants to avoid paying for any always-on component.

    Which solution will meet these requirements?
  fr: |
    Une entreprise développe un outil interne avec des fonctions AWS Lambda qui exécutent occasionnellement des requêtes SQL sur un cluster Amazon Aurora PostgreSQL-Compatible Edition en version 16.4. L'équipe de sécurité ne veut pas que les fonctions stockent les informations d'identification de la base de données, et les développeurs ne veulent ni configurer l'accès VPC des fonctions ni gérer de pools de connexions. Le trafic est faible et irrégulier : l'entreprise veut donc éviter de payer un composant toujours actif.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an RDS Proxy that reads the credentials from AWS Secrets Manager, and attach the functions to the VPC to reach the proxy."
        fr: "Créer un RDS Proxy qui lit les informations d'identification dans AWS Secrets Manager, et attacher les fonctions au VPC pour atteindre le proxy."
    - id: b
      text:
        en: "Store the credentials in Lambda environment variables encrypted with AWS KMS, and connect directly to the cluster endpoint."
        fr: "Stocker les informations d'identification dans des variables d'environnement Lambda chiffrées avec AWS KMS, et se connecter directement au point de terminaison du cluster."
    - id: c
      text:
        en: "Deploy a PgBouncer connection pooler on an EC2 instance in the VPC and route the function connections through it."
        fr: "Déployer un regroupeur de connexions PgBouncer sur une instance EC2 du VPC et y faire passer les connexions des fonctions."
    - id: d
      text:
        en: "Enable the RDS Data API on the cluster, store the credentials in AWS Secrets Manager, and run the SQL through the Data API."
        fr: "Activer l'API de données RDS (RDS Data API) sur le cluster, stocker les informations d'identification dans AWS Secrets Manager et exécuter le SQL via l'API de données."
answer: { optionId: d }
explanation:
  correct:
    en: "The RDS Data API provides an HTTPS endpoint that runs SQL statements without a persistent connection, so there is no connection pool to manage. It uses credentials stored in AWS Secrets Manager, and Lambda functions can call it without being configured for VPC access."
    fr: "La RDS Data API fournit un point de terminaison HTTPS qui exécute des instructions SQL sans connexion persistante : il n'y a aucun pool de connexions à gérer. Elle utilise des informations d'identification stockées dans AWS Secrets Manager, et les fonctions Lambda peuvent l'appeler sans être configurées pour l'accès VPC."
  options:
    a:
      en: "The proxy is a billed, always-on component in the VPC, and the functions must be configured for VPC access to reach it."
      fr: "Le proxy est un composant facturé et toujours actif dans le VPC, et les fonctions doivent être configurées pour l'accès VPC afin de l'atteindre."
    b:
      en: "The functions would still store the credentials, need VPC access to reach the cluster, and manage their own connections."
      fr: "Les fonctions stockeraient toujours les informations d'identification, auraient besoin d'un accès VPC pour atteindre le cluster et géreraient leurs propres connexions."
    c:
      en: "A PgBouncer instance runs all the time and must be managed, and the functions still need VPC access."
      fr: "Une instance PgBouncer fonctionne en permanence et doit être gérée, et les fonctions ont toujours besoin d'un accès VPC."
references:
  - title: "Using the Amazon RDS Data API"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/data-api.html
