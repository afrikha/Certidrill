id: saac03-4c-usage-plans-tiers
objective: "4.4.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A software company sells access to a REST API built with Amazon API Gateway. Customers already authenticate with an Amazon Cognito user pool authorizer. Customers on the Basic tier must be limited to a lower request rate and a monthly request quota, and Premium customers get higher limits. One heavy customer must not consume the capacity of the others.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Un éditeur de logiciels vend l'accès à une API REST créée avec Amazon API Gateway. Les clients s'authentifient déjà avec un mécanisme d'autorisation de groupe d'utilisateurs Amazon Cognito. Les clients du niveau Basic doivent être limités à un débit de requêtes plus faible et à un quota mensuel de requêtes, et les clients Premium bénéficient de limites plus élevées. Un client très actif ne doit pas consommer la capacité des autres.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set a single stage-level throttling limit on the API stage.", fr: "Définir une seule limitation au niveau de l'étape de l'API." } }
    - { id: b, text: { en: "Create a Basic usage plan and a Premium usage plan with different throttling and quota limits, and associate them with the API stage.", fr: "Créer un plan d'utilisation Basic et un plan d'utilisation Premium avec des paramètres de limitation et de quota différents, et les associer à l'étape de l'API." } }
    - { id: c, text: { en: "Add an AWS WAF rate-based rule that limits requests from each source IP address.", fr: "Ajouter une règle AWS WAF basée sur le débit qui limite les requêtes provenant de chaque adresse IP source." } }
    - { id: d, text: { en: "Create an API key for each customer, require API keys on the methods, and add each key to the usage plan of the customer's tier.", fr: "Créer une clé d'API pour chaque client, exiger les clés d'API sur les méthodes et ajouter chaque clé au plan d'utilisation du niveau du client." } }
    - { id: e, text: { en: "Set reserved concurrency on the backend AWS Lambda functions.", fr: "Définir une simultanéité réservée sur les fonctions AWS Lambda du backend." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: A usage plan sets a throttling limit and a quota for each API key that belongs to it, so each customer is limited individually according to its tier. API keys identify the customers in the plans; authentication stays with the Cognito authorizer, as AWS recommends not using API keys for authorization.
    fr: Un plan d'utilisation définit une limitation et un quota pour chaque clé d'API qui lui appartient ; chaque client est donc limité individuellement selon son niveau. Les clés d'API identifient les clients dans les plans ; l'authentification reste assurée par le mécanisme d'autorisation Cognito, car AWS recommande de ne pas utiliser les clés d'API pour l'autorisation.
  options:
    a:
      en: A stage-level limit applies to all callers together, so one heavy customer can still use up the capacity of the others, and it has no monthly quota.
      fr: Une limite au niveau de l'étape s'applique à tous les appelants ensemble ; un client très actif peut donc toujours épuiser la capacité des autres, et elle ne comporte aucun quota mensuel.
    c:
      en: A rate-based rule counts requests per IP address, not per customer tier, and it cannot enforce a monthly quota.
      fr: Une règle basée sur le débit compte les requêtes par adresse IP, pas par niveau de client, et elle ne peut pas appliquer de quota mensuel.
    e:
      en: Reserved concurrency caps the backend for everyone at once and has no notion of customers or tiers.
      fr: La simultanéité réservée plafonne le backend pour tous à la fois et n'a aucune notion de client ni de niveau.
references:
  - title: Usage plans and API keys for REST APIs in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-usage-plans.html
  - title: Throttle requests to your REST APIs for better throughput in API Gateway
    url: https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-request-throttling.html
