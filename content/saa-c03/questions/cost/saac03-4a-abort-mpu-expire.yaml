id: saac03-4a-abort-mpu-expire
objective: "4.1.16"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company uses an Amazon S3 bucket without versioning as a landing zone for uploads from its mobile apps. Objects must be deleted 90 days after they are created. S3 Storage Lens shows that many multipart uploads were started but never completed, and their parts are still billed.

    Which combination of S3 Lifecycle actions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise utilise un compartiment Amazon S3 sans gestion des versions comme zone de dépôt pour les chargements de ses applications mobiles. Les objets doivent être supprimés 90 jours après leur création. S3 Storage Lens montre que de nombreux chargements partitionnés ont été commencés mais jamais terminés, et que leurs parties sont toujours facturées.

    Quelle combinaison d'actions de cycle de vie S3 répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "A NoncurrentVersionExpiration action with NoncurrentDays set to 90", fr: "Une action NoncurrentVersionExpiration avec NoncurrentDays défini à 90" } }
    - { id: b, text: { en: "An Expiration action that expires objects 90 days after creation", fr: "Une action Expiration qui fait expirer les objets 90 jours après leur création" } }
    - { id: c, text: { en: "An AbortIncompleteMultipartUpload action set to 7 days after initiation", fr: "Une action AbortIncompleteMultipartUpload définie à 7 jours après l'initialisation" } }
    - { id: d, text: { en: "A Transition action to S3 Glacier Flexible Retrieval after 90 days", fr: "Une action Transition vers S3 Glacier Flexible Retrieval après 90 jours" } }
    - { id: e, text: { en: "An ExpiredObjectDeleteMarker action", fr: "Une action ExpiredObjectDeleteMarker" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "In a bucket without versioning, an Expiration action permanently removes objects after the set number of days. Expiration does not remove incomplete multipart uploads, so a separate AbortIncompleteMultipartUpload action stops uploads not completed within the set days and deletes their billed parts."
    fr: "Dans un compartiment sans gestion des versions, une action Expiration supprime définitivement les objets après le nombre de jours défini. L'expiration ne supprime pas les chargements partitionnés incomplets : une action AbortIncompleteMultipartUpload distincte arrête les chargements non terminés dans le délai défini et supprime leurs parties facturées."
  options:
    a:
      en: "Noncurrent versions exist only in versioned buckets, so this action does nothing here."
      fr: "Les versions non actuelles n'existent que dans les compartiments versionnés : cette action n'a aucun effet ici."
    d:
      en: "A transition keeps the objects instead of deleting them, and adds transition requests and a 90-day minimum storage duration."
      fr: "Une transition conserve les objets au lieu de les supprimer, et ajoute des requêtes de transition ainsi qu'une durée de stockage minimale de 90 jours."
    e:
      en: "ExpiredObjectDeleteMarker removes delete markers in versioned buckets; it neither deletes objects nor stops multipart uploads."
      fr: "ExpiredObjectDeleteMarker supprime des marqueurs de suppression dans les compartiments versionnés ; il ne supprime pas d'objets et n'arrête pas les chargements partitionnés."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
