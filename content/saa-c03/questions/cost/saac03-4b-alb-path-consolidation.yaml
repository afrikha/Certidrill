id: saac03-4b-alb-path-consolidation
objective: "4.2.10"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company exposes 12 HTTP-based microservices under a single domain name, with paths such as /orders and /payments. Each microservice has its own Application Load Balancer, and the hourly load balancer charges have become significant. The company wants to reduce these costs without changing the URLs that clients use.

    Which solution will meet these requirements?
  fr: |
    Une entreprise expose 12 microservices HTTP sous un seul nom de domaine, avec des chemins comme /orders et /payments. Chaque microservice dispose de son propre Application Load Balancer, et les frais horaires des équilibreurs de charge sont devenus importants. L'entreprise souhaite réduire ces coûts sans modifier les URL utilisées par les clients.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Use one Application Load Balancer with a listener rule per microservice that matches a path pattern and forwards to that microservice's target group."
        fr: "Utiliser un seul Application Load Balancer avec une règle d'écouteur par microservice qui correspond à un modèle de chemin et transfère vers le groupe cible de ce microservice."
    - id: b
      text:
        en: "Replace each Application Load Balancer with a Network Load Balancer, keeping one load balancer for each microservice."
        fr: "Remplacer chaque Application Load Balancer par un Network Load Balancer, en conservant un équilibreur de charge par microservice."
    - id: c
      text:
        en: "Use one Network Load Balancer with a separate listener port for each microservice and a target group behind each listener."
        fr: "Utiliser un seul Network Load Balancer avec un port d'écouteur distinct pour chaque microservice et un groupe cible derrière chaque écouteur."
    - id: d
      text:
        en: "Use one Gateway Load Balancer with rules that forward each URL path to the target group of the matching microservice."
        fr: "Utiliser un seul Gateway Load Balancer avec des règles qui transfèrent chaque chemin d'URL vers le groupe cible du microservice correspondant."
answer: { optionId: a }
explanation:
  correct:
    en: "An Application Load Balancer works at Layer 7 and its listener rules can match a path-pattern condition. One ALB can therefore route /orders, /payments and the other paths to separate target groups, which replaces 12 load balancers with one while the URLs stay the same."
    fr: "Un Application Load Balancer fonctionne à la couche 7, et ses règles d'écouteur peuvent utiliser une condition path-pattern. Un seul ALB peut donc acheminer /orders, /payments et les autres chemins vers des groupes cibles distincts, ce qui remplace 12 équilibreurs de charge par un seul sans changer les URL."
  options:
    b:
      en: "Network Load Balancers work at Layer 4 and cannot route by path, and keeping 12 load balancers keeps 12 hourly charges."
      fr: "Les Network Load Balancers fonctionnent à la couche 4 et ne peuvent pas router selon le chemin, et conserver 12 équilibreurs de charge conserve 12 frais horaires."
    c:
      en: "Separate ports change the URLs that clients use, because a Network Load Balancer cannot inspect HTTP paths."
      fr: "Des ports distincts modifient les URL utilisées par les clients, car un Network Load Balancer ne peut pas inspecter les chemins HTTP."
    d:
      en: "A Gateway Load Balancer distributes IP traffic to virtual appliances such as firewalls; it has no path-based routing."
      fr: "Un Gateway Load Balancer distribue le trafic IP vers des appliances virtuelles comme des pare-feu ; il n'offre pas de routage selon le chemin."
references:
  - title: "Condition types for listener rules"
    url: https://docs.aws.amazon.com/elasticloadbalancing/latest/application/rule-condition-types.html
