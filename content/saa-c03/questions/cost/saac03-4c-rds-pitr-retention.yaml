id: saac03-4c-rds-pitr-retention
objective: "4.3.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a production database on an Amazon RDS for PostgreSQL DB instance. A new policy requires the ability to recover the database to any point in time within the last 30 days, with an RPO of about 5 minutes. The company wants the solution with the LEAST operational overhead without running additional database instances.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une base de données de production sur une instance de base de données Amazon RDS for PostgreSQL. Une nouvelle politique exige de pouvoir restaurer la base de données à n'importe quel instant des 30 derniers jours, avec un RPO d'environ 5 minutes. L'entreprise veut la solution qui impose le MOINS de charge opérationnelle, sans exécuter d'instance de base de données supplémentaire.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create an Amazon EventBridge schedule that invokes an AWS Lambda function to take a manual DB snapshot every 5 minutes and delete snapshots older than 30 days.", fr: "Créer une planification Amazon EventBridge qui appelle une fonction AWS Lambda pour prendre un instantané manuel de la base de données toutes les 5 minutes et supprimer les instantanés de plus de 30 jours." }
    - id: b
      text: { en: "Convert the DB instance to a Multi-AZ deployment so that the standby keeps a synchronous copy of the data.", fr: "Convertir l'instance de base de données en déploiement Multi-AZ afin que l'instance de secours conserve une copie synchrone des données." }
    - id: c
      text: { en: "Create a read replica in another Availability Zone and promote it if the data must be recovered.", fr: "Créer un réplica en lecture dans une autre zone de disponibilité et le promouvoir s'il faut récupérer les données." }
    - id: d
      text: { en: "Set the automated backup retention period to 30 days and use point-in-time restore when needed.", fr: "Définir la période de conservation des sauvegardes automatisées sur 30 jours et utiliser la restauration à un instant dans le passé en cas de besoin." }
answer: { optionId: d }
explanation:
  correct:
    en: Automated backups keep daily snapshots plus transaction logs, which RDS uploads to Amazon S3 every five minutes, so the instance can be restored to any time within the retention period. The retention period can be set from 0 to 35 days for a DB instance, so 30 days is supported with no custom code.
    fr: Les sauvegardes automatisées conservent des instantanés quotidiens et les journaux de transactions, que RDS charge dans Amazon S3 toutes les cinq minutes ; l'instance peut ainsi être restaurée à n'importe quel instant de la période de conservation. Cette période va de 0 à 35 jours pour une instance de base de données ; 30 jours sont donc possibles sans code personnalisé.
  options:
    a:
      en: Custom snapshot automation must be built and maintained, and the 100 manual snapshots per Region quota cannot hold 30 days of 5-minute snapshots.
      fr: Une automatisation d'instantanés personnalisée doit être construite et maintenue, et le quota de 100 instantanés manuels par Région ne peut pas contenir 30 jours d'instantanés toutes les 5 minutes.
    b:
      en: Multi-AZ provides high availability; a logical error or deleted table is replicated to the standby immediately, so it is not a point-in-time backup.
      fr: Multi-AZ fournit la haute disponibilité ; une erreur logique ou une table supprimée est répliquée immédiatement sur l'instance de secours, ce n'est donc pas une sauvegarde à un instant donné.
    c:
      en: A read replica adds an instance and replicates mistakes as they happen; it cannot return the data to an earlier point in time.
      fr: Un réplica en lecture ajoute une instance et réplique les erreurs dès qu'elles se produisent ; il ne permet pas de revenir à un état antérieur.
references:
