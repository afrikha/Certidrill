id: saac03-4a-dms-to-s3
objective: "4.1.18"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company wants to build a data lake in Amazon S3 from its on-premises Microsoft SQL Server sales database. After an initial load, changes must be replicated continuously so that the data lake stays current. The source database must stay online for the store applications.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise de distribution veut construire un lac de données dans Amazon S3 à partir de sa base de données de ventes Microsoft SQL Server sur site. Après un chargement initial, les modifications doivent être répliquées en continu pour que le lac de données reste à jour. La base de données source doit rester en ligne pour les applications des magasins.

    Quelle solution répond à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text: { en: "Use AWS DataSync to copy the database data files to the S3 bucket every hour.", fr: "Utiliser AWS DataSync pour copier toutes les heures les fichiers de données de la base vers le compartiment S3." }
    - id: b
      text: { en: "Export the tables to CSV files every night and upload them with AWS Transfer Family.", fr: "Exporter chaque nuit les tables au format CSV et les charger avec AWS Transfer Family." }
    - id: c
      text: { en: "Use AWS Database Migration Service with a full load and ongoing replication task to an S3 target endpoint.", fr: "Utiliser AWS Database Migration Service avec une tâche de chargement complet et de réplication continue vers un point de terminaison cible S3." }
    - id: d
      text: { en: "Deploy Amazon S3 File Gateway and share a folder where the database writes its backup files.", fr: "Déployer Amazon S3 File Gateway et partager un dossier où la base de données écrit ses fichiers de sauvegarde." }
answer: { optionId: c }
explanation:
  correct:
    en: "AWS DMS migrates data from databases to targets that include Amazon S3, and it can replicate ongoing changes after the full load to keep source and target in sync. The source database stays in use during the migration, and DMS is a managed service with no replication scripts to maintain."
    fr: "AWS DMS migre des données depuis des bases de données vers des cibles qui incluent Amazon S3, et peut répliquer les modifications continues après le chargement complet pour garder la source et la cible synchronisées. La base de données source reste utilisée pendant la migration, et DMS est un service géré, sans script de réplication à maintenir."
  options:
    a:
      en: "Copying the data files of a running database does not give consistent, queryable tables and is not change replication."
      fr: "Copier les fichiers de données d'une base en cours d'exécution ne donne pas de tables cohérentes et interrogeables, et ce n'est pas une réplication des modifications."
    b:
      en: "Nightly exports are custom batch jobs to maintain, and the data lake would be up to a day out of date instead of continuously current."
      fr: "Des exportations nocturnes sont des traitements par lots personnalisés à maintenir, et le lac de données aurait jusqu'à un jour de retard au lieu d'être à jour en continu."
    d:
      en: "Backup files in S3 are not tables that analytics services can query, and they are not continuous replication."
      fr: "Des fichiers de sauvegarde dans Amazon S3 ne sont pas des tables interrogeables par les services d'analyse, et ce n'est pas une réplication continue."
references:
  - title: What is AWS Database Migration Service?
    url: https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html
