id: saac03-4c-nat-instance-dev
objective: "4.4.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup has a development VPC with one private subnet. A few EC2 instances in the subnet download operating system updates over IPv4 a few times a day, and outbound traffic is under 1 GB per day. The developers accept occasional loss of internet access and are willing to patch one more instance. The startup wants the LOWEST monthly cost.

    Which solution will meet these requirements?
  fr: |
    Une start-up dispose d'un VPC de développement avec un sous-réseau privé. Quelques instances EC2 de ce sous-réseau téléchargent des mises à jour du système d'exploitation en IPv4 quelques fois par jour, et le trafic sortant est inférieur à 1 Go par jour. Les développeurs acceptent une perte occasionnelle de l'accès à Internet et sont prêts à appliquer les correctifs sur une instance de plus. La start-up veut le coût mensuel le PLUS BAS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a NAT gateway in a public subnet and route the private subnet's internet traffic to it.", fr: "Créer une passerelle NAT dans un sous-réseau public et y acheminer le trafic Internet du sous-réseau privé." }
    - id: b
      text: { en: "Create an egress-only internet gateway and route the private subnet's internet traffic to it.", fr: "Créer une passerelle Internet de sortie uniquement et y acheminer le trafic Internet du sous-réseau privé." }
    - id: c
      text: { en: "Launch a small burstable NAT instance from a current Amazon Linux AMI in a public subnet and route the private subnet's internet traffic to it.", fr: "Lancer une petite instance NAT à performances extensibles à partir d'une AMI Amazon Linux actuelle dans un sous-réseau public et y acheminer le trafic Internet du sous-réseau privé." }
    - id: d
      text: { en: "Create a private NAT gateway in the private subnet and route the subnet's internet traffic to it.", fr: "Créer une passerelle NAT privée dans le sous-réseau privé et y acheminer le trafic Internet du sous-réseau." }
answer: { optionId: c }
explanation:
  correct:
    en: A NAT gateway is billed for every hour it is available plus each GB processed, so at very low traffic its hourly charge dominates. A small NAT instance costs only its instance price; AWS recommends NAT gateways for availability, bandwidth and lower administration, but the stated tolerance for outages and patching makes the instance acceptable here. The old NAT AMI is end of life, so the instance is built from a current Amazon Linux version.
    fr: Une passerelle NAT est facturée pour chaque heure de disponibilité plus chaque Go traité ; avec un trafic très faible, son coût horaire domine. Une petite instance NAT ne coûte que le prix de l'instance ; AWS recommande les passerelles NAT pour la disponibilité, la bande passante et la réduction de l'administration, mais la tolérance déclarée aux interruptions et aux correctifs rend l'instance acceptable ici. L'ancienne AMI NAT est en fin de vie ; l'instance est donc construite à partir d'une version actuelle d'Amazon Linux.
  options:
    a:
      en: A NAT gateway works and needs less management, but its hourly charge makes it more expensive than a small instance at this traffic level.
      fr: Une passerelle NAT fonctionne et demande moins de gestion, mais son coût horaire la rend plus chère qu'une petite instance à ce niveau de trafic.
    b:
      en: An egress-only internet gateway carries only IPv6 traffic; the instances download updates over IPv4.
      fr: Une passerelle Internet de sortie uniquement ne transporte que du trafic IPv6 ; les instances téléchargent les mises à jour en IPv4.
    d:
      en: A private NAT gateway reaches other VPCs or on-premises networks; traffic it sends to an internet gateway is dropped.
      fr: Une passerelle NAT privée permet de joindre d'autres VPC ou des réseaux sur site ; le trafic qu'elle envoie vers une passerelle Internet est abandonné.
references:
  - title: NAT instances
    url: https://docs.aws.amazon.com/vpc/latest/userguide/VPC_NAT_Instance.html
  - title: Pricing for NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html
