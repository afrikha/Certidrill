id: saac03-4b-outposts-local-processing
objective: "4.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A manufacturing company runs plant-floor control systems in its own data center. A new application must process sensor data with very low latency to these systems, and the data must stay in the company's data center. The company wants to run Amazon EC2, Amazon EBS, and Amazon RDS locally with the same APIs and tools that it uses in its AWS Region, and it does not want to manage the hardware.

    Which solution will meet these requirements?
  fr: |
    Un fabricant exploite des systèmes de contrôle d'atelier dans son propre centre de données. Une nouvelle application doit traiter des données de capteurs avec une latence très faible vis-à-vis de ces systèmes, et les données doivent rester dans le centre de données de l'entreprise. L'entreprise souhaite exécuter Amazon EC2, Amazon EBS et Amazon RDS en local avec les mêmes API et outils que dans sa Région AWS, et ne veut pas gérer le matériel.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Deploy the application in an AWS Local Zone in the same metropolitan area as the data center."
        fr: "Déployer l'application dans une AWS Local Zone de la même zone métropolitaine que le centre de données."
    - id: b
      text:
        en: "Register the company's existing servers as external instances in an Amazon ECS Anywhere cluster."
        fr: "Enregistrer les serveurs existants de l'entreprise comme instances externes dans un cluster Amazon ECS Anywhere."
    - id: c
      text:
        en: "Run the application in the nearest AWS Region and connect the data center with AWS Direct Connect."
        fr: "Exécuter l'application dans la Région AWS la plus proche et y relier le centre de données avec AWS Direct Connect."
    - id: d
      text:
        en: "Install an AWS Outposts rack in the data center and run the resources in subnets on the Outpost."
        fr: "Installer un rack AWS Outposts dans le centre de données et exécuter les ressources dans des sous-réseaux de l'Outpost."
answer: { optionId: d }
explanation:
  correct:
    en: "AWS Outposts is a fully managed service that installs AWS-owned infrastructure at the customer site. Subnets on the Outpost run EC2 instances, EBS volumes and RDS DB instances locally with the same APIs and tools as the Region, and AWS operates and maintains the hardware."
    fr: "AWS Outposts est un service entièrement géré qui installe une infrastructure appartenant à AWS sur le site du client. Les sous-réseaux de l'Outpost exécutent en local des instances EC2, des volumes EBS et des instances de base de données RDS avec les mêmes API et outils que la Région, et AWS exploite et entretient le matériel."
  options:
    a:
      en: "A Local Zone runs in an AWS facility, not in the company's data center, so the data would leave the premises."
      fr: "Une Local Zone fonctionne dans une installation AWS, pas dans le centre de données de l'entreprise : les données quitteraient les locaux."
    b:
      en: "ECS Anywhere runs containers on hardware that the company manages, and it does not provide EBS volumes or RDS DB instances."
      fr: "ECS Anywhere exécute des conteneurs sur du matériel géré par l'entreprise et ne fournit ni volumes EBS ni instances de base de données RDS."
    c:
      en: "Processing in the Region sends the data out of the data center and adds network latency to the control systems."
      fr: "Un traitement dans la Région fait sortir les données du centre de données et ajoute de la latence réseau vis-à-vis des systèmes de contrôle."
references:
  - title: "What is AWS Outposts?"
    url: https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html
