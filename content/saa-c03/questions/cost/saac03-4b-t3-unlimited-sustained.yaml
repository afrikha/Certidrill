id: saac03-4b-t3-unlimited-sustained
objective: "4.2.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a reporting service on t3.xlarge instances that use the default credit configuration. Amazon CloudWatch shows that the instances have run at about 85% CPU utilization around the clock for the last 3 months, and each bill includes large charges for surplus CPU credits. The service must keep its current performance.

    Which change will reduce costs MOST effectively?
  fr: |
    Une entreprise exécute un service de rapports sur des instances t3.xlarge qui utilisent la configuration de crédits par défaut. Amazon CloudWatch montre que les instances fonctionnent à environ 85 % d'utilisation du processeur en permanence depuis 3 mois, et chaque facture comporte des frais importants pour des crédits de processeur excédentaires (surplus credits). Le service doit conserver ses performances actuelles.

    Quelle modification réduira les coûts le PLUS efficacement ?
body:
  options:
    - id: a
      text:
        en: "Switch the instances to standard credit mode."
        fr: "Passer les instances en mode de crédit standard."
    - id: b
      text:
        en: "Replace the instances with fixed-performance M family instances that have the same vCPU and memory."
        fr: "Remplacer les instances par des instances à performances fixes de la famille M avec les mêmes vCPU et la même mémoire."
    - id: c
      text:
        en: "Replace the instances with t3.2xlarge instances in unlimited mode."
        fr: "Remplacer les instances par des instances t3.2xlarge en mode illimité (unlimited)."
    - id: d
      text:
        en: "Replace the instances with t3a.xlarge instances in unlimited mode."
        fr: "Remplacer les instances par des instances t3a.xlarge en mode illimité (unlimited)."
answer: { optionId: b }
explanation:
  correct:
    en: "T3 instances launch in unlimited mode by default, and sustained usage above the baseline is billed as surplus credits per vCPU-hour. When average CPU stays above the breakeven point (52.5% for t3.xlarge compared with M5), a burstable instance costs more than an equivalent fixed-performance instance. An M family instance delivers full CPU at a flat hourly price."
    fr: "Les instances T3 démarrent par défaut en mode illimité, et une utilisation soutenue au-delà de la ligne de base est facturée en crédits excédentaires par heure de vCPU. Lorsque l'utilisation moyenne du processeur reste au-dessus du seuil de rentabilité (52,5 % pour t3.xlarge par rapport à M5), une instance à performances extensibles coûte plus cher qu'une instance équivalente à performances fixes. Une instance de la famille M fournit la totalité du processeur à un prix horaire fixe."
  options:
    a:
      en: "Standard mode stops the surplus charges but throttles the instances to their baseline once the credits are spent, so performance drops."
      fr: "Le mode standard supprime les frais excédentaires, mais limite les instances à leur ligne de base une fois les crédits épuisés : les performances baissent."
    c:
      en: "A larger burstable instance costs more per hour and still bursts above its baseline, so it does not fix the cost problem."
      fr: "Une instance extensible plus grande coûte plus cher à l'heure et dépasse toujours sa ligne de base : elle ne règle pas le problème de coût."
    d:
      en: "t3a instances are slightly cheaper per hour, but the sustained usage still generates surplus credit charges above the price of a fixed-performance instance."
      fr: "Les instances t3a sont un peu moins chères à l'heure, mais l'utilisation soutenue génère toujours des frais de crédits excédentaires qui dépassent le prix d'une instance à performances fixes."
references:
  - title: "Unlimited mode concepts for burstable instances"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/burstable-performance-instances-unlimited-mode-concepts.html
