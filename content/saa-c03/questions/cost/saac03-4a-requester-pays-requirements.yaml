id: saac03-4a-requester-pays-requirements
objective: "4.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A market data provider publishes daily files in an Amazon S3 bucket that has Requester Pays enabled. A customer is building an application in its own AWS account that downloads the files every day. The downloads must succeed, and the request and transfer charges must be billed to the customer's account, not to the data provider.

    Which combination of actions should the customer's application take? (Choose two.)
  fr: |
    Un fournisseur de données de marché publie des fichiers quotidiens dans un compartiment Amazon S3 pour lequel le paiement par le demandeur (Requester Pays) est activé. Un client développe, dans son propre compte AWS, une application qui télécharge ces fichiers chaque jour. Les téléchargements doivent réussir, et les frais de requêtes et de transfert doivent être facturés au compte du client, et non au fournisseur de données.

    Quelle combinaison d'actions l'application du client doit-elle mettre en œuvre ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Sign every request with credentials of an IAM role that belongs to the customer's account.", fr: "Signer chaque requête avec les informations d'identification d'un rôle IAM qui appartient au compte du client." } }
    - { id: b, text: { en: "Assume an IAM role in the data provider's account before downloading the files.", fr: "Endosser un rôle IAM du compte du fournisseur de données avant de télécharger les fichiers." } }
    - { id: c, text: { en: "Download the files anonymously by using their public object URLs.", fr: "Télécharger les fichiers de façon anonyme à l'aide de leurs URL d'objet publiques." } }
    - { id: d, text: { en: "Acknowledge the charges in every request with the request payer parameter (x-amz-request-payer).", fr: "Accepter les frais dans chaque requête avec le paramètre de demandeur payeur (x-amz-request-payer)." } }
    - { id: e, text: { en: "Send the requests to the S3 Transfer Acceleration endpoint of the bucket.", fr: "Envoyer les requêtes au point de terminaison S3 Transfer Acceleration du compartiment." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Requests to a Requester Pays bucket must be authenticated, because S3 bills the account behind the credentials; credentials from the customer's own account make the customer the payer. Each request must also acknowledge the charges with the request payer header or parameter, otherwise S3 rejects it."
    fr: "Les requêtes envoyées à un compartiment avec paiement par le demandeur doivent être authentifiées, car Amazon S3 facture le compte associé aux informations d'identification ; des informations d'identification du compte du client font du client le payeur. Chaque requête doit aussi accepter les frais avec l'en-tête ou le paramètre de demandeur payeur, sinon Amazon S3 la rejette."
  options:
    b:
      en: "When the requester assumes an IAM role, the account that owns the role is charged: the data provider would pay."
      fr: "Lorsque le demandeur endosse un rôle IAM, c'est le compte propriétaire du rôle qui est facturé : le fournisseur de données paierait."
    c:
      en: "Enabling Requester Pays blocks anonymous requests, so anonymous downloads fail."
      fr: "L'activation du paiement par le demandeur bloque les requêtes anonymes : les téléchargements anonymes échouent."
    e:
      en: "Transfer Acceleration only speeds up long-distance transfers and adds charges; it does not authenticate or acknowledge the charges."
      fr: "Transfer Acceleration accélère seulement les transferts longue distance et ajoute des frais ; il n'authentifie pas les requêtes et n'accepte pas les frais."
references:
  - title: Using Requester Pays general purpose buckets for storage transfers and usage
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/RequesterPaysBuckets.html
