id: saac03-4a-intelligent-tiering-unknown
objective: "4.1.9"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A media company stores 2 PB of video clips, each between 50 MB and 2 GB, in Amazon S3. Some clips become popular again months after upload, while others are never accessed, and the company cannot predict which. The company wants to reduce storage costs automatically, with no retrieval fees and no latency impact when an old clip suddenly becomes popular.

    Which storage class should the company use?
  fr: |
    Une entreprise de médias stocke dans Amazon S3 2 Po de clips vidéo de 50 Mo à 2 Go chacun. Certains clips redeviennent populaires des mois après leur chargement, d'autres ne sont jamais consultés, et l'entreprise ne peut pas prévoir lesquels. Elle veut réduire automatiquement ses coûts de stockage, sans frais de récupération et sans impact sur la latence lorsqu'un ancien clip devient soudainement populaire.

    Quelle classe de stockage l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "S3 Intelligent-Tiering", fr: "S3 Intelligent-Tiering" }
    - id: b
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: c
      text: { en: "S3 Glacier Instant Retrieval", fr: "S3 Glacier Instant Retrieval" }
    - id: d
      text: { en: "S3 One Zone-IA", fr: "S3 One Zone-IA" }
answer: { optionId: a }
explanation:
  correct:
    en: "S3 Intelligent-Tiering is designed for unknown or changing access patterns: it moves each object to lower-cost tiers after 30 and 90 days without access and back to the Frequent Access tier when it is read, with millisecond access in these tiers and no retrieval fees. It charges a small monthly monitoring fee per object, which is negligible for objects this large."
    fr: "S3 Intelligent-Tiering est conçu pour les modèles d'accès inconnus ou changeants : il déplace chaque objet vers des niveaux moins coûteux après 30 et 90 jours sans accès, puis le ramène au niveau Frequent Access lorsqu'il est lu, avec un accès en millisecondes dans ces niveaux et sans frais de récupération. Il facture de faibles frais mensuels de surveillance par objet, négligeables pour des objets de cette taille."
  options:
    b:
      en: "Standard-IA charges a per-GB retrieval fee, which becomes expensive when a clip becomes popular again."
      fr: "S3 Standard-IA facture des frais de récupération par Go, qui deviennent coûteux lorsqu'un clip redevient populaire."
    c:
      en: "Glacier Instant Retrieval is for data accessed about once a quarter; its retrieval fees make frequent access to popular clips expensive."
      fr: "S3 Glacier Instant Retrieval est destiné aux données consultées environ une fois par trimestre ; ses frais de récupération rendent coûteux l'accès fréquent aux clips populaires."
    d:
      en: "One Zone-IA also charges retrieval fees and stores the data in a single Availability Zone."
      fr: "S3 One Zone-IA facture aussi des frais de récupération et stocke les données dans une seule zone de disponibilité."
references:
  - title: How S3 Intelligent-Tiering works
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html
