id: saac03-4b-horizontal-stateless-web
objective: "4.2.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company runs a stateless web application on a single m5.8xlarge instance that was sized for the peak traffic of a weekly marketing event. For the rest of the week, CPU utilization stays below 10%. Session data is already stored in Amazon ElastiCache. The company wants to reduce compute costs while still handling the peak, and the application must tolerate the failure of an instance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application web sans état sur une seule instance m5.8xlarge dimensionnée pour le trafic de pointe d'un événement marketing hebdomadaire. Le reste de la semaine, l'utilisation du processeur reste inférieure à 10 %. Les données de session sont déjà stockées dans Amazon ElastiCache. L'entreprise souhaite réduire les coûts de calcul tout en absorbant la pointe, et l'application doit tolérer la défaillance d'une instance.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Change the instance to a smaller size, and change it back to m5.8xlarge before each marketing event."
        fr: "Passer l'instance à une taille inférieure, puis la repasser en m5.8xlarge avant chaque événement marketing."
    - id: b
      text:
        en: "Run smaller instances in a Multi-AZ Auto Scaling group behind an Application Load Balancer with a target tracking scaling policy."
        fr: "Exécuter des instances plus petites dans un groupe Auto Scaling multi-AZ derrière un Application Load Balancer avec une politique de mise à l'échelle par suivi de cible."
    - id: c
      text:
        en: "Keep the m5.8xlarge instance and purchase a 3-year Reserved Instance for it."
        fr: "Conserver l'instance m5.8xlarge et acheter une instance réservée sur 3 ans pour celle-ci."
    - id: d
      text:
        en: "Enable hibernation on the instance and hibernate it outside the marketing event."
        fr: "Activer la mise en veille prolongée sur l'instance et la mettre en veille en dehors de l'événement marketing."
answer: { optionId: b }
explanation:
  correct:
    en: "Because the application is stateless, it can scale horizontally. A target tracking policy keeps a metric such as average CPU near a target, so the group runs few small instances most of the week and adds instances for the peak, and running across Availability Zones behind a load balancer removes the single point of failure."
    fr: "Comme l'application est sans état, elle peut évoluer horizontalement. Une politique de suivi de cible maintient une métrique comme l'utilisation moyenne du processeur près d'une cible : le groupe exécute peu de petites instances la plupart de la semaine et en ajoute pour la pointe, et l'exécution dans plusieurs zones de disponibilité derrière un équilibreur de charge supprime le point de défaillance unique."
  options:
    a:
      en: "Resizing a single instance requires stopping it, and one instance still cannot tolerate an instance failure."
      fr: "Redimensionner une instance unique exige de l'arrêter, et une seule instance ne peut toujours pas tolérer une défaillance d'instance."
    c:
      en: "A reservation lowers the hourly rate but still pays for peak capacity all week, and one instance remains a single point of failure."
      fr: "Une réservation réduit le tarif horaire, mais paie toujours la capacité de pointe toute la semaine, et une seule instance reste un point de défaillance unique."
    d:
      en: "The application must serve traffic all week, so it cannot be hibernated outside the event."
      fr: "L'application doit servir du trafic toute la semaine : elle ne peut pas être mise en veille en dehors de l'événement."
references:
  - title: "Target tracking scaling policies for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html
