id: saac03-4a-activate-cost-tags
objective: "4.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company uses AWS Organizations with consolidated billing. Developers in every member account tag their resources with a CostCenter tag. The finance team opens AWS Cost Explorer from the management account but cannot group or filter costs by CostCenter.

    Which action will make the tag available for cost reporting?
  fr: |
    Une entreprise utilise AWS Organizations avec la facturation consolidée. Dans chaque compte membre, les développeurs balisent leurs ressources avec une balise CostCenter. L'équipe financière ouvre AWS Cost Explorer depuis le compte de gestion, mais ne peut ni regrouper ni filtrer les coûts par CostCenter.

    Quelle action rendra la balise disponible pour le reporting des coûts ?
body:
  options:
    - id: a
      text: { en: "Activate CostCenter as a cost allocation tag in the Billing console of each member account.", fr: "Activer CostCenter comme balise de répartition des coûts dans la console Billing de chaque compte membre." }
    - id: b
      text: { en: "Create a tag policy in AWS Organizations that requires the CostCenter tag on all resources.", fr: "Créer une politique de balises dans AWS Organizations qui exige la balise CostCenter sur toutes les ressources." }
    - id: c
      text: { en: "Enable hourly granularity in Cost Explorer for all member accounts of the organization.", fr: "Activer la granularité horaire dans Cost Explorer pour tous les comptes membres de l'organisation." }
    - id: d
      text: { en: "Activate CostCenter as a user-defined cost allocation tag in the Billing console of the management account.", fr: "Activer CostCenter comme balise de répartition des coûts définie par l'utilisateur dans la console Billing du compte de gestion." }
answer: { optionId: d }
explanation:
  correct:
    en: "User-defined tags appear in Cost Explorer and cost allocation reports only after they are activated as cost allocation tags. In an organization, only the management account can access the cost allocation tags page, and an activated tag can take up to 24 hours to appear."
    fr: "Les balises définies par l'utilisateur n'apparaissent dans Cost Explorer et les rapports de répartition des coûts qu'après leur activation comme balises de répartition des coûts. Dans une organisation, seul le compte de gestion a accès à la page des balises de répartition des coûts, et une balise activée peut mettre jusqu'à 24 heures à apparaître."
  options:
    a:
      en: "Member accounts cannot manage cost allocation tags; only the management account of the organization can activate them."
      fr: "Les comptes membres ne peuvent pas gérer les balises de répartition des coûts ; seul le compte de gestion de l'organisation peut les activer."
    b:
      en: "A tag policy standardizes tag keys and values, but it does not activate the tag for billing reports."
      fr: "Une politique de balises normalise les clés et valeurs de balises, mais elle n'active pas la balise pour les rapports de facturation."
    c:
      en: "Granularity changes the time resolution of the data, not the dimensions you can group by; the tag stays unavailable until it is activated."
      fr: "La granularité change la résolution temporelle des données, pas les dimensions de regroupement ; la balise reste indisponible tant qu'elle n'est pas activée."
references:
  - title: Organizing and tracking costs using AWS cost allocation tags
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/cost-alloc-tags.html
