id: saac03-4a-express-one-zone
objective: "4.1.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A machine learning team trains models on Amazon EC2 instances in a single Availability Zone. Each training run reads the same 30 TB dataset of small files thousands of times per second, and S3 request costs and read latency have become significant. The training dataset is a copy that can be recreated at any time from a master bucket in S3 Standard.

    Which storage option for the training copy will reduce request costs and latency the MOST?
  fr: |
    Une équipe de machine learning entraîne des modèles sur des instances Amazon EC2 situées dans une seule zone de disponibilité. Chaque entraînement lit des milliers de fois par seconde le même jeu de données de 30 To composé de petits fichiers, et les coûts de requêtes S3 ainsi que la latence de lecture sont devenus importants. Le jeu de données d'entraînement est une copie qui peut être recréée à tout moment à partir d'un compartiment maître en S3 Standard.

    Quelle option de stockage pour la copie d'entraînement réduira le PLUS les coûts de requêtes et la latence ?
body:
  options:
    - id: a
      text: { en: "An S3 Standard bucket with S3 Transfer Acceleration enabled", fr: "Un compartiment S3 Standard avec S3 Transfer Acceleration activé" }
    - id: b
      text: { en: "An S3 One Zone-IA bucket in the same Region as the training instances", fr: "Un compartiment S3 One Zone-IA dans la même Région que les instances d'entraînement" }
    - id: c
      text: { en: "An S3 Express One Zone directory bucket in the same Availability Zone as the training instances", fr: "Un compartiment de répertoire S3 Express One Zone dans la même zone de disponibilité que les instances d'entraînement" }
    - id: d
      text: { en: "An S3 Intelligent-Tiering bucket with the optional archive access tiers activated", fr: "Un compartiment S3 Intelligent-Tiering avec les niveaux d'archive facultatifs activés" }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 Express One Zone stores data in a single Availability Zone that you choose and gives consistent single-digit millisecond access, up to 10 times faster than S3 Standard, with request costs 50% lower than S3 Standard. Losing the Availability Zone is acceptable because the copy can be recreated from the master bucket."
    fr: "S3 Express One Zone stocke les données dans une zone de disponibilité que vous choisissez et offre un accès constant de l'ordre de quelques millisecondes, jusqu'à 10 fois plus rapide que S3 Standard, avec des coûts de requêtes inférieurs de 50 % à ceux de S3 Standard. La perte de la zone de disponibilité est acceptable, car la copie peut être recréée à partir du compartiment maître."
  options:
    a:
      en: "Transfer Acceleration speeds up long-distance transfers through edge locations and adds charges; it does not help instances in the same Region."
      fr: "Transfer Acceleration accélère les transferts longue distance via les emplacements périphériques et ajoute des frais ; il n'aide pas des instances situées dans la même Région."
    b:
      en: "One Zone-IA is for infrequently accessed data and charges a per-GB retrieval fee, which is very expensive for data read thousands of times per second."
      fr: "S3 One Zone-IA est destiné aux données rarement consultées et facture des frais de récupération par Go, très coûteux pour des données lues des milliers de fois par seconde."
    d:
      en: "Constantly read data stays in the Frequent Access tier, so Intelligent-Tiering lowers neither request costs nor latency, and archived objects would need a restore."
      fr: "Des données lues en permanence restent au niveau Frequent Access : S3 Intelligent-Tiering ne réduit ni les coûts de requêtes ni la latence, et des objets archivés exigeraient une restauration."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
