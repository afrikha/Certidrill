id: saac03-4a-one-zone-ia-thumbnails
objective: "4.1.19"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A photo-sharing company generates thumbnails of about 500 KB from original images that are stored in S3 Standard. Thumbnails older than 60 days are accessed about once a month, must load in milliseconds, and can be regenerated from the originals if they are lost.

    Which storage class is the MOST cost-effective for these thumbnails?
  fr: |
    Une entreprise de partage de photos génère des miniatures d'environ 500 Ko à partir d'images originales stockées dans S3 Standard. Les miniatures de plus de 60 jours sont consultées environ une fois par mois, doivent se charger en quelques millisecondes et peuvent être régénérées à partir des originaux en cas de perte.

    Quelle classe de stockage est la PLUS rentable pour ces miniatures ?
body:
  options:
    - id: a
      text: { en: "S3 Standard-IA", fr: "S3 Standard-IA" }
    - id: b
      text: { en: "S3 One Zone-IA", fr: "S3 One Zone-IA" }
    - id: c
      text: { en: "S3 Glacier Flexible Retrieval", fr: "S3 Glacier Flexible Retrieval" }
    - id: d
      text: { en: "S3 Express One Zone", fr: "S3 Express One Zone" }
answer: { optionId: b }
explanation:
  correct:
    en: "S3 One Zone-IA is designed for re-creatable, infrequently accessed data that is read about once a month and needs millisecond access. It stores data in a single Availability Zone at a lower price than Standard-IA, which is acceptable because lost thumbnails can be regenerated."
    fr: "S3 One Zone-IA est conçu pour des données recréables et rarement consultées, lues environ une fois par mois et nécessitant un accès en millisecondes. Il stocke les données dans une seule zone de disponibilité à un prix inférieur à S3 Standard-IA, ce qui est acceptable puisque des miniatures perdues peuvent être régénérées."
  options:
    a:
      en: "Standard-IA meets the access needs but pays for storage across several Availability Zones, resilience that re-creatable thumbnails do not need."
      fr: "S3 Standard-IA répond aux besoins d'accès mais paie un stockage réparti sur plusieurs zones de disponibilité, une résilience inutile pour des miniatures recréables."
    c:
      en: "Glacier Flexible Retrieval requires a restore that takes minutes to hours, so thumbnails could not load in milliseconds."
      fr: "S3 Glacier Flexible Retrieval exige une restauration de quelques minutes à quelques heures : les miniatures ne pourraient pas se charger en millisecondes."
    d:
      en: "S3 Express One Zone is high-performance storage for latency-sensitive, frequently accessed data, and it costs more to store than the infrequent access classes."
      fr: "S3 Express One Zone est un stockage hautes performances pour des données fréquemment consultées et sensibles à la latence, et son stockage coûte plus cher que celui des classes à accès peu fréquent."
references:
  - title: Understanding and managing Amazon S3 storage classes
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html
