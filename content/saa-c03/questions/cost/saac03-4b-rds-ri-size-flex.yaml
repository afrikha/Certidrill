id: saac03-4b-rds-ri-size-flex
objective: "4.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company bought two Reserved DB instances for db.r6i.large Single-AZ deployments of Amazon RDS for PostgreSQL in the us-east-1 Region. The company has now replaced its two db.r6i.large DB instances with one db.r6i.xlarge Single-AZ DB instance of RDS for PostgreSQL in the same Region and account.

    How will the reservations apply to the new DB instance?
  fr: |
    Une entreprise a acheté deux instances de base de données réservées (Reserved DB instances) pour des déploiements mono-AZ db.r6i.large d'Amazon RDS for PostgreSQL dans la Région us-east-1. L'entreprise a depuis remplacé ses deux instances de base de données db.r6i.large par une seule instance de base de données mono-AZ db.r6i.xlarge Amazon RDS for PostgreSQL dans la même Région et le même compte.

    Comment les réservations s'appliqueront-elles à la nouvelle instance de base de données ?
body:
  options:
    - id: a
      text:
        en: "The reservations do not apply, because they were bought for a different instance size."
        fr: "Les réservations ne s'appliquent pas, car elles ont été achetées pour une autre taille d'instance."
    - id: b
      text:
        en: "The reservations cover all the usage of the new DB instance at the reserved rate."
        fr: "Les réservations couvrent toute l'utilisation de la nouvelle instance de base de données au tarif réservé."
    - id: c
      text:
        en: "The reservations cover half of the usage of the new DB instance, and the rest is billed at On-Demand rates."
        fr: "Les réservations couvrent la moitié de l'utilisation de la nouvelle instance de base de données, et le reste est facturé au tarif à la demande."
    - id: d
      text:
        en: "The reservations apply only after the new DB instance is converted to a Multi-AZ deployment."
        fr: "Les réservations ne s'appliquent qu'après la conversion de la nouvelle instance de base de données en déploiement Multi-AZ."
answer: { optionId: b }
explanation:
  correct:
    en: "Reserved DB instances for RDS for PostgreSQL are size flexible within the same instance class type, Region and engine. A Single-AZ large size is worth 4 normalized units and an xlarge is worth 8, so the two db.r6i.large reservations (2 x 4 = 8 units) fully cover one db.r6i.xlarge."
    fr: "Les instances de base de données réservées pour RDS for PostgreSQL offrent une flexibilité de taille au sein du même type de classe d'instance, de la même Région et du même moteur. Une taille large mono-AZ vaut 4 unités normalisées et une taille xlarge en vaut 8 : les deux réservations db.r6i.large (2 x 4 = 8 unités) couvrent entièrement une db.r6i.xlarge."
  options:
    a:
      en: "Size flexibility lets reservations apply across sizes of the same class type for RDS for PostgreSQL."
      fr: "La flexibilité de taille permet aux réservations de s'appliquer à toutes les tailles d'un même type de classe pour RDS for PostgreSQL."
    c:
      en: "Each reservation covers 4 units and the xlarge needs 8, so the two reservations together cover all the usage, not half."
      fr: "Chaque réservation couvre 4 unités et la taille xlarge en exige 8 : les deux réservations couvrent ensemble toute l'utilisation, pas la moitié."
    d:
      en: "The reservations were bought for Single-AZ and the new instance is Single-AZ. A Multi-AZ xlarge would need 16 units, so converting would leave half the usage uncovered."
      fr: "Les réservations ont été achetées pour du mono-AZ et la nouvelle instance est mono-AZ. Une xlarge Multi-AZ exigerait 16 unités : la conversion laisserait la moitié de l'utilisation non couverte."
references:
  - title: "Reserved DB instances for Amazon RDS"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithReservedDBInstances.html
