id: saac03-4b-i-family-nosql-iops
objective: "4.2.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs a self-managed NoSQL database cluster on Amazon EC2. The database replicates every write to three nodes in different Availability Zones, so the loss of one node's local data is acceptable. Each node needs hundreds of thousands of low-latency random read IOPS. The company wants to meet this performance target at the lowest cost.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute sur Amazon EC2 un cluster de base de données NoSQL qu'elle gère elle-même. La base de données réplique chaque écriture sur trois nœuds situés dans des zones de disponibilité différentes : la perte des données locales d'un nœud est donc acceptable. Chaque nœud a besoin de centaines de milliers d'IOPS de lecture aléatoire à faible latence. L'entreprise souhaite atteindre cet objectif de performances au coût le plus bas.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Compute optimized (C family) instances with General Purpose SSD (gp3) volumes for the database data"
        fr: "Des instances optimisées pour le calcul (famille C) avec des volumes SSD à usage général (gp3) pour les données de la base"
    - id: b
      text:
        en: "Memory optimized (R family) instances with io2 Block Express volumes provisioned with very high IOPS"
        fr: "Des instances optimisées pour la mémoire (famille R) avec des volumes io2 Block Express provisionnés avec un très grand nombre d'IOPS"
    - id: c
      text:
        en: "Storage optimized (I family) instances that keep the database data on their NVMe instance store volumes"
        fr: "Des instances optimisées pour le stockage (famille I) qui conservent les données de la base sur leurs volumes de stockage d'instance NVMe"
    - id: d
      text:
        en: "General purpose (M family) instances with Throughput Optimized HDD (st1) volumes for the database data"
        fr: "Des instances à usage général (famille M) avec des volumes HDD à débit optimisé (st1) pour les données de la base"
answer: { optionId: c }
explanation:
  correct:
    en: "Storage optimized instances such as the I family deliver tens of thousands to millions of low-latency random IOPS from local NVMe instance store volumes, and the storage is included in the instance price. Instance store data does not survive an instance stop or failure, which is acceptable here because the database keeps three replicas in different zones."
    fr: "Les instances optimisées pour le stockage, comme la famille I, fournissent de dizaines de milliers à des millions d'IOPS aléatoires à faible latence depuis des volumes de stockage d'instance NVMe locaux, et ce stockage est inclus dans le prix de l'instance. Les données du stockage d'instance ne survivent pas à un arrêt ou à une défaillance de l'instance, ce qui est acceptable ici puisque la base conserve trois réplicas dans des zones différentes."
  options:
    a:
      en: "A gp3 volume cannot deliver hundreds of thousands of IOPS, so this design misses the performance target."
      fr: "Un volume gp3 ne peut pas fournir des centaines de milliers d'IOPS : cette conception n'atteint pas l'objectif de performances."
    b:
      en: "Provisioning very high IOPS on io2 Block Express can reach the target, but provisioned IOPS are billed separately and cost far more than local instance store."
      fr: "Provisionner un très grand nombre d'IOPS sur io2 Block Express peut atteindre l'objectif, mais les IOPS provisionnées sont facturées séparément et coûtent bien plus cher que le stockage d'instance local."
    d:
      en: "st1 HDD volumes are designed for large sequential throughput, not for high random IOPS."
      fr: "Les volumes HDD st1 sont conçus pour un débit séquentiel élevé, pas pour un grand nombre d'IOPS aléatoires."
references:
  - title: "Specifications for Amazon EC2 storage optimized instances"
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/so.html
