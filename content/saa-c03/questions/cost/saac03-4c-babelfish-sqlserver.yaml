id: saac03-4c-babelfish-sqlserver
objective: "4.3.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a line-of-business application on Microsoft SQL Server Enterprise edition on Amazon EC2. The application sends T-SQL queries through a SQL Server driver. License costs are the largest part of the database bill. The company wants to move to an open-source-compatible managed engine with the FEWEST changes to the application code and drivers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une application métier sur Microsoft SQL Server Enterprise edition sur Amazon EC2. L'application envoie des requêtes T-SQL via un pilote SQL Server. Les licences représentent la plus grande part de la facture de base de données. L'entreprise veut passer à un moteur géré compatible open source avec le MOINS de modifications possible du code et des pilotes de l'application.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Migrate to Amazon RDS for SQL Server with the License Included model.", fr: "Migrer vers Amazon RDS for SQL Server avec le modèle License Included." }
    - id: b
      text: { en: "Migrate to Aurora PostgreSQL with Babelfish turned on and connect the application to the Babelfish TDS endpoint.", fr: "Migrer vers Aurora PostgreSQL avec Babelfish activé et connecter l'application au point de terminaison TDS de Babelfish." }
    - id: c
      text: { en: "Convert the schema and code to Aurora MySQL with DMS Schema Conversion and switch the application to a MySQL driver.", fr: "Convertir le schéma et le code vers Aurora MySQL avec DMS Schema Conversion et faire passer l'application à un pilote MySQL." }
    - id: d
      text: { en: "Convert the schema and code to Aurora PostgreSQL with DMS Schema Conversion and switch the application to a PostgreSQL driver.", fr: "Convertir le schéma et le code vers Aurora PostgreSQL avec DMS Schema Conversion et faire passer l'application à un pilote PostgreSQL." }
answer: { optionId: b }
explanation:
  correct:
    en: Babelfish for Aurora PostgreSQL adds an endpoint that understands the SQL Server wire protocol (TDS) and runs T-SQL, so SQL Server applications work with few code changes and without changing drivers. The company leaves SQL Server licensing behind while keeping most of its code.
    fr: Babelfish for Aurora PostgreSQL ajoute un point de terminaison qui comprend le protocole réseau de SQL Server (TDS) et exécute le T-SQL ; les applications SQL Server fonctionnent ainsi avec peu de modifications de code et sans changer de pilote. L'entreprise abandonne les licences SQL Server tout en conservant l'essentiel de son code.
  options:
    a:
      en: RDS for SQL Server License Included still charges for the SQL Server license in the instance price, so the main cost remains.
      fr: RDS for SQL Server en License Included facture toujours la licence SQL Server dans le prix de l'instance ; le coût principal demeure donc.
    c:
      en: A conversion to Aurora MySQL removes licensing but requires rewriting T-SQL code and changing drivers, which is far more change than Babelfish.
      fr: Une conversion vers Aurora MySQL supprime les licences, mais elle exige de réécrire le code T-SQL et de changer de pilote, soit bien plus de modifications que Babelfish.
    d:
      en: A full conversion to PL/pgSQL with a new driver works, but it changes much more application code than connecting through Babelfish.
      fr: Une conversion complète en PL/pgSQL avec un nouveau pilote fonctionne, mais elle modifie beaucoup plus de code applicatif qu'une connexion via Babelfish.
references:
  - title: Using Babelfish for Aurora PostgreSQL
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/babelfish.html
