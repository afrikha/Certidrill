id: saac03-4b-ri-utilization-budget
objective: "4.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company purchased Reserved DB instances for its Amazon RDS fleet. After several database migrations, the company suspects that some reservations no longer match any running DB instance. The company wants an email notification whenever the utilization of its RDS reservations drops below 80%.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise a acheté des instances de base de données réservées pour son parc Amazon RDS. Après plusieurs migrations de bases de données, l'entreprise soupçonne que certaines réservations ne correspondent plus à aucune instance de base de données en cours d'exécution. L'entreprise souhaite recevoir une notification par e-mail dès que l'utilisation de ses réservations RDS passe sous 80 %.

    Quelle solution répondra à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create an RI utilization budget for Amazon RDS in AWS Budgets with an 80% target and an email notification."
        fr: "Créer dans AWS Budgets un budget d'utilisation des RI pour Amazon RDS avec une cible de 80 % et une notification par e-mail."
    - id: b
      text:
        en: "Create an RI coverage budget for Amazon RDS in AWS Budgets with an 80% target and an email notification."
        fr: "Créer dans AWS Budgets un budget de couverture des RI pour Amazon RDS avec une cible de 80 % et une notification par e-mail."
    - id: c
      text:
        en: "Create an AWS Cost Anomaly Detection monitor for Amazon RDS with an email alert subscription."
        fr: "Créer un moniteur AWS Cost Anomaly Detection pour Amazon RDS avec un abonnement aux alertes par e-mail."
    - id: d
      text:
        en: "Write an AWS Lambda function that compares the reservations with the running DB instances each day and emails the results."
        fr: "Écrire une fonction AWS Lambda qui compare chaque jour les réservations aux instances de base de données en cours d'exécution et envoie les résultats par e-mail."
answer: { optionId: a }
explanation:
  correct:
    en: "An RI utilization budget alerts when the share of purchased reservation hours that is actually used falls below a target. Unused RDS reservations lower that utilization, so an 80% target with an email recipient meets the requirement with a built-in feature."
    fr: "Un budget d'utilisation des RI alerte lorsque la part des heures réservées achetées qui est réellement utilisée passe sous une cible. Des réservations RDS inutilisées font baisser cette utilisation : une cible de 80 % avec un destinataire e-mail répond à l'exigence grâce à une fonctionnalité intégrée."
  options:
    b:
      en: "Coverage measures how much of the running usage is covered by reservations; it does not reveal reservations that are left unused."
      fr: "La couverture mesure la part de l'utilisation en cours couverte par des réservations ; elle ne révèle pas les réservations laissées inutilisées."
    c:
      en: "Cost Anomaly Detection flags unusual spending, not the utilization of reservations against a fixed target."
      fr: "Cost Anomaly Detection signale des dépenses inhabituelles, pas l'utilisation des réservations par rapport à une cible fixe."
    d:
      en: "A custom function can do this but must be written and maintained, which is more operational overhead."
      fr: "Une fonction personnalisée peut le faire, mais doit être écrite et maintenue, ce qui représente plus de charge opérationnelle."
references:
  - title: "Managing your costs with AWS Budgets"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
