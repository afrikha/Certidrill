id: saac03-4b-fargate-scheduled-long-job
objective: "4.2.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a containerized data export job that runs once each night and takes about 3 hours as a single process that cannot be split. The job must not be interrupted after it starts. The company currently runs the job on an Amazon EC2 instance that stays running all day. The company wants to reduce costs and stop managing servers.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'une tâche conteneurisée d'exportation de données qui s'exécute une fois par nuit et dure environ 3 heures sous la forme d'un processus unique qui ne peut pas être découpé. La tâche ne doit pas être interrompue une fois lancée. L'entreprise exécute actuellement la tâche sur une instance Amazon EC2 qui reste en fonctionnement toute la journée. L'entreprise souhaite réduire les coûts et ne plus gérer de serveurs.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run the job as an AWS Lambda function that an Amazon EventBridge Scheduler schedule invokes each night."
        fr: "Exécuter la tâche dans une fonction AWS Lambda appelée chaque nuit par une planification Amazon EventBridge Scheduler."
    - id: b
      text:
        en: "Run the job as an Amazon ECS task on Fargate Spot that an Amazon EventBridge Scheduler schedule starts each night."
        fr: "Exécuter la tâche en tant que tâche Amazon ECS sur Fargate Spot lancée chaque nuit par une planification Amazon EventBridge Scheduler."
    - id: c
      text:
        en: "Run the job on an EC2 Spot Instance that an Auto Scaling scheduled action launches each night."
        fr: "Exécuter la tâche sur une Spot Instance EC2 lancée chaque nuit par une action planifiée Auto Scaling."
    - id: d
      text:
        en: "Run the job as an Amazon ECS task on AWS Fargate that an Amazon EventBridge Scheduler schedule starts each night."
        fr: "Exécuter la tâche en tant que tâche Amazon ECS sur AWS Fargate lancée chaque nuit par une planification Amazon EventBridge Scheduler."
answer: { optionId: d }
explanation:
  correct:
    en: "An ECS task on AWS Fargate runs the existing container without servers to manage and is billed only while the task runs. Standard Fargate capacity is not reclaimed like Spot capacity, so the 3-hour job is not interrupted, and an EventBridge Scheduler schedule starts it each night."
    fr: "Une tâche ECS sur AWS Fargate exécute le conteneur existant sans serveur à gérer et n'est facturée que pendant l'exécution de la tâche. La capacité Fargate standard n'est pas récupérée comme la capacité Spot : la tâche de 3 heures n'est pas interrompue, et une planification EventBridge Scheduler la lance chaque nuit."
  options:
    a:
      en: "A single 3-hour process is far longer than the maximum timeout of a Lambda function (minutes, not hours), so it cannot run in Lambda."
      fr: "Un processus unique de 3 heures est bien plus long que la durée maximale d'une fonction Lambda (des minutes, pas des heures) : il ne peut pas s'exécuter dans Lambda."
    b:
      en: "Fargate Spot tasks can be interrupted with a two-minute warning, which breaks the requirement that the job must not be interrupted."
      fr: "Les tâches Fargate Spot peuvent être interrompues avec un préavis de deux minutes, ce qui contrevient à l'exigence de non-interruption."
    c:
      en: "A Spot Instance can be interrupted and is still an EC2 server for the company to manage."
      fr: "Une Spot Instance peut être interrompue et reste un serveur EC2 que l'entreprise doit gérer."
references:
  - title: "Lambda quotas"
    url: https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html
  - title: "Amazon ECS clusters for Fargate"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html
