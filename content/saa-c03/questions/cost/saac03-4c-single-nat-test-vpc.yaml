id: saac03-4c-single-nat-test-vpc
objective: "4.4.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a test VPC with private subnets in three Availability Zones. Instances in the private subnets need outbound IPv4 internet access through a managed AWS service, and traffic volume is low. The test team accepts losing internet access if one Availability Zone fails. The company wants to minimize NAT costs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un VPC de test avec des sous-réseaux privés dans trois zones de disponibilité. Les instances des sous-réseaux privés ont besoin d'un accès Internet sortant en IPv4 via un service AWS géré, et le volume de trafic est faible. L'équipe de test accepte de perdre l'accès à Internet si une zone de disponibilité tombe en panne. L'entreprise veut réduire au minimum les coûts de NAT.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create one zonal NAT gateway in a public subnet in each Availability Zone, and route each private subnet to the NAT gateway in its zone.", fr: "Créer une passerelle NAT zonale dans un sous-réseau public de chaque zone de disponibilité et acheminer chaque sous-réseau privé vers la passerelle NAT de sa zone." }
    - id: b
      text: { en: "Create one zonal NAT gateway in a public subnet in one Availability Zone, and route all private subnets to it.", fr: "Créer une passerelle NAT zonale dans un sous-réseau public d'une seule zone de disponibilité et y acheminer tous les sous-réseaux privés." }
    - id: c
      text: { en: "Create a regional NAT gateway in automatic mode, and route all private subnets to it.", fr: "Créer une passerelle NAT régionale en mode automatique et y acheminer tous les sous-réseaux privés." }
    - id: d
      text: { en: "Create one private NAT gateway in each private subnet, and route the subnet's internet traffic to it.", fr: "Créer une passerelle NAT privée dans chaque sous-réseau privé et y acheminer le trafic Internet du sous-réseau." }
answer: { optionId: b }
explanation:
  correct:
    en: NAT gateways are billed per hour and per GB processed. One shared zonal NAT gateway incurs a single hourly charge; the cross-zone traffic from the other two zones adds data transfer, but at low volume that costs less than two more NAT gateways. Losing internet access if that zone fails is acceptable here.
    fr: Les passerelles NAT sont facturées à l'heure et par Go traité. Une seule passerelle NAT zonale partagée entraîne un seul coût horaire ; le trafic entre zones provenant des deux autres zones ajoute du transfert de données, mais à faible volume cela coûte moins que deux passerelles NAT de plus. La perte de l'accès à Internet en cas de panne de cette zone est acceptable ici.
  options:
    a:
      en: A NAT gateway per zone gives zone resilience that the test team does not need and triples the hourly charge.
      fr: Une passerelle NAT par zone apporte une résilience par zone dont l'équipe de test n'a pas besoin et triple le coût horaire.
    c:
      en: A regional NAT gateway expands into every zone that has workloads and is billed for each hour in each of those zones, so it costs about the same as three zonal NAT gateways.
      fr: Une passerelle NAT régionale s'étend à chaque zone qui contient des charges de travail et est facturée pour chaque heure dans chacune de ces zones ; elle coûte donc à peu près autant que trois passerelles NAT zonales.
    d:
      en: Private NAT gateways cannot provide internet access; traffic they send to an internet gateway is dropped.
      fr: Les passerelles NAT privées ne peuvent pas fournir d'accès à Internet ; le trafic qu'elles envoient vers une passerelle Internet est abandonné.
references:
  - title: NAT gateway basics
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-basics.html
  - title: Pricing for NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html
