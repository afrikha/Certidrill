id: saac03-4a-s3-gateway-endpoint
objective: "4.1.14"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A data processing application runs on Amazon EC2 instances in private subnets of a VPC. Every day, the instances write about 20 TB of output files to an Amazon S3 bucket in the same Region through a NAT gateway, and the NAT gateway data processing charges are now the largest cost of the workload. The instances must not become reachable from the internet.

    Which solution will reduce this cost the MOST?
  fr: |
    Une application de traitement de données s'exécute sur des instances Amazon EC2 situées dans des sous-réseaux privés d'un VPC. Chaque jour, les instances écrivent environ 20 To de fichiers de sortie dans un compartiment Amazon S3 de la même Région via une passerelle NAT, et les frais de traitement de données de la passerelle NAT sont désormais le premier coût de la charge de travail. Les instances ne doivent pas devenir accessibles depuis Internet.

    Quelle solution réduira le PLUS ce coût ?
body:
  options:
    - id: a
      text: { en: "Create an interface VPC endpoint for Amazon S3 in each Availability Zone used by the private subnets.", fr: "Créer un point de terminaison d'interface VPC pour Amazon S3 dans chaque zone de disponibilité utilisée par les sous-réseaux privés." }
    - id: b
      text: { en: "Move the instances to public subnets and send the S3 traffic through an internet gateway.", fr: "Déplacer les instances dans des sous-réseaux publics et envoyer le trafic S3 par une passerelle Internet." }
    - id: c
      text: { en: "Create a gateway VPC endpoint for Amazon S3 and associate it with the route tables of the private subnets.", fr: "Créer un point de terminaison de passerelle VPC pour Amazon S3 et l'associer aux tables de routage des sous-réseaux privés." }
    - id: d
      text: { en: "Deploy one NAT gateway in each Availability Zone so that traffic does not cross Availability Zones.", fr: "Déployer une passerelle NAT dans chaque zone de disponibilité pour que le trafic ne traverse pas de zones de disponibilité." }
answer: { optionId: c }
explanation:
  correct:
    en: "A gateway endpoint for Amazon S3 adds a route to the S3 prefix list in the selected route tables, so traffic to S3 in the same Region bypasses the NAT gateway and stays private. Gateway endpoints have no additional charge, which removes the NAT gateway data processing charge for this traffic."
    fr: "Un point de terminaison de passerelle pour Amazon S3 ajoute, dans les tables de routage sélectionnées, une route vers la liste de préfixes S3 : le trafic vers Amazon S3 dans la même Région contourne la passerelle NAT et reste privé. Les points de terminaison de passerelle n'entraînent aucun frais supplémentaire, ce qui supprime les frais de traitement de la passerelle NAT pour ce trafic."
  options:
    a:
      en: "Interface endpoints keep the traffic private too, but they are billed per hour and per GB processed, so they cost more than a gateway endpoint."
      fr: "Les points de terminaison d'interface gardent aussi le trafic privé, mais ils sont facturés à l'heure et par Go traité : ils coûtent plus cher qu'un point de terminaison de passerelle."
    b:
      en: "Public subnets with public IP addresses would expose the instances to the internet, which breaks the security requirement."
      fr: "Des sous-réseaux publics avec des adresses IP publiques exposeraient les instances à Internet, ce qui enfreint l'exigence de sécurité."
    d:
      en: "One NAT gateway per Availability Zone avoids cross-AZ transfer charges, but every GB still pays the NAT gateway data processing charge, and more gateways add hourly charges."
      fr: "Une passerelle NAT par zone de disponibilité évite les frais de transfert entre zones, mais chaque Go paie toujours les frais de traitement de la passerelle NAT, et plus de passerelles ajoutent des frais horaires."
references:
  - title: Gateway endpoints
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html
  - title: Pricing for NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html
