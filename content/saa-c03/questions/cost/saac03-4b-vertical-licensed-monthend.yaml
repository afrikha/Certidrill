id: saac03-4b-vertical-licensed-monthend
objective: "4.2.11"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a licensed accounting application on one Amazon EC2 instance. The vendor does not support running more than one copy of the application at the same time. For 3 days at the end of each month, the workload needs four times the current CPU and memory; for the rest of the month, an r6i.xlarge instance is sufficient. A short maintenance window is acceptable before and after the peak.

    Which solution will meet these requirements MOST cost-effectively?
  fr: |
    Une entreprise exécute une application de comptabilité sous licence sur une seule instance Amazon EC2. Le fournisseur ne prend pas en charge l'exécution simultanée de plusieurs copies de l'application. Pendant 3 jours à la fin de chaque mois, la charge de travail a besoin de quatre fois plus de processeur et de mémoire ; le reste du mois, une instance r6i.xlarge suffit. Une courte fenêtre de maintenance est acceptable avant et après la pointe.

    Quelle solution répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Run the application in an Auto Scaling group and scale out to four instances at the end of each month."
        fr: "Exécuter l'application dans un groupe Auto Scaling et passer à quatre instances à la fin de chaque mois."
    - id: b
      text:
        en: "Run the application on an r6i.4xlarge instance all month and purchase a Reserved Instance for it."
        fr: "Exécuter l'application sur une instance r6i.4xlarge tout le mois et acheter une instance réservée pour celle-ci."
    - id: c
      text:
        en: "Stop the instance in the maintenance window, change its type to r6i.4xlarge for the peak, and change it back to r6i.xlarge afterward."
        fr: "Arrêter l'instance pendant la fenêtre de maintenance, changer son type en r6i.4xlarge pour la pointe, puis la repasser en r6i.xlarge ensuite."
    - id: d
      text:
        en: "Move the application to a t3.xlarge instance in unlimited mode so that it can burst during the peak."
        fr: "Déplacer l'application vers une instance t3.xlarge en mode illimité (unlimited) pour qu'elle puisse dépasser sa ligne de base pendant la pointe."
answer: { optionId: c }
explanation:
  correct:
    en: "The application cannot scale horizontally, so it must scale vertically. Changing the instance type of an EBS-backed instance requires a stop and a start, which fits the maintenance window, and the company pays for the larger size only during the 3 peak days."
    fr: "L'application ne peut pas évoluer horizontalement : elle doit évoluer verticalement. Changer le type d'une instance basée sur EBS exige un arrêt et un démarrage, ce qui tient dans la fenêtre de maintenance, et l'entreprise ne paie la taille supérieure que pendant les 3 jours de pointe."
  options:
    a:
      en: "Scaling out runs several copies of the application at once, which the vendor does not support."
      fr: "Augmenter le nombre d'instances exécute plusieurs copies de l'application simultanément, ce que le fournisseur ne prend pas en charge."
    b:
      en: "Even with a reservation, paying for four times the capacity all month costs more than resizing for 3 days."
      fr: "Même avec une réservation, payer quatre fois la capacité tout le mois coûte plus cher que redimensionner pendant 3 jours."
    d:
      en: "Burst credits add CPU only; a t3.xlarge has less memory than an r6i.xlarge and cannot provide four times the memory."
      fr: "Les crédits de dépassement n'ajoutent que du processeur ; une t3.xlarge a moins de mémoire qu'une r6i.xlarge et ne peut pas fournir quatre fois plus de mémoire."
references:
  - title: "Change the instance type for your Amazon EC2 instance"
    url: https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/change-instance-type-of-ebs-backed-instance.html
