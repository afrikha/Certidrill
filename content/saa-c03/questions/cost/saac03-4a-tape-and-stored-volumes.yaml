id: saac03-4a-tape-and-stored-volumes
objective: "4.1.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company is reducing its data center footprint. Its backup software writes nightly backups to a physical tape library, and the company wants to replace the tapes with durable cloud storage without changing its backup workflow. Separately, a group of application servers uses iSCSI block storage; the entire dataset must stay on premises for low-latency access, with asynchronous point-in-time backups to AWS.

    Which combination of solutions will meet these requirements? (Choose two.)
  fr: |
    Une entreprise réduit l'empreinte de son centre de données. Son logiciel de sauvegarde écrit chaque nuit les sauvegardes sur une bandothèque physique, et l'entreprise veut remplacer les bandes par un stockage cloud durable sans modifier son processus de sauvegarde. Par ailleurs, un groupe de serveurs d'application utilise du stockage en bloc iSCSI ; l'intégralité du jeu de données doit rester sur site pour un accès à faible latence, avec des sauvegardes ponctuelles asynchrones vers AWS.

    Quelle combinaison de solutions répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Deploy Volume Gateway with cached volumes for the application servers.", fr: "Déployer Volume Gateway avec des volumes mis en cache pour les serveurs d'application." } }
    - { id: b, text: { en: "Deploy Tape Gateway and present its virtual tape library to the backup software.", fr: "Déployer Tape Gateway et présenter sa bandothèque virtuelle au logiciel de sauvegarde." } }
    - { id: c, text: { en: "Deploy Amazon S3 File Gateway and give the application servers an NFS share.", fr: "Déployer Amazon S3 File Gateway et fournir un partage NFS aux serveurs d'application." } }
    - { id: d, text: { en: "Deploy Volume Gateway with stored volumes for the application servers.", fr: "Déployer Volume Gateway avec des volumes stockés pour les serveurs d'application." } }
    - { id: e, text: { en: "Use AWS DataSync to copy the backup files to S3 Glacier Deep Archive every night.", fr: "Utiliser AWS DataSync pour copier chaque nuit les fichiers de sauvegarde vers S3 Glacier Deep Archive." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Tape Gateway replaces physical tapes with cloud-backed virtual tapes that backup software keeps using as before, and it archives tapes to S3 Glacier Flexible Retrieval or S3 Glacier Deep Archive. Volume Gateway stored volumes keep the whole dataset locally as iSCSI volumes and back up point-in-time snapshots asynchronously to AWS."
    fr: "Tape Gateway remplace les bandes physiques par des bandes virtuelles adossées au cloud que le logiciel de sauvegarde continue d'utiliser comme avant, et archive les bandes dans S3 Glacier Flexible Retrieval ou S3 Glacier Deep Archive. Les volumes stockés de Volume Gateway conservent tout le jeu de données en local sous forme de volumes iSCSI et sauvegardent de manière asynchrone des instantanés ponctuels vers AWS."
  options:
    a:
      en: "Cached volumes keep the primary data in Amazon S3 and only frequently accessed data locally, so the entire dataset would not stay on premises."
      fr: "Les volumes mis en cache conservent les données principales dans Amazon S3 et seulement les données fréquemment consultées en local : le jeu de données complet ne resterait pas sur site."
    c:
      en: "S3 File Gateway provides NFS and SMB file shares, not the iSCSI block storage that the servers use."
      fr: "S3 File Gateway fournit des partages de fichiers NFS et SMB, pas le stockage en bloc iSCSI qu'utilisent les serveurs."
    e:
      en: "The backup software writes to tapes; copying files with DataSync would require changing the backup workflow."
      fr: "Le logiciel de sauvegarde écrit sur des bandes ; copier des fichiers avec DataSync imposerait de modifier le processus de sauvegarde."
references:
  - title: What is Tape Gateway?
    url: https://docs.aws.amazon.com/storagegateway/latest/tgw/WhatIsStorageGateway.html
  - title: What is Volume Gateway?
    url: https://docs.aws.amazon.com/storagegateway/latest/vgw/WhatIsStorageGateway.html
