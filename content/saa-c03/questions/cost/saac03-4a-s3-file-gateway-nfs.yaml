id: saac03-4a-s3-file-gateway-nfs
objective: "4.1.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A manufacturing company has on-premises applications that write quality-control images to an NFS share. The company wants the images stored as objects in Amazon S3 so that cloud analytics services can process them, while the on-premises applications keep low-latency access to recently written files. The applications must not be changed.

    Which solution will meet these requirements?
  fr: |
    Une entreprise industrielle dispose d'applications sur site qui écrivent des images de contrôle qualité sur un partage NFS. L'entreprise veut que les images soient stockées sous forme d'objets dans Amazon S3 afin que des services d'analyse dans le cloud puissent les traiter, tout en conservant pour les applications sur site un accès à faible latence aux fichiers récemment écrits. Les applications ne doivent pas être modifiées.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Deploy Volume Gateway with cached volumes and mount the volumes over iSCSI on the application servers.", fr: "Déployer Volume Gateway avec des volumes mis en cache et monter les volumes en iSCSI sur les serveurs d'application." }
    - id: b
      text: { en: "Deploy Tape Gateway and configure the applications to write the images to virtual tapes.", fr: "Déployer Tape Gateway et configurer les applications pour écrire les images sur des bandes virtuelles." }
    - id: c
      text: { en: "Deploy Amazon S3 File Gateway on premises and expose an NFS file share backed by the S3 bucket.", fr: "Déployer Amazon S3 File Gateway sur site et exposer un partage de fichiers NFS adossé au compartiment S3." }
    - id: d
      text: { en: "Create an AWS Transfer Family SFTP server and configure the applications to upload the images over SFTP.", fr: "Créer un serveur SFTP AWS Transfer Family et configurer les applications pour charger les images en SFTP." }
answer: { optionId: c }
explanation:
  correct:
    en: "S3 File Gateway presents an NFS (or SMB) file share on premises and stores the files as objects in Amazon S3, where cloud services can read them directly. Its local cache gives the applications low-latency access to recent data, and the applications keep writing to an NFS share."
    fr: "S3 File Gateway présente un partage de fichiers NFS (ou SMB) sur site et stocke les fichiers sous forme d'objets dans Amazon S3, où les services cloud peuvent les lire directement. Son cache local donne aux applications un accès à faible latence aux données récentes, et les applications continuent d'écrire sur un partage NFS."
  options:
    a:
      en: "Volume Gateway exposes iSCSI block volumes, not an NFS share, and the data is not readable as individual S3 objects by analytics services."
      fr: "Volume Gateway expose des volumes en bloc iSCSI, pas un partage NFS, et les données ne sont pas lisibles comme des objets S3 individuels par les services d'analyse."
    b:
      en: "Tape Gateway is a virtual tape library for backup software; it would require changing the applications and does not give file access to S3 objects."
      fr: "Tape Gateway est une bandothèque virtuelle pour logiciels de sauvegarde ; il faudrait modifier les applications, et il ne donne pas d'accès fichier à des objets S3."
    d:
      en: "Switching from NFS writes to SFTP uploads changes the applications, and Transfer Family provides no local cache."
      fr: "Passer d'écritures NFS à des chargements SFTP modifie les applications, et Transfer Family ne fournit aucun cache local."
references:
  - title: What is Amazon S3 File Gateway
    url: https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html
