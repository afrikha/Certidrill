id: saac03-4c-aurora-replica-autoscaling
objective: "4.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A media company runs an Amazon Aurora MySQL DB cluster with one writer instance. Read traffic is heavy during business hours and very low at night and on weekends. The application currently sends all reads to the writer. The company wants to scale reads and pay only for the reader capacity it needs.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de médias exécute un cluster de bases de données Amazon Aurora MySQL avec une instance d'écriture. Le trafic de lecture est élevé pendant les heures ouvrées et très faible la nuit et le week-end. L'application envoie actuellement toutes les lectures à l'instance d'écriture. L'entreprise veut faire évoluer les lectures et ne payer que la capacité de lecture dont elle a besoin.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add an Aurora Replica and configure the application to send read queries to the cluster reader endpoint.", fr: "Ajouter un réplica Aurora et configurer l'application pour qu'elle envoie les requêtes de lecture au point de terminaison de lecture du cluster." } }
    - { id: b, text: { en: "Create a cross-Region read replica cluster and send the read queries to it.", fr: "Créer un cluster réplica en lecture entre Régions et lui envoyer les requêtes de lecture." } }
    - { id: c, text: { en: "Configure an Aurora Auto Scaling target tracking policy on reader average CPU utilization.", fr: "Configurer une politique de suivi de cible Aurora Auto Scaling sur l'utilisation moyenne du processeur des instances de lecture." } }
    - { id: d, text: { en: "Modify the writer instance to a larger instance class during business hours with a scheduled script.", fr: "Passer l'instance d'écriture à une classe d'instance plus grande pendant les heures ouvrées à l'aide d'un script planifié." } }
    - { id: e, text: { en: "Add five Aurora Replicas sized for the peak and keep them running at all times.", fr: "Ajouter cinq réplicas Aurora dimensionnés pour le pic et les laisser fonctionner en permanence." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: Aurora Replicas serve read traffic, and the reader endpoint spreads connections across them. Aurora Auto Scaling then adds replicas when the reader metric rises and removes the replicas it created when demand drops, so the company does not pay for idle readers. Auto Scaling needs at least one existing reader, which the first step provides.
    fr: Les réplicas Aurora servent le trafic de lecture et le point de terminaison de lecture répartit les connexions entre eux. Aurora Auto Scaling ajoute ensuite des réplicas lorsque la métrique des instances de lecture augmente et supprime ceux qu'il a créés lorsque la demande baisse ; l'entreprise ne paie donc pas de lecteurs inactifs. Auto Scaling exige au moins une instance de lecture existante, que fournit la première étape.
  options:
    b:
      en: A cross-Region replica targets disaster recovery or remote readers; it adds inter-Region data transfer and does not scale with demand.
      fr: Un réplica entre Régions vise la reprise après sinistre ou des lecteurs distants ; il ajoute du transfert de données entre Régions et n'évolue pas avec la demande.
    d:
      en: Scaling up the writer is disruptive, adds custom automation and keeps every read on a single instance.
      fr: Agrandir l'instance d'écriture provoque une interruption, ajoute une automatisation personnalisée et laisse toutes les lectures sur une seule instance.
    e:
      en: Replicas sized for the peak and running all the time are paid for at night and on weekends, which fails the cost requirement.
      fr: Des réplicas dimensionnés pour le pic et toujours actifs sont payés la nuit et le week-end, ce qui ne répond pas à l'exigence de coût.
references:
  - title: Amazon Aurora Auto Scaling with Aurora Replicas
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Integrating.AutoScaling.html
