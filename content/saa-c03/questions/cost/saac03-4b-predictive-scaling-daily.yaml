id: saac03-4b-predictive-scaling-daily
objective: "4.2.9"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An online learning platform runs its web tier in an Amazon EC2 Auto Scaling group. Traffic follows a recurring daily pattern that rises sharply at 8:00 AM, and the pattern shifts gradually as the user base grows. New instances need 10 minutes to initialize, so the current target tracking policy adds capacity too late, and the company keeps extra instances running to compensate. The company wants capacity in place before the daily rise with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une plateforme d'apprentissage en ligne exécute son niveau web dans un groupe Amazon EC2 Auto Scaling. Le trafic suit un schéma quotidien récurrent qui augmente fortement à 8 h 00, et ce schéma évolue progressivement à mesure que le nombre d'utilisateurs croît. Les nouvelles instances ont besoin de 10 minutes pour s'initialiser : la politique de suivi de cible actuelle ajoute donc la capacité trop tard, et l'entreprise maintient des instances supplémentaires en fonctionnement pour compenser. L'entreprise souhaite que la capacité soit en place avant la hausse quotidienne, avec le MOINS de charge opérationnelle.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create scheduled actions that raise the desired capacity at 7:45 AM, and update them each month as traffic grows."
        fr: "Créer des actions planifiées qui augmentent la capacité souhaitée à 7 h 45, et les mettre à jour chaque mois à mesure que le trafic augmente."
    - id: b
      text:
        en: "Replace the target tracking policy with a step scaling policy that adds more instances for each alarm breach."
        fr: "Remplacer la politique de suivi de cible par une politique de mise à l'échelle par étapes qui ajoute davantage d'instances à chaque dépassement d'alarme."
    - id: c
      text:
        en: "Add a predictive scaling policy that launches instances ahead of the forecast, and keep the target tracking policy."
        fr: "Ajouter une politique de mise à l'échelle prédictive qui lance les instances en avance sur la prévision, et conserver la politique de suivi de cible."
    - id: d
      text:
        en: "Raise the minimum capacity of the Auto Scaling group to the number of instances needed at peak."
        fr: "Augmenter la capacité minimale du groupe Auto Scaling jusqu'au nombre d'instances nécessaires en période de pointe."
answer: { optionId: c }
explanation:
  correct:
    en: "Predictive scaling forecasts capacity from the group's history and suits cyclical traffic and applications with long initialization times. It launches instances before the forecasted load and updates its forecast as the pattern changes, while the target tracking policy still handles unexpected spikes."
    fr: "La mise à l'échelle prédictive prévoit la capacité à partir de l'historique du groupe et convient au trafic cyclique et aux applications à longue initialisation. Elle lance les instances avant la charge prévue et met à jour sa prévision lorsque le schéma évolue, tandis que la politique de suivi de cible gère toujours les pics imprévus."
  options:
    a:
      en: "Scheduled actions work for a fixed pattern, but someone must keep adjusting them as traffic grows, which is more operational overhead."
      fr: "Les actions planifiées conviennent à un schéma fixe, mais quelqu'un doit les ajuster à mesure que le trafic augmente, ce qui représente davantage de charge opérationnelle."
    b:
      en: "Step scaling is still reactive, so instances still start initializing only after the load has risen."
      fr: "La mise à l'échelle par étapes reste réactive : les instances ne commencent toujours à s'initialiser qu'après la hausse de la charge."
    d:
      en: "A peak-sized minimum keeps the extra instances running all day, which is the cost the company wants to remove."
      fr: "Un minimum dimensionné pour la pointe maintient les instances supplémentaires toute la journée, ce qui est précisément le coût que l'entreprise veut supprimer."
references:
  - title: "Predictive scaling for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-predictive-scaling.html
