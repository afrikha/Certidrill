id: saac03-4c-interface-endpoint-kinesis
objective: "4.4.10"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs data producers on EC2 instances in private subnets in two Availability Zones. The producers send about 80 TB each month to Amazon Kinesis Data Streams in the same Region through a NAT gateway in each zone, and the NAT gateway data processing charges are high. The instances must stay in private subnets, and the application code must not change.

    Which solution is the MOST cost-effective?
  fr: |
    Une entreprise exécute des producteurs de données sur des instances EC2 dans des sous-réseaux privés de deux zones de disponibilité. Les producteurs envoient environ 80 To par mois à Amazon Kinesis Data Streams dans la même Région via une passerelle NAT dans chaque zone, et les frais de traitement des données des passerelles NAT sont élevés. Les instances doivent rester dans des sous-réseaux privés, et le code de l'application ne doit pas changer.

    Quelle solution est la PLUS rentable ?
body:
  options:
    - id: a
      text: { en: "Create a gateway VPC endpoint for Kinesis Data Streams and add it to the private route tables.", fr: "Créer un point de terminaison de passerelle pour Kinesis Data Streams et l'ajouter aux tables de routage privées." }
    - id: b
      text: { en: "Create an interface VPC endpoint for Kinesis Data Streams in both zones with private DNS enabled.", fr: "Créer un point de terminaison d'interface pour Kinesis Data Streams dans les deux zones, avec le DNS privé activé." }
    - id: c
      text: { en: "Replace the two NAT gateways with one NAT gateway shared by both zones.", fr: "Remplacer les deux passerelles NAT par une seule passerelle NAT partagée par les deux zones." }
    - id: d
      text: { en: "Send the records through an AWS Global Accelerator accelerator in front of the Kinesis endpoint.", fr: "Envoyer les enregistrements via un accélérateur AWS Global Accelerator placé devant le point de terminaison Kinesis." }
answer: { optionId: b }
explanation:
  correct:
    en: An interface endpoint (AWS PrivateLink) is billed per hour in each zone plus a per-GB processing charge that is lower than the NAT gateway processing charge, so the savings on 80 TB far exceed the hourly cost. With private DNS enabled, SDK calls to the public Kinesis endpoint name resolve to the endpoint, so the code does not change.
    fr: Un point de terminaison d'interface (AWS PrivateLink) est facturé à l'heure dans chaque zone, plus un coût de traitement par Go inférieur à celui d'une passerelle NAT ; l'économie sur 80 To dépasse donc largement le coût horaire. Avec le DNS privé activé, les appels SDK vers le nom du point de terminaison public de Kinesis sont résolus vers le point de terminaison ; le code ne change donc pas.
  options:
    a:
      en: Gateway endpoints exist only for Amazon S3 and DynamoDB; Kinesis Data Streams is reached privately through an interface endpoint.
      fr: Les points de terminaison de passerelle n'existent que pour Amazon S3 et DynamoDB ; Kinesis Data Streams est joint en privé via un point de terminaison d'interface.
    c:
      en: Sharing one NAT gateway saves one hourly charge but keeps the per-GB processing on all 80 TB and adds cross-zone data transfer.
      fr: Partager une passerelle NAT économise un coût horaire mais conserve le traitement par Go sur les 80 To et ajoute du transfert de données entre zones.
    d:
      en: Global Accelerator does not front Kinesis endpoints, and its fixed fee and data transfer premium would add cost.
      fr: Global Accelerator ne se place pas devant les points de terminaison Kinesis, et ses frais fixes et son supplément de transfert de données ajouteraient un coût.
references:
  - title: Access an AWS service using an interface VPC endpoint
    url: https://docs.aws.amazon.com/vpc/latest/privatelink/create-interface-endpoint.html
  - title: Pricing for NAT gateways
    url: https://docs.aws.amazon.com/vpc/latest/userguide/nat-gateway-pricing.html
