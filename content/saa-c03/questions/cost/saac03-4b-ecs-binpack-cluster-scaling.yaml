id: saac03-4b-ecs-binpack-cluster-scaling
objective: "4.2.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company runs 30 containerized microservices as Amazon ECS services on a cluster of EC2 instances. Tasks are placed with the spread strategy across instances, and the Auto Scaling group of the cluster keeps a fixed number of instances. Average cluster CPU and memory utilization stay below 25%. The company wants the number of running instances to decrease automatically when demand is low, while tasks stay spread across Availability Zones.

    Which combination of steps will meet these requirements? (Choose two.)

    NOTE: Each correct selection is worth one point.
  fr: |
    Une entreprise exécute 30 microservices conteneurisés sous forme de services Amazon ECS sur un cluster d'instances EC2. Les tâches sont placées avec la stratégie spread entre les instances, et le groupe Auto Scaling du cluster conserve un nombre fixe d'instances. L'utilisation moyenne du processeur et de la mémoire du cluster reste inférieure à 25 %. L'entreprise souhaite que le nombre d'instances en cours d'exécution diminue automatiquement lorsque la demande est faible, tout en conservant la répartition des tâches entre les zones de disponibilité.

    Quelle combinaison d'étapes répondra à ces exigences ? (Choisissez deux réponses.)

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Change the task placement strategy to spread across Availability Zones first, then binpack on memory."
        fr: "Modifier la stratégie de placement des tâches pour répartir d'abord entre les zones de disponibilité (spread), puis regrouper selon la mémoire (binpack)."
    - id: b
      text:
        en: "Change the task placement strategy to random."
        fr: "Modifier la stratégie de placement des tâches en random."
    - id: c
      text:
        en: "Add a distinctInstance placement constraint so that each instance runs only one task of a service."
        fr: "Ajouter une contrainte de placement distinctInstance pour que chaque instance n'exécute qu'une tâche d'un service."
    - id: d
      text:
        en: "Create an Auto Scaling group capacity provider with managed scaling turned on and make it the cluster's default capacity provider strategy."
        fr: "Créer un fournisseur de capacité de groupe Auto Scaling avec la mise à l'échelle gérée activée et en faire la stratégie de fournisseur de capacité par défaut du cluster."
    - id: e
      text:
        en: "Set the minimum capacity of the Auto Scaling group to the current number of instances."
        fr: "Définir la capacité minimale du groupe Auto Scaling sur le nombre actuel d'instances."
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "The binpack strategy places tasks so that they leave the least unused CPU or memory, which minimizes the number of instances in use, and ordering spread on Availability Zones first keeps the zone distribution. With managed scaling, ECS cluster auto scaling adjusts the desired capacity of the Auto Scaling group to the capacity that tasks need, so empty instances are removed."
    fr: "La stratégie binpack place les tâches en laissant le moins possible de processeur ou de mémoire inutilisés, ce qui réduit au minimum le nombre d'instances utilisées ; placer d'abord spread sur les zones de disponibilité conserve la répartition entre zones. Avec la mise à l'échelle gérée, la mise à l'échelle automatique du cluster ECS ajuste la capacité souhaitée du groupe Auto Scaling à la capacité requise par les tâches : les instances vides sont supprimées."
  options:
    b:
      en: "Random placement does not consolidate tasks, so instances stay partly used and cannot be removed."
      fr: "Le placement aléatoire ne regroupe pas les tâches : les instances restent partiellement utilisées et ne peuvent pas être supprimées."
    c:
      en: "Allowing one task per instance spreads tasks further and increases the number of instances needed."
      fr: "N'autoriser qu'une tâche par instance disperse davantage les tâches et augmente le nombre d'instances nécessaires."
    e:
      en: "A minimum equal to the current size prevents the Auto Scaling group from ever scaling in."
      fr: "Un minimum égal à la taille actuelle empêche le groupe Auto Scaling de réduire sa capacité."
references:
  - title: "Use strategies to define Amazon ECS task placement"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task-placement-strategies.html
  - title: "Automatically manage Amazon ECS capacity with cluster auto scaling"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/cluster-auto-scaling.html
