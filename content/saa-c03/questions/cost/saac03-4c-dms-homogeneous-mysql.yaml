id: saac03-4c-dms-homogeneous-mysql
objective: "4.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A retail company runs a 2 TB MySQL 8.0 database on premises. The company wants to move the database to Amazon RDS for MySQL. The target uses the same engine, and the schema will not change. The data must be migrated with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de distribution exécute sur site une base de données MySQL 8.0 de 2 To. Elle veut déplacer cette base de données vers Amazon RDS for MySQL. La cible utilise le même moteur et le schéma ne changera pas. Les données doivent être migrées avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Convert the schema with DMS Schema Conversion, then run an AWS DMS full-load task to copy the data.", fr: "Convertir le schéma avec DMS Schema Conversion, puis exécuter une tâche AWS DMS de chargement complet pour copier les données." }
    - id: b
      text: { en: "Use AWS DMS homogeneous data migrations, which use native MySQL tools to move the data to the RDS for MySQL instance.", fr: "Utiliser les migrations de données homogènes AWS DMS, qui s'appuient sur les outils natifs de MySQL pour déplacer les données vers l'instance RDS for MySQL." }
    - id: c
      text: { en: "Write an AWS Glue ETL job that reads each table over JDBC and writes the rows to the RDS for MySQL instance.", fr: "Écrire une tâche ETL AWS Glue qui lit chaque table via JDBC et écrit les lignes dans l'instance RDS for MySQL." }
    - id: d
      text: { en: "Use AWS DataSync to copy the MySQL data files from the on-premises server to the RDS for MySQL instance.", fr: "Utiliser AWS DataSync pour copier les fichiers de données MySQL du serveur sur site vers l'instance RDS for MySQL." }
answer: { optionId: b }
explanation:
  correct:
    en: Source and target use the same engine, so this is a homogeneous migration and no schema conversion is needed. AWS DMS homogeneous data migrations automate the move to the equivalent engine on Amazon RDS by using the native database tools, which keeps the effort low.
    fr: La source et la cible utilisent le même moteur ; il s'agit donc d'une migration homogène et aucune conversion de schéma n'est nécessaire. Les migrations de données homogènes AWS DMS automatisent le déplacement vers le moteur équivalent sur Amazon RDS à l'aide des outils natifs de la base de données, ce qui limite l'effort.
  options:
    a:
      en: DMS Schema Conversion is for heterogeneous migrations (for example Oracle to PostgreSQL); a MySQL-to-MySQL move adds an unnecessary step.
      fr: DMS Schema Conversion sert aux migrations hétérogènes (par exemple d'Oracle vers PostgreSQL) ; pour un passage de MySQL à MySQL, c'est une étape inutile.
    c:
      en: A custom Glue job works but has to be written, tested and maintained for every table, which is more overhead than a managed migration feature.
      fr: Une tâche Glue personnalisée fonctionne, mais elle doit être écrite, testée et maintenue pour chaque table, ce qui représente plus d'effort qu'une fonctionnalité de migration gérée.
    d:
      en: RDS gives no access to the database host file system, so raw MySQL data files cannot be copied into an RDS instance with DataSync.
      fr: RDS ne donne pas accès au système de fichiers de l'hôte de la base de données ; on ne peut donc pas copier des fichiers de données MySQL bruts dans une instance RDS avec DataSync.
references:
  - title: Running homogeneous data migrations in AWS DMS
    url: https://docs.aws.amazon.com/dms/latest/userguide/dm-migrating-data.html
