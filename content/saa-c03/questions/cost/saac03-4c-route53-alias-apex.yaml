id: saac03-4c-route53-alias-apex
objective: "4.4.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company hosts its public DNS zone example.com in Amazon Route 53. The website runs behind an Application Load Balancer. Users must reach the site at both example.com and www.example.com. The company wants to keep DNS query charges as low as possible.

    Which solution will meet these requirements?
  fr: |
    Une entreprise héberge sa zone DNS publique example.com dans Amazon Route 53. Le site web fonctionne derrière un Application Load Balancer. Les utilisateurs doivent accéder au site à la fois via example.com et www.example.com. L'entreprise veut réduire au maximum les frais de requêtes DNS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create CNAME records for example.com and www.example.com that point to the load balancer DNS name.", fr: "Créer des enregistrements CNAME pour example.com et www.example.com qui pointent vers le nom DNS de l'équilibreur de charge." }
    - id: b
      text: { en: "Create A records for example.com and www.example.com that contain the current IP addresses of the load balancer.", fr: "Créer des enregistrements A pour example.com et www.example.com qui contiennent les adresses IP actuelles de l'équilibreur de charge." }
    - id: c
      text: { en: "Create alias A records for example.com and www.example.com that point to the Application Load Balancer.", fr: "Créer des enregistrements A d'alias pour example.com et www.example.com qui pointent vers l'Application Load Balancer." }
    - id: d
      text: { en: "Create a CNAME record for www.example.com that points to the load balancer, and an alias record for example.com that points to the CNAME record.", fr: "Créer un enregistrement CNAME pour www.example.com qui pointe vers l'équilibreur de charge, et un enregistrement d'alias pour example.com qui pointe vers cet enregistrement CNAME." }
answer: { optionId: c }
explanation:
  correct:
    en: Alias records can be created at the zone apex and can point to AWS resources such as load balancers. Route 53 does not charge for alias queries to AWS resources, so both names resolve at no query cost.
    fr: Les enregistrements d'alias peuvent être créés à l'apex de la zone et pointer vers des ressources AWS comme des équilibreurs de charge. Route 53 ne facture pas les requêtes d'alias vers des ressources AWS ; les deux noms sont donc résolus sans frais de requête.
  options:
    a:
      en: A CNAME record cannot be created at the zone apex (example.com), and Route 53 charges for CNAME queries.
      fr: Un enregistrement CNAME ne peut pas être créé à l'apex de la zone (example.com), et Route 53 facture les requêtes CNAME.
    b:
      en: Load balancer IP addresses change over time, so static A records would break.
      fr: Les adresses IP d'un équilibreur de charge changent au fil du temps ; des enregistrements A statiques cesseraient donc de fonctionner.
    d:
      en: An alias record cannot point to a CNAME record, and the CNAME queries for www.example.com are still billed.
      fr: Un enregistrement d'alias ne peut pas pointer vers un enregistrement CNAME, et les requêtes CNAME pour www.example.com restent facturées.
references:
  - title: Choosing between alias and non-alias records
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resource-record-sets-choosing-alias-non-alias.html
