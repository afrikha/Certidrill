id: saac03-4b-rds-monthly-backup-year
objective: "4.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an Amazon RDS for MySQL DB instance with automated backups retained for 7 days. A new policy requires the company to keep one backup from each month for 12 months and to be able to restore the DB instance from any of these backups. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute une instance de base de données Amazon RDS for MySQL dont les sauvegardes automatisées sont conservées 7 jours. Une nouvelle politique impose de conserver une sauvegarde de chaque mois pendant 12 mois et de pouvoir restaurer l'instance de base de données à partir de n'importe laquelle de ces sauvegardes. La solution doit impliquer le MOINS de charge opérationnelle.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Increase the automated backup retention period of the DB instance to 365 days."
        fr: "Porter la période de conservation des sauvegardes automatisées de l'instance de base de données à 365 jours."
    - id: b
      text:
        en: "Create an AWS Backup plan with a monthly rule that retains recovery points for 12 months, and assign the DB instance to the plan."
        fr: "Créer un plan AWS Backup avec une règle mensuelle qui conserve les points de récupération pendant 12 mois, et y affecter l'instance de base de données."
    - id: c
      text:
        en: "Export a DB snapshot to Amazon S3 each month and add an S3 Lifecycle rule that expires the exports after 12 months."
        fr: "Exporter chaque mois un instantané de base de données vers Amazon S3 et ajouter une règle S3 Lifecycle qui fait expirer les exportations après 12 mois."
    - id: d
      text:
        en: "Run a monthly cron job on an EC2 instance that takes a manual DB snapshot and deletes snapshots older than 12 months."
        fr: "Exécuter chaque mois sur une instance EC2 une tâche cron qui crée un instantané de base de données manuel et supprime les instantanés de plus de 12 mois."
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Backup supports Amazon RDS DB instances. A backup plan rule with a monthly frequency and a 12-month retention creates the recovery points and deletes them automatically, and each recovery point can be restored as a new DB instance."
    fr: "AWS Backup prend en charge les instances de base de données Amazon RDS. Une règle de plan de sauvegarde avec une fréquence mensuelle et une conservation de 12 mois crée les points de récupération et les supprime automatiquement, et chaque point de récupération peut être restauré en tant que nouvelle instance de base de données."
  options:
    a:
      en: "The automated backup retention period of an RDS DB instance can be set to 35 days at most."
      fr: "La période de conservation des sauvegardes automatisées d'une instance de base de données RDS est limitée à 35 jours."
    c:
      en: "Snapshot exports are data files for analytics in S3; they cannot be used to restore the DB instance directly."
      fr: "Les exportations d'instantanés sont des fichiers de données destinés à l'analyse dans S3 ; elles ne permettent pas de restaurer directement l'instance de base de données."
    d:
      en: "A cron job on an EC2 instance works but adds a server and a script to maintain."
      fr: "Une tâche cron sur une instance EC2 fonctionne, mais ajoute un serveur et un script à maintenir."
references:
  - title: "Backup retention period"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.BackupRetention.html
  - title: "AWS Backup feature availability"
    url: https://docs.aws.amazon.com/aws-backup/latest/devguide/backup-feature-availability.html
