id: saac03-4c-oracle-to-aurora-pg
objective: "4.3.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A financial services company runs an Oracle database on premises. The database contains tables, views and several hundred stored procedures. The company wants to stop paying for commercial database licenses and move to a managed, open-source-compatible engine on AWS.

    Which solution will meet these requirements?
  fr: |
    Une société de services financiers exécute sur site une base de données Oracle. Celle-ci contient des tables, des vues et plusieurs centaines de procédures stockées. L'entreprise veut cesser de payer des licences de base de données commerciales et passer à un moteur géré compatible open source sur AWS.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Migrate to Amazon RDS for Oracle with the Bring Your Own License model and copy the data with AWS DMS.", fr: "Migrer vers Amazon RDS for Oracle avec le modèle Bring Your Own License et copier les données avec AWS DMS." }
    - id: b
      text: { en: "Migrate to Aurora PostgreSQL by using AWS DMS homogeneous data migrations, which convert the stored procedures automatically.", fr: "Migrer vers Aurora PostgreSQL à l'aide des migrations de données homogènes AWS DMS, qui convertissent automatiquement les procédures stockées." }
    - id: c
      text: { en: "Convert the schema and stored procedures to Aurora PostgreSQL with DMS Schema Conversion, then migrate the data with AWS DMS.", fr: "Convertir le schéma et les procédures stockées vers Aurora PostgreSQL avec DMS Schema Conversion, puis migrer les données avec AWS DMS." }
    - id: d
      text: { en: "Export the tables to Amazon S3 and import them into Amazon DynamoDB tables, then rewrite the stored procedures as AWS Lambda functions.", fr: "Exporter les tables vers Amazon S3 et les importer dans des tables Amazon DynamoDB, puis réécrire les procédures stockées sous forme de fonctions AWS Lambda." }
answer: { optionId: c }
explanation:
  correct:
    en: Oracle to Aurora PostgreSQL is a heterogeneous migration, so the schema and code objects must be converted first. DMS Schema Conversion converts tables, views and stored procedures and produces an assessment report of what needs manual work; AWS DMS then moves the data.
    fr: Le passage d'Oracle à Aurora PostgreSQL est une migration hétérogène ; le schéma et les objets de code doivent donc d'abord être convertis. DMS Schema Conversion convertit les tables, les vues et les procédures stockées et produit un rapport d'évaluation de ce qui demande un travail manuel ; AWS DMS déplace ensuite les données.
  options:
    a:
      en: RDS for Oracle with BYOL keeps the commercial Oracle license, which fails the main requirement.
      fr: RDS for Oracle en BYOL conserve la licence Oracle commerciale, ce qui ne répond pas à l'exigence principale.
    b:
      en: Homogeneous data migrations work only between the same engine; they do not convert Oracle code to PostgreSQL.
      fr: Les migrations de données homogènes ne fonctionnent qu'entre moteurs identiques ; elles ne convertissent pas le code Oracle en PostgreSQL.
    d:
      en: DynamoDB is a non-relational key-value store; moving to it means redesigning the data model and rewriting the application, far beyond an engine change.
      fr: DynamoDB est un magasin clé-valeur non relationnel ; y passer implique de repenser le modèle de données et de réécrire l'application, bien au-delà d'un changement de moteur.
references:
  - title: Converting database schemas using DMS Schema Conversion
    url: https://docs.aws.amazon.com/dms/latest/userguide/CHAP_SchemaConversion.html
