id: saac03-4c-transit-gateway-hub
objective: "4.4.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 60 VPCs in one Region across many accounts, and the number grows every month. Every VPC must reach shared services and the on-premises data center through one Site-to-Site VPN. Managing a full mesh of VPC peering connections and per-VPC VPN connections has become error-prone. The company wants a design that scales with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 60 VPC dans une Région, répartis sur de nombreux comptes, et leur nombre augmente chaque mois. Chaque VPC doit joindre des services partagés et le centre de données sur site via une seule connexion Site-to-Site VPN. La gestion d'un maillage complet de connexions d'appairage de VPC et de connexions VPN par VPC est devenue source d'erreurs. L'entreprise veut une conception évolutive avec le MOINS de charge opérationnelle possible.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Create a transit gateway, attach every VPC and the Site-to-Site VPN connection to it, and manage routing in the transit gateway route tables.", fr: "Créer une passerelle de transit, y attacher chaque VPC et la connexion Site-to-Site VPN, et gérer l'acheminement dans les tables de routage de la passerelle de transit." }
    - id: b
      text: { en: "Peer every VPC with a shared services VPC that holds the VPN connection, and route on-premises traffic through that VPC.", fr: "Appairer chaque VPC avec un VPC de services partagés qui porte la connexion VPN, et acheminer le trafic sur site par ce VPC." }
    - id: c
      text: { en: "Keep the full mesh of VPC peering connections and automate the creation of new connections with AWS CloudFormation.", fr: "Conserver le maillage complet de connexions d'appairage de VPC et automatiser la création des nouvelles connexions avec AWS CloudFormation." }
    - id: d
      text: { en: "Create a virtual private gateway in every VPC and a Site-to-Site VPN connection from each one to the data center.", fr: "Créer une passerelle réseau privé virtuel dans chaque VPC et une connexion Site-to-Site VPN de chacune vers le centre de données." }
answer: { optionId: a }
explanation:
  correct:
    en: A transit gateway is a regional hub that interconnects VPCs and on-premises networks; VPC and VPN attachments connect to it, and routing is managed centrally. Each new VPC needs one attachment instead of a peering connection to every other VPC.
    fr: Une passerelle de transit est un hub régional qui interconnecte les VPC et les réseaux sur site ; les attachements de VPC et de VPN s'y connectent, et l'acheminement est géré de façon centralisée. Chaque nouveau VPC demande un seul attachement au lieu d'une connexion d'appairage vers chacun des autres VPC.
  options:
    b:
      en: Peering is not transitive, so VPCs cannot reach the data center through the VPN of a peered shared services VPC.
      fr: L'appairage n'est pas transitif ; les VPC ne peuvent donc pas joindre le centre de données via le VPN d'un VPC de services partagés appairé.
    c:
      en: Automation speeds up creation, but a mesh still grows with the square of the VPC count and still cannot carry on-premises traffic transitively.
      fr: L'automatisation accélère la création, mais un maillage croît toujours avec le carré du nombre de VPC et ne peut toujours pas transporter le trafic sur site de façon transitive.
    d:
      en: One VPN per VPC multiplies the tunnels to configure on premises and the hourly VPN charges, the opposite of the goal.
      fr: Un VPN par VPC multiplie les tunnels à configurer sur site et les frais horaires de VPN, à l'inverse de l'objectif.
references:
  - title: What is AWS Transit Gateway for Amazon VPC?
    url: https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html
