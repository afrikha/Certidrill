id: saac03-4a-budget-action-stop
objective: "4.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A startup runs its development Amazon EC2 instances in a dedicated AWS account. The monthly cost of the development environment must stay under $3,000. When the forecasted monthly cost reaches 90% of that amount, the development instances must be stopped automatically. The solution must have the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une start-up exécute ses instances Amazon EC2 de développement dans un compte AWS dédié. Le coût mensuel de l'environnement de développement doit rester inférieur à 3 000 USD. Lorsque le coût mensuel prévisionnel atteint 90 % de ce montant, les instances de développement doivent être arrêtées automatiquement. La solution doit présenter le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Review the AWS Cost Explorer forecast every morning and stop the instances manually when the threshold is reached.", fr: "Consulter chaque matin la prévision d'AWS Cost Explorer et arrêter manuellement les instances lorsque le seuil est atteint." }
    - id: b
      text: { en: "Create a cost budget in AWS Budgets with a budget action that automatically stops the instances at the forecasted threshold.", fr: "Créer un budget de coûts dans AWS Budgets avec une action budgétaire qui arrête automatiquement les instances au seuil prévisionnel." }
    - id: c
      text: { en: "Create an Amazon CloudWatch billing alarm that invokes an AWS Lambda function that stops the instances.", fr: "Créer une alarme de facturation Amazon CloudWatch qui appelle une fonction AWS Lambda chargée d'arrêter les instances." }
    - id: d
      text: { en: "Configure AWS Cost Anomaly Detection to send alerts to an Amazon SNS topic that the developers subscribe to.", fr: "Configurer AWS Cost Anomaly Detection pour envoyer des alertes à une rubrique Amazon SNS à laquelle les développeurs sont abonnés." }
answer: { optionId: b }
explanation:
  correct:
    en: "AWS Budgets can alert on forecasted costs, and a budget action can target specific EC2 instances in the account and run automatically when the threshold is crossed. No code or manual step is needed; Budgets only needs an IAM role that allows it to run the action."
    fr: "AWS Budgets peut alerter sur les coûts prévisionnels, et une action budgétaire peut cibler des instances EC2 précises du compte et s'exécuter automatiquement lorsque le seuil est franchi. Aucun code ni geste manuel n'est nécessaire ; Budgets a seulement besoin d'un rôle IAM qui l'autorise à exécuter l'action."
  options:
    a:
      en: "A daily manual review is operational overhead and does not stop the instances automatically."
      fr: "Une revue manuelle quotidienne représente une charge opérationnelle et n'arrête pas les instances automatiquement."
    c:
      en: "A billing alarm watches estimated charges already incurred, not the forecast, and the Lambda function is custom code to maintain."
      fr: "Une alarme de facturation surveille les frais estimés déjà engagés, pas la prévision, et la fonction Lambda est du code personnalisé à maintenir."
    d:
      en: "Cost Anomaly Detection flags unusual spend patterns with machine learning; it does not enforce a fixed amount or stop instances."
      fr: "Cost Anomaly Detection signale les dépenses inhabituelles grâce au machine learning ; il n'applique pas un montant fixe et n'arrête pas d'instances."
references:
  - title: Configuring budget actions
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-controls.html
