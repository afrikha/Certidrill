id: saac03-4b-budget-action-stop-dev
objective: "4.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has a sandbox AWS account where developers run Amazon EC2 instances for experiments. The monthly cost of the account must not exceed $2,000. When actual costs reach 90% of that amount, a known set of development instances must be stopped automatically and the account owner must be notified by email. The solution must require the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose d'un compte AWS de type bac à sable dans lequel les développeurs exécutent des instances Amazon EC2 pour des expériences. Le coût mensuel du compte ne doit pas dépasser 2 000 $. Lorsque les coûts réels atteignent 90 % de ce montant, un ensemble connu d'instances de développement doit être arrêté automatiquement et le propriétaire du compte doit être averti par e-mail. La solution doit impliquer le MOINS de charge opérationnelle.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create an AWS Cost Anomaly Detection monitor for the account with an email alert subscription for the owner."
        fr: "Créer un moniteur AWS Cost Anomaly Detection pour le compte, avec un abonnement aux alertes par e-mail pour le propriétaire."
    - id: b
      text:
        en: "Create a CloudWatch billing alarm at $1,800 that invokes an AWS Lambda function to stop the instances and notifies the owner through Amazon SNS."
        fr: "Créer une alarme de facturation CloudWatch à 1 800 $ qui appelle une fonction AWS Lambda pour arrêter les instances et avertit le propriétaire via Amazon SNS."
    - id: c
      text:
        en: "Create a cost budget in AWS Budgets with a 90% actual-cost alert to the owner and a budget action that stops the instances."
        fr: "Créer un budget de coûts dans AWS Budgets avec une alerte au propriétaire à 90 % des coûts réels et une action de budget qui arrête les instances."
    - id: d
      text:
        en: "Forecast the monthly cost in AWS Cost Explorer and create an Amazon EventBridge schedule that stops the instances every Friday."
        fr: "Prévoir le coût mensuel dans AWS Cost Explorer et créer une planification Amazon EventBridge qui arrête les instances chaque vendredi."
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Budgets sends notifications to email recipients when actual costs cross a threshold, and a budget action can target specific EC2 or RDS instances in the account to stop them. The action can run automatically, so no custom code is needed."
    fr: "AWS Budgets envoie des notifications par e-mail lorsque les coûts réels franchissent un seuil, et une action de budget peut cibler des instances EC2 ou RDS précises du compte pour les arrêter. L'action peut s'exécuter automatiquement : aucun code personnalisé n'est nécessaire."
  options:
    a:
      en: "Cost Anomaly Detection alerts on unusual spending patterns, not on a fixed budget threshold, and it cannot stop instances."
      fr: "Cost Anomaly Detection alerte sur des schémas de dépenses inhabituels, pas sur un seuil budgétaire fixe, et ne peut pas arrêter d'instances."
    b:
      en: "This can work, but it requires writing and maintaining a Lambda function, which is more operational overhead than a built-in budget action."
      fr: "Cela peut fonctionner, mais impose d'écrire et de maintenir une fonction Lambda, ce qui représente plus de charge opérationnelle qu'une action de budget intégrée."
    d:
      en: "A weekly schedule stops the instances regardless of cost and does not react when spending reaches the threshold."
      fr: "Une planification hebdomadaire arrête les instances quel que soit le coût et ne réagit pas lorsque les dépenses atteignent le seuil."
references:
  - title: "Configuring budget actions"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-controls.html
  - title: "Managing your costs with AWS Budgets"
    url: https://docs.aws.amazon.com/cost-management/latest/userguide/budgets-managing-costs.html
