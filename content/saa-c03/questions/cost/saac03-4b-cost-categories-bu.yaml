id: saac03-4b-cost-categories-bu
objective: "4.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company uses AWS Organizations with 40 member accounts. Database costs for Amazon RDS and Amazon DynamoDB must be reported by business unit. Some business units own entire accounts, while shared accounts identify each business unit only through a CostCenter cost allocation tag that is already activated. The finance team wants a single business unit dimension that it can use in AWS Cost Explorer and AWS Budgets.

    Which solution will meet these requirements with the LEAST operational overhead?
  fr: |
    Une entreprise utilise AWS Organizations avec 40 comptes membres. Les coûts de base de données d'Amazon RDS et d'Amazon DynamoDB doivent être présentés par unité commerciale. Certaines unités commerciales possèdent des comptes entiers, tandis que dans les comptes partagés, chaque unité n'est identifiée que par une balise de répartition des coûts CostCenter déjà activée. L'équipe financière souhaite une dimension « unité commerciale » unique qu'elle peut utiliser dans AWS Cost Explorer et AWS Budgets.

    Quelle solution répondra à ces exigences avec le MOINS de charge opérationnelle ?
body:
  options:
    - id: a
      text:
        en: "Create a budget for each account and each CostCenter value in AWS Budgets, and combine the results in a spreadsheet each month."
        fr: "Créer dans AWS Budgets un budget pour chaque compte et chaque valeur de CostCenter, puis combiner les résultats dans un tableur chaque mois."
    - id: b
      text:
        en: "Move the resources of the shared accounts into dedicated accounts for each business unit, and group the costs by linked account."
        fr: "Déplacer les ressources des comptes partagés vers des comptes dédiés à chaque unité commerciale, puis regrouper les coûts par compte lié."
    - id: c
      text:
        en: "Create a cost category in the management account with rules that map accounts and CostCenter tag values to business units."
        fr: "Créer dans le compte de gestion une catégorie de coûts dont les règles associent les comptes et les valeurs de la balise CostCenter aux unités commerciales."
    - id: d
      text:
        en: "Activate the AWS-generated aws:createdBy cost allocation tag and group the database costs by that tag in Cost Explorer."
        fr: "Activer la balise de répartition des coûts générée par AWS aws:createdBy et regrouper les coûts de base de données selon cette balise dans Cost Explorer."
answer: { optionId: c }
explanation:
  correct:
    en: "AWS Cost Categories map costs to internal business structures with rules that can combine dimensions such as account and cost allocation tag. The resulting cost category appears as a dimension in Cost Explorer and AWS Budgets, and the management account creates and manages it once for the whole organization."
    fr: "AWS Cost Categories associent les coûts aux structures internes de l'entreprise grâce à des règles qui peuvent combiner des dimensions comme le compte et la balise de répartition des coûts. La catégorie de coûts obtenue apparaît comme dimension dans Cost Explorer et AWS Budgets, et le compte de gestion la crée et la gère une seule fois pour toute l'organisation."
  options:
    a:
      en: "Dozens of budgets and a monthly spreadsheet are manual work and do not create a dimension in Cost Explorer."
      fr: "Des dizaines de budgets et un tableur mensuel représentent un travail manuel et ne créent aucune dimension dans Cost Explorer."
    b:
      en: "Restructuring accounts and migrating resources is a large project, far more effort than defining category rules."
      fr: "Restructurer les comptes et migrer les ressources est un projet lourd, bien plus coûteux en efforts que la définition de règles de catégorie."
    d:
      en: "The aws:createdBy tag identifies who created a resource, not which business unit owns it, and it does not cover the account-based mapping."
      fr: "La balise aws:createdBy identifie qui a créé une ressource, pas l'unité commerciale qui la possède, et ne couvre pas l'association basée sur les comptes."
references:
  - title: "Organizing costs using AWS Cost Categories"
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/manage-cost-categories.html
