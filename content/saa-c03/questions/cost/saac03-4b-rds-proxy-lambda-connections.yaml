id: saac03-4b-rds-proxy-lambda-connections
objective: "4.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company's serverless API uses AWS Lambda functions that query an Amazon RDS for MySQL DB instance. During traffic spikes, thousands of concurrent invocations open new database connections, and the DB instance reaches its maximum number of connections and rejects requests. The company wants to solve the problem without moving to a larger DB instance class.

    Which solution will meet these requirements?
  fr: |
    L'API sans serveur d'une entreprise utilise des fonctions AWS Lambda qui interrogent une instance de base de données Amazon RDS for MySQL. Pendant les pics de trafic, des milliers d'appels simultanés ouvrent de nouvelles connexions à la base de données, et l'instance atteint son nombre maximal de connexions et rejette des requêtes. L'entreprise souhaite résoudre le problème sans passer à une classe d'instance de base de données plus grande.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Create a read replica and send all the Lambda queries to the replica endpoint."
        fr: "Créer un réplica en lecture et envoyer toutes les requêtes Lambda vers le point de terminaison du réplica."
    - id: b
      text:
        en: "Increase the reserved concurrency of the Lambda functions so that more invocations can run at the same time."
        fr: "Augmenter la simultanéité réservée des fonctions Lambda pour que davantage d'appels puissent s'exécuter en même temps."
    - id: c
      text:
        en: "Create an RDS Proxy for the DB instance and configure the Lambda functions to connect to the proxy endpoint."
        fr: "Créer un RDS Proxy pour l'instance de base de données et configurer les fonctions Lambda pour qu'elles se connectent au point de terminaison du proxy."
    - id: d
      text:
        en: "Convert the DB instance to a Multi-AZ deployment so that the standby accepts part of the connections."
        fr: "Convertir l'instance de base de données en déploiement Multi-AZ pour que l'instance de secours accepte une partie des connexions."
answer: { optionId: c }
explanation:
  correct:
    en: "RDS Proxy keeps a pool of database connections and reuses them for many client connections, which avoids the overhead of opening a connection for each invocation. It also limits the number of connections opened to the DB instance, so traffic spikes no longer exhaust the connection limit."
    fr: "RDS Proxy maintient un pool de connexions à la base de données et les réutilise pour de nombreuses connexions client, ce qui évite le coût d'ouverture d'une connexion à chaque appel. Il limite aussi le nombre de connexions ouvertes vers l'instance de base de données : les pics de trafic n'épuisent plus la limite de connexions."
  options:
    a:
      en: "The API also writes to the database, and a replica has its own connection limit that the same spikes would exhaust."
      fr: "L'API écrit aussi dans la base de données, et un réplica a sa propre limite de connexions que les mêmes pics épuiseraient."
    b:
      en: "More concurrent invocations open even more connections and make the problem worse."
      fr: "Davantage d'appels simultanés ouvrent encore plus de connexions et aggravent le problème."
    d:
      en: "The standby of a Multi-AZ DB instance does not serve any traffic, so it cannot accept connections."
      fr: "L'instance de secours d'une instance de base de données Multi-AZ ne sert aucun trafic : elle ne peut pas accepter de connexions."
references:
  - title: "Amazon RDS Proxy"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/rds-proxy.html
