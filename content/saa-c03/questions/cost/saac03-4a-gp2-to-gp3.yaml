id: saac03-4a-gp2-to-gp3
objective: "4.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 200 Amazon EBS General Purpose SSD (gp2) volumes of 500 GiB attached to running Amazon EC2 instances. Monitoring shows that no volume ever exceeds 2,500 IOPS or 100 MiB/s. The company wants to reduce storage costs without downtime and without lowering performance.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 200 volumes Amazon EBS General Purpose SSD (gp2) de 500 Gio attachés à des instances Amazon EC2 en cours d'exécution. La supervision montre qu'aucun volume ne dépasse jamais 2 500 IOPS ni 100 Mio/s. L'entreprise veut réduire ses coûts de stockage sans interruption de service et sans baisse de performances.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Modify the volumes to General Purpose SSD (gp3) with Elastic Volumes, keeping the baseline gp3 performance.", fr: "Modifier les volumes en General Purpose SSD (gp3) avec Elastic Volumes, en conservant les performances de base de gp3." }
    - id: b
      text: { en: "Create snapshots, restore them as gp3 volumes, and swap the volumes during a maintenance window.", fr: "Créer des instantanés, les restaurer en volumes gp3 et remplacer les volumes pendant une fenêtre de maintenance." }
    - id: c
      text: { en: "Modify the volumes to Provisioned IOPS SSD (io1) with 2,500 provisioned IOPS each.", fr: "Modifier les volumes en Provisioned IOPS SSD (io1) avec 2 500 IOPS provisionnées chacun." }
    - id: d
      text: { en: "Modify the volumes to Cold HDD (sc1) with Elastic Volumes while they stay attached.", fr: "Modifier les volumes en Cold HDD (sc1) avec Elastic Volumes pendant qu'ils restent attachés." }
answer: { optionId: a }
explanation:
  correct:
    en: "gp3 costs up to 20% less per GiB than gp2 and includes a baseline of 3,000 IOPS and 125 MiB/s whatever the volume size, which covers the observed peaks. Elastic Volumes changes the volume type while the volume stays attached and in use, so there is no downtime."
    fr: "gp3 coûte jusqu'à 20 % de moins par Gio que gp2 et inclut une base de 3 000 IOPS et 125 Mio/s quelle que soit la taille du volume, ce qui couvre les pics observés. Elastic Volumes change le type de volume pendant que le volume reste attaché et utilisé : aucune interruption."
  options:
    b:
      en: "Restoring snapshots and swapping volumes requires a maintenance window, which breaks the no-downtime requirement, and is more work than an in-place change."
      fr: "Restaurer des instantanés et remplacer les volumes exige une fenêtre de maintenance, ce qui enfreint l'exigence d'absence d'interruption, et demande plus de travail qu'une modification sur place."
    c:
      en: "io1 charges for each provisioned IOPS on top of a higher storage price, so it costs more than gp2, not less."
      fr: "io1 facture chaque IOPS provisionnée en plus d'un prix de stockage plus élevé : il coûte plus cher que gp2, pas moins."
    d:
      en: "sc1 delivers at most a few hundred IOPS and is meant for cold sequential data, so performance would drop sharply."
      fr: "sc1 fournit au plus quelques centaines d'IOPS et est destiné aux données froides séquentielles : les performances chuteraient fortement."
references:
  - title: Amazon EBS General Purpose SSD volumes
    url: https://docs.aws.amazon.com/ebs/latest/userguide/general-purpose.html
  - title: Modify an Amazon EBS volume using Elastic Volumes operations
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-modify-volume.html
