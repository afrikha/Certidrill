id: saac03-4b-consolidated-billing-benefits
objective: "4.2.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company has six standalone AWS accounts that each receive a separate bill. Two of the accounts have purchased Reserved Instances and Savings Plans that are often underused, while the other accounts run similar workloads at On-Demand rates. The company plans to create an organization in AWS Organizations and invite all six accounts.

    Which cost benefits will the company receive from consolidated billing? (Choose two.)
  fr: |
    Une entreprise possède six comptes AWS autonomes qui reçoivent chacun une facture distincte. Deux de ces comptes ont acheté des instances réservées et des Savings Plans souvent sous-utilisés, tandis que les autres comptes exécutent des charges de travail similaires au tarif à la demande (On-Demand). L'entreprise prévoit de créer une organisation dans AWS Organizations et d'y inviter les six comptes.

    Quels avantages en matière de coûts l'entreprise obtiendra-t-elle grâce à la facturation consolidée ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Every account in the organization receives AWS Business Support at no additional charge."
        fr: "Chaque compte de l'organisation bénéficie d'AWS Business Support sans frais supplémentaires."
    - id: b
      text:
        en: "The usage of all the accounts is combined to reach volume pricing tiers sooner."
        fr: "L'utilisation de tous les comptes est cumulée pour atteindre plus tôt les paliers de tarification dégressive."
    - id: c
      text:
        en: "Service control policies automatically stop idle EC2 instances in the member accounts."
        fr: "Les politiques de contrôle des services (SCP) arrêtent automatiquement les instances EC2 inactives des comptes membres."
    - id: d
      text:
        en: "AWS Compute Optimizer recommendations are applied automatically to the instances in the member accounts."
        fr: "Les recommandations d'AWS Compute Optimizer sont appliquées automatiquement aux instances des comptes membres."
    - id: e
      text:
        en: "Reserved Instance and Savings Plans discounts bought in one account can apply to matching usage in the other accounts."
        fr: "Les remises des instances réservées et des Savings Plans achetés dans un compte peuvent s'appliquer à l'utilisation correspondante des autres comptes."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Consolidated billing combines the usage of all accounts in the organization, so volume pricing tiers are reached with the combined total. Reserved Instance and Savings Plans discounts are also shared across accounts, so the underused commitments can cover matching On-Demand usage elsewhere. Consolidated billing itself has no additional cost."
    fr: "La facturation consolidée cumule l'utilisation de tous les comptes de l'organisation : les paliers de tarification dégressive sont atteints avec le total cumulé. Les remises des instances réservées et des Savings Plans sont également partagées entre les comptes : les engagements sous-utilisés peuvent couvrir l'utilisation à la demande correspondante ailleurs. La facturation consolidée elle-même n'entraîne aucun coût supplémentaire."
  options:
    a:
      en: "Support plans are purchased separately; joining an organization does not include a paid support plan."
      fr: "Les offres de support s'achètent séparément ; rejoindre une organisation n'inclut aucune offre de support payante."
    c:
      en: "SCPs only set the maximum permissions available in accounts. They never start, stop or modify resources."
      fr: "Les SCP définissent seulement les autorisations maximales disponibles dans les comptes. Elles ne démarrent, n'arrêtent et ne modifient jamais de ressources."
    d:
      en: "Compute Optimizer only produces rightsizing recommendations; someone must still apply them."
      fr: "Compute Optimizer produit seulement des recommandations de dimensionnement ; quelqu'un doit encore les appliquer."
references:
  - title: "Consolidating billing for AWS Organizations"
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
