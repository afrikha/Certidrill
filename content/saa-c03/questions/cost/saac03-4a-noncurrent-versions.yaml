id: saac03-4a-noncurrent-versions
objective: "4.1.16"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company stores configuration files in an Amazon S3 bucket that has versioning enabled. The files are overwritten many times each day, and noncurrent versions now account for 90% of the bucket's storage. The company must always be able to roll back a file to any of its three most recent previous versions. Other previous versions are not needed once they have been noncurrent for 30 days.

    Which S3 Lifecycle configuration will meet these requirements?
  fr: |
    Une entreprise stocke des fichiers de configuration dans un compartiment Amazon S3 dont la gestion des versions est activée. Les fichiers sont écrasés de nombreuses fois par jour, et les versions non actuelles représentent désormais 90 % du stockage du compartiment. L'entreprise doit toujours pouvoir restaurer un fichier dans l'une de ses trois versions précédentes les plus récentes. Les autres versions précédentes ne sont plus nécessaires une fois qu'elles sont non actuelles depuis 30 jours.

    Quelle configuration de cycle de vie S3 répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Expiration action that expires current versions 30 days after creation", fr: "Une action Expiration qui fait expirer les versions actuelles 30 jours après leur création" }
    - id: b
      text: { en: "A NoncurrentVersionExpiration action with NoncurrentDays set to 30 and NewerNoncurrentVersions set to 3", fr: "Une action NoncurrentVersionExpiration avec NoncurrentDays défini à 30 et NewerNoncurrentVersions défini à 3" }
    - id: c
      text: { en: "A NoncurrentVersionTransition action to S3 Glacier Deep Archive after 30 days", fr: "Une action NoncurrentVersionTransition vers S3 Glacier Deep Archive après 30 jours" }
    - id: d
      text: { en: "An ExpiredObjectDeleteMarker action combined with suspending versioning on the bucket", fr: "Une action ExpiredObjectDeleteMarker associée à la suspension de la gestion des versions du compartiment" }
answer: { optionId: b }
explanation:
  correct:
    en: "NoncurrentVersionExpiration permanently deletes noncurrent versions. With NewerNoncurrentVersions set to 3, a version is deleted only when it has been noncurrent for more than 30 days and at least three newer noncurrent versions exist, so the three most recent previous versions are always kept."
    fr: "NoncurrentVersionExpiration supprime définitivement les versions non actuelles. Avec NewerNoncurrentVersions défini à 3, une version n'est supprimée que si elle est non actuelle depuis plus de 30 jours et qu'au moins trois versions non actuelles plus récentes existent : les trois versions précédentes les plus récentes sont donc toujours conservées."
  options:
    a:
      en: "In a versioned bucket, Expiration acts on the current version by adding a delete marker; it deletes no noncurrent version and makes the files appear deleted."
      fr: "Dans un compartiment versionné, Expiration agit sur la version actuelle en ajoutant un marqueur de suppression ; elle ne supprime aucune version non actuelle et fait apparaître les fichiers comme supprimés."
    c:
      en: "Transitioning noncurrent versions keeps paying for every version, Deep Archive bills a 180-day minimum, and rollbacks would require a restore."
      fr: "Faire transiter les versions non actuelles continue de facturer chaque version, Deep Archive facture un minimum de 180 jours, et les restaurations de versions exigeraient une restauration préalable."
    d:
      en: "Suspending versioning does not delete existing versions, and ExpiredObjectDeleteMarker only removes delete markers that have no noncurrent versions."
      fr: "Suspendre la gestion des versions ne supprime pas les versions existantes, et ExpiredObjectDeleteMarker ne supprime que les marqueurs de suppression sans versions non actuelles."
references:
  - title: Lifecycle configuration elements
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intro-lifecycle-rules.html
