id: saac03-4a-datasync-nfs-efs
objective: "4.1.18"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company is migrating 150 TB of engineering data from an on-premises NFS file server to Amazon EFS. The data changes every day, so the company needs an initial full copy followed by repeated copies of only the changed data until the cutover weekend. File ownership, permissions and timestamps must be preserved, and the transfer must be encrypted. The company has a 10 Gbps AWS Direct Connect connection.

    Which service should the company use?
  fr: |
    Une entreprise migre 150 To de données d'ingénierie d'un serveur de fichiers NFS sur site vers Amazon EFS. Les données changent chaque jour : l'entreprise a besoin d'une copie complète initiale, puis de copies répétées des seules données modifiées jusqu'au week-end de bascule. Le propriétaire, les autorisations et les horodatages des fichiers doivent être préservés, et le transfert doit être chiffré. L'entreprise dispose d'une connexion AWS Direct Connect de 10 Gbit/s.

    Quel service l'entreprise doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "AWS DataSync with an agent on premises and scheduled tasks to the EFS file system", fr: "AWS DataSync avec un agent sur site et des tâches planifiées vers le système de fichiers EFS" }
    - id: b
      text: { en: "AWS Transfer Family with an SFTP server that stores files in the EFS file system", fr: "AWS Transfer Family avec un serveur SFTP qui stocke les fichiers dans le système de fichiers EFS" }
    - id: c
      text: { en: "Amazon S3 File Gateway with an NFS share, followed by a copy from S3 to EFS", fr: "Amazon S3 File Gateway avec un partage NFS, suivi d'une copie d'Amazon S3 vers EFS" }
    - id: d
      text: { en: "AWS Database Migration Service with a full load and ongoing replication task", fr: "AWS Database Migration Service avec une tâche de chargement complet et de réplication continue" }
answer: { optionId: a }
explanation:
  correct:
    en: "DataSync is a managed transfer service that copies data from NFS, SMB, HDFS or object storage to Amazon EFS, Amazon S3 and Amazon FSx, with encryption in transit and data integrity validation. After the initial copy, a task can transfer only the data and metadata that changed, it can preserve POSIX ownership, permissions and timestamps, and tasks can run on a schedule."
    fr: "DataSync est un service de transfert géré qui copie des données depuis NFS, SMB, HDFS ou du stockage d'objets vers Amazon EFS, Amazon S3 et Amazon FSx, avec chiffrement en transit et validation de l'intégrité des données. Après la copie initiale, une tâche peut ne transférer que les données et métadonnées modifiées, elle peut préserver le propriétaire, les autorisations POSIX et les horodatages, et les tâches peuvent être planifiées."
  options:
    b:
      en: "Transfer Family receives files pushed by SFTP clients; it does not synchronize a file server incrementally or preserve its metadata."
      fr: "Transfer Family reçoit des fichiers envoyés par des clients SFTP ; il ne synchronise pas un serveur de fichiers de manière incrémentielle et ne préserve pas ses métadonnées."
    c:
      en: "S3 File Gateway stores files in Amazon S3, not in EFS, so a second migration would be needed and the POSIX metadata would have to be carried over."
      fr: "S3 File Gateway stocke les fichiers dans Amazon S3, pas dans EFS : une seconde migration serait nécessaire et les métadonnées POSIX devraient être reportées."
    d:
      en: "DMS migrates databases and data stores; it does not copy file systems to Amazon EFS."
      fr: "DMS migre des bases de données et des magasins de données ; il ne copie pas des systèmes de fichiers vers Amazon EFS."
references:
  - title: What is AWS DataSync?
    url: https://docs.aws.amazon.com/datasync/latest/userguide/what-is-datasync.html
  - title: Configuring how to handle files, objects, and metadata
    url: https://docs.aws.amazon.com/datasync/latest/userguide/configure-metadata.html
