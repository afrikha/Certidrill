id: saac03-4c-postgis-engine
objective: "4.3.11"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A logistics company runs a route-planning application on a self-managed PostgreSQL server. The application stores delivery zones with the PostGIS extension and uses PL/pgSQL functions. The company wants to move to a managed relational database on AWS without changing the application code.

    Which database engine should the company choose?
  fr: |
    Une entreprise de logistique exécute une application de planification d'itinéraires sur un serveur PostgreSQL autogéré. L'application stocke des zones de livraison avec l'extension PostGIS et utilise des fonctions PL/pgSQL. L'entreprise veut passer à une base de données relationnelle gérée sur AWS sans modifier le code de l'application.

    Quel moteur de base de données l'entreprise doit-elle choisir ?
body:
  options:
    - id: a
      text: { en: "Amazon Aurora MySQL-Compatible Edition", fr: "Amazon Aurora MySQL-Compatible Edition" }
    - id: b
      text: { en: "Amazon RDS for MariaDB", fr: "Amazon RDS for MariaDB" }
    - id: c
      text: { en: "Amazon Aurora PostgreSQL-Compatible Edition", fr: "Amazon Aurora PostgreSQL-Compatible Edition" }
    - id: d
      text: { en: "Amazon DocumentDB (with MongoDB compatibility)", fr: "Amazon DocumentDB (with MongoDB compatibility)" }
answer: { optionId: c }
explanation:
  correct:
    en: The application depends on PostgreSQL-specific features, PostGIS and PL/pgSQL, so the target must be PostgreSQL-compatible. Aurora PostgreSQL supports the PostGIS extension (installed with CREATE EXTENSION by a user with rds_superuser), so the code runs unchanged.
    fr: L'application dépend de fonctionnalités propres à PostgreSQL, PostGIS et PL/pgSQL ; la cible doit donc être compatible PostgreSQL. Aurora PostgreSQL prend en charge l'extension PostGIS (installée avec CREATE EXTENSION par un utilisateur disposant de rds_superuser) ; le code s'exécute donc sans modification.
  options:
    a:
      en: Aurora MySQL has spatial types of its own, but it cannot run PostGIS functions or PL/pgSQL code, so the application would have to be rewritten.
      fr: Aurora MySQL possède ses propres types spatiaux, mais il ne peut pas exécuter les fonctions PostGIS ni le code PL/pgSQL ; l'application devrait donc être réécrite.
    b:
      en: MariaDB is a MySQL fork; PostgreSQL extensions and PL/pgSQL are not available.
      fr: MariaDB est un dérivé de MySQL ; les extensions PostgreSQL et PL/pgSQL n'y sont pas disponibles.
    d:
      en: DocumentDB is a non-relational document database with a MongoDB-compatible API, not a PostgreSQL replacement.
      fr: DocumentDB est une base de données de documents non relationnelle avec une API compatible MongoDB, pas un remplaçant de PostgreSQL.
references:
  - title: Managing spatial data with the PostGIS extension
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Appendix.PostgreSQL.CommonDBATasks.PostGIS.html
