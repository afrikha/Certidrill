id: saac03-4c-resolver-hybrid-dns
objective: "4.4.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company connects its data center to a VPC through AWS Direct Connect. Servers in the data center must resolve names in a Route 53 private hosted zone associated with the VPC. EC2 instances in the VPC must resolve names in the corp.example.internal domain, which is hosted on the on-premises DNS servers. The company currently runs a pair of self-managed DNS forwarders on EC2 and wants to replace them with a managed solution.

    Which combination of steps will meet these requirements? (Choose two.)
  fr: |
    Une entreprise relie son centre de données à un VPC via AWS Direct Connect. Les serveurs du centre de données doivent résoudre des noms d'une zone hébergée privée Route 53 associée au VPC. Les instances EC2 du VPC doivent résoudre des noms du domaine corp.example.internal, hébergé sur les serveurs DNS sur site. L'entreprise exécute actuellement deux redirecteurs DNS autogérés sur EC2 et veut les remplacer par une solution gérée.

    Quelle combinaison d'étapes répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a Route 53 VPC Resolver inbound endpoint and configure the on-premises DNS servers to forward the private hosted zone domain to its IP addresses.", fr: "Créer un point de terminaison entrant Route 53 VPC Resolver et configurer les serveurs DNS sur site pour qu'ils transfèrent le domaine de la zone hébergée privée vers ses adresses IP." } }
    - { id: b, text: { en: "Create a public hosted zone for corp.example.internal and copy the on-premises records into it.", fr: "Créer une zone hébergée publique pour corp.example.internal et y copier les enregistrements sur site." } }
    - { id: c, text: { en: "Create a Route 53 VPC Resolver outbound endpoint and a forwarding rule for corp.example.internal that targets the on-premises DNS servers.", fr: "Créer un point de terminaison sortant Route 53 VPC Resolver et une règle de transfert pour corp.example.internal qui cible les serveurs DNS sur site." } }
    - { id: d, text: { en: "Change the VPC DHCP options set to use the on-premises DNS servers only.", fr: "Modifier le jeu d'options DHCP du VPC pour n'utiliser que les serveurs DNS sur site." } }
    - { id: e, text: { en: "Associate the private hosted zone with the Direct Connect gateway.", fr: "Associer la zone hébergée privée à la passerelle Direct Connect." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: An inbound endpoint receives queries from on premises over the private connection and passes them to the VPC Resolver, which answers from the private hosted zone. An outbound endpoint with a forwarding rule sends queries for corp.example.internal from the VPC to the on-premises resolvers. Both are managed, so the EC2 forwarders can be removed.
    fr: Un point de terminaison entrant reçoit les requêtes venant du site via la connexion privée et les transmet au VPC Resolver, qui répond à partir de la zone hébergée privée. Un point de terminaison sortant associé à une règle de transfert envoie les requêtes pour corp.example.internal du VPC vers les résolveurs sur site. Les deux sont gérés ; les redirecteurs EC2 peuvent donc être supprimés.
  options:
    b:
      en: Copying internal records into a public zone exposes them on the internet and creates a second copy to keep in sync.
      fr: Copier des enregistrements internes dans une zone publique les expose sur Internet et crée une seconde copie à synchroniser.
    d:
      en: If the VPC used only the on-premises DNS servers, instances could no longer resolve the private hosted zone or AWS names through the VPC Resolver without extra forwarders.
      fr: Si le VPC n'utilisait que les serveurs DNS sur site, les instances ne pourraient plus résoudre la zone hébergée privée ni les noms AWS via le VPC Resolver sans redirecteurs supplémentaires.
    e:
      en: Private hosted zones are associated with VPCs, not with Direct Connect gateways.
      fr: Les zones hébergées privées sont associées à des VPC, pas à des passerelles Direct Connect.
references:
  - title: What is Route 53 VPC Resolver?
    url: https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/resolver.html
