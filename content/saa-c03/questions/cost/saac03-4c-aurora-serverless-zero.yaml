id: saac03-4c-aurora-serverless-zero
objective: "4.3.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs an internal reporting tool on a MySQL-compatible database. The tool is used for a few short sessions each week, and the database is idle the rest of the time. When it is used, the load varies and is hard to predict. A wait of under a minute at the start of a session is acceptable. The company wants the MOST cost-effective managed relational database.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute un outil de reporting interne sur une base de données compatible MySQL. L'outil est utilisé lors de quelques courtes sessions par semaine et la base de données est inactive le reste du temps. Lorsqu'il est utilisé, la charge varie et est difficile à prévoir. Une attente de moins d'une minute au début d'une session est acceptable. L'entreprise veut la base de données relationnelle gérée la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "An Amazon RDS for MySQL DB instance sized for the peak load and covered by a 1-year Reserved Instance", fr: "Une instance de base de données Amazon RDS for MySQL dimensionnée pour la charge de pointe et couverte par une instance réservée d'un an" }
    - id: b
      text: { en: "An Aurora MySQL provisioned DB cluster with one writer and one Aurora Replica", fr: "Un cluster de bases de données provisionné Aurora MySQL avec une instance d'écriture et un réplica Aurora" }
    - id: c
      text: { en: "An Amazon DynamoDB table in on-demand capacity mode", fr: "Une table Amazon DynamoDB en mode de capacité à la demande" }
    - id: d
      text: { en: "An Aurora Serverless v2 DB cluster with a minimum capacity of 0 ACUs so that it pauses when idle", fr: "Un cluster de bases de données Aurora Serverless v2 avec une capacité minimale de 0 ACU afin qu'il se mette en pause lorsqu'il est inactif" }
answer: { optionId: d }
explanation:
  correct:
    en: Aurora Serverless v2 scales capacity with the load, and a minimum of 0 ACUs turns on automatic pause after an idle interval. While paused, the instance charge is zero (storage is still billed), and a connection resumes it, typically in about 15 seconds, which the company accepts.
    fr: Aurora Serverless v2 adapte sa capacité à la charge, et une capacité minimale de 0 ACU active la mise en pause automatique après un délai d'inactivité. Pendant la pause, le coût de l'instance est nul (le stockage reste facturé), et une connexion la relance, généralement en 15 secondes environ, ce que l'entreprise accepte.
  options:
    a:
      en: A Reserved Instance lowers the hourly rate but the company still pays every hour for a peak-sized instance that is idle most of the week.
      fr: Une instance réservée réduit le tarif horaire, mais l'entreprise paie toujours chaque heure une instance dimensionnée pour le pic et inactive la majeure partie de la semaine.
    b:
      en: Provisioned instances are billed continuously, and an extra replica doubles the idle cost.
      fr: Les instances provisionnées sont facturées en continu, et un réplica supplémentaire double le coût d'inactivité.
    c:
      en: DynamoDB is not a relational MySQL-compatible database; the tool would have to be rewritten.
      fr: DynamoDB n'est pas une base de données relationnelle compatible MySQL ; l'outil devrait être réécrit.
references:
  - title: Scaling to Zero ACUs with automatic pause and resume for Aurora serverless
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2-auto-pause.html
