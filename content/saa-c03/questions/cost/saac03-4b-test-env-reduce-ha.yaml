id: saac03-4b-test-env-reduce-ha
objective: "4.2.13"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A company's test environment mirrors production: an Auto Scaling group with a minimum of 6 Amazon EC2 instances across three Availability Zones, and an Amazon RDS for MySQL Multi-AZ DB instance. The quality assurance team uses the environment only on weekdays from 8:00 AM to 6:00 PM. An outage of a few hours is acceptable for this environment, but its data must be kept.

    Which combination of steps will reduce costs MOST effectively while meeting these requirements? (Choose two.)
  fr: |
    L'environnement de test d'une entreprise reproduit la production : un groupe Auto Scaling avec un minimum de 6 instances Amazon EC2 réparties sur trois zones de disponibilité, et une instance de base de données Amazon RDS for MySQL Multi-AZ. L'équipe d'assurance qualité n'utilise cet environnement qu'en semaine, de 8 h 00 à 18 h 00. Une interruption de quelques heures est acceptable pour cet environnement, mais ses données doivent être conservées.

    Quelle combinaison d'étapes réduira les coûts le PLUS efficacement tout en répondant à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Purchase 3-year Standard Reserved Instances for the 6 test instances."
        fr: "Acheter des Standard Reserved Instances sur 3 ans pour les 6 instances de test."
    - id: b
      text:
        en: "Modify the RDS DB instance to use a Single-AZ deployment."
        fr: "Modifier l'instance de base de données RDS pour utiliser un déploiement mono-AZ (Single-AZ)."
    - id: c
      text:
        en: "Convert the DB instance to a Multi-AZ DB cluster with two readable standby instances."
        fr: "Convertir l'instance de base de données en cluster de base de données Multi-AZ avec deux instances de secours lisibles."
    - id: d
      text:
        en: "Turn on storage autoscaling for the RDS DB instance."
        fr: "Activer la mise à l'échelle automatique du stockage pour l'instance de base de données RDS."
    - id: e
      text:
        en: "Add scheduled actions that set the group's minimum and desired capacity to 0 after working hours and restore them each weekday morning."
        fr: "Ajouter des actions planifiées qui fixent à 0 la capacité minimale et souhaitée du groupe après les heures de travail et les rétablissent chaque matin en semaine."
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A test environment that tolerates a few hours of outage does not need a standby DB instance, so a Single-AZ deployment removes the cost of the Multi-AZ standby while keeping the data. Scheduled actions remove the EC2 instances outside the 50 working hours of each week and bring them back each morning, so the company pays for compute only when the team uses it."
    fr: "Un environnement de test qui tolère quelques heures d'interruption n'a pas besoin d'instance de base de données de secours : un déploiement mono-AZ supprime le coût de l'instance de secours Multi-AZ tout en conservant les données. Des actions planifiées suppriment les instances EC2 en dehors des 50 heures de travail hebdomadaires et les rétablissent chaque matin : l'entreprise ne paie la capacité de calcul que lorsque l'équipe l'utilise."
  options:
    a:
      en: "The instances are needed for only about 30% of the week. A 3-year commitment for 24/7 usage costs more than running On-Demand Instances only during working hours."
      fr: "Les instances ne sont nécessaires que pendant environ 30 % de la semaine. Un engagement de 3 ans pour une utilisation 24 h/24 coûte plus cher que des instances à la demande exécutées uniquement pendant les heures de travail."
    c:
      en: "A Multi-AZ DB cluster adds a second standby instance and increases cost; it improves availability that the test environment does not need."
      fr: "Un cluster de base de données Multi-AZ ajoute une deuxième instance de secours et augmente le coût ; il améliore une disponibilité dont l'environnement de test n'a pas besoin."
    d:
      en: "Storage autoscaling grows storage when it runs low; it does not reduce the cost of the environment."
      fr: "La mise à l'échelle automatique du stockage augmente le stockage lorsqu'il vient à manquer ; elle ne réduit pas le coût de l'environnement."
references:
  - title: "Scheduled scaling for Amazon EC2 Auto Scaling"
    url: https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html
  - title: "Multi-AZ DB instance deployments for Amazon RDS"
    url: https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html
