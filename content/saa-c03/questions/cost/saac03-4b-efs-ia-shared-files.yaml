id: saac03-4b-efs-ia-shared-files
objective: "4.1.21"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company runs a Linux-based analysis application on Amazon EC2 instances in three Availability Zones. The instances need a shared POSIX-compliant file system that grows and shrinks automatically. About 80% of the files are not accessed again after 30 days, but they must stay available in the same directory tree without any change to the application.

    Which storage solution will meet these requirements MOST cost-effectively?
  fr: |
    Une société de recherche exécute une application d'analyse sous Linux sur des instances Amazon EC2 réparties dans trois zones de disponibilité. Les instances ont besoin d'un système de fichiers partagé conforme POSIX qui s'agrandit et se réduit automatiquement. Environ 80 % des fichiers ne sont plus consultés après 30 jours, mais ils doivent rester disponibles dans la même arborescence, sans aucune modification de l'application.

    Quelle solution de stockage répondra à ces exigences de la manière la PLUS rentable ?
body:
  options:
    - id: a
      text:
        en: "Create an Amazon FSx for Lustre file system and link it to an S3 bucket that stores the older files."
        fr: "Créer un système de fichiers Amazon FSx for Lustre et l'associer à un compartiment S3 qui stocke les fichiers les plus anciens."
    - id: b
      text:
        en: "Create a Regional Amazon EFS file system with a lifecycle policy that moves files to EFS Infrequent Access after 30 days."
        fr: "Créer un système de fichiers Amazon EFS régional avec une politique de cycle de vie qui déplace les fichiers vers EFS Infrequent Access après 30 jours."
    - id: c
      text:
        en: "Attach a Provisioned IOPS SSD (io2) volume with Multi-Attach enabled to all the instances."
        fr: "Attacher à toutes les instances un volume SSD à IOPS provisionnées (io2) avec Multi-Attach activé."
    - id: d
      text:
        en: "Create a Regional Amazon EFS file system and keep all the files in the EFS Standard storage class."
        fr: "Créer un système de fichiers Amazon EFS régional et conserver tous les fichiers dans la classe de stockage EFS Standard."
answer: { optionId: b }
explanation:
  correct:
    en: "Amazon EFS provides a shared POSIX file system that scales automatically and can be mounted from instances in several Availability Zones. A lifecycle policy moves files that are not accessed for 30 days to EFS Infrequent Access, a cheaper storage class for data accessed a few times each quarter, while the files stay in the same namespace."
    fr: "Amazon EFS fournit un système de fichiers POSIX partagé qui évolue automatiquement et peut être monté depuis des instances de plusieurs zones de disponibilité. Une politique de cycle de vie déplace les fichiers non consultés depuis 30 jours vers EFS Infrequent Access, une classe de stockage moins chère pour des données consultées quelques fois par trimestre, tandis que les fichiers restent dans le même espace de noms."
  options:
    a:
      en: "FSx for Lustre is designed for high-performance computing and its storage capacity is provisioned in advance, so it costs more and does not grow automatically."
      fr: "FSx for Lustre est conçu pour le calcul haute performance et sa capacité de stockage est provisionnée à l'avance : il coûte plus cher et ne s'agrandit pas automatiquement."
    c:
      en: "An EBS volume exists in one Availability Zone and Multi-Attach does not provide a shared file system for instances in three zones. io2 is also an expensive volume type."
      fr: "Un volume EBS se trouve dans une seule zone de disponibilité et Multi-Attach ne fournit pas de système de fichiers partagé pour des instances de trois zones. io2 est en outre un type de volume coûteux."
    d:
      en: "This works, but the company pays EFS Standard prices for the 80% of files that are no longer accessed."
      fr: "Cela fonctionne, mais l'entreprise paie le tarif EFS Standard pour les 80 % de fichiers qui ne sont plus consultés."
references:
  - title: "Features of Amazon EFS"
    url: https://docs.aws.amazon.com/efs/latest/ug/features.html
