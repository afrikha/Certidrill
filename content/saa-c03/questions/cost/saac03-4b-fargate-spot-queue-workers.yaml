id: saac03-4b-fargate-spot-queue-workers
objective: "4.2.12"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company runs short containerized image-processing tasks on Amazon ECS. Each task reads a message from an Amazon SQS queue and can be retried safely if it stops before it finishes. Tasks run several thousand times each day with no predictable schedule. The company does not want to manage EC2 instances and wants to minimize compute costs.

    Which solution will meet these requirements?
  fr: |
    Une entreprise exécute de courtes tâches conteneurisées de traitement d'images sur Amazon ECS. Chaque tâche lit un message dans une file d'attente Amazon SQS et peut être relancée sans risque si elle s'arrête avant la fin. Les tâches s'exécutent plusieurs milliers de fois par jour, sans calendrier prévisible. L'entreprise ne souhaite pas gérer d'instances EC2 et veut réduire au minimum les coûts de calcul.

    Quelle solution répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "Run the tasks on AWS Fargate with a capacity provider strategy that uses the FARGATE_SPOT capacity provider."
        fr: "Exécuter les tâches sur AWS Fargate avec une stratégie de fournisseur de capacité qui utilise le fournisseur de capacité FARGATE_SPOT."
    - id: b
      text:
        en: "Run the tasks on AWS Fargate On-Demand and purchase a 3-year Compute Savings Plan sized for the peak hourly usage."
        fr: "Exécuter les tâches sur AWS Fargate à la demande et acheter un Compute Savings Plan sur 3 ans dimensionné pour l'utilisation horaire de pointe."
    - id: c
      text:
        en: "Run the tasks on an ECS cluster of EC2 Spot Instances that an Auto Scaling group manages."
        fr: "Exécuter les tâches sur un cluster ECS de Spot Instances EC2 géré par un groupe Auto Scaling."
    - id: d
      text:
        en: "Run the tasks on AWS Fargate with the default FARGATE capacity provider at On-Demand prices."
        fr: "Exécuter les tâches sur AWS Fargate avec le fournisseur de capacité FARGATE par défaut, au tarif à la demande."
answer: { optionId: a }
explanation:
  correct:
    en: "Fargate Spot runs interruption-tolerant ECS tasks on spare capacity at a discount compared with the Fargate price, and there are no instances to manage. If a task is interrupted, the SQS message becomes visible again and another task retries it, which these tasks support."
    fr: "Fargate Spot exécute des tâches ECS tolérantes aux interruptions sur de la capacité inutilisée, avec une remise par rapport au tarif Fargate, et sans instance à gérer. Si une tâche est interrompue, le message SQS redevient visible et une autre tâche le retraite, ce que ces tâches permettent."
  options:
    b:
      en: "A commitment sized for the peak of an unpredictable workload leaves most committed hours unused, and Fargate Spot is cheaper for interruptible tasks."
      fr: "Un engagement dimensionné pour la pointe d'une charge de travail imprévisible laisse la plupart des heures engagées inutilisées, et Fargate Spot est moins cher pour des tâches interruptibles."
    c:
      en: "EC2 Spot Instances are cheap, but the company would have to manage the instances, which it does not want."
      fr: "Les Spot Instances EC2 sont peu chères, mais l'entreprise devrait gérer les instances, ce qu'elle ne souhaite pas."
    d:
      en: "Fargate On-Demand works but costs more than Fargate Spot for tasks that tolerate interruption."
      fr: "Fargate à la demande fonctionne, mais coûte plus cher que Fargate Spot pour des tâches qui tolèrent les interruptions."
references:
  - title: "Amazon ECS clusters for Fargate"
    url: https://docs.aws.amazon.com/AmazonECS/latest/developerguide/fargate-capacity-providers.html
