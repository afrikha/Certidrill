id: saac03-4a-compute-optimizer-ebs
objective: "4.1.13"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A company has 1,500 Amazon EBS volumes in several AWS accounts. The operations team suspects that many volumes are over-provisioned in size or IOPS. The team wants recommendations for the right volume type, size and IOPS based on actual utilization, with the LEAST operational overhead.

    Which solution will meet these requirements?
  fr: |
    Une entreprise possède 1 500 volumes Amazon EBS répartis sur plusieurs comptes AWS. L'équipe d'exploitation soupçonne que de nombreux volumes sont surdimensionnés en taille ou en IOPS. Elle veut des recommandations de type de volume, de taille et d'IOPS fondées sur l'utilisation réelle, avec le MOINS de charge opérationnelle.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Opt in to AWS Compute Optimizer and review its Amazon EBS volume recommendations.", fr: "Activer AWS Compute Optimizer et consulter ses recommandations de volumes Amazon EBS." }
    - id: b
      text: { en: "Export the Amazon CloudWatch metrics of every volume and analyze them in a spreadsheet.", fr: "Exporter les métriques Amazon CloudWatch de chaque volume et les analyser dans un tableur." }
    - id: c
      text: { en: "Configure Amazon S3 Storage Lens to report the utilization of each EBS volume.", fr: "Configurer Amazon S3 Storage Lens pour rapporter l'utilisation de chaque volume EBS." }
    - id: d
      text: { en: "Create AWS Budgets usage budgets for EBS storage in each account.", fr: "Créer dans chaque compte des budgets d'utilisation AWS Budgets pour le stockage EBS." }
answer: { optionId: a }
explanation:
  correct:
    en: "AWS Compute Optimizer analyzes 14 days of volume specifications and utilization metrics and classifies each EBS volume as Optimized or Not optimized. Its recommendations give the volume type, size and IOPS, with the monthly price and the estimated savings, and they refresh daily without any analysis work."
    fr: "AWS Compute Optimizer analyse 14 jours de spécifications et de métriques d'utilisation des volumes, et classe chaque volume EBS comme Optimized ou Not optimized. Ses recommandations indiquent le type de volume, la taille et les IOPS, avec le prix mensuel et les économies estimées, et sont actualisées chaque jour sans travail d'analyse."
  options:
    b:
      en: "Exporting and analyzing metrics for 1,500 volumes by hand is the highest-overhead approach."
      fr: "Exporter et analyser à la main les métriques de 1 500 volumes est l'approche la plus coûteuse en charge opérationnelle."
    c:
      en: "S3 Storage Lens reports on Amazon S3 storage and activity; it does not analyze EBS volumes."
      fr: "S3 Storage Lens rapporte sur le stockage et l'activité Amazon S3 ; il n'analyse pas les volumes EBS."
    d:
      en: "Usage budgets alert when usage crosses a threshold; they do not recommend a volume type, size or IOPS."
      fr: "Les budgets d'utilisation alertent lorsque l'utilisation franchit un seuil ; ils ne recommandent ni type de volume, ni taille, ni IOPS."
references:
  - title: Viewing Amazon EBS volume recommendations
    url: https://docs.aws.amazon.com/compute-optimizer/latest/ug/view-ebs-recommendations.html
