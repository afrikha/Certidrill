id: saac03-4c-consolidated-billing-tiers
objective: "4.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A company has six standalone AWS accounts, each with its own payment method. Every account serves content to the internet and pays for data transfer out separately. One account also owns Reserved Instances that it does not fully use, while the other accounts run similar instances On-Demand. The company wants to lower its total bill without changing any architecture.

    Which solution will meet these requirements?
  fr: |
    Une entreprise dispose de six comptes AWS autonomes, chacun avec son propre moyen de paiement. Chaque compte diffuse du contenu sur Internet et paie séparément son transfert de données sortant. L'un des comptes possède aussi des instances réservées qu'il n'utilise pas entièrement, tandis que les autres comptes exécutent des instances similaires à la demande. L'entreprise veut réduire sa facture totale sans modifier l'architecture.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Activate cost allocation tags in each account and review the costs in AWS Cost Explorer.", fr: "Activer les balises de répartition des coûts dans chaque compte et examiner les coûts dans AWS Cost Explorer." }
    - id: b
      text: { en: "Create an AWS Budgets cost budget in each account with an alert at 80 percent of the monthly spend.", fr: "Créer un budget de coûts AWS Budgets dans chaque compte avec une alerte à 80 % des dépenses mensuelles." }
    - id: c
      text: { en: "Move all workloads into a single AWS account and delete the other accounts.", fr: "Déplacer toutes les charges de travail dans un seul compte AWS et supprimer les autres comptes." }
    - id: d
      text: { en: "Invite the accounts into an organization in AWS Organizations and use consolidated billing with Reserved Instance discount sharing.", fr: "Inviter les comptes dans une organisation AWS Organizations et utiliser la facturation consolidée avec le partage des remises des instances réservées." }
answer: { optionId: d }
explanation:
  correct:
    en: Consolidated billing combines the usage of all accounts in the organization, so tiered volume pricing such as data transfer out is reached sooner, and Reserved Instance and Savings Plans discounts are shared with member accounts. It costs nothing extra and needs no architecture change.
    fr: La facturation consolidée cumule l'utilisation de tous les comptes de l'organisation ; les paliers de tarification par volume, comme ceux du transfert de données sortant, sont donc atteints plus vite, et les remises des instances réservées et des Savings Plans sont partagées avec les comptes membres. Elle est gratuite et n'exige aucun changement d'architecture.
  options:
    a:
      en: Cost allocation tags improve visibility, but they do not change any price.
      fr: Les balises de répartition des coûts améliorent la visibilité, mais elles ne modifient aucun prix.
    b:
      en: Budgets send alerts; they do not lower the bill by themselves.
      fr: Les budgets envoient des alertes ; ils ne réduisent pas la facture par eux-mêmes.
    c:
      en: Merging every workload into one account is a major architecture and migration change, which the company wants to avoid.
      fr: Regrouper toutes les charges de travail dans un seul compte est un changement majeur d'architecture et une migration, ce que l'entreprise veut éviter.
references:
  - title: Consolidating billing for AWS Organizations
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
  - title: Reserved Instances and Savings Plans discount sharing
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/ri-turn-off.html
