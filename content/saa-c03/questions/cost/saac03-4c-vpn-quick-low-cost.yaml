id: saac03-4c-vpn-quick-low-cost
objective: "4.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A small company needs encrypted connectivity between its office network and a VPC within a few days. The office already has a firewall that supports IPsec and a stable internet connection. Traffic is low, about 50 Mbps at peak. The company wants the MOST cost-effective solution.

    Which solution will meet these requirements?
  fr: |
    Une petite entreprise a besoin, sous quelques jours, d'une connectivité chiffrée entre le réseau de son bureau et un VPC. Le bureau dispose déjà d'un pare-feu qui prend en charge IPsec et d'une connexion Internet stable. Le trafic est faible, environ 50 Mbit/s en pointe. L'entreprise veut la solution la PLUS rentable.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Order a 1 Gbps AWS Direct Connect dedicated connection and create a private virtual interface.", fr: "Commander une connexion dédiée AWS Direct Connect de 1 Gbit/s et créer une interface virtuelle privée." }
    - id: b
      text: { en: "Create an AWS Site-to-Site VPN connection between a virtual private gateway on the VPC and the office firewall.", fr: "Créer une connexion AWS Site-to-Site VPN entre une passerelle réseau privé virtuel sur le VPC et le pare-feu du bureau." }
    - id: c
      text: { en: "Order a 50 Mbps Direct Connect hosted connection from an AWS Direct Connect Partner.", fr: "Commander une connexion hébergée Direct Connect de 50 Mbit/s auprès d'un partenaire AWS Direct Connect." }
    - id: d
      text: { en: "Give the EC2 instances public IP addresses and allow the office's public IP address in their security groups.", fr: "Attribuer des adresses IP publiques aux instances EC2 et autoriser l'adresse IP publique du bureau dans leurs groupes de sécurité." }
answer: { optionId: b }
explanation:
  correct:
    en: Site-to-Site VPN creates IPsec tunnels over the existing internet connection, with two tunnels per connection for availability. It can be set up quickly with the existing IPsec firewall and costs far less than a physical circuit for 50 Mbps of traffic.
    fr: Site-to-Site VPN crée des tunnels IPsec sur la connexion Internet existante, avec deux tunnels par connexion pour la disponibilité. Elle se met en place rapidement avec le pare-feu IPsec existant et coûte bien moins qu'un circuit physique pour 50 Mbit/s de trafic.
  options:
    a:
      en: A dedicated connection needs a physical cross-connect at a Direct Connect location, takes longer than a few days and charges port hours for 1 Gbps that the company does not need; it is also not encrypted by default.
      fr: Une connexion dédiée exige une interconnexion physique dans un emplacement Direct Connect, prend plus de quelques jours et facture des heures de port pour 1 Gbit/s dont l'entreprise n'a pas besoin ; elle n'est pas non plus chiffrée par défaut.
    c:
      en: A hosted connection still depends on a partner circuit to the office, which is slower to deliver and costs more than a VPN, and it is not encrypted by default.
      fr: Une connexion hébergée dépend toujours d'un circuit partenaire jusqu'au bureau, plus long à livrer et plus coûteux qu'un VPN, et elle n'est pas chiffrée par défaut.
    d:
      en: Public IP addresses expose the instances to the internet and do not provide an encrypted network connection between the office and the VPC.
      fr: Des adresses IP publiques exposent les instances à Internet et ne fournissent pas de connexion réseau chiffrée entre le bureau et le VPC.
references:
  - title: What is AWS Site-to-Site VPN?
    url: https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html
