id: saac03-4c-orders-aurora-carts-dynamodb
objective: "4.3.9"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An ecommerce company is redesigning two parts of its platform. The order service needs ACID transactions across several related tables and SQL reports that join them. The shopping cart service stores each cart by customer ID, must keep single-digit millisecond latency at any scale, and must store carts durably. The company wants managed services that fit each access pattern.

    Which combination of services will meet these requirements? (Choose two.)
  fr: |
    Une entreprise de commerce en ligne repense deux parties de sa plateforme. Le service de commandes a besoin de transactions ACID sur plusieurs tables liées et de rapports SQL qui les joignent. Le service de panier stocke chaque panier par ID client, doit conserver une latence de quelques millisecondes à toute échelle et doit stocker les paniers de manière durable. L'entreprise veut des services gérés adaptés à chaque modèle d'accès.

    Quelle combinaison de services répond à ces exigences ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "Amazon Redshift for the order service", fr: "Amazon Redshift pour le service de commandes" } }
    - { id: b, text: { en: "Amazon DynamoDB for the shopping cart service", fr: "Amazon DynamoDB pour le service de panier" } }
    - { id: c, text: { en: "Amazon Neptune for the shopping cart service", fr: "Amazon Neptune pour le service de panier" } }
    - { id: d, text: { en: "Amazon Aurora PostgreSQL for the order service", fr: "Amazon Aurora PostgreSQL pour le service de commandes" } }
    - { id: e, text: { en: "Amazon Keyspaces (for Apache Cassandra) for the order service", fr: "Amazon Keyspaces (for Apache Cassandra) pour le service de commandes" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: Aurora is a managed relational engine compatible with PostgreSQL and MySQL, so it supports multi-table transactions and SQL joins for the orders. DynamoDB is a serverless key-value and document database with consistent single-digit millisecond latency at any scale, a natural fit for carts looked up by customer ID.
    fr: Aurora est un moteur relationnel géré compatible avec PostgreSQL et MySQL ; il prend donc en charge les transactions multitables et les jointures SQL des commandes. DynamoDB est une base de données clé-valeur et document sans serveur avec une latence constante de quelques millisecondes à toute échelle, un choix naturel pour des paniers recherchés par ID client.
  options:
    a:
      en: Redshift is a data warehouse for analytics, not an OLTP database for order transactions.
      fr: Redshift est un entrepôt de données pour l'analytique, pas une base de données OLTP pour les transactions de commandes.
    c:
      en: Neptune is a graph database for highly connected data; a cart fetched by a single key does not need graph traversals.
      fr: Neptune est une base de données orientée graphe pour des données très connectées ; un panier lu par une seule clé n'a pas besoin de parcours de graphe.
    e:
      en: Keyspaces is a wide-column store compatible with Cassandra; it does not offer relational joins across tables for reporting.
      fr: Keyspaces est un magasin à colonnes larges compatible avec Cassandra ; il ne propose pas de jointures relationnelles entre tables pour le reporting.
references:
  - title: What is Amazon DynamoDB?
    url: https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html
  - title: What is Amazon Aurora?
    url: https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html
