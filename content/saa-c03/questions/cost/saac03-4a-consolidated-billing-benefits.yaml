id: saac03-4a-consolidated-billing-benefits
objective: "4.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A company has six AWS accounts that are billed separately. Each account buys its own Amazon EC2 Reserved Instances: some accounts have unused reservations, while others pay On-Demand rates for the same instance types. The company plans to create an organization in AWS Organizations and to move all six accounts into it with consolidated billing.

    Which two benefits will consolidated billing provide? (Choose two.)
  fr: |
    Une entreprise possède six comptes AWS facturés séparément. Chaque compte achète ses propres instances réservées (Reserved Instances) Amazon EC2 : certains comptes ont des réservations inutilisées, tandis que d'autres paient le tarif à la demande (On-Demand) pour les mêmes types d'instances. L'entreprise prévoit de créer une organisation dans AWS Organizations et d'y déplacer les six comptes avec la facturation consolidée.

    Quels sont les deux avantages qu'apportera la facturation consolidée ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - { id: a, text: { en: "The service quotas of all member accounts are pooled into one shared quota.", fr: "Les quotas de service de tous les comptes membres sont regroupés en un quota partagé." } }
    - { id: b, text: { en: "Usage from all accounts is combined, so volume pricing tiers are reached sooner.", fr: "L'utilisation de tous les comptes est cumulée, ce qui permet d'atteindre plus tôt les paliers de tarifs dégressifs." } }
    - { id: c, text: { en: "Member accounts receive the AWS Business Support plan at no additional cost.", fr: "Les comptes membres bénéficient du plan AWS Business Support sans frais supplémentaires." } }
    - { id: d, text: { en: "The resources of all member accounts are moved into the management account.", fr: "Les ressources de tous les comptes membres sont déplacées dans le compte de gestion." } }
    - { id: e, text: { en: "Unused Reserved Instance discounts of one account can apply to matching usage in other accounts.", fr: "Les remises d'instances réservées inutilisées d'un compte peuvent s'appliquer à l'utilisation correspondante d'autres comptes." } }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "Consolidated billing combines the usage of all accounts in the organization, so the organization shares volume pricing discounts as if it were one account. Reserved Instance and Savings Plans discounts are also shared across accounts, which puts unused reservations to work. Consolidated billing has no additional cost."
    fr: "La facturation consolidée cumule l'utilisation de tous les comptes de l'organisation, qui bénéficie ainsi des remises sur volume comme s'il s'agissait d'un seul compte. Les remises des instances réservées et des Savings Plans sont aussi partagées entre comptes, ce qui rentabilise les réservations inutilisées. La facturation consolidée est sans frais supplémentaires."
  options:
    a:
      en: "Service quotas remain per account and per Region; consolidated billing does not pool them."
      fr: "Les quotas de service restent définis par compte et par Région ; la facturation consolidée ne les regroupe pas."
    c:
      en: "Consolidated billing does not include any AWS Support plan; support plans are purchased separately."
      fr: "La facturation consolidée n'inclut aucun plan AWS Support ; les plans de support s'achètent séparément."
    d:
      en: "Resources stay in their member accounts; only the payment and the bill are consolidated in the management account."
      fr: "Les ressources restent dans leurs comptes membres ; seuls le paiement et la facture sont consolidés dans le compte de gestion."
references:
  - title: Consolidating billing for AWS Organizations
    url: https://docs.aws.amazon.com/awsaccountbilling/latest/aboutv2/consolidated-billing.html
