id: saac03-4a-io2-100k-iops
objective: "4.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A company runs a self-managed database on a Nitro-based Amazon EC2 instance. The database needs a single Amazon EBS volume that sustains 100,000 IOPS with consistent sub-millisecond latency. The volume must offer the highest durability of the EBS volume types.

    Which volume configuration will meet these requirements?
  fr: |
    Une entreprise exécute une base de données autogérée sur une instance Amazon EC2 basée sur Nitro. La base de données a besoin d'un seul volume Amazon EBS qui soutient 100 000 IOPS avec une latence constante inférieure à la milliseconde. Le volume doit offrir la durabilité la plus élevée parmi les types de volumes EBS.

    Quelle configuration de volume répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "A General Purpose SSD (gp3) volume provisioned with 100,000 IOPS", fr: "Un volume General Purpose SSD (gp3) provisionné avec 100 000 IOPS" }
    - id: b
      text: { en: "A Provisioned IOPS SSD (io1) volume provisioned with 100,000 IOPS", fr: "Un volume Provisioned IOPS SSD (io1) provisionné avec 100 000 IOPS" }
    - id: c
      text: { en: "A Provisioned IOPS SSD (io2 Block Express) volume provisioned with 100,000 IOPS", fr: "Un volume Provisioned IOPS SSD (io2 Block Express) provisionné avec 100 000 IOPS" }
    - id: d
      text: { en: "A Throughput Optimized HDD (st1) volume of the maximum size", fr: "Un volume Throughput Optimized HDD (st1) de la taille maximale" }
answer: { optionId: c }
explanation:
  correct:
    en: "io2 Block Express supports up to 256,000 IOPS per volume on Nitro-based instances, with consistent sub-millisecond latency and 99.999% durability, the highest of all EBS volume types. AWS recommends it for workloads that need more than 80,000 IOPS."
    fr: "io2 Block Express prend en charge jusqu'à 256 000 IOPS par volume sur les instances basées sur Nitro, avec une latence constante inférieure à la milliseconde et une durabilité de 99,999 %, la plus élevée des types de volumes EBS. AWS le recommande pour les charges qui exigent plus de 80 000 IOPS."
  options:
    a:
      en: "gp3 tops out at 80,000 IOPS per volume, and its durability (99.8% to 99.9%) is lower than io2 Block Express."
      fr: "gp3 plafonne à 80 000 IOPS par volume, et sa durabilité (99,8 % à 99,9 %) est inférieure à celle d'io2 Block Express."
    b:
      en: "io1 supports at most 64,000 IOPS per volume and has the same 99.8% to 99.9% durability as gp3."
      fr: "io1 prend en charge au plus 64 000 IOPS par volume et a la même durabilité de 99,8 % à 99,9 % que gp3."
    d:
      en: "st1 is an HDD type designed for sequential throughput; it delivers at most 500 IOPS."
      fr: "st1 est un type HDD conçu pour le débit séquentiel ; il fournit au plus 500 IOPS."
references:
  - title: Amazon EBS volume types
    url: https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volume-types.html
