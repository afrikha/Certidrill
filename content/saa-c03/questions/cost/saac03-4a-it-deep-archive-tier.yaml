id: saac03-4a-it-deep-archive-tier
objective: "4.1.10"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A research company stores 5 PB of experiment data in S3 Intelligent-Tiering. Many objects are not accessed for more than 6 months, but any object can be needed again without warning. The analysis application can be updated to restore objects, and it can wait up to 12 hours for an object that has not been accessed for 6 months or more. The company wants to lower costs further while keeping tiering automatic and based on actual access.

    Which solution will meet these requirements?
  fr: |
    Une entreprise de recherche stocke 5 Po de données d'expériences dans S3 Intelligent-Tiering. De nombreux objets ne sont pas consultés pendant plus de 6 mois, mais n'importe quel objet peut redevenir nécessaire sans préavis. L'application d'analyse peut être modifiée pour restaurer les objets et peut attendre jusqu'à 12 heures un objet qui n'a pas été consulté depuis 6 mois ou plus. L'entreprise veut réduire encore ses coûts, tout en conservant une hiérarchisation automatique fondée sur l'accès réel.

    Quelle solution répond à ces exigences ?
body:
  options:
    - id: a
      text: { en: "Add an S3 Lifecycle rule that transitions all objects to S3 Glacier Deep Archive 180 days after creation.", fr: "Ajouter une règle de cycle de vie S3 qui fait passer tous les objets à S3 Glacier Deep Archive 180 jours après leur création." }
    - id: b
      text: { en: "Activate the Deep Archive Access tier in the bucket's Intelligent-Tiering configuration for objects not accessed for 180 days.", fr: "Activer le niveau Deep Archive Access dans la configuration Intelligent-Tiering du compartiment pour les objets non consultés depuis 180 jours." }
    - id: c
      text: { en: "Add an S3 Lifecycle rule that transitions all objects to S3 Glacier Flexible Retrieval 180 days after creation.", fr: "Ajouter une règle de cycle de vie S3 qui fait passer tous les objets à S3 Glacier Flexible Retrieval 180 jours après leur création." }
    - id: d
      text: { en: "Move the objects to S3 Standard-IA and use S3 Storage Class Analysis to find the objects to archive.", fr: "Déplacer les objets vers S3 Standard-IA et utiliser l'analyse des classes de stockage S3 pour repérer les objets à archiver." }
answer: { optionId: b }
explanation:
  correct:
    en: "The optional Deep Archive Access tier of S3 Intelligent-Tiering moves objects that have not been accessed for at least 180 consecutive days to the lowest-cost tier, still based on each object's actual access. Archived objects must be restored first, and a standard restore from this tier completes within 12 hours."
    fr: "Le niveau facultatif Deep Archive Access de S3 Intelligent-Tiering déplace vers le niveau le moins coûteux les objets non consultés depuis au moins 180 jours consécutifs, toujours en fonction de l'accès réel à chaque objet. Les objets archivés doivent d'abord être restaurés, et une restauration standard depuis ce niveau aboutit en 12 heures maximum."
  options:
    a:
      en: "A lifecycle rule acts on object age, not on access, so objects still in use would be archived and every read of them would need a restore."
      fr: "Une règle de cycle de vie agit selon l'âge des objets, pas selon l'accès : des objets encore utilisés seraient archivés et chaque lecture exigerait une restauration."
    c:
      en: "This rule is also based on age rather than access, and Flexible Retrieval costs more than the Deep Archive Access tier for data the application can wait 12 hours for."
      fr: "Cette règle se fonde elle aussi sur l'âge et non sur l'accès, et S3 Glacier Flexible Retrieval coûte plus cher que le niveau Deep Archive Access pour des données que l'application peut attendre 12 heures."
    d:
      en: "Standard-IA costs more than the Intelligent-Tiering archive tiers and adds retrieval fees, and Storage Class Analysis only recommends Standard to Standard-IA transitions."
      fr: "S3 Standard-IA coûte plus cher que les niveaux d'archive d'Intelligent-Tiering et ajoute des frais de récupération, et l'analyse des classes de stockage ne recommande que des transitions de Standard vers Standard-IA."
references:
  - title: How S3 Intelligent-Tiering works
    url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/intelligent-tiering-overview.html
