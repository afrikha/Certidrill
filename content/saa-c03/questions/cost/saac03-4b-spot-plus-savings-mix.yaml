id: saac03-4b-spot-plus-savings-mix
objective: "4.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A video platform has two workloads on Amazon EC2. A web tier runs on 10 instances of the same instance family 24 hours a day, with stable usage that is expected to continue for the next 3 years. A transcoding tier processes queued jobs that can be restarted if an instance stops, and its job volume varies widely during the day.

    Which combination of purchasing options will meet these requirements MOST cost-effectively? (Choose two.)
  fr: |
    Une plateforme vidéo exécute deux charges de travail sur Amazon EC2. Un niveau web tourne 24 heures sur 24 sur 10 instances de la même famille, avec une utilisation stable qui devrait se maintenir pendant les 3 prochaines années. Un niveau de transcodage traite des tâches mises en file d'attente qui peuvent être relancées si une instance s'arrête, et son volume de tâches varie fortement au cours de la journée.

    Quelle combinaison d'options d'achat répondra à ces exigences de la manière la PLUS rentable ? (Choisissez deux réponses.)
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Create On-Demand Capacity Reservations for the 10 web tier instances."
        fr: "Créer des réservations de capacité à la demande (On-Demand Capacity Reservations) pour les 10 instances du niveau web."
    - id: b
      text:
        en: "Purchase a 3-year EC2 Instance Savings Plan for the web tier's instance family in its Region."
        fr: "Acheter un EC2 Instance Savings Plan sur 3 ans pour la famille d'instances du niveau web dans sa Région."
    - id: c
      text:
        en: "Purchase 3-year Standard Reserved Instances for the peak number of transcoding instances."
        fr: "Acheter des Standard Reserved Instances sur 3 ans pour le nombre maximal d'instances de transcodage."
    - id: d
      text:
        en: "Run the transcoding tier on Spot Instances in an Auto Scaling group that uses several instance types."
        fr: "Exécuter le niveau de transcodage sur des Spot Instances dans un groupe Auto Scaling qui utilise plusieurs types d'instances."
    - id: e
      text:
        en: "Run both tiers on Dedicated Instances to avoid capacity interruptions."
        fr: "Exécuter les deux niveaux sur des instances dédiées (Dedicated Instances) pour éviter les interruptions de capacité."
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The web tier has steady, long-term usage in one instance family, which is the use case for an EC2 Instance Savings Plan and its deepest Savings Plans discount. The transcoding jobs tolerate interruption and their volume varies, so Spot Instances, diversified across instance types, give the largest discount without paying for idle commitments."
    fr: "Le niveau web présente une utilisation stable et durable dans une seule famille d'instances, ce qui correspond à un EC2 Instance Savings Plan et à sa remise Savings Plans la plus élevée. Les tâches de transcodage tolèrent les interruptions et leur volume varie : des Spot Instances, réparties sur plusieurs types d'instances, offrent la plus forte remise sans payer d'engagement inutilisé."
  options:
    a:
      en: "Capacity Reservations guarantee capacity in an Availability Zone but are billed at On-Demand rates; they provide no discount on their own."
      fr: "Les réservations de capacité garantissent de la capacité dans une zone de disponibilité, mais sont facturées au tarif à la demande ; elles n'apportent aucune remise par elles-mêmes."
    c:
      en: "Reserving the peak capacity of a variable workload means paying for reserved hours that stay unused most of the day."
      fr: "Réserver la capacité de pointe d'une charge de travail variable revient à payer des heures réservées inutilisées la majeure partie de la journée."
    e:
      en: "Dedicated Instances cost more than default tenancy and do not reduce interruptions for this workload; they meet no stated requirement."
      fr: "Les instances dédiées coûtent plus cher que la location par défaut et ne réduisent pas les interruptions pour cette charge de travail ; elles ne répondent à aucune exigence énoncée."
references:
  - title: "Savings Plans types"
    url: https://docs.aws.amazon.com/savingsplans/latest/userguide/plan-types.html
