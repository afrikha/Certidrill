id: saac03-4b-bare-metal-vendor-support
objective: "4.2.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A software company must run a legacy application that its vendor supports only in a non-virtualized environment. The application also needs direct access to low-level processor features. The company wants to run the application on AWS and pay only for the hours that the application runs.

    Which Amazon EC2 option will meet these requirements?
  fr: |
    Un éditeur de logiciels doit exécuter une application ancienne que son fournisseur ne prend en charge que dans un environnement non virtualisé. L'application a également besoin d'un accès direct à des fonctionnalités de bas niveau du processeur. L'entreprise souhaite exécuter l'application sur AWS et ne payer que les heures pendant lesquelles l'application s'exécute.

    Quelle option Amazon EC2 répondra à ces exigences ?
body:
  options:
    - id: a
      text:
        en: "An m5.4xlarge instance launched on an EC2 Dedicated Host"
        fr: "Une instance m5.4xlarge lancée sur un hôte dédié EC2 (Dedicated Host)"
    - id: b
      text:
        en: "A c7i.4xlarge On-Demand Instance with default tenancy"
        fr: "Une instance à la demande c7i.4xlarge avec la location par défaut"
    - id: c
      text:
        en: "An m5.metal On-Demand Instance"
        fr: "Une instance à la demande m5.metal"
    - id: d
      text:
        en: "An m5.4xlarge Spot Instance"
        fr: "Une Spot Instance m5.4xlarge"
answer: { optionId: c }
explanation:
  correct:
    en: "Bare metal instances such as m5.metal remove the virtualization layer and give the application full access to the host hardware, including low-level processor features. AWS recommends them for applications that require a non-virtualized environment for licensing or support, and they are billed like other On-Demand Instances."
    fr: "Les instances bare metal comme m5.metal suppriment la couche de virtualisation et donnent à l'application un accès complet au matériel de l'hôte, y compris aux fonctionnalités de bas niveau du processeur. AWS les recommande pour les applications qui exigent un environnement non virtualisé pour des raisons de licence ou de support, et elles sont facturées comme les autres instances à la demande."
  options:
    a:
      en: "A Dedicated Host dedicates a physical server to the company, but the m5.4xlarge instance on it is still virtualized."
      fr: "Un hôte dédié réserve un serveur physique à l'entreprise, mais l'instance m5.4xlarge qu'il héberge reste virtualisée."
    b:
      en: "A c7i.4xlarge instance runs on a hypervisor, which the vendor does not support."
      fr: "Une instance c7i.4xlarge s'exécute sur un hyperviseur, ce que le fournisseur ne prend pas en charge."
    d:
      en: "A Spot Instance of this size is virtualized and can also be interrupted."
      fr: "Une Spot Instance de cette taille est virtualisée et peut en outre être interrompue."
references:
  - title: "Instances built on the AWS Nitro System"
    url: https://docs.aws.amazon.com/ec2/latest/instancetypes/ec2-nitro-instances.html
