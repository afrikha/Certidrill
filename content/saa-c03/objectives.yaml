# SAA-C03 objectives — AWS Certified Solutions Architect – Associate (SAA-C03) Exam Guide,
# version 1.1 (October 29, 2026), English and French (fr_fr) guides, checked on 2026-11-19.
# One group per task statement; objectives = every "Knowledge of" bullet, then every
# "Skills in" bullet of that task statement, in the guide's order. Codes <domain>.<task>.<n>.
# `code` is the stable key referenced by question files and course sections.
# English: verbatim. French: verbatim from the fr_fr guide, except these edits
# (BRIEF-AWS §6, AWS names stay in English):
#   - "régions AWS" written "Régions AWS" (1.1.3, 2.2.1, 2.2.14, 3.3.1, 4.2.3, 4.4.10);
#   - 2.2.2: "Services gérés AWS (AMS)" -> "Services gérés AWS" (AMS is another product);
#   - 2.2.9: "proxy Amazon RDS" -> "Amazon RDS Proxy";
#   - 4.1.3, 4.2.2, 4.3.2, 4.4.2: "Rapport d'utilisation et de coût AWS" -> "AWS Cost and Usage Report";
#   - 4.2.4: "instances Spot, instances réservées" -> "Spot Instances, Reserved Instances";
#   - 4.2.10: "par rapport Network Load Balancer [couche 4] ou Gateway Load Balancer"
#     -> "par rapport au Network Load Balancer [couche 4] ou au Gateway Load Balancer".
secure:
- group:
    en: Design secure access to AWS resources
    fr: Concevoir un accès sécurisé aux ressources AWS
  objectives:
  - code: 1.1.1
    en: Access controls and management across multiple accounts
    fr: Contrôles d'accès et gestion sur plusieurs comptes
  - code: 1.1.2
    en: AWS federated access and identity services (for example, IAM, AWS IAM Identity Center)
    fr: Services d'accès et d'identité fédérés AWS (par exemple, IAM, AWS IAM Identity Center)
  - code: 1.1.3
    en: AWS global infrastructure (for example, Availability Zones, AWS Regions)
    fr: Infrastructure globale AWS (par exemple, zones de disponibilité [AZ], Régions AWS)
  - code: 1.1.4
    en: AWS security best practices (for example, the principle of least privilege)
    fr: Bonnes pratiques de sécurité AWS (par exemple, principe du moindre privilège)
  - code: 1.1.5
    en: The AWS shared responsibility model
    fr: Modèle de responsabilité partagée AWS
  - code: 1.1.6
    en: Applying AWS security best practices to IAM users and root users (for example, multi-factor authentication [MFA])
    fr: Application des bonnes pratiques de sécurité AWS aux utilisateurs IAM et aux utilisateurs racine (par exemple, authentification multifacteur [MFA])
  - code: 1.1.7
    en: Designing a flexible authorization model that includes IAM users, groups, roles, and policies
    fr: Conception d'un modèle d'autorisation flexible incluant les utilisateurs, groupes, rôles et politiques IAM
  - code: 1.1.8
    en: Designing a role-based access control strategy (for example, AWS STS, role switching, cross-account access)
    fr: Conception d'une stratégie de contrôle d'accès basée sur les rôles (par exemple, AWS STS, changement de rôle, accès intercompte)
  - code: 1.1.9
    en: Designing a security strategy for multiple AWS accounts (for example, AWS Control Tower, service control policies [SCPs])
    fr: Conception d'une stratégie de sécurité pour plusieurs comptes AWS (par exemple, AWS Control Tower, stratégies de contrôle des services [SCP])
  - code: 1.1.10
    en: Determining the appropriate use of resource policies for AWS services
    fr: Détermination de l'utilisation appropriée des politiques de ressources pour les services AWS
  - code: 1.1.11
    en: Determining when to federate a directory service with IAM roles
    fr: Détermination du moment opportun pour fédérer un service d'annuaire avec des rôles IAM
- group:
    en: Design secure workloads and applications
    fr: Concevoir des charges de travail et des applications sécurisées
  objectives:
  - code: 1.2.1
    en: Application configuration and credentials security
    fr: Configuration de l'application et sécurité des informations d'identification
  - code: 1.2.2
    en: AWS service endpoints
    fr: Points de terminaison de service AWS
  - code: 1.2.3
    en: Control ports, protocols, and network traffic on AWS
    fr: Contrôle des ports, des protocoles et du trafic réseau sur AWS
  - code: 1.2.4
    en: Secure application access
    fr: Accès sécurisé aux applications
  - code: 1.2.5
    en: Security services with appropriate use cases (for example, Amazon Cognito, Amazon GuardDuty, Amazon Macie)
    fr: Services de sécurité avec cas d'utilisation appropriés (par exemple, Amazon Cognito, Amazon GuardDuty, Amazon Macie)
  - code: 1.2.6
    en: Threat vectors external to AWS (for example, DDoS, SQL injection)
    fr: Vecteurs de menace externes à AWS (par exemple, attaque par déni de service [DDoS], injection SQL)
  - code: 1.2.7
    en: Designing VPC architectures with security components (for example, security groups, route tables, network ACLs, NAT gateways)
    fr: Conception d'architectures VPC avec des composants de sécurité (par exemple, groupes de sécurité, tables de routage, ACL réseau, passerelles NAT)
  - code: 1.2.8
    en: Determining network segmentation strategies (for example, using public subnets and private subnets)
    fr: Détermination des stratégies de segmentation du réseau (par exemple, en utilisant des sous-réseaux publics et des sous-réseaux privés)
  - code: 1.2.9
    en: Integrating AWS services to secure applications (for example, AWS Shield, AWS WAF, IAM Identity Center, AWS Secrets Manager)
    fr: Intégration des services AWS pour sécuriser les applications (par exemple, AWS Shield, AWS WAF, IAM Identity Center, AWS Secrets Manager)
  - code: 1.2.10
    en: Securing external network connections to and from the AWS Cloud (for example, VPN, AWS Direct Connect)
    fr: Sécurisation des connexions réseau externes vers et depuis le Cloud AWS (par exemple, VPN, AWS Direct Connect)
- group:
    en: Determine appropriate data security controls
    fr: Déterminer les contrôles de sécurité des données appropriés
  objectives:
  - code: 1.3.1
    en: Data access and governance
    fr: Accès aux données et gouvernance
  - code: 1.3.2
    en: Data recovery
    fr: Récupération des données
  - code: 1.3.3
    en: Data retention and classification
    fr: Conservation et classification des données
  - code: 1.3.4
    en: Encryption and appropriate key management
    fr: Chiffrement et gestion appropriée des clés
  - code: 1.3.5
    en: Aligning AWS technologies to meet compliance requirements
    fr: Alignement des technologies AWS pour répondre aux exigences de conformité
  - code: 1.3.6
    en: Encrypting data at rest (for example, AWS KMS)
    fr: Chiffrement des données au repos (par exemple, AWS KMS)
  - code: 1.3.7
    en: Encrypting data in transit (for example, AWS Certificate Manager [ACM] using TLS)
    fr: Chiffrement des données en transit (par exemple, AWS Certificate Manager [ACM] à l'aide de TLS)
  - code: 1.3.8
    en: Implementing access policies for encryption keys
    fr: Mise en œuvre de stratégies d'accès pour les clés de chiffrement
  - code: 1.3.9
    en: Implementing data backups and replications
    fr: Mise en œuvre de sauvegardes et de réplications des données
  - code: 1.3.10
    en: Implementing policies for data access, lifecycle, and protection
    fr: Mise en œuvre de stratégies pour l'accès aux données, leur cycle de vie et leur protection
  - code: 1.3.11
    en: Rotating encryption keys and renewing certificates
    fr: Rotation des clés de chiffrement et renouvellement des certificats
resilient:
- group:
    en: Design scalable and loosely coupled architectures
    fr: Concevoir des architectures pouvant être mises à l'échelle et à faible couplage
  objectives:
  - code: 2.1.1
    en: API creation and management (for example, Amazon API Gateway, REST API)
    fr: Création et gestion d'API (par exemple, Amazon API Gateway, API REST)
  - code: 2.1.2
    en: AWS managed services with appropriate use cases (for example, AWS Transfer Family, Amazon SQS, AWS Secrets Manager)
    fr: Services gérés AWS avec cas d'utilisation appropriés (par exemple, AWS Transfer Family, Amazon SQS, AWS Secrets Manager)
  - code: 2.1.3
    en: Caching strategies
    fr: Stratégies de mise en cache
  - code: 2.1.4
    en: Design principles for microservices (for example, stateless workloads compared with stateful workloads)
    fr: Principes de conception pour les microservices (par exemple, charges de travail sans état par rapport aux charges de travail avec état)
  - code: 2.1.5
    en: Event-driven architectures
    fr: Architectures basées sur les événements
  - code: 2.1.6
    en: Horizontal scaling and vertical scaling
    fr: Mise à l'échelle horizontale et verticale
  - code: 2.1.7
    en: How to appropriately use edge accelerators (for example, content delivery network [CDN])
    fr: Comment utiliser correctement les accélérateurs périphériques (par exemple, réseau de diffusion de contenu [CDN])
  - code: 2.1.8
    en: How to migrate applications into containers
    fr: Comment migrer des applications vers des conteneurs
  - code: 2.1.9
    en: Load balancing concepts (for example, Application Load Balancer [ALB])
    fr: Concepts de répartition de charge (par exemple, Application Load Balancer [ALB])
  - code: 2.1.10
    en: Multi-tier architectures
    fr: Architectures à plusieurs niveaux
  - code: 2.1.11
    en: Queuing and messaging concepts (for example, publish/subscribe)
    fr: Concepts de mise en file d'attente et de messagerie (par exemple, publication/abonnement)
  - code: 2.1.12
    en: Serverless technologies and patterns (for example, AWS Fargate, AWS Lambda)
    fr: Technologies et modèles sans serveur (par exemple, AWS Fargate, AWS Lambda)
  - code: 2.1.13
    en: Storage types with associated characteristics (for example, object, file, block)
    fr: Types de stockage et caractéristiques associées (par exemple, objet, fichier, bloc)
  - code: 2.1.14
    en: The orchestration of containers (for example, Amazon ECS, Amazon EKS)
    fr: Orchestration des conteneurs (par exemple, Amazon ECS, Amazon EKS)
  - code: 2.1.15
    en: When to use read replicas
    fr: Quand utiliser des réplicas en lecture
  - code: 2.1.16
    en: Workflow orchestration (for example, AWS Step Functions)
    fr: Orchestration du flux de travail (par exemple, AWS Step Functions)
  - code: 2.1.17
    en: Designing event-driven, microservice, and/or multi-tier architectures based on requirements
    fr: Conception d'architectures basées sur les événements, d'architectures de microservices et/ou d'architectures à plusieurs niveaux en fonction des exigences
  - code: 2.1.18
    en: Determining scaling strategies for components used in an architecture design
    fr: Détermination des stratégies de mise à l'échelle des composants utilisés dans la conception d'une architecture
  - code: 2.1.19
    en: Determining the AWS services required to achieve loose coupling based on requirements
    fr: Identification des services AWS nécessaires pour obtenir un couplage faible en fonction des exigences
  - code: 2.1.20
    en: Determining when to use containers
    fr: Détermination du moment opportun pour utiliser les conteneurs
  - code: 2.1.21
    en: Determining when to use serverless technologies and patterns
    fr: Détermination du moment opportun pour utiliser les technologies et les modèles sans serveur
  - code: 2.1.22
    en: Recommending appropriate compute, storage, networking, and database technologies based on requirements
    fr: Recommandation de technologies de calcul, de stockage, de mise en réseau et de base de données appropriées en fonction des besoins
  - code: 2.1.23
    en: Using purpose-built AWS services for workloads
    fr: Utilisation de services AWS sur mesure pour les charges de travail
- group:
    en: Design highly available and/or fault-tolerant architectures
    fr: Concevoir des architectures hautement disponibles et/ou tolérantes aux pannes
  objectives:
  - code: 2.2.1
    en: AWS global infrastructure (for example, Availability Zones, AWS Regions, Amazon Route 53)
    fr: Infrastructure mondiale AWS (par exemple, zones de disponibilité [AZ], Régions AWS, Amazon Route 53)
  - code: 2.2.2
    en: AWS managed services with appropriate use cases (for example, Amazon Comprehend, Amazon Polly)
    fr: Services gérés AWS avec cas d'utilisation appropriés (par exemple, Amazon Comprehend, Amazon Polly)
  - code: 2.2.3
    en: Basic networking concepts (for example, route tables)
    fr: Concepts de mise en réseau basique (par exemple, tables de routage)
  - code: 2.2.4
    en: Disaster recovery (DR) strategies (for example, backup and restore, pilot light, warm standby, active-active failover, recovery point objective [RPO], recovery time objective [RTO])
    fr: Stratégies de reprise après sinistre (DR) (par exemple, sauvegarde et restauration, environnement de veille, secours semi-automatique, basculement actif/actif, objectif de point de récupération [RPO], objectif de temps de récupération [RTO])
  - code: 2.2.5
    en: Distributed design patterns
    fr: Modèles de conception distribués
  - code: 2.2.6
    en: Failover strategies
    fr: Stratégies de basculement
  - code: 2.2.7
    en: Immutable infrastructure
    fr: Infrastructure immuable
  - code: 2.2.8
    en: Load balancing concepts (for example, ALB)
    fr: Concepts de répartition de charge (par exemple, ALB)
  - code: 2.2.9
    en: Proxy concepts (for example, Amazon RDS Proxy)
    fr: Concepts de proxy (par exemple, Amazon RDS Proxy)
  - code: 2.2.10
    en: Service quotas and throttling (for example, how to configure the service quotas for a workload in a standby environment)
    fr: Quotas de service et limitation (par exemple, comment configurer les quotas de service pour une charge de travail dans un environnement de secours)
  - code: 2.2.11
    en: Storage options and characteristics (for example, durability, replication)
    fr: Options et caractéristiques de stockage (par exemple, durabilité, réplication)
  - code: 2.2.12
    en: Workload visibility (for example, AWS X-Ray)
    fr: Visibilité des charges de travail (par exemple, AWS X-Ray)
  - code: 2.2.13
    en: Determining automation strategies to ensure infrastructure integrity
    fr: Détermination des stratégies d'automatisation pour garantir l'intégrité de l'infrastructure
  - code: 2.2.14
    en: Determining the AWS services required to provide a highly available and/or fault-tolerant architecture across AWS Regions or Availability Zones
    fr: Identification des services AWS nécessaires pour fournir une architecture hautement disponible et/ou tolérante aux pannes dans les Régions ou les zones de disponibilité (AZ) AWS
  - code: 2.2.15
    en: Identifying metrics based on business requirements to deliver a highly available solution
    fr: Identification des métriques en fonction des exigences métier pour fournir une solution hautement disponible
  - code: 2.2.16
    en: Implementing designs to mitigate single points of failure
    fr: Mise en œuvre de conceptions visant à atténuer les points d'échec uniques
  - code: 2.2.17
    en: Implementing strategies to ensure the durability and availability of data (for example, backups)
    fr: Mise en œuvre de stratégies visant à garantir la durabilité et la disponibilité des données (par exemple, sauvegardes)
  - code: 2.2.18
    en: Selecting an appropriate DR strategy to meet business requirements
    fr: Sélection d'une stratégie de reprise après sinistre adaptée aux exigences métier
  - code: 2.2.19
    en: Using AWS services that improve the reliability of legacy applications and applications not built for the cloud (for example, when application changes are not possible)
    fr: Utilisation de services AWS qui améliorent la fiabilité des applications héritées et des applications qui ne sont pas conçues pour le cloud (par exemple, lorsque les changements d'applications ne sont pas possibles)
  - code: 2.2.20
    en: Using purpose-built AWS services for workloads
    fr: Utilisation de services AWS sur mesure pour les charges de travail
performance:
- group:
    en: Determine high-performing and/or scalable storage solutions
    fr: Déterminer les solutions de stockage hautement performantes et/ou pouvant être mises à l'échelle
  objectives:
  - code: 3.1.1
    en: Hybrid storage solutions to meet business requirements
    fr: Solutions de stockage hybride pour répondre aux exigences métier
  - code: 3.1.2
    en: Storage services with appropriate use cases (for example, Amazon S3, Amazon EFS, Amazon EBS)
    fr: Services de stockage avec cas d'utilisation appropriés (par exemple, Amazon S3, Amazon EFS, Amazon EBS)
  - code: 3.1.3
    en: Storage types with associated characteristics (for example, object, file, block)
    fr: Types de stockage et caractéristiques associées (par exemple, objet, fichier, bloc)
  - code: 3.1.4
    en: Determining storage services and configurations that meet performance demands
    fr: Détermination des services et des configurations de stockage qui répondent aux exigences de performances
  - code: 3.1.5
    en: Determining storage services that can scale to accommodate future needs
    fr: Identification des services de stockage pouvant être mis à l'échelle pour répondre à l'évolution des besoins
- group:
    en: Design high-performing and elastic compute solutions
    fr: Concevoir des solutions de calcul hautement performantes et élastiques
  objectives:
  - code: 3.2.1
    en: AWS compute services with appropriate use cases (for example, AWS Batch, Amazon EMR, AWS Fargate)
    fr: Services de calcul AWS avec cas d'utilisation appropriés (par exemple, AWS Batch, Amazon EMR, AWS Fargate)
  - code: 3.2.2
    en: Distributed computing concepts supported by AWS global infrastructure and edge services
    fr: Concepts d'informatique distribuée pris en charge par l'infrastructure mondiale et les services périphériques d'AWS
  - code: 3.2.3
    en: Queuing and messaging concepts (for example, publish/subscribe)
    fr: Concepts de mise en file d'attente et de messagerie (par exemple, publication/abonnement)
  - code: 3.2.4
    en: Scalability capabilities with appropriate use cases (for example, Amazon EC2 Auto Scaling, AWS Auto Scaling)
    fr: Possibilités de capacité de mise à l'échelle avec cas d'utilisation appropriés (par exemple, Amazon EC2 Auto Scaling, AWS Auto Scaling)
  - code: 3.2.5
    en: Serverless technologies and patterns (for example, AWS Lambda, Fargate)
    fr: Technologies et modèles sans serveur (par exemple, AWS Lambda, Fargate)
  - code: 3.2.6
    en: The orchestration of containers (for example, Amazon ECS, Amazon EKS)
    fr: Orchestration des conteneurs (par exemple, Amazon ECS, Amazon EKS)
  - code: 3.2.7
    en: Decoupling workloads so that components can scale independently
    fr: Découplage des charges de travail afin que les composants puissent être mis à l'échelle indépendamment
  - code: 3.2.8
    en: Identifying metrics and conditions to perform scaling actions
    fr: Identification des métriques et des conditions pour effectuer des actions de mise à l'échelle
  - code: 3.2.9
    en: Selecting the appropriate compute options and features (for example, EC2 instance types) to meet business requirements
    fr: Sélection des options et des fonctionnalités de calcul appropriées (par exemple, types d'instance EC2) pour répondre aux exigences métier
  - code: 3.2.10
    en: Selecting the appropriate resource type and size (for example, the amount of Lambda memory) to meet business requirements
    fr: Sélection du type et de la taille de ressource appropriés (par exemple, quantité de mémoire Lambda) pour répondre aux besoins métier
- group:
    en: Determine high-performing database solutions
    fr: Identifier les solutions de base de données hautement performantes
  objectives:
  - code: 3.3.1
    en: AWS global infrastructure (for example, Availability Zones, AWS Regions)
    fr: Infrastructure globale AWS (par exemple, zones de disponibilité [AZ], Régions AWS)
  - code: 3.3.2
    en: Caching strategies and services (for example, Amazon ElastiCache)
    fr: Stratégies et services de mise en cache (par exemple, Amazon ElastiCache)
  - code: 3.3.3
    en: Data access patterns (for example, read-intensive compared with write-intensive)
    fr: Modèles d'accès aux données (par exemple, utilisation intensive en lecture par rapport à une utilisation intensive en écriture)
  - code: 3.3.4
    en: Database capacity planning (for example, capacity units, instance types, Provisioned IOPS)
    fr: Planification de la capacité de la base de données (par exemple, unités de capacité, types d'instance, IOPS provisionnées)
  - code: 3.3.5
    en: Database connections and proxies
    fr: Connexions aux bases de données et proxies
  - code: 3.3.6
    en: Database engines with appropriate use cases (for example, heterogeneous migrations, homogeneous migrations)
    fr: Moteurs de base de données avec cas d'utilisation appropriés (par exemple, migrations hétérogènes, migrations homogènes)
  - code: 3.3.7
    en: Database replication (for example, read replicas)
    fr: Réplication de base de données (par exemple, réplicas en lecture)
  - code: 3.3.8
    en: Database types and services (for example, serverless, relational compared with non-relational, in-memory)
    fr: Types et services de base de données (par exemple, sans serveur, relationnel par rapport à non relationnel, en mémoire)
  - code: 3.3.9
    en: Configuring read replicas to meet business requirements
    fr: Configuration des réplicas en lecture pour répondre aux exigences métier
  - code: 3.3.10
    en: Designing database architectures
    fr: Conception d'architectures de base de données
  - code: 3.3.11
    en: Determining an appropriate database engine (for example, MySQL compared with PostgreSQL)
    fr: Détermination d'un moteur de base de données approprié (par exemple, MySQL par rapport à PostgreSQL)
  - code: 3.3.12
    en: Determining an appropriate database type (for example, Amazon Aurora, Amazon DynamoDB)
    fr: Détermination d'un type de base de données approprié (par exemple, Amazon Aurora, Amazon DynamoDB)
  - code: 3.3.13
    en: Integrating caching to meet business requirements
    fr: Intégration de la mise en cache pour répondre aux exigences métier
- group:
    en: Determine high-performing and/or scalable network architectures
    fr: Déterminer les architectures réseau hautement performantes et/ou pouvant être mises à l'échelle
  objectives:
  - code: 3.4.1
    en: Edge networking services with appropriate use cases (for example, Amazon CloudFront, AWS Global Accelerator)
    fr: Services de mise en réseau périphérique avec cas d'utilisation appropriés (par exemple, Amazon CloudFront, AWS Global Accelerator)
  - code: 3.4.2
    en: How to design network architecture (for example, subnet tiers, routing, IP addressing)
    fr: Comment concevoir une architecture réseau (par exemple, niveaux de sous-réseau, routage, adressage IP)
  - code: 3.4.3
    en: Load balancing concepts (for example, Application Load Balancer [ALB])
    fr: Concepts de répartition de charge (par exemple, Application Load Balancer [ALB])
  - code: 3.4.4
    en: Network connection options (for example, AWS VPN, AWS Direct Connect, AWS PrivateLink)
    fr: Options de connexion réseau (par exemple, AWS VPN, AWS Direct Connect, AWS PrivateLink)
  - code: 3.4.5
    en: Creating a network topology for various architectures (for example, global, hybrid, multi-tier)
    fr: Création d'une topologie de réseau pour différentes architectures (par exemple, globale, hybride, à plusieurs niveaux)
  - code: 3.4.6
    en: Determining network configurations that can scale to accommodate future needs
    fr: Détermination des configurations réseau pouvant être mises à l'échelle pour répondre à l'évolution des besoins
  - code: 3.4.7
    en: Determining the appropriate placement of resources to meet business requirements
    fr: Détermination de l'emplacement approprié des ressources pour répondre aux exigences métier
  - code: 3.4.8
    en: Selecting the appropriate load balancing strategy
    fr: Sélection de la stratégie de répartition de charge appropriée
- group:
    en: Determine high-performing data ingestion and transformation solutions
    fr: Déterminer des solutions d'ingestion et de transformation des données hautement performantes
  objectives:
  - code: 3.5.1
    en: Data analytics and visualization services with appropriate use cases (for example, Amazon Athena, AWS Lake Formation, Amazon Quick)
    fr: Services de visualisation et d'analytique des données avec cas d'utilisation appropriés (par exemple, Amazon Athena, AWS Lake Formation, Amazon Quick)
  - code: 3.5.2
    en: Data ingestion patterns (for example, frequency)
    fr: Modèles d'ingestion des données (par exemple, fréquence)
  - code: 3.5.3
    en: Data transfer services with appropriate use cases (for example, AWS DataSync, AWS Storage Gateway)
    fr: Services de transfert des données avec cas d'utilisation appropriés (par exemple, AWS DataSync, AWS Storage Gateway)
  - code: 3.5.4
    en: Data transformation services with appropriate use cases (for example, AWS Glue)
    fr: Services de transformation des données avec cas d'utilisation appropriés (par exemple, AWS Glue)
  - code: 3.5.5
    en: Secure access to ingestion access points
    fr: Accès sécurisé aux points d'accès d'ingestion
  - code: 3.5.6
    en: Sizes and speeds needed to meet business requirements
    fr: Tailles et vitesses nécessaires pour répondre aux exigences métier
  - code: 3.5.7
    en: Streaming data services with appropriate use cases (for example, Amazon Kinesis)
    fr: Services de données en streaming avec cas d'utilisation appropriés (par exemple, Amazon Kinesis)
  - code: 3.5.8
    en: Building and securing data lakes
    fr: Création et sécurisation des lacs de données
  - code: 3.5.9
    en: Designing data streaming architectures
    fr: Conception d'architectures de streaming des données
  - code: 3.5.10
    en: Designing data transfer solutions
    fr: Conception de solutions de transfert des données
  - code: 3.5.11
    en: Implementing visualization strategies
    fr: Mise en œuvre des stratégies de visualisation
  - code: 3.5.12
    en: Selecting appropriate compute options for data processing (for example, Amazon EMR)
    fr: Sélection des options de calcul appropriées pour le traitement des données (par exemple, Amazon EMR)
  - code: 3.5.13
    en: Selecting appropriate configurations for ingestion
    fr: Sélection des configurations appropriées pour l'ingestion
  - code: 3.5.14
    en: Transforming data between formats (for example, .csv to .parquet)
    fr: Changement de format des données (par exemple, .csv vers .parquet)
cost:
- group:
    en: Design cost-optimized storage solutions
    fr: Concevoir des solutions de stockage optimisées en termes de coûts
  objectives:
  - code: 4.1.1
    en: Access options (for example, an S3 bucket with Requester Pays object storage)
    fr: Options d'accès (par exemple, compartiment S3 avec stockage d'objets associé au paiement par le demandeur)
  - code: 4.1.2
    en: AWS cost management service features (for example, cost allocation tags, multi-account billing)
    fr: Fonctionnalités du service de gestion des coûts AWS (par exemple, balises de répartition des coûts, facturation multi-comptes)
  - code: 4.1.3
    en: AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
    fr: Outils de gestion des coûts AWS avec cas d'utilisation appropriés (par exemple, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
  - code: 4.1.4
    en: AWS storage services with appropriate use cases (for example, Amazon FSx, Amazon EFS, Amazon S3, Amazon EBS)
    fr: Services de stockage AWS avec cas d'utilisation appropriés (par exemple, Amazon FSx, Amazon EFS, Amazon S3, Amazon EBS)
  - code: 4.1.5
    en: Backup strategies
    fr: Stratégies de sauvegarde
  - code: 4.1.6
    en: Block storage options (for example, hard disk drive [HDD] volume types, solid state drive [SSD] volume types)
    fr: Options de stockage en bloc (par exemple, types de volume du disque dur [HDD], types de volume du disque SSD)
  - code: 4.1.7
    en: Data lifecycles
    fr: Cycles de vie des données
  - code: 4.1.8
    en: Hybrid storage options (for example, AWS DataSync, AWS Transfer Family, AWS Storage Gateway)
    fr: Options de stockage hybride (par exemple, AWS DataSync, AWS Transfer Family, AWS Storage Gateway)
  - code: 4.1.9
    en: Storage access patterns
    fr: Modèles d'accès au stockage
  - code: 4.1.10
    en: Storage tiering (for example, cold tiering for object storage)
    fr: Hiérarchisation du stockage (par exemple, niveau à froid pour le stockage d'objets)
  - code: 4.1.11
    en: Storage types with associated characteristics (for example, object, file, block)
    fr: Types de stockage et caractéristiques associées (par exemple, objet, fichier, bloc)
  - code: 4.1.12
    en: Designing appropriate storage strategies (for example, batch uploads to Amazon S3 compared with individual uploads)
    fr: Conception de stratégies de stockage appropriées (par exemple, chargements par lots vers Amazon S3 par rapport aux chargements individuels)
  - code: 4.1.13
    en: Determining the correct storage size for a workload
    fr: Détermination de la taille de stockage appropriée pour une charge de travail
  - code: 4.1.14
    en: Determining the lowest cost method of transferring data for a workload to AWS storage
    fr: Détermination de la méthode de transfert des données la moins coûteuse pour une charge de travail vers un stockage AWS
  - code: 4.1.15
    en: Determining when storage auto scaling is required
    fr: Détermination du moment où la mise à l'échelle automatique du stockage est requise
  - code: 4.1.16
    en: Managing S3 object lifecycles
    fr: Gestion des cycles de vie des objets S3
  - code: 4.1.17
    en: Selecting the appropriate backup and/or archival solution
    fr: Sélection de la solution de sauvegarde et/ou d'archivage appropriée
  - code: 4.1.18
    en: Selecting the appropriate service for data migration to storage services
    fr: Sélection du service approprié pour la migration des données vers les services de stockage
  - code: 4.1.19
    en: Selecting the appropriate storage tier
    fr: Sélection du niveau de stockage approprié
  - code: 4.1.20
    en: Selecting the correct data lifecycle for storage
    fr: Sélection du cycle de vie des données approprié pour le stockage
  - code: 4.1.21
    en: Selecting the most cost-effective storage service for a workload
    fr: Sélection du service de stockage le plus rentable pour une charge de travail
- group:
    en: Design cost-optimized compute solutions
    fr: Concevoir des solutions de calcul optimisées en termes de coûts
  objectives:
  - code: 4.2.1
    en: AWS cost management service features (for example, cost allocation tags, multi-account billing)
    fr: Fonctionnalités du service de gestion des coûts AWS (par exemple, balises de répartition des coûts, facturation multi-comptes)
  - code: 4.2.2
    en: AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
    fr: Outils de gestion des coûts AWS avec cas d'utilisation appropriés (par exemple, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
  - code: 4.2.3
    en: AWS global infrastructure (for example, Availability Zones, AWS Regions)
    fr: Infrastructure globale AWS (par exemple, zones de disponibilité [AZ], Régions AWS)
  - code: 4.2.4
    en: AWS purchasing options (for example, Spot Instances, Reserved Instances, Savings Plans)
    fr: Options d'achat AWS (par exemple, Spot Instances, Reserved Instances, Savings Plans)
  - code: 4.2.5
    en: Distributed compute strategies (for example, edge processing)
    fr: Stratégies de calcul distribué (par exemple, traitement en périphérie)
  - code: 4.2.6
    en: Hybrid compute options (for example, AWS Outposts)
    fr: Options de calcul hybride (par exemple, AWS Outposts)
  - code: 4.2.7
    en: Instance types, families, and sizes (for example, memory optimized, compute optimized, virtualization)
    fr: Types, familles et tailles d'instances (par exemple, optimisées pour la mémoire, optimisées pour le calcul, virtualisation)
  - code: 4.2.8
    en: Optimization of compute utilization (for example, containers, serverless computing, microservices)
    fr: Optimisation de l'utilisation du calcul (par exemple, conteneurs, informatique sans serveur, microservices)
  - code: 4.2.9
    en: Scaling strategies (for example, auto scaling, hibernation)
    fr: Stratégies de mise à l'échelle (par exemple, mise à l'échelle automatique, mise en veille prolongée)
  - code: 4.2.10
    en: Determining an appropriate load balancing strategy (for example, Application Load Balancer [Layer 7] compared with Network Load Balancer [Layer 4] compared with Gateway Load Balancer)
    fr: Détermination d'une stratégie de répartition de charge appropriée (par exemple, Application Load Balancer [couche 7] par rapport au Network Load Balancer [couche 4] ou au Gateway Load Balancer)
  - code: 4.2.11
    en: Determining appropriate scaling methods and strategies for elastic workloads (for example, horizontal compared with vertical, EC2 hibernation)
    fr: Identification des méthodes et stratégies de mise à l'échelle appropriées pour les charges de travail élastiques (par exemple, horizontal par rapport à vertical, mise en veille prolongée d'EC2)
  - code: 4.2.12
    en: Determining cost-effective AWS compute services with appropriate use cases (for example, AWS Lambda, Amazon EC2, AWS Fargate)
    fr: Détermination des services de calcul AWS rentables avec cas d'utilisation appropriés (par exemple, AWS Lambda, Amazon EC2, AWS Fargate)
  - code: 4.2.13
    en: Determining the required availability for different classes of workloads (for example, production workloads, non-production workloads)
    fr: Détermination de la disponibilité requise pour différentes classes de charges de travail (par exemple, charges de travail de production, charges de travail hors production)
  - code: 4.2.14
    en: Selecting the appropriate instance family for a workload
    fr: Sélection de la famille d'instance appropriée pour une charge de travail
  - code: 4.2.15
    en: Selecting the appropriate instance size for a workload
    fr: Sélection de la taille d'instance appropriée pour une charge de travail
