    fr: Fonctionnalités du service de gestion des coûts AWS (par exemple, balises de répartition des coûts, facturation multi-comptes)
  - code: 4.3.2
    en: AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
    fr: Outils de gestion des coûts AWS avec cas d'utilisation appropriés (par exemple, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
  - code: 4.3.3
    en: Caching strategies
    fr: Stratégies de mise en cache
  - code: 4.3.4
    en: Data retention policies
    fr: Politiques de conservation des données
  - code: 4.3.5
    en: Database capacity planning (for example, capacity units)
    fr: Planification de la capacité des bases de données (par exemple, unités de capacité)
  - code: 4.3.6
    en: Database connections and proxies
    fr: Connexions aux bases de données et proxies
  - code: 4.3.7
    en: Database engines with appropriate use cases (for example, heterogeneous migrations, homogeneous migrations)
    fr: Moteurs de base de données avec cas d'utilisation appropriés (par exemple, migrations hétérogènes, migrations homogènes)
  - code: 4.3.8
    en: Database replication (for example, read replicas)
    fr: Réplication de base de données (par exemple, réplicas en lecture)
  - code: 4.3.9
    en: Database types and services (for example, relational compared with non-relational, Amazon Aurora, Amazon DynamoDB)
    fr: Types et services de base de données (par exemple, relationnel par rapport à non relationnel, Amazon Aurora, Amazon DynamoDB)
  - code: 4.3.10
    en: Designing appropriate backup and retention policies (for example, snapshot frequency)
    fr: Conception des politiques de sauvegarde et de conservation appropriées (par exemple, fréquence des instantanés)
  - code: 4.3.11
    en: Determining an appropriate database engine (for example, MySQL compared with PostgreSQL)
    fr: Détermination d'un moteur de base de données approprié (par exemple, MySQL par rapport à PostgreSQL)
  - code: 4.3.12
    en: Determining cost-effective AWS database services with appropriate use cases (for example, DynamoDB compared with Amazon RDS, serverless)
    fr: Détermination des services de base de données AWS rentables avec cas d'utilisation appropriés (par exemple, DynamoDB par rapport à Amazon RDS, sans serveur)
  - code: 4.3.13
    en: Determining cost-effective AWS database types (for example, time series format, columnar format)
    fr: Détermination des types de bases de données AWS rentables (par exemple, format de séries chronologiques, format en colonnes)
  - code: 4.3.14
    en: Migrating database schemas and data to different locations and/or different database engines
    fr: Migration des schémas et des données de base de données vers différents emplacements et/ou différents moteurs de base de données
- group:
    en: Design cost-optimized network architectures
    fr: Concevoir des architectures réseau optimisées en termes de coûts
  objectives:
  - code: 4.4.1
    en: AWS cost management service features (for example, cost allocation tags, multi-account billing)
    fr: Fonctionnalités du service de gestion des coûts AWS (par exemple, balises de répartition des coûts, facturation multi-comptes)
  - code: 4.4.2
    en: AWS cost management tools with appropriate use cases (for example, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
    fr: Outils de gestion des coûts AWS avec cas d'utilisation appropriés (par exemple, AWS Cost Explorer, AWS Budgets, AWS Cost and Usage Report)
  - code: 4.4.3
    en: Load balancing concepts (for example, ALB)
    fr: Concepts de répartition de charge (par exemple, Application Load Balancer [ALB])
  - code: 4.4.4
    en: NAT gateways (for example, NAT instance costs compared with NAT gateway costs)
    fr: Passerelles NAT (par exemple, coûts d'instance NAT par rapport aux coûts de passerelle NAT)
  - code: 4.4.5
    en: Network connectivity (for example, private lines, dedicated lines, VPNs)
    fr: Connectivité réseau (par exemple, lignes privées, lignes dédiées, VPN)
  - code: 4.4.6
    en: Network routing, topology, and peering (for example, AWS Transit Gateway, VPC peering)
    fr: Acheminement réseau, topologie et appairage (par exemple, AWS Transit Gateway, appairage de VPC)
  - code: 4.4.7
    en: Network services with appropriate use cases (for example, DNS)
    fr: Services de réseau avec cas d'utilisation appropriés (par exemple, DNS)
  - code: 4.4.8
    en: Configuring appropriate NAT gateway types for a network (for example, a single shared NAT gateway compared with NAT gateways for each Availability Zone)
    fr: Configuration des types de passerelle NAT appropriés pour un réseau (par exemple, passerelle NAT partagée unique par rapport à des passerelles NAT pour chaque zone de disponibilité [AZ])
  - code: 4.4.9
    en: Configuring appropriate network connections (for example, AWS Direct Connect compared with VPN compared with internet)
    fr: Configuration des connexions réseau appropriées (par exemple, AWS Direct Connect par rapport au VPN ou à Internet)
  - code: 4.4.10
    en: Configuring appropriate network routes to minimize network transfer costs (for example, Region to Region, Availability Zone to Availability Zone, private to public, AWS Global Accelerator, VPC endpoints)
    fr: Configuration d'itinéraires réseau appropriés pour réduire les coûts de transfert réseau (par exemple, d'une Région à une autre, d'une zone de disponibilité [AZ] à une autre, privé vers public, AWS Global Accelerator, points de terminaison d'un VPC)
  - code: 4.4.11
    en: Determining strategic needs for content delivery networks (CDNs) and edge caching
    fr: Détermination des besoins stratégiques en matière de réseaux de diffusion de contenu (CDN) et de mise en cache en périphérie
  - code: 4.4.12
    en: Reviewing existing workloads for network optimizations
    fr: Examen des charges de travail existantes en vue d'optimiser le réseau
  - code: 4.4.13
    en: Selecting an appropriate throttling strategy
    fr: Sélection d'une stratégie de limitation appropriée
  - code: 4.4.14
    en: Selecting the appropriate bandwidth allocation for a network device (for example, a single VPN compared with multiple VPNs, Direct Connect speed)
    fr: Sélection de l'allocation de bande passante appropriée pour un périphérique réseau (par exemple, un seul VPN par rapport à plusieurs VPN, vitesse Direct Connect)
