id: dp420-2d-log-control-plane-audit
objective: "2.3.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **cosmos-contoso**. Today, a .NET application creates containers and changes their throughput at startup by using the SDK and an account key.

    The security team requires that you audit control plane operations as Microsoft recommends: every change to databases, containers and throughput must be performed by an Azure identity through Azure Resource Manager and recorded in Log Analytics. The applications must continue to read and write items by using the account keys.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-contoso**. Aujourd'hui, une application .NET crée des conteneurs et modifie leur débit au démarrage à l'aide du SDK et d'une clé de compte.

    L'équipe de sécurité exige que vous auditiez les opérations du plan de contrôle comme Microsoft le recommande : chaque modification de base de données, de conteneur et de débit doit être effectuée par une identité Azure via Azure Resource Manager et enregistrée dans Log Analytics. Les applications doivent continuer à lire et écrire des éléments avec les clés du compte.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the disableKeyBasedMetadataWriteAccess property of the account to true.", fr: "Définir la propriété disableKeyBasedMetadataWriteAccess du compte sur true." } }
    - { id: b, text: { en: "Set the disableLocalAuth property of the account to true.", fr: "Définir la propriété disableLocalAuth du compte sur true." } }
    - { id: c, text: { en: "Add a diagnostic setting that sends the ControlPlaneRequests category to a Log Analytics workspace.", fr: "Ajouter un paramètre de diagnostic qui envoie la catégorie ControlPlaneRequests vers un espace de travail Log Analytics." } }
    - { id: d, text: { en: "Add a diagnostic setting that sends the DataPlaneRequests category to a Log Analytics workspace.", fr: "Ajouter un paramètre de diagnostic qui envoie la catégorie DataPlaneRequests vers un espace de travail Log Analytics." } }
    - { id: e, text: { en: "Enable the Diagnostics full-text query feature on the account.", fr: "Activer la fonctionnalité Diagnostics full-text query sur le compte." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Microsoft recommends disabling key-based metadata write access before auditing control plane operations: with disableKeyBasedMetadataWriteAccess set to true, SDK clients that use keys can no longer create or update databases and containers, so these changes go through Azure Resource Manager (portal, CLI, PowerShell, templates). The ControlPlaneRequests category then records each operation in Log Analytics. Data operations with keys keep working, and the application's startup code must move container creation to a deployment.
    fr: |
      Microsoft recommande de désactiver l'accès en écriture aux métadonnées par clé avant d'auditer les opérations du plan de contrôle : avec disableKeyBasedMetadataWriteAccess défini sur true, les clients SDK qui utilisent des clés ne peuvent plus créer ni mettre à jour de bases de données et de conteneurs, et ces modifications passent donc par Azure Resource Manager (portail, CLI, PowerShell, modèles). La catégorie ControlPlaneRequests enregistre ensuite chaque opération dans Log Analytics. Les opérations sur les données avec des clés continuent de fonctionner, et la création des conteneurs doit passer du code de démarrage de l'application à un déploiement.
  options:
    b: { en: "disableLocalAuth blocks all key-based access, including the item reads and writes that must keep working.", fr: "disableLocalAuth bloque tout accès par clé, y compris les lectures et écritures d'éléments qui doivent continuer à fonctionner." }
    d: { en: "DataPlaneRequests records item and query operations, not changes to databases, containers or throughput.", fr: "DataPlaneRequests enregistre les opérations sur les éléments et les requêtes, pas les modifications de bases de données, de conteneurs ou de débit." }
    e: { en: "Full-text query only reveals the text of data plane queries in the logs.", fr: "Full-text query révèle uniquement le texte des requêtes du plan de données dans les journaux." }
references:
  - title: How to Audit Control Plane Operations - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/audit-control-plane-logs
