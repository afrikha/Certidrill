id: dp420-2d-log-columns-statements
objective: "2.3.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account that sends the **DataPlaneRequests** and **QueryRuntimeStatistics** categories to a Log Analytics workspace in resource-specific mode. The Diagnostics full-text query feature is not enabled. The applications use the .NET SDK in Direct mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL qui envoie les catégories **DataPlaneRequests** et **QueryRuntimeStatistics** vers un espace de travail Log Analytics en mode spécifique à la ressource. La fonctionnalité Diagnostics full-text query n'est pas activée. Les applications utilisent le SDK .NET en mode Direct.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The `DurationMs` column of `CDBDataPlaneRequests` includes the network time between the application and the service.
        fr: La colonne `DurationMs` de `CDBDataPlaneRequests` inclut le temps réseau entre l'application et le service.
    - id: s2
      text:
        en: For a request authenticated with an account key, the `KeyType` column of `CDBDataPlaneRequests` shows which key the application used.
        fr: Pour une requête authentifiée avec une clé de compte, la colonne `KeyType` de `CDBDataPlaneRequests` indique quelle clé l'application a utilisée.
    - id: s3
      text:
        en: The `QueryText` column of `CDBQueryRuntimeStatistics` shows the parameter values passed to each query.
        fr: La colonne `QueryText` de `CDBQueryRuntimeStatistics` affiche les valeurs des paramètres passées à chaque requête.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      DurationMs is the server-side execution time of the request; the network time is visible only in the client-side diagnostics. In Direct mode, KeyType records the type of key used (primary or secondary, read-write or read-only), which helps find the clients to update before a key rotation. Query text and parameters are obfuscated until you enable Diagnostics full-text query.
    fr: |
      DurationMs est le temps d'exécution de la requête côté serveur ; le temps réseau n'apparaît que dans les diagnostics côté client. En mode Direct, KeyType enregistre le type de clé utilisé (principale ou secondaire, lecture-écriture ou lecture seule), ce qui aide à trouver les clients à mettre à jour avant une rotation de clé. Le texte des requêtes et leurs paramètres sont masqués tant que vous n'activez pas Diagnostics full-text query.
references:
  - title: Azure Monitor Logs reference - CDBDataPlaneRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/cdbdataplanerequests
  - title: Monitor Data using Diagnostic Settings - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-resource-logs
