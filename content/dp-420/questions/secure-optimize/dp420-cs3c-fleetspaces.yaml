id: dp420-cs3c-fleetspaces
objective: "2.4.1"
type: single
caseStudy: dp420-cs3c-humongous-insurance
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    You create an Azure Cosmos DB fleet for ClaimsHub and plan to configure throughput pooling to meet the throughput requirement.

    What is the minimum number of fleetspaces that you must create?
  fr: |
    Vous créez une flotte Azure Cosmos DB pour ClaimsHub et prévoyez de configurer la mise en pool du débit pour satisfaire l'exigence relative au débit.

    Quel est le nombre minimal d'espaces de flotte (fleetspaces) que vous devez créer ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "2" }
    - { id: c, text: "3" }
    - { id: d, text: "6" }
answer: { optionId: c }
explanation:
  correct:
    en: "Pool RU/s are shared within a fleetspace, and pooling requires every account of the fleetspace to have the same regional configuration, including the same write configuration. The Standard, Resilient and Premium groups each have a different configuration (one region; two regions with single-region writes; two regions with multi-region writes), so each group needs its own fleetspace. Subscriptions do not matter: a fleet and its pools can span subscriptions and resource groups, and 120 accounts are far below the default limit of 3,000 accounts per fleetspace."
    fr: "Les RU/s d'un pool sont partagées au sein d'un espace de flotte, et la mise en pool exige que tous les comptes de l'espace de flotte aient la même configuration régionale, y compris la même configuration d'écriture. Les groupes Standard, Resilient et Premium ont chacun une configuration différente (une région ; deux régions avec écritures dans une seule région ; deux régions avec écritures multirégions) : chaque groupe a donc besoin de son propre espace de flotte. Les abonnements n'interviennent pas : une flotte et ses pools peuvent couvrir plusieurs abonnements et groupes de ressources, et 120 comptes restent très en dessous de la limite par défaut de 3 000 comptes par espace de flotte."
  options:
    a:
      en: "A single fleetspace would mix accounts with different regions and write configurations, which cannot share a pool."
      fr: "Un seul espace de flotte mélangerait des comptes aux régions et configurations d'écriture différentes, qui ne peuvent pas partager un pool."
    b:
      en: "Grouping by write configuration alone is not enough: the Standard and Resilient accounts both use single-region writes but are deployed in a different number of regions."
      fr: "Regrouper selon la seule configuration d'écriture ne suffit pas : les comptes Standard et Resilient utilisent tous deux des écritures dans une seule région, mais sont déployés dans un nombre de régions différent."
    d:
      en: "Splitting each group by subscription is unnecessary, because the accounts of a fleetspace can belong to different subscriptions and resource groups."
      fr: "Séparer chaque groupe par abonnement est inutile, car les comptes d'un espace de flotte peuvent appartenir à des abonnements et groupes de ressources différents."
references:
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
  - title: Fleets Overview - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet
