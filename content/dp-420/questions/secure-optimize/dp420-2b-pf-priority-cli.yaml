id: dp420-2b-pf-priority-cli
objective: "2.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **cosmos-ct-hr** in a resource group named **rg-hr**. The account is replicated to West Europe (write region), Sweden Central and North Europe.

    You need to meet the following requirements:

    - Azure Cosmos DB promotes a read region automatically if West Europe becomes unavailable.
    - West Europe stays the write region. North Europe is promoted first, then Sweden Central.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-ct-hr** dans un groupe de ressources nommé **rg-hr**. Le compte est répliqué dans West Europe (région d'écriture), Sweden Central et North Europe.

    Vous devez répondre aux exigences suivantes :

    - Azure Cosmos DB promeut automatiquement une région de lecture si West Europe devient indisponible.
    - West Europe reste la région d'écriture. North Europe est promue en premier, puis Sweden Central.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb update --name cosmos-ct-hr --resource-group rg-hr \
      [[flag]] true

    az cosmosdb failover-priority-change --name cosmos-ct-hr --resource-group rg-hr \
      --failover-policies [[policies]]
  slots:
    - id: flag
      options:
        - { id: auto, text: "--enable-automatic-failover" }
        - { id: multi, text: "--enable-multiple-write-locations" }
        - { id: prpp, text: "--enable-prpp-autoscale" }
    - id: policies
      options:
        - { id: ok, text: "westeurope=0 northeurope=1 swedencentral=2" }
        - { id: nozero, text: "westeurope=1 northeurope=2 swedencentral=3" }
        - { id: partial, text: "northeurope=1 swedencentral=2" }
        - { id: swap, text: "westeurope=0 swedencentral=1 northeurope=2" }
answer:
  values: { flag: auto, policies: ok }
explanation:
  correct:
    en: "`--enable-automatic-failover true` turns on service-managed failover, which promotes a read region when the write region is unavailable. `failover-priority-change` must list every region of the account with unique priorities and exactly one priority 0, which is the write region; keeping `westeurope=0` keeps the write region, and the lower numbers are promoted first."
    fr: "`--enable-automatic-failover true` active le basculement géré par le service, qui promeut une région de lecture quand la région d'écriture est indisponible. `failover-priority-change` doit lister toutes les régions du compte avec des priorités uniques et exactement une priorité 0, qui est la région d'écriture ; conserver `westeurope=0` conserve la région d'écriture, et les numéros les plus bas sont promus en premier."
  options:
    multi: { en: "Multiple write locations would make every region writable instead of configuring automatic promotion.", fr: "Plusieurs emplacements d'écriture rendraient toutes les régions accessibles en écriture au lieu de configurer une promotion automatique." }
    prpp: { en: "--enable-prpp-autoscale is an autoscale setting, unrelated to failover.", fr: "--enable-prpp-autoscale est un paramètre de mise à l'échelle automatique, sans rapport avec le basculement." }
    nozero: { en: "One region must have priority 0.", fr: "Une région doit avoir la priorité 0." }
    partial: { en: "The number of policies must match the number of regions of the account.", fr: "Le nombre de stratégies doit correspondre au nombre de régions du compte." }
    swap: { en: "This order would promote Sweden Central before North Europe.", fr: "Cet ordre promouvrait Sweden Central avant North Europe." }
references:
  - title: az cosmosdb
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb
  - title: Disaster recovery guidance for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/disaster-recovery-guidance
