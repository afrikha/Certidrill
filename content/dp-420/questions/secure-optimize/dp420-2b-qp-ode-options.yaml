id: dp420-2b-qp-ode-options
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an Azure Cosmos DB for NoSQL container named **Sessions** with the partition key `/playerId`. A C# API that uses .NET SDK 3.38.0 or later runs a single-partition query for each request and doesn't paginate the results.

    You need to configure the query to meet the following requirements:

    - Skip the query plan retrieval and query rewrite to lower latency and RU cost.
    - Let the SDK choose the page size based on the size of the documents.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **Sessions** dont la clé de partition est `/playerId`. Une API C# qui utilise le SDK .NET 3.38.0 ou ultérieur exécute une requête sur une seule partition pour chaque appel et ne pagine pas les résultats.

    Vous devez configurer la requête pour répondre aux exigences suivantes :

    - Éviter la récupération du plan de requête et la réécriture de la requête pour réduire la latence et le coût en RU.
    - Laisser le SDK choisir la taille de page selon la taille des documents.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    QueryRequestOptions options = new QueryRequestOptions
    {
        PartitionKey = new PartitionKey(playerId),
        [[ode]] = true,
        [[page]] = -1
    };

    FeedIterator<GameSession> iterator = container.GetItemQueryIterator<GameSession>(
        query, requestOptions: options);
  slots:
    - id: ode
      options:
        - { id: ode, text: EnableOptimisticDirectExecution }
        - { id: scan, text: EnableScanInQuery }
        - { id: lowp, text: EnableLowPrecisionOrderBy }
        - { id: metrics, text: PopulateIndexMetrics }
    - id: page
      options:
        - { id: mic, text: MaxItemCount }
        - { id: mbic, text: MaxBufferedItemCount }
        - { id: mc, text: MaxConcurrency }
answer:
  values: { ode: ode, page: mic }
explanation:
  correct:
    en: "Optimistic direct execution (`EnableOptimisticDirectExecution`, .NET SDK 3.38.0 and later) skips client-side query plan generation and query rewrite for single-partition queries that don't need pagination. `MaxItemCount = -1` lets the SDK pick the page size from the document size."
    fr: "L'exécution directe optimiste (`EnableOptimisticDirectExecution`, SDK .NET 3.38.0 et ultérieur) évite la génération du plan de requête côté client et la réécriture de la requête pour les requêtes sur une seule partition sans pagination. `MaxItemCount = -1` laisse le SDK choisir la taille de page selon la taille des documents."
  options:
    ode: { en: "EnableScanInQuery allows scans on paths excluded from the index, EnableLowPrecisionOrderBy changes ORDER BY precision, and PopulateIndexMetrics adds diagnostic overhead; none of them skips the query plan.", fr: "EnableScanInQuery autorise les analyses sur des chemins exclus de l'index, EnableLowPrecisionOrderBy modifie la précision de l'ORDER BY, et PopulateIndexMetrics ajoute une surcharge de diagnostic ; aucune n'évite le plan de requête." }
    page: { en: "MaxBufferedItemCount sizes the client-side prefetch buffer and MaxConcurrency the parallelism of cross-partition queries; neither sets the page size.", fr: "MaxBufferedItemCount dimensionne la mémoire tampon de prélecture côté client et MaxConcurrency le parallélisme des requêtes entre partitions ; aucune ne définit la taille de page." }
references:
  - title: Query performance tips for Azure Cosmos DB SDKs
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/performance-tips-query-sdk
  - title: QueryRequestOptions Class
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.queryrequestoptions?view=azure-dotnet
