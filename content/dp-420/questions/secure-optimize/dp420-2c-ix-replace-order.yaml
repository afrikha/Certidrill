id: dp420-2c-ix-replace-order
objective: "2.3.3"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    A container named **shipments** uses the default indexing policy (`/*` included). All its queries filter on `status` and sort on `createdAt`. Index metrics show that the queries use the range index on `/status/?` and recommend a composite index on (`/status ASC`, `/createdAt DESC`).

    You plan to add the composite index and then exclude `/status/?` to reduce the write cost. Active workloads must not lose index support at any time.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Un conteneur nommé **shipments** utilise la stratégie d'indexation par défaut (`/*` inclus). Toutes ses requêtes filtrent sur `status` et trient sur `createdAt`. Les métriques d'index montrent que les requêtes utilisent l'index de plage sur `/status/?` et recommandent un index composite sur (`/status ASC`, `/createdAt DESC`).

    Vous prévoyez d'ajouter l'index composite puis d'exclure `/status/?` pour réduire le coût des écritures. Les charges de travail actives ne doivent à aucun moment perdre la prise en charge d'un index.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: add, text: { en: "Update the indexing policy to add the composite index (/status ASC, /createdAt DESC).", fr: "Mettre à jour la stratégie d'indexation pour ajouter l'index composite (/status ASC, /createdAt DESC)." } }
    - { id: wait, text: { en: "Read the container with PopulateQuotaInfo set to true until the index transformation progress reaches 100.", fr: "Lire le conteneur avec PopulateQuotaInfo défini sur true jusqu'à ce que la progression de la transformation d'index atteigne 100." } }
    - { id: remove, text: { en: "Update the indexing policy to add /status/? to the excluded paths.", fr: "Mettre à jour la stratégie d'indexation pour ajouter /status/? aux chemins exclus." } }
    - { id: both, text: { en: "Update the indexing policy to add the composite index and exclude /status/? in a single operation.", fr: "Mettre à jour la stratégie d'indexation pour ajouter l'index composite et exclure /status/? en une seule opération." } }
    - { id: none, text: { en: "Set the indexing mode of the container to none.", fr: "Définir le mode d'indexation du conteneur sur none." } }
    - { id: consistent, text: { en: "Set the indexing mode of the container back to consistent.", fr: "Redéfinir le mode d'indexation du conteneur sur consistent." } }
answer:
  sequence: [ add, wait, remove ]
explanation:
  correct:
    en: Removing an index takes effect immediately, whereas adding an index requires an index transformation, and queries use a new composite index only after the transformation completes. When you replace one index with another, add the new index first, wait for the transformation to complete (tracked with PopulateQuotaInfo and the index transformation progress header), and only then remove the previous index.
    fr: La suppression d'un index prend effet immédiatement, alors que l'ajout d'un index nécessite une transformation d'index, et les requêtes n'utilisent un nouvel index composite qu'une fois la transformation terminée. Pour remplacer un index par un autre, ajoutez d'abord le nouvel index, attendez la fin de la transformation (suivie avec PopulateQuotaInfo et l'en-tête de progression de la transformation d'index), puis seulement supprimez l'ancien index.
  options:
    both: { en: "The removal would take effect immediately while the composite index is still being built, so queries would lose index support.", fr: "La suppression prendrait effet immédiatement alors que l'index composite est encore en cours de construction : les requêtes perdraient la prise en charge de l'index." }
    none: { en: "Mode none drops all indexes and breaks the active queries.", fr: "Le mode none supprime tous les index et casse les requêtes actives." }
    consistent: { en: "The container already uses the consistent mode; switching modes is not part of replacing an index.", fr: "Le conteneur utilise déjà le mode consistent ; changer de mode ne fait pas partie du remplacement d'un index." }
references:
  - title: Manage indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-indexing-policy
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
