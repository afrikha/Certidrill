id: dp420-cs3c-data-masking
objective: "2.1.4"
type: yesno_statements
caseStudy: dp420-cs3c-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You plan to use dynamic data masking (DDM) on the claims container of each broker account to meet the security requirement. The IBANs of the policyholders all contain 27 characters.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez d'utiliser le masquage dynamique des données (DDM) sur le conteneur claims de chaque compte de courtier pour satisfaire l'exigence de sécurité. Les IBAN des assurés comportent tous 27 caractères.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A masking policy entry for `/policyholder/iban` with the MaskSubstring strategy, a `startPosition` of 4 and a `length` of 23 leaves only the first four characters of the IBAN visible."
        fr: "Une entrée de stratégie de masquage pour `/policyholder/iban` avec la stratégie MaskSubstring, un `startPosition` de 4 et une `length` de 23 ne laisse visibles que les quatre premiers caractères de l'IBAN."
    - id: s2
      text:
        en: "The call-center application can keep connecting with account keys; the values that it reads are then masked."
        fr: "L'application du centre d'appels peut continuer à se connecter avec les clés de compte ; les valeurs qu'elle lit sont alors masquées."
    - id: s3
      text:
        en: "If the masking pilot is rejected, you can turn DDM off at the account level after enabling it."
        fr: "Si le pilote de masquage est rejeté, vous pouvez désactiver DDM au niveau du compte après l'avoir activé."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "MaskSubstring masks `length` characters starting at `startPosition` (Washington with 3 and 5 becomes WasXXXXXon), so 4 and 23 keep the first four characters of a 27-character IBAN and mask the rest. DDM relies on data plane role-based access control with Microsoft Entra ID; account keys are not supported, so the call-center application must move to Entra authentication. Enabling DDM on an account is irreversible; you can only stop masking by removing every path from the masking policies."
    fr: "MaskSubstring masque `length` caractères à partir de `startPosition` (Washington avec 3 et 5 devient WasXXXXXon) : 4 et 23 conservent donc les quatre premiers caractères d'un IBAN de 27 caractères et masquent le reste. DDM repose sur le contrôle d'accès en fonction du rôle du plan de données avec Microsoft Entra ID ; les clés de compte ne sont pas prises en charge, et l'application du centre d'appels doit donc passer à l'authentification Entra. L'activation de DDM sur un compte est irréversible ; on peut seulement arrêter le masquage en retirant tous les chemins des stratégies de masquage."
references:
  - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
