id: dp420-cs2a-conflict-path
objective: "2.2.2"
type: single
caseStudy: dp420-cs2a-fourth-coffee
difficulty: 3
status: draft
stem:
  en: |
    You are creating the members container. You need to configure the container to meet the fourth requirement.

    What should you do?
  fr: |
    Vous créez le conteneur members. Vous devez configurer le conteneur pour respecter la quatrième exigence.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create members with the Last Write Wins policy and its default conflict resolution path.", fr: "Créer members avec la stratégie Last Write Wins et son chemin de résolution de conflit par défaut." } }
    - { id: b, text: { en: "Create members with a custom policy and register a merge stored procedure that compares updatedAtMs.", fr: "Créer members avec une stratégie personnalisée et inscrire une procédure stockée de fusion qui compare updatedAtMs." } }
    - { id: c, text: { en: "Create members with the Last Write Wins policy and /updatedAtMs as the conflict resolution path.", fr: "Créer members avec la stratégie Last Write Wins et /updatedAtMs comme chemin de résolution de conflit." } }
    - { id: d, text: { en: "Create members with a custom policy without a merge procedure, and let the API read the conflicts feed.", fr: "Créer members avec une stratégie personnalisée sans procédure de fusion, et laisser l'API lire le flux de conflits." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      With Last Write Wins, the service keeps the version that has the highest value of the conflict resolution path and all regions converge on it. In the API for NoSQL, the path can be a custom numeric property such as `/updatedAtMs`, so the conflict is resolved automatically on the application's timestamp without any server-side code.
    fr: |
      Avec Last Write Wins, le service conserve la version dont la valeur du chemin de résolution de conflit est la plus élevée, et toutes les régions convergent vers elle. Dans l'API for NoSQL, ce chemin peut être une propriété numérique personnalisée comme `/updatedAtMs` : le conflit est résolu automatiquement sur l'horodatage de l'application, sans code côté serveur.
  options:
    a: { en: "The default path is the system timestamp _ts, which is set by the service and is not the updatedAtMs value set by the app.", fr: "Le chemin par défaut est l'horodatage système _ts, défini par le service, et non la valeur updatedAtMs définie par l'application." }
    b: { en: "A merge stored procedure is server-side code, which the requirement forbids.", fr: "Une procédure stockée de fusion est du code côté serveur, ce que l'exigence interdit." }
    d: { en: "Without a merge procedure, conflicts go to the conflicts feed and must be resolved manually, not automatically by the service.", fr: "Sans procédure de fusion, les conflits sont écrits dans le flux de conflits et doivent être résolus manuellement, et non automatiquement par le service." }
references:
  - title: Conflict types and resolution policies when using multiple write regions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
