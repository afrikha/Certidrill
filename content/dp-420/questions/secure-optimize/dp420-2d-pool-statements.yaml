id: dp420-2d-pool-statements
objective: "2.4.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB fleetspace with throughput pooling. Its tenant accounts have a single write region in West Europe and a read region in North Europe, and each tenant container has dedicated autoscale throughput.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un fleetspace Azure Cosmos DB avec un pool de débit. Ses comptes de locataires ont une seule région d'écriture dans West Europe et une région de lecture dans North Europe, et chaque conteneur de locataire a un débit dédié avec mise à l'échelle automatique.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A tenant container consumes its dedicated RU/s before it draws RU/s from the pool.
        fr: Un conteneur de locataire consomme ses RU/s dédiées avant de puiser des RU/s dans le pool.
    - id: s2
      text:
        en: Pool RU/s that are unused in North Europe can serve the requests of a tenant in West Europe.
        fr: Les RU/s du pool inutilisées dans North Europe peuvent servir les requêtes d'un locataire dans West Europe.
    - id: s3
      text:
        en: You can change the minimum and maximum RU/s of the pool after the fleetspace is created.
        fr: Vous pouvez modifier les RU/s minimales et maximales du pool après la création du fleetspace.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Dedicated RU/s are always consumed first; the pool is used only when a resource exceeds them. Pool RU/s aren't shared across regions: each data region has its own pool capacity. The minimum and maximum RU/s of a pool can change at any time, whereas the service tier and the data regions are fixed when the fleetspace is created.
    fr: |
      Les RU/s dédiées sont toujours consommées en premier ; le pool n'est utilisé que lorsqu'une ressource les dépasse. Les RU/s du pool ne sont pas partagées entre régions : chaque région de données a sa propre capacité de pool. Les RU/s minimales et maximales d'un pool peuvent changer à tout moment, alors que le niveau de service et les régions de données sont fixés à la création du fleetspace.
references:
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
  - title: Create a Fleet (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-create-fleet
