id: dp420-2a-authz-container-scope
objective: "2.1.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **contoso-db** is in the resource group **rg-data** of the subscription `0b1f6471-1bf0-4dda-aec3-111122223333`. The account contains a database named **sales** with the containers **orders** and **invoices**.

    You need to create a data plane role assignment that gives a managed identity access to the **orders** container only.

    Which two values can you use for the scope of the role assignment? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **contoso-db** se trouve dans le groupe de ressources **rg-data** de l'abonnement `0b1f6471-1bf0-4dda-aec3-111122223333`. Le compte contient une base de données nommée **sales** avec les conteneurs **orders** et **invoices**.

    Vous devez créer une attribution de rôle du plan de données qui donne à une identité managée un accès au seul conteneur **orders**.

    Quelles sont les deux valeurs que vous pouvez utiliser pour l'étendue de l'attribution de rôle ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "/dbs/sales/colls/orders" }
    - { id: b, text: "/dbs/sales/containers/orders" }
    - { id: c, text: "/subscriptions/0b1f6471-1bf0-4dda-aec3-111122223333/resourcegroups/rg-data/providers/Microsoft.DocumentDB/databaseAccounts/contoso-db/dbs/sales/colls/orders" }
    - { id: d, text: "/dbs/sales" }
    - { id: e, text: "/subscriptions/0b1f6471-1bf0-4dda-aec3-111122223333/resourcegroups/rg-data/providers/Microsoft.DocumentDB/databaseAccounts/contoso-db/sqlDatabases/sales/containers/orders" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A data plane scope can be written relative to the account (`/dbs/<database>/colls/<container>`) or as the fully qualified account path followed by the same `/dbs/.../colls/...` segment. Both values target only the orders container.
    fr: |
      Une étendue du plan de données peut s'écrire relativement au compte (`/dbs/<base de données>/colls/<conteneur>`) ou sous forme de chemin complet du compte suivi du même segment `/dbs/.../colls/...`. Les deux valeurs ciblent uniquement le conteneur orders.
  options:
    b: { en: "Data plane scopes use the segment colls, not containers.", fr: "Les étendues du plan de données utilisent le segment colls, pas containers." }
    d: { en: "/dbs/sales covers every container of the database, including invoices.", fr: "/dbs/sales couvre tous les conteneurs de la base de données, y compris invoices." }
    e: { en: "sqlDatabases/containers is the Azure Resource Manager resource path; data plane scopes use /dbs/<database>/colls/<container>.", fr: "sqlDatabases/containers est le chemin de ressource Azure Resource Manager ; les étendues du plan de données utilisent /dbs/<base>/colls/<conteneur>." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
