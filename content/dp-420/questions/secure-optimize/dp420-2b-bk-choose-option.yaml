id: dp420-2b-bk-choose-option
objective: "2.2.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam runs several Azure Cosmos DB for NoSQL accounts for its Python services. Each account has a different recovery requirement.

    Which backup option should you use for each requirement? To answer, drag the appropriate options to the correct requirements. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exploite plusieurs comptes Azure Cosmos DB for NoSQL pour ses services Python. Chaque compte a une exigence de récupération différente.

    Quelle option de sauvegarde devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les options appropriées vers les exigences correspondantes. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: c7, text: { en: "Continuous backup, 7-day tier", fr: "Sauvegarde continue, niveau 7 jours" } }
    - { id: c30, text: { en: "Continuous backup, 30-day tier", fr: "Sauvegarde continue, niveau 30 jours" } }
    - { id: c35, text: { en: "Continuous backup, 35-day tier", fr: "Sauvegarde continue, niveau 35 jours" } }
    - { id: per, text: { en: "Increase the periodic retention, then open a support request", fr: "Augmenter la rétention périodique, puis ouvrir une demande de support" } }
    - { id: inacc, text: { en: "Same-account restore", fr: "Restauration dans le même compte" } }
  targets:
    - id: t1
      text: { en: "Self-service restore of a container to any point in the last three days, with no backup storage charge", fr: "Restauration en libre-service d'un conteneur à n'importe quel instant des trois derniers jours, sans coût de stockage des sauvegardes" }
    - id: t2
      text: { en: "Self-service restore of an account to its state 33 days ago", fr: "Restauration en libre-service d'un compte dans son état d'il y a 33 jours" }
    - id: t3
      text: { en: "An account in periodic mode with default settings: items were corrupted two hours ago", fr: "Un compte en mode périodique avec les paramètres par défaut : des éléments ont été corrompus il y a deux heures" }
    - id: t4
      text: { en: "An account in continuous mode: recover a deleted container under its original name, without creating an account", fr: "Un compte en mode continu : récupérer un conteneur supprimé sous son nom d'origine, sans créer de compte" }
answer:
  mapping: { t1: c7, t2: c35, t3: per, t4: inacc }
explanation:
  correct:
    en: |
      The 7-day continuous tier has no backup storage charge and covers three days. Only the 35-day tier reaches 33 days back; the 30-day tier doesn't. In periodic mode, you first increase the retention so the needed backup isn't overwritten, then ask support to restore it into a new account. A same-account restore recreates a deleted container in the existing continuous-mode account.
    fr: |
      Le niveau continu 7 jours n'entraîne aucun coût de stockage des sauvegardes et couvre trois jours. Seul le niveau 35 jours remonte à 33 jours ; le niveau 30 jours ne le permet pas. En mode périodique, vous augmentez d'abord la rétention pour que la sauvegarde utile ne soit pas écrasée, puis vous demandez au support de la restaurer dans un nouveau compte. Une restauration dans le même compte recrée un conteneur supprimé dans le compte existant en mode continu.
  options:
    c30: { en: "The 30-day tier can't restore a state from 33 days ago, and it is billed for backup storage.", fr: "Le niveau 30 jours ne peut pas restaurer un état vieux de 33 jours, et il est facturé pour le stockage des sauvegardes." }
references:
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Periodic backup and restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
