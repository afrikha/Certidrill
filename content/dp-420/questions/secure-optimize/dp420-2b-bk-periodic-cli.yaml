id: dp420-2b-bk-periodic-cli
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account named **cosmos-fab-telemetry** that uses periodic backup mode with the default settings. The account is in a region that supports availability zones.

    You need to update the backup policy to meet the following requirements:

    - Take a backup every two hours.
    - Keep each backup for two days.
    - Keep backups available if an availability zone fails, without replicating them outside the region of the account.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab-telemetry** qui utilise le mode de sauvegarde périodique avec les paramètres par défaut. Le compte se trouve dans une région qui prend en charge les zones de disponibilité.

    Vous devez mettre à jour la stratégie de sauvegarde pour répondre aux exigences suivantes :

    - Effectuer une sauvegarde toutes les deux heures.
    - Conserver chaque sauvegarde pendant deux jours.
    - Conserver les sauvegardes disponibles en cas de défaillance d'une zone de disponibilité, sans les répliquer en dehors de la région du compte.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb update \
      --name cosmos-fab-telemetry \
      --resource-group rg-telemetry \
      --backup-interval [[interval]] \
      --backup-retention [[retention]] \
      --backup-redundancy [[redundancy]]
  slots:
    - id: interval
      options:
        - { id: i2, text: "2" }
        - { id: i120, text: "120" }
        - { id: i7200, text: "7200" }
    - id: retention
      options:
        - { id: r2, text: "2" }
        - { id: r48, text: "48" }
        - { id: r2880, text: "2880" }
    - id: redundancy
      options:
        - { id: geo, text: Geo }
        - { id: zone, text: Zone }
        - { id: local, text: Local }
answer:
  values: { interval: i120, retention: r48, redundancy: zone }
explanation:
  correct:
    en: "`--backup-interval` is expressed in minutes (120 = two hours) and `--backup-retention` in hours (48 = two days, which also respects the minimum of twice the interval). `Zone` stores backups in zone-redundant storage, which survives a zone failure and stays in the region."
    fr: "`--backup-interval` s'exprime en minutes (120 = deux heures) et `--backup-retention` en heures (48 = deux jours, ce qui respecte aussi le minimum de deux fois l'intervalle). `Zone` place les sauvegardes dans un stockage redondant interzone, qui résiste à la défaillance d'une zone et reste dans la région."
  options:
    interval: { en: "2 would mean two minutes, below the one-hour minimum; 7200 minutes exceeds the 24-hour maximum.", fr: "2 signifierait deux minutes, en dessous du minimum d'une heure ; 7 200 minutes dépassent le maximum de 24 heures." }
    retention: { en: "2 hours is less than twice the interval; 2880 hours exceeds the 720-hour maximum.", fr: "2 heures est inférieur à deux fois l'intervalle ; 2 880 heures dépassent le maximum de 720 heures." }
    redundancy: { en: "Geo (the default where available) replicates backups to another region, which the requirement forbids. Local keeps backups in locally redundant storage, which doesn't protect them against a zone failure.", fr: "Geo (la valeur par défaut quand elle est disponible) réplique les sauvegardes vers une autre région, ce que l'exigence interdit. Local conserve les sauvegardes dans un stockage localement redondant, qui ne les protège pas contre la défaillance d'une zone." }
references:
  - title: Modify periodic backup interval and retention period
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-modify-interval-retention
  - title: az cosmosdb
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb
