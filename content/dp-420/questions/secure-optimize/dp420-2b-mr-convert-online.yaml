id: dp420-2b-mr-convert-online
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account named **cosmos-pw-iot** with a write region in West Europe and read regions in North Europe and UK South. A Python ingestion service writes telemetry around the clock.

    You plan to enable multi-region writes from the **Replicate data globally** pane of the Azure portal.

    What is the result of the change?
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-pw-iot** avec une région d'écriture dans West Europe et des régions de lecture dans North Europe et UK South. Un service d'ingestion Python écrit des données de télémétrie en continu.

    Vous prévoyez d'activer les écritures multirégions depuis le volet **Replicate data globally** du portail Azure.

    Quel est le résultat de la modification ?
body:
  options:
    - id: a
      text: { en: "The account stays online, and its existing read regions become read/write regions.", fr: "Le compte reste en ligne, et ses régions de lecture existantes deviennent des régions de lecture/écriture." }
    - id: b
      text: { en: "The account stays online, and only regions added after the change accept writes.", fr: "Le compte reste en ligne, et seules les régions ajoutées après la modification acceptent les écritures." }
    - id: c
      text: { en: "The account becomes read-only until the data is copied to a new multi-write account.", fr: "Le compte passe en lecture seule jusqu'à ce que les données soient copiées dans un nouveau compte multi-écriture." }
    - id: d
      text: { en: "The change is refused, because multi-region writes can only be chosen when the account is created.", fr: "La modification est refusée, car les écritures multirégions ne peuvent être choisies qu'à la création du compte." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      An account created with a single write region can be converted to multiple write regions with zero downtime. When you enable multi-region writes, all the read regions of the account become read/write regions, and regions added later are also read/write.
    fr: |
      Un compte créé avec une seule région d'écriture peut passer à plusieurs régions d'écriture sans interruption. Quand vous activez les écritures multirégions, toutes les régions de lecture du compte deviennent des régions de lecture/écriture, et les régions ajoutées ensuite le sont aussi.
  options:
    b: { en: "The existing regions are converted too; they don't stay read-only.", fr: "Les régions existantes sont converties elles aussi ; elles ne restent pas en lecture seule." }
    c: { en: "No new account or data copy is needed; the conversion happens in place without downtime.", fr: "Aucun nouveau compte ni copie de données n'est nécessaire ; la conversion se fait sur place, sans interruption." }
    d: { en: "Multi-region writes can be enabled on an existing account at any time outside a regional outage.", fr: "Les écritures multirégions peuvent être activées sur un compte existant à tout moment, en dehors d'une panne régionale." }
references:
  - title: Manage an Azure Cosmos DB account by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-database-account
  - title: Configure multi-region writes in applications that use Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-multi-master
