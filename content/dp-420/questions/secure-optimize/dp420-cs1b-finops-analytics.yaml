id: dp420-cs1b-finops-analytics
objective: "2.4.2"
type: single
caseStudy: dp420-cs1b-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    All the ClaimDesk accounts are members of the same fleet. You need to meet the requirement of the FinOps team. What should you configure?
  fr: |
    Tous les comptes de ClaimDesk sont membres de la même flotte. Vous devez satisfaire l'exigence de l'équipe FinOps. Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "A diagnostic setting on each account that sends the resource logs to a Log Analytics workspace", fr: "Un paramètre de diagnostic sur chaque compte qui envoie les journaux de ressources vers un espace de travail Log Analytics" } }
    - { id: b, text: { en: "A mirrored Azure Cosmos DB database in the Fabric workspace for each account", fr: "Une base de données Azure Cosmos DB mise en miroir dans l'espace de travail Fabric pour chaque compte" } }
    - { id: c, text: { en: "Fleet analytics on the fleet, with the Fabric workspace as the destination", fr: "L'analytique de la flotte sur la flotte, avec l'espace de travail Fabric comme destination" } }
    - { id: d, text: { en: "An Azure Monitor workbook that charts the Total Request Units metric of each account", fr: "Un classeur Azure Monitor qui représente la métrique Total Request Units de chaque compte" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Fleet analytics collects the usage, cost and configuration data of every account in a fleet, across subscriptions, aggregated at a one-hour grain. It writes the data as Delta Lake tables to Microsoft Fabric OneLake or to Azure Data Lake Storage Gen2, so one configuration on the fleet meets the requirement. Fleet analytics is in preview.
    fr: |
      L'analytique de la flotte collecte les données d'utilisation, de coût et de configuration de tous les comptes d'une flotte, sur plusieurs abonnements, agrégées par heure. Elle écrit les données sous forme de tables Delta Lake dans Microsoft Fabric OneLake ou dans Azure Data Lake Storage Gen2 : une seule configuration sur la flotte satisfait l'exigence. L'analytique de la flotte est en préversion.
  options:
    a: { en: "Diagnostic settings must be created on each of the 41 accounts, send request logs rather than costs, and store them in Log Analytics instead of Delta tables in Fabric.", fr: "Les paramètres de diagnostic doivent être créés sur chacun des 41 comptes, envoient des journaux de requêtes plutôt que des coûts, et les stockent dans Log Analytics au lieu de tables Delta dans Fabric." }
    b: { en: "Mirroring replicates the items of the containers, not the usage and cost data of the accounts.", fr: "La mise en miroir réplique les éléments des conteneurs, pas les données d'utilisation et de coût des comptes." }
    d: { en: "A workbook visualizes metrics in Azure Monitor; it does not produce Delta tables in the Fabric workspace and does not include costs.", fr: "Un classeur visualise des métriques dans Azure Monitor ; il ne produit pas de tables Delta dans l'espace de travail Fabric et n'inclut pas les coûts." }
references:
  - title: Fleet analytics in Azure Cosmos DB (preview)
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics
