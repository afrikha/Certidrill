id: dp420-sr2-alert-throttling-3
objective: "2.3.5"
type: series_yesno
series: dp420-sr2-alert-throttling
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: |
    You create an activity log alert rule on cosmos-tail.
  fr: |
    Vous créez une règle d'alerte de journal d'activité sur cosmos-tail.
body:
  solution:
    en: |
      You create an activity log alert rule scoped to cosmos-tail that fires on all events with the status **Failed**. The rule uses an action group that emails the operations team.
    fr: |
      Vous créez une règle d'alerte de journal d'activité limitée à cosmos-tail qui se déclenche sur tous les événements dont l'état est **Failed**. La règle utilise un groupe d'actions qui envoie un e-mail à l'équipe des opérations.
answer: { value: false }
explanation:
  correct:
    en: |
      The activity log records subscription-level events seen from outside the resource, such as account changes or key rotations. Individual data plane requests and their 429 status codes do not appear in it; they are available only as platform metrics or, after you configure a diagnostic setting, in resource logs such as `CDBDataPlaneRequests`.
    fr: |
      Le journal d'activité enregistre les événements au niveau de l'abonnement vus de l'extérieur de la ressource, comme les modifications du compte ou la rotation des clés. Les requêtes individuelles du plan de données et leurs codes d'état 429 n'y figurent pas ; elles ne sont disponibles que sous forme de métriques de plateforme ou, après configuration d'un paramètre de diagnostic, dans des journaux de ressources tels que `CDBDataPlaneRequests`.
references:
  - title: Monitor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor
