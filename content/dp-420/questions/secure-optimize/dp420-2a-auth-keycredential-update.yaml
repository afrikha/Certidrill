id: dp420-2a-auth-keycredential-update
objective: "2.1.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso runs an ASP.NET Core API that connects to an Azure Cosmos DB for NoSQL account named **contoso-orders**. During a migration period, the API still authenticates with the primary account key, which it reads from Azure Key Vault at startup. The API registers a single `CosmosClient` instance for its whole lifetime.

    The security team rotates the key every 30 days and raises an event that calls `OnKeyRotated` with the new value. The API must start using the new key without creating another `CosmosClient` instance and without restarting.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une API ASP.NET Core qui se connecte à un compte Azure Cosmos DB for NoSQL nommé **contoso-orders**. Pendant une période de migration, l'API s'authentifie encore avec la clé primaire du compte, qu'elle lit dans Azure Key Vault au démarrage. L'API inscrit une seule instance de `CosmosClient` pour toute sa durée de vie.

    L'équipe de sécurité effectue la rotation de la clé tous les 30 jours et déclenche un événement qui appelle `OnKeyRotated` avec la nouvelle valeur. L'API doit utiliser la nouvelle clé sans créer d'autre instance de `CosmosClient` et sans redémarrer.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    string primaryKey = await secretClient.GetSecretValueAsync("cosmos-primary-key");

    var credential = [[cred]];

    CosmosClient client = new CosmosClient(
        "https://contoso-orders.documents.azure.com:443/",
        credential,
        new CosmosClientOptions { ApplicationRegion = Regions.WestEurope });

    // Called by the key rotation event
    void OnKeyRotated(string newKey) => [[update]];
  slots:
    - id: cred
      options:
        - { id: akc, text: "new AzureKeyCredential(primaryKey)" }
        - { id: str, text: "primaryKey" }
        - { id: dac, text: "new DefaultAzureCredential()" }
    - id: update
      options:
        - { id: upd, text: "credential.Update(newKey)" }
        - { id: reassign, text: "credential = new AzureKeyCredential(newKey)" }
        - { id: newclient, text: "client = new CosmosClient(client.Endpoint.ToString(), newKey)" }
answer:
  values: { cred: akc, update: upd }
explanation:
  correct:
    en: |
      The `CosmosClient(string, AzureKeyCredential, CosmosClientOptions)` overload accepts an `AzureKeyCredential` that holds an account key or a resource token. Calling `Update` on that same credential object changes the key used by the client while the client stays in use, so the singleton is kept.
    fr: |
      La surcharge `CosmosClient(string, AzureKeyCredential, CosmosClientOptions)` accepte un `AzureKeyCredential` qui contient une clé de compte ou un jeton de ressource. Appeler `Update` sur ce même objet d'informations d'identification change la clé utilisée par le client pendant qu'il reste en service : l'instance unique est conservée.
  options:
    str: { en: "A plain string key is copied into the client and cannot be changed afterwards; `credential.Update` would not compile.", fr: "Une clé passée sous forme de chaîne est copiée dans le client et ne peut plus être changée ; `credential.Update` ne compilerait pas." }
    dac: { en: "DefaultAzureCredential uses Microsoft Entra ID, not the account key the API must use during the migration.", fr: "DefaultAzureCredential utilise Microsoft Entra ID, pas la clé de compte que l'API doit utiliser pendant la migration." }
    reassign: { en: "Assigning a new object to the local variable does not change the credential that the client already holds.", fr: "Affecter un nouvel objet à la variable locale ne change pas les informations d'identification déjà détenues par le client." }
    newclient: { en: "This creates a second CosmosClient instance, which the requirements forbid.", fr: "Cela crée une deuxième instance de CosmosClient, ce que les exigences interdisent." }
references:
  - title: CosmosClient Constructor
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient.-ctor?view=azure-dotnet
  - title: Rotate keys for Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-rotate-keys
