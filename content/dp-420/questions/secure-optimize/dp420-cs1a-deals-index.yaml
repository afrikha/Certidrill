id: dp420-cs1a-deals-index
objective: "2.3.1"
type: single
caseStudy: dp420-cs1a-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    You need to modify the indexing policy of the products container to meet the requirement of the Deals page. What should you add to the indexing policy?
  fr: |
    Vous devez modifier la stratégie d'indexation du conteneur products pour satisfaire l'exigence de la page Deals. Que devez-vous ajouter à la stratégie d'indexation ?
body:
  options:
    - { id: a, text: { en: "A composite index on /price ascending and /rating ascending", fr: "Un index composite sur /price croissant et /rating croissant" } }
    - { id: b, text: { en: "A composite index on /rating descending and /price ascending", fr: "Un index composite sur /rating décroissant et /price croissant" } }
    - { id: c, text: { en: "A composite index on /price ascending and /rating descending", fr: "Un index composite sur /price croissant et /rating décroissant" } }
    - { id: d, text: { en: "Two included paths, /price/? and /rating/?", fr: "Deux chemins inclus, /price/? et /rating/?" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An ORDER BY clause on two or more properties requires a composite index, and no composite index exists by default. The paths of the composite index must follow the sequence of the ORDER BY clause, and their order must match it (or be the exact opposite on all paths), so /price ascending followed by /rating descending supports the query.
    fr: |
      Une clause ORDER BY sur deux propriétés ou plus nécessite un index composite, et aucun index composite n'existe par défaut. Les chemins de l'index composite doivent suivre la séquence de la clause ORDER BY et leur ordre doit lui correspondre (ou être exactement l'inverse sur tous les chemins) : /price croissant suivi de /rating décroissant prend donc en charge la requête.
  options:
    a: { en: "The order of /rating does not match the DESC of the query, and it is not the opposite on all paths either.", fr: "L'ordre de /rating ne correspond pas au DESC de la requête, et il n'est pas non plus l'inverse sur tous les chemins." }
    b: { en: "The sequence of the paths does not match the sequence of the ORDER BY clause, which starts with price.", fr: "La séquence des chemins ne correspond pas à celle de la clause ORDER BY, qui commence par price." }
    d: { en: "The default policy already range-indexes every path with /*; range indexes do not serve an ORDER BY on several properties.", fr: "La stratégie par défaut indexe déjà chaque chemin en plage avec /* ; les index de plage ne servent pas un ORDER BY sur plusieurs propriétés." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
