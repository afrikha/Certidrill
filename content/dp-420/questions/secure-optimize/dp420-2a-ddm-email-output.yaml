id: dp420-2a-ddm-email-output
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    The masking policy of a container named **suppliers** in an Azure Cosmos DB for NoSQL account named **northwind-procurement** includes the following path:

    ```json
    { "path": "/contact/email", "strategy": "Email" }
    ```

    An item contains the value `lena@fabrikam.com` in `contact.email`. A buyer whose identity has the Cosmos DB Built-in Data Reader role queries the item.

    Which value does the buyer receive?
  fr: |
    La stratégie de masquage d'un conteneur nommé **suppliers** d'un compte Azure Cosmos DB for NoSQL nommé **northwind-procurement** inclut le chemin suivant :

    ```json
    { "path": "/contact/email", "strategy": "Email" }
    ```

    Un élément contient la valeur `lena@fabrikam.com` dans `contact.email`. Un acheteur dont l'identité a le rôle Cosmos DB Built-in Data Reader interroge l'élément.

    Quelle valeur l'acheteur reçoit-il ?
body:
  options:
    - { id: a, text: "lXXX@fabrikam.com" }
    - { id: b, text: "XXXX@XXXXXXXX.XXX" }
    - { id: c, text: "lXXX@XXXXXXXX.com" }
    - { id: d, text: "lena@fabrikam.com" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The Email strategy keeps the first character of the user name and the domain suffix, such as `.com`, and replaces the other characters with X. The built-in Data Reader role has no unmask permission, so the buyer receives the masked value.
    fr: |
      La stratégie Email conserve le premier caractère du nom d'utilisateur et le suffixe du domaine, comme `.com`, et remplace les autres caractères par des X. Le rôle intégré Data Reader n'a pas l'autorisation unmask : l'acheteur reçoit donc la valeur masquée.
  options:
    a: { en: "The Email strategy also masks the domain name; only the suffix stays visible.", fr: "La stratégie Email masque aussi le nom de domaine ; seul le suffixe reste visible." }
    b: { en: "The Email strategy keeps the first character of the user name and the domain suffix.", fr: "La stratégie Email conserve le premier caractère du nom d'utilisateur et le suffixe du domaine." }
    d: { en: "Only identities with the unmask data action see the original value; Data Reader does not have it.", fr: "Seules les identités dotées de l'action de données unmask voient la valeur d'origine ; Data Reader ne l'a pas." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
