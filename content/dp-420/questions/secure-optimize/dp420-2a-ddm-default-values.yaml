id: dp420-2a-ddm-default-values
objective: "2.1.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A container named **members** in an Azure Cosmos DB for NoSQL account named **tailspin-club** has a masking policy that includes the path `/` without any strategy. The following item is stored in the container:

    ```json
    { "id": "m-104", "city": "Redmond", "age": 42, "isPremium": true }
    ```

    The `id` path is excluded from the policy. A user who does not have the unmask permission reads the item.

    Which value does the user receive for each property? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un conteneur nommé **members** d'un compte Azure Cosmos DB for NoSQL nommé **tailspin-club** a une stratégie de masquage qui inclut le chemin `/` sans aucune stratégie de masquage (strategy). L'élément suivant est stocké dans le conteneur :

    ```json
    { "id": "m-104", "city": "Redmond", "age": 42, "isPremium": true }
    ```

    Le chemin `id` est exclu de la stratégie. Un utilisateur qui n'a pas l'autorisation unmask lit l'élément.

    Quelle valeur l'utilisateur reçoit-il pour chaque propriété ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      city: [[city]]

      age: [[age]]

      isPremium: [[prem]]
    fr: |
      city : [[city]]

      age : [[age]]

      isPremium : [[prem]]
  slots:
    - id: city
      options:
        - { id: x4, text: "\"XXXX\"" }
        - { id: x7, text: "\"XXXXXXX\"" }
        - { id: rx, text: "\"RXXXXXX\"" }
        - { id: cnull, text: "null" }
    - id: age
      options:
        - { id: zero, text: "0" }
        - { id: xx, text: "\"XX\"" }
        - { id: anull, text: "null" }
    - id: prem
      options:
        - { id: pf, text: "false" }
        - { id: pt, text: "true" }
        - { id: pnull, text: "null" }
answer:
  values: { city: x4, age: zero, prem: pf }
explanation:
  correct:
    en: |
      When no strategy is specified, the Default strategy applies: strings become `XXXX` whatever their length, numbers become `0` and booleans become `false`. The data types of the properties are preserved.
    fr: |
      Lorsqu'aucune stratégie n'est précisée, la stratégie Default s'applique : les chaînes deviennent `XXXX` quelle que soit leur longueur, les nombres deviennent `0` et les booléens deviennent `false`. Les types de données des propriétés sont conservés.
  options:
    x7: { en: "Default masking does not keep the length of the string.", fr: "Le masquage Default ne conserve pas la longueur de la chaîne." }
    rx: { en: "Keeping the first character is the behavior of the Email strategy for the user name, not of Default.", fr: "Conserver le premier caractère est le comportement de la stratégie Email pour le nom d'utilisateur, pas de Default." }
    xx: { en: "A masked number stays a number: Default returns 0.", fr: "Un nombre masqué reste un nombre : Default renvoie 0." }
    pt: { en: "Default masking returns false for booleans.", fr: "Le masquage Default renvoie false pour les booléens." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
