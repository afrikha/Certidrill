id: dp420-2c-lat-timeline
objective: "2.3.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are analyzing the `transportRequestTimeline` section of the diagnostics of slow point reads made by the Azure Cosmos DB .NET SDK in direct mode.

    Which timeline event measures each stage? To answer, drag the appropriate events to the correct stages. Each event may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous analysez la section `transportRequestTimeline` des diagnostics de lectures ponctuelles lentes effectuées par le SDK .NET Azure Cosmos DB en mode direct.

    Quel événement de la chronologie mesure chaque étape ? Pour répondre, faites glisser les événements appropriés vers les étapes correspondantes. Chaque événement peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: created, text: Created }
    - { id: channel, text: ChannelAcquisitionStarted }
    - { id: pipelined, text: Pipelined }
    - { id: transit, text: Transit Time }
    - { id: received, text: Received }
  targets:
    - id: t1
      text: { en: "Getting an existing TCP connection or creating a new one", fr: "Obtention d'une connexion TCP existante ou création d'une nouvelle connexion" }
    - id: t2
      text: { en: "Writing the request into the TCP socket", fr: "Écriture de la requête dans le socket TCP" }
    - id: t3
      text: { en: "Time on the network after the request is written, to compare with BELatencyInMs", fr: "Temps passé sur le réseau après l'écriture de la requête, à comparer à BELatencyInMs" }
    - id: t4
      text: { en: "Time for the SDK to process a response it has received, often high when threads are starved", fr: "Temps nécessaire au SDK pour traiter une réponse reçue, souvent élevé en cas de famine de threads" }
answer:
  mapping: { t1: channel, t2: pipelined, t3: transit, t4: received }
explanation:
  correct:
    en: ChannelAcquisitionStarted is the time to get or create a connection, for example when connections were closed or the client isn't a singleton. Pipelined is the time to write the request into the TCP socket, which grows with locked threads or large requests. Transit Time is the time on the network; if BELatencyInMs is small, the time was spent on the network rather than in the service. Received is the time between receiving the response and the SDK processing it, usually high with thread starvation. Created is not one of the described stages.
    fr: ChannelAcquisitionStarted est le temps nécessaire pour obtenir ou créer une connexion, par exemple lorsque des connexions ont été fermées ou que le client n'est pas un singleton. Pipelined est le temps d'écriture de la requête dans le socket TCP, qui augmente avec des threads verrouillés ou des requêtes volumineuses. Transit Time est le temps passé sur le réseau ; si BELatencyInMs est faible, le temps a été perdu sur le réseau plutôt que dans le service. Received est le temps entre la réception de la réponse et son traitement par le SDK, généralement élevé en cas de famine de threads. Created ne correspond à aucune des étapes décrites.
references:
  - title: Diagnose and troubleshoot slow requests in Azure Cosmos DB .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-dotnet-sdk-slow-request
