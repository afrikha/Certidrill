id: dp420-2b-bk-migrate-oneway
objective: "2.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB for NoSQL account named **cosmos-tailspin-bookings** that uses periodic backup mode. The account has never used Azure Synapse Link. A developer plans to migrate the account to continuous backup mode with the 30-day tier, and the finance team asks what the migration commits Tailspin to.

    Which statement is true?
  fr: |
    Tailspin dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-tailspin-bookings** qui utilise le mode de sauvegarde périodique. Le compte n'a jamais utilisé Azure Synapse Link. Un développeur prévoit de faire passer le compte en mode de sauvegarde continue avec le niveau 30 jours, et l'équipe financière demande à quoi cette migration engage Tailspin.

    Quelle affirmation est vraie ?
body:
  options:
    - id: a
      text: { en: "The account can later move back to periodic mode within 30 days of the migration.", fr: "Le compte peut revenir au mode périodique dans les 30 jours qui suivent la migration." }
    - id: b
      text: { en: "The account must be restored into a new account that is created in continuous mode.", fr: "Le compte doit être restauré dans un nouveau compte créé en mode continu." }
    - id: c
      text: { en: "The migration can only be selected when the account is created, so a new account is needed.", fr: "La migration ne peut être choisie qu'à la création du compte : un nouveau compte est nécessaire." }
    - id: d
      text: { en: "The account can later change to another continuous tier but never back to periodic mode.", fr: "Le compte pourra ensuite changer de niveau continu, mais jamais revenir au mode périodique." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Migrating from periodic to continuous backup mode is a one-way, in-place update of the existing account that runs asynchronously. Afterward you can switch between the 7-day, 30-day and 35-day tiers, which changes the price immediately, but you can't return to periodic mode.
    fr: |
      Le passage du mode de sauvegarde périodique au mode continu est une mise à jour à sens unique, sur place et asynchrone, du compte existant. Vous pouvez ensuite passer d'un niveau à l'autre (7, 30 ou 35 jours), ce qui modifie le prix immédiatement, mais vous ne pouvez pas revenir au mode périodique.
  options:
    a: { en: "There is no grace period: once the account is in continuous mode it can't be switched back to periodic mode.", fr: "Il n'existe aucun délai de grâce : une fois en mode continu, le compte ne peut pas revenir au mode périodique." }
    b: { en: "The migration updates the existing account in place (for example with az cosmosdb update); no restore into a new account is involved.", fr: "La migration met à jour le compte existant sur place (par exemple avec az cosmosdb update) ; aucune restauration dans un nouveau compte n'est nécessaire." }
    c: { en: "Existing periodic accounts can be migrated to continuous mode from the portal, the CLI, PowerShell or a template.", fr: "Les comptes périodiques existants peuvent passer en mode continu depuis le portail, Azure CLI, PowerShell ou un modèle." }
references:
  - title: Migrate from periodic to continuous backup mode
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/migrate-continuous-backup
