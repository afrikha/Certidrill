id: dp420-2c-ix-unused-path
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container named **tickets** receives about 3,000 writes per second and uses the default indexing policy (`/*` included). Each item contains a large `transcript` object with dozens of nested properties.

    You enabled index metrics for every query that the application runs. No query filters or sorts on `transcript`, and no path under `/transcript` ever appears in the utilized or potential indexes.

    You need to reduce the RU charge of the writes without degrading the performance of the existing queries.

    What should you do?
  fr: |
    Un conteneur nommé **tickets** reçoit environ 3 000 écritures par seconde et utilise la stratégie d'indexation par défaut (`/*` inclus). Chaque élément contient un volumineux objet `transcript` comportant des dizaines de propriétés imbriquées.

    Vous avez activé les métriques d'index pour chaque requête exécutée par l'application. Aucune requête ne filtre ni ne trie sur `transcript`, et aucun chemin sous `/transcript` n'apparaît jamais dans les index utilisés ou potentiels.

    Vous devez réduire les frais en RU des écritures sans dégrader les performances des requêtes existantes.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set the indexing mode of the container to none.", fr: "Définir le mode d'indexation du conteneur sur none." }
    - id: b
      text: { en: "Add /transcript/* to the excluded paths of the indexing policy.", fr: "Ajouter /transcript/* aux chemins exclus de la stratégie d'indexation." }
    - id: c
      text: { en: "Replace the policy with one that includes only /transcript/*.", fr: "Remplacer la stratégie par une stratégie qui inclut uniquement /transcript/*." }
    - id: d
      text: { en: "Add a composite index that starts with /transcript/summary.", fr: "Ajouter un index composite qui commence par /transcript/summary." }
answer: { optionId: b }
explanation:
  correct:
    en: "If an indexed path is not listed as utilized, removing it has no impact on that query's performance. Indexing costs correlate with the number of unique paths indexed, so excluding the unused `transcript` subtree with the `/*` wildcard lowers the RU charge and latency of writes and reduces index storage, while the paths the queries use stay indexed."
    fr: "Si un chemin indexé n'apparaît pas comme utilisé, sa suppression n'a aucun impact sur les performances de cette requête. Le coût de l'indexation dépend du nombre de chemins uniques indexés : exclure la sous-arborescence `transcript` inutilisée avec le caractère générique `/*` réduit les frais en RU et la latence des écritures ainsi que le stockage d'index, tandis que les chemins utilisés par les requêtes restent indexés."
  options:
    a: { en: "Mode none disables all indexing, so every query that relies on the index would degrade or fail.", fr: "Le mode none désactive toute indexation : toutes les requêtes qui s'appuient sur l'index seraient dégradées ou échoueraient." }
    c: { en: "This keeps indexing the unused subtree and stops indexing the paths the queries actually use.", fr: "Cette stratégie continue d'indexer la sous-arborescence inutilisée et cesse d'indexer les chemins réellement utilisés par les requêtes." }
    d: { en: "A composite index adds index entries to every write; it would increase the write cost.", fr: "Un index composite ajoute des entrées d'index à chaque écriture ; il augmenterait le coût des écritures." }
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
