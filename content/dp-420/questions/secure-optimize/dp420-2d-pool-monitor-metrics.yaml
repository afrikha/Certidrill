id: dp420-2d-pool-monitor-metrics
objective: "2.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Proseware enabled throughput pooling on a fleetspace that contains 900 tenant accounts. The operations team must check that the pool is sized correctly.

    Which metric or dimension should the team use for each requirement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware a activé un pool de débit sur un fleetspace qui contient 900 comptes de locataires. L'équipe des opérations doit vérifier que le pool est correctement dimensionné.

    Quelle métrique ou quelle dimension l'équipe doit-elle utiliser pour chaque exigence ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To see the RU/s the pool scaled to over time, at the fleet level: [[s1]]

      To check whether the requests of a tenant container were served by the pool or by its dedicated throughput, split the Total Requests metric by: [[s2]]

      To find the dedicated RU/s allocated to each physical partition of a container: [[s3]]
    fr: |
      Pour voir les RU/s atteintes par le pool au fil du temps, au niveau de la flotte : [[s1]]

      Pour vérifier si les requêtes d'un conteneur de locataire ont été servies par le pool ou par son débit dédié, fractionner la métrique Total Requests par : [[s2]]

      Pour trouver les RU/s dédiées allouées à chaque partition physique d'un conteneur : [[s3]]
  slots:
    - id: s1
      options:
        - { id: fat, text: FleetspaceAutoscaledThroughput }
        - { id: nru, text: Normalized RU Consumption }
        - { id: amt, text: Autoscale Max Throughput }
    - id: s2
      options:
        - { id: cap, text: Capacity Type }
        - { id: sc, text: StatusCode }
        - { id: reg, text: Region }
    - id: s3
      options:
        - { id: ppt, text: PhysicalPartitionThroughput }
        - { id: tru, text: Total Request Units }
        - { id: fat3, text: FleetspaceAutoscaledThroughput }
answer:
  values: { s1: fat, s2: cap, s3: ppt }
explanation:
  correct:
    en: |
      FleetspaceAutoscaledThroughput, available at the fleet level, shows the RU/s the pool scaled to. Splitting Total Requests by Capacity Type, at the account level, separates the requests served by the pool from those served by dedicated throughput. PhysicalPartitionThroughput shows the dedicated RU/s of each physical partition, which, with the 5,000 RU/s and 10,000 RU/s limits, tells how much each partition can draw from the pool.
    fr: |
      FleetspaceAutoscaledThroughput, disponible au niveau de la flotte, montre les RU/s atteintes par le pool. Fractionner Total Requests par Capacity Type, au niveau du compte, sépare les requêtes servies par le pool de celles servies par le débit dédié. PhysicalPartitionThroughput montre les RU/s dédiées de chaque partition physique, ce qui, avec les limites de 5 000 RU/s et de 10 000 RU/s, indique ce que chaque partition peut puiser dans le pool.
  options:
    nru: { en: "Normalized RU Consumption is a utilization percentage per partition key range, not the pool's scaled RU/s.", fr: "Normalized RU Consumption est un pourcentage d'utilisation par plage de clés de partition, pas les RU/s atteintes par le pool." }
    amt: { en: "Autoscale Max Throughput is the autoscale maximum of a database or container, that is, its dedicated RU/s.", fr: "Autoscale Max Throughput est le maximum de mise à l'échelle automatique d'une base de données ou d'un conteneur, c'est-à-dire ses RU/s dédiées." }
    sc: { en: "StatusCode separates successes from errors such as 429, not pool from dedicated capacity.", fr: "StatusCode sépare les réussites des erreurs comme 429, pas la capacité du pool de la capacité dédiée." }
    tru: { en: "Total Request Units shows consumption, not the dedicated RU/s allocated to each partition.", fr: "Total Request Units montre la consommation, pas les RU/s dédiées allouées à chaque partition." }
references:
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
