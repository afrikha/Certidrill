id: dp420-2b-pf-outage-action
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB for NoSQL account named **cosmos-ts-fleet** with a single write region in East US 2 and a read region in Central US. Service-managed failover is enabled, and per-partition automatic failover isn't enabled.

    An Azure Service Health alert reports an outage in East US 2. Reads continue from Central US, but the Python dispatch service can't write. You need to restore write availability as quickly as possible.

    What should you do?
  fr: |
    Tailspin dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-ts-fleet** avec une seule région d'écriture dans East US 2 et une région de lecture dans Central US. Le basculement géré par le service est activé, et le basculement automatique par partition ne l'est pas.

    Une alerte Azure Service Health signale une panne dans East US 2. Les lectures continuent depuis Central US, mais le service de répartition Python ne peut plus écrire. Vous devez rétablir la disponibilité en écriture le plus rapidement possible.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run the Change write region operation to make Central US the write region.", fr: "Exécuter l'opération Change write region pour faire de Central US la région d'écriture." }
    - id: b
      text: { en: "Wait for service-managed failover to promote Central US.", fr: "Attendre que le basculement géré par le service promeuve Central US." }
    - id: c
      text: { en: "Enable multi-region writes so that Central US accepts writes.", fr: "Activer les écritures multirégions pour que Central US accepte les écritures." }
    - id: d
      text: { en: "Run the Offline region operation on East US 2.", fr: "Exécuter l'opération Offline region sur East US 2." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A forced failover, which takes the failed write region offline, is the recommended way to restore write availability quickly; the region with the highest failover priority becomes the write region. Unreplicated writes in East US 2 may be lost, and the region later comes back as a read region.
    fr: |
      Un basculement forcé, qui met hors ligne la région d'écriture défaillante, est la méthode recommandée pour rétablir rapidement la disponibilité en écriture ; la région de plus haute priorité de basculement devient la région d'écriture. Les écritures non répliquées dans East US 2 peuvent être perdues, et la région revient plus tard en tant que région de lecture.
  options:
    a: { en: "Change write region is a planned operation that needs replication to catch up; it can't be used during a write region outage.", fr: "Change write region est une opération planifiée qui attend la fin de la réplication ; elle est inutilisable pendant une panne de la région d'écriture." }
    b: { en: "Service-managed failover depends on Microsoft declaring the outage and can take an hour or more.", fr: "Le basculement géré par le service dépend de la déclaration de la panne par Microsoft et peut prendre une heure ou plus." }
    c: { en: "Switching to multi-write is a control-plane change that you must avoid on an account during a regional outage.", fr: "Passer en multi-écriture est une modification du plan de contrôle à éviter sur un compte pendant une panne régionale." }
references:
  - title: Disaster recovery guidance for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/disaster-recovery-guidance
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
