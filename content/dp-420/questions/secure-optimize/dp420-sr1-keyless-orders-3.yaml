id: dp420-sr1-keyless-orders-3
objective: "2.1.2"
type: series_yesno
series: dp420-sr1-keyless-orders
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You assign Cosmos DB Built-in Data Contributor at the account scope.
  fr: Vous attribuez Cosmos DB Built-in Data Contributor à l'étendue du compte.
body:
  solution:
    en: |
      You run the following command, where `$ORDER_API_PRINCIPAL_ID` contains the principal ID of the managed identity of order-api:

      ```bash
      az cosmosdb sql role assignment create \
          --resource-group rg-sales \
          --account-name cosmos-fab \
          --role-definition-id 00000000-0000-0000-0000-000000000002 \
          --principal-id $ORDER_API_PRINCIPAL_ID \
          --scope "/"
      ```
    fr: |
      Vous exécutez la commande suivante, où `$ORDER_API_PRINCIPAL_ID` contient l'ID de principal de l'identité managée de order-api :

      ```bash
      az cosmosdb sql role assignment create \
          --resource-group rg-sales \
          --account-name cosmos-fab \
          --role-definition-id 00000000-0000-0000-0000-000000000002 \
          --principal-id $ORDER_API_PRINCIPAL_ID \
          --scope "/"
      ```
answer: { value: false }
explanation:
  correct:
    en: The role is the right one, but the `/` scope grants it on the whole account. order-api could then read and write items in the customers and payments containers, which the requirements forbid and which breaks least privilege. The assignment must use the container scope `/dbs/sales/colls/orders`.
    fr: "Le rôle est le bon, mais l'étendue `/` l'accorde sur l'ensemble du compte. order-api pourrait alors lire et écrire des éléments dans les conteneurs customers et payments, ce que les exigences interdisent et qui enfreint le moindre privilège. L'attribution doit utiliser l'étendue du conteneur `/dbs/sales/colls/orders`."
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
