id: dp420-2b-pf-breaker-vs-hedge
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an Azure Cosmos DB for NoSQL account with multi-region writes in West Europe and North Europe. A C# game service uses the .NET SDK v3 with both regions in `ApplicationPreferredRegions`.

    When a physical partition in West Europe returns repeated timeouts or 503 errors, the SDK must automatically send the requests for that partition to North Europe, and return to West Europe once the partition is healthy. The solution must not add any RU charge.

    What should you do?
  fr: |
    Wingtip dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions dans les régions West Europe et North Europe. Un service de jeu C# utilise le SDK .NET v3 avec les deux régions dans `ApplicationPreferredRegions`.

    Quand une partition physique de West Europe renvoie des délais d'expiration ou des erreurs 503 répétés, le SDK doit envoyer automatiquement les requêtes de cette partition vers North Europe, puis revenir vers West Europe une fois la partition rétablie. La solution ne doit ajouter aucun coût en RU.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Configure a cross-region hedging availability strategy on the client.", fr: "Configurer une stratégie de disponibilité avec couverture interrégion (hedging) sur le client." }
    - id: b
      text: { en: "Set the AZURE_COSMOS_CIRCUIT_BREAKER_ENABLED environment variable to true.", fr: "Définir la variable d'environnement AZURE_COSMOS_CIRCUIT_BREAKER_ENABLED sur true." }
    - id: c
      text: { en: "Set ExcludeRegions to West Europe in the request options of every operation.", fr: "Définir ExcludeRegions sur West Europe dans les options de requête de chaque opération." }
    - id: d
      text: { en: "Run the Offline region operation on West Europe when the errors start.", fr: "Exécuter l'opération Offline region sur West Europe quand les erreurs commencent." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The partition-level circuit breaker counts consecutive failures such as 503 and 408 per partition, redirects that partition key range to the next preferred region, and a background task moves it back when the replicas are healthy again. It adds no RU charge, and on multi-region write accounts it covers reads and writes. It is disabled by default, so you enable it with the environment variable.
    fr: |
      Le disjoncteur au niveau des partitions compte les échecs consécutifs, comme les erreurs 503 et 408, pour chaque partition, redirige la plage de clés de partition concernée vers la région préférée suivante, et une tâche en arrière-plan la ramène quand les réplicas sont de nouveau sains. Il n'ajoute aucun coût en RU et, sur les comptes à écritures multirégions, couvre les lectures et les écritures. Il est désactivé par défaut : vous l'activez avec la variable d'environnement.
  options:
    a: { en: "Hedging sends extra parallel requests when the threshold is exceeded, which consumes additional RUs.", fr: "La couverture interrégion envoie des requêtes parallèles supplémentaires quand le seuil est dépassé, ce qui consomme des RU supplémentaires." }
    c: { en: "ExcludeRegions is a static per-request choice that you code yourself; it doesn't detect a failing partition or return to West Europe on its own.", fr: "ExcludeRegions est un choix statique par requête que vous codez vous-même ; il ne détecte pas une partition défaillante et ne revient pas seul vers West Europe." }
    d: { en: "Offline region is a manual control-plane operation on the whole region, not an automatic partition-level reroute.", fr: "Offline region est une opération manuelle du plan de contrôle sur toute la région, pas une redirection automatique au niveau des partitions." }
references:
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
