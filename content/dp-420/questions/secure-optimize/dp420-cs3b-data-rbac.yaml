id: dp420-cs3b-data-rbac
objective: "2.1.2"
type: single
caseStudy: dp420-cs3b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You need to grant the managed identity of ca-scholar access to cosmos-lucerne. The solution must meet the security requirements.

    What should you do?
  fr: |
    Vous devez accorder à l'identité managée de ca-scholar l'accès à cosmos-lucerne. La solution doit satisfaire les exigences de sécurité.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign the Cosmos DB Built-in Data Contributor role at the `/` scope.", fr: "Attribuer le rôle Cosmos DB Built-in Data Contributor dans l'étendue `/`." }
    - id: b
      text: { en: "Assign the Cosmos DB Built-in Data Reader role at the `/dbs/research` scope.", fr: "Attribuer le rôle Cosmos DB Built-in Data Reader dans l'étendue `/dbs/research`." }
    - id: c
      text: { en: "Assign the Cosmos DB Built-in Data Contributor role at the `/dbs/research` scope.", fr: "Attribuer le rôle Cosmos DB Built-in Data Contributor dans l'étendue `/dbs/research`." }
    - id: d
      text: { en: "Assign the DocumentDB Account Contributor Azure role on the cosmos-lucerne account.", fr: "Attribuer le rôle Azure DocumentDB Account Contributor sur le compte cosmos-lucerne." }
answer: { optionId: c }
explanation:
  correct:
    en: "Data plane access with Microsoft Entra ID is granted by a native Azure Cosmos DB role assignment. Cosmos DB Built-in Data Contributor allows reading and writing items in containers, and the `/dbs/research` scope limits it to the containers of the research database, so the identity cannot reach billing."
    fr: "L'accès au plan de données avec Microsoft Entra ID est accordé par une attribution de rôle native d'Azure Cosmos DB. Cosmos DB Built-in Data Contributor permet de lire et d'écrire des éléments dans les conteneurs, et l'étendue `/dbs/research` la limite aux conteneurs de la base de données research : l'identité ne peut pas atteindre billing."
  options:
    a:
      en: "The `/` scope covers the whole account, including the billing database."
      fr: "L'étendue `/` couvre l'ensemble du compte, y compris la base de données billing."
    b:
      en: "Data Reader allows reads, queries and change feed reads only; ca-scholar also writes items."
      fr: "Data Reader autorise uniquement les lectures, les requêtes et la lecture du flux de modification ; or ca-scholar écrit aussi des éléments."
    d:
      en: "DocumentDB Account Contributor is a control plane role for managing accounts; it grants no data plane access, and key-based authentication is disabled on the account."
      fr: "DocumentDB Account Contributor est un rôle du plan de contrôle qui sert à gérer les comptes ; il n'accorde aucun accès au plan de données, et l'authentification par clé est désactivée sur le compte."
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/security/how-to-grant-data-plane-role-based-access
  - title: Data plane security reference - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/reference-data-plane-security
