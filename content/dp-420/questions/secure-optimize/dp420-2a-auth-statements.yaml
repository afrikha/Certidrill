id: dp420-2a-auth-statements
objective: "2.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are reviewing how the applications of Northwind Traders authenticate to an Azure Cosmos DB for NoSQL account named **northwind-db** by using the .NET and Python SDKs.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la façon dont les applications de Northwind Traders s'authentifient auprès d'un compte Azure Cosmos DB for NoSQL nommé **northwind-db** avec les SDK .NET et Python.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: When you create a .NET `CosmosClient` with a `TokenCredential`, the constructor contacts the account to check that the credential is valid.
        fr: Lorsque vous créez un `CosmosClient` .NET avec un `TokenCredential`, le constructeur contacte le compte pour vérifier que les informations d'identification sont valides.
    - id: s2
      text:
        en: A .NET `CosmosClient` that is created with an `AzureKeyCredential` can authenticate with a resource token instead of an account key.
        fr: Un `CosmosClient` .NET créé avec un `AzureKeyCredential` peut s'authentifier avec un jeton de ressource au lieu d'une clé de compte.
    - id: s3
      text:
        en: The Python `CosmosClient` accepts a dictionary of resource tokens as its credential.
        fr: Le `CosmosClient` Python accepte un dictionnaire de jetons de ressource comme informations d'identification.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Creating a .NET CosmosClient makes no network call, so a wrong credential only shows up on the first request. The AzureKeyCredential overload accepts either an account key or a resource token. The Python CosmosClient credential can be an account key, a dictionary of resource tokens or a TokenCredential.
    fr: |
      La création d'un CosmosClient .NET n'effectue aucun appel réseau ; des informations d'identification incorrectes ne se révèlent qu'à la première requête. La surcharge AzureKeyCredential accepte une clé de compte ou un jeton de ressource. Les informations d'identification du CosmosClient Python peuvent être une clé de compte, un dictionnaire de jetons de ressource ou un TokenCredential.
references:
  - title: CosmosClient Constructor
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient.-ctor?view=azure-dotnet
  - title: CosmosClient Class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.cosmosclient?view=azure-python
