id: dp420-2b-qp-latency-settings
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a cross-partition analytics query against an Azure Cosmos DB for NoSQL container that has 40 physical partitions. The C# client runs in the same Azure region as the account, the RU charge of the query is acceptable, and the account returns no HTTP 429 responses. The query still takes several seconds to return about 5,000 items.

    Which two QueryRequestOptions settings should you increase to reduce the latency of the query?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute une requête analytique entre partitions sur un conteneur Azure Cosmos DB for NoSQL qui compte 40 partitions physiques. Le client C# s'exécute dans la même région Azure que le compte, le coût en RU de la requête est acceptable, et le compte ne renvoie aucune réponse HTTP 429. La requête met pourtant plusieurs secondes à renvoyer environ 5 000 éléments.

    Quels sont les deux paramètres de QueryRequestOptions à augmenter pour réduire la latence de la requête ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: MaxConcurrency }
    - { id: b, text: MaxBufferedItemCount }
    - { id: c, text: ResponseContinuationTokenLimitInKb }
    - { id: d, text: ThroughputBucket }
    - { id: e, text: PriorityLevel }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      Partitions are queried in parallel but each partition is read serially, so raising MaxConcurrency (to the number of partitions, or a negative value to let the SDK decide) increases parallelism. Raising MaxBufferedItemCount to the expected number of results or more lets the SDK prefetch results while the application processes the current page.
    fr: |
      Les partitions sont interrogées en parallèle mais chacune est lue en série : augmenter MaxConcurrency (jusqu'au nombre de partitions, ou une valeur négative pour laisser le SDK décider) accroît le parallélisme. Augmenter MaxBufferedItemCount jusqu'au nombre de résultats attendu ou au-delà permet au SDK de prélire les résultats pendant que l'application traite la page courante.
  options:
    c: { en: "This setting limits the size of continuation tokens; it doesn't make the query faster.", fr: "Ce paramètre limite la taille des jetons de continuation ; il ne rend pas la requête plus rapide." }
    d: { en: "A throughput bucket caps the throughput a request can use; it isn't a latency setting when the account isn't throttling.", fr: "Un compartiment de débit plafonne le débit qu'une requête peut utiliser ; ce n'est pas un réglage de latence quand le compte ne limite pas les requêtes." }
    e: { en: "Priority only decides which requests are throttled first; with no 429 responses it changes nothing.", fr: "La priorité décide seulement quelles requêtes sont limitées en premier ; sans réponse 429, elle ne change rien." }
references:
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
  - title: Query performance tips for Azure Cosmos DB SDKs
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/performance-tips-query-sdk
