id: dp420-2a-authz-reader-db-scope-cli
objective: "2.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **contoso-retail** contains the databases **sales** and **hr**. A data science notebook authenticates with a managed identity whose principal ID is stored in `$principalId`.

    The notebook must be able to run point reads and queries against every container in the sales database, including containers that will be created later. It must not write data, and it must not access the hr database. The solution must use a built-in role.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **contoso-retail** contient les bases de données **sales** et **hr**. Un notebook de science des données s'authentifie avec une identité managée dont l'ID de principal est stocké dans `$principalId`.

    Le notebook doit pouvoir effectuer des lectures ponctuelles et des requêtes sur tous les conteneurs de la base de données sales, y compris les conteneurs qui seront créés plus tard. Il ne doit pas écrire de données ni accéder à la base de données hr. La solution doit utiliser un rôle intégré.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb sql role assignment create \
      --account-name contoso-retail \
      --resource-group rg-retail \
      --role-definition-id [[role]] \
      --principal-id $principalId \
      --scope [[scope]]
  slots:
    - id: role
      options:
        - { id: reader, text: "00000000-0000-0000-0000-000000000001" }
        - { id: contrib, text: "00000000-0000-0000-0000-000000000002" }
        - { id: operator, text: "230815da-be43-4aae-9cb4-875f7bd000aa" }
    - id: scope
      options:
        - { id: root, text: "\"/\"" }
        - { id: db, text: "\"/dbs/sales\"" }
        - { id: coll, text: "\"/dbs/sales/colls/orders\"" }
        - { id: rg, text: "\"/subscriptions/<subscription-id>/resourceGroups/rg-retail\"" }
answer:
  values: { role: reader, scope: db }
explanation:
  correct:
    en: |
      Cosmos DB Built-in Data Reader (ID ending in 0001) allows readMetadata, point reads, queries and change feed reads, without any write. The scope `/dbs/sales` covers every container of the sales database, including future ones, and nothing in the hr database.
    fr: |
      Cosmos DB Built-in Data Reader (ID se terminant par 0001) autorise readMetadata, les lectures ponctuelles, les requêtes et la lecture du flux de modification, sans aucune écriture. L'étendue `/dbs/sales` couvre tous les conteneurs de la base de données sales, y compris les futurs conteneurs, et rien dans la base de données hr.
  options:
    contrib: { en: "Built-in Data Contributor (0002) also allows writes and deletes.", fr: "Built-in Data Contributor (0002) autorise aussi les écritures et les suppressions." }
    operator: { en: "This is the ID of the Cosmos DB Operator Azure RBAC role, a control plane role that cannot be used in a data plane role assignment.", fr: "C'est l'ID du rôle Azure RBAC Cosmos DB Operator, un rôle du plan de contrôle qui ne peut pas être utilisé dans une attribution de rôle du plan de données." }
    root: { en: "The scope / covers the whole account, including the hr database.", fr: "L'étendue / couvre tout le compte, y compris la base de données hr." }
    coll: { en: "A container scope covers only the orders container, not the other or future containers of sales.", fr: "Une étendue de conteneur ne couvre que le conteneur orders, pas les autres conteneurs de sales ni les futurs." }
    rg: { en: "A data plane assignment scope is inside the account: the account, a database or a container.", fr: "L'étendue d'une attribution du plan de données se situe dans le compte : le compte, une base de données ou un conteneur." }
references:
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
