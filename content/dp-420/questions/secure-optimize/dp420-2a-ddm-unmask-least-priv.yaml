id: dp420-2a-ddm-unmask-least-priv
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Dynamic data masking is configured on a container named **claims** in an Azure Cosmos DB for NoSQL account named **litware-insurance**. Most users must see masked values.

    The fraud investigation team must be able to run point reads and queries that return the original values. The team must not be able to create, update or delete items. The solution must follow the principle of least privilege.

    Which data plane role should you assign to the team?
  fr: |
    Le masquage dynamique des données est configuré sur un conteneur nommé **claims** dans un compte Azure Cosmos DB for NoSQL nommé **litware-insurance**. La plupart des utilisateurs doivent voir des valeurs masquées.

    L'équipe d'investigation des fraudes doit pouvoir effectuer des lectures ponctuelles et des requêtes qui renvoient les valeurs d'origine. L'équipe ne doit pas pouvoir créer, modifier ni supprimer d'éléments. La solution doit respecter le principe du moindre privilège.

    Quel rôle du plan de données devez-vous attribuer à l'équipe ?
body:
  options:
    - { id: a, text: { en: "The Cosmos DB Built-in Data Contributor role", fr: "Le rôle Cosmos DB Built-in Data Contributor" } }
    - { id: b, text: { en: "The Cosmos DB Built-in Data Reader role", fr: "Le rôle Cosmos DB Built-in Data Reader" } }
    - { id: c, text: { en: "A custom role with the data actions of Built-in Data Reader plus items/unmask", fr: "Un rôle personnalisé avec les actions de données de Built-in Data Reader plus items/unmask" } }
    - { id: d, text: { en: "A custom role with the data actions of Built-in Data Reader plus items/replace", fr: "Un rôle personnalisé avec les actions de données de Built-in Data Reader plus items/replace" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The `items/unmask` data action controls who sees original values. A custom role with the Data Reader actions (readMetadata, items/read, executeQuery, readChangeFeed) plus items/unmask lets the team read unmasked data without any write permission.
    fr: |
      L'action de données `items/unmask` détermine qui voit les valeurs d'origine. Un rôle personnalisé avec les actions de Data Reader (readMetadata, items/read, executeQuery, readChangeFeed) plus items/unmask permet à l'équipe de lire les données non masquées sans aucune autorisation d'écriture.
  options:
    a: { en: "Built-in Data Contributor includes unmask but also allows creating, replacing and deleting items.", fr: "Built-in Data Contributor inclut unmask, mais autorise aussi la création, le remplacement et la suppression d'éléments." }
    b: { en: "Built-in Data Reader does not include unmask, so the team would see masked values.", fr: "Built-in Data Reader n'inclut pas unmask : l'équipe verrait des valeurs masquées." }
    d: { en: "items/replace is a write permission, and without unmask the results stay masked.", fr: "items/replace est une autorisation d'écriture, et sans unmask les résultats restent masqués." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
