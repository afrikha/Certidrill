id: dp420-2c-lat-preferred-region
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account with two regions: West Europe (write region) and East US (read region). The same .NET application is deployed in both Azure regions. The `CosmosClient` is created with a connection string only; neither `ApplicationRegion` nor `ApplicationPreferredRegions` is set.

    The service objective is a P99 below 20 ms for point reads. Instances in West Europe meet it, but instances in East US measure about 95 ms. Server Side Latency Direct for reads stays below 5 ms, and `Diagnostics.GetContactedRegions()` for slow reads returns only West Europe.

    You need the East US instances to meet the objective.

    What should you do?
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL avec deux régions : West Europe (région d'écriture) et East US (région de lecture). La même application .NET est déployée dans les deux régions Azure. Le `CosmosClient` est créé avec une simple chaîne de connexion ; ni `ApplicationRegion` ni `ApplicationPreferredRegions` ne sont définis.

    L'objectif de service est un P99 inférieur à 20 ms pour les lectures ponctuelles. Les instances de West Europe le respectent, mais celles d'East US mesurent environ 95 ms. Server Side Latency Direct pour les lectures reste inférieure à 5 ms, et `Diagnostics.GetContactedRegions()` pour les lectures lentes ne renvoie que West Europe.

    Vous devez faire en sorte que les instances d'East US respectent l'objectif.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set ApplicationRegion to East US in the CosmosClientOptions of the East US instances.", fr: "Définir ApplicationRegion sur East US dans les CosmosClientOptions des instances d'East US." }
    - id: b
      text: { en: "Set ConnectionMode to Gateway in the CosmosClientOptions of the East US instances.", fr: "Définir ConnectionMode sur Gateway dans les CosmosClientOptions des instances d'East US." }
    - id: c
      text: { en: "Change the default consistency level of the account from Session to Eventual.", fr: "Faire passer le niveau de cohérence par défaut du compte de Session à Eventual." }
    - id: d
      text: { en: "Increase the provisioned throughput of the container in both regions.", fr: "Augmenter le débit provisionné du conteneur dans les deux régions." }
answer: { optionId: a }
explanation:
  correct:
    en: "The backend is fast, and the diagnostics show that East US instances send their reads to West Europe, so the extra latency is the cross-region network round trip. `ApplicationRegion` tells the SDK where the application runs; the SDK then orders the account regions by proximity and sends reads to East US first. `ApplicationPreferredRegions` would also work, but only one of the two can be set."
    fr: "Le back-end est rapide et les diagnostics montrent que les instances d'East US envoient leurs lectures vers West Europe : la latence supplémentaire est l'aller-retour réseau interrégion. `ApplicationRegion` indique au SDK où s'exécute l'application ; le SDK classe alors les régions du compte par proximité et envoie d'abord les lectures vers East US. `ApplicationPreferredRegions` fonctionnerait aussi, mais une seule des deux propriétés peut être définie."
  options:
    b: { en: "Gateway mode adds a network hop and doesn't change the region the requests go to.", fr: "Le mode passerelle ajoute un saut réseau et ne change pas la région de destination des requêtes." }
    c: { en: "Weaker consistency does not change which region the client contacts; the cross-region trip remains.", fr: "Une cohérence plus faible ne change pas la région contactée par le client ; l'aller-retour interrégion demeure." }
    d: { en: "There is no throttling problem; more RU/s cannot remove network latency.", fr: "Il n'y a pas de problème de limitation du débit ; plus de RU/s ne peut pas supprimer la latence réseau." }
references:
  - title: Diagnose and troubleshoot slow requests in Azure Cosmos DB .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-dotnet-sdk-slow-request
  - title: CosmosClientOptions.ApplicationRegion Property
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions.applicationregion
