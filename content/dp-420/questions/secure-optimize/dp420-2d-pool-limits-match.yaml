id: dp420-2d-pool-limits-match
objective: "2.4.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are designing the fleet of a multitenant application that uses Azure Cosmos DB for NoSQL. You plan to rely on the default limits of fleets and pools.

    Which value applies to each limit? To answer, drag the appropriate values to the correct limits. Each value may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez la flotte d'une application multilocataire qui utilise Azure Cosmos DB for NoSQL. Vous prévoyez de vous appuyer sur les limites par défaut des flottes et des pools.

    Quelle valeur s'applique à chaque limite ? Pour répondre, faites glisser les valeurs appropriées vers les limites correspondantes. Chaque valeur peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: v3k, text: "3,000" }
    - { id: v5k, text: "5,000" }
    - { id: v10k, text: "10,000" }
    - { id: v50k, text: "50,000" }
    - { id: v100k, text: "100,000" }
    - { id: v1m, text: "1,000,000" }
  targets:
    - id: t1
      text: { en: "Maximum number of database accounts in a fleetspace", fr: "Nombre maximal de comptes de base de données dans un fleetspace" }
    - id: t2
      text: { en: "Maximum RU/s of a pool", fr: "RU/s maximales d'un pool" }
    - id: t3
      text: { en: "Lowest minimum RU/s you can set for a pool", fr: "RU/s minimales les plus basses que vous pouvez définir pour un pool" }
    - id: t4
      text: { en: "Maximum RU/s that one physical partition can draw from the pool", fr: "RU/s maximales qu'une partition physique peut puiser dans le pool" }
    - id: t5
      text: { en: "Maximum total RU/s (dedicated plus pool) of one physical partition", fr: "RU/s totales maximales (dédiées plus pool) d'une partition physique" }
answer:
  mapping: { t1: v3k, t2: v1m, t3: v100k, t4: v5k, t5: v10k }
explanation:
  correct:
    en: |
      By default, a fleetspace holds up to 3,000 database accounts and a pool can reach 1,000,000 RU/s; both can be raised through a support request. Pool minimum and maximum values start at 100,000 RU/s. A physical partition can draw up to 5,000 RU/s from the pool, and its total throughput can't exceed 10,000 RU/s.
    fr: |
      Par défaut, un fleetspace contient jusqu'à 3 000 comptes de base de données et un pool peut atteindre 1 000 000 RU/s ; ces deux limites peuvent être relevées par une demande de support. Les valeurs minimale et maximale d'un pool commencent à 100 000 RU/s. Une partition physique peut puiser jusqu'à 5 000 RU/s dans le pool, et son débit total ne peut pas dépasser 10 000 RU/s.
  options:
    v50k: { en: "50,000 RU/s is below the 100,000 RU/s floor of a pool.", fr: "50 000 RU/s est inférieur au plancher de 100 000 RU/s d'un pool." }
references:
  - title: Fleets Overview - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
