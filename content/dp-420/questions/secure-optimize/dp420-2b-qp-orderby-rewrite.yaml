id: dp420-2b-qp-orderby-rewrite
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Northwind has an Azure Cosmos DB for NoSQL container named **Tickets**. A Python support portal runs the following query, which costs about 45 RUs per execution:

    ```sql
    SELECT * FROM c
    WHERE c.status = "open"
    ORDER BY c._ts ASC
    ```

    You added the composite index (`/status` ascending, `/_ts` ascending) to the indexing policy, and the index transformation is complete. The RU charge of the query didn't change.

    What should you do to lower the RU charge?
  fr: |
    Northwind dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **Tickets**. Un portail de support Python exécute la requête suivante, qui coûte environ 45 RU par exécution :

    ```sql
    SELECT * FROM c
    WHERE c.status = "open"
    ORDER BY c._ts ASC
    ```

    Vous avez ajouté l'index composite (`/status` croissant, `/_ts` croissant) à la stratégie d'indexation, et la transformation de l'index est terminée. Le coût en RU de la requête n'a pas changé.

    Que devez-vous faire pour réduire le coût en RU ?
body:
  options:
    - id: a
      text: { en: "Change the ORDER BY clause to ORDER BY c.status ASC, c._ts ASC.", fr: "Remplacer la clause ORDER BY par ORDER BY c.status ASC, c._ts ASC." }
    - id: b
      text: { en: "Replace the composite index with (/_ts ascending, /status ascending).", fr: "Remplacer l'index composite par (/_ts croissant, /status croissant)." }
    - id: c
      text: { en: "Add /_ts/? to the included paths of the indexing policy.", fr: "Ajouter /_ts/? aux chemins inclus de la stratégie d'indexation." }
    - id: d
      text: { en: "Set max_item_count to -1 in the query_items call.", fr: "Définir max_item_count sur -1 dans l'appel query_items." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A query with a filter and an ORDER BY on another property uses the range index unless the filter properties are added to the front of the ORDER BY clause. Ordering by `c.status, c._ts` matches the composite index, which serves both the filter and the sort and lowers the RU charge.
    fr: |
      Une requête qui filtre sur une propriété et trie sur une autre utilise l'index de plage, sauf si les propriétés du filtre sont ajoutées en tête de la clause ORDER BY. Trier sur `c.status, c._ts` correspond à l'index composite, qui sert à la fois le filtre et le tri et réduit le coût en RU.
  options:
    b: { en: "The equality filter property must come first in the composite index and in the ORDER BY clause.", fr: "La propriété du filtre d'égalité doit venir en premier dans l'index composite et dans la clause ORDER BY." }
    c: { en: "_ts is always indexed when the indexing mode is consistent; adding a path changes nothing.", fr: "_ts est toujours indexé quand le mode d'indexation est consistent ; ajouter un chemin ne change rien." }
    d: { en: "The page size affects the number of round trips, not the RU charge of evaluating the query.", fr: "La taille de page influe sur le nombre d'allers-retours, pas sur le coût en RU de l'évaluation de la requête." }
references:
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
