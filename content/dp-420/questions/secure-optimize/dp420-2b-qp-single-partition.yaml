id: dp420-2b-qp-single-partition
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB for NoSQL container named **Orders** with 400 GB of data and the partition key `/customerId`. A C# order-history page runs the following query, and the page always knows the ID of the signed-in customer:

    ```sql
    SELECT * FROM c WHERE c.orderDate >= @since
    ```

    The query fans out to every physical partition and its RU charge is high. You need to lower the RU charge of the query.

    What should you do?
  fr: |
    Tailspin dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **Orders** qui contient 400 Go de données et dont la clé de partition est `/customerId`. Une page d'historique des commandes C# exécute la requête suivante, et la page connaît toujours l'ID du client connecté :

    ```sql
    SELECT * FROM c WHERE c.orderDate >= @since
    ```

    La requête est distribuée vers toutes les partitions physiques et son coût en RU est élevé. Vous devez réduire le coût en RU de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set MaxConcurrency to -1 in the QueryRequestOptions.", fr: "Définir MaxConcurrency sur -1 dans les QueryRequestOptions." }
    - id: b
      text: { en: "Add a composite index on (/orderDate ascending, /customerId ascending).", fr: "Ajouter un index composite sur (/orderDate croissant, /customerId croissant)." }
    - id: c
      text: { en: "Scope the query to the customer by setting PartitionKey in the QueryRequestOptions.", fr: "Limiter la requête au client en définissant PartitionKey dans les QueryRequestOptions." }
    - id: d
      text: { en: "Set EnableOptimisticDirectExecution to true in the QueryRequestOptions.", fr: "Définir EnableOptimisticDirectExecution sur true dans les QueryRequestOptions." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Each physical partition has its own index, so a query without a partition key value is sent to every partition. Specifying the partition key (in QueryRequestOptions or with an equality filter on customerId) makes it a single-partition query, which matters most on large containers like this one.
    fr: |
      Chaque partition physique possède son propre index : une requête sans valeur de clé de partition est envoyée à toutes les partitions. Spécifier la clé de partition (dans les QueryRequestOptions ou avec un filtre d'égalité sur customerId) en fait une requête sur une seule partition, ce qui compte surtout sur les grands conteneurs comme celui-ci.
  options:
    a: { en: "More parallelism can reduce latency but the query still visits every partition, so the RU charge stays the same.", fr: "Plus de parallélisme peut réduire la latence, mais la requête visite toujours chaque partition : le coût en RU reste identique." }
    b: { en: "A composite index doesn't stop the fan-out, because the query still has no partition key value.", fr: "Un index composite n'empêche pas la distribution, car la requête n'a toujours aucune valeur de clé de partition." }
    d: { en: "Optimistic direct execution only helps queries that already target a single partition.", fr: "L'exécution directe optimiste n'aide que les requêtes qui ciblent déjà une seule partition." }
references:
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
  - title: Query performance tips for Azure Cosmos DB SDKs
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/performance-tips-query-sdk
