id: dp420-2b-pf-ppaf-choose
objective: "2.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **cosmos-ct-billing** with a single write region in East US and a read region in West US. The account uses Session consistency, and the C# applications use a recent .NET SDK v3.

    The account must keep a single write region. If an outage in East US affects only some physical partitions, only those partitions must fail over to West US, automatically and within minutes, while healthy partitions keep accepting writes in East US.

    What should you configure?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-ct-billing** avec une seule région d'écriture dans East US et une région de lecture dans West US. Le compte utilise la cohérence Session, et les applications C# utilisent une version récente du SDK .NET v3.

    Le compte doit conserver une seule région d'écriture. Si une panne dans East US n'affecte que certaines partitions physiques, seules ces partitions doivent basculer vers West US, automatiquement et en quelques minutes, tandis que les partitions saines continuent d'accepter les écritures dans East US.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "Service-managed failover with West US as the first failover priority", fr: "Le basculement géré par le service avec West US en première priorité de basculement" }
    - id: b
      text: { en: "Multi-region writes in East US and West US", fr: "Les écritures multirégions dans East US et West US" }
    - id: c
      text: { en: "Per-partition automatic failover on the account", fr: "Le basculement automatique par partition sur le compte" }
    - id: d
      text: { en: "An Azure Monitor alert that runs an Offline region operation", fr: "Une alerte Azure Monitor qui exécute une opération Offline region" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Per-partition automatic failover (PPAF) is designed for single-write-region accounts with at least one other region. Instead of failing over the whole account, Azure Cosmos DB fails over only the affected partitions, typically in about three minutes, while healthy partitions stay in the original write region.
    fr: |
      Le basculement automatique par partition (PPAF) est conçu pour les comptes à une seule région d'écriture qui disposent d'au moins une autre région. Au lieu de basculer tout le compte, Azure Cosmos DB ne bascule que les partitions affectées, généralement en trois minutes environ, tandis que les partitions saines restent dans la région d'écriture d'origine.
  options:
    a: { en: "Service-managed failover moves the whole write region, and declaring the outage can take an hour or more.", fr: "Le basculement géré par le service déplace toute la région d'écriture, et la déclaration de la panne peut prendre une heure ou plus." }
    b: { en: "Multi-region writes would remove the single-write-region constraint that the account must keep.", fr: "Les écritures multirégions supprimeraient la contrainte d'une seule région d'écriture que le compte doit conserver." }
    d: { en: "Offline region takes the whole region out of the account; it doesn't fail over individual partitions.", fr: "Offline region retire toute la région du compte ; elle ne bascule pas des partitions individuelles." }
references:
  - title: Configure per-partition automatic failover for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
