id: dp420-2c-lat-sla-target
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware is defining service-level objectives for an application that uses the Azure Cosmos DB .NET SDK in direct mode. The team wants to compare the Server Side Latency Direct metric with the latency commitment that Azure Cosmos DB provides.

    Which latency commitment should the team use?
  fr: |
    Litware définit des objectifs de niveau de service pour une application qui utilise le SDK .NET Azure Cosmos DB en mode direct. L'équipe veut comparer la métrique Server Side Latency Direct à l'engagement de latence fourni par Azure Cosmos DB.

    Quel engagement de latence l'équipe doit-elle utiliser ?
body:
  options:
    - id: a
      text: { en: "Less than 10 ms for any query, measured end to end from the client", fr: "Moins de 10 ms pour toute requête, mesurée de bout en bout depuis le client" }
    - id: b
      text: { en: "Less than 10 ms for point reads and point writes with direct connectivity", fr: "Moins de 10 ms pour les lectures et écritures ponctuelles avec la connectivité directe" }
    - id: c
      text: { en: "Less than 10 ms for point reads and point writes with gateway connectivity only", fr: "Moins de 10 ms pour les lectures et écritures ponctuelles avec la connectivité passerelle uniquement" }
    - id: d
      text: { en: "Less than 10 ms for metadata operations such as reading a container", fr: "Moins de 10 ms pour les opérations de métadonnées comme la lecture d'un conteneur" }
answer: { optionId: b }
explanation:
  correct:
    en: "Azure Cosmos DB provides an SLA of less than 10 ms for point read and point write operations with direct connectivity, which is why server-side latency metrics are the right signal to compare with it. Network transit between the client and the service is outside this commitment, so client-side latency must be analyzed separately."
    fr: "Azure Cosmos DB fournit un SLA inférieur à 10 ms pour les opérations de lecture et d'écriture ponctuelles avec la connectivité directe ; c'est pourquoi les métriques de latence côté serveur sont le bon signal à comparer. Le transit réseau entre le client et le service n'entre pas dans cet engagement : la latence côté client doit être analysée séparément."
  options:
    a: { en: "The commitment covers point operations, not every query, and it does not include client-side network time.", fr: "L'engagement couvre les opérations ponctuelles, pas toutes les requêtes, et n'inclut pas le temps réseau côté client." }
    c: { en: "The commitment is stated for direct connectivity; gateway mode adds an extra hop.", fr: "L'engagement est formulé pour la connectivité directe ; le mode passerelle ajoute un saut supplémentaire." }
    d: { en: "Metadata operations have no SLA and their own separate limits.", fr: "Les opérations de métadonnées n'ont pas de SLA et ont leurs propres limites distinctes." }
references:
  - title: How to monitor the server-side latency for operations in an Azure Cosmos DB container or account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-server-side-latency
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
