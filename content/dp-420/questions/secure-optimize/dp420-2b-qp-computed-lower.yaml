id: dp420-2b-qp-computed-lower
objective: "2.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL container named **Users** whose indexing policy includes `/*`. A C# sign-in service runs the following query:

    ```sql
    SELECT * FROM c WHERE LOWER(c.email) = @email
    ```

    The query metrics show a Retrieved Document Count far higher than the Output Document Count. Several legacy applications write to the container, so you can't change how documents are written. You need to lower the RU charge of the query.

    What should you do?
  fr: |
    Adatum dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **Users** dont la stratégie d'indexation inclut `/*`. Un service de connexion C# exécute la requête suivante :

    ```sql
    SELECT * FROM c WHERE LOWER(c.email) = @email
    ```

    Les métriques de requête indiquent un Retrieved Document Count bien supérieur à l'Output Document Count. Plusieurs applications héritées écrivent dans le conteneur : vous ne pouvez pas modifier la façon dont les documents sont écrits. Vous devez réduire le coût en RU de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Define a computed property cp_lowerEmail as LOWER(c.email), and filter the query on it.", fr: "Définir une propriété calculée cp_lowerEmail égale à LOWER(c.email), et filtrer la requête sur celle-ci." }
    - id: b
      text: { en: "Define a computed property cp_lowerEmail as LOWER(c.email), add /cp_lowerEmail/? to the included paths, and filter the query on it.", fr: "Définir une propriété calculée cp_lowerEmail égale à LOWER(c.email), ajouter /cp_lowerEmail/? aux chemins inclus, et filtrer la requête sur celle-ci." }
    - id: c
      text: { en: "Add a composite index on (/email ascending, /id ascending), and keep the LOWER(c.email) filter.", fr: "Ajouter un index composite sur (/email croissant, /id croissant), et conserver le filtre LOWER(c.email)." }
    - id: d
      text: { en: "Set MaxConcurrency and MaxBufferedItemCount to -1 in the QueryRequestOptions of the query.", fr: "Définir MaxConcurrency et MaxBufferedItemCount sur -1 dans les QueryRequestOptions de la requête." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      LOWER in a WHERE clause can't use the index, so every document is loaded. A computed property evaluates LOWER(c.email) for each item without changing the stored documents, and once it is indexed the filter is served from the index. Computed properties aren't covered by the `/*` wildcard, so you must add their path explicitly.
    fr: |
      LOWER dans une clause WHERE ne peut pas utiliser l'index : chaque document est chargé. Une propriété calculée évalue LOWER(c.email) pour chaque élément sans modifier les documents stockés, et une fois indexée, le filtre est servi par l'index. Les propriétés calculées ne sont pas couvertes par le caractère générique `/*` : vous devez ajouter leur chemin explicitement.
  options:
    a: { en: "An unindexed computed property is still evaluated by scanning, because `/*` doesn't cover computed properties.", fr: "Une propriété calculée non indexée est toujours évaluée par analyse, car `/*` ne couvre pas les propriétés calculées." }
    c: { en: "An index on /email doesn't help a filter on LOWER(c.email), which still requires loading each document.", fr: "Un index sur /email n'aide pas un filtre sur LOWER(c.email), qui nécessite toujours de charger chaque document." }
    d: { en: "These settings can lower the latency of cross-partition queries, but not the RU charge of a scan.", fr: "Ces paramètres peuvent réduire la latence des requêtes entre partitions, mais pas le coût en RU d'une analyse." }
references:
