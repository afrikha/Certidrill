id: dp420-2a-auth-entra-constructor
objective: "2.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A .NET application creates its client for an Azure Cosmos DB for NoSQL account named **tailspin-flights** by using a connection string stored in an environment variable.

    You need to change the application so that it authenticates by using Microsoft Entra ID. The `credential` variable contains a `TokenCredential`.

    Which code should you use to create the client?
  fr: |
    Une application .NET crée son client pour un compte Azure Cosmos DB for NoSQL nommé **tailspin-flights** à partir d'une chaîne de connexion stockée dans une variable d'environnement.

    Vous devez modifier l'application pour qu'elle s'authentifie avec Microsoft Entra ID. La variable `credential` contient un `TokenCredential`.

    Quel code devez-vous utiliser pour créer le client ?
body:
  options:
    - { id: a, text: "new CosmosClient($\"AccountEndpoint=https://tailspin-flights.documents.azure.com:443/;{credential}\")" }
    - { id: b, text: "new CosmosClient(\"https://tailspin-flights.documents.azure.com:443/\", credential)" }
    - { id: c, text: "new CosmosClient(\"https://tailspin-flights.documents.azure.com:443/\", credential.ToString())" }
    - { id: d, text: "new CosmosClient(\"https://management.azure.com/\", credential)" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The `CosmosClient(string accountEndpoint, TokenCredential tokenCredential, CosmosClientOptions clientOptions)` overload takes the account endpoint and a TokenCredential, which obtains Microsoft Entra tokens for each request.
    fr: |
      La surcharge `CosmosClient(string accountEndpoint, TokenCredential tokenCredential, CosmosClientOptions clientOptions)` prend le point de terminaison du compte et un TokenCredential, qui obtient des jetons Microsoft Entra pour chaque requête.
  options:
    a: { en: "The connection string overload expects an account key in the string; it cannot carry a Microsoft Entra credential.", fr: "La surcharge de chaîne de connexion attend une clé de compte dans la chaîne ; elle ne peut pas transporter d'informations d'identification Microsoft Entra." }
    c: { en: "The string overload expects an account key or a resource token, not the name of a credential object.", fr: "La surcharge de type chaîne attend une clé de compte ou un jeton de ressource, pas le nom d'un objet d'informations d'identification." }
    d: { en: "The client needs the account endpoint; management.azure.com is the Azure Resource Manager endpoint for control plane operations.", fr: "Le client a besoin du point de terminaison du compte ; management.azure.com est le point de terminaison Azure Resource Manager pour les opérations du plan de contrôle." }
references:
  - title: CosmosClient Constructor
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient.-ctor?view=azure-dotnet
