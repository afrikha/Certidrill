id: dp420-2d-pool-partition-ceiling
objective: "2.4.1"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Wingtip has a tenant account in a fleetspace whose pool has ample free capacity. The account has a container named **telemetry** with four physical partitions. After a redistribution of throughput across the partitions, the PhysicalPartitionThroughput metric shows the dedicated RU/s in the following table. The default pool limits apply.

    Answer each prompt by selecting the physical partition.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un compte de locataire dans un fleetspace dont le pool a une large capacité libre. Le compte a un conteneur nommé **telemetry** avec quatre partitions physiques. Après une redistribution du débit entre les partitions, la métrique PhysicalPartitionThroughput montre les RU/s dédiées du tableau suivant. Les limites par défaut des pools s'appliquent.

    Répondez à chaque consigne en sélectionnant la partition physique.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The physical partition whose maximum total throughput is 7,500 RU/s", fr: "La partition physique dont le débit total maximal est de 7 500 RU/s" }
    - id: p2
      text: { en: "The physical partition that can draw at most 2,000 RU/s from the pool", fr: "La partition physique qui peut puiser au plus 2 000 RU/s dans le pool" }
  grid:
    header: [ { en: "Physical partition", fr: "Partition physique" }, { en: "Dedicated RU/s", fr: "RU/s dédiées" } ]
    rows:
      - [ { text: "0", area: pp0 }, { text: { en: "1,000", fr: "1 000" } } ]
      - [ { text: "1", area: pp1 }, { text: { en: "2,500", fr: "2 500" } } ]
      - [ { text: "2", area: pp2 }, { text: { en: "5,000", fr: "5 000" } } ]
      - [ { text: "3", area: pp3 }, { text: { en: "8,000", fr: "8 000" } } ]
answer:
  values: { p1: pp1, p2: pp3 }
explanation:
  correct:
    en: |
      The maximum RU/s of a physical partition is min(5,000 + dedicated RU/s, 10,000). Partition 1 reaches 2,500 + 5,000 = 7,500 RU/s. Partition 3 is capped at 10,000 RU/s in total, so it can draw only 10,000 - 8,000 = 2,000 RU/s from the pool. Partition 0 reaches 6,000 RU/s, and partition 2 reaches 10,000 RU/s with 5,000 RU/s from the pool.
    fr: |
      Le débit maximal d'une partition physique est min(5 000 + RU/s dédiées, 10 000). La partition 1 atteint 2 500 + 5 000 = 7 500 RU/s. La partition 3 est plafonnée à 10 000 RU/s au total : elle ne peut donc puiser que 10 000 - 8 000 = 2 000 RU/s dans le pool. La partition 0 atteint 6 000 RU/s, et la partition 2 atteint 10 000 RU/s avec 5 000 RU/s issues du pool.
references:
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
