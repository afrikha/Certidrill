id: dp420-2a-net-private-link-statements
objective: "2.1.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso is adding Azure Private Link to an Azure Cosmos DB for NoSQL account named **contoso-billing**. The account currently has **publicNetworkAccess** set to **Enabled** and no IP or virtual network rules.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso ajoute Azure Private Link à un compte Azure Cosmos DB for NoSQL nommé **contoso-billing**. Le compte a actuellement **publicNetworkAccess** défini sur **Enabled** et aucune règle IP ni règle de réseau virtuel.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Once a private endpoint is approved, the public DNS name of the account can no longer be resolved from the internet.", fr: "Une fois un point de terminaison privé approuvé, le nom DNS public du compte ne peut plus être résolu depuis Internet." } }
    - { id: b, text: { en: "If all the approved private endpoints are later deleted, the account is reachable from all networks unless public network access is disabled.", fr: "Si tous les points de terminaison privés approuvés sont supprimés plus tard, le compte est accessible depuis tous les réseaux, sauf si l'accès réseau public est désactivé." } }
    - { id: c, text: { en: "The subnet of the private endpoint must have the Microsoft.AzureCosmosDB service endpoint enabled.", fr: "Le sous-réseau du point de terminaison privé doit avoir le point de terminaison de service Microsoft.AzureCosmosDB activé." } }
    - { id: d, text: { en: "With a private DNS zone group, the private DNS zone is updated automatically when you add a region to the account.", fr: "Avec un groupe de zones DNS privées, la zone DNS privée est mise à jour automatiquement quand vous ajoutez une région au compte." } }
    - { id: e, text: { en: "A private endpoint connection that was rejected can be approved later from the account's Networking page.", fr: "Une connexion de point de terminaison privé rejetée peut être approuvée plus tard depuis la page Networking du compte." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      When an account relies only on private endpoints and they are all rejected or deleted, it is open to the whole network unless publicNetworkAccess is Disabled. A private DNS zone group keeps the zone in sync when regions are added or removed; without it, you must update the DNS records yourself.
    fr: |
      Lorsqu'un compte ne repose que sur des points de terminaison privés et qu'ils sont tous rejetés ou supprimés, il est ouvert à tout le réseau, sauf si publicNetworkAccess a la valeur Disabled. Un groupe de zones DNS privées maintient la zone synchronisée quand des régions sont ajoutées ou supprimées ; sans lui, vous devez mettre à jour vous-même les enregistrements DNS.
  options:
    a: { en: "Private Link does not prevent the account endpoints from being resolved by public DNS.", fr: "Private Link n'empêche pas les points de terminaison du compte d'être résolus par le DNS public." }
    c: { en: "A private endpoint gets private IP addresses in the subnet; it does not rely on the Microsoft.AzureCosmosDB service endpoint.", fr: "Un point de terminaison privé obtient des adresses IP privées dans le sous-réseau ; il ne repose pas sur le point de terminaison de service Microsoft.AzureCosmosDB." }
    e: { en: "A rejected connection cannot be approved; you must create the private endpoint again.", fr: "Une connexion rejetée ne peut pas être approuvée ; vous devez recréer le point de terminaison privé." }
references:
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
