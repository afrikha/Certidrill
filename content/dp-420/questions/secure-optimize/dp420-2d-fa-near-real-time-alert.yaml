id: dp420-2d-fa-near-real-time-alert
objective: "2.4.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB fleet of 300 tenant accounts and sends its fleet analytics to a Microsoft Fabric workspace, where FactRequestHourly already powers a weekly throttling report.

    The operations team now needs to be notified within 10 minutes whenever any tenant account returns more than 500 rate-limited (429) responses in five minutes. The solution must not add log ingestion costs.

    What should you configure?
  fr: |
    Contoso dispose d'une flotte Azure Cosmos DB de 300 comptes de locataires et envoie son analytique de la flotte vers un espace de travail Microsoft Fabric, où FactRequestHourly alimente déjà un rapport hebdomadaire sur la limitation.

    L'équipe des opérations doit maintenant être avertie dans les 10 minutes chaque fois qu'un compte de locataire renvoie plus de 500 réponses limitées (429) en cinq minutes. La solution ne doit pas ajouter de coûts d'ingestion de journaux.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Azure Monitor metric alert rules on Total Requests, filtered on StatusCode 429, for the accounts", fr: "Des règles d'alerte de métrique Azure Monitor sur Total Requests, filtrées sur StatusCode 429, pour les comptes" } }
    - { id: b, text: { en: "A Fabric alert rule on FactRequestHourly, filtered on StatusCode 429, evaluated every five minutes", fr: "Une règle d'alerte Fabric sur FactRequestHourly, filtrée sur StatusCode 429, évaluée toutes les cinq minutes" } }
    - { id: c, text: { en: "Log search alert rules on CDBDataPlaneRequests, filtered on StatusCode 429, for the accounts", fr: "Des règles d'alerte de recherche dans les journaux sur CDBDataPlaneRequests, filtrées sur StatusCode 429, pour les comptes" } }
    - { id: d, text: { en: "A Power BI report on FactAccountHourly, refreshed every five minutes", fr: "Un rapport Power BI sur FactAccountHourly, actualisé toutes les cinq minutes" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Azure Monitor metrics are preaggregated every minute at no extra cost, and a metric alert on Total Requests with the StatusCode dimension set to 429 fires within minutes. Fleet analytics fits trends and cost analysis because its data is aggregated per hour.
    fr: |
      Les métriques Azure Monitor sont préagrégées chaque minute sans coût supplémentaire, et une alerte de métrique sur Total Requests avec la dimension StatusCode définie sur 429 se déclenche en quelques minutes. L'analytique de la flotte convient aux tendances et à l'analyse des coûts, car ses données sont agrégées par heure.
  options:
    b: { en: "FactRequestHourly is aggregated per hour, so evaluating it every five minutes can't detect a five-minute burst within 10 minutes.", fr: "FactRequestHourly est agrégée par heure : l'évaluer toutes les cinq minutes ne peut pas détecter un pic de cinq minutes dans les 10 minutes." }
    c: { en: "Log search alerts need the DataPlaneRequests logs to be ingested into Log Analytics, which adds ingestion costs.", fr: "Les alertes de recherche dans les journaux exigent d'ingérer les journaux DataPlaneRequests dans Log Analytics, ce qui ajoute des coûts d'ingestion." }
    d: { en: "FactAccountHourly holds account settings, and a report doesn't notify anyone.", fr: "FactAccountHourly contient les paramètres des comptes, et un rapport n'avertit personne." }
references:
  - title: Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics
