id: dp420-2b-mr-sdk-regions
objective: "2.2.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account with multi-region writes. A C# service uses the .NET SDK v3 and is deployed in several Azure regions. The developers review how the client options control regional routing.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions. Un service C# utilise le SDK .NET v3 et est déployé dans plusieurs régions Azure. Les développeurs examinent comment les options du client contrôlent le routage régional.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "With ApplicationRegion set, the SDK orders the account regions by proximity and uses regions added to the account later.", fr: "Avec ApplicationRegion défini, le SDK classe les régions du compte par proximité et utilise les régions ajoutées plus tard au compte." } }
    - { id: b, text: { en: "When both ApplicationRegion and ApplicationPreferredRegions are set, the SDK uses ApplicationRegion first.", fr: "Quand ApplicationRegion et ApplicationPreferredRegions sont tous deux définis, le SDK utilise d'abord ApplicationRegion." } }
    - { id: c, text: { en: "A region in ApplicationPreferredRegions that the account doesn't have is ignored, and is used if it is added later.", fr: "Une région de ApplicationPreferredRegions que le compte ne possède pas est ignorée, puis utilisée si elle est ajoutée plus tard." } }
    - { id: d, text: { en: "With multi-region writes, the SDK sends every write to the hub region of the account.", fr: "Avec les écritures multirégions, le SDK envoie chaque écriture à la région hub du compte." } }
    - { id: e, text: { en: "Without any preferred region setting, the SDK spreads reads across all regions of the account.", fr: "Sans aucun paramètre de région préférée, le SDK répartit les lectures entre toutes les régions du compte." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      ApplicationRegion makes the SDK build its preferred list from the account regions ordered by geo-proximity, including regions added later, without a redeployment. ApplicationPreferredRegions keeps only the listed regions that the account has; a listed region that is added to the account later is used according to its rank.
    fr: |
      ApplicationRegion amène le SDK à construire sa liste préférée à partir des régions du compte classées par proximité géographique, y compris celles ajoutées plus tard, sans redéploiement. ApplicationPreferredRegions ne retient que les régions listées que possède le compte ; une région listée ajoutée plus tard au compte est utilisée selon son rang.
  options:
    b: { en: "ApplicationRegion and ApplicationPreferredRegions are alternatives: you can set one or the other, not both.", fr: "ApplicationRegion et ApplicationPreferredRegions sont des alternatives : vous pouvez définir l'un ou l'autre, pas les deux." }
    d: { en: "With multi-region writes, the SDK writes to the first available region of its preferred list; the hub region only arbitrates conflicts.", fr: "Avec les écritures multirégions, le SDK écrit dans la première région disponible de sa liste préférée ; la région hub ne fait qu'arbitrer les conflits." }
    e: { en: "Without a preferred region setting, requests are served from the current write region; the SDK doesn't load-balance reads across regions.", fr: "Sans paramètre de région préférée, les requêtes sont servies par la région d'écriture actuelle ; le SDK ne répartit pas les lectures entre les régions." }
references:
  - title: CosmosClientOptions.ApplicationPreferredRegions Property
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions.applicationpreferredregions?view=azure-dotnet
  - title: Configure multi-region writes in applications that use Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-multi-master
