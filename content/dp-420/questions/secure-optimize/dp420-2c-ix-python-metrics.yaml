id: dp420-2c-ix-python-metrics
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A Python application built with the `azure-cosmos` package (version 4.9) searches hotels in a container named **hotels**. The search query is slow, and you suspect that the indexing policy lacks an index.

    You need to print the indexing metrics of the query, which show the utilized and potential indexed paths.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application Python basée sur le package `azure-cosmos` (version 4.9) recherche des hôtels dans un conteneur nommé **hotels**. La requête de recherche est lente et vous soupçonnez l'absence d'un index dans la stratégie d'indexation.

    Vous devez afficher les métriques d'indexation de la requête, qui indiquent les chemins indexés utilisés et potentiels.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    items = container.query_items(
        query="SELECT * FROM c WHERE c.city = @city AND c.stars >= 4",
        parameters=[{"name": "@city", "value": "Lisbon"}],
        enable_cross_partition_query=True,
        [[flag]]=True)
    results = list(items)

    print(container.client_connection.last_response_headers["[[header]]"])
  slots:
    - id: flag
      options:
        - { id: qm, text: populate_query_metrics }
        - { id: im, text: populate_index_metrics }
        - { id: qa, text: populate_query_advice }
    - id: header
      options:
        - { id: progress, text: x-ms-documentdb-collection-index-transformation-progress }
        - { id: util, text: x-ms-cosmos-index-utilization }
        - { id: charge, text: x-ms-request-charge }
answer:
  values: { flag: im, header: util }
explanation:
  correct:
    en: "In the Python SDK (4.6.0 or later), you pass the `populate_index_metrics` keyword to `query_items()` and read the `x-ms-cosmos-index-utilization` header from the last response headers. The header is returned only when the query returns some items."
    fr: "Dans le SDK Python (4.6.0 ou ultérieur), vous passez le mot clé `populate_index_metrics` à `query_items()` et vous lisez l'en-tête `x-ms-cosmos-index-utilization` dans les derniers en-têtes de réponse. Cet en-tête n'est renvoyé que si la requête renvoie des éléments."
  options:
    qm: { en: "populate_query_metrics returns execution metrics (times, document counts), not the utilized and potential indexes.", fr: "populate_query_metrics renvoie des métriques d'exécution (temps, nombres de documents), pas les index utilisés et potentiels." }
    qa: { en: "populate_query_advice returns query rewrite advice, not indexing metrics.", fr: "populate_query_advice renvoie des conseils de réécriture de la requête, pas les métriques d'indexation." }
    progress: { en: "This header reports the progress of an index transformation after a policy change.", fr: "Cet en-tête indique la progression d'une transformation d'index après une modification de stratégie." }
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
