id: dp420-2b-mr-python-writes
objective: "2.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account with multi-region writes in West US 2 and East US. A Python service that uses the `azure-cosmos` SDK runs in West US 2.

    You need the service to send its writes to its local region and to use East US only when West US 2 is unavailable.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions dans les régions West US 2 et East US. Un service Python qui utilise le SDK `azure-cosmos` s'exécute dans West US 2.

    Le service doit envoyer ses écritures à sa région locale et n'utiliser East US que lorsque West US 2 est indisponible.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.cosmos import CosmosClient
    from azure.identity import DefaultAzureCredential

    client = CosmosClient(
        ACCOUNT_ENDPOINT,
        credential=DefaultAzureCredential(),
        [[writes]]=True,
        [[regions]]=["West US 2", "East US"],
    )
  slots:
    - id: writes
      options:
        - { id: mwl, text: multiple_write_locations }
        - { id: emw, text: enable_multiple_writes }
        - { id: cross, text: enable_cross_partition_query }
    - id: regions
      options:
        - { id: pref, text: preferred_locations }
        - { id: excl, text: excluded_locations }
        - { id: appreg, text: application_regions }
answer:
  values: { writes: mwl, regions: pref }
explanation:
  correct:
    en: "In the Python SDK, `multiple_write_locations=True` lets the client write to every write region of the account, and `preferred_locations` lists the regions in order of preference, the closest first. Writes therefore go to West US 2 and fail over to East US when West US 2 is unavailable."
    fr: "Dans le SDK Python, `multiple_write_locations=True` permet au client d'écrire dans chaque région d'écriture du compte, et `preferred_locations` liste les régions par ordre de préférence, la plus proche en premier. Les écritures partent donc vers West US 2 et basculent vers East US quand West US 2 est indisponible."
  options:
    writes: { en: "enable_cross_partition_query is a query option, and enable_multiple_writes isn't an SDK parameter.", fr: "enable_cross_partition_query est une option de requête, et enable_multiple_writes n'est pas un paramètre du SDK." }
    regions: { en: "excluded_locations lists regions to skip, the opposite of the requirement; application_regions isn't a Python SDK parameter.", fr: "excluded_locations liste les régions à éviter, l'inverse de l'exigence ; application_regions n'est pas un paramètre du SDK Python." }
references:
  - title: Configure multi-region writes in applications that use Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-multi-master
