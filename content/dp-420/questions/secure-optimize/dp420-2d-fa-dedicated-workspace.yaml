id: dp420-2d-fa-dedicated-workspace
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove plans to send the fleet analytics of its Azure Cosmos DB fleet to Microsoft Fabric. The existing workspace **ws-finance** contains the Power BI reports and lakehouses of the finance department.

    The security policy states that no service principal outside the finance team can create, modify or delete items in ws-finance. The finance analysts must still be able to build reports on the fleet analytics data.

    What should you do?
  fr: |
    Woodgrove prévoit d'envoyer l'analytique de la flotte de sa flotte Azure Cosmos DB vers Microsoft Fabric. L'espace de travail existant **ws-finance** contient les rapports Power BI et les lakehouses du service financier.

    La stratégie de sécurité stipule qu'aucun principal de service extérieur à l'équipe financière ne peut créer, modifier ou supprimer des éléments dans ws-finance. Les analystes financiers doivent pouvoir créer des rapports sur les données de l'analytique de la flotte.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Target a lakehouse of ws-finance, and add the Cosmos DB Fleet Analytics service principal to ws-finance as Viewer.", fr: "Cibler un lakehouse de ws-finance et ajouter le principal de service Cosmos DB Fleet Analytics à ws-finance comme Viewer." } }
    - { id: b, text: { en: "Target a lakehouse of ws-finance, and add the Cosmos DB Fleet Analytics service principal to ws-finance as Member.", fr: "Cibler un lakehouse de ws-finance et ajouter le principal de service Cosmos DB Fleet Analytics à ws-finance comme Member." } }
    - { id: c, text: { en: "Target an Azure Storage account that has no hierarchical namespace, and grant the analysts access to it.", fr: "Cibler un compte Stockage Azure sans espace de noms hiérarchique et y donner accès aux analystes." } }
    - { id: d, text: { en: "Target a lakehouse of a new dedicated workspace, and add the Cosmos DB Fleet Analytics service principal to it as Contributor.", fr: "Cibler un lakehouse d'un nouvel espace de travail dédié et y ajouter le principal de service Cosmos DB Fleet Analytics comme Contributor." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The Cosmos DB Fleet Analytics service principal needs the Contributor role on the entire destination workspace, which lets it change any item there. Microsoft therefore recommends a dedicated workspace for fleet analytics; the analysts can then be given access to that workspace to build their reports.
    fr: |
      Le principal de service Cosmos DB Fleet Analytics a besoin du rôle Contributor sur tout l'espace de travail de destination, ce qui lui permet de modifier n'importe quel élément. Microsoft recommande donc un espace de travail dédié à l'analytique de la flotte ; les analystes peuvent ensuite recevoir l'accès à cet espace de travail pour créer leurs rapports.
  options:
    a: { en: "With Viewer, the service principal can't write the tables, so no data arrives.", fr: "Avec Viewer, le principal de service ne peut pas écrire les tables : aucune donnée n'arrive." }
    b: { en: "Member includes the Contributor permissions on ws-finance, which the security policy forbids.", fr: "Member inclut les autorisations de Contributor sur ws-finance, ce que la stratégie de sécurité interdit." }
    c: { en: "A storage destination must be ADLS Gen2, with the hierarchical namespace enabled at account creation.", fr: "Une destination de stockage doit être ADLS Gen2, avec l'espace de noms hiérarchique activé à la création du compte." }
references:
  - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics
