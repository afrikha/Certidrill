id: dp420-2c-al-logical-partition
objective: "2.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A multitenant SaaS application stores all tenants in a container named **sessions** partitioned by `/tenantId`. Each physical partition holds hundreds of tenants.

    You need to be alerted whenever a single tenant (logical partition key value) consumes more than 5,000 RUs within one second, and the alert must identify the tenant.

    What should you configure?
  fr: |
    Une application SaaS multilocataire stocke tous les locataires dans un conteneur nommé **sessions** partitionné par `/tenantId`. Chaque partition physique héberge des centaines de locataires.

    Vous devez être alerté chaque fois qu'un seul locataire (valeur de clé de partition logique) consomme plus de 5 000 RU en une seconde, et l'alerte doit identifier le locataire.

    Que devez-vous configurer ?
body:
  options:
    - id: a
      text: { en: "A metric alert on Normalized RU Consumption split by PartitionKeyRangeId", fr: "Une alerte de métrique sur Normalized RU Consumption fractionnée par PartitionKeyRangeId" }
    - id: b
      text: { en: "A metric alert on Total Request Units split by CollectionName", fr: "Une alerte de métrique sur Total Request Units fractionnée par CollectionName" }
    - id: c
      text: { en: "An activity log alert on the throughput update events of the container", fr: "Une alerte de journal d'activité sur les événements de mise à jour du débit du conteneur" }
    - id: d
      text: { en: "A log search alert that queries CDBPartitionKeyRUConsumption by PartitionKey", fr: "Une alerte de recherche dans les journaux qui interroge CDBPartitionKeyRUConsumption par PartitionKey" }
answer: { optionId: d }
explanation:
  correct:
    en: "Platform metrics stop at the physical partition (PartitionKeyRangeId); only the opt-in diagnostic logs record RU consumption per logical partition key. After sending the PartitionKeyRUConsumption category to Log Analytics, a log search alert can sum RequestCharge by PartitionKey per second in the CDBPartitionKeyRUConsumption table and split by PartitionKey so that each alert names the tenant. Diagnostic logs are billed by ingested volume."
    fr: "Les métriques de plateforme s'arrêtent à la partition physique (PartitionKeyRangeId) ; seuls les journaux de diagnostic, à activer explicitement, enregistrent la consommation de RU par clé de partition logique. Après l'envoi de la catégorie PartitionKeyRUConsumption à Log Analytics, une alerte de recherche dans les journaux peut additionner RequestCharge par PartitionKey et par seconde dans la table CDBPartitionKeyRUConsumption, avec un fractionnement par PartitionKey pour que chaque alerte nomme le locataire. Les journaux de diagnostic sont facturés selon le volume ingéré."
  options:
    a: { en: "A partition key range holds many tenants, so the alert can't tell which logical key is hot.", fr: "Une plage de clés de partition héberge de nombreux locataires : l'alerte ne peut pas indiquer quelle clé logique est chaude." }
    b: { en: "Total Request Units has no logical partition key dimension and is emitted per minute.", fr: "Total Request Units n'a pas de dimension de clé de partition logique et est émise par minute." }
    c: { en: "Throughput updates are configuration changes, not RU consumption by tenant.", fr: "Les mises à jour du débit sont des modifications de configuration, pas une consommation de RU par locataire." }
references:
  - title: Diagnose and troubleshoot "Request rate too large" (429) exceptions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-request-rate-too-large
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
