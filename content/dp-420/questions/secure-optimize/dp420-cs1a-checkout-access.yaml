id: dp420-cs1a-checkout-access
objective: "2.1.2"
type: single
caseStudy: dp420-cs1a-adventure-works
difficulty: 1
status: draft
stem:
  en: |
    You need to grant app-checkout access to cosmos-aw-store. The solution must meet the requirements for app-checkout. What should you assign to the managed identity of app-checkout?
  fr: |
    Vous devez accorder à app-checkout l'accès à cosmos-aw-store. La solution doit respecter les exigences relatives à app-checkout. Que devez-vous attribuer à l'identité managée d'app-checkout ?
body:
  options:
    - { id: a, text: { en: "Cosmos DB Built-in Data Contributor at the scope /dbs/store/colls/sales", fr: "Cosmos DB Built-in Data Contributor à l'étendue /dbs/store/colls/sales" } }
    - { id: b, text: { en: "Cosmos DB Built-in Data Contributor at the scope /", fr: "Cosmos DB Built-in Data Contributor à l'étendue /" } }
    - { id: c, text: { en: "Cosmos DB Built-in Data Reader at the scope /dbs/store/colls/sales", fr: "Cosmos DB Built-in Data Reader à l'étendue /dbs/store/colls/sales" } }
    - { id: d, text: { en: "DocumentDB Account Contributor on the cosmos-aw-store account", fr: "DocumentDB Account Contributor sur le compte cosmos-aw-store" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A data plane role assignment of Cosmos DB Built-in Data Contributor lets the managed identity read and write items with Microsoft Entra authentication. Scoping the assignment to /dbs/store/colls/sales limits it to the sales container, which applies least privilege.
    fr: |
      Une attribution du rôle de plan de données Cosmos DB Built-in Data Contributor permet à l'identité managée de lire et d'écrire des éléments avec l'authentification Microsoft Entra. Limiter l'attribution à l'étendue /dbs/store/colls/sales la restreint au conteneur sales, ce qui applique le moindre privilège.
  options:
    b: { en: "The scope / covers every database and container of the account, which is broader than the sales container.", fr: "L'étendue / couvre toutes les bases de données et tous les conteneurs du compte, ce qui dépasse le conteneur sales." }
    c: { en: "Cosmos DB Built-in Data Reader allows reads and queries but no writes, so checkout could not save orders.", fr: "Cosmos DB Built-in Data Reader autorise les lectures et les requêtes mais aucune écriture : le paiement ne pourrait pas enregistrer les commandes." }
    d: { en: "DocumentDB Account Contributor is an Azure RBAC control plane role; it manages the account but grants no data plane access through Microsoft Entra ID.", fr: "DocumentDB Account Contributor est un rôle Azure RBAC du plan de contrôle ; il gère le compte mais n'accorde aucun accès au plan de données via Microsoft Entra ID." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
