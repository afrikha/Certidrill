id: dp420-2a-net-pe-existing-account
objective: "2.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **proseware-payments** accepts traffic from all networks. Production applications connect to it from virtual machines whose outbound public IP addresses are known.

    You plan to add a private endpoint to the account. By default, adding a private endpoint to an existing account causes a short downtime. The applications must keep their access during the change.

    What should you do before you create the private endpoint?
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **proseware-payments** accepte le trafic de tous les réseaux. Des applications de production s'y connectent depuis des machines virtuelles dont les adresses IP publiques sortantes sont connues.

    Vous prévoyez d'ajouter un point de terminaison privé au compte. Par défaut, ajouter un point de terminaison privé à un compte existant provoque une courte interruption. Les applications doivent conserver leur accès pendant la modification.

    Que devez-vous faire avant de créer le point de terminaison privé ?
body:
  options:
    - { id: a, text: { en: "Set publicNetworkAccess to Disabled, and wait about 10 minutes for the update to apply.", fr: "Définir publicNetworkAccess sur Disabled, puis attendre environ 10 minutes que la mise à jour s'applique." } }
    - { id: b, text: { en: "Add IP firewall rules that allow the applications, and wait about 10 minutes for the update to apply.", fr: "Ajouter des règles de pare-feu IP qui autorisent les applications, puis attendre environ 10 minutes que la mise à jour s'applique." } }
    - { id: c, text: { en: "Enable Accept connections from within public Azure datacenters, and wait about 10 minutes.", fr: "Activer l'option Accept connections from within public Azure datacenters, puis attendre environ 10 minutes." } }
    - { id: d, text: { en: "Create a private DNS zone named privatelink.documents.azure.com and link it to the application networks.", fr: "Créer une zone DNS privée nommée privatelink.documents.azure.com et la lier aux réseaux des applications." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      To avoid the downtime, first add IP or virtual network rules that allow your clients, wait about 10 minutes, create the private endpoint, and then remove the temporary rules. The rules keep the clients allowed while the account switches from all networks to restricted access.
    fr: |
      Pour éviter l'interruption, ajoutez d'abord des règles IP ou de réseau virtuel qui autorisent vos clients, attendez environ 10 minutes, créez le point de terminaison privé, puis supprimez les règles temporaires. Les règles maintiennent l'autorisation des clients pendant que le compte passe de tous les réseaux à un accès restreint.
  options:
    a: { en: "Disabling public network access blocks the applications, which still use the public endpoint.", fr: "Désactiver l'accès réseau public bloque les applications, qui utilisent encore le point de terminaison public." }
    c: { en: "This is not the documented method and opens the account to every Azure datacenter, including other customers.", fr: "Ce n'est pas la méthode documentée, et elle ouvre le compte à tous les centres de données Azure, y compris ceux d'autres clients." }
    d: { en: "A private DNS zone is needed for name resolution, but it does not keep the public clients allowed during the change.", fr: "Une zone DNS privée est nécessaire à la résolution de noms, mais elle ne maintient pas l'autorisation des clients publics pendant la modification." }
references:
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
