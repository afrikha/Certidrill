id: dp420-2d-fa-statements
objective: "2.4.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam enabled fleet analytics on its Azure Cosmos DB fleet, which contains 250 Azure Cosmos DB for NoSQL accounts. The destination is an Azure Data Lake Storage Gen2 account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam a activé l'analytique de la flotte sur sa flotte Azure Cosmos DB, qui contient 250 comptes Azure Cosmos DB for NoSQL. La destination est un compte Azure Data Lake Storage Gen2.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Fleet analytics data is preaggregated at a one-hour grain.
        fr: Les données de l'analytique de la flotte sont préagrégées avec une granularité d'une heure.
    - id: s2
      text:
        en: You can use fleet analytics to find the ActivityId of a request that consumed 4,000 RUs at 10:42.
        fr: Vous pouvez utiliser l'analytique de la flotte pour trouver l'ActivityId d'une requête qui a consommé 4 000 RU à 10 h 42.
    - id: s3
      text:
        en: A Spark notebook can query the fleet analytics tables as Delta Lake tables.
        fr: Un notebook Spark peut interroger les tables de l'analytique de la flotte en tant que tables Delta Lake.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Fleet analytics preaggregates data hourly into a star schema of open-source Delta Lake tables stored as Parquet files, which Spark or the Fabric SQL endpoint can query. Request-level detail, such as one request's ActivityId, is only in the resource logs of each account in Log Analytics.
    fr: |
      L'analytique de la flotte préagrège les données toutes les heures dans un schéma en étoile de tables Delta Lake open source stockées en fichiers Parquet, que Spark ou le point de terminaison SQL Fabric peuvent interroger. Le détail au niveau de la requête, comme l'ActivityId d'une requête, ne se trouve que dans les journaux de ressources de chaque compte dans Log Analytics.
references:
  - title: Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics
