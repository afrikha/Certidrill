id: dp420-2b-qp-composite-inverse
objective: "2.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL container named **Products**. Its indexing policy includes `/*` and defines a single composite index:

    ```json
    "compositeIndexes": [
      [
        { "path": "/category", "order": "ascending" },
        { "path": "/price", "order": "descending" }
      ]
    ]
    ```

    A Python application needs to sort products on both properties.

    Which two ORDER BY clauses can be served by this composite index?

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **Products**. Sa stratégie d'indexation inclut `/*` et définit un seul index composite :

    ```json
    "compositeIndexes": [
      [
        { "path": "/category", "order": "ascending" },
        { "path": "/price", "order": "descending" }
      ]
    ]
    ```

    Une application Python doit trier les produits sur les deux propriétés.

    Quelles sont les deux clauses ORDER BY que cet index composite peut servir ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ORDER BY c.category ASC, c.price DESC" }
    - { id: b, text: "ORDER BY c.price DESC, c.category ASC" }
    - { id: c, text: "ORDER BY c.category ASC, c.price ASC" }
    - { id: d, text: "ORDER BY c.category DESC, c.price ASC" }
    - { id: e, text: "ORDER BY c.category DESC, c.price DESC" }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      A composite index serves an ORDER BY whose properties are in the same sequence and whose directions either match every path or are the exact inverse of every path. (category ASC, price DESC) matches the index, and (category DESC, price ASC) is its exact inverse.
    fr: |
      Un index composite sert un ORDER BY dont les propriétés sont dans le même ordre et dont les sens correspondent à chaque chemin ou sont l'inverse exact de chaque chemin. (category ASC, price DESC) correspond à l'index, et (category DESC, price ASC) en est l'inverse exact.
  options:
    b: { en: "The properties are in a different sequence from the index paths.", fr: "Les propriétés sont dans un ordre différent de celui des chemins de l'index." }
    c: { en: "Only one direction is inverted, so the clause is neither the index nor its exact inverse.", fr: "Un seul sens est inversé : la clause n'est ni l'index ni son inverse exact." }
    e: { en: "Only one direction is inverted, so the clause is neither the index nor its exact inverse.", fr: "Un seul sens est inversé : la clause n'est ni l'index ni son inverse exact." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
