id: dp420-2b-mr-rpo-zero
objective: "2.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is designing an Azure Cosmos DB for NoSQL account for a payment ledger used by a C# service. The regions are West Europe and North Europe.

    The design must meet the following requirements:

    - No committed write can be lost if a whole region fails (RPO of zero).
    - Every read returns the most recent committed version of an item.

    Which configuration should you use?
  fr: |
    Woodgrove conçoit un compte Azure Cosmos DB for NoSQL pour un registre de paiements utilisé par un service C#. Les régions sont West Europe et North Europe.

    La conception doit répondre aux exigences suivantes :

    - Aucune écriture validée ne doit être perdue si une région entière tombe en panne (RPO nul).
    - Chaque lecture renvoie la version validée la plus récente d'un élément.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "Multi-region writes in both regions with Strong consistency", fr: "Écritures multirégions dans les deux régions avec la cohérence Strong" }
    - id: b
      text: { en: "Multi-region writes in both regions with Bounded Staleness consistency", fr: "Écritures multirégions dans les deux régions avec la cohérence Bounded Staleness" }
    - id: c
      text: { en: "A single write region and one read region with Strong consistency", fr: "Une seule région d'écriture et une région de lecture avec la cohérence Strong" }
    - id: d
      text: { en: "A single zone-redundant region with Session consistency", fr: "Une seule région redondante interzone avec la cohérence Session" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Strong consistency guarantees linearizable reads and has an RPO of zero for a region outage, because writes are committed in every region before they are acknowledged. It's supported with one write region and additional read regions.
    fr: |
      La cohérence Strong garantit des lectures linéarisables et un RPO nul en cas de panne régionale, car les écritures sont validées dans chaque région avant d'être confirmées. Elle est prise en charge avec une région d'écriture et des régions de lecture supplémentaires.
  options:
    a: { en: "Strong consistency isn't supported on accounts with multiple write regions.", fr: "La cohérence Strong n'est pas prise en charge sur les comptes à plusieurs régions d'écriture." }
    b: { en: "Bounded Staleness allows reads to lag behind writes, and its RPO for a region outage is the configured staleness window, not zero.", fr: "Bounded Staleness autorise les lectures à être en retard sur les écritures, et son RPO en cas de panne régionale est la fenêtre d'obsolescence configurée, pas zéro." }
    d: { en: "A single-region account, even zone-redundant, doesn't survive the loss of the whole region, and Session doesn't guarantee the latest version to every reader.", fr: "Un compte monorégion, même redondant interzone, ne survit pas à la perte de toute la région, et Session ne garantit pas la dernière version à tous les lecteurs." }
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
