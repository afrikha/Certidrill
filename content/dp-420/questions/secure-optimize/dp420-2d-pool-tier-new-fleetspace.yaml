id: dp420-2d-pool-tier-new-fleetspace
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB fleet named **fleet-tailspin**. A fleetspace named **fs-std** has throughput pooling with the **GeneralPurpose** service tier and the data regions West Europe and North Europe. It contains 200 tenant accounts that have a single write region.

    A new premium tenant gets an account named **cosmos-premium-01** with multi-region writes in West Europe and North Europe. The tenant must keep multi-region writes and must be able to draw RU/s from a pool during its peaks. The existing tenants must not be affected.

    What should you do?
  fr: |
    Tailspin dispose d'une flotte Azure Cosmos DB nommée **fleet-tailspin**. Un fleetspace nommé **fs-std** a un pool de débit avec le niveau de service **GeneralPurpose** et les régions de données West Europe et North Europe. Il contient 200 comptes de locataires qui ont une seule région d'écriture.

    Un nouveau locataire premium reçoit un compte nommé **cosmos-premium-01** avec des écritures multirégions dans West Europe et North Europe. Le locataire doit conserver les écritures multirégions et doit pouvoir puiser des RU/s dans un pool pendant ses pics. Les locataires existants ne doivent pas être affectés.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the service tier of fs-std to BusinessCritical, and then add cosmos-premium-01 to fs-std.", fr: "Changer le niveau de service de fs-std en BusinessCritical, puis ajouter cosmos-premium-01 à fs-std." } }
    - { id: b, text: { en: "Add cosmos-premium-01 to fs-std, which serves the account from the pool of its West Europe region only.", fr: "Ajouter cosmos-premium-01 à fs-std, qui sert le compte uniquement à partir du pool de sa région West Europe." } }
    - { id: c, text: { en: "Create a fleetspace with pooling, the BusinessCritical tier and both regions, and then add cosmos-premium-01 to it.", fr: "Créer un fleetspace avec pool, le niveau BusinessCritical et les deux régions, puis y ajouter cosmos-premium-01." } }
    - { id: d, text: { en: "Create a second fleet, and then add cosmos-premium-01 to fs-std and to a fleetspace of the second fleet.", fr: "Créer une deuxième flotte, puis ajouter cosmos-premium-01 à fs-std et à un fleetspace de la deuxième flotte." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      All accounts that share a pool must have the same regional configuration and service tier: GeneralPurpose for single-region writes, BusinessCritical for multi-region writes. A multi-region-write account therefore needs its own fleetspace with the BusinessCritical tier and the same regions; a fleet can contain several fleetspaces.
    fr: |
      Tous les comptes qui partagent un pool doivent avoir la même configuration de régions et le même niveau de service : GeneralPurpose pour les écritures dans une seule région, BusinessCritical pour les écritures multirégions. Un compte à écritures multirégions a donc besoin de son propre fleetspace avec le niveau BusinessCritical et les mêmes régions ; une flotte peut contenir plusieurs fleetspaces.
  options:
    a: { en: "The service tier and the regions of a fleetspace can't change after it is created, and the 200 existing accounts would no longer match it.", fr: "Le niveau de service et les régions d'un fleetspace ne peuvent pas changer après sa création, et les 200 comptes existants ne lui correspondraient plus." }
    b: { en: "An account whose service tier differs from the fleetspace's can't share its pool.", fr: "Un compte dont le niveau de service diffère de celui du fleetspace ne peut pas partager son pool." }
    d: { en: "An account belongs to only one fleetspace and one fleet.", fr: "Un compte n'appartient qu'à un seul fleetspace et à une seule flotte." }
references:
