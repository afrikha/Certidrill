id: dp420-2d-log-throughput-caller
objective: "2.3.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account named **cosmos-adatum**. A diagnostic setting sends the **ControlPlaneRequests** category to a Log Analytics workspace, and the activity log of the subscription is sent to the same workspace.

    Yesterday, someone lowered the throughput of the **orders** container from 4,000 RU/s to 400 RU/s by using the Azure portal. The control plane logs show the `SqlContainersThroughputUpdate` operation.

    You need to identify the identity that initiated the change.

    Which data should you query?
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-adatum**. Un paramètre de diagnostic envoie la catégorie **ControlPlaneRequests** vers un espace de travail Log Analytics, et le journal d'activité de l'abonnement est envoyé vers le même espace de travail.

    Hier, quelqu'un a réduit le débit du conteneur **orders** de 4 000 RU/s à 400 RU/s dans le portail Azure. Les journaux du plan de contrôle montrent l'opération `SqlContainersThroughputUpdate`.

    Vous devez identifier l'identité qui a lancé la modification.

    Quelles données devez-vous interroger ?
body:
  options:
    - { id: a, text: { en: "The ResourceDetails column of the operation in the CDBControlPlaneRequests table", fr: "La colonne ResourceDetails de l'opération dans la table CDBControlPlaneRequests" } }
    - { id: b, text: { en: "The AadPrincipalId column of the requests in the CDBDataPlaneRequests table", fr: "La colonne AadPrincipalId des requêtes dans la table CDBDataPlaneRequests" } }
    - { id: c, text: { en: "The QueryText column of the matching rows in the CDBQueryRuntimeStatistics table", fr: "La colonne QueryText des lignes correspondantes dans la table CDBQueryRuntimeStatistics" } }
    - { id: d, text: { en: "The Caller column of the matching operation in the AzureActivity table", fr: "La colonne Caller de l'opération correspondante dans la table AzureActivity" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Control plane diagnostic logs record what changed, but the identity that initiated an Azure Resource Manager operation is in the activity log. Find the operation in AzureActivity by its activity ID or its timestamp, and read the Caller column.
    fr: |
      Les journaux de diagnostic du plan de contrôle enregistrent ce qui a changé, mais l'identité qui a lancé une opération Azure Resource Manager se trouve dans le journal d'activité. Retrouvez l'opération dans AzureActivity par son ID d'activité ou par son horodatage, puis lisez la colonne Caller.
  options:
    a: { en: "ResourceDetails contains the request body of the change (the new settings), not the caller.", fr: "ResourceDetails contient le corps de la requête de modification (les nouveaux paramètres), pas l'appelant." }
    b: { en: "CDBDataPlaneRequests records item and query operations; a throughput change made in the portal is a control plane operation.", fr: "CDBDataPlaneRequests enregistre les opérations sur les éléments et les requêtes ; une modification de débit faite dans le portail est une opération du plan de contrôle." }
    c: { en: "CDBQueryRuntimeStatistics records the text of data plane queries only.", fr: "CDBQueryRuntimeStatistics enregistre uniquement le texte des requêtes du plan de données." }
references:
  - title: How to Audit Control Plane Operations - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/audit-control-plane-logs
