id: dp420-2a-authz-delete-actions
objective: "2.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    A cleanup service uses the Azure Cosmos DB Python SDK with Microsoft Entra authentication. It receives a list of item IDs and partition key values from a queue and calls `delete_item` for each one in a container named **sessions**. It never reads, queries or writes items.

    You need to create a custom data plane role for the service that follows the principle of least privilege.

    Which two data actions should the role include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un service de nettoyage utilise le SDK Python Azure Cosmos DB avec l'authentification Microsoft Entra. Il reçoit d'une file d'attente une liste d'ID d'éléments et de valeurs de clé de partition, et appelle `delete_item` pour chacun dans un conteneur nommé **sessions**. Il ne lit, n'interroge et n'écrit jamais d'éléments.

    Vous devez créer pour le service un rôle personnalisé du plan de données qui respecte le principe du moindre privilège.

    Quelles sont les deux actions de données que le rôle doit inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/replace" }
    - { id: b, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery" }
    - { id: c, text: "Microsoft.DocumentDB/databaseAccounts/readMetadata" }
    - { id: d, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/delete" }
    - { id: e, text: "Microsoft.DocumentDB/databaseAccounts/listKeys/action" }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: |
      `readMetadata` must be allowed whenever an SDK accesses the account, because the SDK reads the account, container and partition metadata. `items/delete` allows deleting an item; no other data action is needed for deletes by ID and partition key.
    fr: |
      `readMetadata` doit être autorisée dès qu'un SDK accède au compte, car le SDK lit les métadonnées du compte, des conteneurs et des partitions. `items/delete` permet de supprimer un élément ; aucune autre action de données n'est nécessaire pour des suppressions par ID et clé de partition.
  options:
    a: { en: "replace overwrites existing items; the service never writes.", fr: "replace remplace des éléments existants ; le service n'écrit jamais." }
    b: { en: "The service does not query; it already knows each ID and partition key.", fr: "Le service n'exécute pas de requêtes ; il connaît déjà chaque ID et chaque clé de partition." }
    e: { en: "listKeys is a control plane action that returns the account keys, which the service must not need.", fr: "listKeys est une action du plan de contrôle qui renvoie les clés du compte, dont le service ne doit pas avoir besoin." }
references:
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
