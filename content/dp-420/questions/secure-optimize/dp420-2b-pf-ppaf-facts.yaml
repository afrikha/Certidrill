id: dp420-2b-pf-ppaf-facts
objective: "2.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware plans to use per-partition automatic failover for its Azure Cosmos DB for NoSQL accounts. The accounts serve Python applications that use `azure-cosmos` 4.16.0 or later.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware prévoit d'utiliser le basculement automatique par partition pour ses comptes Azure Cosmos DB for NoSQL. Les comptes servent des applications Python qui utilisent `azure-cosmos` 4.16.0 ou ultérieur.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          During a partition-level failover, healthy partitions keep their write region while the affected partitions fail over.
        fr: |
          Pendant un basculement au niveau des partitions, les partitions saines conservent leur région d'écriture tandis que les partitions affectées basculent.
    - id: s2
      text:
        en: |
          You can enable the feature on a single-region account if the region uses availability zones.
        fr: |
          Vous pouvez activer la fonctionnalité sur un compte monorégion si la région utilise des zones de disponibilité.
    - id: s3
      text:
        en: |
          The fault simulation for the feature applies to every partition of the target container.
        fr: |
          La simulation de panne de la fonctionnalité s'applique à toutes les partitions du conteneur cible.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The feature fails over individual partitions in error while healthy partitions stay in the primary region. It needs a single write region plus at least one other read region; availability zones don't replace that second region. The simulation applies to 10 percent of the partitions of the container, with a minimum of 1 and a maximum of 10, and can take up to 15 minutes to take effect.
    fr: |
      La fonctionnalité bascule individuellement les partitions en erreur, tandis que les partitions saines restent dans la région principale. Elle nécessite une seule région d'écriture et au moins une autre région de lecture ; les zones de disponibilité ne remplacent pas cette seconde région. La simulation s'applique à 10 pour cent des partitions du conteneur, avec un minimum de 1 et un maximum de 10, et peut mettre jusqu'à 15 minutes à prendre effet.
references:
  - title: Configure per-partition automatic failover for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
