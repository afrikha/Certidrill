id: dp420-2d-pool-setup-order
objective: "2.4.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware is an ISV that gives each of its 600 B2B tenants a dedicated Azure Cosmos DB for NoSQL account. The accounts are spread across several subscriptions and resource groups, and all of them have a single write region in West Europe. Each tenant container has autoscale throughput of 100 to 1,000 RU/s.

    You need the tenant accounts to absorb their occasional peaks from shared RU/s instead of provisioning each container for its peak. No fleet exists yet.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware est un éditeur de logiciels (ISV) qui attribue à chacun de ses 600 locataires B2B un compte Azure Cosmos DB for NoSQL dédié. Les comptes sont répartis sur plusieurs abonnements et groupes de ressources, et ils ont tous une seule région d'écriture dans West Europe. Chaque conteneur de locataire a un débit avec mise à l'échelle automatique de 100 à 1 000 RU/s.

    Vous devez faire en sorte que les comptes des locataires absorbent leurs pics occasionnels à partir de RU/s partagées, au lieu de provisionner chaque conteneur pour son pic. Aucune flotte n'existe encore.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: space, text: { en: "Create a fleetspace with throughput pooling, the West Europe data region and the GeneralPurpose service tier.", fr: "Créer un fleetspace avec un pool de débit, la région de données West Europe et le niveau de service GeneralPurpose." } }
    - { id: merge, text: { en: "Move the containers of all tenants into a single shared account.", fr: "Déplacer les conteneurs de tous les locataires dans un seul compte partagé." } }
    - { id: add, text: { en: "Add each tenant account to the fleetspace as a fleetspace account.", fr: "Ajouter chaque compte de locataire au fleetspace en tant que compte de fleetspace." } }
    - { id: analytics, text: { en: "Add a fleet analytics destination in a Microsoft Fabric workspace.", fr: "Ajouter une destination d'analytique de la flotte dans un espace de travail Microsoft Fabric." } }
    - { id: fleet, text: { en: "Create an Azure Cosmos DB fleet resource.", fr: "Créer une ressource de flotte Azure Cosmos DB." } }
    - { id: shared, text: { en: "Switch each tenant database to shared database throughput.", fr: "Passer chaque base de données de locataire en débit partagé au niveau de la base de données." } }
answer:
  sequence: [ fleet, space, add ]
explanation:
  correct:
    en: |
      A fleet is the top-level resource, a fleetspace is created inside the fleet and carries the optional pool, and fleetspace accounts link existing accounts, from any subscription or resource group, to the fleetspace. Because all accounts have a single write region in West Europe, they match a GeneralPurpose pool in that region, and their containers keep their dedicated RU/s and draw from the pool above it.
    fr: |
      Une flotte est la ressource de premier niveau, un fleetspace est créé dans la flotte et porte le pool facultatif, et les comptes de fleetspace relient des comptes existants, de n'importe quel abonnement ou groupe de ressources, au fleetspace. Comme tous les comptes ont une seule région d'écriture dans West Europe, ils correspondent à un pool GeneralPurpose dans cette région, et leurs conteneurs conservent leurs RU/s dédiées et puisent dans le pool au-delà.
  options:
    merge: { en: "Fleets keep one account per tenant for isolation; merging the tenants removes that isolation and isn't needed for pooling.", fr: "Les flottes conservent un compte par locataire pour l'isolation ; regrouper les locataires supprime cette isolation et n'est pas nécessaire au pool." }
    analytics: { en: "Fleet analytics monitors the fleet; it doesn't share RU/s.", fr: "L'analytique de la flotte surveille la flotte ; elle ne partage pas de RU/s." }
    shared: { en: "Shared database throughput is shared only among the containers of one database, not across tenant accounts.", fr: "Le débit partagé d'une base de données n'est partagé qu'entre les conteneurs de cette base, pas entre les comptes des locataires." }
references:
  - title: Create a Fleet (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-create-fleet
  - title: Fleets Overview - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet
