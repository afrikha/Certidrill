id: dp420-2b-mr-conflict-facts
objective: "2.2.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account with multi-region writes in East US and West Europe. A container named **Carts** uses the default conflict resolution policy. A new container named **Quotes** will use a custom policy with a merge stored procedure.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions dans les régions East US et West Europe. Un conteneur nommé **Carts** utilise la stratégie de résolution des conflits par défaut. Un nouveau conteneur nommé **Quotes** utilisera une stratégie personnalisée avec une procédure stockée de fusion.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          In Carts, if an item is deleted in East US while it is updated in West Europe, the delete wins.
        fr: |
          Dans Carts, si un élément est supprimé dans East US pendant qu'il est mis à jour dans West Europe, la suppression l'emporte.
    - id: s2
      text:
        en: |
          You can switch Carts to a custom conflict resolution policy after it has been created.
        fr: |
          Vous pouvez faire passer Carts à une stratégie de résolution des conflits personnalisée après sa création.
    - id: s3
      text:
        en: |
          In Quotes, if the merge stored procedure throws an exception, the conflict is written to the conflicts feed.
        fr: |
          Dans Quotes, si la procédure stockée de fusion lève une exception, le conflit est écrit dans le flux de conflits.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Under Last Writer Wins, the default policy, a delete always wins over a concurrent insert or replace. A custom policy can only be set when the container is created. When no merge procedure is registered, or the procedure fails at run time, the conflict goes to the conflicts feed, where the application must resolve it.
    fr: |
      Avec Last Writer Wins, la stratégie par défaut, une suppression l'emporte toujours sur une insertion ou un remplacement simultanés. Une stratégie personnalisée ne peut être définie qu'à la création du conteneur. Quand aucune procédure de fusion n'est inscrite, ou que la procédure échoue à l'exécution, le conflit est écrit dans le flux de conflits, où l'application doit le résoudre.
references:
  - title: Conflict types and resolution policies when using multiple write regions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
