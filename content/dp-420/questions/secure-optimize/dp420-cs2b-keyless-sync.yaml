id: dp420-cs2b-keyless-sync
objective: "2.1.1"
type: dropdown
caseStudy: dp420-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    The managed identity of the virtual machine has been granted a data plane role on cosmos-wwi that covers the operations of carrier-sync.

    You need to meet the authentication requirement.

    What should you use? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'identité managée de la machine virtuelle s'est vu attribuer sur cosmos-wwi un rôle de plan de données qui couvre les opérations de carrier-sync.

    Vous devez respecter l'exigence d'authentification.

    Que devez-vous utiliser ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Credential passed by carrier-sync to CosmosClient: [[cred]]

      Account property to set after carrier-sync is updated: [[prop]]
    fr: |
      Information d'identification transmise par carrier-sync à CosmosClient : [[cred]]

      Propriété du compte à définir après la mise à jour de carrier-sync : [[prop]]
  slots:
    - id: cred
      options:
        - { id: key, text: "AzureKeyCredential(primary_key)" }
        - { id: dac, text: "DefaultAzureCredential()" }
        - { id: secret, text: "ClientSecretCredential(tenant_id, client_id, client_secret)" }
    - id: prop
      options:
        - { id: pna, text: "properties.publicNetworkAccess=Disabled" }
        - { id: local, text: "properties.disableLocalAuth=true" }
        - { id: failover, text: "properties.enableAutomaticFailover=false" }
answer:
  values: { cred: dac, prop: local }
explanation:
  correct:
    en: "`DefaultAzureCredential` obtains a Microsoft Entra token for the system-assigned managed identity of the virtual machine, so carrier-sync authenticates without a stored secret and keeps working once keys are refused. Setting `properties.disableLocalAuth` to `true` (for example with `az resource update --set`) then disables key-based authentication on the account."
    fr: "`DefaultAzureCredential` obtient un jeton Microsoft Entra pour l'identité managée affectée par le système de la machine virtuelle : carrier-sync s'authentifie sans secret stocké et continue de fonctionner une fois les clés refusées. Définir `properties.disableLocalAuth` sur `true` (par exemple avec `az resource update --set`) désactive ensuite l'authentification par clé sur le compte."
  options:
    key: { en: "A key credential stops working as soon as key-based authentication is disabled, and the key is a stored secret.", fr: "Une information d'identification par clé cesse de fonctionner dès que l'authentification par clé est désactivée, et la clé est un secret stocké." }
    secret: { en: "A client secret is a secret that would have to be stored on the virtual machine.", fr: "Un secret client est un secret qu'il faudrait stocker sur la machine virtuelle." }
    pna: { en: "Disabling public network access controls network reachability, not key-based authentication.", fr: "Désactiver l'accès réseau public contrôle l'accessibilité réseau, pas l'authentification par clé." }
    failover: { en: "Automatic failover controls regional availability, not authentication.", fr: "Le basculement automatique contrôle la disponibilité régionale, pas l'authentification." }
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
