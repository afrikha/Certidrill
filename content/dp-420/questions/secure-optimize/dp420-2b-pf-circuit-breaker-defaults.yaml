id: dp420-2b-pf-circuit-breaker-defaults
objective: "2.2.3"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account with multi-region writes in East US and West US. A C# order service uses the .NET SDK v3 with `ApplicationPreferredRegions` set to East US, then West US. No environment variable related to the SDK is set on the hosts.

    The team wants to understand the partition-level circuit breaker of the SDK before changing anything.

    How should you complete the statement? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions dans les régions East US et West US. Un service de commandes C# utilise le SDK .NET v3 avec `ApplicationPreferredRegions` défini sur East US, puis West US. Aucune variable d'environnement liée au SDK n'est définie sur les hôtes.

    L'équipe veut comprendre le disjoncteur au niveau des partitions du SDK avant de modifier quoi que ce soit.

    Comment devez-vous compléter l'affirmation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      In the current configuration, the partition-level circuit breaker is [[state]]. Once it is enabled on this account, it applies to [[ops]], and by default it redirects writes for a partition to West US after [[count]] consecutive failures.
    fr: |
      Dans la configuration actuelle, le disjoncteur au niveau des partitions est [[state]]. Une fois activé sur ce compte, il s'applique [[ops]], et par défaut il redirige les écritures d'une partition vers West US après [[count]] échecs consécutifs.
  slots:
    - id: state
      options:
        - { id: off, text: { en: "disabled", fr: "désactivé" } }
        - { id: on, text: { en: "enabled", fr: "activé" } }
    - id: ops
      options:
        - { id: rw, text: { en: "reads and writes", fr: "aux lectures et aux écritures" } }
        - { id: r, text: { en: "reads only", fr: "aux lectures uniquement" } }
        - { id: w, text: { en: "writes only", fr: "aux écritures uniquement" } }
    - id: count
      options:
        - { id: c3, text: "3" }
        - { id: c5, text: "5" }
        - { id: c10, text: "10" }
answer:
  values: { state: off, ops: rw, count: c5 }
explanation:
  correct:
    en: "The partition-level circuit breaker is disabled by default (`AZURE_COSMOS_CIRCUIT_BREAKER_ENABLED` defaults to `false`); it is enabled automatically only when partition-level failover is enabled, which doesn't apply to a multi-region write account. On multi-region write accounts both reads and writes participate, and the default thresholds are 5 consecutive failures for writes and 10 for reads."
    fr: "Le disjoncteur au niveau des partitions est désactivé par défaut (`AZURE_COSMOS_CIRCUIT_BREAKER_ENABLED` vaut `false` par défaut) ; il n'est activé automatiquement que lorsque le basculement au niveau des partitions est activé, ce qui ne s'applique pas à un compte à écritures multirégions. Sur ces comptes, les lectures comme les écritures sont concernées, et les seuils par défaut sont de 5 échecs consécutifs pour les écritures et de 10 pour les lectures."
  options:
    r: { en: "Only reads participate on single-write-region accounts; this account has multi-region writes.", fr: "Seules les lectures sont concernées sur les comptes à une seule région d'écriture ; ce compte a des écritures multirégions." }
    c10: { en: "10 is the default threshold for reads, not for writes.", fr: "10 est le seuil par défaut des lectures, pas des écritures." }
references:
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
