id: dp420-cs2c-fleet-pool
objective: "2.4.1"
type: multi
caseStudy: dp420-cs2c-vanarsdel
difficulty: 3
status: draft
stem:
  en: |
    You need to add Enterprise accounts to fs-weu so that they draw RU/s from its pool. The solution must meet the third requirement.

    Which two accounts should you add to fs-weu?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez ajouter des comptes Enterprise à fs-weu pour qu'ils consomment des RU/s de son pool. La solution doit respecter la troisième exigence.

    Quels sont les deux comptes à ajouter à fs-weu ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: vad-ent-02 }
    - { id: b, text: vad-ent-03 }
    - { id: c, text: vad-ent-04 }
    - { id: d, text: vad-ent-05 }
    - { id: e, text: vad-ent-06 }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: All the accounts of a fleetspace that shares a pool must have the same regional configuration and the same service tier (single-region write or multi-region writes). vad-ent-02 and vad-ent-04 match vad-ent-01 (West Europe only, single-region write); being in other subscriptions does not matter, because a pool can be shared across subscriptions and resource groups of the fleet.
    fr: Tous les comptes d'un fleetspace qui partage un pool doivent avoir la même configuration régionale et le même niveau de service (écriture dans une seule région ou écritures multirégions). vad-ent-02 et vad-ent-04 correspondent à vad-ent-01 (West Europe uniquement, écriture dans une seule région) ; le fait qu'ils soient dans d'autres abonnements n'a pas d'importance, car un pool peut être partagé entre les abonnements et les groupes de ressources de la flotte.
  options:
    b: { en: "vad-ent-03 has a different set of regions (West Europe and North Europe), so it cannot share the pool with vad-ent-01.", fr: "vad-ent-03 a un autre ensemble de régions (West Europe et North Europe) : il ne peut pas partager le pool avec vad-ent-01." }
    d: { en: "vad-ent-05 has a different set of regions and uses multi-region writes, and accounts of different tiers cannot share a pool.", fr: "vad-ent-05 a un autre ensemble de régions et utilise les écritures multirégions, et des comptes de niveaux différents ne peuvent pas partager un pool." }
    e: { en: "vad-ent-06 already belongs to fs-pilot, and an account belongs to only one fleetspace; moving it would change its membership.", fr: "vad-ent-06 appartient déjà à fs-pilot, et un compte n'appartient qu'à un seul fleetspace ; le déplacer modifierait son appartenance." }
references:
  - title: Azure Cosmos DB fleet pools
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
  - title: Fleets Overview - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet
