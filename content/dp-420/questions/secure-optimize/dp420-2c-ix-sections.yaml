id: dp420-2c-ix-sections
objective: "2.3.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are explaining the output of indexing metrics to a new developer at Proseware.

    Which element of the indexing metrics provides each piece of information? To answer, drag the appropriate elements to the correct descriptions. Each element may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous expliquez la sortie des métriques d'indexation à un nouveau développeur de Proseware.

    Quel élément des métriques d'indexation fournit chaque information ? Pour répondre, faites glisser les éléments appropriés vers les descriptions correspondantes. Chaque élément peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: usi, text: Utilized Single Indexes }
    - { id: psi, text: Potential Single Indexes }
    - { id: uci, text: Utilized Composite Indexes }
    - { id: pci, text: Potential Composite Indexes }
    - { id: score, text: Index Impact Score }
  targets:
    - id: t1
      text: { en: "Included paths that the query used", fr: "Chemins inclus que la requête a utilisés" }
    - id: t2
      text: { en: "Included paths that the query might use if you add them", fr: "Chemins inclus que la requête pourrait utiliser si vous les ajoutiez" }
    - id: t3
      text: { en: "Composite indexes that might improve the query if you add them", fr: "Index composites qui pourraient améliorer la requête si vous les ajoutiez" }
    - id: t4
      text: { en: "Likelihood, based on the query shape, that a path substantially lowers the RU charge", fr: "Probabilité, d'après la forme de la requête, qu'un chemin réduise sensiblement les frais en RU" }
answer:
  mapping: { t1: usi, t2: psi, t3: pci, t4: score }
explanation:
  correct:
    en: Utilized single indexes are the included paths the query used, and potential single indexes are included paths it might use if added. Potential composite indexes are composite indexes that could improve the query if added. The index impact score (High or Low) is the likelihood, based only on the query shape, that the path has a significant impact on the RU charge. Utilized Composite Indexes, which lists the composite indexes already used, matches none of the descriptions.
    fr: Les index simples utilisés sont les chemins inclus que la requête a utilisés, et les index simples potentiels sont les chemins inclus qu'elle pourrait utiliser s'ils étaient ajoutés. Les index composites potentiels sont des index composites qui pourraient améliorer la requête s'ils étaient ajoutés. Le score d'impact d'index (High ou Low) est la probabilité, fondée uniquement sur la forme de la requête, que le chemin ait un impact significatif sur les frais en RU. Utilized Composite Indexes, qui liste les index composites déjà utilisés, ne correspond à aucune description.
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
