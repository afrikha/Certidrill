id: dp420-2a-auth-resource-token-expiry
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Proseware has a mobile app that reads a product catalog stored in an Azure Cosmos DB for NoSQL container named **catalog**. The mobile app must never receive an account key. A trusted mid-tier service authenticates each user, reads a permission with the `Read` mode on the catalog container for that user, and returns the resource token to the app.

    Users report that requests start to fail with an authorization error about one hour after they sign in. Sessions last up to four hours, and the app must not call the mid-tier again during a session.

    What should you do?
  fr: |
    Proseware dispose d'une application mobile qui lit un catalogue de produits stocké dans un conteneur Azure Cosmos DB for NoSQL nommé **catalog**. L'application mobile ne doit jamais recevoir de clé de compte. Un service de niveau intermédiaire approuvé authentifie chaque utilisateur, lit pour cet utilisateur une autorisation (permission) en mode `Read` sur le conteneur catalog, puis renvoie le jeton de ressource à l'application.

    Les utilisateurs signalent que les requêtes commencent à échouer avec une erreur d'autorisation environ une heure après leur connexion. Les sessions durent jusqu'à quatre heures, et l'application ne doit pas rappeler le service intermédiaire pendant une session.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "In the mid-tier, change the permission mode from Read to All so that the token is not limited in time.", fr: "Dans le service intermédiaire, passer le mode de l'autorisation de Read à All pour que le jeton ne soit pas limité dans le temps." }
    - id: b
      text: { en: "In the mid-tier, create a second permission for the same user on the catalog container as a backup token.", fr: "Dans le service intermédiaire, créer une deuxième autorisation pour le même utilisateur sur le conteneur catalog comme jeton de secours." }
    - id: c
      text: { en: "In the mid-tier, return the primary read-only key instead of a resource token for the whole session.", fr: "Dans le service intermédiaire, renvoyer la clé primaire en lecture seule au lieu d'un jeton de ressource pour toute la session." }
    - id: d
      text: { en: "In the mid-tier, set the x-ms-documentdb-expiry-seconds header to 14400 when it reads the permission.", fr: "Dans le service intermédiaire, définir l'en-tête x-ms-documentdb-expiry-seconds sur 14400 lors de la lecture de l'autorisation." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A resource token is generated each time the permission is read and is valid for one hour by default. The x-ms-documentdb-expiry-seconds request header changes this validity up to a maximum of five hours, so 14400 seconds (four hours) covers a whole session.
    fr: |
      Un jeton de ressource est généré à chaque lecture de l'autorisation et il est valide une heure par défaut. L'en-tête de requête x-ms-documentdb-expiry-seconds modifie cette validité, jusqu'à cinq heures au maximum : 14400 secondes (quatre heures) couvrent donc une session entière.
  options:
    a: { en: "The permission mode only chooses between read-only (Read) and read, write and delete (All) access; it does not change the token lifetime.", fr: "Le mode de l'autorisation choisit seulement entre un accès en lecture seule (Read) et un accès en lecture, écriture et suppression (All) ; il ne change pas la durée de vie du jeton." }
    b: { en: "A resource can have only one permission per user: the second permission is rejected with a 409 conflict.", fr: "Une ressource ne peut avoir qu'une autorisation par utilisateur : la deuxième est rejetée avec un conflit 409." }
    c: { en: "The mobile app must never receive an account key, even a read-only one.", fr: "L'application mobile ne doit jamais recevoir de clé de compte, même en lecture seule." }
references:
  - title: Permissions
    url: https://learn.microsoft.com/en-us/rest/api/cosmos-db/permissions
