id: dp420-2b-pf-verify-metric
objective: "2.2.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account with per-partition automatic failover enabled. The write region is Central US and the read region is East US 2. During a disaster recovery drill, you inject the per-partition automatic failover fault on a container named **Policies** in Central US, and then you run the critical C# transactions.

    You need to confirm from the Azure portal metrics that partitions of **Policies** actually failed over.

    What should you check?
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL où le basculement automatique par partition est activé. La région d'écriture est Central US et la région de lecture est East US 2. Pendant un exercice de reprise d'activité, vous injectez la panne de basculement automatique par partition sur un conteneur nommé **Policies** dans Central US, puis vous exécutez les transactions C# critiques.

    Vous devez confirmer, à partir des métriques du portail Azure, que des partitions de **Policies** ont effectivement basculé.

    Que devez-vous vérifier ?
body:
  options:
    - id: a
      text: { en: "The Region Offline metric of the account", fr: "La métrique Region Offline du compte" }
    - id: b
      text: { en: "Total Requests split by region, and the PartitionWriteGlobalStatus metric", fr: "Total Requests fractionnée par région, et la métrique PartitionWriteGlobalStatus" }
    - id: c
      text: { en: "Normalized RU Consumption split by PartitionKeyRangeId", fr: "Normalized RU Consumption fractionnée par PartitionKeyRangeId" }
    - id: d
      text: { en: "The Service Health events of Central US", fr: "Les événements Service Health de Central US" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      During the simulation, writes for the failed-over partitions appear in the secondary region in Total Requests split by region. The PartitionWriteGlobalStatus metric counts the write partitions in each region at a given time, which shows how many partitions failed over.
    fr: |
      Pendant la simulation, les écritures des partitions basculées apparaissent dans la région secondaire dans Total Requests fractionnée par région. La métrique PartitionWriteGlobalStatus compte les partitions d'écriture de chaque région à un instant donné, ce qui montre combien de partitions ont basculé.
  options:
    a: { en: "Region Offline reports offline region operations on the whole region, which a partition-level failover doesn't perform.", fr: "Region Offline signale les opérations de mise hors ligne de toute une région, ce que ne fait pas un basculement au niveau des partitions." }
    c: { en: "Normalized RU Consumption shows load per partition key range, not the region where each partition accepts writes.", fr: "Normalized RU Consumption montre la charge par plage de clés de partition, pas la région où chaque partition accepte les écritures." }
    d: { en: "A simulated fault isn't a platform incident, so Service Health shows no event for it.", fr: "Une panne simulée n'est pas un incident de plateforme : Service Health n'affiche aucun événement à son sujet." }
references:
  - title: Configure per-partition automatic failover for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
