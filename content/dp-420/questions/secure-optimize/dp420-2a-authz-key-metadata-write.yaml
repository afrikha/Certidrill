id: dp420-2a-authz-key-metadata-write
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has a **CanNotDelete** resource lock on an Azure Cosmos DB for NoSQL account named **adatum-erp**. Several applications still connect with the primary key and must keep using it for item operations until their migration to Microsoft Entra ID is finished.

    Last week, a script that uses the primary key deleted a container, even though the lock was in place. You need to make sure that changes to databases, containers, throughput and indexing policies can no longer be made with account keys, so that the lock and Azure RBAC apply to them.

    What should you do?
  fr: |
    Adatum a placé un verrou de ressource **CanNotDelete** sur un compte Azure Cosmos DB for NoSQL nommé **adatum-erp**. Plusieurs applications se connectent encore avec la clé primaire et doivent continuer à l'utiliser pour les opérations sur les éléments jusqu'à la fin de leur migration vers Microsoft Entra ID.

    La semaine dernière, un script qui utilise la clé primaire a supprimé un conteneur, alors que le verrou était en place. Vous devez faire en sorte que les modifications des bases de données, des conteneurs, du débit et des stratégies d'indexation ne puissent plus être faites avec des clés de compte, afin que le verrou et Azure RBAC s'y appliquent.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set disableLocalAuth to true on the account.", fr: "Définir disableLocalAuth sur true sur le compte." } }
    - { id: b, text: { en: "Replace the CanNotDelete lock with a ReadOnly lock.", fr: "Remplacer le verrou CanNotDelete par un verrou ReadOnly." } }
    - { id: c, text: { en: "Regenerate the primary key and give the script the secondary key.", fr: "Régénérer la clé primaire et donner la clé secondaire au script." } }
    - { id: d, text: { en: "Set disableKeyBasedMetadataWriteAccess to true on the account.", fr: "Définir disableKeyBasedMetadataWriteAccess sur true sur le compte." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Resource Manager locks do not apply to changes made with account keys unless `disableKeyBasedMetadataWriteAccess` is set. With this property, metadata writes that use keys are blocked and must go through Azure RBAC, where the locks apply, while key-based item operations keep working.
    fr: |
      Les verrous Resource Manager ne s'appliquent pas aux modifications faites avec des clés de compte, sauf si `disableKeyBasedMetadataWriteAccess` est défini. Avec cette propriété, les écritures de métadonnées qui utilisent des clés sont bloquées et doivent passer par Azure RBAC, où les verrous s'appliquent, tandis que les opérations sur les éléments par clé continuent de fonctionner.
  options:
    a: { en: "disableLocalAuth disables every key-based request, including the item operations that the applications must keep.", fr: "disableLocalAuth désactive toutes les requêtes par clé, y compris les opérations sur les éléments que les applications doivent conserver." }
    b: { en: "Any lock restricts only management-plane requests; key-based changes bypass it without disableKeyBasedMetadataWriteAccess.", fr: "Tout verrou ne restreint que les requêtes du plan de gestion ; les modifications par clé le contournent sans disableKeyBasedMetadataWriteAccess." }
    c: { en: "The script would still hold a valid key and could still delete containers.", fr: "Le script détiendrait toujours une clé valide et pourrait encore supprimer des conteneurs." }
references:
  - title: Protect Azure Cosmos DB resources with locks
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/resource-locks
