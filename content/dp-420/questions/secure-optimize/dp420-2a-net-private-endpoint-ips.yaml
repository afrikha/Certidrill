id: dp420-2a-net-private-endpoint-ips
objective: "2.1.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **fabrikam-inventory** is replicated to **West Europe**, **North Europe** and **East US**. You plan to create one private endpoint for the account (sub-resource `Sql`) in a small subnet, and you must size the subnet.

    How many private IP addresses does the private endpoint reserve in the subnet?
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **fabrikam-inventory** est répliqué dans **West Europe**, **North Europe** et **East US**. Vous prévoyez de créer un point de terminaison privé pour le compte (sous-ressource `Sql`) dans un petit sous-réseau, et vous devez dimensionner ce sous-réseau.

    Combien d'adresses IP privées le point de terminaison privé réserve-t-il dans le sous-réseau ?
body:
  options:
    - { id: a, text: "1" }
    - { id: b, text: "3" }
    - { id: c, text: "4" }
    - { id: d, text: "6" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A private endpoint reserves one private IP address for the global, region-agnostic endpoint of the account and one for each region where the account is deployed: 1 + 3 = 4 addresses.
    fr: |
      Un point de terminaison privé réserve une adresse IP privée pour le point de terminaison global du compte, indépendant de la région, et une pour chaque région où le compte est déployé : 1 + 3 = 4 adresses.
  options:
    a: { en: "One address would cover only the global endpoint; each regional endpoint also needs an address.", fr: "Une seule adresse ne couvrirait que le point de terminaison global ; chaque point de terminaison régional a aussi besoin d'une adresse." }
    b: { en: "Three addresses cover the regional endpoints but forget the global endpoint.", fr: "Trois adresses couvrent les points de terminaison régionaux mais oublient le point de terminaison global." }
    d: { en: "The count does not double per region; it is one global address plus one per region.", fr: "Le nombre ne double pas par région : c'est une adresse globale plus une par région." }
references:
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
