id: dp420-2b-pf-ppaf-consistency
objective: "2.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure Cosmos DB for NoSQL account named **cosmos-nw-loyalty** with a write region in North Europe and a read region in West Europe. The account uses Bounded Staleness consistency. All the C# applications already use .NET SDK 3.62.0 or later.

    When you open **Settings** > **Features** > **Per-partition automatic failover**, the account doesn't meet the prerequisites.

    What should you do before you enable the feature?
  fr: |
    Northwind dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-nw-loyalty** avec une région d'écriture dans North Europe et une région de lecture dans West Europe. Le compte utilise la cohérence Bounded Staleness. Toutes les applications C# utilisent déjà le SDK .NET 3.62.0 ou ultérieur.

    Quand vous ouvrez **Settings** > **Features** > **Per-partition automatic failover**, le compte ne remplit pas les prérequis.

    Que devez-vous faire avant d'activer la fonctionnalité ?
body:
  options:
    - id: a
      text: { en: "Enable multi-region writes in both regions.", fr: "Activer les écritures multirégions dans les deux régions." }
    - id: b
      text: { en: "Add a third region to the account.", fr: "Ajouter une troisième région au compte." }
    - id: c
      text: { en: "Enable service-managed failover on the account.", fr: "Activer le basculement géré par le service sur le compte." }
    - id: d
      text: { en: "Change the default consistency level to Session.", fr: "Remplacer le niveau de cohérence par défaut par Session." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Per-partition automatic failover supports the Strong, Session, Consistent Prefix and Eventual consistency levels; Bounded Staleness will only be supported in a future release. The account already has one write region, one other read region and supported SDKs, so the consistency level is the missing prerequisite.
    fr: |
      Le basculement automatique par partition prend en charge les niveaux de cohérence Strong, Session, Consistent Prefix et Eventual ; Bounded Staleness ne sera pris en charge que dans une version ultérieure. Le compte possède déjà une région d'écriture, une autre région de lecture et des SDK pris en charge : c'est le niveau de cohérence qui manque.
  options:
    a: { en: "The feature is meant for single-write-region accounts; enabling multi-region writes doesn't fix the consistency prerequisite.", fr: "La fonctionnalité est destinée aux comptes à une seule région d'écriture ; activer les écritures multirégions ne règle pas le prérequis de cohérence." }
    b: { en: "One read region in addition to the write region is enough.", fr: "Une région de lecture en plus de la région d'écriture suffit." }
    c: { en: "Service-managed failover isn't listed among the prerequisites of per-partition automatic failover.", fr: "Le basculement géré par le service ne figure pas parmi les prérequis du basculement automatique par partition." }
references:
  - title: Configure per-partition automatic failover for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
