id: dp420-2c-ix-pk-optin
objective: "2.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A container named **events** uses `/tenantId` as the partition key and the following indexing policy.

    ```json
    {
      "indexingMode": "consistent",
      "includedPaths": [ { "path": "/eventType/?" } ],
      "excludedPaths": [ { "path": "/*" } ]
    }
    ```

    A frequent query filters on `e.tenantId = @tenantId AND e.eventType = 'login'`. Its request charge is higher than expected, and its index metrics list `/tenantId/?` under **Potential Single Indexes** with a High impact score.

    You need to reduce the request charge of the query.

    What should you do?
  fr: |
    Un conteneur nommé **events** utilise `/tenantId` comme clé de partition et la stratégie d'indexation suivante.

    ```json
    {
      "indexingMode": "consistent",
      "includedPaths": [ { "path": "/eventType/?" } ],
      "excludedPaths": [ { "path": "/*" } ]
    }
    ```

    Une requête fréquente filtre sur `e.tenantId = @tenantId AND e.eventType = 'login'`. Ses frais de requête sont plus élevés que prévu, et ses métriques d'index listent `/tenantId/?` sous **Potential Single Indexes** avec un score d'impact High.

    Vous devez réduire les frais de requête de cette requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change nothing in the policy, because partition key values are always indexed.", fr: "Ne rien changer à la stratégie, car les valeurs de clé de partition sont toujours indexées." }
    - id: b
      text: { en: "Remove /eventType/? from the included paths of the policy.", fr: "Supprimer /eventType/? des chemins inclus de la stratégie." }
    - id: c
      text: { en: "Add /tenantId/? to the included paths of the policy.", fr: "Ajouter /tenantId/? aux chemins inclus de la stratégie." }
    - id: d
      text: { en: "Set EnableScanInQuery to true for the query.", fr: "Définir EnableScanInQuery sur true pour la requête." }
answer: { optionId: c }
explanation:
  correct:
    en: "With an exclude-root (opt-in) strategy, the partition key path is not indexed by default and must be included explicitly. Partition keys don't need an index to route requests, but filters on a partition key that isn't indexed force scans and raise the RU charge, which is what the potential single index reports. Including `/tenantId/?` lets the filter use the index."
    fr: "Avec une stratégie qui exclut la racine (adhésion explicite), le chemin de la clé de partition n'est pas indexé par défaut et doit être inclus explicitement. Les clés de partition n'ont pas besoin d'index pour acheminer les requêtes, mais un filtre sur une clé de partition non indexée force des analyses complètes et augmente les frais en RU, ce que signale l'index simple potentiel. Inclure `/tenantId/?` permet au filtre d'utiliser l'index."
  options:
    a: { en: "Only id and _ts are always indexed; the partition key (unless it is /id) is not indexed unless the policy includes it.", fr: "Seuls id et _ts sont toujours indexés ; la clé de partition (sauf si c'est /id) n'est indexée que si la stratégie l'inclut." }
    b: { en: "Removing the eventType index would make the second filter scan too and raise the charge further.", fr: "Supprimer l'index eventType obligerait aussi le second filtre à analyser les éléments et augmenterait encore les frais." }
    d: { en: "EnableScanInQuery allows scans on excluded paths but does not make them cheaper.", fr: "EnableScanInQuery autorise les analyses sur les chemins exclus mais ne les rend pas moins coûteuses." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
