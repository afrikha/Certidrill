id: dp420-2b-qp-orderby-composite
objective: "2.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores customer documents in an Azure Cosmos DB for NoSQL container named **Customers** that uses the default indexing policy. A C# application runs the following query:

    ```sql
    SELECT c.id, c.lastName, c.firstName FROM c
    WHERE c.countryCode = @country
    ORDER BY c.lastName ASC, c.firstName ASC
    ```

    The query fails because of the ORDER BY clause. You need the query to run without changing its text.

    What should you add to the indexing policy?
  fr: |
    Contoso stocke des documents clients dans un conteneur Azure Cosmos DB for NoSQL nommé **Customers** qui utilise la stratégie d'indexation par défaut. Une application C# exécute la requête suivante :

    ```sql
    SELECT c.id, c.lastName, c.firstName FROM c
    WHERE c.countryCode = @country
    ORDER BY c.lastName ASC, c.firstName ASC
    ```

    La requête échoue à cause de la clause ORDER BY. Vous devez faire en sorte que la requête s'exécute sans modifier son texte.

    Que devez-vous ajouter à la stratégie d'indexation ?
body:
  options:
    - id: a
      text: { en: "A composite index on (/firstName ASC, /lastName ASC)", fr: "Un index composite sur (/firstName ASC, /lastName ASC)" }
    - id: b
      text: { en: "Included paths /lastName/? and /firstName/?", fr: "Les chemins inclus /lastName/? et /firstName/?" }
    - id: c
      text: { en: "A composite index on (/lastName ASC, /firstName ASC)", fr: "Un index composite sur (/lastName ASC, /firstName ASC)" }
    - id: d
      text: { en: "A composite index on (/lastName ASC, /firstName DESC)", fr: "Un index composite sur (/lastName ASC, /firstName DESC)" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      An ORDER BY on two or more properties requires a composite index, and no composite index exists by default. The paths must appear in the same sequence as the ORDER BY properties, and each path order must match the query (or the whole index must be its exact inverse).
    fr: |
      Un ORDER BY sur deux propriétés ou plus nécessite un index composite, et aucun index composite n'existe par défaut. Les chemins doivent apparaître dans le même ordre que les propriétés de l'ORDER BY, et le sens de chaque chemin doit correspondre à la requête (ou l'index entier doit en être l'inverse exact).
  options:
    a: { en: "The sequence of the paths doesn't match the ORDER BY sequence, so the index can't serve the query.", fr: "L'ordre des chemins ne correspond pas à celui de l'ORDER BY : l'index ne peut pas servir la requête." }
    b: { en: "The default policy already range-indexes both properties; range indexes serve a single-property ORDER BY only.", fr: "La stratégie par défaut indexe déjà les deux propriétés en plage ; les index de plage ne servent qu'un ORDER BY sur une seule propriété." }
    d: { en: "Mixed directions that are neither identical to the query nor its exact inverse aren't supported.", fr: "Des sens mixtes qui ne sont ni identiques à la requête ni son inverse exact ne sont pas pris en charge." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
