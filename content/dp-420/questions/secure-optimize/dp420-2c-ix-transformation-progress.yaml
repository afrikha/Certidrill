id: dp420-2c-ix-transformation-progress
objective: "2.3.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You replaced the indexing policy of a container named **catalog** to add a composite index. The application team will switch a critical query to the new index only after the index transformation is complete.

    You need to write a .NET helper that returns the current index transformation progress of the container, as a percentage.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous avez remplacé la stratégie d'indexation d'un conteneur nommé **catalog** pour ajouter un index composite. L'équipe applicative ne basculera une requête critique sur le nouvel index qu'une fois la transformation d'index terminée.

    Vous devez écrire une fonction utilitaire .NET qui renvoie la progression actuelle de la transformation d'index du conteneur, en pourcentage.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    ContainerResponse response = await container.ReadContainerAsync(
        new ContainerRequestOptions { [[opt]] = true });

    long progress = long.Parse(
        response.Headers["[[header]]"]);

    return progress;
  slots:
    - id: opt
      options:
        - { id: quota, text: PopulateQuotaInfo }
        - { id: index, text: PopulateIndexMetrics }
        - { id: advice, text: PopulateQueryAdvice }
    - id: header
      options:
        - { id: util, text: x-ms-cosmos-index-utilization }
        - { id: charge, text: x-ms-request-charge }
        - { id: progress, text: x-ms-documentdb-collection-index-transformation-progress }
answer:
  values: { opt: quota, header: progress }
explanation:
  correct:
    en: "To track an index transformation, you read the container with a request option that sets `PopulateQuotaInfo` to `true`, then retrieve the value of the `x-ms-documentdb-collection-index-transformation-progress` response header. Until the value reaches 100, queries keep using the existing indexes and do not benefit from the new composite index."
    fr: "Pour suivre une transformation d'index, vous lisez le conteneur avec une option de requête qui définit `PopulateQuotaInfo` sur `true`, puis vous récupérez la valeur de l'en-tête de réponse `x-ms-documentdb-collection-index-transformation-progress`. Tant que la valeur n'atteint pas 100, les requêtes continuent d'utiliser les index existants et ne profitent pas du nouvel index composite."
  options:
    index: { en: "PopulateIndexMetrics is a query option that reports index usage for one query, not the progress of a transformation.", fr: "PopulateIndexMetrics est une option de requête qui indique l'utilisation des index pour une requête, pas la progression d'une transformation." }
    util: { en: "x-ms-cosmos-index-utilization carries the index metrics of a query (Python SDK), not the transformation progress.", fr: "x-ms-cosmos-index-utilization contient les métriques d'index d'une requête (SDK Python), pas la progression de la transformation." }
    charge: { en: "x-ms-request-charge is the RU cost of the read operation.", fr: "x-ms-request-charge est le coût en RU de l'opération de lecture." }
references:
  - title: Manage indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-indexing-policy
