id: dp420-2b-bk-restore-cli
objective: "2.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account named **cosmos-lw-sales** that uses continuous backup mode. The **Orders** container of the **SalesDb** database has a TTL of 30 days on its items.

    An auditor needs a copy of **Orders** as it was on 3 November 2026 at 08:00 UTC. You must restore it into a new account named **cosmos-lw-audit** with the following requirements:

    - The new account must not be reachable from public networks.
    - The restored items must not be deleted by their TTL while the auditor works on them.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-lw-sales** qui utilise le mode de sauvegarde continue. Le conteneur **Orders** de la base de données **SalesDb** applique une durée de vie (TTL) de 30 jours à ses éléments.

    Un auditeur a besoin d'une copie de **Orders** telle qu'elle était le 3 novembre 2026 à 08:00 UTC. Vous devez la restaurer dans un nouveau compte nommé **cosmos-lw-audit** en respectant les exigences suivantes :

    - Le nouveau compte ne doit pas être accessible depuis les réseaux publics.
    - Les éléments restaurés ne doivent pas être supprimés par leur TTL pendant le travail de l'auditeur.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb [[cmd]] \
      --resource-group rg-audit \
      --account-name cosmos-lw-sales \
      --target-database-account-name cosmos-lw-audit \
      --restore-timestamp 2026-11-03T08:00:00+0000 \
      --location "West Europe" \
      --databases-to-restore name=SalesDb collections=Orders \
      --public-network-access [[pna]] \
      [[ttl]]
  slots:
    - id: cmd
      options:
        - { id: restore, text: restore }
        - { id: sqlrestore, text: sql container restore }
        - { id: update, text: update }
    - id: pna
      options:
        - { id: disabled, text: Disabled }
        - { id: enabled, text: Enabled }
    - id: ttl
      options:
        - { id: disttl, text: "--disable-ttl True" }
        - { id: ttlneg, text: "--default-ttl -1" }
        - { id: nottl, text: "--enable-ttl False" }
answer:
  values: { cmd: restore, pna: disabled, ttl: disttl }
explanation:
  correct:
    en: "`az cosmosdb restore` creates a new account from the continuous backup of the source account at the given timestamp, optionally limited to some databases and containers with `--databases-to-restore`. `--public-network-access Disabled` blocks public access to the restored account (by default it is reachable from public networks), and `--disable-ttl True` restores the containers with TTL disabled so that restored items aren't expired right away."
    fr: "`az cosmosdb restore` crée un nouveau compte à partir de la sauvegarde continue du compte source à l'horodatage indiqué, éventuellement limité à certaines bases de données et à certains conteneurs avec `--databases-to-restore`. `--public-network-access Disabled` bloque l'accès public au compte restauré (par défaut, il est accessible depuis les réseaux publics), et `--disable-ttl True` restaure les conteneurs avec la TTL désactivée, afin que les éléments restaurés n'expirent pas aussitôt."
  options:
    cmd: { en: "sql container restore performs an in-account restore of a deleted container; it doesn't create a new account. update changes an existing account.", fr: "sql container restore effectue une restauration d'un conteneur supprimé dans le même compte ; il ne crée pas de nouveau compte. update modifie un compte existant." }
    ttl: { en: "--default-ttl and --enable-ttl aren't parameters of az cosmosdb restore; the restore keeps the TTL configuration unless you pass --disable-ttl True.", fr: "--default-ttl et --enable-ttl ne sont pas des paramètres de az cosmosdb restore ; la restauration conserve la configuration TTL sauf si vous passez --disable-ttl True." }
references:
  - title: Restore an Azure Cosmos DB account that uses continuous backup mode
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/restore-account-continuous-backup
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
