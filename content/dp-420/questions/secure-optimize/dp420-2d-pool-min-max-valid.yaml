id: dp420-2d-pool-min-max-valid
objective: "2.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You are creating a fleetspace named **fs-retail** with throughput pooling in an Azure Cosmos DB fleet. The default fleet limits apply.

    Which pool configuration can you set?
  fr: |
    Vous créez un fleetspace nommé **fs-retail** avec un pool de débit dans une flotte Azure Cosmos DB. Les limites par défaut des flottes s'appliquent.

    Quelle configuration de pool pouvez-vous définir ?
body:
  options:
    - { id: a, text: { en: "Minimum 80,000 RU/s, maximum 400,000 RU/s", fr: "Minimum 80 000 RU/s, maximum 400 000 RU/s" } }
    - { id: b, text: { en: "Minimum 120,000 RU/s, maximum 1,000,000 RU/s", fr: "Minimum 120 000 RU/s, maximum 1 000 000 RU/s" } }
    - { id: c, text: { en: "Minimum 100,000 RU/s, maximum 1,200,000 RU/s", fr: "Minimum 100 000 RU/s, maximum 1 200 000 RU/s" } }
    - { id: d, text: { en: "Minimum 150,500 RU/s, maximum 600,000 RU/s", fr: "Minimum 150 500 RU/s, maximum 600 000 RU/s" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Pool minimum and maximum RU/s are whole numbers of at least 100,000 and multiples of 1,000, and the maximum can be at most 10 times the minimum. With a 120,000 RU/s minimum, 1,000,000 RU/s is within 10 times the minimum and within the default 1,000,000 RU/s maximum of a pool.
    fr: |
      Les RU/s minimales et maximales d'un pool sont des nombres entiers d'au moins 100 000 et multiples de 1 000, et le maximum peut valoir au plus 10 fois le minimum. Avec un minimum de 120 000 RU/s, 1 000 000 RU/s reste inférieur à 10 fois le minimum et ne dépasse pas le maximum par défaut d'un pool, 1 000 000 RU/s.
  options:
    a: { en: "The minimum must be at least 100,000 RU/s.", fr: "Le minimum doit être d'au moins 100 000 RU/s." }
    c: { en: "1,200,000 RU/s is more than 10 times the minimum and above the default 1,000,000 RU/s pool limit.", fr: "1 200 000 RU/s représente plus de 10 fois le minimum et dépasse la limite par défaut de 1 000 000 RU/s d'un pool." }
    d: { en: "150,500 isn't a multiple of 1,000.", fr: "150 500 n'est pas un multiple de 1 000." }
references:
  - title: Create a Fleet (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-create-fleet
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
