id: dp420-2b-mr-topology-map
objective: "2.2.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip has an Azure Cosmos DB for NoSQL account named **cosmos-wt-store** with a single write region in West Europe. The account serves a C# storefront.

    Which account configuration should you use for each requirement? To answer, drag the appropriate configurations to the correct requirements. Each configuration may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wt-store** avec une seule région d'écriture dans West Europe. Le compte sert une boutique en ligne C#.

    Quelle configuration de compte devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les configurations appropriées vers les exigences correspondantes. Chaque configuration peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: az, text: { en: "Availability zones (zone redundancy) in West Europe", fr: "Zones de disponibilité (redondance de zone) dans West Europe" } }
    - { id: read, text: { en: "Add a read region in Southeast Asia", fr: "Ajouter une région de lecture dans Southeast Asia" } }
    - { id: mrw, text: { en: "Enable multi-region writes", fr: "Activer les écritures multirégions" } }
    - { id: prio, text: { en: "Configure the failover priorities", fr: "Configurer les priorités de basculement" } }
    - { id: strong, text: { en: "Set Strong consistency", fr: "Définir la cohérence Strong" } }
  targets:
    - id: t1
      text: { en: "Keep reads and writes available if one datacenter zone of West Europe fails, without adding a region", fr: "Garder lectures et écritures disponibles en cas de défaillance d'une zone de West Europe, sans ajouter de région" }
    - id: t2
      text: { en: "Serve catalog reads from Asia with local latency while all writes stay in West Europe", fr: "Servir les lectures du catalogue depuis l'Asie avec une latence locale, tandis que toutes les écritures restent dans West Europe" }
    - id: t3
      text: { en: "Accept shopping cart writes in every region of the account", fr: "Accepter les écritures de paniers dans chaque région du compte" }
    - id: t4
      text: { en: "Define which read region is promoted to write region first during a failover", fr: "Définir quelle région de lecture est promue en premier comme région d'écriture lors d'un basculement" }
answer:
  mapping: { t1: az, t2: read, t3: mrw, t4: prio }
explanation:
  correct:
    en: |
      Zone redundancy replicates synchronously across availability zones inside a region and keeps the account available during a single-zone outage. A read region serves local reads while writes stay in the write region. Multi-region writes make every region writable. Failover priorities set the order in which read regions are promoted to write region.
    fr: |
      La redondance de zone réplique de façon synchrone entre les zones de disponibilité d'une région et garde le compte disponible pendant la panne d'une zone. Une région de lecture sert des lectures locales tandis que les écritures restent dans la région d'écriture. Les écritures multirégions rendent chaque région accessible en écriture. Les priorités de basculement fixent l'ordre de promotion des régions de lecture en région d'écriture.
  options:
    strong: { en: "Strong consistency changes read guarantees; it doesn't add regions, zones or write locations.", fr: "La cohérence Strong modifie les garanties de lecture ; elle n'ajoute ni région, ni zone, ni emplacement d'écriture." }
references:
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
  - title: Manage an Azure Cosmos DB account by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-database-account
