id: dp420-2c-qm-query-stats
objective: "2.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A developer at Tailspin wants to check an ad hoc query against a container named **flights** before adding it to the application. The developer must see the request charge of the query and its Retrieved Document Count and Output Document Count.

    The solution must not require writing code or configuring any additional Azure resource.

    What should the developer do?
  fr: |
    Un développeur de Tailspin souhaite vérifier une requête ponctuelle sur un conteneur nommé **flights** avant de l'ajouter à l'application. Il doit voir les frais de la requête ainsi que son Retrieved Document Count et son Output Document Count.

    La solution ne doit nécessiter ni écriture de code ni configuration d'une ressource Azure supplémentaire.

    Que doit faire le développeur ?
body:
  options:
    - id: a
      text: { en: "In Insights for the account, open the Requests tab and filter on the container.", fr: "Dans Insights pour le compte, ouvrir l'onglet Requests et filtrer sur le conteneur." }
    - id: b
      text: { en: "In Data Explorer, run the query and open the Query Stats tab of the results.", fr: "Dans l'Explorateur de données, exécuter la requête et ouvrir l'onglet Query Stats des résultats." }
    - id: c
      text: { en: "In Metrics, chart Total Request Units for the container and split it by OperationType.", fr: "Dans Metrics, afficher Total Request Units pour le conteneur avec un fractionnement par OperationType." }
    - id: d
      text: { en: "Add a diagnostic setting that sends QueryRuntimeStatistics to a Log Analytics workspace.", fr: "Ajouter un paramètre de diagnostic qui envoie QueryRuntimeStatistics à un espace de travail Log Analytics." }
answer: { optionId: b }
explanation:
  correct:
    en: "After you run a query in Data Explorer, the query metrics, including the request charge, the Retrieved Document Count and the Output Document Count, are shown on the Query Stats tab next to the results. Nothing has to be deployed or coded."
    fr: "Après l'exécution d'une requête dans l'Explorateur de données, les métriques de requête, dont les frais de requête, le Retrieved Document Count et l'Output Document Count, apparaissent dans l'onglet Query Stats à côté des résultats. Rien n'est à déployer ni à coder."
  options:
    a: { en: "The Requests tab shows request counts by status code and operation type, not the metrics of a single query.", fr: "L'onglet Requests affiche le nombre de requêtes par code d'état et type d'opération, pas les métriques d'une requête donnée." }
    c: { en: "Total Request Units aggregates RU consumption over time; it does not show document counts for one query.", fr: "Total Request Units agrège la consommation de RU dans le temps ; il n'affiche pas le nombre de documents d'une requête." }
    d: { en: "A diagnostic setting is an additional configuration and needs a Log Analytics workspace, which the requirement excludes.", fr: "Un paramètre de diagnostic est une configuration supplémentaire qui nécessite un espace de travail Log Analytics, ce que l'exigence exclut." }
references:
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
  - title: Find the request unit charge for operations in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/find-request-unit-charge
