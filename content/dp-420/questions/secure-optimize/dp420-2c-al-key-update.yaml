id: dp420-2c-al-key-update
objective: "2.3.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Several legacy applications still connect to an Azure Cosmos DB account named **cosmos-legacy** by using the primary account key. The operations team must update these applications whenever the primary key is regenerated.

    You need to configure a metric alert rule that notifies the team each time the primary key is updated.

    How should you configure the alert condition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Plusieurs applications héritées se connectent encore à un compte Azure Cosmos DB nommé **cosmos-legacy** avec la clé primaire du compte. L'équipe d'exploitation doit mettre à jour ces applications chaque fois que la clé primaire est régénérée.

    Vous devez configurer une règle d'alerte de métrique qui avertit l'équipe chaque fois que la clé primaire est mise à jour.

    Comment devez-vous configurer la condition d'alerte ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Signal: [[signal]]

      Dimension filter: [[dim]] = Primary

      Aggregation type: [[agg]]
    fr: |
      Signal : [[signal]]

      Filtre de dimension : [[dim]] = Primary

      Type d'agrégation : [[agg]]
  slots:
    - id: signal
      options:
        - { id: keys, text: Account Keys Updated }
        - { id: diag, text: Account Diagnostic Settings Updated }
        - { id: requests, text: Total Requests }
    - id: dim
      options:
        - { id: status, text: StatusCode }
        - { id: keytype, text: KeyType }
        - { id: region, text: Region }
    - id: agg
      options:
        - { id: max, text: Maximum }
        - { id: avg, text: Average }
        - { id: count, text: Count }
answer:
  values: { signal: keys, dim: keytype, agg: count }
explanation:
  correct:
    en: "The Account Keys Updated metric (`UpdateAccountKeys`) counts the updates of the account keys and supports the Count aggregation. Its KeyType dimension distinguishes the keys, so filtering KeyType on Primary fires the rule only when the primary key is updated."
    fr: "La métrique Account Keys Updated (`UpdateAccountKeys`) compte les mises à jour des clés du compte et prend en charge l'agrégation Count. Sa dimension KeyType distingue les clés : filtrer KeyType sur Primary ne déclenche la règle que lorsque la clé primaire est mise à jour."
  options:
    diag: { en: "This metric tracks changes to diagnostic settings, not to account keys.", fr: "Cette métrique suit les modifications des paramètres de diagnostic, pas des clés du compte." }
    requests: { en: "Total Requests counts data requests; it has no KeyType dimension.", fr: "Total Requests compte les requêtes de données ; elle n'a pas de dimension KeyType." }
    max: { en: "Account Keys Updated supports only the Count aggregation.", fr: "Account Keys Updated ne prend en charge que l'agrégation Count." }
references:
  - title: Azure Cosmos DB monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-reference
  - title: Create alerts for Azure Cosmos DB using Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/create-alerts
