id: dp420-cs4a-masking-roles
objective: "2.1.4"
type: dragdrop
caseStudy: dp420-cs4a-lamna-healthcare
difficulty: 2
status: draft
stem:
  en: |
    You enable dynamic data masking on cosmos-lamna and apply a masking policy to the patients container that masks `ssn` with the Default strategy and `email` with the Email strategy.

    You need to grant data access to the identities that use the patients container. The solution must meet the security requirements.

    Which role should you assign to each identity? To answer, drag the appropriate roles to the correct identities. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez le masquage dynamique des données sur cosmos-lamna et appliquez au conteneur patients une stratégie de masquage qui masque `ssn` avec la stratégie Default et `email` avec la stratégie Email.

    Vous devez accorder l'accès aux données aux identités qui utilisent le conteneur patients. La solution doit respecter les exigences de sécurité.

    Quel rôle devez-vous attribuer à chaque identité ? Pour répondre, faites glisser les rôles appropriés vers les identités correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: Cosmos DB Built-in Data Reader }
    - { id: contrib, text: Cosmos DB Built-in Data Contributor }
    - id: custom
      text: { en: "Custom data plane role with readMetadata, items/read, executeQuery and items/unmask", fr: "Rôle de plan de données personnalisé avec readMetadata, items/read, executeQuery et items/unmask" }
    - { id: acctreader, text: Cosmos DB Account Reader Role }
    - { id: docdbcontrib, text: DocumentDB Account Contributor }
  targets:
    - { id: analysts, text: Support-Analysts }
    - { id: intake, text: id-intake }
    - { id: review, text: id-review }
answer:
  mapping: { analysts: reader, intake: contrib, review: custom }
explanation:
  correct:
    en: "Unmasked values are returned only to principals that have the `items/unmask` data action. Cosmos DB Built-in Data Reader can query items but does not include unmask, so analysts see masked values. The intake API writes items and needs Cosmos DB Built-in Data Contributor (which also includes unmask; masking does not apply to writes). The review app only reads, so a custom role that adds `items/unmask` to the read actions is the least-privileged option."
    fr: "Les valeurs non masquées ne sont renvoyées qu'aux principaux qui disposent de l'action de données `items/unmask`. Cosmos DB Built-in Data Reader peut interroger les éléments mais n'inclut pas unmask : les analystes voient les valeurs masquées. L'API d'admission écrit des éléments et a besoin de Cosmos DB Built-in Data Contributor (qui inclut aussi unmask ; le masquage ne s'applique pas aux écritures). L'application de revue ne fait que lire : un rôle personnalisé qui ajoute `items/unmask` aux actions de lecture est l'option du moindre privilège."
  options:
    acctreader: { en: "Cosmos DB Account Reader Role is an Azure (control plane) role; it grants no access to items.", fr: "Cosmos DB Account Reader Role est un rôle Azure (plan de contrôle) ; il ne donne aucun accès aux éléments." }
    docdbcontrib: { en: "DocumentDB Account Contributor manages the account resource; it does not grant data plane access to items.", fr: "DocumentDB Account Contributor gère la ressource du compte ; il ne donne pas d'accès aux éléments sur le plan de données." }
references:
  - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/dynamic-data-masking
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
