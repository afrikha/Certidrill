id: dp420-2a-ddm-excluded-needs-root
objective: "2.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Dynamic data masking is enabled on an Azure Cosmos DB for NoSQL account named **proseware-orders**. A developer tries to save the following masking policy on a container named **orders**, and the policy is rejected:

    ```json
    "dataMaskingPolicy": {
      "includedPaths": [ { "path": "/customer" } ],
      "excludedPaths": [ { "path": "/customer/customerId" } ]
    }
    ```

    What is the cause?
  fr: |
    Le masquage dynamique des données est activé sur un compte Azure Cosmos DB for NoSQL nommé **proseware-orders**. Un développeur essaie d'enregistrer la stratégie de masquage suivante sur un conteneur nommé **orders**, et la stratégie est rejetée :

    ```json
    "dataMaskingPolicy": {
      "includedPaths": [ { "path": "/customer" } ],
      "excludedPaths": [ { "path": "/customer/customerId" } ]
    }
    ```

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "Each included path must specify a strategy; there is no default strategy.", fr: "Chaque chemin inclus doit préciser une stratégie ; il n'existe pas de stratégie par défaut." } }
    - { id: b, text: { en: "Excluded paths are supported only when the policy includes all paths (/).", fr: "Les chemins exclus ne sont pris en charge que si la stratégie inclut tous les chemins (/)." } }
    - { id: c, text: { en: "Masking policies support only top-level properties, not nested ones.", fr: "Les stratégies de masquage ne prennent en charge que les propriétés de premier niveau, pas les propriétés imbriquées." } }
    - { id: d, text: { en: "An excluded path must be a property of an array and use the [] syntax.", fr: "Un chemin exclu doit être une propriété d'un tableau et utiliser la syntaxe []." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Excluded paths work only when `/` is in the included paths. To mask the customer object except its ID, either include `/` and exclude everything that must stay visible, or list the properties to mask one by one without excluded paths.
    fr: |
      Les chemins exclus ne fonctionnent que si `/` figure dans les chemins inclus. Pour masquer l'objet customer sauf son ID, incluez `/` et excluez tout ce qui doit rester visible, ou listez une à une les propriétés à masquer sans chemins exclus.
  options:
    a: { en: "When no strategy is specified, the Default strategy applies.", fr: "Lorsqu'aucune stratégie n'est précisée, la stratégie Default s'applique." }
    c: { en: "Nested paths such as /Address/ZipCode are valid masking paths.", fr: "Les chemins imbriqués comme /Address/ZipCode sont des chemins de masquage valides." }
    d: { en: "Excluded paths can be any valid property path, such as /id or /department.", fr: "Les chemins exclus peuvent être n'importe quel chemin de propriété valide, comme /id ou /department." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
