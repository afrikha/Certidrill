id: dp420-2d-fa-fabric-setup
objective: "2.4.2"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB fleet named **fleet-tailspin** that contains 400 Azure Cosmos DB for NoSQL accounts. A Microsoft Fabric workspace named **ws-fleet** is dedicated to fleet monitoring. It is backed by a licensed Fabric capacity, uses OneLake as its default storage and contains a lakehouse named **lh-fleet**.

    You need the fleet analytics data of fleet-tailspin to be written to lh-fleet.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une flotte Azure Cosmos DB nommée **fleet-tailspin** qui contient 400 comptes Azure Cosmos DB for NoSQL. Un espace de travail Microsoft Fabric nommé **ws-fleet** est dédié à la surveillance de la flotte. Il repose sur une capacité Fabric sous licence, utilise OneLake comme stockage par défaut et contient un lakehouse nommé **lh-fleet**.

    Vous devez faire en sorte que les données d'analytique de la flotte de fleet-tailspin soient écrites dans lh-fleet.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "On each account, add a diagnostic setting that sends the logs to ws-fleet.", fr: "Sur chaque compte, ajouter un paramètre de diagnostic qui envoie les journaux vers ws-fleet." } }
    - { id: b, text: { en: "In ws-fleet, add the Cosmos DB Fleet Analytics service principal with the Viewer role.", fr: "Dans ws-fleet, ajouter le principal de service Cosmos DB Fleet Analytics avec le rôle Viewer." } }
    - { id: c, text: { en: "On fleet-tailspin, add a fleet analytics destination that targets ws-fleet and lh-fleet.", fr: "Sur fleet-tailspin, ajouter une destination d'analytique de la flotte qui cible ws-fleet et lh-fleet." } }
    - { id: d, text: { en: "In ws-fleet, add the Cosmos DB Fleet Analytics service principal with the Contributor role.", fr: "Dans ws-fleet, ajouter le principal de service Cosmos DB Fleet Analytics avec le rôle Contributor." } }
    - { id: e, text: { en: "On each account, enable Azure Synapse Link and the analytical store.", fr: "Sur chaque compte, activer Azure Synapse Link et le magasin analytique." } }
answer: { optionIds: [c, d] }
explanation:
  correct:
    en: |
      Fleet analytics is configured once, on the fleet (Monitoring > Fleet analytics > Add destination), by selecting the Fabric workspace and an existing lakehouse. Then, in the workspace, the shared Cosmos DB Fleet Analytics service principal must get the Contributor role; without it, no data is written.
    fr: |
      L'analytique de la flotte se configure une seule fois, sur la flotte (Supervision > Fleet analytics > Add destination), en sélectionnant l'espace de travail Fabric et un lakehouse existant. Ensuite, dans l'espace de travail, le principal de service partagé Cosmos DB Fleet Analytics doit recevoir le rôle Contributor ; sans cela, aucune donnée n'est écrite.
  options:
    a: { en: "Fleet analytics doesn't rely on the resource logs of the accounts; it is enabled on the fleet.", fr: "L'analytique de la flotte ne s'appuie pas sur les journaux de ressources des comptes ; elle s'active sur la flotte." }
    b: { en: "Viewer is read-only; the service principal needs Contributor to write the tables.", fr: "Viewer est en lecture seule ; le principal de service a besoin de Contributor pour écrire les tables." }
    e: { en: "The analytical store serves Synapse Link analytics on item data, not fleet usage and cost data.", fr: "Le magasin analytique sert l'analyse Synapse Link des données des éléments, pas les données d'utilisation et de coût de la flotte." }
references:
  - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics
