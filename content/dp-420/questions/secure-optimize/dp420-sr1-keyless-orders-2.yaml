id: dp420-sr1-keyless-orders-2
objective: "2.1.2"
type: series_yesno
series: dp420-sr1-keyless-orders
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You assign the Cosmos DB Operator role on the account by using Access control (IAM).
  fr: Vous attribuez le rôle Cosmos DB Operator sur le compte à l'aide de Contrôle d'accès (IAM).
body:
  solution:
    en: |
      In the Azure portal, you open **Access control (IAM)** of cosmos-fab and assign the Azure built-in role **Cosmos DB Operator** to the managed identity of order-api.
    fr: |
      Dans le portail Azure, vous ouvrez **Contrôle d'accès (IAM)** de cosmos-fab et vous attribuez le rôle intégré Azure **Cosmos DB Operator** à l'identité managée de order-api.
answer: { value: false }
explanation:
  correct:
    en: Cosmos DB Operator is a control plane role. It lets a principal manage Azure Cosmos DB accounts but not access the data in them, and it does not give access to the account keys. Item access with Microsoft Entra ID requires a native data plane role assignment, which is created with `az cosmosdb sql role assignment create` (or PowerShell, Bicep, ARM) because the portal does not manage data plane role assignments.
    fr: "Cosmos DB Operator est un rôle du plan de contrôle. Il permet à un principal de gérer des comptes Azure Cosmos DB, mais pas d'accéder à leurs données, et il ne donne pas accès aux clés du compte. L'accès aux éléments avec Microsoft Entra ID exige une attribution de rôle native du plan de données, créée avec `az cosmosdb sql role assignment create` (ou PowerShell, Bicep, ARM), car le portail ne gère pas les attributions de rôle du plan de données."
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
