id: dp420-2c-al-latency-alert
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A checkout service uses the Azure Cosmos DB .NET SDK with its default connection settings to access a container named **carts**.

    You need to be notified when the average backend latency of the requests to the **carts** container exceeds 10 ms over a 5-minute period.

    Which alert rule should you create?
  fr: |
    Un service de paiement utilise le SDK .NET Azure Cosmos DB avec ses paramètres de connexion par défaut pour accéder à un conteneur nommé **carts**.

    Vous devez être averti lorsque la latence back-end moyenne des requêtes adressées au conteneur **carts** dépasse 10 ms sur une période de 5 minutes.

    Quelle règle d'alerte devez-vous créer ?
body:
  options:
    - id: a
      text: { en: "A metric alert rule on Server Side Latency Gateway, Average aggregation, filtered on CollectionName = carts", fr: "Une règle d'alerte de métrique sur Server Side Latency Gateway, agrégation Average, filtrée sur CollectionName = carts" }
    - id: b
      text: { en: "A metric alert rule on P99 Replication Latency, Maximum aggregation, filtered on the target region", fr: "Une règle d'alerte de métrique sur P99 Replication Latency, agrégation Maximum, filtrée sur la région cible" }
    - id: c
      text: { en: "A metric alert rule on Server Side Latency Direct, Average aggregation, filtered on CollectionName = carts", fr: "Une règle d'alerte de métrique sur Server Side Latency Direct, agrégation Average, filtrée sur CollectionName = carts" }
    - id: d
      text: { en: "An activity log alert rule on the update operations of the carts container", fr: "Une règle d'alerte de journal d'activité sur les opérations de mise à jour du conteneur carts" }
answer: { optionId: c }
explanation:
  correct:
    en: "The .NET SDK v3 uses direct mode with TCP by default, so the backend latency of its requests is reported by the Server Side Latency Direct metric. The metric supports the Average aggregation and the CollectionName dimension, so a metric alert rule can filter on the container and compare the average with 10 ms over a 5-minute lookback period."
    fr: "Le SDK .NET v3 utilise par défaut le mode direct avec TCP : la latence back-end de ses requêtes est donc indiquée par la métrique Server Side Latency Direct. Cette métrique prend en charge l'agrégation Average et la dimension CollectionName ; une règle d'alerte de métrique peut donc filtrer sur le conteneur et comparer la moyenne à 10 ms sur une période d'analyse de 5 minutes."
  options:
    a: { en: "The Gateway metric covers requests in gateway mode; the default .NET client uses direct mode.", fr: "La métrique Gateway couvre les requêtes en mode passerelle ; le client .NET par défaut utilise le mode direct." }
    b: { en: "Replication latency measures geo-replication between regions, not request processing.", fr: "La latence de réplication mesure la géoréplication entre régions, pas le traitement des requêtes." }
    d: { en: "Activity log alerts react to control-plane events, not to latency values.", fr: "Les alertes de journal d'activité réagissent à des événements du plan de contrôle, pas à des valeurs de latence." }
references:
  - title: How to monitor the server-side latency for operations in an Azure Cosmos DB container or account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-server-side-latency
  - title: Azure Cosmos DB monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-reference
