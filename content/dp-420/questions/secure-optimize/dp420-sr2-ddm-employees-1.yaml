id: dp420-sr2-ddm-employees-1
objective: "2.1.4"
type: series_yesno
series: dp420-sr2-ddm-employees
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You mask email with the Email strategy and assign Cosmos DB Built-in Data Reader.
  fr: |
    Vous masquez email avec la stratégie Email et attribuez Cosmos DB Built-in Data Reader.
body:
  solution:
    en: |
      You apply the following masking policy to `employees`. You then assign the **Cosmos DB Built-in Data Reader** data plane role to support-id at the scope `/dbs/hr/colls/employees`.

      ```json
      {
        "includedPaths": [
          { "path": "/email", "strategy": "Email" },
          { "path": "/salary" }
        ]
      }
      ```
    fr: |
      Vous appliquez la stratégie de masquage suivante à `employees`. Vous attribuez ensuite le rôle de plan de données **Cosmos DB Built-in Data Reader** à support-id à l'étendue `/dbs/hr/colls/employees`.

      ```json
      {
        "includedPaths": [
          { "path": "/email", "strategy": "Email" },
          { "path": "/salary" }
        ]
      }
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      The Email strategy keeps the first letter of the user name and the domain ending, and a path without a strategy uses the default mask, which returns `0` for a number such as `salary`. Paths that are not included stay unmasked. Cosmos DB Built-in Data Reader allows reads and queries but has neither write actions nor `items/unmask`, so support-id sees masked values and cannot modify items.
    fr: |
      La stratégie Email conserve la première lettre du nom d'utilisateur et la fin du domaine, et un chemin sans stratégie utilise le masque par défaut, qui retourne `0` pour un nombre tel que `salary`. Les chemins non inclus restent non masqués. Cosmos DB Built-in Data Reader autorise les lectures et les requêtes, mais ne comporte ni action d'écriture ni `items/unmask` : support-id voit les valeurs masquées et ne peut pas modifier les éléments.
references:
