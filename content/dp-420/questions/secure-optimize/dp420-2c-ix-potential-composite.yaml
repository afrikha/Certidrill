id: dp420-2c-ix-potential-composite
objective: "2.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container named **orders** uses the default indexing policy. You enable index metrics for the following query.

    ```sql
    SELECT o.id FROM o WHERE o.storeId = @storeId AND o.total > 500
    ```

    The index metrics are shown below.

    ```text
    Index Utilization Information
      Utilized Single Indexes
        Index Spec: /storeId/?
        Index Impact Score: High
        ---
        Index Spec: /total/?
        Index Impact Score: High
        ---
      Potential Single Indexes
      Utilized Composite Indexes
      Potential Composite Indexes
        Index Spec: /storeId ASC, /total ASC
        Index Impact Score: High
        ---
    ```

    You need to lower the RU charge of the query.

    What should you do?
  fr: |
    Un conteneur nommé **orders** utilise la stratégie d'indexation par défaut. Vous activez les métriques d'index pour la requête suivante.

    ```sql
    SELECT o.id FROM o WHERE o.storeId = @storeId AND o.total > 500
    ```

    Les métriques d'index sont présentées ci-dessous.

    ```text
    Index Utilization Information
      Utilized Single Indexes
        Index Spec: /storeId/?
        Index Impact Score: High
        ---
        Index Spec: /total/?
        Index Impact Score: High
        ---
      Potential Single Indexes
      Utilized Composite Indexes
      Potential Composite Indexes
        Index Spec: /storeId ASC, /total ASC
        Index Impact Score: High
        ---
    ```

    Vous devez réduire les frais en RU de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add /storeId/? and /total/? as explicit included paths of the indexing policy.", fr: "Ajouter /storeId/? et /total/? comme chemins inclus explicites de la stratégie d'indexation." }
    - id: b
      text: { en: "Add a composite index on (/total ASC, /storeId ASC) to the indexing policy.", fr: "Ajouter un index composite sur (/total ASC, /storeId ASC) à la stratégie d'indexation." }
    - id: c
      text: { en: "Add a composite index on (/storeId ASC, /total ASC) to the indexing policy.", fr: "Ajouter un index composite sur (/storeId ASC, /total ASC) à la stratégie d'indexation." }
    - id: d
      text: { en: "Set EnableScanInQuery to true in the QueryRequestOptions of the query.", fr: "Définir EnableScanInQuery sur true dans les QueryRequestOptions de la requête." }
answer: { optionId: c }
explanation:
  correct:
    en: "The query already uses the range indexes on both paths, and the metrics recommend a composite index with a high impact score. A composite index on the equality property followed by the range property lets the engine serve both filters together, which usually lowers the RU charge. After adding it, rerun the query and compare the charge, because potential indexes are recommendations rather than proof."
    fr: "La requête utilise déjà les index de plage sur les deux chemins, et les métriques recommandent un index composite avec un score d'impact élevé. Un index composite sur la propriété d'égalité suivie de la propriété de plage permet au moteur de servir les deux filtres ensemble, ce qui réduit généralement les frais en RU. Après l'ajout, réexécutez la requête et comparez les frais, car les index potentiels sont des recommandations et non une preuve."
  options:
    a: { en: "Both paths already appear under Utilized Single Indexes; including them again changes nothing.", fr: "Les deux chemins figurent déjà sous Utilized Single Indexes ; les inclure à nouveau ne change rien." }
    b: { en: "The property with the range filter must be defined last in the composite index; this order cannot serve the query.", fr: "La propriété du filtre de plage doit être définie en dernier dans l'index composite ; cet ordre ne peut pas servir la requête." }
    d: { en: "EnableScanInQuery is only needed when the filtered paths are excluded from indexing; it does not reduce the charge.", fr: "EnableScanInQuery n'est utile que si les chemins filtrés sont exclus de l'indexation ; il ne réduit pas les frais." }
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
