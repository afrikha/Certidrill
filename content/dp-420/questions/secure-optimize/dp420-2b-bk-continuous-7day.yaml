id: dp420-2b-bk-continuous-7day
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is creating an Azure Cosmos DB for NoSQL account named **cosmos-orders** for an order-tracking application written in C#.

    Developers must be able to restore a container themselves, without contacting Microsoft support, to any point in time during the last five days. The solution must minimize backup storage costs.

    Which backup configuration should you choose when you create the account?
  fr: |
    Contoso crée un compte Azure Cosmos DB for NoSQL nommé **cosmos-orders** pour une application de suivi des commandes écrite en C#.

    Les développeurs doivent pouvoir restaurer eux-mêmes un conteneur, sans contacter le support Microsoft, à n'importe quel instant des cinq derniers jours. La solution doit réduire au minimum les coûts de stockage des sauvegardes.

    Quelle configuration de sauvegarde devez-vous choisir lors de la création du compte ?
body:
  options:
    - id: a
      text: { en: "Periodic backup mode with a 1-hour interval and a 120-hour retention", fr: "Mode de sauvegarde périodique avec un intervalle de 1 heure et une rétention de 120 heures" }
    - id: b
      text: { en: "Continuous backup mode with the 30-day tier", fr: "Mode de sauvegarde continue avec le niveau 30 jours" }
    - id: c
      text: { en: "Continuous backup mode with the 7-day tier", fr: "Mode de sauvegarde continue avec le niveau 7 jours" }
    - id: d
      text: { en: "Periodic backup mode with locally redundant backup storage", fr: "Mode de sauvegarde périodique avec un stockage de sauvegarde localement redondant" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Continuous backup mode provides self-service point-in-time restore through the portal, PowerShell or the Azure CLI. The 7-day tier covers the five-day requirement and has no backup storage charge, whereas the 30-day and 35-day tiers are billed for backup storage.
    fr: |
      Le mode de sauvegarde continue offre une restauration à un instant dans le passé en libre-service depuis le portail, PowerShell ou Azure CLI. Le niveau 7 jours couvre l'exigence de cinq jours et n'entraîne aucun coût de stockage des sauvegardes, alors que les niveaux 30 et 35 jours sont facturés pour ce stockage.
  options:
    a: { en: "In periodic mode, a restore requires a support request; it isn't self-service. A 120-hour retention with a 1-hour interval also keeps 120 copies, most of them billed.", fr: "En mode périodique, une restauration nécessite une demande de support : elle n'est pas en libre-service. Une rétention de 120 heures avec un intervalle de 1 heure conserve en outre 120 copies, la plupart facturées." }
    b: { en: "The 30-day tier meets the restore window but is charged for backup storage, so it doesn't minimize cost.", fr: "Le niveau 30 jours couvre la fenêtre de restauration mais est facturé pour le stockage des sauvegardes : il ne réduit pas les coûts au minimum." }
    d: { en: "Backup storage redundancy doesn't change the restore process: periodic restores still go through a support request.", fr: "La redondance du stockage des sauvegardes ne change pas le processus de restauration : en mode périodique, la restauration passe toujours par une demande de support." }
references:
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Online backup and on-demand data restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/online-backup-and-restore
