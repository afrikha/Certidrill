id: dp420-2b-mr-enable-writes
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB for NoSQL account named **cosmos-ts-checkin** that is replicated to East US, North Europe and Japan East. East US is the only write region. A C# check-in service runs in each of the three regions.

    Passengers in Europe and Asia report slow check-ins because every write goes to East US. You need to give each regional deployment local write latency and keep writes available during a regional outage without a manual failover.

    What should you do?
  fr: |
    Tailspin dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-ts-checkin** répliqué dans les régions East US, North Europe et Japan East. East US est la seule région d'écriture. Un service d'enregistrement C# s'exécute dans chacune des trois régions.

    Les passagers d'Europe et d'Asie signalent des enregistrements lents, car chaque écriture part vers East US. Vous devez offrir à chaque déploiement régional une latence d'écriture locale et garder les écritures disponibles pendant une panne régionale, sans basculement manuel.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable multi-region writes on the account.", fr: "Activer les écritures multirégions sur le compte." }
    - id: b
      text: { en: "Enable service-managed failover on the account.", fr: "Activer le basculement géré par le service sur le compte." }
    - id: c
      text: { en: "Enable availability zones in each region of the account.", fr: "Activer les zones de disponibilité dans chaque région du compte." }
    - id: d
      text: { en: "Change the default consistency level to Eventual.", fr: "Remplacer le niveau de cohérence par défaut par Eventual." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      With multi-region writes, every region of the account accepts writes, so each deployment writes to its local region. During a regional outage, the SDK routes requests to the other available regions with no manual failover and no expected downtime.
    fr: |
      Avec les écritures multirégions, chaque région du compte accepte les écritures : chaque déploiement écrit donc dans sa région locale. Pendant une panne régionale, le SDK redirige les requêtes vers les autres régions disponibles, sans basculement manuel ni interruption attendue.
  options:
    b: { en: "Service-managed failover still keeps a single write region, so European and Asian writes stay remote, and the failover can take an hour or more.", fr: "Le basculement géré par le service conserve une seule région d'écriture : les écritures européennes et asiatiques restent distantes, et le basculement peut prendre une heure ou plus." }
    c: { en: "Zone redundancy protects against a zone failure inside a region; it doesn't add write regions.", fr: "La redondance de zone protège contre la défaillance d'une zone dans une région ; elle n'ajoute pas de région d'écriture." }
    d: { en: "A weaker consistency level lowers read costs but doesn't move writes away from the single write region.", fr: "Un niveau de cohérence plus faible réduit le coût des lectures, mais ne déplace pas les écritures hors de l'unique région d'écriture." }
references:
  - title: Configure multi-region writes in applications that use Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-multi-master
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
