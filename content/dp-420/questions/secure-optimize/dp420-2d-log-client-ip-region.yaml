id: dp420-2d-log-client-ip-region
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an Azure Cosmos DB for NoSQL account replicated to East US and West US. A diagnostic setting sends the **DataPlaneRequests** category to a Log Analytics workspace in resource-specific mode.

    A partner application that connects from the public IP address 203.0.113.40 reports slow reads. You need to find, for the last 30 days, which region served the requests of this application and their server-side duration.

    What should you use?
  fr: |
    Woodgrove dispose d'un compte Azure Cosmos DB for NoSQL répliqué dans East US et West US. Un paramètre de diagnostic envoie la catégorie **DataPlaneRequests** vers un espace de travail Log Analytics en mode spécifique à la ressource.

    Une application partenaire qui se connecte depuis l'adresse IP publique 203.0.113.40 signale des lectures lentes. Vous devez trouver, pour les 30 derniers jours, la région qui a servi les requêtes de cette application et leur durée côté serveur.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A query on CDBDataPlaneRequests filtered on ClientIpAddress and grouped by RegionName", fr: "Une requête sur CDBDataPlaneRequests filtrée sur ClientIpAddress et regroupée par RegionName" } }
    - { id: b, text: { en: "The Total Requests metric in Metrics explorer, split by the Region dimension", fr: "La métrique Total Requests dans l'explorateur de métriques, fractionnée par la dimension Region" } }
    - { id: c, text: { en: "The Server Side Latency Direct metric in Metrics explorer, split by the Region dimension", fr: "La métrique Server Side Latency Direct dans l'explorateur de métriques, fractionnée par la dimension Region" } }
    - { id: d, text: { en: "A query on AzureActivity filtered on the account and grouped by the Caller column", fr: "Une requête sur AzureActivity filtrée sur le compte et regroupée par la colonne Caller" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Resource logs record each request, and CDBDataPlaneRequests includes ClientIpAddress, RegionName and DurationMs (server-side time). Filtering on the partner's IP address isolates its requests, which metrics can't do.
    fr: |
      Les journaux de ressources enregistrent chaque requête, et CDBDataPlaneRequests inclut ClientIpAddress, RegionName et DurationMs (temps côté serveur). Filtrer sur l'adresse IP du partenaire isole ses requêtes, ce que les métriques ne permettent pas.
  options:
    b: { en: "Metrics are preaggregated and have no client IP dimension, so they can't isolate one application.", fr: "Les métriques sont préagrégées et n'ont pas de dimension d'adresse IP cliente : elles ne peuvent pas isoler une application." }
    c: { en: "Latency metrics show the region but not which client sent the requests.", fr: "Les métriques de latence montrent la région mais pas le client qui a envoyé les requêtes." }
    d: { en: "The activity log records control plane operations, not data reads.", fr: "Le journal d'activité enregistre les opérations du plan de contrôle, pas les lectures de données." }
references:
  - title: Azure Monitor Logs reference - CDBDataPlaneRequests
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/cdbdataplanerequests
