id: dp420-2a-auth-uami-credential
objective: "2.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware deploys a .NET worker to Azure Container Apps. The container app has two user-assigned managed identities: **id-orders**, which has the Cosmos DB Built-in Data Contributor role on an Azure Cosmos DB for NoSQL account named **litware-db**, and **id-telemetry**, which is used for another service. Key-based authentication is disabled on the account.

    The worker must authenticate to litware-db as id-orders. To keep startup fast and behavior predictable, the code must not try any other credential type.

    Which credential should you pass to the `CosmosClient` constructor?
  fr: |
    Litware déploie un worker .NET dans Azure Container Apps. L'application conteneur dispose de deux identités managées affectées par l'utilisateur : **id-orders**, qui a le rôle Cosmos DB Built-in Data Contributor sur un compte Azure Cosmos DB for NoSQL nommé **litware-db**, et **id-telemetry**, utilisée pour un autre service. L'authentification par clé est désactivée sur le compte.

    Le worker doit s'authentifier auprès de litware-db en tant qu'id-orders. Pour garder un démarrage rapide et un comportement prévisible, le code ne doit essayer aucun autre type d'informations d'identification.

    Quelles informations d'identification devez-vous passer au constructeur `CosmosClient` ?
body:
  options:
    - id: a
      text: "new ManagedIdentityCredential(ManagedIdentityId.FromUserAssignedClientId(\"<client ID of id-orders>\"))"
    - id: b
      text: "new DefaultAzureCredential(new DefaultAzureCredentialOptions { ManagedIdentityClientId = \"<client ID of id-orders>\" })"
    - id: c
      text: "new AzureKeyCredential(Environment.GetEnvironmentVariable(\"COSMOS_PRIMARY_KEY\"))"
    - id: d
      text: "new ChainedTokenCredential(new ManagedIdentityCredential(), new AzureCliCredential())"
answer: { optionId: a }
explanation:
  correct:
    en: "`ManagedIdentityCredential` uses only the managed identity, and `ManagedIdentityId.FromUserAssignedClientId` selects id-orders among the identities of the container app. Microsoft recommends a specific credential such as `ManagedIdentityCredential` in production instead of a chain."
    fr: "`ManagedIdentityCredential` n'utilise que l'identité managée, et `ManagedIdentityId.FromUserAssignedClientId` choisit id-orders parmi les identités de l'application conteneur. Microsoft recommande en production des informations d'identification spécifiques comme `ManagedIdentityCredential` plutôt qu'une chaîne."
  options:
    b: { en: "DefaultAzureCredential would select id-orders, but it is a chain that tries other credentials, such as environment credentials, first.", fr: "DefaultAzureCredential choisirait id-orders, mais c'est une chaîne qui essaie d'abord d'autres informations d'identification, comme celles de l'environnement." }
    c: { en: "Key-based authentication is disabled on the account, so an account key is rejected.", fr: "L'authentification par clé est désactivée sur le compte : une clé de compte est rejetée." }
    d: { en: "This chain adds the Azure CLI credential, and ManagedIdentityCredential without a client ID doesn't select id-orders.", fr: "Cette chaîne ajoute les informations d'identification Azure CLI, et ManagedIdentityCredential sans ID client ne sélectionne pas id-orders." }
references:
  - title: Credential chains in the Azure Identity library for .NET
    url: https://learn.microsoft.com/en-us/dotnet/azure/sdk/authentication/credential-chains
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
