id: dp420-2c-ix-two-composites
objective: "2.3.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    A container named **members** uses the default indexing policy. The following query runs thousands of times per hour.

    ```sql
    SELECT c.id FROM c
    WHERE c.city = @city AND c.age > 30 AND c.joinedTs > @since
    ```

    The index metrics show that the query uses the range indexes on `/city/?`, `/age/?` and `/joinedTs/?`, and they recommend composite indexes with a High impact score.

    You need to add the composite indexes that let the query engine optimize both range filters.

    Which two composite indexes should you add? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un conteneur nommé **members** utilise la stratégie d'indexation par défaut. La requête suivante s'exécute des milliers de fois par heure.

    ```sql
    SELECT c.id FROM c
    WHERE c.city = @city AND c.age > 30 AND c.joinedTs > @since
    ```

    Les métriques d'index montrent que la requête utilise les index de plage sur `/city/?`, `/age/?` et `/joinedTs/?`, et elles recommandent des index composites avec un score d'impact High.

    Vous devez ajouter les index composites qui permettent au moteur de requête d'optimiser les deux filtres de plage.

    Quels sont les deux index composites à ajouter ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "(/city ASC, /age ASC)" }
    - { id: b, text: "(/city ASC, /age ASC, /joinedTs ASC)" }
    - { id: c, text: "(/city ASC, /joinedTs ASC)" }
    - { id: d, text: "(/age ASC, /city ASC)" }
    - { id: e, text: "(/joinedTs ASC, /age ASC)" }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Each composite index can optimize at most one range filter, and the range property must be defined last, after the properties with equality filters. With one equality filter (city) and two range filters (age and joinedTs), you need two composite indexes: (city, age) and (city, joinedTs). This matches the potential composite indexes that the index metrics typically report for such a query."
    fr: "Chaque index composite peut optimiser au plus un filtre de plage, et la propriété de plage doit être définie en dernier, après les propriétés des filtres d'égalité. Avec un filtre d'égalité (city) et deux filtres de plage (age et joinedTs), il faut deux index composites : (city, age) et (city, joinedTs). Cela correspond aux index composites potentiels que les métriques d'index signalent généralement pour une telle requête."
  options:
    b: { en: "A single composite index can only optimize one range filter, so it cannot serve both age and joinedTs.", fr: "Un seul index composite ne peut optimiser qu'un filtre de plage : il ne peut pas servir à la fois age et joinedTs." }
    d: { en: "The equality property (city) must come before the range property; this order is not used by the query.", fr: "La propriété d'égalité (city) doit précéder la propriété de plage ; cet ordre n'est pas utilisé par la requête." }
    e: { en: "This index contains two range properties and omits the equality filter on city.", fr: "Cet index contient deux propriétés de plage et omet le filtre d'égalité sur city." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
