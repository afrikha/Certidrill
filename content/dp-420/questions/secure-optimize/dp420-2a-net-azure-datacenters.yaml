id: dp420-2a-net-azure-datacenters
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The IP firewall of an Azure Cosmos DB for NoSQL account named **tailspin-telemetry** allows only the public IP addresses of the company offices. A new Azure Stream Analytics job must write to the account. The job has no static outbound IP address and is not connected to a virtual network.

    You need to allow the job to reach the account by using the account's firewall settings. Private endpoints are out of scope for this project.

    What should you configure?
  fr: |
    Le pare-feu IP d'un compte Azure Cosmos DB for NoSQL nommé **tailspin-telemetry** n'autorise que les adresses IP publiques des bureaux de l'entreprise. Un nouveau travail Azure Stream Analytics doit écrire dans le compte. Le travail n'a pas d'adresse IP sortante statique et n'est connecté à aucun réseau virtuel.

    Vous devez permettre au travail d'atteindre le compte au moyen des paramètres de pare-feu du compte. Les points de terminaison privés ne font pas partie de ce projet.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Enable Accept connections from within public Azure datacenters.", fr: "Activer l'option Accept connections from within public Azure datacenters." } }
    - { id: b, text: { en: "Add the AzureCloud service tag to the IP firewall.", fr: "Ajouter l'étiquette de service AzureCloud au pare-feu IP." } }
    - { id: c, text: { en: "Add the Azure Portal Middleware IPs to the IP firewall.", fr: "Ajouter au pare-feu IP les adresses IP Azure Portal Middleware." } }
    - { id: d, text: { en: "Add the IP address 168.63.129.16 to the IP firewall.", fr: "Ajouter l'adresse IP 168.63.129.16 au pare-feu IP." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Accept connections from within public Azure datacenters is meant for Azure services without fixed IP addresses, such as Azure Stream Analytics and Azure Functions. It adds 0.0.0.0 to the allowed list, which allows requests from Azure datacenter IP ranges, including other customers' subscriptions, so use it only when there is no static IP or subnet to allow.
    fr: |
      L'option Accept connections from within public Azure datacenters est prévue pour les services Azure sans adresse IP fixe, comme Azure Stream Analytics et Azure Functions. Elle ajoute 0.0.0.0 à la liste autorisée, ce qui autorise les requêtes des plages IP des centres de données Azure, y compris celles des abonnements d'autres clients : utilisez-la seulement s'il n'y a ni adresse IP statique ni sous-réseau à autoriser.
  options:
    b: { en: "The IP firewall accepts IP addresses and CIDR ranges only, not service tags.", fr: "Le pare-feu IP n'accepte que des adresses IP et des plages CIDR, pas des étiquettes de service." }
    c: { en: "The middleware IPs give the Azure portal features such as Data Explorer access; they do not cover Stream Analytics.", fr: "Les adresses IP Azure Portal Middleware donnent accès aux fonctionnalités du portail Azure comme l'Explorateur de données ; elles ne couvrent pas Stream Analytics." }
    d: { en: "168.63.129.16 is the Azure platform virtual IP used for DNS and health probes, not the source of the job's requests.", fr: "168.63.129.16 est l'adresse IP virtuelle de la plateforme Azure utilisée pour le DNS et les sondes d'intégrité, pas la source des requêtes du travail." }
references:
  - title: Configure IP firewall for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-firewall
