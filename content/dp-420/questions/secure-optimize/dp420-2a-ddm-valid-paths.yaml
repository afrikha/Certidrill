id: dp420-2a-ddm-valid-paths
objective: "2.1.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You are writing the masking policy of a container named **employees** in an Azure Cosmos DB for NoSQL account named **fabrikam-hr**. Items contain nested objects and arrays, for example:

    ```json
    { "id": "e-17", "address": { "zipCode": "98052" }, "phones": [ "+1 425 555 0100" ], "projects": [ { "name": "Apollo", "budget": 120000 } ] }
    ```

    Which two paths can you add to the `includedPaths` of the policy?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la stratégie de masquage d'un conteneur nommé **employees** d'un compte Azure Cosmos DB for NoSQL nommé **fabrikam-hr**. Les éléments contiennent des objets imbriqués et des tableaux, par exemple :

    ```json
    { "id": "e-17", "address": { "zipCode": "98052" }, "phones": [ "+1 425 555 0100" ], "projects": [ { "name": "Apollo", "budget": 120000 } ] }
    ```

    Quels sont les deux chemins que vous pouvez ajouter aux `includedPaths` de la stratégie ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "/phones/[]" }
    - { id: b, text: "/address/zipCode" }
    - { id: c, text: "/projects/[]/name" }
    - { id: d, text: "/projects/[0]/budget" }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      A masking path can target a nested property (`/address/zipCode`) or a property of the objects in an array (`/projects/[]/name`). A path cannot end with `[]`, and specific array indexes are not supported.
    fr: |
      Un chemin de masquage peut cibler une propriété imbriquée (`/address/zipCode`) ou une propriété des objets d'un tableau (`/projects/[]/name`). Un chemin ne peut pas se terminer par `[]`, et les index de tableau précis ne sont pas pris en charge.
  options:
    a: { en: "A masking path cannot end with [].", fr: "Un chemin de masquage ne peut pas se terminer par []." }
    d: { en: "Masking values at a specific array index is not supported.", fr: "Le masquage de valeurs à un index de tableau précis n'est pas pris en charge." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
