id: dp420-cs1b-tenant-pool
objective: "2.4.1"
type: multi
caseStudy: dp420-cs1b-humongous-insurance
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the throughput requirement for the large tenants. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire l'exigence de débit relative aux grands locataires. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create a fleet and add the 40 dedicated accounts to the same fleetspace.", fr: "Créer une flotte et ajouter les 40 comptes dédiés au même fleetspace." } }
    - { id: b, text: { en: "Create a fleet and add each dedicated account to its own fleetspace.", fr: "Créer une flotte et ajouter chaque compte dédié à son propre fleetspace." } }
    - { id: c, text: { en: "Configure a throughput pool on the fleetspace and lower the dedicated RU/s of each account to its guaranteed level.", fr: "Configurer un pool de débit sur le fleetspace et abaisser les RU/s dédiées de chaque compte à leur niveau garanti." } }
    - { id: d, text: { en: "Enable burst capacity on each dedicated account and lower its manual RU/s to the guaranteed level.", fr: "Activer la capacité de rafale sur chaque compte dédié et abaisser ses RU/s manuelles au niveau garanti." } }
    - { id: e, text: { en: "Move the 40 tenants to a database with shared throughput in cosmos-cd-shared.", fr: "Déplacer les 40 locataires vers une base de données à débit partagé dans cosmos-cd-shared." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      In a fleet, a fleetspace groups database accounts, even from different subscriptions, and can hold a pool of RU/s that every account of the fleetspace uses once its dedicated RU/s are exhausted. Each account keeps its dedicated, guaranteed RU/s, so you can lower them to the guaranteed level and let the pool absorb the peaks that occur at different times. The 40 accounts share the same region and single-region write configuration, which pooling requires.
    fr: |
      Dans une flotte, un fleetspace regroupe des comptes de base de données, même issus d'abonnements différents, et peut contenir un pool de RU/s que chaque compte du fleetspace utilise une fois ses RU/s dédiées épuisées. Chaque compte conserve ses RU/s dédiées et garanties : vous pouvez donc les abaisser au niveau garanti et laisser le pool absorber les pics qui surviennent à des moments différents. Les 40 comptes partagent la même région et la même configuration d'écriture monorégion, ce que le pool exige.
  options:
    b: { en: "A pool is shared only by the accounts of its fleetspace; one fleetspace per account cannot share unused throughput between tenants.", fr: "Un pool n'est partagé que par les comptes de son fleetspace ; un fleetspace par compte ne permet pas de partager le débit inutilisé entre locataires." }
    d: { en: "Burst capacity lets a physical partition reuse its own idle capacity for a few seconds; it does not use the throughput of other accounts and is not guaranteed.", fr: "La capacité de rafale permet à une partition physique de réutiliser sa propre capacité inactive pendant quelques secondes ; elle n'utilise pas le débit des autres comptes et n'est pas garantie." }
    e: { en: "The contracts of the large tenants require a dedicated account.", fr: "Les contrats des grands locataires exigent un compte dédié." }
references:
  - title: Azure Cosmos DB fleet pools
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
  - title: Azure Cosmos DB fleets overview
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet
