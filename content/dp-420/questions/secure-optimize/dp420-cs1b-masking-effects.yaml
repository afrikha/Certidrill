id: dp420-cs1b-masking-effects
objective: "2.1.4"
type: yesno_statements
caseStudy: dp420-cs1b-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You enable dynamic data masking on cosmos-cd-shared. You apply a masking policy to the claims container that masks `/claimant/email` with the Email strategy and `/claimant/phone` with the Default strategy. You make no other change to the role assignments.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous activez le masquage dynamique des données sur cosmos-cd-shared. Vous appliquez au conteneur claims une stratégie de masquage qui masque `/claimant/email` avec la stratégie Email et `/claimant/phone` avec la stratégie Default. Vous ne modifiez aucune autre attribution de rôle.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: svc-fraud keeps receiving the changes of the claims container from the change feed.
        fr: svc-fraud continue de recevoir les modifications du conteneur claims depuis le flux de modification.
    - id: s2
      text:
        en: If you restore the claims container from the continuous backup, the restored items contain the unmasked email addresses and phone numbers.
        fr: Si vous restaurez le conteneur claims à partir de la sauvegarde continue, les éléments restaurés contiennent les adresses e-mail et les numéros de téléphone non masqués.
    - id: s3
      text:
        en: A ClaimView query that returns only `c.id`, `c.status` and `c.amount` consumes additional RUs because of the masking policy.
        fr: Une requête de ClaimView qui renvoie uniquement `c.id`, `c.status` et `c.amount` consomme des RU supplémentaires à cause de la stratégie de masquage.
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: |
      Once masking applies, the change feed, in both latest version and all versions and deletes modes, is not available to principals that lack the unmask permission; id-fraud has only Cosmos DB Built-in Data Reader, which does not include unmask, so svc-fraud needs a role that adds it. Masking is applied at query time and the stored data is unchanged, so backups contain unmasked data and a restore returns the original values. Masking adds RUs only to the queries that return masked fields.
    fr: |
      Une fois le masquage appliqué, le flux de modification, en mode de la version la plus récente comme en mode toutes les versions et suppressions, n'est pas disponible pour les principaux qui n'ont pas l'autorisation unmask ; id-fraud ne dispose que de Cosmos DB Built-in Data Reader, qui n'inclut pas unmask, et svc-fraud a donc besoin d'un rôle qui l'ajoute. Le masquage est appliqué au moment de la requête et les données stockées ne changent pas : les sauvegardes contiennent les données non masquées et une restauration renvoie les valeurs d'origine. Le masquage n'ajoute des RU qu'aux requêtes qui renvoient des champs masqués.
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
