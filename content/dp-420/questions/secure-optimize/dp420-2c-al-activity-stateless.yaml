id: dp420-2c-al-activity-stateless
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    You created an activity log alert rule that notifies the data team when a container is deleted from an Azure Cosmos DB account named **cosmos-prod**. Last week, a container was deleted and the team received the notification.

    Today, the alert still shows the monitor condition **Fired** in the Azure portal. You need the alert to stop appearing as an open issue.

    What should you do?
  fr: |
    Vous avez créé une règle d'alerte de journal d'activité qui avertit l'équipe données lorsqu'un conteneur est supprimé d'un compte Azure Cosmos DB nommé **cosmos-prod**. La semaine dernière, un conteneur a été supprimé et l'équipe a reçu la notification.

    Aujourd'hui, l'alerte affiche toujours la condition de surveillance **Fired** dans le portail Azure. Vous devez faire en sorte que l'alerte n'apparaisse plus comme un problème ouvert.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Enable Automatically resolve alerts in the details of the alert rule.", fr: "Activer Automatically resolve alerts dans les détails de la règle d'alerte." }
    - id: b
      text: { en: "Change the user response of the alert to Closed.", fr: "Changer la réponse de l'utilisateur (user response) de l'alerte en Closed." }
    - id: c
      text: { en: "Recreate the deleted container so that the condition is no longer met.", fr: "Recréer le conteneur supprimé pour que la condition ne soit plus remplie." }
    - id: d
      text: { en: "Add a second action to the action group of the alert rule.", fr: "Ajouter une seconde action au groupe d'actions de la règle d'alerte." }
answer: { optionId: b }
explanation:
  correct:
    en: "Activity log alerts are event-driven and stateless: when a matching event is logged, the alert fires once and its monitor condition stays Fired indefinitely, because there is no ongoing condition to evaluate. This is expected. You manage such alerts with the user response field, changing it from New to Acknowledged or Closed."
    fr: "Les alertes de journal d'activité sont pilotées par les événements et sans état : lorsqu'un événement correspondant est journalisé, l'alerte se déclenche une fois et sa condition de surveillance reste Fired indéfiniment, car il n'existe aucune condition continue à évaluer. C'est le comportement attendu. Vous gérez ces alertes avec le champ de réponse de l'utilisateur, en le faisant passer de New à Acknowledged ou Closed."
  options:
    a: { en: "Automatic resolution makes metric alerts stateful; activity log alerts never resolve automatically.", fr: "La résolution automatique rend les alertes de métrique avec état ; les alertes de journal d'activité ne se résolvent jamais automatiquement." }
    c: { en: "The alert represents a single past event; recreating the container doesn't resolve it.", fr: "L'alerte représente un événement passé unique ; recréer le conteneur ne la résout pas." }
    d: { en: "Action groups define the notifications; they don't change the state of the alert.", fr: "Les groupes d'actions définissent les notifications ; ils ne changent pas l'état de l'alerte." }
references:
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
