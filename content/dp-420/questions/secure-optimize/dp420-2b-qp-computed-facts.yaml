id: dp420-2b-qp-computed-facts
objective: "2.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans to use computed properties in an Azure Cosmos DB for NoSQL container named **Invoices** to speed up the queries of a Python reporting service.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit d'utiliser des propriétés calculées dans un conteneur Azure Cosmos DB for NoSQL nommé **Invoices** pour accélérer les requêtes d'un service de reporting Python.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          A query that uses SELECT * returns the values of the computed properties.
        fr: |
          Une requête qui utilise SELECT * renvoie les valeurs des propriétés calculées.
    - id: s2
      text:
        en: |
          The container can have up to 20 computed properties.
        fr: |
          Le conteneur peut avoir jusqu'à 20 propriétés calculées.
    - id: s3
      text:
        en: |
          To use a computed property in an ORDER BY clause, you must index it.
        fr: |
          Pour utiliser une propriété calculée dans une clause ORDER BY, vous devez l'indexer.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Wildcard projections such as SELECT * return only persisted properties, so computed properties must be projected explicitly (for example `SELECT c.cp_total FROM c`). A container supports at most 20 computed properties. Computed properties can be used in WHERE, GROUP BY and ORDER BY, and ORDER BY requires the computed property to be indexed.
    fr: |
      Les projections génériques comme SELECT * ne renvoient que les propriétés persistantes : les propriétés calculées doivent être projetées explicitement (par exemple `SELECT c.cp_total FROM c`). Un conteneur prend en charge au maximum 20 propriétés calculées. Les propriétés calculées peuvent servir dans WHERE, GROUP BY et ORDER BY, et ORDER BY exige que la propriété calculée soit indexée.
references:
  - title: Computed properties
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/computed-properties
