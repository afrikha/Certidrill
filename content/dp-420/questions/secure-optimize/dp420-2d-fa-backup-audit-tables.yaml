id: dp420-2d-fa-backup-audit-tables
objective: "2.4.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum sends the fleet analytics of its Azure Cosmos DB fleet to a lakehouse in a Microsoft Fabric workspace. The compliance team asks for the list of account names of the tenant accounts that still use periodic backup.

    You need to write the query on the SQL endpoint of the lakehouse.

    Which two tables should you query? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum envoie l'analytique de la flotte de sa flotte Azure Cosmos DB vers un lakehouse d'un espace de travail Microsoft Fabric. L'équipe de conformité demande la liste des noms des comptes de locataires qui utilisent encore la sauvegarde périodique.

    Vous devez écrire la requête sur le point de terminaison SQL du lakehouse.

    Quelles sont les deux tables à interroger ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: FactResourceUsageHourly }
    - { id: b, text: DimMeter }
    - { id: c, text: FactAccountHourly }
    - { id: d, text: FactRequestHourly }
    - { id: e, text: DimResource }
answer: { optionIds: [c, e] }
explanation:
  correct:
    en: |
      FactAccountHourly records the account settings each hour, including BackupMode (Periodic or Continuous), but it references the account only by ResourceId. Joining it with DimResource on ResourceId returns the AccountName of each account.
    fr: |
      FactAccountHourly enregistre chaque heure les paramètres des comptes, dont BackupMode (Periodic ou Continuous), mais ne référence le compte que par ResourceId. La jointure avec DimResource sur ResourceId renvoie l'AccountName de chaque compte.
  options:
    a: { en: "FactResourceUsageHourly holds storage, throughput and container settings such as TTL, not the backup mode.", fr: "FactResourceUsageHourly contient le stockage, le débit et des paramètres de conteneur comme la durée de vie, pas le mode de sauvegarde." }
    b: { en: "DimMeter describes billing meters.", fr: "DimMeter décrit les compteurs de facturation." }
    d: { en: "FactRequestHourly counts requests per resource and operation.", fr: "FactRequestHourly compte les requêtes par ressource et par opération." }
references:
  - title: Fleet Analytics Schema Reference (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics-schema-reference
