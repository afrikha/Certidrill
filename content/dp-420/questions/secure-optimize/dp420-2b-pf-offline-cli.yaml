id: dp420-2b-pf-offline-cli
objective: "2.2.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove has an Azure Cosmos DB for NoSQL account named **cosmos-wg-trades** in a resource group named **rg-trades**. The write region is North Europe and the read region is West Europe. Per-partition automatic failover isn't enabled.

    North Europe is experiencing an outage. You need to force a failover so that West Europe accepts writes.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wg-trades** dans un groupe de ressources nommé **rg-trades**. La région d'écriture est North Europe et la région de lecture est West Europe. Le basculement automatique par partition n'est pas activé.

    North Europe subit une panne. Vous devez forcer un basculement pour que West Europe accepte les écritures.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb [[cmd]] \
      --name cosmos-wg-trades \
      --resource-group rg-trades \
      --region [[region]]
  slots:
    - id: cmd
      options:
        - { id: offline, text: offline-region }
        - { id: fpc, text: failover-priority-change }
        - { id: update, text: update }
        - { id: failover, text: failover }
    - id: region
      options:
        - { id: ne, text: NorthEurope }
        - { id: we, text: WestEurope }
answer:
  values: { cmd: offline, region: ne }
explanation:
  correct:
    en: "`az cosmosdb offline-region` takes the specified region offline. You pass the failed write region, North Europe; Azure Cosmos DB then promotes the read region with the highest failover priority, West Europe, to write region."
    fr: "`az cosmosdb offline-region` met hors ligne la région indiquée. Vous passez la région d'écriture défaillante, North Europe ; Azure Cosmos DB promeut alors en région d'écriture la région de lecture de plus haute priorité de basculement, West Europe."
  options:
    cmd: { en: "failover-priority-change changes priorities and is a planned operation to avoid during an outage; update changes account properties but doesn't take a region offline; failover isn't an az cosmosdb command.", fr: "failover-priority-change modifie les priorités et constitue une opération planifiée à éviter pendant une panne ; update modifie les propriétés du compte mais ne met pas de région hors ligne ; failover n'est pas une commande az cosmosdb." }
    region: { en: "You take the failed region offline, not the healthy region that must become the write region.", fr: "Vous mettez hors ligne la région défaillante, pas la région saine qui doit devenir la région d'écriture." }
references:
  - title: az cosmosdb
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb
  - title: Disaster recovery guidance for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/disaster-recovery-guidance
