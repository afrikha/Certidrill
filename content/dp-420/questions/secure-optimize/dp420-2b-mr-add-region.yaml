id: dp420-2b-mr-add-region
objective: "2.2.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account named **cosmos-lw-media** that stores 4 TB of data in East US. You add Brazil South as a read region from the **Replicate data globally** pane so that a C# application in Brazil can read locally.

    When does Brazil South start serving reads?
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-lw-media** qui stocke 4 To de données dans East US. Vous ajoutez Brazil South comme région de lecture depuis le volet **Replicate data globally** pour qu'une application C# au Brésil puisse lire localement.

    Quand Brazil South commence-t-il à servir des lectures ?
body:
  options:
    - id: a
      text: { en: "Immediately, while the existing data is copied to the region in the background", fr: "Immédiatement, pendant que les données existantes sont copiées vers la région en arrière-plan" }
    - id: b
      text: { en: "After all the data is replicated and committed to the region, which depends on the data size", fr: "Une fois toutes les données répliquées et validées dans la région, ce qui dépend du volume de données" }
    - id: c
      text: { en: "After you create a support request to activate the region", fr: "Après la création d'une demande de support pour activer la région" }
    - id: d
      text: { en: "After you perform a manual failover to the region and back", fr: "Après un basculement manuel vers la région puis un retour" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      When you add a region, all the data must be fully replicated and committed into the new region before the region is marked available. The time this takes depends on the amount of data stored in the account.
    fr: |
      Quand vous ajoutez une région, toutes les données doivent être entièrement répliquées et validées dans la nouvelle région avant que celle-ci soit marquée comme disponible. La durée de l'opération dépend de la quantité de données stockées dans le compte.
  options:
    a: { en: "A new region isn't marked available until replication of the existing data is complete.", fr: "Une nouvelle région n'est marquée disponible qu'une fois la réplication des données existantes terminée." }
    c: { en: "Adding a region is a self-service operation; no support request is needed.", fr: "L'ajout d'une région est une opération en libre-service ; aucune demande de support n'est nécessaire." }
    d: { en: "A failover changes the write region; it isn't needed for a read region to serve reads.", fr: "Un basculement change la région d'écriture ; il n'est pas nécessaire pour qu'une région de lecture serve des lectures." }
references:
  - title: Manage an Azure Cosmos DB account by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-database-account
