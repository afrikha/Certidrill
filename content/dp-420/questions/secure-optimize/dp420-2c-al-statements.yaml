id: dp420-2c-al-statements
objective: "2.3.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are designing Azure Monitor metric alert rules for the Azure Cosmos DB accounts of Contoso.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous concevez des règles d'alerte de métrique Azure Monitor pour les comptes Azure Cosmos DB de Contoso.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A dynamic threshold learns the historical behavior of the metric and calculates the threshold automatically.
        fr: Un seuil dynamique apprend le comportement historique de la métrique et calcule automatiquement le seuil.
    - id: s2
      text:
        en: A metric alert rule that contains two conditions fires as soon as one of the two conditions is met.
        fr: Une règle d'alerte de métrique qui contient deux conditions se déclenche dès que l'une des deux conditions est remplie.
    - id: s3
      text:
        en: When a rule monitors several values of the CollectionName dimension, each container's time series is evaluated separately and can fire its own alert.
        fr: Lorsqu'une règle surveille plusieurs valeurs de la dimension CollectionName, la série chronologique de chaque conteneur est évaluée séparément et peut déclencher sa propre alerte.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      Dynamic thresholds apply machine learning to the historical behavior of a signal to calculate thresholds and adapt over time. When a metric alert rule has multiple conditions, the alert fires only when all the conditions are true. When you select more than one dimension value, each resulting time series triggers its own alert and is charged separately.
    fr: |
      Les seuils dynamiques appliquent l'apprentissage automatique au comportement historique d'un signal pour calculer les seuils et s'adapter dans le temps. Lorsqu'une règle d'alerte de métrique comporte plusieurs conditions, l'alerte ne se déclenche que si toutes les conditions sont vraies. Lorsque vous sélectionnez plusieurs valeurs de dimension, chaque série chronologique obtenue déclenche sa propre alerte et est facturée séparément.
references:
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
  - title: Create or edit a metric alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-metric-alert-rule
