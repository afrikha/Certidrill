id: dp420-2a-authz-statements
objective: "2.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is defining who can access an Azure Cosmos DB for NoSQL account named **woodgrove-payments**. Both control plane roles (Azure RBAC) and native data plane roles are in use.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank définit qui peut accéder à un compte Azure Cosmos DB for NoSQL nommé **woodgrove-payments**. Des rôles du plan de contrôle (Azure RBAC) et des rôles natifs du plan de données sont utilisés.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A user who has the Cosmos DB Account Reader Role can retrieve the read-only keys of the account.
        fr: Un utilisateur qui a le rôle Cosmos DB Account Reader Role peut récupérer les clés en lecture seule du compte.
    - id: s2
      text:
        en: A user who has the Cosmos DB Operator role can create data plane role assignments on the account.
        fr: Un utilisateur qui a le rôle Cosmos DB Operator peut créer des attributions de rôle du plan de données sur le compte.
    - id: s3
      text:
        en: You can assign the Cosmos DB Built-in Data Reader role from the Access control (IAM) page of the account in the Azure portal.
        fr: Vous pouvez attribuer le rôle Cosmos DB Built-in Data Reader depuis la page Contrôle d'accès (IAM) du compte dans le portail Azure.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Cosmos DB Account Reader Role includes the readonlykeys action, so it can read the read-only keys. Cosmos DB Operator excludes the write and delete actions on sqlRoleDefinitions and sqlRoleAssignments, so it cannot manage data plane RBAC. Native data plane roles are not Azure RBAC roles and cannot be managed in the Azure portal: use the Azure CLI, PowerShell, Bicep or the REST API.
    fr: |
      Cosmos DB Account Reader Role inclut l'action readonlykeys : il peut donc lire les clés en lecture seule. Cosmos DB Operator exclut les actions d'écriture et de suppression sur sqlRoleDefinitions et sqlRoleAssignments : il ne peut pas gérer le RBAC du plan de données. Les rôles natifs du plan de données ne sont pas des rôles Azure RBAC et ne peuvent pas être gérés dans le portail Azure : utilisez Azure CLI, PowerShell, Bicep ou l'API REST.
references:
  - title: Azure built-in roles for Databases
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
