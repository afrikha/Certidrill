id: dp420-2b-qp-symptom-fix
objective: "2.3.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware reviews slow or expensive queries of its Python services against an Azure Cosmos DB for NoSQL account.

    Which fix should you apply to each symptom? To answer, drag the appropriate fixes to the correct symptoms. Each fix may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware examine les requêtes lentes ou coûteuses de ses services Python sur un compte Azure Cosmos DB for NoSQL.

    Quelle correction devez-vous appliquer à chaque symptôme ? Pour répondre, faites glisser les corrections appropriées vers les symptômes correspondants. Chaque correction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: include, text: { en: "Remove the filtered property from the excluded paths", fr: "Retirer la propriété filtrée des chemins exclus" } }
    - { id: param, text: { en: "Compute the current time in the application and pass it as a parameter", fr: "Calculer l'heure actuelle dans l'application et la passer en paramètre" } }
    - { id: ru, text: { en: "Increase the provisioned throughput", fr: "Augmenter le débit provisionné" } }
    - { id: pk, text: { en: "Add an equality filter on the partition key", fr: "Ajouter un filtre d'égalité sur la clé de partition" } }
    - { id: mic, text: { en: "Lower max_item_count to 10", fr: "Réduire max_item_count à 10" } }
  targets:
    - id: t1
      text: { en: "Retrieved Document Count is far higher than Output Document Count, and the WHERE property is under /description/* in excludedPaths", fr: "Retrieved Document Count est bien supérieur à Output Document Count, et la propriété du WHERE se trouve sous /description/* dans excludedPaths" }
    - id: t2
      text: { en: "A filter compares c.expiresAt with GetCurrentDateTime() and scans every document", fr: "Un filtre compare c.expiresAt à GetCurrentDateTime() et analyse chaque document" }
    - id: t3
      text: { en: "The RU charge is acceptable, but the account returns many HTTP 429 responses and the latency is high", fr: "Le coût en RU est acceptable, mais le compte renvoie de nombreuses réponses HTTP 429 et la latence est élevée" }
    - id: t4
      text: { en: "Retrieved and Output Document Counts are close, but the query is sent to every physical partition", fr: "Retrieved Document Count et Output Document Count sont proches, mais la requête est envoyée à chaque partition physique" }
answer:
  mapping: { t1: include, t2: param, t3: ru, t4: pk }
explanation:
  correct:
    en: |
      A property under an excluded path can't be filtered from the index, so including it again removes the scan. GetCurrentDateTime in a WHERE clause doesn't use the index; computing the value before execution does. HTTP 429 responses mean the requests exceed the provisioned RU/s and are retried, which adds latency. An equality filter on the partition key turns a fan-out query into a single-partition query.
    fr: |
      Une propriété située sous un chemin exclu ne peut pas être filtrée à partir de l'index : l'inclure de nouveau supprime l'analyse. GetCurrentDateTime dans une clause WHERE n'utilise pas l'index ; calculer la valeur avant l'exécution le permet. Les réponses HTTP 429 signifient que les requêtes dépassent les RU/s provisionnées et sont relancées, ce qui ajoute de la latence. Un filtre d'égalité sur la clé de partition transforme une requête distribuée en requête sur une seule partition.
  options:
    mic: { en: "A smaller page size increases the number of round trips and hurts performance.", fr: "Une taille de page plus petite augmente le nombre d'allers-retours et dégrade les performances." }
references:
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
