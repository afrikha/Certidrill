id: dp420-2a-ddm-policy-substring
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Dynamic data masking is enabled on an Azure Cosmos DB for NoSQL account named **contoso-patients**. You are writing the masking policy of a container named **patients**. Users without the unmask permission must get these results:

    - Every property is masked by default, except `id`.
    - `contact.email` keeps the first character of the user name and the domain suffix.
    - `taxId` values have 10 characters: the first two characters and the last two characters stay visible, and the six characters in between are masked.

    How should you complete the policy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le masquage dynamique des données est activé sur un compte Azure Cosmos DB for NoSQL nommé **contoso-patients**. Vous écrivez la stratégie de masquage d'un conteneur nommé **patients**. Les utilisateurs qui n'ont pas l'autorisation unmask doivent obtenir les résultats suivants :

    - Toutes les propriétés sont masquées par défaut, sauf `id`.
    - `contact.email` conserve le premier caractère du nom d'utilisateur et le suffixe du domaine.
    - Les valeurs `taxId` comptent 10 caractères : les deux premiers et les deux derniers caractères restent visibles, et les six caractères intermédiaires sont masqués.

    Comment devez-vous compléter la stratégie ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "dataMaskingPolicy": {
      "includedPaths": [
        { "path": "/" },
        { "path": "/contact/email", "strategy": "Email" },
        { "path": "/taxId", "strategy": "MaskSubstring", "startPosition": [[start]], "length": [[length]] }
      ],
      "excludedPaths": [
        { "path": "[[excl]]" }
      ]
    }
  slots:
    - id: start
      options:
        - { id: s1, text: "1" }
        - { id: s2, text: "2" }
        - { id: s3, text: "3" }
    - id: length
      options:
        - { id: l6, text: "6" }
        - { id: l8, text: "8" }
        - { id: l10, text: "10" }
    - id: excl
      options:
        - { id: id, text: "/id" }
        - { id: idq, text: "/id/?" }
        - { id: idstar, text: "/id/*" }
answer:
  values: { start: s2, length: l6, excl: id }
explanation:
  correct:
    en: |
      `MaskSubstring` masks `length` characters starting at `startPosition`, counted from the first character at position 0: with a start position of 2 and a length of 6, characters 3 to 8 are masked and the first two and last two stay visible (in the documented example, start 3 and length 5 turn Washington into WasXXXXXon). Excluded paths use plain property paths such as `/id`, and they are allowed because `/` is included.
    fr: |
      `MaskSubstring` masque `length` caractères à partir de `startPosition`, en comptant le premier caractère comme position 0 : avec une position de départ 2 et une longueur 6, les caractères 3 à 8 sont masqués, et les deux premiers et les deux derniers restent visibles (dans l'exemple documenté, un départ 3 et une longueur 5 transforment Washington en WasXXXXXon). Les chemins exclus utilisent des chemins de propriété simples comme `/id`, et ils sont autorisés car `/` est inclus.
  options:
    s1: { en: "A start position of 1 would leave only the first character visible.", fr: "Une position de départ 1 ne laisserait visible que le premier caractère." }
    s3: { en: "A start position of 3 would leave three leading characters visible.", fr: "Une position de départ 3 laisserait visibles les trois premiers caractères." }
    l8: { en: "A length of 8 would mask the last two characters as well.", fr: "Une longueur 8 masquerait aussi les deux derniers caractères." }
    l10: { en: "A length of 10 is the whole value, not the six middle characters.", fr: "Une longueur 10 correspond à toute la valeur, pas aux six caractères du milieu." }
    idq: { en: "/? and /* are indexing policy path syntax; masking paths name the property itself.", fr: "/? et /* relèvent de la syntaxe des chemins de la stratégie d'indexation ; les chemins de masquage désignent la propriété elle-même." }
    idstar: { en: "/? and /* are indexing policy path syntax; masking paths name the property itself.", fr: "/? et /* relèvent de la syntaxe des chemins de la stratégie d'indexation ; les chemins de masquage désignent la propriété elle-même." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
