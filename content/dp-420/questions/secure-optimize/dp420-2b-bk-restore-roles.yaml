id: dp420-2b-bk-restore-roles
objective: "2.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has an Azure Cosmos DB for NoSQL account named **cosmos-wg-ledger** that uses continuous backup mode. The account is in a resource group named **rg-ledger**.

    A support engineer named Engineer1 must be able to restore **cosmos-wg-ledger** to a point in time into a new account in a resource group named **rg-restore**. Engineer1 must not be able to restore any other account of the subscription, and the solution must follow the principle of least privilege.

    Which two role assignments should you create? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wg-ledger** qui utilise le mode de sauvegarde continue. Le compte se trouve dans un groupe de ressources nommé **rg-ledger**.

    Un ingénieur du support nommé Engineer1 doit pouvoir restaurer **cosmos-wg-ledger** à un instant dans le passé dans un nouveau compte, au sein d'un groupe de ressources nommé **rg-restore**. Engineer1 ne doit pas pouvoir restaurer d'autre compte de l'abonnement, et la solution doit respecter le principe du moindre privilège.

    Quelles sont les deux attributions de rôle à créer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "CosmosRestoreOperator at the scope of the restorable database account of cosmos-wg-ledger", fr: "CosmosRestoreOperator à l'étendue du compte de base de données restaurable de cosmos-wg-ledger" } }
    - { id: b, text: { en: "CosmosRestoreOperator at the scope of the rg-ledger resource group", fr: "CosmosRestoreOperator à l'étendue du groupe de ressources rg-ledger" } }
    - { id: c, text: { en: "Cosmos DB Operator at the scope of the rg-restore resource group", fr: "Cosmos DB Operator à l'étendue du groupe de ressources rg-restore" } }
    - { id: d, text: { en: "Cosmos DB Built-in Data Contributor on the cosmos-wg-ledger account", fr: "Cosmos DB Built-in Data Contributor sur le compte cosmos-wg-ledger" } }
    - { id: e, text: { en: "Owner at the scope of the subscription", fr: "Owner à l'étendue de l'abonnement" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A point-in-time restore needs the restore action on the source restorable account and write permission (databaseAccounts/write and the deployment actions) on the destination resource group. To limit Engineer1 to one source account, assign CosmosRestoreOperator on the restorable database account resource of cosmos-wg-ledger, and grant write access on rg-restore, for example with Cosmos DB Operator.
    fr: |
      Une restauration à un instant dans le passé nécessite l'action de restauration sur le compte restaurable source et l'autorisation d'écriture (databaseAccounts/write et les actions de déploiement) sur le groupe de ressources de destination. Pour limiter Engineer1 à un seul compte source, attribuez CosmosRestoreOperator sur la ressource de compte de base de données restaurable de cosmos-wg-ledger, et accordez l'accès en écriture sur rg-restore, par exemple avec Cosmos DB Operator.
  options:
    b: { en: "Restore permissions can be assigned at the restorable account or subscription scope; the resource group scope isn't supported for them.", fr: "Les autorisations de restauration peuvent être attribuées à l'étendue du compte restaurable ou de l'abonnement ; l'étendue du groupe de ressources n'est pas prise en charge." }
    d: { en: "This data-plane role reads and writes items; it grants no control-plane restore or account creation permission.", fr: "Ce rôle de plan de données lit et écrit des éléments ; il n'accorde aucune autorisation de restauration ni de création de compte sur le plan de contrôle." }
    e: { en: "Owner on the subscription would let Engineer1 restore every account, which breaks least privilege.", fr: "Owner sur l'abonnement permettrait à Engineer1 de restaurer tous les comptes, ce qui enfreint le moindre privilège." }
references:
  - title: Manage permissions to restore an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-permissions
