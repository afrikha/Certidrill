id: dp420-2b-pf-ppaf-prereqs
objective: "2.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account named **cosmos-fab-pay** in a global Azure region. The account has a single write region in West Europe and uses Session consistency. Several Python and C# services connect to the account.

    You plan to enable per-partition automatic failover on the account. You must avoid failed writes during a partition-level failover.

    Which two actions should you perform first? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-fab-pay** dans une région Azure globale. Le compte a une seule région d'écriture dans West Europe et utilise la cohérence Session. Plusieurs services Python et C# se connectent au compte.

    Vous prévoyez d'activer le basculement automatique par partition sur le compte. Vous devez éviter les échecs d'écriture pendant un basculement au niveau des partitions.

    Quelles sont les deux actions à effectuer d'abord ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add at least one read region to the account.", fr: "Ajouter au moins une région de lecture au compte." } }
    - { id: b, text: { en: "Enable multi-region writes on the account.", fr: "Activer les écritures multirégions sur le compte." } }
    - { id: c, text: { en: "Change the default consistency level to Bounded Staleness.", fr: "Remplacer le niveau de cohérence par défaut par Bounded Staleness." } }
    - { id: d, text: { en: "Upgrade every application instance to an SDK version that supports the feature.", fr: "Mettre à niveau chaque instance d'application vers une version du SDK qui prend en charge la fonctionnalité." } }
    - { id: e, text: { en: "Migrate the account to continuous backup mode.", fr: "Faire passer le compte en mode de sauvegarde continue." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Per-partition automatic failover requires a single-write-region account with at least one other read region, and every application must use an SDK that implements the failover logic (for example .NET SDK 3.62.0 or later, Python SDK 4.16.0 or later). An unsupported SDK can cause failed writes during a partition-level failover.
    fr: |
      Le basculement automatique par partition nécessite un compte à une seule région d'écriture doté d'au moins une autre région de lecture, et chaque application doit utiliser un SDK qui implémente la logique de basculement (par exemple le SDK .NET 3.62.0 ou ultérieur, le SDK Python 4.16.0 ou ultérieur). Un SDK non pris en charge peut entraîner des échecs d'écriture pendant un basculement au niveau des partitions.
  options:
    b: { en: "The feature targets accounts with a single write region; multi-region writes aren't a prerequisite.", fr: "La fonctionnalité cible les comptes à une seule région d'écriture ; les écritures multirégions ne sont pas un prérequis." }
    c: { en: "Session is already supported, while Bounded Staleness isn't supported yet.", fr: "Session est déjà prise en charge, alors que Bounded Staleness ne l'est pas encore." }
    e: { en: "The backup mode isn't a prerequisite of per-partition automatic failover.", fr: "Le mode de sauvegarde n'est pas un prérequis du basculement automatique par partition." }
references:
  - title: Configure per-partition automatic failover for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
