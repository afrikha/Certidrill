id: dp420-2c-lat-slow-request-log
objective: "2.3.4"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A shopping-cart service reads carts by using the Azure Cosmos DB .NET SDK. Its latency objective is 25 ms end to end for each read.

    You need to log the full diagnostics of every read that misses the objective, so that you can analyze the slow requests later.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un service de paniers d'achat lit les paniers avec le SDK .NET Azure Cosmos DB. Son objectif de latence est de 25 ms de bout en bout pour chaque lecture.

    Vous devez journaliser les diagnostics complets de chaque lecture qui ne respecte pas l'objectif, afin d'analyser ultérieurement les requêtes lentes.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    ItemResponse<Cart> response = await container.ReadItemAsync<Cart>(
        cartId, new PartitionKey(customerId));

    if (response.Diagnostics.[[elapsed]] > TimeSpan.FromMilliseconds(25))
    {
        logger.LogWarning("Slow cart read: {Diagnostics}",
            response.Diagnostics.[[dump]]);
    }
  slots:
    - id: elapsed
      options:
        - { id: client, text: "GetClientElapsedTime()" }
        - { id: start, text: "GetStartTimeUtc()" }
        - { id: failed, text: "GetFailedRequestCount()" }
    - id: dump
      options:
        - { id: regions, text: "GetContactedRegions()" }
        - { id: tostring, text: "ToString()" }
        - { id: qm, text: "GetQueryMetrics()" }
answer:
  values: { elapsed: client, dump: tostring }
explanation:
  correct:
    en: "`GetClientElapsedTime()` returns the end-to-end elapsed time of the request as seen by the SDK, which is the value to compare with the objective. All SDK responses expose a `Diagnostics` property, and `ToString()` returns the full diagnostics string, including retries, transport timeline and CPU history. Log the string as is; don't parse it, because its format changes between SDK versions."
    fr: "`GetClientElapsedTime()` renvoie le temps écoulé de bout en bout de la requête vu par le SDK, valeur à comparer à l'objectif. Toutes les réponses du SDK exposent une propriété `Diagnostics`, et `ToString()` renvoie la chaîne de diagnostics complète, avec les nouvelles tentatives, la chronologie de transport et l'historique du processeur. Journalisez la chaîne telle quelle sans l'analyser, car son format change d'une version du SDK à l'autre."
  options:
    start: { en: "GetStartTimeUtc() returns when the request started, not how long it took.", fr: "GetStartTimeUtc() renvoie l'heure de début de la requête, pas sa durée." }
    failed: { en: "GetFailedRequestCount() returns a count of failed requests, not a duration.", fr: "GetFailedRequestCount() renvoie un nombre de requêtes en échec, pas une durée." }
    regions: { en: "GetContactedRegions() returns only the list of regions contacted, not the full diagnostics.", fr: "GetContactedRegions() renvoie uniquement la liste des régions contactées, pas les diagnostics complets." }
    qm: { en: "GetQueryMetrics() returns backend query metrics; a point read has no query metrics.", fr: "GetQueryMetrics() renvoie des métriques de requête back-end ; une lecture ponctuelle n'en a pas." }
references:
  - title: Diagnose and troubleshoot slow requests in Azure Cosmos DB .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-dotnet-sdk-slow-request
  - title: CosmosDiagnostics Class
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosdiagnostics
