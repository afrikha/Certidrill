id: dp420-cs1a-read-latency
objective: "2.3.4"
type: single
caseStudy: dp420-cs1a-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    You need to meet the latency investigation requirement for app-storefront. What should you review in Azure Monitor metrics for cosmos-aw-store?
  fr: |
    Vous devez satisfaire l'exigence relative à l'analyse de la latence d'app-storefront. Que devez-vous examiner dans les métriques Azure Monitor de cosmos-aw-store ?
body:
  options:
    - { id: a, text: { en: "Server Side Latency Gateway, split by OperationType", fr: "Server Side Latency Gateway, avec un fractionnement par OperationType" } }
    - { id: b, text: { en: "Server Side Latency Direct, split by OperationType", fr: "Server Side Latency Direct, avec un fractionnement par OperationType" } }
    - { id: c, text: { en: "Normalized RU Consumption, split by PartitionKeyRangeId", fr: "Normalized RU Consumption, avec un fractionnement par PartitionKeyRangeId" } }
    - { id: d, text: { en: "Total Requests, split by StatusCode", fr: "Total Requests, avec un fractionnement par StatusCode" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Server-side latency is the time spent in the Azure Cosmos DB backend before the data is returned, so comparing it with the latency measured by the application shows whether the time is spent in the backend or between the client and the service. app-storefront uses Direct connectivity, so the Server Side Latency Direct metric applies; splitting by OperationType isolates the point reads.
    fr: |
      La latence côté serveur est le temps passé dans le back-end d'Azure Cosmos DB avant le renvoi des données : la comparer à la latence mesurée par l'application montre si le temps est passé dans le back-end ou entre le client et le service. app-storefront utilise la connectivité Direct, la métrique Server Side Latency Direct s'applique donc ; le fractionnement par OperationType isole les lectures ponctuelles.
  options:
    a: { en: "Server Side Latency Gateway covers operations sent in Gateway mode; app-storefront uses Direct mode.", fr: "Server Side Latency Gateway couvre les opérations envoyées en mode Gateway ; app-storefront utilise le mode Direct." }
    c: { en: "Normalized RU Consumption shows how close partitions are to their provisioned throughput; it does not measure backend latency.", fr: "Normalized RU Consumption montre à quel point les partitions sont proches de leur débit provisionné ; elle ne mesure pas la latence du back-end." }
    d: { en: "Total Requests by StatusCode reveals errors or throttling (429), not the time spent in the backend.", fr: "Total Requests par StatusCode révèle les erreurs ou les limitations (429), pas le temps passé dans le back-end." }
references:
  - title: How to monitor the server-side latency for operations in an Azure Cosmos DB container or account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-server-side-latency
