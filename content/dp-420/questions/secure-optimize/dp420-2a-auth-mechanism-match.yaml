id: dp420-2a-auth-mechanism-match
objective: "2.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys uses an Azure Cosmos DB for NoSQL account named **wingtip-db**. Key-based authentication is still enabled on the account. Several clients need access, as described in the answer area.

    Which authentication mechanism should each client use? To answer, drag the appropriate mechanisms to the correct clients. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys utilise un compte Azure Cosmos DB for NoSQL nommé **wingtip-db**. L'authentification par clé est encore activée sur le compte. Plusieurs clients ont besoin d'un accès, comme décrit dans la zone de réponse.

    Quel mécanisme d'authentification chaque client doit-il utiliser ? Pour répondre, faites glisser les mécanismes appropriés vers les clients correspondants. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: mi, text: { en: "Microsoft Entra ID with a managed identity", fr: "Microsoft Entra ID avec une identité managée" } }
    - { id: rokey, text: { en: "Primary read-only key", fr: "Clé primaire en lecture seule" } }
    - { id: token, text: { en: "Resource token", fr: "Jeton de ressource" } }
    - { id: rwkey, text: { en: "Primary key", fr: "Clé primaire" } }
    - { id: secret, text: { en: "Microsoft Entra ID with a client secret stored in the app settings", fr: "Microsoft Entra ID avec une clé secrète client stockée dans les paramètres de l'application" } }
  targets:
    - id: api
      text: { en: "An order API hosted in Azure App Service that must not store any secret", fr: "Une API de commandes hébergée dans Azure App Service qui ne doit stocker aucun secret" }
    - id: report
      text: { en: "A third-party reporting tool that supports only account keys and must only read data", fr: "Un outil de création de rapports tiers qui ne prend en charge que les clés de compte et doit seulement lire les données" }
    - id: mobile
      text: { en: "Game clients whose players have no Microsoft Entra account and receive time-limited access to one container from a trusted backend", fr: "Des clients de jeu dont les joueurs n'ont pas de compte Microsoft Entra et reçoivent d'un back-end approuvé un accès limité dans le temps à un conteneur" }
answer:
  mapping: { api: mi, report: rokey, mobile: token }
explanation:
  correct:
    en: |
      A managed identity lets an Azure-hosted app get Microsoft Entra tokens without storing any secret. A read-only key gives a key-only tool read access without write rights. A resource token is created by a trusted backend for a user on a specific resource, is valid for a limited time and requires no Microsoft Entra account for the end user.
    fr: |
      Une identité managée permet à une application hébergée dans Azure d'obtenir des jetons Microsoft Entra sans stocker de secret. Une clé en lecture seule donne à un outil qui ne gère que les clés un accès en lecture sans droit d'écriture. Un jeton de ressource est créé par un back-end approuvé pour un utilisateur sur une ressource précise, il est valide pendant une durée limitée et ne nécessite pas de compte Microsoft Entra pour l'utilisateur final.
  options:
    rwkey: { en: "The primary key grants full read-write access, more than any of these clients needs.", fr: "La clé primaire accorde un accès complet en lecture-écriture, plus que ce dont ces clients ont besoin." }
    secret: { en: "A client secret is a stored secret, which the API must avoid.", fr: "Une clé secrète client est un secret stocké, ce que l'API doit éviter." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
  - title: Permissions
    url: https://learn.microsoft.com/en-us/rest/api/cosmos-db/permissions
