id: dp420-2a-auth-disable-local-bicep
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are writing a Bicep file that deploys a new Azure Cosmos DB for NoSQL account named **adatum-catalog**.

    Every application must authenticate to the account by using Microsoft Entra ID. Requests signed with account keys must be rejected.

    How should you complete the Bicep file? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez un fichier Bicep qui déploie un nouveau compte Azure Cosmos DB for NoSQL nommé **adatum-catalog**.

    Toutes les applications doivent s'authentifier auprès du compte avec Microsoft Entra ID. Les requêtes signées avec des clés de compte doivent être rejetées.

    Comment devez-vous compléter le fichier Bicep ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bicep
  template: |
    resource account 'Microsoft.DocumentDB/databaseAccounts@2024-05-15' = {
      name: 'adatum-catalog'
      location: location
      kind: '[[kind]]'
      properties: {
        databaseAccountOfferType: 'Standard'
        locations: [
          {
            locationName: location
          }
        ]
        [[prop]]: true
      }
    }
  slots:
    - id: kind
      options:
        - { id: gdd, text: "GlobalDocumentDB" }
        - { id: mongo, text: "MongoDB" }
        - { id: parse, text: "Parse" }
    - id: prop
      options:
        - { id: local, text: "disableLocalAuth" }
        - { id: meta, text: "disableKeyBasedMetadataWriteAccess" }
        - { id: vnet, text: "isVirtualNetworkFilterEnabled" }
        - { id: failover, text: "enableAutomaticFailover" }
answer:
  values: { kind: gdd, prop: local }
explanation:
  correct:
    en: |
      A NoSQL account uses the kind `GlobalDocumentDB`. Setting `disableLocalAuth` to `true` disables key-based authentication, so applications must use Microsoft Entra ID and connections that present an account key fail.
    fr: |
      Un compte NoSQL utilise le type (kind) `GlobalDocumentDB`. Définir `disableLocalAuth` sur `true` désactive l'authentification par clé : les applications doivent utiliser Microsoft Entra ID et les connexions qui présentent une clé de compte échouent.
  options:
    mongo: { en: "MongoDB creates an Azure Cosmos DB for MongoDB account, not a NoSQL account.", fr: "MongoDB crée un compte Azure Cosmos DB for MongoDB, pas un compte NoSQL." }
    meta: { en: "disableKeyBasedMetadataWriteAccess only blocks metadata changes made with keys; key-based data operations still work.", fr: "disableKeyBasedMetadataWriteAccess bloque seulement les modifications de métadonnées faites avec des clés ; les opérations de données par clé fonctionnent encore." }
    vnet: { en: "isVirtualNetworkFilterEnabled turns on virtual network rules; it does not change the authentication method.", fr: "isVirtualNetworkFilterEnabled active les règles de réseau virtuel ; il ne change pas la méthode d'authentification." }
    failover: { en: "enableAutomaticFailover is an availability setting.", fr: "enableAutomaticFailover est un paramètre de disponibilité." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
