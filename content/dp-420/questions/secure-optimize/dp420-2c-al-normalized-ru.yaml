id: dp420-2c-al-normalized-ru
objective: "2.3.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A container named **inventory** has dedicated provisioned throughput and six physical partitions. You suspect a hot partition.

    You need an alert that fires separately for each physical partition of **inventory** whose throughput utilization goes above 90 % during the evaluation period.

    How should you configure the metric alert rule?
  fr: |
    Un conteneur nommé **inventory** dispose d'un débit provisionné dédié et de six partitions physiques. Vous soupçonnez une partition chaude.

    Vous avez besoin d'une alerte qui se déclenche séparément pour chaque partition physique d'**inventory** dont l'utilisation du débit dépasse 90 % pendant la période d'évaluation.

    Comment devez-vous configurer la règle d'alerte de métrique ?
body:
  options:
    - id: a
      text: { en: "Normalized RU Consumption, Maximum aggregation, filtered on inventory, split by PartitionKeyRangeId", fr: "Normalized RU Consumption, agrégation Maximum, filtrée sur inventory, fractionnée par PartitionKeyRangeId" }
    - id: b
      text: { en: "Normalized RU Consumption, Average aggregation, filtered on inventory, no splitting", fr: "Normalized RU Consumption, agrégation Average, filtrée sur inventory, sans fractionnement" }
    - id: c
      text: { en: "Total Request Units, Total aggregation, filtered on inventory, split by OperationType", fr: "Total Request Units, agrégation Total, filtrée sur inventory, fractionnée par OperationType" }
    - id: d
      text: { en: "Provisioned Throughput, Maximum aggregation, filtered on inventory, no splitting", fr: "Provisioned Throughput, agrégation Maximum, filtrée sur inventory, sans fractionnement" }
answer: { optionId: a }
explanation:
  correct:
    en: "Normalized RU Consumption (0 to 100 %) is the maximum RU/s utilization across the partition key ranges of the container, and each PartitionKeyRangeId maps to one physical partition. Splitting the rule by PartitionKeyRangeId creates one time series per physical partition, each of which can fire its own alert, and the Maximum aggregation catches the peaks that cause throttling."
    fr: "Normalized RU Consumption (de 0 à 100 %) est l'utilisation maximale des RU/s parmi les plages de clés de partition du conteneur, et chaque PartitionKeyRangeId correspond à une partition physique. Fractionner la règle par PartitionKeyRangeId crée une série chronologique par partition physique, chacune pouvant déclencher sa propre alerte, et l'agrégation Maximum capte les pics qui provoquent la limitation du débit."
  options:
    b: { en: "Without splitting, the rule evaluates the container as a whole and can't fire per partition; the average also hides short peaks.", fr: "Sans fractionnement, la règle évalue le conteneur dans son ensemble et ne peut pas se déclencher par partition ; la moyenne masque aussi les pics brefs." }
    c: { en: "Total Request Units is an absolute RU count and has no PartitionKeyRangeId dimension, so it can't express a utilization percentage per partition.", fr: "Total Request Units est un nombre absolu de RU sans dimension PartitionKeyRangeId : il ne peut pas exprimer un pourcentage d'utilisation par partition." }
    d: { en: "Provisioned Throughput reports the configured RU/s, not how much of it is consumed.", fr: "Provisioned Throughput indique les RU/s configurées, pas la part consommée." }
references:
  - title: Monitor normalized request units in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-normalized-request-units
  - title: Create or edit a metric alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-metric-alert-rule
