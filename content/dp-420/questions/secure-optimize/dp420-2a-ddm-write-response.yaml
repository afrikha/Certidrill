id: dp420-2a-ddm-write-response
objective: "2.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A support application updates customer profiles in a container named **profiles** of an Azure Cosmos DB for NoSQL account named **adatum-retail**. The container's masking policy includes the path `/ssn`. The application identity has a custom role with readMetadata, items/read, executeQuery, readChangeFeed and items/upsert, but not items/unmask.

    Queries issued by the application return masked `ssn` values as expected. However, a tester notices that the response of each `UpsertItemAsync` call contains the original `ssn` value.

    What is the cause?
  fr: |
    Une application de support met à jour des profils clients dans un conteneur nommé **profiles** d'un compte Azure Cosmos DB for NoSQL nommé **adatum-retail**. La stratégie de masquage du conteneur inclut le chemin `/ssn`. L'identité de l'application a un rôle personnalisé avec readMetadata, items/read, executeQuery, readChangeFeed et items/upsert, mais pas items/unmask.

    Les requêtes émises par l'application renvoient comme prévu des valeurs `ssn` masquées. Cependant, un testeur remarque que la réponse de chaque appel `UpsertItemAsync` contient la valeur `ssn` d'origine.

    Quelle est la cause ?
body:
  options:
    - { id: a, text: { en: "The items/upsert data action implicitly includes items/unmask, so the identity is treated as a high-privilege user.", fr: "L'action de données items/upsert inclut implicitement items/unmask : l'identité est donc traitée comme un utilisateur à privilèges élevés." } }
    - { id: b, text: { en: "The /ssn path must also be excluded from the indexing policy for masking to apply to point operations.", fr: "Le chemin /ssn doit aussi être exclu de la stratégie d'indexation pour que le masquage s'applique aux opérations ponctuelles." } }
    - { id: c, text: { en: "The masking policy has not finished propagating, which can take up to 15 minutes after the policy is saved.", fr: "La stratégie de masquage n'a pas fini de se propager, ce qui peut prendre jusqu'à 15 minutes après son enregistrement." } }
    - { id: d, text: { en: "Masking applies only to read and query results; write operations act on the original data and can return it in their responses.", fr: "Le masquage ne s'applique qu'aux résultats de lecture et de requête ; les opérations d'écriture agissent sur les données d'origine et peuvent les renvoyer dans leur réponse." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dynamic data masking applies only to the projections of read and query responses. Create, replace, upsert and patch operations act on the unmasked underlying data and can return unmasked data in their responses, so write responses must be handled with care.
    fr: |
      Le masquage dynamique des données ne s'applique qu'aux projections des réponses de lecture et de requête. Les opérations de création, de remplacement, d'upsert et de patch agissent sur les données sous-jacentes non masquées et peuvent renvoyer des données non masquées dans leur réponse : les réponses d'écriture doivent donc être traitées avec prudence.
  options:
    a: { en: "unmask is a separate data action; upsert does not grant it.", fr: "unmask est une action de données distincte ; upsert ne l'accorde pas." }
    b: { en: "Masking does not depend on the indexing policy.", fr: "Le masquage ne dépend pas de la stratégie d'indexation." }
    c: { en: "The queries already return masked values, so the policy is in effect; the 15-minute delay concerns enabling the feature on the account.", fr: "Les requêtes renvoient déjà des valeurs masquées, la stratégie est donc appliquée ; le délai de 15 minutes concerne l'activation de la fonctionnalité sur le compte." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
