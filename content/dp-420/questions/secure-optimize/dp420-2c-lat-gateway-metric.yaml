id: dp420-2c-lat-gateway-metric
objective: "2.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A recommendation service written with the Azure Cosmos DB Python SDK reads and writes items in a container named **profiles**. Users report slow responses.

    Before you investigate the application code, you need to check in Azure Monitor how long the backend takes to process each type of operation for the container.

    Which metric should you chart?
  fr: |
    Un service de recommandations écrit avec le SDK Python Azure Cosmos DB lit et écrit des éléments dans un conteneur nommé **profiles**. Les utilisateurs signalent des réponses lentes.

    Avant d'examiner le code de l'application, vous devez vérifier dans Azure Monitor combien de temps le back-end met à traiter chaque type d'opération pour le conteneur.

    Quelle métrique devez-vous afficher ?
body:
  options:
    - id: a
      text: { en: "Server Side Latency Direct, filtered on the container and split by OperationType", fr: "Server Side Latency Direct, filtrée sur le conteneur et fractionnée par OperationType" }
    - id: b
      text: { en: "Server Side Latency Gateway, filtered on the container and split by OperationType", fr: "Server Side Latency Gateway, filtrée sur le conteneur et fractionnée par OperationType" }
    - id: c
      text: { en: "P99 Replication Latency, filtered on the source and target regions", fr: "P99 Replication Latency, filtrée sur les régions source et cible" }
    - id: d
      text: { en: "Service Availability, filtered on the IsExternal dimension", fr: "Service Availability, filtrée sur la dimension IsExternal" }
answer: { optionId: b }
explanation:
  correct:
    en: "Server-side latency shows the time spent on the backend before the data is returned, which rules backend issues in or out. Use Server Side Latency Gateway for requests in gateway mode and Server Side Latency Direct for direct mode. Direct mode is only supported by the .NET and Java SDKs, so a Python application always connects through the gateway."
    fr: "La latence côté serveur indique le temps passé dans le back-end avant le renvoi des données, ce qui permet d'écarter ou de confirmer un problème back-end. Utilisez Server Side Latency Gateway pour les requêtes en mode passerelle et Server Side Latency Direct pour le mode direct. Le mode direct n'est pris en charge que par les SDK .NET et Java : une application Python passe donc toujours par la passerelle."
  options:
    a: { en: "The Python SDK doesn't support direct mode, so its requests are not reported by the Direct metric.", fr: "Le SDK Python ne prend pas en charge le mode direct : ses requêtes n'apparaissent pas dans la métrique Direct." }
    c: { en: "Replication latency measures geo-replication between regions, not the processing time of requests.", fr: "La latence de réplication mesure la géoréplication entre régions, pas le temps de traitement des requêtes." }
    d: { en: "Service Availability is a percentage of successful requests per hour, not a latency.", fr: "Service Availability est un pourcentage de requêtes réussies par heure, pas une latence." }
references:
  - title: How to monitor the server-side latency for operations in an Azure Cosmos DB container or account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-server-side-latency
  - title: Azure Cosmos DB SQL SDK connectivity modes
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/sdk-connection-modes
