id: dp420-2a-ddm-strategy-match
objective: "2.1.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank configures the masking policy of a container named **accounts** in an Azure Cosmos DB for NoSQL account. Users without the unmask permission must see the results described in the answer area.

    Which masking strategy should you use for each path? To answer, drag the appropriate strategies to the correct paths. Each strategy may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank configure la stratégie de masquage d'un conteneur nommé **accounts** dans un compte Azure Cosmos DB for NoSQL. Les utilisateurs qui n'ont pas l'autorisation unmask doivent voir les résultats décrits dans la zone de réponse.

    Quelle stratégie de masquage devez-vous utiliser pour chaque chemin ? Pour répondre, faites glisser les stratégies appropriées vers les chemins correspondants. Chaque stratégie peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: def, text: "Default" }
    - { id: email, text: "Email" }
    - { id: sub, text: "MaskSubstring" }
  targets:
    - id: mail
      text: { en: "/owner/email: only the first character of the user name and the domain suffix stay visible", fr: "/owner/email : seuls le premier caractère du nom d'utilisateur et le suffixe du domaine restent visibles" }
    - id: iban
      text: { en: "/iban: the first four characters stay visible and the next twelve characters are masked", fr: "/iban : les quatre premiers caractères restent visibles et les douze caractères suivants sont masqués" }
    - id: balance
      text: { en: "/balance (a number): the value is returned as 0", fr: "/balance (un nombre) : la valeur est renvoyée sous la forme 0" }
    - id: notes
      text: { en: "/notes (a string): the whole value is replaced by XXXX", fr: "/notes (une chaîne) : toute la valeur est remplacée par XXXX" }
answer:
  mapping: { mail: email, iban: sub, balance: def, notes: def }
explanation:
  correct:
    en: |
      Email keeps the first character of the user name and the domain suffix. MaskSubstring masks a given number of characters from a start position, here `startPosition` 4 and `length` 12. Default replaces strings with XXXX, numbers with 0 and booleans with false, so it covers both /balance and /notes.
    fr: |
      Email conserve le premier caractère du nom d'utilisateur et le suffixe du domaine. MaskSubstring masque un nombre donné de caractères à partir d'une position de départ, ici `startPosition` 4 et `length` 12. Default remplace les chaînes par XXXX, les nombres par 0 et les booléens par false : elle couvre donc /balance et /notes.
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
