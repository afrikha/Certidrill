id: dp420-2a-auth-cli-readonly-key
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A reporting tool reads data from an Azure Cosmos DB for NoSQL account named **woodgrove-sales** by using the **secondary read-only key**. The tool supports only key-based authentication. The key was accidentally published in a wiki page.

    You need to invalidate the exposed key and then display the new key value for the tool. The other keys must keep their current values, and the output of the second command must not contain the read-write keys.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un outil de création de rapports lit des données dans un compte Azure Cosmos DB for NoSQL nommé **woodgrove-sales** avec la **clé secondaire en lecture seule**. L'outil ne prend en charge que l'authentification par clé. La clé a été publiée par erreur dans une page wiki.

    Vous devez invalider la clé exposée, puis afficher la nouvelle valeur de la clé pour l'outil. Les autres clés doivent garder leur valeur actuelle, et la sortie de la deuxième commande ne doit pas contenir les clés en lecture-écriture.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb keys regenerate \
      --name woodgrove-sales \
      --resource-group rg-sales \
      --key-kind [[kind]]

    az cosmosdb keys list \
      --name woodgrove-sales \
      --resource-group rg-sales \
      --type [[type]]
  slots:
    - id: kind
      options:
        - { id: sro, text: "secondaryReadonly" }
        - { id: sec, text: "secondary" }
        - { id: pro, text: "primaryReadonly" }
        - { id: pri, text: "primary" }
    - id: type
      options:
        - { id: rok, text: "read-only-keys" }
        - { id: keys, text: "keys" }
        - { id: cs, text: "connection-strings" }
answer:
  values: { kind: sro, type: rok }
explanation:
  correct:
    en: |
      `az cosmosdb keys regenerate --key-kind secondaryReadonly` regenerates only the exposed key. `az cosmosdb keys list --type read-only-keys` returns only the primary and secondary read-only keys, so the read-write keys are not displayed.
    fr: |
      `az cosmosdb keys regenerate --key-kind secondaryReadonly` régénère uniquement la clé exposée. `az cosmosdb keys list --type read-only-keys` ne renvoie que les clés primaire et secondaire en lecture seule : les clés en lecture-écriture ne sont pas affichées.
  options:
    sec: { en: "secondary is the read-write secondary key, which was not exposed and must keep its value.", fr: "secondary est la clé secondaire en lecture-écriture, qui n'a pas été exposée et doit garder sa valeur." }
    pro: { en: "primaryReadonly is a different key from the one the tool uses.", fr: "primaryReadonly est une autre clé que celle utilisée par l'outil." }
    pri: { en: "primary is the read-write primary key, which was not exposed.", fr: "primary est la clé primaire en lecture-écriture, qui n'a pas été exposée." }
    keys: { en: "keys, the default value, returns the read-write keys.", fr: "keys, la valeur par défaut, renvoie les clés en lecture-écriture." }
    cs: { en: "connection-strings returns connection strings, including the read-write ones.", fr: "connection-strings renvoie des chaînes de connexion, y compris celles en lecture-écriture." }
references:
  - title: az cosmosdb keys
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb/keys
