id: dp420-2b-mr-lww-path
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware is creating a container named **Profiles** in an Azure Cosmos DB for NoSQL account that has multi-region writes. Each profile document has a numeric `version` property that the C# application increments on every update.

    When the same profile is updated concurrently in two regions, the update with the highest `version` must win. The solution must not require any server-side code.

    How should you complete the conflict resolution policy of the container? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware crée un conteneur nommé **Profiles** dans un compte Azure Cosmos DB for NoSQL doté d'écritures multirégions. Chaque document de profil possède une propriété numérique `version` que l'application C# incrémente à chaque mise à jour.

    Quand un même profil est mis à jour simultanément dans deux régions, la mise à jour dont la `version` est la plus élevée doit l'emporter. La solution ne doit nécessiter aucun code côté serveur.

    Comment devez-vous compléter la stratégie de résolution des conflits du conteneur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "conflictResolutionPolicy": {
      "mode": "[[mode]]",
      "conflictResolutionPath": "[[path]]"
    }
  slots:
    - id: mode
      options:
        - { id: lww, text: LastWriterWins }
        - { id: custom, text: Custom }
        - { id: manual, text: Manual }
    - id: path
      options:
        - { id: version, text: /version }
        - { id: ts, text: /_ts }
        - { id: etag, text: /_etag }
answer:
  values: { mode: lww, path: version }
explanation:
  correct:
    en: "Last Writer Wins (the default mode) keeps the version with the highest value of the conflict resolution path. By default the path is the system timestamp `/_ts`; for the NoSQL API you can set a custom numeric property such as `/version`. The policy must be set when the container is created."
    fr: "Last Writer Wins (le mode par défaut) conserve la version qui a la valeur la plus élevée dans le chemin de résolution des conflits. Par défaut, ce chemin est l'horodatage système `/_ts` ; pour l'API NoSQL, vous pouvez définir une propriété numérique personnalisée comme `/version`. La stratégie doit être définie à la création du conteneur."
  options:
    custom: { en: "Custom mode relies on a merge stored procedure registered on the container, which is server-side code.", fr: "Le mode Custom repose sur une procédure stockée de fusion inscrite sur le conteneur, c'est-à-dire du code côté serveur." }
    manual: { en: "Manual isn't a conflict resolution mode.", fr: "Manual n'est pas un mode de résolution des conflits." }
    ts: { en: "/_ts would make the latest write by timestamp win, not the highest version.", fr: "/_ts ferait gagner la dernière écriture selon l'horodatage, et non la version la plus élevée." }
    etag: { en: "_etag isn't numeric, and the conflict resolution path must be a numeric property.", fr: "_etag n'est pas numérique, et le chemin de résolution des conflits doit être une propriété numérique." }
references:
  - title: Conflict types and resolution policies when using multiple write regions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
