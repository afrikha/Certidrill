id: dp420-2c-al-action-group
objective: "2.3.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has six Azure Monitor alert rules for its Azure Cosmos DB account. When any of them fires, the on-call engineer must receive an email and an Azure function must open an incident ticket.

    You need to configure the notifications so that they can be maintained in one place for all six rules.

    What should you do?
  fr: |
    Wingtip dispose de six règles d'alerte Azure Monitor pour son compte Azure Cosmos DB. Lorsque l'une d'elles se déclenche, l'ingénieur d'astreinte doit recevoir un e-mail et une fonction Azure doit ouvrir un ticket d'incident.

    Vous devez configurer les notifications de sorte qu'elles soient gérées à un seul endroit pour les six règles.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Create a diagnostic setting that streams the alerts to an event hub read by the function.", fr: "Créer un paramètre de diagnostic qui diffuse les alertes vers un hub d'événements lu par la fonction." }
    - id: b
      text: { en: "Create a workbook from Insights and pin its charts to a shared dashboard.", fr: "Créer un classeur à partir d'Insights et épingler ses graphiques sur un tableau de bord partagé." }
    - id: c
      text: { en: "Create an action group with an email notification and an Azure Function action, and add it to each rule.", fr: "Créer un groupe d'actions avec une notification par e-mail et une action de fonction Azure, et l'ajouter à chaque règle." }
    - id: d
      text: { en: "Enable Application Insights smart detection for the Azure Cosmos DB account.", fr: "Activer la détection intelligente d'Application Insights pour le compte Azure Cosmos DB." }
answer: { optionId: c }
explanation:
  correct:
    en: "An action group defines the actions to take when an alert fires, such as email, SMS, push or voice notifications and actions like calling an Azure function, a logic app or a webhook. Because an action group is a separate resource, the same group can be attached to many alert rules and updated once."
    fr: "Un groupe d'actions définit les actions à exécuter lorsqu'une alerte se déclenche, par exemple des notifications par e-mail, SMS, push ou appel vocal et des actions comme l'appel d'une fonction Azure, d'une application logique ou d'un webhook. Comme le groupe d'actions est une ressource distincte, le même groupe peut être associé à de nombreuses règles d'alerte et mis à jour une seule fois."
  options:
    a: { en: "Diagnostic settings route resource logs and metrics to destinations; they don't send alert notifications.", fr: "Les paramètres de diagnostic acheminent les journaux de ressources et les métriques vers des destinations ; ils n'envoient pas de notifications d'alerte." }
    b: { en: "Workbooks and dashboards visualize data; they don't notify anyone when an alert fires.", fr: "Les classeurs et les tableaux de bord visualisent les données ; ils n'avertissent personne lorsqu'une alerte se déclenche." }
    d: { en: "Smart detection analyzes Application Insights telemetry of web apps; it doesn't route the notifications of existing rules.", fr: "La détection intelligente analyse la télémétrie Application Insights des applications web ; elle n'achemine pas les notifications des règles existantes." }
references:
  - title: Create alerts for Azure Cosmos DB using Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/create-alerts
  - title: Create or edit a metric alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-create-metric-alert-rule
