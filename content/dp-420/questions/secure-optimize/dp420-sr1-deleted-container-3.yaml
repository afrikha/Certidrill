stem:
  en: You migrate the account to continuous backup without specifying a tier.
  fr: Vous migrez le compte vers la sauvegarde continue sans spécifier de niveau.
body:
  solution:
    en: |
      You run the following command:

      ```bash
      az cosmosdb update \
          --resource-group rg-wg \
          --name cosmos-wg \
          --backup-policy-type Continuous
      ```
    fr: |
      Vous exécutez la commande suivante :

      ```bash
      az cosmosdb update \
          --resource-group rg-wg \
          --name cosmos-wg \
          --backup-policy-type Continuous
      ```
answer: { value: false }
explanation:
  correct:
    en: The migration enables self-service point-in-time restore, but when no tier is specified the account is migrated to the `Continuous30Days` tier. The 30-day tier bills backup storage per GB and per region every month, whereas the 7-day tier, which already covers the required window, has no backup storage charge, so backup storage costs are not minimized.
    fr: "La migration active la restauration à un instant dans le passé en libre-service, mais lorsqu'aucun niveau n'est spécifié, le compte est migré vers le niveau `Continuous30Days`. Le niveau de 30 jours facture chaque mois le stockage de sauvegarde par Go et par région, alors que le niveau de 7 jours, qui couvre déjà la fenêtre requise, n'entraîne aucun frais de stockage de sauvegarde : les coûts de stockage de sauvegarde ne sont donc pas réduits au minimum."
references:
  - title: Migrate From Periodic to Continuous Backup Mode - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/migrate-continuous-backup
  - title: Continuous Backup with Point-in-Time Restore - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
