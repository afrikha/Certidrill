id: dp420-2b-mr-dotnet-region
objective: "2.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account with multi-region writes in West Europe, North Europe and Sweden Central. A C# API that uses the .NET SDK v3 is deployed in North Europe.

    You need to configure the client to meet the following requirements:

    - The SDK orders the account regions by proximity to North Europe, and uses regions added to the account later without a redeployment.
    - Requests use the connection mode with the lowest latency.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions dans les régions West Europe, North Europe et Sweden Central. Une API C# qui utilise le SDK .NET v3 est déployée dans North Europe.

    Vous devez configurer le client pour répondre aux exigences suivantes :

    - Le SDK classe les régions du compte selon leur proximité avec North Europe, et utilise les régions ajoutées plus tard au compte sans redéploiement.
    - Les requêtes utilisent le mode de connexion dont la latence est la plus faible.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    CosmosClientOptions options = new CosmosClientOptions
    {
        [[region]] = Regions.NorthEurope,
        ConnectionMode = ConnectionMode.[[mode]]
    };

    CosmosClient client = new CosmosClient(endpoint, new DefaultAzureCredential(), options);
  slots:
    - id: region
      options:
        - { id: appregion, text: ApplicationRegion }
        - { id: appprefs, text: ApplicationPreferredRegions }
        - { id: appname, text: ApplicationName }
        - { id: preflocs, text: PreferredLocations }
    - id: mode
      options:
        - { id: direct, text: Direct }
        - { id: gateway, text: Gateway }
answer:
  values: { region: appregion, mode: direct }
explanation:
  correct:
    en: "`ApplicationRegion` takes the region where the application runs; the SDK then builds the preferred list from the account regions ordered by geo-proximity, including regions added later. Direct mode (TCP, the .NET SDK v3 default) uses long-lived connections to the replicas and gives the lowest latency."
    fr: "`ApplicationRegion` reçoit la région où s'exécute l'application ; le SDK construit alors la liste préférée à partir des régions du compte, classées par proximité géographique, y compris celles ajoutées plus tard. Le mode Direct (TCP, la valeur par défaut du SDK .NET v3) utilise des connexions longues vers les réplicas et offre la latence la plus faible."
  options:
    region: { en: "ApplicationPreferredRegions takes an ordered list that you maintain yourself, not a single region; ApplicationName only adds a suffix to the user agent; PreferredLocations belongs to the ConnectionPolicy of the legacy v2 SDK.", fr: "ApplicationPreferredRegions reçoit une liste ordonnée que vous maintenez vous-même, pas une région unique ; ApplicationName ajoute seulement un suffixe à l'agent utilisateur ; PreferredLocations appartient au ConnectionPolicy de l'ancien SDK v2." }
    mode: { en: "Gateway mode sends every request over HTTPS through the gateway, which adds a hop.", fr: "Le mode Gateway envoie chaque requête en HTTPS via la passerelle, ce qui ajoute un saut." }
references:
  - title: Configure multi-region writes in applications that use Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-multi-master
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
