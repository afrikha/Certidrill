id: dp420-2c-lat-client-fixes
objective: "2.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    An ASP.NET Core API hosted on Azure VMs in the same region as its Azure Cosmos DB account misses its latency objective for point reads. Server Side Latency Direct stays below 4 ms, and no request is throttled. A code review shows that the API:

    - creates a new `CosmosClient` for each incoming HTTP request
    - calls `container.ReadContainerAsync()` to check that the container exists before every item read

    Which two changes should you make to reduce the end-to-end latency? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une API ASP.NET Core hébergée sur des machines virtuelles Azure dans la même région que son compte Azure Cosmos DB ne respecte pas son objectif de latence pour les lectures ponctuelles. Server Side Latency Direct reste inférieure à 4 ms et aucune requête n'est limitée. Une revue de code montre que l'API :

    - crée un nouveau `CosmosClient` pour chaque requête HTTP entrante
    - appelle `container.ReadContainerAsync()` pour vérifier l'existence du conteneur avant chaque lecture d'élément

    Quelles sont les deux modifications à effectuer pour réduire la latence de bout en bout ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Register a single CosmosClient instance for the lifetime of the application.", fr: "Inscrire une instance unique de CosmosClient pour toute la durée de vie de l'application." } }
    - { id: b, text: { en: "Set ConnectionMode to Gateway in CosmosClientOptions.", fr: "Définir ConnectionMode sur Gateway dans CosmosClientOptions." } }
    - { id: c, text: { en: "Remove the ReadContainerAsync() call from the request path.", fr: "Supprimer l'appel ReadContainerAsync() du chemin de traitement des requêtes." } }
    - { id: d, text: { en: "Increase the provisioned throughput of the container.", fr: "Augmenter le débit provisionné du conteneur." } }
    - { id: e, text: { en: "Set ConsistencyLevel to Strong in CosmosClientOptions.", fr: "Définir ConsistencyLevel sur Strong dans CosmosClientOptions." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "A CosmosClient is thread-safe and manages connections and address caches efficiently, so you should use one instance per application lifetime; creating a client per request repeats the initialization and opens new connections every time. Calls such as ReadContainerAsync are metadata operations that add end-to-end latency, have no SLA and have their own limits; they belong at application startup, not before each item operation."
    fr: "Un CosmosClient est thread-safe et gère efficacement les connexions et les caches d'adresses : utilisez une seule instance pour toute la durée de vie de l'application. Créer un client par requête répète l'initialisation et ouvre de nouvelles connexions à chaque fois. Les appels comme ReadContainerAsync sont des opérations de métadonnées qui ajoutent de la latence de bout en bout, n'ont pas de SLA et ont leurs propres limites ; ils doivent être faits au démarrage de l'application, pas avant chaque opération sur un élément."
  options:
    b: { en: "Gateway mode adds a network hop; direct mode is preferred for latency.", fr: "Le mode passerelle ajoute un saut réseau ; le mode direct est préférable pour la latence." }
    d: { en: "No request is throttled, so more RU/s would not reduce latency.", fr: "Aucune requête n'est limitée : plus de RU/s ne réduirait pas la latence." }
    e: { en: "A stronger consistency level does not remove the client-side overhead and can only increase read latency and RU cost.", fr: "Un niveau de cohérence plus fort ne supprime pas la surcharge côté client et ne peut qu'augmenter la latence et le coût des lectures." }
references:
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
  - title: Diagnose and troubleshoot slow requests in Azure Cosmos DB .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-dotnet-sdk-slow-request
