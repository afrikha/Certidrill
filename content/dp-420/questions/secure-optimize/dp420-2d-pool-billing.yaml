id: dp420-2d-pool-billing
objective: "2.4.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has an Azure Cosmos DB fleetspace named **fs-eu** with throughput pooling. The pool has a minimum of 100,000 RU/s and a maximum of 400,000 RU/s, and its data regions are West Europe and North Europe.

    Which two statements describe how the pool of fs-eu is billed?

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove dispose d'un fleetspace Azure Cosmos DB nommé **fs-eu** avec un pool de débit. Le pool a un minimum de 100 000 RU/s et un maximum de 400 000 RU/s, et ses régions de données sont West Europe et North Europe.

    Quelles sont les deux affirmations qui décrivent la facturation du pool de fs-eu ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Each hour, the pool is billed at the average RU/s that it used across both regions.", fr: "Chaque heure, le pool est facturé à la moyenne des RU/s qu'il a utilisées dans les deux régions." } }
    - { id: b, text: { en: "Each hour, the pool is billed in each region at the highest RU/s it scaled to during that hour.", fr: "Chaque heure, le pool est facturé dans chaque région au plus haut niveau de RU/s atteint pendant cette heure." } }
    - { id: c, text: { en: "During an hour in which no account draws from the pool, the pool isn't billed.", fr: "Pendant une heure où aucun compte ne puise dans le pool, le pool n'est pas facturé." } }
    - { id: d, text: { en: "During an hour in which no account draws from the pool, each region is billed for 100,000 RU/s.", fr: "Pendant une heure où aucun compte ne puise dans le pool, chaque région est facturée pour 100 000 RU/s." } }
    - { id: e, text: { en: "The pool is billed only in the region where the fleet resource was created.", fr: "Le pool est facturé uniquement dans la région où la ressource de flotte a été créée." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: |
      Like autoscale, a pool is billed each hour at the highest RU/s it scaled to within that hour, in each region where the pool is available. An idle pool is billed at its minimum RU/s per region, here 100,000 RU/s in West Europe and 100,000 RU/s in North Europe.
    fr: |
      Comme la mise à l'échelle automatique, un pool est facturé chaque heure au plus haut niveau de RU/s atteint pendant cette heure, dans chaque région où le pool est disponible. Un pool inactif est facturé à son minimum de RU/s par région, ici 100 000 RU/s dans West Europe et 100 000 RU/s dans North Europe.
  options:
    a: { en: "Billing uses the highest RU/s reached in the hour, not an average, and it applies per region.", fr: "La facturation utilise le plus haut niveau de RU/s atteint dans l'heure, pas une moyenne, et s'applique par région." }
    c: { en: "An idle pool is still billed at its minimum RU/s in each region.", fr: "Un pool inactif reste facturé à son minimum de RU/s dans chaque région." }
    e: { en: "The fleet's region doesn't determine the regions of the accounts or of the pool; the pool is billed in each of its data regions.", fr: "La région de la flotte ne détermine ni les régions des comptes ni celles du pool ; le pool est facturé dans chacune de ses régions de données." }
references:
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
