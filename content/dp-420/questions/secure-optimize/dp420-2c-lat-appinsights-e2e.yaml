id: dp420-2c-lat-appinsights-e2e
objective: "2.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    An ASP.NET Core API uses the Azure Cosmos DB .NET SDK 3.45 (non-preview) and sends its telemetry to Application Insights.

    You need to view, for each incoming HTTP request, the end-to-end duration of every Azure Cosmos DB operation as observed by the API, with attributes such as the request charge and the regions contacted.

    What should you do?
  fr: |
    Une API ASP.NET Core utilise le SDK .NET Azure Cosmos DB 3.45 (version hors préversion) et envoie sa télémétrie à Application Insights.

    Vous devez afficher, pour chaque requête HTTP entrante, la durée de bout en bout de chaque opération Azure Cosmos DB telle que l'API l'observe, avec des attributs comme les frais de requête et les régions contactées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Open the Latency tab of Insights for the account and filter it on the container.", fr: "Ouvrir l'onglet Latency d'Insights pour le compte et le filtrer sur le conteneur." }
    - id: b
      text: { en: "Send DataPlaneRequests to Log Analytics and query DurationMs in CDBDataPlaneRequests.", fr: "Envoyer DataPlaneRequests à Log Analytics et interroger DurationMs dans CDBDataPlaneRequests." }
    - id: c
      text: { en: "Enable distributed tracing in the client and export the Azure.Cosmos.Operation source.", fr: "Activer le traçage distribué dans le client et exporter la source Azure.Cosmos.Operation." }
    - id: d
      text: { en: "Create a metric alert rule on Server Side Latency Direct for the account.", fr: "Créer une règle d'alerte de métrique sur Server Side Latency Direct pour le compte." }
answer: { optionId: c }
explanation:
  correct:
    en: "The .NET SDK supports distributed tracing with OpenTelemetry or Application Insights; in non-preview versions it is off by default and you enable it by setting `DisableDistributedTracing = false` in `CosmosClientTelemetryOptions`. Adding the `Azure.Cosmos.Operation` source to the trace provider produces client-side spans correlated with the HTTP request, with attributes such as `db.cosmosdb.request_charge` and `db.cosmosdb.regions_contacted`."
    fr: "Le SDK .NET prend en charge le traçage distribué avec OpenTelemetry ou Application Insights ; dans les versions hors préversion, il est désactivé par défaut et vous l'activez en définissant `DisableDistributedTracing = false` dans `CosmosClientTelemetryOptions`. Ajouter la source `Azure.Cosmos.Operation` au fournisseur de traces produit des étendues côté client corrélées à la requête HTTP, avec des attributs comme `db.cosmosdb.request_charge` et `db.cosmosdb.regions_contacted`."
  options:
    a: { en: "The Latency tab shows server-side latency and explicitly does not represent the end-to-end request latency.", fr: "L'onglet Latency affiche la latence côté serveur et ne représente explicitement pas la latence de bout en bout des requêtes." }
    b: { en: "DurationMs is the server-side execution time of each request; it excludes the network and client time.", fr: "DurationMs est le temps d'exécution côté serveur de chaque requête ; il exclut le temps réseau et client." }
    d: { en: "An alert rule notifies on a threshold; it doesn't show per-request durations, and the metric is server-side only.", fr: "Une règle d'alerte notifie sur un seuil ; elle n'affiche pas la durée de chaque requête, et la métrique est uniquement côté serveur." }
references:
  - title: Azure Cosmos DB SDK observability
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/sdk-observability
  - title: Azure Monitor integration with Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/insights-overview
