id: dp420-2b-mr-read-routing
objective: "2.2.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Northwind has an Azure Cosmos DB for NoSQL account named **cosmos-nw-store** with a single write region. The regions of the account are shown in the following table.

    A C# application uses the .NET SDK v3 with the following client options:

    ```csharp
    new CosmosClientOptions
    {
        ApplicationPreferredRegions = new List<string> { Regions.WestUS, Regions.NorthEurope }
    };
    ```

    Answer each prompt by selecting the region that serves the request.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-nw-store** avec une seule région d'écriture. Les régions du compte figurent dans le tableau suivant.

    Une application C# utilise le SDK .NET v3 avec les options de client suivantes :

    ```csharp
    new CosmosClientOptions
    {
        ApplicationPreferredRegions = new List<string> { Regions.WestUS, Regions.NorthEurope }
    };
    ```

    Répondez à chaque consigne en sélectionnant la région qui traite la requête.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "A point read while all regions are healthy", fr: "Une lecture ponctuelle alors que toutes les régions sont saines" }
    - id: p2
      text: { en: "An item upsert while all regions are healthy", fr: "Un upsert d'élément alors que toutes les régions sont saines" }
    - id: p3
      text: { en: "A query while West US is unavailable", fr: "Une requête alors que West US est indisponible" }
  grid:
    header: [{ en: "Region", fr: "Région" }, { en: "Role", fr: "Rôle" }, { en: "Failover priority", fr: "Priorité de basculement" }]
    rows:
      - [{ text: East US, area: eastus }, { text: { en: "Write", fr: "Écriture" } }, { text: "0" }]
      - [{ text: West US, area: westus }, { text: { en: "Read", fr: "Lecture" } }, { text: "1" }]
      - [{ text: North Europe, area: northeurope }, { text: { en: "Read", fr: "Lecture" } }, { text: "2" }]
      - [{ text: Southeast Asia, area: seasia }, { text: { en: "Read", fr: "Lecture" } }, { text: "3" }]
answer:
  values: { p1: westus, p2: eastus, p3: northeurope }
explanation:
  correct:
    en: |
      Reads go to the first available region of the preferred list (West US), and fall down the list to North Europe when West US is unavailable; the failover priorities of the account don't change this client-side order. In a single-write-region account, the SDK sends every write to the current write region, East US, whatever the preferred list says.
    fr: |
      Les lectures vont vers la première région disponible de la liste préférée (West US) et descendent dans la liste jusqu'à North Europe quand West US est indisponible ; les priorités de basculement du compte ne modifient pas cet ordre côté client. Dans un compte à une seule région d'écriture, le SDK envoie chaque écriture à la région d'écriture actuelle, East US, quelle que soit la liste préférée.
references:
  - title: "Tutorial: Set up global distribution using Azure Cosmos DB for NoSQL"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/tutorial-global-distribution
  - title: CosmosClientOptions.ApplicationPreferredRegions Property
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions.applicationpreferredregions?view=azure-dotnet
