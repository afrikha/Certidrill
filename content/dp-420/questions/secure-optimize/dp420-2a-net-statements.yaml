id: dp420-2a-net-statements
objective: "2.1.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **northwind-catalog** is configured with **Selected networks**. Its IP firewall allows 198.51.100.0/24, and a virtual network rule allows the subnet **VNet1/snet-web**, which has the Microsoft.AzureCosmosDB service endpoint enabled. VNet1 is peered with VNet2.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **northwind-catalog** est configuré avec **Selected networks**. Son pare-feu IP autorise 198.51.100.0/24, et une règle de réseau virtuel autorise le sous-réseau **VNet1/snet-web**, sur lequel le point de terminaison de service Microsoft.AzureCosmosDB est activé. VNet1 est relié à VNet2 par peering.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A virtual machine in VNet2 can access the account because VNet2 is peered with VNet1.
        fr: Une machine virtuelle de VNet2 peut accéder au compte, car VNet2 est relié à VNet1 par peering.
    - id: s2
      text:
        en: A request from a computer whose public IP address is 198.51.100.20 is rejected if it does not carry a valid authorization token.
        fr: Une requête provenant d'un ordinateur dont l'adresse IP publique est 198.51.100.20 est rejetée si elle ne présente pas de jeton d'autorisation valide.
    - id: s3
      text:
        en: A change to the IP firewall rules can take up to 15 minutes to take effect.
        fr: Une modification des règles du pare-feu IP peut prendre jusqu'à 15 minutes pour être appliquée.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Peered virtual networks have no access by default: their subnets must be added to the account explicitly. The IP firewall is a second layer of protection; even an allowed IP address must still present a valid authorization token. Firewall changes can take up to 15 minutes to propagate, and behavior can be inconsistent during that time.
    fr: |
      Les réseaux virtuels reliés par peering n'ont aucun accès par défaut : leurs sous-réseaux doivent être ajoutés explicitement au compte. Le pare-feu IP est une deuxième couche de protection ; même une adresse IP autorisée doit présenter un jeton d'autorisation valide. Les modifications du pare-feu peuvent prendre jusqu'à 15 minutes pour se propager, et le comportement peut être incohérent pendant ce délai.
references:
  - title: Configure access to Azure Cosmos DB from virtual networks
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-vnet-service-endpoint
  - title: Configure IP firewall for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-firewall
