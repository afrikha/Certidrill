id: dp420-2a-auth-key-rotation-order
objective: "2.1.1"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    An application named **App1** connects to an Azure Cosmos DB for NoSQL account named **tailspin-db** by using the **primary key**. No other application uses the account keys.

    You need to regenerate both the primary key and the secondary key. App1 must not experience any authentication failure during the operation.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Une application nommée **App1** se connecte à un compte Azure Cosmos DB for NoSQL nommé **tailspin-db** avec la **clé primaire**. Aucune autre application n'utilise les clés du compte.

    Vous devez régénérer la clé primaire et la clé secondaire. App1 ne doit subir aucun échec d'authentification pendant l'opération.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: regsec, text: { en: "Regenerate the secondary key.", fr: "Régénérer la clé secondaire." } }
    - { id: validate, text: { en: "Validate that the new secondary key works against the account.", fr: "Vérifier que la nouvelle clé secondaire fonctionne avec le compte." } }
    - { id: switch, text: { en: "Update App1 to use the secondary key.", fr: "Mettre à jour App1 pour qu'elle utilise la clé secondaire." } }
    - { id: regpri, text: { en: "Regenerate the primary key.", fr: "Régénérer la clé primaire." } }
    - { id: regro, text: { en: "Regenerate the primary read-only key.", fr: "Régénérer la clé primaire en lecture seule." } }
    - { id: local, text: { en: "Set disableLocalAuth to true on the account.", fr: "Définir disableLocalAuth sur true sur le compte." } }
answer:
  sequence: [ regsec, validate, switch, regpri ]
explanation:
  correct:
    en: |
      Because App1 uses the primary key, you first regenerate the unused secondary key, check that it works, and move App1 to it. Only then can you regenerate the primary key, which App1 no longer uses. Regenerating the primary key first would break App1 immediately.
    fr: |
      Comme App1 utilise la clé primaire, vous régénérez d'abord la clé secondaire inutilisée, vérifiez qu'elle fonctionne et basculez App1 dessus. Ce n'est qu'ensuite que vous régénérez la clé primaire, qu'App1 n'utilise plus. Régénérer d'abord la clé primaire casserait immédiatement App1.
  options:
    regro: { en: "Read-only keys are separate keys; App1 uses the read-write primary key.", fr: "Les clés en lecture seule sont des clés distinctes ; App1 utilise la clé primaire en lecture-écriture." }
    local: { en: "Disabling local authentication would reject every key, including the one App1 uses.", fr: "Désactiver l'authentification locale rejetterait toutes les clés, y compris celle qu'utilise App1." }
references:
  - title: Rotate keys for Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-rotate-keys
