id: dp420-2d-log-azurediagnostics-mode
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum created a diagnostic setting on an Azure Cosmos DB for NoSQL account to send the **DataPlaneRequests** category to a Log Analytics workspace.

    The following query fails because the table can't be found:

    ```kusto
    CDBDataPlaneRequests
    | summarize sum(RequestCharge) by OperationName
    ```

    The workspace contains rows in the `AzureDiagnostics` table that have columns such as `requestCharge_s` and `activityId_g`. You need new log data to be written to the table that the query uses.

    What should you do?
  fr: |
    Adatum a créé un paramètre de diagnostic sur un compte Azure Cosmos DB for NoSQL pour envoyer la catégorie **DataPlaneRequests** vers un espace de travail Log Analytics.

    La requête suivante échoue, car la table est introuvable :

    ```kusto
    CDBDataPlaneRequests
    | summarize sum(RequestCharge) by OperationName
    ```

    L'espace de travail contient des lignes dans la table `AzureDiagnostics` qui ont des colonnes comme `requestCharge_s` et `activityId_g`. Vous devez faire en sorte que les nouvelles données de journal soient écrites dans la table utilisée par la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable the Diagnostics full-text query feature on the account.", fr: "Activer la fonctionnalité Diagnostics full-text query sur le compte." } }
    - { id: b, text: { en: "Create a data collection rule that uses the Azure Monitor Agent.", fr: "Créer une règle de collecte de données qui utilise l'agent Azure Monitor." } }
    - { id: c, text: { en: "Add the QueryRuntimeStatistics category to the diagnostic setting.", fr: "Ajouter la catégorie QueryRuntimeStatistics au paramètre de diagnostic." } }
    - { id: d, text: { en: "Change the destination table of the diagnostic setting to Resource specific.", fr: "Changer la table de destination du paramètre de diagnostic en Spécifique à la ressource." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The setting uses the legacy Azure diagnostics mode, which writes every category to the shared AzureDiagnostics table with suffixed columns. In Resource specific mode, recommended for every API except Table, each category goes to its own CDB table, such as CDBDataPlaneRequests with typed columns like RequestCharge.
    fr: |
      Le paramètre utilise l'ancien mode Diagnostics Azure, qui écrit toutes les catégories dans la table partagée AzureDiagnostics avec des colonnes suffixées. En mode Spécifique à la ressource, recommandé pour toutes les API sauf Table, chaque catégorie va dans sa propre table CDB, comme CDBDataPlaneRequests avec des colonnes typées telles que RequestCharge.
  options:
    a: { en: "Full-text query reveals query text; it doesn't change the destination table.", fr: "Full-text query révèle le texte des requêtes ; il ne change pas la table de destination." }
    b: { en: "Data collection rules and the Azure Monitor Agent collect data from machines; Azure Cosmos DB resource logs use diagnostic settings.", fr: "Les règles de collecte de données et l'agent Azure Monitor collectent des données sur des machines ; les journaux de ressources Azure Cosmos DB utilisent des paramètres de diagnostic." }
    c: { en: "Another category in the same mode also goes to AzureDiagnostics.", fr: "Une autre catégorie dans le même mode va aussi dans AzureDiagnostics." }
references:
  - title: Monitor Data using Diagnostic Settings - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-resource-logs
  - title: Troubleshoot issues with diagnostics queries - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-logs-basic-queries
