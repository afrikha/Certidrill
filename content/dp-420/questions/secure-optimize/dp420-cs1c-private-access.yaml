id: dp420-cs1c-private-access
objective: "2.1.3"
type: single
caseStudy: dp420-cs1c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to configure cosmos-trey-labmind to meet the network requirement. What should you do?
  fr: |
    Vous devez configurer cosmos-trey-labmind pour satisfaire l'exigence relative au réseau. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable a service endpoint for Azure Cosmos DB on the AKS subnets and add virtual network rules to the firewall of the account.", fr: "Activer un point de terminaison de service pour Azure Cosmos DB sur les sous-réseaux AKS et ajouter des règles de réseau virtuel au pare-feu du compte." } }
    - { id: b, text: { en: "Add IP firewall rules for the public IP addresses of the laboratories and of the AKS clusters.", fr: "Ajouter des règles de pare-feu IP pour les adresses IP publiques des laboratoires et des clusters AKS." } }
    - { id: c, text: { en: "Create private endpoints for the account in the virtual networks and set public network access to Disabled.", fr: "Créer des points de terminaison privés pour le compte dans les réseaux virtuels et définir l'accès au réseau public sur Disabled." } }
    - { id: d, text: { en: "Keep public network access enabled and assign data plane roles only to the identities of the API and of the researchers.", fr: "Conserver l'accès au réseau public et attribuer des rôles de plan de données uniquement aux identités de l'API et des chercheurs." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A private endpoint gives the account a private IP address in a virtual network; it is reachable from that network, from peered networks and from on premises over ExpressRoute private peering. Setting public network access to Disabled blocks all public traffic, even traffic that IP or virtual network rules would allow.
    fr: |
      Un point de terminaison privé donne au compte une adresse IP privée dans un réseau virtuel ; il est accessible depuis ce réseau, depuis les réseaux connectés par peering et depuis l'environnement local via le peering privé ExpressRoute. Définir l'accès au réseau public sur Disabled bloque tout le trafic public, même celui que des règles IP ou de réseau virtuel autoriseraient.
  options:
    a: { en: "A service endpoint keeps the public endpoint of the account and only lets traffic from the selected Azure subnets through; it does not give the on-premises notebooks a private path over ExpressRoute.", fr: "Un point de terminaison de service conserve le point de terminaison public du compte et laisse seulement passer le trafic des sous-réseaux Azure sélectionnés ; il ne donne pas aux notebooks locaux un chemin privé via ExpressRoute." }
    b: { en: "IP firewall rules keep the account on its public endpoint, reachable from the internet by the allowed addresses.", fr: "Les règles de pare-feu IP laissent le compte sur son point de terminaison public, accessible depuis Internet par les adresses autorisées." }
    d: { en: "Role assignments control who can access data, not from which network; the account would stay reachable from the internet.", fr: "Les attributions de rôles contrôlent qui peut accéder aux données, pas depuis quel réseau ; le compte resterait accessible depuis Internet." }
references:
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
