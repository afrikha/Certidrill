id: dp420-cs3a-partition-failover
objective: "2.2.3"
type: multi
caseStudy: dp420-cs3a-alpine-ski-house
difficulty: 3
status: draft
stem:
  en: |
    You need to meet the availability requirements for cosmos-ash-prod.

    Which three actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez satisfaire les exigences de disponibilité pour cosmos-ash-prod.

    Quelles sont les trois actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 3
  options:
    - id: a
      text: { en: "Upgrade the PassPulse services to version 3.62.0 or later of the .NET SDK.", fr: "Mettre à niveau les services PassPulse vers la version 3.62.0 ou ultérieure du SDK .NET." }
    - id: b
      text: { en: "Enable multi-region writes on cosmos-ash-prod.", fr: "Activer les écritures multirégions sur cosmos-ash-prod." }
    - id: c
      text: { en: "Change the default consistency level of cosmos-ash-prod to Session.", fr: "Changer le niveau de cohérence par défaut de cosmos-ash-prod en Session." }
    - id: d
      text: { en: "Enable service-managed failover and set the failover priority of the read regions.", fr: "Activer le basculement géré par le service et définir la priorité de basculement des régions de lecture." }
    - id: e
      text: { en: "Enable Per-partition automatic failover on the Features page of cosmos-ash-prod.", fr: "Activer Per-partition automatic failover dans la page Features de cosmos-ash-prod." }
    - id: f
      text: { en: "Enable availability zones in the Switzerland North region.", fr: "Activer les zones de disponibilité dans la région Switzerland North." }
answer: { optionIds: [a, c, e] }
explanation:
  correct:
    en: "Per-partition automatic failover (PPAF) fails over only the affected partitions of a single-write-region account that has at least one read region, which cosmos-ash-prod already has. PPAF supports the Strong, Session, Consistent prefix and Eventual levels but not Bounded staleness, so the default level must change; Session still guarantees read-your-own-writes. Every application instance must run a supported SDK (.NET 3.62.0 or later) before PPAF is enabled on the Features page, otherwise writes can fail during a partition-level failover."
    fr: "Le basculement automatique par partition (PPAF) fait basculer uniquement les partitions concernées d'un compte à une seule région d'écriture qui possède au moins une région de lecture, ce qui est déjà le cas de cosmos-ash-prod. PPAF prend en charge les niveaux Strong, Session, Consistent prefix et Eventual, mais pas Bounded staleness : le niveau par défaut doit donc changer, et Session garantit toujours la lecture de ses propres écritures. Toutes les instances de l'application doivent utiliser un SDK pris en charge (.NET 3.62.0 ou ultérieur) avant l'activation de PPAF dans la page Features, sinon des écritures peuvent échouer pendant un basculement au niveau partition."
  options:
    b:
      en: "PPAF is documented for accounts with a single write region. Multi-region writes are not needed, and they would also prevent Fabric mirroring, which does not support accounts with multiple write regions."
      fr: "PPAF est documenté pour les comptes à une seule région d'écriture. Les écritures multirégions ne sont pas nécessaires, et elles empêcheraient en outre la mise en miroir dans Fabric, qui ne prend pas en charge les comptes à plusieurs régions d'écriture."
    d:
      en: "Service-managed failover moves the write region of the whole account during a regional outage, which is what requirement 6 must avoid."
      fr: "Le basculement géré par le service déplace la région d'écriture de l'ensemble du compte lors d'une panne régionale, ce que l'exigence 6 doit justement éviter."
    f:
      en: "Availability zones protect against the loss of a datacenter inside Switzerland North; they do not move writes of a partition to another region."
      fr: "Les zones de disponibilité protègent contre la perte d'un centre de données dans Switzerland North ; elles ne déplacent pas les écritures d'une partition vers une autre région."
references:
  - title: Configure per-partition automatic failover - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
