id: dp420-sr2-alert-throttling-2
objective: "2.3.5"
type: series_yesno
series: dp420-sr2-alert-throttling
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You create a metric alert rule on Total Requests filtered on status code 429.
  fr: |
    Vous créez une règle d'alerte de métrique sur Total Requests filtrée sur le code d'état 429.
body:
  solution:
    en: |
      You create a metric alert rule on cosmos-tail that uses the **Total Requests** signal, filtered on the dimensions **CollectionName** = `orders` and **StatusCode** = `429`, with the aggregation **Count**, the operator **Greater than** and a threshold of **100**, evaluated over 5 minutes. The rule uses an action group that emails the operations team.
    fr: |
      Vous créez sur cosmos-tail une règle d'alerte de métrique qui utilise le signal **Total Requests**, filtré sur les dimensions **CollectionName** = `orders` et **StatusCode** = `429`, avec l'agrégation **Count**, l'opérateur **Greater than** et un seuil de **100**, évaluée sur 5 minutes. La règle utilise un groupe d'actions qui envoie un e-mail à l'équipe des opérations.
answer: { value: true }
explanation:
  correct:
    en: |
      Total Requests is a platform metric that counts requests and exposes the CollectionName and StatusCode dimensions. Filtering on `orders` and `429` counts only the rate-limited requests to that container, and the action group sends the email. Platform metrics need no diagnostic setting.
    fr: |
      Total Requests est une métrique de plateforme qui compte les requêtes et expose les dimensions CollectionName et StatusCode. Le filtre sur `orders` et `429` ne compte que les requêtes de ce conteneur limitées en débit, et le groupe d'actions envoie l'e-mail. Les métriques de plateforme ne nécessitent aucun paramètre de diagnostic.
references:
