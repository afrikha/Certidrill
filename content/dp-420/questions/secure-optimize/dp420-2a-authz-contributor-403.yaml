id: dp420-2a-authz-contributor-403
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A function app reads items from an Azure Cosmos DB for NoSQL account named **proseware-events** by using its managed identity and Microsoft Entra authentication. You assigned the Azure RBAC **Contributor** role on the account to the managed identity.

    Every read fails with 403 Forbidden. You need the function app to read items and run queries. The solution must follow the principle of least privilege.

    What should you do?
  fr: |
    Une application de fonction lit des éléments dans un compte Azure Cosmos DB for NoSQL nommé **proseware-events** avec son identité managée et l'authentification Microsoft Entra. Vous avez attribué à l'identité managée le rôle Azure RBAC **Contributor** sur le compte.

    Toutes les lectures échouent avec l'erreur 403 Forbidden. L'application de fonction doit pouvoir lire des éléments et exécuter des requêtes. La solution doit respecter le principe du moindre privilège.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the Contributor role assignment with an Owner role assignment on the account.", fr: "Remplacer l'attribution du rôle Contributor par une attribution du rôle Owner sur le compte." } }
    - { id: b, text: { en: "Add a Cosmos DB Account Reader Role assignment for the managed identity on the account.", fr: "Ajouter une attribution du rôle Cosmos DB Account Reader Role pour l'identité managée sur le compte." } }
    - { id: c, text: { en: "Create a data plane role assignment of Cosmos DB Built-in Data Reader for the managed identity.", fr: "Créer une attribution de rôle du plan de données Cosmos DB Built-in Data Reader pour l'identité managée." } }
    - { id: d, text: { en: "Create a data plane role assignment of Cosmos DB Built-in Data Contributor for the managed identity.", fr: "Créer une attribution de rôle du plan de données Cosmos DB Built-in Data Contributor pour l'identité managée." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Azure RBAC roles such as Contributor act on the control plane only. Reading items with a Microsoft Entra identity requires a native data plane role, and Built-in Data Reader grants point reads, queries and change feed reads without write access.
    fr: |
      Les rôles Azure RBAC comme Contributor n'agissent que sur le plan de contrôle. Lire des éléments avec une identité Microsoft Entra nécessite un rôle natif du plan de données, et Built-in Data Reader accorde les lectures ponctuelles, les requêtes et la lecture du flux de modification sans accès en écriture.
  options:
    a: { en: "Owner is also a control plane role; it adds access management but no data plane access.", fr: "Owner est aussi un rôle du plan de contrôle ; il ajoute la gestion des accès mais aucun accès au plan de données." }
    b: { en: "Cosmos DB Account Reader Role is a control plane role; it does not authorize Microsoft Entra data requests.", fr: "Cosmos DB Account Reader Role est un rôle du plan de contrôle ; il n'autorise pas les requêtes de données Microsoft Entra." }
    d: { en: "Built-in Data Contributor would work but also grants writes, which is more than the function app needs.", fr: "Built-in Data Contributor fonctionnerait, mais il accorde aussi les écritures, ce qui dépasse les besoins de l'application de fonction." }
references:
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
