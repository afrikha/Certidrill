id: dp420-2b-bk-migrate-tier
objective: "2.2.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account named **cosmos-adatum-crm** that uses periodic backup mode.

    You need to enable self-service point-in-time restore for the account. Restores never need to go back more than seven days, and the solution must minimize backup storage costs.

    How should you complete the Azure CLI command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-adatum-crm** qui utilise le mode de sauvegarde périodique.

    Vous devez activer la restauration à un instant dans le passé en libre-service pour le compte. Les restaurations n'ont jamais besoin de remonter à plus de sept jours, et la solution doit réduire au minimum les coûts de stockage des sauvegardes.

    Comment devez-vous compléter la commande Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb update \
      --resource-group rg-crm \
      --name cosmos-adatum-crm \
      --backup-policy-type [[type]] \
      --continuous-tier [[tier]]
  slots:
    - id: type
      options:
        - { id: cont, text: Continuous }
        - { id: per, text: Periodic }
        - { id: pit, text: PointInTime }
        - { id: rest, text: Restore }
    - id: tier
      options:
        - { id: d7, text: Continuous7Days }
        - { id: d30, text: Continuous30Days }
        - { id: days7, text: 7Days }
answer:
  values: { type: cont, tier: d7 }
explanation:
  correct:
    en: "`az cosmosdb update --backup-policy-type Continuous` migrates the account from periodic to continuous backup mode, which provides self-service point-in-time restore. Without `--continuous-tier`, the account migrates to `Continuous30Days`; `Continuous7Days` covers the seven-day window and has no backup storage charge."
    fr: "`az cosmosdb update --backup-policy-type Continuous` fait passer le compte du mode de sauvegarde périodique au mode continu, qui offre la restauration à un instant dans le passé en libre-service. Sans `--continuous-tier`, le compte passe au niveau `Continuous30Days` ; `Continuous7Days` couvre la fenêtre de sept jours et n'entraîne aucun coût de stockage des sauvegardes."
  options:
    pit: { en: "PointInTime is a restore mode used in the restore parameters of an ARM template, not a backup policy type.", fr: "PointInTime est un mode de restauration utilisé dans les paramètres de restauration d'un modèle ARM, pas un type de stratégie de sauvegarde." }
    rest: { en: "Restore is a create mode for a new account restored from a backup, not a backup policy type.", fr: "Restore est un mode de création d'un nouveau compte restauré à partir d'une sauvegarde, pas un type de stratégie de sauvegarde." }
    d30: { en: "The 30-day tier is billed for backup storage, which doesn't minimize cost.", fr: "Le niveau 30 jours est facturé pour le stockage des sauvegardes, ce qui ne réduit pas les coûts au minimum." }
references:
  - title: Migrate from periodic to continuous backup mode
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/migrate-continuous-backup
  - title: az cosmosdb
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb
