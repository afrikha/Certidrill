id: dp420-2c-ix-production-usage
objective: "2.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind runs about 2,000 different queries against its Azure Cosmos DB for NoSQL account. A developer proposes to set `PopulateIndexMetrics` to `true` permanently on every production query so that the team can spot expensive queries and missing indexes.

    You need to recommend an approach that follows Microsoft guidance.

    What should you recommend?
  fr: |
    Northwind exécute environ 2 000 requêtes différentes sur son compte Azure Cosmos DB for NoSQL. Un développeur propose de définir `PopulateIndexMetrics` sur `true` de façon permanente pour chaque requête de production, afin que l'équipe repère les requêtes coûteuses et les index manquants.

    Vous devez recommander une approche conforme aux recommandations de Microsoft.

    Que devez-vous recommander ?
body:
  options:
    - id: a
      text: { en: "Accept the proposal, because index metrics are computed at no cost for the queries.", fr: "Accepter la proposition, car les métriques d'index sont calculées sans aucun coût pour les requêtes." }
    - id: b
      text: { en: "Find expensive queries with diagnostic logs, then enable index metrics only to troubleshoot them.", fr: "Repérer les requêtes coûteuses avec les journaux de diagnostic, puis activer les métriques d'index uniquement pour les dépanner." }
    - id: c
      text: { en: "Enable index metrics only on point reads, which represent most of the traffic.", fr: "Activer les métriques d'index uniquement sur les lectures ponctuelles, qui représentent l'essentiel du trafic." }
    - id: d
      text: { en: "Monitor the Index Usage metric of each container to find expensive queries.", fr: "Surveiller la métrique Index Usage de chaque conteneur pour repérer les requêtes coûteuses." }
answer: { optionId: b }
explanation:
  correct:
    en: "Index metrics incur overhead and are recommended only for troubleshooting query performance; as long as the queries and the indexing policy don't change, the metrics are unlikely to change. To identify expensive queries, Microsoft recommends monitoring query RU charge and latency with diagnostic logs, then using index metrics on the queries you need to tune."
    fr: "Les métriques d'index entraînent une surcharge et ne sont recommandées que pour dépanner les performances des requêtes ; tant que les requêtes et la stratégie d'indexation ne changent pas, ces métriques ont peu de chances de changer. Pour identifier les requêtes coûteuses, Microsoft recommande de surveiller les frais en RU et la latence des requêtes avec les journaux de diagnostic, puis d'utiliser les métriques d'index sur les requêtes à optimiser."
  options:
    a: { en: "Enabling index metrics incurs overhead, so it should be done only while debugging slow queries.", fr: "L'activation des métriques d'index entraîne une surcharge : elle ne doit être faite que pour déboguer des requêtes lentes." }
    c: { en: "Index metrics are a query option; point reads do not use the query engine's index selection.", fr: "Les métriques d'index sont une option de requête ; les lectures ponctuelles ne passent pas par la sélection d'index du moteur de requête." }
    d: { en: "Index Usage reports the storage size of the index, not the cost of individual queries.", fr: "Index Usage indique la taille de stockage de l'index, pas le coût des requêtes individuelles." }
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
