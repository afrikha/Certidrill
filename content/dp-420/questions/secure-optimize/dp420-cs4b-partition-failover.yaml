id: dp420-cs4b-partition-failover
objective: "2.2.3"
type: multi
caseStudy: dp420-cs4b-relecloud-tickets
difficulty: 2
status: draft
stem:
  en: |
    You need to configure cosmos-relecloud and the API to meet the availability requirement and the requirement that a seat is never sold twice.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez configurer cosmos-relecloud et l'API pour satisfaire l'exigence de disponibilité et l'exigence selon laquelle une place n'est jamais vendue deux fois.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable multi-region writes on the account", fr: "Activer les écritures multirégions sur le compte" } }
    - { id: b, text: { en: "Upgrade every instance of the API to Microsoft.Azure.Cosmos 3.62.0 or later", fr: "Mettre à niveau chaque instance de l'API vers Microsoft.Azure.Cosmos 3.62.0 ou version ultérieure" } }
    - { id: c, text: { en: "Enable service-managed failover on the account", fr: "Activer le basculement géré par le service sur le compte" } }
    - { id: d, text: { en: "Enable per-partition automatic failover on the account", fr: "Activer le basculement automatique par partition sur le compte" } }
    - { id: e, text: { en: "Change the default consistency level to Bounded staleness", fr: "Changer le niveau de cohérence par défaut en Bounded staleness" } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: Per-partition automatic failover (PPAF) fails over only the affected partitions of a single-write region account that has at least one read region, which cosmos-relecloud already has with Session consistency. The application must use an SDK that implements PPAF (.NET SDK 3.62.0 or later) on every instance before you enable it; the API currently uses 3.58.0. Keeping a single write region avoids write conflicts.
    fr: Le basculement automatique par partition (PPAF) ne bascule que les partitions concernées d'un compte à une seule région d'écriture qui possède au moins une région de lecture, ce qui est déjà le cas de cosmos-relecloud avec la cohérence Session. L'application doit utiliser un SDK qui implémente le PPAF (SDK .NET 3.62.0 ou version ultérieure) sur chaque instance avant de l'activer ; l'API utilise actuellement la version 3.58.0. Conserver une seule région d'écriture évite les conflits d'écriture.
  options:
    a: { en: "Multi-region writes allow concurrent writes in two regions that are resolved by conflict resolution, so a seat could be sold twice; mirroring to Fabric also doesn't support multiple write regions.", fr: "Les écritures multirégions autorisent des écritures simultanées dans deux régions, résolues par la résolution des conflits : une place pourrait être vendue deux fois ; de plus, la mise en miroir vers Fabric ne prend pas en charge plusieurs régions d'écriture." }
    c: { en: "Service-managed failover moves the whole account to another region, which the requirement excludes.", fr: "Le basculement géré par le service déplace l'ensemble du compte vers une autre région, ce que l'exigence exclut." }
    e: { en: "Bounded staleness is not currently supported by per-partition automatic failover, and changing consistency does not provide failover.", fr: "Bounded staleness n'est pas encore pris en charge par le basculement automatique par partition, et changer la cohérence n'apporte aucun basculement." }
references:
  - title: Configure per-partition automatic failover - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-per-partition-automatic-failover
  - title: Microsoft Fabric Mirrored Databases From Azure Cosmos DB - Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
