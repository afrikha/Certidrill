id: dp420-2a-authz-custom-role-json
objective: "2.1.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an ingestion service that writes telemetry to an Azure Cosmos DB for NoSQL account named **fabrikam-telemetry** by using Microsoft Entra authentication. The service calls only `CreateItemAsync` and `UpsertItemAsync`.

    You need to create a custom data plane role definition for the service. The service must not be able to read, replace, delete or query items. The solution must follow the principle of least privilege.

    How should you complete the role definition? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam dispose d'un service d'ingestion qui écrit des données de télémétrie dans un compte Azure Cosmos DB for NoSQL nommé **fabrikam-telemetry** avec l'authentification Microsoft Entra. Le service appelle uniquement `CreateItemAsync` et `UpsertItemAsync`.

    Vous devez créer une définition de rôle personnalisée du plan de données pour le service. Le service ne doit pas pouvoir lire, remplacer, supprimer ni interroger des éléments. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous compléter la définition de rôle ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "RoleName": "TelemetryWriter",
      "Type": "CustomRole",
      "AssignableScopes": [ "/" ],
      "Permissions": [
        {
          "[[key]]": [
            "[[meta]]",
            "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/create",
            "[[write]]"
          ]
        }
      ]
    }
  slots:
    - id: key
      options:
        - { id: data, text: "DataActions" }
        - { id: notdata, text: "NotDataActions" }
        - { id: actions, text: "Actions" }
    - id: meta
      options:
        - { id: rm, text: "Microsoft.DocumentDB/databaseAccounts/readMetadata" }
        - { id: listkeys, text: "Microsoft.DocumentDB/databaseAccounts/listKeys/action" }
        - { id: rok, text: "Microsoft.DocumentDB/databaseAccounts/readonlykeys/action" }
    - id: write
      options:
        - { id: upsert, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/upsert" }
        - { id: itemsall, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/*" }
        - { id: replace, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/replace" }
        - { id: contall, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/*" }
answer:
  values: { key: data, meta: rm, write: upsert }
explanation:
  correct:
    en: |
      A native data plane role lists the allowed operations in `DataActions`; anything not listed is excluded. `readMetadata` is required whenever an SDK accesses the account, and `items/create` plus `items/upsert` cover the two calls the service makes, without read, replace, delete or query rights.
    fr: |
      Un rôle natif du plan de données liste les opérations autorisées dans `DataActions` ; tout ce qui n'est pas listé est exclu. `readMetadata` est obligatoire dès qu'un SDK accède au compte, et `items/create` plus `items/upsert` couvrent les deux appels du service, sans droit de lecture, de remplacement, de suppression ni de requête.
  options:
    notdata: { en: "Native data plane RBAC does not support notDataActions.", fr: "Le RBAC natif du plan de données ne prend pas en charge notDataActions." }
    actions: { en: "Actions holds control plane operations; data plane roles use DataActions.", fr: "Actions contient des opérations du plan de contrôle ; les rôles du plan de données utilisent DataActions." }
    listkeys: { en: "listKeys is a control plane action that returns the account keys.", fr: "listKeys est une action du plan de contrôle qui renvoie les clés du compte." }
    rok: { en: "readonlykeys is a control plane action that returns the read-only keys; it does not cover SDK metadata requests.", fr: "readonlykeys est une action du plan de contrôle qui renvoie les clés en lecture seule ; elle ne couvre pas les requêtes de métadonnées du SDK." }
    itemsall: { en: "items/* also grants read, replace and delete.", fr: "items/* accorde aussi la lecture, le remplacement et la suppression." }
    replace: { en: "UpsertItemAsync needs the upsert action; replace alone does not allow upserts and is not needed.", fr: "UpsertItemAsync nécessite l'action upsert ; replace seul n'autorise pas les upserts et n'est pas nécessaire." }
    contall: { en: "containers/* also grants queries, change feed reads and stored procedure execution.", fr: "containers/* accorde aussi les requêtes, la lecture du flux de modification et l'exécution de procédures stockées." }
references:
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
