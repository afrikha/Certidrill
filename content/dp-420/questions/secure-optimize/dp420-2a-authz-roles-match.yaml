id: dp420-2a-authz-roles-match
objective: "2.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Litware uses an Azure Cosmos DB for NoSQL account named **litware-crm** that is configured with continuous backup. Four identities need access, as described in the answer area.

    Which role should you assign to each identity? Each identity must receive only the permissions it needs. To answer, drag the appropriate roles to the correct identities. Each role may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware utilise un compte Azure Cosmos DB for NoSQL nommé **litware-crm** configuré avec la sauvegarde continue. Quatre identités ont besoin d'un accès, comme décrit dans la zone de réponse.

    Quel rôle devez-vous attribuer à chaque identité ? Chaque identité ne doit recevoir que les autorisations dont elle a besoin. Pour répondre, faites glisser les rôles appropriés vers les identités correspondantes. Chaque rôle peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: reader, text: "Cosmos DB Built-in Data Reader" }
    - { id: contrib, text: "Cosmos DB Built-in Data Contributor" }
    - { id: restore, text: "CosmosRestoreOperator" }
    - { id: docdb, text: "DocumentDB Account Contributor" }
    - { id: acctreader, text: "Cosmos DB Account Reader Role" }
    - { id: owner, text: "Owner" }
  targets:
    - id: api
      text: { en: "The CRM web API: reads, creates, updates and deletes items", fr: "L'API web CRM : lit, crée, met à jour et supprime des éléments" }
    - id: bi
      text: { en: "A reporting job: runs queries and reads the change feed only", fr: "Un travail de création de rapports : exécute uniquement des requêtes et lit le flux de modification" }
    - id: support
      text: { en: "A support engineer: submits point-in-time restores of the account", fr: "Un ingénieur du support : soumet des restaurations à un point dans le temps du compte" }
    - id: pipeline
      text: { en: "An automation runbook: regenerates the account keys every 30 days", fr: "Un runbook d'automatisation : régénère les clés du compte tous les 30 jours" }
answer:
  mapping: { api: contrib, bi: reader, support: restore, pipeline: docdb }
explanation:
  correct:
    en: |
      Built-in Data Contributor covers every item and container data operation, while Built-in Data Reader allows only metadata, point reads, queries and change feed reads. CosmosRestoreOperator can submit restores of an account that uses continuous backup. DocumentDB Account Contributor manages the account, including key regeneration; the Account Reader role cannot regenerate keys.
    fr: |
      Built-in Data Contributor couvre toutes les opérations de données sur les éléments et les conteneurs, tandis que Built-in Data Reader n'autorise que les métadonnées, les lectures ponctuelles, les requêtes et la lecture du flux de modification. CosmosRestoreOperator peut soumettre des restaurations d'un compte qui utilise la sauvegarde continue. DocumentDB Account Contributor gère le compte, y compris la régénération des clés ; le rôle Account Reader ne peut pas régénérer les clés.
  options:
    acctreader: { en: "Cosmos DB Account Reader Role is read-only on the control plane; it cannot regenerate keys.", fr: "Cosmos DB Account Reader Role est en lecture seule sur le plan de contrôle ; il ne peut pas régénérer les clés." }
    owner: { en: "Owner grants far more than any of these identities needs, including access management.", fr: "Owner accorde bien plus que ce dont ces identités ont besoin, y compris la gestion des accès." }
references:
  - title: Azure built-in roles for Databases
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
