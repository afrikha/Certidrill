id: dp420-2a-net-portal-access
objective: "2.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You restrict an Azure Cosmos DB for NoSQL account named **adatum-claims** to **Selected networks** and add the public IP ranges of the Adatum offices to the IP firewall. Since the change, developers cannot browse containers or query items in Data Explorer in the Azure portal.

    Which two actions can you perform to restore Data Explorer access in the portal? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous restreignez un compte Azure Cosmos DB for NoSQL nommé **adatum-claims** à **Selected networks** et ajoutez au pare-feu IP les plages IP publiques des bureaux d'Adatum. Depuis cette modification, les développeurs ne peuvent plus parcourir les conteneurs ni interroger les éléments dans l'Explorateur de données du portail Azure.

    Quelles sont les deux actions que vous pouvez effectuer pour rétablir l'accès à l'Explorateur de données dans le portail ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Select Add Azure Portal Middleware IPs in the Networking settings and save.", fr: "Sélectionner Add Azure Portal Middleware IPs dans les paramètres Networking, puis enregistrer." } }
    - { id: b, text: { en: "Add the AzurePortal service tag to the IP firewall and save.", fr: "Ajouter l'étiquette de service AzurePortal au pare-feu IP, puis enregistrer." } }
    - { id: c, text: { en: "Set the minimum TLS version of the account to TLS 1.2 and save.", fr: "Définir la version TLS minimale du compte sur TLS 1.2, puis enregistrer." } }
    - { id: d, text: { en: "Enable Accept connections from within public Azure datacenters and save.", fr: "Activer l'option Accept connections from within public Azure datacenters, puis enregistrer." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      Portal features such as Data Explorer need the IP addresses of the Azure portal middleware to be allowed: the Add Azure Portal Middleware IPs option adds the ones for your API. Accepting connections from within public Azure datacenters also allows portal access because the portal runs in Azure, but it opens the account much more widely.
    fr: |
      Les fonctionnalités du portail comme l'Explorateur de données nécessitent que les adresses IP de l'intergiciel (middleware) du portail Azure soient autorisées : l'option Add Azure Portal Middleware IPs ajoute celles de votre API. Accepter les connexions des centres de données Azure publics autorise aussi l'accès au portail, car le portail s'exécute dans Azure, mais ouvre le compte beaucoup plus largement.
  options:
    b: { en: "The middleware IPs are not available as a service tag, and the IP firewall accepts only IP addresses and CIDR ranges.", fr: "Les adresses IP de l'intergiciel ne sont pas disponibles sous forme d'étiquette de service, et le pare-feu IP n'accepte que des adresses IP et des plages CIDR." }
    c: { en: "The minimum TLS version is unrelated to the firewall; TLS 1.2 is already the minimum for every account.", fr: "La version TLS minimale n'a pas de rapport avec le pare-feu ; TLS 1.2 est déjà le minimum pour tous les comptes." }
references:
  - title: Configure IP firewall for Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-firewall
