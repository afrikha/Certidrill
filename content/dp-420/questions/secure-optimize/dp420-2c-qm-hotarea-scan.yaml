id: dp420-2c-qm-hotarea-scan
objective: "2.3.2"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    A query against a container named **products** takes about three seconds. The query filters on `ROUND(p.price) = 20`. You capture the query metrics of the first page, shown in the following table.

    Answer each prompt by selecting the appropriate metric.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une requête sur un conteneur nommé **products** dure environ trois secondes. Elle filtre sur `ROUND(p.price) = 20`. Vous capturez les métriques de requête de la première page, présentées dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant la métrique appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The metric that accounts for most of the server-side execution time", fr: "La métrique qui représente la plus grande partie du temps d'exécution côté serveur" }
    - id: p2
      text: { en: "The metric that directly shows the filter was not served by the index", fr: "La métrique qui montre directement que le filtre n'a pas été servi par l'index" }
  grid:
    header: [{ en: Metric, fr: Métrique }, { en: Value, fr: Valeur }]
    rows:
      - [{ text: Retrieved Document Count, area: retrieved }, { text: "35,410" }]
      - [{ text: Output Document Count, area: output }, { text: "4" }]
      - [{ text: Index Utilization, area: util }, { text: "0.00 %" }]
      - [{ text: Total Query Execution Time, area: total }, { text: "2,930.15 ms" }]
      - [{ text: Index Lookup Time, area: lookup }, { text: "0.02 ms" }]
      - [{ text: Document Load Time, area: load }, { text: "2,611.40 ms" }]
      - [{ text: Runtime Execution Time, area: runtime }, { text: "315.22 ms" }]
answer:
  values: { p1: load, p2: util }
explanation:
  correct:
    en: The total execution time (2,930 ms) is made of its components, and Document Load Time (2,611 ms) is by far the largest, because the engine loaded 35,410 items to return 4. Index Utilization at 0 % shows that no part of the filter was served by the index; mathematical system functions such as ROUND in a WHERE clause must load every item. Storing the computed value as a property (or a computed property) lets the filter use the index.
    fr: Le temps d'exécution total (2 930 ms) se décompose en plusieurs composantes, et Document Load Time (2 611 ms) est de loin la plus importante, car le moteur a chargé 35 410 éléments pour en renvoyer 4. Une Index Utilization de 0 % montre qu'aucune partie du filtre n'a été servie par l'index ; les fonctions système mathématiques comme ROUND dans une clause WHERE obligent à charger chaque élément. Stocker la valeur calculée comme propriété (ou propriété calculée) permet au filtre d'utiliser l'index.
  options:
    total: { en: "Total Query Execution Time is the sum of the components; the prompt asks which component dominates it.", fr: "Total Query Execution Time est la somme des composantes ; la consigne demande quelle composante domine." }
    retrieved: { en: "A high Retrieved Document Count suggests a scan, but Index Utilization is the metric that reports index use directly.", fr: "Un Retrieved Document Count élevé suggère une analyse complète, mais c'est Index Utilization qui indique directement l'utilisation de l'index." }
references:
  - title: Get SQL query execution metrics and analyze query performance using .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics-performance
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
