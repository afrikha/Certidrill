id: dp420-2b-pf-failover-types
objective: "2.2.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum has several Azure Cosmos DB for NoSQL accounts, each with a single write region and at least one read region. The accounts use Session consistency and serve C# applications.

    Which failover option matches each scenario? To answer, drag the appropriate options to the correct scenarios. Each option may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de plusieurs comptes Azure Cosmos DB for NoSQL, chacun avec une seule région d'écriture et au moins une région de lecture. Les comptes utilisent la cohérence Session et servent des applications C#.

    Quelle option de basculement correspond à chaque scénario ? Pour répondre, faites glisser les options appropriées vers les scénarios correspondants. Chaque option peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ppaf, text: { en: "Per-partition automatic failover", fr: "Basculement automatique par partition" } }
    - { id: offline, text: { en: "Offline region (forced failover)", fr: "Offline region (basculement forcé)" } }
    - { id: change, text: { en: "Change write region", fr: "Change write region (changement de région d'écriture)" } }
    - { id: smf, text: { en: "Service-managed failover", fr: "Basculement géré par le service" } }
    - { id: ppcb, text: { en: "Partition-level circuit breaker", fr: "Disjoncteur au niveau des partitions" } }
  targets:
    - id: t1
      text: { en: "Only the partitions affected by an outage of the write region fail over automatically, in about three minutes", fr: "Seules les partitions affectées par une panne de la région d'écriture basculent automatiquement, en trois minutes environ" }
    - id: t2
      text: { en: "The write region is down, partition failover isn't enabled, and you must restore write availability as fast as possible", fr: "La région d'écriture est en panne, le basculement par partition n'est pas activé, et vous devez rétablir la disponibilité en écriture au plus vite" }
    - id: t3
      text: { en: "Move the write region to another region during a planned maintenance window, without data loss", fr: "Déplacer la région d'écriture vers une autre région pendant une fenêtre de maintenance planifiée, sans perte de données" }
    - id: t4
      text: { en: "Microsoft decides when to promote a read region, based on the failover priorities you set", fr: "Microsoft décide quand promouvoir une région de lecture, selon les priorités de basculement que vous avez définies" }
answer:
  mapping: { t1: ppaf, t2: offline, t3: change, t4: smf }
explanation:
  correct:
    en: |
      Per-partition automatic failover moves only the affected partitions, in about three minutes. Without it, taking the failed write region offline (forced failover) is the fastest way to restore writes, and it can lose unreplicated writes. Change write region is a planned operation with no data loss that can't be used during an outage. With service-managed failover, Microsoft decides when to fail over, which can take an hour or more.
    fr: |
      Le basculement automatique par partition ne déplace que les partitions affectées, en trois minutes environ. Sans lui, mettre hors ligne la région d'écriture défaillante (basculement forcé) est le moyen le plus rapide de rétablir les écritures, avec un risque de perte des écritures non répliquées. Change write region est une opération planifiée sans perte de données, inutilisable pendant une panne. Avec le basculement géré par le service, Microsoft décide du moment du basculement, ce qui peut prendre une heure ou plus.
  options:
    ppcb: { en: "The circuit breaker is an SDK feature that reroutes requests for an unhealthy partition; it doesn't change the write region of the account.", fr: "Le disjoncteur est une fonctionnalité du SDK qui redirige les requêtes d'une partition défaillante ; il ne change pas la région d'écriture du compte." }
references:
  - title: Reliability in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/high-availability
  - title: Manage an Azure Cosmos DB account by using the Azure portal
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-database-account
