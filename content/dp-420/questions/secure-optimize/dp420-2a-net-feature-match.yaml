id: dp420-2a-net-feature-match
objective: "2.1.3"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is securing network access to an Azure Cosmos DB for NoSQL account named **fabrikam-loyalty**. Three access requirements are listed in the answer area.

    Which network feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam sécurise l'accès réseau à un compte Azure Cosmos DB for NoSQL nommé **fabrikam-loyalty**. Trois exigences d'accès sont listées dans la zone de réponse.

    Quelle fonctionnalité réseau devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: ipfw, text: { en: "IP firewall rule", fr: "Règle de pare-feu IP" } }
    - { id: svcep, text: { en: "Service endpoint and virtual network rule", fr: "Point de terminaison de service et règle de réseau virtuel" } }
    - { id: pe, text: { en: "Private endpoint", fr: "Point de terminaison privé" } }
    - { id: dc, text: { en: "Accept connections from within public Azure datacenters", fr: "Accept connections from within public Azure datacenters" } }
    - { id: tls, text: { en: "Minimum TLS version", fr: "Version TLS minimale" } }
  targets:
    - id: office
      text: { en: "Allow a partner office whose internet traffic leaves from the static public IP address 203.0.113.10", fr: "Autoriser un bureau partenaire dont le trafic Internet sort par l'adresse IP publique statique 203.0.113.10" }
    - id: subnet
      text: { en: "Allow a subnet of virtual machines by its identity while clients keep using the public endpoint of the account", fr: "Autoriser un sous-réseau de machines virtuelles par son identité, les clients continuant d'utiliser le point de terminaison public du compte" }
    - id: onprem
      text: { en: "Let on-premises servers connected by VPN reach the account through a private IP address in an Azure virtual network", fr: "Permettre à des serveurs locaux connectés par VPN d'atteindre le compte par une adresse IP privée d'un réseau virtuel Azure" }
answer:
  mapping: { office: ipfw, subnet: svcep, onprem: pe }
explanation:
  correct:
    en: |
      An IP firewall rule allows public IP addresses or CIDR ranges. A service endpoint sends the virtual network and subnet identity to Azure Cosmos DB, and a virtual network rule allows that subnet while the account keeps its public endpoint. A private endpoint gives the account private IP addresses in a virtual network, which on-premises clients can reach over VPN or ExpressRoute.
    fr: |
      Une règle de pare-feu IP autorise des adresses IP publiques ou des plages CIDR. Un point de terminaison de service transmet l'identité du réseau virtuel et du sous-réseau à Azure Cosmos DB, et une règle de réseau virtuel autorise ce sous-réseau tandis que le compte conserve son point de terminaison public. Un point de terminaison privé donne au compte des adresses IP privées dans un réseau virtuel, que les clients locaux peuvent atteindre par VPN ou ExpressRoute.
  options:
    dc: { en: "This option allows all Azure datacenter traffic, which matches none of the requirements.", fr: "Cette option autorise tout le trafic des centres de données Azure, ce qui ne correspond à aucune exigence." }
    tls: { en: "The minimum TLS version controls the protocol version, not which networks can connect.", fr: "La version TLS minimale contrôle la version du protocole, pas les réseaux qui peuvent se connecter." }
references:
  - title: Configure access to Azure Cosmos DB from virtual networks
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-vnet-service-endpoint
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
