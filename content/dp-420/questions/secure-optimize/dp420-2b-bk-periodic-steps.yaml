id: dp420-2b-bk-periodic-steps
objective: "2.2.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account named **cosmos-adt-inventory** that uses periodic backup mode with the default interval and retention. The account uses a firewall that only allows the virtual network of the inventory application.

    Three hours ago, a faulty script deleted thousands of items. You need to recover the items and make them reachable by the inventory application.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-adt-inventory** qui utilise le mode de sauvegarde périodique avec l'intervalle et la rétention par défaut. Le compte utilise un pare-feu qui n'autorise que le réseau virtuel de l'application d'inventaire.

    Il y a trois heures, un script défectueux a supprimé des milliers d'éléments. Vous devez récupérer les éléments et les rendre accessibles à l'application d'inventaire.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: ret, text: { en: "Increase the backup retention of the account to at least seven days.", fr: "Augmenter la rétention des sauvegardes du compte à au moins sept jours." } }
    - { id: ticket, text: { en: "Create a support request of the Backup and Restore problem type that gives the restore time.", fr: "Créer une demande de support de type de problème Backup and Restore qui indique l'heure de restauration." } }
    - { id: net, text: { en: "Configure the firewall and virtual network settings on the restored account.", fr: "Configurer les paramètres de pare-feu et de réseau virtuel sur le compte restauré." } }
    - { id: cli, text: { en: "Run az cosmosdb restore with a restore timestamp from three hours ago.", fr: "Exécuter az cosmosdb restore avec un horodatage de restauration d'il y a trois heures." } }
    - { id: inacc, text: { en: "Perform a same-account restore of the container.", fr: "Effectuer une restauration du conteneur dans le même compte." } }
    - { id: interval, text: { en: "Decrease the backup interval to one hour.", fr: "Réduire l'intervalle de sauvegarde à une heure." } }
answer:
  sequence: [ ret, ticket, net ]
explanation:
  correct:
    en: |
      With the default policy, only the two latest backups (one every four hours) are kept, so you first extend the retention, ideally to at least seven days, to keep the needed backup from being overwritten. Periodic restores are performed by the Azure Cosmos DB team after a support request, into a new account. Firewall and virtual network settings aren't restored, so you configure them on the new account.
    fr: |
      Avec la stratégie par défaut, seules les deux dernières sauvegardes (une toutes les quatre heures) sont conservées : vous prolongez d'abord la rétention, idéalement à au moins sept jours, pour que la sauvegarde utile ne soit pas écrasée. En mode périodique, la restauration est effectuée par l'équipe Azure Cosmos DB après une demande de support, dans un nouveau compte. Les paramètres de pare-feu et de réseau virtuel ne sont pas restaurés : vous les configurez sur le nouveau compte.
  options:
    cli: { en: "az cosmosdb restore requires continuous backup mode.", fr: "az cosmosdb restore nécessite le mode de sauvegarde continue." }
    inacc: { en: "Same-account restore is a continuous backup feature, and it only restores deleted containers or databases, not deleted items.", fr: "La restauration dans le même compte est une fonctionnalité de la sauvegarde continue, et elle ne restaure que des conteneurs ou bases de données supprimés, pas des éléments supprimés." }
    interval: { en: "A shorter interval only affects future backups; it doesn't help recover the deleted items.", fr: "Un intervalle plus court n'affecte que les sauvegardes futures ; il n'aide pas à récupérer les éléments supprimés." }
references:
  - title: Periodic backup and restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
  - title: Modify periodic backup interval and retention period
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-modify-interval-retention
