id: dp420-2c-ix-statements
objective: "2.3.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You use the indexing metrics returned by the Azure Cosmos DB SDK to tune the indexing policy of a container named **listings**.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous utilisez les métriques d'indexation renvoyées par le SDK Azure Cosmos DB pour ajuster la stratégie d'indexation d'un conteneur nommé **listings**.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: If an indexed path is not listed under Utilized Single Indexes or Utilized Composite Indexes for a query, removing that path doesn't affect the performance of that query.
        fr: Si un chemin indexé ne figure ni sous Utilized Single Indexes ni sous Utilized Composite Indexes pour une requête, supprimer ce chemin n'affecte pas les performances de cette requête.
    - id: s2
      text:
        en: The Potential Composite Indexes section lists every composite index that the query could use.
        fr: La section Potential Composite Indexes liste tous les index composites que la requête pourrait utiliser.
    - id: s3
      text:
        en: The Index Impact Score is calculated from the distribution of the values stored in the container.
        fr: L'Index Impact Score est calculé à partir de la distribution des valeurs stockées dans le conteneur.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Utilized indexes are evidence that the query used those paths, so a path that isn't listed can be removed without affecting that query. Potential indexes are recommendations, not an exhaustive list, and some of them might have no impact; you add them and measure. The impact score (High or Low) is based only on the query shape, so the actual benefit still depends on the data.
    fr: |
      Les index utilisés prouvent que la requête a utilisé ces chemins ; un chemin absent de la liste peut donc être supprimé sans affecter cette requête. Les index potentiels sont des recommandations, pas une liste exhaustive, et certains peuvent n'avoir aucun impact ; vous les ajoutez puis vous mesurez. Le score d'impact (High ou Low) repose uniquement sur la forme de la requête : le bénéfice réel dépend toujours des données.
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
