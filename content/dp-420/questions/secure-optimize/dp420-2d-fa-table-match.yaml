id: dp420-2d-fa-table-match
objective: "2.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip sends the fleet analytics of its Azure Cosmos DB fleet to an Azure Data Lake Storage Gen2 account and queries the tables from a Spark notebook.

    Which table should you query for each requirement? To answer, drag the appropriate tables to the correct requirements. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip envoie l'analytique de la flotte de sa flotte Azure Cosmos DB vers un compte Azure Data Lake Storage Gen2 et interroge les tables depuis un notebook Spark.

    Quelle table devez-vous interroger pour chaque exigence ? Pour répondre, faites glisser les tables appropriées vers les exigences correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fru, text: FactResourceUsageHourly }
    - { id: fac, text: FactAccountHourly }
    - { id: frq, text: FactRequestHourly }
    - { id: fmu, text: FactMeterUsageHourly }
    - { id: dmt, text: DimMeter }
    - { id: drs, text: DimResource }
  targets:
    - id: t1
      text: { en: "Find the tenants whose index storage grew the most last quarter", fr: "Trouver les locataires dont le stockage d'index a le plus augmenté au dernier trimestre" }
    - id: t2
      text: { en: "List the accounts on which burst capacity isn't enabled", fr: "Lister les comptes sur lesquels la capacité en rafale n'est pas activée" }
    - id: t3
      text: { en: "Count the requests that returned status code 429 for each tenant per day", fr: "Compter les requêtes qui ont renvoyé le code d'état 429 pour chaque locataire et par jour" }
    - id: t4
      text: { en: "Show the description and base price of each billing meter", fr: "Afficher la description et le prix de base de chaque compteur de facturation" }
answer:
  mapping: { t1: fru, t2: fac, t3: frq, t4: dmt }
explanation:
  correct:
    en: |
      FactResourceUsageHourly records MaxDataStorageInKB and MaxIndexStorageInKB each hour. FactAccountHourly records account settings, including IsBurstEnabled. FactRequestHourly records TotalRequestCount per resource, operation and StatusCode. DimMeter describes each billing meter with MeterDescription and BasePrice.
    fr: |
      FactResourceUsageHourly enregistre chaque heure MaxDataStorageInKB et MaxIndexStorageInKB. FactAccountHourly enregistre les paramètres des comptes, dont IsBurstEnabled. FactRequestHourly enregistre TotalRequestCount par ressource, opération et StatusCode. DimMeter décrit chaque compteur de facturation avec MeterDescription et BasePrice.
  options:
    fmu: { en: "FactMeterUsageHourly holds the consumed units per meter, not the meter's description or price.", fr: "FactMeterUsageHourly contient les unités consommées par compteur, pas la description ni le prix du compteur." }
    drs: { en: "DimResource gives context (account, database, container names) and is joined to the facts on ResourceId.", fr: "DimResource apporte le contexte (noms de compte, de base de données, de conteneur) et se joint aux faits sur ResourceId." }
references:
  - title: Fleet Analytics Schema Reference (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics-schema-reference
