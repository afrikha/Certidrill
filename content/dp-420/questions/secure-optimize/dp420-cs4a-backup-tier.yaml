id: dp420-cs4a-backup-tier
objective: "2.2.1"
type: single
caseStudy: dp420-cs4a-lamna-healthcare
difficulty: 1
status: draft
stem:
  en: You need to configure backups for cosmos-lamna to meet the recovery requirement. What should you do?
  fr: Vous devez configurer les sauvegardes de cosmos-lamna pour satisfaire l'exigence de récupération. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Migrate the account to continuous backup with the 7-day tier", fr: "Migrer le compte vers la sauvegarde continue avec le niveau 7 jours" } }
    - { id: b, text: { en: "Keep periodic backup and set the backup retention to 30 days", fr: "Conserver la sauvegarde périodique et définir la rétention des sauvegardes sur 30 jours" } }
    - { id: c, text: { en: "Migrate the account to continuous backup with the 30-day tier", fr: "Migrer le compte vers la sauvegarde continue avec le niveau 30 jours" } }
    - { id: d, text: { en: "Enable the all versions and deletes change feed mode on the account", fr: "Activer le mode de flux de modification toutes les versions et suppressions sur le compte" } }
answer: { optionId: c }
explanation:
  correct:
    en: Continuous backup provides self-service point-in-time restore to any timestamp within the retention period of its tier. The 30-day tier is the shortest tier that covers 30 days; it is charged for backup storage, but the free 7-day tier does not meet the requirement.
    fr: La sauvegarde continue offre une restauration à un point dans le temps en libre-service, vers n'importe quel horodatage de la période de rétention de son niveau. Le niveau 30 jours est le plus court qui couvre 30 jours ; son stockage de sauvegarde est facturé, mais le niveau 7 jours, gratuit, ne satisfait pas l'exigence.
  options:
    a: { en: "The 7-day tier can only restore to a point within the last 7 days.", fr: "Le niveau 7 jours ne permet de restaurer qu'à un point des 7 derniers jours." }
    b: { en: "In periodic mode, restores are requested from Microsoft support and use the existing backup copies, not any point in time.", fr: "En mode périodique, les restaurations sont demandées au support Microsoft et utilisent les copies de sauvegarde existantes, pas n'importe quel point dans le temps." }
    d: { en: "The change feed exposes changes to process; it is not a restore mechanism, and this mode itself requires continuous backup.", fr: "Le flux de modification expose des modifications à traiter ; ce n'est pas un mécanisme de restauration, et ce mode exige lui-même la sauvegarde continue." }
references:
  - title: Continuous Backup with Point-in-Time Restore - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
