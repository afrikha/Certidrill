id: dp420-2c-qm-network-latency
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove has a single-region Azure Cosmos DB for NoSQL account in West Europe. A reporting service hosted in the Southeast Asia Azure region queries a container named **trades** by using the .NET SDK.

    For each page of a query, the service measures about 240 ms of elapsed time. For the same pages, `CumulativeMetrics.TotalTime` is about 4 ms, the request charge is about 3 RUs, and no request returns status code 429.

    You need to reduce the latency of the query pages.

    What should you do?
  fr: |
    Woodgrove dispose d'un compte Azure Cosmos DB for NoSQL à région unique dans West Europe. Un service de rapports hébergé dans la région Azure Southeast Asia interroge un conteneur nommé **trades** avec le SDK .NET.

    Pour chaque page d'une requête, le service mesure environ 240 ms de temps écoulé. Pour ces mêmes pages, `CumulativeMetrics.TotalTime` est d'environ 4 ms, les frais de requête d'environ 3 RU, et aucune requête ne renvoie le code d'état 429.

    Vous devez réduire la latence des pages de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a composite index that matches the filter and ORDER BY clause of the query.", fr: "Ajouter un index composite correspondant au filtre et à la clause ORDER BY de la requête." }
    - id: b
      text: { en: "Increase the provisioned throughput of the trades container.", fr: "Augmenter le débit provisionné du conteneur trades." }
    - id: c
      text: { en: "Switch the CosmosClient from Direct mode to Gateway mode.", fr: "Faire passer le CosmosClient du mode direct au mode passerelle." }
    - id: d
      text: { en: "Add Southeast Asia as a read region and make it the client's preferred region.", fr: "Ajouter Southeast Asia comme région de lecture et en faire la région préférée du client." }
answer: { optionId: d }
explanation:
  correct:
    en: "Query execution metrics give the server execution time, which lets you separate the time spent executing the query from the time spent in network transit. Here the backend needs about 4 ms out of 240 ms, so almost all the latency is network distance between Southeast Asia and West Europe. Replicating the data to the application's region and preferring that region removes the cross-region round trip."
    fr: "Les métriques d'exécution de requête donnent le temps d'exécution côté serveur, ce qui permet de distinguer le temps d'exécution de la requête du temps de transit réseau. Ici le back-end a besoin d'environ 4 ms sur 240 ms : presque toute la latence vient de la distance réseau entre Southeast Asia et West Europe. Répliquer les données dans la région de l'application et privilégier cette région supprime l'aller-retour interrégion."
  options:
    a: { en: "The backend execution is already fast and cheap; an index change cannot remove network latency.", fr: "L'exécution back-end est déjà rapide et peu coûteuse ; une modification d'index ne peut pas supprimer la latence réseau." }
    b: { en: "There is no throttling (no 429), so more RU/s would not change the latency.", fr: "Il n'y a pas de limitation du débit (aucun 429) : plus de RU/s ne changerait pas la latence." }
    c: { en: "Gateway mode adds an extra network hop and usually increases latency.", fr: "Le mode passerelle ajoute un saut réseau supplémentaire et augmente généralement la latence." }
references:
  - title: Tuning query performance with Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics
  - title: Get SQL query execution metrics and analyze query performance using .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics-performance
