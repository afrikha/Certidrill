id: dp420-cs2c-offline-query
objective: "2.3.2"
type: multi
caseStudy: dp420-cs2c-vanarsdel
difficulty: 2
status: draft
stem:
  en: |
    You analyze the query metrics of the **Offline devices** query. You need to meet the fourth requirement.

    Which two actions should you perform? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous analysez les métriques de requête de la requête **Offline devices**. Vous devez respecter la quatrième exigence.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add a composite index on (tenantId, status) and keep the query unchanged.", fr: "Ajouter un index composite sur (tenantId, status) et conserver la requête telle quelle." } }
    - { id: b, text: { en: "Store status in lowercase when items are written, and remove LOWER() from the filter.", fr: "Stocker status en minuscules lors de l'écriture des éléments, et retirer LOWER() du filtre." } }
    - { id: c, text: { en: "Switch the query to a point read for each device of the tenant.", fr: "Remplacer la requête par une lecture ponctuelle de chaque appareil du locataire." } }
    - { id: d, text: { en: "Define an indexed computed property that returns LOWER(status), and filter on it.", fr: "Définir une propriété calculée indexée qui renvoie LOWER(status), et filtrer sur celle-ci." } }
    - { id: e, text: { en: "Add a TOP 100 clause and keep the LOWER() filter.", fr: "Ajouter une clause TOP 100 et conserver le filtre LOWER()." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A Retrieved Document Count far above the Output Document Count with 0 % index utilization shows that the `LOWER()` filter prevents the use of the index, so the query loads every item of the tenant. Storing the value in a normalized case and filtering on it directly, or indexing a computed property that holds the result of the system function, lets the index serve the filter.
    fr: |
      Un Retrieved Document Count très supérieur à l'Output Document Count avec une utilisation de l'index de 0 % montre que le filtre `LOWER()` empêche l'utilisation de l'index : la requête charge tous les éléments du locataire. Stocker la valeur dans une casse normalisée et filtrer directement dessus, ou indexer une propriété calculée qui contient le résultat de la fonction système, permet à l'index de servir le filtre.
  options:
    a: { en: "The index still cannot evaluate the LOWER() expression, so the query keeps loading the items to apply the filter.", fr: "L'index ne peut toujours pas évaluer l'expression LOWER() : la requête continue de charger les éléments pour appliquer le filtre." }
    c: { en: "The page does not know which devices are offline, and reading every device of a large tenant costs far more than an indexed query.", fr: "La page ne sait pas quels appareils sont hors ligne, et lire chaque appareil d'un locataire important coûte bien plus qu'une requête indexée." }
    e: { en: "Only 37 items match, so TOP 100 does not stop the scan of the tenant's items.", fr: "Seuls 37 éléments correspondent : TOP 100 n'arrête pas l'analyse des éléments du locataire." }
references:
  - title: Get SQL query execution metrics and analyze query performance using .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics-performance
