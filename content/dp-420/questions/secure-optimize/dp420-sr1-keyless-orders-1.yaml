id: dp420-sr1-keyless-orders-1
objective: "2.1.2"
type: series_yesno
series: dp420-sr1-keyless-orders
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You assign Cosmos DB Built-in Data Contributor at the scope of the orders container.
  fr: Vous attribuez Cosmos DB Built-in Data Contributor à l'étendue du conteneur orders.
body:
  solution:
    en: |
      You run the following command, where `$ORDER_API_PRINCIPAL_ID` contains the principal ID of the managed identity of order-api:

      ```bash
      az cosmosdb sql role assignment create \
          --resource-group rg-sales \
          --account-name cosmos-fab \
          --role-definition-id 00000000-0000-0000-0000-000000000002 \
          --principal-id $ORDER_API_PRINCIPAL_ID \
          --scope "/dbs/sales/colls/orders"
      ```
    fr: |
      Vous exécutez la commande suivante, où `$ORDER_API_PRINCIPAL_ID` contient l'ID de principal de l'identité managée de order-api :

      ```bash
      az cosmosdb sql role assignment create \
          --resource-group rg-sales \
          --account-name cosmos-fab \
          --role-definition-id 00000000-0000-0000-0000-000000000002 \
          --principal-id $ORDER_API_PRINCIPAL_ID \
          --scope "/dbs/sales/colls/orders"
      ```
answer: { value: true }
explanation:
  correct:
    en: The role definition ID `00000000-0000-0000-0000-000000000002` is the native data plane role Cosmos DB Built-in Data Contributor, which allows `readMetadata` and all container and item operations. Cosmos DB Built-in Data Reader cannot write, so Data Contributor is the least privileged built-in role for this need, and the `/dbs/sales/colls/orders` scope limits it to the orders container.
    fr: "L'ID de définition de rôle `00000000-0000-0000-0000-000000000002` correspond au rôle natif du plan de données Cosmos DB Built-in Data Contributor, qui autorise `readMetadata` et toutes les opérations sur les conteneurs et les éléments. Cosmos DB Built-in Data Reader ne permet pas d'écrire : Data Contributor est donc le rôle intégré le moins privilégié pour ce besoin, et l'étendue `/dbs/sales/colls/orders` le limite au conteneur orders."
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
