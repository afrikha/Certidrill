id: dp420-2b-mr-bounded-throttle
objective: "2.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL account with multi-region writes in East US and West US. The account uses Bounded Staleness consistency with a staleness window of 100,000 writes and 300 seconds. Each instance of a Python order service reads and writes only in its own region.

    During a period of slow cross-region replication, writes to some partitions were throttled even though their normalized RU consumption stayed below 60 percent. You need to prevent this from happening again while keeping multi-region writes and local reads.

    What should you do?
  fr: |
    Fabrikam dispose d'un compte Azure Cosmos DB for NoSQL avec écritures multirégions dans les régions East US et West US. Le compte utilise la cohérence Bounded Staleness avec une fenêtre d'obsolescence de 100 000 écritures et 300 secondes. Chaque instance d'un service de commandes Python lit et écrit uniquement dans sa propre région.

    Pendant une période de réplication interrégion lente, les écritures de certaines partitions ont été limitées alors que leur consommation de RU normalisée restait inférieure à 60 pour cent. Vous devez empêcher que cela se reproduise, tout en conservant les écritures multirégions et les lectures locales.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Increase the provisioned throughput of the containers.", fr: "Augmenter le débit provisionné des conteneurs." }
    - id: b
      text: { en: "Change the default consistency level to Strong.", fr: "Remplacer le niveau de cohérence par défaut par Strong." }
    - id: c
      text: { en: "Reduce the staleness window to 10 writes and 5 seconds.", fr: "Réduire la fenêtre d'obsolescence à 10 écritures et 5 secondes." }
    - id: d
      text: { en: "Change the default consistency level to Session.", fr: "Remplacer le niveau de cohérence par défaut par Session." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      With Bounded Staleness, when the replication lag of a partition exceeds the staleness bound, Azure Cosmos DB throttles writes to that partition. Microsoft describes Bounded Staleness with multiple write regions as an anti-pattern: it is mainly useful for single-write-region accounts. Session consistency gives each regional instance read-your-writes guarantees without this throttling.
    fr: |
      Avec Bounded Staleness, quand le décalage de réplication d'une partition dépasse la limite d'obsolescence, Azure Cosmos DB limite les écritures vers cette partition. Microsoft décrit Bounded Staleness avec plusieurs régions d'écriture comme un anti-modèle : ce niveau est surtout utile pour les comptes à une seule région d'écriture. La cohérence Session offre à chaque instance régionale la lecture de ses propres écritures, sans cette limitation.
  options:
    a: { en: "The throttling comes from replication lag beyond the staleness bound, not from a lack of RU/s.", fr: "La limitation provient d'un décalage de réplication au-delà de la limite d'obsolescence, pas d'un manque de RU/s." }
    b: { en: "Strong consistency isn't supported on accounts with multiple write regions.", fr: "La cohérence Strong n'est pas prise en charge sur les comptes à plusieurs régions d'écriture." }
    c: { en: "Multi-region accounts require at least 100,000 writes or 300 seconds, and a tighter bound would throttle writes even more often.", fr: "Les comptes multirégions exigent au moins 100 000 écritures ou 300 secondes, et une limite plus stricte limiterait les écritures encore plus souvent." }
references:
  - title: Consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
