stem:
  en: You shorten the periodic backup interval and extend the retention to seven days.
  fr: Vous raccourcissez l'intervalle de sauvegarde périodique et étendez la rétention à sept jours.
body:
  solution:
    en: |
      You keep periodic backup mode on cosmos-wg. You set the backup interval to **1 hour** and the backup retention to **168 hours** (seven days).
    fr: |
      Vous conservez le mode de sauvegarde périodique sur cosmos-wg. Vous définissez l'intervalle de sauvegarde sur **1 heure** et la rétention des sauvegardes sur **168 heures** (sept jours).
answer: { value: false }
explanation:
  correct:
    en: In periodic mode, a restore is not self-service. It is requested through a support request and performed by the Azure Cosmos DB team from the scheduled backup copies, so the team cannot restore by itself and cannot choose an arbitrary point in time between two backups. Only two backup copies are free, so the extra hourly copies also add backup storage charges.
    fr: "En mode périodique, la restauration n'est pas en libre-service : elle est demandée au moyen d'une demande de support et effectuée par l'équipe Azure Cosmos DB à partir des copies de sauvegarde planifiées. L'équipe ne peut donc pas restaurer elle-même ni choisir un instant arbitraire entre deux sauvegardes. Seules deux copies de sauvegarde sont gratuites : les copies horaires supplémentaires ajoutent en plus des frais de stockage de sauvegarde."
references:
  - title: Periodic Backup and Restore Introduction - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
