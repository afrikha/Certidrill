id: dp420-2d-fa-no-data-fabric
objective: "2.4.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB fleet named **fleet-contoso**. Three days ago, you selected **Fleet analytics** in the Monitoring section of the fleet and saved a destination that points to a lakehouse in a Microsoft Fabric workspace named **ws-fleet**. The workspace uses OneLake as its default storage and is backed by a trial Fabric capacity.

    No fleet analytics table has appeared in the lakehouse.

    What should you do?
  fr: |
    Contoso dispose d'une flotte Azure Cosmos DB nommée **fleet-contoso**. Il y a trois jours, vous avez sélectionné **Fleet analytics** dans la section Supervision de la flotte et enregistré une destination qui pointe vers un lakehouse d'un espace de travail Microsoft Fabric nommé **ws-fleet**. L'espace de travail utilise OneLake comme stockage par défaut et repose sur une capacité Fabric d'évaluation.

    Aucune table d'analytique de la flotte n'est apparue dans le lakehouse.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a diagnostic setting on each account that sends the DataPlaneRequests category to the lakehouse.", fr: "Ajouter sur chaque compte un paramètre de diagnostic qui envoie la catégorie DataPlaneRequests vers le lakehouse." } }
    - { id: b, text: { en: "In ws-fleet, add the Cosmos DB Fleet Analytics service principal with the Contributor role.", fr: "Dans ws-fleet, ajouter le principal de service Cosmos DB Fleet Analytics avec le rôle Contributor." } }
    - { id: c, text: { en: "Wait for the next monthly export, because fleet analytics writes its tables once a month.", fr: "Attendre le prochain export mensuel, car l'analytique de la flotte écrit ses tables une fois par mois." } }
    - { id: d, text: { en: "Assign the Cosmos DB Built-in Data Reader role to the Cosmos DB Fleet Analytics service principal.", fr: "Attribuer le rôle Cosmos DB Built-in Data Reader au principal de service Cosmos DB Fleet Analytics." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      After you save the destination, you must grant the shared Cosmos DB Fleet Analytics service principal the Contributor role in the Fabric workspace (workspace > Manage access). Without it, no data is written. Once access is granted, data can take up to one hour to appear.
    fr: |
      Après avoir enregistré la destination, vous devez accorder au principal de service partagé Cosmos DB Fleet Analytics le rôle Contributor dans l'espace de travail Fabric (espace de travail > Manage access). Sans cela, aucune donnée n'est écrite. Une fois l'accès accordé, les données peuvent mettre jusqu'à une heure à apparaître.
  options:
    a: { en: "Fleet analytics collects its data from the fleet itself; resource logs aren't involved.", fr: "L'analytique de la flotte collecte ses données à partir de la flotte elle-même ; les journaux de ressources n'interviennent pas." }
    c: { en: "Data is aggregated hourly and starts to populate within about an hour once permissions are granted.", fr: "Les données sont agrégées toutes les heures et commencent à arriver dans l'heure environ une fois les autorisations accordées." }
    d: { en: "A data plane role on the accounts doesn't let the service principal write to the Fabric workspace.", fr: "Un rôle du plan de données sur les comptes ne permet pas au principal de service d'écrire dans l'espace de travail Fabric." }
references:
  - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics
  - title: Frequently Asked Questions - Fleets (Preview) - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-faq
