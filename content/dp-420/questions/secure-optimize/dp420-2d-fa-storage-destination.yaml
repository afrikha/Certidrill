id: dp420-2d-fa-storage-destination
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind has an Azure Cosmos DB fleet and wants to send fleet analytics to an Azure Storage account instead of Microsoft Fabric. The subscription contains the following storage accounts, each with an existing container:

    - **stnwlogs1**: general-purpose v2, hierarchical namespace disabled, blob versioning enabled
    - **stnwlogs2**: premium file shares (FileStorage)
    - **stnwlake**: general-purpose v2, hierarchical namespace enabled when the account was created
    - **stnwarch**: general-purpose v2, hierarchical namespace disabled, immutability policy on the container

    Which storage account can you use as the fleet analytics destination?
  fr: |
    Northwind dispose d'une flotte Azure Cosmos DB et souhaite envoyer l'analytique de la flotte vers un compte Stockage Azure plutôt que vers Microsoft Fabric. L'abonnement contient les comptes de stockage suivants, chacun avec un conteneur existant :

    - **stnwlogs1** : v2 à usage général, espace de noms hiérarchique désactivé, contrôle de version des objets blob activé
    - **stnwlogs2** : partages de fichiers premium (FileStorage)
    - **stnwlake** : v2 à usage général, espace de noms hiérarchique activé à la création du compte
    - **stnwarch** : v2 à usage général, espace de noms hiérarchique désactivé, stratégie d'immuabilité sur le conteneur

    Quel compte de stockage pouvez-vous utiliser comme destination de l'analytique de la flotte ?
body:
  options:
    - { id: a, text: stnwlogs1 }
    - { id: b, text: stnwlogs2 }
    - { id: c, text: stnwlake }
    - { id: d, text: stnwarch }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A fleet analytics storage destination must be compatible with Azure Data Lake Storage Gen2, which means the hierarchical namespace enabled when the account was created, with an existing container. Fleet analytics writes Delta Lake tables (Parquet files) to that container.
    fr: |
      Une destination de stockage de l'analytique de la flotte doit être compatible avec Azure Data Lake Storage Gen2, c'est-à-dire avoir l'espace de noms hiérarchique activé à la création du compte, avec un conteneur existant. L'analytique de la flotte écrit des tables Delta Lake (fichiers Parquet) dans ce conteneur.
  options:
    a: { en: "Without hierarchical namespace, the account isn't an ADLS Gen2 account; blob versioning doesn't change that.", fr: "Sans espace de noms hiérarchique, le compte n'est pas un compte ADLS Gen2 ; le contrôle de version des objets blob n'y change rien." }
    b: { en: "A FileStorage account holds Azure file shares, not blob containers with a hierarchical namespace.", fr: "Un compte FileStorage contient des partages de fichiers Azure, pas des conteneurs d'objets blob avec espace de noms hiérarchique." }
    d: { en: "The hierarchical namespace is disabled; an immutability policy on the container doesn't make the account an ADLS Gen2 account.", fr: "L'espace de noms hiérarchique est désactivé ; une stratégie d'immuabilité sur le conteneur ne fait pas du compte un compte ADLS Gen2." }
references:
  - title: Enable Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-enable-fleet-analytics
