id: dp420-2c-qm-python-ru
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A Python service built with the `azure-cosmos` package queries a container named **bookings** by calling `container.query_items()`.

    You need to log, for each executed query, the request charge and the backend query execution metrics.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un service Python basé sur le package `azure-cosmos` interroge un conteneur nommé **bookings** en appelant `container.query_items()`.

    Vous devez journaliser, pour chaque requête exécutée, les frais de requête et les métriques d'exécution de requête côté back-end.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Pass populate_index_metrics=True to query_items().", fr: "Passer populate_index_metrics=True à query_items()." } }
    - { id: b, text: { en: "Pass populate_query_metrics=True to query_items().", fr: "Passer populate_query_metrics=True à query_items()." } }
    - { id: c, text: { en: "Read the x-ms-request-charge header from container.client_connection.last_response_headers.", fr: "Lire l'en-tête x-ms-request-charge dans container.client_connection.last_response_headers." } }
    - { id: d, text: { en: "Pass enable_scan_in_query=True to query_items().", fr: "Passer enable_scan_in_query=True à query_items()." } }
    - { id: e, text: { en: "Call container.get_throughput() after each query.", fr: "Appeler container.get_throughput() après chaque requête." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "The `populate_query_metrics` keyword of `query_items()` makes the service return query metrics in the response headers. The Python container exposes the headers of the last operation through `client_connection.last_response_headers`, and the request charge is under the `x-ms-request-charge` key."
    fr: "Le mot clé `populate_query_metrics` de `query_items()` demande au service de renvoyer les métriques de requête dans les en-têtes de réponse. Le conteneur Python expose les en-têtes de la dernière opération via `client_connection.last_response_headers`, et les frais de requête se trouvent sous la clé `x-ms-request-charge`."
  options:
    a: { en: "Index metrics describe used and potential indexed paths, not the execution metrics or the charge.", fr: "Les métriques d'index décrivent les chemins indexés utilisés et potentiels, pas les métriques d'exécution ni les frais." }
    d: { en: "enable_scan_in_query only allows scans on paths excluded from indexing.", fr: "enable_scan_in_query autorise seulement les analyses sur des chemins exclus de l'indexation." }
    e: { en: "get_throughput() returns the provisioned throughput of the container, not the cost of a query.", fr: "get_throughput() renvoie le débit provisionné du conteneur, pas le coût d'une requête." }
references:
  - title: Find the request unit charge for operations in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/find-request-unit-charge
  - title: ContainerProxy Class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
