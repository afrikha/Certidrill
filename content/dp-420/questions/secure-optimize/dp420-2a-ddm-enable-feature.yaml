id: dp420-2a-ddm-enable-feature
objective: "2.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You need to define a masking policy on a container named **customers** in an Azure Cosmos DB for NoSQL account named **fabrikam-crm**. In the Azure portal, the **Masking Policy** option does not appear in the container settings.

    What should you do first?
  fr: |
    Vous devez définir une stratégie de masquage sur un conteneur nommé **customers** dans un compte Azure Cosmos DB for NoSQL nommé **fabrikam-crm**. Dans le portail Azure, l'option **Masking Policy** n'apparaît pas dans les paramètres du conteneur.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the analytical store on the customers container.", fr: "Activer le magasin analytique sur le conteneur customers." } }
    - { id: b, text: { en: "Switch the account backup policy from periodic to continuous.", fr: "Faire passer la stratégie de sauvegarde du compte de périodique à continue." } }
    - { id: c, text: { en: "Enable the all versions and deletes change feed mode on the account.", fr: "Activer le mode toutes versions et suppressions du flux de modification sur le compte." } }
    - { id: d, text: { en: "Enable Dynamic Data Masking on the Features page of the account settings.", fr: "Activer Dynamic Data Masking dans la page Features des paramètres du compte." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Dynamic data masking is enabled per account from Settings > Features, and the Masking Policy option of a container appears only once the feature is enabled. Enabling it can take up to 15 minutes, and it cannot be turned off afterwards.
    fr: |
      Le masquage dynamique des données s'active par compte dans Paramètres > Features, et l'option Masking Policy d'un conteneur n'apparaît qu'une fois la fonctionnalité activée. L'activation peut prendre jusqu'à 15 minutes et ne peut plus être annulée ensuite.
  options:
    a: { en: "The analytical store is not a prerequisite; it is not even supported by default on accounts with masking enabled.", fr: "Le magasin analytique n'est pas un prérequis ; il n'est même pas pris en charge par défaut sur les comptes où le masquage est activé." }
    b: { en: "The backup mode is unrelated to masking; backups contain the original, unmasked data.", fr: "Le mode de sauvegarde n'a pas de rapport avec le masquage ; les sauvegardes contiennent les données d'origine, non masquées." }
    c: { en: "The change feed mode is not a prerequisite for masking.", fr: "Le mode du flux de modification n'est pas un prérequis du masquage." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
