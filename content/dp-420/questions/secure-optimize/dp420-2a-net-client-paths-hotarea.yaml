id: dp420-2a-net-client-paths-hotarea
objective: "2.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **tailspin-bookings** has **publicNetworkAccess** set to **Enabled** with **Selected networks** and the following configuration:

    - IP firewall: 198.51.100.0/24
    - Virtual network rule: **VNet1/snet-app** (the Microsoft.AzureCosmosDB service endpoint is enabled on snet-app)
    - Private endpoint **pe1** in **VNet2/snet-pe**, with a private DNS zone linked to VNet2 only

    No other subnet has a service endpoint. The clients in the following table use a valid Microsoft Entra token.

    Answer each prompt by selecting the client.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **tailspin-bookings** a **publicNetworkAccess** défini sur **Enabled** avec **Selected networks** et la configuration suivante :

    - Pare-feu IP : 198.51.100.0/24
    - Règle de réseau virtuel : **VNet1/snet-app** (le point de terminaison de service Microsoft.AzureCosmosDB est activé sur snet-app)
    - Point de terminaison privé **pe1** dans **VNet2/snet-pe**, avec une zone DNS privée liée uniquement à VNet2

    Aucun autre sous-réseau n'a de point de terminaison de service. Les clients du tableau suivant utilisent un jeton Microsoft Entra valide.

    Répondez à chaque consigne en sélectionnant le client.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The client whose requests are rejected with 403 Forbidden", fr: "Le client dont les requêtes sont rejetées avec l'erreur 403 Forbidden" }
    - id: p2
      text: { en: "The client whose requests are allowed by the virtual network rule", fr: "Le client dont les requêtes sont autorisées par la règle de réseau virtuel" }
  grid:
    header: [ { en: "Client", fr: "Client" }, { en: "Location", fr: "Emplacement" }, { en: "Connectivity", fr: "Connectivité" } ]
    rows:
      - [ { text: Client1, area: c1 }, { text: { en: "On-premises office", fr: "Bureau local" } }, { text: { en: "Internet, public IP 198.51.100.25", fr: "Internet, IP publique 198.51.100.25" } } ]
      - [ { text: Client2, area: c2 }, { text: "VNet1/snet-app" }, { text: { en: "NAT gateway, public IP 20.30.40.50", fr: "Passerelle NAT, IP publique 20.30.40.50" } } ]
      - [ { text: Client3, area: c3 }, { text: "VNet1/snet-batch" }, { text: { en: "NAT gateway, public IP 20.30.40.50", fr: "Passerelle NAT, IP publique 20.30.40.50" } } ]
      - [ { text: Client4, area: c4 }, { text: "VNet2/snet-web" }, { text: { en: "Azure-provided DNS of VNet2", fr: "DNS fourni par Azure de VNet2" } } ]
answer:
  values: { p1: c3, p2: c2 }
explanation:
  correct:
    en: |
      Client3 is in a subnet without a service endpoint, so its requests arrive from the NAT gateway's public IP address, which is not in the IP firewall: they are rejected with 403. Client2 shares the same NAT gateway, but snet-app has the service endpoint, so its requests carry the subnet identity and match the virtual network rule. Client1 matches the IP rule, and Client4 resolves the account to pe1 through the private DNS zone linked to VNet2.
    fr: |
      Client3 se trouve dans un sous-réseau sans point de terminaison de service : ses requêtes arrivent depuis l'adresse IP publique de la passerelle NAT, qui ne figure pas dans le pare-feu IP, et sont rejetées avec l'erreur 403. Client2 partage la même passerelle NAT, mais snet-app a le point de terminaison de service : ses requêtes portent l'identité du sous-réseau et correspondent à la règle de réseau virtuel. Client1 correspond à la règle IP, et Client4 résout le compte vers pe1 grâce à la zone DNS privée liée à VNet2.
references:
  - title: Configure access to Azure Cosmos DB from virtual networks
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-vnet-service-endpoint
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
