id: dp420-sr2-alert-throttling-1
objective: "2.3.5"
type: series_yesno
series: dp420-sr2-alert-throttling
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You create a metric alert rule on Normalized RU Consumption.
  fr: |
    Vous créez une règle d'alerte de métrique sur Normalized RU Consumption.
body:
  solution:
    en: |
      You create a metric alert rule on cosmos-tail that uses the **Normalized RU Consumption** signal, filtered on the dimension **CollectionName** = `orders`, with the aggregation **Maximum**, the operator **Greater than or equal to** and a threshold of **100**, evaluated over 5 minutes. The rule uses an action group that emails the operations team.
    fr: |
      Vous créez sur cosmos-tail une règle d'alerte de métrique qui utilise le signal **Normalized RU Consumption**, filtré sur la dimension **CollectionName** = `orders`, avec l'agrégation **Maximum**, l'opérateur **Greater than or equal to** et un seuil de **100**, évaluée sur 5 minutes. La règle utilise un groupe d'actions qui envoie un e-mail à l'équipe des opérations.
answer: { value: false }
explanation:
  correct:
    en: |
      Normalized RU Consumption is a percentage: the maximum throughput utilization within a replica set over each minute. A threshold of 100 means that one partition was fully used, not that more than 100 requests were rate limited, so the rule does not measure the required condition.
    fr: |
      Normalized RU Consumption est un pourcentage : l'utilisation maximale du débit au sein d'un jeu de réplicas pour chaque minute. Un seuil de 100 signifie qu'une partition a été entièrement utilisée, et non que plus de 100 requêtes ont été limitées en débit : la règle ne mesure pas la condition demandée.
references:
