id: dp420-2c-qm-latency-knobs
objective: "2.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    A container named **products** has eight physical partitions. An application in the same Azure region as the account runs a cross-partition query by using the .NET SDK with the following options: `MaxConcurrency = 1` and `MaxBufferedItemCount = 10`.

    The query metrics show that the Retrieved Document Count is approximately equal to the Output Document Count, and the request charge (12 RUs) is acceptable. However, the end-to-end latency of the query is too high.

    Which two changes to `QueryRequestOptions` can reduce the latency without changing the query or the indexing policy? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un conteneur nommé **products** compte huit partitions physiques. Une application située dans la même région Azure que le compte exécute une requête entre partitions avec le SDK .NET et les options suivantes : `MaxConcurrency = 1` et `MaxBufferedItemCount = 10`.

    Les métriques de requête montrent que le Retrieved Document Count est à peu près égal à l'Output Document Count, et les frais de requête (12 RU) sont acceptables. Pourtant, la latence de bout en bout de la requête est trop élevée.

    Quelles sont les deux modifications de `QueryRequestOptions` qui peuvent réduire la latence sans modifier la requête ni la stratégie d'indexation ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set MaxConcurrency to 8.", fr: "Définir MaxConcurrency sur 8." } }
    - { id: b, text: { en: "Set PopulateIndexMetrics to true.", fr: "Définir PopulateIndexMetrics sur true." } }
    - { id: c, text: { en: "Set MaxBufferedItemCount to the expected number of results.", fr: "Définir MaxBufferedItemCount sur le nombre de résultats attendu." } }
    - { id: d, text: { en: "Set EnableScanInQuery to true.", fr: "Définir EnableScanInQuery sur true." } }
    - { id: e, text: { en: "Set ResponseContinuationTokenLimitInKb to 1.", fr: "Définir ResponseContinuationTokenLimitInKb sur 1." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "When the RU charge is acceptable but latency is still too high, the client-side options matter. Setting MaxConcurrency to the number of partitions lets the SDK query the partitions in parallel instead of one after another. Raising MaxBufferedItemCount to the expected result size lets the SDK pre-fetch more results while the application processes the current page."
    fr: "Lorsque les frais en RU sont acceptables mais que la latence reste trop élevée, ce sont les options côté client qui comptent. Définir MaxConcurrency sur le nombre de partitions permet au SDK d'interroger les partitions en parallèle plutôt que l'une après l'autre. Porter MaxBufferedItemCount à la taille de résultat attendue permet au SDK de prérécupérer davantage de résultats pendant que l'application traite la page en cours."
  options:
    b: { en: "Index metrics add overhead and only help to tune the indexing policy, which the requirement excludes.", fr: "Les métriques d'index ajoutent une surcharge et ne servent qu'à ajuster la stratégie d'indexation, ce que l'exigence exclut." }
    d: { en: "EnableScanInQuery only allows queries on paths excluded from indexing; it does not speed up indexed queries.", fr: "EnableScanInQuery autorise seulement les requêtes sur des chemins exclus de l'indexation ; il n'accélère pas les requêtes indexées." }
    e: { en: "Limiting the continuation token size can increase the overall duration and RUs of the query.", fr: "Limiter la taille du jeton de continuation peut augmenter la durée globale et les RU de la requête." }
references:
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
  - title: Tuning query performance with Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics
