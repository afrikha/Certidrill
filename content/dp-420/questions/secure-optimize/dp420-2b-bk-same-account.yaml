id: dp420-2b-bk-same-account
objective: "2.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has an Azure Cosmos DB for NoSQL account named **cosmos-wt-games** that uses continuous backup mode with the 30-day tier. An administrator deleted the **Leaderboards** container of the **GamesDb** database by mistake an hour ago. **GamesDb** still exists.

    You need to bring **Leaderboards** back with its data and its original name in **cosmos-wt-games**. The solution must minimize data transfer costs and administrative effort.

    What should you do?
  fr: |
    Wingtip dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wt-games** qui utilise le mode de sauvegarde continue avec le niveau 30 jours. Un administrateur a supprimé par erreur le conteneur **Leaderboards** de la base de données **GamesDb** il y a une heure. **GamesDb** existe toujours.

    Vous devez rétablir **Leaderboards** avec ses données et son nom d'origine dans **cosmos-wt-games**. La solution doit réduire au minimum les coûts de transfert de données et l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Restore the account into a new account, and then copy the container back with a container copy job.", fr: "Restaurer le compte dans un nouveau compte, puis recopier le conteneur avec une tâche de copie de conteneur." }
    - id: b
      text: { en: "Perform a same-account restore of the deleted container to a time before the deletion.", fr: "Effectuer une restauration dans le même compte du conteneur supprimé à un instant antérieur à la suppression." }
    - id: c
      text: { en: "Open a support request and ask the Azure Cosmos DB team to restore the container.", fr: "Ouvrir une demande de support et demander à l'équipe Azure Cosmos DB de restaurer le conteneur." }
    - id: d
      text: { en: "Re-create the container, and then replay its change feed from the beginning.", fr: "Recréer le conteneur, puis relire son flux de modification depuis le début." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      With continuous backup, a same-account (in-account) restore recreates a deleted container or shared-throughput database in the existing account, with the same name, to a point in time within the retention tier. Restoring into the existing account avoids the data transfer costs of a new account. The parent database must exist, which is the case here.
    fr: |
      Avec la sauvegarde continue, une restauration dans le même compte recrée un conteneur supprimé ou une base de données à débit partagé dans le compte existant, sous le même nom, à un instant compris dans le niveau de rétention. Restaurer dans le compte existant évite les coûts de transfert de données d'un nouveau compte. La base de données parente doit exister, ce qui est le cas ici.
  options:
    a: { en: "This works, but it creates a second account and copies the data, which adds data transfer costs and effort.", fr: "Cela fonctionne, mais crée un second compte et copie les données, ce qui ajoute des coûts de transfert et de l'effort." }
    c: { en: "Support requests are the restore path of periodic backup mode; continuous mode restores are self-service.", fr: "La demande de support est le chemin de restauration du mode périodique ; en mode continu, la restauration est en libre-service." }
    d: { en: "The change feed of a deleted container is gone with it, and a new container has no history to replay.", fr: "Le flux de modification d'un conteneur supprimé disparaît avec lui, et un nouveau conteneur n'a aucun historique à relire." }
references:
  - title: Same-account (in-account) restore for continuous backup
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/restore-in-account-continuous-backup-introduction
