id: dp420-2d-fa-chargeback-tool
objective: "2.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is an ISV that has 1,800 Azure Cosmos DB for NoSQL accounts, one per tenant, in 12 subscriptions. All the accounts belong to an Azure Cosmos DB fleet.

    The finance team needs a monthly Power BI report, covering the past year, that shows for each tenant account the units consumed per billing meter together with account settings such as the backup mode and the default consistency level. The solution must minimize development effort.

    What should you use?
  fr: |
    Proseware est un éditeur de logiciels (ISV) qui possède 1 800 comptes Azure Cosmos DB for NoSQL, un par locataire, dans 12 abonnements. Tous les comptes appartiennent à une flotte Azure Cosmos DB.

    L'équipe financière a besoin d'un rapport Power BI mensuel, couvrant l'année écoulée, qui montre pour chaque compte de locataire les unités consommées par compteur de facturation, ainsi que des paramètres du compte comme le mode de sauvegarde et le niveau de cohérence par défaut. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Azure Monitor metrics of each account, charted in Metrics explorer", fr: "Les métriques Azure Monitor de chaque compte, représentées dans l'explorateur de métriques" } }
    - { id: b, text: { en: "Diagnostic settings that send DataPlaneRequests from each account to Log Analytics", fr: "Des paramètres de diagnostic qui envoient DataPlaneRequests de chaque compte vers Log Analytics" } }
    - { id: c, text: { en: "Azure Cosmos DB Insights workbooks, opened on each account", fr: "Les classeurs Insights d'Azure Cosmos DB, ouverts sur chaque compte" } }
    - { id: d, text: { en: "Fleet analytics, sent to a Microsoft Fabric workspace", fr: "L'analytique de la flotte, envoyée vers un espace de travail Microsoft Fabric" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Fleet analytics consolidates usage, cost and configuration data of every account of the fleet into hourly Delta Lake tables, with a retention that you decide. FactMeterUsageHourly holds the consumed units per billing meter and FactAccountHourly holds settings such as the backup mode and the default consistency level. In Fabric, the SQL endpoint feeds Power BI directly.
    fr: |
      L'analytique de la flotte regroupe les données d'utilisation, de coût et de configuration de tous les comptes de la flotte dans des tables Delta Lake horaires, avec une rétention que vous choisissez. FactMeterUsageHourly contient les unités consommées par compteur de facturation et FactAccountHourly des paramètres comme le mode de sauvegarde et le niveau de cohérence par défaut. Dans Fabric, le point de terminaison SQL alimente directement Power BI.
  options:
    a: { en: "Metrics are per account and kept for 90 days, not a year, and they don't include billing meters or settings.", fr: "Les métriques sont propres à chaque compte et conservées 90 jours, pas un an, et n'incluent ni compteurs de facturation ni paramètres." }
    b: { en: "Resource logs record each request; they don't contain billing meters or account settings, and they add ingestion costs.", fr: "Les journaux de ressources enregistrent chaque requête ; ils ne contiennent ni compteurs de facturation ni paramètres de compte, et ajoutent des coûts d'ingestion." }
    c: { en: "Insights shows the metrics of one account at a time, with the 90-day retention of metrics.", fr: "Insights montre les métriques d'un compte à la fois, avec la rétention de 90 jours des métriques." }
references:
  - title: Fleet Analytics (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics
  - title: Fleet Analytics Schema Reference (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-analytics-schema-reference
