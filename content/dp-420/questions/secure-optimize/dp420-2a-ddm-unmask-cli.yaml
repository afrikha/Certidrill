id: dp420-2a-ddm-unmask-cli
objective: "2.1.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Dynamic data masking is configured on the container **cases** of the database **support** in an Azure Cosmos DB for NoSQL account named **litware-support**. The file `unmask-role.json` defines a custom data plane role that includes the `items/unmask` data action.

    You need to create the role and grant it to a managed identity whose principal ID is stored in `$miId`. The identity must see unmasked data in the cases container only. The role definition ID is stored in `$roleId` after the first command.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le masquage dynamique des données est configuré sur le conteneur **cases** de la base de données **support** d'un compte Azure Cosmos DB for NoSQL nommé **litware-support**. Le fichier `unmask-role.json` définit un rôle personnalisé du plan de données qui inclut l'action de données `items/unmask`.

    Vous devez créer le rôle et l'accorder à une identité managée dont l'ID de principal est stocké dans `$miId`. L'identité doit voir les données non masquées uniquement dans le conteneur cases. L'ID de la définition de rôle est stocké dans `$roleId` après la première commande.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    [[create]] \
      --account-name litware-support \
      --resource-group rg-support \
      --body "@unmask-role.json"

    az cosmosdb sql role assignment create \
      --account-name litware-support \
      --resource-group rg-support \
      --role-definition-id $roleId \
      --principal-id $miId \
      --scope [[scope]]
  slots:
    - id: create
      options:
        - { id: sqldef, text: "az cosmosdb sql role definition create" }
        - { id: azdef, text: "az role definition create" }
        - { id: update, text: "az cosmosdb update" }
    - id: scope
      options:
        - { id: coll, text: "\"/dbs/support/colls/cases\"" }
        - { id: db, text: "\"/dbs/support\"" }
        - { id: root, text: "\"/\"" }
answer:
  values: { create: sqldef, scope: coll }
explanation:
  correct:
    en: |
      Masking relies on native data plane RBAC, so the custom role is created with `az cosmosdb sql role definition create` and assigned with `az cosmosdb sql role assignment create`. The scope `/dbs/support/colls/cases` limits the unmask permission to the cases container.
    fr: |
      Le masquage s'appuie sur le RBAC natif du plan de données : le rôle personnalisé se crée avec `az cosmosdb sql role definition create` et s'attribue avec `az cosmosdb sql role assignment create`. L'étendue `/dbs/support/colls/cases` limite l'autorisation unmask au conteneur cases.
  options:
    azdef: { en: "az role definition create creates an Azure RBAC role, which cannot hold Cosmos DB data plane actions such as unmask for native RBAC.", fr: "az role definition create crée un rôle Azure RBAC, qui ne peut pas porter d'actions natives du plan de données Cosmos DB comme unmask." }
    update: { en: "az cosmosdb update changes account properties; it does not create role definitions.", fr: "az cosmosdb update modifie les propriétés du compte ; il ne crée pas de définitions de rôle." }
    db: { en: "/dbs/support would unmask every container of the database.", fr: "/dbs/support démasquerait tous les conteneurs de la base de données." }
    root: { en: "/ would unmask every container of the account.", fr: "/ démasquerait tous les conteneurs du compte." }
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
