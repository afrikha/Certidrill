id: dp420-sr2-ddm-employees-3
objective: "2.1.4"
type: series_yesno
series: dp420-sr2-ddm-employees
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You include email and salary without a strategy and assign Cosmos DB Built-in Data Reader.
  fr: |
    Vous incluez email et salary sans stratégie et attribuez Cosmos DB Built-in Data Reader.
body:
  solution:
    en: |
      You apply the following masking policy to `employees`. You then assign the **Cosmos DB Built-in Data Reader** data plane role to support-id at the scope `/dbs/hr/colls/employees`.

      ```json
      {
        "includedPaths": [
          { "path": "/email" },
          { "path": "/salary" }
        ]
      }
      ```
    fr: |
      Vous appliquez la stratégie de masquage suivante à `employees`. Vous attribuez ensuite le rôle de plan de données **Cosmos DB Built-in Data Reader** à support-id à l'étendue `/dbs/hr/colls/employees`.

      ```json
      {
        "includedPaths": [
          { "path": "/email" },
          { "path": "/salary" }
        ]
      }
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      A path without a strategy uses the default mask, which replaces a string with `XXXX`. support-id would see `XXXX` instead of a value such as `aXXXX@XXXXXXXXX.com`; only the Email strategy keeps the first letter of the user name and the domain ending. The role assignment itself is correct.
    fr: |
      Un chemin sans stratégie utilise le masque par défaut, qui remplace une chaîne par `XXXX`. support-id verrait `XXXX` au lieu d'une valeur telle que `aXXXX@XXXXXXXXX.com` ; seule la stratégie Email conserve la première lettre du nom d'utilisateur et la fin du domaine. L'attribution de rôle est en elle-même correcte.
references:
  - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
