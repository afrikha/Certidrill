id: dp420-2d-log-fulltext-query
objective: "2.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip has an Azure Cosmos DB for NoSQL account named **cosmos-wingtip**. A diagnostic setting sends the **QueryRuntimeStatistics** category to a Log Analytics workspace by using resource-specific tables.

    In the `CDBQueryRuntimeStatistics` table, the `QueryText` column shows the structure of each query, but the literal values and parameter values are hidden. During a two-day troubleshooting session, you need the logs to show the complete text of the queries.

    What should you do?
  fr: |
    Wingtip dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-wingtip**. Un paramètre de diagnostic envoie la catégorie **QueryRuntimeStatistics** vers un espace de travail Log Analytics en utilisant des tables spécifiques aux ressources.

    Dans la table `CDBQueryRuntimeStatistics`, la colonne `QueryText` montre la structure de chaque requête, mais les valeurs littérales et les valeurs des paramètres sont masquées. Pendant une session de dépannage de deux jours, vous devez faire en sorte que les journaux affichent le texte complet des requêtes.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set PopulateIndexMetrics to true in the QueryRequestOptions of the application.", fr: "Définir PopulateIndexMetrics sur true dans les QueryRequestOptions de l'application." } }
    - { id: b, text: { en: "Change the destination table mode of the diagnostic setting to Azure diagnostics.", fr: "Changer le mode de table de destination du paramètre de diagnostic en Diagnostics Azure." } }
    - { id: c, text: { en: "Enable the Diagnostics full-text query feature in the Features settings of the account.", fr: "Activer la fonctionnalité Diagnostics full-text query dans les paramètres Fonctionnalités du compte." } }
    - { id: d, text: { en: "Add the DataPlaneRequests category to the existing diagnostic setting of the account.", fr: "Ajouter la catégorie DataPlaneRequests au paramètre de diagnostic existant du compte." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Query text and parameters are obfuscated in the logs by default. Enabling Diagnostics full-text query (account > Settings > Features) makes newly ingested logs contain the full query text. It can increase logging costs, so Microsoft recommends disabling it after troubleshooting.
    fr: |
      Le texte des requêtes et leurs paramètres sont masqués par défaut dans les journaux. Activer Diagnostics full-text query (compte > Paramètres > Fonctionnalités) fait apparaître le texte complet des requêtes dans les journaux nouvellement ingérés. Cela peut augmenter les coûts de journalisation : Microsoft recommande donc de le désactiver après le dépannage.
  options:
    a: { en: "Index metrics are returned to the SDK caller to tune indexing; they don't change what is logged.", fr: "Les métriques d'index sont renvoyées à l'appelant du SDK pour ajuster l'indexation ; elles ne changent pas ce qui est journalisé." }
    b: { en: "The table mode only decides where the logs are stored; the query text stays obfuscated in both modes.", fr: "Le mode de table décide seulement où les journaux sont stockés ; le texte des requêtes reste masqué dans les deux modes." }
    d: { en: "DataPlaneRequests records each operation and its charge; it doesn't contain the query text.", fr: "DataPlaneRequests enregistre chaque opération et sa charge ; il ne contient pas le texte des requêtes." }
references:
  - title: Monitor Data using Diagnostic Settings - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-resource-logs
