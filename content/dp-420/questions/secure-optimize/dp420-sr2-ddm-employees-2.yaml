id: dp420-sr2-ddm-employees-2
objective: "2.1.4"
type: series_yesno
series: dp420-sr2-ddm-employees
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You mask email with the Email strategy and assign Cosmos DB Built-in Data Contributor.
  fr: |
    Vous masquez email avec la stratégie Email et attribuez Cosmos DB Built-in Data Contributor.
body:
  solution:
    en: |
      You apply the following masking policy to `employees`. You then assign the **Cosmos DB Built-in Data Contributor** data plane role to support-id at the scope `/dbs/hr/colls/employees`.

      ```json
      {
        "includedPaths": [
          { "path": "/email", "strategy": "Email" },
          { "path": "/salary" }
        ]
      }
      ```
    fr: |
      Vous appliquez la stratégie de masquage suivante à `employees`. Vous attribuez ensuite le rôle de plan de données **Cosmos DB Built-in Data Contributor** à support-id à l'étendue `/dbs/hr/colls/employees`.

      ```json
      {
        "includedPaths": [
          { "path": "/email", "strategy": "Email" },
          { "path": "/salary" }
        ]
      }
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Cosmos DB Built-in Data Contributor includes `items/*`, which covers the write actions and `items/unmask`. support-id would therefore see `email` and `salary` unmasked and could create, replace and delete items, which breaks both requirements.
    fr: |
      Cosmos DB Built-in Data Contributor inclut `items/*`, qui couvre les actions d'écriture et `items/unmask`. support-id verrait donc `email` et `salary` sans masquage et pourrait créer, remplacer et supprimer des éléments, ce qui enfreint les deux exigences.
references:
  - title: Dynamic Data Masking (DDM) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
  - title: Data plane security reference - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
