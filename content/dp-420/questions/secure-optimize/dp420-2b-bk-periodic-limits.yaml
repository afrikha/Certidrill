id: dp420-2b-bk-periodic-limits
objective: "2.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Northwind has an Azure Cosmos DB for NoSQL account named **cosmos-nw-catalog** that uses periodic backup mode. The account stores the product catalog of a Python web application. The operations team plans to review the backup policy of the account.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-nw-catalog** qui utilise le mode de sauvegarde périodique. Le compte stocke le catalogue de produits d'une application web Python. L'équipe d'exploitation prévoit de revoir la stratégie de sauvegarde du compte.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |
          You can set the backup interval of the account to 30 minutes.
        fr: |
          Vous pouvez définir l'intervalle de sauvegarde du compte sur 30 minutes.
    - id: s2
      text:
        en: |
          If the backup interval is 12 hours, the shortest retention you can configure is 24 hours.
        fr: |
          Si l'intervalle de sauvegarde est de 12 heures, la rétention la plus courte que vous pouvez configurer est de 24 heures.
    - id: s3
      text:
        en: |
          A change of the backup storage redundancy applies only to backups taken after the change.
        fr: |
          Une modification de la redondance du stockage des sauvegardes ne s'applique qu'aux sauvegardes effectuées après la modification.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      In periodic mode, the backup interval must be between 1 and 24 hours, so 30 minutes is rejected. The retention must be at least twice the interval (24 hours for a 12-hour interval) and at most 720 hours. A new backup storage redundancy setting applies only to future backups, and existing backups may stop being available for restore.
    fr: |
      En mode périodique, l'intervalle de sauvegarde doit être compris entre 1 et 24 heures : 30 minutes est refusé. La rétention doit valoir au moins deux fois l'intervalle (24 heures pour un intervalle de 12 heures) et au plus 720 heures. Un nouveau paramètre de redondance du stockage des sauvegardes ne s'applique qu'aux sauvegardes futures, et les sauvegardes existantes peuvent ne plus être disponibles pour la restauration.
references:
  - title: Modify periodic backup interval and retention period
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-modify-interval-retention
