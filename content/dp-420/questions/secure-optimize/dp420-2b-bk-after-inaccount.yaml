id: dp420-2b-bk-after-inaccount
objective: "2.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account that uses continuous backup mode. A C# worker uses the change feed processor to copy the changes of a container named **Shipments** to a search index. The processor stores its state in a lease container named **leases**.

    **Shipments** was deleted by mistake, and you restored it in the same account by using a same-account restore. The worker must process the restored data correctly.

    What should you do?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL qui utilise le mode de sauvegarde continue. Un worker C# utilise le processeur de flux de modification pour copier les modifications d'un conteneur nommé **Shipments** vers un index de recherche. Le processeur stocke son état dans un conteneur de bail nommé **leases**.

    **Shipments** a été supprimé par erreur, et vous l'avez restauré dans le même compte par une restauration dans le même compte. Le worker doit traiter correctement les données restaurées.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Keep the worker and the leases unchanged, because the processor resumes from its saved continuation tokens.", fr: "Conserver le worker et les baux inchangés, car le processeur reprend à partir de ses jetons de continuation enregistrés." }
    - id: b
      text: { en: "Keep the worker unchanged, because the restored container replays its change feed from before the deletion.", fr: "Conserver le worker inchangé, car le conteneur restauré rejoue son flux de modification d'avant la suppression." }
    - id: c
      text: { en: "Restart the SDK clients and start the change feed processing of the restored container from the beginning.", fr: "Redémarrer les clients SDK et reprendre le traitement du flux de modification du conteneur restauré depuis le début." }
    - id: d
      text: { en: "Rename the restored container, because a restored container gets a new name and a new resource ID.", fr: "Renommer le conteneur restauré, car un conteneur restauré reçoit un nouveau nom et un nouvel ID de ressource." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A resource restored in the same account is treated as a new resource. Its existing session and continuation tokens become invalid, so you restart the SDK clients, and its change feed only contains events from after the restore, so the processing must restart from the beginning of the restored container.
    fr: |
      Une ressource restaurée dans le même compte est traitée comme une nouvelle ressource. Ses jetons de session et de continuation existants deviennent invalides : vous redémarrez les clients SDK. Son flux de modification ne contient que les événements postérieurs à la restauration : le traitement doit reprendre depuis le début du conteneur restauré.
  options:
    a: { en: "The continuation tokens saved in the leases refer to the deleted container and are no longer valid.", fr: "Les jetons de continuation enregistrés dans les baux font référence au conteneur supprimé et ne sont plus valides." }
    b: { en: "Change feed events from before the deletion aren't propagated to the restored container.", fr: "Les événements du flux de modification antérieurs à la suppression ne sont pas propagés au conteneur restauré." }
    d: { en: "The restored container keeps the same name and resourceId; only a restore instance identifier distinguishes it.", fr: "Le conteneur restauré conserve le même nom et le même resourceId ; seul un identificateur d'instance de restauration le distingue." }
references:
  - title: Same-account (in-account) restore for continuous backup
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/restore-in-account-continuous-backup-introduction
