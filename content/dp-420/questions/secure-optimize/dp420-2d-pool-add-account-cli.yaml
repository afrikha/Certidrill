id: dp420-2d-pool-add-account-cli
objective: "2.4.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB fleet named **fleet-tailspin** in a resource group named **rg-saas**, with a fleetspace named **fs-std**. A new tenant has an Azure Cosmos DB for NoSQL account named **cosmos-tenant-117** in a resource group named **rg-tenant-117** of a subscription named **sub-tenants** that you can access.

    You need to add the account to fs-std by using the Azure CLI.

    How should you complete the commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dispose d'une flotte Azure Cosmos DB nommée **fleet-tailspin** dans un groupe de ressources nommé **rg-saas**, avec un fleetspace nommé **fs-std**. Un nouveau locataire dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-tenant-117** dans un groupe de ressources nommé **rg-tenant-117** d'un abonnement nommé **sub-tenants** auquel vous avez accès.

    Vous devez ajouter le compte à fs-std avec Azure CLI.

    Comment devez-vous compléter les commandes ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    accountId=$(az resource show --subscription sub-tenants \
      --resource-group rg-tenant-117 --name cosmos-tenant-117 \
      --resource-type "Microsoft.DocumentDB/databaseAccounts" \
      --query [[q]] --output tsv)

    az resource create --resource-group rg-saas \
      --name "fleet-tailspin/fleetspaces/fs-std/fleetspaceAccounts/tenant-117" \
      --resource-type "Microsoft.DocumentDB/fleets/fleetspaces/fleetspaceAccounts" \
      --location westeurope [[flag]] \
      --properties "{\"accountLocation\":\"westeurope\",\"[[prop]]\":\"$accountId\"}"
  slots:
    - id: q
      options:
        - { id: qid, text: id }
        - { id: qname, text: name }
        - { id: qend, text: properties.documentEndpoint }
    - id: flag
      options:
        - { id: fprev, text: "--latest-include-preview" }
        - { id: ffull, text: "--is-full-object" }
        - { id: fold, text: "--api-version 2021-04-15" }
    - id: prop
      options:
        - { id: pari, text: accountResourceIdentifier }
        - { id: papi, text: fleetspaceAPIKind }
        - { id: ploc, text: accountLocation }
answer:
  values: { q: qid, flag: fprev, prop: pari }
explanation:
  correct:
    en: |
      A fleetspace account is a child resource of the fleetspace; fleets are in preview, so the generic az resource commands need --latest-include-preview to use the preview API version. Its accountResourceIdentifier property takes the fully qualified resource ID of the existing account, which can be in any subscription or resource group, and accountLocation takes the account's location.
    fr: |
      Un compte de fleetspace est une ressource enfant du fleetspace ; les flottes sont en préversion : les commandes génériques az resource ont donc besoin de --latest-include-preview pour utiliser la version d'API en préversion. Sa propriété accountResourceIdentifier reçoit l'ID de ressource complet du compte existant, qui peut se trouver dans n'importe quel abonnement ou groupe de ressources, et accountLocation reçoit l'emplacement du compte.
  options:
    qname: { en: "The account name alone doesn't identify an account in another subscription and resource group.", fr: "Le seul nom du compte n'identifie pas un compte dans un autre abonnement et un autre groupe de ressources." }
    qend: { en: "The document endpoint is the data plane URI, not the resource ID that the fleet needs.", fr: "Le point de terminaison de documents est l'URI du plan de données, pas l'ID de ressource dont la flotte a besoin." }
    ffull: { en: "--is-full-object means that --properties contains the whole resource object, including its location; it doesn't select a preview API version.", fr: "--is-full-object indique que --properties contient l'objet de ressource complet, y compris son emplacement ; il ne sélectionne pas une version d'API en préversion." }
    fold: { en: "An API version from 2021 predates the fleet resource types.", fr: "Une version d'API de 2021 est antérieure aux types de ressources de flotte." }
    papi: { en: "fleetspaceAPIKind is a property of the fleetspace, set to NoSQL when it is created.", fr: "fleetspaceAPIKind est une propriété du fleetspace, définie sur NoSQL lors de sa création." }
    ploc: { en: "accountLocation is already set in the payload and takes a region, not a resource ID.", fr: "accountLocation est déjà défini dans la charge utile et reçoit une région, pas un ID de ressource." }
references:
  - title: Create a Fleet (Preview) - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-create-fleet
