id: dp420-2a-ddm-features-behavior
objective: "2.1.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Contoso enables dynamic data masking on an Azure Cosmos DB for NoSQL account named **contoso-health** and applies a masking policy that includes `/` to a container named **visits**. The account uses continuous backup, and a materialized view is built from the visits container.

    An analytics service runs under an identity that has the Cosmos DB Built-in Data Reader role.

    What happens in each case? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso active le masquage dynamique des données sur un compte Azure Cosmos DB for NoSQL nommé **contoso-health** et applique une stratégie de masquage qui inclut `/` à un conteneur nommé **visits**. Le compte utilise la sauvegarde continue, et une vue matérialisée est construite à partir du conteneur visits.

    Un service d'analytique s'exécute sous une identité qui a le rôle Cosmos DB Built-in Data Reader.

    Que se passe-t-il dans chaque cas ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Data stored in the continuous backups of visits: [[backup]]

      Data written to the materialized view: [[view]]

      Change feed of visits read by the analytics service: [[feed]]
    fr: |
      Données stockées dans les sauvegardes continues de visits : [[backup]]

      Données écrites dans la vue matérialisée : [[view]]

      Flux de modification de visits lu par le service d'analytique : [[feed]]
  slots:
    - id: backup
      options:
        - { id: borig, text: { en: "Original values", fr: "Valeurs d'origine" } }
        - { id: bmask, text: { en: "Masked values", fr: "Valeurs masquées" } }
        - { id: bnone, text: { en: "Not available", fr: "Non disponible" } }
    - id: view
      options:
        - { id: vorig, text: { en: "Original values", fr: "Valeurs d'origine" } }
        - { id: vmask, text: { en: "Masked values", fr: "Valeurs masquées" } }
        - { id: vnone, text: { en: "Not available", fr: "Non disponible" } }
    - id: feed
      options:
        - { id: forig, text: { en: "Original values", fr: "Valeurs d'origine" } }
        - { id: fmask, text: { en: "Masked values", fr: "Valeurs masquées" } }
        - { id: fnone, text: { en: "Not available", fr: "Non disponible" } }
answer:
  values: { backup: borig, view: vorig, feed: fnone }
explanation:
  correct:
    en: |
      Backups, periodic or continuous, and materialized views operate on the original, unmasked data. The change feed, in latest version mode and in all versions and deletes mode, is not available to identities without the unmask permission, such as holders of the built-in Data Reader role.
    fr: |
      Les sauvegardes, périodiques ou continues, et les vues matérialisées fonctionnent sur les données d'origine, non masquées. Le flux de modification, en mode version la plus récente comme en mode toutes versions et suppressions, n'est pas disponible pour les identités qui n'ont pas l'autorisation unmask, comme les détenteurs du rôle intégré Data Reader.
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
