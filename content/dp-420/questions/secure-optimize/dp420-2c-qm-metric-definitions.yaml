id: dp420-2c-qm-metric-definitions
objective: "2.3.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    You are reviewing the query execution metrics that the Azure Cosmos DB .NET SDK returns in `ServerSideMetrics` for a slow page of results.

    Which metric should you read for each piece of information? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez les métriques d'exécution de requête que le SDK .NET Azure Cosmos DB renvoie dans `ServerSideMetrics` pour une page de résultats lente.

    Quelle métrique devez-vous lire pour chaque information ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Time spent loading items from storage: [[load]]

      Number of items returned in the result set: [[out]]

      Ratio of items matched by the filter to items loaded: [[ratio]]
    fr: |
      Temps passé à charger les éléments depuis le stockage : [[load]]

      Nombre d'éléments renvoyés dans le jeu de résultats : [[out]]

      Rapport entre les éléments correspondant au filtre et les éléments chargés : [[ratio]]
  slots:
    - id: load
      options:
        - { id: lookup, text: IndexLookupTime }
        - { id: docload, text: DocumentLoadTime }
        - { id: runtime, text: RuntimeExecutionTime }
        - { id: write, text: DocumentWriteTime }
    - id: out
      options:
        - { id: retrieved, text: RetrievedDocumentCount }
        - { id: outsize, text: OutputDocumentSize }
        - { id: output, text: OutputDocumentCount }
    - id: ratio
      options:
        - { id: hit, text: IndexHitRatio }
        - { id: vm, text: VMExecutionTime }
        - { id: retsize, text: RetrievedDocumentSize }
answer:
  values: { load: docload, out: output, ratio: hit }
explanation:
  correct:
    en: "`DocumentLoadTime` is the time spent loading documents, `OutputDocumentCount` is the number of documents in the result set, and `IndexHitRatio` (a value between 0 and 1) is the ratio of documents matched by the filter to documents loaded. A large `DocumentLoadTime` with a low `IndexHitRatio` usually means that the query loaded many items it did not need."
    fr: "`DocumentLoadTime` est le temps passé à charger les documents, `OutputDocumentCount` le nombre de documents du jeu de résultats et `IndexHitRatio` (valeur entre 0 et 1) le rapport entre les documents correspondant au filtre et les documents chargés. Un `DocumentLoadTime` élevé avec un `IndexHitRatio` faible indique en général que la requête a chargé de nombreux éléments inutiles."
  options:
    lookup: { en: "IndexLookupTime is the time spent in the physical index layer, not loading items.", fr: "IndexLookupTime est le temps passé dans la couche d'index physique, pas le chargement des éléments." }
    retrieved: { en: "RetrievedDocumentCount counts the items loaded by the query engine, not the items returned.", fr: "RetrievedDocumentCount compte les éléments chargés par le moteur de requête, pas les éléments renvoyés." }
    outsize: { en: "OutputDocumentSize is the size in bytes of the result, not a number of items.", fr: "OutputDocumentSize est la taille en octets du résultat, pas un nombre d'éléments." }
references:
  - title: Tuning query performance with Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics
