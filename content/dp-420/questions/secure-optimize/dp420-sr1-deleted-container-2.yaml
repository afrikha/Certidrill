stem:
  en: You migrate the account to continuous backup and specify the Continuous7Days tier.
  fr: Vous migrez le compte vers la sauvegarde continue en spécifiant le niveau Continuous7Days.
body:
  solution:
    en: |
      You run the following command:

      ```bash
      az cosmosdb update \
          --resource-group rg-wg \
          --name cosmos-wg \
          --backup-policy-type Continuous \
          --continuous-tier Continuous7Days
      ```
    fr: |
      Vous exécutez la commande suivante :

      ```bash
      az cosmosdb update \
          --resource-group rg-wg \
          --name cosmos-wg \
          --backup-policy-type Continuous \
          --continuous-tier Continuous7Days
      ```
answer: { value: true }
explanation:
  correct:
    en: Continuous backup mode provides self-service point-in-time restore of an account, a database, or a container from the Azure portal, the Azure CLI, or PowerShell, to any timestamp within the retention period. The 7-day tier covers the required window and has no backup storage charge; only each restore is billed. The migration from periodic mode is one-way.
    fr: "Le mode de sauvegarde continue offre une restauration à un instant dans le passé en libre-service d'un compte, d'une base de données ou d'un conteneur, depuis le portail Azure, Azure CLI ou PowerShell, vers n'importe quel horodatage de la période de rétention. Le niveau de 7 jours couvre la fenêtre requise et n'entraîne aucun frais de stockage de sauvegarde : seule chaque restauration est facturée. La migration depuis le mode périodique est irréversible."
references:
  - title: Continuous Backup with Point-in-Time Restore - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Migrate From Periodic to Continuous Backup Mode - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/migrate-continuous-backup
