id: dp420-2a-authz-operator-role
objective: "2.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    The platform team of Tailspin Toys manages an Azure Cosmos DB for NoSQL account named **tailspin-games**. The team must be able to change account settings such as regions and consistency, and create or update containers through Azure Resource Manager.

    The team must not be able to read item data, list the account keys or retrieve the connection strings. You need to use a built-in role and follow the principle of least privilege.

    Which role should you assign to the team?
  fr: |
    L'équipe plateforme de Tailspin Toys gère un compte Azure Cosmos DB for NoSQL nommé **tailspin-games**. L'équipe doit pouvoir modifier les paramètres du compte, comme les régions et la cohérence, et créer ou mettre à jour des conteneurs via Azure Resource Manager.

    L'équipe ne doit pas pouvoir lire les données des éléments, lister les clés du compte ni récupérer les chaînes de connexion. Vous devez utiliser un rôle intégré et respecter le principe du moindre privilège.

    Quel rôle devez-vous attribuer à l'équipe ?
body:
  options:
    - { id: a, text: "DocumentDB Account Contributor" }
    - { id: b, text: "Cosmos DB Operator" }
    - { id: c, text: "Cosmos DB Account Reader Role" }
    - { id: d, text: "Cosmos DB Built-in Data Contributor" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Cosmos DB Operator lets you manage Azure Cosmos DB accounts but not access their data. Its NotActions remove listKeys, readonlyKeys, regenerateKey and listConnectionStrings, so the team cannot obtain a key to reach the data.
    fr: |
      Cosmos DB Operator permet de gérer les comptes Azure Cosmos DB sans accéder à leurs données. Ses NotActions retirent listKeys, readonlyKeys, regenerateKey et listConnectionStrings : l'équipe ne peut pas obtenir de clé pour atteindre les données.
  options:
    a: { en: "DocumentDB Account Contributor grants Microsoft.DocumentDb/databaseAccounts/* with no NotActions, so it can list the keys.", fr: "DocumentDB Account Contributor accorde Microsoft.DocumentDb/databaseAccounts/* sans NotActions : il peut donc lister les clés." }
    c: { en: "Cosmos DB Account Reader Role is read-only and can read the read-only keys; it cannot change settings.", fr: "Cosmos DB Account Reader Role est en lecture seule et peut lire les clés en lecture seule ; il ne peut pas modifier les paramètres." }
    d: { en: "Built-in Data Contributor is a data plane role: it reads and writes items and cannot manage the account.", fr: "Built-in Data Contributor est un rôle du plan de données : il lit et écrit des éléments et ne peut pas gérer le compte." }
references:
  - title: Azure built-in roles for Databases
    url: https://learn.microsoft.com/en-us/azure/role-based-access-control/built-in-roles/databases
