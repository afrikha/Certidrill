id: dp420-2c-qm-query-advice
objective: "2.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Your team uses the Azure Cosmos DB .NET SDK. During code reviews, developers want the service to return recommendations that explain which parts of a query text could be rewritten to lower its RU charge, for example replacing a system function with a more efficient one.

    You need to add this capability to the query helper of the application.

    What should you do?
  fr: |
    Votre équipe utilise le SDK .NET Azure Cosmos DB. Lors des revues de code, les développeurs veulent que le service renvoie des recommandations qui expliquent quelles parties du texte d'une requête pourraient être réécrites pour réduire ses frais en RU, par exemple en remplaçant une fonction système par une fonction plus efficace.

    Vous devez ajouter cette capacité à l'assistant de requêtes de l'application.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Set PopulateQueryAdvice to true and read FeedResponse.QueryAdvice from the first page.", fr: "Définir PopulateQueryAdvice sur true et lire FeedResponse.QueryAdvice dans la première page." }
    - id: b
      text: { en: "Set PopulateQueryAdvice to true and read FeedResponse.QueryAdvice from the last page.", fr: "Définir PopulateQueryAdvice sur true et lire FeedResponse.QueryAdvice dans la dernière page." }
    - id: c
      text: { en: "Set PopulateIndexMetrics to true and read FeedResponse.IndexMetrics from the first page.", fr: "Définir PopulateIndexMetrics sur true et lire FeedResponse.IndexMetrics dans la première page." }
    - id: d
      text: { en: "Call Diagnostics.GetQueryMetrics() on the first page and read CumulativeMetrics.IndexHitRatio.", fr: "Appeler Diagnostics.GetQueryMetrics() sur la première page et lire CumulativeMetrics.IndexHitRatio." }
answer: { optionId: a }
explanation:
  correct:
    en: "Query Advisor is enabled by setting `PopulateQueryAdvice` to `true` in `QueryRequestOptions`, and the advice is exposed as the string property `FeedResponse.QueryAdvice`. Each advice has an ID (such as QA1002), a description of the suggested rewrite and a documentation link. The advice is returned only on the first round trip, not on continuation calls."
    fr: "Query Advisor s'active en définissant `PopulateQueryAdvice` sur `true` dans `QueryRequestOptions`, et les conseils sont exposés par la propriété de type chaîne `FeedResponse.QueryAdvice`. Chaque conseil comporte un identifiant (par exemple QA1002), une description de la réécriture proposée et un lien vers la documentation. Les conseils ne sont renvoyés qu'au premier aller-retour, pas lors des appels de continuation."
  options:
    b: { en: "The advice is unavailable on continuation calls, so the last page of a multi-page query does not contain it.", fr: "Les conseils ne sont pas disponibles lors des appels de continuation : la dernière page d'une requête multipage ne les contient pas." }
    c: { en: "Index metrics report used and potential indexed paths; they do not suggest rewrites of the query text.", fr: "Les métriques d'index indiquent les chemins indexés utilisés et potentiels ; elles ne proposent pas de réécriture du texte de la requête." }
    d: { en: "IndexHitRatio is a number that measures index efficiency; it gives no rewrite recommendation.", fr: "IndexHitRatio est un nombre qui mesure l'efficacité de l'index ; il ne donne aucune recommandation de réécriture." }
references:
  - title: Query Advisor for Cosmos DB
    url: https://learn.microsoft.com/en-us/cosmos-db/query/advisor
