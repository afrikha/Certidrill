id: dp420-2a-net-service-endpoint-migration
objective: "2.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Virtual machines in a subnet named **snet-app** reach an Azure Cosmos DB for NoSQL account named **litware-orders** through a NAT gateway. The account's IP firewall allows the public IP address of the NAT gateway.

    You plan to enable the **Microsoft.AzureCosmosDB** service endpoint on snet-app and allow the subnet with a virtual network rule. The applications on the virtual machines must not lose access to the account at any point.

    What should you do first?
  fr: |
    Les machines virtuelles d'un sous-réseau nommé **snet-app** atteignent un compte Azure Cosmos DB for NoSQL nommé **litware-orders** via une passerelle NAT. Le pare-feu IP du compte autorise l'adresse IP publique de la passerelle NAT.

    Vous prévoyez d'activer le point de terminaison de service **Microsoft.AzureCosmosDB** sur snet-app et d'autoriser le sous-réseau avec une règle de réseau virtuel. Les applications des machines virtuelles ne doivent à aucun moment perdre l'accès au compte.

    Que devez-vous faire en premier ?
body:
  options:
    - { id: a, text: { en: "Enable the Microsoft.AzureCosmosDB service endpoint on snet-app, and then add the virtual network rule.", fr: "Activer le point de terminaison de service Microsoft.AzureCosmosDB sur snet-app, puis ajouter la règle de réseau virtuel." } }
    - { id: b, text: { en: "Remove the IP firewall rule of the NAT gateway so that the subnet traffic is evaluated by virtual network rules only.", fr: "Supprimer la règle de pare-feu IP de la passerelle NAT pour que le trafic du sous-réseau soit évalué uniquement par les règles de réseau virtuel." } }
    - { id: c, text: { en: "Add a virtual network rule for snet-app on the account, accepting that the service endpoint is not enabled yet.", fr: "Ajouter sur le compte une règle de réseau virtuel pour snet-app, en acceptant que le point de terminaison de service ne soit pas encore activé." } }
    - { id: d, text: { en: "Enable Accept connections from within public Azure datacenters until the service endpoint is enabled.", fr: "Activer l'option Accept connections from within public Azure datacenters jusqu'à l'activation du point de terminaison de service." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Once the service endpoint is enabled, requests from the subnet carry the virtual network and subnet identity instead of the public IP address, so the IP rule no longer matches them. Adding the virtual network rule first (with `--ignore-missing-vnet-service-endpoint` when the endpoint is not enabled yet), then enabling the endpoint, and finally removing the IP rule keeps access continuous.
    fr: |
      Une fois le point de terminaison de service activé, les requêtes du sous-réseau portent l'identité du réseau virtuel et du sous-réseau au lieu de l'adresse IP publique : la règle IP ne leur correspond plus. Ajouter d'abord la règle de réseau virtuel (avec `--ignore-missing-vnet-service-endpoint` quand le point de terminaison n'est pas encore activé), puis activer le point de terminaison et enfin supprimer la règle IP garantit un accès continu.
  options:
    a: { en: "Between enabling the endpoint and adding the rule, requests carry the subnet identity, fail the IP rule and are rejected with 403.", fr: "Entre l'activation du point de terminaison et l'ajout de la règle, les requêtes portent l'identité du sous-réseau, ne correspondent plus à la règle IP et sont rejetées avec l'erreur 403." }
    b: { en: "Removing the IP rule first blocks the current traffic, which still arrives from the NAT gateway's public IP address.", fr: "Supprimer d'abord la règle IP bloque le trafic actuel, qui arrive encore de l'adresse IP publique de la passerelle NAT." }
    d: { en: "This opens the account to every Azure datacenter, including other customers, and is not part of a migration to a virtual network rule.", fr: "Cette option ouvre le compte à tous les centres de données Azure, y compris ceux d'autres clients, et ne fait pas partie d'une migration vers une règle de réseau virtuel." }
references:
  - title: Configure access to Azure Cosmos DB from virtual networks
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-vnet-service-endpoint
