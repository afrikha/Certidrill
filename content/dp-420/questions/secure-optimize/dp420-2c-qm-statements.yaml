id: dp420-2c-qm-statements
objective: "2.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    You are analyzing the performance of queries that an application runs against a container named **catalog** by using the Azure Cosmos DB .NET SDK. Most queries return several pages.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous analysez les performances des requêtes qu'une application exécute sur un conteneur nommé **catalog** avec le SDK .NET Azure Cosmos DB. La plupart des requêtes renvoient plusieurs pages.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: To obtain the total server-side execution time of a multi-page query, you must add up the query metrics of every page.
        fr: Pour obtenir le temps d'exécution total côté serveur d'une requête multipage, vous devez additionner les métriques de requête de chaque page.
    - id: s2
      text:
        en: The RequestCharge property of each FeedResponse<T> returns the cumulative charge of all the pages that the iterator has read so far.
        fr: La propriété RequestCharge de chaque FeedResponse<T> renvoie les frais cumulés de toutes les pages lues jusqu'ici par l'itérateur.
    - id: s3
      text:
        en: For SELECT TOP 50 * FROM c, a Retrieved Document Count of 51 with an Output Document Count of 50 shows that part of the query could not use the index.
        fr: Pour SELECT TOP 50 * FROM c, un Retrieved Document Count de 51 avec un Output Document Count de 50 montre qu'une partie de la requête n'a pas pu utiliser l'index.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: Each page (continuation) of a query returns its own query metrics, so totals across the query are obtained by aggregating the metrics of all round trips. The RequestCharge of a FeedResponse is the charge of that round trip only; you sum the pages to get the cost of the whole query. For TOP queries, the Retrieved Document Count commonly exceeds the Output Document Count by one, which is expected and is not a sign of a scan.
    fr: Chaque page (continuation) d'une requête renvoie ses propres métriques ; les totaux de la requête s'obtiennent donc en agrégeant les métriques de tous les allers-retours. Le RequestCharge d'un FeedResponse correspond aux frais de cet aller-retour uniquement ; vous additionnez les pages pour obtenir le coût de la requête entière. Pour les requêtes TOP, le Retrieved Document Count dépasse couramment l'Output Document Count de un, ce qui est normal et n'indique pas une analyse complète.
references:
  - title: Get SQL query execution metrics and analyze query performance using .NET SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/query-metrics-performance
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
