id: dp420-2a-authz-create-container-403
objective: "2.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    At startup, an API calls `CreateDatabaseIfNotExistsAsync` and `CreateContainerIfNotExistsAsync` on an Azure Cosmos DB for NoSQL account named **northwind-shop**. You disable key-based authentication on the account and switch the API to a managed identity that has the Cosmos DB Built-in Data Contributor role at the scope `/`.

    Item operations now succeed, but the two startup calls fail with 403 Forbidden. Key-based authentication must stay disabled.

    What should you do?
  fr: |
    Au démarrage, une API appelle `CreateDatabaseIfNotExistsAsync` et `CreateContainerIfNotExistsAsync` sur un compte Azure Cosmos DB for NoSQL nommé **northwind-shop**. Vous désactivez l'authentification par clé sur le compte et passez l'API à une identité managée qui a le rôle Cosmos DB Built-in Data Contributor dans l'étendue `/`.

    Les opérations sur les éléments réussissent désormais, mais les deux appels de démarrage échouent avec l'erreur 403 Forbidden. L'authentification par clé doit rester désactivée.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a custom data plane role that adds the sqlDatabases/write data action, and assign it to the managed identity.", fr: "Créer un rôle personnalisé du plan de données qui ajoute l'action de données sqlDatabases/write, puis l'attribuer à l'identité managée." } }
    - { id: b, text: { en: "Create the database and container through the control plane, for example with Bicep or the Azure CLI, and remove the two calls from the API.", fr: "Créer la base de données et le conteneur via le plan de contrôle, par exemple avec Bicep ou Azure CLI, et supprimer les deux appels de l'API." } }
    - { id: c, text: { en: "Assign the Cosmos DB Built-in Data Contributor role again at the scope /dbs/shop instead of the scope /.", fr: "Attribuer à nouveau le rôle Cosmos DB Built-in Data Contributor dans l'étendue /dbs/shop au lieu de l'étendue /." } }
    - { id: d, text: { en: "Assign the Cosmos DB Account Reader Role to the managed identity at the account scope.", fr: "Attribuer le rôle Cosmos DB Account Reader Role à l'identité managée dans l'étendue du compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Managing databases and containers is a control plane operation. Native data plane roles cover items, queries, change feed, stored procedures and conflicts, so no data plane role lets the SDK create a database or a container with Microsoft Entra authentication. Provision these resources with Azure Resource Manager (Bicep, CLI, PowerShell) under an identity that has a control plane role.
    fr: |
      La gestion des bases de données et des conteneurs est une opération du plan de contrôle. Les rôles natifs du plan de données couvrent les éléments, les requêtes, le flux de modification, les procédures stockées et les conflits : aucun rôle du plan de données ne permet au SDK de créer une base de données ou un conteneur avec l'authentification Microsoft Entra. Provisionnez ces ressources avec Azure Resource Manager (Bicep, CLI, PowerShell) sous une identité qui dispose d'un rôle du plan de contrôle.
  options:
    a: { en: "There is no data action for creating databases or containers; data plane roles only accept the documented data actions.", fr: "Il n'existe pas d'action de données pour créer des bases de données ou des conteneurs ; les rôles du plan de données n'acceptent que les actions de données documentées." }
    c: { en: "A narrower scope grants fewer rights, not the missing control plane permission.", fr: "Une étendue plus restreinte accorde moins de droits, pas l'autorisation manquante du plan de contrôle." }
    d: { en: "Cosmos DB Account Reader Role is a read-only control plane role; it cannot create resources.", fr: "Cosmos DB Account Reader Role est un rôle du plan de contrôle en lecture seule ; il ne peut pas créer de ressources." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
