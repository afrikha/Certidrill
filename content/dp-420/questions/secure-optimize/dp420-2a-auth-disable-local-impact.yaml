id: dp420-2a-auth-disable-local-impact
objective: "2.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum plans to set `disableLocalAuth` to `true` on an Azure Cosmos DB for NoSQL account named **adatum-iot**. The following components currently use the account:

    - **FuncIngest**: an Azure Functions app that connects with a connection string that contains `AccountKey`.
    - **ApiDevices**: an API that uses `DefaultAzureCredential` with a managed identity that has the Cosmos DB Built-in Data Contributor role.
    - **PipelineInfra**: a CI/CD pipeline that creates containers with `az cosmosdb sql container create` under a service principal that has the DocumentDB Account Contributor role.
    - **ToolReports**: a reporting tool that connects with the primary read-only key.

    Which two components will stop working after the change?

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum prévoit de définir `disableLocalAuth` sur `true` sur un compte Azure Cosmos DB for NoSQL nommé **adatum-iot**. Les composants suivants utilisent actuellement le compte :

    - **FuncIngest** : une application Azure Functions qui se connecte avec une chaîne de connexion contenant `AccountKey`.
    - **ApiDevices** : une API qui utilise `DefaultAzureCredential` avec une identité managée qui a le rôle Cosmos DB Built-in Data Contributor.
    - **PipelineInfra** : un pipeline CI/CD qui crée des conteneurs avec `az cosmosdb sql container create` sous un principal de service qui a le rôle DocumentDB Account Contributor.
    - **ToolReports** : un outil de création de rapports qui se connecte avec la clé primaire en lecture seule.

    Quels sont les deux composants qui cesseront de fonctionner après la modification ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "ApiDevices" }
    - { id: b, text: "FuncIngest" }
    - { id: c, text: "PipelineInfra" }
    - { id: d, text: "ToolReports" }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "`disableLocalAuth` disables key-based authentication on the data plane, so every client that signs its requests with an account key fails, whether it uses a read-write key in a connection string or a read-only key. Clients that use Microsoft Entra ID keep working."
    fr: "`disableLocalAuth` désactive l'authentification par clé sur le plan de données : tout client qui signe ses requêtes avec une clé de compte échoue, qu'il utilise une clé en lecture-écriture dans une chaîne de connexion ou une clé en lecture seule. Les clients qui utilisent Microsoft Entra ID continuent de fonctionner."
  options:
    a: { en: "ApiDevices already authenticates with Microsoft Entra ID and has a data plane role.", fr: "ApiDevices s'authentifie déjà avec Microsoft Entra ID et possède un rôle du plan de données." }
    c: { en: "The Azure CLI creates containers through Azure Resource Manager (control plane) with the service principal's Azure RBAC role, not with account keys.", fr: "Azure CLI crée les conteneurs via Azure Resource Manager (plan de contrôle) avec le rôle Azure RBAC du principal de service, pas avec des clés de compte." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
