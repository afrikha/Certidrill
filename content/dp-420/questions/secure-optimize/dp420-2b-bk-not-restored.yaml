id: dp420-2b-bk-not-restored
objective: "2.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account named **cosmos-pw-claims** that uses continuous backup mode, Session consistency, a private endpoint and Microsoft Entra data-plane role assignments for its applications. A bad deployment corrupted documents in a container, so you restore the account to a point in time before the deployment into a new account named **cosmos-pw-claims-r1**.

    Which two settings must you configure again on **cosmos-pw-claims-r1** before the applications can use it as they used the source account?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-pw-claims** qui utilise le mode de sauvegarde continue, la cohérence Session, un point de terminaison privé et des attributions de rôles de plan de données Microsoft Entra pour ses applications. Un déploiement défectueux a corrompu des documents d'un conteneur : vous restaurez donc le compte à un instant antérieur au déploiement dans un nouveau compte nommé **cosmos-pw-claims-r1**.

    Quels sont les deux paramètres à configurer de nouveau sur **cosmos-pw-claims-r1** pour que les applications puissent l'utiliser comme elles utilisaient le compte source ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The default consistency level", fr: "Le niveau de cohérence par défaut" } }
    - { id: b, text: { en: "The private endpoint and firewall settings", fr: "Les paramètres de point de terminaison privé et de pare-feu" } }
    - { id: c, text: { en: "The indexing policy of each container", fr: "La stratégie d'indexation de chaque conteneur" } }
    - { id: d, text: { en: "The role assignments, including data-plane role assignments", fr: "Les attributions de rôles, y compris celles du plan de données" } }
    - { id: e, text: { en: "The partition key definition of each container", fr: "La définition de clé de partition de chaque conteneur" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      A point-in-time restore brings back the data, its index properties and the container definitions, but not the firewall, virtual network, private endpoint or data-plane RBAC settings, nor the role assignments. You add them to the restored account after the restore completes.
    fr: |
      Une restauration à un instant dans le passé rétablit les données, leurs propriétés d'index et les définitions des conteneurs, mais pas les paramètres de pare-feu, de réseau virtuel, de point de terminaison privé et de RBAC de plan de données, ni les attributions de rôles. Vous les ajoutez au compte restauré une fois la restauration terminée.
  options:
    a: { en: "The restored account keeps the consistency level of the source account.", fr: "Le compte restauré conserve le niveau de cohérence du compte source." }
    c: { en: "Data is restored with its index properties, so the indexing policy comes back with the container.", fr: "Les données sont restaurées avec leurs propriétés d'index : la stratégie d'indexation revient avec le conteneur." }
    e: { en: "Containers are restored with their definition; the partition key can't differ from the source anyway.", fr: "Les conteneurs sont restaurés avec leur définition ; la clé de partition ne peut de toute façon pas différer de la source." }
references:
  - title: Continuous backup with point-in-time restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/continuous-backup-restore-introduction
  - title: Periodic backup and restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/periodic-backup-restore-introduction
