id: dp420-2d-pool-hot-logical-key
objective: "2.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam gives each tenant its own Azure Cosmos DB for NoSQL account. The accounts belong to a fleetspace whose pool has a maximum of 500,000 RU/s and is rarely more than 30 percent used.

    The account of one tenant has a container named **events**, partitioned by `/deviceId`, with autoscale throughput of 100 to 1,000 RU/s on a single physical partition. During peaks, one gateway device writes events that need 14,000 RU/s for several minutes, and these writes receive 429 responses. Other devices are not throttled.

    You need to eliminate the throttling of the gateway's writes.

    What should you do?
  fr: |
    Fabrikam attribue à chaque locataire son propre compte Azure Cosmos DB for NoSQL. Les comptes appartiennent à un fleetspace dont le pool a un maximum de 500 000 RU/s et est rarement utilisé à plus de 30 %.

    Le compte d'un locataire a un conteneur nommé **events**, partitionné par `/deviceId`, avec un débit avec mise à l'échelle automatique de 100 à 1 000 RU/s sur une seule partition physique. Pendant les pics, un appareil passerelle écrit des événements qui nécessitent 14 000 RU/s pendant plusieurs minutes, et ces écritures reçoivent des réponses 429. Les autres appareils ne sont pas limités.

    Vous devez éliminer la limitation des écritures de la passerelle.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Re-create the container with a synthetic key that spreads each device's events over many partitions.", fr: "Recréer le conteneur avec une clé synthétique qui répartit les événements de chaque appareil sur de nombreuses partitions." } }
    - { id: b, text: { en: "Raise the autoscale maximum of the events container from 1,000 RU/s to 10,000 RU/s.", fr: "Relever le maximum de mise à l'échelle automatique du conteneur events de 1 000 RU/s à 10 000 RU/s." } }
    - { id: c, text: { en: "Raise the maximum RU/s of the fleetspace pool from 500,000 RU/s to 1,000,000 RU/s.", fr: "Relever les RU/s maximales du pool du fleetspace de 500 000 RU/s à 1 000 000 RU/s." } }
    - { id: d, text: { en: "Move the tenant account to a fleetspace that uses the BusinessCritical service tier.", fr: "Déplacer le compte du locataire vers un fleetspace qui utilise le niveau de service BusinessCritical." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      A logical partition maps to one physical partition, so a single partition key value can never use more than 10,000 RU/s, with or without a pool. Spreading the gateway's events over several logical partition key values, for example deviceId combined with a suffix, lets the load spread over several physical partitions.
    fr: |
      Une partition logique correspond à une seule partition physique : une même valeur de clé de partition ne peut donc jamais utiliser plus de 10 000 RU/s, avec ou sans pool. Répartir les événements de la passerelle sur plusieurs valeurs de clé de partition logique, par exemple deviceId combiné à un suffixe, permet de répartir la charge sur plusieurs partitions physiques.
  options:
    b: { en: "Even with more dedicated RU/s, one logical partition stays limited to 10,000 RU/s, below the 14,000 RU/s needed.", fr: "Même avec plus de RU/s dédiées, une partition logique reste limitée à 10 000 RU/s, en dessous des 14 000 RU/s nécessaires." }
    c: { en: "The pool has free capacity already; a physical partition can draw at most 5,000 RU/s from it and 10,000 RU/s in total.", fr: "Le pool a déjà de la capacité libre ; une partition physique peut y puiser au plus 5 000 RU/s et 10 000 RU/s au total." }
    d: { en: "The service tier matches the write-region configuration of the accounts; it doesn't change per-partition limits.", fr: "Le niveau de service correspond à la configuration des régions d'écriture des comptes ; il ne change pas les limites par partition." }
references:
  - title: Fleet Pools - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/fleet-pools
  - title: Partitioning and horizontal scaling - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning
