id: dp420-2a-ddm-statements
objective: "2.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank evaluates dynamic data masking for an Azure Cosmos DB for NoSQL account named **woodgrove-kyc**. The applications authenticate with Microsoft Entra ID.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank évalue le masquage dynamique des données pour un compte Azure Cosmos DB for NoSQL nommé **woodgrove-kyc**. Les applications s'authentifient avec Microsoft Entra ID.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: After you enable dynamic data masking on the account, you can turn the feature off later from the Features page.
        fr: Après avoir activé le masquage dynamique des données sur le compte, vous pouvez désactiver la fonctionnalité plus tard depuis la page Features.
    - id: s2
      text:
        en: Enabling dynamic data masking on the account adds no cost as long as no container has a masking policy.
        fr: L'activation du masquage dynamique des données sur le compte n'ajoute aucun coût tant qu'aucun conteneur n'a de stratégie de masquage.
    - id: s3
      text:
        en: An application whose identity has only the Cosmos DB Built-in Data Reader role receives masked values.
        fr: Une application dont l'identité a seulement le rôle Cosmos DB Built-in Data Reader reçoit des valeurs masquées.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |
      Once enabled on an account, dynamic data masking stays active; removing all paths from the masking policies is the only way to stop masking. Enabling the feature has no extra cost unless a masking policy is applied to a container. The built-in Data Reader role does not include the unmask data action, so its holders see masked values.
    fr: |
      Une fois activé sur un compte, le masquage dynamique des données reste actif ; supprimer tous les chemins des stratégies de masquage est le seul moyen d'arrêter le masquage. L'activation de la fonctionnalité n'a pas de coût supplémentaire, sauf si une stratégie de masquage est appliquée à un conteneur. Le rôle intégré Data Reader n'inclut pas l'action de données unmask : ses détenteurs voient des valeurs masquées.
references:
  - title: Dynamic Data Masking in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/dynamic-data-masking
