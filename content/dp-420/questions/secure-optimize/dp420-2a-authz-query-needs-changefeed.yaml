id: dp420-2a-authz-query-needs-changefeed
objective: "2.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A support portal uses the Azure Cosmos DB .NET SDK with Microsoft Entra authentication to access a container named **tickets**. Its identity has a custom data plane role with the following data actions:

    - `Microsoft.DocumentDB/databaseAccounts/readMetadata`
    - `Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/read`
    - `Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery`

    Point reads succeed, but every query issued with `GetItemQueryIterator` is rejected with 403 Forbidden. You need to fix the issue by granting the least additional permission.

    Which data action should you add to the role?
  fr: |
    Un portail de support utilise le SDK .NET Azure Cosmos DB avec l'authentification Microsoft Entra pour accéder à un conteneur nommé **tickets**. Son identité dispose d'un rôle personnalisé du plan de données avec les actions de données suivantes :

    - `Microsoft.DocumentDB/databaseAccounts/readMetadata`
    - `Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/read`
    - `Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeQuery`

    Les lectures ponctuelles réussissent, mais toutes les requêtes émises avec `GetItemQueryIterator` sont rejetées avec l'erreur 403 Forbidden. Vous devez résoudre le problème en accordant le moins d'autorisations supplémentaires possible.

    Quelle action de données devez-vous ajouter au rôle ?
body:
  options:
    - { id: a, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/readChangeFeed" }
    - { id: b, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/executeStoredProcedure" }
    - { id: c, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/*" }
    - { id: d, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/manageConflicts" }
answer: { optionId: a }
explanation:
  correct:
    en: |
      To run NoSQL queries through the Azure Cosmos DB SDKs, a role needs both `executeQuery` and `readChangeFeed`. Adding `readChangeFeed` is the smallest change, and it is the combination used by the built-in Data Reader role.
    fr: |
      Pour exécuter des requêtes NoSQL avec les SDK Azure Cosmos DB, un rôle a besoin à la fois de `executeQuery` et de `readChangeFeed`. Ajouter `readChangeFeed` est la plus petite modification, et c'est la combinaison utilisée par le rôle intégré Data Reader.
  options:
    b: { en: "Stored procedure execution is unrelated to SDK queries.", fr: "L'exécution de procédures stockées n'a pas de rapport avec les requêtes du SDK." }
    c: { en: "items/* adds create, replace, upsert and delete, far more than needed, and still lacks readChangeFeed.", fr: "items/* ajoute la création, le remplacement, l'upsert et la suppression, bien plus que nécessaire, et ne contient toujours pas readChangeFeed." }
    d: { en: "manageConflicts manages the conflict feed of multi-region write accounts.", fr: "manageConflicts gère le flux de conflits des comptes à écritures multirégions." }
references:
  - title: Azure Cosmos DB for NoSQL data plane security reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reference-data-plane-security
