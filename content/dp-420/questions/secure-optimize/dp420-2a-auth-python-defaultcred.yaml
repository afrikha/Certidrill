id: dp420-2a-auth-python-defaultcred
objective: "2.1.1"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam is building a Python service that reads orders from an Azure Cosmos DB for NoSQL account named **fabrikam-orders**. Key-based authentication is disabled on the account.

    Developers run the service on their workstations after they sign in with the Azure CLI (`az login`). In production, the service runs in Azure App Service with a managed identity. Both identities have the Cosmos DB Built-in Data Reader role. The same code must run in both environments without changes.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam développe un service Python qui lit des commandes dans un compte Azure Cosmos DB for NoSQL nommé **fabrikam-orders**. L'authentification par clé est désactivée sur le compte.

    Les développeurs exécutent le service sur leur poste de travail après s'être connectés avec Azure CLI (`az login`). En production, le service s'exécute dans Azure App Service avec une identité managée. Les deux identités ont le rôle Cosmos DB Built-in Data Reader. Le même code doit s'exécuter dans les deux environnements sans modification.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from azure.cosmos import CosmosClient
    from azure.identity import AzureCliCredential, DefaultAzureCredential, ManagedIdentityCredential

    endpoint = "https://fabrikam-orders.documents.azure.com:443/"

    credential = [[cred]]
    client = [[client]]

    container = client.get_database_client("sales").get_container_client("orders")
  slots:
    - id: cred
      options:
        - { id: dac, text: "DefaultAzureCredential()" }
        - { id: mi, text: "ManagedIdentityCredential()" }
        - { id: cli, text: "AzureCliCredential()" }
        - { id: key, text: "os.environ[\"COSMOS_KEY\"]" }
    - id: client
      options:
        - { id: ctor, text: "CosmosClient(endpoint, credential=credential)" }
        - { id: conn, text: "CosmosClient.from_connection_string(endpoint)" }
        - { id: cons, text: "CosmosClient(endpoint, consistency_level=credential)" }
answer:
  values: { cred: dac, client: ctor }
explanation:
  correct:
    en: |
      `DefaultAzureCredential` tries a chain of credentials: in App Service it finds the managed identity, and on a workstation it falls back to the Azure CLI sign-in, so the same code works in both places. The `CosmosClient` constructor takes the account endpoint and a `TokenCredential` in its `credential` parameter.
    fr: |
      `DefaultAzureCredential` essaie une chaîne d'informations d'identification : dans App Service, il trouve l'identité managée et, sur un poste de travail, il utilise la connexion Azure CLI. Le même code fonctionne donc aux deux endroits. Le constructeur `CosmosClient` prend le point de terminaison du compte et un `TokenCredential` dans son paramètre `credential`.
  options:
    mi: { en: "ManagedIdentityCredential always fails on a developer workstation.", fr: "ManagedIdentityCredential échoue toujours sur un poste de développeur." }
    cli: { en: "AzureCliCredential works locally but not in App Service, where no Azure CLI session exists.", fr: "AzureCliCredential fonctionne en local, mais pas dans App Service, où il n'y a pas de session Azure CLI." }
    key: { en: "Key-based authentication is disabled on the account.", fr: "L'authentification par clé est désactivée sur le compte." }
    conn: { en: "from_connection_string expects a connection string, not an endpoint URL, and it would not use the Microsoft Entra credential.", fr: "from_connection_string attend une chaîne de connexion, pas une URL de point de terminaison, et n'utiliserait pas les informations d'identification Microsoft Entra." }
    cons: { en: "consistency_level sets the session consistency level; the credential must be passed in the credential parameter.", fr: "consistency_level définit le niveau de cohérence de la session ; les informations d'identification doivent être passées dans le paramètre credential." }
references:
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
  - title: CosmosClient Class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.cosmosclient?view=azure-python
