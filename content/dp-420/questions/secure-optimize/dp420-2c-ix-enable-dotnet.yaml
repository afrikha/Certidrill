id: dp420-2c-ix-enable-dotnet
objective: "2.3.3"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    A product search query against a container named **products** consumes more RUs than expected. You are not sure which indexed paths the query uses or which indexes could help.

    You need to display, for each page of the query, the indexed paths that were used and the indexes that could improve the query.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une requête de recherche de produits sur un conteneur nommé **products** consomme plus de RU que prévu. Vous ne savez pas quels chemins indexés la requête utilise ni quels index pourraient l'améliorer.

    Vous devez afficher, pour chaque page de la requête, les chemins indexés utilisés et les index susceptibles d'améliorer la requête.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    string sql = "SELECT TOP 20 p.id FROM p WHERE p.brand = @brand AND p.rating > 4";
    QueryDefinition query = new QueryDefinition(sql).WithParameter("@brand", "Contoso");

    FeedIterator<Product> iterator = container.GetItemQueryIterator<Product>(
        query,
        requestOptions: new QueryRequestOptions { [[opt]] = true });

    while (iterator.HasMoreResults)
    {
        FeedResponse<Product> page = await iterator.ReadNextAsync();
        Console.WriteLine(page.[[prop]]);
    }
  slots:
    - id: opt
      options:
        - { id: advice, text: PopulateQueryAdvice }
        - { id: index, text: PopulateIndexMetrics }
        - { id: scan, text: EnableScanInQuery }
    - id: prop
      options:
        - { id: metrics, text: IndexMetrics }
        - { id: qa, text: QueryAdvice }
        - { id: rc, text: RequestCharge }
        - { id: diag, text: Diagnostics }
answer:
  values: { opt: index, prop: metrics }
explanation:
  correct:
    en: "Setting `PopulateIndexMetrics` to `true` in `QueryRequestOptions` (it defaults to `false`) makes the service return indexing metrics, which the .NET SDK exposes in `FeedResponse.IndexMetrics`. The output lists the utilized and potential single indexes and composite indexes, each with an index impact score."
    fr: "Définir `PopulateIndexMetrics` sur `true` dans `QueryRequestOptions` (la valeur par défaut est `false`) demande au service de renvoyer les métriques d'indexation, que le SDK .NET expose dans `FeedResponse.IndexMetrics`. La sortie liste les index simples et composites utilisés et potentiels, chacun avec un score d'impact d'index."
  options:
    advice: { en: "PopulateQueryAdvice returns Query Advisor recommendations about the query text, not the indexed paths used.", fr: "PopulateQueryAdvice renvoie les recommandations de Query Advisor sur le texte de la requête, pas les chemins indexés utilisés." }
    scan: { en: "EnableScanInQuery allows queries on paths excluded from indexing; it returns no index information.", fr: "EnableScanInQuery autorise les requêtes sur des chemins exclus de l'indexation ; il ne renvoie aucune information d'index." }
    rc: { en: "RequestCharge gives the RU cost of the page, not which indexes were used.", fr: "RequestCharge donne le coût en RU de la page, pas les index utilisés." }
references:
  - title: Indexing metrics in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-metrics
