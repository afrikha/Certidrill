id: dp420-2a-net-private-endpoint-cli
objective: "2.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You need to make an Azure Cosmos DB for NoSQL account named **contoso-ledger** reachable from a virtual network named **vnet-app** through a private IP address. The applications use the standard gateway of the account, not a dedicated gateway. Name resolution must use an Azure private DNS zone linked to vnet-app.

    How should you complete the Azure CLI commands? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez rendre un compte Azure Cosmos DB for NoSQL nommé **contoso-ledger** accessible depuis un réseau virtuel nommé **vnet-app** par une adresse IP privée. Les applications utilisent la passerelle standard du compte, pas une passerelle dédiée. La résolution de noms doit utiliser une zone DNS privée Azure liée à vnet-app.

    Comment devez-vous compléter les commandes Azure CLI ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az network private-endpoint create \
      --name pe-contoso-ledger \
      --resource-group rg-app \
      --vnet-name vnet-app \
      --subnet snet-pe \
      --private-connection-resource-id $accountId \
      --group-ids [[gid]] \
      --connection-name pec-contoso-ledger

    az network private-dns zone create \
      --resource-group rg-app \
      --name [[zone]]
  slots:
    - id: gid
      options:
        - { id: sql, text: "Sql" }
        - { id: sqld, text: "SqlDedicated" }
        - { id: mongo, text: "MongoDB" }
        - { id: table, text: "Table" }
    - id: zone
      options:
        - { id: docs, text: "privatelink.documents.azure.com" }
        - { id: sqlx, text: "privatelink.sqlx.cosmos.azure.com" }
        - { id: dbwin, text: "privatelink.database.windows.net" }
        - { id: cosmos, text: "privatelink.cosmos.azure.com" }
answer:
  values: { gid: sql, zone: docs }
explanation:
  correct:
    en: |
      For a NoSQL account, the private endpoint targets the `Sql` sub-resource, and the matching private DNS zone is `privatelink.documents.azure.com`.
    fr: |
      Pour un compte NoSQL, le point de terminaison privé cible la sous-ressource `Sql`, et la zone DNS privée correspondante est `privatelink.documents.azure.com`.
  options:
    sqld: { en: "SqlDedicated targets the dedicated gateway, which the applications do not use; its zone is privatelink.sqlx.cosmos.azure.com.", fr: "SqlDedicated cible la passerelle dédiée, que les applications n'utilisent pas ; sa zone est privatelink.sqlx.cosmos.azure.com." }
    mongo: { en: "MongoDB is the sub-resource of an Azure Cosmos DB for MongoDB account.", fr: "MongoDB est la sous-ressource d'un compte Azure Cosmos DB for MongoDB." }
    table: { en: "Table is the sub-resource of an Azure Cosmos DB for Table account.", fr: "Table est la sous-ressource d'un compte Azure Cosmos DB for Table." }
    dbwin: { en: "privatelink.database.windows.net is the zone of Azure SQL Database.", fr: "privatelink.database.windows.net est la zone d'Azure SQL Database." }
    cosmos: { en: "There is no privatelink.cosmos.azure.com zone for the NoSQL sub-resource.", fr: "Il n'existe pas de zone privatelink.cosmos.azure.com pour la sous-ressource NoSQL." }
references:
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
