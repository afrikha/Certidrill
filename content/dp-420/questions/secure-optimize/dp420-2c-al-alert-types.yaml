id: dp420-2c-al-alert-types
objective: "2.3.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Tailspin needs three notifications for an Azure Cosmos DB account named **cosmos-tailspin**. Diagnostic logs are already sent to a Log Analytics workspace.

    Which type of alert rule should you use for each requirement? To answer, drag the appropriate alert types to the correct requirements. Each alert type may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin a besoin de trois notifications pour un compte Azure Cosmos DB nommé **cosmos-tailspin**. Les journaux de diagnostic sont déjà envoyés à un espace de travail Log Analytics.

    Quel type de règle d'alerte devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les types d'alertes appropriés vers les exigences correspondantes. Chaque type d'alerte peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: metric, text: { en: "Metric alert", fr: "Alerte de métrique" } }
    - { id: log, text: { en: "Log search alert", fr: "Alerte de recherche dans les journaux" } }
    - { id: activity, text: { en: "Activity log alert", fr: "Alerte de journal d'activité" } }
    - { id: smart, text: { en: "Smart detection alert", fr: "Alerte de détection intelligente" } }
    - { id: prom, text: { en: "Prometheus alert", fr: "Alerte Prometheus" } }
  targets:
    - id: t1
      text: { en: "The Normalized RU Consumption of a container stays above 90 % for 15 minutes.", fr: "La valeur Normalized RU Consumption d'un conteneur reste supérieure à 90 % pendant 15 minutes." }
    - id: t2
      text: { en: "A KQL query on CDBDataPlaneRequests finds more than 50 requests with DurationMs above 100 in 10 minutes.", fr: "Une requête KQL sur CDBDataPlaneRequests trouve plus de 50 requêtes dont DurationMs dépasse 100 en 10 minutes." }
    - id: t3
      text: { en: "Someone creates an Azure role assignment on the account.", fr: "Quelqu'un crée une attribution de rôle Azure sur le compte." }
answer:
  mapping: { t1: metric, t2: log, t3: activity }
explanation:
  correct:
    en: Metric alerts evaluate precomputed platform metrics such as Normalized RU Consumption at regular intervals. Log search alerts run a KQL query on data in a Log Analytics workspace, such as the CDBDataPlaneRequests table, and evaluate its result. Activity log alerts fire when a specific control-plane event is logged, for example a new role assignment. Smart detection analyzes Application Insights telemetry, and Prometheus alerts evaluate Prometheus metrics, so neither fits.
    fr: Les alertes de métrique évaluent à intervalles réguliers des métriques de plateforme précalculées comme Normalized RU Consumption. Les alertes de recherche dans les journaux exécutent une requête KQL sur les données d'un espace de travail Log Analytics, par exemple la table CDBDataPlaneRequests, et évaluent son résultat. Les alertes de journal d'activité se déclenchent lorsqu'un événement précis du plan de contrôle est journalisé, par exemple une nouvelle attribution de rôle. La détection intelligente analyse la télémétrie Application Insights et les alertes Prometheus évaluent des métriques Prometheus ; aucune des deux ne convient.
references:
  - title: Choose the right type of alert rule
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/alerts/alerts-types
  - title: Create alerts for Azure Cosmos DB using Azure Monitor
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/create-alerts
