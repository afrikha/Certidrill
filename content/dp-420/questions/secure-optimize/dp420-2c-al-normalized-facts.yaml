id: dp420-2c-al-normalized-facts
objective: "2.3.5"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans alert rules based on the Normalized RU Consumption metric for several Azure Cosmos DB accounts. Some containers have dedicated throughput, and one database shares its throughput across ten containers.

    Which two statements about the metric are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prévoit des règles d'alerte basées sur la métrique Normalized RU Consumption pour plusieurs comptes Azure Cosmos DB. Certains conteneurs disposent d'un débit dédié, et une base de données partage son débit entre dix conteneurs.

    Quelles sont les deux affirmations vraies concernant cette métrique ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "It reports the maximum RU/s utilization across all the partition key ranges in the interval.", fr: "Elle indique l'utilisation maximale des RU/s parmi toutes les plages de clés de partition sur l'intervalle." } }
    - { id: b, text: { en: "A value of 100 % means that the application receives 429 errors for most of its requests.", fr: "Une valeur de 100 % signifie que l'application reçoit des erreurs 429 pour la plupart de ses requêtes." } }
    - { id: c, text: { en: "For the shared-throughput database, splitting the metric by CollectionName returns no data.", fr: "Pour la base de données à débit partagé, fractionner la métrique par CollectionName ne renvoie aucune donnée." } }
    - { id: d, text: { en: "It is emitted at 5-minute intervals, so a rule cannot use a lookback period shorter than 5 minutes.", fr: "Elle est émise toutes les 5 minutes : une règle ne peut donc pas utiliser une période d'analyse inférieure à 5 minutes." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "Normalized RU Consumption is emitted at 1-minute intervals and is the maximum RU/s utilization across all partition key ranges in the interval. For shared-throughput databases, the metric shows data at the database granularity only, so splitting by collection name shows nothing."
    fr: "Normalized RU Consumption est émise toutes les minutes et correspond à l'utilisation maximale des RU/s parmi toutes les plages de clés de partition sur l'intervalle. Pour les bases de données à débit partagé, la métrique n'affiche les données qu'au niveau de la base : un fractionnement par nom de collection n'affiche rien."
  options:
    b: { en: "100 % only means that at least one partition key range used all its RU/s in a given second; with 1-5 % of 429s and acceptable latency, no action is required.", fr: "100 % signifie seulement qu'au moins une plage de clés de partition a utilisé toutes ses RU/s pendant une seconde donnée ; avec 1 à 5 % de 429 et une latence acceptable, aucune action n'est nécessaire." }
    d: { en: "The metric is emitted every minute (PT1M time grain).", fr: "La métrique est émise chaque minute (granularité PT1M)." }
references:
  - title: Monitor normalized request units in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-normalized-request-units
  - title: Azure Cosmos DB monitoring data reference
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-reference
