id: dp420-2a-net-public-access-disabled
objective: "2.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account named **woodgrove-cards** has an approved private endpoint in a hub virtual network. The account's IP firewall still allows the range 203.0.113.0/24 of a former office.

    You need to make sure that the account can be reached only through private endpoints. Requests from public IP addresses must be rejected, including requests from the ranges listed in the firewall.

    What should you do?
  fr: |
    Un compte Azure Cosmos DB for NoSQL nommé **woodgrove-cards** dispose d'un point de terminaison privé approuvé dans un réseau virtuel hub. Le pare-feu IP du compte autorise encore la plage 203.0.113.0/24 d'un ancien bureau.

    Vous devez faire en sorte que le compte ne soit accessible que par des points de terminaison privés. Les requêtes provenant d'adresses IP publiques doivent être rejetées, y compris celles des plages listées dans le pare-feu.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Delete all the IP rules and virtual network rules of the account.", fr: "Supprimer toutes les règles IP et toutes les règles de réseau virtuel du compte." } }
    - { id: b, text: { en: "Enable Accept connections from within public Azure datacenters.", fr: "Activer l'option Accept connections from within public Azure datacenters." } }
    - { id: c, text: { en: "Enable the Microsoft.AzureCosmosDB service endpoint on the hub subnets.", fr: "Activer le point de terminaison de service Microsoft.AzureCosmosDB sur les sous-réseaux du hub." } }
    - { id: d, text: { en: "Set publicNetworkAccess to Disabled on the account.", fr: "Définir publicNetworkAccess sur Disabled sur le compte." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When publicNetworkAccess is Disabled, all public and virtual network traffic is blocked, even from sources allowed by IP or virtual network rules, and only private endpoints can reach the account.
    fr: |
      Lorsque publicNetworkAccess a la valeur Disabled, tout le trafic public et de réseau virtuel est bloqué, même depuis des sources autorisées par des règles IP ou de réseau virtuel, et seuls les points de terminaison privés peuvent atteindre le compte.
  options:
    a: { en: "With no IP or virtual network rule, the account accepts traffic from every network unless public access is disabled.", fr: "Sans règle IP ni règle de réseau virtuel, le compte accepte le trafic de tous les réseaux, sauf si l'accès public est désactivé." }
    b: { en: "This adds 0.0.0.0 to the firewall and opens the account to every Azure datacenter, including other customers.", fr: "Cette option ajoute 0.0.0.0 au pare-feu et ouvre le compte à tous les centres de données Azure, y compris ceux d'autres clients." }
    c: { en: "A service endpoint is a public endpoint path filtered by virtual network rules; it does not block the public IP ranges.", fr: "Un point de terminaison de service est un chemin vers le point de terminaison public filtré par des règles de réseau virtuel ; il ne bloque pas les plages IP publiques." }
references:
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
