id: dp420-2d-log-table-match
objective: "2.3.6"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account. A diagnostic setting sends every log category of the account to a Log Analytics workspace in resource-specific mode.

    Which table should you query for each requirement? To answer, drag the appropriate tables to the correct requirements. Each table may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL. Un paramètre de diagnostic envoie toutes les catégories de journaux du compte vers un espace de travail Log Analytics en mode spécifique à la ressource.

    Quelle table devez-vous interroger pour chaque exigence ? Pour répondre, faites glisser les tables appropriées vers les exigences correspondantes. Chaque table peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: dp, text: CDBDataPlaneRequests }
    - { id: qrs, text: CDBQueryRuntimeStatistics }
    - { id: pkru, text: CDBPartitionKeyRUConsumption }
    - { id: pks, text: CDBPartitionKeyStatistics }
    - { id: cp, text: CDBControlPlaneRequests }
    - { id: act, text: AzureActivity }
  targets:
    - id: t1
      text: { en: "Find the logical partition key values that consumed the most RUs during yesterday's spike", fr: "Trouver les valeurs de clé de partition logique qui ont consommé le plus de RU pendant le pic d'hier" }
    - id: t2
      text: { en: "Read the new indexing policy that was sent when a container was updated", fr: "Lire la nouvelle stratégie d'indexation envoyée lors de la mise à jour d'un conteneur" }
    - id: t3
      text: { en: "Find the logical partition key values that store the most data", fr: "Trouver les valeurs de clé de partition logique qui stockent le plus de données" }
    - id: t4
      text: { en: "Find the region that served each point read, with its status code", fr: "Trouver la région qui a servi chaque lecture ponctuelle, avec son code d'état" }
answer:
  mapping: { t1: pkru, t2: cp, t3: pks, t4: dp }
explanation:
  correct:
    en: |
      CDBPartitionKeyRUConsumption records RU consumption per logical partition key. CDBControlPlaneRequests records control plane operations, and its ResourceDetails column contains the request body of a container update, including the indexing policy. CDBPartitionKeyStatistics reports the logical partition keys with the most storage. CDBDataPlaneRequests has one row per data operation, with RegionName and StatusCode.
    fr: |
      CDBPartitionKeyRUConsumption enregistre la consommation de RU par clé de partition logique. CDBControlPlaneRequests enregistre les opérations du plan de contrôle, et sa colonne ResourceDetails contient le corps de la requête de mise à jour d'un conteneur, y compris la stratégie d'indexation. CDBPartitionKeyStatistics signale les clés de partition logique qui ont le plus de stockage. CDBDataPlaneRequests contient une ligne par opération sur les données, avec RegionName et StatusCode.
  options:
    qrs: { en: "CDBQueryRuntimeStatistics holds query text, joined to requests on ActivityId; point reads aren't queries.", fr: "CDBQueryRuntimeStatistics contient le texte des requêtes, joint aux requêtes sur ActivityId ; les lectures ponctuelles ne sont pas des requêtes." }
    act: { en: "AzureActivity tells who initiated a control plane operation, not the settings it sent.", fr: "AzureActivity indique qui a lancé une opération du plan de contrôle, pas les paramètres qu'elle a envoyés." }
references:
  - title: Monitoring Data Reference - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/monitor-reference
  - title: How to Audit Control Plane Operations - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/audit-control-plane-logs
