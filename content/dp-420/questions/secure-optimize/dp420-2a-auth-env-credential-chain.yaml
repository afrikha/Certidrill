id: dp420-2a-auth-env-credential-chain
objective: "2.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A .NET API runs in Azure App Service and connects to an Azure Cosmos DB for NoSQL account named **contoso-hr** by using `new DefaultAzureCredential()`. The app has a system-assigned managed identity that has the Cosmos DB Built-in Data Contributor role at the account scope.

    The app settings still contain `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` and `AZURE_CLIENT_SECRET` for an old service principal that has no Azure Cosmos DB role. Every data request of the API fails with 403 Forbidden.

    What is the cause of the failures?
  fr: |
    Une API .NET s'exécute dans Azure App Service et se connecte à un compte Azure Cosmos DB for NoSQL nommé **contoso-hr** avec `new DefaultAzureCredential()`. L'application a une identité managée affectée par le système qui a le rôle Cosmos DB Built-in Data Contributor dans l'étendue du compte.

    Les paramètres de l'application contiennent encore `AZURE_TENANT_ID`, `AZURE_CLIENT_ID` et `AZURE_CLIENT_SECRET` pour un ancien principal de service qui n'a aucun rôle Azure Cosmos DB. Toutes les requêtes de données de l'API échouent avec l'erreur 403 Forbidden.

    Quelle est la cause des échecs ?
body:
  options:
    - { id: a, text: { en: "System-assigned managed identities cannot receive Azure Cosmos DB data plane role assignments, only user-assigned ones.", fr: "Les identités managées affectées par le système ne peuvent pas recevoir d'attributions de rôle du plan de données Azure Cosmos DB, seules celles affectées par l'utilisateur le peuvent." } }
    - { id: b, text: { en: "A data plane role assigned at the account scope does not apply to containers, so it must be assigned at the container scope.", fr: "Un rôle du plan de données attribué dans l'étendue du compte ne s'applique pas aux conteneurs : il doit être attribué dans l'étendue du conteneur." } }
    - { id: c, text: { en: "DefaultAzureCredential tries EnvironmentCredential before ManagedIdentityCredential, so it authenticates as the old service principal.", fr: "DefaultAzureCredential essaie EnvironmentCredential avant ManagedIdentityCredential : il s'authentifie donc en tant qu'ancien principal de service." } }
    - { id: d, text: { en: "DefaultAzureCredential tries AzureCliCredential first, and the App Service host is signed in to the Azure CLI with another account.", fr: "DefaultAzureCredential essaie d'abord AzureCliCredential, et l'hôte App Service est connecté à Azure CLI avec un autre compte." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      DefaultAzureCredential stops at the first credential that returns a token, and EnvironmentCredential comes before ManagedIdentityCredential in the chain. The leftover environment variables make it sign in as the old service principal, which has no data plane role. Removing the variables or using ManagedIdentityCredential fixes the issue.
    fr: |
      DefaultAzureCredential s'arrête aux premières informations d'identification qui renvoient un jeton, et EnvironmentCredential précède ManagedIdentityCredential dans la chaîne. Les variables d'environnement restantes le font se connecter en tant qu'ancien principal de service, qui n'a aucun rôle du plan de données. Supprimer ces variables ou utiliser ManagedIdentityCredential résout le problème.
  options:
    a: { en: "Any Microsoft Entra identity, including a system-assigned managed identity, can receive a data plane role assignment.", fr: "Toute identité Microsoft Entra, y compris une identité managée affectée par le système, peut recevoir une attribution de rôle du plan de données." }
    b: { en: "An assignment at the account scope covers all databases and containers of the account.", fr: "Une attribution dans l'étendue du compte couvre toutes les bases de données et tous les conteneurs du compte." }
    d: { en: "AzureCliCredential comes after EnvironmentCredential and ManagedIdentityCredential in the chain.", fr: "AzureCliCredential vient après EnvironmentCredential et ManagedIdentityCredential dans la chaîne." }
references:
  - title: Credential chains in the Azure Identity library for .NET
    url: https://learn.microsoft.com/en-us/dotnet/azure/sdk/authentication/credential-chains
