id: dp420-2b-qp-filter-composite
objective: "2.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL container named **Listings** with the default indexing policy. A C# search API runs this query thousands of times per hour:

    ```sql
    SELECT * FROM c
    WHERE c.city = @city AND c.price > @minPrice
    ```

    You need to add a composite index that lowers the RU charge of the query.

    How should you complete the indexing policy? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **Listings** avec la stratégie d'indexation par défaut. Une API de recherche C# exécute cette requête des milliers de fois par heure :

    ```sql
    SELECT * FROM c
    WHERE c.city = @city AND c.price > @minPrice
    ```

    Vous devez ajouter un index composite qui réduit le coût en RU de la requête.

    Comment devez-vous compléter la stratégie d'indexation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "indexingMode": "consistent",
      "automatic": true,
      "includedPaths": [ { "path": "/*" } ],
      "excludedPaths": [ { "path": "/\"_etag\"/?" } ],
      "compositeIndexes": [
        [
          { "path": "[[first]]", "order": "ascending" },
          { "path": "[[second]]", "order": "ascending" }
        ]
      ]
    }
  slots:
    - id: first
      options:
        - { id: city, text: /city }
        - { id: price, text: /price }
        - { id: citystar, text: /city/* }
    - id: second
      options:
        - { id: price, text: /price }
        - { id: city, text: /city }
        - { id: pricestar, text: /price/* }
answer:
  values: { first: city, second: price }
explanation:
  correct:
    en: |
      In a composite index used for filters, the equality filters come first and the range filter (here `>`) comes last; a composite index can optimize only one range filter. Composite paths have an implicit `/?` and can't use the `/*` wildcard.
    fr: |
      Dans un index composite utilisé pour des filtres, les filtres d'égalité viennent en premier et le filtre de plage (ici `>`) en dernier ; un index composite ne peut optimiser qu'un seul filtre de plage. Les chemins composites ont un `/?` implicite et ne peuvent pas utiliser le caractère générique `/*`.
  options:
    first: { en: "Putting /price first would place the range filter before the equality filter; /city/* uses a wildcard, which composite paths don't allow.", fr: "Placer /price en premier mettrait le filtre de plage avant le filtre d'égalité ; /city/* utilise un caractère générique, interdit dans les chemins composites." }
    second: { en: "The range property must be the last path; /price/* uses a wildcard, which composite paths don't allow.", fr: "La propriété de plage doit être le dernier chemin ; /price/* utilise un caractère générique, interdit dans les chemins composites." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Troubleshoot query issues when using Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-query-performance
