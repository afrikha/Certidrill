id: dp420-2a-net-direct-mode-ports
objective: "2.1.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    A .NET application uses the Azure Cosmos DB SDK in **direct** connection mode to access an Azure Cosmos DB for NoSQL account named **woodgrove-risk**. The application runs on virtual machines in a subnet that reaches the account through the **Microsoft.AzureCosmosDB** service endpoint. A network security group on the subnet restricts outbound traffic to explicitly allowed ports.

    Which TCP port range must be open for the direct mode connections that use the service endpoint?
  fr: |
    Une application .NET utilise le SDK Azure Cosmos DB en mode de connexion **direct** pour accéder à un compte Azure Cosmos DB for NoSQL nommé **woodgrove-risk**. L'application s'exécute sur des machines virtuelles d'un sous-réseau qui atteint le compte par le point de terminaison de service **Microsoft.AzureCosmosDB**. Un groupe de sécurité réseau sur le sous-réseau limite le trafic sortant aux ports explicitement autorisés.

    Quelle plage de ports TCP doit être ouverte pour les connexions en mode direct qui utilisent le point de terminaison de service ?
body:
  options:
    - { id: a, text: { en: "443 only", fr: "443 uniquement" } }
    - { id: b, text: "10000–20000" }
    - { id: c, text: "10250–10256" }
    - { id: d, text: "0–65535" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Direct mode connections over a service endpoint use the TCP port range 10000 to 20000, which must be open. Over Private Link, direct mode needs the full TCP range 0 to 65535 instead.
    fr: |
      Les connexions en mode direct via un point de terminaison de service utilisent la plage de ports TCP 10000 à 20000, qui doit être ouverte. Via Private Link, le mode direct nécessite au contraire toute la plage TCP 0 à 65535.
  options:
    a: { en: "Port 443 is used by gateway mode; direct mode connects to the replicas on other ports.", fr: "Le port 443 est utilisé par le mode passerelle ; le mode direct se connecte aux réplicas sur d'autres ports." }
    c: { en: "This narrow range is not the documented range for direct mode.", fr: "Cette plage étroite n'est pas la plage documentée pour le mode direct." }
    d: { en: "The full range is required for direct mode over a private endpoint, not over a service endpoint.", fr: "La plage complète est requise pour le mode direct via un point de terminaison privé, pas via un point de terminaison de service." }
references:
  - title: Configure access to Azure Cosmos DB from virtual networks
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-vnet-service-endpoint
  - title: Configure Azure Private Link for an Azure Cosmos DB account
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-configure-private-endpoints
