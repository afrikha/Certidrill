id: dp420-2b-qp-integrated-cache
objective: "2.3.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account that uses Session consistency. A C# product catalog runs the same few dozen high-RU queries thousands of times per minute, and the results may be up to five minutes old.

    You need to reduce the RU consumed by these repeated queries with the least development effort.

    What should you do?
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL qui utilise la cohérence Session. Un catalogue de produits C# exécute les mêmes quelques dizaines de requêtes coûteuses en RU des milliers de fois par minute, et les résultats peuvent dater de cinq minutes au plus.

    Vous devez réduire les RU consommées par ces requêtes répétées avec le moins d'effort de développement possible.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Provision a dedicated gateway, and connect in Direct mode with the original account connection string.", fr: "Provisionner une passerelle dédiée, et se connecter en mode Direct avec la chaîne de connexion d'origine du compte." }
    - id: b
      text: { en: "Provision a dedicated gateway, and connect in Gateway mode with the dedicated gateway connection string.", fr: "Provisionner une passerelle dédiée, et se connecter en mode Gateway avec la chaîne de connexion de la passerelle dédiée." }
    - id: c
      text: { en: "Change the default consistency level to Strong so that reads are served from a local quorum.", fr: "Remplacer le niveau de cohérence par défaut par Strong pour que les lectures soient servies par un quorum local." }
    - id: d
      text: { en: "Add a read region in the same geography so that queries are spread across two regions.", fr: "Ajouter une région de lecture dans la même zone géographique pour répartir les requêtes entre deux régions." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The integrated cache runs in the dedicated gateway and caches point reads and query results; cache hits cost 0 RU. Clients must use the dedicated gateway connection string in Gateway mode, and only Session or Eventual reads use the cache. MaxIntegratedCacheStaleness (5 minutes by default) bounds the age of cached results.
    fr: |
      Le cache intégré s'exécute dans la passerelle dédiée et met en cache les lectures ponctuelles et les résultats de requêtes ; une lecture servie par le cache coûte 0 RU. Les clients doivent utiliser la chaîne de connexion de la passerelle dédiée en mode Gateway, et seules les lectures Session ou Eventual utilisent le cache. MaxIntegratedCacheStaleness (5 minutes par défaut) borne l'âge des résultats mis en cache.
  options:
    a: { en: "Direct mode with the original connection string bypasses the dedicated gateway, so the cache is never used.", fr: "Le mode Direct avec la chaîne de connexion d'origine contourne la passerelle dédiée : le cache n'est jamais utilisé." }
    c: { en: "Strong reads bypass the integrated cache and cost twice as many RUs as Session reads.", fr: "Les lectures Strong contournent le cache intégré et coûtent deux fois plus de RU que les lectures Session." }
    d: { en: "A read region spreads the load, but every query still consumes RUs in the region that serves it.", fr: "Une région de lecture répartit la charge, mais chaque requête consomme toujours des RU dans la région qui la sert." }
references:
  - title: Azure Cosmos DB integrated cache - Overview
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/integrated-cache
