id: dp420-cs2b-rulings-rag
objective: "3.1.7"
type: ordering
caseStudy: dp420-cs2b-wide-world-importers
difficulty: 1
status: draft
stem:
  en: |
    You need to implement the customs assistant to meet the customs assistant requirement.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez implémenter l'assistant douanier pour respecter l'exigence relative à l'assistant douanier.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste des actions vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: prompt, text: { en: "Add the returned rulings to the prompt sent to the chat model.", fr: "Ajouter les décisions renvoyées au prompt envoyé au modèle de conversation." } }
    - { id: copy, text: { en: "Copy the rulings and their embeddings to a separate vector database.", fr: "Copier les décisions et leurs incorporations dans une base de données vectorielle distincte." } }
    - { id: feature, text: { en: "Enable the Vector Search for NoSQL API feature on cosmos-wwi.", fr: "Activer la fonctionnalité Vector Search for NoSQL API sur cosmos-wwi." } }
    - { id: query, text: { en: "Generate the embedding of the broker's question and run a TOP N query ordered by VectorDistance.", fr: "Générer l'incorporation de la question du commissionnaire et exécuter une requête TOP N triée par VectorDistance." } }
    - { id: train, text: { en: "Fine-tune the embedding model on the text of the rulings.", fr: "Affiner le modèle d'incorporation sur le texte des décisions." } }
    - { id: container, text: { en: "Create a container that has a vector embedding policy and a vector index on /embedding.", fr: "Créer un conteneur qui a une stratégie d'incorporation vectorielle et un index vectoriel sur /embedding." } }
    - { id: load, text: { en: "Generate the embedding of each ruling and store it in the item of the ruling.", fr: "Générer l'incorporation de chaque décision et la stocker dans l'élément de la décision." } }
answer:
  sequence: [ feature, container, load, query, prompt ]
explanation:
  correct:
    en: |
      Vector search must be enabled on the account before you create a container with a vector policy and a vector index. The rulings are then stored with their embeddings in the same items (an integrated vector database). At question time, the question is embedded, a vector search returns the closest rulings, and the RAG pattern passes them to the chat model in the prompt.
    fr: |
      La recherche vectorielle doit être activée sur le compte avant de créer un conteneur avec une stratégie vectorielle et un index vectoriel. Les décisions sont ensuite stockées avec leurs incorporations dans les mêmes éléments (base de données vectorielle intégrée). Au moment de la question, celle-ci est convertie en incorporation, une recherche vectorielle renvoie les décisions les plus proches et le modèle RAG les transmet au modèle de conversation dans le prompt.
  options:
    copy: { en: "An integrated vector database stores the embeddings with the original data, which avoids replicating the data to a separate store.", fr: "Une base de données vectorielle intégrée stocke les incorporations avec les données d'origine, ce qui évite de répliquer les données dans un magasin distinct." }
    train: { en: "RAG grounds a deployed model with retrieved data; no model training is needed.", fr: "Le RAG ancre un modèle déployé sur des données récupérées ; aucun entraînement de modèle n'est nécessaire." }
references:
  - title: Vector database
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-database
  - title: Vector search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
