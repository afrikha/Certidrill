id: dp420-3b-perf-exclude-vector-path
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    You have an Azure Cosmos DB for NoSQL container named **articles**. Each item stores a 1,536-dimension embedding in `/embedding`. The container has a vector embedding policy and a DiskANN vector index on `/embedding`. The indexing policy has the following paths:

    ```json
    "includedPaths": [ { "path": "/*" } ],
    "excludedPaths": [ { "path": "/\"_etag\"/?" } ]
    ```

    An ingestion job inserts 200,000 articles per day. The RU charge of each insert is much higher than for items of the same size in other containers.

    You need to reduce the RU charge of the inserts without affecting vector search.

    What should you do?
  fr: |
    Vous disposez d'un conteneur Azure Cosmos DB for NoSQL nommé **articles**. Chaque élément stocke une incorporation de 1 536 dimensions dans `/embedding`. Le conteneur a une stratégie d'incorporation vectorielle et un index vectoriel DiskANN sur `/embedding`. La stratégie d'indexation contient les chemins suivants :

    ```json
    "includedPaths": [ { "path": "/*" } ],
    "excludedPaths": [ { "path": "/\"_etag\"/?" } ]
    ```

    Un travail d'ingestion insère 200 000 articles par jour. Les frais en RU de chaque insertion sont bien plus élevés que pour des éléments de même taille dans d'autres conteneurs.

    Vous devez réduire les frais en RU des insertions sans affecter la recherche vectorielle.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add /embedding/* to the excluded paths of the indexing policy.", fr: "Ajouter /embedding/* aux chemins exclus de la stratégie d'indexation." }
    - id: b
      text: { en: "Set the indexing mode of the container to none.", fr: "Définir le mode d'indexation du conteneur sur none." }
    - id: c
      text: { en: "Add a composite index on /embedding and /publishedAt.", fr: "Ajouter un index composite sur /embedding et /publishedAt." }
    - id: d
      text: { en: "Set indexingSearchListSize to 400 on the DiskANN index.", fr: "Définir indexingSearchListSize sur 400 dans l'index DiskANN." }
answer: { optionId: a }
explanation:
  correct:
    en: "With `/*` included and no exclusion for the vector path, every number of the embedding array is also written to the range index, which inflates the RU charge and latency of inserts. Excluding `/embedding/*` removes that range indexing; the vector index defined in `vectorIndexes` is separate and keeps serving `VectorDistance` queries."
    fr: "Avec `/*` inclus et aucune exclusion pour le chemin vectoriel, chaque nombre du tableau d'incorporation est aussi écrit dans l'index de plage, ce qui gonfle les frais en RU et la latence des insertions. Exclure `/embedding/*` supprime cette indexation de plage ; l'index vectoriel défini dans `vectorIndexes` est distinct et continue de servir les requêtes `VectorDistance`."
  options:
    b:
      en: "With the indexing mode set to none, no index is maintained, so queries on other properties and the vector index are no longer served efficiently."
      fr: "Avec le mode d'indexation none, aucun index n'est maintenu : les requêtes sur les autres propriétés et l'index vectoriel ne sont plus servis efficacement."
    c:
      en: "A composite index adds index entries, so it raises the write cost instead of reducing it, and it does not apply to vector arrays."
      fr: "Un index composite ajoute des entrées d'index : il augmente le coût d'écriture au lieu de le réduire, et il ne s'applique pas aux tableaux vectoriels."
    d:
      en: "A larger indexingSearchListSize improves index accuracy but lengthens index builds and raises ingestion latency."
      fr: "Une valeur indexingSearchListSize plus grande améliore la précision de l'index mais allonge sa construction et augmente la latence d'ingestion."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
