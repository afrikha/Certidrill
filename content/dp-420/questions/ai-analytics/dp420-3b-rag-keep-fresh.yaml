id: dp420-3b-rag-keep-fresh
objective: "3.1.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys runs a RAG assistant on an Azure Cosmos DB for NoSQL container named **kb**. Each item stores an article, its text and the embedding of the text. Editors update articles all day and sometimes withdraw them. The account uses periodic backup, and the backup mode must not change.

    You need to meet the following requirements:

    - The embedding of an article must be regenerated within minutes after its text changes.
    - A withdrawn article must stop being retrieved, and the embedding pipeline must be notified of the withdrawal.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys exploite un assistant RAG sur un conteneur Azure Cosmos DB for NoSQL nommé **kb**. Chaque élément stocke un article, son texte et l'incorporation du texte. Les rédacteurs mettent à jour des articles toute la journée et en retirent parfois. Le compte utilise la sauvegarde périodique, et le mode de sauvegarde ne doit pas changer.

    Vous devez répondre aux exigences suivantes :

    - L'incorporation d'un article doit être régénérée dans les minutes qui suivent la modification de son texte.
    - Un article retiré ne doit plus être récupéré, et le pipeline d'incorporation doit être informé du retrait.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Read the change feed of kb in all versions and deletes mode to detect withdrawn articles.", fr: "Lire le flux de modification de kb en mode toutes les versions et suppressions pour détecter les articles retirés." } }
    - { id: b, text: { en: "Run a .NET change feed processor in latest version mode on kb that regenerates the embedding of changed articles.", fr: "Exécuter un processeur de flux de modification .NET en mode dernière version sur kb qui régénère l'incorporation des articles modifiés." } }
    - { id: c, text: { en: "Rebuild the vector index of kb every night.", fr: "Reconstruire l'index vectoriel de kb chaque nuit." } }
    - { id: d, text: { en: "Withdraw an article by setting an isWithdrawn flag and a ttl, and exclude flagged items in the retrieval query.", fr: "Retirer un article en définissant un indicateur isWithdrawn et une valeur ttl, et exclure les éléments marqués dans la requête de récupération." } }
    - { id: e, text: { en: "Delete withdrawn articles immediately and run a nightly job that re-embeds every article.", fr: "Supprimer immédiatement les articles retirés et exécuter un travail nocturne qui recalcule l'incorporation de chaque article." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "The change feed in latest version mode is available without continuous backup and delivers each created or updated item, so a change feed processor can regenerate embeddings within minutes. Latest version mode does not capture deletes, so a soft-delete flag (captured as an update) plus a TTL notifies the pipeline, removes the item later, and lets the retrieval query exclude it at once."
    fr: "Le flux de modification en mode dernière version est disponible sans sauvegarde continue et transmet chaque élément créé ou mis à jour : un processeur de flux de modification peut régénérer les incorporations en quelques minutes. Le mode dernière version ne capture pas les suppressions ; un indicateur de suppression réversible (capturé comme une mise à jour) plus une TTL informe le pipeline, supprime l'élément plus tard et permet à la requête de récupération de l'exclure immédiatement."
  options:
    a:
      en: "All versions and deletes mode requires continuous backup, which the account does not use and cannot switch to."
      fr: "Le mode toutes les versions et suppressions exige la sauvegarde continue, que le compte n'utilise pas et ne peut pas adopter."
    c:
      en: "The vector index is maintained automatically; rebuilding it does not regenerate embeddings from changed text."
      fr: "L'index vectoriel est maintenu automatiquement ; le reconstruire ne régénère pas les incorporations à partir du texte modifié."
    e:
      en: "A nightly job misses the minutes requirement, and a hard delete is not captured by the change feed in latest version mode."
      fr: "Un travail nocturne ne respecte pas l'exigence de quelques minutes, et une suppression définitive n'est pas capturée par le flux de modification en mode dernière version."
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
  - title: Retrieval Augmented Generation - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/rag
