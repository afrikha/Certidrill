id: dp420-3b-conv-operation-match
objective: "3.2.2"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores the conversation state of its agent in an Azure Cosmos DB for NoSQL container partitioned by `/threadId`. Each thread has a metadata item whose `id` equals the thread ID, and one item per turn in the same partition. The DeleteAllItemsByPartitionKey capability is enabled on the account.

    You need to choose the most efficient operation for each task.

    Which operation should you use for each task? To answer, drag the appropriate operations to the correct tasks. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware stocke l'état de conversation de son agent dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/threadId`. Chaque thread a un élément de métadonnées dont l'`id` est égal à l'ID du thread, et un élément par tour dans la même partition. La fonctionnalité DeleteAllItemsByPartitionKey est activée sur le compte.

    Vous devez choisir l'opération la plus efficace pour chaque tâche.

    Quelle opération devez-vous utiliser pour chaque tâche ? Pour répondre, faites glisser les opérations appropriées vers les tâches correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: point, text: { en: "Point read", fr: "Lecture ponctuelle" } }
    - { id: query, text: { en: "Single-partition TOP N query", fr: "Requête TOP N sur une seule partition" } }
    - { id: batch, text: { en: "Transactional batch", fr: "Lot transactionnel" } }
    - { id: patch, text: { en: "Patch operation", fr: "Opération de patch" } }
    - { id: delpk, text: { en: "Delete items by partition key", fr: "Suppression des éléments par clé de partition" } }
  targets:
    - id: t1
      text: { en: "Load the metadata item of a thread", fr: "Charger l'élément de métadonnées d'un thread" }
    - id: t2
      text: { en: "Load the latest 10 turns of a thread", fr: "Charger les 10 derniers tours d'un thread" }
    - id: t3
      text: { en: "Insert a new turn and update the metadata item so that both writes succeed or fail together", fr: "Insérer un nouveau tour et mettre à jour l'élément de métadonnées de sorte que les deux écritures réussissent ou échouent ensemble" }
    - id: t4
      text: { en: "Erase a thread and all its turns when the user deletes the conversation", fr: "Effacer un thread et tous ses tours quand l'utilisateur supprime la conversation" }
answer:
  mapping: { t1: point, t2: query, t3: batch, t4: delpk }
explanation:
  correct:
    en: "The metadata item has a known id and partition key, so a point read is the cheapest way to load it. The latest turns are read with a TOP N query ordered by turn number inside the thread's partition. A transactional batch runs several operations on items of the same partition key atomically. Delete by partition key removes every item of the thread's logical partition in one background operation."
    fr: "L'élément de métadonnées a un id et une clé de partition connus ; une lecture ponctuelle est donc le moyen le moins coûteux de le charger. Les derniers tours se lisent avec une requête TOP N triée par numéro de tour dans la partition du thread. Un lot transactionnel exécute de façon atomique plusieurs opérations sur des éléments de même clé de partition. La suppression par clé de partition retire tous les éléments de la partition logique du thread en une seule opération en arrière-plan."
  options:
    patch:
      en: "A patch updates one item without reading it, but on its own it cannot make the insert of the turn and the update atomic."
      fr: "Un patch met à jour un élément sans le lire, mais à lui seul il ne peut pas rendre atomiques l'insertion du tour et la mise à jour."
references:
  - title: Delete Items by Partition Key Value - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-delete-by-partition-key
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
