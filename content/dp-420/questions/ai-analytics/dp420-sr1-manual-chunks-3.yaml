id: dp420-sr1-manual-chunks-3
objective: "3.1.2"
type: series_yesno
series: dp420-sr1-manual-chunks
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You create the container in shared without dedicated throughput and with a diskANN vector index.
  fr: Vous créez le conteneur dans shared sans débit dédié et avec un index vectoriel diskANN.
body:
  solution:
    en: |
      You create chunks in the **shared** database without dedicated throughput, so that it uses the 10,000 RU/s of the database, and with the following vector embedding policy:

      ```json
      {
        "vectorEmbeddings": [
          { "path": "/embedding", "dataType": "float32", "distanceFunction": "cosine", "dimensions": 3072 }
        ]
      }
      ```

      You use the following indexing policy:

      ```json
      {
        "indexingMode": "consistent",
        "automatic": true,
        "includedPaths": [{ "path": "/*" }],
        "excludedPaths": [{ "path": "/_etag/?" }, { "path": "/embedding/*" }],
        "vectorIndexes": [{ "path": "/embedding", "type": "diskANN" }]
      }
      ```
    fr: |
      Vous créez chunks dans la base de données **shared** sans débit dédié, afin qu'il utilise les 10 000 RU/s de la base de données, et avec la stratégie d'incorporation vectorielle suivante :

      ```json
      {
        "vectorEmbeddings": [
          { "path": "/embedding", "dataType": "float32", "distanceFunction": "cosine", "dimensions": 3072 }
        ]
      }
      ```

      Vous utilisez la stratégie d'indexation suivante :

      ```json
      {
        "indexingMode": "consistent",
        "automatic": true,
        "includedPaths": [{ "path": "/*" }],
        "excludedPaths": [{ "path": "/_etag/?" }, { "path": "/embedding/*" }],
        "vectorIndexes": [{ "path": "/embedding", "type": "diskANN" }]
      }
      ```
answer: { value: false }
explanation:
  correct:
    en: The policies themselves are valid for 3,072 dimensions, but vector indexing and search are not supported with shared throughput. A container that draws on the database-level 10,000 RU/s cannot use the vector index, so chunks must be created with its own throughput, for example in the kb database.
    fr: "Les stratégies elles-mêmes sont valides pour 3 072 dimensions, mais l'indexation et la recherche vectorielles ne sont pas prises en charge avec un débit partagé. Un conteneur qui utilise les 10 000 RU/s au niveau de la base de données ne peut pas utiliser l'index vectoriel : chunks doit être créé avec son propre débit, par exemple dans la base de données kb."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
