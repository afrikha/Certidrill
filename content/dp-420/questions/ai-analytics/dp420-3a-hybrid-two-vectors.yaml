id: dp420-3a-hybrid-two-vectors
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a fashion marketplace on Azure Cosmos DB for NoSQL. Each item has a `/textVector` property (embedding of the description) and an `/imageVector` property (embedding of the photo), each with its own vector policy and index. The container also has a full-text policy and a full-text index on `/description`.

    Shoppers submit a photo and a short description of the item they want. The application embeds the photo into `@img` and the description into `@txt`.

    You need to rank the items by fusing the photo similarity and the description similarity, with equal importance.

    Which ORDER BY clause should you use?
  fr: |
    Litware exploite une place de marché de mode sur Azure Cosmos DB for NoSQL. Chaque élément possède une propriété `/textVector` (incorporation de la description) et une propriété `/imageVector` (incorporation de la photo), chacune avec sa propre stratégie et son propre index vectoriels. Le conteneur possède aussi une stratégie de texte intégral et un index de texte intégral sur `/description`.

    Les clients soumettent une photo et une courte description de l'article recherché. L'application incorpore la photo dans `@img` et la description dans `@txt`.

    Vous devez classer les éléments en fusionnant la similarité de la photo et celle de la description, avec la même importance.

    Quelle clause ORDER BY devez-vous utiliser ?
body:
  options:
    - { id: a, text: "ORDER BY VectorDistance(c.imageVector, @img), VectorDistance(c.textVector, @txt)" }
    - { id: b, text: "ORDER BY RANK RRF(VectorDistance(c.imageVector, @img), FullTextScore(c.description, @txt))" }
    - { id: c, text: "ORDER BY RANK VectorDistance(c.imageVector, @img)" }
    - { id: d, text: "ORDER BY RANK RRF(VectorDistance(c.imageVector, @img), VectorDistance(c.textVector, @txt))" }
answer: { optionId: d }
explanation:
  correct:
    en: "RRF can fuse two VectorDistance functions on different vector paths, so each item gets one rank from the photo similarity and one from the description similarity, merged with equal weight when no weights array is passed. RRF is used in ORDER BY RANK, and the container meets its full-text index requirement."
    fr: "RRF peut fusionner deux fonctions VectorDistance sur des chemins vectoriels différents : chaque élément reçoit un rang pour la similarité de la photo et un pour celle de la description, fusionnés avec le même poids en l'absence de tableau de poids. RRF s'utilise dans ORDER BY RANK, et le conteneur satisfait son exigence d'index de texte intégral."
  options:
    a: { en: "Two sort keys order by the photo similarity first and use the description only to break ties; they don't fuse the rankings.", fr: "Deux clés de tri classent d'abord par similarité de la photo et n'utilisent la description que pour départager ; elles ne fusionnent pas les classements." }
    b: { en: "FullTextScore takes search terms, not an embedding, and the requirement is the description's semantic similarity.", fr: "FullTextScore prend des termes de recherche, pas une incorporation, et l'exigence porte sur la similarité sémantique de la description." }
    c: { en: "This ranks by the photo similarity only and ignores the description.", fr: "Ce tri ne classe que selon la similarité de la photo et ignore la description." }
references:
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
