id: dp420-3c-mirror-behavior-yn
objective: "3.3.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware mirrors the sessions database of an Azure Cosmos DB for NoSQL account into Microsoft Fabric. The sessions container has a default time to live (TTL) of 30 days. The containers use provisioned throughput.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware met en miroir la base de données sessions d'un compte Azure Cosmos DB for NoSQL dans Microsoft Fabric. Le conteneur sessions a une durée de vie (TTL) par défaut de 30 jours. Les conteneurs utilisent un débit provisionné.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "When an item of the sessions container expires, the item is also removed from the mirrored table.", fr: "Quand un élément du conteneur sessions expire, il est aussi supprimé de la table en miroir." }
    - id: s2
      text: { en: "Replicating inserts and updates to OneLake consumes part of the throughput provisioned on the containers.", fr: "La réplication des insertions et des mises à jour vers OneLake consomme une partie du débit provisionné sur les conteneurs." }
    - id: s3
      text: { en: "Running a query in the Source database view of the mirrored database consumes request units (RUs) of the account.", fr: "Exécuter une requête dans la vue Source database de la base de données en miroir consomme des unités de requête (RU) du compte." }
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Mirroring treats TTL deletes like any other delete, so expired items disappear from the mirror; TTL-based soft deletes aren't supported. Replication itself doesn't consume the RUs allocated to transactional workloads. The Source database view sends real requests to the Azure Cosmos DB account, so browsing or querying there consumes RUs."
    fr: "La mise en miroir traite les suppressions par TTL comme toute autre suppression : les éléments expirés disparaissent donc du miroir ; les suppressions réversibles basées sur la TTL ne sont pas prises en charge. La réplication elle-même ne consomme pas les RU allouées aux charges de travail transactionnelles. La vue Source database envoie de vraies requêtes au compte Azure Cosmos DB : parcourir ou interroger les données à cet endroit consomme donc des RU."
references:
  - title: Frequently asked questions for Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-faq
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
