id: dp420-3b-perf-searchlist-recall
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores 12 million support articles in an Azure Cosmos DB for NoSQL container that has a DiskANN vector index on `/contentVector`. The application runs the following query:

    ```sql
    SELECT TOP 10 c.id, c.title
    FROM c
    ORDER BY VectorDistance(c.contentVector, @v)
    ```

    A test against exact results shows that recall is below the target. You need to improve recall. The container must not be recreated and the queries must keep using the DiskANN index.

    What should you do?
  fr: |
    Woodgrove Bank stocke 12 millions d'articles de support dans un conteneur Azure Cosmos DB for NoSQL qui a un index vectoriel DiskANN sur `/contentVector`. L'application exécute la requête suivante :

    ```sql
    SELECT TOP 10 c.id, c.title
    FROM c
    ORDER BY VectorDistance(c.contentVector, @v)
    ```

    Un test par rapport aux résultats exacts montre que le rappel est inférieur à l'objectif. Vous devez améliorer le rappel. Le conteneur ne doit pas être recréé et les requêtes doivent continuer d'utiliser l'index DiskANN.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Pass {\"distanceFunction\": \"Euclidean\"} as the options argument of VectorDistance.", fr: "Passer {\"distanceFunction\": \"Euclidean\"} comme argument d'options de VectorDistance." }
    - id: b
      text: { en: "Pass true as the third argument of VectorDistance.", fr: "Passer true comme troisième argument de VectorDistance." }
    - id: c
      text: { en: "Pass {\"searchListSizeMultiplier\": 10} as the options argument of VectorDistance.", fr: "Passer {\"searchListSizeMultiplier\": 10} comme argument d'options de VectorDistance." }
    - id: d
      text: { en: "Replace TOP 10 with TOP 3 in the query.", fr: "Remplacer TOP 10 par TOP 3 dans la requête." }
answer: { optionId: c }
explanation:
  correct:
    en: "`searchListSizeMultiplier` is a query-time option of `VectorDistance` that enlarges the DiskANN search list. A higher value can increase recall at the expense of latency and RU, and it needs no change to the index or the container."
    fr: "`searchListSizeMultiplier` est une option de `VectorDistance` appliquée au moment de la requête qui agrandit la liste de recherche DiskANN. Une valeur plus élevée peut augmenter le rappel au prix de la latence et des RU, sans aucune modification de l'index ni du conteneur."
  options:
    b:
      en: "A true bool_expr forces a brute-force search, which ignores the DiskANN index and breaks the requirement."
      fr: "Une valeur bool_expr true impose une recherche par force brute, qui ignore l'index DiskANN et enfreint l'exigence."
    a:
      en: "Overriding the distance function changes how similarity is measured, not how many candidates the index explores, and it no longer matches the function the embeddings were designed for."
      fr: "Remplacer la fonction de distance change la façon de mesurer la similarité, pas le nombre de candidats explorés par l'index, et elle ne correspond plus à la fonction prévue pour les incorporations."
    d:
      en: "Returning fewer results reduces cost but does not make the approximate search find the true nearest neighbors more often."
      fr: "Renvoyer moins de résultats réduit le coût mais n'aide pas la recherche approximative à trouver plus souvent les vrais plus proches voisins."
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
