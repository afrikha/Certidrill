id: dp420-3a-fts-contains-ru
objective: "3.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso runs a support application on an Azure Cosmos DB for NoSQL account. The **tickets** container holds 4 million items, and the agents' search runs the following query across all partitions:

    ```sql
    SELECT TOP 20 c.id, c.subject
    FROM c
    WHERE CONTAINS(c.body, "timeout", true)
    ```

    Each search consumes several thousand RUs. The Full Text & Hybrid Search for NoSQL API feature is already enabled on the account.

    You need to reduce the RU charge of the search. The search must also match the other forms of the word, such as "timeouts".

    What should you do?
  fr: |
    Contoso exécute une application de support sur un compte Azure Cosmos DB for NoSQL. Le conteneur **tickets** contient 4 millions d'éléments, et la recherche des agents exécute la requête suivante sur toutes les partitions :

    ```sql
    SELECT TOP 20 c.id, c.subject
    FROM c
    WHERE CONTAINS(c.body, "timeout", true)
    ```

    Chaque recherche consomme plusieurs milliers de RU. La fonctionnalité Full Text & Hybrid Search for NoSQL API est déjà activée sur le compte.

    Vous devez réduire le coût en RU de la recherche. La recherche doit aussi trouver les autres formes du mot, comme « timeouts ».

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a composite index on /body and /id, and keep the CONTAINS function.", fr: "Ajouter un index composite sur /body et /id, et conserver la fonction CONTAINS." }
    - id: b
      text: { en: "Add a computed property that lowercases /body, and run CONTAINS on the computed property.", fr: "Ajouter une propriété calculée qui met /body en minuscules, et exécuter CONTAINS sur cette propriété calculée." }
    - id: c
      text: { en: "Declare /body in a full-text policy and a full-text index, and replace CONTAINS with FullTextContains.", fr: "Déclarer /body dans une stratégie de texte intégral et un index de texte intégral, et remplacer CONTAINS par FullTextContains." }
    - id: d
      text: { en: "Add /body/? to the included paths of the indexing policy, and replace CONTAINS with STARTSWITH.", fr: "Ajouter /body/? aux chemins inclus de la stratégie d'indexation, et remplacer CONTAINS par STARTSWITH." }
answer: { optionId: c }
explanation:
  correct:
    en: "`FullTextContains` uses the full-text index, which tokenizes and stems the text of the paths declared in the container's full-text policy, so a search for \"timeout\" also finds \"timeouts\". Learn shows `FullTextContains` costing a few RUs where `CONTAINS` on the same data costs thousands, because `CONTAINS` must read the text of every candidate item."
    fr: "`FullTextContains` utilise l'index de texte intégral, qui segmente en jetons et réduit à leur racine les mots des chemins déclarés dans la stratégie de texte intégral du conteneur : une recherche de « timeout » trouve aussi « timeouts ». Learn montre `FullTextContains` à quelques RU là où `CONTAINS` coûte des milliers de RU sur les mêmes données, car `CONTAINS` doit lire le texte de chaque élément candidat."
  options:
    a: { en: "A composite index serves ORDER BY and filters on several properties; it does not speed up substring searches or add stemming.", fr: "Un index composite sert ORDER BY et les filtres sur plusieurs propriétés ; il n'accélère pas les recherches de sous-chaînes et n'ajoute pas de racinisation." }
    b: { en: "A lowercased copy keeps CONTAINS a scan of every item's text, with the same RU cost and no stemming.", fr: "Une copie en minuscules laisse CONTAINS parcourir le texte de chaque élément, avec le même coût en RU et sans racinisation." }
    d: { en: "The range index already covers /body through /*, and STARTSWITH only tests the start of the whole string, not a word inside it.", fr: "L'index de plage couvre déjà /body via /*, et STARTSWITH ne teste que le début de la chaîne entière, pas un mot qu'elle contient." }
references:
  - title: FULLTEXTCONTAINS - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/fulltextcontains
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
