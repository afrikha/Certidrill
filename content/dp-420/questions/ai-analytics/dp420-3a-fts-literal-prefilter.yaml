id: dp420-3a-fts-literal-prefilter
objective: "3.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso stores device logs in an Azure Cosmos DB for NoSQL container named **logs** whose partition key is `/deviceId`. The `/message` property has a full-text policy (en-US) and a full-text index. Each device has about 200,000 log entries.

    You need to return, for one device, the entries whose message contains the exact literal string `ERR_0x7F`, with the same case. The query must consume as few RUs as possible.

    Which WHERE clause should you use?
  fr: |
    Contoso stocke des journaux d'appareils dans un conteneur Azure Cosmos DB for NoSQL nommé **logs** dont la clé de partition est `/deviceId`. La propriété `/message` possède une stratégie de texte intégral (en-US) et un index de texte intégral. Chaque appareil compte environ 200 000 entrées de journal.

    Vous devez renvoyer, pour un appareil, les entrées dont le message contient exactement la chaîne littérale `ERR_0x7F`, avec la même casse. La requête doit consommer le moins de RU possible.

    Quelle clause WHERE devez-vous utiliser ?
body:
  options:
    - id: a
      text: "WHERE c.deviceId = @d AND CONTAINS(c.message, \"ERR_0x7F\")"
    - id: b
      text: "WHERE c.deviceId = @d AND FullTextContains(c.message, \"ERR_0x7F\") AND CONTAINS(c.message, \"ERR_0x7F\")"
    - id: c
      text: "WHERE c.deviceId = @d AND FullTextContains(c.message, \"ERR_0x7F\")"
    - id: d
      text: "WHERE c.deviceId = @d AND FullTextContainsAny(c.message, \"ERR\", \"0x7F\")"
answer: { optionId: b }
explanation:
  correct:
    en: "FullTextContains uses the full-text index to find the few entries that match the tokenized term, at a low RU cost. CONTAINS, evaluated afterwards on that small set, keeps only the entries that contain the literal, case-sensitive substring. Learn documents this combination as the pattern for literal substring matches with full-text performance."
    fr: "FullTextContains utilise l'index de texte intégral pour trouver les quelques entrées correspondant au terme segmenté, pour un faible coût en RU. CONTAINS, évalué ensuite sur ce petit ensemble, ne garde que les entrées qui contiennent la sous-chaîne littérale, en respectant la casse. Learn documente cette combinaison comme le modèle pour les correspondances de sous-chaînes littérales avec les performances du texte intégral."
  options:
    a: { en: "CONTAINS alone returns the right entries but reads the message of every entry of the device, which costs far more RUs.", fr: "CONTAINS seul renvoie les bonnes entrées, mais lit le message de chaque entrée de l'appareil, ce qui coûte beaucoup plus de RU." }
    c: { en: "FullTextContains matches tokenized, stemmed terms, so it doesn't guarantee the exact literal string with the same case.", fr: "FullTextContains compare des termes segmentés et réduits à leur racine : il ne garantit pas la chaîne littérale exacte avec la même casse." }
    d: { en: "FullTextContainsAny keeps entries that contain only one of the two fragments, so it returns wrong entries.", fr: "FullTextContainsAny garde les entrées qui ne contiennent qu'un des deux fragments : il renvoie des entrées erronées." }
references:
  - title: FULLTEXTCONTAINS - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/fulltextcontains
