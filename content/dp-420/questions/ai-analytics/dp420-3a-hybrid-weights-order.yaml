id: dp420-3a-hybrid-weights-order
objective: "3.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum's help center uses hybrid search on an Azure Cosmos DB for NoSQL container that has a vector index on `/embedding` and a full-text index on `/body`. Usability tests show that semantic similarity should count twice as much as keyword relevance.

    You need to complete the query to apply this weighting.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le centre d'aide d'Adatum utilise la recherche hybride sur un conteneur Azure Cosmos DB for NoSQL doté d'un index vectoriel sur `/embedding` et d'un index de texte intégral sur `/body`. Des tests d'utilisabilité montrent que la similarité sémantique doit compter deux fois plus que la pertinence des mots clés.

    Vous devez compléter la requête pour appliquer cette pondération.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT TOP 10 c.id, c.title
    FROM c
    [[clause]] RRF(
        FullTextScore(c.body, @term1, @term2),
        VectorDistance(c.embedding, @queryVector),
        [[w]])
  slots:
    - id: clause
      options:
        - { id: rank, text: ORDER BY RANK }
        - { id: where, text: WHERE }
        - { id: orderby, text: ORDER BY }
    - id: w
      options:
        - { id: w21, text: "[2, 1]" }
        - { id: w11, text: "[1, 1]" }
        - { id: w2, text: "[2]" }
        - { id: w12, text: "[1, 2]" }
answer:
  values: { clause: rank, w: w12 }
explanation:
  correct:
    en: "RRF can only be used in an ORDER BY RANK clause. Its optional last argument is an array with one importance weight per scoring function, in the order of the functions: FullTextScore comes first here, so [1, 2] makes VectorDistance twice as important."
    fr: "RRF ne s'utilise que dans une clause ORDER BY RANK. Son dernier argument facultatif est un tableau contenant un poids d'importance par fonction de score, dans l'ordre des fonctions : FullTextScore vient en premier ici, donc [1, 2] rend VectorDistance deux fois plus important."
  options:
    where: { en: "RRF returns a fused score for ranking; it can't be used as a filter.", fr: "RRF renvoie un score fusionné pour le classement ; il ne peut pas servir de filtre." }
    orderby: { en: "RRF requires ORDER BY RANK, not a plain ORDER BY.", fr: "RRF exige ORDER BY RANK, pas un simple ORDER BY." }
    w21: { en: "[2, 1] gives the double weight to the first function, FullTextScore.", fr: "[2, 1] donne le double poids à la première fonction, FullTextScore." }
    w11: { en: "[1, 1] weights both functions equally.", fr: "[1, 1] pondère les deux fonctions à égalité." }
    w2: { en: "The weights array needs one weight for each scoring function.", fr: "Le tableau de poids exige un poids pour chaque fonction de score." }
references:
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
