id: dp420-3b-sem-extraction-trigger
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank's advisory agent writes each turn to an Azure Cosmos DB for NoSQL container named **turns**. In production, a chat model must extract facts and summaries from new turns and store them, with their embeddings, in a container named **memories**.

    Extraction must start shortly after new turns are written, must not add latency to the agent's replies, and must not scan the turns container.

    What should you implement?
  fr: |
    L'agent de conseil de Woodgrove Bank écrit chaque tour dans un conteneur Azure Cosmos DB for NoSQL nommé **turns**. En production, un modèle de conversation doit extraire des faits et des résumés des nouveaux tours et les stocker, avec leurs incorporations, dans un conteneur nommé **memories**.

    L'extraction doit démarrer peu après l'écriture de nouveaux tours, ne doit pas ajouter de latence aux réponses de l'agent et ne doit pas analyser tout le conteneur turns.

    Que devez-vous implémenter ?
body:
  options:
    - id: a
      text: { en: "Call the extraction model in the agent's request, after writing each turn and before replying.", fr: "Appeler le modèle d'extraction dans la requête de l'agent, après l'écriture de chaque tour et avant de répondre." }
    - id: b
      text: { en: "Process the change feed of turns in a separate Azure Durable Functions app that runs the extraction.", fr: "Traiter le flux de modification de turns dans une application Azure Durable Functions distincte qui exécute l'extraction." }
    - id: c
      text: { en: "Run an hourly job that queries turns for items whose _ts is greater than the last run.", fr: "Exécuter un travail horaire qui interroge turns pour obtenir les éléments dont _ts est supérieur à la dernière exécution." }
    - id: d
      text: { en: "Add a time to live to turns and extract the facts when the turns expire.", fr: "Ajouter une durée de vie à turns et extraire les faits quand les tours expirent." }
answer: { optionId: b }
explanation:
  correct:
    en: "The production pattern of the Agent Memory Toolkit runs the memory pipeline in Azure Durable Functions in a sibling function app, triggered by the Azure Cosmos DB change feed when new turns are written. The change feed delivers only the new and updated items, and the background processing keeps extraction out of the agent's response path."
    fr: "Le modèle de production de l'Agent Memory Toolkit exécute le pipeline de mémoire dans Azure Durable Functions, dans une application de fonctions sœur, déclenchée par le flux de modification d'Azure Cosmos DB quand de nouveaux tours sont écrits. Le flux de modification ne transmet que les éléments nouveaux et mis à jour, et le traitement en arrière-plan sort l'extraction du chemin de réponse de l'agent."
  options:
    a:
      en: "A synchronous model call in the request path adds its latency to every reply."
      fr: "Un appel synchrone au modèle dans le chemin de la requête ajoute sa latence à chaque réponse."
    c:
      en: "An hourly job does not start shortly after the writes, and a filter on _ts runs a cross-partition query over the container."
      fr: "Un travail horaire ne démarre pas peu après les écritures, et un filtre sur _ts exécute une requête interpartitions sur le conteneur."
    d:
      en: "Expired items are deleted in the background and are not delivered in the change feed in latest version mode, so nothing would trigger the extraction."
      fr: "Les éléments expirés sont supprimés en arrière-plan et ne sont pas transmis par le flux de modification en mode dernière version : rien ne déclencherait l'extraction."
references:
  - title: Agent Memory Toolkit (Preview) - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-memory-toolkit
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
