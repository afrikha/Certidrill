id: dp420-3a-fts-function-match
objective: "3.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Litware stores support articles in an Azure Cosmos DB for NoSQL container. The `/text` property has a full-text policy and a full-text index.

    You need to choose the function to use for each requirement of the search feature.

    Which function should you use for each requirement? To answer, drag the appropriate functions to the correct requirements. Each function may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke des articles de support dans un conteneur Azure Cosmos DB for NoSQL. La propriété `/text` possède une stratégie de texte intégral et un index de texte intégral.

    Vous devez choisir la fonction à utiliser pour chaque exigence de la fonctionnalité de recherche.

    Quelle fonction devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctions appropriées vers les exigences correspondantes. Chaque fonction peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: contains, text: FullTextContains }
    - { id: all, text: FullTextContainsAll }
    - { id: any, text: FullTextContainsAny }
    - { id: score, text: FullTextScore }
    - { id: strcontains, text: CONTAINS }
  targets:
    - id: t1
      text: { en: "Keep the articles that contain the phrase \"out of stock\".", fr: "Garder les articles qui contiennent l'expression « out of stock »." }
    - id: t2
      text: { en: "Keep the articles that contain at least one of the words \"refund\", \"chargeback\" or \"dispute\".", fr: "Garder les articles qui contiennent au moins un des mots « refund », « chargeback » ou « dispute »." }
    - id: t3
      text: { en: "Keep the articles that contain each of the words \"battery\" and \"warranty\", even far apart.", fr: "Garder les articles qui contiennent chacun des mots « battery » et « warranty », même éloignés." }
    - id: t4
      text: { en: "Sort the articles by their BM25 relevance to the words typed by the user.", fr: "Trier les articles selon leur pertinence BM25 par rapport aux mots saisis par l'utilisateur." }
answer:
  mapping: { t1: contains, t2: any, t3: all, t4: score }
explanation:
  correct:
    en: "FullTextContains tests whether a string, such as a phrase, is in the property. FullTextContainsAny is true when at least one term is present, and FullTextContainsAll when every term is present, not necessarily together; all three go in WHERE. FullTextScore returns the BM25 score used in ORDER BY RANK."
    fr: "FullTextContains teste si une chaîne, comme une expression, figure dans la propriété. FullTextContainsAny est vrai si au moins un terme est présent, FullTextContainsAll si chaque terme est présent, pas forcément ensemble ; les trois s'utilisent dans WHERE. FullTextScore renvoie le score BM25 utilisé dans ORDER BY RANK."
  options:
    strcontains: { en: "CONTAINS is a string function that does not use the full-text index; it reads the text of every candidate item.", fr: "CONTAINS est une fonction de chaîne qui n'utilise pas l'index de texte intégral ; elle lit le texte de chaque élément candidat." }
references:
  - title: Full Text Indexing and Search - Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/full-text-indexing
