id: dp420-3c-long-json-strings
objective: "3.3.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has mirrored an Azure Cosmos DB for NoSQL container named inspections into Microsoft Fabric since October 2025. Each item has a nested `report` object that often exceeds 50 KB.

    In the SQL analytics endpoint, the `report` column holds at most 8,000 characters, and `OPENJSON` on that column fails with a JSON formatting error for large reports.

    You need to analyze the complete reports. The solution must not recreate the mirrored table and must not consume request units (RUs).

    What should you do?
  fr: |
    Adatum met en miroir un conteneur Azure Cosmos DB for NoSQL nommé inspections dans Microsoft Fabric depuis octobre 2025. Chaque élément a un objet imbriqué `report` qui dépasse souvent 50 Ko.

    Dans le point de terminaison d'analytique SQL, la colonne `report` contient au plus 8 000 caractères, et `OPENJSON` sur cette colonne échoue avec une erreur de format JSON pour les rapports volumineux.

    Vous devez analyser les rapports complets. La solution ne doit pas recréer la table en miroir et ne doit pas consommer d'unités de requête (RU).

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a OneLake shortcut to the table in a lakehouse, and parse the column in a Spark notebook.", fr: "Créer un raccourci OneLake vers la table dans un lakehouse, et analyser la colonne dans un notebook Spark." } }
    - { id: b, text: { en: "Declare the report column as nvarchar(max) AS JSON in the WITH clause of OPENJSON.", fr: "Déclarer la colonne report en nvarchar(max) AS JSON dans la clause WITH d'OPENJSON." } }
    - { id: c, text: { en: "In a T-SQL view, cast the report column to varchar(max) before calling OPENJSON.", fr: "Dans une vue T-SQL, convertir la colonne report en varchar(max) avant d'appeler OPENJSON." } }
    - { id: d, text: { en: "Read the inspections container with the cosmos.oltp format of the Spark connector.", fr: "Lire le conteneur inspections avec le format cosmos.oltp du connecteur Spark." } }
answer: { optionId: a }
explanation:
  correct:
    en: "Tables mirrored before November 18, 2025 expose strings as `varchar(8000)` in the SQL analytics endpoint; only recreated tables get `varchar(max)` up to 2 MB. The Delta data in OneLake isn't limited this way, so a lakehouse shortcut and Spark read the full JSON on Fabric capacity, without RUs."
    fr: "Les tables mises en miroir avant le 18 novembre 2025 exposent les chaînes en `varchar(8000)` dans le point de terminaison d'analytique SQL ; seules les tables recréées obtiennent `varchar(max)` jusqu'à 2 Mo. Les données Delta dans OneLake ne sont pas limitées de cette façon : un raccourci de lakehouse et Spark lisent donc le JSON complet sur la capacité Fabric, sans RU."
  options:
    b:
      en: "AS JSON changes how OPENJSON returns a nested fragment, but the input string is still truncated at 8,000 characters."
      fr: "AS JSON change la façon dont OPENJSON renvoie un fragment imbriqué, mais la chaîne d'entrée reste tronquée à 8 000 caractères."
    c:
      en: "Casting can't restore characters that the endpoint's varchar(8000) column already cut off."
      fr: "Une conversion ne peut pas restituer les caractères déjà coupés par la colonne varchar(8000) du point de terminaison."
    d:
      en: "The cosmos.oltp format reads the operational container and consumes RUs."
      fr: "Le format cosmos.oltp lit le conteneur opérationnel et consomme des RU."
references:
  - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
  - title: "How to: Access mirrored Azure Cosmos DB data in Lakehouse and notebooks from Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-lakehouse-notebooks
