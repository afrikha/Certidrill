id: dp420-cs1c-keyword-ru
objective: "3.1.6"
type: single
caseStudy: dp420-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    The chunks container is created with a full-text policy that declares the `/text` path in en-US. Its indexing policy includes `/*`, excludes `/embedding/*` and defines a DiskANN vector index on `/embedding`. It has no other index definition.

    Keyword searches return the expected chunks, but their RU charge is high.

    You need to meet the requirement for the keyword search. What should you do?
  fr: |
    Le conteneur chunks est créé avec une stratégie de texte intégral qui déclare le chemin `/text` en en-US. Sa stratégie d'indexation inclut `/*`, exclut `/embedding/*` et définit un index vectoriel DiskANN sur `/embedding`. Elle ne contient aucune autre définition d'index.

    Les recherches par mots clés renvoient les segments attendus, mais leur consommation de RU est élevée.

    Vous devez satisfaire l'exigence relative à la recherche par mots clés. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Add a composite index on /text and /reportId to the indexing policy.", fr: "Ajouter un index composite sur /text et /reportId à la stratégie d'indexation." } }
    - { id: b, text: { en: "Add /text to the fullTextIndexes of the indexing policy.", fr: "Ajouter /text aux fullTextIndexes de la stratégie d'indexation." } }
    - { id: c, text: { en: "Add /text/? to the included paths of the indexing policy.", fr: "Ajouter /text/? aux chemins inclus de la stratégie d'indexation." } }
    - { id: d, text: { en: "Enable the Diagnostics full-text query feature on the account.", fr: "Activer la fonctionnalité Diagnostics full-text query sur le compte." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Full-text functions such as FullTextContainsAll run without a full-text index, but they then cannot use the index, which costs more RUs and adds latency. Adding the `/text` path to `fullTextIndexes`, alongside the existing full-text policy, lets the queries use the full-text index.
    fr: |
      Les fonctions de texte intégral comme FullTextContainsAll s'exécutent sans index de texte intégral, mais elles ne peuvent alors pas utiliser d'index, ce qui consomme plus de RU et augmente la latence. Ajouter le chemin `/text` aux `fullTextIndexes`, en plus de la stratégie de texte intégral existante, permet aux requêtes d'utiliser l'index de texte intégral.
  options:
    a: { en: "Composite indexes serve ORDER BY clauses and multi-property filters; they do not tokenize text for full-text functions.", fr: "Les index composites servent les clauses ORDER BY et les filtres sur plusieurs propriétés ; ils ne segmentent pas le texte pour les fonctions de texte intégral." }
    c: { en: "/text/? is already covered by the /* included path, and a range index does not serve full-text functions.", fr: "/text/? est déjà couvert par le chemin inclus /*, et un index de plage ne sert pas les fonctions de texte intégral." }
    d: { en: "This feature only logs the full text of queries in the diagnostic logs, which can increase logging costs; it does not change how queries run.", fr: "Cette fonctionnalité journalise seulement le texte complet des requêtes dans les journaux de diagnostic, ce qui peut augmenter les coûts de journalisation ; elle ne modifie pas l'exécution des requêtes." }
references:
  - title: Full-text search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
