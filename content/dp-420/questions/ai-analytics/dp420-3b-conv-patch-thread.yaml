id: dp420-3b-conv-patch-thread
objective: "3.2.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys keeps a thread metadata item for each conversation of its booking agent in an Azure Cosmos DB for NoSQL container partitioned by `/threadId`. The item's `id` equals the thread ID. It contains a numeric `turnCount` property and, while the agent waits for a tool, a `pendingToolCall` object.

    When a tool call completes, the agent must add 1 to `turnCount` and delete `pendingToolCall` in a single request, without reading the item first.

    How should you complete the C# code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys conserve un élément de métadonnées de thread pour chaque conversation de son agent de réservation, dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/threadId`. L'`id` de l'élément est égal à l'ID du thread. Il contient une propriété numérique `turnCount` et, pendant que l'agent attend un outil, un objet `pendingToolCall`.

    Quand un appel d'outil se termine, l'agent doit ajouter 1 à `turnCount` et supprimer `pendingToolCall` en une seule requête, sans lire l'élément au préalable.

    Comment devez-vous compléter le code C# ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    await container.[[method]]<ThreadInfo>(
        threadId,
        new PartitionKey(threadId),
        new[]
        {
            PatchOperation.[[op1]]("/turnCount", 1),
            PatchOperation.[[op2]]("/pendingToolCall")
        });
  slots:
    - id: method
      options:
        - { id: patch, text: PatchItemAsync }
        - { id: replace, text: ReplaceItemAsync }
        - { id: upsert, text: UpsertItemAsync }
    - id: op1
      options:
        - { id: incr, text: Increment }
        - { id: set, text: Set }
        - { id: add, text: Add }
    - id: op2
      options:
        - { id: remove, text: Remove }
        - { id: replaceop, text: Replace }
        - { id: move, text: Move }
answer:
  values: { method: patch, op1: incr, op2: remove }
explanation:
  correct:
    en: "PatchItemAsync applies a list of partial-update operations to one item, identified by its id and partition key, without sending the whole document. Increment adds the given value to a numeric field, and Remove deletes a property. Up to 10 operations can be combined in one patch."
    fr: "PatchItemAsync applique une liste d'opérations de mise à jour partielle à un élément, identifié par son id et sa clé de partition, sans envoyer le document entier. Increment ajoute la valeur indiquée à un champ numérique, et Remove supprime une propriété. Jusqu'à 10 opérations peuvent être combinées dans un patch."
  options:
    replace:
      en: "ReplaceItemAsync needs the whole item, which requires reading it first."
      fr: "ReplaceItemAsync exige l'élément entier, ce qui impose de le lire d'abord."
    upsert:
      en: "UpsertItemAsync also writes a whole item and cannot apply patch operations."
      fr: "UpsertItemAsync écrit aussi un élément entier et ne peut pas appliquer d'opérations de patch."
    set:
      en: "Set would overwrite turnCount with the value 1 instead of adding 1."
      fr: "Set remplacerait turnCount par la valeur 1 au lieu d'y ajouter 1."
    add:
      en: "On an existing property, Add replaces the value, so turnCount would become 1."
      fr: "Sur une propriété existante, Add remplace la valeur : turnCount deviendrait 1."
    replaceop:
      en: "Replace sets a new value at an existing path; it does not delete the property."
      fr: "Replace définit une nouvelle valeur à un chemin existant ; il ne supprime pas la propriété."
    move:
      en: "Move copies the value from one path to another; it needs a destination and keeps the data."
      fr: "Move déplace la valeur d'un chemin vers un autre ; il exige une destination et conserve les données."
references:
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
