id: dp420-3b-perf-vector-query-ru
objective: "3.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware hosts a document assistant for 3,000 customer tenants. All the documents are stored in one Azure Cosmos DB for NoSQL container partitioned by `/tenantId`, with a DiskANN vector index on `/embedding`. Each request serves one tenant, whose ID is known, and the user interface displays the 10 most similar documents.

    The application runs the following query:

    ```sql
    SELECT c.id, c.title, VectorDistance(c.embedding, @v) AS score
    FROM c
    ORDER BY VectorDistance(c.embedding, @v)
    ```

    You need to minimize the RU charge of the query. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware héberge un assistant documentaire pour 3 000 locataires clients. Tous les documents sont stockés dans un seul conteneur Azure Cosmos DB for NoSQL partitionné par `/tenantId`, avec un index vectoriel DiskANN sur `/embedding`. Chaque requête de l'application sert un seul locataire, dont l'ID est connu, et l'interface utilisateur affiche les 10 documents les plus similaires.

    L'application exécute la requête suivante :

    ```sql
    SELECT c.id, c.title, VectorDistance(c.embedding, @v) AS score
    FROM c
    ORDER BY VectorDistance(c.embedding, @v)
    ```

    Vous devez réduire au minimum les frais en RU de la requête. Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add TOP 10 to the SELECT clause.", fr: "Ajouter TOP 10 à la clause SELECT." } }
    - { id: b, text: { en: "Add WHERE c.tenantId = @tenantId and pass the tenant ID as the partition key of the query.", fr: "Ajouter WHERE c.tenantId = @tenantId et passer l'ID du locataire comme clé de partition de la requête." } }
    - { id: c, text: { en: "Pass true as the third argument of both VectorDistance calls.", fr: "Passer true comme troisième argument des deux appels à VectorDistance." } }
    - { id: d, text: { en: "Pass {\"searchListSizeMultiplier\": 20} as the options argument of VectorDistance.", fr: "Passer {\"searchListSizeMultiplier\": 20} comme argument d'options de VectorDistance." } }
    - { id: e, text: { en: "Add a composite index on /tenantId and /embedding.", fr: "Ajouter un index composite sur /tenantId et /embedding." } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: "Without TOP N, a vector query returns far more results than needed, which costs more RU and adds latency, so TOP 10 must be added. Without a filter on the partition key, the query fans out to every physical partition and searches each DiskANN index; filtering on the tenant targets a single partition."
    fr: "Sans TOP N, une requête vectorielle renvoie bien plus de résultats que nécessaire, ce qui coûte plus de RU et ajoute de la latence : il faut donc ajouter TOP 10. Sans filtre sur la clé de partition, la requête est diffusée vers toutes les partitions physiques et parcourt chaque index DiskANN ; filtrer sur le locataire cible une seule partition."
  options:
    c:
      en: "A true bool_expr forces a brute-force comparison with every vector, which raises the RU charge."
      fr: "Une valeur bool_expr true impose une comparaison par force brute avec chaque vecteur, ce qui augmente les frais en RU."
    d:
      en: "A larger search list improves recall at the expense of latency and RU."
      fr: "Une liste de recherche plus grande améliore le rappel au prix de la latence et des RU."
    e:
      en: "Composite indexes serve ORDER BY and filters on scalar properties; they do not speed up a vector search."
      fr: "Les index composites servent les clauses ORDER BY et les filtres sur des propriétés scalaires ; ils n'accélèrent pas une recherche vectorielle."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
