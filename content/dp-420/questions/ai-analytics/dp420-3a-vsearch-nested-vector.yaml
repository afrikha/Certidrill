id: dp420-3a-vsearch-nested-vector
objective: "3.1.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Wingtip's Python assistant searches an Azure Cosmos DB for NoSQL container that holds 300,000 items, with a vector embedding policy (1,536 dimensions) and a diskANN index on `/embedding`. The vector path is excluded from the range index. The code is the following:

    ```python
    response = openai_client.embeddings.create(input=[question], model="embed-small")
    query_vector = [d.embedding for d in response.data]

    items = container.query_items(
        query="SELECT TOP 5 c.id, VectorDistance(c.embedding, @v) AS SimilarityScore "
              "FROM c ORDER BY VectorDistance(c.embedding, @v)",
        parameters=[{"name": "@v", "value": query_vector}],
        enable_cross_partition_query=True)
    ```

    The query returns items without a `SimilarityScore` value, and no error is raised.

    You need to fix the issue. What should you do?
  fr: |
    L'assistant Python de Wingtip interroge un conteneur Azure Cosmos DB for NoSQL qui contient 300 000 éléments, avec une stratégie d'incorporation vectorielle (1 536 dimensions) et un index diskANN sur `/embedding`. Le chemin vectoriel est exclu de l'index de plage. Le code est le suivant :

    ```python
    response = openai_client.embeddings.create(input=[question], model="embed-small")
    query_vector = [d.embedding for d in response.data]

    items = container.query_items(
        query="SELECT TOP 5 c.id, VectorDistance(c.embedding, @v) AS SimilarityScore "
              "FROM c ORDER BY VectorDistance(c.embedding, @v)",
        parameters=[{"name": "@v", "value": query_vector}],
        enable_cross_partition_query=True)
    ```

    La requête renvoie des éléments sans valeur `SimilarityScore`, et aucune erreur n'est levée.

    Vous devez corriger le problème. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Assign response.data[0].embedding to query_vector.", fr: "Affecter response.data[0].embedding à query_vector." }
    - id: b
      text: { en: "Remove /embedding/* from the excluded paths of the indexing policy.", fr: "Supprimer /embedding/* des chemins exclus de la stratégie d'indexation." }
    - id: c
      text: { en: "Add c.embedding to the SELECT list of the query.", fr: "Ajouter c.embedding à la liste SELECT de la requête." }
    - id: d
      text: { en: "Pass true as the third argument of both VectorDistance calls.", fr: "Passer true comme troisième argument des deux appels à VectorDistance." }
answer: { optionId: a }
explanation:
  correct:
    en: "The list comprehension builds a list that contains one list, a two-dimensional array. When a multidimensional array is passed to VectorDistance, the function returns no SimilarityScore value and no error. response.data[0].embedding is the one-dimensional list of 1,536 floats that the function expects."
    fr: "La compréhension de liste construit une liste qui contient une liste, soit un tableau à deux dimensions. Lorsqu'un tableau multidimensionnel est passé à VectorDistance, la fonction ne renvoie ni valeur SimilarityScore ni erreur. response.data[0].embedding est la liste à une dimension de 1 536 valeurs float qu'attend la fonction."
  options:
    b: { en: "Excluding the vector path from the range index is the recommended setting; it doesn't affect the score.", fr: "Exclure le chemin vectoriel de l'index de plage est le paramètre recommandé ; cela n'affecte pas le score." }
    c: { en: "Projecting the stored embedding doesn't change the shape of the query vector.", fr: "Projeter l'incorporation stockée ne change pas la forme du vecteur de la requête." }
    d: { en: "Brute force changes how the search runs, but a two-dimensional query vector still produces no score.", fr: "La force brute change l'exécution de la recherche, mais un vecteur de requête à deux dimensions ne produit toujours pas de score." }
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
