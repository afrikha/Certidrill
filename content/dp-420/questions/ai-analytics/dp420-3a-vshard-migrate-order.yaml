id: dp420-3a-vshard-migrate-order
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account on which vector search is not enabled. A container named **articles**, in a database with dedicated throughput, stores 9 million articles from 300 publishers. Each item already has a `publisherId` property and a 1,536-dimension `embedding` property, but the container has no vector embedding policy.

    You need to implement vector search in which each query searches only the articles of one publisher, through a sharded DiskANN index.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL sur lequel la recherche vectorielle n'est pas activée. Un conteneur nommé **articles**, dans une base de données à débit dédié, stocke 9 millions d'articles de 300 éditeurs. Chaque élément possède déjà une propriété `publisherId` et une propriété `embedding` de 1 536 dimensions, mais le conteneur n'a pas de stratégie d'incorporation vectorielle.

    Vous devez implémenter une recherche vectorielle dans laquelle chaque requête ne parcourt que les articles d'un éditeur, au moyen d'un index DiskANN partitionné.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: enable, text: { en: "Enable the Vector Search for NoSQL API feature on the account.", fr: "Activer la fonctionnalité Vector Search for NoSQL API sur le compte." } }
    - { id: create, text: { en: "Create a container with a vector embedding policy on /embedding and a diskANN index whose vectorIndexShardKey is [\"/publisherId\"].", fr: "Créer un conteneur doté d'une stratégie d'incorporation vectorielle sur /embedding et d'un index diskANN dont la vectorIndexShardKey est [\"/publisherId\"]." } }
    - { id: copy, text: { en: "Copy the items, with their embeddings, from articles to the new container.", fr: "Copier les éléments, avec leurs incorporations, d'articles vers le nouveau conteneur." } }
    - { id: query, text: { en: "Point the application to the new container, and filter each vector query on c.publisherId with an equality condition.", fr: "Faire pointer l'application vers le nouveau conteneur, et filtrer chaque requête vectorielle sur c.publisherId avec une condition d'égalité." } }
    - { id: alter, text: { en: "Add a diskANN index with vectorIndexShardKey to the indexing policy of articles.", fr: "Ajouter un index diskANN avec vectorIndexShardKey à la stratégie d'indexation d'articles." } }
    - { id: shared, text: { en: "Move the new container to a database with shared throughput.", fr: "Déplacer le nouveau conteneur vers une base de données à débit partagé." } }
    - { id: ftidx, text: { en: "Add /publisherId to the fullTextIndexes of the new container.", fr: "Ajouter /publisherId aux fullTextIndexes du nouveau conteneur." } }
answer:
  sequence: [ enable, create, copy, query ]
explanation:
  correct:
    en: "The vector search feature must be enabled on the account before a container can have a vector policy. Vector search isn't supported on existing containers, so you create a new container whose diskANN index is sharded on /publisherId, copy the items into it, and then switch the application, whose queries focus on one shard with an equality filter on the shard key."
    fr: "La fonctionnalité de recherche vectorielle doit être activée sur le compte avant qu'un conteneur puisse avoir une stratégie vectorielle. La recherche vectorielle n'étant pas prise en charge sur les conteneurs existants, vous créez un nouveau conteneur dont l'index diskANN est partitionné sur /publisherId, vous y copiez les éléments, puis vous basculez l'application, dont les requêtes se concentrent sur un shard grâce à un filtre d'égalité sur la clé de shard."
  options:
    alter: { en: "Vector search isn't supported on an existing container; the vector policy and index are set when the container is created.", fr: "La recherche vectorielle n'est pas prise en charge sur un conteneur existant ; la stratégie et l'index vectoriels se définissent à la création du conteneur." }
    shared: { en: "Vector indexing and search aren't supported with shared throughput.", fr: "L'indexation et la recherche vectorielles ne sont pas prises en charge avec un débit partagé." }
    ftidx: { en: "A full-text index serves text search; the shard key filter uses an equality condition.", fr: "Un index de texte intégral sert la recherche de texte ; le filtre sur la clé de shard utilise une condition d'égalité." }
references:
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
  - title: Index and Query Vector Data in .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-vector-index-query
