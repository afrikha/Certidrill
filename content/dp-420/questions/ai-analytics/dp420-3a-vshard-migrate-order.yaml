id: dp420-3a-vshard-migrate-order
objective: "3.1.3"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account. A container named **articles**, in a database with dedicated throughput, stores 9 million articles from 300 publishers. Each item already has a `publisherId` property and a 1,536-dimension `embedding` property, but the container has no vector embedding policy.

    You need to implement vector search in which each query searches only the articles of one publisher, through a sharded DiskANN index.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL. Un conteneur nommé **articles**, dans une base de données à débit dédié, stocke 9 millions d'articles de 300 éditeurs. Chaque élément possède déjà une propriété `publisherId` et une propriété `embedding` de 1 536 dimensions, mais le conteneur n'a pas de stratégie d'incorporation vectorielle.

    Vous devez implémenter une recherche vectorielle dans laquelle chaque requête ne parcourt que les articles d'un éditeur, au moyen d'un index DiskANN partitionné.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: enable, text: { en: "Enable the Vector Search for NoSQL API feature on the account.", fr: "Activer la fonctionnalité Vector Search for NoSQL API sur le compte." } }
    - { id: create, text: { en: "Create a container with a vector embedding policy on /embedding and a diskANN index whose vectorIndexShardKey is [\"/publisherId\"].", fr: "Créer un conteneur doté d'une stratégie d'incorporation vectorielle sur /embedding et d'un index diskANN dont la vectorIndexShardKey est [\"/publisherId\"]." } }
    - { id: copy, text: { en: "Copy the items, with their embeddings, from articles to the new container.", fr: "Copier les éléments, avec leurs incorporations, d'articles vers le nouveau conteneur." } }
    - { id: query, text: { en: "Point the application to the new container, and filter each vector query on c.publisherId with an equality condition.", fr: "Faire pointer l'application vers le nouveau conteneur, et filtrer chaque requête vectorielle sur c.publisherId avec une condition d'égalité." } }
    - { id: alter, text: { en: "Add a diskANN index with vectorIndexShardKey to the indexing policy of articles.", fr: "Ajouter un index diskANN avec vectorIndexShardKey à la stratégie d'indexation d'articles." } }
    - { id: shared, text: { en: "Move the new container to a database with shared throughput.", fr: "Déplacer le nouveau conteneur vers une base de données à débit partagé." } }
    - { id: ftidx, text: { en: "Add /publisherId to the fullTextIndexes of the new container.", fr: "Ajouter /publisherId aux fullTextIndexes du nouveau conteneur." } }
answer:
  sequence: [ create, copy, query ]
explanation:
  correct:
    en: "articles has no vector embedding policy, so you create a new container that declares /embedding in its vector embedding policy and has a diskANN index sharded on /publisherId, copy the items into it, and then switch the application, whose queries focus on one shard with an equality filter on the shard key. No account-level step is needed: vector indexing and search are on by default."
    fr: "articles n'a pas de stratégie d'incorporation vectorielle : vous créez donc un nouveau conteneur qui déclare /embedding dans sa stratégie d'incorporation vectorielle et dont l'index diskANN est partitionné sur /publisherId, vous y copiez les éléments, puis vous basculez l'application, dont les requêtes se concentrent sur un shard grâce à un filtre d'égalité sur la clé de shard. Aucune étape au niveau du compte n'est nécessaire : l'indexation et la recherche vectorielles sont activées par défaut."
  options:
    enable: { en: "Vector indexing and search are on by default; you don't need to register a feature or enable an account capability.", fr: "L'indexation et la recherche vectorielles sont activées par défaut ; il n'est pas nécessaire de s'inscrire à une fonctionnalité ni d'activer une fonctionnalité de compte." }
    alter: { en: "A vector index needs its path in the container's vector embedding policy, and articles has none.", fr: "Un index vectoriel exige que son chemin figure dans la stratégie d'incorporation vectorielle du conteneur, et articles n'en a pas." }
    shared: { en: "Vector indexing and search aren't supported with shared throughput.", fr: "L'indexation et la recherche vectorielles ne sont pas prises en charge avec un débit partagé." }
    ftidx: { en: "A full-text index serves text search; the shard key filter uses an equality condition.", fr: "Un index de texte intégral sert la recherche de texte ; le filtre sur la clé de shard utilise une condition d'égalité." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
