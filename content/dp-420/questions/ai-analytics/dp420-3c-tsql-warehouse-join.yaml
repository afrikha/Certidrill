id: dp420-3c-tsql-warehouse-join
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank mirrors an Azure Cosmos DB for NoSQL database named payments into a Fabric workspace. The same workspace contains a warehouse with a `dim_branch` table.

    Analysts use SQL Server Management Studio (SSMS). They must join the mirrored transactions with `dim_branch` by using T-SQL. The queries must not consume request units (RUs) on the Azure Cosmos DB account.

    What should the analysts connect to?
  fr: |
    Woodgrove Bank met en miroir une base de données Azure Cosmos DB for NoSQL nommée payments dans un espace de travail Fabric. Le même espace de travail contient un entrepôt avec une table `dim_branch`.

    Les analystes utilisent SQL Server Management Studio (SSMS). Ils doivent joindre les transactions en miroir avec `dim_branch` en T-SQL. Les requêtes ne doivent pas consommer d'unités de requête (RU) sur le compte Azure Cosmos DB.

    À quoi les analystes doivent-ils se connecter ?
body:
  options:
    - { id: a, text: { en: "The SQL analytics endpoint of the mirrored database", fr: "Le point de terminaison d'analytique SQL de la base de données en miroir" } }
    - { id: b, text: { en: "The Source database view of the mirrored database", fr: "La vue Source database de la base de données en miroir" } }
    - { id: c, text: { en: "The KQL database created by workspace monitoring", fr: "La base de données KQL créée par la surveillance de l'espace de travail" } }
    - { id: d, text: { en: "The Azure Cosmos DB account endpoint, through the Spark connector catalog", fr: "Le point de terminaison du compte Azure Cosmos DB, par le catalogue du connecteur Spark" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Each mirrored database has a read-only SQL analytics endpoint in which every container is a table. It accepts T-SQL from SSMS and other SQL clients, can join with warehouses and lakehouses of the same workspace, and runs on Fabric capacity rather than on the account's RUs."
    fr: "Chaque base de données en miroir dispose d'un point de terminaison d'analytique SQL en lecture seule dans lequel chaque conteneur est une table. Il accepte le T-SQL depuis SSMS et d'autres clients SQL, peut effectuer des jointures avec les entrepôts et lakehouses du même espace de travail, et s'exécute sur la capacité Fabric plutôt que sur les RU du compte."
  options:
    b:
      en: "The Source database view runs NoSQL queries against the live account, which consumes RUs, and it can't join with a warehouse."
      fr: "La vue Source database exécute des requêtes NoSQL sur le compte en direct, ce qui consomme des RU, et elle ne peut pas effectuer de jointure avec un entrepôt."
    c:
      en: "The monitoring KQL database holds the mirroring execution logs, not the mirrored data, and is queried with KQL."
      fr: "La base de données KQL de surveillance contient les journaux d'exécution de la mise en miroir, pas les données en miroir, et elle s'interroge en KQL."
    d:
      en: "The Spark connector reads the operational container, which consumes RUs, and it isn't a T-SQL endpoint for SSMS."
      fr: "Le connecteur Spark lit le conteneur opérationnel, ce qui consomme des RU, et ce n'est pas un point de terminaison T-SQL pour SSMS."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
