id: dp420-3c-fabric-cu-billing
objective: "3.3.1"
type: single
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Adatum compares the cost of a container in Azure Cosmos DB and in Cosmos DB in Microsoft Fabric. In Fabric, the container would be created with a maximum autoscale throughput of 6,000 RU/s.

    During one hour, the container scales from 600 RU/s up to 3,000 RU/s for 10 minutes, and then back down to 600 RU/s.

    How many Fabric capacity units (CUs) does the container consume for that hour?
  fr: |
    Adatum compare le coût d'un conteneur dans Azure Cosmos DB et dans Cosmos DB dans Microsoft Fabric. Dans Fabric, le conteneur serait créé avec un débit autoscale maximal de 6 000 RU/s.

    Pendant une heure, le conteneur passe de 600 RU/s à 3 000 RU/s pendant 10 minutes, puis redescend à 600 RU/s.

    Combien d'unités de capacité (CU) Fabric le conteneur consomme-t-il pour cette heure ?
body:
  options:
    - { id: a, text: { en: "0.402 CU", fr: "0,402 CU" } }
    - { id: b, text: { en: "0.670 CU", fr: "0,670 CU" } }
    - { id: c, text: { en: "2.010 CU", fr: "2,010 CU" } }
    - { id: d, text: { en: "4.020 CU", fr: "4,020 CU" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Cosmos DB in Fabric bills the highest autoscale throughput reached in each hour, at 100 RU/s = 0.067 CU per hour. The peak of the hour is 3,000 RU/s, so the hour costs 30 × 0.067 = 2.01 CUs, regardless of how long the peak lasted."
    fr: "Cosmos DB dans Fabric facture le débit autoscale le plus élevé atteint au cours de chaque heure, à raison de 100 RU/s = 0,067 CU par heure. Le pic de l'heure est de 3 000 RU/s : l'heure coûte donc 30 × 0,067 = 2,01 CU, quelle que soit la durée du pic."
  options:
    a:
      en: "0.402 CU corresponds to 600 RU/s, the 10 percent floor of the maximum; billing uses the highest throughput of the hour, not the lowest."
      fr: "0,402 CU correspond à 600 RU/s, le plancher de 10 % du maximum ; la facturation retient le débit le plus élevé de l'heure, pas le plus bas."
    b:
      en: "0.670 CU corresponds to 1,000 RU/s, roughly a time-weighted average of the hour; autoscale isn't billed on an average."
      fr: "0,670 CU correspond à 1 000 RU/s, soit à peu près une moyenne pondérée de l'heure ; l'autoscale n'est pas facturé sur une moyenne."
    d:
      en: "4.020 CU corresponds to the 6,000 RU/s maximum, which the container didn't reach during that hour."
      fr: "4,020 CU correspond au maximum de 6 000 RU/s, que le conteneur n'a pas atteint pendant cette heure."
references:
  - title: Billing and utilization data for Cosmos DB in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/billing-usage
