id: dp420-3c-fabric-blockers
objective: "3.3.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware is evaluating Cosmos DB in Microsoft Fabric for a new claims application. The architects list the following requirements for the database.

    Which two requirements prevent Proseware from using Cosmos DB in Fabric?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware évalue Cosmos DB dans Microsoft Fabric pour une nouvelle application de gestion des sinistres. Les architectes listent les exigences suivantes pour la base de données.

    Quelles sont les deux exigences qui empêchent Proseware d'utiliser Cosmos DB dans Fabric ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The database must be reachable only through a private endpoint in the company virtual network.", fr: "La base de données ne doit être accessible que par un point de terminaison privé dans le réseau virtuel de l'entreprise." } }
    - { id: b, text: { en: "Queries must combine vector search and full-text search with Reciprocal Rank Fusion (RRF).", fr: "Les requêtes doivent combiner la recherche vectorielle et la recherche en texte intégral avec la fusion de rang réciproque (RRF)." } }
    - { id: c, text: { en: "A JavaScript pre-trigger must validate each claim before it is written.", fr: "Un pré-déclencheur JavaScript doit valider chaque sinistre avant son écriture." } }
    - { id: d, text: { en: "The web app must authenticate with a user-assigned managed identity.", fr: "L'application web doit s'authentifier avec une identité managée affectée par l'utilisateur." } }
    - { id: e, text: { en: "The claims container must scale up to 20,000 RU/s with autoscale.", fr: "Le conteneur des sinistres doit pouvoir monter jusqu'à 20 000 RU/s en autoscale." } }
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: "Cosmos DB in Fabric doesn't currently support Private Link, so the database can't be restricted to a private endpoint. It also doesn't support stored procedures, triggers or user-defined functions, so the validation must move into the application code or the claims must go to Azure Cosmos DB."
    fr: "Cosmos DB dans Fabric ne prend pas en charge Private Link actuellement : la base de données ne peut donc pas être limitée à un point de terminaison privé. Il ne prend pas non plus en charge les procédures stockées, déclencheurs et fonctions définies par l'utilisateur : la validation doit passer dans le code de l'application, ou les sinistres doivent aller dans Azure Cosmos DB."
  options:
    b:
      en: "Cosmos DB in Fabric supports vector search, full-text search and hybrid search with RRF, like Azure Cosmos DB for NoSQL."
      fr: "Cosmos DB dans Fabric prend en charge la recherche vectorielle, la recherche en texte intégral et la recherche hybride avec RRF, comme Azure Cosmos DB for NoSQL."
    d:
      en: "Cosmos DB in Fabric relies on Microsoft Entra ID, and managed identities are among the supported identities."
      fr: "Cosmos DB dans Fabric repose sur Microsoft Entra ID, et les identités managées font partie des identités prises en charge."
    e:
      en: "A container created with an SDK can have a maximum autoscale throughput from 1,000 to 50,000 RU/s, so 20,000 RU/s is within the limit."
      fr: "Un conteneur créé avec un SDK peut avoir un débit autoscale maximal de 1 000 à 50 000 RU/s : 20 000 RU/s est donc dans la limite."
references:
  - title: Limitations in Cosmos DB in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/limitations
  - title: What is Cosmos DB in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/overview
