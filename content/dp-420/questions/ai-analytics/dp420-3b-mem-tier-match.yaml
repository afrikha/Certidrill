id: dp420-3b-mem-tier-match
objective: "3.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Lamna Healthcare is designing the memory of a medication-review agent that stores its data in Azure Cosmos DB for NoSQL.

    You need to classify the data the agent keeps.

    Which type of memory should hold each piece of data? To answer, drag the appropriate memory types to the correct data. Each memory type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Lamna Healthcare conçoit la mémoire d'un agent de revue des traitements qui stocke ses données dans Azure Cosmos DB for NoSQL.

    Vous devez classer les données que l'agent conserve.

    Quel type de mémoire doit contenir chaque donnée ? Pour répondre, faites glisser les types de mémoire appropriés vers les données correspondantes. Chaque type de mémoire peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: short, text: { en: "Short-term (working) memory", fr: "Mémoire à court terme (de travail)" } }
    - { id: episodic, text: { en: "Episodic memory", fr: "Mémoire épisodique" } }
    - { id: semantic, text: { en: "Semantic (long-term) memory", fr: "Mémoire sémantique (à long terme)" } }
  targets:
    - id: t1
      text: { en: "The last eight messages of the consultation in progress", fr: "Les huit derniers messages de la consultation en cours" }
    - id: t2
      text: { en: "The record of the March 15 consultation: summary, decisions and follow-up plan", fr: "L'enregistrement de la consultation du 15 mars : résumé, décisions et plan de suivi" }
    - id: t3
      text: { en: "\"The patient reported dizziness with a previous blood-pressure drug\", recalled by similarity in any later consultation", fr: "« Le patient a signalé des vertiges avec un précédent antihypertenseur », rappelé par similarité lors de toute consultation ultérieure" }
    - id: t4
      text: { en: "The result of a drug-interaction API call that the next step of the current task needs", fr: "Le résultat d'un appel à une API d'interactions médicamenteuses dont l'étape suivante de la tâche en cours a besoin" }
answer:
  mapping: { t1: short, t2: episodic, t3: semantic, t4: short }
explanation:
  correct:
    en: "Short-term (working) memory holds the recent turns and the intermediate task state and tool results of the active session. Episodic memory keeps one record per past interaction, retrieved by exact match or date. Semantic memory holds knowledge extracted across sessions, stored with an embedding and recalled by similarity."
    fr: "La mémoire à court terme (de travail) contient les tours récents ainsi que l'état intermédiaire de la tâche et les résultats d'outils de la session active. La mémoire épisodique conserve un enregistrement par interaction passée, récupéré par correspondance exacte ou par date. La mémoire sémantique contient des connaissances extraites de plusieurs sessions, stockées avec une incorporation et rappelées par similarité."
references:
  - title: Examine Memory Architecture Patterns - Training
    url: https://learn.microsoft.com/en-us/training/modules/aaai-design-multi-agent-memory-azure-cosmos-db/2-examine-memory-architecture-patterns
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
