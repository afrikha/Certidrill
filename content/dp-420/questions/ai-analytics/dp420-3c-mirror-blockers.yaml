id: dp420-3c-mirror-blockers
objective: "3.3.2"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Cosmos DB for NoSQL account named cosmos-wingtip. The account has the following configuration:

    - Backup mode: periodic
    - Multi-region writes: enabled, in East US and West Europe
    - Analytical store: enabled on two containers
    - Vector indexing policies: defined on the catalog container
    - Throughput: autoscale on every container

    You plan to mirror the account's sales database into Microsoft Fabric. The Fabric capacity is in North Europe.

    Which two conditions prevent you from mirroring the database?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un compte Azure Cosmos DB for NoSQL nommé cosmos-wingtip. Le compte présente la configuration suivante :

    - Mode de sauvegarde : périodique
    - Écritures multirégions : activées, dans East US et West Europe
    - Magasin analytique : activé sur deux conteneurs
    - Stratégies d'indexation vectorielle : définies sur le conteneur catalog
    - Débit : autoscale sur chaque conteneur

    Vous prévoyez de mettre en miroir la base de données sales du compte dans Microsoft Fabric. La capacité Fabric se trouve dans la région North Europe.

    Quelles sont les deux conditions qui vous empêchent de mettre en miroir la base de données ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The catalog container has a vector indexing policy.", fr: "Le conteneur catalog a une stratégie d'indexation vectorielle." } }
    - { id: b, text: { en: "The account has multi-region writes enabled.", fr: "Les écritures multirégions sont activées sur le compte." } }
    - { id: c, text: { en: "Analytical store is enabled on two containers.", fr: "Le magasin analytique est activé sur deux conteneurs." } }
    - { id: d, text: { en: "The account uses periodic backup mode.", fr: "Le compte utilise le mode de sauvegarde périodique." } }
    - { id: e, text: { en: "The Fabric capacity is in a different region from the account.", fr: "La capacité Fabric se trouve dans une autre région que le compte." } }
answer: { optionIds: [b, d] }
explanation:
  correct:
    en: "Mirroring requires 7-day or 30-day continuous backup, because the initial snapshot is read from the continuous backup; an account in periodic mode must be migrated first. Mirroring also doesn't support accounts with multiple write regions."
    fr: "La mise en miroir exige la sauvegarde continue de 7 ou 30 jours, car l'instantané initial est lu depuis la sauvegarde continue ; un compte en mode périodique doit d'abord être migré. La mise en miroir ne prend pas non plus en charge les comptes avec plusieurs régions d'écriture."
  options:
    a:
      en: "Accounts that use vector search and vector indexing are supported by mirroring."
      fr: "Les comptes qui utilisent la recherche et l'indexation vectorielles sont pris en charge par la mise en miroir."
    c:
      en: "Mirroring doesn't use the analytical store, and both can be used on the same account independently."
      fr: "La mise en miroir n'utilise pas le magasin analytique, et les deux peuvent être utilisés indépendamment sur le même compte."
    e:
      en: "A capacity in another region works; it only adds egress charges and latency."
      fr: "Une capacité dans une autre région fonctionne ; elle ajoute seulement des frais de sortie de données et de la latence."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
  - title: Frequently asked questions for Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-faq
