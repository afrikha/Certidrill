id: dp420-3a-vec-change-dimensions
objective: "3.1.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL container named **docs** that holds 2 million items. Its vector embedding policy declares `/embedding` with 1,536 dimensions, and its indexing policy has a diskANN index on `/embedding`.

    Adatum is replacing its embedding model with a model that returns 3,072 dimensions. The current vector search must keep working until all the documents have new embeddings.

    You need to enable vector search on the new embeddings.

    What should you do?
  fr: |
    Adatum dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **docs** qui contient 2 millions d'éléments. Sa stratégie d'incorporation vectorielle déclare `/embedding` avec 1 536 dimensions, et sa stratégie d'indexation comporte un index diskANN sur `/embedding`.

    Adatum remplace son modèle d'incorporation par un modèle qui renvoie 3 072 dimensions. La recherche vectorielle actuelle doit continuer de fonctionner jusqu'à ce que tous les documents aient de nouvelles incorporations.

    Vous devez permettre la recherche vectorielle sur les nouvelles incorporations.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Change the dimensions value of the existing vector embedding policy from 1536 to 3072, and re-embed the items in place.", fr: "Modifier la valeur dimensions de la stratégie d'incorporation vectorielle existante de 1536 à 3072, et recalculer les incorporations des éléments sur place." }
    - id: b
      text: { en: "Keep the existing policy, and write the 3,072-value arrays to /embedding as the items are re-embedded.", fr: "Conserver la stratégie existante, et écrire les tableaux de 3 072 valeurs dans /embedding au fur et à mesure du recalcul des incorporations." }
    - id: c
      text: { en: "Create a container whose vector policy and index declare 3,072 dimensions, load the re-embedded items, and then switch the application.", fr: "Créer un conteneur dont la stratégie et l'index vectoriels déclarent 3 072 dimensions, y charger les éléments réincorporés, puis basculer l'application." }
    - id: d
      text: { en: "Change the vector index of /embedding from diskANN to quantizedFlat, which accepts up to 4,096 dimensions.", fr: "Changer l'index vectoriel de /embedding de diskANN à quantizedFlat, qui accepte jusqu'à 4 096 dimensions." }
answer: { optionId: c }
explanation:
  correct:
    en: "Vector policies and vector indexes are immutable after creation; to change them, Learn says to create a new container. Loading the re-embedded items into a new container with a 3,072-dimension policy keeps the current container and its search untouched until the switch."
    fr: "Les stratégies et index vectoriels sont immuables après leur création ; pour les changer, Learn indique de créer un nouveau conteneur. Charger les éléments réincorporés dans un nouveau conteneur doté d'une stratégie à 3 072 dimensions laisse le conteneur actuel et sa recherche intacts jusqu'à la bascule."
  options:
    a: { en: "The settings of an existing vector embedding policy can't be changed directly.", fr: "Les paramètres d'une stratégie d'incorporation vectorielle existante ne peuvent pas être modifiés directement." }
    b: { en: "Every vector on the path must have the number of dimensions declared in the policy; 3,072-value arrays don't match 1,536.", fr: "Chaque vecteur du chemin doit avoir le nombre de dimensions déclaré dans la stratégie ; des tableaux de 3 072 valeurs ne correspondent pas à 1 536." }
    d: { en: "The dimensions come from the embedding policy, and vector indexes are immutable too; changing the index type doesn't change the declared 1,536 dimensions.", fr: "Les dimensions proviennent de la stratégie d'incorporation, et les index vectoriels sont eux aussi immuables ; changer le type d'index ne modifie pas les 1 536 dimensions déclarées." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
