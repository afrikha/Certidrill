id: dp420-sr2-fabric-mirror-3
objective: "3.3.2"
type: series_yesno
series: dp420-sr2-fabric-mirror
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You switch to 7-day continuous backup and connect with a read-only key.
  fr: |
    Vous passez à la sauvegarde continue de 7 jours et vous connectez avec une clé en lecture seule.
body:
  solution:
    en: |
      You switch cosmos-litware to continuous backup with **7-day** retention. Because Fabric only needs to read the data, you create a mirrored Azure Cosmos DB database in the Fabric workspace that connects to `telemetry` by using the account's primary **read-only** key.
    fr: |
      Vous passez cosmos-litware en sauvegarde continue avec une rétention de **7 jours**. Comme Fabric n'a besoin que de lire les données, vous créez une base de données Azure Cosmos DB mise en miroir dans l'espace de travail Fabric, qui se connecte à `telemetry` à l'aide de la clé primaire **en lecture seule** du compte.
answer: { value: false }
explanation:
  correct:
    en: |
      The backup configuration is correct, but mirroring does not support authentication with read-only account keys, so the connection cannot be used. To connect with keys, use a read-write account key; otherwise, use Microsoft Entra ID with a data plane role that grants `readMetadata` and `readAnalytics`.
    fr: |
      La configuration de sauvegarde est correcte, mais la mise en miroir ne prend pas en charge l'authentification avec les clés de compte en lecture seule : la connexion n'est pas utilisable. Pour se connecter avec des clés, utilisez une clé de compte en lecture-écriture ; sinon, utilisez Microsoft Entra ID avec un rôle de plan de données qui accorde `readMetadata` et `readAnalytics`.
references:
  - title: Microsoft Fabric Mirrored Databases From Azure Cosmos DB - Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
