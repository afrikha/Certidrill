id: dp420-3a-fts-french-preview
objective: "3.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware runs an Azure Cosmos DB for NoSQL account on which full-text search is already used for English text. Proseware is creating a container named **catalogfr** that stores French product descriptions in the `/descriptionFr` property.

    You need to enable full-text queries on `/descriptionFr` that apply French tokenization and stemming.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware exploite un compte Azure Cosmos DB for NoSQL sur lequel la recherche en texte intégral est déjà utilisée pour du texte en anglais. Proseware crée un conteneur nommé **catalogfr** qui stocke des descriptions de produits en français dans la propriété `/descriptionFr`.

    Vous devez permettre des requêtes en texte intégral sur `/descriptionFr` qui appliquent la segmentation en jetons et la racinisation du français.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Add \"language\": \"fr-FR\" to the /descriptionFr entry of fullTextIndexes in the indexing policy.", fr: "Ajouter \"language\": \"fr-FR\" à l'entrée /descriptionFr de fullTextIndexes dans la stratégie d'indexation." }
    - id: b
      text: { en: "Enroll the account in the New features for full-text search preview from the Features page.", fr: "Inscrire le compte à la préversion New features for full-text search depuis la page Features." }
    - id: c
      text: { en: "Enable the EnableNoSQLVectorSearch capability on the account.", fr: "Activer la fonctionnalité EnableNoSQLVectorSearch sur le compte." }
    - id: d
      text: { en: "Declare /descriptionFr in the container's full-text policy with the language fr-FR.", fr: "Déclarer /descriptionFr dans la stratégie de texte intégral du conteneur avec la langue fr-FR." }
    - id: e
      text: { en: "Add /descriptionFr/? to the included paths of the indexing policy.", fr: "Ajouter /descriptionFr/? aux chemins inclus de la stratégie d'indexation." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Languages other than English (including fr-FR) are in preview, and you enroll the account in the New features for full-text search feature from the Features section of the account. The language of a text property is set per path in the container's full-text policy (fullTextPaths); the full-text index then references the same path."
    fr: "Les langues autres que l'anglais (dont fr-FR) sont en préversion : vous inscrivez le compte à la fonctionnalité New features for full-text search depuis la section Features du compte. La langue d'une propriété de texte se définit par chemin dans la stratégie de texte intégral du conteneur (fullTextPaths) ; l'index de texte intégral référence ensuite le même chemin."
  options:
    a: { en: "Entries of fullTextIndexes only take a path; the language belongs to the full-text policy.", fr: "Les entrées de fullTextIndexes ne prennent qu'un chemin ; la langue appartient à la stratégie de texte intégral." }
    c: { en: "EnableNoSQLVectorSearch enables vector search, not French full-text processing.", fr: "EnableNoSQLVectorSearch active la recherche vectorielle, pas le traitement du texte intégral en français." }
    e: { en: "A range index on the path supports equality and range filters, not tokenization or stemming.", fr: "Un index de plage sur le chemin prend en charge les filtres d'égalité et de plage, pas la segmentation ni la racinisation." }
references:
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
