id: dp420-3b-sem-cache-hits
objective: "3.2.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso keeps a semantic cache of its agent's answers in an Azure Cosmos DB for NoSQL container named **cache**, partitioned by `/tenantId`. The container has a default time to live of 86,400 seconds, and each cache item has a numeric `hits` property.

    When a lookup returns a cached answer, the Python code must meet the following requirements without reading or replacing the whole item:

    - Add 1 to `hits`.
    - When `hits` reaches 10, the entry must never expire.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conserve un cache sémantique des réponses de son agent dans un conteneur Azure Cosmos DB for NoSQL nommé **cache**, partitionné par `/tenantId`. Le conteneur a une durée de vie par défaut de 86 400 secondes, et chaque élément du cache a une propriété numérique `hits`.

    Quand une recherche renvoie une réponse en cache, le code Python doit répondre aux exigences suivantes sans lire ni remplacer l'élément entier :

    - Ajouter 1 à `hits`.
    - Quand `hits` atteint 10, l'entrée ne doit jamais expirer.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    updated = cache.patch_item(
        item=hit["id"], partition_key=tenant_id,
        patch_operations=[{"op": "[[op]]", "path": "/hits", "value": 1}])

    if updated["hits"] >= 10:
        cache.patch_item(
            item=hit["id"], partition_key=tenant_id,
            patch_operations=[{"op": "set", "path": "/ttl", "value": [[ttl]]}])
  slots:
    - id: op
      options:
        - { id: incr, text: incr }
        - { id: add, text: add }
        - { id: set, text: set }
        - { id: replace, text: replace }
    - id: ttl
      options:
        - { id: minus1, text: "-1" }
        - { id: zero, text: "0" }
        - { id: none, text: None }
        - { id: day, text: "86400" }
answer:
  values: { op: incr, ttl: minus1 }
explanation:
  correct:
    en: "The incr operation adds the given value to a numeric field without reading the item, and patch_item returns the updated item. Setting the item's ttl to -1 overrides the container default, so a popular entry never expires, which is the hit-count technique for keeping frequently used cache entries."
    fr: "L'opération incr ajoute la valeur indiquée à un champ numérique sans lire l'élément, et patch_item renvoie l'élément mis à jour. Définir le ttl de l'élément sur -1 remplace la valeur par défaut du conteneur : une entrée populaire n'expire jamais, ce qui est la technique du compteur de succès pour conserver les entrées de cache fréquemment utilisées."
  options:
    add:
      en: "On an existing property, add replaces the value, so hits would stay at 1."
      fr: "Sur une propriété existante, add remplace la valeur : hits resterait à 1."
    set:
      en: "set writes the value 1 instead of adding 1 to the counter."
      fr: "set écrit la valeur 1 au lieu d'ajouter 1 au compteur."
    replace:
      en: "replace overwrites the counter with 1."
      fr: "replace écrase le compteur avec 1."
    zero:
      en: "An item ttl must be a nonzero positive integer or -1."
      fr: "Le ttl d'un élément doit être un entier positif non nul ou -1."
    none:
      en: "Setting ttl to null on an item is not supported."
      fr: "Définir ttl sur null pour un élément n'est pas pris en charge."
    day:
      en: "86400 keeps the default behavior; the entry would expire one day after its last write."
      fr: "86400 conserve le comportement par défaut ; l'entrée expirerait un jour après sa dernière écriture."
references:
  - title: Semantic Cache for Large Language Models - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/semantic-cache
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
