id: dp420-3a-vpart-tenant-hotarea
objective: "3.1.3"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam runs a multitenant document search service. Most tenants share one Azure Cosmos DB for NoSQL container whose partition key is `/tenantId`, and each vector query searches one tenant. The account is configured for vector search on hierarchical partition keys. Fabrikam reviews four tenants, shown in the following table.

    Answer each prompt by selecting the appropriate tenant.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam exploite un service multilocataire de recherche de documents. La plupart des locataires partagent un conteneur Azure Cosmos DB for NoSQL dont la clé de partition est `/tenantId`, et chaque requête vectorielle porte sur un locataire. Le compte est configuré pour la recherche vectorielle sur des clés de partition hiérarchiques. Fabrikam examine quatre locataires, présentés dans le tableau suivant.

    Répondez à chaque consigne en sélectionnant le locataire approprié.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Which tenant should you move to a dedicated Azure Cosmos DB account?", fr: "Quel locataire devez-vous déplacer vers un compte Azure Cosmos DB dédié ?" }
    - id: p2
      text: { en: "Which tenant requires a hierarchical partition key to stay in the shared container?", fr: "Quel locataire exige une clé de partition hiérarchique pour rester dans le conteneur partagé ?" }
  grid:
    header: [{ en: Tenant, fr: Locataire }, { en: "Data size", fr: "Taille des données" }, { en: Requirement, fr: Exigence }]
    rows:
      - [{ text: Contoso Pharma, area: contoso }, { text: { en: "3 GB", fr: "3 Go" } }, { text: { en: "Physical isolation of its data, encrypted with its own customer-managed key", fr: "Isolation physique de ses données, chiffrées avec sa propre clé gérée par le client" } }]
      - [{ text: Litware, area: litware }, { text: { en: "45 GB", fr: "45 Go" } }, { text: { en: "Shared service level", fr: "Niveau de service partagé" } }]
      - [{ text: Northwind, area: northwind }, { text: { en: "1 GB", fr: "1 Go" } }, { text: { en: "Shared service level", fr: "Niveau de service partagé" } }]
      - [{ text: Adatum, area: adatum }, { text: { en: "0.5 GB", fr: "0,5 Go" } }, { text: { en: "Shared service level", fr: "Niveau de service partagé" } }]
answer:
  values: { p1: contoso, p2: litware }
explanation:
  correct:
    en: "An account per tenant is the model that gives physical data isolation and lets each tenant's data be encrypted with its own customer-managed key, which is set at the account level. A tenant that stores more than 20 GB needs a hierarchical partition key, with the tenant as the first level and a high-cardinality ID below it, to scale in a shared container."
    fr: "Un compte par locataire est le modèle qui offre l'isolation physique des données et permet de chiffrer les données de chaque locataire avec sa propre clé gérée par le client, définie au niveau du compte. Un locataire qui stocke plus de 20 Go a besoin d'une clé de partition hiérarchique, avec le locataire au premier niveau et un ID à forte cardinalité en dessous, pour évoluer dans un conteneur partagé."
  options:
    northwind: { en: "1 GB with shared requirements fits a partition key per tenant.", fr: "1 Go avec des exigences partagées convient à une clé de partition par locataire." }
    adatum: { en: "0.5 GB with shared requirements fits a partition key per tenant.", fr: "0,5 Go avec des exigences partagées convient à une clé de partition par locataire." }
references:
  - title: Multitenancy - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/multi-tenancy-vector-search
