id: dp420-3c-legacy-key-client
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a new product catalog service that stores JSON documents in a NoSQL database. The data team already works in a Microsoft Fabric workspace on an F64 capacity.

    A third-party pricing tool must also read the catalog. The tool can authenticate only with an account key in a connection string, and the vendor won't change it.

    You need to choose where to create the database. The solution must support the pricing tool without additional components.

    What should you use?
  fr: |
    Contoso crée un nouveau service de catalogue de produits qui stocke des documents JSON dans une base de données NoSQL. L'équipe de données travaille déjà dans un espace de travail Microsoft Fabric sur une capacité F64.

    Un outil de tarification tiers doit aussi lire le catalogue. Cet outil ne peut s'authentifier qu'avec une clé de compte dans une chaîne de connexion, et l'éditeur ne le modifiera pas.

    Vous devez choisir où créer la base de données. La solution doit prendre en charge l'outil de tarification sans composant supplémentaire.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A Cosmos DB database in the Fabric workspace, with the primary key shared with the vendor", fr: "Une base de données Cosmos DB dans l'espace de travail Fabric, dont la clé primaire est communiquée à l'éditeur" } }
    - { id: b, text: { en: "An Azure Cosmos DB for NoSQL account, with the read-only key shared with the vendor", fr: "Un compte Azure Cosmos DB for NoSQL, dont la clé en lecture seule est communiquée à l'éditeur" } }
    - { id: c, text: { en: "A Cosmos DB database in the Fabric workspace, with a Fabric connection that stores the key", fr: "Une base de données Cosmos DB dans l'espace de travail Fabric, avec une connexion Fabric qui stocke la clé" } }
    - { id: d, text: { en: "A SQL database in Fabric, with SQL authentication enabled for the vendor", fr: "Une base de données SQL dans Fabric, avec l'authentification SQL activée pour l'éditeur" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Cosmos DB in Microsoft Fabric supports only Microsoft Entra ID authentication: it has no primary or secondary keys and no key-based connection strings. An Azure Cosmos DB for NoSQL account still offers account keys, including read-only keys, so the tool can connect unchanged. The data team can mirror the account into Fabric later if it needs analytics."
    fr: "Cosmos DB dans Microsoft Fabric ne prend en charge que l'authentification Microsoft Entra ID : il n'a ni clé primaire ni clé secondaire, ni chaîne de connexion à base de clé. Un compte Azure Cosmos DB for NoSQL propose toujours des clés de compte, y compris des clés en lecture seule : l'outil peut donc se connecter sans modification. L'équipe de données pourra mettre le compte en miroir dans Fabric plus tard si elle a besoin d'analytique."
  options:
    a:
      en: "A Cosmos DB database in Fabric has no primary key to share; applications must use a Microsoft Entra identity."
      fr: "Une base de données Cosmos DB dans Fabric n'a pas de clé primaire à communiquer ; les applications doivent utiliser une identité Microsoft Entra."
    c:
      en: "A Fabric connection doesn't give the database a key; Cosmos DB in Fabric still accepts only Microsoft Entra tokens, which the tool can't obtain."
      fr: "Une connexion Fabric ne donne pas de clé à la base de données ; Cosmos DB dans Fabric n'accepte toujours que des jetons Microsoft Entra, que l'outil ne sait pas obtenir."
    d:
      en: "A SQL database in Fabric is a relational database, not a NoSQL document database, and it doesn't offer account keys either."
      fr: "Une base de données SQL dans Fabric est une base relationnelle, pas une base NoSQL de documents, et elle ne propose pas non plus de clés de compte."
references:
  - title: Frequently asked questions for Cosmos DB in Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq
  - title: Authenticate to Cosmos DB in Microsoft Fabric from Azure host services
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/how-to-authenticate
