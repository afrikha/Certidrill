id: dp420-3b-mem-ttl-retention
objective: "3.2.1"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys stores the memory of its travel agent in one Azure Cosmos DB for NoSQL container. Items of type `turn` hold short-term memory, and items of type `fact` hold long-term memory. The retention requirements are:

    - A turn must be deleted automatically seven days (604,800 seconds) after it was last written.
    - A fact must never expire.

    Which two configurations meet the requirements? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke la mémoire de son agent de voyage dans un seul conteneur Azure Cosmos DB for NoSQL. Les éléments de type `turn` contiennent la mémoire à court terme, et les éléments de type `fact` la mémoire à long terme. Les exigences de rétention sont les suivantes :

    - Un tour doit être supprimé automatiquement sept jours (604 800 secondes) après sa dernière écriture.
    - Un fait ne doit jamais expirer.

    Quelles sont les deux configurations qui répondent aux exigences ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Container default TTL not set; ttl = 604800 on each turn; no ttl on facts.", fr: "TTL par défaut du conteneur non définie ; ttl = 604800 sur chaque tour ; aucun ttl sur les faits." } }
    - { id: b, text: { en: "Container default TTL = 604800; no ttl on turns; ttl = -1 on each fact.", fr: "TTL par défaut du conteneur = 604800 ; aucun ttl sur les tours ; ttl = -1 sur chaque fait." } }
    - { id: c, text: { en: "Container default TTL = 604800; no ttl on turns; ttl = 0 on each fact.", fr: "TTL par défaut du conteneur = 604800 ; aucun ttl sur les tours ; ttl = 0 sur chaque fait." } }
    - { id: d, text: { en: "Container default TTL = -1; ttl = 604800 on each turn; no ttl on facts.", fr: "TTL par défaut du conteneur = -1 ; ttl = 604800 sur chaque tour ; aucun ttl sur les faits." } }
    - { id: e, text: { en: "Container default TTL = -1; no ttl on turns; ttl = -1 on each fact.", fr: "TTL par défaut du conteneur = -1 ; aucun ttl sur les tours ; ttl = -1 sur chaque fait." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "An item ttl applies only when the container default TTL is set, and it overrides that default. With a default of 604800, turns inherit seven days and ttl = -1 keeps facts forever. With a default of -1, TTL is enabled but nothing expires by default, so turns that set ttl = 604800 expire after seven days and facts without ttl never expire. In both cases, expiry counts from the item's last modification."
    fr: "Un ttl d'élément ne s'applique que si la TTL par défaut du conteneur est définie, et il remplace cette valeur par défaut. Avec une valeur par défaut de 604800, les tours héritent de sept jours et ttl = -1 conserve les faits indéfiniment. Avec une valeur par défaut de -1, la TTL est activée mais rien n'expire par défaut : les tours qui définissent ttl = 604800 expirent au bout de sept jours, et les faits sans ttl n'expirent jamais. Dans les deux cas, l'expiration se compte à partir de la dernière modification de l'élément."
  options:
    a:
      en: "When the container default TTL is not set, item ttl values have no effect, so turns never expire."
      fr: "Quand la TTL par défaut du conteneur n'est pas définie, les valeurs ttl des éléments n'ont aucun effet, si bien que les tours n'expirent jamais."
    c:
      en: "An item ttl must be a nonzero positive integer or -1; 0 is not a valid value."
      fr: "Le ttl d'un élément doit être un entier positif non nul ou -1 ; 0 n'est pas une valeur valide."
    e:
      en: "With a default of -1 and no ttl on the turns, the turns never expire."
      fr: "Avec une valeur par défaut de -1 et aucun ttl sur les tours, les tours n'expirent jamais."
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
