id: dp420-3c-mirror-key-rotation
objective: "3.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam mirrors an Azure Cosmos DB for NoSQL database into Microsoft Fabric. The mirroring connection uses the Account key authentication kind with the primary key.

    Following a security audit, an administrator regenerates the primary key of the account. The mirrored database now shows the Failed status.

    You need to restore replication. What should you do?
  fr: |
    Fabrikam met en miroir une base de données Azure Cosmos DB for NoSQL dans Microsoft Fabric. La connexion de mise en miroir utilise le type d'authentification Account key avec la clé primaire.

    À la suite d'un audit de sécurité, un administrateur régénère la clé primaire du compte. La base de données en miroir affiche maintenant l'état Failed.

    Vous devez rétablir la réplication. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Stop replication, update the connection with the new key, and then start replication.", fr: "Arrêter la réplication, mettre à jour la connexion avec la nouvelle clé, puis démarrer la réplication." } }
    - { id: b, text: { en: "Update the connection with the new key, and wait for replication to resume on its own.", fr: "Mettre à jour la connexion avec la nouvelle clé, puis attendre que la réplication reprenne d'elle-même." } }
    - { id: c, text: { en: "Update the connection with the primary read-only key, which isn't affected by the regeneration.", fr: "Mettre à jour la connexion avec la clé primaire en lecture seule, qui n'est pas affectée par la régénération." } }
    - { id: d, text: { en: "Delete the mirrored database, and then create a new mirrored database for the account.", fr: "Supprimer la base de données en miroir, puis créer une nouvelle base de données en miroir pour le compte." } }
answer: { optionId: a }
explanation:
  correct:
    en: "When the account keys are rotated, mirroring fails until the connection credentials are updated. The documented recovery is to stop replication, update the credentials with the new key, and restart replication."
    fr: "Quand les clés du compte sont renouvelées, la mise en miroir échoue tant que les informations d'identification de la connexion ne sont pas mises à jour. La procédure de rétablissement documentée consiste à arrêter la réplication, mettre à jour les informations d'identification avec la nouvelle clé, puis redémarrer la réplication."
  options:
    b:
      en: "Failed is a fatal status that requires intervention; replication must be restarted after the credentials are updated."
      fr: "Failed est un état fatal qui exige une intervention ; la réplication doit être redémarrée après la mise à jour des informations d'identification."
    c:
      en: "Read-only account keys aren't supported by mirroring."
      fr: "Les clés de compte en lecture seule ne sont pas prises en charge par la mise en miroir."
    d:
      en: "Recreating the item isn't necessary and would break the shortcuts, views and reports built on the existing mirrored database."
      fr: "Recréer l'élément n'est pas nécessaire et casserait les raccourcis, vues et rapports créés sur la base de données en miroir existante."
references:
  - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
