id: dp420-3a-vsearch-yn
objective: "3.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin implements vector search on an Azure Cosmos DB for NoSQL container. The vector embedding policy declares `/embedding` with 1,536 dimensions and the `cosine` distance function, and the indexing policy has a diskANN index on the path.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin implémente la recherche vectorielle sur un conteneur Azure Cosmos DB for NoSQL. La stratégie d'incorporation vectorielle déclare `/embedding` avec 1 536 dimensions et la fonction de distance `cosine`, et la stratégie d'indexation comporte un index diskANN sur ce chemin.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "The vector of the user's question must be generated with the same embedding model as the vectors stored in `/embedding`."
        fr: "Le vecteur de la question de l'utilisateur doit être généré avec le même modèle d'incorporation que les vecteurs stockés dans `/embedding`."
    - id: s2
      text:
        en: "The options object of VectorDistance can override the distance function declared in the vector embedding policy for one query."
        fr: "L'objet d'options de VectorDistance peut remplacer, pour une requête, la fonction de distance déclarée dans la stratégie d'incorporation vectorielle."
    - id: s3
      text:
        en: "VectorDistance can be used in the ORDER BY clause, but not in the SELECT list."
        fr: "VectorDistance peut être utilisé dans la clause ORDER BY, mais pas dans la liste SELECT."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Similarity scores compare positions in one embedding space, so the query vector must come from the model that produced the stored vectors, with the same dimensions. The obj_expr argument of VectorDistance accepts a distanceFunction property that overrides the policy's function. VectorDistance can be projected in SELECT (for example AS SimilarityScore) and used in ORDER BY."
    fr: "Les scores de similarité comparent des positions dans un même espace d'incorporation : le vecteur de la requête doit provenir du modèle qui a produit les vecteurs stockés, avec les mêmes dimensions. L'argument obj_expr de VectorDistance accepte une propriété distanceFunction qui remplace la fonction de la stratégie. VectorDistance peut être projeté dans SELECT (par exemple AS SimilarityScore) et utilisé dans ORDER BY."
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
