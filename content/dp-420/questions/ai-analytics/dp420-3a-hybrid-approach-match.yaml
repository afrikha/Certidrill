id: dp420-3a-hybrid-approach-match
objective: "3.1.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind is designing the search features of its support portal on Azure Cosmos DB for NoSQL. The articles container has a vector index on `/embedding` and a full-text index on `/body`.

    You need to choose the retrieval approach for each requirement.

    Which approach should you use for each requirement? To answer, drag the appropriate approaches to the correct requirements. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind conçoit les fonctionnalités de recherche de son portail de support sur Azure Cosmos DB for NoSQL. Le conteneur articles possède un index vectoriel sur `/embedding` et un index de texte intégral sur `/body`.

    Vous devez choisir l'approche de récupération pour chaque exigence.

    Quelle approche devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les approches appropriées vers les exigences correspondantes. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: fulltext, text: { en: "Full-text search with FullTextContains", fr: "Recherche en texte intégral avec FullTextContains" } }
    - { id: vector, text: { en: "Vector search with VectorDistance", fr: "Recherche vectorielle avec VectorDistance" } }
    - { id: hybrid, text: { en: "Hybrid search with RRF", fr: "Recherche hybride avec RRF" } }
    - { id: fuzzy, text: { en: "Fuzzy full-text search with a term distance", fr: "Recherche en texte intégral approximative avec une distance de terme" } }
    - { id: geo, text: { en: "Spatial search with ST_DISTANCE", fr: "Recherche spatiale avec ST_DISTANCE" } }
  targets:
    - id: t1
      text: { en: "Find the articles that contain the product name \"Contoso Vista\" as a phrase.", fr: "Trouver les articles qui contiennent le nom de produit « Contoso Vista » sous forme d'expression." }
    - id: t2
      text: { en: "Match questions such as \"my screen goes black\" to articles that describe display failures in other words.", fr: "Faire correspondre des questions comme « my screen goes black » à des articles qui décrivent des pannes d'affichage avec d'autres mots." }
    - id: t3
      text: { en: "Return one ranked list for a search box where users type part numbers or natural-language descriptions.", fr: "Renvoyer une seule liste classée pour une zone de recherche où les utilisateurs saisissent des références ou des descriptions en langage naturel." }
    - id: t4
      text: { en: "Find product names even when users mistype one or two letters.", fr: "Trouver des noms de produits même lorsque les utilisateurs se trompent d'une ou deux lettres." }
answer:
  mapping: { t1: fulltext, t2: vector, t3: hybrid, t4: fuzzy }
explanation:
  correct:
    en: "Full-text search matches the exact words and phrases of a property. Vector search compares meanings, so it finds paraphrases. Hybrid search fuses a BM25 ranking and a vector ranking with RRF, which suits queries that mix exact identifiers and natural language. Fuzzy search, a term object with a distance of up to 2 edits, tolerates typos."
    fr: "La recherche en texte intégral trouve les mots et expressions exacts d'une propriété. La recherche vectorielle compare des significations : elle trouve les paraphrases. La recherche hybride fusionne un classement BM25 et un classement vectoriel avec RRF, ce qui convient aux requêtes mêlant identifiants exacts et langage naturel. La recherche approximative, un objet de terme avec une distance de 2 modifications au plus, tolère les fautes de frappe."
  options:
    geo: { en: "ST_DISTANCE computes distances between geospatial points, not between texts or embeddings.", fr: "ST_DISTANCE calcule des distances entre des points géospatiaux, pas entre des textes ou des incorporations." }
references:
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
  - title: Full Text Indexing and Search - Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/full-text-indexing
