id: dp420-3a-vshard-benefits
objective: "3.1.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip hosts the support documents of 1,200 customers in one Azure Cosmos DB for NoSQL container with dedicated throughput. Wingtip recreates the container with a diskANN index on `/embedding` that has `"vectorIndexShardKey": ["/customerId"]`, and every vector query filters on `c.customerId = @customerId`.

    Which two outcomes does this design provide compared with a non-sharded diskANN index?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip héberge les documents de support de 1 200 clients dans un conteneur Azure Cosmos DB for NoSQL doté d'un débit dédié. Wingtip recrée le conteneur avec un index diskANN sur `/embedding` doté de `"vectorIndexShardKey": ["/customerId"]`, et chaque requête vectorielle filtre sur `c.customerId = @customerId`.

    Quels sont les deux résultats qu'offre cette conception par rapport à un index diskANN non partitionné ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Each customer's documents are placed on a dedicated physical partition with its own throughput.", fr: "Les documents de chaque client sont placés sur une partition physique dédiée avec son propre débit." }
    - id: b
      text: { en: "Each query searches a smaller index, which can lower its RU charge.", fr: "Chaque requête parcourt un index plus petit, ce qui peut réduire son coût en RU." }
    - id: c
      text: { en: "Each customer's documents can be encrypted with a different customer-managed key.", fr: "Les documents de chaque client peuvent être chiffrés avec une clé gérée par le client différente." }
    - id: d
      text: { en: "Each query searches only the customer's vectors, which can improve recall.", fr: "Chaque requête ne parcourt que les vecteurs du client, ce qui peut améliorer le rappel." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "With vectorIndexShardKey, the container gets one DiskANN index per value of customerId. A query filtered on the shard key searches a smaller index, which can reduce latency and RU charges, and the focused search over one customer's vectors can give higher recall."
    fr: "Avec vectorIndexShardKey, le conteneur obtient un index DiskANN par valeur de customerId. Une requête filtrée sur la clé de shard parcourt un index plus petit, ce qui peut réduire la latence et le coût en RU, et la recherche ciblée sur les vecteurs d'un client peut offrir un meilleur rappel."
  options:
    a: { en: "The shard key splits the vector index; it doesn't change how items are placed on physical partitions or how throughput is shared.", fr: "La clé de shard découpe l'index vectoriel ; elle ne change ni le placement des éléments sur les partitions physiques ni le partage du débit." }
    c: { en: "Customer-managed keys are set on the account; per-tenant keys require an account per tenant.", fr: "Les clés gérées par le client se définissent sur le compte ; des clés par locataire exigent un compte par locataire." }
references:
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
  - title: Multitenancy - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/multi-tenancy-vector-search
