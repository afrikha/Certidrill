id: dp420-3b-mem-toolkit-storage
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware is moving a Python agent from prototype to production. The prototype keeps the turns of each conversation in a list in the memory of its process. In production, the agent runs on six instances behind a load balancer, any instance can serve the next request of a thread, and conversations must survive restarts. Threads can reach several hundred turns, and the agent loads the latest turns of one thread before each model call.

    You will store the conversation memory in an Azure Cosmos DB for NoSQL container.

    Which two design choices should you make? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware fait passer un agent Python du prototype à la production. Le prototype conserve les tours de chaque conversation dans une liste en mémoire de son processus. En production, l'agent s'exécute sur six instances derrière un équilibreur de charge, n'importe quelle instance peut traiter la requête suivante d'un thread, et les conversations doivent survivre aux redémarrages. Les threads peuvent atteindre plusieurs centaines de tours, et l'agent charge les derniers tours d'un thread avant chaque appel au modèle.

    Vous allez stocker la mémoire de conversation dans un conteneur Azure Cosmos DB for NoSQL.

    Quels sont les deux choix de conception à faire ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Store each turn as its own item.", fr: "Stocker chaque tour dans son propre élément." } }
    - { id: b, text: { en: "Store each thread as one item and append each turn to its messages array.", fr: "Stocker chaque thread dans un seul élément et ajouter chaque tour à son tableau messages." } }
    - { id: c, text: { en: "Partition the container by a new GUID for each item.", fr: "Partitionner le conteneur par un nouveau GUID pour chaque élément." } }
    - { id: d, text: { en: "Partition the container by /threadId.", fr: "Partitionner le conteneur par /threadId." } }
    - { id: e, text: { en: "Keep the turns in each instance's memory and enable session affinity on the load balancer.", fr: "Conserver les tours dans la mémoire de chaque instance et activer l'affinité de session sur l'équilibreur de charge." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "One item per turn is the recommended model for chat histories: items stay small, writes stay cheap, and the agent reads the latest turns with a TOP N query. Partitioning by /threadId keeps all the turns of a thread in one logical partition, so that loading the context is a single-partition query that any instance can run, and the data survives restarts."
    fr: "Un élément par tour est le modèle recommandé pour les historiques de conversation : les éléments restent petits, les écritures peu coûteuses, et l'agent lit les derniers tours avec une requête TOP N. Le partitionnement par /threadId place tous les tours d'un thread dans une même partition logique : le chargement du contexte est une requête sur une seule partition que n'importe quelle instance peut exécuter, et les données survivent aux redémarrages."
  options:
    b:
      en: "A thread item grows without bound, and each append rewrites the whole item, so long threads have high RU charges for every write; this model isn't recommended."
      fr: "Un élément de thread grossit sans limite, et chaque ajout réécrit tout l'élément : les longs threads ont des frais de RU élevés à chaque écriture ; ce modèle n'est pas recommandé."
    c:
      en: "A GUID per item spreads the turns of a thread over all partitions, so every context load becomes a cross-partition query."
      fr: "Un GUID par élément répartit les tours d'un thread sur toutes les partitions : chaque chargement du contexte devient une requête entre partitions."
    e:
      en: "Process memory is lost when an instance restarts, and it isn't shared with the other instances."
      fr: "La mémoire du processus est perdue au redémarrage d'une instance et n'est pas partagée avec les autres instances."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
