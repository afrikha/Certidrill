id: dp420-3b-mem-toolkit-storage
objective: "3.2.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Proseware is prototyping a Python agent with the Agent Memory Toolkit for Azure Cosmos DB. The developers currently add memories to the toolkit's local in-memory storage.

    Which two capabilities require the memories to be stored in Azure Cosmos DB instead of local in-memory storage?

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware prototype un agent Python avec l'Agent Memory Toolkit pour Azure Cosmos DB. Les développeurs ajoutent actuellement les mémoires dans le stockage local en mémoire du toolkit.

    Quelles sont les deux fonctionnalités qui exigent que les mémoires soient stockées dans Azure Cosmos DB plutôt que dans le stockage local en mémoire ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Adding user and agent turns during a unit test", fr: "Ajouter des tours de l'utilisateur et de l'agent pendant un test unitaire" } }
    - { id: b, text: { en: "Semantic and hybrid search over extracted facts", fr: "La recherche sémantique et hybride sur les faits extraits" } }
    - { id: c, text: { en: "Recording turns in a single-process demo", fr: "L'enregistrement des tours dans une démonstration à processus unique" } }
    - { id: d, text: { en: "A background pipeline in Azure Durable Functions triggered when new turns are written", fr: "Un pipeline en arrière-plan dans Azure Durable Functions déclenché à l'écriture de nouveaux tours" } }
    - { id: e, text: { en: "Building turn items in Python before they are uploaded", fr: "La construction des éléments de tour en Python avant leur chargement" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "Local in-memory storage is meant for development and quick tests. Persistence, shared access, semantic search with embeddings and the background processing pipeline need Azure Cosmos DB, whose change feed triggers the Durable Functions that generate summaries, facts and user summaries."
    fr: "Le stockage local en mémoire est destiné au développement et aux tests rapides. La persistance, l'accès partagé, la recherche sémantique avec des incorporations et le pipeline de traitement en arrière-plan exigent Azure Cosmos DB, dont le flux de modification déclenche les Durable Functions qui génèrent les résumés, les faits et les résumés d'utilisateur."
  options:
    a:
      en: "Unit tests are a typical use of local in-memory storage."
      fr: "Les tests unitaires sont une utilisation typique du stockage local en mémoire."
    c:
      en: "A single-process demo does not need persistence or shared access, so local storage is enough."
      fr: "Une démonstration à processus unique n'a besoin ni de persistance ni d'accès partagé ; le stockage local suffit."
    e:
      en: "Memories can be collected locally and uploaded to Azure Cosmos DB later; building them does not require the database."
      fr: "Les mémoires peuvent être collectées localement puis chargées dans Azure Cosmos DB plus tard ; les construire n'exige pas la base de données."
references:
  - title: Agent Memory Toolkit (Preview) - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-memory-toolkit
