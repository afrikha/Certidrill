id: dp420-3a-fts-behaviors-yn
objective: "3.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove stores customer reviews in an Azure Cosmos DB for NoSQL container named **reviews**. The full-text policy of the container declares `/text` with the language en-US and `/textDe` with the language de-DE (the account is enrolled in the multi-language preview). The indexing policy has a full-text index on both paths. The `/title` property is not in the full-text policy.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove stocke des avis clients dans un conteneur Azure Cosmos DB for NoSQL nommé **reviews**. La stratégie de texte intégral du conteneur déclare `/text` avec la langue en-US et `/textDe` avec la langue de-DE (le compte est inscrit à la préversion multilingue). La stratégie d'indexation comporte un index de texte intégral sur les deux chemins. La propriété `/title` ne figure pas dans la stratégie de texte intégral.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "German stop words such as \"und\" and \"der\" are removed from `/textDe` when it is indexed."
        fr: "Les mots vides allemands comme « und » et « der » sont supprimés de `/textDe` lors de son indexation."
    - id: s2
      text:
        en: "A query that calls `FullTextContains(c.title, \"battery\")` runs, but without a full-text index, so it can consume more RUs."
        fr: "Une requête qui appelle `FullTextContains(c.title, \"battery\")` s'exécute, mais sans index de texte intégral : elle peut consommer plus de RU."
    - id: s3
      text:
        en: "`FullTextContainsAll(c.text, \"battery\", \"life\")` returns reviews that contain both words even when the words are not next to each other."
        fr: "`FullTextContainsAll(c.text, \"battery\", \"life\")` renvoie les avis qui contiennent les deux mots même lorsqu'ils ne sont pas côte à côte."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Stop-word removal is available only for English (en-US); the preview languages get tokenization and stemming without it. Full-text functions also run on paths without a full-text policy and index, but they don't use the index, which raises the RU charge and the latency. FullTextContainsAll requires every term to be present, not necessarily together."
    fr: "La suppression des mots vides n'est disponible que pour l'anglais (en-US) ; les langues en préversion bénéficient de la segmentation et de la racinisation sans elle. Les fonctions de texte intégral s'exécutent aussi sur des chemins sans stratégie ni index de texte intégral, mais sans utiliser l'index, ce qui augmente le coût en RU et la latence. FullTextContainsAll exige la présence de chaque terme, pas forcément ensemble."
references:
  - title: Full Text Indexing and Search - Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/full-text-indexing
