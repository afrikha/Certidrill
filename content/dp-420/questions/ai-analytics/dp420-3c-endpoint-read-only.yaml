id: dp420-3c-endpoint-read-only
objective: "3.3.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso mirrors an orders container into Microsoft Fabric. An analyst finds 40 orders whose `status` property is wrong. The analyst runs an `UPDATE` statement on the `orders` table in the SQL analytics endpoint of the mirrored database, and the statement fails.

    You need to correct the 40 orders so that both the application and the mirrored table show the right status.

    What should you do?
  fr: |
    Contoso met en miroir un conteneur orders dans Microsoft Fabric. Un analyste trouve 40 commandes dont la propriété `status` est erronée. L'analyste exécute une instruction `UPDATE` sur la table `orders` dans le point de terminaison d'analytique SQL de la base de données en miroir, et l'instruction échoue.

    Vous devez corriger les 40 commandes pour que l'application et la table en miroir affichent le bon statut.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Grant the analyst the Contributor role in the workspace, and then run the UPDATE statement again.", fr: "Attribuer à l'analyste le rôle Contributor dans l'espace de travail, puis exécuter à nouveau l'instruction UPDATE." } }
    - { id: b, text: { en: "Edit the 40 items in the Source database view of the mirrored database.", fr: "Modifier les 40 éléments dans la vue Source database de la base de données en miroir." } }
    - { id: c, text: { en: "Update the 40 items in the Azure Cosmos DB container by using the SDK or the Spark connector.", fr: "Mettre à jour les 40 éléments dans le conteneur Azure Cosmos DB avec le SDK ou le connecteur Spark." } }
    - { id: d, text: { en: "Create a view in the SQL analytics endpoint that overrides the status of the 40 orders.", fr: "Créer une vue dans le point de terminaison d'analytique SQL qui remplace le statut des 40 commandes." } }
answer: { optionId: c }
explanation:
  correct:
    en: "The SQL analytics endpoint of a mirrored database is read-only: you can define and query objects but not modify data. Fixing the source container with the SDK or the Spark connector corrects the data that the application reads, and mirroring then replicates the updates to the table in near real time."
    fr: "Le point de terminaison d'analytique SQL d'une base de données en miroir est en lecture seule : vous pouvez définir et interroger des objets, mais pas modifier les données. Corriger le conteneur source avec le SDK ou le connecteur Spark rectifie les données lues par l'application, puis la mise en miroir réplique les mises à jour dans la table en temps quasi réel."
  options:
    a:
      en: "The failure isn't a permission issue: mirrored tables can't be modified with T-SQL by any role."
      fr: "L'échec n'est pas un problème d'autorisation : aucun rôle ne peut modifier les tables en miroir en T-SQL."
    b:
      en: "The Source database view is read-only; it can't insert, modify or delete items."
      fr: "La vue Source database est en lecture seule ; elle ne permet ni d'insérer, ni de modifier, ni de supprimer des éléments."
    d:
      en: "A view only masks the problem in Fabric reports; the application would still read the wrong status from the container."
      fr: "Une vue ne fait que masquer le problème dans les rapports Fabric ; l'application lirait toujours le statut erroné dans le conteneur."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
  - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
