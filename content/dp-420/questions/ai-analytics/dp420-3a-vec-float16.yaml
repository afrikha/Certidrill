id: dp420-3a-vec-float16
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip stores 1,536-dimension embeddings in an Azure Cosmos DB for NoSQL container. The vector embedding policy declares the `/embedding` path with the `float32` data type and the `cosine` distance function.

    Wingtip is creating a new container for the same data. You need to reduce the storage used by the vectors by about half. The embedding model and the number of dimensions must not change, and a small loss of accuracy is acceptable.

    Which setting should you use in the vector embedding policy of the new container?
  fr: |
    Wingtip stocke des incorporations de 1 536 dimensions dans un conteneur Azure Cosmos DB for NoSQL. La stratégie d'incorporation vectorielle déclare le chemin `/embedding` avec le type de données `float32` et la fonction de distance `cosine`.

    Wingtip crée un nouveau conteneur pour les mêmes données. Vous devez réduire d'environ moitié le stockage utilisé par les vecteurs. Le modèle d'incorporation et le nombre de dimensions ne doivent pas changer, et une légère perte de précision est acceptable.

    Quel paramètre devez-vous utiliser dans la stratégie d'incorporation vectorielle du nouveau conteneur ?
body:
  options:
    - id: a
      text: "\"distanceFunction\": \"dotproduct\""
    - id: b
      text: "\"dataType\": \"float16\""
    - id: c
      text: "\"dimensions\": 768"
    - id: d
      text: "\"distanceFunction\": \"euclidean\""
answer: { optionId: b }
explanation:
  correct:
    en: "The data type sets the size of each value: float32 uses 4 bytes per dimension and float16 uses 2. Learn notes that float16 can reduce vector storage by 50 %, with a possible small loss of accuracy, while the model and its 1,536 dimensions stay the same."
    fr: "Le type de données fixe la taille de chaque valeur : float32 utilise 4 octets par dimension et float16 en utilise 2. Learn indique que float16 peut réduire de 50 % le stockage des vecteurs, avec une légère perte de précision possible, tandis que le modèle et ses 1 536 dimensions restent les mêmes."
  options:
    a: { en: "The distance function changes how similarity is computed, not the size of the stored vectors.", fr: "La fonction de distance change le calcul de la similarité, pas la taille des vecteurs stockés." }
    c: { en: "The dimensions must match the model's output (1,536); declaring 768 would require a different model output.", fr: "Les dimensions doivent correspondre à la sortie du modèle (1 536) ; en déclarer 768 exigerait une autre sortie du modèle." }
    d: { en: "Euclidean distance is another similarity metric; it doesn't change the storage of the vectors.", fr: "La distance euclidienne est une autre mesure de similarité ; elle ne change pas le stockage des vecteurs." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
