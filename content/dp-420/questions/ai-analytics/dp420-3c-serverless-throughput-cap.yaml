id: dp420-3c-serverless-throughput-cap
objective: "3.3.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware uses an Azure Cosmos DB for NoSQL account in serverless mode for a pricing application. A Spark notebook in Microsoft Fabric writes recalculated prices to the prices container with the Spark connector. The Throughput Buckets preview isn't enabled on the subscription.

    During the write, the application's requests are throttled. The notebook must be limited to about 500 RU/s.

    Which throughput control setting should you add to the write configuration, in addition to enabling throughput control and naming the group?
  fr: |
    Litware utilise un compte Azure Cosmos DB for NoSQL en mode serverless pour une application de tarification. Un notebook Spark dans Microsoft Fabric écrit les prix recalculés dans le conteneur prices avec le connecteur Spark. La préversion Throughput Buckets n'est pas activée sur l'abonnement.

    Pendant l'écriture, les requêtes de l'application sont limitées. Le notebook doit être limité à environ 500 RU/s.

    Quel paramètre de contrôle du débit devez-vous ajouter à la configuration d'écriture, en plus de l'activation du contrôle du débit et du nom du groupe ?
body:
  options:
    - { id: a, text: "spark.cosmos.throughputControl.targetThroughputThreshold = 0.5" }
    - { id: b, text: "spark.cosmos.throughputControl.targetThroughput = 500" }
    - { id: c, text: "spark.cosmos.throughputControl.throughputBucket = 1" }
    - { id: d, text: "spark.cosmos.write.bulk.enabled = false" }
answer: { optionId: b }
explanation:
  correct:
    en: "Client-side throughput control can limit a group with an absolute value, `targetThroughput`, or with a fraction of the provisioned throughput, `targetThroughputThreshold`. A serverless account has no provisioned throughput, so only the absolute `targetThroughput` works there. The control is approximate, because the connector counts each charge after the response."
    fr: "Le contrôle du débit côté client peut limiter un groupe avec une valeur absolue, `targetThroughput`, ou avec une fraction du débit provisionné, `targetThroughputThreshold`. Un compte serverless n'a pas de débit provisionné : seul `targetThroughput`, en valeur absolue, y fonctionne. Le contrôle est approximatif, car le connecteur comptabilise chaque coût après la réponse."
  options:
    a:
      en: "A threshold is a fraction of the container's provisioned RU/s, which isn't supported for serverless accounts."
      fr: "Un seuil est une fraction des RU/s provisionnées du conteneur, ce qui n'est pas pris en charge pour les comptes serverless."
    c:
      en: "Throughput buckets require the preview to be enabled and aren't supported for serverless accounts."
      fr: "Les compartiments de débit exigent l'activation de la préversion et ne sont pas pris en charge pour les comptes serverless."
    d:
      en: "Disabling bulk changes how items are sent but doesn't cap the RUs that the job consumes."
      fr: "Désactiver le mode bulk change la façon dont les éléments sont envoyés, mais ne plafonne pas les RU consommées par le travail."
references:
  - title: "Azure Cosmos DB Spark connector: Throughput control"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/throughput-control-spark
