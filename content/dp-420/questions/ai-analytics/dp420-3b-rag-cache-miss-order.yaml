id: dp420-3b-rag-cache-miss-order
objective: "3.1.7"
type: ordering
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank runs a RAG assistant with two Azure Cosmos DB for NoSQL containers: **cache**, which stores context embeddings with their answers and has a default time to live, and **chunks**, which stores document chunks with their embeddings. Both containers have vector indexes.

    You need to implement the request path for a question that has no similar entry in the cache. Cost must be minimized, and the answer must be reusable for later similar questions.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Woodgrove Bank exploite un assistant RAG avec deux conteneurs Azure Cosmos DB for NoSQL : **cache**, qui stocke des incorporations de contexte avec leurs réponses et a une durée de vie par défaut, et **chunks**, qui stocke des segments de documents avec leurs incorporations. Les deux conteneurs ont des index vectoriels.

    Vous devez implémenter le traitement d'une question qui n'a aucune entrée similaire dans le cache. Le coût doit être réduit au minimum, et la réponse doit être réutilisable pour des questions similaires ultérieures.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: embed, text: { en: "Generate the embedding of the conversation context and the new question.", fr: "Générer l'incorporation du contexte de la conversation et de la nouvelle question." } }
    - { id: lookup, text: { en: "Run a vector query on cache and keep only results above the similarity threshold.", fr: "Exécuter une requête vectorielle sur cache et ne garder que les résultats au-dessus du seuil de similarité." } }
    - { id: retrieve, text: { en: "Run a TOP N vector query on chunks, filtered on the user's tenant.", fr: "Exécuter une requête vectorielle TOP N sur chunks, filtrée sur le locataire de l'utilisateur." } }
    - { id: generate, text: { en: "Send the retrieved chunk text and the question to the chat model.", fr: "Envoyer le texte des segments récupérés et la question au modèle de conversation." } }
    - { id: store, text: { en: "Write the context embedding and the generated answer as a new item in cache.", fr: "Écrire l'incorporation du contexte et la réponse générée comme nouvel élément dans cache." } }
    - { id: hits, text: { en: "Patch the hit counter of the closest cache item.", fr: "Mettre à jour par patch le compteur de succès de l'élément de cache le plus proche." } }
    - { id: tune, text: { en: "Fine-tune the chat model on the retrieved chunks.", fr: "Affiner le modèle de conversation sur les segments récupérés." } }
answer:
  sequence: [ embed, lookup, retrieve, generate, store ]
explanation:
  correct:
    en: |
      The cache is keyed on a vector of the context window plus the new question, so that vector is generated first and used to query the cache. Only on a miss does the application pay for retrieval and generation: it retrieves the closest chunks of the user's tenant, sends their text to the chat model, and then stores the new answer in the cache so that later similar questions hit it.
    fr: |
      La clé du cache est un vecteur de la fenêtre de contexte plus la nouvelle question : ce vecteur est donc généré en premier et sert à interroger le cache. Ce n'est qu'en cas d'échec que l'application paie la récupération et la génération : elle récupère les segments les plus proches du locataire de l'utilisateur, envoie leur texte au modèle de conversation, puis stocke la nouvelle réponse dans le cache pour que les questions similaires ultérieures y trouvent un succès.
  options:
    hits:
      en: "The hit counter is updated when a cached answer is returned, which is not the case for a miss."
      fr: "Le compteur de succès est mis à jour quand une réponse en cache est renvoyée, ce qui n'est pas le cas lors d'un échec."
    tune:
      en: "RAG grounds the model through the prompt at request time; no training is part of the request path."
      fr: "La RAG ancre le modèle par le prompt au moment de la requête ; aucun entraînement ne fait partie du traitement d'une requête."
references:
  - title: Semantic Cache for Large Language Models - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/semantic-cache
  - title: Retrieval Augmented Generation - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/rag
