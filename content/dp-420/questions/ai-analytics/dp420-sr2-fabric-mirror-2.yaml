id: dp420-sr2-fabric-mirror-2
objective: "3.3.2"
type: series_yesno
series: dp420-sr2-fabric-mirror
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: |
    You switch to 7-day continuous backup and connect with the primary key.
  fr: |
    Vous passez à la sauvegarde continue de 7 jours et vous connectez avec la clé primaire.
body:
  solution:
    en: |
      You switch cosmos-litware to continuous backup with **7-day** retention. You then create a mirrored Azure Cosmos DB database in the Fabric workspace that connects to `telemetry` by using the account's primary key.
    fr: |
      Vous passez cosmos-litware en sauvegarde continue avec une rétention de **7 jours**. Vous créez ensuite une base de données Azure Cosmos DB mise en miroir dans l'espace de travail Fabric, qui se connecte à `telemetry` à l'aide de la clé primaire du compte.
answer: { value: true }
explanation:
  correct:
    en: |
      Continuous backup is the mirroring prerequisite, and the 7-day tier is the recommended choice because it is free. Mirroring supports account-level keys, uses the single write region, and replicates without consuming RUs, so the solution meets every requirement.
    fr: |
      La sauvegarde continue est le prérequis de la mise en miroir, et le niveau de 7 jours est le choix recommandé car il est gratuit. La mise en miroir prend en charge les clés au niveau du compte, utilise l'unique région d'écriture et réplique sans consommer de RU : la solution remplit toutes les exigences.
references:
  - title: Microsoft Fabric Mirrored Databases From Azure Cosmos DB - Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
