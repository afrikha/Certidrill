id: dp420-3c-fabric-facts-yn
objective: "3.3.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank plans to create a Cosmos DB database in a Microsoft Fabric workspace for a new budgeting app. The developers are used to Azure Cosmos DB for NoSQL.

    For each of the following statements, select Yes if the statement is true. Otherwise, select No.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank prévoit de créer une base de données Cosmos DB dans un espace de travail Microsoft Fabric pour une nouvelle application de gestion budgétaire. Les développeurs ont l'habitude d'Azure Cosmos DB for NoSQL.

    Pour chacune des affirmations suivantes, sélectionnez Oui si l'affirmation est vraie. Sinon, sélectionnez Non.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text: { en: "The app can connect to the database by using the primary key shown in the database settings.", fr: "L'application peut se connecter à la base de données avec la clé primaire affichée dans les paramètres de la base de données." }
    - id: s2
      text: { en: "A container that you create in the Fabric portal gets a maximum autoscale throughput of 5,000 RU/s.", fr: "Un conteneur que vous créez dans le portail Fabric reçoit un débit autoscale maximal de 5 000 RU/s." }
    - id: s3
      text: { en: "The database's usage is charged in capacity units (CUs) against the Fabric capacity of the workspace.", fr: "L'utilisation de la base de données est facturée en unités de capacité (CU) sur la capacité Fabric de l'espace de travail." }
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Cosmos DB in Fabric supports only Microsoft Entra authentication: there are no primary or secondary keys and no key-based connection strings. Containers created in the Fabric portal get a 5,000 RU/s autoscale maximum, while the SDK can set 1,000 to 50,000 RU/s. Usage is billed in Fabric capacity units at 100 RU/s = 0.067 CU per hour, not in Azure request unit charges."
    fr: "Cosmos DB dans Fabric ne prend en charge que l'authentification Microsoft Entra : il n'y a ni clé primaire ni clé secondaire, ni chaîne de connexion à base de clé. Les conteneurs créés dans le portail Fabric reçoivent un maximum autoscale de 5 000 RU/s, alors que le SDK permet de définir de 1 000 à 50 000 RU/s. L'utilisation est facturée en unités de capacité Fabric, à raison de 100 RU/s = 0,067 CU par heure, et non en frais d'unités de requête Azure."
references:
  - title: Frequently asked questions for Cosmos DB in Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq
  - title: Billing and utilization data for Cosmos DB in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/billing-usage
