id: dp420-3b-conv-ttl-after-patch
objective: "3.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam stores conversation turns in an Azure Cosmos DB for NoSQL container whose default time to live is 86,400 seconds. The turn items do not have a `ttl` property.

    A turn is created at 08:00. At 10:00 the same day, a background job applies a patch operation to the turn to add a `sentiment` property. The turn is not modified again.

    When does the turn stop appearing in query results?
  fr: |
    Fabrikam stocke des tours de conversation dans un conteneur Azure Cosmos DB for NoSQL dont la durée de vie par défaut est de 86 400 secondes. Les éléments de tour n'ont pas de propriété `ttl`.

    Un tour est créé à 08:00. À 10:00 le même jour, un travail en arrière-plan applique une opération de patch au tour pour y ajouter une propriété `sentiment`. Le tour n'est plus modifié ensuite.

    Quand le tour cesse-t-il d'apparaître dans les résultats des requêtes ?
body:
  options:
    - id: a
      text: { en: "At 08:00 the next day", fr: "À 08:00 le lendemain" }
    - id: b
      text: { en: "At 10:00 the same day, because the patch removes the default time to live", fr: "À 10:00 le même jour, car le patch supprime la durée de vie par défaut" }
    - id: c
      text: { en: "At 10:00 the next day", fr: "À 10:00 le lendemain" }
    - id: d
      text: { en: "Never, because the item has no ttl property", fr: "Jamais, car l'élément n'a pas de propriété ttl" }
answer: { optionId: c }
explanation:
  correct:
    en: "TTL is a delta from the time the item was last modified. The patch at 10:00 is a modification, so the turn, which inherits the container default of 86,400 seconds, expires 24 hours later, at 10:00 the next day. An expired item disappears from query results immediately, even before the background deletion."
    fr: "La TTL est un délai compté à partir de la dernière modification de l'élément. Le patch de 10:00 est une modification ; le tour, qui hérite de la valeur par défaut du conteneur de 86 400 secondes, expire donc 24 heures plus tard, à 10:00 le lendemain. Un élément expiré disparaît immédiatement des résultats des requêtes, même avant sa suppression en arrière-plan."
  options:
    a:
      en: "Expiry is not counted from the creation time but from the last modification, which is the 10:00 patch."
      fr: "L'expiration ne se compte pas à partir de la création, mais de la dernière modification, c'est-à-dire le patch de 10:00."
    b:
      en: "A patch that adds a property does not touch the TTL settings; the container default still applies."
      fr: "Un patch qui ajoute une propriété ne touche pas aux paramètres de TTL ; la valeur par défaut du conteneur s'applique toujours."
    d:
      en: "Items without a ttl property inherit the container default time to live."
      fr: "Les éléments sans propriété ttl héritent de la durée de vie par défaut du conteneur."
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
