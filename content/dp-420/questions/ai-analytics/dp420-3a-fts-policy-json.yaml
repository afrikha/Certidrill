id: dp420-3a-fts-policy-json
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam stores English news articles in an Azure Cosmos DB for NoSQL container named **articles**. The Full Text & Hybrid Search for NoSQL API feature is enabled on the account.

    You are writing the definition of a new articles container. Queries will rank articles with `FullTextScore` on the `/title` and `/summary` properties, and they must use a full-text index.

    The first JSON object is the full-text policy of the container, and the second is its indexing policy.

    How should you complete the definitions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam stocke des articles d'actualité en anglais dans un conteneur Azure Cosmos DB for NoSQL nommé **articles**. La fonctionnalité Full Text & Hybrid Search for NoSQL API est activée sur le compte.

    Vous écrivez la définition d'un nouveau conteneur articles. Les requêtes classeront les articles avec `FullTextScore` sur les propriétés `/title` et `/summary`, et elles doivent utiliser un index de texte intégral.

    Le premier objet JSON est la stratégie de texte intégral du conteneur, le second sa stratégie d'indexation.

    Comment devez-vous compléter les définitions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "defaultLanguage": "en-US",
      "[[paths]]": [
        { "path": "/title", "language": "[[lang]]" },
        { "path": "/summary", "language": "en-US" }
      ]
    }

    {
      "indexingMode": "consistent",
      "automatic": true,
      "includedPaths": [ { "path": "/*" } ],
      "excludedPaths": [ { "path": "/\"_etag\"/?" } ],
      "[[idx]]": [
        { "path": "/title" },
        { "path": "/summary" }
      ]
    }
  slots:
    - id: paths
      options:
        - { id: ftpaths, text: fullTextPaths }
        - { id: ftidx, text: fullTextIndexes }
        - { id: incl, text: includedPaths }
        - { id: vemb, text: vectorEmbeddings }
    - id: lang
      options:
        - { id: lower, text: en-us }
        - { id: enus, text: en-US }
        - { id: en, text: en }
        - { id: english, text: english }
    - id: idx
      options:
        - { id: comp, text: compositeIndexes }
        - { id: vec, text: vectorIndexes }
        - { id: ft, text: fullTextIndexes }
        - { id: spat, text: spatialIndexes }
answer:
  values: { paths: ftpaths, lang: enus, idx: ft }
explanation:
  correct:
    en: "The full-text policy lists each text property in `fullTextPaths`, with its path and language. Language codes are case-sensitive, so English is `en-US`. The indexing policy then declares the same paths in `fullTextIndexes`; without that section, full-text functions run without the index and cost more RUs."
    fr: "La stratégie de texte intégral liste chaque propriété de texte dans `fullTextPaths`, avec son chemin et sa langue. Les codes de langue respectent la casse : l'anglais est `en-US`. La stratégie d'indexation déclare ensuite les mêmes chemins dans `fullTextIndexes` ; sans cette section, les fonctions de texte intégral s'exécutent sans l'index et coûtent plus de RU."
  options:
    ftidx: { en: "fullTextIndexes belongs to the indexing policy, not to the full-text policy.", fr: "fullTextIndexes appartient à la stratégie d'indexation, pas à la stratégie de texte intégral." }
    incl: { en: "includedPaths defines range indexing in the indexing policy; it takes no language.", fr: "includedPaths définit l'indexation de plage dans la stratégie d'indexation ; il ne prend pas de langue." }
    vemb: { en: "vectorEmbeddings is the list of the vector embedding policy.", fr: "vectorEmbeddings est la liste de la stratégie d'incorporation vectorielle." }
    lower: { en: "Language codes are case-sensitive: en-us is not accepted.", fr: "Les codes de langue respectent la casse : en-us n'est pas accepté." }
    en: { en: "The supported code for English is en-US, not en.", fr: "Le code pris en charge pour l'anglais est en-US, pas en." }
    english: { en: "The policy expects a language code such as en-US, not a language name.", fr: "La stratégie attend un code de langue comme en-US, pas un nom de langue." }
    comp: { en: "Composite indexes serve multi-property ORDER BY and filters, not full-text search.", fr: "Les index composites servent les ORDER BY et filtres sur plusieurs propriétés, pas la recherche en texte intégral." }
    vec: { en: "vectorIndexes declares vector indexes for VectorDistance.", fr: "vectorIndexes déclare des index vectoriels pour VectorDistance." }
    spat: { en: "Spatial indexes serve geospatial queries.", fr: "Les index spatiaux servent les requêtes géospatiales." }
references:
  - title: Full Text Indexing and Search - Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/full-text-indexing
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
