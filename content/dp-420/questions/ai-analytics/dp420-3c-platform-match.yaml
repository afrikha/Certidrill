id: dp420-3c-platform-match
objective: "3.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders has four NoSQL workloads. The data team works in Microsoft Fabric.

    You need to recommend a data platform for each workload. The solution must minimize administrative effort.

    What should you recommend for each workload? To answer, drag the appropriate platforms to the correct workloads. Each platform may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders a quatre charges de travail NoSQL. L'équipe de données travaille dans Microsoft Fabric.

    Vous devez recommander une plateforme de données pour chaque charge de travail. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous recommander pour chaque charge de travail ? Pour répondre, faites glisser les plateformes appropriées vers les charges de travail correspondantes. Chaque plateforme peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: azure, text: { en: "Azure Cosmos DB for NoSQL, not mirrored", fr: "Azure Cosmos DB for NoSQL, sans mise en miroir" } }
    - { id: mirrored, text: { en: "Azure Cosmos DB for NoSQL mirrored into Fabric", fr: "Azure Cosmos DB for NoSQL mis en miroir dans Fabric" } }
    - { id: fabric, text: { en: "Cosmos DB in Microsoft Fabric", fr: "Cosmos DB dans Microsoft Fabric" } }
    - { id: sqldb, text: { en: "SQL database in Microsoft Fabric", fr: "Base de données SQL dans Microsoft Fabric" } }
  targets:
    - id: t1
      text: { en: "A new recommendation app whose database must be billed on the team's Fabric capacity and whose data must be available in OneLake with no setup", fr: "Une nouvelle application de recommandations dont la base de données doit être facturée sur la capacité Fabric de l'équipe et dont les données doivent être disponibles dans OneLake sans configuration" }
    - id: t2
      text: { en: "An existing production account with continuous backup, whose orders must feed near real-time Power BI reports without moving the data", fr: "Un compte de production existant avec sauvegarde continue, dont les commandes doivent alimenter des rapports Power BI en temps quasi réel sans déplacer les données" }
    - id: t3
      text: { en: "A shopping cart service that must accept writes in two Azure regions at the same time, with no analytics requirement", fr: "Un service de panier qui doit accepter des écritures dans deux régions Azure en même temps, sans exigence d'analytique" }
    - id: t4
      text: { en: "A test environment with sporadic traffic that must be billed per request with serverless throughput, with no analytics requirement", fr: "Un environnement de test au trafic sporadique qui doit être facturé à la requête avec un débit serverless, sans exigence d'analytique" }
answer:
  mapping: { t1: fabric, t2: mirrored, t3: azure, t4: azure }
explanation:
  correct:
    en: "Cosmos DB in Fabric is billed in Fabric capacity units and is always mirrored to OneLake. An existing Azure Cosmos DB account is mirrored into Fabric rather than migrated: mirroring needs continuous backup and replicates in near real time. Multi-region writes and serverless throughput exist only in Azure Cosmos DB, since Cosmos DB in Fabric is single-region and autoscale only."
    fr: "Cosmos DB dans Fabric est facturé en unités de capacité Fabric et toujours mis en miroir dans OneLake. Un compte Azure Cosmos DB existant est mis en miroir dans Fabric plutôt que migré : la mise en miroir exige la sauvegarde continue et réplique en temps quasi réel. Les écritures multirégions et le débit serverless n'existent que dans Azure Cosmos DB, car Cosmos DB dans Fabric est monorégion et uniquement en autoscale."
  options:
    sqldb:
      en: "SQL database in Fabric is a relational database; none of the workloads asks for a relational model."
      fr: "Une base de données SQL dans Fabric est une base relationnelle ; aucune des charges de travail ne demande un modèle relationnel."
    mirrored:
      en: "Mirroring doesn't support accounts with multiple write regions, and the cart and test workloads have no analytics requirement to justify it."
      fr: "La mise en miroir ne prend pas en charge les comptes avec plusieurs régions d'écriture, et les charges de travail du panier et de test n'ont pas d'exigence d'analytique qui la justifie."
references:
  - title: Frequently asked questions for Cosmos DB in Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
