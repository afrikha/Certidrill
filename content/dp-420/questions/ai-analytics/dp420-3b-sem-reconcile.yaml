id: dp420-3b-sem-reconcile
objective: "3.2.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's delivery agent stores long-term facts in an Azure Cosmos DB for NoSQL container named **memories**, partitioned by `/userId`. In March, a user said "Deliver to my office in Lyon", which was stored as a fact. Today the user says "From now on, deliver to my home address."

    The memory pipeline must stop recalling the March fact, and the compliance team requires a record of which fact replaced which and when.

    What should the pipeline do?
  fr: |
    L'agent de livraison de Fabrikam stocke des faits à long terme dans un conteneur Azure Cosmos DB for NoSQL nommé **memories**, partitionné par `/userId`. En mars, un utilisateur a dit « Livrez à mon bureau de Lyon », ce qui a été stocké comme un fait. Aujourd'hui, l'utilisateur dit « Désormais, livrez à mon domicile. »

    Le pipeline de mémoire doit cesser de rappeler le fait de mars, et l'équipe de conformité exige une trace du fait qui en a remplacé un autre et de la date.

    Que doit faire le pipeline ?
body:
  options:
    - id: a
      text: { en: "Delete the March fact and insert the new fact.", fr: "Supprimer le fait de mars et insérer le nouveau fait." }
    - id: b
      text: { en: "Insert the new fact and keep both facts active so that the chat model can decide.", fr: "Insérer le nouveau fait et conserver les deux faits actifs pour que le modèle de conversation décide." }
    - id: c
      text: { en: "Set a ttl of one day on the March fact and insert the new fact.", fr: "Définir un ttl d'un jour sur le fait de mars et insérer le nouveau fait." }
    - id: d
      text: { en: "Insert the new fact, mark the March fact as superseded by it with a timestamp, and exclude superseded facts in recall queries.", fr: "Insérer le nouveau fait, marquer le fait de mars comme remplacé par celui-ci avec un horodatage, et exclure les faits remplacés dans les requêtes de rappel." }
answer: { optionId: d }
explanation:
  correct:
    en: "Fact reconciliation detects duplicate or contradictory facts and keeps an audit trail by soft-deleting the superseded record instead of removing it. The recall query filters out superseded facts, so the agent only recalls the current preference while the history remains available."
    fr: "La réconciliation des faits détecte les faits en double ou contradictoires et conserve une piste d'audit en supprimant de façon réversible l'enregistrement remplacé au lieu de l'effacer. La requête de rappel exclut les faits remplacés : l'agent ne rappelle que la préférence actuelle, tandis que l'historique reste disponible."
  options:
    a:
      en: "Deleting the old fact loses the record that the compliance team requires."
      fr: "Supprimer l'ancien fait fait disparaître la trace exigée par l'équipe de conformité."
    b:
      en: "Two contradictory active facts can both be recalled, and the model may follow the outdated one."
      fr: "Deux faits actifs contradictoires peuvent être rappelés ensemble, et le modèle peut suivre celui qui est obsolète."
    c:
      en: "The fact keeps being recalled for a day, and it is then deleted, which also loses the record."
      fr: "Le fait continue d'être rappelé pendant un jour, puis il est supprimé, ce qui fait aussi disparaître la trace."
references:
  - title: Agent Memory Toolkit (Preview) - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-memory-toolkit
