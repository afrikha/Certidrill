id: dp420-sr1-manual-chunks-2
objective: "3.1.2"
type: series_yesno
series: dp420-sr1-manual-chunks
seriesOrder: 2
difficulty: 1
status: draft
stem:
  en: You create the container in kb with dedicated throughput and a flat vector index.
  fr: Vous créez le conteneur dans kb avec un débit dédié et un index vectoriel flat.
body:
  solution:
    en: |
      You create chunks in the **kb** database with dedicated autoscale throughput and the following vector embedding policy:

      ```json
      {
        "vectorEmbeddings": [
          { "path": "/embedding", "dataType": "float32", "distanceFunction": "cosine", "dimensions": 3072 }
        ]
      }
      ```

      You use the following indexing policy:

      ```json
      {
        "indexingMode": "consistent",
        "automatic": true,
        "includedPaths": [{ "path": "/*" }],
        "excludedPaths": [{ "path": "/_etag/?" }, { "path": "/embedding/*" }],
        "vectorIndexes": [{ "path": "/embedding", "type": "flat" }]
      }
      ```
    fr: |
      Vous créez chunks dans la base de données **kb** avec un débit de mise à l'échelle automatique dédié et la stratégie d'incorporation vectorielle suivante :

      ```json
      {
        "vectorEmbeddings": [
          { "path": "/embedding", "dataType": "float32", "distanceFunction": "cosine", "dimensions": 3072 }
        ]
      }
      ```

      Vous utilisez la stratégie d'indexation suivante :

      ```json
      {
        "indexingMode": "consistent",
        "automatic": true,
        "includedPaths": [{ "path": "/*" }],
        "excludedPaths": [{ "path": "/_etag/?" }, { "path": "/embedding/*" }],
        "vectorIndexes": [{ "path": "/embedding", "type": "flat" }]
      }
      ```
answer: { value: false }
explanation:
  correct:
    en: The `flat` index supports at most 505 dimensions, so it cannot index 3,072-dimension embeddings. Even for smaller vectors, `flat` performs a brute-force search, which is not the lowest latency and RU option for millions of vectors.
    fr: "L'index `flat` prend en charge au maximum 505 dimensions : il ne peut donc pas indexer des incorporations de 3 072 dimensions. Même pour des vecteurs plus petits, `flat` effectue une recherche exhaustive, ce qui n'est pas l'option offrant la latence et la consommation de RU les plus faibles pour des millions de vecteurs."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
