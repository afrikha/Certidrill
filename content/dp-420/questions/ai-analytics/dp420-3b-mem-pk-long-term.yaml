id: dp420-3b-mem-pk-long-term
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam's shopping agent keeps its short-term memory in a container named **turns**, partitioned by `/threadId`. You are adding a container named **memories** for long-term memory: facts and preferences extracted from all the threads of a user, each with an embedding.

    At the start of every new thread, the agent runs a vector query that recalls the facts of the current user, whatever thread they come from. Each user has at most a few thousand facts, and there are 5 million users.

    You need to choose the partition key of memories to minimize the RU charge of the recall query and isolate the memories of each user.

    Which partition key should you use?
  fr: |
    L'agent d'achat de Fabrikam conserve sa mémoire à court terme dans un conteneur nommé **turns**, partitionné par `/threadId`. Vous ajoutez un conteneur nommé **memories** pour la mémoire à long terme : des faits et des préférences extraits de tous les threads d'un utilisateur, chacun avec une incorporation.

    Au début de chaque nouveau thread, l'agent exécute une requête vectorielle qui rappelle les faits de l'utilisateur actuel, quel que soit le thread dont ils proviennent. Chaque utilisateur a au plus quelques milliers de faits, et il y a 5 millions d'utilisateurs.

    Vous devez choisir la clé de partition de memories pour réduire au minimum les frais en RU de la requête de rappel et isoler les mémoires de chaque utilisateur.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - id: a
      text: /threadId
    - id: b
      text: /userId
    - id: c
      text: /factType
    - id: d
      text: /createdDate
answer: { optionId: b }
explanation:
  correct:
    en: "Long-term memory is recalled per user across threads, so partitioning by userId puts all the facts of a user in one logical partition. The recall query filters on the user and runs against a single partition, and the partition key also scopes every read to the authenticated user. Five million users give high cardinality and an even spread."
    fr: "La mémoire à long terme se rappelle par utilisateur, d'un thread à l'autre ; partitionner par userId place tous les faits d'un utilisateur dans une seule partition logique. La requête de rappel filtre sur l'utilisateur et s'exécute sur une seule partition, et la clé de partition limite aussi chaque lecture à l'utilisateur authentifié. Cinq millions d'utilisateurs offrent une forte cardinalité et une répartition homogène."
  options:
    a:
      en: "The facts of a user come from many threads, so a query on one user would fan out to every partition."
      fr: "Les faits d'un utilisateur proviennent de nombreux threads ; une requête sur un utilisateur serait diffusée vers toutes les partitions."
    c:
      en: "A few fact types give very low cardinality and hot partitions, and a user query still crosses partitions."
      fr: "Quelques types de faits donnent une très faible cardinalité et des partitions chaudes, et une requête sur un utilisateur traverse toujours les partitions."
    d:
      en: "A date key sends all of a day's writes to one partition and scatters each user's facts across dates."
      fr: "Une clé de date envoie toutes les écritures d'une journée vers une seule partition et disperse les faits de chaque utilisateur entre les dates."
references:
