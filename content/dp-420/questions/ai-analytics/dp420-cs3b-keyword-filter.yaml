id: dp420-cs3b-keyword-filter
objective: "3.1.1"
type: yesno_statements
caseStudy: dp420-cs3b-lucerne-publishing
difficulty: 1
status: draft
stem:
  en: |
    You are implementing the keyword restriction of requirement 4. A researcher types the keywords `permafrost` and `methane`, which Scholar passes as the parameters `@kw1` and `@kw2`.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous implémentez la restriction par mots clés de l'exigence 4. Un chercheur saisit les mots clés `permafrost` et `methane`, que Scholar transmet sous la forme des paramètres `@kw1` et `@kw2`.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Adding `FullTextContainsAll(c.chunkText, @kw1, @kw2)` to the WHERE clause returns only the chunks whose text contains both keywords."
        fr: "Ajouter `FullTextContainsAll(c.chunkText, @kw1, @kw2)` à la clause WHERE ne renvoie que les segments dont le texte contient les deux mots clés."
    - id: s2
      text:
        en: "To display the BM25 relevance of each result, the query can return `FullTextScore(c.chunkText, @kw1, @kw2)` as a property in the SELECT clause."
        fr: "Pour afficher la pertinence BM25 de chaque résultat, la requête peut renvoyer `FullTextScore(c.chunkText, @kw1, @kw2)` comme propriété dans la clause SELECT."
    - id: s3
      text:
        en: "If the full-text index on `/chunkText` were removed, queries that use `FullTextContainsAll` on `chunkText` would return an error."
        fr: "Si l'index de texte intégral sur `/chunkText` était supprimé, les requêtes qui utilisent `FullTextContainsAll` sur `chunkText` renverraient une erreur."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "`FullTextContainsAll` returns true only when the property contains every term passed, so it implements an \"all keywords\" filter in the WHERE clause. `FullTextScore` can be used only in an `ORDER BY RANK` clause; it cannot be projected in SELECT or used in WHERE. Without a full-text policy and index, full-text queries still run, but they do not use the full-text index and consume more RUs."
    fr: "`FullTextContainsAll` ne renvoie true que si la propriété contient tous les termes transmis : la fonction implémente donc un filtre « tous les mots clés » dans la clause WHERE. `FullTextScore` ne peut être utilisée que dans une clause `ORDER BY RANK` ; elle ne peut être ni projetée dans SELECT, ni utilisée dans WHERE. Sans stratégie ni index de texte intégral, les requêtes de texte intégral s'exécutent quand même, mais elles n'utilisent pas l'index de texte intégral et consomment davantage de RU."
references:
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
