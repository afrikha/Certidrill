id: dp420-sr2-fabric-mirror-1
objective: "3.3.2"
type: series_yesno
series: dp420-sr2-fabric-mirror
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: |
    You enable analytical store and keep periodic backup.
  fr: |
    Vous activez le magasin analytique et conservez la sauvegarde périodique.
body:
  solution:
    en: |
      You keep the periodic backup mode of cosmos-litware. You enable analytical store on the three containers of `telemetry`, and then you create a mirrored Azure Cosmos DB database in the Fabric workspace that connects to `telemetry` by using the account's primary key.
    fr: |
      Vous conservez le mode de sauvegarde périodique de cosmos-litware. Vous activez le magasin analytique sur les trois conteneurs de `telemetry`, puis vous créez une base de données Azure Cosmos DB mise en miroir dans l'espace de travail Fabric, qui se connecte à `telemetry` à l'aide de la clé primaire du compte.
answer: { value: false }
explanation:
  correct:
    en: |
      Mirroring requires continuous backup on the source account, because the initial load is read from the continuous backup; periodic backup does not meet this prerequisite. Mirroring does not use analytical store as its change data capture source, so enabling it adds cost without enabling mirroring.
    fr: |
      La mise en miroir nécessite la sauvegarde continue sur le compte source, car le chargement initial est lu à partir de la sauvegarde continue ; la sauvegarde périodique ne remplit pas ce prérequis. La mise en miroir n'utilise pas le magasin analytique comme source de capture des changements : l'activer ajoute un coût sans permettre la mise en miroir.
references:
  - title: Microsoft Fabric Mirrored Databases From Azure Cosmos DB - Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
