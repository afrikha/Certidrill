id: dp420-3a-vec-index-dims
objective: "3.1.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso is creating an Azure Cosmos DB for NoSQL container whose vector embedding policy declares the `/imageVector` path with 2,048 dimensions.

    Which two vector index types can you define on `/imageVector`?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso crée un conteneur Azure Cosmos DB for NoSQL dont la stratégie d'incorporation vectorielle déclare le chemin `/imageVector` avec 2 048 dimensions.

    Quels sont les deux types d'index vectoriel que vous pouvez définir sur `/imageVector` ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: diskANN }
    - { id: b, text: flat }
    - { id: c, text: quantizedFlat }
    - { id: d, text: { en: "A spatial index", fr: "Un index spatial" } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: "quantizedFlat and diskANN support vectors of up to 4,096 dimensions, so both can index a 2,048-dimension path."
    fr: "quantizedFlat et diskANN prennent en charge des vecteurs de 4 096 dimensions au plus : les deux peuvent indexer un chemin de 2 048 dimensions."
  options:
    b: { en: "flat supports at most 505 dimensions.", fr: "flat prend en charge au plus 505 dimensions." }
    d: { en: "Spatial indexes serve geospatial data such as points and polygons, not vectors.", fr: "Les index spatiaux servent les données géospatiales comme les points et les polygones, pas les vecteurs." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
