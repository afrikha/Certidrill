id: dp420-3c-mirror-auth-kind
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL account named cosmos-adatum with 7-day continuous backup. A data engineer named Engineer1 will create a mirrored database in Microsoft Fabric for the account's inventory database.

    The security policy states that read-write account keys must never leave the database administrators' team. Engineer1 has a Microsoft Entra user account. The solution must follow the principle of least privilege.

    How should you configure authentication for the mirroring connection?
  fr: |
    Adatum dispose d'un compte Azure Cosmos DB for NoSQL nommé cosmos-adatum avec la sauvegarde continue de 7 jours. Un ingénieur données nommé Engineer1 va créer une base de données en miroir dans Microsoft Fabric pour la base de données inventory du compte.

    La stratégie de sécurité impose que les clés de compte en lecture-écriture ne sortent jamais de l'équipe des administrateurs de bases de données. Engineer1 dispose d'un compte d'utilisateur Microsoft Entra. La solution doit respecter le principe du moindre privilège.

    Comment devez-vous configurer l'authentification de la connexion de mise en miroir ?
body:
  options:
    - { id: a, text: { en: "Use the Account key authentication kind with the primary read-only key of cosmos-adatum.", fr: "Utiliser le type d'authentification Account key avec la clé primaire en lecture seule de cosmos-adatum." } }
    - { id: b, text: { en: "Use the Organizational account authentication kind, and assign Engineer1 a custom data plane role with readMetadata and readAnalytics.", fr: "Utiliser le type d'authentification Organizational account, et attribuer à Engineer1 un rôle personnalisé du plan de données avec readMetadata et readAnalytics." } }
    - { id: c, text: { en: "Use the Fabric workspace identity, and assign it the Cosmos DB Built-in Data Reader role on cosmos-adatum.", fr: "Utiliser l'identité de l'espace de travail Fabric, et lui attribuer le rôle Cosmos DB Built-in Data Reader sur cosmos-adatum." } }
    - { id: d, text: { en: "Use the Organizational account authentication kind, and assign Engineer1 the Cosmos DB Account Reader Role on cosmos-adatum.", fr: "Utiliser le type d'authentification Organizational account, et attribuer à Engineer1 le rôle Cosmos DB Account Reader Role sur cosmos-adatum." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A mirroring connection authenticates with a read-write account key or with Microsoft Entra ID (the Organizational account kind). With Microsoft Entra ID, the identity needs a data plane role that grants `Microsoft.DocumentDB/databaseAccounts/readMetadata` and `Microsoft.DocumentDB/databaseAccounts/readAnalytics`, which keeps the keys with the administrators and grants only what mirroring needs."
    fr: "Une connexion de mise en miroir s'authentifie avec une clé de compte en lecture-écriture ou avec Microsoft Entra ID (type Organizational account). Avec Microsoft Entra ID, l'identité a besoin d'un rôle du plan de données qui accorde `Microsoft.DocumentDB/databaseAccounts/readMetadata` et `Microsoft.DocumentDB/databaseAccounts/readAnalytics`, ce qui laisse les clés aux administrateurs et n'accorde que ce dont la mise en miroir a besoin."
  options:
    a:
      en: "Read-only account keys aren't supported for mirroring; only read-write keys work with the Account key kind."
      fr: "Les clés de compte en lecture seule ne sont pas prises en charge pour la mise en miroir ; seules les clés en lecture-écriture fonctionnent avec le type Account key."
    c:
      en: "Managed identities aren't supported for the mirroring connection."
      fr: "Les identités managées ne sont pas prises en charge pour la connexion de mise en miroir."
    d:
      en: "Cosmos DB Account Reader Role is an Azure control plane role; it doesn't grant the data plane actions that mirroring requires."
      fr: "Cosmos DB Account Reader Role est un rôle Azure du plan de contrôle ; il n'accorde pas les actions du plan de données exigées par la mise en miroir."
references:
  - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
  - title: "Tutorial: Configure Microsoft Fabric mirrored database for Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-tutorial
