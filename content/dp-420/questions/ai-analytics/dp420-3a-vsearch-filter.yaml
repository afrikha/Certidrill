id: dp420-3a-vsearch-filter
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam sells furniture online. The **products** container in Azure Cosmos DB for NoSQL has a diskANN index on `/embedding`, and each item has `price` and `inStock` properties.

    You need to return the five products that are the most similar to the shopper's query vector `@v` among the products that cost less than 50 and are in stock. The query must always return five products when at least five products match the conditions.

    Which query should you use?
  fr: |
    Fabrikam vend des meubles en ligne. Le conteneur **products** d'Azure Cosmos DB for NoSQL possède un index diskANN sur `/embedding`, et chaque élément a les propriétés `price` et `inStock`.

    Vous devez renvoyer les cinq produits les plus similaires au vecteur de requête du client `@v` parmi les produits qui coûtent moins de 50 et sont en stock. La requête doit toujours renvoyer cinq produits lorsqu'au moins cinq produits remplissent les conditions.

    Quelle requête devez-vous utiliser ?
body:
  options:
    - { id: a, text: "SELECT TOP 5 c.id, c.name FROM c ORDER BY VectorDistance(c.embedding, @v), c.price" }
    - { id: b, text: "SELECT TOP 5 c.id, c.name FROM c WHERE c.price < 50 AND c.inStock = true ORDER BY VectorDistance(c.embedding, @v)" }
    - { id: c, text: "SELECT TOP 5 c.id, c.name FROM c WHERE c.price < 50 OR c.inStock = true ORDER BY VectorDistance(c.embedding, @v)" }
    - { id: d, text: "SELECT TOP 5 c.id, c.name FROM c WHERE c.price < 50 ORDER BY VectorDistance(c.embedding, @v)" }
answer: { optionId: b }
explanation:
  correct:
    en: "Vector search combines with WHERE filters: the query keeps only the products that meet both conditions and ranks them by similarity, and TOP 5 returns the five closest of those products."
    fr: "La recherche vectorielle se combine avec des filtres WHERE : la requête ne garde que les produits qui remplissent les deux conditions et les classe par similarité, et TOP 5 renvoie les cinq plus proches parmi eux."
  options:
    a: { en: "A second sort key doesn't filter anything; the query can return expensive or out-of-stock products.", fr: "Une seconde clé de tri ne filtre rien ; la requête peut renvoyer des produits chers ou en rupture de stock." }
    c: { en: "OR keeps products that meet only one of the two conditions.", fr: "OR garde les produits qui ne remplissent qu'une des deux conditions." }
    d: { en: "The query filters on price only, so it can return products that are out of stock.", fr: "La requête ne filtre que sur le prix : elle peut renvoyer des produits en rupture de stock." }
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
