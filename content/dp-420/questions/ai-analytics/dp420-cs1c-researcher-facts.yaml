id: dp420-cs1c-researcher-facts
objective: "3.2.3"
type: multi
caseStudy: dp420-cs1c-trey-research
difficulty: 3
status: draft
stem:
  en: |
    The memories container has a vector embedding policy and a DiskANN vector index on `/embedding`. The API passes the embedding of the researcher's new question in `@queryVector`.

    You need to implement the long-term memory requirement. Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Le conteneur memories dispose d'une stratégie d'incorporation vectorielle et d'un index vectoriel DiskANN sur `/embedding`. L'API transmet l'incorporation de la nouvelle question du chercheur dans `@queryVector`.

    Vous devez implémenter l'exigence relative à la mémoire à long terme. Quelles sont les deux actions que vous devez effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text:
        en: "Store each extracted fact as a separate item of the memories container with `userId`, the fact text and its `embedding`, and no `ttl` property."
        fr: "Stocker chaque fait extrait comme un élément distinct du conteneur memories avec `userId`, le texte du fait et son `embedding`, sans propriété `ttl`."
    - id: b
      text:
        en: "Store each extracted fact as an additional item of the turns container, in the partition of the current thread."
        fr: "Stocker chaque fait extrait comme un élément supplémentaire du conteneur turns, dans la partition du fil en cours."
    - id: c
      text:
        en: "Retrieve the facts with `SELECT TOP 5 c.fact FROM c WHERE c.userId = @userId ORDER BY VectorDistance(c.embedding, @queryVector)` on the memories container."
        fr: "Récupérer les faits avec `SELECT TOP 5 c.fact FROM c WHERE c.userId = @userId ORDER BY VectorDistance(c.embedding, @queryVector)` sur le conteneur memories."
    - id: d
      text:
        en: "Retrieve the facts with `SELECT TOP 5 c.fact FROM c WHERE c.threadId = @threadId ORDER BY VectorDistance(c.embedding, @queryVector)` on the memories container."
        fr: "Récupérer les faits avec `SELECT TOP 5 c.fact FROM c WHERE c.threadId = @threadId ORDER BY VectorDistance(c.embedding, @queryVector)` sur le conteneur memories."
    - id: e
      text:
        en: "Retrieve the facts with `SELECT TOP 5 c.fact FROM c WHERE c.userId = @userId AND FullTextContainsAny(c.fact, @keywords) ORDER BY c._ts DESC` on the memories container."
        fr: "Récupérer les faits avec `SELECT TOP 5 c.fact FROM c WHERE c.userId = @userId AND FullTextContainsAny(c.fact, @keywords) ORDER BY c._ts DESC` sur le conteneur memories."
answer: { optionIds: [a, c] }
explanation:
  correct:
    en: |
      Long-term memory persists across threads, so each fact is stored as its own item in memories, which has no default time to live, so the fact never expires. Because `/userId` is the partition key, the filter on `c.userId` scopes the search to one researcher's logical partition, and ORDER BY VectorDistance with TOP returns the facts that are closest in meaning to the new question, from any of the researcher's threads.
    fr: |
      La mémoire à long terme persiste d'un fil à l'autre : chaque fait est donc stocké comme un élément distinct dans memories, qui n'a pas de durée de vie par défaut, si bien que le fait n'expire jamais. Comme `/userId` est la clé de partition, le filtre sur `c.userId` limite la recherche à la partition logique d'un seul chercheur, et ORDER BY VectorDistance avec TOP renvoie les faits les plus proches par le sens de la nouvelle question, quel que soit le fil du chercheur.
  options:
    b: { en: "The turns container expires its items after 30 days, and its partitions are per thread, so the facts would be lost and invisible from the researcher's other threads.", fr: "Le conteneur turns fait expirer ses éléments au bout de 30 jours, et ses partitions sont par fil : les faits seraient perdus et invisibles depuis les autres fils du chercheur." }
    d: { en: "Filtering on the current thread hides the facts extracted from the researcher's other threads.", fr: "Filtrer sur le fil en cours masque les faits extraits des autres fils du chercheur." }
    e: { en: "A keyword match ordered by date retrieves facts by words and recency, not by meaning.", fr: "Une correspondance par mots clés triée par date récupère les faits selon les mots et la récence, pas selon le sens." }
references:
  - title: Agent memories in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
  - title: Vector search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
