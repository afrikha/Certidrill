id: dp420-cs3b-text-recall
objective: "3.1.6"
type: single
caseStudy: dp420-cs3b-lucerne-publishing
difficulty: 3
status: draft
stem:
  en: |
    Scholar retrieves text chunks with the following query, where `@tenantId` identifies the university of the researcher and `@q` contains the embedding of the question:

    ```sql
    SELECT TOP 10 c.title, c.chunkText
    FROM c
    WHERE c.type = 'chunk' AND c.tenantId = @tenantId
    ORDER BY VectorDistance(c.textEmbedding, @q)
    ```

    You need to modify the query to meet the retrieval requirement for text vector searches.

    What should you do?
  fr: |
    Scholar récupère les segments de texte avec la requête suivante, où `@tenantId` identifie l'université du chercheur et `@q` contient l'incorporation (embedding) de la question :

    ```sql
    SELECT TOP 10 c.title, c.chunkText
    FROM c
    WHERE c.type = 'chunk' AND c.tenantId = @tenantId
    ORDER BY VectorDistance(c.textEmbedding, @q)
    ```

    Vous devez modifier la requête pour satisfaire l'exigence de recherche relative aux recherches vectorielles de texte.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Replace the ORDER BY expression with `VectorDistance(c.textEmbedding, @q, true)`.", fr: "Remplacer l'expression ORDER BY par `VectorDistance(c.textEmbedding, @q, true)`." }
    - id: b
      text: { en: "Replace the ORDER BY expression with `VectorDistance(c.textEmbedding, @q, false, {searchListSizeMultiplier: 10})`.", fr: "Remplacer l'expression ORDER BY par `VectorDistance(c.textEmbedding, @q, false, {searchListSizeMultiplier: 10})`." }
    - id: c
      text: { en: "Replace the ORDER BY expression with `VectorDistance(c.textEmbedding, @q, false, {filterPriority: 0.0})`.", fr: "Remplacer l'expression ORDER BY par `VectorDistance(c.textEmbedding, @q, false, {filterPriority: 0.0})`." }
    - id: d
      text: { en: "Replace the ORDER BY expression with `VectorDistance(c.textEmbedding, @q, false, {distanceFunction: 'Euclidean'})`.", fr: "Remplacer l'expression ORDER BY par `VectorDistance(c.textEmbedding, @q, false, {distanceFunction: 'Euclidean'})`." }
answer: { optionId: b }
explanation:
  correct:
    en: "`searchListSizeMultiplier` enlarges the DiskANN search list, which can increase recall at the expense of latency and RUs, the trade-off that Lucerne accepts. The `false` argument keeps using the diskANN index that is already defined on `/textEmbedding`, and the change is made in the query, so the indexing policy does not change."
    fr: "`searchListSizeMultiplier` agrandit la liste de recherche de DiskANN, ce qui peut augmenter le rappel au prix de la latence et des RU, compromis que Lucerne accepte. L'argument `false` continue d'utiliser l'index diskANN déjà défini sur `/textEmbedding`, et la modification porte sur la requête : la stratégie d'indexation ne change pas."
  options:
    a:
      en: "`true` forces a brute-force calculation that ignores the vector index. The searches would no longer use the diskANN index, which the requirement forbids, and over millions of vectors a brute-force calculation is far more expensive."
      fr: "`true` force un calcul par force brute qui ignore l'index vectoriel. Les recherches n'utiliseraient plus l'index diskANN, ce que l'exigence interdit, et un calcul par force brute sur des millions de vecteurs est bien plus coûteux."
    c:
      en: "`filterPriority` weights the WHERE filter against the vector search in DiskANN; it does not enlarge the candidate list that determines recall."
      fr: "`filterPriority` pondère le filtre WHERE par rapport à la recherche vectorielle dans DiskANN ; il n'agrandit pas la liste de candidats qui détermine le rappel."
    d:
      en: "The text vectors are defined and indexed for cosine similarity; overriding the distance function changes the ranking instead of improving recall."
      fr: "Les vecteurs de texte sont définis et indexés pour la similarité cosinus ; remplacer la fonction de distance modifie le classement au lieu d'améliorer le rappel."
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
