id: dp420-3a-vsearch-top-n
objective: "3.1.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware's recommendation service runs the following query on an Azure Cosmos DB for NoSQL container that has a diskANN index on `/embedding`:

    ```sql
    SELECT c.id, c.title
    FROM c
    ORDER BY VectorDistance(c.embedding, @v)
    ```

    The service displays only the first 10 results. The query has a high RU charge and a high latency.

    You need to reduce the RU charge and the latency of the query.

    What should you do?
  fr: |
    Le service de recommandations de Litware exécute la requête suivante sur un conteneur Azure Cosmos DB for NoSQL doté d'un index diskANN sur `/embedding` :

    ```sql
    SELECT c.id, c.title
    FROM c
    ORDER BY VectorDistance(c.embedding, @v)
    ```

    Le service n'affiche que les 10 premiers résultats. La requête a un coût en RU et une latence élevés.

    Vous devez réduire le coût en RU et la latence de la requête.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add c.embedding to the SELECT list.", fr: "Ajouter c.embedding à la liste SELECT." }
    - id: b
      text: { en: "Pass true as the third argument of VectorDistance.", fr: "Passer true comme troisième argument de VectorDistance." }
    - id: c
      text: { en: "Add {\"searchListSizeMultiplier\": 20} as the options of VectorDistance.", fr: "Ajouter {\"searchListSizeMultiplier\": 20} comme options de VectorDistance." }
    - id: d
      text: { en: "Add TOP 10 to the SELECT clause.", fr: "Ajouter TOP 10 à la clause SELECT." }
answer: { optionId: d }
explanation:
  correct:
    en: "Learn says to always use a TOP N clause in a vector search query. Without it, the vector search tries to return many more results, so the query costs more RUs and has a higher latency than necessary."
    fr: "Learn indique de toujours utiliser une clause TOP N dans une requête de recherche vectorielle. Sans elle, la recherche vectorielle tente de renvoyer beaucoup plus de résultats : la requête coûte plus de RU et a une latence plus élevée que nécessaire."
  options:
    a: { en: "Projecting the embedding returns more data without limiting the number of results.", fr: "Projeter l'incorporation renvoie plus de données sans limiter le nombre de résultats." }
    b: { en: "true forces a brute-force search instead of using the diskANN index.", fr: "true impose une recherche en force brute au lieu d'utiliser l'index diskANN." }
    c: { en: "A higher searchListSizeMultiplier can improve recall but increases latency and RUs.", fr: "Un searchListSizeMultiplier plus élevé peut améliorer le rappel, mais augmente la latence et les RU." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
