id: dp420-3c-global-reads-mirror
objective: "3.3.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys is designing the data store of a game profile service. Players in North America, Europe and Asia must read their profiles from a nearby Azure region. All writes come from a single back end in East US.

    The analytics team must query the profiles in Microsoft Fabric in near real time, without building ETL pipelines. The solution must minimize development effort.

    What should you recommend?
  fr: |
    Tailspin Toys conçoit le magasin de données d'un service de profils de joueurs. Les joueurs d'Amérique du Nord, d'Europe et d'Asie doivent lire leur profil depuis une région Azure proche. Toutes les écritures proviennent d'un seul back-end situé dans la région East US.

    L'équipe d'analytique doit interroger les profils dans Microsoft Fabric en temps quasi réel, sans créer de pipelines ETL. La solution doit réduire au minimum l'effort de développement.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "A Cosmos DB database in Fabric, in a workspace whose capacity is in a region with availability zones", fr: "Une base de données Cosmos DB dans Fabric, dans un espace de travail dont la capacité se trouve dans une région avec zones de disponibilité" } }
    - { id: b, text: { en: "An Azure Cosmos DB account with multi-region writes in three regions, mirrored into Fabric", fr: "Un compte Azure Cosmos DB avec écritures multirégions dans trois régions, mis en miroir dans Fabric" } }
    - { id: c, text: { en: "An Azure Cosmos DB account with one write region and two read regions, mirrored into Fabric", fr: "Un compte Azure Cosmos DB avec une région d'écriture et deux régions de lecture, mis en miroir dans Fabric" } }
    - { id: d, text: { en: "Three Cosmos DB databases in Fabric, in three regional workspaces kept in sync by the change feed", fr: "Trois bases de données Cosmos DB dans Fabric, dans trois espaces de travail régionaux synchronisés par le flux de modification" } }
answer: { optionId: c }
explanation:
  correct:
    en: "Global reads need Azure Cosmos DB, which replicates an account to several regions; Cosmos DB in Fabric is deployed in the single region of its workspace capacity. Mirroring supports an account with one write region and read regions (it reads from the write region), and it replicates into OneLake without ETL."
    fr: "Des lectures mondiales exigent Azure Cosmos DB, qui réplique un compte dans plusieurs régions ; Cosmos DB dans Fabric est déployé dans la seule région de la capacité de son espace de travail. La mise en miroir prend en charge un compte avec une région d'écriture et des régions de lecture (elle lit depuis la région d'écriture), et elle réplique dans OneLake sans ETL."
  options:
    a:
      en: "Availability zones protect against a datacenter failure inside one region; players in the other continents would still read from a distant region."
      fr: "Les zones de disponibilité protègent contre la panne d'un centre de données dans une région ; les joueurs des autres continents liraient toujours depuis une région lointaine."
    b:
      en: "Mirroring doesn't support accounts with multiple write regions, and the scenario needs only one write region."
      fr: "La mise en miroir ne prend pas en charge les comptes avec plusieurs régions d'écriture, et le scénario n'a besoin que d'une région d'écriture."
    d:
      en: "Synchronizing three databases with custom change feed code requires significant development and conflict handling, which Azure Cosmos DB global distribution provides natively."
      fr: "Synchroniser trois bases de données avec du code de flux de modification personnalisé demande un développement important et une gestion des conflits, que la distribution mondiale d'Azure Cosmos DB fournit nativement."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
  - title: Frequently asked questions for Cosmos DB in Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq
