id: dp420-3c-fabric-spark-auth
objective: "3.3.4"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a Cosmos DB database named retail in Microsoft Fabric. A data engineer creates a Spark notebook in the same workspace. The notebook's environment runs Runtime 1.3 (Spark 3.5) and includes the Azure Cosmos DB Spark connector and the Fabric authentication library.

    The notebook must read the products container by using the identity of the notebook user.

    How should you complete the configuration? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso dispose d'une base de données Cosmos DB nommée retail dans Microsoft Fabric. Un ingénieur données crée un notebook Spark dans le même espace de travail. L'environnement du notebook utilise le Runtime 1.3 (Spark 3.5) et inclut le connecteur Spark Azure Cosmos DB et la bibliothèque d'authentification Fabric.

    Le notebook doit lire le conteneur products avec l'identité de l'utilisateur du notebook.

    Comment devez-vous compléter la configuration ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    config = {
        "spark.cosmos.accountEndpoint": FABRIC_ENDPOINT,
        "spark.cosmos.database": "retail",
        "spark.cosmos.container": "products",
        "spark.cosmos.accountDataResolverServiceName": "[[resolver]]",
        "spark.cosmos.auth.type": "[[authType]]",
        "[[connSetting]]": "true",
        "spark.cosmos.auth.aad.audience": "https://cosmos.azure.com/"
    }

    products = (spark.read.format("cosmos.oltp").options(**config)
        .option("spark.cosmos.read.inferSchema.enabled", "true")
        .load())
  slots:
    - id: resolver
      options:
        - { id: fabric, text: com.azure.cosmos.spark.fabric.FabricAccountDataResolver }
        - { id: catalog, text: com.azure.cosmos.spark.CosmosCatalog }
        - { id: delta, text: org.apache.spark.sql.delta.catalog.DeltaCatalog }
    - id: authType
      options:
        - { id: token, text: AccessToken }
        - { id: masterkey, text: MasterKey }
        - { id: mi, text: ManagedIdentity }
        - { id: sp, text: ServicePrincipal }
    - id: connSetting
      options:
        - { id: gateway, text: spark.cosmos.useGatewayMode }
        - { id: bulk, text: spark.cosmos.write.bulk.enabled }
        - { id: sysprops, text: spark.cosmos.read.inferSchema.includeSystemProperties }
answer:
  values: { resolver: fabric, authType: token, connSetting: gateway }
explanation:
  correct:
    en: "Cosmos DB in Fabric accepts only Microsoft Entra ID, so the connector uses `FabricAccountDataResolver` from the Fabric authentication library with the `AccessToken` authentication type, which passes the token of the user who runs the notebook, with the Cosmos DB audience. Cosmos DB in Fabric supports only gateway mode, so `spark.cosmos.useGatewayMode` must be `true`."
    fr: "Cosmos DB dans Fabric n'accepte que Microsoft Entra ID : le connecteur utilise donc `FabricAccountDataResolver` de la bibliothèque d'authentification Fabric avec le type d'authentification `AccessToken`, qui transmet le jeton de l'utilisateur qui exécute le notebook, avec l'audience Cosmos DB. Cosmos DB dans Fabric ne prend en charge que le mode passerelle : `spark.cosmos.useGatewayMode` doit donc valoir `true`."
  options:
    catalog:
      en: "`CosmosCatalog` is the class registered as a Spark SQL catalog, not an account data resolver."
      fr: "`CosmosCatalog` est la classe enregistrée comme catalogue Spark SQL, pas un résolveur de données de compte."
    masterkey:
      en: "`MasterKey` authenticates with an account key, and Cosmos DB in Fabric has no account keys."
      fr: "`MasterKey` s'authentifie avec une clé de compte, et Cosmos DB dans Fabric n'a pas de clés de compte."
    sp:
      en: "`ServicePrincipal` requires an application registration and its secret or certificate, not the identity of the notebook user."
      fr: "`ServicePrincipal` exige une inscription d'application et son secret ou certificat, pas l'identité de l'utilisateur du notebook."
    bulk:
      en: "Bulk writes are already enabled by default and don't change how the client connects."
      fr: "Les écritures en bloc sont déjà activées par défaut et ne changent pas la façon dont le client se connecte."
references:
  - title: Work with Cosmos DB in Microsoft Fabric using the Cosmos DB Spark Connector
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/how-to-use-spark-notebooks
  - title: Frequently asked questions for Cosmos DB in Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq
