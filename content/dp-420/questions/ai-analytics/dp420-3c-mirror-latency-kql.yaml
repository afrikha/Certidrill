id: dp420-3c-mirror-latency-kql
objective: "3.3.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Contoso mirrors an Azure Cosmos DB for NoSQL database into a Microsoft Fabric mirrored database item named sales-mirror. The operations team writes a runbook to check the replication of the mirrored tables every morning.

    How should you complete the runbook? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso met en miroir une base de données Azure Cosmos DB for NoSQL dans un élément de base de données en miroir Microsoft Fabric nommé sales-mirror. L'équipe d'exploitation rédige un runbook pour vérifier chaque matin la réplication des tables en miroir.

    Comment devez-vous compléter le runbook ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      To find when the orders table was last refreshed from the source, read the [[refresh]] column in Monitor replication.

      To get the cumulative number of inserts, updates and deletes applied to orders, read the [[count]] column.

      If the database status is [[paused]], the Fabric capacity was paused and then resumed.

      To read the status of the database and of each table from a script, call [[api]].
    fr: |
      Pour savoir quand la table orders a été actualisée pour la dernière fois depuis la source, lisez la colonne [[refresh]] dans Monitor replication.

      Pour obtenir le nombre cumulé d'insertions, de mises à jour et de suppressions appliquées à orders, lisez la colonne [[count]].

      Si l'état de la base de données est [[paused]], la capacité Fabric a été suspendue puis reprise.

      Pour lire l'état de la base de données et de chaque table depuis un script, appelez [[api]].
  slots:
    - id: refresh
      options:
        - { id: lastcompleted, text: Last completed }
        - { id: rowsrep, text: Rows replicated }
        - { id: name, text: Name }
        - { id: tablestatus, text: Table level status }
    - id: count
      options:
        - { id: lastcompleted, text: Last completed }
        - { id: rowsrep, text: Rows replicated }
        - { id: name, text: Name }
        - { id: tablestatus, text: Table level status }
    - id: paused
      options:
        - { id: stopped, text: Stopped }
        - { id: failed, text: Failed }
        - { id: paused, text: Paused }
        - { id: warning, text: Running with warning }
    - id: api
      options:
        - { id: fabricapi, text: { en: "the Microsoft Fabric mirroring REST API", fr: "l'API REST de mise en miroir de Microsoft Fabric" } }
        - { id: armapi, text: { en: "the Azure Cosmos DB resource provider REST API", fr: "l'API REST du fournisseur de ressources Azure Cosmos DB" } }
        - { id: cdbcontrol, text: { en: "a KQL query on CDBControlPlaneRequests", fr: "une requête KQL sur CDBControlPlaneRequests" } }
answer:
  values: { refresh: lastcompleted, count: rowsrep, paused: paused, api: fabricapi }
explanation:
  correct:
    en: "In Monitor replication, Last completed is the last time the mirrored table was refreshed from the source, and Rows replicated is the cumulative count of inserts, updates and deletes applied to the target table. The database status Paused appears when the Fabric capacity is paused and resumed. The same database and table statuses are available programmatically through the Fabric mirroring REST API or SDK."
    fr: "Dans Monitor replication, Last completed est la dernière actualisation de la table en miroir depuis la source, et Rows replicated est le nombre cumulé d'insertions, de mises à jour et de suppressions appliquées à la table cible. L'état Paused de la base de données apparaît quand la capacité Fabric est suspendue puis reprise. Les mêmes états de base de données et de table sont disponibles par programmation avec l'API REST ou le SDK de mise en miroir de Fabric."
  options:
    stopped:
      en: "Stopped means that replication was stopped, for example with Stop replication; it isn't tied to the capacity."
      fr: "Stopped signifie que la réplication a été arrêtée, par exemple avec Stop replication ; cet état n'est pas lié à la capacité."
    armapi:
      en: "The Azure Cosmos DB resource provider manages the source account; it doesn't report the state of a Fabric mirror."
      fr: "Le fournisseur de ressources Azure Cosmos DB gère le compte source ; il ne rapporte pas l'état d'un miroir Fabric."
    cdbcontrol:
      en: "CDBControlPlaneRequests logs control plane operations on the Azure Cosmos DB account, not mirroring status in Fabric."
      fr: "CDBControlPlaneRequests journalise les opérations du plan de contrôle du compte Azure Cosmos DB, pas l'état de la mise en miroir dans Fabric."
references:
  - title: Monitor Fabric mirrored database replication
    url: https://learn.microsoft.com/en-us/fabric/mirroring/monitor
