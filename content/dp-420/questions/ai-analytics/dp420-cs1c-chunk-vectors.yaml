id: dp420-cs1c-chunk-vectors
objective: "3.1.2"
type: dropdown
caseStudy: dp420-cs1c-trey-research
difficulty: 3
status: draft
stem:
  en: |
    You need to create the chunks container to meet the requirements for the chunks.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer le conteneur chunks pour satisfaire les exigences relatives aux segments.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    vector_embedding_policy = {
        "vectorEmbeddings": [
            {"path": "/embedding", "dataType": "[[dtype]]",
             "distanceFunction": "cosine", "dimensions": 3072}
        ]
    }
    indexing_policy = {
        "indexingMode": "consistent",
        "includedPaths": [{"path": "/*"}],
        "excludedPaths": [{"path": "/_etag/?"}, {"path": "[[excluded]]"}],
        "vectorIndexes": [
            {"path": "/embedding", "type": "diskANN", "quantizerType": "[[quantizer]]"}
        ],
    }
    chunks = database.create_container_if_not_exists(
        id="chunks",
        partition_key=PartitionKey(path="/reportId"),
        indexing_policy=indexing_policy,
        vector_embedding_policy=vector_embedding_policy,
    )
  slots:
    - id: dtype
      options:
        - { id: float32, text: float32 }
        - { id: float16, text: float16 }
        - { id: int8, text: int8 }
    - id: excluded
      options:
        - { id: question, text: "/embedding/?" }
        - { id: star, text: /embedding/* }
        - { id: policy, text: /vectorEmbeddings/* }
    - id: quantizer
      options:
        - { id: product, text: product }
        - { id: spherical, text: spherical }
answer:
  values: { dtype: float16, excluded: star, quantizer: spherical }
explanation:
  correct:
    en: "The `float16` data type halves the storage of the vectors compared with `float32`, with a possible small loss of accuracy. Excluding `/embedding/*` removes every element of the vector array from the range index, which is the documented pattern for vector paths. For DiskANN and quantizedFlat indexes, the `spherical` quantizer can provide higher and more stable recall with very high-dimensional embeddings, whereas `product` is the balanced default."
    fr: "Le type de données `float16` divise par deux le stockage des vecteurs par rapport à `float32`, avec une légère perte de précision possible. Exclure `/embedding/*` retire tous les éléments du tableau du vecteur de l'index de plage, ce qui est le modèle documenté pour les chemins de vecteurs. Pour les index DiskANN et quantizedFlat, le quantificateur `spherical` peut offrir un rappel plus élevé et plus stable avec des incorporations de très grande dimension, alors que `product` est la valeur par défaut équilibrée."
  options:
    float32: { en: "float32 is the reference size that the requirement asks to halve.", fr: "float32 est la taille de référence que l'exigence demande de diviser par deux." }
    int8: { en: "int8 stores each dimension as an 8-bit integer, a quarter of the size of float32, whereas the requirement asks for half.", fr: "int8 stocke chaque dimension sous forme d'entier 8 bits, soit le quart de la taille de float32, alors que l'exigence demande la moitié." }
    question: { en: "/? matches only a scalar value at the path; the elements of the vector array would still be range-indexed.", fr: "/? ne correspond qu'à une valeur scalaire au chemin ; les éléments du tableau du vecteur seraient toujours indexés en plage." }
    policy: { en: "vectorEmbeddings is the name of the section of the vector policy; the items store the vector in the embedding property.", fr: "vectorEmbeddings est le nom de la section de la stratégie vectorielle ; les éléments stockent le vecteur dans la propriété embedding." }
    product: { en: "product is the default, balanced quantizer; spherical is the option documented for higher, more stable recall with very high-dimensional embeddings.", fr: "product est le quantificateur par défaut, équilibré ; spherical est l'option documentée pour un rappel plus élevé et plus stable avec des incorporations de très grande dimension." }
references:
  - title: Vector search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
  - title: Index and query vectors in Azure Cosmos DB for NoSQL in Python
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-python-vector-index-query
