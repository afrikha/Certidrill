id: dp420-3a-vpart-fanout
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind stores product reviews in an Azure Cosmos DB for NoSQL container whose partition key is `/customerId`. The container spans 12 physical partitions and has a diskANN index without a shard key on `/embedding`. A .NET application runs the following query without specifying a partition key:

    ```sql
    SELECT TOP 5 c.id, c.text
    FROM c
    ORDER BY VectorDistance(c.embedding, @queryVector)
    ```

    How does Azure Cosmos DB run the query?
  fr: |
    Northwind stocke des avis sur les produits dans un conteneur Azure Cosmos DB for NoSQL dont la clé de partition est `/customerId`. Le conteneur s'étend sur 12 partitions physiques et possède un index diskANN sans clé de shard sur `/embedding`. Une application .NET exécute la requête suivante sans spécifier de clé de partition :

    ```sql
    SELECT TOP 5 c.id, c.text
    FROM c
    ORDER BY VectorDistance(c.embedding, @queryVector)
    ```

    Comment Azure Cosmos DB exécute-t-il la requête ?
body:
  options:
    - id: a
      text: { en: "It searches the DiskANN index of each physical partition and merges the results into the top 5.", fr: "Il interroge l'index DiskANN de chaque partition physique et fusionne les résultats pour obtenir les 5 meilleurs." }
    - id: b
      text: { en: "It searches one global DiskANN index that covers all the physical partitions of the container.", fr: "Il interroge un index DiskANN global qui couvre toutes les partitions physiques du conteneur." }
    - id: c
      text: { en: "It rejects the query, because a vector query must target a single logical partition.", fr: "Il rejette la requête, car une requête vectorielle doit cibler une seule partition logique." }
    - id: d
      text: { en: "It ignores the index and scans every item, because the index has no shard key.", fr: "Il ignore l'index et analyse chaque élément, car l'index n'a pas de clé de shard." }
answer: { optionId: a }
explanation:
  correct:
    en: "Without a shard key, the container has one DiskANN index per physical partition. A query without a partition key filter is a cross-partition query: it runs against each partition's index, and the results are merged to return the 5 most similar items."
    fr: "Sans clé de shard, le conteneur possède un index DiskANN par partition physique. Une requête sans filtre sur la clé de partition est une requête inter-partitions : elle s'exécute sur l'index de chaque partition, et les résultats sont fusionnés pour renvoyer les 5 éléments les plus similaires."
  options:
    b: { en: "DiskANN indexes are built per physical partition, not as one index for the whole container.", fr: "Les index DiskANN sont construits par partition physique, pas sous la forme d'un index unique pour tout le conteneur." }
    c: { en: "Vector queries can run across partitions; a partition key filter only makes them cheaper.", fr: "Les requêtes vectorielles peuvent s'exécuter sur plusieurs partitions ; un filtre sur la clé de partition les rend seulement moins coûteuses." }
    d: { en: "A shard key is optional; without it, the regular per-partition DiskANN index is used.", fr: "La clé de shard est facultative ; sans elle, l'index DiskANN habituel par partition est utilisé." }
references:
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
