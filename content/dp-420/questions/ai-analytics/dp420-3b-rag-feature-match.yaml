id: dp420-3b-rag-feature-match
objective: "3.1.7"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Proseware is building a RAG help desk on Azure Cosmos DB for NoSQL. The knowledge base container has a vector index on `/embedding` and a full-text index on `/text`.

    You need to choose the Azure Cosmos DB capability that meets each requirement.

    Which capability should you use for each requirement? To answer, drag the appropriate capabilities to the correct requirements. Each capability may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware crée un support technique RAG sur Azure Cosmos DB for NoSQL. Le conteneur de la base de connaissances a un index vectoriel sur `/embedding` et un index de texte intégral sur `/text`.

    Vous devez choisir la fonctionnalité Azure Cosmos DB qui répond à chaque exigence.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: vector, text: { en: "Vector search (ORDER BY VectorDistance)", fr: "Recherche vectorielle (ORDER BY VectorDistance)" } }
    - { id: hybrid, text: { en: "Hybrid search (ORDER BY RANK RRF)", fr: "Recherche hybride (ORDER BY RANK RRF)" } }
    - { id: cache, text: { en: "Semantic cache", fr: "Cache sémantique" } }
    - { id: feed, text: { en: "Change feed", fr: "Flux de modification" } }
    - { id: ttl, text: { en: "Time to live (TTL)", fr: "Durée de vie (TTL)" } }
  targets:
    - id: t1
      text: { en: "A single search box receives both exact error codes, such as 0x80070005, and questions in the users' own words.", fr: "Une même zone de recherche reçoit à la fois des codes d'erreur exacts, comme 0x80070005, et des questions formulées avec les mots des utilisateurs." }
    - id: t2
      text: { en: "Avoid calling the chat model again when a question similar to an answered one is asked in the same context.", fr: "Éviter d'appeler de nouveau le modèle de conversation quand une question similaire à une question déjà traitée est posée dans le même contexte." }
    - id: t3
      text: { en: "Regenerate the embedding of an article shortly after its text is edited.", fr: "Régénérer l'incorporation d'un article peu après la modification de son texte." }
    - id: t4
      text: { en: "Find articles about \"device does not start\" when the user writes \"laptop won't power on\".", fr: "Trouver des articles sur « device does not start » quand l'utilisateur écrit « laptop won't power on »." }
answer:
  mapping: { t1: hybrid, t2: cache, t3: feed, t4: vector }
explanation:
  correct:
    en: "Hybrid search fuses BM25 full-text ranking, which matches exact codes, with vector ranking, which matches meaning. A semantic cache stores question embeddings and answers and returns a cached answer to a similar question. The change feed reports each created or updated item, so a processor can re-embed edited articles. Vector search finds paraphrases that share no words with the article."
    fr: "La recherche hybride fusionne le classement BM25 en texte intégral, qui trouve les codes exacts, et le classement vectoriel, qui trouve le sens. Un cache sémantique stocke les incorporations des questions et les réponses, et renvoie une réponse en cache à une question similaire. Le flux de modification signale chaque élément créé ou mis à jour, si bien qu'un processeur peut recalculer l'incorporation des articles modifiés. La recherche vectorielle trouve des paraphrases qui n'ont aucun mot en commun avec l'article."
  options:
    ttl:
      en: "TTL expires items, for example old cache entries, but meets none of these requirements on its own."
      fr: "La TTL fait expirer des éléments, par exemple d'anciennes entrées du cache, mais ne répond seule à aucune de ces exigences."
references:
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
  - title: Semantic Cache for Large Language Models - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/semantic-cache
