id: dp420-3a-vsearch-brute-force
objective: "3.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL container with a diskANN index on `/embedding`. Adatum wants to measure the recall of the index on 200 test questions. For each question, the test must compare the index results with the exact nearest neighbors computed in the same container.

    You need to write the ORDER BY expression of the query that returns the exact nearest neighbors.

    Which expression should you use?
  fr: |
    Adatum dispose d'un conteneur Azure Cosmos DB for NoSQL doté d'un index diskANN sur `/embedding`. Adatum veut mesurer le rappel de l'index sur 200 questions de test. Pour chaque question, le test doit comparer les résultats de l'index aux plus proches voisins exacts calculés dans le même conteneur.

    Vous devez écrire l'expression ORDER BY de la requête qui renvoie les plus proches voisins exacts.

    Quelle expression devez-vous utiliser ?
body:
  options:
    - { id: a, text: "ORDER BY VectorDistance(c.embedding, @v, false)" }
    - { id: b, text: "ORDER BY VectorDistance(c.embedding, @v, false, {\"searchListSizeMultiplier\": 20})" }
    - { id: c, text: "ORDER BY VectorDistance(c.embedding, @v, true)" }
    - { id: d, text: "ORDER BY VectorDistance(c.embedding, @v, false, {\"distanceFunction\": \"Euclidean\"})" }
answer: { optionId: c }
explanation:
  correct:
    en: "The third argument of VectorDistance sets how the score is computed for ORDER BY: true uses brute force, which compares the query vector with every vector and gives exact results; false, the default, uses the vector index defined on the property."
    fr: "Le troisième argument de VectorDistance définit le calcul du score pour ORDER BY : true utilise la force brute, qui compare le vecteur de la requête à chaque vecteur et donne des résultats exacts ; false, la valeur par défaut, utilise l'index vectoriel défini sur la propriété."
  options:
    a: { en: "false uses the diskANN index, whose results are approximate.", fr: "false utilise l'index diskANN, dont les résultats sont approximatifs." }
    b: { en: "A larger search list can improve recall, but the search still uses the approximate diskANN index.", fr: "Une liste de recherche plus grande peut améliorer le rappel, mais la recherche utilise toujours l'index diskANN approximatif." }
    d: { en: "Overriding the distance function changes the similarity metric, so the results can't serve as a baseline for the index.", fr: "Remplacer la fonction de distance change la mesure de similarité : les résultats ne peuvent pas servir de référence pour l'index." }
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
