id: dp420-3c-analytics-tool-match
objective: "3.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys mirrors an Azure Cosmos DB for NoSQL database named retail into a Microsoft Fabric workspace. Several teams need to use the data.

    Which tool should each team use? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys met en miroir une base de données Azure Cosmos DB for NoSQL nommée retail dans un espace de travail Microsoft Fabric. Plusieurs équipes doivent utiliser les données.

    Quel outil chaque équipe doit-elle utiliser ? Pour répondre, faites glisser les outils appropriés vers les exigences correspondantes. Chaque outil peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: sql, text: { en: "SQL analytics endpoint of the mirrored database", fr: "Point de terminaison d'analytique SQL de la base de données en miroir" } }
    - { id: spark, text: { en: "Lakehouse shortcut and Spark notebook", fr: "Raccourci de lakehouse et notebook Spark" } }
    - { id: pbi, text: { en: "Power BI semantic model in Direct Lake mode", fr: "Modèle sémantique Power BI en mode Direct Lake" } }
    - { id: source, text: { en: "Source database view of the mirrored database", fr: "Vue Source database de la base de données en miroir" } }
    - { id: kql, text: { en: "KQL database of workspace monitoring", fr: "Base de données KQL de la surveillance de l'espace de travail" } }
  targets:
    - id: t1
      text: { en: "Regional managers: a T-SQL view on which row-level security shows each manager only their region", fr: "Responsables régionaux : une vue T-SQL sur laquelle la sécurité au niveau des lignes ne montre à chaque responsable que sa région" }
    - id: t2
      text: { en: "Data scientists: train a churn model in PySpark on the full order history", fr: "Scientifiques des données : entraîner un modèle d'attrition en PySpark sur tout l'historique des commandes" }
    - id: t3
      text: { en: "Executives: an interactive sales report that reads the mirrored tables without importing them", fr: "Dirigeants : un rapport de ventes interactif qui lit les tables en miroir sans les importer" }
    - id: t4
      text: { en: "Support engineers: check the current content of one item that a customer updated seconds ago", fr: "Ingénieurs du support : vérifier le contenu actuel d'un élément qu'un client a modifié il y a quelques secondes" }
answer:
  mapping: { t1: sql, t2: spark, t3: pbi, t4: source }
explanation:
  correct:
    en: "The SQL analytics endpoint supports T-SQL views with row-level security, column-level security and dynamic data masking. A lakehouse shortcut exposes the mirrored Delta tables to Spark notebooks for data engineering and machine learning. A Power BI semantic model can use Direct Lake mode on the mirrored tables. The Source database view reads the live account, so it reflects changes immediately, at the cost of RUs."
    fr: "Le point de terminaison d'analytique SQL prend en charge les vues T-SQL avec sécurité au niveau des lignes, sécurité au niveau des colonnes et masquage dynamique des données. Un raccourci de lakehouse expose les tables Delta en miroir aux notebooks Spark pour l'ingénierie des données et l'apprentissage automatique. Un modèle sémantique Power BI peut utiliser le mode Direct Lake sur les tables en miroir. La vue Source database lit le compte en direct : elle reflète donc les modifications immédiatement, au prix de RU."
  options:
    kql:
      en: "The monitoring KQL database holds the mirroring logs, not the retail data."
      fr: "La base de données KQL de surveillance contient les journaux de mise en miroir, pas les données retail."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
  - title: "How to: Access mirrored Azure Cosmos DB data in Lakehouse and notebooks from Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-lakehouse-notebooks
