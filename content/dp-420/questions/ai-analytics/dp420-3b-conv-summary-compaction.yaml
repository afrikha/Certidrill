id: dp420-3b-conv-summary-compaction
objective: "3.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso's project-planning agent stores one item per turn in an Azure Cosmos DB for NoSQL container partitioned by `/threadId`. Some threads now exceed 400 turns. Sending every turn to the chat model exceeds the token budget of a request.

    The agent must still take into account the decisions made in the early turns of a thread. The cost of loading the context must stay low.

    What should you do?
  fr: |
    L'agent de planification de projets de Contoso stocke un élément par tour dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/threadId`. Certains threads dépassent désormais 400 tours. Envoyer tous les tours au modèle de conversation dépasse le budget de jetons d'une requête.

    L'agent doit toujours tenir compte des décisions prises dans les premiers tours d'un thread. Le coût du chargement du contexte doit rester faible.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Load only the latest 10 turns of the thread with a TOP 10 query.", fr: "Charger uniquement les 10 derniers tours du thread avec une requête TOP 10." }
    - id: b
      text: { en: "Every 20 turns, write a summary item for the thread in its partition, and load that summary with the latest turns.", fr: "Tous les 20 tours, écrire un élément de résumé du thread dans sa partition, et charger ce résumé avec les derniers tours." }
    - id: c
      text: { en: "Set a time to live of one hour on the turns so that old turns are removed.", fr: "Définir une durée de vie d'une heure sur les tours pour supprimer les anciens tours." }
    - id: d
      text: { en: "Merge the turns of each thread into one item that holds an array of messages.", fr: "Fusionner les tours de chaque thread dans un seul élément qui contient un tableau de messages." }
answer: { optionId: b }
explanation:
  correct:
    en: "A thread summary item condenses the topic, decisions and open issues of earlier turns. Loading it together with the latest turns keeps the context window small while preserving the early decisions, and both reads stay in the thread's partition."
    fr: "Un élément de résumé du thread condense le sujet, les décisions et les points ouverts des tours précédents. Le charger avec les derniers tours garde une fenêtre de contexte réduite tout en préservant les premières décisions, et les deux lectures restent dans la partition du thread."
  options:
    a:
      en: "The latest turns alone lose the decisions made at the start of the thread."
      fr: "Les derniers tours seuls perdent les décisions prises au début du thread."
    c:
      en: "Deleting turns after one hour discards the early decisions instead of keeping them."
      fr: "Supprimer les tours au bout d'une heure fait disparaître les premières décisions au lieu de les conserver."
    d:
      en: "A thread item that holds every message grows without bound, costs more RU at each append and still sends every turn to the model."
      fr: "Un élément de thread qui contient tous les messages grossit sans limite, coûte plus de RU à chaque ajout et envoie toujours tous les tours au modèle."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
  - title: Agent Memory Toolkit (Preview) - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-memory-toolkit
