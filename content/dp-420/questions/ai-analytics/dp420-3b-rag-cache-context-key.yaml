id: dp420-3b-rag-cache-context-key
objective: "3.1.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin Toys added a semantic cache in Azure Cosmos DB for NoSQL in front of its RAG assistant. Each cache item stores the embedding of the user's last prompt and the generated answer. A lookup embeds the new prompt and runs a vector query that returns a cached answer when the similarity score is above 0.95.

    Users report wrong answers to follow-up questions. For example, after asking about the largest Tailspin store, a user who asks "What is the second largest?" sometimes receives an answer about the second largest warehouse, cached for another user.

    You need to prevent these wrong answers while keeping the cache. What should you do?
  fr: |
    Tailspin Toys a ajouté un cache sémantique dans Azure Cosmos DB for NoSQL devant son assistant RAG. Chaque élément du cache stocke l'incorporation du dernier prompt de l'utilisateur et la réponse générée. Une recherche dans le cache incorpore le nouveau prompt et exécute une requête vectorielle qui renvoie une réponse en cache quand le score de similarité dépasse 0,95.

    Des utilisateurs signalent de mauvaises réponses aux questions de suivi. Par exemple, après une question sur le plus grand magasin Tailspin, un utilisateur qui demande « Quel est le deuxième plus grand ? » reçoit parfois une réponse sur le deuxième plus grand entrepôt, mise en cache pour un autre utilisateur.

    Vous devez empêcher ces mauvaises réponses tout en conservant le cache. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Raise the similarity threshold to 0.99 so that only near-identical prompts return a cached answer.", fr: "Relever le seuil de similarité à 0,99 pour que seuls des prompts quasi identiques renvoient une réponse en cache." }
    - id: b
      text: { en: "Embed the context window of the conversation together with the new prompt, and use that vector as the cache key.", fr: "Incorporer la fenêtre de contexte de la conversation avec le nouveau prompt, et utiliser ce vecteur comme clé du cache." }
    - id: c
      text: { en: "Set a time to live of one hour on the cache items so that answers expire sooner.", fr: "Définir une durée de vie d'une heure sur les éléments du cache pour que les réponses expirent plus tôt." }
    - id: d
      text: { en: "Store the prompt text instead of its embedding and look it up with an exact equality filter.", fr: "Stocker le texte du prompt au lieu de son incorporation et le rechercher avec un filtre d'égalité exacte." }
answer: { optionId: b }
explanation:
  correct:
    en: "Models are stateless, so the meaning of a follow-up question depends on the context window sent with it. A semantic cache must therefore be keyed on the vectorized context window plus the latest prompt; otherwise an identical follow-up from another conversation is a false hit."
    fr: "Les modèles sont sans état : le sens d'une question de suivi dépend de la fenêtre de contexte envoyée avec elle. Un cache sémantique doit donc avoir pour clé la fenêtre de contexte vectorisée plus le dernier prompt ; sinon, une question de suivi identique issue d'une autre conversation produit un faux succès."
  options:
    a:
      en: "The two follow-up prompts are identical, so they match at any threshold; a higher threshold only adds misses that fill the cache."
      fr: "Les deux questions de suivi sont identiques : elles correspondent quel que soit le seuil ; un seuil plus élevé ne fait qu'ajouter des échecs qui remplissent le cache."
    c:
      en: "A wrong answer can be returned within the hour; TTL bounds the cache size, not its correctness."
      fr: "Une mauvaise réponse peut être renvoyée pendant l'heure ; la TTL limite la taille du cache, pas sa justesse."
    d:
      en: "An exact match on the prompt text still matches the identical follow-up of another conversation, and it loses the benefit of semantic matching."
      fr: "Une correspondance exacte sur le texte du prompt correspond toujours à la question de suivi identique d'une autre conversation, et elle perd l'avantage de la correspondance sémantique."
references:
  - title: Semantic Cache for Large Language Models - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/semantic-cache
