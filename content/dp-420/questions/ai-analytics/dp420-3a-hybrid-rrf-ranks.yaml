id: dp420-3a-hybrid-rrf-ranks
objective: "3.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware is adding hybrid search to a product catalog in Azure Cosmos DB for NoSQL. A developer is concerned that BM25 scores from FullTextScore and cosine similarity scores from VectorDistance use very different scales.

    You need to explain how `RRF` builds the final order of the results in an `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))` query.

    What should you explain?
  fr: |
    Litware ajoute la recherche hybride à un catalogue de produits dans Azure Cosmos DB for NoSQL. Un développeur craint que les scores BM25 de FullTextScore et les scores de similarité cosinus de VectorDistance utilisent des échelles très différentes.

    Vous devez expliquer comment `RRF` construit l'ordre final des résultats d'une requête `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))`.

    Que devez-vous expliquer ?
body:
  options:
    - id: a
      text: { en: "RRF normalizes both scores to the 0 to 1 range and returns their average.", fr: "RRF normalise les deux scores dans la plage de 0 à 1 et renvoie leur moyenne." }
    - id: b
      text: { en: "RRF multiplies the BM25 score of each item by its similarity score.", fr: "RRF multiplie le score BM25 de chaque élément par son score de similarité." }
    - id: c
      text: { en: "RRF merges the rankings produced by each function into one unified ranking.", fr: "RRF fusionne les classements produits par chaque fonction en un classement unifié." }
    - id: d
      text: { en: "RRF keeps the vector order unless an item's BM25 score exceeds a threshold.", fr: "RRF conserve l'ordre vectoriel, sauf si le score BM25 d'un élément dépasse un seuil." }
answer: { optionId: c }
explanation:
  correct:
    en: "Reciprocal Rank Fusion is a rank aggregation method: it merges the rankings from several search algorithms into a single ranking. Because it combines positions in each ranking rather than raw values, the different scales of BM25 and similarity scores don't need to be reconciled."
    fr: "La fusion de rangs réciproques (Reciprocal Rank Fusion) est une méthode d'agrégation de classements : elle fusionne les classements de plusieurs algorithmes de recherche en un classement unique. Comme elle combine des positions dans chaque classement plutôt que des valeurs brutes, les échelles différentes des scores BM25 et de similarité n'ont pas à être rapprochées."
  options:
    a: { en: "RRF doesn't average normalized scores; it fuses the ranks of the items.", fr: "RRF ne fait pas la moyenne de scores normalisés ; il fusionne les rangs des éléments." }
    b: { en: "Multiplying raw scores would depend on their scales; RRF works on rankings.", fr: "Multiplier les scores bruts dépendrait de leurs échelles ; RRF travaille sur les classements." }
    d: { en: "RRF has no score threshold; every function contributes to the fused ranking, optionally with weights.", fr: "RRF n'a pas de seuil de score ; chaque fonction contribue au classement fusionné, éventuellement avec des poids." }
references:
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
