id: dp420-3a-hybrid-features
objective: "3.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to run hybrid search queries that use `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))` on a new Azure Cosmos DB for NoSQL account.

    Which two features must be enabled on the account? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'exécuter des requêtes de recherche hybride qui utilisent `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))` sur un nouveau compte Azure Cosmos DB for NoSQL.

    Quelles sont les deux fonctionnalités à activer sur le compte ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: Burst capacity }
    - { id: b, text: Full Text & Hybrid Search for NoSQL API }
    - { id: c, text: Azure Synapse Link }
    - { id: d, text: Vector Search for NoSQL API }
    - { id: e, text: { en: "Multi-region writes", fr: "Écritures multirégions" } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "RRF requires enrollment in the NoSQL full-text search feature, and hybrid search also requires enrollment in NoSQL vector search. In the portal, both are enabled from the Features page of the account; the container then needs a vector policy, a full-text policy, a vector index and a full-text index."
    fr: "RRF exige l'inscription à la fonctionnalité de recherche en texte intégral NoSQL, et la recherche hybride exige aussi l'inscription à la recherche vectorielle NoSQL. Dans le portail, les deux s'activent depuis la page Features du compte ; le conteneur a ensuite besoin d'une stratégie vectorielle, d'une stratégie de texte intégral, d'un index vectoriel et d'un index de texte intégral."
  options:
    a: { en: "Burst capacity lets partitions use accumulated idle throughput; it doesn't enable search functions.", fr: "La capacité de rafale permet aux partitions d'utiliser du débit inactif accumulé ; elle n'active pas de fonctions de recherche." }
    c: { en: "Azure Synapse Link replicates data to the analytical store; it isn't needed for hybrid search.", fr: "Azure Synapse Link réplique les données vers le magasin analytique ; il n'est pas nécessaire à la recherche hybride." }
    e: { en: "Multi-region writes relate to availability and write latency, not to search features.", fr: "Les écritures multirégions concernent la disponibilité et la latence d'écriture, pas les fonctionnalités de recherche." }
references:
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
