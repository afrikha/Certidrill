id: dp420-3a-hybrid-features
objective: "3.1.5"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Contoso plans to run hybrid search queries that use `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))` on a new Azure Cosmos DB for NoSQL account. The container will have a vector embedding policy, a vector index and a full-text policy on the searched text path.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit d'exécuter des requêtes de recherche hybride qui utilisent `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))` sur un nouveau compte Azure Cosmos DB for NoSQL. Le conteneur aura une stratégie d'incorporation vectorielle, un index vectoriel et une stratégie de texte intégral sur le chemin de texte recherché.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Enable burst capacity on the account.", fr: "Activer la capacité de rafale sur le compte." } }
    - { id: b, text: { en: "Enable the Full Text & Hybrid Search for NoSQL API feature on the account.", fr: "Activer la fonctionnalité Full Text & Hybrid Search for NoSQL API sur le compte." } }
    - { id: c, text: { en: "Enable Azure Synapse Link on the account.", fr: "Activer Azure Synapse Link sur le compte." } }
    - { id: d, text: { en: "Add a full-text index on the searched text path to the indexing policy.", fr: "Ajouter un index de texte intégral sur le chemin de texte recherché à la stratégie d'indexation." } }
    - { id: e, text: { en: "Enable multi-region writes on the account.", fr: "Activer les écritures multirégions sur le compte." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "RRF requires enrollment in the NoSQL full-text search feature, enabled from the Features page of the account, and it requires a full-text index on the path scored by FullTextScore. Vector indexing and search need no account step: they are on by default."
    fr: "RRF exige l'inscription à la fonctionnalité de recherche en texte intégral NoSQL, activée depuis la page Features du compte, et un index de texte intégral sur le chemin évalué par FullTextScore. L'indexation et la recherche vectorielles ne demandent aucune étape sur le compte : elles sont activées par défaut."
  options:
    a: { en: "Burst capacity lets partitions use accumulated idle throughput; it doesn't enable search functions.", fr: "La capacité de rafale permet aux partitions d'utiliser du débit inactif accumulé ; elle n'active pas de fonctions de recherche." }
    c: { en: "Azure Synapse Link replicates data to the analytical store; it isn't needed for hybrid search.", fr: "Azure Synapse Link réplique les données vers le magasin analytique ; il n'est pas nécessaire à la recherche hybride." }
    e: { en: "Multi-region writes relate to availability and write latency, not to search features.", fr: "Les écritures multirégions concernent la disponibilité et la latence d'écriture, pas les fonctionnalités de recherche." }
references:
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
