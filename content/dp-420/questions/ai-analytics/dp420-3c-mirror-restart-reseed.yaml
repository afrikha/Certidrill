id: dp420-3c-mirror-restart-reseed
objective: "3.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys mirrors a 1.5 TB Azure Cosmos DB for NoSQL database into Microsoft Fabric. On Friday evening, an administrator selects Stop replication on the mirrored database before a weekend maintenance of the source containers. On Monday morning, the administrator selects Start replication.

    What happens to the mirrored tables?
  fr: |
    Tailspin Toys met en miroir une base de données Azure Cosmos DB for NoSQL de 1,5 To dans Microsoft Fabric. Le vendredi soir, un administrateur sélectionne Stop replication sur la base de données en miroir avant une maintenance des conteneurs sources pendant le week-end. Le lundi matin, l'administrateur sélectionne Start replication.

    Qu'advient-il des tables en miroir ?
body:
  options:
    - { id: a, text: { en: "Replication resumes from the position reached on Friday and applies only the weekend's changes.", fr: "La réplication reprend à la position atteinte le vendredi et n'applique que les modifications du week-end." } }
    - { id: b, text: { en: "All the tables are reseeded, so replication starts again from scratch.", fr: "Toutes les tables sont réamorcées : la réplication repart donc de zéro." } }
    - { id: c, text: { en: "Only the tables whose source containers changed during the weekend are copied again.", fr: "Seules les tables dont les conteneurs sources ont changé pendant le week-end sont recopiées." } }
    - { id: d, text: { en: "The tables are emptied when replication stops on Friday and refilled incrementally on Monday.", fr: "Les tables sont vidées à l'arrêt de la réplication le vendredi, puis remplies de façon incrémentielle le lundi." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Stopping replication disables mirroring completely; there is no pause and resume. Restarting replication reseeds all the target tables, so mirroring effectively starts from scratch and replaces the OneLake data with the latest data instead of applying the missed changes."
    fr: "L'arrêt de la réplication désactive complètement la mise en miroir ; il n'existe pas de suspension avec reprise. Le redémarrage de la réplication réamorce toutes les tables cibles : la mise en miroir repart donc de zéro et remplace les données OneLake par les données les plus récentes au lieu d'appliquer les modifications manquées."
  options:
    a:
      en: "Mirroring has no resume capability: a restart doesn't continue from the last replicated change."
      fr: "La mise en miroir n'offre pas de reprise : un redémarrage ne continue pas à partir de la dernière modification répliquée."
    c:
      en: "The reseed applies to all the target tables, not only to the tables whose containers changed."
      fr: "Le réamorçage s'applique à toutes les tables cibles, pas seulement à celles dont les conteneurs ont changé."
    d:
      en: "Stopping replication keeps the data already replicated in OneLake; the tables aren't emptied at the stop."
      fr: "L'arrêt de la réplication conserve les données déjà répliquées dans OneLake ; les tables ne sont pas vidées à l'arrêt."
references:
  - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
  - title: Frequently asked questions for Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-faq
