id: dp420-3b-perf-quantized-query-options
objective: "3.1.6"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind Traders has an Azure Cosmos DB for NoSQL container named **catalog** with a `quantizedFlat` vector index on `/embedding`. A recommendation query filters on one category and returns the five most similar products.

    Tests show that some products returned by an exact search are missing from the results. You need to improve recall at query time while the query keeps using the quantizedFlat index.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **catalog** avec un index vectoriel `quantizedFlat` sur `/embedding`. Une requête de recommandation filtre sur une catégorie et renvoie les cinq produits les plus similaires.

    Des tests montrent que certains produits renvoyés par une recherche exacte manquent dans les résultats. Vous devez améliorer le rappel au moment de la requête, tout en continuant d'utiliser l'index quantizedFlat.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT TOP 5 c.id, c.name
    FROM c
    WHERE c.categoryId = @categoryId
    ORDER BY VectorDistance(c.embedding, @v, [[brute]],
             {"[[opt]]": 10})
  slots:
    - id: brute
      options:
        - { id: f, text: "false" }
        - { id: t, text: "true" }
    - id: opt
      options:
        - { id: qvl, text: quantizedVectorListMultiplier }
        - { id: sls, text: searchListSizeMultiplier }
        - { id: qbs, text: quantizationByteSize }
        - { id: isl, text: indexingSearchListSize }
answer:
  values: { brute: f, opt: qvl }
explanation:
  correct:
    en: "The third argument `false` (the default) lets `VectorDistance` use the vector index defined on the path. `quantizedVectorListMultiplier` enlarges the list of quantized candidates that are rechecked, which can increase recall at the expense of latency and RU."
    fr: "Le troisième argument `false` (valeur par défaut) laisse `VectorDistance` utiliser l'index vectoriel défini sur le chemin. `quantizedVectorListMultiplier` agrandit la liste des candidats quantifiés revérifiés, ce qui peut augmenter le rappel au prix de la latence et des RU."
  options:
    t:
      en: "true forces a brute-force search that ignores the index."
      fr: "true impose une recherche par force brute qui ignore l'index."
    sls:
      en: "searchListSizeMultiplier tunes the search list of a DiskANN index, not the candidate list of a quantizedFlat index."
      fr: "searchListSizeMultiplier règle la liste de recherche d'un index DiskANN, pas la liste de candidats d'un index quantizedFlat."
    qbs:
      en: "quantizationByteSize is an index build parameter set in the indexing policy, not a query option."
      fr: "quantizationByteSize est un paramètre de construction de l'index défini dans la stratégie d'indexation, pas une option de requête."
    isl:
      en: "indexingSearchListSize is a DiskANN index build parameter set in the indexing policy, not a query option."
      fr: "indexingSearchListSize est un paramètre de construction de l'index DiskANN défini dans la stratégie d'indexation, pas une option de requête."
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
