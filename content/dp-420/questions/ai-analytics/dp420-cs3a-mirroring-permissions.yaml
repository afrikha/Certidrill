id: dp420-cs3a-mirroring-permissions
objective: "3.3.2"
type: multi
caseStudy: dp420-cs3a-alpine-ski-house
difficulty: 2
status: draft
stem:
  en: |
    You plan to create a mirrored Azure Cosmos DB database in a Fabric workspace for the passpulse database. The Fabric connection will authenticate to cosmos-ash-prod with a Microsoft Entra identity.

    You create a custom data plane role definition for this identity. The solution must meet the analytics requirements.

    Which two data actions should the role definition include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous prévoyez de créer une base de données Azure Cosmos DB en miroir dans un espace de travail Fabric pour la base de données passpulse. La connexion Fabric s'authentifiera auprès de cosmos-ash-prod avec une identité Microsoft Entra.

    Vous créez une définition de rôle personnalisée du plan de données pour cette identité. La solution doit satisfaire les exigences relatives à l'analytique.

    Quelles sont les deux actions de données que la définition de rôle doit inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: "Microsoft.DocumentDB/databaseAccounts/readMetadata" }
    - { id: b, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/items/read" }
    - { id: c, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/readChangeFeed" }
    - { id: d, text: "Microsoft.DocumentDB/databaseAccounts/readAnalytics" }
    - { id: e, text: "Microsoft.DocumentDB/databaseAccounts/sqlDatabases/containers/*" }
answer: { optionIds: [a, d] }
explanation:
  correct:
    en: "A mirroring connection that uses Microsoft Entra ID and role-based access control needs only `readMetadata` and `readAnalytics` on the source account. Mirroring takes its initial snapshot from the continuous backup and then reads changes from the live container without the change feed or the analytical store, and replication does not consume the provisioned RUs. Granting only these two actions meets the least-privilege requirement."
    fr: "Une connexion de mise en miroir qui utilise Microsoft Entra ID et le contrôle d'accès en fonction du rôle n'a besoin que de `readMetadata` et `readAnalytics` sur le compte source. La mise en miroir prend son instantané initial à partir de la sauvegarde continue, puis lit les modifications du conteneur actif sans utiliser le flux de modification ni le magasin analytique, et la réplication ne consomme pas les RU provisionnées. N'accorder que ces deux actions respecte l'exigence du moindre privilège."
  options:
    b:
      en: "Reading items individually is what an application does; it is not one of the permissions that the mirroring connection requires."
      fr: "Lire des éléments un par un est le fait d'une application ; cela ne fait pas partie des autorisations requises par la connexion de mise en miroir."
    c:
      en: "Mirroring does not use the change feed as its change data capture source, so this action is not required."
      fr: "La mise en miroir n'utilise pas le flux de modification comme source de capture des changements : cette action n'est pas requise."
    e:
      en: "The wildcard grants every container operation, including writes and deletes, which violates least privilege; mirroring needs read access only."
      fr: "Le caractère générique accorde toutes les opérations sur les conteneurs, y compris les écritures et suppressions, ce qui enfreint le moindre privilège ; la mise en miroir n'a besoin que d'un accès en lecture."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
