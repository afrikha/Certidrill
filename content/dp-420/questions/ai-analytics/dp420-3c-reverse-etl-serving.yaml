id: dp420-3c-reverse-etl-serving
objective: "3.3.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso computes product recommendations every hour in a Microsoft Fabric notebook from data in a lakehouse. The company's web store must read the recommendations of a product by its ID with single-digit millisecond latency, at several thousand requests per second.

    You need to make the recommendations available to the web store.

    What should you do?
  fr: |
    Contoso calcule toutes les heures des recommandations de produits dans un notebook Microsoft Fabric à partir des données d'un lakehouse. La boutique en ligne de l'entreprise doit lire les recommandations d'un produit par son ID avec une latence de l'ordre de quelques millisecondes, à plusieurs milliers de requêtes par seconde.

    Vous devez mettre les recommandations à la disposition de la boutique en ligne.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Write the results to an Azure Cosmos DB container with the cosmos.oltp format, and have the web store use point reads.", fr: "Écrire les résultats dans un conteneur Azure Cosmos DB avec le format cosmos.oltp, et faire utiliser des lectures ponctuelles par la boutique en ligne." } }
    - { id: b, text: { en: "Write the results to a Delta table in the lakehouse, and have the web store query its SQL analytics endpoint.", fr: "Écrire les résultats dans une table Delta du lakehouse, et faire interroger son point de terminaison d'analytique SQL par la boutique en ligne." } }
    - { id: c, text: { en: "Insert the results into a table of a mirrored database through its SQL analytics endpoint.", fr: "Insérer les résultats dans une table d'une base de données en miroir par son point de terminaison d'analytique SQL." } }
    - { id: d, text: { en: "Publish the results in a Power BI semantic model in Direct Lake mode, and have the web store query the model.", fr: "Publier les résultats dans un modèle sémantique Power BI en mode Direct Lake, et faire interroger le modèle par la boutique en ligne." } }
answer: { optionId: a }
explanation:
  correct:
    en: "This is reverse ETL: the Spark connector writes the analytical results to an operational Azure Cosmos DB container, which serves them with low latency and high concurrency. A point read by ID and partition key is the cheapest and fastest way for the web store to get one product's recommendations."
    fr: "C'est un ETL inversé : le connecteur Spark écrit les résultats analytiques dans un conteneur Azure Cosmos DB opérationnel, qui les sert avec une faible latence et une forte concurrence. Une lecture ponctuelle par ID et clé de partition est le moyen le moins coûteux et le plus rapide pour la boutique d'obtenir les recommandations d'un produit."
  options:
    b:
      en: "A SQL analytics endpoint is built for analytical queries, not for thousands of single-digit millisecond lookups from an application."
      fr: "Un point de terminaison d'analytique SQL est conçu pour des requêtes analytiques, pas pour des milliers de recherches de quelques millisecondes émises par une application."
    c:
      en: "The SQL analytics endpoint of a mirrored database is read-only, so it can't accept inserts."
      fr: "Le point de terminaison d'analytique SQL d'une base de données en miroir est en lecture seule : il n'accepte pas d'insertions."
    d:
      en: "A semantic model serves reports and dashboards, not low-latency operational reads from a web application."
      fr: "Un modèle sémantique sert des rapports et des tableaux de bord, pas des lectures opérationnelles à faible latence pour une application web."
references:
  - title: Work with Cosmos DB in Microsoft Fabric using the Cosmos DB Spark Connector
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/how-to-use-spark-notebooks
