id: dp420-3a-vec-size-calc
objective: "3.1.2"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Tailspin is sizing an Azure Cosmos DB for NoSQL container for an embedding model that returns 1,024-dimension vectors. Tailspin compares the data types allowed in the vector embedding policy, and it also evaluates a second model that returns 4,096-dimension vectors.

    How should you complete the sizing notes? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin dimensionne un conteneur Azure Cosmos DB for NoSQL pour un modèle d'incorporation qui renvoie des vecteurs de 1 024 dimensions. Tailspin compare les types de données autorisés dans la stratégie d'incorporation vectorielle, et évalue aussi un second modèle qui renvoie des vecteurs de 4 096 dimensions.

    Comment devez-vous compléter les notes de dimensionnement ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      With the float32 data type, one 1,024-dimension vector needs [[s1]] bytes of binary storage.

      With the int8 data type, the same vector needs [[s2]] bytes of binary storage.

      The 4,096-dimension vectors of the second model can't use the [[s3]] vector index type.
    fr: |
      Avec le type de données float32, un vecteur de 1 024 dimensions nécessite [[s1]] octets de stockage binaire.

      Avec le type de données int8, le même vecteur nécessite [[s2]] octets de stockage binaire.

      Les vecteurs de 4 096 dimensions du second modèle ne peuvent pas utiliser le type d'index vectoriel [[s3]].
  slots:
    - id: s1
      options:
        - { id: b1024, text: { en: "1,024", fr: "1 024" } }
        - { id: b2048, text: { en: "2,048", fr: "2 048" } }
        - { id: b4096, text: { en: "4,096", fr: "4 096" } }
        - { id: b8192, text: { en: "8,192", fr: "8 192" } }
    - id: s2
      options:
        - { id: c512, text: "512" }
        - { id: c1024, text: { en: "1,024", fr: "1 024" } }
        - { id: c2048, text: { en: "2,048", fr: "2 048" } }
        - { id: c4096, text: { en: "4,096", fr: "4 096" } }
    - id: s3
      options:
        - { id: diskann, text: diskANN }
        - { id: flat, text: flat }
        - { id: qflat, text: quantizedFlat }
answer:
  values: { s1: b4096, s2: c1024, s3: flat }
explanation:
  correct:
    en: "A float32 value takes 4 bytes, so a 1,024-dimension vector takes 4,096 bytes; an int8 value takes 1 byte, so the same vector takes 1,024 bytes (float16 would take 2,048). The flat index supports at most 505 dimensions, whereas quantizedFlat and diskANN support up to 4,096."
    fr: "Une valeur float32 occupe 4 octets : un vecteur de 1 024 dimensions occupe donc 4 096 octets ; une valeur int8 occupe 1 octet : le même vecteur occupe 1 024 octets (float16 en occuperait 2 048). L'index flat prend en charge au plus 505 dimensions, alors que quantizedFlat et diskANN en acceptent jusqu'à 4 096."
  options:
    b2048: { en: "2,048 bytes is the size in float16 (2 bytes per value).", fr: "2 048 octets est la taille en float16 (2 octets par valeur)." }
    c2048: { en: "2,048 bytes is the size in float16, not int8.", fr: "2 048 octets est la taille en float16, pas en int8." }
    diskann: { en: "diskANN supports up to 4,096 dimensions.", fr: "diskANN prend en charge jusqu'à 4 096 dimensions." }
    qflat: { en: "quantizedFlat supports up to 4,096 dimensions.", fr: "quantizedFlat prend en charge jusqu'à 4 096 dimensions." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
