id: dp420-3b-perf-quantizedflat-narrow
objective: "3.1.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys is creating an Azure Cosmos DB for NoSQL container named **parts** for a similarity search feature. Each item has a 1,536-dimension embedding generated by text-embedding-3-small. The container is partitioned by `/categoryId`.

    Every vector query filters on `categoryId`, and no category contains more than 4,000 items. The search must return results as close as possible to an exact nearest-neighbor search, at a lower RU charge than a brute-force search on full-precision vectors.

    Which vector index type should you define on the embedding path?
  fr: |
    Tailspin Toys crée un conteneur Azure Cosmos DB for NoSQL nommé **parts** pour une fonctionnalité de recherche de similarité. Chaque élément a une incorporation de 1 536 dimensions générée par text-embedding-3-small. Le conteneur est partitionné par `/categoryId`.

    Chaque requête vectorielle filtre sur `categoryId`, et aucune catégorie ne contient plus de 4 000 éléments. La recherche doit renvoyer des résultats aussi proches que possible d'une recherche exacte des plus proches voisins, pour des frais en RU inférieurs à ceux d'une recherche par force brute sur les vecteurs en pleine précision.

    Quel type d'index vectoriel devez-vous définir sur le chemin de l'incorporation ?
body:
  options:
    - id: a
      text: flat
    - id: b
      text: quantizedFlat
    - id: c
      text: diskANN
    - id: d
      text: { en: "No vector index, with brute force forced in each query", fr: "Aucun index vectoriel, avec la force brute imposée dans chaque requête" }
answer: { optionId: b }
explanation:
  correct:
    en: "`quantizedFlat` runs a brute-force search over compressed vectors, with slightly under 100 % recall and a lower RU charge and latency than `flat`. It suits searches that filters narrow to a small set of vectors (about 50,000 or fewer) when high accuracy is required, which is the case here."
    fr: "`quantizedFlat` effectue une recherche par force brute sur des vecteurs compressés, avec un rappel légèrement inférieur à 100 % et des frais en RU et une latence inférieurs à `flat`. Il convient aux recherches que des filtres limitent à un petit ensemble de vecteurs (environ 50 000 ou moins) quand une grande précision est exigée, ce qui est le cas ici."
  options:
    a:
      en: "A flat index supports at most 505 dimensions, so it cannot index 1,536-dimension embeddings."
      fr: "Un index flat prend en charge au plus 505 dimensions : il ne peut pas indexer des incorporations de 1 536 dimensions."
    c:
      en: "DiskANN is an approximate nearest-neighbor index that shines above about 50,000 vectors in scope; its accuracy can be lower than quantizedFlat, which does not meet the requirement for near-exact results on small filtered sets."
      fr: "DiskANN est un index des plus proches voisins approximatif, adapté au-delà d'environ 50 000 vecteurs dans l'étendue ; sa précision peut être inférieure à celle de quantizedFlat, ce qui ne répond pas à l'exigence de résultats quasi exacts sur de petits ensembles filtrés."
    d:
      en: "A brute-force search on full-precision vectors is exactly what the RU requirement asks to improve on."
      fr: "Une recherche par force brute sur des vecteurs en pleine précision est précisément ce que l'exigence de RU demande d'améliorer."
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
