id: dp420-3b-sem-statements
objective: "3.2.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys stores the semantic memory of its assistant in an Azure Cosmos DB for NoSQL container named **memories**, partitioned by `/userId`. Each fact has a `text` property and a 1,536-dimension embedding generated by text-embedding-3-small.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys stocke la mémoire sémantique de son assistant dans un conteneur Azure Cosmos DB for NoSQL nommé **memories**, partitionné par `/userId`. Chaque fait a une propriété `text` et une incorporation de 1 536 dimensions générée par text-embedding-3-small.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A vector query on memories that has no filter on userId can return facts of other users."
        fr: "Une requête vectorielle sur memories sans filtre sur userId peut renvoyer des faits d'autres utilisateurs."
    - id: s2
      text:
        en: "A flat vector index can be defined on the embedding path of memories."
        fr: "Un index vectoriel flat peut être défini sur le chemin de l'incorporation de memories."
    - id: s3
      text:
        en: "A vector query that filters on c.userId = @userId runs against every physical partition of memories."
        fr: "Une requête vectorielle qui filtre sur c.userId = @userId s'exécute sur toutes les partitions physiques de memories."
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: "Without a filter on the owner, a similarity search ranks every user's facts and fans out to all partitions, so semantic memory must always be queried inside the user's scope. A flat index supports at most 505 dimensions, which excludes 1,536-dimension embeddings. A filter on the partition key routes the vector query to the single partition that holds the user's facts."
    fr: "Sans filtre sur le propriétaire, une recherche de similarité classe les faits de tous les utilisateurs et est diffusée vers toutes les partitions ; la mémoire sémantique doit donc toujours être interrogée dans l'étendue de l'utilisateur. Un index flat prend en charge au plus 505 dimensions, ce qui exclut les incorporations de 1 536 dimensions. Un filtre sur la clé de partition route la requête vectorielle vers la seule partition qui contient les faits de l'utilisateur."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
