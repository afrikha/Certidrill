id: dp420-3b-mem-thread-document
objective: "3.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum built a support agent that stores each conversation in Azure Cosmos DB for NoSQL as one item per thread. Each new user message and agent reply is appended to a `messages` array in the thread item, which is then replaced.

    In production, the RU charge of each append grows as threads get longer, and writes to the longest threads fail because the item exceeds the maximum item size.

    You need to redesign the conversation store. What should you do?
  fr: |
    Adatum a créé un agent de support qui stocke chaque conversation dans Azure Cosmos DB for NoSQL sous la forme d'un élément par thread. Chaque nouveau message de l'utilisateur et chaque réponse de l'agent sont ajoutés à un tableau `messages` de l'élément du thread, qui est ensuite remplacé.

    En production, les frais en RU de chaque ajout augmentent à mesure que les threads s'allongent, et les écritures dans les threads les plus longs échouent parce que l'élément dépasse la taille maximale d'un élément.

    Vous devez repenser le magasin de conversations. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Keep one item per thread and compress the messages array before each replace.", fr: "Conserver un élément par thread et compresser le tableau messages avant chaque remplacement." }
    - id: b
      text: { en: "Keep one item per thread and append each message with a patch Add operation.", fr: "Conserver un élément par thread et ajouter chaque message par une opération de patch Add." }
    - id: c
      text: { en: "Store one item per turn, with the user message and the agent reply, partitioned by thread.", fr: "Stocker un élément par tour, avec le message de l'utilisateur et la réponse de l'agent, partitionné par thread." }
    - id: d
      text: { en: "Store each thread in its own container.", fr: "Stocker chaque thread dans son propre conteneur." }
answer: { optionId: c }
explanation:
  correct:
    en: "One item per turn is the recommended model for agent memory. Items stay small whatever the length of the thread, each write is a cheap insert, the latest turns of a thread are read with one single-partition query, and each turn can carry its own embedding and TTL."
    fr: "Un élément par tour est le modèle recommandé pour la mémoire des agents. Les éléments restent petits quelle que soit la longueur du thread, chaque écriture est une insertion peu coûteuse, les derniers tours d'un thread se lisent avec une seule requête sur une partition, et chaque tour peut porter sa propre incorporation et sa propre TTL."
  options:
    a:
      en: "Compression delays the size limit but the item still grows without bound, and every append still rewrites the whole thread."
      fr: "La compression retarde la limite de taille, mais l'élément grossit toujours sans limite et chaque ajout réécrit toujours tout le thread."
    b:
      en: "A patch avoids sending the whole document, but the item keeps growing toward the maximum item size."
      fr: "Un patch évite d'envoyer tout le document, mais l'élément continue de grossir vers la taille maximale d'un élément."
    d:
      en: "A container per thread does not scale to thousands of threads and does not change the size of the thread item."
      fr: "Un conteneur par thread ne passe pas à l'échelle pour des milliers de threads et ne change pas la taille de l'élément du thread."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
