id: dp420-sr1-manual-chunks-1
objective: "3.1.2"
type: series_yesno
series: dp420-sr1-manual-chunks
seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You create the container in kb with dedicated throughput and a diskANN vector index.
  fr: Vous créez le conteneur dans kb avec un débit dédié et un index vectoriel diskANN.
body:
  solution:
    en: |
      You create chunks in the **kb** database with dedicated autoscale throughput and the following vector embedding policy:

      ```json
      {
        "vectorEmbeddings": [
          { "path": "/embedding", "dataType": "float32", "distanceFunction": "cosine", "dimensions": 3072 }
        ]
      }
      ```

      You use the following indexing policy:

      ```json
      {
        "indexingMode": "consistent",
        "automatic": true,
        "includedPaths": [{ "path": "/*" }],
        "excludedPaths": [{ "path": "/_etag/?" }, { "path": "/embedding/*" }],
        "vectorIndexes": [{ "path": "/embedding", "type": "diskANN" }]
      }
      ```
    fr: |
      Vous créez chunks dans la base de données **kb** avec un débit de mise à l'échelle automatique dédié et la stratégie d'incorporation vectorielle suivante :

      ```json
      {
        "vectorEmbeddings": [
          { "path": "/embedding", "dataType": "float32", "distanceFunction": "cosine", "dimensions": 3072 }
        ]
      }
      ```

      Vous utilisez la stratégie d'indexation suivante :

      ```json
      {
        "indexingMode": "consistent",
        "automatic": true,
        "includedPaths": [{ "path": "/*" }],
        "excludedPaths": [{ "path": "/_etag/?" }, { "path": "/embedding/*" }],
        "vectorIndexes": [{ "path": "/embedding", "type": "diskANN" }]
      }
      ```
answer: { value: true }
explanation:
  correct:
    en: The `diskANN` index supports up to 4,096 dimensions and performs approximate nearest neighbor search, which is usually the most performant option when a search covers more than 50,000 vectors. The policy declares the path, data type, distance function, and dimensions of the embeddings, and the container has its own throughput, which vector indexing requires.
    fr: "L'index `diskANN` prend en charge jusqu'à 4 096 dimensions et effectue une recherche approximative du plus proche voisin, généralement l'option la plus performante lorsqu'une recherche porte sur plus de 50 000 vecteurs. La stratégie déclare le chemin, le type de données, la fonction de distance et le nombre de dimensions des incorporations, et le conteneur dispose de son propre débit, ce qu'exige l'indexation vectorielle."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
