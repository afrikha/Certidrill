id: dp420-cs1c-turn-model
objective: "3.2.1"
type: single
caseStudy: dp420-cs1c-trey-research
difficulty: 2
status: draft
stem:
  en: |
    The turns container will be created with a default time to live of 2592000 seconds. You need to design the items of the turns container to meet the requirements for the conversation state. How should you model the conversation state?
  fr: |
    Le conteneur turns sera créé avec une durée de vie par défaut de 2592000 secondes. Vous devez concevoir les éléments du conteneur turns pour satisfaire les exigences relatives à l'état de conversation. Comment devez-vous modéliser l'état de conversation ?
body:
  options:
    - { id: a, text: { en: "One item per thread that contains an array of all its turns, updated after each answer", fr: "Un élément par fil qui contient un tableau de tous ses tours, mis à jour après chaque réponse" } }
    - { id: b, text: { en: "One item per message, so a question and its answer are two items, each with its own embedding", fr: "Un élément par message, si bien qu'une question et sa réponse forment deux éléments, chacun avec sa propre incorporation" } }
    - { id: c, text: { en: "One item per thread that contains only the last 10 turns and one embedding of the whole thread", fr: "Un élément par fil qui contient uniquement les 10 derniers tours et une incorporation de tout le fil" } }
    - { id: d, text: { en: "One item per turn that contains the question, the answer and one embedding of the turn", fr: "Un élément par tour qui contient la question, la réponse et une incorporation du tour" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      One item per turn is the recommended model for agent conversations. Each small item carries its own embedding of the question and answer, which supports semantic caching within the thread, and expires on its own with the default time to live, so every turn expires 30 days after it was written. Long threads do not make the items grow, and the turns of a thread stay in the same logical partition (/threadId).
    fr: |
      Un élément par tour est le modèle recommandé pour les conversations d'agents. Chaque petit élément porte sa propre incorporation de la question et de la réponse, ce qui permet la mise en cache sémantique dans le fil, et expire séparément avec la durée de vie par défaut, si bien que chaque tour expire 30 jours après son écriture. Les fils longs ne font pas grossir les éléments, et les tours d'un fil restent dans la même partition logique (/threadId).
  options:
    a: { en: "A thread item grows with hundreds of turns, so each update costs more RUs, and the time to live expires the whole thread at once, 30 days after its last update, instead of each turn.", fr: "Un élément de fil grossit avec des centaines de tours, si bien que chaque mise à jour coûte plus de RU, et la durée de vie fait expirer tout le fil d'un coup, 30 jours après sa dernière mise à jour, au lieu de chaque tour." }
    b: { en: "Splitting a turn into two items gives each embedding only one side of the exchange, which is not suited to reusing an answer through semantic caching.", fr: "Scinder un tour en deux éléments ne donne à chaque incorporation qu'un côté de l'échange, ce qui ne convient pas à la réutilisation d'une réponse par mise en cache sémantique." }
    c: { en: "Keeping only the last 10 turns loses the earlier turns that semantic caching must compare, and one embedding for the whole thread is too coarse.", fr: "Ne conserver que les 10 derniers tours perd les tours antérieurs que la mise en cache sémantique doit comparer, et une seule incorporation pour tout le fil est trop grossière." }
references:
  - title: Agent memories in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
