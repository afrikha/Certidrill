id: dp420-3b-rag-fresh-data
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Pharmaceuticals stores its product leaflets and stock levels in an Azure Cosmos DB for NoSQL container named **products**. The stock levels change several times per minute.

    You are building a chat assistant based on a Microsoft Foundry chat model. Its answers must reflect the leaflets and stock levels as they are when the question is asked, and the solution must not require training or retraining a model.

    What should you implement?
  fr: |
    Contoso Pharmaceuticals stocke ses notices de produits et ses niveaux de stock dans un conteneur Azure Cosmos DB for NoSQL nommé **products**. Les niveaux de stock changent plusieurs fois par minute.

    Vous créez un assistant conversationnel basé sur un modèle de conversation Microsoft Foundry. Ses réponses doivent refléter les notices et les niveaux de stock tels qu'ils sont au moment de la question, et la solution ne doit pas exiger d'entraîner ni de réentraîner un modèle.

    Que devez-vous implémenter ?
body:
  options:
    - id: a
      text: { en: "Train a custom embedding model on the leaflets and use it to answer the questions.", fr: "Entraîner un modèle d'incorporation personnalisé sur les notices et l'utiliser pour répondre aux questions." }
    - id: b
      text: { en: "Fine-tune the chat model every night on an export of the products container.", fr: "Affiner le modèle de conversation chaque nuit sur un export du conteneur products." }
    - id: c
      text: { en: "Copy the whole products container into the system prompt when the application starts.", fr: "Copier l'intégralité du conteneur products dans le prompt système au démarrage de l'application." }
    - id: d
      text: { en: "Retrieve the relevant items from products with a vector query at question time and add them to the prompt.", fr: "Récupérer les éléments pertinents de products par une requête vectorielle au moment de la question et les ajouter au prompt." }
answer: { optionId: d }
explanation:
  correct:
    en: "Retrieval-Augmented Generation retrieves the most relevant data at query time, here with vector search in the operational container, and passes it to the model, which answers from it. Because operational data and vectors live in the same items, the retrieved data is current and no model is trained."
    fr: "La génération augmentée par récupération (RAG) récupère les données les plus pertinentes au moment de la requête, ici par recherche vectorielle dans le conteneur opérationnel, et les transmet au modèle, qui répond à partir d'elles. Comme les données opérationnelles et les vecteurs se trouvent dans les mêmes éléments, les données récupérées sont à jour et aucun modèle n'est entraîné."
  options:
    b:
      en: "A nightly fine-tuning both trains a model and leaves answers up to a day behind the stock levels."
      fr: "Un affinage nocturne entraîne un modèle et laisse les réponses jusqu'à un jour en retard sur les niveaux de stock."
    c:
      en: "A prompt built at startup becomes stale within minutes, and a whole container does not fit in a model context window."
      fr: "Un prompt construit au démarrage devient obsolète en quelques minutes, et un conteneur entier ne tient pas dans la fenêtre de contexte d'un modèle."
    a:
      en: "An embedding model produces vectors for similarity search; it does not generate answers, and training it breaks the no-training requirement."
      fr: "Un modèle d'incorporation produit des vecteurs pour la recherche de similarité ; il ne génère pas de réponses, et l'entraîner enfreint l'exigence d'absence d'entraînement."
references:
  - title: Retrieval Augmented Generation - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/rag
