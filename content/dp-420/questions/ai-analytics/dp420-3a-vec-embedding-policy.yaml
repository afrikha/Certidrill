id: dp420-3a-vec-embedding-policy
objective: "3.1.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove is building a document assistant on Azure Cosmos DB for NoSQL. The embedding model returns 3,072 32-bit floating-point values for each input, and its documentation recommends cosine similarity. Woodgrove expects 40 million chunks, and vector queries search across the whole container.

    You need to define the vector embedding policy and the vector index of the chunks container. The solution must meet the following requirements:

    - Store the values with the precision returned by the model.
    - Provide the lowest query latency at this scale.

    The first JSON object is the vector embedding policy, and the second is an extract of the indexing policy.

    How should you complete the definitions? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove crée un assistant documentaire sur Azure Cosmos DB for NoSQL. Le modèle d'incorporation renvoie 3 072 valeurs à virgule flottante de 32 bits pour chaque entrée, et sa documentation recommande la similarité cosinus. Woodgrove prévoit 40 millions de segments, et les requêtes vectorielles portent sur l'ensemble du conteneur.

    Vous devez définir la stratégie d'incorporation vectorielle et l'index vectoriel du conteneur chunks. La solution doit satisfaire les exigences suivantes :

    - Stocker les valeurs avec la précision renvoyée par le modèle.
    - Offrir la latence de requête la plus faible à cette échelle.

    Le premier objet JSON est la stratégie d'incorporation vectorielle, le second un extrait de la stratégie d'indexation.

    Comment devez-vous compléter les définitions ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    {
      "vectorEmbeddings": [
        {
          "path": "/embedding",
          "dataType": "[[dt]]",
          "dimensions": [[dims]],
          "distanceFunction": "[[dist]]"
        }
      ]
    }

    "vectorIndexes": [
      { "path": "/embedding", "type": "[[idx]]" }
    ]
  slots:
    - id: dt
      options:
        - { id: f16, text: float16 }
        - { id: f32, text: float32 }
        - { id: i8, text: int8 }
    - id: dims
      options:
        - { id: d1536, text: "1536" }
        - { id: d3072, text: "3072" }
        - { id: d4096, text: "4096" }
    - id: dist
      options:
        - { id: cos, text: cosine }
        - { id: dot, text: dotproduct }
        - { id: euc, text: euclidean }
    - id: idx
      options:
        - { id: flat, text: flat }
        - { id: qflat, text: quantizedFlat }
        - { id: diskann, text: diskANN }
answer:
  values: { dt: f32, dims: d3072, dist: cos, idx: diskann }
explanation:
  correct:
    en: "The policy must describe the vectors as the model produces them: float32 values, 3,072 dimensions, and the cosine distance function recommended for the model. diskANN supports up to 4,096 dimensions and is the most performant index when a search covers more than 50,000 vectors."
    fr: "La stratégie doit décrire les vecteurs tels que le modèle les produit : des valeurs float32, 3 072 dimensions et la fonction de distance cosinus recommandée pour le modèle. diskANN prend en charge jusqu'à 4 096 dimensions et est l'index le plus performant lorsqu'une recherche couvre plus de 50 000 vecteurs."
  options:
    f16: { en: "float16 halves storage but loses precision compared with the 32-bit values returned by the model.", fr: "float16 divise le stockage par deux, mais perd de la précision par rapport aux valeurs 32 bits renvoyées par le modèle." }
    i8: { en: "int8 stores 8-bit integers, not the model's 32-bit floating-point values.", fr: "int8 stocke des entiers 8 bits, pas les valeurs à virgule flottante 32 bits du modèle." }
    d1536: { en: "The dimensions must equal the model's output length, 3,072.", fr: "Les dimensions doivent être égales à la longueur de sortie du modèle, 3 072." }
    d4096: { en: "4,096 is the maximum of quantizedFlat and diskANN, not the length of these vectors.", fr: "4 096 est le maximum de quantizedFlat et diskANN, pas la longueur de ces vecteurs." }
    dot: { en: "The model's documentation recommends cosine similarity.", fr: "La documentation du modèle recommande la similarité cosinus." }
    euc: { en: "The model's documentation recommends cosine similarity, not Euclidean distance.", fr: "La documentation du modèle recommande la similarité cosinus, pas la distance euclidienne." }
    flat: { en: "flat supports at most 505 dimensions.", fr: "flat prend en charge au plus 505 dimensions." }
    qflat: { en: "quantizedFlat is a brute-force search, recommended for 50,000 vectors or fewer; it is slower than diskANN on 40 million vectors.", fr: "quantizedFlat est une recherche en force brute, recommandée pour 50 000 vecteurs ou moins ; il est plus lent que diskANN sur 40 millions de vecteurs." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
