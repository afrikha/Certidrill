id: dp420-3a-vsearch-reduce-ru
objective: "3.1.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Proseware's search page runs the following query on an Azure Cosmos DB for NoSQL container that has a diskANN index on `/embedding`:

    ```sql
    SELECT TOP 100 c.id, c.title, VectorDistance(c.embedding, @v) AS score
    FROM c
    ORDER BY VectorDistance(c.embedding, @v, false, {"searchListSizeMultiplier": 20})
    ```

    The page displays the first 10 results only. The team accepts a slight loss of recall.

    You need to reduce the RU charge of the query.

    Which two changes should you make? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    La page de recherche de Proseware exécute la requête suivante sur un conteneur Azure Cosmos DB for NoSQL doté d'un index diskANN sur `/embedding` :

    ```sql
    SELECT TOP 100 c.id, c.title, VectorDistance(c.embedding, @v) AS score
    FROM c
    ORDER BY VectorDistance(c.embedding, @v, false, {"searchListSizeMultiplier": 20})
    ```

    La page n'affiche que les 10 premiers résultats. L'équipe accepte une légère perte de rappel.

    Vous devez réduire le coût en RU de la requête.

    Quelles sont les deux modifications à apporter ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "Replace false with true in the VectorDistance call of the ORDER BY clause.", fr: "Remplacer false par true dans l'appel à VectorDistance de la clause ORDER BY." }
    - id: b
      text: { en: "Lower searchListSizeMultiplier from 20 to 5.", fr: "Abaisser searchListSizeMultiplier de 20 à 5." }
    - id: c
      text: { en: "Remove TOP 100 and stop reading after the first page of results.", fr: "Supprimer TOP 100 et arrêter la lecture après la première page de résultats." }
    - id: d
      text: { en: "Replace TOP 100 with TOP 10.", fr: "Remplacer TOP 100 par TOP 10." }
    - id: e
      text: { en: "Add a composite index on /embedding ascending and /title ascending.", fr: "Ajouter un index composite sur /embedding croissant et /title croissant." }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: "A smaller TOP N makes the vector search return fewer results, which lowers the RU charge and the latency. searchListSizeMultiplier sizes the DiskANN search list: higher values may improve recall at the cost of latency and RUs, so lowering it reduces the charge with a possible small loss of recall."
    fr: "Un TOP N plus petit fait renvoyer moins de résultats à la recherche vectorielle, ce qui réduit le coût en RU et la latence. searchListSizeMultiplier dimensionne la liste de recherche DiskANN : des valeurs élevées peuvent améliorer le rappel au prix de la latence et des RU ; l'abaisser réduit donc le coût, avec une légère perte de rappel possible."
  options:
    a: { en: "true forces a brute-force search over every vector, which costs more RUs than the index.", fr: "true impose une recherche en force brute sur chaque vecteur, plus coûteuse en RU que l'index." }
    c: { en: "Without TOP N, the vector search tries to return many more results and costs more RUs.", fr: "Sans TOP N, la recherche vectorielle tente de renvoyer beaucoup plus de résultats et coûte plus de RU." }
    e: { en: "Composite indexes serve ORDER BY on several properties; they don't serve vector similarity.", fr: "Les index composites servent les ORDER BY sur plusieurs propriétés ; ils ne servent pas la similarité vectorielle." }
references:
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
