id: dp420-3a-hybrid-missing-index
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin has an Azure Cosmos DB for NoSQL container with the following configuration:

    - A vector embedding policy and a diskANN index on `/embedding`.
    - A full-text policy that declares `/body` with the language en-US.
    - An indexing policy that contains `includedPaths`, `excludedPaths` and `vectorIndexes` sections only.

    Vector queries and `FullTextContains` queries on `/body` run successfully. A hybrid query that uses `ORDER BY RANK RRF(VectorDistance(c.embedding, @v), FullTextScore(c.body, @t1))` doesn't run.

    You need to identify which definition is missing. What should you identify?
  fr: |
    Tailspin dispose d'un conteneur Azure Cosmos DB for NoSQL avec la configuration suivante :

    - Une stratégie d'incorporation vectorielle et un index diskANN sur `/embedding`.
    - Une stratégie de texte intégral qui déclare `/body` avec la langue en-US.
    - Une stratégie d'indexation qui ne contient que les sections `includedPaths`, `excludedPaths` et `vectorIndexes`.

    Les requêtes vectorielles et les requêtes `FullTextContains` sur `/body` s'exécutent correctement. Une requête hybride qui utilise `ORDER BY RANK RRF(VectorDistance(c.embedding, @v), FullTextScore(c.body, @t1))` ne s'exécute pas.

    Vous devez identifier la définition manquante. Que devez-vous identifier ?
body:
  options:
    - id: a
      text: { en: "A composite index on /body and /embedding", fr: "Un index composite sur /body et /embedding" }
    - id: b
      text: { en: "A flat vector index on /body", fr: "Un index vectoriel flat sur /body" }
    - id: c
      text: { en: "A full-text index on /body in the fullTextIndexes section", fr: "Un index de texte intégral sur /body dans la section fullTextIndexes" }
    - id: d
      text: { en: "A range index on /body/? in the includedPaths section", fr: "Un index de plage sur /body/? dans la section includedPaths" }
answer: { optionId: c }
explanation:
  correct:
    en: "FullTextContains can run without a full-text index (at a higher RU cost), but FullTextScore and RRF require a full-text index. The indexing policy must declare /body in fullTextIndexes, on the path defined in the container's full-text policy."
    fr: "FullTextContains peut s'exécuter sans index de texte intégral (pour un coût en RU plus élevé), mais FullTextScore et RRF exigent un index de texte intégral. La stratégie d'indexation doit déclarer /body dans fullTextIndexes, sur le chemin défini dans la stratégie de texte intégral du conteneur."
  options:
    a: { en: "Composite indexes serve ORDER BY on several properties; hybrid ranking needs a full-text index.", fr: "Les index composites servent les ORDER BY sur plusieurs propriétés ; le classement hybride exige un index de texte intégral." }
    b: { en: "/body is text, not a vector path declared in the vector embedding policy.", fr: "/body est du texte, pas un chemin vectoriel déclaré dans la stratégie d'incorporation vectorielle." }
    d: { en: "The default /* path already range-indexes /body, and a range index doesn't support BM25 scoring.", fr: "Le chemin /* par défaut indexe déjà /body en plage, et un index de plage ne prend pas en charge le score BM25." }
references:
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
  - title: FULLTEXTSCORE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/fulltextscore
