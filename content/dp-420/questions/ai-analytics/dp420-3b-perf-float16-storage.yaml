id: dp420-3b-perf-float16-storage
objective: "3.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware is designing a new Azure Cosmos DB for NoSQL container that will store 50 million product embeddings of 1,536 dimensions, produced as 32-bit floats by its current embedding model.

    You need to reduce the storage used by the vectors by about half. The calls to the embedding model must not change, and a small loss of accuracy is acceptable.

    What should you configure in the vector embedding policy?
  fr: |
    Proseware conçoit un nouveau conteneur Azure Cosmos DB for NoSQL qui stockera 50 millions d'incorporations de produits de 1 536 dimensions, produites sous forme de nombres flottants 32 bits par son modèle d'incorporation actuel.

    Vous devez réduire d'environ moitié le stockage utilisé par les vecteurs. Les appels au modèle d'incorporation ne doivent pas changer, et une légère perte de précision est acceptable.

    Que devez-vous configurer dans la stratégie d'incorporation vectorielle ?
body:
  options:
    - id: a
      text: { en: "Set dataType to float16.", fr: "Définir dataType sur float16." }
    - id: b
      text: { en: "Set dimensions to 768.", fr: "Définir dimensions sur 768." }
    - id: c
      text: { en: "Set distanceFunction to dotproduct.", fr: "Définir distanceFunction sur dotproduct." }
    - id: d
      text: { en: "Set quantizerType to spherical.", fr: "Définir quantizerType sur spherical." }
answer: { optionId: a }
explanation:
  correct:
    en: "A `float16` data type stores each dimension on 2 bytes instead of 4, which cuts vector storage by about 50 % with a possible small loss of accuracy. The model output stays the same; only the stored representation changes."
    fr: "Un type de données `float16` stocke chaque dimension sur 2 octets au lieu de 4, ce qui réduit le stockage des vecteurs d'environ 50 % avec une éventuelle légère perte de précision. La sortie du modèle reste la même ; seule la représentation stockée change."
  options:
    b:
      en: "The dimensions value must match the length of the vectors produced by the model; 1,536-dimension vectors cannot be stored on a 768-dimension path without changing the model calls."
      fr: "La valeur dimensions doit correspondre à la longueur des vecteurs produits par le modèle ; des vecteurs de 1 536 dimensions ne peuvent pas être stockés sur un chemin de 768 dimensions sans modifier les appels au modèle."
    c:
      en: "The distance function changes how similarity is computed, not the size of the stored vectors."
      fr: "La fonction de distance change le calcul de la similarité, pas la taille des vecteurs stockés."
    d:
      en: "quantizerType is a setting of quantizedFlat and DiskANN indexes, not of the vector embedding policy, and it does not change how vectors are stored in items."
      fr: "quantizerType est un paramètre des index quantizedFlat et DiskANN, pas de la stratégie d'incorporation vectorielle, et il ne change pas la façon dont les vecteurs sont stockés dans les éléments."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
