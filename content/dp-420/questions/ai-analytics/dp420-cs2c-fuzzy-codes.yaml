id: dp420-cs2c-fuzzy-codes
objective: "3.1.1"
type: dropdown
caseStudy: dp420-cs2c-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    A technician types `compresor` and selects the error codes E41, E42 and E47.

    You need to complete the query that the maintenance copilot sends to the manuals container to meet the fifth requirement.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un technicien saisit `compresor` et sélectionne les codes d'erreur E41, E42 et E47.

    Vous devez compléter la requête que le copilote de maintenance envoie au conteneur manuals pour respecter la cinquième exigence.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT TOP 20 c.id, c.text
    FROM c
    WHERE c.tenantId = @tenantId
      AND [[f1]](c.text, {"term": "compresor", "distance": [[dist]]})
      AND [[f2]](c.text, "E41", "E42", "E47")
  slots:
    - id: f1
      options:
        - { id: contains, text: FullTextContains }
        - { id: score, text: FullTextScore }
        - { id: strcontains, text: CONTAINS }
    - id: dist
      options:
        - { id: d0, text: "0" }
        - { id: d1, text: "1" }
        - { id: d2, text: "2" }
    - id: f2
      options:
        - { id: all, text: FullTextContainsAll }
        - { id: any, text: FullTextContainsAny }
        - { id: score, text: FullTextScore }
answer:
  values: { f1: contains, dist: d1, f2: any }
explanation:
  correct:
    en: "`FullTextContains` accepts a fuzzy term object whose `distance` is the number of edits tolerated (at most 2); a distance of 1 tolerates one wrong character. `FullTextContainsAny` returns true when at least one of the listed terms is in the property. Both are Boolean functions that use the full-text index in a `WHERE` clause."
    fr: "`FullTextContains` accepte un objet de terme approximatif dont `distance` est le nombre de modifications tolérées (2 au maximum) ; une distance de 1 tolère un caractère erroné. `FullTextContainsAny` renvoie true lorsqu'au moins un des termes listés figure dans la propriété. Ce sont deux fonctions booléennes qui utilisent l'index de texte intégral dans une clause `WHERE`."
  options:
    score: { en: "FullTextScore returns a BM25 score and can be used only in ORDER BY RANK, not in WHERE.", fr: "FullTextScore renvoie un score BM25 et ne s'utilise que dans ORDER BY RANK, pas dans WHERE." }
    strcontains: { en: "CONTAINS is a string function; it does not accept a fuzzy term object.", fr: "CONTAINS est une fonction de chaîne ; elle n'accepte pas d'objet de terme approximatif." }
    d0: { en: "A distance of 0 requires an exact match, so the typo would not be tolerated.", fr: "Une distance de 0 exige une correspondance exacte : la faute de frappe ne serait pas tolérée." }
    d2: { en: "A distance of 2 tolerates two edits, more than the single wrong character required.", fr: "Une distance de 2 tolère deux modifications, plus que le seul caractère erroné demandé." }
    all: { en: "FullTextContainsAll requires every listed code to be present, not at least one.", fr: "FullTextContainsAll exige que tous les codes listés soient présents, pas au moins un." }
references:
  - title: Full-text search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
