id: dp420-cs1a-search-box
objective: "3.1.1"
type: dropdown
caseStudy: dp420-cs1a-adventure-works
difficulty: 2
status: draft
stem:
  en: |
    The search box passes the two words typed by the shopper in the parameters `@word1` and `@word2`.

    You need to complete the query to meet the search requirement.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    La zone de recherche transmet les deux mots saisis par le client dans les paramètres `@word1` et `@word2`.

    Vous devez compléter la requête pour satisfaire l'exigence relative à la recherche.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT TOP 20 c.id, c.name, c.price
    FROM c
    WHERE [[filter]](c.description, @word1, @word2)
    [[order]](c.description, @word1, @word2)
  slots:
    - id: filter
      options:
        - { id: any, text: FullTextContainsAny }
        - { id: all, text: FullTextContainsAll }
        - { id: score, text: FullTextScore }
    - id: order
      options:
        - { id: orderby, text: "ORDER BY FullTextScore" }
        - { id: rank, text: "ORDER BY RANK FullTextScore" }
        - { id: rankvector, text: "ORDER BY RANK VectorDistance" }
answer:
  values: { filter: all, order: rank }
explanation:
  correct:
    en: "`FullTextContainsAll` returns true only when the property contains all the given terms, and it is used in the WHERE clause. `FullTextScore` computes the BM25 relevance score and can only be used in an `ORDER BY RANK` clause. The existing full-text policy and full-text index on `/description` let both functions use the index."
    fr: "`FullTextContainsAll` renvoie true uniquement quand la propriété contient tous les termes indiqués, et s'utilise dans la clause WHERE. `FullTextScore` calcule le score de pertinence BM25 et ne peut être utilisée que dans une clause `ORDER BY RANK`. La stratégie de texte intégral et l'index de texte intégral existants sur `/description` permettent aux deux fonctions d'utiliser l'index."
  options:
    any: { en: "FullTextContainsAny returns the products that contain at least one of the words, not all of them.", fr: "FullTextContainsAny renvoie les produits qui contiennent au moins l'un des mots, pas tous." }
    score: { en: "FullTextScore cannot be used in a WHERE clause; it is allowed only in ORDER BY RANK.", fr: "FullTextScore ne peut pas être utilisée dans une clause WHERE ; elle n'est autorisée que dans ORDER BY RANK." }
    orderby: { en: "FullTextScore must be used with ORDER BY RANK, not with a regular ORDER BY.", fr: "FullTextScore doit être utilisée avec ORDER BY RANK, pas avec un ORDER BY classique." }
    rankvector: { en: "VectorDistance ranks by vector similarity and needs an embedding, not BM25 relevance on words.", fr: "VectorDistance trie par similarité vectorielle et nécessite une incorporation, pas une pertinence BM25 sur des mots." }
references:
  - title: Full-text search in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
