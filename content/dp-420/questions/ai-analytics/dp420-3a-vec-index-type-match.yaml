id: dp420-3a-vec-index-type-match
objective: "3.1.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is designing three Azure Cosmos DB for NoSQL containers that store embeddings. Vector search is enabled on the account, and each container has dedicated throughput.

    You need to choose the vector index type of each container. Each choice must meet the container's requirement at the lowest RU cost.

    Which vector index type should you choose for each container? To answer, drag the appropriate index types to the correct containers. Each index type may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam conçoit trois conteneurs Azure Cosmos DB for NoSQL qui stockent des incorporations vectorielles. La recherche vectorielle est activée sur le compte, et chaque conteneur dispose d'un débit dédié.

    Vous devez choisir le type d'index vectoriel de chaque conteneur. Chaque choix doit satisfaire l'exigence du conteneur au coût en RU le plus faible.

    Quel type d'index vectoriel devez-vous choisir pour chaque conteneur ? Pour répondre, faites glisser les types d'index appropriés vers les conteneurs correspondants. Chaque type d'index peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: flat, text: flat }
    - { id: qflat, text: quantizedFlat }
    - { id: diskann, text: diskANN }
    - { id: none, text: { en: "No vector index", fr: "Aucun index vectoriel" } }
  targets:
    - id: t1
      text: { en: "icons: 256-dimension image embeddings, about 8,000 vectors in total; results must be exact (100 % recall).", fr: "icons : incorporations d'images de 256 dimensions, environ 8 000 vecteurs au total ; les résultats doivent être exacts (rappel de 100 %)." }
    - id: t2
      text: { en: "contracts: 1,536-dimension embeddings; every query is filtered to one customer's partition, which holds at most 20,000 vectors; recall must be as close to 100 % as possible.", fr: "contracts : incorporations de 1 536 dimensions ; chaque requête est filtrée sur la partition d'un client, qui contient au plus 20 000 vecteurs ; le rappel doit être aussi proche que possible de 100 %." }
    - id: t3
      text: { en: "pages: 3,072-dimension embeddings; each query searches about 10 million vectors with the lowest latency.", fr: "pages : incorporations de 3 072 dimensions ; chaque requête parcourt environ 10 millions de vecteurs avec la latence la plus faible." }
answer:
  mapping: { t1: flat, t2: qflat, t3: diskann }
explanation:
  correct:
    en: "flat is a brute-force index with 100 % recall, limited to 505 dimensions, so it fits small exact searches. quantizedFlat compresses vectors (up to 4,096 dimensions) and is recommended when a search is scoped to 50,000 vectors or fewer; as a brute-force search, its recall is higher than the approximate diskANN. diskANN (up to 4,096 dimensions) is the most performant when a search covers more than 50,000 vectors."
    fr: "flat est un index en force brute avec un rappel de 100 %, limité à 505 dimensions : il convient aux petites recherches exactes. quantizedFlat compresse les vecteurs (jusqu'à 4 096 dimensions) et est recommandé lorsqu'une recherche porte sur 50 000 vecteurs ou moins ; en force brute, son rappel est supérieur à celui de diskANN, qui est approximatif. diskANN (jusqu'à 4 096 dimensions) est le plus performant lorsqu'une recherche couvre plus de 50 000 vecteurs."
  options:
    none: { en: "Without a vector index, every query runs a full scan, which costs the most RUs.", fr: "Sans index vectoriel, chaque requête effectue une analyse complète, la plus coûteuse en RU." }
    flat: { en: "flat supports at most 505 dimensions, so it can't index the 1,536- or 3,072-dimension embeddings.", fr: "flat prend en charge au plus 505 dimensions : il ne peut pas indexer les incorporations de 1 536 ou 3 072 dimensions." }
    qflat: { en: "quantizedFlat may return slightly less than 100 % recall, and it is a brute-force search, slower than diskANN on millions of vectors.", fr: "quantizedFlat peut donner un rappel légèrement inférieur à 100 %, et c'est une recherche en force brute, plus lente que diskANN sur des millions de vecteurs." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
