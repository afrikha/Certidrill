id: dp420-3b-mem-model-statements
objective: "3.2.1"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders is choosing how to store the conversation memory of its ordering agent in Azure Cosmos DB for NoSQL. The candidate designs store one item per turn, one item per message, or one item per thread.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders choisit comment stocker la mémoire de conversation de son agent de commande dans Azure Cosmos DB for NoSQL. Les conceptions envisagées stockent un élément par tour, un élément par message ou un élément par thread.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "In the one-item-per-message design, a single embedding covers both the user prompt and the agent reply of an exchange."
        fr: "Dans la conception à un élément par message, une même incorporation couvre à la fois le prompt de l'utilisateur et la réponse de l'agent d'un échange."
    - id: s2
      text:
        en: "In the one-item-per-turn design with /threadId as the partition key, loading the latest 10 turns of a thread is a single-partition query."
        fr: "Dans la conception à un élément par tour avec /threadId comme clé de partition, charger les 10 derniers tours d'un thread est une requête sur une seule partition."
    - id: s3
      text:
        en: "In the one-item-per-turn design, TTL can remove the old turns of a long thread while its recent turns remain."
        fr: "Dans la conception à un élément par tour, la TTL peut supprimer les anciens tours d'un long thread tout en conservant ses tours récents."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "With one item per message, each embedding captures only one response, which also makes the design a poor fit for semantic caching. With one item per turn partitioned by thread, all the turns of a thread share a logical partition, so the latest-N query targets one partition. Each turn is its own item, so TTL expires it based on its own last write, unlike the one-item-per-thread design where TTL applies to the whole thread."
    fr: "Avec un élément par message, chaque incorporation ne capture qu'une seule réponse, ce qui rend aussi la conception peu adaptée au cache sémantique. Avec un élément par tour partitionné par thread, tous les tours d'un thread partagent une partition logique, si bien que la requête des N derniers tours cible une seule partition. Chaque tour est un élément distinct ; la TTL le fait expirer selon sa propre dernière écriture, contrairement à la conception à un élément par thread, où la TTL s'applique au thread entier."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
