id: dp420-3a-vec-nested-array
objective: "3.1.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind stores equipment manuals in Azure Cosmos DB for NoSQL. In the current design, each manual is one item with a `chunks` array; each element of the array has a `text` property and a 1,536-dimension `embedding` property.

    You need to enable vector search that returns the most relevant chunks for a technician's question.

    What should you do?
  fr: |
    Northwind stocke des manuels d'équipement dans Azure Cosmos DB for NoSQL. Dans la conception actuelle, chaque manuel est un élément doté d'un tableau `chunks` ; chaque élément du tableau possède une propriété `text` et une propriété `embedding` de 1 536 dimensions.

    Vous devez permettre une recherche vectorielle qui renvoie les segments les plus pertinents pour la question d'un technicien.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Declare /chunks/[]/embedding in the vector embedding policy, and index the path with diskANN.", fr: "Déclarer /chunks/[]/embedding dans la stratégie d'incorporation vectorielle, et indexer le chemin avec diskANN." }
    - id: b
      text: { en: "Declare /chunks/*/embedding in the vector embedding policy, and index the path with quantizedFlat.", fr: "Déclarer /chunks/*/embedding dans la stratégie d'incorporation vectorielle, et indexer le chemin avec quantizedFlat." }
    - id: c
      text: { en: "Declare /chunks in the vector embedding policy, with dimensions equal to 1,536 times the number of chunks.", fr: "Déclarer /chunks dans la stratégie d'incorporation vectorielle, avec des dimensions égales à 1 536 fois le nombre de segments." }
    - id: d
      text: { en: "Store each chunk as its own item with a top-level /embedding property, and declare /embedding in the policy.", fr: "Stocker chaque segment dans son propre élément avec une propriété /embedding de premier niveau, et déclarer /embedding dans la stratégie." }
answer: { optionId: d }
explanation:
  correct:
    en: "Wildcard characters (`*`, `[]`) and vector paths nested inside arrays aren't supported in the vector policy or the vector index. One item per chunk gives each chunk its own vector path, so VectorDistance can rank chunks individually, and it keeps items small."
    fr: "Les caractères génériques (`*`, `[]`) et les chemins vectoriels imbriqués dans des tableaux ne sont pas pris en charge dans la stratégie vectorielle ni dans l'index vectoriel. Un élément par segment donne à chaque segment son propre chemin vectoriel, ce qui permet à VectorDistance de classer les segments un par un, et garde des éléments de petite taille."
  options:
    a: { en: "The [] array notation isn't supported in a vector embedding policy or a vector index.", fr: "La notation de tableau [] n'est pas prise en charge dans une stratégie d'incorporation vectorielle ni dans un index vectoriel." }
    b: { en: "The * wildcard isn't supported in vector paths.", fr: "Le caractère générique * n'est pas pris en charge dans les chemins vectoriels." }
    c: { en: "A vector path must hold one one-dimensional vector of the model's length; an array of chunk objects is not a vector.", fr: "Un chemin vectoriel doit contenir un seul vecteur à une dimension de la longueur du modèle ; un tableau d'objets segments n'est pas un vecteur." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
