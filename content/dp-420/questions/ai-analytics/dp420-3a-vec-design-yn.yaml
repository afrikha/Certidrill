id: dp420-3a-vec-design-yn
objective: "3.1.2"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware is testing vector search on a new Azure Cosmos DB for NoSQL container named **pilot**. The vector embedding policy declares `/textVector` (768 dimensions, `cosine`) and `/imageVector` (512 dimensions, `euclidean`). The indexing policy has a quantizedFlat index on each path. The container currently holds 600 items.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware teste la recherche vectorielle sur un nouveau conteneur Azure Cosmos DB for NoSQL nommé **pilot**. La stratégie d'incorporation vectorielle déclare `/textVector` (768 dimensions, `cosine`) et `/imageVector` (512 dimensions, `euclidean`). La stratégie d'indexation comporte un index quantizedFlat sur chaque chemin. Le conteneur contient actuellement 600 éléments.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "For `/textVector`, a higher VectorDistance value means that the two vectors are more similar."
        fr: "Pour `/textVector`, une valeur de VectorDistance plus élevée signifie que les deux vecteurs sont plus similaires."
    - id: s2
      text:
        en: "For `/imageVector`, a VectorDistance value of 0 indicates the most similar vectors."
        fr: "Pour `/imageVector`, une valeur de VectorDistance de 0 indique les vecteurs les plus similaires."
    - id: s3
      text:
        en: "Vector queries on `/textVector` currently use the quantizedFlat index instead of a full scan."
        fr: "Les requêtes vectorielles sur `/textVector` utilisent actuellement l'index quantizedFlat plutôt qu'une analyse complète."
answer:
  values: { s1: true, s2: true, s3: false }
explanation:
  correct:
    en: "Cosine similarity ranges from -1 to +1, and higher values are more similar. Euclidean distance ranges from 0 (most similar) to +infinity. quantizedFlat and diskANN indexes need at least 1,000 vectors; with 600 items, queries use a full scan, which can cost more RUs."
    fr: "La similarité cosinus va de -1 à +1, et les valeurs les plus élevées sont les plus similaires. La distance euclidienne va de 0 (le plus similaire) à +infini. Les index quantizedFlat et diskANN exigent au moins 1 000 vecteurs ; avec 600 éléments, les requêtes effectuent une analyse complète, qui peut coûter plus de RU."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
