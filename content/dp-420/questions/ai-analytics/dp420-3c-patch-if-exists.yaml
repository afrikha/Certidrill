id: dp420-3c-patch-if-exists
objective: "3.3.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank computes a `loyaltyTier` value for each customer in a Microsoft Fabric notebook. The resulting DataFrame has three columns: `id`, `customerId` (the partition key) and `loyaltyTier`. The notebook writes it to the customers container of an Azure Cosmos DB for NoSQL account with the Spark connector.

    Some customers were deleted from the container after the DataFrame was built. The write must change only the `loyaltyTier` property, must not recreate deleted customers, and must not fail the job.

    Which value should you set for `spark.cosmos.write.strategy`?
  fr: |
    Woodgrove Bank calcule une valeur `loyaltyTier` pour chaque client dans un notebook Microsoft Fabric. Le DataFrame obtenu a trois colonnes : `id`, `customerId` (la clé de partition) et `loyaltyTier`. Le notebook l'écrit dans le conteneur customers d'un compte Azure Cosmos DB for NoSQL avec le connecteur Spark.

    Certains clients ont été supprimés du conteneur après la création du DataFrame. L'écriture ne doit modifier que la propriété `loyaltyTier`, ne doit pas recréer les clients supprimés et ne doit pas faire échouer le travail.

    Quelle valeur devez-vous définir pour `spark.cosmos.write.strategy` ?
body:
  options:
    - { id: a, text: ItemPatch }
    - { id: b, text: ItemOverwrite }
    - { id: c, text: ItemAppend }
    - { id: d, text: ItemPatchIfExists }
answer: { optionId: d }
explanation:
  correct:
    en: "`ItemPatchIfExists` applies a partial update to the items that exist and skips the missing ones without failing. Only the patched property changes, and the other properties of each customer item are kept."
    fr: "`ItemPatchIfExists` applique une mise à jour partielle aux éléments qui existent et ignore ceux qui manquent sans échouer. Seule la propriété patchée change, et les autres propriétés de chaque élément client sont conservées."
  options:
    a:
      en: "`ItemPatch` also updates only the patched property, but it fails the Spark job when an item doesn't exist (404)."
      fr: "`ItemPatch` ne met lui aussi à jour que la propriété patchée, mais il fait échouer le travail Spark quand un élément n'existe pas (404)."
    b:
      en: "`ItemOverwrite` upserts each row: it would replace the full items with three properties and recreate the deleted customers."
      fr: "`ItemOverwrite` effectue un upsert de chaque ligne : il remplacerait les éléments complets par trois propriétés et recréerait les clients supprimés."
    c:
      en: "`ItemAppend` only creates items: it ignores the existing customers and would recreate the deleted ones."
      fr: "`ItemAppend` crée seulement des éléments : il ignore les clients existants et recréerait les clients supprimés."
references:
  - title: "Tutorial: Connect to Azure Cosmos DB for NoSQL by using Spark"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/tutorial-spark-connector
