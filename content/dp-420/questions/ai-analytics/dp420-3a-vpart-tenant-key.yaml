id: dp420-3a-vpart-tenant-key
objective: "3.1.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum is building a multitenant SaaS application on Azure Cosmos DB for NoSQL. The application has 3,000 tenants with similar workloads, and no tenant stores more than 2 GB. Each tenant's documents and embeddings will be stored in one shared container with dedicated throughput, and every vector query searches the documents of a single tenant.

    You need to design the container so that vector queries consume the fewest RUs and the solution minimizes cost.

    What should you do?
  fr: |
    Adatum crée une application SaaS multilocataire sur Azure Cosmos DB for NoSQL. L'application compte 3 000 locataires aux charges de travail similaires, et aucun locataire ne stocke plus de 2 Go. Les documents et incorporations de chaque locataire seront stockés dans un conteneur partagé doté d'un débit dédié, et chaque requête vectorielle porte sur les documents d'un seul locataire.

    Vous devez concevoir le conteneur de façon que les requêtes vectorielles consomment le moins de RU possible et que la solution minimise les coûts.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Use /id as the partition key, and filter each vector query on c.tenantId.", fr: "Utiliser /id comme clé de partition, et filtrer chaque requête vectorielle sur c.tenantId." }
    - id: b
      text: { en: "Use /tenantId as the partition key, and filter each vector query on c.tenantId.", fr: "Utiliser /tenantId comme clé de partition, et filtrer chaque requête vectorielle sur c.tenantId." }
    - id: c
      text: { en: "Create one container per tenant in a database that has shared throughput.", fr: "Créer un conteneur par locataire dans une base de données dotée d'un débit partagé." }
    - id: d
      text: { en: "Create one Azure Cosmos DB account per tenant, each with one container.", fr: "Créer un compte Azure Cosmos DB par locataire, chacun avec un conteneur." }
answer: { optionId: b }
explanation:
  correct:
    en: "A partition key per tenant gives high tenant density at low cost and works best when tenants have similar workloads. A filter on the partition key targets the tenant's partition, so the vector search runs on one partition instead of fanning out to all of them."
    fr: "Une clé de partition par locataire offre une forte densité de locataires à faible coût et convient le mieux lorsque les locataires ont des charges similaires. Un filtre sur la clé de partition cible la partition du locataire : la recherche vectorielle s'exécute sur une seule partition au lieu de toutes."
  options:
    a: { en: "With /id as the partition key, a tenant filter doesn't target a partition, so every vector query fans out to all physical partitions.", fr: "Avec /id comme clé de partition, un filtre sur le locataire ne cible aucune partition : chaque requête vectorielle est diffusée vers toutes les partitions physiques." }
    c: { en: "Vector search isn't supported on accounts with shared throughput, and 3,000 containers add management overhead.", fr: "La recherche vectorielle n'est pas prise en charge sur les comptes à débit partagé, et 3 000 conteneurs alourdissent la gestion." }
    d: { en: "An account per tenant gives the strongest isolation but the highest cost and management effort for small, similar tenants.", fr: "Un compte par locataire offre l'isolation la plus forte, mais le coût et l'effort de gestion les plus élevés pour des locataires petits et similaires." }
references:
  - title: Multitenancy - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/multi-tenancy-vector-search
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
