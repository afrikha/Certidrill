id: dp420-3c-analyze-write-back
objective: "3.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Adatum mirrors an Azure Cosmos DB for NoSQL database named orders into Microsoft Fabric. The orders container uses 40,000 RU/s of provisioned throughput, mostly consumed by the order-processing application.

    A data engineer must compute the lifetime value of each customer from three years of orders and store the result in the customerStats container of the same account. Reading the orders must not consume RUs, and the write must use no more than 20 percent of the throughput of customerStats.

    Which two actions should the data engineer perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum met en miroir une base de données Azure Cosmos DB for NoSQL nommée orders dans Microsoft Fabric. Le conteneur orders utilise un débit provisionné de 40 000 RU/s, consommé en majeure partie par l'application de traitement des commandes.

    Un ingénieur données doit calculer la valeur vie client de chaque client à partir de trois ans de commandes et stocker le résultat dans le conteneur customerStats du même compte. La lecture des commandes ne doit pas consommer de RU, et l'écriture ne doit pas utiliser plus de 20 % du débit de customerStats.

    Quelles sont les deux actions que l'ingénieur données doit effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Read the orders container with the cosmos.oltp format and a custom query.", fr: "Lire le conteneur orders avec le format cosmos.oltp et une requête personnalisée." } }
    - { id: b, text: { en: "Read the orders through a lakehouse shortcut to the mirrored table.", fr: "Lire les commandes par un raccourci de lakehouse vers la table en miroir." } }
    - { id: c, text: { en: "Write the results with the cosmos.oltp format and a targetThroughputThreshold of 0.20.", fr: "Écrire les résultats avec le format cosmos.oltp et un targetThroughputThreshold de 0.20." } }
    - { id: d, text: { en: "Write the results with an INSERT statement in the SQL analytics endpoint of the mirrored database.", fr: "Écrire les résultats avec une instruction INSERT dans le point de terminaison d'analytique SQL de la base de données en miroir." } }
    - { id: e, text: { en: "Read the change feed of the orders container from the beginning with the cosmos.oltp.changeFeed format.", fr: "Lire le flux de modification du conteneur orders depuis le début avec le format cosmos.oltp.changeFeed." } }
answer: { optionIds: [b, c] }
explanation:
  correct:
    en: "The lakehouse shortcut reads the mirrored Delta table in OneLake, so the analysis runs on Fabric capacity without RUs. The Spark connector then writes the results to customerStats, and client-side throughput control with `targetThroughputThreshold` set to 0.20 limits the job to about 20 percent of that container's throughput."
    fr: "Le raccourci de lakehouse lit la table Delta en miroir dans OneLake : l'analyse s'exécute donc sur la capacité Fabric sans RU. Le connecteur Spark écrit ensuite les résultats dans customerStats, et le contrôle du débit côté client avec `targetThroughputThreshold` à 0.20 limite le travail à environ 20 % du débit de ce conteneur."
  options:
    a:
      en: "Reading the operational container with the connector consumes RUs that the order-processing application needs."
      fr: "Lire le conteneur opérationnel avec le connecteur consomme des RU dont l'application de traitement des commandes a besoin."
    d:
      en: "The SQL analytics endpoint is read-only and can't write to the source account."
      fr: "Le point de terminaison d'analytique SQL est en lecture seule et ne peut pas écrire dans le compte source."
    e:
      en: "Reading the change feed is a read on the container and consumes RUs."
      fr: "Lire le flux de modification est une lecture sur le conteneur et consomme des RU."
references:
  - title: "How to: Access mirrored Azure Cosmos DB data in Lakehouse and notebooks from Microsoft Fabric"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-lakehouse-notebooks
  - title: "Azure Cosmos DB Spark connector: Throughput control"
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/throughput-control-spark
