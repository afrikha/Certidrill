id: dp420-sr1-catalog-ranking-3
objective: "3.1.5"
type: series_yesno
series: dp420-sr1-catalog-ranking
seriesOrder: 3
difficulty: 2
status: draft
stem:
  en: You order the results by RANK RRF of VectorDistance and FullTextScore.
  fr: Vous triez les résultats par RANK RRF de VectorDistance et FullTextScore.
body:
  solution:
    en: |
      You use the following query:

      ```sql
      SELECT TOP 10 c.id, c.name
      FROM c
      ORDER BY RANK RRF(
          VectorDistance(c.embedding, @queryVector),
          FullTextScore(c.description, @term1, @term2))
      ```
    fr: |
      Vous utilisez la requête suivante :

      ```sql
      SELECT TOP 10 c.id, c.name
      FROM c
      ORDER BY RANK RRF(
          VectorDistance(c.embedding, @queryVector),
          FullTextScore(c.description, @term1, @term2))
      ```
answer: { value: true }
explanation:
  correct:
    en: Hybrid search in Azure Cosmos DB uses the `RRF` function in an `ORDER BY RANK` clause to fuse the ranking by `VectorDistance` with the BM25 ranking by `FullTextScore`, which takes the property path followed by the search terms. `TOP 10` limits the results to the 10 best fused ranks, and the existing policies, DiskANN index, and full-text index serve both parts of the query.
    fr: "La recherche hybride d'Azure Cosmos DB utilise la fonction `RRF` dans une clause `ORDER BY RANK` pour fusionner le classement par `VectorDistance` et le classement BM25 par `FullTextScore`, qui prend le chemin de la propriété suivi des termes recherchés. `TOP 10` limite les résultats aux 10 meilleurs rangs fusionnés, et les stratégies existantes, l'index DiskANN et l'index de texte intégral servent les deux parties de la requête."
references:
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
