id: dp420-3b-mem-forget-user-hpk
objective: "3.2.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware stores the long-term memories of its assistant in an Azure Cosmos DB for NoSQL container named **memories**. The container has a hierarchical partition key: `/tenantId`, then `/userId`. The DeleteAllItemsByPartitionKey capability is enabled on the account.

    The user **user-4821** of the tenant **litware-fr** asks to be forgotten. You need to delete all the memory items of that user in the memories container with the fewest client operations.

    Which Python call should you use?
  fr: |
    Litware stocke les mémoires à long terme de son assistant dans un conteneur Azure Cosmos DB for NoSQL nommé **memories**. Le conteneur a une clé de partition hiérarchique : `/tenantId`, puis `/userId`. La fonctionnalité DeleteAllItemsByPartitionKey est activée sur le compte.

    L'utilisateur **user-4821** du locataire **litware-fr** demande à être oublié. Vous devez supprimer tous les éléments de mémoire de cet utilisateur dans le conteneur memories avec le moins d'opérations client possible.

    Quel appel Python devez-vous utiliser ?
body:
  options:
    - id: a
      text: 'memories.delete_all_items_by_partition_key("user-4821")'
    - id: b
      text: 'memories.delete_all_items_by_partition_key(["litware-fr"])'
    - id: c
      text: 'memories.delete_all_items_by_partition_key(["litware-fr", "user-4821"])'
    - id: d
      text: 'memories.delete_item(item="user-4821", partition_key=["litware-fr", "user-4821"])'
answer: { optionId: c }
explanation:
  correct:
    en: "Delete by partition key removes every item of one logical partition in a background operation, and with hierarchical partition keys it requires the full key value, here the tenant and the user. The items disappear from reads and queries at once, and the deletion consumes at most 10 % of the container's RU/s."
    fr: "La suppression par clé de partition retire tous les éléments d'une partition logique par une opération en arrière-plan ; avec des clés de partition hiérarchiques, elle exige la valeur complète de la clé, ici le locataire et l'utilisateur. Les éléments disparaissent immédiatement des lectures et des requêtes, et la suppression consomme au plus 10 % des RU/s du conteneur."
  options:
    a:
      en: "The user ID alone is not the full key of a container whose first level is the tenant; an incomplete key is not supported by delete by partition key, and this value does not even identify the tenant."
      fr: "L'ID de l'utilisateur seul n'est pas la clé complète d'un conteneur dont le premier niveau est le locataire ; une clé incomplète n'est pas prise en charge par la suppression par clé de partition, et cette valeur n'identifie même pas le locataire."
    b:
      en: "Deleting with an intermediate (prefix) key returns an error, and it would erase the memories of every user of the tenant."
      fr: "Supprimer avec une clé intermédiaire (préfixe) renvoie une erreur, et effacerait les mémoires de tous les utilisateurs du locataire."
    d:
      en: "delete_item deletes one item whose id is given; the user's memories are many items with their own IDs."
      fr: "delete_item supprime un seul élément dont l'id est fourni ; les mémoires de l'utilisateur sont de nombreux éléments avec leurs propres ID."
references:
  - title: Delete Items by Partition Key Value - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-delete-by-partition-key
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
