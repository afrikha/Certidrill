id: dp420-3a-fts-rank-query
objective: "3.1.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Tailspin sells outdoor equipment. The **products** container has a full-text policy and a full-text index on `/description` (en-US).

    You need to write the query of the catalog page. The query must meet the following requirements:

    - Return only the products of the category `@cat` whose description contains both the words "waterproof" and "breathable", in any position.
    - Sort the products by their BM25 relevance to the words "lightweight" and "jacket".

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin vend du matériel de plein air. Le conteneur **products** possède une stratégie de texte intégral et un index de texte intégral sur `/description` (en-US).

    Vous devez écrire la requête de la page du catalogue. La requête doit satisfaire les exigences suivantes :

    - Ne renvoyer que les produits de la catégorie `@cat` dont la description contient à la fois les mots « waterproof » et « breathable », à n'importe quelle position.
    - Trier les produits selon leur pertinence BM25 par rapport aux mots « lightweight » et « jacket ».

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: sql
  template: |
    SELECT TOP 10 c.id, c.name
    FROM c
    WHERE c.categoryId = @cat
      AND [[f1]](c.description, "waterproof", "breathable")
    [[ord]] [[f2]](c.description, "lightweight", "jacket")
  slots:
    - id: f1
      options:
        - { id: any, text: FullTextContainsAny }
        - { id: all, text: FullTextContainsAll }
        - { id: wscore, text: FullTextScore }
    - id: ord
      options:
        - { id: orderby, text: ORDER BY }
        - { id: groupby, text: GROUP BY }
        - { id: rank, text: ORDER BY RANK }
    - id: f2
      options:
        - { id: score, text: FullTextScore }
        - { id: contains, text: FullTextContains }
        - { id: vd, text: VectorDistance }
answer:
  values: { f1: all, ord: rank, f2: score }
explanation:
  correct:
    en: "`FullTextContainsAll` returns true only when every listed term is in the property, not necessarily next to each other. `FullTextScore` returns the BM25 score of the terms, and it can be used only after `ORDER BY RANK`, which sorts the results from the most to the least relevant."
    fr: "`FullTextContainsAll` ne renvoie true que si chaque terme listé figure dans la propriété, pas forcément côte à côte. `FullTextScore` renvoie le score BM25 des termes et ne s'utilise qu'après `ORDER BY RANK`, qui trie les résultats du plus pertinent au moins pertinent."
  options:
    any: { en: "FullTextContainsAny keeps products that contain only one of the two words.", fr: "FullTextContainsAny garde les produits qui ne contiennent qu'un des deux mots." }
    orderby: { en: "FullTextScore can't be used with a plain ORDER BY; it requires ORDER BY RANK.", fr: "FullTextScore ne s'utilise pas avec un simple ORDER BY ; il exige ORDER BY RANK." }
    groupby: { en: "GROUP BY aggregates results (for example for facets); it does not rank them.", fr: "GROUP BY agrège les résultats (par exemple pour des facettes) ; il ne les classe pas." }
    wscore: { en: "FullTextScore returns a score that can be used only in ORDER BY RANK, not in WHERE.", fr: "FullTextScore renvoie un score utilisable uniquement dans ORDER BY RANK, pas dans WHERE." }
    contains: { en: "FullTextContains returns a Boolean for a WHERE clause, not a relevance score.", fr: "FullTextContains renvoie un booléen pour une clause WHERE, pas un score de pertinence." }
    vd: { en: "VectorDistance compares vectors; it does not score words with BM25.", fr: "VectorDistance compare des vecteurs ; il ne note pas des mots avec BM25." }
references:
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
  - title: FULLTEXTSCORE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/fulltextscore
