id: dp420-3c-mirror-status-grid
objective: "3.3.2"
type: hotarea
difficulty: 1
status: draft
stem:
  en: |
    Contoso mirrors the shop database of an Azure Cosmos DB for NoSQL account into Microsoft Fabric. The Monitor replication pane of the mirrored database shows the table list below.

    Answer each prompt by selecting the appropriate table.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso met en miroir la base de données shop d'un compte Azure Cosmos DB for NoSQL dans Microsoft Fabric. Le volet Monitor replication de la base de données en miroir affiche la liste de tables ci-dessous.

    Répondez à chaque consigne en sélectionnant la table appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The table whose replication hit an error that requires intervention", fr: "La table dont la réplication a rencontré une erreur qui exige une intervention" }
    - id: p2
      text: { en: "The table that keeps replicating although a nonfatal error occurred", fr: "La table qui continue à être répliquée malgré une erreur non fatale" }
  grid:
    caption: { en: "Monitor replication — tables", fr: "Monitor replication — tables" }
    header: [{ en: Name, fr: Nom }, { en: Status, fr: État }, Rows replicated, Last completed]
    rows:
      - [{ text: orders, area: orders }, { text: Running }, { text: "18,402,113" }, { text: "11/16/2026 09:42" }]
      - [{ text: payments, area: payments }, { text: Running with warning }, { text: "2,310,877" }, { text: "11/16/2026 09:41" }]
      - [{ text: carts, area: carts }, { text: Failed }, { text: "455,902" }, { text: "11/15/2026 22:10" }]
      - [{ text: reviews, area: reviews }, { text: Stopped }, { text: "96,344" }, { text: "11/12/2026 17:05" }]
answer:
  values: { p1: carts, p2: payments }
explanation:
  correct:
    en: "At table level, Failed means a fatal error occurred for that table, so replication of carts stopped until the cause is fixed. Running with warning means a nonfatal error occurred while the table's data keeps replicating, as for payments. Stopped means replication was stopped, not that an error occurred."
    fr: "Au niveau de la table, Failed signifie qu'une erreur fatale s'est produite pour cette table : la réplication de carts est arrêtée tant que la cause n'est pas corrigée. Running with warning signifie qu'une erreur non fatale s'est produite alors que les données de la table continuent d'être répliquées, comme pour payments. Stopped signifie que la réplication a été arrêtée, pas qu'une erreur s'est produite."
references:
  - title: Monitor Fabric mirrored database replication
    url: https://learn.microsoft.com/en-us/fabric/mirroring/monitor
