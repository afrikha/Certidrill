id: dp420-3b-rag-tenant-trimming
objective: "3.1.7"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam provides a RAG assistant to 400 law firms. The document chunks of all the firms are stored in one Azure Cosmos DB for NoSQL container partitioned by `/firmId`. After authentication, each request carries the firm ID of the user.

    You need to ensure that the chat model never receives chunks that belong to another firm.

    What should you do?
  fr: |
    Fabrikam fournit un assistant RAG à 400 cabinets d'avocats. Les segments de documents de tous les cabinets sont stockés dans un seul conteneur Azure Cosmos DB for NoSQL partitionné par `/firmId`. Après l'authentification, chaque requête transporte l'ID du cabinet de l'utilisateur.

    Vous devez garantir que le modèle de conversation ne reçoit jamais de segments appartenant à un autre cabinet.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Filter the retrieval query on the authenticated firm ID with WHERE c.firmId = @firmId.", fr: "Filtrer la requête de récupération sur l'ID du cabinet authentifié avec WHERE c.firmId = @firmId." }
    - id: b
      text: { en: "Instruct the model in the system prompt to ignore chunks of other firms.", fr: "Demander au modèle, dans le prompt système, d'ignorer les segments des autres cabinets." }
    - id: c
      text: { en: "Rerank the retrieved chunks with Semantic Reranker before building the prompt.", fr: "Reclasser les segments récupérés avec Semantic Reranker avant de construire le prompt." }
    - id: d
      text: { en: "Reduce the TOP N value of the retrieval query to 3.", fr: "Réduire la valeur TOP N de la requête de récupération à 3." }
answer: { optionId: a }
explanation:
  correct:
    en: "Security trimming belongs in the retrieval query. Filtering on the firm ID taken from the authenticated session (here also the partition key) guarantees that only the firm's chunks are returned, and the query targets a single partition, which also lowers its RU charge."
    fr: "Le filtrage de sécurité doit se faire dans la requête de récupération. Filtrer sur l'ID du cabinet issu de la session authentifiée (ici aussi la clé de partition) garantit que seuls les segments du cabinet sont renvoyés, et la requête cible une seule partition, ce qui réduit aussi ses frais en RU."
  options:
    b:
      en: "Once other firms' chunks are in the prompt, the data has already left the boundary; a prompt instruction is not an access control."
      fr: "Une fois les segments des autres cabinets dans le prompt, les données ont déjà franchi la limite ; une instruction de prompt n'est pas un contrôle d'accès."
    c:
      en: "A reranker reorders candidates by relevance; it does not remove chunks of other firms."
      fr: "Un reclassement réordonne les candidats par pertinence ; il ne retire pas les segments des autres cabinets."
    d:
      en: "Fewer results can still include the most similar chunks of another firm."
      fr: "Moins de résultats peuvent tout de même inclure les segments les plus similaires d'un autre cabinet."
references:
  - title: Retrieval Augmented Generation - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/rag
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
