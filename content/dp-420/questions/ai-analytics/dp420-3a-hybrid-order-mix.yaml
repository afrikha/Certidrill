id: dp420-3a-hybrid-order-mix
objective: "3.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam's news site uses hybrid search on an Azure Cosmos DB for NoSQL container that has the required vector and full-text indexes. The search must return only the articles published in the last 30 days, ranked by hybrid relevance. A developer wrote the following query, which fails:

    ```sql
    SELECT TOP 10 c.id, c.title
    FROM c
    ORDER BY RANK RRF(VectorDistance(c.embedding, @v), FullTextScore(c.body, @t1)),
        c.publishedAt DESC
    ```

    You need to fix the query. What should you do?
  fr: |
    Le site d'actualités de Fabrikam utilise la recherche hybride sur un conteneur Azure Cosmos DB for NoSQL doté des index vectoriel et de texte intégral nécessaires. La recherche ne doit renvoyer que les articles publiés au cours des 30 derniers jours, classés par pertinence hybride. Un développeur a écrit la requête suivante, qui échoue :

    ```sql
    SELECT TOP 10 c.id, c.title
    FROM c
    ORDER BY RANK RRF(VectorDistance(c.embedding, @v), FullTextScore(c.body, @t1)),
        c.publishedAt DESC
    ```

    Vous devez corriger la requête. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a composite index on /publishedAt descending to the indexing policy.", fr: "Ajouter un index composite sur /publishedAt décroissant à la stratégie d'indexation." }
    - id: b
      text: { en: "Replace ORDER BY RANK with ORDER BY so that the second sort key is accepted.", fr: "Remplacer ORDER BY RANK par ORDER BY pour que la seconde clé de tri soit acceptée." }
    - id: c
      text: { en: "Pass c.publishedAt to RRF as a third argument after FullTextScore.", fr: "Passer c.publishedAt à RRF comme troisième argument après FullTextScore." }
    - id: d
      text: { en: "Remove c.publishedAt DESC, and add WHERE c.publishedAt >= @since to the query.", fr: "Supprimer c.publishedAt DESC, et ajouter WHERE c.publishedAt >= @since à la requête." }
answer: { optionId: d }
explanation:
  correct:
    en: "RRF can only be used in an ORDER BY RANK clause and can't be combined with ORDER BY on other property paths. The 30-day requirement is a condition, so it belongs in a WHERE clause, and the remaining ORDER BY RANK RRF ranks the filtered articles by hybrid relevance."
    fr: "RRF ne s'utilise que dans une clause ORDER BY RANK et ne peut pas être combiné avec un ORDER BY sur d'autres chemins de propriété. L'exigence des 30 jours est une condition : elle a sa place dans une clause WHERE, et l'ORDER BY RANK RRF restant classe les articles filtrés par pertinence hybride."
  options:
    a: { en: "An index doesn't lift the rule that RRF can't be combined with ORDER BY on another property.", fr: "Un index ne lève pas la règle selon laquelle RRF ne peut pas être combiné avec un ORDER BY sur une autre propriété." }
    b: { en: "RRF is valid only in ORDER BY RANK.", fr: "RRF n'est valide que dans ORDER BY RANK." }
    c: { en: "RRF arguments are scoring functions, such as VectorDistance and FullTextScore, plus an optional weights array.", fr: "Les arguments de RRF sont des fonctions de score, comme VectorDistance et FullTextScore, plus un tableau de poids facultatif." }
references:
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
