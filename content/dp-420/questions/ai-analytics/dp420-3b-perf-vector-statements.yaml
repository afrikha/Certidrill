id: dp420-3b-perf-vector-statements
objective: "3.1.6"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum is tuning vector search in an Azure Cosmos DB for NoSQL account. The vector search feature is enabled, and the containers have vector embedding policies on their vector paths.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum optimise la recherche vectorielle dans un compte Azure Cosmos DB for NoSQL. La fonctionnalité de recherche vectorielle est activée, et les conteneurs ont des stratégies d'incorporation vectorielle sur leurs chemins vectoriels.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "Adding /embedding/* to the excluded paths of a container prevents VectorDistance queries from using the DiskANN index defined on /embedding."
        fr: "Ajouter /embedding/* aux chemins exclus d'un conteneur empêche les requêtes VectorDistance d'utiliser l'index DiskANN défini sur /embedding."
    - id: s2
      text:
        en: "In a container that holds 600 vectors and has a quantizedFlat index on the vector path, vector queries run as a full scan."
        fr: "Dans un conteneur qui contient 600 vecteurs et a un index quantizedFlat sur le chemin vectoriel, les requêtes vectorielles s'exécutent par une analyse complète."
    - id: s3
      text:
        en: "Passing true as the third argument of VectorDistance makes the query use the DiskANN index of the vector path."
        fr: "Passer true comme troisième argument de VectorDistance fait utiliser à la requête l'index DiskANN du chemin vectoriel."
answer:
  values: { s1: false, s2: true, s3: false }
explanation:
  correct:
    en: "Excluding the vector path from the range index is the recommended configuration: the vector index is defined separately in vectorIndexes and keeps working. quantizedFlat and diskANN indexes need at least 1,000 vectors; below that, the query performs a full scan. The third argument of VectorDistance set to true forces brute force; false (the default) uses the index when one exists."
    fr: "Exclure le chemin vectoriel de l'index de plage est la configuration recommandée : l'index vectoriel est défini séparément dans vectorIndexes et continue de fonctionner. Les index quantizedFlat et diskANN exigent au moins 1 000 vecteurs ; en dessous, la requête effectue une analyse complète. Le troisième argument de VectorDistance défini sur true impose la force brute ; false (valeur par défaut) utilise l'index quand il en existe un."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: VECTORDISTANCE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/vectordistance
