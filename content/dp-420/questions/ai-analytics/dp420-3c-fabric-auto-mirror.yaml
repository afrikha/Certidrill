id: dp420-3c-fabric-auto-mirror
objective: "3.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam created a Cosmos DB database named orders-db in a Microsoft Fabric workspace. A web app writes orders to its containers.

    Business analysts must query the orders with T-SQL in near real time. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Fabrikam a créé une base de données Cosmos DB nommée orders-db dans un espace de travail Microsoft Fabric. Une application web écrit des commandes dans ses conteneurs.

    Les analystes métier doivent interroger les commandes avec T-SQL en temps quasi réel. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Create a Mirrored Azure Cosmos DB item that uses orders-db as its source.", fr: "Créer un élément Mirrored Azure Cosmos DB qui utilise orders-db comme source." } }
    - { id: b, text: { en: "Enable continuous backup on orders-db, and then start mirroring.", fr: "Activer la sauvegarde continue sur orders-db, puis démarrer la mise en miroir." } }
    - { id: c, text: { en: "Schedule a notebook that copies the containers to a warehouse.", fr: "Planifier un notebook qui copie les conteneurs dans un entrepôt." } }
    - { id: d, text: { en: "Give the analysts the SQL analytics endpoint of orders-db.", fr: "Fournir aux analystes le point de terminaison d'analytique SQL d'orders-db." } }
answer: { optionId: d }
explanation:
  correct:
    en: "Data in a Cosmos DB database in Fabric is mirrored to OneLake automatically, in Delta Parquet format and in near real time; this mirroring is always on. The database therefore already has a SQL analytics endpoint that analysts can query with T-SQL, with no setup."
    fr: "Les données d'une base de données Cosmos DB dans Fabric sont mises en miroir automatiquement dans OneLake, au format Delta Parquet et en temps quasi réel ; cette mise en miroir est toujours active. La base de données dispose donc déjà d'un point de terminaison d'analytique SQL que les analystes peuvent interroger en T-SQL, sans aucune configuration."
  options:
    a:
      en: "A Mirrored Azure Cosmos DB item replicates an Azure Cosmos DB for NoSQL account; a Cosmos DB database in Fabric is already mirrored."
      fr: "Un élément Mirrored Azure Cosmos DB réplique un compte Azure Cosmos DB for NoSQL ; une base de données Cosmos DB dans Fabric est déjà mise en miroir."
    b:
      en: "Continuous backup is a prerequisite for mirroring an Azure Cosmos DB account, not a setting of a Cosmos DB database in Fabric, whose mirroring needs no action."
      fr: "La sauvegarde continue est un prérequis de la mise en miroir d'un compte Azure Cosmos DB, pas un paramètre d'une base de données Cosmos DB dans Fabric, dont la mise en miroir ne demande aucune action."
    c:
      en: "A scheduled copy adds a pipeline to maintain and isn't near real time, while the automatic mirror is already available."
      fr: "Une copie planifiée ajoute un pipeline à maintenir et n'est pas en temps quasi réel, alors que le miroir automatique est déjà disponible."
references:
  - title: What is Cosmos DB in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/overview
  - title: Frequently asked questions for Cosmos DB in Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/faq
