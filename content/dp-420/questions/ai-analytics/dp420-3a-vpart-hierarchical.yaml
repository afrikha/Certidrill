id: dp420-3a-vpart-hierarchical
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso Legal hosts the documents of 40 law firms in one Azure Cosmos DB for NoSQL container. Each document is split into chunks, and each chunk item has a unique `chunkId`, a `firmId` and an embedding. Several firms will store more than 20 GB of chunks. Every vector query searches the chunks of one firm.

    The account is already configured for vector search on containers that use hierarchical partition keys.

    You need to choose the partition key of the container. Vector queries must target only the partitions of the firm, and the design must scale beyond 20 GB per firm.

    Which partition key should you use?
  fr: |
    Contoso Legal héberge les documents de 40 cabinets d'avocats dans un conteneur Azure Cosmos DB for NoSQL. Chaque document est découpé en segments, et chaque élément segment possède un `chunkId` unique, un `firmId` et une incorporation. Plusieurs cabinets stockeront plus de 20 Go de segments. Chaque requête vectorielle porte sur les segments d'un cabinet.

    Le compte est déjà configuré pour la recherche vectorielle sur des conteneurs qui utilisent des clés de partition hiérarchiques.

    Vous devez choisir la clé de partition du conteneur. Les requêtes vectorielles ne doivent cibler que les partitions du cabinet, et la conception doit pouvoir dépasser 20 Go par cabinet.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - id: a
      text: { en: "/firmId", fr: "/firmId" }
    - id: b
      text: { en: "/chunkId", fr: "/chunkId" }
    - id: c
      text: { en: "A hierarchical partition key: /firmId, then /chunkId", fr: "Une clé de partition hiérarchique : /firmId, puis /chunkId" }
    - id: d
      text: { en: "A hierarchical partition key: /chunkId, then /firmId", fr: "Une clé de partition hiérarchique : /chunkId, puis /firmId" }
answer: { optionId: c }
explanation:
  correct:
    en: "Learn recommends hierarchical partition keys to scale a tenant beyond 20 GB, with a high-cardinality ID at the lowest level. With /firmId as the first level, a query filtered on the firm targets only that firm's partitions, while /chunkId spreads each firm across several physical partitions."
    fr: "Learn recommande les clés de partition hiérarchiques pour faire dépasser 20 Go à un locataire, avec un ID à forte cardinalité au niveau le plus bas. Avec /firmId comme premier niveau, une requête filtrée sur le cabinet ne cible que les partitions de ce cabinet, tandis que /chunkId répartit chaque cabinet sur plusieurs partitions physiques."
  options:
    a: { en: "A single /firmId key limits each firm to one logical partition, which can't exceed 20 GB.", fr: "Une clé /firmId seule limite chaque cabinet à une partition logique, qui ne peut pas dépasser 20 Go." }
    b: { en: "With /chunkId alone, a firm filter doesn't target partitions, so every vector query fans out to all partitions.", fr: "Avec /chunkId seul, un filtre sur le cabinet ne cible pas de partitions : chaque requête vectorielle est diffusée vers toutes les partitions." }
    d: { en: "Queries can target partitions only with a prefix of the key; with /chunkId first, a firm filter can't be routed.", fr: "Les requêtes ne ciblent des partitions qu'avec un préfixe de la clé ; avec /chunkId en premier, un filtre sur le cabinet ne peut pas être routé." }
references:
  - title: Multitenancy - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/multi-tenancy-vector-search
