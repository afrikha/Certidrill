id: dp420-cs2a-inventory-store
objective: "3.3.1"
type: single
caseStudy: dp420-cs2a-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You need to recommend where to store the data of the store-inventory application to meet the fifth requirement.

    What should you recommend?
  fr: |
    Vous devez recommander l'emplacement des données de l'application d'inventaire des magasins pour respecter la cinquième exigence.

    Que devez-vous recommander ?
body:
  options:
    - { id: a, text: { en: "Add a container to cosmos-fourthcoffee and mirror the loyalty database into the Fabric workspace.", fr: "Ajouter un conteneur à cosmos-fourthcoffee et mettre en miroir la base de données loyalty dans l'espace de travail Fabric." } }
    - { id: b, text: { en: "Create a new Azure Cosmos DB account with continuous backup and mirror it into the Fabric workspace.", fr: "Créer un nouveau compte Azure Cosmos DB avec la sauvegarde continue et le mettre en miroir dans l'espace de travail Fabric." } }
    - { id: c, text: { en: "Create a Cosmos DB database in the Fabric workspace of the analytics team.", fr: "Créer une base de données Cosmos DB dans l'espace de travail Fabric de l'équipe d'analytique." } }
    - { id: d, text: { en: "Create a serverless Azure Cosmos DB account and copy its data to OneLake with a nightly Spark job.", fr: "Créer un compte Azure Cosmos DB serverless et copier ses données dans OneLake avec un job Spark nocturne." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      Cosmos DB in Microsoft Fabric uses the same engine as Azure Cosmos DB for NoSQL, is created and managed in a Fabric workspace, and makes its data available automatically in OneLake in Delta Parquet format, with no mirroring to configure. Its current limits fit the workload: autoscale containers up to 50,000 RU/s by default, and no Private Link support, which the application does not need.
    fr: |
      Cosmos DB dans Microsoft Fabric utilise le même moteur qu'Azure Cosmos DB for NoSQL, se crée et se gère dans un espace de travail Fabric, et rend ses données disponibles automatiquement dans OneLake au format Delta Parquet, sans mise en miroir à configurer. Ses limites actuelles conviennent à la charge de travail : des conteneurs en mise à l'échelle automatique jusqu'à 50 000 RU/s par défaut, et pas de prise en charge de Private Link, dont l'application n'a pas besoin.
  options:
    a: { en: "Mirroring requires configuration, which the requirement excludes, and it does not support accounts that have multiple write regions such as cosmos-fourthcoffee.", fr: "La mise en miroir demande une configuration, ce que l'exigence exclut, et elle ne prend pas en charge les comptes à plusieurs régions d'écriture comme cosmos-fourthcoffee." }
    b: { en: "This works, but it requires configuring mirroring and managing an Azure account outside the Fabric workspace, which adds administrative effort.", fr: "Cette solution fonctionne, mais elle impose de configurer la mise en miroir et de gérer un compte Azure en dehors de l'espace de travail Fabric, ce qui ajoute de l'effort d'administration." }
    d: { en: "A nightly copy is an ETL process, and the data would not be available automatically in OneLake.", fr: "Une copie nocturne est un processus ETL, et les données ne seraient pas disponibles automatiquement dans OneLake." }
references:
  - title: What is Cosmos DB in Microsoft Fabric?
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/overview
  - title: Limitations in Cosmos DB in Microsoft Fabric
    url: https://learn.microsoft.com/en-us/fabric/database/cosmos-db/limitations
