id: dp420-3b-mem-pk-tenant-thread
objective: "3.2.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso sells a customer-service agent to 800 companies. Some companies run more than 40,000 concurrent conversation threads, and a large company can exceed 20 GB of conversation data. The turns are stored in an Azure Cosmos DB for NoSQL container, one item per turn.

    The design must meet the following requirements:

    - Loading the latest turns of a thread must be a single-partition query.
    - A search across all the threads of one company must not fan out to every physical partition.

    Which partition key should you use for the container?
  fr: |
    Contoso vend un agent de service client à 800 entreprises. Certaines entreprises ont plus de 40 000 threads de conversation simultanés, et une grande entreprise peut dépasser 20 Go de données de conversation. Les tours sont stockés dans un conteneur Azure Cosmos DB for NoSQL, un élément par tour.

    La conception doit répondre aux exigences suivantes :

    - Le chargement des derniers tours d'un thread doit être une requête sur une seule partition.
    - Une recherche dans tous les threads d'une entreprise ne doit pas être diffusée vers toutes les partitions physiques.

    Quelle clé de partition devez-vous utiliser pour le conteneur ?
body:
  options:
    - id: a
      text: /companyId
    - id: b
      text: /threadId
    - id: c
      text: { en: "/id (one value per turn)", fr: "/id (une valeur par tour)" }
    - id: d
      text: { en: "Hierarchical: /companyId, then /threadId", fr: "Hiérarchique : /companyId, puis /threadId" }
answer: { optionId: d }
explanation:
  correct:
    en: "A hierarchical partition key of company then thread keeps each thread in one logical partition, so latest-N queries hit one partition, while a query that filters on companyId alone is routed only to the partitions of that company (a targeted cross-partition query). Large companies can also grow beyond 20 GB because each company is split across threads."
    fr: "Une clé de partition hiérarchique entreprise puis thread garde chaque thread dans une seule partition logique, si bien que les requêtes des N derniers tours touchent une seule partition, tandis qu'une requête qui filtre uniquement sur companyId n'est routée que vers les partitions de cette entreprise (requête interpartitions ciblée). Les grandes entreprises peuvent aussi dépasser 20 Go, car chaque entreprise est répartie entre ses threads."
  options:
    a:
      en: "All the turns of a company would share one logical partition, limited to 20 GB and concentrating the writes of 40,000 threads."
      fr: "Tous les tours d'une entreprise partageraient une seule partition logique, limitée à 20 Go, qui concentrerait les écritures de 40 000 threads."
    b:
      en: "Thread queries stay in one partition, but a search on a company has no partition key value to route on and fans out to every physical partition."
      fr: "Les requêtes sur un thread restent dans une partition, mais une recherche sur une entreprise n'a aucune valeur de clé de partition pour le routage et est diffusée vers toutes les partitions physiques."
    c:
      en: "A key per turn spreads every thread across partitions, so even loading one thread fans out."
      fr: "Une clé par tour répartit chaque thread entre les partitions, si bien que même le chargement d'un thread est diffusé partout."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
