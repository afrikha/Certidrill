id: dp420-3b-sem-item-type
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Airlines uses the Agent Memory Toolkit for Azure Cosmos DB to give its booking agent memory. During a thread, a traveler says: "I always want an aisle seat."

    The agent must recall this preference in any later thread when it is relevant to the request, by searching memories by meaning.

    As which memory type should the preference be stored?
  fr: |
    Contoso Airlines utilise l'Agent Memory Toolkit pour Azure Cosmos DB afin de doter son agent de réservation d'une mémoire. Au cours d'un thread, un voyageur déclare : « Je veux toujours un siège côté couloir. »

    L'agent doit rappeler cette préférence dans tout thread ultérieur quand elle est pertinente pour la demande, en recherchant les mémoires par leur sens.

    Sous quel type de mémoire la préférence doit-elle être stockée ?
body:
  options:
    - id: a
      text: turn
    - id: b
      text: summary
    - id: c
      text: fact
    - id: d
      text: user_summary
answer: { optionId: c }
explanation:
  correct:
    en: "A fact is one discrete assertion extracted from a thread, such as a preference, a requirement or a confirmed decision, stored with an embedding so that it can be found by semantic search across threads."
    fr: "Un fait (fact) est une assertion distincte extraite d'un thread, comme une préférence, une exigence ou une décision confirmée, stockée avec une incorporation pour pouvoir être retrouvée par recherche sémantique d'un thread à l'autre."
  options:
    a:
      en: "A turn is the raw record of the messages; it belongs to its thread and is not the unit recalled across threads."
      fr: "Un tour (turn) est l'enregistrement brut des messages ; il appartient à son thread et n'est pas l'unité rappelée d'un thread à l'autre."
    b:
      en: "A summary condenses one thread as a whole; the preference would be mixed with everything else discussed in that thread."
      fr: "Un résumé (summary) condense un thread dans son ensemble ; la préférence serait mêlée à tout ce qui a été abordé dans ce thread."
    d:
      en: "A user summary is a cross-thread profile of the user, generated from the user's memories, not the searchable record of one preference."
      fr: "Un résumé d'utilisateur (user_summary) est un profil de l'utilisateur sur l'ensemble des threads, généré à partir de ses mémoires, pas l'enregistrement recherchable d'une préférence."
references:
  - title: Agent Memory Toolkit (Preview) - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-memory-toolkit
