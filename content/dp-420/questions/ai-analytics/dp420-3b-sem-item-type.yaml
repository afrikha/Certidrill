id: dp420-3b-sem-item-type
objective: "3.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso Airlines' booking agent stores its memory in Azure Cosmos DB for NoSQL. The turns of each thread are stored, one item per turn, in a container named **turns** that is partitioned by `/threadId` and has a default time to live of 30 days. During a thread, a traveler says: "I always want an aisle seat."

    The agent must recall this preference in any later thread of the traveler, including several months later.

    Where should the agent store the preference?
  fr: |
    L'agent de réservation de Contoso Airlines stocke sa mémoire dans Azure Cosmos DB for NoSQL. Les tours de chaque thread sont stockés, un élément par tour, dans un conteneur nommé **turns** partitionné par `/threadId` et doté d'une durée de vie par défaut de 30 jours. Au cours d'un thread, un voyageur déclare : « Je veux toujours un siège côté couloir. »

    L'agent doit rappeler cette préférence dans tout thread ultérieur du voyageur, y compris plusieurs mois plus tard.

    Où l'agent doit-il stocker la préférence ?
body:
  options:
    - { id: a, text: { en: "Only in the turn item that contains the traveler's message", fr: "Uniquement dans l'élément de tour qui contient le message du voyageur" } }
    - { id: b, text: { en: "In a summary item of the current thread, in the turns container", fr: "Dans un élément de résumé du thread en cours, dans le conteneur turns" } }
    - { id: c, text: { en: "In a semantic cache entry keyed on the embedding of the traveler's message", fr: "Dans une entrée de cache sémantique dont la clé est l'incorporation du message du voyageur" } }
    - { id: d, text: { en: "In a long-term memory item of the traveler that has no time to live", fr: "Dans un élément de mémoire à long terme du voyageur sans durée de vie" } }
answer: { optionId: d }
explanation:
  correct:
    en: "Short-term memory holds the recent turns of a thread and can be deleted by TTL or summarized. Long-term memory persists and accumulates knowledge across threads, such as user preferences, so the preference belongs in a long-term item of the traveler that doesn't expire."
    fr: "La mémoire à court terme contient les tours récents d'un thread et peut être supprimée par la TTL ou résumée. La mémoire à long terme persiste et accumule des connaissances d'un thread à l'autre, comme les préférences de l'utilisateur : la préférence doit donc aller dans un élément à long terme du voyageur qui n'expire pas."
  options:
    a:
      en: "The turn item belongs to its thread's partition and expires with the container's 30-day default TTL."
      fr: "L'élément de tour appartient à la partition de son thread et expire avec la TTL par défaut de 30 jours du conteneur."
    b:
      en: "A summary of the thread stays scoped to that thread, and in the turns container it also expires after 30 days."
      fr: "Un résumé du thread reste limité à ce thread et, dans le conteneur turns, il expire lui aussi au bout de 30 jours."
    c:
      en: "A semantic cache stores answers to reuse for similar questions; it isn't the store of a user's preferences."
      fr: "Un cache sémantique stocke des réponses à réutiliser pour des questions similaires ; ce n'est pas le magasin des préférences d'un utilisateur."
references:
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
