id: dp420-3c-mirror-setup-order
objective: "3.3.2"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account named cosmos-litware that uses periodic backup mode and allows public network access from all networks. The account has a single write region.

    You need to mirror the account's fleet database into a Microsoft Fabric workspace. You will authenticate with a read-write account key.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL nommé cosmos-litware qui utilise le mode de sauvegarde périodique et autorise l'accès réseau public depuis tous les réseaux. Le compte a une seule région d'écriture.

    Vous devez mettre en miroir la base de données fleet du compte dans un espace de travail Microsoft Fabric. Vous vous authentifierez avec une clé de compte en lecture-écriture.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: backup, text: { en: "Migrate cosmos-litware to continuous backup.", fr: "Migrer cosmos-litware vers la sauvegarde continue." } }
    - { id: item, text: { en: "In the Fabric workspace, create a Mirrored Azure Cosmos DB item.", fr: "Dans l'espace de travail Fabric, créer un élément Mirrored Azure Cosmos DB." } }
    - { id: conn, text: { en: "Create an Azure Cosmos DB for NoSQL connection with the account endpoint and the read-write key.", fr: "Créer une connexion Azure Cosmos DB for NoSQL avec le point de terminaison du compte et la clé en lecture-écriture." } }
    - { id: mirror, text: { en: "Select the fleet database and its containers, and then select Mirror database.", fr: "Sélectionner la base de données fleet et ses conteneurs, puis sélectionner Mirror database." } }
    - { id: olap, text: { en: "Enable analytical store on each container of the fleet database.", fr: "Activer le magasin analytique sur chaque conteneur de la base de données fleet." } }
    - { id: shortcut, text: { en: "Create a lakehouse with a OneLake shortcut to cosmos-litware.", fr: "Créer un lakehouse avec un raccourci OneLake vers cosmos-litware." } }
    - { id: acl, text: { en: "Enable the EnableFabricNetworkAclBypass capability on cosmos-litware.", fr: "Activer la fonctionnalité EnableFabricNetworkAclBypass sur cosmos-litware." } }
answer:
  sequence: [backup, item, conn, mirror]
explanation:
  correct:
    en: "Mirroring reads its initial snapshot from the continuous backup, so the account must be switched to continuous backup first. In Fabric, you then create the Mirrored Azure Cosmos DB item, connect it to the account with the endpoint and a read-write key, select the database and the containers, and start replication with Mirror database."
    fr: "La mise en miroir lit son instantané initial depuis la sauvegarde continue : le compte doit donc d'abord passer à la sauvegarde continue. Dans Fabric, vous créez ensuite l'élément Mirrored Azure Cosmos DB, vous le connectez au compte avec le point de terminaison et une clé en lecture-écriture, vous sélectionnez la base de données et les conteneurs, puis vous démarrez la réplication avec Mirror database."
  options:
    olap:
      en: "Mirroring doesn't use the analytical store."
      fr: "La mise en miroir n'utilise pas le magasin analytique."
    shortcut:
      en: "A lakehouse shortcut points to the mirrored tables in OneLake once mirroring exists; it can't connect to the account itself."
      fr: "Un raccourci de lakehouse pointe vers les tables en miroir dans OneLake une fois la mise en miroir en place ; il ne peut pas se connecter au compte lui-même."
    acl:
      en: "The network ACL bypass is needed only for accounts with network restrictions; this account allows access from all networks."
      fr: "Le contournement des ACL réseau n'est nécessaire que pour les comptes avec restrictions réseau ; ce compte autorise l'accès depuis tous les réseaux."
references:
  - title: "Tutorial: Configure Microsoft Fabric mirrored database for Azure Cosmos DB"
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-tutorial
