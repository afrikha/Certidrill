id: dp420-3a-fts-score-projection
objective: "3.1.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an Azure Cosmos DB for NoSQL container named **policies** with a full-text policy and a full-text index on `/body`. A developer wrote the following query, which fails:

    ```sql
    SELECT TOP 10 c.id, c.title,
        FullTextScore(c.body, "refund", "policy") AS relevance
    FROM c
    ORDER BY RANK FullTextScore(c.body, "refund", "policy")
    ```

    You need to fix the query. The results must stay sorted by BM25 relevance to the two words.

    What should you do?
  fr: |
    Adatum dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **policies** doté d'une stratégie de texte intégral et d'un index de texte intégral sur `/body`. Un développeur a écrit la requête suivante, qui échoue :

    ```sql
    SELECT TOP 10 c.id, c.title,
        FullTextScore(c.body, "refund", "policy") AS relevance
    FROM c
    ORDER BY RANK FullTextScore(c.body, "refund", "policy")
    ```

    Vous devez corriger la requête. Les résultats doivent rester triés selon leur pertinence BM25 par rapport aux deux mots.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Move the FullTextScore expression from the SELECT list to a WHERE clause.", fr: "Déplacer l'expression FullTextScore de la liste SELECT vers une clause WHERE." }
    - id: b
      text: { en: "Replace ORDER BY RANK with ORDER BY and add DESC after the FullTextScore expression.", fr: "Remplacer ORDER BY RANK par ORDER BY et ajouter DESC après l'expression FullTextScore." }
    - id: c
      text: { en: "Wrap the FullTextScore expression of the SELECT list in the RRF function.", fr: "Encapsuler l'expression FullTextScore de la liste SELECT dans la fonction RRF." }
    - id: d
      text: { en: "Remove the FullTextScore expression and its alias from the SELECT list.", fr: "Supprimer l'expression FullTextScore et son alias de la liste SELECT." }
answer: { optionId: d }
explanation:
  correct:
    en: "FullTextScore can be used only in an ORDER BY RANK clause or as an argument of RRF; it can't be part of a projection. Removing it from the SELECT list makes the query valid, and ORDER BY RANK still returns the items from the most to the least relevant."
    fr: "FullTextScore ne s'utilise que dans une clause ORDER BY RANK ou comme argument de RRF ; il ne peut pas faire partie d'une projection. Le supprimer de la liste SELECT rend la requête valide, et ORDER BY RANK renvoie toujours les éléments du plus pertinent au moins pertinent."
  options:
    a: { en: "FullTextScore can't be used in a WHERE clause either; filter with FullTextContains, FullTextContainsAll or FullTextContainsAny.", fr: "FullTextScore ne peut pas non plus être utilisé dans une clause WHERE ; filtrez avec FullTextContains, FullTextContainsAll ou FullTextContainsAny." }
    b: { en: "FullTextScore requires ORDER BY RANK; a plain ORDER BY is not accepted.", fr: "FullTextScore exige ORDER BY RANK ; un simple ORDER BY n'est pas accepté." }
    c: { en: "RRF can't be projected either: it is valid only in ORDER BY RANK.", fr: "RRF ne peut pas non plus être projeté : il n'est valide que dans ORDER BY RANK." }
references:
  - title: FULLTEXTSCORE - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/fulltextscore
  - title: RRF - Query Language for Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/cosmos-db/query/rrf
