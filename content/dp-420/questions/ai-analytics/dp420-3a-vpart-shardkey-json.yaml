id: dp420-3a-vpart-shardkey-json
objective: "3.1.3"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Litware stores 6 million products in an Azure Cosmos DB for NoSQL container whose partition key is `/productId`. Each product has a 1,536-dimension `/embedding` property and a `categoryId` property with 40 possible values. Every vector query searches the products of one category only, and approximate results are acceptable.

    You need to define the vector index of a new container so that each query searches a smaller index dedicated to its category, with the lowest latency.

    How should you complete the indexing policy extract? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware stocke 6 millions de produits dans un conteneur Azure Cosmos DB for NoSQL dont la clé de partition est `/productId`. Chaque produit possède une propriété `/embedding` de 1 536 dimensions et une propriété `categoryId` pouvant prendre 40 valeurs. Chaque requête vectorielle ne porte que sur les produits d'une catégorie, et des résultats approximatifs sont acceptables.

    Vous devez définir l'index vectoriel d'un nouveau conteneur de façon que chaque requête parcoure un index plus petit dédié à sa catégorie, avec la latence la plus faible.

    Comment devez-vous compléter l'extrait de la stratégie d'indexation ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: json
  template: |
    "vectorIndexes": [
      {
        "path": "/embedding",
        "type": "[[type]]",
        "[[key]]": [[val]]
      }
    ]
  slots:
    - id: type
      options:
        - { id: flat, text: flat }
        - { id: qflat, text: quantizedFlat }
        - { id: diskann, text: diskANN }
    - id: key
      options:
        - { id: shard, text: vectorIndexShardKey }
        - { id: quant, text: quantizerType }
        - { id: list, text: indexingSearchListSize }
    - id: val
      options:
        - { id: str, text: "\"/categoryId\"" }
        - { id: arrpk, text: "[\"/productId\"]" }
        - { id: arr, text: "[\"/categoryId\"]" }
answer:
  values: { type: diskann, key: shard, val: arr }
explanation:
  correct:
    en: "vectorIndexShardKey splits a DiskANN index into one index per value of the property it points to; the key is a single path enclosed in an array, here [\"/categoryId\"]. With about 150,000 products per category, diskANN is the lowest-latency choice, and a query focuses on one shard by filtering on c.categoryId."
    fr: "vectorIndexShardKey découpe un index DiskANN en un index par valeur de la propriété désignée ; la clé est un chemin unique placé dans un tableau, ici [\"/categoryId\"]. Avec environ 150 000 produits par catégorie, diskANN offre la latence la plus faible, et une requête se concentre sur un shard en filtrant sur c.categoryId."
  options:
    flat: { en: "flat supports at most 505 dimensions.", fr: "flat prend en charge au plus 505 dimensions." }
    qflat: { en: "quantizedFlat is a brute-force search recommended for 50,000 vectors or fewer; each category holds about 150,000.", fr: "quantizedFlat est une recherche en force brute recommandée pour 50 000 vecteurs ou moins ; chaque catégorie en compte environ 150 000." }
    quant: { en: "quantizerType selects product or spherical quantization; it doesn't split the index.", fr: "quantizerType choisit la quantification product ou spherical ; il ne découpe pas l'index." }
    list: { en: "indexingSearchListSize tunes the accuracy of the DiskANN build; it doesn't split the index.", fr: "indexingSearchListSize règle la précision de la construction DiskANN ; il ne découpe pas l'index." }
    str: { en: "The shard key is a path enclosed in an array, not a plain string.", fr: "La clé de shard est un chemin placé dans un tableau, pas une simple chaîne." }
    arrpk: { en: "productId is unique per item, so it would create one index per product instead of one per category.", fr: "productId est unique par élément : il créerait un index par produit au lieu d'un par catégorie." }
references:
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
