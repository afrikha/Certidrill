id: dp420-cs3b-semantic-memory
objective: "3.2.3"
type: single
caseStudy: dp420-cs3b-lucerne-publishing
difficulty: 2
status: draft
stem:
  en: |
    Scholar stores in the memories container facts such as "The user studies glacier albedo in the Alps". A researcher who has 300 stored facts starts a new thread with the question "Which papers discuss snow reflectivity measurements?".

    You need to design how Scholar stores and retrieves the facts to meet the memory requirement.

    What should you do?
  fr: |
    Scholar stocke dans le conteneur memories des faits comme « L'utilisateur étudie l'albédo des glaciers dans les Alpes ». Un chercheur qui a 300 faits stockés démarre une nouvelle conversation avec la question « Quels articles traitent des mesures de réflectivité de la neige ? ».

    Vous devez concevoir la façon dont Scholar stocke et récupère les faits pour satisfaire l'exigence relative à la mémoire.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Store an embedding with each fact, index it with a vector index, and rank the researcher's facts with `ORDER BY VectorDistance` against the question's embedding."
        fr: "Stocker une incorporation (embedding) avec chaque fait, l'indexer avec un index vectoriel, et classer les faits du chercheur avec `ORDER BY VectorDistance` par rapport à l'incorporation de la question."
    - id: b
      text:
        en: "Define a full-text policy and a full-text index on the fact text, and query the researcher's partition with `FullTextContainsAny` on the keywords of the question."
        fr: "Définir une stratégie de texte intégral et un index de texte intégral sur le texte du fait, et interroger la partition du chercheur avec `FullTextContainsAny` sur les mots clés de la question."
    - id: c
      text:
        en: "Store all the facts of a researcher in a single item whose `id` is the user ID, and load that item with a point read at the start of each thread."
        fr: "Stocker tous les faits d'un chercheur dans un seul élément dont l'`id` est l'ID de l'utilisateur, et charger cet élément par une lecture ponctuelle au début de chaque conversation."
    - id: d
      text:
        en: "Set `ttl` to -1 on all the messages of the researcher in threads, and send the full message history of the researcher to the model at the start of each thread."
        fr: "Définir `ttl` sur -1 pour tous les messages du chercheur dans threads, et envoyer tout l'historique de ses messages au modèle au début de chaque conversation."
answer: { optionId: a }
explanation:
  correct:
    en: "Semantic memory is retrieved by similarity: each fact carries an embedding, and the question's embedding is compared with them so that \"snow reflectivity\" matches \"glacier albedo\" although no word is shared. A vector policy and a vector index on the embedding path let `VectorDistance` rank the facts, and the `/userId` partition key keeps the search inside one researcher's facts."
    fr: "La mémoire sémantique est récupérée par similarité : chaque fait porte une incorporation, et celle de la question leur est comparée, de sorte que « réflectivité de la neige » correspond à « albédo des glaciers » sans mot commun. Une stratégie vectorielle et un index vectoriel sur le chemin de l'incorporation permettent à `VectorDistance` de classer les faits, et la clé de partition `/userId` limite la recherche aux faits d'un seul chercheur."
  options:
    b:
      en: "Full-text functions match the terms of the question (with optional fuzzy edits); they miss facts that express the same idea with different words, which the requirement explicitly covers."
      fr: "Les fonctions de texte intégral recherchent les termes de la question (avec d'éventuelles corrections approximatives) ; elles manquent les faits qui expriment la même idée avec d'autres mots, cas que l'exigence couvre explicitement."
    c:
      en: "A point read is cheap, but it returns every fact instead of the relevant ones, and an item that keeps growing with each fact runs into the 2 MB item size limit."
      fr: "Une lecture ponctuelle est peu coûteuse, mais elle renvoie tous les faits au lieu des faits pertinents, et un élément qui grossit à chaque fait se heurte à la taille maximale de 2 Mo d'un élément."
    d:
      en: "Sending the whole history does not select the relevant facts, makes prompts grow without limit, and keeps conversation data forever instead of using the memories container."
      fr: "Envoyer tout l'historique ne sélectionne pas les faits pertinents, fait grossir les invites sans limite et conserve les conversations indéfiniment au lieu d'utiliser le conteneur memories."
references:
  - title: Examine Memory Architecture Patterns - Training
    url: https://learn.microsoft.com/en-us/training/modules/aaai-design-multi-agent-memory-azure-cosmos-db/2-examine-memory-architecture-patterns
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
