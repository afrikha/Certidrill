id: dp420-3c-renamed-property
objective: "3.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam mirrors a customers container into Microsoft Fabric. Until June 2026, the application wrote the postal code of each customer in a property named `zip`. Since July 2026, it writes the postal code in a property named `postalCode` and no longer writes `zip`. Existing items weren't modified.

    An analyst queries the `customers` table in the SQL analytics endpoint.

    What does the table show for a customer created in August 2026?
  fr: |
    Fabrikam met en miroir un conteneur customers dans Microsoft Fabric. Jusqu'en juin 2026, l'application écrivait le code postal de chaque client dans une propriété nommée `zip`. Depuis juillet 2026, elle écrit le code postal dans une propriété nommée `postalCode` et n'écrit plus `zip`. Les éléments existants n'ont pas été modifiés.

    Un analyste interroge la table `customers` dans le point de terminaison d'analytique SQL.

    Qu'affiche la table pour un client créé en août 2026 ?
body:
  options:
    - { id: a, text: { en: "Only a postalCode column, which also holds the zip values of older customers", fr: "Une seule colonne postalCode, qui contient aussi les valeurs zip des clients plus anciens" } }
    - { id: b, text: { en: "A zip column that is NULL and a postalCode column that holds the value", fr: "Une colonne zip à NULL et une colonne postalCode qui contient la valeur" } }
    - { id: c, text: { en: "Only a zip column, which holds the value written in postalCode", fr: "Une seule colonne zip, qui contient la valeur écrite dans postalCode" } }
    - { id: d, text: { en: "No row, because the table stays in Running with warning until it is reseeded", fr: "Aucune ligne, car la table reste à l'état Running with warning jusqu'à son réamorçage" } }
answer: { optionId: b }
explanation:
  correct:
    en: "Mirroring tracks property changes continuously: a new property becomes a new column, and a renamed property keeps both columns. For items replicated after the rename, the old column is NULL, while older items keep their value in `zip` and are NULL in `postalCode`."
    fr: "La mise en miroir suit en continu les changements de propriétés : une nouvelle propriété devient une nouvelle colonne, et une propriété renommée conserve les deux colonnes. Pour les éléments répliqués après le renommage, l'ancienne colonne est NULL, tandis que les éléments plus anciens gardent leur valeur dans `zip` et sont NULL dans `postalCode`."
  options:
    a:
      en: "Mirroring doesn't merge or migrate columns; the old `zip` column stays with its values."
      fr: "La mise en miroir ne fusionne pas et ne migre pas les colonnes ; l'ancienne colonne `zip` reste avec ses valeurs."
    c:
      en: "Mirroring can't know that `postalCode` replaces `zip`; it adds a column for the new property."
      fr: "La mise en miroir ne peut pas savoir que `postalCode` remplace `zip` ; elle ajoute une colonne pour la nouvelle propriété."
    d:
      en: "New properties are detected automatically and don't stop or degrade replication of the table."
      fr: "Les nouvelles propriétés sont détectées automatiquement et n'arrêtent ni ne dégradent la réplication de la table."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
  - title: Limitations in Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-limitations
