id: dp420-3a-vshard-recreate
objective: "3.1.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin stores documents for 2,500 tenants in an Azure Cosmos DB for NoSQL container named **docs**. The partition key is `/region`, which has eight values, and each item has a `tenantId` property. The indexing policy has a diskANN index without a shard key on the 1,536-dimension `/embedding` path. Every vector query filters on `c.tenantId = @tenantId`.

    The queries have high RU charges, and users of small tenants report that relevant documents are missing from the results.

    You need to reduce the RU charge of the queries and improve their recall within each tenant. The partition key must not change.

    What should you do?
  fr: |
    Tailspin stocke les documents de 2 500 locataires dans un conteneur Azure Cosmos DB for NoSQL nommé **docs**. La clé de partition est `/region`, qui prend huit valeurs, et chaque élément possède une propriété `tenantId`. La stratégie d'indexation comporte un index diskANN sans clé de shard sur le chemin `/embedding` de 1 536 dimensions. Chaque requête vectorielle filtre sur `c.tenantId = @tenantId`.

    Les requêtes ont des coûts en RU élevés, et les utilisateurs des petits locataires signalent que des documents pertinents manquent dans les résultats.

    Vous devez réduire le coût en RU des requêtes et améliorer leur rappel au sein de chaque locataire. La clé de partition ne doit pas changer.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Add a searchListSizeMultiplier of 20 to the VectorDistance options of every query.", fr: "Ajouter un searchListSizeMultiplier de 20 aux options de VectorDistance de chaque requête." }
    - id: b
      text: { en: "Add /tenantId/? to the included paths of the indexing policy of docs.", fr: "Ajouter /tenantId/? aux chemins inclus de la stratégie d'indexation de docs." }
    - id: c
      text: { en: "Replace the diskANN index of docs with a flat index on /embedding.", fr: "Remplacer l'index diskANN de docs par un index flat sur /embedding." }
    - id: d
      text: { en: "Create a container with the same partition key and a diskANN index sharded on /tenantId, then migrate the items.", fr: "Créer un conteneur avec la même clé de partition et un index diskANN partitionné sur /tenantId, puis y migrer les éléments." }
answer: { optionId: d }
explanation:
  correct:
    en: "A sharded DiskANN index builds one index per tenantId value, so a query filtered on the tenant searches only that tenant's vectors: lower latency and RUs, and higher recall. The shard key can be any property, independent of the partition key. Vector indexes are immutable after creation, so the index is defined on a new container."
    fr: "Un index DiskANN partitionné construit un index par valeur de tenantId : une requête filtrée sur le locataire ne parcourt que les vecteurs de ce locataire, avec une latence et des RU plus faibles et un meilleur rappel. La clé de shard peut être n'importe quelle propriété, indépendamment de la clé de partition. Les index vectoriels étant immuables après leur création, l'index se définit sur un nouveau conteneur."
  options:
    a: { en: "A higher searchListSizeMultiplier can improve recall, but it raises latency and the RU charge.", fr: "Un searchListSizeMultiplier plus élevé peut améliorer le rappel, mais il augmente la latence et le coût en RU." }
    b: { en: "The default /* included path already range-indexes /tenantId; the filter still runs against one large DiskANN index per partition.", fr: "Le chemin inclus par défaut /* indexe déjà /tenantId en plage ; le filtre s'applique toujours à un grand index DiskANN par partition." }
    c: { en: "flat supports at most 505 dimensions, and vector indexes can't be changed in place.", fr: "flat prend en charge au plus 505 dimensions, et les index vectoriels ne peuvent pas être modifiés sur place." }
references:
  - title: Sharded DiskANN Focused Vector Search for Better Performance and Lower Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/sharded-diskann
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
