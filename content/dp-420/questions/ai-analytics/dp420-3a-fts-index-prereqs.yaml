id: dp420-3a-fts-index-prereqs
objective: "3.1.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind is creating an Azure Cosmos DB for NoSQL container named **feedback**. The Full Text & Hybrid Search for NoSQL API feature is enabled on the account. The application will run the following query:

    ```sql
    SELECT TOP 10 c.id, c.comment
    FROM c
    ORDER BY RANK FullTextScore(c.comment, "delivery", "late")
    ```

    You need to make sure that the query uses a full-text index.

    Which two definitions should the container include? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind crée un conteneur Azure Cosmos DB for NoSQL nommé **feedback**. La fonctionnalité Full Text & Hybrid Search for NoSQL API est activée sur le compte. L'application exécutera la requête suivante :

    ```sql
    SELECT TOP 10 c.id, c.comment
    FROM c
    ORDER BY RANK FullTextScore(c.comment, "delivery", "late")
    ```

    Vous devez vous assurer que la requête utilise un index de texte intégral.

    Quelles sont les deux définitions que le conteneur doit inclure ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - id: a
      text: { en: "A composite index on /comment ascending and /id ascending", fr: "Un index composite sur /comment croissant et /id croissant" }
    - id: b
      text: { en: "/comment in the fullTextIndexes section of the indexing policy", fr: "/comment dans la section fullTextIndexes de la stratégie d'indexation" }
    - id: c
      text: { en: "/comment/? in the excludedPaths section of the indexing policy", fr: "/comment/? dans la section excludedPaths de la stratégie d'indexation" }
    - id: d
      text: { en: "/comment in the vectorEmbeddings section of the vector embedding policy", fr: "/comment dans la section vectorEmbeddings de la stratégie d'incorporation vectorielle" }
    - id: e
      text: { en: "/comment in the fullTextPaths section of the full-text policy", fr: "/comment dans la section fullTextPaths de la stratégie de texte intégral" }
answer: { optionIds: [ b, e ] }
explanation:
  correct:
    en: "A full-text index needs two definitions: the container's full-text policy declares the path and its language in fullTextPaths, and the indexing policy declares the same path in fullTextIndexes. A full-text index must be on a path defined in the full-text policy."
    fr: "Un index de texte intégral exige deux définitions : la stratégie de texte intégral du conteneur déclare le chemin et sa langue dans fullTextPaths, et la stratégie d'indexation déclare le même chemin dans fullTextIndexes. Un index de texte intégral doit porter sur un chemin défini dans la stratégie de texte intégral."
  options:
    a: { en: "A composite index serves ORDER BY on several properties, not BM25 scoring.", fr: "Un index composite sert les ORDER BY sur plusieurs propriétés, pas le score BM25." }
    c: { en: "Excluding the path from the range index does not create a full-text index.", fr: "Exclure le chemin de l'index de plage ne crée pas d'index de texte intégral." }
    d: { en: "The vector embedding policy describes vector properties; /comment is text.", fr: "La stratégie d'incorporation vectorielle décrit des propriétés vectorielles ; /comment est du texte." }
references:
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
