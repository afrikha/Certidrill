id: dp420-3b-mem-container-csharp
objective: "3.2.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank is creating a container named **memories** for the long-term memory of its advisory agent. Each fact item has an embedding generated by text-embedding-3-small in `/embedding`. Each physical partition is expected to hold about 2 million facts, and vector queries must have the lowest latency and RU charge.

    Facts must never expire, except temporary preferences, for which the agent sets a `ttl` value on the item.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank crée un conteneur nommé **memories** pour la mémoire à long terme de son agent de conseil. Chaque élément de fait a une incorporation générée par text-embedding-3-small dans `/embedding`. Chaque partition physique devrait contenir environ 2 millions de faits, et les requêtes vectorielles doivent avoir la latence et les frais en RU les plus faibles.

    Les faits ne doivent jamais expirer, sauf les préférences temporaires, pour lesquelles l'agent définit une valeur `ttl` sur l'élément.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    var embeddings = new Collection<Embedding>
    {
        new Embedding { Path = "/embedding", DataType = VectorDataType.Float32,
                        DistanceFunction = DistanceFunction.Cosine, Dimensions = [[dims]] }
    };
    var props = new ContainerProperties("memories", "/userId")
    {
        VectorEmbeddingPolicy = new VectorEmbeddingPolicy(embeddings),
        DefaultTimeToLive = [[ttl]],
        IndexingPolicy = new IndexingPolicy
        {
            VectorIndexes = new() { new VectorIndexPath { Path = "/embedding", Type = VectorIndexType.[[type]] } }
        }
    };
    props.IndexingPolicy.IncludedPaths.Add(new IncludedPath { Path = "/*" });
    props.IndexingPolicy.ExcludedPaths.Add(new ExcludedPath { Path = "/embedding/*" });
    await database.CreateContainerIfNotExistsAsync(props);
  slots:
    - id: dims
      options:
        - { id: d505, text: "505" }
        - { id: d1536, text: "1536" }
        - { id: d3072, text: "3072" }
    - id: ttl
      options:
        - { id: minus1, text: "-1" }
        - { id: zero, text: "0" }
        - { id: nul, text: "null" }
    - id: type
      options:
        - { id: flat, text: Flat }
        - { id: qflat, text: QuantizedFlat }
        - { id: disk, text: DiskANN }
answer:
  values: { dims: d1536, ttl: minus1, type: disk }
explanation:
  correct:
    en: "text-embedding-3-small outputs 1,536 dimensions, and the policy must match the model. A default TTL of -1 enables TTL without expiring anything by default, so only items that set their own ttl expire; null would disable TTL and ignore item values. DiskANN gives the lowest latency and RU for millions of vectors per physical partition."
    fr: "text-embedding-3-small produit 1 536 dimensions, et la stratégie doit correspondre au modèle. Une TTL par défaut de -1 active la TTL sans rien faire expirer par défaut : seuls les éléments qui définissent leur propre ttl expirent ; null désactiverait la TTL et ignorerait les valeurs des éléments. DiskANN offre la latence et les frais en RU les plus faibles pour des millions de vecteurs par partition physique."
  options:
    d505:
      en: "505 is the dimension limit of a flat index, not the output size of the model."
      fr: "505 est la limite de dimensions d'un index flat, pas la taille de sortie du modèle."
    d3072:
      en: "3,072 dimensions is the output of text-embedding-3-large."
      fr: "3 072 dimensions est la sortie de text-embedding-3-large."
    zero:
      en: "A container default TTL must be -1 or a nonzero number of seconds."
      fr: "La TTL par défaut d'un conteneur doit être -1 ou un nombre de secondes non nul."
    nul:
      en: "Without a default TTL, the ttl value set on temporary preferences would have no effect."
      fr: "Sans TTL par défaut, la valeur ttl définie sur les préférences temporaires n'aurait aucun effet."
    flat:
      en: "A flat index supports at most 505 dimensions and runs an exact brute-force search."
      fr: "Un index flat prend en charge au plus 505 dimensions et effectue une recherche exacte par force brute."
    qflat:
      en: "quantizedFlat is a brute-force search on compressed vectors, recommended up to about 50,000 vectors in scope."
      fr: "quantizedFlat est une recherche par force brute sur des vecteurs compressés, recommandée jusqu'à environ 50 000 vecteurs dans l'étendue."
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
  - title: Agent Memory in Azure Cosmos DB for NoSQL - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agentic-memories
