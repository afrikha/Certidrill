seriesOrder: 1
difficulty: 2
status: draft
stem:
  en: You filter on the keywords with FullTextContainsAny and order by VectorDistance.
  fr: Vous filtrez sur les mots clés avec FullTextContainsAny et triez par VectorDistance.
body:
  solution:
    en: |
      You use the following query:

      ```sql
      SELECT TOP 10 c.id, c.name
      FROM c
      WHERE FullTextContainsAny(c.description, @term1, @term2)
      ORDER BY VectorDistance(c.embedding, @queryVector)
      ```
    fr: |
      Vous utilisez la requête suivante :

      ```sql
      SELECT TOP 10 c.id, c.name
      FROM c
      WHERE FullTextContainsAny(c.description, @term1, @term2)
      ORDER BY VectorDistance(c.embedding, @queryVector)
      ```
answer: { value: false }
explanation:
  correct:
    en: "`FullTextContainsAny` is a filter: it keeps only the products that contain at least one keyword and computes no BM25 score. The results are then ranked by vector similarity alone, so no fusion of the two rankings takes place and semantically close products without the exact keywords are excluded. Hybrid ranking requires `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))`."
    fr: "`FullTextContainsAny` est un filtre : il conserve uniquement les produits qui contiennent au moins un des mots clés et ne calcule aucun score BM25. Les résultats sont ensuite classés selon la seule similarité vectorielle : aucune fusion des deux classements n'a lieu, et les produits sémantiquement proches qui ne contiennent pas exactement les mots clés sont exclus. Le classement hybride exige `ORDER BY RANK RRF(VectorDistance(...), FullTextScore(...))`."
