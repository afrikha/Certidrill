id: dp420-3b-sem-hybrid-recall
objective: "3.2.3"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum is creating a container named **memories** for the long-term memory of its IT help desk agent. The container is partitioned by `/userId`. Each fact item has a `text` property and an embedding in `/embedding`, covered by a vector embedding policy and a DiskANN vector index. The vector search and full-text search features are enabled on the account.

    Facts often contain ticket numbers and product names, such as "TCK-48213 was solved by reinstalling Contoso VPN". Recall must rank the user's facts in one query by both their meaning and the exact terms of the question.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum crée un conteneur nommé **memories** pour la mémoire à long terme de son agent de support informatique. Le conteneur est partitionné par `/userId`. Chaque élément de fait a une propriété `text` et une incorporation dans `/embedding`, couverte par une stratégie d'incorporation vectorielle et un index vectoriel DiskANN. Les fonctionnalités de recherche vectorielle et de recherche en texte intégral sont activées sur le compte.

    Les faits contiennent souvent des numéros de ticket et des noms de produits, par exemple « TCK-48213 was solved by reinstalling Contoso VPN ». Le rappel doit classer les faits de l'utilisateur en une seule requête, à la fois selon leur sens et selon les termes exacts de la question.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Add /text to the full-text policy of the container and to the fullTextIndexes of its indexing policy.", fr: "Ajouter /text à la stratégie de texte intégral du conteneur et aux fullTextIndexes de sa stratégie d'indexation." } }
    - { id: b, text: { en: "Add a composite index on /userId and /text.", fr: "Ajouter un index composite sur /userId et /text." } }
    - { id: c, text: { en: "Filter on WHERE c.userId = @userId AND FullTextScore(c.text, @term) > 0, and order by VectorDistance.", fr: "Filtrer sur WHERE c.userId = @userId AND FullTextScore(c.text, @term) > 0, et trier par VectorDistance." } }
    - { id: d, text: { en: "Filter on WHERE c.userId = @userId and use ORDER BY RANK RRF(VectorDistance(c.embedding, @q), FullTextScore(c.text, @term)).", fr: "Filtrer sur WHERE c.userId = @userId et utiliser ORDER BY RANK RRF(VectorDistance(c.embedding, @q), FullTextScore(c.text, @term))." } }
    - { id: e, text: { en: "Store a second embedding of each fact generated from its ticket numbers only.", fr: "Stocker une seconde incorporation de chaque fait, générée uniquement à partir de ses numéros de ticket." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: "Hybrid search needs a container with a vector policy, a full-text policy, a vector index and a full-text index, so /text must be declared in the full-text policy and indexed in fullTextIndexes. RRF in ORDER BY RANK fuses the vector ranking (meaning) with the BM25 ranking of FullTextScore (exact terms), and the filter on userId keeps the query in the user's partition."
    fr: "La recherche hybride exige un conteneur avec une stratégie vectorielle, une stratégie de texte intégral, un index vectoriel et un index de texte intégral ; /text doit donc être déclaré dans la stratégie de texte intégral et indexé dans fullTextIndexes. RRF dans ORDER BY RANK fusionne le classement vectoriel (le sens) et le classement BM25 de FullTextScore (les termes exacts), et le filtre sur userId garde la requête dans la partition de l'utilisateur."
  options:
    b:
      en: "A composite index serves ORDER BY and range filters on scalar values; it provides no BM25 scoring."
      fr: "Un index composite sert les clauses ORDER BY et les filtres de plage sur des valeurs scalaires ; il ne fournit aucun score BM25."
    c:
      en: "FullTextScore can only appear in ORDER BY RANK; it cannot be used in a WHERE clause."
      fr: "FullTextScore ne peut apparaître que dans ORDER BY RANK ; il ne peut pas être utilisé dans une clause WHERE."
    e:
      en: "Embeddings capture meaning, not exact tokens; a second vector does not give lexical matching on ticket numbers."
      fr: "Les incorporations capturent le sens, pas les jetons exacts ; un second vecteur ne fournit pas de correspondance lexicale sur les numéros de ticket."
references:
  - title: Use Hybrid Search - Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/hybrid-search
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
