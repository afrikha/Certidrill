id: dp420-3b-perf-container-settings
objective: "3.1.6"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Wingtip Toys has an Azure Cosmos DB for NoSQL container named **guides** that serves full-text and vector queries. The vector search and full-text search features are enabled on the account. The container is configured as shown in the following table.

    Full-text queries that filter on `/title` consume more RU than the same queries on `/body`. Vector queries compare the query vector with every vector in scope.

    Answer each prompt by selecting the setting that causes the behavior.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **guides** qui sert des requêtes en texte intégral et vectorielles. Les fonctionnalités de recherche vectorielle et de recherche en texte intégral sont activées sur le compte. Le conteneur est configuré comme indiqué dans le tableau suivant.

    Les requêtes en texte intégral qui filtrent sur `/title` consomment plus de RU que les mêmes requêtes sur `/body`. Les requêtes vectorielles comparent le vecteur de la requête à chaque vecteur de l'étendue.

    Répondez à chaque consigne en sélectionnant le paramètre qui provoque le comportement.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "Full-text queries on /title consume more RU than on /body", fr: "Les requêtes en texte intégral sur /title consomment plus de RU que sur /body" }
    - id: p2
      text: { en: "Vector queries compare the query vector with every vector in scope", fr: "Les requêtes vectorielles comparent le vecteur de la requête à chaque vecteur de l'étendue" }
  grid:
    header: [{ en: "Setting", fr: "Paramètre" }, { en: "Value", fr: "Valeur" }]
    rows:
      - [{ text: { en: "Partition key", fr: "Clé de partition" } }, { text: /siteId, area: pk }]
      - [{ text: { en: "Vector embedding policy", fr: "Stratégie d'incorporation vectorielle" } }, { text: "/embedding, float32, cosine, 384", area: vpolicy }]
      - [{ text: { en: "Vector index", fr: "Index vectoriel" } }, { text: "/embedding, flat", area: vindex }]
      - [{ text: { en: "Excluded paths", fr: "Chemins exclus" } }, { text: "/\"_etag\"/?, /embedding/*", area: excluded }]
      - [{ text: { en: "Full-text policy", fr: "Stratégie de texte intégral" } }, { text: "/body (en-US), /title (en-US)", area: ftpolicy }]
      - [{ text: { en: "Full-text indexes", fr: "Index de texte intégral" } }, { text: /body, area: ftindex }]
answer:
  values: { p1: ftindex, p2: vindex }
explanation:
  correct:
    en: "/title is declared in the full-text policy but has no entry in fullTextIndexes, so full-text functions on it run without the full-text index, with a higher RU charge and longer execution. A flat vector index is an exact brute-force index: every vector in scope is compared with the query vector (100 % recall), which is allowed here because the embeddings have only 384 dimensions."
    fr: "/title est déclaré dans la stratégie de texte intégral mais n'a pas d'entrée dans fullTextIndexes : les fonctions de texte intégral sur ce chemin s'exécutent sans index de texte intégral, avec des frais en RU plus élevés et une exécution plus longue. Un index vectoriel flat est un index exact par force brute : chaque vecteur de l'étendue est comparé au vecteur de la requête (rappel de 100 %), ce qui est possible ici car les incorporations n'ont que 384 dimensions."
  options:
    ftpolicy:
      en: "The full-text policy correctly declares both paths; what is missing is the index on /title."
      fr: "La stratégie de texte intégral déclare correctement les deux chemins ; ce qui manque est l'index sur /title."
    excluded:
      en: "Excluding /embedding/* from the range index is recommended and has no effect on how the vector index searches."
      fr: "Exclure /embedding/* de l'index de plage est recommandé et n'a aucun effet sur la façon dont l'index vectoriel effectue la recherche."
references:
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
  - title: Indexing policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
