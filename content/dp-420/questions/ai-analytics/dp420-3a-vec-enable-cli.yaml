id: dp420-3a-vec-enable-cli
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account named **cosmos-proseware** in a resource group named **rg-ai**. The account uses periodic backup and a single write region. Proseware plans to create containers that have a vector embedding policy and vector indexes. Each container will have its own provisioned throughput.

    You need to prepare the deployment of the containers. The solution must minimize administrative effort.

    What should you do?
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-proseware** dans un groupe de ressources nommé **rg-ai**. Le compte utilise la sauvegarde périodique et une seule région d'écriture. Proseware prévoit de créer des conteneurs dotés d'une stratégie d'incorporation vectorielle et d'index vectoriels. Chaque conteneur aura son propre débit provisionné.

    Vous devez préparer le déploiement des conteneurs. La solution doit réduire au minimum l'effort d'administration.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Enable analytical storage on cosmos-proseware, and then create the containers with their vector policies.", fr: "Activer le stockage analytique sur cosmos-proseware, puis créer les conteneurs avec leurs stratégies vectorielles." } }
    - { id: b, text: { en: "Migrate cosmos-proseware to continuous backup, and then create the containers with their vector policies.", fr: "Migrer cosmos-proseware vers la sauvegarde continue, puis créer les conteneurs avec leurs stratégies vectorielles." } }
    - { id: c, text: { en: "Create the containers with their vector policies, without changing the configuration of cosmos-proseware.", fr: "Créer les conteneurs avec leurs stratégies vectorielles, sans modifier la configuration de cosmos-proseware." } }
    - { id: d, text: { en: "Enable multi-region writes on cosmos-proseware, and then create the containers with their vector policies.", fr: "Activer les écritures multirégions sur cosmos-proseware, puis créer les conteneurs avec leurs stratégies vectorielles." } }
answer: { optionId: c }
explanation:
  correct:
    en: "Azure Cosmos DB enables vector indexing and search by default: you don't need to register a feature or enable an account capability. You only define the vector embedding policy and the vector indexes when you create each container, which isn't in a database with shared throughput here."
    fr: "Azure Cosmos DB active l'indexation et la recherche vectorielles par défaut : il n'est pas nécessaire de s'inscrire à une fonctionnalité ni d'activer une fonctionnalité de compte. Il suffit de définir la stratégie d'incorporation vectorielle et les index vectoriels à la création de chaque conteneur, qui n'est pas ici dans une base de données à débit partagé."
  options:
    a: { en: "Analytical storage is the column store used by analytics integrations; vector search doesn't use it.", fr: "Le stockage analytique est le magasin en colonnes des intégrations analytiques ; la recherche vectorielle ne l'utilise pas." }
    b: { en: "Continuous backup sets how the account can be restored; it isn't a prerequisite of vector search, and the migration can't be undone.", fr: "La sauvegarde continue détermine comment le compte peut être restauré ; elle n'est pas un prérequis de la recherche vectorielle, et la migration est irréversible." }
    d: { en: "Multi-region writes change where writes are accepted; they aren't needed for vector indexing.", fr: "Les écritures multirégions changent l'endroit où les écritures sont acceptées ; elles ne sont pas nécessaires à l'indexation vectorielle." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
