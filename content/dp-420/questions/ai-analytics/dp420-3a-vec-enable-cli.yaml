id: dp420-3a-vec-enable-cli
objective: "3.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL account named **cosmos-proseware** in a resource group named **rg-ai**. Proseware plans to create containers that have a vector embedding policy and vector indexes.

    You need to prepare the account by using the Azure CLI.

    Which command should you run?
  fr: |
    Proseware dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-proseware** dans un groupe de ressources nommé **rg-ai**. Proseware prévoit de créer des conteneurs dotés d'une stratégie d'incorporation vectorielle et d'index vectoriels.

    Vous devez préparer le compte avec Azure CLI.

    Quelle commande devez-vous exécuter ?
body:
  options:
    - { id: a, text: "az cosmosdb update --resource-group rg-ai --name cosmos-proseware --enable-analytical-storage true" }
    - { id: b, text: "az cosmosdb update --resource-group rg-ai --name cosmos-proseware --enable-multiple-write-locations true" }
    - { id: c, text: "az cosmosdb update --resource-group rg-ai --name cosmos-proseware --capabilities EnableServerless" }
    - { id: d, text: "az cosmosdb update --resource-group rg-ai --name cosmos-proseware --capabilities EnableNoSQLVectorSearch" }
answer: { optionId: d }
explanation:
  correct:
    en: "Vector indexing and search are enabled on the account with the EnableNoSQLVectorSearch capability (or Settings > Features > Vector Search for NoSQL API in the portal). The request is autoapproved but can take up to 15 minutes to take effect."
    fr: "L'indexation et la recherche vectorielles s'activent sur le compte avec la fonctionnalité EnableNoSQLVectorSearch (ou Paramètres > Fonctionnalités > Vector Search for NoSQL API dans le portail). La demande est approuvée automatiquement, mais peut mettre jusqu'à 15 minutes pour prendre effet."
  options:
    a: { en: "Analytical storage is the column store used by analytics integrations, not vector search.", fr: "Le stockage analytique est le magasin en colonnes des intégrations analytiques, pas la recherche vectorielle." }
    b: { en: "Multiple write locations enables multi-region writes; it doesn't enable vector indexing.", fr: "Les emplacements d'écriture multiples activent les écritures multirégions ; ils n'activent pas l'indexation vectorielle." }
    c: { en: "EnableServerless selects the serverless capacity mode; it doesn't enable vector search.", fr: "EnableServerless sélectionne le mode de capacité serverless ; il n'active pas la recherche vectorielle." }
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
