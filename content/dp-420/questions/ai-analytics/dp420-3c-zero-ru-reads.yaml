id: dp420-3c-zero-ru-reads
objective: "3.3.3"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Proseware mirrors an Azure Cosmos DB for NoSQL database named telemetry into a Microsoft Fabric workspace. The containers are provisioned close to their peak load.

    Data scientists need to read three years of telemetry for analysis. The reads must not consume request units (RUs) on the Azure Cosmos DB account.

    Which two methods can the data scientists use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware met en miroir une base de données Azure Cosmos DB for NoSQL nommée telemetry dans un espace de travail Microsoft Fabric. Les conteneurs sont provisionnés au plus près de leur charge de pointe.

    Les scientifiques des données doivent lire trois ans de télémétrie pour leurs analyses. Les lectures ne doivent pas consommer d'unités de requête (RU) sur le compte Azure Cosmos DB.

    Quelles sont les deux méthodes que les scientifiques des données peuvent utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Read the containers with the cosmos.oltp format and a custom query.", fr: "Lire les conteneurs avec le format cosmos.oltp et une requête personnalisée." } }
    - { id: b, text: { en: "Query the containers in the Source database view of the mirrored database.", fr: "Interroger les conteneurs dans la vue Source database de la base de données en miroir." } }
    - { id: c, text: { en: "Query the mirrored tables with T-SQL through the SQL analytics endpoint.", fr: "Interroger les tables en miroir en T-SQL par le point de terminaison d'analytique SQL." } }
    - { id: d, text: { en: "Add a OneLake shortcut to the mirrored tables in a lakehouse, and query them in a Spark notebook.", fr: "Ajouter un raccourci OneLake vers les tables en miroir dans un lakehouse, puis les interroger dans un notebook Spark." } }
    - { id: e, text: { en: "Stream the change feed of the containers with the cosmos.oltp.changeFeed format from the beginning.", fr: "Diffuser le flux de modification des conteneurs avec le format cosmos.oltp.changeFeed depuis le début." } }
answer: { optionIds: [c, d] }
explanation:
  correct:
    en: "Both the SQL analytics endpoint and a lakehouse shortcut read the mirrored Delta tables in OneLake, not the Azure Cosmos DB account. Their queries are charged against the Fabric capacity, and replication itself doesn't consume the account's RUs."
    fr: "Le point de terminaison d'analytique SQL comme le raccourci de lakehouse lisent les tables Delta en miroir dans OneLake, et non le compte Azure Cosmos DB. Leurs requêtes sont imputées à la capacité Fabric, et la réplication elle-même ne consomme pas les RU du compte."
  options:
    a:
      en: "The cosmos.oltp format reads the operational container, with or without a custom query, and consumes RUs."
      fr: "Le format cosmos.oltp lit le conteneur opérationnel, avec ou sans requête personnalisée, et consomme des RU."
    b:
      en: "The Source database view sends queries to the live account and consumes its RUs."
      fr: "La vue Source database envoie les requêtes au compte en direct et consomme ses RU."
    e:
      en: "Reading the change feed with the Spark connector is a read on the container and consumes RUs."
      fr: "Lire le flux de modification avec le connecteur Spark est une lecture sur le conteneur et consomme des RU."
references:
  - title: Mirroring Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db
  - title: Frequently asked questions for Microsoft Fabric mirrored databases from Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/fabric/mirroring/azure-cosmos-db-faq
