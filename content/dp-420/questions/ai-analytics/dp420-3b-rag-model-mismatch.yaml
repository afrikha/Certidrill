id: dp420-3b-rag-model-mismatch
objective: "3.1.7"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores 2 million manual chunks in an Azure Cosmos DB for NoSQL container. Each chunk has an embedding generated with text-embedding-3-small and stored in `/embedding`. The vector embedding policy declares 1,536 dimensions and the cosine distance function.

    A developer changed the question-embedding code of the RAG application to text-embedding-3-large. Since then, the retrieval query returns no relevant chunks, and the answers of the chat model are no longer grounded.

    You need to fix retrieval with the least effort. What should you do?
  fr: |
    Adatum stocke 2 millions de segments de manuels dans un conteneur Azure Cosmos DB for NoSQL. Chaque segment a une incorporation générée avec text-embedding-3-small et stockée dans `/embedding`. La stratégie d'incorporation vectorielle déclare 1 536 dimensions et la fonction de distance cosinus.

    Un développeur a remplacé, dans le code d'incorporation des questions de l'application RAG, le modèle par text-embedding-3-large. Depuis, la requête de récupération ne renvoie aucun segment pertinent et les réponses du modèle de conversation ne sont plus ancrées.

    Vous devez corriger la récupération avec le moins d'effort possible. Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Pass {\"distanceFunction\": \"DotProduct\"} as the options argument of VectorDistance.", fr: "Passer {\"distanceFunction\": \"DotProduct\"} comme argument d'options de VectorDistance." }
    - id: b
      text: { en: "Set the dimensions of the vector embedding policy to 3,072.", fr: "Définir les dimensions de la stratégie d'incorporation vectorielle sur 3 072." }
    - id: c
      text: { en: "Generate the question embeddings with text-embedding-3-small again.", fr: "Générer de nouveau les incorporations des questions avec text-embedding-3-small." }
    - id: d
      text: { en: "Raise the searchListSizeMultiplier of the retrieval query.", fr: "Augmenter la valeur searchListSizeMultiplier de la requête de récupération." }
answer: { optionId: c }
explanation:
  correct:
    en: "The query vector and the stored vectors must come from the same embedding model, with the same number of dimensions; text-embedding-3-large outputs 3,072 dimensions in a different vector space. Reverting the question embeddings to text-embedding-3-small restores comparable vectors without touching the 2 million stored chunks."
    fr: "Le vecteur de la requête et les vecteurs stockés doivent provenir du même modèle d'incorporation, avec le même nombre de dimensions ; text-embedding-3-large produit 3 072 dimensions dans un espace vectoriel différent. Revenir à text-embedding-3-small pour les questions rétablit des vecteurs comparables sans toucher aux 2 millions de segments stockés."
  options:
    b:
      en: "The stored chunks have 1,536 dimensions; changing the policy would require a new container and re-embedding every chunk, which is not the least effort."
      fr: "Les segments stockés ont 1 536 dimensions ; modifier la stratégie exigerait un nouveau conteneur et le recalcul de l'incorporation de chaque segment, ce qui n'est pas le moindre effort."
    a:
      en: "Changing the distance function does not make vectors from two different models comparable."
      fr: "Changer la fonction de distance ne rend pas comparables des vecteurs issus de deux modèles différents."
    d:
      en: "A larger search list improves the recall of the approximate search, but vectors from another model remain meaningless to compare."
      fr: "Une liste de recherche plus grande améliore le rappel de la recherche approximative, mais comparer des vecteurs issus d'un autre modèle reste dénué de sens."
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/vector-search
  - title: Foundry Models sold by Azure - Microsoft Foundry
    url: https://learn.microsoft.com/en-us/azure/ai-foundry/foundry-models/concepts/models-sold-directly-by-azure
