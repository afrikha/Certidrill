id: dp420-sr1-catalog-ranking-2
objective: "3.1.5"
type: series_yesno
series: dp420-sr1-catalog-ranking
seriesOrder: 2
difficulty: 3
status: draft
stem:
  en: You rank with RRF and also return the keyword score of each product.
  fr: Vous classez avec RRF et renvoyez aussi le score des mots clés de chaque produit.
body:
  solution:
    en: |
      You use the following query:

      ```sql
      SELECT TOP 10 c.id, c.name,
          FullTextScore(c.description, @term1, @term2) AS keywordScore
      FROM c
      ORDER BY RANK RRF(
          VectorDistance(c.embedding, @queryVector),
          FullTextScore(c.description, @term1, @term2))
      ```
    fr: |
      Vous utilisez la requête suivante :

      ```sql
      SELECT TOP 10 c.id, c.name,
          FullTextScore(c.description, @term1, @term2) AS keywordScore
      FROM c
      ORDER BY RANK RRF(
          VectorDistance(c.embedding, @queryVector),
          FullTextScore(c.description, @term1, @term2))
      ```
answer: { value: false }
explanation:
  correct:
    en: The `ORDER BY RANK RRF(...)` clause is correct, but `FullTextScore` can be used only in an `ORDER BY RANK` clause. It cannot be projected in the `SELECT` list or used in a `WHERE` clause, so the service rejects this query.
    fr: "La clause `ORDER BY RANK RRF(...)` est correcte, mais `FullTextScore` ne peut être utilisée que dans une clause `ORDER BY RANK`. Elle ne peut pas être projetée dans la liste `SELECT` ni utilisée dans une clause `WHERE` : le service rejette donc cette requête."
references:
  - title: Use Full-Text Search - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/full-text-search
