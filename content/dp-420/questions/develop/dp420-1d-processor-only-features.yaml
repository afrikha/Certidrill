id: dp420-1d-processor-only-features
objective: "1.4.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    You are comparing the change feed processor with the change feed pull model for a .NET application that reads an Azure Cosmos DB for NoSQL container.

    Which two capabilities does the change feed processor provide without extra code, whereas the pull model requires you to implement them?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous comparez le processeur de flux de modification au modèle de tirage du flux de modification pour une application .NET qui lit un conteneur Azure Cosmos DB for NoSQL.

    Quelles sont les deux capacités que le processeur de flux de modification fournit sans code supplémentaire, alors que le modèle de tirage vous oblige à les implémenter ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Distributing the work across several compute instances and rebalancing it when instances are added or removed", fr: "Répartir le travail entre plusieurs instances de calcul et le rééquilibrer lorsque des instances sont ajoutées ou retirées" } }
    - { id: b, text: { en: "Saving the processed position after each successfully processed batch", fr: "Enregistrer la position traitée après chaque lot traité avec succès" } }
    - { id: c, text: { en: "Reading the changes of a single partition key value", fr: "Lire les modifications d'une seule valeur de clé de partition" } }
    - { id: d, text: { en: "Reading the change feed in all versions and deletes mode", fr: "Lire le flux de modification en mode toutes les versions et suppressions" } }
    - { id: e, text: { en: "Replaying past changes from the beginning of the container", fr: "Rejouer les modifications passées depuis le début du conteneur" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The processor distributes leases evenly across the instances of a deployment unit and rebalances them dynamically, and it updates the lease store after each batch that the delegate processes successfully. With the pull model, you parallelize manually with FeedRange values and persist continuation tokens yourself.
    fr: |
      Le processeur répartit uniformément les baux entre les instances d'une unité de déploiement et les rééquilibre dynamiquement, et il met à jour le magasin de baux après chaque lot traité avec succès par le délégué. Avec le modèle de tirage, vous parallélisez manuellement avec des valeurs FeedRange et conservez vous-même les jetons de continuation.
  options:
    c: { en: "Only the pull model can read a single partition key value; the processor does not support it.", fr: "Seul le modèle de tirage peut lire une seule valeur de clé de partition ; le processeur ne le prend pas en charge." }
    d: { en: "Both the processor and the pull model support all versions and deletes mode in .NET.", fr: "Le processeur et le modèle de tirage prennent tous deux en charge le mode toutes les versions et suppressions en .NET." }
    e: { en: "Both models can replay past changes in latest version mode.", fr: "Les deux modèles peuvent rejouer les modifications passées en mode dernière version." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
