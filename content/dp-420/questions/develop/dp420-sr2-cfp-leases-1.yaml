id: dp420-sr2-cfp-leases-1
objective: "1.4.3"
type: series_yesno
series: dp420-sr2-cfp-leases
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: |
    Both services use the same processor name and the leases container.
  fr: |
    Les deux services utilisent le même nom de processeur et le conteneur leases.
body:
  solution:
    en: |
      Every instance of both services builds its processor with the following code. `Environment.MachineName` is unique for each of the six instances.

      ```csharp
      ChangeFeedProcessor processor = client.GetContainer("sales", "orders")
          .GetChangeFeedProcessorBuilder<Order>(
              processorName: "ordersProcessor",
              onChangesDelegate: HandleChangesAsync)
          .WithInstanceName(Environment.MachineName)
          .WithLeaseContainer(client.GetContainer("sales", "leases"))
          .Build();
      ```
    fr: |
      Chaque instance des deux services construit son processeur avec le code suivant. `Environment.MachineName` est unique pour chacune des six instances.

      ```csharp
      ChangeFeedProcessor processor = client.GetContainer("sales", "orders")
          .GetChangeFeedProcessorBuilder<Order>(
              processorName: "ordersProcessor",
              onChangesDelegate: HandleChangesAsync)
          .WithInstanceName(Environment.MachineName)
          .WithLeaseContainer(client.GetContainer("sales", "leases"))
          .Build();
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      Instances that share the same processor name and the same lease container form a single deployment unit, and each lease is owned by one instance at a time. The six instances therefore split the changes between them, so each change reaches either InvoiceWorker or SearchIndexer, not both.
    fr: |
      Les instances qui partagent le même nom de processeur et le même conteneur de bail forment une seule unité de déploiement, et chaque bail appartient à une seule instance à la fois. Les six instances se répartissent donc les modifications : chaque modification parvient à InvoiceWorker ou à SearchIndexer, mais pas aux deux.
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
