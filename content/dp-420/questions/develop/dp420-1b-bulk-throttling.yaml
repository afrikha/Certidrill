id: dp420-1b-bulk-throttling
objective: "1.2.4"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Tailspin imports 2 million items into an Azure Cosmos DB for NoSQL container by using the .NET SDK with `AllowBulkExecution` enabled. The container has 4,000 RU/s of manual throughput, and the budget does not allow more.

    About 8 percent of the operations fail with status code 429 after the SDK stops retrying. The import can take several hours.

    You need the import to complete with the fewest failed operations. What should you do?
  fr: |
    Tailspin importe 2 millions d'éléments dans un conteneur Azure Cosmos DB for NoSQL avec le SDK .NET et `AllowBulkExecution` activé. Le conteneur dispose de 4 000 RU/s de débit manuel, et le budget ne permet pas davantage.

    Environ 8 % des opérations échouent avec le code d'état 429 une fois que le SDK a cessé de réessayer. L'import peut durer plusieurs heures.

    Vous devez faire en sorte que l'import se termine avec le moins d'opérations en échec possible. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace the bulk tasks with one TransactionalBatch per item so that each write is retried automatically.", fr: "Remplacer les tâches en bloc par un TransactionalBatch par élément pour que chaque écriture soit réessayée automatiquement." } }
    - { id: b, text: { en: "Increase MaxRetryAttemptsOnRateLimitedRequests and MaxRetryWaitTimeOnRateLimitedRequests in CosmosClientOptions.", fr: "Augmenter MaxRetryAttemptsOnRateLimitedRequests et MaxRetryWaitTimeOnRateLimitedRequests dans CosmosClientOptions." } }
    - { id: c, text: { en: "Set ConsistencyLevel to Eventual in CosmosClientOptions to reduce the RU charge of each write.", fr: "Définir ConsistencyLevel sur Eventual dans CosmosClientOptions pour réduire la charge en RU de chaque écriture." } }
    - { id: d, text: { en: "Set MaxItemCount to -1 in the request options so that the SDK chooses the optimal batch size.", fr: "Définir MaxItemCount sur -1 dans les options de requête pour que le SDK choisisse la taille de lot optimale." } }
answer: { optionId: b }
explanation:
  correct:
    en: "Bulk support has no hidden retry behavior: retries of rate-limited requests are controlled by CosmosClientOptions.MaxRetryAttemptsOnRateLimitedRequests and MaxRetryWaitTimeOnRateLimitedRequests. When the provisioned throughput is much lower than the volume requires, setting them to high values makes the import slower but more likely to succeed completely."
    fr: "Le mode bloc n'a aucun comportement de nouvelle tentative caché : les nouvelles tentatives des requêtes limitées sont contrôlées par CosmosClientOptions.MaxRetryAttemptsOnRateLimitedRequests et MaxRetryWaitTimeOnRateLimitedRequests. Quand le débit approvisionné est très inférieur à ce que le volume exige, leur donner des valeurs élevées rend l'import plus lent mais augmente ses chances de réussir entièrement."
  options:
    c: { en: "Consistency changes the cost of reads, not of writes, so throttling continues.", fr: "La cohérence modifie le coût des lectures, pas celui des écritures : la limitation continue." }
    d: { en: "MaxItemCount sets the page size of queries and feeds; it has no effect on bulk writes.", fr: "MaxItemCount définit la taille de page des requêtes et des flux ; il n'a aucun effet sur les écritures en bloc." }
    a: { en: "A batch per item adds overhead without adding throughput, and batches are subject to the same rate limiting.", fr: "Un lot par élément ajoute une surcharge sans augmenter le débit, et les lots sont soumis à la même limitation." }
references:
  - title: Migrate From the Bulk Executor Library to the Bulk Support in .NET V3 SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-migrate-from-bulk-executor-library
