id: dp420-1d-random-suffix-reads
objective: "1.3.7"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum ingests vehicle data into an Azure Cosmos DB for NoSQL container. To avoid a hot partition, the partition key value is the event date followed by a random suffix from 1 to 400, for example `2026-11-17.215`. Writes are now evenly distributed.

    A new feature must read the events of one vehicle, identified by its vehicle identification number (VIN), for a given date. The lookup runs thousands of times per minute and must consume as few RUs as possible. Writes must stay evenly distributed.

    What should you change?
  fr: |
    Adatum ingère des données de véhicules dans un conteneur Azure Cosmos DB for NoSQL. Pour éviter une partition chaude, la valeur de la clé de partition est la date de l'événement suivie d'un suffixe aléatoire de 1 à 400, par exemple `2026-11-17.215`. Les écritures sont désormais réparties uniformément.

    Une nouvelle fonctionnalité doit lire les événements d'un véhicule, identifié par son numéro d'identification (VIN), pour une date donnée. La recherche s'exécute des milliers de fois par minute et doit consommer le moins de RU possible. Les écritures doivent rester réparties uniformément.

    Que devez-vous modifier ?
body:
  options:
    - { id: a, text: { en: "Keep the random suffix and run a query that filters on the VIN and the date.", fr: "Conserver le suffixe aléatoire et exécuter une requête qui filtre sur le VIN et la date." } }
    - { id: b, text: { en: "Increase the random suffix range to 1 to 4,000 to create more logical partitions.", fr: "Étendre la plage du suffixe aléatoire de 1 à 4 000 pour créer davantage de partitions logiques." } }
    - { id: c, text: { en: "Use the date without a suffix as the partition key and add a composite index on the VIN.", fr: "Utiliser la date sans suffixe comme clé de partition et ajouter un index composite sur le VIN." } }
    - { id: d, text: { en: "Replace the random suffix with a suffix from 1 to 400 calculated from a hash of the VIN.", fr: "Remplacer le suffixe aléatoire par un suffixe de 1 à 400 calculé à partir d'un hachage du VIN." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      A precalculated suffix derived from the VIN keeps the writes spread across 400 values per day, like a random suffix, but the application can compute the full partition key value of a vehicle for a date. The lookup then targets a single logical partition instead of all the suffix values.
    fr: |
      Un suffixe précalculé dérivé du VIN répartit toujours les écritures sur 400 valeurs par jour, comme un suffixe aléatoire, mais l'application peut calculer la valeur complète de la clé de partition d'un véhicule pour une date. La recherche cible alors une seule partition logique au lieu de toutes les valeurs de suffixe.
  options:
    a: { en: "With a random suffix, the application does not know which partition key value holds the vehicle, so the query must cover every suffix.", fr: "Avec un suffixe aléatoire, l'application ne sait pas quelle valeur de clé de partition contient le véhicule : la requête doit couvrir tous les suffixes." }
    c: { en: "All the writes of a day would go to one logical partition, which recreates the hot partition.", fr: "Toutes les écritures d'une journée iraient dans une seule partition logique, ce qui recrée la partition chaude." }
    b: { en: "More random values make the reads even more expensive because the suffix is still unknown at read time.", fr: "Davantage de valeurs aléatoires rendent les lectures encore plus coûteuses, car le suffixe reste inconnu au moment de la lecture." }
references:
  - title: Create a Synthetic Partition Key - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
