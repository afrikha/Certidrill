id: dp420-1b-continuation-yesno
objective: "1.2.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Adatum runs a stateless .NET service on several containers in Azure Kubernetes Service (AKS). The service pages through query results from an Azure Cosmos DB for NoSQL container that has eight physical partitions, and it stores continuation tokens in a queue so that any replica can resume the work.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute un service .NET sans état sur plusieurs conteneurs dans Azure Kubernetes Service (AKS). Le service parcourt page par page les résultats de requêtes sur un conteneur Azure Cosmos DB for NoSQL qui compte huit partitions physiques, et il stocke les jetons de continuation dans une file d'attente pour que n'importe quel réplica puisse reprendre le travail.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A replica other than the one that started the query can resume it from a stored continuation token."
        fr: "Un réplica autre que celui qui a lancé la requête peut la reprendre à partir d'un jeton de continuation stocké."
    - id: s2
      text:
        en: "A cross-partition query on this container returns one continuation token per physical partition for each page."
        fr: "Une requête entre partitions sur ce conteneur renvoie un jeton de continuation par partition physique pour chaque page."
    - id: s3
      text:
        en: "A stored continuation token remains usable as long as the service keeps using the same SDK version."
        fr: "Un jeton de continuation stocké reste utilisable tant que le service continue d'utiliser la même version du SDK."
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: "Queries are stateless on the server, so any client can resume a query from its continuation token. Whatever the number of physical partitions, a query returns a single continuation token. Continuation tokens do not expire as long as you use the same SDK version."
    fr: "Les requêtes sont sans état côté serveur : n'importe quel client peut reprendre une requête à partir de son jeton de continuation. Quel que soit le nombre de partitions physiques, une requête renvoie un seul jeton de continuation. Les jetons de continuation n'expirent pas tant que vous utilisez la même version du SDK."
references:
  - title: Pagination - Query language in Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/pagination
