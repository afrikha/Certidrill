id: dp420-1b-id-only-lookup
objective: "1.2.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware stores support tickets in an Azure Cosmos DB for NoSQL container partitioned by `/tenantId`. Ticket `id` values are GUIDs. An internal diagnostics tool, used a few times a day, receives only a ticket `id` copied from an application log, without the tenant ID.

    The tool must retrieve the ticket. You must not change the container or the data model.

    What should you do?
  fr: |
    Litware stocke des tickets de support dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/tenantId`. Les valeurs `id` des tickets sont des GUID. Un outil de diagnostic interne, utilisé quelques fois par jour, reçoit uniquement un `id` de ticket copié depuis un journal d'application, sans l'ID de locataire.

    L'outil doit récupérer le ticket. Vous ne devez modifier ni le conteneur ni le modèle de données.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call ReadManyItemsAsync with a list that contains only the id.", fr: "Appeler ReadManyItemsAsync avec une liste qui contient uniquement l'id." } }
    - { id: b, text: { en: "Run a parameterized query that filters on c.id, without setting a partition key in the request options.", fr: "Exécuter une requête paramétrée qui filtre sur c.id, sans définir de clé de partition dans les options de requête." } }
    - { id: c, text: { en: "Call ReadItemAsync with the id and PartitionKey.None as the partition key.", fr: "Appeler ReadItemAsync avec l'id et PartitionKey.None comme clé de partition." } }
    - { id: d, text: { en: "Call ReadItemAsync with the id passed as both the item id and the partition key value.", fr: "Appeler ReadItemAsync en passant l'id à la fois comme id de l'élément et comme valeur de clé de partition." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A point read needs both the id and the partition key value. When only the id is known, you must run a query that looks up the item across the logical partitions, which is less efficient but acceptable for an occasional diagnostics tool."
    fr: "Une lecture ponctuelle exige à la fois l'id et la valeur de clé de partition. Quand seul l'id est connu, vous devez exécuter une requête qui recherche l'élément dans les partitions logiques, ce qui est moins efficace mais acceptable pour un outil de diagnostic occasionnel."
  options:
    c: { en: "PartitionKey.None targets items that have no partition key value; the tickets have a tenantId.", fr: "PartitionKey.None cible les éléments sans valeur de clé de partition ; les tickets ont un tenantId." }
    d: { en: "The partition key value is the tenant ID, so this point read looks in the wrong logical partition and returns not found.", fr: "La valeur de clé de partition est l'ID de locataire : cette lecture ponctuelle cherche dans la mauvaise partition logique et renvoie une erreur introuvable." }
    a: { en: "ReadManyItemsAsync also requires a partition key value for each id.", fr: "ReadManyItemsAsync exige aussi une valeur de clé de partition pour chaque id." }
references:
  - title: Read an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-read-item
