id: dp420-1c-pk-statements
objective: "1.3.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Adatum is choosing partition keys for several new Azure Cosmos DB for NoSQL containers.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum choisit les clés de partition de plusieurs nouveaux conteneurs Azure Cosmos DB for NoSQL.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          All the items that share a partition key value can together store up to 20 GB.
        fr: |-
          L'ensemble des éléments qui partagent une valeur de clé de partition peut stocker jusqu'à 20 Go.
    - id: s2
      text:
        en: |-
          You can move an item to another logical partition by running a patch operation that sets a new value on its partition key property.
        fr: |-
          Vous pouvez déplacer un élément vers une autre partition logique en exécutant une opération de correctif (patch) qui affecte une nouvelle valeur à sa propriété de clé de partition.
    - id: s3
      text:
        en: |-
          In a container partitioned by /id, two items can have the same id value.
        fr: |-
          Dans un conteneur partitionné par /id, deux éléments peuvent avoir la même valeur d'id.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |-
      A logical partition (all the items with one partition key value) is limited to 20 GB. Partition key values are immutable; to move an item you create a new item with the new value and delete the original, which is not atomic across logical partitions. An id is unique within a logical partition, so when /id is the partition key it becomes unique for the whole container.
    fr: |-
      Une partition logique (tous les éléments d'une valeur de clé de partition) est limitée à 20 Go. Les valeurs de clé de partition sont immuables ; pour déplacer un élément, vous créez un nouvel élément avec la nouvelle valeur et supprimez l'original, ce qui n'est pas atomique entre partitions logiques. Un id est unique dans une partition logique : lorsque /id est la clé de partition, il devient unique pour tout le conteneur.
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
