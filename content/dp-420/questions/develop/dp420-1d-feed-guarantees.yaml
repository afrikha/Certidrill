id: dp420-1d-feed-guarantees
objective: "1.4.1"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Your team is designing a consumer of the change feed of an Azure Cosmos DB for NoSQL container named **orders**, which uses the partition key `/customerId`. The consumer will use latest version mode.

    Which two statements about the change feed are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Votre équipe conçoit un consommateur du flux de modification d'un conteneur Azure Cosmos DB for NoSQL nommé **orders**, qui utilise la clé de partition `/customerId`. Le consommateur utilisera le mode dernière version.

    Quelles sont les deux affirmations vraies concernant le flux de modification ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Changes are delivered in modification order for each customerId value.", fr: "Les modifications sont livrées dans l'ordre de modification pour chaque valeur de customerId." } }
    - { id: b, text: { en: "Changes are delivered in modification order across all the customerId values of the container.", fr: "Les modifications sont livrées dans l'ordre de modification pour l'ensemble des valeurs de customerId du conteneur." } }
    - { id: c, text: { en: "The change feed must be enabled on the orders container before the consumer can read it.", fr: "Le flux de modification doit être activé sur le conteneur orders avant que le consommateur puisse le lire." } }
    - { id: d, text: { en: "Reading the change feed consumes request units from the provisioned throughput.", fr: "La lecture du flux de modification consomme des unités de requête sur le débit approvisionné." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      The sort order of the change feed is guaranteed per partition key value, not across partition key values. Change feed reads are charged like any other operation and use the provisioned throughput, in any region of the account.
    fr: |
      L'ordre du flux de modification est garanti par valeur de clé de partition, pas entre les valeurs de clé de partition. Les lectures du flux de modification sont facturées comme toute autre opération et utilisent le débit approvisionné, dans n'importe quelle région du compte.
  options:
    b: { en: "There is no guaranteed order across different partition key values.", fr: "Il n'existe aucun ordre garanti entre différentes valeurs de clé de partition." }
    c: { en: "The change feed is enabled by default for every container; only all versions and deletes mode needs extra configuration.", fr: "Le flux de modification est activé par défaut pour chaque conteneur ; seul le mode toutes les versions et suppressions demande une configuration supplémentaire." }
references:
  - title: Work with the Change Feed - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed
