id: dp420-1c-synth-random-statements
objective: "1.3.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Wingtip partitions an Azure Cosmos DB for NoSQL container by a synthetic `partitionKey` property. When an order event is written, the application sets `partitionKey` to the event date followed by a random number from 1 to 100, for example `2026-11-17.42`.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip partitionne un conteneur Azure Cosmos DB for NoSQL par une propriété synthétique `partitionKey`. Lorsqu'un événement de commande est écrit, l'application définit `partitionKey` sur la date de l'événement suivie d'un nombre aléatoire de 1 à 100, par exemple `2026-11-17.42`.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The writes of one day are spread across up to 100 logical partitions.", fr: "Les écritures d'une journée sont réparties sur jusqu'à 100 partitions logiques." } }
    - { id: b, text: { en: "The container always has exactly 100 physical partitions.", fr: "Le conteneur a toujours exactement 100 partitions physiques." } }
    - { id: c, text: { en: "Finding one event by its id requires checking every suffix value of its date.", fr: "Retrouver un événement par son id impose de vérifier toutes les valeurs de suffixe de sa date." } }
    - { id: d, text: { en: "A transactional batch can include events of the same day that have different suffixes.", fr: "Un lot transactionnel peut inclure des événements du même jour qui ont des suffixes différents." } }
    - { id: e, text: { en: "A point read of an event requires only its id and its date.", fr: "Une lecture ponctuelle d'un événement ne nécessite que son id et sa date." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      The random suffix multiplies the partition key values of a day by 100, which spreads the writes and improves parallelism. The trade-off is that the suffix of an item is unknown when you read it, so locating one event means querying all the suffixes of its date.
    fr: |-
      Le suffixe aléatoire multiplie par 100 les valeurs de clé de partition d'une journée, ce qui répartit les écritures et améliore le parallélisme. La contrepartie est que le suffixe d'un élément est inconnu au moment de la lecture : retrouver un événement impose d'interroger tous les suffixes de sa date.
  options:
    b: { en: "Logical partitions are mapped to physical partitions by the service; their number depends on throughput and storage, not on the number of suffixes.", fr: "Les partitions logiques sont associées aux partitions physiques par le service ; leur nombre dépend du débit et du stockage, pas du nombre de suffixes." }
    d: { en: "A transactional batch is limited to items that share one partition key value.", fr: "Un lot transactionnel est limité aux éléments qui partagent une valeur de clé de partition." }
    e: { en: "A point read needs the full partition key value, including the random suffix, which the reader does not know.", fr: "Une lecture ponctuelle exige la valeur de clé de partition complète, y compris le suffixe aléatoire, que le lecteur ne connaît pas." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
