id: dp420-cs2b-events-synthetic
objective: "1.3.6"
type: single
caseStudy: dp420-cs2b-wide-world-importers
difficulty: 2
status: draft
stem:
  en: |
    You need to define the value of a synthetic `partitionKey` property for the new trackingEvents container. The solution must meet the tracking events requirement.

    Which value should the application write in `partitionKey`?
  fr: |
    Vous devez définir la valeur d'une propriété synthétique `partitionKey` pour le nouveau conteneur trackingEvents. La solution doit respecter l'exigence relative aux événements de suivi.

    Quelle valeur l'application doit-elle écrire dans `partitionKey` ?
body:
  options:
    - { id: a, text: { en: "The eventDate followed by a random number from 1 to 400", fr: "La valeur eventDate suivie d'un nombre aléatoire de 1 à 400" } }
    - { id: b, text: { en: "The eventDate followed by the hour of the event, from 00 to 23", fr: "La valeur eventDate suivie de l'heure de l'événement, de 00 à 23" } }
    - { id: c, text: { en: "The eventDate followed by the status of the event", fr: "La valeur eventDate suivie du statut de l'événement" } }
    - { id: d, text: { en: "The eventDate followed by a number from 1 to 400 computed from a hash of the trackingNumber", fr: "La valeur eventDate suivie d'un nombre de 1 à 400 calculé à partir d'un hachage du trackingNumber" } }
answer: { optionId: d }
explanation:
  correct:
    en: A precalculated suffix spreads the events of a day across up to 400 logical partitions, like a random suffix. Because the suffix is computed from the tracking number, the portal can compute the partition key value from the tracking number and the date and read the events of that tracking number from a single logical partition.
    fr: Un suffixe précalculé répartit les événements d'une journée entre 400 partitions logiques au maximum, comme un suffixe aléatoire. Comme le suffixe est calculé à partir du numéro de suivi, le portail peut calculer la valeur de la clé de partition à partir du numéro de suivi et de la date, et lire les événements de ce numéro dans une seule partition logique.
  options:
    a: { en: "A random suffix spreads writes well, but the portal cannot know which suffix was used, so it would have to query every suffix value.", fr: "Un suffixe aléatoire répartit bien les écritures, mais le portail ne peut pas savoir quel suffixe a été utilisé : il devrait interroger toutes les valeurs de suffixe." }
    b: { en: "All the events of the current hour would still target a single logical partition, and the events of one tracking number span several hours.", fr: "Tous les événements de l'heure en cours cibleraient toujours une seule partition logique, et les événements d'un numéro de suivi s'étalent sur plusieurs heures." }
    c: { en: "A status has only a few values, so the writes of a day would still go to a few logical partitions.", fr: "Un statut n'a que quelques valeurs : les écritures d'une journée iraient toujours vers quelques partitions logiques." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
