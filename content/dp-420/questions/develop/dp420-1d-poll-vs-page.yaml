id: dp420-1d-poll-vs-page
objective: "1.4.2"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    A .NET application reads the change feed of an Azure Cosmos DB for NoSQL container in two components:

    - A change feed processor that must check for new changes every two seconds when it has caught up.
    - A pull model reader that must receive at most 100 items per page.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Une application .NET lit le flux de modification d'un conteneur Azure Cosmos DB for NoSQL dans deux composants :

    - Un processeur de flux de modification qui doit vérifier les nouvelles modifications toutes les deux secondes lorsqu'il a rattrapé son retard.
    - Un lecteur en modèle de tirage qui doit recevoir au plus 100 éléments par page.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    // Processor
    ChangeFeedProcessor processor = container
        .GetChangeFeedProcessorBuilder<Order>("orderSync", HandleChangesAsync)
        .WithInstanceName(Environment.MachineName)
        .WithLeaseContainer(leaseContainer)
        .[[poll]]
        .Build();

    // Pull model
    FeedIterator<Order> iterator = container.GetChangeFeedIterator<Order>(
        ChangeFeedStartFrom.Now(),
        ChangeFeedMode.LatestVersion,
        new ChangeFeedRequestOptions { [[page]] = 100 });
  slots:
    - id: poll
      options:
        - { id: pint, text: WithPollInterval(TimeSpan.FromSeconds(2)) }
        - { id: pstart, text: WithStartTime(DateTime.UtcNow.AddSeconds(2)) }
        - { id: pinst, text: WithInstanceName("poll-2s") }
    - id: page
      options:
        - { id: gsize, text: PageSizeHint }
        - { id: gmax, text: MaxItemCount }
        - { id: gconc, text: MaxConcurrency }
answer:
  values: { poll: pint, page: gsize }
explanation:
  correct:
    en: |
      The processor polls automatically; WithPollInterval sets how long it sleeps before rechecking when there are no changes. In the pull model, ChangeFeedRequestOptions.PageSizeHint sets the maximum number of items per page; a page can still exceed it so that the changes of one transaction stay together.
    fr: |
      Le processeur interroge automatiquement ; WithPollInterval définit la durée de pause avant une nouvelle vérification en l'absence de modifications. Dans le modèle de tirage, ChangeFeedRequestOptions.PageSizeHint définit le nombre maximal d'éléments par page ; une page peut néanmoins le dépasser pour que les modifications d'une même transaction restent groupées.
  options:
    pstart: { en: "WithStartTime sets the initial starting point only; it does not control polling.", fr: "WithStartTime définit uniquement le point de départ initial ; il ne contrôle pas l'interrogation." }
    gmax: { en: "MaxItemCount is a property of QueryRequestOptions, used for queries.", fr: "MaxItemCount est une propriété de QueryRequestOptions, utilisée pour les requêtes." }
    gconc: { en: "MaxConcurrency controls parallel query execution, not the change feed page size.", fr: "MaxConcurrency contrôle l'exécution parallèle des requêtes, pas la taille de page du flux de modification." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
