id: dp420-1b-occ-ordering
objective: "1.2.6"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Tailspin's .NET inventory service updates warehouse items in Azure Cosmos DB for NoSQL. Several instances of the service can update the same item concurrently. No update may be lost, and the service must not hold locks.

    Which four actions should the service perform in sequence for each update? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Le service d'inventaire .NET de Tailspin met à jour des éléments d'entrepôt dans Azure Cosmos DB for NoSQL. Plusieurs instances du service peuvent mettre à jour le même élément simultanément. Aucune mise à jour ne doit être perdue, et le service ne doit pas maintenir de verrous.

    Quelles sont les quatre actions à effectuer dans l'ordre pour chaque mise à jour ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: read, text: { en: "Read the item with a point read and keep its ETag.", fr: "Lire l'élément par une lecture ponctuelle et conserver son ETag." } }
    - { id: modify, text: { en: "Apply the change to the item in memory.", fr: "Appliquer la modification à l'élément en mémoire." } }
    - { id: replace, text: { en: "Replace the item with IfMatchEtag set to the saved ETag.", fr: "Remplacer l'élément avec IfMatchEtag défini sur l'ETag conservé." } }
    - { id: retry, text: { en: "If the service returns HTTP 412, start again from the read.", fr: "Si le service renvoie le code HTTP 412, recommencer à partir de la lecture." } }
    - { id: strong, text: { en: "Set the request's consistency level to Strong.", fr: "Définir le niveau de cohérence de la requête sur Strong." } }
    - { id: ifnone, text: { en: "Replace the item with IfNoneMatchEtag set to the saved ETag.", fr: "Remplacer l'élément avec IfNoneMatchEtag défini sur l'ETag conservé." } }
    - { id: recreate, text: { en: "Delete the item, then create it again with the new values.", fr: "Supprimer l'élément, puis le recréer avec les nouvelles valeurs." } }
answer:
  sequence: [ read, modify, replace, retry ]
explanation:
  correct:
    en: "Optimistic concurrency reads the item and its _etag, changes it locally, and sends the replace with an If-Match condition. If another writer updated the item in the meantime, its _etag changed and the service returns 412 Precondition Failed; the service then reads the latest version and reapplies its change."
    fr: "Le contrôle d'accès concurrentiel optimiste lit l'élément et son _etag, le modifie localement, puis envoie le remplacement avec une condition If-Match. Si un autre processus a mis à jour l'élément entre-temps, son _etag a changé et le service renvoie 412 Precondition Failed ; le service lit alors la dernière version et applique de nouveau sa modification."
  options:
    strong: { en: "Consistency affects what reads return; it does not prevent two writers from overwriting each other.", fr: "La cohérence porte sur ce que renvoient les lectures ; elle n'empêche pas deux processus de s'écraser." }
    ifnone: { en: "If-None-Match decides whether to fetch a resource again; it does not guard a replace.", fr: "If-None-Match détermine s'il faut récupérer de nouveau une ressource ; il ne protège pas un remplacement." }
    recreate: { en: "Delete and create are two separate operations and would still lose concurrent updates.", fr: "Supprimer puis créer sont deux opérations distinctes et feraient toujours perdre des mises à jour simultanées." }
references:
  - title: Database Transactions and Optimistic Concurrency Control - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
