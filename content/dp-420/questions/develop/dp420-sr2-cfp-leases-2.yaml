id: dp420-sr2-cfp-leases-2
objective: "1.4.3"
type: series_yesno
series: dp420-sr2-cfp-leases
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    Each service uses its own processor name and both share the leases container.
  fr: |
    Chaque service utilise son propre nom de processeur et les deux partagent le conteneur leases.
body:
  solution:
    en: |
      Every instance builds its processor with the following code. `serviceName` is `"invoices"` in InvoiceWorker and `"search"` in SearchIndexer, and `Environment.MachineName` is unique for each of the six instances.

      ```csharp
      ChangeFeedProcessor processor = client.GetContainer("sales", "orders")
          .GetChangeFeedProcessorBuilder<Order>(
              processorName: serviceName,
              onChangesDelegate: HandleChangesAsync)
          .WithInstanceName(Environment.MachineName)
          .WithLeaseContainer(client.GetContainer("sales", "leases"))
          .Build();
      ```
    fr: |
      Chaque instance construit son processeur avec le code suivant. `serviceName` vaut `"invoices"` dans InvoiceWorker et `"search"` dans SearchIndexer, et `Environment.MachineName` est unique pour chacune des six instances.

      ```csharp
      ChangeFeedProcessor processor = client.GetContainer("sales", "orders")
          .GetChangeFeedProcessorBuilder<Order>(
              processorName: serviceName,
              onChangesDelegate: HandleChangesAsync)
          .WithInstanceName(Environment.MachineName)
          .WithLeaseContainer(client.GetContainer("sales", "leases"))
          .Build();
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A lease container can be shared by several deployment units when each one has a different processor name; each unit keeps an independent state in the container, so both services receive every change. Within a service, the instances share the processor name and have distinct instance names, so the leases are distributed across the three instances.
    fr: |
      Un conteneur de bail peut être partagé par plusieurs unités de déploiement lorsque chacune a un nom de processeur différent ; chaque unité conserve un état indépendant dans le conteneur : les deux services reçoivent donc toutes les modifications. Au sein d'un service, les instances partagent le nom de processeur et ont des noms d'instance distincts : les baux sont répartis entre les trois instances.
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
