id: dp420-1d-serverless-vs-manual
objective: "1.3.8"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware plans an internal expense application on Azure Cosmos DB for NoSQL. You estimate the workload as follows:

    - One Azure region, no availability zones.
    - Traffic only during business hours, with bursts of up to 800 RU/s.
    - 30 million RUs consumed per month and 20 GB of data.

    Another Azure Cosmos DB account in the subscription already uses the free tier. Use these rates for the estimate: standard (manual) throughput $0.008 per 100 RU/s per hour, autoscale throughput $0.012 per 100 RU/s per hour, serverless $0.25 per million RUs, and 730 hours per month. Storage is billed at the same rate in every option.

    You need to choose the capacity configuration that minimizes the monthly cost and serves the bursts without rate limiting.

    Which configuration should you choose?
  fr: |
    Proseware prévoit une application interne de notes de frais sur Azure Cosmos DB for NoSQL. Vous estimez la charge de travail comme suit :

    - Une seule région Azure, sans zones de disponibilité.
    - Du trafic uniquement pendant les heures ouvrées, avec des pics allant jusqu'à 800 RU/s.
    - 30 millions de RU consommées par mois et 20 Go de données.

    Un autre compte Azure Cosmos DB de l'abonnement utilise déjà le niveau gratuit. Utilisez les tarifs suivants pour l'estimation : débit standard (manuel) 0,008 $ par 100 RU/s et par heure, débit avec mise à l'échelle automatique 0,012 $ par 100 RU/s et par heure, serverless 0,25 $ par million de RU, et 730 heures par mois. Le stockage est facturé au même tarif dans toutes les options.

    Vous devez choisir la configuration de capacité qui réduit au minimum le coût mensuel et absorbe les pics sans limitation du débit.

    Quelle configuration devez-vous choisir ?
body:
  options:
    - { id: a, text: { en: "A provisioned throughput account with a container at 800 RU/s of manual throughput", fr: "Un compte en débit approvisionné avec un conteneur à 800 RU/s de débit manuel" } }
    - { id: b, text: { en: "A provisioned throughput account with a container at an autoscale maximum of 1,000 RU/s", fr: "Un compte en débit approvisionné avec un conteneur à 1 000 RU/s maximum en mise à l'échelle automatique" } }
    - { id: c, text: { en: "A provisioned throughput account with a container at 400 RU/s of manual throughput", fr: "Un compte en débit approvisionné avec un conteneur à 400 RU/s de débit manuel" } }
    - { id: d, text: { en: "A serverless account with one container", fr: "Un compte serverless avec un conteneur" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Serverless bills only the RUs consumed, 30 × $0.25 = $7.50 per month, and suits a single-region workload with intermittent traffic. Manual throughput at 800 RU/s costs 8 × $0.008 × 730 = $46.72 per month whether it is used or not. Autoscale with a 1,000 RU/s maximum never bills less than 100 RU/s per hour, at least $8.76 per month, and more during business hours.
    fr: |
      Le mode serverless ne facture que les RU consommées, soit 30 × 0,25 $ = 7,50 $ par mois, et convient à une charge de travail mono-région au trafic intermittent. Un débit manuel de 800 RU/s coûte 8 × 0,008 $ × 730 = 46,72 $ par mois, qu'il soit utilisé ou non. La mise à l'échelle automatique avec un maximum de 1 000 RU/s ne facture jamais moins de 100 RU/s par heure, soit au moins 8,76 $ par mois, et davantage pendant les heures ouvrées.
  options:
    a: { en: "$46.72 per month for capacity that is idle most of the time.", fr: "46,72 $ par mois pour une capacité inutilisée la plupart du temps." }
    b: { en: "The autoscale minimum alone (10% of the maximum, at the autoscale rate) already costs more than the serverless estimate.", fr: "Le seul minimum de la mise à l'échelle automatique (10 % du maximum, au tarif de mise à l'échelle automatique) coûte déjà plus que l'estimation serverless." }
    c: { en: "400 RU/s cannot serve bursts of 800 RU/s without rate limiting.", fr: "400 RU/s ne peuvent pas absorber des pics de 800 RU/s sans limitation du débit." }
references:
  - title: Compare Provisioned Throughput and Serverless - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/throughput-serverless
  - title: How to Choose Between Manual and Autoscale - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-choose-offer
