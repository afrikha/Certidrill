id: dp420-1c-model-features-dragdrop
objective: "1.3.1"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Wingtip is building a retail application on Azure Cosmos DB for NoSQL. Orders and their order lines are stored in a container partitioned by `/orderId`. Posts of the community forum are stored in a container partitioned by `/postId`.

    You need to meet the operational requirements shown in the answer area.

    Which feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip développe une application de vente au détail sur Azure Cosmos DB for NoSQL. Les commandes et leurs lignes sont stockées dans un conteneur partitionné par `/orderId`. Les publications du forum communautaire sont stockées dans un conteneur partitionné par `/postId`.

    Vous devez satisfaire les exigences opérationnelles indiquées dans la zone de réponse.

    Quelle fonctionnalité devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cfp, text: { en: "Change feed processor", fr: "Processeur de flux de modification" } }
    - { id: ttl, text: { en: "Time to live (TTL)", fr: "Durée de vie (TTL)" } }
    - { id: batch, text: { en: "Transactional batch", fr: "Lot transactionnel" } }
    - { id: etag, text: { en: "Optimistic concurrency with the item ETag", fr: "Accès concurrentiel optimiste avec l'ETag de l'élément" } }
    - { id: bulk, text: { en: "Bulk execution mode", fr: "Mode d'exécution en bloc" } }
  targets:
    - id: copy
      text: { en: "Maintain a copy of each forum post in a second container partitioned by /userId", fr: "Maintenir une copie de chaque publication du forum dans un second conteneur partitionné par /userId" }
    - id: expire
      text: { en: "Remove abandoned shopping cart items automatically seven days after their last update", fr: "Supprimer automatiquement les paniers abandonnés sept jours après leur dernière mise à jour" }
    - id: atomic
      text: { en: "Insert an order and its order lines so that either all items are written or none", fr: "Insérer une commande et ses lignes de sorte que tous les éléments soient écrits ou aucun" }
    - id: lost
      text: { en: "Prevent one support agent from silently overwriting another agent's change to the same order", fr: "Empêcher un agent du support d'écraser sans le savoir la modification d'un autre agent sur la même commande" }
answer:
  mapping: { copy: cfp, expire: ttl, atomic: batch, lost: etag }
explanation:
  correct:
    en: |-
      The change feed processor reads every change of the posts container and can write each post to a container partitioned differently. TTL deletes items in the background a set number of seconds after their last modification. A transactional batch runs operations on items that share a partition key value (here the orderId) as one all-or-nothing unit. Sending the item's ETag in an If-Match condition makes a conflicting write fail with HTTP 412 instead of overwriting the other change.
    fr: |-
      Le processeur de flux de modification lit chaque modification du conteneur des publications et peut écrire chaque publication dans un conteneur partitionné différemment. La durée de vie supprime les éléments en arrière-plan un nombre défini de secondes après leur dernière modification. Un lot transactionnel exécute des opérations sur des éléments qui partagent une valeur de clé de partition (ici l'orderId) comme une seule unité tout-ou-rien. Envoyer l'ETag de l'élément dans une condition If-Match fait échouer une écriture concurrente avec un code HTTP 412 au lieu d'écraser l'autre modification.
  options:
    bulk: { en: "Bulk mode maximizes throughput for many independent operations, without any transactional guarantee.", fr: "Le mode en bloc maximise le débit de nombreuses opérations indépendantes, sans garantie transactionnelle." }
references:
  - title: Transactions and optimistic concurrency control
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
  - title: How to model and partition data using a real-world example
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/model-partition-example
