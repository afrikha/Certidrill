id: dp420-cs2c-telemetry-throughput
objective: "1.1.3"
type: single
caseStudy: dp420-cs2c-vanarsdel
difficulty: 1
status: draft
stem:
  en: |
    You need to change the throughput configuration of telemetry to meet the second requirement.

    What should you configure?
  fr: |
    Vous devez modifier la configuration du débit de telemetry pour respecter la deuxième exigence.

    Que devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Autoscale throughput with a maximum of 30,000 RU/s", fr: "Un débit en mise à l'échelle automatique (autoscale) avec un maximum de 30 000 RU/s" } }
    - { id: b, text: { en: "Manual throughput of 3,000 RU/s", fr: "Un débit manuel de 3 000 RU/s" } }
    - { id: c, text: { en: "Autoscale throughput with a maximum of 3,000 RU/s", fr: "Un débit en mise à l'échelle automatique (autoscale) avec un maximum de 3 000 RU/s" } }
    - { id: d, text: { en: "A new serverless account for telemetry", fr: "Un nouveau compte serverless pour telemetry" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Autoscale scales the throughput of the container between 10 percent of the configured maximum and the maximum, so a 30,000 RU/s maximum serves the business-hours peak and drops to 3,000 RU/s at night and on weekends, which lowers the cost outside business hours. Provisioned throughput, unlike serverless, can be used in any number of regions.
    fr: |
      La mise à l'échelle automatique fait varier le débit du conteneur entre 10 % du maximum configuré et ce maximum : un maximum de 30 000 RU/s absorbe le pic des heures ouvrées et descend à 3 000 RU/s la nuit et le week-end, ce qui réduit le coût en dehors des heures ouvrées. Le débit approvisionné, contrairement au mode serverless, peut être utilisé dans un nombre illimité de régions.
  options:
    b: { en: "3,000 RU/s of manual throughput would throttle requests during business hours, when traffic reaches 30,000 RU/s.", fr: "Un débit manuel de 3 000 RU/s limiterait les requêtes pendant les heures ouvrées, lorsque le trafic atteint 30 000 RU/s." }
    c: { en: "A maximum of 3,000 RU/s caps the throughput below the business-hours peak, so requests would be throttled.", fr: "Un maximum de 3 000 RU/s plafonne le débit sous le pic des heures ouvrées : les requêtes seraient limitées." }
    d: { en: "Serverless accounts run in a single Azure region, so North Europe could not be added, and serverless suits intermittent traffic rather than sustained daily peaks.", fr: "Les comptes serverless s'exécutent dans une seule région Azure : North Europe ne pourrait pas être ajoutée, et le mode serverless convient au trafic intermittent plutôt qu'à des pics quotidiens soutenus." }
references:
  - title: How to choose between provisioned throughput and serverless
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/throughput-serverless
