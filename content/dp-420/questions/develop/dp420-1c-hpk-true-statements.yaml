id: dp420-1c-hpk-true-statements
objective: "1.3.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Tailspin plans to use hierarchical partition keys with the levels `/tenantId` and `/userId` for a multi-tenant Azure Cosmos DB for NoSQL workload. Tailspin already has a container partitioned by `/tenantId` that holds the production data.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin prévoit d'utiliser des clés de partition hiérarchiques avec les niveaux `/tenantId` et `/userId` pour une charge de travail Azure Cosmos DB for NoSQL multilocataire. Tailspin dispose déjà d'un conteneur partitionné par `/tenantId` qui contient les données de production.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "To use the new key, Tailspin must create a new container and copy the existing data into it.", fr: "Pour utiliser la nouvelle clé, Tailspin doit créer un conteneur et y copier les données existantes." } }
    - { id: b, text: { en: "A query that filters only on userId is routed to the partitions of the matching users.", fr: "Une requête qui filtre uniquement sur userId est routée vers les partitions des utilisateurs correspondants." } }
    - { id: c, text: { en: "One tenant can store more than 20 GB as long as each tenantId and userId pair stays within 20 GB.", fr: "Un locataire peut stocker plus de 20 Go tant que chaque paire tenantId et userId reste dans la limite de 20 Go." } }
    - { id: d, text: { en: "Each level can have a low cardinality because the combined key has a high cardinality.", fr: "Chaque niveau peut avoir une faible cardinalité, car la clé combinée a une cardinalité élevée." } }
    - { id: e, text: { en: "With hierarchical keys, each physical partition can store up to 100 GB.", fr: "Avec des clés hiérarchiques, chaque partition physique peut stocker jusqu'à 100 Go." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Hierarchical partition keys can only be defined when a container is created; for an existing container you create a new one and move the data with a container copy job or the change feed. The 20 GB limit applies to the full key value (tenantId + userId), so a tenant's total storage is 20 GB times its number of users.
    fr: |-
      Les clés de partition hiérarchiques ne peuvent être définies qu'à la création d'un conteneur ; pour un conteneur existant, vous en créez un nouveau et y déplacez les données avec une tâche de copie de conteneur ou le flux de modification. La limite de 20 Go s'applique à la valeur de clé complète (tenantId + userId) : le stockage total d'un locataire vaut 20 Go multiplié par son nombre d'utilisateurs.
  options:
    b: { en: "A filter on a lower level without the first level fans out to all physical partitions.", fr: "Un filtre sur un niveau inférieur sans le premier niveau est diffusé vers toutes les partitions physiques." }
    d: { en: "Every level should have a high cardinality; a low-cardinality first level keeps writes on few physical partitions.", fr: "Chaque niveau doit avoir une cardinalité élevée ; un premier niveau à faible cardinalité maintient les écritures sur peu de partitions physiques." }
    e: { en: "A physical partition still holds up to 50 GB and 10,000 RU/s with hierarchical keys.", fr: "Une partition physique contient toujours jusqu'à 50 Go et 10 000 RU/s avec des clés hiérarchiques." }
references:
  - title: Frequently asked questions on hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys-faq
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
