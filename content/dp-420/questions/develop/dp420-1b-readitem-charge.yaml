id: dp420-1b-readitem-charge
objective: "1.2.2"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Adatum stores orders in an Azure Cosmos DB for NoSQL container partitioned by `/customerId`. A .NET method receives `orderId` (the item's `id`) and `customerId`.

    The method must read the order with a point read and log the RU charge of the operation.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke des commandes dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/customerId`. Une méthode .NET reçoit `orderId` (l'`id` de l'élément) et `customerId`.

    La méthode doit lire la commande par une lecture ponctuelle et journaliser la charge en RU de l'opération.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    ItemResponse<Order> response = await container.[[method]]<Order>(
        id: orderId,
        partitionKey: [[pk]]);

    logger.LogInformation("Charge: {ru}", response.[[ru]]);
    Order order = response.Resource;
  slots:
    - id: method
      options:
        - { id: read, text: ReadItemAsync }
        - { id: many, text: ReadManyItemsAsync }
        - { id: query, text: GetItemQueryIterator }
    - id: pk
      options:
        - { id: cust, text: new PartitionKey(customerId) }
        - { id: order, text: new PartitionKey(orderId) }
        - { id: none, text: PartitionKey.None }
    - id: ru
      options:
        - { id: charge, text: RequestCharge }
        - { id: activity, text: ActivityId }
        - { id: diag, text: Diagnostics }
answer:
  values: { method: read, pk: cust, ru: charge }
explanation:
  correct:
    en: "`ReadItemAsync<T>` performs a point read from the item's id and its partition key value, here the customer ID because the container is partitioned by `/customerId`. The returned `ItemResponse<T>` exposes the RU charge in `RequestCharge` and the item in `Resource`."
    fr: "`ReadItemAsync<T>` effectue une lecture ponctuelle à partir de l'id de l'élément et de sa valeur de clé de partition, ici l'ID client puisque le conteneur est partitionné par `/customerId`. L'`ItemResponse<T>` renvoyé expose la charge en RU dans `RequestCharge` et l'élément dans `Resource`."
  options:
    many: { en: "ReadManyItemsAsync takes a list of (id, partition key) pairs and returns a FeedResponse.", fr: "ReadManyItemsAsync prend une liste de paires (id, clé de partition) et renvoie un FeedResponse." }
    query: { en: "GetItemQueryIterator runs a query and returns a FeedIterator, not an ItemResponse.", fr: "GetItemQueryIterator exécute une requête et renvoie un FeedIterator, pas un ItemResponse." }
    order: { en: "The partition key value is the customer ID, not the order ID.", fr: "La valeur de clé de partition est l'ID client, pas l'ID de commande." }
    none: { en: "PartitionKey.None targets items stored without a partition key value.", fr: "PartitionKey.None cible les éléments stockés sans valeur de clé de partition." }
    activity: { en: "ActivityId identifies the request for troubleshooting; it is not the RU charge.", fr: "ActivityId identifie la requête pour le dépannage ; ce n'est pas la charge en RU." }
    diag: { en: "Diagnostics contains latency and request details, not the RU charge as a number.", fr: "Diagnostics contient la latence et le détail des requêtes, pas la charge en RU sous forme de nombre." }
references:
  - title: Read an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-read-item
