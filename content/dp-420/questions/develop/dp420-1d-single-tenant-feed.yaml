id: dp420-1d-single-tenant-feed
objective: "1.4.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL container named **tickets** is partitioned by `/tenantId` and stores the support tickets of 2,000 tenants. A .NET dashboard must display, in near real time, the ticket changes of the tenant `fabrikam` only.

    You need to read these changes while consuming as few RUs as possible.

    What should you use?
  fr: |
    Un conteneur Azure Cosmos DB for NoSQL nommé **tickets** est partitionné par `/tenantId` et stocke les tickets de support de 2 000 locataires. Un tableau de bord .NET doit afficher, en quasi-temps réel, les modifications des tickets du seul locataire `fabrikam`.

    Vous devez lire ces modifications en consommant le moins de RU possible.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "A change feed processor whose delegate ignores the changes of other tenants", fr: "Un processeur de flux de modification dont le délégué ignore les modifications des autres locataires" } }
    - { id: b, text: { en: "A change feed estimator that reports the pending changes of the fabrikam tenant", fr: "Un estimateur de flux de modification qui signale les modifications en attente du locataire fabrikam" } }
    - { id: c, text: { en: "A change feed processor started with WithStartTime(DateTime.UtcNow) for the fabrikam tenant", fr: "Un processeur de flux de modification démarré avec WithStartTime(DateTime.UtcNow) pour le locataire fabrikam" } }
    - { id: d, text: { en: "The pull model with ChangeFeedStartFrom.Now(FeedRange.FromPartitionKey(new PartitionKey(\"fabrikam\")))", fr: "Le modèle de tirage avec ChangeFeedStartFrom.Now(FeedRange.FromPartitionKey(new PartitionKey(\"fabrikam\")))" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The pull model can read the changes of a single partition key value by creating the iterator from FeedRange.FromPartitionKey. The change feed processor does not support single-partition-key processing, so it would read the changes of all 2,000 tenants.
    fr: |
      Le modèle de tirage peut lire les modifications d'une seule valeur de clé de partition en créant l'itérateur à partir de FeedRange.FromPartitionKey. Le processeur de flux de modification ne prend pas en charge le traitement d'une seule clé de partition : il lirait les modifications des 2 000 locataires.
  options:
    a: { en: "Filtering in the delegate still reads and pays for the changes of every tenant.", fr: "Filtrer dans le délégué revient toujours à lire, et à payer, les modifications de tous les locataires." }
    c: { en: "A start time does not restrict the processor to one partition key.", fr: "Une heure de début ne limite pas le processeur à une seule clé de partition." }
    b: { en: "The estimator measures lag of a processor; it does not return the changes.", fr: "L'estimateur mesure le retard d'un processeur ; il ne renvoie pas les modifications." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
