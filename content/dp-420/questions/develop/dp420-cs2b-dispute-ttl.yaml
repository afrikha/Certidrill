id: dp420-cs2b-dispute-ttl
objective: "1.2.5"
type: single
caseStudy: dp420-cs2b-wide-world-importers
difficulty: 3
status: draft
stem:
  en: |
    You need to configure time to live (TTL) for the new trackingEvents container to meet the retention requirement.

    What should you do?
  fr: |
    Vous devez configurer la durée de vie (TTL) du nouveau conteneur trackingEvents pour respecter l'exigence de rétention.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Leave DefaultTimeToLive unset and write ttl = 7776000 on every event. Set ttl to -1 on the events of a shipment when its dispute opens, and to 2592000 when it closes.", fr: "Laisser DefaultTimeToLive non défini et écrire ttl = 7776000 sur chaque événement. Définir ttl sur -1 sur les événements d'une expédition à l'ouverture de son litige, et sur 2592000 à sa clôture." } }
    - { id: b, text: { en: "Set DefaultTimeToLive to 7776000. Set ttl to -1 on the events of a shipment when its dispute opens, and to 2592000 when it closes.", fr: "Définir DefaultTimeToLive sur 7776000. Définir ttl sur -1 sur les événements d'une expédition à l'ouverture de son litige, et sur 2592000 à sa clôture." } }
    - { id: c, text: { en: "Set DefaultTimeToLive to 7776000. Set ttl to null on the events of a shipment when its dispute opens, and remove the ttl property when it closes.", fr: "Définir DefaultTimeToLive sur 7776000. Définir ttl sur null sur les événements d'une expédition à l'ouverture de son litige, et supprimer la propriété ttl à sa clôture." } }
    - { id: d, text: { en: "Set DefaultTimeToLive to -1. Set ttl to 2592000 on the events of a shipment when its dispute closes.", fr: "Définir DefaultTimeToLive sur -1. Définir ttl sur 2592000 sur les événements d'une expédition à la clôture de son litige." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A container default of 7,776,000 seconds expires each event 90 days after its last modification. An item `ttl` of -1 overrides the default so that the events of an open dispute never expire. Writing `ttl` = 2,592,000 when the dispute closes modifies the item, so it expires 30 days after that write.
    fr: |
      Une valeur par défaut de 7 776 000 secondes sur le conteneur fait expirer chaque événement 90 jours après sa dernière modification. Une `ttl` de -1 sur l'élément remplace la valeur par défaut : les événements d'un litige ouvert n'expirent jamais. Écrire `ttl` = 2 592 000 à la clôture du litige modifie l'élément, qui expire donc 30 jours après cette écriture.
  options:
    a: { en: "When DefaultTimeToLive is missing or null on the container, the ttl property of the items has no effect and nothing expires.", fr: "Lorsque DefaultTimeToLive est absent ou null sur le conteneur, la propriété ttl des éléments n'a aucun effet et rien n'expire." }
    c: { en: "A ttl of null is not supported, and removing ttl at closing would apply the 90-day default instead of 30 days.", fr: "Une ttl null n'est pas prise en charge, et supprimer ttl à la clôture appliquerait la valeur par défaut de 90 jours au lieu de 30 jours." }
    d: { en: "With a default of -1, the events that have no ttl never expire, so ordinary events would not be deleted after 90 days.", fr: "Avec une valeur par défaut de -1, les événements sans ttl n'expirent jamais : les événements ordinaires ne seraient pas supprimés au bout de 90 jours." }
references:
  - title: Time to live in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
