id: dp420-1d-mode-choice-map
objective: "1.4.4"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum has several change feed consumers. Account **cosmos-a** uses continuous backup and has all versions and deletes mode enabled. Account **cosmos-b** uses periodic backup and must keep it.

    Which change feed approach should each consumer use? To answer, drag the appropriate approaches to the correct consumers. Each approach may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose de plusieurs consommateurs du flux de modification. Le compte **cosmos-a** utilise la sauvegarde continue et a le mode toutes les versions et suppressions activé. Le compte **cosmos-b** utilise la sauvegarde périodique et doit la conserver.

    Quelle approche du flux de modification chaque consommateur doit-il utiliser ? Pour répondre, faites glisser les approches appropriées vers les consommateurs correspondants. Chaque approche peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: lv, text: { en: "Latest version mode", fr: "Mode dernière version" } }
    - { id: avad, text: { en: "All versions and deletes mode", fr: "Mode toutes les versions et suppressions" } }
    - { id: soft, text: { en: "Latest version mode with a soft-delete flag and TTL", fr: "Mode dernière version avec un indicateur de suppression logique et une durée de vie" } }
    - { id: est, text: { en: "Change feed estimator", fr: "Estimateur de flux de modification" } }
  targets:
    - id: t1
      text: { en: "cosmos-a: rebuild a read model from all the items written since the container was created", fr: "cosmos-a : reconstruire un modèle de lecture à partir de tous les éléments écrits depuis la création du conteneur" }
    - id: t2
      text: { en: "cosmos-a: raise an alert as soon as an item is deleted", fr: "cosmos-a : déclencher une alerte dès qu'un élément est supprimé" }
    - id: t3
      text: { en: "cosmos-b: remove deleted items from a cache", fr: "cosmos-b : retirer d'un cache les éléments supprimés" }
    - id: t4
      text: { en: "cosmos-a: count every intermediate status change of an order, even between two polls", fr: "cosmos-a : compter chaque changement de statut intermédiaire d'une commande, même entre deux interrogations" }
answer:
  mapping: { t1: lv, t2: avad, t3: soft, t4: avad }
explanation:
  correct:
    en: |
      Only latest version mode can start from the beginning of the container, so it is used to rebuild a read model from all existing items. All versions and deletes mode captures deletes and every intermediate change, but it needs continuous backup, which cosmos-b cannot use. On cosmos-b, deletes become visible only if the application writes a soft-delete flag, which latest version mode records as an update, and lets TTL purge the item.
    fr: |
      Seul le mode dernière version peut démarrer au début du conteneur ; il sert donc à reconstruire un modèle de lecture à partir de tous les éléments existants. Le mode toutes les versions et suppressions capture les suppressions et chaque modification intermédiaire, mais il nécessite la sauvegarde continue, que cosmos-b ne peut pas utiliser. Sur cosmos-b, les suppressions ne deviennent visibles que si l'application écrit un indicateur de suppression logique, que le mode dernière version enregistre comme une mise à jour, et laisse la durée de vie purger l'élément.
  options:
    est: { en: "The estimator measures the lag of a change feed processor; it does not deliver changes.", fr: "L'estimateur mesure le retard d'un processeur de flux de modification ; il ne livre pas de modifications." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
