id: dp420-1b-upsert-sync
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Northwind synchronizes product records from an ERP system into an Azure Cosmos DB for NoSQL container by using the .NET SDK. Each record carries the full product document. The sync job does not know whether a product already exists in the container.

    The job must write each record with a single request: create the product if it is new, or overwrite it if it exists.

    Which method should you use?
  fr: |
    Northwind synchronise les fiches produits d'un ERP vers un conteneur Azure Cosmos DB for NoSQL avec le SDK .NET. Chaque fiche contient le document produit complet. Le traitement de synchronisation ne sait pas si un produit existe déjà dans le conteneur.

    Le traitement doit écrire chaque fiche en une seule requête : créer le produit s'il est nouveau, ou le remplacer s'il existe.

    Quelle méthode devez-vous utiliser ?
body:
  options:
    - { id: a, text: UpsertItemAsync }
    - { id: b, text: CreateItemAsync }
    - { id: c, text: ReplaceItemAsync }
    - { id: d, text: PatchItemAsync }
answer: { optionId: a }
explanation:
  correct:
    en: "UpsertItemAsync uses the item's id to detect whether an item exists in the logical partition. It replaces the existing item or creates a new one, in a single request."
    fr: "UpsertItemAsync utilise l'id de l'élément pour détecter s'il existe dans la partition logique. Il remplace l'élément existant ou en crée un nouveau, en une seule requête."
  options:
    b: { en: "CreateItemAsync throws an exception when an item with the same id already exists.", fr: "CreateItemAsync lève une exception quand un élément avec le même id existe déjà." }
    c: { en: "ReplaceItemAsync fails when the item does not exist yet.", fr: "ReplaceItemAsync échoue quand l'élément n'existe pas encore." }
    d: { en: "PatchItemAsync modifies selected paths of an existing item and fails when the item does not exist.", fr: "PatchItemAsync modifie des chemins choisis d'un élément existant et échoue quand l'élément n'existe pas." }
references:
  - title: Create an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-create-item
