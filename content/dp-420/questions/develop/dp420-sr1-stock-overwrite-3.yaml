id: dp420-sr1-stock-overwrite-3
objective: "1.2.6"
type: series_yesno
series: dp420-sr1-stock-overwrite
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: You add the _etag property to the item class that the worker writes back.
  fr: Vous ajoutez la propriété _etag à la classe de l'élément que le worker réécrit.
body:
  solution:
    en: |
      You add the `_etag` system property to the item class so that the item sent back contains the ETag value that was read, and you keep the replace call without request options:

      ```csharp
      public class StockItem
      {
          [JsonProperty("id")] public string Id { get; set; }
          [JsonProperty("warehouseId")] public string WarehouseId { get; set; }
          [JsonProperty("available")] public int Available { get; set; }
          [JsonProperty("_etag")] public string ETag { get; set; }
      }

      await container.ReplaceItemAsync(item, item.Id, new PartitionKey(warehouseId));
      ```
    fr: |
      Vous ajoutez la propriété système `_etag` à la classe de l'élément afin que l'élément renvoyé contienne la valeur ETag lue, et vous conservez l'appel de remplacement sans options de requête :

      ```csharp
      public class StockItem
      {
          [JsonProperty("id")] public string Id { get; set; }
          [JsonProperty("warehouseId")] public string WarehouseId { get; set; }
          [JsonProperty("available")] public int Available { get; set; }
          [JsonProperty("_etag")] public string ETag { get; set; }
      }

      await container.ReplaceItemAsync(item, item.Id, new PartitionKey(warehouseId));
      ```
answer: { value: false }
explanation:
  correct:
    en: The `_etag` is a system property generated by the server, and a value sent in the item body is not evaluated as a precondition. For replace operations, the If-Match condition must be set explicitly in the request options (`IfMatchEtag`); without it, the replace is unconditional and still overwrites a change made by another instance.
    fr: "La valeur `_etag` est une propriété système générée par le serveur, et une valeur envoyée dans le corps de l'élément n'est pas évaluée comme condition préalable. Pour les opérations de remplacement, la condition If-Match doit être définie explicitement dans les options de requête (`IfMatchEtag`) : sans elle, le remplacement est inconditionnel et écrase toujours une modification effectuée par une autre instance."
references:
  - title: Database Transactions and Optimistic Concurrency Control - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
