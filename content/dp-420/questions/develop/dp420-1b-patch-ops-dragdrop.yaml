id: dp420-1b-patch-ops-dragdrop
objective: "1.2.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Proseware stores products in Azure Cosmos DB for NoSQL. A product item looks like this:

    ```json
    {
      "id": "p-1001",
      "category": "bikes",
      "price": 899.0,
      "stock": 42,
      "tags": ["road", "carbon"],
      "legacyCode": "RB-77"
    }
    ```

    You use partial document update (patch) for each of the following requirements. Which patch operation should you use for each requirement? To answer, drag the appropriate operations to the correct requirements. Each operation may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware stocke des produits dans Azure Cosmos DB for NoSQL. Un élément produit se présente ainsi :

    ```json
    {
      "id": "p-1001",
      "category": "bikes",
      "price": 899.0,
      "stock": 42,
      "tags": ["road", "carbon"],
      "legacyCode": "RB-77"
    }
    ```

    Vous utilisez la mise à jour partielle de document (patch) pour chacune des exigences suivantes. Quelle opération de patch devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les opérations appropriées vers les exigences correspondantes. Chaque opération peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: add, text: Add }
    - { id: set, text: Set }
    - { id: replace, text: Replace }
    - { id: remove, text: Remove }
    - { id: incr, text: Increment }
    - { id: move, text: Move }
  targets:
    - { id: t1, text: { en: "Insert \"sale\" as the first element of tags and shift the existing tags", fr: "Insérer \"sale\" comme premier élément de tags et décaler les valeurs existantes" } }
    - { id: t2, text: { en: "Decrease stock by 3 without reading the item first", fr: "Diminuer stock de 3 sans lire l'élément au préalable" } }
    - { id: t3, text: { en: "Delete the legacyCode property", fr: "Supprimer la propriété legacyCode" } }
    - { id: t4, text: { en: "Change price, and make the operation fail if price does not exist", fr: "Modifier price, et faire échouer l'opération si price n'existe pas" } }
answer:
  mapping: { t1: add, t2: incr, t3: remove, t4: replace }
explanation:
  correct:
    en: "Add at an array index inserts the element and shifts the following elements, whereas Set overwrites the element at that index. Increment adds a positive or negative value to a number on the server. Remove deletes a path. Replace is replace-only and fails when the target path does not exist, unlike Add and Set, which create it."
    fr: "Add à un index de tableau insère l'élément et décale les éléments suivants, alors que Set remplace l'élément situé à cet index. Increment ajoute une valeur positive ou négative à un nombre côté serveur. Remove supprime un chemin. Replace remplace uniquement et échoue si le chemin cible n'existe pas, contrairement à Add et Set, qui le créent."
  options:
    set: { en: "Set at an existing array index overwrites the element instead of shifting the array, and Set creates a missing property.", fr: "Set à un index de tableau existant remplace l'élément au lieu de décaler le tableau, et Set crée une propriété absente." }
    move: { en: "Move removes a value from one path and adds it at another path.", fr: "Move supprime une valeur d'un chemin et l'ajoute à un autre chemin." }
references:
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
