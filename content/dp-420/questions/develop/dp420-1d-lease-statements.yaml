id: dp420-1d-lease-statements
objective: "1.4.3"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso runs a change feed processor that monitors an Azure Cosmos DB for NoSQL container named **payments** in an account named **cosmos-pay**. The processor has been running for several months.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso exécute un processeur de flux de modification qui surveille un conteneur Azure Cosmos DB for NoSQL nommé **payments** dans un compte nommé **cosmos-pay**. Le processeur fonctionne depuis plusieurs mois.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: The lease container of the processor can be stored in an Azure Cosmos DB account other than cosmos-pay.
        fr: Le conteneur de bail du processeur peut être stocké dans un compte Azure Cosmos DB autre que cosmos-pay.
    - id: s2
      text:
        en: Adding WithStartTime(DateTime.MinValue.ToUniversalTime()) to the builder and restarting the processor makes it reprocess all the payments.
        fr: Ajouter WithStartTime(DateTime.MinValue.ToUniversalTime()) au générateur et redémarrer le processeur lui fait retraiter tous les paiements.
    - id: s3
      text:
        en: Changing the client from the global endpoint to a regional endpoint of cosmos-pay makes the processor create new lease documents.
        fr: Faire passer le client du point de terminaison global à un point de terminaison régional de cosmos-pay amène le processeur à créer de nouveaux documents de bail.
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: |
      The lease container can be in the same account as the monitored container or in a separate account. Start options apply only when the lease container is initialized for the first time; changing them later has no effect. Lease documents are scoped to the configured endpoint, so a new endpoint produces new, independent leases.
    fr: |
      Le conteneur de bail peut se trouver dans le même compte que le conteneur surveillé ou dans un compte distinct. Les options de démarrage ne s'appliquent qu'à la première initialisation du conteneur de bail ; les modifier ensuite n'a aucun effet. Les documents de bail sont liés au point de terminaison configuré : un nouveau point de terminaison produit de nouveaux baux indépendants.
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
