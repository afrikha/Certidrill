id: dp420-1b-ttl-python
objective: "1.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Northwind creates an Azure Cosmos DB for NoSQL container named **telemetry** by using the Python `azure-cosmos` SDK. Every reading must be deleted automatically 7 days after it was last written.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind crée un conteneur Azure Cosmos DB for NoSQL nommé **telemetry** avec le SDK Python `azure-cosmos`. Chaque relevé doit être supprimé automatiquement 7 jours après sa dernière écriture.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    from azure.cosmos import PartitionKey

    container = database.create_container_if_not_exists(
        id="telemetry",
        partition_key=PartitionKey(path="/deviceId"),
        [[param]]=[[value]],
    )
  slots:
    - id: param
      options:
        - { id: ttl, text: default_ttl }
        - { id: analytical, text: analytical_storage_ttl }
        - { id: offer, text: offer_throughput }
    - id: value
      options:
        - { id: hours, text: "168" }
        - { id: minutes, text: "10080" }
        - { id: seconds, text: "604800" }
        - { id: minus, text: "-1" }
answer:
  values: { param: ttl, value: seconds }
explanation:
  correct:
    en: "The `default_ttl` parameter of `create_container_if_not_exists` sets the container's default time to live, in seconds. Seven days is 604,800 seconds, counted from each item's last modification."
    fr: "Le paramètre `default_ttl` de `create_container_if_not_exists` définit la durée de vie par défaut du conteneur, en secondes. Sept jours représentent 604 800 secondes, comptées depuis la dernière modification de chaque élément."
  options:
    analytical: { en: "analytical_storage_ttl applies to the analytical store, not to items of the transactional store.", fr: "analytical_storage_ttl s'applique au magasin analytique, pas aux éléments du magasin transactionnel." }
    offer: { en: "offer_throughput sets the provisioned RU/s of the container.", fr: "offer_throughput définit les RU/s approvisionnées du conteneur." }
    hours: { en: "168 is the number of hours in 7 days; TTL is in seconds.", fr: "168 est le nombre d'heures en 7 jours ; la TTL est en secondes." }
    minutes: { en: "10080 is the number of minutes in 7 days; TTL is in seconds.", fr: "10080 est le nombre de minutes en 7 jours ; la TTL est en secondes." }
    minus: { en: "-1 enables TTL without expiring items by default.", fr: "-1 active la TTL sans faire expirer les éléments par défaut." }
references:
  - title: azure.cosmos.DatabaseProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.databaseproxy
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
