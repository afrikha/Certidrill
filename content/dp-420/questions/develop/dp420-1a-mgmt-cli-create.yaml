id: dp420-1a-mgmt-cli-create
objective: "1.1.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum automates the creation of Azure Cosmos DB for NoSQL containers with the Azure CLI. You need to create a container named **payments** in the **billing** database with these settings:

    - the partition key is `/accountId`;
    - throughput scales automatically up to 4,000 RU/s;
    - the indexing policy is read from the local file **policy.json**.

    How should you complete the command? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum automatise la création de conteneurs Azure Cosmos DB for NoSQL avec Azure CLI. Vous devez créer un conteneur nommé **payments** dans la base de données **billing** avec ces paramètres :

    - la clé de partition est `/accountId` ;
    - le débit s'ajuste automatiquement jusqu'à 4 000 RU/s ;
    - la stratégie d'indexation est lue dans le fichier local **policy.json**.

    Comment devez-vous compléter la commande ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: bash
  template: |
    az cosmosdb sql container create \
        -g rg-billing -a cosmos-adatum -d billing -n payments \
        [[pk]] "/accountId" \
        [[tp]] 4000 \
        [[idx]] @policy.json
  slots:
    - id: pk
      options:
        - { id: ukpolicy, text: "--unique-key-policy" }
        - { id: pkpath, text: "--partition-key-path" }
        - { id: pkversion, text: "--partition-key-version" }
    - id: tp
      options:
        - { id: maxtp, text: "--max-throughput" }
        - { id: throughput, text: "--throughput" }
        - { id: atl, text: "--analytical-storage-ttl" }
    - id: idx
      options:
        - { id: cep, text: "--cep" }
        - { id: fts, text: "--full-text-policy" }
        - { id: idxparam, text: "--idx" }
answer:
  values: { pk: pkpath, tp: maxtp, idx: idxparam }
explanation:
  correct:
    en: |
      `--partition-key-path` (or `-p`) sets the partition key path. `--max-throughput` creates the container with autoscale throughput and sets its maximum, whereas `--throughput` sets manual throughput. `--idx` accepts the indexing policy as a string or as a file with the `@` prefix.
    fr: |
      `--partition-key-path` (ou `-p`) définit le chemin de la clé de partition. `--max-throughput` crée le conteneur avec un débit à mise à l'échelle automatique et définit son maximum, alors que `--throughput` définit un débit manuel. `--idx` accepte la stratégie d'indexation sous forme de chaîne ou de fichier avec le préfixe `@`.
  options:
    pkversion: { en: "--partition-key-version sets the version of the partition key definition, not its path.", fr: "--partition-key-version définit la version de la définition de clé de partition, pas son chemin." }
    throughput: { en: "--throughput provisions a fixed manual value of 4,000 RU/s.", fr: "--throughput approvisionne une valeur manuelle fixe de 4 000 RU/s." }
    cep: { en: "--cep sets the client encryption policy.", fr: "--cep définit la stratégie de chiffrement côté client." }
    fts: { en: "--full-text-policy defines the full-text policy, not the indexing policy.", fr: "--full-text-policy définit la stratégie de texte intégral, pas la stratégie d'indexation." }
references:
  - title: az cosmosdb sql container
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb/sql/container
