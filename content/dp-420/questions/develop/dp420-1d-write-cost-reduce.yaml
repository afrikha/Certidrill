id: dp420-1d-write-cost-reduce
objective: "1.3.8"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso estimates the cost of a write-heavy Azure Cosmos DB for NoSQL workload. The container uses the default indexing policy. Each item is about 60 KB because it embeds a scanned PDF as a Base64 string, and queries filter only on `customerId` and `orderDate`. The account uses Session consistency.

    You need to reduce the number of RUs consumed by each write.

    Which two actions should you recommend? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso estime le coût d'une charge de travail Azure Cosmos DB for NoSQL dominée par les écritures. Le conteneur utilise la stratégie d'indexation par défaut. Chaque élément pèse environ 60 Ko, car il incorpore un PDF numérisé sous forme de chaîne Base64, et les requêtes ne filtrent que sur `customerId` et `orderDate`. Le compte utilise la cohérence Session.

    Vous devez réduire le nombre de RU consommées par chaque écriture.

    Quelles sont les deux actions à recommander ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Change the default consistency level of the account to Eventual.", fr: "Passer le niveau de cohérence par défaut du compte à Eventual." } }
    - { id: b, text: { en: "Store the PDF files in Azure Blob Storage and keep only their URL in the items.", fr: "Stocker les fichiers PDF dans le Stockage Blob Azure et ne conserver que leur URL dans les éléments." } }
    - { id: c, text: { en: "Switch the container from standard (manual) to autoscale throughput.", fr: "Faire passer le conteneur du débit standard (manuel) au débit avec mise à l'échelle automatique." } }
    - { id: d, text: { en: "Change the indexing policy to index only customerId and orderDate.", fr: "Modifier la stratégie d'indexation pour n'indexer que customerId et orderDate." } }
    - { id: e, text: { en: "Replace each create operation with a replace operation.", fr: "Remplacer chaque opération de création par une opération de remplacement." } }
answer: { optionIds: [ b, d ] }
explanation:
  correct:
    en: |
      The RU charge of a write depends on the item size and on the number of indexed properties. Moving the binary content to Blob Storage shrinks each item, and indexing only the properties used in filters removes the indexing work for every other property. Either change alone lowers the charge of each write.
    fr: |
      La charge en RU d'une écriture dépend de la taille de l'élément et du nombre de propriétés indexées. Déplacer le contenu binaire vers le Stockage Blob réduit chaque élément, et n'indexer que les propriétés utilisées dans les filtres supprime le travail d'indexation de toutes les autres propriétés. Chacune de ces modifications réduit à elle seule la charge de chaque écriture.
  options:
    a: { en: "Consistency affects the RU cost of reads (doubled with Strong or Bounded staleness), not of writes; Session is already a lower-cost level for reads.", fr: "La cohérence influe sur le coût en RU des lectures (doublé avec Strong ou Bounded staleness), pas des écritures ; Session est déjà un niveau peu coûteux pour les lectures." }
    c: { en: "Autoscale changes how throughput is provisioned and billed, not the RUs that each write consumes.", fr: "La mise à l'échelle automatique change la façon dont le débit est approvisionné et facturé, pas les RU consommées par chaque écriture." }
    e: { en: "Replacing an item costs about twice as much as inserting it.", fr: "Remplacer un élément coûte environ deux fois plus que l'insérer." }
references:
  - title: Optimize Request Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
