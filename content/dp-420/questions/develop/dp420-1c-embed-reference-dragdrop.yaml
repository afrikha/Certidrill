id: dp420-1c-embed-reference-dragdrop
objective: "1.3.3"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Contoso is designing the data model of several applications that use Azure Cosmos DB for NoSQL.

    You need to choose a modeling approach for each relationship. The solution must minimize the RU cost of the dominant operation of each relationship.

    Which approach should you use for each relationship? To answer, drag the appropriate approaches to the correct relationships. Each approach may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso conçoit le modèle de données de plusieurs applications qui utilisent Azure Cosmos DB for NoSQL.

    Vous devez choisir une approche de modélisation pour chaque relation. La solution doit réduire au minimum le coût en RU de l'opération dominante de chaque relation.

    Quelle approche devez-vous utiliser pour chaque relation ? Pour répondre, faites glisser les approches appropriées vers les relations correspondantes. Chaque approche peut être utilisée une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: embed, text: { en: "Embed the related data in the parent item", fr: "Incorporer les données associées dans l'élément parent" } }
    - { id: ref, text: { en: "Store the related data in separate items and reference them by ID", fr: "Stocker les données associées dans des éléments distincts et les référencer par ID" } }
    - { id: hybrid, text: { en: "Reference by ID and embed a copy of a few rarely changing properties", fr: "Référencer par ID et incorporer une copie de quelques propriétés qui changent rarement" } }
  targets:
    - id: phones
      text: { en: "A contact has up to three phone numbers, always displayed with the contact", fr: "Un contact a jusqu'à trois numéros de téléphone, toujours affichés avec lui" }
    - id: readings
      text: { en: "A device produces millions of readings over its lifetime", fr: "Un appareil produit des millions de mesures au cours de sa vie" }
    - id: price
      text: { en: "A product price changes every minute and is used by 200,000 shopping carts", fr: "Le prix d'un produit change chaque minute et est utilisé par 200 000 paniers" }
    - id: author
      text: { en: "A book list shows each author's name and photo URL; authors rarely change them, but their profiles have many other properties", fr: "Une liste de livres affiche le nom et l'URL de photo de chaque auteur ; les auteurs les changent rarement, mais leurs profils ont de nombreuses autres propriétés" }
answer:
  mapping: { phones: embed, readings: ref, price: ref, author: hybrid }
explanation:
  correct:
    en: |-
      A few phone numbers are contained, bounded and read with the contact, so they are embedded. Unbounded data such as device readings, and data that changes frequently and is shared by many items such as a price, are stored separately and referenced. Copying only an author's name and photo URL into each book, while keeping the reference, avoids extra reads for the list at the cost of rare updates.
    fr: |-
      Quelques numéros de téléphone sont contenus, bornés et lus avec le contact : ils sont incorporés. Les données non bornées, comme les mesures d'un appareil, et les données qui changent souvent et sont partagées par de nombreux éléments, comme un prix, sont stockées séparément et référencées. Copier seulement le nom et l'URL de photo de l'auteur dans chaque livre, en conservant la référence, évite des lectures supplémentaires pour la liste au prix de mises à jour rares.
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
