id: dp420-cs3c-sdk-operations
objective: "1.2.4"
type: dragdrop
caseStudy: dp420-cs3c-humongous-insurance
difficulty: 1
status: draft
stem:
  en: |
    You are implementing the claims processing requirements in the ClaimsHub API and in the import job.

    Which .NET SDK feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous implémentez les exigences relatives au traitement des sinistres dans l'API ClaimsHub et dans le traitement d'importation.

    Quelle fonctionnalité du SDK .NET devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: batch, text: { en: "Transactional batch (CreateTransactionalBatch)", fr: "Lot transactionnel (CreateTransactionalBatch)" } }
    - { id: bulk, text: { en: "Bulk execution (AllowBulkExecution = true)", fr: "Exécution en bloc (AllowBulkExecution = true)" } }
    - { id: patch, text: { en: "Partial document update (PatchItemAsync with PatchOperation.Increment)", fr: "Mise à jour partielle de document (PatchItemAsync avec PatchOperation.Increment)" } }
    - { id: upsert, text: { en: "UpsertItemAsync", fr: "UpsertItemAsync" } }
    - { id: feed, text: { en: "Change feed pull model (GetChangeFeedIterator)", fr: "Modèle d'extraction du flux de modification (GetChangeFeedIterator)" } }
  targets:
    - id: approve
      text: { en: "Requirement 3: approve a claim and create its payment item", fr: "Exigence 3 : approuver un sinistre et créer son élément de paiement" }
    - id: import
      text: { en: "Requirement 4: import the legacy claims", fr: "Exigence 4 : importer les sinistres hérités" }
    - id: attach
      text: { en: "Requirement 5: increment attachmentCount", fr: "Exigence 5 : incrémenter attachmentCount" }
answer:
  mapping: { approve: batch, import: bulk, attach: patch }
explanation:
  correct:
    en: "The claim item and its payment item share the same `/policyId` value, so a transactional batch can run both operations in one transaction that commits or rolls back as a whole (up to 100 operations and 2 MB). Bulk execution groups many concurrent point operations to maximize import throughput, without transactional guarantees. A patch with an Increment operation changes `attachmentCount` on the server without sending the whole item."
    fr: "L'élément de sinistre et son élément de paiement partagent la même valeur de `/policyId` : un lot transactionnel peut donc exécuter les deux opérations dans une seule transaction validée ou annulée en bloc (jusqu'à 100 opérations et 2 Mo). L'exécution en bloc regroupe de nombreuses opérations ponctuelles simultanées pour maximiser le débit d'importation, sans garantie transactionnelle. Un correctif (patch) avec une opération Increment modifie `attachmentCount` côté serveur sans envoyer l'élément complet."
  options:
    upsert:
      en: "An upsert replaces or creates one whole item at a time; it is neither transactional across two items nor a partial update."
      fr: "Un upsert remplace ou crée un élément complet à la fois ; il n'est ni transactionnel sur deux éléments, ni une mise à jour partielle."
    feed:
      en: "The change feed reads changes after they are written; it does not write data."
      fr: "Le flux de modification lit les modifications après leur écriture ; il n'écrit pas de données."
references:
  - title: Transactional batch operations in Azure Cosmos DB using the .NET or Java SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/transactional-batch
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
