id: dp420-1a-mgmt-change-pk
objective: "1.1.5"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL container named **shipments** that stores 300 GB of data and is partitioned on `/status`. Most writes target the same few status values, which creates hot partitions. The team decides to partition the data on `/customerId` instead.

    You need to move to the new partition key with the least development effort, while the application keeps writing to the current container until the switch.

    What should you do?
  fr: |
    Fabrikam dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **shipments** qui stocke 300 Go de données et qui est partitionné sur `/status`. La plupart des écritures ciblent les mêmes quelques valeurs de statut, ce qui crée des partitions chaudes. L'équipe décide de partitionner plutôt les données sur `/customerId`.

    Vous devez passer à la nouvelle clé de partition avec le moins d'effort de développement possible, tandis que l'application continue d'écrire dans le conteneur actuel jusqu'à la bascule.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Call replace_container from the Python SDK with PartitionKey(path=\"/customerId\").", fr: "Appeler replace_container du SDK Python avec PartitionKey(path=\"/customerId\")." } }
    - { id: b, text: { en: "Add /customerId as a second level of a hierarchical partition key on the existing container.", fr: "Ajouter /customerId comme deuxième niveau d'une clé de partition hiérarchique sur le conteneur existant." } }
    - { id: c, text: { en: "Use Change partition key in Data Explorer to copy the data online to a new container, and then switch the application.", fr: "Utiliser Change partition key dans l'Explorateur de données pour copier les données en ligne vers un nouveau conteneur, puis basculer l'application." } }
    - { id: d, text: { en: "Run az cosmosdb sql container update with the --partition-key-path parameter set to /customerId.", fr: "Exécuter az cosmosdb sql container update avec le paramètre --partition-key-path défini sur /customerId." } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      A partition key can't be changed in place. The Change partition key feature of Data Explorer creates or selects a destination container and copies the data with a container copy job, which can run online; you complete the job and then point the application to the new container.
    fr: |
      Une clé de partition ne peut pas être modifiée sur place. La fonctionnalité Change partition key de l'Explorateur de données crée ou sélectionne un conteneur de destination et copie les données avec une tâche de copie de conteneur, qui peut s'exécuter en ligne ; vous terminez la tâche, puis vous faites pointer l'application vers le nouveau conteneur.
  options:
    d: { en: "The partition key path can be set only by az cosmosdb sql container create; update doesn't accept it.", fr: "Le chemin de clé de partition ne peut être défini que par az cosmosdb sql container create ; update ne l'accepte pas." }
    a: { en: "Replacing the container properties can't change the partition key of an existing container.", fr: "Remplacer les propriétés du conteneur ne peut pas modifier la clé de partition d'un conteneur existant." }
    b: { en: "Hierarchical partition keys must be defined when the container is created; they can't be added to an existing container.", fr: "Les clés de partition hiérarchiques doivent être définies à la création du conteneur ; elles ne peuvent pas être ajoutées à un conteneur existant." }
references:
  - title: Changing the partition key in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-partition-key
