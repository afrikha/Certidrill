id: dp420-1a-ru-strong-reads
objective: "1.1.2"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Fabrikam has an Azure Cosmos DB for NoSQL container in a single-region account whose default consistency level is Session. At peak, an application performs 3,000 point reads per second of 1-KB items in the container. The container receives no other operations.

    The compliance team asks you to change the default consistency level to Strong. You need to estimate the RU/s that the reads will require at peak after the change.

    How many RU/s should you plan for?
  fr: |
    Fabrikam dispose d'un conteneur Azure Cosmos DB for NoSQL dans un compte à une seule région dont le niveau de cohérence par défaut est Session. Au pic, une application effectue 3 000 lectures ponctuelles par seconde d'éléments de 1 Ko dans le conteneur. Le conteneur ne reçoit aucune autre opération.

    L'équipe de conformité vous demande de passer le niveau de cohérence par défaut à Strong. Vous devez estimer les RU/s nécessaires aux lectures au pic après la modification.

    Combien de RU/s devez-vous prévoir ?
body:
  options:
    - { id: a, text: "3,000 RU/s" }
    - { id: b, text: "6,000 RU/s" }
    - { id: c, text: "9,000 RU/s" }
    - { id: d, text: "12,000 RU/s" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A point read of a 1-KB item costs about 1 RU at Session, so the workload needs about 3,000 RU/s today. Strong (like Bounded staleness) reads from two replicas, which doubles the RU cost of every read: about 6,000 RU/s.
    fr: |
      Une lecture ponctuelle d'un élément de 1 Ko coûte environ 1 RU en Session : la charge de travail nécessite aujourd'hui environ 3 000 RU/s. Strong (comme Bounded staleness) lit sur deux réplicas, ce qui double le coût en RU de chaque lecture : environ 6 000 RU/s.
  options:
    a: { en: "3,000 RU/s is the current need; Strong doubles the RU cost of reads.", fr: "3 000 RU/s correspond au besoin actuel ; Strong double le coût en RU des lectures." }
    c: { en: "The read cost doubles; it doesn't triple.", fr: "Le coût des lectures double ; il ne triple pas." }
    d: { en: "The account has a single region, and the read cost doubles, not quadruples.", fr: "Le compte n'a qu'une région, et le coût des lectures double, il ne quadruple pas." }
references:
  - title: Request Units as a throughput and performance currency - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
