id: dp420-1c-impact-kql-partition-key-ru
objective: "1.3.4"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    An Azure Cosmos DB for NoSQL account sends its diagnostic logs to a Log Analytics workspace in resource-specific mode, with the partition key RU consumption category enabled. Requests to the **orders** container are frequently rate-limited.

    You need a query that shows which logical partition key values consume the most request units per second over the last day.

    How should you complete the query? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Un compte Azure Cosmos DB for NoSQL envoie ses journaux de diagnostic à un espace de travail Log Analytics en mode spécifique à la ressource, avec la catégorie de consommation de RU par clé de partition activée. Les requêtes vers le conteneur **orders** sont fréquemment limitées.

    Vous avez besoin d'une requête qui montre quelles valeurs de clé de partition logique consomment le plus d'unités de requête par seconde au cours de la dernière journée.

    Comment devez-vous compléter la requête ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: kusto
  template: |
    [[table]]
    | where TimeGenerated >= ago(1d)
    | where CollectionName == "orders"
    | where isnotempty(PartitionKey)
    | summarize TotalRU = sum([[column]]) by PartitionKey, bin(TimeGenerated, 1s)
    | order by TotalRU desc
  slots:
    - id: table
      options:
        - { id: ruc, text: CDBPartitionKeyRUConsumption }
        - { id: stats, text: CDBPartitionKeyStatistics }
        - { id: query, text: CDBQueryRuntimeStatistics }
        - { id: metrics, text: AzureMetrics }
    - id: column
      options:
        - { id: charge, text: RequestCharge }
        - { id: size, text: SizeKb }
        - { id: duration, text: DurationMs }
        - { id: length, text: ResponseLength }
answer:
  values: { table: ruc, column: charge }
explanation:
  correct:
    en: |-
      The CDBPartitionKeyRUConsumption table records the request charge per logical partition key. Summing RequestCharge by PartitionKey for each one-second bin shows the RU/s consumed by each key value; a value that keeps the top rank during throttling reveals a hot partition.
    fr: |-
      La table CDBPartitionKeyRUConsumption enregistre les frais de requête par clé de partition logique. Additionner RequestCharge par PartitionKey pour chaque intervalle d'une seconde montre les RU/s consommées par chaque valeur de clé ; une valeur qui reste en tête pendant la limitation révèle une partition chaude.
  options:
    stats: { en: "CDBPartitionKeyStatistics reports the storage of the largest partition keys, not their RU consumption.", fr: "CDBPartitionKeyStatistics indique le stockage des plus grandes clés de partition, pas leur consommation de RU." }
    query: { en: "CDBQueryRuntimeStatistics holds query texts, not per-partition-key request charges.", fr: "CDBQueryRuntimeStatistics contient le texte des requêtes, pas les frais de requête par clé de partition." }
    metrics: { en: "AzureMetrics holds platform metrics without the logical partition key values.", fr: "AzureMetrics contient des métriques de plateforme sans les valeurs de clé de partition logique." }
    size: { en: "SizeKb measures storage, not request units.", fr: "SizeKb mesure le stockage, pas les unités de requête." }
    duration: { en: "DurationMs measures latency, not request units.", fr: "DurationMs mesure la latence, pas les unités de requête." }
    length: { en: "ResponseLength measures the response size, not request units.", fr: "ResponseLength mesure la taille de la réponse, pas les unités de requête." }
references:
  - title: Diagnose and troubleshoot "Request rate too large" (429) exceptions
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/troubleshoot-request-rate-too-large
  - title: CDBPartitionKeyRUConsumption
    url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/cdbpartitionkeyruconsumption
