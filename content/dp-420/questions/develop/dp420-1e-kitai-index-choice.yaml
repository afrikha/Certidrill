id: dp420-1e-kitai-index-choice
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Litware builds a multitenant document assistant on Azure Cosmos DB for NoSQL. The container is partitioned by `/tenantId`, and every vector search filters on a single tenant. Each tenant has between 5,000 and 30,000 document chunks, and each chunk stores an embedding of 1,536 dimensions.

    Your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, asks you which vector index to define. The search must be a brute-force (k-nearest neighbors) search rather than an approximate nearest neighbor search, and it must have the lowest request unit (RU) cost possible.

    Which vector index type should you use?
  fr: |
    Litware crée un assistant documentaire multilocataire sur Azure Cosmos DB for NoSQL. Le conteneur est partitionné par `/tenantId`, et chaque recherche vectorielle filtre sur un seul locataire. Chaque locataire possède entre 5 000 et 30 000 segments de documents, et chaque segment stocke une incorporation de 1 536 dimensions.

    Votre assistant de codage IA, sur lequel Azure Cosmos DB Agent Kit est installé, vous demande quel index vectoriel définir. La recherche doit être une recherche exhaustive (k plus proches voisins) et non une recherche approximative du plus proche voisin, et elle doit avoir le coût en unités de requête (RU) le plus faible possible.

    Quel type d'index vectoriel devez-vous utiliser ?
body:
  options:
    - { id: a, text: flat }
    - { id: b, text: diskANN }
    - { id: c, text: quantizedFlat }
    - { id: d, text: { en: "No vector index, with the vector path excluded from the indexing policy", fr: "Aucun index vectoriel, avec le chemin du vecteur exclu de la stratégie d'indexation" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      quantizedFlat is a brute-force search over compressed vectors that supports up to 4,096 dimensions and has lower latency and RU cost than flat. It is recommended when the number of vectors in the scope of a search is 50,000 or fewer, which is the case when each query is filtered on one tenant.
    fr: |
      quantizedFlat est une recherche exhaustive sur des vecteurs compressés, qui prend en charge jusqu'à 4 096 dimensions et offre une latence et un coût en RU inférieurs à flat. Il est recommandé quand le nombre de vecteurs couverts par une recherche est de 50 000 ou moins, ce qui est le cas lorsque chaque requête filtre sur un seul locataire.
  options:
    a:
      en: |
        A flat index gives exact results, but it supports at most 505 dimensions, so 1,536-dimension vectors cannot use it.
      fr: |
        Un index flat donne des résultats exacts, mais il prend en charge au plus 505 dimensions : des vecteurs de 1 536 dimensions ne peuvent pas l'utiliser.
    b:
      en: |
        diskANN performs an approximate nearest neighbor search, which the requirement excludes.
      fr: |
        diskANN effectue une recherche approximative du plus proche voisin, ce que l'exigence exclut.
    d:
      en: |
        Without a vector index, VectorDistance scans the vectors in full, which costs more RUs and has higher latency.
      fr: |
        Sans index vectoriel, VectorDistance analyse les vecteurs en totalité, ce qui coûte plus de RU et augmente la latence.
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
