id: dp420-1b-point-read-methods
objective: "1.2.2"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Woodgrove Bank stores customer profiles in an Azure Cosmos DB for NoSQL container partitioned by `/customerId`. The `id` of each profile is the customer ID. A .NET service receives a customer ID and must retrieve the matching profile with the lowest RU charge.

    Which two methods can you use? Each correct answer presents a complete solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove Bank stocke des profils clients dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/customerId`. L'`id` de chaque profil est l'ID client. Un service .NET reçoit un ID client et doit récupérer le profil correspondant avec la charge de RU la plus faible.

    Quelles sont les deux méthodes que vous pouvez utiliser ? Chaque bonne réponse constitue une solution complète.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "GetItemLinqQueryable, with a Where clause on the id followed by ToFeedIterator", fr: "GetItemLinqQueryable, avec une clause Where sur l'id suivie de ToFeedIterator" } }
    - { id: b, text: { en: "ReadItemAsync, with the customer ID as the id and as the partition key value", fr: "ReadItemAsync, avec l'ID client comme id et comme valeur de clé de partition" } }
    - { id: c, text: { en: "ReadItemStreamAsync, with the customer ID as the id and as the partition key value", fr: "ReadItemStreamAsync, avec l'ID client comme id et comme valeur de clé de partition" } }
    - { id: d, text: { en: "GetItemQueryIterator, with a query that filters on c.id and QueryRequestOptions.PartitionKey set to the customer ID", fr: "GetItemQueryIterator, avec une requête qui filtre sur c.id et QueryRequestOptions.PartitionKey défini sur l'ID client" } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A point read uses the id and the partition key value and is the cheapest way to read one item. ReadItemAsync returns a deserialized ItemResponse, and ReadItemStreamAsync returns the same item as a stream without deserializing it. Both are point reads."
    fr: "Une lecture ponctuelle utilise l'id et la valeur de clé de partition ; c'est le moyen le moins coûteux de lire un élément. ReadItemAsync renvoie un ItemResponse désérialisé, et ReadItemStreamAsync renvoie le même élément sous forme de flux, sans le désérialiser. Les deux sont des lectures ponctuelles."
  options:
    d: { en: "A query that filters on one item's id and partition key is still a query, not a point read, and costs more RUs.", fr: "Une requête qui filtre sur l'id et la clé de partition d'un élément reste une requête, pas une lecture ponctuelle, et consomme plus de RU." }
    a: { en: "A LINQ query is translated into a query, which costs more than a point read.", fr: "Une requête LINQ est traduite en requête, ce qui coûte plus cher qu'une lecture ponctuelle." }
references:
  - title: Read an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-read-item
  - title: Optimize Request Cost - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
