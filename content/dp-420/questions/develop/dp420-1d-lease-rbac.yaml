id: dp420-1d-lease-rbac
objective: "1.4.3"
type: single
difficulty: 3
status: draft
stem:
  en: |
    A change feed processor authenticates to an Azure Cosmos DB for NoSQL account by using a managed identity and Microsoft Entra ID. Key-based authentication is disabled. The processor monitors a container named **orders** and stores its state in a container named **leases**. It never writes to the orders container.

    You need to assign Azure Cosmos DB built-in data plane roles to the managed identity by following the principle of least privilege.

    Which roles should you assign?
  fr: |
    Un processeur de flux de modification s'authentifie auprès d'un compte Azure Cosmos DB for NoSQL à l'aide d'une identité managée et de Microsoft Entra ID. L'authentification par clé est désactivée. Le processeur surveille un conteneur nommé **orders** et stocke son état dans un conteneur nommé **leases**. Il n'écrit jamais dans le conteneur orders.

    Vous devez attribuer à l'identité managée des rôles intégrés de plan de données Azure Cosmos DB en respectant le principe du moindre privilège.

    Quels rôles devez-vous attribuer ?
body:
  options:
    - { id: a, text: { en: "Cosmos DB Built-in Data Reader on orders and Cosmos DB Built-in Data Reader on leases", fr: "Cosmos DB Built-in Data Reader sur orders et Cosmos DB Built-in Data Reader sur leases" } }
    - { id: b, text: { en: "Cosmos DB Built-in Data Contributor on orders and Cosmos DB Built-in Data Contributor on leases", fr: "Cosmos DB Built-in Data Contributor sur orders et Cosmos DB Built-in Data Contributor sur leases" } }
    - { id: c, text: { en: "Cosmos DB Built-in Data Contributor on orders and Cosmos DB Built-in Data Reader on leases", fr: "Cosmos DB Built-in Data Contributor sur orders et Cosmos DB Built-in Data Reader sur leases" } }
    - { id: d, text: { en: "Cosmos DB Built-in Data Reader on orders and Cosmos DB Built-in Data Contributor on leases", fr: "Cosmos DB Built-in Data Reader sur orders et Cosmos DB Built-in Data Contributor sur leases" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      On the monitored container, the processor needs only readMetadata and readChangeFeed, which Cosmos DB Built-in Data Reader includes. On the lease container, it must read, create, replace and delete lease items and run queries, which requires Cosmos DB Built-in Data Contributor.
    fr: |
      Sur le conteneur surveillé, le processeur n'a besoin que de readMetadata et readChangeFeed, que Cosmos DB Built-in Data Reader inclut. Sur le conteneur de bail, il doit lire, créer, remplacer et supprimer des éléments de bail et exécuter des requêtes, ce qui exige Cosmos DB Built-in Data Contributor.
  options:
    a: { en: "Data Reader cannot create, replace or delete the lease documents.", fr: "Data Reader ne peut pas créer, remplacer ni supprimer les documents de bail." }
    b: { en: "Write access to orders is not needed, so Data Contributor on orders exceeds least privilege.", fr: "L'accès en écriture à orders n'est pas nécessaire : Data Contributor sur orders dépasse le moindre privilège." }
    c: { en: "This grants unnecessary writes on orders and prevents the processor from writing its leases.", fr: "Cela accorde des écritures inutiles sur orders et empêche le processeur d'écrire ses baux." }
references:
