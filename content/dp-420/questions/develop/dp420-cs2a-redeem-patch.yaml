id: dp420-cs2a-redeem-patch
objective: "1.2.3"
type: dropdown
caseStudy: dp420-cs2a-fourth-coffee
difficulty: 2
status: draft
stem:
  en: |
    You are writing the method of the loyalty API that redeems a reward worth 150 points for member m-5521.

    You need to complete the code to meet the second requirement.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous écrivez la méthode de l'API de fidélité qui échange une récompense de 150 points pour le membre m-5521.

    Vous devez compléter le code pour respecter la deuxième exigence.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    PatchItemRequestOptions options = new()
    {
        FilterPredicate = [[pred]]
    };

    List<PatchOperation> operations = new()
    {
        [[op]]
    };

    ItemResponse<Member> response = await container.[[method]]<Member>(
        id: "m-5521",
        partitionKey: new PartitionKey("m-5521"),
        patchOperations: operations,
        requestOptions: options);
  slots:
    - id: pred
      options:
        - { id: from, text: "\"FROM m WHERE m.points >= 150\"" }
        - { id: where, text: "\"WHERE points >= 150\"" }
        - { id: select, text: "\"SELECT * FROM m WHERE m.points > 0\"" }
        - { id: etag, text: "\"_etag\"" }
    - id: op
      options:
        - { id: set, text: "PatchOperation.Set(\"/points\", -150)" }
        - { id: incr, text: "PatchOperation.Increment(\"/points\", -150)" }
        - { id: repl, text: "PatchOperation.Replace(\"/points\", 150)" }
        - { id: remove, text: "PatchOperation.Remove(\"/points\")" }
    - id: method
      options:
        - { id: replace, text: ReplaceItemAsync }
        - { id: upsert, text: UpsertItemAsync }
        - { id: patch, text: PatchItemAsync }
answer:
  values: { pred: from, op: incr, method: patch }
explanation:
  correct:
    en: "`PatchItemAsync` applies the operations on the server in one request, without a prior read. `PatchOperation.Increment` with a negative value decrements the property. A conditional patch uses a SQL-like filter predicate of the form `FROM m WHERE ...`; if the item does not match it, the operation fails and nothing is changed."
    fr: "`PatchItemAsync` applique les opérations côté serveur en une seule requête, sans lecture préalable. `PatchOperation.Increment` avec une valeur négative décrémente la propriété. Un correctif conditionnel utilise un prédicat de filtre de type SQL de la forme `FROM m WHERE ...` : si l'élément n'y correspond pas, l'opération échoue et rien n'est modifié."
  options:
    where: { en: "The filter predicate starts with a FROM clause that names an alias, as in FROM products p WHERE p.used = false.", fr: "Le prédicat de filtre commence par une clause FROM qui nomme un alias, comme FROM products p WHERE p.used = false." }
    select: { en: "Checking only that the balance is positive does not prevent it from going below zero when it is lower than 150 points.", fr: "Vérifier seulement que le solde est positif n'empêche pas qu'il devienne négatif lorsqu'il est inférieur à 150 points." }
    etag: { en: "An ETag check is done with IfMatchEtag and requires reading the item first; it is not a filter predicate.", fr: "Une vérification d'ETag se fait avec IfMatchEtag et impose de lire l'élément au préalable ; ce n'est pas un prédicat de filtre." }
    set: { en: "Set writes the value -150 instead of subtracting 150 from the current value.", fr: "Set écrit la valeur -150 au lieu de soustraire 150 de la valeur actuelle." }
    repl: { en: "Replace overwrites the property with 150; it does not decrement it.", fr: "Replace remplace la propriété par 150 ; il ne la décrémente pas." }
    remove: { en: "Remove deletes the property from the item.", fr: "Remove supprime la propriété de l'élément." }
    replace: { en: "ReplaceItemAsync sends a whole item, which requires reading it first, and does not accept patch operations.", fr: "ReplaceItemAsync envoie un élément entier, ce qui impose de le lire d'abord, et n'accepte pas d'opérations de correctif." }
    upsert: { en: "UpsertItemAsync also sends a whole item and does not accept patch operations.", fr: "UpsertItemAsync envoie aussi un élément entier et n'accepte pas d'opérations de correctif." }
references:
  - title: Get started with Azure Cosmos DB partial document update
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update-getting-started
  - title: Partial document update in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
