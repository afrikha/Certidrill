id: dp420-1a-cons-behaviors-yn
objective: "1.1.1"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Litware runs a multi-region application on Azure Cosmos DB for NoSQL. The account has one write region, and its default consistency level is Session. Some services write items by using transactional batches.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware exécute une application multirégion sur Azure Cosmos DB for NoSQL. Le compte possède une région d'écriture et son niveau de cohérence par défaut est Session. Certains services écrivent des éléments au moyen de lots transactionnels.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: A client instance that has never written to a physical partition gets Eventual guarantees when it reads from that partition.
        fr: Une instance de client qui n'a jamais écrit dans une partition physique obtient les garanties Eventual lorsqu'elle lit depuis cette partition.
    - id: s2
      text:
        en: If the default level is changed to Consistent prefix, a reader can see some writes of a transactional batch before the other writes of the same batch.
        fr: Si le niveau par défaut passe à Consistent prefix, un lecteur peut voir certaines écritures d'un lot transactionnel avant les autres écritures du même lot.
    - id: s3
      text:
        en: By default, Strong consistency is blocked for accounts whose regions are more than 8,000 km (5,000 miles) apart.
        fr: Par défaut, la cohérence Strong est bloquée pour les comptes dont les régions sont distantes de plus de 8 000 km (5 000 miles).
answer:
  values: { s1: true, s2: false, s3: true }
explanation:
  correct:
    en: Session tokens are partition-bound; a client that hasn't written to a partition has no token for it, so its reads there behave like Eventual. With Consistent prefix, the writes of a transactional batch become visible together, never partially. Accounts with regions more than 5,000 miles (8,000 km) apart can't select Strong unless support enables it.
    fr: Les jetons de session sont liés à une partition ; un client qui n'a pas écrit dans une partition n'a pas de jeton pour celle-ci, et ses lectures s'y comportent comme Eventual. Avec Consistent prefix, les écritures d'un lot transactionnel deviennent visibles ensemble, jamais partiellement. Les comptes dont les régions sont distantes de plus de 5 000 miles (8 000 km) ne peuvent pas choisir Strong, sauf si le support l'active.
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
