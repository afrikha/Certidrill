id: dp420-1b-concurrency-dragdrop
objective: "1.2.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Adatum's banking platform runs on an Azure Cosmos DB for NoSQL account with multi-region writes. Accounts and their transactions are stored in a container partitioned by `/customerId`.

    Which mechanism should you use for each requirement? To answer, drag the appropriate mechanisms to the correct requirements. Each mechanism may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    La plateforme bancaire d'Adatum s'exécute sur un compte Azure Cosmos DB for NoSQL avec écritures multirégions. Les comptes et leurs transactions sont stockés dans un conteneur partitionné par `/customerId`.

    Quel mécanisme devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les mécanismes appropriés vers les exigences correspondantes. Chaque mécanisme peut être utilisé une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: etag, text: { en: "Replace with an If-Match ETag condition", fr: "Remplacement avec une condition ETag If-Match" } }
    - { id: batch, text: { en: "Transactional batch", fr: "Lot transactionnel" } }
    - { id: filter, text: { en: "Patch with a filter predicate", fr: "Patch avec un prédicat de filtre" } }
    - { id: policy, text: { en: "Conflict resolution policy", fr: "Stratégie de résolution des conflits" } }
    - { id: strong, text: { en: "Strong consistency", fr: "Cohérence Strong" } }
  targets:
    - { id: t1, text: { en: "Reject a profile replace when another user changed the profile after it was read", fr: "Rejeter le remplacement d'un profil quand un autre utilisateur l'a modifié après sa lecture" } }
    - { id: t2, text: { en: "Debit a savings account and credit a checking account of the same customer, all or nothing", fr: "Débiter un compte épargne et créditer un compte courant du même client, tout ou rien" } }
    - { id: t3, text: { en: "Decrease a card's remaining limit in one request, only if the limit stays positive", fr: "Diminuer le plafond restant d'une carte en une requête, uniquement si le plafond reste positif" } }
    - { id: t4, text: { en: "Decide which version is kept when two regions update the same item at the same time", fr: "Déterminer la version conservée quand deux régions mettent à jour le même élément en même temps" } }
answer:
  mapping: { t1: etag, t2: batch, t3: filter, t4: policy }
explanation:
  correct:
    en: "An If-Match ETag condition makes a replace fail with 412 when the item changed since it was read. A transactional batch makes several operations on one partition key atomic. A patch with a filter predicate is applied only if the item satisfies the condition. With multi-region writes, the conflict resolution policy (Last Write Wins or custom) decides which concurrent version is kept. Strong consistency governs reads and does not resolve write conflicts."
    fr: "Une condition ETag If-Match fait échouer un remplacement avec le code 412 quand l'élément a changé depuis sa lecture. Un lot transactionnel rend atomiques plusieurs opérations sur une même clé de partition. Un patch avec un prédicat de filtre n'est appliqué que si l'élément satisfait la condition. Avec les écritures multirégions, la stratégie de résolution des conflits (Last Write Wins ou personnalisée) détermine la version simultanée conservée. La cohérence Strong régit les lectures et ne résout pas les conflits d'écriture."
references:
  - title: Database Transactions and Optimistic Concurrency Control - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
  - title: Conflict Resolution Types and Resolution Policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
