id: dp420-1b-query-options-dragdrop
objective: "1.2.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    You are tuning queries that a .NET application runs against an Azure Cosmos DB for NoSQL container partitioned by `/regionId`.

    Which `QueryRequestOptions` property should you set for each requirement? To answer, drag the appropriate properties to the correct requirements. Each property may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous optimisez les requêtes qu'une application .NET exécute sur un conteneur Azure Cosmos DB for NoSQL partitionné par `/regionId`.

    Quelle propriété de `QueryRequestOptions` devez-vous définir pour chaque exigence ? Pour répondre, faites glisser les propriétés appropriées vers les exigences correspondantes. Chaque propriété peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: pk, text: PartitionKey }
    - { id: max, text: MaxItemCount }
    - { id: conc, text: MaxConcurrency }
    - { id: buf, text: MaxBufferedItemCount }
    - { id: cons, text: ConsistencyLevel }
  targets:
    - { id: t1, text: { en: "Run the query only against the logical partition of one region", fr: "Exécuter la requête uniquement sur la partition logique d'une région" } }
    - { id: t2, text: { en: "Return at most 100 items in each page", fr: "Renvoyer au plus 100 éléments par page" } }
    - { id: t3, text: { en: "Visit at most four physical partitions in parallel", fr: "Visiter au plus quatre partitions physiques en parallèle" } }
    - { id: t4, text: { en: "Prefetch up to 5,000 results on the client", fr: "Prérécupérer jusqu'à 5 000 résultats côté client" } }
answer:
  mapping: { t1: pk, t2: max, t3: conc, t4: buf }
explanation:
  correct:
    en: "PartitionKey scopes the query to one logical partition. MaxItemCount caps the number of items per page. MaxConcurrency sets the maximum number of partitions visited in parallel. MaxBufferedItemCount limits the number of prefetched results. ConsistencyLevel changes the read consistency of the request, which meets none of the requirements."
    fr: "PartitionKey limite la requête à une partition logique. MaxItemCount plafonne le nombre d'éléments par page. MaxConcurrency définit le nombre maximal de partitions visitées en parallèle. MaxBufferedItemCount limite le nombre de résultats prérécupérés. ConsistencyLevel modifie la cohérence de lecture de la requête, ce qui ne répond à aucune exigence."
references:
  - title: Query Performance Tips for Sdks - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/performance-tips-query-sdk
