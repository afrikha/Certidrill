id: dp420-1d-hpk-routing
objective: "1.3.7"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Tailspin stores user sessions in an Azure Cosmos DB for NoSQL container named **sessions**. The container uses a hierarchical partition key with the levels `/TenantId`, `/UserId` and `/SessionId`, in that order. The container has 120 physical partitions.

    You review the data access code of the application.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin stocke les sessions utilisateur dans un conteneur Azure Cosmos DB for NoSQL nommé **sessions**. Le conteneur utilise une clé de partition hiérarchique avec les niveaux `/TenantId`, `/UserId` et `/SessionId`, dans cet ordre. Le conteneur compte 120 partitions physiques.

    Vous examinez le code d'accès aux données de l'application.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "A query with the filter `WHERE c.UserId = @user` is sent to all 120 physical partitions."
        fr: "Une requête avec le filtre `WHERE c.UserId = @user` est envoyée aux 120 partitions physiques."
    - id: s2
      text:
        en: A point read of a session item succeeds when the code passes the item id and a partition key built from the TenantId value only.
        fr: Une lecture ponctuelle d'un élément de session réussit lorsque le code transmet l'id de l'élément et une clé de partition construite à partir de la seule valeur de TenantId.
    - id: s3
      text:
        en: An administrator can later add /DeviceId as a fourth level by updating the partition key definition of the container.
        fr: Un administrateur peut ajouter ultérieurement /DeviceId comme quatrième niveau en mettant à jour la définition de la clé de partition du conteneur.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Queries are routed efficiently only when they filter on the full key or on a prefix that starts with the first level; a filter on the middle level UserId alone fans out to all physical partitions. A point read needs the item id and the full partition key value, with all three levels. Hierarchical keys support at most three levels, and the partition key paths cannot be changed after the container is created.
    fr: |
      Les requêtes ne sont acheminées efficacement que si elles filtrent sur la clé complète ou sur un préfixe qui commence par le premier niveau ; un filtre sur le seul niveau intermédiaire UserId est distribué à toutes les partitions physiques. Une lecture ponctuelle nécessite l'id de l'élément et la valeur complète de la clé de partition, avec les trois niveaux. Les clés hiérarchiques comptent au plus trois niveaux, et les chemins de clé de partition ne peuvent pas être modifiés après la création du conteneur.
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
