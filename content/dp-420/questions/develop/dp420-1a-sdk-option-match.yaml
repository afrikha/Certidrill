id: dp420-1a-sdk-option-match
objective: "1.1.6"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    Fabrikam is reviewing the .NET SDK v3 configuration of a payment service that uses a multi-region Azure Cosmos DB for NoSQL account. The team lists four requirements.

    Which SDK feature should you use for each requirement? To answer, drag the appropriate features to the correct requirements. Each feature may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam examine la configuration du SDK .NET v3 d'un service de paiement qui utilise un compte Azure Cosmos DB for NoSQL multirégion. L'équipe énumère quatre exigences.

    Quelle fonctionnalité du SDK devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les fonctionnalités appropriées vers les exigences correspondantes. Chaque fonctionnalité peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: hedging, text: { en: "AvailabilityStrategy (cross-region hedging)", fr: "AvailabilityStrategy (couverture interrégion)" } }
    - { id: maxwait, text: MaxRetryWaitTimeOnRateLimitedRequests }
    - { id: exclude, text: { en: "ExcludeRegions in the request options", fr: "ExcludeRegions dans les options de requête" } }
    - { id: keycred, text: AzureKeyCredential }
    - { id: limit, text: LimitToEndpoint }
    - { id: appname, text: ApplicationName }
  targets:
    - id: t1
      text: { en: "If the first region hasn't answered a read after 500 ms, send the read to another region and keep the fastest response", fr: "Si la première région n'a pas répondu à une lecture au bout de 500 ms, envoyer la lecture vers une autre région et conserver la réponse la plus rapide" }
    - id: t2
      text: { en: "Keep retrying rate-limited requests for up to two minutes before failing", fr: "Continuer les nouvelles tentatives des requêtes limitées en débit jusqu'à deux minutes avant d'échouer" }
    - id: t3
      text: { en: "Route one reporting query away from the East US region", fr: "Éloigner une requête de reporting de la région East US" }
    - id: t4
      text: { en: "Rotate the account key without recreating the CosmosClient instance", fr: "Faire pivoter la clé du compte sans recréer l'instance de CosmosClient" }
answer:
  mapping: { t1: hedging, t2: maxwait, t3: exclude, t4: keycred }
explanation:
  correct:
    en: |
      A threshold-based availability strategy hedges a request to other regions after a threshold such as 500 ms and keeps the fastest response. `MaxRetryWaitTimeOnRateLimitedRequests` sets the cumulative wait for retries on HTTP 429. `ExcludeRegions` on the request options excludes regions for a single request. `AzureKeyCredential` lets you update the key while the client is in use.
    fr: |
      Une stratégie de disponibilité basée sur un seuil duplique une requête vers d'autres régions après un seuil comme 500 ms et conserve la réponse la plus rapide. `MaxRetryWaitTimeOnRateLimitedRequests` définit l'attente cumulée des nouvelles tentatives sur HTTP 429. `ExcludeRegions` dans les options de requête exclut des régions pour une seule requête. `AzureKeyCredential` permet de mettre à jour la clé pendant que le client est utilisé.
  options:
    limit: { en: "LimitToEndpoint confines all operations of the client to the endpoint provided, not one request.", fr: "LimitToEndpoint limite toutes les opérations du client au point de terminaison fourni, pas une seule requête." }
    appname: { en: "ApplicationName only adds a suffix to the user agent.", fr: "ApplicationName ajoute seulement un suffixe à l'agent utilisateur." }
references:
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
  - title: CosmosClient Class (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient
