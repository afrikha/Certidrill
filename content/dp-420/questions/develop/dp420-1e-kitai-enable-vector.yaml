id: dp420-1e-kitai-enable-vector
objective: "1.5.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is building a retrieval-augmented generation (RAG) chat application on an existing Azure Cosmos DB for NoSQL account named **cosmos-kb** that uses provisioned throughput at the container level. No feature or capability has been enabled on the account.

    Your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, generates code that creates a container with a vector embedding policy and a `diskANN` vector index. You need the code to be able to create the container.

    What should you do first on **cosmos-kb**?
  fr: |
    Contoso crée une application de conversation à génération augmentée de récupération (RAG) sur un compte Azure Cosmos DB for NoSQL existant nommé **cosmos-kb**, qui utilise un débit approvisionné au niveau des conteneurs. Aucune fonctionnalité ni capacité n'a été activée sur le compte.

    Votre assistant de codage IA, sur lequel Azure Cosmos DB Agent Kit est installé, génère du code qui crée un conteneur avec une stratégie d'incorporation vectorielle et un index vectoriel `diskANN`. Le code doit pouvoir créer le conteneur.

    Que devez-vous faire en premier sur **cosmos-kb** ?
body:
  options:
    - id: a
      text: { en: "Enable the Vector Search for NoSQL API feature.", fr: "Activer la fonctionnalité Vector Search for NoSQL API." }
    - id: b
      text: { en: "Switch the account to continuous backup.", fr: "Passer le compte en sauvegarde continue." }
    - id: c
      text: { en: "Enable the analytical store on the account.", fr: "Activer le magasin analytique sur le compte." }
    - id: d
      text: { en: "Enable the Merge partition capability.", fr: "Activer la capacité Merge partition." }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Vector indexing and search must be enabled on the account before you can define vector policies and indexes. You enable Vector Search for NoSQL API on the Features page in the Azure portal, or you add the EnableNoSQLVectorSearch capability with az cosmosdb update; the request is approved automatically but can take about 15 minutes to take effect.
    fr: |
      La recherche et l'indexation vectorielles doivent être activées sur le compte avant de pouvoir définir des stratégies et des index vectoriels. Vous activez Vector Search for NoSQL API dans la page Features du portail Azure, ou vous ajoutez la capacité EnableNoSQLVectorSearch avec az cosmosdb update ; la demande est approuvée automatiquement mais peut mettre environ 15 minutes à prendre effet.
  options:
    b:
      en: |
        Continuous backup is a prerequisite for the all versions and deletes change feed, not for vector search.
      fr: |
        La sauvegarde continue est un prérequis du flux de modification toutes les versions et suppressions, pas de la recherche vectorielle.
    c:
      en: |
        The analytical store is a separate column store for analytics; it is not used by vector indexes.
      fr: |
        Le magasin analytique est un magasin en colonnes distinct destiné à l'analytique ; il n'est pas utilisé par les index vectoriels.
    d:
      en: |
        Merge partition reduces the number of physical partitions; it does not enable vector policies.
      fr: |
        Merge partition réduit le nombre de partitions physiques ; il n'active pas les stratégies vectorielles.
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
