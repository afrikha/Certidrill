id: dp420-1b-batch-limits
objective: "1.2.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Litware designs a ledger on Azure Cosmos DB for NoSQL. A .NET service will use `TransactionalBatch` to post journal entries and update account balances in one transaction.

    Which two statements about transactional batches are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware conçoit un grand livre sur Azure Cosmos DB for NoSQL. Un service .NET utilisera `TransactionalBatch` pour enregistrer des écritures comptables et mettre à jour les soldes de comptes en une seule transaction.

    Quelles sont les deux affirmations vraies sur les lots transactionnels ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A batch can run for up to 60 seconds before the service aborts it.", fr: "Un lot peut s'exécuter jusqu'à 60 secondes avant que le service ne l'interrompe." } }
    - { id: b, text: { en: "All the operations of a batch must target the same partition key value in the same container.", fr: "Toutes les opérations d'un lot doivent cibler la même valeur de clé de partition dans le même conteneur." } }
    - { id: c, text: { en: "A batch can contain at most 100 operations.", fr: "Un lot peut contenir au plus 100 opérations." } }
    - { id: d, text: { en: "A batch can include operations on two containers of the same database.", fr: "Un lot peut inclure des opérations sur deux conteneurs de la même base de données." } }
    - { id: e, text: { en: "The service runs the operations of a batch in parallel, in any order.", fr: "Le service exécute les opérations d'un lot en parallèle, dans n'importe quel ordre." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "A transactional batch groups point operations that share the same partition key within one container. A batch is limited to 100 operations, a 2-MB payload and 5 seconds of execution time."
    fr: "Un lot transactionnel regroupe des opérations ponctuelles qui partagent la même clé de partition au sein d'un conteneur. Un lot est limité à 100 opérations, à une charge utile de 2 Mo et à 5 secondes d'exécution."
  options:
    d: { en: "A batch is created from one container for one partition key; it cannot span containers.", fr: "Un lot est créé à partir d'un conteneur pour une clé de partition ; il ne peut pas couvrir plusieurs conteneurs." }
    e: { en: "The transaction commits only if all the operations succeed in the order described.", fr: "La transaction n'est validée que si toutes les opérations réussissent dans l'ordre décrit." }
    a: { en: "The maximum execution time of a batch is 5 seconds.", fr: "La durée d'exécution maximale d'un lot est de 5 secondes." }
references:
  - title: Transactional batch operations in Azure Cosmos DB using the .NET or Java SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/transactional-batch
