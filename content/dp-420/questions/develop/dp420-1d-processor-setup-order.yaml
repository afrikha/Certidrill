id: dp420-1d-processor-setup-order
objective: "1.4.1"
type: ordering
difficulty: 1
status: draft
stem:
  en: |
    You need to implement a change feed processor in a .NET application to react to the creates and updates of an Azure Cosmos DB for NoSQL container named **orders**. The processor will read in latest version mode. No lease container exists yet.

    Which four actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Vous devez implémenter un processeur de flux de modification dans une application .NET pour réagir aux créations et mises à jour d'un conteneur Azure Cosmos DB for NoSQL nommé **orders**. Le processeur lira en mode dernière version. Aucun conteneur de bail n'existe encore.

    Quelles sont les quatre actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 4
  actions:
    - { id: lease, text: { en: "Call CreateContainerIfNotExistsAsync to create a lease container with the partition key path /id, and keep the returned Container.", fr: "Appeler CreateContainerIfNotExistsAsync pour créer un conteneur de bail avec le chemin de clé de partition /id, et conserver le Container renvoyé." } }
    - { id: builder, text: { en: "Call GetChangeFeedProcessorBuilder on the orders container, set WithInstanceName, and pass the returned lease Container to WithLeaseContainer.", fr: "Appeler GetChangeFeedProcessorBuilder sur le conteneur orders, définir WithInstanceName et transmettre le Container de bail renvoyé à WithLeaseContainer." } }
    - { id: build, text: { en: "Call Build to obtain the ChangeFeedProcessor instance.", fr: "Appeler Build pour obtenir l'instance ChangeFeedProcessor." } }
    - { id: start, text: { en: "Call StartAsync on the processor.", fr: "Appeler StartAsync sur le processeur." } }
    - { id: backup, text: { en: "Configure continuous backup on the account.", fr: "Configurer la sauvegarde continue sur le compte." } }
    - { id: ranges, text: { en: "Call GetFeedRangesAsync and assign one feed range to each instance.", fr: "Appeler GetFeedRangesAsync et attribuer une plage de flux à chaque instance." } }
answer:
  sequence: [ lease, builder, build, start ]
explanation:
  correct:
    en: |
      The processor stores its state in a lease container, so the container must exist first, with /id as the partition key when it is partitioned. You then get the builder from the monitored container, set a unique instance name and the lease container, call Build, and start the processor with StartAsync.
    fr: |
      Le processeur stocke son état dans un conteneur de bail ; ce conteneur doit donc exister d'abord, avec /id comme clé de partition lorsqu'il est partitionné. Vous obtenez ensuite le générateur à partir du conteneur surveillé, définissez un nom d'instance unique et le conteneur de bail, appelez Build, puis démarrez le processeur avec StartAsync.
  options:
    backup: { en: "Continuous backup is required only for all versions and deletes mode.", fr: "La sauvegarde continue n'est requise que pour le mode toutes les versions et suppressions." }
    ranges: { en: "Feed ranges are used to parallelize the pull model; the processor distributes leases automatically.", fr: "Les plages de flux servent à paralléliser le modèle de tirage ; le processeur distribue automatiquement les baux." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
  - title: Use Change Feed With Azure Functions - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-functions
