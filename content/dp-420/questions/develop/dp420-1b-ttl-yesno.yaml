id: dp420-1b-ttl-yesno
objective: "1.2.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware uses time to live (TTL) on an Azure Cosmos DB for NoSQL container whose `DefaultTimeToLive` is 604800. The account uses the serverless capacity mode.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware utilise la durée de vie (TTL) sur un conteneur Azure Cosmos DB for NoSQL dont la propriété `DefaultTimeToLive` vaut 604800. Le compte utilise le mode de capacité serverless.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: "To make an item that has `\"ttl\": 60` use the container default again, you set its ttl property to null."
        fr: "Pour qu'un élément qui a `\"ttl\": 60` utilise de nouveau la valeur par défaut du conteneur, vous définissez sa propriété ttl sur null."
    - id: s2
      text:
        en: "An item without a ttl property expires 604,800 seconds after its last modification."
        fr: "Un élément sans propriété ttl expire 604 800 secondes après sa dernière modification."
    - id: s3
      text:
        en: "The deletion of expired items is charged in RUs at the same rate as delete operations."
        fr: "La suppression des éléments expirés est facturée en RU au même tarif que les opérations de suppression."
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: "Setting ttl to null is not supported; to use the container default, you remove the ttl property from the item. An item without ttl uses the container default, counted from its last modification. On serverless accounts, TTL deletions are charged in RUs at the same rate as delete item operations, whereas provisioned throughput uses leftover RUs."
    fr: "Définir ttl sur null n'est pas pris en charge ; pour utiliser la valeur par défaut du conteneur, vous supprimez la propriété ttl de l'élément. Un élément sans ttl utilise la valeur par défaut du conteneur, calculée depuis sa dernière modification. Sur les comptes serverless, les suppressions par TTL sont facturées en RU au même tarif que les suppressions d'éléments, alors qu'en débit approvisionné elles utilisent les RU inutilisées."
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
