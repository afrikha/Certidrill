id: dp420-1a-ru-regions-total
objective: "1.1.2"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    Northwind Traders has an Azure Cosmos DB for NoSQL account replicated to three Azure regions: East US, West US, and North Europe. A container named **orders** has 10,000 RU/s of dedicated manual throughput.

    You need to determine the total throughput that is available for the container across all the regions of the account.

    What is the total throughput?
  fr: |
    Northwind Traders dispose d'un compte Azure Cosmos DB for NoSQL répliqué dans trois régions Azure : East US, West US et North Europe. Un conteneur nommé **orders** dispose d'un débit manuel dédié de 10 000 RU/s.

    Vous devez déterminer le débit total disponible pour le conteneur dans l'ensemble des régions du compte.

    Quel est le débit total ?
body:
  options:
    - { id: a, text: "3,333 RU/s" }
    - { id: b, text: "10,000 RU/s" }
    - { id: c, text: "20,000 RU/s" }
    - { id: d, text: "30,000 RU/s" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Throughput assigned to a container is available in every region of the account; you can't assign RU/s to a specific region. With R RU/s and N regions, the total throughput is R x N, here 10,000 x 3 = 30,000 RU/s, and each region is billed for its RU/s.
    fr: |
      Le débit attribué à un conteneur est disponible dans chaque région du compte ; vous ne pouvez pas attribuer de RU/s à une région précise. Avec R RU/s et N régions, le débit total vaut R x N, ici 10 000 x 3 = 30 000 RU/s, et chaque région est facturée pour ses RU/s.
  options:
    a: { en: "The RU/s aren't split between regions: each region gets the full 10,000 RU/s.", fr: "Les RU/s ne sont pas réparties entre les régions : chaque région reçoit la totalité des 10 000 RU/s." }
    b: { en: "10,000 RU/s is the throughput available in each region, not the total across three regions.", fr: "10 000 RU/s est le débit disponible dans chaque région, pas le total sur trois régions." }
    c: { en: "All three regions, including the write region, receive the container's RU/s.", fr: "Les trois régions, y compris la région d'écriture, reçoivent les RU/s du conteneur." }
references:
  - title: Request Units as a throughput and performance currency - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
