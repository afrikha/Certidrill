stem:
  en: You create the container with hierarchical partition keys on tenantId, userId, and sessionId.
  fr: Vous créez le conteneur avec des clés de partition hiérarchiques sur tenantId, userId et sessionId.
body:
  solution:
    en: |
      You create the container by using the following code:

      ```csharp
      List<string> partitionKeyPaths = new List<string>
      {
          "/tenantId",
          "/userId",
          "/sessionId"
      };

      ContainerProperties properties = new ContainerProperties(
          id: "activity",
          partitionKeyPaths: partitionKeyPaths);

      Container container = await database.CreateContainerIfNotExistsAsync(
          properties,
          ThroughputProperties.CreateAutoscaleThroughput(50000));
      ```
    fr: |
      Vous créez le conteneur à l'aide du code suivant :

      ```csharp
      List<string> partitionKeyPaths = new List<string>
      {
          "/tenantId",
          "/userId",
          "/sessionId"
      };

      ContainerProperties properties = new ContainerProperties(
          id: "activity",
          partitionKeyPaths: partitionKeyPaths);

      Container container = await database.CreateContainerIfNotExistsAsync(
          properties,
          ThroughputProperties.CreateAutoscaleThroughput(50000));
      ```
answer: { value: true }
explanation:
  correct:
    en: With hierarchical partition keys, a prefix such as a single `tenantId` value can span several physical partitions and exceed 20 GB and 10,000 RU/s. A query that filters on `tenantId` only, or on `tenantId` and `userId`, is a targeted cross-partition query routed only to the physical partitions that hold that prefix. Up to three levels are supported, and they must be defined when the container is created.
    fr: "Avec des clés de partition hiérarchiques, un préfixe tel qu'une seule valeur de `tenantId` peut s'étendre sur plusieurs partitions physiques et dépasser 20 Go et 10 000 RU/s. Une requête qui filtre uniquement sur `tenantId`, ou sur `tenantId` et `userId`, est une requête ciblée dans plusieurs partitions, acheminée uniquement vers les partitions physiques qui contiennent ce préfixe. Jusqu'à trois niveaux sont pris en charge, et ils doivent être définis à la création du conteneur."
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
