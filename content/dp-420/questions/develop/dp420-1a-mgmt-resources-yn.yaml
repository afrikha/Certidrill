id: dp420-1a-mgmt-resources-yn
objective: "1.1.5"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Contoso is writing a .NET tool that creates and manages databases and containers in an Azure Cosmos DB for NoSQL account. The account will host many small applications.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso écrit un outil .NET qui crée et gère des bases de données et des conteneurs dans un compte Azure Cosmos DB for NoSQL. Le compte hébergera de nombreuses petites applications.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Calling GetContainer on a CosmosClient instance sends a request to the service to check that the container exists.
        fr: L'appel de GetContainer sur une instance de CosmosClient envoie une requête au service pour vérifier que le conteneur existe.
    - id: s2
      text:
        en: A container that has dedicated throughput can be converted into a container that shares the database throughput.
        fr: Un conteneur qui dispose d'un débit dédié peut être converti en conteneur qui partage le débit de la base de données.
    - id: s3
      text:
        en: The account can hold at most 500 databases and containers in total.
        fr: Le compte peut contenir au maximum 500 bases de données et conteneurs au total.
answer:
  values: { s1: false, s2: false, s3: true }
explanation:
  correct:
    en: |
      `GetContainer` and `GetDatabase` only return proxy references and make no network call. You can't convert a container between dedicated and shared throughput; the data must be moved to a new container, for example with a container copy job. An account supports up to 500 databases and containers combined, a limit that can't be increased.
    fr: |
      `GetContainer` et `GetDatabase` renvoient uniquement des références proxy et n'effectuent aucun appel réseau. Vous ne pouvez pas convertir un conteneur entre débit dédié et débit partagé ; les données doivent être déplacées vers un nouveau conteneur, par exemple avec une tâche de copie de conteneur. Un compte prend en charge jusqu'à 500 bases de données et conteneurs au total, une limite qui ne peut pas être augmentée.
references:
  - title: CosmosClient Class (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclient
  - title: Service Quotas and Default Limits - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/concepts-limits
