id: dp420-cs2a-client-region
objective: "1.1.6"
type: single
caseStudy: dp420-cs2a-fourth-coffee
difficulty: 1
status: draft
stem:
  en: |
    You are writing the code that creates the CosmosClient of the loyalty API. The same code is deployed to the three regions, and each instance reads the name of its region from an app setting.

    You need to configure the client to meet the third requirement.

    Which CosmosClientOptions setting should you configure?
  fr: |
    Vous écrivez le code qui crée le CosmosClient de l'API de fidélité. Le même code est déployé dans les trois régions, et chaque instance lit le nom de sa région dans un paramètre d'application.

    Vous devez configurer le client pour respecter la troisième exigence.

    Quel paramètre de CosmosClientOptions devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "ApplicationPreferredRegions set to the same list of the three regions on every instance", fr: "ApplicationPreferredRegions défini sur la même liste des trois régions dans chaque instance" } }
    - { id: b, text: { en: "ApplicationRegion set to the region of the instance", fr: "ApplicationRegion défini sur la région de l'instance" } }
    - { id: c, text: { en: "ConnectionMode set to Gateway on every instance", fr: "ConnectionMode défini sur Gateway dans chaque instance" } }
    - { id: d, text: { en: "ConsistencyLevel set to Session on every instance", fr: "ConsistencyLevel défini sur Session dans chaque instance" } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `ApplicationRegion` tells the SDK in which region the application runs. On an account with multi-region writes, the client then sends its reads and writes to that region, and it builds the order of the other regions for failover from geographic proximity.
    fr: |
      `ApplicationRegion` indique au SDK la région dans laquelle l'application s'exécute. Sur un compte à écritures multirégions, le client envoie alors ses lectures et ses écritures à cette région, et il établit l'ordre des autres régions pour le basculement en fonction de la proximité géographique.
  options:
    a: { en: "With the same ordered list everywhere, every instance would use the first available region of the list, so most instances would not use their own region.", fr: "Avec la même liste ordonnée partout, chaque instance utiliserait la première région disponible de la liste : la plupart des instances n'utiliseraient pas leur propre région." }
    c: { en: "The connection mode changes how the client connects to the service, not which region it uses.", fr: "Le mode de connexion modifie la façon dont le client se connecte au service, pas la région qu'il utilise." }
    d: { en: "The consistency level of the client does not select the region that receives its requests.", fr: "Le niveau de cohérence du client ne sélectionne pas la région qui reçoit ses requêtes." }
references:
  - title: Configure Multi-Region Writes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-multi-master
