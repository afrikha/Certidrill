id: dp420-1a-cons-weakest-match
objective: "1.1.1"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Wingtip Toys plans four applications that will each use their own Azure Cosmos DB for NoSQL account. Each account has a single write region and at least one read region.

    For each requirement, you need to select the weakest consistency level that meets it. Which consistency level should you select for each requirement? To answer, drag the appropriate levels to the correct requirements. Each level may be used once, more than once, or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Wingtip Toys prévoit quatre applications qui utiliseront chacune leur propre compte Azure Cosmos DB for NoSQL. Chaque compte possède une seule région d'écriture et au moins une région de lecture.

    Pour chaque exigence, vous devez sélectionner le niveau de cohérence le plus faible qui y répond. Quel niveau de cohérence devez-vous sélectionner pour chaque exigence ? Pour répondre, faites glisser les niveaux appropriés vers les exigences correspondantes. Chaque niveau peut être utilisé une fois, plusieurs fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: true
  items:
    - { id: strong, text: Strong }
    - { id: bounded, text: Bounded staleness }
    - { id: session, text: Session }
    - { id: prefix, text: Consistent prefix }
    - { id: eventual, text: Eventual }
  targets:
    - id: t1
      text: { en: "Inventory: every read in every region returns the most recent committed write", fr: "Stock : chaque lecture dans chaque région renvoie la dernière écriture validée" }
    - id: t2
      text: { en: "Pricing: read regions may lag, but by no more than 100,000 writes or 5 minutes", fr: "Tarifs : les régions de lecture peuvent être en retard, mais de 100 000 écritures ou 5 minutes au plus" }
    - id: t3
      text: { en: "User profiles: a user always sees their own edits; other users can see them later", fr: "Profils : un utilisateur voit toujours ses propres modifications ; les autres utilisateurs peuvent les voir plus tard" }
    - id: t4
      text: { en: "Product page view counter: stale or out-of-order values are acceptable", fr: "Compteur de vues des pages produit : des valeurs obsolètes ou dans le désordre sont acceptables" }
answer:
  mapping: { t1: strong, t2: bounded, t3: session, t4: eventual }
explanation:
  correct:
    en: Only Strong guarantees that reads return the latest committed write everywhere. Bounded staleness bounds the lag by K versions or T time (100,000 writes and 300 seconds are the multi-region minimums). Session provides read-your-writes within a session. When neither freshness nor order matters, Eventual is the weakest level.
    fr: Seul Strong garantit que les lectures renvoient partout la dernière écriture validée. Bounded staleness limite le retard à K versions ou à une durée T (100 000 écritures et 300 secondes sont les minimums multirégions). Session fournit la lecture de ses propres écritures dans une session. Lorsque ni la fraîcheur ni l'ordre n'importent, Eventual est le niveau le plus faible.
  options:
    prefix: { en: "Consistent prefix adds an ordering guarantee that the view counter doesn't need, and it doesn't give read-your-writes.", fr: "Consistent prefix ajoute une garantie d'ordre dont le compteur n'a pas besoin, et il ne fournit pas la lecture de ses propres écritures." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
