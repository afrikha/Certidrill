id: dp420-1c-pk-iot-containers
objective: "1.3.2"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Litware collects IoT data in Azure Cosmos DB for NoSQL by using two containers:

    - **readings**: 50,000 devices each write a 1 KB reading every 10 seconds. Items expire after 30 days (TTL). Dashboards run `SELECT * FROM c WHERE c.deviceId = @device AND c.ts > @since` to show one device's last 24 hours. Each item has `id`, `deviceId`, `deviceModel` (12 values) and `readingDate`.
    - **audit**: 30,000 audit records are written per second. A record is read only by its `id`, from a link in a notification. Each item has `id`, `userId`, `eventDate` and `eventType` (8 values). Two service accounts generate 40 percent of the records.

    You need to select a partition key for each container. Writes must be evenly distributed, and the access pattern of each container must have the lowest possible RU cost.

    Which partition key should you select for each container? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Litware collecte des données IoT dans Azure Cosmos DB for NoSQL avec deux conteneurs :

    - **readings** : 50 000 appareils écrivent chacun une mesure de 1 Ko toutes les 10 secondes. Les éléments expirent au bout de 30 jours (TTL). Les tableaux de bord exécutent `SELECT * FROM c WHERE c.deviceId = @device AND c.ts > @since` pour afficher les dernières 24 heures d'un appareil. Chaque élément a `id`, `deviceId`, `deviceModel` (12 valeurs) et `readingDate`.
    - **audit** : 30 000 enregistrements d'audit sont écrits par seconde. Un enregistrement n'est lu que par son `id`, à partir d'un lien dans une notification. Chaque élément a `id`, `userId`, `eventDate` et `eventType` (8 valeurs). Deux comptes de service génèrent 40 % des enregistrements.

    Vous devez sélectionner une clé de partition pour chaque conteneur. Les écritures doivent être réparties uniformément, et le modèle d'accès de chaque conteneur doit avoir le coût en RU le plus faible possible.

    Quelle clé de partition devez-vous sélectionner pour chaque conteneur ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      readings: [[readings]]

      audit: [[audit]]
    fr: |
      readings : [[readings]]

      audit : [[audit]]
  slots:
    - id: readings
      options:
        - { id: rdate, text: /readingDate }
        - { id: rid, text: /id }
        - { id: rdevice, text: /deviceId }
        - { id: rmodel, text: /deviceModel }
    - id: audit
      options:
        - { id: auser, text: /userId }
        - { id: aid, text: /id }
        - { id: adate, text: /eventDate }
        - { id: atype, text: /eventType }
answer:
  values: { readings: rdevice, audit: aid }
explanation:
  correct:
    en: "/deviceId has 50,000 values that each receive the same write rate, and the dashboard query filters on it, so it is routed to one partition. With 30 days of retention, a device stores about 260 MB (8,640 readings a day), far below 20 GB. The audit records are only read by id, so /id spreads the writes perfectly and makes every read a point read."
    fr: "/deviceId a 50 000 valeurs qui reçoivent chacune le même débit d'écriture, et la requête du tableau de bord filtre dessus : elle est routée vers une seule partition. Avec 30 jours de rétention, un appareil stocke environ 260 Mo (8 640 mesures par jour), bien en dessous de 20 Go. Les enregistrements d'audit ne sont lus que par id : /id répartit parfaitement les écritures et fait de chaque lecture une lecture ponctuelle."
  options:
    rdate: { en: "All the day's readings share one value, which creates a hot partition.", fr: "Toutes les mesures du jour partagent une valeur, ce qui crée une partition chaude." }
    rid: { en: "Writes are spread, but each dashboard query fans out to every physical partition.", fr: "Les écritures sont réparties, mais chaque requête du tableau de bord est diffusée vers toutes les partitions physiques." }
    rmodel: { en: "Twelve values are too few, and a popular model would exceed 20 GB.", fr: "Douze valeurs sont trop peu nombreuses, et un modèle répandu dépasserait 20 Go." }
    auser: { en: "The two service accounts would concentrate 40 percent of the writes on two logical partitions.", fr: "Les deux comptes de service concentreraient 40 % des écritures sur deux partitions logiques." }
    adate: { en: "All the writes of the day go to the same logical partition.", fr: "Toutes les écritures de la journée vont vers la même partition logique." }
    atype: { en: "Eight values cannot distribute 30,000 writes per second.", fr: "Huit valeurs ne peuvent pas répartir 30 000 écritures par seconde." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
