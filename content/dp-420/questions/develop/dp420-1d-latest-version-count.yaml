id: dp420-1d-latest-version-count
objective: "1.4.4"
type: single
difficulty: 1
status: draft
shuffle: false
stem:
  en: |
    A consumer reads the change feed of an Azure Cosmos DB for NoSQL container in latest version mode every 10 minutes.

    Between two reads, an application creates an item named **order-42**, then updates it twice.

    How many changes for order-42 does the consumer receive at its next read?
  fr: |
    Un consommateur lit le flux de modification d'un conteneur Azure Cosmos DB for NoSQL en mode dernière version toutes les 10 minutes.

    Entre deux lectures, une application crée un élément nommé **order-42**, puis le met à jour deux fois.

    Combien de modifications concernant order-42 le consommateur reçoit-il lors de sa lecture suivante ?
body:
  options:
    - { id: a, text: "0" }
    - { id: b, text: "1" }
    - { id: c, text: "2" }
    - { id: d, text: "3" }
answer: { optionId: b }
explanation:
  correct:
    en: |
      Latest version mode includes only the most recent change of each item, so the consumer receives the item once, in its latest version, with no indication of whether it was created or updated. All versions and deletes mode would return the create and both updates.
    fr: |
      Le mode dernière version n'inclut que la modification la plus récente de chaque élément : le consommateur reçoit l'élément une seule fois, dans sa dernière version, sans indication sur le fait qu'il a été créé ou mis à jour. Le mode toutes les versions et suppressions renverrait la création et les deux mises à jour.
  options:
    a: { en: "Creates and updates are recorded; the item appears in the feed.", fr: "Les créations et mises à jour sont enregistrées ; l'élément apparaît dans le flux." }
    c: { en: "Intermediate updates are not kept in latest version mode.", fr: "Les mises à jour intermédiaires ne sont pas conservées en mode dernière version." }
    d: { en: "Receiving the create and both updates requires all versions and deletes mode.", fr: "Recevoir la création et les deux mises à jour nécessite le mode toutes les versions et suppressions." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
