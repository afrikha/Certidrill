id: dp420-1a-thr-shared-26th
objective: "1.1.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL database named **saas** with 4,000 RU/s of manual shared throughput. The database already contains 25 containers that share this throughput. The account was created this year in a new subscription.

    You need to add a 26th container named **audit** to the **saas** database.

    What should you do?
  fr: |
    Contoso dispose d'une base de données Azure Cosmos DB for NoSQL nommée **saas** avec un débit partagé manuel de 4 000 RU/s. La base de données contient déjà 25 conteneurs qui partagent ce débit. Le compte a été créé cette année dans un nouvel abonnement.

    Vous devez ajouter un 26e conteneur nommé **audit** à la base de données **saas**.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Increase the shared throughput of the database to 5,000 RU/s first.", fr: "Augmenter d'abord le débit partagé de la base de données à 5 000 RU/s." } }
    - { id: b, text: { en: "Migrate the shared throughput of the database to autoscale first.", fr: "Faire d'abord passer le débit partagé de la base de données en mise à l'échelle automatique." } }
    - { id: c, text: { en: "Convert one of the existing containers to dedicated throughput first.", fr: "Convertir d'abord l'un des conteneurs existants en débit dédié." } }
    - { id: d, text: { en: "Create the audit container with its own dedicated throughput.", fr: "Créer le conteneur audit avec son propre débit dédié." } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Up to 25 containers can share the throughput of a database. After the first 25, a new container can be added to the database only if it has dedicated throughput. Accounts that already had a shared database with 25 or more containers are exempt, which isn't the case here.
    fr: |
      Jusqu'à 25 conteneurs peuvent partager le débit d'une base de données. Au-delà des 25 premiers, un nouveau conteneur ne peut être ajouté à la base de données que s'il dispose d'un débit dédié. Les comptes qui avaient déjà une base partagée avec 25 conteneurs ou plus sont exemptés, ce qui n'est pas le cas ici.
  options:
    a: { en: "The limit is on the number of containers that share throughput, not on the amount of RU/s.", fr: "La limite porte sur le nombre de conteneurs qui partagent le débit, pas sur le nombre de RU/s." }
    b: { en: "Autoscale shared databases have the same 25-container sharing limit.", fr: "Les bases partagées à mise à l'échelle automatique ont la même limite de 25 conteneurs." }
    c: { en: "A shared database container can't be converted to dedicated throughput; the data would have to be moved to a new container.", fr: "Un conteneur de base partagée ne peut pas être converti en débit dédié ; il faudrait déplacer les données vers un nouveau conteneur." }
references:
  - title: Introduction to provisioned throughput in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/set-throughput
