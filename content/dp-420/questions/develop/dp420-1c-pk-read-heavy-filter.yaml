id: dp420-1c-pk-read-heavy-filter
objective: "1.3.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Contoso has a product catalog in an Azure Cosmos DB for NoSQL container that stores 300 GB of data and is provisioned with 80,000 RU/s. The `id` of each item is a SKU.

    95 percent of the requests run the following query:

    `SELECT * FROM c WHERE c.storeId = @store AND c.category = @category`

    There are 6,000 stores, each with less than 5 GB of data, and 40 categories. Writes are infrequent.

    You need to choose the partition key that minimizes the RU cost of the queries.

    Which partition key should you use?
  fr: |
    Contoso dispose d'un catalogue de produits dans un conteneur Azure Cosmos DB for NoSQL qui stocke 300 Go de données et dispose de 80 000 RU/s approvisionnées. L'`id` de chaque élément est une référence SKU.

    95 % des requêtes exécutent la requête suivante :

    `SELECT * FROM c WHERE c.storeId = @store AND c.category = @category`

    Il existe 6 000 magasins, chacun avec moins de 5 Go de données, et 40 catégories. Les écritures sont peu fréquentes.

    Vous devez choisir la clé de partition qui réduit au minimum le coût en RU des requêtes.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - { id: a, text: /id }
    - { id: b, text: /category }
    - { id: c, text: /region }
    - { id: d, text: /storeId }
answer: { optionId: d }
explanation:
  correct:
    en: |-
      For a large read-heavy container, choose a high-cardinality property that appears as an equality filter in the frequent queries. With /storeId, each query is routed to the single physical partition that holds the store, and no store approaches the 20 GB logical partition limit.
    fr: |-
      Pour un conteneur volumineux à dominante lecture, choisissez une propriété à cardinalité élevée qui figure comme filtre d'égalité dans les requêtes fréquentes. Avec /storeId, chaque requête est routée vers la seule partition physique qui contient le magasin, et aucun magasin n'approche la limite de 20 Go par partition logique.
  options:
    a:
      en: |-
        The id is not in the query filter, so every query would fan out to all physical partitions, adding a few RUs per partition.
      fr: |-
        L'id ne figure pas dans le filtre de la requête : chaque requête serait diffusée vers toutes les partitions physiques, avec quelques RU de plus par partition.
    b:
      en: |-
        Forty values give low cardinality; large categories can exceed 20 GB and become hot partitions.
      fr: |-
        Quarante valeurs donnent une cardinalité faible ; les grandes catégories peuvent dépasser 20 Go et devenir des partitions chaudes.
    c:
      en: |-
        The region is not in the query filter and has too few values to spread 300 GB.
      fr: |-
        La région ne figure pas dans le filtre de la requête et a trop peu de valeurs pour répartir 300 Go.
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
