id: dp420-1a-thr-autoscale-billing
objective: "1.1.3"
type: single
difficulty: 2
status: draft
shuffle: false
stem:
  en: |
    Wingtip Toys has an Azure Cosmos DB for NoSQL container in a single-region account. The container uses autoscale throughput with a maximum of 20,000 RU/s.

    During one hour, the workload consumes 3,000 RU/s for 50 minutes and 15,000 RU/s for 10 minutes. You need to determine the throughput that is billed for that hour.

    What is the billed throughput?
  fr: |
    Wingtip Toys dispose d'un conteneur Azure Cosmos DB for NoSQL dans un compte à une seule région. Le conteneur utilise un débit à mise à l'échelle automatique avec un maximum de 20 000 RU/s.

    Pendant une heure, la charge de travail consomme 3 000 RU/s pendant 50 minutes et 15 000 RU/s pendant 10 minutes. Vous devez déterminer le débit facturé pour cette heure.

    Quel est le débit facturé ?
body:
  options:
    - { id: a, text: "2,000 RU/s" }
    - { id: b, text: "3,000 RU/s" }
    - { id: c, text: "5,000 RU/s" }
    - { id: d, text: "15,000 RU/s" }
    - { id: e, text: "20,000 RU/s" }
answer: { optionId: d }
explanation:
  correct:
    en: |
      Autoscale bills each hour for the highest throughput the system scaled to during that hour, at the autoscale rate. The peak of the hour is 15,000 RU/s, so that is the billed amount, even though the peak lasted only 10 minutes.
    fr: |
      La mise à l'échelle automatique facture chaque heure le débit le plus élevé atteint pendant cette heure, au tarif de la mise à l'échelle automatique. Le pic de l'heure est de 15 000 RU/s : c'est le montant facturé, même si le pic n'a duré que 10 minutes.
  options:
    a: { en: "2,000 RU/s is the minimum (10 percent of the maximum) that the container scales down to, not the billed amount for this hour.", fr: "2 000 RU/s est le minimum (10 % du maximum) jusqu'auquel le conteneur redescend, pas le montant facturé pour cette heure." }
    b: { en: "Billing doesn't use the throughput of most of the hour; it uses the highest throughput reached.", fr: "La facturation n'utilise pas le débit de la majeure partie de l'heure ; elle utilise le débit le plus élevé atteint." }
    c: { en: "Autoscale isn't billed on a time-weighted average of the throughput.", fr: "La mise à l'échelle automatique n'est pas facturée sur une moyenne pondérée par le temps." }
    e: { en: "You pay for the maximum only during hours in which the container scales up to it.", fr: "Vous ne payez le maximum que pendant les heures où le conteneur l'atteint." }
references:
  - title: Create Azure Cosmos DB containers and databases with autoscale throughput
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
