id: dp420-1d-cost-estimator-tool
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is designing a new application that will use Azure Cosmos DB for NoSQL. No Azure Cosmos DB resources exist yet.

    You know the expected document sizes, the number of reads, writes and queries per second, the number of regions and the vector search requirements. You need to estimate the required RU/s and the projected monthly cost, and compare serverless with provisioned throughput.

    What should you use?
  fr: |
    Wingtip conçoit une nouvelle application qui utilisera Azure Cosmos DB for NoSQL. Aucune ressource Azure Cosmos DB n'existe encore.

    Vous connaissez la taille attendue des documents, le nombre de lectures, d'écritures et de requêtes par seconde, le nombre de régions et les besoins de recherche vectorielle. Vous devez estimer les RU/s nécessaires et le coût mensuel prévu, et comparer le mode serverless au débit approvisionné.

    Que devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "The Azure Cosmos DB Cost Estimator", fr: "L'Azure Cosmos DB Cost Estimator" } }
    - { id: b, text: { en: "Cost analysis in Microsoft Cost Management", fr: "L'analyse des coûts dans Microsoft Cost Management" } }
    - { id: c, text: { en: "The cost recommendations of Azure Advisor", fr: "Les recommandations de coût d'Azure Advisor" } }
    - { id: d, text: { en: "The Normalized RU Consumption metric in Azure Monitor", fr: "La métrique Normalized RU Consumption dans Azure Monitor" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      The Azure Cosmos DB Cost Estimator takes the capacity mode, data size, document types, operation rates, regions and advanced options such as vector operations, and projects the RU/s and monthly cost before any resource exists. Its Compare view shows serverless and provisioned throughput side by side.
    fr: |
      L'Azure Cosmos DB Cost Estimator prend en compte le mode de capacité, le volume de données, les types de documents, les débits d'opérations, les régions et des options avancées comme les opérations vectorielles, et projette les RU/s et le coût mensuel avant la création de toute ressource. Sa vue Compare présente côte à côte le mode serverless et le débit approvisionné.
  options:
    b: { en: "Cost analysis reports the costs of resources that are already deployed and used.", fr: "L'analyse des coûts présente les coûts des ressources déjà déployées et utilisées." }
    c: { en: "Advisor recommendations are based on the usage of existing resources.", fr: "Les recommandations d'Advisor reposent sur l'utilisation des ressources existantes." }
    d: { en: "This metric measures the utilization of an existing database or container.", fr: "Cette métrique mesure l'utilisation d'une base de données ou d'un conteneur existant." }
references:
  - title: Estimate Costs using the Cost Estimator - API for NoSQL - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/estimate-ru-with-capacity-planner
