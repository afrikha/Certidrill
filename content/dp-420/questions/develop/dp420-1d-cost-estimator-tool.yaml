id: dp420-1d-cost-estimator-tool
objective: "1.3.8"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Wingtip is estimating the cost of a new application that will use Azure Cosmos DB for NoSQL in a single Azure region. No Azure Cosmos DB resources exist yet.

    The estimate shows a steady load of 40,000 RU/s, 24 hours a day, with almost no variation. The application will run unchanged for at least three years.

    You need to include in the estimate the pricing option that gives the lowest monthly cost for this throughput.

    What should you include?
  fr: |
    Wingtip estime le coût d'une nouvelle application qui utilisera Azure Cosmos DB for NoSQL dans une seule région Azure. Aucune ressource Azure Cosmos DB n'existe encore.

    L'estimation montre une charge constante de 40 000 RU/s, 24 heures sur 24, presque sans variation. L'application fonctionnera sans changement pendant au moins trois ans.

    Vous devez inclure dans l'estimation l'option de tarification qui donne le coût mensuel le plus bas pour ce débit.

    Que devez-vous inclure ?
body:
  options:
    - { id: a, text: { en: "Standard (manual) throughput covered by a three-year reserved capacity purchase", fr: "Un débit standard (manuel) couvert par un achat de capacité réservée sur trois ans" } }
    - { id: b, text: { en: "Autoscale throughput with a maximum of 40,000 RU/s on the container", fr: "Un débit autoscale avec un maximum de 40 000 RU/s sur le conteneur" } }
    - { id: c, text: { en: "A serverless account billed for the RUs that the workload consumes", fr: "Un compte serverless facturé pour les RU consommées par la charge de travail" } }
    - { id: d, text: { en: "The free tier discount applied to the account at its creation", fr: "La remise du niveau gratuit appliquée au compte lors de sa création" } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Reserved capacity reserves provisioned throughput for one or three years and applies a discount to it every hour, and the three-year term gives the larger discount. A steady load that uses all its RU/s every hour gets nothing from autoscale, so standard throughput covered by a three-year reservation gives the lowest monthly cost.
    fr: |
      La capacité réservée réserve un débit approvisionné pour un ou trois ans et lui applique une remise chaque heure, et la durée de trois ans donne la remise la plus forte. Une charge constante qui utilise toutes ses RU/s à chaque heure ne gagne rien à l'autoscale : un débit standard couvert par une réservation sur trois ans donne le coût mensuel le plus bas.
  options:
    b: { en: "Autoscale bills the highest RU/s reached in each hour at 1.5 times the standard rate; a load that uses its full maximum every hour costs more than standard throughput.", fr: "L'autoscale facture les RU/s les plus élevées atteintes dans chaque heure à 1,5 fois le tarif standard ; une charge qui utilise tout son maximum à chaque heure coûte plus cher qu'un débit standard." }
    c: { en: "Serverless bills every RU consumed; at 40,000 RU/s around the clock it costs far more than provisioned throughput, and reservations don't apply to serverless accounts.", fr: "Le mode serverless facture chaque RU consommée ; à 40 000 RU/s jour et nuit, il coûte bien plus cher qu'un débit approvisionné, et les réservations ne s'appliquent pas aux comptes serverless." }
    d: { en: "The free tier only removes the first 1,000 RU/s and 25 GB of the account, which barely changes a 40,000 RU/s bill.", fr: "Le niveau gratuit ne retire que les 1 000 premières RU/s et les 25 premiers Go du compte, ce qui change à peine une facture de 40 000 RU/s." }
references:
  - title: Pricing & Discounts With Reserved Capacity - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/reserved-capacity
  - title: Plan and Manage Costs for Azure Cosmos DB - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/plan-manage-costs
