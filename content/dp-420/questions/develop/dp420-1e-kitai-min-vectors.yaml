id: dp420-1e-kitai-min-vectors
objective: "1.5.2"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Adatum prototypes an internal knowledge agent on Azure Cosmos DB for NoSQL. With the help of an AI coding assistant that has the Azure Cosmos DB Agent Kit installed, you create a container whose vector policy defines 1,536-dimension `float32` vectors on `/embedding`, with a `diskANN` vector index, and `/embedding/*` excluded from the regular index. You load 600 document chunks.

    Every query uses `TOP 5` and `ORDER BY VectorDistance(c.embedding, @q)`. The request unit (RU) charge per query is much higher than the assistant estimated for an indexed vector search.

    What is the most likely cause?
  fr: |
    Adatum prototype un agent de connaissances interne sur Azure Cosmos DB for NoSQL. Avec l'aide d'un assistant de codage IA sur lequel Azure Cosmos DB Agent Kit est installé, vous créez un conteneur dont la stratégie vectorielle définit des vecteurs `float32` de 1 536 dimensions sur `/embedding`, avec un index vectoriel `diskANN`, et `/embedding/*` exclu de l'index standard. Vous chargez 600 segments de documents.

    Chaque requête utilise `TOP 5` et `ORDER BY VectorDistance(c.embedding, @q)`. La charge en unités de requête (RU) par requête est bien plus élevée que l'estimation de l'assistant pour une recherche vectorielle indexée.

    Quelle est la cause la plus probable ?
body:
  options:
    - id: a
      text: { en: "The diskANN index supports at most 505 dimensions, so the vectors are not indexed.", fr: "L'index diskANN prend en charge au plus 505 dimensions : les vecteurs ne sont donc pas indexés." }
    - id: b
      text: { en: "Excluding /embedding/* from the regular index prevents queries from using the diskANN index.", fr: "Exclure /embedding/* de l'index standard empêche les requêtes d'utiliser l'index diskANN." }
    - id: c
      text: { en: "The cosine distance function always scans every vector, unlike the dotproduct function.", fr: "La fonction de distance cosine analyse toujours tous les vecteurs, contrairement à la fonction dotproduct." }
    - id: d
      text: { en: "Fewer than 1,000 vectors are indexed, so each search runs as a full scan.", fr: "Moins de 1 000 vecteurs sont indexés : chaque recherche s'exécute donc comme une analyse complète." }
answer: { optionId: d }
explanation:
  correct:
    en: |
      The quantizedFlat and diskANN index types need at least 1,000 indexed vectors to quantize the vectors accurately. With fewer vectors, a full scan is executed instead, and RU charges can be higher. The estimate becomes realistic only when the prototype holds a representative volume of embeddings.
    fr: |
      Les types d'index quantizedFlat et diskANN nécessitent au moins 1 000 vecteurs indexés pour quantifier les vecteurs avec précision. Avec moins de vecteurs, une analyse complète est exécutée à la place, et les charges en RU peuvent être plus élevées. L'estimation ne devient réaliste qu'avec un volume représentatif d'incorporations dans le prototype.
  options:
    a:
      en: |
        The 505-dimension limit applies to the flat index; diskANN supports up to 4,096 dimensions.
      fr: |
        La limite de 505 dimensions s'applique à l'index flat ; diskANN prend en charge jusqu'à 4 096 dimensions.
    b:
      en: |
        Excluding the vector path from the regular index is the recommended configuration; the vector index is defined separately in vectorIndexes.
      fr: |
        Exclure le chemin du vecteur de l'index standard est la configuration recommandée ; l'index vectoriel est défini séparément dans vectorIndexes.
    c:
      en: |
        The distance function only defines how similarity is computed; every supported function can use the vector index.
      fr: |
        La fonction de distance définit seulement la façon de calculer la similarité ; toutes les fonctions prises en charge peuvent utiliser l'index vectoriel.
references:
  - title: Integrated Vector Store - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/vector-search
