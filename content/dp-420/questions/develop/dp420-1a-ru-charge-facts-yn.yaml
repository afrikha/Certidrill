id: dp420-1a-ru-charge-facts-yn
objective: "1.1.2"
type: yesno_statements
difficulty: 1
status: draft
stem:
  en: |
    Tailspin Toys is estimating the RU consumption of a new Azure Cosmos DB for NoSQL workload before it chooses a throughput model. The team measures the RU charge of each operation in a test container.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys estime la consommation de RU d'une nouvelle charge de travail Azure Cosmos DB for NoSQL avant de choisir un modèle de débit. L'équipe mesure la charge en RU de chaque opération dans un conteneur de test.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Running the same query twice on the same data consumes the same number of RUs.
        fr: Exécuter deux fois la même requête sur les mêmes données consomme le même nombre de RU.
    - id: s2
      text:
        en: Replacing an item costs about the same number of RUs as inserting the same item.
        fr: Remplacer un élément coûte environ le même nombre de RU qu'insérer le même élément.
    - id: s3
      text:
        en: A query that filters on the id and the partition key value is billed as a point read.
        fr: Une requête qui filtre sur l'id et la valeur de clé de partition est facturée comme une lecture ponctuelle.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      The RU charge of an operation is deterministic: the same query on the same data always costs the same. Replacing an item costs about twice the charge of inserting it. A point read is only performed through the SDK or REST read operation; a query with a filter on id and partition key is still a query.
    fr: |
      La charge en RU d'une opération est déterministe : la même requête sur les mêmes données coûte toujours la même chose. Remplacer un élément coûte environ deux fois la charge de son insertion. Une lecture ponctuelle n'est effectuée que par l'opération de lecture du SDK ou de l'API REST ; une requête qui filtre sur l'id et la clé de partition reste une requête.
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
