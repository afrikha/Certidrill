id: dp420-1e-kit-context-loading
objective: "1.5.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Northwind's developers use an AI coding assistant whose host requires a compiled `AGENTS.md` file, so the complete Azure Cosmos DB Agent Kit rule collection is inserted into every prompt. When the developers paste a large data model and its query diagnostics, the answers ignore parts of the material they supplied.

    You need to keep the assistant's context focused on the current Azure Cosmos DB task.

    What should you do?
  fr: |
    Les développeurs de Northwind utilisent un assistant de codage IA dont l'hôte exige un fichier `AGENTS.md` compilé : l'ensemble complet des règles d'Azure Cosmos DB Agent Kit est donc inséré dans chaque invite. Quand les développeurs collent un modèle de données volumineux et ses diagnostics de requête, les réponses ignorent une partie des éléments fournis.

    Vous devez garder le contexte de l'assistant centré sur la tâche Azure Cosmos DB en cours.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Switch to a model that has a larger context window, and keep loading the full collection.", fr: "Passer à un modèle doté d'une fenêtre de contexte plus grande, et continuer de charger l'ensemble complet." }
    - id: b
      text: { en: "Load only the skill relevant to the task, through on-demand loading if the host supports it.", fr: "Charger uniquement la compétence utile à la tâche, par chargement à la demande si l'hôte le prend en charge." }
    - id: c
      text: { en: "Paste the content of AGENTS.md at the start of each prompt so that every rule is applied.", fr: "Coller le contenu d'AGENTS.md au début de chaque invite pour que chaque règle soit appliquée." }
    - id: d
      text: { en: "Connect the host to the Microsoft Learn MCP server instead of installing the Agent Kit.", fr: "Connecter l'hôte au serveur MCP Microsoft Learn au lieu d'installer Agent Kit." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The kit is designed for assistants that load the relevant skills on demand. When a host inserts the whole rule collection into every prompt, it consumes context needed for your code, data model or diagnostics; select only the skill for the current task, prefer progressive skill discovery, and check the context budget of a compiled AGENTS.md before loading the full collection.
    fr: |
      Le kit est conçu pour les assistants qui chargent à la demande les compétences pertinentes. Quand un hôte insère tout l'ensemble de règles dans chaque invite, il consomme le contexte nécessaire à votre code, à votre modèle de données ou à vos diagnostics ; sélectionnez uniquement la compétence de la tâche en cours, privilégiez la découverte progressive des compétences et vérifiez le budget de contexte d'un AGENTS.md compilé avant de charger l'ensemble complet.
  options:
    a:
      en: |
        A larger context window does not guarantee better recommendations, and the full collection still crowds out your material.
      fr: |
        Une fenêtre de contexte plus grande ne garantit pas de meilleures recommandations, et l'ensemble complet continue d'évincer vos éléments.
    c:
      en: |
        Pasting the compiled rules adds even more guidance to each prompt, which worsens the problem.
      fr: |
        Coller les règles compilées ajoute encore plus de recommandations à chaque invite, ce qui aggrave le problème.
    d:
      en: |
        The Microsoft Learn MCP server retrieves documentation; it does not replace the Agent Kit guidance for code reviews.
      fr: |
        Le serveur MCP Microsoft Learn récupère de la documentation ; il ne remplace pas les recommandations d'Agent Kit pour les révisions de code.
references:
  - title: Supported AI coding assistants for Azure Cosmos DB Agent Kit - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/compatibility
