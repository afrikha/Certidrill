id: dp420-1a-sdk-region-order
objective: "1.1.6"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank has an Azure Cosmos DB for NoSQL account replicated to West Europe, North Europe and East US. A .NET service hosted in West Europe must send its reads to West Europe first. If West Europe is unavailable, the reads must go to East US, and only then to North Europe, because of a data-processing agreement.

    You need to configure the `CosmosClientOptions` of the service.

    Which configuration should you use?
  fr: |
    Woodgrove Bank dispose d'un compte Azure Cosmos DB for NoSQL répliqué dans West Europe, North Europe et East US. Un service .NET hébergé dans West Europe doit envoyer ses lectures d'abord vers West Europe. Si West Europe n'est pas disponible, les lectures doivent aller vers East US, puis seulement ensuite vers North Europe, en raison d'un accord de traitement des données.

    Vous devez configurer les `CosmosClientOptions` du service.

    Quelle configuration devez-vous utiliser ?
body:
  options:
    - { id: a, text: { en: "Set ApplicationRegion to West Europe and LimitToEndpoint to true.", fr: "Définir ApplicationRegion sur West Europe et LimitToEndpoint sur true." } }
    - { id: b, text: { en: "Set ApplicationPreferredRegions to West Europe, East US, North Europe, in this order.", fr: "Définir ApplicationPreferredRegions sur West Europe, East US, North Europe, dans cet ordre." } }
    - { id: c, text: { en: "Set ApplicationRegion to West Europe.", fr: "Définir ApplicationRegion sur West Europe." } }
    - { id: d, text: { en: "Set ApplicationRegion to West Europe and ApplicationPreferredRegions to East US, North Europe.", fr: "Définir ApplicationRegion sur West Europe et ApplicationPreferredRegions sur East US, North Europe." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      `ApplicationPreferredRegions` gives full control of the order in which the SDK uses the account's regions, which is needed when the order follows a custom criterion. `ApplicationRegion` instead orders the regions by geographical proximity to the given region.
    fr: |
      `ApplicationPreferredRegions` permet de contrôler entièrement l'ordre dans lequel le SDK utilise les régions du compte, ce qui est nécessaire lorsque l'ordre suit un critère personnalisé. `ApplicationRegion` classe au contraire les régions selon leur proximité géographique avec la région indiquée.
  options:
    c: { en: "ApplicationRegion orders the other regions by proximity, so North Europe would come before East US.", fr: "ApplicationRegion classe les autres régions par proximité : North Europe passerait avant East US." }
    d: { en: "ApplicationRegion and ApplicationPreferredRegions are alternatives: you can set one or the other, not both.", fr: "ApplicationRegion et ApplicationPreferredRegions sont des alternatives : vous pouvez définir l'une ou l'autre, pas les deux." }
    a: { en: "LimitToEndpoint restricts operations to the endpoint provided, which removes the failover to other regions.", fr: "LimitToEndpoint limite les opérations au point de terminaison fourni, ce qui supprime le basculement vers les autres régions." }
references:
  - title: CosmosClientOptions.ApplicationRegion Property (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions.applicationregion
