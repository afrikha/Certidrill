id: dp420-1d-status-key-review
objective: "1.3.7"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    You review the design of an order-management application built on Azure Cosmos DB for NoSQL. The design uses a single container named **orders** with the following characteristics:

    - Partition key: `/status`, with the values `pending`, `paid`, `shipped`, `delivered` and `cancelled`.
    - Expected volume: 400 GB after one year.
    - The application updates the `status` property of each order several times during its life cycle.

    Which two issues does this design have?

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous examinez la conception d'une application de gestion des commandes reposant sur Azure Cosmos DB for NoSQL. La conception utilise un seul conteneur nommé **orders** avec les caractéristiques suivantes :

    - Clé de partition : `/status`, avec les valeurs `pending`, `paid`, `shipped`, `delivered` et `cancelled`.
    - Volume attendu : 400 Go au bout d'un an.
    - L'application met à jour la propriété `status` de chaque commande plusieurs fois au cours de son cycle de vie.

    Quels sont les deux problèmes de cette conception ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The data cannot fit: each status value is one logical partition, which can store up to 20 GB.", fr: "Les données ne peuvent pas tenir : chaque valeur de statut est une partition logique, qui peut stocker au plus 20 Go." } }
    - { id: b, text: { en: "Point reads of an order are impossible because the partition key value changes over time.", fr: "Les lectures ponctuelles d'une commande sont impossibles, car la valeur de la clé de partition change au fil du temps." } }
    - { id: c, text: { en: "Changing an order's status requires creating a new item and deleting the original, and the two operations cannot be atomic.", fr: "Changer le statut d'une commande impose de créer un nouvel élément et de supprimer l'original, et les deux opérations ne peuvent pas être atomiques." } }
    - { id: d, text: { en: "The change feed does not report updates made to the partition key property.", fr: "Le flux de modification ne signale pas les mises à jour de la propriété de clé de partition." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |
      A low-cardinality key such as a status creates only five logical partitions, each limited to 20 GB and 10,000 RU/s, so 400 GB cannot be stored and traffic concentrates on hot partitions. Partition key values are immutable, so a status change becomes a create in the new logical partition plus a delete in the old one, which cannot run in a single transaction across logical partitions.
    fr: |
      Une clé à faible cardinalité comme un statut ne crée que cinq partitions logiques, chacune limitée à 20 Go et 10 000 RU/s : 400 Go ne peuvent pas être stockés et le trafic se concentre sur des partitions chaudes. Les valeurs de clé de partition sont immuables : un changement de statut devient une création dans la nouvelle partition logique et une suppression dans l'ancienne, ce qui ne peut pas s'exécuter dans une seule transaction entre partitions logiques.
  options:
    b: { en: "A point read only needs the id and the current partition key value of the item; it remains possible.", fr: "Une lecture ponctuelle n'a besoin que de l'id et de la valeur actuelle de la clé de partition de l'élément ; elle reste possible." }
    d: { en: "Creates and updates appear in the change feed regardless of which properties changed.", fr: "Les créations et mises à jour apparaissent dans le flux de modification quelles que soient les propriétés modifiées." }
references:
  - title: Partitioning and horizontal scaling - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning
