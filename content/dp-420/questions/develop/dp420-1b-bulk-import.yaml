id: dp420-1b-bulk-import
objective: "1.2.4"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam must load 3 million historical shipments into a new Azure Cosmos DB for NoSQL container provisioned with 50,000 RU/s. The shipments are spread across thousands of partition key values. Each shipment is independent, so no atomicity across items is required.

    The .NET import tool must use as much of the provisioned throughput as possible.

    What should you do?
  fr: |
    Fabrikam doit charger 3 millions d'expéditions historiques dans un nouveau conteneur Azure Cosmos DB for NoSQL approvisionné avec 50 000 RU/s. Les expéditions sont réparties sur des milliers de valeurs de clé de partition. Chaque expédition est indépendante : aucune atomicité entre éléments n'est exigée.

    L'outil d'import .NET doit utiliser autant que possible le débit approvisionné.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Group the shipments 100 at a time in TransactionalBatch objects created for the partition key of the first shipment.", fr: "Regrouper les expéditions par 100 dans des objets TransactionalBatch créés pour la clé de partition de la première expédition." } }
    - { id: b, text: { en: "Call CreateItemAsync in a foreach loop and await each call before sending the next shipment.", fr: "Appeler CreateItemAsync dans une boucle foreach et attendre chaque appel avant d'envoyer l'expédition suivante." } }
    - { id: c, text: { en: "Set ConsistencyLevel to Eventual in CosmosClientOptions and call UpsertItemAsync for each shipment.", fr: "Définir ConsistencyLevel sur Eventual dans CosmosClientOptions et appeler UpsertItemAsync pour chaque expédition." } }
    - { id: d, text: { en: "Set AllowBulkExecution to true in CosmosClientOptions and run the CreateItemAsync calls as concurrent tasks.", fr: "Définir AllowBulkExecution sur true dans CosmosClientOptions et exécuter les appels CreateItemAsync sous forme de tâches simultanées." } }
answer: { optionId: d }
explanation:
  correct:
    en: "With AllowBulkExecution enabled, the CosmosClient groups concurrent point operations into fewer service calls and distributes them across partitions, which optimizes throughput utilization. You create one task per operation and wait for them with Task.WhenAll."
    fr: "Avec AllowBulkExecution activé, le CosmosClient regroupe les opérations ponctuelles simultanées en un nombre réduit d'appels au service et les répartit entre les partitions, ce qui optimise l'utilisation du débit. Vous créez une tâche par opération et les attendez avec Task.WhenAll."
  options:
    a: { en: "A transactional batch only accepts operations that share one partition key, so batches of mixed shipments fail.", fr: "Un lot transactionnel n'accepte que des opérations qui partagent une clé de partition : des lots d'expéditions mélangées échouent." }
    b: { en: "Sequential awaits send one request at a time and leave most of the provisioned throughput unused.", fr: "Des attentes séquentielles envoient une requête à la fois et laissent inutilisée la plus grande partie du débit approvisionné." }
    c: { en: "Consistency affects reads; it does not parallelize writes.", fr: "La cohérence concerne les lectures ; elle ne parallélise pas les écritures." }
references:
  - title: Bulk Import Data for NoSQL Account by Using the .NET SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/tutorial-dotnet-bulk-import
