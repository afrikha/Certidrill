id: dp420-1c-hpk-id-last-level
objective: "1.3.5"
type: yesno_statements
difficulty: 3
status: draft
stem:
  en: |
    Northwind creates an Azure Cosmos DB for NoSQL container with a hierarchical partition key made of `/tenantId`, `/userId` and `/id`, in that order.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind crée un conteneur Azure Cosmos DB for NoSQL avec une clé de partition hiérarchique composée de `/tenantId`, `/userId` et `/id`, dans cet ordre.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: |-
          You can use a transactional batch to update several items that have the same tenantId and userId values.
        fr: |-
          Vous pouvez utiliser un lot transactionnel pour mettre à jour plusieurs éléments qui ont les mêmes valeurs de tenantId et de userId.
    - id: s2
      text:
        en: |-
          A query that filters on tenantId only is routed to the physical partitions that hold that tenant's data.
        fr: |-
          Une requête qui filtre uniquement sur tenantId est routée vers les partitions physiques qui contiennent les données de ce locataire.
    - id: s3
      text:
        en: |-
          The items that share one tenantId and userId pair can together store more than 20 GB.
        fr: |-
          Les éléments qui partagent une paire tenantId et userId peuvent stocker ensemble plus de 20 Go.
answer:
  values: { s1: false, s2: true, s3: true }
explanation:
  correct:
    en: |-
      With a unique last level such as /id, every logical partition holds a single item. A transactional batch requires all its operations to share one complete partition key value, so it cannot span several items here. Queries on the leading level tenantId are still targeted, and the tenantId and userId prefixes can grow beyond 20 GB because the 20 GB limit applies to each full key value.
    fr: |-
      Avec un dernier niveau unique comme /id, chaque partition logique contient un seul élément. Un lot transactionnel exige que toutes ses opérations partagent une valeur de clé de partition complète : il ne peut donc pas porter sur plusieurs éléments ici. Les requêtes sur le premier niveau tenantId restent ciblées, et les préfixes tenantId et userId peuvent dépasser 20 Go, car la limite de 20 Go s'applique à chaque valeur de clé complète.
references:
  - title: Unlimited logical partition storage with hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys-unlimited-scale
