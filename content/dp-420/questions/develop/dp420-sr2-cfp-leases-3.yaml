id: dp420-sr2-cfp-leases-3
objective: "1.4.3"
type: series_yesno
series: dp420-sr2-cfp-leases
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You give SearchIndexer its own lease container and keep one processor name.
  fr: |
    Vous attribuez à SearchIndexer son propre conteneur de bail et conservez un seul nom de processeur.
body:
  solution:
    en: |
      You create a container named `leases-search` in the `sales` database. InvoiceWorker uses the `leases` container and SearchIndexer uses `leases-search`. Both services use the processor name `"ordersProcessor"`, and each of the six instances sets a unique instance name.
    fr: |
      Vous créez un conteneur nommé `leases-search` dans la base de données `sales`. InvoiceWorker utilise le conteneur `leases` et SearchIndexer utilise `leases-search`. Les deux services utilisent le nom de processeur `"ordersProcessor"`, et chacune des six instances définit un nom d'instance unique.
answer: { value: true }
explanation:
  correct:
    en: |
      A deployment unit is defined by the same processor name and the same lease container configuration. Because the two services use different lease containers, they are two independent deployment units that each track their own progress, so both receive every change even though the processor name is identical. Within each service, the three instances share the lease configuration and have distinct instance names, so the leases are distributed across them.
    fr: |
      Une unité de déploiement est définie par le même nom de processeur et la même configuration de conteneur de bail. Les deux services utilisant des conteneurs de bail différents, ils forment deux unités de déploiement indépendantes qui suivent chacune leur propre progression : les deux reçoivent toutes les modifications, même si le nom de processeur est identique. Au sein de chaque service, les trois instances partagent la configuration de bail et ont des noms d'instance distincts : les baux sont répartis entre elles.
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
