id: dp420-cs1c-api-client
objective: "1.1.6"
type: dropdown
caseStudy: dp420-cs1c-trey-research
difficulty: 1
status: draft
stem:
  en: |
    You need to create the Azure Cosmos DB client of the LabMind API to meet the requirements.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous devez créer le client Azure Cosmos DB de l'API LabMind pour satisfaire les exigences.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    import os
    from azure.cosmos import CosmosClient
    from azure.identity import DefaultAzureCredential

    client = CosmosClient(
        url=os.environ["COSMOS_ENDPOINT"],
        credential=[[credential]],
        [[regions]]=[os.environ["LOCAL_REGION"], os.environ["REMOTE_REGION"]],
    )
  slots:
    - id: credential
      options:
        - { id: key, text: "os.environ[\"COSMOS_KEY\"]" }
        - { id: dac, text: DefaultAzureCredential() }
        - { id: connstr, text: "os.environ[\"COSMOS_CONNECTION_STRING\"]" }
    - id: regions
      options:
        - { id: excluded, text: excluded_locations }
        - { id: discovery, text: enable_endpoint_discovery }
        - { id: preferred, text: preferred_locations }
answer:
  values: { credential: dac, regions: preferred }
explanation:
  correct:
    en: "Key-based authentication is disabled on cosmos-trey-labmind, so the client must use a Microsoft Entra token credential; `DefaultAzureCredential` picks up the workload identity of the AKS pod. `preferred_locations` lists the regions in order of preference for a geo-replicated account, so each instance reads from its own region first and uses the other region when its own region is unavailable."
    fr: "L'authentification par clé est désactivée sur cosmos-trey-labmind : le client doit donc utiliser des informations d'identification de jeton Microsoft Entra ; `DefaultAzureCredential` récupère l'identité de charge de travail du pod AKS. `preferred_locations` liste les régions par ordre de préférence pour un compte géorépliqué : chaque instance lit d'abord depuis sa propre région et utilise l'autre région quand la sienne n'est pas disponible."
  options:
    key: { en: "An account key cannot be used when disableLocalAuth is true.", fr: "Une clé de compte ne peut pas être utilisée quand disableLocalAuth est true." }
    connstr: { en: "A connection string contains the account key, which is rejected when key-based authentication is disabled.", fr: "Une chaîne de connexion contient la clé du compte, qui est refusée quand l'authentification par clé est désactivée." }
    excluded: { en: "excluded_locations lists the regions that the client must skip; passing both regions would exclude them.", fr: "excluded_locations liste les régions que le client doit ignorer ; transmettre les deux régions les exclurait." }
    discovery: { en: "enable_endpoint_discovery is a Boolean that is already true by default; it does not take an ordered list of regions.", fr: "enable_endpoint_discovery est un booléen déjà défini sur true par défaut ; il n'accepte pas de liste ordonnée de régions." }
references:
  - title: CosmosClient Class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.cosmosclient
  - title: Connect to Azure Cosmos DB for NoSQL using role-based access control and Microsoft Entra ID
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
