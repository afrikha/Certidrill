id: dp420-1a-sdk-managed-identity
objective: "1.1.6"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Tailspin Toys deploys a .NET web app to Azure App Service. The app has a system-assigned managed identity. Key-based authentication is disabled on the Azure Cosmos DB for NoSQL account, and the app must read and write items in the **orders** container.

    You need to connect the app to the account.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Tailspin Toys déploie une application web .NET sur Azure App Service. L'application possède une identité managée affectée par le système. L'authentification par clé est désactivée sur le compte Azure Cosmos DB for NoSQL, et l'application doit lire et écrire des éléments dans le conteneur **orders**.

    Vous devez connecter l'application au compte.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Create the client with new CosmosClient(endpoint, new AzureKeyCredential(key)).", fr: "Créer le client avec new CosmosClient(endpoint, new AzureKeyCredential(key))." } }
    - { id: b, text: { en: "Create the client with new CosmosClient(endpoint, new DefaultAzureCredential()).", fr: "Créer le client avec new CosmosClient(endpoint, new DefaultAzureCredential())." } }
    - { id: c, text: { en: "Assign the Cosmos DB Built-in Data Contributor role to the managed identity on the account.", fr: "Attribuer le rôle Cosmos DB Built-in Data Contributor à l'identité managée sur le compte." } }
    - { id: d, text: { en: "Store the primary connection string in Azure Key Vault and pass it to the client.", fr: "Stocker la chaîne de connexion primaire dans Azure Key Vault et la transmettre au client." } }
    - { id: e, text: { en: "Assign the DocumentDB Account Contributor role to the managed identity on the account.", fr: "Attribuer le rôle DocumentDB Account Contributor à l'identité managée sur le compte." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: |
      With key-based authorization disabled, the client must authenticate with Microsoft Entra ID: the `TokenCredential` overload with `DefaultAzureCredential` uses the managed identity on App Service. The identity also needs a data-plane role such as Cosmos DB Built-in Data Contributor, which allows reading and writing items.
    fr: |
      Lorsque l'autorisation par clé est désactivée, le client doit s'authentifier avec Microsoft Entra ID : la surcharge `TokenCredential` avec `DefaultAzureCredential` utilise l'identité managée sur App Service. L'identité a aussi besoin d'un rôle du plan de données comme Cosmos DB Built-in Data Contributor, qui permet de lire et d'écrire des éléments.
  options:
    d: { en: "A connection string contains an account key, which the account no longer accepts.", fr: "Une chaîne de connexion contient une clé de compte, que le compte n'accepte plus." }
    e: { en: "DocumentDB Account Contributor is a control-plane role for managing the account; it doesn't grant access to items.", fr: "DocumentDB Account Contributor est un rôle du plan de contrôle qui sert à gérer le compte ; il ne donne pas accès aux éléments." }
    a: { en: "AzureKeyCredential still authenticates with an account key.", fr: "AzureKeyCredential s'authentifie toujours avec une clé de compte." }
references:
  - title: Connect using role-based access control and Microsoft Entra ID - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-connect-role-based-access-control
  - title: Get started with Azure Cosmos DB for NoSQL using .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-get-started
