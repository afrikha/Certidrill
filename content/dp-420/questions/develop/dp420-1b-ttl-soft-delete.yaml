id: dp420-1b-ttl-soft-delete
objective: "1.2.5"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Adatum's search indexer consumes the change feed of a product container in Azure Cosmos DB for NoSQL in latest version mode. The account uses periodic backup, and the backup mode must not change. The container's `DefaultTimeToLive` is -1.

    When a product is retired, the indexer must remove it from the search index, and the product must later disappear from the container without any cleanup job.

    Which two actions should the .NET product service perform when a product is retired? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    L'indexeur de recherche d'Adatum consomme le flux de modifications d'un conteneur de produits Azure Cosmos DB for NoSQL en mode dernière version. Le compte utilise la sauvegarde périodique, et le mode de sauvegarde ne doit pas changer. La propriété `DefaultTimeToLive` du conteneur vaut -1.

    Quand un produit est retiré, l'indexeur doit le supprimer de l'index de recherche, et le produit doit ensuite disparaître du conteneur sans aucun traitement de nettoyage.

    Quelles sont les deux actions que le service produit .NET doit effectuer quand un produit est retiré ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Set the container's DefaultTimeToLive to null.", fr: "Définir la propriété DefaultTimeToLive du conteneur sur null." } }
    - { id: b, text: { en: "Read the change feed in all versions and deletes mode.", fr: "Lire le flux de modifications en mode toutes les versions et suppressions." } }
    - { id: c, text: { en: "Update the product item to set a deleted property to true.", fr: "Mettre à jour l'élément produit pour définir une propriété deleted sur true." } }
    - { id: d, text: { en: "In the same update, set the item's ttl property to a positive number of seconds.", fr: "Dans la même mise à jour, définir la propriété ttl de l'élément sur un nombre positif de secondes." } }
    - { id: e, text: { en: "Delete the product item by calling DeleteItemAsync.", fr: "Supprimer l'élément produit en appelant DeleteItemAsync." } }
answer: { optionIds: [ c, d ] }
explanation:
  correct:
    en: "Latest version mode does not log deletes. The documented workaround is a soft delete: an update sets a deleted flag, which appears in the change feed so the indexer can react, and a ttl on the item lets TTL remove it automatically afterwards."
    fr: "Le mode dernière version n'enregistre pas les suppressions. La solution de contournement documentée est une suppression logique : une mise à jour définit un indicateur deleted, qui apparaît dans le flux de modifications pour que l'indexeur réagisse, et un ttl sur l'élément permet à la TTL de le supprimer automatiquement ensuite."
  options:
    e: { en: "In latest version mode, deleted items disappear from the change feed, so the indexer never sees the deletion.", fr: "En mode dernière version, les éléments supprimés disparaissent du flux de modifications : l'indexeur ne voit jamais la suppression." }
    a: { en: "A null DefaultTimeToLive turns TTL off, so item ttl values are ignored and the products are never removed.", fr: "Une DefaultTimeToLive null désactive la TTL : les ttl des éléments sont ignorés et les produits ne sont jamais supprimés." }
    b: { en: "All versions and deletes mode requires continuous backup, and the backup mode must not change.", fr: "Le mode toutes les versions et suppressions exige la sauvegarde continue, et le mode de sauvegarde ne doit pas changer." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/change-feed-modes
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
