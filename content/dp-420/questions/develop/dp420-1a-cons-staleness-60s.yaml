id: dp420-1a-cons-staleness-60s
objective: "1.1.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove Bank stores account balances in an Azure Cosmos DB for NoSQL account. The account has a single write region in West Europe and a read region in North Europe. Applications in North Europe read from their local region.

    A new regulation states that a balance read in North Europe must never be more than 60 seconds behind the latest write. The solution must keep a single write region and use the weakest consistency level that meets the regulation.

    Which default consistency level should you configure?
  fr: |
    Woodgrove Bank stocke les soldes des comptes dans un compte Azure Cosmos DB for NoSQL. Le compte possède une seule région d'écriture dans West Europe et une région de lecture dans North Europe. Les applications de North Europe lisent depuis leur région locale.

    Une nouvelle réglementation impose qu'un solde lu dans North Europe n'ait jamais plus de 60 secondes de retard sur la dernière écriture. La solution doit conserver une seule région d'écriture et utiliser le niveau de cohérence le plus faible qui respecte la réglementation.

    Quel niveau de cohérence par défaut devez-vous configurer ?
body:
  options:
    - { id: a, text: { en: "Consistent prefix with a read region added in West Europe", fr: "Consistent prefix avec une région de lecture ajoutée dans West Europe" } }
    - { id: b, text: { en: "Bounded staleness with maxIntervalInSeconds set to 60", fr: "Bounded staleness avec maxIntervalInSeconds défini sur 60" } }
    - { id: c, text: { en: "Strong", fr: "Strong" } }
    - { id: d, text: { en: "Session with session tokens shared between regions", fr: "Session avec des jetons de session partagés entre les régions" } }
answer: { optionId: c }
explanation:
  correct:
    en: In an account with more than one region, the minimum bounds of Bounded staleness are 100,000 write operations or 300 seconds, so a 60-second bound can't be configured. Strong consistency, which is supported with a single write region, never returns a stale value, so it is the weakest level that satisfies the 60-second rule.
    fr: "Dans un compte qui compte plusieurs régions, les limites minimales de Bounded staleness sont de 100 000 opérations d'écriture ou 300 secondes : une limite de 60 secondes ne peut pas être configurée. La cohérence Strong, prise en charge avec une seule région d'écriture, ne renvoie jamais de valeur obsolète : c'est le niveau le plus faible qui respecte la règle des 60 secondes."
  options:
    b: { en: "A multi-region account can't use a time bound below 300 seconds for Bounded staleness.", fr: "Un compte multirégion ne peut pas utiliser une limite de temps inférieure à 300 secondes pour Bounded staleness." }
    d: { en: "Session guarantees apply within one client session; a reader that doesn't hold the writer's token gets no bound on staleness.", fr: "Les garanties de Session s'appliquent dans une session client ; un lecteur qui ne détient pas le jeton du rédacteur n'a aucune limite d'obsolescence." }
    a: { en: "Consistent prefix only preserves the order of writes; it puts no limit on how far North Europe can lag.", fr: "Consistent prefix préserve uniquement l'ordre des écritures ; il ne limite pas le retard de North Europe." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
