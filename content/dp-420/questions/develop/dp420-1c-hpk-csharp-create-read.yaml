id: dp420-1c-hpk-csharp-create-read
objective: "1.3.5"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    You are developing a .NET application that uses the Azure Cosmos DB for NoSQL SDK v3. You need to:

    - create a container named **sessions** whose partition key has the levels `/tenantId`, `/userId` and `/sessionId`;
    - read the item **item-1** of tenant **contoso**, user **user-042** and session **s-7781** with the lowest RU cost.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous développez une application .NET qui utilise le SDK v3 d'Azure Cosmos DB for NoSQL. Vous devez :

    - créer un conteneur nommé **sessions** dont la clé de partition comporte les niveaux `/tenantId`, `/userId` et `/sessionId` ;
    - lire l'élément **item-1** du locataire **contoso**, de l'utilisateur **user-042** et de la session **s-7781** au coût en RU le plus faible.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    List<string> keyPaths = new List<string> { "/tenantId", "/userId", "/sessionId" };

    ContainerProperties properties = new ContainerProperties(
        id: "sessions",
        [[paths]]);

    Container container = await database.CreateContainerIfNotExistsAsync(properties, throughput: 4000);

    PartitionKey pk = new [[builder]]()
        .Add("contoso")
        .Add("user-042")
        .Add("s-7781")
        .Build();

    ItemResponse<UserSession> response = await container.[[read]]<UserSession>("item-1", pk);
  slots:
    - id: paths
      options:
        - { id: plist, text: "partitionKeyPaths: keyPaths" }
        - { id: pnested, text: 'partitionKeyPath: "/tenantId/userId/sessionId"' }
        - { id: pfirst, text: 'partitionKeyPath: "/tenantId"' }
    - id: builder
      options:
        - { id: bbuilder, text: PartitionKeyBuilder }
        - { id: bkey, text: PartitionKey }
        - { id: bdef, text: ContainerProperties }
    - id: read
      options:
        - { id: rread, text: ReadItemAsync }
        - { id: rmany, text: ReadManyItemsAsync }
        - { id: rquery, text: GetItemQueryIterator }
answer:
  values: { paths: plist, builder: bbuilder, read: rread }
explanation:
  correct:
    en: |-
      A hierarchical partition key is defined at creation by passing the list of paths to the `partitionKeyPaths` parameter of ContainerProperties. A full hierarchical key value is built with PartitionKeyBuilder, one Add call per level, then Build. ReadItemAsync with the id and the full key is a point read, the cheapest way to get one item.
    fr: |-
      Une clé de partition hiérarchique se définit à la création en passant la liste des chemins au paramètre `partitionKeyPaths` de ContainerProperties. Une valeur de clé hiérarchique complète se construit avec PartitionKeyBuilder, avec un appel Add par niveau, puis Build. ReadItemAsync avec l'id et la clé complète est une lecture ponctuelle, le moyen le moins coûteux d'obtenir un élément.
  options:
    pnested: { en: "This path points to a nested property tenantId.userId.sessionId; it is a single-level key.", fr: "Ce chemin désigne une propriété imbriquée tenantId.userId.sessionId ; c'est une clé à un seul niveau." }
    pfirst: { en: "This creates a single-level key on /tenantId only.", fr: "Ceci crée une clé à un seul niveau sur /tenantId uniquement." }
    bkey: { en: "PartitionKey has no Add or Build methods; multi-level values are built with PartitionKeyBuilder.", fr: "PartitionKey n'a pas de méthodes Add ni Build ; les valeurs multiniveaux se construisent avec PartitionKeyBuilder." }
    bdef: { en: "ContainerProperties describes the container, not a partition key value.", fr: "ContainerProperties décrit le conteneur, pas une valeur de clé de partition." }
    rmany: { en: "ReadManyItemsAsync takes a list of id and partition key pairs, not a single item.", fr: "ReadManyItemsAsync prend une liste de paires id et clé de partition, pas un seul élément." }
    rquery: { en: "A query costs more than a point read and has a different signature.", fr: "Une requête coûte plus qu'une lecture ponctuelle et a une autre signature." }
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
