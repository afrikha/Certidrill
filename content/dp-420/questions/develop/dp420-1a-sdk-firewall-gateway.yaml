id: dp420-1a-sdk-firewall-gateway
objective: "1.1.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Litware runs a .NET batch application in an on-premises datacenter. The corporate firewall allows outbound traffic only over HTTPS on port 443. The application uses the .NET SDK v3 with the default client options, and its requests to Azure Cosmos DB for NoSQL time out.

    You need the application to connect without changing the firewall rules.

    Which client option should you set?
  fr: |
    Litware exécute une application de traitement par lots .NET dans un centre de données local. Le pare-feu de l'entreprise n'autorise le trafic sortant qu'en HTTPS sur le port 443. L'application utilise le SDK .NET v3 avec les options de client par défaut, et ses requêtes vers Azure Cosmos DB for NoSQL expirent.

    L'application doit se connecter sans modification des règles du pare-feu.

    Quelle option de client devez-vous définir ?
body:
  options:
    - { id: a, text: "LimitToEndpoint = true" }
    - { id: b, text: "EnableTcpConnectionEndpointRediscovery = true" }
    - { id: c, text: "ConnectionMode = ConnectionMode.Gateway" }
    - { id: d, text: "ConnectionMode = ConnectionMode.Direct" }
answer: { optionId: c }
explanation:
  correct:
    en: |
      The .NET SDK v3 uses Direct mode with TCP by default, which opens connections directly to the back-end replicas. Gateway mode sends every request over HTTPS to the account's gateway endpoint, which works through a firewall that allows only port 443.
    fr: |
      Le SDK .NET v3 utilise par défaut le mode Direct avec TCP, qui ouvre des connexions directement vers les réplicas du back-end. Le mode Gateway envoie chaque requête en HTTPS au point de terminaison de passerelle du compte, ce qui fonctionne à travers un pare-feu qui n'autorise que le port 443.
  options:
    d: { en: "Direct is already the default mode, and it is the one blocked by the firewall.", fr: "Direct est déjà le mode par défaut, et c'est celui que bloque le pare-feu." }
    a: { en: "LimitToEndpoint restricts operations to the endpoint provided; the connection mode stays Direct.", fr: "LimitToEndpoint limite les opérations au point de terminaison fourni ; le mode de connexion reste Direct." }
    b: { en: "This option refreshes the address cache after TCP connection resets in Direct mode; the traffic still uses TCP.", fr: "Cette option actualise le cache d'adresses après une réinitialisation de connexion TCP en mode Direct ; le trafic utilise toujours TCP." }
references:
  - title: Performance tips for Azure Cosmos DB and .NET
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
  - title: CosmosClientOptions Class (Microsoft.Azure.Cosmos)
    url: https://learn.microsoft.com/en-us/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions
