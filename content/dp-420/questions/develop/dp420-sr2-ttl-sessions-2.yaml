id: dp420-sr2-ttl-sessions-2
objective: "1.2.5"
type: series_yesno
series: dp420-sr2-ttl-sessions
seriesOrder: 2
difficulty: 2
status: draft
stem:
  en: |
    You leave the container TTL unset and write session items with a ttl of 86,400.
  fr: |
    Vous laissez la durée de vie du conteneur non définie et écrivez les éléments session avec un ttl de 86 400.
body:
  solution:
    en: |
      You leave `DefaultTimeToLive` of the `sessions` container unset. The application writes every session item with the following property and writes auditPin items without a `ttl` property.

      ```json
      { "ttl": 86400 }
      ```
    fr: |
      Vous laissez la propriété `DefaultTimeToLive` du conteneur `sessions` non définie. L'application écrit chaque élément session avec la propriété suivante et écrit les éléments auditPin sans propriété `ttl`.

      ```json
      { "ttl": 86400 }
      ```
answer: { value: false }
explanation:
  correct:
    en: |
      An item-level `ttl` applies only when `DefaultTimeToLive` is present on the container and not null. Because TTL is not configured on `sessions`, the `ttl` property of the session items is ignored and no item ever expires.
    fr: |
      Un `ttl` au niveau de l'élément ne s'applique que si `DefaultTimeToLive` est présent sur le conteneur et n'est pas null. La durée de vie n'étant pas configurée sur `sessions`, la propriété `ttl` des éléments session est ignorée et aucun élément n'expire jamais.
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
