id: dp420-1b-delete-item-info
objective: "1.2.3"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Tailspin stores orders in an Azure Cosmos DB for NoSQL container partitioned by `/customerId`. A .NET service receives cancellation events that contain `orderId` (the item's `id`), `customerId` and `total`.

    The service must delete the cancelled order with `DeleteItemAsync`.

    Which values must the call receive?
  fr: |
    Tailspin stocke des commandes dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/customerId`. Un service .NET reçoit des événements d'annulation qui contiennent `orderId` (l'`id` de l'élément), `customerId` et `total`.

    Le service doit supprimer la commande annulée avec `DeleteItemAsync`.

    Quelles valeurs l'appel doit-il recevoir ?
body:
  options:
    - { id: a, text: { en: "orderId as the id and customerId as the partition key value", fr: "orderId comme id et customerId comme valeur de clé de partition" } }
    - { id: b, text: { en: "orderId as the id only", fr: "orderId comme id uniquement" } }
    - { id: c, text: { en: "customerId as the partition key value only", fr: "customerId comme valeur de clé de partition uniquement" } }
    - { id: d, text: { en: "orderId as the id and the item's current _etag", fr: "orderId comme id et l'_etag actuel de l'élément" } }
answer: { optionId: a }
explanation:
  correct:
    en: "Like a point read, a delete addresses one item by its id and its partition key value. DeleteItemAsync therefore takes the order id and a PartitionKey built from the customer ID."
    fr: "Comme une lecture ponctuelle, une suppression désigne un élément par son id et sa valeur de clé de partition. DeleteItemAsync prend donc l'id de la commande et une PartitionKey construite à partir de l'ID client."
  options:
    b: { en: "The id alone does not identify the logical partition that holds the item.", fr: "L'id seul n'identifie pas la partition logique qui contient l'élément." }
    c: { en: "The partition key alone identifies a logical partition, not one item.", fr: "La clé de partition seule identifie une partition logique, pas un élément." }
    d: { en: "An ETag condition is optional and does not replace the partition key.", fr: "Une condition ETag est facultative et ne remplace pas la clé de partition." }
references:
  - title: Read an Item Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-read-item
  - title: Migrate From the Bulk Executor Library to the Bulk Support in .NET V3 SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-migrate-from-bulk-executor-library
