id: dp420-1c-reference-volatile-shared
objective: "1.3.3"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Woodgrove Bank stores investment portfolios in Azure Cosmos DB for NoSQL. Each of the 400,000 portfolios holds up to 50 securities. The price of a security changes hundreds of times per day, and a popular security appears in more than 100,000 portfolios.

    You need a data model that keeps the cost of price updates as low as possible.

    How should you model the prices?
  fr: |
    Woodgrove Bank stocke des portefeuilles d'investissement dans Azure Cosmos DB for NoSQL. Chacun des 400 000 portefeuilles contient jusqu'à 50 titres. Le prix d'un titre change des centaines de fois par jour, et un titre populaire figure dans plus de 100 000 portefeuilles.

    Vous avez besoin d'un modèle de données qui maintienne le coût des mises à jour de prix aussi bas que possible.

    Comment devez-vous modéliser les prix ?
body:
  options:
    - { id: a, text: { en: "Store each security with its price in its own item, and reference it from portfolios by its ID", fr: "Stocker chaque titre et son prix dans un élément distinct, et le référencer depuis les portefeuilles par son ID" } }
    - { id: b, text: { en: "Embed the current price of each security in every portfolio item that holds it", fr: "Incorporer le prix actuel de chaque titre dans chaque portefeuille qui le détient" } }
    - { id: c, text: { en: "Embed the full price history of each security in every portfolio item that holds it", fr: "Incorporer l'historique complet des prix de chaque titre dans chaque portefeuille qui le détient" } }
    - { id: d, text: { en: "Embed all the portfolios that hold a security inside the security's item", fr: "Incorporer tous les portefeuilles qui détiennent un titre dans l'élément de ce titre" } }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      The price is shared by many items and changes frequently, so it should be referenced. A price change then updates a single security item instead of thousands of portfolios; reading a portfolio costs a few extra reads, which is the accepted trade-off of normalization for write performance.
    fr: |-
      Le prix est partagé par de nombreux éléments et change souvent : il doit être référencé. Un changement de prix met alors à jour un seul élément de titre au lieu de milliers de portefeuilles ; lire un portefeuille coûte quelques lectures supplémentaires, ce qui est le compromis accepté de la normalisation au profit des performances d'écriture.
  options:
    b: { en: "Each price change would rewrite up to 100,000 portfolio items, hundreds of times per day.", fr: "Chaque changement de prix réécrirait jusqu'à 100 000 portefeuilles, des centaines de fois par jour." }
    c: { en: "The history is unbounded and duplicated, which multiplies both the item size and the update cost.", fr: "L'historique n'est pas borné et est dupliqué, ce qui multiplie à la fois la taille des éléments et le coût des mises à jour." }
    d: { en: "The array would hold more than 100,000 portfolios, an unbounded embedding that exceeds the 2 MB item limit.", fr: "Le tableau contiendrait plus de 100 000 portefeuilles, une incorporation non bornée qui dépasse la limite de 2 Mo par élément." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
