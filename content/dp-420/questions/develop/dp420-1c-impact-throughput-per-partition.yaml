id: dp420-1c-impact-throughput-per-partition
objective: "1.3.4"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL container partitioned by `/accountId`. The container has 48,000 RU/s of manual throughput and currently has eight physical partitions. Burst capacity and throughput redistribution are not enabled.

    You need to evaluate the limits that apply to the busiest account.

    How should you complete the statements? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware dispose d'un conteneur Azure Cosmos DB for NoSQL partitionné par `/accountId`. Le conteneur dispose de 48 000 RU/s de débit manuel et compte actuellement huit partitions physiques. La capacité de rafale et la redistribution du débit ne sont pas activées.

    Vous devez évaluer les limites qui s'appliquent au compte le plus actif.

    Comment devez-vous compléter les affirmations ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      Each physical partition can serve up to [[physical]] RU/s.

      All the requests for a single accountId value can consume at most [[logical]] RU/s.

      All the items of a single accountId value can store at most [[storage]].
    fr: |
      Chaque partition physique peut servir jusqu'à [[physical]] RU/s.

      L'ensemble des requêtes d'une même valeur d'accountId peut consommer au plus [[logical]] RU/s.

      L'ensemble des éléments d'une même valeur d'accountId peut stocker au plus [[storage]].
  slots:
    - id: physical
      options:
        - { id: p4800, text: "4,800" }
        - { id: p6000, text: "6,000" }
        - { id: p8000, text: "8,000" }
        - { id: p48000, text: "48,000" }
    - id: logical
      options:
        - { id: l3000, text: "3,000" }
        - { id: l4800, text: "4,800" }
        - { id: l6000, text: "6,000" }
        - { id: l10000, text: "10,000" }
    - id: storage
      options:
        - { id: s10, text: { en: "10 GB", fr: "10 Go" } }
        - { id: s20, text: { en: "20 GB", fr: "20 Go" } }
        - { id: s50, text: { en: "50 GB", fr: "50 Go" } }
        - { id: s100, text: { en: "100 GB", fr: "100 Go" } }
answer:
  values: { physical: p6000, logical: l6000, storage: s20 }
explanation:
  correct:
    en: |-
      Provisioned throughput is divided evenly across the physical partitions, so each of the eight partitions gets 48,000 / 8 = 6,000 RU/s. A logical partition lives on a single physical partition, so one accountId value is capped by that partition's 6,000 RU/s, below the 10,000 RU/s logical partition limit. A logical partition can store up to 20 GB.
    fr: |-
      Le débit approvisionné est réparti uniformément entre les partitions physiques : chacune des huit partitions reçoit 48 000 / 8 = 6 000 RU/s. Une partition logique réside sur une seule partition physique : une valeur d'accountId est donc plafonnée par les 6 000 RU/s de cette partition, en dessous de la limite de 10 000 RU/s par partition logique. Une partition logique peut stocker jusqu'à 20 Go.
  options:
    l10000: { en: "10,000 RU/s is the logical partition limit, but here the physical partition that hosts it only has 6,000 RU/s.", fr: "10 000 RU/s est la limite d'une partition logique, mais ici la partition physique qui l'héberge ne dispose que de 6 000 RU/s." }
    p48000: { en: "48,000 RU/s is the container total, shared by the eight physical partitions.", fr: "48 000 RU/s est le total du conteneur, partagé par les huit partitions physiques." }
    s50: { en: "50 GB is the storage of a physical partition, not of a logical partition.", fr: "50 Go est le stockage d'une partition physique, pas d'une partition logique." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
