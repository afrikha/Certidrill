id: dp420-1b-maxitemcount-fewer
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    A .NET application queries an Azure Cosmos DB for NoSQL container with `QueryRequestOptions.MaxItemCount = 50`. The query matches about 3,000 items.

    During a load test, several pages contain only 12 items, while `HasMoreResults` remains `true`.

    What explains this behavior?
  fr: |
    Une application .NET interroge un conteneur Azure Cosmos DB for NoSQL avec `QueryRequestOptions.MaxItemCount = 50`. La requête correspond à environ 3 000 éléments.

    Pendant un test de charge, plusieurs pages ne contiennent que 12 éléments, alors que `HasMoreResults` reste à `true`.

    Qu'est-ce qui explique ce comportement ?
body:
  options:
    - { id: a, text: { en: "MaxItemCount applies per physical partition, and each partition holds only 12 matching items per page.", fr: "MaxItemCount s'applique par partition physique, et chaque partition ne contient que 12 éléments correspondants par page." } }
    - { id: b, text: { en: "MaxItemCount is ignored during load tests, and the SDK uses a default page size based on the consistency level.", fr: "MaxItemCount est ignoré pendant les tests de charge, et le SDK utilise une taille de page par défaut fondée sur le niveau de cohérence." } }
    - { id: c, text: { en: "MaxItemCount is a minimum, and pages smaller than 50 items indicate that the query plan failed.", fr: "MaxItemCount est un minimum, et des pages de moins de 50 éléments indiquent un échec du plan de requête." } }
    - { id: d, text: { en: "MaxItemCount is a maximum: an execution can return fewer items when it is throttled, reaches a size limit or runs too long.", fr: "MaxItemCount est un maximum : une exécution peut renvoyer moins d'éléments quand elle est limitée, atteint une limite de taille ou dure trop longtemps." } }
answer: { optionId: d }
explanation:
  correct:
    en: "MaxItemCount tells the query engine to return that many items or fewer. Throttling, a response that would be too large, a long execution or the engine's own optimization can end an execution early, so page sizes vary between runs. The application must keep reading pages while HasMoreResults is true."
    fr: "MaxItemCount demande au moteur de requête de renvoyer ce nombre d'éléments ou moins. La limitation du débit, une réponse trop volumineuse, une exécution trop longue ou l'optimisation du moteur peuvent terminer une exécution plus tôt, si bien que la taille des pages varie d'une exécution à l'autre. L'application doit continuer à lire les pages tant que HasMoreResults est vrai."
  options:
    a: { en: "The page size limit applies to the page returned by the query, not to each partition.", fr: "La limite de taille de page s'applique à la page renvoyée par la requête, pas à chaque partition." }
    b: { en: "The SDK honors MaxItemCount in every environment; consistency does not set the page size.", fr: "Le SDK respecte MaxItemCount dans tous les environnements ; la cohérence ne définit pas la taille de page." }
    c: { en: "MaxItemCount is an upper bound, and short pages are normal, not a failure.", fr: "MaxItemCount est une borne supérieure, et des pages courtes sont normales, pas un échec." }
references:
  - title: Pagination - Query language in Cosmos DB (in Azure and Fabric)
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/query/pagination
