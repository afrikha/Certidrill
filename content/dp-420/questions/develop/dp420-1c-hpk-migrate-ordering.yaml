id: dp420-1c-hpk-migrate-ordering
objective: "1.3.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Proseware has an Azure Cosmos DB for NoSQL container named **docs-v1** partitioned by `/tenantId`. Large tenants are approaching the 20 GB logical partition limit. You decide to move to a hierarchical partition key made of `/tenantId` and `/userId`.

    The application is stopped during a maintenance window, so an offline migration is acceptable.

    Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Proseware dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **docs-v1** partitionné par `/tenantId`. Les grands locataires approchent la limite de 20 Go par partition logique. Vous décidez de passer à une clé de partition hiérarchique composée de `/tenantId` et `/userId`.

    L'application est arrêtée pendant une fenêtre de maintenance : une migration hors connexion est acceptable.

    Quelles sont les trois actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 3
  actions:
    - { id: create, text: { en: "Create a container named docs-v2 with the hierarchical partition key /tenantId, /userId.", fr: "Créer un conteneur nommé docs-v2 avec la clé de partition hiérarchique /tenantId, /userId." } }
    - { id: copy, text: { en: "Run a container copy job from docs-v1 to docs-v2.", fr: "Exécuter une tâche de copie de conteneur de docs-v1 vers docs-v2." } }
    - { id: app, text: { en: "Update the application to use docs-v2 and to supply both key levels.", fr: "Mettre à jour l'application pour qu'elle utilise docs-v2 et fournisse les deux niveaux de clé." } }
    - { id: alter, text: { en: "Update the partition key definition of docs-v1 to add /userId.", fr: "Mettre à jour la définition de clé de partition de docs-v1 pour ajouter /userId." } }
    - { id: merge, text: { en: "Run a partition merge on docs-v1.", fr: "Exécuter une fusion de partitions sur docs-v1." } }
    - { id: restore, text: { en: "Restore docs-v1 to a point in time under the name docs-v2.", fr: "Restaurer docs-v1 à un point dans le temps sous le nom docs-v2." } }
answer:
  sequence: [ create, copy, app ]
explanation:
  correct:
    en: |-
      The partition key of a container is immutable and hierarchical keys cannot be added to an existing container. You create a new container with the hierarchical key, copy the data with a container copy job (offline), then point the application to the new container and supply the full key values.
    fr: |-
      La clé de partition d'un conteneur est immuable et les clés hiérarchiques ne peuvent pas être ajoutées à un conteneur existant. Vous créez un nouveau conteneur avec la clé hiérarchique, copiez les données avec une tâche de copie de conteneur (hors connexion), puis faites pointer l'application vers le nouveau conteneur en fournissant les valeurs de clé complètes.
  options:
    alter: { en: "The partition key definition cannot be changed after creation.", fr: "La définition de la clé de partition ne peut pas être modifiée après la création." }
    merge: { en: "A merge reduces the number of physical partitions; it does not change the partition key.", fr: "Une fusion réduit le nombre de partitions physiques ; elle ne change pas la clé de partition." }
    restore: { en: "A restored container keeps the original partition key definition.", fr: "Un conteneur restauré conserve la définition de clé de partition d'origine." }
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
  - title: Frequently asked questions on hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys-faq
