id: dp420-1d-feed-api-map
objective: "1.4.2"
type: dragdrop
difficulty: 2
status: draft
stem:
  en: |
    You are building several .NET components that read the change feed of an Azure Cosmos DB for NoSQL container named **inventory**.

    Which method of the `Container` class should each component call? To answer, drag the appropriate methods to the correct components. Each method may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Vous développez plusieurs composants .NET qui lisent le flux de modification d'un conteneur Azure Cosmos DB for NoSQL nommé **inventory**.

    Quelle méthode de la classe `Container` chaque composant doit-il appeler ? Pour répondre, faites glisser les méthodes appropriées vers les composants correspondants. Chaque méthode peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: cfp, text: GetChangeFeedProcessorBuilder }
    - { id: iter, text: GetChangeFeedIterator }
    - { id: ranges, text: GetFeedRangesAsync }
    - { id: est, text: GetChangeFeedEstimator }
    - { id: query, text: GetItemQueryIterator }
  targets:
    - id: t1
      text: { en: "A service that runs on several instances and must share the work automatically by using leases", fr: "Un service qui s'exécute sur plusieurs instances et doit se répartir le travail automatiquement à l'aide de baux" }
    - id: t2
      text: { en: "A tool that reads the changes of one partition key value at its own pace", fr: "Un outil qui lit à son propre rythme les modifications d'une seule valeur de clé de partition" }
    - id: t3
      text: { en: "An orchestrator that gets one range per physical partition to hand to pull model workers", fr: "Un orchestrateur qui obtient une plage par partition physique à confier aux processus du modèle de tirage" }
    - id: t4
      text: { en: "A monitor that reports the estimated lag of each lease on demand", fr: "Un moniteur qui indique à la demande le retard estimé de chaque bail" }
answer:
  mapping: { t1: cfp, t2: iter, t3: ranges, t4: est }
explanation:
  correct:
    en: |
      GetChangeFeedProcessorBuilder creates a processor that distributes leases across instances. GetChangeFeedIterator is the pull model entry point and accepts a FeedRange built from a single partition key. GetFeedRangesAsync returns one FeedRange per physical partition for manual parallelization. GetChangeFeedEstimator returns an estimator whose GetCurrentStateIterator reports the lag and owner of each lease.
    fr: |
      GetChangeFeedProcessorBuilder crée un processeur qui distribue les baux entre les instances. GetChangeFeedIterator est le point d'entrée du modèle de tirage et accepte un FeedRange construit à partir d'une seule clé de partition. GetFeedRangesAsync renvoie un FeedRange par partition physique pour une parallélisation manuelle. GetChangeFeedEstimator renvoie un estimateur dont GetCurrentStateIterator indique le retard et le propriétaire de chaque bail.
  options:
    query: { en: "GetItemQueryIterator runs queries against the current data, not against the change feed.", fr: "GetItemQueryIterator exécute des requêtes sur les données actuelles, pas sur le flux de modification." }
references:
  - title: Change Feed Pull Model - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-pull-model
  - title: Use the Change Feed Estimator - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-use-change-feed-estimator
