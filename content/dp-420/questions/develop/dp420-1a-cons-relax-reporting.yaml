id: dp420-1a-cons-relax-reporting
objective: "1.1.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account whose default consistency level is Strong. Several order-processing services depend on this level.

    A new .NET reporting job reads millions of items every night and tolerates stale data. You need to reduce the RU cost of the job's reads without changing the behavior of the other services.

    What should you do?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL dont le niveau de cohérence par défaut est Strong. Plusieurs services de traitement des commandes dépendent de ce niveau.

    Un nouveau travail de reporting .NET lit des millions d'éléments chaque nuit et accepte des données obsolètes. Vous devez réduire le coût en RU des lectures du travail sans modifier le comportement des autres services.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Change the default consistency level of the account to Eventual.", fr: "Changer le niveau de cohérence par défaut du compte en Eventual." } }
    - { id: b, text: { en: "Enable burst capacity on the account before the job runs.", fr: "Activer la capacité en rafale sur le compte avant l'exécution du travail." } }
    - { id: c, text: { en: "Add a read region to the account and run the job in that region.", fr: "Ajouter une région de lecture au compte et exécuter le travail dans cette région." } }
    - { id: d, text: { en: "Set ConsistencyLevel to Eventual in the CosmosClientOptions of the job's client.", fr: "Définir ConsistencyLevel sur Eventual dans les CosmosClientOptions du client du travail." } }
answer: { optionId: d }
explanation:
  correct:
    en: A client can relax the account's consistency level for its own reads. With Strong, a read uses a two-replica quorum and costs about twice the RUs of a read at Session or a weaker level, so the job's reads cost about half as much while the other services keep Strong.
    fr: |
      Un client peut assouplir le niveau de cohérence du compte pour ses propres lectures. Avec Strong, une lecture utilise un quorum de deux réplicas et coûte environ deux fois plus de RU qu'une lecture en Session ou à un niveau plus faible : les lectures du travail coûtent environ moitié moins, et les autres services conservent Strong.
  options:
    a: { en: "Changing the account default would also weaken the consistency of the order-processing services.", fr: "Changer la valeur par défaut du compte affaiblirait aussi la cohérence des services de traitement des commandes." }
    b: { en: "Burst capacity absorbs short spikes above the provisioned RU/s; it doesn't lower the RU charge of each read.", fr: "La capacité en rafale absorbe les pics brefs au-delà des RU/s approvisionnées ; elle ne réduit pas la charge en RU de chaque lecture." }
    c: { en: "A read in another region still runs at the account's Strong level and costs the same RUs.", fr: "Une lecture dans une autre région s'exécute toujours au niveau Strong du compte et coûte les mêmes RU." }
references:
  - title: Manage consistency levels in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-manage-consistency
  - title: Request Units as a throughput and performance currency - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/request-units
