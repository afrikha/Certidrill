id: dp420-1e-kit-query-review
objective: "1.5.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    At Tailspin, a reporting query against an Azure Cosmos DB for NoSQL container named **flights** consumes about 450 request units (RU) per execution. You plan to ask your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, to optimize the query.

    You need to follow the Agent Kit task guidance for query optimization so that the recommendations are grounded in your workload and verified before they reach production.

    Which two actions should you perform? Each correct answer presents part of the solution.

    NOTE: Each correct selection is worth one point.
  fr: |
    Chez Tailspin, une requête de rapport sur un conteneur Azure Cosmos DB for NoSQL nommé **flights** consomme environ 450 unités de requête (RU) par exécution. Vous prévoyez de demander à votre assistant de codage IA, sur lequel Azure Cosmos DB Agent Kit est installé, d'optimiser la requête.

    Vous devez suivre les instructions de tâche d'Agent Kit pour l'optimisation de requêtes, afin que les recommandations s'appuient sur votre charge de travail et soient vérifiées avant d'atteindre la production.

    Quelles sont les deux actions à effectuer ? Chaque bonne réponse présente une partie de la solution.

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Give the assistant the query, the partition key definition, the indexing policy and the query diagnostics.", fr: "Fournir à l'assistant la requête, la définition de clé de partition, la stratégie d'indexation et les diagnostics de la requête." } }
    - { id: b, text: { en: "Give the assistant the account's primary key so that it can run the query against the production data.", fr: "Fournir à l'assistant la clé primaire du compte pour qu'il puisse exécuter la requête sur les données de production." } }
    - { id: c, text: { en: "Record the RU savings that the assistant estimates as the measured result of the change.", fr: "Consigner les économies de RU estimées par l'assistant comme résultat mesuré de la modification." } }
    - { id: d, text: { en: "Run the original and revised queries on the same representative dataset, and compare results, RU charge and latency.", fr: "Exécuter la requête d'origine et la requête révisée sur le même jeu de données représentatif, puis comparer les résultats, la charge en RU et la latence." } }
    - { id: e, text: { en: "Install the kit through a second installation method in the same host so that more rules are loaded.", fr: "Installer le kit par une seconde méthode d'installation dans le même hôte pour que davantage de règles soient chargées." } }
answer: { optionIds: [ a, d ] }
explanation:
  correct:
    en: |
      For a query review, the assistant needs the query, the partition key definition, the indexing policy, representative document shapes, the required fields and the available RU charges and diagnostics. Its proposals are then tested against the same representative dataset and indexing state, checking that the results are equivalent and measuring RU charge and latency before claiming an improvement.
    fr: |
      Pour réviser une requête, l'assistant a besoin de la requête, de la définition de clé de partition, de la stratégie d'indexation, de formes de documents représentatives, des champs requis ainsi que des charges en RU et diagnostics disponibles. Ses propositions sont ensuite testées sur le même jeu de données représentatif et le même état d'indexation, en vérifiant que les résultats sont équivalents et en mesurant la charge en RU et la latence avant de conclure à une amélioration.
  options:
    b:
      en: |
        The guidance says not to share credentials or connection strings in prompts; skills do not need database access.
      fr: |
        Les instructions demandent de ne pas partager d'informations d'identification ni de chaînes de connexion dans les invites ; les compétences n'ont pas besoin d'accès à la base de données.
    c:
      en: |
        Generated recommendations are not evidence of a measured improvement; you must measure the RU charge yourself.
      fr: |
        Les recommandations générées ne prouvent pas une amélioration mesurée ; vous devez mesurer vous-même la charge en RU.
    e:
      en: |
        The setup guidance says not to install the same skill through several methods in the same host.
      fr: |
        Les instructions d'installation recommandent de ne pas installer la même compétence par plusieurs méthodes dans le même hôte.
references:
  - title: Use the Azure Cosmos DB Agent Kit - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/usage
