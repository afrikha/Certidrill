id: dp420-1e-copy-change-pk
objective: "1.4.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **cosmos-contoso** in West Europe. A container named **orders** uses the partition key `/region` and receives about 300 writes per second, 24 hours a day.

    Most queries now filter on `customerId`, so you need the data in a container that uses the partition key `/customerId`. The application must keep writing to **orders** while the data is copied, and the solution must minimize custom code.

    What should you do?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **cosmos-contoso** en West Europe. Un conteneur nommé **orders** utilise la clé de partition `/region` et reçoit environ 300 écritures par seconde, 24 heures sur 24.

    La plupart des requêtes filtrent désormais sur `customerId` : vous devez donc placer les données dans un conteneur qui utilise la clé de partition `/customerId`. L'application doit continuer d'écrire dans **orders** pendant la copie des données, et la solution doit réduire au minimum le code personnalisé.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text: { en: "Run az cosmosdb sql container update to change the partition key path of orders to /customerId.", fr: "Exécuter az cosmosdb sql container update pour remplacer le chemin de clé de partition d'orders par /customerId." }
    - id: b
      text: { en: "Create a container that uses /customerId, and then run an online container copy job from orders.", fr: "Créer un conteneur qui utilise /customerId, puis exécuter une tâche de copie de conteneur en ligne depuis orders." }
    - id: c
      text: { en: "Perform a point-in-time restore of orders to a new container, and then set /customerId on it.", fr: "Effectuer une restauration à un point dans le temps d'orders vers un nouveau conteneur, puis y définir /customerId." }
    - id: d
      text: { en: "Enable the Merge partition capability on the account, and then merge the physical partitions of orders.", fr: "Activer la capacité Merge partition sur le compte, puis fusionner les partitions physiques d'orders." }
answer: { optionId: b }
explanation:
  correct:
    en: |
      The partition key of a container is set at creation and cannot be modified, so you create a target container with the new key and copy the data into it. An online copy job uses the all versions and deletes change feed to replicate the existing items and the changes made while the application keeps writing, without code to maintain.
    fr: "La clé de partition d'un conteneur est définie à sa création et ne peut pas être modifiée : vous créez donc un conteneur cible avec la nouvelle clé et y copiez les données. Une tâche de copie en ligne utilise le flux de modification en mode toutes les versions et suppressions pour répliquer les éléments existants et les modifications effectuées pendant que l'application continue d'écrire, sans code à maintenir."
  options:
    a:
      en: |
        The partition key path of an existing container cannot be changed by an update; a new container is required.
      fr: |
        Le chemin de clé de partition d'un conteneur existant ne peut pas être modifié par une mise à jour ; un nouveau conteneur est nécessaire.
    c:
      en: |
        A restore recreates the container with its original settings, including the /region partition key, which cannot be changed afterwards.
      fr: |
        Une restauration recrée le conteneur avec ses paramètres d'origine, y compris la clé de partition /region, qui ne peut pas être modifiée ensuite.
    d:
      en: |
        Merging physical partitions reduces the partition count but keeps the partition key; copy jobs do not even run on accounts with the Merge partition capability.
      fr: |
        La fusion de partitions physiques réduit leur nombre mais conserve la clé de partition ; les tâches de copie ne fonctionnent d'ailleurs pas sur les comptes dotés de la capacité Merge partition.
references:
  - title: Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/container-copy
