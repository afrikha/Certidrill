id: dp420-1c-model-ttl-sessions
objective: "1.3.1"
type: dropdown
difficulty: 2
status: draft
stem:
  en: |
    Adatum stores web session items in a new Azure Cosmos DB for NoSQL container named **sessions**. You have the following requirements:

    - By default, a session item must be deleted automatically 30 minutes after its last modification.
    - Sessions that a user marks as "remember me" must never expire.
    - The solution must not consume RUs for client-side delete operations.

    How should you complete the code? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum stocke des éléments de session web dans un nouveau conteneur Azure Cosmos DB for NoSQL nommé **sessions**. Vous avez les exigences suivantes :

    - Par défaut, un élément de session doit être supprimé automatiquement 30 minutes après sa dernière modification.
    - Les sessions qu'un utilisateur marque « Se souvenir de moi » ne doivent jamais expirer.
    - La solution ne doit pas consommer de RU pour des opérations de suppression côté client.

    Comment devez-vous compléter le code ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    ContainerProperties properties = new ContainerProperties(
        id: "sessions",
        partitionKeyPath: "/userId")
    {
        DefaultTimeToLive = [[container]]
    };
    await database.CreateContainerIfNotExistsAsync(properties);

    // Item for a "remember me" session
    var session = new { id = sessionId, userId, rememberMe = true, ttl = [[item]] };
    await container.CreateItemAsync(session, new PartitionKey(userId));
  slots:
    - id: container
      options:
        - { id: c1800, text: "1800" }
        - { id: c30, text: "30" }
        - { id: cneg, text: "-1" }
        - { id: cnull, text: "null" }
    - id: item
      options:
        - { id: ineg, text: "-1" }
        - { id: izero, text: "0" }
        - { id: inull, text: "(int?)null" }
        - { id: i1800, text: "1800" }
answer:
  values: { container: c1800, item: ineg }
explanation:
  correct:
    en: "`DefaultTimeToLive` is expressed in seconds, so 1800 makes items expire 30 minutes after their last modification. An item's `ttl` overrides the container default, and the value -1 means that the item never expires. Expired items are removed in the background with leftover provisioned RUs, not by client delete requests."
    fr: "`DefaultTimeToLive` s'exprime en secondes : 1800 fait expirer les éléments 30 minutes après leur dernière modification. Le `ttl` d'un élément remplace la valeur par défaut du conteneur, et la valeur -1 signifie que l'élément n'expire jamais. Les éléments expirés sont supprimés en arrière-plan avec les RU approvisionnées restantes, et non par des requêtes de suppression du client."
  options:
    c30: { en: "TTL values are in seconds: 30 would expire sessions after 30 seconds.", fr: "Les valeurs de durée de vie sont en secondes : 30 ferait expirer les sessions au bout de 30 secondes." }
    cneg: { en: "With -1 on the container, TTL is enabled but items without their own ttl never expire.", fr: "Avec -1 sur le conteneur, la durée de vie est activée, mais les éléments sans ttl propre n'expirent jamais." }
    cnull: { en: "A null container TTL disables expiration for every item, whatever their ttl.", fr: "Une durée de vie null sur le conteneur désactive l'expiration de tous les éléments, quel que soit leur ttl." }
    izero: { en: "An item ttl must be a nonzero positive integer or -1.", fr: "Le ttl d'un élément doit être un entier positif non nul ou -1." }
    inull: { en: "Setting ttl to null on an item is not supported; to use the default you omit the property.", fr: "Définir ttl à null sur un élément n'est pas pris en charge ; pour utiliser la valeur par défaut, on omet la propriété." }
    i1800: { en: "1800 would make the remember-me sessions expire after 30 minutes like the others.", fr: "1800 ferait expirer les sessions « Se souvenir de moi » au bout de 30 minutes, comme les autres." }
references:
  - title: Time to live in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
