id: dp420-1e-copy-manage-commands
objective: "1.4.5"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Adatum runs several container copy jobs in an Azure Cosmos DB for NoSQL account named **cosmos-adatum**.

    Which Azure CLI command should you run for each requirement? To answer, drag the appropriate commands to the correct requirements. Each command may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum exécute plusieurs tâches de copie de conteneur dans un compte Azure Cosmos DB for NoSQL nommé **cosmos-adatum**.

    Quelle commande Azure CLI devez-vous exécuter pour chaque exigence ? Pour répondre, faites glisser les commandes appropriées vers les exigences correspondantes. Chaque commande peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: show, text: az cosmosdb copy show }
    - { id: list, text: az cosmosdb copy list }
    - { id: pause, text: az cosmosdb copy pause }
    - { id: complete, text: az cosmosdb copy complete }
    - { id: cancel, text: az cosmosdb copy cancel }
    - { id: resume, text: az cosmosdb copy resume }
  targets:
    - id: progress
      text: { en: "Compare the processed count and the total count of a job named job-orders", fr: "Comparer le nombre traité et le nombre total d'une tâche nommée job-orders" }
    - id: finish
      text: { en: "After writes to the source stopped, write the last changes of an online job and free its compute", fr: "Après l'arrêt des écritures dans la source, écrire les dernières modifications d'une tâche en ligne et libérer son calcul" }
    - id: hold
      text: { en: "Halt a running job temporarily so that it can continue later", fr: "Interrompre temporairement une tâche en cours pour qu'elle puisse reprendre plus tard" }
    - id: abandon
      text: { en: "Stop for good a job that was created with the wrong destination container", fr: "Arrêter définitivement une tâche créée avec le mauvais conteneur de destination" }
answer:
  mapping: { progress: show, finish: complete, hold: pause, abandon: cancel }
explanation:
  correct:
    en: |
      az cosmosdb copy show returns the status and the processed and total counts of one job. az cosmosdb copy complete is the completion API of an online job, which writes the remaining changes and releases the compute. pause stops a job that resume can restart later, while cancel ends the job for good. list only enumerates the jobs of the account.
    fr: |
      az cosmosdb copy show renvoie l'état ainsi que le nombre traité et le nombre total d'une tâche. az cosmosdb copy complete correspond à l'API d'achèvement d'une tâche en ligne, qui écrit les modifications restantes et libère le calcul. pause interrompt une tâche que resume peut relancer plus tard, tandis que cancel met fin définitivement à la tâche. list se contente d'énumérer les tâches du compte.
references:
  - title: Create and Manage Intra-account Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-container-copy
