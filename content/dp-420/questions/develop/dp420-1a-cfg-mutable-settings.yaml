id: dp420-1a-cfg-mutable-settings
objective: "1.1.4"
type: multi
difficulty: 1
status: draft
stem:
  en: |
    Northwind Traders has an Azure Cosmos DB for NoSQL container named **invoices** that has been in production for a year. The container is partitioned on `/customerId` and uses a unique key policy on `/invoiceNumber`.

    You plan to change some of its settings without creating a new container or copying data.

    Which two settings can you change on the existing container?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **invoices**, en production depuis un an. Le conteneur est partitionné sur `/customerId` et utilise une stratégie de clé unique sur `/invoiceNumber`.

    Vous prévoyez de modifier certains de ses paramètres sans créer de nouveau conteneur ni copier de données.

    Quels sont les deux paramètres que vous pouvez modifier sur le conteneur existant ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The indexing policy", fr: "La stratégie d'indexation" } }
    - { id: b, text: { en: "The default time to live (TTL)", fr: "La durée de vie (TTL) par défaut" } }
    - { id: c, text: { en: "The partition key path", fr: "Le chemin de la clé de partition" } }
    - { id: d, text: { en: "The unique key policy", fr: "La stratégie de clé unique" } }
    - { id: e, text: { en: "A second level of hierarchical partition key", fr: "Un deuxième niveau de clé de partition hiérarchique" } }
answer: { optionIds: [ a, b ] }
explanation:
  correct:
    en: |
      The indexing policy and the default TTL can be updated at any time; `az cosmosdb sql container update` exposes `--idx` and `--ttl`. An indexing policy change triggers an online index transformation that consumes RUs.
    fr: |
      La stratégie d'indexation et la durée de vie par défaut peuvent être modifiées à tout moment ; `az cosmosdb sql container update` expose `--idx` et `--ttl`. Une modification de la stratégie d'indexation déclenche une transformation d'index en ligne qui consomme des RU.
  options:
    c: { en: "The partition key can't be changed in place; you copy the data to a new container with the new key.", fr: "La clé de partition ne peut pas être modifiée sur place ; vous copiez les données vers un nouveau conteneur doté de la nouvelle clé." }
    d: { en: "A unique key policy can be defined only when the container is created and can't be changed afterward.", fr: "Une stratégie de clé unique ne peut être définie qu'à la création du conteneur et ne peut plus être modifiée ensuite." }
    e: { en: "Hierarchical partition keys must be set at container creation time and can't be added to an existing container.", fr: "Les clés de partition hiérarchiques doivent être définies à la création du conteneur et ne peuvent pas être ajoutées à un conteneur existant." }
references:
  - title: az cosmosdb sql container
    url: https://learn.microsoft.com/en-us/cli/azure/cosmosdb/sql/container
  - title: Unique key constraints in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/unique-keys
