stem:
  en: You create the container with /tenantId as the partition key.
  fr: Vous créez le conteneur avec /tenantId comme clé de partition.
body:
  solution:
    en: |
      You create the container by using the following code:

      ```csharp
      ContainerProperties properties = new ContainerProperties(
          id: "activity",
          partitionKeyPath: "/tenantId");

      Container container = await database.CreateContainerIfNotExistsAsync(
          properties,
          ThroughputProperties.CreateAutoscaleThroughput(50000));
      ```
    fr: |
      Vous créez le conteneur à l'aide du code suivant :

      ```csharp
      ContainerProperties properties = new ContainerProperties(
          id: "activity",
          partitionKeyPath: "/tenantId");

      Container container = await database.CreateContainerIfNotExistsAsync(
          properties,
          ThroughputProperties.CreateAutoscaleThroughput(50000));
      ```
answer: { value: false }
explanation:
  correct:
    en: With a single-level key, all the items of a tenant share one partition key value and therefore one logical partition. A logical partition is limited to 20 GB, after which the service stops accepting new data for that value, so the large tenants would be blocked. Tenant queries would be efficient, but the size requirement is not met.
    fr: "Avec une clé à un seul niveau, tous les éléments d'un locataire partagent une même valeur de clé de partition, donc une seule partition logique. Une partition logique est limitée à 20 Go, au-delà desquels le service n'accepte plus de nouvelles données pour cette valeur : les locataires volumineux seraient bloqués. Les requêtes par locataire seraient efficaces, mais l'exigence de taille n'est pas satisfaite."
references:
  - title: Hierarchical Partition Keys - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
