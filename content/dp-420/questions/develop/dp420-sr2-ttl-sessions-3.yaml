id: dp420-sr2-ttl-sessions-3
objective: "1.2.5"
type: series_yesno
series: dp420-sr2-ttl-sessions
seriesOrder: 3
difficulty: 3
status: draft
stem:
  en: |
    You set a container default TTL of -1 and write session items with a ttl of 86,400.
  fr: |
    Vous définissez une durée de vie par défaut de -1 sur le conteneur et écrivez les éléments session avec un ttl de 86 400.
body:
  solution:
    en: |
      You set `DefaultTimeToLive` of the `sessions` container to **-1**. The application writes every session item with the following property and writes auditPin items without a `ttl` property.

      ```json
      { "ttl": 86400 }
      ```
    fr: |
      Vous définissez la propriété `DefaultTimeToLive` du conteneur `sessions` sur **-1**. L'application écrit chaque élément session avec la propriété suivante et écrit les éléments auditPin sans propriété `ttl`.

      ```json
      { "ttl": 86400 }
      ```
answer: { value: true }
explanation:
  correct:
    en: |
      A container default of -1 enables TTL without expiring items by default: only items that carry their own `ttl` expire. Session items therefore expire 86,400 seconds after their last modification and are deleted in the background, while auditPin items, which have no `ttl`, never expire.
    fr: |
      Une valeur par défaut de -1 sur le conteneur active la durée de vie sans faire expirer les éléments par défaut : seuls les éléments qui portent leur propre `ttl` expirent. Les éléments session expirent donc 86 400 secondes après leur dernière modification et sont supprimés en arrière-plan, tandis que les éléments auditPin, sans `ttl`, n'expirent jamais.
references:
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
