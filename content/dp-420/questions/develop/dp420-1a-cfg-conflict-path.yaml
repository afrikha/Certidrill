id: dp420-1a-cfg-conflict-path
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account with multi-region writes enabled in three regions. You are creating a container named **devices**. Each item contains a numeric `configVersion` property that devices increase every time they change their configuration.

    When the same item is updated concurrently in two regions, the version with the highest `configVersion` must be kept. The solution must not require any server-side code.

    How should you configure the conflict resolution policy of the container?
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL avec les écritures multirégions activées dans trois régions. Vous créez un conteneur nommé **devices**. Chaque élément contient une propriété numérique `configVersion` que les appareils incrémentent à chaque modification de leur configuration.

    Lorsque le même élément est mis à jour simultanément dans deux régions, la version dont la valeur `configVersion` est la plus élevée doit être conservée. La solution ne doit nécessiter aucun code côté serveur.

    Comment devez-vous configurer la stratégie de résolution des conflits du conteneur ?
body:
  options:
    - { id: a, text: { en: "Custom mode without a merge stored procedure, with conflicts read from the conflicts feed", fr: "Mode Custom sans procédure stockée de fusion, avec les conflits lus dans le flux des conflits" } }
    - { id: b, text: { en: "A unique key policy on /configVersion with the default Last Write Wins mode", fr: "Une stratégie de clé unique sur /configVersion avec le mode Last Write Wins par défaut" } }
    - { id: c, text: { en: "Last Write Wins mode with the conflict resolution path /configVersion", fr: "Mode Last Write Wins avec le chemin de résolution des conflits /configVersion" } }
    - { id: d, text: { en: "Last Write Wins mode with the default conflict resolution path /_ts", fr: "Mode Last Write Wins avec le chemin de résolution des conflits par défaut /_ts" } }
answer: { optionId: c }
explanation:
  correct:
    en: |
      In the API for NoSQL, Last Write Wins can use any custom numeric property as its conflict resolution path, and the item with the highest value wins. The service applies the rule itself, so no merge procedure or application logic is needed.
    fr: |
      Dans l'API for NoSQL, Last Write Wins peut utiliser n'importe quelle propriété numérique personnalisée comme chemin de résolution des conflits, et l'élément dont la valeur est la plus élevée l'emporte. Le service applique la règle lui-même : aucune procédure de fusion ni logique applicative n'est nécessaire.
  options:
    d: { en: "The default path keeps the write with the highest system timestamp, which isn't necessarily the highest configVersion.", fr: "Le chemin par défaut conserve l'écriture dont l'horodatage système est le plus élevé, qui n'a pas forcément la valeur configVersion la plus élevée." }
    a: { en: "Without a merge procedure, conflicts go to the conflicts feed and the application must resolve them itself.", fr: "Sans procédure de fusion, les conflits sont écrits dans le flux des conflits et l'application doit les résoudre elle-même." }
    b: { en: "A unique key prevents duplicate values in a logical partition; it doesn't choose a winner between concurrent updates.", fr: "Une clé unique empêche les doublons dans une partition logique ; elle ne choisit pas de gagnant entre des mises à jour simultanées." }
references:
  - title: Conflict Resolution Types and Resolution Policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
