id: dp420-1c-model-access-patterns-first
objective: "1.3.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso is moving the back end of a ticketing application from a relational database to Azure Cosmos DB for NoSQL. The team plans to redesign the data model rather than copy the existing tables one-to-one.

    The solution must minimize RU consumption for the operations that the application runs most often.

    What should the team do first?
  fr: |
    Contoso migre le back-end d'une application de billetterie d'une base de données relationnelle vers Azure Cosmos DB for NoSQL. L'équipe prévoit de reconcevoir le modèle de données plutôt que de recopier les tables existantes à l'identique.

    La solution doit réduire au minimum la consommation de RU des opérations que l'application exécute le plus souvent.

    Que doit faire l'équipe en premier ?
body:
  options:
    - { id: a, text: { en: "Normalize the tables to third normal form and create one container per table", fr: "Normaliser les tables en troisième forme normale et créer un conteneur par table" } }
    - { id: b, text: { en: "List the application's read and write operations with their frequency and filters", fr: "Lister les opérations de lecture et d'écriture de l'application avec leur fréquence et leurs filtres" } }
    - { id: c, text: { en: "Select the default consistency level of the account before creating containers", fr: "Sélectionner le niveau de cohérence par défaut du compte avant de créer les conteneurs" } }
    - { id: d, text: { en: "Provision autoscale throughput on the database and import the tables as they are", fr: "Approvisionner un débit avec mise à l'échelle automatique sur la base de données et importer les tables telles quelles" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      In Azure Cosmos DB, the data model and the partition keys are derived from the access patterns. You first list the requests the application must serve, how often and with which filters, and then design items and containers so that the frequent requests are point reads or single-partition queries.
    fr: |-
      Dans Azure Cosmos DB, le modèle de données et les clés de partition découlent des modèles d'accès. Vous listez d'abord les requêtes que l'application doit servir, à quelle fréquence et avec quels filtres, puis vous concevez les éléments et les conteneurs pour que les requêtes fréquentes soient des lectures ponctuelles ou des requêtes sur une seule partition.
  options:
    a:
      en: |-
        A one-to-one copy of a normalized schema forces several requests per read because Azure Cosmos DB has no joins across items or containers.
      fr: |-
        Une copie à l'identique d'un schéma normalisé impose plusieurs requêtes par lecture, car Azure Cosmos DB ne propose pas de jointure entre éléments ou entre conteneurs.
    c:
      en: |-
        The consistency level affects read cost and latency, but it does not define how items are modeled or partitioned.
      fr: |-
        Le niveau de cohérence influe sur le coût et la latence des lectures, mais il ne définit pas la façon de modéliser ou de partitionner les éléments.
    d:
      en: |-
        The throughput model does not fix a data model that ignores the access patterns; importing the tables as they are keeps the relational shape.
      fr: |-
        Le modèle de débit ne corrige pas un modèle de données qui ignore les modèles d'accès ; importer les tables telles quelles conserve la forme relationnelle.
references:
  - title: How to model and partition data using a real-world example
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/model-partition-example
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
