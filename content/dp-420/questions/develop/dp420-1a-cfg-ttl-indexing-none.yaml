id: dp420-1a-cfg-ttl-indexing-none
objective: "1.1.4"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Adatum uses an Azure Cosmos DB for NoSQL container named **sessions** as a key-value store. The application only performs point reads and upserts, and the indexing mode of the container is set to `none` to minimize write costs.

    You need every item to be deleted automatically seven days after its last modification. Write costs must remain as low as possible.

    What should you do?
  fr: |
    Adatum utilise un conteneur Azure Cosmos DB for NoSQL nommé **sessions** comme magasin clé-valeur. L'application effectue uniquement des lectures ponctuelles et des upserts, et le mode d'indexation du conteneur est défini sur `none` afin de réduire au minimum le coût des écritures.

    Chaque élément doit être supprimé automatiquement sept jours après sa dernière modification. Le coût des écritures doit rester aussi faible que possible.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set the indexing mode to consistent with the default /* included path, and then set the default TTL to 7.", fr: "Définir le mode d'indexation sur consistent avec le chemin inclus /* par défaut, puis définir la durée de vie par défaut sur 7." } }
    - { id: b, text: { en: "Set the indexing mode to consistent with /* as the only excluded path, and then set the default TTL to 604800.", fr: "Définir le mode d'indexation sur consistent avec /* comme seul chemin exclu, puis définir la durée de vie par défaut sur 604800." } }
    - { id: c, text: { en: "Keep the indexing mode set to none, and set the default TTL of the container to 604800.", fr: "Conserver le mode d'indexation none, et définir la durée de vie par défaut du conteneur sur 604800." } }
    - { id: d, text: { en: "Keep the indexing mode set to none, and add a ttl property of 604800 to each item.", fr: "Conserver le mode d'indexation none, et ajouter une propriété ttl de 604800 à chaque élément." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      TTL can't be activated on a container whose indexing mode is none. Using the consistent mode with no included path and /* excluded keeps write costs minimal while allowing TTL, and a default TTL of 604,800 seconds deletes items seven days after their last modification.
    fr: |
      La durée de vie ne peut pas être activée sur un conteneur dont le mode d'indexation est none. Le mode consistent sans chemin inclus et avec /* exclu garde un coût d'écriture minimal tout en autorisant la durée de vie, et une durée de vie par défaut de 604 800 secondes supprime les éléments sept jours après leur dernière modification.
  options:
    c: { en: "TTL can't be enabled while the indexing mode is none.", fr: "La durée de vie ne peut pas être activée tant que le mode d'indexation est none." }
    d: { en: "A per-item ttl only applies when TTL is enabled on the container, which requires an indexing mode other than none.", fr: "Une propriété ttl par élément ne s'applique que si la durée de vie est activée sur le conteneur, ce qui exige un mode d'indexation autre que none." }
    a: { en: "TTL values are in seconds, and indexing every path increases write costs.", fr: "Les valeurs de durée de vie s'expriment en secondes, et indexer tous les chemins augmente le coût des écritures." }
references:
  - title: Indexing policies in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/index-policy
