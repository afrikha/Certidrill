id: dp420-1e-copy-cross-account
objective: "1.4.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Woodgrove has two Azure Cosmos DB for NoSQL accounts in the same subscription: **cosmos-wg-legacy** and **cosmos-wg-core**. Both accounts meet the prerequisites for online container copy. Key-based authentication is disabled on **cosmos-wg-core**.

    You need to copy a container named **ledger** from **cosmos-wg-legacy** to an existing container in **cosmos-wg-core** by using a container copy job. The job must be able to write to the destination.

    You enable a system-assigned managed identity on **cosmos-wg-legacy** and set it as the default identity of the account.

    What should you do next?
  fr: |
    Woodgrove dispose de deux comptes Azure Cosmos DB for NoSQL dans le même abonnement : **cosmos-wg-legacy** et **cosmos-wg-core**. Les deux comptes remplissent les prérequis de la copie de conteneur en ligne. L'authentification par clé est désactivée sur **cosmos-wg-core**.

    Vous devez copier un conteneur nommé **ledger** de **cosmos-wg-legacy** vers un conteneur existant de **cosmos-wg-core** à l'aide d'une tâche de copie de conteneur. La tâche doit pouvoir écrire dans la destination.

    Vous activez une identité managée affectée par le système sur **cosmos-wg-legacy** et la définissez comme identité par défaut du compte.

    Que devez-vous faire ensuite ?
body:
  options:
    - id: a
      text: { en: "On cosmos-wg-legacy, assign the Cosmos DB Built-in Data Reader role to the identity of cosmos-wg-core.", fr: "Sur cosmos-wg-legacy, attribuer le rôle Cosmos DB Built-in Data Reader à l'identité de cosmos-wg-core." }
    - id: b
      text: { en: "On the resource group of cosmos-wg-core, assign the Contributor role to the identity of cosmos-wg-legacy.", fr: "Sur le groupe de ressources de cosmos-wg-core, attribuer le rôle Contributor à l'identité de cosmos-wg-legacy." }
    - id: c
      text: { en: "On cosmos-wg-core, assign the Cosmos DB Built-in Data Contributor role to the identity of cosmos-wg-legacy.", fr: "Sur cosmos-wg-core, attribuer le rôle Cosmos DB Built-in Data Contributor à l'identité de cosmos-wg-legacy." }
    - id: d
      text: { en: "On cosmos-wg-core, assign the Cosmos DB Account Reader Role to the identity of cosmos-wg-legacy.", fr: "Sur cosmos-wg-core, attribuer le rôle Cosmos DB Account Reader Role à l'identité de cosmos-wg-legacy." }
answer: { optionId: c }
explanation:
  correct:
    en: |
      For a copy between two accounts, the identity of the source account needs read-write access to the data of the destination account. You grant it with az cosmosdb sql role assignment create on the destination account, by using the data-plane role definition 00000000-0000-0000-0000-000000000002 (Cosmos DB Built-in Data Contributor) at the scope /.
    fr: |
      Pour une copie entre deux comptes, l'identité du compte source a besoin d'un accès en lecture-écriture aux données du compte de destination. Vous l'accordez avec az cosmosdb sql role assignment create sur le compte de destination, en utilisant la définition de rôle de plan de données 00000000-0000-0000-0000-000000000002 (Cosmos DB Built-in Data Contributor) à l'étendue /.
  options:
    a:
      en: |
        The permission goes in the wrong direction and is read-only; it is the source identity that must write to the destination.
      fr: |
        L'autorisation va dans le mauvais sens et n'accorde que la lecture ; c'est l'identité source qui doit écrire dans la destination.
    b:
      en: |
        Contributor is an Azure RBAC control-plane role; it grants no data-plane access to items, which is required when keys are disabled.
      fr: |
        Contributor est un rôle Azure RBAC du plan de contrôle ; il n'accorde aucun accès de plan de données aux éléments, ce qui est requis quand les clés sont désactivées.
    d:
      en: |
        Cosmos DB Account Reader Role is a control-plane role that reads account settings; it cannot write items.
      fr: |
        Cosmos DB Account Reader Role est un rôle du plan de contrôle qui lit les paramètres du compte ; il ne permet pas d'écrire des éléments.
references:
  - title: Create and Manage Intra-account Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-container-copy
