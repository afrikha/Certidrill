series: dp420-sr1-stock-overwrite
seriesOrder: 1
difficulty: 1
status: draft
stem:
  en: You change the default consistency level of the account to Strong.
  fr: Vous définissez le niveau de cohérence par défaut du compte sur Strong.
body:
  solution:
    en: |
      You change the default consistency level of the account from **Session** to **Strong**. You keep the existing `ReadItemAsync` and `ReplaceItemAsync` calls of the worker unchanged.
    fr: |
      Vous faites passer le niveau de cohérence par défaut du compte de **Session** à **Strong**. Vous conservez sans modification les appels `ReadItemAsync` et `ReplaceItemAsync` existants du worker.
answer: { value: false }
explanation:
  correct:
    en: A consistency level only defines which version of the data a read can return across replicas and regions. It does not make the service check whether an item changed between a client's read and its write, so two instances can still read the same version and the last replace silently overwrites the other change. Rejecting stale writes requires optimistic concurrency control with the item's `_etag` sent in an If-Match condition.
    fr: "Un niveau de cohérence définit uniquement la version des données qu'une lecture peut renvoyer entre les réplicas et les régions. Il ne fait pas vérifier par le service si un élément a changé entre la lecture et l'écriture d'un client : deux instances peuvent toujours lire la même version, et le dernier remplacement écrase silencieusement l'autre modification. Rejeter les écritures obsolètes exige le contrôle de concurrence optimiste, avec la valeur `_etag` de l'élément envoyée dans une condition If-Match."
references:
  - title: Database Transactions and Optimistic Concurrency Control - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/database-transactions-optimistic-concurrency
