id: dp420-1d-avad-blockers
objective: "1.4.4"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Contoso plans to read the change feed of several Azure Cosmos DB for NoSQL accounts in all versions and deletes mode. For each account, you review the configuration before enabling the feature.

    Which two conditions prevent an account from using all versions and deletes mode as it is configured today?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de lire le flux de modification de plusieurs comptes Azure Cosmos DB for NoSQL en mode toutes les versions et suppressions. Pour chaque compte, vous examinez la configuration avant d'activer la fonctionnalité.

    Quelles sont les deux conditions qui empêchent un compte d'utiliser le mode toutes les versions et suppressions dans sa configuration actuelle ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "The applications connect in Direct mode.", fr: "Les applications se connectent en mode Direct." } }
    - { id: b, text: { en: "The account has multiple write regions.", fr: "Le compte a plusieurs régions d'écriture." } }
    - { id: c, text: { en: "The account uses the periodic backup mode.", fr: "Le compte utilise le mode de sauvegarde périodique." } }
    - { id: d, text: { en: "The containers have a default time to live.", fr: "Les conteneurs ont une durée de vie par défaut." } }
    - { id: e, text: { en: "The account has merged a partition in the past.", fr: "Le compte a fusionné une partition par le passé." } }
answer: { optionIds: [ c, e ] }
explanation:
  correct:
    en: |
      All versions and deletes mode requires continuous backup, so an account that uses periodic backup must be changed first. Accounts that have ever merged a partition, or that currently have partition merge enabled, are not supported.
    fr: |
      Le mode toutes les versions et suppressions nécessite la sauvegarde continue : un compte qui utilise la sauvegarde périodique doit d'abord être modifié. Les comptes qui ont déjà fusionné une partition, ou dont la fusion de partitions est actuellement activée, ne sont pas pris en charge.
  options:
    b: { en: "With multiple write regions, all versions and deletes mode captures all changes; it is not a limitation.", fr: "Avec plusieurs régions d'écriture, le mode toutes les versions et suppressions capture toutes les modifications ; ce n'est pas une limitation." }
    d: { en: "TTL is compatible with the mode, which also captures TTL expirations.", fr: "La durée de vie est compatible avec ce mode, qui capture aussi les expirations TTL." }
    a: { en: "The connection mode does not matter: change feed requests in this mode always use Gateway mode.", fr: "Le mode de connexion importe peu : les requêtes du flux de modification dans ce mode utilisent toujours le mode Gateway." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
  - title: Work with the Change Feed - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed
