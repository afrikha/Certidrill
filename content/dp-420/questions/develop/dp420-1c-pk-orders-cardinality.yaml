id: dp420-1c-pk-orders-cardinality
objective: "1.3.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware stores customer orders in an Azure Cosmos DB for NoSQL container. The application has 3 million customers. Most requests list or update the orders of one customer, and a customer rarely has more than a few hundred orders. Each order has one of five status values.

    You need to choose the partition key of the container.

    Which partition key should you use?
  fr: |
    Proseware stocke les commandes clients dans un conteneur Azure Cosmos DB for NoSQL. L'application compte 3 millions de clients. La plupart des requêtes listent ou mettent à jour les commandes d'un client, et un client a rarement plus de quelques centaines de commandes. Chaque commande a l'une de cinq valeurs de statut.

    Vous devez choisir la clé de partition du conteneur.

    Quelle clé de partition devez-vous utiliser ?
body:
  options:
    - { id: a, text: /customerId }
    - { id: b, text: /orderDate }
    - { id: c, text: /status }
    - { id: d, text: /country }
answer: { optionId: a }
explanation:
  correct:
    en: |-
      /customerId has a very high cardinality, spreads storage and requests evenly, and appears in the equality filter of most requests, so those requests are single-partition. No customer comes close to the 20 GB logical partition limit.
    fr: |-
      /customerId a une cardinalité très élevée, répartit uniformément le stockage et les requêtes, et figure dans le filtre d'égalité de la plupart des requêtes, qui portent donc sur une seule partition. Aucun client n'approche la limite de 20 Go par partition logique.
  options:
    c:
      en: |-
        Five values create five huge logical partitions that become hot and can reach the 20 GB limit.
      fr: |-
        Cinq valeurs créent cinq énormes partitions logiques qui deviennent chaudes et peuvent atteindre la limite de 20 Go.
    b:
      en: |-
        All new orders of a day share the same value, which concentrates the writes on one partition, and per-customer requests become cross-partition.
      fr: |-
        Toutes les nouvelles commandes d'une journée partagent la même valeur, ce qui concentre les écritures sur une partition, et les requêtes par client deviennent des requêtes entre partitions.
    d:
      en: |-
        Countries have low cardinality and uneven sizes, and the frequent per-customer requests would not be scoped to one logical partition.
      fr: |-
        Les pays ont une cardinalité faible et des tailles inégales, et les requêtes fréquentes par client ne seraient pas limitées à une partition logique.
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
