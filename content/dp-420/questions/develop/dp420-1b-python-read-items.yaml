id: dp420-1b-python-read-items
objective: "1.2.2"
type: single
difficulty: 2
status: draft
stem:
  en: |
    A Python service uses the `azure-cosmos` SDK to load the shopping carts of 20 users from an Azure Cosmos DB for NoSQL container. It calls `container.read_items()` with a list of 20 `(id, partition_key)` tuples. Three of the carts were deleted earlier.

    What does the call return?
  fr: |
    Un service Python utilise le SDK `azure-cosmos` pour charger les paniers de 20 utilisateurs depuis un conteneur Azure Cosmos DB for NoSQL. Il appelle `container.read_items()` avec une liste de 20 tuples `(id, partition_key)`. Trois des paniers ont été supprimés auparavant.

    Que renvoie l'appel ?
body:
  options:
    - { id: a, text: { en: "A list of 20 entries, with None for each deleted cart", fr: "Une liste de 20 entrées, avec None pour chaque panier supprimé" } }
    - { id: b, text: { en: "Nothing, because the call raises CosmosResourceNotFoundError", fr: "Rien, car l'appel lève CosmosResourceNotFoundError" } }
    - { id: c, text: { en: "A list of the 17 existing carts, in no guaranteed order", fr: "Une liste des 17 paniers existants, dans un ordre non garanti" } }
    - { id: d, text: { en: "A list of the 17 existing carts, in the order of the input tuples", fr: "Une liste des 17 paniers existants, dans l'ordre des tuples d'entrée" } }
answer: { optionId: c }
explanation:
  correct:
    en: "read_items performs a read-many operation from (id, partition key) tuples. Items that are not found are omitted from the returned list, and the order of the results is not guaranteed, so the code must match carts by id."
    fr: "read_items effectue une opération de lecture multiple à partir de tuples (id, clé de partition). Les éléments introuvables sont omis de la liste renvoyée, et l'ordre des résultats n'est pas garanti : le code doit associer les paniers par id."
  options:
    d: { en: "The SDK documents that results have no guaranteed order.", fr: "Le SDK indique que les résultats n'ont pas d'ordre garanti." }
    a: { en: "Missing items are omitted; no placeholder is returned.", fr: "Les éléments absents sont omis ; aucune valeur de remplacement n'est renvoyée." }
    b: { en: "Missing items do not make read_items fail; they are simply left out.", fr: "Les éléments absents ne font pas échouer read_items ; ils sont simplement omis." }
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
