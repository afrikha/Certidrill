id: dp420-1a-cfg-account-yn
objective: "1.1.4"
type: yesno_statements
difficulty: 2
status: draft
stem:
  en: |
    Proseware is defining the account-level settings of new Azure Cosmos DB for NoSQL accounts for development, testing and production. The subscription doesn't contain any Azure Cosmos DB account yet.

    For each of the following statements, select **Yes** if the statement is true. Otherwise, select **No**.

    NOTE: Each correct selection is worth one point.
  fr: |
    Proseware définit les paramètres au niveau du compte de nouveaux comptes Azure Cosmos DB for NoSQL de développement, de test et de production. L'abonnement ne contient encore aucun compte Azure Cosmos DB.

    Pour chacune des affirmations suivantes, sélectionnez **Oui** si l'affirmation est vraie. Sinon, sélectionnez **Non**.

    Remarque : chaque sélection correcte vaut un point.
body:
  statements:
    - id: s1
      text:
        en: Only one account in the subscription can use the free tier.
        fr: Un seul compte de l'abonnement peut utiliser le niveau gratuit.
    - id: s2
      text:
        en: After an account is migrated from periodic to continuous backup, you can switch it back to periodic backup.
        fr: Après la migration d'un compte de la sauvegarde périodique vers la sauvegarde continue, vous pouvez le refaire passer en sauvegarde périodique.
    - id: s3
      text:
        en: A serverless account can be extended to a second Azure region after it is created.
        fr: Un compte serverless peut être étendu à une deuxième région Azure après sa création.
answer:
  values: { s1: true, s2: false, s3: false }
explanation:
  correct:
    en: |
      Each Azure subscription can have one free tier account, which offers 1,000 RU/s and 25 GB of storage for free. Migrating from periodic to continuous backup is one-way. A serverless account runs in a single region, and you can't add regions to it after creation.
    fr: |
      Chaque abonnement Azure peut avoir un compte au niveau gratuit, qui offre gratuitement 1 000 RU/s et 25 Go de stockage. La migration de la sauvegarde périodique vers la sauvegarde continue est à sens unique. Un compte serverless s'exécute dans une seule région, et vous ne pouvez pas lui ajouter de régions après sa création.
references:
  - title: Service Quotas and Default Limits - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/concepts-limits
  - title: Online backup and on-demand data restore in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/online-backup-and-restore
