id: dp420-1d-autoscale-billing
objective: "1.3.8"
type: dropdown
difficulty: 3
status: draft
shuffle: false
stem:
  en: |
    Woodgrove evaluates autoscale throughput for an Azure Cosmos DB for NoSQL container in an account that has a single write region and one region. Dynamic scaling is not used. The planned autoscale maximum is 20,000 RU/s.

    During a test, the highest throughput used was 1,200 RU/s in hour 1 and 14,500 RU/s in hour 2. Over the last 30 days, the average of the highest normalized RU consumption of each hour is 48%.

    How should you complete the cost analysis? Select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Woodgrove évalue le débit avec mise à l'échelle automatique pour un conteneur Azure Cosmos DB for NoSQL dans un compte qui a une seule région d'écriture et une seule région. La mise à l'échelle dynamique n'est pas utilisée. Le maximum de mise à l'échelle automatique prévu est de 20 000 RU/s.

    Pendant un test, le débit le plus élevé utilisé a été de 1 200 RU/s pendant l'heure 1 et de 14 500 RU/s pendant l'heure 2. Sur les 30 derniers jours, la moyenne de la consommation de RU normalisée la plus élevée de chaque heure est de 48 %.

    Comment devez-vous compléter l'analyse des coûts ? Sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: text
  template:
    en: |
      For hour 1, the container is billed for [[h1]].

      Each autoscale RU/s is billed at [[rate]] the standard (manual) rate per RU/s.

      Based on the 30-day history, you should use [[mode]].
    fr: |
      Pour l'heure 1, le conteneur est facturé pour [[h1]].

      Chaque RU/s en mise à l'échelle automatique est facturée à [[rate]] le tarif standard (manuel) par RU/s.

      D'après l'historique de 30 jours, vous devez utiliser [[mode]].
  slots:
    - id: h1
      options:
        - { id: h1a, text: "1,200 RU/s" }
        - { id: h1b, text: "2,000 RU/s" }
        - { id: h1c, text: "14,500 RU/s" }
        - { id: h1d, text: "20,000 RU/s" }
    - id: rate
      options:
        - { id: r05, text: { en: "0.5 times", fr: "0,5 fois" } }
        - { id: r10, text: { en: "1 times (the same as)", fr: "1 fois (le même que)" } }
        - { id: r15, text: { en: "1.5 times", fr: "1,5 fois" } }
        - { id: r20, text: { en: "2 times", fr: "2 fois" } }
    - id: mode
      options:
        - { id: mauto, text: { en: "autoscale throughput", fr: "le débit avec mise à l'échelle automatique" } }
        - { id: mman, text: { en: "standard (manual) throughput", fr: "le débit standard (manuel)" } }
        - { id: meq, text: { en: "either type, because both cost the same", fr: "l'un ou l'autre type, car les deux coûtent autant" } }
answer:
  values: { h1: h1b, rate: r15, mode: mauto }
explanation:
  correct:
    en: |
      Autoscale scales between 10% of the maximum and the maximum, so a 20,000 RU/s maximum never bills less than 2,000 RU/s per hour, even when only 1,200 RU/s are used. In a single write region account, the autoscale rate per RU/s is 1.5 times the standard rate. When the average of the hourly highest utilization is below 66%, autoscale is estimated to cost less than provisioning the same maximum manually.
    fr: |
      La mise à l'échelle automatique varie entre 10 % du maximum et le maximum ; un maximum de 20 000 RU/s ne facture donc jamais moins de 2 000 RU/s par heure, même si seules 1 200 RU/s sont utilisées. Dans un compte à une seule région d'écriture, le tarif par RU/s en mise à l'échelle automatique vaut 1,5 fois le tarif standard. Lorsque la moyenne de l'utilisation horaire maximale est inférieure à 66 %, la mise à l'échelle automatique est estimée moins coûteuse que le provisionnement manuel du même maximum.
  options:
    h1a: { en: "Autoscale bills the highest RU/s scaled to in the hour, and it never scales below 10% of the maximum.", fr: "La mise à l'échelle automatique facture les RU/s les plus élevées atteintes dans l'heure, et elle ne descend jamais sous 10 % du maximum." }
    r10: { en: "The same rate applies only to accounts with multiple write regions.", fr: "Le même tarif ne s'applique qu'aux comptes à plusieurs régions d'écriture." }
    meq: { en: "Both types cost about the same only around 66% average utilization.", fr: "Les deux types ne coûtent à peu près autant qu'autour de 66 % d'utilisation moyenne." }
    mman: { en: "Manual throughput is estimated to be cheaper only when the average hourly utilization is above 66%.", fr: "Le débit manuel n'est estimé moins coûteux que lorsque l'utilisation horaire moyenne dépasse 66 %." }
references:
  - title: How to Choose Between Manual and Autoscale - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-choose-offer
  - title: Create Containers and Databases with Autoscale Throughput - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/provision-throughput-autoscale
