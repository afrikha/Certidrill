id: dp420-1b-patch-benefits
objective: "1.2.3"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso's mobile app updates one or two properties of large user documents (about 200 KB each) many times a day. Today, the .NET backend reads each document, modifies it in memory and calls `ReplaceItemAsync`. The Azure Cosmos DB for NoSQL account uses multi-region writes.

    You plan to use `PatchItemAsync` instead. Which two statements describe benefits of this change?

    NOTE: Each correct selection is worth one point.
  fr: |
    L'application mobile de Contoso met à jour une ou deux propriétés de documents utilisateur volumineux (environ 200 Ko chacun) de nombreuses fois par jour. Aujourd'hui, le back-end .NET lit chaque document, le modifie en mémoire et appelle `ReplaceItemAsync`. Le compte Azure Cosmos DB for NoSQL utilise les écritures multirégions.

    Vous prévoyez d'utiliser `PatchItemAsync` à la place. Quelles sont les deux affirmations qui décrivent des avantages de ce changement ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Concurrent patches from two regions that change different paths of the same document are merged automatically.", fr: "Des patchs simultanés provenant de deux régions qui modifient des chemins différents d'un même document sont fusionnés automatiquement." } }
    - { id: b, text: { en: "The change feed delivers only the patched properties instead of the full document.", fr: "Le flux de modifications ne fournit que les propriétés modifiées par le patch au lieu du document complet." } }
    - { id: c, text: { en: "One patch request can update documents in several logical partitions atomically.", fr: "Une requête de patch peut mettre à jour de façon atomique des documents de plusieurs partitions logiques." } }
    - { id: d, text: { en: "A patch can update system properties such as _etag to control concurrency.", fr: "Un patch peut mettre à jour des propriétés système comme _etag pour contrôler la concurrence." } }
    - { id: e, text: { en: "The backend sends only the changed properties, which reduces network bandwidth and client CPU usage.", fr: "Le back-end n'envoie que les propriétés modifiées, ce qui réduit la bande passante réseau et l'utilisation du processeur du client." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: "With patch, the client sends only the operations to apply, which saves bandwidth, latency and client CPU compared with a read-modify-replace cycle. With multi-region writes, patch conflicts are resolved at the path level, so concurrent patches to non-conflicting paths are merged automatically."
    fr: "Avec le patch, le client n'envoie que les opérations à appliquer, ce qui économise bande passante, latence et processeur client par rapport à un cycle lecture-modification-remplacement. Avec les écritures multirégions, les conflits de patch sont résolus au niveau du chemin : des patchs simultanés sur des chemins sans conflit sont fusionnés automatiquement."
  options:
    b: { en: "The change feed returns the full document, even when the change came from a patch.", fr: "Le flux de modifications renvoie le document complet, même quand la modification provient d'un patch." }
    c: { en: "A single-document patch targets one item; a multi-document patch must stay in one partition key within a transactional batch.", fr: "Un patch sur un seul document cible un élément ; un patch multi-documents doit rester dans une clé de partition au sein d'un lot transactionnel." }
    d: { en: "System properties such as _etag, _ts and _rid cannot be modified with patch.", fr: "Les propriétés système comme _etag, _ts et _rid ne peuvent pas être modifiées par un patch." }
references:
  - title: Partial Document Update - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partial-document-update
