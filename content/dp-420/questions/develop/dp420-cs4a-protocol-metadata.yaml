id: dp420-cs4a-protocol-metadata
objective: "1.3.3"
type: single
caseStudy: dp420-cs4a-lamna-healthcare
difficulty: 1
status: draft
stem:
  en: You need to design how the protocol title and version are stored to meet the retrieval requirements. What should you do?
  fr: Vous devez concevoir la façon dont le titre et la version des protocoles sont stockés pour satisfaire les exigences de recherche. Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Store the title and version in one item per protocol, and read that item with a point read for each search result", fr: "Stocker le titre et la version dans un élément par protocole, et lire cet élément par une lecture ponctuelle pour chaque résultat de recherche" } }
    - { id: b, text: { en: "Store all the chunks of a protocol as an array inside one protocol item that contains the title and version", fr: "Stocker tous les segments d'un protocole dans un tableau à l'intérieur d'un élément de protocole qui contient le titre et la version" } }
    - { id: c, text: { en: "Store the title and version in a separate container, and query it with the protocolId values of the results", fr: "Stocker le titre et la version dans un conteneur distinct, et l'interroger avec les valeurs protocolId des résultats" } }
    - { id: d, text: { en: "Copy the title and version into every chunk item of the protocol when the chunks are written", fr: "Copier le titre et la version dans chaque élément de segment du protocole lors de l'écriture des segments" } }
answer: { optionId: d }
explanation:
  correct:
    en: Embedding (denormalizing) the title and version in each chunk returns them with the search result itself, so no other request is needed. Denormalization suits data that is queried together and changes infrequently; here the title of a published version never changes, so the copies never have to be updated.
    fr: Incorporer (dénormaliser) le titre et la version dans chaque segment les renvoie avec le résultat de recherche lui-même, sans autre requête. La dénormalisation convient aux données interrogées ensemble et rarement modifiées ; ici, le titre d'une version publiée ne change jamais, donc les copies n'ont jamais à être mises à jour.
  options:
    a: { en: "A point read per result is an additional request to Azure Cosmos DB, which the requirement forbids.", fr: "Une lecture ponctuelle par résultat est une requête supplémentaire vers Azure Cosmos DB, ce que l'exigence interdit." }
    b: { en: "Up to 300 chunks with 1,536-dimension embeddings in one item would exceed the 2 MB maximum item size, and a search must rank individual chunks.", fr: "Jusqu'à 300 segments avec des embeddings de 1 536 dimensions dans un seul élément dépasseraient la taille maximale de 2 Mo par élément, et une recherche doit classer des segments individuels." }
    c: { en: "Querying another container is an additional request to Azure Cosmos DB.", fr: "Interroger un autre conteneur est une requête supplémentaire vers Azure Cosmos DB." }
references:
  - title: Data modeling in Azure Cosmos DB for NoSQL
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/modeling-data
