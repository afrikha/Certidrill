id: dp420-1c-impact-low-cardinality-issues
objective: "1.3.4"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Contoso plans to store 500 GB of shipment items in an Azure Cosmos DB for NoSQL container partitioned by `/country`. Shipments come from 40 countries, and two of them produce 70 percent of the writes. Most queries filter on a single country.

    Which two issues will this design cause as the workload grows?

    NOTE: Each correct selection is worth one point.
  fr: |
    Contoso prévoit de stocker 500 Go d'expéditions dans un conteneur Azure Cosmos DB for NoSQL partitionné par `/country`. Les expéditions proviennent de 40 pays, dont deux produisent 70 % des écritures. La plupart des requêtes filtrent sur un seul pays.

    Quels sont les deux problèmes que cette conception provoquera à mesure que la charge de travail augmentera ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "Writes for the two busiest countries are rate-limited while other partitions have unused throughput.", fr: "Les écritures des deux pays les plus actifs sont limitées alors que d'autres partitions ont du débit inutilisé." } }
    - { id: b, text: { en: "Queries that filter on a single country fan out to every physical partition.", fr: "Les requêtes qui filtrent sur un seul pays sont diffusées vers toutes les partitions physiques." } }
    - { id: c, text: { en: "New items cannot be written for a country once its items reach 20 GB.", fr: "Plus aucun élément ne peut être écrit pour un pays une fois que ses éléments atteignent 20 Go." } }
    - { id: d, text: { en: "The container cannot be provisioned with more than 10,000 RU/s in total.", fr: "Le conteneur ne peut pas recevoir plus de 10 000 RU/s au total." } }
    - { id: e, text: { en: "Point reads cost twice as many RUs as in a container partitioned by /id.", fr: "Les lectures ponctuelles coûtent deux fois plus de RU que dans un conteneur partitionné par /id." } }
answer: { optionIds: [ a, c ] }
explanation:
  correct:
    en: |-
      Forty values with a heavy skew create hot partitions; each country is a logical partition limited to 10,000 RU/s and 20 GB, so the busiest countries are throttled while the rest of the throughput is idle. With about 500 GB and two countries producing most of the data, those logical partitions will reach the 20 GB limit and stop accepting writes.
    fr: |-
      Quarante valeurs fortement déséquilibrées créent des partitions chaudes ; chaque pays est une partition logique limitée à 10 000 RU/s et 20 Go : les pays les plus actifs sont limités pendant que le reste du débit est inutilisé. Avec environ 500 Go et deux pays qui produisent l'essentiel des données, ces partitions logiques atteindront la limite de 20 Go et n'accepteront plus d'écritures.
  options:
    b: { en: "A filter on the partition key routes the query to the physical partition that holds that country.", fr: "Un filtre sur la clé de partition route la requête vers la partition physique qui contient ce pays." }
    d: { en: "The container total is not capped at 10,000 RU/s; that limit applies to one partition.", fr: "Le total du conteneur n'est pas plafonné à 10 000 RU/s ; cette limite s'applique à une partition." }
    e: { en: "A point read of a 1 KB item costs about 1 RU whatever the partition key.", fr: "Une lecture ponctuelle d'un élément de 1 Ko coûte environ 1 RU, quelle que soit la clé de partition." }
references:
  - title: Partitioning and horizontal scaling in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/partitioning-overview
