id: dp420-1b-python-by-page
objective: "1.2.1"
type: dropdown
difficulty: 3
status: draft
stem:
  en: |
    Northwind builds a telemetry API in Python with the `azure-cosmos` SDK. The **readings** container in Azure Cosmos DB for NoSQL is partitioned by `/deviceId`.

    Each API call returns at most 50 readings of one device that are more recent than a timestamp. The client sends back an opaque token named `request_token` (`None` on the first call) to get the next page, and the API returns the token to use for the following call. The query must use parameters.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind développe une API de télémétrie en Python avec le SDK `azure-cosmos`. Le conteneur **readings** d'Azure Cosmos DB for NoSQL est partitionné par `/deviceId`.

    Chaque appel de l'API renvoie au plus 50 relevés d'un appareil, plus récents qu'un horodatage. Le client renvoie un jeton opaque nommé `request_token` (`None` au premier appel) pour obtenir la page suivante, et l'API renvoie le jeton à utiliser pour l'appel suivant. La requête doit utiliser des paramètres.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: python
  template: |
    pager = container.query_items(
        query="SELECT * FROM r WHERE r.deviceId = @deviceId AND r.ts > @since",
        [[params]],
        partition_key=device_id,
        max_item_count=50,
    ).by_page([[token]])

    page = list(next(pager))
    next_token = pager.[[attr]]
  slots:
    - id: params
      options:
        - { id: list, text: 'parameters=[{"name": "@deviceId", "value": device_id}, {"name": "@since", "value": since}]' }
        - { id: dict, text: 'parameters={"@deviceId": device_id, "@since": since}' }
        - { id: tuples, text: 'parameters=[("@deviceId", device_id), ("@since", since)]' }
    - id: token
      options:
        - { id: cont, text: continuation_token=request_token }
        - { id: session, text: session_token=request_token }
        - { id: etag, text: etag=request_token }
    - id: attr
      options:
        - { id: cont, text: continuation_token }
        - { id: session, text: session_token }
        - { id: etag, text: etag }
answer:
  values: { params: list, token: cont, attr: cont }
explanation:
  correct:
    en: "`query_items` expects `parameters` as a list of dictionaries with `name` and `value` keys. `by_page(continuation_token=...)` returns an iterator of pages that starts after the token, or at the beginning when the token is `None`. After a page is read, the pager's `continuation_token` holds the bookmark for the next page."
    fr: "`query_items` attend `parameters` sous forme de liste de dictionnaires avec les clés `name` et `value`. `by_page(continuation_token=...)` renvoie un itérateur de pages qui démarre après le jeton, ou au début quand le jeton vaut `None`. Après la lecture d'une page, le `continuation_token` du pager contient le signet de la page suivante."
  options:
    dict: { en: "A dictionary of names to values is not the documented format; each parameter is a dict with name and value.", fr: "Un dictionnaire noms-valeurs n'est pas le format documenté ; chaque paramètre est un dict avec name et value." }
    tuples: { en: "Tuples are not the documented format; each parameter is a dict with name and value.", fr: "Des tuples ne sont pas le format documenté ; chaque paramètre est un dict avec name et value." }
    session: { en: "A session token concerns session consistency, not the position in a query's results.", fr: "Un jeton de session concerne la cohérence de session, pas la position dans les résultats d'une requête." }
    etag: { en: "An ETag identifies the version of an item; it is not a query bookmark.", fr: "Un ETag identifie la version d'un élément ; ce n'est pas un signet de requête." }
references:
  - title: azure.cosmos.ContainerProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.containerproxy
  - title: azure.core.paging.ItemPaged class
    url: https://learn.microsoft.com/en-us/python/api/azure-core/azure.core.paging.itempaged
