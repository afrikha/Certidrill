id: dp420-1b-patch-counter-concurrency
objective: "1.2.6"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Proseware counts the likes of each video in a `likes` property of the video item in Azure Cosmos DB for NoSQL. During live events, thousands of .NET clients like the same video every second. The current code reads the item, increments `likes` in memory and replaces the item with an `IfMatchEtag` condition, and most requests end in 412 errors and retries.

    No like may be lost. You need to minimize retries and RU consumption.

    What should you do?
  fr: |
    Proseware compte les mentions J'aime de chaque vidéo dans une propriété `likes` de l'élément vidéo dans Azure Cosmos DB for NoSQL. Pendant les événements en direct, des milliers de clients .NET aiment la même vidéo chaque seconde. Le code actuel lit l'élément, incrémente `likes` en mémoire et remplace l'élément avec une condition `IfMatchEtag`, et la plupart des requêtes se terminent par des erreurs 412 et de nouvelles tentatives.

    Aucune mention J'aime ne doit être perdue. Vous devez réduire au minimum les nouvelles tentatives et la consommation de RU.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Keep the read, and save the item with UpsertItemAsync without an ETag condition.", fr: "Conserver la lecture, et enregistrer l'élément avec UpsertItemAsync sans condition ETag." } }
    - { id: b, text: { en: "Keep the conditional read-and-replace code, and set the account's default consistency level to Strong.", fr: "Conserver le code de lecture et de remplacement conditionnel, et passer le niveau de cohérence par défaut du compte à Strong." } }
    - { id: c, text: { en: "Call PatchItemAsync with PatchOperation.Set(\"/likes\", likes + 1), after reading the item.", fr: "Appeler PatchItemAsync avec PatchOperation.Set(\"/likes\", likes + 1), après avoir lu l'élément." } }
    - { id: d, text: { en: "Call PatchItemAsync with PatchOperation.Increment(\"/likes\", 1), without reading the item.", fr: "Appeler PatchItemAsync avec PatchOperation.Increment(\"/likes\", 1), sans lire l'élément." } }
answer: { optionId: d }
explanation:
  correct:
    en: "An Increment patch operation adds the value on the server, inside the item's transaction, so concurrent increments do not overwrite each other. The client sends no read and needs no ETag condition, which removes the 412 retries."
    fr: "Une opération de patch Increment ajoute la valeur côté serveur, dans la transaction de l'élément : des incréments simultanés ne s'écrasent pas. Le client n'effectue aucune lecture et n'a besoin d'aucune condition ETag, ce qui supprime les nouvelles tentatives sur 412."
  options:
    a: { en: "Without an ETag condition, concurrent writers that read the same value overwrite each other and likes are lost.", fr: "Sans condition ETag, des processus simultanés qui lisent la même valeur s'écrasent mutuellement et des mentions J'aime sont perdues." }
    b: { en: "Strong consistency doubles read costs and does not stop concurrent read-modify-write cycles from conflicting.", fr: "La cohérence Strong double le coût des lectures et n'empêche pas les conflits entre cycles lecture-modification-écriture simultanés." }
    c: { en: "Set writes a value computed by the client from a possibly stale read, so concurrent likes are lost.", fr: "Set écrit une valeur calculée par le client à partir d'une lecture peut-être obsolète : des mentions J'aime simultanées sont perdues." }
