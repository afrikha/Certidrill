id: dp420-1b-ops-dragdrop
objective: "1.2.4"
type: dragdrop
difficulty: 1
status: draft
stem:
  en: |
    Northwind's .NET services use an Azure Cosmos DB for NoSQL container partitioned by `/accountId`.

    Which approach should you use for each requirement? To answer, drag the appropriate approaches to the correct requirements. Each approach may be used once or not at all.

    NOTE: Each correct selection is worth one point.
  fr: |
    Les services .NET de Northwind utilisent un conteneur Azure Cosmos DB for NoSQL partitionné par `/accountId`.

    Quelle approche devez-vous utiliser pour chaque exigence ? Pour répondre, faites glisser les approches appropriées vers les exigences correspondantes. Chaque approche peut être utilisée une fois ou pas du tout.

    Remarque : chaque sélection correcte vaut un point.
body:
  reuse: false
  items:
    - { id: bulk, text: { en: "Bulk execution (AllowBulkExecution)", fr: "Exécution en bloc (AllowBulkExecution)" } }
    - { id: batch, text: { en: "Transactional batch (TransactionalBatch)", fr: "Lot transactionnel (TransactionalBatch)" } }
    - { id: many, text: { en: "Read many (ReadManyItemsAsync)", fr: "Lecture multiple (ReadManyItemsAsync)" } }
    - { id: patch, text: { en: "Partial document update (PatchItemAsync)", fr: "Mise à jour partielle de document (PatchItemAsync)" } }
    - { id: pull, text: { en: "Change feed pull model", fr: "Modèle d'extraction du flux de modifications" } }
  targets:
    - { id: t1, text: { en: "Load 5 million independent items for thousands of accounts as fast as the provisioned throughput allows", fr: "Charger 5 millions d'éléments indépendants pour des milliers de comptes aussi vite que le débit approvisionné le permet" } }
    - { id: t2, text: { en: "Create an invoice and mark the related shipment of the same account as invoiced, both or neither", fr: "Créer une facture et marquer comme facturée l'expédition associée du même compte, les deux ou aucune" } }
    - { id: t3, text: { en: "Retrieve 30 items of different accounts whose id and accountId are known, in one call", fr: "Récupérer en un seul appel 30 éléments de comptes différents dont l'id et l'accountId sont connus" } }
    - { id: t4, text: { en: "Increase a counter in one item without sending the whole item", fr: "Augmenter un compteur dans un élément sans envoyer l'élément entier" } }
answer:
  mapping: { t1: bulk, t2: batch, t3: many, t4: patch }
explanation:
  correct:
    en: "Bulk execution groups many concurrent, independent operations to maximize throughput. A transactional batch makes several operations on one partition key atomic. ReadManyItemsAsync fetches many items from their id and partition key pairs. Patch sends only the operations to apply, such as an increment. The change feed pull model reads changes; it does not meet any of these requirements."
    fr: "L'exécution en bloc regroupe de nombreuses opérations simultanées et indépendantes pour maximiser le débit. Un lot transactionnel rend atomiques plusieurs opérations sur une même clé de partition. ReadManyItemsAsync récupère de nombreux éléments à partir de leurs paires id et clé de partition. Le patch n'envoie que les opérations à appliquer, comme un incrément. Le modèle d'extraction du flux de modifications lit les modifications ; il ne répond à aucune de ces exigences."
references:
  - title: Transactional batch operations in Azure Cosmos DB using the .NET or Java SDK
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/transactional-batch
  - title: Bulk Import Data for NoSQL Account by Using the .NET SDK - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/tutorial-dotnet-bulk-import
