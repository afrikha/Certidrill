id: dp420-1a-ru-operation-costs-hot
objective: "1.1.2"
type: hotarea
difficulty: 3
status: draft
stem:
  en: |
    Fabrikam uses an Azure Cosmos DB for NoSQL container with the default indexing policy. Each item is about 1 KB. The following table lists operations that an application performs on a single item. The consistency column shows the level that applies to each operation.

    Answer each prompt by selecting the appropriate operation.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam utilise un conteneur Azure Cosmos DB for NoSQL avec la stratégie d'indexation par défaut. Chaque élément fait environ 1 Ko. Le tableau suivant répertorie des opérations qu'une application effectue sur un seul élément. La colonne de cohérence indique le niveau qui s'applique à chaque opération.

    Répondez à chaque consigne en sélectionnant l'opération appropriée.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The operation with the lowest RU charge", fr: "L'opération dont la charge en RU est la plus faible" }
    - id: p2
      text: { en: "The operation with the highest RU charge", fr: "L'opération dont la charge en RU est la plus élevée" }
  grid:
    header: [{ en: "Operation", fr: "Opération" }, { en: "Method", fr: "Méthode" }, { en: "Consistency", fr: "Cohérence" }]
    rows:
      - [{ text: { en: "Read the item by id and partition key", fr: "Lire l'élément par id et clé de partition" }, area: pr_session }, { text: ReadItemAsync }, { text: Session }]
      - [{ text: { en: "Read the item by id and partition key", fr: "Lire l'élément par id et clé de partition" }, area: pr_strong }, { text: ReadItemAsync }, { text: Strong }]
      - [{ text: { en: "Query the item with a filter on id, in its partition", fr: "Interroger l'élément avec un filtre sur id, dans sa partition" }, area: query }, { text: GetItemQueryIterator }, { text: Session }]
      - [{ text: { en: "Insert a new item", fr: "Insérer un nouvel élément" }, area: insert }, { text: CreateItemAsync }, { text: Session }]
      - [{ text: { en: "Replace the existing item", fr: "Remplacer l'élément existant" }, area: replace }, { text: ReplaceItemAsync }, { text: Session }]
answer:
  values: { p1: pr_session, p2: replace }
explanation:
  correct:
    en: |
      A point read of a 1-KB item costs about 1 RU at Session; the same read at Strong costs about twice as much, and a query costs more than a point read. Inserting a 1-KB item costs about 5.5 RUs even without indexing, and replacing an item costs about twice the charge of inserting it, which makes the replace the most expensive operation.
    fr: |
      Une lecture ponctuelle d'un élément de 1 Ko coûte environ 1 RU en Session ; la même lecture en Strong coûte environ deux fois plus, et une requête coûte plus qu'une lecture ponctuelle. Insérer un élément de 1 Ko coûte environ 5,5 RU même sans indexation, et remplacer un élément coûte environ deux fois la charge de son insertion : le remplacement est donc l'opération la plus coûteuse.
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
