id: dp420-1e-kit-review-hotarea
objective: "1.5.1"
type: hotarea
difficulty: 2
status: draft
stem:
  en: |
    Adatum has an ASP.NET Core minimal API that reads customers from an Azure Cosmos DB for NoSQL container. You ask your AI coding assistant, which has the Azure Cosmos DB Agent Kit installed, to review the endpoint shown in the following table. The endpoint receives about 2,000 requests per minute.

    Answer each prompt by selecting the line that the review should flag.

    NOTE: Each correct selection is worth one point.
  fr: |
    Adatum dispose d'une API minimale ASP.NET Core qui lit des clients dans un conteneur Azure Cosmos DB for NoSQL. Vous demandez à votre assistant de codage IA, sur lequel Azure Cosmos DB Agent Kit est installé, de réviser le point de terminaison présenté dans le tableau suivant. Le point de terminaison reçoit environ 2 000 requêtes par minute.

    Répondez à chaque consigne en sélectionnant la ligne que la révision doit signaler.

    Remarque : chaque sélection correcte vaut un point.
body:
  prompts:
    - id: p1
      text: { en: "The line that prevents efficient connection management and address caching", fr: "La ligne qui empêche une gestion efficace des connexions et la mise en cache des adresses" }
    - id: p2
      text: { en: "The line that lets a crafted email value change the query", fr: "La ligne qui permet à une valeur d'e-mail forgée de modifier la requête" }
  grid:
    header: [{ en: Line, fr: Ligne }, Code]
    rows:
      - [{ text: "1" }, { text: 'app.MapGet("/customers/{email}", async (string email) => {', area: l1 }]
      - [{ text: "2" }, { text: 'var client = new CosmosClient(endpoint, new DefaultAzureCredential());', area: l2 }]
      - [{ text: "3" }, { text: 'var container = client.GetContainer("crm", "customers");', area: l3 }]
      - [{ text: "4" }, { text: 'var sql = $"SELECT * FROM c WHERE c.email = ''{email}''";', area: l4 }]
      - [{ text: "5" }, { text: 'var iterator = container.GetItemQueryIterator<Customer>(sql);', area: l5 }]
      - [{ text: "6" }, { text: 'var page = await iterator.ReadNextAsync();', area: l6 }]
      - [{ text: "7" }, { text: 'return Results.Ok(page.Resource); });', area: l7 }]
answer:
  values: { p1: l2, p2: l4 }
explanation:
  correct:
    en: |
      Line 2 creates a CosmosClient on every request. A CosmosClient is thread-safe and should be a single instance for the lifetime of the application, for each account, so that it can manage connections and cache addresses. Line 4 concatenates the user input into the query text; the recommended fix is a parameterized QueryDefinition with WithParameter.
    fr: |
      La ligne 2 crée un CosmosClient à chaque requête. Un CosmosClient est thread-safe et doit être une instance unique pendant toute la durée de vie de l'application, pour chaque compte, afin de gérer les connexions et de mettre les adresses en cache. La ligne 4 concatène l'entrée de l'utilisateur dans le texte de la requête ; la correction recommandée est une QueryDefinition paramétrée avec WithParameter.
  options:
    l3:
      en: |
        GetContainer only returns a proxy object without a network call; it is cheap to call.
      fr: |
        GetContainer renvoie seulement un objet proxy sans appel réseau ; son appel est peu coûteux.
    l5:
      en: |
        Line 5 runs the query, but the injection risk comes from how line 4 builds the query text.
      fr: |
        La ligne 5 exécute la requête, mais le risque d'injection vient de la façon dont la ligne 4 construit le texte de la requête.
references:
  - title: Performance Tips for .NET SDK V3 - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/performance-tips-dotnet-sdk-v3
  - title: Use the Azure Cosmos DB Agent Kit - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/gen-ai/agent-kit/usage
