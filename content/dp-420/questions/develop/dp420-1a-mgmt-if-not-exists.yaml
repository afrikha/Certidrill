id: dp420-1a-mgmt-if-not-exists
objective: "1.1.5"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL container named **orders** with 400 RU/s of dedicated manual throughput. A Python service starts with the following code:

    ```python
    container = database.create_container_if_not_exists(
        id="orders",
        partition_key=PartitionKey(path="/customerId"),
        offer_throughput=1000,
    )
    ```

    The service starts successfully. You need to determine the throughput of the **orders** container after the call.

    What is the throughput of the container?
  fr: |
    Contoso dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **orders** avec un débit manuel dédié de 400 RU/s. Un service Python démarre avec le code suivant :

    ```python
    container = database.create_container_if_not_exists(
        id="orders",
        partition_key=PartitionKey(path="/customerId"),
        offer_throughput=1000,
    )
    ```

    Le service démarre correctement. Vous devez déterminer le débit du conteneur **orders** après l'appel.

    Quel est le débit du conteneur ?
body:
  options:
    - { id: a, text: { en: "1,000 RU/s, because the call updates the throughput of the existing container", fr: "1 000 RU/s, car l'appel met à jour le débit du conteneur existant" } }
    - { id: b, text: { en: "1,400 RU/s, because the call adds its throughput to the existing value", fr: "1 400 RU/s, car l'appel ajoute son débit à la valeur existante" } }
    - { id: c, text: { en: "1,000 RU/s, because the container is deleted and created again", fr: "1 000 RU/s, car le conteneur est supprimé puis recréé" } }
    - { id: d, text: { en: "400 RU/s, because the existing container's settings aren't changed", fr: "400 RU/s, car les paramètres du conteneur existant ne sont pas modifiés" } }
answer: { optionId: d }
explanation:
  correct:
    en: |
      When the container already exists, `create_container_if_not_exists` returns the existing container; it doesn't check or update its settings or throughput, even if they differ from the arguments. To change the throughput, call `replace_throughput` on the container.
    fr: |
      Lorsque le conteneur existe déjà, `create_container_if_not_exists` renvoie le conteneur existant ; il ne vérifie ni ne met à jour ses paramètres ou son débit, même s'ils diffèrent des arguments. Pour modifier le débit, appelez `replace_throughput` sur le conteneur.
  options:
    a: { en: "The method doesn't update the settings or the offer throughput of an existing container.", fr: "La méthode ne met pas à jour les paramètres ni le débit d'un conteneur existant." }
    b: { en: "Throughput values are never added together; the existing value is kept.", fr: "Les valeurs de débit ne s'additionnent jamais ; la valeur existante est conservée." }
    c: { en: "The method never deletes a container; it only creates it when it doesn't exist.", fr: "La méthode ne supprime jamais de conteneur ; elle le crée uniquement s'il n'existe pas." }
references:
  - title: azure.cosmos.database.DatabaseProxy class
    url: https://learn.microsoft.com/en-us/python/api/azure-cosmos/azure.cosmos.database.databaseproxy
