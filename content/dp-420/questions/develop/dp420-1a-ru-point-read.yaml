id: dp420-1a-ru-point-read
objective: "1.1.2"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Contoso stores customer profiles of about 1 KB in an Azure Cosmos DB for NoSQL container partitioned on `/customerId`. The profile's `id` is also the customer ID. A .NET API loads one profile per request by running the following query with the partition key set in the query options:

    `SELECT * FROM c WHERE c.id = @id`

    The API handles 2,000 requests per second. You need to minimize the RU charge of each lookup.

    What should you do?
  fr: |
    Contoso stocke des profils clients d'environ 1 Ko dans un conteneur Azure Cosmos DB for NoSQL partitionné sur `/customerId`. L'`id` du profil est aussi l'ID du client. Une API .NET charge un profil par requête en exécutant la requête suivante, avec la clé de partition définie dans les options de requête :

    `SELECT * FROM c WHERE c.id = @id`

    L'API traite 2 000 requêtes par seconde. Vous devez réduire au minimum la charge en RU de chaque recherche.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set MaxItemCount to 1 in the QueryRequestOptions of the query.", fr: "Définir MaxItemCount sur 1 dans les QueryRequestOptions de la requête." } }
    - { id: b, text: { en: "Replace the query with a ReadItemAsync call that passes the id and the partition key.", fr: "Remplacer la requête par un appel ReadItemAsync qui transmet l'id et la clé de partition." } }
    - { id: c, text: { en: "Add a composite index on /id and /customerId to the indexing policy.", fr: "Ajouter un index composite sur /id et /customerId à la stratégie d'indexation." } }
    - { id: d, text: { en: "Change the query to SELECT TOP 1 * FROM c WHERE c.id = @id.", fr: "Remplacer la requête par SELECT TOP 1 * FROM c WHERE c.id = @id." } }
answer: { optionId: b }
explanation:
  correct:
    en: |
      A point read by id and partition key is the cheapest read operation: about 1 RU for a 1-KB item. A query that filters on the id, even within one partition, isn't a point read and has a higher charge because of query processing.
    fr: |
      Une lecture ponctuelle par id et clé de partition est l'opération de lecture la moins coûteuse : environ 1 RU pour un élément de 1 Ko. Une requête qui filtre sur l'id, même dans une seule partition, n'est pas une lecture ponctuelle et sa charge est plus élevée en raison du traitement de la requête.
  options:
    c: { en: "Composite indexes serve ORDER BY and multi-property filters; the query would still be a query, not a point read.", fr: "Les index composites servent ORDER BY et les filtres sur plusieurs propriétés ; l'opération resterait une requête, pas une lecture ponctuelle." }
    d: { en: "TOP 1 doesn't change the processing of a filter that already returns a single item.", fr: "TOP 1 ne change pas le traitement d'un filtre qui renvoie déjà un seul élément." }
    a: { en: "MaxItemCount only limits the page size; the query still costs more than a point read.", fr: "MaxItemCount limite uniquement la taille de page ; la requête coûte toujours plus qu'une lecture ponctuelle." }
references:
  - title: Optimize request cost in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/optimize-cost-reads-writes
