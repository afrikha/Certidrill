id: dp420-1b-param-injection
objective: "1.2.1"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Proseware adds a search box to an e-commerce site. A .NET service receives the text typed by the user and searches the **products** container in Azure Cosmos DB for NoSQL for items whose `name` equals that text.

    A security review requires that user input can never change the structure of the query.

    What should you do?
  fr: |
    Proseware ajoute une zone de recherche à un site de commerce en ligne. Un service .NET reçoit le texte saisi par l'utilisateur et recherche dans le conteneur **products** d'Azure Cosmos DB for NoSQL les éléments dont la propriété `name` est égale à ce texte.

    Une revue de sécurité exige que la saisie de l'utilisateur ne puisse jamais modifier la structure de la requête.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Set EnableScanInQuery to true in QueryRequestOptions so that the filter is evaluated without the query parser.", fr: "Définir EnableScanInQuery sur true dans QueryRequestOptions pour que le filtre soit évalué sans l'analyseur de requêtes." } }
    - { id: b, text: { en: "Build a QueryDefinition with a @name placeholder and supply the text with WithParameter.", fr: "Créer une QueryDefinition avec un espace réservé @name et fournir le texte avec WithParameter." } }
    - { id: c, text: { en: "Build the query string by interpolation and replace every single quote in the text with two quotes.", fr: "Construire la chaîne de requête par interpolation et remplacer chaque apostrophe du texte par deux apostrophes." } }
    - { id: d, text: { en: "Pass the text in QueryRequestOptions.PartitionKey so that the SDK escapes it before running the query.", fr: "Passer le texte dans QueryRequestOptions.PartitionKey pour que le SDK l'échappe avant d'exécuter la requête." } }
answer: { optionId: b }
explanation:
  correct:
    en: "A parameterized query keeps the query text fixed and sends user input as parameter values, which prevents most SQL injection attacks. In the .NET SDK, you create a QueryDefinition with placeholders such as @name and add values with WithParameter."
    fr: "Une requête paramétrée conserve un texte de requête fixe et envoie la saisie utilisateur sous forme de valeurs de paramètres, ce qui empêche la plupart des attaques par injection SQL. Dans le SDK .NET, vous créez une QueryDefinition avec des espaces réservés comme @name et ajoutez les valeurs avec WithParameter."
  options:
    c: { en: "Manual escaping is fragile and still mixes user input with the query text.", fr: "L'échappement manuel est fragile et mélange toujours la saisie utilisateur avec le texte de la requête." }
    d: { en: "The partition key option scopes the query to a logical partition; it does not escape anything and name is not the partition key.", fr: "L'option de clé de partition limite la requête à une partition logique ; elle n'échappe rien et name n'est pas la clé de partition." }
    a: { en: "EnableScanInQuery allows scans when no index serves a filter; it has nothing to do with injection.", fr: "EnableScanInQuery autorise les analyses quand aucun index ne sert un filtre ; il n'a aucun rapport avec l'injection." }
references:
  - title: Query Items Using .NET - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/nosql/how-to-dotnet-query-items
