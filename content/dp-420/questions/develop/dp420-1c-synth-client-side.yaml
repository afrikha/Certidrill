id: dp420-1c-synth-client-side
objective: "1.3.6"
type: single
difficulty: 1
status: draft
stem:
  en: |
    Adatum decides to partition a new Azure Cosmos DB for NoSQL container by a synthetic key stored in a `partitionKey` property, built from the `deviceId` and `date` properties of each item. Thousands of items are written every minute.

    How should the value of `partitionKey` be set?
  fr: |
    Adatum décide de partitionner un nouveau conteneur Azure Cosmos DB for NoSQL par une clé synthétique stockée dans une propriété `partitionKey`, construite à partir des propriétés `deviceId` et `date` de chaque élément. Des milliers d'éléments sont écrits chaque minute.

    Comment la valeur de `partitionKey` doit-elle être définie ?
body:
  options:
    - { id: a, text: { en: "By defining the partition key path of the container as /deviceId+/date", fr: "En définissant le chemin de clé de partition du conteneur sur /deviceId+/date" } }
    - { id: b, text: { en: "By application code that computes the value and adds it to each item before it is written", fr: "Par du code applicatif qui calcule la valeur et l'ajoute à chaque élément avant son écriture" } }
    - { id: c, text: { en: "By a composite index on deviceId and date in the indexing policy", fr: "Par un index composite sur deviceId et date dans la stratégie d'indexation" } }
    - { id: d, text: { en: "By a unique key policy on /deviceId and /date", fr: "Par une stratégie de clé unique sur /deviceId et /date" } }
answer: { optionId: b }
explanation:
  correct:
    en: |-
      A synthetic partition key is an ordinary property that the application fills in. For real workloads, client-side logic concatenates the values and inserts the synthetic key into each item before it is created or upserted.
    fr: |-
      Une clé de partition synthétique est une propriété ordinaire que l'application renseigne. Pour une charge de travail réelle, une logique côté client concatène les valeurs et insère la clé synthétique dans chaque élément avant sa création ou son upsert.
  options:
    a: { en: "A partition key path names one property; it does not combine values with an expression.", fr: "Un chemin de clé de partition désigne une propriété ; il ne combine pas des valeurs par une expression." }
    c: { en: "A composite index speeds up queries that filter or sort on several properties; it does not create a property.", fr: "Un index composite accélère les requêtes qui filtrent ou trient sur plusieurs propriétés ; il ne crée pas de propriété." }
    d: { en: "A unique key policy enforces uniqueness within a logical partition; it does not set the partition key.", fr: "Une stratégie de clé unique impose l'unicité dans une partition logique ; elle ne définit pas la clé de partition." }
references:
  - title: Create a synthetic partition key
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/synthetic-partition-keys
