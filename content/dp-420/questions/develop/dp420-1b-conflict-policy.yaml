id: dp420-1b-conflict-policy
objective: "1.2.6"
type: multi
difficulty: 3
status: draft
stem:
  en: |
    Litware's Azure Cosmos DB for NoSQL account uses multi-region writes in three regions. Users in different regions can update or delete the same item of the **profiles** container at the same time.

    Which two statements about conflict resolution are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Le compte Azure Cosmos DB for NoSQL de Litware utilise les écritures multirégions dans trois régions. Des utilisateurs de régions différentes peuvent mettre à jour ou supprimer en même temps le même élément du conteneur **profiles**.

    Quelles sont les deux affirmations vraies sur la résolution des conflits ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "With a custom policy and no merge stored procedure registered, conflicting writes are discarded.", fr: "Avec une stratégie personnalisée et sans procédure stockée de fusion inscrite, les écritures en conflit sont abandonnées." } }
    - { id: b, text: { en: "With the default policy, the version with the highest _ts value wins.", fr: "Avec la stratégie par défaut, la version qui a la valeur _ts la plus élevée l'emporte." } }
    - { id: c, text: { en: "A custom conflict resolution policy can be set only when the container is created.", fr: "Une stratégie de résolution des conflits personnalisée ne peut être définie qu'à la création du conteneur." } }
    - { id: d, text: { en: "A Last Write Wins policy can use a custom string property as its conflict resolution path.", fr: "Une stratégie Last Write Wins peut utiliser une propriété personnalisée de type chaîne comme chemin de résolution des conflits." } }
    - { id: e, text: { en: "When a delete conflicts with a replace, the replace wins if its conflict resolution path value is higher.", fr: "Quand une suppression entre en conflit avec un remplacement, le remplacement l'emporte si sa valeur de chemin de résolution des conflits est plus élevée." } }
answer: { optionIds: [ b, c ] }
explanation:
  correct:
    en: "Last Write Wins is the default policy and uses the system _ts timestamp, so the highest value wins. A custom resolution policy can be set only at container creation, not on an existing container."
    fr: "Last Write Wins est la stratégie par défaut et utilise l'horodatage système _ts : la valeur la plus élevée l'emporte. Une stratégie de résolution personnalisée ne peut être définie qu'à la création du conteneur, pas sur un conteneur existant."
  options:
    d: { en: "A custom conflict resolution path must be a numeric property.", fr: "Un chemin de résolution des conflits personnalisé doit être une propriété numérique." }
    e: { en: "A delete always wins over insert or replace conflicts, whatever the path value.", fr: "Une suppression l'emporte toujours sur les conflits d'insertion ou de remplacement, quelle que soit la valeur du chemin." }
    a: { en: "Unresolved conflicts are written to the conflicts feed, where the application must resolve them.", fr: "Les conflits non résolus sont écrits dans le flux des conflits, où l'application doit les résoudre." }
references:
  - title: Conflict Resolution Types and Resolution Policies - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/conflict-resolution-policies
