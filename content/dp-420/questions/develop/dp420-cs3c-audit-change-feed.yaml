id: dp420-cs3c-audit-change-feed
objective: "1.4.4"
type: single
caseStudy: dp420-cs3c-humongous-insurance
difficulty: 3
status: draft
stem:
  en: |
    You need to configure the Standard accounts and the audit service to meet the audit requirements.

    What should you do?
  fr: |
    Vous devez configurer les comptes Standard et le service d'audit pour satisfaire les exigences d'audit.

    Que devez-vous faire ?
body:
  options:
    - id: a
      text:
        en: "Migrate the accounts to the continuous 7-day backup tier, and read the change feed in all versions and deletes mode."
        fr: "Migrer les comptes vers le niveau de sauvegarde continue de 7 jours, et lire le flux de modification en mode toutes les versions et suppressions."
    - id: b
      text:
        en: "Keep periodic backup mode, and read the change feed in latest version mode after replacing deletes with a `deleted` flag and a TTL."
        fr: "Conserver le mode de sauvegarde périodique, et lire le flux de modification en mode version la plus récente après avoir remplacé les suppressions par un indicateur `deleted` et une durée de vie (TTL)."
    - id: c
      text:
        en: "Migrate the accounts to the continuous 30-day backup tier, and read the change feed in all versions and deletes mode."
        fr: "Migrer les comptes vers le niveau de sauvegarde continue de 30 jours, et lire le flux de modification en mode toutes les versions et suppressions."
    - id: d
      text:
        en: "Migrate the accounts to the continuous 30-day backup tier, and read the change feed in latest version mode from the beginning."
        fr: "Migrer les comptes vers le niveau de sauvegarde continue de 30 jours, et lire le flux de modification en mode version la plus récente depuis le début."
answer: { optionId: c }
explanation:
  correct:
    en: "Only all versions and deletes mode records every create, update and delete, including intermediate updates between two reads. This mode requires continuous backup, and changes can be read only within the continuous backup period. With the 7-day tier, the changes made during a 21-day freeze would no longer be readable when the service restarts, so the 30-day tier is the cheapest tier that keeps them."
    fr: "Seul le mode toutes les versions et suppressions enregistre chaque création, mise à jour et suppression, y compris les mises à jour intermédiaires entre deux lectures. Ce mode nécessite la sauvegarde continue, et les modifications ne peuvent être lues que pendant la période de sauvegarde continue. Avec le niveau de 7 jours, les modifications effectuées pendant un gel de 21 jours ne seraient plus lisibles au redémarrage du service : le niveau de 30 jours est donc le moins coûteux qui les conserve."
  options:
    a:
      en: "The 7-day tier has no backup storage charge, but changes older than the 7-day backup period cannot be read in all versions and deletes mode, so a 21-day stop loses changes."
      fr: "Le niveau de 7 jours n'entraîne pas de frais de stockage de sauvegarde, mais les modifications antérieures à la période de sauvegarde de 7 jours ne peuvent pas être lues en mode toutes les versions et suppressions : un arrêt de 21 jours fait perdre des modifications."
    b:
      en: "The soft-delete workaround captures deletes as updates, but latest version mode does not guarantee intermediate updates of an item between two reads."
      fr: "Le contournement par suppression réversible capture les suppressions comme des mises à jour, mais le mode version la plus récente ne garantit pas les mises à jour intermédiaires d'un élément entre deux lectures."
    d:
      en: "Latest version mode does not capture deletes and may skip intermediate updates, whatever the starting point or backup tier."
      fr: "Le mode version la plus récente ne capture pas les suppressions et peut ignorer des mises à jour intermédiaires, quels que soient le point de départ ou le niveau de sauvegarde."
references:
