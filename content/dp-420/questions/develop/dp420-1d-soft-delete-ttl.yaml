id: dp420-1d-soft-delete-ttl
objective: "1.4.1"
type: single
difficulty: 2
status: draft
stem:
  en: |
    Tailspin uses a change feed processor in latest version mode to replicate an Azure Cosmos DB for NoSQL container named **catalog** to an external search service. Products deleted from the container must also be removed from the search service.

    The account uses periodic backup, and the company does not allow continuous backup on this account.

    You need to make deletions visible to the processor.

    What should you do?
  fr: |
    Tailspin utilise un processeur de flux de modification en mode dernière version pour répliquer un conteneur Azure Cosmos DB for NoSQL nommé **catalog** vers un service de recherche externe. Les produits supprimés du conteneur doivent aussi être supprimés du service de recherche.

    Le compte utilise la sauvegarde périodique, et l'entreprise n'autorise pas la sauvegarde continue sur ce compte.

    Vous devez rendre les suppressions visibles pour le processeur.

    Que devez-vous faire ?
body:
  options:
    - { id: a, text: { en: "Replace each delete with an update that sets a deleted property to true and a ttl value on the item.", fr: "Remplacer chaque suppression par une mise à jour qui définit une propriété deleted à true et une valeur ttl sur l'élément." } }
    - { id: b, text: { en: "Rebuild the processor with GetChangeFeedProcessorBuilderWithAllVersionsAndDeletes.", fr: "Reconstruire le processeur avec GetChangeFeedProcessorBuilderWithAllVersionsAndDeletes." } }
    - { id: c, text: { en: "Restart the processor with WithStartTime(DateTime.MinValue.ToUniversalTime()) every night.", fr: "Redémarrer le processeur avec WithStartTime(DateTime.MinValue.ToUniversalTime()) chaque nuit." } }
    - { id: d, text: { en: "Set a default time to live on the lease container.", fr: "Définir une durée de vie par défaut sur le conteneur de bail." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Latest version mode does not record deletes. A soft-delete flag is an update, so it appears in the change feed and the processor can remove the product from the search service; the TTL then purges the item from the container automatically.
    fr: |
      Le mode dernière version n'enregistre pas les suppressions. Un indicateur de suppression logique est une mise à jour : il apparaît dans le flux de modification et le processeur peut supprimer le produit du service de recherche ; la durée de vie (TTL) purge ensuite automatiquement l'élément du conteneur.
  options:
    b: { en: "All versions and deletes mode requires continuous backup, which is not allowed here.", fr: "Le mode toutes les versions et suppressions nécessite la sauvegarde continue, qui n'est pas autorisée ici." }
    c: { en: "Start options apply only when the lease container is first initialized, and deleted items are no longer in the feed anyway.", fr: "Les options de démarrage ne s'appliquent qu'à la première initialisation du conteneur de bail, et les éléments supprimés ne figurent de toute façon plus dans le flux." }
    d: { en: "TTL on the lease container would delete the processor's state, not expose deletions of the monitored container.", fr: "Une durée de vie sur le conteneur de bail supprimerait l'état du processeur, sans exposer les suppressions du conteneur surveillé." }
references:
  - title: Change Feed Modes - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-modes
