id: dp420-1d-processor-region
objective: "1.4.1"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL account named **contoso** with regions in East US 2 and West US 2. A change feed processor runs on virtual machines in West US 2 and must read the change feed from West US 2.

    Later, the operations team might move the processor to East US 2. After the move, the processor must continue from its saved state instead of creating new leases.

    How should you configure the CosmosClient used for the monitored and lease containers?
  fr: |
    Contoso dispose d'un compte Azure Cosmos DB for NoSQL nommé **contoso** avec des régions East US 2 et West US 2. Un processeur de flux de modification s'exécute sur des machines virtuelles de West US 2 et doit lire le flux de modification depuis West US 2.

    Plus tard, l'équipe d'exploitation pourrait déplacer le processeur vers East US 2. Après le déplacement, le processeur doit reprendre à partir de son état enregistré au lieu de créer de nouveaux baux.

    Comment devez-vous configurer le CosmosClient utilisé pour les conteneurs surveillé et de bail ?
body:
  options:
    - { id: a, text: { en: "Use the global endpoint https://contoso.documents.azure.com and set ApplicationRegion to West US 2, then to East US 2 after the move.", fr: "Utiliser le point de terminaison global https://contoso.documents.azure.com et définir ApplicationRegion sur West US 2, puis sur East US 2 après le déplacement." } }
    - { id: b, text: { en: "Use the regional endpoint https://contoso-westus2.documents.azure.com and change it to the East US 2 endpoint after the move.", fr: "Utiliser le point de terminaison régional https://contoso-westus2.documents.azure.com et le remplacer par celui d'East US 2 après le déplacement." } }
    - { id: c, text: { en: "Use the global endpoint https://contoso.documents.azure.com and create a separate lease container for each region.", fr: "Utiliser le point de terminaison global https://contoso.documents.azure.com et créer un conteneur de bail distinct pour chaque région." } }
    - { id: d, text: { en: "Use the global endpoint https://contoso.documents.azure.com and change the instance name to include the region after the move.", fr: "Utiliser le point de terminaison global https://contoso.documents.azure.com et modifier le nom d'instance pour y inclure la région après le déplacement." } }
answer: { optionId: a }
explanation:
  correct:
    en: |
      Lease documents are scoped to the endpoint configured in the client, so changing endpoints creates new, independent leases. Keeping the global endpoint and selecting the region with ApplicationRegion or ApplicationPreferredRegions routes the reads to the chosen region while the processor keeps its existing leases.
    fr: |
      Les documents de bail sont liés au point de terminaison configuré dans le client : changer de point de terminaison crée de nouveaux baux indépendants. Conserver le point de terminaison global et choisir la région avec ApplicationRegion ou ApplicationPreferredRegions achemine les lectures vers la région choisie tandis que le processeur conserve ses baux existants.
  options:
    b: { en: "Switching from one regional endpoint to another creates new lease documents, so the processor loses its saved state.", fr: "Passer d'un point de terminaison régional à un autre crée de nouveaux documents de bail : le processeur perd son état enregistré." }
    c: { en: "A new lease container has no saved state, so processing would restart from the configured starting point.", fr: "Un nouveau conteneur de bail n'a aucun état enregistré : le traitement redémarrerait au point de départ configuré." }
    d: { en: "The instance name identifies a compute instance; it does not choose the region that serves the change feed.", fr: "Le nom d'instance identifie une instance de calcul ; il ne choisit pas la région qui sert le flux de modification." }
references:
  - title: Change Feed Processor - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/change-feed-processor
