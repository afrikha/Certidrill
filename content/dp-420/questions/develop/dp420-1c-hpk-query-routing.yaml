id: dp420-1c-hpk-query-routing
objective: "1.3.5"
type: single
difficulty: 3
status: draft
stem:
  en: |
    Contoso has an Azure Cosmos DB for NoSQL container named **sessions** with a hierarchical partition key made of `/tenantId`, `/userId` and `/sessionId`, in that order. The container has 40 physical partitions.

    Which query is sent to all the physical partitions of the container?
  fr: |
    Contoso dispose d'un conteneur Azure Cosmos DB for NoSQL nommé **sessions** avec une clé de partition hiérarchique composée de `/tenantId`, `/userId` et `/sessionId`, dans cet ordre. Le conteneur compte 40 partitions physiques.

    Quelle requête est envoyée à toutes les partitions physiques du conteneur ?
body:
  options:
    - { id: a, text: "SELECT * FROM c WHERE c.tenantId = 'fabrikam'" }
    - { id: b, text: "SELECT * FROM c WHERE c.tenantId = 'fabrikam' AND c.userId = 'u-118'" }
    - { id: c, text: "SELECT * FROM c WHERE c.userId = 'u-118' AND c.sessionId = 's-907'" }
    - { id: d, text: "SELECT * FROM c WHERE c.tenantId = 'fabrikam' AND c.userId = 'u-118' AND c.sessionId = 's-907'" }
answer: { optionId: c }
explanation:
  correct:
    en: |-
      Routing with hierarchical partition keys relies on the leading levels. A query that omits tenantId cannot be mapped to any subset of partitions, so it fans out to all of them, even if it specifies the lower levels.
    fr: |-
      Le routage avec des clés de partition hiérarchiques s'appuie sur les premiers niveaux. Une requête qui omet tenantId ne peut être associée à aucun sous-ensemble de partitions : elle est diffusée vers toutes, même si elle précise les niveaux inférieurs.
  options:
    a: { en: "A filter on the first level is a targeted query, sent only to the partitions that hold that tenant.", fr: "Un filtre sur le premier niveau est une requête ciblée, envoyée uniquement aux partitions qui contiennent ce locataire." }
    b: { en: "A filter on the first two levels is also routed to a subset of the physical partitions.", fr: "Un filtre sur les deux premiers niveaux est lui aussi routé vers un sous-ensemble des partitions physiques." }
    d: { en: "All three levels identify one logical partition, so the query is served by a single physical partition.", fr: "Les trois niveaux identifient une partition logique : la requête est servie par une seule partition physique." }
references:
  - title: Hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys
  - title: Frequently asked questions on hierarchical partition keys in Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/hierarchical-partition-keys-faq
