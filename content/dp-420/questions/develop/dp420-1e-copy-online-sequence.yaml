id: dp420-1e-copy-online-sequence
objective: "1.4.5"
type: ordering
difficulty: 2
status: draft
stem:
  en: |
    Litware has an Azure Cosmos DB for NoSQL account that meets all the prerequisites for online container copy. A container named **profiles** must be moved to a new container named **profiles-v2**, which you have already created with the required unique keys and throughput.

    The application must keep writing to **profiles** until the cutover, and no change made before the cutover may be lost.

    Which five actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.
  fr: |
    Litware dispose d'un compte Azure Cosmos DB for NoSQL qui remplit tous les prérequis de la copie de conteneur en ligne. Un conteneur nommé **profiles** doit être déplacé vers un nouveau conteneur nommé **profiles-v2**, que vous avez déjà créé avec les clés uniques et le débit requis.

    L'application doit continuer d'écrire dans **profiles** jusqu'à la bascule, et aucune modification antérieure à la bascule ne doit être perdue.

    Quelles sont les cinq actions à effectuer dans l'ordre ? Pour répondre, déplacez les actions appropriées de la liste vers la zone de réponse et classez-les dans le bon ordre.
body:
  count: 5
  actions:
    - { id: create, text: { en: "Run az cosmosdb copy create with --mode Online.", fr: "Exécuter az cosmosdb copy create avec --mode Online." } }
    - { id: monitor, text: { en: "Run az cosmosdb copy show until the processed count reaches the total count.", fr: "Exécuter az cosmosdb copy show jusqu'à ce que le nombre traité atteigne le nombre total." } }
    - { id: stop, text: { en: "Stop the writes to profiles, and then wait 5 to 10 minutes.", fr: "Arrêter les écritures dans profiles, puis attendre 5 à 10 minutes." } }
    - { id: complete, text: { en: "Run az cosmosdb copy complete.", fr: "Exécuter az cosmosdb copy complete." } }
    - { id: repoint, text: { en: "Point the application to profiles-v2.", fr: "Faire pointer l'application vers profiles-v2." } }
    - { id: pause, text: { en: "Run az cosmosdb copy pause.", fr: "Exécuter az cosmosdb copy pause." } }
    - { id: delete, text: { en: "Delete the profiles container.", fr: "Supprimer le conteneur profiles." } }
answer:
  sequence: [ create, monitor, stop, complete, repoint ]
explanation:
  correct:
    en: |
      You create the online job, then follow it until the processed count is at least the total count. You then stop updates on the source and wait a few minutes for the last changes to flush, run the completion command, which writes the remaining changes and frees the compute, and finally switch the application to the target container.
    fr: |
      Vous créez la tâche en ligne, puis la suivez jusqu'à ce que le nombre traité soit au moins égal au nombre total. Vous arrêtez ensuite les mises à jour de la source et attendez quelques minutes que les dernières modifications soient transmises, exécutez la commande d'achèvement, qui écrit les modifications restantes et libère le calcul, et faites enfin pointer l'application vers le conteneur cible.
  options:
    pause:
      en: |
        Pausing the job is not part of the cutover; the completion command is what finalizes the copy.
      fr: |
        Suspendre la tâche ne fait pas partie de la bascule ; c'est la commande d'achèvement qui finalise la copie.
    delete:
      en: |
        Deleting the source is not required for the cutover and would remove your rollback option.
      fr: |
        Supprimer la source n'est pas nécessaire à la bascule et supprimerait votre possibilité de retour arrière.
references:
  - title: Create and Manage Intra-account Container Copy Jobs - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-container-copy
