id: dp420-1a-cons-true-statements
objective: "1.1.1"
type: multi
difficulty: 2
status: draft
stem:
  en: |
    Northwind Traders is reviewing the consistency configuration of an Azure Cosmos DB for NoSQL account before a product launch. The account has a single write region and two read regions. The team wants to understand how the consistency level affects cost and behavior.

    Which two statements are true?

    NOTE: Each correct selection is worth one point.
  fr: |
    Northwind Traders examine la configuration de cohérence d'un compte Azure Cosmos DB for NoSQL avant le lancement d'un produit. Le compte possède une seule région d'écriture et deux régions de lecture. L'équipe veut comprendre l'effet du niveau de cohérence sur le coût et le comportement.

    Quelles sont les deux affirmations vraies ?

    Remarque : chaque sélection correcte vaut un point.
body:
  choose: 2
  options:
    - { id: a, text: { en: "A read at Bounded staleness costs about twice the RUs of the same read at Session.", fr: "Une lecture en Bounded staleness coûte environ deux fois plus de RU que la même lecture en Session." } }
    - { id: b, text: { en: "A session token returned for one partition is valid for reads on every partition of the container.", fr: "Un jeton de session renvoyé pour une partition est valide pour les lectures sur toutes les partitions du conteneur." } }
    - { id: c, text: { en: "Consistent prefix guarantees that a client always reads its own writes.", fr: "Consistent prefix garantit qu'un client lit toujours ses propres écritures." } }
    - { id: d, text: { en: "The default consistency level can be set only when the account is created.", fr: "Le niveau de cohérence par défaut ne peut être défini qu'à la création du compte." } }
    - { id: e, text: { en: "A write operation costs the same number of RUs at every consistency level.", fr: "Une opération d'écriture coûte le même nombre de RU à tous les niveaux de cohérence." } }
answer: { optionIds: [ a, e ] }
explanation:
  correct:
    en: The RU cost of a write is identical across consistency levels. Strong and Bounded staleness reads go to two replicas of the four-replica set, so they cost about twice the RUs of Session, Consistent prefix and Eventual reads, which use a single replica.
    fr: |
      Le coût en RU d'une écriture est identique quel que soit le niveau de cohérence. Les lectures Strong et Bounded staleness s'adressent à deux réplicas de l'ensemble de quatre réplicas : elles coûtent environ deux fois plus de RU que les lectures Session, Consistent prefix et Eventual, qui utilisent un seul réplica.
  options:
    b: { en: "Session tokens are partition-bound: a token belongs to one partition only.", fr: "Les jetons de session sont liés à une partition : un jeton appartient à une seule partition." }
    c: { en: "Read-your-writes is a Session guarantee; Consistent prefix only guarantees the order of writes.", fr: "La lecture de ses propres écritures est une garantie de Session ; Consistent prefix garantit uniquement l'ordre des écritures." }
    d: { en: "You can change the account's default consistency level at any time.", fr: "Vous pouvez modifier le niveau de cohérence par défaut du compte à tout moment." }
references:
  - title: Consistency level choices - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/consistency-levels
