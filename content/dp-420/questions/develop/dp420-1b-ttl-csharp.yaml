id: dp420-1b-ttl-csharp
objective: "1.2.5"
type: dropdown
difficulty: 1
status: draft
stem:
  en: |
    Fabrikam creates an Azure Cosmos DB for NoSQL container named **carts** by using the .NET SDK.

    - By default, a cart must be deleted automatically 7 days after it was last modified.
    - The carts of premium customers must never be deleted automatically.

    How should you complete the code? To answer, select the appropriate options in the answer area.

    NOTE: Each correct selection is worth one point.
  fr: |
    Fabrikam crée un conteneur Azure Cosmos DB for NoSQL nommé **carts** avec le SDK .NET.

    - Par défaut, un panier doit être supprimé automatiquement 7 jours après sa dernière modification.
    - Les paniers des clients premium ne doivent jamais être supprimés automatiquement.

    Comment devez-vous compléter le code ? Pour répondre, sélectionnez les options appropriées dans la zone de réponse.

    Remarque : chaque sélection correcte vaut un point.
body:
  layout: code
  language: csharp
  template: |
    ContainerProperties properties = new()
    {
        Id = "carts",
        PartitionKeyPath = "/userId",
        DefaultTimeToLive = [[def]]
    };
    Container carts = await database.CreateContainerAsync(properties);

    // Premium customers only
    await carts.CreateItemAsync(
        new { id = cartId, userId, items, ttl = [[prem]] },
        new PartitionKey(userId));
  slots:
    - id: def
      options:
        - { id: sec, text: 7 * 24 * 60 * 60 }
        - { id: min, text: 7 * 24 * 60 }
        - { id: hours, text: 7 * 24 }
        - { id: minus, text: "-1" }
    - id: prem
      options:
        - { id: minus, text: "-1" }
        - { id: zero, text: "0" }
        - { id: max, text: int.MaxValue }
        - { id: sec, text: 7 * 24 * 60 * 60 }
answer:
  values: { def: sec, prem: minus }
explanation:
  correct:
    en: "TTL values are expressed in seconds, so 7 days is 7 × 24 × 60 × 60 = 604,800 seconds. An item-level ttl of -1 overrides the container default and makes that item never expire."
    fr: "Les valeurs de TTL s'expriment en secondes : 7 jours représentent 7 × 24 × 60 × 60 = 604 800 secondes. Un ttl de -1 au niveau de l'élément remplace la valeur par défaut du conteneur et fait que cet élément n'expire jamais."
  options:
    min: { en: "This value is in minutes; TTL is in seconds, so carts would expire after about 2.8 hours.", fr: "Cette valeur est en minutes ; la TTL est en secondes : les paniers expireraient après environ 2,8 heures." }
    hours: { en: "This value is in hours; TTL is in seconds, so carts would expire after under 3 minutes.", fr: "Cette valeur est en heures ; la TTL est en secondes : les paniers expireraient en moins de 3 minutes." }
    zero: { en: "A ttl must be a nonzero positive number or -1.", fr: "Un ttl doit être un nombre positif non nul ou -1." }
    max: { en: "int.MaxValue (2,147,483,647 seconds) is the maximum TTL: the cart would expire after about 68 years, not never.", fr: "int.MaxValue (2 147 483 647 secondes) est la TTL maximale : le panier expirerait après environ 68 ans, pas jamais." }
references:
  - title: Configure and Manage Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/how-to-time-to-live
  - title: Expire Data With Time to Live - Azure Cosmos DB
    url: https://learn.microsoft.com/en-us/azure/cosmos-db/time-to-live
